# Product charter — Website Security (category: security). Single registry of every quantified policy of this category.
category: security
display_name: Website Security
binding:
  holding_table: security_holdings
  event_tables:
  - security_charges
  - security_events
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - pending_setup
  - active
  - cancel_pending
  - expired
  - cancelled
  transitions:
  - from: pending_setup
    to: active
    by: system
    means: Scanning starts on the site and, on firewall tiers, the site's DNS points through the firewall.
  - from: pending_setup
    to: cancelled
    by: user
    means: The customer cancels before setup completes.
  - from: active
    to: cancel_pending
    by: user
    means: The customer cancels effective at the end of the paid term.
  - from: cancel_pending
    to: active
    by: agent
    means: The customer withdraws a scheduled cancellation.
  - from: cancel_pending
    to: cancelled
    by: system
    means: The term ends and the scheduled cancellation takes effect.
  - from: active
    to: expired
    by: system
    means: The term ends with the renewal unpaid; protection stops.
  - from: expired
    to: active
    by: agent
    means: An expired plan is renewed inside its grace days.
  - from: expired
    to: cancelled
    by: system
    means: The grace days lapse unrenewed.
  - from: active
    to: cancelled
    by: user
    means: The customer cancels with immediate effect.
accounts:
- key: security_billed
  unit: USD
  meaning: 'Net amount billed for one website security plan: purchase, renewal, upgrade and extra cleanup charges
    add to it; refunds take away from it.'
parameter_schema:
  price_annual: Price per site for a 12-month term, USD
  price_monthly: Price per site for a 1-month term, USD
  billing_terms: Billing terms offered, list of months
  hosted_site_discount_pct: Percent off the term price when the protected site is on a live Harborline hosting plan
  not_sold_with_included_scan: Whether the tier is withheld from a site whose Harborline hosting plan already includes
    daily malware scanning, boolean
  pages_scanned: Pages scanned per scan
  scan_interval_hours: Elapsed hours between malware scans
  file_change_monitoring: Whether file change monitoring is included, boolean
  auto_malware_removal: Whether detected known malware is removed automatically, boolean
  included_cleanups_per_year: Expert manual cleanups included per subscription year
  extra_cleanup_fee: Fee per expert manual cleanup beyond those included, USD
  cleanup_response_hours: Elapsed hours targeted from a cleanup request to work starting
  reinfection_guarantee_days: Calendar days after a completed cleanup during which a re-infection is cleaned free
    and not counted
  waf_included: Whether the web application firewall is included, boolean
  cdn_included: Whether the content delivery network is included, boolean
  cdn_bandwidth_tb: CDN transfer included per month, TB (0 where none)
  ddos_layer7: Whether application-layer DDoS mitigation is included, boolean
  bot_protection: Whether bad-bot blocking is included, boolean
  virtual_patching: Whether known CMS vulnerabilities are blocked at the firewall, boolean
  blacklist_monitoring: Whether search-engine and spam blacklist monitoring is included, boolean
  blacklist_removal_assistance: Whether Harborline files blacklist removal requests after cleanup, boolean
  backup_storage_gb: Website backup storage included, GB
  backup_frequency: 'Website backup frequency: none or daily'
  backup_retention_days: Days website backups are kept (0 where none)
  pci_asv_scan: Whether quarterly PCI DSS external vulnerability scans by an approved scanning vendor are included,
    boolean
  pci_scan_interval_days: Days between PCI scans (0 where none)
  ssl_monitoring: Whether certificate expiry and configuration are monitored, boolean
  uptime_monitoring_minutes: Minutes between uptime checks (0 where none)
  report_frequency: 'Security report frequency: monthly or weekly'
  sites_covered: Sites covered by one plan
  money_back_days: Calendar days after the opening date within which an immediate cancellation of a 12-month plan
    is refunded
  money_back_min_term_months: Shortest term covered by the money-back guarantee, months
  money_back_excludes_used_cleanup: Whether a plan that has had an expert manual cleanup loses the money-back guarantee,
    boolean
  monthly_refundable: Whether a 1-month term charge is ever refunded, boolean
  auto_renew_default_on: Whether auto-renew is on by default, boolean
  auto_renew_days_before_term_end: Days before the term end on which the renewal is charged
  expired_grace_days: Calendar days after an unpaid term end during which the plan can be renewed
  upgrade_targets: Tiers the plan may move up to mid-term, list
  upgrade_proration_basis: 'How an upgrade is billed: remaining_days_of_term'
  downgrade_at_renewal_only: Whether a move down takes effect only at renewal, boolean
  cleanup_year_basis: 'How included cleanups are counted: per subscription year starting on the opening date and
    each anniversary'
  waf_setup_requires_dns_change: Whether activation waits for the site's DNS to point through the firewall, boolean
  setup_reminder_days: Days after the order on which a reminder is sent for an incomplete setup
  priority_support: Whether security tickets use the priority queue, boolean
  dedicated_security_analyst: Whether a named analyst is assigned, boolean
  malware_removal_scope: 'Scope of expert cleanup: files_only or files_and_database'
  account_discount_applies: Whether the account tier's security_discount_pct may apply instead of the hosted-site
    discount when higher, boolean
  price_rounding: 'Rounding of every computed security amount: half_up_to_cent'
