events:
- type: security_order
  target: security_holdings
  mutation: create
  meaning: A customer orders a website security plan for one site.
  grain: One row per plan ordered.
  fields:
    variant_name: Official plan ordered.
    site_domain: Domain of the protected site, lowercase, verbatim.
    hosting_id: Harborline hosting plan the site runs on; null when hosted elsewhere.
    billing_term_months: 1 or 12.
    term_start_date: Order date.
    term_end_date: Order date plus the term in calendar months.
    auto_renew: Initial auto-renew setting.
    opened_date: Order date.
  triggers:
  - event: security:security_purchase_charge
    map:
      charge_type: new_plan
- type: security_activate
  target: security_holdings
  mutation:
    transition:
      from: pending_setup
      to: active
  meaning: Setup completes and protection starts.
  grain: One row per transaction.
  fields:
    activated_date: Date protection started.
  triggers: []
- type: security_setup_cancel
  target: security_holdings
  mutation:
    transition:
      from: pending_setup
      to: cancelled
  meaning: The customer cancels before setup completes.
  grain: One row per transaction.
  fields:
    closed_date: Cancellation date.
  triggers:
  - event: security:security_refund
    map:
      charge_type: new_plan
- type: security_cancel_schedule
  target: security_holdings
  mutation:
    transition:
      from: active
      to: cancel_pending
  meaning: The customer cancels effective at term end.
  grain: One row per transaction.
  fields:
    auto_renew: Set to false.
  triggers: []
- type: security_cancel_withdraw
  target: security_holdings
  mutation:
    transition:
      from: cancel_pending
      to: active
  meaning: A scheduled cancellation is withdrawn.
  grain: One row per transaction.
  fields:
    auto_renew: Set to true.
  triggers: []
- type: security_cancel_effective
  target: security_holdings
  mutation:
    transition:
    - from: cancel_pending
      to: cancelled
    - from: expired
      to: cancelled
  meaning: The plan ends at term end after a scheduled cancellation, or when the expired grace days lapse.
  grain: One row per transaction.
  fields:
    closed_date: End date.
  triggers: []
- type: security_expire
  target: security_holdings
  mutation:
    transition:
      from: active
      to: expired
  meaning: The term ends with the renewal unpaid.
  grain: One row per transaction.
  fields:
    expired_date: The term end date.
  triggers: []
- type: security_expired_renew
  target: security_holdings
  mutation:
    transition:
      from: expired
      to: active
  meaning: An expired plan is renewed inside its grace days.
  grain: One row per transaction.
  fields:
    expired_date: Cleared to empty.
  triggers: []
- type: security_cancel_immediate
  target: security_holdings
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: The customer cancels with immediate effect.
  grain: One row per transaction.
  fields:
    closed_date: Cancellation date.
  triggers: []
- type: security_plan_change
  target: security_holdings
  mutation: update
  meaning: 'The plan moves to another tier: an upgrade mid-term or a scheduled downgrade at renewal.'
  grain: One row per tier change.
  fields:
    variant_name: New official plan name.
  triggers: []
- type: security_term_renew
  target: security_holdings
  mutation: update
  meaning: A paid renewal starts the next term.
  grain: One row per renewal.
  fields:
    term_start_date: Previous term end date.
    term_end_date: New term start plus the term in calendar months.
    billing_term_months: Renewal term.
  triggers: []
- type: security_settings_update
  target: security_holdings
  mutation: update
  meaning: The customer switches auto-renew or the hosting plan the site runs on changes.
  grain: One row per change.
  fields:
    auto_renew: Auto-renew after the change.
    hosting_id: Harborline hosting plan of the site after the change; null when hosted elsewhere.
  triggers: []
- type: security_purchase_charge
  target: security_charges
  meaning: A new plan's first term is billed.
  grain: One row per plan purchased.
  distinguish_by:
  - charge_date
  - order_ref
  fields:
    charge_type: new_plan.
    amount: Amount billed, USD, positive.
    term_months: Months covered.
    period_start: First day covered.
    period_end: Last day covered.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: security_billed
  direction: in
  triggers:
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: security_renewal_charge
  target: security_charges
  meaning: A renewal term is billed.
  grain: One row per renewal.
  distinguish_by:
  - period_start
  fields:
    charge_type: renewal or auto_renew.
    amount: Amount billed, USD, positive.
    term_months: Months covered.
    period_start: Previous term end.
    period_end: New term end.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: security_billed
  direction: in
  triggers:
  - event: security:security_term_renew
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: security_upgrade_charge
  target: security_charges
  meaning: A mid-term upgrade is billed for the remaining days of the term.
  grain: One row per upgrade.
  distinguish_by:
  - charge_date
  - target_variant
  fields:
    charge_type: upgrade_proration.
    amount: Prorated amount, USD, positive.
    target_variant: Plan upgraded to.
    period_start: Upgrade date.
    period_end: Term end.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: security_billed
  direction: in
  triggers:
  - event: security:security_plan_change
    map:
      variant_name: target_variant
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: security_cleanup_charge
  target: security_charges
  meaning: An expert manual cleanup beyond those included is billed.
  grain: One row per paid cleanup.
  distinguish_by:
  - charge_date
  - order_ref
  fields:
    charge_type: extra_cleanup.
    amount: Amount billed, USD, positive.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: security_billed
  direction: in
  triggers:
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: security_refund
  target: security_charges
  meaning: A security charge is refunded under the money-back guarantee or for a cancellation before setup.
  grain: One row per refunded original charge.
  distinguish_by:
  - original_security_charge_id
  fields:
    original_security_charge_id: Reference of the charge refunded.
    charge_type: Charge type of the refunded charge, copied from it.
    amount: Refunded amount, USD, negative.
    charge_date: Refund date.
    refund_destination: original_payment_method or account_credit.
  account: security_billed
  direction: out
  triggers:
  - event: account:account_credit_refund
    when:
      refund_destination: account_credit
    map:
      customer_id: customer_id
- type: security_scan_result
  target: security_events
  meaning: A malware and blacklist scan of the site completes.
  grain: One row per scan.
  distinguish_by:
  - event_at
  fields:
    event_at: Moment the scan finished.
    scan_result: clean, malware_found or blacklisted.
  triggers: []
- type: security_cleanup
  target: security_events
  meaning: An expert manual cleanup of the site is performed.
  grain: One row per cleanup.
  distinguish_by:
  - event_at
  fields:
    event_at: Moment the cleanup completed.
    cleanup_basis: included, guarantee or paid.
  triggers:
  - event: security:security_cleanup_charge
    when:
      cleanup_basis: paid
    map:
      charge_type: extra_cleanup
- type: security_pci_scan
  target: security_events
  meaning: A quarterly PCI DSS external vulnerability scan completes.
  grain: One row per PCI scan.
  distinguish_by:
  - event_at
  fields:
    event_at: Moment the scan finished.
    scan_result: pass or fail.
  triggers: []
measures:
- id: security_msr_included_cleanups_year
  window: 'The current subscription year: from the latest anniversary of the opening date on or before today, up
    to today.'
  measure: Count of security_cleanup rows of the plan with cleanup_basis included whose event_at falls in the window.
- id: security_msr_cleanups_ever
  window: The whole life of the plan.
  measure: Count of security_cleanup rows of the plan with cleanup_basis included or paid.
policies:
- id: security_agg_multi_holding
  subject:
  - security_order
  rule: A customer may protect any number of sites, one plan per site. A new plan may be ordered for a site domain
    only when no other plan for that site domain is in status pending_setup, active, cancel_pending or expired.
  eligibility:
  - id: one_plan_per_site
    applies_to:
    - security_order
    kind: dedup
    condition: A new plan may be ordered for a site domain only when no other plan for that site domain is in status
      pending_setup, active, cancel_pending or expired.
    evidence_fields:
    - security_holdings.site_domain
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - security_holdings.site_domain
      action_bindings:
        security_holdings.site_domain: site_domain
    dedup_contract:
      table: security_holdings
      mode: separate_record
      object_bindings:
        site_domain: site_domain
      duplicate_filters:
        status:
        - pending_setup
        - active
        - cancel_pending
        - expired
      distinct_fields: []
  params:
    max_per_customer: null
- id: security_agg_cleanup_quota
  subject:
  - security_cleanup
  - security_cleanup_charge
  rule: Included cleanups belong to each plan separately and are never pooled across a customer's plans, and a cleanup
    of one site never draws on another site's plan. A cleanup is included while security_msr_included_cleanups_year
    is below the tier's included_cleanups_per_year, a re-infection within reinfection_guarantee_days of the previous
    completed cleanup is cleaned free and counted as guarantee, and any other cleanup is paid at extra_cleanup_fee.
  eligibility: []
  params:
    per_tier:
      Harborline SiteGuard Essentials:
        included: =included_cleanups_per_year
        fee: =extra_cleanup_fee
      Harborline SiteGuard Plus:
        included: =included_cleanups_per_year
        fee: =extra_cleanup_fee
      Harborline SiteGuard Pro:
        included: =included_cleanups_per_year
        fee: =extra_cleanup_fee
      Harborline SiteGuard Business:
        included: =included_cleanups_per_year
        fee: =extra_cleanup_fee
      Harborline SiteGuard Ecommerce:
        included: =included_cleanups_per_year
        fee: =extra_cleanup_fee
      Harborline SiteGuard Enterprise:
        included: =included_cleanups_per_year
        fee: =extra_cleanup_fee
  measures:
  - security_msr_included_cleanups_year
- id: security_pricing
  subject:
  - security_purchase_charge
  - security_order
  rule: A plan is billed price_annual for a 12-month term or price_monthly for a 1-month term. When the site's hosting_id
    names a Harborline hosting plan that is active, the term price is reduced by hosted_site_discount_pct, and when
    the account tier's security_discount_pct under the account charter is higher, that single percentage applies
    instead; the two never add. A tier whose not_sold_with_included_scan is true may be ordered only for a site
    whose Harborline hosting plan tier does not include daily malware scanning (malware_scan_included in the hosting
    charter). Amounts are rounded half up to the cent, and a plan is billed when ordered, while it is pending setup.
  eligibility:
  - id: billed_pending_setup
    applies_to:
    - security_purchase_charge
    kind: state
    condition: Amounts are rounded half up to the cent, and a plan is billed when ordered, while it is pending setup.
    evidence_fields:
    - security_holdings.security_plan_id
    - security_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - security_holdings.security_plan_id
      action_bindings:
        security_holdings.security_plan_id: security_plan_id
    state_contract:
      field: security_holdings.status
      allowed:
      - pending_setup
  - id: essentials_not_on_scanning_plan
    applies_to:
    - security_order
    kind: authorization
    condition: A tier whose not_sold_with_included_scan is true may be ordered only for a site whose Harborline
      hosting plan tier does not include daily malware scanning (malware_scan_included in the hosting charter).
    evidence_fields:
    - hosting_holdings.variant_name
    - security_holdings.hosting_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - security_holdings.hosting_id
      action_bindings:
        security_holdings.hosting_id: hosting_id
  params:
    discount_pct: the higher of hosted_site_discount_pct (only for a site on an active Harborline hosting plan)
      and the account tier's security_discount_pct
    per_tier:
      Harborline SiteGuard Essentials:
        annual: =price_annual
        monthly: =price_monthly
      Harborline SiteGuard Plus:
        annual: =price_annual
        monthly: =price_monthly
      Harborline SiteGuard Pro:
        annual: =price_annual
        monthly: =price_monthly
      Harborline SiteGuard Business:
        annual: =price_annual
        monthly: =price_monthly
      Harborline SiteGuard Ecommerce:
        annual: =price_annual
        monthly: =price_monthly
      Harborline SiteGuard Enterprise:
        annual: =price_annual
        monthly: =price_monthly
  formula:
    annual_amount: round(price_annual * (100 - discount_pct) / 100, 2)
    monthly_amount: round(price_monthly * (100 - discount_pct) / 100, 2)
- id: security_renewal
  subject:
  - security_renewal_charge
  - security_term_renew
  - security_expired_renew
  rule: A renewal may be charged only while the plan status is active or expired. A renewal is billed at the price
    for the renewal term with the discount basis of security_pricing on the renewal date, and the new term starts
    on the previous term end date. Where auto_renew is true the renewal is charged auto_renew_days_before_term_end
    days before the term end date. An expired plan may be renewed only on or before the expired date plus expired_grace_days
    calendar days. The window adds whole calendar days to the expired date, counting the next day as day 1, and
    the last day is included.
  eligibility:
  - id: renewable
    applies_to:
    - security_renewal_charge
    kind: state
    condition: A renewal may be charged only while the plan status is active or expired.
    evidence_fields:
    - security_holdings.security_plan_id
    - security_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - security_holdings.security_plan_id
      action_bindings:
        security_holdings.security_plan_id: security_plan_id
    state_contract:
      field: security_holdings.status
      allowed:
      - active
      - expired
  - id: expired_grace
    applies_to:
    - security_expired_renew
    kind: time
    condition: An expired plan may be renewed only on or before the expired date plus expired_grace_days calendar
      days.
    evidence_fields:
    - security_holdings.security_plan_id
    - security_holdings.expired_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - security_holdings.security_plan_id
      action_bindings:
        security_holdings.security_plan_id: security_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the expired date
      anchor_source: security_holdings.expired_date
      relation: not_after
      duration_source: variants.expired_grace_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the expired date, counting the next day as day 1, and
        the last day is included.
      boundary: inclusive
- id: security_plan_changes
  subject:
  - security_upgrade_charge
  - security_plan_change
  - security_settings_update
  rule: A plan change may be made only while the plan status is active. An upgrade to one of upgrade_targets takes
    effect at once and is billed as the target's term price minus the current tier's term price for the current
    term length, after the discount basis of security_pricing, times the calendar days from today to the term end
    over the calendar days of the term, rounded half up to the cent. A move down takes effect only at the next renewal
    (downgrade_at_renewal_only), and auto-renew may be switched at any time while the plan is active or cancel_pending.
  eligibility:
  - id: change_active
    applies_to:
    - security_upgrade_charge
    kind: state
    condition: A plan change may be made only while the plan status is active.
    evidence_fields:
    - security_holdings.security_plan_id
    - security_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - security_holdings.security_plan_id
      action_bindings:
        security_holdings.security_plan_id: security_plan_id
    state_contract:
      field: security_holdings.status
      allowed:
      - active
  params:
    price_difference: target term price minus current term price after discount
    remaining_days: calendar days from today to term_end_date
    term_days: calendar days from term_start_date to term_end_date
    per_tier:
      Harborline SiteGuard Essentials:
        targets: =upgrade_targets
      Harborline SiteGuard Plus:
        targets: =upgrade_targets
      Harborline SiteGuard Pro:
        targets: =upgrade_targets
      Harborline SiteGuard Business:
        targets: =upgrade_targets
      Harborline SiteGuard Ecommerce:
        targets: =upgrade_targets
      Harborline SiteGuard Enterprise:
        targets: =upgrade_targets
  formula:
    upgrade_amount: round(price_difference * remaining_days / term_days, 2)
- id: security_cleanups
  subject:
  - security_cleanup
  - security_cleanup_charge
  - security_scan_result
  rule: A cleanup may be performed only while the plan status is active. A re-infection is cleaned under the guarantee
    only on or before the date the previous cleanup completed plus reinfection_guarantee_days calendar days. The
    window adds whole calendar days to the completion date, counting the next day as day 1, and the last day is
    included. Work starts within cleanup_response_hours of the request, covers malware_removal_scope, and on tiers
    with blacklist_removal_assistance Harborline files the blacklist removal requests afterwards. Scans run every
    scan_interval_hours over up to pages_scanned pages, and on tiers with auto_malware_removal known malware found
    by a scan is removed automatically without using a cleanup.
  eligibility:
  - id: cleanup_active
    applies_to:
    - security_cleanup
    - security_cleanup_charge
    kind: state
    condition: A cleanup may be performed only while the plan status is active.
    evidence_fields:
    - security_holdings.security_plan_id
    - security_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - security_holdings.security_plan_id
      action_bindings:
        security_holdings.security_plan_id: security_plan_id
    state_contract:
      field: security_holdings.status
      allowed:
      - active
  - id: guarantee_window
    applies_to:
    - security_cleanup
    kind: time
    condition: A re-infection is cleaned under the guarantee only on or before the date the previous cleanup completed
      plus reinfection_guarantee_days calendar days.
    evidence_fields:
    - security_events.security_event_id
    - security_events.event_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - security_events.security_event_id
      action_bindings:
        security_events.security_event_id: security_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the previous cleanup completed
      anchor_source: security_events.event_at
      relation: not_after
      duration_source: variants.reinfection_guarantee_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the completion date, counting the next day as day 1,
        and the last day is included.
      boundary: inclusive
- id: security_money_back
  subject:
  - security_refund
  - security_cancel_immediate
  - security_cancel_schedule
  - security_cancel_withdraw
  - security_setup_cancel
  rule: Only the customer can cancel, immediately or at term end, and a scheduled cancellation may be withdrawn
    before the term end date. An immediate cancellation of a 12-month plan is refunded in full only on or before
    the plan's opening date plus money_back_days calendar days. The window adds whole calendar days to the opening
    date, counting the next day as day 1, and the last day is included. Where money_back_excludes_used_cleanup is
    true a plan that has had any expert cleanup (security_msr_cleanups_ever above zero) gets no money-back refund,
    a 1-month charge is never refunded, and a cancellation before setup completes is refunded in full. Each charge
    is refunded only once.
  eligibility:
  - id: money_back_window
    applies_to:
    - security_refund
    kind: time
    condition: An immediate cancellation of a 12-month plan is refunded in full only on or before the plan's opening
      date plus money_back_days calendar days.
    evidence_fields:
    - security_holdings.security_plan_id
    - security_holdings.opened_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - security_holdings.security_plan_id
      action_bindings:
        security_holdings.security_plan_id: security_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the plan's opening date
      anchor_source: security_holdings.opened_date
      relation: not_after
      duration_source: variants.money_back_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the opening date, counting the next day as day 1, and
        the last day is included.
      boundary: inclusive
  - id: refund_once
    applies_to:
    - security_refund
    kind: dedup
    condition: Each charge is refunded only once.
    evidence_fields:
    - security_charges.original_security_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - security_charges.original_security_charge_id
      action_bindings:
        security_charges.original_security_charge_id: original_security_charge_id
    dedup_contract:
      table: security_charges
      mode: separate_record
      object_bindings:
        original_security_charge_id: original_security_charge_id
      duplicate_filters:
        event_type:
        - security_refund
      distinct_fields: []
  measures:
  - security_msr_cleanups_ever
- id: security_setup_and_lifecycle
  subject:
  - security_activate
  - security_expire
  - security_cancel_effective
  - security_pci_scan
  rule: Protection starts as soon as scanning is set up, and on tiers where waf_setup_requires_dns_change is true
    only once the site's DNS points through the firewall, with a reminder after setup_reminder_days days. A plan
    whose renewal is unpaid at the term end expires the next day, and an expired plan not renewed within expired_grace_days,
    like a scheduled cancellation at its term end, ends the plan. On tiers with pci_asv_scan a PCI scan runs every
    pci_scan_interval_days, and WAF, CDN, DDoS, bot, virtual patching, backup, monitoring and reporting features
    follow the tier's parameters from activation.
  eligibility: []
