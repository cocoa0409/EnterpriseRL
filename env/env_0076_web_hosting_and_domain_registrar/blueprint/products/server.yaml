# Product charter — VPS and Dedicated Servers (category: server). Single registry of every quantified policy of this category.
category: server
display_name: VPS and Dedicated Servers
binding:
  holding_table: server_holdings
  event_tables:
  - server_charges
  - server_events
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - provisioning
  - active
  - suspended
  - cancel_pending
  - cancelled
  - terminated
  transitions:
  - from: provisioning
    to: active
    by: system
    means: The server is built and root access handed over.
  - from: provisioning
    to: cancelled
    by: system
    means: The order fails payment or fraud screening, or hardware cannot be allocated, and is never built.
  - from: active
    to: suspended
    by: system
    means: The server is suspended for non-payment, an unresolved abuse report or bandwidth overage left unpaid.
  - from: suspended
    to: active
    by: agent
    means: The cause of a suspension is cured and the server is powered back on.
  - from: suspended
    to: terminated
    by: system
    means: The retention period of a suspended server lapses and its disks are wiped.
  - from: active
    to: cancel_pending
    by: user
    means: The customer cancels the server effective at the end of the paid term or notice period.
  - from: cancel_pending
    to: active
    by: agent
    means: The customer withdraws a scheduled cancellation before it takes effect.
  - from: cancel_pending
    to: cancelled
    by: system
    means: The scheduled cancellation date arrives and the server is wiped.
  - from: active
    to: cancelled
    by: user
    means: The customer cancels a VPS with immediate effect.
accounts:
- key: server_billed
  unit: USD
  meaning: 'Net amount billed for one server: term, renewal, add-on, overage and resize charges add to it; refunds
    and uptime credits take away from it.'
parameter_schema:
  server_type: vps or dedicated
  price_monthly: Price per month on the 1-month term, USD
  price_12mo_per_month: Price per month on a 12-month term, USD
  price_24mo_per_month: Price per month on a 24-month term, USD
  setup_fee: One-time setup fee, USD (waived on 12 and 24-month terms)
  setup_fee_waived_min_term_months: Shortest term on which the setup fee is waived, months
  vcpu: Virtual or physical CPU cores
  ram_gb: Memory, GB
  disk_gb: NVMe storage, GB
  bandwidth_tb_monthly: Outbound transfer included per calendar month, TB
  bandwidth_overage_per_tb: Price per started TB of outbound transfer above the included amount in a calendar month,
    USD
  port_speed_gbps: Network port speed, Gbps
  ipv4_included: IPv4 addresses included
  additional_ipv4_monthly: Price per extra IPv4 address per month, USD
  max_additional_ipv4: Most extra IPv4 addresses allowed
  ipv6_included: Whether a /64 IPv6 range is included, boolean
  snapshot_slots_free: Free snapshot slots (0 for dedicated)
  snapshot_price_per_gb_month: Price per GB-month of snapshot storage beyond free slots, USD
  backup_addon_available: Whether automatic daily backups can be added, boolean
  backup_addon_pct: Price of the backup add-on as a percent of the server's monthly price
  backup_retention_days: Days daily backups are kept
  managed_support_available: Whether the managed support add-on can be added, boolean
  managed_support_monthly: Price per month of managed support, USD (0.00 where unavailable)
  managed_requires_control_panel: Whether managed support requires a supported control panel licence on the server,
    boolean
  control_panel_license_monthly: Price per month of the control panel licence add-on, USD
  root_access: Whether full root access is given, boolean
  os_reinstall_fee: Fee for an operating system reinstall, USD
  provisioning_target_hours: Elapsed hours targeted from paid order to hand-over
  money_back_days: Calendar days after the opening date within which a cancellation is refunded under the money-back
    guarantee (0 = none)
  money_back_min_term_months: Shortest term covered by the money-back guarantee, months
  cancellation_notice_days: Calendar days of notice a scheduled cancellation needs before it takes effect (0 = at
    term end)
  immediate_cancellation_allowed: Whether the server may be cancelled with immediate effect, boolean
  auto_renew_default_on: Whether auto-renew is on by default, boolean
  auto_renew_days_before_term_end: Days before the term end on which the renewal is charged
  suspension_grace_days: Calendar days after the term end during which an unpaid server keeps running
  data_retention_days: Calendar days a suspended server is kept before its disks are wiped
  reactivation_fee: Fee to reactivate a server suspended for non-payment, USD
  resize_up_allowed_targets: Tiers a server can be resized up to mid-term, list
  resize_down_allowed: Whether a server can be resized to a smaller tier (disk can never shrink), boolean
  resize_downtime_minutes: Expected downtime of a resize, minutes
  uptime_sla_pct: Monthly network uptime commitment, percent
  sla_credit_pct_per_hour: Percent of the monthly fee credited per started hour of network downtime beyond the commitment
  sla_credit_cap_pct: Largest uptime credit for one month, percent of the monthly fee
  abuse_response_hours: Elapsed hours the customer has to answer an abuse report before suspension
  ddos_protection_gbps: Volumetric DDoS mitigation capacity included, Gbps
  rescue_console_included: Whether out-of-band console and rescue mode are included, boolean
  hardware_replacement_hours: Elapsed hours targeted to replace failed hardware (0 for VPS)
  account_discount_applies: Whether the account tier's server_discount_pct applies to term prices, boolean
  price_rounding: 'Rounding of every computed server amount: half_up_to_cent'
