events:
- type: server_order
  target: server_holdings
  mutation: create
  meaning: A customer orders a VPS or dedicated server on a chosen term.
  grain: One row per server ordered.
  fields:
    variant_name: Official server product ordered.
    hostname: Server hostname given by the customer, verbatim.
    billing_term_months: 1, 12 or 24.
    term_start_date: Order date.
    term_end_date: Order date plus the term in calendar months.
    auto_renew: Initial auto-renew setting.
    opened_date: Order date.
  triggers:
  - event: server:server_term_charge
    map:
      charge_type: initial_term
- type: server_activate
  target: server_holdings
  mutation:
    transition:
      from: provisioning
      to: active
  meaning: The server is handed over.
  grain: One row per transaction.
  fields:
    activated_date: Hand-over date.
  triggers: []
- type: server_provision_fail
  target: server_holdings
  mutation:
    transition:
      from: provisioning
      to: cancelled
  meaning: The order is never built.
  grain: One row per transaction.
  fields:
    closed_date: Date abandoned.
  triggers:
  - event: server:server_refund
    map:
      refund_kind: failed_order
- type: server_suspend
  target: server_holdings
  mutation:
    transition:
      from: active
      to: suspended
  meaning: The server is suspended.
  grain: One row per transaction.
  fields:
    suspended_date: Suspension date.
    suspension_reason: nonpayment or abuse.
  triggers: []
- type: server_reactivate
  target: server_holdings
  mutation:
    transition:
      from: suspended
      to: active
  meaning: A suspended server is powered back on.
  grain: One row per transaction.
  fields:
    suspended_date: Cleared to empty.
    suspension_reason: Reset to none.
  triggers: []
- type: server_terminate
  target: server_holdings
  mutation:
    transition:
      from: suspended
      to: terminated
  meaning: A suspended server's retention period lapses and its disks are wiped.
  grain: One row per transaction.
  fields:
    closed_date: Wipe date.
  triggers: []
- type: server_cancel_schedule
  target: server_holdings
  mutation:
    transition:
      from: active
      to: cancel_pending
  meaning: The customer schedules cancellation.
  grain: One row per transaction.
  fields:
    cancel_effective_date: Date the cancellation will take effect.
    auto_renew: Set to false.
  triggers: []
- type: server_cancel_withdraw
  target: server_holdings
  mutation:
    transition:
      from: cancel_pending
      to: active
  meaning: A scheduled cancellation is withdrawn.
  grain: One row per transaction.
  fields:
    cancel_effective_date: Cleared to empty.
    auto_renew: Set to true.
  triggers: []
- type: server_cancel_effective
  target: server_holdings
  mutation:
    transition:
      from: cancel_pending
      to: cancelled
  meaning: The scheduled cancellation takes effect.
  grain: One row per transaction.
  fields:
    closed_date: Cancellation date.
  triggers: []
- type: server_cancel_immediate
  target: server_holdings
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: A VPS is cancelled with immediate effect.
  grain: One row per transaction.
  fields:
    closed_date: Cancellation date.
  triggers: []
- type: server_resize
  target: server_holdings
  mutation: update
  meaning: A VPS is resized up to a larger tier mid-term.
  grain: One row per resize.
  fields:
    variant_name: New official product name.
  triggers: []
- type: server_term_renew
  target: server_holdings
  mutation: update
  meaning: A paid renewal starts the next term.
  grain: One row per renewal.
  fields:
    term_start_date: Previous term end date.
    term_end_date: New term start plus the term in calendar months.
    billing_term_months: Renewal term.
  triggers: []
- type: server_addon_update
  target: server_holdings
  mutation: update
  meaning: 'Add-ons on the server change: extra IPv4 addresses, backups, managed support, control panel licence
    or auto-renew.'
  grain: One row per add-on change.
  fields:
    extra_ipv4: Extra IPv4 addresses after the change.
    backups_enabled: Backup add-on after the change.
    managed_support: Managed support after the change.
    control_panel: Control panel licence after the change.
    auto_renew: Auto-renew after the change.
  triggers: []
- type: server_term_charge
  target: server_charges
  meaning: The first term of a server, and its setup fee where due, is billed.
  grain: One row per billed purchase line.
  distinguish_by:
  - charge_type
  - period_start
  fields:
    charge_type: initial_term or setup_fee.
    amount: Amount billed, USD, positive.
    term_months: Months covered.
    period_start: First day covered.
    period_end: Last day covered.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: server_billed
  direction: in
  triggers:
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: server_renewal_charge
  target: server_charges
  meaning: A renewal term is billed, add-ons included.
  grain: One row per renewal.
  distinguish_by:
  - period_start
  fields:
    charge_type: renewal or auto_renew.
    amount: Amount billed, USD, positive.
    term_months: Months covered.
    period_start: Previous term end.
    period_end: New term end.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: server_billed
  direction: in
  triggers:
  - event: server:server_term_renew
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: server_addon_charge
  target: server_charges
  meaning: 'An add-on, resize or reactivation is billed mid-term: extra IPv4, backups, managed support, control
    panel, resize proration or reactivation fee.'
  grain: One row per billed add-on or change order.
  distinguish_by:
  - charge_type
  - charge_date
  - order_ref
  fields:
    charge_type: ipv4, backups, managed_support, control_panel, resize_proration or reactivation_fee.
    amount: Amount billed, USD, positive.
    period_start: First day covered.
    period_end: Last day covered (term end).
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: server_billed
  direction: in
  triggers:
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: server_overage_charge
  target: server_charges
  meaning: Outbound transfer above the monthly allowance is billed after the calendar month ends.
  grain: One row per server per calendar month with overage.
  distinguish_by:
  - usage_month
  fields:
    charge_type: bandwidth_overage.
    amount: Amount billed, USD, positive.
    usage_month: Calendar month billed.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: server_billed
  direction: in
  triggers:
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: server_refund
  target: server_charges
  meaning: A server charge is refunded under the money-back guarantee or for a failed order.
  grain: One row per refunded original charge.
  distinguish_by:
  - original_server_charge_id
  fields:
    original_server_charge_id: Reference of the charge refunded.
    charge_type: Charge type of the refunded charge, copied from it.
    refund_kind: money_back or failed_order.
    amount: Refunded amount, USD, negative.
    charge_date: Refund date.
    refund_destination: original_payment_method or account_credit.
  account: server_billed
  direction: out
  triggers:
  - event: account:account_credit_refund
    when:
      refund_destination: account_credit
    map:
      customer_id: customer_id
- type: server_sla_credit
  target: server_charges
  meaning: A network uptime credit for a calendar month is issued as account credit.
  grain: One row per server per affected month.
  distinguish_by:
  - usage_month
  fields:
    usage_month: Calendar month credited.
    amount: Credit, USD, negative.
    charge_date: Date issued.
    refund_destination: Always account_credit.
  account: server_billed
  direction: out
  triggers:
  - event: account:account_service_credit
    map:
      customer_id: customer_id
- type: server_usage_report
  target: server_events
  meaning: The month's outbound transfer and network downtime of the server are recorded after the month ends.
  grain: One row per server per calendar month.
  distinguish_by:
  - usage_month
  fields:
    usage_month: Calendar month measured.
    bandwidth_tb_used: Outbound transfer used, TB.
    downtime_minutes: Network downtime beyond scheduled maintenance, minutes.
    event_at: Moment the report was published.
  triggers: []
- type: server_abuse_report
  target: server_events
  meaning: An abuse complaint about the server (spam, malware, attack traffic) is received and forwarded to the
    customer.
  grain: One row per abuse report.
  distinguish_by:
  - event_at
  - abuse_type
  fields:
    abuse_type: spam, malware, attack_traffic or copyright.
    event_at: Moment the report was forwarded.
    abuse_status: open or resolved.
  triggers: []
- type: server_renewal_decline
  target: server_events
  meaning: A renewal charge attempt is declined.
  grain: One row per declined attempt.
  distinguish_by:
  - event_at
  fields:
    event_at: Moment of the attempt.
  triggers: []
measures:
- id: server_msr_pooled_transfer
  window: One calendar month.
  measure: Sum of bandwidth_tb_used over server_usage_report rows of that month for all of the customer's VPS servers
    that were active at any time in the month, compared with the sum of their bandwidth_tb_monthly allowances.
policies:
- id: server_agg_multi_holding
  subject:
  - server_order
  rule: A customer may hold any number of servers, each billed and renewed on its own term.
  eligibility: []
  params:
    max_per_customer: null
- id: server_agg_bandwidth_pool
  subject:
  - server_overage_charge
  - server_usage_report
  rule: Outbound transfer allowances of all of a customer's VPS servers are pooled for each calendar month, and
    overage is billed only on the pooled usage above the pooled allowance (server_msr_pooled_transfer). Pooled overage
    is billed per started TB at bandwidth_overage_per_tb on the server with the highest usage that month, while
    dedicated servers are never pooled and are billed on their own usage. An overage line is billed once per server
    per month, after the month ends.
  eligibility:
  - id: overage_once
    applies_to:
    - server_overage_charge
    kind: dedup
    condition: An overage line is billed once per server per month, after the month ends.
    evidence_fields:
    - server_charges.server_id
    - server_charges.usage_month
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - server_charges.server_id
        - server_charges.usage_month
      action_bindings:
        server_charges.server_id: server_id
        server_charges.usage_month: usage_month
    dedup_contract:
      table: server_charges
      mode: separate_record
      object_bindings:
        server_id: server_id
        usage_month: usage_month
      duplicate_filters:
        event_type:
        - server_overage_charge
      distinct_fields: []
  measures:
  - server_msr_pooled_transfer
- id: server_pricing
  subject:
  - server_term_charge
  - server_order
  rule: The first term is billed at price_monthly for a 1-month term or price_12mo_per_month or price_24mo_per_month
    times the months, less the account tier's server_discount_pct where account_discount_applies is true, rounded
    half up to the cent. The setup_fee is billed as its own line unless the term is at least setup_fee_waived_min_term_months.
    Purchase lines are billed when the order is placed, while the server is provisioning.
  eligibility:
  - id: billed_provisioning
    applies_to:
    - server_term_charge
    kind: state
    condition: Purchase lines are billed when the order is placed, while the server is provisioning.
    evidence_fields:
    - server_holdings.server_id
    - server_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - server_holdings.server_id
      action_bindings:
        server_holdings.server_id: server_id
    state_contract:
      field: server_holdings.status
      allowed:
      - provisioning
  params:
    account_server_discount_pct: account charter parameter server_discount_pct of the customer's account tier
    per_tier:
      Harborline VPS 2 GB:
        monthly: =price_monthly
        m12: =price_12mo_per_month
        m24: =price_24mo_per_month
        setup: =setup_fee
      Harborline VPS 4 GB:
        monthly: =price_monthly
        m12: =price_12mo_per_month
        m24: =price_24mo_per_month
        setup: =setup_fee
      Harborline VPS 8 GB:
        monthly: =price_monthly
        m12: =price_12mo_per_month
        m24: =price_24mo_per_month
        setup: =setup_fee
      Harborline VPS 16 GB:
        monthly: =price_monthly
        m12: =price_12mo_per_month
        m24: =price_24mo_per_month
        setup: =setup_fee
      Harborline Dedicated Standard:
        monthly: =price_monthly
        m12: =price_12mo_per_month
        m24: =price_24mo_per_month
        setup: =setup_fee
      Harborline Dedicated Enterprise:
        monthly: =price_monthly
        m12: =price_12mo_per_month
        m24: =price_24mo_per_month
        setup: =setup_fee
  formula:
    term_12: round(price_12mo_per_month * 12 * (100 - account_server_discount_pct) / 100, 2)
    term_24: round(price_24mo_per_month * 24 * (100 - account_server_discount_pct) / 100, 2)
    term_1: round(price_monthly * (100 - account_server_discount_pct) / 100, 2)
- id: server_renewal
  subject:
  - server_renewal_charge
  - server_term_renew
  - server_renewal_decline
  rule: A renewal may be charged only while the server status is active or suspended. A renewal is billed at the
    tier's price for the renewal term plus the active add-ons for the same months, less any applicable account discount,
    and the new term starts on the previous term end date. Where auto_renew is true the renewal is charged auto_renew_days_before_term_end
    days before the term end date, and an unpaid server keeps running for suspension_grace_days calendar days after
    the term end before suspension.
  eligibility:
  - id: renewable
    applies_to:
    - server_renewal_charge
    kind: state
    condition: A renewal may be charged only while the server status is active or suspended.
    evidence_fields:
    - server_holdings.server_id
    - server_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - server_holdings.server_id
      action_bindings:
        server_holdings.server_id: server_id
    state_contract:
      field: server_holdings.status
      allowed:
      - active
      - suspended
- id: server_resize_rules
  subject:
  - server_resize
  - server_addon_charge
  rule: A resize may be made only while the server status is active. A VPS may be resized only up to one of its
    resize_up_allowed_targets, with about resize_downtime_minutes of downtime, and never down (resize_down_allowed),
    because disks cannot shrink. The resize is billed as the target's price for the current term length minus the
    current tier's, times the months of the term, times the calendar days from today to the term end date over the
    calendar days of the term, rounded half up to the cent. Dedicated servers are never resized; a larger dedicated
    server is a new order.
  eligibility:
  - id: resize_active
    applies_to:
    - server_resize
    kind: state
    condition: A resize may be made only while the server status is active.
    evidence_fields:
    - server_holdings.server_id
    - server_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - server_holdings.server_id
      action_bindings:
        server_holdings.server_id: server_id
    state_contract:
      field: server_holdings.status
      allowed:
      - active
  params:
    price_difference_per_month: target tier price per month for the current term length minus the current tier's
    remaining_days: calendar days from today to term_end_date
    term_days: calendar days from term_start_date to term_end_date
    per_tier:
      Harborline VPS 2 GB:
        targets: =resize_up_allowed_targets
      Harborline VPS 4 GB:
        targets: =resize_up_allowed_targets
      Harborline VPS 8 GB:
        targets: =resize_up_allowed_targets
      Harborline VPS 16 GB:
        targets: =resize_up_allowed_targets
      Harborline Dedicated Standard:
        targets: =resize_up_allowed_targets
      Harborline Dedicated Enterprise:
        targets: =resize_up_allowed_targets
  formula:
    resize_amount: round(price_difference_per_month * term_months * remaining_days / term_days, 2)
- id: server_addons
  subject:
  - server_addon_update
  - server_addon_charge
  rule: Add-ons may be changed only while the server status is active. Extra IPv4 addresses cost additional_ipv4_monthly
    each up to max_additional_ipv4, backups cost backup_addon_pct of the server's monthly price where backup_addon_available
    is true, managed support costs managed_support_monthly where managed_support_available is true, and the control
    panel licence costs control_panel_license_monthly. Managed support may be added only to a server that also has
    the control panel licence (managed_requires_control_panel), and removing the licence removes managed support
    with it. An add-on added mid-term is billed prorated by calendar days to the term end, and an add-on removed
    mid-term is not refunded and simply stops at the next renewal. Snapshots beyond snapshot_slots_free are billed
    at snapshot_price_per_gb_month, and an operating system reinstall costs os_reinstall_fee.
  eligibility:
  - id: addon_active
    applies_to:
    - server_addon_update
    kind: state
    condition: Add-ons may be changed only while the server status is active.
    evidence_fields:
    - server_holdings.server_id
    - server_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - server_holdings.server_id
      action_bindings:
        server_holdings.server_id: server_id
    state_contract:
      field: server_holdings.status
      allowed:
      - active
  params:
    per_tier:
      Harborline VPS 2 GB:
        managed: =managed_support_monthly
        panel: =control_panel_license_monthly
        backups: =backup_addon_available
      Harborline VPS 4 GB:
        managed: =managed_support_monthly
        panel: =control_panel_license_monthly
        backups: =backup_addon_available
      Harborline VPS 8 GB:
        managed: =managed_support_monthly
        panel: =control_panel_license_monthly
        backups: =backup_addon_available
      Harborline VPS 16 GB:
        managed: =managed_support_monthly
        panel: =control_panel_license_monthly
        backups: =backup_addon_available
      Harborline Dedicated Standard:
        managed: =managed_support_monthly
        panel: =control_panel_license_monthly
        backups: =backup_addon_available
      Harborline Dedicated Enterprise:
        managed: =managed_support_monthly
        panel: =control_panel_license_monthly
        backups: =backup_addon_available
- id: server_cancellation
  subject:
  - server_cancel_schedule
  - server_cancel_withdraw
  - server_cancel_effective
  - server_cancel_immediate
  - server_refund
  rule: Only the customer can cancel a server, and a scheduled cancellation may be withdrawn before it takes effect.
    A money-back refund of the initial_term line is given only for a cancellation made on or before the server's
    opening date plus money_back_days calendar days. The window adds whole calendar days to the opening date, counting
    the next day as day 1, and the last day is included; a tier whose value is 0 has no money-back guarantee, and
    setup fees and add-ons are never refunded under it. A dedicated server cannot be cancelled with immediate effect
    (immediate_cancellation_allowed) and its cancellation takes effect cancellation_notice_days calendar days after
    the request, or at the term end when that is later, with no refund. Each charge is refunded only once.
  eligibility:
  - id: money_back_window
    applies_to:
    - server_refund
    kind: time
    condition: A money-back refund of the initial_term line is given only for a cancellation made on or before the
      server's opening date plus money_back_days calendar days.
    evidence_fields:
    - server_holdings.server_id
    - server_holdings.opened_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - server_holdings.server_id
      action_bindings:
        server_holdings.server_id: server_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the server's opening date
      anchor_source: server_holdings.opened_date
      relation: not_after
      duration_source: variants.money_back_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the opening date, counting the next day as day 1, and
        the last day is included; a tier whose value is 0 has no money-back guarantee, and setup fees and add-ons
        are never refunded under it.
      boundary: inclusive
  - id: refund_once
    applies_to:
    - server_refund
    kind: dedup
    condition: Each charge is refunded only once.
    evidence_fields:
    - server_charges.original_server_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - server_charges.original_server_charge_id
      action_bindings:
        server_charges.original_server_charge_id: original_server_charge_id
    dedup_contract:
      table: server_charges
      mode: separate_record
      object_bindings:
        original_server_charge_id: original_server_charge_id
      duplicate_filters:
        event_type:
        - server_refund
      distinct_fields: []
  params:
    per_tier:
      Harborline VPS 2 GB:
        money_back: =money_back_days
        notice: =cancellation_notice_days
      Harborline VPS 4 GB:
        money_back: =money_back_days
        notice: =cancellation_notice_days
      Harborline VPS 8 GB:
        money_back: =money_back_days
        notice: =cancellation_notice_days
      Harborline VPS 16 GB:
        money_back: =money_back_days
        notice: =cancellation_notice_days
      Harborline Dedicated Standard:
        money_back: =money_back_days
        notice: =cancellation_notice_days
      Harborline Dedicated Enterprise:
        money_back: =money_back_days
        notice: =cancellation_notice_days
- id: server_sla_credits
  subject:
  - server_sla_credit
  - server_usage_report
  rule: For a calendar month whose recorded network downtime exceeds what uptime_sla_pct allows, the customer may
    claim sla_credit_pct_per_hour of the monthly fee per started hour of excess downtime, up to sla_credit_cap_pct,
    issued as account credit. The monthly fee is the amount of the line paying the term covering that month divided
    by its term_months. One credit is issued per server per calendar month.
  eligibility:
  - id: credit_once
    applies_to:
    - server_sla_credit
    kind: dedup
    condition: One credit is issued per server per calendar month.
    evidence_fields:
    - server_charges.server_id
    - server_charges.usage_month
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - server_charges.server_id
        - server_charges.usage_month
      action_bindings:
        server_charges.server_id: server_id
        server_charges.usage_month: usage_month
    dedup_contract:
      table: server_charges
      mode: separate_record
      object_bindings:
        server_id: server_id
        usage_month: usage_month
      duplicate_filters:
        event_type:
        - server_sla_credit
      distinct_fields: []
  params:
    per_tier:
      Harborline VPS 2 GB:
        sla: =uptime_sla_pct
      Harborline VPS 4 GB:
        sla: =uptime_sla_pct
      Harborline VPS 8 GB:
        sla: =uptime_sla_pct
      Harborline VPS 16 GB:
        sla: =uptime_sla_pct
      Harborline Dedicated Standard:
        sla: =uptime_sla_pct
      Harborline Dedicated Enterprise:
        sla: =uptime_sla_pct
- id: server_suspension
  subject:
  - server_suspend
  - server_reactivate
  - server_terminate
  - server_abuse_report
  - server_addon_charge
  rule: A server unpaid suspension_grace_days calendar days after its term end, or whose abuse report is still open
    abuse_response_hours elapsed hours after it was forwarded, is suspended. A server suspended for non-payment
    may be reactivated only on or before the suspension date plus data_retention_days calendar days. The window
    adds whole calendar days to the suspension date, counting the next day as day 1, and the last day is included,
    after which the disks are wiped. Reactivation after non-payment requires the renewal plus reactivation_fee,
    and a server suspended for abuse is reactivated without a fee once the report is resolved.
  eligibility:
  - id: reactivation_window
    applies_to:
    - server_reactivate
    kind: time
    condition: A server suspended for non-payment may be reactivated only on or before the suspension date plus
      data_retention_days calendar days.
    evidence_fields:
    - server_holdings.suspension_reason
    - server_holdings.server_id
    - server_holdings.suspended_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - server_holdings.server_id
      action_bindings:
        server_holdings.server_id: server_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the suspension date
      anchor_source: server_holdings.suspended_date
      relation: not_after
      duration_source: variants.data_retention_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the suspension date, counting the next day as day 1,
        and the last day is included, after which the disks are wiped.
      boundary: inclusive
- id: server_provisioning
  subject:
  - server_activate
  - server_provision_fail
  rule: A paid server is targeted for hand-over within provisioning_target_hours elapsed hours, and dedicated servers
    are ordered only after the customer's identity is verified. An order that fails payment or fraud screening,
    or for which hardware cannot be allocated, is cancelled and every purchase line refunded in full. Network capacity
    (port_speed_gbps, ddos_protection_gbps), root access, rescue console and hardware_replacement_hours apply from
    hand-over.
  eligibility: []
