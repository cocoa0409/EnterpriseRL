events:
- type: ssl_order
  target: ssl_holdings
  mutation: create
  meaning: A customer orders a certificate subscription for a common name.
  grain: One row per certificate subscription ordered.
  fields:
    variant_name: Official certificate product ordered.
    common_name: Primary name to be secured, lowercase, verbatim (a leading *. for wildcards).
    extra_names: Names ordered beyond the included ones.
    subscription_years: 'Years bought: 1, 2 or 3.'
    subscription_start_date: Order date.
    subscription_end_date: Order date plus the subscription years.
    dcv_method: Validation method chosen.
    domain_id: Harborline domain holding of the common name's registered domain; null when registered elsewhere.
    hosting_id: Harborline hosting plan the certificate is to be installed on; null when hosted elsewhere.
    auto_renew: Initial auto-renew setting.
    opened_date: Order date.
  triggers:
  - event: ssl:ssl_purchase_charge
    map:
      charge_type: new_subscription
- type: ssl_activate
  target: ssl_holdings
  mutation:
    transition:
      from: pending_validation
      to: active
  meaning: The first certificate of the subscription is issued.
  grain: One row per transaction.
  fields:
    cert_issued_date: Issue date of the first certificate.
  triggers: []
- type: ssl_order_cancel
  target: ssl_holdings
  mutation:
    transition:
      from: pending_validation
      to: cancelled
  meaning: An order is cancelled before any certificate is issued, by the customer or because its validation window
    ended.
  grain: One row per transaction.
  fields:
    closed_date: Cancellation date.
  triggers:
  - event: ssl:ssl_refund
    map:
      charge_type: new_subscription
- type: ssl_expire
  target: ssl_holdings
  mutation:
    transition:
      from: active
      to: expired
  meaning: The subscription end date passes unrenewed.
  grain: One row per transaction.
  fields:
    closed_date: Subscription end date.
  triggers: []
- type: ssl_revoke
  target: ssl_holdings
  mutation:
    transition:
      from: active
      to: revoked
  meaning: The certificate is revoked and the subscription ended.
  grain: One row per transaction.
  fields:
    closed_date: Revocation date.
    revocation_reason: refund, key_compromise or subscriber_request.
  triggers: []
- type: ssl_cert_update
  target: ssl_holdings
  mutation: update
  meaning: The holding's current certificate dates move to the newest issued certificate.
  grain: One row per certificate issued.
  fields:
    cert_issued_date: Issue date of the newest certificate.
    cert_expiry_date: Expiry date of the newest certificate.
  triggers: []
- type: ssl_validation_update
  target: ssl_holdings
  mutation: update
  meaning: A domain control validation or organisation validation completes and its date is recorded.
  grain: One row per completed validation.
  fields:
    dcv_validated_date: Date domain control was last validated.
    org_validated_date: Date organisation validation last completed; unchanged for DV.
    dcv_method: Method that succeeded.
  triggers: []
- type: ssl_subscription_extend
  target: ssl_holdings
  mutation: update
  meaning: 'The subscription end date moves: extended by a renewal or brought back by a refunded renewal.'
  grain: One row per subscription term change.
  fields:
    subscription_end_date: New subscription end date.
  triggers: []
- type: ssl_names_update
  target: ssl_holdings
  mutation: update
  meaning: The number of extra names on a multi-domain certificate changes.
  grain: One row per change.
  fields:
    extra_names: Extra names after the change.
  triggers: []
- type: ssl_settings_update
  target: ssl_holdings
  mutation: update
  meaning: The customer switches auto-renew or the hosting plan the certificate is installed on.
  grain: One row per change.
  fields:
    auto_renew: Auto-renew after the change.
    hosting_id: Installation hosting plan after the change; null when hosted elsewhere.
  triggers: []
- type: ssl_purchase_charge
  target: ssl_charges
  meaning: A new certificate subscription is billed.
  grain: One row per subscription purchased.
  distinguish_by:
  - charge_date
  - order_ref
  fields:
    charge_type: new_subscription.
    amount: Amount billed, USD, positive.
    years: Subscription years.
    period_start: Subscription start.
    period_end: Subscription end.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: ssl_billed
  direction: in
  triggers:
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: ssl_renewal_charge
  target: ssl_charges
  meaning: A renewal of the subscription is billed, manually or by auto-renew.
  grain: One row per renewal billed.
  distinguish_by:
  - period_start
  fields:
    charge_type: renewal or auto_renew.
    amount: Amount billed, USD, positive.
    years: Years renewed.
    period_start: Previous subscription end date.
    period_end: New subscription end date.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: ssl_billed
  direction: in
  triggers:
  - event: ssl:ssl_subscription_extend
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: ssl_names_charge
  target: ssl_charges
  meaning: Names added to a multi-domain certificate mid-term are billed for the remaining subscription.
  grain: One row per name addition order.
  distinguish_by:
  - charge_date
  - order_ref
  fields:
    charge_type: added_names.
    amount: Prorated amount, USD, positive.
    names_added: Number of names added.
    period_start: Date added.
    period_end: Subscription end date.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: ssl_billed
  direction: in
  triggers:
  - event: ssl:ssl_names_update
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: ssl_install_charge
  target: ssl_charges
  meaning: Installation by Harborline support on an external server is billed.
  grain: One row per installation ordered.
  distinguish_by:
  - charge_date
  - order_ref
  fields:
    charge_type: installation.
    amount: Amount billed, USD, positive.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: ssl_billed
  direction: in
  triggers:
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: ssl_refund
  target: ssl_charges
  meaning: A certificate charge is refunded in full.
  grain: One row per refunded original charge.
  distinguish_by:
  - original_ssl_charge_id
  fields:
    original_ssl_charge_id: Reference of the charge refunded.
    charge_type: Charge type of the refunded charge, copied from it.
    amount: Refunded amount, USD, negative.
    charge_date: Refund date.
    refund_destination: original_payment_method or account_credit.
  account: ssl_billed
  direction: out
  triggers:
  - event: ssl:ssl_subscription_extend
    when:
      charge_type:
      - renewal
      - auto_renew
  - event: account:account_credit_refund
    when:
      refund_destination: account_credit
    map:
      customer_id: customer_id
- type: ssl_dcv_attempt
  target: ssl_events
  meaning: A domain control validation check is run for the certificate.
  grain: One row per validation check.
  distinguish_by:
  - event_at
  - dcv_method
  fields:
    event_at: Moment of the check.
    dcv_method: Method checked.
    dcv_result: passed or failed.
  triggers:
  - event: ssl:ssl_validation_update
    when:
      dcv_result: passed
- type: ssl_issuance
  target: ssl_events
  meaning: 'The certificate authority issues a certificate under the subscription: the initial certificate, a reissue,
    an automatic reissue or a duplicate.'
  grain: One row per certificate issued.
  distinguish_by:
  - event_at
  - issuance_kind
  fields:
    event_at: Moment of issuance.
    issuance_kind: initial, reissue, auto_reissue or duplicate.
    cert_expiry_date: Expiry date of the issued certificate.
  triggers:
  - event: ssl:ssl_activate
    when:
      issuance_kind: initial
  - event: ssl:ssl_cert_update
    when:
      issuance_kind:
      - initial
      - reissue
      - auto_reissue
- type: ssl_expiry_reminder
  target: ssl_events
  meaning: A subscription expiry reminder is emailed.
  grain: One row per reminder.
  distinguish_by:
  - reminder_kind
  - event_at
  fields:
    reminder_kind: days_30, days_7 or days_1.
    event_at: Moment sent.
  triggers: []
measures:
- id: ssl_msr_reissues_30d
  window: Trailing 30 calendar days ending today, today included.
  measure: Count of ssl_issuance rows of the certificate with issuance_kind reissue whose event_at falls in the
    window.
- id: ssl_msr_order_certificate_count
  window: The single order identified by one order_ref.
  measure: Count of ssl_purchase_charge rows of the same customer carrying that order_ref.
policies:
- id: ssl_agg_multi_holding
  subject:
  - ssl_order
  rule: A customer may hold any number of certificate subscriptions, and several subscriptions may cover the same
    name, for example when different servers need separate keys. Each subscription is billed, validated, renewed
    and refunded on its own.
  eligibility: []
  params:
    max_per_customer: null
- id: ssl_agg_volume_and_org_reuse
  subject:
  - ssl_purchase_charge
  - ssl_validation_update
  rule: When one order contains several new subscriptions of the same customer, every subscription line in it is
    discounted by the highest step of volume_discount_ladder whose min_certificates does not exceed ssl_msr_order_certificate_count.
    When the customer's account tier grants an ssl_discount_pct under the account charter, only the single higher
    of the two percentages applies to a line and they are never added. Where org_validation_shared_across_orders
    is true, an organisation validation completed for one of the customer's OV or EV subscriptions also counts for
    the customer's other OV and EV orders for the same organisation until it is older than org_validation_reuse_days,
    and an EV order may reuse only an extended validation.
  eligibility: []
  params:
    ladder: =volume_discount_ladder
  measures:
  - ssl_msr_order_certificate_count
- id: ssl_pricing
  subject:
  - ssl_purchase_charge
  - ssl_order
  rule: A new subscription is billed at the tier's price for the years bought (price_1yr, or price_2yr_per_year
    or price_3yr_per_year times the years) plus additional_name_price_per_year times the extra names times the years.
    The line is reduced by the discount applicable under ssl_agg_volume_and_org_reuse and rounded half up to the
    cent (price_rounding). A subscription is billed when the order is placed, while it is pending validation. An
    OV or EV product may be ordered only by a customer whose profile is a business. The subscription runs from the
    order date for the years bought, at most max_subscription_years, and the names covered may not exceed max_names;
    a wildcard name can be ordered only on a product whose wildcard_supported is true.
  eligibility:
  - id: billed_pending
    applies_to:
    - ssl_purchase_charge
    kind: state
    condition: A subscription is billed when the order is placed, while it is pending validation.
    evidence_fields:
    - ssl_holdings.certificate_id
    - ssl_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_holdings.certificate_id
      action_bindings:
        ssl_holdings.certificate_id: certificate_id
    state_contract:
      field: ssl_holdings.status
      allowed:
      - pending_validation
  - id: business_for_ov_ev
    applies_to:
    - ssl_order
    kind: state
    condition: An OV or EV product may be ordered only by a customer whose profile is a business.
    evidence_fields:
    - customers.customer_id
    - customers.customer_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
    state_contract:
      field: customers.customer_type
      allowed:
      - business
  params:
    discount_pct: the percentage applicable under ssl_agg_volume_and_org_reuse (0 when none)
    per_tier:
      Harborline DV Single Domain:
        price_1: =price_1yr
        price_2: =price_2yr_per_year
        price_3: =price_3yr_per_year
        extra_name: =additional_name_price_per_year
      Harborline DV Multi-Domain:
        price_1: =price_1yr
        price_2: =price_2yr_per_year
        price_3: =price_3yr_per_year
        extra_name: =additional_name_price_per_year
      Harborline DV Wildcard:
        price_1: =price_1yr
        price_2: =price_2yr_per_year
        price_3: =price_3yr_per_year
        extra_name: =additional_name_price_per_year
      Harborline OV Single Domain:
        price_1: =price_1yr
        price_2: =price_2yr_per_year
        price_3: =price_3yr_per_year
        extra_name: =additional_name_price_per_year
      Harborline OV Wildcard:
        price_1: =price_1yr
        price_2: =price_2yr_per_year
        price_3: =price_3yr_per_year
        extra_name: =additional_name_price_per_year
      Harborline EV Single Domain:
        price_1: =price_1yr
        price_2: =price_2yr_per_year
        price_3: =price_3yr_per_year
        extra_name: =additional_name_price_per_year
      Harborline EV Multi-Domain:
        price_1: =price_1yr
        price_2: =price_2yr_per_year
        price_3: =price_3yr_per_year
        extra_name: =additional_name_price_per_year
  formula:
    amount_1yr: round((price_1yr + additional_name_price_per_year * extra_names) * (100 - discount_pct) / 100, 2)
    amount_2yr: round((price_2yr_per_year + additional_name_price_per_year * extra_names) * 2 * (100 - discount_pct)
      / 100, 2)
    amount_3yr: round((price_3yr_per_year + additional_name_price_per_year * extra_names) * 3 * (100 - discount_pct)
      / 100, 2)
- id: ssl_validation
  subject:
  - ssl_dcv_attempt
  - ssl_validation_update
  - ssl_activate
  - ssl_order_cancel
  rule: Domain control is validated by one of the tier's dcv_methods; a wildcard name cannot use http_file, and
    approver email goes only to the mailbox names in approver_email_prefixes at the registered domain. Where auto_dcv_with_harborline_dns
    is true and the certificate's domain_id names a Harborline domain that is active and on harborline_dns, DNS
    validation completes automatically without customer action. OV and EV products also require organisation validation
    from org_documents_accepted and, where callback_verification_required is true, a verified telephone callback,
    and are targeted for issuance within issuance_target_business_days business days once the documents are complete.
    An order may be cancelled for lack of validation only after the order date plus pending_validation_expiry_days
    calendar days. The day count adds whole calendar days to the order date, counting the day after it as day 1,
    and cancellation happens on the first day after the last counted day. A cancelled order, whether cancelled by
    the customer before issuance or for lack of validation, is refunded in full under ssl_refunds regardless of
    the refund window.
  eligibility:
  - id: validation_window_lapsed
    applies_to:
    - ssl_order_cancel
    kind: time
    condition: An order may be cancelled for lack of validation only after the order date plus pending_validation_expiry_days
      calendar days.
    evidence_fields:
    - ssl_holdings.certificate_id
    - ssl_holdings.opened_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_holdings.certificate_id
      action_bindings:
        ssl_holdings.certificate_id: certificate_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the order date
      anchor_source: ssl_holdings.opened_date
      relation: not_before
      duration_source: variants.pending_validation_expiry_days
      unit: calendar_days
      counting_rule: The day count adds whole calendar days to the order date, counting the day after it as day
        1, and cancellation happens on the first day after the last counted day.
      boundary: exclusive
  params:
    per_tier:
      Harborline DV Single Domain:
        methods: =dcv_methods
        callback: =callback_verification_required
        target_days: =issuance_target_business_days
      Harborline DV Multi-Domain:
        methods: =dcv_methods
        callback: =callback_verification_required
        target_days: =issuance_target_business_days
      Harborline DV Wildcard:
        methods: =dcv_methods
        callback: =callback_verification_required
        target_days: =issuance_target_business_days
      Harborline OV Single Domain:
        methods: =dcv_methods
        callback: =callback_verification_required
        target_days: =issuance_target_business_days
      Harborline OV Wildcard:
        methods: =dcv_methods
        callback: =callback_verification_required
        target_days: =issuance_target_business_days
      Harborline EV Single Domain:
        methods: =dcv_methods
        callback: =callback_verification_required
        target_days: =issuance_target_business_days
      Harborline EV Multi-Domain:
        methods: =dcv_methods
        callback: =callback_verification_required
        target_days: =issuance_target_business_days
- id: ssl_issuance_and_reissue
  subject:
  - ssl_issuance
  - ssl_cert_update
  rule: A certificate may be issued only while the subscription status is pending_validation or active. Each certificate
    is valid until the earlier of its issue date plus max_cert_validity_days and the subscription end date, and
    from 15 March 2027 max_cert_validity_days_from_2027_03_15 replaces max_cert_validity_days. A certificate may
    be issued only on or before the date domain control was last validated plus dcv_reuse_days days. An OV or EV
    certificate may be issued only on or before the date organisation validation last completed plus org_validation_reuse_days
    days. Each validity window adds whole calendar days to the validation date, counting the day after it as day
    1, and the last day is included; outside it validation must be repeated first. Where ownership_dcv_on_registrant_change
    is true and the covered Harborline domain shows a last_registrant_change_date later than dcv_validated_date,
    domain control must be validated again before any issuance. Reissues cost reissue_fee, are limited to max_reissues_per_30d
    per certificate (ssl_msr_reissues_30d), and duplicates for other servers are free where duplicate_certificates_allowed
    is true. Where validation can complete automatically, the next certificate is issued auto_reissue_days_before_cert_expiry
    days before the current one expires, and otherwise the customer is reminded to reissue.
  eligibility:
  - id: issuable_status
    applies_to:
    - ssl_issuance
    kind: state
    condition: A certificate may be issued only while the subscription status is pending_validation or active.
    evidence_fields:
    - ssl_holdings.certificate_id
    - ssl_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_holdings.certificate_id
      action_bindings:
        ssl_holdings.certificate_id: certificate_id
    state_contract:
      field: ssl_holdings.status
      allowed:
      - pending_validation
      - active
  - id: dcv_fresh
    applies_to:
    - ssl_issuance
    kind: time
    condition: A certificate may be issued only on or before the date domain control was last validated plus dcv_reuse_days
      days.
    evidence_fields:
    - ssl_holdings.certificate_id
    - ssl_holdings.dcv_validated_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_holdings.certificate_id
      action_bindings:
        ssl_holdings.certificate_id: certificate_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date domain control was last validated
      anchor_source: ssl_holdings.dcv_validated_date
      relation: not_after
      duration_source: variants.dcv_reuse_days
      unit: calendar_days
      counting_rule: Each validity window adds whole calendar days to the validation date, counting the day after
        it as day 1, and the last day is included; outside it validation must be repeated first.
      boundary: inclusive
  - id: org_validation_fresh
    applies_to:
    - ssl_issuance
    kind: time
    condition: An OV or EV certificate may be issued only on or before the date organisation validation last completed
      plus org_validation_reuse_days days.
    evidence_fields:
    - ssl_holdings.certificate_id
    - ssl_holdings.org_validated_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_holdings.certificate_id
      action_bindings:
        ssl_holdings.certificate_id: certificate_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date organisation validation last completed
      anchor_source: ssl_holdings.org_validated_date
      relation: not_after
      duration_source: variants.org_validation_reuse_days
      unit: calendar_days
      counting_rule: Each validity window adds whole calendar days to the validation date, counting the day after
        it as day 1, and the last day is included; outside it validation must be repeated first.
      boundary: inclusive
  measures:
  - ssl_msr_reissues_30d
- id: ssl_renewal
  subject:
  - ssl_renewal_charge
  - ssl_subscription_extend
  rule: A renewal may be charged only while the subscription status is active. A renewal may be bought from renewal_early_days
    days before the subscription end date up to the end date itself, counting back whole calendar days from the
    end date, and an expired subscription cannot be renewed and needs a new order. A renewal extends the subscription
    from its subscription_end_date (renewal_extends_from) by 1 to max_subscription_years years, never from the payment
    date. It is billed at the tier's price for the years renewed plus the extra names for those years, reduced by
    the account tier's ssl_discount_pct and rounded half up to the cent, and the volume ladder never applies to
    renewals. Where auto_renew is true the renewal for the same number of years as the last term, capped at max_subscription_years,
    is charged auto_renew_days_before_end days before the subscription end date using the account charter's funding
    order.
  eligibility:
  - id: renew_active
    applies_to:
    - ssl_renewal_charge
    kind: state
    condition: A renewal may be charged only while the subscription status is active.
    evidence_fields:
    - ssl_holdings.certificate_id
    - ssl_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_holdings.certificate_id
      action_bindings:
        ssl_holdings.certificate_id: certificate_id
    state_contract:
      field: ssl_holdings.status
      allowed:
      - active
  params:
    account_ssl_discount_pct: account charter parameter ssl_discount_pct of the customer's account tier
  formula:
    renewal_1yr: round((price_1yr + additional_name_price_per_year * extra_names) * (100 - account_ssl_discount_pct)
      / 100, 2)
- id: ssl_names
  subject:
  - ssl_names_charge
  - ssl_names_update
  rule: Names may be added only while the subscription status is active. Names may be added only to a product whose
    additional_name_price_per_year is above zero, up to max_names in total. Each added name is billed additional_name_price_per_year
    times the remaining days divided by 365, where remaining days are the calendar days from today to the subscription
    end date, rounded half up to the cent per line (name_addition_proration_basis). Adding or removing a name takes
    effect on a free reissue, and removing a name never refunds anything (name_removal_refundable).
  eligibility:
  - id: add_names_active
    applies_to:
    - ssl_names_charge
    kind: state
    condition: Names may be added only while the subscription status is active.
    evidence_fields:
    - ssl_holdings.certificate_id
    - ssl_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_holdings.certificate_id
      action_bindings:
        ssl_holdings.certificate_id: certificate_id
    state_contract:
      field: ssl_holdings.status
      allowed:
      - active
  params:
    remaining_days: calendar days from today to subscription_end_date
  formula:
    names_amount: round(additional_name_price_per_year * names_added * remaining_days / 365, 2)
- id: ssl_refunds
  subject:
  - ssl_refund
  - ssl_revoke
  rule: A purchase, renewal or added-names charge may be refunded in full only on or before the charge date of the
    charge being refunded plus refund_window_days calendar days. The window adds whole calendar days to the charge
    date, counting the day after it as day 1, and the last day is included, and after it nothing is refunded (refund_after_window_allowed).
    Refunding the new_subscription charge of an issued subscription revokes its certificate and ends the subscription
    where refund_requires_revocation is true, and every other charge of that subscription still inside its own window
    is refunded with it. Refunding a renewal brings the subscription end date back by the years it added, and refunding
    added names removes them on a free reissue. An installation charge is refunded only when the installation was
    never performed (installation_fee_refundable_if_not_performed). An order cancelled before issuance is refunded
    in full whatever the date. Each charge may be refunded only once, and a charge paid from account credit is refunded
    to account credit.
  eligibility:
  - id: refund_window
    applies_to:
    - ssl_refund
    kind: time
    condition: A purchase, renewal or added-names charge may be refunded in full only on or before the charge date
      of the charge being refunded plus refund_window_days calendar days.
    evidence_fields:
    - ssl_charges.charge_type
    - ssl_charges.ssl_charge_id
    - ssl_charges.charge_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_charges.ssl_charge_id
      action_bindings:
        ssl_charges.ssl_charge_id: original_ssl_charge_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the charge date of the charge being refunded
      anchor_source: ssl_charges.charge_date
      relation: not_after
      duration_source: variants.refund_window_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the charge date, counting the day after it as day 1,
        and the last day is included, and after it nothing is refunded (refund_after_window_allowed).
      boundary: inclusive
  - id: refund_once
    applies_to:
    - ssl_refund
    kind: dedup
    condition: Each charge may be refunded only once, and a charge paid from account credit is refunded to account
      credit.
    evidence_fields:
    - ssl_charges.original_ssl_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_charges.original_ssl_charge_id
      action_bindings:
        ssl_charges.original_ssl_charge_id: original_ssl_charge_id
    dedup_contract:
      table: ssl_charges
      mode: separate_record
      object_bindings:
        original_ssl_charge_id: original_ssl_charge_id
      duplicate_filters:
        event_type:
        - ssl_refund
      distinct_fields: []
- id: ssl_revocation
  subject:
  - ssl_revoke
  - ssl_issuance
  rule: The subscriber may have the certificate revoked at any time at revocation_fee, and a revocation that ends
    the subscription refunds nothing unless ssl_refunds applies. When the private key is compromised the current
    certificate is revoked and, where replacement_after_key_compromise is true, a replacement is issued as a free
    reissue under a new key while the subscription continues. Every issued certificate is logged to Certificate
    Transparency where ct_logging is true, and a revoked subscription cannot be reactivated.
  eligibility: []
- id: ssl_installation
  subject:
  - ssl_install_charge
  - ssl_settings_update
  rule: An installation may be ordered only while the subscription status is active. On a Harborline hosting plan
    named as the certificate's hosting_id installation is free and automatic where hosting_install_free is true,
    and on any other server Harborline support installs it for installation_fee. On a Harborline hosting plan a
    paid certificate installed for a name replaces the plan's free AutoSSL certificate for that name, and the two
    are never served for the same name at once. Auto-renew may be switched on or off and the installation plan changed
    at any time while the subscription is pending_validation or active.
  eligibility:
  - id: install_active
    applies_to:
    - ssl_install_charge
    kind: state
    condition: An installation may be ordered only while the subscription status is active.
    evidence_fields:
    - ssl_holdings.certificate_id
    - ssl_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_holdings.certificate_id
      action_bindings:
        ssl_holdings.certificate_id: certificate_id
    state_contract:
      field: ssl_holdings.status
      allowed:
      - active
  - id: settings_status
    applies_to:
    - ssl_settings_update
    kind: state
    condition: Auto-renew may be switched on or off and the installation plan changed at any time while the subscription
      is pending_validation or active.
    evidence_fields:
    - ssl_holdings.certificate_id
    - ssl_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_holdings.certificate_id
