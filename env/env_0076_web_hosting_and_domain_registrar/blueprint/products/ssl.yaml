- id: ssl_lifecycle_clock
  subject:
  - ssl_expire
  - ssl_expiry_reminder
  rule: A subscription whose end date passes unrenewed expires on the day after the end date, and its last certificate
    is never valid beyond that date. Reminders are emailed on each day listed in expiry_reminder_days_before before
    the subscription end date unless the subscription has already been renewed past it. The validity of the current
    certificate and the subscription end date are different dates, and only the subscription end date decides expiry
    of the subscription.
  eligibility: []
