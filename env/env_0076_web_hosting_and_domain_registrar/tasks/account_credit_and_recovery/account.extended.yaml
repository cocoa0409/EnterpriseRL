    rule: >-
      The days the recovery review took are the calendar days from the request's submission date to its decision date.
      The days the review was late are the days the recovery review took less allowed_wait_days. The late-review goodwill figure is per_day_late for each day the review was late.
      For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
      The late-review goodwill granted is the late-review goodwill figure limited in that way and rounded half up to the cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no entry is posted.
    params: [allowed_wait_days, per_day_late, goodwill_max_per_case, goodwill_max_per_365d]
  prerequisite: []
  cross_category:
    - category: hosting
      as: existence
      reads: [status]
      note: An active hosting plan of the customer decides the live-service uplift.
    - category: domain
      as: existence
      reads: [status]
      note: An active domain of the customer decides the live-service uplift where no hosting plan is active.
  compute:
    - rv_submitted: "LATEST('account_recovery_requests','submitted_at', date_field='decided_at', outcome='approved')"
    - rv_decided: "LATEST('account_recovery_requests','decided_at', date_field='decided_at', outcome='approved')"
    - rv_wait_days: "DAYS(rv_submitted, rv_decided) if (rv_decided != None and rv_decided != '') else 0"
    - rv_late_days: "MX(0, rv_wait_days - K('allowed_wait_days'))"
    - rv_basis_days: "MX(0, DAYS(LATEST('account_recovery_requests','submitted_at', date_field='decided_at', outcome='approved'), LATEST('account_recovery_requests','decided_at', date_field='decided_at', outcome='approved')) - K('allowed_wait_days')) if (rv_decided != None and rv_decided != '') else 0"
    - rv_basis: "K('per_started_week') * (-(-rv_basis_days // K('week_late_days'))) if rv_basis_days >= K('week_late_days') else (K('flat_short_wait') if rv_basis_days >= K('short_late_days') else K('per_day_late') * rv_basis_days)"
    - rv_change: "LATEST('account_recovery_requests','requested_change', date_field='decided_at', outcome='approved')"
    - rv_change_mult: "K('mult_both_changes') if rv_change == 'remove_two_factor_and_change_login_email' else (K('mult_email_change') if rv_change == 'change_login_email' else 1.0)"
    - rv_route: "LATEST('account_recovery_requests','recovery_method', date_field='decided_at', outcome='approved')"
    - rv_route_uplift: "K('uplift_government_id') if rv_route == 'government_id' else (K('uplift_pin_and_card') if rv_route == 'pin_and_card' else 0)"
    - rv_lockouts: "COUNT('account_events', within_months=2, date_field='event_at', event_type='account_login_lockout')"
    - rv_lockout_uplift: "K('lockout_many') if rv_lockouts >= 3 else (K('lockout_few') if rv_lockouts >= 1 else 0)"
    - rv_live_hosting: "EXISTS('hosting', status='active')"
    - rv_live_domain: "EXISTS('domain', status='active')"
    - rv_live_uplift: "K('live_hosting') if rv_live_hosting else (K('live_domains') if (rv_live_domain and not rv_live_hosting) else 0)"
    - rv_figure: "0 if rv_wait_days <= K('allowed_wait_days') else rv_basis * rv_change_mult + rv_route_uplift + rv_lockout_uplift + rv_live_uplift"
    - rv_year_total: "SUM('account_credit_ledger','amount', within_months=12, date_field='entry_date', credit_origin='goodwill')"
    - rv_year_room: "MX(0, P('goodwill_max_per_365d') - rv_year_total)"
    - result: "RND(MN(rv_figure, P('goodwill_max_per_case'), rv_year_room), 2)"
  compute_basis:
    rv_submitted: "The days the recovery review took are the calendar days from the request's submission date to its decision date."
    rv_decided: "for the account's most recently decided approved recovery request whenever Trust and Safety decided it more than allowed_wait_days calendar days after it was submitted;"
    rv_late_days: "The days the review was late are the days the recovery review took less allowed_wait_days."
    rv_wait_days: "The days the recovery review took are the calendar days from the request's submission date to its decision date."
    rv_basis_days: "The days the review was late are the days the recovery review took less allowed_wait_days."
    rv_basis: "where the days the review was late are week_late_days or more, the basis is per_started_week for each started week of those days; where they are short_late_days or more but fewer than week_late_days, the basis is flat_short_wait; where they are fewer than short_late_days, the basis is per_day_late for each of those days."
    rv_change: "The lock-out severity multiplier of the late-review goodwill follows what the request asked to reset:"
    rv_change_mult: "a request to remove two-factor and change the sign-in email takes mult_both_changes, a request to change the sign-in email takes mult_email_change, and a request to remove two-factor only takes one."
    rv_route: "The evidence-burden uplift of the late-review goodwill follows the request's evidence route:"
    rv_route_uplift: "government_id adds uplift_government_id, pin_and_card adds uplift_pin_and_card, and email_link adds nothing."
    rv_lockouts: "The failed sign-in uplift of the late-review goodwill follows the account's temporary sign-in lockouts that began after the same calendar date two months before today:"
    rv_lockout_uplift: "three or more add lockout_many, one or two add lockout_few, and none add nothing."
    rv_live_hosting: "where the customer holds an active hosting plan, the uplift is live_hosting;"
    rv_live_domain: "where the customer holds no active hosting plan but holds an active domain, the uplift is live_domains; otherwise no uplift is added."
    rv_live_uplift: "The live-service uplift of the late-review goodwill follows the products the customer could not manage while locked out:"
    rv_figure: "Where the schedule's adjustments apply, the late-review goodwill figure is first multiplied by the multiplier that applies, the fixed uplifts that apply are then added, the limits are then applied, and only the final figure is rounded half up to the cent."
    rv_year_total: "For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today,"
    rv_year_room: "a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit;"
    result: "The late-review goodwill granted is the late-review goodwill figure limited in that way and rounded half up to the cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no entry is posted."
  factors:
    - id: review_basis
      effect: method
      decides: rv_basis
      bindings: [rv_basis_days, rv_basis]
      ladder:
        - when: "the days the review was late are week_late_days or more"
          method: "per_started_week for each started week of those days"
        - when: "those days are short_late_days or more but fewer than week_late_days"
          method: "flat_short_wait"
        - when: "otherwise"
          method: "per_day_late for each of those days"
      baseline:
        rv_basis: "K('per_day_late') * rv_late_days"
      evidence: [history, date]
      cross_difficulty: null
    - id: lockout_severity
      effect: parameter
      decides: rv_change_mult
      bindings: [rv_change, rv_change_mult]
      ladder:
        - when: "the request asked to remove two-factor and change the sign-in email"
          value: "K('mult_both_changes')"
        - when: "the request asked to change the sign-in email"
          value: "K('mult_email_change')"
        - when: "otherwise"
          value: "1.0"
      baseline:
        rv_change_mult: "1.0"
      evidence: [history]
      cross_difficulty: null
    - id: evidence_burden
      effect: parameter
      decides: rv_route_uplift
      bindings: [rv_route, rv_route_uplift]
      ladder:
        - when: "the request's evidence route is government_id"
          value: "K('uplift_government_id')"
        - when: "the request's evidence route is pin_and_card"
          value: "K('uplift_pin_and_card')"
        - when: "otherwise"
          value: "0"
      baseline:
        rv_route_uplift: "0"
      evidence: [history]
      cross_difficulty: null
    - id: failed_signins
      effect: parameter
      decides: rv_lockout_uplift
      bindings: [rv_lockouts, rv_lockout_uplift]
      ladder:
        - when: "three or more temporary sign-in lockouts began after the same calendar date two months before today"
          value: "K('lockout_many')"
        - when: "one or two such lockouts"
          value: "K('lockout_few')"
        - when: "otherwise"
          value: "0"
      baseline:
        rv_lockout_uplift: "0"
      evidence: [history]
      cross_difficulty: null
    - id: live_services
      effect: parameter
      decides: rv_live_uplift
      bindings: [rv_live_hosting, rv_live_domain, rv_live_uplift]
      ladder:
        - when: "the customer holds an active hosting plan"
          value: "K('live_hosting')"
        - when: "the customer holds no active hosting plan and holds an active domain"
          value: "K('live_domains')"
        - when: "otherwise"
          value: "0"
      baseline:
        rv_live_uplift: "0"
      evidence: [cross_category]
      cross_difficulty: hosting
  inputs:
    history:
      - {table: account_recovery_requests, aggregate: latest, field: decided_at, filters: {outcome: approved}}
      - {table: account_events, aggregate: count, field: event_at, within_months: 2, filters: {event_type: account_login_lockout}}
      - {table: account_credit_ledger, aggregate: sum, field: amount, within_months: 12, filters: {credit_origin: goodwill}}
    cross_category: [hosting, domain]
- id: account_ext_duplicate_renewal_goodwill
  base_policy_refs: [account_goodwill, account_refund_credit]
  overwrite:
    - base_policy: account_goodwill
      superseded_clause: >-
        A grant may not exceed the tier's goodwill_max_per_case, nor bring account_msr_goodwill_365d above goodwill_max_per_365d, and a request beyond either limit is granted only up to the remaining limit.
      replaced_by: >-
        For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
  trigger: state_due
  subject: [account_goodwill_credit]
  computes: amount
  target_tool: grant_duplicate_charge_goodwill_d451e88f
  params:
    base_share: 0.25
    week_lag_days: 7
    short_lag_days: 3
    per_started_week: 3.0
    flat_short_lag: 6.0
    uplift_card_refund_to_card: 4.0
    uplift_card_refund_to_credit: 3.0
    size_large: 50.0
    size_mid: 15.0
    uplift_size_large: 5.0
    uplift_size_mid: 2.0
    uplift_partner_top: 4.0
    uplift_partner: 2.0
  rule: >-
    Harborline's published goodwill schedule for same-day duplicate domain auto-renew charges credits goodwill to
    the account, without the customer having to ask, for the customer's most recently refunded domain auto-renew
    charge, meaning the domain refund line of charge type auto_renew with the latest refund date, where no other domain
    auto-renew refund line shares that refund date, whenever the refunded charge's domain shows two or more auto-renew
    charge lines dated the same day as that charge; a refunded auto-renew charge without such a same-day twin, or a
    latest refund date shared by another auto-renew refund line, is outside this schedule.
    Goodwill credit may be granted only while the account status is active, one grant may be made per affected
    holding or charge reference, and the grant is posted against the order number of the refunded duplicate charge
    with domain as the affected category.
    The days until the duplicate was refunded are the calendar days from the duplicate charge's date to its refund
    line's date.
    The duplicate-charge goodwill figure is base_share of the duplicate charge's amount.
    For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
    The duplicate-charge goodwill granted is the duplicate-charge goodwill figure limited in that way and rounded
    half up to the cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no
    entry is posted.
    Where the schedule's adjustments apply, the fixed uplifts that apply are added to the duplicate-charge goodwill figure, the
    limits are then applied, and only the final figure is rounded half up to the cent.
    The compensation basis of the duplicate-charge goodwill depends on how long the duplicate stood: where the days
    until the duplicate was refunded are week_lag_days or more, the basis is the duplicate charge's full amount plus
    per_started_week for each started week of those days; where they are short_lag_days or more but fewer than
    week_lag_days, the basis is flat_short_lag; where they are fewer than short_lag_days, the basis is base_share of
    the duplicate charge's amount.
    The funding-route uplift of the duplicate-charge goodwill follows how the duplicate was paid and where its refund line sent the money: a duplicate taken from a card or PayPal and refunded to that original payment method, which reaches the customer only after the card or PayPal processing time, adds uplift_card_refund_to_card; a duplicate taken from a card or PayPal and refunded to account credit at the customer's election, its refund credit entry for the duplicate's order number being on the account's credit ledger, adds uplift_card_refund_to_credit; any other duplicate, such as one paid from account credit and so refunded to account credit, adds nothing.
    The size uplift of the duplicate-charge goodwill follows the duplicate charge's amount: size_large or more adds
    uplift_size_large, size_mid or more but less than size_large adds uplift_size_mid, and less than size_mid adds
    nothing.
    The partner uplift of the duplicate-charge goodwill follows the account's current tier and its tier changed date: an account whose current tier is Harborline Reseller Gold or Harborline Reseller Platinum and whose tier changed date is on or before the duplicate's charge date adds uplift_partner_top; an account whose current tier is Harborline Reseller Bronze or Harborline Reseller Silver and whose tier changed date is on or before that date adds uplift_partner; any other account, including one whose tier changed date is after that date whatever tier it held before, adds nothing.
  baseline:
    rule: >-
      The days until the duplicate was refunded are the calendar days from the duplicate charge's date to its refund
      line's date.
      The duplicate-charge goodwill figure is base_share of the duplicate charge's amount.
      For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
      The duplicate-charge goodwill granted is the duplicate-charge goodwill figure limited in that way and rounded
      half up to the cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no
      entry is posted.
    params: [base_share, goodwill_max_per_case, goodwill_max_per_365d]
  prerequisite: []
  cross_category:
    - category: domain
      as: history
      reads: [domain_charges.charge_date, domain_charges.amount, domain_charges.payment_method, domain_charges.original_domain_charge_id, domain_charges.domain_id, domain_charges.order_ref, domain_charges.refund_destination]
      note: The refunded duplicate, its same-day twin, its payment and its refund line decide the basis and the uplifts.
  compute:
    - du_refund_date: "XLATEST('domain','domain_charges','charge_date', date_field='charge_date', event_type='domain_refund', charge_type='auto_renew')"
    - du_refund_lines_that_day: "XCOUNT('domain','domain_charges', event_type='domain_refund', charge_type='auto_renew', charge_date=du_refund_date) if du_refund_date != None else 0"
    - du_dup_id: "XLATEST('domain','domain_charges','original_domain_charge_id', date_field='charge_date', event_type='domain_refund', charge_type='auto_renew')"
    - du_dup_date: "XLATEST('domain','domain_charges','charge_date', date_field='charge_date', domain_charge_id=du_dup_id)"
    - du_dup_domain: "XLATEST('domain','domain_charges','domain_id', date_field='charge_date', domain_charge_id=du_dup_id)"
    - du_dup_amount: "XLATEST('domain','domain_charges','amount', date_field='charge_date', domain_charge_id=du_dup_id) or 0"
    - du_twin_lines: "XCOUNT('domain','domain_charges', domain_id=du_dup_domain, charge_date=du_dup_date, event_type='domain_renewal_charge', charge_type='auto_renew')"
    - du_basis_lag: "DAYS(XLATEST('domain','domain_charges','charge_date', date_field='charge_date', domain_charge_id=du_dup_id), du_refund_date) if (du_refund_date != None and du_dup_date != None) else 0"
    - du_basis: "du_dup_amount + K('per_started_week') * (-(-du_basis_lag // K('week_lag_days'))) if du_basis_lag >= K('week_lag_days') else (K('flat_short_lag') if du_basis_lag >= K('short_lag_days') else K('base_share') * du_dup_amount)"
    - du_dup_method: "XLATEST('domain','domain_charges','payment_method', date_field='charge_date', domain_charge_id=du_dup_id)"
    - du_size_amount: "XLATEST('domain','domain_charges','amount', date_field='charge_date', domain_charge_id=du_dup_id) or 0"
    - du_size_uplift: "K('uplift_size_large') if du_size_amount >= K('size_large') else (K('uplift_size_mid') if du_size_amount >= K('size_mid') else 0)"
    - du_refund_dest: "XLATEST('domain','domain_charges','refund_destination', date_field='charge_date', event_type='domain_refund', charge_type='auto_renew')"
    - du_dup_order: "XLATEST('domain','domain_charges','order_ref', date_field='charge_date', domain_charge_id=du_dup_id)"
    - du_refund_entries: "COUNT('account_credit_ledger', credit_origin='refund', source_charge_ref=du_dup_order)"
    - du_route_uplift: "K('uplift_card_refund_to_card') if ((du_dup_method == 'card' or du_dup_method == 'paypal') and du_refund_dest == 'original_payment_method') else (K('uplift_card_refund_to_credit') if ((du_dup_method == 'card' or du_dup_method == 'paypal') and du_refund_dest == 'account_credit' and du_refund_entries >= 1) else 0)"
    - du_tier_since: "DAYS(F('tier_changed_date'), du_dup_date) if (du_dup_date != None and F('tier_changed_date') != None and F('tier_changed_date') != '') else -1"
    - du_partner_uplift: "K('uplift_partner_top') if ((F('variant_name') == 'Harborline Reseller Gold' or F('variant_name') == 'Harborline Reseller Platinum') and du_tier_since >= 0) else (K('uplift_partner') if ((F('variant_name') == 'Harborline Reseller Bronze' or F('variant_name') == 'Harborline Reseller Silver') and du_tier_since >= 0) else 0)"
    - du_figure: "0 if (du_twin_lines < 2 or du_refund_lines_that_day != 1) else du_basis + du_route_uplift + du_size_uplift + du_partner_uplift"
    - du_year_total: "SUM('account_credit_ledger','amount', within_months=12, date_field='entry_date', credit_origin='goodwill')"
    - du_year_room: "MX(0, P('goodwill_max_per_365d') - du_year_total)"
    - result: "RND(MN(du_figure, P('goodwill_max_per_case'), du_year_room), 2)"
  compute_basis:
    du_refund_date: "for the customer's most recently refunded domain auto-renew charge, meaning the domain refund line of charge type auto_renew with the latest refund date,"
