  rule: >-
    Harborline's published goodwill schedule for late recovery review decisions credits goodwill to the account,
    without the customer having to ask, for the account's most recently decided approved recovery request whenever Trust and Safety decided it more than allowed_wait_days calendar days after it was submitted; a request decided within that time, and a rejected or withdrawn request, is outside this schedule. Because the published review time is recovery_review_business_days business days and no span of that many business days, weekends and US federal holidays included, reaches allowed_wait_days calendar days, a request decided later than that has always missed it.
    Goodwill credit may be granted only while the account status is active, one grant may be made per affected
    holding or charge reference, and the grant is posted against the recovery request's reference number with no
    product category.
    The days the recovery review took are the calendar days from the request's submission date to its decision date.
    The days the review was late are the days the recovery review took less allowed_wait_days. The late-review goodwill figure is per_day_late for each day the review was late.
    For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
    The late-review goodwill granted is the late-review goodwill figure limited in that way and rounded half up to the cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no entry is posted.
    Where the schedule's adjustments apply, the late-review goodwill figure is first multiplied by the multiplier
    that applies, the fixed uplifts that apply are then added, the limits are then applied, and only the final figure
    is rounded half up to the cent.
    The compensation basis of the late-review goodwill depends on how late the review was: where the days the review was late are week_late_days or more, the basis is per_started_week for each started week of those days; where they are short_late_days or more but fewer than week_late_days, the basis is flat_short_wait; where they are fewer than short_late_days, the basis is per_day_late for each of those days.
    The lock-out severity multiplier of the late-review goodwill follows what the request asked to reset: a request
    to remove two-factor and change the sign-in email takes mult_both_changes, a request to change the sign-in email
