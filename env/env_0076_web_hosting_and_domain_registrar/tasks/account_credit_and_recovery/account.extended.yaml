      ladder:
        - when: "the account's current tier is Harborline Reseller Gold or Harborline Reseller Platinum and its tier changed date is on or before the duplicate's charge date"
          value: "K('uplift_partner_top')"
        - when: "its current tier is Harborline Reseller Bronze or Harborline Reseller Silver and its tier changed date is on or before that date"
          value: "K('uplift_partner')"
        - when: "otherwise"
          value: "0"
      baseline:
        du_partner_uplift: "0"
      evidence: [date, cross_category]
  inputs:
    history:
      - {table: account_credit_ledger, aggregate: count, field: amount, filters: {credit_origin: refund}}
      - {category: domain, table: domain_charges, aggregate: latest, field: charge_date, filters: {event_type: domain_refund, charge_type: auto_renew}}
      - {table: account_credit_ledger, aggregate: sum, field: amount, within_months: 12, filters: {credit_origin: goodwill}}
    cross_category: [domain]
- id: account_ext_retry_topup
  base_policy_refs: [account_deposits, account_credit_spending, account_tier_benefits]
  overwrite: []
  trigger: on_request
  subject: [account_credit_deposit]
  computes: amount
  target_tool: make_topup_deposit_c7a3772f
  params:
    retry_offset_1: 14
    name_band_1: 10
    name_band_2: 50
    name_band_rate_1: 0.6
    name_band_rate_2: 0.4
    revetting_fee_ov: 29.0
    revetting_fee_ev: 49.0
    domain_credit_harborline_dns: 6.0
    domain_credit_external_dns: 3.0
    retry_offset_2: 7
    retry_offset_3: 1
    attempt_offset_1: 7
    attempt_offset_2: 3
    attempt_offset_3: 1
  rule: >-
    This policy sets the amount of the top-up deposit a holder makes so that account credit pays the next retry of a domain auto-renewal that the card declined. The domain concerned is the domain of the most recently recorded declined domain auto-renew attempt while that domain is still active and its expiry date is today or later; its next retry is the first of the days retry_offset_1, retry_offset_2 and retry_offset_3 calendar days before its expiry date, the domain charter's auto_renew_retry_days_before_expiry, that is today or later. Where two declined domain auto-renew attempts share that latest recorded time, the domain concerned cannot be told from the records and the customer is outside this policy. A deposit for any other purpose is the amount the holder chooses, under the base deposit rule.
    It handles a customer who holds at most one active hosting plan with auto-renew on, which has no scheduled downgrade, and at most one active email subscription with auto-renew on, which is neither billed annually in monthly instalments nor scheduled to change product, who holds at most one active site security plan, at most one active server and at most one active certificate subscription with auto-renew on, whose server, if any, carries no add-ons, meaning no extra IPv4 addresses, no backups, no managed support and no control panel licence, and whose account's most recent tier review neither started a downgrade grace nor found a downgrade due; any other customer's top-up is the amount the holder chooses, under the base deposit rule.
    A deposit may be accepted only while the account status is active, a single deposit must be at least min_deposit_amount and at most max_deposit_per_transaction and must use one of the tier's deposit_methods, a bank transfer must be at least bank_transfer_min_amount, and a deposit that would raise credit_balance above max_credit_balance is refused in full, never accepted in part.
    Because account credit pays an auto-renew charge only when the credit balance covers the whole charge, the top-up covers the retry charge in full.
    Because every auto-renew charge in any category tries credit first, the top-up also covers in full each charge described below whose next auto-renew attempt falls from today up to the day before the retry, which credit would otherwise pay first: the charges of the customer's hosting plan, email subscription, site security plan, server and certificate subscription; charges of any other holding, such as another domain's, are not counted by the top-up.
    A product's next auto-renew attempt is the first of its first attempt day and its retry days that is today or later: for the hosting plan and the email subscription the days attempt_offset_1, attempt_offset_2 and attempt_offset_3 calendar days before its term end date, the hosting charter's auto_renew_days_before_term_end with its auto_renew_retry_days_before_term_end and the email charter's auto_renew_days_before_end with its auto_renew_retry_days_before_end; for the site security plan, the server and the certificate subscription, which have no retry days, the single day auto_renew_days_before_term_end or auto_renew_days_before_end calendar days before the end date under their charters.
    The retry charge is the domain's TLD renewal_price times auto_renew_term_years, reduced by the account tier's domain_renewal_discount_pct and rounded half up to the cent, plus icann_fee_per_year times those years, which is never discounted.
    The credit the retry needs is the retry charge together with every other counted charge, all added together, less every discount that applies.
    The credit balance counted is the sum of all the account's credit ledger entries.
    The top-up deposit is the credit the retry needs less the credit balance; where that is zero or less no top-up is needed and none is taken, and otherwise the top-up is at least min_deposit_amount and is rounded half up to the cent.
    A top-up that would exceed max_deposit_per_transaction, or that would raise the credit balance above max_credit_balance, is refused in full and no top-up is taken.
    The hosting plan the top-up counts is the customer's active hosting plan with auto-renew on when its next auto-renew attempt falls before the retry; its charge is reduced by the account tier's hosting_discount_pct, the discount being the charge less the reduced charge rounded half up to the cent. The term rate of the top-up's plan renewal follows the term length the plan's new term will have, which is the term of a term change scheduled for the plan where one is scheduled and otherwise its current term length: a counted plan whose new term is 36 months is priced at renewal_rate_36mo times 36, one whose new term is 24 months at renewal_rate_24mo times 24, one whose new term is 1 month at monthly_rate_no_commitment with no setup fee, one whose new term is 12 months at renewal_rate_12mo times 12, and otherwise no hosting charge is counted.
    The email subscription the top-up counts is the customer's active email subscription with auto-renew on when its next auto-renew attempt falls before the retry; its renewal falls due on its term end date while it is active, so it is a term renewal under the email charter's published term-renewal rule, billed at the product's current seat price for the renewed seats, and where the product's account_discount_applies is true its charge is reduced by the account tier's email_discount_pct, the discount being the charge less the reduced charge rounded half up to the cent, while Microsoft 365 seats are never discounted. The renewed seats of the top-up's email renewal are, where a scheduled seat count is set, the lower of the scheduled seat count and the seat count, but never fewer than the mailboxes in use, and otherwise the mailboxes in use; the mailboxes in use are the seat count less the idle seats, the mailbox deletions recorded on the subscription in the current term less the restores of those deletions, a deletion and its restore counting in the current term where the whole calendar months from the deletion date to today are no more than the whole calendar months from the term start date to today. The email charge of the top-up follows the billing plan: an annual_prepaid subscription is priced at those seats times seat_price_annual_prepaid times 12, a monthly subscription at those seats times seat_price_monthly, and otherwise no email charge is counted.
    The security plan the top-up counts is the customer's active site security plan with auto-renew on when its next auto-renew attempt falls before the retry, priced for its billing term at price_annual for a 12-month term or price_monthly for a 1-month term. The security plan charge of the top-up follows where the site runs: a site whose security plan names an active Harborline hosting plan is charged that price reduced by the higher of the product's hosted_site_discount_pct and the account tier's security_discount_pct, the two never added; a site hosted elsewhere is charged that price reduced by the account tier's security_discount_pct alone; in either case the discount is the price less the reduced price rounded half up to the cent; and otherwise no security plan charge is counted.
    The server the top-up counts is the customer's active server with auto-renew on when its next auto-renew attempt falls before the retry; where the product's account_discount_applies is true its charge is reduced by the account tier's server_discount_pct, the discount being the charge less the reduced charge rounded half up to the cent. The server charge of the top-up follows its billing term: a 24-month term is priced at price_24mo_per_month times 24, a 12-month term at price_12mo_per_month times 12, a 1-month term at price_monthly, and otherwise no server charge is counted.
    The certificate subscription the top-up counts is the customer's active certificate subscription with auto-renew on when its next auto-renew attempt falls before the retry; its charge is the auto-renew charge the ssl charter's published auto-renew rule sets, whichever source pays it. The top-up's certificate renews for the years of its latest term line, its latest renewal or auto-renew line or, where none has been billed, its purchase line, at most the product's max_subscription_years. The top-up's certificate price component is reduced by the account tier's ssl_discount_pct, and its extra names are billed without that percentage at additional_name_price_per_year for each name and each year renewed, each name's yearly price multiplied, on a renewal of two or three years, by the product's per-year price for that term divided by its price_1yr, and, on such a renewal, the names after the first name_band_1 taken at name_band_rate_1 of that price up to the first name_band_2 names and at name_band_rate_2 of it beyond them. That reduced amount, the reduced certificate price component together with the extra-name amount, is rounded half up to the cent; an OV or EV product whose organisation validation, counted as the days from the date it last completed to the current subscription end date plus 365, would be older than the product's org_validation_reuse_days then adds the re-vetting fee, revetting_fee_ov for an OV product or revetting_fee_ev for an EV product; a covered domain that is an active Harborline registration then takes off the Harborline domain credit, domain_credit_harborline_dns on Harborline DNS or domain_credit_external_dns on external nameservers; and that result is rounded half up to the cent. The certificate price component of the top-up follows those years: a three-year renewal is priced at price_3yr_per_year times 3, a two-year renewal at price_2yr_per_year times 2, a one-year renewal at price_1yr, and otherwise no certificate charge is counted.
    The top-up deposit is worked out only after the credit ledger carries a goodwill entry for the active subscription of the customer's most recent initial certificate issuance whenever that certificate was issued more than eleven calendar days after the subscription's documents were complete and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
    The top-up deposit is not fixed until the credit ledger carries a goodwill entry for the account's only security-change notice of the last two months whenever that notice followed the decision of the account's most recent approved recovery request, decided within those two months, the account's sign-in shows the change that request asked for, and the notice came more than one day after the request's waiting period ended, and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
    Before the top-up deposit is worked out, the credit ledger must carry a goodwill entry for the most recent domain refund line returned to account credit whenever no other such refund line shares its date, its refund credit entry was posted more than three calendar days after it, and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
  baseline:
    rule: >-
      Because account credit pays an auto-renew charge only when the credit balance covers the whole charge, the top-up covers the retry charge in full.
      The retry charge is the domain's TLD renewal_price times auto_renew_term_years, reduced by the account tier's domain_renewal_discount_pct and rounded half up to the cent, plus icann_fee_per_year times those years, which is never discounted.
      The credit the retry needs is the retry charge together with every other counted charge, all added together, less every discount that applies.
      The credit balance counted is the sum of all the account's credit ledger entries.
      The top-up deposit is the credit the retry needs less the credit balance; where that is zero or less no top-up is needed and none is taken, and otherwise the top-up is at least min_deposit_amount and is rounded half up to the cent.
      A top-up that would exceed max_deposit_per_transaction, or that would raise the credit balance above max_credit_balance, is refused in full and no top-up is taken.
    params: [domain_renewal_discount_pct, min_deposit_amount, max_deposit_per_transaction, max_credit_balance]
  prerequisite:
    - problem: account_ext_certificate_delay_goodwill
      kind: value_input
      gate: tu_balance
      form: state
      policy_source: >-
        The top-up deposit is worked out only after the credit ledger carries a goodwill entry for the active subscription of the customer's most recent initial certificate issuance whenever that certificate was issued more than eleven calendar days after the subscription's documents were complete and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
      condition: >-
        The account credit ledger holds a goodwill entry whose source charge reference is the order number of the
        new-subscription charge of the active subscription with the most recent initial issuance, when that issuance is
        more than eleven calendar days after the documents-complete date and the yearly goodwill total is below
        goodwill_max_per_365d.
      resolved_by: grant_certificate_delay_goodwill_7e1fd2ff
      effect: >-
        The posted goodwill is spendable credit: the ledger sum rises by its amount and the top-up falls by the same amount.
    - problem: account_ext_reset_delay_goodwill
      kind: value_input
      gate: tu_balance
      form: state
      policy_source: >-
        The top-up deposit is not fixed until the credit ledger carries a goodwill entry for the account's only security-change notice of the last two months whenever that notice followed the decision of the account's most recent approved recovery request, decided within those two months, the account's sign-in shows the change that request asked for, and the notice came more than one day after the request's waiting period ended, and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
      condition: >-
        The account credit ledger holds a goodwill entry whose source charge reference is the reference of the account's
        only security-change notice dated after the same calendar date two months before today, when the most recent approved request was
        decided within those two months, that notice is dated on or after the decision, the account's login_email or two_factor
        shows the change the request asked for, the notice's date is more than one day after the decision date plus
        recovery_hold_hours, and the yearly goodwill total is below goodwill_max_per_365d.
      resolved_by: grant_reset_delay_goodwill_979fb2c3
      effect: >-
        The posted goodwill raises the ledger sum by its amount, so the top-up falls by the same amount.
    - problem: account_ext_refund_posting_goodwill
      kind: value_input
      gate: tu_balance
      form: state
      policy_source: >-
        Before the top-up deposit is worked out, the credit ledger must carry a goodwill entry for the most recent domain refund line returned to account credit whenever no other such refund line shares its date, its refund credit entry was posted more than three calendar days after it, and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
      condition: >-
        The account credit ledger holds a goodwill entry whose source charge reference is the reference of the most
        recent domain refund line returned to account credit, when no other such line shares its date, the refund credit
        entry for the refunded charge's order number is dated more than three calendar days after it, and the yearly
        goodwill total is below goodwill_max_per_365d.
      resolved_by: grant_refund_posting_goodwill_cac8bb9c
      effect: >-
        The posted goodwill raises the ledger sum by its amount, so the top-up falls by the same amount.
  cross_category:
  - category: domain
    as: branch
    reads:
    - domain_id
    - status
    - expiry_date
    - nameservers
    - variant_name
    - domain_events.event_type
    - domain_events.domain_id
    note: The declined domain, its expiry and its TLD prices decide the retry day and the retry charge.
  - category: hosting
    as: branch
    reads:
    - hosting_id
    - status
    - auto_renew
    - term_end_date
    - billing_term_months
    - variant_name
    - hosting_change_requests.request_type
    - hosting_change_requests.target_term_months
    - hosting_change_requests.request_status
    note: The plan, a scheduled term change and its tier rates decide the hosting charge.
  - category: email
    as: branch
    reads:
    - email_plan_id
    - status
    - auto_renew
    - term_end_date
    - billing_plan
    - seat_count
    - scheduled_seat_count
    - scheduled_variant
    - variant_name
    - term_start_date
    - email_events.event_type
    - email_events.event_at
    - email_events.deleted_at
    note: The email subscription, its seats and billing plan decide the email charge.
  - category: security
    as: branch
    reads:
    - hosting_id
    - status
    - auto_renew
    - term_end_date
    - billing_term_months
    - variant_name
    note: The security plan, its term and where its site runs decide the security plan charge.
  - category: server
    as: branch
    reads:
    - status
    - auto_renew
    - term_end_date
    - billing_term_months
    - extra_ipv4
    - backups_enabled
    - managed_support
    - control_panel
    - variant_name
    note: The server, its add-ons and its term decide the server charge.
  - category: ssl
    as: branch
    reads:
    - status
    - auto_renew
    - subscription_end_date
    - extra_names
    - org_validated_date
    - domain_id
    - variant_name
    - ssl_charges.years
    - ssl_charges.event_type
    - ssl_charges.charge_type
    note: The certificate with auto-renew on, its latest term line, validation age and covered domain decide the certificate charge.
  compute:
  - tu_domain: XLATEST('domain','domain_events','domain_id', date_field='event_at', event_type='domain_auto_renew_decline')
  - tu_decline_at: XLATEST('domain','domain_events','event_at', date_field='event_at', event_type='domain_auto_renew_decline')
  - tu_decline_ties: XCOUNT('domain','domain_events', event_type='domain_auto_renew_decline', event_at=tu_decline_at) if tu_decline_at != None else 0
  - tu_expiry: CFIELD('domain','expiry_date', domain_id=tu_domain, status='active')
  - tu_days_left: DAYS(NOW, tu_expiry) if tu_expiry != None else -1
  - tu_retry_in: (tu_days_left - K('retry_offset_1')) if tu_days_left >= K('retry_offset_1') else ((tu_days_left - K('retry_offset_2')) if tu_days_left >= K('retry_offset_2') else ((tu_days_left - K('retry_offset_3')) if tu_days_left >= K('retry_offset_3') else -1))
  - tu_count_window: tu_retry_in
  - tu_plan_id: CFIELD('hosting','hosting_id', status='active', auto_renew=True)
  - tu_plan_count: XCOUNT('hosting','hosting_holdings', status='active', auto_renew=True)
  - tu_mail_count: XCOUNT('email','email_holdings', status='active', auto_renew=True)
  - tu_downgrades: XCOUNT('hosting','hosting_change_requests', request_type='downgrade', request_status='scheduled')
  - tu_mail_billing: CFIELD('email','billing_plan', status='active', auto_renew=True)
  - tu_mail_next_product: CFIELD('email','scheduled_variant', status='active', auto_renew=True)
  - tu_sec_count: XCOUNT('security','security_holdings', status='active')
  - tu_srv_count: XCOUNT('server','server_holdings', status='active')
  - tu_cert_count: XCOUNT('ssl','ssl_holdings', status='active', auto_renew=True)
  - tu_srv_addons: (CFIELD('server','extra_ipv4', status='active') or 0) > 0 or CFIELD('server','backups_enabled', status='active') == True or CFIELD('server','managed_support', status='active') == True or CFIELD('server','control_panel', status='active') == True
  - tu_review: LATEST('account_events','review_result', date_field='event_at', event_type='account_tier_review')
  - tu_in_scope: tu_domain != None and tu_decline_ties == 1 and tu_expiry != None and tu_retry_in >= 0 and tu_plan_count <= 1 and tu_mail_count <= 1 and tu_downgrades == 0 and tu_mail_billing != 'annual_monthly_billing' and (tu_mail_next_product == None or tu_mail_next_product == 'none') and tu_sec_count <= 1 and tu_srv_count <= 1 and tu_cert_count <= 1 and not tu_srv_addons and tu_review != 'grace_started' and tu_review != 'downgrade_due'
  - tu_retry_charge: (RND(CPARAM('domain','renewal_price', domain_id=tu_domain) * CPARAM('domain','auto_renew_term_years', domain_id=tu_domain) * (100 - P('domain_renewal_discount_pct')) / 100 + 0.000000001, 2) + CPARAM('domain','icann_fee_per_year', domain_id=tu_domain) * CPARAM('domain','auto_renew_term_years', domain_id=tu_domain)) if tu_in_scope else 0
  - tu_plan_left: DAYS(NOW, CFIELD('hosting','term_end_date', hosting_id=tu_plan_id)) if tu_plan_id != None else -1
  - tu_plan_attempt_in: (tu_plan_left - K('attempt_offset_1')) if tu_plan_left >= K('attempt_offset_1') else ((tu_plan_left - K('attempt_offset_2')) if tu_plan_left >= K('attempt_offset_2') else ((tu_plan_left - K('attempt_offset_3')) if tu_plan_left >= K('attempt_offset_3') else -1))
  - tu_host_due: tu_in_scope and tu_plan_id != None and tu_plan_attempt_in >= 0 and tu_plan_attempt_in < tu_count_window
  - tu_plan_term: CFIELD('hosting','billing_term_months', hosting_id=tu_plan_id)
  - tu_term_change: XLATEST('hosting','hosting_change_requests','target_term_months', date_field='submitted_at', hosting_id=tu_plan_id, request_type='term_change', request_status='scheduled')
  - tu_host_price: (CPARAM('hosting','renewal_rate_36mo', hosting_id=tu_plan_id) * 36 if (tu_term_change == 36 or (tu_term_change == None and tu_plan_term == 36)) else (CPARAM('hosting','renewal_rate_24mo', hosting_id=tu_plan_id) * 24 if (tu_term_change == 24 or (tu_term_change == None and tu_plan_term == 24)) else (CPARAM('hosting','monthly_rate_no_commitment', hosting_id=tu_plan_id) if (tu_term_change == 1 or (tu_term_change == None and tu_plan_term == 1)) else (CPARAM('hosting','renewal_rate_12mo', hosting_id=tu_plan_id) * 12 if (tu_term_change == 12 or (tu_term_change == None and tu_plan_term == 12)) else 0)))) if tu_host_due else 0
  - tu_host_discount: tu_host_price - RND(tu_host_price * (100 - P('hosting_discount_pct')) / 100 + 0.000000001, 2)
  - tu_mail_id: CFIELD('email','email_plan_id', status='active', auto_renew=True)
  - tu_mail_left: DAYS(NOW, CFIELD('email','term_end_date', email_plan_id=tu_mail_id)) if tu_mail_id != None else -1
  - tu_mail_attempt_in: (tu_mail_left - K('attempt_offset_1')) if tu_mail_left >= K('attempt_offset_1') else ((tu_mail_left - K('attempt_offset_2')) if tu_mail_left >= K('attempt_offset_2') else ((tu_mail_left - K('attempt_offset_3')) if tu_mail_left >= K('attempt_offset_3') else -1))
  - tu_mail_due: tu_in_scope and tu_mail_id != None and tu_mail_attempt_in >= 0 and tu_mail_attempt_in < tu_count_window
  - tu_mail_months: MONTHS(CFIELD('email','term_start_date', email_plan_id=tu_mail_id), NOW) if CFIELD('email','term_start_date', email_plan_id=tu_mail_id) != None else 0
  - tu_mail_deleted: XCOUNT('email','email_events', within_months=tu_mail_months + 1, date_field='event_at', event_type='email_mailbox_delete', email_plan_id=tu_mail_id)
  - tu_mail_restored: XCOUNT('email','email_events', within_months=tu_mail_months + 1, date_field='deleted_at', event_type='email_mailbox_restore', email_plan_id=tu_mail_id)
  - tu_mail_in_use: (CFIELD('email','seat_count', email_plan_id=tu_mail_id) or 0) - MX(0, tu_mail_deleted - tu_mail_restored)
  - tu_mail_seats: MX(MN(CFIELD('email','scheduled_seat_count', email_plan_id=tu_mail_id), CFIELD('email','seat_count', email_plan_id=tu_mail_id)), tu_mail_in_use) if (CFIELD('email','scheduled_seat_count', email_plan_id=tu_mail_id) or 0) > 0 else tu_mail_in_use
  - tu_mail_price: tu_mail_seats * CPARAM('email','seat_price_annual_prepaid', email_plan_id=tu_mail_id) * 12 if (tu_mail_due and CFIELD('email','billing_plan', email_plan_id=tu_mail_id) == 'annual_prepaid') else (tu_mail_seats * CPARAM('email','seat_price_monthly', email_plan_id=tu_mail_id) if (tu_mail_due and CFIELD('email','billing_plan', email_plan_id=tu_mail_id) == 'monthly') else 0)
  - tu_mail_discount: (tu_mail_price - RND(tu_mail_price * (100 - P('email_discount_pct')) / 100 + 0.000000001, 2)) if CPARAM('email','account_discount_applies', email_plan_id=tu_mail_id) == True else 0
  - tu_sec_end: CFIELD('security','term_end_date', status='active', auto_renew=True)
  - tu_sec_due: tu_in_scope and tu_sec_end != None and DAYS(NOW, tu_sec_end) - CPARAM('security','auto_renew_days_before_term_end', status='active', auto_renew=True) >= 0 and DAYS(NOW, tu_sec_end) - CPARAM('security','auto_renew_days_before_term_end', status='active', auto_renew=True) < tu_count_window
  - tu_sec_list: (CPARAM('security','price_annual', status='active', auto_renew=True) if CFIELD('security','billing_term_months', status='active', auto_renew=True) == 12 else CPARAM('security','price_monthly', status='active', auto_renew=True)) if tu_sec_due else 0
  - tu_sec_on_plan: EXISTS('hosting', hosting_id=CFIELD('security','hosting_id', status='active', auto_renew=True), status='active')
  - tu_sec_charge: (tu_sec_list - (tu_sec_list - RND(tu_sec_list * (100 - MX(CPARAM('security','hosted_site_discount_pct', status='active', auto_renew=True) or 0, P('security_discount_pct'))) / 100 + 0.000000001, 2))) if (tu_sec_due and tu_sec_on_plan) else ((tu_sec_list - (tu_sec_list - RND(tu_sec_list * (100 - P('security_discount_pct')) / 100 + 0.000000001, 2))) if tu_sec_due else 0)
  - tu_srv_end: CFIELD('server','term_end_date', status='active', auto_renew=True)
  - tu_srv_due: tu_in_scope and tu_srv_end != None and DAYS(NOW, tu_srv_end) - CPARAM('server','auto_renew_days_before_term_end', status='active', auto_renew=True) >= 0 and DAYS(NOW, tu_srv_end) - CPARAM('server','auto_renew_days_before_term_end', status='active', auto_renew=True) < tu_count_window
  - tu_srv_term: CFIELD('server','billing_term_months', status='active', auto_renew=True)
  - tu_srv_price: CPARAM('server','price_24mo_per_month', status='active', auto_renew=True) * 24 if (tu_srv_due and tu_srv_term == 24) else (CPARAM('server','price_12mo_per_month', status='active', auto_renew=True) * 12 if (tu_srv_due and tu_srv_term == 12) else (CPARAM('server','price_monthly', status='active', auto_renew=True) if (tu_srv_due and tu_srv_term == 1) else 0))
  - tu_srv_discount: (tu_srv_price - RND(tu_srv_price * (100 - P('server_discount_pct')) / 100 + 0.000000001, 2)) if CPARAM('server','account_discount_applies', status='active', auto_renew=True) == True else 0
  - tu_cert_end: CFIELD('ssl','subscription_end_date', status='active', auto_renew=True)
  - tu_cert_due: tu_in_scope and tu_cert_end != None and DAYS(NOW, tu_cert_end) - CPARAM('ssl','auto_renew_days_before_end', status='active', auto_renew=True) >= 0 and DAYS(NOW, tu_cert_end) - CPARAM('ssl','auto_renew_days_before_end', status='active', auto_renew=True) < tu_count_window
  - tu_cert_id: CFIELD('ssl','certificate_id', status='active', auto_renew=True)
  - tu_cert_line_years: XLATEST('ssl','ssl_charges','years', date_field='charge_date', certificate_id=tu_cert_id, event_type='ssl_renewal_charge') if XLATEST('ssl','ssl_charges','years', date_field='charge_date', certificate_id=tu_cert_id, event_type='ssl_renewal_charge') != None else XLATEST('ssl','ssl_charges','years', date_field='charge_date', certificate_id=tu_cert_id, event_type='ssl_purchase_charge', charge_type='new_subscription')
  - tu_cert_years: MN(tu_cert_line_years, CPARAM('ssl','max_subscription_years', status='active', auto_renew=True)) if (tu_cert_due and tu_cert_line_years != None) else 0
  - tu_cert_price: CPARAM('ssl','price_3yr_per_year', status='active', auto_renew=True) * 3 if (tu_cert_due and tu_cert_years == 3) else (CPARAM('ssl','price_2yr_per_year', status='active', auto_renew=True) * 2 if (tu_cert_due and tu_cert_years == 2) else (CPARAM('ssl','price_1yr', status='active', auto_renew=True) if (tu_cert_due and tu_cert_years == 1) else 0))
  - tu_cert_n: CFIELD('ssl','extra_names', status='active', auto_renew=True) or 0
  - tu_cert_name_rate: (CPARAM('ssl','additional_name_price_per_year', status='active', auto_renew=True) or 0) * (CPARAM('ssl','price_3yr_per_year', status='active', auto_renew=True) / CPARAM('ssl','price_1yr', status='active', auto_renew=True) if tu_cert_years == 3 else (CPARAM('ssl','price_2yr_per_year', status='active', auto_renew=True) / CPARAM('ssl','price_1yr', status='active', auto_renew=True) if tu_cert_years == 2 else 1))
  - tu_cert_name_units: (MN(tu_cert_n, K('name_band_1')) + K('name_band_rate_1') * MX(0, MN(tu_cert_n, K('name_band_2')) - K('name_band_1')) + K('name_band_rate_2') * MX(0, tu_cert_n - K('name_band_2'))) if tu_cert_years > 1 else tu_cert_n
  - tu_cert_names: tu_cert_name_rate * tu_cert_name_units * tu_cert_years
  - tu_cert_fee: (K('revetting_fee_ov') if CPARAM('ssl','validation_level', status='active', auto_renew=True) == 'ov' else (K('revetting_fee_ev') if CPARAM('ssl','validation_level', status='active', auto_renew=True) == 'ev' else 0)) if ((CPARAM('ssl','validation_level', status='active', auto_renew=True) == 'ov' or CPARAM('ssl','validation_level', status='active', auto_renew=True) == 'ev') and CFIELD('ssl','org_validated_date', status='active', auto_renew=True) != None and CFIELD('ssl','org_validated_date', status='active', auto_renew=True) != '' and (DAYS(CFIELD('ssl','org_validated_date', status='active', auto_renew=True), tu_cert_end) + 365 > CPARAM('ssl','org_validation_reuse_days', status='active', auto_renew=True))) else 0
  - tu_cert_dom: CFIELD('ssl','domain_id', status='active', auto_renew=True)
  - tu_cert_credit: (K('domain_credit_harborline_dns') if CFIELD('domain','nameservers', domain_id=tu_cert_dom, status='active') == 'harborline_dns' else (K('domain_credit_external_dns') if CFIELD('domain','nameservers', domain_id=tu_cert_dom, status='active') == 'external' else 0)) if tu_cert_dom != None else 0
  - tu_cert_charge: RND(RND(tu_cert_price * (100 - P('ssl_discount_pct')) / 100 + tu_cert_names + 0.000000001, 2) + tu_cert_fee - tu_cert_credit + 0.000000001, 2) if tu_cert_price > 0 else 0
  - tu_needed: tu_retry_charge + tu_host_price - tu_host_discount + tu_mail_price - tu_mail_discount + tu_sec_charge + tu_srv_price - tu_srv_discount + tu_cert_charge
  - tu_balance: SUM('account_credit_ledger','amount')
  - tu_shortfall: tu_needed - tu_balance
  - tu_topup: MX(P('min_deposit_amount'), tu_shortfall)
  - result: 0 if (not tu_in_scope or tu_shortfall <= 0 or tu_topup > P('max_deposit_per_transaction') or tu_balance + tu_topup > P('max_credit_balance')) else RND(tu_topup + 0.000000001, 2)
  compute_basis:
    tu_domain: The domain concerned is the domain of the most recently recorded declined domain auto-renew attempt while that domain is still active and its expiry date is today or later;
    tu_decline_at: Where two declined domain auto-renew attempts share that latest recorded time, the domain concerned cannot be told from the records and the customer is outside this policy.
    tu_decline_ties: Where two declined domain auto-renew attempts share that latest recorded time, the domain concerned cannot be told from the records and the customer is outside this policy.
    tu_expiry: The domain concerned is the domain of the most recently recorded declined domain auto-renew attempt while that domain is still active and its expiry date is today or later;
    tu_days_left: its next retry is the first of the days retry_offset_1, retry_offset_2 and retry_offset_3 calendar days before its expiry date,
    tu_retry_in: the domain charter's auto_renew_retry_days_before_expiry, that is today or later.
    tu_count_window: 'Because every auto-renew charge in any category tries credit first, the top-up also covers in full each charge described below whose next auto-renew attempt falls from today up to the day before the retry, which credit would otherwise pay first:'
    tu_plan_id: The hosting plan the top-up counts is the customer's active hosting plan with auto-renew on
    tu_downgrades: which has no scheduled downgrade,
    tu_mail_billing: which is neither billed annually in monthly instalments nor scheduled to change product,
    tu_mail_next_product: which is neither billed annually in monthly instalments nor scheduled to change product,
    tu_sec_count: who holds at most one active site security plan,
    tu_srv_count: at most one active server
    tu_cert_count: and at most one active certificate subscription with auto-renew on,
    tu_srv_addons: whose server, if any, carries no add-ons, meaning no extra IPv4 addresses, no backups, no managed support and no control panel licence,
    tu_review: and whose account's most recent tier review neither started a downgrade grace nor found a downgrade due;
    tu_in_scope: any other customer's top-up is the amount the holder chooses, under the base deposit rule.
    tu_retry_charge: The retry charge is the domain's TLD renewal_price times auto_renew_term_years, reduced by the account tier's domain_renewal_discount_pct and rounded half up to the cent, plus icann_fee_per_year times those years, which is never discounted.
    tu_plan_count: It handles a customer who holds at most one active hosting plan with auto-renew on,
    tu_plan_left: for the hosting plan and the email subscription the days attempt_offset_1, attempt_offset_2 and attempt_offset_3 calendar days before its term end date,
    tu_plan_attempt_in: 'A product''s next auto-renew attempt is the first of its first attempt day and its retry days that is today or later:'
    tu_host_due: The hosting plan the top-up counts is the customer's active hosting plan with auto-renew on when its next auto-renew attempt falls before the retry;
    tu_plan_term: 'which is the term of a term change scheduled for the plan where one is scheduled and otherwise its current term length:'
    tu_term_change: 'which is the term of a term change scheduled for the plan where one is scheduled and otherwise its current term length:'
    tu_host_price: a counted plan whose new term is 36 months is priced at renewal_rate_36mo times 36, one whose new term is 24 months at renewal_rate_24mo times 24, one whose new term is 1 month at monthly_rate_no_commitment with no setup fee, one whose new term is 12 months at renewal_rate_12mo times 12, and otherwise no hosting charge is counted.
    tu_host_discount: its charge is reduced by the account tier's hosting_discount_pct, the discount being the charge less the reduced charge rounded half up to the cent.
    tu_mail_count: and at most one active email subscription with auto-renew on,
    tu_mail_id: The email subscription the top-up counts is the customer's active email subscription with auto-renew on when its next auto-renew attempt falls before the retry;
    tu_mail_left: the email charter's auto_renew_days_before_end with its auto_renew_retry_days_before_end;
    tu_mail_attempt_in: the email charter's auto_renew_days_before_end with its auto_renew_retry_days_before_end;
    tu_mail_due: The email subscription the top-up counts is the customer's active email subscription with auto-renew on when its next auto-renew attempt falls before the retry;
    tu_mail_months: a deletion and its restore counting in the current term where the whole calendar months from the deletion date to today are no more than the whole calendar months from the term start date to today.
    tu_mail_deleted: the mailbox deletions recorded on the subscription in the current term less the restores of those deletions,
    tu_mail_restored: the mailbox deletions recorded on the subscription in the current term less the restores of those deletions,
    tu_mail_in_use: the mailboxes in use are the seat count less the idle seats,
    tu_mail_seats: The renewed seats of the top-up's email renewal are, where a scheduled seat count is set, the lower of the scheduled seat count and the seat count, but never fewer than the mailboxes in use, and otherwise the mailboxes in use;
    tu_mail_price: 'The email charge of the top-up follows the billing plan: an annual_prepaid subscription is priced at those seats times seat_price_annual_prepaid times 12, a monthly subscription at those seats times seat_price_monthly, and otherwise no email charge is counted.'
    tu_mail_discount: and where the product's account_discount_applies is true its charge is reduced by the account tier's email_discount_pct, the discount being the charge less the reduced charge rounded half up to the cent, while Microsoft 365 seats are never discounted.
    tu_sec_end: The security plan the top-up counts is the customer's active site security plan with auto-renew on when its next auto-renew attempt falls before the retry,
    tu_sec_due: for the site security plan, the server and the certificate subscription, which have no retry days, the single day auto_renew_days_before_term_end or auto_renew_days_before_end calendar days before the end date under their charters.
    tu_sec_list: priced for its billing term at price_annual for a 12-month term or price_monthly for a 1-month term.
    tu_sec_on_plan: a site whose security plan names an active Harborline hosting plan
    tu_sec_charge: 'The security plan charge of the top-up follows where the site runs: a site whose security plan names an active Harborline hosting plan is charged that price reduced by the higher of the product''s hosted_site_discount_pct and the account tier''s security_discount_pct, the two never added; a site hosted elsewhere is charged that price reduced by the account tier''s security_discount_pct alone; in either case the discount is the price less the reduced price rounded half up to the cent; and otherwise no security plan charge is counted.'
    tu_srv_end: The server the top-up counts is the customer's active server with auto-renew on when its next auto-renew attempt falls before the retry;
    tu_srv_due: The server the top-up counts is the customer's active server with auto-renew on when its next auto-renew attempt falls before the retry;
    tu_srv_term: 'The server charge of the top-up follows its billing term:'
    tu_srv_price: a 24-month term is priced at price_24mo_per_month times 24, a 12-month term at price_12mo_per_month times 12, a 1-month term at price_monthly, and otherwise no server charge is counted.
    tu_srv_discount: where the product's account_discount_applies is true its charge is reduced by the account tier's server_discount_pct, the discount being the charge less the reduced charge rounded half up to the cent.
    tu_cert_end: The certificate subscription the top-up counts is the customer's active certificate subscription with auto-renew on when its next auto-renew attempt falls before the retry;
    tu_cert_due: The certificate subscription the top-up counts is the customer's active certificate subscription with auto-renew on when its next auto-renew attempt falls before the retry;
    tu_cert_id: its charge is the auto-renew charge the ssl charter's published auto-renew rule sets, whichever source pays it.
    tu_cert_line_years: The top-up's certificate renews for the years of its latest term line, its latest renewal or auto-renew line or, where none has been billed, its purchase line,
    tu_cert_years: at most the product's max_subscription_years.
    tu_cert_price: 'The certificate price component of the top-up follows those years: a three-year renewal is priced at price_3yr_per_year times 3, a two-year renewal at price_2yr_per_year times 2, a one-year renewal at price_1yr, and otherwise no certificate charge is counted.'
    tu_cert_n: and its extra names are billed without that percentage at additional_name_price_per_year for each name and each year renewed,
    tu_cert_name_rate: each name's yearly price multiplied, on a renewal of two or three years, by the product's per-year price for that term divided by its price_1yr,
    tu_cert_name_units: the names after the first name_band_1 taken at name_band_rate_1 of that price up to the first name_band_2 names and at name_band_rate_2 of it beyond them.
    tu_cert_names: and its extra names are billed without that percentage at additional_name_price_per_year for each name and each year renewed,
    tu_cert_fee: an OV or EV product whose organisation validation, counted as the days from the date it last completed to the current subscription end date plus 365, would be older than the product's org_validation_reuse_days then adds the re-vetting fee, revetting_fee_ov for an OV product or revetting_fee_ev for an EV product;
    tu_cert_dom: a covered domain that is an active Harborline registration then takes off the Harborline domain credit, domain_credit_harborline_dns on Harborline DNS or domain_credit_external_dns on external nameservers;
    tu_cert_credit: a covered domain that is an active Harborline registration then takes off the Harborline domain credit, domain_credit_harborline_dns on Harborline DNS or domain_credit_external_dns on external nameservers;
    tu_cert_charge: The top-up's certificate price component is reduced by the account tier's ssl_discount_pct,
    tu_needed: The credit the retry needs is the retry charge together with every other counted charge, all added together, less every discount that applies.
    tu_balance: The credit balance counted is the sum of all the account's credit ledger entries.
    tu_shortfall: The top-up deposit is the credit the retry needs less the credit balance;
    tu_topup: where that is zero or less no top-up is needed and none is taken, and otherwise the top-up is at least min_deposit_amount and is rounded half up to the cent.
    result: A top-up that would exceed max_deposit_per_transaction, or that would raise the credit balance above max_credit_balance, is refused in full and no top-up is taken.
  factors:
  - id: plan_renewal_term
    effect: parameter
    decides: tu_host_price
    bindings:
    - tu_plan_id
    - tu_plan_left
    - tu_plan_attempt_in
    - tu_host_due
    - tu_plan_term
    - tu_term_change
    - tu_host_price
    - tu_host_discount
    ladder:
    - when: the plan is counted and a term change to 36 months is scheduled for it, or none is scheduled and it is on a 36-month term
      value: renewal_rate_36mo times 36
    - when: the plan is counted and its new term, scheduled or current, is 24 months
      value: renewal_rate_24mo times 24
    - when: the plan is counted and its new term, scheduled or current, is 1 month
      value: monthly_rate_no_commitment
    - when: the plan is counted and its new term, scheduled or current, is 12 months
      value: renewal_rate_12mo times 12
    - when: otherwise
      value: '0'
    baseline:
      tu_host_price: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: hosting
  - id: mail_renewal_plan
    effect: parameter
    decides: tu_mail_price
    bindings:
    - tu_mail_id
    - tu_mail_left
    - tu_mail_attempt_in
    - tu_mail_due
    - tu_mail_months
    - tu_mail_deleted
    - tu_mail_restored
    - tu_mail_in_use
    - tu_mail_seats
    - tu_mail_price
    - tu_mail_discount
    ladder:
    - when: the email subscription is counted on the annual_prepaid plan
      value: the renewal seats times seat_price_annual_prepaid times 12
    - when: it is counted on the monthly plan
      value: the renewal seats times seat_price_monthly
    - when: otherwise
      value: '0'
    baseline:
      tu_mail_price: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: email
  - id: site_security_charge
    effect: method
    decides: tu_sec_charge
    bindings:
    - tu_sec_end
    - tu_sec_due
    - tu_sec_list
    - tu_sec_on_plan
    - tu_sec_charge
    ladder:
    - when: the security plan is counted and its site runs on an active Harborline hosting plan
      method: the term price reduced by the higher of hosted_site_discount_pct and the tier's security_discount_pct
    - when: it is counted and its site is hosted elsewhere
      method: the term price reduced by the tier's security_discount_pct alone
    - when: otherwise
      method: no security plan charge
    baseline:
      tu_sec_charge: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: security
  - id: server_term_price
    effect: parameter
    decides: tu_srv_price
    bindings:
    - tu_srv_end
    - tu_srv_due
    - tu_srv_term
    - tu_srv_price
    - tu_srv_discount
    ladder:
    - when: the server is counted on a 24-month term
      value: price_24mo_per_month times 24
    - when: it is counted on a 12-month term
      value: price_12mo_per_month times 12
    - when: it is counted on a 1-month term
      value: price_monthly
    - when: otherwise
      value: '0'
    baseline:
      tu_srv_price: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: server
  - id: certificate_term_price
    effect: parameter
    decides: tu_cert_price
    bindings:
    - tu_cert_end
    - tu_cert_due
    - tu_cert_id
    - tu_cert_line_years
    - tu_cert_years
    - tu_cert_price
    - tu_cert_n
    - tu_cert_name_rate
    - tu_cert_name_units
    - tu_cert_names
    - tu_cert_fee
    - tu_cert_dom
    - tu_cert_credit
    - tu_cert_charge
    ladder:
    - when: the certificate is counted and renews for three years
      value: price_3yr_per_year times 3
    - when: it is counted and renews for two years
      value: price_2yr_per_year times 2
    - when: it is counted and renews for one year
      value: price_1yr
    - when: otherwise
      value: '0'
    baseline:
      tu_cert_price: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: ssl
  inputs:
    history:
    - table: account_credit_ledger
      aggregate: sum
      field: amount
      filters: {}
    - category: domain
      table: domain_events
      aggregate: latest
      field: domain_id
      filters:
        event_type: domain_auto_renew_decline
    - category: hosting
      table: hosting_change_requests
      aggregate: latest
      field: target_term_months
      filters:
        request_type: term_change
        request_status: scheduled
    - table: account_events
      aggregate: latest
      field: review_result
      filters:
        event_type: account_tier_review
    cross_category:
    - domain
    - hosting
    - email
    - security
    - server
    - ssl
- id: account_ext_certificate_delay_goodwill
  base_policy_refs: [account_goodwill]
  overwrite:
    - base_policy: account_goodwill
      superseded_clause: >-
        A grant may not exceed the tier's goodwill_max_per_case, nor bring account_msr_goodwill_365d above goodwill_max_per_365d, and a request beyond either limit is granted only up to the remaining limit.
      replaced_by: >-
        For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
  trigger: state_due
  subject: [account_goodwill_credit]
  computes: amount
  target_tool: grant_certificate_delay_goodwill_7e1fd2ff
  params:
    allowed_issue_days: 11
    week_tier_days: 14
    month_tier_days: 7
    mult_ev: 1.5
    mult_ov: 1.25
    mult_both_harborline: 0.75
    mult_neither_harborline: 1.2
    mult_years_3: 1.2
    mult_years_2: 1.1
    uplift_window_lost: 5.0
    uplift_window_half: 3.0
    window_half_share: 0.5
    uplift_auto_dcv: 4.0
    uplift_manual_dcv: 2.0
  rule: >-
    Harborline's published goodwill schedule for late certificate issuance credits goodwill to the account, without
    the customer having to ask, for the certificate subscription of the customer's most recent initial certificate
    issuance whenever that subscription is active and its initial certificate was issued more than allowed_issue_days
    calendar days after the subscription's documents were complete; a certificate issued within that time is outside
    this schedule. The documents are complete on the subscription's organisation validation date for an OV or EV
    product and on its order date for a DV product. Because the published issuance targets are at most five business
    days from complete documents and no such span, weekends and US federal holidays included, is longer than
    allowed_issue_days calendar days, a certificate issued more than allowed_issue_days calendar days after its documents were complete has always missed its target.
    Goodwill credit may be granted only while the account status is active, one grant may be made per affected
    holding or charge reference, and the grant is posted against the order number of the subscription's
    new-subscription charge with ssl as the affected category.
    The days the issuance was late are the calendar days from the documents-complete date to the date of the initial
    issuance, less allowed_issue_days.
    The subscription's daily value is its new-subscription charge divided by the calendar days from that charge's
    period start to its period end.
    The late-issuance goodwill figure is the subscription's daily value times the days the issuance was late.
    For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
    The late-issuance goodwill granted is the late-issuance goodwill figure limited in that way and rounded half up to
    the cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no entry is posted.
    Where the schedule's adjustments apply, the late-issuance goodwill figure is first multiplied by every multiplier
    that applies, the fixed uplifts that apply are then added, the limits are then applied, and only the final figure
    is rounded half up to the cent.
    The compensation basis of the late-issuance goodwill depends on how late the certificate was: where the days the
    issuance was late are week_tier_days or more, the basis is the subscription's monthly value, which is its
    new-subscription charge divided by twelve times the years that charge covered, for each started week of those
    days; where they are month_tier_days or more but fewer than week_tier_days, the basis is one monthly value; where
    they are fewer than month_tier_days, the basis is the subscription's daily value times those days.
    The validation-class multiplier of the late-issuance goodwill follows the certificate product: an EV product takes
    mult_ev, an OV product takes mult_ov, and a DV product takes one.
    The site-coverage multiplier of the late-issuance goodwill follows where the certificate serves: where the
    certificate is installed on an active Harborline hosting plan and covers an active Harborline domain, every
    Harborline plan's free domain-validated certificates kept the site encrypted and the multiplier is
    mult_both_harborline; where it is installed on no active Harborline plan and covers no active Harborline domain,
    the multiplier is mult_neither_harborline; otherwise the multiplier is one.
    The commitment multiplier of the late-issuance goodwill follows the years the new-subscription charge covered:
    three years take mult_years_3, two years take mult_years_2, and one year takes one.
    The refund-window uplift of the late-issuance goodwill follows how much of the product's refund_window_days,
    counted from the new-subscription charge date, passed before the initial issuance: where the days from that
    charge to the issuance exceed refund_window_days, the uplift is uplift_window_lost; where they are
    window_half_share of refund_window_days or more but do not exceed it, the uplift is uplift_window_half; where they
    are fewer, no uplift is added.
    The validation-route uplift of the late-issuance goodwill follows the covered domain: where it is an active
    Harborline domain on Harborline DNS, so that domain control validated automatically and the delay was Harborline's
    alone, the uplift is uplift_auto_dcv; where it is an active Harborline domain on external nameservers, the uplift
    is uplift_manual_dcv; where it is not an active Harborline domain, no uplift is added.
  baseline:
    rule: >-
      The days the issuance was late are the calendar days from the documents-complete date to the date of the initial
      issuance, less allowed_issue_days.
      The subscription's daily value is its new-subscription charge divided by the calendar days from that charge's
      period start to its period end.
      The late-issuance goodwill figure is the subscription's daily value times the days the issuance was late.
      For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
      The late-issuance goodwill granted is the late-issuance goodwill figure limited in that way and rounded half up to
      the cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no entry is posted.
    params: [allowed_issue_days, goodwill_max_per_case, goodwill_max_per_365d]
  prerequisite: []
  cross_category:
    - category: ssl
      as: history
      reads: [certificate_id, status, opened_date, org_validated_date, variant_name, hosting_id, domain_id, ssl_charges.amount, ssl_charges.years, ssl_charges.period_start, ssl_charges.period_end, ssl_charges.charge_date, ssl_events.event_at, ssl_events.issuance_kind]
      note: The subscription's documents date, initial issuance, product and new-subscription charge decide the basis and the class, commitment and refund-window factors.
    - category: hosting
      as: existence
      reads: [hosting_id, status]
      note: The plan the certificate is installed on decides the site-coverage multiplier.
    - category: domain
      as: branch
      reads: [domain_id, status, nameservers]
      note: The covered domain decides the site-coverage multiplier and the validation-route uplift.
  compute:
    - cd_cert: "XLATEST('ssl','ssl_events','certificate_id', date_field='event_at', event_type='ssl_issuance', issuance_kind='initial')"
    - cd_order: "CFIELD('ssl','opened_date', certificate_id=cd_cert, status='active')"
    - cd_product: "CFIELD('ssl','variant_name', certificate_id=cd_cert, status='active')"
    - cd_org_date: "CFIELD('ssl','org_validated_date', certificate_id=cd_cert, status='active')"
    - cd_docs_date: "cd_order if (cd_product == 'Harborline DV Single Domain' or cd_product == 'Harborline DV Multi-Domain' or cd_product == 'Harborline DV Wildcard') else (cd_org_date if (cd_org_date != None and cd_org_date != '') else None)"
    - cd_issued: "XLATEST('ssl','ssl_events','event_at', date_field='event_at', event_type='ssl_issuance', issuance_kind='initial', certificate_id=cd_cert)"
    - cd_late_days: "(DAYS(cd_docs_date, cd_issued) - K('allowed_issue_days')) if (cd_order != None and cd_docs_date != None and cd_issued != None) else 0"
    - cd_charge: "XSUM('ssl','ssl_charges','amount', certificate_id=cd_cert, charge_type='new_subscription')"
    - cd_sub_days: "DAYS(XLATEST('ssl','ssl_charges','period_start', date_field='charge_date', certificate_id=cd_cert, charge_type='new_subscription'), XLATEST('ssl','ssl_charges','period_end', date_field='charge_date', certificate_id=cd_cert, charge_type='new_subscription')) if cd_order != None else 1"
    - cd_daily_value: "cd_charge / cd_sub_days"
    - cd_monthly_value: "XSUM('ssl','ssl_charges','amount', certificate_id=cd_cert, charge_type='new_subscription') / (12 * XLATEST('ssl','ssl_charges','years', date_field='charge_date', certificate_id=cd_cert, charge_type='new_subscription')) if cd_order != None else 0"
    - cd_basis: "cd_monthly_value * (-(-cd_late_days // 7)) if cd_late_days >= K('week_tier_days') else (cd_monthly_value if cd_late_days >= K('month_tier_days') else cd_daily_value * cd_late_days)"
    - cd_class_product: "CFIELD('ssl','variant_name', certificate_id=cd_cert, status='active')"
    - cd_class_mult: "K('mult_ev') if (cd_class_product == 'Harborline EV Single Domain' or cd_class_product == 'Harborline EV Multi-Domain') else (K('mult_ov') if (cd_class_product == 'Harborline OV Single Domain' or cd_class_product == 'Harborline OV Wildcard') else 1.0)"
    - cd_on_plan: "EXISTS('hosting', hosting_id=CFIELD('ssl','hosting_id', certificate_id=cd_cert, status='active'), status='active')"
    - cd_on_domain: "EXISTS('domain', domain_id=CFIELD('ssl','domain_id', certificate_id=cd_cert, status='active'), status='active')"
    - cd_coverage_mult: "K('mult_both_harborline') if (cd_on_plan and cd_on_domain) else (K('mult_neither_harborline') if (not cd_on_plan and not cd_on_domain) else 1.0)"
    - cd_years: "XLATEST('ssl','ssl_charges','years', date_field='charge_date', certificate_id=cd_cert, charge_type='new_subscription')"
    - cd_years_mult: "K('mult_years_3') if cd_years == 3 else (K('mult_years_2') if cd_years == 2 else 1.0)"
    - cd_window: "CPARAM('ssl','refund_window_days', certificate_id=cd_cert) or 0"
    - cd_window_used: "DAYS(XLATEST('ssl','ssl_charges','charge_date', date_field='charge_date', certificate_id=cd_cert, charge_type='new_subscription'), cd_issued) if (cd_order != None and cd_issued != None) else 0"
    - cd_window_uplift: "K('uplift_window_lost') if (cd_window > 0 and cd_window_used > cd_window) else (K('uplift_window_half') if (cd_window > 0 and cd_window_used >= K('window_half_share') * cd_window and cd_window_used <= cd_window) else 0)"
    - cd_dns: "CFIELD('domain','nameservers', domain_id=CFIELD('ssl','domain_id', certificate_id=cd_cert, status='active'), status='active')"
    - cd_route_uplift: "K('uplift_auto_dcv') if (cd_on_domain and cd_dns == 'harborline_dns') else (K('uplift_manual_dcv') if (cd_on_domain and cd_dns == 'external') else 0)"
    - cd_figure: "0 if cd_late_days <= 0 else cd_basis * cd_class_mult * cd_coverage_mult * cd_years_mult + cd_window_uplift + cd_route_uplift"
    - cd_year_total: "SUM('account_credit_ledger','amount', within_months=12, date_field='entry_date', credit_origin='goodwill')"
    - cd_year_room: "MX(0, P('goodwill_max_per_365d') - cd_year_total)"
    - result: "RND(MN(cd_figure, P('goodwill_max_per_case'), cd_year_room), 2)"
  compute_basis:
    cd_cert: "for the certificate subscription of the customer's most recent initial certificate issuance whenever that subscription is active and its initial certificate was issued more than allowed_issue_days calendar days after the subscription's documents were complete;"
    cd_order: "The documents are complete on the subscription's organisation validation date for an OV or EV product and on its order date for a DV product."
    cd_product: "The documents are complete on the subscription's organisation validation date for an OV or EV product and on its order date for a DV product."
    cd_org_date: "The documents are complete on the subscription's organisation validation date for an OV or EV product and on its order date for a DV product."
    cd_docs_date: "The documents are complete on the subscription's organisation validation date for an OV or EV product and on its order date for a DV product."
    cd_issued: "The days the issuance was late are the calendar days from the documents-complete date to the date of the initial issuance, less allowed_issue_days."
    cd_late_days: "The days the issuance was late are the calendar days from the documents-complete date to the date of the initial issuance, less allowed_issue_days."
    cd_charge: "The subscription's daily value is its new-subscription charge divided by the calendar days from that charge's period start to its period end."
    cd_sub_days: "The subscription's daily value is its new-subscription charge divided by the calendar days from that charge's period start to its period end."
    cd_daily_value: "The subscription's daily value is its new-subscription charge divided by the calendar days from that charge's period start to its period end."
    cd_monthly_value: "the basis is the subscription's monthly value, which is its new-subscription charge divided by twelve times the years that charge covered, for each started week of those days;"
    cd_basis: "where they are month_tier_days or more but fewer than week_tier_days, the basis is one monthly value; where they are fewer than month_tier_days, the basis is the subscription's daily value times those days."
    cd_class_product: "The validation-class multiplier of the late-issuance goodwill follows the certificate product:"
    cd_class_mult: "an EV product takes mult_ev, an OV product takes mult_ov, and a DV product takes one."
    cd_on_plan: "where the certificate is installed on an active Harborline hosting plan and covers an active Harborline domain, every Harborline plan's free domain-validated certificates kept the site encrypted and the multiplier is mult_both_harborline;"
    cd_on_domain: "where the certificate is installed on an active Harborline hosting plan and covers an active Harborline domain, every Harborline plan's free domain-validated certificates kept the site encrypted and the multiplier is mult_both_harborline;"
    cd_coverage_mult: "where it is installed on no active Harborline plan and covers no active Harborline domain, the multiplier is mult_neither_harborline; otherwise the multiplier is one."
    cd_years: "The commitment multiplier of the late-issuance goodwill follows the years the new-subscription charge covered:"
    cd_years_mult: "three years take mult_years_3, two years take mult_years_2, and one year takes one."
    cd_window: "The refund-window uplift of the late-issuance goodwill follows how much of the product's refund_window_days, counted from the new-subscription charge date, passed before the initial issuance:"
    cd_window_used: "where the days from that charge to the issuance exceed refund_window_days, the uplift is uplift_window_lost;"
    cd_window_uplift: "where they are window_half_share of refund_window_days or more but do not exceed it, the uplift is uplift_window_half; where they are fewer, no uplift is added."
    cd_dns: "where it is an active Harborline domain on external nameservers, the uplift is uplift_manual_dcv;"
    cd_route_uplift: "where it is not an active Harborline domain, no uplift is added."
    cd_figure: "Where the schedule's adjustments apply, the late-issuance goodwill figure is first multiplied by every multiplier that applies, the fixed uplifts that apply are then added, the limits are then applied, and only the final figure is rounded half up to the cent."
    cd_year_total: "For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today,"
    cd_year_room: "a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit;"
    result: "The late-issuance goodwill granted is the late-issuance goodwill figure limited in that way and rounded half up to the cent once, at the end;"
  factors:
    - id: issuance_basis
      effect: method
      decides: cd_basis
      bindings: [cd_monthly_value, cd_basis]
      ladder:
        - when: "the days the issuance was late are week_tier_days or more"
          method: "the subscription's monthly value for each started week of those days"
        - when: "those days are month_tier_days or more but fewer than week_tier_days"
          method: "one monthly value"
        - when: "otherwise"
          method: "the subscription's daily value times those days"
      baseline:
        cd_basis: "cd_daily_value * cd_late_days"
      evidence: [cross_category, date]
      cross_difficulty: ssl
    - id: validation_class
      effect: parameter
      decides: cd_class_mult
      bindings: [cd_class_product, cd_class_mult]
      ladder:
        - when: "the certificate product is an EV product"
          value: "K('mult_ev')"
        - when: "it is an OV product"
          value: "K('mult_ov')"
        - when: "otherwise"
          value: "1.0"
      baseline:
        cd_class_mult: "1.0"
      evidence: [cross_category]
      cross_difficulty: ssl
    - id: site_coverage
      effect: parameter
      decides: cd_coverage_mult
      bindings: [cd_on_plan, cd_coverage_mult]
      ladder:
        - when: "the certificate is installed on an active Harborline hosting plan and covers an active Harborline domain"
          value: "K('mult_both_harborline')"
        - when: "it is installed on no active Harborline plan and covers no active Harborline domain"
          value: "K('mult_neither_harborline')"
        - when: "otherwise"
          value: "1.0"
      baseline:
        cd_coverage_mult: "1.0"
      evidence: [cross_category]
      cross_difficulty: hosting
    - id: subscription_commitment
      effect: parameter
      decides: cd_years_mult
      bindings: [cd_years, cd_years_mult]
      ladder:
        - when: "the new-subscription charge covered three years"
          value: "K('mult_years_3')"
        - when: "it covered two years"
          value: "K('mult_years_2')"
        - when: "otherwise"
          value: "1.0"
      baseline:
        cd_years_mult: "1.0"
      evidence: [cross_category]
      cross_difficulty: ssl
    - id: refund_window_used
      effect: parameter
      decides: cd_window_uplift
      bindings: [cd_window, cd_window_used, cd_window_uplift]
      ladder:
        - when: "the days from the new-subscription charge to the initial issuance exceed the product's refund_window_days"
          value: "K('uplift_window_lost')"
        - when: "they are window_half_share of refund_window_days or more but do not exceed it"
          value: "K('uplift_window_half')"
        - when: "otherwise"
          value: "0"
      baseline:
        cd_window_uplift: "0"
      evidence: [cross_category, date]
      cross_difficulty: ssl
    - id: validation_route
      effect: parameter
      decides: cd_route_uplift
      bindings: [cd_dns, cd_route_uplift]
      ladder:
        - when: "the covered domain is an active Harborline domain on Harborline DNS"
          value: "K('uplift_auto_dcv')"
        - when: "the covered domain is an active Harborline domain on external nameservers"
          value: "K('uplift_manual_dcv')"
        - when: "otherwise"
          value: "0"
      baseline:
        cd_route_uplift: "0"
      evidence: [cross_category]
      cross_difficulty: domain
  inputs:
    history:
      - {category: ssl, table: ssl_events, aggregate: latest, field: certificate_id, filters: {event_type: ssl_issuance, issuance_kind: initial}}
      - {category: ssl, table: ssl_charges, aggregate: sum, field: amount, filters: {charge_type: new_subscription}}
      - {table: account_credit_ledger, aggregate: sum, field: amount, within_months: 12, filters: {credit_origin: goodwill}}
    cross_category: [ssl, hosting, domain]
- id: account_ext_reset_delay_goodwill
  base_policy_refs: [account_goodwill, account_recovery]
  overwrite:
    - base_policy: account_goodwill
      superseded_clause: >-
        A grant may not exceed the tier's goodwill_max_per_case, nor bring account_msr_goodwill_365d above goodwill_max_per_365d, and a request beyond either limit is granted only up to the remaining limit.
      replaced_by: >-
        For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
  trigger: state_due
  subject: [account_goodwill_credit]
  computes: amount
  target_tool: grant_reset_delay_goodwill_979fb2c3
  params:
    allowed_late_days: 1
    per_day_late: 1.5
    per_started_week: 12.0
    flat_short_late: 7.0
    week_tier_days: 7
    short_tier_days: 3
    mult_both_reset: 1.4
    mult_email_reset: 1.2
    lockout_many: 5.0
    lockout_few: 2.5
    live_hosting: 4.0
    live_domains: 2.0
    route_government_id: 3.0
    route_pin_and_card: 1.5
  rule: >-
    Harborline's published goodwill schedule for late recovery resets credits goodwill to the account, without the customer having to ask, for the account's only security-change notice dated after the same calendar date two months before today, whenever the account's most recent approved recovery request was decided after that same calendar date, that notice is dated on or after the request's decision, the account's sign-in now shows the change the request asked for, meaning a sign-in email equal to the request's new sign-in email where the request changed the email and two-factor set to none where it removed two-factor, and the notice is dated more than allowed_late_days days after the request's waiting period ended; such a notice is taken as the reset that applied the request, and where the account carries no such notice, or more than one, the reset date cannot be told from the records and the request is outside this schedule.
    Goodwill credit may be granted only while the account status is active, one grant may be made per affected
    holding or charge reference, and the grant is posted against the reference of that security-change notice with no
    product category.
    The waiting period of the request is the tier's recovery_hold_hours counted from the decision, taken as days of
    24 hours, and the date the reset took effect is the date of that security-change notice.
    The days the reset was late are the calendar days from the request's decision date to the date the reset took
    effect, less the waiting period in days.
    The late-reset goodwill figure is per_day_late for each day the reset was late.
    For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
    The late-reset goodwill granted is the late-reset goodwill figure limited in that way and rounded half up to the
    cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no entry is posted.
    Where the schedule's adjustments apply, the late-reset goodwill figure is first multiplied by the multiplier that
    applies, the fixed uplifts that apply are then added, the limits are then applied, and only the final figure is
    rounded half up to the cent.
    The compensation basis of the late-reset goodwill depends on how late the reset was: where the days the reset was
    late are week_tier_days or more, the basis is per_started_week for each started week of those days; where they are
    short_tier_days or more but fewer than week_tier_days, the basis is flat_short_late; where they are fewer than
    short_tier_days, the basis is per_day_late for each of those days.
    The reset-scope multiplier of the late-reset goodwill follows what the approved request reset: removing two-factor
    and changing the sign-in email takes mult_both_reset, changing the sign-in email only takes mult_email_reset, and
    removing two-factor only takes one.
    The failed sign-in uplift of the late-reset goodwill follows the account's temporary sign-in lockouts that began
    after the same calendar date two months before today: three or more add lockout_many, one or two add lockout_few,
    and none add nothing.
    The live-service uplift of the late-reset goodwill follows the products the customer held while the reset was
    outstanding: where the customer holds an active hosting plan, the uplift is live_hosting; where the customer holds
    no active hosting plan but holds an active domain, the uplift is live_domains; otherwise no uplift is added.
    The proof-of-identity uplift of the late-reset goodwill follows the approved request's evidence route:
    government_id adds route_government_id, pin_and_card adds route_pin_and_card, and email_link adds nothing.
  baseline:
    rule: >-
      The waiting period of the request is the tier's recovery_hold_hours counted from the decision, taken as days of
      24 hours, and the date the reset took effect is the date of that security-change notice.
      The days the reset was late are the calendar days from the request's decision date to the date the reset took
      effect, less the waiting period in days.
      The late-reset goodwill figure is per_day_late for each day the reset was late.
      For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
      The late-reset goodwill granted is the late-reset goodwill figure limited in that way and rounded half up to the
      cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no entry is posted.
    params: [per_day_late, allowed_late_days, recovery_hold_hours, goodwill_max_per_case, goodwill_max_per_365d]
  prerequisite: []
  cross_category:
    - category: hosting
      as: existence
      reads: [status]
      note: An active hosting plan decides the live-service uplift.
    - category: domain
      as: existence
      reads: [status]
      note: An active domain decides the live-service uplift where no plan is active.
  compute:
    - rd_notices: "COUNT('account_events', within_months=2, date_field='event_at', event_type='account_security_notice', notice_kind='security_change')"
    - rd_notice_at: "LATEST('account_events','event_at', date_field='event_at', event_type='account_security_notice', notice_kind='security_change')"
    - rd_decided: "LATEST('account_recovery_requests','decided_at', date_field='decided_at', outcome='approved')"
    - rd_hold_days: "P('recovery_hold_hours') / 24"
    - rd_req_change: "LATEST('account_recovery_requests','requested_change', date_field='decided_at', outcome='approved')"
    - rd_new_email: "LATEST('account_recovery_requests','new_login_email', date_field='decided_at', outcome='approved')"
    - rd_linked: "rd_notices == 1 and rd_decided != None and rd_decided != '' and rd_notice_at != None and MONTHS(rd_decided, NOW) < 2 and DAYS(rd_decided, rd_notice_at) >= 0 and ((rd_req_change == 'change_login_email' and F('login_email') == rd_new_email) or (rd_req_change == 'remove_two_factor' and F('two_factor') == 'none') or (rd_req_change == 'remove_two_factor_and_change_login_email' and F('login_email') == rd_new_email and F('two_factor') == 'none'))"
    - rd_late_days: "(DAYS(rd_decided, rd_notice_at) - rd_hold_days) if rd_linked else 0"
    - rd_basis_days: "(DAYS(LATEST('account_recovery_requests','decided_at', date_field='decided_at', outcome='approved'), rd_notice_at) - P('recovery_hold_hours') / 24) if (rd_notices == 1 and rd_decided != None and rd_decided != '' and rd_notice_at != None) else 0"
    - rd_basis: "K('per_started_week') * (-(-rd_basis_days // K('week_tier_days'))) if rd_basis_days >= K('week_tier_days') else (K('flat_short_late') if rd_basis_days >= K('short_tier_days') else K('per_day_late') * rd_basis_days)"
    - rd_change: "LATEST('account_recovery_requests','requested_change', date_field='decided_at', outcome='approved')"
    - rd_scope_mult: "K('mult_both_reset') if rd_change == 'remove_two_factor_and_change_login_email' else (K('mult_email_reset') if rd_change == 'change_login_email' else 1.0)"
    - rd_lockouts: "COUNT('account_events', within_months=2, date_field='event_at', event_type='account_login_lockout')"
    - rd_lockout_uplift: "K('lockout_many') if rd_lockouts >= 3 else (K('lockout_few') if rd_lockouts >= 1 else 0)"
    - rd_live_hosting: "EXISTS('hosting', status='active')"
    - rd_live_domain: "EXISTS('domain', status='active')"
    - rd_live_uplift: "K('live_hosting') if rd_live_hosting else (K('live_domains') if (rd_live_domain and not rd_live_hosting) else 0)"
    - rd_route: "LATEST('account_recovery_requests','recovery_method', date_field='decided_at', outcome='approved')"
    - rd_route_uplift: "K('route_government_id') if rd_route == 'government_id' else (K('route_pin_and_card') if rd_route == 'pin_and_card' else 0)"
    - rd_figure: "0 if rd_late_days <= K('allowed_late_days') else rd_basis * rd_scope_mult + rd_lockout_uplift + rd_live_uplift + rd_route_uplift"
    - rd_year_total: "SUM('account_credit_ledger','amount', within_months=12, date_field='entry_date', credit_origin='goodwill')"
    - rd_year_room: "MX(0, P('goodwill_max_per_365d') - rd_year_total)"
    - result: "RND(MN(rd_figure, P('goodwill_max_per_case'), rd_year_room), 2)"
  compute_basis:
    rd_notices: "for the account's only security-change notice dated after the same calendar date two months before today,"
    rd_notice_at: "and the date the reset took effect is the date of that security-change notice."
    rd_decided: "whenever the account's most recent approved recovery request was decided after that same calendar date,"
    rd_req_change: "the account's sign-in now shows the change the request asked for,"
    rd_new_email: "meaning a sign-in email equal to the request's new sign-in email where the request changed the email and two-factor set to none where it removed two-factor,"
    rd_linked: "that notice is dated on or after the request's decision,"
    rd_hold_days: "The waiting period of the request is the tier's recovery_hold_hours counted from the decision, taken as days of 24 hours,"
    rd_late_days: "The days the reset was late are the calendar days from the request's decision date to the date the reset took effect, less the waiting period in days."
    rd_basis_days: "The days the reset was late are the calendar days from the request's decision date to the date the reset took effect, less the waiting period in days."
    rd_basis: "where the days the reset was late are week_tier_days or more, the basis is per_started_week for each started week of those days; where they are short_tier_days or more but fewer than week_tier_days, the basis is flat_short_late; where they are fewer than short_tier_days, the basis is per_day_late for each of those days."
    rd_change: "The reset-scope multiplier of the late-reset goodwill follows what the approved request reset:"
    rd_scope_mult: "removing two-factor and changing the sign-in email takes mult_both_reset, changing the sign-in email only takes mult_email_reset, and removing two-factor only takes one."
    rd_lockouts: "The failed sign-in uplift of the late-reset goodwill follows the account's temporary sign-in lockouts that began after the same calendar date two months before today:"
    rd_lockout_uplift: "three or more add lockout_many, one or two add lockout_few, and none add nothing."
    rd_live_hosting: "where the customer holds an active hosting plan, the uplift is live_hosting;"
    rd_live_domain: "where the customer holds no active hosting plan but holds an active domain, the uplift is live_domains; otherwise no uplift is added."
    rd_live_uplift: "The live-service uplift of the late-reset goodwill follows the products the customer held while the reset was outstanding:"
    rd_route: "The proof-of-identity uplift of the late-reset goodwill follows the approved request's evidence route:"
    rd_route_uplift: "government_id adds route_government_id, pin_and_card adds route_pin_and_card, and email_link adds nothing."
    rd_figure: "Where the schedule's adjustments apply, the late-reset goodwill figure is first multiplied by the multiplier that applies, the fixed uplifts that apply are then added, the limits are then applied, and only the final figure is rounded half up to the cent."
    rd_year_total: "For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today,"
    rd_year_room: "a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit;"
    result: "The late-reset goodwill granted is the late-reset goodwill figure limited in that way and rounded half up to the cent once, at the end;"
  factors:
    - id: reset_basis
      effect: method
      decides: rd_basis
      bindings: [rd_basis_days, rd_basis]
      ladder:
        - when: "the days the reset was late are week_tier_days or more"
          method: "per_started_week for each started week of those days"
        - when: "those days are short_tier_days or more but fewer than week_tier_days"
          method: "flat_short_late"
        - when: "otherwise"
          method: "per_day_late for each of those days"
      baseline:
        rd_basis: "K('per_day_late') * rd_late_days"
      evidence: [history, date]
      cross_difficulty: null
    - id: reset_scope
      effect: parameter
      decides: rd_scope_mult
      bindings: [rd_change, rd_scope_mult]
      ladder:
        - when: "the approved request removed two-factor and changed the sign-in email"
          value: "K('mult_both_reset')"
        - when: "it changed the sign-in email only"
          value: "K('mult_email_reset')"
        - when: "otherwise"
          value: "1.0"
      baseline:
        rd_scope_mult: "1.0"
      evidence: [history]
      cross_difficulty: null
    - id: lockouts_while_waiting
      effect: parameter
      decides: rd_lockout_uplift
      bindings: [rd_lockouts, rd_lockout_uplift]
      ladder:
        - when: "three or more temporary sign-in lockouts began after the same calendar date two months before today"
          value: "K('lockout_many')"
        - when: "one or two such lockouts"
          value: "K('lockout_few')"
        - when: "otherwise"
          value: "0"
      baseline:
        rd_lockout_uplift: "0"
      evidence: [history]
      cross_difficulty: null
    - id: services_held
      effect: parameter
      decides: rd_live_uplift
      bindings: [rd_live_hosting, rd_live_domain, rd_live_uplift]
      ladder:
        - when: "the customer holds an active hosting plan"
          value: "K('live_hosting')"
        - when: "the customer holds no active hosting plan and holds an active domain"
          value: "K('live_domains')"
        - when: "otherwise"
          value: "0"
      baseline:
        rd_live_uplift: "0"
      evidence: [cross_category]
      cross_difficulty: hosting
    - id: identity_proof
      effect: parameter
      decides: rd_route_uplift
      bindings: [rd_route, rd_route_uplift]
      ladder:
        - when: "the approved request's evidence route is government_id"
          value: "K('route_government_id')"
        - when: "it is pin_and_card"
          value: "K('route_pin_and_card')"
        - when: "otherwise"
          value: "0"
      baseline:
        rd_route_uplift: "0"
      evidence: [history]
      cross_difficulty: null
  inputs:
    history:
      - {table: account_recovery_requests, aggregate: latest, field: decided_at, filters: {outcome: approved}}
      - {table: account_events, aggregate: count, field: event_at, within_months: 2, filters: {event_type: account_security_notice, notice_kind: security_change}}
      - {table: account_events, aggregate: count, field: event_at, within_months: 2, filters: {event_type: account_login_lockout}}
      - {table: account_credit_ledger, aggregate: sum, field: amount, within_months: 12, filters: {credit_origin: goodwill}}
    cross_category: [hosting, domain]
- id: account_ext_refund_posting_goodwill
  base_policy_refs: [account_goodwill, account_refund_credit]
  overwrite:
    - base_policy: account_goodwill
      superseded_clause: >-
        A grant may not exceed the tier's goodwill_max_per_case, nor bring account_msr_goodwill_365d above goodwill_max_per_365d, and a request beyond either limit is granted only up to the remaining limit.
      replaced_by: >-
        For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
  trigger: state_due
  subject: [account_goodwill_credit]
  computes: amount
  target_tool: grant_refund_posting_goodwill_cac8bb9c
  params:
    allowed_posting_days: 3
    base_share: 0.2
    week_tier_days: 10
    short_tier_days: 5
    per_started_week: 3.0
    flat_short_lag: 4.0
    size_large: 100.0
    size_mid: 10.0
    uplift_size_large: 5.0
    uplift_size_mid: 2.0
    uplift_paypal_elected: 4.0
    uplift_card_elected: 2.5
    uplift_plan_exposed: 3.0
    uplift_domain_exposed: 1.5
  rule: >-
    Harborline's published goodwill schedule for late refund postings credits goodwill to the account, without the
    customer having to ask, for the customer's most recent domain refund line returned to account credit, where no
    other domain refund line returned to account credit shares its date, whenever the account's refund credit entry
    for the refunded charge's order number is dated more than allowed_posting_days calendar days after the refund
    line; a refund posted within that time, or a latest date shared by two such refund lines, is outside this schedule.
    Goodwill credit may be granted only while the account status is active, one grant may be made per affected
    holding or charge reference, and the grant is posted against the reference of that refund line with domain as the
    affected category.
    The days the posting lagged are the calendar days from the refund line's date to the date of the account's refund
    credit entry for the refunded charge's order number.
    The late-posting goodwill figure is base_share of the refund credit posted for that order number.
    For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
    The late-posting goodwill granted is the late-posting goodwill figure limited in that way and rounded half up to
    the cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no entry is posted.
    Where the schedule's adjustments apply, the fixed uplifts that apply are added to the late-posting goodwill figure, the
    limits are then applied, and only the final figure is rounded half up to the cent.
    The compensation basis of the late-posting goodwill depends on how long the posting lagged: where the days the
    posting lagged are week_tier_days or more, the basis is per_started_week for each started week of those days;
    where they are short_tier_days or more but fewer than week_tier_days, the basis is flat_short_lag; where they are
    fewer than short_tier_days, the basis is base_share of the refund credit posted.
    The size uplift of the late-posting goodwill follows the refund credit posted for that order number: size_large
    or more adds uplift_size_large, size_mid or more but less than size_large adds uplift_size_mid, and less than
    size_mid adds nothing.
    The election uplift of the late-posting goodwill follows how the refunded charge had been paid, which sets what the customer gave up by taking the refund as account credit: a charge paid by PayPal, whose refund would otherwise have gone back to the PayPal account, adds uplift_paypal_elected; a charge paid by card, whose refund would otherwise have gone back to the card, adds uplift_card_elected; any other charge, which was paid from account credit and so was always refunded to account credit, adds nothing.
    The renewal-exposure uplift of the late-posting goodwill follows the renewals that try the account credit first: where the customer holds an active hosting plan with auto-renew on, it adds uplift_plan_exposed; where it holds no such plan but holds an active domain with auto-renew on, it adds uplift_domain_exposed; otherwise it adds nothing.
  baseline:
    rule: >-
      The days the posting lagged are the calendar days from the refund line's date to the date of the account's refund
      credit entry for the refunded charge's order number.
      The late-posting goodwill figure is base_share of the refund credit posted for that order number.
      For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
      The late-posting goodwill granted is the late-posting goodwill figure limited in that way and rounded half up to
      the cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no entry is posted.
    params: [allowed_posting_days, base_share, goodwill_max_per_case, goodwill_max_per_365d]
  prerequisite: []
  cross_category:
    - category: domain
      as: history
      reads: [domain_charges.charge_date, domain_charges.amount, domain_charges.payment_method, domain_charges.order_ref, domain_charges.original_domain_charge_id, domain_charges.refund_destination, domain_charges.domain_charge_id]
      note: The refund line and the refunded charge decide the lag, the election uplift and the posting reference.
    - category: hosting
      as: branch
      reads: [status, auto_renew]
      note: An active hosting plan with auto-renew on decides the renewal-exposure tier.
  compute:
    - rp_refund_date: "XLATEST('domain','domain_charges','charge_date', date_field='charge_date', event_type='domain_refund', refund_destination='account_credit')"
    - rp_lines_that_day: "XCOUNT('domain','domain_charges', event_type='domain_refund', refund_destination='account_credit', charge_date=rp_refund_date) if rp_refund_date != None else 0"
    - rp_orig_id: "XLATEST('domain','domain_charges','original_domain_charge_id', date_field='charge_date', event_type='domain_refund', refund_destination='account_credit')"
    - rp_orig_order: "XLATEST('domain','domain_charges','order_ref', date_field='charge_date', domain_charge_id=rp_orig_id)"
    - rp_posted_date: "LATEST('account_credit_ledger','entry_date', date_field='entry_date', credit_origin='refund', source_charge_ref=rp_orig_order)"
    - rp_lag_days: "DAYS(rp_refund_date, rp_posted_date) if (rp_refund_date != None and rp_posted_date != None) else 0"
    - rp_posted_amount: "SUM('account_credit_ledger','amount', credit_origin='refund', source_charge_ref=rp_orig_order)"
    - rp_basis_lag: "DAYS(XLATEST('domain','domain_charges','charge_date', date_field='charge_date', event_type='domain_refund', refund_destination='account_credit'), LATEST('account_credit_ledger','entry_date', date_field='entry_date', credit_origin='refund', source_charge_ref=rp_orig_order)) if (rp_refund_date != None and rp_posted_date != None) else 0"
    - rp_basis: "K('per_started_week') * (-(-rp_basis_lag // 7)) if rp_basis_lag >= K('week_tier_days') else (K('flat_short_lag') if rp_basis_lag >= K('short_tier_days') else K('base_share') * rp_posted_amount)"
    - rp_size_amount: "SUM('account_credit_ledger','amount', credit_origin='refund', source_charge_ref=rp_orig_order)"
    - rp_size_uplift: "K('uplift_size_large') if rp_size_amount >= K('size_large') else (K('uplift_size_mid') if rp_size_amount >= K('size_mid') else 0)"
    - rp_orig_method: "XLATEST('domain','domain_charges','payment_method', date_field='charge_date', domain_charge_id=rp_orig_id)"
    - rp_election_uplift: "K('uplift_paypal_elected') if rp_orig_method == 'paypal' else (K('uplift_card_elected') if rp_orig_method == 'card' else 0)"
    - rp_plan_exposed: "EXISTS('hosting', status='active', auto_renew=True)"
    - rp_domain_exposed: "EXISTS('domain', status='active', auto_renew=True)"
    - rp_exposure_uplift: "K('uplift_plan_exposed') if rp_plan_exposed else (K('uplift_domain_exposed') if (rp_domain_exposed and not rp_plan_exposed) else 0)"
    - rp_figure: "0 if (rp_lag_days <= K('allowed_posting_days') or rp_lines_that_day != 1) else rp_basis + rp_size_uplift + rp_election_uplift + rp_exposure_uplift"
    - rp_year_total: "SUM('account_credit_ledger','amount', within_months=12, date_field='entry_date', credit_origin='goodwill')"
    - rp_year_room: "MX(0, P('goodwill_max_per_365d') - rp_year_total)"
    - result: "RND(MN(rp_figure, P('goodwill_max_per_case'), rp_year_room), 2)"
  compute_basis:
    rp_refund_date: "for the customer's most recent domain refund line returned to account credit,"
    rp_lines_that_day: "where no other domain refund line returned to account credit shares its date,"
    rp_orig_id: "whenever the account's refund credit entry for the refunded charge's order number is dated more than allowed_posting_days calendar days after the refund line;"
    rp_orig_order: "whenever the account's refund credit entry for the refunded charge's order number is dated more than allowed_posting_days calendar days after the refund line;"
    rp_posted_date: "The days the posting lagged are the calendar days from the refund line's date to the date of the account's refund credit entry for the refunded charge's order number."
    rp_lag_days: "The days the posting lagged are the calendar days from the refund line's date to the date of the account's refund credit entry for the refunded charge's order number."
    rp_posted_amount: "The late-posting goodwill figure is base_share of the refund credit posted for that order number."
    rp_basis_lag: "The days the posting lagged are the calendar days from the refund line's date to the date of the account's refund credit entry for the refunded charge's order number."
    rp_basis: "where the days the posting lagged are week_tier_days or more, the basis is per_started_week for each started week of those days; where they are short_tier_days or more but fewer than week_tier_days, the basis is flat_short_lag; where they are fewer than short_tier_days, the basis is base_share of the refund credit posted."
    rp_size_amount: "The size uplift of the late-posting goodwill follows the refund credit posted for that order number:"
    rp_size_uplift: "size_large or more adds uplift_size_large, size_mid or more but less than size_large adds uplift_size_mid, and less than size_mid adds nothing."
    rp_orig_method: "The election uplift of the late-posting goodwill follows how the refunded charge had been paid, which sets what the customer gave up by taking the refund as account credit:"
    rp_election_uplift: "a charge paid by PayPal, whose refund would otherwise have gone back to the PayPal account, adds uplift_paypal_elected; a charge paid by card, whose refund would otherwise have gone back to the card, adds uplift_card_elected; any other charge, which was paid from account credit and so was always refunded to account credit, adds nothing."
    rp_plan_exposed: "where the customer holds an active hosting plan with auto-renew on, it adds uplift_plan_exposed;"
    rp_domain_exposed: "where it holds no such plan but holds an active domain with auto-renew on, it adds uplift_domain_exposed;"
    rp_exposure_uplift: "The renewal-exposure uplift of the late-posting goodwill follows the renewals that try the account credit first:"
    rp_figure: "Where the schedule's adjustments apply, the fixed uplifts that apply are added to the late-posting goodwill figure, the limits are then applied, and only the final figure is rounded half up to the cent."
    rp_year_total: "For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today,"
    rp_year_room: "a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit;"
    result: "The late-posting goodwill granted is the late-posting goodwill figure limited in that way and rounded half up to the cent once, at the end;"
  factors:
    - id: posting_basis
      effect: method
      decides: rp_basis
      bindings: [rp_basis_lag, rp_basis]
      ladder:
        - when: "the days the posting lagged are week_tier_days or more"
          method: "per_started_week for each started week of those days"
        - when: "those days are short_tier_days or more but fewer than week_tier_days"
          method: "flat_short_lag"
        - when: "otherwise"
          method: "base_share of the refund credit posted"
      baseline:
        rp_basis: "K('base_share') * rp_posted_amount"
      evidence: [history, cross_category, date]
      cross_difficulty: domain
    - id: refund_size
      effect: parameter
      decides: rp_size_uplift
      bindings: [rp_size_amount, rp_size_uplift]
      ladder:
        - when: "the refund credit posted is size_large or more"
          value: "K('uplift_size_large')"
        - when: "it is size_mid or more but less than size_large"
          value: "K('uplift_size_mid')"
        - when: "otherwise"
          value: "0"
      baseline:
        rp_size_uplift: "0"
      evidence: [history]
      cross_difficulty: null
    - id: credit_election
      effect: parameter
      decides: rp_election_uplift
      bindings: [rp_orig_method, rp_election_uplift]
      ladder:
        - when: "the refunded charge was paid by PayPal"
          value: "K('uplift_paypal_elected')"
        - when: "it was paid by card"
          value: "K('uplift_card_elected')"
        - when: "otherwise"
          value: "0"
      baseline:
        rp_election_uplift: "0"
      evidence: [cross_category]
      cross_difficulty: domain
    - id: renewal_exposure
      effect: parameter
      decides: rp_exposure_uplift
      bindings: [rp_plan_exposed, rp_domain_exposed, rp_exposure_uplift]
      ladder:
        - when: "the customer holds an active hosting plan with auto-renew on"
          value: "K('uplift_plan_exposed')"
        - when: "it holds no such plan but holds an active domain with auto-renew on"
          value: "K('uplift_domain_exposed')"
        - when: "otherwise"
          value: "0"
      baseline:
        rp_exposure_uplift: "0"
      evidence: [cross_category]
  inputs:
    history:
      - {table: account_credit_ledger, aggregate: latest, field: entry_date, filters: {credit_origin: refund}}
      - {table: account_credit_ledger, aggregate: sum, field: amount, filters: {credit_origin: refund}}
      - {category: domain, table: domain_charges, aggregate: latest, field: charge_date, filters: {event_type: domain_refund, refund_destination: account_credit}}
      - {table: account_credit_ledger, aggregate: sum, field: amount, within_months: 12, filters: {credit_origin: goodwill}}
    cross_category: [domain, hosting]
