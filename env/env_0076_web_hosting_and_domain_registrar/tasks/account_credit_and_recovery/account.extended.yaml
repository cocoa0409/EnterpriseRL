    after the same calendar date two months before today: three or more add lockout_many, one or two add
    lockout_few, and none add nothing.
    The live-service uplift of the late-review goodwill follows the products the customer could not manage while
    locked out: where the customer holds an active hosting plan, the uplift is live_hosting; where the customer
    holds no active hosting plan but holds an active domain, the uplift is live_domains; otherwise no uplift is
