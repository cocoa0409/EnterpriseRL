events:
- type: account_open
  target: account_holdings
  mutation: create
  meaning: A person or business signs up for a Harborline account.
  grain: One row per account sign-up.
  fields:
    variant_name: Harborline Personal Account or Harborline Business Account at sign-up; reseller tiers are reached
      only by tier change.
    login_email: Sign-in email chosen at sign-up, verbatim.
    two_factor: Two-factor method at sign-up (none unless set up during sign-up).
    credit_balance: 0.00 at sign-up.
    opened_date: Sign-up date.
  triggers: []
- type: account_activate
  target: account_holdings
  mutation:
    transition:
      from: unverified
      to: active
  meaning: The sign-up verification email is confirmed.
  grain: One row per transaction.
  fields:
    opened_date: Unchanged.
  triggers: []
- type: account_purge_unverified
  target: account_holdings
  mutation:
    transition:
      from: unverified
      to: closed
  meaning: An account never confirmed within the verification window is purged.
  grain: One row per transaction.
  fields:
    closed_date: Purge date.
  triggers: []
- type: account_recovery_hold
  target: account_holdings
  mutation:
    transition:
      from: active
      to: recovery_hold
  meaning: An approved recovery request places the account in its recovery waiting period.
  grain: One row per transaction.
  fields:
    recovery_hold_until: 'Moment the waiting period ends: the approval moment plus the tier''s recovery_hold_hours.'
  triggers:
  - event: account:account_security_notice
    map:
      notice_kind: recovery_approved
- type: account_recovery_release
  target: account_holdings
  mutation:
    transition:
      from: recovery_hold
      to: active
  meaning: The recovery waiting period ends and the approved reset takes effect.
  grain: One row per transaction.
  fields:
    recovery_hold_until: Cleared to empty.
  triggers:
  - event: account:account_security_update
- type: account_lock
  target: account_holdings
  mutation:
    transition:
      from: active
      to: locked
  meaning: The account is locked after a charge-back or a suspected compromise.
  grain: One row per transaction.
  fields:
    lock_reason: chargeback or suspected_compromise.
  triggers: []
- type: account_unlock
  target: account_holdings
  mutation:
    transition:
      from: locked
      to: active
  meaning: A locked account is unlocked once its cause is resolved.
  grain: One row per transaction.
  fields:
    lock_reason: Reset to none.
  triggers: []
- type: account_close
  target: account_holdings
  mutation:
    transition:
      from: active
      to: closed
  meaning: The account holder closes the account.
  grain: One row per transaction.
  fields:
    closed_date: Closure date.
  triggers: []
- type: account_reopen
  target: account_holdings
  mutation:
    transition:
      from: closed
      to: active
  meaning: A closed account is reopened inside the reopening window.
  grain: One row per transaction.
  fields:
    closed_date: Cleared to empty.
  triggers: []
- type: account_tier_change
  target: account_holdings
  mutation: update
  meaning: The account moves to another tier after an application, an automatic review or a downgrade.
  grain: One row per tier change.
  fields:
    variant_name: New official tier name.
    tier_changed_date: Date of this tier change.
  triggers: []
- type: account_security_update
  target: account_holdings
  mutation: update
  meaning: The sign-in email or the two-factor method on the account changes, either by the holder or by an applied
    recovery.
  grain: One row per security setting change.
  fields:
    login_email: Sign-in email after the change, verbatim.
    two_factor: Two-factor method after the change.
    last_security_change_date: Date of this change.
  triggers:
  - event: account:account_security_notice
    map:
      notice_kind: security_change
- type: account_balance_sync
  target: account_holdings
  mutation: update
  meaning: The account's credit balance view is brought to the sum of all its credit ledger entries after a new
    entry.
  grain: One row per ledger entry posted.
  fields:
    credit_balance: 'New balance: the previous balance plus the signed amount of the entry just posted.'
  triggers: []
- type: account_credit_deposit
  target: account_credit_ledger
  meaning: The customer deposits funds into account credit.
  grain: One row per deposit transaction.
  distinguish_by:
  - entry_date
  - funding_method
  - amount
  fields:
    amount: Deposited amount, USD, positive.
    entry_date: Deposit date.
    funding_method: card, paypal or bank_transfer.
    credit_origin: Set to deposit.
  account: account_credit
  direction: in
  triggers:
  - event: account:account_balance_sync
- type: account_credit_refund
  target: account_credit_ledger
  meaning: A refund of a product charge is credited to account credit at the customer's election or because the
    charge was paid from credit.
  grain: One row per refunded product charge.
  distinguish_by:
  - source_charge_ref
  fields:
    customer_id: Customer credited.
    amount: Refunded amount, USD, positive.
    entry_date: Date credited.
    source_category: Category of the refunded charge.
    source_charge_ref: Reference number of the refunded product charge.
    credit_origin: Set to refund.
  account: account_credit
  direction: in
  triggers:
  - event: account:account_balance_sync
- type: account_service_credit
  target: account_credit_ledger
  meaning: A contractual service credit, such as a hosting uptime credit, is added to account credit.
  grain: One row per service credit issued by a product.
  distinguish_by:
  - source_charge_ref
  fields:
    customer_id: Customer credited.
    amount: Credited amount, USD, positive.
    entry_date: Date credited.
    source_category: Category issuing the credit.
    source_charge_ref: Reference number of the product credit line.
    credit_origin: Set to service_credit.
  account: account_credit
  direction: in
  triggers:
  - event: account:account_balance_sync
- type: account_goodwill_credit
  target: account_credit_ledger
  meaning: Support grants goodwill credit for a documented Harborline service failure.
  grain: One row per goodwill grant.
  distinguish_by:
  - entry_date
  - source_charge_ref
  fields:
    amount: Granted amount, USD, positive.
    entry_date: Grant date.
    source_category: Category of the product affected by the service failure.
    source_charge_ref: Reference number of the affected product holding or charge the failure concerned.
    credit_origin: Set to goodwill.
  account: account_credit
  direction: in
  triggers:
  - event: account:account_balance_sync
- type: account_credit_apply
  target: account_credit_ledger
  meaning: Account credit pays for a Harborline purchase, renewal or auto-renew charge.
  grain: One row per product charge paid from credit.
  distinguish_by:
  - source_charge_ref
  fields:
    customer_id: Customer whose credit pays the charge.
    amount: Amount applied, USD, negative.
    entry_date: Date applied.
    source_category: Category of the charge paid.
    source_charge_ref: Reference number of the product charge paid.
    credit_origin: Set to purchase.
  account: account_credit
  direction: out
  triggers:
  - event: account:account_balance_sync
- type: account_credit_withdraw
  target: account_credit_ledger
  meaning: Unused deposited credit is returned to the deposit's original payment method.
  grain: One row per withdrawal against one deposit.
  distinguish_by:
  - original_credit_entry_id
  fields:
    amount: Amount withdrawn, USD, negative.
    entry_date: Withdrawal date.
    original_credit_entry_id: Reference of the deposit being withdrawn.
    funding_method: Original method of that deposit.
    credit_origin: Set to withdrawal.
  account: account_credit
  direction: out
  triggers:
  - event: account:account_balance_sync
- type: account_chargeback_debit
  target: account_credit_ledger
  meaning: A card or PayPal deposit is charged back by the payer's bank and the disputed amount plus the charge-back
    fee is debited from credit.
  grain: One row per charged-back deposit.
  distinguish_by:
  - original_credit_entry_id
  fields:
    amount: Debited amount, USD, negative (disputed amount plus fee); the balance may go below zero.
    entry_date: Date of the charge-back notice.
    original_credit_entry_id: Reference of the charged-back deposit.
    funding_method: Method of the charged-back deposit.
    credit_origin: Set to chargeback.
  account: account_credit
  direction: out
  triggers:
  - event: account:account_balance_sync
  - event: account:account_lock
    map:
      lock_reason: chargeback
- type: account_security_notice
  target: account_events
  meaning: A security notice is emailed to the account's previous and current sign-in emails.
  grain: One row per notice sent.
  distinguish_by:
  - notice_kind
  - event_at
  fields:
    notice_kind: security_change, recovery_approved, recovery_rejected or lockout.
    event_at: Moment sent.
  triggers: []
- type: account_login_lockout
  target: account_events
  meaning: Repeated failed sign-ins trigger a temporary sign-in lockout.
  grain: One row per lockout.
  distinguish_by:
  - event_at
  fields:
    event_at: Moment the lockout began.
    lockout_ends_at: Moment the lockout ends.
  triggers:
  - event: account:account_security_notice
    map:
      notice_kind: lockout
- type: account_tier_review
  target: account_events
  meaning: The automatic tier qualification review records its result.
  grain: One row per review.
  distinguish_by:
  - event_at
  fields:
    event_at: Moment of the review.
    review_result: qualified, grace_started or downgrade_due.
  triggers:
  - event: account:account_tier_change
    when:
      review_result: downgrade_due
measures:
- id: account_msr_deposits_365d
  window: Trailing 365 calendar days ending today, today included.
  measure: Sum of amount over account_credit_deposit entries of the account with entry_date in the window, less
    the deposit amount of any of those deposits that has an account_chargeback_debit entry.
- id: account_msr_goodwill_365d
  window: Trailing 365 calendar days ending today, today included.
  measure: Sum of amount over account_goodwill_credit entries of the account with entry_date in the window.
- id: account_msr_recovery_requests_30d
  window: Trailing 30 calendar days ending today, today included.
  measure: Count of account_recovery_requests rows of the account whose submitted_at date falls in the window, whatever
    their outcome.
- id: account_msr_withdrawable_deposit
  window: All credit ledger entries of the account up to now.
  measure: 'For one deposit: the remaining deposited credit (credit_balance minus the unspent non-cash credit, where
    unspent non-cash credit is the sum of refund, service credit and goodwill entries less the sum of purchase entries,
    floored at zero) allocated to deposits newest first, capped at that deposit''s amount less any withdrawal already
    made against it, and zero for a deposit older than withdrawal_window_days.'
policies:
- id: account_agg_multi_holding
  subject:
  - account_open
  rule: Each customer profile has exactly one Harborline account, which holds every product the customer buys. A
    new account may be opened only when the customer has no account in any status, and a closed account is reopened
    rather than replaced.
  eligibility:
  - id: one_account_per_customer
    applies_to:
    - account_open
    kind: dedup
    condition: A new account may be opened only when the customer has no account in any status, and a closed account
      is reopened rather than replaced.
    evidence_fields:
    - account_holdings.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.customer_id
      action_bindings:
        account_holdings.customer_id: customer_id
    dedup_contract:
      table: account_holdings
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - unverified
        - active
        - recovery_hold
        - locked
        - closed
      distinct_fields: []
  params:
    max_per_customer: 1
- id: account_tier_qualification
  subject:
  - account_tier_change
  - account_tier_review
  rule: 'A tier change may be made only while the account status is active. An account qualifies for a tier when
    its customer profile meets tier_requires_business_profile, the Harborline Reseller Agreement is accepted where
    reseller_agreement_required is true, and account_msr_deposits_365d is at least the tier''s tier_min_deposits_365d.
    An upgrade takes effect on the day it is requested and qualified, and a request for a tier the account does
    not qualify for is declined without any change. Every tier_review_cycle_days after the tier_changed_date the
    tier is reviewed: a qualifying account keeps its tier and restarts the cycle, while a non-qualifying account
    keeps its tier for tier_downgrade_grace_days and, if still not qualified when that grace ends, moves down to
    the highest tier it qualifies for. A business profile never drops below Harborline Business Account and an individual
    profile is always Harborline Personal Account. A tier change never re-prices charges already billed; the new
    tier''s figures apply from the next charge.'
  eligibility:
  - id: tier_change_active
    applies_to:
    - account_tier_change
    kind: state
    condition: A tier change may be made only while the account status is active.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
  params:
    per_tier:
      Harborline Personal Account:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
      Harborline Business Account:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
      Harborline Reseller Bronze:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
      Harborline Reseller Silver:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
      Harborline Reseller Gold:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
      Harborline Reseller Platinum:
        min_deposits: =tier_min_deposits_365d
        business_only: =tier_requires_business_profile
  formula:
    qualifies: account_msr_deposits_365d >= tier_min_deposits_365d
  measures:
  - account_msr_deposits_365d
- id: account_tier_benefits
  subject:
  - account_tier_change
  rule: The account tier sets the percentage discounts each product's pricing rule applies (domain_registration_discount_pct,
    domain_renewal_discount_pct, hosting_discount_pct, ssl_discount_pct, email_discount_pct, server_discount_pct,
    security_discount_pct), together with team, API, support and credit limits. A tier discount applies to the list
    or renewal price component of a charge only; it never applies to ICANN fees, domain restore fees, setup fees,
    proration lines, refunds or Microsoft 365 seats. When a product's own promotion or volume discount could also
    apply to the same price component, only the single higher percentage applies and percentages are never added
    or compounded. Discounted components are rounded half up to the cent (credit_rounding) before fees are added.
    Benefits follow the tier recorded on the account on the charge date.
  eligibility: []
  params:
    per_tier:
      Harborline Personal Account:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
      Harborline Business Account:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
      Harborline Reseller Bronze:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
      Harborline Reseller Silver:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
      Harborline Reseller Gold:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
      Harborline Reseller Platinum:
        domain: =domain_renewal_discount_pct
        hosting: =hosting_discount_pct
        ssl: =ssl_discount_pct
        email: =email_discount_pct
- id: account_deposits
  subject:
  - account_credit_deposit
  - account_balance_sync
  rule: A deposit may be accepted only while the account status is active. A single deposit must be at least min_deposit_amount
    and at most max_deposit_per_transaction, must use one of the tier's deposit_methods, and a bank transfer must
    be at least bank_transfer_min_amount. A deposit that would raise credit_balance above max_credit_balance is
    refused in full, never accepted in part. After every credit ledger entry the account's credit_balance is set
    to the previous balance plus the entry's signed amount, so it always equals the sum of the account's ledger
    entries. Deposited credit never expires and carries no interest.
  eligibility:
  - id: deposit_active
    applies_to:
    - account_credit_deposit
    kind: state
    condition: A deposit may be accepted only while the account status is active.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
  formula:
    new_balance: credit_balance + amount
- id: account_credit_spending
  subject:
  - account_credit_apply
  rule: Account credit may pay for a charge only while the account status is active or recovery_hold. Credit pays
    a charge only when credit_balance covers the whole charge, since credit_partial_application_allowed is false,
    and otherwise the charge goes to the default card in full. Every auto-renew charge in any category tries credit
    first where credit_first_for_auto_renew is true, while for a purchase made in conversation credit is used only
    when the customer chooses it. Spending consumes refund, service and goodwill credit before deposited credit,
    and deposited credit oldest deposit first. Each paid charge is recorded once, with the reference number of the
    product charge it paid.
  eligibility:
  - id: spend_status
    applies_to:
    - account_credit_apply
    kind: state
    condition: Account credit may pay for a charge only while the account status is active or recovery_hold.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
      - recovery_hold
  - id: one_application_per_charge
    applies_to:
    - account_credit_apply
    kind: dedup
    condition: Each paid charge is recorded once, with the reference number of the product charge it paid.
    evidence_fields:
    - account_credit_ledger.source_charge_ref
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_credit_ledger.source_charge_ref
      action_bindings:
        account_credit_ledger.source_charge_ref: source_charge_ref
    dedup_contract:
      table: account_credit_ledger
      mode: separate_record
      object_bindings:
        source_charge_ref: source_charge_ref
      duplicate_filters:
        credit_origin:
        - purchase
      distinct_fields: []
- id: account_withdrawals
  subject:
  - account_credit_withdraw
  rule: A withdrawal may be made only while the account status is active. A withdrawal returns unused deposited
    credit from one deposit to that deposit's original payment method, and each deposit may be withdrawn against
    only once. A deposit may be withdrawn only on or before the entry date of the deposit being withdrawn plus withdrawal_window_days
    calendar days. The window adds whole calendar days to the deposit date, counting the day after the deposit as
    day 1, and the last day is included. The amount withdrawn is the deposit's account_msr_withdrawable_deposit,
    and a withdrawal below withdrawal_min_amount is not made. Credit that came from refunds, service credits or
    goodwill is never withdrawable (refund_credit_withdrawable, goodwill_credit_withdrawable), and bank transfer
    deposits are returned by bank transfer. The funds reach the payment method within withdrawal_processing_business_days
    business days, counted Monday to Friday excluding US federal holidays.
  eligibility:
  - id: withdraw_active
    applies_to:
    - account_credit_withdraw
    kind: state
    condition: A withdrawal may be made only while the account status is active.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
  - id: one_withdrawal_per_deposit
    applies_to:
    - account_credit_withdraw
    kind: dedup
    condition: A withdrawal returns unused deposited credit from one deposit to that deposit's original payment
      method, and each deposit may be withdrawn against only once.
    evidence_fields:
    - account_credit_ledger.original_credit_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_credit_ledger.original_credit_entry_id
      action_bindings:
        account_credit_ledger.original_credit_entry_id: original_credit_entry_id
    dedup_contract:
      table: account_credit_ledger
      mode: separate_record
      object_bindings:
        original_credit_entry_id: original_credit_entry_id
      duplicate_filters:
        credit_origin:
        - withdrawal
        - chargeback
      distinct_fields: []
  - id: withdrawal_window
    applies_to:
    - account_credit_withdraw
    kind: time
    condition: A deposit may be withdrawn only on or before the entry date of the deposit being withdrawn plus withdrawal_window_days
      calendar days.
    evidence_fields:
    - account_credit_ledger.credit_entry_id
    - account_credit_ledger.entry_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_credit_ledger.credit_entry_id
      action_bindings:
        account_credit_ledger.credit_entry_id: original_credit_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the entry date of the deposit being withdrawn
      anchor_source: account_credit_ledger.entry_date
      relation: not_after
      duration_source: variants.withdrawal_window_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the deposit date, counting the day after the deposit
        as day 1, and the last day is included.
      boundary: inclusive
  measures:
  - account_msr_withdrawable_deposit
- id: account_goodwill
  subject:
  - account_goodwill_credit
  rule: Goodwill credit may be granted only while the account status is active. Goodwill credit may be granted only
    for a Harborline service failure that is shown in the customer's records, such as a provisioning that missed
    its deadline or a duplicate charge, never for an outage already credited under a product's uptime rule, and
    never for the customer's own missed renewal or deadline. One grant may be made per affected holding or charge
    reference. A grant may not exceed the tier's goodwill_max_per_case, nor bring account_msr_goodwill_365d above
    goodwill_max_per_365d, and a request beyond either limit is granted only up to the remaining limit. Goodwill
    credit is spendable on any Harborline product but is never withdrawable.
  eligibility:
  - id: goodwill_active
    applies_to:
    - account_goodwill_credit
    kind: state
    condition: Goodwill credit may be granted only while the account status is active.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
  - id: one_grant_per_reference
    applies_to:
    - account_goodwill_credit
    kind: dedup
    condition: One grant may be made per affected holding or charge reference.
    evidence_fields:
    - account_credit_ledger.source_charge_ref
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_credit_ledger.source_charge_ref
      action_bindings:
        account_credit_ledger.source_charge_ref: source_charge_ref
    dedup_contract:
      table: account_credit_ledger
      mode: separate_record
      object_bindings:
        source_charge_ref: source_charge_ref
      duplicate_filters:
        credit_origin:
        - goodwill
      distinct_fields: []
  formula:
    grant: min(goodwill_max_per_case, goodwill_max_per_365d - account_msr_goodwill_365d)
  measures:
  - account_msr_goodwill_365d
- id: account_refund_credit
  subject:
  - account_credit_refund
  - account_service_credit
  rule: A refund is credited to account credit when the product rule allows it and the customer elects credit, or
    always when the refunded charge was itself paid from credit. A refund may be credited only while the account
    status is active, recovery_hold or locked, and a refund due on a closed account goes to the original payment
    method instead. The credited amount equals the refunded amount of the product charge, unchanged by any tier
    figure. Each refunded product charge is credited only once. A contractual service credit issued by a product
    rule, such as a hosting uptime credit, is added for exactly the amount that rule computes and is likewise posted
    once per product credit line.
  eligibility:
  - id: credit_refund_status
    applies_to:
    - account_credit_refund
    kind: state
    condition: A refund may be credited only while the account status is active, recovery_hold or locked, and a
      refund due on a closed account goes to the original payment method instead.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
      - recovery_hold
      - locked
  - id: one_credit_per_refund
    applies_to:
    - account_credit_refund
    kind: dedup
    condition: Each refunded product charge is credited only once.
    evidence_fields:
    - account_credit_ledger.source_charge_ref
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_credit_ledger.source_charge_ref
      action_bindings:
        account_credit_ledger.source_charge_ref: source_charge_ref
    dedup_contract:
      table: account_credit_ledger
      mode: separate_record
      object_bindings:
        source_charge_ref: source_charge_ref
      duplicate_filters:
        credit_origin:
        - refund
      distinct_fields: []
- id: account_recovery
  subject:
  - account_recovery_hold
  - account_recovery_release
  - account_security_notice
  rule: 'A customer who has lost access to the sign-in email or the two-factor method may request recovery through
    one of the tier''s recovery_methods: email_link to the profile contact email, pin_and_card proving the support
    PIN together with the last four card digits and billing postal code, or government_id reviewed by Trust and
    Safety. A recovery request may be submitted only when account_msr_recovery_requests_30d is below max_recovery_requests_30d
    and no rejection was decided in the last recovery_rejection_cooldown_days calendar days. Trust and Safety decides
    each request within recovery_review_business_days business days, counted Monday to Friday excluding US federal
    holidays, and an approved request puts the account in recovery_hold. The approved reset may take effect only
    at or after the moment the recovery request was approved plus recovery_hold_hours elapsed hours. The hold is
    counted in full 24-hour periods of elapsed time from the approval moment, never in calendar days. During recovery_hold
    the holder cannot change security settings, withdraw credit, close the account or obtain a domain authorisation
    code, while renewals and auto-renew charges continue. A request withdrawn by the holder before the hold ends
    releases the hold without applying the reset, and every approval, rejection and applied reset is notified to
    the previous and current sign-in emails where security_notice_to_previous_email is true.'
  eligibility:
  - id: hold_elapsed
    applies_to:
    - account_recovery_release
    kind: time
    condition: The approved reset may take effect only at or after the moment the recovery request was approved
      plus recovery_hold_hours elapsed hours.
    evidence_fields:
    - account_recovery_requests.outcome
    - account_recovery_requests.recovery_request_id
    - account_recovery_requests.decided_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_recovery_requests.recovery_request_id
      action_bindings:
        account_recovery_requests.recovery_request_id: recovery_request_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the recovery request was approved
      anchor_source: account_recovery_requests.decided_at
      relation: not_before
      duration_source: variants.recovery_hold_hours
      unit: elapsed_hours
      counting_rule: The hold is counted in full 24-hour periods of elapsed time from the approval moment, never
        in calendar days.
      boundary: inclusive
  measures:
  - account_msr_recovery_requests_30d
- id: account_security_rules
  subject:
  - account_security_update
  - account_login_lockout
  rule: The holder may change the sign-in email or the two-factor method only while the account status is active.
    On a tier where two_factor_required is true the holder may not switch two-factor to none, and a recovery that
    removed it obliges the holder to enrol a new method at the next sign-in before any purchase. Every change is
    notified to the previous sign-in email where security_notice_to_previous_email is true. failed_login_threshold
    consecutive failed sign-ins start a temporary lockout of login_lockout_minutes, which does not change the account
    status and ends by itself.
  eligibility:
  - id: security_change_active
    applies_to:
    - account_security_update
    kind: state
    condition: The holder may change the sign-in email or the two-factor method only while the account status is
      active.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    state_contract:
      field: account_holdings.status
      allowed:
      - active
- id: account_chargeback_and_lock
  subject:
  - account_chargeback_debit
  - account_lock
  - account_unlock
  rule: When a card or PayPal deposit is charged back, its disputed amount plus chargeback_fee is debited from credit
    even if the balance goes below zero, and the account is locked where chargeback_locks_account is true. Trust
    and Safety may also lock an account for a suspected compromise. A charge-back lock may be lifted only when the
    account's credit balance is zero or above or the payer's bank has withdrawn the dispute. A suspected-compromise
    lock is lifted only after the caller passes identity verification and the sign-in password has been reset. While
    locked, no purchase, deposit, withdrawal or goodwill can be made, but refunds may still be credited and existing
    products keep running.
  eligibility:
  - id: chargeback_repaid
    applies_to:
    - account_unlock
    kind: authorization
    condition: A charge-back lock may be lifted only when the account's credit balance is zero or above or the payer's
      bank has withdrawn the dispute.
    evidence_fields:
    - account_holdings.credit_balance
    - account_holdings.lock_reason
    - account_holdings.account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
- id: account_closure
  subject:
  - account_close
  - account_reopen
  - account_purge_unverified
  - account_activate
  - account_open
  rule: An account may be closed only when every domain holding of the customer is deleted, transferred_out or cancelled.
    An account may be closed only when every hosting plan of the customer is cancelled or terminated. An account
    may be closed only when every certificate subscription of the customer is expired, revoked or cancelled. An
    account may be closed only when every email subscription of the customer is cancelled. An account may be closed
    only when every server of the customer is cancelled or terminated. An account may be closed only when every
    website security plan of the customer is cancelled, as closure_requires_no_live_holdings requires for every
    product. At closure the unused deposited credit is returned to the original payment methods where closure_refunds_deposit_credit
    is true, and refund, service and goodwill credit is forfeited. A closed account may be reopened only on or before
    the closure date plus closure_reopen_window_days calendar days. The window adds whole calendar days to the closure
    date, counting the day after closure as day 1, and the last day is included. A new sign-up must confirm its
    verification email within email_verification_link_hours of the link being sent, and an account still unverified
    unverified_purge_days after sign-up is purged.
  eligibility:
  - id: no_live_domains
    applies_to:
    - account_close
    kind: state
    condition: An account may be closed only when every domain holding of the customer is deleted, transferred_out
      or cancelled.
    evidence_fields:
    - domain_holdings.customer_id
    - domain_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.customer_id
      action_bindings:
        domain_holdings.customer_id: customer_id
    state_contract:
      field: domain_holdings.status
      allowed:
      - deleted
      - transferred_out
      - cancelled
  - id: no_live_hosting
    applies_to:
    - account_close
    kind: state
    condition: An account may be closed only when every hosting plan of the customer is cancelled or terminated.
    evidence_fields:
    - hosting_holdings.customer_id
    - hosting_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.customer_id
      action_bindings:
        hosting_holdings.customer_id: customer_id
    state_contract:
      field: hosting_holdings.status
      allowed:
      - cancelled
      - terminated
  - id: no_live_certificates
    applies_to:
    - account_close
    kind: state
    condition: An account may be closed only when every certificate subscription of the customer is expired, revoked
      or cancelled.
    evidence_fields:
    - ssl_holdings.customer_id
    - ssl_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ssl_holdings.customer_id
      action_bindings:
        ssl_holdings.customer_id: customer_id
    state_contract:
      field: ssl_holdings.status
      allowed:
      - expired
      - revoked
      - cancelled
  - id: no_live_email
    applies_to:
    - account_close
    kind: state
    condition: An account may be closed only when every email subscription of the customer is cancelled.
    evidence_fields:
    - email_holdings.customer_id
    - email_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - email_holdings.customer_id
      action_bindings:
        email_holdings.customer_id: customer_id
    state_contract:
      field: email_holdings.status
      allowed:
      - cancelled
  - id: no_live_servers
    applies_to:
    - account_close
    kind: state
    condition: An account may be closed only when every server of the customer is cancelled or terminated.
    evidence_fields:
    - server_holdings.customer_id
    - server_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - server_holdings.customer_id
      action_bindings:
        server_holdings.customer_id: customer_id
    state_contract:
      field: server_holdings.status
      allowed:
      - cancelled
      - terminated
  - id: no_live_security
    applies_to:
    - account_close
    kind: state
    condition: An account may be closed only when every website security plan of the customer is cancelled, as closure_requires_no_live_holdings
      requires for every product.
    evidence_fields:
    - security_holdings.customer_id
    - security_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - security_holdings.customer_id
      action_bindings:
        security_holdings.customer_id: customer_id
    state_contract:
      field: security_holdings.status
      allowed:
      - cancelled
  - id: reopen_window
    applies_to:
    - account_reopen
    kind: time
    condition: A closed account may be reopened only on or before the closure date plus closure_reopen_window_days
      calendar days.
    evidence_fields:
    - account_holdings.account_id
    - account_holdings.closed_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_holdings.account_id
      action_bindings:
        account_holdings.account_id: account_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the closure date
      anchor_source: account_holdings.closed_date
      relation: not_after
      duration_source: variants.closure_reopen_window_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the closure date, counting the day after closure as
        day 1, and the last day is included.
      boundary: inclusive

# ===================== extended_policies (this difficulty) =====================
extended_policies:
- id: account_ext_renewal_prefund
  base_policy_refs: [account_deposits, account_credit_spending, account_tier_benefits]
  overwrite: []
  trigger: on_request
  subject: [account_credit_deposit]
  computes: amount
  target_tool: make_prefund_deposit_8453f2b2
  params:
    window_days: 14
    name_band_1: 10
    name_band_2: 50
    name_band_rate_1: 0.6
    name_band_rate_2: 0.4
    revetting_fee_ov: 29.0
    revetting_fee_ev: 49.0
    domain_credit_harborline_dns: 6.0
    domain_credit_external_dns: 3.0
    plan_retry_1: 3
    plan_retry_2: 1
    domain_retry_1: 14
    domain_retry_2: 7
    domain_retry_3: 1
    mail_retry_1: 3
    mail_retry_2: 1
  rule: >-
    This policy sets the amount of the prefund deposit a holder makes so that account credit can pay, within the coming window_days calendar days, the charges that keep the website on their hosting plan running: the auto-renew charges of the plan, of the certificate installed on it, of the site security plan whose site runs on it, of the email subscription on its primary domain and of the plan's free domain, each priced as its own product's published rules price that charge whichever source pays it.
    A product's next auto-renew attempt is the first of its first attempt day and its retry days under its own charter that is today or later: for the plan the days auto_renew_days_before_term_end, plan_retry_1 and plan_retry_2 calendar days before its term end date, the hosting charter's auto_renew_retry_days_before_term_end; for the free domain the days auto_renew_first_attempt_days_before_expiry, domain_retry_1, domain_retry_2 and domain_retry_3 calendar days before its expiry date, the domain charter's auto_renew_retry_days_before_expiry; for the email subscription the days auto_renew_days_before_end, mail_retry_1 and mail_retry_2 calendar days before its term end date, the email charter's auto_renew_retry_days_before_end; and for the certificate and the security plan, which have no retry days, the single day auto_renew_days_before_end or auto_renew_days_before_term_end calendar days before the end date under their charters.
    It handles a customer whose hosting billing shows exactly one initial-term charge, meaning one hosting plan ever ordered, while that plan is active with auto-renew on and its next auto-renew attempt is today or no more than window_days calendar days after today, the plan has no scheduled downgrade, the account's most recent tier review neither started a downgrade grace nor found a downgrade due, the plan's free domain, if any, is neither in its renewal grace period nor in redemption, the plan carries at most one active site security plan and at most one active certificate subscription with auto-renew on, at most one active email subscription is on its primary domain, and that email subscription, if any, is neither billed annually in monthly instalments nor scheduled to change product; a deposit for any other purpose, or by any other customer, is the amount the holder chooses, under the base deposit rule, and charges of any other holding are not counted by the prefund.
    A deposit may be accepted only while the account status is active, a single deposit must be at least min_deposit_amount and at most max_deposit_per_transaction and must use one of the tier's deposit_methods, a bank transfer must be at least bank_transfer_min_amount, and a deposit that would raise credit_balance above max_credit_balance is refused in full, never accepted in part.
    Because account credit pays an auto-renew charge only when the credit balance covers the whole charge, the prefund covers each counted charge in full.
    The plan's renewal list price is the plan tier's renewal_rate_12mo times 12, the regular rate of the 12-month term.
    The plan's renewal list price is reduced by the account tier's hosting_discount_pct, the discount being the list price less the reduced price rounded half up to the cent.
    The credit the prefund must cover is the plan's renewal list price together with every other counted charge, all added together, less every discount that applies.
    The credit balance counted is the sum of all the account's credit ledger entries.
    The prefund deposit is the credit the prefund must cover less the credit balance; where that is zero or less no prefund is needed and none is taken, and otherwise the prefund is at least min_deposit_amount and is rounded half up to the cent.
    A prefund that would exceed max_deposit_per_transaction, or that would raise the credit balance above max_credit_balance, is refused in full and no prefund is taken.
    The term rate of the prefund's plan renewal follows the term length the plan's new term will have, which is the term of a term change scheduled for the plan where one is scheduled and otherwise the plan's current term length: a new term of 36 months is priced at renewal_rate_36mo times 36, a new term of 24 months at renewal_rate_24mo times 24, a new term of 1 month at monthly_rate_no_commitment with no setup fee, and any other new term at renewal_rate_12mo times 12; the price so found is the plan's renewal list price.
    The certificate the prefund counts is the certificate subscription installed on the plan, active with auto-renew on, when its next auto-renew attempt is today or no more than window_days calendar days after today; its charge is the auto-renew charge the ssl charter's published auto-renew rule sets, whichever source pays it. It renews for the years of its latest term line, its latest renewal or auto-renew line or, where none has been billed, its purchase line, at most the product's max_subscription_years, and its certificate price component is the product's price for those years, price_3yr_per_year times 3 for three years, price_2yr_per_year times 2 for two years and price_1yr for one year. Its certificate price component is reduced by the account tier's ssl_discount_pct; its extra names are billed without that percentage at additional_name_price_per_year for each name and each year renewed, each name's yearly price multiplied, on a renewal of two or three years, by the product's per-year price for that term divided by its price_1yr, and, on such a renewal, the names after the first name_band_1 taken at name_band_rate_1 of that price up to the first name_band_2 names and at name_band_rate_2 of it beyond them. The reduced amount, the reduced certificate price component together with the extra-name amount, is rounded half up to the cent, and the certificate charge is that amount with the fixed fee added and the fixed credit taken off that apply to it, rounded half up to the cent; a certificate not so due has no certificate charge.
    The re-vetting fee of the prefund's certificate charge follows the product and the age of its organisation validation, counted as the days from the date it last completed to the current subscription end date plus 365: an EV product whose validation so counted is older than the product's org_validation_reuse_days adds revetting_fee_ev, an OV product whose validation so counted is older than it adds revetting_fee_ov, and any other certificate adds no fee. The Harborline domain credit of the prefund's certificate charge follows its covered domain: an active Harborline registration on Harborline DNS takes off domain_credit_harborline_dns, an active Harborline registration on external nameservers takes off domain_credit_external_dns, and any other covered domain takes off no credit.
    The security plan the prefund counts is the site security plan whose site runs on the plan, active with auto-renew on, when its next auto-renew attempt is today or no more than window_days calendar days after today; because its site runs on an active Harborline plan, its charge is reduced by the higher of the product's hosted_site_discount_pct and the account tier's security_discount_pct, the two never added, the discount being the charge less the reduced charge rounded half up to the cent. The security plan charge of the prefund follows the security plan's billing term: a 12-month term is priced at price_annual, a 1-month term at price_monthly, and otherwise no security plan charge is counted.
    The email subscription the prefund counts is the one on the plan's primary domain, active with auto-renew on, when its next auto-renew attempt is today or no more than window_days calendar days after today; its renewal falls due on its term end date while it is active, so it is a term renewal under the email charter's published term-renewal rule, billed for its renewed seats at the seat price of its billing plan, seat_price_annual_prepaid times 12 for each seat on the annual_prepaid plan and seat_price_monthly on the monthly plan, and where the product's account_discount_applies is true its charge is reduced by the account tier's email_discount_pct, the discount being the charge less the reduced charge rounded half up to the cent, while Microsoft 365 seats are never discounted. The mailboxes in use are the seat count less the idle seats, the mailbox deletions recorded on the subscription in the current term less the restores of those deletions, a deletion and its restore counting in the current term where the whole calendar months from the deletion date to today are no more than the whole calendar months from the term start date to today. The email charge of the prefund follows the subscription's seat records: for a subscription so counted on which a scheduled seat count is set, it is the lower of the scheduled seat count and the seat count, but never fewer than the mailboxes in use, times the seat price; for one so counted with no scheduled seat count and with idle seats, it is the mailboxes in use times the seat price; for any other subscription so counted, it is the seat count times the seat price; and otherwise no email charge is counted.
    The free-domain charge of the prefund is the auto-renew charge of the domain registered under the plan's free-domain entitlement where that domain is active or on_hold with auto-renew on and its next auto-renew attempt is today or no more than window_days calendar days after today: its renewal for auto_renew_term_years years at the TLD's renewal_price times those years reduced by the account tier's domain_renewal_discount_pct and rounded half up to the cent, plus icann_fee_per_year times those years, which is never discounted; otherwise no free-domain charge is counted.
    The prefund deposit is fixed only after the credit ledger carries a goodwill entry for the hosting plan of the customer's most recent initial-term charge whenever that plan, active and in its first term, was activated two or more calendar days after its order date and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
    The prefund deposit is not fixed until the credit ledger carries a goodwill entry for the account's most recent approved recovery request whenever that request was decided more than seven calendar days after it was submitted and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
    Before the prefund deposit is worked out, the credit ledger must carry a goodwill entry for the most recently refunded domain auto-renew charge whenever no other domain auto-renew refund line shares its refund date, the refunded charge had a same-day twin auto-renew charge of the same domain, and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
  baseline:
    rule: >-
      Because account credit pays an auto-renew charge only when the credit balance covers the whole charge, the prefund covers each counted charge in full.
      The plan's renewal list price is the plan tier's renewal_rate_12mo times 12, the regular rate of the 12-month term.
      The plan's renewal list price is reduced by the account tier's hosting_discount_pct, the discount being the list price less the reduced price rounded half up to the cent.
      The free-domain charge of the prefund is the auto-renew charge of the domain registered under the plan's free-domain entitlement where that domain is active or on_hold with auto-renew on and its next auto-renew attempt is today or no more than window_days calendar days after today: its renewal for auto_renew_term_years years at the TLD's renewal_price times those years reduced by the account tier's domain_renewal_discount_pct and rounded half up to the cent, plus icann_fee_per_year times those years, which is never discounted; otherwise no free-domain charge is counted.
      The certificate the prefund counts is the certificate subscription installed on the plan, active with auto-renew on, when its next auto-renew attempt is today or no more than window_days calendar days after today; its charge is the auto-renew charge the ssl charter's published auto-renew rule sets, whichever source pays it. It renews for the years of its latest term line, its latest renewal or auto-renew line or, where none has been billed, its purchase line, at most the product's max_subscription_years, and its certificate price component is the product's price for those years, price_3yr_per_year times 3 for three years, price_2yr_per_year times 2 for two years and price_1yr for one year. Its certificate price component is reduced by the account tier's ssl_discount_pct; its extra names are billed without that percentage at additional_name_price_per_year for each name and each year renewed, each name's yearly price multiplied, on a renewal of two or three years, by the product's per-year price for that term divided by its price_1yr, and, on such a renewal, the names after the first name_band_1 taken at name_band_rate_1 of that price up to the first name_band_2 names and at name_band_rate_2 of it beyond them. The reduced amount, the reduced certificate price component together with the extra-name amount, is rounded half up to the cent, and the certificate charge is that amount with the fixed fee added and the fixed credit taken off that apply to it, rounded half up to the cent; a certificate not so due has no certificate charge.
      The credit the prefund must cover is the plan's renewal list price together with every other counted charge, all added together, less every discount that applies.
      The credit balance counted is the sum of all the account's credit ledger entries.
      The prefund deposit is the credit the prefund must cover less the credit balance; where that is zero or less no prefund is needed and none is taken, and otherwise the prefund is at least min_deposit_amount and is rounded half up to the cent.
      A prefund that would exceed max_deposit_per_transaction, or that would raise the credit balance above max_credit_balance, is refused in full and no prefund is taken.
    params: [hosting_discount_pct, domain_renewal_discount_pct, ssl_discount_pct, min_deposit_amount, max_deposit_per_transaction, max_credit_balance]
  prerequisite:
    - problem: account_ext_provisioning_goodwill
      kind: value_input
      gate: pf_balance
      form: state
      policy_source: >-
        The prefund deposit is fixed only after the credit ledger carries a goodwill entry for the hosting plan of the customer's most recent initial-term charge whenever that plan, active and in its first term, was activated two or more calendar days after its order date and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
      condition: >-
        The account credit ledger holds a goodwill entry whose source charge reference is the order number of the most
        recent hosting initial-term charge, when that charge's plan is active, in its first term, activated two or more
        calendar days after its order date, and the yearly goodwill total is below goodwill_max_per_365d.
      resolved_by: grant_provisioning_goodwill_e1bd747b
      effect: >-
        The posted goodwill is spendable credit: the ledger sum rises by its amount and the prefund deposit falls by the
        same amount (to the minimum deposit at most, or to no prefund).
    - problem: account_ext_recovery_review_goodwill
      kind: value_input
      gate: pf_balance
      form: state
      policy_source: >-
        The prefund deposit is not fixed until the credit ledger carries a goodwill entry for the account's most recent approved recovery request whenever that request was decided more than seven calendar days after it was submitted and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
      condition: >-
        The account credit ledger holds a goodwill entry whose source charge reference is the reference number of the
        account's most recent approved recovery request, when its decision date is more than seven calendar days after
        its submission date and the yearly goodwill total is below goodwill_max_per_365d.
      resolved_by: grant_recovery_delay_goodwill_1cc515a4
      effect: >-
        The posted goodwill raises the ledger sum by its amount, so the prefund deposit falls by the same amount.
    - problem: account_ext_duplicate_renewal_goodwill
      kind: value_input
      gate: pf_balance
      form: state
      policy_source: >-
        Before the prefund deposit is worked out, the credit ledger must carry a goodwill entry for the most recently refunded domain auto-renew charge whenever no other domain auto-renew refund line shares its refund date, the refunded charge had a same-day twin auto-renew charge of the same domain, and the account's goodwill entries dated after the same calendar date one year before today total less than the tier's yearly goodwill limit.
      condition: >-
        The account credit ledger holds a goodwill entry whose source charge reference is the order number of the domain
        auto-renew charge most recently refunded, when that refund line is the only auto-renew refund line of its date, the
        domain shows two or more auto-renew charge lines on the refunded charge's date, and the yearly goodwill total is
        below goodwill_max_per_365d.
      resolved_by: grant_duplicate_charge_goodwill_d451e88f
      effect: >-
        The posted goodwill raises the ledger sum by its amount, so the prefund deposit falls by the same amount.
  cross_category:
  - category: hosting
    as: branch
    reads:
    - hosting_id
    - status
    - auto_renew
    - term_end_date
    - billing_term_months
    - primary_domain
    - variant_name
    - hosting_charges.charge_type
    - hosting_change_requests.request_type
    - hosting_change_requests.target_term_months
    - hosting_change_requests.request_status
    note: The plan, its term, a scheduled term change and the tier rates decide the scope and the plan renewal.
  - category: ssl
    as: branch
    reads:
    - hosting_id
    - status
    - auto_renew
    - subscription_end_date
    - extra_names
    - org_validated_date
    - domain_id
    - variant_name
    - ssl_charges.years
    - ssl_charges.event_type
    - ssl_charges.charge_type
    note: The certificate on the plan, its last term and its product prices decide the certificate charge.
  - category: security
    as: branch
    reads:
    - hosting_id
    - status
    - auto_renew
    - term_end_date
    - billing_term_months
    - variant_name
    note: The security plan of the plan's site and its term decide the security plan charge.
  - category: email
    as: branch
    reads:
    - email_domain
    - status
    - auto_renew
    - term_end_date
    - billing_plan
    - seat_count
    - scheduled_seat_count
    - scheduled_variant
    - variant_name
    - term_start_date
    - email_events.event_type
    - email_events.event_at
    - email_events.deleted_at
    note: The email subscription on the plan's primary domain decides the email charge.
  - category: domain
    as: branch
    reads:
    - bundled_hosting_id
    - domain_id
    - status
    - auto_renew
    - expiry_date
    - nameservers
    - variant_name
    note: The plan's free domain decides the free-domain charge and the scope; the certificate's covered domain decides its Harborline domain credit.
  compute:
  - pf_window: K('window_days')
  - pf_plan_count: XCOUNT('hosting','hosting_charges', charge_type='initial_term')
  - pf_plan_id: CFIELD('hosting','hosting_id', status='active', auto_renew=True)
  - pf_plan_end: CFIELD('hosting','term_end_date', hosting_id=pf_plan_id, status='active', auto_renew=True)
  - pf_plan_days: DAYS(NOW, pf_plan_end) if pf_plan_end != None else -1
  - pf_plan_attempt_in: -1 if pf_plan_days < 0 else ((pf_plan_days - CPARAM('hosting','auto_renew_days_before_term_end', hosting_id=pf_plan_id)) if pf_plan_days - CPARAM('hosting','auto_renew_days_before_term_end', hosting_id=pf_plan_id) >= 0 else ((pf_plan_days - K('plan_retry_1')) if pf_plan_days - K('plan_retry_1') >= 0 else ((pf_plan_days - K('plan_retry_2')) if pf_plan_days - K('plan_retry_2') >= 0 else -1)))
  - pf_downgrades: XCOUNT('hosting','hosting_change_requests', hosting_id=pf_plan_id, request_type='downgrade', request_status='scheduled')
  - pf_review: LATEST('account_events','review_result', date_field='event_at', event_type='account_tier_review')
  - pf_site: CFIELD('hosting','primary_domain', hosting_id=pf_plan_id)
  - pf_sec_count: XCOUNT('security','security_holdings', hosting_id=pf_plan_id, status='active')
  - pf_cert_count: XCOUNT('ssl','ssl_holdings', hosting_id=pf_plan_id, status='active', auto_renew=True)
  - pf_mail_count: XCOUNT('email','email_holdings', email_domain=pf_site, status='active')
  - pf_mail_billing: CFIELD('email','billing_plan', email_domain=pf_site, status='active')
  - pf_mail_next_product: CFIELD('email','scheduled_variant', email_domain=pf_site, status='active')
  - pf_free_status: CFIELD('domain','status', bundled_hosting_id=pf_plan_id)
  - pf_in_scope: pf_plan_count == 1 and pf_plan_id != None and pf_plan_attempt_in >= 0 and pf_plan_attempt_in <= pf_window and pf_downgrades == 0 and pf_review != 'grace_started' and pf_review != 'downgrade_due' and pf_sec_count <= 1 and pf_cert_count <= 1 and pf_mail_count <= 1 and pf_mail_billing != 'annual_monthly_billing' and (pf_mail_next_product == None or pf_mail_next_product == 'none') and pf_free_status != 'grace' and pf_free_status != 'redemption'
  - pf_plan_term: CFIELD('hosting','billing_term_months', hosting_id=pf_plan_id)
  - pf_term_change: XLATEST('hosting','hosting_change_requests','target_term_months', date_field='submitted_at', hosting_id=pf_plan_id, request_type='term_change', request_status='scheduled')
  - pf_plan_list: (CPARAM('hosting','renewal_rate_36mo', hosting_id=pf_plan_id) * 36 if (pf_term_change == 36 or (pf_term_change == None and pf_plan_term == 36)) else (CPARAM('hosting','renewal_rate_24mo', hosting_id=pf_plan_id) * 24 if (pf_term_change == 24 or (pf_term_change == None and pf_plan_term == 24)) else (CPARAM('hosting','monthly_rate_no_commitment', hosting_id=pf_plan_id) if (pf_term_change == 1 or (pf_term_change == None and pf_plan_term == 1)) else CPARAM('hosting','renewal_rate_12mo', hosting_id=pf_plan_id) * 12))) if pf_in_scope else 0
  - pf_plan_discount: pf_plan_list - RND(pf_plan_list * (100 - P('hosting_discount_pct')) / 100 + 0.000000001, 2)
  - pf_cert_end: CFIELD('ssl','subscription_end_date', hosting_id=pf_plan_id, status='active', auto_renew=True)
  - pf_cert_due: pf_in_scope and pf_cert_end != None and DAYS(NOW, pf_cert_end) - CPARAM('ssl','auto_renew_days_before_end', hosting_id=pf_plan_id, status='active', auto_renew=True) >= 0 and DAYS(NOW, pf_cert_end) - CPARAM('ssl','auto_renew_days_before_end', hosting_id=pf_plan_id, status='active', auto_renew=True) <= pf_window
  - pf_cert_id: CFIELD('ssl','certificate_id', hosting_id=pf_plan_id, status='active', auto_renew=True)
  - pf_cert_line_years: XLATEST('ssl','ssl_charges','years', date_field='charge_date', certificate_id=pf_cert_id, event_type='ssl_renewal_charge') if XLATEST('ssl','ssl_charges','years', date_field='charge_date', certificate_id=pf_cert_id, event_type='ssl_renewal_charge') != None else XLATEST('ssl','ssl_charges','years', date_field='charge_date', certificate_id=pf_cert_id, event_type='ssl_purchase_charge', charge_type='new_subscription')
  - pf_cert_years: MN(pf_cert_line_years, CPARAM('ssl','max_subscription_years', hosting_id=pf_plan_id, status='active', auto_renew=True)) if (pf_cert_due and pf_cert_line_years != None) else 0
  - pf_cert_price: CPARAM('ssl','price_3yr_per_year', hosting_id=pf_plan_id, status='active', auto_renew=True) * 3 if (pf_cert_due and pf_cert_years == 3) else (CPARAM('ssl','price_2yr_per_year', hosting_id=pf_plan_id, status='active', auto_renew=True) * 2 if (pf_cert_due and pf_cert_years == 2) else (CPARAM('ssl','price_1yr', hosting_id=pf_plan_id, status='active', auto_renew=True) if (pf_cert_due and pf_cert_years == 1) else 0))
  - pf_cert_n: CFIELD('ssl','extra_names', hosting_id=pf_plan_id, status='active', auto_renew=True) or 0
  - pf_cert_name_rate: (CPARAM('ssl','additional_name_price_per_year', hosting_id=pf_plan_id, status='active', auto_renew=True) or 0) * (CPARAM('ssl','price_3yr_per_year', hosting_id=pf_plan_id, status='active', auto_renew=True) / CPARAM('ssl','price_1yr', hosting_id=pf_plan_id, status='active', auto_renew=True) if pf_cert_years == 3 else (CPARAM('ssl','price_2yr_per_year', hosting_id=pf_plan_id, status='active', auto_renew=True) / CPARAM('ssl','price_1yr', hosting_id=pf_plan_id, status='active', auto_renew=True) if pf_cert_years == 2 else 1))
  - pf_cert_name_units: (MN(pf_cert_n, K('name_band_1')) + K('name_band_rate_1') * MX(0, MN(pf_cert_n, K('name_band_2')) - K('name_band_1')) + K('name_band_rate_2') * MX(0, pf_cert_n - K('name_band_2'))) if pf_cert_years > 1 else pf_cert_n
  - pf_cert_names: pf_cert_name_rate * pf_cert_name_units * pf_cert_years
  - pf_cert_fee: K('revetting_fee_ev') if (CPARAM('ssl','validation_level', hosting_id=pf_plan_id, status='active', auto_renew=True) == 'ev' and CFIELD('ssl','org_validated_date', hosting_id=pf_plan_id, status='active', auto_renew=True) != None and CFIELD('ssl','org_validated_date', hosting_id=pf_plan_id, status='active', auto_renew=True) != '' and DAYS(CFIELD('ssl','org_validated_date', hosting_id=pf_plan_id, status='active', auto_renew=True), pf_cert_end) + 365 > CPARAM('ssl','org_validation_reuse_days', hosting_id=pf_plan_id, status='active', auto_renew=True)) else (K('revetting_fee_ov') if (CPARAM('ssl','validation_level', hosting_id=pf_plan_id, status='active', auto_renew=True) == 'ov' and CFIELD('ssl','org_validated_date', hosting_id=pf_plan_id, status='active', auto_renew=True) != None and CFIELD('ssl','org_validated_date', hosting_id=pf_plan_id, status='active', auto_renew=True) != '' and DAYS(CFIELD('ssl','org_validated_date', hosting_id=pf_plan_id, status='active', auto_renew=True), pf_cert_end) + 365 > CPARAM('ssl','org_validation_reuse_days', hosting_id=pf_plan_id, status='active', auto_renew=True)) else 0)
  - pf_cert_dom: CFIELD('ssl','domain_id', hosting_id=pf_plan_id, status='active', auto_renew=True)
  - pf_cert_credit: (K('domain_credit_harborline_dns') if CFIELD('domain','nameservers', domain_id=pf_cert_dom, status='active') == 'harborline_dns' else (K('domain_credit_external_dns') if CFIELD('domain','nameservers', domain_id=pf_cert_dom, status='active') == 'external' else 0)) if pf_cert_dom != None else 0
  - pf_cert_charge: RND(RND(pf_cert_price * (100 - P('ssl_discount_pct')) / 100 + pf_cert_names + 0.000000001, 2) + pf_cert_fee - pf_cert_credit + 0.000000001, 2) if pf_cert_price > 0 else 0
  - pf_sec_end: CFIELD('security','term_end_date', hosting_id=pf_plan_id, status='active', auto_renew=True)
  - pf_sec_due: pf_in_scope and pf_sec_end != None and DAYS(NOW, pf_sec_end) - CPARAM('security','auto_renew_days_before_term_end', hosting_id=pf_plan_id, status='active', auto_renew=True) >= 0 and DAYS(NOW, pf_sec_end) - CPARAM('security','auto_renew_days_before_term_end', hosting_id=pf_plan_id, status='active', auto_renew=True) <= pf_window
  - pf_sec_term: CFIELD('security','billing_term_months', hosting_id=pf_plan_id, status='active', auto_renew=True)
  - pf_sec_price: CPARAM('security','price_annual', hosting_id=pf_plan_id, status='active', auto_renew=True) if (pf_sec_due and pf_sec_term == 12) else (CPARAM('security','price_monthly', hosting_id=pf_plan_id, status='active', auto_renew=True) if (pf_sec_due and pf_sec_term == 1) else 0)
  - pf_sec_discount: pf_sec_price - RND(pf_sec_price * (100 - MX(CPARAM('security','hosted_site_discount_pct', hosting_id=pf_plan_id, status='active', auto_renew=True) or 0, P('security_discount_pct'))) / 100 + 0.000000001, 2)
  - pf_mail_end: CFIELD('email','term_end_date', email_domain=pf_site, status='active', auto_renew=True)
  - pf_mail_days: DAYS(NOW, pf_mail_end) if pf_mail_end != None else -1
  - pf_mail_attempt_in: -1 if pf_mail_days < 0 else ((pf_mail_days - CPARAM('email','auto_renew_days_before_end', email_domain=pf_site, status='active', auto_renew=True)) if pf_mail_days - CPARAM('email','auto_renew_days_before_end', email_domain=pf_site, status='active', auto_renew=True) >= 0 else ((pf_mail_days - K('mail_retry_1')) if pf_mail_days - K('mail_retry_1') >= 0 else ((pf_mail_days - K('mail_retry_2')) if pf_mail_days - K('mail_retry_2') >= 0 else -1)))
  - pf_mail_due: pf_in_scope and pf_mail_end != None and pf_mail_attempt_in >= 0 and pf_mail_attempt_in <= pf_window
  - pf_mail_plan_ref: CFIELD('email','email_plan_id', email_domain=pf_site, status='active', auto_renew=True)
  - pf_mail_months: MONTHS(CFIELD('email','term_start_date', email_domain=pf_site, status='active', auto_renew=True), NOW) if CFIELD('email','term_start_date', email_domain=pf_site, status='active', auto_renew=True) != None else 0
  - pf_mail_deleted: XCOUNT('email','email_events', within_months=pf_mail_months + 1, date_field='event_at', event_type='email_mailbox_delete', email_plan_id=pf_mail_plan_ref)
  - pf_mail_restored: XCOUNT('email','email_events', within_months=pf_mail_months + 1, date_field='deleted_at', event_type='email_mailbox_restore', email_plan_id=pf_mail_plan_ref)
  - pf_mail_in_use: (CFIELD('email','seat_count', email_domain=pf_site, status='active', auto_renew=True) or 0) - MX(0, pf_mail_deleted - pf_mail_restored)
  - pf_mail_unit: CPARAM('email','seat_price_annual_prepaid', email_domain=pf_site, status='active', auto_renew=True) * 12 if CFIELD('email','billing_plan', email_domain=pf_site, status='active', auto_renew=True) == 'annual_prepaid' else (CPARAM('email','seat_price_monthly', email_domain=pf_site, status='active', auto_renew=True) if CFIELD('email','billing_plan', email_domain=pf_site, status='active', auto_renew=True) == 'monthly' else 0)
  - pf_mail_price: MX(MN(CFIELD('email','scheduled_seat_count', email_domain=pf_site, status='active', auto_renew=True), CFIELD('email','seat_count', email_domain=pf_site, status='active', auto_renew=True)), pf_mail_in_use) * pf_mail_unit if (pf_mail_due and (CFIELD('email','scheduled_seat_count', email_domain=pf_site, status='active', auto_renew=True) or 0) > 0) else (pf_mail_in_use * pf_mail_unit if (pf_mail_due and pf_mail_in_use < (CFIELD('email','seat_count', email_domain=pf_site, status='active', auto_renew=True) or 0)) else ((CFIELD('email','seat_count', email_domain=pf_site, status='active', auto_renew=True) or 0) * pf_mail_unit if pf_mail_due else 0))
  - pf_mail_discount: (pf_mail_price - RND(pf_mail_price * (100 - P('email_discount_pct')) / 100 + 0.000000001, 2)) if CPARAM('email','account_discount_applies', email_domain=pf_site, status='active', auto_renew=True) == True else 0
  - pf_free_days: DAYS(NOW, CFIELD('domain','expiry_date', bundled_hosting_id=pf_plan_id)) if pf_free_status != None else -1
  - pf_free_attempt_in: -1 if pf_free_days < 0 else ((pf_free_days - CPARAM('domain','auto_renew_first_attempt_days_before_expiry', bundled_hosting_id=pf_plan_id)) if pf_free_days - CPARAM('domain','auto_renew_first_attempt_days_before_expiry', bundled_hosting_id=pf_plan_id) >= 0 else ((pf_free_days - K('domain_retry_1')) if pf_free_days - K('domain_retry_1') >= 0 else ((pf_free_days - K('domain_retry_2')) if pf_free_days - K('domain_retry_2') >= 0 else ((pf_free_days - K('domain_retry_3')) if pf_free_days - K('domain_retry_3') >= 0 else -1))))
  - pf_free_renewing: pf_in_scope and (pf_free_status == 'active' or pf_free_status == 'on_hold') and CFIELD('domain','auto_renew', bundled_hosting_id=pf_plan_id) == True and pf_free_attempt_in >= 0 and pf_free_attempt_in <= pf_window
  - pf_free_charge: (RND(CPARAM('domain','renewal_price', bundled_hosting_id=pf_plan_id) * CPARAM('domain','auto_renew_term_years', bundled_hosting_id=pf_plan_id) * (100 - P('domain_renewal_discount_pct')) / 100 + 0.000000001, 2) + CPARAM('domain','icann_fee_per_year', bundled_hosting_id=pf_plan_id) * CPARAM('domain','auto_renew_term_years', bundled_hosting_id=pf_plan_id)) if pf_free_renewing else 0
  - pf_needed: pf_plan_list - pf_plan_discount + pf_cert_charge + pf_sec_price - pf_sec_discount + pf_mail_price - pf_mail_discount + pf_free_charge
  - pf_balance: SUM('account_credit_ledger','amount')
  - pf_shortfall: pf_needed - pf_balance
  - pf_prefund: MX(P('min_deposit_amount'), pf_shortfall)
  - result: 0 if (not pf_in_scope or pf_shortfall <= 0 or pf_prefund > P('max_deposit_per_transaction') or pf_balance + pf_prefund > P('max_credit_balance')) else RND(pf_prefund + 0.000000001, 2)
  compute_basis:
    pf_cert_count: and at most one active certificate subscription with auto-renew on,
    pf_cert_end: The certificate the prefund counts is the certificate subscription installed on the plan, active with auto-renew on,
    pf_cert_due: when its next auto-renew attempt is today or no more than window_days calendar days after today; its charge is the auto-renew charge the ssl charter's published auto-renew rule sets, whichever source pays it.
    pf_cert_id: The certificate the prefund counts is the certificate subscription installed on the plan, active with auto-renew on,
    pf_cert_line_years: It renews for the years of its latest term line, its latest renewal or auto-renew line or, where none has been billed, its purchase line,
    pf_cert_years: at most the product's max_subscription_years,
    pf_cert_price: and its certificate price component is the product's price for those years, price_3yr_per_year times 3 for three years, price_2yr_per_year times 2 for two years and price_1yr for one year.
    pf_cert_n: its extra names are billed without that percentage at additional_name_price_per_year for each name and each year renewed,
    pf_cert_name_rate: each name's yearly price multiplied, on a renewal of two or three years, by the product's per-year price for that term divided by its price_1yr,
    pf_cert_name_units: the names after the first name_band_1 taken at name_band_rate_1 of that price up to the first name_band_2 names and at name_band_rate_2 of it beyond them.
    pf_cert_names: its extra names are billed without that percentage at additional_name_price_per_year for each name and each year renewed,
    pf_cert_fee: 'The re-vetting fee of the prefund''s certificate charge follows the product and the age of its organisation validation, counted as the days from the date it last completed to the current subscription end date plus 365: an EV product whose validation so counted is older than the product''s org_validation_reuse_days adds revetting_fee_ev, an OV product whose validation so counted is older than it adds revetting_fee_ov, and any other certificate adds no fee.'
    pf_cert_dom: 'The Harborline domain credit of the prefund''s certificate charge follows its covered domain:'
    pf_cert_credit: an active Harborline registration on Harborline DNS takes off domain_credit_harborline_dns, an active Harborline registration on external nameservers takes off domain_credit_external_dns, and any other covered domain takes off no credit.
    pf_cert_charge: The reduced amount, the reduced certificate price component together with the extra-name amount, is rounded half up to the cent, and the certificate charge is that amount with the fixed fee added and the fixed credit taken off that apply to it, rounded half up to the cent; a certificate not so due has no certificate charge.
    pf_mail_plan_ref: its renewal falls due on its term end date while it is active, so it is a term renewal under the email charter's published term-renewal rule,
    pf_mail_unit: billed for its renewed seats at the seat price of its billing plan, seat_price_annual_prepaid times 12 for each seat on the annual_prepaid plan and seat_price_monthly on the monthly plan,
    pf_mail_price: 'The email charge of the prefund follows the subscription''s seat records: for a subscription so counted on which a scheduled seat count is set, it is the lower of the scheduled seat count and the seat count, but never fewer than the mailboxes in use, times the seat price; for one so counted with no scheduled seat count and with idle seats, it is the mailboxes in use times the seat price; for any other subscription so counted, it is the seat count times the seat price; and otherwise no email charge is counted.'
    pf_free_status: the plan's free domain, if any, is neither in its renewal grace period nor in redemption,
    pf_free_days: for the free domain the days auto_renew_first_attempt_days_before_expiry, domain_retry_1, domain_retry_2 and domain_retry_3 calendar days before its expiry date,
    pf_free_attempt_in: for the free domain the days auto_renew_first_attempt_days_before_expiry, domain_retry_1, domain_retry_2 and domain_retry_3 calendar days before its expiry date, the domain charter's auto_renew_retry_days_before_expiry;
    pf_free_renewing: 'The free-domain charge of the prefund is the auto-renew charge of the domain registered under the plan''s free-domain entitlement where that domain is active or on_hold with auto-renew on and its next auto-renew attempt is today or no more than window_days calendar days after today:'
    pf_free_charge: its renewal for auto_renew_term_years years at the TLD's renewal_price times those years reduced by the account tier's domain_renewal_discount_pct and rounded half up to the cent, plus icann_fee_per_year times those years, which is never discounted; otherwise no free-domain charge is counted.
    pf_plan_count: It handles a customer whose hosting billing shows exactly one initial-term charge, meaning one hosting plan ever ordered,
    pf_plan_id: while that plan is active with auto-renew on and its next auto-renew attempt is today or no more than window_days calendar days after today,
    pf_plan_end: for the plan the days auto_renew_days_before_term_end, plan_retry_1 and plan_retry_2 calendar days before its term end date,
    pf_plan_days: for the plan the days auto_renew_days_before_term_end, plan_retry_1 and plan_retry_2 calendar days before its term end date,
    pf_plan_attempt_in: 'A product''s next auto-renew attempt is the first of its first attempt day and its retry days under its own charter that is today or later:'
    pf_downgrades: the plan has no scheduled downgrade,
    pf_review: the account's most recent tier review neither started a downgrade grace nor found a downgrade due,
    pf_site: at most one active email subscription is on its primary domain,
    pf_sec_count: the plan carries at most one active site security plan
    pf_mail_count: at most one active email subscription is on its primary domain,
    pf_mail_billing: and that email subscription, if any, is neither billed annually in monthly instalments nor scheduled to change product;
    pf_mail_next_product: and that email subscription, if any, is neither billed annually in monthly instalments nor scheduled to change product;
    pf_window: 'so that account credit can pay, within the coming window_days calendar days, the charges that keep the website on their hosting plan running:'
    pf_in_scope: a deposit for any other purpose, or by any other customer, is the amount the holder chooses, under the base deposit rule, and charges of any other holding are not counted by the prefund.
    pf_plan_term: 'which is the term of a term change scheduled for the plan where one is scheduled and otherwise the plan''s current term length:'
    pf_term_change: 'which is the term of a term change scheduled for the plan where one is scheduled and otherwise the plan''s current term length:'
    pf_plan_list: a new term of 36 months is priced at renewal_rate_36mo times 36, a new term of 24 months at renewal_rate_24mo times 24, a new term of 1 month at monthly_rate_no_commitment with no setup fee, and any other new term at renewal_rate_12mo times 12; the price so found is the plan's renewal list price.
    pf_plan_discount: The plan's renewal list price is reduced by the account tier's hosting_discount_pct, the discount being the list price less the reduced price rounded half up to the cent.
    pf_sec_end: The security plan the prefund counts is the site security plan whose site runs on the plan, active with auto-renew on,
    pf_sec_due: and for the certificate and the security plan, which have no retry days, the single day auto_renew_days_before_end or auto_renew_days_before_term_end calendar days before the end date under their charters.
    pf_sec_term: 'The security plan charge of the prefund follows the security plan''s billing term:'
    pf_sec_price: a 12-month term is priced at price_annual, a 1-month term at price_monthly, and otherwise no security plan charge is counted.
    pf_sec_discount: because its site runs on an active Harborline plan, its charge is reduced by the higher of the product's hosted_site_discount_pct and the account tier's security_discount_pct, the two never added, the discount being the charge less the reduced charge rounded half up to the cent.
    pf_mail_end: The email subscription the prefund counts is the one on the plan's primary domain, active with auto-renew on,
    pf_mail_days: for the email subscription the days auto_renew_days_before_end, mail_retry_1 and mail_retry_2 calendar days before its term end date, the email charter's auto_renew_retry_days_before_end;
    pf_mail_attempt_in: for the email subscription the days auto_renew_days_before_end, mail_retry_1 and mail_retry_2 calendar days before its term end date, the email charter's auto_renew_retry_days_before_end;
    pf_mail_due: The email subscription the prefund counts is the one on the plan's primary domain, active with auto-renew on, when its next auto-renew attempt is today or no more than window_days calendar days after today;
    pf_mail_months: a deletion and its restore counting in the current term where the whole calendar months from the deletion date to today are no more than the whole calendar months from the term start date to today.
    pf_mail_deleted: the mailbox deletions recorded on the subscription in the current term less the restores of those deletions,
    pf_mail_restored: the mailbox deletions recorded on the subscription in the current term less the restores of those deletions,
    pf_mail_in_use: The mailboxes in use are the seat count less the idle seats,
    pf_mail_discount: and where the product's account_discount_applies is true its charge is reduced by the account tier's email_discount_pct, the discount being the charge less the reduced charge rounded half up to the cent, while Microsoft 365 seats are never discounted.
    pf_needed: The credit the prefund must cover is the plan's renewal list price together with every other counted charge, all added together, less every discount that applies.
    pf_balance: The credit balance counted is the sum of all the account's credit ledger entries.
    pf_shortfall: The prefund deposit is the credit the prefund must cover less the credit balance;
    pf_prefund: where that is zero or less no prefund is needed and none is taken, and otherwise the prefund is at least min_deposit_amount and is rounded half up to the cent.
    result: A prefund that would exceed max_deposit_per_transaction, or that would raise the credit balance above max_credit_balance, is refused in full and no prefund is taken.
  factors:
  - id: plan_term_rate
    effect: parameter
    decides: pf_plan_list
    bindings:
    - pf_plan_term
    - pf_term_change
    - pf_plan_list
    ladder:
    - when: a term change to 36 months is scheduled for the plan, or none is scheduled and the plan is on a 36-month term
      value: renewal_rate_36mo times 36
    - when: a term change to 24 months is scheduled for the plan, or none is scheduled and the plan is on a 24-month term
      value: renewal_rate_24mo times 24
    - when: a term change to 1 month is scheduled for the plan, or none is scheduled and the plan is on the 1-month term
      value: monthly_rate_no_commitment
    - when: otherwise
      value: renewal_rate_12mo times 12
    baseline:
      pf_plan_list: CPARAM('hosting','renewal_rate_12mo', hosting_id=pf_plan_id) * 12 if pf_in_scope else 0
    evidence:
    - cross_category
    - history
    cross_difficulty: hosting
  - id: certificate_revetting_fee
    effect: parameter
    decides: pf_cert_fee
    bindings:
    - pf_cert_fee
    ladder:
    - when: the certificate is an EV product whose organisation validation, aged to one year after its current end date, is older than the reuse period
      value: revetting_fee_ev
    - when: it is an OV product whose organisation validation, so aged, is older than the reuse period
      value: revetting_fee_ov
    - when: otherwise
      value: '0'
    baseline:
      pf_cert_fee: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: ssl
  - id: certificate_domain_credit
    effect: parameter
    decides: pf_cert_credit
    bindings:
    - pf_cert_dom
    - pf_cert_credit
    ladder:
    - when: the certificate's covered domain is an active Harborline registration on Harborline DNS
      value: domain_credit_harborline_dns
    - when: it is an active Harborline registration on external nameservers
      value: domain_credit_external_dns
    - when: otherwise
      value: '0'
    baseline:
      pf_cert_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: domain
  - id: security_plan_charge
    effect: parameter
    decides: pf_sec_price
    bindings:
    - pf_sec_end
    - pf_sec_due
    - pf_sec_term
    - pf_sec_price
    - pf_sec_discount
    ladder:
    - when: the security plan on the plan's site is due in the window on a 12-month term
      value: price_annual
    - when: it is due in the window on a 1-month term
      value: price_monthly
    - when: otherwise
      value: '0'
    baseline:
      pf_sec_price: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: security
  - id: email_renewal_charge
    effect: method
    decides: pf_mail_price
    bindings:
    - pf_mail_end
    - pf_mail_days
    - pf_mail_attempt_in
    - pf_mail_due
    - pf_mail_plan_ref
    - pf_mail_months
    - pf_mail_deleted
    - pf_mail_restored
    - pf_mail_in_use
    - pf_mail_unit
    - pf_mail_price
    ladder:
    - when: the email subscription on the plan's primary domain is counted and a scheduled seat count is set
      method: the lower of the scheduled seat count and the seat count, never fewer than the mailboxes in use, times the seat price
    - when: it is counted, no scheduled seat count is set and it has idle seats in the current term
      method: the mailboxes in use, the seat count less the idle seats, times the seat price
    - when: it is counted with no scheduled seat count and no idle seats
      method: the seat count times the seat price
    - when: otherwise
      method: no email charge
