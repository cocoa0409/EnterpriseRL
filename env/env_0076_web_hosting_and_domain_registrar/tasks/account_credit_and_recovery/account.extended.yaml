      - {category: hosting, table: hosting_charges, aggregate: latest, field: hosting_id, filters: {charge_type: initial_term}}
      - {category: hosting, table: hosting_charges, aggregate: count, field: amount, filters: {charge_type: sla_credit}}
    cross_category: [hosting, domain]
