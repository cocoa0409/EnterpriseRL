        For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
  trigger: state_due
