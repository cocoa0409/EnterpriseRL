# Product charter — Harborline Customer Accounts (category: account). Single registry of every quantified policy of this category.
category: account
display_name: Harborline Customer Accounts
binding:
  holding_table: account_holdings
  event_tables:
  - account_credit_ledger
  - account_events
  intake_tables:
  - account_recovery_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    credit_balance: account_credit
lifecycle:
  states:
  - unverified
  - active
  - recovery_hold
  - locked
  - closed
  transitions:
  - from: unverified
    to: active
    by: system
    means: The customer confirms the sign-up verification email and the account becomes usable.
  - from: unverified
    to: closed
    by: system
    means: An account never confirmed within the verification window is purged.
  - from: active
    to: recovery_hold
    by: system
    means: An account recovery request is approved by the Trust and Safety review and the account enters its recovery
      waiting period.
  - from: recovery_hold
    to: active
    by: system
    means: The recovery waiting period elapses, the approved recovery is applied and the account returns to normal
      use.
  - from: active
    to: locked
    by: system
    means: The account is locked because a payment was charged back or Trust and Safety flags a suspected compromise.
  - from: locked
    to: active
    by: agent
    means: A locked account is unlocked after the cause is resolved and the caller is verified.
  - from: active
    to: closed
    by: user
    means: The account holder closes the account.
  - from: closed
    to: active
    by: agent
    means: A closed account is reopened at the holder's request inside the reopening window.
accounts:
- key: account_credit
  unit: USD
  meaning: 'Harborline account credit available to pay for any Harborline product: deposits, refunds taken as credit
    and goodwill credits add to it; purchases paid from credit, withdrawals and charge-back reversals take from
    it.'
parameter_schema:
  domain_registration_discount_pct: Percent off the registration_price component of new domain registrations, applied
    by the domain pricing rules
  domain_renewal_discount_pct: Percent off the renewal_price component of manual domain renewals and auto-renew
    charges
  hosting_discount_pct: Percent off hosting plan term prices (not setup fees or proration lines)
  ssl_discount_pct: Percent off SSL certificate subscription prices
  email_discount_pct: Percent off Harborline Mail seat prices (Microsoft 365 seats never discounted)
  server_discount_pct: Percent off VPS and dedicated server term prices
  security_discount_pct: Percent off website security plan prices
  tier_min_deposits_365d: Minimum total account credit deposited in the trailing 365 days to qualify for or keep
    the tier, USD
  tier_requires_business_profile: Whether the tier requires a business customer profile, boolean
  reseller_agreement_required: Whether the Harborline Reseller Agreement must be accepted for the tier, boolean
  tier_review_cycle_days: Calendar days between automatic tier qualification reviews, counted from the last tier
    change
  tier_downgrade_grace_days: Calendar days after a failed tier review during which the current tier is kept so the
    customer can requalify
  min_deposit_amount: Smallest single account credit deposit accepted, USD
  max_deposit_per_transaction: Largest single account credit deposit accepted, USD
  max_credit_balance: Largest account credit balance the account may hold after a deposit, USD
  deposit_methods: Funding methods accepted for deposits, list of card, paypal, bank_transfer
  bank_transfer_min_amount: Smallest deposit accepted by bank transfer, USD (0.00 where bank transfer is not offered)
  credit_first_for_auto_renew: Whether account credit is tried before the default card for every auto-renew charge,
    boolean
  credit_partial_application_allowed: Whether a purchase may be paid partly from credit and partly from a card,
    boolean
  withdrawal_window_days: Calendar days after a deposit within which its unused amount may be withdrawn to the original
    payment method
  withdrawal_processing_business_days: Business days, Monday-Friday excluding US federal holidays, to return a withdrawal
    to the original payment method
  withdrawal_min_amount: Smallest withdrawal accepted, USD
  refund_credit_withdrawable: Whether credit that arose from a refund taken as credit can be withdrawn as cash,
    boolean
  goodwill_credit_withdrawable: Whether goodwill credit can be withdrawn as cash, boolean
  goodwill_max_per_case: Largest goodwill credit a support agent may grant for one documented service failure, USD
  goodwill_max_per_365d: Largest total goodwill credit granted to one account in a trailing 365 days, USD
  two_factor_required: Whether two-factor sign-in must stay enabled on the account, boolean
  recovery_hold_hours: Elapsed hours of the waiting period between approval of an account recovery and the reset
    taking effect
  recovery_methods: Recovery evidence routes accepted, list of email_link, pin_and_card, government_id
  recovery_review_business_days: Business days, Monday-Friday excluding US federal holidays, for Trust and Safety
    to decide a recovery request
  max_recovery_requests_30d: Largest number of recovery requests one account may submit in a trailing 30 days
  recovery_rejection_cooldown_days: Calendar days after a rejected recovery request before a new request may be
    submitted
  security_notice_to_previous_email: Whether every sign-in email or two-factor change is notified to the previous
    sign-in email, boolean
  failed_login_threshold: Consecutive failed sign-in attempts that trigger a temporary sign-in lockout
  login_lockout_minutes: Minutes a temporary sign-in lockout lasts
  chargeback_fee: Administrative fee recovered when a payment is charged back, USD
  chargeback_locks_account: Whether a charge-back locks the account, boolean
  unlock_requires_repayment: Whether a charge-back lock is lifted only after the disputed amount and the fee are
    repaid or the dispute is withdrawn, boolean
  max_team_members: Largest number of team member logins with delegated access
  api_access: Whether the reseller API is enabled, boolean
  api_rate_limit_per_minute: API calls allowed per minute (0 where the API is not enabled)
  sub_account_billing: Whether the account may bill end clients through sub-accounts, boolean
  priority_support: Whether calls and chats route to the priority support queue, boolean
  dedicated_account_manager: Whether a named account manager is assigned, boolean
  first_response_sla_hours: Elapsed hours within which a ticket receives its first human response
  closure_requires_no_live_holdings: Whether an account may be closed only when it holds no live product in any
    category, boolean
  closure_reopen_window_days: Calendar days after closure within which the account may be reopened
  closure_refunds_deposit_credit: Whether unused deposited credit is returned to the original payment method at
    closure, boolean
  unverified_purge_days: Calendar days after sign-up after which an unconfirmed account is purged
  email_verification_link_hours: Elapsed hours a sign-up verification link stays valid
  credit_rounding: 'Rounding of every credit amount: half_up_to_cent'
