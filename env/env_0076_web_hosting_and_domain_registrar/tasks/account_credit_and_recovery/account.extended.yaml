    du_refund_dest: "The funding-route uplift of the duplicate-charge goodwill follows how the duplicate was paid and where its refund line sent the money:"
    du_route_uplift: "a duplicate taken from a card or PayPal and refunded to that original payment method, which reaches the customer only after the card or PayPal processing time, adds uplift_card_refund_to_card; a duplicate taken from a card or PayPal and refunded to account credit at the customer's election, its refund credit entry for the duplicate's order number being on the account's credit ledger, adds uplift_card_refund_to_credit; any other duplicate, such as one paid from account credit and so refunded to account credit, adds nothing."
    du_dup_order: "its refund credit entry for the duplicate's order number being on the account's credit ledger,"
