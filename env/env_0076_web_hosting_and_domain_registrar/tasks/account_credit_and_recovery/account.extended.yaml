    du_basis_lag: "The days until the duplicate was refunded are the calendar days from the duplicate charge's date to its refund line's date."
    du_basis: "where the days until the duplicate was refunded are week_lag_days or more, the basis is the duplicate charge's full amount plus per_started_week for each started week of those days; where they are short_lag_days or more but fewer than week_lag_days, the basis is flat_short_lag; where they are fewer than short_lag_days, the basis is base_share of the duplicate charge's amount."
    du_dup_method: "The funding-route uplift of the duplicate-charge goodwill follows how the duplicate was paid and where its refund line sent the money:"
