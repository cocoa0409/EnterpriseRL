    du_tier_since: "an account whose current tier is Harborline Reseller Gold or Harborline Reseller Platinum and whose tier changed date is on or before the duplicate's charge date adds uplift_partner_top;"
    du_partner_uplift: "The partner uplift of the duplicate-charge goodwill follows the account's current tier and its tier changed date:"
