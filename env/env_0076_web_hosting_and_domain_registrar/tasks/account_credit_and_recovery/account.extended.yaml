- id: account_ext_provisioning_goodwill
  base_policy_refs: [account_goodwill]
  overwrite:
    - base_policy: account_goodwill
      superseded_clause: >-
        A grant may not exceed the tier's goodwill_max_per_case, nor bring account_msr_goodwill_365d above goodwill_max_per_365d, and a request beyond either limit is granted only up to the remaining limit.
      replaced_by: >-
        For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
  trigger: state_due
  subject: [account_goodwill_credit]
  computes: amount
  target_tool: grant_provisioning_goodwill_e1bd747b
  params:
    late_days_min: 2
    week_tier_days: 7
    month_tier_days: 3
    mult_cloud: 1.5
    mult_pro_business: 1.25
    uplift_harborline_dns: 10.0
    uplift_external_dns: 4.0
    mult_term_36: 1.2
    mult_term_24: 1.1
    mult_term_12: 1.05
    mult_after_refund: 0.5
    mult_after_sla_credit: 0.8
    uplift_trial_all: 6.0
    uplift_trial_part: 3.0
    trial_part_share: 0.25
  rule: >-
    Harborline's published goodwill schedule for late hosting provisioning credits goodwill to the account, without
    the customer having to ask, for the hosting plan of the customer's most recent initial-term charge, where no other
    initial-term charge shares that charge date, while that plan is active and in its first term, whenever its
    activation date is late_days_min or more calendar days after its order date; a plan activated earlier than that,
    or a customer whose most recent initial-term charge date is shared by another initial-term charge, is outside this
    schedule. Because every plan's provisioning deadline is a matter of hours, a plan activated late_days_min or more
    calendar days after its order date has always missed it.
    Goodwill credit may be granted only while the account status is active, one grant may be made per affected
    holding or charge reference, and the grant is posted against the order number of the plan's initial-term charge
    with hosting as the affected category.
    The days the late provisioning lasted are the calendar days from the plan's order date to its activation date.
    The plan's daily term value is the plan's initial-term charge divided by the calendar days from its term start
    date to its term end date.
    The late-provisioning goodwill figure is the plan's daily term value times the days the late provisioning
    lasted.
    For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
    The late-provisioning goodwill granted is the late-provisioning goodwill figure limited in that way and rounded
    half up to the cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no
    entry is posted.
    Where the schedule's adjustments apply, the late-provisioning goodwill figure is first multiplied by every
    multiplier that applies, the fixed uplifts that apply are then added, the limits are then applied, and only the
    final figure is rounded half up to the cent.
    The compensation basis of the late-provisioning goodwill depends on how long the provisioning was late: where
    the days the late provisioning lasted are week_tier_days or more, the basis is the plan's monthly term value,
    which is the plan's initial-term charge divided by the plan's term length in months, for each started week of
    those days; where they are month_tier_days or more but fewer than week_tier_days, the basis is one monthly term
    value; where they are fewer than month_tier_days, the basis is the plan's daily term value times those days.
    The plan class multiplier of the late-provisioning goodwill follows the plan's tier: a Harborline Cloud 4 or
    Harborline Cloud 8 plan takes mult_cloud, a Harborline Pro or Harborline Business plan takes
    mult_pro_business, and any other plan takes one.
    The site-outage uplift of the late-provisioning goodwill follows the plan's primary domain: where that domain
    is an active Harborline domain of the customer using Harborline DNS nameservers, the uplift is
    uplift_harborline_dns; where it is an active Harborline domain of the customer using external nameservers, the
    uplift is uplift_external_dns; where it is not an active Harborline domain of the customer, no uplift is added.
    The commitment multiplier of the late-provisioning goodwill follows the plan's term length: a 36-month term
    takes mult_term_36, a 24-month term takes mult_term_24, a 12-month term takes mult_term_12, and any other term
    takes one.
    The prior-remedy multiplier of the late-provisioning goodwill follows the plan's own charge lines: where the
    plan carries a refund line, the multiplier is mult_after_refund; where it carries no refund line but carries an
    uptime service credit line, the multiplier is mult_after_sla_credit; where it carries neither, the multiplier
    is one.
    The money-back uplift of the late-provisioning goodwill follows how much of the plan's money-back period, its
    tier's money_back_days counted from the order date, the late provisioning used up: where the days the late
    provisioning lasted exceed money_back_days, the uplift is uplift_trial_all; where they are trial_part_share of
    money_back_days or more but do not exceed it, the uplift is uplift_trial_part; where they are fewer, no uplift is
    added.
  baseline:
    rule: >-
      The days the late provisioning lasted are the calendar days from the plan's order date to its activation date.
      The plan's daily term value is the plan's initial-term charge divided by the calendar days from its term start
      date to its term end date.
      The late-provisioning goodwill figure is the plan's daily term value times the days the late provisioning
      lasted.
      For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today, a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit; a goodwill grant made under none of Harborline's published service-failure goodwill schedules (late hosting provisioning, late recovery review decisions, same-day duplicate domain auto-renew charges, late certificate issuance, late recovery resets and late refund postings) remains under the base limit sentence.
      The late-provisioning goodwill granted is the late-provisioning goodwill figure limited in that way and rounded
      half up to the cent once, at the end; where the limited amount is zero, nothing is owed under this schedule and no
      entry is posted.
    params: [goodwill_max_per_case, goodwill_max_per_365d]
  prerequisite: []
  cross_category:
    - category: hosting
      as: branch
      reads: [hosting_id, status, first_term, opened_date, activated_date, term_start_date, term_end_date, billing_term_months, variant_name, primary_domain, hosting_charges.amount, hosting_charges.charge_type, hosting_charges.event_type, hosting_charges.charge_date]
      note: The plan's dates, tier, term, money-back period and charge lines decide the basis and the class, commitment, prior-remedy and money-back factors.
    - category: domain
      as: branch
      reads: [domain_name, status, nameservers]
      note: The plan's primary domain decides the site-outage uplift.
  compute:
    - pg_plan_id: "XLATEST('hosting','hosting_charges','hosting_id', date_field='charge_date', charge_type='initial_term')"
    - pg_plan_date: "XLATEST('hosting','hosting_charges','charge_date', date_field='charge_date', charge_type='initial_term')"
    - pg_same_day: "XCOUNT('hosting','hosting_charges', charge_type='initial_term', charge_date=pg_plan_date)"
    - pg_order_date: "CFIELD('hosting','opened_date', hosting_id=pg_plan_id, status='active', first_term=True)"
    - pg_activation_date: "CFIELD('hosting','activated_date', hosting_id=pg_plan_id, status='active', first_term=True)"
    - pg_late_days: "DAYS(pg_order_date, pg_activation_date) if (pg_same_day == 1 and pg_order_date != None and pg_activation_date != None and pg_activation_date != '') else 0"
    - pg_term_charge: "XSUM('hosting','hosting_charges','amount', hosting_id=pg_plan_id, charge_type='initial_term')"
    - pg_term_days: "DAYS(CFIELD('hosting','term_start_date', hosting_id=pg_plan_id), CFIELD('hosting','term_end_date', hosting_id=pg_plan_id)) if pg_order_date != None else 1"
    - pg_daily_value: "pg_term_charge / pg_term_days"
    - pg_monthly_value: "XSUM('hosting','hosting_charges','amount', hosting_id=pg_plan_id, charge_type='initial_term') / CFIELD('hosting','billing_term_months', hosting_id=pg_plan_id) if pg_order_date != None else 0"
    - pg_basis: "pg_monthly_value * (-(-pg_late_days // K('week_tier_days'))) if pg_late_days >= K('week_tier_days') else (pg_monthly_value if pg_late_days >= K('month_tier_days') else pg_daily_value * pg_late_days)"
    - pg_variant: "CFIELD('hosting','variant_name', hosting_id=pg_plan_id)"
    - pg_class_mult: "K('mult_cloud') if (pg_variant == 'Harborline Cloud 4' or pg_variant == 'Harborline Cloud 8') else (K('mult_pro_business') if (pg_variant == 'Harborline Pro' or pg_variant == 'Harborline Business') else 1.0)"
    - pg_primary: "CFIELD('hosting','primary_domain', hosting_id=pg_plan_id)"
    - pg_primary_live: "EXISTS('domain', domain_name=pg_primary, status='active')"
    - pg_primary_ns: "CFIELD('domain','nameservers', domain_name=pg_primary, status='active')"
    - pg_outage_uplift: "K('uplift_harborline_dns') if (pg_primary_live and pg_primary_ns == 'harborline_dns') else (K('uplift_external_dns') if (pg_primary_live and pg_primary_ns == 'external') else 0)"
    - pg_commit_term: "CFIELD('hosting','billing_term_months', hosting_id=pg_plan_id)"
    - pg_commit_mult: "K('mult_term_36') if pg_commit_term == 36 else (K('mult_term_24') if pg_commit_term == 24 else (K('mult_term_12') if pg_commit_term == 12 else 1.0))"
    - pg_refund_lines: "XCOUNT('hosting','hosting_charges', hosting_id=pg_plan_id, event_type='hosting_refund')"
    - pg_sla_lines: "XCOUNT('hosting','hosting_charges', hosting_id=pg_plan_id, charge_type='sla_credit')"
    - pg_remedy_mult: "K('mult_after_refund') if pg_refund_lines >= 1 else (K('mult_after_sla_credit') if (pg_refund_lines == 0 and pg_sla_lines >= 1) else 1.0)"
    - pg_trial_days: "CPARAM('hosting','money_back_days', hosting_id=pg_plan_id) or 0"
    - pg_trial_late: "DAYS(CFIELD('hosting','opened_date', hosting_id=pg_plan_id), CFIELD('hosting','activated_date', hosting_id=pg_plan_id)) if pg_late_days > 0 else 0"
    - pg_trial_uplift: "K('uplift_trial_all') if (pg_trial_late > pg_trial_days and pg_trial_days > 0) else (K('uplift_trial_part') if (pg_trial_late >= K('trial_part_share') * pg_trial_days and pg_trial_late <= pg_trial_days and pg_trial_days > 0) else 0)"
    - pg_figure: "0 if pg_late_days < K('late_days_min') else pg_basis * pg_class_mult * pg_commit_mult * pg_remedy_mult + pg_outage_uplift + pg_trial_uplift"
    - pg_year_total: "SUM('account_credit_ledger','amount', within_months=12, date_field='entry_date', credit_origin='goodwill')"
    - pg_year_room: "MX(0, P('goodwill_max_per_365d') - pg_year_total)"
    - result: "RND(MN(pg_figure, P('goodwill_max_per_case'), pg_year_room), 2)"
  compute_basis:
    pg_plan_id: "for the hosting plan of the customer's most recent initial-term charge, where no other initial-term charge shares that charge date, while that plan is active and in its first term,"
    pg_plan_date: "for the hosting plan of the customer's most recent initial-term charge, where no other initial-term charge shares that charge date, while that plan is active and in its first term,"
    pg_same_day: "or a customer whose most recent initial-term charge date is shared by another initial-term charge, is outside this schedule."
    pg_order_date: "The days the late provisioning lasted are the calendar days from the plan's order date to its activation date."
    pg_activation_date: "The days the late provisioning lasted are the calendar days from the plan's order date to its activation date."
    pg_late_days: "The days the late provisioning lasted are the calendar days from the plan's order date to its activation date."
    pg_term_charge: "The plan's daily term value is the plan's initial-term charge divided by the calendar days from its term start date to its term end date."
    pg_term_days: "The plan's daily term value is the plan's initial-term charge divided by the calendar days from its term start date to its term end date."
    pg_daily_value: "The plan's daily term value is the plan's initial-term charge divided by the calendar days from its term start date to its term end date."
    pg_monthly_value: "which is the plan's initial-term charge divided by the plan's term length in months, for each started week of those days;"
    pg_basis: "where they are month_tier_days or more but fewer than week_tier_days, the basis is one monthly term value; where they are fewer than month_tier_days, the basis is the plan's daily term value times those days."
    pg_variant: "The plan class multiplier of the late-provisioning goodwill follows the plan's tier:"
    pg_class_mult: "a Harborline Cloud 4 or Harborline Cloud 8 plan takes mult_cloud, a Harborline Pro or Harborline Business plan takes mult_pro_business, and any other plan takes one."
    pg_primary: "The site-outage uplift of the late-provisioning goodwill follows the plan's primary domain:"
    pg_primary_live: "where that domain is an active Harborline domain of the customer using Harborline DNS nameservers, the uplift is uplift_harborline_dns;"
    pg_primary_ns: "where it is an active Harborline domain of the customer using external nameservers, the uplift is uplift_external_dns;"
    pg_outage_uplift: "where it is not an active Harborline domain of the customer, no uplift is added."
    pg_commit_term: "The commitment multiplier of the late-provisioning goodwill follows the plan's term length:"
    pg_commit_mult: "a 36-month term takes mult_term_36, a 24-month term takes mult_term_24, a 12-month term takes mult_term_12, and any other term takes one."
    pg_refund_lines: "where the plan carries a refund line, the multiplier is mult_after_refund;"
    pg_sla_lines: "where it carries no refund line but carries an uptime service credit line, the multiplier is mult_after_sla_credit;"
    pg_remedy_mult: "where it carries neither, the multiplier is one."
    pg_trial_days: "The money-back uplift of the late-provisioning goodwill follows how much of the plan's money-back period, its tier's money_back_days counted from the order date, the late provisioning used up:"
    pg_trial_late: "where the days the late provisioning lasted exceed money_back_days, the uplift is uplift_trial_all;"
    pg_trial_uplift: "where they are trial_part_share of money_back_days or more but do not exceed it, the uplift is uplift_trial_part; where they are fewer, no uplift is added."
    pg_figure: "Where the schedule's adjustments apply, the late-provisioning goodwill figure is first multiplied by every multiplier that applies, the fixed uplifts that apply are then added, the limits are then applied, and only the final figure is rounded half up to the cent."
    pg_year_total: "For a grant under this schedule the yearly goodwill total is the sum of the goodwill entries dated after the same calendar date one year before today,"
    pg_year_room: "a grant may not exceed the tier's goodwill_max_per_case nor bring that yearly goodwill total above goodwill_max_per_365d, and a grant beyond either limit is made only up to the remaining limit;"
    result: "The late-provisioning goodwill granted is the late-provisioning goodwill figure limited in that way and rounded half up to the cent once, at the end;"
  factors:
    - id: delay_basis
      effect: method
      decides: pg_basis
      bindings: [pg_monthly_value, pg_basis]
      ladder:
        - when: "the days the late provisioning lasted are week_tier_days or more"
          method: "the plan's monthly term value for each started week of those days"
        - when: "those days are month_tier_days or more but fewer than week_tier_days"
          method: "one monthly term value"
        - when: "otherwise"
          method: "the plan's daily term value times those days"
      baseline:
        pg_basis: "pg_daily_value * pg_late_days"
      evidence: [cross_category, date]
      cross_difficulty: hosting
    - id: plan_class
      effect: parameter
      decides: pg_class_mult
      bindings: [pg_variant, pg_class_mult]
      ladder:
        - when: "the plan is Harborline Cloud 4 or Harborline Cloud 8"
          value: "K('mult_cloud')"
        - when: "the plan is Harborline Pro or Harborline Business"
          value: "K('mult_pro_business')"
        - when: "otherwise"
          value: "1.0"
      baseline:
        pg_class_mult: "1.0"
      evidence: [cross_category]
      cross_difficulty: hosting
    - id: site_outage
      effect: parameter
      decides: pg_outage_uplift
      bindings: [pg_primary, pg_primary_live, pg_primary_ns, pg_outage_uplift]
      ladder:
        - when: "the plan's primary domain is an active Harborline domain of the customer and it uses Harborline DNS nameservers"
          value: "K('uplift_harborline_dns')"
        - when: "the plan's primary domain is an active Harborline domain of the customer and it uses external nameservers"
          value: "K('uplift_external_dns')"
        - when: "otherwise"
          value: "0"
      baseline:
        pg_outage_uplift: "0"
      evidence: [cross_category]
      cross_difficulty: domain
    - id: term_commitment
      effect: parameter
      decides: pg_commit_mult
      bindings: [pg_commit_term, pg_commit_mult]
      ladder:
        - when: "the plan is on a 36-month term"
          value: "K('mult_term_36')"
        - when: "the plan is on a 24-month term"
          value: "K('mult_term_24')"
        - when: "the plan is on a 12-month term"
          value: "K('mult_term_12')"
        - when: "otherwise"
          value: "1.0"
      baseline:
        pg_commit_mult: "1.0"
      evidence: [cross_category]
      cross_difficulty: hosting
    - id: prior_remedy
      effect: parameter
      decides: pg_remedy_mult
      bindings: [pg_refund_lines, pg_sla_lines, pg_remedy_mult]
      ladder:
        - when: "the plan carries a refund line"
          value: "K('mult_after_refund')"
        - when: "the plan carries no refund line and carries an uptime service credit line"
          value: "K('mult_after_sla_credit')"
        - when: "otherwise"
          value: "1.0"
      baseline:
        pg_remedy_mult: "1.0"
      evidence: [cross_category, history]
      cross_difficulty: hosting
    - id: money_back_time
      effect: parameter
      decides: pg_trial_uplift
      bindings: [pg_trial_days, pg_trial_late, pg_trial_uplift]
      ladder:
        - when: "the days the late provisioning lasted exceed the tier's money_back_days"
          value: "K('uplift_trial_all')"
        - when: "they are trial_part_share of money_back_days or more but do not exceed it"
          value: "K('uplift_trial_part')"
        - when: "otherwise"
          value: "0"
      baseline:
        pg_trial_uplift: "0"
      evidence: [cross_category, date]
      cross_difficulty: hosting
  inputs:
