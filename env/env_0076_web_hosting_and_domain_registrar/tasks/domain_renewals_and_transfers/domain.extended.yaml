    ml_bundle: The manual line's hosting credit, one of the charge's Domain Care credits, is bundle_credit_annual for each year the charge covered where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each year the charge covered where such a plan has status active and a billing term of 1 month, and nothing otherwise.
    ml_plan_var: where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan
    ml_plan: The manual line's plan allowance, one of the charge's Domain Care credits, is the amount by which the TLD's renewal_price exceeds its registration_price, for each year the charge covered, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each year the charge covered, also where the renewal_price does not exceed the registration_price; the flat plan_allowance_standard once for the charge where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active.
    ml_deposits: the account credit deposits posted on the customer's account less than 12 whole months before the day of the price match
    ml_volume: The manual line's volume credit, one of the charge's Domain Care credits, is volume_credit_high for each year the charge covered where the account credit deposits posted on the customer's account less than 12 whole months before the day of the price match total volume_threshold_high or more, volume_credit_low for each year the charge covered where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached.
    ml_declines: no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the price match
    ml_autopay: The manual line's autopay credit, one of the charge's Domain Care credits, is autopay_credit_full for each year the charge covered where the domain's auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the price match, autopay_credit_partial for each year the charge covered where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off.
    ml_term_span: the years the charge covered
    ml_term: The manual line's term credit, one of the charge's Domain Care credits, is term_credit_per_year times the years the charge covered where they come to 5 or more, the flat term_credit_flat where they come to 2 to 4, and nothing where they come to 1.
    ml_credits: The Domain Care credits of a manual renewal charge are the amounts this rule names as one of the charge's Domain Care credits, added together, each read from the account's records on the day of the price match.
    result: The price-match refund is the charge's Domain Care credits, never more than the amount billed on the charge, rounded half up to the cent, and nothing is refunded where those credits come to zero.
  factors:
  - id: manual_line_hosting_credit
    effect: parameter
    decides: ml_bundle
    bindings:
    - ml_host_on
    - ml_host_term
    - ml_bundle
    ladder:
    - when: a hosting plan for this domain has status active and a billing term of 12 months or more
      value: K('bundle_credit_annual') per year the charge covered
    - when: such a plan has status active and a billing term of 1 month
      value: K('bundle_credit_monthly') per year the charge covered
    - when: otherwise
      value: '0'
    baseline:
      ml_bundle: '0'
    evidence:
    - cross_category
    cross_difficulty: hosting
  - id: manual_line_plan_allowance
    effect: method
    decides: ml_plan
    bindings:
    - ml_plan_var
    - ml_plan
    ladder:
    - when: the active hosting plan for this domain is a Harborline Business, Cloud 4 or Cloud 8 plan
      method: the amount by which the TLD's renewal_price exceeds its registration_price, for each year the charge covered, never less than plan_allowance_standard for each year the charge covered
    - when: the active hosting plan for this domain is a Harborline Starter, Plus or Pro plan
      method: the flat plan_allowance_standard once for the charge, whatever the TLD's prices
    - when: otherwise
      method: no allowance
    baseline:
      ml_plan: '0'
    evidence:
    - cross_category
    cross_difficulty: hosting
  - id: manual_line_volume_credit
    effect: parameter
    decides: ml_volume
    bindings:
    - ml_deposits
    - ml_volume
    ladder:
    - when: deposits of the last 12 whole months total volume_threshold_high or more
      value: K('volume_credit_high') per year the charge covered
    - when: they total at least volume_threshold_low but less than volume_threshold_high
      value: K('volume_credit_low') per year the charge covered
    - when: otherwise
      value: '0'
    baseline:
      ml_volume: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  - id: manual_line_autopay_credit
    effect: parameter
    decides: ml_autopay
    bindings:
    - ml_declines
    - ml_autopay
    ladder:
    - when: auto-renew is on and no declined attempt is recorded in the last 12 whole months
      value: K('autopay_credit_full') per year the charge covered
    - when: auto-renew is on and at least one such declined attempt is recorded
      value: K('autopay_credit_partial') per year the charge covered
    - when: otherwise
      value: '0'
    baseline:
      ml_autopay: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: manual_line_term_credit
    effect: method
    decides: ml_term
    bindings:
    - ml_term_span
    - ml_term
    ladder:
    - when: the years the charge covered come to 5 or more
      method: term_credit_per_year multiplied by the years the charge covered
    - when: the years the charge covered come to 2 to 4
      method: the flat term_credit_flat, whatever the years
    - when: otherwise
      method: no term credit
    baseline:
      ml_term: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The price-match refund is the charge's Domain Care credits, never more than the amount billed on the charge, rounded half up to the cent, and nothing is refunded where those credits come to zero. In the standard computation no Domain Care credit applies to the charge, so nothing is refunded.
    params: []
  inputs:
    history:
    - table: domain_charges
      aggregate: latest
      field: amount
      filters:
        event_type: domain_renewal_charge
        charge_type: renewal
    - table: domain_charges
      aggregate: sum
      field: years
      filters:
        event_type: domain_renewal_charge
        charge_type: renewal
    - table: domain_events
      aggregate: count
      field: domain_event_id
      within_months: 12
      filters:
        event_type: domain_auto_renew_decline
    - category: account
      table: account_credit_ledger
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: account_credit_deposit
    cross_category:
    - hosting
    - account
- id: domain_ext_maximum_term_extension
  base_policy_refs:
  - domain_renewal_pricing
  overwrite:
  - base_policy: domain_renewal_pricing
    superseded_clause: Every renewal of a domain, whether manual, auto-renew or during the renewal grace period, is billed at the TLD's renewal_price per year renewed plus the icann_fee_per_year per year, and no late surcharge applies during the grace period.
    replaced_by: 'For a maximum-term extension billed on or after 1 December 2025 on a domain whose status is active and which carries no restore charge dated the day of the order, and only for such an order, the amount is set by the sentences below. Every other renewal-type charge stays under the rule that governs it: a grace-period renewal billed on or after 1 December 2025 and a restore-day extension are priced by the rules of this charter that name them, and every other renewal, an auto-renew charge and a grace-period renewal billed before 1 December 2025 included, is billed at the TLD''s renewal_price per year renewed with that component reduced by the domain_renewal_discount_pct of the customer''s account tier, or by the bulk step of a qualifying multi-domain manual order where that is higher, plus the icann_fee_per_year per year, with amounts rounded half up to the cent.'
  trigger: on_request
  subject:
  - domain_expiry_update
  computes: amount
  target_tool: pay_domain_term_extension_84339760
  params:
    bundle_credit_annual: 3.0
    bundle_credit_monthly: 1.5
    plan_allowance_standard: 0.75
    volume_threshold_high: 5000.0
    volume_threshold_low: 250.0
    volume_credit_high: 0.5
    volume_credit_low: 0.25
    autopay_credit_full: 0.5
    autopay_credit_partial: 0.2
    term_credit_per_year: 0.6
    term_credit_flat: 1.0
  rule: 'For a maximum-term extension billed on or after 1 December 2025 on a domain whose status is active and which carries no restore charge dated the day of the order, and only for such an order, the amount is set by the sentences below. Every other renewal-type charge stays under the rule that governs it: a grace-period renewal billed on or after 1 December 2025 and a restore-day extension are priced by the rules of this charter that name them, and every other renewal, an auto-renew charge and a grace-period renewal billed before 1 December 2025 included, is billed at the TLD''s renewal_price per year renewed with that component reduced by the domain_renewal_discount_pct of the customer''s account tier, or by the bulk step of a qualifying multi-domain manual order where that is higher, plus the icann_fee_per_year per year, with amounts rounded half up to the cent. A maximum-term extension renews the greatest whole number of years that keeps the new expiry date no more than max_registration_years after the day of the order, the new expiry date being the expiry date recorded on the domain plus those maximum-term years; it is ordered as a one-domain order, booked as one renewal line of charge_type renewal, and where the maximum-term years come to zero no extension is billed. The maximum-term years are worked out from the whole months from the day of the order to the expiry date recorded on the domain, a month counting only once its day of the month is reached: they are max_registration_years times 12, less those whole months, less one more month where the expiry date does not fall on the same day of the month as the day of the order, divided by 12 and rounded down to a whole number. A maximum-term extension may be charged only while the domain status is active. The holder pays a maximum-term extension personally at Harborline''s secure checkout, through PayPal or with a card entered there, once the agent has quoted its years and amount; it is never charged to the payment method on file. The amount of a maximum-term extension is the maximum-term renewal component, less the maximum-term credits, plus the TLD''s icann_fee_per_year for each of the maximum-term years. The maximum-term renewal component is the TLD''s renewal_price times the maximum-term years, reduced by the percentage discount that applies to the order, rounded half up to the cent, and the ICANN fee is never discounted. The amount is worked out in this order: first the maximum-term renewal component, then the maximum-term credits are subtracted from it and that result is never taken below zero, and then the ICANN fee is added, every figure being in USD to the cent. In the standard computation no discount and no credit applies. The maximum-term credits are the amounts this rule names as one of the maximum-term credits, added together. The maximum-term reseller discount is the domain_renewal_discount_pct the account charter sets for the customer''s account tier: a Harborline Reseller Platinum account takes the Platinum percentage, a Gold account the Gold percentage, a Silver account the Silver percentage, a Bronze account the Bronze percentage, and every other account none. The maximum-term hosting credit, one of the maximum-term credits, is bundle_credit_annual for each maximum-term year where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each maximum-term year where such a plan has status active and a billing term of 1 month, and nothing otherwise. The maximum-term plan allowance, one of the maximum-term credits, is the amount by which the TLD''s renewal_price exceeds its registration_price, for each maximum-term year, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each maximum-term year, also where the renewal_price does not exceed the registration_price; the flat plan_allowance_standard once for the order where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active. The maximum-term volume credit, one of the maximum-term credits, is volume_credit_high for each maximum-term year where the account credit deposits posted on the customer''s account less than 12 whole months before the day of the order total volume_threshold_high or more, volume_credit_low for each maximum-term year where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached. The maximum-term autopay credit, one of the maximum-term credits, is autopay_credit_full for each maximum-term year where the domain''s auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the order, autopay_credit_partial for each maximum-term year where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off. The maximum-term term credit, one of the maximum-term credits, is term_credit_per_year times the maximum-term years where they come to 5 or more, the flat term_credit_flat where they come to 2 to 4, and nothing where they come to 1. A maximum-term extension is priced only after the domain''s status reads active, its maximum-term years being counted from the expiry date the domain then carries. A maximum-term extension is not billed until the domain''s most recent manual renewal charge, where it was billed from 1 January 2022 through 30 November 2025 by card or PayPal and earns Domain Care credits, carries its price-match refund.'
  prerequisite:
  - problem: domain_ext_lapsed_registry_year
    kind: value_input
    gate: mx_years
    form: state
    policy_source: A maximum-term extension is priced only after the domain's status reads active, its maximum-term years being counted from the expiry date the domain then carries.
    condition: domain_holdings.status is active for the domain, the lapsed registry year having been added to its expiry_date by the grace-period renewal booked on it.
    resolved_by: bill_grace_renewal_b28bd74d
    effect: Once the grace-period renewal returns the domain to active and moves its expiry date one year on, the maximum-term years fall by one.
  - problem: domain_ext_manual_line_price_match
    kind: state_gate
    gate: domain_charges.original_domain_charge_id
    form: state
    policy_source: A maximum-term extension is not billed until the domain's most recent manual renewal charge, where it was billed from 1 January 2022 through 30 November 2025 by card or PayPal and earns Domain Care credits, carries its price-match refund.
    condition: The domain's most recent domain_renewal_charge with charge_type renewal, where billed 2022-01-01..2025-11-30 by card or PayPal with Domain Care credits above zero, has a domain_refund line against it returning those credits.
    resolved_by: refund_manual_renewal_price_match_6ed19e80
    effect: The gate on billing the maximum-term extension holds once the most recent manual renewal charge carries its price-match refund.
  cross_category:
  - category: hosting
    as: branch
    reads:
    - status
    - billing_term_months
    - variant_name
    - primary_domain
    note: The active plan for the domain decides the maximum-term hosting credit and plan allowance.
  - category: account
    as: history
    reads:
    - variant_name
    - account_credit_ledger.amount
    note: The tier and the deposits of the last 12 whole months decide the reseller discount and volume credit.
  compute:
  - mx_months: MONTHS(NOW, F('expiry_date'))
  - mx_exact: MONTHS(NOW, F('expiry_date')) + MONTHS(F('expiry_date'), NOW) == 0
  - mx_years: MX(0, (P('max_registration_years') * 12 - mx_months - (0 if mx_exact else 1)) // 12)
  - mx_pct: CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Platinum') else (CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Gold') else (CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Silver') else (CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Bronze') else 0)))
  - mx_component: int(P('renewal_price') * mx_years * (100 - mx_pct) + 0.5 + 1e-7) / 100
  - mx_host_on: EXISTS('hosting', primary_domain=F('domain_name'), status='active')
  - mx_host_term: CFIELD('hosting', 'billing_term_months', primary_domain=F('domain_name'), status='active') or 0
  - mx_bundle: (K('bundle_credit_annual') if (mx_host_on and mx_host_term >= 12) else (K('bundle_credit_monthly') if (mx_host_on and mx_host_term == 1) else 0)) * mx_years
  - mx_plan_var: CFIELD('hosting', 'variant_name', primary_domain=F('domain_name'), status='active') or 'none'
  - mx_plan: MX(K('plan_allowance_standard'), P('renewal_price') - P('registration_price')) * mx_years if (mx_plan_var == 'Harborline Business' or mx_plan_var == 'Harborline Cloud 4' or mx_plan_var == 'Harborline Cloud 8') else (K('plan_allowance_standard') if (mx_plan_var == 'Harborline Starter' or mx_plan_var == 'Harborline Plus' or mx_plan_var == 'Harborline Pro') else 0)
  - mx_deposits: XSUM('account', 'account_credit_ledger', 'amount', within_months=12, date_field='entry_date', event_type='account_credit_deposit')
  - mx_volume: (K('volume_credit_high') if mx_deposits >= K('volume_threshold_high') else (K('volume_credit_low') if mx_deposits >= K('volume_threshold_low') else 0)) * mx_years
  - mx_declines: COUNT('domain_events', within_months=12, date_field='event_at', event_type='domain_auto_renew_decline')
  - mx_autopay: (K('autopay_credit_full') if (F('auto_renew') == True and mx_declines == 0) else (K('autopay_credit_partial') if (F('auto_renew') == True and mx_declines >= 1) else 0)) * mx_years
  - mx_term_span: MX(0, (P('max_registration_years') * 12 - MONTHS(NOW, F('expiry_date')) - (0 if MONTHS(NOW, F('expiry_date')) + MONTHS(F('expiry_date'), NOW) == 0 else 1)) // 12)
  - mx_term: K('term_credit_per_year') * mx_term_span if mx_term_span >= 5 else (K('term_credit_flat') if mx_term_span >= 2 else 0)
  - mx_credits: mx_bundle + mx_plan + mx_volume + mx_autopay + mx_term
  - mx_icann: P('icann_fee_per_year') * mx_years
  - result: RND(MX(0, mx_component - mx_credits) + mx_icann + 1e-9) if mx_years >= 1 else 0
  compute_basis:
    mx_months: 'The maximum-term years are worked out from the whole months from the day of the order to the expiry date recorded on the domain, a month counting only once its day of the month is reached: they are max_registration_years times 12, less those whole months, less one more month where the expiry date does not fall on the same day of the month as the day of the order, divided by 12 and rounded down to a whole number.'
    mx_exact: less one more month where the expiry date does not fall on the same day of the month as the day of the order
    mx_years: 'The maximum-term years are worked out from the whole months from the day of the order to the expiry date recorded on the domain, a month counting only once its day of the month is reached: they are max_registration_years times 12, less those whole months, less one more month where the expiry date does not fall on the same day of the month as the day of the order, divided by 12 and rounded down to a whole number.'
    mx_pct: 'The maximum-term reseller discount is the domain_renewal_discount_pct the account charter sets for the customer''s account tier: a Harborline Reseller Platinum account takes the Platinum percentage, a Gold account the Gold percentage, a Silver account the Silver percentage, a Bronze account the Bronze percentage, and every other account none.'
    mx_component: The maximum-term renewal component is the TLD's renewal_price times the maximum-term years, reduced by the percentage discount that applies to the order, rounded half up to the cent, and the ICANN fee is never discounted.
    mx_host_on: where a Harborline hosting plan whose primary domain is this domain has status active
    mx_host_term: a billing term of 12 months or more
    mx_bundle: The maximum-term hosting credit, one of the maximum-term credits, is bundle_credit_annual for each maximum-term year where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each maximum-term year where such a plan has status active and a billing term of 1 month, and nothing otherwise.
    mx_plan_var: where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan
    mx_plan: The maximum-term plan allowance, one of the maximum-term credits, is the amount by which the TLD's renewal_price exceeds its registration_price, for each maximum-term year, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each maximum-term year, also where the renewal_price does not exceed the registration_price; the flat plan_allowance_standard once for the order where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active.
    mx_deposits: the account credit deposits posted on the customer's account less than 12 whole months before the day of the order
    mx_volume: The maximum-term volume credit, one of the maximum-term credits, is volume_credit_high for each maximum-term year where the account credit deposits posted on the customer's account less than 12 whole months before the day of the order total volume_threshold_high or more, volume_credit_low for each maximum-term year where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached.
    mx_declines: no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the order
    mx_autopay: The maximum-term autopay credit, one of the maximum-term credits, is autopay_credit_full for each maximum-term year where the domain's auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the order, autopay_credit_partial for each maximum-term year where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off.
    mx_term_span: 'The maximum-term years are worked out from the whole months from the day of the order to the expiry date recorded on the domain, a month counting only once its day of the month is reached: they are max_registration_years times 12, less those whole months, less one more month where the expiry date does not fall on the same day of the month as the day of the order, divided by 12 and rounded down to a whole number.'
    mx_term: The maximum-term term credit, one of the maximum-term credits, is term_credit_per_year times the maximum-term years where they come to 5 or more, the flat term_credit_flat where they come to 2 to 4, and nothing where they come to 1.
    mx_credits: The maximum-term credits are the amounts this rule names as one of the maximum-term credits, added together.
    mx_icann: The amount of a maximum-term extension is the maximum-term renewal component, less the maximum-term credits, plus the TLD's icann_fee_per_year for each of the maximum-term years.
    result: 'The amount is worked out in this order: first the maximum-term renewal component, then the maximum-term credits are subtracted from it and that result is never taken below zero, and then the ICANN fee is added, every figure being in USD to the cent.'
  factors:
  - id: maximum_term_reseller_pct
    effect: parameter
