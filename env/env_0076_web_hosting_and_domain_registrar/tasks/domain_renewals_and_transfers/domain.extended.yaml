  - gl_date: LATEST('domain_charges', 'charge_date', date_field='charge_date', event_type='domain_renewal_charge', charge_type='grace_renewal') or NOW
  - gl_amt: LATEST('domain_charges', 'amount', date_field='charge_date', event_type='domain_renewal_charge', charge_type='grace_renewal') or 0
  - gl_years: SUM('domain_charges', 'years', event_type='domain_renewal_charge', charge_type='grace_renewal', charge_date=gl_date)
  - gl_pay: LATEST('domain_charges', 'payment_method', date_field='charge_date', event_type='domain_renewal_charge', charge_type='grace_renewal')
  - gl_in_scope: DAYS('2022-01-01', gl_date) >= 0 and DAYS(gl_date, '2025-12-01') > 0 and (gl_pay == 'card' or gl_pay == 'paypal')
  - gl_host_on: EXISTS('hosting', primary_domain=F('domain_name'), status='active')
  - gl_host_term: CFIELD('hosting', 'billing_term_months', primary_domain=F('domain_name'), status='active') or 0
