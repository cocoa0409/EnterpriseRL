  compute_basis:
    tl_id: The most recent inbound transfer charge is the inbound transfer charge line of the domain with the latest charge date; a domain is never billed two such charges on one day, and an older inbound transfer charge is never price-matched.
    tl_date: The most recent inbound transfer charge is the inbound transfer charge line of the domain with the latest charge date; a domain is never billed two such charges on one day, and an older inbound transfer charge is never price-matched.
    tl_amt: The price-match refund is the charge's Domain Care credits, never more than the amount billed on the charge, rounded half up to the cent, and nothing is refunded where those credits come to zero.
    tl_years: for each year the charge covered
    tl_pay: For the domain's most recent inbound transfer charge, where it was billed from 1 January 2022 through 30 November 2025 and paid by card or PayPal, and only for such a charge, the Domain Care price match refund is set by the sentences below.
    tl_in_scope: For the domain's most recent inbound transfer charge, where it was billed from 1 January 2022 through 30 November 2025 and paid by card or PayPal, and only for such a charge, the Domain Care price match refund is set by the sentences below.
    tl_host_on: where a Harborline hosting plan whose primary domain is this domain has status active
    tl_host_term: a billing term of 12 months or more
    tl_bundle: The transfer line's hosting credit, one of the charge's Domain Care credits, is bundle_credit_annual for each year the charge covered where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each year the charge covered where such a plan has status active and a billing term of 1 month, and nothing otherwise.
    tl_plan_var: where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan
    tl_plan: The transfer line's plan allowance, one of the charge's Domain Care credits, is the amount by which the TLD's transfer_in_price exceeds its registration_price, for each year the charge covered, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each year the charge covered, also where the transfer_in_price does not exceed the registration_price; the flat plan_allowance_standard once for the charge where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active.
    tl_deposits: the account credit deposits posted on the customer's account less than 12 whole months before the day of the price match
    tl_volume: The transfer line's volume credit, one of the charge's Domain Care credits, is volume_credit_high for each year the charge covered where the account credit deposits posted on the customer's account less than 12 whole months before the day of the price match total volume_threshold_high or more, volume_credit_low for each year the charge covered where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached.
    tl_declines: no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the price match
    tl_autopay: The transfer line's autopay credit, one of the charge's Domain Care credits, is autopay_credit_full for each year the charge covered where the domain's auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the price match, autopay_credit_partial for each year the charge covered where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off.
