    cross_difficulty: null
  baseline:
    rule: 'The amount of a maximum-term extension is the maximum-term renewal component, less the maximum-term credits, plus the TLD''s icann_fee_per_year for each of the maximum-term years. The maximum-term renewal component is the TLD''s renewal_price times the maximum-term years, reduced by the percentage discount that applies to the order, rounded half up to the cent, and the ICANN fee is never discounted. The amount is worked out in this order: first the maximum-term renewal component, then the maximum-term credits are subtracted from it and that result is never taken below zero, and then the ICANN fee is added, every figure being in USD to the cent. In the standard computation no discount and no credit applies.'
    params:
    - renewal_price
    - icann_fee_per_year
    - max_registration_years
  inputs:
    history:
    - table: domain_events
      aggregate: count
      field: domain_event_id
      within_months: 12
      filters:
        event_type: domain_auto_renew_decline
    - category: account
      table: account_credit_ledger
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: account_credit_deposit
    cross_category:
    - hosting
    - account
- id: domain_ext_redemption_restore_price
  base_policy_refs:
  - domain_redemption_restore
  - domain_renewal_pricing
  overwrite:
  - base_policy: domain_redemption_restore
    superseded_clause: A restore is billed as the restore_fee plus restore_includes_renewal_years at the renewal_price plus the icann_fee_per_year for each of those years, and the new expiry date is the original expiry date plus those years.
    replaced_by: For a redemption restore billed on or after 1 December 2025, and only for such a charge, the amount is set by the sentences below. Every other restore stays under the rule that governs it, which bills the restore_fee plus restore_includes_renewal_years at the renewal_price plus the icann_fee_per_year for each of those years with no account-tier or bulk discount on any part of it, the new expiry date being the original expiry date plus those years.
  trigger: on_request
  subject:
  - domain_restore_charge
  - domain_restore
  computes: amount
  target_tool: bill_redemption_restore_c1eb5c46
  params:
    early_restore_days: 10
    early_restore_fee: 49.0
    notice_makegood_missing: 3.0
    notice_makegood_late: 1.5
    bundle_credit_annual: 3.0
    bundle_credit_monthly: 1.5
    plan_allowance_standard: 0.75
    volume_threshold_high: 5000.0
    volume_threshold_low: 250.0
    volume_credit_high: 0.5
    volume_credit_low: 0.25
    autopay_credit_full: 0.5
    autopay_credit_partial: 0.2
  rule: 'For a redemption restore billed on or after 1 December 2025, and only for such a charge, the amount is set by the sentences below. Every other restore stays under the rule that governs it, which bills the restore_fee plus restore_includes_renewal_years at the renewal_price plus the icann_fee_per_year for each of those years with no account-tier or bulk discount on any part of it, the new expiry date being the original expiry date plus those years. A redemption restore brings the domain back to active with restore_includes_renewal_years renewal years, the restored years, its new expiry date being the expiry date recorded on the domain plus those years, and it is booked as one restore charge. The amount of a redemption restore is the restore fee, plus the restored-year component less the restored-year credits, plus the TLD''s icann_fee_per_year for each restored year, less the make-good that applies. The restored-year component is the TLD''s renewal_price times the restored years, rounded half up to the cent, with no account-tier or bulk discount. The amount is worked out in this order: first the restored-year component, then the restored-year credits are subtracted from it and that result is never taken below zero, then the restore fee and the ICANN fee for the restored years are added, and last the make-good that applies is subtracted, the amount never falling below zero, every figure being in USD to the cent. In the standard computation the restore fee is the TLD''s restore_fee, and no credit and no make-good applies. The restored-year credits are the amounts this rule names as one of the restored-year credits, added together. The restore fee is waived, nothing being charged, where the domain''s most recent restore charge carries a price-match refund, that is a refund line returning part but not all of that charge; where no such price-match refund stands and the restore is made within early_restore_days calendar days after the date the domain entered redemption, the fee is the lower of the TLD''s restore_fee and early_restore_fee; where no such price-match refund stands and the restore is made later, the fee is the TLD''s restore_fee. The restored-year hosting credit, one of the restored-year credits, is bundle_credit_annual for each restored year where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each restored year where such a plan has status active and a billing term of 1 month, and nothing otherwise. The restored-year plan allowance, one of the restored-year credits, is the amount by which the TLD''s renewal_price exceeds its registration_price, for each restored year, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each restored year, also where the renewal_price does not exceed the registration_price; the flat plan_allowance_standard once for the restore where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active. The restored-year volume credit, one of the restored-year credits, is volume_credit_high for each restored year where the account credit deposits posted on the customer''s account less than 12 whole months before the day of the restore total volume_threshold_high or more, volume_credit_low for each restored year where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached. The restored-year autopay credit, one of the restored-year credits, is autopay_credit_full for each restored year where the domain''s auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the restore, autopay_credit_partial for each restored year where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off. The notice make-good is notice_makegood_missing where no post-expiry notice dated on or after the expiry date recorded on the domain is on file, notice_makegood_late where the latest post-expiry notice is dated more than post_expiry_notice_within_days calendar days after that expiry date, and nothing where it was sent within that time. The restore fee of a redemption restore is fixed only after the domain''s most recent restore charge, where it was billed from 1 January 2022 through 30 November 2025 by card or PayPal and earns Domain Care credits, carries its price-match refund. A redemption restore is not billed until the domain''s most recent inbound transfer charge, where it was billed from 1 January 2022 through 30 November 2025 by card or PayPal and earns Domain Care credits, carries its price-match refund.'
  prerequisite:
  - problem: domain_ext_restore_line_price_match
    kind: value_input
    gate: rs_fee
    form: state
    policy_source: The restore fee of a redemption restore is fixed only after the domain's most recent restore charge, where it was billed from 1 January 2022 through 30 November 2025 by card or PayPal and earns Domain Care credits, carries its price-match refund.
    condition: The domain's most recent domain_restore_charge, where billed 2022-01-01..2025-11-30 by card or PayPal with Domain Care credits above zero, has a domain_refund line against it returning those credits.
    resolved_by: refund_restore_price_match_9ee6604c
    effect: Once the price-match refund stands against the most recent restore charge, the restore fee takes its waived tier and rs_fee becomes 0.
  - problem: domain_ext_transfer_line_price_match
    kind: state_gate
    gate: domain_charges.original_domain_charge_id
    form: state
    policy_source: A redemption restore is not billed until the domain's most recent inbound transfer charge, where it was billed from 1 January 2022 through 30 November 2025 by card or PayPal and earns Domain Care credits, carries its price-match refund.
    condition: The domain's most recent domain_purchase_charge with charge_type transfer_in, where billed 2022-01-01..2025-11-30 by card or PayPal with Domain Care credits above zero, has a domain_refund line against it returning those credits.
    resolved_by: refund_transfer_in_price_match_5d5ebe85
    effect: The gate on billing the restore holds once the most recent inbound transfer charge carries its price-match refund.
  cross_category:
  - category: hosting
    as: branch
    reads:
    - status
    - billing_term_months
    - variant_name
    - primary_domain
    note: The active plan for the domain decides the restored-year hosting credit and plan allowance.
  - category: account
    as: history
    reads:
    - account_credit_ledger.amount
    note: The deposits of the last 12 whole months decide the restored-year volume credit.
  compute:
  - rs_years: P('restore_includes_renewal_years')
  - rs_last_id: LATEST('domain_charges', 'domain_charge_id', date_field='charge_date', event_type='domain_restore_charge')
  - rs_last_amt: LATEST('domain_charges', 'amount', date_field='charge_date', event_type='domain_restore_charge') or 0
  - rs_refunded: SUM('domain_charges', 'amount', event_type='domain_refund', original_domain_charge_id=rs_last_id)
  - rs_red_days: DAYS(F('redemption_date') or NOW, NOW)
  - rs_fee: 0 if (rs_refunded < 0 and rs_refunded + rs_last_amt > 0) else (MN(P('restore_fee'), K('early_restore_fee')) if rs_red_days <= K('early_restore_days') else P('restore_fee'))
  - rs_component: int(P('renewal_price') * rs_years * 100 + 0.5 + 1e-7) / 100
  - rs_host_on: EXISTS('hosting', primary_domain=F('domain_name'), status='active')
  - rs_host_term: CFIELD('hosting', 'billing_term_months', primary_domain=F('domain_name'), status='active') or 0
  - rs_bundle: (K('bundle_credit_annual') if (rs_host_on and rs_host_term >= 12) else (K('bundle_credit_monthly') if (rs_host_on and rs_host_term == 1) else 0)) * rs_years
  - rs_plan_var: CFIELD('hosting', 'variant_name', primary_domain=F('domain_name'), status='active') or 'none'
  - rs_plan: MX(K('plan_allowance_standard'), P('renewal_price') - P('registration_price')) * rs_years if (rs_plan_var == 'Harborline Business' or rs_plan_var == 'Harborline Cloud 4' or rs_plan_var == 'Harborline Cloud 8') else (K('plan_allowance_standard') if (rs_plan_var == 'Harborline Starter' or rs_plan_var == 'Harborline Plus' or rs_plan_var == 'Harborline Pro') else 0)
  - rs_deposits: XSUM('account', 'account_credit_ledger', 'amount', within_months=12, date_field='entry_date', event_type='account_credit_deposit')
  - rs_volume: (K('volume_credit_high') if rs_deposits >= K('volume_threshold_high') else (K('volume_credit_low') if rs_deposits >= K('volume_threshold_low') else 0)) * rs_years
  - rs_declines: COUNT('domain_events', within_months=12, date_field='event_at', event_type='domain_auto_renew_decline')
  - rs_autopay: (K('autopay_credit_full') if (F('auto_renew') == True and rs_declines == 0) else (K('autopay_credit_partial') if (F('auto_renew') == True and rs_declines >= 1) else 0)) * rs_years
  - rs_last_px: LATEST('domain_events', 'event_at', date_field='event_at', event_type='domain_expiry_notice', notice_kind='post_expiry') or '1900-01-01'
  - rs_px_lag: DAYS(F('expiry_date'), rs_last_px)
  - rs_makegood: K('notice_makegood_missing') if rs_px_lag < 0 else (K('notice_makegood_late') if rs_px_lag > P('post_expiry_notice_within_days') else 0)
  - rs_credits: rs_bundle + rs_plan + rs_volume + rs_autopay
  - result: RND(MX(0, rs_fee + MX(0, rs_component - rs_credits) + P('icann_fee_per_year') * rs_years - rs_makegood) + 1e-9)
  compute_basis:
    rs_years: A redemption restore brings the domain back to active with restore_includes_renewal_years renewal years, the restored years
    rs_last_id: where the domain's most recent restore charge carries a price-match refund
    rs_last_amt: that is a refund line returning part but not all of that charge
    rs_refunded: that is a refund line returning part but not all of that charge
    rs_red_days: the restore is made within early_restore_days calendar days after the date the domain entered redemption
    rs_fee: The restore fee is waived, nothing being charged, where the domain's most recent restore charge carries a price-match refund, that is a refund line returning part but not all of that charge; where no such price-match refund stands and the restore is made within early_restore_days calendar days after the date the domain entered redemption, the fee is the lower of the TLD's restore_fee and early_restore_fee; where no such price-match refund stands and the restore is made later, the fee is the TLD's restore_fee.
    rs_component: The restored-year component is the TLD's renewal_price times the restored years, rounded half up to the cent, with no account-tier or bulk discount.
    rs_host_on: where a Harborline hosting plan whose primary domain is this domain has status active
    rs_host_term: a billing term of 12 months or more
    rs_bundle: The restored-year hosting credit, one of the restored-year credits, is bundle_credit_annual for each restored year where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each restored year where such a plan has status active and a billing term of 1 month, and nothing otherwise.
    rs_plan_var: where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan
    rs_plan: The restored-year plan allowance, one of the restored-year credits, is the amount by which the TLD's renewal_price exceeds its registration_price, for each restored year, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each restored year, also where the renewal_price does not exceed the registration_price; the flat plan_allowance_standard once for the restore where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active.
    rs_deposits: the account credit deposits posted on the customer's account less than 12 whole months before the day of the restore
    rs_volume: The restored-year volume credit, one of the restored-year credits, is volume_credit_high for each restored year where the account credit deposits posted on the customer's account less than 12 whole months before the day of the restore total volume_threshold_high or more, volume_credit_low for each restored year where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached.
    rs_declines: no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the restore
    rs_autopay: The restored-year autopay credit, one of the restored-year credits, is autopay_credit_full for each restored year where the domain's auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the restore, autopay_credit_partial for each restored year where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off.
    rs_last_px: where the latest post-expiry notice is dated more than post_expiry_notice_within_days calendar days after that expiry date
    rs_px_lag: notice_makegood_missing where no post-expiry notice dated on or after the expiry date recorded on the domain is on file
    rs_makegood: The notice make-good is notice_makegood_missing where no post-expiry notice dated on or after the expiry date recorded on the domain is on file, notice_makegood_late where the latest post-expiry notice is dated more than post_expiry_notice_within_days calendar days after that expiry date, and nothing where it was sent within that time.
    rs_credits: The restored-year credits are the amounts this rule names as one of the restored-year credits, added together.
    result: 'The amount is worked out in this order: first the restored-year component, then the restored-year credits are subtracted from it and that result is never taken below zero, then the restore fee and the ICANN fee for the restored years are added, and last the make-good that applies is subtracted, the amount never falling below zero, every figure being in USD to the cent.'
  factors:
  - id: restore_fee_courtesy
    effect: method
    decides: rs_fee
    bindings:
    - rs_last_id
    - rs_last_amt
    - rs_refunded
    - rs_red_days
    - rs_fee
    ladder:
    - when: the domain's most recent restore charge carries a price-match refund returning part but not all of it
      method: the restore fee is waived; nothing is charged for it
    - when: no such price-match refund stands and the restore is made within early_restore_days calendar days after the date the domain entered redemption
      method: the lower of the TLD's restore_fee and early_restore_fee
    - when: otherwise
      method: the TLD's restore_fee
    baseline:
      rs_fee: P('restore_fee')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: restored_year_hosting_credit
    effect: parameter
    decides: rs_bundle
    bindings:
    - rs_host_on
    - rs_host_term
    - rs_bundle
    ladder:
    - when: a hosting plan for this domain has status active and a billing term of 12 months or more
      value: K('bundle_credit_annual') per restored year
    - when: such a plan has status active and a billing term of 1 month
      value: K('bundle_credit_monthly') per restored year
    - when: otherwise
      value: '0'
    baseline:
      rs_bundle: '0'
    evidence:
    - cross_category
    cross_difficulty: hosting
  - id: restored_year_plan_allowance
    effect: method
    decides: rs_plan
    bindings:
    - rs_plan_var
    - rs_plan
    ladder:
    - when: the active hosting plan for this domain is a Harborline Business, Cloud 4 or Cloud 8 plan
      method: the amount by which the TLD's renewal_price exceeds its registration_price, for each restored year, never less than plan_allowance_standard for each restored year
    - when: the active hosting plan for this domain is a Harborline Starter, Plus or Pro plan
      method: the flat plan_allowance_standard once for the restore, whatever the TLD's prices
    - when: otherwise
      method: no allowance
    baseline:
      rs_plan: '0'
    evidence:
    - cross_category
    cross_difficulty: hosting
  - id: restored_year_volume_credit
    effect: parameter
    decides: rs_volume
    bindings:
    - rs_deposits
    - rs_volume
    ladder:
    - when: deposits of the last 12 whole months total volume_threshold_high or more
      value: K('volume_credit_high') per restored year
    - when: they total at least volume_threshold_low but less than volume_threshold_high
      value: K('volume_credit_low') per restored year
    - when: otherwise
      value: '0'
    baseline:
      rs_volume: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  - id: restored_year_autopay_credit
    effect: parameter
    decides: rs_autopay
    bindings:
    - rs_declines
    - rs_autopay
    ladder:
    - when: auto-renew is on and no declined attempt is recorded in the last 12 whole months
      value: K('autopay_credit_full') per restored year
    - when: auto-renew is on and at least one such declined attempt is recorded
      value: K('autopay_credit_partial') per restored year
    - when: otherwise
      value: '0'
    baseline:
      rs_autopay: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: restore_notice_makegood
    effect: parameter
    decides: rs_makegood
    bindings:
    - rs_last_px
    - rs_px_lag
    - rs_makegood
    ladder:
    - when: no post-expiry notice dated on or after the expiry date recorded on the domain is on file
      value: K('notice_makegood_missing')
    - when: the latest post-expiry notice is dated more than post_expiry_notice_within_days calendar days after that expiry date
      value: K('notice_makegood_late')
    - when: otherwise
      value: '0'
    baseline:
      rs_makegood: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: 'The amount of a redemption restore is the restore fee, plus the restored-year component less the restored-year credits, plus the TLD''s icann_fee_per_year for each restored year, less the make-good that applies. The restored-year component is the TLD''s renewal_price times the restored years, rounded half up to the cent, with no account-tier or bulk discount. The amount is worked out in this order: first the restored-year component, then the restored-year credits are subtracted from it and that result is never taken below zero, then the restore fee and the ICANN fee for the restored years are added, and last the make-good that applies is subtracted, the amount never falling below zero, every figure being in USD to the cent. In the standard computation the restore fee is the TLD''s restore_fee, and no credit and no make-good applies.'
    params:
    - restore_fee
    - renewal_price
    - icann_fee_per_year
    - restore_includes_renewal_years
  inputs:
    history:
    - table: domain_charges
      aggregate: latest
      field: amount
      filters:
        event_type: domain_restore_charge
    - table: domain_events
      aggregate: latest
      field: event_at
      filters:
        event_type: domain_expiry_notice
        notice_kind: post_expiry
    - category: account
      table: account_credit_ledger
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: account_credit_deposit
    cross_category:
