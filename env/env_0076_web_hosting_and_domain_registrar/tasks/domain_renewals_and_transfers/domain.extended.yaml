- id: domain_ext_restore_day_extension
  base_policy_refs:
  - domain_renewal_pricing
  overwrite:
  - base_policy: domain_renewal_pricing
    superseded_clause: Every renewal of a domain, whether manual, auto-renew or during the renewal grace period, is billed at the TLD's renewal_price per year renewed plus the icann_fee_per_year per year, and no late surcharge applies during the grace period.
    replaced_by: 'For extension years ordered on the day a redemption restore is charged on the domain, billed on or after 1 December 2025, and only for such an order, the amount is set by the sentences below. Every other renewal-type charge stays under the rule that governs it: a grace-period renewal billed on or after 1 December 2025 and a maximum-term extension of a domain not restored that day are priced by the rules of this charter that name them, and every other renewal, an auto-renew charge and a grace-period renewal billed before 1 December 2025 included, is billed at the TLD''s renewal_price per year renewed with that component reduced by the domain_renewal_discount_pct of the customer''s account tier, or by the bulk step of a qualifying multi-domain manual order where that is higher, plus the icann_fee_per_year per year, with amounts rounded half up to the cent.'
  trigger: on_request
  subject:
  - domain_expiry_update
  computes: amount
  target_tool: pay_restore_extension_years_823e7992
  params:
    bundle_credit_annual: 3.0
    bundle_credit_monthly: 1.5
    plan_allowance_standard: 0.75
    volume_threshold_high: 5000.0
    volume_threshold_low: 250.0
    volume_credit_high: 0.5
    volume_credit_low: 0.25
    autopay_credit_full: 0.5
    autopay_credit_partial: 0.2
  rule: 'For extension years ordered on the day a redemption restore is charged on the domain, billed on or after 1 December 2025, and only for such an order, the amount is set by the sentences below. Every other renewal-type charge stays under the rule that governs it: a grace-period renewal billed on or after 1 December 2025 and a maximum-term extension of a domain not restored that day are priced by the rules of this charter that name them, and every other renewal, an auto-renew charge and a grace-period renewal billed before 1 December 2025 included, is billed at the TLD''s renewal_price per year renewed with that component reduced by the domain_renewal_discount_pct of the customer''s account tier, or by the bulk step of a qualifying multi-domain manual order where that is higher, plus the icann_fee_per_year per year, with amounts rounded half up to the cent. A restore-day extension renews the greatest whole number of years that keeps the new expiry date no more than max_registration_years after the day of the order, the new expiry date being the expiry date recorded on the domain plus those restore-day years; it is ordered as a one-domain order, booked as one renewal line of charge_type renewal, and where the restore-day years come to zero no extension is billed. The restore-day years are worked out from the whole months from the day of the order to the expiry date recorded on the domain, a month counting only once its day of the month is reached: they are max_registration_years times 12, less those whole months, less one more month where the expiry date does not fall on the same day of the month as the day of the order, divided by 12 and rounded down to a whole number. A restore-day extension may be charged only while the domain status is active. The holder pays a restore-day extension personally at Harborline''s secure checkout, through PayPal or with a card entered there, once the agent has quoted its years and amount; it is never charged to the payment method on file. The amount of a restore-day extension is the restore-day renewal component, less the restore-day credits, plus the TLD''s icann_fee_per_year for each of the restore-day years. The restore-day renewal component is the TLD''s renewal_price times the restore-day years, reduced by the percentage discount that applies to the order, rounded half up to the cent, and the ICANN fee is never discounted. The amount is worked out in this order: first the restore-day renewal component, then the restore-day credits are subtracted from it and that result is never taken below zero, and then the ICANN fee is added, every figure being in USD to the cent. In the standard computation no discount and no credit applies. The restore-day credits are the amounts this rule names as one of the restore-day credits, added together. The restore-day reseller discount is the domain_renewal_discount_pct the account charter sets for the customer''s account tier: a Harborline Reseller Platinum account takes the Platinum percentage, a Gold account the Gold percentage, a Silver account the Silver percentage, a Bronze account the Bronze percentage, and every other account none. The restore-day hosting credit, one of the restore-day credits, is bundle_credit_annual for each restore-day year where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each restore-day year where such a plan has status active and a billing term of 1 month, and nothing otherwise. The restore-day plan allowance, one of the restore-day credits, is the amount by which the TLD''s renewal_price exceeds its registration_price, for each restore-day year, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each restore-day year, also where the renewal_price does not exceed the registration_price; the flat plan_allowance_standard once for the order where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active. The restore-day volume credit, one of the restore-day credits, is volume_credit_high for each restore-day year where the account credit deposits posted on the customer''s account less than 12 whole months before the day of the order total volume_threshold_high or more, volume_credit_low for each restore-day year where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached. The restore-day autopay credit, one of the restore-day credits, is autopay_credit_full for each restore-day year where the domain''s auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the order, autopay_credit_partial for each restore-day year where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off. The restore-day transfer price lock, one of the restore-day credits, is the amount by which the TLD''s renewal_price exceeds its transfer_in_price, for each of the restore-day years, where the domain came to Harborline by an inbound transfer completed less than 12 whole months before the day of the order, that difference once for the order where the inbound transfer completed at least 12 but less than 24 whole months before it, and nothing otherwise or where the renewal_price does not exceed the transfer_in_price. Restore-day years are priced only after the domain''s status reads active again and a restore charge dated the day of the order stands on it, the years being counted from the expiry date the restore leaves.'
  prerequisite:
  - problem: domain_ext_redemption_restore_price
    kind: value_input
    gate: rx_years
    form: state
    policy_source: Restore-day years are priced only after the domain's status reads active again and a restore charge dated the day of the order stands on it, the years being counted from the expiry date the restore leaves.
    condition: domain_holdings.status is active and a domain_restore_charge dated the day of the order stands on the domain, the restored year having been added to its expiry_date.
    resolved_by: bill_redemption_restore_c1eb5c46
    effect: Once the restore lands, the expiry date moves one year on and the restore-day years fall by one.
  cross_category:
  - category: hosting
    as: branch
    reads:
    - status
    - billing_term_months
    - variant_name
    - primary_domain
    note: The active plan for the domain decides the restore-day hosting credit and plan allowance.
  - category: account
    as: history
    reads:
    - variant_name
    - account_credit_ledger.amount
    note: The tier and the deposits of the last 12 whole months decide the reseller discount and volume credit.
  compute:
  - rx_months: MONTHS(NOW, F('expiry_date'))
  - rx_exact: MONTHS(NOW, F('expiry_date')) + MONTHS(F('expiry_date'), NOW) == 0
  - rx_years: MX(0, (P('max_registration_years') * 12 - rx_months - (0 if rx_exact else 1)) // 12)
  - rx_pct: CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Platinum') else (CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Gold') else (CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Silver') else (CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Bronze') else 0)))
  - rx_component: int(P('renewal_price') * rx_years * (100 - rx_pct) + 0.5 + 1e-7) / 100
  - rx_host_on: EXISTS('hosting', primary_domain=F('domain_name'), status='active')
  - rx_host_term: CFIELD('hosting', 'billing_term_months', primary_domain=F('domain_name'), status='active') or 0
  - rx_bundle: (K('bundle_credit_annual') if (rx_host_on and rx_host_term >= 12) else (K('bundle_credit_monthly') if (rx_host_on and rx_host_term == 1) else 0)) * rx_years
  - rx_plan_var: CFIELD('hosting', 'variant_name', primary_domain=F('domain_name'), status='active') or 'none'
  - rx_plan: MX(K('plan_allowance_standard'), P('renewal_price') - P('registration_price')) * rx_years if (rx_plan_var == 'Harborline Business' or rx_plan_var == 'Harborline Cloud 4' or rx_plan_var == 'Harborline Cloud 8') else (K('plan_allowance_standard') if (rx_plan_var == 'Harborline Starter' or rx_plan_var == 'Harborline Plus' or rx_plan_var == 'Harborline Pro') else 0)
  - rx_deposits: XSUM('account', 'account_credit_ledger', 'amount', within_months=12, date_field='entry_date', event_type='account_credit_deposit')
  - rx_volume: (K('volume_credit_high') if rx_deposits >= K('volume_threshold_high') else (K('volume_credit_low') if rx_deposits >= K('volume_threshold_low') else 0)) * rx_years
  - rx_declines: COUNT('domain_events', within_months=12, date_field='event_at', event_type='domain_auto_renew_decline')
  - rx_autopay: (K('autopay_credit_full') if (F('auto_renew') == True and rx_declines == 0) else (K('autopay_credit_partial') if (F('auto_renew') == True and rx_declines >= 1) else 0)) * rx_years
  - rx_xfer_in: F('acquisition_type') == 'transfer_in'
  - rx_xfer_months: MONTHS(F('transfer_in_date') or NOW, NOW)
  - rx_lock: MX(0, P('renewal_price') - P('transfer_in_price')) * rx_years if (rx_xfer_in and rx_xfer_months < 12) else (MX(0, P('renewal_price') - P('transfer_in_price')) if (rx_xfer_in and rx_xfer_months >= 12 and rx_xfer_months < 24) else 0)
  - rx_credits: rx_bundle + rx_plan + rx_volume + rx_autopay + rx_lock
  - rx_icann: P('icann_fee_per_year') * rx_years
  - result: RND(MX(0, rx_component - rx_credits) + rx_icann + 1e-9) if rx_years >= 1 else 0
  compute_basis:
    rx_months: 'The restore-day years are worked out from the whole months from the day of the order to the expiry date recorded on the domain, a month counting only once its day of the month is reached: they are max_registration_years times 12, less those whole months, less one more month where the expiry date does not fall on the same day of the month as the day of the order, divided by 12 and rounded down to a whole number.'
    rx_exact: less one more month where the expiry date does not fall on the same day of the month as the day of the order
    rx_years: 'The restore-day years are worked out from the whole months from the day of the order to the expiry date recorded on the domain, a month counting only once its day of the month is reached: they are max_registration_years times 12, less those whole months, less one more month where the expiry date does not fall on the same day of the month as the day of the order, divided by 12 and rounded down to a whole number.'
    rx_pct: 'The restore-day reseller discount is the domain_renewal_discount_pct the account charter sets for the customer''s account tier: a Harborline Reseller Platinum account takes the Platinum percentage, a Gold account the Gold percentage, a Silver account the Silver percentage, a Bronze account the Bronze percentage, and every other account none.'
    rx_component: The restore-day renewal component is the TLD's renewal_price times the restore-day years, reduced by the percentage discount that applies to the order, rounded half up to the cent, and the ICANN fee is never discounted.
    rx_host_on: where a Harborline hosting plan whose primary domain is this domain has status active
    rx_host_term: a billing term of 12 months or more
    rx_bundle: The restore-day hosting credit, one of the restore-day credits, is bundle_credit_annual for each restore-day year where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each restore-day year where such a plan has status active and a billing term of 1 month, and nothing otherwise.
    rx_plan_var: where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan
    rx_plan: The restore-day plan allowance, one of the restore-day credits, is the amount by which the TLD's renewal_price exceeds its registration_price, for each restore-day year, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each restore-day year, also where the renewal_price does not exceed the registration_price; the flat plan_allowance_standard once for the order where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active.
    rx_deposits: the account credit deposits posted on the customer's account less than 12 whole months before the day of the order
    rx_volume: The restore-day volume credit, one of the restore-day credits, is volume_credit_high for each restore-day year where the account credit deposits posted on the customer's account less than 12 whole months before the day of the order total volume_threshold_high or more, volume_credit_low for each restore-day year where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached.
    rx_declines: no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the order
    rx_autopay: The restore-day autopay credit, one of the restore-day credits, is autopay_credit_full for each restore-day year where the domain's auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the order, autopay_credit_partial for each restore-day year where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off.
    rx_xfer_in: where the domain came to Harborline by an inbound transfer
    rx_xfer_months: completed less than 12 whole months before the day of the order
    rx_lock: The restore-day transfer price lock, one of the restore-day credits, is the amount by which the TLD's renewal_price exceeds its transfer_in_price, for each of the restore-day years, where the domain came to Harborline by an inbound transfer completed less than 12 whole months before the day of the order, that difference once for the order where the inbound transfer completed at least 12 but less than 24 whole months before it, and nothing otherwise or where the renewal_price does not exceed the transfer_in_price.
    rx_credits: The restore-day credits are the amounts this rule names as one of the restore-day credits, added together.
    rx_icann: The amount of a restore-day extension is the restore-day renewal component, less the restore-day credits, plus the TLD's icann_fee_per_year for each of the restore-day years.
    result: 'The amount is worked out in this order: first the restore-day renewal component, then the restore-day credits are subtracted from it and that result is never taken below zero, and then the ICANN fee is added, every figure being in USD to the cent.'
  factors:
  - id: restore_day_reseller_pct
    effect: parameter
    decides: rx_pct
    bindings:
    - rx_pct
    ladder:
    - when: the account tier is Harborline Reseller Platinum
      value: the Platinum domain_renewal_discount_pct
    - when: the account tier is Harborline Reseller Gold
      value: the Gold domain_renewal_discount_pct
    - when: the account tier is Harborline Reseller Silver
      value: the Silver domain_renewal_discount_pct
    - when: the account tier is Harborline Reseller Bronze
      value: the Bronze domain_renewal_discount_pct
    - when: otherwise
      value: '0'
    baseline:
      rx_pct: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: account
  - id: restore_day_hosting_credit
    effect: parameter
    decides: rx_bundle
    bindings:
    - rx_host_on
    - rx_host_term
    - rx_bundle
    ladder:
    - when: a hosting plan for this domain has status active and a billing term of 12 months or more
      value: K('bundle_credit_annual') per restore-day year
    - when: such a plan has status active and a billing term of 1 month
      value: K('bundle_credit_monthly') per restore-day year
    - when: otherwise
      value: '0'
    baseline:
      rx_bundle: '0'
    evidence:
    - cross_category
    cross_difficulty: hosting
  - id: restore_day_plan_allowance
    effect: method
    decides: rx_plan
    bindings:
    - rx_plan_var
    - rx_plan
    ladder:
    - when: the active hosting plan for this domain is a Harborline Business, Cloud 4 or Cloud 8 plan
      method: the amount by which the TLD's renewal_price exceeds its registration_price, for each restore-day year, never less than plan_allowance_standard for each restore-day year
    - when: the active hosting plan for this domain is a Harborline Starter, Plus or Pro plan
      method: the flat plan_allowance_standard once for the order, whatever the TLD's prices
    - when: otherwise
      method: no allowance
    baseline:
      rx_plan: '0'
    evidence:
    - cross_category
    cross_difficulty: hosting
  - id: restore_day_volume_credit
    effect: parameter
    decides: rx_volume
    bindings:
    - rx_deposits
    - rx_volume
    ladder:
    - when: deposits of the last 12 whole months total volume_threshold_high or more
      value: K('volume_credit_high') per restore-day year
    - when: they total at least volume_threshold_low but less than volume_threshold_high
      value: K('volume_credit_low') per restore-day year
    - when: otherwise
      value: '0'
    baseline:
      rx_volume: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  - id: restore_day_autopay_credit
    effect: parameter
    decides: rx_autopay
    bindings:
    - rx_declines
    - rx_autopay
    ladder:
    - when: auto-renew is on and no declined attempt is recorded in the last 12 whole months
      value: K('autopay_credit_full') per restore-day year
    - when: auto-renew is on and at least one such declined attempt is recorded
      value: K('autopay_credit_partial') per restore-day year
    - when: otherwise
      value: '0'
    baseline:
      rx_autopay: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: restore_day_price_lock
    effect: parameter
    decides: rx_lock
    bindings:
    - rx_xfer_in
    - rx_xfer_months
    - rx_lock
    ladder:
    - when: the domain came by an inbound transfer completed less than 12 whole months before the order
      value: MX(0, P('renewal_price') - P('transfer_in_price')) for each of the restore-day years
    - when: the inbound transfer completed at least 12 but less than 24 whole months before the order
      value: MX(0, P('renewal_price') - P('transfer_in_price')) once
    - when: otherwise
      value: '0'
    baseline:
      rx_lock: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: 'The amount of a restore-day extension is the restore-day renewal component, less the restore-day credits, plus the TLD''s icann_fee_per_year for each of the restore-day years. The restore-day renewal component is the TLD''s renewal_price times the restore-day years, reduced by the percentage discount that applies to the order, rounded half up to the cent, and the ICANN fee is never discounted. The amount is worked out in this order: first the restore-day renewal component, then the restore-day credits are subtracted from it and that result is never taken below zero, and then the ICANN fee is added, every figure being in USD to the cent. In the standard computation no discount and no credit applies.'
    params:
    - renewal_price
    - icann_fee_per_year
    - max_registration_years
  inputs:
    history:
    - table: domain_events
      aggregate: count
      field: domain_event_id
      within_months: 12
      filters:
        event_type: domain_auto_renew_decline
    - category: account
      table: account_credit_ledger
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: account_credit_deposit
    cross_category:
    - hosting
    - account
