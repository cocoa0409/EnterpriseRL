        renewal_refund_days: =renewal_refund_days
        auto_renew_refund_days: =auto_renew_refund_days
      .io Domain Registration:
        registration_refund_days: =new_registration_refund_days
        renewal_refund_days: =renewal_refund_days
        auto_renew_refund_days: =auto_renew_refund_days
- id: domain_registrant_change_rules
  subject:
  - domain_registrant_change
  - domain_registrant_verification
  - domain_verification_update
  - domain_hold
  - domain_release_hold
  rule: A change of registrant may be made only while the domain status is active. A change of registrant may be
    made only while no registry lock is in force on the domain. Where registrant_change_lock_days is above 0, the
    change starts a transfer lock of that many days unless the registrant opts out at the time of the change and
    registrant_change_lock_opt_out is true for the TLD, and an opt-out cannot be added afterwards. Where registrant_verification_days
    is above 0, a new registration or a change of registrant must be confirmed through the verification email within
    that many calendar days of the registration or change date, and where suspend_on_unverified is true a domain
    still unverified after the last day is placed on registrar hold the next day. Confirming the verification email
    at any time marks the registrant verified and lifts a registrar hold the same day, and a hold never changes
    the expiry date or any renewal deadline. The change of registrant is requested by the current registrant, and
    the new registrant's name and organisation are recorded verbatim as given.
  eligibility:
  - id: change_while_active
    applies_to:
    - domain_registrant_change
    kind: state
    condition: A change of registrant may be made only while the domain status is active.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.status
      allowed:
      - active
  - id: change_no_registry_lock
    applies_to:
    - domain_registrant_change
    kind: state
    condition: A change of registrant may be made only while no registry lock is in force on the domain.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.registry_lock
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.registry_lock
      allowed:
      - false
  params:
    per_tier:
      .us Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .ca Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .com Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .org Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .net Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .co Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
      .io Domain Registration:
        change_lock_days: =registrant_change_lock_days
        opt_out: =registrant_change_lock_opt_out
        verification_days: =registrant_verification_days
- id: domain_settings_rules
  subject:
  - domain_settings_update
  - domain_lock_charge
  rule: A settings change may be made only while the domain status is active, on_hold or grace. WHOIS privacy may
    be switched on only where privacy_available is true for the TLD and is billed at privacy_annual_fee; .us registrations
    may never carry privacy, and .ca registrations rely on the registry's own disclosure rules. Registry lock may
    be ordered only where registry_lock_available is true, and is billed registry_lock_annual_fee per year aligned
    to the domain's expiry date. While a registry lock is in force, the registrar transfer lock stays on and no
    change of registrant, nameserver change or authorisation code is possible, and releasing the lock takes registry_lock_release_business_days
    business days, counted Monday to Friday excluding US federal holidays, from the registrant's authorised request.
    The registrar transfer lock is on by default (registrar_lock_default_on), and the registrant may switch it off
    or on at any time outside a registry lock. Nameserver changes take effect at the registry immediately, and DNSSEC
    may be enabled only on Harborline DNS where dnssec_supported is true.
  eligibility:
  - id: settings_status
    applies_to:
    - domain_settings_update
    kind: state
    condition: A settings change may be made only while the domain status is active, on_hold or grace.
    evidence_fields:
    - domain_holdings.domain_id
    - domain_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.domain_id
      action_bindings:
        domain_holdings.domain_id: domain_id
    state_contract:
      field: domain_holdings.status
      allowed:
      - active
      - on_hold
      - grace
- id: domain_hosting_bundle
  subject:
  - domain_register
  - domain_purchase_charge
  rule: A customer whose hosting plan includes a free domain under the hosting charter may register one domain free
    for free_with_hosting_years against that plan, provided the TLD's free_with_hosting_eligible is true. The free
    registration may be applied only while the hosting plan named as bundled_hosting_id has status provisioning
    or active. Each hosting plan covers at most one free registration in its lifetime. A plan that already has a
    domain holding pointing to it as bundled_hosting_id cannot cover another, even if that domain was later deleted
    or transferred out, while a cancelled registration does not use up the entitlement. Renewals of a bundled domain
    are billed at the normal renewal price, and inbound transfers never qualify. If the hosting plan is refunded
    under its money-back guarantee while the customer keeps the domain, the bundle_registration_value of the domain's
    TLD is deducted from that hosting refund as the hosting charter states, and the domain registration itself is
    never refunded on that account.
  eligibility:
  - id: bundling_plan_live
    applies_to:
    - domain_register
    - domain_purchase_charge
    kind: state
    condition: The free registration may be applied only while the hosting plan named as bundled_hosting_id has
      status provisioning or active.
    evidence_fields:
    - hosting_holdings.hosting_id
    - domain_holdings.bundled_hosting_id
    - hosting_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.bundled_hosting_id
      action_bindings:
        domain_holdings.bundled_hosting_id: bundled_hosting_id
    state_contract:
      field: hosting_holdings.status
      allowed:
      - provisioning
      - active
  - id: one_free_domain_per_plan
    applies_to:
    - domain_register
    kind: dedup
    condition: Each hosting plan covers at most one free registration in its lifetime.
    evidence_fields:
    - domain_holdings.bundled_hosting_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - domain_holdings.bundled_hosting_id
      action_bindings:
        domain_holdings.bundled_hosting_id: bundled_hosting_id
    dedup_contract:
      table: domain_holdings
      mode: separate_record
      object_bindings:
        bundled_hosting_id: bundled_hosting_id
      duplicate_filters:
        status:
        - pending
        - active
        - on_hold
        - grace
        - redemption
        - pending_delete
        - deleted
        - transferred_out
      distinct_fields: []
- id: domain_lifecycle_clock
  subject:
  - domain_expire
  - domain_enter_redemption
  - domain_pending_delete
  - domain_purge
  - domain_expiry_notice
  rule: A domain whose expiry date has passed without renewal moves to grace on the day after the expiry date. A
    domain in grace that is not renewed by the last day of renewal_grace_days moves to redemption on the following
    day, and that day is recorded as its redemption date. A domain in redemption that is not restored by the last
    day of redemption_days moves to pending_delete on the following day and is purged after pending_delete_days.
    Renewal reminders are emailed on each day listed in expiry_notice_days_before, and a post-expiry notice is sent
    within post_expiry_notice_within_days after the expiry date; a reminder is skipped when the domain has already
    been renewed past that expiry, and notices are sent whether or not auto-renew is on. Expiry, redemption and
    deletion follow the recorded dates alone, and a customer's statement that they meant to renew does not change
    them.
  eligibility: []
extended_policies:
- id: domain_ext_lapsed_registry_year
  base_policy_refs:
  - domain_grace_renewal
  - domain_renewal_pricing
  overwrite:
  - base_policy: domain_renewal_pricing
    superseded_clause: Every renewal of a domain, whether manual, auto-renew or during the renewal grace period, is billed at the TLD's renewal_price per year renewed plus the icann_fee_per_year per year, and no late surcharge applies during the grace period.
    replaced_by: 'For a grace-period renewal billed on or after 1 December 2025, and only for such a charge, the amount is set by the sentences below. Every other renewal-type charge stays under the rule that governs it: a maximum-term extension and a restore-day extension are priced by the rules of this charter that name them, and every other renewal, an auto-renew charge and a grace-period renewal billed before 1 December 2025 included, is billed at the TLD''s renewal_price per year renewed with that component reduced by the domain_renewal_discount_pct of the customer''s account tier, or by the bulk step of a qualifying multi-domain manual order where that is higher, plus the icann_fee_per_year per year, with amounts rounded half up to the cent.'
  - base_policy: domain_grace_renewal
    superseded_clause: It is billed at the price set by domain_renewal_pricing, booked as charge_type grace_renewal, and returns the domain to active.
    replaced_by: A grace-period renewal renews exactly one year, the registry year that lapsed, is booked as charge_type grace_renewal and returns the domain to active, its new expiry date being the expiry date recorded on the domain plus one year; a grace-period renewal billed before 1 December 2025 was billed at the price set by domain_renewal_pricing.
  trigger: on_request
  subject:
  - domain_grace_renew
  computes: amount
  target_tool: bill_grace_renewal_b28bd74d
  params:
    bundle_credit_annual: 3.0
    bundle_credit_monthly: 1.5
    plan_allowance_standard: 0.75
    volume_threshold_high: 5000.0
    volume_threshold_low: 250.0
    volume_credit_high: 0.5
    volume_credit_low: 0.25
    autopay_credit_full: 0.5
    autopay_credit_partial: 0.2
    late_fee_per_day: 0.5
    late_fee_cap: 12.0
    early_reactivation_fee: 2.5
    early_fee_days: 7
  rule: 'For a grace-period renewal billed on or after 1 December 2025, and only for such a charge, the amount is set by the sentences below. Every other renewal-type charge stays under the rule that governs it: a maximum-term extension and a restore-day extension are priced by the rules of this charter that name them, and every other renewal, an auto-renew charge and a grace-period renewal billed before 1 December 2025 included, is billed at the TLD''s renewal_price per year renewed with that component reduced by the domain_renewal_discount_pct of the customer''s account tier, or by the bulk step of a qualifying multi-domain manual order where that is higher, plus the icann_fee_per_year per year, with amounts rounded half up to the cent. A grace-period renewal renews exactly one year, the registry year that lapsed, is booked as charge_type grace_renewal and returns the domain to active, its new expiry date being the expiry date recorded on the domain plus one year; a grace-period renewal billed before 1 December 2025 was billed at the price set by domain_renewal_pricing. A grace-period renewal may be charged only while the domain status is grace and on or before the expiry date recorded on the domain plus renewal_grace_days calendar days, the day after the expiry date counting as day 1. The amount of a grace-period renewal is the lapsed-year renewal component, less the lapsed-year credits, plus the year''s icann_fee_per_year and the late reactivation fee. The lapsed-year renewal component is the TLD''s renewal_price reduced by the percentage discount that applies to the renewal, rounded half up to the cent, and the ICANN fee is never discounted. The amount is worked out in this order: first the lapsed-year renewal component, then the lapsed-year credits are subtracted from it and that result is never taken below zero, and then the ICANN fee and the late reactivation fee are added, every figure being in USD to the cent. In the standard computation no discount and no credit applies, and the late reactivation fee is late_fee_per_day for each calendar day from the day after the expiry date through the day of the renewal, capped at late_fee_cap. The lapsed-year credits are the amounts this rule names as one of the lapsed-year credits, added together. The lapsed-year reseller discount is the domain_renewal_discount_pct the account charter sets for the customer''s account tier: a Harborline Reseller Platinum account takes the Platinum percentage, a Gold account the Gold percentage, a Silver account the Silver percentage, a Bronze account the Bronze percentage, and every other account none. The lapsed-year hosting credit, one of the lapsed-year credits, is bundle_credit_annual for each renewed year where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each renewed year where such a plan has status active and a billing term of 1 month, and nothing otherwise. The lapsed-year plan allowance, one of the lapsed-year credits, is the amount by which the TLD''s renewal_price exceeds its registration_price, for each renewed year, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each renewed year, also where the renewal_price does not exceed the registration_price; the flat plan_allowance_standard once for the renewal where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active. The lapsed-year volume credit, one of the lapsed-year credits, is volume_credit_high for each renewed year where the account credit deposits posted on the customer''s account less than 12 whole months before the day of the renewal total volume_threshold_high or more, volume_credit_low for each renewed year where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached. The lapsed-year autopay credit, one of the lapsed-year credits, is autopay_credit_full for each renewed year where the domain''s auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the renewal, autopay_credit_partial for each renewed year where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off. The late reactivation fee is waived, nothing being charged, where the domain''s most recent grace-period renewal charge carries a price-match refund, that is a refund line returning part but not all of that charge; where no such price-match refund stands and the renewal is made within early_fee_days calendar days after the expiry date, the fee is the flat early_reactivation_fee; where no such price-match refund stands and the renewal is made later, the fee is late_fee_per_day for each calendar day from the day after the expiry date through the day of the renewal, capped at late_fee_cap. The late reactivation fee of a grace-period renewal is fixed only after the domain''s most recent grace-period renewal charge, where it was billed from 1 January 2022 through 30 November 2025 by card or PayPal and earns Domain Care credits, carries its price-match refund.'
  prerequisite:
  - problem: domain_ext_grace_line_price_match
    kind: value_input
    gate: lr_late_fee
    form: state
    policy_source: The late reactivation fee of a grace-period renewal is fixed only after the domain's most recent grace-period renewal charge, where it was billed from 1 January 2022 through 30 November 2025 by card or PayPal and earns Domain Care credits, carries its price-match refund.
    condition: The domain's most recent domain_renewal_charge with charge_type grace_renewal, where billed 2022-01-01..2025-11-30 by card or PayPal with Domain Care credits above zero, has a domain_refund line against it (original_domain_charge_id) returning those credits.
    resolved_by: refund_grace_renewal_price_match_8c76edf7
    effect: Once the price-match refund stands against the most recent grace-period renewal charge, the late reactivation fee takes its waived tier and lr_late_fee becomes 0.
  cross_category:
  - category: hosting
    as: branch
    reads:
    - status
    - billing_term_months
    - variant_name
    - primary_domain
    note: The active plan for the domain decides the lapsed-year hosting credit and plan allowance.
  - category: account
    as: history
    reads:
    - variant_name
    - account_credit_ledger.amount
    note: The tier and the deposits of the last 12 whole months decide the reseller discount and volume credit.
  compute:
  - lr_pct: CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Platinum') else (CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Gold') else (CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Silver') else (CPARAM('account', 'domain_renewal_discount_pct') if EXISTS('account', variant_name='Harborline Reseller Bronze') else 0)))
  - lr_component: int(P('renewal_price') * (100 - lr_pct) + 0.5 + 1e-7) / 100
  - lr_host_on: EXISTS('hosting', primary_domain=F('domain_name'), status='active')
  - lr_host_term: CFIELD('hosting', 'billing_term_months', primary_domain=F('domain_name'), status='active') or 0
  - lr_bundle: (K('bundle_credit_annual') if (lr_host_on and lr_host_term >= 12) else (K('bundle_credit_monthly') if (lr_host_on and lr_host_term == 1) else 0)) * 1
  - lr_plan_var: CFIELD('hosting', 'variant_name', primary_domain=F('domain_name'), status='active') or 'none'
  - lr_plan: MX(K('plan_allowance_standard'), P('renewal_price') - P('registration_price')) * 1 if (lr_plan_var == 'Harborline Business' or lr_plan_var == 'Harborline Cloud 4' or lr_plan_var == 'Harborline Cloud 8') else (K('plan_allowance_standard') if (lr_plan_var == 'Harborline Starter' or lr_plan_var == 'Harborline Plus' or lr_plan_var == 'Harborline Pro') else 0)
  - lr_deposits: XSUM('account', 'account_credit_ledger', 'amount', within_months=12, date_field='entry_date', event_type='account_credit_deposit')
  - lr_volume: (K('volume_credit_high') if lr_deposits >= K('volume_threshold_high') else (K('volume_credit_low') if lr_deposits >= K('volume_threshold_low') else 0)) * 1
  - lr_declines: COUNT('domain_events', within_months=12, date_field='event_at', event_type='domain_auto_renew_decline')
  - lr_autopay: (K('autopay_credit_full') if (F('auto_renew') == True and lr_declines == 0) else (K('autopay_credit_partial') if (F('auto_renew') == True and lr_declines >= 1) else 0)) * 1
  - lr_last_grace_id: LATEST('domain_charges', 'domain_charge_id', date_field='charge_date', event_type='domain_renewal_charge', charge_type='grace_renewal')
  - lr_last_grace_amt: LATEST('domain_charges', 'amount', date_field='charge_date', event_type='domain_renewal_charge', charge_type='grace_renewal') or 0
  - lr_grace_refunded: SUM('domain_charges', 'amount', event_type='domain_refund', original_domain_charge_id=lr_last_grace_id)
  - lr_days_late: DAYS(F('expiry_date'), NOW)
  - lr_late_fee: 0 if (lr_grace_refunded < 0 and lr_grace_refunded + lr_last_grace_amt > 0) else (K('early_reactivation_fee') if lr_days_late <= K('early_fee_days') else MN(K('late_fee_per_day') * lr_days_late, K('late_fee_cap')))
  - lr_credits: lr_bundle + lr_plan + lr_volume + lr_autopay
  - lr_icann: P('icann_fee_per_year')
  - result: RND(MX(0, lr_component - lr_credits) + lr_icann + lr_late_fee + 1e-9)
  compute_basis:
    lr_pct: 'The lapsed-year reseller discount is the domain_renewal_discount_pct the account charter sets for the customer''s account tier: a Harborline Reseller Platinum account takes the Platinum percentage, a Gold account the Gold percentage, a Silver account the Silver percentage, a Bronze account the Bronze percentage, and every other account none.'
    lr_component: The lapsed-year renewal component is the TLD's renewal_price reduced by the percentage discount that applies to the renewal, rounded half up to the cent, and the ICANN fee is never discounted.
    lr_host_on: where a Harborline hosting plan whose primary domain is this domain has status active
    lr_host_term: a billing term of 12 months or more
    lr_bundle: The lapsed-year hosting credit, one of the lapsed-year credits, is bundle_credit_annual for each renewed year where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each renewed year where such a plan has status active and a billing term of 1 month, and nothing otherwise.
    lr_plan_var: where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan
    lr_plan: The lapsed-year plan allowance, one of the lapsed-year credits, is the amount by which the TLD's renewal_price exceeds its registration_price, for each renewed year, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each renewed year, also where the renewal_price does not exceed the registration_price; the flat plan_allowance_standard once for the renewal where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active.
    lr_deposits: the account credit deposits posted on the customer's account less than 12 whole months before the day of the renewal
    lr_volume: The lapsed-year volume credit, one of the lapsed-year credits, is volume_credit_high for each renewed year where the account credit deposits posted on the customer's account less than 12 whole months before the day of the renewal total volume_threshold_high or more, volume_credit_low for each renewed year where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached.
    lr_declines: no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the renewal
    lr_autopay: The lapsed-year autopay credit, one of the lapsed-year credits, is autopay_credit_full for each renewed year where the domain's auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the renewal, autopay_credit_partial for each renewed year where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off.
    lr_last_grace_id: where the domain's most recent grace-period renewal charge carries a price-match refund
    lr_last_grace_amt: that is a refund line returning part but not all of that charge
    lr_grace_refunded: that is a refund line returning part but not all of that charge
    lr_days_late: late_fee_per_day for each calendar day from the day after the expiry date through the day of the renewal
    lr_late_fee: The late reactivation fee is waived, nothing being charged, where the domain's most recent grace-period renewal charge carries a price-match refund, that is a refund line returning part but not all of that charge; where no such price-match refund stands and the renewal is made within early_fee_days calendar days after the expiry date, the fee is the flat early_reactivation_fee; where no such price-match refund stands and the renewal is made later, the fee is late_fee_per_day for each calendar day from the day after the expiry date through the day of the renewal, capped at late_fee_cap.
    lr_credits: The lapsed-year credits are the amounts this rule names as one of the lapsed-year credits, added together.
    lr_icann: The amount of a grace-period renewal is the lapsed-year renewal component, less the lapsed-year credits, plus the year's icann_fee_per_year and the late reactivation fee.
    result: 'The amount is worked out in this order: first the lapsed-year renewal component, then the lapsed-year credits are subtracted from it and that result is never taken below zero, and then the ICANN fee and the late reactivation fee are added, every figure being in USD to the cent.'
  factors:
  - id: lapsed_year_reseller_pct
    effect: parameter
    decides: lr_pct
    bindings:
    - lr_pct
    ladder:
    - when: the account tier is Harborline Reseller Platinum
      value: the Platinum domain_renewal_discount_pct
    - when: the account tier is Harborline Reseller Gold
      value: the Gold domain_renewal_discount_pct
    - when: the account tier is Harborline Reseller Silver
      value: the Silver domain_renewal_discount_pct
    - when: the account tier is Harborline Reseller Bronze
      value: the Bronze domain_renewal_discount_pct
    - when: otherwise
      value: '0'
    baseline:
      lr_pct: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: account
  - id: lapsed_year_hosting_credit
    effect: parameter
    decides: lr_bundle
    bindings:
    - lr_host_on
    - lr_host_term
    - lr_bundle
    ladder:
    - when: a hosting plan for this domain has status active and a billing term of 12 months or more
      value: K('bundle_credit_annual') per renewed year
    - when: such a plan has status active and a billing term of 1 month
      value: K('bundle_credit_monthly') per renewed year
    - when: otherwise
      value: '0'
    baseline:
      lr_bundle: '0'
    evidence:
    - cross_category
    cross_difficulty: hosting
  - id: lapsed_year_plan_allowance
    effect: method
    decides: lr_plan
    bindings:
    - lr_plan_var
    - lr_plan
    ladder:
    - when: the active hosting plan for this domain is a Harborline Business, Cloud 4 or Cloud 8 plan
      method: the amount by which the TLD's renewal_price exceeds its registration_price, for each renewed year, never less than plan_allowance_standard for each renewed year
    - when: the active hosting plan for this domain is a Harborline Starter, Plus or Pro plan
      method: the flat plan_allowance_standard once for the renewal, whatever the TLD's prices
    - when: otherwise
      method: no allowance
    baseline:
      lr_plan: '0'
    evidence:
    - cross_category
    cross_difficulty: hosting
  - id: lapsed_year_volume_credit
    effect: parameter
    decides: lr_volume
    bindings:
    - lr_deposits
    - lr_volume
    ladder:
    - when: deposits of the last 12 whole months total volume_threshold_high or more
      value: K('volume_credit_high') per renewed year
    - when: they total at least volume_threshold_low but less than volume_threshold_high
      value: K('volume_credit_low') per renewed year
    - when: otherwise
      value: '0'
    baseline:
      lr_volume: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  - id: lapsed_year_autopay_credit
    effect: parameter
    decides: lr_autopay
    bindings:
    - lr_declines
    - lr_autopay
    ladder:
    - when: auto-renew is on and no declined attempt is recorded in the last 12 whole months
      value: K('autopay_credit_full') per renewed year
    - when: auto-renew is on and at least one such declined attempt is recorded
      value: K('autopay_credit_partial') per renewed year
    - when: otherwise
      value: '0'
    baseline:
      lr_autopay: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: lapsed_year_late_fee
    effect: method
    decides: lr_late_fee
    bindings:
    - lr_last_grace_id
    - lr_last_grace_amt
    - lr_grace_refunded
    - lr_days_late
    - lr_late_fee
    ladder:
    - when: the domain's most recent grace-period renewal charge carries a price-match refund returning part but not all of it
      method: the fee is waived; nothing is charged
    - when: no such price-match refund stands and the renewal is made within early_fee_days calendar days after the expiry date
      method: the flat early_reactivation_fee
    - when: otherwise
      method: late_fee_per_day times the calendar days from the day after the expiry date through the day of the renewal, capped at late_fee_cap
    baseline:
      lr_late_fee: MN(K('late_fee_per_day') * lr_days_late, K('late_fee_cap'))
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: 'The amount of a grace-period renewal is the lapsed-year renewal component, less the lapsed-year credits, plus the year''s icann_fee_per_year and the late reactivation fee. The lapsed-year renewal component is the TLD''s renewal_price reduced by the percentage discount that applies to the renewal, rounded half up to the cent, and the ICANN fee is never discounted. The amount is worked out in this order: first the lapsed-year renewal component, then the lapsed-year credits are subtracted from it and that result is never taken below zero, and then the ICANN fee and the late reactivation fee are added, every figure being in USD to the cent. In the standard computation no discount and no credit applies, and the late reactivation fee is late_fee_per_day for each calendar day from the day after the expiry date through the day of the renewal, capped at late_fee_cap.'
    params:
    - renewal_price
    - icann_fee_per_year
    - late_fee_per_day
    - late_fee_cap
  inputs:
    history:
    - table: domain_events
      aggregate: count
      field: domain_event_id
      within_months: 12
      filters:
        event_type: domain_auto_renew_decline
    - table: domain_charges
      aggregate: sum
      field: amount
      filters:
        event_type: domain_refund
    - category: account
      table: account_credit_ledger
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: account_credit_deposit
    cross_category:
    - hosting
    - account
- id: domain_ext_grace_line_price_match
  base_policy_refs:
  - domain_refunds
  - domain_renewal_pricing
  - domain_grace_renewal
  overwrite:
  - base_policy: domain_refunds
    superseded_clause: A refund always returns the full amount of one original charge, identified by its charge reference and including the ICANN fee, and partial or prorated domain refunds are not given.
    replaced_by: For the domain's most recent grace-period renewal charge, where it was billed from 1 January 2022 through 30 November 2025 and paid by card or PayPal, and only for such a charge, the Domain Care price match refund is set by the sentences below. Every other refund stays under the rule that governs it, save the Domain Care price matches of the domain's most recent manual renewal, the inbound transfer and the restore charges, each set by the rule of this charter that names it; that rule returns the full amount of one original charge identified by its charge reference and including the ICANN fee, refunds only within the charge type's refund window counted in whole calendar days from the charge date with a TLD whose window is 0 never refunding that charge type, rolls the expiry date back by the years a refunded renewal-type charge covered, refunds a new registration only through its deletion on or before its charge date plus new_registration_refund_days calendar days, refunds an inbound transfer charge only when the transfer is cancelled, never refunds a restore charge, and sends a refund to refund_destination_default unless the customer elects account credit where refund_to_credit_allowed is true.
  - base_policy: domain_refunds
    superseded_clause: A refund goes to refund_destination_default unless the customer elects account credit where refund_to_credit_allowed is true
    replaced_by: 'The Domain Care price match returns, once, the Domain Care credits a grace-period renewal charge earns: it is booked as one refund line of the charge''s own charge type against that charge, returned to the original payment method, at any time and whatever the TLD''s refund window, and it leaves the expiry date where it stands.'
  - base_policy: domain_refunds
    superseded_clause: A manual or grace-period renewal may be refunded only on or before the charge date of the original renewal plus renewal_refund_days calendar days.
    replaced_by: 'The Domain Care price match returns, once, the Domain Care credits a grace-period renewal charge earns: it is booked as one refund line of the charge''s own charge type against that charge, returned to the original payment method, at any time and whatever the TLD''s refund window, and it leaves the expiry date where it stands.'
  - base_policy: domain_refunds
    superseded_clause: a TLD whose window is 0 never refunds that charge type
    replaced_by: 'The Domain Care price match returns, once, the Domain Care credits a grace-period renewal charge earns: it is booked as one refund line of the charge''s own charge type against that charge, returned to the original payment method, at any time and whatever the TLD''s refund window, and it leaves the expiry date where it stands.'
  - base_policy: domain_refunds
    superseded_clause: Refunding a renewal, grace-period renewal or auto-renew charge rolls the expiry date back by the years that charge covered
    replaced_by: 'The Domain Care price match returns, once, the Domain Care credits a grace-period renewal charge earns: it is booked as one refund line of the charge''s own charge type against that charge, returned to the original payment method, at any time and whatever the TLD''s refund window, and it leaves the expiry date where it stands.'
  trigger: state_due
  subject:
  - domain_refund
  computes: refund_amount
  target_tool: refund_grace_renewal_price_match_8c76edf7
  params:
    bundle_credit_annual: 3.0
    bundle_credit_monthly: 1.5
    plan_allowance_standard: 0.75
    volume_threshold_high: 5000.0
    volume_threshold_low: 250.0
    volume_credit_high: 0.5
    volume_credit_low: 0.25
    autopay_credit_full: 0.5
    autopay_credit_partial: 0.2
    term_credit_per_year: 0.6
    term_credit_flat: 1.0
  rule: 'For the domain''s most recent grace-period renewal charge, where it was billed from 1 January 2022 through 30 November 2025 and paid by card or PayPal, and only for such a charge, the Domain Care price match refund is set by the sentences below. Every other refund stays under the rule that governs it, save the Domain Care price matches of the domain''s most recent manual renewal, the inbound transfer and the restore charges, each set by the rule of this charter that names it; that rule returns the full amount of one original charge identified by its charge reference and including the ICANN fee, refunds only within the charge type''s refund window counted in whole calendar days from the charge date with a TLD whose window is 0 never refunding that charge type, rolls the expiry date back by the years a refunded renewal-type charge covered, refunds a new registration only through its deletion on or before its charge date plus new_registration_refund_days calendar days, refunds an inbound transfer charge only when the transfer is cancelled, never refunds a restore charge, and sends a refund to refund_destination_default unless the customer elects account credit where refund_to_credit_allowed is true. The Domain Care price match returns, once, the Domain Care credits a grace-period renewal charge earns: it is booked as one refund line of the charge''s own charge type against that charge, returned to the original payment method, at any time and whatever the TLD''s refund window, and it leaves the expiry date where it stands. The most recent grace-period renewal charge is the grace-period renewal charge line of the domain with the latest charge date; a domain is never billed two such charges on one day, and an older grace-period renewal charge is never price-matched. The price-match refund is the charge''s Domain Care credits, never more than the amount billed on the charge, rounded half up to the cent, and nothing is refunded where those credits come to zero. In the standard computation no Domain Care credit applies to the charge, so nothing is refunded. The Domain Care credits of a grace-period renewal charge are the amounts this rule names as one of the charge''s Domain Care credits, added together, each read from the account''s records on the day of the price match. The grace line''s hosting credit, one of the charge''s Domain Care credits, is bundle_credit_annual for each year the charge covered where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each year the charge covered where such a plan has status active and a billing term of 1 month, and nothing otherwise. The grace line''s plan allowance, one of the charge''s Domain Care credits, is the amount by which the TLD''s renewal_price exceeds its registration_price, for each year the charge covered, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each year the charge covered, also where the renewal_price does not exceed the registration_price; the flat plan_allowance_standard once for the charge where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active. The grace line''s volume credit, one of the charge''s Domain Care credits, is volume_credit_high for each year the charge covered where the account credit deposits posted on the customer''s account less than 12 whole months before the day of the price match total volume_threshold_high or more, volume_credit_low for each year the charge covered where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached. The grace line''s autopay credit, one of the charge''s Domain Care credits, is autopay_credit_full for each year the charge covered where the domain''s auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the price match, autopay_credit_partial for each year the charge covered where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off. The grace line''s term credit, one of the charge''s Domain Care credits, is term_credit_per_year times the years the charge covered where they come to 5 or more, the flat term_credit_flat where they come to 2 to 4, and nothing where they come to 1.'
