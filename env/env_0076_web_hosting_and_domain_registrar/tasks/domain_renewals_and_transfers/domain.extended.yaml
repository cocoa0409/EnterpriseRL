  - gl_plan_var: CFIELD('hosting', 'variant_name', primary_domain=F('domain_name'), status='active') or 'none'
  - gl_plan: MX(K('plan_allowance_standard'), P('renewal_price') - P('registration_price')) * gl_years if (gl_plan_var == 'Harborline Business' or gl_plan_var == 'Harborline Cloud 4' or gl_plan_var == 'Harborline Cloud 8') else (K('plan_allowance_standard') if (gl_plan_var == 'Harborline Starter' or gl_plan_var == 'Harborline Plus' or gl_plan_var == 'Harborline Pro') else 0)
  - gl_deposits: XSUM('account', 'account_credit_ledger', 'amount', within_months=12, date_field='entry_date', event_type='account_credit_deposit')
  - gl_volume: (K('volume_credit_high') if gl_deposits >= K('volume_threshold_high') else (K('volume_credit_low') if gl_deposits >= K('volume_threshold_low') else 0)) * gl_years
  - gl_declines: COUNT('domain_events', within_months=12, date_field='event_at', event_type='domain_auto_renew_decline')
  - gl_autopay: (K('autopay_credit_full') if (F('auto_renew') == True and gl_declines == 0) else (K('autopay_credit_partial') if (F('auto_renew') == True and gl_declines >= 1) else 0)) * gl_years
  - gl_term_span: SUM('domain_charges', 'years', event_type='domain_renewal_charge', charge_type='grace_renewal', charge_date=gl_date)
  - gl_term: K('term_credit_per_year') * gl_term_span if gl_term_span >= 5 else (K('term_credit_flat') if gl_term_span >= 2 else 0)
