- id: domain_ext_transfer_line_price_match
  base_policy_refs:
  - domain_refunds
  overwrite:
  - base_policy: domain_refunds
    superseded_clause: A refund always returns the full amount of one original charge, identified by its charge reference and including the ICANN fee, and partial or prorated domain refunds are not given.
    replaced_by: For the domain's most recent inbound transfer charge, where it was billed from 1 January 2022 through 30 November 2025 and paid by card or PayPal, and only for such a charge, the Domain Care price match refund is set by the sentences below. Every other refund stays under the rule that governs it, save the Domain Care price matches of the domain's most recent grace-period renewal, the manual renewal and the restore charges, each set by the rule of this charter that names it; that rule returns the full amount of one original charge identified by its charge reference and including the ICANN fee, refunds only within the charge type's refund window counted in whole calendar days from the charge date with a TLD whose window is 0 never refunding that charge type, rolls the expiry date back by the years a refunded renewal-type charge covered, refunds a new registration only through its deletion on or before its charge date plus new_registration_refund_days calendar days, refunds an inbound transfer charge only when the transfer is cancelled, never refunds a restore charge, and sends a refund to refund_destination_default unless the customer elects account credit where refund_to_credit_allowed is true.
  - base_policy: domain_refunds
    superseded_clause: A refund goes to refund_destination_default unless the customer elects account credit where refund_to_credit_allowed is true
    replaced_by: 'The Domain Care price match returns, once, the Domain Care credits a inbound transfer charge earns: it is booked as one refund line of the charge''s own charge type against that charge, returned to the original payment method, at any time and whatever the TLD''s refund window, and it leaves the expiry date where it stands.'
  - base_policy: domain_refunds
    superseded_clause: an inbound transfer charge is refunded only when the transfer is cancelled
    replaced_by: 'The Domain Care price match returns, once, the Domain Care credits a inbound transfer charge earns: it is booked as one refund line of the charge''s own charge type against that charge, returned to the original payment method, at any time and whatever the TLD''s refund window, and it leaves the expiry date where it stands.'
  trigger: state_due
  subject:
  - domain_refund
  computes: refund_amount
  target_tool: refund_transfer_in_price_match_5d5ebe85
  params:
    bundle_credit_annual: 3.0
    bundle_credit_monthly: 1.5
    plan_allowance_standard: 0.75
    volume_threshold_high: 5000.0
    volume_threshold_low: 250.0
    volume_credit_high: 0.5
    volume_credit_low: 0.25
    autopay_credit_full: 0.5
    autopay_credit_partial: 0.2
  rule: 'For the domain''s most recent inbound transfer charge, where it was billed from 1 January 2022 through 30 November 2025 and paid by card or PayPal, and only for such a charge, the Domain Care price match refund is set by the sentences below. Every other refund stays under the rule that governs it, save the Domain Care price matches of the domain''s most recent grace-period renewal, the manual renewal and the restore charges, each set by the rule of this charter that names it; that rule returns the full amount of one original charge identified by its charge reference and including the ICANN fee, refunds only within the charge type''s refund window counted in whole calendar days from the charge date with a TLD whose window is 0 never refunding that charge type, rolls the expiry date back by the years a refunded renewal-type charge covered, refunds a new registration only through its deletion on or before its charge date plus new_registration_refund_days calendar days, refunds an inbound transfer charge only when the transfer is cancelled, never refunds a restore charge, and sends a refund to refund_destination_default unless the customer elects account credit where refund_to_credit_allowed is true. The Domain Care price match returns, once, the Domain Care credits a inbound transfer charge earns: it is booked as one refund line of the charge''s own charge type against that charge, returned to the original payment method, at any time and whatever the TLD''s refund window, and it leaves the expiry date where it stands. The most recent inbound transfer charge is the inbound transfer charge line of the domain with the latest charge date; a domain is never billed two such charges on one day, and an older inbound transfer charge is never price-matched. The price-match refund is the charge''s Domain Care credits, never more than the amount billed on the charge, rounded half up to the cent, and nothing is refunded where those credits come to zero. In the standard computation no Domain Care credit applies to the charge, so nothing is refunded. The Domain Care credits of a inbound transfer charge are the amounts this rule names as one of the charge''s Domain Care credits, added together, each read from the account''s records on the day of the price match. The transfer line''s hosting credit, one of the charge''s Domain Care credits, is bundle_credit_annual for each year the charge covered where a Harborline hosting plan whose primary domain is this domain has status active and a billing term of 12 months or more, bundle_credit_monthly for each year the charge covered where such a plan has status active and a billing term of 1 month, and nothing otherwise. The transfer line''s plan allowance, one of the charge''s Domain Care credits, is the amount by which the TLD''s transfer_in_price exceeds its registration_price, for each year the charge covered, where the active Harborline hosting plan whose primary domain is this domain is a Harborline Business, Harborline Cloud 4 or Harborline Cloud 8 plan, that amount being never less than plan_allowance_standard for each year the charge covered, also where the transfer_in_price does not exceed the registration_price; the flat plan_allowance_standard once for the charge where that active plan is a Harborline Starter, Harborline Plus or Harborline Pro plan, and nothing where no such plan is active. The transfer line''s volume credit, one of the charge''s Domain Care credits, is volume_credit_high for each year the charge covered where the account credit deposits posted on the customer''s account less than 12 whole months before the day of the price match total volume_threshold_high or more, volume_credit_low for each year the charge covered where they total at least volume_threshold_low but less than volume_threshold_high, and nothing where they total less, a month counting only once its day of the month is reached. The transfer line''s autopay credit, one of the charge''s Domain Care credits, is autopay_credit_full for each year the charge covered where the domain''s auto-renew setting is on and no declined auto-renew attempt is recorded on it less than 12 whole months before the day of the price match, autopay_credit_partial for each year the charge covered where the setting is on and at least one such declined attempt is recorded, and nothing where auto-renew is off.'
