  compute:
  - tl_id: LATEST('domain_charges', 'domain_charge_id', date_field='charge_date', event_type='domain_purchase_charge', charge_type='transfer_in')
  - tl_date: LATEST('domain_charges', 'charge_date', date_field='charge_date', event_type='domain_purchase_charge', charge_type='transfer_in') or NOW
  - tl_amt: LATEST('domain_charges', 'amount', date_field='charge_date', event_type='domain_purchase_charge', charge_type='transfer_in') or 0
  - tl_years: SUM('domain_charges', 'years', event_type='domain_purchase_charge', charge_type='transfer_in', charge_date=tl_date)
  - tl_pay: LATEST('domain_charges', 'payment_method', date_field='charge_date', event_type='domain_purchase_charge', charge_type='transfer_in')
  - tl_in_scope: DAYS('2022-01-01', tl_date) >= 0 and DAYS(tl_date, '2025-12-01') > 0 and (tl_pay == 'card' or tl_pay == 'paypal')
  - tl_host_on: EXISTS('hosting', primary_domain=F('domain_name'), status='active')
  - tl_host_term: CFIELD('hosting', 'billing_term_months', primary_domain=F('domain_name'), status='active') or 0
  - tl_bundle: (K('bundle_credit_annual') if (tl_host_on and tl_host_term >= 12) else (K('bundle_credit_monthly') if (tl_host_on and tl_host_term == 1) else 0)) * tl_years
  - tl_plan_var: CFIELD('hosting', 'variant_name', primary_domain=F('domain_name'), status='active') or 'none'
  - tl_plan: MX(K('plan_allowance_standard'), P('transfer_in_price') - P('registration_price')) * tl_years if (tl_plan_var == 'Harborline Business' or tl_plan_var == 'Harborline Cloud 4' or tl_plan_var == 'Harborline Cloud 8') else (K('plan_allowance_standard') if (tl_plan_var == 'Harborline Starter' or tl_plan_var == 'Harborline Plus' or tl_plan_var == 'Harborline Pro') else 0)
  - tl_deposits: XSUM('account', 'account_credit_ledger', 'amount', within_months=12, date_field='entry_date', event_type='account_credit_deposit')
  - tl_volume: (K('volume_credit_high') if tl_deposits >= K('volume_threshold_high') else (K('volume_credit_low') if tl_deposits >= K('volume_threshold_low') else 0)) * tl_years
  - tl_declines: COUNT('domain_events', within_months=12, date_field='event_at', event_type='domain_auto_renew_decline')
  - tl_autopay: (K('autopay_credit_full') if (F('auto_renew') == True and tl_declines == 0) else (K('autopay_credit_partial') if (F('auto_renew') == True and tl_declines >= 1) else 0)) * tl_years
  - tl_credits: tl_bundle + tl_plan + tl_volume + tl_autopay
