# Product charter — Web Hosting Plans (category: hosting). Single registry of every quantified policy of this category.
category: hosting
display_name: Web Hosting Plans
binding:
  holding_table: hosting_holdings
  event_tables:
  - hosting_charges
  - hosting_events
  intake_tables:
  - hosting_change_requests
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - provisioning
  - active
  - suspended
  - cancel_pending
  - cancelled
  - terminated
  transitions:
  - from: provisioning
    to: active
    by: system
    means: The hosting account is created on a server and the plan goes live.
  - from: provisioning
    to: cancelled
    by: system
    means: Provisioning is abandoned because the order failed payment or fraud screening.
  - from: active
    to: suspended
    by: system
    means: The plan is suspended for non-payment after its term ended, unresolved resource overuse or detected malware.
  - from: suspended
    to: active
    by: agent
    means: A suspended plan is reactivated once its cause is cured (renewal paid with any reactivation fee, usage
      brought within limits, or malware cleaned).
  - from: suspended
    to: terminated
    by: system
    means: The data retention period of a suspended plan lapses and the account and its files are deleted.
  - from: active
    to: cancel_pending
    by: user
    means: The customer cancels the plan effective at the end of the paid term; auto-renew is switched off.
  - from: cancel_pending
    to: active
    by: agent
    means: The customer withdraws a scheduled cancellation before the term ends.
  - from: cancel_pending
    to: cancelled
    by: system
    means: The paid term ends and the scheduled cancellation takes effect.
  - from: active
    to: cancelled
    by: user
    means: The customer cancels the plan immediately (for example under the money-back guarantee).
accounts:
- key: hosting_billed
  unit: USD
  meaning: 'Net amount billed for one hosting plan: term, renewal, upgrade and service charges add to it; refunds
    and uptime service credits take away from it.'
parameter_schema:
  monthly_rate_no_commitment: Price per month on the 1-month term (no introductory price), USD
  intro_rate_12mo: Introductory price per month for a first 12-month term, USD
  intro_rate_24mo: Introductory price per month for a first 24-month term, USD
  intro_rate_36mo: Introductory price per month for a first 36-month term, USD
  renewal_rate_12mo: Regular price per month for a 12-month term (renewals and non-introductory purchases), USD
  renewal_rate_24mo: Regular price per month for a 24-month term, USD
  renewal_rate_36mo: Regular price per month for a 36-month term, USD
  monthly_setup_fee: One-time setup fee on a plan bought on the 1-month term, USD
  available_terms_months: Billing terms offered, list of months
  intro_first_term_only: Whether the introductory price applies only to the first term of a new plan, boolean
  max_websites: Websites (cPanel add-on domains) allowed on the plan
  storage_gb: NVMe storage, GB
  inode_limit: Maximum files and folders (inodes)
  ram_gb: Memory available to the account, GB
  cpu_cores: CPU cores available to the account
  entry_process_limit: Concurrent entry processes
  php_workers: PHP worker processes
  mysql_databases: MySQL databases allowed
  mailboxes_included: cPanel mailboxes included
  staging_sites: Staging copies allowed
  ssh_access: Whether SSH access is enabled, boolean
  dedicated_ip: Whether a dedicated IPv4 address is included, boolean
  malware_scan_included: Whether daily malware scanning is included, boolean
  free_ssl_included: Whether free automatically renewed domain-validated certificates (AutoSSL) cover every hosted
    domain, boolean
  free_domain_included: Whether the plan carries a free first-year domain registration entitlement, boolean
  free_domain_min_term_months: Shortest billing term on which the free domain entitlement applies, months
  backup_frequency: 'Automatic backup frequency: weekly or daily'
  backup_retention_days: Calendar days a backup restore point is kept
  self_service_restore: Whether the customer may restore backups without a fee, boolean
  backup_restore_fee: Fee per support-performed restore from backup, USD (0.00 where restores are free)
  money_back_days: Calendar days after the plan's opening date within which an immediate cancellation is refunded
    under the money-back guarantee
  money_back_min_term_months: Shortest billing term covered by the money-back guarantee, months
  money_back_per_customer_365d: Largest number of hosting money-back refunds one customer may receive in a trailing
    365 days
  auto_renew_refund_days: Calendar days after an auto-renew charge of a 12-month or longer term within which it
    may be refunded
  monthly_renewal_refundable: Whether a 1-month term renewal can be refunded, boolean
  setup_fee_refundable: Whether the 1-month setup fee is refunded under the money-back or auto-renew refund rules
    (a failed order is always refunded in full), boolean
  refund_destination_default: 'Where a hosting refund goes when the customer states no preference: original_payment_method'
  auto_renew_default_on: Whether auto-renew is on by default for a new plan, boolean
  auto_renew_days_before_term_end: Calendar days before the term end date on which the first auto-renew attempt
    runs
  auto_renew_retry_days_before_term_end: Calendar days before the term end date on which retries run after a declined
    first attempt, list
  suspension_grace_days: Calendar days after the term end date during which an unpaid plan keeps running before
    suspension
  data_retention_days: Calendar days a plan suspended for non-payment is kept before termination, counted from the
    suspension date
  reactivation_fee: Fee to reactivate a plan suspended for non-payment, USD
  overage_cure_days: Calendar days after a resource overage notice within which usage must return within limits
    before suspension
  inode_warning_pct: Percent of the inode or storage limit at which an overage warning notice is sent
  upgrade_targets: Tiers the plan may be upgraded to mid-term, list of official names
  downgrade_effective_at: 'When a downgrade takes effect: next_renewal'
  downgrade_requires_usage_within_limits: Whether a downgrade requires current usage to fit the lower tier's websites
    and storage limits, boolean
  uptime_sla_pct: Monthly uptime commitment, percent
  sla_credit_pct_per_step: Percent of the plan's monthly fee credited per started 0.1 percentage point of uptime
    below the commitment
  sla_credit_cap_pct: Largest uptime credit for one calendar month, percent of the monthly fee
  sla_claim_window_days: Calendar days after the end of the affected calendar month within which an uptime credit
    can be claimed
  price_rounding: 'Rounding of every computed hosting amount: half_up_to_cent'
  provisioning_deadline_hours: Elapsed hours after the order within which a paid plan is provisioned
