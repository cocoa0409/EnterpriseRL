events:
- type: hosting_order
  target: hosting_holdings
  mutation: create
  meaning: A customer orders a new hosting plan for a primary domain on a chosen billing term.
  grain: One row per hosting plan ordered.
  fields:
    variant_name: Official plan name ordered.
    primary_domain: Primary domain the plan is set up for, lowercase, verbatim.
    billing_term_months: 'Term chosen: 1, 12, 24 or 36.'
    term_start_date: Order date.
    term_end_date: Order date plus the term in calendar months.
    first_term: Set to true.
    auto_renew: Initial auto-renew setting.
    opened_date: Order date.
  triggers:
  - event: hosting:hosting_term_charge
    map:
      charge_type: initial_term
- type: hosting_activate
  target: hosting_holdings
  mutation:
    transition:
      from: provisioning
      to: active
  meaning: The plan is provisioned on a server and goes live.
  grain: One row per transaction.
  fields:
    activated_date: Date provisioning completed.
  triggers: []
- type: hosting_provision_fail
  target: hosting_holdings
  mutation:
    transition:
      from: provisioning
      to: cancelled
  meaning: The order fails payment or fraud screening and is never provisioned.
  grain: One row per transaction.
  fields:
    closed_date: Date the order was abandoned.
  triggers:
  - event: hosting:hosting_refund
    map:
      refund_kind: failed_order
- type: hosting_suspend
  target: hosting_holdings
  mutation:
    transition:
      from: active
      to: suspended
  meaning: The plan is suspended for non-payment, unresolved resource overuse or malware.
  grain: One row per transaction.
  fields:
    suspended_date: Date of suspension.
    suspension_reason: nonpayment, resource_overuse or malware.
  triggers: []
- type: hosting_reactivate
  target: hosting_holdings
  mutation:
    transition:
      from: suspended
      to: active
  meaning: A suspended plan is reactivated after its cause is cured.
  grain: One row per transaction.
  fields:
    suspended_date: Cleared to empty.
    suspension_reason: Reset to none.
  triggers: []
- type: hosting_terminate
  target: hosting_holdings
  mutation:
    transition:
      from: suspended
      to: terminated
  meaning: The data retention period of a suspended plan lapses and the plan and its files are deleted.
  grain: One row per transaction.
  fields:
    closed_date: Termination date.
  triggers: []
- type: hosting_cancel_schedule
  target: hosting_holdings
  mutation:
    transition:
      from: active
      to: cancel_pending
  meaning: The customer cancels the plan effective at the end of the paid term.
  grain: One row per transaction.
  fields:
    auto_renew: Set to false.
  triggers: []
- type: hosting_cancel_withdraw
  target: hosting_holdings
  mutation:
    transition:
      from: cancel_pending
      to: active
  meaning: The customer withdraws a scheduled cancellation before the term ends.
  grain: One row per transaction.
  fields:
    auto_renew: Set back to true.
  triggers: []
- type: hosting_cancel_effective
  target: hosting_holdings
  mutation:
    transition:
      from: cancel_pending
      to: cancelled
  meaning: The paid term ends and the scheduled cancellation takes effect.
  grain: One row per transaction.
  fields:
    closed_date: The term end date.
  triggers: []
- type: hosting_cancel_immediate
  target: hosting_holdings
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: The customer cancels the plan with immediate effect.
  grain: One row per transaction.
  fields:
    closed_date: Cancellation date.
  triggers: []
- type: hosting_upgrade
  target: hosting_holdings
  mutation: update
  meaning: The plan is moved to a higher tier mid-term; the term dates stay unchanged.
  grain: One row per upgrade.
  fields:
    variant_name: New official plan name.
  triggers: []
- type: hosting_term_renew
  target: hosting_holdings
  mutation: update
  meaning: 'A paid renewal starts the next term: term dates advance, a scheduled downgrade or term change is applied,
    and the introductory flag clears.'
  grain: One row per term renewal.
  fields:
    term_start_date: Previous term end date.
    term_end_date: New term start plus the renewal term in calendar months.
    billing_term_months: Renewal term length.
    variant_name: Tier for the new term (the scheduled downgrade target when one is due).
    first_term: Set to false.
  triggers: []
- type: hosting_term_rollback
  target: hosting_holdings
  mutation: update
  meaning: 'A refunded renewal is reversed: the term dates return to the term paid before that renewal and auto-renew
    is switched off.'
  grain: One row per refunded renewal.
  fields:
    term_start_date: Start of the term paid before the refunded renewal.
    term_end_date: End of the term paid before the refunded renewal.
    auto_renew: Set to false.
  triggers: []
- type: hosting_settings_update
  target: hosting_holdings
  mutation: update
  meaning: The customer switches auto-renew on or off, or usage figures are refreshed.
  grain: One row per change.
  fields:
    auto_renew: Auto-renew switch after the change.
    websites_in_use: Websites currently set up on the plan.
    storage_used_gb: Storage currently used, GB.
  triggers: []
- type: hosting_term_charge
  target: hosting_charges
  meaning: The first term of a plan is billed, with the setup fee on 1-month plans as its own line.
  grain: One row per billed line of a plan purchase.
  distinguish_by:
  - charge_type
  - period_start
  fields:
    charge_type: initial_term or setup_fee.
    amount: Amount billed, USD, positive.
    term_months: Months covered.
    period_start: First day covered.
    period_end: Last day covered.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: hosting_billed
  direction: in
  triggers:
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: hosting_renewal_charge
  target: hosting_charges
  meaning: A renewal of the plan for its next term is billed, manually or by auto-renew.
  grain: One row per billed term renewal.
  distinguish_by:
  - period_start
  fields:
    charge_type: renewal or auto_renew.
    amount: Amount billed, USD, positive.
    term_months: Renewal term length.
    period_start: First day of the new term (the previous term end date).
    period_end: Last day of the new term.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: hosting_billed
  direction: in
  triggers:
  - event: hosting:hosting_term_renew
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: hosting_upgrade_charge
  target: hosting_charges
  meaning: The prorated difference for a mid-term upgrade is billed.
  grain: One row per upgrade billed.
  distinguish_by:
  - charge_date
  - target_variant
  fields:
    charge_type: upgrade_proration.
    amount: Prorated amount billed, USD, positive.
    target_variant: Plan upgraded to.
    period_start: Upgrade date.
    period_end: Current term end date.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: hosting_billed
  direction: in
  triggers:
  - event: hosting:hosting_upgrade
    map:
      variant_name: target_variant
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: hosting_service_charge
  target: hosting_charges
  meaning: 'A one-off service is billed: a support-performed backup restore or a reactivation fee.'
  grain: One row per billed service.
  distinguish_by:
  - charge_type
  - charge_date
  - order_ref
  fields:
    charge_type: backup_restore or reactivation_fee.
    amount: Amount billed, USD, positive.
    charge_date: Date billed.
    order_ref: Harborline order number.
    payment_method: card, paypal or account_credit.
  account: hosting_billed
  direction: in
  triggers:
  - event: account:account_credit_apply
    when:
      payment_method: account_credit
    map:
      customer_id: customer_id
- type: hosting_refund
  target: hosting_charges
  meaning: A hosting charge is refunded under the money-back guarantee, the auto-renew refund rule or a failed order.
  grain: One row per refunded original charge.
  distinguish_by:
  - original_hosting_charge_id
  fields:
    original_hosting_charge_id: Reference of the charge refunded.
    charge_type: Charge type of the refunded charge, copied from it.
    refund_kind: money_back, auto_renew_refund or failed_order.
    amount: Refunded amount, USD, negative.
    charge_date: Refund date.
    refund_destination: original_payment_method or account_credit.
  account: hosting_billed
  direction: out
  triggers:
  - event: hosting:hosting_term_rollback
    when:
      refund_kind: auto_renew_refund
  - event: account:account_credit_refund
    when:
      refund_destination: account_credit
    map:
      customer_id: customer_id
- type: hosting_sla_credit
  target: hosting_charges
  meaning: An uptime service credit for a calendar month below the uptime commitment is issued as account credit.
  grain: One row per plan per affected calendar month.
  distinguish_by:
  - uptime_month
  fields:
    uptime_month: Calendar month credited.
    amount: Credit, USD, negative.
    charge_date: Date issued.
    refund_destination: Always account_credit.
  account: hosting_billed
  direction: out
  triggers:
  - event: account:account_service_credit
    map:
      customer_id: customer_id
- type: hosting_renewal_decline
  target: hosting_events
  meaning: An auto-renew attempt is declined.
  grain: One row per declined attempt.
  distinguish_by:
  - attempt_number
  - event_at
  fields:
    attempt_number: 1 for the first attempt, 2-3 for retries.
    event_at: Moment of the attempt.
  triggers: []
- type: hosting_resource_notice
  target: hosting_events
  meaning: The plan's usage of a resource reaches the warning level or exceeds its limit and the customer is notified.
  grain: One row per notice per resource.
  distinguish_by:
  - resource
  - event_at
  fields:
    resource: inodes, storage or cpu.
    notice_level: warning or over_limit.
    measured_value: Usage measured, in the resource's unit.
    event_at: Moment of the notice.
  triggers: []
- type: hosting_uptime_report
  target: hosting_events
  meaning: The measured uptime of the plan's server for a calendar month is recorded.
  grain: One row per plan per calendar month.
  distinguish_by:
  - uptime_month
  fields:
    uptime_month: Calendar month measured.
    uptime_pct: Measured uptime, percent.
    event_at: Moment the report was published.
  triggers: []
- type: hosting_backup_restore
  target: hosting_events
  meaning: Files or databases are restored from a backup restore point.
  grain: One row per restore performed.
  distinguish_by:
  - restore_point_date
  - event_at
  fields:
    restore_point_date: Date of the backup restored from.
    performed_by: self_service, support_paid (support restore on a tier with a restore fee) or support_included
      (support restore on a tier without one).
    event_at: Moment of the restore.
  triggers:
  - event: hosting:hosting_service_charge
    when:
      performed_by: support_paid
    map:
      charge_type: backup_restore
measures:
- id: hosting_msr_money_back_365d
  window: Trailing 365 calendar days ending today, today included.
  measure: Count of hosting_refund rows with refund_kind money_back across all of the customer's hosting plans whose
    charge_date falls in the window.
- id: hosting_msr_cycle_declines
  window: 'The current renewal cycle: from the first attempt day (term end date minus auto_renew_days_before_term_end)
    up to and including the term end date.'
  measure: Count of hosting_renewal_decline rows of the plan whose event_at falls in the window.
policies:
- id: hosting_agg_multi_holding
  subject:
  - hosting_order
  rule: A customer may hold any number of hosting plans, each billed and renewed on its own term. A new plan may
    be ordered for a primary domain only when no other plan of any customer for that primary domain is in status
    provisioning, active, suspended or cancel_pending. Additional websites belong on an existing plan within its
    max_websites rather than on a second plan for the same domain.
  eligibility:
  - id: one_live_plan_per_domain
    applies_to:
    - hosting_order
    kind: dedup
    condition: A new plan may be ordered for a primary domain only when no other plan of any customer for that primary
      domain is in status provisioning, active, suspended or cancel_pending.
    evidence_fields:
    - hosting_holdings.primary_domain
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.primary_domain
      action_bindings:
        hosting_holdings.primary_domain: primary_domain
    dedup_contract:
      table: hosting_holdings
      mode: separate_record
      object_bindings:
        primary_domain: primary_domain
      duplicate_filters:
        status:
        - provisioning
        - active
        - suspended
        - cancel_pending
      distinct_fields: []
  params:
    max_per_customer: null
- id: hosting_agg_money_back_limit
  subject:
  - hosting_refund
  rule: Money-back refunds are counted across all of a customer's hosting plans together, not per plan. A money-back
    refund may be given only while hosting_msr_money_back_365d is below money_back_per_customer_365d. A customer
    at the limit may still cancel immediately or at term end, but without any money-back refund.
  eligibility:
  - id: money_back_quota
    applies_to:
    - hosting_refund
    kind: authorization
    condition: A money-back refund may be given only while hosting_msr_money_back_365d is below money_back_per_customer_365d.
    evidence_fields:
    - hosting_charges.refund_kind
    - hosting_charges.charge_date
    - hosting_holdings.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.customer_id
      action_bindings:
        hosting_holdings.customer_id: customer_id
  measures:
  - hosting_msr_money_back_365d
- id: hosting_term_pricing
  subject:
  - hosting_term_charge
  - hosting_order
  rule: The first term of a new plan on a 12, 24 or 36-month term is billed at the tier's introductory rate for
    that term length (intro_rate_12mo, intro_rate_24mo or intro_rate_36mo) times the months of the term. A plan
    bought on the 1-month term is billed monthly_rate_no_commitment for its first month plus monthly_setup_fee as
    a separate setup_fee line, and has no introductory rate. The term price, but never the setup fee, is reduced
    by the hosting_discount_pct of the customer's account tier under the account charter and rounded half up to
    the cent (price_rounding). Purchase lines are billed when the order is placed, while the plan is provisioning.
    Only terms listed in available_terms_months can be ordered, the term end date is the order date plus the term
    in calendar months (falling back to the last day of the month where that day does not exist), and auto-renew
    starts as auto_renew_default_on.
  eligibility:
  - id: billed_while_provisioning
    applies_to:
    - hosting_term_charge
    kind: state
    condition: Purchase lines are billed when the order is placed, while the plan is provisioning.
    evidence_fields:
    - hosting_holdings.hosting_id
    - hosting_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.hosting_id
      action_bindings:
        hosting_holdings.hosting_id: hosting_id
    state_contract:
      field: hosting_holdings.status
      allowed:
      - provisioning
  params:
    account_hosting_discount_pct: account charter parameter hosting_discount_pct of the customer's account tier
    per_tier:
      Harborline Starter:
        intro_12: =intro_rate_12mo
        intro_24: =intro_rate_24mo
        intro_36: =intro_rate_36mo
        monthly: =monthly_rate_no_commitment
        setup: =monthly_setup_fee
      Harborline Plus:
        intro_12: =intro_rate_12mo
        intro_24: =intro_rate_24mo
        intro_36: =intro_rate_36mo
        monthly: =monthly_rate_no_commitment
        setup: =monthly_setup_fee
      Harborline Pro:
        intro_12: =intro_rate_12mo
        intro_24: =intro_rate_24mo
        intro_36: =intro_rate_36mo
        monthly: =monthly_rate_no_commitment
        setup: =monthly_setup_fee
      Harborline Business:
        intro_12: =intro_rate_12mo
        intro_24: =intro_rate_24mo
        intro_36: =intro_rate_36mo
        monthly: =monthly_rate_no_commitment
        setup: =monthly_setup_fee
      Harborline Cloud 4:
        intro_12: =intro_rate_12mo
        intro_24: =intro_rate_24mo
        intro_36: =intro_rate_36mo
        monthly: =monthly_rate_no_commitment
        setup: =monthly_setup_fee
      Harborline Cloud 8:
        intro_12: =intro_rate_12mo
        intro_24: =intro_rate_24mo
        intro_36: =intro_rate_36mo
        monthly: =monthly_rate_no_commitment
        setup: =monthly_setup_fee
  formula:
    first_term_12: round(intro_rate_12mo * 12 * (100 - account_hosting_discount_pct) / 100, 2)
    first_term_24: round(intro_rate_24mo * 24 * (100 - account_hosting_discount_pct) / 100, 2)
    first_term_36: round(intro_rate_36mo * 36 * (100 - account_hosting_discount_pct) / 100, 2)
    first_month: round(monthly_rate_no_commitment * (100 - account_hosting_discount_pct) / 100, 2)
- id: hosting_renewal
  subject:
  - hosting_renewal_charge
  - hosting_renewal_decline
  - hosting_term_renew
  rule: A renewal may be charged only while the plan status is active or suspended. A renewal is billed at the regular
    rate of the tier and term length that the new term will have (renewal_rate_12mo, renewal_rate_24mo or renewal_rate_36mo
    times the months, or monthly_rate_no_commitment for a 1-month term, with no setup fee), less the account tier's
    hosting_discount_pct, rounded half up to the cent. The new term length is the current one unless a scheduled
    term change applies, and a scheduled downgrade's target tier sets the rates when it is applied at that renewal.
    The new term always starts on the previous term end date, even when the renewal is paid late. Auto-renew attempts
    run only while the plan's auto_renew setting is true. The first auto-renew attempt runs auto_renew_days_before_term_end
    calendar days before the term end date, and after a decline retries run on each day listed in auto_renew_retry_days_before_term_end,
    using the funding order of the account charter. When every attempt of the cycle has declined (hosting_msr_cycle_declines
    equals one plus the number of retry days), no further automatic attempt is made and the plan follows hosting_suspension
    after its term ends. A plan in cancel_pending is never renewed; the cancellation must first be withdrawn.
  eligibility:
  - id: renewable_plan
    applies_to:
    - hosting_renewal_charge
    kind: state
    condition: A renewal may be charged only while the plan status is active or suspended.
    evidence_fields:
    - hosting_holdings.hosting_id
    - hosting_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.hosting_id
      action_bindings:
        hosting_holdings.hosting_id: hosting_id
    state_contract:
      field: hosting_holdings.status
      allowed:
      - active
      - suspended
  - id: auto_renew_on
    applies_to:
    - hosting_renewal_decline
    kind: state
    condition: Auto-renew attempts run only while the plan's auto_renew setting is true.
    evidence_fields:
    - hosting_holdings.hosting_id
    - hosting_holdings.auto_renew
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.hosting_id
      action_bindings:
        hosting_holdings.hosting_id: hosting_id
    state_contract:
      field: hosting_holdings.auto_renew
      allowed:
      - true
  params:
    account_hosting_discount_pct: account charter parameter hosting_discount_pct of the customer's account tier
    per_tier:
      Harborline Starter:
        renewal_12: =renewal_rate_12mo
        renewal_24: =renewal_rate_24mo
        renewal_36: =renewal_rate_36mo
        monthly: =monthly_rate_no_commitment
      Harborline Plus:
        renewal_12: =renewal_rate_12mo
        renewal_24: =renewal_rate_24mo
        renewal_36: =renewal_rate_36mo
        monthly: =monthly_rate_no_commitment
      Harborline Pro:
        renewal_12: =renewal_rate_12mo
        renewal_24: =renewal_rate_24mo
        renewal_36: =renewal_rate_36mo
        monthly: =monthly_rate_no_commitment
      Harborline Business:
        renewal_12: =renewal_rate_12mo
        renewal_24: =renewal_rate_24mo
        renewal_36: =renewal_rate_36mo
        monthly: =monthly_rate_no_commitment
      Harborline Cloud 4:
        renewal_12: =renewal_rate_12mo
        renewal_24: =renewal_rate_24mo
        renewal_36: =renewal_rate_36mo
        monthly: =monthly_rate_no_commitment
      Harborline Cloud 8:
        renewal_12: =renewal_rate_12mo
        renewal_24: =renewal_rate_24mo
        renewal_36: =renewal_rate_36mo
        monthly: =monthly_rate_no_commitment
  formula:
    renewal_12: round(renewal_rate_12mo * 12 * (100 - account_hosting_discount_pct) / 100, 2)
    renewal_24: round(renewal_rate_24mo * 24 * (100 - account_hosting_discount_pct) / 100, 2)
    renewal_36: round(renewal_rate_36mo * 36 * (100 - account_hosting_discount_pct) / 100, 2)
    renewal_1: round(monthly_rate_no_commitment * (100 - account_hosting_discount_pct) / 100, 2)
  measures:
  - hosting_msr_cycle_declines
- id: hosting_upgrade_proration
  subject:
  - hosting_upgrade_charge
  - hosting_upgrade
  rule: 'An upgrade may be charged only while the plan status is active. The target must be one of the current tier''s
    upgrade_targets, and the upgrade takes effect immediately without changing the term dates, the money-back period
    or the first-term flag. The upgrade charge is the new term price minus the amount paid for the current term,
    times the remaining days divided by the term days, rounded half up to the cent and never below zero. The new
    term price is the target tier''s rate for the current term length times its months, less the account tier''s
    hosting_discount_pct: the target''s introductory rate when the current term is the first term, otherwise its
    regular rate, and monthly_rate_no_commitment for a 1-month term. The amount paid for the current term is the
    amount of the initial_term, renewal or auto_renew line whose period_start equals the plan''s term start date,
    plus any earlier upgrade_proration lines of the same term. Remaining days are the calendar days from today to
    the term end date, and term days are the calendar days from the term start date to the term end date. The next
    renewal is billed at the upgraded tier''s regular rates.'
  eligibility:
  - id: upgrade_active
    applies_to:
    - hosting_upgrade_charge
    kind: state
    condition: An upgrade may be charged only while the plan status is active.
    evidence_fields:
    - hosting_holdings.hosting_id
    - hosting_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.hosting_id
      action_bindings:
        hosting_holdings.hosting_id: hosting_id
    state_contract:
      field: hosting_holdings.status
      allowed:
      - active
  params:
    new_term_price: target tier rate for the current term length times its months, less the account tier hosting
      discount
    paid_term_amount: amount of the line that paid the current term plus earlier upgrade lines of that term
    remaining_days: calendar days from today to term_end_date
    term_days: calendar days from term_start_date to term_end_date
    per_tier:
      Harborline Starter:
        targets: =upgrade_targets
      Harborline Plus:
        targets: =upgrade_targets
      Harborline Pro:
        targets: =upgrade_targets
      Harborline Business:
        targets: =upgrade_targets
      Harborline Cloud 4:
        targets: =upgrade_targets
      Harborline Cloud 8:
        targets: =upgrade_targets
  formula:
    upgrade_amount: max(0, round((new_term_price - paid_term_amount) * remaining_days / term_days, 2))
- id: hosting_downgrade_and_term_change
  subject:
  - hosting_term_renew
  - hosting_settings_update
  rule: A downgrade or a term change is never applied mid-term; it is recorded as a scheduled request taking effect
    on the current term end date (downgrade_effective_at), and a newer request for the same plan replaces an older
    scheduled one. A scheduled downgrade is applied at renewal only when websites_in_use and storage_used_gb fit
    within the target tier's max_websites and storage_gb. A downgrade that does not fit at renewal is declined and
    the plan renews on its current tier, and nothing already billed is refunded or credited by a downgrade. The
    customer may withdraw a scheduled request at any time before its effective date. Auto-renew may be switched
    on or off only while the plan status is provisioning, active or suspended.
  eligibility:
  - id: downgrade_fits
    applies_to:
    - hosting_term_renew
    kind: authorization
    condition: A scheduled downgrade is applied at renewal only when websites_in_use and storage_used_gb fit within
      the target tier's max_websites and storage_gb.
    evidence_fields:
    - hosting_holdings.websites_in_use
    - hosting_holdings.storage_used_gb
    - hosting_change_requests.hosting_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_change_requests.hosting_request_id
      action_bindings:
        hosting_change_requests.hosting_request_id: hosting_request_id
  - id: auto_renew_switch_status
    applies_to:
    - hosting_settings_update
    kind: state
    condition: Auto-renew may be switched on or off only while the plan status is provisioning, active or suspended.
    evidence_fields:
    - hosting_holdings.hosting_id
    - hosting_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.hosting_id
      action_bindings:
        hosting_holdings.hosting_id: hosting_id
    state_contract:
      field: hosting_holdings.status
      allowed:
      - provisioning
      - active
      - suspended
  params:
    per_tier:
      Harborline Starter:
        websites: =max_websites
        storage: =storage_gb
        downgrade_fit_required: =downgrade_requires_usage_within_limits
      Harborline Plus:
        websites: =max_websites
        storage: =storage_gb
        downgrade_fit_required: =downgrade_requires_usage_within_limits
      Harborline Pro:
        websites: =max_websites
        storage: =storage_gb
        downgrade_fit_required: =downgrade_requires_usage_within_limits
      Harborline Business:
        websites: =max_websites
        storage: =storage_gb
        downgrade_fit_required: =downgrade_requires_usage_within_limits
      Harborline Cloud 4:
        websites: =max_websites
        storage: =storage_gb
        downgrade_fit_required: =downgrade_requires_usage_within_limits
      Harborline Cloud 8:
        websites: =max_websites
        storage: =storage_gb
        downgrade_fit_required: =downgrade_requires_usage_within_limits
- id: hosting_money_back
  subject:
  - hosting_cancel_immediate
  - hosting_cancel_schedule
  - hosting_cancel_withdraw
  - hosting_cancel_effective
  - hosting_refund
  rule: Only the customer can cancel a plan, either immediately or at the end of the paid term, and a scheduled
    cancellation may be withdrawn before the term end date. A money-back refund is given only for an immediate cancellation
    made on or before the plan's opening date plus money_back_days calendar days. The window adds whole calendar
    days to the opening date, counting the day after it as day 1, and the last day is included. The guarantee covers
    only a plan whose first term is at least money_back_min_term_months, so a 1-month plan never receives one. The
    money-back refund returns the plan's initial_term line and any upgrade_proration lines in full, but never setup
    fees, backup restore or reactivation fees. When a domain holding names this plan as its bundled_hosting_id and
    that domain is not deleted or cancelled, the customer keeps the domain and the bundle_registration_value of
    its TLD under the domain charter is deducted once from the refund, never taking it below zero. Each refunded
    charge line may be refunded only once. An immediate cancellation outside the window, or not covered by the guarantee,
    ends the plan with no refund of the unused term, and a cancellation at term end gives no refund at all.
  eligibility:
  - id: money_back_window
    applies_to:
    - hosting_refund
    kind: time
    condition: A money-back refund is given only for an immediate cancellation made on or before the plan's opening
      date plus money_back_days calendar days.
    evidence_fields:
    - hosting_charges.refund_kind
    - hosting_holdings.hosting_id
    - hosting_holdings.opened_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.hosting_id
      action_bindings:
        hosting_holdings.hosting_id: hosting_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the plan's opening date
      anchor_source: hosting_holdings.opened_date
      relation: not_after
      duration_source: variants.money_back_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the opening date, counting the day after it as day 1,
        and the last day is included.
      boundary: inclusive
  - id: refund_line_once
    applies_to:
    - hosting_refund
    kind: dedup
    condition: Each refunded charge line may be refunded only once.
    evidence_fields:
    - hosting_charges.original_hosting_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_charges.original_hosting_charge_id
      action_bindings:
        hosting_charges.original_hosting_charge_id: original_hosting_charge_id
    dedup_contract:
      table: hosting_charges
      mode: separate_record
      object_bindings:
        original_hosting_charge_id: original_hosting_charge_id
      duplicate_filters:
        event_type:
        - hosting_refund
      distinct_fields: []
  params:
    refundable_lines: sum of the plan's initial_term and upgrade_proration line amounts
    bundle_deduction: domain charter bundle_registration_value of the kept bundled domain's TLD, or 0 when there
      is none
  formula:
    money_back_refund: max(0, refundable_lines - bundle_deduction)
- id: hosting_auto_renew_refund
  subject:
  - hosting_refund
  - hosting_term_rollback
  rule: An auto-renew charge for a term of 12 months or longer may be refunded in full only on or before the charge
    date of the auto-renew charge plus auto_renew_refund_days calendar days. The window adds whole calendar days
    to the charge date, counting the day after it as day 1, and the last day is included. A 1-month renewal (monthly_renewal_refundable)
    and a renewal the customer paid manually are not refundable. Refunding the auto-renew charge rolls the plan
    back to the term paid before it with auto-renew switched off, and when that earlier term end date has already
    passed, the plan's scheduled cancellation takes effect at once. The refund goes to refund_destination_default,
    or to account credit when the customer elects it or the charge was paid from credit.
  eligibility:
  - id: auto_renew_refund_window
    applies_to:
    - hosting_refund
    kind: time
    condition: An auto-renew charge for a term of 12 months or longer may be refunded in full only on or before
      the charge date of the auto-renew charge plus auto_renew_refund_days calendar days.
    evidence_fields:
    - hosting_charges.charge_type
    - hosting_charges.term_months
    - hosting_charges.hosting_charge_id
    - hosting_charges.charge_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_charges.hosting_charge_id
      action_bindings:
        hosting_charges.hosting_charge_id: original_hosting_charge_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the charge date of the auto-renew charge
      anchor_source: hosting_charges.charge_date
      relation: not_after
      duration_source: variants.auto_renew_refund_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the charge date, counting the day after it as day 1,
        and the last day is included.
      boundary: inclusive
- id: hosting_suspension
  subject:
  - hosting_suspend
  - hosting_reactivate
  - hosting_terminate
  - hosting_service_charge
  - hosting_resource_notice
  rule: A plan whose term has ended unpaid keeps running for suspension_grace_days calendar days after the term
    end date and is suspended for non-payment on the following day. A plan suspended for non-payment may be reactivated
    only on or before the suspension date plus data_retention_days calendar days. The window adds whole calendar
    days to the suspension date, counting the day after it as day 1, and the last day is included, after which the
    plan is terminated and its files deleted. Reactivation after non-payment requires the renewal under hosting_renewal
    plus the tier's reactivation_fee. A reactivation fee may be charged only while the plan status is suspended.
    Usage at inode_warning_pct of the inode or storage limit triggers a warning notice, and usage over a limit triggers
    an over-limit notice; a plan still over the limit overage_cure_days calendar days after the over-limit notice
    is suspended for resource overuse. A plan suspended for resource overuse or malware is reactivated, without
    any fee, once usage is back within limits or the malware has been cleaned, and its term dates are never changed
    by a suspension.
  eligibility:
  - id: reactivation_window
    applies_to:
    - hosting_reactivate
    kind: time
    condition: A plan suspended for non-payment may be reactivated only on or before the suspension date plus data_retention_days
      calendar days.
    evidence_fields:
    - hosting_holdings.suspension_reason
    - hosting_holdings.hosting_id
    - hosting_holdings.suspended_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.hosting_id
      action_bindings:
        hosting_holdings.hosting_id: hosting_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the suspension date
      anchor_source: hosting_holdings.suspended_date
      relation: not_after
      duration_source: variants.data_retention_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the suspension date, counting the day after it as day
        1, and the last day is included, after which the plan is terminated and its files deleted.
      boundary: inclusive
  - id: fee_while_suspended
    applies_to:
    - hosting_service_charge
    kind: state
    condition: A reactivation fee may be charged only while the plan status is suspended.
    evidence_fields:
    - hosting_holdings.suspension_reason
    - hosting_holdings.hosting_id
    - hosting_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.hosting_id
      action_bindings:
        hosting_holdings.hosting_id: hosting_id
    state_contract:
      field: hosting_holdings.status
      allowed:
      - suspended
  params:
    per_tier:
      Harborline Starter:
        retention_days: =data_retention_days
        reactivation_fee: =reactivation_fee
      Harborline Plus:
        retention_days: =data_retention_days
        reactivation_fee: =reactivation_fee
      Harborline Pro:
        retention_days: =data_retention_days
        reactivation_fee: =reactivation_fee
      Harborline Business:
        retention_days: =data_retention_days
        reactivation_fee: =reactivation_fee
      Harborline Cloud 4:
        retention_days: =data_retention_days
        reactivation_fee: =reactivation_fee
      Harborline Cloud 8:
        retention_days: =data_retention_days
        reactivation_fee: =reactivation_fee
- id: hosting_backups
  subject:
  - hosting_backup_restore
  - hosting_service_charge
  rule: Backups run at the tier's backup_frequency and each restore point is kept for backup_retention_days. A restore
    point may be used only on or before the date of the backup restore point plus backup_retention_days calendar
    days. The window adds whole calendar days to the restore point date, counting the day after it as day 1, and
    the last day is included. Where self_service_restore is true the customer restores without a fee and a support-performed
    restore is also free, and where it is false restores are performed by support and billed backup_restore_fee
    each. A restore is performed only for a plan whose status is active, and restoring never changes billing or
    term dates.
  eligibility:
  - id: restore_point_retained
    applies_to:
    - hosting_backup_restore
    kind: time
    condition: A restore point may be used only on or before the date of the backup restore point plus backup_retention_days
      calendar days.
    evidence_fields:
    - hosting_events.restore_point_date
    - hosting_holdings.hosting_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_holdings.hosting_id
      action_bindings:
        hosting_holdings.hosting_id: hosting_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date of the backup restore point
      anchor_source: hosting_events.restore_point_date
      relation: not_after
      duration_source: variants.backup_retention_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the restore point date, counting the day after it as
        day 1, and the last day is included.
      boundary: inclusive
  params:
    per_tier:
      Harborline Starter:
        frequency: =backup_frequency
        retention: =backup_retention_days
        fee: =backup_restore_fee
      Harborline Plus:
        frequency: =backup_frequency
        retention: =backup_retention_days
        fee: =backup_restore_fee
      Harborline Pro:
        frequency: =backup_frequency
        retention: =backup_retention_days
        fee: =backup_restore_fee
      Harborline Business:
        frequency: =backup_frequency
        retention: =backup_retention_days
        fee: =backup_restore_fee
      Harborline Cloud 4:
        frequency: =backup_frequency
        retention: =backup_retention_days
        fee: =backup_restore_fee
      Harborline Cloud 8:
        frequency: =backup_frequency
        retention: =backup_retention_days
        fee: =backup_restore_fee
- id: hosting_sla_credits
  subject:
  - hosting_sla_credit
  - hosting_uptime_report
  rule: When a plan's measured uptime for a calendar month is below the tier's uptime_sla_pct, the customer may
    claim a service credit of sla_credit_pct_per_step of the monthly fee for each started 0.1 percentage point of
    shortfall, capped at sla_credit_cap_pct. The monthly fee is the amount of the line that paid the term covering
    that month divided by that line's term_months, before any credit. An uptime credit may be claimed only on or
    before the last day of the affected calendar month plus sla_claim_window_days calendar days. The window adds
    whole calendar days to the month's last day, counting the next day as day 1, and the last day is included. One
    credit is issued per plan per calendar month, it is added to account credit as a service credit, rounded half
    up to the cent, and it is never paid out to a card. Months in which the plan was suspended for any reason earn
    no credit.
  eligibility:
  - id: claim_window
    applies_to:
    - hosting_sla_credit
    kind: time
    condition: An uptime credit may be claimed only on or before the last day of the affected calendar month plus
      sla_claim_window_days calendar days.
    evidence_fields:
    - hosting_events.uptime_pct
    - hosting_events.hosting_event_id
    - hosting_events.uptime_month
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_events.hosting_event_id
      action_bindings:
        hosting_events.hosting_event_id: hosting_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the last day of the affected calendar month
      anchor_source: hosting_events.uptime_month
      relation: not_after
      duration_source: variants.sla_claim_window_days
      unit: calendar_days
      counting_rule: The window adds whole calendar days to the month's last day, counting the next day as day 1,
        and the last day is included.
      boundary: inclusive
  - id: one_credit_per_month
    applies_to:
    - hosting_sla_credit
    kind: dedup
    condition: One credit is issued per plan per calendar month, it is added to account credit as a service credit,
      rounded half up to the cent, and it is never paid out to a card.
    evidence_fields:
    - hosting_charges.hosting_id
    - hosting_charges.uptime_month
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hosting_charges.hosting_id
        - hosting_charges.uptime_month
      action_bindings:
        hosting_charges.hosting_id: hosting_id
        hosting_charges.uptime_month: uptime_month
    dedup_contract:
      table: hosting_charges
      mode: separate_record
      object_bindings:
        hosting_id: hosting_id
        uptime_month: uptime_month
      duplicate_filters:
        event_type:
        - hosting_sla_credit
      distinct_fields: []
  params:
    monthly_fee: amount of the line paying the covering term divided by its term_months
    started_steps: number of started 0.1 percentage points by which uptime_pct falls short of uptime_sla_pct
    per_tier:
      Harborline Starter:
        sla: =uptime_sla_pct
      Harborline Plus:
        sla: =uptime_sla_pct
      Harborline Pro:
        sla: =uptime_sla_pct
      Harborline Business:
        sla: =uptime_sla_pct
      Harborline Cloud 4:
        sla: =uptime_sla_pct
      Harborline Cloud 8:
        sla: =uptime_sla_pct
  formula:
    credit_amount: round(monthly_fee * min(sla_credit_cap_pct, sla_credit_pct_per_step * started_steps) / 100, 2)
- id: hosting_inclusions
  subject:
  - hosting_order
  - hosting_settings_update
  rule: Every domain hosted on any plan receives free automatically renewed domain-validated certificates where
    free_ssl_included is true, so a paid certificate under the ssl charter is optional and never required for HTTPS.
    A plan whose tier has free_domain_included and whose first term is at least free_domain_min_term_months carries
    one free first-year domain registration, used as the domain charter's domain_hosting_bundle states; a plan on
    a 1-month term never carries it, and the entitlement is never exchanged for credit or money. On tiers where
    malware_scan_included is true the site already has daily malware scanning, and a security plan bought for the
    same site under the security charter is priced as that charter states for hosted sites. Plan resources (max_websites,
    storage_gb, inode_limit, ram_gb, cpu_cores, entry_process_limit, php_workers, mysql_databases, mailboxes_included,
    staging_sites, ssh_access, dedicated_ip) apply from the moment the tier takes effect.
  eligibility: []
- id: hosting_provisioning
  subject:
  - hosting_activate
  - hosting_provision_fail
  rule: A paid order is provisioned within provisioning_deadline_hours elapsed hours of the order, and the plan
    becomes active on the date provisioning completes. An order that fails payment or fraud screening is never provisioned
    and is cancelled, and every purchase line of it, setup fee included, is refunded in full as a failed order to
    the original payment method. A plan provisioned later than its deadline is a Harborline service failure that
    the account charter's goodwill rule may recognise, and lateness never moves the term dates, which still count
    from the order date.
  eligibility: []
extended_policies:
- id: hosting_ext_overdue_renewal
  base_policy_refs:
  - hosting_renewal
  - hosting_downgrade_and_term_change
  overwrite:
  - base_policy: hosting_renewal
    superseded_clause: A renewal is billed at the regular rate of the tier and term length that the new term will have (renewal_rate_12mo,
      renewal_rate_24mo or renewal_rate_36mo times the months, or monthly_rate_no_commitment for a 1-month term, with no setup
      fee), less the account tier's hosting_discount_pct, rounded half up to the cent.
    replaced_by: This rule prices a renewal that the account holder pays at Harborline's checkout for a plan whose term end
      date is on or before today and which carries no scheduled downgrade request, and only such a renewal; a renewal that
      the account holder pays at Harborline's checkout for a plan whose term end date is later than today and which carries
      no scheduled downgrade or term change request is priced by the early renewal rule; every other renewal, which is an
      auto-renew charge, a renewal that applies a scheduled downgrade request, or a renewal paid at checkout while the term
      end date is later than today for a plan with a scheduled term change request, is billed at the regular rate of the tier
      and term length that the new term will have (renewal_rate_12mo, renewal_rate_24mo or renewal_rate_36mo times the months,
      or monthly_rate_no_commitment for a 1-month term, with no setup fee), less the account tier's hosting_discount_pct,
      rounded half up to the cent.
  trigger: state_due
  subject:
  - hosting_renewal_charge
  - hosting_term_renew
  computes: amount
  target_tool: bill_overdue_hosting_renewal_c53aa4e7
  params:
    mail_credit_large: 20.0
    mail_credit_small: 10.0
    mail_large_min_seats: 5
    cert_credit_ov_ev: 12.0
    cert_credit_dv: 6.0
    late_fee_free_days: 2
    late_fee_per_day: 3.5
    late_fee_pct: 5
    cycle_final_attempt: 3
  rule: 'This rule prices a renewal that the account holder pays at Harborline''s checkout for a plan whose term end date
    is on or before today and which carries no scheduled downgrade request, and only such a renewal; a renewal that the account
    holder pays at Harborline''s checkout for a plan whose term end date is later than today and which carries no scheduled
    downgrade or term change request is priced by the early renewal rule; every other renewal, which is an auto-renew charge,
    a renewal that applies a scheduled downgrade request, or a renewal paid at checkout while the term end date is later than
    today for a plan with a scheduled term change request, is billed at the regular rate of the tier and term length that
    the new term will have (renewal_rate_12mo, renewal_rate_24mo or renewal_rate_36mo times the months, or monthly_rate_no_commitment
    for a 1-month term, with no setup fee), less the account tier''s hosting_discount_pct, rounded half up to the cent. The
    overdue renewal is the account holder''s own payment, completed at Harborline''s checkout by card or through PayPal after
    the agent quotes the amount, because Harborline support never takes payment details; a payment from account credit is
    not taken under this rule. A renewal may be charged only while the plan status is active or suspended. The new term always
    starts on the previous term end date, even when the renewal is paid late. The overdue renewal amount is the plan tier''s
    regular price for the new term length: renewal_rate_12mo, renewal_rate_24mo or renewal_rate_36mo times the months of that
    term, or monthly_rate_no_commitment for a 1-month term, with no setup fee. The new term length is the current one (billing_term_months)
    unless a scheduled term change applies: a term change request in status scheduled sets the new term length to its target_term_months
    (the latest submitted one when there are several; withdrawn, declined and applied requests never count). The overdue renewal
    amount is rounded half up to the cent. The overdue renewal amount takes the reseller discount of the customer''s Harborline
    account tier on the date it is billed: an account on Harborline Reseller Platinum, Harborline Reseller Gold, Harborline
    Reseller Silver or Harborline Reseller Bronze takes that tier''s hosting_discount_pct under the account charter, and a
    Harborline Personal Account or Harborline Business Account takes no reseller discount; the percentage acts once on the
    regular price and the discounted price is rounded half up to the cent before any credit or fee is applied. The overdue
    renewal amount is reduced by a domain bundle credit for the Harborline domain registration in status active that names
    this plan as its bundled hosting plan, because Harborline credits one year of the bundled domain''s renewal against the
    hosting renewal (the domain itself is still billed under the domain charter): when the registration''s most recent domain
    renewal charge line is the only renewal charge line on its charge date, carries no refund and no restore charge line is
    dated later than it, the credit is that line''s amount divided by the years it renewed, as the domain charter billed it,
    rounded half up to the cent; any other active bundled registration (one still in its free first year with no renewal charge
    yet, one whose most recent renewal charge line was refunded, one restored from redemption after that line, or one with
    two or more renewal charge lines dated on that most recent charge date) is credited its TLD''s renewal_price; a plan with
    no active bundled registration receives no domain bundle credit, and a cancelled or deleted bundled registration never
    counts. The overdue renewal amount is reduced by a mail bundle credit when a Harborline email subscription in status active
    serves the plan''s primary domain: mail_credit_large when that subscription has at least mail_large_min_seats seats, mail_credit_small
    when it has fewer; a plan whose primary domain has no active Harborline email subscription receives no mail bundle credit.
    The overdue renewal amount is reduced by a certificate bundle credit when one or more Harborline certificate subscriptions
    in status active are installed on this plan: cert_credit_ov_ev when at least one of them is an OV or EV product, cert_credit_dv
    when all of them are DV products; a plan with no active Harborline certificate installed on it receives no certificate
    bundle credit. The overdue renewal amount carries a late renewal fee that depends on the whole calendar days from the
    term end date to today and on the plan''s declined auto-renew attempts: more than late_fee_free_days days late after a
    fully declined cycle (the plan carries at least cycle_final_attempt declined auto-renew attempts dated less than one calendar
    month before today) carries late_fee_per_day for each whole day past the term end date; more than late_fee_free_days days
    late without a fully declined cycle carries late_fee_pct percent of the regular price, rounded half up to the cent; late_fee_free_days
    days late or fewer carries no late renewal fee. Credits and fees are fixed amounts in USD that are never discounted: the
    overdue renewal amount is the discounted price less the credits plus any fee, rounded half up to the cent, and the credits
    together never take more than half of the discounted price.'
  prerequisite: []
  cross_category:
  - category: account
    as: branch
    reads:
    - variant_name
    note: The reseller discount tier of the overdue renewal is read from the customer's account tier.
  - category: domain
    as: branch
    reads:
    - domain_id
    - status
    - bundled_hosting_id
    - renewal_price
    - domain_charges.amount
    - domain_charges.years
    - domain_charges.charge_date
    - domain_charges.original_domain_charge_id
    note: The domain bundle credit is read from the active domain registration bundled with the plan.
  - category: email
    as: branch
    reads:
    - seat_count
    - status
    - email_domain
    note: The mail bundle credit is read from the active email subscription on the primary domain.
  - category: ssl
    as: branch
    reads:
    - validation_level
    - variant_name
    - status
    - hosting_id
    note: The certificate bundle credit is read from the active certificates installed on the plan.
  compute:
  - scheduled_term_request: LATEST('hosting_change_requests', 'target_term_months', date_field='submitted_at', request_type='term_change',
      request_status='scheduled')
  - new_term_months: (scheduled_term_request if scheduled_term_request != None else F('billing_term_months'))
  - regular_price: (P('monthly_rate_no_commitment') if new_term_months == 1 else (P('renewal_rate_12mo') * 12 if new_term_months
      == 12 else (P('renewal_rate_24mo') * 24 if new_term_months == 24 else P('renewal_rate_36mo') * 36)))
  - account_tier_name: CFIELD('account', 'variant_name')
  - overdue_reseller_pct: CPARAM('account', 'hosting_discount_pct') if account_tier_name == 'Harborline Reseller Platinum'
      else (CPARAM('account', 'hosting_discount_pct') if account_tier_name == 'Harborline Reseller Gold' else (CPARAM('account',
      'hosting_discount_pct') if account_tier_name == 'Harborline Reseller Silver' else (CPARAM('account', 'hosting_discount_pct')
      if account_tier_name == 'Harborline Reseller Bronze' else 0)))
  - overdue_discounted_price: RND(regular_price * (100 - overdue_reseller_pct) / 100, 2)
  - bundled_domain_id: CFIELD('domain', 'domain_id', bundled_hosting_id=HID, status='active')
  - bundled_last_renewal: XLATEST('domain', 'domain_charges', 'amount', date_field='charge_date', domain_id=bundled_domain_id,
      event_type='domain_renewal_charge')
  - bundled_list_renewal: CPARAM('domain', 'renewal_price', bundled_hosting_id=HID, status='active')
  - bundled_last_renewal_years: XLATEST('domain', 'domain_charges', 'years', date_field='charge_date', domain_id=bundled_domain_id,
      event_type='domain_renewal_charge')
  - bundled_last_renewal_ref: XLATEST('domain', 'domain_charges', 'domain_charge_id', date_field='charge_date', domain_id=bundled_domain_id,
      event_type='domain_renewal_charge')
  - bundled_last_renewal_date: XLATEST('domain', 'domain_charges', 'charge_date', date_field='charge_date', domain_id=bundled_domain_id,
      event_type='domain_renewal_charge')
  - bundled_renewal_refunds: XCOUNT('domain', 'domain_charges', domain_id=bundled_domain_id, event_type='domain_refund', original_domain_charge_id=bundled_last_renewal_ref)
  - bundled_last_restore_date: XLATEST('domain', 'domain_charges', 'charge_date', date_field='charge_date', domain_id=bundled_domain_id,
      event_type='domain_restore_charge')
  - bundled_same_day_renewals: XCOUNT('domain', 'domain_charges', domain_id=bundled_domain_id, event_type='domain_renewal_charge',
      charge_date=bundled_last_renewal_date)
  - bundled_renewal_line_counts: (bundled_last_renewal != None and bundled_same_day_renewals == 1 and bundled_renewal_refunds
      == 0 and (bundled_last_restore_date == None or bundled_last_restore_date <= bundled_last_renewal_date))
  - overdue_domain_credit: (RND(bundled_last_renewal / bundled_last_renewal_years, 2) if (bundled_domain_id != None and bundled_renewal_line_counts)
      else (bundled_list_renewal if bundled_domain_id != None else 0))
  - primary_mail_seats: CFIELD('email', 'seat_count', email_domain=F('primary_domain'), status='active')
  - overdue_mail_credit: (K('mail_credit_large') if (primary_mail_seats != None and primary_mail_seats >= K('mail_large_min_seats'))
      else (K('mail_credit_small') if (primary_mail_seats != None and primary_mail_seats < K('mail_large_min_seats')) else
      0))
  - ov_ev_cert_installed: EXISTS('ssl', hosting_id=HID, status='active', variant_name='Harborline OV Single Domain') or EXISTS('ssl',
      hosting_id=HID, status='active', variant_name='Harborline OV Wildcard') or EXISTS('ssl', hosting_id=HID, status='active',
      variant_name='Harborline EV Single Domain') or EXISTS('ssl', hosting_id=HID, status='active', variant_name='Harborline
      EV Multi-Domain')
  - installed_cert_level: CPARAM('ssl', 'validation_level', hosting_id=HID, status='active')
  - overdue_cert_credit: (K('cert_credit_ov_ev') if ov_ev_cert_installed else (K('cert_credit_dv') if installed_cert_level
      == 'dv' else 0))
  - days_past_term_end: DAYS(F('term_end_date'), NOW)
  - recent_declined_attempts: COUNT('hosting_events', within_months=1, date_field='event_at', event_type='hosting_renewal_decline')
  - overdue_late_fee: (K('late_fee_per_day') * days_past_term_end if (days_past_term_end > K('late_fee_free_days') and recent_declined_attempts
      >= K('cycle_final_attempt')) else (RND(regular_price * K('late_fee_pct') / 100, 2) if (days_past_term_end > K('late_fee_free_days')
      and recent_declined_attempts < K('cycle_final_attempt')) else 0))
  - overdue_credits_total: overdue_domain_credit + overdue_mail_credit + overdue_cert_credit
  - result: RND(overdue_discounted_price - MN(overdue_credits_total, overdue_discounted_price / 2) + overdue_late_fee, 2)
  compute_basis:
    scheduled_term_request: a term change request in status scheduled sets the new term length to its target_term_months (the
      latest submitted one when there are several; withdrawn, declined and applied requests never count).
    new_term_months: The new term length is the current one (billing_term_months) unless a scheduled term change applies
    regular_price: 'The overdue renewal amount is the plan tier''s regular price for the new term length: renewal_rate_12mo,
      renewal_rate_24mo or renewal_rate_36mo times the months of that term, or monthly_rate_no_commitment for a 1-month term,
      with no setup fee.'
    account_tier_name: takes the reseller discount of the customer's Harborline account tier on the date it is billed
    overdue_reseller_pct: an account on Harborline Reseller Platinum, Harborline Reseller Gold, Harborline Reseller Silver
      or Harborline Reseller Bronze takes that tier's hosting_discount_pct under the account charter, and a Harborline Personal
      Account or Harborline Business Account takes no reseller discount
    overdue_discounted_price: the percentage acts once on the regular price and the discounted price is rounded half up to
      the cent before any credit or fee is applied.
    bundled_domain_id: the Harborline domain registration in status active that names this plan as its bundled hosting plan
    bundled_last_renewal: the registration's most recent domain renewal charge line
    bundled_last_renewal_years: that line's amount divided by the years it renewed
    bundled_last_renewal_ref: carries no refund
    bundled_last_renewal_date: no restore charge line is dated later than it
    bundled_renewal_refunds: one whose most recent renewal charge line was refunded
    bundled_last_restore_date: one restored from redemption after that line
    bundled_same_day_renewals: is the only renewal charge line on its charge date
    bundled_renewal_line_counts: when the registration's most recent domain renewal charge line is the only renewal charge
      line on its charge date, carries no refund and no restore charge line is dated later than it
    bundled_list_renewal: is credited its TLD's renewal_price
    overdue_domain_credit: the credit is that line's amount divided by the years it renewed, as the domain charter billed
      it, rounded half up to the cent; any other active bundled registration (one still in its free first year with no renewal
      charge yet, one whose most recent renewal charge line was refunded, one restored from redemption after that line, or
      one with two or more renewal charge lines dated on that most recent charge date) is credited its TLD's renewal_price;
      a plan with no active bundled registration receives no domain bundle credit, and a cancelled or deleted bundled registration
      never counts.
    primary_mail_seats: a Harborline email subscription in status active serves the plan's primary domain
    overdue_mail_credit: mail_credit_large when that subscription has at least mail_large_min_seats seats, mail_credit_small
      when it has fewer; a plan whose primary domain has no active Harborline email subscription receives no mail bundle credit.
    ov_ev_cert_installed: cert_credit_ov_ev when at least one of them is an OV or EV product
    installed_cert_level: cert_credit_dv when all of them are DV products
    overdue_cert_credit: 'The overdue renewal amount is reduced by a certificate bundle credit when one or more Harborline
      certificate subscriptions in status active are installed on this plan: cert_credit_ov_ev when at least one of them is
      an OV or EV product, cert_credit_dv when all of them are DV products; a plan with no active Harborline certificate installed
      on it receives no certificate bundle credit.'
    days_past_term_end: the whole calendar days from the term end date to today
    recent_declined_attempts: the plan carries at least cycle_final_attempt declined auto-renew attempts dated less than one
      calendar month before today
    overdue_late_fee: more than late_fee_free_days days late after a fully declined cycle (the plan carries at least cycle_final_attempt
      declined auto-renew attempts dated less than one calendar month before today) carries late_fee_per_day for each whole
      day past the term end date; more than late_fee_free_days days late without a fully declined cycle carries late_fee_pct
      percent of the regular price, rounded half up to the cent; late_fee_free_days days late or fewer carries no late renewal
      fee.
    overdue_credits_total: the overdue renewal amount is the discounted price less the credits plus any fee
    result: 'Credits and fees are fixed amounts in USD that are never discounted: the overdue renewal amount is the discounted
      price less the credits plus any fee, rounded half up to the cent, and the credits together never take more than half
      of the discounted price.'
  factors:
  - id: ovr_reseller_pct
    effect: parameter
    decides: overdue_reseller_pct
    bindings:
    - account_tier_name
    - overdue_reseller_pct
    ladder:
    - when: the account tier is Harborline Reseller Platinum
      value: CPARAM('account','hosting_discount_pct') of Harborline Reseller Platinum
    - when: the account tier is Harborline Reseller Gold
      value: CPARAM('account','hosting_discount_pct') of Harborline Reseller Gold
    - when: the account tier is Harborline Reseller Silver
      value: CPARAM('account','hosting_discount_pct') of Harborline Reseller Silver
    - when: the account tier is Harborline Reseller Bronze
      value: CPARAM('account','hosting_discount_pct') of Harborline Reseller Bronze
    - when: otherwise (Harborline Personal Account or Harborline Business Account)
      value: '0'
    baseline:
      overdue_reseller_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: account
  - id: ovr_domain_bundle
    effect: method
    decides: overdue_domain_credit
    bindings:
    - bundled_domain_id
    - bundled_last_renewal
    - bundled_last_renewal_years
    - bundled_last_renewal_ref
    - bundled_last_renewal_date
    - bundled_renewal_refunds
    - bundled_last_restore_date
    - bundled_same_day_renewals
    - bundled_renewal_line_counts
    - bundled_list_renewal
    - overdue_domain_credit
    ladder:
    - when: an active bundled domain registration whose most recent renewal charge line is alone on its date, carries no refund
        and no later restore line
      method: that line's amount divided by the years it renewed, rounded half up to the cent
    - when: any other active bundled domain registration (free first year, refunded latest renewal, restored after it, or
        two renewal lines on the latest date)
      method: its TLD's renewal_price
    - when: otherwise (no active bundled registration)
      method: no domain bundle credit
    baseline:
      overdue_domain_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: domain
  - id: ovr_mail_bundle
    effect: parameter
    decides: overdue_mail_credit
    bindings:
    - primary_mail_seats
    - overdue_mail_credit
    ladder:
    - when: an active Harborline email subscription on the primary domain has at least mail_large_min_seats seats
      value: K('mail_credit_large')
    - when: an active Harborline email subscription on the primary domain has fewer than mail_large_min_seats seats
      value: K('mail_credit_small')
    - when: otherwise (no active Harborline email subscription on the primary domain)
      value: '0'
    baseline:
      overdue_mail_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: email
  - id: ovr_cert_bundle
    effect: parameter
    decides: overdue_cert_credit
    bindings:
    - ov_ev_cert_installed
    - installed_cert_level
    - overdue_cert_credit
    ladder:
    - when: at least one active Harborline OV or EV certificate is installed on the plan
      value: K('cert_credit_ov_ev')
    - when: the active Harborline certificates installed on the plan are all DV
      value: K('cert_credit_dv')
    - when: otherwise (no active Harborline certificate installed on the plan)
      value: '0'
    baseline:
      overdue_cert_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: ssl
  - id: ovr_late_fee
    effect: method
    decides: overdue_late_fee
    bindings:
    - days_past_term_end
    - recent_declined_attempts
    - overdue_late_fee
    ladder:
    - when: more than late_fee_free_days days past the term end date and a fully declined cycle
      method: late_fee_per_day times the whole days past the term end date
    - when: more than late_fee_free_days days past the term end date and no fully declined cycle
      method: late_fee_pct percent of the regular price, rounded half up to the cent
    - when: otherwise (late_fee_free_days days or fewer past the term end date)
      method: no late renewal fee
    baseline:
      overdue_late_fee: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: 'The overdue renewal amount is the plan tier''s regular price for the new term length: renewal_rate_12mo, renewal_rate_24mo
      or renewal_rate_36mo times the months of that term, or monthly_rate_no_commitment for a 1-month term, with no setup
      fee. The new term length is the current one (billing_term_months) unless a scheduled term change applies: a term change
      request in status scheduled sets the new term length to its target_term_months (the latest submitted one when there
      are several; withdrawn, declined and applied requests never count). The overdue renewal amount is rounded half up to
      the cent.'
    params:
    - renewal_rate_12mo
    - renewal_rate_24mo
    - renewal_rate_36mo
    - monthly_rate_no_commitment
  inputs:
    history:
    - table: hosting_change_requests
      aggregate: latest
      field: target_term_months
      filters:
        request_type: term_change
        request_status: scheduled
    - table: hosting_events
      aggregate: count
      within_months: 1
      filters:
        event_type: hosting_renewal_decline
    - category: domain
      table: domain_charges
      aggregate: latest
      field: amount
      filters:
        event_type: domain_renewal_charge
    cross_category:
    - account
    - domain
    - email
    - ssl
- id: hosting_ext_cloud_upgrade
  base_policy_refs:
  - hosting_upgrade_proration
  overwrite:
  - base_policy: hosting_upgrade_proration
    superseded_clause: The upgrade charge is the new term price minus the amount paid for the current term, times the remaining
      days divided by the term days, rounded half up to the cent and never below zero.
    replaced_by: This rule prices the upgrade of a Harborline Cloud 4 plan to Harborline Cloud 8, and only such an upgrade;
      every other upgrade charge is the new term price minus the amount paid for the current term, times the remaining days
      divided by the term days, rounded half up to the cent and never below zero.
  - base_policy: hosting_upgrade_proration
    superseded_clause: 'The new term price is the target tier''s rate for the current term length times its months, less the
      account tier''s hosting_discount_pct: the target''s introductory rate when the current term is the first term, otherwise
      its regular rate, and monthly_rate_no_commitment for a 1-month term.'
    replaced_by: 'For every upgrade other than the Cloud 4 to Cloud 8 upgrade this rule prices, the new term price is the
      target tier''s rate for the current term length times its months, less the account tier''s hosting_discount_pct, as
      the hosting upgrade rule and its new_term_price parameter state: the target''s introductory rate when the current term
      is the first term, otherwise its regular rate, and monthly_rate_no_commitment for a 1-month term; for the Cloud 4 to
      Cloud 8 upgrade this rule prices, the Cloud 8 term price takes no account tier discount and its new_term_price parameter
      description does not apply, because the account charter never applies a tier discount to proration lines.'
  trigger: on_request
  subject:
  - hosting_upgrade_charge
  - hosting_upgrade
  computes: amount
  target_tool: buy_hosting_upgrade_8645a072
  params:
    c8_monthly: 104.99
    c8_intro_12: 44.99
    c8_intro_24: 39.99
    c8_intro_36: 34.99
    c8_regular_12: 89.99
    c8_regular_24: 79.99
    c8_regular_36: 69.99
    outgrown_credit_over_limit: 40.0
    outgrown_credit_warning: 20.0
    first_upgrade_credit: 25.0
    returning_upgrade_credit: 10.0
    mail_credit_large: 20.0
    mail_credit_small: 10.0
    mail_large_min_seats: 5
  rule: 'This rule prices the upgrade of a Harborline Cloud 4 plan to Harborline Cloud 8, and only such an upgrade; every
    other upgrade charge is the new term price minus the amount paid for the current term, times the remaining days divided
    by the term days, rounded half up to the cent and never below zero. The upgrade is the account holder''s own purchase,
    completed at Harborline''s checkout by card or through PayPal after the agent quotes the amount, because Harborline support
    never takes payment details; a payment from account credit is not taken under this rule. An upgrade may be charged only
    while the plan status is active, it takes effect immediately without changing the term dates, the money-back period or
    the first-term flag, and the next renewal is billed at the upgraded tier''s regular rates. An upgrade charge is fixed
    only after the plan''s term end date is later than today. The Cloud 8 upgrade charge is the Cloud 8 term price minus the
    amount paid for the current term, times the remaining days divided by the term days, rounded half up to the cent and never
    below zero. The Cloud 8 term price is Harborline Cloud 8''s rate for the plan''s current term length times its months:
    its introductory rate (c8_intro_12, c8_intro_24 or c8_intro_36, the Cloud 8 tier parameters intro_rate_12mo, intro_rate_24mo
    and intro_rate_36mo) when the current term is the plan''s first term, which is the case when the line that paid the current
    term is the plan''s initial_term line, otherwise its regular rate (c8_regular_12, c8_regular_24 or c8_regular_36, the
    Cloud 8 tier parameters renewal_rate_12mo, renewal_rate_24mo and renewal_rate_36mo), and c8_monthly (its monthly_rate_no_commitment)
    once for a 1-month term. The amount paid for the current term is the amount of the renewal line paid at checkout (charge_type
    renewal) whose period_start equals the plan''s term start date, or, when there is none, of the auto_renew line with that
    period_start, or, when there is neither, of the plan''s initial_term line with that period_start (a refunded line is always
    an auto_renew line, because a renewal the customer paid manually is never refundable), plus any earlier upgrade_proration
    lines whose period_end equals the plan''s term end date. Remaining days are the calendar days from today to the term end
    date, and term days are the calendar days from the term start date to the term end date. For every upgrade other than
    the Cloud 4 to Cloud 8 upgrade this rule prices, the new term price is the target tier''s rate for the current term length
    times its months, less the account tier''s hosting_discount_pct, as the hosting upgrade rule and its new_term_price parameter
    state: the target''s introductory rate when the current term is the first term, otherwise its regular rate, and monthly_rate_no_commitment
    for a 1-month term; for the Cloud 4 to Cloud 8 upgrade this rule prices, the Cloud 8 term price takes no account tier
    discount and its new_term_price parameter description does not apply, because the account charter never applies a tier
    discount to proration lines. The Cloud 8 upgrade charge is reduced by a mail bundle credit when a Harborline email subscription
    in status active serves the plan''s primary domain: mail_credit_large when that subscription has at least mail_large_min_seats
    seats, mail_credit_small when it has fewer; a plan whose primary domain has no active Harborline email subscription receives
    no mail bundle credit. The share of the Cloud 8 upgrade charge that is billed depends on the plan''s current term length:
    on a 24 or 36-month term with at least one whole calendar month remaining it is the whole calendar months remaining from
    today to the term end date (a month counts only once its day of the month is reached) divided by the months of the term;
    on a 1-month term it is the whole price difference, with no proration; on every other term, including a 24 or 36-month
    term in its last month, it is the remaining days divided by the term days. The Cloud 8 upgrade charge is reduced by an
    outgrown-plan credit when the plan has received resource notices dated less than one calendar month before today: outgrown_credit_over_limit
    when at least one of them is an over_limit notice, outgrown_credit_warning when there are warning notices and no over_limit
    notice, and no credit when there are none. The Cloud 8 upgrade charge is reduced by Harborline''s first-upgrade welcome
    credit, decided by the upgrade_proration lines on the plan''s billing history: a plan with no upgrade_proration line at
    all receives first_upgrade_credit; a plan whose upgrade_proration lines all belong to earlier terms (none ends on the
    plan''s current term end date) receives returning_upgrade_credit; a plan that already has an upgrade_proration line in
    its current term receives no welcome credit. Credits are fixed amounts in USD that are never discounted: the Cloud 8 upgrade
    charge is the prorated charge less the credits, rounded half up to the cent, and the credits together never take more
    than half of the prorated charge.'
  prerequisite:
  - problem: hosting_ext_overdue_renewal
    kind: value_input
    gate: prorated_upgrade_share
    form: state
    policy_source: An upgrade charge is fixed only after the plan's term end date is later than today.
    condition: hosting_holdings.term_end_date of the plan is later than the date of today, which holds once the renewal line
      for the term starting on the previous term end date is billed and the term dates have advanced.
    resolved_by: bill_overdue_hosting_renewal_c53aa4e7
    effect: Once the overdue renewal is billed, the plan term start and end dates advance to the renewed term and the renewal
      line becomes the amount paid for the current term, so the remaining share of the term and the prorated upgrade charge
      take their handling-time values.
  cross_category:
  - category: email
    as: branch
    reads:
    - seat_count
    - status
    - email_domain
    note: The mail bundle credit is read from the active email subscription on the primary domain.
  compute:
  - upgrade_term_months: F('billing_term_months')
  - checkout_renewal_line: LATEST('hosting_charges', 'amount', date_field='charge_date', event_type='hosting_renewal_charge',
      charge_type='renewal', period_start=F('term_start_date'))
  - auto_renew_line: LATEST('hosting_charges', 'amount', date_field='charge_date', event_type='hosting_renewal_charge', charge_type='auto_renew',
      period_start=F('term_start_date'))
  - initial_line: LATEST('hosting_charges', 'amount', date_field='charge_date', event_type='hosting_term_charge', charge_type='initial_term',
      period_start=F('term_start_date'))
  - paying_line_amount: (checkout_renewal_line if checkout_renewal_line != None else (auto_renew_line if auto_renew_line !=
      None else (initial_line if initial_line != None else 0)))
  - earlier_upgrade_lines: SUM('hosting_charges', 'amount', event_type='hosting_upgrade_charge', period_end=F('term_end_date'))
  - paid_for_current_term: paying_line_amount + earlier_upgrade_lines
  - current_term_is_first: (checkout_renewal_line == None and auto_renew_line == None and initial_line != None)
  - cloud8_term_list_price: (K('c8_monthly') if upgrade_term_months == 1 else ((K('c8_intro_12') * 12 if upgrade_term_months
      == 12 else (K('c8_intro_24') * 24 if upgrade_term_months == 24 else K('c8_intro_36') * 36)) if current_term_is_first
      else (K('c8_regular_12') * 12 if upgrade_term_months == 12 else (K('c8_regular_24') * 24 if upgrade_term_months == 24
      else K('c8_regular_36') * 36))))
  - cloud8_term_price: RND(cloud8_term_list_price, 2)
  - remaining_term_days: DAYS(NOW, F('term_end_date'))
  - whole_term_days: DAYS(F('term_start_date'), F('term_end_date'))
  - remaining_whole_months: MONTHS(NOW, F('term_end_date'))
  - prorated_upgrade_share: (remaining_whole_months / upgrade_term_months if ((upgrade_term_months == 24 or upgrade_term_months
      == 36) and remaining_whole_months >= 1) else (1 if upgrade_term_months == 1 else remaining_term_days / whole_term_days))
  - prorated_upgrade_charge: RND(MX(0, (cloud8_term_price - paid_for_current_term) * prorated_upgrade_share), 2)
  - over_limit_notices: COUNT('hosting_events', within_months=1, date_field='event_at', event_type='hosting_resource_notice',
      notice_level='over_limit')
  - warning_notices: COUNT('hosting_events', within_months=1, date_field='event_at', event_type='hosting_resource_notice',
      notice_level='warning')
  - outgrown_plan_credit: (K('outgrown_credit_over_limit') if over_limit_notices > 0 else (K('outgrown_credit_warning') if
      (warning_notices > 0 and over_limit_notices == 0) else 0))
  - all_upgrade_lines: COUNT('hosting_charges', event_type='hosting_upgrade_charge')
  - current_term_upgrade_lines: COUNT('hosting_charges', event_type='hosting_upgrade_charge', period_end=F('term_end_date'))
  - welcome_upgrade_credit: (K('first_upgrade_credit') if all_upgrade_lines == 0 else (K('returning_upgrade_credit') if (all_upgrade_lines
      > 0 and current_term_upgrade_lines == 0) else 0))
  - upgrade_mail_seats: CFIELD('email', 'seat_count', email_domain=F('primary_domain'), status='active')
  - upgrade_mail_credit: (K('mail_credit_large') if (upgrade_mail_seats != None and upgrade_mail_seats >= K('mail_large_min_seats'))
      else (K('mail_credit_small') if (upgrade_mail_seats != None and upgrade_mail_seats < K('mail_large_min_seats')) else
      0))
  - upgrade_credits_total: outgrown_plan_credit + welcome_upgrade_credit + upgrade_mail_credit
  - result: RND(prorated_upgrade_charge - MN(upgrade_credits_total, prorated_upgrade_charge / 2), 2)
  compute_basis:
    upgrade_term_months: Harborline Cloud 8's rate for the plan's current term length times its months
    checkout_renewal_line: the renewal line paid at checkout (charge_type renewal) whose period_start equals the plan's term
      start date
    auto_renew_line: or, when there is none, of the auto_renew line with that period_start
    initial_line: or, when there is neither, of the plan's initial_term line with that period_start
    paying_line_amount: (a refunded line is always an auto_renew line, because a renewal the customer paid manually is never
      refundable)
    earlier_upgrade_lines: plus any earlier upgrade_proration lines whose period_end equals the plan's term end date.
    paid_for_current_term: The amount paid for the current term is the amount of the renewal line paid at checkout (charge_type
      renewal) whose period_start equals the plan's term start date, or, when there is none, of the auto_renew line with that
      period_start, or, when there is neither, of the plan's initial_term line with that period_start (a refunded line is
      always an auto_renew line, because a renewal the customer paid manually is never refundable), plus any earlier upgrade_proration
      lines whose period_end equals the plan's term end date.
    current_term_is_first: when the current term is the plan's first term, which is the case when the line that paid the current
      term is the plan's initial_term line
    cloud8_term_list_price: 'The Cloud 8 term price is Harborline Cloud 8''s rate for the plan''s current term length times
      its months: its introductory rate (c8_intro_12, c8_intro_24 or c8_intro_36, the Cloud 8 tier parameters intro_rate_12mo,
      intro_rate_24mo and intro_rate_36mo) when the current term is the plan''s first term, which is the case when the line
      that paid the current term is the plan''s initial_term line, otherwise its regular rate (c8_regular_12, c8_regular_24
      or c8_regular_36, the Cloud 8 tier parameters renewal_rate_12mo, renewal_rate_24mo and renewal_rate_36mo), and c8_monthly
      (its monthly_rate_no_commitment) once for a 1-month term.'
    cloud8_term_price: the Cloud 8 term price takes no account tier discount and its new_term_price parameter description
      does not apply, because the account charter never applies a tier discount to proration lines.
    remaining_term_days: Remaining days are the calendar days from today to the term end date
    whole_term_days: term days are the calendar days from the term start date to the term end date.
    remaining_whole_months: the whole calendar months remaining from today to the term end date (a month counts only once
      its day of the month is reached)
    prorated_upgrade_share: 'The share of the Cloud 8 upgrade charge that is billed depends on the plan''s current term length:
      on a 24 or 36-month term with at least one whole calendar month remaining it is the whole calendar months remaining
      from today to the term end date (a month counts only once its day of the month is reached) divided by the months of
      the term; on a 1-month term it is the whole price difference, with no proration; on every other term, including a 24
      or 36-month term in its last month, it is the remaining days divided by the term days.'
    prorated_upgrade_charge: The Cloud 8 upgrade charge is the Cloud 8 term price minus the amount paid for the current term,
      times the remaining days divided by the term days, rounded half up to the cent and never below zero.
    over_limit_notices: when at least one of them is an over_limit notice
    warning_notices: when there are warning notices and no over_limit notice
    outgrown_plan_credit: 'The Cloud 8 upgrade charge is reduced by an outgrown-plan credit when the plan has received resource
      notices dated less than one calendar month before today: outgrown_credit_over_limit when at least one of them is an
      over_limit notice, outgrown_credit_warning when there are warning notices and no over_limit notice, and no credit when
      there are none.'
    all_upgrade_lines: a plan with no upgrade_proration line at all receives first_upgrade_credit
    current_term_upgrade_lines: a plan whose upgrade_proration lines all belong to earlier terms (none ends on the plan's
      current term end date) receives returning_upgrade_credit
    welcome_upgrade_credit: a plan with no upgrade_proration line at all receives first_upgrade_credit; a plan whose upgrade_proration
      lines all belong to earlier terms (none ends on the plan's current term end date) receives returning_upgrade_credit;
      a plan that already has an upgrade_proration line in its current term receives no welcome credit.
    upgrade_credits_total: the Cloud 8 upgrade charge is the prorated charge less the credits
    upgrade_mail_seats: a Harborline email subscription in status active serves the plan's primary domain
    upgrade_mail_credit: mail_credit_large when that subscription has at least mail_large_min_seats seats, mail_credit_small
      when it has fewer; a plan whose primary domain has no active Harborline email subscription receives no mail bundle credit.
    result: 'Credits are fixed amounts in USD that are never discounted: the Cloud 8 upgrade charge is the prorated charge
      less the credits, rounded half up to the cent, and the credits together never take more than half of the prorated charge.'
  factors:
  - id: upg_proration_unit
    effect: method
    decides: prorated_upgrade_share
    bindings:
    - remaining_whole_months
    - prorated_upgrade_share
    ladder:
    - when: the plan's current term is 24 or 36 months with at least one whole calendar month remaining
      method: whole calendar months remaining from today to the term end date divided by the months of the term
    - when: the plan's current term is 1 month
      method: the whole price difference, with no proration
    - when: otherwise (a 12-month term, or a 24 or 36-month term in its last month)
      method: remaining calendar days divided by the term days
    baseline:
      prorated_upgrade_share: remaining_term_days / whole_term_days
    evidence:
    - date
    cross_difficulty: null
  - id: upg_outgrown_credit
    effect: parameter
    decides: outgrown_plan_credit
    bindings:
    - over_limit_notices
    - warning_notices
    - outgrown_plan_credit
    ladder:
    - when: at least one over_limit resource notice dated less than one calendar month before today
      value: K('outgrown_credit_over_limit')
    - when: warning resource notices and no over_limit notice dated less than one calendar month before today
      value: K('outgrown_credit_warning')
    - when: otherwise (no resource notice in that month)
      value: '0'
    baseline:
      outgrown_plan_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: upg_welcome_credit
    effect: parameter
    decides: welcome_upgrade_credit
    bindings:
    - all_upgrade_lines
    - current_term_upgrade_lines
    - welcome_upgrade_credit
    ladder:
    - when: no upgrade_proration line on the plan at all
      value: K('first_upgrade_credit')
    - when: upgrade_proration lines only in earlier terms (none ends on the current term end date)
      value: K('returning_upgrade_credit')
    - when: otherwise (an upgrade_proration line already in the current term)
      value: '0'
    baseline:
      welcome_upgrade_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: upg_mail_bundle
    effect: parameter
    decides: upgrade_mail_credit
    bindings:
    - upgrade_mail_seats
    - upgrade_mail_credit
    ladder:
    - when: an active Harborline email subscription on the primary domain has at least mail_large_min_seats seats
      value: K('mail_credit_large')
    - when: an active Harborline email subscription on the primary domain has fewer than mail_large_min_seats seats
      value: K('mail_credit_small')
    - when: otherwise (no active Harborline email subscription on the primary domain)
      value: '0'
    baseline:
      upgrade_mail_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: email
  baseline:
    rule: 'The Cloud 8 upgrade charge is the Cloud 8 term price minus the amount paid for the current term, times the remaining
      days divided by the term days, rounded half up to the cent and never below zero. The Cloud 8 term price is Harborline
      Cloud 8''s rate for the plan''s current term length times its months: its introductory rate (c8_intro_12, c8_intro_24
      or c8_intro_36, the Cloud 8 tier parameters intro_rate_12mo, intro_rate_24mo and intro_rate_36mo) when the current term
      is the plan''s first term, which is the case when the line that paid the current term is the plan''s initial_term line,
      otherwise its regular rate (c8_regular_12, c8_regular_24 or c8_regular_36, the Cloud 8 tier parameters renewal_rate_12mo,
      renewal_rate_24mo and renewal_rate_36mo), and c8_monthly (its monthly_rate_no_commitment) once for a 1-month term. The
      amount paid for the current term is the amount of the renewal line paid at checkout (charge_type renewal) whose period_start
      equals the plan''s term start date, or, when there is none, of the auto_renew line with that period_start, or, when
      there is neither, of the plan''s initial_term line with that period_start (a refunded line is always an auto_renew line,
      because a renewal the customer paid manually is never refundable), plus any earlier upgrade_proration lines whose period_end
      equals the plan''s term end date. Remaining days are the calendar days from today to the term end date, and term days
      are the calendar days from the term start date to the term end date.'
    params:
    - c8_monthly
    - c8_intro_12
    - c8_intro_24
    - c8_intro_36
    - c8_regular_12
    - c8_regular_24
    - c8_regular_36
  inputs:
    history:
    - table: hosting_charges
      aggregate: latest
      field: amount
      filters:
        event_type: hosting_renewal_charge
    - table: hosting_charges
      aggregate: sum
      field: amount
      filters:
        event_type: hosting_upgrade_charge
    - table: hosting_events
      aggregate: count
      within_months: 1
      filters:
        event_type: hosting_resource_notice
    - table: hosting_charges
      aggregate: count
      filters:
        event_type: hosting_upgrade_charge
    cross_category:
    - email
- id: hosting_ext_auto_renew_refund
  base_policy_refs:
  - hosting_auto_renew_refund
  - hosting_money_back
  - hosting_agg_money_back_limit
  overwrite:
  - base_policy: hosting_auto_renew_refund
    superseded_clause: An auto-renew charge for a term of 12 months or longer may be refunded in full only on or before the
      charge date of the auto-renew charge plus auto_renew_refund_days calendar days.
    replaced_by: An auto-renew charge for a term of 12 months or longer may be refunded only on or before the charge date
      of the auto-renew charge plus auto_renew_refund_days calendar days; a refund this rule books, of a line paid by card
      or through PayPal returned to that payment method, is the charge less the keep-backs this rule lists, while the refund
      of a line paid from account credit, or one the customer elects to take as account credit, is refunded in full and goes
      to account credit as the base auto-renew refund rule states.
  - base_policy: hosting_money_back
    superseded_clause: A money-back refund is given only for an immediate cancellation made on or before the plan's opening
      date plus money_back_days calendar days.
    replaced_by: 'A money-back refund is given only for an immediate cancellation made on or before the plan''s opening date
      plus money_back_days calendar days, and that window, like the rule that a money-back refund may be given only while
      hosting_msr_money_back_365d is below money_back_per_customer_365d, binds only refunds given under the money-back guarantee:
      an auto-renew refund is neither held to the money-back window nor counted in or limited by that measure.'
  - base_policy: hosting_agg_money_back_limit
    superseded_clause: A money-back refund may be given only while hosting_msr_money_back_365d is below money_back_per_customer_365d.
    replaced_by: 'A money-back refund is given only for an immediate cancellation made on or before the plan''s opening date
      plus money_back_days calendar days, and that window, like the rule that a money-back refund may be given only while
      hosting_msr_money_back_365d is below money_back_per_customer_365d, binds only refunds given under the money-back guarantee:
      an auto-renew refund is neither held to the money-back window nor counted in or limited by that measure.'
  trigger: on_request
  subject:
  - hosting_refund
  - hosting_term_rollback
  computes: amount
  target_tool: refund_hosting_auto_renewal_84b3efde
  params:
    card_fee_pct: 2.9
    paypal_fee_pct: 3.49
    refund_fee_free_days: 3
    refund_fee_mid_days: 9
    refund_fee_mid: 9.0
    refund_fee_late: 19.0
    term_change_reversal_fee: 15.0
    downgrade_reversal_fee: 10.0
  rule: 'An auto-renew charge for a term of 12 months or longer may be refunded only on or before the charge date of the auto-renew
    charge plus auto_renew_refund_days calendar days; a refund this rule books, of a line paid by card or through PayPal returned
    to that payment method, is the charge less the keep-backs this rule lists, while the refund of a line paid from account
    credit, or one the customer elects to take as account credit, is refunded in full and goes to account credit as the base
    auto-renew refund rule states. The window adds whole calendar days to the charge date, counting the day after it as day
    1, and the last day is included. A 1-month renewal (monthly_renewal_refundable) and a renewal the customer paid manually
    are not refundable. Refunding the auto-renew charge rolls the plan back to the term paid before it, meaning that term''s
    start date, end date and billing term length, with auto-renew switched off, and when that earlier term end date has already
    passed, the plan''s scheduled cancellation takes effect at once. A money-back refund is given only for an immediate cancellation
    made on or before the plan''s opening date plus money_back_days calendar days, and that window, like the rule that a money-back
    refund may be given only while hosting_msr_money_back_365d is below money_back_per_customer_365d, binds only refunds given
    under the money-back guarantee: an auto-renew refund is neither held to the money-back window nor counted in or limited
    by that measure. The refund goes to refund_destination_default, or to account credit when the customer elects it or the
    charge was paid from credit. Each refunded charge line may be refunded only once. This rule books the refund of an auto-renew
    line paid by card or through PayPal that goes back to that payment method (refund_destination_default), and only such
    a refund; a refund the customer elects to take as account credit, and the refund of a line paid from account credit, goes
    to account credit as stated above and is credited under the account charter''s refund-credit rule, not booked under this
    rule. The charge refunded is the plan''s most recent auto_renew line. The auto-renew refund amount is the full amount
    of that line, rounded half up to the cent. The auto-renew refund amount keeps back the payment processor''s fee on the
    charge, a percentage of the line amount set by how the refunded line was paid and when it is refunded: card_fee_pct percent
    for a line paid by card and refunded after its charge date, paypal_fee_pct percent for a line paid through PayPal and
    refunded after its charge date, and nothing for a line refunded on its own charge date, when the payment is voided before
    it settles; the kept-back fee is rounded half up to the cent. The auto-renew refund amount keeps back a handling fee that
    depends on the whole calendar days from the refunded line''s charge date to today: refund_fee_free_days days or fewer
    keeps back nothing; more than refund_fee_free_days and up to refund_fee_mid_days days keeps back refund_fee_mid; more
    than refund_fee_mid_days days keeps back refund_fee_late. The auto-renew refund amount keeps back a reversal fee when
    the refunded line applied a change the customer had scheduled: a change request of type term_change in status applied
    whose effective date equals the refunded line''s period_start keeps back term_change_reversal_fee; otherwise a change
    request of type downgrade in status applied with that effective date keeps back downgrade_reversal_fee; a refunded line
    that applied no scheduled change keeps back no reversal fee. The auto-renew refund amount keeps back a multi-year commitment
    share decided by the months the refunded line covered: a 36-month line keeps back one month at the tier''s monthly_rate_no_commitment;
    a 24-month line keeps back one year''s multi-year saving, which is 12 times the difference between the tier''s renewal_rate_12mo
    and renewal_rate_24mo; a 12-month line keeps back no commitment share. The keep-backs are USD amounts subtracted from
    the line amount, and the auto-renew refund amount is never below zero.'
  prerequisite: []
  cross_category: []
  compute:
  - refunded_line_amount: LATEST('hosting_charges', 'amount', date_field='charge_date', event_type='hosting_renewal_charge',
      charge_type='auto_renew')
  - refunded_line_method: LATEST('hosting_charges', 'payment_method', date_field='charge_date', event_type='hosting_renewal_charge',
      charge_type='auto_renew')
  - refunded_line_date: LATEST('hosting_charges', 'charge_date', date_field='charge_date', event_type='hosting_renewal_charge',
      charge_type='auto_renew')
  - refund_on_charge_date: DAYS(refunded_line_date, NOW) == 0
  - processor_fee_pct: (K('card_fee_pct') if (refunded_line_method == 'card' and not refund_on_charge_date) else (K('paypal_fee_pct')
      if (refunded_line_method == 'paypal' and not refund_on_charge_date) else 0))
  - refund_processing_keepback: RND(refunded_line_amount * processor_fee_pct / 100, 2)
  - days_since_refunded_charge: DAYS(refunded_line_date, NOW)
  - refund_handling_keepback: (K('refund_fee_late') if days_since_refunded_charge > K('refund_fee_mid_days') else (K('refund_fee_mid')
      if (days_since_refunded_charge > K('refund_fee_free_days') and days_since_refunded_charge <= K('refund_fee_mid_days'))
      else 0))
  - refunded_line_start: LATEST('hosting_charges', 'period_start', date_field='charge_date', event_type='hosting_renewal_charge',
      charge_type='auto_renew')
  - applied_term_changes: COUNT('hosting_change_requests', request_type='term_change', request_status='applied', effective_date=refunded_line_start)
  - applied_downgrades: COUNT('hosting_change_requests', request_type='downgrade', request_status='applied', effective_date=refunded_line_start)
  - refund_reversal_keepback: (K('term_change_reversal_fee') if applied_term_changes > 0 else (K('downgrade_reversal_fee')
      if (applied_downgrades > 0 and applied_term_changes == 0) else 0))
  - refunded_line_months: LATEST('hosting_charges', 'term_months', date_field='charge_date', event_type='hosting_renewal_charge',
      charge_type='auto_renew')
  - refund_commitment_keepback: (P('monthly_rate_no_commitment') if refunded_line_months == 36 else (RND(12 * (P('renewal_rate_12mo')
      - P('renewal_rate_24mo')), 2) if refunded_line_months == 24 else 0))
  - result: MX(0, RND(refunded_line_amount - refund_processing_keepback - refund_handling_keepback - refund_reversal_keepback
      - refund_commitment_keepback, 2))
  compute_basis:
    refunded_line_amount: The charge refunded is the plan's most recent auto_renew line.
    refunded_line_method: set by how the refunded line was paid
    refund_on_charge_date: nothing for a line refunded on its own charge date, when the payment is voided before it settles
    processor_fee_pct: card_fee_pct percent for a line paid by card and refunded after its charge date, paypal_fee_pct percent
      for a line paid through PayPal and refunded after its charge date, and nothing for a line refunded on its own charge
      date
    refund_processing_keepback: keeps back the payment processor's fee on the charge, a percentage of the line amount
    refunded_line_date: the whole calendar days from the refunded line's charge date to today
    days_since_refunded_charge: the whole calendar days from the refunded line's charge date to today
    refund_handling_keepback: refund_fee_free_days days or fewer keeps back nothing; more than refund_fee_free_days and up
      to refund_fee_mid_days days keeps back refund_fee_mid; more than refund_fee_mid_days days keeps back refund_fee_late.
    refunded_line_start: whose effective date equals the refunded line's period_start
    applied_term_changes: a change request of type term_change in status applied whose effective date equals the refunded
      line's period_start keeps back term_change_reversal_fee
    applied_downgrades: otherwise a change request of type downgrade in status applied with that effective date keeps back
      downgrade_reversal_fee
    refund_reversal_keepback: 'The auto-renew refund amount keeps back a reversal fee when the refunded line applied a change
      the customer had scheduled: a change request of type term_change in status applied whose effective date equals the refunded
      line''s period_start keeps back term_change_reversal_fee; otherwise a change request of type downgrade in status applied
      with that effective date keeps back downgrade_reversal_fee; a refunded line that applied no scheduled change keeps back
      no reversal fee.'
    refunded_line_months: decided by the months the refunded line covered
    refund_commitment_keepback: 'The auto-renew refund amount keeps back a multi-year commitment share decided by the months
      the refunded line covered: a 36-month line keeps back one month at the tier''s monthly_rate_no_commitment; a 24-month
      line keeps back one year''s multi-year saving, which is 12 times the difference between the tier''s renewal_rate_12mo
      and renewal_rate_24mo; a 12-month line keeps back no commitment share.'
    result: The keep-backs are USD amounts subtracted from the line amount, and the auto-renew refund amount is never below
      zero.
  factors:
  - id: rf_processor_fee
    effect: parameter
    decides: processor_fee_pct
    bindings:
    - refunded_line_method
    - refund_on_charge_date
    - processor_fee_pct
    ladder:
    - when: the refunded line was paid by card and is refunded after its charge date
      value: K('card_fee_pct')
    - when: the refunded line was paid through PayPal and is refunded after its charge date
      value: K('paypal_fee_pct')
    - when: otherwise (refunded on its own charge date, a voided payment)
      value: '0'
    baseline:
      processor_fee_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: rf_handling_age
    effect: parameter
    decides: refund_handling_keepback
    bindings:
    - days_since_refunded_charge
    - refund_handling_keepback
    ladder:
    - when: more than refund_fee_mid_days days from the refunded line's charge date to today
      value: K('refund_fee_late')
    - when: more than refund_fee_free_days and up to refund_fee_mid_days days
      value: K('refund_fee_mid')
    - when: otherwise (refund_fee_free_days days or fewer)
      value: '0'
    baseline:
      refund_handling_keepback: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: rf_change_reversal
    effect: parameter
    decides: refund_reversal_keepback
    bindings:
    - refunded_line_start
    - applied_term_changes
    - applied_downgrades
    - refund_reversal_keepback
    ladder:
    - when: an applied term_change request takes effect on the refunded line's period_start
      value: K('term_change_reversal_fee')
    - when: an applied downgrade request (and no applied term_change request) takes effect on that date
      value: K('downgrade_reversal_fee')
    - when: otherwise (the refunded line applied no scheduled change)
      value: '0'
    baseline:
      refund_reversal_keepback: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rf_commitment_share
    effect: method
    decides: refund_commitment_keepback
    bindings:
    - refunded_line_months
    - refund_commitment_keepback
    ladder:
    - when: the refunded line covered 36 months
      method: one month at the tier's monthly_rate_no_commitment
    - when: the refunded line covered 24 months
      method: 12 times the difference between the tier's renewal_rate_12mo and renewal_rate_24mo
    - when: otherwise (a 12-month line)
      method: no commitment share
    baseline:
      refund_commitment_keepback: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The charge refunded is the plan's most recent auto_renew line. The auto-renew refund amount is the full amount of
      that line, rounded half up to the cent.
    params: []
  inputs:
    history:
    - table: hosting_charges
      aggregate: latest
      field: amount
      filters:
        event_type: hosting_renewal_charge
        charge_type: auto_renew
    - table: hosting_change_requests
      aggregate: count
      filters:
        request_status: applied
    cross_category: []
- id: hosting_ext_early_renewal
  base_policy_refs:
  - hosting_renewal
  - hosting_downgrade_and_term_change
  overwrite:
  - base_policy: hosting_renewal
    superseded_clause: A renewal is billed at the regular rate of the tier and term length that the new term will have (renewal_rate_12mo,
      renewal_rate_24mo or renewal_rate_36mo times the months, or monthly_rate_no_commitment for a 1-month term, with no setup
      fee), less the account tier's hosting_discount_pct, rounded half up to the cent.
    replaced_by: This rule prices a renewal that the account holder pays at Harborline's checkout for a plan whose term end
      date is later than today and which carries no scheduled downgrade or term change request, and only such a renewal; a
      renewal that the account holder pays at Harborline's checkout for a plan whose term end date is on or before today and
      which carries no scheduled downgrade request is priced by the overdue renewal rule; every other renewal, which is an
      auto-renew charge, a renewal that applies a scheduled downgrade request, or a renewal paid at checkout while the term
      end date is later than today for a plan with a scheduled term change request, is billed at the regular rate of the tier
      and term length that the new term will have (renewal_rate_12mo, renewal_rate_24mo or renewal_rate_36mo times the months,
      or monthly_rate_no_commitment for a 1-month term, with no setup fee), less the account tier's hosting_discount_pct,
      rounded half up to the cent.
  - base_policy: hosting_downgrade_and_term_change
    superseded_clause: A scheduled downgrade is applied at renewal only when websites_in_use and storage_used_gb fit within
      the target tier's max_websites and storage_gb.
    replaced_by: A scheduled downgrade is applied at renewal only when websites_in_use and storage_used_gb fit within the
      target tier's max_websites and storage_gb, which concerns only a renewal that applies a scheduled downgrade request
      and therefore never an early renewal under this rule.
  trigger: on_request
  subject:
  - hosting_renewal_charge
  - hosting_term_renew
  computes: amount
  target_tool: pay_hosting_renewal_early_31233d6b
  params:
    early_long_min_days: 30
    early_credit_long: 10.0
    early_credit_short: 4.0
    mail_credit_large: 20.0
    mail_credit_small: 10.0
    mail_large_min_seats: 5
    cert_credit_ov_ev: 12.0
    cert_credit_dv: 6.0
  rule: 'This rule prices a renewal that the account holder pays at Harborline''s checkout for a plan whose term end date
    is later than today and which carries no scheduled downgrade or term change request, and only such a renewal; a renewal
    that the account holder pays at Harborline''s checkout for a plan whose term end date is on or before today and which
    carries no scheduled downgrade request is priced by the overdue renewal rule; every other renewal, which is an auto-renew
    charge, a renewal that applies a scheduled downgrade request, or a renewal paid at checkout while the term end date is
    later than today for a plan with a scheduled term change request, is billed at the regular rate of the tier and term length
    that the new term will have (renewal_rate_12mo, renewal_rate_24mo or renewal_rate_36mo times the months, or monthly_rate_no_commitment
    for a 1-month term, with no setup fee), less the account tier''s hosting_discount_pct, rounded half up to the cent. The
    early renewal is the account holder''s own payment, completed at Harborline''s checkout by card or through PayPal after
    the agent quotes the amount, because Harborline support never takes payment details; a payment from account credit is
    not taken under this rule. A renewal may be charged only while the plan status is active or suspended. A scheduled downgrade
    is applied at renewal only when websites_in_use and storage_used_gb fit within the target tier''s max_websites and storage_gb,
    which concerns only a renewal that applies a scheduled downgrade request and therefore never an early renewal under this
    rule. The new term always starts on the previous term end date. An early renewal is not billed until the plan''s term
    start date is on or before today. The early renewal amount is the plan tier''s regular price for the new term length:
    renewal_rate_12mo, renewal_rate_24mo or renewal_rate_36mo times the months of that term, or monthly_rate_no_commitment
    for a 1-month term, with no setup fee. The new term length is the current one (billing_term_months), since a plan with
    a scheduled term change request is outside this rule. The early renewal amount is rounded half up to the cent. The early
    renewal amount takes the reseller discount of the customer''s Harborline account tier on the date it is paid: an account
    on Harborline Reseller Platinum, Harborline Reseller Gold, Harborline Reseller Silver or Harborline Reseller Bronze takes
    that tier''s hosting_discount_pct under the account charter, and a Harborline Personal Account or Harborline Business
    Account takes no reseller discount; the percentage acts once on the regular price and the discounted price is rounded
    half up to the cent before any credit is applied. The early renewal amount is reduced by Harborline''s early renewal credit
    for a renewal paid at checkout while the plan''s auto-renew is switched off, set by the whole calendar days from today
    to the term end date: early_long_min_days days or more ahead earns early_credit_long; fewer than early_long_min_days days
    ahead earns early_credit_short; a plan whose auto-renew is switched on earns no early renewal credit. The early renewal
    amount is reduced by a domain bundle credit for the Harborline domain registration in status active that names this plan
    as its bundled hosting plan, because Harborline credits one year of the bundled domain''s renewal against the hosting
    renewal (the domain itself is still billed under the domain charter): when the registration''s most recent domain renewal
    charge line is the only renewal charge line on its charge date, carries no refund and no restore charge line is dated
    later than it, the credit is that line''s amount divided by the years it renewed, as the domain charter billed it, rounded
    half up to the cent; any other active bundled registration (one still in its free first year with no renewal charge yet,
    one whose most recent renewal charge line was refunded, one restored from redemption after that line, or one with two
    or more renewal charge lines dated on that most recent charge date) is credited its TLD''s renewal_price; a plan with
    no active bundled registration receives no domain bundle credit, and a cancelled or deleted bundled registration never
    counts. The early renewal amount is reduced by a mail bundle credit when a Harborline email subscription in status active
    serves the plan''s primary domain: mail_credit_large when that subscription has at least mail_large_min_seats seats, mail_credit_small
    when it has fewer; a plan whose primary domain has no active Harborline email subscription receives no mail bundle credit.
    The early renewal amount is reduced by a certificate bundle credit when one or more Harborline certificate subscriptions
    in status active are installed on this plan: cert_credit_ov_ev when at least one of them is an OV or EV product, cert_credit_dv
    when all of them are DV products; a plan with no active Harborline certificate installed on it receives no certificate
    bundle credit. Credits are fixed amounts in USD that are never discounted: the early renewal amount is the discounted
    price less the credits, rounded half up to the cent, and the credits together never take more than half of the discounted
    price.'
  prerequisite:
  - problem: hosting_ext_auto_renew_refund
    kind: value_input
    gate: early_new_term_months
    form: state
    policy_source: An early renewal is not billed until the plan's term start date is on or before today.
    condition: hosting_holdings.term_start_date of the plan is on or before the date of today, which holds once the auto-renew
      line that paid a term not yet begun carries its refund and the plan has been rolled back to the term paid before it.
    resolved_by: refund_hosting_auto_renewal_84b3efde
    effect: Once the prepaid auto-renew line is refunded, the plan returns to the term paid before it, with that term's end
      date and billing term length and with auto-renew switched off, so the new term length, the early renewal credit and
      the early renewal amount take their handling-time values.
  cross_category:
  - category: account
    as: branch
    reads:
    - variant_name
    note: The reseller discount of the early renewal is read from the customer's account tier.
  - category: domain
    as: branch
    reads:
    - domain_id
    - status
    - bundled_hosting_id
    - renewal_price
    - domain_charges.amount
    - domain_charges.years
    - domain_charges.charge_date
    - domain_charges.original_domain_charge_id
    note: The domain bundle credit is read from the active domain registration bundled with the plan.
  - category: email
    as: branch
    reads:
    - seat_count
    - status
    - email_domain
    note: The mail bundle credit is read from the active email subscription on the primary domain.
  - category: ssl
    as: branch
    reads:
    - validation_level
    - variant_name
    - status
    - hosting_id
    note: The certificate bundle credit is read from the active certificates installed on the plan.
  compute:
  - early_new_term_months: F('billing_term_months')
  - early_regular_price: (P('monthly_rate_no_commitment') if early_new_term_months == 1 else (P('renewal_rate_12mo') * 12
      if early_new_term_months == 12 else (P('renewal_rate_24mo') * 24 if early_new_term_months == 24 else P('renewal_rate_36mo')
      * 36)))
  - early_account_tier: CFIELD('account', 'variant_name')
  - early_reseller_pct: CPARAM('account', 'hosting_discount_pct') if early_account_tier == 'Harborline Reseller Platinum'
      else (CPARAM('account', 'hosting_discount_pct') if early_account_tier == 'Harborline Reseller Gold' else (CPARAM('account',
      'hosting_discount_pct') if early_account_tier == 'Harborline Reseller Silver' else (CPARAM('account', 'hosting_discount_pct')
      if early_account_tier == 'Harborline Reseller Bronze' else 0)))
  - early_discounted_price: RND(early_regular_price * (100 - early_reseller_pct) / 100, 2)
  - days_to_term_end: DAYS(NOW, F('term_end_date'))
  - plan_auto_renew_on: F('auto_renew')
  - advance_payment_credit: (K('early_credit_long') if (plan_auto_renew_on == False and days_to_term_end >= K('early_long_min_days'))
      else (K('early_credit_short') if (plan_auto_renew_on == False and days_to_term_end < K('early_long_min_days')) else
      0))
  - early_bundled_domain_id: CFIELD('domain', 'domain_id', bundled_hosting_id=HID, status='active')
  - early_bundled_last_renewal: XLATEST('domain', 'domain_charges', 'amount', date_field='charge_date', domain_id=early_bundled_domain_id,
      event_type='domain_renewal_charge')
  - early_bundled_list_renewal: CPARAM('domain', 'renewal_price', bundled_hosting_id=HID, status='active')
  - early_bundled_last_renewal_years: XLATEST('domain', 'domain_charges', 'years', date_field='charge_date', domain_id=early_bundled_domain_id,
      event_type='domain_renewal_charge')
  - early_bundled_last_renewal_ref: XLATEST('domain', 'domain_charges', 'domain_charge_id', date_field='charge_date', domain_id=early_bundled_domain_id,
      event_type='domain_renewal_charge')
  - early_bundled_last_renewal_date: XLATEST('domain', 'domain_charges', 'charge_date', date_field='charge_date', domain_id=early_bundled_domain_id,
      event_type='domain_renewal_charge')
  - early_bundled_renewal_refunds: XCOUNT('domain', 'domain_charges', domain_id=early_bundled_domain_id, event_type='domain_refund',
      original_domain_charge_id=early_bundled_last_renewal_ref)
  - early_bundled_last_restore_date: XLATEST('domain', 'domain_charges', 'charge_date', date_field='charge_date', domain_id=early_bundled_domain_id,
      event_type='domain_restore_charge')
  - early_bundled_same_day_renewals: XCOUNT('domain', 'domain_charges', domain_id=early_bundled_domain_id, event_type='domain_renewal_charge',
      charge_date=early_bundled_last_renewal_date)
  - early_bundled_renewal_line_counts: (early_bundled_last_renewal != None and early_bundled_same_day_renewals == 1 and early_bundled_renewal_refunds
      == 0 and (early_bundled_last_restore_date == None or early_bundled_last_restore_date <= early_bundled_last_renewal_date))
  - early_domain_credit: (RND(early_bundled_last_renewal / early_bundled_last_renewal_years, 2) if (early_bundled_domain_id
      != None and early_bundled_renewal_line_counts) else (early_bundled_list_renewal if early_bundled_domain_id != None else
      0))
  - early_mail_seats: CFIELD('email', 'seat_count', email_domain=F('primary_domain'), status='active')
  - early_mail_credit: (K('mail_credit_large') if (early_mail_seats != None and early_mail_seats >= K('mail_large_min_seats'))
      else (K('mail_credit_small') if (early_mail_seats != None and early_mail_seats < K('mail_large_min_seats')) else 0))
  - early_ov_ev_installed: EXISTS('ssl', hosting_id=HID, status='active', variant_name='Harborline OV Single Domain') or EXISTS('ssl',
      hosting_id=HID, status='active', variant_name='Harborline OV Wildcard') or EXISTS('ssl', hosting_id=HID, status='active',
      variant_name='Harborline EV Single Domain') or EXISTS('ssl', hosting_id=HID, status='active', variant_name='Harborline
      EV Multi-Domain')
  - early_cert_level: CPARAM('ssl', 'validation_level', hosting_id=HID, status='active')
  - early_cert_credit: (K('cert_credit_ov_ev') if early_ov_ev_installed else (K('cert_credit_dv') if early_cert_level == 'dv'
      else 0))
  - early_credits_total: advance_payment_credit + early_domain_credit + early_mail_credit + early_cert_credit
  - result: RND(early_discounted_price - MN(early_credits_total, early_discounted_price / 2), 2)
  compute_basis:
    early_new_term_months: The new term length is the current one (billing_term_months)
    early_regular_price: 'The early renewal amount is the plan tier''s regular price for the new term length: renewal_rate_12mo,
      renewal_rate_24mo or renewal_rate_36mo times the months of that term, or monthly_rate_no_commitment for a 1-month term,
      with no setup fee.'
    early_account_tier: takes the reseller discount of the customer's Harborline account tier on the date it is paid
    early_reseller_pct: an account on Harborline Reseller Platinum, Harborline Reseller Gold, Harborline Reseller Silver or
      Harborline Reseller Bronze takes that tier's hosting_discount_pct under the account charter, and a Harborline Personal
      Account or Harborline Business Account takes no reseller discount
    early_discounted_price: the percentage acts once on the regular price and the discounted price is rounded half up to the
      cent before any credit is applied.
    days_to_term_end: set by the whole calendar days from today to the term end date
    plan_auto_renew_on: for a renewal paid at checkout while the plan's auto-renew is switched off
    advance_payment_credit: early_long_min_days days or more ahead earns early_credit_long; fewer than early_long_min_days
      days ahead earns early_credit_short; a plan whose auto-renew is switched on earns no early renewal credit.
    early_bundled_domain_id: the Harborline domain registration in status active that names this plan as its bundled hosting
      plan
    early_bundled_last_renewal: the registration's most recent domain renewal charge line
    early_bundled_last_renewal_years: that line's amount divided by the years it renewed
    early_bundled_last_renewal_ref: carries no refund
    early_bundled_last_renewal_date: no restore charge line is dated later than it
    early_bundled_renewal_refunds: one whose most recent renewal charge line was refunded
    early_bundled_last_restore_date: one restored from redemption after that line
    early_bundled_same_day_renewals: is the only renewal charge line on its charge date
    early_bundled_renewal_line_counts: when the registration's most recent domain renewal charge line is the only renewal
      charge line on its charge date, carries no refund and no restore charge line is dated later than it
    early_bundled_list_renewal: is credited its TLD's renewal_price
    early_domain_credit: the credit is that line's amount divided by the years it renewed, as the domain charter billed it,
      rounded half up to the cent; any other active bundled registration (one still in its free first year with no renewal
      charge yet, one whose most recent renewal charge line was refunded, one restored from redemption after that line, or
      one with two or more renewal charge lines dated on that most recent charge date) is credited its TLD's renewal_price;
      a plan with no active bundled registration receives no domain bundle credit, and a cancelled or deleted bundled registration
      never counts.
    early_mail_seats: a Harborline email subscription in status active serves the plan's primary domain
    early_mail_credit: mail_credit_large when that subscription has at least mail_large_min_seats seats, mail_credit_small
      when it has fewer; a plan whose primary domain has no active Harborline email subscription receives no mail bundle credit.
    early_ov_ev_installed: cert_credit_ov_ev when at least one of them is an OV or EV product
    early_cert_level: cert_credit_dv when all of them are DV products
    early_cert_credit: 'The early renewal amount is reduced by a certificate bundle credit when one or more Harborline certificate
      subscriptions in status active are installed on this plan: cert_credit_ov_ev when at least one of them is an OV or EV
      product, cert_credit_dv when all of them are DV products; a plan with no active Harborline certificate installed on
      it receives no certificate bundle credit.'
    early_credits_total: the early renewal amount is the discounted price less the credits
    result: 'Credits are fixed amounts in USD that are never discounted: the early renewal amount is the discounted price
      less the credits, rounded half up to the cent, and the credits together never take more than half of the discounted
      price.'
  factors:
  - id: early_reseller_discount
    effect: parameter
    decides: early_reseller_pct
    bindings:
    - early_account_tier
    - early_reseller_pct
    ladder:
    - when: the account tier is Harborline Reseller Platinum
      value: CPARAM('account','hosting_discount_pct') of Harborline Reseller Platinum
    - when: the account tier is Harborline Reseller Gold
      value: CPARAM('account','hosting_discount_pct') of Harborline Reseller Gold
    - when: the account tier is Harborline Reseller Silver
      value: CPARAM('account','hosting_discount_pct') of Harborline Reseller Silver
    - when: the account tier is Harborline Reseller Bronze
      value: CPARAM('account','hosting_discount_pct') of Harborline Reseller Bronze
    - when: otherwise (Harborline Personal Account or Harborline Business Account)
      value: '0'
    baseline:
      early_reseller_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: account
  - id: early_advance_credit
    effect: parameter
    decides: advance_payment_credit
    bindings:
    - days_to_term_end
    - plan_auto_renew_on
    - advance_payment_credit
    ladder:
    - when: auto-renew switched off and early_long_min_days days or more from today to the term end date
      value: K('early_credit_long')
    - when: auto-renew switched off and fewer than early_long_min_days days from today to the term end date
      value: K('early_credit_short')
    - when: otherwise (auto-renew switched on)
      value: '0'
    baseline:
      advance_payment_credit: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: early_domain_bundle
    effect: method
    decides: early_domain_credit
    bindings:
    - early_bundled_domain_id
    - early_bundled_last_renewal
    - early_bundled_last_renewal_years
    - early_bundled_last_renewal_ref
    - early_bundled_last_renewal_date
    - early_bundled_renewal_refunds
    - early_bundled_last_restore_date
    - early_bundled_same_day_renewals
    - early_bundled_renewal_line_counts
    - early_bundled_list_renewal
    - early_domain_credit
    ladder:
    - when: an active bundled domain registration whose most recent renewal charge line is alone on its date, carries no refund
        and no later restore line
      method: that line's amount divided by the years it renewed, rounded half up to the cent
    - when: any other active bundled domain registration (free first year, refunded latest renewal, restored after it, or
        two renewal lines on the latest date)
      method: its TLD's renewal_price
    - when: otherwise (no active bundled registration)
      method: no domain bundle credit
    baseline:
      early_domain_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: domain
  - id: early_mail_bundle
    effect: parameter
    decides: early_mail_credit
    bindings:
    - early_mail_seats
    - early_mail_credit
    ladder:
    - when: an active Harborline email subscription on the primary domain has at least mail_large_min_seats seats
      value: K('mail_credit_large')
    - when: an active Harborline email subscription on the primary domain has fewer than mail_large_min_seats seats
      value: K('mail_credit_small')
    - when: otherwise (no active Harborline email subscription on the primary domain)
      value: '0'
    baseline:
      early_mail_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: email
  - id: early_cert_bundle
    effect: parameter
    decides: early_cert_credit
    bindings:
    - early_ov_ev_installed
    - early_cert_level
    - early_cert_credit
    ladder:
    - when: at least one active Harborline OV or EV certificate is installed on the plan
      value: K('cert_credit_ov_ev')
    - when: the active Harborline certificates installed on the plan are all DV
      value: K('cert_credit_dv')
    - when: otherwise (no active Harborline certificate installed on the plan)
      value: '0'
    baseline:
      early_cert_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: ssl
  baseline:
    rule: 'The early renewal amount is the plan tier''s regular price for the new term length: renewal_rate_12mo, renewal_rate_24mo
      or renewal_rate_36mo times the months of that term, or monthly_rate_no_commitment for a 1-month term, with no setup
      fee. The new term length is the current one (billing_term_months), since a plan with a scheduled term change request
      is outside this rule. The early renewal amount is rounded half up to the cent.'
    params:
    - renewal_rate_12mo
    - renewal_rate_24mo
    - renewal_rate_36mo
    - monthly_rate_no_commitment
  inputs:
    history:
    - category: domain
      table: domain_charges
      aggregate: latest
      field: amount
      filters:
        event_type: domain_renewal_charge
    cross_category:
    - account
    - domain
    - email
    - ssl
