    - date
    cross_difficulty: null
  - id: term_renewal_product
    effect: parameter
    decides: renewal_product
    bindings:
    - renewal_product
    ladder:
    - when: the scheduled product is Harborline Mail Starter and no upgrade line whose period end is the term end date belongs to the current term
      value: Harborline Mail Starter
    - when: the scheduled product is Harborline Mail Plus and no upgrade line whose period end is the term end date belongs to the current term
      value: Harborline Mail Plus
    - when: the scheduled product is Microsoft 365 Business Basic and no upgrade line whose period end is the term end date belongs to the current term
      value: Microsoft 365 Business Basic
    - when: the scheduled product is Microsoft 365 Business Standard and no upgrade line whose period end is the term end date belongs to the current term
      value: Microsoft 365 Business Standard
    - when: otherwise, no product scheduled, or an upgrade line whose period end is the term end date belongs to the current term
      value: the subscription's current product
    baseline:
      renewal_product: F('variant_name')
    evidence:
    - date
    cross_difficulty: null
  - id: term_renewal_late_fee
    effect: parameter
    decides: late_fee
    bindings:
    - days_late
    - late_fee
    ladder:
    - when: late_days_long calendar days or more from the due date to today
      value: K('late_fee_long')
    - when: from late_days_mid up to one day fewer than late_days_long calendar days
      value: K('late_fee_mid')
    - when: from 1 up to one day fewer than late_days_mid calendar days
      value: K('late_fee_short')
    - when: otherwise, paid on or before the due date
      value: '0'
    baseline:
      late_fee: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: term_renewal_seat_basis
    effect: method
    decides: renewed_seats
    bindings:
    - scheduled_seats
    - idle_seats
    - renewed_seats
    ladder:
    - when: a scheduled seat count is set
      method: the renewed seats are the lower of the scheduled seat count and the seat count, never fewer than the mailboxes in use (seat count less idle seats)
    - when: no scheduled seat count is set and the idle seats of the current term are above zero
      method: the renewed seats are the seat count less the idle seats
    - when: otherwise
      method: the renewed seats are the seat count, every licensed seat billed
    baseline:
      renewed_seats: seat_count_now
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The term renewal is the rounded renewal component plus every fee added to it, rounded half up to the cent. The renewal component is the renewed seats times the plan seat price times the renewal months, reduced by any rate that applies to it, rounded half up to the cent. The plan seat price is the product's seat_price_annual_prepaid, its annual-commitment price. The renewal months are the calendar months from the term start date to the term end date on the annual_prepaid and monthly plans, and 1 on the annual_monthly_billing plan, whose term renewal is the new term's first monthly instalment. The renewed seats are the seat count on the subscription. No fee is added.
    params:
    - seat_price_annual_prepaid
  inputs:
    history:
    - table: email_events
      aggregate: count
      field: email_event_id
      filters:
        event_type: email_mailbox_delete
    - table: email_events
      aggregate: count
      field: email_event_id
      filters:
        event_type: email_mailbox_restore
    cross_category:
    - account
- id: email_ext_annual_conversion
  base_policy_refs:
  - email_renewal_and_instalments
  - email_cancellation
  overwrite:
  - base_policy: email_renewal_and_instalments
    superseded_clause: Renewals and instalments use the product's current seat price for the billing plan, fixed for the whole annual term where price_protected_for_term is true, and apply any scheduled seat count and scheduled product at the renewal.
    replaced_by: Every renewal and instalment other than a reactivation renewal, a term renewal or an annual conversion uses the product's current seat price for the billing plan, fixed for the whole annual term where price_protected_for_term is true, and applies any scheduled seat count and scheduled product at the renewal; a reactivation renewal, a term renewal and an annual conversion are each priced as its own rule states.
  - base_policy: email_renewal_and_instalments
    superseded_clause: An annual term billed monthly is charged a monthly_instalment on the instalment day each month (instalment_day_rule), and a monthly plan renews each month.
    replaced_by: An annual term billed monthly is charged a monthly_instalment on the instalment day each month (instalment_day_rule), and a monthly plan renews each month until an annual conversion moves it to the annual_prepaid plan, which then starts a 12-month term on the annual start date the annual conversion sets.
  - base_policy: email_cancellation
    superseded_clause: Outside the window an immediate cancellation ends the subscription without any refund, and a month-to-month charge is never refunded (monthly_plan_refundable).
    replaced_by: Outside the window an immediate cancellation ends the subscription without any refund, and a month-to-month charge is never refunded (monthly_plan_refundable), its unused days being credited only against an annual conversion as this policy states.
  trigger: on_request
  subject:
  - email_renewal_charge
  computes: conversion_amount
  target_tool: convert_mail_to_annual_cfde09f1
  params:
    credit_days_full: 15
    late_days_mid: 4
    late_days_long: 15
    late_fee_short: 5.0
    late_fee_mid: 10.0
    late_fee_long: 15.0
    reinstatement_days_short: 4
    reinstatement_days_long: 15
    reinstatement_fee_short: 10.0
    reinstatement_fee_long: 20.0
    conversion_start_days: 5
    conversion_end_days: 3
  rule: 'An annual conversion is the move of an email subscription on the monthly plan to the annual_prepaid plan with a new 12-month term from the annual start date this policy sets, and this policy prices only an annual conversion. Every renewal and instalment other than a reactivation renewal, a term renewal or an annual conversion uses the product''s current seat price for the billing plan, fixed for the whole annual term where price_protected_for_term is true, and applies any scheduled seat count and scheduled product at the renewal; a reactivation renewal, a term renewal and an annual conversion are each priced as its own rule states. An annual term billed monthly is charged a monthly_instalment on the instalment day each month (instalment_day_rule), and a monthly plan renews each month until an annual conversion moves it to the annual_prepaid plan, which then starts a 12-month term on the annual start date the annual conversion sets. Outside the window an immediate cancellation ends the subscription without any refund, and a month-to-month charge is never refunded (monthly_plan_refundable), its unused days being credited only against an annual conversion as this policy states. An annual conversion may be charged only while the subscription status is active, and once it is billed the billing plan is annual_prepaid, the term runs from the annual start date for 12 calendar months and the scheduled seat count is reset to 0. The annual conversion charge is fixed only after a paid monthly renewal opens a month that runs past today. Once the agent has quoted the annual conversion charge, the account holder pays it personally at Harborline''s secure checkout with PayPal, a payment method Harborline never stores on the account, and the conversion takes effect when that payment completes. The charge that opened the current term is the new-subscription or renewal charge whose period start is the term start date; an added-seat or upgrade line never opens a term. The annual conversion charge is the annual component less the conversion credit, rounded half up to the cent. The annual component is the converted seats times the annual seat price times 12, reduced by any rate that applies to it, rounded half up to the cent. The annual seat price is the product''s seat_price_annual_prepaid. The converted seats are the seat count on the subscription. The conversion credit is the paid-month value less every fee taken off it, times the credit fraction, rounded half up to the cent. The paid-month value is seat_price_monthly times the converted seats, no fee is taken off it, the annual start date is today, the credited days are the calendar days from today to the term end date, and no credit convention applies, so the credit fraction is 0. The account-tier rate of an annual conversion is the email_discount_pct the account charter sets for the tier recorded on the account on the charge date: a Microsoft 365 subscription takes no account-tier rate whatever the tier; otherwise a Harborline Reseller Platinum account takes the Platinum email_discount_pct, a Harborline Reseller Gold account takes the Gold email_discount_pct, a Harborline Reseller Silver account takes the Silver email_discount_pct, a Harborline Reseller Bronze account takes the Bronze email_discount_pct, and any other account takes no account-tier rate. The account-tier rate reduces the annual component of an annual conversion once, before it is rounded; no other percentage is added to it or compounded with it, and it never reduces a fee or a credit. The annual start date and the credited days of an annual conversion are read from where today falls in the paid month: where the paid month began fewer than conversion_start_days calendar days before today, the annual term starts on the paid month''s start date and every day of the month is credited; where the term end date is conversion_end_days calendar days or fewer after today, the annual term starts on the term end date and no day is credited; otherwise the annual term starts today and the calendar days from today to the term end date are credited. The credit convention of an annual conversion is read from the calendar days from today to the term end date: where those days are credit_days_full or more, the credited days count day by day; where they are from 1 up to one day fewer than credit_days_full, only the whole weeks in the credited days count, each as seven days; otherwise nothing is credited. The credit fraction is the credited days so counted divided by the calendar days from the term start date to the term end date. The paid-month value of an annual conversion is read from the charges of the current term: where a charge opened the current term and no added-seat line whose period end is the term end date belongs to the term, the paid-month value is that charge''s amount; where a charge opened the current term and such added-seat lines belong to the term, it is that charge''s amount plus the amounts of those lines; otherwise, where no charge on record opened the current term, it is seat_price_monthly times the converted seats. The fees taken off the paid-month value of an annual conversion are the fees the renewal charge that opened the current term carried, read from the calendar days from the term start date to that charge''s charge date, since a fee is part of what a charge billed but never of what a month is credited: the late-payment fee is late_fee_long for late_days_long days or more, late_fee_mid from late_days_mid days up to one day fewer than late_days_long and late_fee_short from 1 day up to one day fewer than late_days_mid; where those days less payment_grace_days less 1, the days the subscription had been suspended, are reinstatement_days_long or more the reinstatement charge reinstatement_fee_long is added to it, and from reinstatement_days_short up to one day fewer than reinstatement_days_long the reinstatement charge reinstatement_fee_short; otherwise, including a renewal charged on or before its period start, a new-subscription charge and no renewal charge on record, no fee is taken off.'
  prerequisite:
  - problem: email_ext_term_renewal
    kind: value_input
    gate: conversion_credit
    form: state
    policy_source: The annual conversion charge is fixed only after a paid monthly renewal opens a month that runs past today.
    condition: email_charges carries a renewal charge whose period start is email_holdings.term_start_date, and email_holdings.term_end_date is later than today's date while the status is active.
    resolved_by: pay_late_mail_renewal_a889cd52
    effect: Once the late term renewal is paid, the month on record runs from the previous term end date for one month and is opened by that paid charge, so the paid-month value, its fees, the credit fraction, the converted seats and the seats on the charge that opened the current term all take the paid month's values.
  cross_category:
  - category: account
    reads:
    - variant_name
    note: The account-tier rate is decided from the tier recorded on the customer's account and its email_discount_pct under the account charter.
    as: branch
  compute:
  - converted_seats: F('seat_count')
  - account_tier: CFIELD('account', 'variant_name')
  - tier_rate: 0 if (F('variant_name') == 'Microsoft 365 Business Basic' or F('variant_name') == 'Microsoft 365 Business Standard' or F('variant_name') == 'Microsoft 365 Business Premium') else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Platinum' else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Gold' else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Silver' else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Bronze' else 0))))
  - annual_component: RND(converted_seats * P('seat_price_annual_prepaid') * 12 * (100 - tier_rate) / 100 + 0.000000001, 2)
  - unused_days: DAYS(NOW, F('term_end_date'))
  - month_days: DAYS(F('term_start_date'), F('term_end_date'))
  - days_into_month: DAYS(F('term_start_date'), NOW)
  - credited_days: DAYS(F('term_start_date'), F('term_end_date')) if days_into_month < K('conversion_start_days') else (0 if DAYS(NOW, F('term_end_date')) <= K('conversion_end_days') else DAYS(NOW, F('term_end_date')))
  - credit_mode: 2 if unused_days >= K('credit_days_full') else (1 if unused_days >= 1 else 0)
  - credit_fraction: credited_days / month_days if credit_mode == 2 else ((int(credited_days / 7) * 7) / month_days if credit_mode == 1 else 0)
  - conv_open_amount: SUM('email_charges', 'amount', event_type='email_subscription_charge', period_start=F('term_start_date')) + SUM('email_charges', 'amount', event_type='email_renewal_charge', period_start=F('term_start_date'))
  - conv_added_amount: SUM('email_charges', 'amount', event_type='email_seat_charge', charge_type='added_seats', period_end=F('term_end_date'))
  - paid_month_value: conv_open_amount + conv_added_amount if (conv_open_amount > 0 and conv_added_amount > 0) else (conv_open_amount if conv_open_amount > 0 else P('seat_price_monthly') * converted_seats)
  - open_charge_date: LATEST('email_charges', 'charge_date', date_field='charge_date', event_type='email_renewal_charge', period_start=F('term_start_date'))
  - fee_days: DAYS(F('term_start_date'), open_charge_date) if open_charge_date else 0
  - carried_fees: (K('late_fee_long') if fee_days >= K('late_days_long') else (K('late_fee_mid') if fee_days >= K('late_days_mid') else (K('late_fee_short') if fee_days >= 1 else 0))) + (K('reinstatement_fee_long') if fee_days - P('payment_grace_days') - 1 >= K('reinstatement_days_long') else (K('reinstatement_fee_short') if fee_days - P('payment_grace_days') - 1 >= K('reinstatement_days_short') else 0))
  - conversion_credit: RND((paid_month_value - carried_fees) * credit_fraction + 0.000000001, 2)
  - result: RND(annual_component - conversion_credit + 0.000000001, 2)
  compute_basis:
    unused_days: The credit convention of an annual conversion is read from the calendar days from today to the term end date
    month_days: The credit fraction is the credited days so counted divided by the calendar days from the term start date to the term end date.
    credit_fraction: The credit fraction is the credited days so counted divided by the calendar days from the term start date to the term end date.
    conv_open_amount: The paid-month value of an annual conversion is read from the charges of the current term
    conv_added_amount: where a charge opened the current term and no added-seat line whose period end is the term end date belongs to the term, the paid-month value is that charge's amount; where a charge opened the current term and such added-seat lines belong to the term, it is that charge's amount plus the amounts of those lines; otherwise, where no charge on record opened the current term, it is seat_price_monthly times the converted seats.
    paid_month_value: where a charge opened the current term and no added-seat line whose period end is the term end date belongs to the term, the paid-month value is that charge's amount; where a charge opened the current term and such added-seat lines belong to the term, it is that charge's amount plus the amounts of those lines; otherwise, where no charge on record opened the current term, it is seat_price_monthly times the converted seats.
    open_charge_date: The fees taken off the paid-month value of an annual conversion are the fees the renewal charge that opened the current term carried, read from the calendar days from the term start date to that charge's charge date, since a fee is part of what a charge billed but never of what a month is credited
    fee_days: The fees taken off the paid-month value of an annual conversion are the fees the renewal charge that opened the current term carried, read from the calendar days from the term start date to that charge's charge date, since a fee is part of what a charge billed but never of what a month is credited
    carried_fees: the late-payment fee is late_fee_long for late_days_long days or more, late_fee_mid from late_days_mid days up to one day fewer than late_days_long and late_fee_short from 1 day up to one day fewer than late_days_mid; where those days less payment_grace_days less 1, the days the subscription had been suspended, are reinstatement_days_long or more the reinstatement charge reinstatement_fee_long is added to it, and from reinstatement_days_short up to one day fewer than reinstatement_days_long the reinstatement charge reinstatement_fee_short; otherwise, including a renewal charged on or before its period start, a new-subscription charge and no renewal charge on record, no fee is taken off.
    conversion_credit: The conversion credit is the paid-month value less every fee taken off it, times the credit fraction, rounded half up to the cent.
    converted_seats: The converted seats are the seat count on the subscription.
    account_tier: The account-tier rate of an annual conversion is the email_discount_pct the account charter sets for the tier recorded on the account on the charge date
    tier_rate: a Microsoft 365 subscription takes no account-tier rate whatever the tier; otherwise a Harborline Reseller Platinum account takes the Platinum email_discount_pct, a Harborline Reseller Gold account takes the Gold email_discount_pct, a Harborline Reseller Silver account takes the Silver email_discount_pct, a Harborline Reseller Bronze account takes the Bronze email_discount_pct, and any other account takes no account-tier rate.
    annual_component: The annual component is the converted seats times the annual seat price times 12, reduced by any rate that applies to it, rounded half up to the cent.
    result: The annual conversion charge is the annual component less the conversion credit, rounded half up to the cent.
    days_into_month: The annual start date and the credited days of an annual conversion are read from where today falls in the paid month
    credited_days: where the paid month began fewer than conversion_start_days calendar days before today, the annual term starts on the paid month's start date and every day of the month is credited; where the term end date is conversion_end_days calendar days or fewer after today, the annual term starts on the term end date and no day is credited; otherwise the annual term starts today and the calendar days from today to the term end date are credited.
    credit_mode: where those days are credit_days_full or more, the credited days count day by day; where they are from 1 up to one day fewer than credit_days_full, only the whole weeks in the credited days count, each as seven days; otherwise nothing is credited.
  factors:
  - id: conversion_tier_rate
    effect: parameter
    decides: tier_rate
    bindings:
    - account_tier
    - tier_rate
    ladder:
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Platinum
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Platinum
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Gold
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Gold
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Silver
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Silver
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Bronze
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Bronze
    - when: otherwise, including every Microsoft 365 subscription and every account below the Reseller tiers
      value: '0'
    baseline:
      tier_rate: '0'
    evidence:
    - cross_category
    cross_difficulty: account
  - id: conversion_credit_days
    effect: method
    decides: credit_mode
    bindings:
    - unused_days
    - credit_mode
    ladder:
    - when: credit_days_full or more calendar days remain from today to the term end date
      method: the credited days count day by day over the calendar days of the month
    - when: from 1 up to one day fewer than credit_days_full days remain
      method: only the whole weeks in the credited days count, seven days each, over the calendar days of the month
    - when: otherwise
      method: nothing is credited
    baseline:
      credit_mode: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: conversion_annual_start
    effect: parameter
    decides: credited_days
    bindings:
    - days_into_month
    - credited_days
    ladder:
    - when: the paid month began fewer than conversion_start_days calendar days before today
      value: the paid month's start date; every day of the month credited
    - when: the term end date is conversion_end_days calendar days or fewer after today
      value: the term end date; no day credited
    - when: otherwise
      value: today; the days from today to the term end date credited
    baseline:
      credited_days: DAYS(NOW, F('term_end_date'))
    evidence:
    - date
    cross_difficulty: null
  - id: conversion_paid_month
    effect: method
    decides: paid_month_value
    bindings:
    - conv_open_amount
    - conv_added_amount
    - paid_month_value
    ladder:
    - when: a charge opened the current term and no added-seat line ending on the term end date belongs to it
      method: the paid-month value is that charge amount
    - when: a charge opened the current term and added-seat lines ending on the term end date belong to the term
      method: the paid-month value is that charge amount plus those lines amounts
    - when: otherwise, no charge on record opened the current term
      method: the paid-month value is seat_price_monthly times the converted seats
    baseline:
      paid_month_value: P('seat_price_monthly') * converted_seats
    evidence:
    - history
    cross_difficulty: null
  - id: conversion_carried_fees
    effect: parameter
    decides: carried_fees
    bindings:
    - open_charge_date
    - fee_days
    - carried_fees
    ladder:
    - when: the opening renewal was billed late_days_long days or more after its period start
      value: K('late_fee_long'), plus the reinstatement charge for the days suspended where it was billed after the grace days
    - when: from late_days_mid up to one day fewer than late_days_long days after it
      value: K('late_fee_mid'), plus the reinstatement charge for the days suspended where it was billed after the grace days
    - when: from 1 up to one day fewer than late_days_mid days after it
      value: K('late_fee_short')
    - when: otherwise
      value: '0'
    baseline:
      carried_fees: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The annual conversion charge is the annual component less the conversion credit, rounded half up to the cent. The annual component is the converted seats times the annual seat price times 12, reduced by any rate that applies to it, rounded half up to the cent. The annual seat price is the product's seat_price_annual_prepaid. The converted seats are the seat count on the subscription. The conversion credit is the paid-month value less every fee taken off it, times the credit fraction, rounded half up to the cent. The paid-month value is seat_price_monthly times the converted seats, no fee is taken off it, the annual start date is today, the credited days are the calendar days from today to the term end date, and no credit convention applies, so the credit fraction is 0.
    params:
    - seat_price_annual_prepaid
    - seat_price_monthly
  inputs:
    history:
    - table: email_charges
      aggregate: sum
      field: amount
      filters:
        event_type: email_renewal_charge
    - table: email_charges
      aggregate: sum
      field: seats
      filters:
        event_type: email_renewal_charge
    - table: email_charges
      aggregate: sum
      field: amount
      filters:
        event_type: email_seat_charge
        charge_type: added_seats
    - table: email_charges
      aggregate: latest
      field: charge_date
      filters:
        event_type: email_renewal_charge
    cross_category:
    - account
