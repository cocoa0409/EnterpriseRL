    - credit_basis
    - credit_count
    ladder:
    - when: a charge on record opened the current term and covers the whole term
      method: the credit basis is that charge amount, counted once
    - when: the charge that opened the current term is the first monthly instalment of an annual term billed monthly
      method: the credit basis is that instalment amount, counted for each calendar month of the term
    - when: otherwise, no charge on record opened the current term
      method: the credit basis is the current product's seat_price_annual_prepaid times the upgraded seats times the upgrade months, counted once
    baseline:
      credit_basis: list_credit
      credit_count: '1'
    evidence:
