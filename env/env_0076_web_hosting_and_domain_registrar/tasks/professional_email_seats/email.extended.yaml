    cross_difficulty: null
  - id: pro_upgrade_billing_span
    effect: method
    decides: billing_fraction
    bindings:
    - days_into_term
    - billing_fraction
    ladder:
    - when: the term runs 12 calendar months and today falls before the term start date plus cancellation_window_hours elapsed hours
      method: the fraction is 1 and the whole term is billed
    - when: the term runs 12 calendar months, today falls outside that window and the term end date is from 1 to upgrade_final_days calendar days after today
      method: the fraction is the started upgrade_period_days-day periods to the term end date divided by 12
    - when: the term runs one calendar month and the term end date is from 1 up to one day fewer than upgrade_short_days days after today
      method: the fraction is the whole weeks in those days, seven days each, over the calendar days of the term
    - when: otherwise
