# Product charter — Professional Email (category: email). Single registry of every quantified policy of this category.
category: email
display_name: Professional Email
binding:
  holding_table: email_holdings
  event_tables:
  - email_charges
  - email_events
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - provisioning
  - active
  - suspended
  - cancel_pending
  - expired
  - cancelled
  transitions:
  - from: provisioning
    to: active
    by: system
    means: The mail organisation and its mailboxes are created and the subscription goes live.
  - from: provisioning
    to: cancelled
    by: system
    means: The order fails payment or fraud screening and is never provisioned.
  - from: active
    to: suspended
    by: system
    means: An instalment or renewal stays unpaid past the grace days and mail access is suspended.
  - from: suspended
    to: active
    by: agent
    means: The overdue amount is paid and access is restored.
  - from: suspended
    to: cancelled
    by: system
    means: A suspension reaches the end of the data retention period and the mail organisation is deleted.
  - from: active
    to: cancel_pending
    by: user
    means: The customer turns off renewal so the subscription ends at the term end date.
  - from: cancel_pending
    to: active
    by: agent
    means: The customer withdraws the scheduled cancellation before the term ends.
  - from: cancel_pending
    to: expired
    by: system
    means: The term ends unrenewed; mailboxes stay readable for the expired grace days.
  - from: expired
    to: active
    by: agent
    means: An expired subscription is renewed inside its expired grace days.
  - from: expired
    to: cancelled
    by: system
    means: The expired grace days lapse and the mail organisation is deleted.
  - from: active
    to: cancelled
    by: user
    means: The customer cancels with immediate effect, for example inside the cancellation window.
accounts:
- key: email_billed
  unit: USD
  meaning: 'Net amount billed for one email subscription: subscription, instalment, renewal and seat charges add
    to it; refunds and seat-reduction credits take away from it.'
parameter_schema:
  seat_price_annual_prepaid: Price per seat per month on an annual term paid up front, USD
  seat_price_annual_monthly_billing: Price per seat per month on an annual term billed monthly, USD (0.00 where
    not offered)
  seat_price_monthly: Price per seat per month on a month-to-month term, USD
  billing_plans_offered: Billing plans offered, list of annual_prepaid, annual_monthly_billing, monthly
  min_seats: Fewest seats a subscription may have
  max_seats: Most seats one subscription may have
  mailbox_storage_gb: Mailbox storage per seat, GB
  archive_storage_gb: Archive mailbox storage per seat, GB (0 where none)
  max_attachment_mb: Largest attachment that can be sent, MB
  aliases_per_mailbox: Aliases per mailbox
  shared_mailboxes_included: Shared mailboxes included without a seat
  desktop_office_apps: Whether desktop Office apps are included, boolean
  teams_included: Whether Microsoft Teams is included, boolean
  advanced_security_included: Whether Defender for Business and Intune device management are included, boolean
  cancellation_window_hours: Elapsed hours after the start of an annual term (purchase or renewal) during which
    seats can be reduced or the term cancelled for a refund
  refund_basis_in_window: 'How a refund inside the cancellation window is computed: full or prorated_daily'
  monthly_plan_refundable: Whether a month-to-month charge is ever refunded, boolean
  seat_reduction_after_window: 'When a seat reduction outside the window takes effect: next_renewal'
  seat_addition_proration: 'How added seats are billed mid-term: prorated_daily to the term end'
  upgrade_mid_term_allowed: Whether the subscription may move to a higher product mid-term, boolean
  upgrade_targets: Products the subscription may move to mid-term, list
  downgrade_at_renewal_only: Whether a move to a lower product takes effect only at renewal, boolean
  cross_family_change_allowed: Whether a subscription may switch between Harborline Mail and Microsoft 365 in place
    (otherwise a new subscription and migration are needed), boolean
  deleted_mailbox_retention_days: Calendar days a deleted mailbox can be restored
  mailbox_restore_fee: Fee to restore a deleted mailbox, USD
  payment_grace_days: Calendar days an unpaid instalment or renewal may stay unpaid before suspension
  suspension_retention_days: Calendar days a suspended subscription is kept before the mail organisation is deleted
  expired_grace_days: Calendar days after an unrenewed term end during which the expired subscription can be renewed
    and mail is read-only
  auto_renew_default_on: Whether renewal is on by default, boolean
  auto_renew_days_before_end: Days before the term end date on which the renewal charge is attempted
  auto_renew_retry_days_before_end: Days before the term end date on which retries run after a decline, list
  instalment_day_rule: 'Day monthly instalments fall due: the day of month of the term start, or the month''s last
    day when it has fewer days'
  price_protected_for_term: Whether the seat price is fixed for the whole annual term, boolean
  storage_warning_pct: Percent of mailbox storage at which the user is warned
  send_block_at_full: Whether a full mailbox stops sending until space is freed, boolean
  daily_send_limit: Recipients one mailbox may send to per day
  dns_auto_config_with_harborline_dns: Whether MX, SPF, DKIM and autodiscover records are set up automatically when
    the email domain is a Harborline domain on Harborline DNS, boolean
  migration_assistance_min_seats: Seats from which free mailbox migration by Harborline is offered
  migration_fee_per_mailbox: Fee per mailbox migrated below the free threshold, USD
  hosting_mailbox_coexistence: Whether cPanel mailboxes of a Harborline hosting plan can remain active for the same
    domain once this subscription takes over MX, boolean
  max_subscriptions_per_domain: Live email subscriptions allowed per email domain
  seat_minimum_reduction_floor: Lowest seat count a reduction may reach
  account_discount_applies: Whether the account tier's email_discount_pct applies to the seat price, boolean
  retention_on_downgrade: Whether mailbox data above the lower product's storage must be removed before a downgrade
    at renewal, boolean
  legacy_two_year_terms: Whether multi-year terms are offered, boolean
  spam_quarantine_days: Days messages stay in spam quarantine
  litigation_hold: Whether litigation hold is available, boolean
  price_rounding: 'Rounding of every computed email amount: half_up_to_cent'
  renewal_term_options: Terms the subscription can renew into, list
