- id: email_domain_integration
  subject:
  - email_order
  - email_activate
  rule: Where dns_auto_config_with_harborline_dns is true and the subscription's domain_id names a Harborline domain
    that is active and on harborline_dns, the MX, SPF, DKIM and autodiscover records are set at activation; otherwise
    the customer sets them at their DNS provider. Once the subscription takes over the domain's MX, any cPanel mailboxes
    of a Harborline hosting plan for the same domain stop receiving mail (hosting_mailbox_coexistence), so the two
    never run side by side for one domain. A domain that is expired, in redemption or transferred out stops delivering
    mail for every subscription that uses it, without changing the subscription's billing.
  eligibility: []
extended_policies:
- id: email_ext_reactivation_renewal
  base_policy_refs:
  - email_renewal_and_instalments
  - email_suspension_and_retention
  - email_mailboxes
  - email_plan_changes
  overwrite:
  - base_policy: email_renewal_and_instalments
    superseded_clause: Renewals and instalments use the product's current seat price for the billing plan, fixed for the whole annual term where price_protected_for_term is true, and apply any scheduled seat count and scheduled product at the renewal.
    replaced_by: Every renewal and instalment other than a reactivation renewal, a term renewal or an annual conversion uses the product's current seat price for the billing plan, fixed for the whole annual term where price_protected_for_term is true, and applies any scheduled seat count and scheduled product at the renewal; a reactivation renewal, a term renewal and an annual conversion are each priced as its own rule states.
  - base_policy: email_suspension_and_retention
    superseded_clause: A suspended subscription is reactivated as soon as the overdue amount is paid, and its term dates are unchanged.
    replaced_by: A suspended subscription other than one this policy prices is reactivated as soon as the overdue amount is paid, and its term dates are unchanged; a suspended email subscription whose renewal due on its term end date went unpaid is reactivated as soon as its reactivation renewal is paid, and the paid renewal starts its new term on the previous term end date.
  - base_policy: email_mailboxes
    superseded_clause: Deleting a mailbox frees its seat but does not reduce the billed seat count.
    replaced_by: Deleting a mailbox frees its seat but does not reduce the billed seat count during the term; only at a reactivation renewal, a term renewal or a seat catch-up are seats figured from the mailbox deletions, each as its own rule states.
  - base_policy: email_plan_changes
    superseded_clause: where retention_on_downgrade is true each mailbox must already fit the lower product's mailbox_storage_gb when the renewal runs, otherwise the change is skipped at that renewal.
    replaced_by: At every renewal other than a reactivation renewal or a term renewal, where retention_on_downgrade is true each mailbox must already fit the lower product's mailbox_storage_gb when the renewal runs, otherwise the change is skipped at that renewal.
  trigger: state_due
  subject:
  - email_renewal_charge
  - email_reactivate
  computes: renewal_amount
  target_tool: reactivate_suspended_mail_4fbd3039
  params:
    starter_annual: 1.99
    starter_monthly: 2.49
    plus_annual: 3.99
    plus_monthly: 4.99
    pro_annual: 5.99
    pro_monthly: 7.49
    basic_annual: 6.0
    basic_amb: 6.3
    basic_monthly: 7.2
    standard_annual: 12.5
    standard_amb: 13.13
    standard_monthly: 15.0
    premium_annual: 22.0
    premium_amb: 23.1
    premium_monthly: 26.4
    late_days_mid: 4
    late_days_long: 15
    late_fee_short: 5.0
    late_fee_mid: 10.0
    late_fee_long: 15.0
    reinstatement_days_short: 4
    reinstatement_days_long: 15
    reinstatement_fee_short: 10.0
    reinstatement_fee_long: 20.0
  rule: 'A reactivation renewal is the renewal paid to reactivate a suspended email subscription whose renewal due on its term end date went unpaid, and this policy prices only a reactivation renewal; every other renewal or instalment remains under the base rule. Every renewal and instalment other than a reactivation renewal, a term renewal or an annual conversion uses the product''s current seat price for the billing plan, fixed for the whole annual term where price_protected_for_term is true, and applies any scheduled seat count and scheduled product at the renewal; a reactivation renewal, a term renewal and an annual conversion are each priced as its own rule states. A suspended subscription other than one this policy prices is reactivated as soon as the overdue amount is paid, and its term dates are unchanged; a suspended email subscription whose renewal due on its term end date went unpaid is reactivated as soon as its reactivation renewal is paid, and the paid renewal starts its new term on the previous term end date. Deleting a mailbox frees its seat but does not reduce the billed seat count during the term; only at a reactivation renewal, a term renewal or a seat catch-up are seats figured from the mailbox deletions, each as its own rule states. A reactivation renewal may be charged only while the subscription status is suspended and only on or before the suspension date plus suspension_retention_days calendar days, the window adding whole calendar days to the suspension date, counting the next day as day 1, with the last day included. Once the reactivation renewal is paid the subscription status is active, its suspension date is cleared, the renewed seats become its seat count, its scheduled seat count is reset to 0, and its new term runs from the previous term end date for 12 calendar months on the annual_prepaid and annual_monthly_billing plans or 1 calendar month on the monthly plan; on the annual_monthly_billing plan the reactivation renewal is the first monthly instalment of the new term. The reactivation renewal is the rounded renewal component plus every fee added to it, rounded half up to the cent. The renewal component is the renewed seats times the plan seat price times the renewal months, reduced by any rate that applies to it, rounded half up to the cent. The plan seat price is the product''s seat_price_annual_prepaid, its annual-commitment price. The renewal months are the calendar months from the term start date to the term end date on the annual_prepaid plan, and 1 on the annual_monthly_billing plan, whose reactivation renewal is the new term''s first monthly instalment, and on the monthly plan. The renewed seats are the seat count on the subscription. No fee is added. The account-tier rate of a reactivation renewal is the email_discount_pct the account charter sets for the tier recorded on the account on the charge date: a Microsoft 365 subscription takes no account-tier rate whatever the tier; otherwise a Harborline Reseller Platinum account takes the Platinum email_discount_pct, a Harborline Reseller Gold account takes the Gold email_discount_pct, a Harborline Reseller Silver account takes the Silver email_discount_pct, a Harborline Reseller Bronze account takes the Bronze email_discount_pct, and any other account takes no account-tier rate. The account-tier rate reduces the renewal component of a reactivation renewal once, before it is rounded; no other percentage is added to it or compounded with it, and it never reduces a fee or a credit. The price column of a reactivation renewal is read from the billing plan and the calendar months of the term: on the annual_monthly_billing plan, a 12-month term billed monthly, it is the annual-billed-monthly column; on the monthly plan, a term of one calendar month, it is the month-to-month column, priced above the annual commitment; otherwise it is the annual-commitment column. The renewal product of a reactivation renewal is read from the scheduled product on the subscription, which is applied at the renewal that falls due on the term end date: a scheduled Harborline Mail Starter, Harborline Mail Plus, Microsoft 365 Business Basic or Microsoft 365 Business Standard, where no upgrade line whose period end is the term end date belongs to the current term, makes that product the renewal product; otherwise, where no product is scheduled or such an upgrade line belongs to the current term, since a move down never takes effect at the renewal that closes a term in which the subscription was moved up, the renewal product is the subscription''s current product. At a reactivation renewal a scheduled lower product is applied even where a mailbox does not fit the lower product''s mailbox_storage_gb: such a mailbox is full and, where send_block_at_full is true, stops sending until space is freed. At every renewal other than a reactivation renewal or a term renewal, where retention_on_downgrade is true each mailbox must already fit the lower product''s mailbox_storage_gb when the renewal runs, otherwise the change is skipped at that renewal. The plan seat price of a reactivation renewal is the renewal product''s seat price in the price column: its seat_price_annual_prepaid in the annual-commitment column, its seat_price_annual_monthly_billing in the annual-billed-monthly column and its seat_price_monthly in the month-to-month column, held here as <product>_annual, <product>_amb and <product>_monthly for every product. The late-payment fee of a reactivation renewal is Harborline''s published flat fee read from the calendar days from the due date, the term end date, to the day it is paid: late_days_long days or more carry late_fee_long, from late_days_mid days up to one day fewer than late_days_long carry late_fee_mid, from 1 day up to one day fewer than late_days_mid carry late_fee_short, and a renewal paid on or before its due date carries no late-payment fee. The late-payment fee is never reduced by any rate and is added to the rounded renewal component. The reinstatement charge of a reactivation renewal is read from the calendar days from the suspension date to the day it is paid: reinstatement_days_long days or more carry reinstatement_fee_long, from reinstatement_days_short days up to one day fewer than reinstatement_days_long carry reinstatement_fee_short, and fewer than reinstatement_days_short days carry no reinstatement charge. The reinstatement charge is Harborline''s published flat fee for reactivating a subscription suspended for non-payment, never reduced by any rate, and it is added to the rounded renewal component. The idle seats of a reactivation renewal are the mailbox deletions recorded on the subscription in the current term less the restores of those deletions, a deletion counting in the current term, and its restore with it, where the whole calendar months from the deletion date to today are no more than the whole calendar months from the term start date to today: where a scheduled seat count is set, the renewed seats are the lower of the scheduled seat count and the seat count on the subscription, but never fewer than the mailboxes in use, the seat count less the idle seats; where no scheduled seat count is set and the idle seats are above zero, they are the seat count less the idle seats; otherwise they are the seat count on the subscription, every licensed seat being billed.'
  prerequisite: []
  cross_category:
  - category: account
    reads:
    - variant_name
    note: The account-tier rate is decided from the tier recorded on the customer's account and its email_discount_pct under the account charter.
    as: branch
  compute:
  - seat_count_now: F('seat_count')
  - scheduled_seats: F('scheduled_seat_count')
  - account_tier: CFIELD('account', 'variant_name')
  - tier_rate: 0 if (F('variant_name') == 'Microsoft 365 Business Basic' or F('variant_name') == 'Microsoft 365 Business Standard' or F('variant_name') == 'Microsoft 365 Business Premium') else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Platinum' else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Gold' else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Silver' else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Bronze' else 0))))
  - price_column: 2 if (F('billing_plan') == 'annual_monthly_billing' and MONTHS(F('term_start_date'), F('term_end_date')) == 12) else (1 if (F('billing_plan') == 'monthly' and MONTHS(F('term_start_date'), F('term_end_date')) == 1) else 0)
  - renewal_product: ('Harborline Mail Starter' if (F('scheduled_variant') == 'Harborline Mail Starter' and COUNT('email_charges', charge_type='upgrade_proration', period_end=F('term_end_date')) == 0) else ('Harborline Mail Plus' if (F('scheduled_variant') == 'Harborline Mail Plus' and COUNT('email_charges', charge_type='upgrade_proration', period_end=F('term_end_date')) == 0) else ('Microsoft 365 Business Basic' if (F('scheduled_variant') == 'Microsoft 365 Business Basic' and COUNT('email_charges', charge_type='upgrade_proration', period_end=F('term_end_date')) == 0) else ('Microsoft 365 Business Standard' if (F('scheduled_variant') == 'Microsoft 365 Business Standard' and COUNT('email_charges', charge_type='upgrade_proration', period_end=F('term_end_date')) == 0) else F('variant_name')))))
  - plan_seat_price: ((K('starter_annual') if price_column == 0 else (K('starter_monthly') if price_column == 1 else 0)) if renewal_product == 'Harborline Mail Starter' else ((K('plus_annual') if price_column == 0 else (K('plus_monthly') if price_column == 1 else 0)) if renewal_product == 'Harborline Mail Plus' else ((K('pro_annual') if price_column == 0 else (K('pro_monthly') if price_column == 1 else 0)) if renewal_product == 'Harborline Mail Pro' else ((K('basic_annual') if price_column == 0 else (K('basic_monthly') if price_column == 1 else K('basic_amb'))) if renewal_product == 'Microsoft 365 Business Basic' else ((K('standard_annual') if price_column == 0 else (K('standard_monthly') if price_column == 1 else K('standard_amb'))) if renewal_product == 'Microsoft 365 Business Standard' else ((K('premium_annual') if price_column == 0 else (K('premium_monthly') if price_column == 1 else K('premium_amb'))) if renewal_product == 'Microsoft 365 Business Premium' else 0))))))
  - renewal_months: MONTHS(F('term_start_date'), F('term_end_date')) if F('billing_plan') == 'annual_prepaid' else 1
  - days_late: DAYS(F('term_end_date'), NOW)
  - late_fee: K('late_fee_long') if days_late >= K('late_days_long') else (K('late_fee_mid') if days_late >= K('late_days_mid') else (K('late_fee_short') if days_late >= 1 else 0))
  - days_suspended: DAYS(F('suspended_date'), NOW)
  - reinstatement_charge: K('reinstatement_fee_long') if days_suspended >= K('reinstatement_days_long') else (K('reinstatement_fee_short') if days_suspended >= K('reinstatement_days_short') else 0)
  - idle_seats: COUNT('email_events', within_months=MONTHS(F('term_start_date'), NOW) + 1, date_field='event_at', event_type='email_mailbox_delete') - COUNT('email_events', within_months=MONTHS(F('term_start_date'), NOW) + 1, date_field='deleted_at', event_type='email_mailbox_restore')
  - renewed_seats: MX(seat_count_now - idle_seats, MN(scheduled_seats, seat_count_now)) if scheduled_seats > 0 else (seat_count_now - idle_seats if idle_seats > 0 else seat_count_now)
  - renewal_component: RND(renewed_seats * plan_seat_price * renewal_months * (100 - tier_rate) / 100 + 0.000000001, 2)
  - result: RND(renewal_component + late_fee + reinstatement_charge + 0.000000001, 2)
  compute_basis:
    seat_count_now: The renewed seats are the seat count on the subscription.
    scheduled_seats: where a scheduled seat count is set, the renewed seats are the lower of the scheduled seat count and the seat count on the subscription, but never fewer than the mailboxes in use, the seat count less the idle seats; where no scheduled seat count is set and the idle seats are above zero, they are the seat count less the idle seats; otherwise they are the seat count on the subscription, every licensed seat being billed.
    account_tier: The account-tier rate of a reactivation renewal is the email_discount_pct the account charter sets for the tier recorded on the account on the charge date
    tier_rate: a Microsoft 365 subscription takes no account-tier rate whatever the tier; otherwise a Harborline Reseller Platinum account takes the Platinum email_discount_pct, a Harborline Reseller Gold account takes the Gold email_discount_pct, a Harborline Reseller Silver account takes the Silver email_discount_pct, a Harborline Reseller Bronze account takes the Bronze email_discount_pct, and any other account takes no account-tier rate.
    price_column: on the annual_monthly_billing plan, a 12-month term billed monthly, it is the annual-billed-monthly column; on the monthly plan, a term of one calendar month, it is the month-to-month column, priced above the annual commitment; otherwise it is the annual-commitment column.
    renewal_product: a scheduled Harborline Mail Starter, Harborline Mail Plus, Microsoft 365 Business Basic or Microsoft 365 Business Standard, where no upgrade line whose period end is the term end date belongs to the current term, makes that product the renewal product; otherwise, where no product is scheduled or such an upgrade line belongs to the current term, since a move down never takes effect at the renewal that closes a term in which the subscription was moved up, the renewal product is the subscription's current product.
    plan_seat_price: 'The plan seat price of a reactivation renewal is the renewal product''s seat price in the price column: its seat_price_annual_prepaid in the annual-commitment column, its seat_price_annual_monthly_billing in the annual-billed-monthly column and its seat_price_monthly in the month-to-month column, held here as <product>_annual, <product>_amb and <product>_monthly for every product.'
    renewal_months: The renewal months are the calendar months from the term start date to the term end date on the annual_prepaid plan, and 1 on the annual_monthly_billing plan, whose reactivation renewal is the new term's first monthly instalment, and on the monthly plan.
    days_late: The late-payment fee of a reactivation renewal is Harborline's published flat fee read from the calendar days from the due date, the term end date, to the day it is paid
    late_fee: late_days_long days or more carry late_fee_long, from late_days_mid days up to one day fewer than late_days_long carry late_fee_mid, from 1 day up to one day fewer than late_days_mid carry late_fee_short, and a renewal paid on or before its due date carries no late-payment fee.
    days_suspended: The reinstatement charge of a reactivation renewal is read from the calendar days from the suspension date to the day it is paid
    reinstatement_charge: reinstatement_days_long days or more carry reinstatement_fee_long, from reinstatement_days_short days up to one day fewer than reinstatement_days_long carry reinstatement_fee_short, and fewer than reinstatement_days_short days carry no reinstatement charge.
    idle_seats: The idle seats of a reactivation renewal are the mailbox deletions recorded on the subscription in the current term less the restores of those deletions, a deletion counting in the current term, and its restore with it, where the whole calendar months from the deletion date to today are no more than the whole calendar months from the term start date to today
    renewed_seats: where a scheduled seat count is set, the renewed seats are the lower of the scheduled seat count and the seat count on the subscription, but never fewer than the mailboxes in use, the seat count less the idle seats; where no scheduled seat count is set and the idle seats are above zero, they are the seat count less the idle seats; otherwise they are the seat count on the subscription, every licensed seat being billed.
    renewal_component: The renewal component is the renewed seats times the plan seat price times the renewal months, reduced by any rate that applies to it, rounded half up to the cent.
    result: The reactivation renewal is the rounded renewal component plus every fee added to it, rounded half up to the cent.
  factors:
  - id: reactivation_tier_rate
    effect: parameter
    decides: tier_rate
    bindings:
    - account_tier
    - tier_rate
    ladder:
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Platinum
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Platinum
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Gold
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Gold
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Silver
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Silver
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Bronze
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Bronze
    - when: otherwise, including every Microsoft 365 subscription and every account below the Reseller tiers
      value: '0'
    baseline:
      tier_rate: '0'
    evidence:
    - cross_category
    cross_difficulty: account
  - id: reactivation_price_column
    effect: parameter
    decides: price_column
    bindings:
    - price_column
    ladder:
    - when: the billing plan is annual_monthly_billing on a 12-month term
      value: the annual-billed-monthly column (seat_price_annual_monthly_billing)
    - when: the billing plan is monthly on a one-month term
      value: the month-to-month column (seat_price_monthly)
    - when: otherwise
      value: the annual-commitment column (seat_price_annual_prepaid)
    baseline:
      price_column: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: reactivation_renewal_product
    effect: parameter
    decides: renewal_product
    bindings:
    - renewal_product
    ladder:
    - when: the scheduled product is Harborline Mail Starter and no upgrade line whose period end is the term end date belongs to the current term
      value: Harborline Mail Starter
    - when: the scheduled product is Harborline Mail Plus and no upgrade line whose period end is the term end date belongs to the current term
      value: Harborline Mail Plus
    - when: the scheduled product is Microsoft 365 Business Basic and no upgrade line whose period end is the term end date belongs to the current term
      value: Microsoft 365 Business Basic
    - when: the scheduled product is Microsoft 365 Business Standard and no upgrade line whose period end is the term end date belongs to the current term
      value: Microsoft 365 Business Standard
    - when: otherwise, no product scheduled, or an upgrade line whose period end is the term end date belongs to the current term
      value: the subscription's current product
    baseline:
      renewal_product: F('variant_name')
    evidence:
    - date
    cross_difficulty: null
  - id: reactivation_late_fee
    effect: parameter
    decides: late_fee
    bindings:
    - days_late
    - late_fee
    ladder:
    - when: late_days_long calendar days or more from the due date to today
      value: K('late_fee_long')
    - when: from late_days_mid up to one day fewer than late_days_long calendar days
      value: K('late_fee_mid')
    - when: from 1 up to one day fewer than late_days_mid calendar days
      value: K('late_fee_short')
    - when: otherwise, paid on or before the due date
      value: '0'
    baseline:
      late_fee: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: reactivation_reinstatement
    effect: parameter
    decides: reinstatement_charge
    bindings:
    - days_suspended
    - reinstatement_charge
    ladder:
    - when: reinstatement_days_long calendar days or more from the suspension date to today
      value: K('reinstatement_fee_long')
    - when: from reinstatement_days_short up to one day fewer than reinstatement_days_long calendar days from the suspension date to today
      value: K('reinstatement_fee_short')
    - when: otherwise
      value: '0'
    baseline:
      reinstatement_charge: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: reactivation_seat_basis
    effect: method
    decides: renewed_seats
    bindings:
    - scheduled_seats
    - idle_seats
    - renewed_seats
    ladder:
    - when: a scheduled seat count is set
      method: the renewed seats are the lower of the scheduled seat count and the seat count, never fewer than the mailboxes in use (seat count less idle seats)
    - when: no scheduled seat count is set and the idle seats of the current term are above zero
      method: the renewed seats are the seat count less the idle seats
    - when: otherwise
      method: the renewed seats are the seat count, every licensed seat billed
    baseline:
      renewed_seats: seat_count_now
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The reactivation renewal is the rounded renewal component plus every fee added to it, rounded half up to the cent. The renewal component is the renewed seats times the plan seat price times the renewal months, reduced by any rate that applies to it, rounded half up to the cent. The plan seat price is the product's seat_price_annual_prepaid, its annual-commitment price. The renewal months are the calendar months from the term start date to the term end date on the annual_prepaid plan, and 1 on the annual_monthly_billing plan, whose reactivation renewal is the new term's first monthly instalment, and on the monthly plan. The renewed seats are the seat count on the subscription. No fee is added.
    params:
    - seat_price_annual_prepaid
  inputs:
    history:
    - table: email_events
      aggregate: count
      field: email_event_id
      filters:
        event_type: email_mailbox_delete
    - table: email_events
      aggregate: count
      field: email_event_id
      filters:
        event_type: email_mailbox_restore
    cross_category:
    - account
- id: email_ext_mail_pro_upgrade
  base_policy_refs:
  - email_plan_changes
  overwrite:
  - base_policy: email_plan_changes
    superseded_clause: A move up to one of the product's upgrade_targets takes effect at once where upgrade_mid_term_allowed is true and is billed as the price difference per seat for the billing plan times the seats times the months of the plan, times the remaining calendar days of the term over its calendar days, rounded half up to the cent.
    replaced_by: A move up to one of the product's upgrade_targets takes effect at once where upgrade_mid_term_allowed is true; a Pro upgrade is billed as this policy states, and every other move up is billed as the price difference per seat for the billing plan times the seats times the months of the plan, times the remaining calendar days of the term over its calendar days, rounded half up to the cent.
  trigger: on_request
  subject:
  - email_plan_change
  computes: upgrade_amount
  target_tool: upgrade_mail_product_74224a57
  params:
    pro_seat_price_annual_prepaid: 5.99
    pro_seat_price_monthly: 7.49
    premium_seat_price_annual_prepaid: 22.0
    premium_seat_price_annual_monthly_billing: 23.1
    premium_seat_price_monthly: 26.4
    upgrade_final_days: 60
    upgrade_period_days: 30
    upgrade_short_days: 15
    late_days_mid: 4
    late_days_long: 15
    late_fee_short: 5.0
    late_fee_mid: 10.0
    late_fee_long: 15.0
    reinstatement_days_short: 4
    reinstatement_days_long: 15
    reinstatement_fee_short: 10.0
    reinstatement_fee_long: 20.0
  rule: 'A Pro upgrade is the move of an email subscription up to the top product of its family, Harborline Mail Pro from Harborline Mail Starter or Plus and Microsoft 365 Business Premium from Microsoft 365 Business Basic or Standard, and this policy prices only a Pro upgrade; every other move up remains under the base rule. A move up to one of the product''s upgrade_targets takes effect at once where upgrade_mid_term_allowed is true; a Pro upgrade is billed as this policy states, and every other move up is billed as the price difference per seat for the billing plan times the seats times the months of the plan, times the remaining calendar days of the term over its calendar days, rounded half up to the cent. A Pro upgrade may be made only while the subscription status is active, and once it is billed the subscription''s product is the target product, Harborline Mail Pro for a Harborline Mail subscription and Microsoft 365 Business Premium for a Microsoft 365 one, for the rest of the term on the same billing plan and term dates, every seat on the subscription being upgraded. The Pro upgrade charge is fixed only after the subscription stands active on a paid term whose term end date lies after today. Once the agent has quoted the Pro upgrade charge, the account holder pays it personally at Harborline''s secure checkout with PayPal, a payment method Harborline never stores on the account, and the upgrade takes effect when that payment completes. The charge that opened the current term is the new-subscription or renewal charge whose period start is the term start date; an added-seat or upgrade line never opens a term. The Pro upgrade charge is the target component less the term credit, rounded half up to the cent. The target component is the upgraded seats times the target seat price times the upgrade months times the upgrade billing fraction, rounded half up to the cent. The term credit is the credit basis less every fee taken off it, times the months it is counted for, times the upgrade billing fraction, rounded half up to the cent. The target seat price is the target product''s annual-commitment price, held here as pro_seat_price_annual_prepaid for Harborline Mail Pro and premium_seat_price_annual_prepaid for Microsoft 365 Business Premium. The upgrade months are the calendar months from the term start date to the term end date on the annual_prepaid and annual_monthly_billing plans and 1 on the monthly plan. The upgraded seats are the seat count on the subscription. The upgrade billing fraction is the calendar days from today to the term end date divided by the calendar days from the term start date to the term end date. The credit basis is the current product''s seat_price_annual_prepaid times the upgraded seats times the upgrade months, counted once, and no fee is taken off it. A Pro upgrade charge is a proration line, so no account-tier rate and no other percentage ever reduces it; the account tier reaches it only through what the charge that opened the current term recorded. The target seat price of a Pro upgrade is read from the billing plan and the calendar months of the term: on the annual_monthly_billing plan, a 12-month term billed monthly, it is premium_seat_price_annual_monthly_billing; on the monthly plan, a term of one calendar month, it is pro_seat_price_monthly for Harborline Mail Pro or premium_seat_price_monthly for Microsoft 365 Business Premium, the month-to-month price above the annual commitment; otherwise it is the target product''s annual-commitment price. pro_seat_price_annual_prepaid, pro_seat_price_monthly, premium_seat_price_annual_prepaid, premium_seat_price_annual_monthly_billing and premium_seat_price_monthly hold the target product''s own seat prices. The upgrade billing fraction of a Pro upgrade turns on where today falls in the term: where the term runs 12 calendar months and today falls before the term start date plus cancellation_window_hours elapsed hours, the hours counted in full 60-minute periods from 00:00 on the term start date and reaching the last hour closing the window, the fraction is 1 and the whole term is billed; where the term runs 12 calendar months, today falls outside that window and the term end date is from 1 to upgrade_final_days calendar days after today, the fraction is the started upgrade_period_days-day periods from today to the term end date divided by 12, a started period counting as a whole one; where the term runs one calendar month and the term end date is from 1 up to one day fewer than upgrade_short_days calendar days after today, the fraction is the whole weeks in those days, each counted as seven days, divided by the calendar days from the term start date to the term end date, Harborline''s short-month convention; otherwise the fraction is the calendar days from today to the term end date divided by the calendar days from the term start date to the term end date. The credit basis of a Pro upgrade is read from the charge that opened the current term: where that charge covers the whole term, the credit basis is its amount, counted once; where it is the first monthly instalment of an annual term billed monthly, the credit basis is its amount, counted for each of the calendar months from the term start date to the term end date; otherwise, where no charge on record opened the current term, the credit basis is the current product''s seat_price_annual_prepaid times the upgraded seats times the upgrade months, counted once. The late-payment fee taken off the credit basis of a Pro upgrade is the late-payment fee the opening renewal charge carried, read from the calendar days from the term start date to the charge date of the opening renewal charge (the renewal charge whose period start is the term start date): late_days_long days or more carried late_fee_long, from late_days_mid days up to one day fewer than late_days_long carried late_fee_mid, from 1 day up to one day fewer than late_days_mid carried late_fee_short, and a charge billed on or before its period start, or no renewal charge on record, carried none. The reinstatement charge taken off the credit basis of a Pro upgrade is the reinstatement charge the opening renewal charge carried, read from the days the subscription had been suspended when it was billed, the calendar days from the term start date to the charge date of the opening renewal charge (the renewal charge whose period start is the term start date) less payment_grace_days less 1: reinstatement_days_long days or more carried reinstatement_fee_long, from reinstatement_days_short days up to one day fewer than reinstatement_days_long carried reinstatement_fee_short, and fewer days, or no renewal charge on record, carried none.'
  prerequisite:
  - problem: email_ext_reactivation_renewal
    kind: value_input
    gate: upgraded_seats
    form: state
    policy_source: The Pro upgrade charge is fixed only after the subscription stands active on a paid term whose term end date lies after today.
    condition: email_holdings.status is active and email_holdings.term_end_date is later than today's date, the current term being covered by a paid new-subscription or renewal charge whose period start is email_holdings.term_start_date.
    resolved_by: reactivate_suspended_mail_4fbd3039
    effect: Once the reactivation renewal is paid the subscription is active on a new term from the previous term end date and its seat count is the renewed seats, so the upgraded seats, the charge that opened the term, its charge date and the term dates the upgrade billing fraction reads all take the renewed term's values.
  cross_category: []
  compute:
  - upgraded_seats: F('seat_count')
  - upgrade_months: MONTHS(F('term_start_date'), F('term_end_date')) if (F('billing_plan') == 'annual_prepaid' or F('billing_plan') == 'annual_monthly_billing') else 1
  - target_seat_price: K('premium_seat_price_annual_monthly_billing') if (F('billing_plan') == 'annual_monthly_billing' and MONTHS(F('term_start_date'), F('term_end_date')) == 12) else ((K('pro_seat_price_monthly') if not (F('variant_name') == 'Microsoft 365 Business Basic' or F('variant_name') == 'Microsoft 365 Business Standard' or F('variant_name') == 'Microsoft 365 Business Premium') else K('premium_seat_price_monthly')) if (F('billing_plan') == 'monthly' and MONTHS(F('term_start_date'), F('term_end_date')) == 1) else (K('pro_seat_price_annual_prepaid') if not (F('variant_name') == 'Microsoft 365 Business Basic' or F('variant_name') == 'Microsoft 365 Business Standard' or F('variant_name') == 'Microsoft 365 Business Premium') else K('premium_seat_price_annual_prepaid')))
  - list_credit: P('seat_price_annual_prepaid') * upgraded_seats * upgrade_months
  - days_left: DAYS(NOW, F('term_end_date'))
  - term_days: DAYS(F('term_start_date'), F('term_end_date'))
  - standard_fraction: days_left / term_days
  - days_into_term: DAYS(F('term_start_date'), NOW)
  - billing_fraction: 1 if (MONTHS(F('term_start_date'), F('term_end_date')) == 12 and days_into_term * 24 < P('cancellation_window_hours')) else (int((days_left + K('upgrade_period_days') - 1) / K('upgrade_period_days')) / 12 if (MONTHS(F('term_start_date'), F('term_end_date')) == 12 and days_left >= 1 and days_left <= K('upgrade_final_days')) else ((int(days_left / 7) * 7) / term_days if (MONTHS(F('term_start_date'), F('term_end_date')) == 1 and days_left >= 1 and days_left < K('upgrade_short_days')) else standard_fraction))
  - credit_open_amount: SUM('email_charges', 'amount', event_type='email_subscription_charge', period_start=F('term_start_date')) + SUM('email_charges', 'amount', event_type='email_renewal_charge', period_start=F('term_start_date'))
  - credit_basis: credit_open_amount if credit_open_amount > 0 else list_credit
  - credit_count: MONTHS(F('term_start_date'), F('term_end_date')) if (F('billing_plan') == 'annual_monthly_billing' and credit_open_amount > 0) else 1
  - late_fee_days: DAYS(F('term_start_date'), LATEST('email_charges', 'charge_date', date_field='charge_date', event_type='email_renewal_charge', period_start=F('term_start_date'))) if LATEST('email_charges', 'charge_date', date_field='charge_date', event_type='email_renewal_charge', period_start=F('term_start_date')) else 0
  - carried_late_fee: K('late_fee_long') if late_fee_days >= K('late_days_long') else (K('late_fee_mid') if late_fee_days >= K('late_days_mid') else (K('late_fee_short') if late_fee_days >= 1 else 0))
  - suspended_days_then: (DAYS(F('term_start_date'), LATEST('email_charges', 'charge_date', date_field='charge_date', event_type='email_renewal_charge', period_start=F('term_start_date'))) if LATEST('email_charges', 'charge_date', date_field='charge_date', event_type='email_renewal_charge', period_start=F('term_start_date')) else 0) - P('payment_grace_days') - 1
  - carried_reinstatement: K('reinstatement_fee_long') if suspended_days_then >= K('reinstatement_days_long') else (K('reinstatement_fee_short') if suspended_days_then >= K('reinstatement_days_short') else 0)
  - target_component: RND(upgraded_seats * target_seat_price * upgrade_months * billing_fraction + 0.000000001, 2)
  - term_credit: RND((credit_basis - carried_late_fee - carried_reinstatement) * credit_count * billing_fraction + 0.000000001, 2)
  - result: RND(target_component - term_credit + 0.000000001, 2)
  compute_basis:
    upgraded_seats: The upgraded seats are the seat count on the subscription.
    upgrade_months: The upgrade months are the calendar months from the term start date to the term end date on the annual_prepaid and annual_monthly_billing plans and 1 on the monthly plan.
    target_seat_price: on the annual_monthly_billing plan, a 12-month term billed monthly, it is premium_seat_price_annual_monthly_billing; on the monthly plan, a term of one calendar month, it is pro_seat_price_monthly for Harborline Mail Pro or premium_seat_price_monthly for Microsoft 365 Business Premium, the month-to-month price above the annual commitment; otherwise it is the target product's annual-commitment price.
    list_credit: The credit basis is the current product's seat_price_annual_prepaid times the upgraded seats times the upgrade months, counted once, and no fee is taken off it.
    days_left: The upgrade billing fraction is the calendar days from today to the term end date divided by the calendar days from the term start date to the term end date.
    term_days: The upgrade billing fraction is the calendar days from today to the term end date divided by the calendar days from the term start date to the term end date.
    standard_fraction: The upgrade billing fraction is the calendar days from today to the term end date divided by the calendar days from the term start date to the term end date.
    days_into_term: The upgrade billing fraction of a Pro upgrade turns on where today falls in the term
    billing_fraction: where the term runs 12 calendar months and today falls before the term start date plus cancellation_window_hours elapsed hours, the hours counted in full 60-minute periods from 00:00 on the term start date and reaching the last hour closing the window, the fraction is 1 and the whole term is billed; where the term runs 12 calendar months, today falls outside that window and the term end date is from 1 to upgrade_final_days calendar days after today, the fraction is the started upgrade_period_days-day periods from today to the term end date divided by 12, a started period counting as a whole one; where the term runs one calendar month and the term end date is from 1 up to one day fewer than upgrade_short_days calendar days after today, the fraction is the whole weeks in those days, each counted as seven days, divided by the calendar days from the term start date to the term end date, Harborline's short-month convention; otherwise the fraction is the calendar days from today to the term end date divided by the calendar days from the term start date to the term end date.
    credit_open_amount: The credit basis of a Pro upgrade is read from the charge that opened the current term
    credit_basis: where that charge covers the whole term, the credit basis is its amount, counted once; where it is the first monthly instalment of an annual term billed monthly, the credit basis is its amount, counted for each of the calendar months from the term start date to the term end date; otherwise, where no charge on record opened the current term, the credit basis is the current product's seat_price_annual_prepaid times the upgraded seats times the upgrade months, counted once.
    late_fee_days: The late-payment fee taken off the credit basis of a Pro upgrade is the late-payment fee the opening renewal charge carried, read from the calendar days from the term start date to the charge date of the opening renewal charge (the renewal charge whose period start is the term start date)
    carried_late_fee: late_days_long days or more carried late_fee_long, from late_days_mid days up to one day fewer than late_days_long carried late_fee_mid, from 1 day up to one day fewer than late_days_mid carried late_fee_short, and a charge billed on or before its period start, or no renewal charge on record, carried none.
    suspended_days_then: The reinstatement charge taken off the credit basis of a Pro upgrade is the reinstatement charge the opening renewal charge carried, read from the days the subscription had been suspended when it was billed, the calendar days from the term start date to the charge date of the opening renewal charge (the renewal charge whose period start is the term start date) less payment_grace_days less 1
    carried_reinstatement: reinstatement_days_long days or more carried reinstatement_fee_long, from reinstatement_days_short days up to one day fewer than reinstatement_days_long carried reinstatement_fee_short, and fewer days, or no renewal charge on record, carried none.
    target_component: The target component is the upgraded seats times the target seat price times the upgrade months times the upgrade billing fraction, rounded half up to the cent.
    term_credit: The term credit is the credit basis less every fee taken off it, times the months it is counted for, times the upgrade billing fraction, rounded half up to the cent.
    result: The Pro upgrade charge is the target component less the term credit, rounded half up to the cent.
    credit_count: where that charge covers the whole term, the credit basis is its amount, counted once; where it is the first monthly instalment of an annual term billed monthly, the credit basis is its amount, counted for each of the calendar months from the term start date to the term end date; otherwise, where no charge on record opened the current term, the credit basis is the current product's seat_price_annual_prepaid times the upgraded seats times the upgrade months, counted once.
  factors:
  - id: pro_upgrade_plan_price
    effect: parameter
    decides: target_seat_price
    bindings:
    - target_seat_price
    ladder:
    - when: the billing plan is annual_monthly_billing on a 12-month term
      value: premium_seat_price_annual_monthly_billing
    - when: the billing plan is monthly on a one-month term
      value: pro_seat_price_monthly or premium_seat_price_monthly
    - when: otherwise
