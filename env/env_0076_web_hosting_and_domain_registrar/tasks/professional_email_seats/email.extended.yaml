    baseline:
      target_seat_price: K('pro_seat_price_annual_prepaid') if not (F('variant_name') == 'Microsoft 365 Business Basic' or F('variant_name') == 'Microsoft 365 Business Standard' or F('variant_name') == 'Microsoft 365 Business Premium') else K('premium_seat_price_annual_prepaid')
    evidence:
