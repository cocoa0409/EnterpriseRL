- id: email_ext_unbilled_seat_catch_up
  base_policy_refs:
  - email_seat_changes
  - email_plan_changes
  - email_agg_m365_seat_cap
  - email_mailboxes
  overwrite:
  - base_policy: email_seat_changes
    superseded_clause: 'Added seats take effect at once and are billed prorated_daily to the term end: seats added times the seat price for the billing plan times the months of the plan, times the calendar days from today to the term end date divided by the calendar days of the term, rounded half up to the cent.'
    replaced_by: 'Added seats take effect at once and, other than in a seat catch-up, are billed prorated_daily to the term end: seats added times the seat price for the billing plan times the months of the plan, times the calendar days from today to the term end date divided by the calendar days of the term, rounded half up to the cent; a seat catch-up is billed as this policy states.'
  - base_policy: email_mailboxes
    superseded_clause: Deleting a mailbox frees its seat but does not reduce the billed seat count.
    replaced_by: Deleting a mailbox frees its seat but does not reduce the billed seat count during the term; only at a reactivation renewal, a term renewal or a seat catch-up are seats figured from the mailbox deletions, each as its own rule states.
  trigger: state_due
  subject:
  - email_seat_charge
  computes: catch_up_amount
  target_tool: bill_unbilled_mail_seats_5cd17f30
  params:
    catch_up_short_days: 15
  rule: 'A seat catch-up is the billing of the seats an email subscription carries beyond the seats billed for its current term, and this policy prices only a seat catch-up; seats added and billed when they were added remain under the base rule. Added seats take effect at once and, other than in a seat catch-up, are billed prorated_daily to the term end: seats added times the seat price for the billing plan times the months of the plan, times the calendar days from today to the term end date divided by the calendar days of the term, rounded half up to the cent; a seat catch-up is billed as this policy states. Deleting a mailbox frees its seat but does not reduce the billed seat count during the term; only at a reactivation renewal, a term renewal or a seat catch-up are seats figured from the mailbox deletions, each as its own rule states. A seat catch-up may be billed only while the subscription status is active; it is one added-seat line for the current term on record, from the term start date to the term end date, on every billing plan, and it never changes the seat count. The charge that opened the current term is the new-subscription or renewal charge whose period start is the term start date; an added-seat or upgrade line never opens a term. The seats billed for the current term are the seats on the charge that opened the current term plus the seats on added-seat lines whose period end is the term end date. The seat catch-up charge is the catch-up seats times the plan seat price times the catch-up months times the catch-up fraction, reduced by any rate that applies to it, rounded half up to the cent once, on the final figure. The catch-up seats are the catch-up target less the seats billed for the current term, never fewer than zero. The catch-up target is the seat count on the subscription. The plan seat price is the product''s seat_price_annual_prepaid, its annual-commitment price. The catch-up months are the calendar months from the term start date to the term end date, the months the line covers. The catch-up fraction is the calendar days from today to the term end date divided by the calendar days from the term start date to the term end date, the base proration of added seats, never below zero. The account-tier rate of a seat catch-up is the email_discount_pct the account charter sets for the tier recorded on the account on the charge date: a Microsoft 365 subscription takes no account-tier rate whatever the tier; otherwise a Harborline Reseller Platinum account takes the Platinum email_discount_pct, a Harborline Reseller Gold account takes the Gold email_discount_pct, a Harborline Reseller Silver account takes the Silver email_discount_pct, a Harborline Reseller Bronze account takes the Bronze email_discount_pct, and any other account takes no account-tier rate. The account-tier rate reduces the seat catch-up charge once, before it is rounded; no other percentage is added to it or compounded with it, and it never reduces a fee or a credit. The plan seat price of a seat catch-up is read from the billing plan and the calendar months of the term: on the annual_monthly_billing plan, a 12-month term billed monthly, it is the product''s seat_price_annual_monthly_billing; on the monthly plan, a term of one calendar month, it is the product''s seat_price_monthly, the month-to-month price above the annual commitment; otherwise it is the product''s seat_price_annual_prepaid. The idle seats of a seat catch-up are the mailbox deletions recorded on the subscription in the current term less the restores of those deletions, a deletion counting in the current term, and its restore with it, where the whole calendar months from the deletion date to today are no more than the whole calendar months from the term start date to today: where a scheduled seat count is set, the catch-up target are the lower of the scheduled seat count and the seat count on the subscription, but never fewer than the mailboxes in use, the seat count less the idle seats; where no scheduled seat count is set and the idle seats are above zero, they are the seat count less the idle seats; otherwise they are the seat count on the subscription, every licensed seat being billed. The catch-up fraction of a seat catch-up turns on where the term stands today: where the term end date has passed and its renewal is still due, the seats went unbilled for the whole term, so the fraction is 1; where the term runs one calendar month and from 1 up to one day fewer than catch_up_short_days days are left, the fraction is the whole weeks left, each counted as seven days, divided by the calendar days of the term, Harborline''s short-month convention; otherwise the fraction is the calendar days from today to the term end date divided by the calendar days of the term.'
  prerequisite: []
  cross_category:
  - category: account
    reads:
    - variant_name
    note: The account-tier rate is decided from the tier recorded on the customer's account and its email_discount_pct under the account charter.
    as: branch
  compute:
  - term_opening_seats: SUM('email_charges', 'seats', event_type='email_subscription_charge', period_start=F('term_start_date')) + SUM('email_charges', 'seats', event_type='email_renewal_charge', period_start=F('term_start_date'))
  - term_added_seats: SUM('email_charges', 'seats', event_type='email_seat_charge', charge_type='added_seats', period_end=F('term_end_date'))
  - billed_term_seats: term_opening_seats + term_added_seats
  - seat_count_now: F('seat_count')
  - scheduled_seats: F('scheduled_seat_count')
  - account_tier: CFIELD('account', 'variant_name')
  - tier_rate: 0 if (F('variant_name') == 'Microsoft 365 Business Basic' or F('variant_name') == 'Microsoft 365 Business Standard' or F('variant_name') == 'Microsoft 365 Business Premium') else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Platinum' else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Gold' else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Silver' else (CPARAM('account', 'email_discount_pct') if account_tier == 'Harborline Reseller Bronze' else 0))))
  - plan_seat_price: P('seat_price_annual_monthly_billing') if (F('billing_plan') == 'annual_monthly_billing' and MONTHS(F('term_start_date'), F('term_end_date')) == 12) else (P('seat_price_monthly') if (F('billing_plan') == 'monthly' and MONTHS(F('term_start_date'), F('term_end_date')) == 1) else P('seat_price_annual_prepaid'))
  - catch_up_months: MONTHS(F('term_start_date'), F('term_end_date'))
  - idle_seats: COUNT('email_events', within_months=MONTHS(F('term_start_date'), NOW) + 1, date_field='event_at', event_type='email_mailbox_delete') - COUNT('email_events', within_months=MONTHS(F('term_start_date'), NOW) + 1, date_field='deleted_at', event_type='email_mailbox_restore')
  - catch_up_target: MX(seat_count_now - idle_seats, MN(scheduled_seats, seat_count_now)) if scheduled_seats > 0 else (seat_count_now - idle_seats if idle_seats > 0 else seat_count_now)
  - cu_days_left: DAYS(NOW, F('term_end_date'))
  - catch_up_fraction: 1 if cu_days_left <= 0 else ((int(cu_days_left / 7) * 7) / DAYS(F('term_start_date'), F('term_end_date')) if (MONTHS(F('term_start_date'), F('term_end_date')) == 1 and cu_days_left < K('catch_up_short_days')) else cu_days_left / DAYS(F('term_start_date'), F('term_end_date')))
  - catch_up_seats: MX(0, catch_up_target - billed_term_seats)
  - result: RND(catch_up_seats * plan_seat_price * catch_up_months * catch_up_fraction * (100 - tier_rate) / 100 + 0.000000001, 2)
  compute_basis:
    term_opening_seats: The seats billed for the current term are the seats on the charge that opened the current term plus the seats on added-seat lines whose period end is the term end date.
    term_added_seats: The seats billed for the current term are the seats on the charge that opened the current term plus the seats on added-seat lines whose period end is the term end date.
    billed_term_seats: The seats billed for the current term are the seats on the charge that opened the current term plus the seats on added-seat lines whose period end is the term end date.
    seat_count_now: The catch-up target is the seat count on the subscription.
    scheduled_seats: where a scheduled seat count is set, the catch-up target are the lower of the scheduled seat count and the seat count on the subscription, but never fewer than the mailboxes in use, the seat count less the idle seats; where no scheduled seat count is set and the idle seats are above zero, they are the seat count less the idle seats; otherwise they are the seat count on the subscription, every licensed seat being billed.
    account_tier: The account-tier rate of a seat catch-up is the email_discount_pct the account charter sets for the tier recorded on the account on the charge date
    tier_rate: a Microsoft 365 subscription takes no account-tier rate whatever the tier; otherwise a Harborline Reseller Platinum account takes the Platinum email_discount_pct, a Harborline Reseller Gold account takes the Gold email_discount_pct, a Harborline Reseller Silver account takes the Silver email_discount_pct, a Harborline Reseller Bronze account takes the Bronze email_discount_pct, and any other account takes no account-tier rate.
    catch_up_months: The catch-up months are the calendar months from the term start date to the term end date, the months the line covers.
    idle_seats: The idle seats of a seat catch-up are the mailbox deletions recorded on the subscription in the current term less the restores of those deletions, a deletion counting in the current term, and its restore with it, where the whole calendar months from the deletion date to today are no more than the whole calendar months from the term start date to today
    catch_up_seats: The catch-up seats are the catch-up target less the seats billed for the current term, never fewer than zero.
    result: The seat catch-up charge is the catch-up seats times the plan seat price times the catch-up months times the catch-up fraction, reduced by any rate that applies to it, rounded half up to the cent once, on the final figure.
    plan_seat_price: on the annual_monthly_billing plan, a 12-month term billed monthly, it is the product's seat_price_annual_monthly_billing; on the monthly plan, a term of one calendar month, it is the product's seat_price_monthly, the month-to-month price above the annual commitment; otherwise it is the product's seat_price_annual_prepaid.
    catch_up_target: where a scheduled seat count is set, the catch-up target are the lower of the scheduled seat count and the seat count on the subscription, but never fewer than the mailboxes in use, the seat count less the idle seats; where no scheduled seat count is set and the idle seats are above zero, they are the seat count less the idle seats; otherwise they are the seat count on the subscription, every licensed seat being billed.
    cu_days_left: The catch-up fraction of a seat catch-up turns on where the term stands today
    catch_up_fraction: where the term end date has passed and its renewal is still due, the seats went unbilled for the whole term, so the fraction is 1; where the term runs one calendar month and from 1 up to one day fewer than catch_up_short_days days are left, the fraction is the whole weeks left, each counted as seven days, divided by the calendar days of the term, Harborline's short-month convention; otherwise the fraction is the calendar days from today to the term end date divided by the calendar days of the term.
  factors:
  - id: catch_up_tier_rate
    effect: parameter
    decides: tier_rate
    bindings:
    - account_tier
    - tier_rate
    ladder:
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Platinum
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Platinum
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Gold
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Gold
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Silver
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Silver
    - when: a Harborline Mail subscription whose account's tier recorded on the charge date is Harborline Reseller Bronze
      value: CPARAM('account', 'email_discount_pct') of Harborline Reseller Bronze
    - when: otherwise, including every Microsoft 365 subscription and every account below the Reseller tiers
      value: '0'
    baseline:
      tier_rate: '0'
    evidence:
    - cross_category
    cross_difficulty: account
  - id: catch_up_plan_price
    effect: parameter
    decides: plan_seat_price
    bindings:
    - plan_seat_price
    ladder:
    - when: the billing plan is annual_monthly_billing on a 12-month term
      value: the product's seat_price_annual_monthly_billing
    - when: the billing plan is monthly on a one-month term
      value: the product's seat_price_monthly
    - when: otherwise
      value: the product's seat_price_annual_prepaid
    baseline:
      plan_seat_price: P('seat_price_annual_prepaid')
    evidence:
    - date
    cross_difficulty: null
  - id: catch_up_seat_basis
    effect: method
    decides: catch_up_target
    bindings:
    - scheduled_seats
    - idle_seats
    - catch_up_target
    ladder:
    - when: a scheduled seat count is set
      method: the catch-up target are the lower of the scheduled seat count and the seat count, never fewer than the mailboxes in use (seat count less idle seats)
    - when: no scheduled seat count is set and the idle seats of the current term are above zero
      method: the catch-up target are the seat count less the idle seats
    - when: otherwise
      method: the catch-up target are the seat count, every licensed seat billed
    baseline:
      catch_up_target: seat_count_now
    evidence:
    - history
    cross_difficulty: null
  - id: catch_up_billing_span
    effect: method
    decides: catch_up_fraction
    bindings:
    - cu_days_left
    - catch_up_fraction
    ladder:
    - when: the term end date has passed and its renewal is still due
      method: the fraction is 1, the whole term
    - when: a one-calendar-month term with 1 up to one day fewer than catch_up_short_days days left
      method: the whole weeks left, seven days each, over the calendar days of the term
    - when: otherwise
      method: the calendar days from today to the term end date over the calendar days of the term
    baseline:
      catch_up_fraction: MX(0, cu_days_left / DAYS(F('term_start_date'), F('term_end_date')))
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The seat catch-up charge is the catch-up seats times the plan seat price times the catch-up months times the catch-up fraction, reduced by any rate that applies to it, rounded half up to the cent once, on the final figure. The catch-up seats are the catch-up target less the seats billed for the current term, never fewer than zero. The catch-up target is the seat count on the subscription. The plan seat price is the product's seat_price_annual_prepaid, its annual-commitment price. The catch-up months are the calendar months from the term start date to the term end date, the months the line covers. The catch-up fraction is the calendar days from today to the term end date divided by the calendar days from the term start date to the term end date, the base proration of added seats, never below zero.
