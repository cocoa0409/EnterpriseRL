- id: email_ext_term_renewal
  base_policy_refs:
  - email_renewal_and_instalments
  - email_mailboxes
  - email_plan_changes
  overwrite:
  - base_policy: email_renewal_and_instalments
    superseded_clause: Renewals and instalments use the product's current seat price for the billing plan, fixed for the whole annual term where price_protected_for_term is true, and apply any scheduled seat count and scheduled product at the renewal.
    replaced_by: Every renewal and instalment other than a reactivation renewal, a term renewal or an annual conversion uses the product's current seat price for the billing plan, fixed for the whole annual term where price_protected_for_term is true, and applies any scheduled seat count and scheduled product at the renewal; a reactivation renewal, a term renewal and an annual conversion are each priced as its own rule states.
  - base_policy: email_mailboxes
    superseded_clause: Deleting a mailbox frees its seat but does not reduce the billed seat count.
    replaced_by: Deleting a mailbox frees its seat but does not reduce the billed seat count during the term; only at a reactivation renewal, a term renewal or a seat catch-up are seats figured from the mailbox deletions, each as its own rule states.
  - base_policy: email_plan_changes
    superseded_clause: where retention_on_downgrade is true each mailbox must already fit the lower product's mailbox_storage_gb when the renewal runs, otherwise the change is skipped at that renewal.
    replaced_by: At every renewal other than a reactivation renewal or a term renewal, where retention_on_downgrade is true each mailbox must already fit the lower product's mailbox_storage_gb when the renewal runs, otherwise the change is skipped at that renewal.
  trigger: state_due
  subject:
  - email_renewal_charge
  computes: renewal_amount
  target_tool: pay_late_mail_renewal_a889cd52
  params:
    starter_annual: 1.99
    starter_monthly: 2.49
    plus_annual: 3.99
    plus_monthly: 4.99
    pro_annual: 5.99
    pro_monthly: 7.49
    basic_annual: 6.0
    basic_amb: 6.3
    basic_monthly: 7.2
    standard_annual: 12.5
    standard_amb: 13.13
    standard_monthly: 15.0
    premium_annual: 22.0
    premium_amb: 23.1
    premium_monthly: 26.4
    late_days_mid: 4
    late_days_long: 15
    late_fee_short: 5.0
    late_fee_mid: 10.0
    late_fee_long: 15.0
  rule: 'A term renewal is the renewal of an active email subscription that falls due on its term end date, billed on or before its due date or, as a late renewal, after it while the subscription status is still active; this policy prices only a term renewal, and every other renewal or instalment remains under the base rule. Every renewal and instalment other than a reactivation renewal, a term renewal or an annual conversion uses the product''s current seat price for the billing plan, fixed for the whole annual term where price_protected_for_term is true, and applies any scheduled seat count and scheduled product at the renewal; a reactivation renewal, a term renewal and an annual conversion are each priced as its own rule states. Deleting a mailbox frees its seat but does not reduce the billed seat count during the term; only at a reactivation renewal, a term renewal or a seat catch-up are seats figured from the mailbox deletions, each as its own rule states. A term renewal may be charged only while the subscription status is active, and once it is paid the renewed seats become the seat count, the scheduled seat count is reset to 0 and the new term runs from the previous term end date for 1 calendar month on the monthly plan or 12 calendar months on the annual_prepaid and annual_monthly_billing plans; on the annual_monthly_billing plan the term renewal is the first monthly instalment of the new term. A late renewal is not collected until the charges of the current term carry at least the seats it renews. The charge that opened the current term is the new-subscription or renewal charge whose period start is the term start date; an added-seat or upgrade line never opens a term. The term renewal is the rounded renewal component plus every fee added to it, rounded half up to the cent. The renewal component is the renewed seats times the plan seat price times the renewal months, reduced by any rate that applies to it, rounded half up to the cent. The plan seat price is the product''s seat_price_annual_prepaid, its annual-commitment price. The renewal months are the calendar months from the term start date to the term end date on the annual_prepaid and monthly plans, and 1 on the annual_monthly_billing plan, whose term renewal is the new term''s first monthly instalment. The renewed seats are the seat count on the subscription. No fee is added. The account-tier rate of a term renewal is the email_discount_pct the account charter sets for the tier recorded on the account on the charge date: a Microsoft 365 subscription takes no account-tier rate whatever the tier; otherwise a Harborline Reseller Platinum account takes the Platinum email_discount_pct, a Harborline Reseller Gold account takes the Gold email_discount_pct, a Harborline Reseller Silver account takes the Silver email_discount_pct, a Harborline Reseller Bronze account takes the Bronze email_discount_pct, and any other account takes no account-tier rate. The account-tier rate reduces the renewal component of a term renewal once, before it is rounded; no other percentage is added to it or compounded with it, and it never reduces a fee or a credit. The price column of a term renewal is read from the billing plan and the calendar months of the term: on the annual_monthly_billing plan, a 12-month term billed monthly, it is the annual-billed-monthly column; on the monthly plan, a term of one calendar month, it is the month-to-month column, priced above the annual commitment; otherwise it is the annual-commitment column. The renewal product of a term renewal is read from the scheduled product on the subscription, which is applied at the renewal that falls due on the term end date: a scheduled Harborline Mail Starter, Harborline Mail Plus, Microsoft 365 Business Basic or Microsoft 365 Business Standard, where no upgrade line whose period end is the term end date belongs to the current term, makes that product the renewal product; otherwise, where no product is scheduled or such an upgrade line belongs to the current term, since a move down never takes effect at the renewal that closes a term in which the subscription was moved up, the renewal product is the subscription''s current product. At a term renewal a scheduled lower product is applied even where a mailbox does not fit the lower product''s mailbox_storage_gb: such a mailbox is full and, where send_block_at_full is true, stops sending until space is freed. At every renewal other than a reactivation renewal or a term renewal, where retention_on_downgrade is true each mailbox must already fit the lower product''s mailbox_storage_gb when the renewal runs, otherwise the change is skipped at that renewal. The plan seat price of a term renewal is the renewal product''s seat price in the price column: its seat_price_annual_prepaid in the annual-commitment column, its seat_price_annual_monthly_billing in the annual-billed-monthly column and its seat_price_monthly in the month-to-month column, held here as <product>_annual, <product>_amb and <product>_monthly for every product. The late-payment fee of a term renewal is Harborline''s published flat fee read from the calendar days from the due date, the term end date, to the day it is paid: late_days_long days or more carry late_fee_long, from late_days_mid days up to one day fewer than late_days_long carry late_fee_mid, from 1 day up to one day fewer than late_days_mid carry late_fee_short, and a renewal paid on or before its due date carries no late-payment fee. The late-payment fee is never reduced by any rate and is added to the rounded renewal component. The idle seats of a term renewal are the mailbox deletions recorded on the subscription in the current term less the restores of those deletions, a deletion counting in the current term, and its restore with it, where the whole calendar months from the deletion date to today are no more than the whole calendar months from the term start date to today: where a scheduled seat count is set, the renewed seats are the lower of the scheduled seat count and the seat count on the subscription, but never fewer than the mailboxes in use, the seat count less the idle seats; where no scheduled seat count is set and the idle seats are above zero, they are the seat count less the idle seats; otherwise they are the seat count on the subscription, every licensed seat being billed.'
  prerequisite:
  - problem: email_ext_unbilled_seat_catch_up
    kind: state_gate
    gate: email_charges.seats
    form: state
    policy_source: A late renewal is not collected until the charges of the current term carry at least the seats it renews.
    condition: 'The seats on the charge that opened the current term plus the seats on added-seat lines whose period end is the term end date are at least the renewed seats: where a scheduled seat count is set, the lower of it and the seat count but never fewer than the seat count less the idle seats of the current term; otherwise the seat count less those idle seats.'
