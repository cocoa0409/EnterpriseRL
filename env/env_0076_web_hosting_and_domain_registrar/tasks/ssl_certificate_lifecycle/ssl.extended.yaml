  compute:
  - n_extra: F('extra_names')
  - name_rate: P('additional_name_price_per_year')
  - term_years: >-
      MN((LATEST('ssl_charges', 'years', date_field='charge_date', event_type='ssl_renewal_charge') if COUNT('ssl_charges',
      event_type='ssl_renewal_charge') > 0 else MAX('ssl_charges', 'years', event_type='ssl_purchase_charge')), P('max_subscription_years'))
  - year_price: >-
      P('price_3yr_per_year') if term_years == 3 else (P('price_2yr_per_year') if term_years == 2 else P('price_1yr'))
  - names_part: >-
      (K('ar_band1_start') * name_rate + (K('ar_band2_start') - K('ar_band1_start')) * name_rate * K('ar_band1_pct') / 100
      + (n_extra - K('ar_band2_start')) * name_rate * K('ar_band2_pct') / 100) if (n_extra > K('ar_band2_start') and (LATEST('ssl_charges',
