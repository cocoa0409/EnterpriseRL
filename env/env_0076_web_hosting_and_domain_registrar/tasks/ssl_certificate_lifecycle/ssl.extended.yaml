# Product charter — SSL/TLS Certificates (category: ssl). Single registry of every quantified policy of this category.
category: ssl
display_name: SSL/TLS Certificates
binding:
  holding_table: ssl_holdings
  event_tables:
  - ssl_charges
  - ssl_events
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - pending_validation
  - active
  - expired
  - revoked
  - cancelled
  transitions:
  - from: pending_validation
    to: active
    by: system
    means: Validation completes and the certificate authority issues the first certificate of the subscription.
  - from: pending_validation
    to: cancelled
    by: system
    means: An order still unvalidated when its validation window ends is cancelled.
  - from: pending_validation
    to: cancelled
    by: user
    means: The customer cancels an order before any certificate is issued.
  - from: active
    to: expired
    by: system
    means: The subscription end date passes without renewal and the last certificate lapses.
  - from: active
    to: revoked
    by: agent
    means: The certificate is revoked and the subscription ended, for a refund or at the customer's revocation request.
accounts:
- key: ssl_billed
  unit: USD
  meaning: 'Net amount billed for one certificate subscription: purchase, renewal, added names and installation
    charges add to it; refunds take away from it.'
parameter_schema:
  price_1yr: Price of a 1-year subscription, USD
  price_2yr_per_year: Price per year of a 2-year subscription, USD
  price_3yr_per_year: Price per year of a 3-year subscription, USD
  included_names: Fully qualified names covered by the base price (the www and bare forms of one name count as one)
  additional_name_price_per_year: Price per year of each name beyond the included ones, USD (0.00 where extra names
    are not offered)
  max_names: Largest number of names one certificate may cover
  wildcard_supported: Whether the certificate covers all first-level subdomains of the name, boolean
  validation_level: 'Validation level: dv, ov or ev'
  max_cert_validity_days: Longest validity of one issued certificate under the CA/Browser Forum Baseline Requirements
    in force, days
  dcv_reuse_days: Days a completed domain control validation may be reused for issuance or reissue
  org_validation_reuse_days: Days a completed organisation (or extended) validation may be reused (0 where none
    is performed)
  issuance_target_business_days: Business days, Monday-Friday excluding US federal holidays, targeted from order
    to issuance once documents are complete (0 = same day)
  dcv_methods: Domain control validation methods accepted, list of dns_cname, http_file, approver_email
  approver_email_prefixes: Mailbox names at the domain accepted for approver email validation, list
  auto_dcv_with_harborline_dns: Whether DNS validation is completed automatically when the domain is registered
    with Harborline, active and on Harborline DNS, boolean
  pending_validation_expiry_days: Calendar days after the order date after which an order still pending validation
    is cancelled
  callback_verification_required: Whether a verified telephone callback to the organisation is required, boolean
  legal_entity_required: Whether the subscriber must be a registered legal entity, boolean
  org_documents_accepted: Organisation evidence accepted, list
  max_subscription_years: Longest subscription that can be bought or renewed at once, years
  reissue_fee: Fee per reissue within the subscription, USD
  max_reissues_per_30d: Largest number of reissues per certificate in a trailing 30 days
  auto_reissue_days_before_cert_expiry: Days before the current certificate's expiry on which the next certificate
    of the subscription is issued automatically where validation can complete automatically
  renewal_early_days: Days before the subscription end date from which a renewal may be bought
  renewal_extends_from: 'Date a renewal extends the subscription from: subscription_end_date'
  auto_renew_default_on: Whether auto-renew is on by default, boolean
  auto_renew_days_before_end: Days before the subscription end date on which the auto-renew charge is attempted
  expiry_reminder_days_before: Days before the subscription end date on which reminder emails are sent, list
  refund_window_days: Calendar days after a subscription purchase or renewal charge within which it may be refunded
    in full
  refund_requires_revocation: Whether a refund of an issued subscription revokes its certificate, boolean
  refund_after_window_allowed: Whether any part of a charge is refunded after the refund window, boolean
  name_addition_proration_basis: 'How an added name is priced mid-term: remaining_days_of_subscription over 365
    per year price'
  name_removal_refundable: Whether removing a name refunds any amount, boolean
  installation_fee: Fee for installation by Harborline support on a server not hosted by Harborline, USD
  hosting_install_free: Whether installation on a Harborline hosting plan is free and automatic, boolean
  installation_fee_refundable_if_not_performed: Whether the installation fee is refunded when the installation was
    never performed, boolean
  warranty_usd: Relying-party warranty of the issuing CA, USD
  site_seal: 'Site seal type provided: dv_seal, ov_seal or ev_seal'
  key_types: Key types accepted in a certificate request, list
  duplicate_certificates_allowed: Whether extra copies of the same certificate for other servers can be issued at
    no charge, boolean
  revocation_fee: Fee to revoke a certificate, USD
  replacement_after_key_compromise: Whether a certificate revoked for key compromise is replaced by a free reissue
    within the same subscription, boolean
  ct_logging: Whether certificates are logged to public Certificate Transparency logs, boolean
  ownership_dcv_on_registrant_change: Whether a change of registrant of the covered domain voids reuse of earlier
    domain validation, boolean
  org_validation_shared_across_orders: Whether a completed organisation validation also serves the customer's other
    OV and EV orders for the same organisation, boolean
  volume_discount_ladder: Discount on certificate prices for one order containing several new subscriptions, list
    of {min_certificates, discount_pct}
  price_rounding: 'Rounding of every computed certificate amount: half_up_to_cent'
  max_cert_validity_days_from_2027_03_15: Longest validity of one issued certificate from 15 March 2027 under the
    Baseline Requirements schedule, days
