    domain registration in status active carries the Harborline domain credit ar_dns_credit where that registration's nameservers
    are harborline_dns, domain validation there completing automatically, and ar_reg_credit where its nameservers are external;
    every other auto-renew charge carries no Harborline domain credit. The extra names of an auto-renew charge are priced
    at the multi-year name rate of the renewed term: for a three-year renewal each name's yearly price is multiplied by price_3yr_per_year
    divided by price_1yr, for a two-year renewal by price_2yr_per_year divided by price_1yr, and for a one-year renewal it
