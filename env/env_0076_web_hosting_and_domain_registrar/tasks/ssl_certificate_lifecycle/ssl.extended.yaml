      Where auto_renew is true the renewal for the same number of years as the last term, capped at max_subscription_years,
      is charged auto_renew_days_before_end days before the subscription end date using the account charter's funding order.
    replaced_by: >-
      An auto-renew charge falls due auto_renew_days_before_end days before the subscription end date of a subscription whose
      auto_renew is true and whose billing carries no renewal or auto-renew line for the term starting on that end date, and
      it is owed from that day; every support renewal is priced under the support renewal rule, and every renewal bought in
      the dashboard remains under the base renewal rule, which bills the tier's price for the years renewed plus the extra
      names for those years, reduced by the account tier's ssl_discount_pct and rounded half up to the cent; the volume ladder
      never applies to an auto-renew charge. Every auto-renew charge that falls due is priced under the auto-renew charge
      rule, whatever pays it, and account credit pays it first, following the account charter: where the account credit balance
      on the day the charge falls due covers that amount in full, the account's credit run books it at that amount from account
      credit, and otherwise it is charged in full to the default card on file at that amount and booked under the auto-renew
      charge rule.
  - base_policy: ssl_renewal
    superseded_clause: >-
