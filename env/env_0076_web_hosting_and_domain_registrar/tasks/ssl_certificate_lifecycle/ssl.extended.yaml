  rule: >-
    An auto-renew charge falls due auto_renew_days_before_end days before the subscription end date of a subscription whose
    auto_renew is true and whose billing carries no renewal or auto-renew line for the term starting on that end date, and
    it is owed from that day; every support renewal is priced under the support renewal rule, and every renewal bought in
    the dashboard remains under the base renewal rule, which bills the tier's price for the years renewed plus the extra names
    for those years, reduced by the account tier's ssl_discount_pct and rounded half up to the cent; the volume ladder never
    applies to an auto-renew charge. Every auto-renew charge that falls due is priced under the auto-renew charge rule, whatever
    pays it, and account credit pays it first, following the account charter: where the account credit balance on the day
    the charge falls due covers that amount in full, the account's credit run books it at that amount from account credit,
    and otherwise it is charged in full to the default card on file at that amount and booked under the auto-renew charge
    rule. An auto-renew charge renews the subscription from its subscription_end_date for the years of its latest term line,
    at most max_subscription_years, and its list amount is the tier's price for those years (price_1yr, or price_2yr_per_year
    or price_3yr_per_year times the years) plus additional_name_price_per_year times the extra names times the years; the
    auto-renew amount is that list amount rounded half up to the cent. The latest term line is the subscription's latest renewal
    or auto-renew charge line by charge date or, where none has been billed, its purchase line; a renewal line later refunded
    still sets the term, being the term the customer last chose, and its refund has already brought the end date back. The
    extra names of an auto-renew charge that renews for more than one year are billed in bands for each year renewed: where
