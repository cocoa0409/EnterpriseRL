      if COUNT('ssl_charges', event_type='ssl_renewal_charge') > 0 else MAX('ssl_charges', 'years', event_type='ssl_purchase_charge')),
      P('max_subscription_years')) == 3 else ((P('price_2yr_per_year') / P('price_1yr')) if MN((LATEST('ssl_charges', 'years',
      date_field='charge_date', event_type='ssl_renewal_charge') if COUNT('ssl_charges', event_type='ssl_renewal_charge')
      > 0 else MAX('ssl_charges', 'years', event_type='ssl_purchase_charge')), P('max_subscription_years')) == 2 else 1)
  - list_amount: (year_price + names_part * name_ratio) * term_years
  - acct_tier: CFIELD('account', 'variant_name')
  - ar_disc_pct: >-
      CPARAM('account', 'ssl_discount_pct') if acct_tier == 'Harborline Reseller Platinum' else (CPARAM('account', 'ssl_discount_pct')
      if acct_tier == 'Harborline Reseller Gold' else (CPARAM('account', 'ssl_discount_pct') if acct_tier == 'Harborline Reseller
      Silver' else (CPARAM('account', 'ssl_discount_pct') if acct_tier == 'Harborline Reseller Bronze' else 0)))
  - revet_fee: >-
      K('ev_revetting_fee') if (P('validation_level') == 'ev' and DAYS(F('org_validated_date'), F('subscription_end_date'))
