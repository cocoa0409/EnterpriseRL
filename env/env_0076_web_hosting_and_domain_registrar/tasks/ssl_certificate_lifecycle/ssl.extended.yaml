    of it; where it records more than ar_band1_start but no more than ar_band2_start, the first ar_band1_start at additional_name_price_per_year
    and the rest at ar_band1_pct percent of it; and an auto-renew charge renewing for one year, or a subscription recording
    ar_band1_start extra names or fewer, bills every extra name at additional_name_price_per_year. The auto-renew discount
    percentage follows the tier recorded on the customer's Harborline account on the day the charge falls due: a Harborline
    Reseller Platinum, Harborline Reseller Gold, Harborline Reseller Silver or Harborline Reseller Bronze account takes that
    tier's own ssl_discount_pct, and every other account takes no auto-renew discount. The auto-renew discount percentage
    reduces only the certificate price component of an auto-renew charge, never its extra names, so that no two percentages
