      'ov' and DAYS(F('org_validated_date'), F('subscription_end_date')) + K('renewed_term_days') > P('org_validation_reuse_days'))
      else 0)
  - dom_ns: CFIELD('domain', 'nameservers', domain_id=F('domain_id'), status='active')
  - dns_credit: >-
