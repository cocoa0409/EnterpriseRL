      + (n_extra - K('ar_band1_start')) * name_rate * K('ar_band1_pct') / 100) if (n_extra > K('ar_band1_start') and (LATEST('ssl_charges',
      'years', date_field='charge_date', event_type='ssl_renewal_charge') if COUNT('ssl_charges', event_type='ssl_renewal_charge')
