    the holder chooses account credit and the credit balance covers the whole charge, the account's credit run books the added
    name and it is not booked under this rule. The volume rate of an added name follows the names the subscription already
    records and the remaining term: where it already records at least nm_band2_start extra names and more than nm_band_min_term_days
    days remain to the subscription end date, the added name's yearly price is multiplied by nm_band2_pct percent; where it
    records at least nm_band1_start but fewer than nm_band2_start extra names and more than nm_band_min_term_days days remain,
    by nm_band1_pct percent; and otherwise it is not multiplied. The term line an added name is billed into is the subscription's
    purchase, renewal or auto-renew charge line whose period_end is the subscription end date, the latest by charge date where
    several are, a renewal line later refunded no longer carrying the term, its refund having brought the subscription end
    date back to that line's period_start. The part of the term an added name is billed for follows Harborline's published
    added-name schedule, and no added name is ever billed beyond the subscription end date: where no more than nm_min_term_days
    days remain to the subscription end date, the per-name part is the yearly price times the calendar days from today to
    the subscription end date divided by days_per_year, but never less than the minimum added-name charge nm_min_name_charge;
    where more days remain and the term line the name is billed into is a renewal or auto-renew line that has not begun yet
    (its period_start lies after today), the per-name part is the yearly price times the calendar days from today to the subscription
    end date divided by days_per_year, but never more than the yearly price times the years that line covers, the days before
    that renewal begins being covered free; and otherwise the per-name part is the yearly price times the calendar days from
    today to the subscription end date divided by days_per_year. The name validation handling fee of an added name is waived
    where the subscription's domain_id names a Harborline domain registration in status active on harborline_dns, validation
    there completing automatically; it is name_handling_part where that registration is active on external nameservers; and
    it is name_handling_std otherwise. An added name on an OV or EV certificate must be approved under the organisation validation:
    it carries the name vetting fee nm_vet_current where org_validated_date is no more than org_validation_reuse_days days
    before today and nm_vet_full where it is older; an added name on a DV certificate carries no name vetting fee. The yearly
    price of the added name follows the multi-year name rate of the term line it is billed into: where that line covers three
    years it is multiplied by price_3yr_per_year divided by price_1yr, where it covers two years by price_2yr_per_year divided
    by price_1yr, and otherwise it is not multiplied. The yearly price of an added name is additional_name_price_per_year
    with every multiplier that applies to it, and the per-name part is rounded half up to the cent before the fees are added;
    the result is then rounded half up to the cent. The added-name charge is fixed only after the subscription's billing carries
    every auto-renew charge that has fallen due on it. The added-name charge is fixed only after the subscription carries
    every complimentary name owed on it.
  prerequisite:
  - problem: ssl_ext_autorenew_charge
    kind: value_input
    gate: cap_years
    form: state
    policy_source: >-
      The added-name charge is fixed only after the subscription's billing carries every auto-renew charge that has fallen
      due on it.
    condition: >-
      Where the subscription's auto_renew is true and today is on or after auto_renew_days_before_end days before its end
      date, its ssl_charges carry an auto-renew line whose period_start is the end date it had, and subscription_end_date
      has moved to that line's period_end.
    resolved_by: charge_certificate_autorenewal_c41e0ea2
    effect: >-
      The auto-renew line moves the end date by the renewed years, so the remaining term the name is billed for grows past
      the short-term minimum and the band threshold of the per-year price.
  - problem: ssl_ext_wait_names
    kind: state_gate
    gate: ssl_holdings.extra_names
    form: state
    policy_source: >-
      The added-name charge is fixed only after the subscription carries every complimentary name owed on it.
    condition: >-
      Where the compensation rule owes complimentary names on the subscription (first certificate after the order date, no
      issuance of kind reissue and no added-names line on record, and at least one name earned), the free reissue that adds
      them is on its service history and ssl_holdings.extra_names has risen by them, so that the rule owes none.
    resolved_by: grant_complimentary_names_f9ed3e27
    effect: >-
      With the complimentary names on the subscription, only the names the customer still needs beyond them are bought, one
      added-name order each.
  cross_category:
  - category: domain
    as: branch
    reads:
    - status
    - nameservers
    note: The name validation handling fee follows the covered registration status and nameservers.
  compute:
  - n_extra: F('extra_names')
  - name_rate: P('additional_name_price_per_year')
  - band_mult: >-
      K('nm_band2_pct') / 100 if (n_extra >= K('nm_band2_start') and DAYS(NOW, F('subscription_end_date')) > K('nm_band_min_term_days'))
      else (K('nm_band1_pct') / 100 if (n_extra >= K('nm_band1_start') and DAYS(NOW, F('subscription_end_date')) > K('nm_band_min_term_days'))
      else 1)
  - line_years: >-
      (LATEST('ssl_charges', 'years', date_field='charge_date', event_type='ssl_renewal_charge', period_end=F('subscription_end_date'))
      if COUNT('ssl_charges', event_type='ssl_renewal_charge', period_end=F('subscription_end_date')) > 0 else (LATEST('ssl_charges',
      'years', date_field='charge_date', event_type='ssl_purchase_charge', period_end=F('subscription_end_date')) if COUNT('ssl_charges',
      event_type='ssl_purchase_charge', period_end=F('subscription_end_date')) > 0 else 1))
  - name_ratio: >-
      (P('price_3yr_per_year') / P('price_1yr')) if (LATEST('ssl_charges', 'years', date_field='charge_date', event_type='ssl_renewal_charge',
      period_end=F('subscription_end_date')) if COUNT('ssl_charges', event_type='ssl_renewal_charge', period_end=F('subscription_end_date'))
      > 0 else (LATEST('ssl_charges', 'years', date_field='charge_date', event_type='ssl_purchase_charge', period_end=F('subscription_end_date'))
      if COUNT('ssl_charges', event_type='ssl_purchase_charge', period_end=F('subscription_end_date')) > 0 else 1)) == 3 else
      ((P('price_2yr_per_year') / P('price_1yr')) if (LATEST('ssl_charges', 'years', date_field='charge_date', event_type='ssl_renewal_charge',
      period_end=F('subscription_end_date')) if COUNT('ssl_charges', event_type='ssl_renewal_charge', period_end=F('subscription_end_date'))
      > 0 else (LATEST('ssl_charges', 'years', date_field='charge_date', event_type='ssl_purchase_charge', period_end=F('subscription_end_date'))
      if COUNT('ssl_charges', event_type='ssl_purchase_charge', period_end=F('subscription_end_date')) > 0 else 1)) == 2 else
      1)
  - year_name_price: name_rate * band_mult * name_ratio
  - name_floor: K('nm_min_name_charge') if DAYS(NOW, F('subscription_end_date')) <= K('nm_min_term_days') else 0
  - cap_years: >-
      (LATEST('ssl_charges', 'years', date_field='charge_date', event_type='ssl_renewal_charge', period_end=F('subscription_end_date'))
      if COUNT('ssl_charges', event_type='ssl_renewal_charge', period_end=F('subscription_end_date')) > 0 else (LATEST('ssl_charges',
      'years', date_field='charge_date', event_type='ssl_purchase_charge', period_end=F('subscription_end_date')) if COUNT('ssl_charges',
      event_type='ssl_purchase_charge', period_end=F('subscription_end_date')) > 0 else 1)) if (DAYS(NOW, F('subscription_end_date'))
      > K('nm_min_term_days') and COUNT('ssl_charges', event_type='ssl_renewal_charge', period_end=F('subscription_end_date'))
      > 0 and LATEST('ssl_charges', 'period_start', date_field='charge_date', event_type='ssl_renewal_charge', period_end=F('subscription_end_date'))
      > NOW) else DAYS(NOW, F('subscription_end_date')) / K('days_per_year')
  - per_name_part: >-
      RND(MX(name_floor, MN(year_name_price * cap_years, year_name_price * DAYS(NOW, F('subscription_end_date')) / K('days_per_year'))),
      2)
  - dom_ns: CFIELD('domain', 'nameservers', domain_id=F('domain_id'), status='active')
  - handling_fee: >-
      0 if dom_ns == 'harborline_dns' else (K('name_handling_part') if dom_ns == 'external' else K('name_handling_std'))
  - vet_fee: >-
      (K('nm_vet_current') if DAYS(F('org_validated_date'), NOW) <= P('org_validation_reuse_days') else K('nm_vet_full'))
      if (P('validation_level') == 'ov' or P('validation_level') == 'ev') else 0
  - result: RND(per_name_part + handling_fee + vet_fee, 2)
  compute_basis:
    n_extra: where it already records at least nm_band2_start extra names
    name_rate: >-
      where the per-name part is additional_name_price_per_year times the calendar days from today to the subscription end
      date divided by days_per_year
    band_mult: >-
      The volume rate of an added name follows the names the subscription already records and the remaining term: where it
      already records at least nm_band2_start extra names and more than nm_band_min_term_days days remain to the subscription
      end date, the added name's yearly price is multiplied by nm_band2_pct percent; where it records at least nm_band1_start
      but fewer than nm_band2_start extra names and more than nm_band_min_term_days days remain, by nm_band1_pct percent;
      and otherwise it is not multiplied.
    line_years: >-
      The term line an added name is billed into is the subscription's purchase, renewal or auto-renew charge line whose period_end
      is the subscription end date, the latest by charge date where several are, a renewal line later refunded no longer carrying
      the term, its refund having brought the subscription end date back to that line's period_start.
    name_ratio: >-
      The yearly price of the added name follows the multi-year name rate of the term line it is billed into: where that line
      covers three years it is multiplied by price_3yr_per_year divided by price_1yr, where it covers two years by price_2yr_per_year
      divided by price_1yr, and otherwise it is not multiplied.
    year_name_price: >-
      The yearly price of an added name is additional_name_price_per_year with every multiplier that applies to it
    cap_years: >-
      but never more than the yearly price times the years that line covers, the days before that renewal begins being covered
      free
    name_floor: but never less than the minimum added-name charge nm_min_name_charge
    per_name_part: >-
      The part of the term an added name is billed for follows Harborline's published added-name schedule, and no added name
      is ever billed beyond the subscription end date: where no more than nm_min_term_days days remain to the subscription
      end date, the per-name part is the yearly price times the calendar days from today to the subscription end date divided
      by days_per_year, but never less than the minimum added-name charge nm_min_name_charge; where more days remain and the
      term line the name is billed into is a renewal or auto-renew line that has not begun yet (its period_start lies after
      today), the per-name part is the yearly price times the calendar days from today to the subscription end date divided
      by days_per_year, but never more than the yearly price times the years that line covers, the days before that renewal
      begins being covered free; and otherwise the per-name part is the yearly price times the calendar days from today to
      the subscription end date divided by days_per_year.
    dom_ns: >-
      where the subscription's domain_id names a Harborline domain registration in status active on harborline_dns
    handling_fee: >-
      The name validation handling fee of an added name is waived where the subscription's domain_id names a Harborline domain
      registration in status active on harborline_dns, validation there completing automatically; it is name_handling_part
      where that registration is active on external nameservers; and it is name_handling_std otherwise.
    vet_fee: >-
      An added name on an OV or EV certificate must be approved under the organisation validation: it carries the name vetting
      fee nm_vet_current where org_validated_date is no more than org_validation_reuse_days days before today and nm_vet_full
      where it is older; an added name on a DV certificate carries no name vetting fee.
    result: the result is then rounded half up to the cent.
  factors:
  - id: nm_band_rate
    effect: parameter
    decides: band_mult
    bindings:
    - band_mult
    ladder:
    - when: at least nm_band2_start extra names already recorded AND more than nm_band_min_term_days days remain
      value: K('nm_band2_pct') / 100
    - when: >-
        at least nm_band1_start but fewer than nm_band2_start extra names AND more than nm_band_min_term_days days remain
      value: K('nm_band1_pct') / 100
    - when: otherwise
      value: '1'
    baseline:
      band_mult: '1'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: nm_billing_span
    effect: method
    decides: cap_years
    bindings:
    - name_floor
    - cap_years
    ladder:
    - when: no more than nm_min_term_days days remain to the end date
      method: the yearly price prorated over the days to the end date, but never less than nm_min_name_charge
    - when: more days remain AND the term line billed into is a renewal or auto-renew line not begun yet
      method: >-
        the yearly price prorated over the days to the end date, but never more than the yearly price times the years that
        renewal covers
    - when: otherwise
      method: the yearly price prorated over the days to the end date
    baseline:
      cap_years: DAYS(NOW, F('subscription_end_date')) / K('days_per_year')
      name_floor: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: nm_dns_handling
    effect: parameter
    decides: handling_fee
    bindings:
    - dom_ns
    - handling_fee
    ladder:
    - when: covered Harborline registration active on harborline_dns
      value: '0'
    - when: covered Harborline registration active on external nameservers
      value: K('name_handling_part')
    - when: otherwise
      value: K('name_handling_std')
    baseline:
      handling_fee: K('name_handling_std')
    evidence:
    - cross_category
    cross_difficulty: domain
  - id: nm_org_vetting
    effect: parameter
    decides: vet_fee
    bindings:
    - vet_fee
    ladder:
    - when: OV or EV product AND org validation no more than org_validation_reuse_days days old
      value: K('nm_vet_current')
    - when: OV or EV product AND org validation older than that
      value: K('nm_vet_full')
    - when: otherwise (DV)
      value: '0'
    baseline:
      vet_fee: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: nm_term_rate
    effect: parameter
    decides: name_ratio
    bindings:
    - name_ratio
    ladder:
    - when: the term line the name is billed into covers three years
      value: P('price_3yr_per_year') / P('price_1yr')
    - when: that line covers two years
      value: P('price_2yr_per_year') / P('price_1yr')
    - when: otherwise (one year)
      value: '1'
    baseline:
      name_ratio: '1'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      Apart from complimentary names, names are added one name to an order, and the added-name charge of such an order is
      its per-name part plus the standard name validation handling fee name_handling_std, where the per-name part is additional_name_price_per_year
      times the calendar days from today to the subscription end date divided by days_per_year, rounded half up to the cent
      before the fee is added.
    params:
    - additional_name_price_per_year
    - days_per_year
    - name_handling_std
  inputs:
    history:
    - table: ssl_charges
      aggregate: latest
      field: period_start
      filters:
        event_type: ssl_renewal_charge
    - table: ssl_charges
      aggregate: latest
      field: years
      filters:
        event_type: ssl_renewal_charge
    cross_category:
    - domain
- id: ssl_ext_wait_names
  base_policy_refs:
  - ssl_names
  - ssl_validation
  - ssl_issuance_and_reissue
  - ssl_revocation
  overwrite:
  - base_policy: ssl_names
    superseded_clause: >-
      Each added name is billed additional_name_price_per_year times the remaining days divided by 365, where remaining days
      are the calendar days from today to the subscription end date, rounded half up to the cent per line (name_addition_proration_basis).
    replaced_by: >-
      A subscription whose first certificate (its issuance of kind initial) was issued after its order date is owed a validation-wait
      compensation once, while its service history shows no issuance of kind reissue and its billing carries no added-names
      line (an ssl_names_charge line), given as complimentary extra names that Harborline adds to a multi-domain subscription
      at no charge, as an increase of its extra names, when the customer next adds names; the complimentary names are put
      on the certificate at once by a free reissue, recorded as an issuance of kind reissue, and they are places the customer
      fills with the names wanted, only names beyond them being added-name orders; every change of names or keys takes effect
      on a reissue or an added-names order, so once either is on record the compensation has been given or has lapsed; apart
      from complimentary names, every added name is billed under the added-name rule, which adds names one name to an order
      and bills each name's per-name part plus the name validation handling fee.
  trigger: state_due
  subject:
  - ssl_names_update
  - ssl_issuance
  - ssl_cert_update
  computes: names_granted
  target_tool: grant_complimentary_names_f9ed3e27
  params:
    comp_days_per_name: 3
    wait_double_after: 7
    wait_triple_after: 21
    double_mult: 2
    triple_mult: 3
    sla_days_high: 3
    sla_days_std: 2
    goodwill_replaces_at: 25.0
    goodwill_part_share: 40
  rule: >-
    A subscription whose first certificate (its issuance of kind initial) was issued after its order date is owed a validation-wait
    compensation once, while its service history shows no issuance of kind reissue and its billing carries no added-names
    line (an ssl_names_charge line), given as complimentary extra names that Harborline adds to a multi-domain subscription
    at no charge, as an increase of its extra names, when the customer next adds names; the complimentary names are put on
    the certificate at once by a free reissue, recorded as an issuance of kind reissue, and they are places the customer fills
    with the names wanted, only names beyond them being added-name orders; every change of names or keys takes effect on a
    reissue or an added-names order, so once either is on record the compensation has been given or has lapsed; apart from
    complimentary names, every added name is billed under the added-name rule, which adds names one name to an order and bills
    each name's per-name part plus the name validation handling fee. The validation-wait credit is the number of calendar
    days from the order date (opened_date) to the issue date of the first certificate, and each full comp_days_per_name days
    of it earn one complimentary name, never more names than max_names leaves room for beside the included and extra names
    already covered. The waiting days the validation-wait credit counts start when validation was in Harborline's hands: where
    the service history shows a failed http_file domain control check and the latest passed http_file check is not later than
    the first certificate, they count from that passed check to the first certificate; where that is not the case and the
    product is OV or EV and org_validated_date lies after the order date and not later than the first certificate, they count
    from org_validated_date to the first certificate; and otherwise they count from the order date to the first certificate.
    The waiting days are multiplied by the long-wait multiplier, which follows the calendar days from the order date to the
    first certificate: triple_mult where they exceed wait_triple_after, double_mult where they exceed wait_double_after but
    not wait_triple_after, and 1 otherwise. The reseller issuance commitment adds days to the validation-wait credit by the
    tier the customer's Harborline account held on the subscription's purchase date, which is the tier recorded on the account
    where its tier_changed_date is on or before that purchase date: sla_days_high for Harborline Reseller Platinum or Harborline
    Reseller Gold, sla_days_std for Harborline Reseller Silver or Harborline Reseller Bronze, and none for any other tier
    or where the recorded tier took effect after the purchase date. Where the customer's account credit ledger shows goodwill
    credit granted for the subscription (goodwill entries with source_category ssl whose source_charge_ref is the subscription's
    purchase order number), the validation-wait credit keeps only a goodwill share of its days: goodwill of goodwill_replaces_at
    or more leaves a share of 0 percent, goodwill above zero but below goodwill_replaces_at a share of goodwill_part_share
    percent, and without such goodwill the share is 100 percent. Every multiplier of the waiting days acts first, every number
    of days added to the validation-wait credit is then added, and every percentage share acts on that total, which is rounded
    down to a whole day; the complimentary names are that credit divided by comp_days_per_name and rounded down to a whole
    name, within the room max_names leaves; where that comes to no name, nothing is booked. The complimentary names are granted
    only after the subscription's billing carries every auto-renew charge that has fallen due on it.
  prerequisite:
  - problem: ssl_ext_autorenew_charge
    kind: state_gate
    gate: ssl_charges.event_type
    form: state
    policy_source: >-
      The complimentary names are granted only after the subscription's billing carries every auto-renew charge that has fallen
      due on it.
    condition: >-
      Where the subscription's auto_renew is true and today is on or after auto_renew_days_before_end days before its end
      date, its ssl_charges carry an auto-renew line whose period_start is the end date it had, and subscription_end_date
      has moved to that line's period_end.
    resolved_by: charge_certificate_autorenewal_c41e0ea2
    effect: >-
      The auto-renew charge due is billed on the names the subscription carried before the compensation, and the complimentary
      names are added afterwards at no charge.
  cross_category:
  - category: account
    as: history
    reads:
    - variant_name
    - tier_changed_date
    - account_credit_ledger.amount
    note: >-
      The commitment days follow the tier held on the purchase date; the goodwill share reads goodwill entries for this subscription.
  compute:
  - first_cert: >-
      LATEST('ssl_events', 'event_at', date_field='event_at', event_type='ssl_issuance', issuance_kind='initial') if COUNT('ssl_events',
      event_type='ssl_issuance', issuance_kind='initial') > 0 else F('opened_date')
  - raw_wait: DAYS(F('opened_date'), first_cert)
  - waiting_days: >-
      DAYS(LATEST('ssl_events', 'event_at', date_field='event_at', event_type='ssl_dcv_attempt', dcv_method='http_file', dcv_result='passed'),
      first_cert) if (COUNT('ssl_events', event_type='ssl_dcv_attempt', dcv_method='http_file', dcv_result='failed') > 0 and
      COUNT('ssl_events', event_type='ssl_dcv_attempt', dcv_method='http_file', dcv_result='passed') > 0 and LATEST('ssl_events',
      'event_at', date_field='event_at', event_type='ssl_dcv_attempt', dcv_method='http_file', dcv_result='passed') <= first_cert)
      else (DAYS(F('org_validated_date'), first_cert) if ((P('validation_level') == 'ov' or P('validation_level') == 'ev')
      and F('org_validated_date') > F('opened_date') and F('org_validated_date') <= first_cert) else raw_wait)
  - wait_mult: >-
      K('triple_mult') if DAYS(F('opened_date'), first_cert) > K('wait_triple_after') else (K('double_mult') if DAYS(F('opened_date'),
      first_cert) > K('wait_double_after') else 1)
  - acct_tier: CFIELD('account', 'variant_name')
  - sla_days: >-
      K('sla_days_high') if ((acct_tier == 'Harborline Reseller Platinum' or acct_tier == 'Harborline Reseller Gold') and
      DAYS(CFIELD('account', 'tier_changed_date'), LATEST('ssl_charges', 'charge_date', date_field='charge_date', event_type='ssl_purchase_charge'))
      >= 0) else (K('sla_days_std') if ((acct_tier == 'Harborline Reseller Silver' or acct_tier == 'Harborline Reseller Bronze')
      and DAYS(CFIELD('account', 'tier_changed_date'), LATEST('ssl_charges', 'charge_date', date_field='charge_date', event_type='ssl_purchase_charge'))
      >= 0) else 0)
  - credit_total: waiting_days * wait_mult + sla_days
  - goodwill_amt: >-
      XSUM('account', 'account_credit_ledger', 'amount', event_type='account_goodwill_credit', source_category='ssl', source_charge_ref=LATEST('ssl_charges',
      'order_ref', date_field='charge_date', event_type='ssl_purchase_charge'))
  - goodwill_share: >-
      0 if goodwill_amt >= K('goodwill_replaces_at') else (K('goodwill_part_share') if goodwill_amt > 0 else 100)
  - credit_days: int((credit_total * goodwill_share) // 100)
  - names_room: P('max_names') - P('included_names') - F('extra_names')
  - comp_names: MN(credit_days // K('comp_days_per_name'), names_room)
  - reissues: COUNT('ssl_events', event_type='ssl_issuance', issuance_kind='reissue')
  - names_lines: COUNT('ssl_charges', event_type='ssl_names_charge')
  - result: 0 if (raw_wait <= 0 or comp_names <= 0 or reissues > 0 or names_lines > 0) else int(comp_names)
  compute_basis:
    first_cert: >-
      A subscription whose first certificate (its issuance of kind initial) was issued after its order date is owed a validation-wait
      compensation once
    reissues: while its service history shows no issuance of kind reissue
    names_lines: its billing carries no added-names line (an ssl_names_charge line)
    raw_wait: >-
      The validation-wait credit is the number of calendar days from the order date (opened_date) to the issue date of the
      first certificate
    waiting_days: >-
      The waiting days the validation-wait credit counts start when validation was in Harborline's hands: where the service
      history shows a failed http_file domain control check and the latest passed http_file check is not later than the first
      certificate, they count from that passed check to the first certificate; where that is not the case and the product
      is OV or EV and org_validated_date lies after the order date and not later than the first certificate, they count from
      org_validated_date to the first certificate; and otherwise they count from the order date to the first certificate.
    wait_mult: >-
      The waiting days are multiplied by the long-wait multiplier, which follows the calendar days from the order date to
      the first certificate: triple_mult where they exceed wait_triple_after, double_mult where they exceed wait_double_after
      but not wait_triple_after, and 1 otherwise.
    acct_tier: by the tier the customer's Harborline account held on the subscription's purchase date
    sla_days: >-
      The reseller issuance commitment adds days to the validation-wait credit by the tier the customer's Harborline account
      held on the subscription's purchase date, which is the tier recorded on the account where its tier_changed_date is on
      or before that purchase date: sla_days_high for Harborline Reseller Platinum or Harborline Reseller Gold, sla_days_std
      for Harborline Reseller Silver or Harborline Reseller Bronze, and none for any other tier or where the recorded tier
      took effect after the purchase date.
    credit_total: >-
      Every multiplier of the waiting days acts first, every number of days added to the validation-wait credit is then added
    goodwill_amt: >-
      Where the customer's account credit ledger shows goodwill credit granted for the subscription (goodwill entries with
      source_category ssl whose source_charge_ref is the subscription's purchase order number)
    goodwill_share: >-
      goodwill of goodwill_replaces_at or more leaves a share of 0 percent, goodwill above zero but below goodwill_replaces_at
      a share of goodwill_part_share percent, and without such goodwill the share is 100 percent.
    credit_days: >-
      Every multiplier of the waiting days acts first, every number of days added to the validation-wait credit is then added,
      and every percentage share acts on that total, which is rounded down to a whole day
    names_room: never more names than max_names leaves room for beside the included and extra names already covered
    comp_names: >-
      the complimentary names are that credit divided by comp_days_per_name and rounded down to a whole name, within the room
      max_names leaves
    result: where that comes to no name, nothing is booked.
  factors:
  - id: wait_anchor_cn
    effect: method
    decides: waiting_days
    bindings:
    - waiting_days
    ladder:
    - when: a failed http_file check AND the latest passed http_file check not later than the first certificate
      method: count from that passed check (ssl_events.event_at) to the first certificate
    - when: >-
        not the first case AND an OV or EV product whose org_validated_date lies after the order date and not later than the
        first certificate
      method: count from org_validated_date (ssl_holdings) to the first certificate
    - when: otherwise
      method: count from opened_date to the first certificate
    baseline:
      waiting_days: raw_wait
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: long_wait_cn
    effect: parameter
    decides: wait_mult
    bindings:
    - wait_mult
    ladder:
    - when: more than wait_triple_after days from order to first certificate
      value: K('triple_mult')
    - when: more than wait_double_after but no more than wait_triple_after days
      value: K('double_mult')
    - when: otherwise
      value: '1'
    baseline:
      wait_mult: '1'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: sla_days_cn
    effect: parameter
    decides: sla_days
    bindings:
    - acct_tier
    - sla_days
    ladder:
    - when: Harborline Reseller Platinum or Gold AND that tier took effect on or before the purchase date
      value: K('sla_days_high')
    - when: Harborline Reseller Silver or Bronze AND that tier took effect on or before the purchase date
      value: K('sla_days_std')
    - when: otherwise
      value: '0'
    baseline:
      sla_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: account
  - id: goodwill_settle_cn
    effect: parameter
    decides: goodwill_share
    bindings:
    - goodwill_amt
    - goodwill_share
    ladder:
    - when: goodwill for the subscription of goodwill_replaces_at or more
      value: '0'
    - when: goodwill for the subscription above zero but below goodwill_replaces_at
      value: K('goodwill_part_share')
    - when: otherwise (no such goodwill)
      value: '100'
    baseline:
      goodwill_share: '100'
    evidence:
    - cross_category
    - history
    cross_difficulty: account
  baseline:
    rule: >-
      The validation-wait credit is the number of calendar days from the order date (opened_date) to the issue date of the
      first certificate, and each full comp_days_per_name days of it earn one complimentary name, never more names than max_names
      leaves room for beside the included and extra names already covered.
    params:
    - comp_days_per_name
    - max_names
    - included_names
  inputs:
    history:
    - table: ssl_events
      aggregate: latest
      field: event_at
      filters:
        event_type: ssl_issuance
        issuance_kind: initial
    - table: ssl_events
      aggregate: count
      field: ssl_event_id
      filters:
        event_type: ssl_dcv_attempt
        dcv_result: failed
    - table: ssl_charges
      aggregate: count
      field: ssl_charge_id
      filters:
        event_type: ssl_names_charge
    - table: ssl_events
      aggregate: count
      field: ssl_event_id
      filters:
        event_type: ssl_issuance
        issuance_kind: reissue
    - category: account
      table: account_credit_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: account_goodwill_credit
        source_category: ssl
    cross_category:
    - account
