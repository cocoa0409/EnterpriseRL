    by early_renewal_pct and the extra names stay at additional_name_price_per_year; and where neither applies, the list amount
    is not reduced. The reduced amount is rounded half up to the cent. A support renewal for a customer whose email for the
    certificate's registered domain runs on an active Harborline Mail subscription (an email subscription with the certificate's
    domain_id) carries the mail bundle credit ren_mail_credit; one whose email for that domain runs only on an active Microsoft
    365 subscription carries ren_m365_credit; and every other support renewal carries no mail bundle credit. A support renewal
    of a certificate whose domain_id names a Harborline domain registration in status active carries the Harborline domain
    credit ren_dns_credit where that registration's nameservers are harborline_dns, domain validation there completing automatically,
    and ren_reg_credit where its nameservers are external; every other support renewal carries no Harborline domain credit.
    A support renewal of a certificate that Harborline support has installed, shown by installation lines on the subscription
    that no refund line of charge type installation reverses, carries the managed re-installation fee for the renewed year's
    automatic reissues: ren_reinstall_multi where two or more such lines stand, ren_reinstall_one where exactly one stands,
    and none where none stands. The reduced amount is taken before any fixed fee is added or any fixed credit is subtracted,
    and the result is rounded half up to the cent.
  prerequisite: []
  cross_category:
  - category: account
    as: branch
    reads:
    - variant_name
    - ssl_discount_pct
    note: The tier schedule of the support renewal discount reads the tier recorded on the customer account.
  - category: domain
    as: branch
    reads:
    - status
    - nameservers
    note: The Harborline domain credit follows the covered registration status and nameservers.
  - category: email
    as: existence
    reads:
    - variant_name
    - status
    - domain_id
    note: The mail bundle credit follows an active email subscription on the certificate domain.
  compute:
  - n_extra: F('extra_names')
  - name_rate: P('additional_name_price_per_year')
  - list_amount: P('price_1yr') + n_extra * name_rate
  - acct_tier: CFIELD('account', 'variant_name')
  - tier_pct: >-
      CPARAM('account', 'ssl_discount_pct') if acct_tier == 'Harborline Reseller Platinum' else (CPARAM('account', 'ssl_discount_pct')
      if acct_tier == 'Harborline Reseller Gold' else (CPARAM('account', 'ssl_discount_pct') if acct_tier == 'Harborline Reseller
      Silver' else (CPARAM('account', 'ssl_discount_pct') if acct_tier == 'Harborline Reseller Bronze' else 0)))
  - reduced_amount: >-
      RND(P('price_1yr') * (100 - MX(tier_pct, K('early_renewal_pct'))) / 100 + n_extra * name_rate * (100 - tier_pct) / 100,
      2) if (tier_pct > 0 and DAYS(NOW, F('subscription_end_date')) > P('auto_renew_days_before_end')) else (RND(list_amount
      * (100 - tier_pct) / 100, 2) if tier_pct > 0 else (RND(P('price_1yr') * (100 - K('early_renewal_pct')) / 100 + n_extra
      * name_rate, 2) if DAYS(NOW, F('subscription_end_date')) > P('auto_renew_days_before_end') else RND(list_amount, 2)))
  - mail_credit: >-
      K('ren_mail_credit') if (EXISTS('email', domain_id=F('domain_id'), status='active', variant_name='Harborline Mail Starter')
      or EXISTS('email', domain_id=F('domain_id'), status='active', variant_name='Harborline Mail Plus') or EXISTS('email',
      domain_id=F('domain_id'), status='active', variant_name='Harborline Mail Pro')) else (K('ren_m365_credit') if (EXISTS('email',
      domain_id=F('domain_id'), status='active', variant_name='Microsoft 365 Business Basic') or EXISTS('email', domain_id=F('domain_id'),
      status='active', variant_name='Microsoft 365 Business Standard') or EXISTS('email', domain_id=F('domain_id'), status='active',
      variant_name='Microsoft 365 Business Premium')) else 0)
  - dom_ns: CFIELD('domain', 'nameservers', domain_id=F('domain_id'), status='active')
  - dns_credit: >-
      K('ren_dns_credit') if dom_ns == 'harborline_dns' else (K('ren_reg_credit') if dom_ns == 'external' else 0)
  - live_installs: >-
      COUNT('ssl_charges', event_type='ssl_install_charge') - COUNT('ssl_charges', event_type='ssl_refund', charge_type='installation')
  - reinstall_fee: >-
      K('ren_reinstall_multi') if live_installs >= 2 else (K('ren_reinstall_one') if live_installs == 1 else 0)
  - result: RND(reduced_amount + reinstall_fee - mail_credit - dns_credit, 2)
  compute_basis:
    n_extra: >-
      A support renewal adds one year to the subscription from its subscription_end_date, never from the payment date, and
      its list amount is price_1yr plus additional_name_price_per_year for each extra name recorded on the subscription; the
      support renewal amount is that list amount rounded half up to the cent.
    name_rate: >-
      A support renewal adds one year to the subscription from its subscription_end_date, never from the payment date, and
      its list amount is price_1yr plus additional_name_price_per_year for each extra name recorded on the subscription; the
      support renewal amount is that list amount rounded half up to the cent.
    list_amount: >-
      A support renewal adds one year to the subscription from its subscription_end_date, never from the payment date, and
      its list amount is price_1yr plus additional_name_price_per_year for each extra name recorded on the subscription; the
      support renewal amount is that list amount rounded half up to the cent.
    acct_tier: the tier recorded on the customer's Harborline account
    tier_pct: >-
      where a Harborline Reseller Platinum, Harborline Reseller Gold, Harborline Reseller Silver or Harborline Reseller Bronze
      account has that tier's own ssl_discount_pct and any other account has none
    reduced_amount: >-
      The support renewal discount follows two schedules, the tier recorded on the customer's Harborline account, where a
      Harborline Reseller Platinum, Harborline Reseller Gold, Harborline Reseller Silver or Harborline Reseller Bronze account
      has that tier's own ssl_discount_pct and any other account has none, and the early-renewal promotion early_renewal_pct
      for a support renewal booked more than auto_renew_days_before_end days before the subscription end date, which covers
      the certificate price only and never the extra names: where both apply, following the account charter price component
      by price component, price_1yr is reduced by the single higher of the tier percentage and the promotion, the two never
      being added, and the extra names, which the promotion never covers, are reduced by the tier percentage alone; where
      only the tier percentage applies, the whole list amount is reduced by it; where only the promotion applies, price_1yr
      is reduced by early_renewal_pct and the extra names stay at additional_name_price_per_year; and where neither applies,
      the list amount is not reduced. The reduced amount is rounded half up to the cent.
    mail_credit: >-
      A support renewal for a customer whose email for the certificate's registered domain runs on an active Harborline Mail
      subscription (an email subscription with the certificate's domain_id) carries the mail bundle credit ren_mail_credit;
      one whose email for that domain runs only on an active Microsoft 365 subscription carries ren_m365_credit; and every
      other support renewal carries no mail bundle credit.
    dom_ns: whose domain_id names a Harborline domain registration in status active
    dns_credit: >-
      A support renewal of a certificate whose domain_id names a Harborline domain registration in status active carries the
      Harborline domain credit ren_dns_credit where that registration's nameservers are harborline_dns, domain validation
      there completing automatically, and ren_reg_credit where its nameservers are external; every other support renewal carries
      no Harborline domain credit.
    live_installs: >-
      shown by installation lines on the subscription that no refund line of charge type installation reverses
    reinstall_fee: >-
      A support renewal of a certificate that Harborline support has installed, shown by installation lines on the subscription
      that no refund line of charge type installation reverses, carries the managed re-installation fee for the renewed year's
      automatic reissues: ren_reinstall_multi where two or more such lines stand, ren_reinstall_one where exactly one stands,
      and none where none stands.
    result: >-
      The reduced amount is taken before any fixed fee is added or any fixed credit is subtracted, and the result is rounded
      half up to the cent.
  factors:
  - id: discount_family_ren
    effect: method
    decides: reduced_amount
    bindings:
    - acct_tier
    - tier_pct
    - reduced_amount
    ladder:
    - when: >-
        a reseller tier percentage AND the renewal is booked more than auto_renew_days_before_end days before the end date
      method: >-
        price_1yr reduced by the single higher of the tier percentage and early_renewal_pct, the extra names by the tier percentage
        alone
    - when: >-
        a reseller tier percentage AND the renewal is booked within auto_renew_days_before_end days of the end date
      method: the whole list amount reduced by the tier's ssl_discount_pct
    - when: >-
        no reseller tier percentage AND the renewal is booked more than auto_renew_days_before_end days before the end date
      method: price_1yr reduced by early_renewal_pct, the extra names at additional_name_price_per_year
    - when: otherwise
      method: the list amount unreduced
    baseline:
      reduced_amount: RND(list_amount, 2)
    evidence:
    - cross_category
    - date
    cross_difficulty: account
  - id: mail_bundle_ren
    effect: parameter
    decides: mail_credit
    bindings:
    - mail_credit
    ladder:
    - when: an active Harborline Mail subscription with the certificate domain_id
      value: K('ren_mail_credit')
    - when: no active Harborline Mail subscription AND an active Microsoft 365 subscription with that domain_id
      value: K('ren_m365_credit')
    - when: otherwise
      value: '0'
    baseline:
      mail_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: email
  - id: dns_bundle_ren
    effect: parameter
    decides: dns_credit
    bindings:
    - dom_ns
    - dns_credit
    ladder:
    - when: covered Harborline registration active AND nameservers harborline_dns
      value: K('ren_dns_credit')
    - when: covered Harborline registration active AND nameservers external
      value: K('ren_reg_credit')
    - when: otherwise
      value: '0'
    baseline:
      dns_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: domain
  - id: managed_reinst_ren
    effect: parameter
    decides: reinstall_fee
    bindings:
    - live_installs
    - reinstall_fee
    ladder:
    - when: two or more unreversed installation lines
      value: K('ren_reinstall_multi')
    - when: exactly one unreversed installation line
      value: K('ren_reinstall_one')
    - when: otherwise (none)
      value: '0'
    baseline:
      reinstall_fee: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      A support renewal adds one year to the subscription from its subscription_end_date, never from the payment date, and
      its list amount is price_1yr plus additional_name_price_per_year for each extra name recorded on the subscription; the
      support renewal amount is that list amount rounded half up to the cent.
    params:
    - price_1yr
    - additional_name_price_per_year
  inputs:
    history:
    - table: ssl_charges
      aggregate: count
      field: ssl_charge_id
      filters:
        event_type: ssl_install_charge
    cross_category:
    - account
    - domain
    - email
- id: ssl_ext_secondkey_order
  base_policy_refs:
  - ssl_pricing
  - ssl_agg_volume_and_org_reuse
  - ssl_agg_multi_holding
  overwrite:
  - base_policy: ssl_pricing
    superseded_clause: >-
      A new subscription is billed at the tier's price for the years bought (price_1yr, or price_2yr_per_year or price_3yr_per_year
      times the years) plus additional_name_price_per_year times the extra names times the years.
    replaced_by: >-
      An order placed on its own for a further subscription of the same product, for the same common name and the same number
      of extra names as an active subscription the customer already holds (the sibling), because another server needs its
      own key, is a second-key order, and only such an order is priced under this rule; every other new subscription remains
      under the base pricing rule, which bills the tier's price for the years bought plus the extra names times the years,
      reduced by the applicable volume or account tier discount and rounded half up to the cent.
  - base_policy: ssl_pricing
    superseded_clause: >-
      The line is reduced by the discount applicable under ssl_agg_volume_and_org_reuse and rounded half up to the cent (price_rounding).
    replaced_by: >-
      Every percentage reduction acts once on the price component of the second-key order it reduces, every multiplier of
      a name's yearly price acts on that yearly price, and the reduced amount, the sum of the price components, is rounded
      half up to the cent before any fixed credit is subtracted; the result is then rounded half up to the cent.
  - base_policy: ssl_pricing
    superseded_clause: >-
      The subscription runs from the order date for the years bought, at most max_subscription_years, and the names covered
      may not exceed max_names; a wildcard name can be ordered only on a product whose wildcard_supported is true.
    replaced_by: >-
      A second-key order is placed only where the sibling runs at least one whole year from the order date, and a second-key
      subscription then runs from the order date for the whole years from the order date to the sibling's subscription_end_date,
      at most max_subscription_years, so that it ends no later than the sibling; where the sibling runs less than a whole
      year no second-key order is priced or booked. Every other subscription runs from its order date for the years bought,
      at most max_subscription_years; the names covered may not exceed max_names, and a wildcard name can be ordered only
      on a product whose wildcard_supported is true.
  trigger: on_request
  subject:
  - ssl_order
  computes: amount
  target_tool: order_secondkey_certificate_9d8b09ff
  params:
    sk_band1_start: 10
    sk_band2_start: 50
    sk_band1_pct: 60
    sk_band2_pct: 40
    ev_reuse_credit: 60.0
    ov_reuse_credit: 35.0
    sk_dcv_credit: 8.0
    sk_dcv_credit_file: 4.0
  rule: >-
    An order placed on its own for a further subscription of the same product, for the same common name and the same number
    of extra names as an active subscription the customer already holds (the sibling), because another server needs its own
    key, is a second-key order, and only such an order is priced under this rule; every other new subscription remains under
    the base pricing rule, which bills the tier's price for the years bought plus the extra names times the years, reduced
    by the applicable volume or account tier discount and rounded half up to the cent. A second-key order is placed only where
    the sibling runs at least one whole year from the order date, and a second-key subscription then runs from the order date
    for the whole years from the order date to the sibling's subscription_end_date, at most max_subscription_years, so that
    it ends no later than the sibling; where the sibling runs less than a whole year no second-key order is priced or booked.
    Every other subscription runs from its order date for the years bought, at most max_subscription_years; the names covered
    may not exceed max_names, and a wildcard name can be ordered only on a product whose wildcard_supported is true. A second-key
    order is billed at the tier's price for those years (price_1yr, or price_2yr_per_year or price_3yr_per_year times the
    years) plus additional_name_price_per_year times the sibling's extra names times the years, rounded half up to the cent.
    The account holder pays a second-key order personally at Harborline's secure checkout, by a card or PayPal account entered
    there, once the agent has quoted the charge; where the holder chooses account credit and the credit balance covers the
    whole charge, the account's credit run books the second-key order and it is not booked under this rule. The extra names
    of a second-key order running more than one year are billed in bands for each year: where the sibling records more than
    sk_band2_start extra names, the first sk_band1_start at additional_name_price_per_year, those after them up to sk_band2_start
    at sk_band1_pct percent of it and those beyond sk_band2_start at sk_band2_pct percent of it; where it records more than
    sk_band1_start but no more than sk_band2_start, the first sk_band1_start at additional_name_price_per_year and the rest
    at sk_band1_pct percent of it; and a one-year second-key order, or a sibling recording sk_band1_start extra names or fewer,
    bills every extra name at additional_name_price_per_year. The second-key discount percentage follows the tier recorded
    on the customer's Harborline account: a Harborline Reseller Platinum, Harborline Reseller Gold, Harborline Reseller Silver
    or Harborline Reseller Bronze account takes that tier's own ssl_discount_pct, and every other account takes no second-key
    discount. The second-key discount percentage reduces only the certificate price component of a second-key order, never
    its extra names, so that no two percentages ever reduce the same price component. A second-key order whose sibling is
    an EV product with an organisation validation no more than org_validation_reuse_days days old on the order date carries
    the EV validation reuse credit ev_reuse_credit, one whose sibling is an OV product in the same position carries the OV
    validation reuse credit ov_reuse_credit, and every other second-key order carries no validation reuse credit. A second-key
    order whose sibling's domain control validation is no more than dcv_reuse_days days old on the order date reuses it and
    carries the DCV reuse credit sk_dcv_credit where the sibling's dcv_method is dns_cname and sk_dcv_credit_file where it
    is another method, the validation file or approver mail then still having to be set up for the new server; every other
    second-key order carries no DCV reuse credit. The extra names of a second-key order are priced at the multi-year name
    rate of its term: for a three-year term each name's yearly price is multiplied by price_3yr_per_year divided by price_1yr,
    for a two-year term by price_2yr_per_year divided by price_1yr, and for a one-year term it stays at additional_name_price_per_year.
    Every percentage reduction acts once on the price component of the second-key order it reduces, every multiplier of a
    name's yearly price acts on that yearly price, and the reduced amount, the sum of the price components, is rounded half
    up to the cent before any fixed credit is subtracted; the result is then rounded half up to the cent. The second-key charge
    is fixed only after the sibling's billing carries every auto-renew charge that has fallen due on the sibling. The second-key
    charge is not fixed until every name the new server serves has been added to the sibling certificate.
  prerequisite:
  - problem: ssl_ext_autorenew_charge
    kind: value_input
    gate: sk_years
    form: state
    policy_source: >-
      The second-key charge is fixed only after the sibling's billing carries every auto-renew charge that has fallen due
      on the sibling.
    condition: >-
      Where the sibling's auto_renew is true and today is on or after auto_renew_days_before_end days before its end date,
      its ssl_charges carry an auto-renew line whose period_start is the end date it had, and subscription_end_date has moved
      to that line's period_end.
    resolved_by: charge_certificate_autorenewal_c41e0ea2
    effect: >-
      The renewed end date gives the second-key subscription more whole years, which moves its term price and its name bands.
  - problem: ssl_ext_names_charge
    kind: value_input
    gate: n_extra
    form: action
    policy_source: >-
      The second-key charge is not fixed until every name the new server serves has been added to the sibling certificate.
    fallback_reason: >-
      The names a new server serves are not recorded anywhere in Harborline's records (only the count of extra names is),
      so no record-visible state shows them covered; the sentence names the name addition as the action.
    condition: >-
      ssl_holdings.extra_names on the sibling has risen by the names the customer says the new server serves beyond those
      the sibling covers.
    resolved_by: add_certificate_name_7df48eab
    effect: >-
      The sibling's extra-name count, which the second-key order copies and bills, rises by the added name.
  cross_category:
  - category: account
    as: branch
    reads:
    - variant_name
    - ssl_discount_pct
    note: The second-key discount percentage follows the tier recorded on the customer account.
  compute:
  - n_extra: F('extra_names')
  - name_rate: P('additional_name_price_per_year')
  - sk_years: MN(MONTHS(NOW, F('subscription_end_date')) // 12, P('max_subscription_years'))
  - year_price: >-
      P('price_3yr_per_year') if sk_years == 3 else (P('price_2yr_per_year') if sk_years == 2 else P('price_1yr'))
  - names_part: >-
      (K('sk_band1_start') * name_rate + (K('sk_band2_start') - K('sk_band1_start')) * name_rate * K('sk_band1_pct') / 100
      + (n_extra - K('sk_band2_start')) * name_rate * K('sk_band2_pct') / 100) if (n_extra > K('sk_band2_start') and MN(MONTHS(NOW,
      F('subscription_end_date')) // 12, P('max_subscription_years')) > 1) else ((K('sk_band1_start') * name_rate + (n_extra
      - K('sk_band1_start')) * name_rate * K('sk_band1_pct') / 100) if (n_extra > K('sk_band1_start') and MN(MONTHS(NOW, F('subscription_end_date'))
      // 12, P('max_subscription_years')) > 1) else n_extra * name_rate)
  - name_ratio: >-
      (P('price_3yr_per_year') / P('price_1yr')) if MN(MONTHS(NOW, F('subscription_end_date')) // 12, P('max_subscription_years'))
      == 3 else ((P('price_2yr_per_year') / P('price_1yr')) if MN(MONTHS(NOW, F('subscription_end_date')) // 12, P('max_subscription_years'))
      == 2 else 1)
  - list_amount: (year_price + names_part * name_ratio) * sk_years
  - acct_tier: CFIELD('account', 'variant_name')
  - sk_disc_pct: >-
      CPARAM('account', 'ssl_discount_pct') if acct_tier == 'Harborline Reseller Platinum' else (CPARAM('account', 'ssl_discount_pct')
      if acct_tier == 'Harborline Reseller Gold' else (CPARAM('account', 'ssl_discount_pct') if acct_tier == 'Harborline Reseller
      Silver' else (CPARAM('account', 'ssl_discount_pct') if acct_tier == 'Harborline Reseller Bronze' else 0)))
  - org_credit: >-
      K('ev_reuse_credit') if (P('validation_level') == 'ev' and DAYS(F('org_validated_date'), NOW) <= P('org_validation_reuse_days'))
      else (K('ov_reuse_credit') if (P('validation_level') == 'ov' and DAYS(F('org_validated_date'), NOW) <= P('org_validation_reuse_days'))
      else 0)
  - dcv_credit: >-
      K('sk_dcv_credit') if (DAYS(F('dcv_validated_date'), NOW) <= P('dcv_reuse_days') and F('dcv_method') == 'dns_cname')
      else (K('sk_dcv_credit_file') if (DAYS(F('dcv_validated_date'), NOW) <= P('dcv_reuse_days') and F('dcv_method') != 'dns_cname')
      else 0)
  - cert_part: year_price * sk_years
  - names_value: names_part * name_ratio * sk_years
  - reduced_amount: RND(cert_part * (100 - sk_disc_pct) / 100 + names_value, 2)
  - priced: RND(reduced_amount - org_credit - dcv_credit, 2)
  - result: 0 if sk_years < 1 else priced
  compute_basis:
    n_extra: plus additional_name_price_per_year times the sibling's extra names times the years
    name_rate: plus additional_name_price_per_year times the sibling's extra names times the years
    sk_years: >-
      a second-key subscription then runs from the order date for the whole years from the order date to the sibling's subscription_end_date,
      at most max_subscription_years
    year_price: >-
      A second-key order is billed at the tier's price for those years (price_1yr, or price_2yr_per_year or price_3yr_per_year
      times the years)
    names_part: >-
      The extra names of a second-key order running more than one year are billed in bands for each year: where the sibling
      records more than sk_band2_start extra names, the first sk_band1_start at additional_name_price_per_year, those after
      them up to sk_band2_start at sk_band1_pct percent of it and those beyond sk_band2_start at sk_band2_pct percent of it;
      where it records more than sk_band1_start but no more than sk_band2_start, the first sk_band1_start at additional_name_price_per_year
      and the rest at sk_band1_pct percent of it; and a one-year second-key order, or a sibling recording sk_band1_start extra
      names or fewer, bills every extra name at additional_name_price_per_year.
    list_amount: >-
      A second-key order is billed at the tier's price for those years (price_1yr, or price_2yr_per_year or price_3yr_per_year
      times the years) plus additional_name_price_per_year times the sibling's extra names times the years, rounded half up
      to the cent.
    acct_tier: The second-key discount percentage follows the tier recorded on the customer's Harborline account
    sk_disc_pct: >-
      a Harborline Reseller Platinum, Harborline Reseller Gold, Harborline Reseller Silver or Harborline Reseller Bronze account
      takes that tier's own ssl_discount_pct, and every other account takes no second-key discount.
    org_credit: >-
      A second-key order whose sibling is an EV product with an organisation validation no more than org_validation_reuse_days
      days old on the order date carries the EV validation reuse credit ev_reuse_credit, one whose sibling is an OV product
      in the same position carries the OV validation reuse credit ov_reuse_credit, and every other second-key order carries
      no validation reuse credit.
    dcv_credit: >-
      A second-key order whose sibling's domain control validation is no more than dcv_reuse_days days old on the order date
      reuses it and carries the DCV reuse credit sk_dcv_credit where the sibling's dcv_method is dns_cname and sk_dcv_credit_file
      where it is another method, the validation file or approver mail then still having to be set up for the new server;
      every other second-key order carries no DCV reuse credit.
    name_ratio: >-
      The extra names of a second-key order are priced at the multi-year name rate of its term: for a three-year term each
      name's yearly price is multiplied by price_3yr_per_year divided by price_1yr, for a two-year term by price_2yr_per_year
      divided by price_1yr, and for a one-year term it stays at additional_name_price_per_year.
    reduced_amount: >-
      Every percentage reduction acts once on the price component of the second-key order it reduces, every multiplier of
      a name's yearly price acts on that yearly price, and the reduced amount, the sum of the price components, is rounded
      half up to the cent before any fixed credit is subtracted
    cert_part: >-
      A second-key order is billed at the tier's price for those years (price_1yr, or price_2yr_per_year or price_3yr_per_year
      times the years)
