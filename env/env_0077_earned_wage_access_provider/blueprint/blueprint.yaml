name: env_0077_earned_wage_access_provider
company: Paystride, Inc.
background: |
  Paystride, Inc. is a Columbus, Ohio financial technology company that runs employer-integrated earned wage access and payroll card programs for about 2,400 employers and roughly 610,000 hourly workers in retail, restaurants, warehousing, home health and hospitality.
  Its payroll card accounts and savings accounts are held at its sponsor bank, Harborline Bank, N.A., Member FDIC, and its cards are issued on the Visa network, while Paystride itself advances workers' earned wages and settles them with employers on payday.
  The support desk serves two kinds of customers: employer program contacts such as payroll administrators and owners, and the individual workers who use the products, and its tone is plain-spoken, precise about money and dates, and patient with people living paycheck to paycheck.
  Employers hold a Paystride Earned Wage Access Program Agreement in one of six tiers sized by eligible headcount: Paystride Program Starter, Paystride Program Growth, Paystride Program Professional, Paystride Program Enterprise, Paystride Program Enterprise Plus and Paystride Program Strategic.
  Each agreement is booked through deduction schedules for every pay date and payroll group, the employer's remittances, shortfall notices and write-offs, monthly invoice lines, late charges, payments and credit memos, monthly censuses, and change requests for access percentages, fee models, payroll groups and termination.
  Employers that pay unbanked or underbanked staff by card also hold a Paystride Payroll Card Program in one of six packages, Paystride Paycard Program Essential, Standard, Select, Advantage, Premier and Elite, booked through funding received and returned, payroll batches loaded to cards, refused-load credits, erroneous-load reversals, kit orders and program fees.
  Employers that pay tips, off-cycle wages or final pay on demand hold a Paystride Instant Pay Disbursement service in one of six volume tiers, Paystride Instant Pay Starter, Core, Growth, Pro, Scale and Enterprise, booked through prefund deposits, payouts to workers, returned and recalled payouts, fees and withdrawals.
  Workers enroll under their employer's agreement in a Paystride Earned Wage Access Plan that moves through six access tiers as their repayment history builds: Paystride Access Starter, Paystride Access Standard, Paystride Access Plus, Paystride Access Preferred, Paystride Access Premier and Paystride Access Premier Plus.
  An Access plan is booked through earnings synced from the employer's time and payroll feed, early wage transfers to the worker's card, debit card or bank account, transfer fees, payday recoveries, shortfalls carried to later paydays, write-offs, returned transfers and fee reversals.
  Workers paid by card hold a Paystride Visa Payroll Card account whose plan follows their employer's package: Paystride Visa Payroll Card Essential, Standard, Select, Advantage, Premier or Elite, booked through loads, purchases, ATM and teller withdrawals, card-to-bank transfers, fees, refunds, dispute credits, replacement cards and written history requests.
  Card holders can also keep a Paystride Save account at Harborline Bank in one of six tiers, Paystride Save Starter, Builder, Boost, Growth, Premier and Elite, booked through round-ups, auto-save from payroll, withdrawals, monthly interest and streak bonuses.
  Where an employer offers the benefit, workers can borrow a Paystride Payroll-Repaid Loan of up to five thousand dollars, sold in six principal bands from Paystride Payroll Loan 500 to Paystride Payroll Loan 5000 and booked through disbursement, monthly interest, payroll-deducted installments, returned payments and charge-offs.
  A typical employer caller holds an Access program agreement, often alongside a Payroll Card Program or Instant Pay service, and brings months of pay dates, remittances, shortfalls, invoices and change requests.
  A typical worker caller holds an Access plan and a payroll card, sometimes a Save account or a loan, and brings a history of shifts synced, transfers taken, paydays recovered or short, card loads, ATM visits, fees and occasional disputes.
logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log
difficulties:
  - name: employer_program_settlement_and_changes
    claim:
      categories: [program]
      event_types: [program_remittance, program_remittance_return, program_shortfall_notice, program_shortfall_writeoff, program_late_charge, program_invoice_line, program_invoice_payment, program_credit_memo, program_sla_credit, program_amend, program_termination_notice, program_suspend, program_reinstate]
    summary: >
      Employer payroll administrators, finance contacts and program owners call about their Earned Wage Access Program Agreement: a remittance that was short or returned, a shortfall they believe their company should not bear, a late charge, a monthly invoice they question, an SLA or go-live credit they want, a change to their workers' access percentage or fee model, or notice that they want to leave, and the setting varies with the program tier, the agreement's status from live through suspended and terminating, the fee model, the number of payroll groups and whether the same employer also runs a Payroll Card Program or an Instant Pay service.
      The records involved are the agreement itself with its fee model, configured access percentage, term and receivables, the deduction schedules, remittances, shortfall notices and write-offs of each pay date and payroll group, the billing lines, payments and credit memos, the monthly censuses, the change requests, and the workers' Access plans under the agreement and the employer's other Paystride programs; the governing rules are state gates on the agreement status, the shortfall liability map and contest window of program_evt_shortfall, the per-tier grace, rate and minimum of program_evt_late_charge, the invoice composition and bundle discount of program_evt_monthly_invoice and program_paycard_bundle, the SLA ladder and claim window of program_evt_payments_and_credits, the limits and lead times of program_change_management, and the suspension and notice periods of program_lifecycle.
      In the natural course of the business a deduction schedule precedes its remittance, an unremitted part becomes a shortfall notice before it is written off or charged late, and a month's census precedes its invoice, but that order is background only.
      Booking remittances, returns, shortfall classifications, write-offs, late charges, invoice lines, payments, credit memos and suspensions or reinstatements is the agent's service work once the caller is verified, while consenting to a program change, giving termination notice or contesting a shortfall classification are the employer's own acts that the agent hands to the authorized employer contact to perform.
      Requests no charter decides — renegotiating a contract price, forgiving remittances the employer deducted and kept, changing an individual worker's deductions at the employer's request, or legal disputes over wage deductions — fall outside policy and are handed off as POLICY_NOT_COVERED.
  - name: employer_paycard_program_funding
    claim:
      categories: [paycard]
      event_types: [paycard_funding_receipt, paycard_funding_return, paycard_payroll_load_batch, paycard_returned_load_credit, paycard_load_reversal_credit, paycard_fee_debit, paycard_fee_credit, paycard_kit_order, paycard_package_change, paycard_termination_notice, paycard_suspend, paycard_reinstate]
    summary: >
      Employer payroll staff call about their Payroll Card Program: a payroll batch funded late or not loaded, a funding payment their bank returned, a worker loaded twice or for the wrong amount, a load refused by a closed card, the monthly and per-card fees, card kit orders and their fees, a package change for their workers' card plan, or leaving the program, and the setting varies with the package, the program's status, the funding method, the funding balance and reserve, the history of returned funding, and whether the employer also holds a live Earned Wage Access program.
      The records involved are the program with its package, funding method, kit inventory and funding balance, its funding ledger of receipts, returns, batches, refused-load and reversal credits and fees, its kit orders, the employer's requests with the requester's role, the workers' card accounts and card loads under the program, and the employer's Access program agreement; the governing rules are the funding deadlines, methods and late and returned-funding fees of paycard_evt_funding, the load and consent rules of paycard_evt_payroll_loads, the reversal window, reasons, recovery limit and fee of paycard_evt_load_reversal, the per-package fee schedule and allowances of paycard_evt_fees and paycard_ewa_bundle, the credit window and courtesy limit of paycard_evt_fee_credits, the kit limits of paycard_evt_kit_orders, the reserve of paycard_reserve and the suspension, notice and package rules of paycard_lifecycle.
      Funding normally arrives before a batch loads and a load posts before any reversal of it can be asked for, but that order is background only.
      Booking funding receipts and returns, batches, credits, fees, fee credits, kit orders, suspensions and reinstatements is the agent's service work for a verified employer contact, while asking for a load reversal, choosing a new package or giving termination notice are acts only an authorized employer contact can take and are handed to them.
      Requests no charter decides — pulling back wages that were correct when sent, advancing payroll for an unfunded batch, charging a worker's card on the employer's instruction outside a reversal, or settling a pay dispute between employer and worker — fall outside policy and are handed off as POLICY_NOT_COVERED.
  - name: employer_instant_pay_disbursements
    claim:
      categories: [disburse]
      event_types: [disburse_prefund_deposit, disburse_prefund_return, disburse_payout, disburse_payout_return, disburse_payout_recall, disburse_fee, disburse_fee_credit, disburse_withdrawal, disburse_settings_update, disburse_tier_change, disburse_suspend, disburse_reinstate]
    summary: >
      Employer managers and payroll staff call about their Instant Pay Disbursement service: sending tips, off-cycle wages, final pay or reimbursements to a worker today, a payout that came back or went to the wrong worker, why a payout was refused, the fees on a month's payouts, a deposit their bank returned, auto replenishment, withdrawing prefunded money or closing the service, and the setting varies with the volume tier, the service status, the prefund balance and deposit availability, the payee's destination and card status, and whether the employer also holds a live Earned Wage Access program.
      The records involved are the service with its funding settings and prefund balance, its ledger of deposits, returns, payouts, payout returns, fees, fee credits and withdrawals, the employer's recall and closure requests, the payee workers' profiles and payroll card accounts, and the employer's Access program agreement; the governing rules are the per-tier limits and allowed pay types of disburse_evt_payout, the card-status gate of disburse_card_destination, the included allowance and per-destination fees of disburse_evt_fees and disburse_ewa_bundle, the deposit, balance and replenishment rules of disburse_evt_prefund, the return handling and recall window of disburse_evt_returns_recalls, the late-delivery and courtesy credits of disburse_evt_fee_credits, the volume bands of disburse_volume_review and the suspension and closure rules of disburse_lifecycle.
      Money is normally deposited before it is paid out and a payout is sent before it can come back or be recalled, but that order is background only.
      Booking deposits, deposit returns, payouts, payout returns, fees, credits, withdrawals, settings, tier moves, suspensions and reinstatements is the agent's service work for a verified employer contact, while recalling a payout or closing the service are the authorized employer contact's own requests and are handed to them.
      Requests no charter decides — recalling an instant push to an outside debit card, paying someone not on the employer's payroll, splitting a payout to get around a limit, or resolving a tip-pooling disagreement — fall outside policy and are handed off as POLICY_NOT_COVERED.
  - name: worker_early_wage_access
    claim:
      categories: [access]
      event_types: [access_transfer, access_fee, access_repayment, access_shortfall, access_writeoff, access_transfer_return, access_fee_reversal, access_level_change, access_recovery_authorization, access_recovery_revocation, access_suspend, access_reinstate, access_close]
    summary: >
      Hourly workers call about their Earned Wage Access Plan: how much of their earned pay they can take today, why a transfer was smaller than asked or refused, what a transfer to their card, debit card or bank costs, why their payday deduction was larger or smaller than expected, a shortfall carried to the next payday or written off, a transfer that never arrived or arrived late, a fee they want reversed, their tier, card autorecovery, or closing the plan, and the setting varies with the tier, the plan's status, the employer's fee model and configured access percentage, earnings synced so far in the pay period, open shortfalls, a second plan with another employer, the worker's payroll card status and any payroll-repaid loan.
      The records involved are the plan with its next payday, outstanding balance and recovery authorization, its ledger of transfers, fees, recoveries, shortfalls, write-offs, returns and reversals, its earnings lines, closure requests, the employer's program agreement, and the worker's card account, card transactions and loan; the governing rules are the availability computation, cutoff and per-tier caps of access_evt_transfer_availability with access_agg_combined_daily_limit and access_combined_deduction_ceiling, the per-tier fee schedule, free allowances and fee cap of access_evt_transfer_fee, the card gate of access_card_destination, the recovery, carryforward and autorecovery rules of access_evt_payday_recovery, the non-recourse write-off of access_evt_writeoff, the reversal reasons, windows and courtesy limits of access_evt_returns_and_reversals, the entry gates of access_level_review, and the accrual rules of access_earnings_accrual.
      Earnings normally accrue before a transfer, a transfer and its fee precede the payday recovery, and a shortfall precedes any carryforward or write-off, but that order is background only.
      Booking fees, recoveries, shortfalls, write-offs, returns, reversals, tier changes and suspensions is the agent's service work for a verified worker, while confirming a transfer's amount, speed and fee, granting or revoking card autorecovery, and confirming a plan closure are the worker's own decisions that the agent hands to the worker.
      Requests no charter decides — an advance beyond earned wages, disputing hours or pay rates the employer reported, stopping an employer's payroll deduction, or a loan-style payment plan for an Access balance — fall outside policy and are handed off as POLICY_NOT_COVERED.
  - name: worker_payroll_card_servicing
    claim:
      categories: [card]
      event_types: [card_fee, card_inactivity_fee, card_fee_refund, card_fee_correction, card_surcharge_rebate, card_provisional_credit, card_final_credit, card_provisional_credit_reversal, card_block, card_number_reissue, card_replacement_order, card_history_request, card_load, card_first_deposit_record, card_close]
    summary: >
      Workers paid on a Paystride Visa Payroll Card call about ATM and foreign transaction fees, an inactivity fee, a replacement card and what it costs, a lost or stolen card, transactions they did not make, an ATM that did not dispense cash, a load or early wage transfer that did not arrive, a provisional credit that was taken back, a written history, or closing the account, and the setting varies with the card plan set by the employer's package, the account status, the pay periods marked by payroll loads, the new-account period, the dates the cardholder saw the history and learned of a loss, and the worker's Access plan, Save account and employer programs.
      The records involved are the card account with its plan, status, block reason, consent and first deposit dates and balance, its transactions of every kind, its service orders, disputes and closure requests, and the worker's Access ledger and the employer's Payroll Card Program; the governing rules are the per-plan fee schedules and free allowances of card_evt_atm_and_foreign_fees and card_evt_service_fees with card_access_activity_interplay, the request window, courtesy limit, corrections and surcharge rebates of card_evt_fee_refunds, the Regulation E notice limits, investigation periods, provisional credit and reversal notice of card_evt_error_resolution, the liability caps and Visa Zero Liability override of card_unauthorized_liability, the load, debit and limit rules of card_evt_loads and card_evt_debits, and the state gates of card_lifecycle and card_evt_service_orders.
      A load normally precedes spending, a block precedes a replacement for a lost or stolen card, and notice of an error precedes any provisional credit or its reversal, but that order is background only.
      Booking fees, refunds, fee corrections, surcharge rebates, provisional and final credits and their reversals, blocks, replacement and history orders, loads and the first-deposit record is the agent's service work for a verified cardholder, while activating a card, confirming a found card or a replacement, and confirming the closure of the account are the cardholder's own acts that the agent hands to the cardholder.
      Requests no charter decides — reversing a merchant purchase the cardholder authorized outside a chargeback, overdrawing the card, changing the plan the employer chose, or recovering a disputed load from the employer — fall outside policy and are handed off as POLICY_NOT_COVERED.
