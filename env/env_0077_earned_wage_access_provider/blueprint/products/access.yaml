category: access
display_name: Paystride Earned Wage Access Plan
binding:
  holding_table: access_plans
  event_tables:
  - access_ledger
  - access_earnings
  intake_tables:
  - access_closure_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    outstanding_balance: outstanding_advances
lifecycle:
  states:
  - pending_activation
  - active
  - paused
  - suspended
  - closed
  transitions:
  - from: pending_activation
    to: active
    by: system
    means: the employer payroll file matches the worker and activates the plan
  - from: pending_activation
    to: closed
    by: system
    means: the enrollment lapses unmatched after the activation window
  - from: active
    to: paused
    by: system
    means: the employer reports leave or termination, or the employer program is suspended
  - from: paused
    to: active
    by: system
    means: the worker is reported employed again under a live program
  - from: active
    to: suspended
    by: agent
    means: the desk suspends the plan on suspected account takeover or destination fraud
  - from: suspended
    to: active
    by: agent
    means: the desk reinstates the plan after re-verification
  - from: active
    to: closed
    by: user
    means: the worker confirms closure of the plan; it takes effect once nothing is outstanding
  - from: paused
    to: closed
    by: system
    means: a plan paused for an employment end closes once its balance is recovered or written off
accounts:
- key: outstanding_advances
  unit: USD
  meaning: 'Amount the worker owes on the plan: early wage transfers and their fees not yet recovered, returned,
    reversed or written off.'
- key: accrued_net_earnings
  unit: USD
  meaning: Net earnings accrued in the current pay period from the employer feed, the base of the access percentage;
    reset on payday.
parameter_schema:
  access_cap_percent: Percent of the current pay period's accrued net earnings the worker may receive early (number,
    percent).
  per_pay_period_cap_usd: Dollar ceiling on early wage transfers booked against one pay period (USD).
  per_day_cap_usd: Dollar ceiling on early wage transfers booked on one calendar day, Eastern Time (USD).
  per_transfer_max_usd: Largest single early wage transfer (USD).
  per_transfer_min_usd: Smallest single early wage transfer (USD).
  max_transfers_per_day: Number of early wage transfers allowed on one calendar day, Eastern Time (count).
  max_transfers_per_pay_period: Number of early wage transfers allowed against one pay period (count).
  min_accrued_net_before_first_transfer_usd: Accrued net earnings the current pay period must reach before its first
    transfer (USD).
  access_during_open_shortfall_percent_of_cap: Percent of the normal percentage and pay-period room that stays available
    while an open shortfall is within the tolerated amount; 0 means access is withheld (number, percent).
  max_open_shortfall_usd_for_continued_access: Largest open shortfall under which reduced access continues (USD);
    0.00 means none is tolerated.
  instant_fee_external_debit_usd: Base fee for an instant transfer pushed to an external debit card (USD).
  instant_fee_paystride_card_usd: Fee for an instant transfer to the worker's own Paystride Visa Payroll Card (USD).
  nbd_fee_bank_usd: Fee for a next-business-day ACH transfer to an external bank account (USD).
  nbd_fee_paystride_card_usd: Fee for a next-business-day transfer to the worker's own Paystride Visa Payroll Card
    (USD).
  instant_fee_band_surcharge_usd: Ladder (mapping of transfer-amount band in USD -> surcharge in USD) added to the
    instant external debit card fee by the transfer amount; bands are inclusive at both ends.
  free_instant_transfers_per_pay_period: Instant transfers per pay period, to any destination, that carry no fee
    as a tier benefit (count).
  fee_cap_per_pay_period_usd: Ceiling on transfer fees booked against one pay period, net of fee reversals (USD).
  access_cutoff_business_days_before_payday: Business days before the payday on which access for that pay period
    closes (count of business days).
  instant_delivery_sla_minutes: Minutes within which an instant transfer must be delivered before its fee becomes
    refundable as late (minutes).
  nbd_submission_cutoff_time_et: Eastern Time after which a next-business-day request made on a business day is
    treated as made on the following business day (HH:MM).
  nbd_delivery_business_days: Business days after the request date on which a next-business-day transfer is delivered
    (count).
  earnings_availability_lag_days: Calendar days after a shift's earnings sync before those earnings count toward
    accrued net (days).
  primary_recovery_method: Method by which advances are recovered on payday (enum value of recovery_method).
  card_autorecovery_allowed: Whether an unrecovered amount may be debited from the worker's Paystride Visa Payroll
    Card under a standing authorization (boolean).
  card_autorecovery_delay_business_days: Business days after the payday on which a card autorecovery debit is attempted
    (count).
  carryforward_max_pay_periods: Number of later paydays to which an unrecovered amount may be carried before it
    is written off (count).
  writeoff_wait_days: Calendar days after the payday of a shortfall that will not be carried before it is written
    off, leaving time for card autorecovery or a voluntary payment (days).
  voluntary_repayment_allowed: Whether the worker may repay an outstanding amount early from their own funds (boolean).
  fee_reversal_request_window_days: Calendar days after a fee's entry date within which the worker may request its
    reversal (days).
  courtesy_fee_reversals_per_12_months: Goodwill fee reversals allowed in any rolling 365-day window (count).
  late_instant_fee_refund: Whether an instant fee is reversed when delivery exceeded the delivery standard (boolean).
  return_reversal_business_days: Business days after a return or delivery failure notice within which the principal
    is reversed (count).
  downgrade_steps_on_shortfall: Tier steps the plan drops at the first level review after a shortfall (count).
  writeoff_resets_to_starter: Whether a write-off returns the plan to Paystride Access Starter (boolean).
  level_review_cadence: When the plan tier is reviewed (text).
  tips_included_in_accrual: Whether card tips reported by the employer's point-of-sale feed count toward accrued
    net earnings (boolean).
  overtime_included_in_accrual: Whether overtime hours count toward accrued net earnings (boolean).
  shift_differential_included_in_accrual: Whether shift differential pay counts toward accrued net earnings (boolean).
  gross_to_net_estimation_percent: Percent of gross used as estimated net when the employer feed reports gross only
    (number, percent).
  enrollment_activation_window_days: Calendar days after enrollment within which employer verification must activate
    the plan (days).
  reenrollment_cooldown_days: Calendar days after a plan closes before the worker may enroll again under the same
    employer program (days).
  combined_deduction_ceiling_percent_of_net: Percent of the pay period's accrued net that transfers plus a Paystride
    payroll-repaid loan installment due the same payday may not exceed (number, percent).
  card_destination_requires_active_card: Whether transfers to the Paystride Visa Payroll Card require that card
    account to be active (boolean).
  weekend_instant_available: Whether instant transfers run on weekends and Federal Reserve holidays (boolean).
  nbd_cancel_before_cutoff_allowed: Whether a next-business-day transfer can be cancelled before its submission
    cutoff (boolean).
  voluntary_payment_min_usd: Smallest voluntary payment the worker may make, unless the outstanding balance is smaller
    (USD).
  autorecovery_max_attempts_per_shortfall: Card autorecovery debits attempted for one payday's shortfall (count).
  tier_upgrade_max_steps_per_review: Most tiers a plan may move up at one level review (count).
  late_nbd_fee_refund: Whether a next-business-day fee is reversed when the transfer was delivered after its expected
    delivery date (boolean).
  partial_deduction_allowed: Whether the employer deducts the part of the amount due that net pay can cover when
    net pay cannot cover all of it (boolean).
