- id: card_lifecycle
  subject:
  - card_activate
  - card_close_unactivated
  - card_block
  - card_unblock
  - card_close
  - card_number_reissue
  - card_plan_change
  rule: >-
    Activating the card is the cardholder's own act. A never-activated account with a zero balance closes when the
    worker withdraws consent to wage payment by card or the employer's Payroll Card Program ends. The desk blocks
    only an account whose status is active. The desk blocks the card at once when the cardholder reports it lost
    or stolen (block_reason lost or stolen), reports transactions they did not make (suspected_fraud), or asks for
    a temporary block (cardholder_request); a block stops every debit but never stops loads. A lost or stolen card
    number is never reactivated: that block lifts only when the cardholder activates the replacement card, whose
    new card_last4 is recorded when the replacement is ordered. A suspected_fraud or cardholder_request block lifts
    when the cardholder confirms the card is in hand and says which transactions they made. Closing the account
    is the cardholder's own decision: the desk registers a closure request, the remaining balance is paid out by
    check free of charge or by transfer to the cardholder's bank account, and the account closes once the balance
    is zero. A closure is confirmed only for an account whose status is active. An account is not closed while any
    of its disputes has status submitted or investigating. The card plan follows the employer's Payroll Card Program
    package and changes on the day the employer's package changes; the cardholder cannot choose or buy a plan.
  eligibility:
  - id: block_from_active
    applies_to:
    - card_block
    kind: state
    condition: The desk blocks only an account whose status is active.
    evidence_fields:
    - card_accounts.status
    - card_accounts.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.card_account_id
      action_bindings:
        card_accounts.card_account_id: card_account_id
    state_contract:
      field: card_accounts.status
      allowed:
      - active
  - id: close_from_active
    applies_to:
    - card_close
    kind: state
    condition: A closure is confirmed only for an account whose status is active.
    evidence_fields:
    - card_accounts.status
    - card_accounts.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.card_account_id
      action_bindings:
        card_accounts.card_account_id: card_account_id
    state_contract:
      field: card_accounts.status
      allowed:
      - active
  - id: no_open_dispute
    applies_to:
    - card_close
    kind: state
    condition: An account is not closed while any of its disputes has status submitted or investigating.
    evidence_fields:
    - card_disputes.dispute_status
    - card_disputes.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_disputes.card_account_id
      action_bindings:
        card_disputes.card_account_id: card_account_id
    state_contract:
      field: card_disputes.dispute_status
      allowed:
      - resolved_error_found
      - resolved_no_error
      - withdrawn
- id: card_evt_service_orders
  subject:
  - card_replacement_order
  - card_history_request
  rule: >-
    A replacement card is ordered only for an account whose status is active or blocked. A card reported lost or
    stolen is blocked before its replacement is ordered, and its replacement carries a new card number; a damaged
    card is replaced on the same number while the account stays active; a card nearing expiry is reissued with order_reason
    expiring. Standard delivery takes replacement_standard_delivery_business_days business days and expedited delivery
    expedited_delivery_business_days; replacement and shipping fees follow card_evt_service_fees. The cardholder
    may ask at any time for a written history covering up to written_history_free_months months, mailed at written_history_fee_usd;
    the date it is sent counts as history access for error notices. Online and in-app history covers electronic_history_months
    months.
  eligibility:
  - id: replacement_status
    applies_to:
    - card_replacement_order
    kind: state
    condition: A replacement card is ordered only for an account whose status is active or blocked.
    evidence_fields:
    - card_accounts.status
    - card_accounts.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.card_account_id
      action_bindings:
        card_accounts.card_account_id: card_account_id
    state_contract:
      field: card_accounts.status
      allowed:
      - active
      - blocked
  params:
    per_tier:
      Paystride Visa Payroll Card Essential:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
      Paystride Visa Payroll Card Standard:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
      Paystride Visa Payroll Card Select:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
      Paystride Visa Payroll Card Advantage:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
      Paystride Visa Payroll Card Premier:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
      Paystride Visa Payroll Card Elite:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
