    to the card is a load and therefore activity, exactly like a payroll load, so a cardholder who receives early
    pay on the card is not inactive for the inactivity period that follows it; a card autorecovery debit taken for
    the Access plan under the cardholder's standing authorization is not cardholder-initiated and is never activity.
