- id: card_evt_error_resolution
  subject:
  - card_provisional_credit
  - card_final_credit
  - card_provisional_credit_reversal
  rule: >-
    Each dispute concerns one posted transaction and follows one of two paths, fixed when it is registered and never
    both. An unauthorized transaction, an incorrect amount, a duplicate charge, ATM cash not dispensed, or a load
    not credited is an electronic fund transfer error handled under Regulation E error resolution (reg_e_error_resolution).
    A complaint about goods or services not received or not as described on a purchase the cardholder made is not
    a Regulation E error; it is pursued only as a Visa chargeback (network_chargeback), with no Regulation E deadlines
    and no provisional credit, and a final credit posts only if the chargeback is won. Paystride completes a Regulation
    E investigation within investigation_business_days business days of the notice date, or new_account_investigation_business_days
    when the disputed transaction posted within new_account_days calendar days after first_deposit_date. When it
    cannot, it may take until extended_investigation_calendar_days calendar days after the notice date, or extended_investigation_days_new_pos_foreign
    for a new-account, point-of-sale debit card or foreign-initiated transaction, but only by posting a provisional
    credit of the disputed amount, less any cardholder liability under card_unauthorized_liability, within provisional_credit_business_days
    business days of the notice date (new_account_investigation_business_days for a new-account transaction). A
    provisional credit is owed only when the notice arrives within error_notice_outer_limit_days calendar days after
    the disputed transaction's posted date, or, when later, within error_notice_window_days calendar days after
    the history access date. Calendar days are counted from the day after the posted date or the history access
    date, and a notice arriving on the last day of either period is timely. A later notice is still investigated
    and earns a final credit if an error is found, but no provisional credit and no deadline. Provisional credit
    is also not owed when the notice was oral, written confirmation was asked for, and none arrived within written_confirmation_window_business_days
    business days of the notice. A provisional credit is posted only while the dispute's status is investigating.
    A dispute receives at most one provisional credit. The result is reported within result_notice_business_days
    business days after the investigation ends. When an error is found, a provisional credit already posted becomes
    final with no second credit; where none was posted, a final credit of the error amount, less any cardholder
    liability, posts within error_correction_business_days business days, and every fee the error caused is returned
    by a fee correction under card_evt_fee_refunds. A final credit is posted only on a dispute whose status is resolved_error_found.
    A dispute receives at most one final credit, and none when its provisional credit already stands. When no error,
    or a smaller error, is found, the provisional credit or its excess is debited back by a reversal pointing to
    the provisional credit. A provisional credit is reversed only on a dispute whose status is resolved_no_error
    or resolved_error_found. A provisional credit reversal posts only after provisional_reversal_notice_business_days
    business days have passed since the resolution date. Business days are Monday through Friday excluding Federal
    Reserve holidays, counted from the day after the resolution date. A provisional credit is reversed at most once.
    A reversal never exceeds the provisional credit and may take the balance only as low as zero; any part it cannot
    take stays uncollected.
  eligibility:
  - id: notice_timely
    applies_to:
    - card_provisional_credit
    kind: time
    condition: A provisional credit is owed only when the notice arrives within error_notice_outer_limit_days calendar
      days after the disputed transaction's posted date, or, when later, within error_notice_window_days calendar
      days after the history access date.
    evidence_fields:
    - card_transactions.posted_date
    - card_disputes.history_access_date
    - card_disputes.dispute_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_disputes.dispute_id
      action_bindings:
        card_disputes.dispute_id: dispute_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the disputed transaction's posted date
      anchor_source: card_transactions.posted_date
      relation: not_after
      duration_source: variants.error_notice_outer_limit_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the posted date or the history access date, and
        a notice arriving on the last day of either period is timely.
      boundary: inclusive
  - id: provisional_status
    applies_to:
    - card_provisional_credit
    kind: state
    condition: A provisional credit is posted only while the dispute's status is investigating.
    evidence_fields:
    - card_disputes.dispute_status
    - card_disputes.dispute_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_disputes.dispute_id
      action_bindings:
        card_disputes.dispute_id: dispute_id
    state_contract:
      field: card_disputes.dispute_status
      allowed:
      - investigating
  - id: final_status
    applies_to:
    - card_final_credit
    kind: state
    condition: A final credit is posted only on a dispute whose status is resolved_error_found.
    evidence_fields:
    - card_disputes.dispute_status
    - card_disputes.dispute_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_disputes.dispute_id
      action_bindings:
        card_disputes.dispute_id: dispute_id
    state_contract:
      field: card_disputes.dispute_status
      allowed:
      - resolved_error_found
  - id: reversal_status
    applies_to:
    - card_provisional_credit_reversal
    kind: state
    condition: A provisional credit is reversed only on a dispute whose status is resolved_no_error or resolved_error_found.
    evidence_fields:
    - card_disputes.dispute_status
    - card_disputes.dispute_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_disputes.dispute_id
      action_bindings:
        card_disputes.dispute_id: dispute_id
    state_contract:
      field: card_disputes.dispute_status
      allowed:
      - resolved_no_error
      - resolved_error_found
  - id: reversal_notice
    applies_to:
    - card_provisional_credit_reversal
    kind: time
    condition: A provisional credit reversal posts only after provisional_reversal_notice_business_days business
      days have passed since the resolution date.
    evidence_fields:
    - card_disputes.resolution_date
    - card_disputes.dispute_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_disputes.dispute_id
      action_bindings:
        card_disputes.dispute_id: dispute_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the resolution date
      anchor_source: card_disputes.resolution_date
      relation: not_before
      duration_source: variants.provisional_reversal_notice_business_days
      unit: business_days
      counting_rule: Business days are Monday through Friday excluding Federal Reserve holidays, counted from the
        day after the resolution date.
      boundary: inclusive
  - id: one_provisional
    applies_to:
    - card_provisional_credit
    kind: dedup
    condition: A dispute receives at most one provisional credit.
    evidence_fields:
    - card_transactions.dispute_id
    - card_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.dispute_id
      action_bindings:
        card_transactions.dispute_id: dispute_id
    dedup_contract:
      table: card_transactions
      mode: separate_record
      object_bindings:
        dispute_id: dispute_id
      duplicate_filters:
        event_type:
        - card_provisional_credit
      distinct_fields: []
  - id: one_final
    applies_to:
    - card_final_credit
    kind: dedup
    condition: A dispute receives at most one final credit, and none when its provisional credit already stands.
    evidence_fields:
    - card_transactions.dispute_id
    - card_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.dispute_id
      action_bindings:
        card_transactions.dispute_id: dispute_id
    dedup_contract:
      table: card_transactions
      mode: separate_record
      object_bindings:
        dispute_id: dispute_id
      duplicate_filters:
        event_type:
        - card_final_credit
      distinct_fields: []
  - id: one_reversal
    applies_to:
    - card_provisional_credit_reversal
    kind: dedup
    condition: A provisional credit is reversed at most once.
    evidence_fields:
    - card_transactions.dispute_id
    - card_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.dispute_id
      action_bindings:
        card_transactions.dispute_id: dispute_id
    dedup_contract:
      table: card_transactions
      mode: separate_record
      object_bindings:
        dispute_id: dispute_id
      duplicate_filters:
        event_type:
        - card_provisional_credit_reversal
      distinct_fields: []
  params:
    per_tier:
      Paystride Visa Payroll Card Essential:
        provisional_credit_business_days: =provisional_credit_business_days
        investigation_business_days: =investigation_business_days
      Paystride Visa Payroll Card Standard:
        provisional_credit_business_days: =provisional_credit_business_days
        investigation_business_days: =investigation_business_days
