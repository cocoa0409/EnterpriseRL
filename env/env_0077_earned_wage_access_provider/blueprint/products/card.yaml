events:
- type: card_issue
  target: card_accounts
  mutation: create
  meaning: >-
    A payroll card account is opened for a worker under the employer's Payroll Card Program and the first card is
    issued.
  grain: one row per card account change
  fields:
    customer_id: the cardholder (foreign key -> customers)
    paycard_program_id: the employer Payroll Card Program under which the account was opened (foreign key -> paycard_programs)
    variant_name: the card plan held, as the official full plan name; set by the employer's paycard package
    status: lifecycle state of the card account (see the card charter lifecycle)
    issued_date: date the account was opened and the first card issued
    card_last4: last four digits of the card currently issued on the account, exactly as printed
    payroll_consent_date: date the worker gave the employer written, voluntary consent to receive wages on the card;
      empty if no consent is on file
    first_deposit_date: posted date of the first load ever credited to the account; the start of the new-account
      period; empty before any load
    block_reason: why the account is blocked; none when not blocked
    card_balance: 'current available balance: loads, fee refunds and dispute credits less debits, fees and dispute
      credit reversals; never negative'
  triggers: []
- type: card_activate
  target: card_accounts
  mutation:
    transition:
      from: issued
      to: active
  meaning: The cardholder activates the card.
  grain: one row per card account change
  fields:
    activated_date: date the cardholder activated the card; empty until then
  triggers: []
- type: card_close_unactivated
  target: card_accounts
  mutation:
    transition:
      from: issued
      to: closed
  meaning: >-
    A never-activated account with a zero balance is closed because the worker withdrew consent to wage payment
    by card or the employer's paycard program ended.
  grain: one row per card account change
  fields:
    closed_date: date the account closed; empty while not closed
  triggers: []
- type: card_block
  target: card_accounts
  mutation:
    transition:
      from: active
      to: blocked
  meaning: The desk blocks the card after a lost, stolen or fraud report or at the cardholder's request.
  grain: one row per card account change
  fields:
    block_reason: why the account is blocked; none when not blocked
  triggers: []
- type: card_unblock
  target: card_accounts
  mutation:
    transition:
      from: blocked
      to: active
  meaning: >-
    The cardholder confirms the found card in hand or activates the replacement card, and the block is lifted.
  grain: one row per card account change
  fields:
    block_reason: why the account is blocked; none when not blocked
  triggers: []
- type: card_close
  target: card_accounts
  mutation:
    transition:
      from: active
      to: closed
  meaning: The cardholder confirms closure of the account after the remaining balance is paid out.
  grain: one row per card account change
  fields:
    closed_date: date the account closed; empty while not closed
  triggers: []
- type: card_number_reissue
  target: card_accounts
  mutation: update
  meaning: A replacement card with a new number is issued on the same account.
  grain: one row per card account change
  fields:
    card_last4: last four digits of the card currently issued on the account, exactly as printed
  triggers: []
- type: card_plan_change
  target: card_accounts
  mutation: update
  meaning: The card plan changes because the employer changed its Payroll Card Program package.
  grain: one row per card account change
  fields:
    variant_name: the card plan held, as the official full plan name; set by the employer's paycard package
  triggers: []
- type: card_first_deposit_record
  target: card_accounts
  mutation: update
  meaning: The posted date of the first load ever credited is recorded, starting the new-account period.
  grain: one row per card account change
  fields:
    first_deposit_date: posted date of the first load ever credited to the account; the start of the new-account
      period; empty before any load
  triggers: []
- type: card_load
  target: card_transactions
  meaning: >-
    Funds credited to the card: an employer payroll or off-cycle load, an early wage transfer, an employer instant
    pay disbursement, or a withdrawal from the cardholder's Paystride Save account.
  grain: one row per load posted
  distinguish_by:
  - posted_date
  - load_source
  - source_ref_id
  - daily_sequence
  fields:
    txn_date: date the transaction was initiated or authorized
    posted_date: date the transaction posted to the account; the date error-resolution outer limits count from
    amount: size of the movement, always greater than zero; loads, fee refunds and dispute credits add to and debits,
      fees and dispute credit reversals subtract from the balance
    daily_sequence: ordinal of the transaction among the account's transactions of the same event family posted
      on the same posted_date, starting at 1
    load_source: origin of a load; none on other transactions
    merchant_name: merchant, ATM operator or originator name exactly as it appears on the account history; empty
      for fees
    source_ref_id: 'reference of the originating record in another ledger: the early wage transfer, the employer
      payroll load batch or disbursement, the access recovery, or the employer reversal or recall request; empty
      otherwise'
  account: card_balance
  direction: in
  triggers: []
- type: card_debit
  target: card_transactions
  meaning: >-
    Funds leaving the card: a purchase, an ATM or teller cash withdrawal, a card-to-bank transfer, an early wage
    access recovery, a transfer to Paystride Save, or an approved employer reversal of an erroneous load.
  grain: one row per debit posted
  distinguish_by:
  - posted_date
  - debit_type
  - daily_sequence
  fields:
    txn_date: date the transaction was initiated or authorized
    posted_date: date the transaction posted to the account; the date error-resolution outer limits count from
    amount: size of the movement, always greater than zero; loads, fee refunds and dispute credits add to and debits,
      fees and dispute credit reversals subtract from the balance
    daily_sequence: ordinal of the transaction among the account's transactions of the same event family posted
      on the same posted_date, starting at 1
    debit_type: kind of debit; none on other transactions
    atm_network: ATM network of an ATM withdrawal, balance inquiry or decline (copied onto its fee); none otherwise
    foreign_transaction: whether a debit was made in a foreign currency or processed outside the United States
    atm_surcharge_usd: surcharge the ATM owner added to an out-of-network withdrawal, included in its amount; 0.00
      otherwise
    merchant_name: merchant, ATM operator or originator name exactly as it appears on the account history; empty
      for fees
    source_ref_id: 'reference of the originating record in another ledger: the early wage transfer, the employer
      payroll load batch or disbursement, the access recovery, or the employer reversal or recall request; empty
      otherwise'
  account: card_balance
  direction: out
  triggers: []
- type: card_fee
  target: card_transactions
  meaning: >-
    A transaction or service fee from the card plan's fee schedule: ATM, foreign transaction, replacement, shipping
    or card-to-bank.
  grain: one row per fee assessed
  distinguish_by:
  - fee_type
  - related_txn_id
  - posted_date
  - daily_sequence
  fields:
    txn_date: date the transaction was initiated or authorized
    posted_date: date the transaction posted to the account; the date error-resolution outer limits count from
    amount: size of the movement, always greater than zero; loads, fee refunds and dispute credits add to and debits,
      fees and dispute credit reversals subtract from the balance
    daily_sequence: ordinal of the transaction among the account's transactions of the same event family posted
      on the same posted_date, starting at 1
    fee_type: kind of fee on a fee, or the fee a refund returns; none otherwise
    atm_network: ATM network of an ATM withdrawal, balance inquiry or decline (copied onto its fee); none otherwise
    related_txn_id: 'the narrowest source transaction: for a fee the transaction or service order that incurred
      it, for a fee refund or fee correction the fee, for a surcharge rebate the withdrawal, for a provisional credit
      reversal the provisional credit; empty otherwise'
  account: card_balance
  direction: out
  triggers: []
- type: card_inactivity_fee
  target: card_transactions
  meaning: The monthly inactivity fee on an account with no activity for the plan's inactivity period.
  grain: one row per account and inactive month
  distinguish_by:
  - posted_date
  fields:
    txn_date: date the transaction was initiated or authorized
    posted_date: date the transaction posted to the account; the date error-resolution outer limits count from
    amount: size of the movement, always greater than zero; loads, fee refunds and dispute credits add to and debits,
      fees and dispute credit reversals subtract from the balance
    fee_type: kind of fee on a fee, or the fee a refund returns; none otherwise
  account: card_balance
  direction: out
  triggers: []
- type: card_fee_refund
  target: card_transactions
  meaning: Return of one assessed fee at the cardholder's request, as charged in error or as a courtesy.
  grain: one row per fee refunded on request
  distinguish_by:
  - related_txn_id
  fields:
    txn_date: date the transaction was initiated or authorized
    posted_date: date the transaction posted to the account; the date error-resolution outer limits count from
    amount: size of the movement, always greater than zero; loads, fee refunds and dispute credits add to and debits,
      fees and dispute credit reversals subtract from the balance
    fee_type: kind of fee on a fee, or the fee a refund returns; none otherwise
    refund_reason: why a fee refund, fee correction or rebate was given; none otherwise
    related_txn_id: 'the narrowest source transaction: for a fee the transaction or service order that incurred
      it, for a fee refund or fee correction the fee, for a surcharge rebate the withdrawal, for a provisional credit
      reversal the provisional credit; empty otherwise'
  account: card_balance
  direction: in
  triggers: []
- type: card_fee_correction
  target: card_transactions
  meaning: >-
    Return of one assessed fee that Paystride found charged in error itself or that a resolved dispute shows the
    error caused.
  grain: one row per fee corrected
  distinguish_by:
  - related_txn_id
  fields:
    txn_date: date the transaction was initiated or authorized
    posted_date: date the transaction posted to the account; the date error-resolution outer limits count from
    amount: size of the movement, always greater than zero; loads, fee refunds and dispute credits add to and debits,
      fees and dispute credit reversals subtract from the balance
    fee_type: kind of fee on a fee, or the fee a refund returns; none otherwise
    refund_reason: why a fee refund, fee correction or rebate was given; none otherwise
    related_txn_id: 'the narrowest source transaction: for a fee the transaction or service order that incurred
      it, for a fee refund or fee correction the fee, for a surcharge rebate the withdrawal, for a provisional credit
      reversal the provisional credit; empty otherwise'
  account: card_balance
  direction: in
  triggers: []
- type: card_surcharge_rebate
  target: card_transactions
  meaning: Rebate of the ATM owner's surcharge on one out-of-network withdrawal.
  grain: one row per withdrawal rebated
  distinguish_by:
  - related_txn_id
  fields:
    txn_date: date the transaction was initiated or authorized
    posted_date: date the transaction posted to the account; the date error-resolution outer limits count from
    amount: size of the movement, always greater than zero; loads, fee refunds and dispute credits add to and debits,
      fees and dispute credit reversals subtract from the balance
    refund_reason: why a fee refund, fee correction or rebate was given; none otherwise
    related_txn_id: 'the narrowest source transaction: for a fee the transaction or service order that incurred
      it, for a fee refund or fee correction the fee, for a surcharge rebate the withdrawal, for a provisional credit
      reversal the provisional credit; empty otherwise'
  account: card_balance
  direction: in
  triggers: []
- type: card_provisional_credit
  target: card_transactions
  meaning: A provisional credit of the disputed amount while a Regulation E investigation continues.
  grain: one row per dispute credited provisionally
  distinguish_by:
  - dispute_id
  fields:
    txn_date: date the transaction was initiated or authorized
    posted_date: date the transaction posted to the account; the date error-resolution outer limits count from
    amount: size of the movement, always greater than zero; loads, fee refunds and dispute credits add to and debits,
      fees and dispute credit reversals subtract from the balance
    credit_kind: provisional on provisional credits and their reversals, final on final credits; none otherwise
    dispute_id: the dispute a provisional credit, final credit or provisional credit reversal belongs to (foreign
      key -> card_disputes); empty otherwise
  account: card_balance
  direction: in
  triggers: []
- type: card_final_credit
  target: card_transactions
  meaning: A final credit of an error found, where no provisional credit was posted, or of a chargeback won.
  grain: one row per dispute credited finally
  distinguish_by:
  - dispute_id
  fields:
    txn_date: date the transaction was initiated or authorized
    posted_date: date the transaction posted to the account; the date error-resolution outer limits count from
    amount: size of the movement, always greater than zero; loads, fee refunds and dispute credits add to and debits,
      fees and dispute credit reversals subtract from the balance
    credit_kind: provisional on provisional credits and their reversals, final on final credits; none otherwise
    dispute_id: the dispute a provisional credit, final credit or provisional credit reversal belongs to (foreign
      key -> card_disputes); empty otherwise
  account: card_balance
  direction: in
  triggers: []
- type: card_provisional_credit_reversal
  target: card_transactions
  meaning: >-
    Debit of a provisional credit, or of its excess, after the investigation found no error or a smaller error.
  grain: one row per provisional credit reversed
  distinguish_by:
  - dispute_id
  fields:
    txn_date: date the transaction was initiated or authorized
    posted_date: date the transaction posted to the account; the date error-resolution outer limits count from
    amount: size of the movement, always greater than zero; loads, fee refunds and dispute credits add to and debits,
      fees and dispute credit reversals subtract from the balance
    credit_kind: provisional on provisional credits and their reversals, final on final credits; none otherwise
    dispute_id: the dispute a provisional credit, final credit or provisional credit reversal belongs to (foreign
      key -> card_disputes); empty otherwise
    related_txn_id: 'the narrowest source transaction: for a fee the transaction or service order that incurred
      it, for a fee refund or fee correction the fee, for a surcharge rebate the withdrawal, for a provisional credit
      reversal the provisional credit; empty otherwise'
  account: card_balance
  direction: out
  triggers: []
- type: card_replacement_order
  target: card_service_orders
  meaning: An order for a replacement card on the account, for loss, theft, damage or expiry.
  grain: one row per replacement ordered
  distinguish_by:
  - order_date
  - order_reason
  fields:
    order_date: date the order was placed
    order_reason: why the order was placed
    shipping_speed: delivery speed of a replacement card; none for history requests
    history_months: months of history requested in a written history order; 0 on card orders
  triggers:
  - event: card:card_number_reissue
    when:
      order_reason:
      - lost
      - stolen
    map: {}
- type: card_history_request
  target: card_service_orders
  meaning: A request for a written history of the account mailed to the cardholder.
  grain: one row per history requested
  distinguish_by:
  - order_date
  - history_months
  fields:
    order_date: date the order was placed
    order_reason: why the order was placed
    shipping_speed: delivery speed of a replacement card; none for history requests
    history_months: months of history requested in a written history order; 0 on card orders
  triggers: []
measures:
- id: card_msr_pay_period_oon_withdrawals
  window: 'the card''s pay period containing the withdrawal: from the posted_date of the latest payroll load (load_source
    payroll) on or before it to the day before the next payroll load'
  measure: count of card_debit atm_withdrawal entries with atm_network out_of_network posted in the pay period,
    in order of posted_date then daily_sequence, the withdrawal in question included
- id: card_msr_pay_period_card_to_bank
  window: the card's pay period containing the transfer, defined as for card_msr_pay_period_oon_withdrawals
  measure: count of card_debit card_to_bank_transfer entries posted in the pay period, in posting order, the transfer
    in question included
- id: card_msr_replacements_365d
  window: the 365 calendar days ending on the order date
  measure: count of earlier card_replacement_order entries with order_reason lost, stolen or damaged on the account
- id: card_msr_last_activity_date
  window: the account's whole history up to today
  measure: latest posted_date among card_load entries of any load_source and card_debit entries the cardholder initiated
    (purchase, atm_withdrawal, otc_cash_withdrawal, card_to_bank_transfer, save_transfer); ewa_recovery and employer_load_reversal
    debits and fees are not activity
- id: card_msr_courtesy_refunds_365d
  window: the 365 calendar days ending today
  measure: count of card_fee_refund entries with refund_reason courtesy on the account
- id: card_msr_month_surcharge_rebates
  window: the calendar month of the withdrawal
  measure: count of card_surcharge_rebate entries whose withdrawal posted in that month
- id: card_msr_day_atm_total
  window: one posted_date
  measure: sum of amount and count of card_debit atm_withdrawal entries on that date
- id: card_msr_day_purchase_total
  window: one posted_date
  measure: sum of amount of card_debit purchase entries on that date
- id: card_msr_day_card_to_bank_total
  window: one posted_date
  measure: sum of amount of card_debit card_to_bank_transfer entries on that date
policies:
- id: card_agg_multi_holding
  subject:
  - card_issue
  rule: >-
    A worker holds at most max_per_customer payroll card account; loads from a second employer's Payroll Card Program
    post to the same account, whose plan stays the one set by the program it was opened under. A worker may not
    hold a second card account that is not closed. An account is opened only under an employer Payroll Card Program
    whose status is live. An account is opened only when the worker's written, voluntary consent to receive wages
    on the card is on file as payroll_consent_date. Under Regulation E no employer may require a worker to be paid
    on a payroll card as a condition of employment, so a worker who has not consented, or who prefers direct deposit
    or a paper check, is paid that way instead and no account is opened. The account opens in issued status with
    a zero balance, block_reason none, the plan matching the employer's Payroll Card Program package as listed in
    each plan's entry gate, and no first_deposit_date until a load posts.
  eligibility:
  - id: one_account
    applies_to:
    - card_issue
    kind: dedup
    condition: A worker may not hold a second card account that is not closed.
    evidence_fields:
    - card_accounts.customer_id
    - card_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.customer_id
      action_bindings:
        card_accounts.customer_id: customer_id
    dedup_contract:
      table: card_accounts
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - issued
        - active
        - blocked
      distinct_fields:
      - issued_date
  - id: program_live
    applies_to:
    - card_issue
    kind: state
    condition: An account is opened only under an employer Payroll Card Program whose status is live.
    evidence_fields:
    - paycard_programs.status
    - paycard_programs.paycard_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_programs.paycard_program_id
      action_bindings:
        paycard_programs.paycard_program_id: paycard_program_id
    state_contract:
      field: paycard_programs.status
      allowed:
      - live
  - id: wage_consent
    applies_to:
    - card_issue
    kind: authorization
    condition: An account is opened only when the worker's written, voluntary consent to receive wages on the card
      is on file as payroll_consent_date.
    evidence_fields:
    - card_accounts.payroll_consent_date
    - card_accounts.customer_id
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - card_accounts.customer_id
      action_bindings:
        card_accounts.customer_id: customer_id
  params:
    max_per_customer: 1
- id: card_evt_atm_and_foreign_fees
  subject:
  - card_fee
  rule: >-
    ATM and foreign transaction fees follow the fee schedule of the card plan held on the posted date of the transaction
    that incurred them; each fee points to that transaction through related_txn_id, carries its atm_network, and
    posts on the same date. A transaction incurs at most one fee of each fee type. An in-network ATM withdrawal
    costs in_network_atm_withdrawal_fee_usd. A domestic out-of-network ATM withdrawal costs out_of_network_atm_withdrawal_fee_usd
    unless its position in its pay period (card_msr_pay_period_oon_withdrawals) is within free_out_of_network_withdrawals_per_pay_period.
    The free allowance covers only the Paystride fee, never the surcharge the ATM owner adds, which is part of the
    withdrawal amount. A card pay period runs from one payroll load to the next; early wage transfers, instant pay
    disbursements and off-cycle payroll loads never start a new pay period. An ATM withdrawal outside the United
    States (atm_network international) costs international_atm_fee_usd and is never free; a teller cash withdrawal
    at a Visa member bank costs otc_cash_withdrawal_fee_usd. Each balance inquiry at an out-of-network ATM costs
    atm_balance_inquiry_fee_usd and each withdrawal declined for insufficient funds at an out-of-network ATM costs
    atm_decline_fee_usd; neither leaves a debit on the account, so these two fees point to no transaction and are
    told apart by daily_sequence; inquiries and declines at in-network ATMs are free. A purchase or withdrawal with
    foreign_transaction true carries in addition a foreign transaction fee of foreign_transaction_fee_percent of
    its amount, rounded to the nearest cent. A fee that comes to zero is not assessed. No fee ever takes the balance
    below zero: a fee larger than the available balance is reduced to the balance, and none is assessed on a zero
    balance. A fee is never assessed on a transaction that was itself an error corrected under card_evt_error_resolution.
  eligibility:
  - id: one_fee_per_type
    applies_to:
    - card_fee
    kind: dedup
    condition: A transaction incurs at most one fee of each fee type.
    evidence_fields:
    - card_transactions.related_txn_id
    - card_transactions.fee_type
    - card_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.related_txn_id
        - card_transactions.fee_type
      action_bindings:
        card_transactions.related_txn_id: related_txn_id
        card_transactions.fee_type: fee_type
    dedup_contract:
      table: card_transactions
      mode: separate_record
      object_bindings:
        related_txn_id: related_txn_id
        fee_type: fee_type
      duplicate_filters:
        event_type:
        - card_fee
      distinct_fields:
      - daily_sequence
  params:
    per_tier:
      Paystride Visa Payroll Card Essential:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
      Paystride Visa Payroll Card Standard:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
      Paystride Visa Payroll Card Select:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
      Paystride Visa Payroll Card Advantage:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
      Paystride Visa Payroll Card Premier:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
      Paystride Visa Payroll Card Elite:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
  formula:
    oon_fee: 0 if card_msr_pay_period_oon_withdrawals <= free_out_of_network_withdrawals_per_pay_period else out_of_network_atm_withdrawal_fee_usd
    foreign_fee: round(amount * foreign_transaction_fee_percent / 100, 2)
  measures:
  - card_msr_pay_period_oon_withdrawals
- id: card_evt_service_fees
  subject:
  - card_fee
  - card_inactivity_fee
  rule: >-
    Service fees follow the plan held on the day they are incurred. A service order incurs at most one fee of each
    fee type. A replacement ordered for a lost, stolen or damaged card costs card_replacement_fee_usd unless card_msr_replacements_365d
    is below free_replacements_per_12_months; a reissue of a card nearing expiry is free when expiry_reissue_free
    is true. Expedited shipping costs expedited_replacement_fee_usd in addition, and the free allowance never covers
    it. Both fees point to the service order through related_txn_id. A card-to-bank transfer costs card_to_bank_transfer_fee_usd
    unless its position in its pay period (card_msr_pay_period_card_to_bank) is within free_card_to_bank_transfers_per_pay_period.
    The account is inactive when card_msr_last_activity_date is inactivity_period_days or more calendar days before
    today. An inactivity fee is assessed only once inactivity_period_days calendar days have passed since the account's
    last activity date. Calendar days are counted from the day after the last activity date, so the first inactivity
    fee posts on the last activity date plus the inactivity period, and later ones on the same day of each following
    calendar month, or on that month's last day when it has no such day. An account incurs at most one inactivity
    fee on a posted date. The inactivity fee is inactivity_fee_usd, carries fee_type inactivity, is reduced to the
    balance when the balance is smaller, is not assessed on a zero balance, and stops as soon as any load posts
    or the cardholder initiates any debit. monthly_maintenance_fee_usd, written_history_fee_usd and closure_payout_check_fee_usd
    are charged as listed and, where zero, never assessed. A fee that comes to zero is not assessed and no fee takes
    the balance below zero.
  eligibility:
  - id: inactivity_wait
    applies_to:
    - card_inactivity_fee
    kind: time
    condition: An inactivity fee is assessed only once inactivity_period_days calendar days have passed since the
      account's last activity date.
    evidence_fields:
    - card_transactions.posted_date
    - card_transactions.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.card_account_id
      action_bindings:
        card_transactions.card_account_id: card_account_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the account's last activity date
      anchor_source: card_transactions.posted_date
      relation: not_before
      duration_source: variants.inactivity_period_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the last activity date, so the first inactivity
        fee posts on the last activity date plus the inactivity period, and later ones on the same day of each following
        calendar month, or on that month's last day when it has no such day.
      boundary: inclusive
  - id: one_fee_per_order
    applies_to:
    - card_fee
    kind: dedup
    condition: A service order incurs at most one fee of each fee type.
    evidence_fields:
    - card_transactions.related_txn_id
    - card_transactions.fee_type
    - card_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.related_txn_id
