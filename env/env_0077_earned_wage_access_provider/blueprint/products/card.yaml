- id: card_unauthorized_liability
  subject:
  - card_provisional_credit
  - card_final_credit
  rule: >-
    For an unauthorized-transaction dispute the cardholder's liability is the part of the unauthorized amount that
    is not credited. When visa_zero_liability_applies is true and the transaction was a purchase processed over
    the Visa network, liability is zero; this Visa policy overrides the Regulation E amounts below and does not
    cover ATM or teller cash withdrawals. Otherwise liability is the lesser of the unauthorized amount and liability_cap_timely_usd
    when the cardholder reported the loss or theft within timely_loss_report_business_days business days after loss_learned_date,
    and the lesser of the unauthorized amount and liability_cap_late_usd when reported later; unauthorized transfers
    that posted more than error_notice_window_days calendar days after the history access date and before the report
    may be the cardholder's in full. Liability is counted once across all unauthorized transactions from the same
    loss or theft, applied in posting order. The two caps apply only when the card itself was lost or stolen; when
    it was not, such as unauthorized use while the card is still in hand, liability is zero except for transfers
    that posted after that late-notice window and before the report.
  eligibility: []
  formula:
    zero_liability: visa_zero_liability_applies and debit_type == 'purchase'
- id: card_evt_loads
  subject:
  - card_load
  - card_first_deposit_record
  rule: >-
    Loads post as their originators send them: employer payroll and off-cycle loads funded through the employer's
    Payroll Card Program, early wage transfers from the cardholder's Paystride Access plan, instant pay disbursements
    from an employer's Instant Pay service, and withdrawals from the cardholder's own Paystride Save account; each
    load carries its originating record in source_ref_id and the originator's name in merchant_name. A load posts
    only to an account whose status is issued, active or blocked. An originating record posts as a load to a given
    account once. A blocked card stops spending, never wages. A load to a closed account, or one that would take
    the balance above max_card_balance_usd, is returned to its originator in full and never posts. Receiving an
    early wage transfer costs ewa_load_fee_usd and receiving an instant pay disbursement costs instant_pay_load_fee_usd;
    where zero no fee is assessed. The first load ever posted to the account sets first_deposit_date to its posted
    date, which starts the new-account period; later loads never change it.
  eligibility:
  - id: load_status
    applies_to:
    - card_load
    kind: state
    condition: A load posts only to an account whose status is issued, active or blocked.
    evidence_fields:
    - card_accounts.status
    - card_accounts.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.card_account_id
      action_bindings:
        card_accounts.card_account_id: card_account_id
    state_contract:
      field: card_accounts.status
      allowed:
      - issued
      - active
      - blocked
  - id: one_load_per_origin
    applies_to:
    - card_load
    kind: dedup
    condition: An originating record posts as a load to a given account once.
    evidence_fields:
    - card_transactions.source_ref_id
    - card_transactions.card_account_id
    - card_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.card_account_id
        - card_transactions.source_ref_id
      action_bindings:
        card_transactions.card_account_id: card_account_id
        card_transactions.source_ref_id: source_ref_id
    dedup_contract:
      table: card_transactions
      mode: separate_record
      object_bindings:
        card_account_id: card_account_id
        source_ref_id: source_ref_id
      duplicate_filters:
        event_type:
        - card_load
      distinct_fields: []
  params:
    per_tier:
      Paystride Visa Payroll Card Essential:
        max_card_balance_usd: =max_card_balance_usd
      Paystride Visa Payroll Card Standard:
        max_card_balance_usd: =max_card_balance_usd
      Paystride Visa Payroll Card Select:
        max_card_balance_usd: =max_card_balance_usd
      Paystride Visa Payroll Card Advantage:
        max_card_balance_usd: =max_card_balance_usd
      Paystride Visa Payroll Card Premier:
        max_card_balance_usd: =max_card_balance_usd
      Paystride Visa Payroll Card Elite:
        max_card_balance_usd: =max_card_balance_usd
- id: card_evt_debits
  subject:
  - card_debit
  rule: >-
    A debit posts only while the account status is active. Debits post only up to the available balance: the account
    has no overdraft, credit feature or negative balance, and a debit larger than the balance is declined and never
    posts. Purchases are limited per posted date by daily_purchase_limit_usd (card_msr_day_purchase_total), ATM
    withdrawals by daily_atm_withdrawal_limit_usd and atm_withdrawals_per_day_max (card_msr_day_atm_total), and
    card-to-bank transfers by daily_card_to_bank_limit_usd (card_msr_day_card_to_bank_total) and a minimum of card_to_bank_min_usd.
    An out-of-network withdrawal's amount includes the ATM owner's surcharge, recorded in atm_surcharge_usd. An
    early wage access recovery debit posts only under the cardholder's standing authorization recorded on their
    Access plan, for no more than the available balance, and carries the Access recovery in source_ref_id. An employer_load_reversal
    debit takes back an erroneous employer payroll load or a recalled instant pay disbursement only as the employer's
    program approves it, for no more than the available balance, and carries the employer's request in source_ref_id;
    it is never initiated by the cardholder and is not activity. A save_transfer debit moves money to the cardholder's
    own Paystride Save account by round-up, auto-save or manual transfer; it is cardholder-initiated.
  eligibility:
  - id: debit_status
    applies_to:
    - card_debit
    kind: state
    condition: A debit posts only while the account status is active.
    evidence_fields:
    - card_accounts.status
