- id: card_evt_fee_refunds
  subject:
  - card_fee_refund
  - card_fee_correction
  - card_surcharge_rebate
  rule: >-
    A fee is returned in one of two ways. At the cardholder's request, a fee assessed in error — not due under the
    plan's schedule on its posted date, or assessed twice — is refunded in full with reason fee_charged_in_error,
    and a correctly assessed fee may be refunded as a courtesy only while card_msr_courtesy_refunds_365d is below
    courtesy_fee_refunds_per_12_months. A fee refund at the cardholder's request is granted only when the request
    is made within fee_refund_request_window_days calendar days of the fee's posted date. Calendar days are counted
    from the day after the fee's posted_date, so the last day to ask is the posted_date plus the window. Without
    any request, Paystride books a fee correction, with reason fee_charged_in_error, for a fee it finds it assessed
    in error itself, and, with reason dispute_error, for each fee caused by a transaction that a resolved dispute
    found to be an error; the request window does not limit corrections. A fee is returned at most once, whether
    by refund or by correction. A refund or correction always returns the whole fee, points to it through related_txn_id
    and carries its fee_type. On plans with surcharge rebates, the ATM owner surcharge on a domestic out-of-network
    withdrawal is rebated automatically, up to atm_surcharge_rebate_max_usd, for the first atm_surcharge_rebates_per_month
    withdrawals in a calendar month that carried a surcharge (card_msr_month_surcharge_rebates), pointing to the
    withdrawal with reason atm_surcharge_rebate. A withdrawal's surcharge is rebated at most once.
