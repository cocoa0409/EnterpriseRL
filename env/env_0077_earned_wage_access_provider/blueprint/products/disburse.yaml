- id: disburse_evt_fee_credits
  subject:
  - disburse_fee_credit
  rule: >-
    The per-disbursement fee of an instant external payout whose delivery_minutes exceed instant_external_delivery_sla_minutes
    is credited with reason late_delivery when late_delivery_fee_credit is true, without a request. A fee debited
    in error is credited in full with reason fee_charged_in_error. A correct fee may be credited as a courtesy only
    while disburse_msr_courtesy_credits_365d is below courtesy_fee_credits_per_12_months. A fee is credited only
    when the credit is raised within fee_credit_request_window_days calendar days of the fee's entry date. Calendar
    days are counted from the day after the fee's entry_date, so the last day to ask is the entry_date plus the
    window. Late-delivery credits are raised on delivery and fall inside that window; a fee not questioned within
    it is deemed accepted and is not credited for any reason. A fee is credited at most once. A credit always returns
    the whole fee and points to it.
  eligibility:
  - id: credit_window
    applies_to:
    - disburse_fee_credit
    kind: time
    condition: A fee is credited only when the credit is raised within fee_credit_request_window_days calendar days
      of the fee's entry date.
    evidence_fields:
    - disburse_ledger.entry_date
    - disburse_ledger.disburse_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_ledger.disburse_entry_id
      action_bindings:
        disburse_ledger.disburse_entry_id: related_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the fee's entry date
      anchor_source: disburse_ledger.entry_date
      relation: not_after
      duration_source: variants.fee_credit_request_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the fee's entry_date, so the last day to ask is
        the entry_date plus the window.
      boundary: inclusive
  - id: one_credit
    applies_to:
    - disburse_fee_credit
    kind: dedup
    condition: A fee is credited at most once.
    evidence_fields:
    - disburse_ledger.related_entry_id
    - disburse_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_ledger.related_entry_id
      action_bindings:
        disburse_ledger.related_entry_id: related_entry_id
    dedup_contract:
      table: disburse_ledger
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - disburse_fee_credit
      distinct_fields: []
  params:
    per_tier:
      Paystride Instant Pay Starter:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Instant Pay Core:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Instant Pay Growth:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Instant Pay Pro:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Instant Pay Scale:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Instant Pay Enterprise:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
  measures:
  - disburse_msr_courtesy_credits_365d
- id: disburse_volume_review
  subject:
  - disburse_tier_change
  rule: >-
    The tier follows the employer's sustained volume, not its request. A volume review moves only a service whose
    status is active. When the payout counts of volume_review_consecutive_months consecutive complete months (disburse_msr_monthly_counts)
    all fall in another tier's entry_gate band, the service moves to the tier whose band contains the latest month's
    count on the first day of the following month, up or down; a single unusual month moves nothing. Fees already
    debited are never re-rated.
  eligibility:
  - id: review_active
    applies_to:
    - disburse_tier_change
    kind: state
    condition: A volume review moves only a service whose status is active.
    evidence_fields:
    - disburse_services.status
    - disburse_services.disburse_service_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_services.disburse_service_id
      action_bindings:
        disburse_services.disburse_service_id: disburse_service_id
    state_contract:
      field: disburse_services.status
      allowed:
      - active
  params:
    per_tier:
      Paystride Instant Pay Starter:
        volume_review_consecutive_months: =volume_review_consecutive_months
      Paystride Instant Pay Core:
        volume_review_consecutive_months: =volume_review_consecutive_months
      Paystride Instant Pay Growth:
        volume_review_consecutive_months: =volume_review_consecutive_months
      Paystride Instant Pay Pro:
        volume_review_consecutive_months: =volume_review_consecutive_months
      Paystride Instant Pay Scale:
        volume_review_consecutive_months: =volume_review_consecutive_months
      Paystride Instant Pay Enterprise:
        volume_review_consecutive_months: =volume_review_consecutive_months
  measures:
  - disburse_msr_monthly_counts
- id: disburse_lifecycle
  subject:
  - disburse_activate
  - disburse_suspend
  - disburse_reinstate
  - disburse_close
  - disburse_settings_update
  rule: >-
    The service activates when business verification completes and the first deposit is available. The desk suspends
    only a service whose status is active. The desk suspends an active service when returned deposits reach the
    limit under disburse_evt_prefund, and reinstates it once every returned deposit and its fee are made good by
    cleared funds. Closing the service is the employer's own decision: the desk registers a closure request, the
    employer confirms it, payouts stop, and the remaining balance is returned under disburse_evt_prefund; an early
    closure fee applies under disburse_evt_fees. A closure or recall is accepted only from a requester whose role
    is listed in authorized_requester_roles. The employer may change its funding method, auto replenishment or alert
    level at any time while the service is not closed; auto replenishment can be turned on only on tiers with auto_replenish_allowed.
  eligibility:
  - id: suspend_from_active
    applies_to:
    - disburse_suspend
    kind: state
    condition: The desk suspends only a service whose status is active.
    evidence_fields:
    - disburse_services.status
    - disburse_services.disburse_service_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_services.disburse_service_id
      action_bindings:
        disburse_services.disburse_service_id: disburse_service_id
    state_contract:
      field: disburse_services.status
      allowed:
      - active
  - id: close_role
    applies_to:
    - disburse_close
    kind: authorization
    condition: A closure or recall is accepted only from a requester whose role is listed in authorized_requester_roles.
    evidence_fields:
    - disburse_requests.requester_role
    - disburse_requests.disburse_request_id
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - disburse_requests.disburse_request_id
      action_bindings:
        disburse_requests.disburse_request_id: disburse_request_id
  params:
    per_tier:
      Paystride Instant Pay Starter:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
      Paystride Instant Pay Core:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
      Paystride Instant Pay Growth:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
      Paystride Instant Pay Pro:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
      Paystride Instant Pay Scale:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
      Paystride Instant Pay Enterprise:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
