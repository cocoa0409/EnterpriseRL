category: loan
display_name: Paystride Payroll-Repaid Loan
binding:
  holding_table: loan_accounts
  event_tables:
  - loan_ledger
  intake_tables:
  - loan_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    loan_balance: loan_balance
lifecycle:
  states:
  - applied
  - approved
  - declined
  - repaying
  - paid_off
  - charged_off
  - withdrawn
  transitions:
  - from: applied
    to: approved
    by: system
    means: underwriting approves and issues an offer
  - from: applied
    to: declined
    by: system
    means: underwriting declines
  - from: approved
    to: repaying
    by: user
    means: the borrower signs the agreement and deduction authorization
  - from: approved
    to: withdrawn
    by: system
    means: the offer lapses or the borrower's decline is recorded
  - from: repaying
    to: paid_off
    by: system
    means: the balance reaches zero
  - from: repaying
    to: charged_off
    by: system
    means: the loan is charged off
accounts:
- key: loan_balance
  unit: USD
  meaning: 'Amount the borrower owes on the loan: disbursed principal plus accrued interest less payments and charge-offs.'
parameter_schema:
  min_principal_usd: Smallest principal in the tier (USD).
  max_principal_usd: Largest principal in the tier (USD).
  apr_percent: Fixed annual percentage rate disclosed at origination (number, percent).
  term_months_allowed: Loan terms offered (list of months).
  origination_fee_usd: Origination fee deducted from the amount disbursed (USD).
  max_principal_percent_of_annual_pay: Principal ceiling as percent of the worker's annualized gross pay (number,
    percent).
  max_installment_percent_of_net_pay: Ceiling on one installment as percent of the worker's average net pay per
    period (number, percent).
  min_tenure_days: Days of employment with the sponsoring employer required to apply (days).
  min_employer_program_months_live: Months the employer's Earned Wage Access program must have been live (months).
  interest_method: How interest accrues (text).
  interest_day_count_days: Days in the year for the daily rate (days).
  installment_frequency: Installments follow the worker's pay frequency (text).
  first_installment_min_days: Calendar days after funding before the first installment may fall (days).
  prepayment_penalty_usd: Penalty for paying early (USD).
  late_fee_usd: Late fee on a missed installment (USD).
  returned_payment_fee_usd: Fee on a returned direct ACH payment (USD).
  missed_deduction_retry_paydays: Later paydays a missed installment is added to (count).
  direct_pay_conversion_on_separation: Whether the loan converts to monthly direct ACH payments when employment
    ends (boolean).
  direct_pay_due_day_of_month: Day of the month direct payments fall due after conversion (day).
  chargeoff_days_past_due: Days past due at which an unpaid loan is charged off (days).
  credit_reporting: Whether payment history is reported to the consumer credit bureaus (boolean).
  credit_report_delinquency_days: Days past due before a late payment is reported (days).
  offer_valid_days: Calendar days an approved offer stays open for acceptance (days).
  right_to_cancel_business_days: Business days after funding within which the borrower may cancel by returning the
    principal without interest or fee (count).
  funding_business_days: Business days after acceptance within which the loan is funded (count).
  funding_destinations: Where proceeds may be sent (list).
  max_open_loans: Loans in repayment allowed at once (count).
  reapply_after_decline_days: Calendar days after a decline before reapplying (days).
  reapply_after_payoff_days: Calendar days after payoff before a new loan may be applied for (days).
  refinance_allowed: Whether an open loan may be refinanced into a new one (boolean).
  hardship_deferral_max_installments: Installments that may be deferred on a documented hardship (count).
  hardship_deferral_per_loan_max: Hardship deferrals allowed over the life of a loan (count).
  hardship_interest_waived: Whether interest stops accruing during a hardship deferral (boolean).
  autopay_rate_discount_percent: APR reduction when repaying by payroll deduction (number, percentage points).
  ewa_outstanding_max_usd: Earned wage access balance above which an application is not approved (USD).
  ewa_writeoff_lookback_days: Calendar days before application within which an Earned Wage Access write-off declines
    the application (days).
  min_paycheck_count: Paychecks from the employer required before applying (count).
  statement_frequency: How often statements are issued (text).
  payoff_quote_valid_days: Calendar days a payoff quote stays valid (days).
  overpayment_refund_business_days: Business days to refund a final overpayment (count).
  scra_rate_cap_percent: Interest rate cap for borrowers on active military duty under the Servicemembers Civil
    Relief Act for obligations incurred before service (number, percent).
  mla_apr_cap_percent: Military Annual Percentage Rate cap for covered borrowers under the Military Lending Act
    (number, percent).
  min_age_years: Minimum borrower age (years).
  adverse_action_notice_days: Calendar days after a decline within which the adverse action notice is sent (days).
  employer_participation_required: Whether the employer must have opted in to the loan benefit (boolean).
  payroll_deduction_authorization_required: Whether a revocable payroll deduction authorization must be signed (boolean).
  deduction_revocation_converts_to_direct_pay: Whether revoking the payroll deduction authorization converts repayment
    to direct ACH (boolean).
  rounding_rule: How installment and interest amounts are rounded (text).
