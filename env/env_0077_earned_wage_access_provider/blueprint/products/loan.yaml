events:
- type: loan_apply
  target: loan_accounts
  mutation: create
  meaning: A worker applies for a Paystride Payroll-Repaid Loan through their employer's benefit.
  grain: one row per loan change
  fields:
    customer_id: the borrower (foreign key -> customers)
    agreement_id: the employer's Earned Wage Access Program Agreement sponsoring the loan benefit (foreign key ->
      program_agreements)
    variant_name: the loan tier, as the official full name
    status: lifecycle state of the loan (see the loan charter lifecycle)
    applied_date: date the application was submitted
    principal_amount: principal approved
    apr_percent: APR fixed at origination
    term_months: term chosen
    installment_amount: scheduled installment per payday
    next_installment_date: payday of the next scheduled installment; empty when none
    repayment_method: how installments are collected
    loan_balance: 'amount owed: principal disbursed and accrued interest less payments and charge-offs'
  triggers: []
- type: loan_approve
  target: loan_accounts
  mutation:
    transition:
      from: applied
      to: approved
  meaning: Underwriting approves the application and an offer with its disclosures is issued.
  grain: one row per loan change
  fields:
    principal_amount: principal approved
    apr_percent: APR fixed at origination
    term_months: term chosen
    installment_amount: scheduled installment per payday
  triggers: []
- type: loan_decline
  target: loan_accounts
  mutation:
    transition:
      from: applied
      to: declined
  meaning: Underwriting declines the application.
  grain: one row per loan change
  fields:
    closed_date: date the loan was paid off, charged off, declined or withdrawn; empty while open
  triggers: []
- type: loan_accept
  target: loan_accounts
  mutation:
    transition:
      from: approved
      to: repaying
  meaning: The borrower signs the loan agreement and payroll deduction authorization.
  grain: one row per loan change
  fields:
    funded_date: date proceeds were disbursed; empty until funded
    next_installment_date: payday of the next scheduled installment; empty when none
  triggers: []
- type: loan_offer_expire
  target: loan_accounts
  mutation:
    transition:
      from: approved
      to: withdrawn
  meaning: The offer lapses unaccepted or the borrower declines it.
  grain: one row per loan change
  fields:
    closed_date: date the loan was paid off, charged off, declined or withdrawn; empty while open
  triggers: []
- type: loan_pay_off
  target: loan_accounts
  mutation:
    transition:
      from: repaying
      to: paid_off
  meaning: The balance reaches zero.
  grain: one row per loan change
  fields:
    closed_date: date the loan was paid off, charged off, declined or withdrawn; empty while open
  triggers: []
- type: loan_charge_off_close
  target: loan_accounts
  mutation:
    transition:
      from: repaying
      to: charged_off
  meaning: The loan is charged off as uncollectible.
  grain: one row per loan change
  fields:
    closed_date: date the loan was paid off, charged off, declined or withdrawn; empty while open
  triggers: []
- type: loan_schedule_update
  target: loan_accounts
  mutation: update
  meaning: The next installment date or amount changes after a payday, a hardship deferral or a conversion.
  grain: one row per loan change
  fields:
    next_installment_date: payday of the next scheduled installment; empty when none
    installment_amount: scheduled installment per payday
  triggers: []
- type: loan_repayment_method_change
  target: loan_accounts
  mutation: update
  meaning: Repayment converts between payroll deduction and direct ACH.
  grain: one row per loan change
  fields:
    repayment_method: how installments are collected
  triggers: []
- type: loan_disbursement
  target: loan_ledger
  meaning: Loan proceeds disbursed to the borrower, net of any origination fee.
  grain: one row per loan funded
  distinguish_by:
  - entry_date
  fields:
    entry_date: date the entry was booked
    amount: size of the movement, always greater than zero; disbursements, interest and payment returns add and
      payments and charge-offs subtract
  account: loan_balance
  direction: in
  triggers: []
- type: loan_interest_accrual
  target: loan_ledger
  meaning: Interest accrued for one month.
  grain: one row per loan and month
  distinguish_by:
  - interest_month
  fields:
    entry_date: date the entry was booked
    amount: size of the movement, always greater than zero; disbursements, interest and payment returns add and
      payments and charge-offs subtract
    interest_month: month an interest accrual covers; empty otherwise
  account: loan_balance
  direction: in
  triggers: []
- type: loan_payment
  target: loan_ledger
  meaning: A payment received, by payroll deduction, direct ACH or voluntary payment.
  grain: one row per payment
  distinguish_by:
  - entry_date
  - installment_number
  - payment_method
  fields:
    entry_date: date the entry was booked
    amount: size of the movement, always greater than zero; disbursements, interest and payment returns add and
      payments and charge-offs subtract
    installment_number: installment a payment or return relates to; 0 on other entries
    payment_method: how a payment was made; none otherwise
  account: loan_balance
  direction: out
  triggers: []
- type: loan_payment_return
  target: loan_ledger
  meaning: A direct ACH payment returned unpaid.
  grain: one row per returned payment
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked
    amount: size of the movement, always greater than zero; disbursements, interest and payment returns add and
      payments and charge-offs subtract
    installment_number: installment a payment or return relates to; 0 on other entries
    payment_method: how a payment was made; none otherwise
    related_entry_id: for a payment return the payment returned; empty otherwise
  account: loan_balance
  direction: in
  triggers: []
- type: loan_chargeoff
  target: loan_ledger
  meaning: The remaining balance charged off.
  grain: one row per loan charged off
  distinguish_by:
  - entry_date
  fields:
    entry_date: date the entry was booked
    amount: size of the movement, always greater than zero; disbursements, interest and payment returns add and
      payments and charge-offs subtract
  account: loan_balance
  direction: out
  triggers: []
measures:
- id: loan_msr_days_past_due
  window: the loan at today
  measure: calendar days since the earliest scheduled installment not fully paid
- id: loan_msr_access_outstanding
  window: the borrower's Earned Wage Access plans at application
  measure: sum of outstanding_balance across the borrower's access plans
- id: loan_msr_access_writeoff_recent
  window: the ewa_writeoff_lookback_days calendar days before the application date
  measure: count of access_writeoff entries on the borrower's plans
- id: loan_msr_deferrals_used
  window: the life of the loan
  measure: count of approved hardship_deferral loan requests
policies:
- id: loan_agg_multi_holding
  subject:
  - loan_apply
  rule: >-
    A worker holds at most max_per_customer open loan; paid-off, charged-off, declined and withdrawn loans do not
    count. A worker may not hold a second loan in status applied, approved or repaying. An application is taken
    only through an employer whose Earned Wage Access program has been live at least min_employer_program_months_live
    months and that opted in when employer_participation_required is true; a worker declined within reapply_after_decline_days
    calendar days cannot reapply.
  eligibility:
  - id: one_open
    applies_to:
    - loan_apply
    kind: dedup
    condition: A worker may not hold a second loan in status applied, approved or repaying.
    evidence_fields:
    - loan_accounts.customer_id
    - loan_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loan_accounts.customer_id
      action_bindings:
        loan_accounts.customer_id: customer_id
    dedup_contract:
      table: loan_accounts
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - applied
        - approved
        - repaying
      distinct_fields:
      - applied_date
  params:
    max_per_customer: 1
- id: loan_evt_underwriting
  subject:
  - loan_approve
  - loan_decline
  rule: >-
    Underwriting approves an application only when the worker meets the tier's entry gate of tenure and paychecks,
    is at least min_age_years old, the principal lies between min_principal_usd and max_principal_usd and within
    max_principal_percent_of_annual_pay of annualized gross pay, the term is in term_months_allowed, and the installment
    computed at apr_percent fits within max_installment_percent_of_net_pay of average net pay; the tier is the one
    whose principal band contains the amount. A decline is followed by an adverse action notice within adverse_action_notice_days
    calendar days. An approved offer carries the Truth in Lending disclosures and stays open offer_valid_days calendar
    days.
  eligibility: []
  params:
    per_tier:
      Paystride Payroll Loan 500:
        apr_percent: =apr_percent
        max_principal_usd: =max_principal_usd
      Paystride Payroll Loan 1000:
        apr_percent: =apr_percent
        max_principal_usd: =max_principal_usd
      Paystride Payroll Loan 2000:
        apr_percent: =apr_percent
        max_principal_usd: =max_principal_usd
      Paystride Payroll Loan 3000:
        apr_percent: =apr_percent
        max_principal_usd: =max_principal_usd
      Paystride Payroll Loan 4000:
        apr_percent: =apr_percent
        max_principal_usd: =max_principal_usd
      Paystride Payroll Loan 5000:
        apr_percent: =apr_percent
        max_principal_usd: =max_principal_usd
- id: loan_access_interplay
  subject:
  - loan_approve
  - loan_decline
  rule: >-
    Holding a Paystride Earned Wage Access Plan changes loan eligibility: an application is declined when the worker's
    access outstanding balance (loan_msr_access_outstanding) exceeds ewa_outstanding_max_usd or an access write-off
    was booked within ewa_writeoff_lookback_days calendar days (loan_msr_access_writeoff_recent). While a loan is
    in repayment, the Access plan's combined deduction ceiling counts its installments, under the Access charter.
  eligibility: []
  measures:
  - loan_msr_access_outstanding
  - loan_msr_access_writeoff_recent
- id: loan_military_rate_caps
  subject:
  - loan_approve
  rule: >-
    For a borrower who is a covered member of the armed forces or a dependent, the Military Lending Act caps the
    Military Annual Percentage Rate at mla_apr_cap_percent; every tier's apr_percent is below that cap. For a borrower
    who enters active military service after the loan was made, interest above scra_rate_cap_percent is forgiven
    for the period of service on written request under the Servicemembers Civil Relief Act; the capped rate overrides
    apr_percent and no other rate is applied.
  eligibility: []
  formula:
    effective_apr: min(apr_percent, scra_rate_cap_percent)
- id: loan_evt_acceptance_funding
  subject:
  - loan_accept
  - loan_disbursement
  rule: >-
    Accepting the offer is the borrower's own act: signing the loan agreement and, where payroll_deduction_authorization_required
    is true, a revocable payroll deduction authorization. An offer is accepted only while the loan status is approved.
    Proceeds of the principal less origination_fee_usd are sent within funding_business_days business days to one
    of the funding_destinations, and the first installment falls on the first payday at least first_installment_min_days
    calendar days after funding. The borrower may cancel within right_to_cancel_business_days business days of funding
    by returning the proceeds, owing no interest or fee.
  eligibility:
  - id: accept_from_approved
    applies_to:
    - loan_accept
    kind: state
    condition: An offer is accepted only while the loan status is approved.
    evidence_fields:
    - loan_accounts.status
    - loan_accounts.loan_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loan_accounts.loan_account_id
      action_bindings:
        loan_accounts.loan_account_id: loan_account_id
    state_contract:
      field: loan_accounts.status
      allowed:
      - approved
  params:
    per_tier:
      Paystride Payroll Loan 500:
        origination_fee_usd: =origination_fee_usd
      Paystride Payroll Loan 1000:
        origination_fee_usd: =origination_fee_usd
      Paystride Payroll Loan 2000:
        origination_fee_usd: =origination_fee_usd
      Paystride Payroll Loan 3000:
        origination_fee_usd: =origination_fee_usd
      Paystride Payroll Loan 4000:
        origination_fee_usd: =origination_fee_usd
      Paystride Payroll Loan 5000:
        origination_fee_usd: =origination_fee_usd
- id: loan_evt_interest
  subject:
  - loan_interest_accrual
  rule: >-
    Interest is simple interest on the unpaid principal at apr_percent, accrued daily over interest_day_count_days
    and booked monthly. A loan accrues one interest entry per month. No late fee, returned payment fee or prepayment
    penalty is ever charged; interest keeps accruing during a hardship deferral unless hardship_interest_waived
    is true.
  eligibility:
  - id: one_accrual
    applies_to:
    - loan_interest_accrual
    kind: dedup
    condition: A loan accrues one interest entry per month.
    evidence_fields:
    - loan_ledger.interest_month
    - loan_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loan_ledger.interest_month
      action_bindings:
        loan_ledger.interest_month: interest_month
    dedup_contract:
      table: loan_ledger
      mode: separate_record
      object_bindings:
        loan_account_id: loan_account_id
        interest_month: interest_month
      duplicate_filters:
        event_type:
        - loan_interest_accrual
      distinct_fields: []
- id: loan_evt_payments
  subject:
  - loan_payment
  - loan_payment_return
  - loan_schedule_update
  rule: >-
    Installments are deducted from the borrower's pay each payday under the deduction authorization. A missed installment
    is added to the next missed_deduction_retry_paydays payday; voluntary payments may be made at any time and reduce
    the balance without penalty. When employment ends and direct_pay_conversion_on_separation is true, or the borrower
    revokes the deduction authorization, repayment converts to monthly direct ACH due on direct_pay_due_day_of_month.
    A documented hardship may defer up to hardship_deferral_max_installments installments, at most hardship_deferral_per_loan_max
    times per loan (loan_msr_deferrals_used). A returned direct payment is reversed by a payment return and reported
    only once the loan is credit_report_delinquency_days past due.
  eligibility: []
  params:
    per_tier:
      Paystride Payroll Loan 500:
        hardship_deferral_max_installments: =hardship_deferral_max_installments
      Paystride Payroll Loan 1000:
        hardship_deferral_max_installments: =hardship_deferral_max_installments
      Paystride Payroll Loan 2000:
        hardship_deferral_max_installments: =hardship_deferral_max_installments
      Paystride Payroll Loan 3000:
        hardship_deferral_max_installments: =hardship_deferral_max_installments
      Paystride Payroll Loan 4000:
        hardship_deferral_max_installments: =hardship_deferral_max_installments
      Paystride Payroll Loan 5000:
        hardship_deferral_max_installments: =hardship_deferral_max_installments
  measures:
  - loan_msr_deferrals_used
- id: loan_lifecycle
  subject:
  - loan_offer_expire
  - loan_pay_off
  - loan_charge_off_close
  - loan_chargeoff
  - loan_repayment_method_change
  rule: >-
    An offer not accepted within offer_valid_days lapses. A loan whose balance reaches zero is paid off, and a final
    overpayment is refunded within overpayment_refund_business_days business days. A loan reaching chargeoff_days_past_due
    days past due (loan_msr_days_past_due) is charged off for its whole remaining balance and reported to the credit
    bureaus when credit_reporting is true. A change of repayment method follows loan_evt_payments.
  eligibility: []
  params:
    per_tier:
      Paystride Payroll Loan 500:
        chargeoff_days_past_due: =chargeoff_days_past_due
      Paystride Payroll Loan 1000:
        chargeoff_days_past_due: =chargeoff_days_past_due
      Paystride Payroll Loan 2000:
        chargeoff_days_past_due: =chargeoff_days_past_due
      Paystride Payroll Loan 3000:
        chargeoff_days_past_due: =chargeoff_days_past_due
      Paystride Payroll Loan 4000:
        chargeoff_days_past_due: =chargeoff_days_past_due
      Paystride Payroll Loan 5000:
        chargeoff_days_past_due: =chargeoff_days_past_due
  measures:
  - loan_msr_days_past_due
