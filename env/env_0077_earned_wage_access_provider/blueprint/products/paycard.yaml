category: paycard
display_name: Paystride Payroll Card Program
binding:
  holding_table: paycard_programs
  event_tables:
  - paycard_funding
  - paycard_kit_orders
  intake_tables:
  - paycard_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    funding_balance: funding_balance
lifecycle:
  states:
  - contracted
  - live
  - suspended
  - terminated
  transitions:
  - from: contracted
    to: live
    by: system
    means: the first payroll batch posts to cards
  - from: live
    to: suspended
    by: agent
    means: the desk suspends for returned funding or a negative balance
  - from: suspended
    to: live
    by: agent
    means: the desk reinstates once funding is cured
  - from: live
    to: terminated
    by: user
    means: the employer's termination takes effect at the end of its notice period
accounts:
- key: funding_balance
  unit: USD
  meaning: Money in the employer's program funding account available to load payroll and pay program fees.
parameter_schema:
  monthly_program_fee_usd: Flat monthly program fee (USD per month).
  active_card_monthly_fee_usd: Monthly fee for each active card, a card with at least one payroll load posted in
    the month (USD).
  worker_card_plan: Card plan the employer's workers receive under this package (official card plan name).
  card_kit_fee_usd: Fee per instant-issue card kit ordered (USD).
  card_kit_min_order: Smallest kit order (kits).
  kit_order_multiple: Kit orders are placed in multiples of this number (kits).
  max_kit_inventory: Most unissued kits the employer may hold across its locations, counting the order (kits).
  free_kits_at_launch: Kits supplied without kit fee with the launch order (kits).
  ewa_bundle_free_kits_per_month: Kits per calendar month supplied without kit fee while the employer's Earned Wage
    Access program is live (kits).
  kit_shipping_fee_usd: Standard shipping fee per kit order (USD).
  expedited_kit_shipping_fee_usd: Expedited shipping fee per kit order, instead of standard shipping (USD).
  kit_order_processing_business_days: Business days to ship a standard kit order (count).
  expedited_kit_delivery_business_days: Business days for expedited kit delivery (count).
  kit_ship_locations_max: Employer locations kits may be shipped to (count).
  funding_deadline_business_days_before_pay_date: Business days before the pay date by which a payroll batch must
    be funded (count; 0 means the pay date itself).
  funding_cutoff_time_et: Eastern Time on the deadline day by which funds and the load file must arrive (HH:MM).
  funding_methods_allowed: Methods the employer may fund with (list of funding_method values).
  ach_debit_funding_lead_business_days: Business days before the pay date on which Paystride initiates an authorized
    ACH debit for a batch (count).
  late_funding_fee_usd: Fee when a batch is funded after its deadline (USD).
  returned_funding_fee_usd: Fee when a funding payment is returned unpaid (USD).
  returned_funding_suspend_count_90d: Returned funding payments within 90 calendar days that suspend the program
    (count).
  prefund_reserve_percent: Reserve the funding balance must keep after each regular batch, as percent of the average
    regular batch (number, percent).
  reserve_average_batches: Regular batches averaged for the reserve (count).
  reserve_shortfall_cure_business_days: Business days to restore the reserve after it falls short (count).
  negative_balance_suspend_business_days: Business days the funding balance may stay negative before the program
    is suspended (count).
  reinstatement_fee_usd: Fee to reinstate a suspended program (USD).
  off_cycle_load_fee_usd: Fee per off-cycle batch beyond the free allowance (USD).
  off_cycle_batches_free_per_month: Off-cycle batches per calendar month without fee (count).
  load_file_correction_fee_usd: Fee for correcting a load file after it was accepted (USD).
  max_load_per_card_usd: Largest single payroll load to one card (USD).
  returned_load_credit_business_days: Business days after a load is refused by a card account within which it is
    credited back to the funding balance (count).
  load_reversal_request_window_business_days: Business days after a load posted within which the employer may request
    its reversal as erroneous (count).
  load_reversal_reasons_allowed: Reasons for which an erroneous load may be reversed (list).
  load_reversal_fee_usd: Fee per load reversal request (USD).
  load_reversal_fee_on_failure: Whether the reversal fee is charged when nothing could be recovered (boolean).
  opt_in_consent_required: Whether each worker's written, voluntary consent must be on file before their card is
    loaded (boolean).
  alternative_pay_method_required: Whether the employer must offer each worker direct deposit or a check instead
    of the card (boolean).
  monthly_fee_debit_business_day: Business day of the following month on which monthly fees are debited from the
    funding balance (ordinal).
  courtesy_fee_credits_per_12_months: Goodwill fee credits allowed in any rolling 365 days (count).
  fee_credit_request_window_days: Calendar days after a fee debit within which the employer may ask for a credit
    (days).
  minimum_term_months: Minimum initial term (months).
  termination_notice_days: Calendar days of written notice to terminate (days).
  early_termination_fee_usd: Flat fee when the program terminates before the end of its minimum term (USD).
  package_change_max_per_12_months: Package changes allowed in any rolling 365 days (count).
  launch_target_business_days: Business days after signing within which Paystride commits to deliver launch kits
    and accept the first load file (count).
  employer_portal_seats: Employer administrator seats included (count).
  authorized_requester_roles: Employer portal roles allowed to request load reversals, package changes and termination
    (list).
  load_posting_time_et: Eastern Time on the pay date by which a funded regular batch posts to cards (HH:MM).
  ewa_card_destination_promotion: Whether workers paid on the card are offered fee-free early wage transfers to
    it when the employer also runs Earned Wage Access (boolean).
