events:
- type: paycard_contract
  target: paycard_programs
  mutation: create
  meaning: An employer signs a Payroll Card Program agreement; it opens in contracted status.
  grain: one row per program change
  fields:
    customer_id: the employer holding the program (foreign key -> customers)
    variant_name: the package held, as the official full package name
    status: lifecycle state of the program (see the paycard charter lifecycle)
    signed_date: date the program agreement was signed
    funding_method: how the employer funds payroll batches
    card_kit_inventory: unissued instant-issue card kits held at the employer's locations
    termination_notice_date: date written termination notice was received; empty when none
    funding_balance: 'balance of the employer''s program funding account: funds received and credits less loads,
      returns and fees; may be negative after a returned funding payment'
  triggers: []
- type: paycard_launch
  target: paycard_programs
  mutation:
    transition:
      from: contracted
      to: live
  meaning: The first payroll batch posts to workers' cards.
  grain: one row per program change
  fields:
    launch_date: date the first payroll batch posted to cards; empty until launch
  triggers: []
- type: paycard_suspend
  target: paycard_programs
  mutation:
    transition:
      from: live
      to: suspended
  meaning: The desk suspends the program for returned funding or a funding balance left negative.
  grain: one row per program change
  fields:
    status: lifecycle state of the program (see the paycard charter lifecycle)
  triggers: []
- type: paycard_reinstate
  target: paycard_programs
  mutation:
    transition:
      from: suspended
      to: live
  meaning: The desk reinstates the program once funding is cured.
  grain: one row per program change
  fields:
    status: lifecycle state of the program (see the paycard charter lifecycle)
  triggers: []
- type: paycard_terminate
  target: paycard_programs
  mutation:
    transition:
      from: live
      to: terminated
  meaning: The program terminates at the end of the employer's notice period.
  grain: one row per program change
  fields:
    closed_date: date the program terminated; empty until terminated
  triggers: []
- type: paycard_termination_notice
  target: paycard_programs
  mutation: update
  meaning: The employer's written termination notice is recorded.
  grain: one row per program change
  fields:
    termination_notice_date: date written termination notice was received; empty when none
  triggers: []
- type: paycard_package_change
  target: paycard_programs
  mutation: update
  meaning: The program moves to another package, which also changes the workers' card plan.
  grain: one row per program change
  fields:
    variant_name: the package held, as the official full package name
  triggers: []
- type: paycard_funding_method_change
  target: paycard_programs
  mutation: update
  meaning: The employer changes how it funds batches.
  grain: one row per program change
  fields:
    funding_method: how the employer funds payroll batches
  triggers: []
- type: paycard_kit_inventory_update
  target: paycard_programs
  mutation: update
  meaning: The count of unissued kits at the employer's locations changes on a delivery or as kits are issued.
  grain: one row per program change
  fields:
    card_kit_inventory: unissued instant-issue card kits held at the employer's locations
  triggers: []
- type: paycard_funding_receipt
  target: paycard_funding
  meaning: Funds the employer sends for payroll batches.
  grain: one row per funding payment received
  distinguish_by:
  - entry_date
  - entry_time
  - funding_method
  fields:
    entry_date: date the entry was booked
    entry_time: time funds were received for a funding receipt; 00:00 on other entries
    pay_date: pay date of the batch the entry concerns; empty on entries not tied to a batch
    amount: size of the movement, always greater than zero; receipts, returned-load and reversal credits and fee
      credits add to and returns, batches and fees subtract from the funding balance
    funding_method: method of a funding receipt or return; none otherwise
  account: funding_balance
  direction: in
  triggers: []
- type: paycard_funding_return
  target: paycard_funding
  meaning: A funding payment returned unpaid by the employer's bank.
  grain: one row per returned payment
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked
    pay_date: pay date of the batch the entry concerns; empty on entries not tied to a batch
    amount: size of the movement, always greater than zero; receipts, returned-load and reversal credits and fee
      credits add to and returns, batches and fees subtract from the funding balance
    funding_method: method of a funding receipt or return; none otherwise
    related_entry_id: 'the narrowest source: for a return the receipt returned, for a fee the batch, receipt, kit
      order or return that incurred it, for a fee credit the fee; empty otherwise'
  account: funding_balance
  direction: out
  triggers:
  - event: paycard:paycard_fee_debit
    map:
      fee_type: returned_funding
      related_entry_id: funding_entry_id
- type: paycard_payroll_load_batch
  target: paycard_funding
  meaning: A payroll batch loaded to workers' cards for one pay date.
  grain: one row per batch
  distinguish_by:
  - pay_date
  - batch_type
  - entry_date
  fields:
    entry_date: date the entry was booked
    pay_date: pay date of the batch the entry concerns; empty on entries not tied to a batch
    amount: size of the movement, always greater than zero; receipts, returned-load and reversal credits and fee
      credits add to and returns, batches and fees subtract from the funding balance
    card_count: cards loaded by a batch, or kits on a kit fee; 1 on other entries
    batch_type: kind of payroll batch; none on other entries
  account: funding_balance
  direction: out
  triggers: []
- type: paycard_returned_load_credit
  target: paycard_funding
  meaning: >-
    A load a card account refused (closed account or balance limit) credited back to the funding balance.
  grain: one row per refused load
  distinguish_by:
  - card_txn_id
  fields:
    entry_date: date the entry was booked
    pay_date: pay date of the batch the entry concerns; empty on entries not tied to a batch
    amount: size of the movement, always greater than zero; receipts, returned-load and reversal credits and fee
      credits add to and returns, batches and fees subtract from the funding balance
    card_txn_id: for a returned-load credit or load reversal credit, the worker card load concerned (foreign key
      -> card_transactions); empty otherwise
    related_entry_id: 'the narrowest source: for a return the receipt returned, for a fee the batch, receipt, kit
      order or return that incurred it, for a fee credit the fee; empty otherwise'
  account: funding_balance
  direction: in
  triggers: []
- type: paycard_load_reversal_credit
  target: paycard_funding
  meaning: The amount recovered from a worker's card on an approved erroneous-load reversal.
  grain: one row per reversal recovered
  distinguish_by:
  - paycard_request_id
  fields:
    entry_date: date the entry was booked
    pay_date: pay date of the batch the entry concerns; empty on entries not tied to a batch
    amount: size of the movement, always greater than zero; receipts, returned-load and reversal credits and fee
      credits add to and returns, batches and fees subtract from the funding balance
    paycard_request_id: for a load reversal credit or reversal fee, the reversal request (foreign key -> paycard_requests);
      empty otherwise
    card_txn_id: for a returned-load credit or load reversal credit, the worker card load concerned (foreign key
      -> card_transactions); empty otherwise
  account: funding_balance
  direction: in
  triggers: []
- type: paycard_fee_debit
  target: paycard_funding
  meaning: A program fee debited from the funding balance.
  grain: one row per fee
  distinguish_by:
  - fee_type
  - related_entry_id
  - billing_month
  fields:
    entry_date: date the entry was booked
    pay_date: pay date of the batch the entry concerns; empty on entries not tied to a batch
    amount: size of the movement, always greater than zero; receipts, returned-load and reversal credits and fee
      credits add to and returns, batches and fees subtract from the funding balance
    card_count: cards loaded by a batch, or kits on a kit fee; 1 on other entries
    fee_type: kind of fee debited or credited; none otherwise
    billing_month: month a monthly fee bills; empty on other entries
    related_entry_id: 'the narrowest source: for a return the receipt returned, for a fee the batch, receipt, kit
      order or return that incurred it, for a fee credit the fee; empty otherwise'
    paycard_request_id: for a load reversal credit or reversal fee, the reversal request (foreign key -> paycard_requests);
      empty otherwise
  account: funding_balance
  direction: out
  triggers: []
- type: paycard_fee_credit
  target: paycard_funding
  meaning: A credit of one program fee back to the funding balance.
  grain: one row per fee credited
  distinguish_by:
  - related_entry_id
  - credit_reason
  fields:
    entry_date: date the entry was booked
    amount: size of the movement, always greater than zero; receipts, returned-load and reversal credits and fee
      credits add to and returns, batches and fees subtract from the funding balance
    fee_type: kind of fee debited or credited; none otherwise
    credit_reason: why a fee credit was given; none otherwise
    related_entry_id: 'the narrowest source: for a return the receipt returned, for a fee the batch, receipt, kit
      order or return that incurred it, for a fee credit the fee; empty otherwise'
  account: funding_balance
  direction: in
  triggers: []
- type: paycard_kit_order
  target: paycard_kit_orders
  meaning: An order of instant-issue card kits for one employer location.
  grain: one row per kit order
  distinguish_by:
  - order_date
  - ship_location
  fields:
    order_date: date the order was placed
    kit_quantity: kits ordered
    ship_location: employer location name the kits ship to, exactly as set up on the program
    shipping_speed: shipping speed chosen
  triggers:
  - event: paycard:paycard_kit_inventory_update
    map: {}
measures:
- id: paycard_msr_returns_90d
  window: the 90 calendar days ending today
  measure: count of paycard_funding_return entries on the program
- id: paycard_msr_avg_regular_batch
  window: the program's most recent reserve_average_batches regular batches before today
  measure: average amount of paycard_payroll_load_batch entries with batch_type regular_payroll
- id: paycard_msr_month_off_cycle
  window: the calendar month of the batch
  measure: count of paycard_payroll_load_batch entries with batch_type off_cycle in posting order, the batch in
    question included
- id: paycard_msr_month_active_cards
  window: one billing month
  measure: number of distinct card accounts opened under the program with at least one card_load of load_source
    payroll posted in the month
- id: paycard_msr_month_free_kits_used
  window: one calendar month
  measure: kits already supplied without kit fee in the month under the Earned Wage Access bundle
- id: paycard_msr_courtesy_credits_365d
  window: the 365 calendar days ending today
  measure: count of paycard_fee_credit entries with credit_reason courtesy on the program
- id: paycard_msr_ewa_live
  window: the calendar month of the kit order
  measure: true when the employer's Earned Wage Access Program Agreement has status live on the order date
- id: paycard_msr_package_changes_365d
  window: the 365 calendar days ending on the submission date
  measure: count of paycard_requests of type package_change with status scheduled or effective
policies:
- id: paycard_agg_multi_holding
  subject:
  - paycard_contract
  rule: >-
    An employer holds at most max_per_customer Payroll Card Program; every location and payroll group of the employer
    funds through it. An employer may not hold a second Payroll Card Program that is not terminated. A new program
    opens in contracted status in the package the employer chose, provided its active cardholder count meets that
    package's entry gate, with a zero funding balance and zero kit inventory.
  eligibility:
  - id: one_program
    applies_to:
    - paycard_contract
    kind: dedup
    condition: An employer may not hold a second Payroll Card Program that is not terminated.
    evidence_fields:
    - paycard_programs.customer_id
    - paycard_programs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_programs.customer_id
      action_bindings:
        paycard_programs.customer_id: customer_id
    dedup_contract:
      table: paycard_programs
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - contracted
        - live
        - suspended
      distinct_fields:
      - signed_date
  params:
    max_per_customer: 1
- id: paycard_evt_funding
  subject:
  - paycard_funding_receipt
  - paycard_funding_return
  rule: >-
    The employer funds each payroll batch into its program funding account. A funding payment is accepted only by
    a method listed in funding_methods_allowed for the program's package. Funds for a batch must arrive by funding_cutoff_time_et
    on the day funding_deadline_business_days_before_pay_date business days before its pay date (Business days are
    Monday through Friday excluding Federal Reserve holidays); under an ach_debit_authorization Paystride initiates
    the debit ach_debit_funding_lead_business_days business days before the pay date. Funds arriving after that
    deadline are still credited, and the batch is charged late_funding_fee_usd; they post to cards on the pay date
    only if they arrive before load_posting_time_et that day, and otherwise on the next business day. A funding
    payment returned unpaid is reversed by a funding return pointing to it, which charges returned_funding_fee_usd,
    and loads already posted to workers' cards are never taken back because of it; the balance may go negative and
    must be cured. A funding payment is returned at most once. When paycard_msr_returns_90d reaches returned_funding_suspend_count_90d
    the program is suspended under paycard_lifecycle.
  eligibility:
  - id: funding_method
    applies_to:
    - paycard_funding_receipt
    kind: authorization
    condition: A funding payment is accepted only by a method listed in funding_methods_allowed for the program's
      package.
    evidence_fields:
    - paycard_funding.funding_method
    - paycard_programs.variant_name
    - paycard_programs.paycard_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_programs.paycard_program_id
      action_bindings:
        paycard_programs.paycard_program_id: paycard_program_id
  - id: one_return
    applies_to:
    - paycard_funding_return
    kind: dedup
    condition: A funding payment is returned at most once.
    evidence_fields:
    - paycard_funding.related_entry_id
    - paycard_funding.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_funding.related_entry_id
      action_bindings:
        paycard_funding.related_entry_id: related_entry_id
    dedup_contract:
      table: paycard_funding
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - paycard_funding_return
      distinct_fields: []
  params:
    per_tier:
      Paystride Paycard Program Essential:
        funding_deadline_business_days_before_pay_date: =funding_deadline_business_days_before_pay_date
        late_funding_fee_usd: =late_funding_fee_usd
        returned_funding_fee_usd: =returned_funding_fee_usd
      Paystride Paycard Program Standard:
        funding_deadline_business_days_before_pay_date: =funding_deadline_business_days_before_pay_date
        late_funding_fee_usd: =late_funding_fee_usd
        returned_funding_fee_usd: =returned_funding_fee_usd
      Paystride Paycard Program Select:
        funding_deadline_business_days_before_pay_date: =funding_deadline_business_days_before_pay_date
        late_funding_fee_usd: =late_funding_fee_usd
        returned_funding_fee_usd: =returned_funding_fee_usd
      Paystride Paycard Program Advantage:
        funding_deadline_business_days_before_pay_date: =funding_deadline_business_days_before_pay_date
        late_funding_fee_usd: =late_funding_fee_usd
        returned_funding_fee_usd: =returned_funding_fee_usd
      Paystride Paycard Program Premier:
        funding_deadline_business_days_before_pay_date: =funding_deadline_business_days_before_pay_date
        late_funding_fee_usd: =late_funding_fee_usd
        returned_funding_fee_usd: =returned_funding_fee_usd
      Paystride Paycard Program Elite:
        funding_deadline_business_days_before_pay_date: =funding_deadline_business_days_before_pay_date
        late_funding_fee_usd: =late_funding_fee_usd
        returned_funding_fee_usd: =returned_funding_fee_usd
  measures:
  - paycard_msr_returns_90d
- id: paycard_evt_payroll_loads
  subject:
  - paycard_payroll_load_batch
  - paycard_returned_load_credit
  rule: >-
    A batch is loaded only from funds already in the funding balance: Paystride never advances payroll for an employer,
    and a batch the balance cannot cover posts no load until it is funded. A payroll batch is loaded only while
    the program status is contracted, live or suspended. The first batch of a contracted program launches it, and
    a suspended program's batch posts only from wire or already-cleared funds. A pay date receives one regular payroll
    batch. Each worker's load in a batch is at most max_load_per_card_usd; a larger line is rejected and must be
    sent as a corrected file at load_file_correction_fee_usd. A worker is loaded only when their consent to card
    payment is on file, because opt_in_consent_required and alternative_pay_method_required are true and a worker
    may always choose direct deposit or a check. A regular batch posts by load_posting_time_et on its pay date;
    an off-cycle batch posts on the day it is funded. A load refused by the worker's card account because the account
    is closed or the load would exceed the card's balance limit is credited back to the funding balance within returned_load_credit_business_days
    business days, pointing to the refused card load, and the employer pays that worker another way.
  eligibility:
  - id: batch_status
    applies_to:
    - paycard_payroll_load_batch
    kind: state
    condition: A payroll batch is loaded only while the program status is contracted, live or suspended.
    evidence_fields:
    - paycard_programs.status
    - paycard_programs.paycard_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_programs.paycard_program_id
      action_bindings:
        paycard_programs.paycard_program_id: paycard_program_id
    state_contract:
      field: paycard_programs.status
      allowed:
      - contracted
      - live
      - suspended
  - id: one_regular_batch
    applies_to:
    - paycard_payroll_load_batch
    kind: dedup
    condition: A pay date receives one regular payroll batch.
    evidence_fields:
    - paycard_funding.pay_date
    - paycard_funding.batch_type
    - paycard_funding.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_funding.pay_date
      action_bindings:
        paycard_funding.pay_date: pay_date
    dedup_contract:
      table: paycard_funding
      mode: separate_record
      object_bindings:
        paycard_program_id: paycard_program_id
        pay_date: pay_date
        batch_type: batch_type
      duplicate_filters:
        event_type:
        - paycard_payroll_load_batch
        batch_type:
        - regular_payroll
      distinct_fields: []
  params:
    per_tier:
      Paystride Paycard Program Essential:
        max_load_per_card_usd: =max_load_per_card_usd
      Paystride Paycard Program Standard:
        max_load_per_card_usd: =max_load_per_card_usd
      Paystride Paycard Program Select:
        max_load_per_card_usd: =max_load_per_card_usd
      Paystride Paycard Program Advantage:
        max_load_per_card_usd: =max_load_per_card_usd
      Paystride Paycard Program Premier:
        max_load_per_card_usd: =max_load_per_card_usd
      Paystride Paycard Program Elite:
        max_load_per_card_usd: =max_load_per_card_usd
- id: paycard_evt_load_reversal
  subject:
  - paycard_load_reversal_credit
  rule: >-
    An employer may ask Paystride to reverse one erroneous payroll load on a worker's card, for a reason listed
    in load_reversal_reasons_allowed: a duplicate load, a load for the wrong amount (only the excess), or a load
    to the wrong worker. A load reversal is accepted only when the request arrives within load_reversal_request_window_business_days
    business days after the load posted. Business days are Monday through Friday excluding Federal Reserve holidays,
    counted from the day after the card load's posted_date, and a request on the last business day of the window
    is in time. A load reversal is accepted only from a requester whose role is listed in authorized_requester_roles.
    The worker is notified of the reversal; Paystride recovers at most the lesser of the requested amount and the
    card's available balance when the request is processed, never takes a card balance below zero, and never re-attempts
    for the rest. The amount recovered is credited to the funding balance pointing to the request and the card load,
    and the request ends as recovered, partially_recovered or not_recovered; any part not recovered is for the employer
    to settle with the worker directly. Each request is charged load_reversal_fee_usd, also when nothing was recovered
    only where load_reversal_fee_on_failure is true. A load that was correct when sent — a worker who later quit,
    or a pay dispute between the employer and the worker — is never reversible. A reversal request is recovered
    at most once.
  eligibility:
  - id: reversal_window
    applies_to:
    - paycard_load_reversal_credit
    kind: time
    condition: A load reversal is accepted only when the request arrives within load_reversal_request_window_business_days
      business days after the load posted.
    evidence_fields:
    - card_transactions.posted_date
    - card_transactions.card_txn_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.card_txn_id
      action_bindings:
        card_transactions.card_txn_id: card_txn_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the load posted
      anchor_source: card_transactions.posted_date
      relation: not_after
      duration_source: variants.load_reversal_request_window_business_days
      unit: business_days
      counting_rule: Business days are Monday through Friday excluding Federal Reserve holidays, counted from the
        day after the card load's posted_date, and a request on the last business day of the window is in time.
      boundary: inclusive
  - id: reversal_role
    applies_to:
    - paycard_load_reversal_credit
    kind: authorization
    condition: A load reversal is accepted only from a requester whose role is listed in authorized_requester_roles.
    evidence_fields:
    - paycard_requests.requester_role
    - paycard_requests.paycard_request_id
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - paycard_requests.paycard_request_id
      action_bindings:
        paycard_requests.paycard_request_id: paycard_request_id
  - id: one_recovery
    applies_to:
    - paycard_load_reversal_credit
    kind: dedup
    condition: A reversal request is recovered at most once.
    evidence_fields:
    - paycard_funding.paycard_request_id
    - paycard_funding.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_funding.paycard_request_id
      action_bindings:
        paycard_funding.paycard_request_id: paycard_request_id
    dedup_contract:
      table: paycard_funding
      mode: separate_record
      object_bindings:
        paycard_request_id: paycard_request_id
      duplicate_filters:
        event_type:
        - paycard_load_reversal_credit
      distinct_fields: []
  params:
    per_tier:
      Paystride Paycard Program Essential:
        load_reversal_fee_usd: =load_reversal_fee_usd
        load_reversal_fee_on_failure: =load_reversal_fee_on_failure
      Paystride Paycard Program Standard:
        load_reversal_fee_usd: =load_reversal_fee_usd
        load_reversal_fee_on_failure: =load_reversal_fee_on_failure
      Paystride Paycard Program Select:
        load_reversal_fee_usd: =load_reversal_fee_usd
        load_reversal_fee_on_failure: =load_reversal_fee_on_failure
      Paystride Paycard Program Advantage:
        load_reversal_fee_usd: =load_reversal_fee_usd
        load_reversal_fee_on_failure: =load_reversal_fee_on_failure
      Paystride Paycard Program Premier:
        load_reversal_fee_usd: =load_reversal_fee_usd
        load_reversal_fee_on_failure: =load_reversal_fee_on_failure
      Paystride Paycard Program Elite:
        load_reversal_fee_usd: =load_reversal_fee_usd
        load_reversal_fee_on_failure: =load_reversal_fee_on_failure
- id: paycard_evt_fees
  subject:
  - paycard_fee_debit
  rule: >-
    Program fees are debited from the funding balance under the package held on the day they are incurred. A source
    entry incurs at most one fee of each fee type, and a monthly fee is debited once per billing month. On the monthly_fee_debit_business_day
    business day of each month, the previous month is billed: monthly_program_fee_usd for every month the program
    was live or suspended on any day, never prorated, and active_card_monthly_fee_usd times paycard_msr_month_active_cards,
    an active card being one with at least one payroll load posted in the month. A kit order is charged card_kit_fee_usd
    per kit beyond the kits supplied without fee (free_kits_at_launch on the launch order, and the bundle under
    paycard_ewa_bundle), plus kit_shipping_fee_usd, or expedited_kit_shipping_fee_usd instead when shipped expedited.
    An off-cycle batch is charged off_cycle_load_fee_usd when its position in the month (paycard_msr_month_off_cycle)
    exceeds off_cycle_batches_free_per_month. A late batch, a returned funding payment, a corrected load file, a
    load reversal request, a reinstatement (reinstatement_fee_usd) and an early termination (early_termination_fee_usd,
    when the program terminates before minimum_term_months from signing) are each charged once, pointing to the
    entry or request that incurred them. A fee that comes to zero is not debited.
  eligibility:
  - id: one_fee
    applies_to:
    - paycard_fee_debit
    kind: dedup
    condition: A source entry incurs at most one fee of each fee type, and a monthly fee is debited once per billing
      month.
    evidence_fields:
    - paycard_funding.related_entry_id
    - paycard_funding.fee_type
    - paycard_funding.billing_month
    - paycard_funding.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_funding.related_entry_id
        - paycard_funding.fee_type
      action_bindings:
        paycard_funding.related_entry_id: related_entry_id
        paycard_funding.fee_type: fee_type
    dedup_contract:
      table: paycard_funding
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
        fee_type: fee_type
      duplicate_filters:
        event_type:
        - paycard_fee_debit
      distinct_fields:
      - billing_month
  params:
    per_tier:
      Paystride Paycard Program Essential:
        monthly_program_fee_usd: =monthly_program_fee_usd
        active_card_monthly_fee_usd: =active_card_monthly_fee_usd
        card_kit_fee_usd: =card_kit_fee_usd
        off_cycle_batches_free_per_month: =off_cycle_batches_free_per_month
      Paystride Paycard Program Standard:
        monthly_program_fee_usd: =monthly_program_fee_usd
        active_card_monthly_fee_usd: =active_card_monthly_fee_usd
        card_kit_fee_usd: =card_kit_fee_usd
        off_cycle_batches_free_per_month: =off_cycle_batches_free_per_month
      Paystride Paycard Program Select:
        monthly_program_fee_usd: =monthly_program_fee_usd
        active_card_monthly_fee_usd: =active_card_monthly_fee_usd
        card_kit_fee_usd: =card_kit_fee_usd
        off_cycle_batches_free_per_month: =off_cycle_batches_free_per_month
      Paystride Paycard Program Advantage:
        monthly_program_fee_usd: =monthly_program_fee_usd
        active_card_monthly_fee_usd: =active_card_monthly_fee_usd
        card_kit_fee_usd: =card_kit_fee_usd
        off_cycle_batches_free_per_month: =off_cycle_batches_free_per_month
      Paystride Paycard Program Premier:
        monthly_program_fee_usd: =monthly_program_fee_usd
        active_card_monthly_fee_usd: =active_card_monthly_fee_usd
        card_kit_fee_usd: =card_kit_fee_usd
        off_cycle_batches_free_per_month: =off_cycle_batches_free_per_month
      Paystride Paycard Program Elite:
        monthly_program_fee_usd: =monthly_program_fee_usd
        active_card_monthly_fee_usd: =active_card_monthly_fee_usd
        card_kit_fee_usd: =card_kit_fee_usd
        off_cycle_batches_free_per_month: =off_cycle_batches_free_per_month
  formula:
    active_card_fee: active_card_monthly_fee_usd * paycard_msr_month_active_cards
    off_cycle_fee: 0 if paycard_msr_month_off_cycle <= off_cycle_batches_free_per_month else off_cycle_load_fee_usd
  measures:
  - paycard_msr_month_active_cards
  - paycard_msr_month_off_cycle
- id: paycard_evt_fee_credits
  subject:
  - paycard_fee_credit
  rule: >-
    A fee debited in error — not due under the package on its date, debited twice, or caused by Paystride's own
    processing error — is credited in full with reason fee_charged_in_error, whether the employer raises it or Paystride
    finds it. A correctly debited fee may be credited as a courtesy only while paycard_msr_courtesy_credits_365d
    is below courtesy_fee_credits_per_12_months. A fee is credited only when the credit is raised within fee_credit_request_window_days
    calendar days of the fee's entry date. Calendar days are counted from the day after the fee's entry_date, so
    the last day to ask is the entry_date plus the window. A fee not questioned within that window is deemed accepted
    and is not credited for any reason. A fee is credited at most once. A credit always returns the whole fee and
    points to it. A late funding fee is never credited because the employer's bank was slow.
  eligibility:
  - id: credit_window
    applies_to:
    - paycard_fee_credit
    kind: time
    condition: A fee is credited only when the credit is raised within fee_credit_request_window_days calendar days
      of the fee's entry date.
    evidence_fields:
    - paycard_funding.entry_date
    - paycard_funding.funding_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_funding.funding_entry_id
      action_bindings:
        paycard_funding.funding_entry_id: related_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the fee's entry date
      anchor_source: paycard_funding.entry_date
      relation: not_after
      duration_source: variants.fee_credit_request_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the fee's entry_date, so the last day to ask is
        the entry_date plus the window.
      boundary: inclusive
  - id: one_credit
    applies_to:
    - paycard_fee_credit
    kind: dedup
    condition: A fee is credited at most once.
    evidence_fields:
    - paycard_funding.related_entry_id
    - paycard_funding.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_funding.related_entry_id
      action_bindings:
        paycard_funding.related_entry_id: related_entry_id
    dedup_contract:
      table: paycard_funding
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - paycard_fee_credit
      distinct_fields: []
  params:
    per_tier:
      Paystride Paycard Program Essential:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Paycard Program Standard:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Paycard Program Select:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Paycard Program Advantage:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Paycard Program Premier:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Paycard Program Elite:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
  measures:
  - paycard_msr_courtesy_credits_365d
- id: paycard_evt_kit_orders
  subject:
  - paycard_kit_order
  - paycard_kit_inventory_update
  rule: >-
    Kits are ordered only while the program status is contracted or live. A kit order is at least card_kit_min_order
    kits, in multiples of kit_order_multiple, ships to one of at most kit_ship_locations_max employer locations,
    and is refused when card_kit_inventory plus the order would exceed max_kit_inventory. Standard orders ship within
    kit_order_processing_business_days business days and expedited orders arrive within expedited_kit_delivery_business_days.
    card_kit_inventory rises by the kits delivered and falls by one for each card issued from a kit at the employer's
    location. Kit and shipping fees follow paycard_evt_fees.
  eligibility:
  - id: kit_status
    applies_to:
    - paycard_kit_order
    kind: state
    condition: Kits are ordered only while the program status is contracted or live.
    evidence_fields:
    - paycard_programs.status
    - paycard_programs.paycard_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_programs.paycard_program_id
      action_bindings:
        paycard_programs.paycard_program_id: paycard_program_id
    state_contract:
      field: paycard_programs.status
      allowed:
      - contracted
      - live
  params:
    per_tier:
      Paystride Paycard Program Essential:
        card_kit_min_order: =card_kit_min_order
        max_kit_inventory: =max_kit_inventory
      Paystride Paycard Program Standard:
        card_kit_min_order: =card_kit_min_order
        max_kit_inventory: =max_kit_inventory
      Paystride Paycard Program Select:
        card_kit_min_order: =card_kit_min_order
        max_kit_inventory: =max_kit_inventory
      Paystride Paycard Program Advantage:
        card_kit_min_order: =card_kit_min_order
        max_kit_inventory: =max_kit_inventory
      Paystride Paycard Program Premier:
        card_kit_min_order: =card_kit_min_order
        max_kit_inventory: =max_kit_inventory
      Paystride Paycard Program Elite:
        card_kit_min_order: =card_kit_min_order
        max_kit_inventory: =max_kit_inventory
- id: paycard_reserve
  subject:
  - paycard_payroll_load_batch
  rule: >-
    After each regular batch the funding balance must still hold prefund_reserve_percent of paycard_msr_avg_regular_batch.
    When it does not, the employer is asked to restore it within reserve_shortfall_cure_business_days business days;
    the batch itself still posts if it was funded. Packages with a zero reserve percentage hold no reserve. A funding
    balance left negative for more than negative_balance_suspend_business_days business days suspends the program
    under paycard_lifecycle.
  eligibility: []
  params:
    per_tier:
      Paystride Paycard Program Essential:
        prefund_reserve_percent: =prefund_reserve_percent
      Paystride Paycard Program Standard:
        prefund_reserve_percent: =prefund_reserve_percent
      Paystride Paycard Program Select:
        prefund_reserve_percent: =prefund_reserve_percent
      Paystride Paycard Program Advantage:
        prefund_reserve_percent: =prefund_reserve_percent
      Paystride Paycard Program Premier:
        prefund_reserve_percent: =prefund_reserve_percent
      Paystride Paycard Program Elite:
        prefund_reserve_percent: =prefund_reserve_percent
  formula:
    reserve_required: prefund_reserve_percent / 100 * paycard_msr_avg_regular_batch
  measures:
  - paycard_msr_avg_regular_batch
- id: paycard_lifecycle
  subject:
  - paycard_launch
  - paycard_suspend
  - paycard_reinstate
  - paycard_terminate
  - paycard_termination_notice
  - paycard_package_change
  - paycard_funding_method_change
  rule: >-
    The program launches when its first payroll batch posts, which Paystride commits to make possible within launch_target_business_days
    business days of signing. The desk suspends only a program whose status is live. The desk suspends a live program
    when paycard_msr_returns_90d reaches returned_funding_suspend_count_90d or the funding balance stays negative
    longer than negative_balance_suspend_business_days; while suspended only batches funded by wire or already-cleared
    funds post. A suspended program is reinstated once the balance is restored and the reinstatement fee is debited.
    A package change or termination notice is accepted only from a requester whose role is listed in authorized_requester_roles.
    Termination is the employer's own decision. A termination takes effect no earlier than termination_notice_days
    calendar days after the termination notice date. Calendar days are counted from the day after the termination_notice_date,
    so the earliest termination date is that date plus the notice days. Workers keep their card accounts after termination;
    only employer loads stop. A package change takes effect on the first day of the next calendar month, at most
    package_change_max_per_12_months times in any 365 days (paycard_msr_package_changes_365d), only into a package
    whose entry gate the program meets, and moves every worker's card to that package's worker_card_plan on the
    same day. A funding method change is limited to funding_methods_allowed.
  eligibility:
  - id: suspend_from_live
    applies_to:
    - paycard_suspend
    kind: state
    condition: The desk suspends only a program whose status is live.
    evidence_fields:
    - paycard_programs.status
    - paycard_programs.paycard_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_programs.paycard_program_id
      action_bindings:
        paycard_programs.paycard_program_id: paycard_program_id
    state_contract:
      field: paycard_programs.status
      allowed:
      - live
  - id: notice_period
    applies_to:
    - paycard_terminate
    kind: time
    condition: A termination takes effect no earlier than termination_notice_days calendar days after the termination
      notice date.
    evidence_fields:
    - paycard_programs.termination_notice_date
    - paycard_programs.paycard_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_programs.paycard_program_id
      action_bindings:
        paycard_programs.paycard_program_id: paycard_program_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the termination notice date
      anchor_source: paycard_programs.termination_notice_date
      relation: not_before
      duration_source: variants.termination_notice_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the termination_notice_date, so the earliest termination
        date is that date plus the notice days.
      boundary: inclusive
  - id: change_role
    applies_to:
    - paycard_package_change
    - paycard_termination_notice
    kind: authorization
    condition: A package change or termination notice is accepted only from a requester whose role is listed in
      authorized_requester_roles.
    evidence_fields:
    - paycard_requests.requester_role
    - paycard_requests.paycard_request_id
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - paycard_requests.paycard_request_id
      action_bindings:
        paycard_requests.paycard_request_id: paycard_request_id
  params:
    per_tier:
      Paystride Paycard Program Essential:
        termination_notice_days: =termination_notice_days
        returned_funding_suspend_count_90d: =returned_funding_suspend_count_90d
      Paystride Paycard Program Standard:
        termination_notice_days: =termination_notice_days
        returned_funding_suspend_count_90d: =returned_funding_suspend_count_90d
      Paystride Paycard Program Select:
        termination_notice_days: =termination_notice_days
        returned_funding_suspend_count_90d: =returned_funding_suspend_count_90d
      Paystride Paycard Program Advantage:
        termination_notice_days: =termination_notice_days
        returned_funding_suspend_count_90d: =returned_funding_suspend_count_90d
      Paystride Paycard Program Premier:
        termination_notice_days: =termination_notice_days
        returned_funding_suspend_count_90d: =returned_funding_suspend_count_90d
      Paystride Paycard Program Elite:
        termination_notice_days: =termination_notice_days
        returned_funding_suspend_count_90d: =returned_funding_suspend_count_90d
  measures:
  - paycard_msr_returns_90d
  - paycard_msr_package_changes_365d
- id: paycard_ewa_bundle
  subject:
  - paycard_fee_debit
  rule: >-
    Holding a live Paystride Earned Wage Access Program Agreement changes kit fees: while paycard_msr_ewa_live is
    true on a kit order's date, the first ewa_bundle_free_kits_per_month kits ordered in that calendar month (counting
    paycard_msr_month_free_kits_used) carry no kit fee; shipping is still charged. The bundle and free_kits_at_launch
    do not add up on the same order: the launch order uses whichever supplies more kits without fee. When ewa_card_destination_promotion
    is true, workers paid on the card are told they can receive early pay on it without a transfer fee; that promise
    is kept by the Access charter, not by a credit here.
  eligibility: []
  params:
    per_tier:
      Paystride Paycard Program Essential:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
      Paystride Paycard Program Standard:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
      Paystride Paycard Program Select:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
      Paystride Paycard Program Advantage:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
      Paystride Paycard Program Premier:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
      Paystride Paycard Program Elite:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
  formula:
    fee_free_kits: ewa_bundle_free_kits_per_month - paycard_msr_month_free_kits_used if paycard_msr_ewa_live else
      0
  measures:
  - paycard_msr_ewa_live
  - paycard_msr_month_free_kits_used
