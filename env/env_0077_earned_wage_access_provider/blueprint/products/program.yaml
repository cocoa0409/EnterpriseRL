category: program
display_name: Paystride Earned Wage Access Program Agreement
binding:
  holding_table: program_agreements
  event_tables:
  - program_settlements
  - program_billing
  - program_census
  intake_tables:
  - program_change_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    remittance_receivable: remittance_receivable
    fee_receivable: fee_receivable
lifecycle:
  states:
  - contracted
  - implementing
  - live
  - suspended
  - terminating
  - terminated
  transitions:
  - from: contracted
    to: implementing
    by: system
    means: implementation starts on receipt of the payroll contact and test file
  - from: implementing
    to: live
    by: system
    means: the first payroll file validates
  - from: contracted
    to: terminated
    by: user
    means: the employer cancels before implementation starts
  - from: live
    to: suspended
    by: agent
    means: the desk suspends for a remittance past due too long
  - from: suspended
    to: live
    by: agent
    means: the desk reinstates once past-due amounts are cured
  - from: live
    to: terminating
    by: user
    means: the employer gives written termination notice
  - from: terminating
    to: terminated
    by: system
    means: the notice period ends and final settlement completes
accounts:
- key: remittance_receivable
  unit: USD
  meaning: Deducted wage advances and fees the employer owes Paystride under its deduction schedules.
- key: fee_receivable
  unit: USD
  meaning: Program charges billed to the employer and not yet paid or credited.
parameter_schema:
  monthly_platform_fee_usd: Flat monthly platform fee billed to the employer under every fee model (USD per month).
  implementation_fee_usd: One-time implementation fee billed with the first invoice (USD).
  implementation_fee_waiver_min_term_months: Signed term, in months, at or above which the implementation fee is
    waived (months).
  employer_paid_pepm_usd: Per-enrolled-worker-per-month fee billed under the employer_paid fee model (USD).
  employer_paid_transfers_per_worker_per_period: Transfers per worker per pay period carrying no worker fee under
    the employer_paid model (count).
  sponsored_instant_fee_usd: Fee billed to the employer for each sponsored instant transfer under the employer_sponsored
    model (USD).
  sponsored_nbd_fee_usd: Fee billed to the employer for each sponsored next-business-day transfer under the employer_sponsored
    model (USD).
  sponsored_free_transfers_per_worker_per_period: Transfers per worker per pay period whose fee the employer sponsors
    under the employer_sponsored model (count).
  max_configurable_cap_percent: Highest access percentage the employer may configure for its workers (number, percent).
  min_configurable_cap_percent: Lowest access percentage the employer may configure (number, percent).
  cap_step_percent: Configured access percentages must be a multiple of this step (number, percent).
  default_cap_percent: Access percentage set at contract when the employer configures none (number, percent).
  included_payroll_groups: Payroll groups (pay schedules or legal entities) included in the platform fee (count).
  additional_payroll_group_fee_monthly_usd: Monthly fee for each payroll group beyond those included (USD).
  deduction_file_lead_business_days: Business days before a pay date on which the deduction file for it is delivered
    to the employer (count).
  remittance_due_business_days_after_pay_date: Business days after the pay date by which the deducted amounts must
    be remitted (count).
  remittance_methods_allowed: Remittance methods the employer may use (list of remittance_method values).
  ach_debit_return_fee_usd: Fee billed when an ACH debit of a remittance is returned unpaid (USD).
  shortfall_report_due_business_days: Business days after the pay date by which the employer reports the reason
    for each unremitted deduction (count).
  shortfall_liability_map: Mapping of reported shortfall reason -> who bears it (provider_absorbed or employer_liable).
  shortfall_contest_window_business_days: Business days after a shortfall is classified employer_liable within which
    the employer may contest it with payroll evidence (count).
  employer_liable_cure_business_days: Business days after classification within which an employer-liable shortfall
    must be remitted (count).
  late_charge_grace_business_days: Business days after a remittance due date before a late charge can be assessed
    (count).
  late_charge_monthly_rate_percent: Late charge rate on the overdue remittance for each late-charge period (number,
    percent).
  late_charge_minimum_usd: Minimum late charge per late-charge period (USD).
  late_charge_period_days: Length of one late-charge period counted from the due date (calendar days).
  late_charge_courtesy_waivers_per_12_months: Late charges that may be waived as a courtesy in any rolling 365 days
    (count).
  suspension_past_due_calendar_days: Calendar days a remittance may stay past due before the program is suspended
    (days).
  reinstatement_requires_full_cure: Whether a suspended program is reinstated only once every past-due remittance
    and charge is paid (boolean).
  invoice_net_terms_days: Calendar days after the invoice date by which an invoice must be paid (days).
  invoice_issue_business_day: Business day of the following month on which a month's invoice is issued (ordinal).
  sla_uptime_target_percent: Monthly platform availability commitment (number, percent).
  sla_credit_ladder_percent: Ladder (mapping of measured monthly availability band -> credit as percent of that
    month's platform fee after discounts); the lowest band reached applies.
  sla_credit_claim_window_days: Calendar days after the end of the affected month within which the employer must
    claim an SLA credit (days).
  go_live_target_business_days: Business days after contract within which Paystride commits to go live, if the employer
    delivers its payroll file on time (count).
  go_live_delay_credit_percent: Credit, as percent of the implementation fee, when go-live misses the target for
    reasons on Paystride's side (number, percent).
  minimum_term_months: Minimum initial term (months).
  renewal_term_months: Length of each automatic renewal (months).
  termination_notice_days: Calendar days of written notice required to terminate (days).
  early_termination_fee_months: Months of platform fee, at most the months remaining in the term, billed when the
    program terminates before the end of its term (months).
  termination_final_settlement_business_days: Business days after the termination date within which the final deduction
    file is settled (count).
  cap_change_max_per_12_months: Access percentage changes allowed in any rolling 365 days (count).
  fee_model_change_max_per_12_months: Fee model changes allowed in any rolling 365 days (count).
  change_effective_lead_business_days: Business days after a change request is submitted before the first pay period
    it can take effect in may begin (count).
  rebanding_consecutive_months: Consecutive monthly censuses outside the tier's headcount band after which the program
    moves to the matching tier (count).
  paycard_bundle_discount_percent: Discount on the monthly platform fee for a month in which the employer's Payroll
    Card Program was live on every day (number, percent).
  dedicated_csm: Whether a dedicated customer success manager is assigned (boolean).
  api_access: Whether the employer may use the Paystride reporting API (boolean).
  employer_portal_admin_seats: Employer administrator seats included (count).
  authorized_requester_roles: Employer portal roles allowed to submit program changes and termination notices (list).
