    billing_month: calendar month the line bills or credits; for payments the month of the line paid
    invoice_line: kind of charge billed, paid or credited
    quantity: units billed on the line (workers, transfers, payroll groups or months); 1 on flat lines
    amount: size of the movement, always greater than zero; invoice lines and late charges add to and payments and
