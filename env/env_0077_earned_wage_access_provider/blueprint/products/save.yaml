category: save
display_name: Paystride Save
binding:
  holding_table: save_accounts
  event_tables:
  - save_ledger
  intake_tables:
  - save_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    save_balance: save_balance
lifecycle:
  states:
  - pending
  - open
  - frozen
  - closed
  transitions:
  - from: pending
    to: open
    by: system
    means: identity verification at the bank completes
  - from: pending
    to: closed
    by: system
    means: the application lapses unverified
  - from: open
    to: frozen
    by: agent
    means: the desk freezes on suspected fraud or a legal order
  - from: frozen
    to: open
    by: agent
    means: the desk lifts the freeze after review
  - from: open
    to: closed
    by: user
    means: the worker confirms closure
accounts:
- key: save_balance
  unit: USD
  meaning: Money held in the worker's Paystride Save account.
parameter_schema:
  apy_percent: Annual percentage yield paid on the balance up to the APY balance cap (number, percent).
  apy_balance_cap_usd: Balance up to which apy_percent is paid (USD).
  apy_above_cap_percent: Annual percentage yield paid on the part of the balance above the cap (number, percent).
  interest_accrual_basis: Balance on which interest accrues (text).
  interest_day_count_days: Days in the year used to convert the yield to a daily rate (days).
  interest_credit_frequency: How often accrued interest is credited (text).
  interest_min_credit_usd: Smallest interest credit; less accrues to the next month (USD).
  interest_forfeited_on_midmonth_close: Whether interest accrued but not credited is forfeited when the account
    closes mid-month (boolean).
  interest_paid_while_frozen: Whether interest keeps accruing while the account is frozen (boolean).
  tax_form_threshold_usd: Interest credited in a calendar year at or above which a Form 1099-INT is issued (USD).
  round_up_allowed: Whether card purchase round-ups may be saved (boolean).
  round_up_max_multiplier: Highest round-up multiplier the worker may choose (count).
  round_up_daily_cap_usd: Most that round-ups can move in one calendar day (USD).
  round_up_min_card_balance_usd: Card balance below which the day's round-ups are skipped (USD).
  round_up_sweep_time_et: Eastern Time at which the day's round-ups move from the card (HH:MM).
  auto_save_max_percent_of_payroll: Highest share of a payroll load the worker may auto-save (number, percent).
  auto_save_min_payroll_load_usd: Payroll load below which no auto-save is taken (USD).
  auto_save_applies_to_ewa_loads: Whether auto-save is taken from early wage transfers to the card (boolean).
  manual_transfer_min_usd: Smallest manual transfer in (USD).
  manual_deposit_daily_limit_usd: Most that manual transfers can move in one calendar day (USD).
  max_balance_usd: Largest balance; a deposit that would exceed it is skipped (USD).
  minimum_opening_deposit_usd: Deposit required to open (USD).
  monthly_fee_usd: Monthly account fee (USD).
  withdrawals_per_month_max: Withdrawals allowed per calendar month (count).
  withdrawal_fee_usd: Fee per withdrawal (USD).
  daily_withdrawal_limit_usd: Most that can be withdrawn in one calendar day (USD).
  instant_withdrawal_to_card: Whether withdrawals to the Paystride card are instant (boolean).
  external_bank_withdrawal_allowed: Whether withdrawals may go to an outside bank account (boolean).
  external_bank_withdrawal_business_days: Business days for a withdrawal to an outside bank account to arrive (count).
  negative_balance_allowed: Whether a withdrawal may take the balance below zero (boolean).
  streak_bonus_usd: Bonus credited when a saving streak completes (USD).
  streak_bonus_pay_periods: Consecutive card pay periods with a qualifying deposit that complete a streak (count).
  streak_bonus_min_deposit_usd: Deposits in a pay period needed for it to count toward a streak (USD).
  bonuses_per_12_months_max: Streak bonuses allowed in any rolling 365 days (count).
  bonus_clawback_days: Calendar days after a bonus during which falling below the floor takes the bonus back (days).
  bonus_clawback_balance_floor_usd: Balance below which a recent bonus is taken back (USD).
  tier_review_frequency: When the tier is reviewed (text).
  downgrade_grace_months: Months below the tier's entry gate tolerated before moving down (count).
  card_required: Whether an active Paystride Visa Payroll Card is required to open and fund the account (boolean).
  fdic_insured: Whether deposits are FDIC-insured through Harborline Bank, N.A. on a pass-through basis (boolean).
  fdic_coverage_limit_usd: Standard FDIC insurance amount per depositor, per insured bank, per ownership category
    (USD).
  freeze_review_business_days: Business days within which a fraud or legal freeze is reviewed (count).
  closure_payout_business_days: Business days within which the closing balance is paid out (count).
  reopen_cooldown_days: Calendar days after closure before the worker may open again (days).
  goal_amount_max_usd: Largest savings goal the worker may set (USD).
  pending_verification_days: Calendar days a pending account waits for identity verification before it lapses (days).
  access_shortfall_pauses_auto_save: Whether auto-save pauses while the worker's Earned Wage Access plan has an
    open shortfall (boolean).
  round_up_on_ewa_recovery: Whether card autorecovery debits generate round-ups (boolean).
