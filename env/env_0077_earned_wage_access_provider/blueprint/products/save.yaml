events:
- type: save_open
  target: save_accounts
  mutation: create
  meaning: A worker applies for a Paystride Save account linked to their payroll card.
  grain: one row per account change
  fields:
    customer_id: the worker (foreign key -> customers)
    card_account_id: the Paystride Visa Payroll Card account the savings are linked to (foreign key -> card_accounts)
    variant_name: the savings tier held, as the official full tier name
    status: lifecycle state of the account (see the save charter lifecycle)
    opened_date: date the account was applied for
    round_up_multiplier: round-up multiplier the worker chose; 0 means round-ups are off
    auto_save_percent: share of each payroll load the worker chose to auto-save; 0 means off
    goal_amount: savings goal the worker set; 0.00 when none
    save_balance: 'current balance: deposits, interest and bonuses less withdrawals and bonus clawbacks'
  triggers: []
- type: save_activate
  target: save_accounts
  mutation:
    transition:
      from: pending
      to: open
  meaning: The bank completes identity verification and the account opens.
  grain: one row per account change
  fields:
    status: lifecycle state of the account (see the save charter lifecycle)
  triggers: []
- type: save_lapse
  target: save_accounts
  mutation:
    transition:
      from: pending
      to: closed
  meaning: A pending account lapses unverified.
  grain: one row per account change
  fields:
    closed_date: date the account closed; empty until closed
  triggers: []
- type: save_freeze
  target: save_accounts
  mutation:
    transition:
      from: open
      to: frozen
  meaning: The desk freezes the account on suspected fraud or a legal order.
  grain: one row per account change
  fields:
    status: lifecycle state of the account (see the save charter lifecycle)
  triggers: []
- type: save_unfreeze
  target: save_accounts
  mutation:
    transition:
      from: frozen
      to: open
  meaning: The desk lifts the freeze after review.
  grain: one row per account change
  fields:
    status: lifecycle state of the account (see the save charter lifecycle)
  triggers: []
- type: save_close
  target: save_accounts
  mutation:
    transition:
      from: open
      to: closed
  meaning: The worker's confirmed closure takes effect and the balance is paid out.
  grain: one row per account change
  fields:
    closed_date: date the account closed; empty until closed
  triggers: []
- type: save_settings_update
  target: save_accounts
  mutation: update
  meaning: The worker changes round-ups, auto-save or the goal.
  grain: one row per account change
  fields:
    round_up_multiplier: round-up multiplier the worker chose; 0 means round-ups are off
    auto_save_percent: share of each payroll load the worker chose to auto-save; 0 means off
    goal_amount: savings goal the worker set; 0.00 when none
  triggers: []
- type: save_tier_change
  target: save_accounts
  mutation: update
  meaning: The tier changes at the monthly review.
  grain: one row per account change
  fields:
    variant_name: the savings tier held, as the official full tier name
  triggers: []
- type: save_deposit
  target: save_ledger
  meaning: >-
    Money moved into savings from the card: a round-up sweep, an auto-save from a payroll load, or a manual transfer.
  grain: one row per deposit
  distinguish_by:
  - entry_date
  - deposit_source
  - daily_sequence
  fields:
    entry_date: date the entry was booked
    amount: size of the movement, always greater than zero; deposits, interest and bonuses add and withdrawals and
      clawbacks subtract
    daily_sequence: ordinal among the account's entries of the same family on the same entry_date
    deposit_source: how a deposit was funded; none otherwise
    source_ref_id: the card transaction a deposit came from, or the bonus a clawback takes back; empty otherwise
  account: save_balance
  direction: in
  triggers:
  - event: card:card_debit
    when:
      deposit_source:
      - round_up
      - auto_save_payroll
      - manual_transfer
    map:
      amount: amount
      debit_type: save_transfer
      source_ref_id: save_entry_id
- type: save_withdrawal
  target: save_ledger
  meaning: Money moved out of savings to the card or an outside bank.
  grain: one row per withdrawal
  distinguish_by:
  - entry_date
  - daily_sequence
  fields:
    entry_date: date the entry was booked
    amount: size of the movement, always greater than zero; deposits, interest and bonuses add and withdrawals and
      clawbacks subtract
    daily_sequence: ordinal among the account's entries of the same family on the same entry_date
    withdrawal_destination: where a withdrawal went; none otherwise
  account: save_balance
  direction: out
  triggers:
  - event: card:card_load
    when:
      withdrawal_destination: paystride_card
    map:
      amount: amount
      load_source: save_withdrawal
      source_ref_id: save_entry_id
- type: save_interest_credit
  target: save_ledger
  meaning: Interest credited for one month.
  grain: one row per account and month
  distinguish_by:
  - interest_month
  fields:
    entry_date: date the entry was booked
    amount: size of the movement, always greater than zero; deposits, interest and bonuses add and withdrawals and
      clawbacks subtract
    interest_month: month an interest credit covers; empty otherwise
  account: save_balance
  direction: in
  triggers: []
- type: save_bonus_credit
  target: save_ledger
  meaning: A saving-streak bonus.
  grain: one row per streak completed
  distinguish_by:
  - entry_date
  fields:
    entry_date: date the entry was booked
    amount: size of the movement, always greater than zero; deposits, interest and bonuses add and withdrawals and
      clawbacks subtract
  account: save_balance
  direction: in
  triggers: []
- type: save_bonus_clawback
  target: save_ledger
  meaning: A recent bonus taken back because the balance fell below the floor.
  grain: one row per bonus taken back
  distinguish_by:
  - source_ref_id
  fields:
    entry_date: date the entry was booked
    amount: size of the movement, always greater than zero; deposits, interest and bonuses add and withdrawals and
      clawbacks subtract
    source_ref_id: the card transaction a deposit came from, or the bonus a clawback takes back; empty otherwise
  account: save_balance
  direction: out
  triggers: []
measures:
- id: save_msr_month_withdrawals
  window: the calendar month of the withdrawal
  measure: count of save_withdrawal entries, the withdrawal in question included
- id: save_msr_day_round_ups
  window: one calendar day
  measure: sum of amount of save_deposit entries with deposit_source round_up
- id: save_msr_daily_balances
  window: each day of the interest month
  measure: end-of-day save_balance reconstructed from the ledger
- id: save_msr_streak_periods
  window: the worker's card pay periods in descending order
  measure: count of consecutive pay periods whose save_deposit total reaches streak_bonus_min_deposit_usd, since
    the last bonus
- id: save_msr_bonuses_365d
  window: the 365 calendar days ending today
  measure: count of save_bonus_credit entries
- id: save_msr_prior_month_payroll_loads
  window: the previous calendar month
  measure: sum of amount of card_load entries with load_source payroll on the linked card
policies:
- id: save_agg_multi_holding
  subject:
  - save_open
  rule: >-
    A worker holds at most max_per_customer Paystride Save account. A worker may not hold a second Paystride Save
    account that is not closed. An account is opened only while the worker's Paystride Visa Payroll Card account
    status is active. A new account opens in pending at Paystride Save Starter with a zero balance, round-ups and
    auto-save off unless the worker turns them on, and is reviewed for a higher tier at the first monthly review.
    A worker whose last account closed fewer than reopen_cooldown_days calendar days ago cannot open another.
  eligibility:
  - id: one_account
    applies_to:
    - save_open
    kind: dedup
    condition: A worker may not hold a second Paystride Save account that is not closed.
    evidence_fields:
    - save_accounts.customer_id
    - save_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - save_accounts.customer_id
      action_bindings:
        save_accounts.customer_id: customer_id
    dedup_contract:
      table: save_accounts
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - pending
        - open
        - frozen
      distinct_fields:
      - opened_date
  - id: card_active
    applies_to:
    - save_open
    kind: state
    condition: An account is opened only while the worker's Paystride Visa Payroll Card account status is active.
    evidence_fields:
    - card_accounts.status
    - card_accounts.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.card_account_id
      action_bindings:
        card_accounts.card_account_id: card_account_id
    state_contract:
      field: card_accounts.status
      allowed:
      - active
  params:
    max_per_customer: 1
- id: save_evt_deposits
  subject:
  - save_deposit
  rule: >-
    A deposit is booked only while the savings account status is open. Round-ups save, for each card purchase, the
    difference to the next whole dollar times round_up_multiplier (a purchase of a whole-dollar amount rounds up
    a full dollar), swept at round_up_sweep_time_et, limited to round_up_daily_cap_usd a day (save_msr_day_round_ups)
    and skipped for the day when the card balance is below round_up_min_card_balance_usd. Auto-save takes auto_save_percent
    of each payroll load of at least auto_save_min_payroll_load_usd, rounded down to the cent; it is never taken
    from off-cycle loads or instant pay disbursements, and its relation to early pay follows save_access_interplay.
    Manual transfers are at least manual_transfer_min_usd and at most manual_deposit_daily_limit_usd a day. A deposit
    that would take the balance above max_balance_usd is skipped, never partly made.
  eligibility:
  - id: open_for_deposit
    applies_to:
    - save_deposit
    kind: state
    condition: A deposit is booked only while the savings account status is open.
    evidence_fields:
    - save_accounts.status
    - save_accounts.save_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - save_accounts.save_account_id
      action_bindings:
        save_accounts.save_account_id: save_account_id
    state_contract:
      field: save_accounts.status
      allowed:
      - open
  params:
    per_tier:
      Paystride Save Starter:
        round_up_max_multiplier: =round_up_max_multiplier
        auto_save_max_percent_of_payroll: =auto_save_max_percent_of_payroll
      Paystride Save Builder:
        round_up_max_multiplier: =round_up_max_multiplier
        auto_save_max_percent_of_payroll: =auto_save_max_percent_of_payroll
      Paystride Save Boost:
        round_up_max_multiplier: =round_up_max_multiplier
        auto_save_max_percent_of_payroll: =auto_save_max_percent_of_payroll
      Paystride Save Growth:
        round_up_max_multiplier: =round_up_max_multiplier
        auto_save_max_percent_of_payroll: =auto_save_max_percent_of_payroll
      Paystride Save Premier:
        round_up_max_multiplier: =round_up_max_multiplier
        auto_save_max_percent_of_payroll: =auto_save_max_percent_of_payroll
      Paystride Save Elite:
        round_up_max_multiplier: =round_up_max_multiplier
        auto_save_max_percent_of_payroll: =auto_save_max_percent_of_payroll
  measures:
  - save_msr_day_round_ups
- id: save_access_interplay
  subject:
  - save_deposit
  rule: >-
    Holding a Paystride Earned Wage Access Plan changes automatic saving. Auto-save is never taken from early wage
    transfers to the card when auto_save_applies_to_ewa_loads is false, so early pay is never swept into savings.
    While the worker's Access plan has an open shortfall, auto-save pauses when access_shortfall_pauses_auto_save
    is true and resumes with the next payroll load after the shortfall is recovered or written off; round-ups and
    manual transfers continue. A card autorecovery debit is not a purchase and never generates a round-up when round_up_on_ewa_recovery
    is false. Savings are never used to recover an Access shortfall.
  eligibility: []
  params:
    per_tier:
      Paystride Save Starter:
        auto_save_applies_to_ewa_loads: =auto_save_applies_to_ewa_loads
        round_up_max_multiplier: 1
      Paystride Save Builder:
        auto_save_applies_to_ewa_loads: =auto_save_applies_to_ewa_loads
        round_up_max_multiplier: 2
      Paystride Save Boost:
        auto_save_applies_to_ewa_loads: =auto_save_applies_to_ewa_loads
        round_up_max_multiplier: 2
      Paystride Save Growth:
        auto_save_applies_to_ewa_loads: =auto_save_applies_to_ewa_loads
        round_up_max_multiplier: 3
      Paystride Save Premier:
        auto_save_applies_to_ewa_loads: =auto_save_applies_to_ewa_loads
        round_up_max_multiplier: 3
      Paystride Save Elite:
        auto_save_applies_to_ewa_loads: =auto_save_applies_to_ewa_loads
        round_up_max_multiplier: 5
- id: save_evt_withdrawals
  subject:
  - save_withdrawal
  rule: >-
    A withdrawal is booked only while the savings account status is open. A withdrawal goes to the linked Paystride
    card, instantly when instant_withdrawal_to_card is true, or to an outside bank account only on tiers with external_bank_withdrawal_allowed,
    arriving in external_bank_withdrawal_business_days business days. At most withdrawals_per_month_max withdrawals
    are allowed in a calendar month (save_msr_month_withdrawals) and daily_withdrawal_limit_usd a day; a withdrawal
    never exceeds the balance and costs withdrawal_fee_usd. A frozen account allows no withdrawal.
  eligibility:
  - id: open_for_withdrawal
    applies_to:
    - save_withdrawal
    kind: state
    condition: A withdrawal is booked only while the savings account status is open.
    evidence_fields:
    - save_accounts.status
    - save_accounts.save_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - save_accounts.save_account_id
      action_bindings:
        save_accounts.save_account_id: save_account_id
    state_contract:
      field: save_accounts.status
      allowed:
      - open
  params:
    per_tier:
      Paystride Save Starter:
        withdrawals_per_month_max: =withdrawals_per_month_max
        external_bank_withdrawal_allowed: =external_bank_withdrawal_allowed
      Paystride Save Builder:
        withdrawals_per_month_max: =withdrawals_per_month_max
        external_bank_withdrawal_allowed: =external_bank_withdrawal_allowed
      Paystride Save Boost:
        withdrawals_per_month_max: =withdrawals_per_month_max
        external_bank_withdrawal_allowed: =external_bank_withdrawal_allowed
      Paystride Save Growth:
        withdrawals_per_month_max: =withdrawals_per_month_max
        external_bank_withdrawal_allowed: =external_bank_withdrawal_allowed
      Paystride Save Premier:
        withdrawals_per_month_max: =withdrawals_per_month_max
        external_bank_withdrawal_allowed: =external_bank_withdrawal_allowed
      Paystride Save Elite:
        withdrawals_per_month_max: =withdrawals_per_month_max
        external_bank_withdrawal_allowed: =external_bank_withdrawal_allowed
  measures:
  - save_msr_month_withdrawals
- id: save_evt_interest
  subject:
  - save_interest_credit
  rule: >-
    Interest accrues daily on each end-of-day balance (save_msr_daily_balances): apy_percent on the part up to apy_balance_cap_usd
    and apy_above_cap_percent on the part above it, each converted to a daily rate over interest_day_count_days,
    and the month's accruals are credited on the month's last calendar day, rounded to the nearest cent; a credit
    below interest_min_credit_usd carries to the next month. The tier in force on each day sets that day's rates.
    Interest accrues while frozen when interest_paid_while_frozen is true, and accrued interest is forfeited on
    a mid-month closure when interest_forfeited_on_midmonth_close is true. An account receives one interest credit
    per month. Interest of tax_form_threshold_usd or more in a calendar year is reported on Form 1099-INT.
  eligibility:
  - id: one_interest
    applies_to:
    - save_interest_credit
    kind: dedup
    condition: An account receives one interest credit per month.
    evidence_fields:
    - save_ledger.interest_month
    - save_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - save_ledger.interest_month
      action_bindings:
        save_ledger.interest_month: interest_month
    dedup_contract:
      table: save_ledger
      mode: separate_record
      object_bindings:
        save_account_id: save_account_id
        interest_month: interest_month
      duplicate_filters:
        event_type:
        - save_interest_credit
      distinct_fields: []
  params:
    per_tier:
      Paystride Save Starter:
        apy_percent: =apy_percent
        apy_balance_cap_usd: =apy_balance_cap_usd
      Paystride Save Builder:
        apy_percent: =apy_percent
        apy_balance_cap_usd: =apy_balance_cap_usd
      Paystride Save Boost:
        apy_percent: =apy_percent
        apy_balance_cap_usd: =apy_balance_cap_usd
      Paystride Save Growth:
        apy_percent: =apy_percent
        apy_balance_cap_usd: =apy_balance_cap_usd
      Paystride Save Premier:
        apy_percent: =apy_percent
        apy_balance_cap_usd: =apy_balance_cap_usd
      Paystride Save Elite:
        apy_percent: =apy_percent
        apy_balance_cap_usd: =apy_balance_cap_usd
  formula:
    daily_interest: (min(save_msr_daily_balances, apy_balance_cap_usd) * apy_percent + max(0, save_msr_daily_balances
      - apy_balance_cap_usd) * apy_above_cap_percent) / 100 / interest_day_count_days
  measures:
  - save_msr_daily_balances
- id: save_evt_bonus
  subject:
  - save_bonus_credit
  - save_bonus_clawback
  rule: >-
    A streak bonus of streak_bonus_usd is credited when save_msr_streak_periods reaches streak_bonus_pay_periods,
    at most bonuses_per_12_months_max in any 365 days (save_msr_bonuses_365d); tiers with a zero bonus pay none.
    A bonus is taken back only within bonus_clawback_days calendar days after it was credited. Calendar days are
    counted from the day after the bonus entry_date, so the last day a clawback can apply is that date plus the
    days. When the balance falls below bonus_clawback_balance_floor_usd within that time because of a withdrawal,
    the bonus is taken back in full, pointing to it, or to the balance when smaller; interest credits never trigger
    a clawback.
  eligibility:
  - id: clawback_window
    applies_to:
    - save_bonus_clawback
    kind: time
    condition: A bonus is taken back only within bonus_clawback_days calendar days after it was credited.
    evidence_fields:
    - save_ledger.entry_date
    - save_ledger.save_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - save_ledger.save_entry_id
      action_bindings:
        save_ledger.save_entry_id: source_ref_id
    temporal_basis:
      clock: frozen_time
      anchor_event: it was credited
      anchor_source: save_ledger.entry_date
      relation: not_after
      duration_source: variants.bonus_clawback_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the bonus entry_date, so the last day a clawback
        can apply is that date plus the days.
      boundary: inclusive
  params:
    per_tier:
      Paystride Save Starter:
        streak_bonus_usd: =streak_bonus_usd
        streak_bonus_pay_periods: =streak_bonus_pay_periods
      Paystride Save Builder:
        streak_bonus_usd: =streak_bonus_usd
        streak_bonus_pay_periods: =streak_bonus_pay_periods
      Paystride Save Boost:
        streak_bonus_usd: =streak_bonus_usd
        streak_bonus_pay_periods: =streak_bonus_pay_periods
      Paystride Save Growth:
        streak_bonus_usd: =streak_bonus_usd
        streak_bonus_pay_periods: =streak_bonus_pay_periods
      Paystride Save Premier:
        streak_bonus_usd: =streak_bonus_usd
        streak_bonus_pay_periods: =streak_bonus_pay_periods
      Paystride Save Elite:
        streak_bonus_usd: =streak_bonus_usd
        streak_bonus_pay_periods: =streak_bonus_pay_periods
  measures:
  - save_msr_streak_periods
  - save_msr_bonuses_365d
- id: save_tier_review
  subject:
  - save_tier_change
  rule: >-
    The tier is reviewed tier_review_frequency against each tier's entry gate: payroll loads to the linked card
    in the previous calendar month (save_msr_prior_month_payroll_loads) and calendar days since the card's activated_date.
    The account moves to the highest tier whose gate it meets; a move down happens only after downgrade_grace_months
    consecutive reviews below the current gate. Early wage transfers and instant pay disbursements never count as
    payroll loads.
  eligibility: []
  params:
    per_tier:
      Paystride Save Starter:
        downgrade_grace_months: =downgrade_grace_months
        max_balance_usd: =max_balance_usd
      Paystride Save Builder:
        downgrade_grace_months: =downgrade_grace_months
        max_balance_usd: =max_balance_usd
      Paystride Save Boost:
        downgrade_grace_months: =downgrade_grace_months
        max_balance_usd: =max_balance_usd
      Paystride Save Growth:
        downgrade_grace_months: =downgrade_grace_months
        max_balance_usd: =max_balance_usd
      Paystride Save Premier:
        downgrade_grace_months: =downgrade_grace_months
        max_balance_usd: =max_balance_usd
      Paystride Save Elite:
        downgrade_grace_months: =downgrade_grace_months
        max_balance_usd: =max_balance_usd
  measures:
  - save_msr_prior_month_payroll_loads
- id: save_lifecycle
  subject:
  - save_activate
  - save_lapse
  - save_freeze
  - save_unfreeze
  - save_close
  - save_settings_update
  rule: >-
    The bank opens a pending account when identity verification completes, and a pending account lapses after pending_verification_days
    calendar days. The desk freezes an open account on suspected fraud or a legal order and reviews it within freeze_review_business_days
    business days. The desk lifts a freeze only on an account whose status is frozen. Closing is the worker's own
    decision, registered as a request and confirmed by the worker: A worker-confirmed closure applies only to an
    account whose status is open. The balance is paid out to the linked card within closure_payout_business_days
    business days. When the linked card account closes, the savings account is closed with it under the same rules
    because card_required is true. The worker may change the round-up multiplier up to round_up_max_multiplier,
    the auto-save percentage up to auto_save_max_percent_of_payroll, and a goal up to goal_amount_max_usd at any
    time while the account is not closed.
  eligibility:
  - id: unfreeze_from_frozen
    applies_to:
    - save_unfreeze
    kind: state
    condition: The desk lifts a freeze only on an account whose status is frozen.
    evidence_fields:
    - save_accounts.status
    - save_accounts.save_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - save_accounts.save_account_id
      action_bindings:
        save_accounts.save_account_id: save_account_id
    state_contract:
      field: save_accounts.status
      allowed:
      - frozen
  - id: close_from_open
    applies_to:
    - save_close
    kind: state
    condition: A worker-confirmed closure applies only to an account whose status is open.
    evidence_fields:
    - save_accounts.status
    - save_accounts.save_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - save_accounts.save_account_id
      action_bindings:
        save_accounts.save_account_id: save_account_id
    state_contract:
      field: save_accounts.status
      allowed:
      - open
