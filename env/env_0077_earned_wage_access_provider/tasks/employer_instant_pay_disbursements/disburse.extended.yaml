- id: disburse_evt_fee_credits
  subject:
  - disburse_fee_credit
  rule: >-
    The per-disbursement fee of an instant external payout whose delivery_minutes exceed instant_external_delivery_sla_minutes
    is credited with reason late_delivery when late_delivery_fee_credit is true, without a request. A fee debited
    in error is credited in full with reason fee_charged_in_error. A correct fee may be credited as a courtesy only
    while disburse_msr_courtesy_credits_365d is below courtesy_fee_credits_per_12_months. A fee is credited only
    when the credit is raised within fee_credit_request_window_days calendar days of the fee's entry date. Calendar
    days are counted from the day after the fee's entry_date, so the last day to ask is the entry_date plus the
    window. Late-delivery credits are raised on delivery and fall inside that window; a fee not questioned within
    it is deemed accepted and is not credited for any reason. A fee is credited at most once. A credit always returns
    the whole fee and points to it.
  eligibility:
  - id: credit_window
    applies_to:
    - disburse_fee_credit
    kind: time
    condition: A fee is credited only when the credit is raised within fee_credit_request_window_days calendar days
      of the fee's entry date.
    evidence_fields:
    - disburse_ledger.entry_date
    - disburse_ledger.disburse_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_ledger.disburse_entry_id
      action_bindings:
        disburse_ledger.disburse_entry_id: related_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the fee's entry date
      anchor_source: disburse_ledger.entry_date
      relation: not_after
      duration_source: variants.fee_credit_request_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the fee's entry_date, so the last day to ask is
        the entry_date plus the window.
      boundary: inclusive
  - id: one_credit
    applies_to:
    - disburse_fee_credit
    kind: dedup
    condition: A fee is credited at most once.
    evidence_fields:
    - disburse_ledger.related_entry_id
    - disburse_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_ledger.related_entry_id
      action_bindings:
        disburse_ledger.related_entry_id: related_entry_id
    dedup_contract:
      table: disburse_ledger
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - disburse_fee_credit
      distinct_fields: []
  params:
    per_tier:
      Paystride Instant Pay Starter:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Instant Pay Core:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Instant Pay Growth:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Instant Pay Pro:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Instant Pay Scale:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
      Paystride Instant Pay Enterprise:
        courtesy_fee_credits_per_12_months: =courtesy_fee_credits_per_12_months
  measures:
  - disburse_msr_courtesy_credits_365d
- id: disburse_volume_review
  subject:
  - disburse_tier_change
  rule: >-
    The tier follows the employer's sustained volume, not its request. A volume review moves only a service whose
    status is active. When the payout counts of volume_review_consecutive_months consecutive complete months (disburse_msr_monthly_counts)
    all fall in another tier's entry_gate band, the service moves to the tier whose band contains the latest month's
    count on the first day of the following month, up or down; a single unusual month moves nothing. Fees already
    debited are never re-rated.
  eligibility:
  - id: review_active
    applies_to:
    - disburse_tier_change
    kind: state
    condition: A volume review moves only a service whose status is active.
    evidence_fields:
    - disburse_services.status
    - disburse_services.disburse_service_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_services.disburse_service_id
      action_bindings:
        disburse_services.disburse_service_id: disburse_service_id
    state_contract:
      field: disburse_services.status
      allowed:
      - active
  params:
    per_tier:
      Paystride Instant Pay Starter:
        volume_review_consecutive_months: =volume_review_consecutive_months
      Paystride Instant Pay Core:
        volume_review_consecutive_months: =volume_review_consecutive_months
      Paystride Instant Pay Growth:
        volume_review_consecutive_months: =volume_review_consecutive_months
      Paystride Instant Pay Pro:
        volume_review_consecutive_months: =volume_review_consecutive_months
      Paystride Instant Pay Scale:
        volume_review_consecutive_months: =volume_review_consecutive_months
      Paystride Instant Pay Enterprise:
        volume_review_consecutive_months: =volume_review_consecutive_months
  measures:
  - disburse_msr_monthly_counts
- id: disburse_lifecycle
  subject:
  - disburse_activate
  - disburse_suspend
  - disburse_reinstate
  - disburse_close
  - disburse_settings_update
  rule: >-
    The service activates when business verification completes and the first deposit is available. The desk suspends
    only a service whose status is active. The desk suspends an active service when returned deposits reach the
    limit under disburse_evt_prefund, and reinstates it once every returned deposit and its fee are made good by
    cleared funds. Closing the service is the employer's own decision: the desk registers a closure request, the
    employer confirms it, payouts stop, and the remaining balance is returned under disburse_evt_prefund; an early
    closure fee applies under disburse_evt_fees. A closure or recall is accepted only from a requester whose role
    is listed in authorized_requester_roles. The employer may change its funding method, auto replenishment or alert
    level at any time while the service is not closed; auto replenishment can be turned on only on tiers with auto_replenish_allowed.
  eligibility:
  - id: suspend_from_active
    applies_to:
    - disburse_suspend
    kind: state
    condition: The desk suspends only a service whose status is active.
    evidence_fields:
    - disburse_services.status
    - disburse_services.disburse_service_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_services.disburse_service_id
      action_bindings:
        disburse_services.disburse_service_id: disburse_service_id
    state_contract:
      field: disburse_services.status
      allowed:
      - active
  - id: close_role
    applies_to:
    - disburse_close
    kind: authorization
    condition: A closure or recall is accepted only from a requester whose role is listed in authorized_requester_roles.
    evidence_fields:
    - disburse_requests.requester_role
    - disburse_requests.disburse_request_id
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - disburse_requests.disburse_request_id
      action_bindings:
        disburse_requests.disburse_request_id: disburse_request_id
  params:
    per_tier:
      Paystride Instant Pay Starter:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
      Paystride Instant Pay Core:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
      Paystride Instant Pay Growth:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
      Paystride Instant Pay Pro:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
      Paystride Instant Pay Scale:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
      Paystride Instant Pay Enterprise:
        minimum_term_months: =minimum_term_months
        early_closure_fee_usd: =early_closure_fee_usd
extended_policies:
- id: disburse_ext_closing_month_fee
  base_policy_refs:
  - disburse_evt_fees
  - disburse_ewa_bundle
  overwrite:
  - base_policy: disburse_evt_fees
    superseded_clause: On the fee_debit_business_day business day of each month the previous month's monthly_platform_fee_usd is debited, reduced under disburse_ewa_bundle when that applies.
    replaced_by: For the month in which a service closes, and only for that month, the platform fee is debited on the day the closure is taken and is worked out as set out here; the platform fee of every billing month that ended before the closing month is not set here, and is debited on the fee_debit_business_day business day of the following month under the rule for completed billing months.
  - base_policy: disburse_ewa_bundle
    superseded_clause: for a billing month in which disburse_msr_ewa_full_month is true the platform fee is reduced by ewa_bundle_platform_fee_discount_percent, rounded to the nearest cent.
    replaced_by: An employer whose Earned Wage Access Program Agreement is live and went live on or before the first day of the closing month earns its tier's ewa_bundle_platform_fee_discount_percent as a percentage on the closing-month fee, one whose live agreement went live after the first day of the closing month earns that percentage divided by partial_bundle_divisor, and an employer with no live agreement earns no bundle percentage. These bundle percentages apply to the closing-month fee only, which is rounded half up to the cent; the platform fee of a completed billing month is reduced under the rule for completed billing months.
  - base_policy: disburse_ewa_bundle
    superseded_clause: holding a Payroll Card Program earns no discount here.
    replaced_by: An employer moving its payees to a Paystride Payroll Card Program, shown by a program in contracted status signed fewer than migration_window_months whole months before the closing date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's, earns migration_contracted_percent percent on the closing-month fee, an employer whose Payroll Card Program is live earns migration_live_percent percent, and any other employer earns no migration percentage. This migration percentage applies to the closing-month fee only; on the platform fee of a completed billing month, holding a Payroll Card Program earns no discount.
  trigger: on_request
  subject:
  - disburse_fee
  computes: amount
  target_tool: book_closing_month_fee_4be79540
  params:
    first_third_days: 10
    second_third_days: 20
    idle_multiplier: 0.25
    light_use_multiplier: 0.5
    light_use_payouts: 5
    partial_bundle_divisor: 2
    migration_window_months: 3
    migration_contracted_percent: 20
    migration_live_percent: 10
  rule: 'This policy settles the platform fee for the month in which an Instant Pay Disbursement service closes, a month that no later fee debit day can reach because the service is closed by then. For the month in which a service closes, and only for that month, the platform fee is debited on the day the closure is taken and is worked out as set out here; the platform fee of every billing month that ended before the closing month is not set here, and is debited on the fee_debit_business_day business day of the following month under the rule for completed billing months. The platform fee for the closing month is the monthly_platform_fee_usd of the tier the service holds on the closing date, billed for the whole month and booked as one platform fee entry for that billing month that points to no source entry, rounded half up to the cent. The closing-month fee is that monthly_platform_fee_usd multiplied by every multiplier that applies below, and then reduced once by the sum of every percentage that applies below, the percentages being added together into one rate rather than applied one after another; the result is rounded half up to the cent once, at the end, and a fee that comes to zero is not debited. The billed part of the closing month is a multiplier counted in thirds of the month from an anchor that depends on when the service was activated. For a service activated during the closing month the part is counted from its activation date: a closure no more than first_third_days calendar days after the activation date, counting the closing date but not the activation date, has a billed-part multiplier of one third, a closure no more than second_third_days days after it has a multiplier of two thirds, and a later closure has a multiplier of one. For a service activated in an earlier month whose closure falls on or before day second_third_days of the closing month the part is counted from the first day of the month: a closure on day first_third_days or earlier has a billed-part multiplier of one third, and a later closure up to day second_third_days has a multiplier of two thirds. Any other closure has a billed-part multiplier of one. A service that sent no payout in the month ending on the closing date, a month that takes in every payout dated fewer than one whole month before the closing date, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, has an activity multiplier of idle_multiplier, one that sent fewer than light_use_payouts payouts in that month has an activity multiplier of light_use_multiplier, and any other service has an activity multiplier of one. An employer whose Earned Wage Access Program Agreement is live and went live on or before the first day of the closing month earns its tier''s ewa_bundle_platform_fee_discount_percent as a percentage on the closing-month fee, one whose live agreement went live after the first day of the closing month earns that percentage divided by partial_bundle_divisor, and an employer with no live agreement earns no bundle percentage. These bundle percentages apply to the closing-month fee only, which is rounded half up to the cent; the platform fee of a completed billing month is reduced under the rule for completed billing months. An employer moving its payees to a Paystride Payroll Card Program, shown by a program in contracted status signed fewer than migration_window_months whole months before the closing date, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, earns migration_contracted_percent percent on the closing-month fee, an employer whose Payroll Card Program is live earns migration_live_percent percent, and any other employer earns no migration percentage. This migration percentage applies to the closing-month fee only; on the platform fee of a completed billing month, holding a Payroll Card Program earns no discount.'
  prerequisite: []
  cross_category:
  - category: program
    as: branch
    reads:
    - status
    - go_live_date
    note: the bundle percentage is decided from the employer's live Earned Wage Access Program Agreement and its go_live_date
  - category: paycard
    as: branch
    reads:
    - status
    - signed_date
    note: the migration percentage is decided from the employer's Payroll Card Program status and signed_date
  compute:
  - month_index: MONTHS('2000-01-01', NOW)
  - activated_in_closing_month: MONTHS('2000-01-01', F('activated_date')) == month_index
  - days_since_activation: DAYS(F('activated_date'), NOW)
  - closing_day_after_first_third: MONTHS('2000-01-11', NOW) == month_index
  - closing_day_after_second_third: MONTHS('2000-01-21', NOW) == month_index
  - billed_part: ((1 / 3) if days_since_activation <= K('first_third_days') else ((2 / 3) if days_since_activation <= K('second_third_days') else 1)) if activated_in_closing_month else (((2 / 3) if closing_day_after_first_third else (1 / 3)) if not closing_day_after_second_third else 1)
  - payouts_last_month: COUNT('disburse_ledger', within_months=1, date_field='entry_date', event_type='disburse_payout')
  - activity_multiplier: K('idle_multiplier') if payouts_last_month == 0 else (K('light_use_multiplier') if payouts_last_month < K('light_use_payouts') else 1)
  - ewa_go_live_date: CFIELD('program', 'go_live_date', status='live')
  - bundle_percent: P('ewa_bundle_platform_fee_discount_percent') if (ewa_go_live_date != None and (MONTHS('2000-01-01', ewa_go_live_date) < month_index or MONTHS('2000-01-02', ewa_go_live_date) < MONTHS('2000-01-01', ewa_go_live_date))) else ((P('ewa_bundle_platform_fee_discount_percent') / K('partial_bundle_divisor')) if ewa_go_live_date != None else 0)
  - paycard_signed_date: CFIELD('paycard', 'signed_date', status='contracted')
  - migration_percent: K('migration_contracted_percent') if (paycard_signed_date != None and MONTHS(paycard_signed_date, NOW) < K('migration_window_months')) else (K('migration_live_percent') if EXISTS('paycard', status='live') else 0)
  - result: RND(P('monthly_platform_fee_usd') * billed_part * activity_multiplier * (1 - (bundle_percent + migration_percent) / 100) + 0.000000001, 2)
  compute_basis:
    month_index: 'For a service activated in an earlier month whose closure falls on or before day second_third_days of the closing month the part is counted from the first day of the month: a closure on day first_third_days or earlier has a billed-part multiplier of one third, and a later closure up to day second_third_days has a multiplier of two thirds.'
    activated_in_closing_month: 'For a service activated during the closing month the part is counted from its activation date: a closure no more than first_third_days calendar days after the activation date, counting the closing date but not the activation date, has a billed-part multiplier of one third, a closure no more than second_third_days days after it has a multiplier of two thirds, and a later closure has a multiplier of one.'
    days_since_activation: 'For a service activated during the closing month the part is counted from its activation date: a closure no more than first_third_days calendar days after the activation date, counting the closing date but not the activation date, has a billed-part multiplier of one third, a closure no more than second_third_days days after it has a multiplier of two thirds, and a later closure has a multiplier of one.'
    closing_day_after_first_third: 'For a service activated in an earlier month whose closure falls on or before day second_third_days of the closing month the part is counted from the first day of the month: a closure on day first_third_days or earlier has a billed-part multiplier of one third, and a later closure up to day second_third_days has a multiplier of two thirds.'
    closing_day_after_second_third: 'For a service activated in an earlier month whose closure falls on or before day second_third_days of the closing month the part is counted from the first day of the month: a closure on day first_third_days or earlier has a billed-part multiplier of one third, and a later closure up to day second_third_days has a multiplier of two thirds.'
    billed_part: 'The billed part of the closing month is a multiplier counted in thirds of the month from an anchor that depends on when the service was activated. For a service activated during the closing month the part is counted from its activation date: a closure no more than first_third_days calendar days after the activation date, counting the closing date but not the activation date, has a billed-part multiplier of one third, a closure no more than second_third_days days after it has a multiplier of two thirds, and a later closure has a multiplier of one. For a service activated in an earlier month whose closure falls on or before day second_third_days of the closing month the part is counted from the first day of the month: a closure on day first_third_days or earlier has a billed-part multiplier of one third, and a later closure up to day second_third_days has a multiplier of two thirds. Any other closure has a billed-part multiplier of one.'
    payouts_last_month: A service that sent no payout in the month ending on the closing date, a month that takes in every payout dated fewer than one whole month before the closing date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's, has an activity multiplier of idle_multiplier, one that sent fewer than light_use_payouts payouts in that month has an activity multiplier of light_use_multiplier, and any other service has an activity multiplier of one.
    activity_multiplier: A service that sent no payout in the month ending on the closing date, a month that takes in every payout dated fewer than one whole month before the closing date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's, has an activity multiplier of idle_multiplier, one that sent fewer than light_use_payouts payouts in that month has an activity multiplier of light_use_multiplier, and any other service has an activity multiplier of one.
    ewa_go_live_date: An employer whose Earned Wage Access Program Agreement is live and went live on or before the first day of the closing month earns its tier's ewa_bundle_platform_fee_discount_percent as a percentage on the closing-month fee, one whose live agreement went live after the first day of the closing month earns that percentage divided by partial_bundle_divisor, and an employer with no live agreement earns no bundle percentage.
    bundle_percent: An employer whose Earned Wage Access Program Agreement is live and went live on or before the first day of the closing month earns its tier's ewa_bundle_platform_fee_discount_percent as a percentage on the closing-month fee, one whose live agreement went live after the first day of the closing month earns that percentage divided by partial_bundle_divisor, and an employer with no live agreement earns no bundle percentage.
    paycard_signed_date: An employer moving its payees to a Paystride Payroll Card Program, shown by a program in contracted status signed fewer than migration_window_months whole months before the closing date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's, earns migration_contracted_percent percent on the closing-month fee, an employer whose Payroll Card Program is live earns migration_live_percent percent, and any other employer earns no migration percentage.
    migration_percent: An employer moving its payees to a Paystride Payroll Card Program, shown by a program in contracted status signed fewer than migration_window_months whole months before the closing date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's, earns migration_contracted_percent percent on the closing-month fee, an employer whose Payroll Card Program is live earns migration_live_percent percent, and any other employer earns no migration percentage.
    result: The platform fee for the closing month is the monthly_platform_fee_usd of the tier the service holds on the closing date, billed for the whole month and booked as one platform fee entry for that billing month that points to no source entry, rounded half up to the cent. The closing-month fee is that monthly_platform_fee_usd multiplied by every multiplier that applies below, and then reduced once by the sum of every percentage that applies below, the percentages being added together into one rate rather than applied one after another; the result is rounded half up to the cent once, at the end, and a fee that comes to zero is not debited.
  factors:
  - id: cm_share
    effect: method
    decides: billed_part
    bindings:
    - activated_in_closing_month
    - days_since_activation
    - closing_day_after_first_third
    - closing_day_after_second_third
    - billed_part
    ladder:
    - when: the service was activated during the closing month
      method: 'the billed part is counted from the activation date: one third for a closure no more than first_third_days days after activation, two thirds for one no more than second_third_days days after it, the whole month for a later closure'
    - when: the service was activated in an earlier month and the closure falls on or before day second_third_days of the closing month
      method: 'the billed part is counted from the first day of the month: one third for a closure on day first_third_days or earlier, two thirds for a later closure up to day second_third_days'
    - when: otherwise
      method: the whole month is billed
    baseline:
      billed_part: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: cm_activity
    effect: parameter
    decides: activity_multiplier
    bindings:
    - payouts_last_month
    - activity_multiplier
    ladder:
    - when: no payout was sent in the month ending on the closing date
      value: K('idle_multiplier')
    - when: at least one but fewer than light_use_payouts payouts were sent in that month
      value: K('light_use_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      activity_multiplier: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: cm_bundle
    effect: parameter
    decides: bundle_percent
    bindings:
    - ewa_go_live_date
    - bundle_percent
    ladder:
