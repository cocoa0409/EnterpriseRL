- id: disburse_ext_platform_fee
  base_policy_refs:
  - disburse_evt_fees
  - disburse_ewa_bundle
  overwrite:
  - base_policy: disburse_evt_fees
    superseded_clause: On the fee_debit_business_day business day of each month the previous month's monthly_platform_fee_usd is debited, reduced under disburse_ewa_bundle when that applies.
    replaced_by: For a billing month that ended while the service was open, the platform fee is debited on the fee_debit_business_day business day of the following month and is worked out as set out here; the platform fee of the month in which a service closes is not set here, and is debited on the day the closure is taken under the rule for the closing month.
  - base_policy: disburse_ewa_bundle
    superseded_clause: for a billing month in which disburse_msr_ewa_full_month is true the platform fee is reduced by ewa_bundle_platform_fee_discount_percent, rounded to the nearest cent.
    replaced_by: 'The Earned Wage Access bundle percentage depends on when the employer''s agreement went live: an employer whose agreement is live and went live on or before the first day of the billing month earns its tier''s ewa_bundle_platform_fee_discount_percent, one whose live agreement went live after the first day of the billing month earns that percentage scaled by the part of the month left after go-live, two thirds for a go-live on or before day first_third_days, one third for a go-live after day first_third_days but no later than day second_third_days and nothing for a later go-live, and an employer with no live agreement, or one that went live after the billing month, earns no bundle percentage. This bundle percentage applies to the platform fee of a completed billing month only, which is rounded half up to the cent; the closing month of a service is reduced under the rule for the closing month.'
  - base_policy: disburse_evt_fees
    superseded_clause: Fees are debited from the prefund balance under the tier held on the day they are incurred.
    replaced_by: The platform fee of a completed billing month is billed under the tier the service holds on its fee debit day, and only that fee; every other fee, the platform fee of the month in which a service closes included, is debited from the prefund balance under the tier held on the day it is incurred.
  trigger: state_due
  subject:
  - disburse_fee
  computes: amount
  target_tool: debit_platform_fee_9215b300
  params:
    first_third_days: 10
    second_third_days: 20
    size_large_percent: 10
    size_mid_percent: 5
    fee_model_paid_percent: 10
    fee_model_sponsored_percent: 5
  rule: 'This policy settles the platform fee of a completed billing month, the calendar month before the month of the fee debit day. For a billing month that ended while the service was open, the platform fee is debited on the fee_debit_business_day business day of the following month and is worked out as set out here; the platform fee of the month in which a service closes is not set here, and is debited on the day the closure is taken under the rule for the closing month. The platform fee of a completed billing month is billed under the tier the service holds on its fee debit day, and only that fee; every other fee, the platform fee of the month in which a service closes included, is debited from the prefund balance under the tier held on the day it is incurred. The platform fee of a completed billing month is the monthly_platform_fee_usd of the tier the service holds on the fee debit day, billed for the whole month and booked as one platform fee entry for that billing month that points to no source entry, rounded half up to the cent. The fee is that monthly_platform_fee_usd multiplied by every multiplier that applies below, and then reduced once by the sum of every percentage that applies below, the percentages being added together into one rate rather than applied one after another; the result is rounded half up to the cent once, at the end, and a fee that comes to zero is not debited. A service activated during the billing month has a billed-part multiplier of one third when it was activated after day second_third_days of the month and of two thirds when it was activated after day first_third_days but no later than day second_third_days; any other service has a billed-part multiplier of one. The Earned Wage Access bundle percentage depends on when the employer''s agreement went live: an employer whose agreement is live and went live on or before the first day of the billing month earns its tier''s ewa_bundle_platform_fee_discount_percent, one whose live agreement went live after the first day of the billing month earns that percentage scaled by the part of the month left after go-live, two thirds for a go-live on or before day first_third_days, one third for a go-live after day first_third_days but no later than day second_third_days and nothing for a later go-live, and an employer with no live agreement, or one that went live after the billing month, earns no bundle percentage. This bundle percentage applies to the platform fee of a completed billing month only, which is rounded half up to the cent; the closing month of a service is reduced under the rule for the closing month. An employer whose live agreement is on the Paystride Program Enterprise, Paystride Program Enterprise Plus or Paystride Program Strategic tier earns size_large_percent percent, one whose live agreement is on the Paystride Program Professional tier earns size_mid_percent percent, and any other employer earns no program-size percentage. An employer whose live agreement is on the employer_paid fee model earns fee_model_paid_percent percent, one on the employer_sponsored fee model earns fee_model_sponsored_percent percent, and any other employer earns no fee-model percentage.'
  prerequisite: []
  cross_category:
  - category: program
    as: branch
    reads:
    - status
    - go_live_date
    - variant_name
    - fee_model
    note: the bundle, program-size and fee-model percentages are decided from the employer's live Earned Wage Access Program Agreement
  compute:
  - billing_month_index: MONTHS('2000-01-01', NOW) - 1
  - activation_index: MONTHS('2000-01-01', F('activated_date'))
  - activated_after_first_third: MONTHS('2000-01-11', F('activated_date')) == activation_index
  - activated_after_second_third: MONTHS('2000-01-21', F('activated_date')) == activation_index
  - billed_part: ((1 / 3) if activated_after_second_third else ((2 / 3) if activated_after_first_third else 1)) if activation_index == billing_month_index else 1
  - ewa_go_live_date: CFIELD('program', 'go_live_date', status='live')
  - go_live_index: MONTHS('2000-01-01', ewa_go_live_date) if ewa_go_live_date != None else 0
  - bundle_percent: P('ewa_bundle_platform_fee_discount_percent') if (ewa_go_live_date != None and (go_live_index < billing_month_index or (go_live_index == billing_month_index and MONTHS('2000-01-02', ewa_go_live_date) < go_live_index))) else ((P('ewa_bundle_platform_fee_discount_percent') * ((2 / 3) if MONTHS('2000-01-11', ewa_go_live_date) < go_live_index else ((1 / 3) if MONTHS('2000-01-21', ewa_go_live_date) < go_live_index else 0))) if (ewa_go_live_date != None and go_live_index == billing_month_index) else 0)
  - ewa_tier: CFIELD('program', 'variant_name', status='live')
  - size_percent: K('size_large_percent') if (ewa_tier == 'Paystride Program Enterprise' or ewa_tier == 'Paystride Program Enterprise Plus' or ewa_tier == 'Paystride Program Strategic') else (K('size_mid_percent') if ewa_tier == 'Paystride Program Professional' else 0)
  - ewa_fee_model: CFIELD('program', 'fee_model', status='live')
  - fee_model_percent: K('fee_model_paid_percent') if ewa_fee_model == 'employer_paid' else (K('fee_model_sponsored_percent') if ewa_fee_model == 'employer_sponsored' else 0)
  - result: RND(P('monthly_platform_fee_usd') * billed_part * (1 - (bundle_percent + size_percent + fee_model_percent) / 100) + 0.000000001, 2)
  compute_basis:
    billing_month_index: This policy settles the platform fee of a completed billing month, the calendar month before the month of the fee debit day.
    activation_index: A service activated during the billing month has a billed-part multiplier of one third when it was activated after day second_third_days of the month and of two thirds when it was activated after day first_third_days but no later than day second_third_days; any other service has a billed-part multiplier of one.
    activated_after_first_third: A service activated during the billing month has a billed-part multiplier of one third when it was activated after day second_third_days of the month and of two thirds when it was activated after day first_third_days but no later than day second_third_days; any other service has a billed-part multiplier of one.
    activated_after_second_third: A service activated during the billing month has a billed-part multiplier of one third when it was activated after day second_third_days of the month and of two thirds when it was activated after day first_third_days but no later than day second_third_days; any other service has a billed-part multiplier of one.
    billed_part: A service activated during the billing month has a billed-part multiplier of one third when it was activated after day second_third_days of the month and of two thirds when it was activated after day first_third_days but no later than day second_third_days; any other service has a billed-part multiplier of one.
    ewa_go_live_date: 'The Earned Wage Access bundle percentage depends on when the employer''s agreement went live: an employer whose agreement is live and went live on or before the first day of the billing month earns its tier''s ewa_bundle_platform_fee_discount_percent, one whose live agreement went live after the first day of the billing month earns that percentage scaled by the part of the month left after go-live, two thirds for a go-live on or before day first_third_days, one third for a go-live after day first_third_days but no later than day second_third_days and nothing for a later go-live, and an employer with no live agreement, or one that went live after the billing month, earns no bundle percentage.'
    go_live_index: 'The Earned Wage Access bundle percentage depends on when the employer''s agreement went live: an employer whose agreement is live and went live on or before the first day of the billing month earns its tier''s ewa_bundle_platform_fee_discount_percent, one whose live agreement went live after the first day of the billing month earns that percentage scaled by the part of the month left after go-live, two thirds for a go-live on or before day first_third_days, one third for a go-live after day first_third_days but no later than day second_third_days and nothing for a later go-live, and an employer with no live agreement, or one that went live after the billing month, earns no bundle percentage.'
    bundle_percent: 'The Earned Wage Access bundle percentage depends on when the employer''s agreement went live: an employer whose agreement is live and went live on or before the first day of the billing month earns its tier''s ewa_bundle_platform_fee_discount_percent, one whose live agreement went live after the first day of the billing month earns that percentage scaled by the part of the month left after go-live, two thirds for a go-live on or before day first_third_days, one third for a go-live after day first_third_days but no later than day second_third_days and nothing for a later go-live, and an employer with no live agreement, or one that went live after the billing month, earns no bundle percentage.'
    ewa_tier: An employer whose live agreement is on the Paystride Program Enterprise, Paystride Program Enterprise Plus or Paystride Program Strategic tier earns size_large_percent percent, one whose live agreement is on the Paystride Program Professional tier earns size_mid_percent percent, and any other employer earns no program-size percentage.
    size_percent: An employer whose live agreement is on the Paystride Program Enterprise, Paystride Program Enterprise Plus or Paystride Program Strategic tier earns size_large_percent percent, one whose live agreement is on the Paystride Program Professional tier earns size_mid_percent percent, and any other employer earns no program-size percentage.
    ewa_fee_model: An employer whose live agreement is on the employer_paid fee model earns fee_model_paid_percent percent, one on the employer_sponsored fee model earns fee_model_sponsored_percent percent, and any other employer earns no fee-model percentage.
    fee_model_percent: An employer whose live agreement is on the employer_paid fee model earns fee_model_paid_percent percent, one on the employer_sponsored fee model earns fee_model_sponsored_percent percent, and any other employer earns no fee-model percentage.
    result: The platform fee of a completed billing month is the monthly_platform_fee_usd of the tier the service holds on the fee debit day, billed for the whole month and booked as one platform fee entry for that billing month that points to no source entry, rounded half up to the cent. The fee is that monthly_platform_fee_usd multiplied by every multiplier that applies below, and then reduced once by the sum of every percentage that applies below, the percentages being added together into one rate rather than applied one after another; the result is rounded half up to the cent once, at the end, and a fee that comes to zero is not debited.
  factors:
  - id: pf_activation
    effect: parameter
    decides: billed_part
    bindings:
    - activation_index
    - activated_after_first_third
    - activated_after_second_third
    - billed_part
    ladder:
    - when: the service was activated during the billing month after day second_third_days
      value: 1 / 3
    - when: the service was activated during the billing month after day first_third_days but no later than day second_third_days
      value: 2 / 3
    - when: otherwise
      value: '1'
    baseline:
      billed_part: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: pf_bundle
    effect: method
    decides: bundle_percent
    bindings:
    - ewa_go_live_date
    - go_live_index
    - bundle_percent
    ladder:
    - when: the employer's Earned Wage Access Program Agreement is live and went live on or before the first day of the billing month
      method: the tier's ewa_bundle_platform_fee_discount_percent applies in full
    - when: the live agreement went live after the first day of the billing month
      method: 'the percentage is scaled by the part of the month left after go-live: two thirds for a go-live on or before day first_third_days, one third up to day second_third_days, nothing later'
    - when: otherwise
      method: no bundle percentage
    baseline:
      bundle_percent: '0'
    evidence:
    - cross_category
    - date
    - tier_param
    cross_difficulty: program
  - id: pf_size
    effect: parameter
    decides: size_percent
    bindings:
    - ewa_tier
    - size_percent
    ladder:
    - when: the live agreement is on the Paystride Program Enterprise, Enterprise Plus or Strategic tier
      value: K('size_large_percent')
    - when: the live agreement is on the Paystride Program Professional tier
      value: K('size_mid_percent')
    - when: otherwise
      value: '0'
    baseline:
      size_percent: '0'
    evidence:
    - cross_category
    cross_difficulty: program
  - id: pf_fee_model
    effect: parameter
    decides: fee_model_percent
    bindings:
    - ewa_fee_model
    - fee_model_percent
    ladder:
    - when: the live agreement is on the employer_paid fee model
      value: K('fee_model_paid_percent')
    - when: the live agreement is on the employer_sponsored fee model
      value: K('fee_model_sponsored_percent')
    - when: otherwise
      value: '0'
    baseline:
      fee_model_percent: '0'
    evidence:
    - cross_category
    cross_difficulty: program
  baseline:
    rule: The platform fee of a completed billing month is the monthly_platform_fee_usd of the tier the service holds on the fee debit day, billed for the whole month and booked as one platform fee entry for that billing month that points to no source entry, rounded half up to the cent.
    params:
    - monthly_platform_fee_usd
  inputs:
    history: []
    cross_category:
