- id: disburse_ext_alert_election
  base_policy_refs:
  - disburse_lifecycle
  overwrite:
  - base_policy: disburse_lifecycle
    superseded_clause: The employer may change its funding method, auto replenishment or alert level at any time while the service is not closed; auto replenishment can be turned on only on tiers with auto_replenish_allowed.
    replaced_by: The employer may change its funding method, auto replenishment or alert level at any time while the service is not closed, and auto replenishment can be turned on only on tiers with auto_replenish_allowed; on a service with automatic replenishment on, an alert level is recorded only at or above the replenishment floor.
  trigger: on_request
  subject:
  - disburse_settings_update
  computes: low_balance_alert_usd
  target_tool: confirm_alert_level_1c610295
  params:
    floor_rounding_usd: 50
    weeks_per_month: 4
    instant_heavy_percent: 20
    instant_some_percent: 10
    age_new_months: 2
    age_young_months: 6
    age_new_percent: 10
    age_young_percent: 5
    returns_many: 2
    returns_window_months: 12
    returns_many_percent: 30
    returns_one_percent: 15
    final_pay_many: 2
    final_pay_window_months: 3
    final_pay_many_percent: 10
    final_pay_one_percent: 5
    groups_many: 3
    groups_many_percent: 15
    groups_two_percent: 5
  rule: 'This policy settles the replenishment floor, the lowest alert level Paystride accepts on a service with automatic replenishment on. The employer may change its funding method, auto replenishment or alert level at any time while the service is not closed, and auto replenishment can be turned on only on tiers with auto_replenish_allowed; on a service with automatic replenishment on, an alert level is recorded only at or above the replenishment floor. Because the alert level of a service with automatic replenishment decides when Paystride debits the employer''s bank account, setting it is the employer''s own election: the desk works out the replenishment floor, the authorized employer contact confirms it in person, and that confirmation records the floor as the alert level on file while automatic replenishment stays on. The replenishment floor is the tier''s low_balance_alert_default_usd, rounded up to the nearest multiple of floor_rounding_usd that is not below it, so an amount that already is such a multiple is kept. The floor is that base amount raised once by the sum of every percentage that applies below, the percentages being added together into one rate rather than applied one after another, and then rounded up to the nearest multiple of floor_rounding_usd that is not below it, an amount that already is such a multiple being kept. The base amount depends on the service''s payouts: for a service that sent payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, it is the greater of low_balance_alert_default_usd and that month''s payout total divided by weeks_per_month; for a service that sent no payout in that month but has earlier payouts, it is the greater of low_balance_alert_default_usd and its largest single payout; for any other service it is low_balance_alert_default_usd. A service more than half of whose payouts in the month ending today went to external debit cards, which are paid instantly on every day of the week, adds instant_heavy_percent percent, one with at least one such payout in that month adds instant_some_percent percent, and any other service adds nothing for instant payouts. A service activated fewer than age_new_months whole months before today adds age_new_percent percent, one activated fewer than age_young_months whole months before today adds age_young_percent percent, and any other service adds nothing for its age, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s. A service with returns_many or more returned deposits in the returns_window_months months ending today, a window that takes in every entry dated fewer than returns_window_months whole months before today, adds returns_many_percent percent, one with a single returned deposit in that window adds returns_one_percent percent, and any other service adds nothing for returned deposits. A service that sent final_pay_many or more final pay payouts in the final_pay_window_months months ending today, a window that takes in every payout dated fewer than final_pay_window_months whole months before today, adds final_pay_many_percent percent, one that sent a single final pay payout in that window adds final_pay_one_percent percent, and any other service adds nothing for final pay. An employer whose live Earned Wage Access Program Agreement runs groups_many or more payroll groups adds groups_many_percent percent, one whose live agreement runs two payroll groups adds groups_two_percent percent, and any other employer adds nothing for payroll groups.'
  prerequisite: []
  cross_category:
  - category: program
    as: branch
    reads:
    - status
    - payroll_group_count
    note: the payroll-group percentage is decided from the employer's live Earned Wage Access Program Agreement
  compute:
  - payouts_month_count: COUNT('disburse_ledger', within_months=1, date_field='entry_date', event_type='disburse_payout')
  - payouts_month_total: SUM('disburse_ledger', 'amount', within_months=1, date_field='entry_date', event_type='disburse_payout')
  - largest_payout: MAX('disburse_ledger', 'amount', event_type='disburse_payout')
  - base_amount: MX(P('low_balance_alert_default_usd'), payouts_month_total / K('weeks_per_month')) if payouts_month_count > 0 else (MX(P('low_balance_alert_default_usd'), largest_payout) if largest_payout > 0 else P('low_balance_alert_default_usd'))
  - instant_month_count: COUNT('disburse_ledger', within_months=1, date_field='entry_date', event_type='disburse_payout', destination_type='external_debit_card')
  - instant_percent: K('instant_heavy_percent') if 2 * instant_month_count > payouts_month_count else (K('instant_some_percent') if instant_month_count > 0 else 0)
  - months_active: MONTHS(F('activated_date'), NOW)
  - age_percent: K('age_new_percent') if months_active < K('age_new_months') else (K('age_young_percent') if months_active < K('age_young_months') else 0)
  - returns_in_window: COUNT('disburse_ledger', within_months=K('returns_window_months'), date_field='entry_date', event_type='disburse_prefund_return')
  - returns_percent: K('returns_many_percent') if returns_in_window >= K('returns_many') else (K('returns_one_percent') if returns_in_window == 1 else 0)
  - final_pays_in_window: COUNT('disburse_ledger', within_months=K('final_pay_window_months'), date_field='entry_date', event_type='disburse_payout', disbursement_type='final_pay')
  - final_pay_percent: K('final_pay_many_percent') if final_pays_in_window >= K('final_pay_many') else (K('final_pay_one_percent') if final_pays_in_window == 1 else 0)
  - ewa_payroll_groups: CFIELD('program', 'payroll_group_count', status='live')
  - groups_percent: K('groups_many_percent') if (ewa_payroll_groups != None and ewa_payroll_groups >= K('groups_many')) else (K('groups_two_percent') if ewa_payroll_groups == 2 else 0)
  - result: -((-(base_amount * (1 + (instant_percent + age_percent + returns_percent + final_pay_percent + groups_percent) / 100)) + 0.000000001) // K('floor_rounding_usd')) * K('floor_rounding_usd')
  compute_basis:
    payouts_month_count: 'The base amount depends on the service''s payouts: for a service that sent payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, it is the greater of low_balance_alert_default_usd and that month''s payout total divided by weeks_per_month; for a service that sent no payout in that month but has earlier payouts, it is the greater of low_balance_alert_default_usd and its largest single payout; for any other service it is low_balance_alert_default_usd.'
    payouts_month_total: 'The base amount depends on the service''s payouts: for a service that sent payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, it is the greater of low_balance_alert_default_usd and that month''s payout total divided by weeks_per_month; for a service that sent no payout in that month but has earlier payouts, it is the greater of low_balance_alert_default_usd and its largest single payout; for any other service it is low_balance_alert_default_usd.'
    largest_payout: 'The base amount depends on the service''s payouts: for a service that sent payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, it is the greater of low_balance_alert_default_usd and that month''s payout total divided by weeks_per_month; for a service that sent no payout in that month but has earlier payouts, it is the greater of low_balance_alert_default_usd and its largest single payout; for any other service it is low_balance_alert_default_usd.'
    base_amount: 'The base amount depends on the service''s payouts: for a service that sent payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, it is the greater of low_balance_alert_default_usd and that month''s payout total divided by weeks_per_month; for a service that sent no payout in that month but has earlier payouts, it is the greater of low_balance_alert_default_usd and its largest single payout; for any other service it is low_balance_alert_default_usd.'
    instant_month_count: A service more than half of whose payouts in the month ending today went to external debit cards, which are paid instantly on every day of the week, adds instant_heavy_percent percent, one with at least one such payout in that month adds instant_some_percent percent, and any other service adds nothing for instant payouts.
    instant_percent: A service more than half of whose payouts in the month ending today went to external debit cards, which are paid instantly on every day of the week, adds instant_heavy_percent percent, one with at least one such payout in that month adds instant_some_percent percent, and any other service adds nothing for instant payouts.
    months_active: A service activated fewer than age_new_months whole months before today adds age_new_percent percent, one activated fewer than age_young_months whole months before today adds age_young_percent percent, and any other service adds nothing for its age, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's.
    age_percent: A service activated fewer than age_new_months whole months before today adds age_new_percent percent, one activated fewer than age_young_months whole months before today adds age_young_percent percent, and any other service adds nothing for its age, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's.
    returns_in_window: A service with returns_many or more returned deposits in the returns_window_months months ending today, a window that takes in every entry dated fewer than returns_window_months whole months before today, adds returns_many_percent percent, one with a single returned deposit in that window adds returns_one_percent percent, and any other service adds nothing for returned deposits.
    returns_percent: A service with returns_many or more returned deposits in the returns_window_months months ending today, a window that takes in every entry dated fewer than returns_window_months whole months before today, adds returns_many_percent percent, one with a single returned deposit in that window adds returns_one_percent percent, and any other service adds nothing for returned deposits.
    final_pays_in_window: A service that sent final_pay_many or more final pay payouts in the final_pay_window_months months ending today, a window that takes in every payout dated fewer than final_pay_window_months whole months before today, adds final_pay_many_percent percent, one that sent a single final pay payout in that window adds final_pay_one_percent percent, and any other service adds nothing for final pay.
    final_pay_percent: A service that sent final_pay_many or more final pay payouts in the final_pay_window_months months ending today, a window that takes in every payout dated fewer than final_pay_window_months whole months before today, adds final_pay_many_percent percent, one that sent a single final pay payout in that window adds final_pay_one_percent percent, and any other service adds nothing for final pay.
    ewa_payroll_groups: An employer whose live Earned Wage Access Program Agreement runs groups_many or more payroll groups adds groups_many_percent percent, one whose live agreement runs two payroll groups adds groups_two_percent percent, and any other employer adds nothing for payroll groups.
    groups_percent: An employer whose live Earned Wage Access Program Agreement runs groups_many or more payroll groups adds groups_many_percent percent, one whose live agreement runs two payroll groups adds groups_two_percent percent, and any other employer adds nothing for payroll groups.
    result: The replenishment floor is the tier's low_balance_alert_default_usd, rounded up to the nearest multiple of floor_rounding_usd that is not below it, so an amount that already is such a multiple is kept. The floor is that base amount raised once by the sum of every percentage that applies below, the percentages being added together into one rate rather than applied one after another, and then rounded up to the nearest multiple of floor_rounding_usd that is not below it, an amount that already is such a multiple being kept.
  factors:
