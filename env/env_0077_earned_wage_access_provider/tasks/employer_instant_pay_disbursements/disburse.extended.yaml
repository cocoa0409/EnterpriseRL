events:
- type: disburse_enroll
  target: disburse_services
  mutation: create
  meaning: An employer enrolls in the Instant Pay Disbursement service; it opens in pending_setup.
  grain: one row per service change
  fields:
    customer_id: the employer holding the service (foreign key -> customers)
    variant_name: the tier held, as the official full tier name
    status: lifecycle state of the service (see the disburse charter lifecycle)
    enrolled_date: date the employer enrolled
    funding_method: how the employer prefunds
    auto_replenish: whether the employer authorized automatic replenishment debits
    low_balance_alert_usd: balance below which the employer is alerted and, with auto_replenish, a replenishment
      debit is made
    prefund_balance: 'prefunded money available to disburse: deposits, returned payouts and fee credits less returned
      deposits, payouts, fees and withdrawals; never negative'
  triggers: []
- type: disburse_activate
  target: disburse_services
  mutation:
    transition:
      from: pending_setup
      to: active
  meaning: Business verification completes and the first deposit is available.
  grain: one row per service change
  fields:
    activated_date: date business verification and the first deposit activated the service; empty until then
  triggers: []
- type: disburse_suspend
  target: disburse_services
  mutation:
    transition:
      from: active
      to: suspended
  meaning: The desk suspends the service for returned deposits.
  grain: one row per service change
  fields:
    status: lifecycle state of the service (see the disburse charter lifecycle)
  triggers: []
- type: disburse_reinstate
  target: disburse_services
  mutation:
    transition:
      from: suspended
      to: active
  meaning: The desk reinstates the service once returned deposits are made good.
  grain: one row per service change
  fields:
    status: lifecycle state of the service (see the disburse charter lifecycle)
  triggers: []
- type: disburse_close
  target: disburse_services
  mutation:
    transition:
      from: active
      to: closed
  meaning: The employer's confirmed closure takes effect and the remaining balance is returned.
  grain: one row per service change
  fields:
    closed_date: date the service closed; empty until closed
  triggers: []
- type: disburse_settings_update
  target: disburse_services
  mutation: update
  meaning: The employer changes its funding method, auto replenishment or alert level.
  grain: one row per service change
  fields:
    funding_method: how the employer prefunds
    auto_replenish: whether the employer authorized automatic replenishment debits
    low_balance_alert_usd: balance below which the employer is alerted and, with auto_replenish, a replenishment
      debit is made
  triggers: []
- type: disburse_tier_change
  target: disburse_services
  mutation: update
  meaning: The service moves to the tier matching its sustained monthly disbursement count.
  grain: one row per service change
  fields:
    variant_name: the tier held, as the official full tier name
  triggers: []
- type: disburse_prefund_deposit
  target: disburse_ledger
  meaning: Money the employer deposits, or an automatic replenishment debit, into the prefund balance.
  grain: one row per deposit
  distinguish_by:
  - entry_date
  - funding_method
  - daily_sequence
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    amount: size of the movement, always greater than zero; deposits, returned payouts and fee credits add to and
      deposit returns, payouts, fees and withdrawals subtract from the prefund balance
    daily_sequence: ordinal of the entry among the service's entries of the same event family booked on the same
      entry_date, starting at 1
    funding_method: method of a deposit or returned deposit; none otherwise
    deposit_source: whether a deposit was sent by the employer or debited automatically; none otherwise
  account: prefund_balance
  direction: in
  triggers: []
- type: disburse_prefund_return
  target: disburse_ledger
  meaning: A deposit returned unpaid by the employer's bank.
  grain: one row per returned deposit
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    amount: size of the movement, always greater than zero; deposits, returned payouts and fee credits add to and
      deposit returns, payouts, fees and withdrawals subtract from the prefund balance
    funding_method: method of a deposit or returned deposit; none otherwise
    related_entry_id: 'the narrowest source: for a fee the payout, deposit or return that incurred it, for a fee
      credit the fee, for a payout return or recall the payout, for a deposit return the deposit; empty otherwise'
  account: prefund_balance
  direction: out
  triggers:
  - event: disburse:disburse_fee
    map:
      fee_type: prefund_return
      related_entry_id: disburse_entry_id
- type: disburse_payout
  target: disburse_ledger
  meaning: One payment of tips or wages pushed to one worker.
  grain: one row per payout
  distinguish_by:
  - entry_date
  - payee_customer_id
  - daily_sequence
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    amount: size of the movement, always greater than zero; deposits, returned payouts and fee credits add to and
      deposit returns, payouts, fees and withdrawals subtract from the prefund balance
    daily_sequence: ordinal of the entry among the service's entries of the same event family booked on the same
      entry_date, starting at 1
    payee_customer_id: on a payout or payout return, the worker paid (foreign key -> customers); empty otherwise
    payee_employee_number: the worker's employee number exactly as on the employer's payroll file; empty on entries
      without a payee
    disbursement_type: kind of pay disbursed; none on other entries
    destination_type: where a payout was sent; none on other entries
    delivery_minutes: minutes from submission to delivery confirmation of an instant payout; empty otherwise
  account: prefund_balance
  direction: out
  triggers:
  - event: card:card_load
    when:
      destination_type: paystride_card
    map:
      amount: amount
      load_source: instant_pay_disbursement
      source_ref_id: disburse_entry_id
- type: disburse_payout_return
  target: disburse_ledger
  meaning: >-
    A payout that the receiving card account or bank refused or sent back, credited to the prefund balance.
  grain: one row per payout returned
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    amount: size of the movement, always greater than zero; deposits, returned payouts and fee credits add to and
      deposit returns, payouts, fees and withdrawals subtract from the prefund balance
    payee_customer_id: on a payout or payout return, the worker paid (foreign key -> customers); empty otherwise
    destination_type: where a payout was sent; none on other entries
    return_reason: why a payout came back; none otherwise
    related_entry_id: 'the narrowest source: for a fee the payout, deposit or return that incurred it, for a fee
      credit the fee, for a payout return or recall the payout, for a deposit return the deposit; empty otherwise'
  account: prefund_balance
  direction: in
  triggers: []
- type: disburse_payout_recall
  target: disburse_ledger
  meaning: >-
    The amount recovered from a worker's Paystride card on the employer's recall of a payout sent in error, credited
    to the prefund balance.
  grain: one row per payout recalled
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    amount: size of the movement, always greater than zero; deposits, returned payouts and fee credits add to and
      deposit returns, payouts, fees and withdrawals subtract from the prefund balance
    payee_customer_id: on a payout or payout return, the worker paid (foreign key -> customers); empty otherwise
    destination_type: where a payout was sent; none on other entries
    return_reason: why a payout came back; none otherwise
    related_entry_id: 'the narrowest source: for a fee the payout, deposit or return that incurred it, for a fee
      credit the fee, for a payout return or recall the payout, for a deposit return the deposit; empty otherwise'
  account: prefund_balance
  direction: in
  triggers: []
- type: disburse_fee
  target: disburse_ledger
  meaning: A service fee debited from the prefund balance.
  grain: one row per fee
  distinguish_by:
  - fee_type
  - related_entry_id
  - billing_month
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    amount: size of the movement, always greater than zero; deposits, returned payouts and fee credits add to and
      deposit returns, payouts, fees and withdrawals subtract from the prefund balance
    fee_type: kind of fee or fee credited; none otherwise
    billing_month: month a monthly fee bills; empty otherwise
    related_entry_id: 'the narrowest source: for a fee the payout, deposit or return that incurred it, for a fee
      credit the fee, for a payout return or recall the payout, for a deposit return the deposit; empty otherwise'
  account: prefund_balance
  direction: out
  triggers: []
- type: disburse_fee_credit
  target: disburse_ledger
  meaning: A credit of one service fee back to the prefund balance.
  grain: one row per fee credited
  distinguish_by:
  - related_entry_id
  - credit_reason
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    amount: size of the movement, always greater than zero; deposits, returned payouts and fee credits add to and
      deposit returns, payouts, fees and withdrawals subtract from the prefund balance
    fee_type: kind of fee or fee credited; none otherwise
    credit_reason: why a fee credit was given; none otherwise
    related_entry_id: 'the narrowest source: for a fee the payout, deposit or return that incurred it, for a fee
      credit the fee, for a payout return or recall the payout, for a deposit return the deposit; empty otherwise'
  account: prefund_balance
  direction: in
  triggers: []
- type: disburse_withdrawal
  target: disburse_ledger
  meaning: Prefund money returned to the employer's bank at its request or on closure.
  grain: one row per withdrawal
  distinguish_by:
  - entry_date
  - daily_sequence
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    amount: size of the movement, always greater than zero; deposits, returned payouts and fee credits add to and
      deposit returns, payouts, fees and withdrawals subtract from the prefund balance
    daily_sequence: ordinal of the entry among the service's entries of the same event family booked on the same
      entry_date, starting at 1
  account: prefund_balance
  direction: out
  triggers: []
measures:
- id: disburse_msr_month_payout_position
  window: the calendar month of the payout
  measure: position of the payout among the service's payouts of the month, in order of entry_date then daily_sequence
- id: disburse_msr_day_total
  window: one Eastern Time calendar day
  measure: sum of amount of the service's payouts booked that day
- id: disburse_msr_payee_day
  window: one Eastern Time calendar day and one payee
  measure: sum of amount and count of payouts to that payee that day
- id: disburse_msr_payee_month_total
  window: one calendar month and one payee
  measure: sum of amount of payouts to that payee in the month
- id: disburse_msr_returned_deposits_90d
  window: the 90 calendar days ending today
  measure: count of disburse_prefund_return entries
- id: disburse_msr_monthly_counts
  window: the service's most recent complete calendar months
  measure: number of payouts in each month, in descending month order
- id: disburse_msr_courtesy_credits_365d
  window: the 365 calendar days ending today
  measure: count of disburse_fee_credit entries with credit_reason courtesy
- id: disburse_msr_ewa_full_month
  window: one billing month
  measure: true when the employer's Earned Wage Access Program Agreement has a go_live_date on or before the first
    day of the month and no closed_date before the month's last day
policies:
- id: disburse_agg_multi_holding
  subject:
  - disburse_enroll
  rule: >-
    An employer holds at most max_per_customer Instant Pay Disbursement service for all of its locations. An employer
    may not hold a second disbursement service that is not closed. A new service opens in pending_setup at the tier
    whose entry_gate band contains the employer's expected monthly disbursement count, with a zero balance, auto_replenish
    false unless the employer authorizes it, and low_balance_alert_usd at low_balance_alert_default_usd unless the
    employer sets another.
  eligibility:
  - id: one_service
    applies_to:
    - disburse_enroll
    kind: dedup
    condition: An employer may not hold a second disbursement service that is not closed.
    evidence_fields:
    - disburse_services.customer_id
    - disburse_services.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_services.customer_id
      action_bindings:
        disburse_services.customer_id: customer_id
    dedup_contract:
      table: disburse_services
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - pending_setup
        - active
        - suspended
      distinct_fields:
      - enrolled_date
  params:
    max_per_customer: 1
- id: disburse_evt_payout
  subject:
  - disburse_payout
  rule: >-
    A payout is sent only while the service status is active. A payout is sent only for a disbursement type listed
    in disbursement_types_allowed for the service's tier. Each payout pays one worker who is on the employer's payroll
    file when payee_must_be_current_worker is true, identified by the worker's profile and employee number. A payout
    is sent only from available prefund money: it may not exceed the prefund balance, ACH deposits count only ach_deposit_availability_business_days
    business days after receipt, and the balance never goes below zero. A payout is at most max_single_disbursement_usd,
    at most push_to_card_max_usd to an external debit card, and at most same_day_ach_max_usd by same-day ACH. The
    day's payouts may not exceed daily_disbursement_limit_usd (disburse_msr_day_total), one worker's payouts may
    not exceed per_payee_daily_limit_usd or max_payouts_per_payee_per_day in a day (disburse_msr_payee_day) or per_payee_monthly_limit_usd
    in a calendar month (disburse_msr_payee_month_total); a payout over any limit is not sent and is never split
    by the desk. Payouts to a Paystride card or external debit card are instant, every day when instant_available_24x7
    is true; payouts to a bank account go by same-day ACH and settle the next business day when requested after
    same_day_ach_cutoff_time_et or on a non-business day. Pay sent this way is the employer's own payroll payment:
    Paystride does not advance it and does not recover it from the worker's wages. daily_sequence is one more than
    the payouts already booked that day.
  eligibility:
  - id: service_active
    applies_to:
    - disburse_payout
    kind: state
    condition: A payout is sent only while the service status is active.
    evidence_fields:
    - disburse_services.status
    - disburse_services.disburse_service_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_services.disburse_service_id
      action_bindings:
        disburse_services.disburse_service_id: disburse_service_id
    state_contract:
      field: disburse_services.status
      allowed:
      - active
  - id: type_allowed
    applies_to:
    - disburse_payout
    kind: authorization
    condition: A payout is sent only for a disbursement type listed in disbursement_types_allowed for the service's
      tier.
    evidence_fields:
    - disburse_ledger.disbursement_type
    - disburse_services.variant_name
    - disburse_services.disburse_service_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_services.disburse_service_id
      action_bindings:
        disburse_services.disburse_service_id: disburse_service_id
  params:
    per_tier:
      Paystride Instant Pay Starter:
        max_single_disbursement_usd: =max_single_disbursement_usd
        per_payee_daily_limit_usd: =per_payee_daily_limit_usd
        disbursement_types_allowed: =disbursement_types_allowed
      Paystride Instant Pay Core:
        max_single_disbursement_usd: =max_single_disbursement_usd
        per_payee_daily_limit_usd: =per_payee_daily_limit_usd
        disbursement_types_allowed: =disbursement_types_allowed
      Paystride Instant Pay Growth:
        max_single_disbursement_usd: =max_single_disbursement_usd
        per_payee_daily_limit_usd: =per_payee_daily_limit_usd
        disbursement_types_allowed: =disbursement_types_allowed
      Paystride Instant Pay Pro:
        max_single_disbursement_usd: =max_single_disbursement_usd
        per_payee_daily_limit_usd: =per_payee_daily_limit_usd
        disbursement_types_allowed: =disbursement_types_allowed
      Paystride Instant Pay Scale:
        max_single_disbursement_usd: =max_single_disbursement_usd
        per_payee_daily_limit_usd: =per_payee_daily_limit_usd
        disbursement_types_allowed: =disbursement_types_allowed
      Paystride Instant Pay Enterprise:
        max_single_disbursement_usd: =max_single_disbursement_usd
        per_payee_daily_limit_usd: =per_payee_daily_limit_usd
        disbursement_types_allowed: =disbursement_types_allowed
  measures:
  - disburse_msr_day_total
  - disburse_msr_payee_day
  - disburse_msr_payee_month_total
- id: disburse_card_destination
  subject:
  - disburse_payout
  rule: >-
    A worker who holds a Paystride Visa Payroll Card changes how a payout can reach them. The worker's Paystride
    card is offered as a payout destination only while that card account's status is active; a worker whose card
    is issued but not activated, blocked or closed is paid to an external debit card or bank account instead, at
    that destination's fee, and the card's status never limits a payout to an external destination. A payout to
    the card costs per_disbursement_fee_paystride_card_usd and posts on the card as an instant pay load.
  eligibility: []
- id: disburse_evt_fees
  subject:
  - disburse_fee
  rule: >-
    Fees are debited from the prefund balance under the tier held on the day they are incurred. A source entry incurs
    at most one fee of each fee type, and the platform fee is debited once per billing month. A payout whose position
    in its month (disburse_msr_month_payout_position) is within included_disbursements_per_month carries no per-disbursement
    fee; beyond it a payout to an external debit card costs per_disbursement_fee_external_debit_usd and one to a
    bank account per_disbursement_fee_same_day_ach_usd, while a payout to a Paystride card costs per_disbursement_fee_paystride_card_usd
    and still uses up a place in the allowance. On the fee_debit_business_day business day of each month the previous
    month's monthly_platform_fee_usd is debited, reduced under disburse_ewa_bundle when that applies. A wire deposit
    costs wire_deposit_fee_usd, a returned deposit prefund_return_fee_usd, a returned payout return_handling_fee_usd,
    a recall request recall_fee_usd, and a closure before minimum_term_months from enrollment early_closure_fee_usd.
    Each fee points to the entry that incurred it. A fee that comes to zero is not debited, and a fee the balance
    cannot cover is debited when funds arrive.
  eligibility:
  - id: one_fee
    applies_to:
    - disburse_fee
    kind: dedup
    condition: A source entry incurs at most one fee of each fee type, and the platform fee is debited once per
      billing month.
    evidence_fields:
    - disburse_ledger.related_entry_id
    - disburse_ledger.fee_type
    - disburse_ledger.billing_month
    - disburse_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_ledger.related_entry_id
        - disburse_ledger.fee_type
      action_bindings:
        disburse_ledger.related_entry_id: related_entry_id
        disburse_ledger.fee_type: fee_type
    dedup_contract:
      table: disburse_ledger
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
        fee_type: fee_type
      duplicate_filters:
        event_type:
        - disburse_fee
      distinct_fields:
      - billing_month
  params:
    per_tier:
      Paystride Instant Pay Starter:
        included_disbursements_per_month: =included_disbursements_per_month
        per_disbursement_fee_external_debit_usd: =per_disbursement_fee_external_debit_usd
        per_disbursement_fee_same_day_ach_usd: =per_disbursement_fee_same_day_ach_usd
        monthly_platform_fee_usd: =monthly_platform_fee_usd
      Paystride Instant Pay Core:
        included_disbursements_per_month: =included_disbursements_per_month
        per_disbursement_fee_external_debit_usd: =per_disbursement_fee_external_debit_usd
        per_disbursement_fee_same_day_ach_usd: =per_disbursement_fee_same_day_ach_usd
        monthly_platform_fee_usd: =monthly_platform_fee_usd
      Paystride Instant Pay Growth:
        included_disbursements_per_month: =included_disbursements_per_month
        per_disbursement_fee_external_debit_usd: =per_disbursement_fee_external_debit_usd
        per_disbursement_fee_same_day_ach_usd: =per_disbursement_fee_same_day_ach_usd
        monthly_platform_fee_usd: =monthly_platform_fee_usd
      Paystride Instant Pay Pro:
        included_disbursements_per_month: =included_disbursements_per_month
        per_disbursement_fee_external_debit_usd: =per_disbursement_fee_external_debit_usd
        per_disbursement_fee_same_day_ach_usd: =per_disbursement_fee_same_day_ach_usd
        monthly_platform_fee_usd: =monthly_platform_fee_usd
      Paystride Instant Pay Scale:
        included_disbursements_per_month: =included_disbursements_per_month
        per_disbursement_fee_external_debit_usd: =per_disbursement_fee_external_debit_usd
        per_disbursement_fee_same_day_ach_usd: =per_disbursement_fee_same_day_ach_usd
        monthly_platform_fee_usd: =monthly_platform_fee_usd
      Paystride Instant Pay Enterprise:
        included_disbursements_per_month: =included_disbursements_per_month
        per_disbursement_fee_external_debit_usd: =per_disbursement_fee_external_debit_usd
        per_disbursement_fee_same_day_ach_usd: =per_disbursement_fee_same_day_ach_usd
        monthly_platform_fee_usd: =monthly_platform_fee_usd
  formula:
    payout_fee: 0 if disburse_msr_month_payout_position <= included_disbursements_per_month else (per_disbursement_fee_external_debit_usd
      if destination_type == 'external_debit_card' else (per_disbursement_fee_same_day_ach_usd if destination_type
      == 'bank_account' else per_disbursement_fee_paystride_card_usd))
  measures:
  - disburse_msr_month_payout_position
- id: disburse_ewa_bundle
  subject:
  - disburse_fee
  rule: >-
    Holding a Paystride Earned Wage Access Program Agreement changes the platform fee: for a billing month in which
    disburse_msr_ewa_full_month is true the platform fee is reduced by ewa_bundle_platform_fee_discount_percent,
    rounded to the nearest cent. The discount never applies to per-disbursement or other fees, and holding a Payroll
    Card Program earns no discount here.
  eligibility: []
  params:
    per_tier:
      Paystride Instant Pay Starter:
        ewa_bundle_platform_fee_discount_percent: =ewa_bundle_platform_fee_discount_percent
      Paystride Instant Pay Core:
        ewa_bundle_platform_fee_discount_percent: =ewa_bundle_platform_fee_discount_percent
      Paystride Instant Pay Growth:
        ewa_bundle_platform_fee_discount_percent: =ewa_bundle_platform_fee_discount_percent
      Paystride Instant Pay Pro:
        ewa_bundle_platform_fee_discount_percent: =ewa_bundle_platform_fee_discount_percent
      Paystride Instant Pay Scale:
        ewa_bundle_platform_fee_discount_percent: =ewa_bundle_platform_fee_discount_percent
      Paystride Instant Pay Enterprise:
        ewa_bundle_platform_fee_discount_percent: =ewa_bundle_platform_fee_discount_percent
  formula:
    platform_fee: round(monthly_platform_fee_usd * (1 - ewa_bundle_platform_fee_discount_percent / 100), 2) if disburse_msr_ewa_full_month
      else monthly_platform_fee_usd
  measures:
  - disburse_msr_ewa_full_month
- id: disburse_evt_prefund
  subject:
  - disburse_prefund_deposit
  - disburse_prefund_return
  - disburse_withdrawal
  rule: >-
    The employer prefunds the service by ACH credit, wire, or an ACH debit it authorized. A deposit is at least
    minimum_deposit_usd, and a deposit that would take the balance above max_prefund_balance_usd is returned to
    the employer and not booked. When auto_replenish is true, which only tiers with auto_replenish_allowed permit,
    a balance below low_balance_alert_usd triggers one replenishment debit of at least auto_replenish_minimum_usd,
    booked with deposit_source auto_replenish. A deposit returned unpaid is reversed by a deposit return pointing
    to it, which charges prefund_return_fee_usd; payouts already sent stand. A deposit is returned at most once.
    When disburse_msr_returned_deposits_90d reaches returned_deposits_suspend_count_90d the service is suspended
    under disburse_lifecycle. The employer may withdraw prefund money not needed for payouts at any time, and on
    closure the whole remaining balance is withdrawn to the employer's bank within remaining_balance_refund_business_days
    business days.
  eligibility:
  - id: one_return
    applies_to:
    - disburse_prefund_return
    kind: dedup
    condition: A deposit is returned at most once.
    evidence_fields:
    - disburse_ledger.related_entry_id
    - disburse_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_ledger.related_entry_id
      action_bindings:
        disburse_ledger.related_entry_id: related_entry_id
    dedup_contract:
      table: disburse_ledger
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - disburse_prefund_return
      distinct_fields: []
  params:
    per_tier:
      Paystride Instant Pay Starter:
        max_prefund_balance_usd: =max_prefund_balance_usd
        auto_replenish_allowed: =auto_replenish_allowed
      Paystride Instant Pay Core:
        max_prefund_balance_usd: =max_prefund_balance_usd
        auto_replenish_allowed: =auto_replenish_allowed
      Paystride Instant Pay Growth:
        max_prefund_balance_usd: =max_prefund_balance_usd
        auto_replenish_allowed: =auto_replenish_allowed
      Paystride Instant Pay Pro:
        max_prefund_balance_usd: =max_prefund_balance_usd
        auto_replenish_allowed: =auto_replenish_allowed
      Paystride Instant Pay Scale:
        max_prefund_balance_usd: =max_prefund_balance_usd
        auto_replenish_allowed: =auto_replenish_allowed
      Paystride Instant Pay Enterprise:
        max_prefund_balance_usd: =max_prefund_balance_usd
        auto_replenish_allowed: =auto_replenish_allowed
  measures:
  - disburse_msr_returned_deposits_90d
- id: disburse_evt_returns_recalls
  subject:
  - disburse_payout_return
  - disburse_payout_recall
  rule: >-
    A payout the receiving card or bank refuses or sends back — a closed card account, an invalid account, a frozen
    account — is credited to the prefund balance within returned_payout_credit_business_days business days of the
    return notice, pointing to the payout, and charges return_handling_fee_usd; a same-day ACH payout can come back
    for ach_return_window_business_days business days after settlement. A payout is returned at most once. An instant
    push to an external debit card is final once delivered and can never be recalled. A payout to a destination
    listed in recallable_destinations that the employer sent in error may be recalled at the employer's request.
    A recall is accepted only when the request arrives within recall_window_business_days business days after the
    payout was sent. Business days are Monday through Friday excluding Federal Reserve holidays, counted from the
    day after the payout's entry_date, and a request on the last business day of the window is in time. The recall
    takes back no more than the worker's card's available balance at the time and never takes it below zero; the
    amount recovered is booked as a recall with reason recalled pointing to the payout, nothing is booked when nothing
    was recovered, and recall_fee_usd is charged either way; whatever is not recovered is for the employer to settle
    with the worker. A payout is recalled at most once, and never after it was returned.
  eligibility:
  - id: recall_window
    applies_to:
    - disburse_payout_recall
    kind: time
    condition: A recall is accepted only when the request arrives within recall_window_business_days business days
      after the payout was sent.
    evidence_fields:
    - disburse_ledger.entry_date
    - disburse_ledger.disburse_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - disburse_ledger.disburse_entry_id
      action_bindings:
        disburse_ledger.disburse_entry_id: related_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the payout was sent
