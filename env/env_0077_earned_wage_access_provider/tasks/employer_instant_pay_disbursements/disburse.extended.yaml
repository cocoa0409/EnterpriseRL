- id: disburse_ext_replenish_debit
  base_policy_refs:
  - disburse_evt_prefund
  overwrite:
  - base_policy: disburse_evt_prefund
    superseded_clause: When auto_replenish is true, which only tiers with auto_replenish_allowed permit, a balance below low_balance_alert_usd triggers one replenishment debit of at least auto_replenish_minimum_usd, booked with deposit_source auto_replenish.
    replaced_by: When auto_replenish is true, which only tiers with auto_replenish_allowed permit, a prefund balance below the alert level on file triggers one replenishment debit of at least auto_replenish_minimum_usd, sized as set out here, booked as one deposit with funding_method ach_debit_authorization and deposit_source auto_replenish. A replenishment debit is not pulled until the alert level on file stands at or above the replenishment floor.
  trigger: state_due
  subject:
  - disburse_prefund_deposit
  computes: amount
  target_tool: book_replenishment_debit_b3fe8e59
  params:
    debit_rounding_usd: 100
    volume_alert_multiple: 2
    weeks_per_month: 4
    weekend_friday_percent: 20
    weekend_day_percent: 10
    ewa_debit_percent: 10
    ewa_other_percent: 5
    new_service_months: 2
    settling_months: 6
    new_service_multiplier: 0.8
    settling_multiplier: 0.9
    risk_window_months: 3
    recent_return_multiplier: 0.5
    older_return_multiplier: 0.75
  rule: 'This policy settles the automatic replenishment debit that Paystride pulls from the employer''s bank account under its authorization. When auto_replenish is true, which only tiers with auto_replenish_allowed permit, a prefund balance below the alert level on file triggers one replenishment debit of at least auto_replenish_minimum_usd, sized as set out here, booked as one deposit with funding_method ach_debit_authorization and deposit_source auto_replenish. A replenishment debit is not pulled until the alert level on file stands at or above the replenishment floor. A replenishment debit is sized only after the ledger carries the platform fee of every completed billing month whose fee debit day has come. The replenishment debit is the alert level on file less the prefund balance the ledger shows, that is every deposit, returned payout, recall and fee credit less every returned deposit, payout, fee and withdrawal on the service, and it is never below auto_replenish_minimum_usd. The debit is the amount it restores raised once by the sum of every percentage that applies below, the percentages being added together into one rate, then multiplied by every multiplier that applies below, and then rounded up to the nearest multiple of debit_rounding_usd that is not below it, an amount that already is such a multiple being kept; it is never below auto_replenish_minimum_usd. The amount the debit restores depends on how deep the shortfall is and on the service''s recent payouts: for a ledger balance below half the alert level at a service whose payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, came to no more than volume_alert_multiple times the alert level, it is the alert level plus auto_replenish_minimum_usd less the balance; for a ledger balance below half the alert level at a service whose payouts in that month came to more than volume_alert_multiple times the alert level, it is the alert level plus that month''s payout total divided by weeks_per_month, less the balance; for any other balance it is the alert level less the balance. A debit pulled on a Friday adds weekend_friday_percent percent and one pulled on a Saturday or Sunday adds weekend_day_percent percent, because instant payouts continue while the debit waits for the next business day to settle; a debit pulled on any other day adds nothing for the weekend. An employer whose Earned Wage Access Program Agreement is live and whose remittances Paystride takes by ach_debit_authorization adds ewa_debit_percent percent, an employer whose live agreement remits by another method adds ewa_other_percent percent, and an employer with no live agreement adds nothing for its agreement. A service activated fewer than new_service_months whole months before today has a new-service multiplier of new_service_multiplier, one activated fewer than settling_months whole months before today has a multiplier of settling_multiplier, and any other service has a multiplier of one, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s. A service with a returned deposit dated fewer than risk_window_months whole months before today has a returned-deposit multiplier of recent_return_multiplier, one whose latest returned deposit is older than that but dated fewer than twelve whole months before today has a multiplier of older_return_multiplier, and any other service has a multiplier of one, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s.'
  prerequisite:
  - problem: disburse_ext_alert_election
    kind: value_input
    gate: alert_on_file
    form: state
    policy_source: A replenishment debit is not pulled until the alert level on file stands at or above the replenishment floor.
    condition: disburse_services.low_balance_alert_usd of the service is at or above the replenishment floor worked out for it
    resolved_by: confirm_alert_level_1c610295
    effect: the alert level the debit restores rises from the level on file to the replenishment floor, so the debit becomes due and its size grows with the new alert level
  - problem: disburse_ext_platform_fee
    kind: value_input
    gate: ledger_balance
    form: state
    policy_source: A replenishment debit is sized only after the ledger carries the platform fee of every completed billing month whose fee debit day has come.
    condition: disburse_ledger holds a disburse_fee entry with fee_type monthly_platform for the completed billing month whose fee debit day has come
    resolved_by: debit_platform_fee_9215b300
    effect: the ledger balance the debit restores from falls by the platform fee, so the debit grows by that amount before its percentages and multipliers
  cross_category:
  - category: program
    as: branch
    reads:
    - status
    - remittance_method
    note: the agreement percentage is decided from whether the employer's live Earned Wage Access Program Agreement remits by ACH debit
  compute:
  - ledger_balance: SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_prefund_deposit') + SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_payout_return') + SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_payout_recall') + SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_fee_credit') - SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_prefund_return') - SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_payout') - SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_fee') - SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_withdrawal')
  - alert_on_file: F('low_balance_alert_usd')
  - payouts_month_total: SUM('disburse_ledger', 'amount', within_months=1, date_field='entry_date', event_type='disburse_payout')
  - debit_size: (alert_on_file + P('auto_replenish_minimum_usd') - ledger_balance) if (ledger_balance < alert_on_file / 2 and payouts_month_total <= K('volume_alert_multiple') * alert_on_file) else ((alert_on_file + payouts_month_total / K('weeks_per_month') - ledger_balance) if (ledger_balance < alert_on_file / 2 and payouts_month_total > K('volume_alert_multiple') * alert_on_file) else (alert_on_file - ledger_balance))
  - weekday_index: DAYS('2000-01-07', NOW) % 7
  - weekend_percent: K('weekend_friday_percent') if weekday_index == 0 else (K('weekend_day_percent') if (weekday_index == 1 or weekday_index == 2) else 0)
  - ewa_live: EXISTS('program', status='live')
  - ewa_remittance_method: CFIELD('program', 'remittance_method', status='live')
  - ewa_percent: K('ewa_debit_percent') if (ewa_live and ewa_remittance_method == 'ach_debit_authorization') else (K('ewa_other_percent') if (ewa_live and ewa_remittance_method != 'ach_debit_authorization') else 0)
  - months_since_activation: MONTHS(F('activated_date'), NOW)
  - new_service_multiplier: K('new_service_multiplier') if months_since_activation < K('new_service_months') else (K('settling_multiplier') if months_since_activation < K('settling_months') else 1)
  - returns_recent: COUNT('disburse_ledger', within_months=K('risk_window_months'), date_field='entry_date', event_type='disburse_prefund_return')
  - returns_in_year: COUNT('disburse_ledger', within_months=12, date_field='entry_date', event_type='disburse_prefund_return')
  - returns_multiplier: K('recent_return_multiplier') if returns_recent > 0 else (K('older_return_multiplier') if returns_in_year > 0 else 1)
  - result: MX(P('auto_replenish_minimum_usd'), -((-(debit_size * (1 + (weekend_percent + ewa_percent) / 100) * new_service_multiplier * returns_multiplier) + 0.000000001) // K('debit_rounding_usd')) * K('debit_rounding_usd'))
  compute_basis:
    ledger_balance: 'The amount the debit restores depends on how deep the shortfall is and on the service''s recent payouts: for a ledger balance below half the alert level at a service whose payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, came to no more than volume_alert_multiple times the alert level, it is the alert level plus auto_replenish_minimum_usd less the balance; for a ledger balance below half the alert level at a service whose payouts in that month came to more than volume_alert_multiple times the alert level, it is the alert level plus that month''s payout total divided by weeks_per_month, less the balance; for any other balance it is the alert level less the balance.'
    alert_on_file: 'The amount the debit restores depends on how deep the shortfall is and on the service''s recent payouts: for a ledger balance below half the alert level at a service whose payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, came to no more than volume_alert_multiple times the alert level, it is the alert level plus auto_replenish_minimum_usd less the balance; for a ledger balance below half the alert level at a service whose payouts in that month came to more than volume_alert_multiple times the alert level, it is the alert level plus that month''s payout total divided by weeks_per_month, less the balance; for any other balance it is the alert level less the balance.'
    payouts_month_total: 'The amount the debit restores depends on how deep the shortfall is and on the service''s recent payouts: for a ledger balance below half the alert level at a service whose payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, came to no more than volume_alert_multiple times the alert level, it is the alert level plus auto_replenish_minimum_usd less the balance; for a ledger balance below half the alert level at a service whose payouts in that month came to more than volume_alert_multiple times the alert level, it is the alert level plus that month''s payout total divided by weeks_per_month, less the balance; for any other balance it is the alert level less the balance.'
    debit_size: 'The amount the debit restores depends on how deep the shortfall is and on the service''s recent payouts: for a ledger balance below half the alert level at a service whose payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, came to no more than volume_alert_multiple times the alert level, it is the alert level plus auto_replenish_minimum_usd less the balance; for a ledger balance below half the alert level at a service whose payouts in that month came to more than volume_alert_multiple times the alert level, it is the alert level plus that month''s payout total divided by weeks_per_month, less the balance; for any other balance it is the alert level less the balance.'
    weekday_index: A debit pulled on a Friday adds weekend_friday_percent percent and one pulled on a Saturday or Sunday adds weekend_day_percent percent, because instant payouts continue while the debit waits for the next business day to settle; a debit pulled on any other day adds nothing for the weekend.
    weekend_percent: A debit pulled on a Friday adds weekend_friday_percent percent and one pulled on a Saturday or Sunday adds weekend_day_percent percent, because instant payouts continue while the debit waits for the next business day to settle; a debit pulled on any other day adds nothing for the weekend.
    ewa_live: An employer whose Earned Wage Access Program Agreement is live and whose remittances Paystride takes by ach_debit_authorization adds ewa_debit_percent percent, an employer whose live agreement remits by another method adds ewa_other_percent percent, and an employer with no live agreement adds nothing for its agreement.
    ewa_remittance_method: An employer whose Earned Wage Access Program Agreement is live and whose remittances Paystride takes by ach_debit_authorization adds ewa_debit_percent percent, an employer whose live agreement remits by another method adds ewa_other_percent percent, and an employer with no live agreement adds nothing for its agreement.
    ewa_percent: An employer whose Earned Wage Access Program Agreement is live and whose remittances Paystride takes by ach_debit_authorization adds ewa_debit_percent percent, an employer whose live agreement remits by another method adds ewa_other_percent percent, and an employer with no live agreement adds nothing for its agreement.
    months_since_activation: A service activated fewer than new_service_months whole months before today has a new-service multiplier of new_service_multiplier, one activated fewer than settling_months whole months before today has a multiplier of settling_multiplier, and any other service has a multiplier of one, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's.
    new_service_multiplier: A service activated fewer than new_service_months whole months before today has a new-service multiplier of new_service_multiplier, one activated fewer than settling_months whole months before today has a multiplier of settling_multiplier, and any other service has a multiplier of one, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's.
