category: disburse
display_name: Paystride Instant Pay Disbursement Service
binding:
  holding_table: disburse_services
  event_tables:
  - disburse_ledger
  intake_tables:
  - disburse_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    prefund_balance: prefund_balance
lifecycle:
  states:
  - pending_setup
  - active
  - suspended
  - closed
  transitions:
  - from: pending_setup
    to: active
    by: system
    means: business verification completes and the first deposit is available
  - from: active
    to: suspended
    by: agent
    means: the desk suspends for returned deposits
  - from: suspended
    to: active
    by: agent
    means: the desk reinstates once returned deposits are made good
  - from: active
    to: closed
    by: user
    means: the employer confirms closure of the service
accounts:
- key: prefund_balance
  unit: USD
  meaning: Money the employer has prefunded and not yet disbursed, spent on fees or withdrawn.
parameter_schema:
  monthly_platform_fee_usd: Flat monthly platform fee (USD per month).
  included_disbursements_per_month: Disbursements per calendar month, in order, carrying no per-disbursement fee
    (count).
  per_disbursement_fee_paystride_card_usd: Fee per disbursement to a worker's Paystride Visa Payroll Card (USD).
  per_disbursement_fee_external_debit_usd: Fee per instant push-to-card disbursement to an external debit card beyond
    the included allowance (USD).
  per_disbursement_fee_same_day_ach_usd: Fee per same-day ACH disbursement to a bank account beyond the included
    allowance (USD).
  max_single_disbursement_usd: Largest single disbursement (USD).
  push_to_card_max_usd: Largest single instant disbursement to an external debit card (USD).
  daily_disbursement_limit_usd: Most the service may disburse on one calendar day, Eastern Time (USD).
  per_payee_daily_limit_usd: Most one worker may receive on one calendar day (USD).
  per_payee_monthly_limit_usd: Most one worker may receive in one calendar month (USD).
  max_payouts_per_payee_per_day: Disbursements one worker may receive on one calendar day (count).
  disbursement_types_allowed: Kinds of pay the service may disburse (list of disbursement_type values).
  same_day_ach_cutoff_time_et: Eastern Time after which a same-day ACH disbursement settles the next business day
    (HH:MM).
  same_day_ach_max_usd: Largest same-day ACH entry accepted by the ACH network (USD).
  instant_available_24x7: Whether instant disbursements run every day of the year (boolean).
  instant_external_delivery_sla_minutes: Minutes within which an instant external disbursement must be delivered
    before its fee is credited as late (minutes).
  late_delivery_fee_credit: Whether the fee of a late instant disbursement is credited (boolean).
  external_card_payout_networks: Push-to-card networks used for external debit cards (list).
  minimum_deposit_usd: Smallest prefund deposit (USD).
  max_prefund_balance_usd: Largest prefund balance; a deposit that would exceed it is returned (USD).
  ach_deposit_availability_business_days: Business days after receipt before an ACH deposit can be disbursed (count).
  wire_deposit_fee_usd: Fee per incoming wire deposit (USD).
  auto_replenish_allowed: Whether the employer may authorize automatic ACH debits when the balance falls below its
    alert level (boolean).
  auto_replenish_minimum_usd: Smallest automatic replenishment debit (USD).
  low_balance_alert_default_usd: Alert level set at enrollment when the employer chooses none (USD).
  prefund_return_fee_usd: Fee when a prefund deposit is returned unpaid (USD).
  returned_deposits_suspend_count_90d: Returned deposits within 90 calendar days that suspend the service (count).
  return_handling_fee_usd: Fee per disbursement returned by the receiving bank or card (USD).
  returned_payout_credit_business_days: Business days after a return notice within which the returned amount is
    credited to the prefund balance (count).
  ach_return_window_business_days: Business days after settlement within which a same-day ACH disbursement may come
    back as returned (count).
  recall_window_business_days: Business days after a disbursement to a Paystride card within which the employer
    may ask to recall it as sent in error (count).
  recall_fee_usd: Fee per recall request (USD).
  recallable_destinations: Destinations from which a disbursement can be recalled (list).
  fee_debit_business_day: Business day of the following month on which monthly fees are debited (ordinal).
  courtesy_fee_credits_per_12_months: Goodwill fee credits allowed in any rolling 365 days (count).
  fee_credit_request_window_days: Calendar days after a fee within which the employer may ask for a credit (days).
  ewa_bundle_platform_fee_discount_percent: Discount on the platform fee for a month the employer's Earned Wage
    Access program was live on every day (number, percent).
  volume_review_consecutive_months: Consecutive months of disbursement counts in another tier's band after which
    the service moves to that tier (count).
  minimum_term_months: Minimum term (months).
  early_closure_fee_usd: Fee when the service closes before its minimum term (USD).
  remaining_balance_refund_business_days: Business days after closure within which the remaining prefund balance
    is returned to the employer's bank (count).
  negative_balance_allowed: Whether a disbursement may take the prefund balance below zero (boolean).
  same_day_ach_weekend_rollover: Whether same-day ACH requested on a non-business day settles the next business
    day (boolean).
  employer_portal_seats: Employer administrator seats included (count).
  api_access: Whether disbursements may be sent through the API (boolean).
  batch_file_upload: Whether disbursements may be uploaded as a batch file (boolean).
  payee_must_be_current_worker: Whether every payee must be a worker on the employer's payroll file (boolean).
  authorized_requester_roles: Employer portal roles allowed to send, recall and close (list).
