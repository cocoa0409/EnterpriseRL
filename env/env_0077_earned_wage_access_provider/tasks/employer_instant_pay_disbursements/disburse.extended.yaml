- id: disburse_ext_early_closure_fee
  base_policy_refs:
  - disburse_lifecycle
  - disburse_evt_fees
  overwrite:
  - base_policy: disburse_lifecycle
    superseded_clause: A closure or recall is accepted only from a requester whose role is listed in authorized_requester_roles.
    replaced_by: A closure takes effect only on the in-person confirmation of the employer contact who submitted the pending service-closure request, whose role must be listed in authorized_requester_roles; a recall is accepted only from a requester whose role is listed in authorized_requester_roles.
  - base_policy: disburse_evt_fees
    superseded_clause: a closure before minimum_term_months from enrollment early_closure_fee_usd
    replaced_by: An early closure fee is charged only for a closure dated fewer than minimum_term_months whole months after the service's enrolled_date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's; a later closure is charged nothing. The early closure fee is the early_closure_fee_usd of the tier the service holds, rounded half up to the cent.
  trigger: on_request
  subject:
  - disburse_close
  computes: early_closure_fee
  target_tool: confirm_service_closure_f3d256bb
  params:
    end_of_term_months: 3
    starter_period_months: 3
    notice_long_days: 30
    notice_short_days: 14
    notice_long_percent: 20
    notice_short_percent: 10
    retention_long_percent: 20
    retention_short_percent: 10
    fee_model_paid_percent: 15
    fee_model_sponsored_percent: 10
    volume_window_months: 3
    volume_mid_multiple: 3
    volume_low_percent: 20
    volume_mid_percent: 10
    setup_long_days: 14
    setup_short_days: 7
    setup_long_percent: 10
    setup_short_percent: 5
  rule: 'This policy settles the early closure fee owed when an employer closes its Instant Pay Disbursement service before the end of its minimum term. A closure takes effect only on the in-person confirmation of the employer contact who submitted the pending service-closure request, whose role must be listed in authorized_requester_roles; a recall is accepted only from a requester whose role is listed in authorized_requester_roles. Closing the service is the employer''s own act: once the desk has quoted the early closure fee, that contact confirms the closure, and the confirmation closes the service on the closing date, marks the closure request confirmed and debits the early closure fee in the same step; the desk books no withdrawal on the closing day, and the remaining prefund balance is returned to the employer''s bank by the closing run on the next business day. An early closure fee is charged only for a closure dated fewer than minimum_term_months whole months after the service''s enrolled_date, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s; a later closure is charged nothing. The early closure fee is the early_closure_fee_usd of the tier the service holds, rounded half up to the cent. For a service whose tier carries a monthly platform fee, the early closure fee is fixed only after the ledger carries the platform fee for the month in which the closure falls. How the fee is measured depends on where the closure falls in the minimum term. When end_of_term_months or fewer whole months of the minimum term are left, the whole months left being minimum_term_months less the whole months from the enrolled_date to the closing date, the fee is measured as the monthly_platform_fee_usd for each of those whole months left. When fewer than starter_period_months whole months have passed from the enrolled_date to the closing date and more than end_of_term_months whole months are left, the fee is measured as early_closure_fee_usd less every platform fee debited to the service since enrollment, net of any platform fee credited back, and never below zero. Any other early closure is measured at early_closure_fee_usd. The measured fee is then reduced once by the sum of every percentage relief that applies below, the percentages being added together into one rate rather than applied one after another, and the reduced fee is never below zero; the result is rounded half up to the cent once, at the end, and a fee that comes to zero is not debited. A closure whose service-closure request, the latest such request still in submitted status, was submitted at least notice_long_days calendar days before the closing date, counting the closing date but not the submitted_date, earns notice_long_percent percent relief, one submitted fewer than notice_long_days but at least notice_short_days days before earns notice_short_percent percent, and a closure with a later request or none earns no notice relief. An employer whose Earned Wage Access Program Agreement is live and whose renewal_date is at least minimum_term_months whole months after the service''s enrolled_date, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, earns retention_long_percent percent relief, an employer whose live agreement has an earlier renewal_date earns retention_short_percent percent, and an employer with no live agreement earns no retention relief. An employer whose live Earned Wage Access Program Agreement is on the employer_paid fee model earns fee_model_paid_percent percent relief, one on the employer_sponsored fee model earns fee_model_sponsored_percent percent, and any other employer earns no fee-model relief. A service that booked fewer payouts in the volume_window_months months ending on the closing date than one month''s included_disbursements_per_month earns volume_low_percent percent relief, one that booked fewer than volume_mid_multiple times that allowance earns volume_mid_percent percent, and any other service earns no volume relief; the window takes in every payout dated fewer than volume_window_months whole months before the closing date, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s. A service activated more than setup_long_days calendar days after its enrolled_date, counting the activated_date but not the enrolled_date, earns setup_long_percent percent relief, one activated more than setup_short_days but no more than setup_long_days days after it earns setup_short_percent percent, and any other service earns no setup relief.'
  prerequisite:
  - problem: disburse_ext_closing_month_fee
    kind: value_input
    gate: platform_fees_paid
    form: state
    policy_source: For a service whose tier carries a monthly platform fee, the early closure fee is fixed only after the ledger carries the platform fee for the month in which the closure falls.
    condition: for a service whose tier's monthly_platform_fee_usd is above zero, disburse_ledger holds a disburse_fee entry with fee_type monthly_platform whose billing_month is the month of the closing date
    resolved_by: book_closing_month_fee_4be79540
    effect: the platform fees debited since enrollment, which the starter-period measure subtracts from early_closure_fee_usd, rise by the closing-month platform fee, so the measured fee falls by that amount
  cross_category:
  - category: program
    as: branch
    reads:
    - status
    - renewal_date
    - fee_model
    note: the retention relief is decided from the live agreement's renewal_date against the service's term, and the fee-model relief from its fee_model
  compute:
  - months_since_enrollment: MONTHS(F('enrolled_date'), NOW)
  - within_minimum_term: months_since_enrollment < P('minimum_term_months')
  - months_left_in_term: P('minimum_term_months') - months_since_enrollment
  - platform_fees_paid: SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_fee', fee_type='monthly_platform') - SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_fee_credit', fee_type='monthly_platform')
  - measured_fee: (P('monthly_platform_fee_usd') * months_left_in_term) if months_left_in_term <= K('end_of_term_months') else (MX(0, P('early_closure_fee_usd') - platform_fees_paid) if months_since_enrollment < K('starter_period_months') else P('early_closure_fee_usd'))
  - closure_request_date: LATEST('disburse_requests', 'submitted_date', date_field='submitted_date', request_type='service_closure', request_status='submitted')
  - notice_days: DAYS(closure_request_date, NOW) if closure_request_date != None else -1
  - notice_relief: K('notice_long_percent') if notice_days >= K('notice_long_days') else (K('notice_short_percent') if notice_days >= K('notice_short_days') else 0)
  - ewa_renewal_date: CFIELD('program', 'renewal_date', status='live')
  - retention_relief: K('retention_long_percent') if (ewa_renewal_date != None and MONTHS(F('enrolled_date'), ewa_renewal_date) >= P('minimum_term_months')) else (K('retention_short_percent') if (ewa_renewal_date != None and MONTHS(F('enrolled_date'), ewa_renewal_date) < P('minimum_term_months')) else 0)
  - ewa_fee_model: CFIELD('program', 'fee_model', status='live')
  - fee_model_relief: K('fee_model_paid_percent') if ewa_fee_model == 'employer_paid' else (K('fee_model_sponsored_percent') if ewa_fee_model == 'employer_sponsored' else 0)
  - payouts_in_window: COUNT('disburse_ledger', within_months=K('volume_window_months'), date_field='entry_date', event_type='disburse_payout')
  - volume_relief: K('volume_low_percent') if payouts_in_window < P('included_disbursements_per_month') else (K('volume_mid_percent') if payouts_in_window < K('volume_mid_multiple') * P('included_disbursements_per_month') else 0)
  - setup_days: DAYS(F('enrolled_date'), F('activated_date'))
  - setup_relief: K('setup_long_percent') if setup_days > K('setup_long_days') else (K('setup_short_percent') if setup_days > K('setup_short_days') else 0)
  - total_relief: notice_relief + retention_relief + fee_model_relief + volume_relief + setup_relief
  - result: RND(MX(0, measured_fee * (1 - total_relief / 100)) + 0.000000001, 2) if within_minimum_term else 0
  compute_basis:
    months_since_enrollment: An early closure fee is charged only for a closure dated fewer than minimum_term_months whole months after the service's enrolled_date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's; a later closure is charged nothing.
    within_minimum_term: An early closure fee is charged only for a closure dated fewer than minimum_term_months whole months after the service's enrolled_date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's; a later closure is charged nothing.
    months_left_in_term: When end_of_term_months or fewer whole months of the minimum term are left, the whole months left being minimum_term_months less the whole months from the enrolled_date to the closing date, the fee is measured as the monthly_platform_fee_usd for each of those whole months left.
    platform_fees_paid: When fewer than starter_period_months whole months have passed from the enrolled_date to the closing date and more than end_of_term_months whole months are left, the fee is measured as early_closure_fee_usd less every platform fee debited to the service since enrollment, net of any platform fee credited back, and never below zero.
    measured_fee: How the fee is measured depends on where the closure falls in the minimum term. When end_of_term_months or fewer whole months of the minimum term are left, the whole months left being minimum_term_months less the whole months from the enrolled_date to the closing date, the fee is measured as the monthly_platform_fee_usd for each of those whole months left. When fewer than starter_period_months whole months have passed from the enrolled_date to the closing date and more than end_of_term_months whole months are left, the fee is measured as early_closure_fee_usd less every platform fee debited to the service since enrollment, net of any platform fee credited back, and never below zero. Any other early closure is measured at early_closure_fee_usd.
    closure_request_date: A closure whose service-closure request, the latest such request still in submitted status, was submitted at least notice_long_days calendar days before the closing date, counting the closing date but not the submitted_date, earns notice_long_percent percent relief, one submitted fewer than notice_long_days but at least notice_short_days days before earns notice_short_percent percent, and a closure with a later request or none earns no notice relief.
    notice_days: A closure whose service-closure request, the latest such request still in submitted status, was submitted at least notice_long_days calendar days before the closing date, counting the closing date but not the submitted_date, earns notice_long_percent percent relief, one submitted fewer than notice_long_days but at least notice_short_days days before earns notice_short_percent percent, and a closure with a later request or none earns no notice relief.
    notice_relief: A closure whose service-closure request, the latest such request still in submitted status, was submitted at least notice_long_days calendar days before the closing date, counting the closing date but not the submitted_date, earns notice_long_percent percent relief, one submitted fewer than notice_long_days but at least notice_short_days days before earns notice_short_percent percent, and a closure with a later request or none earns no notice relief.
    ewa_renewal_date: An employer whose Earned Wage Access Program Agreement is live and whose renewal_date is at least minimum_term_months whole months after the service's enrolled_date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's, earns retention_long_percent percent relief, an employer whose live agreement has an earlier renewal_date earns retention_short_percent percent, and an employer with no live agreement earns no retention relief.
    retention_relief: An employer whose Earned Wage Access Program Agreement is live and whose renewal_date is at least minimum_term_months whole months after the service's enrolled_date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's, earns retention_long_percent percent relief, an employer whose live agreement has an earlier renewal_date earns retention_short_percent percent, and an employer with no live agreement earns no retention relief.
    ewa_fee_model: An employer whose live Earned Wage Access Program Agreement is on the employer_paid fee model earns fee_model_paid_percent percent relief, one on the employer_sponsored fee model earns fee_model_sponsored_percent percent, and any other employer earns no fee-model relief.
    fee_model_relief: An employer whose live Earned Wage Access Program Agreement is on the employer_paid fee model earns fee_model_paid_percent percent relief, one on the employer_sponsored fee model earns fee_model_sponsored_percent percent, and any other employer earns no fee-model relief.
    payouts_in_window: A service that booked fewer payouts in the volume_window_months months ending on the closing date than one month's included_disbursements_per_month earns volume_low_percent percent relief, one that booked fewer than volume_mid_multiple times that allowance earns volume_mid_percent percent, and any other service earns no volume relief; the window takes in every payout dated fewer than volume_window_months whole months before the closing date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's.
    volume_relief: A service that booked fewer payouts in the volume_window_months months ending on the closing date than one month's included_disbursements_per_month earns volume_low_percent percent relief, one that booked fewer than volume_mid_multiple times that allowance earns volume_mid_percent percent, and any other service earns no volume relief; the window takes in every payout dated fewer than volume_window_months whole months before the closing date, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's.
    setup_days: A service activated more than setup_long_days calendar days after its enrolled_date, counting the activated_date but not the enrolled_date, earns setup_long_percent percent relief, one activated more than setup_short_days but no more than setup_long_days days after it earns setup_short_percent percent, and any other service earns no setup relief.
    setup_relief: A service activated more than setup_long_days calendar days after its enrolled_date, counting the activated_date but not the enrolled_date, earns setup_long_percent percent relief, one activated more than setup_short_days but no more than setup_long_days days after it earns setup_short_percent percent, and any other service earns no setup relief.
    total_relief: The measured fee is then reduced once by the sum of every percentage relief that applies below, the percentages being added together into one rate rather than applied one after another, and the reduced fee is never below zero; the result is rounded half up to the cent once, at the end, and a fee that comes to zero is not debited.
    result: The measured fee is then reduced once by the sum of every percentage relief that applies below, the percentages being added together into one rate rather than applied one after another, and the reduced fee is never below zero; the result is rounded half up to the cent once, at the end, and a fee that comes to zero is not debited.
