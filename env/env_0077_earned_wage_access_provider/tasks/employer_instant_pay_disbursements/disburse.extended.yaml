    returns_in_year: A service with a returned deposit dated fewer than risk_window_months whole months before today has a returned-deposit multiplier of recent_return_multiplier, one whose latest returned deposit is older than that but dated fewer than twelve whole months before today has a multiplier of older_return_multiplier, and any other service has a multiplier of one, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's.
    returns_multiplier: A service with a returned deposit dated fewer than risk_window_months whole months before today has a returned-deposit multiplier of recent_return_multiplier, one whose latest returned deposit is older than that but dated fewer than twelve whole months before today has a multiplier of older_return_multiplier, and any other service has a multiplier of one, whole months between two dates being the difference in calendar months between them, less one when the later date's day of the month is smaller than the earlier date's.
    result: The replenishment debit is the alert level on file less the prefund balance the ledger shows, that is every deposit, returned payout, recall and fee credit less every returned deposit, payout, fee and withdrawal on the service, and it is never below auto_replenish_minimum_usd. The debit is the amount it restores raised once by the sum of every percentage that applies below, the percentages being added together into one rate, then multiplied by every multiplier that applies below, and then rounded up to the nearest multiple of debit_rounding_usd that is not below it, an amount that already is such a multiple being kept; it is never below auto_replenish_minimum_usd.
  factors:
  - id: rd_size
    effect: method
    decides: debit_size
    bindings:
    - payouts_month_total
    - debit_size
    ladder:
    - when: the ledger balance is below half the alert level on file and the payouts of the month ending today came to no more than volume_alert_multiple times the alert level
      method: the debit restores the alert level plus auto_replenish_minimum_usd, less the balance
    - when: the ledger balance is below half the alert level and the month's payouts came to more than volume_alert_multiple times the alert level
      method: the debit restores the alert level plus the month's payout total divided by weeks_per_month, less the balance
    - when: otherwise
      method: the debit restores the alert level, less the balance
    baseline:
      debit_size: alert_on_file - ledger_balance
    evidence:
    - history
    cross_difficulty: null
  - id: rd_weekend
    effect: parameter
    decides: weekend_percent
    bindings:
    - weekday_index
    - weekend_percent
    ladder:
    - when: the debit is pulled on a Friday
      value: K('weekend_friday_percent')
    - when: the debit is pulled on a Saturday or Sunday
      value: K('weekend_day_percent')
    - when: otherwise
      value: '0'
    baseline:
      weekend_percent: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: rd_ewa
    effect: parameter
    decides: ewa_percent
    bindings:
    - ewa_live
    - ewa_remittance_method
    - ewa_percent
    ladder:
    - when: the employer's agreement is live and its remittances are taken by ach_debit_authorization
      value: K('ewa_debit_percent')
    - when: the agreement is live and remits by another method
      value: K('ewa_other_percent')
    - when: otherwise
      value: '0'
    baseline:
      ewa_percent: '0'
    evidence:
    - cross_category
    cross_difficulty: program
  - id: rd_new_service
    effect: parameter
    decides: new_service_multiplier
    bindings:
    - months_since_activation
    - new_service_multiplier
    ladder:
    - when: activated fewer than new_service_months whole months before today
      value: K('new_service_multiplier')
    - when: activated fewer than settling_months whole months before today
      value: K('settling_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      new_service_multiplier: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: rd_returns
    effect: parameter
    decides: returns_multiplier
    bindings:
    - returns_recent
    - returns_in_year
    - returns_multiplier
    ladder:
    - when: a returned deposit in the risk_window_months months ending today
      value: K('recent_return_multiplier')
    - when: the latest returned deposit is older than that but within twelve months
      value: K('older_return_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      returns_multiplier: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The replenishment debit is the alert level on file less the prefund balance the ledger shows, that is every deposit, returned payout, recall and fee credit less every returned deposit, payout, fee and withdrawal on the service, and it is never below auto_replenish_minimum_usd.
    params:
    - auto_replenish_minimum_usd
  inputs:
    history:
    - table: disburse_ledger
      aggregate: sum
      field: amount
      filters: {}
    - table: disburse_ledger
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        event_type: disburse_payout
    - table: disburse_ledger
      aggregate: count
      field: entry_date
      within_months: 3
      filters:
        event_type: disburse_prefund_return
    cross_category:
    - program
- id: disburse_ext_funding_deposit
  base_policy_refs:
  - disburse_evt_prefund
  overwrite: []
  trigger: on_request
  subject:
  - disburse_prefund_deposit
  computes: amount
  target_tool: send_prefund_ach_credit_62da4f1e
  params:
    days_per_month: 30
    headcount_large: 500
    headcount_mid: 100
    headcount_large_percent: 15
    headcount_mid_percent: 5
    tips_heavy_share: 80
    tips_heavy_percent: 10
    tips_some_percent: 5
    off_cycle_many: 2
    off_cycle_many_percent: 10
    off_cycle_one_percent: 5
  rule: 'This policy settles the funding deposit an employer sends by its own ACH credit to bring a service with automatic replenishment on up to its funding level. Sending the funding deposit is the employer''s own payment from its own bank account: the desk works out the deposit, the authorized employer contact sends it in person, and the credit is booked as one deposit with funding_method employer_ach_credit and deposit_source employer_initiated on the day it is sent. Before a funding deposit is worked out, the alert level on file must stand at the replenishment floor. A funding deposit is not quoted until the ledger carries the automatic replenishment debit that the balance''s fall below the alert level on file makes due. The funding deposit is the amount by which the funding level exceeds the prefund balance the ledger shows, that is every deposit, returned payout, recall and fee credit less every returned deposit, payout, fee and withdrawal on the service, the funding level being the alert level on file; a deposit that is due is at least minimum_deposit_usd and is rounded half up to the cent, and when the balance already meets the funding level no deposit is due. The funding level is the alert level on file plus every amount that applies below, then raised once by the sum of every percentage that applies below, the percentages being added together into one rate rather than applied one after another; the balance is subtracted after that, and the result is rounded once, at the end. The funding level adds the payouts expected while the deposit becomes available: for a service that sent payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, that month''s payout total divided by days_per_month and multiplied by the tier''s ach_deposit_availability_business_days; for a service that sent no payout in that month but has earlier payouts, its largest single payout; for any other service nothing. An employer whose live Earned Wage Access Program Agreement shows an eligible_headcount of at least headcount_large adds headcount_large_percent percent, one showing at least headcount_mid adds headcount_mid_percent percent, and any other employer adds nothing for headcount. A service more than tips_heavy_share percent of whose payouts in the month ending today were tips adds tips_heavy_percent percent, one more than half of whose payouts in that month were tips adds tips_some_percent percent, and any other service adds nothing for tips. A service that sent off_cycle_many or more off-cycle wage payouts in the month ending today adds off_cycle_many_percent percent, one that sent a single off-cycle wage payout in that month adds off_cycle_one_percent percent, and any other service adds nothing for off-cycle wages.'
  prerequisite:
  - problem: disburse_ext_alert_election
    kind: value_input
    gate: alert_on_file
    form: state
    policy_source: Before a funding deposit is worked out, the alert level on file must stand at the replenishment floor.
    condition: disburse_services.low_balance_alert_usd of the service is at the replenishment floor worked out for it
    resolved_by: confirm_alert_level_1c610295
    effect: the alert level on which the funding level is built rises to the replenishment floor
  - problem: disburse_ext_replenish_debit
    kind: value_input
    gate: ledger_balance
    form: state
    policy_source: A funding deposit is not quoted until the ledger carries the automatic replenishment debit that the balance's fall below the alert level on file makes due.
    condition: disburse_ledger holds the disburse_prefund_deposit with deposit_source auto_replenish that the balance's fall below the alert level on file makes due
    resolved_by: book_replenishment_debit_b3fe8e59
    effect: the ledger balance the deposit is measured against rises by the replenishment debit, so the deposit falls by that amount
  cross_category:
  - category: program
    as: branch
    reads:
    - status
    - eligible_headcount
    note: the headcount percentage is decided from the eligible_headcount on the employer's live Earned Wage Access Program Agreement
  compute:
  - ledger_balance: SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_prefund_deposit') + SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_payout_return') + SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_payout_recall') + SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_fee_credit') - SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_prefund_return') - SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_payout') - SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_fee') - SUM('disburse_ledger', 'amount', date_field='entry_date', event_type='disburse_withdrawal')
  - alert_on_file: F('low_balance_alert_usd')
  - payouts_month_count: COUNT('disburse_ledger', within_months=1, date_field='entry_date', event_type='disburse_payout')
  - payouts_month_total: SUM('disburse_ledger', 'amount', within_months=1, date_field='entry_date', event_type='disburse_payout')
  - largest_payout: MAX('disburse_ledger', 'amount', event_type='disburse_payout')
  - availability_cover: (payouts_month_total / K('days_per_month') * P('ach_deposit_availability_business_days')) if payouts_month_count > 0 else (largest_payout if largest_payout > 0 else 0)
  - ewa_headcount: CFIELD('program', 'eligible_headcount', status='live')
  - headcount_percent: K('headcount_large_percent') if (ewa_headcount != None and ewa_headcount >= K('headcount_large')) else (K('headcount_mid_percent') if (ewa_headcount != None and ewa_headcount >= K('headcount_mid')) else 0)
  - tips_month_count: COUNT('disburse_ledger', within_months=1, date_field='entry_date', event_type='disburse_payout', disbursement_type='tips')
  - tips_percent: K('tips_heavy_percent') if tips_month_count * 100 > K('tips_heavy_share') * payouts_month_count else (K('tips_some_percent') if 2 * tips_month_count > payouts_month_count else 0)
  - off_cycle_count: COUNT('disburse_ledger', within_months=1, date_field='entry_date', event_type='disburse_payout', disbursement_type='off_cycle_wages')
  - off_cycle_percent: K('off_cycle_many_percent') if off_cycle_count >= K('off_cycle_many') else (K('off_cycle_one_percent') if off_cycle_count == 1 else 0)
  - funding_level: (alert_on_file + availability_cover) * (1 + (headcount_percent + tips_percent + off_cycle_percent) / 100)
  - result: 0 if funding_level - ledger_balance <= 0 else RND(MX(P('minimum_deposit_usd'), funding_level - ledger_balance) + 0.000000001, 2)
  compute_basis:
    ledger_balance: The funding deposit is the amount by which the funding level exceeds the prefund balance the ledger shows, that is every deposit, returned payout, recall and fee credit less every returned deposit, payout, fee and withdrawal on the service, the funding level being the alert level on file; a deposit that is due is at least minimum_deposit_usd and is rounded half up to the cent, and when the balance already meets the funding level no deposit is due.
    alert_on_file: The funding deposit is the amount by which the funding level exceeds the prefund balance the ledger shows, that is every deposit, returned payout, recall and fee credit less every returned deposit, payout, fee and withdrawal on the service, the funding level being the alert level on file; a deposit that is due is at least minimum_deposit_usd and is rounded half up to the cent, and when the balance already meets the funding level no deposit is due.
    payouts_month_count: 'The funding level adds the payouts expected while the deposit becomes available: for a service that sent payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, that month''s payout total divided by days_per_month and multiplied by the tier''s ach_deposit_availability_business_days; for a service that sent no payout in that month but has earlier payouts, its largest single payout; for any other service nothing.'
    payouts_month_total: 'The funding level adds the payouts expected while the deposit becomes available: for a service that sent payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, that month''s payout total divided by days_per_month and multiplied by the tier''s ach_deposit_availability_business_days; for a service that sent no payout in that month but has earlier payouts, its largest single payout; for any other service nothing.'
    largest_payout: 'The funding level adds the payouts expected while the deposit becomes available: for a service that sent payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, that month''s payout total divided by days_per_month and multiplied by the tier''s ach_deposit_availability_business_days; for a service that sent no payout in that month but has earlier payouts, its largest single payout; for any other service nothing.'
    availability_cover: 'The funding level adds the payouts expected while the deposit becomes available: for a service that sent payouts in the month ending today, a month that takes in every payout dated fewer than one whole month before today, whole months between two dates being the difference in calendar months between them, less one when the later date''s day of the month is smaller than the earlier date''s, that month''s payout total divided by days_per_month and multiplied by the tier''s ach_deposit_availability_business_days; for a service that sent no payout in that month but has earlier payouts, its largest single payout; for any other service nothing.'
    ewa_headcount: An employer whose live Earned Wage Access Program Agreement shows an eligible_headcount of at least headcount_large adds headcount_large_percent percent, one showing at least headcount_mid adds headcount_mid_percent percent, and any other employer adds nothing for headcount.
    headcount_percent: An employer whose live Earned Wage Access Program Agreement shows an eligible_headcount of at least headcount_large adds headcount_large_percent percent, one showing at least headcount_mid adds headcount_mid_percent percent, and any other employer adds nothing for headcount.
    tips_month_count: A service more than tips_heavy_share percent of whose payouts in the month ending today were tips adds tips_heavy_percent percent, one more than half of whose payouts in that month were tips adds tips_some_percent percent, and any other service adds nothing for tips.
    tips_percent: A service more than tips_heavy_share percent of whose payouts in the month ending today were tips adds tips_heavy_percent percent, one more than half of whose payouts in that month were tips adds tips_some_percent percent, and any other service adds nothing for tips.
    off_cycle_count: A service that sent off_cycle_many or more off-cycle wage payouts in the month ending today adds off_cycle_many_percent percent, one that sent a single off-cycle wage payout in that month adds off_cycle_one_percent percent, and any other service adds nothing for off-cycle wages.
    off_cycle_percent: A service that sent off_cycle_many or more off-cycle wage payouts in the month ending today adds off_cycle_many_percent percent, one that sent a single off-cycle wage payout in that month adds off_cycle_one_percent percent, and any other service adds nothing for off-cycle wages.
    funding_level: The funding level is the alert level on file plus every amount that applies below, then raised once by the sum of every percentage that applies below, the percentages being added together into one rate rather than applied one after another; the balance is subtracted after that, and the result is rounded once, at the end.
    result: The funding deposit is the amount by which the funding level exceeds the prefund balance the ledger shows, that is every deposit, returned payout, recall and fee credit less every returned deposit, payout, fee and withdrawal on the service, the funding level being the alert level on file; a deposit that is due is at least minimum_deposit_usd and is rounded half up to the cent, and when the balance already meets the funding level no deposit is due. The funding level is the alert level on file plus every amount that applies below, then raised once by the sum of every percentage that applies below, the percentages being added together into one rate rather than applied one after another; the balance is subtracted after that, and the result is rounded once, at the end.
