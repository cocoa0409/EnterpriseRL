  - paycard_msr_package_changes_365d
- id: paycard_ewa_bundle
  subject:
  - paycard_fee_debit
  rule: >-
    Holding a live Paystride Earned Wage Access Program Agreement changes kit fees: while paycard_msr_ewa_live is
    true on a kit order's date, the first ewa_bundle_free_kits_per_month kits ordered in that calendar month (counting
    paycard_msr_month_free_kits_used) carry no kit fee; shipping is still charged. The bundle and free_kits_at_launch
    do not add up on the same order: the launch order uses whichever supplies more kits without fee. When ewa_card_destination_promotion
    is true, workers paid on the card are told they can receive early pay on it without a transfer fee; that promise
    is kept by the Access charter, not by a credit here.
  eligibility: []
  params:
    per_tier:
      Paystride Paycard Program Essential:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
      Paystride Paycard Program Standard:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
      Paystride Paycard Program Select:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
      Paystride Paycard Program Advantage:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
      Paystride Paycard Program Premier:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
      Paystride Paycard Program Elite:
        ewa_bundle_free_kits_per_month: =ewa_bundle_free_kits_per_month
  formula:
    fee_free_kits: ewa_bundle_free_kits_per_month - paycard_msr_month_free_kits_used if paycard_msr_ewa_live else
      0
  measures:
  - paycard_msr_ewa_live
  - paycard_msr_month_free_kits_used
extended_policies:
- id: paycard_ext_restoring_wire
  base_policy_refs: [paycard_evt_funding, paycard_reserve, paycard_lifecycle, paycard_evt_payroll_loads, paycard_evt_fees]
  overwrite:
  - base_policy: paycard_reserve
    superseded_clause: >-
      After each regular batch the funding balance must still hold prefund_reserve_percent of paycard_msr_avg_regular_batch.
    replaced_by: >-
      When the desk works out a restoring payment, and only then, the reserve the funding balance must hold is the
      restoration reserve set out below; for every other purpose the reserve remains under the base rule, which reads:
      After each regular batch the funding balance must still hold prefund_reserve_percent of paycard_msr_avg_regular_batch.
  - base_policy: paycard_reserve
    superseded_clause: >-
      Packages with a zero reserve percentage hold no reserve.
    replaced_by: >-
      A package whose prefund_reserve_percent is zero holds a restoration reserve only through the points a returned
      funding payment adds to the restoration reserve percentage; outside a restoring payment the base rule still
      reads: Packages with a zero reserve percentage hold no reserve.
  trigger: on_request
  subject: [paycard_funding_receipt]
  computes: amount_usd
  target_tool: send_restoring_wire_ac37b9e9
  params:
    two_return_uplift_points: 10
    one_return_uplift_points: 5
    young_program_months: 6
    seasoned_program_months: 12
    growth_strong_ratio: 1.1
    growth_mild_ratio: 1.05
    growth_strong_multiplier: 1.1
    growth_mild_multiplier: 1.05
    offcycle_single_share: 0.5
    ach_debit_reserve_weight: 1.25
    ach_credit_reserve_weight: 1.1
    late_two_weight: 1.2
    late_one_weight: 1.1
  rule: >-
    A restoring payment brings the funding balance of a Payroll Card Program back up to its restoration reserve,
    whether the program is live after a regular batch left the balance short or suspended after a returned funding
    payment, and it is figured only for a program whose funding balance is below that reserve.
    The restoring payment is the employer's own act: the authorized employer contact sends it by wire from the
    employer's own bank account once the desk has stated its amount, the desk never sends it for the employer, and a
    program whose package does not allow wire funding cannot make one.
    The restoring payment is worked out only after the funding ledger carries the late funding fee owed for every
    regular payroll batch whose funds arrived after its funding deadline.
    When the desk works out a restoring payment, and only then, the reserve the funding balance must hold is the
    restoration reserve set out below; for every other purpose the reserve remains under the base rule, which reads:
    After each regular batch the funding balance must still hold prefund_reserve_percent of paycard_msr_avg_regular_batch.
    A package whose prefund_reserve_percent is zero holds a restoration reserve only through the points a returned
    funding payment adds to the restoration reserve percentage; outside a restoring payment the base rule still
    reads: Packages with a zero reserve percentage hold no reserve.
    The restoration look-back holds the funding entries dated today or earlier that lie fewer than three whole months
    before today, the whole months between two dates being the difference in calendar months less one when the later
    date's day of the month is smaller than the earlier date's.
    The restoration reserve is prefund_reserve_percent percent of the restoration batch basis, and the restoration
    batch basis is the average regular batch: the amounts of the regular payroll batches posted in the restoration
    look-back summed and divided by their number, or zero when none posted.
    The restoration reserve is rounded half up to the cent.
    The restoring payment is the restoration reserve less the funding balance, and is zero when the funding balance
    already holds the restoration reserve.
    Where adjustments below apply, a figure an adjustment replaces is replaced first, multipliers of the restoration
    batch basis are applied to it next, amounts added to the restoration batch basis are added after that, and the
    percentage and the multipliers of the restoration reserve are applied to that result last, before the
    rounding.
    The restoration reserve percentage follows the funding returns booked on the program in the restoration
    look-back: with two or more such returns it is prefund_reserve_percent plus two_return_uplift_points points, with
    exactly one it is prefund_reserve_percent plus one_return_uplift_points points, and with none it is
    prefund_reserve_percent.
    The restoration batch basis follows how long the program has been live, in whole months from its launch date to
    today: fewer than young_program_months whole months — the largest regular payroll batch posted since launch; at
    least young_program_months but fewer than seasoned_program_months whole months — the greater of the most recent
    regular payroll batch, the one with the latest pay date, and the average regular batch; seasoned_program_months
    whole months or more, or no launch date — the average regular batch.
    The restoration batch basis is multiplied for headcount growth by comparing the cards loaded by the most recent
    regular payroll batch, the one with the latest pay date, with the average cards per regular payroll batch posted
    in the restoration look-back, their
    card counts summed and divided by their number: at least growth_strong_ratio times that average — by
    growth_strong_multiplier; at least growth_mild_ratio times but less than growth_strong_ratio times — by
    growth_mild_multiplier; less than growth_mild_ratio times, or with no regular payroll batch in the look-back —
    by one.
    An off-cycle allowance is added to the restoration batch basis according to the off-cycle payroll batches posted
    in the restoration look-back: with two or more, their amounts summed and divided by their number; with exactly
    one, offcycle_single_share of its amount; with none, nothing.
    The restoration reserve is multiplied for the funding methods the program used, read from the funding receipts
    booked in the restoration look-back: when any of them came by ach_debit_authorization — by
    ach_debit_reserve_weight; when none came by ach_debit_authorization and any came by employer_ach_credit — by
    ach_credit_reserve_weight; when every one came by wire, or none was booked — by one.
    The restoration reserve is multiplied for late funding, counting the late funding fees debited in the
    restoration look-back less the late funding fees credited in it: two or more — by late_two_weight; exactly one —
    by late_one_weight; none — by one.
  prerequisite:
  - problem: paycard_ext_late_funding_fee
    kind: value_input
    gate: w_late_net
    form: state
    policy_source: >-
      The restoring payment is worked out only after the funding ledger carries the late funding fee owed for every
      regular payroll batch whose funds arrived after its funding deadline.
    condition: >-
      Every regular payroll batch on the program whose latest funding receipt for its pay date arrived after the
      funding deadline has a paycard_fee_debit entry with fee_type late_funding whose related_entry_id is that batch.
    resolved_by: debit_program_fee_609ed260
    effect: >-
      Once the late funding fee is on the ledger, the late funding fees counted in the restoration look-back rise by
      one (w_late_net), which can move the restoration reserve to a higher late-funding multiplier, and the funding
      balance falls by the fee, which raises the restoring payment by the same amount.
  cross_category: []
  compute:
  - w_returns_3m: "COUNT('paycard_funding', within_months=3, date_field='entry_date', event_type='paycard_funding_return')"
  - w_regular_count: "COUNT('paycard_funding', within_months=3, date_field='entry_date', event_type='paycard_payroll_load_batch', batch_type='regular_payroll')"
  - w_regular_sum: "SUM('paycard_funding', 'amount', within_months=3, date_field='entry_date', event_type='paycard_payroll_load_batch', batch_type='regular_payroll')"
  - w_avg_regular: "w_regular_sum / w_regular_count if w_regular_count > 0 else 0"
  - w_reserve_pct: "P('prefund_reserve_percent') + K('two_return_uplift_points') if w_returns_3m >= 2 else (P('prefund_reserve_percent') + K('one_return_uplift_points') if w_returns_3m == 1 else P('prefund_reserve_percent'))"
  - w_largest_regular: "MAX('paycard_funding', 'amount', event_type='paycard_payroll_load_batch', batch_type='regular_payroll')"
  - w_latest_regular: "LATEST('paycard_funding', 'amount', date_field='pay_date', event_type='paycard_payroll_load_batch', batch_type='regular_payroll') or 0"
  - w_batch_basis: "w_largest_regular if (F('launch_date') and MONTHS(F('launch_date'), NOW) < K('young_program_months')) else (MX(w_latest_regular, w_avg_regular) if (F('launch_date') and MONTHS(F('launch_date'), NOW) < K('seasoned_program_months')) else w_avg_regular)"
  - w_card_sum: "SUM('paycard_funding', 'card_count', within_months=3, date_field='entry_date', event_type='paycard_payroll_load_batch', batch_type='regular_payroll')"
  - w_latest_cards: "LATEST('paycard_funding', 'card_count', date_field='pay_date', event_type='paycard_payroll_load_batch', batch_type='regular_payroll') or 0"
  - w_growth: "K('growth_strong_multiplier') if (w_regular_count > 0 and w_latest_cards >= K('growth_strong_ratio') * w_card_sum / w_regular_count) else (K('growth_mild_multiplier') if (w_regular_count > 0 and w_latest_cards >= K('growth_mild_ratio') * w_card_sum / w_regular_count) else 1)"
  - w_offcycle_count: "COUNT('paycard_funding', within_months=3, date_field='entry_date', event_type='paycard_payroll_load_batch', batch_type='off_cycle')"
  - w_offcycle_sum: "SUM('paycard_funding', 'amount', within_months=3, date_field='entry_date', event_type='paycard_payroll_load_batch', batch_type='off_cycle')"
  - w_offcycle_allowance: "w_offcycle_sum / w_offcycle_count if w_offcycle_count >= 2 else (K('offcycle_single_share') * w_offcycle_sum if w_offcycle_count == 1 else 0)"
  - w_debit_receipts: "COUNT('paycard_funding', within_months=3, date_field='entry_date', event_type='paycard_funding_receipt', funding_method='ach_debit_authorization')"
  - w_credit_receipts: "COUNT('paycard_funding', within_months=3, date_field='entry_date', event_type='paycard_funding_receipt', funding_method='employer_ach_credit')"
  - w_method_weight: "K('ach_debit_reserve_weight') if w_debit_receipts > 0 else (K('ach_credit_reserve_weight') if w_credit_receipts > 0 else 1)"
  - w_late_net: "COUNT('paycard_funding', within_months=3, date_field='entry_date', event_type='paycard_fee_debit', fee_type='late_funding') - COUNT('paycard_funding', within_months=3, date_field='entry_date', event_type='paycard_fee_credit', fee_type='late_funding')"
  - w_late_weight: "K('late_two_weight') if w_late_net >= 2 else (K('late_one_weight') if w_late_net == 1 else 1)"
  - w_reserve: "RND(((w_batch_basis * w_growth) + w_offcycle_allowance) * w_reserve_pct / 100 * w_method_weight * w_late_weight + 0.000000001, 2)"
  - result: "RND(MX(0, w_reserve - F('funding_balance')) + 0.000000001, 2)"
  compute_basis:
    w_returns_3m: "The restoration reserve percentage follows the funding returns booked on the program in the restoration look-back: with two or more such returns it is prefund_reserve_percent plus two_return_uplift_points points, with exactly one it is prefund_reserve_percent plus one_return_uplift_points points, and with none it is prefund_reserve_percent."
    w_regular_count: "The restoration reserve is prefund_reserve_percent percent of the restoration batch basis, and the restoration batch basis is the average regular batch: the amounts of the regular payroll batches posted in the restoration look-back summed and divided by their number, or zero when none posted."
    w_regular_sum: "The restoration look-back holds the funding entries dated today or earlier that lie fewer than three whole months before today, the whole months between two dates being the difference in calendar months less one when the later date's day of the month is smaller than the earlier date's."
    w_avg_regular: "The restoration reserve is prefund_reserve_percent percent of the restoration batch basis, and the restoration batch basis is the average regular batch: the amounts of the regular payroll batches posted in the restoration look-back summed and divided by their number, or zero when none posted."
    w_reserve_pct: "The restoration reserve percentage follows the funding returns booked on the program in the restoration look-back: with two or more such returns it is prefund_reserve_percent plus two_return_uplift_points points, with exactly one it is prefund_reserve_percent plus one_return_uplift_points points, and with none it is prefund_reserve_percent."
    w_largest_regular: "The restoration batch basis follows how long the program has been live, in whole months from its launch date to today: fewer than young_program_months whole months — the largest regular payroll batch posted since launch; at least young_program_months but fewer than seasoned_program_months whole months — the greater of the most recent regular payroll batch, the one with the latest pay date, and the average regular batch; seasoned_program_months whole months or more, or no launch date — the average regular batch."
    w_latest_regular: "The restoration batch basis follows how long the program has been live, in whole months from its launch date to today: fewer than young_program_months whole months — the largest regular payroll batch posted since launch; at least young_program_months but fewer than seasoned_program_months whole months — the greater of the most recent regular payroll batch, the one with the latest pay date, and the average regular batch; seasoned_program_months whole months or more, or no launch date — the average regular batch."
    w_batch_basis: "The restoration batch basis follows how long the program has been live, in whole months from its launch date to today: fewer than young_program_months whole months — the largest regular payroll batch posted since launch; at least young_program_months but fewer than seasoned_program_months whole months — the greater of the most recent regular payroll batch, the one with the latest pay date, and the average regular batch; seasoned_program_months whole months or more, or no launch date — the average regular batch."
    w_card_sum: "The restoration batch basis is multiplied for headcount growth by comparing the cards loaded by the most recent regular payroll batch, the one with the latest pay date, with the average cards per regular payroll batch posted in the restoration look-back, their card counts summed and divided by their number: at least growth_strong_ratio times that average — by growth_strong_multiplier; at least growth_mild_ratio times but less than growth_strong_ratio times — by growth_mild_multiplier; less than growth_mild_ratio times, or with no regular payroll batch in the look-back — by one."
    w_latest_cards: "The restoration batch basis is multiplied for headcount growth by comparing the cards loaded by the most recent regular payroll batch, the one with the latest pay date, with the average cards per regular payroll batch posted in the restoration look-back, their card counts summed and divided by their number: at least growth_strong_ratio times that average — by growth_strong_multiplier; at least growth_mild_ratio times but less than growth_strong_ratio times — by growth_mild_multiplier; less than growth_mild_ratio times, or with no regular payroll batch in the look-back — by one."
    w_growth: "The restoration batch basis is multiplied for headcount growth by comparing the cards loaded by the most recent regular payroll batch, the one with the latest pay date, with the average cards per regular payroll batch posted in the restoration look-back, their card counts summed and divided by their number: at least growth_strong_ratio times that average — by growth_strong_multiplier; at least growth_mild_ratio times but less than growth_strong_ratio times — by growth_mild_multiplier; less than growth_mild_ratio times, or with no regular payroll batch in the look-back — by one."
    w_offcycle_count: "An off-cycle allowance is added to the restoration batch basis according to the off-cycle payroll batches posted in the restoration look-back: with two or more, their amounts summed and divided by their number; with exactly one, offcycle_single_share of its amount; with none, nothing."
    w_offcycle_sum: "An off-cycle allowance is added to the restoration batch basis according to the off-cycle payroll batches posted in the restoration look-back: with two or more, their amounts summed and divided by their number; with exactly one, offcycle_single_share of its amount; with none, nothing."
    w_offcycle_allowance: "An off-cycle allowance is added to the restoration batch basis according to the off-cycle payroll batches posted in the restoration look-back: with two or more, their amounts summed and divided by their number; with exactly one, offcycle_single_share of its amount; with none, nothing."
    w_debit_receipts: "The restoration reserve is multiplied for the funding methods the program used, read from the funding receipts booked in the restoration look-back: when any of them came by ach_debit_authorization — by ach_debit_reserve_weight; when none came by ach_debit_authorization and any came by employer_ach_credit — by ach_credit_reserve_weight; when every one came by wire, or none was booked — by one."
    w_credit_receipts: "The restoration reserve is multiplied for the funding methods the program used, read from the funding receipts booked in the restoration look-back: when any of them came by ach_debit_authorization — by ach_debit_reserve_weight; when none came by ach_debit_authorization and any came by employer_ach_credit — by ach_credit_reserve_weight; when every one came by wire, or none was booked — by one."
    w_method_weight: "The restoration reserve is multiplied for the funding methods the program used, read from the funding receipts booked in the restoration look-back: when any of them came by ach_debit_authorization — by ach_debit_reserve_weight; when none came by ach_debit_authorization and any came by employer_ach_credit — by ach_credit_reserve_weight; when every one came by wire, or none was booked — by one."
    w_late_net: "The restoration reserve is multiplied for late funding, counting the late funding fees debited in the restoration look-back less the late funding fees credited in it: two or more — by late_two_weight; exactly one — by late_one_weight; none — by one."
    w_late_weight: "The restoration reserve is multiplied for late funding, counting the late funding fees debited in the restoration look-back less the late funding fees credited in it: two or more — by late_two_weight; exactly one — by late_one_weight; none — by one."
    w_reserve: "Where adjustments below apply, a figure an adjustment replaces is replaced first, multipliers of the restoration batch basis are applied to it next, amounts added to the restoration batch basis are added after that, and the percentage and the multipliers of the restoration reserve are applied to that result last, before the rounding."
    result: "The restoring payment is the restoration reserve less the funding balance, and is zero when the funding balance already holds the restoration reserve."
  factors:
  - id: returned_funding_uplift
    effect: parameter
    decides: w_reserve_pct
    bindings: [w_returns_3m, w_reserve_pct]
    ladder:
    - when: "two or more funding returns booked on the program in the restoration look-back"
      value: "P('prefund_reserve_percent') + K('two_return_uplift_points')"
    - when: "exactly one funding return booked on the program in the restoration look-back"
      value: "P('prefund_reserve_percent') + K('one_return_uplift_points')"
    - when: "otherwise (no funding return in the restoration look-back)"
      value: "P('prefund_reserve_percent')"
    baseline:
      w_reserve_pct: "P('prefund_reserve_percent')"
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: program_age_basis
    effect: method
    decides: w_batch_basis
    bindings: [w_largest_regular, w_latest_regular, w_batch_basis]
    ladder:
    - when: "the program's launch date is fewer than young_program_months whole months before today"
      method: "the largest regular payroll batch posted since launch"
    - when: "the program's launch date is at least young_program_months but fewer than seasoned_program_months whole months before today"
      method: "the greater of the most recent regular payroll batch and the average regular batch"
    - when: "otherwise (seasoned_program_months whole months or more since launch, or no launch date)"
      method: "the average regular batch of the restoration look-back"
    baseline:
      w_batch_basis: "w_avg_regular"
    evidence: [date, history]
    cross_difficulty: null
  - id: headcount_growth
    effect: parameter
    decides: w_growth
    bindings: [w_card_sum, w_latest_cards, w_growth]
    ladder:
    - when: "the most recent regular payroll batch loaded at least growth_strong_ratio times the average cards per regular payroll batch of the restoration look-back"
      value: "K('growth_strong_multiplier')"
    - when: "it loaded at least growth_mild_ratio times but less than growth_strong_ratio times that average"
      value: "K('growth_mild_multiplier')"
    - when: "otherwise (less than growth_mild_ratio times that average, or no regular payroll batch in the look-back)"
      value: "1"
    baseline:
      w_growth: "1"
    evidence: [history]
    cross_difficulty: null
  - id: off_cycle_allowance
    effect: parameter
    decides: w_offcycle_allowance
    bindings: [w_offcycle_count, w_offcycle_sum, w_offcycle_allowance]
    ladder:
    - when: "two or more off-cycle payroll batches posted in the restoration look-back"
      value: "their amounts summed and divided by their number"
    - when: "exactly one off-cycle payroll batch posted in the restoration look-back"
      value: "K('offcycle_single_share') times its amount"
    - when: "otherwise (no off-cycle payroll batch in the restoration look-back)"
      value: "0"
    baseline:
      w_offcycle_allowance: "0"
    evidence: [history]
    cross_difficulty: null
  - id: funding_method_weight
    effect: parameter
    decides: w_method_weight
    bindings: [w_debit_receipts, w_credit_receipts, w_method_weight]
    ladder:
    - when: "any funding receipt booked in the restoration look-back came by ach_debit_authorization"
      value: "K('ach_debit_reserve_weight')"
    - when: "none came by ach_debit_authorization and any came by employer_ach_credit"
      value: "K('ach_credit_reserve_weight')"
    - when: "otherwise (every receipt in the look-back came by wire, or none was booked)"
      value: "1"
    baseline:
      w_method_weight: "1"
    evidence: [history]
    cross_difficulty: null
  - id: late_history_weight
    effect: parameter
    decides: w_late_weight
    bindings: [w_late_net, w_late_weight]
    ladder:
    - when: "two or more late funding fees debited in the restoration look-back, net of late funding fees credited in it"
      value: "K('late_two_weight')"
    - when: "exactly one such late funding fee, net"
      value: "K('late_one_weight')"
    - when: "otherwise (none, net)"
      value: "1"
    baseline:
      w_late_weight: "1"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The restoration look-back holds the funding entries dated today or earlier that lie fewer than three whole
      months before today, the whole months between two dates being the difference in calendar months less one when
      the later date's day of the month is smaller than the earlier date's.
      The restoration reserve is prefund_reserve_percent percent of the restoration batch basis, and the restoration
      batch basis is the average regular batch: the amounts of the regular payroll batches posted in the restoration
      look-back summed and divided by their number, or zero when none posted.
      The restoration reserve is rounded half up to the cent.
      The restoring payment is the restoration reserve less the funding balance, and is zero when the funding balance
      already holds the restoration reserve.
    params: [prefund_reserve_percent]
  inputs:
    history:
    - {table: paycard_funding, aggregate: count, field: funding_entry_id, within_months: 3, filters: {event_type: paycard_funding_return}}
    - {table: paycard_funding, aggregate: sum, field: amount, within_months: 3, filters: {event_type: paycard_payroll_load_batch, batch_type: regular_payroll}}
    - {table: paycard_funding, aggregate: max, field: amount, filters: {event_type: paycard_payroll_load_batch, batch_type: regular_payroll}}
    - {table: paycard_funding, aggregate: latest, field: amount, filters: {event_type: paycard_payroll_load_batch, batch_type: regular_payroll}}
    - {table: paycard_funding, aggregate: sum, field: card_count, within_months: 3, filters: {event_type: paycard_payroll_load_batch, batch_type: regular_payroll}}
    - {table: paycard_funding, aggregate: sum, field: amount, within_months: 3, filters: {event_type: paycard_payroll_load_batch, batch_type: off_cycle}}
    - {table: paycard_funding, aggregate: count, field: funding_entry_id, within_months: 3, filters: {event_type: paycard_fee_debit, fee_type: late_funding}}
    - {table: paycard_funding, aggregate: count, field: funding_entry_id, within_months: 3, filters: {event_type: paycard_fee_credit, fee_type: late_funding}}
    - {table: paycard_funding, aggregate: count, field: funding_entry_id, within_months: 3, filters: {event_type: paycard_funding_receipt, funding_method: ach_debit_authorization}}
    cross_category: []
- id: paycard_ext_late_funding_fee
  base_policy_refs: [paycard_evt_funding, paycard_evt_fees, paycard_ewa_bundle, paycard_evt_payroll_loads]
  overwrite:
  - base_policy: paycard_evt_funding
    superseded_clause: >-
      Funds arriving after that deadline are still credited, and the batch is charged late_funding_fee_usd; they post
      to cards on the pay date only if they arrive before load_posting_time_et that day, and otherwise on the next
      business day.
    replaced_by: >-
      For a program's most recent regular payroll batch, and only for that batch, funds arriving after the deadline
      are still credited and the batch is charged the late funding fee figured below; they post to cards on the pay
      date only if they arrive before load_posting_time_et that day, and otherwise on the next business day; every
      other batch remains under the base rule, which reads: Funds arriving after that deadline are still credited, and
      the batch is charged late_funding_fee_usd; they post to cards on the pay date only if they arrive before
      load_posting_time_et that day, and otherwise on the next business day.
  trigger: state_due
  subject: [paycard_fee_debit]
  computes: fee_amount_usd
  target_tool: debit_program_fee_609ed260
  params:
    posted_late_rate_percent: 0.05
    same_day_handling_usd: 15.0
    large_batch_cards: 250
    mid_batch_cards: 100
    large_batch_surcharge_usd: 25.0
    mid_batch_surcharge_usd: 10.0
    repeat_two_multiplier: 1.5
    repeat_one_multiplier: 1.25
    bundle_employer_paid_multiplier: 0.5
    bundle_other_multiplier: 0.8
  rule: >-
    The late funding fee is booked on a program's most recent regular payroll batch, the regular batch with the
    latest pay date, when that batch's funds arrived after its funding deadline; it is debited from the funding
    balance as a fee of the late_funding kind pointing to the batch and carrying its pay date, and a batch whose
    funds arrived in time carries none.
    For a program's most recent regular payroll batch, and only for that batch, funds arriving after the deadline
    are still credited and the batch is charged the late funding fee figured below; they post to cards on the pay
    date only if they arrive before load_posting_time_et that day, and otherwise on the next business day; every
    other batch remains under the base rule, which reads: Funds arriving after that deadline are still credited, and
    the batch is charged late_funding_fee_usd; they post to cards on the pay date only if they arrive before
    load_posting_time_et that day, and otherwise on the next business day.
    The late-fee charge is late_funding_fee_usd of the package held, and the late funding fee is that charge rounded
    half up to the cent.
    Where adjustments below apply, a change to how the late-fee charge is figured is made first, amounts added to the
    late-fee charge are added next, and the multipliers of the late-fee charge are applied to that sum last, before
    the rounding.
    How the late-fee charge is figured follows when the batch's funds arrived, the batch's funding arrival being the
    latest entry date among the funding receipts booked for its pay date and the batch having posted late when its
    entry date is later than its pay date: for a batch that posted late, it is
    the greater of late_funding_fee_usd and posted_late_rate_percent percent of the batch amount; for a batch that
    posted on its pay date with its funding arrival on that same date, it is late_funding_fee_usd plus
    same_day_handling_usd, the batch being loaded as a same-day load; for any other late batch, it is
    late_funding_fee_usd.
    An amount for the workers affected is added to the late-fee charge by the cards the batch loaded:
    large_batch_cards cards or more — large_batch_surcharge_usd; at least mid_batch_cards but fewer than
    large_batch_cards cards — mid_batch_surcharge_usd; fewer than mid_batch_cards cards — nothing.
    The late-fee charge is multiplied for repeated lateness, counting the late funding fees debited in the late-fee
    look-back less the late funding fees credited in it, the fee being figured not yet counted, the late-fee
    look-back holding the funding entries dated today or earlier that lie fewer than three whole months before
    today, whole months being counted as the difference in calendar months less one when today's day of the month
    is smaller than the entry's: two or more — by repeat_two_multiplier; exactly one — by repeat_one_multiplier;
    none — by one.
    The late-fee charge is multiplied when the employer also runs a Paystride Earned Wage Access program whose
    agreement is live today and went live on or before the batch's pay date: under the employer_paid fee model — by
    bundle_employer_paid_multiplier; under any other fee model — by bundle_other_multiplier; with no such agreement —
    by one.
  prerequisite: []
  cross_category:
  - category: program
    as: branch
    reads: [status, go_live_date, fee_model]
    note: The Access-bundle factor reads the employer's live Earned Wage Access agreement, its go-live date against the batch's pay date and its fee model.
  compute:
  - l_batch_pay_date: "LATEST('paycard_funding', 'pay_date', date_field='pay_date', event_type='paycard_payroll_load_batch', batch_type='regular_payroll')"
  - l_batch_posted: "LATEST('paycard_funding', 'entry_date', date_field='pay_date', event_type='paycard_payroll_load_batch', batch_type='regular_payroll')"
  - l_batch_amount: "LATEST('paycard_funding', 'amount', date_field='pay_date', event_type='paycard_payroll_load_batch', batch_type='regular_payroll') or 0"
  - l_funding_arrival: "LATEST('paycard_funding', 'entry_date', date_field='entry_date', event_type='paycard_funding_receipt', pay_date=l_batch_pay_date)"
  - l_charge: "MX(P('late_funding_fee_usd'), K('posted_late_rate_percent') / 100 * l_batch_amount) if (l_batch_posted and l_batch_posted > l_batch_pay_date) else (P('late_funding_fee_usd') + K('same_day_handling_usd') if (l_funding_arrival and l_funding_arrival == l_batch_pay_date) else P('late_funding_fee_usd'))"
  - l_batch_cards: "LATEST('paycard_funding', 'card_count', date_field='pay_date', event_type='paycard_payroll_load_batch', batch_type='regular_payroll') or 0"
  - l_surcharge: "K('large_batch_surcharge_usd') if l_batch_cards >= K('large_batch_cards') else (K('mid_batch_surcharge_usd') if l_batch_cards >= K('mid_batch_cards') else 0)"
  - l_repeat_net: "COUNT('paycard_funding', within_months=3, date_field='entry_date', event_type='paycard_fee_debit', fee_type='late_funding') - COUNT('paycard_funding', within_months=3, date_field='entry_date', event_type='paycard_fee_credit', fee_type='late_funding')"
  - l_repeat: "K('repeat_two_multiplier') if l_repeat_net >= 2 else (K('repeat_one_multiplier') if l_repeat_net == 1 else 1)"
  - l_ewa_live: "EXISTS('program', status='live')"
  - l_ewa_go_live: "CFIELD('program', 'go_live_date', status='live')"
  - l_ewa_model: "CFIELD('program', 'fee_model', status='live')"
  - l_bundle: "K('bundle_employer_paid_multiplier') if (l_ewa_live and l_ewa_go_live and l_batch_pay_date and l_ewa_go_live <= l_batch_pay_date and l_ewa_model == 'employer_paid') else (K('bundle_other_multiplier') if (l_ewa_live and l_ewa_go_live and l_batch_pay_date and l_ewa_go_live <= l_batch_pay_date and l_ewa_model != 'employer_paid') else 1)"
  - result: "RND((l_charge + l_surcharge) * l_repeat * l_bundle + 0.000000001, 2)"
  compute_basis:
    l_batch_pay_date: "The late funding fee is booked on a program's most recent regular payroll batch, the regular batch with the latest pay date, when that batch's funds arrived after its funding deadline; it is debited from the funding balance as a fee of the late_funding kind pointing to the batch and carrying its pay date, and a batch whose funds arrived in time carries none."
    l_batch_posted: "How the late-fee charge is figured follows when the batch's funds arrived, the batch's funding arrival being the latest entry date among the funding receipts booked for its pay date and the batch having posted late when its entry date is later than its pay date: for a batch that posted late, it is the greater of late_funding_fee_usd and posted_late_rate_percent percent of the batch amount; for a batch that posted on its pay date with its funding arrival on that same date, it is late_funding_fee_usd plus same_day_handling_usd, the batch being loaded as a same-day load; for any other late batch, it is late_funding_fee_usd."
    l_batch_amount: "How the late-fee charge is figured follows when the batch's funds arrived, the batch's funding arrival being the latest entry date among the funding receipts booked for its pay date and the batch having posted late when its entry date is later than its pay date: for a batch that posted late, it is the greater of late_funding_fee_usd and posted_late_rate_percent percent of the batch amount; for a batch that posted on its pay date with its funding arrival on that same date, it is late_funding_fee_usd plus same_day_handling_usd, the batch being loaded as a same-day load; for any other late batch, it is late_funding_fee_usd."
    l_funding_arrival: "How the late-fee charge is figured follows when the batch's funds arrived, the batch's funding arrival being the latest entry date among the funding receipts booked for its pay date and the batch having posted late when its entry date is later than its pay date: for a batch that posted late, it is the greater of late_funding_fee_usd and posted_late_rate_percent percent of the batch amount; for a batch that posted on its pay date with its funding arrival on that same date, it is late_funding_fee_usd plus same_day_handling_usd, the batch being loaded as a same-day load; for any other late batch, it is late_funding_fee_usd."
    l_charge: "How the late-fee charge is figured follows when the batch's funds arrived, the batch's funding arrival being the latest entry date among the funding receipts booked for its pay date and the batch having posted late when its entry date is later than its pay date: for a batch that posted late, it is the greater of late_funding_fee_usd and posted_late_rate_percent percent of the batch amount; for a batch that posted on its pay date with its funding arrival on that same date, it is late_funding_fee_usd plus same_day_handling_usd, the batch being loaded as a same-day load; for any other late batch, it is late_funding_fee_usd."
    l_batch_cards: "An amount for the workers affected is added to the late-fee charge by the cards the batch loaded: large_batch_cards cards or more — large_batch_surcharge_usd; at least mid_batch_cards but fewer than large_batch_cards cards — mid_batch_surcharge_usd; fewer than mid_batch_cards cards — nothing."
    l_surcharge: "An amount for the workers affected is added to the late-fee charge by the cards the batch loaded: large_batch_cards cards or more — large_batch_surcharge_usd; at least mid_batch_cards but fewer than large_batch_cards cards — mid_batch_surcharge_usd; fewer than mid_batch_cards cards — nothing."
    l_repeat_net: "The late-fee charge is multiplied for repeated lateness, counting the late funding fees debited in the late-fee look-back less the late funding fees credited in it, the fee being figured not yet counted, the late-fee look-back holding the funding entries dated today or earlier that lie fewer than three whole months before today, whole months being counted as the difference in calendar months less one when today's day of the month is smaller than the entry's: two or more — by repeat_two_multiplier; exactly one — by repeat_one_multiplier; none — by one."
    l_repeat: "The late-fee charge is multiplied for repeated lateness, counting the late funding fees debited in the late-fee look-back less the late funding fees credited in it, the fee being figured not yet counted, the late-fee look-back holding the funding entries dated today or earlier that lie fewer than three whole months before today, whole months being counted as the difference in calendar months less one when today's day of the month is smaller than the entry's: two or more — by repeat_two_multiplier; exactly one — by repeat_one_multiplier; none — by one."
    l_ewa_live: "The late-fee charge is multiplied when the employer also runs a Paystride Earned Wage Access program whose agreement is live today and went live on or before the batch's pay date: under the employer_paid fee model — by bundle_employer_paid_multiplier; under any other fee model — by bundle_other_multiplier; with no such agreement — by one."
    l_ewa_go_live: "The late-fee charge is multiplied when the employer also runs a Paystride Earned Wage Access program whose agreement is live today and went live on or before the batch's pay date: under the employer_paid fee model — by bundle_employer_paid_multiplier; under any other fee model — by bundle_other_multiplier; with no such agreement — by one."
    l_ewa_model: "The late-fee charge is multiplied when the employer also runs a Paystride Earned Wage Access program whose agreement is live today and went live on or before the batch's pay date: under the employer_paid fee model — by bundle_employer_paid_multiplier; under any other fee model — by bundle_other_multiplier; with no such agreement — by one."
    l_bundle: "The late-fee charge is multiplied when the employer also runs a Paystride Earned Wage Access program whose agreement is live today and went live on or before the batch's pay date: under the employer_paid fee model — by bundle_employer_paid_multiplier; under any other fee model — by bundle_other_multiplier; with no such agreement — by one."
    result: "Where adjustments below apply, a change to how the late-fee charge is figured is made first, amounts added to the late-fee charge are added next, and the multipliers of the late-fee charge are applied to that sum last, before the rounding."
  factors:
  - id: lateness_method
    effect: method
    decides: l_charge
    bindings: [l_batch_posted, l_batch_amount, l_funding_arrival, l_charge]
    ladder:
    - when: "the batch posted late (its entry date later than its pay date)"
      method: "the greater of late_funding_fee_usd and posted_late_rate_percent percent of the batch amount"
    - when: "the batch posted on its pay date and its funding arrival is that same date"
      method: "late_funding_fee_usd plus same_day_handling_usd"
    - when: "otherwise (any other late batch, funded before its pay date)"
      method: "late_funding_fee_usd"
    baseline:
      l_charge: "P('late_funding_fee_usd')"
    evidence: [history, date, tier_param]
    cross_difficulty: null
  - id: cards_affected_surcharge
    effect: parameter
    decides: l_surcharge
    bindings: [l_batch_cards, l_surcharge]
    ladder:
    - when: "the batch loaded large_batch_cards cards or more"
      value: "K('large_batch_surcharge_usd')"
    - when: "the batch loaded at least mid_batch_cards but fewer than large_batch_cards cards"
      value: "K('mid_batch_surcharge_usd')"
    - when: "otherwise (fewer than mid_batch_cards cards)"
      value: "0"
    baseline:
      l_surcharge: "0"
    evidence: [history]
    cross_difficulty: null
  - id: repeat_lateness
    effect: parameter
    decides: l_repeat
    bindings: [l_repeat_net, l_repeat]
    ladder:
    - when: "two or more late funding fees debited in the late-fee look-back, net of those credited"
      value: "K('repeat_two_multiplier')"
    - when: "exactly one, net"
      value: "K('repeat_one_multiplier')"
    - when: "otherwise (none, net)"
      value: "1"
    baseline:
      l_repeat: "1"
    evidence: [history]
    cross_difficulty: null
  - id: access_bundle_lateness
    effect: parameter
    decides: l_bundle
    bindings: [l_ewa_live, l_ewa_go_live, l_ewa_model, l_bundle]
    ladder:
    - when: "the employer's Earned Wage Access agreement is live today AND went live on or before the batch's pay date AND bills under the employer_paid fee model"
      value: "K('bundle_employer_paid_multiplier')"
    - when: "the agreement is live today AND went live on or before the batch's pay date AND bills under any other fee model"
