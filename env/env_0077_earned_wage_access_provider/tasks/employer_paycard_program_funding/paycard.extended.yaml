- id: paycard_ext_reinstatement_fee
  base_policy_refs: [paycard_lifecycle, paycard_evt_fees, paycard_evt_funding]
  overwrite:
  - base_policy: paycard_evt_fees
    superseded_clause: >-
      A late batch, a returned funding payment, a corrected load file, a load reversal request, a reinstatement
      (reinstatement_fee_usd) and an early termination (early_termination_fee_usd, when the program terminates
      before minimum_term_months from signing) are each charged once, pointing to the entry or request that incurred
      them.
    replaced_by: >-
      A reinstatement is charged once, when the desk reinstates the program, pointing to the cure payment, at the
      reinstatement fee figured below rather than at a flat reinstatement_fee_usd; an early termination is charged at
      the early termination fee its own charge sets; a late batch, a returned funding payment, a corrected load file
      and a load reversal request are each charged once, pointing to the entry or request that incurred them, as the
      base rule provides.
  trigger: state_due
  subject: [paycard_reinstate]
  computes: reinstatement_fee_usd
  target_tool: reinstate_suspended_program_c7549ab9
  params:
    cure_waiver_days: 1
    cure_reduced_days: 7
    repeat_two_multiplier: 2.0
    repeat_one_multiplier: 1.5
    bundle_employer_paid_multiplier: 0.5
    bundle_other_multiplier: 0.8
    wire_cure_multiplier: 0.9
    ach_credit_cure_multiplier: 0.95
  rule: >-
    The desk reinstates a suspended program once its funding balance has been restored, moving it back to live and
    debiting its reinstatement fee in the same step as a fee of the reinstatement kind pointing to the cure payment;
    a reinstatement fee that comes to zero is not debited, and a package whose reinstatement_fee_usd is zero is
    reinstated without a fee.
    A reinstatement is charged once, when the desk reinstates the program, pointing to the cure payment, at the
    reinstatement fee figured below rather than at a flat reinstatement_fee_usd; an early termination is charged at
    the early termination fee its own charge sets; a late batch, a returned funding payment, a corrected load file
    and a load reversal request are each charged once, pointing to the entry or request that incurred them, as the
    base rule provides.
    The cure payment is the most recent funding receipt when it is dated on or after the entry date of the most
    recent funding return, and there is no cure payment when the most recent funding receipt is older than that
    return or the program has no funding return.
    The reinstatement fee is reinstatement_fee_usd of the package held, rounded half up to the cent.
    Where adjustments below apply, a change to how the reinstatement fee is figured is made first and the
    multipliers of the reinstatement fee are applied to its result after that, before the rounding.
    How the reinstatement fee is figured follows the cure lag, the calendar days from the entry date of the most
    recent funding return to the entry date of the cure payment: a cure lag of at most cure_waiver_days calendar
    days — nothing is charged; a cure lag of more than cure_waiver_days but at most cure_reduced_days calendar days —
    reinstatement_fee_usd less returned_funding_fee_usd, never below zero; a longer cure lag, or no cure payment —
    reinstatement_fee_usd.
    The reinstatement fee is multiplied for repeat reinstatements, counting the reinstatement fees debited in the
    reinstatement look-back less the reinstatement fees credited in it, the reinstatement look-back holding the
    funding entries dated today or earlier that lie fewer than twelve whole months before today, whole months being
    the difference in calendar months less one when today's day of the month is smaller than the entry's: two or
    more — by repeat_two_multiplier; exactly one — by repeat_one_multiplier; none — by one.
    The reinstatement fee is multiplied when the employer's Paystride Earned Wage Access program agreement is live
    today: under the employer_paid fee model — by bundle_employer_paid_multiplier; under any other fee model — by
    bundle_other_multiplier; with no live agreement — by one.
    The reinstatement fee is multiplied for how the cure came in: when a funding receipt by wire is dated on or after
    the entry date of the most recent funding return — by wire_cure_multiplier; when none by wire is, but one by
    employer_ach_credit is — by ach_credit_cure_multiplier; otherwise — by one.
  prerequisite: []
  cross_category:
  - category: program
    as: branch
    reads: [status, fee_model]
    note: The Access-bundle factor of the reinstatement fee reads whether the employer's Earned Wage Access agreement is live today and its fee model.
  compute:
  - r_return_date: "LATEST('paycard_funding', 'entry_date', date_field='entry_date', event_type='paycard_funding_return')"
  - r_cure_date: "LATEST('paycard_funding', 'entry_date', date_field='entry_date', event_type='paycard_funding_receipt')"
  - r_lag: "DAYS(r_return_date, r_cure_date) if (r_return_date and r_cure_date and r_cure_date >= r_return_date) else -1"
  - r_fee_figured: "0 if (r_lag >= 0 and r_lag <= K('cure_waiver_days')) else (MX(0, P('reinstatement_fee_usd') - P('returned_funding_fee_usd')) if (r_lag > K('cure_waiver_days') and r_lag <= K('cure_reduced_days')) else P('reinstatement_fee_usd'))"
  - r_reinstatements: "COUNT('paycard_funding', within_months=12, date_field='entry_date', event_type='paycard_fee_debit', fee_type='reinstatement') - COUNT('paycard_funding', within_months=12, date_field='entry_date', event_type='paycard_fee_credit', fee_type='reinstatement')"
  - r_repeat: "K('repeat_two_multiplier') if r_reinstatements >= 2 else (K('repeat_one_multiplier') if r_reinstatements == 1 else 1)"
  - r_ewa_live: "EXISTS('program', status='live')"
  - r_ewa_model: "CFIELD('program', 'fee_model', status='live')"
  - r_bundle: "K('bundle_employer_paid_multiplier') if (r_ewa_live and r_ewa_model == 'employer_paid') else (K('bundle_other_multiplier') if (r_ewa_live and r_ewa_model != 'employer_paid') else 1)"
  - r_wire_date: "LATEST('paycard_funding', 'entry_date', date_field='entry_date', event_type='paycard_funding_receipt', funding_method='wire')"
  - r_credit_date: "LATEST('paycard_funding', 'entry_date', date_field='entry_date', event_type='paycard_funding_receipt', funding_method='employer_ach_credit')"
  - r_cure_method: "K('wire_cure_multiplier') if (r_return_date and r_wire_date and r_wire_date >= r_return_date) else (K('ach_credit_cure_multiplier') if (r_return_date and r_credit_date and r_credit_date >= r_return_date) else 1)"
  - result: "RND(r_fee_figured * r_repeat * r_bundle * r_cure_method + 0.000000001, 2)"
  compute_basis:
    r_return_date: "The cure payment is the most recent funding receipt when it is dated on or after the entry date of the most recent funding return, and there is no cure payment when the most recent funding receipt is older than that return or the program has no funding return."
    r_cure_date: "The cure payment is the most recent funding receipt when it is dated on or after the entry date of the most recent funding return, and there is no cure payment when the most recent funding receipt is older than that return or the program has no funding return."
    r_lag: "How the reinstatement fee is figured follows the cure lag, the calendar days from the entry date of the most recent funding return to the entry date of the cure payment: a cure lag of at most cure_waiver_days calendar days — nothing is charged; a cure lag of more than cure_waiver_days but at most cure_reduced_days calendar days — reinstatement_fee_usd less returned_funding_fee_usd, never below zero; a longer cure lag, or no cure payment — reinstatement_fee_usd."
    r_fee_figured: "How the reinstatement fee is figured follows the cure lag, the calendar days from the entry date of the most recent funding return to the entry date of the cure payment: a cure lag of at most cure_waiver_days calendar days — nothing is charged; a cure lag of more than cure_waiver_days but at most cure_reduced_days calendar days — reinstatement_fee_usd less returned_funding_fee_usd, never below zero; a longer cure lag, or no cure payment — reinstatement_fee_usd."
    r_reinstatements: "The reinstatement fee is multiplied for repeat reinstatements, counting the reinstatement fees debited in the reinstatement look-back less the reinstatement fees credited in it, the reinstatement look-back holding the funding entries dated today or earlier that lie fewer than twelve whole months before today, whole months being the difference in calendar months less one when today's day of the month is smaller than the entry's: two or more — by repeat_two_multiplier; exactly one — by repeat_one_multiplier; none — by one."
    r_repeat: "The reinstatement fee is multiplied for repeat reinstatements, counting the reinstatement fees debited in the reinstatement look-back less the reinstatement fees credited in it, the reinstatement look-back holding the funding entries dated today or earlier that lie fewer than twelve whole months before today, whole months being the difference in calendar months less one when today's day of the month is smaller than the entry's: two or more — by repeat_two_multiplier; exactly one — by repeat_one_multiplier; none — by one."
    r_ewa_live: "The reinstatement fee is multiplied when the employer's Paystride Earned Wage Access program agreement is live today: under the employer_paid fee model — by bundle_employer_paid_multiplier; under any other fee model — by bundle_other_multiplier; with no live agreement — by one."
    r_ewa_model: "The reinstatement fee is multiplied when the employer's Paystride Earned Wage Access program agreement is live today: under the employer_paid fee model — by bundle_employer_paid_multiplier; under any other fee model — by bundle_other_multiplier; with no live agreement — by one."
    r_bundle: "The reinstatement fee is multiplied when the employer's Paystride Earned Wage Access program agreement is live today: under the employer_paid fee model — by bundle_employer_paid_multiplier; under any other fee model — by bundle_other_multiplier; with no live agreement — by one."
    r_wire_date: "The reinstatement fee is multiplied for how the cure came in: when a funding receipt by wire is dated on or after the entry date of the most recent funding return — by wire_cure_multiplier; when none by wire is, but one by employer_ach_credit is — by ach_credit_cure_multiplier; otherwise — by one."
    r_credit_date: "The reinstatement fee is multiplied for how the cure came in: when a funding receipt by wire is dated on or after the entry date of the most recent funding return — by wire_cure_multiplier; when none by wire is, but one by employer_ach_credit is — by ach_credit_cure_multiplier; otherwise — by one."
    r_cure_method: "The reinstatement fee is multiplied for how the cure came in: when a funding receipt by wire is dated on or after the entry date of the most recent funding return — by wire_cure_multiplier; when none by wire is, but one by employer_ach_credit is — by ach_credit_cure_multiplier; otherwise — by one."
    result: "Where adjustments below apply, a change to how the reinstatement fee is figured is made first and the multipliers of the reinstatement fee are applied to its result after that, before the rounding."
  factors:
  - id: cure_speed
    effect: method
    decides: r_fee_figured
    bindings: [r_cure_date, r_lag, r_fee_figured]
    ladder:
    - when: "a cure lag of at most cure_waiver_days calendar days"
      method: "nothing is charged"
    - when: "a cure lag of more than cure_waiver_days but at most cure_reduced_days calendar days"
      method: "reinstatement_fee_usd less returned_funding_fee_usd, never below zero"
    - when: "otherwise (a longer cure lag, or no cure payment)"
      method: "reinstatement_fee_usd"
    baseline:
      r_fee_figured: "P('reinstatement_fee_usd')"
    evidence: [history, date, tier_param]
    cross_difficulty: null
  - id: repeat_reinstatement
    effect: parameter
    decides: r_repeat
    bindings: [r_reinstatements, r_repeat]
    ladder:
    - when: "two or more reinstatement fees debited in the reinstatement look-back, net of those credited"
      value: "K('repeat_two_multiplier')"
    - when: "exactly one, net"
      value: "K('repeat_one_multiplier')"
    - when: "otherwise (none, net)"
      value: "1"
    baseline:
      r_repeat: "1"
    evidence: [history]
    cross_difficulty: null
  - id: access_bundle_reinstating
    effect: parameter
    decides: r_bundle
    bindings: [r_ewa_live, r_ewa_model, r_bundle]
    ladder:
    - when: "the employer's Earned Wage Access agreement is live today AND bills under the employer_paid fee model"
      value: "K('bundle_employer_paid_multiplier')"
    - when: "the agreement is live today AND bills under any other fee model"
      value: "K('bundle_other_multiplier')"
    - when: "otherwise (no live agreement)"
      value: "1"
    baseline:
      r_bundle: "1"
    evidence: [cross_category]
    cross_difficulty: program
  - id: cure_channel
    effect: parameter
    decides: r_cure_method
    bindings: [r_wire_date, r_credit_date, r_cure_method]
    ladder:
    - when: "a funding receipt by wire is dated on or after the entry date of the most recent funding return"
      value: "K('wire_cure_multiplier')"
    - when: "none by wire is, but a funding receipt by employer_ach_credit is"
      value: "K('ach_credit_cure_multiplier')"
    - when: "otherwise"
      value: "1"
    baseline:
      r_cure_method: "1"
    evidence: [history, date]
