- id: paycard_ext_early_termination_fee
  base_policy_refs: [paycard_lifecycle, paycard_evt_fees, paycard_evt_kit_orders]
  overwrite:
  - base_policy: paycard_lifecycle
    superseded_clause: >-
      A package change or termination notice is accepted only from a requester whose role is listed in
      authorized_requester_roles.
    replaced_by: >-
      A termination notice is accepted only when the authorized employer contact whose employer portal role is listed
      in authorized_requester_roles gives it personally, signing it in the employer portal after the desk has stated
      its early termination fee; a package change is accepted only from a requester whose role is listed in
      authorized_requester_roles, as the base rule provides.
  - base_policy: paycard_evt_fees
    superseded_clause: >-
      A late batch, a returned funding payment, a corrected load file, a load reversal request, a reinstatement
      (reinstatement_fee_usd) and an early termination (early_termination_fee_usd, when the program terminates
      before minimum_term_months from signing) are each charged once, pointing to the entry or request that incurred
      them.
    replaced_by: >-
      An early termination is charged once, when the termination notice is recorded, pointing to the notice request,
      at the early termination fee figured below for a notice given while term months remain, and never for a notice
      given with none remaining, rather than at a flat early_termination_fee_usd when the program terminates before
      minimum_term_months from signing; a reinstatement is charged at the reinstatement fee its own charge sets; a
      late batch, a returned funding payment, a corrected load file and a load reversal request are each charged
      once, pointing to the entry or request that incurred them, as the base rule provides.
  trigger: on_request
  subject: [paycard_termination_notice]
  computes: early_termination_fee_usd
  target_tool: give_termination_notice_a65df371
  params:
    change_restart_months: 12
    launch_delay_days: 30
    standing_two_multiplier: 1.5
    standing_one_multiplier: 1.25
    retention_months: 6
    retention_long_multiplier: 0.5
    retention_short_multiplier: 0.8
    recapture_full_months: 12
    recapture_half_months: 24
    recapture_half_share: 0.5
  rule: >-
    A termination notice is the employer's own act, and it is recorded together with the early termination fee it
    carries, debited from the funding balance as a fee of the early_termination kind pointing to the notice request;
    an early termination fee that comes to zero is not debited.
    A termination notice is accepted only when the authorized employer contact whose employer portal role is listed
    in authorized_requester_roles gives it personally, signing it in the employer portal after the desk has stated
    its early termination fee; a package change is accepted only from a requester whose role is listed in
    authorized_requester_roles, as the base rule provides.
    A termination notice is not recorded, and its early termination fee is not fixed, until the program's status is
    live.
    An early termination is charged once, when the termination notice is recorded, pointing to the notice request,
    at the early termination fee figured below for a notice given while term months remain, and never for a notice
    given with none remaining, rather than at a flat early_termination_fee_usd when the program terminates before
    minimum_term_months from signing; a reinstatement is charged at the reinstatement fee its own charge sets; a
    late batch, a returned funding payment, a corrected load file and a load reversal request are each charged
    once, pointing to the entry or request that incurred them, as the base rule provides.
    The term months remaining are minimum_term_months less the term months served, never below zero, the term months
    served being the whole months from the program's signed date to today, whole months being the difference in
    calendar months less one when today's day of the month is smaller than the earlier date's.
    The early termination fee is early_termination_fee_usd of the package held times the term months remaining
    divided by minimum_term_months, rounded half up to the cent, and a notice given with no term months remaining
    carries no early termination fee.
    Where adjustments below apply, a change to the date the term months are served from is made first, the
    multipliers of the prorated fee are applied next, and amounts added to the fee are added to that result last,
    before the rounding; a notice given with no term months remaining carries none of them.
    The date the term months are served from moves in two situations: when a package change request that took
    effect was submitted fewer than change_restart_months whole months before today, the term months are served from
    the submitted date of the most recent such request, the minimum term restarting with the package change; failing
    that, when the program launched more than launch_delay_days calendar days after its signed date, they are served
    from the launch date; otherwise they are served from the signed date.
    The prorated fee is multiplied for the program's funding standing, counting the reinstatement fees debited in the
    termination look-back less the reinstatement fees credited in it, the termination look-back holding the funding
    entries dated today or earlier that lie fewer than twelve whole months before today: two or more — by
    standing_two_multiplier; exactly one — by standing_one_multiplier; none — by one.
    The prorated fee is multiplied when the employer keeps a Paystride Earned Wage Access program whose agreement is
    live today: when that agreement went live at least retention_months whole months before today — by
    retention_long_multiplier; when it went live fewer than retention_months whole months before today — by
    retention_short_multiplier; with no live agreement — by one.
    An amount is added for kits supplied without kit fee that are still unissued: the lesser of the program's
    card_kit_inventory and the kits supplied without fee, these being the kits on all of the program's kit orders
    less the kits charged on its card_kit fees, priced at card_kit_fee_usd of the package held; for a program that
    launched fewer than recapture_full_months whole months before today the whole of that amount is added, for one
    that launched at least recapture_full_months but fewer than recapture_half_months whole months before today
    recapture_half_share of it, and for an older program, or one with no launch date, nothing.
  prerequisite:
  - problem: paycard_ext_reinstatement_fee
    kind: value_input
    gate: e_reinstatements
    form: state
    policy_source: >-
      A termination notice is not recorded, and its early termination fee is not fixed, until the program's status is
      live.
    condition: >-
      paycard_programs.status is live for the program at the moment the notice is recorded; a suspended program has
      first been reinstated, and the reinstatement fee that reinstatement debits stands on the funding ledger.
    resolved_by: reinstate_suspended_program_c7549ab9
    effect: >-
      Once the suspended program is reinstated, the reinstatement fee booked with that reinstatement is one more
      reinstatement fee in the termination look-back (e_reinstatements), which can move the prorated fee to a higher
      funding-standing multiplier; the status the notice waits on becomes live.
  cross_category:
  - category: program
    as: branch
    reads: [status, go_live_date]
    note: The Access-retention factor of the early termination fee reads whether the employer's Earned Wage Access agreement is live today and how many whole months ago it went live.
  compute:
  - e_change_date: "LATEST('paycard_requests', 'submitted_date', date_field='submitted_date', request_type='package_change', request_status='effective')"
  - e_anchor: "e_change_date if (e_change_date and MONTHS(e_change_date, NOW) < K('change_restart_months')) else (F('launch_date') if (F('launch_date') and DAYS(F('signed_date'), F('launch_date')) > K('launch_delay_days')) else F('signed_date'))"
  - e_remaining: "MX(0, P('minimum_term_months') - MONTHS(e_anchor, NOW))"
  - e_prorated: "P('early_termination_fee_usd') * e_remaining / P('minimum_term_months')"
  - e_reinstatements: "COUNT('paycard_funding', within_months=12, date_field='entry_date', event_type='paycard_fee_debit', fee_type='reinstatement') - COUNT('paycard_funding', within_months=12, date_field='entry_date', event_type='paycard_fee_credit', fee_type='reinstatement')"
  - e_standing: "K('standing_two_multiplier') if e_reinstatements >= 2 else (K('standing_one_multiplier') if e_reinstatements == 1 else 1)"
  - e_ewa_live: "EXISTS('program', status='live')"
  - e_ewa_go_live: "CFIELD('program', 'go_live_date', status='live')"
  - e_retention: "K('retention_long_multiplier') if (e_ewa_live and e_ewa_go_live and MONTHS(e_ewa_go_live, NOW) >= K('retention_months')) else (K('retention_short_multiplier') if (e_ewa_live and e_ewa_go_live and MONTHS(e_ewa_go_live, NOW) < K('retention_months')) else 1)"
  - e_kits_ordered: "SUM('paycard_kit_orders', 'kit_quantity')"
  - e_kits_charged: "SUM('paycard_funding', 'card_count', event_type='paycard_fee_debit', fee_type='card_kit')"
  - e_recapture: "MN(F('card_kit_inventory'), MX(0, e_kits_ordered - e_kits_charged)) * P('card_kit_fee_usd') * (1 if (F('launch_date') and MONTHS(F('launch_date'), NOW) < K('recapture_full_months')) else (K('recapture_half_share') if (F('launch_date') and MONTHS(F('launch_date'), NOW) < K('recapture_half_months')) else 0))"
  - result: "RND((e_prorated * e_standing * e_retention) + e_recapture + 0.000000001, 2) if e_remaining > 0 else 0"
  compute_basis:
    e_change_date: "The date the term months are served from moves in two situations: when a package change request that took effect was submitted fewer than change_restart_months whole months before today, the term months are served from the submitted date of the most recent such request, the minimum term restarting with the package change; failing that, when the program launched more than launch_delay_days calendar days after its signed date, they are served from the launch date; otherwise they are served from the signed date."
    e_anchor: "The date the term months are served from moves in two situations: when a package change request that took effect was submitted fewer than change_restart_months whole months before today, the term months are served from the submitted date of the most recent such request, the minimum term restarting with the package change; failing that, when the program launched more than launch_delay_days calendar days after its signed date, they are served from the launch date; otherwise they are served from the signed date."
    e_remaining: "The term months remaining are minimum_term_months less the term months served, never below zero, the term months served being the whole months from the program's signed date to today, whole months being the difference in calendar months less one when today's day of the month is smaller than the earlier date's."
    e_prorated: "The early termination fee is early_termination_fee_usd of the package held times the term months remaining divided by minimum_term_months, rounded half up to the cent, and a notice given with no term months remaining carries no early termination fee."
    e_reinstatements: "The prorated fee is multiplied for the program's funding standing, counting the reinstatement fees debited in the termination look-back less the reinstatement fees credited in it, the termination look-back holding the funding entries dated today or earlier that lie fewer than twelve whole months before today: two or more — by standing_two_multiplier; exactly one — by standing_one_multiplier; none — by one."
    e_standing: "The prorated fee is multiplied for the program's funding standing, counting the reinstatement fees debited in the termination look-back less the reinstatement fees credited in it, the termination look-back holding the funding entries dated today or earlier that lie fewer than twelve whole months before today: two or more — by standing_two_multiplier; exactly one — by standing_one_multiplier; none — by one."
    e_ewa_live: "The prorated fee is multiplied when the employer keeps a Paystride Earned Wage Access program whose agreement is live today: when that agreement went live at least retention_months whole months before today — by retention_long_multiplier; when it went live fewer than retention_months whole months before today — by retention_short_multiplier; with no live agreement — by one."
    e_ewa_go_live: "The prorated fee is multiplied when the employer keeps a Paystride Earned Wage Access program whose agreement is live today: when that agreement went live at least retention_months whole months before today — by retention_long_multiplier; when it went live fewer than retention_months whole months before today — by retention_short_multiplier; with no live agreement — by one."
    e_retention: "The prorated fee is multiplied when the employer keeps a Paystride Earned Wage Access program whose agreement is live today: when that agreement went live at least retention_months whole months before today — by retention_long_multiplier; when it went live fewer than retention_months whole months before today — by retention_short_multiplier; with no live agreement — by one."
    e_kits_ordered: "An amount is added for kits supplied without kit fee that are still unissued: the lesser of the program's card_kit_inventory and the kits supplied without fee, these being the kits on all of the program's kit orders less the kits charged on its card_kit fees, priced at card_kit_fee_usd of the package held; for a program that launched fewer than recapture_full_months whole months before today the whole of that amount is added, for one that launched at least recapture_full_months but fewer than recapture_half_months whole months before today recapture_half_share of it, and for an older program, or one with no launch date, nothing."
    e_kits_charged: "An amount is added for kits supplied without kit fee that are still unissued: the lesser of the program's card_kit_inventory and the kits supplied without fee, these being the kits on all of the program's kit orders less the kits charged on its card_kit fees, priced at card_kit_fee_usd of the package held; for a program that launched fewer than recapture_full_months whole months before today the whole of that amount is added, for one that launched at least recapture_full_months but fewer than recapture_half_months whole months before today recapture_half_share of it, and for an older program, or one with no launch date, nothing."
    e_recapture: "An amount is added for kits supplied without kit fee that are still unissued: the lesser of the program's card_kit_inventory and the kits supplied without fee, these being the kits on all of the program's kit orders less the kits charged on its card_kit fees, priced at card_kit_fee_usd of the package held; for a program that launched fewer than recapture_full_months whole months before today the whole of that amount is added, for one that launched at least recapture_full_months but fewer than recapture_half_months whole months before today recapture_half_share of it, and for an older program, or one with no launch date, nothing."
    result: "Where adjustments below apply, a change to the date the term months are served from is made first, the multipliers of the prorated fee are applied next, and amounts added to the fee are added to that result last, before the rounding; a notice given with no term months remaining carries none of them."
  factors:
  - id: term_anchor
    effect: method
    decides: e_anchor
    bindings: [e_change_date, e_anchor]
    ladder:
    - when: "a package change request that took effect was submitted fewer than change_restart_months whole months before today"
      method: "the term months are served from the submitted date of the most recent such request"
    - when: "no such request, and the program launched more than launch_delay_days calendar days after its signed date"
      method: "the term months are served from the launch date"
    - when: "otherwise"
      method: "the term months are served from the signed date"
    baseline:
      e_anchor: "F('signed_date')"
    evidence: [history, date]
    cross_difficulty: null
  - id: funding_standing
    effect: parameter
    decides: e_standing
    bindings: [e_reinstatements, e_standing]
    ladder:
    - when: "two or more reinstatement fees debited in the termination look-back, net of those credited"
      value: "K('standing_two_multiplier')"
    - when: "exactly one, net"
      value: "K('standing_one_multiplier')"
    - when: "otherwise (none, net)"
      value: "1"
    baseline:
      e_standing: "1"
    evidence: [history]
    cross_difficulty: null
  - id: access_retention
    effect: parameter
    decides: e_retention
    bindings: [e_ewa_live, e_ewa_go_live, e_retention]
    ladder:
    - when: "the employer's Earned Wage Access agreement is live today AND went live at least retention_months whole months before today"
      value: "K('retention_long_multiplier')"
    - when: "the agreement is live today AND went live fewer than retention_months whole months before today"
      value: "K('retention_short_multiplier')"
    - when: "otherwise (no live agreement)"
      value: "1"
    baseline:
      e_retention: "1"
    evidence: [cross_category, date]
    cross_difficulty: program
  - id: unissued_kit_recapture
    effect: parameter
    decides: e_recapture
    bindings: [e_kits_ordered, e_kits_charged, e_recapture]
    ladder:
    - when: "the program launched fewer than recapture_full_months whole months before today"
      value: "the lesser of card_kit_inventory and the kits supplied without fee, times card_kit_fee_usd"
    - when: "it launched at least recapture_full_months but fewer than recapture_half_months whole months before today"
      value: "recapture_half_share of that amount"
    - when: "otherwise (an older program, or no launch date)"
      value: "0"
    baseline:
      e_recapture: "0"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      The term months remaining are minimum_term_months less the term months served, never below zero, the term
      months served being the whole months from the program's signed date to today, whole months being the difference
      in calendar months less one when today's day of the month is smaller than the earlier date's.
      The early termination fee is early_termination_fee_usd of the package held times the term months remaining
      divided by minimum_term_months, rounded half up to the cent, and a notice given with no term months remaining
      carries no early termination fee.
    params: [early_termination_fee_usd, minimum_term_months]
  inputs:
    history:
    - {table: paycard_requests, aggregate: latest, field: submitted_date, filters: {request_type: package_change, request_status: effective}}
    - {table: paycard_funding, aggregate: count, field: funding_entry_id, within_months: 12, filters: {event_type: paycard_fee_debit, fee_type: reinstatement}}
    - {table: paycard_kit_orders, aggregate: sum, field: kit_quantity, filters: {}}
    - {table: paycard_funding, aggregate: sum, field: card_count, filters: {event_type: paycard_fee_debit, fee_type: card_kit}}
    cross_category: [program]
