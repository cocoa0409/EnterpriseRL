        employer_liable_cure_business_days: =employer_liable_cure_business_days
      Paystride Program Strategic:
        shortfall_contest_window_business_days: =shortfall_contest_window_business_days
        employer_liable_cure_business_days: =employer_liable_cure_business_days
  formula:
    shortfall: program_msr_schedule_open_amount
  measures:
  - program_msr_schedule_open_amount
- id: program_evt_late_charge
  subject:
  - program_late_charge
  rule: >-
    An overdue item is a deduction schedule, or an employer-liable shortfall notice, whose open amount remains after
    its due_date. A late charge is assessed only once late_charge_grace_business_days business days have passed
    since the item's due date. Business days are Monday through Friday excluding Federal Reserve holidays, counted
    from the day after the due_date; once the grace has passed, each late-charge period of late_charge_period_days
    calendar days begins on the due_date, so the second period begins on the due_date plus that number of days.
    An overdue item incurs at most one late charge per late-charge period. The late charge for a period is the greater
    of late_charge_minimum_usd and late_charge_monthly_rate_percent of the item's open amount on the first day of
    that period, rounded to the nearest cent; it points to the item through related_entry_id, carries invoice_line
    late_charge, and is due invoice_net_terms_days after it is booked. Provider-absorbed amounts are never charged.
    A late charge may be waived as a courtesy, by a late_charge_waiver credit memo, only while program_msr_late_waivers_365d
    is below late_charge_courtesy_waivers_per_12_months; a tier allowing none grants none. A late charge caused
    by a returned remittance runs from the schedule's original due_date.
  eligibility:
  - id: grace
    applies_to:
    - program_late_charge
    kind: time
    condition: A late charge is assessed only once late_charge_grace_business_days business days have passed since
      the item's due date.
    evidence_fields:
    - program_settlements.due_date
    - program_settlements.settlement_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_settlements.settlement_entry_id
      action_bindings:
        program_settlements.settlement_entry_id: related_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the item's due date
      anchor_source: program_settlements.due_date
      relation: not_before
      duration_source: variants.late_charge_grace_business_days
      unit: business_days
      counting_rule: Business days are Monday through Friday excluding Federal Reserve holidays, counted from the
        day after the due_date; once the grace has passed, each late-charge period of late_charge_period_days calendar
        days begins on the due_date, so the second period begins on the due_date plus that number of days.
      boundary: inclusive
  - id: one_per_period
    applies_to:
    - program_late_charge
    kind: dedup
    condition: An overdue item incurs at most one late charge per late-charge period.
    evidence_fields:
    - program_billing.related_entry_id
    - program_billing.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_billing.related_entry_id
      action_bindings:
        program_billing.related_entry_id: related_entry_id
    dedup_contract:
      table: program_billing
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - program_late_charge
      distinct_fields:
      - entry_date
  params:
    per_tier:
      Paystride Program Starter:
        late_charge_monthly_rate_percent: =late_charge_monthly_rate_percent
        late_charge_minimum_usd: =late_charge_minimum_usd
        late_charge_courtesy_waivers_per_12_months: =late_charge_courtesy_waivers_per_12_months
      Paystride Program Growth:
        late_charge_monthly_rate_percent: =late_charge_monthly_rate_percent
        late_charge_minimum_usd: =late_charge_minimum_usd
        late_charge_courtesy_waivers_per_12_months: =late_charge_courtesy_waivers_per_12_months
      Paystride Program Professional:
        late_charge_monthly_rate_percent: =late_charge_monthly_rate_percent
        late_charge_minimum_usd: =late_charge_minimum_usd
        late_charge_courtesy_waivers_per_12_months: =late_charge_courtesy_waivers_per_12_months
      Paystride Program Enterprise:
        late_charge_monthly_rate_percent: =late_charge_monthly_rate_percent
        late_charge_minimum_usd: =late_charge_minimum_usd
        late_charge_courtesy_waivers_per_12_months: =late_charge_courtesy_waivers_per_12_months
      Paystride Program Enterprise Plus:
        late_charge_monthly_rate_percent: =late_charge_monthly_rate_percent
        late_charge_minimum_usd: =late_charge_minimum_usd
        late_charge_courtesy_waivers_per_12_months: =late_charge_courtesy_waivers_per_12_months
      Paystride Program Strategic:
        late_charge_monthly_rate_percent: =late_charge_monthly_rate_percent
        late_charge_minimum_usd: =late_charge_minimum_usd
        late_charge_courtesy_waivers_per_12_months: =late_charge_courtesy_waivers_per_12_months
  formula:
    amount: max(late_charge_minimum_usd, round(program_msr_schedule_open_amount * late_charge_monthly_rate_percent
      / 100, 2))
  measures:
  - program_msr_days_past_due
  - program_msr_late_waivers_365d
- id: program_evt_monthly_invoice
  subject:
  - program_invoice_line
  rule: >-
    Program charges are billed monthly in arrears on an invoice issued on the invoice_issue_business_day business
    day of the following month, each line due invoice_net_terms_days calendar days after its entry_date. Each kind
    of invoice line is billed once per billing month and source. The platform_fee line is monthly_platform_fee_usd
    for every calendar month in which the agreement was live, suspended or terminating on any day, never prorated,
    reduced under program_paycard_bundle when that applies. Under the employer_paid fee model the employer_paid_pepm
    line is employer_paid_pepm_usd times the month's enrolled_active_workers on the census. Under the employer_sponsored
    model the sponsored_instant_fees and sponsored_nbd_fees lines bill sponsored_instant_fee_usd and sponsored_nbd_fee_usd
    for each sponsored transfer of that speed booked in the month (program_msr_sponsored_transfers); the fee model
    in effect on a transfer's date decides which model bills it, so a month split by a fee model change bills each
    part under its own model. The additional_payroll_groups line bills additional_payroll_group_fee_monthly_usd
    for each payroll group beyond included_payroll_groups. The implementation_fee line of implementation_fee_usd
    is billed once on the invoice for the go-live month, unless term_months is at least implementation_fee_waiver_min_term_months,
    in which case it is never billed. An early_termination_fee line is billed on the final invoice when the program
    terminates before the end of its current term: early_termination_fee_months of the monthly platform fee, limited
    to program_msr_months_left_in_term months; it is never billed at the end of a term for which notice was given
    in time. An ach_return_fee line is billed for each returned ACH remittance, pointing to the return. A line that
    comes to zero is not billed.
  eligibility:
  - id: one_line
    applies_to:
    - program_invoice_line
    kind: dedup
    condition: Each kind of invoice line is billed once per billing month and source.
    evidence_fields:
    - program_billing.billing_month
    - program_billing.invoice_line
    - program_billing.related_entry_id
    - program_billing.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_billing.billing_month
        - program_billing.invoice_line
      action_bindings:
        program_billing.billing_month: billing_month
        program_billing.invoice_line: invoice_line
    dedup_contract:
      table: program_billing
      mode: separate_record
      object_bindings:
        agreement_id: agreement_id
        billing_month: billing_month
        invoice_line: invoice_line
      duplicate_filters:
        event_type:
        - program_invoice_line
      distinct_fields:
      - related_entry_id
  params:
    per_tier:
      Paystride Program Starter:
        monthly_platform_fee_usd: =monthly_platform_fee_usd
        employer_paid_pepm_usd: =employer_paid_pepm_usd
        sponsored_instant_fee_usd: =sponsored_instant_fee_usd
        implementation_fee_usd: =implementation_fee_usd
      Paystride Program Growth:
        monthly_platform_fee_usd: =monthly_platform_fee_usd
        employer_paid_pepm_usd: =employer_paid_pepm_usd
        sponsored_instant_fee_usd: =sponsored_instant_fee_usd
        implementation_fee_usd: =implementation_fee_usd
      Paystride Program Professional:
        monthly_platform_fee_usd: =monthly_platform_fee_usd
        employer_paid_pepm_usd: =employer_paid_pepm_usd
        sponsored_instant_fee_usd: =sponsored_instant_fee_usd
        implementation_fee_usd: =implementation_fee_usd
      Paystride Program Enterprise:
        monthly_platform_fee_usd: =monthly_platform_fee_usd
        employer_paid_pepm_usd: =employer_paid_pepm_usd
        sponsored_instant_fee_usd: =sponsored_instant_fee_usd
        implementation_fee_usd: =implementation_fee_usd
      Paystride Program Enterprise Plus:
        monthly_platform_fee_usd: =monthly_platform_fee_usd
        employer_paid_pepm_usd: =employer_paid_pepm_usd
        sponsored_instant_fee_usd: =sponsored_instant_fee_usd
        implementation_fee_usd: =implementation_fee_usd
      Paystride Program Strategic:
        monthly_platform_fee_usd: =monthly_platform_fee_usd
        employer_paid_pepm_usd: =employer_paid_pepm_usd
        sponsored_instant_fee_usd: =sponsored_instant_fee_usd
        implementation_fee_usd: =implementation_fee_usd
  formula:
    pepm_line: employer_paid_pepm_usd * enrolled_active_workers
    groups_line: max(0, payroll_group_count - included_payroll_groups) * additional_payroll_group_fee_monthly_usd
    etf_line: min(early_termination_fee_months, program_msr_months_left_in_term) * monthly_platform_fee_usd
  measures:
  - program_msr_sponsored_transfers
  - program_msr_months_left_in_term
- id: program_evt_payments_and_credits
  subject:
  - program_invoice_payment
  - program_credit_memo
  - program_sla_credit
  rule: >-
    Each employer payment is applied to the invoice line or late charge it names, up to that line's unpaid amount;
    an unallocated payment is applied to the oldest unpaid line first, and payments never settle remittances. A
    credit memo points to the line it credits and never exceeds what is unpaid on it. When a month's measured availability_percent
    on the census is below sla_uptime_target_percent, the employer is given a service level credit, with reason
    sla_credit and pointing to that month's platform_fee line, of the percentage of sla_credit_ladder_percent for
    the lowest availability band reached, computed on the platform fee after any bundle discount. An SLA credit
    is granted only when the employer claims it within sla_credit_claim_window_days calendar days after the end
    of the affected month. Calendar days are counted from the first day of the month after the affected month, so
    a claim on the last day of the window, the affected month's last day plus the window, is in time. When go-live
    came later than go_live_target_business_days business days after the signed_date for reasons on Paystride's
    side, the implementation_fee line is credited go_live_delay_credit_percent of that fee; a delay caused by the
    employer's late payroll file earns nothing. A line billed in error is credited in full with reason billing_error.
    A courtesy late charge waiver credits the whole late charge under program_evt_late_charge. These other credits
    are credit memos. A billed line receives at most one credit memo of each reason.
  eligibility:
  - id: sla_claim_window
    applies_to:
    - program_sla_credit
    kind: time
    condition: An SLA credit is granted only when the employer claims it within sla_credit_claim_window_days calendar
      days after the end of the affected month.
    evidence_fields:
    - program_census.census_month
    - program_census.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_census.agreement_id
      action_bindings:
        program_census.agreement_id: agreement_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the end of the affected month
      anchor_source: program_census.census_month
      relation: not_after
      duration_source: variants.sla_credit_claim_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the first day of the month after the affected month, so a claim
        on the last day of the window, the affected month's last day plus the window, is in time.
      boundary: inclusive
  - id: one_credit_per_reason
    applies_to:
    - program_credit_memo
    - program_sla_credit
    kind: dedup
    condition: A billed line receives at most one credit memo of each reason.
    evidence_fields:
    - program_billing.related_entry_id
    - program_billing.credit_reason
    - program_billing.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_billing.related_entry_id
        - program_billing.credit_reason
      action_bindings:
        program_billing.related_entry_id: related_entry_id
        program_billing.credit_reason: credit_reason
    dedup_contract:
      table: program_billing
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
        credit_reason: credit_reason
      duplicate_filters:
        event_type:
        - program_credit_memo
        - program_sla_credit
      distinct_fields: []
  params:
    per_tier:
      Paystride Program Starter:
        sla_uptime_target_percent: =sla_uptime_target_percent
        go_live_delay_credit_percent: =go_live_delay_credit_percent
      Paystride Program Growth:
        sla_uptime_target_percent: =sla_uptime_target_percent
        go_live_delay_credit_percent: =go_live_delay_credit_percent
      Paystride Program Professional:
        sla_uptime_target_percent: =sla_uptime_target_percent
        go_live_delay_credit_percent: =go_live_delay_credit_percent
      Paystride Program Enterprise:
        sla_uptime_target_percent: =sla_uptime_target_percent
        go_live_delay_credit_percent: =go_live_delay_credit_percent
      Paystride Program Enterprise Plus:
        sla_uptime_target_percent: =sla_uptime_target_percent
        go_live_delay_credit_percent: =go_live_delay_credit_percent
      Paystride Program Strategic:
        sla_uptime_target_percent: =sla_uptime_target_percent
        go_live_delay_credit_percent: =go_live_delay_credit_percent
  formula:
    sla_credit: monthly_platform_fee_usd * sla_credit_ladder_percent / 100
- id: program_change_management
  subject:
  - program_amend
  - program_reband
  - program_renew
  - program_census_report
  rule: >-
    The employer reports one census per calendar month, with its eligible headcount; enrolled_active_workers and
    availability_percent are added from Paystride's own records, and a corrected census replaces nothing already
    billed. Program changes arrive as change requests from the employer's portal or desk call and take effect only
    on their effective_date. A program change or termination notice is accepted only from a requester whose role
    is listed in authorized_requester_roles. A program change is accepted only while the agreement status is contracted,
    implementing or live. A requested access percentage must lie between min_configurable_cap_percent and max_configurable_cap_percent
    of the tier and be a multiple of cap_step_percent; at most cap_change_max_per_12_months cap changes may be scheduled
    in any 365 days (program_msr_cap_changes_365d) and at most fee_model_change_max_per_12_months fee model changes
    (program_msr_fee_model_changes_365d); a request beyond these limits is declined, never partly applied. A change
    takes effect on the first day of the first pay period that begins at least change_effective_lead_business_days
    business days after the submitted_date; transfers already booked keep the terms in force when they were booked.
    A payroll group change sets the payroll group count from the effective date, and groups beyond the included
    number are billed under program_evt_monthly_invoice. A remittance method change is limited to the tier's remittance_methods_allowed.
    When rebanding_consecutive_months consecutive censuses (program_msr_out_of_band_months) fall outside the tier's
    headcount band, the program moves to the tier whose band contains the latest census headcount on the first day
    of the next billing month, up or down, without a request; when the new tier's max_configurable_cap_percent is
    below the configured percentage, the configured percentage is lowered to that maximum. On renewal_date a term
    with no termination notice renews for renewal_term_months.
  eligibility:
  - id: authorized_role
    applies_to:
    - program_amend
    kind: authorization
    condition: A program change or termination notice is accepted only from a requester whose role is listed in
      authorized_requester_roles.
    evidence_fields:
    - program_change_requests.requester_role
    - program_change_requests.change_request_id
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - program_change_requests.change_request_id
      action_bindings:
        program_change_requests.change_request_id: change_request_id
  - id: change_status
    applies_to:
    - program_amend
    kind: state
    condition: A program change is accepted only while the agreement status is contracted, implementing or live.
    evidence_fields:
    - program_agreements.status
    - program_agreements.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_agreements.agreement_id
      action_bindings:
        program_agreements.agreement_id: agreement_id
    state_contract:
      field: program_agreements.status
      allowed:
      - contracted
      - implementing
      - live
  params:
    per_tier:
      Paystride Program Starter:
        max_configurable_cap_percent: =max_configurable_cap_percent
        cap_change_max_per_12_months: =cap_change_max_per_12_months
        fee_model_change_max_per_12_months: =fee_model_change_max_per_12_months
      Paystride Program Growth:
        max_configurable_cap_percent: =max_configurable_cap_percent
        cap_change_max_per_12_months: =cap_change_max_per_12_months
        fee_model_change_max_per_12_months: =fee_model_change_max_per_12_months
      Paystride Program Professional:
        max_configurable_cap_percent: =max_configurable_cap_percent
        cap_change_max_per_12_months: =cap_change_max_per_12_months
        fee_model_change_max_per_12_months: =fee_model_change_max_per_12_months
      Paystride Program Enterprise:
        max_configurable_cap_percent: =max_configurable_cap_percent
        cap_change_max_per_12_months: =cap_change_max_per_12_months
        fee_model_change_max_per_12_months: =fee_model_change_max_per_12_months
      Paystride Program Enterprise Plus:
        max_configurable_cap_percent: =max_configurable_cap_percent
        cap_change_max_per_12_months: =cap_change_max_per_12_months
        fee_model_change_max_per_12_months: =fee_model_change_max_per_12_months
      Paystride Program Strategic:
        max_configurable_cap_percent: =max_configurable_cap_percent
        cap_change_max_per_12_months: =cap_change_max_per_12_months
        fee_model_change_max_per_12_months: =fee_model_change_max_per_12_months
  measures:
  - program_msr_cap_changes_365d
  - program_msr_fee_model_changes_365d
  - program_msr_out_of_band_months
- id: program_lifecycle
  subject:
  - program_kickoff
  - program_go_live
  - program_cancel
  - program_suspend
  - program_reinstate
  - program_termination_notice
  - program_terminate
  rule: >-
    Implementation starts when the employer's payroll contact and first test file arrive, and the program goes live
    when the first payroll file validates. An agreement is cancelled before implementation only while its status
    is contracted. The desk suspends only an agreement whose status is live. The desk suspends a live program when
    any schedule or employer-liable shortfall has been past due (program_msr_days_past_due) for suspension_past_due_calendar_days
    or more; while suspended, the employer's workers cannot take new transfers but recoveries continue. A suspended
    program is reinstated once every past-due remittance and late charge is paid when reinstatement_requires_full_cure
    is true. Termination is the employer's own decision, given in writing by an authorized requester. A termination
    notice is accepted only while the agreement status is live. A termination takes effect no earlier than termination_notice_days
    calendar days after the termination notice date. Calendar days are counted from the day after the termination_notice_date,
    so the earliest termination date is that date plus the notice days. The program terminates on the later of that
    date and the date the employer named, once the final deduction schedule is settled within termination_final_settlement_business_days
    business days; a termination effective before the end of the current term bills the early termination fee under
    program_evt_monthly_invoice, and one effective on or after the renewal_date bills none.
  eligibility:
  - id: suspend_from_live
    applies_to:
    - program_suspend
    kind: state
    condition: The desk suspends only an agreement whose status is live.
    evidence_fields:
    - program_agreements.status
    - program_agreements.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_agreements.agreement_id
      action_bindings:
        program_agreements.agreement_id: agreement_id
    state_contract:
      field: program_agreements.status
      allowed:
      - live
  - id: notice_from_live
    applies_to:
    - program_termination_notice
    kind: state
    condition: A termination notice is accepted only while the agreement status is live.
    evidence_fields:
    - program_agreements.status
    - program_agreements.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_agreements.agreement_id
      action_bindings:
        program_agreements.agreement_id: agreement_id
    state_contract:
      field: program_agreements.status
      allowed:
      - live
  - id: cancel_from_contracted
    applies_to:
    - program_cancel
    kind: state
    condition: An agreement is cancelled before implementation only while its status is contracted.
    evidence_fields:
    - program_agreements.status
    - program_agreements.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_agreements.agreement_id
      action_bindings:
        program_agreements.agreement_id: agreement_id
    state_contract:
      field: program_agreements.status
      allowed:
      - contracted
  - id: notice_period
    applies_to:
    - program_terminate
    kind: time
    condition: A termination takes effect no earlier than termination_notice_days calendar days after the termination
      notice date.
    evidence_fields:
    - program_agreements.termination_notice_date
    - program_agreements.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_agreements.agreement_id
      action_bindings:
        program_agreements.agreement_id: agreement_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the termination notice date
      anchor_source: program_agreements.termination_notice_date
      relation: not_before
      duration_source: variants.termination_notice_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the termination_notice_date, so the earliest termination
        date is that date plus the notice days.
      boundary: inclusive
  params:
    per_tier:
      Paystride Program Starter:
        suspension_past_due_calendar_days: =suspension_past_due_calendar_days
        termination_notice_days: =termination_notice_days
      Paystride Program Growth:
        suspension_past_due_calendar_days: =suspension_past_due_calendar_days
        termination_notice_days: =termination_notice_days
      Paystride Program Professional:
        suspension_past_due_calendar_days: =suspension_past_due_calendar_days
        termination_notice_days: =termination_notice_days
      Paystride Program Enterprise:
        suspension_past_due_calendar_days: =suspension_past_due_calendar_days
        termination_notice_days: =termination_notice_days
      Paystride Program Enterprise Plus:
        suspension_past_due_calendar_days: =suspension_past_due_calendar_days
        termination_notice_days: =termination_notice_days
      Paystride Program Strategic:
        suspension_past_due_calendar_days: =suspension_past_due_calendar_days
        termination_notice_days: =termination_notice_days
  measures:
