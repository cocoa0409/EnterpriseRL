- id: program_ext_termination_fee
  base_policy_refs:
  - program_lifecycle
  - program_evt_monthly_invoice
  - program_paycard_bundle
  overwrite:
  - base_policy: program_evt_monthly_invoice
    superseded_clause: 'An early_termination_fee line is billed on the final invoice when the program terminates before the end of its current term: early_termination_fee_months of the monthly platform fee, limited to program_msr_months_left_in_term months; it is never billed at the end of a term for which notice was given in time.'
    replaced_by: An early_termination_fee line is billed when the program terminates before the end of its current term, and it is never billed at the end of a term for which notice was given in time; for a notice given to take effect on the earliest termination date its amount is fixed and billed on the day the notice is accepted as these provisions settle it, a fee that comes to zero being recorded with the notice and not billed, and for any other notice it is billed on the final invoice at early_termination_fee_months of the monthly platform fee, limited to program_msr_months_left_in_term months.
  - base_policy: program_paycard_bundle
    superseded_clause: The discount applies only to the platform fee, never to per-worker, sponsored, implementation, termination or return fee lines, and an SLA credit for the same month is computed on the discounted fee.
    replaced_by: The discount applies only to the platform fee, never to per-worker, sponsored, implementation, termination or return fee lines, and an SLA credit for the same month is computed on the discounted fee, except that the per-worker fee, the early termination fee and the base of the service level credit for the latest census month are set by their own provisions, these provisions settling the early termination fee.
  trigger: on_request
  subject:
  - program_termination_notice
  computes: early_termination_fee
  target_tool: sign_termination_notice_c67c1163
  params:
    etf_period_days: 30
    basis_window_months: 3
    premium_package_extra_percent: 5
    year_three_months: 24
    year_two_months: 12
    year_three_multiplier: 0.4
    year_two_multiplier: 0.7
    sla_high_count: 2
    sla_low_count: 1
    sla_window_months: 6
    sla_high_multiplier: 0.5
    sla_low_multiplier: 0.8
    workforce_major_share: 0.2
    workforce_minor_share: 0.1
    workforce_major_multiplier: 0.5
    workforce_minor_multiplier: 0.85
  rule: 'This policy settles the early termination fee for a written termination notice the employer gives to take effect on the earliest termination date its notice period allows. The termination notice is the employer''s own act: the support agent works out and quotes the fee, and the authorized employer contact signs and gives the notice personally, the fee being billed on the day the notice is accepted. An early_termination_fee line is billed when the program terminates before the end of its current term, and it is never billed at the end of a term for which notice was given in time; for a notice given to take effect on the earliest termination date its amount is fixed and billed on the day the notice is accepted as these provisions settle it, a fee that comes to zero being recorded with the notice and not billed, and for any other notice it is billed on the final invoice at early_termination_fee_months of the monthly platform fee, limited to program_msr_months_left_in_term months. The discount applies only to the platform fee, never to per-worker, sponsored, implementation, termination or return fee lines, and an SLA credit for the same month is computed on the discounted fee, except that the per-worker fee, the early termination fee and the base of the service level credit for the latest census month are set by their own provisions, these provisions settling the early termination fee. The earliest termination date is the notice date plus termination_notice_days calendar days, and the months left are the whole periods of etf_period_days calendar days from that date to the renewal_date, counted down and never below zero. The early termination fee is the lesser of early_termination_fee_months and the months left, times the monthly charge of monthly_platform_fee_usd, rounded half up to the cent, and it is zero when no month is left. Where the early termination fee comes to zero, the termination notice is recorded and no early_termination_fee line is billed, a line that comes to zero not being billed. The adjustments below are applied in one fixed order: those that change what the monthly charge is made of come first, the monthly charge so formed is then multiplied by the months charged, and each multiplier is then applied to that product, the early termination fee being rounded half up to the cent as the last step. The monthly charge of the early termination fee follows the fee model: under the employer_paid fee model it adds to the platform fee the employer_paid_pepm lines entered on dates from which fewer than basis_window_months whole months have passed to today, a month counting as whole once the day of the month of the entry date is reached, or on the first day of the next month where that month has no such day, divided by basis_window_months; under the employer_sponsored fee model it adds the sponsored_instant_fees and sponsored_nbd_fees lines entered in that window, divided by basis_window_months; under the worker_paid fee model it is the platform fee alone. The platform fee part of the monthly charge of the early termination fee is reduced for a Payroll Card Program: where the employer holds a Payroll Card Program in live status with a launch_date on or before the notice date and held in the Paystride Paycard Program Premier or Paystride Paycard Program Elite package, it is reduced by paycard_bundle_discount_percent plus premium_package_extra_percent percent; where it holds such a live Payroll Card Program in any other package, it is reduced by paycard_bundle_discount_percent percent; otherwise it is not reduced. The early termination fee declines with the contract year: where at least year_three_months whole months have passed from the signed_date to the notice date, a month counting as whole only once the day of the month of the signed_date is reached, or on the first day of the next month where that month has no such day, the fee is multiplied by year_three_multiplier; where at least year_two_months but fewer than year_three_months have passed, by year_two_multiplier; otherwise it is not multiplied. Repeated service level breaches lower the early termination fee: where at least sla_high_count service level credits were booked on entry dates from which fewer than sla_window_months whole months have passed to today, a month counting as whole once the day of the month of the entry date is reached, or on the first day of the next month where that month has no such day, the fee is multiplied by sla_high_multiplier; where exactly sla_low_count was, by sla_low_multiplier; otherwise it is not multiplied. A smaller workforce lowers the early termination fee: the reduction is the highest eligible_headcount any census of the agreement shows less the eligible_headcount of the census with the latest census_month, divided by that highest headcount; where it is at least workforce_major_share, the fee is multiplied by workforce_major_multiplier; where it is at least workforce_minor_share but below workforce_major_share, by workforce_minor_multiplier; otherwise it is not multiplied. The early termination fee is billed, and the termination notice recorded with it, only after, where the remittance return booked most recently is the only remittance return booked that day and the deduction schedule it names carries no employer-liable shortfall notice, that schedule carries the late charge owed for the late-charge period it is in once its late-charge grace has passed.'
  prerequisite:
  - problem: program_ext_return_late_charge
    kind: state_gate
    gate: program_billing.related_entry_id
    form: state
    policy_source: The early termination fee is billed, and the termination notice recorded with it, only after, where the remittance return booked most recently is the only remittance return booked that day and the deduction schedule it names carries no employer-liable shortfall notice, that schedule carries the late charge owed for the late-charge period it is in once its late-charge grace has passed.
    condition: 'where the program_remittance_return with the latest entry_date is the only one of that entry_date and the schedule it names has no employer-liable program_shortfall_notice, and that schedule is past its original due_date plus late_charge_grace_business_days business days with an open amount: a program_late_charge pointing to that schedule for the late-charge period it is in; in every other case nothing is waited on'
    resolved_by: assess_return_late_charge_9954ff84
    effect: the late charge on the reinstated schedule stands in the billing records, so the early termination fee can be billed and the notice recorded
  cross_category:
  - category: paycard
    as: branch
    reads:
    - status
    - launch_date
    - variant_name
    note: termination_bundle takes its tier from the live Payroll Card Program launched by the notice date and its package.
  compute:
  - days_left: DAYS(NOW, F('renewal_date')) - P('termination_notice_days')
  - months_left: MX(0, days_left) // K('etf_period_days')
  - months_charged: MN(P('early_termination_fee_months'), months_left)
  - list_fee: P('monthly_platform_fee_usd')
  - worker_avg: SUM('program_billing','amount', within_months=K('basis_window_months'), date_field='entry_date', event_type='program_invoice_line', invoice_line='employer_paid_pepm') / K('basis_window_months')
  - sponsored_avg: (SUM('program_billing','amount', within_months=K('basis_window_months'), date_field='entry_date', event_type='program_invoice_line', invoice_line='sponsored_instant_fees') + SUM('program_billing','amount', within_months=K('basis_window_months'), date_field='entry_date', event_type='program_invoice_line', invoice_line='sponsored_nbd_fees')) / K('basis_window_months')
  - line_part: worker_avg if F('fee_model') == 'employer_paid' else (sponsored_avg if F('fee_model') == 'employer_sponsored' else 0)
  - card_launch: CFIELD('paycard','launch_date', status='live')
  - card_package: CFIELD('paycard','variant_name', status='live')
  - card_held: card_launch != None and card_launch != '' and card_launch <= NOW
  - bundle_pct: P('paycard_bundle_discount_percent') + K('premium_package_extra_percent') if (card_held and (card_package == 'Paystride Paycard Program Premier' or card_package == 'Paystride Paycard Program Elite')) else (P('paycard_bundle_discount_percent') if (card_held and card_package != 'Paystride Paycard Program Premier' and card_package != 'Paystride Paycard Program Elite') else 0)
  - monthly_charge: list_fee * (1 - bundle_pct / 100) + line_part
  - contract_months: MONTHS(F('signed_date'), NOW)
  - year_mult: K('year_three_multiplier') if contract_months >= K('year_three_months') else (K('year_two_multiplier') if contract_months >= K('year_two_months') else 1)
  - sla_count: COUNT('program_billing', within_months=K('sla_window_months'), date_field='entry_date', event_type='program_sla_credit')
  - sla_mult: K('sla_high_multiplier') if sla_count >= K('sla_high_count') else (K('sla_low_multiplier') if sla_count == K('sla_low_count') else 1)
  - peak_headcount: MAX('program_census','eligible_headcount')
  - latest_headcount: LATEST('program_census','eligible_headcount', date_field='census_month')
  - reduction: (peak_headcount - latest_headcount) / peak_headcount if peak_headcount > 0 else 0
  - work_mult: K('workforce_major_multiplier') if reduction >= K('workforce_major_share') else (K('workforce_minor_multiplier') if reduction >= K('workforce_minor_share') else 1)
  - result: RND(months_charged * monthly_charge * year_mult * sla_mult * work_mult + 0.000000001, 2)
  factors:
  - id: termination_fee_lines
    effect: method
    decides: line_part
    bindings:
    - worker_avg
    - sponsored_avg
    - line_part
    ladder:
    - when: fee model employer_paid
      method: add the employer_paid_pepm lines of the window divided by basis_window_months
    - when: fee model employer_sponsored
      method: add the sponsored fee lines of the window divided by basis_window_months
    - when: otherwise
      method: the platform fee alone
    baseline:
      line_part: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: termination_bundle
    effect: parameter
    decides: bundle_pct
    bindings:
    - card_launch
    - card_package
    - card_held
    - bundle_pct
    ladder:
    - when: a live Payroll Card Program launched by the notice date in the Premier or Elite package
      value: P('paycard_bundle_discount_percent') + K('premium_package_extra_percent')
    - when: such a live Payroll Card Program in any other package
      value: P('paycard_bundle_discount_percent')
    - when: otherwise
      value: '0'
    baseline:
      bundle_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: paycard
  - id: contract_year
    effect: parameter
    decides: year_mult
    bindings:
    - contract_months
    - year_mult
    ladder:
    - when: at least year_three_months whole months from signed_date to the notice date
      value: K('year_three_multiplier')
    - when: at least year_two_months but fewer than year_three_months
      value: K('year_two_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      year_mult: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: breach_relief
    effect: parameter
    decides: sla_mult
    bindings:
    - sla_count
    - sla_mult
    ladder:
    - when: at least sla_high_count service level credits within sla_window_months whole months
      value: K('sla_high_multiplier')
    - when: exactly sla_low_count such credit
      value: K('sla_low_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      sla_mult: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: workforce_reduction
    effect: parameter
    decides: work_mult
    bindings:
    - peak_headcount
    - latest_headcount
    - reduction
    - work_mult
    ladder:
    - when: reduction from the highest census headcount at least workforce_major_share
      value: K('workforce_major_multiplier')
    - when: reduction at least workforce_minor_share but below workforce_major_share
      value: K('workforce_minor_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      work_mult: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The earliest termination date is the notice date plus termination_notice_days calendar days, and the months left are the whole periods of etf_period_days calendar days from that date to the renewal_date, counted down and never below zero. The early termination fee is the lesser of early_termination_fee_months and the months left, times the monthly charge of monthly_platform_fee_usd, rounded half up to the cent, and it is zero when no month is left.
    params:
    - termination_notice_days
    - early_termination_fee_months
    - monthly_platform_fee_usd
    - etf_period_days
  inputs:
    history:
    - table: program_billing
      aggregate: count
      field: billing_entry_id
      within_months: 12
      filters:
        event_type: program_late_charge
    - table: program_billing
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: program_invoice_line
    - table: program_census
      aggregate: max
      field: eligible_headcount
      filters: {}
    cross_category:
    - paycard
