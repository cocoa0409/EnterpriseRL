- id: program_paycard_bundle
  subject:
  - program_invoice_line
  rule: >-
    Holding a Paystride Payroll Card Program changes the platform fee: for a billing month in which program_msr_paycard_full_month
    is true, the platform_fee line is reduced by paycard_bundle_discount_percent, rounded to the nearest cent. The
    discount applies only to the platform fee, never to per-worker, sponsored, implementation, termination or return
    fee lines, and an SLA credit for the same month is computed on the discounted fee. A month in which the employer
    held no Payroll Card Program for the whole month earns no discount, and holding an Instant Pay Disbursement
    service earns none.
  eligibility: []
  params:
    per_tier:
      Paystride Program Starter:
        paycard_bundle_discount_percent: =paycard_bundle_discount_percent
      Paystride Program Growth:
        paycard_bundle_discount_percent: =paycard_bundle_discount_percent
      Paystride Program Professional:
        paycard_bundle_discount_percent: =paycard_bundle_discount_percent
      Paystride Program Enterprise:
        paycard_bundle_discount_percent: =paycard_bundle_discount_percent
      Paystride Program Enterprise Plus:
        paycard_bundle_discount_percent: =paycard_bundle_discount_percent
      Paystride Program Strategic:
        paycard_bundle_discount_percent: =paycard_bundle_discount_percent
  formula:
    platform_fee_line: round(monthly_platform_fee_usd * (1 - paycard_bundle_discount_percent / 100), 2) if program_msr_paycard_full_month
      else monthly_platform_fee_usd
  measures:
  - program_msr_paycard_full_month
extended_policies:
- id: program_ext_worker_fee_rerate
  base_policy_refs:
  - program_evt_payments_and_credits
  - program_evt_monthly_invoice
  - program_paycard_bundle
  overwrite:
  - base_policy: program_evt_monthly_invoice
    superseded_clause: Under the employer_paid fee model the employer_paid_pepm line is employer_paid_pepm_usd times the month's enrolled_active_workers on the census.
    replaced_by: Under the employer_paid fee model the employer_paid_pepm line bills the per-worker fee these provisions settle, which for a month with none of the adjustments below is employer_paid_pepm_usd times the month's enrolled_active_workers on the census.
  - base_policy: program_paycard_bundle
    superseded_clause: The discount applies only to the platform fee, never to per-worker, sponsored, implementation, termination or return fee lines, and an SLA credit for the same month is computed on the discounted fee.
    replaced_by: The discount applies only to the platform fee, never to per-worker, sponsored, implementation, termination or return fee lines, and an SLA credit for the same month is computed on the discounted fee, except that the per-worker fee, the early termination fee and the base of the service level credit for the latest census month are set by their own provisions, these provisions settling the per-worker fee.
  - base_policy: program_evt_payments_and_credits
    superseded_clause: A line billed in error is credited in full with reason billing_error.
    replaced_by: A line billed in error is credited in full with reason billing_error, except the most recently billed per-worker fee line, on which the billing-error credit is the amount billed above the per-worker fee as these provisions settle it.
  trigger: state_due
  subject:
  - program_credit_memo
  computes: credit_amount
  target_tool: credit_worker_fee_overbilling_e0c50836
  params:
    graduated_first_band_workers: 1000
    graduated_second_band_workers: 5000
    second_band_rate_share: 0.85
    third_band_rate_share: 0.7
    proration_month_days: 30
    bundle_discount_premier_percent: 10
    bundle_discount_other_percent: 5
    term_long_months: 36
    term_mid_months: 24
    term_discount_long_percent: 5
    term_discount_mid_percent: 3
    launch_first_months: 6
    launch_second_months: 12
    launch_discount_first_percent: 10
    launch_discount_second_percent: 5
    adoption_high_share: 0.6
    adoption_mid_share: 0.3
    adoption_high_percent: 4
    adoption_mid_percent: 2
  rule: 'This policy settles the per-worker fee line most recently billed on the agreement, the employer_paid_pepm line with the latest billing_month, and the billing-error credit owed on it. Under the employer_paid fee model the employer_paid_pepm line bills the per-worker fee these provisions settle, which for a month with none of the adjustments below is employer_paid_pepm_usd times the month''s enrolled_active_workers on the census. The per-worker fee for a billing month is employer_paid_pepm_usd times the enrolled_active_workers on that month''s census. The billing-error credit is the amount billed on the per-worker fee line above the per-worker fee, never more than what is still unpaid on that line, the line amount less the payments and credits pointing to it; no credit is booked when that amount is not above zero, and a line that already carries a billing-error credit receives no second one. The per-worker fee is rounded half up to the cent once, as the last step of its computation. The adjustments below are applied in one fixed order: an adjustment that changes how the fee is worked out comes first, a multiplier comes next, and the discount percentages are added together and taken off the result once. The part of the month billed follows the date the per-worker fee began to apply, every month counting as proration_month_days days: where the most recent change of the fee model to employer_paid that took effect has an effective_date later than the first day of the billing month and fewer than proration_month_days days after it, the fee is multiplied by proration_month_days less the days from the first day of the month to that effective_date, divided by proration_month_days; where no such effective_date falls in that span and the go_live_date is later than the first day of the billing month and fewer than proration_month_days days after it, the fee is multiplied in the same way counting from the go_live_date; otherwise the whole month is billed. The workers are billed in graduated bands of the month''s enrolled_active_workers: where they exceed graduated_second_band_workers, the first graduated_first_band_workers workers are billed at employer_paid_pepm_usd, the workers above graduated_first_band_workers up to graduated_second_band_workers at second_band_rate_share of it and the workers above graduated_second_band_workers at third_band_rate_share of it; where they exceed graduated_first_band_workers but not graduated_second_band_workers, the first graduated_first_band_workers workers are billed at employer_paid_pepm_usd and the rest at second_band_rate_share of it; otherwise every enrolled worker is billed at employer_paid_pepm_usd. A Paystride Payroll Card Program discounts the per-worker fee: where the employer''s Payroll Card Program in live status has a launch_date on or before the first day of the billing month and is held in the Paystride Paycard Program Premier or Paystride Paycard Program Elite package, the discount is bundle_discount_premier_percent percent; where such a live program has a launch_date on or before that day and is held in any other package, the discount is bundle_discount_other_percent percent; otherwise, including when the employer holds no live Payroll Card Program, there is no card bundle discount. A longer commitment discounts the per-worker fee by the whole months from the signed_date to the renewal_date that ends the current term, a month counting as whole only once the day of the month of the signed_date is reached, or on the first day of the next month where that month has no such day: where they are at least term_long_months, the discount is term_discount_long_percent percent; where they are at least term_mid_months but fewer than term_long_months, it is term_discount_mid_percent percent; otherwise there is no term discount. Launch pricing discounts the per-worker fee by the whole months from the go_live_date to the first day of the billing month, a month counting as whole only once the day of the month of the go_live_date is reached, or on the first day of the next month where that month has no such day: where fewer than launch_first_months whole months have passed, the discount is launch_discount_first_percent percent; where at least launch_first_months but fewer than launch_second_months have passed, it is launch_discount_second_percent percent; otherwise there is no launch discount. Workforce adoption discounts the per-worker fee by the share of the month''s eligible_headcount that its enrolled_active_workers make up on the census, a census with no eligible headcount giving a share of zero: where the share is at least adoption_high_share, the discount is adoption_high_percent percent; where it is at least adoption_mid_share but below adoption_high_share, it is adoption_mid_percent percent; otherwise there is no adoption discount. The discount applies only to the platform fee, never to per-worker, sponsored, implementation, termination or return fee lines, and an SLA credit for the same month is computed on the discounted fee, except that the per-worker fee, the early termination fee and the base of the service level credit for the latest census month are set by their own provisions, these provisions settling the per-worker fee. A line billed in error is credited in full with reason billing_error, except the most recently billed per-worker fee line, on which the billing-error credit is the amount billed above the per-worker fee as these provisions settle it.'
  prerequisite: []
  cross_category:
  - category: paycard
    as: branch
    reads:
    - status
    - launch_date
    - variant_name
    note: card_bundle_depth takes its tier from the live Payroll Card Program launch_date and package of the same employer.
  compute:
  - bill_month: LATEST('program_billing','billing_month', date_field='billing_month', event_type='program_invoice_line', invoice_line='employer_paid_pepm')
  - line_id: LATEST('program_billing','billing_entry_id', date_field='billing_month', event_type='program_invoice_line', invoice_line='employer_paid_pepm')
  - billed_amount: SUM('program_billing','amount', billing_entry_id=line_id)
  - prior_error_count: COUNT('program_billing', event_type='program_credit_memo', credit_reason='billing_error', related_entry_id=line_id)
  - line_unpaid: billed_amount - SUM('program_billing','amount', event_type='program_invoice_payment', related_entry_id=line_id) - SUM('program_billing','amount', event_type='program_credit_memo', related_entry_id=line_id) - SUM('program_billing','amount', event_type='program_sla_credit', related_entry_id=line_id)
  - month_start: bill_month + '-01' if bill_month else NOW
  - enrolled: SUM('program_census','enrolled_active_workers', census_month=bill_month)
  - std_rate: P('employer_paid_pepm_usd')
  - band_workers: SUM('program_census','enrolled_active_workers', census_month=bill_month)
  - graded_fee: (K('graduated_first_band_workers') * std_rate + (K('graduated_second_band_workers') - K('graduated_first_band_workers')) * std_rate * K('second_band_rate_share') + (band_workers - K('graduated_second_band_workers')) * std_rate * K('third_band_rate_share')) if band_workers > K('graduated_second_band_workers') else ((K('graduated_first_band_workers') * std_rate + (band_workers - K('graduated_first_band_workers')) * std_rate * K('second_band_rate_share')) if band_workers > K('graduated_first_band_workers') else std_rate * band_workers)
  - model_start: LATEST('program_change_requests','effective_date', date_field='effective_date', request_type='fee_model_change', requested_fee_model='employer_paid', request_status='effective')
  - days_to_model: DAYS(month_start, model_start) if model_start else 0
  - days_to_live: DAYS(month_start, F('go_live_date')) if F('go_live_date') else 0
  - billed_share: (K('proration_month_days') - days_to_model) / K('proration_month_days') if (days_to_model > 0 and days_to_model < K('proration_month_days')) else ((K('proration_month_days') - days_to_live) / K('proration_month_days') if (days_to_live > 0 and days_to_live < K('proration_month_days')) else 1)
  - card_launch: CFIELD('paycard','launch_date', status='live')
  - card_package: CFIELD('paycard','variant_name', status='live')
  - bundle_pct: K('bundle_discount_premier_percent') if ((card_launch != None and card_launch != '' and card_launch <= month_start) and (card_package == 'Paystride Paycard Program Premier' or card_package == 'Paystride Paycard Program Elite')) else (K('bundle_discount_other_percent') if ((card_launch != None and card_launch != '' and card_launch <= month_start) and card_package != 'Paystride Paycard Program Premier' and card_package != 'Paystride Paycard Program Elite') else 0)
  - commit_months: MONTHS(F('signed_date'), F('renewal_date'))
  - term_pct: K('term_discount_long_percent') if commit_months >= K('term_long_months') else (K('term_discount_mid_percent') if commit_months >= K('term_mid_months') else 0)
  - months_live: MONTHS(F('go_live_date'), month_start)
  - launch_pct: K('launch_discount_first_percent') if months_live < K('launch_first_months') else (K('launch_discount_second_percent') if months_live < K('launch_second_months') else 0)
  - adopt_enrolled: SUM('program_census','enrolled_active_workers', census_month=bill_month)
  - eligible: SUM('program_census','eligible_headcount', census_month=bill_month)
  - adoption_share: adopt_enrolled / eligible if eligible > 0 else 0
  - adoption_pct: K('adoption_high_percent') if adoption_share >= K('adoption_high_share') else (K('adoption_mid_percent') if adoption_share >= K('adoption_mid_share') else 0)
  - worker_fee: RND(graded_fee * billed_share * (1 - (bundle_pct + term_pct + launch_pct + adoption_pct) / 100) + 0.000000001, 2)
  - result: RND(MX(0, MN(line_unpaid, billed_amount - worker_fee)) + 0.000000001, 2) if prior_error_count == 0 else 0
  factors:
  - id: proration_anchor
    effect: method
    decides: billed_share
    bindings:
    - model_start
    - days_to_model
    - days_to_live
    - billed_share
    ladder:
    - when: the most recent effective change of the fee model to employer_paid has an effective_date later than the first day of the billing month and fewer than proration_month_days days after it
      method: the fee is multiplied by proration_month_days less the days from the first day of the month to that effective_date, divided by proration_month_days
    - when: no such effective_date falls in that span and the go_live_date is later than the first day of the billing month and fewer than proration_month_days days after it
      method: the fee is multiplied in the same way counting from the go_live_date
    - when: otherwise
      method: the whole month is billed
    baseline:
      billed_share: '1'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: enrollment_bands
    effect: method
    decides: graded_fee
    bindings:
    - band_workers
    - graded_fee
    ladder:
    - when: enrolled_active_workers on the month census exceed graduated_second_band_workers
      method: the first graduated_first_band_workers workers at employer_paid_pepm_usd, the next band up to graduated_second_band_workers at second_band_rate_share of it, the rest at third_band_rate_share of it
    - when: enrolled_active_workers exceed graduated_first_band_workers but not graduated_second_band_workers
      method: the first graduated_first_band_workers workers at employer_paid_pepm_usd and the rest at second_band_rate_share of it
    - when: otherwise
      method: every enrolled worker at employer_paid_pepm_usd
    baseline:
      graded_fee: std_rate * enrolled
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: card_bundle_depth
    effect: parameter
    decides: bundle_pct
    bindings:
    - card_launch
    - card_package
    - bundle_pct
    ladder:
    - when: a live Payroll Card Program launched on or before the first day of the billing month and held in the Premier or Elite package
      value: K('bundle_discount_premier_percent')
    - when: a live Payroll Card Program launched on or before that day and held in any other package
      value: K('bundle_discount_other_percent')
    - when: otherwise
      value: '0'
    baseline:
      bundle_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: paycard
  - id: commitment_term
    effect: parameter
    decides: term_pct
    bindings:
    - commit_months
    - term_pct
    ladder:
    - when: at least term_long_months whole months from the signed_date to the renewal_date
      value: K('term_discount_long_percent')
    - when: at least term_mid_months but fewer than term_long_months such months
      value: K('term_discount_mid_percent')
    - when: otherwise
      value: '0'
    baseline:
      term_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: launch_pricing
    effect: parameter
    decides: launch_pct
    bindings:
    - months_live
    - launch_pct
    ladder:
    - when: fewer than launch_first_months whole months from the go_live_date to the first day of the billing month
      value: K('launch_discount_first_percent')
    - when: at least launch_first_months but fewer than launch_second_months whole months
      value: K('launch_discount_second_percent')
    - when: otherwise
      value: '0'
    baseline:
      launch_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: adoption_level
    effect: parameter
    decides: adoption_pct
    bindings:
    - adopt_enrolled
    - eligible
    - adoption_share
    - adoption_pct
    ladder:
    - when: enrolled share of eligible headcount at least adoption_high_share
      value: K('adoption_high_percent')
    - when: share at least adoption_mid_share but below adoption_high_share
      value: K('adoption_mid_percent')
    - when: otherwise
      value: '0'
    baseline:
      adoption_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The per-worker fee for a billing month is employer_paid_pepm_usd times the enrolled_active_workers on that month's census. The billing-error credit is the amount billed on the per-worker fee line above the per-worker fee, never more than what is still unpaid on that line, the line amount less the payments and credits pointing to it; no credit is booked when that amount is not above zero, and a line that already carries a billing-error credit receives no second one. The per-worker fee is rounded half up to the cent once, as the last step of its computation.
