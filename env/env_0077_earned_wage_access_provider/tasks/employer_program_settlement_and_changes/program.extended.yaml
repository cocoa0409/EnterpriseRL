    credit_gap: 'A breach in consecutive months raises the credit further: where the earlier service level credit with the latest billing_month is for the month immediately before the claimed month, the percentage is multiplied by consecutive_adjacent_multiplier; where it is for a month consecutive_near_months or fewer months before the claimed month but not the month immediately before, by consecutive_near_multiplier; otherwise, including when no earlier service level credit exists, it is not multiplied.'
    consecutive_mult: 'A breach in consecutive months raises the credit further: where the earlier service level credit with the latest billing_month is for the month immediately before the claimed month, the percentage is multiplied by consecutive_adjacent_multiplier; where it is for a month consecutive_near_months or fewer months before the claimed month but not the month immediately before, by consecutive_near_multiplier; otherwise, including when no earlier service level credit exists, it is not multiplied.'
    live_months: 'The months just after go-live are a stabilization period with reduced credits: where fewer than stabilization_first_months whole months have passed from the go_live_date to the first day of the month, a month counting as whole only once the day of the month of the go_live_date is reached, or on the first day of the next month where that month has no such day, the percentage is multiplied by stabilization_first_multiplier; where at least stabilization_first_months but fewer than stabilization_second_months have passed, by stabilization_second_multiplier; otherwise it is not multiplied.'
    stabilization_mult: 'The months just after go-live are a stabilization period with reduced credits: where fewer than stabilization_first_months whole months have passed from the go_live_date to the first day of the month, a month counting as whole only once the day of the month of the go_live_date is reached, or on the first day of the next month where that month has no such day, the percentage is multiplied by stabilization_first_multiplier; where at least stabilization_first_months but fewer than stabilization_second_months have passed, by stabilization_second_multiplier; otherwise it is not multiplied.'
    credit_pct: 'The adjustments below are combined in one fixed order: what they add to the credit base is added first, the credit percentage is then multiplied by each multiplier, and the resulting percentage is applied once to the credit base so formed.'
    result: For the latest census month the service level credit is the credit percentage applied to the credit base and rounded half up to the cent, and no credit is given when that month's availability_percent is not below sla_uptime_target_percent.
- id: program_ext_shortfall_late_charge
  base_policy_refs:
  - program_evt_late_charge
  - program_evt_shortfall
  - program_evt_remittance
  overwrite:
  - base_policy: program_evt_late_charge
    superseded_clause: An overdue item is a deduction schedule, or an employer-liable shortfall notice, whose open amount remains after its due_date.
    replaced_by: An overdue item is a deduction schedule, or an employer-liable shortfall notice, whose open amount remains after its due_date; a deduction schedule whose unremitted part stands as an employer-liable shortfall notice is charged through that notice, from the notice's due_date, and is not charged as a schedule as well.
  - base_policy: program_evt_late_charge
    superseded_clause: The late charge for a period is the greater of late_charge_minimum_usd and late_charge_monthly_rate_percent of the item's open amount on the first day of that period, rounded to the nearest cent;
    replaced_by: The late charge for a period is the greater of late_charge_minimum_usd and late_charge_monthly_rate_percent of the item's open amount on the first day of that period, rounded to the nearest cent, for every overdue item except the employer-liable shortfall notice and the reinstated deduction schedule that the provisions on those two late charges select, these provisions settling the former.
  trigger: state_due
  subject:
  - program_late_charge
  computes: charge_amount
  target_tool: assess_shortfall_late_charge_82f1f096
  params:
    frequency_high_count: 3
    frequency_mid_count: 2
    frequency_window_months: 12
    frequency_high_points: 0.5
    frequency_mid_points: 0.25
    deminimis_open_usd: 25.0
    dpd_high_days: 30
    dpd_mid_days: 10
    dpd_high_points: 0.5
    dpd_mid_points: 0.25
    balance_high_usd: 40000
    balance_mid_usd: 10000
    balance_high_points: 0.15
    balance_mid_points: 0.1
    concurrent_high_usd: 40000
    concurrent_high_points: 0.2
    concurrent_mid_points: 0.1
    prior_window_months: 12
    prior_high_count: 2
    prior_low_count: 1
    prior_high_points: 0.5
    prior_low_points: 0.25
  rule: 'This policy prices the late charge on the employer-liable shortfall notice booked most recently on the agreement, when it is the only employer-liable notice booked that day and the only employer-liable notice on the deduction schedule it concerns, and that schedule carries no remittance return; in any other case this policy books nothing. An overdue item is a deduction schedule, or an employer-liable shortfall notice, whose open amount remains after its due_date; a deduction schedule whose unremitted part stands as an employer-liable shortfall notice is charged through that notice, from the notice''s due_date, and is not charged as a schedule as well. The late charge for a period is the greater of late_charge_minimum_usd and late_charge_monthly_rate_percent of the item''s open amount on the first day of that period, rounded to the nearest cent, for every overdue item except the employer-liable shortfall notice and the reinstated deduction schedule that the provisions on those two late charges select, these provisions settling the former. A late charge is booked on a shortfall notice only where the notice has an open amount of at least the de minimis amount, deminimis_open_usd; a notice with a smaller open amount carries no late charge and no line is booked for it. The open amount of the shortfall notice is the open amount of the deduction schedule it concerns: the schedule amount less the remittances and write-offs pointing to that schedule, plus the remittance returns pointing to it, as the records stand on the day the charge is booked. The late charge on the shortfall notice is the greater of late_charge_minimum_usd and the percentage charge, which is the rate of late_charge_monthly_rate_percent percent applied to that open amount and rounded half up to the cent. The adjustments below are applied in one fixed order for a shortfall notice the employer is liable for: the percentage points they add are added to the rate first, the rate so formed is applied to the open amount and rounded half up to the cent, and the way the late charge is worked out is then applied. How the late charge on a shortfall notice is worked out follows the reason the shortfall stands under: for a notice with shortfall_reason deducted_not_remitted, money deducted from workers'' pay and kept, the late charge is late_charge_minimum_usd plus the percentage charge; for a notice with shortfall_reason payroll_processing_error or deduction_not_taken, it is the percentage charge alone, with no minimum; for a notice with any other reason it is the greater of late_charge_minimum_usd and the percentage charge. Repeated employer-liable shortfalls add to the rate on a shortfall notice: where at least frequency_high_count employer-liable shortfall notices, this one included, were booked on entry dates from which fewer than frequency_window_months whole months have passed to today, a month counting as whole once the day of the month of the entry date is reached, or on the first day of the next month where that month has no such day, frequency_high_points points are added; where exactly frequency_mid_count were, frequency_mid_points points are added; otherwise none. Days past due add to the rate on a shortfall notice: counted in calendar days from the notice''s due_date to today, where they are at least dpd_high_days, dpd_high_points percentage points are added; where they are at least dpd_mid_days but fewer than dpd_high_days, dpd_mid_points points are added; otherwise none. A larger overdue balance adds to the rate on a shortfall notice: where its open amount is at least balance_high_usd, balance_high_points points are added; where it is at least balance_mid_usd but below balance_high_usd, balance_mid_points points are added; otherwise none. Another delinquency open at the same time adds to the rate on a shortfall notice: where the deduction schedule named by the remittance return booked most recently, where that return is the only one booked that day, still has an open amount of at least concurrent_high_usd, concurrent_high_points points are added; where that open amount is above zero but below concurrent_high_usd, concurrent_mid_points points are added; otherwise, including when there is no such item, none. Late charges already booked add to the rate on a shortfall notice: where at least prior_high_count late charges were booked on the agreement on entry dates from which fewer than prior_window_months whole months have passed to today, a month counting as whole once the day of the month of the entry date is reached, or on the first day of the next month where that month has no such day, prior_high_points points are added; where exactly prior_low_count was, prior_low_points points are added; otherwise none.'
  prerequisite: []
  cross_category: []
  compute:
  - notice_day: LATEST('program_settlements','entry_date', date_field='entry_date', event_type='program_shortfall_notice', liability='employer_liable')
  - notice_id: LATEST('program_settlements','settlement_entry_id', date_field='entry_date', event_type='program_shortfall_notice', liability='employer_liable')
  - sched_id: LATEST('program_settlements','schedule_entry_id', date_field='entry_date', event_type='program_shortfall_notice', liability='employer_liable')
  - in_scope: notice_id != None and COUNT('program_settlements', entry_date=notice_day, event_type='program_shortfall_notice', liability='employer_liable') == 1 and COUNT('program_settlements', schedule_entry_id=sched_id, event_type='program_shortfall_notice', liability='employer_liable') == 1 and COUNT('program_settlements', schedule_entry_id=sched_id, event_type='program_remittance_return') == 0
  - open_amt: SUM('program_settlements','amount', settlement_entry_id=sched_id) - SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_remittance') - SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_shortfall_writeoff') + SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_remittance_return')
  - base_rate: P('late_charge_monthly_rate_percent')
  - minimum: P('late_charge_minimum_usd')
  - liable_count: COUNT('program_settlements', within_months=K('frequency_window_months'), date_field='entry_date', event_type='program_shortfall_notice', liability='employer_liable')
  - freq_pts: K('frequency_high_points') if liable_count >= K('frequency_high_count') else (K('frequency_mid_points') if liable_count == K('frequency_mid_count') else 0)
  - notice_due: LATEST('program_settlements','due_date', date_field='entry_date', settlement_entry_id=notice_id)
  - days_past_due: DAYS(notice_due, NOW) if notice_due else 0
  - dpd_pts: K('dpd_high_points') if days_past_due >= K('dpd_high_days') else (K('dpd_mid_points') if days_past_due >= K('dpd_mid_days') else 0)
  - balance_open: SUM('program_settlements','amount', settlement_entry_id=sched_id) - SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_remittance') - SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_shortfall_writeoff') + SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_remittance_return')
  - balance_pts: K('balance_high_points') if balance_open >= K('balance_high_usd') else (K('balance_mid_points') if balance_open >= K('balance_mid_usd') else 0)
  - other_day: LATEST('program_settlements','entry_date', date_field='entry_date', event_type='program_remittance_return')
  - other_sched: LATEST('program_settlements','schedule_entry_id', date_field='entry_date', event_type='program_remittance_return')
  - other_open: (SUM('program_settlements','amount', settlement_entry_id=other_sched) - SUM('program_settlements','amount', schedule_entry_id=other_sched, event_type='program_remittance') - SUM('program_settlements','amount', schedule_entry_id=other_sched, event_type='program_shortfall_writeoff') + SUM('program_settlements','amount', schedule_entry_id=other_sched, event_type='program_remittance_return')) if (other_sched != None and COUNT('program_settlements', entry_date=other_day, event_type='program_remittance_return') == 1) else 0
  - conc_pts: K('concurrent_high_points') if other_open >= K('concurrent_high_usd') else (K('concurrent_mid_points') if other_open > 0 else 0)
  - prior_count: COUNT('program_billing', within_months=K('prior_window_months'), date_field='entry_date', event_type='program_late_charge')
  - prior_pts: K('prior_high_points') if prior_count >= K('prior_high_count') else (K('prior_low_points') if prior_count == K('prior_low_count') else 0)
  - rate: base_rate + freq_pts + dpd_pts + balance_pts + conc_pts + prior_pts
  - pct_charge: RND(open_amt * rate / 100 + 0.000000001, 2)
  - reason: LATEST('program_settlements','shortfall_reason', date_field='entry_date', settlement_entry_id=notice_id)
  - charge_rule: '''minimum_plus'' if reason == ''deducted_not_remitted'' else (''percentage_only'' if (reason == ''payroll_processing_error'' or reason == ''deduction_not_taken'') else ''greater_of'')'
  - charge: minimum + pct_charge if charge_rule == 'minimum_plus' else (pct_charge if charge_rule == 'percentage_only' else MX(minimum, pct_charge))
  - result: RND(charge + 0.000000001, 2) if (in_scope and open_amt >= K('deminimis_open_usd')) else 0
  factors:
  - id: culpability_method
    effect: method
    decides: charge_rule
    bindings:
    - reason
    - charge_rule
    ladder:
    - when: notice shortfall_reason deducted_not_remitted
      method: late_charge_minimum_usd plus the percentage charge
    - when: notice shortfall_reason payroll_processing_error or deduction_not_taken
      method: the percentage charge alone, with no minimum
    - when: otherwise
      method: the greater of late_charge_minimum_usd and the percentage charge
    baseline:
      charge_rule: '''greater_of'''
    evidence:
    - history
    cross_difficulty: null
  - id: liable_frequency
    effect: parameter
    decides: freq_pts
    bindings:
    - liable_count
    - freq_pts
    ladder:
    - when: at least frequency_high_count employer-liable notices within frequency_window_months whole months
      value: K('frequency_high_points')
    - when: exactly frequency_mid_count such notices
      value: K('frequency_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      freq_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: notice_days_past_due
    effect: parameter
    decides: dpd_pts
    bindings:
    - notice_due
    - days_past_due
    - dpd_pts
    ladder:
    - when: at least dpd_high_days calendar days past the notice due_date
      value: K('dpd_high_points')
    - when: at least dpd_mid_days but fewer than dpd_high_days
      value: K('dpd_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      dpd_pts: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: notice_overdue_balance
    effect: parameter
    decides: balance_pts
    bindings:
    - balance_open
    - balance_pts
    ladder:
    - when: open amount at least balance_high_usd
      value: K('balance_high_points')
    - when: open amount at least balance_mid_usd but below balance_high_usd
      value: K('balance_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      balance_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: notice_concurrent_delinquency
    effect: parameter
    decides: conc_pts
    bindings:
    - other_day
    - other_sched
    - other_open
    - conc_pts
    ladder:
    - when: the other item still open by at least concurrent_high_usd
      value: K('concurrent_high_points')
    - when: the other item open above zero but below concurrent_high_usd
      value: K('concurrent_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      conc_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: notice_prior_charges
    effect: parameter
    decides: prior_pts
    bindings:
    - prior_count
    - prior_pts
    ladder:
    - when: at least prior_high_count late charges within prior_window_months whole months
      value: K('prior_high_points')
    - when: exactly prior_low_count late charge
      value: K('prior_low_points')
    - when: otherwise
      value: '0'
    baseline:
      prior_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'The open amount of the shortfall notice is the open amount of the deduction schedule it concerns: the schedule amount less the remittances and write-offs pointing to that schedule, plus the remittance returns pointing to it, as the records stand on the day the charge is booked. The late charge on the shortfall notice is the greater of late_charge_minimum_usd and the percentage charge, which is the rate of late_charge_monthly_rate_percent percent applied to that open amount and rounded half up to the cent.'
    params:
    - late_charge_monthly_rate_percent
    - late_charge_minimum_usd
  inputs:
    history:
    - table: program_settlements
      aggregate: sum
      field: amount
      filters:
        event_type: program_remittance
    - table: program_settlements
      aggregate: count
      field: settlement_entry_id
      within_months: 12
      filters:
        event_type: program_shortfall_notice
        liability: employer_liable
    - table: program_billing
      aggregate: count
      field: billing_entry_id
      within_months: 12
      filters:
        event_type: program_late_charge
    cross_category: []
