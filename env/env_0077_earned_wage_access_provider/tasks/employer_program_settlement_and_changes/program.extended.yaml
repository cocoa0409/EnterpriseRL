events:
- type: program_contract
  target: program_agreements
  mutation: create
  meaning: An employer signs an Earned Wage Access Program Agreement; it opens in contracted status.
  grain: one row per agreement change
  fields:
    customer_id: the employer holding the agreement (foreign key -> customers)
    variant_name: the program tier held, as the official full tier name
    status: lifecycle state of the agreement (see the program charter lifecycle)
    signed_date: date the agreement was signed; the start of the term
    term_months: initial term signed
    renewal_date: date the current term ends and renews automatically unless notice was given
    fee_model: 'who pays workers'' transfer fees: the worker, the employer for a sponsored number of transfers,
      or the employer under a per-worker monthly fee'
    configured_cap_percent: access percentage the employer configured for its workers
    eligible_headcount: eligible employees on the latest monthly census
    payroll_group_count: payroll groups (pay schedules or legal entities) set up on the program
    payroll_provider: payroll system the program integrates with
    remittance_method: how the employer remits deducted amounts
    termination_notice_date: date written termination notice was received; empty when none
    remittance_receivable: 'deducted amounts the employer currently owes Paystride: deduction schedules less remittances
      and provider-absorbed shortfalls, plus returned remittances'
    fee_receivable: 'program charges the employer currently owes: invoice lines and late charges less payments and
      credit memos'
  triggers: []
- type: program_kickoff
  target: program_agreements
  mutation:
    transition:
      from: contracted
      to: implementing
  meaning: Implementation starts once the employer's payroll contact and first test file are received.
  grain: one row per agreement change
  fields:
    status: lifecycle state of the agreement (see the program charter lifecycle)
  triggers: []
- type: program_go_live
  target: program_agreements
  mutation:
    transition:
      from: implementing
      to: live
  meaning: The first payroll file validates and the employer's workers can enroll.
  grain: one row per agreement change
  fields:
    go_live_date: date the first payroll file was validated and workers could enroll; empty until live
  triggers: []
- type: program_cancel
  target: program_agreements
  mutation:
    transition:
      from: contracted
      to: terminated
  meaning: The employer cancels a signed agreement before implementation starts.
  grain: one row per agreement change
  fields:
    closed_date: date the agreement terminated; empty until terminated
  triggers: []
- type: program_suspend
  target: program_agreements
  mutation:
    transition:
      from: live
      to: suspended
  meaning: The desk suspends the program because a remittance stayed past due too long.
  grain: one row per agreement change
  fields:
    status: lifecycle state of the agreement (see the program charter lifecycle)
  triggers: []
- type: program_reinstate
  target: program_agreements
  mutation:
    transition:
      from: suspended
      to: live
  meaning: The desk reinstates a suspended program once the past-due amounts are cured.
  grain: one row per agreement change
  fields:
    status: lifecycle state of the agreement (see the program charter lifecycle)
  triggers: []
- type: program_termination_notice
  target: program_agreements
  mutation:
    transition:
      from: live
      to: terminating
  meaning: The employer gives written notice to terminate the agreement.
  grain: one row per agreement change
  fields:
    termination_notice_date: date written termination notice was received; empty when none
  triggers: []
- type: program_terminate
  target: program_agreements
  mutation:
    transition:
      from: terminating
      to: terminated
  meaning: The notice period ends and the agreement terminates after final settlement.
  grain: one row per agreement change
  fields:
    closed_date: date the agreement terminated; empty until terminated
  triggers: []
- type: program_amend
  target: program_agreements
  mutation: update
  meaning: >-
    A scheduled program change takes effect: access percentage, fee model, payroll groups or remittance method.
  grain: one row per agreement change
  fields:
    configured_cap_percent: access percentage the employer configured for its workers
    fee_model: 'who pays workers'' transfer fees: the worker, the employer for a sponsored number of transfers,
      or the employer under a per-worker monthly fee'
    payroll_group_count: payroll groups (pay schedules or legal entities) set up on the program
    remittance_method: how the employer remits deducted amounts
  triggers: []
- type: program_reband
  target: program_agreements
  mutation: update
  meaning: The program moves to the tier matching its census headcount.
  grain: one row per agreement change
  fields:
    variant_name: the program tier held, as the official full tier name
    eligible_headcount: eligible employees on the latest monthly census
    configured_cap_percent: access percentage the employer configured for its workers
  triggers: []
- type: program_renew
  target: program_agreements
  mutation: update
  meaning: The term renews automatically at its end date.
  grain: one row per agreement change
  fields:
    renewal_date: date the current term ends and renews automatically unless notice was given
  triggers: []
- type: program_deduction_schedule
  target: program_settlements
  meaning: >-
    The deduction file for one pay date and payroll group: the advances and fees Paystride asks the employer to
    deduct and remit.
  grain: one row per pay date and payroll group
  distinguish_by:
  - pay_date
  - payroll_group
  fields:
    entry_date: date the entry was booked
    pay_date: pay date of the payroll run the entry concerns
    payroll_group: payroll group code exactly as set up on the program (for example HRLY-BW-01)
    amount: size of the movement, always greater than zero; schedules and remittance returns add to and remittances
      and provider-absorbed write-offs subtract from the remittance receivable; a shortfall notice states the shortfall
      and moves nothing
    worker_count: workers covered by the entry
    due_date: on a schedule, the remittance due date; on an employer-liable shortfall notice, the date its cure
      is due; empty otherwise
  account: remittance_receivable
  direction: in
  triggers: []
- type: program_remittance
  target: program_settlements
  meaning: Money the employer remits against one deduction schedule.
  grain: one row per remittance received
  distinguish_by:
  - schedule_entry_id
  - entry_date
  - remittance_method
  fields:
    entry_date: date the entry was booked
    pay_date: pay date of the payroll run the entry concerns
    payroll_group: payroll group code exactly as set up on the program (for example HRLY-BW-01)
    amount: size of the movement, always greater than zero; schedules and remittance returns add to and remittances
      and provider-absorbed write-offs subtract from the remittance receivable; a shortfall notice states the shortfall
      and moves nothing
    schedule_entry_id: for every entry except a schedule, the settlement_entry_id of the deduction schedule it settles
      or concerns; empty on schedules
    remittance_method: method of a remittance or returned remittance; none otherwise
  account: remittance_receivable
  direction: out
  triggers: []
- type: program_remittance_return
  target: program_settlements
  meaning: An ACH remittance returned unpaid by the employer's bank, reinstating the amount due.
  grain: one row per returned remittance
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked
    pay_date: pay date of the payroll run the entry concerns
    payroll_group: payroll group code exactly as set up on the program (for example HRLY-BW-01)
    amount: size of the movement, always greater than zero; schedules and remittance returns add to and remittances
      and provider-absorbed write-offs subtract from the remittance receivable; a shortfall notice states the shortfall
      and moves nothing
    schedule_entry_id: for every entry except a schedule, the settlement_entry_id of the deduction schedule it settles
      or concerns; empty on schedules
    related_entry_id: for a remittance return the remittance returned; for a write-off the shortfall notice written
      off; empty otherwise
    remittance_method: method of a remittance or returned remittance; none otherwise
  account: remittance_receivable
  direction: in
  triggers:
  - event: program:program_invoice_line
    when:
      remittance_method: ach_debit_authorization
    map:
      invoice_line: ach_return_fee
      related_entry_id: settlement_entry_id
- type: program_shortfall_notice
  target: program_settlements
  meaning: The part of a deduction schedule not remitted, by reported reason, with who bears it.
  grain: one row per schedule and shortfall reason
  distinguish_by:
  - schedule_entry_id
  - shortfall_reason
  fields:
    entry_date: date the entry was booked
    pay_date: pay date of the payroll run the entry concerns
    payroll_group: payroll group code exactly as set up on the program (for example HRLY-BW-01)
    amount: size of the movement, always greater than zero; schedules and remittance returns add to and remittances
      and provider-absorbed write-offs subtract from the remittance receivable; a shortfall notice states the shortfall
      and moves nothing
    worker_count: workers covered by the entry
    schedule_entry_id: for every entry except a schedule, the settlement_entry_id of the deduction schedule it settles
      or concerns; empty on schedules
    shortfall_reason: reason on a shortfall notice or write-off; unreported when the employer gave none in time;
      none otherwise
    liability: who bears a shortfall; none on other entries
    due_date: on a schedule, the remittance due date; on an employer-liable shortfall notice, the date its cure
      is due; empty otherwise
  triggers: []
- type: program_shortfall_writeoff
  target: program_settlements
  meaning: A provider-absorbed shortfall removed from what the employer owes.
  grain: one row per shortfall notice written off
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked
    pay_date: pay date of the payroll run the entry concerns
    payroll_group: payroll group code exactly as set up on the program (for example HRLY-BW-01)
    amount: size of the movement, always greater than zero; schedules and remittance returns add to and remittances
      and provider-absorbed write-offs subtract from the remittance receivable; a shortfall notice states the shortfall
      and moves nothing
    schedule_entry_id: for every entry except a schedule, the settlement_entry_id of the deduction schedule it settles
      or concerns; empty on schedules
    related_entry_id: for a remittance return the remittance returned; for a write-off the shortfall notice written
      off; empty otherwise
    shortfall_reason: reason on a shortfall notice or write-off; unreported when the employer gave none in time;
      none otherwise
    liability: who bears a shortfall; none on other entries
  account: remittance_receivable
  direction: out
  triggers: []
- type: program_invoice_line
  target: program_billing
  meaning: One line of the employer's monthly program invoice, or a one-time charge billed on it.
  grain: one row per invoice line kind, billing month and source
  distinguish_by:
