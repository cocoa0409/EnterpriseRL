    adopt_enrolled: 'Workforce adoption discounts the per-worker fee by the share of the month''s eligible_headcount that its enrolled_active_workers make up on the census, a census with no eligible headcount giving a share of zero: where the share is at least adoption_high_share, the discount is adoption_high_percent percent; where it is at least adoption_mid_share but below adoption_high_share, it is adoption_mid_percent percent; otherwise there is no adoption discount.'
    eligible: 'Workforce adoption discounts the per-worker fee by the share of the month''s eligible_headcount that its enrolled_active_workers make up on the census, a census with no eligible headcount giving a share of zero: where the share is at least adoption_high_share, the discount is adoption_high_percent percent; where it is at least adoption_mid_share but below adoption_high_share, it is adoption_mid_percent percent; otherwise there is no adoption discount.'
    months_live: 'Launch pricing discounts the per-worker fee by the whole months from the go_live_date to the first day of the billing month, a month counting as whole only once the day of the month of the go_live_date is reached, or on the first day of the next month where that month has no such day: where fewer than launch_first_months whole months have passed, the discount is launch_discount_first_percent percent; where at least launch_first_months but fewer than launch_second_months have passed, it is launch_discount_second_percent percent; otherwise there is no launch discount.'
    launch_pct: 'Launch pricing discounts the per-worker fee by the whole months from the go_live_date to the first day of the billing month, a month counting as whole only once the day of the month of the go_live_date is reached, or on the first day of the next month where that month has no such day: where fewer than launch_first_months whole months have passed, the discount is launch_discount_first_percent percent; where at least launch_first_months but fewer than launch_second_months have passed, it is launch_discount_second_percent percent; otherwise there is no launch discount.'
    adoption_share: 'Workforce adoption discounts the per-worker fee by the share of the month''s eligible_headcount that its enrolled_active_workers make up on the census, a census with no eligible headcount giving a share of zero: where the share is at least adoption_high_share, the discount is adoption_high_percent percent; where it is at least adoption_mid_share but below adoption_high_share, it is adoption_mid_percent percent; otherwise there is no adoption discount.'
    adoption_pct: 'Workforce adoption discounts the per-worker fee by the share of the month''s eligible_headcount that its enrolled_active_workers make up on the census, a census with no eligible headcount giving a share of zero: where the share is at least adoption_high_share, the discount is adoption_high_percent percent; where it is at least adoption_mid_share but below adoption_high_share, it is adoption_mid_percent percent; otherwise there is no adoption discount.'
    worker_fee: 'The adjustments below are applied in one fixed order: an adjustment that changes how the fee is worked out comes first, a multiplier comes next, and the discount percentages are added together and taken off the result once.'
    result: The billing-error credit is the amount billed on the per-worker fee line above the per-worker fee, never more than what is still unpaid on that line, the line amount less the payments and credits pointing to it; no credit is booked when that amount is not above zero, and a line that already carries a billing-error credit receives no second one.
- id: program_ext_sla_claim_credit
  base_policy_refs:
  - program_evt_payments_and_credits
  - program_paycard_bundle
  - program_evt_monthly_invoice
  overwrite:
  - base_policy: program_evt_payments_and_credits
    superseded_clause: When a month's measured availability_percent on the census is below sla_uptime_target_percent, the employer is given a service level credit, with reason sla_credit and pointing to that month's platform_fee line, of the percentage of sla_credit_ladder_percent for the lowest availability band reached, computed on the platform fee after any bundle discount.
    replaced_by: When a month's measured availability_percent on the census is below sla_uptime_target_percent, the employer is given a service level credit, with reason sla_credit and pointing to that month's platform_fee line; for the latest census month its amount is settled by these provisions, and for an earlier month it is the percentage of sla_credit_ladder_percent for the lowest availability band reached, computed on the platform fee after any bundle discount.
  - base_policy: program_paycard_bundle
    superseded_clause: The discount applies only to the platform fee, never to per-worker, sponsored, implementation, termination or return fee lines, and an SLA credit for the same month is computed on the discounted fee.
    replaced_by: The discount applies only to the platform fee, never to per-worker, sponsored, implementation, termination or return fee lines, and an SLA credit for the same month is computed on the discounted fee, except that the per-worker fee, the early termination fee and the base of the service level credit for the latest census month are set by their own provisions, these provisions settling the base of the service level credit.
  trigger: on_request
  subject:
  - program_sla_credit
  computes: credit_amount
  target_tool: file_sla_credit_claim_b00aa839
  params:
    band_floor_threshold: 95.0
    band_low_threshold: 99.0
    band_floor_percent: 50
    band_low_percent: 25
    band_target_percent: 10
    recurrence_window_months: 6
    recurrence_high_count: 2
    recurrence_low_count: 1
    recurrence_two_multiplier: 1.2
    recurrence_one_multiplier: 1.1
    consecutive_near_months: 3
    consecutive_adjacent_multiplier: 1.15
    consecutive_near_multiplier: 1.05
    stabilization_first_months: 6
    stabilization_second_months: 12
    stabilization_first_multiplier: 0.75
    stabilization_second_multiplier: 0.9
    depth_high_points: 0.5
    depth_mid_points: 0.25
    depth_high_multiplier: 1.3
    depth_mid_multiplier: 1.15
  rule: 'This policy settles the service level credit the employer claims for the latest month on its census, the census entry with the latest census_month. The claim is the employer''s own act: the support agent works out and quotes the credit, and the authorized employer contact files the claim personally. When a month''s measured availability_percent on the census is below sla_uptime_target_percent, the employer is given a service level credit, with reason sla_credit and pointing to that month''s platform_fee line; for the latest census month its amount is settled by these provisions, and for an earlier month it is the percentage of sla_credit_ladder_percent for the lowest availability band reached, computed on the platform fee after any bundle discount. The discount applies only to the platform fee, never to per-worker, sponsored, implementation, termination or return fee lines, and an SLA credit for the same month is computed on the discounted fee, except that the per-worker fee, the early termination fee and the base of the service level credit for the latest census month are set by their own provisions, these provisions settling the base of the service level credit. For the latest census month the service level credit is the credit percentage applied to the credit base and rounded half up to the cent, and no credit is given when that month''s availability_percent is not below sla_uptime_target_percent. The credit percentage is band_floor_percent where availability_percent is below band_floor_threshold, band_low_percent where it is below band_low_threshold but not below band_floor_threshold, and band_target_percent where it is below sla_uptime_target_percent but not below band_low_threshold. Where the claimed month''s invoice carries no platform_fee line, as on a tier whose monthly platform fee is zero, or its platform_fee line carries billing-error credits equal to its whole amount, no service level credit is given under these provisions. The credit base is the amount of that month''s platform_fee line, after any bundle discount, less any billing-error credit booked against it. The adjustments below are combined in one fixed order: what they add to the credit base is added first, the credit percentage is then multiplied by each multiplier, and the resulting percentage is applied once to the credit base so formed. The fee lines the credit covers follow how the month was billed: where the month''s invoice carries an employer_paid_pepm line, the credit base adds that line''s amount less any billing-error credit booked against it; where it carries sponsored_instant_fees or sponsored_nbd_fees lines and no employer_paid_pepm line, the credit base adds those lines'' amounts less any billing-error credit booked against them; otherwise no fee line is added. The depth of the shortfall below the commitment raises the credit: the shortfall is sla_uptime_target_percent less the month''s availability_percent; where it is at least depth_high_points percentage points, the percentage is multiplied by depth_high_multiplier; where it is at least depth_mid_points but below depth_high_points, by depth_mid_multiplier; otherwise it is not multiplied. Repeated breaches raise the credit: where at least recurrence_high_count service level credits were booked on the agreement on entry dates from which fewer than recurrence_window_months whole months have passed to today, a month counting as whole once the day of the month of the entry date is reached, or on the first day of the next month where that month has no such day, the percentage is multiplied by recurrence_two_multiplier; where exactly recurrence_low_count was, by recurrence_one_multiplier; otherwise it is not multiplied. A breach in consecutive months raises the credit further: where the earlier service level credit with the latest billing_month is for the month immediately before the claimed month, the percentage is multiplied by consecutive_adjacent_multiplier; where it is for a month consecutive_near_months or fewer months before the claimed month but not the month immediately before, by consecutive_near_multiplier; otherwise, including when no earlier service level credit exists, it is not multiplied. The months just after go-live are a stabilization period with reduced credits: where fewer than stabilization_first_months whole months have passed from the go_live_date to the first day of the month, a month counting as whole only once the day of the month of the go_live_date is reached, or on the first day of the next month where that month has no such day, the percentage is multiplied by stabilization_first_multiplier; where at least stabilization_first_months but fewer than stabilization_second_months have passed, by stabilization_second_multiplier; otherwise it is not multiplied. A service level credit for a month is not fixed until the per-worker fee line billed for that month carries the billing-error credit owed on it for any amount billed above the per-worker fee.'
  prerequisite:
  - problem: program_ext_worker_fee_rerate
    kind: value_input
    gate: worker_net
    form: state
    policy_source: A service level credit for a month is not fixed until the per-worker fee line billed for that month carries the billing-error credit owed on it for any amount billed above the per-worker fee.
    condition: the employer_paid_pepm line of the claimed billing month has a program_credit_memo with credit_reason billing_error pointing to it for the amount billed above the per-worker fee, or no amount was billed above that fee
    resolved_by: credit_worker_fee_overbilling_e0c50836
    effect: the per-worker line's amount net of billing-error credits drops to the per-worker fee, which lowers worker_net and with it the credit base the service level credit is computed on
  cross_category: []
  compute:
  - claim_month: LATEST('program_census','census_month', date_field='census_month')
  - month_start: claim_month + '-01' if claim_month else NOW
  - availability: SUM('program_census','availability_percent', census_month=claim_month)
  - band_pct: K('band_floor_percent') if availability < K('band_floor_threshold') else (K('band_low_percent') if availability < K('band_low_threshold') else (K('band_target_percent') if availability < P('sla_uptime_target_percent') else 0))
  - platform_id: LATEST('program_billing','billing_entry_id', date_field='entry_date', event_type='program_invoice_line', invoice_line='platform_fee', billing_month=claim_month)
  - platform_lines: COUNT('program_billing', event_type='program_invoice_line', invoice_line='platform_fee', billing_month=claim_month)
  - platform_net: SUM('program_billing','amount', billing_entry_id=platform_id) - SUM('program_billing','amount', event_type='program_credit_memo', credit_reason='billing_error', related_entry_id=platform_id)
  - worker_line_id: LATEST('program_billing','billing_entry_id', date_field='entry_date', event_type='program_invoice_line', invoice_line='employer_paid_pepm', billing_month=claim_month)
  - worker_lines: COUNT('program_billing', event_type='program_invoice_line', invoice_line='employer_paid_pepm', billing_month=claim_month)
  - worker_net: SUM('program_billing','amount', event_type='program_invoice_line', invoice_line='employer_paid_pepm', billing_month=claim_month) - SUM('program_billing','amount', event_type='program_credit_memo', credit_reason='billing_error', related_entry_id=worker_line_id)
  - instant_id: LATEST('program_billing','billing_entry_id', date_field='entry_date', event_type='program_invoice_line', invoice_line='sponsored_instant_fees', billing_month=claim_month)
  - nbd_id: LATEST('program_billing','billing_entry_id', date_field='entry_date', event_type='program_invoice_line', invoice_line='sponsored_nbd_fees', billing_month=claim_month)
  - sponsored_lines: COUNT('program_billing', event_type='program_invoice_line', invoice_line='sponsored_instant_fees', billing_month=claim_month) + COUNT('program_billing', event_type='program_invoice_line', invoice_line='sponsored_nbd_fees', billing_month=claim_month)
  - sponsored_net: SUM('program_billing','amount', event_type='program_invoice_line', invoice_line='sponsored_instant_fees', billing_month=claim_month) + SUM('program_billing','amount', event_type='program_invoice_line', invoice_line='sponsored_nbd_fees', billing_month=claim_month) - SUM('program_billing','amount', event_type='program_credit_memo', credit_reason='billing_error', related_entry_id=instant_id) - SUM('program_billing','amount', event_type='program_credit_memo', credit_reason='billing_error', related_entry_id=nbd_id)
  - line_add: worker_net if worker_lines > 0 else (sponsored_net if (sponsored_lines > 0 and worker_lines == 0) else 0)
  - credit_base: platform_net + line_add
  - prior_credits: COUNT('program_billing', within_months=K('recurrence_window_months'), date_field='entry_date', event_type='program_sla_credit')
  - recurrence_mult: K('recurrence_two_multiplier') if prior_credits >= K('recurrence_high_count') else (K('recurrence_one_multiplier') if prior_credits == K('recurrence_low_count') else 1)
  - prev_credit_month: LATEST('program_billing','billing_month', date_field='billing_month', event_type='program_sla_credit')
  - credit_gap: MONTHS(prev_credit_month + '-01', month_start) if (prev_credit_month and claim_month) else 0
  - consecutive_mult: K('consecutive_adjacent_multiplier') if credit_gap == 1 else (K('consecutive_near_multiplier') if (credit_gap > 1 and credit_gap <= K('consecutive_near_months')) else 1)
  - live_months: MONTHS(F('go_live_date'), month_start)
  - stabilization_mult: K('stabilization_first_multiplier') if live_months < K('stabilization_first_months') else (K('stabilization_second_multiplier') if live_months < K('stabilization_second_months') else 1)
  - depth: P('sla_uptime_target_percent') - SUM('program_census','availability_percent', census_month=claim_month)
  - depth_mult: K('depth_high_multiplier') if depth >= K('depth_high_points') else (K('depth_mid_multiplier') if depth >= K('depth_mid_points') else 1)
  - credit_pct: band_pct * depth_mult * recurrence_mult * consecutive_mult * stabilization_mult
  - result: RND(credit_base * credit_pct / 100 + 0.000000001, 2) if (platform_lines > 0 and platform_net > 0) else 0
  factors:
  - id: covered_fee_lines
    effect: method
    decides: line_add
    bindings:
    - worker_line_id
    - worker_lines
    - worker_net
    - instant_id
    - nbd_id
    - sponsored_lines
    - sponsored_net
    - line_add
    ladder:
    - when: the month's invoice carries an employer_paid_pepm line
      method: the credit base adds that line's amount less billing-error credits against it
    - when: the month's invoice carries sponsored fee lines and no employer_paid_pepm line
      method: the credit base adds the sponsored lines' amounts less billing-error credits against them
    - when: otherwise
      method: no fee line is added
    baseline:
      line_add: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: downtime_depth
    effect: parameter
    decides: depth_mult
    bindings:
    - depth
    - depth_mult
    ladder:
    - when: availability at least depth_high_points percentage points below sla_uptime_target_percent
      value: K('depth_high_multiplier')
    - when: at least depth_mid_points but fewer than depth_high_points points below it
      value: K('depth_mid_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      depth_mult: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: breach_recurrence
    effect: parameter
    decides: recurrence_mult
    bindings:
    - prior_credits
    - recurrence_mult
    ladder:
    - when: at least recurrence_high_count service level credits booked within recurrence_window_months whole months
      value: K('recurrence_two_multiplier')
    - when: exactly recurrence_low_count such credit
      value: K('recurrence_one_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      recurrence_mult: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: consecutive_breach
    effect: parameter
    decides: consecutive_mult
    bindings:
    - prev_credit_month
    - credit_gap
    - consecutive_mult
    ladder:
    - when: the latest earlier service level credit is for the month immediately before the claimed month
      value: K('consecutive_adjacent_multiplier')
    - when: it is for a month two to consecutive_near_months months before
      value: K('consecutive_near_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      consecutive_mult: '1'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: stabilization_window
    effect: parameter
    decides: stabilization_mult
    bindings:
    - live_months
    - stabilization_mult
    ladder:
    - when: fewer than stabilization_first_months whole months from the go_live_date to the first day of the month
      value: K('stabilization_first_multiplier')
    - when: at least stabilization_first_months but fewer than stabilization_second_months
      value: K('stabilization_second_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      stabilization_mult: '1'
    evidence:
    - date
    cross_difficulty: null
