  distinguish_by:
  - census_month
  fields:
    census_month: calendar month the census covers
    eligible_headcount: eligible employees reported by the employer for the month
    enrolled_active_workers: workers whose Access plan under the agreement was active on any day of the month
    availability_percent: measured platform availability for the month
  triggers: []
measures:
- id: program_msr_schedule_open_amount
  window: one deduction schedule up to today
  measure: schedule amount less program_remittance and program_shortfall_writeoff entries pointing to it, plus program_remittance_return
    entries pointing to it
- id: program_msr_days_past_due
  window: one deduction schedule or employer-liable shortfall notice with an open amount
  measure: calendar days from its due_date to today; zero when today is on or before the due date
- id: program_msr_late_waivers_365d
  window: the 365 calendar days ending today
  measure: count of program_credit_memo entries with credit_reason late_charge_waiver on the agreement
- id: program_msr_cap_changes_365d
  window: the 365 calendar days ending on the submission date
  measure: count of program_change_requests of type cap_change on the agreement with status scheduled or effective
- id: program_msr_fee_model_changes_365d
  window: the 365 calendar days ending on the submission date
  measure: count of program_change_requests of type fee_model_change on the agreement with status scheduled or effective
- id: program_msr_out_of_band_months
  window: the agreement's census entries in descending census_month order
  measure: count of consecutive most recent months whose eligible_headcount lies outside the current tier's entry_gate
    band
- id: program_msr_sponsored_transfers
  window: one billing month, all Access plans under the agreement
  measure: count of access_transfer entries booked in the month that fell within the sponsored or employer-paid
    allowance of their pay period, split by delivery_speed
- id: program_msr_paycard_full_month
  window: one billing month
  measure: true when the employer holds a Payroll Card Program whose launch_date is on or before the first day of
    the month and whose closed_date is empty or after the last day of the month
- id: program_msr_months_left_in_term
  window: the agreement at its termination date
  measure: whole calendar months from the termination date to renewal_date, at least zero
policies:
- id: program_agg_multi_holding
  subject:
  - program_contract
  rule: >-
    An employer holds at most max_per_customer Earned Wage Access Program Agreement; additional pay schedules or
    legal entities are added as payroll groups on the same agreement, never as a second agreement. An employer may
    not hold a second agreement that is not terminated. A new agreement opens in contracted status at the tier whose
    entry_gate band contains the employer's eligible headcount at signing, with configured_cap_percent set to the
    tier's default_cap_percent unless the employer chose another permitted value, zero receivables, and a renewal_date
    term_months after the signed_date.
  eligibility:
  - id: one_agreement
    applies_to:
    - program_contract
    kind: dedup
    condition: An employer may not hold a second agreement that is not terminated.
    evidence_fields:
    - program_agreements.customer_id
    - program_agreements.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_agreements.customer_id
      action_bindings:
        program_agreements.customer_id: customer_id
    dedup_contract:
      table: program_agreements
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - contracted
        - implementing
        - live
        - suspended
        - terminating
      distinct_fields:
      - signed_date
  params:
    max_per_customer: 1
- id: program_evt_deduction_schedule
  subject:
  - program_deduction_schedule
  rule: >-
    For each pay date of each payroll group Paystride issues one deduction schedule listing, for every worker of
    that group with an amount due on that pay date, the amount the employer must deduct. Its amount is the sum over
    the group's workers of the amount due on their Access plans for that pay date, and worker_count is the number
    of those workers. A deduction schedule is issued only while the agreement status is live, suspended or terminating.
    A suspended or terminating program keeps receiving schedules so that advances already made are recovered. A
    deduction schedule is delivered no later than deduction_file_lead_business_days business days before the pay
    date it covers. Business days are Monday through Friday excluding Federal Reserve holidays, counted backward
    from the pay date, so with a lead of two business days and a Friday pay date the file is delivered by the Wednesday
    before it. A pay date and payroll group receive one deduction schedule. The schedule's due_date is remittance_due_business_days_after_pay_date
    business days after the pay date. No schedule is issued for a pay date on which no worker of the group has anything
    due.
  eligibility:
  - id: schedule_status
    applies_to:
    - program_deduction_schedule
    kind: state
    condition: A deduction schedule is issued only while the agreement status is live, suspended or terminating.
    evidence_fields:
    - program_agreements.status
    - program_agreements.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_agreements.agreement_id
      action_bindings:
        program_agreements.agreement_id: agreement_id
    state_contract:
      field: program_agreements.status
      allowed:
      - live
      - suspended
      - terminating
  - id: schedule_lead
    applies_to:
    - program_deduction_schedule
    kind: time
    condition: A deduction schedule is delivered no later than deduction_file_lead_business_days business days before
      the pay date it covers.
    evidence_fields:
    - program_settlements.pay_date
    - program_settlements.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_settlements.agreement_id
      action_bindings:
        program_settlements.agreement_id: agreement_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the pay date it covers
      anchor_source: program_settlements.pay_date
      relation: not_after
      duration_source: variants.deduction_file_lead_business_days
      unit: business_days
      counting_rule: Business days are Monday through Friday excluding Federal Reserve holidays, counted backward
        from the pay date, so with a lead of two business days and a Friday pay date the file is delivered by the
        Wednesday before it.
      boundary: inclusive
  - id: one_schedule
    applies_to:
    - program_deduction_schedule
    kind: dedup
    condition: A pay date and payroll group receive one deduction schedule.
    evidence_fields:
    - program_settlements.pay_date
    - program_settlements.payroll_group
    - program_settlements.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_settlements.pay_date
        - program_settlements.payroll_group
      action_bindings:
        program_settlements.pay_date: pay_date
        program_settlements.payroll_group: payroll_group
    dedup_contract:
      table: program_settlements
      mode: separate_record
      object_bindings:
        agreement_id: agreement_id
        pay_date: pay_date
        payroll_group: payroll_group
      duplicate_filters:
        event_type:
        - program_deduction_schedule
      distinct_fields: []
  params:
    per_tier:
      Paystride Program Starter:
        deduction_file_lead_business_days: =deduction_file_lead_business_days
        remittance_due_business_days_after_pay_date: =remittance_due_business_days_after_pay_date
      Paystride Program Growth:
        deduction_file_lead_business_days: =deduction_file_lead_business_days
        remittance_due_business_days_after_pay_date: =remittance_due_business_days_after_pay_date
      Paystride Program Professional:
        deduction_file_lead_business_days: =deduction_file_lead_business_days
        remittance_due_business_days_after_pay_date: =remittance_due_business_days_after_pay_date
      Paystride Program Enterprise:
        deduction_file_lead_business_days: =deduction_file_lead_business_days
        remittance_due_business_days_after_pay_date: =remittance_due_business_days_after_pay_date
      Paystride Program Enterprise Plus:
        deduction_file_lead_business_days: =deduction_file_lead_business_days
        remittance_due_business_days_after_pay_date: =remittance_due_business_days_after_pay_date
      Paystride Program Strategic:
        deduction_file_lead_business_days: =deduction_file_lead_business_days
        remittance_due_business_days_after_pay_date: =remittance_due_business_days_after_pay_date
- id: program_evt_remittance
  subject:
  - program_remittance
  - program_remittance_return
  rule: >-
    The employer remits the deducted amounts for each schedule by its due_date. A remittance is accepted only by
    a method listed in remittance_methods_allowed for the agreement's tier. Each remittance is applied to the schedule
    it names through schedule_entry_id, up to program_msr_schedule_open_amount; a partial remittance leaves the
    rest of that schedule open, and any amount above the schedule's open amount is applied to the employer's oldest
    other open schedule, never to program invoices. When the employer's bank returns an ACH debit of a remittance
    unpaid, the remittance is reversed by a remittance return pointing to it, the schedule's open amount is reinstated
    as of its original due_date, and an ach_return_fee invoice line of ach_debit_return_fee_usd is billed; a returned
    employer-initiated credit or wire is reversed the same way without that fee. A remittance is returned at most
    once. Remittances of worker-level deductions never pass through workers' card accounts or reduce program charges.
  eligibility:
  - id: remit_method
    applies_to:
    - program_remittance
    kind: authorization
    condition: A remittance is accepted only by a method listed in remittance_methods_allowed for the agreement's
      tier.
    evidence_fields:
    - program_settlements.remittance_method
    - program_agreements.variant_name
    - program_agreements.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_agreements.agreement_id
      action_bindings:
        program_agreements.agreement_id: agreement_id
  - id: one_return
    applies_to:
    - program_remittance_return
    kind: dedup
    condition: A remittance is returned at most once.
    evidence_fields:
    - program_settlements.related_entry_id
    - program_settlements.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_settlements.related_entry_id
      action_bindings:
        program_settlements.related_entry_id: related_entry_id
    dedup_contract:
      table: program_settlements
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - program_remittance_return
      distinct_fields: []
  params:
    per_tier:
      Paystride Program Starter:
        remittance_methods_allowed: =remittance_methods_allowed
        ach_debit_return_fee_usd: =ach_debit_return_fee_usd
      Paystride Program Growth:
        remittance_methods_allowed: =remittance_methods_allowed
        ach_debit_return_fee_usd: =ach_debit_return_fee_usd
      Paystride Program Professional:
        remittance_methods_allowed: =remittance_methods_allowed
        ach_debit_return_fee_usd: =ach_debit_return_fee_usd
      Paystride Program Enterprise:
        remittance_methods_allowed: =remittance_methods_allowed
        ach_debit_return_fee_usd: =ach_debit_return_fee_usd
      Paystride Program Enterprise Plus:
        remittance_methods_allowed: =remittance_methods_allowed
        ach_debit_return_fee_usd: =ach_debit_return_fee_usd
      Paystride Program Strategic:
        remittance_methods_allowed: =remittance_methods_allowed
        ach_debit_return_fee_usd: =ach_debit_return_fee_usd
  measures:
  - program_msr_schedule_open_amount
- id: program_evt_shortfall
  subject:
  - program_shortfall_notice
  - program_shortfall_writeoff
  rule: >-
    When a schedule's due_date passes with part of it not remitted, the unremitted part is a shortfall. The employer
    reports, for each worker not fully deducted, the reason within shortfall_report_due_business_days business days
    after the pay date, and one shortfall notice is booked per schedule and reason, with the amount and worker_count
    for that reason. shortfall_liability_map fixes who bears each reason: a shortfall because net pay could not
    cover the deduction or because employment ended is provider_absorbed and is written off at once by a write-off
    pointing to the notice, the worker's own Access plan following its own recovery rules; a shortfall from a payroll
    processing error, a deduction not taken, or an amount deducted but not remitted is employer_liable, stays in
    what the employer owes, and is due employer_liable_cure_business_days business days after the notice, recorded
    as its due_date. An amount the employer gives no reason for in time is booked with reason unreported and is
    employer_liable. A contested employer-liable shortfall is reclassified only when the contest arrives within
    shortfall_contest_window_business_days business days after its shortfall notice was booked. Business days are
    Monday through Friday excluding Federal Reserve holidays, counted from the day after the notice's entry_date,
    and a contest arriving on the last business day is in time. A contest supported by the payroll register showing
    net pay could not cover the deduction or that employment ended reclassifies that part as provider_absorbed,
    booked as a write-off pointing to the notice. A shortfall notice is written off at most once. A write-off never
    exceeds its notice's amount.
  eligibility:
  - id: contest_window
    applies_to:
    - program_shortfall_writeoff
    kind: time
    condition: A contested employer-liable shortfall is reclassified only when the contest arrives within shortfall_contest_window_business_days
      business days after its shortfall notice was booked.
    evidence_fields:
    - program_settlements.entry_date
    - program_settlements.settlement_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_settlements.settlement_entry_id
      action_bindings:
        program_settlements.settlement_entry_id: related_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: its shortfall notice was booked
      anchor_source: program_settlements.entry_date
      relation: not_after
      duration_source: variants.shortfall_contest_window_business_days
      unit: business_days
      counting_rule: Business days are Monday through Friday excluding Federal Reserve holidays, counted from the
        day after the notice's entry_date, and a contest arriving on the last business day is in time.
      boundary: inclusive
  - id: one_writeoff
    applies_to:
    - program_shortfall_writeoff
    kind: dedup
    condition: A shortfall notice is written off at most once.
    evidence_fields:
    - program_settlements.related_entry_id
    - program_settlements.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_settlements.related_entry_id
      action_bindings:
        program_settlements.related_entry_id: related_entry_id
    dedup_contract:
