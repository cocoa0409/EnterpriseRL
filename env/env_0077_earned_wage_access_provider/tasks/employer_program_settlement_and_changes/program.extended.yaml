    balance_high_points: 0.15
    balance_mid_points: 0.1
    concurrent_high_usd: 40000
    concurrent_high_points: 0.2
    concurrent_mid_points: 0.1
    prior_window_months: 12
    prior_high_count: 2
    prior_low_count: 1
    prior_high_points: 0.5
    prior_low_points: 0.25
  rule: 'This policy prices the late charge on the deduction schedule named by the remittance return booked most recently on the agreement, when it is the only remittance return booked that day and the schedule carries no employer-liable shortfall notice; in any other case this policy books nothing. The late charge for a period is the greater of late_charge_minimum_usd and late_charge_monthly_rate_percent of the item''s open amount on the first day of that period, rounded to the nearest cent, for every overdue item except the employer-liable shortfall notice and the reinstated deduction schedule that the provisions on those two late charges select, these provisions settling the latter. The open amount of the reinstated schedule is the schedule amount less the remittances and write-offs pointing to it, plus the remittance returns pointing to it, as the records stand on the day the charge is booked, and the late-charge period runs from the schedule''s original due_date. The late charge on the reinstated schedule is the greater of late_charge_minimum_usd and the percentage charge, which is the rate of late_charge_monthly_rate_percent percent applied to that open amount and rounded half up to the cent. The adjustments below are applied in one fixed order for a schedule a returned remittance reinstated: the percentage points they add are added to the rate first, the rate so formed is applied to the open amount and rounded half up to the cent, and the way the late charge is worked out is then applied. How the late charge on a reinstated schedule is worked out follows the employer''s returned payments: counting the remittance returns booked on the agreement and the funding returns booked on the employer''s Payroll Card Program on entry dates from which fewer than returns_window_months whole months have passed to today, a month counting as whole once the day of the month of the entry date is reached, or on the first day of the next month where that month has no such day, where at least returns_high_count were booked, the late charge is late_charge_minimum_usd plus the rate applied to the whole returned amount, rounded half up to the cent; where exactly returns_mid_count were booked, it is late_charge_minimum_usd plus the percentage charge; otherwise it is the greater of late_charge_minimum_usd and the percentage charge. Days past due add to the rate on a reinstated schedule: counted in calendar days from the schedule''s original due_date to today, where they are at least dpd_high_days, dpd_high_points percentage points are added; where they are at least dpd_mid_days but fewer than dpd_high_days, dpd_mid_points points are added; otherwise none. A larger overdue balance adds to the rate on a reinstated schedule: where its open amount is at least balance_high_usd, balance_high_points points are added; where it is at least balance_mid_usd but below balance_high_usd, balance_mid_points points are added; otherwise none. Another delinquency open at the same time adds to the rate on a reinstated schedule: where the deduction schedule that the employer-liable shortfall notice booked most recently concerns, where that notice is the only one booked that day, still has an open amount of at least concurrent_high_usd, concurrent_high_points points are added; where that open amount is above zero but below concurrent_high_usd, concurrent_mid_points points are added; otherwise, including when there is no such item, none. Late charges already booked add to the rate on a reinstated schedule: where at least prior_high_count late charges were booked on the agreement on entry dates from which fewer than prior_window_months whole months have passed to today, a month counting as whole once the day of the month of the entry date is reached, or on the first day of the next month where that month has no such day, prior_high_points points are added; where exactly prior_low_count was, prior_low_points points are added; otherwise none. Employer-liable shortfalls add to the rate on a reinstated schedule: where at least liable_high_count employer-liable shortfall notices were booked on entry dates from which fewer than liable_window_months whole months have passed to today, a month counting as whole once the day of the month of the entry date is reached, or on the first day of the next month where that month has no such day, liable_high_points points are added; where exactly liable_mid_count were, liable_mid_points points are added; otherwise none. A late charge on a deduction schedule reinstated by a returned remittance is fixed only after, where the employer-liable shortfall notice booked most recently is the only employer-liable notice booked that day and the only one on the deduction schedule it concerns, that schedule carries no remittance return, and the notice has an open amount of at least the de minimis amount, that notice carries the late charge owed for the late-charge period it is in once its late-charge grace has passed.'
  prerequisite:
  - problem: program_ext_shortfall_late_charge
    kind: value_input
    gate: prior_count
    form: state
    policy_source: A late charge on a deduction schedule reinstated by a returned remittance is fixed only after, where the employer-liable shortfall notice booked most recently is the only employer-liable notice booked that day and the only one on the deduction schedule it concerns, that schedule carries no remittance return, and the notice has an open amount of at least the de minimis amount, that notice carries the late charge owed for the late-charge period it is in once its late-charge grace has passed.
    condition: 'where the employer-liable shortfall notice with the latest entry_date is the only employer-liable notice of that entry_date and of its schedule, and that schedule has no program_remittance_return, and the notice has an open amount of at least deminimis_open_usd and is past its due_date plus late_charge_grace_business_days business days: a program_late_charge pointing to that notice for the late-charge period it is in; in every other case nothing is waited on'
    resolved_by: assess_shortfall_late_charge_82f1f096
    effect: the late charge booked on the shortfall notice is counted among the late charges booked in the window, which raises prior_count and the points it adds to the rate
  cross_category:
  - category: paycard
    as: history
    reads:
    - paycard_funding.event_type
    - paycard_funding.entry_date
    note: returned_payments_method counts the funding returns booked on the employer's Payroll Card Program.
  compute:
  - return_day: LATEST('program_settlements','entry_date', date_field='entry_date', event_type='program_remittance_return')
  - return_id: LATEST('program_settlements','settlement_entry_id', date_field='entry_date', event_type='program_remittance_return')
  - sched_id: LATEST('program_settlements','schedule_entry_id', date_field='entry_date', event_type='program_remittance_return')
  - in_scope: return_id != None and COUNT('program_settlements', entry_date=return_day, event_type='program_remittance_return') == 1 and COUNT('program_settlements', schedule_entry_id=sched_id, event_type='program_shortfall_notice', liability='employer_liable') == 0
  - open_amt: SUM('program_settlements','amount', settlement_entry_id=sched_id) - SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_remittance') - SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_shortfall_writeoff') + SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_remittance_return')
  - base_rate: P('late_charge_monthly_rate_percent')
  - minimum: P('late_charge_minimum_usd')
  - sched_due: LATEST('program_settlements','due_date', date_field='entry_date', settlement_entry_id=sched_id)
  - days_past_due: DAYS(sched_due, NOW) if sched_due else 0
  - dpd_pts: K('dpd_high_points') if days_past_due >= K('dpd_high_days') else (K('dpd_mid_points') if days_past_due >= K('dpd_mid_days') else 0)
  - balance_open: SUM('program_settlements','amount', settlement_entry_id=sched_id) - SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_remittance') - SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_shortfall_writeoff') + SUM('program_settlements','amount', schedule_entry_id=sched_id, event_type='program_remittance_return')
  - balance_pts: K('balance_high_points') if balance_open >= K('balance_high_usd') else (K('balance_mid_points') if balance_open >= K('balance_mid_usd') else 0)
  - other_day: LATEST('program_settlements','entry_date', date_field='entry_date', event_type='program_shortfall_notice', liability='employer_liable')
  - other_sched: LATEST('program_settlements','schedule_entry_id', date_field='entry_date', event_type='program_shortfall_notice', liability='employer_liable')
  - other_open: (SUM('program_settlements','amount', settlement_entry_id=other_sched) - SUM('program_settlements','amount', schedule_entry_id=other_sched, event_type='program_remittance') - SUM('program_settlements','amount', schedule_entry_id=other_sched, event_type='program_shortfall_writeoff') + SUM('program_settlements','amount', schedule_entry_id=other_sched, event_type='program_remittance_return')) if (other_sched != None and COUNT('program_settlements', entry_date=other_day, event_type='program_shortfall_notice', liability='employer_liable') == 1) else 0
  - conc_pts: K('concurrent_high_points') if other_open >= K('concurrent_high_usd') else (K('concurrent_mid_points') if other_open > 0 else 0)
  - prior_count: COUNT('program_billing', within_months=K('prior_window_months'), date_field='entry_date', event_type='program_late_charge')
  - prior_pts: K('prior_high_points') if prior_count >= K('prior_high_count') else (K('prior_low_points') if prior_count == K('prior_low_count') else 0)
  - liable_count: COUNT('program_settlements', within_months=K('liable_window_months'), date_field='entry_date', event_type='program_shortfall_notice', liability='employer_liable')
  - liable_pts: K('liable_high_points') if liable_count >= K('liable_high_count') else (K('liable_mid_points') if liable_count == K('liable_mid_count') else 0)
  - rate: base_rate + dpd_pts + balance_pts + conc_pts + prior_pts + liable_pts
  - pct_charge: RND(open_amt * rate / 100 + 0.000000001, 2)
  - program_returns: COUNT('program_settlements', within_months=K('returns_window_months'), date_field='entry_date', event_type='program_remittance_return')
  - card_returns: XCOUNT('paycard','paycard_funding', within_months=K('returns_window_months'), date_field='entry_date', event_type='paycard_funding_return')
  - charge_rule: '''returned_plus'' if program_returns + card_returns >= K(''returns_high_count'') else (''open_plus'' if program_returns + card_returns == K(''returns_mid_count'') else ''greater_of'')'
  - returned_amt: SUM('program_settlements','amount', settlement_entry_id=return_id)
  - charge: minimum + RND(returned_amt * rate / 100 + 0.000000001, 2) if charge_rule == 'returned_plus' else (minimum + pct_charge if charge_rule == 'open_plus' else MX(minimum, pct_charge))
  - result: RND(charge + 0.000000001, 2) if in_scope else 0
  factors:
  - id: returned_payments_method
    effect: method
    decides: charge_rule
    bindings:
    - program_returns
    - card_returns
    - charge_rule
    ladder:
    - when: at least returns_high_count remittance and Payroll Card funding returns within returns_window_months whole months
      method: late_charge_minimum_usd plus the rate applied to the whole returned amount
    - when: exactly returns_mid_count such returns
      method: late_charge_minimum_usd plus the percentage charge
    - when: otherwise
      method: the greater of late_charge_minimum_usd and the percentage charge
    baseline:
      charge_rule: '''greater_of'''
    evidence:
    - history
    - cross_category
    cross_difficulty: paycard
  - id: return_days_past_due
    effect: parameter
    decides: dpd_pts
    bindings:
    - sched_due
    - days_past_due
    - dpd_pts
    ladder:
    - when: at least dpd_high_days calendar days past the schedule's original due_date
      value: K('dpd_high_points')
    - when: at least dpd_mid_days but fewer than dpd_high_days
      value: K('dpd_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      dpd_pts: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: return_overdue_balance
    effect: parameter
    decides: balance_pts
    bindings:
    - balance_open
    - balance_pts
    ladder:
    - when: open amount at least balance_high_usd
      value: K('balance_high_points')
    - when: open amount at least balance_mid_usd but below balance_high_usd
      value: K('balance_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      balance_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: return_concurrent_delinquency
    effect: parameter
    decides: conc_pts
    bindings:
    - other_day
    - other_sched
    - other_open
    - conc_pts
    ladder:
    - when: the other item still open by at least concurrent_high_usd
      value: K('concurrent_high_points')
    - when: the other item open above zero but below concurrent_high_usd
      value: K('concurrent_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      conc_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: return_prior_charges
    effect: parameter
    decides: prior_pts
    bindings:
    - prior_count
    - prior_pts
    ladder:
    - when: at least prior_high_count late charges within prior_window_months whole months
      value: K('prior_high_points')
    - when: exactly prior_low_count late charge
      value: K('prior_low_points')
    - when: otherwise
      value: '0'
    baseline:
      prior_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: return_liable_history
    effect: parameter
    decides: liable_pts
    bindings:
    - liable_count
    - liable_pts
    ladder:
    - when: at least liable_high_count employer-liable notices within liable_window_months whole months
      value: K('liable_high_points')
    - when: exactly liable_mid_count such notices
      value: K('liable_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      liable_pts: '0'
    evidence:
    - history
    cross_difficulty: null
