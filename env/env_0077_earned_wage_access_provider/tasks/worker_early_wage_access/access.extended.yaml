  target_tool: request_instant_transfer_84ad3b61
  params: {}
  rule: 'This schedule sets the instant transfer amount: the amount of an instant transfer to an external debit card on a plan whose worker holds no other Earned Wage Access Plan that is not closed, has no Paystride Payroll-Repaid Loan in status repaying with an installment due on the plan''s next_pay_date, and whose employer''s program agreement carries a configured access percentage no lower than the tier''s access_cap_percent; for such a transfer, and only for such a transfer, it replaces the base rule on the amount available, and every other transfer, the next-business-day bank transfers its own schedule governs among them, remains as that schedule or the base rule provides, the base rule reading: The amount available for a new transfer is the lowest of: (a) the percentage room, which is the access percentage applied to access_msr_period_accrued_net less access_msr_period_transfer_total, where the access percentage is the tier''s access_cap_percent or, when it is lower, the configured cap the employer set on its program agreement (access_msr_employer_cap_percent); (b) the pay-period room, which is per_pay_period_cap_usd less access_msr_period_transfer_total; (c) the per-day room under access_agg_combined_daily_limit; (d) per_transfer_max_usd; and (e) where it applies, the room under access_combined_deduction_ceiling. The instant transfer amount is not worked out until the plan''s level effective date falls after the pay date of its latest period close line, where that pay date is before today and a shortfall carries a pay date on or after the level effective date. The instant transfer amount is the lowest of the instant percentage room, the instant pay-period room, the instant day room and the tier''s per_transfer_max_usd; it is never below zero and is rounded down to the cent. The instant percentage room is the tier''s access_cap_percent, divided by one hundred, times the instant accrued net, less the instant period taken. The instant pay-period room is the tier''s per_pay_period_cap_usd less the instant period taken. The instant day room is the tier''s per_day_cap_usd less the amount of every transfer booked on the plan today, returned or not. The instant period taken is the amount of the plan''s transfers carrying its next_pay_date less the amount of the plan''s transfer returns carrying that date. The instant accrued net is the net_amount of the plan''s earnings sync lines carrying its next_pay_date less the net_amount of its earnings correction lines carrying that date, each line at its recorded net_amount, regular-hours lines always counting, overtime lines only where overtime_included_in_accrual is true, shift-differential lines only where shift_differential_included_in_accrual is true and card tips lines only where tips_included_in_accrual is true; on a tier whose earnings_availability_lag_days is one, sync and correction lines whose work_date is today do not count. Toward the instant percentage room and the instant pay-period room a returned or cancelled transfer does not count, and toward the instant day room every transfer booked on the plan today counts, returned or not; for every other transfer, the next-business-day bank transfers its own schedule governs aside, the base rule still reads: A transfer returned or cancelled does not count toward any room. For the instant transfer amount an open shortfall is handled as an adjustment set out below provides; for every other transfer, the next-business-day bank transfers its own schedule governs aside, the base rule still reads: While the plan has an open shortfall (access_msr_open_shortfall above zero) the access percentage and the pay-period cap are each multiplied by access_during_open_shortfall_percent_of_cap, but only when the open shortfall does not exceed max_open_shortfall_usd_for_continued_access; otherwise, and on every tier where that percentage is zero, no transfer is booked until the shortfall is recovered or written off. The adjustments below are applied in this order: any that acts on the instant percentage room and the instant pay-period room first, and then any that multiplies the lowest of the rooms, one after another, before the amount is rounded down. A record falls in the last N months when fewer than N whole months separate its date from today, whole months being the difference in calendar months less one when today''s day of the month is smaller than that date''s. The shortfall method rests on the plan''s open shortfall, its outstanding_balance less the instant period taken less its fees carrying its next_pay_date net of the fee reversals carrying that date, and on the shortfalls whose carryforward_pay_date is its next_pay_date: when the open shortfall is above zero, does not exceed the tier''s max_open_shortfall_usd_for_continued_access on a tier whose access_during_open_shortfall_percent_of_cap is above zero, and does not exceed the amount of those carried shortfalls, the instant percentage room and the instant pay-period room are each reduced by the open shortfall; when it is above zero and within that limit on such a tier but exceeds the carried amount, the tier''s access_cap_percent and per_pay_period_cap_usd are each multiplied by access_during_open_shortfall_percent_of_cap divided by one hundred before the rooms are taken; when it is above zero and above that limit, or on a tier whose access_during_open_shortfall_percent_of_cap is zero, both rooms are zero; when it is zero or less the rooms stand as stated above. The push-failure share multiplies the instant transfer amount by one half when a transfer return with reason_code delivery_failed was booked on the plan in the last three months, by three quarters when one was booked in the last six months but none in the last three, and in full otherwise. The new-destination share multiplies the instant transfer amount by 60 percent when no instant transfer to an external debit card was booked on the plan in the last six months before today, by 80 percent when one or two were, and in full when three or more were. The velocity share multiplies the instant transfer amount by 70 percent when two or more instant transfers are already booked on the plan today or the instant transfers already booked today total 300.00 or more, by 85 percent when exactly one is booked and it totals less than 300.00, and in full when none is. The period-advance share multiplies the instant transfer amount by the transfers and fees already carrying the plan''s next_pay_date, net of their returns and reversals, as a share of the instant accrued net: more than 30 percent, or any such amount with no instant accrued net, takes 80 percent; more than 10 up to 30 percent takes 90 percent; 10 percent or less takes it in full.'
  prerequisite:
  - problem: access_ext_missed_recovery_review
    kind: value_input
    gate: it_pct_room
    form: state
    policy_source: The instant transfer amount is not worked out until the plan's level effective date falls after the pay date of its latest period close line, where that pay date is before today and a shortfall carries a pay date on or after the level effective date.
    condition: where the pay_date of the plan's latest access_period_close line is before today and an access_shortfall carries a pay_date on or after access_plans.level_effective_date, access_plans.level_effective_date is later than the pay_date of the plan's latest access_period_close line (the missed-recovery review of that payday is recorded, leaving level_effective_date the day after it); a plan with no shortfall carrying a pay_date on or after its level_effective_date, or on the day of its latest closed payday, waits on no missed-recovery review
    resolved_by: record_missed_recovery_review_3a64d9dd
    effect: 'the tier the missed-recovery review records on access_plans.variant_name sets the tier parameters the instant transfer amount reads: access_cap_percent and per_pay_period_cap_usd inside the rooms, per_day_cap_usd, per_transfer_max_usd and the open-shortfall limit and percentage'
  cross_category: []
  compute:
  - it_pay: F('next_pay_date')
  - it_lag1: 1 if P('earnings_availability_lag_days') == 1 else 0
  - it_reg: SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=it_pay, earnings_source='regular_hours') - it_lag1 * SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=it_pay, earnings_source='regular_hours', work_date=NOW)
  - it_ot: SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=it_pay, earnings_source='overtime_hours') - it_lag1 * SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=it_pay, earnings_source='overtime_hours', work_date=NOW)
  - it_dif: SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=it_pay, earnings_source='shift_differential') - it_lag1 * SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=it_pay, earnings_source='shift_differential', work_date=NOW)
  - it_tips: SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=it_pay, earnings_source='card_tips') - it_lag1 * SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=it_pay, earnings_source='card_tips', work_date=NOW)
  - it_corr: SUM('access_earnings', 'net_amount', event_type='access_earnings_correction', pay_date=it_pay) - it_lag1 * SUM('access_earnings', 'net_amount', event_type='access_earnings_correction', pay_date=it_pay, work_date=NOW)
  - it_accrued: it_reg + (it_ot if P('overtime_included_in_accrual') else 0) + (it_dif if P('shift_differential_included_in_accrual') else 0) + (it_tips if P('tips_included_in_accrual') else 0) - it_corr
  - it_taken: RND(SUM('access_ledger', 'amount', event_type='access_transfer', pay_date=it_pay) - SUM('access_ledger', 'amount', event_type='access_transfer_return', pay_date=it_pay), 2)
  - it_day_taken: SUM('access_ledger', 'amount', event_type='access_transfer', entry_date=NOW)
  - it_open: RND(F('outstanding_balance') - it_taken - (SUM('access_ledger', 'amount', event_type='access_fee', pay_date=it_pay) - SUM('access_ledger', 'amount', event_type='access_fee_reversal', pay_date=it_pay)), 2)
  - it_carried: SUM('access_ledger', 'amount', event_type='access_shortfall', carryforward_pay_date=it_pay)
  - it_room_pair: 1 if it_open <= 0 else (2 if P('access_during_open_shortfall_percent_of_cap') > 0 and it_open <= P('max_open_shortfall_usd_for_continued_access') and it_open <= it_carried else (3 if P('access_during_open_shortfall_percent_of_cap') > 0 and it_open <= P('max_open_shortfall_usd_for_continued_access') else 4))
  - it_pct_room: P('access_cap_percent') / 100 * it_accrued - it_taken - it_open if it_room_pair == 2 else (P('access_cap_percent') * P('access_during_open_shortfall_percent_of_cap') / 100 / 100 * it_accrued - it_taken if it_room_pair == 3 else (0 if it_room_pair == 4 else P('access_cap_percent') / 100 * it_accrued - it_taken))
  - it_period_room: P('per_pay_period_cap_usd') - it_taken - it_open if it_room_pair == 2 else (P('per_pay_period_cap_usd') * P('access_during_open_shortfall_percent_of_cap') / 100 - it_taken if it_room_pair == 3 else (0 if it_room_pair == 4 else P('per_pay_period_cap_usd') - it_taken))
  - it_day_room: P('per_day_cap_usd') - it_day_taken
  - it_lowest: MX(0, MN(it_pct_room, it_period_room, it_day_room, P('per_transfer_max_usd')))
  - it_fail_3m: COUNT('access_ledger', within_months=3, date_field='entry_date', event_type='access_transfer_return', reason_code='delivery_failed')
  - it_fail_6m: COUNT('access_ledger', within_months=6, date_field='entry_date', event_type='access_transfer_return', reason_code='delivery_failed')
  - it_fail_share: 0.5 if it_fail_3m >= 1 else (0.75 if it_fail_6m >= 1 else 1)
  - it_ext_6m: COUNT('access_ledger', within_months=6, date_field='entry_date', event_type='access_transfer', delivery_speed='instant', destination_type='external_debit_card') - COUNT('access_ledger', event_type='access_transfer', delivery_speed='instant', destination_type='external_debit_card', entry_date=NOW)
  - it_new_share: 0.6 if it_ext_6m == 0 else (0.8 if it_ext_6m <= 2 else 1)
  - it_today_instant: COUNT('access_ledger', event_type='access_transfer', delivery_speed='instant', entry_date=NOW)
  - it_today_amt: SUM('access_ledger', 'amount', event_type='access_transfer', delivery_speed='instant', entry_date=NOW)
  - it_vel_share: 0.7 if it_today_instant >= 2 or it_today_amt >= 300 else (0.85 if it_today_instant == 1 and it_today_amt < 300 else 1)
  - it_adv_amt: SUM('access_ledger', 'amount', event_type='access_transfer', pay_date=it_pay) - SUM('access_ledger', 'amount', event_type='access_transfer_return', pay_date=it_pay) + SUM('access_ledger', 'amount', event_type='access_fee', pay_date=it_pay) - SUM('access_ledger', 'amount', event_type='access_fee_reversal', pay_date=it_pay)
  - it_out_ratio: it_adv_amt / it_accrued if it_accrued > 0 else (1 if it_adv_amt > 0 else 0)
  - it_out_share: 0.8 if it_out_ratio > 0.3 else (0.9 if it_out_ratio > 0.1 else 1)
  - result: int(it_lowest * it_fail_share * it_new_share * it_vel_share * it_out_share * 100 + 0.0000001) / 100
  compute_basis:
