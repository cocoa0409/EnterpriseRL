  factors:
  - id: repeat_protection
    effect: parameter
    decides: pd_rep_allow
    bindings:
    - pd_sf_12m
    - pd_rep_allow
    ladder:
    - when: one shortfall with a pay_date in the last twelve months (the reviewed payday's)
      value: one tier below the current tier
    - when: two such shortfalls
      value: two tiers below the current tier
    - when: otherwise (three or more)
      value: Paystride Access Starter only
    baseline:
      pd_rep_allow: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: cure_protection
    effect: method
    decides: pd_cure_allow
    bindings:
    - pd_short
    - pd_card_coll
    - pd_vol_coll
    - pd_collected
    - pd_cure_allow
    ladder:
    - when: card_recovery_authorized is true AND the worker holds an active Paystride Visa Payroll Card account
      method: collected = ewa_recovery debits posted to the worker's card accounts in the last month; cured share = collected / the payday's shortfall; 50 percent or more keeps the tier one below, 25 percent up to 50 percent two below, less only Starter
    - when: voluntary_payment recoveries carry the payday AND the plan lacks the authorization with an active card
      method: collected = those voluntary payments; cured share = collected / the payday's shortfall, tiered as above
    - when: otherwise
      method: 'nothing counts as collected: cured share zero, leaving only Paystride Access Starter'
    baseline:
      pd_cure_allow: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: tenure_protection
    effect: parameter
    decides: pd_ten_allow
    bindings:
    - pd_tenure
    - pd_ten_allow
    ladder:
    - when: 365 or more calendar days from hire_date to the payday
      value: one tier below the current tier
    - when: 180 to 364 days
      value: two tiers below the current tier
    - when: otherwise (fewer than 180 days)
      value: Paystride Access Starter only
    baseline:
      pd_ten_allow: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: writeoff_protection
    effect: parameter
    decides: pd_wo_allow
    bindings:
    - pd_wo_days
    - pd_wo_allow
    ladder:
    - when: no write-off stands, or the latest one falls more than 365 days before the payday
      value: one tier below the current tier
    - when: the latest write-off falls 181 to 365 days before the payday
      value: two tiers below the current tier
    - when: otherwise (on the payday, up to 180 days before it, or after it)
      value: Paystride Access Starter only
    baseline:
      pd_wo_allow: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: payroll_continuity_protection
    effect: parameter
    decides: pd_emp_allow
    bindings:
    - pd_closes_3m
    - pd_emp_allow
    ladder:
    - when: five or more period closes with a pay_date in the last three months
      value: one tier below the current tier
    - when: three or four such period closes
      value: two tiers below the current tier
    - when: otherwise (fewer than three)
      value: Paystride Access Starter only
    baseline:
      pd_emp_allow: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: At a review under this schedule the plan returns to Paystride Access Starter. Each protection below names the highest tier it lets the plan keep; a protection lets the plan keep only Paystride Access Starter unless one of its own tiers names a higher tier for the plan; the plan lands on the lowest of those tiers and never higher than one tier below its current tier, and when writeoff_resets_to_starter is true and the plan's latest write-off was booked on or after its level_effective_date and on or before the payday reviewed it lands on Paystride Access Starter whatever the protections allow.
    params:
    - writeoff_resets_to_starter
  inputs:
    history:
    - table: access_ledger
      aggregate: count
      field: pay_date
      within_months: 12
      filters:
        event_type: access_shortfall
    - table: access_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: access_shortfall
    - category: card
      table: card_transactions
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        event_type: card_debit
        debit_type: ewa_recovery
    cross_category:
    - card
