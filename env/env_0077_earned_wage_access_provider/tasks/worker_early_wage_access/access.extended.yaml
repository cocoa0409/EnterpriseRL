events:
- type: access_enroll
  target: access_plans
  mutation: create
  meaning: A worker enrolls in an Earned Wage Access Plan under their employer's live program agreement; the plan opens in pending_activation at Paystride Access Starter.
  grain: one row per plan change
  fields:
    customer_id: the worker who holds the plan (foreign key -> customers)
    agreement_id: the employer's Earned Wage Access Program Agreement under which the plan was enrolled (foreign key -> program_agreements)
    variant_name: the plan tier currently held, as the official full tier name
    status: lifecycle state of the plan (see the access charter lifecycle)
    enrolled_date: date the worker enrolled
    employee_number: the employee number the employer uses for this worker on its payroll file, exactly as on file
    payroll_group: the employer payroll group code the worker is paid under, exactly as on the employer's payroll file
    hire_date: hire date reported by the employer's payroll file; the basis of tenure
    employment_status: employment status as last reported by the employer's payroll file
    pay_frequency: the worker's pay frequency as reported by the employer
    next_pay_date: payday that ends the current pay period; transfers of the current period carry this date as pay_date
    outstanding_balance: 'amount currently owed on the plan: transfers plus fees less recoveries, write-offs, returns and fee reversals; a negative figure is a credit left by reversing an already recovered fee, applied against the next payday''s amount due'
    card_recovery_authorized: whether the worker has given a standing authorization to recover unrecovered amounts from their Paystride Visa Payroll Card
    level_effective_date: date the current tier took effect
  triggers: []
- type: access_activate
  target: access_plans
  mutation:
    transition:
      from: pending_activation
      to: active
  meaning: The employer's payroll file matches the worker's employee number and the plan becomes usable.
  grain: one row per plan change
  fields:
    activated_date: date employer verification activated the plan; empty until then
  triggers: []
- type: access_expire_enrollment
  target: access_plans
  mutation:
    transition:
      from: pending_activation
      to: closed
  meaning: An enrollment the employer file never matched within the activation window lapses.
  grain: one row per plan change
  fields:
    closed_date: date the plan closed; empty while not closed
  triggers: []
- type: access_pause
  target: access_plans
  mutation:
    transition:
      from: active
      to: paused
  meaning: Access is paused because the employer reports the worker on leave or terminated, or the employer's program agreement is suspended.
  grain: one row per plan change
  fields:
    employment_status: employment status as last reported by the employer's payroll file
  triggers: []
- type: access_resume
  target: access_plans
  mutation:
    transition:
      from: paused
      to: active
  meaning: Access resumes when the employer reports the worker employed again and the program agreement is live.
  grain: one row per plan change
  fields:
    employment_status: employment status as last reported by the employer's payroll file
  triggers: []
- type: access_suspend
  target: access_plans
  mutation:
    transition:
      from: active
      to: suspended
  meaning: The desk suspends the plan on suspected account takeover or destination fraud.
  grain: one row per plan change
  fields:
    status: lifecycle state of the plan (see the access charter lifecycle)
  triggers: []
- type: access_reinstate
  target: access_plans
  mutation:
    transition:
      from: suspended
      to: active
  meaning: The desk lifts a fraud suspension after the worker re-verifies and the destinations are confirmed.
  grain: one row per plan change
  fields:
    status: lifecycle state of the plan (see the access charter lifecycle)
  triggers: []
- type: access_close
  target: access_plans
  mutation:
    transition:
      from: active
      to: closed
  meaning: A worker-confirmed closure takes effect once nothing is outstanding.
  grain: one row per plan change
  fields:
    closed_date: date the plan closed; empty while not closed
  triggers: []
- type: access_close_employment_ended
  target: access_plans
  mutation:
    transition:
      from: paused
      to: closed
  meaning: A plan paused for an employment end closes once the outstanding balance is recovered or written off.
  grain: one row per plan change
  fields:
    closed_date: date the plan closed; empty while not closed
  triggers: []
- type: access_level_change
  target: access_plans
  mutation: update
  meaning: The plan tier changes at a payday level review or on a write-off.
  grain: one row per plan change
  fields:
    variant_name: the plan tier currently held, as the official full tier name
    level_effective_date: date the current tier took effect
  triggers: []
- type: access_recovery_authorization
  target: access_plans
  mutation: update
  meaning: The worker grants the standing authorization for card autorecovery.
  grain: one row per plan change
  fields:
    card_recovery_authorized: whether the worker has given a standing authorization to recover unrecovered amounts from their Paystride Visa Payroll Card
  triggers: []
- type: access_recovery_revocation
  target: access_plans
  mutation: update
  meaning: The worker revokes the standing authorization for card autorecovery, or it lapses when the card account closes.
  grain: one row per plan change
  fields:
    card_recovery_authorized: whether the worker has given a standing authorization to recover unrecovered amounts from their Paystride Visa Payroll Card
  triggers: []
- type: access_payroll_sync
  target: access_plans
  mutation: update
  meaning: The employer payroll file updates the worker's next payday, pay frequency or employment status.
  grain: one row per plan change
  fields:
    next_pay_date: payday that ends the current pay period; transfers of the current period carry this date as pay_date
    pay_frequency: the worker's pay frequency as reported by the employer
    employment_status: employment status as last reported by the employer's payroll file
    payroll_group: the employer payroll group code the worker is paid under, exactly as on the employer's payroll file
  triggers: []
- type: access_transfer
  target: access_ledger
  meaning: An early wage transfer of earned net pay delivered to the worker's chosen destination, due for recovery on the period's payday.
  grain: one row per transfer
  distinguish_by:
  - entry_date
  - daily_sequence
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    pay_date: payday of the pay period the entry belongs to; for transfers and fees the payday on which they are due for recovery, for recoveries, shortfalls and write-offs the payday whose amount they settle
    amount: size of the movement, always greater than zero; its effect on the outstanding balance is fixed by event_type (transfers and fees add, recoveries, write-offs, returns and fee reversals subtract; a shortfall states the unrecovered amount and moves nothing)
    daily_sequence: ordinal of a transfer among the plan's transfers booked on the same entry_date, starting at 1; 1 on every non-transfer entry
    delivery_speed: delivery speed of the transfer (copied onto its fee); none on other entries
    destination_type: where the transfer was delivered (copied onto its fee); none on other entries
    requested_time: time the worker confirmed a transfer; 00:00 on every non-transfer entry
    delivered_date: date the transfer was confirmed delivered; empty until delivered and on non-transfer entries
    delivery_minutes: minutes from the worker's confirmation to delivery confirmation of an instant transfer; empty for next-business-day transfers, undelivered transfers and non-transfer entries
  account: outstanding_advances
  direction: in
  triggers:
  - event: card:card_load
    when:
      destination_type: paystride_card
    map:
      amount: amount
      load_source: ewa_transfer
      source_ref_id: access_entry_id
- type: access_fee
  target: access_ledger
  meaning: The transfer fee owed on one early wage transfer, added to the outstanding balance and recovered on payday.
  grain: one row per fee-bearing transfer
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    pay_date: payday of the pay period the entry belongs to; for transfers and fees the payday on which they are due for recovery, for recoveries, shortfalls and write-offs the payday whose amount they settle
    amount: size of the movement, always greater than zero; its effect on the outstanding balance is fixed by event_type (transfers and fees add, recoveries, write-offs, returns and fee reversals subtract; a shortfall states the unrecovered amount and moves nothing)
    related_entry_id: 'the narrowest source entry this entry points back to: for a fee or a transfer return the transfer''s access_entry_id, for a fee reversal the fee''s access_entry_id, for a card autorecovery or a write-off the shortfall''s access_entry_id; empty on transfers, payroll and voluntary recoveries and shortfalls'
    fee_type: kind of fee on a fee entry or reversed by a fee reversal; none otherwise
    delivery_speed: delivery speed of the transfer (copied onto its fee); none on other entries
    destination_type: where the transfer was delivered (copied onto its fee); none on other entries
  account: outstanding_advances
  direction: in
  triggers: []
- type: access_repayment
  target: access_ledger
  meaning: An amount recovered against the advances due on a payday, by the employer's payroll deduction or the worker's voluntary payment.
  grain: one row per recovery collected
  distinguish_by:
  - pay_date
  - recovery_method
  - entry_date
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    pay_date: payday of the pay period the entry belongs to; for transfers and fees the payday on which they are due for recovery, for recoveries, shortfalls and write-offs the payday whose amount they settle
    amount: size of the movement, always greater than zero; its effect on the outstanding balance is fixed by event_type (transfers and fees add, recoveries, write-offs, returns and fee reversals subtract; a shortfall states the unrecovered amount and moves nothing)
    recovery_method: how a recovery was collected; none on other entries
  account: outstanding_advances
  direction: out
  triggers: []
- type: access_card_autorecovery
  target: access_ledger
  meaning: An amount recovered on a shortfall by debiting the worker's Paystride Visa Payroll Card under their standing authorization.
  grain: one row per shortfall recovered from the card
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    pay_date: payday of the pay period the entry belongs to; for transfers and fees the payday on which they are due for recovery, for recoveries, shortfalls and write-offs the payday whose amount they settle
    amount: size of the movement, always greater than zero; its effect on the outstanding balance is fixed by event_type (transfers and fees add, recoveries, write-offs, returns and fee reversals subtract; a shortfall states the unrecovered amount and moves nothing)
    recovery_method: how a recovery was collected; none on other entries
    related_entry_id: 'the narrowest source entry this entry points back to: for a fee or a transfer return the transfer''s access_entry_id, for a fee reversal the fee''s access_entry_id, for a card autorecovery or a write-off the shortfall''s access_entry_id; empty on transfers, payroll and voluntary recoveries and shortfalls'
  account: outstanding_advances
  direction: out
  triggers:
  - event: card:card_debit
    map:
      amount: amount
      debit_type: ewa_recovery
      source_ref_id: access_entry_id
- type: access_shortfall
  target: access_ledger
  meaning: The part of a payday's due amount the payroll deduction did not recover, with whether it is carried to a later payday.
  grain: one row per payday whose recovery fell short
  distinguish_by:
  - pay_date
  - entry_date
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    pay_date: payday of the pay period the entry belongs to; for transfers and fees the payday on which they are due for recovery, for recoveries, shortfalls and write-offs the payday whose amount they settle
    amount: size of the movement, always greater than zero; its effect on the outstanding balance is fixed by event_type (transfers and fees add, recoveries, write-offs, returns and fee reversals subtract; a shortfall states the unrecovered amount and moves nothing)
    reason_code: reason on shortfalls, write-offs, transfer returns and fee reversals; none on transfers, fees and recoveries
    carryforward_pay_date: on a shortfall, the later payday to which the unrecovered amount is carried; empty when it is not carried
  triggers: []
- type: access_writeoff
  target: access_ledger
  meaning: An unrecovered amount the provider absorbs without recourse to the worker.
  grain: one row per shortfall written off
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    pay_date: payday of the pay period the entry belongs to; for transfers and fees the payday on which they are due for recovery, for recoveries, shortfalls and write-offs the payday whose amount they settle
    amount: size of the movement, always greater than zero; its effect on the outstanding balance is fixed by event_type (transfers and fees add, recoveries, write-offs, returns and fee reversals subtract; a shortfall states the unrecovered amount and moves nothing)
    related_entry_id: 'the narrowest source entry this entry points back to: for a fee or a transfer return the transfer''s access_entry_id, for a fee reversal the fee''s access_entry_id, for a card autorecovery or a write-off the shortfall''s access_entry_id; empty on transfers, payroll and voluntary recoveries and shortfalls'
    reason_code: reason on shortfalls, write-offs, transfer returns and fee reversals; none on transfers, fees and recoveries
  account: outstanding_advances
  direction: out
  triggers: []
- type: access_transfer_return
  target: access_ledger
  meaning: Reversal of a transfer's principal when delivery failed or the receiving institution returned the funds.
  grain: one row per returned transfer
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    pay_date: payday of the pay period the entry belongs to; for transfers and fees the payday on which they are due for recovery, for recoveries, shortfalls and write-offs the payday whose amount they settle
    amount: size of the movement, always greater than zero; its effect on the outstanding balance is fixed by event_type (transfers and fees add, recoveries, write-offs, returns and fee reversals subtract; a shortfall states the unrecovered amount and moves nothing)
    related_entry_id: 'the narrowest source entry this entry points back to: for a fee or a transfer return the transfer''s access_entry_id, for a fee reversal the fee''s access_entry_id, for a card autorecovery or a write-off the shortfall''s access_entry_id; empty on transfers, payroll and voluntary recoveries and shortfalls'
    reason_code: reason on shortfalls, write-offs, transfer returns and fee reversals; none on transfers, fees and recoveries
  account: outstanding_advances
  direction: out
  triggers: []
- type: access_fee_reversal
  target: access_ledger
  meaning: Reversal of one booked transfer fee, in full.
  grain: one row per reversed fee
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date the entry was booked (Eastern Time calendar day)
    pay_date: payday of the pay period the entry belongs to; for transfers and fees the payday on which they are due for recovery, for recoveries, shortfalls and write-offs the payday whose amount they settle
    amount: size of the movement, always greater than zero; its effect on the outstanding balance is fixed by event_type (transfers and fees add, recoveries, write-offs, returns and fee reversals subtract; a shortfall states the unrecovered amount and moves nothing)
    related_entry_id: 'the narrowest source entry this entry points back to: for a fee or a transfer return the transfer''s access_entry_id, for a fee reversal the fee''s access_entry_id, for a card autorecovery or a write-off the shortfall''s access_entry_id; empty on transfers, payroll and voluntary recoveries and shortfalls'
    fee_type: kind of fee on a fee entry or reversed by a fee reversal; none otherwise
    reason_code: reason on shortfalls, write-offs, transfer returns and fee reversals; none on transfers, fees and recoveries
  account: outstanding_advances
  direction: out
  triggers: []
- type: access_earnings_sync
  target: access_earnings
  meaning: Earnings for hours worked, overtime, differentials or reported card tips arriving from the employer feed and added to the period's accrued net.
  grain: one row per work date and earnings source
  distinguish_by:
  - work_date
  - earnings_source
  fields:
    work_date: date the hours were worked; on a period close, the payday
    pay_date: payday of the pay period the earnings belong to
    earnings_source: what the earnings line represents, as reported by the employer feed
    hours_worked: hours represented by the line; 0.00 for tips and period closes
    gross_amount: gross earnings reported by the employer for the line; 0.00 where the employer reports net only and on period closes
    net_basis: whether net_amount came from the employer or was estimated from gross; none on period closes
    net_amount: accrued net earnings moved by the line, always greater than zero; syncs add to and corrections and period closes subtract from accrued net
  account: accrued_net_earnings
  direction: in
  triggers: []
- type: access_earnings_correction
  target: access_earnings
  meaning: A timecard correction from the employer feed that removes previously accrued net.
  grain: one row per corrected work date
  distinguish_by:
  - work_date
  - earnings_source
  fields:
    work_date: date the hours were worked; on a period close, the payday
    pay_date: payday of the pay period the earnings belong to
    earnings_source: what the earnings line represents, as reported by the employer feed
    hours_worked: hours represented by the line; 0.00 for tips and period closes
    gross_amount: gross earnings reported by the employer for the line; 0.00 where the employer reports net only and on period closes
    net_basis: whether net_amount came from the employer or was estimated from gross; none on period closes
    net_amount: accrued net earnings moved by the line, always greater than zero; syncs add to and corrections and period closes subtract from accrued net
  account: accrued_net_earnings
  direction: out
  triggers: []
- type: access_period_close
  target: access_earnings
  meaning: On payday the period's accrued net is paid through payroll and the accrual resets for the next period.
  grain: one row per plan per payday
  distinguish_by:
  - pay_date
  fields:
    work_date: date the hours were worked; on a period close, the payday
    pay_date: payday of the pay period the earnings belong to
    earnings_source: what the earnings line represents, as reported by the employer feed
    net_amount: accrued net earnings moved by the line, always greater than zero; syncs add to and corrections and period closes subtract from accrued net
  account: accrued_net_earnings
  direction: out
  triggers: []
measures:
- id: access_msr_period_accrued_net
  window: 'the plan''s current pay period: earnings lines whose pay_date equals the plan''s next_pay_date and whose work_date is at least earnings_availability_lag_days calendar days before today'
  measure: sum of net_amount of access_earnings_sync lines less sum of net_amount of access_earnings_correction lines in the window
- id: access_msr_period_transfer_total
  window: 'the plan''s current pay period: access_transfer entries whose pay_date equals the plan''s next_pay_date'
  measure: sum of amount of those transfers, excluding any transfer that has an access_transfer_return pointing to it
- id: access_msr_period_transfer_count
  window: the plan's current pay period, as for access_msr_period_transfer_total
  measure: count of those transfers, excluding returned ones
- id: access_msr_period_instant_count
  window: the plan's current pay period, as for access_msr_period_transfer_total
  measure: count of instant transfers among them, excluding returned ones, in order of entry_date then daily_sequence
- id: access_msr_period_fee_total
  window: 'the plan''s current pay period: access_fee entries whose pay_date equals the plan''s next_pay_date'
  measure: sum of amount of those fees less the amount of access_fee_reversal entries pointing to them
- id: access_msr_worker_day_transfer_total
  window: today's Eastern Time calendar day, across every plan the worker holds
  measure: sum of amount of access_transfer entries with entry_date equal to today, excluding returned transfers
- id: access_msr_worker_day_transfer_count
  window: today's Eastern Time calendar day, across every plan the worker holds
  measure: count of access_transfer entries with entry_date equal to today, excluding returned transfers
- id: access_msr_open_shortfall
  window: the plan at today's date
  measure: 'the plan''s outstanding_balance less access_msr_period_transfer_total less access_msr_period_fee_total: the amount still owed from paydays before next_pay_date (zero or less means none)'
- id: access_msr_payday_amount_due
  window: one payday P of the plan
  measure: sum of amount of access_transfer and access_fee entries with pay_date P, less their access_transfer_return and access_fee_reversal entries, plus the amount of any access_shortfall whose carryforward_pay_date is P
- id: access_msr_payday_recovered
  window: one payday P of the plan
  measure: sum of amount of access_repayment and access_card_autorecovery entries with pay_date P
- id: access_msr_shortfall_carry_chain
  window: one payday P of the plan
  measure: number of access_shortfall entries in the chain linked from carryforward_pay_date to pay_date that ends at the shortfall booked for P (1 when no earlier shortfall was carried to P)
- id: access_msr_consecutive_full_recoveries
  window: the plan's paydays in descending order of pay_date up to today
  measure: count of consecutive paydays that had an amount due and no access_shortfall entry, stopping at the first payday with a shortfall; paydays with nothing due neither count nor break the run
- id: access_msr_courtesy_reversals_365d
  window: the 365 calendar days ending today, across every plan the worker holds
  measure: count of access_fee_reversal entries with reason_code courtesy
- id: access_msr_employer_cap_percent
  window: current state of the employer program agreement referenced by the plan's agreement_id
  measure: configured_cap_percent on that program agreement
- id: access_msr_loan_installment_due
  window: current state of the worker's loan accounts
  measure: sum of installment_amount of the worker's Paystride payroll-repaid loans in status repaying whose next_installment_date equals the plan's next_pay_date
policies:
- id: access_agg_multi_holding
  subject:
  - access_enroll
  rule: A worker may hold up to max_per_customer Earned Wage Access Plans at once, counting every plan whose status is not closed; a second plan exists only for a second employer, because each plan belongs to one employer program agreement. A worker may not hold a second plan that is not closed under the same employer program agreement. Enrollment is accepted only while the employer's program agreement status is live. Re-enrollment under the same employer program agreement is accepted only when reenrollment_cooldown_days calendar days have passed since the closed_date of the worker's most recent closed plan under that agreement. Calendar days are counted from the day after that closed_date, so the first permitted re-enrollment date is the closed_date plus the cooldown days. An enrollment that would exceed either limit is refused and the worker uses the plan they already hold. Every new plan opens in pending_activation at Paystride Access Starter with a zero outstanding balance, the employee number, hire date, pay frequency and next payday taken from the employer's payroll file, and card_recovery_authorized false until the worker grants it.
  eligibility:
  - id: one_plan_per_agreement
    applies_to:
    - access_enroll
    kind: dedup
    condition: A worker may not hold a second plan that is not closed under the same employer program agreement.
    evidence_fields:
    - access_plans.agreement_id
    - access_plans.customer_id
    - access_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_plans.agreement_id
      action_bindings:
        access_plans.agreement_id: agreement_id
    dedup_contract:
      table: access_plans
      mode: separate_record
      object_bindings:
        agreement_id: agreement_id
        customer_id: customer_id
      duplicate_filters:
        status:
        - pending_activation
        - active
        - paused
        - suspended
      distinct_fields:
      - enrolled_date
  - id: program_live
    applies_to:
    - access_enroll
    kind: state
    condition: Enrollment is accepted only while the employer's program agreement status is live.
    evidence_fields:
    - program_agreements.status
    - program_agreements.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - program_agreements.agreement_id
      action_bindings:
        program_agreements.agreement_id: agreement_id
    state_contract:
      field: program_agreements.status
      allowed:
      - live
  - id: reenroll_cooldown
    applies_to:
    - access_enroll
    kind: time
    condition: Re-enrollment under the same employer program agreement is accepted only when reenrollment_cooldown_days calendar days have passed since the closed_date of the worker's most recent closed plan under that agreement.
    evidence_fields:
    - access_plans.closed_date
    - access_plans.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_plans.agreement_id
      action_bindings:
        access_plans.agreement_id: agreement_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the closed_date of the worker's most recent closed plan under that agreement
      anchor_source: access_plans.closed_date
      relation: not_before
      duration_source: variants.reenrollment_cooldown_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after that closed_date, so the first permitted re-enrollment date is the closed_date plus the cooldown days.
      boundary: inclusive
  params:
    max_per_customer: 2
- id: access_agg_combined_daily_limit
  subject:
  - access_transfer
  rule: 'When a worker holds two plans, the per-day dollar limit and the per-day transfer count apply to the worker, not to each plan: transfers booked on the same Eastern Time calendar day under both plans are added together (access_msr_worker_day_transfer_total and access_msr_worker_day_transfer_count) and compared with per_day_cap_usd and max_transfers_per_day of the higher-ranked of the two plans. The access percentage, the pay-period caps, fees and recoveries stay per plan, each computed from that plan''s own earnings, transfers and employer program. A worker with one plan is measured against that plan''s own per-day limits in the same way.'
  eligibility: []
  formula:
    day_room: per_day_cap_usd - access_msr_worker_day_transfer_total
  measures:
  - access_msr_worker_day_transfer_total
  - access_msr_worker_day_transfer_count
- id: access_evt_transfer_availability
  subject:
  - access_transfer
  rule: 'An early wage transfer is booked only on the worker''s own confirmation of its amount, delivery speed, destination and fee. A transfer may be booked only while the plan status is active. No transfer may be booked for the current pay period on or after the access cutoff, which falls access_cutoff_business_days_before_payday business days before the plan''s next payday. Business days are Monday through Friday excluding Federal Reserve holidays, counted backward from the next payday, so with a cutoff of two business days and a Friday payday the cutoff date is the Wednesday before it. Transfers requested on or after the cutoff can only be booked against the following pay period once it opens on the payday. The current pay period is the one ending on the plan''s next_pay_date, and every transfer booked for it carries that date as pay_date. The amount available for a new transfer is the lowest of: (a) the percentage room, which is the access percentage applied to access_msr_period_accrued_net less access_msr_period_transfer_total, where the access percentage is the tier''s access_cap_percent or, when it is lower, the configured cap the employer set on its program agreement (access_msr_employer_cap_percent); (b) the pay-period room, which is per_pay_period_cap_usd less access_msr_period_transfer_total; (c) the per-day room under access_agg_combined_daily_limit; (d) per_transfer_max_usd; and (e) where it applies, the room under access_combined_deduction_ceiling. A transfer returned or cancelled does not count toward any room. While the plan has an open shortfall (access_msr_open_shortfall above zero) the access percentage and the pay-period cap are each multiplied by access_during_open_shortfall_percent_of_cap, but only when the open shortfall does not exceed max_open_shortfall_usd_for_continued_access; otherwise, and on every tier where that percentage is zero, no transfer is booked until the shortfall is recovered or written off. The available amount is rounded down to the cent and is never below zero. A requested amount above the available amount is never booked at the requested figure; the worker may instead confirm any amount up to the available amount. A requested amount below per_transfer_min_usd is refused. No transfer is booked before access_msr_period_accrued_net reaches min_accrued_net_before_first_transfer_usd, once access_msr_period_transfer_count has reached max_transfers_per_pay_period, or once the day''s count under access_agg_combined_daily_limit has reached max_transfers_per_day. Instant delivery goes only to an external debit card or the worker''s Paystride Visa Payroll Card, and runs every day when weekend_instant_available is true; next-business-day delivery goes only to a bank account or the Paystride card and arrives nbd_delivery_business_days business days after the request date, a request after nbd_submission_cutoff_time_et or on a non-business day being treated as made on the following business day. The daily_sequence of a transfer is one more than the number of the plan''s transfers already booked that day.'
  eligibility:
  - id: plan_active
    applies_to:
    - access_transfer
    kind: state
    condition: A transfer may be booked only while the plan status is active.
    evidence_fields:
    - access_plans.status
    - access_plans.access_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_plans.access_plan_id
      action_bindings:
        access_plans.access_plan_id: access_plan_id
    state_contract:
      field: access_plans.status
      allowed:
      - active
  - id: access_cutoff
    applies_to:
    - access_transfer
    kind: time
    condition: No transfer may be booked for the current pay period on or after the access cutoff, which falls access_cutoff_business_days_before_payday business days before the plan's next payday.
    evidence_fields:
    - access_plans.next_pay_date
    - access_plans.access_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_plans.access_plan_id
      action_bindings:
        access_plans.access_plan_id: access_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the plan's next payday
      anchor_source: access_plans.next_pay_date
      relation: not_after
      duration_source: variants.access_cutoff_business_days_before_payday
      unit: business_days
      counting_rule: Business days are Monday through Friday excluding Federal Reserve holidays, counted backward from the next payday, so with a cutoff of two business days and a Friday payday the cutoff date is the Wednesday before it.
      boundary: exclusive
  params:
    per_tier:
      Paystride Access Starter:
        access_cap_percent: =access_cap_percent
        per_pay_period_cap_usd: =per_pay_period_cap_usd
        access_during_open_shortfall_percent_of_cap: 0
        max_open_shortfall_usd_for_continued_access: 0.0
        access_cutoff_business_days_before_payday: 2
      Paystride Access Standard:
        access_cap_percent: =access_cap_percent
        per_pay_period_cap_usd: =per_pay_period_cap_usd
        access_during_open_shortfall_percent_of_cap: 0
        max_open_shortfall_usd_for_continued_access: 0.0
        access_cutoff_business_days_before_payday: 2
      Paystride Access Plus:
        access_cap_percent: =access_cap_percent
        per_pay_period_cap_usd: =per_pay_period_cap_usd
        access_during_open_shortfall_percent_of_cap: 0
        max_open_shortfall_usd_for_continued_access: 0.0
        access_cutoff_business_days_before_payday: 2
      Paystride Access Preferred:
        access_cap_percent: =access_cap_percent
        per_pay_period_cap_usd: =per_pay_period_cap_usd
        access_during_open_shortfall_percent_of_cap: 0
        max_open_shortfall_usd_for_continued_access: 0.0
        access_cutoff_business_days_before_payday: 1
      Paystride Access Premier:
        access_cap_percent: =access_cap_percent
        per_pay_period_cap_usd: =per_pay_period_cap_usd
        access_during_open_shortfall_percent_of_cap: 50
        max_open_shortfall_usd_for_continued_access: 100.0
        access_cutoff_business_days_before_payday: 1
      Paystride Access Premier Plus:
        access_cap_percent: =access_cap_percent
        per_pay_period_cap_usd: =per_pay_period_cap_usd
        access_during_open_shortfall_percent_of_cap: 50
        max_open_shortfall_usd_for_continued_access: 200.0
        access_cutoff_business_days_before_payday: 1
  formula:
    shortfall_factor: 1 if access_msr_open_shortfall <= 0 else (access_during_open_shortfall_percent_of_cap / 100 if access_msr_open_shortfall <= max_open_shortfall_usd_for_continued_access else 0)
    percent_room: min(access_cap_percent, access_msr_employer_cap_percent) / 100 * shortfall_factor * access_msr_period_accrued_net - access_msr_period_transfer_total
    period_room: per_pay_period_cap_usd * shortfall_factor - access_msr_period_transfer_total
    day_room: per_day_cap_usd - access_msr_worker_day_transfer_total
    available: max(0, min(percent_room, period_room, day_room, per_transfer_max_usd))
  measures:
  - access_msr_period_accrued_net
  - access_msr_period_transfer_total
  - access_msr_period_transfer_count
  - access_msr_open_shortfall
  - access_msr_employer_cap_percent
  - access_msr_worker_day_transfer_total
- id: access_evt_transfer_fee
  subject:
  - access_fee
  rule: 'A transfer carries at most one fee entry. The fee is booked as its own entry pointing to the transfer through related_entry_id, carrying the transfer''s pay_date, delivery_speed and destination_type, and is added to the outstanding balance to be recovered on that payday; it is never taken out of the amount delivered. The listed fee is set by speed and destination at the plan''s tier: an instant transfer to an external debit card costs instant_fee_external_debit_usd plus the surcharge of the instant_fee_band_surcharge_usd band that contains the transfer amount; an instant transfer to the Paystride Visa Payroll Card costs instant_fee_paystride_card_usd; a next-business-day transfer to a bank account costs nbd_fee_bank_usd; a next-business-day transfer to the Paystride card costs nbd_fee_paystride_card_usd. The adjustments then apply in this order and do not add to one another. First, the tier benefit: an instant transfer whose position among the period''s instant transfers (access_msr_period_instant_count, the new transfer included) is within free_instant_transfers_per_pay_period carries no fee. Second, the employer''s fee model on the program agreement: under employer_paid a transfer whose position among all of the period''s transfers (access_msr_period_transfer_count, the new transfer included) is within the employer_paid_transfers_per_worker_per_period of the employer''s program tier carries no fee to the worker, the employer paying through its per-worker monthly fee; under employer_sponsored a transfer whose position among all of the period''s transfers (access_msr_period_transfer_count, the new transfer included) is within the sponsored_free_transfers_per_worker_per_period of the employer''s program tier carries no fee to the worker and is billed to the employer; under worker_paid the worker pays the listed fee. Third, the period fee cap: the fee is reduced to the room left between fee_cap_per_pay_period_usd and access_msr_period_fee_total, so the worker''s fees for a pay period never exceed the cap. When the resulting fee is zero no fee entry is booked.'
  eligibility:
  - id: one_fee_per_transfer
    applies_to:
    - access_fee
    kind: dedup
    condition: A transfer carries at most one fee entry.
    evidence_fields:
    - access_ledger.related_entry_id
    - access_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_ledger.related_entry_id
      action_bindings:
        access_ledger.related_entry_id: related_entry_id
    dedup_contract:
      table: access_ledger
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - access_fee
      distinct_fields: []
  params:
    per_tier:
      Paystride Access Starter:
        instant_fee_external_debit_usd: =instant_fee_external_debit_usd
        nbd_fee_bank_usd: =nbd_fee_bank_usd
        free_instant_transfers_per_pay_period: =free_instant_transfers_per_pay_period
        fee_cap_per_pay_period_usd: =fee_cap_per_pay_period_usd
      Paystride Access Standard:
        instant_fee_external_debit_usd: =instant_fee_external_debit_usd
        nbd_fee_bank_usd: =nbd_fee_bank_usd
        free_instant_transfers_per_pay_period: =free_instant_transfers_per_pay_period
        fee_cap_per_pay_period_usd: =fee_cap_per_pay_period_usd
      Paystride Access Plus:
        instant_fee_external_debit_usd: =instant_fee_external_debit_usd
        nbd_fee_bank_usd: =nbd_fee_bank_usd
        free_instant_transfers_per_pay_period: =free_instant_transfers_per_pay_period
        fee_cap_per_pay_period_usd: =fee_cap_per_pay_period_usd
      Paystride Access Preferred:
        instant_fee_external_debit_usd: =instant_fee_external_debit_usd
        nbd_fee_bank_usd: =nbd_fee_bank_usd
        free_instant_transfers_per_pay_period: =free_instant_transfers_per_pay_period
        fee_cap_per_pay_period_usd: =fee_cap_per_pay_period_usd
      Paystride Access Premier:
        instant_fee_external_debit_usd: =instant_fee_external_debit_usd
        nbd_fee_bank_usd: =nbd_fee_bank_usd
        free_instant_transfers_per_pay_period: =free_instant_transfers_per_pay_period
        fee_cap_per_pay_period_usd: =fee_cap_per_pay_period_usd
      Paystride Access Premier Plus:
        instant_fee_external_debit_usd: =instant_fee_external_debit_usd
        nbd_fee_bank_usd: =nbd_fee_bank_usd
        free_instant_transfers_per_pay_period: =free_instant_transfers_per_pay_period
        fee_cap_per_pay_period_usd: =fee_cap_per_pay_period_usd
  formula:
    listed_fee: ((instant_fee_external_debit_usd + instant_fee_band_surcharge_usd) if destination_type == 'external_debit_card' else instant_fee_paystride_card_usd) if delivery_speed == 'instant' else (nbd_fee_bank_usd if destination_type == 'bank_account' else nbd_fee_paystride_card_usd)
    amount: max(0, min(listed_fee, fee_cap_per_pay_period_usd - access_msr_period_fee_total))
  measures:
  - access_msr_period_fee_total
  - access_msr_period_instant_count
  - access_msr_period_transfer_count
- id: access_evt_payday_recovery
  subject:
  - access_repayment
  - access_shortfall
  - access_card_autorecovery
  rule: 'On each payday the amount due is access_msr_payday_amount_due: the transfers and fees carrying that pay_date, net of their returns and reversals, plus any shortfall carried to that payday, less any credit left on the plan by a reversal of an already recovered fee. The employer deducts the amount due from the worker''s paycheck under the program''s deduction file and the amount the employer reports as deducted is booked as a payroll_deduction recovery carrying that pay_date. When net pay cannot cover the whole amount and partial_deduction_allowed is true, the employer deducts what net pay covers. When the recoveries for the payday (access_msr_payday_recovered) are less than the amount due, the difference is booked as one shortfall for that pay_date with the reason the employer reported: net_pay_insufficient, deduction_not_taken or employment_ended. A payday''s shortfall is booked once. A shortfall is carried to the worker''s next payday, recorded as its carryforward_pay_date, while access_msr_shortfall_carry_chain is no more than carryforward_max_pay_periods; a shortfall that would exceed that limit is not carried and is written off under access_evt_writeoff, and a shortfall with reason employment_ended is never carried. When card_autorecovery_allowed is true, the plan may also be recovered from the worker''s card. A card autorecovery debit may be attempted only when the plan''s card_recovery_authorized is true. A card autorecovery debit may be attempted only while the worker''s Paystride Visa Payroll Card account status is active. A card autorecovery debit may not be attempted before card_autorecovery_delay_business_days business days have passed after the payday whose amount fell short. Business days are Monday through Friday excluding Federal Reserve holidays, counted forward from the day after that payday. The debit is for the lesser of the open shortfall and the card''s available balance, at most autorecovery_max_attempts_per_shortfall times per shortfall, and is booked as a card autorecovery pointing to the shortfall and carrying its pay_date; a debit the card cannot cover in full is never retried for the rest. A shortfall is recovered from the card at most once. When voluntary_repayment_allowed is true the worker may pay part or all of the outstanding balance from their own funds at any time, at least voluntary_payment_min_usd or the whole balance when smaller, booked as a voluntary_payment recovery applied to the oldest unpaid payday first. Recoveries never exceed the outstanding balance, and no interest, late fee or collection charge is ever added to an unrecovered amount.'
  eligibility:
  - id: recovery_authorized
    applies_to:
    - access_card_autorecovery
    kind: authorization
    condition: A card autorecovery debit may be attempted only when the plan's card_recovery_authorized is true.
    evidence_fields:
    - access_plans.card_recovery_authorized
    - access_plans.access_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_plans.access_plan_id
      action_bindings:
        access_plans.access_plan_id: access_plan_id
  - id: card_active
    applies_to:
    - access_card_autorecovery
    kind: state
    condition: A card autorecovery debit may be attempted only while the worker's Paystride Visa Payroll Card account status is active.
    evidence_fields:
    - card_accounts.status
    - card_accounts.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.customer_id
      action_bindings:
        card_accounts.customer_id: customer_id
    state_contract:
      field: card_accounts.status
      allowed:
      - active
  - id: autorecovery_delay
    applies_to:
    - access_card_autorecovery
    kind: time
    condition: A card autorecovery debit may not be attempted before card_autorecovery_delay_business_days business days have passed after the payday whose amount fell short.
    evidence_fields:
    - access_ledger.pay_date
    - access_ledger.access_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_ledger.access_entry_id
      action_bindings:
        access_ledger.access_entry_id: related_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the payday whose amount fell short
      anchor_source: access_ledger.pay_date
      relation: not_before
      duration_source: variants.card_autorecovery_delay_business_days
      unit: business_days
      counting_rule: Business days are Monday through Friday excluding Federal Reserve holidays, counted forward from the day after that payday.
      boundary: inclusive
  - id: one_autorecovery_per_shortfall
    applies_to:
    - access_card_autorecovery
    kind: dedup
    condition: A shortfall is recovered from the card at most once.
    evidence_fields:
    - access_ledger.related_entry_id
    - access_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_ledger.related_entry_id
      action_bindings:
        access_ledger.related_entry_id: related_entry_id
    dedup_contract:
      table: access_ledger
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - access_card_autorecovery
      distinct_fields: []
  - id: one_shortfall_per_payday
    applies_to:
    - access_shortfall
    kind: dedup
    condition: A payday's shortfall is booked once.
    evidence_fields:
    - access_ledger.pay_date
    - access_ledger.access_plan_id
    - access_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_ledger.access_plan_id
        - access_ledger.pay_date
      action_bindings:
        access_ledger.access_plan_id: access_plan_id
        access_ledger.pay_date: pay_date
    dedup_contract:
      table: access_ledger
      mode: separate_record
      object_bindings:
        access_plan_id: access_plan_id
        pay_date: pay_date
      duplicate_filters:
        event_type:
        - access_shortfall
      distinct_fields: []
  params:
    per_tier:
      Paystride Access Starter:
        carryforward_max_pay_periods: =carryforward_max_pay_periods
        card_autorecovery_delay_business_days: =card_autorecovery_delay_business_days
      Paystride Access Standard:
        carryforward_max_pay_periods: =carryforward_max_pay_periods
        card_autorecovery_delay_business_days: =card_autorecovery_delay_business_days
      Paystride Access Plus:
        carryforward_max_pay_periods: =carryforward_max_pay_periods
        card_autorecovery_delay_business_days: =card_autorecovery_delay_business_days
      Paystride Access Preferred:
        carryforward_max_pay_periods: =carryforward_max_pay_periods
        card_autorecovery_delay_business_days: =card_autorecovery_delay_business_days
      Paystride Access Premier:
        carryforward_max_pay_periods: =carryforward_max_pay_periods
        card_autorecovery_delay_business_days: =card_autorecovery_delay_business_days
      Paystride Access Premier Plus:
        carryforward_max_pay_periods: =carryforward_max_pay_periods
        card_autorecovery_delay_business_days: =card_autorecovery_delay_business_days
  formula:
    shortfall_amount: access_msr_payday_amount_due - access_msr_payday_recovered
  measures:
  - access_msr_payday_amount_due
  - access_msr_payday_recovered
  - access_msr_shortfall_carry_chain
- id: access_evt_writeoff
  subject:
  - access_writeoff
  rule: 'An unrecovered amount is written off without recourse to the worker in two cases: a shortfall that cannot be carried because access_msr_shortfall_carry_chain has reached carryforward_max_pay_periods is written off with reason carryforward_limit_reached, and a shortfall with reason employment_ended, which is never carried, is written off with reason employment_ended. A write-off is booked only after writeoff_wait_days calendar days have passed since the payday of the shortfall it writes off. Calendar days are counted from the day after that payday, so the earliest write-off date is the payday plus the number of days. A shortfall is written off at most once. The write-off points to its shortfall through related_entry_id, carries the shortfall''s pay_date, and its amount is the shortfall amount less any card autorecovery or voluntary payment collected against that pay_date after the shortfall was booked. A written-off amount is never reported to a credit bureau, sold, placed with a collector, or charged interest or fees, and it is never re-billed to the worker; when writeoff_resets_to_starter is true the plan returns to Paystride Access Starter at the next level review.'
  eligibility:
  - id: writeoff_wait
    applies_to:
    - access_writeoff
    kind: time
    condition: A write-off is booked only after writeoff_wait_days calendar days have passed since the payday of the shortfall it writes off.
    evidence_fields:
    - access_ledger.pay_date
    - access_ledger.access_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_ledger.access_entry_id
      action_bindings:
        access_ledger.access_entry_id: related_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the payday of the shortfall it writes off
      anchor_source: access_ledger.pay_date
      relation: not_before
      duration_source: variants.writeoff_wait_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after that payday, so the earliest write-off date is the payday plus the number of days.
      boundary: inclusive
  - id: one_writeoff_per_shortfall
    applies_to:
    - access_writeoff
    kind: dedup
    condition: A shortfall is written off at most once.
    evidence_fields:
    - access_ledger.related_entry_id
    - access_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_ledger.related_entry_id
      action_bindings:
        access_ledger.related_entry_id: related_entry_id
    dedup_contract:
      table: access_ledger
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - access_writeoff
      distinct_fields: []
  formula:
    amount: access_msr_payday_amount_due - access_msr_payday_recovered
  measures:
  - access_msr_shortfall_carry_chain
  - access_msr_payday_amount_due
  - access_msr_payday_recovered
- id: access_evt_returns_and_reversals
  subject:
  - access_transfer_return
  - access_fee_reversal
  rule: When a transfer's delivery fails or the receiving institution returns the funds, its whole principal is reversed by a transfer return pointing to the transfer, booked within return_reversal_business_days business days of the failure or return notice with reason delivery_failed or returned_by_receiving_institution, and the transfer's fee is reversed in full with the same reason. When nbd_cancel_before_cutoff_allowed is true a next-business-day transfer the worker cancels before nbd_submission_cutoff_time_et on its request date is reversed the same way with reason cancelled_before_cutoff; an instant transfer, or a next-business-day transfer after that cutoff, can never be cancelled or reversed at the worker's request. A transfer is returned at most once. An instant transfer whose delivery_minutes exceed instant_delivery_sla_minutes has its fee reversed with reason instant_delivery_late when late_instant_fee_refund is true, and a next-business-day transfer whose delivered_date is later than its expected delivery date has its fee reversed with reason nbd_delivery_late when late_nbd_fee_refund is true; in both cases the principal stands. A second fee booked for the same transfer is reversed with reason duplicate_fee. Beyond these, the desk may grant one courtesy reversal of a fee at the worker's request only while access_msr_courtesy_reversals_365d is below courtesy_fee_reversals_per_12_months; a tier allowing none grants none. A fee reversal of any reason is booked only within fee_reversal_request_window_days calendar days of the fee's entry date. Calendar days are counted from the day after the fee's entry_date, so the last day to ask is the entry_date plus the window. Reversals for delivery failure, returns, cancellations and late delivery are booked on the notice without a request, which falls well inside that window; a duplicate fee or a courtesy reversal needs the worker's request inside it, and after it no fee is reversed for any reason. A fee is reversed at most once. A reversal always reverses the whole fee, points to it through related_entry_id, and carries the fee's pay_date and fee_type. Where the fee was already recovered on its payday, the reversal leaves a credit on the plan that is applied against the next payday's amount due; it is never paid out in cash.
  eligibility:
  - id: fee_request_window
    applies_to:
    - access_fee_reversal
    kind: time
    condition: A fee reversal of any reason is booked only within fee_reversal_request_window_days calendar days of the fee's entry date.
    evidence_fields:
    - access_ledger.entry_date
    - access_ledger.access_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_ledger.access_entry_id
      action_bindings:
        access_ledger.access_entry_id: related_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the fee's entry date
      anchor_source: access_ledger.entry_date
      relation: not_after
      duration_source: variants.fee_reversal_request_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the fee's entry_date, so the last day to ask is the entry_date plus the window.
      boundary: inclusive
  - id: one_reversal_per_fee
    applies_to:
    - access_fee_reversal
    kind: dedup
    condition: A fee is reversed at most once.
    evidence_fields:
    - access_ledger.related_entry_id
    - access_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_ledger.related_entry_id
      action_bindings:
        access_ledger.related_entry_id: related_entry_id
    dedup_contract:
      table: access_ledger
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - access_fee_reversal
      distinct_fields: []
  - id: one_return_per_transfer
    applies_to:
    - access_transfer_return
    kind: dedup
    condition: A transfer is returned at most once.
    evidence_fields:
    - access_ledger.related_entry_id
    - access_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_ledger.related_entry_id
      action_bindings:
        access_ledger.related_entry_id: related_entry_id
    dedup_contract:
      table: access_ledger
      mode: separate_record
      object_bindings:
        related_entry_id: related_entry_id
      duplicate_filters:
        event_type:
        - access_transfer_return
      distinct_fields: []
  params:
    per_tier:
      Paystride Access Starter:
        courtesy_fee_reversals_per_12_months: =courtesy_fee_reversals_per_12_months
        fee_reversal_request_window_days: =fee_reversal_request_window_days
      Paystride Access Standard:
        courtesy_fee_reversals_per_12_months: =courtesy_fee_reversals_per_12_months
        fee_reversal_request_window_days: =fee_reversal_request_window_days
      Paystride Access Plus:
        courtesy_fee_reversals_per_12_months: =courtesy_fee_reversals_per_12_months
        fee_reversal_request_window_days: =fee_reversal_request_window_days
      Paystride Access Preferred:
        courtesy_fee_reversals_per_12_months: =courtesy_fee_reversals_per_12_months
        fee_reversal_request_window_days: =fee_reversal_request_window_days
      Paystride Access Premier:
