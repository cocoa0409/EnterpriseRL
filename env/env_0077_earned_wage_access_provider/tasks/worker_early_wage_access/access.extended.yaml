- id: access_ext_missed_recovery_review
  base_policy_refs:
  - access_level_review
  - access_evt_writeoff
  overwrite:
  - base_policy: access_level_review
    superseded_clause: A payday with a shortfall moves the plan down by downgrade_steps_on_shortfall tiers at that review, never below Paystride Access Starter, and a write-off returns it to Paystride Access Starter when writeoff_resets_to_starter is true; a downgrade and an upgrade never happen at the same review, the downgrade prevailing.
    replaced_by: 'At a review under this schedule the plan never moves up, and it lands where the protections set out below place it; this replaces, for every payday that carries a shortfall, the base rule that reads: A payday with a shortfall moves the plan down by downgrade_steps_on_shortfall tiers at that review, never below Paystride Access Starter, and a write-off returns it to Paystride Access Starter when writeoff_resets_to_starter is true; a downgrade and an upgrade never happen at the same review, the downgrade prevailing. At a review of a payday that carries no shortfall the write-off return applies as the tier review schedule states.'
  - base_policy: access_level_review
    superseded_clause: The new tier applies to transfers booked from the day after the payday, which is recorded as level_effective_date.
    replaced_by: 'The tier a missed-recovery review sets applies to transfers booked from the day after the payday reviewed, and that day is recorded as the plan''s level_effective_date, whatever day the review is recorded, a transfer or fee already booked when the review is recorded keeping the terms in force when it was booked; this replaces, for every review under this schedule, the base rule that reads: The new tier applies to transfers booked from the day after the payday, which is recorded as level_effective_date. A review under the tier review schedule takes effect as that schedule states.'
  - base_policy: access_evt_writeoff
    superseded_clause: when writeoff_resets_to_starter is true the plan returns to Paystride Access Starter at the next level review.
    replaced_by: 'A write-off counts at the review of the first payday on or after the day it is booked, a write-off booked on a payday always standing before that payday''s review is recorded: one booked after the payday reviewed is taken at the review of the plan''s next payday, never at the review recorded for the payday before it, and while such a write-off is the plan''s latest the review takes no earlier write-off either, the next payday''s review returning the plan to Paystride Access Starter for both; this replaces, for every review under this schedule, the base rule that reads: when writeoff_resets_to_starter is true the plan returns to Paystride Access Starter at the next level review. A review under the tier review schedule takes write-offs as that schedule states.'
  - base_policy: access_level_review
    superseded_clause: The plan tier is reviewed level_review_cadence, after that payday's recoveries and any shortfall are booked.
    replaced_by: 'Each payday is reviewed once and only after it has closed: the review of the latest closed payday is recorded no earlier than the day after that payday, once that payday''s payroll settlement and any write-off booked on it are on the plan, and it is owed only while the plan''s level_effective_date is on or before that payday; a recorded review leaves level_effective_date the day after the payday it covers, so a review recorded late, even on or after the next payday, never makes the next payday''s review fall due or lapse; when a later payday''s period close is booked before an earlier payday''s review is recorded, the one review of the latest closed payday covers every payday since the level_effective_date; this replaces, for every review under this schedule, the base rule that reads: The plan tier is reviewed level_review_cadence, after that payday''s recoveries and any shortfall are booked. A review under the tier review schedule falls due as that schedule states.'
  trigger: state_due
  subject:
  - access_level_change
  computes: new_variant_name
  target_tool: record_missed_recovery_review_3a64d9dd
  params: {}
  rule: 'This missed-recovery review schedule governs the tier review of the plan''s latest closed payday, the pay_date of its latest period close line, when a shortfall carries a pay_date on or after the plan''s level_effective_date, a payday no review has yet covered; the latest such pay_date is the shortfall payday, and a plan without such a shortfall is reviewed under the tier review schedule instead. Each payday is reviewed once and only after it has closed: the review of the latest closed payday is recorded no earlier than the day after that payday, once that payday''s payroll settlement and any write-off booked on it are on the plan, and it is owed only while the plan''s level_effective_date is on or before that payday; a recorded review leaves level_effective_date the day after the payday it covers, so a review recorded late, even on or after the next payday, never makes the next payday''s review fall due or lapse; when a later payday''s period close is booked before an earlier payday''s review is recorded, the one review of the latest closed payday covers every payday since the level_effective_date; this replaces, for every review under this schedule, the base rule that reads: The plan tier is reviewed level_review_cadence, after that payday''s recoveries and any shortfall are booked. A review under the tier review schedule falls due as that schedule states. At a review under this schedule the plan returns to Paystride Access Starter. The tiers rank upward from Paystride Access Starter through Paystride Access Standard, Paystride Access Plus, Paystride Access Preferred and Paystride Access Premier to Paystride Access Premier Plus; a tier named below as one or two below the current tier never goes below Paystride Access Starter. At a review under this schedule the plan never moves up, and it lands where the protections set out below place it; this replaces, for every payday that carries a shortfall, the base rule that reads: A payday with a shortfall moves the plan down by downgrade_steps_on_shortfall tiers at that review, never below Paystride Access Starter, and a write-off returns it to Paystride Access Starter when writeoff_resets_to_starter is true; a downgrade and an upgrade never happen at the same review, the downgrade prevailing. At a review of a payday that carries no shortfall the write-off return applies as the tier review schedule states. Each protection below names the highest tier it lets the plan keep; a protection lets the plan keep only Paystride Access Starter unless one of its own tiers names a higher tier for the plan; the plan lands on the lowest of those tiers and never higher than one tier below its current tier, and when writeoff_resets_to_starter is true and the plan''s latest write-off was booked on or after its level_effective_date and on or before the payday reviewed it lands on Paystride Access Starter whatever the protections allow. A write-off counts at the review of the first payday on or after the day it is booked, a write-off booked on a payday always standing before that payday''s review is recorded: one booked after the payday reviewed is taken at the review of the plan''s next payday, never at the review recorded for the payday before it, and while such a write-off is the plan''s latest the review takes no earlier write-off either, the next payday''s review returning the plan to Paystride Access Starter for both; this replaces, for every review under this schedule, the base rule that reads: when writeoff_resets_to_starter is true the plan returns to Paystride Access Starter at the next level review. A review under the tier review schedule takes write-offs as that schedule states. A record falls in the last N months when fewer than N whole months separate its date from today, whole months being the difference in calendar months less one when today''s day of the month is smaller than that date''s. The repeat protection rests on the shortfalls carrying a pay_date in the last twelve months, the reviewed payday''s included: one lets the plan keep the tier one below its current tier, two let it keep the tier two below, and three or more leave only Paystride Access Starter. The cure protection measures the cured share, what was collected on the shortfall carrying the shortfall payday over that shortfall, by method: for a plan whose card_recovery_authorized is true held by a worker with a Paystride Visa Payroll Card account whose status is active, what was collected is the amount of the debits with debit_type ewa_recovery posted to the worker''s card accounts in the last month; for a plan without both that authorization and an active card account, with voluntary_payment recoveries carrying the shortfall payday, what was collected is their amount; otherwise nothing counts as collected and the cured share is zero. A cured share of 50 percent or more lets the plan keep the tier one below its current tier, 25 percent up to 50 percent the tier two below, and less than 25 percent, a cured share of zero included, leaves only Paystride Access Starter. The tenure protection rests on the calendar days from the plan''s hire_date to the payday: 365 or more let the plan keep the tier one below its current tier, 180 to 364 the tier two below, and fewer than 180 leave only Paystride Access Starter. The write-off protection rests on the plan''s latest write-off: when none stands, or its entry_date falls more than 365 calendar days before the payday, the plan may keep the tier one below its current tier; 181 to 365 days before it, the tier two below; on the payday or up to 180 days before it, or after the payday, only Paystride Access Starter. The payroll-continuity protection rests on the plan''s paydays whose period close line carries a pay_date in the last three months: five or more let the plan keep the tier one below its current tier, three or four the tier two below, and fewer than three leave only Paystride Access Starter. The tier a missed-recovery review sets applies to transfers booked from the day after the payday reviewed, and that day is recorded as the plan''s level_effective_date, whatever day the review is recorded, a transfer or fee already booked when the review is recorded keeping the terms in force when it was booked; this replaces, for every review under this schedule, the base rule that reads: The new tier applies to transfers booked from the day after the payday, which is recorded as level_effective_date. A review under the tier review schedule takes effect as that schedule states.'
  prerequisite: []
  cross_category:
  - category: card
    as: history
    reads:
    - status
    - card_transactions.event_type
    - card_transactions.debit_type
    - card_transactions.posted_date
    - card_transactions.amount
    note: 'cure_protection: the ewa_recovery debits the worker''s card ledger shows in the last month, read when the plan holds the card recovery authorization and the card account is active'
  compute:
  - pd_lcp: LATEST('access_earnings', 'pay_date', date_field='pay_date', event_type='access_period_close')
  - pd_cur: 1 if F('variant_name') == 'Paystride Access Starter' else (2 if F('variant_name') == 'Paystride Access Standard' else (3 if F('variant_name') == 'Paystride Access Plus' else (4 if F('variant_name') == 'Paystride Access Preferred' else (5 if F('variant_name') == 'Paystride Access Premier' else 6))))
  - pd_sp: LATEST('access_ledger', 'pay_date', date_field='pay_date', event_type='access_shortfall')
  - pd_one: MX(1, pd_cur - 1)
  - pd_two: MX(1, pd_cur - 2)
  - pd_last_wo: LATEST('access_ledger', 'entry_date', date_field='entry_date', event_type='access_writeoff')
  - pd_reset: 1 if P('writeoff_resets_to_starter') and pd_last_wo != None and pd_lcp != None and pd_last_wo >= F('level_effective_date') and pd_last_wo <= pd_lcp else 0
  - pd_sf_12m: COUNT('access_ledger', within_months=12, date_field='pay_date', event_type='access_shortfall')
  - pd_rep_allow: pd_one if pd_sf_12m <= 1 else (pd_two if pd_sf_12m == 2 else 1)
  - pd_short: SUM('access_ledger', 'amount', event_type='access_shortfall', pay_date=pd_sp)
  - pd_card_coll: XSUM('card', 'card_transactions', 'amount', within_months=1, date_field='posted_date', event_type='card_debit', debit_type='ewa_recovery')
  - pd_vol_coll: SUM('access_ledger', 'amount', event_type='access_repayment', recovery_method='voluntary_payment', pay_date=pd_sp)
  - pd_collected: pd_card_coll if F('card_recovery_authorized') and EXISTS('card', status='active') else (pd_vol_coll if pd_vol_coll > 0 and not (F('card_recovery_authorized') and EXISTS('card', status='active')) else 0)
  - pd_cure_allow: pd_one if pd_short > 0 and pd_collected * 2 >= pd_short else (pd_two if pd_short > 0 and pd_collected * 4 >= pd_short else 1)
  - pd_tenure: DAYS(F('hire_date'), pd_lcp) if pd_lcp != None else 0
  - pd_ten_allow: pd_one if pd_tenure >= 365 else (pd_two if pd_tenure >= 180 else 1)
  - pd_wo_days: DAYS(pd_last_wo, pd_lcp) if pd_last_wo != None and pd_lcp != None else 9999
  - pd_wo_allow: pd_one if pd_wo_days > 365 else (pd_two if pd_wo_days >= 181 else 1)
  - pd_closes_3m: COUNT('access_earnings', within_months=3, date_field='pay_date', event_type='access_period_close')
  - pd_emp_allow: pd_one if pd_closes_3m >= 5 else (pd_two if pd_closes_3m >= 3 else 1)
  - pd_new: 1 if pd_reset == 1 else MN(pd_one, pd_rep_allow, pd_cure_allow, pd_ten_allow, pd_wo_allow, pd_emp_allow)
  - result: '''Paystride Access Starter'' if pd_new == 1 else (''Paystride Access Standard'' if pd_new == 2 else (''Paystride Access Plus'' if pd_new == 3 else (''Paystride Access Preferred'' if pd_new == 4 else (''Paystride Access Premier'' if pd_new == 5 else ''Paystride Access Premier Plus''))))'
