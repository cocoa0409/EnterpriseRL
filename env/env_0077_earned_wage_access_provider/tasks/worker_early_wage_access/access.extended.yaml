  - bf_fees_cur: SUM('access_ledger', 'amount', event_type='access_fee', pay_date=bf_pay) - SUM('access_ledger', 'amount', event_type='access_fee_reversal', pay_date=bf_pay)
  - bf_first: 1 if COUNT('access_ledger', event_type='access_transfer', pay_date=bf_pay, destination_type='bank_account') == 1 else 0
  - bf_others: COUNT('access_ledger', event_type='access_transfer', pay_date=bf_pay) - 1
  - bf_free: 0 if bf_first == 1 and bf_others >= 4 else ((1 if bf_amount <= 100 else 0) if bf_first == 1 and bf_others >= 2 else bf_first)
  - bf_weekday: DAYS('2024-01-01', NOW) % 7
  - bf_charged: MX(0, P('nbd_fee_bank_usd') - 0.5) if bf_time > '17:00' and bf_weekday <= 3 else (MX(0, P('nbd_fee_bank_usd') - 1.0) if (bf_time > '17:00' and bf_weekday == 4) or bf_weekday >= 5 else P('nbd_fee_bank_usd'))
  - bf_band_amt: LATEST('access_ledger', 'amount', date_field='entry_date', event_type='access_transfer', entry_date=NOW, daily_sequence=bf_seq) or 0
