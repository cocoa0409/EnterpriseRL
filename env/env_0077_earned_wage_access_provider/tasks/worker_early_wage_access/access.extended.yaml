  factors:
  - id: shortfall_method
    effect: method
    decides: it_pct_room
    bindings:
    - it_open
    - it_carried
    - it_room_pair
    - it_pct_room
    - it_period_room
    ladder:
    - when: open shortfall above zero AND within the tier's max_open_shortfall_usd_for_continued_access on a tier whose access_during_open_shortfall_percent_of_cap is above zero AND not above the shortfalls carried to the next payday
      method: both rooms reduced by the open shortfall
    - when: open shortfall above zero AND within that limit on such a tier AND above the carried amount
      method: access_cap_percent and per_pay_period_cap_usd each multiplied by access_during_open_shortfall_percent_of_cap / 100 before the rooms are taken
    - when: open shortfall above zero AND (above that limit OR the tier's percentage is zero)
      method: both rooms zero
    - when: otherwise (open shortfall zero or less)
      method: rooms as the baseline states
    baseline:
      it_pct_room: P('access_cap_percent') / 100 * it_accrued - it_taken
      it_period_room: P('per_pay_period_cap_usd') - it_taken
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: push_failure_share
    effect: parameter
    decides: it_fail_share
    bindings:
    - it_fail_3m
    - it_fail_6m
    - it_fail_share
    ladder:
    - when: a transfer return with reason_code delivery_failed booked in the last three months
      value: '0.5'
    - when: one booked in the last six months but none in the last three
      value: '0.75'
    - when: otherwise
      value: '1'
    baseline:
      it_fail_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: new_destination_share
    effect: parameter
    decides: it_new_share
    bindings:
    - it_ext_6m
    - it_new_share
    ladder:
    - when: no instant transfer to an external debit card booked in the last six months before today
      value: '0.6'
    - when: one or two such transfers
      value: '0.8'
    - when: otherwise (three or more)
      value: '1'
    baseline:
      it_new_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: velocity_share
    effect: parameter
    decides: it_vel_share
    bindings:
    - it_today_instant
    - it_today_amt
    - it_vel_share
    ladder:
    - when: two or more instant transfers already booked on the plan today OR instant transfers already booked today totalling 300.00 or more
      value: '0.7'
    - when: exactly one instant transfer already booked today AND those transfers totalling less than 300.00
      value: '0.85'
    - when: otherwise (none)
      value: '1'
    baseline:
      it_vel_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: period_advance_share
    effect: parameter
    decides: it_out_share
    bindings:
    - it_adv_amt
    - it_out_ratio
    - it_out_share
    ladder:
    - when: transfers and fees already carrying the next payday, net, above 30 percent of the instant accrued net (or any with no accrued net)
      value: '0.8'
    - when: above 10 up to 30 percent
      value: '0.9'
    - when: otherwise (10 percent or less)
      value: '1'
    baseline:
      it_out_share: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The instant transfer amount is the lowest of the instant percentage room, the instant pay-period room, the instant day room and the tier's per_transfer_max_usd; it is never below zero and is rounded down to the cent. The instant percentage room is the tier's access_cap_percent, divided by one hundred, times the instant accrued net, less the instant period taken. The instant pay-period room is the tier's per_pay_period_cap_usd less the instant period taken. The instant day room is the tier's per_day_cap_usd less the amount of every transfer booked on the plan today, returned or not. The instant period taken is the amount of the plan's transfers carrying its next_pay_date less the amount of the plan's transfer returns carrying that date. The instant accrued net is the net_amount of the plan's earnings sync lines carrying its next_pay_date less the net_amount of its earnings correction lines carrying that date, each line at its recorded net_amount, regular-hours lines always counting, overtime lines only where overtime_included_in_accrual is true, shift-differential lines only where shift_differential_included_in_accrual is true and card tips lines only where tips_included_in_accrual is true; on a tier whose earnings_availability_lag_days is one, sync and correction lines whose work_date is today do not count.
    params:
    - access_cap_percent
    - per_pay_period_cap_usd
    - per_day_cap_usd
    - per_transfer_max_usd
    - earnings_availability_lag_days
    - tips_included_in_accrual
    - overtime_included_in_accrual
    - shift_differential_included_in_accrual
  inputs:
    history:
    - table: access_earnings
      aggregate: sum
      field: net_amount
      filters:
        event_type: access_earnings_sync
    - table: access_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: access_shortfall
    - table: access_ledger
      aggregate: count
      field: entry_date
      within_months: 6
      filters:
        event_type: access_transfer
        delivery_speed: instant
        destination_type: external_debit_card
    - table: access_ledger
      aggregate: count
      field: entry_date
      within_months: 6
      filters:
        event_type: access_transfer_return
        reason_code: delivery_failed
    cross_category: []
