  baseline:
    rule: The bank transfer amount is the lowest of the bank percentage room, the bank pay-period room, the bank day room, the tier's per_transfer_max_usd and, where it applies, the bank deduction-ceiling room; it is never below zero and is rounded down to the cent. The bank percentage room is the bank transfer percentage, divided by one hundred, times the bank accrued net, less the bank period taken; the bank transfer percentage is the tier's access_cap_percent. The bank pay-period room is the tier's per_pay_period_cap_usd less the bank period taken. The bank day room is the tier's per_day_cap_usd less the amount of every transfer booked on the plan today, returned or not. Where the worker has a Paystride Payroll-Repaid Loan in status repaying whose next_installment_date equals the plan's next_pay_date, the bank deduction-ceiling room is combined_deduction_ceiling_percent_of_net, divided by one hundred, times the period's accrued net as the base accrual rule measures it, each sync line that rule counts at its recorded net_amount, less the correction lines, less the bank period taken, less that loan's installment_amount; without such a loan there is no bank deduction-ceiling room. The bank period taken is the amount of the plan's transfers carrying the current pay_date, the plan's next_pay_date, less the amount of the plan's transfer returns carrying that pay_date. The bank accrued net is the net_amount of the plan's earnings sync lines carrying the current pay_date less the net_amount of its earnings correction lines carrying that pay_date, each line at its recorded net_amount, regular-hours lines always counting, overtime lines only where overtime_included_in_accrual is true, shift-differential lines only where shift_differential_included_in_accrual is true and card tips lines only where tips_included_in_accrual is true; on a tier whose earnings_availability_lag_days is one, sync and correction lines whose work_date is today do not count. The plan's open shortfall is its outstanding_balance less the bank period taken less the amount of the plan's fees carrying the current pay_date net of the fee reversals carrying that pay_date; while it is above zero, the bank transfer percentage and the tier's per_pay_period_cap_usd are each multiplied by access_during_open_shortfall_percent_of_cap divided by one hundred when it does not exceed max_open_shortfall_usd_for_continued_access, and by zero when it does.
    params:
    - access_cap_percent
    - per_pay_period_cap_usd
    - per_day_cap_usd
    - per_transfer_max_usd
    - combined_deduction_ceiling_percent_of_net
    - earnings_availability_lag_days
    - access_during_open_shortfall_percent_of_cap
    - max_open_shortfall_usd_for_continued_access
    - tips_included_in_accrual
    - overtime_included_in_accrual
    - shift_differential_included_in_accrual
  inputs:
    history:
    - table: access_earnings
      aggregate: sum
      field: net_amount
      filters:
        event_type: access_earnings_sync
    - table: access_earnings
      aggregate: count
      field: work_date
      within_months: 2
      filters:
        event_type: access_earnings_correction
    - table: access_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: access_transfer
    - table: access_ledger
