  target_tool: book_bank_transfer_fee_9f154276
  params: {}
  rule: 'This schedule sets the bank transfer fee: the fee of the plan''s latest transfer of the day, the transfer booked on the plan today with the highest daily_sequence, when that transfer goes next business day to a bank account and the employer''s fee model of the base fee rule leaves it payable by the worker; for such a fee, and only for such a fee, it replaces the base rule on the listed fee, and every other fee, the instant transfer fees among them, remains under the base rule, which reads: The listed fee is set by speed and destination at the plan''s tier: an instant transfer to an external debit card costs instant_fee_external_debit_usd plus the surcharge of the instant_fee_band_surcharge_usd band that contains the transfer amount; an instant transfer to the Paystride Visa Payroll Card costs instant_fee_paystride_card_usd; a next-business-day transfer to a bank account costs nbd_fee_bank_usd; a next-business-day transfer to the Paystride card costs nbd_fee_paystride_card_usd. The bank transfer fee is quoted to the worker with the transfer''s amount, speed and destination for the worker''s confirmation, and it is worked out for that transfer as confirmed, the transfer counted as booked today, so the figure quoted is the figure booked. The bank transfer fee is booked only after the next-business-day bank transfer it prices stands on the plan''s ledger as today''s latest transfer entry. The bank transfer fee is the tier''s nbd_fee_bank_usd, reduced to the bank fee room when the room is smaller, never below zero, and rounded half up to the cent, except that the first next-business-day bank transfer of a pay period, the only transfer to a bank account carrying its pay_date, carries no fee; when the fee comes to zero no fee entry is booked. The bank fee room is the tier''s fee_cap_per_pay_period_usd less the amount of the plan''s fees carrying the transfer''s pay_date net of the fee reversals carrying that pay_date. For the bank transfer fee the period fee cap applies through the bank fee room set out here; for every other fee, the instant transfer fees among them, the base rule still reads: Third, the period fee cap: the fee is reduced to the room left between fee_cap_per_pay_period_usd and access_msr_period_fee_total, so the worker''s fees for a pay period never exceed the cap. The adjustments below are applied in this order: any that decides whether the transfer carries no fee first, then any that sets the fee charged in place of the tier''s nbd_fee_bank_usd, then any amount added to that fee, and the result is compared with the bank fee room as measured under any adjustment that measures it. A weekday is the day of the week of today''s date, the transfer''s entry_date, and the transfer''s confirmation time is its requested_time, Eastern Time. The free-transfer allowance limits the no-fee first bank transfer of a pay period by the other transfers already carrying that pay_date: when four or more stand, the first bank transfer carries the fee like any other; when two or three stand, it carries no fee only when its amount is 100.00 or less; otherwise it carries no fee. The settlement-timing fee sets the fee charged by when the worker confirmed the transfer: confirmed after the 17:00 submission cutoff on a Monday, Tuesday, Wednesday or Thursday, the transfer settles a business day later and is charged the tier''s nbd_fee_bank_usd less 0.50; confirmed after the cutoff on a Friday, or on a Saturday or Sunday, it settles two or more business days later and is charged the tier''s nbd_fee_bank_usd less 1.00; otherwise it is charged the tier''s nbd_fee_bank_usd; the fee charged is never below zero. The bank band surcharge adds to the fee charged 0.25 for a bank transfer of 100.01 to 250.00 and 0.75 for one of 250.01 to 500.00; a bank transfer of 100.00 or less carries no surcharge. The cap method measures the bank fee room by the plan''s pay_frequency: for weekly pay, the tier''s fee_cap_per_pay_period_usd is compared with the fees net of their reversals carrying the transfer''s pay_date together with those carrying the pay_date of the plan''s latest period close line; for semimonthly pay, the tier''s fee_cap_per_pay_period_usd is first multiplied by the calendar days from the pay_date of the plan''s latest period close line to the transfer''s pay_date and divided by fourteen, and then compared with the fees net of their reversals carrying the transfer''s pay_date; for biweekly pay the bank fee room is as stated above; a plan with no period close line yet is measured as for biweekly pay.'
