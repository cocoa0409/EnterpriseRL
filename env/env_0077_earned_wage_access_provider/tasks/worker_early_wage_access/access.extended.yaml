  - bf_room: P('fee_cap_per_pay_period_usd') - bf_fees_cur - bf_fees_prev if F('pay_frequency') == 'weekly' else (P('fee_cap_per_pay_period_usd') * (DAYS(bf_lcp, bf_pay) if bf_lcp != None else 14) / 14 - bf_fees_cur if F('pay_frequency') == 'semimonthly' else P('fee_cap_per_pay_period_usd') - bf_fees_cur)
  - result: 0 if bf_free == 1 else RND(MX(0, MN(bf_charged + bf_surcharge, bf_room)) + 0.000000001, 2)
