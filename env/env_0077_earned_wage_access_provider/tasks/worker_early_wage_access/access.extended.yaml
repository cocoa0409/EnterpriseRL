- id: access_level_review
  subject:
  - access_level_change
  rule: 'The plan tier is reviewed level_review_cadence, after that payday''s recoveries and any shortfall are booked. A level review runs only while the plan status is active. Plans that are paused or suspended keep their tier until they are active again and reviewed. The plan moves up when it meets every entry gate of the next tier: min_tenure_days counted in calendar days from the hire_date on the plan to the payday, min_consecutive_full_recoveries measured by access_msr_consecutive_full_recoveries, no open shortfall (access_msr_open_shortfall zero or less) where the gate sets no_open_shortfall, and no write-off with an entry_date within no_writeoff_within_days calendar days before the payday. It moves up at most tier_upgrade_max_steps_per_review tiers at one review. A payday with a shortfall moves the plan down by downgrade_steps_on_shortfall tiers at that review, never below Paystride Access Starter, and a write-off returns it to Paystride Access Starter when writeoff_resets_to_starter is true; a downgrade and an upgrade never happen at the same review, the downgrade prevailing. The new tier applies to transfers booked from the day after the payday, which is recorded as level_effective_date. A worker cannot buy, request or be granted a tier outside the review.'
  eligibility:
  - id: plan_active_for_review
    applies_to:
    - access_level_change
    kind: state
    condition: A level review runs only while the plan status is active.
    evidence_fields:
    - access_plans.status
    - access_plans.access_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_plans.access_plan_id
      action_bindings:
        access_plans.access_plan_id: access_plan_id
    state_contract:
      field: access_plans.status
      allowed:
      - active
  params:
    per_tier:
      Paystride Access Starter:
        min_consecutive_full_recoveries: 0
        min_tenure_days: 0
        downgrade_steps_on_shortfall: =downgrade_steps_on_shortfall
      Paystride Access Standard:
        min_consecutive_full_recoveries: 2
        min_tenure_days: 30
        downgrade_steps_on_shortfall: =downgrade_steps_on_shortfall
      Paystride Access Plus:
        min_consecutive_full_recoveries: 4
        min_tenure_days: 60
        downgrade_steps_on_shortfall: =downgrade_steps_on_shortfall
      Paystride Access Preferred:
        min_consecutive_full_recoveries: 6
        min_tenure_days: 90
        downgrade_steps_on_shortfall: =downgrade_steps_on_shortfall
      Paystride Access Premier:
        min_consecutive_full_recoveries: 10
        min_tenure_days: 180
        downgrade_steps_on_shortfall: =downgrade_steps_on_shortfall
      Paystride Access Premier Plus:
        min_consecutive_full_recoveries: 16
        min_tenure_days: 365
        downgrade_steps_on_shortfall: =downgrade_steps_on_shortfall
  measures:
  - access_msr_consecutive_full_recoveries
  - access_msr_open_shortfall
- id: access_lifecycle
  subject:
  - access_activate
  - access_expire_enrollment
  - access_pause
  - access_resume
  - access_suspend
  - access_reinstate
  - access_close
  - access_close_employment_ended
  rule: 'A plan activates when the employer''s payroll file matches the worker''s employee number under the program agreement. An enrollment lapses only once enrollment_activation_window_days calendar days have passed since the enrollment date without a match. Calendar days are counted from the day after the enrolled_date, so the lapse date is the enrolled_date plus the window. A plan is paused when the employer''s file reports the worker on_leave or terminated or the employer''s program agreement is suspended, and resumes when the worker is reported employed under a live agreement; recoveries and write-offs continue while a plan is paused, but no transfer is booked. The desk suspends an active plan when it suspects account takeover or destination fraud, and lifts the suspension once the worker passes identity verification again and confirms the destinations on file. The desk may reinstate only a plan whose status is suspended. Closing a plan is the worker''s own decision: the desk registers a closure request and the worker confirms it. A worker-confirmed closure applies only to a plan whose status is active. The closure takes effect on the request date when outstanding_balance is zero, and otherwise on the date the balance first reaches zero through recovery, voluntary payment or write-off; a worker cannot close a plan to avoid a recovery already due. A plan paused for an employment end closes once its balance is recovered or written off. A closed plan is never reopened; the worker enrolls again under access_agg_multi_holding.'
  eligibility:
  - id: enrollment_lapse
    applies_to:
    - access_expire_enrollment
    kind: time
    condition: An enrollment lapses only once enrollment_activation_window_days calendar days have passed since the enrollment date without a match.
    evidence_fields:
    - access_plans.enrolled_date
    - access_plans.access_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_plans.access_plan_id
      action_bindings:
        access_plans.access_plan_id: access_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the enrollment date
      anchor_source: access_plans.enrolled_date
      relation: not_before
      duration_source: variants.enrollment_activation_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the enrolled_date, so the lapse date is the enrolled_date plus the window.
      boundary: inclusive
  - id: close_from_active
    applies_to:
    - access_close
    kind: state
    condition: A worker-confirmed closure applies only to a plan whose status is active.
    evidence_fields:
    - access_plans.status
    - access_plans.access_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_plans.access_plan_id
      action_bindings:
        access_plans.access_plan_id: access_plan_id
    state_contract:
      field: access_plans.status
      allowed:
      - active
  - id: reinstate_from_suspended
    applies_to:
    - access_reinstate
    kind: state
    condition: The desk may reinstate only a plan whose status is suspended.
    evidence_fields:
    - access_plans.status
    - access_plans.access_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_plans.access_plan_id
      action_bindings:
        access_plans.access_plan_id: access_plan_id
    state_contract:
      field: access_plans.status
      allowed:
      - suspended
- id: access_earnings_accrual
  subject:
  - access_earnings_sync
  - access_earnings_correction
  - access_period_close
  rule: 'Accrued net earnings for a pay period come only from the employer feed; a worker''s statement of hours never adds to them. Each sync line adds its net_amount for one work date and earnings source: the employer-reported net where the employer sends one, and otherwise gross_amount multiplied by gross_to_net_estimation_percent, rounded down to the cent, with net_basis estimated_from_gross. Regular hours always accrue; overtime accrues when overtime_included_in_accrual is true, shift differential when shift_differential_included_in_accrual is true, and card tips reported by the employer''s point-of-sale feed only when tips_included_in_accrual is true; cash tips never accrue. A work date and earnings source is synced once per plan. A line counts toward the access base only from earnings_availability_lag_days calendar days after its work date. A timecard correction from the employer removes the corrected net as a correction line for the same work date and pay date; when a correction exceeds what the period''s transfers leave room for, transfers already booked stand and only new transfers are limited. On payday a period close removes the period''s whole remaining accrued net and accrual for the next pay period starts at zero.'
  eligibility:
  - id: one_sync_per_line
    applies_to:
    - access_earnings_sync
    kind: dedup
    condition: A work date and earnings source is synced once per plan.
    evidence_fields:
    - access_earnings.access_plan_id
    - access_earnings.work_date
    - access_earnings.earnings_source
    - access_earnings.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - access_earnings.access_plan_id
        - access_earnings.work_date
        - access_earnings.earnings_source
      action_bindings:
        access_earnings.access_plan_id: access_plan_id
        access_earnings.work_date: work_date
        access_earnings.earnings_source: earnings_source
    dedup_contract:
      table: access_earnings
      mode: separate_record
      object_bindings:
        access_plan_id: access_plan_id
        work_date: work_date
        earnings_source: earnings_source
      duplicate_filters:
        event_type:
        - access_earnings_sync
      distinct_fields: []
  params:
    per_tier:
      Paystride Access Starter:
        tips_included_in_accrual: =tips_included_in_accrual
        earnings_availability_lag_days: =earnings_availability_lag_days
      Paystride Access Standard:
        tips_included_in_accrual: =tips_included_in_accrual
        earnings_availability_lag_days: =earnings_availability_lag_days
      Paystride Access Plus:
        tips_included_in_accrual: =tips_included_in_accrual
        earnings_availability_lag_days: =earnings_availability_lag_days
      Paystride Access Preferred:
        tips_included_in_accrual: =tips_included_in_accrual
        earnings_availability_lag_days: =earnings_availability_lag_days
      Paystride Access Premier:
        tips_included_in_accrual: =tips_included_in_accrual
        earnings_availability_lag_days: =earnings_availability_lag_days
      Paystride Access Premier Plus:
        tips_included_in_accrual: =tips_included_in_accrual
        earnings_availability_lag_days: =earnings_availability_lag_days
  formula:
    net_amount: gross_amount * gross_to_net_estimation_percent / 100 if net_basis == 'estimated_from_gross' else net_amount
  measures:
  - access_msr_period_accrued_net
- id: access_card_destination
  subject:
  - access_transfer
  rule: Holding a Paystride Visa Payroll Card changes where and at what fee a worker can receive early pay. When card_destination_requires_active_card is true, the Paystride card is offered as a destination only while the worker's card account status is active; a card that is issued but not yet activated, blocked or closed is not a destination, and the worker either chooses an external debit card or bank account at that destination's fee or waits until the card is active. The desk never books a card transfer to a card in another status in the expectation that it will be activated. A worker who holds no Paystride card can use only external destinations, and the card's status never limits a transfer to an external destination. A transfer to the card is credited to the card account as an early-wage load under the card charter.
  eligibility: []
- id: access_combined_deduction_ceiling
  subject:
  - access_transfer
  rule: Holding a Paystride Payroll-Repaid Loan changes how much early pay a worker can take. When the worker has a loan in repayment with an installment scheduled on the plan's next payday (access_msr_loan_installment_due above zero), the period's transfers plus that installment may not exceed combined_deduction_ceiling_percent_of_net of access_msr_period_accrued_net; the room this leaves is limit (e) of access_evt_transfer_availability. A worker with no such installment is not subject to this limit, and the limit never changes the loan installment itself.
  eligibility: []
  formula:
    ceiling_room: combined_deduction_ceiling_percent_of_net / 100 * access_msr_period_accrued_net - access_msr_period_transfer_total - access_msr_loan_installment_due
  measures:
  - access_msr_loan_installment_due
  - access_msr_period_accrued_net
  - access_msr_period_transfer_total
- id: access_recovery_consent
  subject:
  - access_recovery_authorization
  - access_recovery_revocation
  rule: 'The standing authorization for card autorecovery is the worker''s own consent: only the worker grants or revokes it, and the desk never sets it on the worker''s behalf. The authorization can be granted only while the worker''s Paystride Visa Payroll Card account status is active. A worker with no Paystride card, or whose card is issued but not activated, blocked or closed, cannot grant it. Revocation, which the worker may make at any time whatever the card''s status, takes effect for attempts not yet booked; a recovery already booked stands. When the worker''s card account closes, the authorization lapses and is set to false.'
  eligibility:
  - id: card_active_for_authorization
    applies_to:
    - access_recovery_authorization
    kind: state
    condition: The authorization can be granted only while the worker's Paystride Visa Payroll Card account status is active.
    evidence_fields:
    - card_accounts.status
    - card_accounts.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.customer_id
      action_bindings:
        card_accounts.customer_id: customer_id
    state_contract:
      field: card_accounts.status
      allowed:
      - active
- id: access_payroll_file_authority
  subject:
  - access_payroll_sync
  rule: The employer's payroll file is the only authority for the worker's next payday, pay frequency and employment status; the desk never changes them from a worker's statement and refers a worker who disputes them to their employer. After each payday next_pay_date moves to the following payday the employer file states; where the file states none it follows the pay frequency (weekly every seventh day, biweekly every fourteenth day, semimonthly on the 15th and the last day of the month), and a payday that falls on a weekend or Federal Reserve holiday is the preceding business day. A change of employment_status to on_leave or terminated pauses the plan and a change back to employed resumes it under access_lifecycle.
  eligibility: []
extended_policies:
- id: access_ext_tier_review
  base_policy_refs:
  - access_level_review
  - access_evt_writeoff
  overwrite:
  - base_policy: access_level_review
    superseded_clause: 'The plan moves up when it meets every entry gate of the next tier: min_tenure_days counted in calendar days from the hire_date on the plan to the payday, min_consecutive_full_recoveries measured by access_msr_consecutive_full_recoveries, no open shortfall (access_msr_open_shortfall zero or less) where the gate sets no_open_shortfall, and no write-off with an entry_date within no_writeoff_within_days calendar days before the payday.'
    replaced_by: 'At a review under this schedule the plan moves up one tier when it has no open shortfall and the next tier is within every allowance set out below, and in no other way; this replaces, for every review under this schedule, the base rule that reads: The plan moves up when it meets every entry gate of the next tier: min_tenure_days counted in calendar days from the hire_date on the plan to the payday, min_consecutive_full_recoveries measured by access_msr_consecutive_full_recoveries, no open shortfall (access_msr_open_shortfall zero or less) where the gate sets no_open_shortfall, and no write-off with an entry_date within no_writeoff_within_days calendar days before the payday. At a review of a payday that carries a shortfall no entry gate is tested, as the downgrade prevails.'
  - base_policy: access_level_review
    superseded_clause: The new tier applies to transfers booked from the day after the payday, which is recorded as level_effective_date.
    replaced_by: 'The tier a review under this schedule sets, changed or not, applies to transfers booked from the day after the payday reviewed, and that day is recorded as level_effective_date, whatever day the review is recorded; a transfer or fee already booked when the review is recorded keeps the terms in force when it was booked; this replaces, for every review under this schedule, the base rule that reads: The new tier applies to transfers booked from the day after the payday, which is recorded as level_effective_date. A review under the missed-recovery review schedule takes effect as that schedule states.'
  - base_policy: access_evt_writeoff
    superseded_clause: when writeoff_resets_to_starter is true the plan returns to Paystride Access Starter at the next level review.
    replaced_by: 'A write-off counts at the review of the first payday on or after the day it is booked, a write-off booked on a payday always standing before that payday''s review is recorded: one booked after the payday reviewed is taken at the review of the plan''s next payday, never at the review recorded for the payday before it, and while such a write-off is the plan''s latest the review takes no earlier write-off either, the next payday''s review returning the plan to Paystride Access Starter for both; this replaces, for every review under this schedule, the base rule that reads: when writeoff_resets_to_starter is true the plan returns to Paystride Access Starter at the next level review. A review under the missed-recovery review schedule takes write-offs as that schedule states.'
  - base_policy: access_level_review
    superseded_clause: The plan tier is reviewed level_review_cadence, after that payday's recoveries and any shortfall are booked.
    replaced_by: 'Each payday is reviewed once and only after it has closed: the review of the latest closed payday is recorded no earlier than the day after that payday, once that payday''s payroll settlement and any write-off booked on it are on the plan, and it is due only while the plan''s level_effective_date is on or before that payday; a recorded review leaves level_effective_date the day after the payday it covers, so a review recorded late, even on or after the next payday, never makes the next payday''s review fall due or lapse; when a later payday''s period close is booked before an earlier payday''s review is recorded, the one review of the latest closed payday covers every payday since the level_effective_date; this replaces, for every review under this schedule, the base rule that reads: The plan tier is reviewed level_review_cadence, after that payday''s recoveries and any shortfall are booked. A review under the missed-recovery review schedule falls due as that schedule states.'
  trigger: state_due
  subject:
  - access_level_change
  computes: new_variant_name
  target_tool: record_tier_review_be8f1edd
  params: {}
  rule: 'This schedule governs the tier review of the plan''s latest closed payday, the pay_date of its latest period close line, when no shortfall carries a pay_date on or after the plan''s level_effective_date, a payday no review has yet covered; a plan with such a shortfall is reviewed under the missed-recovery review schedule instead. Each payday is reviewed once and only after it has closed: the review of the latest closed payday is recorded no earlier than the day after that payday, once that payday''s payroll settlement and any write-off booked on it are on the plan, and it is due only while the plan''s level_effective_date is on or before that payday; a recorded review leaves level_effective_date the day after the payday it covers, so a review recorded late, even on or after the next payday, never makes the next payday''s review fall due or lapse; when a later payday''s period close is booked before an earlier payday''s review is recorded, the one review of the latest closed payday covers every payday since the level_effective_date; this replaces, for every review under this schedule, the base rule that reads: The plan tier is reviewed level_review_cadence, after that payday''s recoveries and any shortfall are booked. A review under the missed-recovery review schedule falls due as that schedule states. At a review under this schedule, when writeoff_resets_to_starter is true and the plan''s latest write-off was booked on or after its level_effective_date and on or before the payday reviewed, the plan returns to Paystride Access Starter; otherwise the plan keeps its current tier. A write-off counts at the review of the first payday on or after the day it is booked, a write-off booked on a payday always standing before that payday''s review is recorded: one booked after the payday reviewed is taken at the review of the plan''s next payday, never at the review recorded for the payday before it, and while such a write-off is the plan''s latest the review takes no earlier write-off either, the next payday''s review returning the plan to Paystride Access Starter for both; this replaces, for every review under this schedule, the base rule that reads: when writeoff_resets_to_starter is true the plan returns to Paystride Access Starter at the next level review. A review under the missed-recovery review schedule takes write-offs as that schedule states. The tiers rank upward from Paystride Access Starter through Paystride Access Standard, Paystride Access Plus, Paystride Access Preferred and Paystride Access Premier to Paystride Access Premier Plus. At a review under this schedule the plan moves up one tier when it has no open shortfall and the next tier is within every allowance set out below, and in no other way; this replaces, for every review under this schedule, the base rule that reads: The plan moves up when it meets every entry gate of the next tier: min_tenure_days counted in calendar days from the hire_date on the plan to the payday, min_consecutive_full_recoveries measured by access_msr_consecutive_full_recoveries, no open shortfall (access_msr_open_shortfall zero or less) where the gate sets no_open_shortfall, and no write-off with an entry_date within no_writeoff_within_days calendar days before the payday. At a review of a payday that carries a shortfall no entry gate is tested, as the downgrade prevails. The plan''s open shortfall is its outstanding_balance less the amount of its transfers carrying its next_pay_date net of the transfer returns carrying that date and less its fees carrying that date net of the fee reversals carrying it, worked to the cent. Each allowance below names the highest tier it permits; an allowance permits only Paystride Access Starter unless one of its own tiers names a higher tier for the plan, so the next tier is never within an allowance by default; a move up is by one tier and never more. A record falls in the last N months when fewer than N whole months separate its date from today, whole months being the difference in calendar months less one when today''s day of the month is smaller than that date''s. The recovery-count allowance rests on the paydays whose period close line carries a pay_date in the last twelve months and on the shortfalls carrying a pay_date in the last twelve months, counted by method: when no such shortfall stands, or every one of them carries reason_code deduction_not_taken, the count is the number of those paydays, a deduction the employer did not take never counting against the worker; when at least one stands, none of them was booked without a carryforward_pay_date and at least one carries another reason, the count is the number of those paydays less the number of those shortfalls; otherwise the count is zero. A count of 16 or more allows Paystride Access Premier Plus, 10 to 15 Paystride Access Premier, 6 to 9 Paystride Access Preferred, 4 or 5 Paystride Access Plus, 2 or 3 Paystride Access Standard, and fewer than 2 only Paystride Access Starter. The tenure allowance rests on the calendar days from the plan''s hire_date to the payday: 365 or more allow Paystride Access Premier Plus, 180 to 364 Paystride Access Premier, 90 to 179 Paystride Access Preferred, 60 to 89 Paystride Access Plus, 30 to 59 Paystride Access Standard, and fewer than 30 only Paystride Access Starter. The write-off allowance rests on the plan''s latest write-off: when none stands, or its entry_date falls after the payday or more than 365 calendar days before it, the allowance is Paystride Access Premier Plus; when it falls 181 to 365 days before the payday, Paystride Access Preferred; when it falls on the payday or up to 180 days before it, only Paystride Access Starter. The earnings allowance rests on the net_amount of the plan''s period close lines carrying a pay_date in the last six months, the net pay the employer paid through payroll: 12000.00 or more allows Paystride Access Premier Plus, 6000.00 to 11999.99 Paystride Access Premier, 3000.00 to 5999.99 Paystride Access Preferred, 1500.00 to 2999.99 Paystride Access Plus, 500.00 to 1499.99 Paystride Access Standard, and less than 500.00 only Paystride Access Starter. The tier a review under this schedule sets, changed or not, applies to transfers booked from the day after the payday reviewed, and that day is recorded as level_effective_date, whatever day the review is recorded; a transfer or fee already booked when the review is recorded keeps the terms in force when it was booked; this replaces, for every review under this schedule, the base rule that reads: The new tier applies to transfers booked from the day after the payday, which is recorded as level_effective_date. A review under the missed-recovery review schedule takes effect as that schedule states.'
  prerequisite: []
  cross_category: []
  compute:
  - rv_lcp: LATEST('access_earnings', 'pay_date', date_field='pay_date', event_type='access_period_close')
  - rv_cur: 1 if F('variant_name') == 'Paystride Access Starter' else (2 if F('variant_name') == 'Paystride Access Standard' else (3 if F('variant_name') == 'Paystride Access Plus' else (4 if F('variant_name') == 'Paystride Access Preferred' else (5 if F('variant_name') == 'Paystride Access Premier' else 6))))
  - rv_last_wo: LATEST('access_ledger', 'entry_date', date_field='entry_date', event_type='access_writeoff')
  - rv_reset: 1 if P('writeoff_resets_to_starter') and rv_last_wo != None and rv_lcp != None and rv_last_wo >= F('level_effective_date') and rv_last_wo <= rv_lcp else 0
  - rv_open: RND(F('outstanding_balance') - (SUM('access_ledger', 'amount', event_type='access_transfer', pay_date=F('next_pay_date')) - SUM('access_ledger', 'amount', event_type='access_transfer_return', pay_date=F('next_pay_date'))) - (SUM('access_ledger', 'amount', event_type='access_fee', pay_date=F('next_pay_date')) - SUM('access_ledger', 'amount', event_type='access_fee_reversal', pay_date=F('next_pay_date'))), 2)
  - rv_paydays_12m: COUNT('access_earnings', within_months=12, date_field='pay_date', event_type='access_period_close')
  - rv_sf_12m: COUNT('access_ledger', within_months=12, date_field='pay_date', event_type='access_shortfall')
  - rv_sf_dnt_12m: COUNT('access_ledger', within_months=12, date_field='pay_date', event_type='access_shortfall', reason_code='deduction_not_taken')
  - rv_sf_uncarried_12m: COUNT('access_ledger', within_months=12, date_field='pay_date', event_type='access_shortfall', carryforward_pay_date='')
  - rv_count: rv_paydays_12m if rv_sf_dnt_12m == rv_sf_12m else (rv_paydays_12m - rv_sf_12m if rv_sf_uncarried_12m == 0 else 0)
  - rv_rec_allow: 6 if rv_count >= 16 else (5 if rv_count >= 10 else (4 if rv_count >= 6 else (3 if rv_count >= 4 else (2 if rv_count >= 2 else 1))))
  - rv_tenure: DAYS(F('hire_date'), rv_lcp) if rv_lcp != None else 0
  - rv_ten_allow: 6 if rv_tenure >= 365 else (5 if rv_tenure >= 180 else (4 if rv_tenure >= 90 else (3 if rv_tenure >= 60 else (2 if rv_tenure >= 30 else 1))))
  - rv_wo_days: DAYS(rv_last_wo, rv_lcp) if rv_last_wo != None and rv_lcp != None else -1
  - rv_wo_allow: 6 if rv_wo_days < 0 or rv_wo_days > 365 else (4 if rv_wo_days >= 181 else 1)
  - rv_earn_6m: SUM('access_earnings', 'net_amount', within_months=6, date_field='pay_date', event_type='access_period_close')
  - rv_earn_allow: 6 if rv_earn_6m >= 12000 else (5 if rv_earn_6m >= 6000 else (4 if rv_earn_6m >= 3000 else (3 if rv_earn_6m >= 1500 else (2 if rv_earn_6m >= 500 else 1))))
  - rv_up: MN(rv_cur + 1, rv_rec_allow, rv_ten_allow, rv_wo_allow, rv_earn_allow) if rv_open <= 0 else rv_cur
  - rv_new: 1 if rv_reset == 1 else MX(rv_cur, rv_up)
  - result: '''Paystride Access Starter'' if rv_new == 1 else (''Paystride Access Standard'' if rv_new == 2 else (''Paystride Access Plus'' if rv_new == 3 else (''Paystride Access Preferred'' if rv_new == 4 else (''Paystride Access Premier'' if rv_new == 5 else ''Paystride Access Premier Plus''))))'
  compute_basis:
    rv_lcp: This schedule governs the tier review of the plan's latest closed payday, the pay_date of its latest period close line, when no shortfall carries a pay_date on or after the plan's level_effective_date, a payday no review has yet covered; a plan with such a shortfall is reviewed under the missed-recovery review schedule instead.
    rv_cur: The tiers rank upward from Paystride Access Starter through Paystride Access Standard, Paystride Access Plus, Paystride Access Preferred and Paystride Access Premier to Paystride Access Premier Plus.
    rv_last_wo: At a review under this schedule, when writeoff_resets_to_starter is true and the plan's latest write-off was booked on or after its level_effective_date and on or before the payday reviewed, the plan returns to Paystride Access Starter; otherwise the plan keeps its current tier.
    rv_reset: At a review under this schedule, when writeoff_resets_to_starter is true and the plan's latest write-off was booked on or after its level_effective_date and on or before the payday reviewed, the plan returns to Paystride Access Starter; otherwise the plan keeps its current tier.
    rv_open: The plan's open shortfall is its outstanding_balance less the amount of its transfers carrying its next_pay_date net of the transfer returns carrying that date and less its fees carrying that date net of the fee reversals carrying it, worked to the cent.
    rv_paydays_12m: 'The recovery-count allowance rests on the paydays whose period close line carries a pay_date in the last twelve months and on the shortfalls carrying a pay_date in the last twelve months, counted by method: when no such shortfall stands, or every one of them carries reason_code deduction_not_taken, the count is the number of those paydays, a deduction the employer did not take never counting against the worker; when at least one stands, none of them was booked without a carryforward_pay_date and at least one carries another reason, the count is the number of those paydays less the number of those shortfalls; otherwise the count is zero. A count of 16 or more allows Paystride Access Premier Plus, 10 to 15 Paystride Access Premier, 6 to 9 Paystride Access Preferred, 4 or 5 Paystride Access Plus, 2 or 3 Paystride Access Standard, and fewer than 2 only Paystride Access Starter.'
    rv_sf_12m: 'The recovery-count allowance rests on the paydays whose period close line carries a pay_date in the last twelve months and on the shortfalls carrying a pay_date in the last twelve months, counted by method: when no such shortfall stands, or every one of them carries reason_code deduction_not_taken, the count is the number of those paydays, a deduction the employer did not take never counting against the worker; when at least one stands, none of them was booked without a carryforward_pay_date and at least one carries another reason, the count is the number of those paydays less the number of those shortfalls; otherwise the count is zero. A count of 16 or more allows Paystride Access Premier Plus, 10 to 15 Paystride Access Premier, 6 to 9 Paystride Access Preferred, 4 or 5 Paystride Access Plus, 2 or 3 Paystride Access Standard, and fewer than 2 only Paystride Access Starter.'
    rv_sf_dnt_12m: 'The recovery-count allowance rests on the paydays whose period close line carries a pay_date in the last twelve months and on the shortfalls carrying a pay_date in the last twelve months, counted by method: when no such shortfall stands, or every one of them carries reason_code deduction_not_taken, the count is the number of those paydays, a deduction the employer did not take never counting against the worker; when at least one stands, none of them was booked without a carryforward_pay_date and at least one carries another reason, the count is the number of those paydays less the number of those shortfalls; otherwise the count is zero. A count of 16 or more allows Paystride Access Premier Plus, 10 to 15 Paystride Access Premier, 6 to 9 Paystride Access Preferred, 4 or 5 Paystride Access Plus, 2 or 3 Paystride Access Standard, and fewer than 2 only Paystride Access Starter.'
    rv_sf_uncarried_12m: 'The recovery-count allowance rests on the paydays whose period close line carries a pay_date in the last twelve months and on the shortfalls carrying a pay_date in the last twelve months, counted by method: when no such shortfall stands, or every one of them carries reason_code deduction_not_taken, the count is the number of those paydays, a deduction the employer did not take never counting against the worker; when at least one stands, none of them was booked without a carryforward_pay_date and at least one carries another reason, the count is the number of those paydays less the number of those shortfalls; otherwise the count is zero. A count of 16 or more allows Paystride Access Premier Plus, 10 to 15 Paystride Access Premier, 6 to 9 Paystride Access Preferred, 4 or 5 Paystride Access Plus, 2 or 3 Paystride Access Standard, and fewer than 2 only Paystride Access Starter.'
    rv_count: 'The recovery-count allowance rests on the paydays whose period close line carries a pay_date in the last twelve months and on the shortfalls carrying a pay_date in the last twelve months, counted by method: when no such shortfall stands, or every one of them carries reason_code deduction_not_taken, the count is the number of those paydays, a deduction the employer did not take never counting against the worker; when at least one stands, none of them was booked without a carryforward_pay_date and at least one carries another reason, the count is the number of those paydays less the number of those shortfalls; otherwise the count is zero. A count of 16 or more allows Paystride Access Premier Plus, 10 to 15 Paystride Access Premier, 6 to 9 Paystride Access Preferred, 4 or 5 Paystride Access Plus, 2 or 3 Paystride Access Standard, and fewer than 2 only Paystride Access Starter.'
    rv_rec_allow: 'The recovery-count allowance rests on the paydays whose period close line carries a pay_date in the last twelve months and on the shortfalls carrying a pay_date in the last twelve months, counted by method: when no such shortfall stands, or every one of them carries reason_code deduction_not_taken, the count is the number of those paydays, a deduction the employer did not take never counting against the worker; when at least one stands, none of them was booked without a carryforward_pay_date and at least one carries another reason, the count is the number of those paydays less the number of those shortfalls; otherwise the count is zero. A count of 16 or more allows Paystride Access Premier Plus, 10 to 15 Paystride Access Premier, 6 to 9 Paystride Access Preferred, 4 or 5 Paystride Access Plus, 2 or 3 Paystride Access Standard, and fewer than 2 only Paystride Access Starter.'
    rv_tenure: 'The tenure allowance rests on the calendar days from the plan''s hire_date to the payday: 365 or more allow Paystride Access Premier Plus, 180 to 364 Paystride Access Premier, 90 to 179 Paystride Access Preferred, 60 to 89 Paystride Access Plus, 30 to 59 Paystride Access Standard, and fewer than 30 only Paystride Access Starter.'
    rv_ten_allow: 'The tenure allowance rests on the calendar days from the plan''s hire_date to the payday: 365 or more allow Paystride Access Premier Plus, 180 to 364 Paystride Access Premier, 90 to 179 Paystride Access Preferred, 60 to 89 Paystride Access Plus, 30 to 59 Paystride Access Standard, and fewer than 30 only Paystride Access Starter.'
    rv_wo_days: 'The write-off allowance rests on the plan''s latest write-off: when none stands, or its entry_date falls after the payday or more than 365 calendar days before it, the allowance is Paystride Access Premier Plus; when it falls 181 to 365 days before the payday, Paystride Access Preferred; when it falls on the payday or up to 180 days before it, only Paystride Access Starter.'
    rv_wo_allow: 'The write-off allowance rests on the plan''s latest write-off: when none stands, or its entry_date falls after the payday or more than 365 calendar days before it, the allowance is Paystride Access Premier Plus; when it falls 181 to 365 days before the payday, Paystride Access Preferred; when it falls on the payday or up to 180 days before it, only Paystride Access Starter.'
    rv_earn_6m: 'The earnings allowance rests on the net_amount of the plan''s period close lines carrying a pay_date in the last six months, the net pay the employer paid through payroll: 12000.00 or more allows Paystride Access Premier Plus, 6000.00 to 11999.99 Paystride Access Premier, 3000.00 to 5999.99 Paystride Access Preferred, 1500.00 to 2999.99 Paystride Access Plus, 500.00 to 1499.99 Paystride Access Standard, and less than 500.00 only Paystride Access Starter.'
    rv_earn_allow: 'The earnings allowance rests on the net_amount of the plan''s period close lines carrying a pay_date in the last six months, the net pay the employer paid through payroll: 12000.00 or more allows Paystride Access Premier Plus, 6000.00 to 11999.99 Paystride Access Premier, 3000.00 to 5999.99 Paystride Access Preferred, 1500.00 to 2999.99 Paystride Access Plus, 500.00 to 1499.99 Paystride Access Standard, and less than 500.00 only Paystride Access Starter.'
    rv_up: 'At a review under this schedule the plan moves up one tier when it has no open shortfall and the next tier is within every allowance set out below, and in no other way; this replaces, for every review under this schedule, the base rule that reads: The plan moves up when it meets every entry gate of the next tier: min_tenure_days counted in calendar days from the hire_date on the plan to the payday, min_consecutive_full_recoveries measured by access_msr_consecutive_full_recoveries, no open shortfall (access_msr_open_shortfall zero or less) where the gate sets no_open_shortfall, and no write-off with an entry_date within no_writeoff_within_days calendar days before the payday. At a review of a payday that carries a shortfall no entry gate is tested, as the downgrade prevails.'
    rv_new: At a review under this schedule, when writeoff_resets_to_starter is true and the plan's latest write-off was booked on or after its level_effective_date and on or before the payday reviewed, the plan returns to Paystride Access Starter; otherwise the plan keeps its current tier.
    result: The tiers rank upward from Paystride Access Starter through Paystride Access Standard, Paystride Access Plus, Paystride Access Preferred and Paystride Access Premier to Paystride Access Premier Plus.
  factors:
  - id: recovery_count_method
    effect: method
    decides: rv_rec_allow
    bindings:
    - rv_paydays_12m
    - rv_sf_12m
    - rv_sf_dnt_12m
    - rv_sf_uncarried_12m
    - rv_count
    - rv_rec_allow
    ladder:
    - when: no shortfall with a pay_date in the last twelve months stands, OR every such shortfall carries reason_code deduction_not_taken
      method: count = the paydays whose period close carries a pay_date in the last twelve months
    - when: at least one such shortfall AND none was booked without a carryforward_pay_date AND at least one carries another reason
      method: count = those paydays less those shortfalls
    - when: otherwise
      method: 'count = zero: only Paystride Access Starter'
    baseline:
      rv_rec_allow: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: tenure_allowance
    effect: parameter
    decides: rv_ten_allow
    bindings:
    - rv_tenure
    - rv_ten_allow
    ladder:
    - when: 365 or more calendar days from hire_date to the payday
      value: Paystride Access Premier Plus (rank 6)
    - when: 180 to 364 days
      value: Paystride Access Premier (rank 5)
    - when: 90 to 179 days
      value: Paystride Access Preferred (rank 4)
    - when: 60 to 89 days
      value: Paystride Access Plus (rank 3)
    - when: 30 to 59 days
      value: Paystride Access Standard (rank 2)
    - when: otherwise (fewer than 30 days)
      value: Paystride Access Starter only (rank 1)
    baseline:
      rv_ten_allow: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: writeoff_allowance
    effect: parameter
    decides: rv_wo_allow
    bindings:
    - rv_wo_days
    - rv_wo_allow
    ladder:
    - when: no write-off stands, or the latest one's entry_date falls after the payday or more than 365 days before it
      value: Paystride Access Premier Plus (rank 6)
    - when: the latest write-off falls 181 to 365 days before the payday
      value: Paystride Access Preferred (rank 4)
    - when: otherwise (on the payday or up to 180 days before it)
      value: Paystride Access Starter only (rank 1)
    baseline:
      rv_wo_allow: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: earnings_allowance
    effect: parameter
    decides: rv_earn_allow
    bindings:
    - rv_earn_6m
    - rv_earn_allow
    ladder:
    - when: period close net_amount in the last six months 12000.00 or more
      value: Paystride Access Premier Plus (rank 6)
    - when: 6000.00 to 11999.99
      value: Paystride Access Premier (rank 5)
    - when: 3000.00 to 5999.99
      value: Paystride Access Preferred (rank 4)
    - when: 1500.00 to 2999.99
      value: Paystride Access Plus (rank 3)
    - when: 500.00 to 1499.99
      value: Paystride Access Standard (rank 2)
    - when: otherwise (less than 500.00)
      value: Paystride Access Starter only (rank 1)
    baseline:
      rv_earn_allow: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: At a review under this schedule, when writeoff_resets_to_starter is true and the plan's latest write-off was booked on or after its level_effective_date and on or before the payday reviewed, the plan returns to Paystride Access Starter; otherwise the plan keeps its current tier. The tiers rank upward from Paystride Access Starter through Paystride Access Standard, Paystride Access Plus, Paystride Access Preferred and Paystride Access Premier to Paystride Access Premier Plus. Each allowance below names the highest tier it permits; an allowance permits only Paystride Access Starter unless one of its own tiers names a higher tier for the plan, so the next tier is never within an allowance by default; a move up is by one tier and never more.
    params:
    - writeoff_resets_to_starter
  inputs:
    history:
    - table: access_earnings
      aggregate: count
      field: pay_date
      within_months: 12
      filters:
        event_type: access_period_close
    - table: access_earnings
      aggregate: sum
      field: net_amount
      within_months: 6
      filters:
        event_type: access_period_close
    - table: access_ledger
      aggregate: count
      field: pay_date
      within_months: 12
      filters:
        event_type: access_shortfall
    - table: access_ledger
      aggregate: latest
      field: entry_date
      filters:
        event_type: access_writeoff
    cross_category: []
- id: access_ext_bank_transfer_amount
  base_policy_refs:
  - access_evt_transfer_availability
  - access_agg_combined_daily_limit
  - access_card_destination
  - access_combined_deduction_ceiling
  - access_earnings_accrual
  overwrite:
  - base_policy: access_evt_transfer_availability
    superseded_clause: 'The amount available for a new transfer is the lowest of: (a) the percentage room, which is the access percentage applied to access_msr_period_accrued_net less access_msr_period_transfer_total, where the access percentage is the tier''s access_cap_percent or, when it is lower, the configured cap the employer set on its program agreement (access_msr_employer_cap_percent); (b) the pay-period room, which is per_pay_period_cap_usd less access_msr_period_transfer_total; (c) the per-day room under access_agg_combined_daily_limit; (d) per_transfer_max_usd; and (e) where it applies, the room under access_combined_deduction_ceiling.'
    replaced_by: 'This schedule sets the bank transfer amount: the amount of a next-business-day transfer to the worker''s bank account on a plan whose worker holds no other Earned Wage Access Plan that is not closed and whose employer''s program agreement carries a configured access percentage no lower than the bank transfer percentage worked out below; for such a transfer, and only for such a transfer, it replaces the base rule on the amount available, and every other transfer, the instant debit-card transfers their own schedule governs among them, remains as that schedule or the base rule provides, the base rule reading: The amount available for a new transfer is the lowest of: (a) the percentage room, which is the access percentage applied to access_msr_period_accrued_net less access_msr_period_transfer_total, where the access percentage is the tier''s access_cap_percent or, when it is lower, the configured cap the employer set on its program agreement (access_msr_employer_cap_percent); (b) the pay-period room, which is per_pay_period_cap_usd less access_msr_period_transfer_total; (c) the per-day room under access_agg_combined_daily_limit; (d) per_transfer_max_usd; and (e) where it applies, the room under access_combined_deduction_ceiling.'
  - base_policy: access_evt_transfer_availability
    superseded_clause: A transfer returned or cancelled does not count toward any room.
    replaced_by: 'Toward the bank percentage room and the bank pay-period room a returned or cancelled transfer does not count, and toward the bank day room every transfer booked on the plan today counts, returned or not; for every other transfer, the instant debit-card transfers their own schedule governs aside, the base rule still reads: A transfer returned or cancelled does not count toward any room.'
  - base_policy: access_earnings_accrual
    superseded_clause: 'Each sync line adds its net_amount for one work date and earnings source: the employer-reported net where the employer sends one, and otherwise gross_amount multiplied by gross_to_net_estimation_percent, rounded down to the cent, with net_basis estimated_from_gross.'
    replaced_by: 'For the bank accrued net a regular-hours or shift-differential sync line whose net_basis is estimated_from_gross may be valued again as an adjustment set out below provides, and every other line counts at its recorded net_amount; for every other purpose the base rule still reads: Each sync line adds its net_amount for one work date and earnings source: the employer-reported net where the employer sends one, and otherwise gross_amount multiplied by gross_to_net_estimation_percent, rounded down to the cent, with net_basis estimated_from_gross.'
  - base_policy: access_earnings_accrual
    superseded_clause: Regular hours always accrue; overtime accrues when overtime_included_in_accrual is true, shift differential when shift_differential_included_in_accrual is true, and card tips reported by the employer's point-of-sale feed only when tips_included_in_accrual is true; cash tips never accrue.
    replaced_by: 'For the bank accrued net, regular hours and shift differential accrue as the base rule provides, while overtime lines and card tips lines count in the part an adjustment set out below provides; for every other purpose the base rule still reads: Regular hours always accrue; overtime accrues when overtime_included_in_accrual is true, shift differential when shift_differential_included_in_accrual is true, and card tips reported by the employer''s point-of-sale feed only when tips_included_in_accrual is true; cash tips never accrue.'
  trigger: on_request
  subject:
  - access_transfer
  computes: amount
  target_tool: request_bank_transfer_bc93e4f0
  params:
    card_points_high: 10
    card_points_low: 5
    card_loads_high: 4
    own_ratio_min_lines: 4
  rule: 'This schedule sets the bank transfer amount: the amount of a next-business-day transfer to the worker''s bank account on a plan whose worker holds no other Earned Wage Access Plan that is not closed and whose employer''s program agreement carries a configured access percentage no lower than the bank transfer percentage worked out below; for such a transfer, and only for such a transfer, it replaces the base rule on the amount available, and every other transfer, the instant debit-card transfers their own schedule governs among them, remains as that schedule or the base rule provides, the base rule reading: The amount available for a new transfer is the lowest of: (a) the percentage room, which is the access percentage applied to access_msr_period_accrued_net less access_msr_period_transfer_total, where the access percentage is the tier''s access_cap_percent or, when it is lower, the configured cap the employer set on its program agreement (access_msr_employer_cap_percent); (b) the pay-period room, which is per_pay_period_cap_usd less access_msr_period_transfer_total; (c) the per-day room under access_agg_combined_daily_limit; (d) per_transfer_max_usd; and (e) where it applies, the room under access_combined_deduction_ceiling. The bank transfer amount is worked out only after the plan''s level effective date falls after the pay date of its latest period close line, where it has one, that pay date is before today and no shortfall carries a pay date on or after the level effective date. The bank transfer amount is the lowest of the bank percentage room, the bank pay-period room, the bank day room, the tier''s per_transfer_max_usd and, where it applies, the bank deduction-ceiling room; it is never below zero and is rounded down to the cent. The bank percentage room is the bank transfer percentage, divided by one hundred, times the bank accrued net, less the bank period taken; the bank transfer percentage is the tier''s access_cap_percent. The bank pay-period room is the tier''s per_pay_period_cap_usd less the bank period taken. The bank day room is the tier''s per_day_cap_usd less the amount of every transfer booked on the plan today, returned or not. Where the worker has a Paystride Payroll-Repaid Loan in status repaying whose next_installment_date equals the plan''s next_pay_date, the bank deduction-ceiling room is combined_deduction_ceiling_percent_of_net, divided by one hundred, times the period''s accrued net as the base accrual rule measures it, each sync line that rule counts at its recorded net_amount, less the correction lines, less the bank period taken, less that loan''s installment_amount; without such a loan there is no bank deduction-ceiling room. The bank period taken is the amount of the plan''s transfers carrying the current pay_date, the plan''s next_pay_date, less the amount of the plan''s transfer returns carrying that pay_date. The bank accrued net is the net_amount of the plan''s earnings sync lines carrying the current pay_date less the net_amount of its earnings correction lines carrying that pay_date, each line at its recorded net_amount, regular-hours lines always counting, overtime lines only where overtime_included_in_accrual is true, shift-differential lines only where shift_differential_included_in_accrual is true and card tips lines only where tips_included_in_accrual is true; on a tier whose earnings_availability_lag_days is one, sync and correction lines whose work_date is today do not count. The plan''s open shortfall is its outstanding_balance less the bank period taken less the amount of the plan''s fees carrying the current pay_date net of the fee reversals carrying that pay_date; while it is above zero, the bank transfer percentage and the tier''s per_pay_period_cap_usd are each multiplied by access_during_open_shortfall_percent_of_cap divided by one hundred when it does not exceed max_open_shortfall_usd_for_continued_access, and by zero when it does. Toward the bank percentage room and the bank pay-period room a returned or cancelled transfer does not count, and toward the bank day room every transfer booked on the plan today counts, returned or not; for every other transfer, the instant debit-card transfers their own schedule governs aside, the base rule still reads: A transfer returned or cancelled does not count toward any room. For the bank accrued net a regular-hours or shift-differential sync line whose net_basis is estimated_from_gross may be valued again as an adjustment set out below provides, and every other line counts at its recorded net_amount; for every other purpose the base rule still reads: Each sync line adds its net_amount for one work date and earnings source: the employer-reported net where the employer sends one, and otherwise gross_amount multiplied by gross_to_net_estimation_percent, rounded down to the cent, with net_basis estimated_from_gross. For the bank accrued net, regular hours and shift differential accrue as the base rule provides, while overtime lines and card tips lines count in the part an adjustment set out below provides; for every other purpose the base rule still reads: Regular hours always accrue; overtime accrues when overtime_included_in_accrual is true, shift differential when shift_differential_included_in_accrual is true, and card tips reported by the employer''s point-of-sale feed only when tips_included_in_accrual is true; cash tips never accrue. The adjustments below are applied in this order: any that adds to the tier''s access_cap_percent first, then any that multiplies the bank transfer percentage, together with the open-shortfall multiplier, and last any that multiplies the lowest of the rooms, before the amount is rounded down. A record falls in the last N months when fewer than N whole months separate its date from today, whole months being the difference in calendar months less one when today''s day of the month is smaller than that date''s. Card wage points are added to the bank transfer percentage: 10 points when the worker holds a Paystride Visa Payroll Card account whose status is active and at least four card loads with load_source payroll posted to that account in the last two months; 5 points when the worker holds an active account and one to three such loads posted to it in the last two months; no points otherwise. The bank transfer percentage is multiplied by the tenure share: 80 percent when fewer than 180 calendar days separate the plan''s hire_date from today, 90 percent when 180 to 364 days do, and in full when 365 days or more do. Card tips lines count toward the bank accrued net at the tips share: on a tier whose tips_included_in_accrual is true, one half when no card tips sync line carries the pay_date of the plan''s latest period close line, and three quarters when one to three do; in full on such a tier otherwise, and not at all on a tier whose tips_included_in_accrual is false. Where overtime_included_in_accrual is true, overtime lines count toward the bank accrued net at the overtime share: not at all when two or more earnings correction lines with a work_date in the last two months stand on the plan, one half when exactly one does, and in full otherwise; where it is false they do not count. The estimate method sets the value of the regular-hours and shift-differential sync lines estimated from gross: when the regular-hours sync lines with net_basis employer_reported_net that carry the pay_date of the plan''s latest period close number at least four and none of them carries a gross_amount of zero, the estimated lines'' gross_amount in total is multiplied by the worker''s own net ratio, the net_amount of those employer-reported lines over their gross_amount, and rounded down to the cent once; when they number one to three and none carries a gross_amount of zero, that total gross is multiplied by the average of the worker''s own net ratio and gross_to_net_estimation_percent divided by one hundred, and rounded down to the cent once; otherwise the estimated lines count at their recorded net_amount. The bank transfer amount is taken at the return share: one half when a transfer return with reason_code returned_by_receiving_institution was booked on the plan in the last three months; three quarters when one was booked in the last six months but none in the last three; in full otherwise.'
  prerequisite:
  - problem: access_ext_tier_review
    kind: value_input
    gate: bt_pct
    form: state
    policy_source: The bank transfer amount is worked out only after the plan's level effective date falls after the pay date of its latest period close line, where it has one, that pay date is before today and no shortfall carries a pay date on or after the level effective date.
    condition: where the pay_date of the plan's latest access_period_close line is before today and no access_shortfall carries a pay_date on or after access_plans.level_effective_date, access_plans.level_effective_date is later than the pay_date of the plan's latest access_period_close line (the tier review of that payday is recorded, leaving level_effective_date the day after it); a plan with no period close line, on the day of its latest closed payday, or with a shortfall carrying a pay_date on or after its level_effective_date, waits on no tier review
    resolved_by: record_tier_review_be8f1edd
    effect: 'the tier the review records on access_plans.variant_name sets the tier parameters the bank transfer amount reads: access_cap_percent inside bt_pct, per_pay_period_cap_usd, per_day_cap_usd, per_transfer_max_usd and earnings_availability_lag_days'
  cross_category:
  - category: card
    as: history
    reads:
    - status
    - card_account_id
    - card_transactions.event_type
    - card_transactions.load_source
    - card_transactions.posted_date
    note: 'card_wage_points: tier decided by the worker''s active card account and the payroll loads posted to it in the last two months'
  - category: loan
    as: branch
    reads:
    - status
    - installment_amount
    - next_installment_date
    note: the deduction-ceiling room applies only when a repaying loan's next installment falls on the plan's next payday (baseline limit, no factor)
  compute:
  - bt_pay: F('next_pay_date')
  - bt_lcp: LATEST('access_earnings', 'pay_date', date_field='pay_date', event_type='access_period_close')
  - bt_lag1: 1 if P('earnings_availability_lag_days') == 1 else 0
  - bt_reg_er: SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='regular_hours', net_basis='employer_reported_net') - bt_lag1 * SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='regular_hours', net_basis='employer_reported_net', work_date=NOW)
  - bt_dif_er: SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='shift_differential', net_basis='employer_reported_net') - bt_lag1 * SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='shift_differential', net_basis='employer_reported_net', work_date=NOW)
  - bt_est_net: SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='regular_hours', net_basis='estimated_from_gross') + SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='shift_differential', net_basis='estimated_from_gross') - bt_lag1 * (SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='regular_hours', net_basis='estimated_from_gross', work_date=NOW) + SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='shift_differential', net_basis='estimated_from_gross', work_date=NOW))
  - bt_est_gross: SUM('access_earnings', 'gross_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='regular_hours', net_basis='estimated_from_gross') + SUM('access_earnings', 'gross_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='shift_differential', net_basis='estimated_from_gross') - bt_lag1 * (SUM('access_earnings', 'gross_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='regular_hours', net_basis='estimated_from_gross', work_date=NOW) + SUM('access_earnings', 'gross_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='shift_differential', net_basis='estimated_from_gross', work_date=NOW))
  - bt_ot: SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='overtime_hours') - bt_lag1 * SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='overtime_hours', work_date=NOW)
  - bt_tips: SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='card_tips') - bt_lag1 * SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_pay, earnings_source='card_tips', work_date=NOW)
  - bt_corr: SUM('access_earnings', 'net_amount', event_type='access_earnings_correction', pay_date=bt_pay) - bt_lag1 * SUM('access_earnings', 'net_amount', event_type='access_earnings_correction', pay_date=bt_pay, work_date=NOW)
  - bt_er_lines_last: COUNT('access_earnings', event_type='access_earnings_sync', pay_date=bt_lcp, earnings_source='regular_hours', net_basis='employer_reported_net')
  - bt_er_zero_gross_last: COUNT('access_earnings', event_type='access_earnings_sync', pay_date=bt_lcp, earnings_source='regular_hours', net_basis='employer_reported_net', gross_amount=0.0)
  - bt_own_ratio: SUM('access_earnings', 'net_amount', event_type='access_earnings_sync', pay_date=bt_lcp, earnings_source='regular_hours', net_basis='employer_reported_net') / SUM('access_earnings', 'gross_amount', event_type='access_earnings_sync', pay_date=bt_lcp, earnings_source='regular_hours', net_basis='employer_reported_net') if bt_er_lines_last >= 1 and bt_er_zero_gross_last == 0 else 0
  - bt_est_value: int(bt_est_gross * bt_own_ratio * 100 + 0.0000001) / 100 if bt_er_lines_last >= K('own_ratio_min_lines') and bt_er_zero_gross_last == 0 else (int(bt_est_gross * (bt_own_ratio + P('gross_to_net_estimation_percent') / 100) / 2 * 100 + 0.0000001) / 100 if bt_er_lines_last >= 1 and bt_er_zero_gross_last == 0 else bt_est_net)
  - bt_corr_2m: COUNT('access_earnings', within_months=2, date_field='work_date', event_type='access_earnings_correction')
  - bt_ot_share: 0 if not P('overtime_included_in_accrual') or bt_corr_2m >= 2 else (0.5 if bt_corr_2m == 1 else 1)
  - bt_tips_last: COUNT('access_earnings', event_type='access_earnings_sync', pay_date=bt_lcp, earnings_source='card_tips')
  - bt_tips_share: 0.5 if P('tips_included_in_accrual') and bt_tips_last == 0 else (0.75 if P('tips_included_in_accrual') and bt_tips_last <= 3 else (1 if P('tips_included_in_accrual') else 0))
  - bt_accrued: bt_reg_er + bt_est_value + (bt_dif_er if P('shift_differential_included_in_accrual') else 0) + bt_ot * bt_ot_share + bt_tips * bt_tips_share - bt_corr
  - bt_taken: RND(SUM('access_ledger', 'amount', event_type='access_transfer', pay_date=bt_pay) - SUM('access_ledger', 'amount', event_type='access_transfer_return', pay_date=bt_pay), 2)
  - bt_day_taken: SUM('access_ledger', 'amount', event_type='access_transfer', entry_date=NOW)
  - bt_open: RND(F('outstanding_balance') - bt_taken - (SUM('access_ledger', 'amount', event_type='access_fee', pay_date=bt_pay) - SUM('access_ledger', 'amount', event_type='access_fee_reversal', pay_date=bt_pay)), 2)
  - bt_sf_mult: 1 if bt_open <= 0 else (P('access_during_open_shortfall_percent_of_cap') / 100 if bt_open <= P('max_open_shortfall_usd_for_continued_access') else 0)
  - bt_card_active: 1 if EXISTS('card', status='active') else 0
  - bt_card_loads: XCOUNT('card', 'card_transactions', within_months=2, date_field='posted_date', event_type='card_load', load_source='payroll', card_account_id=CFIELD('card', 'card_account_id', status='active')) if bt_card_active == 1 else 0
  - bt_card_points: K('card_points_high') if bt_card_active == 1 and bt_card_loads >= K('card_loads_high') else (K('card_points_low') if bt_card_active == 1 and bt_card_loads >= 1 else 0)
  - bt_tenure_days: DAYS(F('hire_date'), NOW)
  - bt_tenure_share: 0.8 if bt_tenure_days < 180 else (0.9 if bt_tenure_days < 365 else 1)
  - bt_pct: (P('access_cap_percent') + bt_card_points) * bt_tenure_share * bt_sf_mult
  - bt_pct_room: bt_pct / 100 * bt_accrued - bt_taken
  - bt_period_room: P('per_pay_period_cap_usd') * bt_sf_mult - bt_taken
  - bt_day_room: P('per_day_cap_usd') - bt_day_taken
  - bt_loan_inst: CFIELD('loan', 'installment_amount', status='repaying', next_installment_date=bt_pay) or 0
  - bt_base_accrued: bt_reg_er + bt_est_net + (bt_dif_er if P('shift_differential_included_in_accrual') else 0) + (bt_ot if P('overtime_included_in_accrual') else 0) + (bt_tips if P('tips_included_in_accrual') else 0) - bt_corr
  - bt_ceiling_room: P('combined_deduction_ceiling_percent_of_net') / 100 * bt_base_accrued - bt_taken - bt_loan_inst if bt_loan_inst > 0 else 1000000
  - bt_lowest: MX(0, MN(bt_pct_room, bt_period_room, bt_day_room, P('per_transfer_max_usd'), bt_ceiling_room))
  - bt_ret_3m: COUNT('access_ledger', within_months=3, date_field='entry_date', event_type='access_transfer_return', reason_code='returned_by_receiving_institution')
  - bt_ret_6m: COUNT('access_ledger', within_months=6, date_field='entry_date', event_type='access_transfer_return', reason_code='returned_by_receiving_institution')
  - bt_return_share: 0.5 if bt_ret_3m >= 1 else (0.75 if bt_ret_6m >= 1 else 1)
  - result: int(bt_lowest * bt_return_share * 100 + 0.0000001) / 100
  compute_basis:
    bt_pay: The bank period taken is the amount of the plan's transfers carrying the current pay_date, the plan's next_pay_date, less the amount of the plan's transfer returns carrying that pay_date.
    bt_lcp: 'Card tips lines count toward the bank accrued net at the tips share: on a tier whose tips_included_in_accrual is true, one half when no card tips sync line carries the pay_date of the plan''s latest period close line, and three quarters when one to three do; in full on such a tier otherwise, and not at all on a tier whose tips_included_in_accrual is false.'
    bt_lag1: The bank accrued net is the net_amount of the plan's earnings sync lines carrying the current pay_date less the net_amount of its earnings correction lines carrying that pay_date, each line at its recorded net_amount, regular-hours lines always counting, overtime lines only where overtime_included_in_accrual is true, shift-differential lines only where shift_differential_included_in_accrual is true and card tips lines only where tips_included_in_accrual is true; on a tier whose earnings_availability_lag_days is one, sync and correction lines whose work_date is today do not count.
    bt_reg_er: The bank accrued net is the net_amount of the plan's earnings sync lines carrying the current pay_date less the net_amount of its earnings correction lines carrying that pay_date, each line at its recorded net_amount, regular-hours lines always counting, overtime lines only where overtime_included_in_accrual is true, shift-differential lines only where shift_differential_included_in_accrual is true and card tips lines only where tips_included_in_accrual is true; on a tier whose earnings_availability_lag_days is one, sync and correction lines whose work_date is today do not count.
    bt_dif_er: The bank accrued net is the net_amount of the plan's earnings sync lines carrying the current pay_date less the net_amount of its earnings correction lines carrying that pay_date, each line at its recorded net_amount, regular-hours lines always counting, overtime lines only where overtime_included_in_accrual is true, shift-differential lines only where shift_differential_included_in_accrual is true and card tips lines only where tips_included_in_accrual is true; on a tier whose earnings_availability_lag_days is one, sync and correction lines whose work_date is today do not count.
    bt_est_net: 'For the bank accrued net a regular-hours or shift-differential sync line whose net_basis is estimated_from_gross may be valued again as an adjustment set out below provides, and every other line counts at its recorded net_amount; for every other purpose the base rule still reads: Each sync line adds its net_amount for one work date and earnings source: the employer-reported net where the employer sends one, and otherwise gross_amount multiplied by gross_to_net_estimation_percent, rounded down to the cent, with net_basis estimated_from_gross.'
    bt_est_gross: 'The estimate method sets the value of the regular-hours and shift-differential sync lines estimated from gross: when the regular-hours sync lines with net_basis employer_reported_net that carry the pay_date of the plan''s latest period close number at least four and none of them carries a gross_amount of zero, the estimated lines'' gross_amount in total is multiplied by the worker''s own net ratio, the net_amount of those employer-reported lines over their gross_amount, and rounded down to the cent once; when they number one to three and none carries a gross_amount of zero, that total gross is multiplied by the average of the worker''s own net ratio and gross_to_net_estimation_percent divided by one hundred, and rounded down to the cent once; otherwise the estimated lines count at their recorded net_amount.'
    bt_ot: 'For the bank accrued net, regular hours and shift differential accrue as the base rule provides, while overtime lines and card tips lines count in the part an adjustment set out below provides; for every other purpose the base rule still reads: Regular hours always accrue; overtime accrues when overtime_included_in_accrual is true, shift differential when shift_differential_included_in_accrual is true, and card tips reported by the employer''s point-of-sale feed only when tips_included_in_accrual is true; cash tips never accrue.'
    bt_tips: 'For the bank accrued net, regular hours and shift differential accrue as the base rule provides, while overtime lines and card tips lines count in the part an adjustment set out below provides; for every other purpose the base rule still reads: Regular hours always accrue; overtime accrues when overtime_included_in_accrual is true, shift differential when shift_differential_included_in_accrual is true, and card tips reported by the employer''s point-of-sale feed only when tips_included_in_accrual is true; cash tips never accrue.'
    bt_corr: The bank accrued net is the net_amount of the plan's earnings sync lines carrying the current pay_date less the net_amount of its earnings correction lines carrying that pay_date, each line at its recorded net_amount, regular-hours lines always counting, overtime lines only where overtime_included_in_accrual is true, shift-differential lines only where shift_differential_included_in_accrual is true and card tips lines only where tips_included_in_accrual is true; on a tier whose earnings_availability_lag_days is one, sync and correction lines whose work_date is today do not count.
    bt_er_lines_last: 'The estimate method sets the value of the regular-hours and shift-differential sync lines estimated from gross: when the regular-hours sync lines with net_basis employer_reported_net that carry the pay_date of the plan''s latest period close number at least four and none of them carries a gross_amount of zero, the estimated lines'' gross_amount in total is multiplied by the worker''s own net ratio, the net_amount of those employer-reported lines over their gross_amount, and rounded down to the cent once; when they number one to three and none carries a gross_amount of zero, that total gross is multiplied by the average of the worker''s own net ratio and gross_to_net_estimation_percent divided by one hundred, and rounded down to the cent once; otherwise the estimated lines count at their recorded net_amount.'
    bt_er_zero_gross_last: 'The estimate method sets the value of the regular-hours and shift-differential sync lines estimated from gross: when the regular-hours sync lines with net_basis employer_reported_net that carry the pay_date of the plan''s latest period close number at least four and none of them carries a gross_amount of zero, the estimated lines'' gross_amount in total is multiplied by the worker''s own net ratio, the net_amount of those employer-reported lines over their gross_amount, and rounded down to the cent once; when they number one to three and none carries a gross_amount of zero, that total gross is multiplied by the average of the worker''s own net ratio and gross_to_net_estimation_percent divided by one hundred, and rounded down to the cent once; otherwise the estimated lines count at their recorded net_amount.'
    bt_own_ratio: 'The estimate method sets the value of the regular-hours and shift-differential sync lines estimated from gross: when the regular-hours sync lines with net_basis employer_reported_net that carry the pay_date of the plan''s latest period close number at least four and none of them carries a gross_amount of zero, the estimated lines'' gross_amount in total is multiplied by the worker''s own net ratio, the net_amount of those employer-reported lines over their gross_amount, and rounded down to the cent once; when they number one to three and none carries a gross_amount of zero, that total gross is multiplied by the average of the worker''s own net ratio and gross_to_net_estimation_percent divided by one hundred, and rounded down to the cent once; otherwise the estimated lines count at their recorded net_amount.'
    bt_est_value: 'The estimate method sets the value of the regular-hours and shift-differential sync lines estimated from gross: when the regular-hours sync lines with net_basis employer_reported_net that carry the pay_date of the plan''s latest period close number at least four and none of them carries a gross_amount of zero, the estimated lines'' gross_amount in total is multiplied by the worker''s own net ratio, the net_amount of those employer-reported lines over their gross_amount, and rounded down to the cent once; when they number one to three and none carries a gross_amount of zero, that total gross is multiplied by the average of the worker''s own net ratio and gross_to_net_estimation_percent divided by one hundred, and rounded down to the cent once; otherwise the estimated lines count at their recorded net_amount.'
    bt_corr_2m: 'Where overtime_included_in_accrual is true, overtime lines count toward the bank accrued net at the overtime share: not at all when two or more earnings correction lines with a work_date in the last two months stand on the plan, one half when exactly one does, and in full otherwise; where it is false they do not count.'
    bt_ot_share: 'Where overtime_included_in_accrual is true, overtime lines count toward the bank accrued net at the overtime share: not at all when two or more earnings correction lines with a work_date in the last two months stand on the plan, one half when exactly one does, and in full otherwise; where it is false they do not count.'
    bt_tips_last: 'Card tips lines count toward the bank accrued net at the tips share: on a tier whose tips_included_in_accrual is true, one half when no card tips sync line carries the pay_date of the plan''s latest period close line, and three quarters when one to three do; in full on such a tier otherwise, and not at all on a tier whose tips_included_in_accrual is false.'
    bt_tips_share: 'Card tips lines count toward the bank accrued net at the tips share: on a tier whose tips_included_in_accrual is true, one half when no card tips sync line carries the pay_date of the plan''s latest period close line, and three quarters when one to three do; in full on such a tier otherwise, and not at all on a tier whose tips_included_in_accrual is false.'
    bt_accrued: 'For the bank accrued net, regular hours and shift differential accrue as the base rule provides, while overtime lines and card tips lines count in the part an adjustment set out below provides; for every other purpose the base rule still reads: Regular hours always accrue; overtime accrues when overtime_included_in_accrual is true, shift differential when shift_differential_included_in_accrual is true, and card tips reported by the employer''s point-of-sale feed only when tips_included_in_accrual is true; cash tips never accrue.'
    bt_taken: The bank period taken is the amount of the plan's transfers carrying the current pay_date, the plan's next_pay_date, less the amount of the plan's transfer returns carrying that pay_date.
    bt_day_taken: The bank day room is the tier's per_day_cap_usd less the amount of every transfer booked on the plan today, returned or not.
    bt_open: The plan's open shortfall is its outstanding_balance less the bank period taken less the amount of the plan's fees carrying the current pay_date net of the fee reversals carrying that pay_date; while it is above zero, the bank transfer percentage and the tier's per_pay_period_cap_usd are each multiplied by access_during_open_shortfall_percent_of_cap divided by one hundred when it does not exceed max_open_shortfall_usd_for_continued_access, and by zero when it does.
    bt_sf_mult: The plan's open shortfall is its outstanding_balance less the bank period taken less the amount of the plan's fees carrying the current pay_date net of the fee reversals carrying that pay_date; while it is above zero, the bank transfer percentage and the tier's per_pay_period_cap_usd are each multiplied by access_during_open_shortfall_percent_of_cap divided by one hundred when it does not exceed max_open_shortfall_usd_for_continued_access, and by zero when it does.
    bt_card_active: 'Card wage points are added to the bank transfer percentage: 10 points when the worker holds a Paystride Visa Payroll Card account whose status is active and at least four card loads with load_source payroll posted to that account in the last two months; 5 points when the worker holds an active account and one to three such loads posted to it in the last two months; no points otherwise.'
    bt_card_loads: 'Card wage points are added to the bank transfer percentage: 10 points when the worker holds a Paystride Visa Payroll Card account whose status is active and at least four card loads with load_source payroll posted to that account in the last two months; 5 points when the worker holds an active account and one to three such loads posted to it in the last two months; no points otherwise.'
    bt_card_points: 'Card wage points are added to the bank transfer percentage: 10 points when the worker holds a Paystride Visa Payroll Card account whose status is active and at least four card loads with load_source payroll posted to that account in the last two months; 5 points when the worker holds an active account and one to three such loads posted to it in the last two months; no points otherwise.'
    bt_tenure_days: 'The bank transfer percentage is multiplied by the tenure share: 80 percent when fewer than 180 calendar days separate the plan''s hire_date from today, 90 percent when 180 to 364 days do, and in full when 365 days or more do.'
    bt_tenure_share: 'The bank transfer percentage is multiplied by the tenure share: 80 percent when fewer than 180 calendar days separate the plan''s hire_date from today, 90 percent when 180 to 364 days do, and in full when 365 days or more do.'
    bt_pct: 'The adjustments below are applied in this order: any that adds to the tier''s access_cap_percent first, then any that multiplies the bank transfer percentage, together with the open-shortfall multiplier, and last any that multiplies the lowest of the rooms, before the amount is rounded down.'
    bt_pct_room: The bank percentage room is the bank transfer percentage, divided by one hundred, times the bank accrued net, less the bank period taken; the bank transfer percentage is the tier's access_cap_percent.
    bt_period_room: The bank pay-period room is the tier's per_pay_period_cap_usd less the bank period taken.
    bt_day_room: The bank day room is the tier's per_day_cap_usd less the amount of every transfer booked on the plan today, returned or not.
    bt_loan_inst: Where the worker has a Paystride Payroll-Repaid Loan in status repaying whose next_installment_date equals the plan's next_pay_date, the bank deduction-ceiling room is combined_deduction_ceiling_percent_of_net, divided by one hundred, times the period's accrued net as the base accrual rule measures it, each sync line that rule counts at its recorded net_amount, less the correction lines, less the bank period taken, less that loan's installment_amount; without such a loan there is no bank deduction-ceiling room.
    bt_base_accrued: Where the worker has a Paystride Payroll-Repaid Loan in status repaying whose next_installment_date equals the plan's next_pay_date, the bank deduction-ceiling room is combined_deduction_ceiling_percent_of_net, divided by one hundred, times the period's accrued net as the base accrual rule measures it, each sync line that rule counts at its recorded net_amount, less the correction lines, less the bank period taken, less that loan's installment_amount; without such a loan there is no bank deduction-ceiling room.
    bt_ceiling_room: Where the worker has a Paystride Payroll-Repaid Loan in status repaying whose next_installment_date equals the plan's next_pay_date, the bank deduction-ceiling room is combined_deduction_ceiling_percent_of_net, divided by one hundred, times the period's accrued net as the base accrual rule measures it, each sync line that rule counts at its recorded net_amount, less the correction lines, less the bank period taken, less that loan's installment_amount; without such a loan there is no bank deduction-ceiling room.
    bt_lowest: The bank transfer amount is the lowest of the bank percentage room, the bank pay-period room, the bank day room, the tier's per_transfer_max_usd and, where it applies, the bank deduction-ceiling room; it is never below zero and is rounded down to the cent.
    bt_ret_3m: 'The bank transfer amount is taken at the return share: one half when a transfer return with reason_code returned_by_receiving_institution was booked on the plan in the last three months; three quarters when one was booked in the last six months but none in the last three; in full otherwise.'
    bt_ret_6m: 'The bank transfer amount is taken at the return share: one half when a transfer return with reason_code returned_by_receiving_institution was booked on the plan in the last three months; three quarters when one was booked in the last six months but none in the last three; in full otherwise.'
    bt_return_share: 'The bank transfer amount is taken at the return share: one half when a transfer return with reason_code returned_by_receiving_institution was booked on the plan in the last three months; three quarters when one was booked in the last six months but none in the last three; in full otherwise.'
    result: 'The adjustments below are applied in this order: any that adds to the tier''s access_cap_percent first, then any that multiplies the bank transfer percentage, together with the open-shortfall multiplier, and last any that multiplies the lowest of the rooms, before the amount is rounded down.'
  factors:
  - id: card_wage_points
    effect: parameter
    decides: bt_card_points
    bindings:
    - bt_card_active
    - bt_card_loads
    - bt_card_points
    ladder:
    - when: the worker holds a card account whose status is active AND four or more card loads with load_source payroll posted to it in the last two months
      value: K('card_points_high') = 10 points
    - when: the worker holds an active card account AND one to three such payroll loads posted to it in the last two months
      value: K('card_points_low') = 5 points
    - when: otherwise
      value: 0 points
    baseline:
      bt_card_points: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: tenure_share
    effect: parameter
    decides: bt_tenure_share
    bindings:
    - bt_tenure_days
    - bt_tenure_share
    ladder:
    - when: fewer than 180 calendar days from the plan's hire_date to today
      value: '0.8'
    - when: 180 to 364 days
      value: '0.9'
    - when: otherwise (365 days or more)
      value: '1'
    baseline:
      bt_tenure_share: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: tips_share
    effect: parameter
    decides: bt_tips_share
    bindings:
    - bt_tips_last
    - bt_tips_share
    ladder:
    - when: tips_included_in_accrual is true AND no card tips sync line carries the latest period close's pay_date
      value: '0.5'
    - when: tips_included_in_accrual is true AND one to three card tips sync lines carry it
      value: '0.75'
    - when: otherwise
      value: 1 where tips_included_in_accrual is true, 0 where it is false
    baseline:
      bt_tips_share: 1 if P('tips_included_in_accrual') else 0
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: overtime_share
    effect: parameter
    decides: bt_ot_share
    bindings:
    - bt_corr_2m
    - bt_ot_share
    ladder:
    - when: overtime_included_in_accrual is false OR two or more earnings correction lines with a work_date in the last two months
      value: '0'
    - when: overtime_included_in_accrual is true AND exactly one such correction line
      value: '0.5'
    - when: otherwise
      value: '1'
    baseline:
      bt_ot_share: 1 if P('overtime_included_in_accrual') else 0
    evidence:
    - history
    cross_difficulty: null
  - id: estimate_method
    effect: method
    decides: bt_est_value
    bindings:
    - bt_er_lines_last
    - bt_er_zero_gross_last
    - bt_own_ratio
    - bt_est_value
    ladder:
    - when: four or more employer-reported regular-hours lines carry the latest period close's pay_date AND none of them carries a zero gross_amount
      method: estimated lines' total gross times the worker's own net ratio of those lines, rounded down to the cent once
    - when: one to three such lines AND none carries a zero gross_amount
      method: estimated lines' total gross times the average of the own net ratio and gross_to_net_estimation_percent / 100, rounded down once
    - when: otherwise
      method: estimated lines at their recorded net_amount
    baseline:
      bt_est_value: bt_est_net
    evidence:
    - history
    cross_difficulty: null
  - id: return_share
    effect: parameter
    decides: bt_return_share
    bindings:
    - bt_ret_3m
    - bt_ret_6m
    - bt_return_share
    ladder:
