    s_limit: 'The liability limit for a signed claim follows the claimed transaction and the loss report: when the claimed transaction is a purchase and the plan applies Visa Zero Liability (visa_zero_liability_applies), the limit is zero; when the loss report was late, the limit is liability_cap_late_usd; otherwise it is liability_cap_timely_usd.'
    s_prior: 'The liability already charged on the same loss for a signed claim is counted on the loss''s claims resolved with an error found, each at its disputed amount, before any claim still under investigation: when the loss carries such claims and the report was late, it is the lesser of their total disputed amount and liability_cap_late_usd; when it carries such claims and the report was not late, the lesser of that total and liability_cap_timely_usd; otherwise nothing is already charged.'
