  rule: 'This policy is the final claim credit schedule for the Advantage plan: it prices the final credit on a lost or stolen card claim, for a card on the Advantage plan, resolved with an error found and carrying no provisional credit. The claim it prices is the account''s most recently resolved claim of an unauthorized transaction handled under Regulation E error resolution and resolved with an error found; it is priced only when that claim carries a loss date, carries neither a provisional nor a final credit, is the only claim of its loss resolved with an error found and shares its resolution date with no other such claim of the account, and its loss''s liability limit can be timed as set out below or its transaction is a purchase under Visa Zero Liability, which carries no liability whenever the loss was reported; otherwise this policy prices nothing and the base rule applies. Business days are Monday through Friday excluding Federal Reserve holidays, counted from the day after the earlier date through the later one. The final credit is the claimed transfer less the cardholder''s liability, rounded half up to the cent once at the end: the claimed transfer is the disputed amount less any ATM owner surcharge rebate posted on the claimed transaction, never below zero; the credit takes the cardholder''s liability off the claimed transfer, never below zero, the liability being the lesser of the disputed amount and the liability limit, with a liability limit of liability_cap_timely_usd; as the only claim of its loss resolved with an error found it carries the loss''s liability first. The adjustments below each either replace a figure of that method or add an amount to the credit; replacements apply first, additions after them, and the credit is rounded half up to the cent once at the end. A claim''s loss is the set of the account''s unauthorized-transaction claims carrying its loss date; this policy times the liability limit for an account whose replacement orders placed less than 12 whole months before today include at most one for a lost card and at most one for a stolen card, exactly one of them placed on or after the loss date; orders placed 12 or more months before today never count, and under Paystride''s program practice an account with repeated lost or stolen cards within those 12 months is referred to Paystride''s card fraud review team, so this policy books nothing for its claims. The liability limit for a final credit follows the claimed transaction and the loss report, the loss being reported on the date of the single replacement order placed on or after the loss date among those orders: when the claimed transaction is a purchase and the plan applies Visa Zero Liability (visa_zero_liability_applies), the limit is zero; when that report came more than timely_loss_report_business_days business days after the loss date, the limit is liability_cap_late_usd; otherwise it is liability_cap_timely_usd. The Paystride fees credited with a final credit follow the claimed transaction: when Paystride fees were charged on it (an out-of-network ATM fee, an international ATM fee or a foreign transaction fee), they count less any part of them already returned by refund or correction; when it is a withdrawal at a domestic out-of-network ATM that carried no out-of-network ATM fee because it was one of its pay period''s free withdrawals, out_of_network_atm_withdrawal_fee_usd counts for the free withdrawal it used; otherwise nothing counts. The late credit allowance follows the business days from the claim''s resolution date to the posting day: more than late_high_business_days business days earns late_high_usd; more than error_correction_business_days business days earns late_low_usd; otherwise nothing. The investigation allowance credited with a final credit follows the time from the claim''s notice date to its resolution date: when that is more than extended_investigation_days_new_pos_foreign calendar days for a new-account, point-of-sale or foreign-initiated transaction, or more than extended_investigation_calendar_days calendar days for any other transaction, the allowance is investigation_high_usd; when it is not, but is more than new_account_investigation_business_days business days for a new-account transaction or more than investigation_business_days business days for any other transaction, it is investigation_low_usd; otherwise it is nothing. A new-account transaction is one that posted no more than new_account_days calendar days after the account''s first deposit date, a point-of-sale transaction is a purchase, and a foreign-initiated transaction is one marked as a foreign transaction. A claim''s report day is its notice date when Paystride ordered a replacement card for a lost or stolen card on the account that day and the claim is the most recently registered claim of its loss first reported that day, the replacement read being the stolen-card order when both a lost-card and a stolen-card replacement were ordered that day, and a day with two replacement orders of the same reason being no report day; the early pay cost credited with a final credit follows the Paystride Access ledger on the claim''s report day: of the worker''s early pay transfers booked that day to an external debit card or to a bank account, Paystride takes the most recently requested one, the transfer to the external debit card when two were requested at the same moment, and for a card replaced as stolen counts the fee booked on it less any Access reversal of that fee, while for a card replaced as lost it counts that fee but no more than the next-business-day bank fee (nbd_fee_bank_usd) of the tier the worker''s Access plan holds on the day the credit is figured, as the plan record shows it; for a claim with no report day, or no such transfer, nothing counts. Otherwise liability is the lesser of the unauthorized amount and liability_cap_timely_usd when the cardholder reported the loss or theft within timely_loss_report_business_days business days after loss_learned_date, and the lesser of the unauthorized amount and liability_cap_late_usd when reported later; unauthorized transfers that posted more than error_notice_window_days calendar days after the history access date and before the report may be the cardholder''s in full; on a claim this schedule prices, and only on such a claim, the loss counts as reported on the date of the account''s single lost or stolen replacement order placed on or after the loss date among its orders of the last 12 months, and no transfer is charged in full, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own. Liability is counted once across all unauthorized transactions from the same loss or theft, applied in posting order; on a claim this schedule prices, and only on such a claim, the liability already charged on the loss is counted on its claims resolved with an error found before any claim still under investigation, whatever their posting order, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own. When an error is found, a provisional credit already posted becomes final with no second credit, and where none was posted, a final credit of the error amount, less any cardholder liability, posts within error_correction_business_days business days, every fee the error caused being returned by a fee correction under card_evt_fee_refunds; for a claim this schedule prices, and only for such a claim, the final credit is the one this schedule sets out and the fees it credits are not corrected again, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own. Without any request, Paystride books a fee correction, with reason fee_charged_in_error, for a fee it finds it assessed in error itself, and, with reason dispute_error, for each fee caused by a transaction that a resolved dispute found to be an error, the request window not limiting corrections; a fee credited within a final credit this schedule prices, and only such a fee, is not corrected again, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own.'
