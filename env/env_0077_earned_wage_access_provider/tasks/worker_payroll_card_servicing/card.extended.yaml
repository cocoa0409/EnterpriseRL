category: card
display_name: Paystride Visa Payroll Card Account
binding:
  holding_table: card_accounts
  event_tables:
  - card_transactions
  - card_service_orders
  intake_tables:
  - card_disputes
  - card_closure_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    card_balance: card_balance
lifecycle:
  states:
  - issued
  - active
  - blocked
  - closed
  transitions:
  - from: issued
    to: active
    by: user
    means: the cardholder activates the card
  - from: issued
    to: closed
    by: system
    means: a never-activated, zero-balance account closes on withdrawn consent or the end of the employer program
  - from: active
    to: blocked
    by: agent
    means: the desk blocks the card on a lost, stolen or fraud report or the cardholder's request
  - from: blocked
    to: active
    by: user
    means: the cardholder confirms the found card or activates the replacement
  - from: active
    to: closed
    by: user
    means: the cardholder confirms closure after the balance is paid out
accounts:
- key: card_balance
  unit: USD
  meaning: Funds available on the payroll card account.
parameter_schema:
  monthly_maintenance_fee_usd: Monthly account fee (USD).
  inactivity_fee_usd: Fee charged for each calendar month an account stays inactive after the inactivity period (USD).
  inactivity_period_days: Calendar days without any load and without any cardholder-initiated debit after which the account is inactive (days).
  in_network_atm_withdrawal_fee_usd: Fee for a cash withdrawal at an in-network ATM (USD).
  out_of_network_atm_withdrawal_fee_usd: Paystride fee for a domestic out-of-network ATM withdrawal beyond the free allowance, in addition to any ATM owner surcharge (USD).
  free_out_of_network_withdrawals_per_pay_period: Domestic out-of-network ATM withdrawals per pay period carrying no Paystride fee (count).
  atm_balance_inquiry_fee_usd: Fee for each balance inquiry at an out-of-network ATM (USD).
  card_to_bank_min_usd: Smallest transfer from the card account to an outside bank account (USD).
  atm_decline_fee_usd: Fee for an ATM withdrawal declined for insufficient funds at an out-of-network ATM (USD).
  international_atm_fee_usd: Fee for an ATM withdrawal outside the United States, never covered by the free allowance (USD).
  foreign_transaction_fee_percent: Percent of the U.S. dollar amount of a purchase or withdrawal made in a foreign currency or processed outside the United States (number, percent).
  otc_cash_withdrawal_fee_usd: Fee for an over-the-counter teller cash withdrawal at a Visa member bank (USD).
  card_replacement_fee_usd: Fee for a standard-delivery replacement card beyond the free allowance (USD).
  free_replacements_per_12_months: Replacement cards in any rolling 365 days carrying no replacement fee (count).
  expedited_replacement_fee_usd: Fee for expedited delivery of a replacement card, charged in addition to any replacement fee (USD).
  replacement_standard_delivery_business_days: Business days for standard delivery of a replacement card (count).
  expedited_delivery_business_days: Business days for expedited delivery of a replacement card (count).
  expiry_reissue_free: Whether the reissue of a card nearing its expiry date is free (boolean).
  card_to_bank_transfer_fee_usd: Fee for a transfer from the card account to an outside bank account beyond the free allowance (USD).
  free_card_to_bank_transfers_per_pay_period: Card-to-bank transfers per pay period carrying no fee (count).
  daily_atm_withdrawal_limit_usd: Most cash that can be withdrawn at ATMs in one calendar day (USD).
  atm_withdrawals_per_day_max: ATM withdrawals allowed in one calendar day (count).
  daily_purchase_limit_usd: Most that can be spent in purchases in one calendar day (USD).
  daily_card_to_bank_limit_usd: Most that can be sent to outside bank accounts in one calendar day (USD).
  max_card_balance_usd: Largest balance the account may hold; a load that would exceed it is returned to its originator (USD).
  ewa_load_fee_usd: Fee for receiving an early wage transfer onto the card (USD).
  instant_pay_load_fee_usd: Fee for receiving an employer instant pay disbursement onto the card (USD).
  atm_surcharge_rebates_per_month: ATM owner surcharges rebated per calendar month on out-of-network withdrawals (count).
  atm_surcharge_rebate_max_usd: Largest surcharge rebated for one withdrawal (USD).
  courtesy_fee_refunds_per_12_months: Goodwill fee refunds allowed in any rolling 365 days (count).
  fee_refund_request_window_days: Calendar days after a fee posted within which a refund for a fee charged in error or a courtesy refund may be requested (days).
  electronic_history_months: Months of account history available online and in the app (months).
  written_history_free_months: Months of written account history mailed free on request (months).
  written_history_fee_usd: Fee for a written account history on request (USD).
  error_notice_window_days: Calendar days after the cardholder first electronically accessed the account history, or was sent a written history, showing the error within which notice is timely (days).
  error_notice_outer_limit_days: Calendar days after the disputed transaction posted within which notice is timely regardless of history access (days).
  investigation_business_days: Business days after notice to complete an error investigation without provisional credit (count).
  new_account_investigation_business_days: Business days for that investigation when the disputed transaction occurred within the new-account period (count).
  extended_investigation_calendar_days: Calendar days after notice to which an investigation may be extended when provisional credit is given (days).
  extended_investigation_days_new_pos_foreign: Extended investigation period for new-account, point-of-sale debit card or foreign-initiated transactions (days).
  provisional_credit_business_days: Business days after notice by which provisional credit is posted when the investigation is not finished (count).
  written_confirmation_window_business_days: Business days after an oral notice within which requested written confirmation must arrive for provisional credit to be owed (count).
  result_notice_business_days: Business days after the investigation ends within which the result is reported (count).
  provisional_reversal_notice_business_days: Business days of notice before a provisional credit is debited back after a no-error finding (count).
  new_account_days: Calendar days after the first deposit during which the account is a new account for error resolution (days).
  timely_loss_report_business_days: Business days after learning of a lost or stolen card within which a report limits liability to the lower cap (count).
  liability_cap_timely_usd: Cardholder liability for unauthorized transfers when loss is reported in time (USD).
  liability_cap_late_usd: Cardholder liability for unauthorized transfers when loss is reported late but within the error notice window (USD).
  visa_zero_liability_applies: Whether Visa's Zero Liability policy sets cardholder liability to zero for unauthorized Visa-processed transactions (boolean).
  error_correction_business_days: Business days after an error is determined within which it is corrected with a final credit (count).
  closure_payout_check_fee_usd: Fee for paying out the remaining balance by check when the account closes (USD).
