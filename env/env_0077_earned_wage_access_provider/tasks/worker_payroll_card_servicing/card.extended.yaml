  baseline:
    rule: 'The reversal takes back the part of the provisional credit posted on the claim that exceeds what the claim is due, never below zero, limited to the available balance, the part it cannot take staying uncollected, rounded half up to the cent once at the end: the claim is due its claimed transfer, the disputed amount less any ATM owner surcharge rebate posted on its transaction and never below zero, less the cardholder''s liability, never below zero, the liability being the lesser of the disputed amount and the liability limit, with a liability limit of liability_cap_timely_usd; as the only claim of its loss resolved with an error found it carries the loss''s liability first.'
