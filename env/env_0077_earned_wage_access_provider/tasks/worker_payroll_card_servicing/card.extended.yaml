  overwrite:
  - base_policy: card_evt_error_resolution
    superseded_clause: When it cannot, it may take until extended_investigation_calendar_days calendar days after the notice date, or extended_investigation_days_new_pos_foreign for a new-account, point-of-sale debit card or foreign-initiated transaction, but only by posting a provisional credit of the disputed amount, less any cardholder liability under card_unauthorized_liability, within provisional_credit_business_days business days of the notice date (new_account_investigation_business_days for a new-account transaction).
    replaced_by: When Paystride cannot complete a Regulation E investigation in time, it may take until extended_investigation_calendar_days calendar days after the notice date, or extended_investigation_days_new_pos_foreign for a new-account, point-of-sale debit card or foreign-initiated transaction, but only by posting a provisional credit within provisional_credit_business_days business days of the notice date (new_account_investigation_business_days for a new-account transaction), of the disputed amount less any cardholder liability under card_unauthorized_liability on every claim that neither this schedule nor the signed claim schedule for the Premier and Elite plans prices; for a signed claim this schedule prices, and only for such a claim, the provisional credit is the claim form credit and posts when the cardholder signs.
  - base_policy: card_unauthorized_liability
    superseded_clause: Otherwise liability is the lesser of the unauthorized amount and liability_cap_timely_usd when the cardholder reported the loss or theft within timely_loss_report_business_days business days after loss_learned_date, and the lesser of the unauthorized amount and liability_cap_late_usd when reported later; unauthorized transfers that posted more than error_notice_window_days calendar days after the history access date and before the report may be the cardholder's in full.
    replaced_by: Otherwise liability is the lesser of the unauthorized amount and liability_cap_timely_usd when the cardholder reported the loss or theft within timely_loss_report_business_days business days after loss_learned_date, and the lesser of the unauthorized amount and liability_cap_late_usd when reported later; unauthorized transfers that posted more than error_notice_window_days calendar days after the history access date and before the report may be the cardholder's in full; on a claim this schedule prices, and only on such a claim, the loss counts as reported on the date of the account's single lost or stolen replacement order placed on or after the loss date among its orders of the last 12 months, and no transfer is charged in full, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own.
  - base_policy: card_unauthorized_liability
    superseded_clause: Liability is counted once across all unauthorized transactions from the same loss or theft, applied in posting order.
    replaced_by: Liability is counted once across all unauthorized transactions from the same loss or theft, applied in posting order; on a claim this schedule prices, and only on such a claim, the liability already charged on the loss is counted on its claims resolved with an error found before any claim still under investigation, whatever their posting order, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own.
  - base_policy: card_evt_error_resolution
    superseded_clause: When an error is found, a provisional credit already posted becomes final with no second credit; where none was posted, a final credit of the error amount, less any cardholder liability, posts within error_correction_business_days business days, and every fee the error caused is returned by a fee correction under card_evt_fee_refunds.
    replaced_by: When an error is found, a provisional credit already posted becomes final with no second credit, and where none was posted, a final credit of the error amount, less any cardholder liability, posts within error_correction_business_days business days, every fee the error caused being returned by a fee correction under card_evt_fee_refunds; for a claim whose provisional credit this schedule priced, and only for such a claim, the fees credited with the claim form credit are not returned again, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own.
  - base_policy: card_evt_fee_refunds
    superseded_clause: Without any request, Paystride books a fee correction, with reason fee_charged_in_error, for a fee it finds it assessed in error itself, and, with reason dispute_error, for each fee caused by a transaction that a resolved dispute found to be an error; the request window does not limit corrections.
    replaced_by: Without any request, Paystride books a fee correction, with reason fee_charged_in_error, for a fee it finds it assessed in error itself, and, with reason dispute_error, for each fee caused by a transaction that a resolved dispute found to be an error, the request window not limiting corrections; a fee credited within a claim form credit this schedule prices, and only such a fee, is not corrected again, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own.
