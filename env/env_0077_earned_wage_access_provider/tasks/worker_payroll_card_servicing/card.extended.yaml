    w_scope: 'This policy is the claim reversal schedule for the Advantage plan: it prices the reversal that takes back the part of a provisional credit on a lost or stolen card claim, for a card on the Advantage plan, that stands above what the claim is due once it is resolved with an error found.'
    w_n_lost: A claim's loss is the set of the account's unauthorized-transaction claims carrying its loss date; this policy times the liability limit for an account whose replacement orders placed less than 12 whole months before today include at most one for a lost card and at most one for a stolen card, exactly one of them placed on or after the loss date; orders placed 12 or more months before today never count, and under Paystride's program practice an account with repeated lost or stolen cards within those 12 months is referred to Paystride's card fraud review team, so this policy books nothing for its claims.
