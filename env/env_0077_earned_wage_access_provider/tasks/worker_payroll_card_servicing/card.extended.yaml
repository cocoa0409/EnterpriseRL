measures:
- id: card_msr_pay_period_oon_withdrawals
  window: 'the card''s pay period containing the withdrawal: from the posted_date of the latest payroll load (load_source payroll) on or before it to the day before the next payroll load'
  measure: count of card_debit atm_withdrawal entries with atm_network out_of_network posted in the pay period, in order of posted_date then daily_sequence, the withdrawal in question included
- id: card_msr_pay_period_card_to_bank
  window: the card's pay period containing the transfer, defined as for card_msr_pay_period_oon_withdrawals
  measure: count of card_debit card_to_bank_transfer entries posted in the pay period, in posting order, the transfer in question included
- id: card_msr_replacements_365d
  window: the 365 calendar days ending on the order date
  measure: count of earlier card_replacement_order entries with order_reason lost, stolen or damaged on the account
- id: card_msr_last_activity_date
  window: the account's whole history up to today
  measure: latest posted_date among card_load entries of any load_source and card_debit entries the cardholder initiated (purchase, atm_withdrawal, otc_cash_withdrawal, card_to_bank_transfer, save_transfer); ewa_recovery and employer_load_reversal debits and fees are not activity
- id: card_msr_courtesy_refunds_365d
  window: the 365 calendar days ending today
  measure: count of card_fee_refund entries with refund_reason courtesy on the account
- id: card_msr_month_surcharge_rebates
  window: the calendar month of the withdrawal
  measure: count of card_surcharge_rebate entries whose withdrawal posted in that month
- id: card_msr_day_atm_total
  window: one posted_date
  measure: sum of amount and count of card_debit atm_withdrawal entries on that date
- id: card_msr_day_purchase_total
  window: one posted_date
  measure: sum of amount of card_debit purchase entries on that date
- id: card_msr_day_card_to_bank_total
  window: one posted_date
  measure: sum of amount of card_debit card_to_bank_transfer entries on that date
policies:
- id: card_agg_multi_holding
  subject:
  - card_issue
  rule: A worker holds at most max_per_customer payroll card account; loads from a second employer's Payroll Card Program post to the same account, whose plan stays the one set by the program it was opened under. A worker may not hold a second card account that is not closed. An account is opened only under an employer Payroll Card Program whose status is live. An account is opened only when the worker's written, voluntary consent to receive wages on the card is on file as payroll_consent_date. Under Regulation E no employer may require a worker to be paid on a payroll card as a condition of employment, so a worker who has not consented, or who prefers direct deposit or a paper check, is paid that way instead and no account is opened. The account opens in issued status with a zero balance, block_reason none, the plan matching the employer's Payroll Card Program package as listed in each plan's entry gate, and no first_deposit_date until a load posts.
  eligibility:
  - id: one_account
    applies_to:
    - card_issue
    kind: dedup
    condition: A worker may not hold a second card account that is not closed.
    evidence_fields:
    - card_accounts.customer_id
    - card_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.customer_id
      action_bindings:
        card_accounts.customer_id: customer_id
    dedup_contract:
      table: card_accounts
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - issued
        - active
        - blocked
      distinct_fields:
      - issued_date
  - id: program_live
    applies_to:
    - card_issue
    kind: state
    condition: An account is opened only under an employer Payroll Card Program whose status is live.
    evidence_fields:
    - paycard_programs.status
    - paycard_programs.paycard_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - paycard_programs.paycard_program_id
      action_bindings:
        paycard_programs.paycard_program_id: paycard_program_id
    state_contract:
      field: paycard_programs.status
      allowed:
      - live
  - id: wage_consent
    applies_to:
    - card_issue
    kind: authorization
    condition: An account is opened only when the worker's written, voluntary consent to receive wages on the card is on file as payroll_consent_date.
    evidence_fields:
    - card_accounts.payroll_consent_date
    - card_accounts.customer_id
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - card_accounts.customer_id
      action_bindings:
        card_accounts.customer_id: customer_id
  params:
    max_per_customer: 1
- id: card_evt_atm_and_foreign_fees
  subject:
  - card_fee
  rule: 'ATM and foreign transaction fees follow the fee schedule of the card plan held on the posted date of the transaction that incurred them; each fee points to that transaction through related_txn_id, carries its atm_network, and posts on the same date. A transaction incurs at most one fee of each fee type. An in-network ATM withdrawal costs in_network_atm_withdrawal_fee_usd. A domestic out-of-network ATM withdrawal costs out_of_network_atm_withdrawal_fee_usd unless its position in its pay period (card_msr_pay_period_oon_withdrawals) is within free_out_of_network_withdrawals_per_pay_period. The free allowance covers only the Paystride fee, never the surcharge the ATM owner adds, which is part of the withdrawal amount. A card pay period runs from one payroll load to the next; early wage transfers, instant pay disbursements and off-cycle payroll loads never start a new pay period. An ATM withdrawal outside the United States (atm_network international) costs international_atm_fee_usd and is never free; a teller cash withdrawal at a Visa member bank costs otc_cash_withdrawal_fee_usd. Each balance inquiry at an out-of-network ATM costs atm_balance_inquiry_fee_usd and each withdrawal declined for insufficient funds at an out-of-network ATM costs atm_decline_fee_usd; neither leaves a debit on the account, so these two fees point to no transaction and are told apart by daily_sequence; inquiries and declines at in-network ATMs are free. A purchase or withdrawal with foreign_transaction true carries in addition a foreign transaction fee of foreign_transaction_fee_percent of its amount, rounded to the nearest cent. A fee that comes to zero is not assessed. No fee ever takes the balance below zero: a fee larger than the available balance is reduced to the balance, and none is assessed on a zero balance. A fee is never assessed on a transaction that was itself an error corrected under card_evt_error_resolution.'
  eligibility:
  - id: one_fee_per_type
    applies_to:
    - card_fee
    kind: dedup
    condition: A transaction incurs at most one fee of each fee type.
    evidence_fields:
    - card_transactions.related_txn_id
    - card_transactions.fee_type
    - card_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.related_txn_id
        - card_transactions.fee_type
      action_bindings:
        card_transactions.related_txn_id: related_txn_id
        card_transactions.fee_type: fee_type
    dedup_contract:
      table: card_transactions
      mode: separate_record
      object_bindings:
        related_txn_id: related_txn_id
        fee_type: fee_type
      duplicate_filters:
        event_type:
        - card_fee
      distinct_fields:
      - daily_sequence
  params:
    per_tier:
      Paystride Visa Payroll Card Essential:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
      Paystride Visa Payroll Card Standard:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
      Paystride Visa Payroll Card Select:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
      Paystride Visa Payroll Card Advantage:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
      Paystride Visa Payroll Card Premier:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
      Paystride Visa Payroll Card Elite:
        out_of_network_atm_withdrawal_fee_usd: =out_of_network_atm_withdrawal_fee_usd
        free_out_of_network_withdrawals_per_pay_period: =free_out_of_network_withdrawals_per_pay_period
        foreign_transaction_fee_percent: =foreign_transaction_fee_percent
        international_atm_fee_usd: =international_atm_fee_usd
  formula:
    oon_fee: 0 if card_msr_pay_period_oon_withdrawals <= free_out_of_network_withdrawals_per_pay_period else out_of_network_atm_withdrawal_fee_usd
    foreign_fee: round(amount * foreign_transaction_fee_percent / 100, 2)
  measures:
  - card_msr_pay_period_oon_withdrawals
- id: card_evt_service_fees
  subject:
  - card_fee
  - card_inactivity_fee
  rule: Service fees follow the plan held on the day they are incurred. A service order incurs at most one fee of each fee type. A replacement ordered for a lost, stolen or damaged card costs card_replacement_fee_usd unless card_msr_replacements_365d is below free_replacements_per_12_months; a reissue of a card nearing expiry is free when expiry_reissue_free is true. Expedited shipping costs expedited_replacement_fee_usd in addition, and the free allowance never covers it. Both fees point to the service order through related_txn_id. A card-to-bank transfer costs card_to_bank_transfer_fee_usd unless its position in its pay period (card_msr_pay_period_card_to_bank) is within free_card_to_bank_transfers_per_pay_period. The account is inactive when card_msr_last_activity_date is inactivity_period_days or more calendar days before today. An inactivity fee is assessed only once inactivity_period_days calendar days have passed since the account's last activity date. Calendar days are counted from the day after the last activity date, so the first inactivity fee posts on the last activity date plus the inactivity period, and later ones on the same day of each following calendar month, or on that month's last day when it has no such day. An account incurs at most one inactivity fee on a posted date. The inactivity fee is inactivity_fee_usd, carries fee_type inactivity, is reduced to the balance when the balance is smaller, is not assessed on a zero balance, and stops as soon as any load posts or the cardholder initiates any debit. monthly_maintenance_fee_usd, written_history_fee_usd and closure_payout_check_fee_usd are charged as listed and, where zero, never assessed. A fee that comes to zero is not assessed and no fee takes the balance below zero.
  eligibility:
  - id: inactivity_wait
    applies_to:
    - card_inactivity_fee
    kind: time
    condition: An inactivity fee is assessed only once inactivity_period_days calendar days have passed since the account's last activity date.
    evidence_fields:
    - card_transactions.posted_date
    - card_transactions.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.card_account_id
      action_bindings:
        card_transactions.card_account_id: card_account_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the account's last activity date
      anchor_source: card_transactions.posted_date
      relation: not_before
      duration_source: variants.inactivity_period_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the last activity date, so the first inactivity fee posts on the last activity date plus the inactivity period, and later ones on the same day of each following calendar month, or on that month's last day when it has no such day.
      boundary: inclusive
  - id: one_fee_per_order
    applies_to:
    - card_fee
    kind: dedup
    condition: A service order incurs at most one fee of each fee type.
    evidence_fields:
    - card_transactions.related_txn_id
    - card_transactions.fee_type
    - card_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.related_txn_id
        - card_transactions.fee_type
      action_bindings:
        card_transactions.related_txn_id: related_txn_id
        card_transactions.fee_type: fee_type
    dedup_contract:
      table: card_transactions
      mode: separate_record
      object_bindings:
        related_txn_id: related_txn_id
        fee_type: fee_type
      duplicate_filters:
        event_type:
        - card_fee
      distinct_fields:
      - daily_sequence
  - id: one_inactivity_fee
    applies_to:
    - card_inactivity_fee
    kind: dedup
    condition: An account incurs at most one inactivity fee on a posted date.
    evidence_fields:
    - card_transactions.card_account_id
    - card_transactions.posted_date
    - card_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.card_account_id
        - card_transactions.posted_date
      action_bindings:
        card_transactions.card_account_id: card_account_id
        card_transactions.posted_date: posted_date
    dedup_contract:
      table: card_transactions
      mode: separate_record
      object_bindings:
        card_account_id: card_account_id
        posted_date: posted_date
      duplicate_filters:
        event_type:
