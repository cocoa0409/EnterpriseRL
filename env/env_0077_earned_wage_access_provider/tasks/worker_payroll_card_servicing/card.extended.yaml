events:
- type: card_issue
  target: card_accounts
  mutation: create
  meaning: A payroll card account is opened for a worker under the employer's Payroll Card Program and the first card is issued.
  grain: one row per card account change
  fields:
    customer_id: the cardholder (foreign key -> customers)
    paycard_program_id: the employer Payroll Card Program under which the account was opened (foreign key -> paycard_programs)
    variant_name: the card plan held, as the official full plan name; set by the employer's paycard package
    status: lifecycle state of the card account (see the card charter lifecycle)
    issued_date: date the account was opened and the first card issued
    card_last4: last four digits of the card currently issued on the account, exactly as printed
    payroll_consent_date: date the worker gave the employer written, voluntary consent to receive wages on the card; empty if no consent is on file
    first_deposit_date: posted date of the first load ever credited to the account; the start of the new-account period; empty before any load
    block_reason: why the account is blocked; none when not blocked
    card_balance: 'current available balance: loads, fee refunds and dispute credits less debits, fees and dispute credit reversals; never negative'
  triggers: []
- type: card_activate
  target: card_accounts
  mutation:
    transition:
      from: issued
      to: active
  meaning: The cardholder activates the card.
  grain: one row per card account change
  fields:
    activated_date: date the cardholder activated the card; empty until then
  triggers: []
- type: card_close_unactivated
  target: card_accounts
  mutation:
    transition:
      from: issued
      to: closed
  meaning: A never-activated account with a zero balance is closed because the worker withdrew consent to wage payment by card or the employer's paycard program ended.
  grain: one row per card account change
  fields:
    closed_date: date the account closed; empty while not closed
  triggers: []
- type: card_block
  target: card_accounts
  mutation:
    transition:
      from: active
      to: blocked
  meaning: The desk blocks the card after a lost, stolen or fraud report or at the cardholder's request.
  grain: one row per card account change
  fields:
    block_reason: why the account is blocked; none when not blocked
  triggers: []
- type: card_unblock
  target: card_accounts
  mutation:
    transition:
      from: blocked
      to: active
  meaning: The cardholder confirms the found card in hand or activates the replacement card, and the block is lifted.
  grain: one row per card account change
  fields:
    block_reason: why the account is blocked; none when not blocked
  triggers: []
- type: card_close
  target: card_accounts
  mutation:
    transition:
      from: active
      to: closed
  meaning: The cardholder confirms closure of the account after the remaining balance is paid out.
  grain: one row per card account change
  fields:
    closed_date: date the account closed; empty while not closed
