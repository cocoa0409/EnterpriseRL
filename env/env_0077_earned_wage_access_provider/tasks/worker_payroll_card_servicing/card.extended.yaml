    policy_source: The claim form credit is fixed only after every other claim of the same loss whose provisional credit stood above what that claim was due carries its reversal.
    condition: Every other claim on the account carrying the same loss date, resolved with an error found, whose provisional credit stood above what that claim was due carries a provisional credit reversal entry pointing to that provisional credit.
