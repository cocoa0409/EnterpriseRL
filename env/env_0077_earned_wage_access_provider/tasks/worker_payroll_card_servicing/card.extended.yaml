    y_liability: 'The final credit is the claimed transfer less the cardholder''s liability, rounded half up to the cent once at the end: the claimed transfer is the disputed amount less any ATM owner surcharge rebate posted on the claimed transaction, never below zero; the credit takes the cardholder''s liability off the claimed transfer, never below zero, the liability being the lesser of the disputed amount and the liability limit, with a liability limit of liability_cap_timely_usd; as the only claim of its loss resolved with an error found it carries the loss''s liability first.'
    result: The adjustments below each either replace a figure of that method or add an amount to the credit; replacements apply first, additions after them, and the credit is rounded half up to the cent once at the end.
  factors:
  - id: yc_liability_limit
    effect: parameter
    decides: y_limit
    bindings:
    - y_report
    - y_limit
    ladder:
    - when: the claimed transaction is a purchase and the plan applies Visa Zero Liability
      value: '0'
    - when: the loss report was late (more than timely_loss_report_business_days business days after the loss date)
      value: P('liability_cap_late_usd')
    - when: otherwise
      value: P('liability_cap_timely_usd')
    baseline:
      y_limit: P('liability_cap_timely_usd')
    evidence:
    - date
    - history
    - tier_param
    cross_difficulty: null
  - id: yc_transaction_fees
    effect: method
    decides: y_fee_back
    bindings:
    - y_network
    - y_fees
    - y_oon_id
    - y_intl_id
    - y_fx_id
    - y_fee_ret
    - y_fee_back
    ladder:
    - when: Paystride fees were charged on the claimed transaction
      method: the fees charged on it less any part already returned by refund or correction
    - when: the claimed transaction is a domestic out-of-network ATM withdrawal that carried no out-of-network ATM fee as one of its pay period's free withdrawals
      method: out_of_network_atm_withdrawal_fee_usd for the free withdrawal it used
    - when: otherwise
      method: nothing
    baseline:
      y_fee_back: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: yc_late_allowance
    effect: parameter
    decides: y_late
    bindings:
    - y_bd_late
    - y_late
    ladder:
    - when: more than late_high_business_days business days from the resolution date to the posting day
      value: K('late_high_usd')
    - when: more than error_correction_business_days business days
      value: K('late_low_usd')
    - when: otherwise
      value: '0'
    baseline:
      y_late: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: yc_investigation_allowance
    effect: parameter
    decides: y_inv
    bindings:
    - y_posted
    - y_foreign
    - y_newacct
    - y_days_inv
    - y_bd_inv
    - y_inv
    ladder:
    - when: the investigation ran past its Regulation E extended limit (extended_investigation_days_new_pos_foreign calendar days for a new-account, point-of-sale or foreign-initiated transaction, extended_investigation_calendar_days otherwise)
      value: K('investigation_high_usd')
    - when: it ran past new_account_investigation_business_days business days for a new-account transaction or investigation_business_days business days otherwise
      value: K('investigation_low_usd')
    - when: otherwise
      value: '0'
    baseline:
      y_inv: '0'
    evidence:
    - date
    - history
    - tier_param
    cross_difficulty: null
  - id: yc_early_pay_cost
    effect: method
    decides: y_early
    bindings:
    - y_n_day_stolen
    - y_n_day_lost
    - y_reason
    - y_order
    - y_reportday
    - y_x_ext
    - y_x_ext_time
    - y_x_bank
    - y_x_bank_time
    - y_x_pick
    - y_x_fee_id
    - y_x_fee
    - y_x_plan
    - y_x_nbd
    - y_early
    ladder:
    - when: the claim's report day replaced a card as stolen
      method: the fee booked on the most recently requested early pay transfer of that day to an external debit card or bank account, less any Access reversal of it
    - when: it replaced a card as lost
      method: the lesser of that fee and nbd_fee_bank_usd of the tier the worker's Access plan holds on the day the credit is figured
    - when: otherwise
      method: nothing
    baseline:
      y_early: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: access
  baseline:
    rule: 'The final credit is the claimed transfer less the cardholder''s liability, rounded half up to the cent once at the end: the claimed transfer is the disputed amount less any ATM owner surcharge rebate posted on the claimed transaction, never below zero; the credit takes the cardholder''s liability off the claimed transfer, never below zero, the liability being the lesser of the disputed amount and the liability limit, with a liability limit of liability_cap_timely_usd; as the only claim of its loss resolved with an error found it carries the loss''s liability first.'
    params:
    - liability_cap_timely_usd
  cross_category:
  - category: access
    as: history
    reads:
    - access_ledger.event_type
    - access_ledger.entry_date
    - access_ledger.destination_type
    - access_ledger.requested_time
    - access_ledger.related_entry_id
    - access_ledger.amount
    - access_ledger.access_plan_id
    - variant_name
    note: 'The early pay cost credited with the final credit is read from the worker''s Access ledger on the claim''s report day: the most recently requested early pay transfer to an outside destination, its fee and any reversal of that fee, and the next-business-day bank fee of the tier the Access plan holds today.'
  inputs:
    history:
    - table: card_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: card_fee
    - table: card_service_orders
      aggregate: latest
      field: order_reason
      filters:
        event_type: card_replacement_order
    - table: access_ledger
      category: access
      aggregate: sum
      field: amount
      filters:
        event_type: access_fee
    cross_category:
    - access
  prerequisite: []
