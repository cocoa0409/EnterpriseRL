  factors:
  - id: sl_liability_limit
    effect: parameter
    decides: s_limit
    bindings:
    - s_limit
    ladder:
    - when: the claimed transaction is a purchase and the plan applies Visa Zero Liability
      value: '0'
    - when: the loss report was late (more than timely_loss_report_business_days business days after the loss date)
      value: P('liability_cap_late_usd')
    - when: otherwise
      value: P('liability_cap_timely_usd')
    baseline:
      s_limit: P('liability_cap_timely_usd')
    evidence:
    - date
    - history
    - tier_param
    cross_difficulty: null
  - id: sl_prior_liability
    effect: parameter
    decides: s_prior
    bindings:
    - s_prior
    ladder:
    - when: the loss carries claims resolved with an error found and the loss report was late
      value: the lesser of their total disputed amount and liability_cap_late_usd
    - when: it carries such claims and the loss report was not late
      value: the lesser of that total and liability_cap_timely_usd
    - when: otherwise
      value: '0'
    baseline:
      s_prior: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: sl_transaction_fees
    effect: method
    decides: s_fee_back
    bindings:
    - s_network
    - s_fees
    - s_oon_id
    - s_intl_id
    - s_fx_id
    - s_fee_ret
    - s_fee_back
    ladder:
    - when: Paystride fees were charged on the claimed transaction
      method: the fees charged on it less any part already returned by refund or correction
    - when: the claimed transaction is a domestic out-of-network ATM withdrawal that carried no out-of-network ATM fee as one of its pay period's free withdrawals
      method: out_of_network_atm_withdrawal_fee_usd for the free withdrawal it used
    - when: otherwise
      method: nothing
    baseline:
      s_fee_back: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: sl_service_allowance
    effect: parameter
    decides: s_allow
    bindings:
    - s_bd_open
    - s_allow
    ladder:
    - when: more than allowance_high_business_days business days from the notice date to the signing day
      value: K('allowance_high_usd')
    - when: more than provisional_credit_business_days business days
      value: K('allowance_low_usd')
    - when: otherwise
      value: '0'
    baseline:
      s_allow: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
