    z_n_day_stolen: A claim's report day is its notice date when Paystride ordered a replacement card for a lost or stolen card on the account that day and the claim is the most recently registered claim of its loss first reported that day; the replacement read is the stolen-card order when both a lost-card and a stolen-card replacement were ordered that day, and a day with two replacement orders of the same reason is no report day.
    z_n_day_lost: A claim's report day is its notice date when Paystride ordered a replacement card for a lost or stolen card on the account that day and the claim is the most recently registered claim of its loss first reported that day; the replacement read is the stolen-card order when both a lost-card and a stolen-card replacement were ordered that day, and a day with two replacement orders of the same reason is no report day.
