    z_liability: 'The final credit is the claimed transfer less the cardholder''s liability, rounded half up to the cent once at the end: the claimed transfer is the disputed amount less any ATM owner surcharge rebate posted on the claimed transaction, never below zero; the credit takes the cardholder''s liability off the claimed transfer, never below zero, the liability being the lesser of the disputed amount and the liability limit, with a liability limit of liability_cap_timely_usd; as the only claim of its loss resolved with an error found it carries the loss''s liability first.'
    result: The adjustments below each either replace a figure of that method or add an amount to the credit; replacements apply first, additions after them, and the credit is rounded half up to the cent once at the end.
  factors:
  - id: zc_liability_limit
    effect: parameter
    decides: z_limit
    bindings:
    - z_report
    - z_limit
    ladder:
    - when: the claimed transaction is a purchase and the plan applies Visa Zero Liability
      value: '0'
    - when: the loss report was late (more than timely_loss_report_business_days business days after the loss date)
      value: P('liability_cap_late_usd')
    - when: otherwise
      value: P('liability_cap_timely_usd')
    baseline:
      z_limit: P('liability_cap_timely_usd')
    evidence:
    - date
    - history
    - tier_param
    cross_difficulty: null
  - id: zc_transaction_fees
    effect: method
    decides: z_fee_back
    bindings:
    - z_network
    - z_fees
    - z_oon_id
    - z_intl_id
    - z_fx_id
    - z_fee_ret
    - z_fee_back
    ladder:
    - when: Paystride fees were charged on the claimed transaction
      method: the fees charged on it less any part already returned by refund or correction
    - when: the claimed transaction is a domestic out-of-network ATM withdrawal that carried no out-of-network ATM fee as one of its pay period's free withdrawals
      method: out_of_network_atm_withdrawal_fee_usd for the free withdrawal it used
    - when: otherwise
      method: nothing
    baseline:
      z_fee_back: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: zc_late_allowance
    effect: parameter
    decides: z_late
    bindings:
    - z_bd_late
    - z_late
    ladder:
    - when: more than late_high_business_days business days from the resolution date to the posting day
      value: K('late_high_usd')
    - when: more than error_correction_business_days business days
      value: K('late_low_usd')
    - when: otherwise
      value: '0'
    baseline:
      z_late: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: zc_investigation_allowance
    effect: parameter
    decides: z_inv
    bindings:
    - z_posted
    - z_foreign
    - z_newacct
    - z_days_inv
    - z_bd_inv
    - z_inv
    ladder:
    - when: the investigation ran past its Regulation E extended limit (extended_investigation_days_new_pos_foreign calendar days for a new-account, point-of-sale or foreign-initiated transaction, extended_investigation_calendar_days otherwise)
      value: K('investigation_high_usd')
    - when: it ran past new_account_investigation_business_days business days for a new-account transaction or investigation_business_days business days otherwise
      value: K('investigation_low_usd')
    - when: otherwise
      value: '0'
    baseline:
      z_inv: '0'
    evidence:
    - date
    - history
    - tier_param
    cross_difficulty: null
  - id: zc_replacement_fees
    effect: parameter
    decides: z_repl
    bindings:
    - z_repl_fee_id
    - z_repl_net
    - z_exp_fee_id
    - z_exp_net
    - z_repl
    ladder:
    - when: the replacement ordered on the claim's report day was for a card replaced as stolen
      value: the replacement fee and expedited shipping fee charged on it, less any part returned
    - when: it was for a card replaced as lost
      value: the replacement fee charged on it, less any part returned
    - when: otherwise
      value: '0'
    baseline:
      z_repl: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: zc_early_pay_cost
    effect: method
    decides: z_early
