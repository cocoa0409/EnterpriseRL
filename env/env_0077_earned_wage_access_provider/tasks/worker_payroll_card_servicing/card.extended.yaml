      anchor_event: the fee's posted date
      anchor_source: card_transactions.posted_date
      relation: not_after
      duration_source: variants.fee_refund_request_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the fee's posted_date, so the last day to ask is the posted_date plus the window.
      boundary: inclusive
  - id: one_return_per_fee
    applies_to:
