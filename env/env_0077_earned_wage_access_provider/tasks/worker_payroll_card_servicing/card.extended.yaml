    y_report: 'The liability limit for a final credit follows the claimed transaction and the loss report, the loss being reported on the date of the single replacement order placed on or after the loss date among those orders: when the claimed transaction is a purchase and the plan applies Visa Zero Liability (visa_zero_liability_applies), the limit is zero; when that report came more than timely_loss_report_business_days business days after the loss date, the limit is liability_cap_late_usd; otherwise it is liability_cap_timely_usd.'
    y_limit: 'The liability limit for a final credit follows the claimed transaction and the loss report, the loss being reported on the date of the single replacement order placed on or after the loss date among those orders: when the claimed transaction is a purchase and the plan applies Visa Zero Liability (visa_zero_liability_applies), the limit is zero; when that report came more than timely_loss_report_business_days business days after the loss date, the limit is liability_cap_late_usd; otherwise it is liability_cap_timely_usd.'
    y_network: 'The Paystride fees credited with a final credit follow the claimed transaction: when Paystride fees were charged on it (an out-of-network ATM fee, an international ATM fee or a foreign transaction fee), they count less any part of them already returned by refund or correction; when it is a withdrawal at a domestic out-of-network ATM that carried no out-of-network ATM fee because it was one of its pay period''s free withdrawals, out_of_network_atm_withdrawal_fee_usd counts for the free withdrawal it used; otherwise nothing counts.'
