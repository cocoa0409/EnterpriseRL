    w_n_day_stolen: 'A claim''s report day is its notice date when Paystride ordered a replacement card for a lost or stolen card on the account that day and the claim is the most recently registered claim of its loss first reported that day, the replacement read being the stolen-card order when both a lost-card and a stolen-card replacement were ordered that day, and a day with two replacement orders of the same reason being no report day; the early pay cost the reversed claim is due follows the Paystride Access ledger on the claim''s report day: of the worker''s early pay transfers booked that day to an external debit card or to a bank account, Paystride takes the most recently requested one, the transfer to the external debit card when two were requested at the same moment, and for a card replaced as stolen counts the fee booked on it less any Access reversal of that fee, while for a card replaced as lost it counts that fee but no more than the next-business-day bank fee (nbd_fee_bank_usd) of the tier the worker''s Access plan holds on the day the credit is figured, as the plan record shows it; for a claim with no report day, or no such transfer, nothing counts.'
