        provisional_credit_business_days: =provisional_credit_business_days
        investigation_business_days: =investigation_business_days
      Paystride Visa Payroll Card Premier:
        provisional_credit_business_days: =provisional_credit_business_days
        investigation_business_days: =investigation_business_days
      Paystride Visa Payroll Card Elite:
        provisional_credit_business_days: =provisional_credit_business_days
        investigation_business_days: =investigation_business_days
- id: card_unauthorized_liability
  subject:
  - card_provisional_credit
  - card_final_credit
  rule: For an unauthorized-transaction dispute the cardholder's liability is the part of the unauthorized amount that is not credited. When visa_zero_liability_applies is true and the transaction was a purchase processed over the Visa network, liability is zero; this Visa policy overrides the Regulation E amounts below and does not cover ATM or teller cash withdrawals. Otherwise liability is the lesser of the unauthorized amount and liability_cap_timely_usd when the cardholder reported the loss or theft within timely_loss_report_business_days business days after loss_learned_date, and the lesser of the unauthorized amount and liability_cap_late_usd when reported later; unauthorized transfers that posted more than error_notice_window_days calendar days after the history access date and before the report may be the cardholder's in full. Liability is counted once across all unauthorized transactions from the same loss or theft, applied in posting order. The two caps apply only when the card itself was lost or stolen; when it was not, such as unauthorized use while the card is still in hand, liability is zero except for transfers that posted after that late-notice window and before the report.
  eligibility: []
  formula:
    zero_liability: visa_zero_liability_applies and debit_type == 'purchase'
- id: card_evt_loads
  subject:
  - card_load
  - card_first_deposit_record
  rule: 'Loads post as their originators send them: employer payroll and off-cycle loads funded through the employer''s Payroll Card Program, early wage transfers from the cardholder''s Paystride Access plan, instant pay disbursements from an employer''s Instant Pay service, and withdrawals from the cardholder''s own Paystride Save account; each load carries its originating record in source_ref_id and the originator''s name in merchant_name. A load posts only to an account whose status is issued, active or blocked. An originating record posts as a load to a given account once. A blocked card stops spending, never wages. A load to a closed account, or one that would take the balance above max_card_balance_usd, is returned to its originator in full and never posts. Receiving an early wage transfer costs ewa_load_fee_usd and receiving an instant pay disbursement costs instant_pay_load_fee_usd; where zero no fee is assessed. The first load ever posted to the account sets first_deposit_date to its posted date, which starts the new-account period; later loads never change it.'
  eligibility:
  - id: load_status
    applies_to:
    - card_load
    kind: state
    condition: A load posts only to an account whose status is issued, active or blocked.
    evidence_fields:
    - card_accounts.status
    - card_accounts.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.card_account_id
      action_bindings:
        card_accounts.card_account_id: card_account_id
    state_contract:
      field: card_accounts.status
      allowed:
      - issued
      - active
      - blocked
  - id: one_load_per_origin
    applies_to:
    - card_load
    kind: dedup
    condition: An originating record posts as a load to a given account once.
    evidence_fields:
    - card_transactions.source_ref_id
    - card_transactions.card_account_id
    - card_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_transactions.card_account_id
        - card_transactions.source_ref_id
      action_bindings:
        card_transactions.card_account_id: card_account_id
        card_transactions.source_ref_id: source_ref_id
    dedup_contract:
      table: card_transactions
      mode: separate_record
      object_bindings:
        card_account_id: card_account_id
        source_ref_id: source_ref_id
      duplicate_filters:
        event_type:
        - card_load
      distinct_fields: []
  params:
    per_tier:
      Paystride Visa Payroll Card Essential:
        max_card_balance_usd: =max_card_balance_usd
      Paystride Visa Payroll Card Standard:
        max_card_balance_usd: =max_card_balance_usd
      Paystride Visa Payroll Card Select:
        max_card_balance_usd: =max_card_balance_usd
      Paystride Visa Payroll Card Advantage:
        max_card_balance_usd: =max_card_balance_usd
      Paystride Visa Payroll Card Premier:
        max_card_balance_usd: =max_card_balance_usd
      Paystride Visa Payroll Card Elite:
        max_card_balance_usd: =max_card_balance_usd
- id: card_evt_debits
  subject:
  - card_debit
  rule: 'A debit posts only while the account status is active. Debits post only up to the available balance: the account has no overdraft, credit feature or negative balance, and a debit larger than the balance is declined and never posts. Purchases are limited per posted date by daily_purchase_limit_usd (card_msr_day_purchase_total), ATM withdrawals by daily_atm_withdrawal_limit_usd and atm_withdrawals_per_day_max (card_msr_day_atm_total), and card-to-bank transfers by daily_card_to_bank_limit_usd (card_msr_day_card_to_bank_total) and a minimum of card_to_bank_min_usd. An out-of-network withdrawal''s amount includes the ATM owner''s surcharge, recorded in atm_surcharge_usd. An early wage access recovery debit posts only under the cardholder''s standing authorization recorded on their Access plan, for no more than the available balance, and carries the Access recovery in source_ref_id. An employer_load_reversal debit takes back an erroneous employer payroll load or a recalled instant pay disbursement only as the employer''s program approves it, for no more than the available balance, and carries the employer''s request in source_ref_id; it is never initiated by the cardholder and is not activity. A save_transfer debit moves money to the cardholder''s own Paystride Save account by round-up, auto-save or manual transfer; it is cardholder-initiated.'
  eligibility:
  - id: debit_status
    applies_to:
    - card_debit
    kind: state
    condition: A debit posts only while the account status is active.
    evidence_fields:
    - card_accounts.status
    - card_accounts.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.card_account_id
      action_bindings:
        card_accounts.card_account_id: card_account_id
    state_contract:
      field: card_accounts.status
      allowed:
      - active
  params:
    per_tier:
      Paystride Visa Payroll Card Essential:
        daily_purchase_limit_usd: =daily_purchase_limit_usd
        daily_atm_withdrawal_limit_usd: =daily_atm_withdrawal_limit_usd
      Paystride Visa Payroll Card Standard:
        daily_purchase_limit_usd: =daily_purchase_limit_usd
        daily_atm_withdrawal_limit_usd: =daily_atm_withdrawal_limit_usd
      Paystride Visa Payroll Card Select:
        daily_purchase_limit_usd: =daily_purchase_limit_usd
        daily_atm_withdrawal_limit_usd: =daily_atm_withdrawal_limit_usd
      Paystride Visa Payroll Card Advantage:
        daily_purchase_limit_usd: =daily_purchase_limit_usd
        daily_atm_withdrawal_limit_usd: =daily_atm_withdrawal_limit_usd
      Paystride Visa Payroll Card Premier:
        daily_purchase_limit_usd: =daily_purchase_limit_usd
        daily_atm_withdrawal_limit_usd: =daily_atm_withdrawal_limit_usd
      Paystride Visa Payroll Card Elite:
        daily_purchase_limit_usd: =daily_purchase_limit_usd
        daily_atm_withdrawal_limit_usd: =daily_atm_withdrawal_limit_usd
  measures:
  - card_msr_day_purchase_total
  - card_msr_day_atm_total
  - card_msr_day_card_to_bank_total
- id: card_lifecycle
  subject:
  - card_activate
  - card_close_unactivated
  - card_block
  - card_unblock
  - card_close
  - card_number_reissue
  - card_plan_change
  rule: 'Activating the card is the cardholder''s own act. A never-activated account with a zero balance closes when the worker withdraws consent to wage payment by card or the employer''s Payroll Card Program ends. The desk blocks only an account whose status is active. The desk blocks the card at once when the cardholder reports it lost or stolen (block_reason lost or stolen), reports transactions they did not make (suspected_fraud), or asks for a temporary block (cardholder_request); a block stops every debit but never stops loads. A lost or stolen card number is never reactivated: that block lifts only when the cardholder activates the replacement card, whose new card_last4 is recorded when the replacement is ordered. A suspected_fraud or cardholder_request block lifts when the cardholder confirms the card is in hand and says which transactions they made. Closing the account is the cardholder''s own decision: the desk registers a closure request, the remaining balance is paid out by check free of charge or by transfer to the cardholder''s bank account, and the account closes once the balance is zero. A closure is confirmed only for an account whose status is active. An account is not closed while any of its disputes has status submitted or investigating. The card plan follows the employer''s Payroll Card Program package and changes on the day the employer''s package changes; the cardholder cannot choose or buy a plan.'
  eligibility:
  - id: block_from_active
    applies_to:
    - card_block
    kind: state
    condition: The desk blocks only an account whose status is active.
    evidence_fields:
    - card_accounts.status
    - card_accounts.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.card_account_id
      action_bindings:
        card_accounts.card_account_id: card_account_id
    state_contract:
      field: card_accounts.status
      allowed:
      - active
  - id: close_from_active
    applies_to:
    - card_close
    kind: state
    condition: A closure is confirmed only for an account whose status is active.
    evidence_fields:
    - card_accounts.status
    - card_accounts.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.card_account_id
      action_bindings:
        card_accounts.card_account_id: card_account_id
    state_contract:
      field: card_accounts.status
      allowed:
      - active
  - id: no_open_dispute
    applies_to:
    - card_close
    kind: state
    condition: An account is not closed while any of its disputes has status submitted or investigating.
    evidence_fields:
    - card_disputes.dispute_status
    - card_disputes.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_disputes.card_account_id
      action_bindings:
        card_disputes.card_account_id: card_account_id
    state_contract:
      field: card_disputes.dispute_status
      allowed:
      - resolved_error_found
      - resolved_no_error
      - withdrawn
- id: card_evt_service_orders
  subject:
  - card_replacement_order
  - card_history_request
  rule: A replacement card is ordered only for an account whose status is active or blocked. A card reported lost or stolen is blocked before its replacement is ordered, and its replacement carries a new card number; a damaged card is replaced on the same number while the account stays active; a card nearing expiry is reissued with order_reason expiring. Standard delivery takes replacement_standard_delivery_business_days business days and expedited delivery expedited_delivery_business_days; replacement and shipping fees follow card_evt_service_fees. The cardholder may ask at any time for a written history covering up to written_history_free_months months, mailed at written_history_fee_usd; the date it is sent counts as history access for error notices. Online and in-app history covers electronic_history_months months.
  eligibility:
  - id: replacement_status
    applies_to:
    - card_replacement_order
    kind: state
    condition: A replacement card is ordered only for an account whose status is active or blocked.
    evidence_fields:
    - card_accounts.status
    - card_accounts.card_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - card_accounts.card_account_id
      action_bindings:
        card_accounts.card_account_id: card_account_id
    state_contract:
      field: card_accounts.status
      allowed:
      - active
      - blocked
  params:
    per_tier:
      Paystride Visa Payroll Card Essential:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
      Paystride Visa Payroll Card Standard:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
      Paystride Visa Payroll Card Select:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
      Paystride Visa Payroll Card Advantage:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
      Paystride Visa Payroll Card Premier:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
      Paystride Visa Payroll Card Elite:
        replacement_standard_delivery_business_days: =replacement_standard_delivery_business_days
