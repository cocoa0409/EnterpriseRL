    s_rebate: 'The signed claim credit is the claimed transfer less the amount withheld for the cardholder''s liability, rounded half up to the cent once at the end: the claimed transfer is the disputed amount less any ATM owner surcharge rebate posted on the claimed transaction, never below zero; the cardholder''s liability is the liability limit less the liability already charged on the same loss, never below zero, or the disputed amount if that is smaller, with a liability limit of liability_cap_timely_usd and nothing already charged; and the amount withheld is the lesser of that liability and liability_cap_timely_usd, the most Regulation E lets be withheld from a provisional credit; the credit is never below zero.'
    s_transfer: 'The signed claim credit is the claimed transfer less the amount withheld for the cardholder''s liability, rounded half up to the cent once at the end: the claimed transfer is the disputed amount less any ATM owner surcharge rebate posted on the claimed transaction, never below zero; the cardholder''s liability is the liability limit less the liability already charged on the same loss, never below zero, or the disputed amount if that is smaller, with a liability limit of liability_cap_timely_usd and nothing already charged; and the amount withheld is the lesser of that liability and liability_cap_timely_usd, the most Regulation E lets be withheld from a provisional credit; the credit is never below zero.'
