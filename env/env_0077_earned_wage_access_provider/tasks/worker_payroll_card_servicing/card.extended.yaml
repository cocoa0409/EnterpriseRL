    y_bd_late: Business days are Monday through Friday excluding Federal Reserve holidays, counted from the day after the earlier date through the later one.
    y_late: 'The late credit allowance follows the business days from the claim''s resolution date to the posting day: more than late_high_business_days business days earns late_high_usd; more than error_correction_business_days business days earns late_low_usd; otherwise nothing.'
    y_foreign: A new-account transaction is one that posted no more than new_account_days calendar days after the account's first deposit date, a point-of-sale transaction is a purchase, and a foreign-initiated transaction is one marked as a foreign transaction.
    y_newacct: A new-account transaction is one that posted no more than new_account_days calendar days after the account's first deposit date, a point-of-sale transaction is a purchase, and a foreign-initiated transaction is one marked as a foreign transaction.
    y_days_inv: 'The investigation allowance credited with a final credit follows the time from the claim''s notice date to its resolution date: when that is more than extended_investigation_days_new_pos_foreign calendar days for a new-account, point-of-sale or foreign-initiated transaction, or more than extended_investigation_calendar_days calendar days for any other transaction, the allowance is investigation_high_usd; when it is not, but is more than new_account_investigation_business_days business days for a new-account transaction or more than investigation_business_days business days for any other transaction, it is investigation_low_usd; otherwise it is nothing.'
    y_bd_inv: Business days are Monday through Friday excluding Federal Reserve holidays, counted from the day after the earlier date through the later one.
    y_inv: 'The investigation allowance credited with a final credit follows the time from the claim''s notice date to its resolution date: when that is more than extended_investigation_days_new_pos_foreign calendar days for a new-account, point-of-sale or foreign-initiated transaction, or more than extended_investigation_calendar_days calendar days for any other transaction, the allowance is investigation_high_usd; when it is not, but is more than new_account_investigation_business_days business days for a new-account transaction or more than investigation_business_days business days for any other transaction, it is investigation_low_usd; otherwise it is nothing.'
    y_n_day_stolen: 'A claim''s report day is its notice date when Paystride ordered a replacement card for a lost or stolen card on the account that day and the claim is the most recently registered claim of its loss first reported that day, the replacement read being the stolen-card order when both a lost-card and a stolen-card replacement were ordered that day, and a day with two replacement orders of the same reason being no report day; the early pay cost credited with a final credit follows the Paystride Access ledger on the claim''s report day: of the worker''s early pay transfers booked that day to an external debit card or to a bank account, Paystride takes the most recently requested one, the transfer to the external debit card when two were requested at the same moment, and for a card replaced as stolen counts the fee booked on it less any Access reversal of that fee, while for a card replaced as lost it counts that fee but no more than the next-business-day bank fee (nbd_fee_bank_usd) of the tier the worker''s Access plan holds on the day the credit is figured, as the plan record shows it; for a claim with no report day, or no such transfer, nothing counts.'
