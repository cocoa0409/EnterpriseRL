    z_reportday: A claim's report day is its notice date when Paystride ordered a replacement card for a lost or stolen card on the account that day and the claim is the most recently registered claim of its loss first reported that day; the replacement read is the stolen-card order when both a lost-card and a stolen-card replacement were ordered that day, and a day with two replacement orders of the same reason is no report day.
    z_repl_fee_id: 'The replacement card fees credited with a final credit follow the replacement ordered on the claim''s report day: for a card replaced as stolen, the replacement fee and the expedited shipping fee charged on that order, less any part of them already returned; for a card replaced as lost, the replacement fee charged on it, less any part already returned, the expedited shipping fee staying the cardholder''s; for a claim with no report day, nothing.'
