    z_exp_net: 'The replacement card fees credited with a final credit follow the replacement ordered on the claim''s report day: for a card replaced as stolen, the replacement fee and the expedited shipping fee charged on that order, less any part of them already returned; for a card replaced as lost, the replacement fee charged on it, less any part already returned, the expedited shipping fee staying the cardholder''s; for a claim with no report day, nothing.'
    z_repl: 'The replacement card fees credited with a final credit follow the replacement ordered on the claim''s report day: for a card replaced as stolen, the replacement fee and the expedited shipping fee charged on that order, less any part of them already returned; for a card replaced as lost, the replacement fee charged on it, less any part already returned, the expedited shipping fee staying the cardholder''s; for a claim with no report day, nothing.'
    z_x_ext: 'The early pay cost credited with a final credit follows the Paystride Access ledger on the claim''s report day: of the worker''s early pay transfers booked that day to an external debit card or to a bank account, Paystride takes the most recently requested one, the transfer to the external debit card when two were requested at the same moment, and for a card replaced as stolen counts the fee booked on it less any Access reversal of that fee, while for a card replaced as lost it counts that fee but no more than the next-business-day bank fee (nbd_fee_bank_usd) of the tier the worker''s Access plan holds on the day the credit is figured, as the plan record shows it; for a claim with no report day, or no such transfer, nothing counts.'
