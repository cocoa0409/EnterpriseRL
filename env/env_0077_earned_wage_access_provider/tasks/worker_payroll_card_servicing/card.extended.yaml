    allowance_low_usd: 4.0
    allowance_high_business_days: 8
  rule: 'This policy is the signed claim schedule for the Advantage plan: it prices the provisional credit that posts when a cardholder whose card is on the Advantage plan signs Paystride''s written claim form confirming a claim about a lost or stolen card that was first reported by phone. The claim it prices is the account''s most recently registered claim of an unauthorized transaction handled under Regulation E error resolution that is under investigation, was first reported by phone and has no written confirmation date; it is priced only when it carries a loss date, carries no provisional credit and is signed no more than written_confirmation_window_business_days business days after its notice date and its loss''s liability limit can be timed as set out below, and otherwise this policy prices nothing and the base rule applies. Business days are Monday through Friday excluding Federal Reserve holidays, counted from the day after the earlier date through the later one. A claim''s loss is the set of the account''s unauthorized-transaction claims carrying its loss date; this policy times the liability limit for an account whose replacement orders placed less than 12 whole months before today include at most one for a lost card and at most one for a stolen card, exactly one of them placed on or after the loss date, and that order''s date is the day the loss was reported, the report being late when it came more than timely_loss_report_business_days business days after the loss date; orders placed 12 or more months before today never count, and under Paystride''s program practice an account with repeated lost or stolen cards within those 12 months is referred to Paystride''s card fraud review team, so this policy books nothing for its claims. The claim form credit is fixed only after every other claim of the same loss whose provisional credit stood above what that claim was due carries its reversal. The claim form credit is the claimed transfer less the amount withheld for the cardholder''s liability, rounded half up to the cent once at the end: the claimed transfer is the disputed amount less any ATM owner surcharge rebate posted on the claimed transaction, never below zero; the cardholder''s liability is the liability limit less the liability already charged on the same loss, never below zero, or the disputed amount if that is smaller, with a liability limit of liability_cap_timely_usd and nothing already charged; and the amount withheld is the lesser of that liability and liability_cap_timely_usd, the most Regulation E lets be withheld from a provisional credit; the credit is never below zero. The adjustments below each either replace a figure of that method or add an amount to the credit; replacements apply first, additions after them, and the credit is rounded half up to the cent once at the end. The liability limit for a signed claim follows the claimed transaction and the loss report: when the claimed transaction is a purchase and the plan applies Visa Zero Liability (visa_zero_liability_applies), the limit is zero; when the loss report was late, the limit is liability_cap_late_usd; otherwise it is liability_cap_timely_usd. The liability already charged on the same loss for a signed claim is counted on the loss''s claims resolved with an error found, each at its disputed amount, before any claim still under investigation: when the loss carries such claims and the report was late, it is the lesser of their total disputed amount and liability_cap_late_usd; when it carries such claims and the report was not late, the lesser of that total and liability_cap_timely_usd; otherwise nothing is already charged. The Paystride fees credited with a signed claim follow the claimed transaction: when Paystride fees were charged on it (an out-of-network ATM fee, an international ATM fee or a foreign transaction fee), they count less any part of them already returned by refund or correction; when it is a withdrawal at a domestic out-of-network ATM that carried no out-of-network ATM fee because it was one of its pay period''s free withdrawals, out_of_network_atm_withdrawal_fee_usd counts for the free withdrawal it used; otherwise nothing counts. The service allowance on a signed claim follows the business days from the claim''s notice date to the signing day: more than allowance_high_business_days business days earns allowance_high_usd; more than provisional_credit_business_days business days earns allowance_low_usd; otherwise nothing. When Paystride cannot complete a Regulation E investigation in time, it may take until extended_investigation_calendar_days calendar days after the notice date, or extended_investigation_days_new_pos_foreign for a new-account, point-of-sale debit card or foreign-initiated transaction, but only by posting a provisional credit within provisional_credit_business_days business days of the notice date (new_account_investigation_business_days for a new-account transaction), of the disputed amount less any cardholder liability under card_unauthorized_liability on every claim that neither this schedule nor the signed claim schedule for the Premier and Elite plans prices; for a signed claim this schedule prices, and only for such a claim, the provisional credit is the claim form credit and posts when the cardholder signs. Otherwise liability is the lesser of the unauthorized amount and liability_cap_timely_usd when the cardholder reported the loss or theft within timely_loss_report_business_days business days after loss_learned_date, and the lesser of the unauthorized amount and liability_cap_late_usd when reported later; unauthorized transfers that posted more than error_notice_window_days calendar days after the history access date and before the report may be the cardholder''s in full; on a claim this schedule prices, and only on such a claim, the loss counts as reported on the date of the account''s single lost or stolen replacement order placed on or after the loss date among its orders of the last 12 months, and no transfer is charged in full, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own. Liability is counted once across all unauthorized transactions from the same loss or theft, applied in posting order; on a claim this schedule prices, and only on such a claim, the liability already charged on the loss is counted on its claims resolved with an error found before any claim still under investigation, whatever their posting order, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own. When an error is found, a provisional credit already posted becomes final with no second credit, and where none was posted, a final credit of the error amount, less any cardholder liability, posts within error_correction_business_days business days, every fee the error caused being returned by a fee correction under card_evt_fee_refunds; for a claim whose provisional credit this schedule priced, and only for such a claim, the fees credited with the claim form credit are not returned again, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own. Without any request, Paystride books a fee correction, with reason fee_charged_in_error, for a fee it finds it assessed in error itself, and, with reason dispute_error, for each fee caused by a transaction that a resolved dispute found to be an error, the request window not limiting corrections; a fee credited within a claim form credit this schedule prices, and only such a fee, is not corrected again, while the other lost or stolen card claim schedules of this charter (the signed claim, claim reversal and final claim credit schedules for the Premier and Elite plans and for the Advantage plan) state their own.'
