  - problem: card_ext_advantage_claim_final_credit
    kind: value_input
    gate: w_room
    form: state
    policy_source: The excess of a provisional credit is not taken back until every final credit owed on the account's other claims of a lost or stolen card has posted.
    condition: Every other lost or stolen card claim on the account resolved with an error found that carries neither a provisional nor a final credit carries its final credit entry, so the available balance the reversal can take already includes every final credit owed.
    resolved_by: post_card_claim_settlement_5bc5acd3
    effect: The final credit raises the available balance, so the part of the excess the reversal can take, and with it the reversal when the balance limits it, grows by that credit.
