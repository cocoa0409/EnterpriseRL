name: env_0078_public_school_district
company: Calloway Creek Independent School District

background: |
  Calloway Creek Independent School District is a Texas public school district of about 14,800 students on ten campuses: Sunflower Early Childhood Center, five elementary schools (Alder Springs, Bluebonnet Trail, Cypress Hollow, Live Oak and Pecan Grove), Hollis and Ridgecrest Middle Schools, and Calloway Creek and Mesquite Ridge High Schools.
  Its Family Services Center answers parents and guardians by phone and chat about every district program a household pays for or relies on, in a plain, patient public-service voice in English and Spanish.
  Each family is one household profile held by a parent or guardian, and each child is a student record linked to it; every program a child takes part in is held as its own record for that child and school year and keeps a running history of charges, payments, credits and notices.
  Student Enrollment, Transfers and Pre-Kindergarten Admissions holds each student's yearly enrollment record on one of seven types: Attendance Zone Enrollment, Intra-District Transfer (Space Available), Intra-District Transfer (Employee Child), Non-Resident Transfer, Choice Program Enrollment, Pre-Kindergarten (State-Eligible) and Pre-Kindergarten (Tuition-Based), the last billed monthly.
  The Creek Kids Club Extended Day Program runs before- and after-school care on six monthly-tuition plans: Creek Kids Club After-School Care (2 Days), Creek Kids Club Before-School Care (5 Days), Creek Kids Club After-School Care (3 Days), Creek Kids Club After-School Care (5 Days), Creek Kids Club Before & After-School Care (5 Days) and Creek Kids Club Pre-K Wraparound Care (5 Days).
  Extended Day enrollments carry registration fees, monthly tuition, booked drop-in and holiday camp days, late pickup and late payment fees, family payments and Workforce Solutions child care remittances.
  School Nutrition Services keeps one prepaid cafeteria meal account per student under the National School Lunch and School Breakfast Programs, and each account holds one meal status: Paid Meal Status, Reduced-Price Meal Status (Prior-Year Carryover), Reduced-Price Meal Status, Free Meal Status (Prior-Year Carryover), Free Meal Status (Household Application), Free Meal Status (Direct Certification) or Free Meal Status (Categorical Eligibility).
  Meal accounts record deposits, every meal and item rung up at the register, voids, refunds, sibling transfers, balance notices and benefit letters.
  Student Transportation Services assigns each rider for the school year under Courtesy Rider Permit (Semester), Courtesy Rider Permit (Annual), Regular Route Eligibility, Hazardous Route Eligibility, Choice Program Hub Shuttle, McKinney-Vento School-of-Origin Transportation or Special Education Transportation, with a route, AM and PM stops, bus passes, a conduct log and, for courtesy riders, permit fees.
  Student Activities, Athletics and Trip Fees covers Campus Club Membership, UIL Academic and Robotics Team, Middle School UIL Athletics, Fine Arts Performing Ensemble, High School UIL Athletics, Cheer and Dance Team and the Grade 5 Outdoor Education Trip, each participation carrying its fees, waivers, participation packet and issued equipment.
  The Student Technology Device Program lends Chromebook Loan (Standard Liability), Chromebook Loan with Technology Protection Plan, iPad Loan with Technology Protection Plan, Windows Laptop Loan (Standard Liability), Windows Laptop Loan with Technology Protection Plan and Mobile Hotspot Loan devices, with plan fees and damage, loss and repair charges.
  The Fine Arts Instrument Usage Program checks out district-owned instruments as Percussion Equipment Usage, Woodwind Instrument Usage, Brass Instrument Usage, Orchestra String Instrument Usage, Large Instrument Usage (Tuba, Cello, String Bass) and Summer Instrument Checkout, with usage fees and late, repair and replacement charges.
  Callers are mostly parents of two or three children spread across an elementary, a middle and a high school, so one household typically holds several enrollment records, meal accounts, a bus assignment or two, an Extended Day enrollment and a few activity participations at once.
  Many households carry a free or reduced-price meal status, some children are on transfers or in choice programs, and some families have moved within or out of the district during the year.
  They call with a history behind them: tuition posted month after month, meals charged on a low balance, a benefit letter or an adverse action notice, a late pickup or a bus referral, a request filed weeks earlier, or a fee charged before a status changed.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: extended_day_care_billing
    claim:
      categories: [care]
      event_types: [care_registration, care_activate, care_waitlist_placement, care_registration_fee, care_tuition_charge, care_day_fee, care_late_pickup, care_late_pickup_fee, care_late_payment_fee, care_payment, care_credit, care_plan_change, care_plan_change_fee, care_withdrawal, care_reinstatement, care_refund]
    summary: >
      Parents call the Family Services Center about Creek Kids Club Extended Day care for one or several children: registering a child or accepting a waitlist offer, changing plans, booking drop-in, holiday camp or early-release days, disputing a tuition amount, asking for a late-fee courtesy credit, getting care resumed after a nonpayment suspension, or withdrawing and asking where a credit balance went.
      The setting varies with the plan held (from Creek Kids Club After-School Care (2 Days) to Creek Kids Club Pre-K Wraparound Care (5 Days)), the enrollment status (registered, waitlisted, active, suspended_nonpayment or closed), the number of the household's children billed in the same month, Workforce Solutions funding, the district employee flag, and history such as earlier returned payments, late pickups already counted this semester or courtesy credits already used.
      The records involved are the care enrollments, their billing ledger and attendance log and the family's care requests, read together with each child's district enrollment record (campus and grade, which gate registration under care_admission) and School Nutrition meal status (which sets the rate basis under care_tuition_rate and the registration fee waiver under care_evt_registration_fee); the amounts come from care_tuition_rate with the sibling order of care_agg_sibling_billing, the day fees of care_evt_day_fees, the late pickup ladder of care_evt_late_pickup and the due-day, late-fee and suspension rules of care_billing_and_late_payment, all per plan wherever the charter varies by tier.
      In the domain's natural order a registration is followed by its registration fee and seat confirmation, then monthly tuition, payments and any credits; plan changes and withdrawals follow the cutoff and notice rules of care_plan_changes and care_withdrawal_and_refunds.
      The agent locates and verifies the household, reads the records, posts the charges, credits and plan changes the rules decide and records the family's requests; accepting an offered waitlist seat and withdrawing a child from care are the family's own commitments and are handed to the caller through user tools.
      Requests no policy decides, such as a tuition reduction for a hardship outside the meal-status and employee rates, a refund of the nonrefundable registration fee, care at a campus or grade the program does not serve, or a dispute about a staff decision to dismiss a child, go to a human representative as POLICY_NOT_COVERED.

  - name: meal_account_and_benefits
    claim:
      categories: [meals]
      event_types: [meals_benefit_increase, meals_benefit_decrease, meals_campus_change, meals_account_reactivate, meals_account_close, meals_deposit, meals_purchase_void, meals_refund, meals_transfer_out, meals_transfer_in, meals_balance_notice, meals_benefit_notice]
    summary: >
      Parents call School Nutrition about their children's cafeteria meal accounts: a negative balance or a balance notice, a charge they believe is wrong, a deposit that did not post or a check that bounced, a meal status that changed after the carryover period or after verification, an approved application that has not reached every child, or moving or refunding money after a child withdraws or graduates.
      The setting varies with each child's meal status (from Paid Meal Status to Free Meal Status (Categorical Eligibility)), the account status, the campus and its pricing level or Community Eligibility Provision coverage, the household's applications and their determinations, and the transaction and notice history on each sibling's account.
      The records involved are meal accounts, their transactions and notices and the household's meal benefit applications, read together with the student record's designations and the district enrollment record whose campus and status drive pricing and reactivation; the governing rules are meals_meal_pricing for charges per status and campus level, meals_unpaid_meal_charges for the charge limits and notices, meals_agg_household_extension and meals_benefit_effective_dates for which status each child holds from which date, meals_purchase_corrections for voids and disputes, meals_deposits_and_returns for deposits, and meals_refunds_and_transfers for refunds, sibling transfers and closure.
      In the domain's natural order an application is determined by School Nutrition before a status change, an adverse action notice precedes a reduction, and a positive balance is refunded or moved before an inactive account closes.
      The agent verifies the household, reads the accounts, applies the status changes, corrections, transfers and refunds the rules decide and records submitted applications without determining them; a refund check to the household and a transfer between siblings' accounts are made on the caller's explicit request, which the agent obtains in the conversation.
      Requests no policy decides, such as waiving unpaid meal charges for a household that does not qualify, determining income eligibility over the phone, refunding a balance below the refund minimum by check, or reversing an approved verification outcome, go to a human representative as POLICY_NOT_COVERED.

  - name: bus_eligibility_and_stops
    claim:
      categories: [transport]
      event_types: [transport_application, transport_approval, transport_denial, transport_stop_assignment, transport_permit_fee, transport_fee_credit, transport_payment, transport_refund, transport_permit_cancellation, transport_eligibility_end, transport_pass_issued, transport_replacement_pass_fee]
    summary: >
      Parents call Student Transportation about bus service: whether a child can ride at all, why an application was denied, which stop a child is assigned to or how to route from a babysitter's address, what a courtesy rider permit costs after a meal-status waiver, a lost bus pass, a riding suspension, a move within the district, or cancelling a permit and getting part of the fee back.
      The setting varies with the transportation type (from Courtesy Rider Permit (Semester) to Special Education Transportation), the measured distance and hazardous zone of the residence, the child's grade, enrollment type and designations, the assignment's status, the household's other permits that school year, and its history of stop changes, passes and conduct referrals.
      The records involved are transportation assignments, their billing ledger and service log and the family's transportation requests, read together with the district enrollment record (whose type decides transportation eligibility under transport_eligibility_basis), the student record's homeless and IEP designations and the School Nutrition meal status that drives the fee waivers of transport_evt_permit_fee; amounts and limits come from transport_evt_permit_fee, transport_agg_household_permit_cap, transport_bus_pass, transport_stop_assignment_rules and transport_cancellation_and_refunds, per transportation type where the charter varies by tier.
      In the domain's natural order an application is decided before a route and stops are assigned, a courtesy permit fee is settled before riding starts, and a cancellation or end of service precedes any credit or refund.
      The agent verifies the household, reads the records, decides and records eligibility, stop assignments, fees, credits and passes as the rules state; cancelling a courtesy rider permit is the family's own decision and is handed to the caller through a user tool.
      Requests no policy decides, such as a new stop location the routing standards do not allow, an exception to the two-mile distance for a reason other than a board-approved hazardous zone, transportation for a transfer student, or disputing a driver's conduct referral, go to a human representative as POLICY_NOT_COVERED.

  - name: activity_fees_and_waivers
    claim:
      categories: [activity]
      event_types: [activity_registration, activity_fee, activity_fee_credit, activity_clearance, activity_payment, activity_registration_cancel, activity_withdrawal, activity_refund, activity_equipment_charge, activity_document_received, activity_equipment_returned]
    summary: >
      Parents call about their children's clubs, UIL teams, ensembles, cheer and dance, and the Grade 5 Outdoor Education Trip: registering and asking what is owed after a fee waiver, why a child is not yet cleared to practice, whether the household fee cap has been reached, what comes back after a child is cut, quits, is injured or cancels a trip, a charge for an unreturned uniform, or setting up installments.
      The setting varies with the activity type (from Campus Club Membership to Cheer and Dance Team), the season and grade, the participation status, the meal status of each child on the day each fee posted, the household's other participations that school year, the documents already on file, and whether the child's campus changed through a transfer.
      The records involved are activity participations, their fee ledger and participation records log, read together with the School Nutrition meal status (activity_evt_fees) and the district enrollment record (activity_clearance_requirements); the amounts and conditions come from activity_evt_fees, activity_agg_household_fee_cap, activity_refund_credits, activity_equipment, activity_payments_and_installments and activity_trip_rules, per activity type wherever the charter varies by tier.
      In the domain's natural order a registration posts its fees and waivers, the packet and fees are completed before clearance, and a cut, withdrawal, cancellation or season end precedes any credit, equipment charge or refund.
      The agent verifies the household, reads the records, posts the fees, waivers, credits and equipment charges the rules decide and clears a student whose packet and fees are complete; cancelling a registration or withdrawing a child from an activity is the family's own decision and is handed to the caller through a user tool.
      Requests no policy decides, such as waiving a fee for a household without a qualifying meal status, refunding a uniform package after clearance, overriding a UIL academic or transfer eligibility determination, or a complaint about a coach's roster decision, go to a human representative as POLICY_NOT_COVERED.

  - name: transfers_and_enrollment_changes
    claim:
      categories: [enroll]
      event_types: [enroll_registration, enroll_verification_complete, enroll_document_received, enroll_transfer_placement, enroll_withdrawal, enroll_prek_eligibility_change, enroll_tuition_charge, enroll_tuition_late_fee, enroll_tuition_payment, enroll_tuition_credit, enroll_tuition_refund]
    summary: >
      Parents call the registrar's line about enrolling a child, finishing a provisional registration, accepting or asking about a transfer or choice program decision, a transfer revocation notice, Pre-K eligibility and tuition, moving a tuition-based Pre-K child to state-eligible Pre-K, or withdrawing a child who is moving away.
      The setting varies with the enrollment type (from Attendance Zone Enrollment to Pre-Kindergarten (Tuition-Based)), the record's status, the household's residence and employee flags, the student's grade, age and designations, the transfer requests on file with their decisions and dates, and the Pre-K tuition history of the household's children.
      The records involved are enrollment records, the registration documents log, transfer requests and the Pre-K tuition ledger, read together with the household profile and the student record and with the School Nutrition meal status that can establish Pre-K eligibility; the rules are enroll_registration_and_residency for provisional registrations and documents, enroll_transfer_requests and enroll_transfer_effects for windows, decisions, acceptance and what a placement changes, enroll_transfer_revocation_rules, enroll_prek_admission, enroll_prek_tuition with enroll_agg_tuition_siblings, enroll_tuition_payments_and_refunds and enroll_withdrawal_and_year_end, per enrollment type wherever the charter varies by tier.
      In the domain's natural order a registration is provisional until its documents are on file, a transfer decision precedes the family's acceptance and the placement, eligibility is on file before Pre-K tuition stops, and a withdrawal closes the student's other district programs on the same date.
      The agent verifies the household, reads the records, logs documents, applies placements, eligibility changes, tuition charges and credits as the rules decide; signing the district withdrawal form is the parent's own act and is handed to the caller through a user tool.
      Requests no policy decides, such as a transfer to a campus closed to transfers, a request outside every window, enrolling a child who does not meet the Pre-K age cutoff, or appealing a principal's revocation decision, go to a human representative as POLICY_NOT_COVERED.
