# Student activities, athletics and trip fees with fee waivers — Calloway Creek ISD.
category: activity
display_name: Student Activities, Athletics and Trip Fees

binding:
  holding_table: activity_participations
  event_tables: [activity_ledger, activity_records_log]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [registered, cleared, academically_ineligible, withdrawn, cut, completed]
  transitions:
    - {from: registered, to: cleared, by: agent, means: "The participation packet is complete and the fees are settled or on a current installment plan, so the student may practice, try out, perform or travel."}
    - {from: registered, to: withdrawn, by: user, means: "The family cancels the registration before the student is cleared."}
    - {from: cleared, to: academically_ineligible, by: system, means: "The student is ineligible under the academic eligibility rule after a grading period or progress check."}
    - {from: academically_ineligible, to: cleared, by: system, means: "The student regains academic eligibility at a later grade check."}
    - {from: cleared, to: withdrawn, by: user, means: "The family withdraws the student from the activity after clearance."}
    - {from: cleared, to: cut, by: system, means: "The student is not selected at tryouts for a team that holds tryouts."}
    - {from: cleared, to: completed, by: system, means: "The season, school year or trip ends with the student on the roster."}
    - {from: academically_ineligible, to: completed, by: system, means: "The season ends while the student is academically ineligible."}

accounts:
  - key: activity_fees_due
    unit: USD
    meaning: "Amount the household owes on one activity participation; fees, equipment charges and refunds disbursed increase it, payments and credits decrease it; a negative value is a credit owed to the family."

parameter_schema:
  program_type: "Kind of program; enum club | academic_competition | athletics | fine_arts | spirit | field_trip."
  governing_body: "Body whose eligibility rules apply; enum campus | uil."
  eligible_grades: "Grades admitted; list of grade codes."
  offered_campus_levels: "Campus levels where the program runs; list of enum elementary | middle | high."
  activity_names: "Activities registered under the type; list of activity codes."
  participation_fee: "Participation fee per activity for the fee_basis period, USD."
  fee_basis: "Period one participation fee covers; enum per_activity_per_school_year | per_activity_per_season | per_trip."
  travel_fee: "Overnight competition or performance travel fee per participation, USD; 0.00 where none."
  uniform_package_fee: "Student-kept apparel package charged per participation, USD; 0.00 where none."
  uniform_package_waivable: "Whether the uniform package is reduced by meal-status fee waivers; boolean."
  trip_deposit: "Deposit portion of a trip fee posted at registration, USD; 0.00 where not a trip."
  trip_balance_fee: "Remaining trip fee posted on the trip balance posting date, USD; 0.00 where not a trip."
  trip_balance_due_days_before_departure: "Days before departure by which the trip balance must be settled; integer, 0 where not a trip."
  trip_deposit_refundable_until_days_before: "Days before departure up to which a cancellation credits the trip deposit; integer, 0 where not a trip."
  free_meal_waiver_pct: "Share of each waivable fee waived for a student holding any Free Meal Status tier, percent."
  reduced_meal_waiver_pct: "Share of each waivable fee waived for a student holding any Reduced-Price Meal Status tier, percent."
  household_annual_fee_cap: "Maximum participation fees charged to one household per school year after waivers, USD; travel, uniform, trip and late fees do not count."
  fee_due_days: "Calendar days after a fee posts within which it must be settled, the posting date being day 0; integer."
  installment_plan_available: "Whether fees above the installment threshold may be paid in installments; boolean."
  installment_count: "Number of monthly installments in the plan; integer, 1 where no plan."
  installment_threshold: "Smallest total of fees on the participation for which the installment plan is offered, USD."
  late_registration_fee: "Fee for a registration received after the registration deadline, USD."
  registration_deadline_days_before_start: "Days before the first practice or event date after which a registration is late; integer."
  season_start_dates: "First practice or event date per season; mapping season -> MM-DD of the school year."
  max_activities_per_season: "Most participations of this type a student may hold in one season; integer."
  physical_exam_required: "Whether a pre-participation physical examination must be on file; boolean."
  physical_required_grades: "Grades for which a new physical examination is required for the school year; list of grade codes (other grades need only the annual medical history form)."
  physical_exam_earliest_date: "Earliest exam date that counts for the school year, MM-DD of the calendar year the school year starts."
  required_forms: "Forms that must be on file for the school year; list of enum medical_history | concussion_acknowledgment | sudden_cardiac_arrest_awareness | steroid_acknowledgment | parent_permission | code_of_conduct | overnight_travel_permission."
  steroid_form_grades: "Grades for which the UIL steroid acknowledgment is required; list of grade codes."
  academic_eligibility_rule: "Academic rule that applies; enum uil_no_pass_no_play | none."
  ineligibility_grace_days: "Calendar days after the end of a grading period before a failing grade makes the student ineligible; integer."
  ineligibility_minimum_school_weeks: "Minimum school weeks of ineligibility before a progress check can restore eligibility; integer."
  transfer_varsity_wait_days: "Calendar days a student whose campus changed through a transfer without a bona fide residence move must wait for varsity eligibility, counted from the first day of attendance at the new campus; integer, 0 where not applicable."
  tryout_required: "Whether roster spots are decided by tryouts; boolean."
  cut_credit_pct: "Share of the waivable fees net of waivers credited when the student is cut at tryouts, percent."
  withdrawal_credit_window_days: "Calendar days after clearance within which a family withdrawal credits the participation fee, the clearance date being day 0; integer."
  withdrawal_credit_pct: "Share of the participation fee net of waivers credited for a withdrawal inside the window, percent."
  injury_credit_pct: "Share of the participation fee net of waivers credited for a season-ending injury documented by a physician before the season midpoint, percent."
  equipment_issued: "Whether district equipment or uniforms are issued for the activity; boolean."
  equipment_return_days: "Calendar days after the participation closes within which issued equipment must be returned, the closing date being day 0; integer."
  equipment_replacement_charge: "Charge per unreturned issued equipment item, USD; 0.00 where no equipment is issued."
  parent_meeting_required: "Whether a parent must attend the program's preseason meeting before clearance; boolean."
  random_drug_testing_consent: "Whether the district random drug testing consent is part of the required forms; boolean."
  district_transportation_to_events: "Whether the district transports participants to contests, performances or the trip; boolean."
  accepted_payment_methods: "Payment methods accepted; list of enum online_card | ach_bank_draft | personal_check | money_order."
  credit_balance_refund_days: "Calendar days after a participation closes within which a credit balance is refunded; integer."
  grade_check_period: "Grading period used for academic eligibility; enum nine_week_grading_period | not_applicable."

