    meaning: "A family registers one student for one Creek Kids Club plan at one campus for one school year."
    grain: "One row per student per plan registration for a school year."
    fields:
      customer_id: "Household that registers the student."
      student_id: "Student being registered."
      variant_name: "Official name of the plan chosen."
      campus: "Campus where care will be provided; the campus the student attends."
      school_year: "School year of the registration, YYYY-YY."
      registration_date: "Date the registration was received."
      start_date: "Requested first day of care."
      subsidy_payer: "Third-party funder named on the registration (workforce_solutions_ccs) or none."
    triggers:
      - event: care:care_registration_fee
        map: {school_year: school_year, posted_date: registration_date}
  - type: care_activate
    target: care_enrollments
    mutation: {transition: {from: registered, to: active}}
    meaning: "The program office confirms the seat after the registration fee is settled, and care begins on the start date."
    grain: "One row per transaction."
    fields:
      start_date: "First day of care, confirmed."
    triggers:
      - event: care:care_tuition_charge
        map: {}
  - type: care_waitlist
    target: care_enrollments
    mutation: {transition: {from: registered, to: waitlisted}}
    meaning: "A registration is placed on the campus waitlist because the plan is at capacity."
    grain: "One row per transaction."
    fields:
      waitlist_date: "Date the registration joined the waitlist."
    triggers: []
  - type: care_waitlist_placement
    target: care_enrollments
    mutation: {transition: {from: waitlisted, to: active}}
    meaning: "The family accepts an offered seat and the waitlisted student starts care."
    grain: "One row per transaction."
    fields:
      start_date: "First day of care after the accepted offer."
    triggers:
      - event: care:care_tuition_charge
        map: {}
  - type: care_waitlist_release
    target: care_enrollments
    mutation: {transition: {from: waitlisted, to: withdrawn}}
    meaning: "A waitlist entry is released after the family declines an offered seat or the response window lapses."
    grain: "One row per transaction."
    fields:
      end_date: "Date the waitlist entry was released."
    triggers: []
  - type: care_suspension
    target: care_enrollments
    mutation: {transition: {from: active, to: suspended_nonpayment}}
    meaning: "Care is suspended for an unpaid past-due tuition balance."
    grain: "One row per transaction."
    fields:
      suspended_date: "Date care was suspended."
    triggers: []
  - type: care_reinstatement
    target: care_enrollments
    mutation: {transition: {from: suspended_nonpayment, to: active}}
    meaning: "A suspended enrollment resumes after the past-due balance is paid."
    grain: "One row per transaction."
    fields:
      suspended_date: "Cleared to empty when care resumes."
    triggers: []
  - type: care_nonpayment_withdrawal
    target: care_enrollments
    mutation: {transition: {from: suspended_nonpayment, to: withdrawn}}
    meaning: "A suspended enrollment that is still unpaid is withdrawn by the program office."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of the enrollment."
    triggers: []
  - type: care_withdrawal
    target: care_enrollments
    mutation: {transition: {from: active, to: withdrawn}}
    meaning: "The family withdraws the student from Extended Day by written notice."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of care, which is the notice's requested last day or the end of the notice period, whichever is later."
    triggers: []
  - type: care_dismissal
    target: care_enrollments
    mutation: {transition: {from: active, to: dismissed}}
    meaning: "The program director dismisses the student after the semester's late-pickup dismissal threshold is reached."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of care."
    triggers: []
  - type: care_program_end
    target: care_enrollments
    mutation: {transition: {from: active, to: ended}}
    meaning: "Care ends because the school year closed or the student withdrew from the district."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of care."
    triggers: []
  - type: care_plan_change
    target: care_enrollments
    mutation: update
    meaning: "An approved request moves the enrollment to another Creek Kids Club plan from the first day of a billing month."
    grain: "One row per approved plan change."
    fields:
      variant_name: "Official name of the new plan."
      plan_change_effective_date: "First day of the billing month from which the new plan applies, YYYY-MM-01."
    triggers:
      - event: care:care_plan_change_fee
        map: {}
  - type: care_registration_fee
    target: care_ledger
    meaning: "The annual registration fee is posted for the enrollment."
    grain: "One row per enrollment per school year."
    distinguish_by: [school_year]
    fields:
      amount: "Registration fee posted, positive USD."
      posted_date: "Date the fee posted, the registration date."
      school_year: "School year the fee covers."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_tuition_charge
    target: care_ledger
    meaning: "One billing month's tuition is posted for the enrollment."
    grain: "One row per enrollment per billing month."
    distinguish_by: [billing_month]
    fields:
      amount: "Tuition charged for the month after rate basis, sibling position and proration, positive USD."
      posted_date: "Date the tuition posted."
      billing_month: "Billing month, YYYY-MM."
      rate_basis: "Rate basis applied: standard_rate, reduced_meal_rate, free_meal_rate or employee_rate."
      sibling_position: "Position of this child in the household's billing order for the month: 1 full rate, 2 second child, 3 third or later child."
      proration: "full_month, or half_month for a first month that starts on or after the half-month start day."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_day_fee
    target: care_ledger
    meaning: "A booked drop-in day, holiday camp day or early-release afternoon outside the plan's coverage is charged."
    grain: "One row per enrollment per service date per day type."
    distinguish_by: [service_date, day_type]
    fields:
      amount: "Day fee charged, positive USD."
      posted_date: "Date the booking was posted."
      service_date: "Date care is provided."
      day_type: "drop_in_day, holiday_camp_day or early_release_day."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_late_pickup_fee
    target: care_ledger
    meaning: "The late pickup fee for one chargeable late pickup is posted."
    grain: "One row per chargeable late pickup (one per service date)."
    distinguish_by: [service_date]
    fields:
      amount: "Late pickup fee, positive USD."
      posted_date: "Date the fee posted."
      service_date: "Date of the late pickup."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_late_payment_fee
    target: care_ledger
    meaning: "The monthly late payment fee is posted because a billing month's tuition was not paid in full by the due day."
    grain: "One row per enrollment per billing month."
    distinguish_by: [billing_month]
    fields:
      amount: "Late payment fee, positive USD."
      posted_date: "Date the fee posted."
      billing_month: "Billing month whose tuition was late, YYYY-MM."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_plan_change_fee
    target: care_ledger
    meaning: "The processing fee for an approved plan change is posted."
    grain: "One row per approved plan change, keyed by the month the change takes effect."
    distinguish_by: [billing_month]
    fields:
      amount: "Plan change fee, positive USD."
      posted_date: "Date the fee posted."
      billing_month: "Billing month in which the plan change takes effect, YYYY-MM."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_payment
    target: care_ledger
    meaning: "A family payment is applied to the enrollment."
    grain: "One row per payment confirmation."
    distinguish_by: [payment_reference]
    fields:
      amount: "Payment amount, positive USD."
      posted_date: "Date the payment posted."
      payment_method: "online_card, ach_bank_draft, personal_check or money_order."
      payment_reference: "Payment confirmation number exactly as issued by the payment portal or written on the receipt."
    account: care_balance_due
    direction: out
    triggers: []
  - type: care_subsidy_remittance
    target: care_ledger
    meaning: "A Workforce Solutions Child Care Services remittance for one billing month is applied to a CCS-funded enrollment."
    grain: "One row per enrollment per billing month remitted."
    distinguish_by: [billing_month]
    fields:
      amount: "Board remittance, positive USD."
      posted_date: "Date the remittance posted."
      billing_month: "Billing month the remittance covers, YYYY-MM."
      subsidy_payer: "workforce_solutions_ccs."
    account: care_balance_due
    direction: out
    triggers: []
  - type: care_credit
    target: care_ledger
    meaning: "A credit reduces one specific earlier charge on the enrollment (fee waiver, household cap, courtesy waiver, short-notice withdrawal adjustment or billing correction)."
    grain: "One row per credited source charge per credit reason."
    distinguish_by: [source_care_ledger_id, credit_reason]
    fields:
      amount: "Credit amount, positive USD, never more than the source charge."
      posted_date: "Date the credit posted."
      credit_reason: "registration_fee_meal_waiver, registration_fee_household_cap, late_fee_courtesy_waiver, notice_period_adjustment or billing_correction."
      source_care_ledger_id: "Reference of the charge being credited."
    account: care_balance_due
    direction: out
    triggers: []
  - type: care_returned_payment
    target: care_ledger
    meaning: "A family payment is returned unpaid by the bank and its amount is restored to the balance."
    grain: "One row per returned payment."
    distinguish_by: [source_care_ledger_id]
    fields:
      amount: "Returned payment amount, positive USD equal to the original payment."
      posted_date: "Date the return posted."
      source_care_ledger_id: "Reference of the original payment that was returned."
    account: care_balance_due
    direction: in
    triggers:
      - event: care:care_returned_payment_fee
        map: {source_care_ledger_id: source_care_ledger_id, posted_date: posted_date}
  - type: care_returned_payment_fee
    target: care_ledger
    meaning: "The returned payment fee is posted for one returned payment."
    grain: "One row per returned payment."
    distinguish_by: [source_care_ledger_id]
    fields:
      amount: "Returned payment fee, positive USD."
      posted_date: "Date the fee posted."
      source_care_ledger_id: "Reference of the original payment that was returned."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_refund
    target: care_ledger
    meaning: "A credit balance on a closed enrollment is refunded to the family by district check."
    grain: "One row per refund issued."
    distinguish_by: [posted_date]
    fields:
      amount: "Refund amount, positive USD, equal to the credit balance refunded."
      posted_date: "Date the refund was issued."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_late_pickup
    target: care_attendance_log
    meaning: "Staff record a pickup after the close time plus the grace period."
    grain: "One row per late pickup (one per service date)."
    distinguish_by: [service_date]
    fields:
      service_date: "Date of the late pickup."
      minutes_late: "Whole minutes between the close time and the sign-out time."
      fee_status: "chargeable, or waived_first_incident for the first late pickup of a semester under a plan that waives it."
      semester: "fall (August 1 - December 31) or spring (January 1 - June 30)."
    triggers:
      - event: care:care_late_pickup_fee
        when: {fee_status: chargeable}
        map: {service_date: service_date}
  - type: care_late_pickup_warning
    target: care_attendance_log
    meaning: "The program director issues the written late-pickup warning for the semester."
    grain: "One row per enrollment per semester."
    distinguish_by: [semester]
    fields:
      service_date: "Date the warning letter was issued."
      semester: "Semester the warning covers."
    triggers: []
  - type: care_funding_change
    target: care_enrollments
    mutation: update
    meaning: "The program office records that a Workforce Solutions Child Care Services authorization started or ended for the enrollment."
    grain: "One row per funding change."
    fields:
      subsidy_payer: "workforce_solutions_ccs when an authorization starts, none when it ends."
    triggers: []

measures:
  - id: care_msr_late_pickups_semester
    window: "The semester containing the service date: fall is August 1 - December 31, spring is January 1 - June 30."
    measure: "Count of care_late_pickup rows on the enrollment with that semester value, whatever their fee_status."
  - id: care_msr_drop_in_days_month
    window: "The calendar month containing the requested service date."
    measure: "Count of care_day_fee rows with day_type drop_in_day on the enrollment whose service_date falls in that month, not counting rows offset by a billing_correction credit."
  - id: care_msr_late_fee_waivers_year
    window: "The school year, July 1 - June 30, containing the request date."
    measure: "Count of care_credit rows with credit_reason late_fee_courtesy_waiver on the enrollment whose posted_date falls in that school year."
  - id: care_msr_plan_changes_semester
    window: "The semester (fall August 1 - December 31, spring January 1 - June 30) containing the month the requested change would take effect."
    measure: "Count of care_plan_change_fee rows on the enrollment whose billing_month falls in that semester."
  - id: care_msr_returned_payments_lookback
    window: "The certified_funds_lookback_months calendar months ending on the payment date, counted back to the same day of the month."
    measure: "Count of care_returned_payment rows across all of the household's Creek Kids Club enrollments whose posted_date falls in the window."
  - id: care_msr_household_registration_fees_year
    window: "The school year of the registration being charged."
    measure: "Sum of care_registration_fee amounts on the household's other Creek Kids Club enrollments of that school year registered earlier, less the care_credit amounts with credit_reason registration_fee_meal_waiver or registration_fee_household_cap posted against those fees."

policies:
  - id: care_agg_multi_holding
    subject: [care_registration]
    rule: >-
      A household may hold Creek Kids Club enrollments for any number of its students, and each enrollment covers one student.
      Registration is accepted only when the student has no other Creek Kids Club enrollment for the same school year in status registered, waitlisted, active or suspended_nonpayment.
      A student who needs a different plan keeps the existing enrollment and moves through a plan change; a second registration is never opened for the same student and school year.
      Enrollments closed as withdrawn, dismissed or ended do not count, so a withdrawn student may register again for the same school year, subject to every admission rule.
    eligibility:
      - id: one_open_enrollment_per_student
        applies_to: [care_registration]
        kind: dedup
        condition: "Registration is accepted only when the student has no other Creek Kids Club enrollment for the same school year in status registered, waitlisted, active or suspended_nonpayment."
        evidence_fields: [care_enrollments.student_id, care_enrollments.school_year, care_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.student_id, care_enrollments.school_year]
          action_bindings:
            care_enrollments.student_id: student_id
            care_enrollments.school_year: school_year
        dedup_contract:
          table: care_enrollments
          mode: separate_record
          object_bindings: {student_id: student_id, school_year: school_year}
          duplicate_filters: {status: [registered, waitlisted, active, suspended_nonpayment]}
          distinct_fields: []
    params:
      max_per_customer: null
      max_open_enrollments_per_student_per_school_year: 1

  - id: care_agg_sibling_billing
    subject: [care_tuition_charge]
    rule: >-
      Sibling discounts are computed across the household's portfolio each billing month.
      The children counted are the household's students whose Creek Kids Club enrollments receive a tuition charge for that billing month (status active or suspended_nonpayment on the posting date); an enrollment funded through Workforce Solutions Child Care Services is left out of the count when its plan's sibling_discount_with_subsidy is false.
      The counted children are ordered by the standard monthly_tuition of each child's plan, highest first, before any rate-basis discount; ties are broken by the earlier registration_date and then by the earlier start_date.
      The first child is sibling position 1 and pays the full rate, the second child is position 2 and receives second_child_sibling_discount_pct, and every later child is position 3 and receives third_plus_child_sibling_discount_pct.
      A household with one counted child has no sibling discount, and an enrollment that leaves the count changes the positions only from the next billing month posted.
    eligibility: []

  - id: care_tuition_rate
    subject: [care_tuition_charge]
    rule: >-
      Each billing month's tuition posts on tuition_posting_day for every enrollment in status active or suspended_nonpayment, and the first month's tuition (the billing month of the start_date) posts on the day the seat is confirmed.
      Tuition charges post only to an enrollment in status active or suspended_nonpayment.
      The starting point is the plan's monthly_tuition.
      The rate basis is decided once per billing month from the records on the posting date: free_meal_rate when the student's School Nutrition meal account holds any Free Meal Status tier (Prior-Year Carryover included), reduced_meal_rate when it holds any Reduced-Price Meal Status tier, employee_rate when the household profile is flagged as a district employee household, and standard_rate otherwise; when more than one applies, the rate basis with the largest discount is used, and rate-basis discounts never add together.
      The sibling discount of the child's sibling position (care_agg_sibling_billing) then applies to the rate-basis amount.
      A first month whose start_date falls on or after half_month_start_day is billed at half_month_rate_pct of the discounted amount (proration half_month); every other month is a full month, including a month in which care ends.
      The amount is rounded to the nearest cent, half a cent rounding up.
      A School Nutrition status change recorded during a month affects the next posting, never a tuition charge already posted; a plan change is billed at the new plan's monthly_tuition from the billing month of its plan_change_effective_date.
      An enrollment funded through Workforce Solutions Child Care Services is billed as care_subsidy_funding states.
    eligibility:
      - id: tuition_posts_to_open_seat
        applies_to: [care_tuition_charge]
        kind: state
        condition: "Tuition charges post only to an enrollment in status active or suspended_nonpayment."
        evidence_fields: [care_enrollments.status, care_enrollments.care_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.care_enrollment_id]
          action_bindings:
            care_enrollments.care_enrollment_id: care_enrollment_id
        state_contract:
          field: care_enrollments.status
          allowed: [active, suspended_nonpayment]
    params:
      per_tier:
        "Creek Kids Club After-School Care (2 Days)": {monthly_tuition: "=monthly_tuition"}
        "Creek Kids Club Before-School Care (5 Days)": {monthly_tuition: "=monthly_tuition"}
        "Creek Kids Club After-School Care (3 Days)": {monthly_tuition: "=monthly_tuition"}
        "Creek Kids Club After-School Care (5 Days)": {monthly_tuition: "=monthly_tuition"}
        "Creek Kids Club Before & After-School Care (5 Days)": {monthly_tuition: "=monthly_tuition"}
        "Creek Kids Club Pre-K Wraparound Care (5 Days)": {monthly_tuition: "=monthly_tuition"}
    formula:
      rate_discount_pct: "free_meal_rate_discount_pct if rate_basis == 'free_meal_rate' else (reduced_meal_rate_discount_pct if rate_basis == 'reduced_meal_rate' else (employee_rate_discount_pct if rate_basis == 'employee_rate' else 0))"
      sibling_pct: "second_child_sibling_discount_pct if sibling_position == 2 else (third_plus_child_sibling_discount_pct if sibling_position == 3 else 0)"
      proration_pct: "half_month_rate_pct if proration == 'half_month' else 100"
      amount: "round(monthly_tuition * (1 - rate_discount_pct / 100) * (1 - sibling_pct / 100) * proration_pct / 100, 2)"

  - id: care_subsidy_funding
    subject: [care_registration, care_subsidy_remittance, care_tuition_charge, care_funding_change]
    rule: >-
      An enrollment whose subsidy_payer is workforce_solutions_ccs is funded through Workforce Solutions Child Care Services; every plan whose subsidy_accepted is true takes such funding.
      A CCS-funded enrollment is billed on the subsidy_billing_basis: its tuition charge always uses rate_basis standard_rate, because meal-status and employee rates do not combine with CCS funding, and the sibling discount applies only when the plan's sibling_discount_with_subsidy is true.
      Each board remittance posts as one care_subsidy_remittance for the billing month it covers, and the household owes the rest of that month's charges, which is billed, made late and suspended like any other balance.
      When the program office records that the authorization has ended, subsidy_payer becomes none and the household's own rate basis and sibling position apply from the next billing month posted after the change; a remittance that arrives later for a month the authorization covered still posts to that month.
    eligibility: []

  - id: care_admission
    subject: [care_registration, care_activate, care_waitlist, care_waitlist_placement, care_waitlist_release]
    rule: >-
      Registration is open to a student whose current district enrollment record is in status enrolled at a campus in the plan's offered_campuses, and the Creek Kids Club enrollment's campus is that same campus.
      The student's current district enrollment record must show grade level PK3, PK4, KG, 01, 02, 03, 04 or 05.
      Within that range the chosen plan's eligible_grades decides which plans the student may hold.
      Registration is not accepted while any of the household's Creek Kids Club enrollments from an earlier school year still carries a balance above zero.
      A registration is waitlisted when the plan at the campus is at capacity on the registration date; capacity is managed by the program office, and waitlisted registrations are offered seats in registration_date order.
      The seat of a registration in status registered is confirmed only once the registration fee for that enrollment is settled, meaning the registration fee charge is fully offset by registration-fee credits and payments on the enrollment.
      A waitlisted family may accept an offered seat only within waitlist_offer_response_days after the program office offers the seat, counted in calendar days with the offer date as day 0, and a seat accepted on the last day of the window is still accepted.
      An offer not accepted in that window is released and the next registration on the list is offered; placement from the waitlist does not charge the registration fee again.
    eligibility:
      - id: district_enrollment_at_campus
        applies_to: [care_registration]
        kind: state
        condition: "Registration is open to a student whose current district enrollment record is in status enrolled at a campus in the plan's offered_campuses, and the Creek Kids Club enrollment's campus is that same campus."
        evidence_fields: [enrollments.status, enrollments.campus, enrollments.student_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.student_id]
          action_bindings:
            enrollments.student_id: student_id
        state_contract:
          field: enrollments.status
          allowed: [enrolled]
      - id: grade_in_program_range
        applies_to: [care_registration]
        kind: state
        condition: "The student's current district enrollment record must show grade level PK3, PK4, KG, 01, 02, 03, 04 or 05."
        evidence_fields: [enrollments.grade_level, enrollments.student_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.student_id]
          action_bindings:
            enrollments.student_id: student_id
        state_contract:
          field: enrollments.grade_level
          allowed: [PK3, PK4, KG, "01", "02", "03", "04", "05"]
      - id: no_prior_year_balance
        applies_to: [care_registration]
        kind: authorization
        condition: "Registration is not accepted while any of the household's Creek Kids Club enrollments from an earlier school year still carries a balance above zero."
        evidence_fields: [care_enrollments.customer_id, care_enrollments.school_year, care_ledger.care_enrollment_id, care_ledger.event_type, care_ledger.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.customer_id]
          action_bindings:
            care_enrollments.customer_id: customer_id
      - id: registration_fee_settled
        applies_to: [care_activate]
        kind: authorization
        condition: "The seat of a registration in status registered is confirmed only once the registration fee for that enrollment is settled, meaning the registration fee charge is fully offset by registration-fee credits and payments on the enrollment."
        evidence_fields: [care_ledger.care_enrollment_id, care_ledger.event_type, care_ledger.amount, care_ledger.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_ledger.care_enrollment_id]
          action_bindings:
            care_ledger.care_enrollment_id: care_enrollment_id
      - id: offer_response_window
        applies_to: [care_waitlist_placement]
        kind: time
        condition: "A waitlisted family may accept an offered seat only within waitlist_offer_response_days after the program office offers the seat, counted in calendar days with the offer date as day 0, and a seat accepted on the last day of the window is still accepted."
        evidence_fields: [care_enrollments.waitlist_offer_date, care_enrollments.care_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.care_enrollment_id]
          action_bindings:
            care_enrollments.care_enrollment_id: care_enrollment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the program office offers the seat"
          anchor_source: care_enrollments.waitlist_offer_date
          relation: not_after
          duration_source: variants.waitlist_offer_response_days
          unit: calendar_days
          counting_rule: "counted in calendar days with the offer date as day 0"
          boundary: inclusive
    params:
      per_tier:
        "Creek Kids Club After-School Care (2 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}
        "Creek Kids Club Before-School Care (5 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}
        "Creek Kids Club After-School Care (3 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}
        "Creek Kids Club After-School Care (5 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}
        "Creek Kids Club Before & After-School Care (5 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}
        "Creek Kids Club Pre-K Wraparound Care (5 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}

  - id: care_evt_registration_fee
    subject: [care_registration_fee, care_credit]
    rule: >-
      The registration fee posts at registration_fee_per_child on the registration date of every new registration, once per enrollment per school year.
      The fee is nonrefundable once posted: it is never credited because of a withdrawal, a waitlist release, a dismissal or the end of the program.
      Two credits may offset it on the day it posts, and no other credit reason applies to it.
      When the plan's registration_fee_waived_for_free_meal_status is true and the student's School Nutrition meal account holds any Free Meal Status tier on the registration date, the full fee is credited with credit_reason registration_fee_meal_waiver; a Reduced-Price Meal Status does not waive the fee.
      Otherwise, when the registration fees already charged to the household's other enrollments of the same school year, net of their registration-fee credits (care_msr_household_registration_fees_year), plus this fee exceed registration_fee_household_cap, the excess is credited with credit_reason registration_fee_household_cap.
      The household cap is computed from enrollments registered earlier; a later registration never changes a credit already posted on an earlier one.
    eligibility: []
    measures: [care_msr_household_registration_fees_year]
    formula:
      amount: "registration_fee_per_child"
      cap_credit: "max(0, care_msr_household_registration_fees_year + registration_fee_per_child - registration_fee_household_cap)"

  - id: care_evt_day_fees
    subject: [care_day_fee, care_credit]
    rule: >-
      Day fees are charged only on an enrollment in status active.
      A drop-in day may be booked only on a plan whose drop_in_days_allowed is true, for a weekday the plan's schedule does not already cover, at least drop_in_booking_lead_days calendar days before the service date, and for no more than drop_in_days_monthly_cap drop-in days per enrollment in one calendar month (care_msr_drop_in_days_month); each drop-in day is charged drop_in_day_fee.
      A holiday camp day may be booked only on a plan whose holiday_camp_access is true and is charged holiday_camp_day_fee.
      An early-release afternoon is covered without any fee when the plan's early_release_included is true; otherwise a booked early-release afternoon is charged early_release_day_fee.
      A booked day the family does not use is still charged; a day on which the district closes campuses is not charged, and a fee already posted for it is credited in full with credit_reason billing_correction.
      Day fees are not discounted by rate basis or sibling position.
    eligibility:
      - id: day_fee_on_active_enrollment
        applies_to: [care_day_fee]
        kind: state
        condition: "Day fees are charged only on an enrollment in status active."
        evidence_fields: [care_enrollments.status, care_enrollments.care_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.care_enrollment_id]
          action_bindings:
            care_enrollments.care_enrollment_id: care_enrollment_id
        state_contract:
          field: care_enrollments.status
          allowed: [active]
    measures: [care_msr_drop_in_days_month]
    params:
      per_tier:
        "Creek Kids Club After-School Care (2 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
        "Creek Kids Club Before-School Care (5 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
        "Creek Kids Club After-School Care (3 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
        "Creek Kids Club After-School Care (5 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
        "Creek Kids Club Before & After-School Care (5 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
        "Creek Kids Club Pre-K Wraparound Care (5 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
    formula:
      amount: "drop_in_day_fee if day_type == 'drop_in_day' else (holiday_camp_day_fee if day_type == 'holiday_camp_day' else early_release_day_fee)"

  - id: care_evt_late_pickup
    subject: [care_late_pickup, care_late_pickup_fee, care_late_pickup_warning, care_dismissal]
    rule: >-
      A pickup is late when the student is signed out more than late_pickup_grace_minutes after the plan's after_care_end_time; minutes_late is counted from after_care_end_time itself, not from the end of the grace period.
      Each late pickup is recorded once per service date.
      The first late pickup of each semester is recorded with fee_status waived_first_incident when the plan's late_pickup_first_incident_waived is true; every other late pickup is chargeable and posts a late pickup fee of minutes_late times late_pickup_fee_per_minute.
      Semesters are fall (August 1 - December 31) and spring (January 1 - June 30), and the count of late pickups in a semester (care_msr_late_pickups_semester) includes waived incidents.
      When the count reaches late_pickup_warning_threshold, the program director issues one written warning for that semester; when it reaches late_pickup_dismissal_threshold, the student is dismissed after the fee for that pickup posts.
      Late pickup fees are not discounted by rate basis or sibling position and are not covered by Workforce Solutions remittances.
      A plan with no after-school session has no late pickups under this policy.
    eligibility: []
    measures: [care_msr_late_pickups_semester]
    formula:
      when: "minutes_late > late_pickup_grace_minutes"
      amount: "minutes_late * late_pickup_fee_per_minute"

  - id: care_billing_and_late_payment
    subject: [care_late_payment_fee, care_credit, care_suspension, care_reinstatement, care_nonpayment_withdrawal]
    rule: >-
      Tuition for each billing month is due by tuition_due_day of that month, and payments, remittances and credits are applied to the enrollment's oldest open charge first.
      When the amounts applied by the due day leave any part of that month's tuition unpaid, one late payment fee of late_payment_fee posts late_payment_fee_offset_days after the due day; a month whose tuition posted after its due day becomes late only at the next month's due day.
      At the family's request a late payment fee is credited back with credit_reason late_fee_courtesy_waiver.
      A late fee courtesy credit is granted only while fewer than late_fee_courtesy_waivers_per_year courtesy credits have been posted on the enrollment in the school year (care_msr_late_fee_waivers_year).
      When at least suspension_minimum_past_due of tuition remains unpaid more than suspension_days_past_due days after a month's due day, care is suspended; tuition continues to post while care is suspended, because the seat is held.
      A suspended enrollment resumes only after its entire past-due balance is paid.
      When the enrollment is still suspended nonpayment_withdrawal_days after its suspended_date, it is withdrawn and the balance remains owed.
    eligibility:
      - id: courtesy_waiver_remaining
        applies_to: [care_credit]
        kind: authorization
        condition: "A late fee courtesy credit is granted only while fewer than late_fee_courtesy_waivers_per_year courtesy credits have been posted on the enrollment in the school year (care_msr_late_fee_waivers_year)."
        evidence_fields: [care_ledger.care_enrollment_id, care_ledger.credit_reason, care_ledger.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_ledger.care_enrollment_id]
          action_bindings:
            care_ledger.care_enrollment_id: care_enrollment_id
      - id: past_due_cleared
        applies_to: [care_reinstatement]
        kind: authorization
        condition: "A suspended enrollment resumes only after its entire past-due balance is paid."
        evidence_fields: [care_ledger.care_enrollment_id, care_ledger.event_type, care_ledger.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_ledger.care_enrollment_id]
          action_bindings:
            care_ledger.care_enrollment_id: care_enrollment_id
    measures: [care_msr_late_fee_waivers_year]

  - id: care_withdrawal_and_refunds
    subject: [care_withdrawal, care_program_end, care_refund, care_credit]
    rule: >-
      A family ends care by written withdrawal notice, which the support desk records as a withdrawal_notice request; the withdrawal itself is the family's own action.
      The last day of care is the requested last day, but when the requested last day is earlier than withdrawal_notice_days calendar days after the notice was received, tuition is billed through the end of that notice period (billing_after_short_notice), the notice date counting as day 0.
      A billing month any day of which falls on or before the later of the requested last day and the end of the notice period is billed in full; a tuition charge already posted for a month that falls entirely after that later date is credited in full with credit_reason notice_period_adjustment.
      When the student withdraws from the district, care ends on the district withdrawal date and the notice period does not apply.
      A closed enrollment whose credits and payments exceed its charges is refunded by district check within credit_balance_refund_days calendar days after its end_date, and a refund is issued only on an enrollment in status withdrawn, dismissed or ended.
      The registration fee is never refunded, and an enrollment withdrawn with an unpaid balance keeps that balance owed.
    eligibility:
      - id: refund_after_close
        applies_to: [care_refund]
        kind: state
        condition: "a refund is issued only on an enrollment in status withdrawn, dismissed or ended."
        evidence_fields: [care_enrollments.status, care_enrollments.care_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.care_enrollment_id]
          action_bindings:
            care_enrollments.care_enrollment_id: care_enrollment_id
        state_contract:
          field: care_enrollments.status
          allowed: [withdrawn, dismissed, ended]

  - id: care_plan_changes
    subject: [care_plan_change, care_plan_change_fee]
    rule: >-
      Plan changes are made only on an enrollment in status active.
      A plan change request received on or before plan_change_request_cutoff_day of a month takes effect on the first day of the next month; a request received after that day takes effect on the first day of the month after next.
      The new plan must be offered at the enrollment's campus and admit the student's grade.
      At most plan_changes_per_semester plan changes take effect per enrollment per semester (care_msr_plan_changes_semester); a further request waits for the next semester.
      Each plan change posts one plan_change_fee for the billing month in which it takes effect; a month already posted under the old plan is not rebilled.
    eligibility:
      - id: plan_change_on_active
        applies_to: [care_plan_change, care_plan_change_fee]
        kind: state
        condition: "Plan changes are made only on an enrollment in status active."
        evidence_fields: [care_enrollments.status, care_enrollments.care_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.care_enrollment_id]
          action_bindings:
            care_enrollments.care_enrollment_id: care_enrollment_id
        state_contract:
          field: care_enrollments.status
          allowed: [active]
    measures: [care_msr_plan_changes_semester]

  - id: care_payments_and_returns
    subject: [care_payment, care_returned_payment, care_returned_payment_fee]
    rule: >-
      Families pay by the methods in accepted_payment_methods; cash is not accepted.
      A payment posts to the enrollment the family names and is applied to that enrollment's oldest open charge first; a payment never moves between enrollments, siblings included.
      A payment returned unpaid by the bank restores its full amount to the balance and posts one returned_payment_fee for that payment, and a returned payment never counts as paid for late-fee or suspension purposes.
      When a household has had returned_payments_before_certified_funds or more returned payments across its Creek Kids Club enrollments within the last certified_funds_lookback_months calendar months (care_msr_returned_payments_lookback), further payments are accepted only by online_card or money_order.
    eligibility:
      - id: certified_funds_after_returns
        applies_to: [care_payment]
        kind: authorization
        condition: "When a household has had returned_payments_before_certified_funds or more returned payments across its Creek Kids Club enrollments within the last certified_funds_lookback_months calendar months (care_msr_returned_payments_lookback), further payments are accepted only by online_card or money_order."
        evidence_fields: [care_ledger.care_enrollment_id, care_ledger.customer_id, care_ledger.event_type, care_ledger.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_ledger.care_enrollment_id]
          action_bindings:
            care_ledger.care_enrollment_id: care_enrollment_id
    measures: [care_msr_returned_payments_lookback]
