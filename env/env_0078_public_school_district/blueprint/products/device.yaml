# Student technology device loans and the Technology Protection Plan — Calloway Creek ISD.
category: device
display_name: Student Technology Device Program

binding:
  holding_table: device_loans
  event_tables: [device_ledger, device_incidents]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [checked_out, in_repair, returned, reported_lost, charged_off]
  transitions:
    - {from: checked_out, to: in_repair, by: agent, means: "The device is taken in at the campus technology desk for repair."}
    - {from: in_repair, to: checked_out, by: system, means: "The repaired device is handed back to the student."}
    - {from: checked_out, to: returned, by: agent, means: "The device and its accessories are turned in and inspected."}
    - {from: checked_out, to: reported_lost, by: user, means: "The family reports the device lost or stolen."}
    - {from: reported_lost, to: returned, by: agent, means: "A device reported lost is found and turned in."}
    - {from: reported_lost, to: charged_off, by: system, means: "A device reported lost is not recovered and is retired from inventory after the loss charge is posted."}

accounts:
  - key: device_charges_due
    unit: USD
    meaning: "Amount the household owes on one device loan; plan fees, repair and replacement charges and refunds disbursed increase it, payments and credits decrease it."

parameter_schema:
  device_type: "Kind of device loaned; enum chromebook | ipad | windows_laptop | mobile_hotspot."
  eligible_grades: "Grades the loan type serves; list of grade codes."
  take_home_allowed: "Whether the device goes home with the student; boolean."
  protection_plan_included: "Whether the loan carries the Technology Protection Plan; boolean."
  agreement_signature_required: "Whether the parent must sign the device loan agreement before checkout; boolean."
  acceptable_use_acknowledgment_required: "Whether the student and parent must acknowledge the acceptable use policy before checkout; boolean."
  plan_fee: "Annual Technology Protection Plan fee per device, USD; 0.00 without the plan."
  plan_fee_free_meal_waiver_pct: "Share of the plan fee waived for a student holding any Free Meal Status tier, percent."
  plan_fee_reduced_meal_waiver_pct: "Share of the plan fee waived for a student holding any Reduced-Price Meal Status tier, percent."
  plan_household_cap: "Maximum plan fees per household per school year after waivers, USD."
  plan_enrollment_window_days: "Calendar days after checkout within which a standard-liability loan may be moved onto the plan, the checkout date being day 0; integer."
  plan_fee_refundable: "Whether the plan fee is credited when the device is returned during the year; boolean."
  device_replacement_cost: "Replacement cost of a new device of the type, USD."
  charger_replacement_cost: "Replacement cost of the charger, USD."
  case_replacement_cost: "Replacement cost of the protective case, USD; 0.00 where none is issued."
  screen_repair_cost: "Repair charge for a broken screen, USD."
  keyboard_repair_cost: "Repair charge for a damaged keyboard or touchpad, USD; 0.00 for devices without one."
  liquid_damage_repair_cost: "Repair charge for liquid damage, USD."
  port_repair_cost: "Repair charge for a damaged charging port or hinge, USD."
  first_incident_deductible: "Charge for the first accidental damage incident of the school year under the plan, USD."
  second_incident_deductible: "Charge for the second accidental damage incident of the school year under the plan, USD."
  third_plus_incident_basis: "Charge basis from the third incident of the school year under the plan; enum full_repair_cost."
  standard_liability_basis: "Charge basis for any damage without the plan; enum full_repair_cost."
  intentional_damage_basis: "Charge basis for damage the campus finds intentional, with or without the plan; enum full_repair_cost."
  loss_covered: "Whether the plan reduces the charge for a lost device; boolean."
  loss_charge_pct_with_plan: "Share of the depreciated replacement cost charged for a lost device under the plan, percent."
  theft_covered_with_police_report: "Whether a stolen device is charged nothing under the plan when a police report is filed; boolean."
  theft_report_days: "Calendar days after the theft within which the police report must be filed and its number given, the theft date being day 0; integer."
  depreciation_schedule: "Share of device_replacement_cost charged for loss or non-return by device service year; mapping year -> percent."
  device_service_life_years: "Years a device stays in service before retirement; integer."
  accessory_coverage: "Whether chargers and cases are covered by the plan; boolean."
  incidents_per_year_before_review: "Damage incidents in a school year at which take-home use is reviewed by the campus administrator; integer."
  repair_turnaround_days: "Calendar days within which a repair is completed; integer."
  loaner_during_repair: "Whether a loaner device is issued while the device is in repair; boolean."
  inspection_on_return: "Whether the device is inspected for damage when turned in; boolean."
  withdrawal_return_days: "Calendar days after the last day of attendance within which the device must be returned, that day being day 0; integer."
  unreturned_charge_basis: "Charge for a device not returned by the deadline; enum depreciated_replacement_cost."
  summer_return_required: "Whether the device must be turned in at the end of the school year; boolean."
  summer_keep_grades: "Grades that keep the device over the summer; list of grade codes."
  hotspot_data_plan: "Data service of the hotspot; enum filtered_unlimited | not_applicable."
  hotspot_eligibility_basis: "Ground on which a hotspot is loaned; enum household_statement_no_home_internet | not_applicable."
  hotspot_max_per_household: "Most hotspots loaned to one household at a time; integer."
  hotspot_renewal: "How long a hotspot loan lasts; enum school_year | not_applicable."
  police_report_required_for_theft: "Whether theft is treated as loss unless a police report number is given; boolean."
  payment_plan_threshold: "Smallest charge total on a loan for which monthly payments are offered, USD."
  payment_plan_months: "Number of monthly payments in a payment plan; integer."
  accepted_payment_methods: "Payment methods accepted; list of enum online_card | ach_bank_draft | personal_check | money_order."
  credit_balance_refund_days: "Calendar days after a loan closes within which a credit balance is refunded; integer."

