events:
  - type: device_checkout
    target: device_loans
    mutation: create
    meaning: "A district device is checked out to a student for the school year."
    grain: "One row per device checked out to a student for a school year."
    fields:
      customer_id: "Household."
      student_id: "Student."
      variant_name: "Official loan type."
      campus: "Campus issuing the device."
      school_year: "School year, YYYY-YY."
      asset_tag: "District asset tag of the device."
      device_type: "chromebook, ipad, windows_laptop or mobile_hotspot, as the loan type states."
      device_service_year: "Service year of the device at checkout, 1 for a new device."
      checkout_date: "Date checked out."
    triggers:
      - event: device:device_plan_fee
        when: {variant_name: ["Chromebook Loan with Technology Protection Plan", "iPad Loan with Technology Protection Plan", "Windows Laptop Loan with Technology Protection Plan"]}
        map: {posted_date: checkout_date}
  - type: device_repair_intake
    target: device_loans
    mutation: {transition: {from: checked_out, to: in_repair}}
    meaning: "The device is taken in for repair."
    grain: "One row per transaction."
    fields:
      repair_intake_date: "Date taken in."
    triggers: []
  - type: device_repair_complete
    target: device_loans
    mutation: {transition: {from: in_repair, to: checked_out}}
    meaning: "The repaired device is handed back."
    grain: "One row per transaction."
    fields:
      repair_intake_date: "Cleared to empty."
    triggers: []
  - type: device_return
    target: device_loans
    mutation: {transition: {from: checked_out, to: returned}}
    meaning: "The device is turned in and inspected."
    grain: "One row per transaction."
    fields:
      return_date: "Date turned in."
    triggers: []
  - type: device_loss_report
    target: device_loans
    mutation: {transition: {from: checked_out, to: reported_lost}}
    meaning: "The family reports the device lost or stolen."
    grain: "One row per transaction."
    fields:
      loss_report_date: "Date of the report."
    triggers: []
  - type: device_recovered
    target: device_loans
    mutation: {transition: {from: reported_lost, to: returned}}
    meaning: "A device reported lost is found and turned in."
    grain: "One row per transaction."
    fields:
      return_date: "Date turned in."
    triggers: []
  - type: device_charge_off
    target: device_loans
    mutation: {transition: {from: reported_lost, to: charged_off}}
    meaning: "An unrecovered device is retired from inventory."
    grain: "One row per transaction."
    fields:
      return_date: "Date retired."
    triggers: []
  - type: device_plan_enrollment
    target: device_loans
    mutation: update
    meaning: "A standard-liability loan is moved onto the Technology Protection Plan within the enrollment window."
    grain: "One row per plan enrollment."
    fields:
      variant_name: "Plan loan type of the same device type."
      plan_enrolled_date: "Date the plan took effect."
    triggers:
      - event: device:device_plan_fee
        map: {posted_date: plan_enrolled_date}
  - type: device_plan_fee
    target: device_ledger
    meaning: "The annual Technology Protection Plan fee is posted."
    grain: "One row per loan."
    distinguish_by: [charge_type]
    fields:
      amount: "Plan fee before waivers, positive USD."
      posted_date: "Date posted."
      charge_type: "plan_fee."
    account: device_charges_due
    direction: in
    triggers: []
  - type: device_damage_charge
    target: device_ledger
    meaning: "The charge for one damage incident is posted."
    grain: "One row per damage incident."
    distinguish_by: [device_incident_id]
    fields:
      amount: "Charge, positive USD."
      posted_date: "Date posted."
      charge_type: "screen_repair, keyboard_repair, liquid_damage_repair or port_repair."
      device_incident_id: "Incident charged."
    account: device_charges_due
    direction: in
    triggers: []
  - type: device_loss_charge
    target: device_ledger
    meaning: "The charge for a lost or stolen device is posted."
    grain: "One row per loss incident."
    distinguish_by: [device_incident_id]
    fields:
      amount: "Charge, positive USD."
      posted_date: "Date posted."
      charge_type: "device_loss."
      device_incident_id: "Loss or theft incident charged."
    account: device_charges_due
    direction: in
    triggers: []
  - type: device_accessory_charge
    target: device_ledger
    meaning: "The replacement charge for a lost or damaged charger or case is posted."
    grain: "One row per accessory incident."
    distinguish_by: [device_incident_id]
    fields:
      amount: "Charge, positive USD."
      posted_date: "Date posted."
      charge_type: "charger_replacement or case_replacement."
      device_incident_id: "Incident charged."
    account: device_charges_due
    direction: in
    triggers: []
  - type: device_unreturned_charge
    target: device_ledger
    meaning: "The charge for a device not returned by the deadline is posted."
    grain: "One row per loan."
    distinguish_by: [charge_type]
    fields:
      amount: "Depreciated replacement cost, positive USD."
      posted_date: "Date posted."
      charge_type: "device_unreturned."
    account: device_charges_due
    direction: in
    triggers: []
  - type: device_payment
    target: device_ledger
    meaning: "A family payment is applied to the loan."
    grain: "One row per payment confirmation."
    distinguish_by: [payment_reference]
    fields:
      amount: "Payment, positive USD."
      posted_date: "Date posted."
      payment_method: "online_card, ach_bank_draft, personal_check or money_order."
      payment_reference: "Payment confirmation number exactly as issued."
    account: device_charges_due
    direction: out
    triggers: []
  - type: device_credit
    target: device_ledger
    meaning: "A credit offsets one specific charge (plan fee waiver, household cap, device recovered or returned late, or billing correction)."
    grain: "One row per credited source charge per reason."
    distinguish_by: [source_device_ledger_id, credit_reason]
    fields:
      amount: "Credit, positive USD."
      posted_date: "Date posted."
      credit_reason: "free_meal_waiver, reduced_meal_waiver, household_cap, device_recovered or billing_correction."
      source_device_ledger_id: "Reference of the charge credited."
    account: device_charges_due
    direction: out
    triggers: []
  - type: device_refund
    target: device_ledger
    meaning: "A credit balance on a closed loan is refunded by district check."
    grain: "One row per refund issued."
    distinguish_by: [posted_date]
    fields:
      amount: "Refund, positive USD."
      posted_date: "Date issued."
    account: device_charges_due
    direction: in
    triggers: []
  - type: device_incident_report
    target: device_incidents
    meaning: "A damage, loss, theft or accessory incident is recorded for the device."
    grain: "One row per incident."
    distinguish_by: [incident_date, damage_type]
    fields:
      incident_date: "Date of the incident."
      incident_number: "Damage incident number within the school year on the student's loans (0 for loss, theft and accessory incidents)."
      damage_type: "screen, keyboard, liquid, port, loss, theft, charger or case."
      intentional: "Whether the campus found the damage intentional."
      police_report_number: "Police report number exactly as given, for a theft."
    triggers: []

measures:
  - id: device_msr_incidents_year
    window: "The school year, July 1 - June 30, of the incident."
    measure: "Count of device_incident_report rows with damage_type screen, keyboard, liquid or port on the student's device loans of that school year, the new incident included."
  - id: device_msr_household_plan_fees_year
    window: "The school year of the plan fee being charged."
    measure: "Sum of device_plan_fee amounts on the household's other loans of that school year posted earlier, less device_credit amounts with credit_reason free_meal_waiver, reduced_meal_waiver or household_cap against them."
  - id: device_msr_household_hotspots
    window: "The moment of the checkout."
    measure: "Count of the household's Mobile Hotspot Loan loans in status checked_out, in_repair or reported_lost."

policies:
  - id: device_agg_multi_holding
    subject: [device_checkout]
    rule: >-
      A household may hold device loans for any number of its students, and each loan covers one device for one school year.
      A device is checked out only when the student has no other open loan of the same device_type for the same school year in status checked_out, in_repair or reported_lost.
      A student may hold one learning device (Chromebook, iPad or Windows laptop) and, under device_agg_household_hotspot, the household may hold a hotspot.
    eligibility:
      - id: one_open_loan_per_type
        applies_to: [device_checkout]
        kind: dedup
        condition: "A device is checked out only when the student has no other open loan of the same device_type for the same school year in status checked_out, in_repair or reported_lost."
        evidence_fields: [device_loans.student_id, device_loans.school_year, device_loans.device_type, device_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [device_loans.student_id, device_loans.school_year, device_loans.device_type]
          action_bindings:
            device_loans.student_id: student_id
            device_loans.school_year: school_year
            device_loans.device_type: device_type
        dedup_contract:
          table: device_loans
          mode: separate_record
          object_bindings: {student_id: student_id, school_year: school_year, device_type: device_type}
          duplicate_filters: {status: [checked_out, in_repair, reported_lost]}
          distinct_fields: []
    params:
      max_per_customer: null
      max_open_loans_per_student_device_type: 1

  - id: device_agg_household_hotspot
    subject: [device_checkout]
    rule: >-
      Hotspots are loaned per household, not per student: a household holds at most hotspot_max_per_household Mobile Hotspot Loan loans at a time (device_msr_household_hotspots), whichever student it is checked out to.
      A hotspot is loaned on the household's statement that it has no home internet service (hotspot_eligibility_basis) and lasts for the school year (hotspot_renewal).
    eligibility: []
    measures: [device_msr_household_hotspots]

  - id: device_checkout_requirements
    subject: [device_checkout]
    rule: >-
      A device is checked out only to a student whose district enrollment record for the school year is in status provisional or enrolled, at that record's campus.
      The parent must have signed the device loan agreement (agreement_signature_required) and the student and parent must have acknowledged the acceptable use policy, both through the family portal, before checkout.
      The loan type must admit the student's grade; Windows laptop loans are for students enrolled in a career and technical education course that requires one.
      A device whose service year exceeds device_service_life_years is retired and never checked out.
    eligibility:
      - id: enrolled_student
        applies_to: [device_checkout]
        kind: state
        condition: "A device is checked out only to a student whose district enrollment record for the school year is in status provisional or enrolled, at that record's campus."
        evidence_fields: [enrollments.status, enrollments.student_id, enrollments.campus]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.student_id]
          action_bindings:
            enrollments.student_id: student_id
        state_contract:
          field: enrollments.status
          allowed: [provisional, enrolled]

  - id: device_plan_rules
    subject: [device_plan_enrollment, device_plan_fee, device_credit]
    rule: >-
      The Technology Protection Plan fee of plan_fee posts once per loan, on checkout for a plan loan type or on the plan enrollment date.
      A standard-liability loan may move onto the plan of the same device type only within plan_enrollment_window_days after the device is checked out, counted in calendar days with the checkout date as day 0, and only while no damage incident has been recorded on the loan.
      The fee is waived by credit from the student's School Nutrition meal status on the posting date: plan_fee_free_meal_waiver_pct with credit_reason free_meal_waiver for any Free Meal Status tier, plan_fee_reduced_meal_waiver_pct with credit_reason reduced_meal_waiver for any Reduced-Price Meal Status tier, rounded to the nearest cent, half a cent rounding up.
      Plan fees net of waivers are capped per household per school year at plan_household_cap (device_msr_household_plan_fees_year), the excess credited with credit_reason household_cap.
      The plan fee is not credited when the device is returned during the year (plan_fee_refundable).
    eligibility:
      - id: plan_enrollment_window
        applies_to: [device_plan_enrollment]
        kind: time
        condition: "A standard-liability loan may move onto the plan of the same device type only within plan_enrollment_window_days after the device is checked out, counted in calendar days with the checkout date as day 0, and only while no damage incident has been recorded on the loan."
        evidence_fields: [device_loans.checkout_date, device_loans.device_loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [device_loans.device_loan_id]
          action_bindings:
            device_loans.device_loan_id: device_loan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the device is checked out"
          anchor_source: device_loans.checkout_date
          relation: not_after
          duration_source: variants.plan_enrollment_window_days
          unit: calendar_days
          counting_rule: "counted in calendar days with the checkout date as day 0"
          boundary: inclusive
    measures: [device_msr_household_plan_fees_year]
    params:
      per_tier:
        "Chromebook Loan (Standard Liability)": {plan_fee: "=plan_fee", protection_plan_included: "=protection_plan_included"}
        "Chromebook Loan with Technology Protection Plan": {plan_fee: "=plan_fee", protection_plan_included: "=protection_plan_included"}
        "iPad Loan with Technology Protection Plan": {plan_fee: "=plan_fee", protection_plan_included: "=protection_plan_included"}
        "Windows Laptop Loan (Standard Liability)": {plan_fee: "=plan_fee", protection_plan_included: "=protection_plan_included"}
        "Windows Laptop Loan with Technology Protection Plan": {plan_fee: "=plan_fee", protection_plan_included: "=protection_plan_included"}
        "Mobile Hotspot Loan": {plan_fee: "=plan_fee", protection_plan_included: "=protection_plan_included"}
    formula:
      waiver_credit: "round(plan_fee * plan_fee_free_meal_waiver_pct / 100, 2) if credit_reason == 'free_meal_waiver' else (round(plan_fee * plan_fee_reduced_meal_waiver_pct / 100, 2) if credit_reason == 'reduced_meal_waiver' else 0)"

  - id: device_damage_charges
    subject: [device_incident_report, device_damage_charge, device_accessory_charge]
    rule: >-
      Each damage incident is charged by the repair it needs: screen_repair_cost, keyboard_repair_cost, liquid_damage_repair_cost or port_repair_cost.
      Under the plan, the first accidental incident of the school year (device_msr_incidents_year) is charged first_incident_deductible, the second second_incident_deductible, and the third and later the full repair cost (third_plus_incident_basis), never more than the repair cost; without the plan every incident is charged the full repair cost.
      Damage the campus finds intentional is charged the full repair cost with or without the plan.
      A charge of 0.00 posts no charge row; the incident row is the record.
      Chargers and cases are never covered by the plan (accessory_coverage) and are charged charger_replacement_cost or case_replacement_cost.
      When incidents in a school year reach incidents_per_year_before_review, the campus administrator reviews take-home use; the review does not change charges.
    eligibility: []
    measures: [device_msr_incidents_year]
    params:
      per_tier:
        "Chromebook Loan (Standard Liability)": {first_incident_deductible: "=first_incident_deductible", second_incident_deductible: "=second_incident_deductible", screen_repair_cost: "=screen_repair_cost"}
        "Chromebook Loan with Technology Protection Plan": {first_incident_deductible: "=first_incident_deductible", second_incident_deductible: "=second_incident_deductible", screen_repair_cost: "=screen_repair_cost"}
        "iPad Loan with Technology Protection Plan": {first_incident_deductible: "=first_incident_deductible", second_incident_deductible: "=second_incident_deductible", screen_repair_cost: "=screen_repair_cost"}
        "Windows Laptop Loan (Standard Liability)": {first_incident_deductible: "=first_incident_deductible", second_incident_deductible: "=second_incident_deductible", screen_repair_cost: "=screen_repair_cost"}
        "Windows Laptop Loan with Technology Protection Plan": {first_incident_deductible: "=first_incident_deductible", second_incident_deductible: "=second_incident_deductible", screen_repair_cost: "=screen_repair_cost"}
        "Mobile Hotspot Loan": {first_incident_deductible: "=first_incident_deductible", second_incident_deductible: "=second_incident_deductible", screen_repair_cost: "=screen_repair_cost"}

  - id: device_loss_and_theft
    subject: [device_loss_report, device_loss_charge, device_recovered, device_charge_off, device_credit]
    rule: >-
      Only the family reports a device lost or stolen; the support desk records the report and the family confirms it.
      A lost device is charged the depreciated replacement cost, device_replacement_cost times the depreciation_schedule percent of the device's service year; under the plan the charge is loss_charge_pct_with_plan of that amount, rounded to the nearest cent, half a cent rounding up.
      A stolen device under the plan is charged nothing when a police report number is given within theft_report_days calendar days after the theft, the theft date being day 0; otherwise the theft is charged as a loss.
      A lost device found and turned in within the same school year credits its loss charge in full with credit_reason device_recovered, less any damage charged on inspection; a device not recovered is charged off after the loss charge posts.
    eligibility: []

  - id: device_repairs_and_loaners
    subject: [device_repair_intake, device_repair_complete]
    rule: >-
      A damaged device is taken in at the campus technology desk and repaired within repair_turnaround_days calendar days.
      While it is in repair the student receives a loaner device when loaner_during_repair is true; the loaner is covered on the same terms as the device in repair.
      The repair charge follows device_damage_charges whether or not the family accepts the repair.
    eligibility: []

  - id: device_returns
    subject: [device_return, device_unreturned_charge, device_credit]
    rule: >-
      A device must be turned in within withdrawal_return_days calendar days after the student's last day of attendance when the student withdraws, and at the end of the school year when summer_return_required is true unless the student's grade is in summer_keep_grades.
      A returned device is inspected and any damage found is charged under device_damage_charges.
      A device not turned in by its deadline is charged the depreciated replacement cost (unreturned_charge_basis); a device turned in later in the same school year credits that charge in full with credit_reason device_recovered, less any damage charged on inspection.
    eligibility: []

  - id: device_payments_and_refunds
    subject: [device_payment, device_refund]
    rule: >-
      Charges are paid by the methods in accepted_payment_methods and are applied to the loan's oldest open charge first.
      Charges on a loan totalling at least payment_plan_threshold may be paid in payment_plan_months equal monthly payments, the last carrying any remaining cents.
      A credit balance is refunded by district check within credit_balance_refund_days calendar days, and a refund is issued only on a loan in status returned or charged_off.
    eligibility:
      - id: refund_after_close
        applies_to: [device_refund]
        kind: state
        condition: "a refund is issued only on a loan in status returned or charged_off."
        evidence_fields: [device_loans.status, device_loans.device_loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [device_loans.device_loan_id]
          action_bindings:
            device_loans.device_loan_id: device_loan_id
        state_contract:
          field: device_loans.status
          allowed: [returned, charged_off]
