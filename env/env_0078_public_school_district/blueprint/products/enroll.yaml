events:
  - type: enroll_registration
    target: enrollments
    mutation: create
    meaning: "A household registers a student for a school year on one enrollment type at one campus and grade."
    grain: "One row per student per school year registration."
    fields:
      customer_id: "Household registering the student."
      student_id: "Student registered."
      variant_name: "Official enrollment type."
      campus: "Campus assigned under the type's campus_assignment_basis."
      grade_level: "Grade level placed."
      school_year: "School year, YYYY-YY."
      entry_type: "new_to_district, returning_student or re_entry."
      registration_date: "Date the registration was submitted."
      entry_date: "First day of attendance."
      prek_eligibility_basis: "State Pre-K eligibility basis on file, or not_applicable."
      approved_transfer_request_id: "Approved transfer request the placement rests on, empty for zone and Pre-K enrollments."
    triggers:
      - event: meals:meals_account_open
        when: {entry_type: new_to_district}
        map: {student_id: student_id, campus: campus, opened_date: registration_date}
      - event: enroll:enroll_tuition_charge
        when: {variant_name: "Pre-Kindergarten (Tuition-Based)"}
        map: {}
  - type: enroll_verification_complete
    target: enrollments
    mutation: {transition: {from: provisional, to: enrolled}}
    meaning: "The registrar verifies residency and the required documents and the registration becomes a full enrollment."
    grain: "One row per transaction."
    fields:
      residency_verified_date: "Date residency was verified for the school year; empty when residency proof is not required for the type."
    triggers: []
  - type: enroll_residency_lapse
    target: enrollments
    mutation: {transition: {from: provisional, to: withdrawn}}
    meaning: "A provisional registration is withdrawn because residency was not established by the deadline."
    grain: "One row per transaction."
    fields:
      withdrawal_date: "Last day of attendance."
      leaver_reason: "residency_not_established."
    triggers:
      - event: meals:meals_account_inactivate
        map: {inactive_date: withdrawal_date}
  - type: enroll_withdrawal
    target: enrollments
    mutation: {transition: {from: enrolled, to: withdrawn}}
    meaning: "The parent or guardian of record withdraws the student from the district."
    grain: "One row per transaction."
    fields:
      withdrawal_date: "Last day of attendance."
      leaver_reason: "Reason recorded on the withdrawal form."
    triggers:
      - event: meals:meals_account_inactivate
        map: {inactive_date: withdrawal_date}
      - event: transport:transport_eligibility_end
        map: {end_date: withdrawal_date, end_reason: district_withdrawal}
      - event: care:care_program_end
        map: {end_date: withdrawal_date}
  - type: enroll_year_end
    target: enrollments
    mutation: {transition: {from: enrolled, to: year_completed}}
    meaning: "The school year closes and the enrollment record for that year is completed."
    grain: "One row per transaction."
    fields:
      withdrawal_date: "Last instructional day of the school year."
      leaver_reason: "graduated for a grade 12 graduate, otherwise not_applicable."
    triggers: []
  - type: enroll_transfer_placement
    target: enrollments
    mutation: update
    meaning: "An approved and accepted transfer or choice program placement moves the student's enrollment to the placement's type and campus."
    grain: "One row per placement applied."
    fields:
      variant_name: "Official enrollment type of the placement."
      campus: "Campus of the placement."
      approved_transfer_request_id: "Approved transfer request applied."
      transfer_effective_date: "Date the placement takes effect."
    triggers:
      - event: meals:meals_campus_change
        map: {campus: campus}
  - type: enroll_transfer_revocation
    target: enrollments
    mutation: update
    meaning: "A revoked transfer or choice placement returns the student to the zoned campus on Attendance Zone Enrollment."
    grain: "One row per revocation applied."
    fields:
      variant_name: "Attendance Zone Enrollment."
      campus: "The student's zoned campus."
      transfer_effective_date: "Date the revocation takes effect."
    triggers:
      - event: meals:meals_campus_change
        map: {campus: campus}
  - type: enroll_prek_eligibility_change
    target: enrollments
    mutation: update
    meaning: "A tuition-based Pre-K enrollment moves to state-eligible Pre-K because an eligibility basis is established."
    grain: "One row per eligibility change."
    fields:
      variant_name: "Pre-Kindergarten (State-Eligible)."
      prek_eligibility_basis: "Eligibility basis established."
      transfer_effective_date: "First day of the billing month from which tuition no longer applies."
    triggers: []
  - type: enroll_tuition_charge
    target: enrollment_ledger
    meaning: "One billing month's Pre-K tuition is posted."
    grain: "One row per enrollment per billing month."
    distinguish_by: [billing_month]
    fields:
      amount: "Tuition charged, positive USD."
      posted_date: "Date posted."
      billing_month: "Billing month, YYYY-MM."
      proration: "full_month or half_month."
      sibling_discount_applied: "Whether the tuition sibling discount was applied."
    account: prek_tuition_due
    direction: in
    triggers: []
  - type: enroll_tuition_late_fee
    target: enrollment_ledger
    meaning: "The monthly tuition late fee is posted."
    grain: "One row per enrollment per billing month."
    distinguish_by: [billing_month]
    fields:
      amount: "Late fee, positive USD."
      posted_date: "Date posted."
      billing_month: "Billing month whose tuition was late."
    account: prek_tuition_due
    direction: in
    triggers: []
  - type: enroll_tuition_payment
    target: enrollment_ledger
    meaning: "A family tuition payment is applied."
    grain: "One row per payment confirmation."
    distinguish_by: [payment_reference]
    fields:
      amount: "Payment amount, positive USD."
      posted_date: "Date posted."
      payment_method: "online_card, ach_bank_draft, personal_check or money_order."
      payment_reference: "Payment confirmation number exactly as issued."
    account: prek_tuition_due
    direction: out
    triggers: []
  - type: enroll_tuition_credit
    target: enrollment_ledger
    meaning: "A credit offsets one specific tuition charge or late fee."
    grain: "One row per credited source charge per reason."
    distinguish_by: [source_enrollment_ledger_id, credit_reason]
    fields:
      amount: "Credit amount, positive USD, never more than the source charge."
      posted_date: "Date posted."
      credit_reason: "eligibility_established, withdrawal_after_notice or billing_correction."
      source_enrollment_ledger_id: "Reference of the charge credited."
    account: prek_tuition_due
    direction: out
    triggers: []
  - type: enroll_tuition_refund
    target: enrollment_ledger
    meaning: "A tuition credit balance on a closed enrollment is refunded by district check."
    grain: "One row per refund issued."
    distinguish_by: [posted_date]
    fields:
      amount: "Refund amount, positive USD."
      posted_date: "Date issued."
    account: prek_tuition_due
    direction: in
    triggers: []
  - type: enroll_document_received
    target: enrollment_records_log
    meaning: "The registrar logs a registration document accepted for the enrollment."
    grain: "One row per document type per date received."
    distinguish_by: [document_type, received_date]
    fields:
      document_type: "proof_of_residency, birth_certificate, immunization_record, prior_school_records, prek_eligibility_proof, employee_verification or withdrawal_notice."
      received_date: "Date the document was accepted."
      document_date: "Date printed on the document (issue or statement date)."
    triggers: []

measures:
  - id: enroll_msr_tuition_siblings
    window: "The school year of the tuition charge."
    measure: "Count of the household's other enrollments on Pre-Kindergarten (Tuition-Based) for that school year in status provisional or enrolled whose registration_date is earlier than this enrollment's (ties broken by the earlier entry_date)."
  - id: enroll_msr_prior_tuition_balance
    window: "All school years before the school year being registered."
    measure: "Sum over the household's enrollments of earlier school years of prek_tuition_due deltas: tuition charges, late fees and refunds less payments and credits."

policies:
  - id: enroll_agg_multi_holding
    subject: [enroll_registration]
    rule: >-
      A household may enroll any number of students, and each enrollment record covers one student for one school year.
      A student is registered only when the student has no other enrollment for the same school year in status provisional or enrolled.
      A student who withdrew may be registered again in the same school year with entry_type re_entry, and a continuing student is registered for each new school year with entry_type returning_student; a student never attending the district before is new_to_district.
    eligibility:
      - id: one_open_enrollment_per_year
        applies_to: [enroll_registration]
        kind: dedup
        condition: "A student is registered only when the student has no other enrollment for the same school year in status provisional or enrolled."
        evidence_fields: [enrollments.student_id, enrollments.school_year, enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.student_id, enrollments.school_year]
          action_bindings:
            enrollments.student_id: student_id
            enrollments.school_year: school_year
        dedup_contract:
          table: enrollments
          mode: separate_record
          object_bindings: {student_id: student_id, school_year: school_year}
          duplicate_filters: {status: [provisional, enrolled]}
          distinct_fields: []
    params:
      max_per_customer: null
      max_open_enrollments_per_student_per_school_year: 1

  - id: enroll_agg_tuition_siblings
    subject: [enroll_tuition_charge]
    rule: >-
      The tuition sibling discount is decided across the household's enrollments of the same school year on Pre-Kindergarten (Tuition-Based).
      The child registered first (earliest registration_date, then earliest entry_date) pays the full monthly_tuition; each other child counted by enroll_msr_tuition_siblings receives tuition_sibling_discount_pct on every tuition charge.
      Children on Pre-Kindergarten (State-Eligible) or on any other enrollment type are not counted, and Creek Kids Club or other program enrollments never count toward this discount.
    eligibility: []
    measures: [enroll_msr_tuition_siblings]

  - id: enroll_registration_and_residency
    subject: [enroll_registration, enroll_verification_complete, enroll_residency_lapse, enroll_document_received]
    rule: >-
      A new registration starts provisional and the student attends from the entry_date.
      For an enrollment type whose resident_required is true, a student is registered only when the household profile shows an in-district residence.
      A provisional registration becomes enrolled only once the documents the type requires are on file for that enrollment: a proof of residency whose document_date is no more than 60 days before its received_date when residency_proof_required is true, and a birth certificate for a new_to_district student.
      When residency is not established within residency_proof_deadline_days calendar days after the registration date, the registration date being day 0, the registration is withdrawn with leaver_reason residency_not_established.
      A missing birth certificate after birth_certificate_deadline_days calendar days from the entry_date is referred to local law enforcement as Texas Education Code 25.002 requires and does not end the enrollment; a student transferring from another Texas public school may attend for immunization_provisional_days calendar days while immunization records are obtained.
      When residency_annual_reverification is true, a returning_student registration needs a new proof of residency for the new school year.
    eligibility:
      - id: in_district_residence
        applies_to: [enroll_registration]
        kind: state
        condition: "For an enrollment type whose resident_required is true, a student is registered only when the household profile shows an in-district residence."
        evidence_fields: [customers.in_district_residence, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
        state_contract:
          field: customers.in_district_residence
          allowed: [true]
      - id: documents_on_file
        applies_to: [enroll_verification_complete]
        kind: authorization
        condition: "A provisional registration becomes enrolled only once the documents the type requires are on file for that enrollment: a proof of residency whose document_date is no more than 60 days before its received_date when residency_proof_required is true, and a birth certificate for a new_to_district student."
        evidence_fields: [enrollment_records_log.enrollment_id, enrollment_records_log.document_type, enrollment_records_log.document_date, enrollment_records_log.received_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollment_records_log.enrollment_id]
          action_bindings:
            enrollment_records_log.enrollment_id: enrollment_id
    params:
      residency_proof_max_age_days: 60
      per_tier:
        "Attendance Zone Enrollment": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Intra-District Transfer (Space Available)": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Intra-District Transfer (Employee Child)": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Non-Resident Transfer": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Choice Program Enrollment": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Pre-Kindergarten (State-Eligible)": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Pre-Kindergarten (Tuition-Based)": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}

  - id: enroll_transfer_requests
    subject: [enroll_transfer_placement]
    rule: >-
      A transfer or choice placement rests on a transfer request of the matching transfer_category for the school year it names.
      Requests are taken from application_window_start through application_window_end, both days included; a request filed outside the window is considered for the current school year only when mid_year_requests_accepted is true, and then takes effect as mid_year_effective_rule states.
      Space-available and non-resident requests are decided first come by created_at, after sibling-priority requests, and no placement of the type is made at a campus listed in closed_campuses; choice program seats are allotted by lottery; an employee child request requires the household profile to be flagged as a district employee household.
      A placement is applied only for a transfer request whose request_status is approved.
      An approved placement is applied only when the family accepts it within placement_acceptance_days after the district issues the transfer decision, counted in calendar days with the decision date as day 0, and an acceptance on the last day still counts; an approval not accepted in time lapses and the student stays on the current enrollment.
      Once applied, the enrollment takes the placement's type and campus from the transfer_effective_date.
    eligibility:
      - id: request_approved
        applies_to: [enroll_transfer_placement]
        kind: state
        condition: "A placement is applied only for a transfer request whose request_status is approved."
        evidence_fields: [transfer_requests.request_status, transfer_requests.transfer_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [transfer_requests.transfer_request_id]
          action_bindings:
            transfer_requests.transfer_request_id: transfer_request_id
        state_contract:
          field: transfer_requests.request_status
          allowed: [approved]
      - id: acceptance_window
        applies_to: [enroll_transfer_placement]
        kind: time
        condition: "An approved placement is applied only when the family accepts it within placement_acceptance_days after the district issues the transfer decision, counted in calendar days with the decision date as day 0, and an acceptance on the last day still counts; an approval not accepted in time lapses and the student stays on the current enrollment."
        evidence_fields: [transfer_requests.decision_date, transfer_requests.transfer_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [transfer_requests.transfer_request_id]
          action_bindings:
            transfer_requests.transfer_request_id: transfer_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the district issues the transfer decision"
          anchor_source: transfer_requests.decision_date
          relation: not_after
          duration_source: variants.placement_acceptance_days
          unit: calendar_days
          counting_rule: "counted in calendar days with the decision date as day 0"
          boundary: inclusive
    params:
      per_tier:
        "Attendance Zone Enrollment": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Intra-District Transfer (Space Available)": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Intra-District Transfer (Employee Child)": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Non-Resident Transfer": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Choice Program Enrollment": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Pre-Kindergarten (State-Eligible)": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Pre-Kindergarten (Tuition-Based)": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}

  - id: enroll_transfer_effects
    subject: [enroll_transfer_placement, enroll_transfer_revocation, enroll_registration]
    rule: >-
      The enrollment type a student holds changes what other district programs owe the student.
      When the type's district_transportation_eligible is false, the student is not eligible for regular district bus service to the campus attended, whatever the distance, and the family provides transportation; a Choice Program Enrollment student instead qualifies for the choice program hub shuttle because hub_shuttle_eligible is true.
      A placement whose transfer_term is through_campus_highest_grade continues each following school year at the same campus without a new request, and the returning_student registration keeps the type; a placement whose transfer_term is single_school_year (annual_renewal_required) needs a newly approved request for every school year, and without one the student is registered on Attendance Zone Enrollment at the zoned campus.
      A student moving to the next campus level (elementary to middle school, middle school to high school) returns to the zoned campus of the new level unless a new request is approved.
      A change of residence within the district changes the zoned campus but does not end an approved placement.
    eligibility: []
    params:
      per_tier:
        "Attendance Zone Enrollment": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Intra-District Transfer (Space Available)": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Intra-District Transfer (Employee Child)": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Non-Resident Transfer": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Choice Program Enrollment": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Pre-Kindergarten (State-Eligible)": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Pre-Kindergarten (Tuition-Based)": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}

  - id: enroll_transfer_revocation_rules
    subject: [enroll_transfer_revocation]
    rule: >-
      A transfer or choice placement may be revoked by the campus principal when, in one semester, the student reaches revocation_unexcused_absence_threshold unexcused absences or revocation_tardy_threshold tardies (a threshold of 0 means the placement is not revocable on that ground), or when the student is placed in a disciplinary alternative education program and revocation_on_daep_placement is true.
      A revocation takes effect only at the end of the current semester (revocation_effective_point), and only when it is no earlier than revocation_notice_days after the campus issues the written revocation notice, counted in calendar days with the notice date as day 0; when the semester ends sooner, the revocation takes effect at the end of the following semester.
      On revocation the student returns to the zoned campus on Attendance Zone Enrollment and the transfer request's request_status becomes revoked; the family may file a new request in a later window.
      Attendance Zone Enrollment and Pre-Kindergarten enrollments are never revoked under this policy.
    eligibility:
      - id: revocation_notice_period
        applies_to: [enroll_transfer_revocation]
        kind: time
        condition: "A revocation takes effect only at the end of the current semester (revocation_effective_point), and only when it is no earlier than revocation_notice_days after the campus issues the written revocation notice, counted in calendar days with the notice date as day 0; when the semester ends sooner, the revocation takes effect at the end of the following semester."
        evidence_fields: [transfer_requests.revocation_notice_date, transfer_requests.transfer_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [transfer_requests.transfer_request_id]
          action_bindings:
            transfer_requests.transfer_request_id: transfer_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the campus issues the written revocation notice"
          anchor_source: transfer_requests.revocation_notice_date
          relation: not_before
          duration_source: variants.revocation_notice_days
          unit: calendar_days
          counting_rule: "counted in calendar days with the notice date as day 0"
          boundary: inclusive
    params:
      per_tier:
        "Attendance Zone Enrollment": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Intra-District Transfer (Space Available)": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Intra-District Transfer (Employee Child)": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Non-Resident Transfer": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Choice Program Enrollment": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Pre-Kindergarten (State-Eligible)": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Pre-Kindergarten (Tuition-Based)": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}

  - id: enroll_prek_admission
    subject: [enroll_registration, enroll_prek_eligibility_change, enroll_tuition_credit]
    rule: >-
      A Pre-K child must reach the age in prek_age_by_cutoff for the grade on or before prek_age_cutoff of the year the school year starts, judged from the student's date of birth on the student record.
      Pre-Kindergarten (State-Eligible) admits a child with at least one basis in prek_eligibility_bases on file: emergent_bilingual when the student record shows emergent bilingual identification; free_or_reduced_meals when the student's School Nutrition meal account holds any Free Meal Status or Reduced-Price Meal Status tier; homeless when the student record shows homeless_mckinney_vento; foster_care when it shows foster_care; military_connected when it shows a military-connected parent; star_of_texas_family when a prek_eligibility_proof document for that basis is on the enrollment.
      A child admitted to PK3 on a basis stays eligible for PK4 the next school year (prek_eligibility_carries_to_pk4) even when the basis no longer holds.
      A PK4 child with no basis may enroll on Pre-Kindergarten (Tuition-Based) when the household has no unpaid tuition balance from an earlier school year (enroll_msr_prior_tuition_balance is zero or below).
      A tuition-based enrollment moves to state-eligible Pre-K only when an eligibility basis is on file for the student.
      The move takes effect on the first day of the billing month after the basis is on file; a tuition charge already posted for that month or a later one is credited in full with credit_reason eligibility_established, and months before it remain owed.
    eligibility:
      - id: prior_tuition_balance_clear
        applies_to: [enroll_registration]
        kind: authorization
        condition: "A PK4 child with no basis may enroll on Pre-Kindergarten (Tuition-Based) when the household has no unpaid tuition balance from an earlier school year (enroll_msr_prior_tuition_balance is zero or below)."
        evidence_fields: [enrollments.customer_id, enrollments.school_year, enrollment_ledger.enrollment_id, enrollment_ledger.event_type, enrollment_ledger.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.customer_id]
          action_bindings:
            enrollments.customer_id: customer_id
      - id: eligibility_basis_on_file
        applies_to: [enroll_prek_eligibility_change]
        kind: authorization
        condition: "A tuition-based enrollment moves to state-eligible Pre-K only when an eligibility basis is on file for the student."
        evidence_fields: [enrollments.enrollment_id, enrollments.student_id, students.emergent_bilingual, students.categorical_status, students.military_connected, meal_accounts.variant_name, enrollment_records_log.document_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.enrollment_id]
          action_bindings:
            enrollments.enrollment_id: enrollment_id
    measures: [enroll_msr_prior_tuition_balance]
    params:
      per_tier:
        "Attendance Zone Enrollment": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Intra-District Transfer (Space Available)": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Intra-District Transfer (Employee Child)": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Non-Resident Transfer": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Choice Program Enrollment": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Pre-Kindergarten (State-Eligible)": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Pre-Kindergarten (Tuition-Based)": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}

  - id: enroll_prek_tuition
    subject: [enroll_tuition_charge, enroll_tuition_late_fee]
    rule: >-
      Tuition posts on the first day of each month listed in tuition_billing_months for an enrollment on Pre-Kindergarten (Tuition-Based), and the first month's tuition posts on the registration date.
      Tuition posts only on an enrollment in status provisional or enrolled.
      The charge is the type's monthly_tuition, less tuition_sibling_discount_pct when enroll_agg_tuition_siblings gives the child a sibling discount; a first month whose entry_date falls on or after half_month_start_day is charged half_month_rate_pct of that amount, and every other month is a full month.
      The amount is rounded to the nearest cent, half a cent rounding up.
      Tuition is due by tuition_due_day of the month; when any part of a month's tuition is still unpaid after the due day, one tuition_late_fee posts tuition_late_fee_offset_days after it, payments being applied to the oldest open charge first.
      Enrollment types with a monthly_tuition of 0.00 post no tuition.
    eligibility:
      - id: tuition_on_open_enrollment
        applies_to: [enroll_tuition_charge]
        kind: state
        condition: "Tuition posts only on an enrollment in status provisional or enrolled."
        evidence_fields: [enrollments.status, enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.enrollment_id]
          action_bindings:
            enrollments.enrollment_id: enrollment_id
        state_contract:
          field: enrollments.status
          allowed: [provisional, enrolled]
    params:
      per_tier:
        "Attendance Zone Enrollment": {monthly_tuition: "=monthly_tuition"}
        "Intra-District Transfer (Space Available)": {monthly_tuition: "=monthly_tuition"}
        "Intra-District Transfer (Employee Child)": {monthly_tuition: "=monthly_tuition"}
        "Non-Resident Transfer": {monthly_tuition: "=monthly_tuition"}
        "Choice Program Enrollment": {monthly_tuition: "=monthly_tuition"}
        "Pre-Kindergarten (State-Eligible)": {monthly_tuition: "=monthly_tuition"}
        "Pre-Kindergarten (Tuition-Based)": {monthly_tuition: "=monthly_tuition"}
    formula:
      sibling_pct: "tuition_sibling_discount_pct if sibling_discount_applied == True else 0"
      proration_pct: "half_month_rate_pct if proration == 'half_month' else 100"
      amount: "round(monthly_tuition * (1 - sibling_pct / 100) * proration_pct / 100, 2)"

  - id: enroll_tuition_payments_and_refunds
    subject: [enroll_tuition_payment, enroll_tuition_credit, enroll_tuition_refund]
    rule: >-
      Tuition is paid by the methods in accepted_payment_methods and is applied to the enrollment's oldest open charge first; a payment never moves to a sibling's enrollment.
      When the family gives written notice of withdrawal from tuition-based Pre-K (a withdrawal_notice document logged on the enrollment, its received_date being the notice date), tuition stops after tuition_withdrawal_notice_days calendar days from the notice date (day 0): a month that begins after the later of that day and the withdrawal date is not owed, and a charge already posted for such a month is credited in full with credit_reason withdrawal_after_notice.
      An enrollment withdrawn without notice owes every month that began on or before the last day of the notice period counted from the withdrawal date.
      A credit balance is refunded by district check within credit_balance_refund_days calendar days after the withdrawal date or the year end, and a refund is issued only on an enrollment in status withdrawn or year_completed.
    eligibility:
      - id: refund_after_close
        applies_to: [enroll_tuition_refund]
        kind: state
        condition: "a refund is issued only on an enrollment in status withdrawn or year_completed."
        evidence_fields: [enrollments.status, enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.enrollment_id]
          action_bindings:
            enrollments.enrollment_id: enrollment_id
        state_contract:
          field: enrollments.status
          allowed: [withdrawn, year_completed]

  - id: enroll_withdrawal_and_year_end
    subject: [enroll_withdrawal, enroll_year_end]
    rule: >-
      Only the parent or guardian of record signs the district withdrawal form (withdrawal_signer); the support desk explains the form and the leaver reasons but the withdrawal is the family's own action.
      The withdrawal takes the last day of attendance as its withdrawal_date (withdrawal_effective_basis), and the leaver_reason is the one the family states on the form.
      A district withdrawal ends the student's other district programs on the same date: the School Nutrition meal account becomes inactive, Student Transportation eligibility ends with end_reason district_withdrawal, and an open Creek Kids Club enrollment ends.
      At the close of the school year every enrolled record is completed; a grade 12 graduate is completed with leaver_reason graduated.
    eligibility: []
