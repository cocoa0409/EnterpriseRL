      direct_certification_programs: ["snap", "tanf", "fdpir", "medicaid"]
      status_precedence: 1

events:
  - type: meals_account_open
    target: meal_accounts
    mutation: create
    meaning: "A meal account is opened for a student entering the district."
    grain: "One row per student; the account follows the student across school years."
    fields:
      customer_id: "Household of the student."
      student_id: "Student the account belongs to."
      variant_name: "Meal status on opening (Paid Meal Status unless a determination already reaches the student)."
      campus: "Campus whose cafeteria the student uses."
      opened_date: "Date the account was opened."
    triggers: []
  - type: meals_benefit_increase
    target: meal_accounts
    mutation: update
    meaning: "A determination raises the student's meal status (paid to reduced or free, reduced to free, or carryover to a current-year status of equal or higher benefit)."
    grain: "One row per determination applied to one student."
    fields:
      variant_name: "New official meal status."
      benefit_effective_date: "Date the new status takes effect."
      meal_benefit_application_id: "Household application the determination rests on; empty for direct certification or a categorical designation."
    triggers:
      - event: meals:meals_benefit_notice
        map: {notice_date: benefit_effective_date, notice_type: approval_letter}
  - type: meals_benefit_decrease
    target: meal_accounts
    mutation: update
    meaning: "The student's meal status is lowered after verification, at the end of the carryover period, or on a new determination of lower benefit."
    grain: "One row per status reduction applied to one student."
    fields:
      variant_name: "New official meal status."
      benefit_effective_date: "Date the lower status takes effect."
      decrease_reason: "verification_result, carryover_expired or new_determination."
    triggers: []
  - type: meals_campus_change
    target: meal_accounts
    mutation: update
    meaning: "The account's cafeteria campus follows a change of the student's campus."
    grain: "One row per campus change."
    fields:
      campus: "New campus."
    triggers: []
  - type: meals_account_inactivate
    target: meal_accounts
    mutation: {transition: {from: active, to: inactive}}
    meaning: "The account becomes inactive on the student's withdrawal or graduation."
    grain: "One row per transaction."
    fields:
      inactive_date: "Date the account became inactive, the last day of attendance."
    triggers: []
  - type: meals_account_reactivate
    target: meal_accounts
    mutation: {transition: {from: inactive, to: active}}
    meaning: "An inactive account is reactivated when the student re-enrolls."
    grain: "One row per transaction."
    fields:
      campus: "Campus of the new enrollment."
      inactive_date: "Cleared to empty."
    triggers: []
  - type: meals_account_close
    target: meal_accounts
    mutation: {transition: {from: inactive, to: closed}}
    meaning: "An inactive account with a zero balance is closed."
    grain: "One row per transaction."
    fields:
      closed_date: "Date the account was closed."
    triggers: []
  - type: meals_deposit
    target: meal_transactions
    meaning: "Money is added to the meal account online or at the cafeteria register."
    grain: "One row per deposit receipt."
    distinguish_by: [deposit_reference]
    fields:
      amount: "Amount credited to the account, positive USD, excluding any processor convenience fee."
      transaction_date: "Date the deposit posted."
      deposit_method: "online_card, cash_cafeteria or check_cafeteria."
      deposit_reference: "Online confirmation number or cafeteria receipt number exactly as printed."
    account: meal_account_balance
    direction: in
    triggers: []
  - type: meals_purchase
    target: meal_transactions
    meaning: "A meal or item is rung up at the cafeteria point of sale and charged to the account."
    grain: "One row per point-of-sale line."
    distinguish_by: [pos_receipt_number, meal_type]
    fields:
      amount: "Charge for the line, positive USD (0.00 when a reimbursable meal is served at no charge, which still records the meal served)."
      transaction_date: "Service date."
      meal_type: "breakfast, lunch, second_meal, milk_only or a_la_carte."
      price_basis: "free, reduced, paid, cep_no_charge or a_la_carte_price."
      pos_receipt_number: "Point-of-sale receipt number exactly as printed."
    account: meal_account_balance
    direction: out
    triggers: []
  - type: meals_purchase_void
    target: meal_transactions
    meaning: "A purchase line is reversed by a cashier void or an upheld dispute or status correction."
    grain: "One row per reversed purchase line."
    distinguish_by: [source_meal_transaction_id]
    fields:
      amount: "Amount restored, positive USD, equal to the reversed line's charge."
      transaction_date: "Date of the reversal."
      source_meal_transaction_id: "Reference of the purchase line reversed."
      void_reason: "cashier_void, dispute_upheld or status_correction."
    account: meal_account_balance
    direction: in
    triggers: []
  - type: meals_refund
    target: meal_transactions
    meaning: "A positive balance is refunded to the household by district check."
    grain: "One row per refund check."
    distinguish_by: [transaction_date]
    fields:
      amount: "Amount refunded, positive USD."
      transaction_date: "Date the refund was approved."
      refund_reason: "withdrawal, graduation or household_request."
    account: meal_account_balance
    direction: out
    triggers: []
  - type: meals_transfer_out
    target: meal_transactions
    meaning: "Part or all of a positive balance is moved to a sibling's meal account in the same household."
    grain: "One row per transfer, on the giving account."
    distinguish_by: [counterpart_meal_account_id, transaction_date]
    fields:
      amount: "Amount moved, positive USD."
      transaction_date: "Date of the transfer."
      counterpart_meal_account_id: "Meal account receiving the money."
    account: meal_account_balance
    direction: out
    triggers:
      - event: meals:meals_transfer_in
        map: {amount: amount, transaction_date: transaction_date}
  - type: meals_transfer_in
    target: meal_transactions
    meaning: "Money moved from a sibling's meal account is credited."
    grain: "One row per transfer, on the receiving account."
    distinguish_by: [counterpart_meal_account_id, transaction_date]
    fields:
      amount: "Amount received, positive USD."
      transaction_date: "Date of the transfer."
      counterpart_meal_account_id: "Meal account the money came from."
    account: meal_account_balance
    direction: in
    triggers: []
  - type: meals_returned_deposit
    target: meal_transactions
    meaning: "A check deposit is returned unpaid by the bank and removed from the balance."
    grain: "One row per returned deposit."
    distinguish_by: [source_meal_transaction_id]
    fields:
      amount: "Amount removed, positive USD, equal to the returned deposit."
      transaction_date: "Date the return posted."
      source_meal_transaction_id: "Reference of the deposit returned."
    account: meal_account_balance
    direction: out
    triggers: []
  - type: meals_balance_notice
    target: meal_notices
    meaning: "A balance notice is sent to the household under the unpaid meal charge policy."
    grain: "One row per notice per account per date."
    distinguish_by: [notice_type, notice_date]
    fields:
      notice_type: "low_balance, negative_balance, charge_limit_reached or year_end_collection."
      notice_date: "Date the notice was sent."
      balance_at_notice: "Account balance when the notice was generated, signed USD."
    triggers: []
  - type: meals_benefit_notice
    target: meal_notices
    meaning: "A meal benefit notice is sent: an approval letter, a verification selection letter or an adverse action notice."
    grain: "One row per notice per account per date."
    distinguish_by: [notice_type, notice_date]
    fields:
      notice_type: "approval_letter, verification_selection or adverse_action."
      notice_date: "Date the notice was sent."
    triggers: []

measures:
  - id: meals_msr_balance
    window: "Every transaction on the account from opening up to the moment of the decision (negative balances carry across school years)."
    measure: "Sum of amounts of meals_deposit, meals_purchase_void and meals_transfer_in rows less the sum of meals_purchase, meals_refund, meals_transfer_out and meals_returned_deposit rows on the account."
  - id: meals_msr_returned_checks_year
    window: "The school year, July 1 - June 30, containing the decision date."
    measure: "Count of meals_returned_deposit rows on any meal account of the household whose transaction_date falls in that school year."

policies:
  - id: meals_agg_multi_holding
    subject: [meals_account_open]
    rule: >-
      Each student has one meal account for the whole time the student attends the district, and a household may hold accounts for any number of students.
      A meal account is opened only for a student who has no meal account in status active or inactive.
      A student who re-enrolls keeps the existing account, which is reactivated rather than opened again; a closed account is never reopened and a re-entering student whose account was closed receives a new account.
    eligibility:
      - id: one_account_per_student
        applies_to: [meals_account_open]
        kind: dedup
        condition: "A meal account is opened only for a student who has no meal account in status active or inactive."
        evidence_fields: [meal_accounts.student_id, meal_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.student_id]
          action_bindings:
            meal_accounts.student_id: student_id
        dedup_contract:
          table: meal_accounts
          mode: separate_record
          object_bindings: {student_id: student_id}
          duplicate_filters: {status: [active, inactive]}
          distinct_fields: []
    params:
      max_per_customer: null
      max_accounts_per_student: 1

  - id: meals_agg_household_extension
    subject: [meals_benefit_increase, meals_benefit_decrease]
    rule: >-
      A determination reaches students according to the status's household_extension_basis.
      An approved household application (all_students_in_household) gives its status to every student of the household who has a meal account, from the determination date.
      A direct certification match of any one student in the household with a program in direct_certification_programs extends Free Meal Status (Direct Certification) to every student of the household.
      A categorical designation recorded on a student record (categorical_designation_sources) reaches only that student, and a prior-year carryover reaches only the student who held the prior-year status.
      When several sources apply to the same student, the student holds the status with the lowest status_precedence number, and a source of lower precedence never replaces it; when the higher source ends, the student takes the best status that still applies.
      Statuses of different students in the same household are decided separately, so siblings may hold different statuses.
    eligibility: []
    params:
      per_tier:
        "Paid Meal Status": {status_precedence: "=status_precedence", household_extension_basis: "=household_extension_basis"}
        "Reduced-Price Meal Status (Prior-Year Carryover)": {status_precedence: "=status_precedence", household_extension_basis: "=household_extension_basis"}
        "Reduced-Price Meal Status": {status_precedence: "=status_precedence", household_extension_basis: "=household_extension_basis"}
        "Free Meal Status (Prior-Year Carryover)": {status_precedence: "=status_precedence", household_extension_basis: "=household_extension_basis"}
        "Free Meal Status (Household Application)": {status_precedence: "=status_precedence", household_extension_basis: "=household_extension_basis"}
        "Free Meal Status (Direct Certification)": {status_precedence: "=status_precedence", household_extension_basis: "=household_extension_basis"}
        "Free Meal Status (Categorical Eligibility)": {status_precedence: "=status_precedence", household_extension_basis: "=household_extension_basis"}

  - id: meals_meal_pricing
    subject: [meals_purchase]
    rule: >-
      A reimbursable breakfast or lunch is charged by the student's meal status on the service date and the pricing level of the account's campus (campus_level): elementary campuses use breakfast_charge_elementary and lunch_charge_elementary, middle and high school campuses use breakfast_charge_secondary and lunch_charge_secondary.
      At a campus listed in cep_campuses every student's reimbursable breakfast and lunch are charged cep_meal_charge with price_basis cep_no_charge, whatever the student's status; the CEP override applies to reimbursable meals only.
      Only the first breakfast and the first lunch of a service date are reimbursable; another one the same day is a second_meal charged second_meal_price, and milk bought alone is charged milk_only_price, for every status and at every campus, CEP campuses included.
      A reimbursable meal served at no charge is still rung up as a purchase line of 0.00 so the meal served is recorded.
      A status change applies to meals served on or after its benefit_effective_date and never reprices an earlier meal, except that a meal charged at a higher status rate on or after the effective date is corrected by a void with void_reason status_correction.
    eligibility: []
    params:
      per_tier:
        "Paid Meal Status": {breakfast_charge_elementary: "=breakfast_charge_elementary", lunch_charge_elementary: "=lunch_charge_elementary", breakfast_charge_secondary: "=breakfast_charge_secondary", lunch_charge_secondary: "=lunch_charge_secondary"}
        "Reduced-Price Meal Status (Prior-Year Carryover)": {breakfast_charge_elementary: "=breakfast_charge_elementary", lunch_charge_elementary: "=lunch_charge_elementary", breakfast_charge_secondary: "=breakfast_charge_secondary", lunch_charge_secondary: "=lunch_charge_secondary"}
        "Reduced-Price Meal Status": {breakfast_charge_elementary: "=breakfast_charge_elementary", lunch_charge_elementary: "=lunch_charge_elementary", breakfast_charge_secondary: "=breakfast_charge_secondary", lunch_charge_secondary: "=lunch_charge_secondary"}
        "Free Meal Status (Prior-Year Carryover)": {breakfast_charge_elementary: "=breakfast_charge_elementary", lunch_charge_elementary: "=lunch_charge_elementary", breakfast_charge_secondary: "=breakfast_charge_secondary", lunch_charge_secondary: "=lunch_charge_secondary"}
        "Free Meal Status (Household Application)": {breakfast_charge_elementary: "=breakfast_charge_elementary", lunch_charge_elementary: "=lunch_charge_elementary", breakfast_charge_secondary: "=breakfast_charge_secondary", lunch_charge_secondary: "=lunch_charge_secondary"}
        "Free Meal Status (Direct Certification)": {breakfast_charge_elementary: "=breakfast_charge_elementary", lunch_charge_elementary: "=lunch_charge_elementary", breakfast_charge_secondary: "=breakfast_charge_secondary", lunch_charge_secondary: "=lunch_charge_secondary"}
        "Free Meal Status (Categorical Eligibility)": {breakfast_charge_elementary: "=breakfast_charge_elementary", lunch_charge_elementary: "=lunch_charge_elementary", breakfast_charge_secondary: "=breakfast_charge_secondary", lunch_charge_secondary: "=lunch_charge_secondary"}

  - id: meals_unpaid_meal_charges
    subject: [meals_purchase, meals_balance_notice]
    rule: >-
      This is the district's written unpaid meal charge policy under USDA SP 46-2016.
      When meal_charging_allowed is true, a reimbursable meal may be charged when the balance is not enough, until the balance reaches the charge limit of the campus level (charge_limit_elementary, charge_limit_middle or charge_limit_high, read as a negative balance); once the limit is reached the student is still served a reimbursable meal and it is charged (meal_after_charge_limit), and no student is ever given an alternate meal or denied a meal.
      A la carte items, second meals and milk bought alone are sold only when the balance (meals_msr_balance) covers them without falling below zero, for every status (a_la_carte_on_negative_balance).
      A low_balance notice is sent when a purchase leaves the balance at or below low_balance_threshold and still zero or above; a negative_balance notice is sent when the balance first falls below zero and again every negative_balance_notice_interval_days days while it stays below zero; a charge_limit_reached notice is sent on the day the limit is reached.
      Unpaid meal charges carry into the next school year on the same account, a year_end_collection notice is sent for a balance still negative after the last instructional day, and no fee, interest or penalty is ever added to unpaid meal charges.
      Any deposit is applied to unpaid meal charges first, because it simply raises the balance.
    eligibility: []
    measures: [meals_msr_balance]
    params:
      per_tier:
        "Paid Meal Status": {meal_charging_allowed: "=meal_charging_allowed", charge_limit_elementary: "=charge_limit_elementary"}
        "Reduced-Price Meal Status (Prior-Year Carryover)": {meal_charging_allowed: "=meal_charging_allowed", charge_limit_elementary: "=charge_limit_elementary"}
        "Reduced-Price Meal Status": {meal_charging_allowed: "=meal_charging_allowed", charge_limit_elementary: "=charge_limit_elementary"}
        "Free Meal Status (Prior-Year Carryover)": {meal_charging_allowed: "=meal_charging_allowed", charge_limit_elementary: "=charge_limit_elementary"}
        "Free Meal Status (Household Application)": {meal_charging_allowed: "=meal_charging_allowed", charge_limit_elementary: "=charge_limit_elementary"}
        "Free Meal Status (Direct Certification)": {meal_charging_allowed: "=meal_charging_allowed", charge_limit_elementary: "=charge_limit_elementary"}
        "Free Meal Status (Categorical Eligibility)": {meal_charging_allowed: "=meal_charging_allowed", charge_limit_elementary: "=charge_limit_elementary"}

  - id: meals_benefit_effective_dates
    subject: [meals_benefit_increase, meals_benefit_decrease, meals_benefit_notice]
    rule: >-
      A new or higher status takes effect on its determination date (benefit_effective_basis), and an approval letter is sent the same day; a direct certification match or a categorical designation takes effect on the date it is recorded.
      A carryover status lasts through carryover_last_operating_day; when no current-year determination has replaced it by then, the account reverts to carryover_expiry_status the next day with decrease_reason carryover_expired, and no adverse action notice is needed for that reversion.
      A reduction or termination after verification takes effect only when it is no earlier than adverse_action_notice_days after the district sends the adverse action notice, counted in calendar days with the notice date as day 0; until then the student keeps the current status.
      A new household application that determines a lower status than the student currently holds from a source that has not ended (for example a reduced-price application while a direct certification is in force) does not lower the status.
      A household that submits a new application after a reduction is determined again as a new application, and a higher status from it takes effect on its determination date.
    eligibility:
      - id: adverse_action_notice_period
        applies_to: [meals_benefit_decrease]
        kind: time
        condition: "A reduction or termination after verification takes effect only when it is no earlier than adverse_action_notice_days after the district sends the adverse action notice, counted in calendar days with the notice date as day 0; until then the student keeps the current status."
        evidence_fields: [meal_notices.notice_date, meal_notices.notice_type, meal_notices.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_notices.meal_account_id]
          action_bindings:
            meal_notices.meal_account_id: meal_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the district sends the adverse action notice"
          anchor_source: meal_notices.notice_date
          relation: not_before
          duration_source: variants.adverse_action_notice_days
          unit: calendar_days
          counting_rule: "counted in calendar days with the notice date as day 0"
          boundary: inclusive
    params:
      per_tier:
        "Paid Meal Status": {benefit_term: "=benefit_term", verification_subject: "=verification_subject"}
        "Reduced-Price Meal Status (Prior-Year Carryover)": {benefit_term: "=benefit_term", verification_subject: "=verification_subject"}
        "Reduced-Price Meal Status": {benefit_term: "=benefit_term", verification_subject: "=verification_subject"}
        "Free Meal Status (Prior-Year Carryover)": {benefit_term: "=benefit_term", verification_subject: "=verification_subject"}
        "Free Meal Status (Household Application)": {benefit_term: "=benefit_term", verification_subject: "=verification_subject"}
        "Free Meal Status (Direct Certification)": {benefit_term: "=benefit_term", verification_subject: "=verification_subject"}
        "Free Meal Status (Categorical Eligibility)": {benefit_term: "=benefit_term", verification_subject: "=verification_subject"}

  - id: meals_applications_and_verification
    subject: [meals_benefit_increase, meals_benefit_decrease]
    rule: >-
      A household may submit a meal benefit application at any time in the school year (reapplication_anytime), and School Nutrition Services determines it within determination_operating_days operating days; the support desk records a submitted application but never determines it.
      A status that rests on a household application is applied only from an application whose determination is approved_free or approved_reduced.
      By verification_selection_deadline the district selects approved household applications for income verification; only statuses whose verification_subject is true can be selected, and a selected household has verification_response_days calendar days after the selection letter to send documents.
      When verification confirms the status, nothing changes; when it supports a lower status, or the household does not respond, the status is lowered with decrease_reason verification_result under the adverse action notice period of meals_benefit_effective_dates.
      A denied application leaves the current status unchanged.
    eligibility:
      - id: application_approved
        applies_to: [meals_benefit_increase]
        kind: state
        condition: "A status that rests on a household application is applied only from an application whose determination is approved_free or approved_reduced."
        evidence_fields: [meal_benefit_applications.determination, meal_benefit_applications.meal_benefit_application_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_benefit_applications.meal_benefit_application_id]
          action_bindings:
            meal_benefit_applications.meal_benefit_application_id: meal_benefit_application_id
        state_contract:
          field: meal_benefit_applications.determination
          allowed: [approved_free, approved_reduced]

  - id: meals_deposits_and_returns
    subject: [meals_deposit, meals_returned_deposit]
    rule: >-
      Online card deposits are accepted from online_deposit_minimum to online_deposit_maximum per deposit; the payment processor's online_processing_fee is paid by the family to the processor on top of the deposit and is never posted to the meal account.
      Cash and checks are accepted at the cafeteria register by the methods in cafeteria_deposit_methods.
      A deposit may be made to an active or an inactive account (an inactive account takes deposits only to clear unpaid meal charges), never to a closed account.
      A check deposit returned unpaid by the bank is removed from the balance in full, which may make the balance negative.
      After a returned check in the school year (meals_msr_returned_checks_year), check deposits are not accepted for any meal account of the household for the rest of that school year.
    eligibility:
      - id: deposit_to_open_account
        applies_to: [meals_deposit]
        kind: state
        condition: "A deposit may be made to an active or an inactive account (an inactive account takes deposits only to clear unpaid meal charges), never to a closed account."
        evidence_fields: [meal_accounts.status, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [active, inactive]
      - id: no_checks_after_return
        applies_to: [meals_deposit]
        kind: authorization
        condition: "After a returned check in the school year (meals_msr_returned_checks_year), check deposits are not accepted for any meal account of the household for the rest of that school year."
        evidence_fields: [meal_transactions.meal_account_id, meal_transactions.customer_id, meal_transactions.event_type, meal_transactions.transaction_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_transactions.meal_account_id]
          action_bindings:
            meal_transactions.meal_account_id: meal_account_id
    measures: [meals_msr_returned_checks_year]

  - id: meals_refunds_and_transfers
    subject: [meals_refund, meals_transfer_out, meals_transfer_in, meals_account_close]
    rule: >-
      A positive balance is refunded by district check only on an inactive account, after the student withdraws or graduates, on the household's request, when the balance is at least refund_minimum; the check is mailed within refund_processing_days calendar days.
      A balance below refund_minimum, or any positive balance the household prefers to keep in the district, may be moved to a sibling's account.
      A balance is moved only to another meal account of the same household that is in status active.
      A transfer may be made from an active or an inactive account and never exceeds the giving account's positive balance; unpaid meal charges are never transferred.
      A refund always pays out the entire positive balance.
      An inactive account is closed only when its balance (meals_msr_balance) is exactly zero; a positive balance unclaimed for unclaimed_balance_months months after inactivation, with no active sibling account, is applied to the district's student meal assistance fund.
    eligibility:
      - id: refund_on_inactive_account
        applies_to: [meals_refund]
        kind: state
        condition: "A positive balance is refunded by district check only on an inactive account, after the student withdraws or graduates, on the household's request, when the balance is at least refund_minimum; the check is mailed within refund_processing_days calendar days."
        evidence_fields: [meal_accounts.status, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [inactive]
      - id: transfer_within_household
        applies_to: [meals_transfer_out]
        kind: authorization
        condition: "A balance is moved only to another meal account of the same household that is in status active."
        evidence_fields: [meal_accounts.meal_account_id, meal_accounts.customer_id, meal_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
      - id: close_at_zero
        applies_to: [meals_account_close]
        kind: authorization
        condition: "An inactive account is closed only when its balance (meals_msr_balance) is exactly zero; a positive balance unclaimed for unclaimed_balance_months months after inactivation, with no active sibling account, is applied to the district's student meal assistance fund."
        evidence_fields: [meal_transactions.meal_account_id, meal_transactions.event_type, meal_transactions.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_transactions.meal_account_id]
          action_bindings:
            meal_transactions.meal_account_id: meal_account_id
    measures: [meals_msr_balance]

  - id: meals_purchase_corrections
    subject: [meals_purchase_void]
    rule: >-
      A cashier may void a purchase line only on the day it was rung up (cashier_void_same_day_only), with void_reason cashier_void.
      A purchase may be disputed only within purchase_dispute_days after the purchase is rung up, counted in calendar days with the purchase date as day 0, and a dispute raised on the last day is still considered.
      A dispute is upheld when the point-of-sale record shows a line the student was not served, a duplicate ring-up of the same meal, or a charge above the rate of the student's status on the service date; an upheld dispute reverses exactly the disputed line with void_reason dispute_upheld, and a charge above the status rate is reversed with void_reason status_correction.
      A line is reversed once; a dispute over a line already reversed, or over a charge that matches the status rate, is declined.
    eligibility:
      - id: dispute_window
        applies_to: [meals_purchase_void]
        kind: time
        condition: "A purchase may be disputed only within purchase_dispute_days after the purchase is rung up, counted in calendar days with the purchase date as day 0, and a dispute raised on the last day is still considered."
        evidence_fields: [meal_transactions.transaction_date, meal_transactions.meal_transaction_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_transactions.meal_transaction_id]
          action_bindings:
            meal_transactions.meal_transaction_id: source_meal_transaction_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase is rung up"
          anchor_source: meal_transactions.transaction_date
          relation: not_after
          duration_source: variants.purchase_dispute_days
          unit: calendar_days
          counting_rule: "counted in calendar days with the purchase date as day 0"
          boundary: inclusive

  - id: meals_account_status
    subject: [meals_purchase, meals_account_inactivate, meals_account_reactivate, meals_campus_change, meals_account_open]
    rule: >-
      Meals and items are rung up only on an account in status active.
      The account becomes inactive on the last day of attendance when the student withdraws from the district or graduates, and its balance stays on the account.
      An inactive account is reactivated only when the student again holds a district enrollment record in status provisional or enrolled, and the account's campus becomes the campus of that enrollment.
      When the student's enrollment changes campus, the account's campus follows from the same date, which changes the campus pricing level and the CEP override from that date.
      A new account opens on Paid Meal Status unless a determination of the household already reaches the student under meals_agg_household_extension.
    eligibility:
      - id: purchase_on_active_account
        applies_to: [meals_purchase]
        kind: state
        condition: "Meals and items are rung up only on an account in status active."
        evidence_fields: [meal_accounts.status, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [active]
      - id: reactivation_needs_enrollment
        applies_to: [meals_account_reactivate]
        kind: state
        condition: "An inactive account is reactivated only when the student again holds a district enrollment record in status provisional or enrolled, and the account's campus becomes the campus of that enrollment."
        evidence_fields: [meal_accounts.meal_account_id, meal_accounts.student_id, enrollments.student_id, enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: enrollments.status
          allowed: [provisional, enrolled]
