# District-owned instrument usage for band and orchestra students — Calloway Creek ISD Fine Arts.
category: music
display_name: Fine Arts Instrument Usage Program

binding:
  holding_table: instrument_checkouts
  event_tables: [instrument_ledger, instrument_condition_log]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [checked_out, in_repair, overdue, returned, lost]
  transitions:
    - {from: checked_out, to: in_repair, by: agent, means: "The instrument goes to the district's contracted repair shop."}
    - {from: in_repair, to: checked_out, by: system, means: "The repaired instrument is returned to the student."}
    - {from: checked_out, to: returned, by: agent, means: "The instrument is turned in to the director and its condition is recorded."}
    - {from: checked_out, to: overdue, by: system, means: "The instrument was not turned in by its due-back date."}
    - {from: overdue, to: returned, by: agent, means: "An overdue instrument is turned in."}
    - {from: checked_out, to: lost, by: user, means: "The family reports the instrument lost or stolen."}
    - {from: overdue, to: lost, by: system, means: "An instrument still overdue after the presumed-lost period is treated as lost."}
    - {from: lost, to: returned, by: agent, means: "An instrument treated as lost is found and turned in."}

accounts:
  - key: instrument_charges_due
    unit: USD
    meaning: "Amount the household owes on one instrument checkout; usage, late, cleaning, repair and replacement charges and refunds disbursed increase it, payments and credits decrease it."

parameter_schema:
  instrument_family: "Instrument family of the usage type; enum percussion | woodwind | brass | strings | large_instrument | summer."
  instruments_covered: "District-owned instruments loaned under the type; list of instrument codes."
  eligible_grades: "Grades admitted; list of grade codes."
  ensemble_course_required: "Ensemble course the student must be scheduled in; list of enum band | orchestra."
  usage_fee: "Usage fee for the fee period, USD."
  fee_period: "Period the usage fee covers; enum school_year | summer."
  mid_year_start_date: "Date on or after which a school-year checkout is charged the mid-year rate, MM-DD."
  mid_year_fee_pct: "Share of the usage fee charged for a checkout starting on or after mid_year_start_date, percent."
  free_meal_waiver_pct: "Share of the usage fee waived for a student holding any Free Meal Status tier, percent."
  reduced_meal_waiver_pct: "Share of the usage fee waived for a student holding any Reduced-Price Meal Status tier, percent."
  household_usage_fee_cap: "Maximum usage fees per household per school year after waivers, USD."
  fee_due_days: "Calendar days after the usage fee posts within which it must be settled; integer."
  home_and_school_pair: "Whether the student receives one instrument for home and one kept at school; boolean."
  max_checkouts_per_student: "Most open checkouts a student may hold at once; integer."
  agreement_signature_required: "Whether the parent signs the instrument usage agreement before checkout; boolean."
  inspection_at_checkout: "Whether the instrument's condition is recorded at checkout; boolean."
  maintenance_included: "Whether routine maintenance and normal wear repairs are covered by the usage fee; boolean."
  annual_cleaning_included: "Whether the end-of-year chemical cleaning is covered by the usage fee; boolean."
  unclean_return_fee: "Fee when an instrument is returned without the required cleaning or with personal items left in the case, USD."
  due_back_date: "Date the instrument is due back for the fee period, MM-DD."
  late_return_fee_per_day: "Late fee per calendar day after the due-back date, USD."
  late_return_fee_cap: "Maximum late fee per checkout, USD."
  presumed_lost_days: "Calendar days after the due-back date after which an unreturned instrument is treated as lost, the due-back date being day 0; integer."
  withdrawal_return_days: "Calendar days after the last day of attendance within which the instrument must be returned when the student withdraws; integer."
  minor_repair_charge: "Charge for a minor repair caused by mishandling (pads, corks, valve or slide alignment, bridge or string replacement), USD."
  major_repair_charge: "Charge for a major repair caused by mishandling (dents, cracked body, broken neck or seam), USD."
  replacement_cost: "Charge for an instrument lost or not returned, USD (for a pair, per instrument)."
  case_replacement_cost: "Charge for a lost or destroyed case, USD."
  theft_with_report_charge: "Charge for a stolen instrument when a police report number is given within the report window, USD."
  theft_report_days: "Calendar days after the theft within which the police report number must be given, the theft date being day 0; integer."
  repair_turnaround_days: "Calendar days the repair shop takes; integer."
  loaner_during_repair: "Whether a loaner instrument is issued during repair; boolean."
  student_supplied_items: "Items the student buys and keeps; list of item codes."
  summer_eligibility_rule: "Who may check out over the summer; enum enrolled_in_ensemble_next_school_year | not_applicable."
  payment_plan_threshold: "Smallest charge total on a checkout for which monthly payments are offered, USD."
  payment_plan_months: "Number of monthly payments in a payment plan; integer."
  accepted_payment_methods: "Payment methods accepted; list of enum online_card | ach_bank_draft | personal_check | money_order."
  credit_balance_refund_days: "Calendar days after a checkout closes within which a credit balance is refunded; integer."
  usage_fee_refundable_days: "Calendar days after checkout within which a returned instrument credits the usage fee, the checkout date being day 0; integer."
  usage_fee_refund_pct: "Share of the usage fee net of waivers credited for a return inside the refund window, percent."
  condition_grades: "Condition grades used on condition reports; list of enum excellent | good | fair | needs_repair."
  damage_assessment_basis: "How damage at return is judged; enum compared_with_checkout_condition_report."
  normal_wear_charge: "Charge for normal wear found at return, USD."
  instrument_assignment_basis: "How instruments are assigned; enum director_assignment_by_ensemble_need."
  fee_includes_insurance: "Whether the usage fee insures the instrument against loss or theft; boolean."
  case_required: "Whether the instrument is always carried in its district case; boolean."
  director_approval_required: "Whether the ensemble director must approve the checkout; boolean."
  marching_season_use: "Whether the instrument may be used in marching season; boolean."

