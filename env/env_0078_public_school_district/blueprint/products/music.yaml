events:
  - type: music_checkout
    target: instrument_checkouts
    mutation: create
    meaning: "The director checks a district-owned instrument out to a student for the school year or the summer."
    grain: "One row per checkout of one instrument assignment (a home-and-school pair is one checkout)."
    fields:
      customer_id: "Household."
      student_id: "Student."
      variant_name: "Official usage type."
      campus: "Campus whose fine arts program owns the instrument."
      school_year: "School year, YYYY-YY (the summer belongs to the school year that just ended)."
      instrument_type: "Instrument code."
      instrument_serial: "Serial number of the instrument (for a pair, the home instrument)."
      checkout_date: "Date checked out."
      due_back_date: "Date due back."
    triggers:
      - event: music:music_usage_fee
        map: {posted_date: checkout_date}
      - event: music:music_condition_report
        map: {report_date: checkout_date, report_point: checkout}
  - type: music_repair_intake
    target: instrument_checkouts
    mutation: {transition: {from: checked_out, to: in_repair}}
    meaning: "The instrument is sent to the repair shop."
    grain: "One row per transaction."
    fields:
      repair_sent_date: "Date sent."
    triggers: []
  - type: music_repair_complete
    target: instrument_checkouts
    mutation: {transition: {from: in_repair, to: checked_out}}
    meaning: "The repaired instrument is returned to the student."
    grain: "One row per transaction."
    fields:
      repair_sent_date: "Cleared to empty."
    triggers: []
  - type: music_return
    target: instrument_checkouts
    mutation: {transition: {from: checked_out, to: returned}}
    meaning: "The instrument is turned in by its due-back date."
    grain: "One row per transaction."
    fields:
      return_date: "Date turned in."
    triggers:
      - event: music:music_condition_report
        map: {report_date: return_date, report_point: return}
  - type: music_overdue
    target: instrument_checkouts
    mutation: {transition: {from: checked_out, to: overdue}}
    meaning: "The instrument is past its due-back date."
    grain: "One row per transaction."
    fields:
      overdue_date: "Day after the due-back date."
    triggers: []
  - type: music_late_return
    target: instrument_checkouts
    mutation: {transition: {from: overdue, to: returned}}
    meaning: "An overdue instrument is turned in."
    grain: "One row per transaction."
    fields:
      return_date: "Date turned in."
    triggers:
      - event: music:music_late_fee
        map: {posted_date: return_date}
      - event: music:music_condition_report
        map: {report_date: return_date, report_point: return}
  - type: music_loss_report
    target: instrument_checkouts
    mutation: {transition: {from: checked_out, to: lost}}
    meaning: "The family reports the instrument lost or stolen."
    grain: "One row per transaction."
    fields:
      loss_date: "Date of the report."
      police_report_number: "Police report number for a theft, exactly as given."
    triggers: []
  - type: music_presumed_lost
    target: instrument_checkouts
    mutation: {transition: {from: overdue, to: lost}}
    meaning: "An instrument still overdue after the presumed-lost period is treated as lost."
    grain: "One row per transaction."
    fields:
      loss_date: "Date it was treated as lost."
    triggers:
      - event: music:music_replacement_charge
        map: {posted_date: loss_date, charge_type: unreturned_instrument}
  - type: music_found
    target: instrument_checkouts
    mutation: {transition: {from: lost, to: returned}}
    meaning: "An instrument treated as lost is found and turned in."
    grain: "One row per transaction."
    fields:
      return_date: "Date turned in."
    triggers:
      - event: music:music_condition_report
        map: {report_date: return_date, report_point: return}
  - type: music_usage_fee
    target: instrument_ledger
    meaning: "The usage fee for the fee period is posted."
    grain: "One row per checkout."
    distinguish_by: [charge_type]
    fields:
      amount: "Usage fee before waivers, positive USD."
      posted_date: "Date posted."
      charge_type: "usage_fee."
    account: instrument_charges_due
    direction: in
    triggers: []
  - type: music_late_fee
    target: instrument_ledger
    meaning: "The late return fee is posted when an overdue instrument is turned in."
    grain: "One row per checkout."
    distinguish_by: [charge_type]
    fields:
      amount: "Late fee, positive USD."
      posted_date: "Date posted."
      charge_type: "late_return_fee."
    account: instrument_charges_due
    direction: in
    triggers: []
  - type: music_cleaning_fee
    target: instrument_ledger
    meaning: "The fee for an instrument returned uncleaned or with personal items in the case is posted."
    grain: "One row per checkout."
    distinguish_by: [charge_type]
    fields:
      amount: "Fee, positive USD."
      posted_date: "Date posted."
      charge_type: "unclean_return_fee."
    account: instrument_charges_due
    direction: in
    triggers: []
  - type: music_repair_charge
    target: instrument_ledger
    meaning: "A repair caused by mishandling is charged."
    grain: "One row per repair order."
    distinguish_by: [repair_order_number]
    fields:
      amount: "Repair charge, positive USD."
      posted_date: "Date posted."
      charge_type: "minor_repair or major_repair."
      repair_order_number: "Repair shop order number exactly as printed."
    account: instrument_charges_due
    direction: in
    triggers: []
  - type: music_replacement_charge
    target: instrument_ledger
    meaning: "The replacement charge for a lost, stolen or unreturned instrument or case is posted."
    grain: "One row per checkout per item charged."
    distinguish_by: [charge_type]
    fields:
      amount: "Charge, positive USD."
      posted_date: "Date posted."
      charge_type: "lost_instrument, stolen_instrument_reported, unreturned_instrument or case_replacement."
    account: instrument_charges_due
    direction: in
    triggers: []
  - type: music_payment
    target: instrument_ledger
    meaning: "A family payment is applied to the checkout."
    grain: "One row per payment confirmation."
    distinguish_by: [payment_reference]
    fields:
      amount: "Payment, positive USD."
      posted_date: "Date posted."
      payment_method: "online_card, ach_bank_draft, personal_check or money_order."
      payment_reference: "Payment confirmation number exactly as issued."
    account: instrument_charges_due
    direction: out
    triggers: []
  - type: music_credit
    target: instrument_ledger
    meaning: "A credit offsets one specific charge (fee waiver, household cap, early return, instrument found or billing correction)."
    grain: "One row per credited source charge per reason."
    distinguish_by: [source_instrument_ledger_id, credit_reason]
    fields:
      amount: "Credit, positive USD."
      posted_date: "Date posted."
      credit_reason: "free_meal_waiver, reduced_meal_waiver, household_cap, early_return, instrument_found or billing_correction."
      source_instrument_ledger_id: "Reference of the charge credited."
    account: instrument_charges_due
    direction: out
    triggers: []
  - type: music_refund
    target: instrument_ledger
    meaning: "A credit balance on a closed checkout is refunded by district check."
    grain: "One row per refund issued."
    distinguish_by: [posted_date]
    fields:
      amount: "Refund, positive USD."
      posted_date: "Date issued."
    account: instrument_charges_due
    direction: in
    triggers: []
  - type: music_condition_report
    target: instrument_condition_log
    meaning: "The director records the instrument's condition at checkout or return."
    grain: "One row per checkout per report point."
    distinguish_by: [report_point]
    fields:
      report_date: "Date of the report."
      report_point: "checkout or return."
      condition_grade: "excellent, good, fair or needs_repair."
    triggers: []

measures:
  - id: music_msr_household_usage_fees_year
    window: "The school year of the usage fee being charged."
    measure: "Sum of music_usage_fee amounts on the household's other checkouts of that school year posted earlier, less music_credit amounts with credit_reason free_meal_waiver, reduced_meal_waiver or household_cap against them."
  - id: music_msr_days_late
    window: "From the day after the due-back date to the return date."
    measure: "Calendar days between the checkout's due_back_date and its return_date."

policies:
  - id: music_agg_multi_holding
    subject: [music_checkout]
    rule: >-
      A household may hold instrument checkouts for any number of its students.
      An instrument is checked out only when the student holds fewer than max_checkouts_per_student open checkouts (status checked_out, in_repair or overdue).
      A home-and-school pair under Large Instrument Usage (Tuba, Cello, String Bass) counts as one checkout and posts one usage fee.
    eligibility:
      - id: open_checkout_limit
        applies_to: [music_checkout]
        kind: dedup
        condition: "An instrument is checked out only when the student holds fewer than max_checkouts_per_student open checkouts (status checked_out, in_repair or overdue)."
        evidence_fields: [instrument_checkouts.student_id, instrument_checkouts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [instrument_checkouts.student_id]
          action_bindings:
            instrument_checkouts.student_id: student_id
        dedup_contract:
          table: instrument_checkouts
          mode: separate_record
          object_bindings: {student_id: student_id}
          duplicate_filters: {status: [checked_out, in_repair, overdue]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: music_agg_household_fee_cap
    subject: [music_usage_fee, music_credit]
    rule: >-
      Usage fees net of meal-status waivers are capped per household per school year at household_usage_fee_cap (music_msr_household_usage_fees_year); the excess of a new usage fee over the remaining cap room is credited with credit_reason household_cap.
      Summer checkouts belong to the school year that just ended, and late, cleaning, repair and replacement charges never count toward the cap.
    eligibility: []
    measures: [music_msr_household_usage_fees_year]
    formula:
      cap_credit: "max(0, music_msr_household_usage_fees_year + amount - household_usage_fee_cap)"

  - id: music_usage_fees
    subject: [music_usage_fee, music_credit]
    rule: >-
      The usage fee posts on the checkout date at usage_fee, or at mid_year_fee_pct of it for a school-year checkout on or after mid_year_start_date; the fee covers routine maintenance and the year-end cleaning when maintenance_included and annual_cleaning_included are true, and does not insure the instrument (fee_includes_insurance).
      Waivers follow Texas Education Code 11.158 through the student's School Nutrition meal status on the posting date: free_meal_waiver_pct with credit_reason free_meal_waiver for any Free Meal Status tier, reduced_meal_waiver_pct with credit_reason reduced_meal_waiver for any Reduced-Price Meal Status tier, rounded to the nearest cent, half a cent rounding up.
      An instrument turned in within usage_fee_refundable_days calendar days after checkout credits usage_fee_refund_pct of the fee net of waivers with credit_reason early_return; later returns earn no credit.
    eligibility: []
    params:
      per_tier:
        "Percussion Equipment Usage": {usage_fee: "=usage_fee", fee_period: "=fee_period"}
        "Woodwind Instrument Usage": {usage_fee: "=usage_fee", fee_period: "=fee_period"}
        "Brass Instrument Usage": {usage_fee: "=usage_fee", fee_period: "=fee_period"}
        "Orchestra String Instrument Usage": {usage_fee: "=usage_fee", fee_period: "=fee_period"}
        "Large Instrument Usage (Tuba, Cello, String Bass)": {usage_fee: "=usage_fee", fee_period: "=fee_period"}
        "Summer Instrument Checkout": {usage_fee: "=usage_fee", fee_period: "=fee_period"}

  - id: music_checkout_requirements
    subject: [music_checkout, music_condition_report]
    rule: >-
      An instrument is checked out only to a student whose district enrollment record is in status provisional or enrolled and who is scheduled in an ensemble course listed in ensemble_course_required; a Summer Instrument Checkout requires enrollment in the ensemble for the next school year.
      The parent signs the instrument usage agreement and the ensemble director approves and assigns the instrument by ensemble need (instrument_assignment_basis); families do not choose a specific instrument.
      The director records a condition report at checkout and at return using condition_grades, and damage at return is judged against the checkout report.
      Items in student_supplied_items are bought by the family and are never loaned.
    eligibility:
      - id: enrolled_student
        applies_to: [music_checkout]
        kind: state
        condition: "An instrument is checked out only to a student whose district enrollment record is in status provisional or enrolled and who is scheduled in an ensemble course listed in ensemble_course_required; a Summer Instrument Checkout requires enrollment in the ensemble for the next school year."
        evidence_fields: [enrollments.status, enrollments.student_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.student_id]
          action_bindings:
            enrollments.student_id: student_id
        state_contract:
          field: enrollments.status
          allowed: [provisional, enrolled]

  - id: music_returns_and_late_fees
    subject: [music_return, music_overdue, music_late_return, music_late_fee, music_cleaning_fee, music_presumed_lost]
    rule: >-
      An instrument is due back on its due_back_date, and within withdrawal_return_days calendar days after the last day of attendance when the student withdraws.
      An instrument turned in after its due-back date is charged late_return_fee_per_day for each calendar day late (music_msr_days_late), never more than late_return_fee_cap.
      An instrument returned uncleaned or with personal items in the case is charged unclean_return_fee.
      An instrument still not turned in presumed_lost_days calendar days after the due-back date is treated as lost and charged replacement_cost as an unreturned instrument, per instrument for a pair.
    eligibility: []
    measures: [music_msr_days_late]
    formula:
      late_fee: "min(late_return_fee_cap, music_msr_days_late * late_return_fee_per_day)"

  - id: music_damage_and_repair
    subject: [music_repair_intake, music_repair_complete, music_repair_charge]
    rule: >-
      Normal wear is repaired at no charge (normal_wear_charge) because maintenance is part of the usage fee.
      Damage the director attributes to mishandling, judged against the checkout condition report, is charged minor_repair_charge for a minor repair or major_repair_charge for a major repair, once per repair order.
      Repairs take repair_turnaround_days calendar days, and a loaner instrument is issued meanwhile when loaner_during_repair is true.
    eligibility: []

  - id: music_loss_and_theft
    subject: [music_loss_report, music_replacement_charge, music_found, music_credit]
    rule: >-
      Only the family reports an instrument lost or stolen; the support desk records the report and the family confirms it.
      A lost instrument is charged replacement_cost, and a lost case case_replacement_cost.
      A stolen instrument is charged theft_with_report_charge instead when a police report number is given within theft_report_days calendar days after the theft, the theft date being day 0; otherwise it is charged as lost.
      An instrument found and turned in within the same school year credits its replacement charge in full with credit_reason instrument_found, less any late fee and repair charge it then incurs.
    eligibility: []

  - id: music_payments_and_refunds
    subject: [music_payment, music_refund]
    rule: >-
      Charges are paid by the methods in accepted_payment_methods and are applied to the checkout's oldest open charge first.
      Charges totalling at least payment_plan_threshold may be paid in payment_plan_months equal monthly payments, the last carrying any remaining cents.
      A credit balance is refunded by district check within credit_balance_refund_days calendar days, and a refund is issued only on a checkout in status returned.
    eligibility:
      - id: refund_after_close
        applies_to: [music_refund]
        kind: state
        condition: "a refund is issued only on a checkout in status returned."
        evidence_fields: [instrument_checkouts.status, instrument_checkouts.instrument_checkout_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [instrument_checkouts.instrument_checkout_id]
          action_bindings:
            instrument_checkouts.instrument_checkout_id: instrument_checkout_id
        state_contract:
          field: instrument_checkouts.status
          allowed: [returned]
