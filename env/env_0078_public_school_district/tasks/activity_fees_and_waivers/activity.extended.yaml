  factors:
  - id: plan_count_tier
    effect: parameter
    decides: plan_count
    bindings:
    - pc_due_dates
    - plan_count
    ladder:
    - when: installment_plan_available is true AND the plan total is at least installment_threshold AND fewer than installment_count monthly due dates fall from the first installment through plan_end_date
      value: that number of due dates
    - when: installment_plan_available is false OR the plan total is below installment_threshold
      value: '1'
    - when: otherwise
      value: P('installment_count')
    baseline:
      plan_count: P('installment_count')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: travel_placement_rule
    effect: method
    decides: travel_up_front
    bindings:
    - tp_activity
    - tp_next_trip
    - tp_days
    - tp_pretrip_dates
    - travel_up_front
    ladder:
    - when: the first of the ensemble's trips on or after the first installment is no more than trip_full_days days after it
      method: the whole travel fee net is due up front
    - when: that trip is more than trip_full_days but no more than trip_split_days days away
      method: the first installment carries the travel fee net divided by the monthly due dates up to the trip, rounded down to the cent
    - when: otherwise, or no trip remains
      method: nothing up front; the travel fee stays in the plan total
    baseline:
      travel_up_front: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: plan_lead_tier
    effect: parameter
    decides: lead_up_front_pct
    bindings:
    - pl_days
    - lead_up_front_pct
    ladder:
    - when: more than plan_lead_long_days calendar days from the registration date to the first installment
      value: K('plan_lead_long_pct')
    - when: more than plan_lead_mid_days but no more than plan_lead_long_days days
      value: K('plan_lead_mid_pct')
    - when: otherwise
      value: '0'
    baseline:
      lead_up_front_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: attire_placement_tier
    effect: parameter
    decides: attire_up_front_pct
    bindings:
    - ap_posted_on
    - ap_next_concert
    - ap_days
    - attire_up_front_pct
    ladder:
    - when: the first of the ensemble's concerts on or after the attire package's posting date is fewer than attire_short_days days away
      value: '100'
    - when: that concert is attire_short_days or more but fewer than attire_mid_days days away
      value: K('attire_mid_pct')
    - when: otherwise, or no concert remains
      value: '0'
    baseline:
      attire_up_front_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: In the standard first installment the plan total, the participation fee, the travel fee and the concert attire package net of credits, is divided by installment_count and rounded down to the cent.
    params:
    - installment_count
  inputs:
    history:
    - table: activity_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: activity_fee
    - table: activity_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: activity_fee_credit
    cross_category: []
