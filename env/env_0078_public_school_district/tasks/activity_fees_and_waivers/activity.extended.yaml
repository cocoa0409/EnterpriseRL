events:
  - type: activity_registration
    target: activity_participations
    mutation: create
    meaning: "A family registers a student for one activity for one season, school year or trip."
    grain: "One row per student per activity per season per school year."
    fields:
      customer_id: "Household registering."
      student_id: "Student registered."
      variant_name: "Official activity type."
      campus: "Campus whose program the student joins."
      school_year: "School year, YYYY-YY."
      activity_name: "Activity code."
      season: "fall, winter, spring or year_round."
      registration_date: "Date the registration was received."
      departure_date: "Departure date of a trip; empty for other types."
    triggers:
      - event: activity:activity_fee
        map: {posted_date: registration_date}
  - type: activity_clearance
    target: activity_participations
    mutation: {transition: {from: registered, to: cleared}}
    meaning: "The athletic or activity coordinator clears the student to participate."
    grain: "One row per transaction."
    fields:
      clearance_date: "Date of clearance."
      competition_level: "varsity, sub_varsity or not_applicable."
      installment_plan: "Whether the fees are being paid on the installment plan."
    triggers: []
  - type: activity_registration_cancel
    target: activity_participations
    mutation: {transition: {from: registered, to: withdrawn}}
    meaning: "The family cancels a registration before clearance."
    grain: "One row per transaction."
    fields:
      end_date: "Date of cancellation."
      end_reason: "family_withdrawal."
    triggers: []
  - type: activity_withdrawal
    target: activity_participations
    mutation: {transition: {from: cleared, to: withdrawn}}
    meaning: "The family withdraws a cleared student from the activity."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of participation."
      end_reason: "family_withdrawal or season_ending_injury."
    triggers: []
  - type: activity_cut
    target: activity_participations
    mutation: {transition: {from: cleared, to: cut}}
    meaning: "The student is not selected at tryouts."
    grain: "One row per transaction."
    fields:
      end_date: "Date the roster was posted."
      end_reason: "cut_at_tryouts."
