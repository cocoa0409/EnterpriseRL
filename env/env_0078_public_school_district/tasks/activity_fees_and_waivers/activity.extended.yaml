  rule: 'For a Fine Arts Performing Ensemble participation for the 2026-27 school year whose registration date is after 2026-08-03, the participation fee posts on the date the parent or guardian submits the signed participation packet, at the amount the 2026-27 Fine Arts fee schedule below sets, its travel fee posts only under the Fine Arts travel fee schedule and its uniform package only under the Fine Arts concert attire schedule; a UIL Academic and Robotics Team participation for the 2026-27 school year whose registration date is after 2026-08-03 posts its fees under the UIL packet and travel fee schedules; every other participation posts every fee component the type carries as its own fee on the registration date at its catalogue amount, a component whose catalogue amount is 0.00 posting nothing. A Fine Arts Performing Ensemble participation for the 2026-27 school year whose registration date is after 2026-08-03 posts no late registration fee; a UIL Academic and Robotics Team participation for the 2026-27 school year whose registration date is after 2026-08-03 follows the UIL packet schedule on late registration fees; every other registration received later than registration_deadline_days_before_start days before the season''s first practice or event date (season_start_dates), or for a trip later than that many days before departure, also posts late_registration_fee. The packet is the family''s own submission: the parent or guardian signs and submits the parent_permission, code_of_conduct and overnight_travel_permission forms through the district''s online activities registration, and the submission records the three forms and posts the participation fee. The scheduled ensemble fee is participation_fee, rounded to the cent. Adjustments in this schedule are applied in this order: amounts are added together first, the shares are then applied one after the other to that total, never below 0.00, and the result is rounded once, at the end, to the nearest cent with half a cent rounding up. The scheduled ensemble rate is arts_band_rate for band or orchestra when the student''s district enrollment record in status enrolled for the school year shows grade 06 or above, arts_theatre_rate for theatre when that record shows grade 09 or above, and participation_fee otherwise. An ensemble-level amount is added by the student''s district enrollment record in status enrolled for the school year: plus arts_beginner_add when it shows grade 06, minus arts_middle_discount when it shows grade 07 or 08, and nothing otherwise. A campus program amount is added by the campus on the student''s district enrollment record in status enrolled for the school year: plus arts_hollis_add for Hollis Middle School, plus arts_calloway_add for Calloway Creek High School, and nothing otherwise. A residency share applies by the student''s district enrollment record in status enrolled for the school year: arts_nonresident_pct percent for a Non-Resident Transfer, arts_employee_pct percent for an Intra-District Transfer (Employee Child), and 100 percent otherwise. A membership-term share applies by the registration date: a registration date on or after arts_spring_start pays the spring-semester share, a flat arts_spring_join_pct percent; a registration date more than arts_join_grace_days calendar days after arts_first_rehearsal but before arts_spring_start is prorated by whole weeks, the whole weeks from the registration date to arts_last_day out of arts_year_weeks, as a percentage never above 100; and any other registration date pays the full-year share (100 percent).'
