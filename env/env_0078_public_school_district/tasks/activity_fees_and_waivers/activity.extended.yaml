    at_trip_1: The ensemble's performance trips for the 2026-27 school year are on band_trip_1, band_trip_2, band_trip_3 and band_trip_4 for band and orchestra and on arts_trip_1, arts_trip_2, arts_trip_3 and arts_trip_4 otherwise.
    at_trip_2: The ensemble's performance trips for the 2026-27 school year are on band_trip_1, band_trip_2, band_trip_3 and band_trip_4 for band and orchestra and on arts_trip_1, arts_trip_2, arts_trip_3 and arts_trip_4 otherwise.
    at_trip_3: The ensemble's performance trips for the 2026-27 school year are on band_trip_1, band_trip_2, band_trip_3 and band_trip_4 for band and orchestra and on arts_trip_1, arts_trip_2, arts_trip_3 and arts_trip_4 otherwise.
    at_trip_4: The ensemble's performance trips for the 2026-27 school year are on band_trip_1, band_trip_2, band_trip_3 and band_trip_4 for band and orchestra and on arts_trip_1, arts_trip_2, arts_trip_3 and arts_trip_4 otherwise.
    ar_activity: The scheduled ensemble travel rate is arts_band_travel for band or orchestra when the student's district enrollment record in status enrolled for the school year shows grade 06 or above
    ar_grade: when the student's district enrollment record in status enrolled for the school year shows grade 06 or above
    ensemble_travel_rate: The scheduled ensemble travel rate is arts_band_travel for band or orchestra when the student's district enrollment record in status enrolled for the school year shows grade 06 or above, arts_theatre_travel for theatre when that record shows grade 09 or above, and travel_fee otherwise.
    tg_grade: minus arts_middle_trip_discount for a participation at a middle school campus whose student's enrollment record in status enrolled for the school year shows grade 07 or 08
    trip_group_amount: 'A trip-group amount is added: minus arts_beginner_trip_discount for a participation at a middle school campus whose student''s enrollment record in status enrolled for the school year shows grade 06, minus arts_middle_trip_discount for a participation at a middle school campus whose student''s enrollment record in status enrolled for the school year shows grade 07 or 08, and nothing otherwise.'
    tr_type: A residency share of the travel fee applies by the student's district enrollment record in status enrolled for the school year
    travel_residency_share: arts_nonresident_travel_pct percent for a Non-Resident Transfer, arts_employee_travel_pct percent for an Intra-District Transfer (Employee Child), and 100 percent otherwise.
    ts_left: A trip share applies by the number of the ensemble's four trips that fall on or after the registration date
    trip_share: 'A trip share applies by the number of the ensemble''s four trips that fall on or after the registration date: with one or none, the share is arts_single_trip_pct percent for each such trip; with two or three, the share is that number of trips out of four, as a percentage; and otherwise the full travel fee is due (100 percent).'
    lb_received_on: the packet's received date, the latest received date among the activity_document_received entries on the participation's records log
    lb_next_trip: the first of the ensemble's trips on or after that date
    lb_lead_days: A late-booking amount is added after the shares by the calendar days from the packet's received date
    late_booking_amount: lead_short_add when there are fewer than lead_short_days days, lead_mid_add when there are lead_short_days or more but fewer than lead_mid_days days, and nothing otherwise or when none of the trips falls on or after that date.
    ih_usage: An instrument haul amount is added after the shares by the student's Fine Arts Instrument Usage checkout for the school year in status checked_out (the first such checkout when several are on record)
    instrument_haul_amount: haul_large_add for Large Instrument Usage (Tuba, Cello, String Bass), haul_other_add for any other usage type except Summer Instrument Checkout, and nothing when there is no such checkout.
    result: 'Adjustments in this schedule are applied in this order: amounts are added together first, the shares are then applied one after the other to that total, never below 0.00, any further amounts are added after the shares, and the result is rounded once, at the end, to the nearest cent with half a cent rounding up.'
  factors:
  - id: arts_travel_rate_tier
    effect: parameter
    decides: ensemble_travel_rate
    bindings:
    - ar_activity
    - ar_grade
    - ensemble_travel_rate
    ladder:
    - when: the activity is band or orchestra AND the enrollment record in status enrolled for the school year shows grade 06 or above
      value: K('arts_band_travel')
    - when: the activity is theatre AND the enrollment record in status enrolled shows grade 09 or above
      value: K('arts_theatre_travel')
    - when: otherwise
      value: P('travel_fee')
    baseline:
      ensemble_travel_rate: P('travel_fee')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: enroll
  - id: arts_trip_group_tier
    effect: parameter
    decides: trip_group_amount
    bindings:
    - tg_grade
    - trip_group_amount
    ladder:
    - when: the participation's campus is a middle school campus AND the enrollment record in status enrolled shows grade 06
      value: 0 - K('arts_beginner_trip_discount')
    - when: the participation's campus is a middle school campus AND the enrollment record in status enrolled shows grade 07 or 08
      value: 0 - K('arts_middle_trip_discount')
    - when: otherwise
      value: '0'
    baseline:
      trip_group_amount: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: enroll
  - id: arts_travel_residency_tier
    effect: parameter
    decides: travel_residency_share
    bindings:
    - tr_type
    - travel_residency_share
    ladder:
    - when: the enrollment record in status enrolled for the school year is a Non-Resident Transfer
      value: K('arts_nonresident_travel_pct')
    - when: the enrollment record in status enrolled for the school year is an Intra-District Transfer (Employee Child)
      value: K('arts_employee_travel_pct')
    - when: otherwise
      value: '100'
    baseline:
      travel_residency_share: '100'
    evidence:
    - cross_category
    cross_difficulty: enroll
  - id: arts_trip_share_rule
    effect: method
    decides: trip_share
    bindings:
    - ts_left
    - trip_share
    ladder:
    - when: one or none of the trips falls on or after the registration date
      method: arts_single_trip_pct percent for each trip on or after the registration date
    - when: two or three of the trips fall on or after the registration date
      method: that number of trips out of four, as a percentage
    - when: otherwise
      method: the full travel fee, 100 percent
    baseline:
      trip_share: '100'
    evidence:
    - date
    cross_difficulty: null
  - id: late_booking_tier
    effect: parameter
    decides: late_booking_amount
    bindings:
    - lb_received_on
    - lb_next_trip
    - lb_lead_days
    - late_booking_amount
    ladder:
    - when: the packet was received fewer than lead_short_days days before the first of the ensemble's trips on or after its received date
      value: K('lead_short_add')
    - when: it was received lead_short_days or more but fewer than lead_mid_days days before that trip
      value: K('lead_mid_add')
    - when: otherwise, or no trip falls on or after its received date
      value: '0'
    baseline:
      late_booking_amount: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: instrument_haul_tier
    effect: parameter
    decides: instrument_haul_amount
    bindings:
    - ih_usage
    - instrument_haul_amount
    ladder:
    - when: the student's checked_out instrument checkout for the school year is Large Instrument Usage (Tuba, Cello, String Bass)
      value: K('haul_large_add')
    - when: the student holds a checked_out instrument checkout of any other usage type except Summer Instrument Checkout
      value: K('haul_other_add')
    - when: otherwise
      value: '0'
    baseline:
      instrument_haul_amount: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: The scheduled ensemble travel fee is travel_fee, rounded to the cent, and a travel fee that works out to 0.00 posts nothing.
    params: []
  inputs:
    history:
    - table: activity_records_log
      aggregate: count
      field: document_type
      filters:
        document_type: overnight_travel_permission
    - table: activity_records_log
      aggregate: latest
      field: received_date
      filters:
        event_type: activity_document_received
    cross_category:
    - enroll
    - music
- id: activity_ext_arts_attire_fee
  base_policy_refs:
  - activity_evt_fees
  - activity_agg_household_fee_cap
  - activity_refund_credits
  - activity_equipment
  - activity_trip_rules
  overwrite:
  - base_policy: activity_evt_fees
    superseded_clause: 'On the registration date every fee component the type carries posts as its own fee: participation_fee, travel_fee, uniform_package_fee, and for a trip trip_deposit and trip_balance_fee; a component whose catalogue amount is 0.00 posts nothing.'
    replaced_by: For a Fine Arts Performing Ensemble participation for the 2026-27 school year whose registration date is after 2026-08-03 the uniform package posts as the concert attire package under the Fine Arts concert attire schedule below, on the date it is posted, its participation fee posts only under the Fine Arts packet schedule and its travel fee only under the Fine Arts travel fee schedule; a UIL Academic and Robotics Team participation for the 2026-27 school year whose registration date is after 2026-08-03 posts its fees under the UIL packet and travel fee schedules; every other participation posts every fee component the type carries as its own fee on the registration date at its catalogue amount, a component whose catalogue amount is 0.00 posting nothing.
  trigger: state_due
  subject:
  - activity_fee
  computes: uniform_package_amount
  target_tool: post_arts_attire_fee_5e2c9a17
  params:
    arts_band_attire: 40
    arts_choir_attire: 30
    attire_beginner_credit: 15
    attire_formal_add: 20
    attire_hollis_add: 5
    attire_mesquite_add: 10
    arts_concert_1: '2026-12-10'
    arts_concert_2: '2027-02-11'
    arts_concert_3: '2027-05-13'
    rush_short_days: 14
    rush_mid_days: 28
    rush_mid_add: 8
    arts_group_order_date: '2026-09-15'
    arts_winter_order_date: '2026-11-15'
    winter_order_add: 8
    individual_order_add: 12
    rush_base_add: 10
    rush_day_rate: 2
  rule: 'For a Fine Arts Performing Ensemble participation for the 2026-27 school year whose registration date is after 2026-08-03 the uniform package posts as the concert attire package under the Fine Arts concert attire schedule below, on the date it is posted, its participation fee posts only under the Fine Arts packet schedule and its travel fee only under the Fine Arts travel fee schedule; a UIL Academic and Robotics Team participation for the 2026-27 school year whose registration date is after 2026-08-03 posts its fees under the UIL packet and travel fee schedules; every other participation posts every fee component the type carries as its own fee on the registration date at its catalogue amount, a component whose catalogue amount is 0.00 posting nothing. The concert attire package is not ordered until the participation''s records log shows the date the parent''s signed packet was received. The packet''s received date is the latest received date among the activity_document_received entries on the participation''s records log: a packet counts as received when its last form arrives. The standard concert attire package is uniform_package_fee, rounded to the cent, and an attire package that works out to 0.00 posts nothing. Adjustments in this schedule are applied in this order: amounts are added together first, never below 0.00, any further amounts are then added to that total, and the result is rounded once, at the end, to the nearest cent with half a cent rounding up. The scheduled attire rate is arts_band_attire for band when the student''s district enrollment record in status enrolled for the school year shows grade 06 or above, arts_choir_attire for choir when that record shows grade 06 or above, and uniform_package_fee otherwise. An attire-level amount is added by the student''s district enrollment record in status enrolled for the school year: minus attire_beginner_credit when it shows grade 06, plus attire_formal_add when it shows grade 09 through 12, and nothing otherwise. A campus attire amount is added by the campus on the student''s district enrollment record in status enrolled for the school year: plus attire_hollis_add for Hollis Middle School, plus attire_mesquite_add for Mesquite Ridge High School, and nothing otherwise. An order amount is added to the total by the registration date: individual_order_add when it is after arts_winter_order_date, winter_order_add when it is after arts_group_order_date but on or before arts_winter_order_date, and nothing otherwise. A rush-order amount is added to the total by the calendar days from the packet''s received date to the first of the ensemble''s concerts on arts_concert_1, arts_concert_2 and arts_concert_3 that falls on or after that date: with fewer than rush_short_days days it is rush_base_add plus rush_day_rate for each day short of rush_short_days; with rush_short_days or more but fewer than rush_mid_days days it is rush_mid_add; and otherwise, or when no concert falls on or after that date, nothing.'
  prerequisite:
  - problem: activity_ext_arts_packet_fee
    kind: value_input
    gate: ap_packet_count
    form: state
    policy_source: The concert attire package is not ordered until the participation's records log shows the date the parent's signed packet was received.
    condition: The participation's records log holds the document entries the signed packet records, with their received date.
    resolved_by: submit_arts_packet_1cf2bbdb
    effect: The packet supplies the received date the rush-order amount is counted from; with no packet received no attire package is ordered.
  cross_category:
  - category: enroll
    as: branch
    reads:
    - grade_level
    - campus
    - status
    note: The attire rate, the attire-level amount and the campus attire amount rest on the student's enrollment record in status enrolled for the school year.
  compute:
  - ap_packet_count: COUNT('activity_records_log', date_field='received_date', event_type='activity_document_received')
  - ap_packet_on: LATEST('activity_records_log','received_date', date_field='received_date', event_type='activity_document_received') or K('arts_concert_3')
  - ak_activity: F('activity_name') or 'none'
  - ak_grade: CFIELD('enroll','grade_level', student_id=F('student_id'), school_year=F('school_year'), status='enrolled') or 'none'
  - attire_rate: K('arts_band_attire') if (ak_activity == 'band' and ak_grade >= '06' and ak_grade <= '12') else (K('arts_choir_attire') if (ak_activity == 'choir' and ak_grade >= '06' and ak_grade <= '12') else P('uniform_package_fee'))
  - ag_grade: CFIELD('enroll','grade_level', student_id=F('student_id'), school_year=F('school_year'), status='enrolled') or 'none'
  - attire_level_amount: (0 - K('attire_beginner_credit')) if ag_grade == '06' else (K('attire_formal_add') if (ag_grade >= '09' and ag_grade <= '12') else 0)
  - ac_campus: CFIELD('enroll','campus', student_id=F('student_id'), school_year=F('school_year'), status='enrolled') or 'none'
  - campus_attire_amount: K('attire_hollis_add') if ac_campus == 'Hollis Middle School' else (K('attire_mesquite_add') if ac_campus == 'Mesquite Ridge High School' else 0)
  - rr_next_concert: K('arts_concert_1') if DAYS(ap_packet_on, K('arts_concert_1')) >= 0 else (K('arts_concert_2') if DAYS(ap_packet_on, K('arts_concert_2')) >= 0 else K('arts_concert_3'))
  - rr_days: DAYS(ap_packet_on, rr_next_concert)
  - io_winter_days: DAYS(K('arts_winter_order_date'), F('registration_date'))
  - io_group_days: DAYS(K('arts_group_order_date'), F('registration_date'))
  - order_amount: K('individual_order_add') if io_winter_days > 0 else (K('winter_order_add') if io_group_days > 0 else 0)
  - rush_amount: (K('rush_base_add') + (K('rush_short_days') - rr_days) * K('rush_day_rate')) if (ap_packet_count > 0 and rr_days >= 0 and rr_days < K('rush_short_days')) else (K('rush_mid_add') if (ap_packet_count > 0 and rr_days >= K('rush_short_days') and rr_days < K('rush_mid_days')) else 0)
  - result: RND(((MX(0, attire_rate + attire_level_amount + campus_attire_amount) + order_amount + rush_amount) if ap_packet_count > 0 else 0) + 0.000000001, 2)
  compute_basis:
    ap_packet_count: The concert attire package is not ordered until the participation's records log shows the date the parent's signed packet was received.
    ap_packet_on: 'The packet''s received date is the latest received date among the activity_document_received entries on the participation''s records log: a packet counts as received when its last form arrives.'
    ak_activity: The scheduled attire rate is arts_band_attire for band
    ak_grade: when the student's district enrollment record in status enrolled for the school year shows grade 06 or above
    attire_rate: The scheduled attire rate is arts_band_attire for band when the student's district enrollment record in status enrolled for the school year shows grade 06 or above, arts_choir_attire for choir when that record shows grade 06 or above, and uniform_package_fee otherwise.
    ag_grade: An attire-level amount is added by the student's district enrollment record in status enrolled for the school year
    attire_level_amount: minus attire_beginner_credit when it shows grade 06, plus attire_formal_add when it shows grade 09 through 12, and nothing otherwise.
    ac_campus: A campus attire amount is added by the campus on the student's district enrollment record in status enrolled for the school year
    campus_attire_amount: plus attire_hollis_add for Hollis Middle School, plus attire_mesquite_add for Mesquite Ridge High School, and nothing otherwise.
    rr_next_concert: the first of the ensemble's concerts on arts_concert_1, arts_concert_2 and arts_concert_3 that falls on or after that date
    rr_days: A rush-order amount is added to the total by the calendar days from the packet's received date
    rush_amount: with fewer than rush_short_days days it is rush_base_add plus rush_day_rate for each day short of rush_short_days; with rush_short_days or more but fewer than rush_mid_days days it is rush_mid_add; and otherwise, or when no concert falls on or after that date, nothing.
    result: 'Adjustments in this schedule are applied in this order: amounts are added together first, never below 0.00, any further amounts are then added to that total, and the result is rounded once, at the end, to the nearest cent with half a cent rounding up.'
    io_winter_days: individual_order_add when it is after arts_winter_order_date
    io_group_days: winter_order_add when it is after arts_group_order_date but on or before arts_winter_order_date
    order_amount: 'An order amount is added to the total by the registration date: individual_order_add when it is after arts_winter_order_date, winter_order_add when it is after arts_group_order_date but on or before arts_winter_order_date, and nothing otherwise.'
  factors:
  - id: attire_rate_tier
    effect: parameter
    decides: attire_rate
    bindings:
    - ak_activity
    - ak_grade
    - attire_rate
    ladder:
    - when: band AND the enrollment record in status enrolled shows grade 06 or above
      value: K('arts_band_attire')
    - when: choir AND the enrollment record in status enrolled shows grade 06 or above
      value: K('arts_choir_attire')
    - when: otherwise
      value: P('uniform_package_fee')
    baseline:
      attire_rate: P('uniform_package_fee')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: enroll
  - id: attire_level_tier
    effect: parameter
    decides: attire_level_amount
    bindings:
    - ag_grade
    - attire_level_amount
    ladder:
    - when: the enrollment record in status enrolled for the school year shows grade 06
      value: 0 - K('attire_beginner_credit')
    - when: the enrollment record in status enrolled for the school year shows grade 09 through 12
      value: K('attire_formal_add')
    - when: otherwise
      value: '0'
    baseline:
      attire_level_amount: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: enroll
  - id: attire_campus_tier
    effect: parameter
    decides: campus_attire_amount
    bindings:
    - ac_campus
    - campus_attire_amount
    ladder:
    - when: the campus on the enrollment record in status enrolled is Hollis Middle School
      value: K('attire_hollis_add')
    - when: the campus on the enrollment record in status enrolled is Mesquite Ridge High School
      value: K('attire_mesquite_add')
    - when: otherwise
      value: '0'
    baseline:
      campus_attire_amount: '0'
    evidence:
    - cross_category
    cross_difficulty: enroll
  - id: order_timing_tier
    effect: parameter
    decides: order_amount
    bindings:
    - io_winter_days
    - io_group_days
    - order_amount
    ladder:
    - when: the registration date is after arts_winter_order_date
      value: K('individual_order_add')
    - when: the registration date is after arts_group_order_date and on or before arts_winter_order_date
      value: K('winter_order_add')
    - when: otherwise
      value: '0'
    baseline:
      order_amount: '0'
    evidence:
