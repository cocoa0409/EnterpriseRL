  rule: 'For a UIL Academic and Robotics Team participation for the 2026-27 school year whose registration date is after 2026-08-03, the participation fee posts on the date the parent or guardian submits the signed participation packet, at the amount the 2026-27 UIL Academic and Robotics fee schedule below sets, and its travel fee posts only under the UIL travel fee schedule; a Fine Arts Performing Ensemble participation for the 2026-27 school year whose registration date is after 2026-08-03 posts its fees under the Fine Arts packet, travel fee and concert attire schedules; every other participation posts every fee component the type carries as its own fee on the registration date at its catalogue amount, a component whose catalogue amount is 0.00 posting nothing. A UIL Academic and Robotics Team participation for the 2026-27 school year whose registration date is after 2026-08-03 posts no late registration fee; a Fine Arts Performing Ensemble participation for the 2026-27 school year whose registration date is after 2026-08-03 follows the Fine Arts packet schedule on late registration fees; every other registration received later than registration_deadline_days_before_start days before the season''s first practice or event date (season_start_dates), or for a trip later than that many days before departure, also posts late_registration_fee. The packet is the family''s own submission: the parent or guardian signs and submits the parent_permission, code_of_conduct and overnight_travel_permission forms through the district''s online activities registration, and the submission records the three forms and posts the participation fee. The scheduled participation fee is participation_fee, rounded to the cent. Adjustments in this schedule are applied in this order: amounts are added together first, the shares are then applied one after the other to that total, never below 0.00, and the result is rounded once, at the end, to the nearest cent with half a cent rounding up. The scheduled rate is uil_robotics_rate for the robotics team when the student''s district enrollment record in status enrolled for the school year shows grade 06 or above, uil_one_act_rate for one_act_play when that record shows grade 09 or above, and participation_fee otherwise. A level amount is added: minus uil_elem_discount for a participation at an elementary campus whose student''s enrollment record in status enrolled for the school year shows grade 02 through 05, minus uil_middle_discount for a participation at a middle school campus whose student''s enrollment record in status enrolled for the school year shows grade 06 through 08, and nothing otherwise. An enrollment share applies by the student''s district enrollment record in status enrolled for the school year: uil_nonresident_pct percent for a Non-Resident Transfer, uil_employee_pct percent for an Intra-District Transfer (Employee Child), and 100 percent otherwise. A join share applies by the registration date: a registration date on or after spring_start_date pays the spring-semester share of uil_spring_join_pct percent; a registration date more than join_grace_days calendar days after first_practice_date but before spring_start_date is prorated by whole weeks, the whole weeks from the registration date to last_school_day out of school_year_weeks, as a percentage never above 100; and any other registration date pays the full-year fee (100 percent).'
