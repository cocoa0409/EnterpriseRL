measures:
  - id: activity_msr_household_fees_year
    window: "The school year of the fee being charged."
    measure: "Sum of activity_fee amounts with fee_component participation_fee on the household's other participations of that school year posted earlier, less the activity_fee_credit amounts with credit_reason free_meal_waiver, reduced_meal_waiver or household_cap against them."
  - id: activity_msr_season_participations
    window: "The season and school year of the registration."
    measure: "Count of the student's other participations of the same activity type for that season and school year in status registered, cleared or academically_ineligible."

policies:
  - id: activity_agg_multi_holding
    subject: [activity_registration]
    rule: >-
      A household may register any number of its students, and each participation covers one student in one activity for one season of one school year.
      A registration is accepted only when the student has no other participation in the same activity for the same season and school year in status registered, cleared or academically_ineligible.
      A student may hold participations in different activities, up to max_activities_per_season participations of the same activity type in one season (activity_msr_season_participations).
    eligibility:
      - id: one_participation_per_activity_season
        applies_to: [activity_registration]
        kind: dedup
        condition: "A registration is accepted only when the student has no other participation in the same activity for the same season and school year in status registered, cleared or academically_ineligible."
        evidence_fields: [activity_participations.student_id, activity_participations.activity_name, activity_participations.season, activity_participations.school_year, activity_participations.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [activity_participations.student_id, activity_participations.activity_name, activity_participations.season, activity_participations.school_year]
          action_bindings:
            activity_participations.student_id: student_id
            activity_participations.activity_name: activity_name
            activity_participations.season: season
            activity_participations.school_year: school_year
        dedup_contract:
          table: activity_participations
          mode: separate_record
          object_bindings: {student_id: student_id, activity_name: activity_name, season: season, school_year: school_year}
          duplicate_filters: {status: [registered, cleared, academically_ineligible]}
          distinct_fields: []
    measures: [activity_msr_season_participations]
    params:
      max_per_customer: null
      max_open_participations_per_student_activity_season: 1

  - id: activity_agg_household_fee_cap
    subject: [activity_fee, activity_fee_credit]
    rule: >-
      Participation fees are capped per household per school year at household_annual_fee_cap, counted after meal-status waivers; travel fees, uniform packages, trip fees, late registration fees and equipment charges never count toward the cap and are never reduced by it.
      When the household's participation fees already charged this school year net of waiver and cap credits (activity_msr_household_fees_year) plus this participation fee net of its own waiver exceed the cap, the excess is credited on this fee with credit_reason household_cap.
      The cap is computed from fees posted earlier; a later fee never changes a cap credit already posted, and a fee credited later for a cut or withdrawal does not reopen cap room for credits already posted.
    eligibility: []
    measures: [activity_msr_household_fees_year]
    formula:
      cap_credit: "max(0, activity_msr_household_fees_year + amount - household_annual_fee_cap)"

  - id: activity_evt_fees
    subject: [activity_fee, activity_fee_credit, activity_registration]
    rule: >-
      On the registration date every fee component the type carries posts as its own fee: participation_fee, travel_fee, uniform_package_fee, and for a trip trip_deposit and trip_balance_fee; a component whose catalogue amount is 0.00 posts nothing.
      A registration received later than registration_deadline_days_before_start days before the season's first practice or event date (season_start_dates), or for a trip later than that many days before departure, also posts late_registration_fee.
      Fee waivers follow Texas Education Code 11.158 through the student's School Nutrition meal status on the posting date: a student holding any Free Meal Status tier is credited free_meal_waiver_pct of each waivable fee with credit_reason free_meal_waiver, and a student holding any Reduced-Price Meal Status tier is credited reduced_meal_waiver_pct with credit_reason reduced_meal_waiver; each waiver credit is rounded to the nearest cent, half a cent rounding up.
      Participation, travel and trip fees are waivable; a uniform package is waivable only when uniform_package_waivable is true, and late registration fees and equipment charges are never waivable.
      A meal status determined after a fee posted does not change that fee.
      Fees are due within fee_due_days calendar days of posting unless the installment plan applies.
    eligibility: []
    params:
      per_tier:
        "Campus Club Membership": {participation_fee: "=participation_fee", uniform_package_waivable: "=uniform_package_waivable", travel_fee: "=travel_fee"}
        "UIL Academic and Robotics Team": {participation_fee: "=participation_fee", uniform_package_waivable: "=uniform_package_waivable", travel_fee: "=travel_fee"}
        "Middle School UIL Athletics": {participation_fee: "=participation_fee", uniform_package_waivable: "=uniform_package_waivable", travel_fee: "=travel_fee"}
        "Fine Arts Performing Ensemble": {participation_fee: "=participation_fee", uniform_package_waivable: "=uniform_package_waivable", travel_fee: "=travel_fee"}
        "High School UIL Athletics": {participation_fee: "=participation_fee", uniform_package_waivable: "=uniform_package_waivable", travel_fee: "=travel_fee"}
        "Cheer and Dance Team": {participation_fee: "=participation_fee", uniform_package_waivable: "=uniform_package_waivable", travel_fee: "=travel_fee"}
        "Grade 5 Outdoor Education Trip": {participation_fee: "=participation_fee", uniform_package_waivable: "=uniform_package_waivable", travel_fee: "=travel_fee"}
    formula:
      waiver_credit: "round(amount * free_meal_waiver_pct / 100, 2) if credit_reason == 'free_meal_waiver' else (round(amount * reduced_meal_waiver_pct / 100, 2) if credit_reason == 'reduced_meal_waiver' else 0)"

  - id: activity_clearance_requirements
    subject: [activity_clearance, activity_document_received]
    rule: >-
      A student is cleared only when the participation packet for the school year is complete on the activity records log: every form in required_forms, the steroid_acknowledgment for a grade in steroid_form_grades, the random_drug_testing_consent when random_drug_testing_consent is true, a parent_meeting_attendance record when parent_meeting_required is true, and, when physical_exam_required is true and the student's grade is in physical_required_grades, a preparticipation_physical whose exam date is on or after physical_exam_earliest_date of the calendar year the school year starts.
      A student is cleared only when every fee posted on the participation is settled (fully offset by credits and payments), or, when installment_plan_available is true and the fees total at least installment_threshold, when the first installment has been paid.
      For High School UIL Athletics, a student whose district enrollment record shows a campus change through an intra-district or non-resident transfer, or a choice program placement, without a bona fide residence move is cleared at competition_level sub_varsity until transfer_varsity_wait_days days after the first day of attendance at the new campus, and at varsity otherwise; other types are cleared at not_applicable.
      A student is never allowed to practice, try out, perform or travel before clearance.
    eligibility:
      - id: packet_complete
        applies_to: [activity_clearance]
        kind: authorization
        condition: "A student is cleared only when the participation packet for the school year is complete on the activity records log: every form in required_forms, the steroid_acknowledgment for a grade in steroid_form_grades, the random_drug_testing_consent when random_drug_testing_consent is true, a parent_meeting_attendance record when parent_meeting_required is true, and, when physical_exam_required is true and the student's grade is in physical_required_grades, a preparticipation_physical whose exam date is on or after physical_exam_earliest_date of the calendar year the school year starts."
        evidence_fields: [activity_records_log.activity_participation_id, activity_records_log.document_type, activity_records_log.document_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [activity_records_log.activity_participation_id]
          action_bindings:
            activity_records_log.activity_participation_id: activity_participation_id
      - id: fees_settled_or_installment
        applies_to: [activity_clearance]
        kind: authorization
        condition: "A student is cleared only when every fee posted on the participation is settled (fully offset by credits and payments), or, when installment_plan_available is true and the fees total at least installment_threshold, when the first installment has been paid."
        evidence_fields: [activity_ledger.activity_participation_id, activity_ledger.event_type, activity_ledger.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [activity_ledger.activity_participation_id]
          action_bindings:
            activity_ledger.activity_participation_id: activity_participation_id
    params:
      per_tier:
        "Campus Club Membership": {physical_exam_required: "=physical_exam_required", physical_required_grades: "=physical_required_grades", transfer_varsity_wait_days: "=transfer_varsity_wait_days"}
        "UIL Academic and Robotics Team": {physical_exam_required: "=physical_exam_required", physical_required_grades: "=physical_required_grades", transfer_varsity_wait_days: "=transfer_varsity_wait_days"}
        "Middle School UIL Athletics": {physical_exam_required: "=physical_exam_required", physical_required_grades: "=physical_required_grades", transfer_varsity_wait_days: "=transfer_varsity_wait_days"}
        "Fine Arts Performing Ensemble": {physical_exam_required: "=physical_exam_required", physical_required_grades: "=physical_required_grades", transfer_varsity_wait_days: "=transfer_varsity_wait_days"}
        "High School UIL Athletics": {physical_exam_required: "=physical_exam_required", physical_required_grades: "=physical_required_grades", transfer_varsity_wait_days: "=transfer_varsity_wait_days"}
        "Cheer and Dance Team": {physical_exam_required: "=physical_exam_required", physical_required_grades: "=physical_required_grades", transfer_varsity_wait_days: "=transfer_varsity_wait_days"}
        "Grade 5 Outdoor Education Trip": {physical_exam_required: "=physical_exam_required", physical_required_grades: "=physical_required_grades", transfer_varsity_wait_days: "=transfer_varsity_wait_days"}

  - id: activity_academic_eligibility
    subject: [activity_ineligibility, activity_reinstatement, activity_completion_while_ineligible]
    rule: >-
      Under uil_no_pass_no_play, a student with a grade below 70 in any class at the end of a nine-week grading period becomes ineligible ineligibility_grace_days calendar days after the grading period ends and stays ineligible for at least ineligibility_minimum_school_weeks school weeks.
      Eligibility is restored at the first progress check after that minimum at which every class grade is 70 or above, and the student returns to cleared without a new packet or new fees.
      While ineligible the student may practice but may not compete, perform or travel; no fee is credited for time spent ineligible, and a season that ends while the student is ineligible completes normally.
      Types whose academic_eligibility_rule is none never become ineligible.
    eligibility: []

  - id: activity_refund_credits
    subject: [activity_fee_credit, activity_cut, activity_withdrawal, activity_registration_cancel, activity_refund]
    rule: >-
      Credits for leaving an activity are computed on each fee net of the waiver and cap credits already posted against it, rounded to the nearest cent, half a cent rounding up, and are never paid on the late registration fee or on equipment charges.
      A registration cancelled before clearance credits every other fee in full with credit_reason cancellation_credit.
      A student cut at tryouts is credited cut_credit_pct of every other fee with credit_reason cut_credit on the day the roster posts.
      A cleared student withdrawn within withdrawal_credit_window_days calendar days after the clearance date, the clearance date being day 0, is credited withdrawal_credit_pct of the participation fee with credit_reason withdrawal_window_credit; a later withdrawal earns no credit, except that a season-ending injury documented by a physician_injury_statement before the midpoint of the season credits injury_credit_pct of the participation fee with credit_reason injury_credit.
      A uniform package is never credited after clearance, because it is ordered in the student's name at clearance.
      A trip cancelled more than trip_deposit_refundable_until_days_before days before departure credits the deposit and the balance with credit_reason trip_cancellation_credit; cancelled later but more than trip_balance_due_days_before_departure days before departure, it credits the balance only; cancelled later still, it credits nothing.
      A credit balance is refunded by district check within credit_balance_refund_days calendar days, and a refund is issued only on a participation in status withdrawn, cut or completed.
    eligibility:
      - id: refund_after_close
        applies_to: [activity_refund]
        kind: state
        condition: "a refund is issued only on a participation in status withdrawn, cut or completed."
        evidence_fields: [activity_participations.status, activity_participations.activity_participation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [activity_participations.activity_participation_id]
          action_bindings:
            activity_participations.activity_participation_id: activity_participation_id
        state_contract:
          field: activity_participations.status
          allowed: [withdrawn, cut, completed]
    params:
      per_tier:
        "Campus Club Membership": {cut_credit_pct: "=cut_credit_pct", withdrawal_credit_pct: "=withdrawal_credit_pct", injury_credit_pct: "=injury_credit_pct"}
        "UIL Academic and Robotics Team": {cut_credit_pct: "=cut_credit_pct", withdrawal_credit_pct: "=withdrawal_credit_pct", injury_credit_pct: "=injury_credit_pct"}
        "Middle School UIL Athletics": {cut_credit_pct: "=cut_credit_pct", withdrawal_credit_pct: "=withdrawal_credit_pct", injury_credit_pct: "=injury_credit_pct"}
        "Fine Arts Performing Ensemble": {cut_credit_pct: "=cut_credit_pct", withdrawal_credit_pct: "=withdrawal_credit_pct", injury_credit_pct: "=injury_credit_pct"}
        "High School UIL Athletics": {cut_credit_pct: "=cut_credit_pct", withdrawal_credit_pct: "=withdrawal_credit_pct", injury_credit_pct: "=injury_credit_pct"}
        "Cheer and Dance Team": {cut_credit_pct: "=cut_credit_pct", withdrawal_credit_pct: "=withdrawal_credit_pct", injury_credit_pct: "=injury_credit_pct"}
        "Grade 5 Outdoor Education Trip": {cut_credit_pct: "=cut_credit_pct", withdrawal_credit_pct: "=withdrawal_credit_pct", injury_credit_pct: "=injury_credit_pct"}

  - id: activity_equipment
    subject: [activity_equipment_issued, activity_equipment_returned, activity_equipment_charge, activity_fee_credit, activity_completion]
    rule: >-
      District equipment and uniforms are issued only for types whose equipment_issued is true, each item under its inventory tag.
      Every item issued on a participation must be returned within equipment_return_days calendar days after the participation closes (withdrawn, cut or completed), the closing date being day 0.
      For each item still unreturned after that day, equipment_replacement_charge posts as an equipment charge for that tag; the charge is not waived by meal status and does not count toward the household fee cap.
      An item returned in usable condition after its charge posted, within the same school year, credits that charge in full with credit_reason equipment_returned; an item returned in a later school year earns no credit.
    eligibility: []

  - id: activity_payments_and_installments
    subject: [activity_payment]
    rule: >-
      Fees are paid by the methods in accepted_payment_methods and are applied to the participation's oldest open fee first; a payment never moves to another participation or a sibling.
      When installment_plan_available is true and the participation's fees net of credits total at least installment_threshold, the family may pay in installment_count equal monthly installments, the first due before clearance and each later one on the same day of the following months; each installment is the net total divided by installment_count rounded down to the cent, and the last installment carries the remaining cents.
      A student whose installment is more than fee_due_days days overdue may not travel or perform until it is paid, but stays on the roster.
    eligibility: []

  - id: activity_trip_rules
    subject: [activity_registration, activity_fee]
    rule: >-
      A Grade 5 Outdoor Education Trip registration names the trip's departure_date, and both the trip deposit and the trip balance post on the registration date.
      The trip balance must be settled by trip_balance_due_days_before_departure days before departure; a student whose trip fees are not settled by then does not travel, and the trip is then cancelled for the student under activity_refund_credits.
      A student holding a Free Meal Status tier travels on a full waiver and still needs the forms in required_forms.
      Trips other than the Grade 5 Outdoor Education Trip are campus field trips that carry no fee under this charter.
    eligibility: []

