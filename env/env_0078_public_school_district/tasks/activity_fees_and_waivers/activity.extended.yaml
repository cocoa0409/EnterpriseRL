  rule: 'For a Fine Arts Performing Ensemble participation for the 2026-27 school year whose registration date is after 2026-08-03 the travel fee posts under the Fine Arts travel fee schedule below, on the date it is posted, its participation fee posts only under the Fine Arts packet schedule and its uniform package only under the Fine Arts concert attire schedule; a UIL Academic and Robotics Team participation for the 2026-27 school year whose registration date is after 2026-08-03 posts its fees under the UIL packet and travel fee schedules; every other participation posts every fee component the type carries as its own fee on the registration date at its catalogue amount, a component whose catalogue amount is 0.00 posting nothing. The Fine Arts travel fee is not posted until the participation''s records log carries the overnight travel permission form from the parent''s signed packet. The ensemble''s performance trips for the 2026-27 school year are on band_trip_1, band_trip_2, band_trip_3 and band_trip_4 for band and orchestra and on arts_trip_1, arts_trip_2, arts_trip_3 and arts_trip_4 otherwise. The scheduled ensemble travel fee is travel_fee, rounded to the cent, and a travel fee that works out to 0.00 posts nothing. Adjustments in this schedule are applied in this order: amounts are added together first, the shares are then applied one after the other to that total, never below 0.00, any further amounts are added after the shares, and the result is rounded once, at the end, to the nearest cent with half a cent rounding up. The scheduled ensemble travel rate is arts_band_travel for band or orchestra when the student''s district enrollment record in status enrolled for the school year shows grade 06 or above, arts_theatre_travel for theatre when that record shows grade 09 or above, and travel_fee otherwise. A trip-group amount is added: minus arts_beginner_trip_discount for a participation at a middle school campus whose student''s enrollment record in status enrolled for the school year shows grade 06, minus arts_middle_trip_discount for a participation at a middle school campus whose student''s enrollment record in status enrolled for the school year shows grade 07 or 08, and nothing otherwise. A residency share of the travel fee applies by the student''s district enrollment record in status enrolled for the school year: arts_nonresident_travel_pct percent for a Non-Resident Transfer, arts_employee_travel_pct percent for an Intra-District Transfer (Employee Child), and 100 percent otherwise. A trip share applies by the number of the ensemble''s four trips that fall on or after the registration date: with one or none, the share is arts_single_trip_pct percent for each such trip; with two or three, the share is that number of trips out of four, as a percentage; and otherwise the full travel fee is due (100 percent). A late-booking amount is added after the shares by the calendar days from the packet''s received date, the latest received date among the activity_document_received entries on the participation''s records log, to the first of the ensemble''s trips on or after that date: lead_short_add when there are fewer than lead_short_days days, lead_mid_add when there are lead_short_days or more but fewer than lead_mid_days days, and nothing otherwise or when none of the trips falls on or after that date. An instrument haul amount is added after the shares by the student''s Fine Arts Instrument Usage checkout for the school year in status checked_out (the first such checkout when several are on record): haul_large_add for Large Instrument Usage (Tuba, Cello, String Bass), haul_other_add for any other usage type except Summer Instrument Checkout, and nothing when there is no such checkout.'
