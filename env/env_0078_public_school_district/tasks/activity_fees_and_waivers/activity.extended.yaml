    replaced_by: A UIL Academic and Robotics Team participation for the 2026-27 school year whose registration date is after 2026-08-03 posts no late registration fee; a Fine Arts Performing Ensemble participation for the 2026-27 school year whose registration date is after 2026-08-03 follows the Fine Arts packet schedule on late registration fees; every other registration received later than registration_deadline_days_before_start days before the season's first practice or event date (season_start_dates), or for a trip later than that many days before departure, also posts late_registration_fee.
