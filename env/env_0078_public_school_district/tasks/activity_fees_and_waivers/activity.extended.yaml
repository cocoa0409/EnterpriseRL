- id: activity_ext_arts_first_installment
  base_policy_refs:
  - activity_payments_and_installments
  - activity_clearance_requirements
  overwrite:
  - base_policy: activity_payments_and_installments
    superseded_clause: When installment_plan_available is true and the participation's fees net of credits total at least installment_threshold, the family may pay in installment_count equal monthly installments, the first due before clearance and each later one on the same day of the following months; each installment is the net total divided by installment_count rounded down to the cent, and the last installment carries the remaining cents.
    replaced_by: For a Fine Arts Performing Ensemble participation for the 2026-27 school year whose registration date is after 2026-08-03 the first installment of the plan is set by the Fine Arts first installment schedule below and is paid by the parent or guardian themselves online; every other participation keeps the standing plan, under which, when installment_plan_available is true and the participation's fees net of credits total at least installment_threshold, the family may pay in installment_count equal monthly installments, the first due before clearance and each later one on the same day of the following months, each installment being the net total divided by installment_count rounded down to the cent and the last installment carrying the remaining cents.
  trigger: on_request
  subject:
  - activity_payment
  computes: payment_amount
  target_tool: pay_arts_first_installment_d908e75f
  params:
    plan_end_date: '2027-03-31'
    trip_full_days: 30
    trip_split_days: 60
    plan_lead_long_days: 21
    plan_lead_long_pct: 50
    plan_lead_mid_days: 14
    plan_lead_mid_pct: 25
    plan_band_trip_1: '2026-10-24'
    plan_arts_trip_1: '2026-11-06'
    plan_band_trip_2: '2026-12-12'
    plan_arts_trip_2: '2027-01-29'
    plan_band_trip_3: '2027-02-26'
    plan_arts_trip_3: '2027-03-26'
    plan_band_trip_4: '2027-04-30'
    plan_arts_trip_4: '2027-05-07'
    plan_concert_1: '2026-12-10'
    plan_concert_2: '2027-02-11'
    plan_concert_3: '2027-05-13'
    attire_short_days: 14
    attire_mid_days: 28
    attire_mid_pct: 50
  rule: 'For a Fine Arts Performing Ensemble participation for the 2026-27 school year whose registration date is after 2026-08-03 the first installment of the plan is set by the Fine Arts first installment schedule below and is paid by the parent or guardian themselves online; every other participation keeps the standing plan, under which, when installment_plan_available is true and the participation''s fees net of credits total at least installment_threshold, the family may pay in installment_count equal monthly installments, the first due before clearance and each later one on the same day of the following months, each installment being the net total divided by installment_count rounded down to the cent and the last installment carrying the remaining cents. The first installment is fixed only after the participation fee from the parent''s signed packet stands on the participation''s ledger. Before the first installment is worked out, the ledger must carry the travel fee the Fine Arts travel fee schedule owes. The first installment is not worked out until the ledger carries the concert attire package the Fine Arts concert attire schedule owes. Each fee is the latest entry of its fee component on the participation''s ledger by posted date, the one recorded first when two share that date, and its net is that entry less the free_meal_waiver, reduced_meal_waiver and household_cap credits posted on it, never below 0.00; the first installment is due on the date it is paid and the plan''s later installments fall on the same day of the following months, none after plan_end_date. In the standard first installment the plan total, the participation fee, the travel fee and the concert attire package net of credits, is divided by installment_count and rounded down to the cent. Adjustments in this schedule are applied in this order: the amounts due up front are set aside from the plan total first, what remains is shared equally over the installments and rounded down to the cent, and the amounts due up front are then added to that share. The plan''s number of installments is the number of monthly due dates from the first installment through plan_end_date when installment_plan_available is true, the plan total is at least installment_threshold and that number is below installment_count; it is 1 when installment_plan_available is false or the plan total is below installment_threshold; and it is installment_count otherwise. The travel fee is placed by the calendar days from the first installment to the first of the ensemble''s trips on or after it, the trips being on plan_band_trip_1, plan_band_trip_2, plan_band_trip_3 and plan_band_trip_4 for band and orchestra and on plan_arts_trip_1, plan_arts_trip_2, plan_arts_trip_3 and plan_arts_trip_4 otherwise: with no more than trip_full_days days the whole travel fee net is due up front; with more than trip_full_days but no more than trip_split_days days the first installment carries the travel fee net divided by the monthly due dates from the first installment up to that trip, rounded down to the cent, the rest falling due on the later pre-trip due dates; and otherwise, or when no trip falls on or after the first installment, the travel fee net stays in the plan total. A plan opened late carries part of the participation fee up front by the calendar days from the registration date to the first installment: plan_lead_long_pct percent of the participation fee net when there are more than plan_lead_long_days days, plan_lead_mid_pct percent when there are more than plan_lead_mid_days but no more than plan_lead_long_days days, and none otherwise, each rounded to the nearest cent with half a cent rounding up. The concert attire package is placed by the calendar days from its posting date to the first of the ensemble''s concerts on plan_concert_1, plan_concert_2 and plan_concert_3 that falls on or after it: all of it up front when there are fewer than attire_short_days days, attire_mid_pct percent of it up front when there are attire_short_days or more but fewer than attire_mid_days days, and otherwise, or when no concert falls on or after its posting date, it stays in the plan total, each up-front part rounded to the nearest cent with half a cent rounding up.'
  prerequisite:
  - problem: activity_ext_arts_packet_fee
    kind: value_input
    gate: fi_part_net
    form: state
    policy_source: The first installment is fixed only after the participation fee from the parent's signed packet stands on the participation's ledger.
    condition: The participation's ledger carries the participation_fee entry the signed packet posts.
    resolved_by: submit_arts_packet_1cf2bbdb
    effect: The participation fee enters the plan total and the up-front share of a late plan.
  - problem: activity_ext_arts_travel_fee
    kind: value_input
    gate: fi_travel_net
    form: state
    policy_source: Before the first installment is worked out, the ledger must carry the travel fee the Fine Arts travel fee schedule owes.
    condition: The participation's ledger carries the travel_fee entry the Fine Arts travel fee schedule owes, or that schedule owes none.
    resolved_by: post_arts_travel_fee_8b3017ab
    effect: The travel fee enters the plan total or the amount due up front, by the days to the trip.
  - problem: activity_ext_arts_attire_fee
    kind: value_input
    gate: fi_attire_net
    form: state
    policy_source: The first installment is not worked out until the ledger carries the concert attire package the Fine Arts concert attire schedule owes.
    condition: The participation's ledger carries the uniform_package entry the Fine Arts concert attire schedule owes, or that schedule owes none.
    resolved_by: post_arts_attire_fee_5e2c9a17
    effect: The concert attire package enters the plan total or the amount due up front, by the days to the next concert.
  cross_category: []
  compute:
  - fi_part_entry: LATEST('activity_ledger','activity_ledger_id', date_field='posted_date', event_type='activity_fee', fee_component='participation_fee')
  - fi_part_fee: SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee', fee_component='participation_fee', activity_ledger_id=fi_part_entry)
  - fi_part_credits: SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee_credit', credit_reason='free_meal_waiver', source_activity_ledger_id=fi_part_entry) + SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee_credit', credit_reason='reduced_meal_waiver', source_activity_ledger_id=fi_part_entry) + SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee_credit', credit_reason='household_cap', source_activity_ledger_id=fi_part_entry)
  - fi_part_net: MX(0, fi_part_fee - fi_part_credits)
  - fi_travel_entry: LATEST('activity_ledger','activity_ledger_id', date_field='posted_date', event_type='activity_fee', fee_component='travel_fee')
  - fi_travel_fee: SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee', fee_component='travel_fee', activity_ledger_id=fi_travel_entry)
  - fi_travel_credits: SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee_credit', credit_reason='free_meal_waiver', source_activity_ledger_id=fi_travel_entry) + SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee_credit', credit_reason='reduced_meal_waiver', source_activity_ledger_id=fi_travel_entry) + SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee_credit', credit_reason='household_cap', source_activity_ledger_id=fi_travel_entry)
  - fi_travel_net: MX(0, fi_travel_fee - fi_travel_credits)
  - fi_attire_entry: LATEST('activity_ledger','activity_ledger_id', date_field='posted_date', event_type='activity_fee', fee_component='uniform_package')
  - fi_attire_fee: SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee', fee_component='uniform_package', activity_ledger_id=fi_attire_entry)
  - fi_attire_credits: SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee_credit', credit_reason='free_meal_waiver', source_activity_ledger_id=fi_attire_entry) + SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee_credit', credit_reason='reduced_meal_waiver', source_activity_ledger_id=fi_attire_entry) + SUM('activity_ledger','amount', date_field='posted_date', event_type='activity_fee_credit', credit_reason='household_cap', source_activity_ledger_id=fi_attire_entry)
  - fi_attire_net: MX(0, fi_attire_fee - fi_attire_credits)
  - plan_total: fi_part_net + fi_travel_net + fi_attire_net
  - pc_due_dates: MX(1, MONTHS(NOW, K('plan_end_date')) + 1)
  - plan_count: MX(1, pc_due_dates) if (P('installment_plan_available') and plan_total >= P('installment_threshold') and pc_due_dates < P('installment_count')) else (1 if ((not P('installment_plan_available')) or plan_total < P('installment_threshold')) else P('installment_count'))
  - tp_activity: F('activity_name') or 'none'
  - tp_next_trip: (K('plan_band_trip_1') if DAYS(NOW, K('plan_band_trip_1')) >= 0 else (K('plan_band_trip_2') if DAYS(NOW, K('plan_band_trip_2')) >= 0 else (K('plan_band_trip_3') if DAYS(NOW, K('plan_band_trip_3')) >= 0 else K('plan_band_trip_4')))) if (tp_activity == 'band' or tp_activity == 'orchestra') else (K('plan_arts_trip_1') if DAYS(NOW, K('plan_arts_trip_1')) >= 0 else (K('plan_arts_trip_2') if DAYS(NOW, K('plan_arts_trip_2')) >= 0 else (K('plan_arts_trip_3') if DAYS(NOW, K('plan_arts_trip_3')) >= 0 else K('plan_arts_trip_4'))))
  - tp_days: DAYS(NOW, tp_next_trip)
  - tp_pretrip_dates: MX(1, MONTHS(NOW, tp_next_trip) + 1)
  - travel_up_front: fi_travel_net if (tp_days >= 0 and tp_days <= K('trip_full_days')) else ((int(fi_travel_net / tp_pretrip_dates * 100 + 0.000000001) / 100) if (tp_days > K('trip_full_days') and tp_days <= K('trip_split_days')) else 0)
  - travel_in_plan: fi_travel_net if travel_up_front == 0 else 0
  - pl_days: DAYS(F('registration_date'), NOW)
  - lead_up_front_pct: K('plan_lead_long_pct') if pl_days > K('plan_lead_long_days') else (K('plan_lead_mid_pct') if pl_days > K('plan_lead_mid_days') else 0)
  - ap_posted_on: LATEST('activity_ledger','posted_date', date_field='posted_date', event_type='activity_fee', fee_component='uniform_package') or K('plan_concert_3')
  - ap_next_concert: K('plan_concert_1') if DAYS(ap_posted_on, K('plan_concert_1')) >= 0 else (K('plan_concert_2') if DAYS(ap_posted_on, K('plan_concert_2')) >= 0 else K('plan_concert_3'))
  - ap_days: DAYS(ap_posted_on, ap_next_concert)
  - attire_up_front_pct: 100 if (fi_attire_net > 0 and ap_days >= 0 and ap_days < K('attire_short_days')) else (K('attire_mid_pct') if (fi_attire_net > 0 and ap_days >= K('attire_short_days') and ap_days < K('attire_mid_days')) else 0)
  - part_up_front: RND(fi_part_net * lead_up_front_pct / 100 + 0.000000001, 2)
  - attire_up_front: RND(fi_attire_net * attire_up_front_pct / 100 + 0.000000001, 2)
  - plan_base: MX(0, (fi_part_net - part_up_front) + (fi_attire_net - attire_up_front) + travel_in_plan)
  - result: RND(travel_up_front + part_up_front + attire_up_front + int(plan_base / plan_count * 100 + 0.000000001) / 100 + 0.000000001, 2)
  compute_basis:
