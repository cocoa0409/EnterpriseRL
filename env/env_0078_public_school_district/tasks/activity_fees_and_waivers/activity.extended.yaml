    cross_difficulty: null
  - id: rush_order_rule
    effect: method
    decides: rush_amount
    bindings:
    - ap_packet_on
    - rr_next_concert
    - rr_days
    - rush_amount
    ladder:
    - when: the packet was received fewer than rush_short_days days before the first of the ensemble's concerts on or after its received date
      method: rush_base_add plus rush_day_rate for each day short of rush_short_days
    - when: it was received rush_short_days or more but fewer than rush_mid_days days before that concert
      method: the flat rush_mid_add
    - when: otherwise, or no concert falls on or after its received date
      method: nothing
    baseline:
      rush_amount: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The standard concert attire package is uniform_package_fee, rounded to the cent, and an attire package that works out to 0.00 posts nothing.
    params:
