lment record in status enrolled for the school year shows grade 02 through 05, minus uil_middle_travel_discount for a participation at a middle school campus whose student''s enrollment record in status enrolled for the school year shows grade 06 through 08, and nothing otherwise. A residence share of the travel fee applies by the student''s district enrollment record in status enrolled for the school year: uil_nonresident_travel_pct percent for a Non-Resident Transfer, uil_employee_travel_pct percent for an Intra-District Transfer (Employee Child), and 100 percent otherwise. A trip share applies by the number of the team''s four trips that fall on or after the registration date: with one or none, the share is uil_single_trip_pct percent for each such trip; with two or three, the share is that number of trips out of four, as a percentage; and otherwise the full travel fee is due (100 percent). A booking amount is added after the shares by the calendar days from the received date of the latest overnight_travel_permission on the participation''s records log to the first of the team''s trips on or after that date: booking_short_add when there are fewer than booking_short_days days, booking_mid_add when there are booking_short_days or more but fewer than booking_mid_days days, and nothing otherwise or when none of the trips falls on or after that date.'
