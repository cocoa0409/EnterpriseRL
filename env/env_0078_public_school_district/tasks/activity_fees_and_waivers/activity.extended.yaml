  - ensemble_rate: K('arts_band_rate') if ((ea_activity == 'band' or ea_activity == 'orchestra') and ea_grade >= '06' and ea_grade <= '12') else (K('arts_theatre_rate') if (ea_activity == 'theatre' and ea_grade >= '09' and ea_grade <= '12') else P('participation_fee'))
  - el_grade: CFIELD('enroll','grade_level', student_id=F('student_id'), school_year=F('school_year'), status='enrolled') or 'none'
  - ensemble_level_amount: K('arts_beginner_add') if el_grade == '06' else ((0 - K('arts_middle_discount')) if (el_grade == '07' or el_grade == '08') else 0)
  - cp_campus: CFIELD('enroll','campus', student_id=F('student_id'), school_year=F('school_year'), status='enrolled') or 'none'
  - campus_program_amount: K('arts_hollis_add') if cp_campus == 'Hollis Middle School' else (K('arts_calloway_add') if cp_campus == 'Calloway Creek High School' else 0)
