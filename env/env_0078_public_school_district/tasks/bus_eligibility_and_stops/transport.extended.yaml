# Student Transportation Services: bus eligibility, stop assignments and courtesy rider permits — Calloway Creek ISD.
category: transport
display_name: Student Transportation Services

binding:
  holding_table: transport_assignments
  event_tables: [transport_ledger, transport_service_log]
  intake_tables: [transport_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [applied, active, riding_suspended, denied, ended, cancelled]
  transitions:
    - {from: applied, to: active, by: agent, means: "Eligibility is confirmed, a route and stops are assigned and, for a courtesy permit, the permit fee is settled; riding starts."}
    - {from: applied, to: denied, by: agent, means: "The application does not meet the eligibility basis of any transportation type it was filed under."}
    - {from: active, to: riding_suspended, by: system, means: "Riding privileges are suspended for a number of school days under the bus conduct ladder."}
    - {from: riding_suspended, to: active, by: system, means: "The suspension has been served and riding resumes."}
    - {from: active, to: ended, by: agent, means: "Service ends: the student withdrew, eligibility was lost after an address or enrollment change, the permit period or school year ended, or a courtesy permit was revoked."}
    - {from: riding_suspended, to: ended, by: system, means: "Service ends while riding is suspended (district withdrawal, school year end, or courtesy permit revocation on the conduct ladder)."}
    - {from: active, to: cancelled, by: user, means: "The family cancels its courtesy rider permit; the student stops riding."}

accounts:
  - key: courtesy_fee_due
    unit: USD
    meaning: "Amount the household owes on one transportation assignment; courtesy permit fees, replacement bus pass fees and refunds disbursed increase it, payments and credits decrease it; a negative value is a credit owed to the family."

parameter_schema:
  eligibility_basis: "Ground of eligibility; enum courtesy_space_available | distance_two_miles | hazardous_route_zone | choice_program_hub | mckinney_vento_school_of_origin | iep_related_service."
  distance_rule: "How measured_distance_miles must compare with two_mile_threshold; enum under_threshold | at_least_threshold | any_distance."
  two_mile_threshold_miles: "State regular-transportation distance: residence-to-campus distance at or above which regular route service is owed, miles."
  distance_measurement_basis: "How distance is measured; enum shortest_public_route_gis (the district routing system's shortest public road route from the residence address to the campus entrance)."
  hazardous_zones: "Board-approved hazardous traffic zones whose residents within two miles qualify; list of zone codes, empty where not applicable."
  requires_transport_eligible_enrollment: "Whether the student's district enrollment type must keep district transportation eligibility; boolean."
  requires_hub_shuttle_enrollment: "Whether the student's enrollment type must qualify for the choice program hub shuttle; boolean."
  requires_homeless_designation: "Whether the student record must show the homeless_mckinney_vento designation; boolean."
  requires_iep_transportation: "Whether the student's active IEP must list special transportation as a related service; boolean."
  eligible_grades: "Grade levels the type serves; list of grade codes."
  permit_fee: "Courtesy rider permit fee for the permit period, USD; 0.00 for fee-free types."
  fee_period: "Period one permit fee covers; enum semester | school_year | not_applicable."
  free_meal_fee_waiver_pct: "Share of the permit fee waived for a student holding any Free Meal Status tier, percent."
  reduced_meal_fee_waiver_pct: "Share of the permit fee waived for a student holding any Reduced-Price Meal Status tier, percent."
  household_permit_fee_cap: "Maximum courtesy permit fees charged to one household per school year after waivers, USD."
  fee_due_days: "Calendar days after the permit fee posts within which it must be settled before the permit lapses, the posting date being day 0; integer."
  cancellation_full_credit_days: "Calendar days after the permit start date within which a family cancellation credits the full permit fee, the start date being day 0; integer."
  capacity_revocation_credit_basis: "How the fee is credited when the district revokes a courtesy permit for seat capacity; enum prorated_by_whole_months_remaining | not_applicable."
  seat_priority: "Order in which seats are allotted on a full route, 1 first; integer."
  max_walk_to_stop_miles_elementary: "Longest walk from the stop address to the assigned stop for grades PK3-05, miles; 0.00 for door-to-door service."
  max_walk_to_stop_miles_secondary: "Longest walk from the stop address to the assigned stop for grades 06-12, miles; 0.00 for door-to-door service."
  door_to_door_service: "Whether the stop is at the student's residence or curb; boolean."
  alternate_address_allowed: "Whether an approved childcare address may replace the residence as the stop address; boolean."
  alternate_address_grades: "Grades for which an alternate childcare address may be used; list of grade codes."
  alternate_address_same_zone_required: "Whether the alternate address must lie in the attendance zone of the campus attended; boolean."
  stop_address_consistency: "Whether the same AM stop and the same PM stop must be used every school day; boolean."
  stop_changes_per_semester: "Maximum completed stop or address changes per assignment per semester; integer."
  stop_change_processing_days: "Calendar days after a stop change request within which the new stop takes effect, the request date being day 0; integer."
  application_annual: "Whether a new application is needed every school year; boolean."
  first_day_application_deadline: "Date by which an application must be received to be routed for the first day of school, MM-DD."
  late_application_routing_days: "Calendar days after a late application within which a route is assigned; integer."
  address_change_reevaluation_days: "Calendar days after a reported address change within which eligibility is re-evaluated; integer."
  eligibility_loss_grace_days: "Calendar days service continues after eligibility is lost through an address change, the re-evaluation date being day 0; integer."
  continues_through_year_end_after_housing: "Whether school-of-origin service continues to the end of the school year after the family obtains permanent housing; boolean."
  bus_pass_required: "Whether the student must badge on with a district bus pass; boolean."
  first_pass_fee: "Fee for the first bus pass of the school year, USD."
  replacement_pass_fee: "Fee for each replacement bus pass, USD."
  free_replacements_per_year: "Replacement passes per assignment per school year issued without the fee; integer."
  conduct_suspension_ladder: "Riding suspension in school days by offense number within the school year; mapping offense number -> days (remainder_of_semester for the last step)."
  courtesy_revocation_offense_number: "Offense number within the school year at which a courtesy permit is revoked without credit; integer, 0 where not applicable."
  suspension_requires_alternate_transport: "Whether the district must provide alternate transportation during a riding suspension; boolean."
  adult_at_stop_required_grades: "Grades released at the PM stop only to a parent or authorized adult; list of grade codes."
  no_adult_return_limit: "Returns to campus in one semester because no authorized adult met the student at which a riding suspension applies; integer."
  no_adult_suspension_school_days: "School days of riding suspension applied when the no-adult return limit is reached; integer."
  accepted_payment_methods: "Payment methods accepted for permit and pass fees; list of enum online_card | ach_bank_draft | personal_check | money_order."
  credit_balance_refund_days: "Calendar days after an assignment ends or is cancelled within which a credit balance is refunded; integer."
  service_start_basis: "When service begins after approval; enum first_day_of_school_or_route_assignment_date."
  permit_waitlist_order: "Order in which courtesy applications wait when the route has no free seat; enum application_date | not_applicable."
  school_of_origin_basis: "Which campus is the school of origin; enum last_school_attended_when_permanently_housed_or_last_enrolled | not_applicable."

