      accepted_payment_methods: ["online_card", "ach_bank_draft", "personal_check", "money_order"]
      credit_balance_refund_days: 30
      service_start_basis: "first_day_of_school_or_route_assignment_date"
      permit_waitlist_order: not_applicable
      school_of_origin_basis: not_applicable

events:
  - type: transport_application
    target: transport_assignments
    mutation: create
    meaning: "A family applies for bus service for one student for one school year under one transportation type."
    grain: "One row per student per school year application."
    fields:
      customer_id: "Household applying."
      student_id: "Student the application is for."
      variant_name: "Transportation type applied for."
      campus: "Campus the student attends."
      school_year: "School year, YYYY-YY."
      application_date: "Date the application was received."
      measured_distance_miles: "Routing-system distance from the residence to the campus."
      hazardous_zone: "Board-approved hazardous zone containing the residence, or none."
    triggers: []
  - type: transport_approval
    target: transport_assignments
    mutation: {transition: {from: applied, to: active}}
    meaning: "Eligibility is confirmed and riding starts on the start date."
    grain: "One row per transaction."
    fields:
      start_date: "First day of service."
    triggers:
      - event: transport:transport_pass_issued
        map: {event_date: start_date, issue_reason: initial}
  - type: transport_denial
    target: transport_assignments
    mutation: {transition: {from: applied, to: denied}}
    meaning: "The application is denied because the student does not meet the type's eligibility basis."
    grain: "One row per transaction."
    fields:
      end_date: "Date of the denial."
      end_reason: "not_eligible."
    triggers: []
  - type: transport_conduct_suspension
    target: transport_assignments
    mutation: {transition: {from: active, to: riding_suspended}}
    meaning: "Riding privileges are suspended under the bus conduct ladder or the no-adult return rule."
    grain: "One row per transaction."
    fields:
      suspension_end_date: "Last school day of the suspension."
    triggers: []
  - type: transport_suspension_served
    target: transport_assignments
    mutation: {transition: {from: riding_suspended, to: active}}
    meaning: "The suspension has been served and riding resumes."
    grain: "One row per transaction."
    fields:
      suspension_end_date: "Cleared to empty."
    triggers: []
  - type: transport_eligibility_end
    target: transport_assignments
    mutation: {transition: {from: active, to: ended}}
    meaning: "Service ends for district withdrawal, loss of eligibility, the end of the permit period or school year, or a courtesy permit revocation."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of service."
      end_reason: "district_withdrawal, address_change, enrollment_change, permit_period_end, school_year_end, courtesy_revoked_conduct or courtesy_revoked_capacity."
    triggers: []
  - type: transport_end_while_suspended
    target: transport_assignments
    mutation: {transition: {from: riding_suspended, to: ended}}
    meaning: "Service ends while riding is suspended."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of service."
      end_reason: "district_withdrawal, school_year_end or courtesy_revoked_conduct."
    triggers: []
  - type: transport_permit_cancellation
    target: transport_assignments
    mutation: {transition: {from: active, to: cancelled}}
    meaning: "The family cancels its courtesy rider permit."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of service."
      end_reason: "family_cancellation."
    triggers: []
  - type: transport_stop_assignment
    target: transport_assignments
    mutation: update
    meaning: "A route and AM and PM stops are assigned or changed."
    grain: "One row per stop assignment."
    fields:
      route_number: "Route assigned."
      am_stop: "Assigned morning stop."
      pm_stop: "Assigned afternoon stop."
      stop_address_type: "residence or approved_childcare_address."
      stop_assignment_date: "Date the assignment takes effect."
    triggers: []
  - type: transport_permit_fee
    target: transport_ledger
    meaning: "The courtesy rider permit fee for one permit period is posted."
    grain: "One row per assignment per permit period."
    distinguish_by: [fee_period_label]
    fields:
      amount: "Permit fee posted before waivers, positive USD."
      posted_date: "Date posted."
      fee_period_label: "fall_semester, spring_semester or school_year."
    account: courtesy_fee_due
    direction: in
    triggers: []
  - type: transport_replacement_pass_fee
    target: transport_ledger
    meaning: "The fee for a replacement bus pass is posted."
    grain: "One row per replacement pass charged."
    distinguish_by: [pass_number]
    fields:
      amount: "Replacement fee, positive USD."
      posted_date: "Date posted."
      pass_number: "Number of the replacement pass issued."
    account: courtesy_fee_due
    direction: in
    triggers: []
  - type: transport_payment
    target: transport_ledger
    meaning: "A family payment toward permit or pass fees is applied."
    grain: "One row per payment confirmation."
    distinguish_by: [payment_reference]
    fields:
      amount: "Payment, positive USD."
      posted_date: "Date posted."
      payment_method: "online_card, ach_bank_draft, personal_check or money_order."
      payment_reference: "Payment confirmation number exactly as issued."
    account: courtesy_fee_due
    direction: out
    triggers: []
  - type: transport_fee_credit
    target: transport_ledger
    meaning: "A credit offsets one specific fee (meal-status waiver, household cap, cancellation credit, capacity revocation proration or billing correction)."
    grain: "One row per credited fee per credit reason."
    distinguish_by: [source_transport_ledger_id, credit_reason]
    fields:
      amount: "Credit, positive USD, never more than the source fee."
      posted_date: "Date posted."
      credit_reason: "free_meal_waiver, reduced_meal_waiver, household_cap, cancellation_window, capacity_revocation_proration, free_replacement or billing_correction."
      source_transport_ledger_id: "Reference of the fee credited."
    account: courtesy_fee_due
    direction: out
    triggers: []
  - type: transport_refund
    target: transport_ledger
    meaning: "A credit balance on an ended or cancelled assignment is refunded by district check."
    grain: "One row per refund issued."
    distinguish_by: [posted_date]
    fields:
      amount: "Refund, positive USD."
      posted_date: "Date issued."
    account: courtesy_fee_due
    direction: in
    triggers: []
  - type: transport_pass_issued
    target: transport_service_log
    meaning: "A bus pass is issued for the assignment."
    grain: "One row per pass issued."
    distinguish_by: [pass_number]
    fields:
      event_date: "Date issued."
      pass_number: "Pass number printed on the card."
      issue_reason: "initial or replacement."
    triggers:
      - event: transport:transport_replacement_pass_fee
        when: {issue_reason: replacement}
        map: {pass_number: pass_number, posted_date: event_date}
  - type: transport_conduct_incident
    target: transport_service_log
    meaning: "A bus conduct referral is recorded with its offense number in the school year and the suspension it carries."
    grain: "One row per conduct referral."
    distinguish_by: [event_date, offense_number]
    fields:
      event_date: "Date of the incident."
      offense_number: "Offense number within the school year."
      suspension_school_days: "School days of riding suspension under the ladder (0 for a warning)."
      semester: "fall or spring."
    triggers:
      - event: transport:transport_conduct_suspension
        when: {suspension_school_days: {not: 0}}
        map: {}
  - type: transport_no_adult_return
    target: transport_service_log
    meaning: "A student who must be met at the PM stop is returned to campus because no authorized adult was there."
    grain: "One row per return, one per service date."
    distinguish_by: [event_date]
    fields:
      event_date: "Service date."
      semester: "fall or spring."
    triggers: []

measures:
  - id: transport_msr_offenses_year
    window: "The school year, July 1 - June 30, containing the incident."
    measure: "Count of transport_conduct_incident rows on the student's assignments of that school year, the new incident included."
  - id: transport_msr_household_permit_fees_year
    window: "The school year of the permit fee being charged."
    measure: "Sum of transport_permit_fee amounts on the household's other assignments of that school year posted earlier, less the transport_fee_credit amounts with credit_reason free_meal_waiver, reduced_meal_waiver or household_cap against them."
  - id: transport_msr_stop_changes_semester
    window: "The semester (fall August 1 - December 31, spring January 1 - June 30) containing the request date."
    measure: "Count of transport_requests rows of request_type stop_change or alternate_address on the assignment with request_status completed whose created_at falls in that semester."
  - id: transport_msr_no_adult_returns_semester
    window: "The semester containing the service date."
    measure: "Count of transport_no_adult_return rows on the assignment with that semester value."
  - id: transport_msr_replacement_passes_year
    window: "The school year of the assignment."
    measure: "Count of transport_pass_issued rows with issue_reason replacement on the assignment before the pass being issued."

policies:
  - id: transport_agg_multi_holding
    subject: [transport_application]
    rule: >-
      A household may hold transportation assignments for any number of its students, and each assignment covers one student for one school year.
      An application is accepted only when the student has no other transportation assignment for the same school year in status applied, active or riding_suspended.
      A student whose situation changes to another transportation type keeps riding on the open assignment until it ends and then applies under the new type; the two never run at the same time.
    eligibility:
      - id: one_open_assignment_per_year
        applies_to: [transport_application]
        kind: dedup
        condition: "An application is accepted only when the student has no other transportation assignment for the same school year in status applied, active or riding_suspended."
        evidence_fields: [transport_assignments.student_id, transport_assignments.school_year, transport_assignments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [transport_assignments.student_id, transport_assignments.school_year]
          action_bindings:
            transport_assignments.student_id: student_id
            transport_assignments.school_year: school_year
        dedup_contract:
          table: transport_assignments
          mode: separate_record
          object_bindings: {student_id: student_id, school_year: school_year}
          duplicate_filters: {status: [applied, active, riding_suspended]}
          distinct_fields: []
    params:
      max_per_customer: null
      max_open_assignments_per_student_per_school_year: 1

  - id: transport_agg_household_permit_cap
    subject: [transport_permit_fee, transport_fee_credit]
    rule: >-
      Courtesy permit fees are capped per household per school year at household_permit_fee_cap, counted after meal-status waivers.
      When the household's fees already charged this school year net of waiver and cap credits (transport_msr_household_permit_fees_year) plus this fee net of its own meal-status waiver exceed the cap, the excess is credited on this fee with credit_reason household_cap.
      The cap is computed from fees posted earlier; a later fee never changes a cap credit already posted, and replacement pass fees never count toward the cap.
    eligibility: []
    measures: [transport_msr_household_permit_fees_year]
    formula:
      cap_credit: "max(0, transport_msr_household_permit_fees_year + amount - household_permit_fee_cap)"

  - id: transport_eligibility_basis
    subject: [transport_application, transport_approval, transport_denial]
    rule: >-
      Each transportation type rests on its own eligibility_basis, judged from the records on the decision date.
      An application is taken only for a student whose district enrollment record for the school year is in status provisional or enrolled, and the assignment's campus is the campus of that record.
      Regular Route Eligibility requires measured_distance_miles at or above two_mile_threshold_miles; Hazardous Route Eligibility requires a distance below it and a residence inside one of the listed hazardous_zones; a courtesy rider permit is for a student below the threshold outside every hazardous zone, sold on a space-available basis after eligible riders are seated, waiting in permit_waitlist_order when the route is full.
      Those three types require an enrollment type that keeps district transportation eligibility under the Student Enrollment charter (requires_transport_eligible_enrollment), so a transfer or Pre-K student is not eligible for them at any distance.
      Choice Program Hub Shuttle requires an enrollment type that qualifies for the hub shuttle and serves the program's hub stops only.
      McKinney-Vento School-of-Origin Transportation requires the homeless_mckinney_vento designation on the student record and is owed at any distance to the school of origin, whatever the enrollment type; Special Education Transportation requires an active IEP that lists special transportation as a related service and is owed at any distance.
      A courtesy permit becomes active only once its permit fee is settled, meaning the fee is fully offset by credits and payments; a permit fee not settled within fee_due_days calendar days after it posts lapses the application, which is then denied.
      When several types fit the same student, the family applies under the one with the lowest seat_priority number, because it carries no fee and the stronger service duty.
    eligibility:
      - id: open_district_enrollment
        applies_to: [transport_application]
        kind: state
        condition: "An application is taken only for a student whose district enrollment record for the school year is in status provisional or enrolled, and the assignment's campus is the campus of that record."
        evidence_fields: [enrollments.status, enrollments.campus, enrollments.student_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.student_id]
          action_bindings:
            enrollments.student_id: student_id
        state_contract:
          field: enrollments.status
          allowed: [provisional, enrolled]
      - id: courtesy_fee_settled
        applies_to: [transport_approval]
        kind: authorization
        condition: "A courtesy permit becomes active only once its permit fee is settled, meaning the fee is fully offset by credits and payments; a permit fee not settled within fee_due_days calendar days after it posts lapses the application, which is then denied."
        evidence_fields: [transport_ledger.transport_assignment_id, transport_ledger.event_type, transport_ledger.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [transport_ledger.transport_assignment_id]
          action_bindings:
            transport_ledger.transport_assignment_id: transport_assignment_id
    params:
      per_tier:
        "Courtesy Rider Permit (Semester)": {eligibility_basis: "=eligibility_basis", distance_rule: "=distance_rule", seat_priority: "=seat_priority"}
        "Courtesy Rider Permit (Annual)": {eligibility_basis: "=eligibility_basis", distance_rule: "=distance_rule", seat_priority: "=seat_priority"}
        "Regular Route Eligibility": {eligibility_basis: "=eligibility_basis", distance_rule: "=distance_rule", seat_priority: "=seat_priority"}
        "Hazardous Route Eligibility": {eligibility_basis: "=eligibility_basis", distance_rule: "=distance_rule", seat_priority: "=seat_priority"}
        "Choice Program Hub Shuttle": {eligibility_basis: "=eligibility_basis", distance_rule: "=distance_rule", seat_priority: "=seat_priority"}
        "McKinney-Vento School-of-Origin Transportation": {eligibility_basis: "=eligibility_basis", distance_rule: "=distance_rule", seat_priority: "=seat_priority"}
        "Special Education Transportation": {eligibility_basis: "=eligibility_basis", distance_rule: "=distance_rule", seat_priority: "=seat_priority"}

  - id: transport_evt_permit_fee
    subject: [transport_permit_fee, transport_fee_credit]
    rule: >-
      A courtesy rider permit fee of permit_fee posts on the application date for the permit period applied for: fall_semester (August - December) or spring_semester (January - May) for Courtesy Rider Permit (Semester), school_year (August - May) for Courtesy Rider Permit (Annual).
      Fee-free transportation types never post a permit fee.
      The fee is waived by credit from the student's School Nutrition meal status on the posting date: a student holding any Free Meal Status tier is credited free_meal_fee_waiver_pct of the fee with credit_reason free_meal_waiver, and a student holding any Reduced-Price Meal Status tier is credited reduced_meal_fee_waiver_pct with credit_reason reduced_meal_waiver; the waiver credit is rounded to the nearest cent, half a cent rounding up.
      A meal status determined after the fee posted does not change that fee; it applies to the next permit fee posted.
      The household cap of transport_agg_household_permit_cap applies after the waiver, and the fee is due within fee_due_days calendar days of posting.
    eligibility: []
    params:
      per_tier:
        "Courtesy Rider Permit (Semester)": {permit_fee: "=permit_fee", fee_period: "=fee_period"}
        "Courtesy Rider Permit (Annual)": {permit_fee: "=permit_fee", fee_period: "=fee_period"}
        "Regular Route Eligibility": {permit_fee: "=permit_fee", fee_period: "=fee_period"}
        "Hazardous Route Eligibility": {permit_fee: "=permit_fee", fee_period: "=fee_period"}
        "Choice Program Hub Shuttle": {permit_fee: "=permit_fee", fee_period: "=fee_period"}
        "McKinney-Vento School-of-Origin Transportation": {permit_fee: "=permit_fee", fee_period: "=fee_period"}
        "Special Education Transportation": {permit_fee: "=permit_fee", fee_period: "=fee_period"}
    formula:
      amount: "permit_fee"
      waiver_credit: "round(permit_fee * free_meal_fee_waiver_pct / 100, 2) if credit_reason == 'free_meal_waiver' else (round(permit_fee * reduced_meal_fee_waiver_pct / 100, 2) if credit_reason == 'reduced_meal_waiver' else 0)"

  - id: transport_stop_assignment_rules
    subject: [transport_stop_assignment]
    rule: >-
      Stops are assigned only on an assignment in status applied, active or riding_suspended.
      The stop address is the residence on file unless an approved childcare address is used; an alternate address is allowed only when alternate_address_allowed is true, for a grade in alternate_address_grades, and, when alternate_address_same_zone_required is true, only inside the attendance zone of the campus attended.
      The assigned stop is no farther from the stop address than max_walk_to_stop_miles_elementary for grades PK3-05 or max_walk_to_stop_miles_secondary for grades 06-12, and is at the curb when door_to_door_service is true; Choice Program Hub Shuttle riders board only at the program's hub stops.
      The same AM stop and the same PM stop apply every school day (stop_address_consistency).
      A stop change or alternate address request takes effect stop_change_processing_days calendar days after the request date, and at most stop_changes_per_semester requests are completed per assignment per semester (transport_msr_stop_changes_semester); a further request in the semester is declined.
      Applications received by first_day_application_deadline are routed for the first day of school, later ones within late_application_routing_days days.
    eligibility:
      - id: stop_on_open_assignment
        applies_to: [transport_stop_assignment]
        kind: state
        condition: "Stops are assigned only on an assignment in status applied, active or riding_suspended."
        evidence_fields: [transport_assignments.status, transport_assignments.transport_assignment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [transport_assignments.transport_assignment_id]
          action_bindings:
            transport_assignments.transport_assignment_id: transport_assignment_id
        state_contract:
          field: transport_assignments.status
          allowed: [applied, active, riding_suspended]
    measures: [transport_msr_stop_changes_semester]
    params:
      per_tier:
        "Courtesy Rider Permit (Semester)": {alternate_address_allowed: "=alternate_address_allowed", max_walk_to_stop_miles_elementary: "=max_walk_to_stop_miles_elementary", stop_changes_per_semester: "=stop_changes_per_semester"}
        "Courtesy Rider Permit (Annual)": {alternate_address_allowed: "=alternate_address_allowed", max_walk_to_stop_miles_elementary: "=max_walk_to_stop_miles_elementary", stop_changes_per_semester: "=stop_changes_per_semester"}
        "Regular Route Eligibility": {alternate_address_allowed: "=alternate_address_allowed", max_walk_to_stop_miles_elementary: "=max_walk_to_stop_miles_elementary", stop_changes_per_semester: "=stop_changes_per_semester"}
        "Hazardous Route Eligibility": {alternate_address_allowed: "=alternate_address_allowed", max_walk_to_stop_miles_elementary: "=max_walk_to_stop_miles_elementary", stop_changes_per_semester: "=stop_changes_per_semester"}
        "Choice Program Hub Shuttle": {alternate_address_allowed: "=alternate_address_allowed", max_walk_to_stop_miles_elementary: "=max_walk_to_stop_miles_elementary", stop_changes_per_semester: "=stop_changes_per_semester"}
        "McKinney-Vento School-of-Origin Transportation": {alternate_address_allowed: "=alternate_address_allowed", max_walk_to_stop_miles_elementary: "=max_walk_to_stop_miles_elementary", stop_changes_per_semester: "=stop_changes_per_semester"}
        "Special Education Transportation": {alternate_address_allowed: "=alternate_address_allowed", max_walk_to_stop_miles_elementary: "=max_walk_to_stop_miles_elementary", stop_changes_per_semester: "=stop_changes_per_semester"}

  - id: transport_conduct_and_suspension
    subject: [transport_conduct_incident, transport_conduct_suspension, transport_suspension_served, transport_end_while_suspended, transport_eligibility_end]
    rule: >-
      Each bus conduct referral is numbered within the school year (transport_msr_offenses_year) and carries the riding suspension of conduct_suspension_ladder for that number, counted in school days starting the next school day; a step of 0 is a written warning without suspension, and remainder_of_semester runs to the last school day of the semester.
      At the offense number courtesy_revocation_offense_number a courtesy rider permit is revoked with end_reason courtesy_revoked_conduct and no fee credit; fee-free types are never revoked for conduct, only suspended.
      When suspension_requires_alternate_transport is true the district provides alternate transportation during the suspension, and for a Special Education Transportation student the suspension days count toward the student's removal days under the IEP.
      Riding resumes the school day after suspension_end_date.
    eligibility: []
    measures: [transport_msr_offenses_year]
    params:
      per_tier:
        "Courtesy Rider Permit (Semester)": {courtesy_revocation_offense_number: "=courtesy_revocation_offense_number", suspension_requires_alternate_transport: "=suspension_requires_alternate_transport"}
        "Courtesy Rider Permit (Annual)": {courtesy_revocation_offense_number: "=courtesy_revocation_offense_number", suspension_requires_alternate_transport: "=suspension_requires_alternate_transport"}
        "Regular Route Eligibility": {courtesy_revocation_offense_number: "=courtesy_revocation_offense_number", suspension_requires_alternate_transport: "=suspension_requires_alternate_transport"}
        "Hazardous Route Eligibility": {courtesy_revocation_offense_number: "=courtesy_revocation_offense_number", suspension_requires_alternate_transport: "=suspension_requires_alternate_transport"}
        "Choice Program Hub Shuttle": {courtesy_revocation_offense_number: "=courtesy_revocation_offense_number", suspension_requires_alternate_transport: "=suspension_requires_alternate_transport"}
        "McKinney-Vento School-of-Origin Transportation": {courtesy_revocation_offense_number: "=courtesy_revocation_offense_number", suspension_requires_alternate_transport: "=suspension_requires_alternate_transport"}
        "Special Education Transportation": {courtesy_revocation_offense_number: "=courtesy_revocation_offense_number", suspension_requires_alternate_transport: "=suspension_requires_alternate_transport"}

  - id: transport_bus_pass
    subject: [transport_pass_issued, transport_replacement_pass_fee, transport_fee_credit]
    rule: >-
      Every rider receives a bus pass when service starts, charged first_pass_fee.
      A lost or damaged pass is replaced on request with a new pass_number, and each replacement posts replacement_pass_fee.
      The first free_replacements_per_year replacements of the school year on the assignment (transport_msr_replacement_passes_year) are credited in full with credit_reason free_replacement on the day they post; later replacements are owed.
      A pass that stops working through no damage is exchanged as a replacement and its fee credited in full the same way.
      Replacement fees are not waived by meal status and do not count toward the household permit fee cap.
    eligibility: []
    measures: [transport_msr_replacement_passes_year]

  - id: transport_cancellation_and_refunds
    subject: [transport_permit_cancellation, transport_eligibility_end, transport_fee_credit, transport_refund]
    rule: >-
      Only the family cancels its courtesy rider permit; the support desk records a permit_cancellation request and the family confirms it.
      A cancellation whose last day of service falls within cancellation_full_credit_days calendar days after the permit's start_date, the start date being day 0, credits the permit fee net of its waiver and cap credits in full with credit_reason cancellation_window; a later cancellation earns no credit.
      When the district revokes a courtesy permit to free seats for eligible riders (end_reason courtesy_revoked_capacity), the net fee is credited in proportion to the whole calendar months of the permit period left after the month of the end_date, with credit_reason capacity_revocation_proration and rounded to the nearest cent, half a cent rounding up; the permit periods have 5 months (fall_semester, spring_semester) or 10 months (school_year).
      A permit revoked for conduct, or ended by district withdrawal or the end of its period, earns no credit.
      A credit balance is refunded by district check within credit_balance_refund_days calendar days, and a refund is issued only on an assignment in status ended or cancelled.
    eligibility:
      - id: refund_after_close
        applies_to: [transport_refund]
        kind: state
        condition: "a refund is issued only on an assignment in status ended or cancelled."
        evidence_fields: [transport_assignments.status, transport_assignments.transport_assignment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [transport_assignments.transport_assignment_id]
          action_bindings:
            transport_assignments.transport_assignment_id: transport_assignment_id
        state_contract:
          field: transport_assignments.status
          allowed: [ended, cancelled]
    params:
      period_months: {fall_semester: 5, spring_semester: 5, school_year: 10}

  - id: transport_address_change_and_end
    subject: [transport_eligibility_end, transport_end_while_suspended, transport_application]
    rule: >-
      A reported change of residence is re-evaluated within address_change_reevaluation_days calendar days from the routing system's new measured distance and hazardous zone.
      When the new address no longer meets the type's eligibility basis, service continues for eligibility_loss_grace_days calendar days after the re-evaluation date, the re-evaluation date being day 0, and then ends with end_reason address_change; the family may apply under a type the new address meets.
      When the student's enrollment type changes to one that no longer keeps district transportation eligibility, service ends the day before the new type takes effect with end_reason enrollment_change.
      A McKinney-Vento School-of-Origin Transportation assignment continues to the end of the school year after the family obtains permanent housing (continues_through_year_end_after_housing).
      A district withdrawal ends service on the withdrawal date with end_reason district_withdrawal, a semester permit ends after its semester with end_reason permit_period_end, and every assignment ends at the end of the school year with end_reason school_year_end, a new application being needed for the next school year (application_annual).
    eligibility: []

  - id: transport_pm_release
    subject: [transport_no_adult_return, transport_conduct_suspension]
    rule: >-
      A student in a grade listed in adult_at_stop_required_grades is released at the PM stop only to a parent or an authorized adult on file; when no one is there, the student is returned to the campus and the family picks the student up there.
      Each return is recorded once per service date, and when the returns in one semester reach no_adult_return_limit (transport_msr_no_adult_returns_semester), riding is suspended for no_adult_suspension_school_days school days starting the next school day.
      A return does not count as a conduct offense and never revokes a courtesy permit.
    eligibility: []
    measures: [transport_msr_no_adult_returns_semester]

  - id: transport_payments
    subject: [transport_payment]
    rule: >-
      Permit and pass fees are paid by the methods in accepted_payment_methods and are applied to the assignment's oldest open fee first.
      A payment applies only to the assignment the family names; a payment never moves to a sibling's assignment.
      Payment is not required on a fee fully offset by credits.
    eligibility: []

extended_policies:
  - id: transport_ext_meal_status_fee_adjustment
    base_policy_refs: [transport_evt_permit_fee, transport_agg_household_permit_cap, transport_bus_pass, transport_cancellation_and_refunds]
    overwrite:
      - base_policy: transport_evt_permit_fee
        superseded_clause: >-
          A meal status determined after the fee posted does not change that fee; it applies to the next permit fee posted.
        replaced_by: >-
          A meal status that took effect after a courtesy rider permit fee posted never lowers or removes the meal-status waiver credit that fee already carries, and it applies to the next permit fee posted; when the status on file took effect after the fee's posting date and its waiver share is larger than the waiver share already credited on the fee, the fee is also corrected by the fee-waiver adjustment of this rule, and only in that case.
    trigger: state_due
    subject: [transport_fee_credit]
    computes: adjustment_amount
    target_tool: record_fee_correction_81e67279
    params:
      months_school_year: 10
      months_semester: 5
      first_school_day_fall: "2026-08-12"
      first_school_day_spring: "2027-01-06"
      last_day_school_year: "2027-05-31"
      last_day_fall_semester: "2026-12-31"
      last_day_spring_semester: "2027-05-31"
      application_deadline_day: "2026-07-15"
      late_charge: 15.00
      late_charge_after_start: 25.00
      held_days_whole: 10
      held_days_half: 6
      day_marker_10: "2027-12-10"
      day_marker_20: "2027-12-20"
      day_marker_31: "2027-12-31"
      month_part_whole: 1
      month_part_half: 0.5
    rule: >-
      This is the Calloway Creek ISD fee-waiver adjustment for courtesy rider permits under Board Policy FP(LOCAL) (TEC 11.158(b) fee waivers), posted by the transportation office as a transport_fee_credit with credit_reason billing_correction against the permit fee of the assignment, on the day the transportation office finds it owed.
      A meal status that took effect after a courtesy rider permit fee posted never lowers or removes the meal-status waiver credit that fee already carries, and it applies to the next permit fee posted; when the status on file took effect after the fee's posting date and its waiver share is larger than the waiver share already credited on the fee, the fee is also corrected by the fee-waiver adjustment of this rule, and only in that case.
      The fee-waiver adjustment is the waivable fee times the waiver share of the meal status on file, less the meal-status waiver credits already on the fee, never below zero, times the adjustment months divided by the months the fee covers, less every billing correction already posted against the fee, never below zero and never more than the fee net of every credit already against it, rounded half-up to the cent once on the result; the waivable fee is the permit fee as posted less any application charge and any held-seat charge it carries, and the months of the permit period are months_school_year for a school_year fee and months_semester for a fall_semester or spring_semester fee, running from August through May for a school_year fee, August through December for a fall_semester fee and January through May for a spring_semester fee.
      The months the fee covers are all the months of the permit period for a fee posted before the period's first school day (first_school_day_fall for a school_year or fall_semester fee, first_school_day_spring for a spring_semester fee); for a school_year fee posted on or after that day they are the whole calendar months from the month the fee posted through May, that month included; for any other fee posted on or after that day they are the calendar days from the posting day to the period's last day divided by the calendar days from the period's first school day to its last day, times the months of the permit period; the fee's span runs from the later of the period's first school day and the posting day to the period's last day.
      An adjustment that figures to zero, including every case outside the condition above, is owed as nothing and posts no credit entry.
      In the standard figure the waiver share of the meal status on file is reduced_meal_fee_waiver_pct, no application charge and no held-seat charge is taken out of the fee, and the adjustment months are the calendar days from the later of the day the status on file took effect and the start of the fee's span to the last day of the adjustment window divided by the calendar days of the fee's span, times the months the fee covers; the last day of the adjustment window is the end_date of an assignment in status ended or cancelled, and otherwise the last day of the permit period (May 31, or December 31 for a fall_semester fee).
      A share set below replaces the standard share, an amount set below is taken out of the fee before the share is applied, a count of months set below replaces the standard count, any month a schedule below adds is added to the adjustment months, and the adjustment months never exceed the months the fee covers.
      The waiver share of the meal status on file is read from the student's School Nutrition meal account on the day the adjustment is figured: a student holding any Free Meal Status tier counts at free_meal_fee_waiver_pct; a student holding Paid Meal Status, or with no meal account, counts at zero; a student holding any Reduced-Price Meal Status tier counts at reduced_meal_fee_waiver_pct.
      The adjustment never reaches a late application charge: the application charge a permit fee carries is late_charge_after_start when the assignment's application was received after the permit period's first school day, late_charge when a school_year or fall_semester application was received after application_deadline_day and on or before that first school day, and nothing otherwise.
      Nor does it reach a held-seat charge, the months billed for a seat offered from the waiting list and held before the family accepted it: the fee carries one held month when the seat was offered (the assignment's stop_assignment_date) in an earlier calendar month than the month the fee posted and the fee posted more than held_days_whole calendar days after the offer, half a held month when the seat was offered in an earlier calendar month and the fee posted held_days_half to held_days_whole calendar days after the offer, and no held month otherwise or when no stop is assigned; the held-seat charge is the fee less its application charge, times the held months divided by the months the fee covers plus the held months.
      The household application the status on file rests on is the meal benefit application the student's meal account names, received on its submitted_date; a status whose meal account names no application rests on none.
      The adjustment months are counted by the permit and the effective date: for a status that took effect before the permit period's first school day, they are the calendar months from the month of that first school day through the month of the last day of the adjustment window, both included; for a Courtesy Rider Permit (Annual) whose status took effect on or after that day, they are the whole calendar months after the month the status took effect through the month of the last day of the adjustment window, plus the month the status took effect counted as month_part_whole month when it took effect on or before the 10th day of that month or rests on a household application received in an earlier calendar month, as month_part_half month when it took effect on the 11th through the 20th day, and as nothing otherwise; for any other permit they are the calendar-day count of the standard figure; and for a status that took effect after the last day of the adjustment window they are none.
      The district dates a household application's benefit from the date the application was received, as the USDA Eligibility Manual for School Meals permits a local educational agency to do, so the month of receipt counts in part: for a status that took effect on or before the last day of the adjustment window and rests on a household application received after the fee posted, on or after the permit period's first school day and in an earlier calendar month than the month the status took effect, the month of receipt adds month_part_whole month when the application was received on or before the 10th day of that month and month_part_half month when it was received on the 11th through the 20th day; in every other case the month of receipt adds nothing.
    prerequisite: []
    cross_category:
      - category: meals
        as: branch
        reads: [variant_name, benefit_effective_date, meal_benefit_application_id, meal_benefit_applications.submitted_date]
        note: The held-status share, the month count and the receipt-month part are decided from the student's meal account and the household application it rests on.
    inputs:
      history:
        - {table: transport_ledger, aggregate: sum, field: amount, filters: {event_type: transport_permit_fee}}
        - {table: transport_ledger, aggregate: sum, field: amount, filters: {event_type: transport_fee_credit}}
        - {category: meals, table: meal_benefit_applications, aggregate: latest, field: submitted_date, filters: {}}
      cross_category: [meals]
    compute:
      - fee_posted: "SUM('transport_ledger', 'amount', event_type='transport_permit_fee')"
      - fee_posted_on: "LATEST('transport_ledger', 'posted_date', date_field='posted_date', event_type='transport_permit_fee')"
      - fee_period: "LATEST('transport_ledger', 'fee_period_label', date_field='posted_date', event_type='transport_permit_fee')"
      - meal_waiver_credits: "SUM('transport_ledger', 'amount', event_type='transport_fee_credit', credit_reason='free_meal_waiver') + SUM('transport_ledger', 'amount', event_type='transport_fee_credit', credit_reason='reduced_meal_waiver')"
      - prior_corrections: "SUM('transport_ledger', 'amount', event_type='transport_fee_credit', credit_reason='billing_correction')"
      - fee_entry: "LATEST('transport_ledger', 'transport_ledger_id', date_field='posted_date', event_type='transport_permit_fee')"
      - credits_against_fee: "SUM('transport_ledger', 'amount', event_type='transport_fee_credit', source_transport_ledger_id=fee_entry) if fee_entry != None else 0"
      - period_months: "K('months_school_year') if fee_period == 'school_year' else K('months_semester')"
      - period_first_school_day: "K('first_school_day_spring') if fee_period == 'spring_semester' else K('first_school_day_fall')"
      - period_last_day: "K('last_day_fall_semester') if fee_period == 'fall_semester' else K('last_day_school_year')"
      - span_first_day: "MX(period_first_school_day, fee_posted_on) if fee_posted_on != None else period_first_school_day"
      - fee_months: "period_months if (fee_posted_on == None or DAYS(fee_posted_on, period_first_school_day) > 0) else ((MONTHS(fee_posted_on, K('day_marker_31')) - MONTHS(period_last_day, K('day_marker_31')) + 1) if fee_period == 'school_year' else period_months * MX(0, DAYS(fee_posted_on, period_last_day)) / MX(1, DAYS(period_first_school_day, period_last_day)))"
      - window_last_day: "F('end_date') if ((F('status') == 'ended' or F('status') == 'cancelled') and F('end_date') != '' and F('end_date') != None) else period_last_day"
      - status_effective: "CFIELD('meals', 'benefit_effective_date', student_id=F('student_id')) if (CFIELD('meals', 'benefit_effective_date', student_id=F('student_id')) != None and fee_posted_on != None) else (fee_posted_on if fee_posted_on != None else NOW)"
      - rise_after_posting: "fee_posted_on != None and DAYS(fee_posted_on, status_effective) > 0"
      - day_count_months: "MX(0, DAYS(MX(status_effective, span_first_day), window_last_day)) / MX(1, DAYS(span_first_day, period_last_day)) * fee_months"
      - held_share: "P('free_meal_fee_waiver_pct') if CPARAM('meals', 'benefit_level', student_id=F('student_id')) == 'free' else (P('reduced_meal_fee_waiver_pct') if CPARAM('meals', 'benefit_level', student_id=F('student_id')) == 'reduced' else 0)"
      - application_charge: "0 if (F('application_date') == None or F('application_date') == '') else (K('late_charge_after_start') if DAYS(period_first_school_day, F('application_date')) > 0 else (K('late_charge') if (fee_period != 'spring_semester' and DAYS(K('application_deadline_day'), F('application_date')) > 0) else 0))"
      - held_fraction: "0 if (fee_posted_on == None or F('stop_assignment_date') == None or F('stop_assignment_date') == '' or MONTHS(F('stop_assignment_date'), K('day_marker_31')) <= MONTHS(fee_posted_on, K('day_marker_31')) or DAYS(F('stop_assignment_date'), fee_posted_on) < K('held_days_half')) else ((K('month_part_whole') if DAYS(F('stop_assignment_date'), fee_posted_on) > K('held_days_whole') else K('month_part_half')) / (fee_months + (K('month_part_whole') if DAYS(F('stop_assignment_date'), fee_posted_on) > K('held_days_whole') else K('month_part_half'))))"
      - application_received: "XLATEST('meals', 'meal_benefit_applications', 'submitted_date', date_field='submitted_date', meal_benefit_application_id=CFIELD('meals', 'meal_benefit_application_id', student_id=F('student_id')))"
      - counted_months: "0 if DAYS(status_effective, window_last_day) < 0 else (MX(0, MONTHS(period_first_school_day, K('day_marker_31')) - MONTHS(window_last_day, K('day_marker_31')) + 1) if DAYS(status_effective, period_first_school_day) > 0 else ((MX(0, MONTHS(status_effective, K('day_marker_31')) - MONTHS(window_last_day, K('day_marker_31'))) + (K('month_part_whole') if (MONTHS(status_effective, K('day_marker_10')) == MONTHS(status_effective, K('day_marker_31')) or (CPARAM('meals', 'eligibility_source', student_id=F('student_id')) == 'household_application' and application_received != None and MONTHS(application_received, K('day_marker_31')) > MONTHS(status_effective, K('day_marker_31')))) else (K('month_part_half') if MONTHS(status_effective, K('day_marker_20')) == MONTHS(status_effective, K('day_marker_31')) else 0))) if fee_period == 'school_year' else day_count_months))"
      - receipt_part: "K('month_part_whole') if (CPARAM('meals', 'eligibility_source', student_id=F('student_id')) == 'household_application' and application_received != None and fee_posted_on != None and DAYS(fee_posted_on, application_received) > 0 and DAYS(period_first_school_day, application_received) >= 0 and DAYS(status_effective, window_last_day) >= 0 and MONTHS(application_received, K('day_marker_31')) > MONTHS(status_effective, K('day_marker_31')) and MONTHS(application_received, K('day_marker_10')) == MONTHS(application_received, K('day_marker_31'))) else (K('month_part_half') if (CPARAM('meals', 'eligibility_source', student_id=F('student_id')) == 'household_application' and application_received != None and fee_posted_on != None and DAYS(fee_posted_on, application_received) > 0 and DAYS(period_first_school_day, application_received) >= 0 and DAYS(status_effective, window_last_day) >= 0 and MONTHS(application_received, K('day_marker_31')) > MONTHS(status_effective, K('day_marker_31')) and MONTHS(application_received, K('day_marker_20')) == MONTHS(application_received, K('day_marker_31'))) else 0)"
      - adjustment_months: "MN(fee_months, counted_months + receipt_part)"
      - share_amount: "MX(0, MX(0, fee_posted - application_charge) * (1 - held_fraction) * held_share / 100 - meal_waiver_credits) if rise_after_posting else 0"
      - result: "RND(MN(MX(0, fee_posted - credits_against_fee), MX(0, share_amount * adjustment_months / (fee_months if fee_months > 0 else 1) - prior_corrections)) + 0.000000001, 2)"
    compute_basis:
      fee_posted: "the waivable fee is the permit fee as posted less any application charge and any held-seat charge it carries"
      fee_posted_on: "when the status on file took effect after the fee's posting date and its waiver share is larger than the waiver share already credited on the fee, the fee is also corrected by the fee-waiver adjustment of this rule, and only in that case."
      fee_period: "the months of the permit period are months_school_year for a school_year fee and months_semester for a fall_semester or spring_semester fee"
      meal_waiver_credits: "less the meal-status waiver credits already on the fee, never below zero"
      prior_corrections: "less every billing correction already posted against the fee, never below zero"
      fee_entry: "never more than the fee net of every credit already against it"
      credits_against_fee: "never more than the fee net of every credit already against it"
      period_months: "the months of the permit period are months_school_year for a school_year fee and months_semester for a fall_semester or spring_semester fee"
      period_first_school_day: "the period's first school day (first_school_day_fall for a school_year or fall_semester fee, first_school_day_spring for a spring_semester fee)"
      period_last_day: "otherwise the last day of the permit period (May 31, or December 31 for a fall_semester fee)."
      span_first_day: "the fee's span runs from the later of the period's first school day and the posting day to the period's last day."
      fee_months: "The months the fee covers are all the months of the permit period for a fee posted before the period's first school day (first_school_day_fall for a school_year or fall_semester fee, first_school_day_spring for a spring_semester fee); for a school_year fee posted on or after that day they are the whole calendar months from the month the fee posted through May, that month included; for any other fee posted on or after that day they are the calendar days from the posting day to the period's last day divided by the calendar days from the period's first school day to its last day, times the months of the permit period"
      window_last_day: "the last day of the adjustment window is the end_date of an assignment in status ended or cancelled, and otherwise the last day of the permit period (May 31, or December 31 for a fall_semester fee)."
      status_effective: "the day the status on file took effect"
      rise_after_posting: "when the status on file took effect after the fee's posting date and its waiver share is larger than the waiver share already credited on the fee, the fee is also corrected by the fee-waiver adjustment of this rule, and only in that case."
      day_count_months: "the adjustment months are the calendar days from the later of the day the status on file took effect and the start of the fee's span to the last day of the adjustment window divided by the calendar days of the fee's span, times the months the fee covers"
      held_share: "a student holding any Free Meal Status tier counts at free_meal_fee_waiver_pct; a student holding Paid Meal Status, or with no meal account, counts at zero; a student holding any Reduced-Price Meal Status tier counts at reduced_meal_fee_waiver_pct."
      application_charge: "the application charge a permit fee carries is late_charge_after_start when the assignment's application was received after the permit period's first school day, late_charge when a school_year or fall_semester application was received after application_deadline_day and on or before that first school day, and nothing otherwise."
      held_fraction: "the fee carries one held month when the seat was offered (the assignment's stop_assignment_date) in an earlier calendar month than the month the fee posted and the fee posted more than held_days_whole calendar days after the offer, half a held month when the seat was offered in an earlier calendar month and the fee posted held_days_half to held_days_whole calendar days after the offer, and no held month otherwise or when no stop is assigned; the held-seat charge is the fee less its application charge, times the held months divided by the months the fee covers plus the held months."
      application_received: "The household application the status on file rests on is the meal benefit application the student's meal account names, received on its submitted_date; a status whose meal account names no application rests on none."
      counted_months: "for a status that took effect before the permit period's first school day, they are the calendar months from the month of that first school day through the month of the last day of the adjustment window, both included; for a Courtesy Rider Permit (Annual) whose status took effect on or after that day, they are the whole calendar months after the month the status took effect through the month of the last day of the adjustment window, plus the month the status took effect counted as month_part_whole month when it took effect on or before the 10th day of that month or rests on a household application received in an earlier calendar month, as month_part_half month when it took effect on the 11th through the 20th day, and as nothing otherwise; for any other permit they are the calendar-day count of the standard figure; and for a status that took effect after the last day of the adjustment window they are none."
      receipt_part: "for a status that took effect on or before the last day of the adjustment window and rests on a household application received after the fee posted, on or after the permit period's first school day and in an earlier calendar month than the month the status took effect, the month of receipt adds month_part_whole month when the application was received on or before the 10th day of that month and month_part_half month when it was received on the 11th through the 20th day; in every other case the month of receipt adds nothing."
      adjustment_months: "any month a schedule below adds is added to the adjustment months, and the adjustment months never exceed the months the fee covers."
      share_amount: "The fee-waiver adjustment is the waivable fee times the waiver share of the meal status on file, less the meal-status waiver credits already on the fee, never below zero"
      result: "times the adjustment months divided by the months the fee covers, less every billing correction already posted against the fee, never below zero and never more than the fee net of every credit already against it, rounded half-up to the cent once on the result"
    factors:
      - id: held_status_share
        effect: parameter
        decides: held_share
        bindings: [held_share]
        ladder:
          - when: "the student holds any Free Meal Status tier on the day the adjustment is figured"
            value: "P('free_meal_fee_waiver_pct')"
          - when: "the student holds Paid Meal Status, or has no meal account"
            value: "0"
          - when: "otherwise (any Reduced-Price Meal Status tier)"
            value: "P('reduced_meal_fee_waiver_pct')"
        baseline:
          held_share: "P('reduced_meal_fee_waiver_pct')"
        evidence: [cross_category]
        cross_difficulty: meals
      - id: unadjusted_application_charge
        effect: parameter
        decides: application_charge
        bindings: [application_charge]
        ladder:
          - when: "the assignment's application was received after the permit period's first school day"
            value: "K('late_charge_after_start')"
          - when: "a school_year or fall_semester application received after application_deadline_day and on or before that first school day"
            value: "K('late_charge')"
          - when: "otherwise (including an assignment with no application date)"
            value: "0"
        baseline:
          application_charge: "0"
        evidence: [date]
        cross_difficulty: null
      - id: unadjusted_held_seat
        effect: parameter
        decides: held_fraction
        bindings: [held_fraction]
        ladder:
          - when: "the seat was offered in an earlier calendar month than the month the fee posted AND the fee posted more than held_days_whole calendar days after the offer"
            value: "K('month_part_whole') / (fee_months + K('month_part_whole'))"
          - when: "the seat was offered in an earlier calendar month AND the fee posted held_days_half to held_days_whole calendar days after the offer"
            value: "K('month_part_half') / (fee_months + K('month_part_half'))"
          - when: "otherwise, or no stop is assigned"
            value: "0"
        baseline:
          held_fraction: "0"
        evidence: [date]
        cross_difficulty: null
      - id: month_count_method
        effect: method
        decides: counted_months
        bindings: [counted_months]
        ladder:
          - when: "the status took effect before the permit period's first school day"
            method: "count the calendar months from the first school day's month through the window's last month, both included"
          - when: "a Courtesy Rider Permit (Annual) whose status took effect on or after that day"
            method: "count the whole calendar months after the effective month through the window's last month, plus the effective month by its day (whole on or before the 10th or when resting on an application received in an earlier month, half on the 11th-20th, none later); none at all when the status took effect after the window's last day"
          - when: "otherwise"
            method: "count the calendar days from the later of the effective date and the span start to the window's last day over the span's days, times the months the fee covers"
        baseline:
          counted_months: "day_count_months"
        evidence: [cross_category, date]
        cross_difficulty: meals
      - id: application_receipt_part
        effect: parameter
        decides: receipt_part
        bindings: [receipt_part]
        ladder:
          - when: "the status took effect on or before the window's last day AND rests on a household application received after the fee posted, on or after the permit period's first school day, in an earlier calendar month than the month the status took effect, AND on or before the 10th day of its month"
            value: "K('month_part_whole')"
          - when: "the same, but received on the 11th through the 20th day of its month"
            value: "K('month_part_half')"
          - when: "otherwise"
            value: "0"
        baseline:
          receipt_part: "0"
        evidence: [cross_category, date]
        cross_difficulty: meals
    baseline:
      rule: >-
        The fee-waiver adjustment is the waivable fee times the waiver share of the meal status on file, less the meal-status waiver credits already on the fee, never below zero, times the adjustment months divided by the months the fee covers, less every billing correction already posted against the fee, never below zero and never more than the fee net of every credit already against it, rounded half-up to the cent once on the result; the waivable fee is the permit fee as posted less any application charge and any held-seat charge it carries, and the months of the permit period are months_school_year for a school_year fee and months_semester for a fall_semester or spring_semester fee, running from August through May for a school_year fee, August through December for a fall_semester fee and January through May for a spring_semester fee.
        The months the fee covers are all the months of the permit period for a fee posted before the period's first school day (first_school_day_fall for a school_year or fall_semester fee, first_school_day_spring for a spring_semester fee); for a school_year fee posted on or after that day they are the whole calendar months from the month the fee posted through May, that month included; for any other fee posted on or after that day they are the calendar days from the posting day to the period's last day divided by the calendar days from the period's first school day to its last day, times the months of the permit period; the fee's span runs from the later of the period's first school day and the posting day to the period's last day.
        In the standard figure the waiver share of the meal status on file is reduced_meal_fee_waiver_pct, no application charge and no held-seat charge is taken out of the fee, and the adjustment months are the calendar days from the later of the day the status on file took effect and the start of the fee's span to the last day of the adjustment window divided by the calendar days of the fee's span, times the months the fee covers; the last day of the adjustment window is the end_date of an assignment in status ended or cancelled, and otherwise the last day of the permit period (May 31, or December 31 for a fall_semester fee).
      params: [months_school_year, months_semester, first_school_day_fall, first_school_day_spring, last_day_school_year, last_day_fall_semester, last_day_spring_semester, reduced_meal_fee_waiver_pct]
  - id: transport_ext_family_cancellation_credit
    base_policy_refs: [transport_cancellation_and_refunds, transport_evt_permit_fee, transport_agg_household_permit_cap, transport_bus_pass]
    overwrite:
      - base_policy: transport_cancellation_and_refunds
        superseded_clause: >-
          A cancellation whose last day of service falls within cancellation_full_credit_days calendar days after the permit's start_date, the start date being day 0, credits the permit fee net of its waiver and cap credits in full with credit_reason cancellation_window; a later cancellation earns no credit.
        replaced_by: >-
          The cancellation credit is the permit fee net of every meal-status waiver credit, household cap credit and billing correction credit against it, times the credited share of the permit period, never below zero and never more than one, then less the processing charge, never below zero, rounded half-up to the cent once on the result.
    trigger: on_request
    subject: [transport_permit_cancellation, transport_fee_credit]
    computes: credit_amount
    target_tool: confirm_permit_cancellation_9706a650
    params:
      months_school_year: 10
      months_semester: 5
      first_school_day_fall_semester: "2026-08-12"
      first_school_day_spring_semester: "2027-01-06"
      last_day_school_year: "2027-05-31"
      last_day_fall_semester: "2026-12-31"
      last_day_spring_semester: "2027-05-31"
      day_marker_10: "2027-12-10"
      day_marker_20: "2027-12-20"
      day_marker_31: "2027-12-31"
      processing_charge: 10.00
      processing_charge_reduced: 5.00
      notice_days_full: 14
      notice_days_half: 7
      month_part_whole: 1
      month_part_half: 0.5
      card_processing_pct: 3
      ach_item_charge: 1.00
      held_days_whole: 10
      held_days_half: 6
      application_deadline_day: "2026-07-15"
      late_charge: 15.00
      late_charge_after_start: 25.00
    rule: >-
      This is the Calloway Creek ISD courtesy rider permit refund schedule under Board Policy CNA(LOCAL) for a family's own cancellation of a Courtesy Rider Permit (Semester) or Courtesy Rider Permit (Annual).
      Only the family cancels its courtesy rider permit: the support desk records the family's permit_cancellation request, and the parent or guardian confirms the cancellation personally in the parent portal; the confirmation ends service that day, the day of confirmation being the last day of service, completes the family's received permit_cancellation request, and posts the cancellation credit as a transport_fee_credit with credit_reason cancellation_window against the permit fee, except that a cancellation credit of zero posts no credit entry.
      The cancellation credit is fixed only after the permit fee carries the billing correction owed for a higher meal status that took effect after the fee posted.
      The cancellation credit is the permit fee net of every meal-status waiver credit, household cap credit and billing correction credit against it, times the credited share of the permit period, never below zero and never more than one, then less the processing charge, never below zero, rounded half-up to the cent once on the result.
      In the standard figure the credited share is the calendar days from the last day of service to the last day of the permit period divided by the calendar days of the fee's span, no month is added, nothing is taken out of the net fee, no payment processing cost is kept, and the processing charge is processing_charge; the permit period's first school day is first_school_day_fall_semester for a school_year or fall_semester permit and first_school_day_spring_semester for a spring_semester permit, its last day is May 31 for a school_year or spring_semester permit and December 31 for a fall_semester permit, and it has months_school_year months for a school_year permit and months_semester months for a semester permit; the months the fee covers are all the months of the permit period for a fee posted before the permit period's first school day; for a school_year fee posted on or after that day they are the whole calendar months from the month the fee posted through May, that month included; for any other fee posted on or after that day they are the calendar days from the posting day to the period's last day divided by the calendar days from the period's first school day to its last day, times the months of the permit period; and the fee's span runs from the later of the period's first school day and the posting day to the period's last day.
      Every month a schedule below adds is added to the credited share at one month's share of the months the fee covers (one divided by them, and nothing for a fee that covers no months), an amount a schedule below takes out of the net fee is taken out before the credited share is applied, the processing charge a schedule below sets replaces the standard processing charge, and a payment processing cost a schedule below keeps is taken out of the credit together with the processing charge.
      The credited share depends on when the last day of service falls and on the permit: when the last day falls within cancellation_full_credit_days calendar days after the permit's start_date, the start date being day 0, or the permit has no start_date because service never began, the credited share is one, the whole fee; when it falls later on a Courtesy Rider Permit (Annual), the credited share is the whole calendar months of the permit period after the month of the last day, plus the month of the last day counted as month_part_whole month when the last day falls on or before the 10th day of the month, as month_part_half month when it falls on the 11th through the 20th day, and as nothing otherwise, divided by the months the fee covers; otherwise the credited share is the calendar-day share of the standard figure.
      A late application charge is never refunded: the application charge the permit fee carries, by the day the application was received on the assignment, is late_charge_after_start for an application received after the permit period's first school day, late_charge for a school_year or fall_semester application received after application_deadline_day and on or before that first school day, and nothing for any other application, and it is taken out of the net fee before the credited share is applied.
      A held-seat charge is never refunded either, being the months billed for a seat offered from the waiting list and held before the family accepted it: the fee carries one held month when the seat was offered (the assignment's stop_assignment_date) in an earlier calendar month than the month the fee posted and the fee posted more than held_days_whole calendar days after the offer, half a held month when the seat was offered in an earlier calendar month and the fee posted held_days_half to held_days_whole calendar days after the offer, and no held month otherwise or when no stop is assigned; the held-seat charge is the fee less its application charge, times the held months divided by the months the fee covers plus the held months, and it is taken out of the net fee before the credited share is applied.
      Written notice adds credit: when the latest permit_cancellation request on the assignment that stands with request_status received (latest by its received time) was received notice_days_full or more calendar days before the last day of service, one month is added; when it was received notice_days_half to 13 calendar days before, half a month is added; otherwise nothing is added.
      The district's card and bank processing costs on the family's payments toward the fee are not credited back: each payment on the assignment made by online_card keeps card_processing_pct percent of that payment, each payment made by ach_bank_draft keeps ach_item_charge, and a payment made by personal_check or money_order keeps nothing.
      The processing charge follows the meal status the student holds on the last day of service, because the district's fee waivers extend to it: a student holding any Free Meal Status tier pays no processing charge; a student holding any Reduced-Price Meal Status tier pays processing_charge_reduced; any other student pays processing_charge.
    prerequisite:
      - problem: transport_ext_meal_status_fee_adjustment
        kind: value_input
        gate: fee_net
        form: state
        policy_source: >-
          The cancellation credit is fixed only after the permit fee carries the billing correction owed for a higher meal status that took effect after the fee posted.
        condition: >-
          On the assignment's billing record, the permit fee carries a billing_correction credit equal to the fee-waiver adjustment owed whenever the meal status on file took effect after the permit fee posted and carries a larger waiver share than the share already credited on the fee; when no such status exists nothing is owed and the condition holds.
        resolved_by: record_fee_correction_81e67279
        effect: >-
          The billing correction credit lowers the permit fee net of its credits (binding fee_net), so the cancellation credit is figured on the corrected net fee.
    cross_category:
      - category: meals
        as: branch
        reads: [variant_name]
        note: The processing charge level is decided from the meal status the student holds on the last day of service.
    inputs:
      history:
        - {table: transport_ledger, aggregate: sum, field: amount, filters: {event_type: transport_fee_credit}}
        - {table: transport_ledger, aggregate: sum, field: amount, filters: {event_type: transport_payment}}
        - {table: transport_requests, aggregate: latest, field: created_at, filters: {request_type: permit_cancellation, request_status: received}}
      cross_category: [meals]
    compute:
      - fee_amount: "SUM('transport_ledger', 'amount', event_type='transport_permit_fee')"
      - fee_credits: "SUM('transport_ledger', 'amount', event_type='transport_fee_credit', credit_reason='free_meal_waiver') + SUM('transport_ledger', 'amount', event_type='transport_fee_credit', credit_reason='reduced_meal_waiver') + SUM('transport_ledger', 'amount', event_type='transport_fee_credit', credit_reason='household_cap') + SUM('transport_ledger', 'amount', event_type='transport_fee_credit', credit_reason='billing_correction')"
      - fee_net: "MX(0, fee_amount - fee_credits)"
      - fee_label: "LATEST('transport_ledger', 'fee_period_label', date_field='posted_date', event_type='transport_permit_fee')"
      - months_in_period: "K('months_school_year') if fee_label == 'school_year' else K('months_semester')"
      - period_first_school_day: "K('first_school_day_spring_semester') if fee_label == 'spring_semester' else K('first_school_day_fall_semester')"
      - period_end_day: "K('last_day_school_year') if fee_label == 'school_year' else (K('last_day_fall_semester') if fee_label == 'fall_semester' else K('last_day_spring_semester'))"
      - fee_posted_on: "LATEST('transport_ledger', 'posted_date', date_field='posted_date', event_type='transport_permit_fee')"
      - span_first_day: "MX(period_first_school_day, fee_posted_on) if fee_posted_on != None else period_first_school_day"
      - fee_months: "months_in_period if (fee_posted_on == None or DAYS(fee_posted_on, period_first_school_day) > 0) else ((MONTHS(fee_posted_on, K('day_marker_31')) - MONTHS(period_end_day, K('day_marker_31')) + 1) if fee_label == 'school_year' else months_in_period * MX(0, DAYS(fee_posted_on, period_end_day)) / MX(1, DAYS(period_first_school_day, period_end_day)))"
      - day_share: "MX(0, DAYS(NOW, period_end_day)) / MX(1, DAYS(span_first_day, period_end_day))"
      - credited_share: "1 if (F('start_date') == None or F('start_date') == '' or DAYS(F('start_date'), NOW) <= P('cancellation_full_credit_days')) else (((MX(0, MONTHS(NOW, K('day_marker_31')) - MONTHS(period_end_day, K('day_marker_31'))) + (K('month_part_whole') if MONTHS(NOW, K('day_marker_10')) == MONTHS(NOW, K('day_marker_31')) else (K('month_part_half') if MONTHS(NOW, K('day_marker_20')) == MONTHS(NOW, K('day_marker_31')) else 0))) / fee_months) if (fee_label == 'school_year' and fee_months > 0) else day_share)"
      - application_charge_withheld: "0 if (F('application_date') == None or F('application_date') == '') else (K('late_charge_after_start') if DAYS(period_first_school_day, F('application_date')) > 0 else (K('late_charge') if (period_first_school_day == K('first_school_day_fall_semester') and DAYS(K('application_deadline_day'), F('application_date')) > 0) else 0))"
      - held_fraction: "0 if (fee_posted_on == None or F('stop_assignment_date') == None or F('stop_assignment_date') == '' or MONTHS(F('stop_assignment_date'), K('day_marker_31')) <= MONTHS(fee_posted_on, K('day_marker_31')) or DAYS(F('stop_assignment_date'), fee_posted_on) < K('held_days_half')) else ((K('month_part_whole') if DAYS(F('stop_assignment_date'), fee_posted_on) > K('held_days_whole') else K('month_part_half')) / (fee_months + (K('month_part_whole') if DAYS(F('stop_assignment_date'), fee_posted_on) > K('held_days_whole') else K('month_part_half'))))"
      - request_received_at: "LATEST('transport_requests', 'created_at', date_field='created_at', request_type='permit_cancellation', request_status='received')"
      - notice_months: "1 if (request_received_at != None and DAYS(request_received_at, NOW) >= K('notice_days_full')) else (0.5 if (request_received_at != None and DAYS(request_received_at, NOW) >= K('notice_days_half')) else 0)"
      - card_paid: "SUM('transport_ledger', 'amount', event_type='transport_payment', payment_method='online_card')"
      - ach_drafts: "COUNT('transport_ledger', event_type='transport_payment', payment_method='ach_bank_draft')"
      - processing_kept: "K('card_processing_pct') * card_paid / 100 + K('ach_item_charge') * ach_drafts if card_paid > 0 else (K('ach_item_charge') * ach_drafts if ach_drafts > 0 else 0)"
      - processing: "0 if CPARAM('meals', 'benefit_level', student_id=F('student_id')) == 'free' else (K('processing_charge_reduced') if CPARAM('meals', 'benefit_level', student_id=F('student_id')) == 'reduced' else K('processing_charge'))"
      - share_total: "MN(1, MX(0, credited_share + (notice_months / fee_months if fee_months > 0 else 0)))"
      - result: "RND(MX(0, MX(0, fee_net - application_charge_withheld - MX(0, fee_amount - application_charge_withheld) * held_fraction) * share_total - processing - processing_kept) + 0.000000001, 2)"
    compute_basis:
      fee_amount: "The cancellation credit is the permit fee net of every meal-status waiver credit, household cap credit and billing correction credit against it"
      fee_credits: "The cancellation credit is the permit fee net of every meal-status waiver credit, household cap credit and billing correction credit against it"
      fee_net: "The cancellation credit is the permit fee net of every meal-status waiver credit, household cap credit and billing correction credit against it"
      fee_label: "it has months_school_year months for a school_year permit and months_semester months for a semester permit"
      months_in_period: "it has months_school_year months for a school_year permit and months_semester months for a semester permit"
      period_first_school_day: "the permit period's first school day is first_school_day_fall_semester for a school_year or fall_semester permit and first_school_day_spring_semester for a spring_semester permit"
      period_end_day: "its last day is May 31 for a school_year or spring_semester permit and December 31 for a fall_semester permit"
      fee_posted_on: "for a school_year fee posted on or after that day they are the whole calendar months from the month the fee posted through May, that month included"
      span_first_day: "the fee's span runs from the later of the period's first school day and the posting day to the period's last day."
      fee_months: "the months the fee covers are all the months of the permit period for a fee posted before the permit period's first school day; for a school_year fee posted on or after that day they are the whole calendar months from the month the fee posted through May, that month included; for any other fee posted on or after that day they are the calendar days from the posting day to the period's last day divided by the calendar days from the period's first school day to its last day, times the months of the permit period"
      day_share: "In the standard figure the credited share is the calendar days from the last day of service to the last day of the permit period divided by the calendar days of the fee's span"
      credited_share: "when the last day falls within cancellation_full_credit_days calendar days after the permit's start_date, the start date being day 0, or the permit has no start_date because service never began, the credited share is one, the whole fee; when it falls later on a Courtesy Rider Permit (Annual), the credited share is the whole calendar months of the permit period after the month of the last day, plus the month of the last day counted as month_part_whole month when the last day falls on or before the 10th day of the month, as month_part_half month when it falls on the 11th through the 20th day, and as nothing otherwise, divided by the months the fee covers; otherwise the credited share is the calendar-day share of the standard figure."
      application_charge_withheld: "the application charge the permit fee carries, by the day the application was received on the assignment, is late_charge_after_start for an application received after the permit period's first school day, late_charge for a school_year or fall_semester application received after application_deadline_day and on or before that first school day, and nothing for any other application, and it is taken out of the net fee before the credited share is applied."
      held_fraction: "the fee carries one held month when the seat was offered (the assignment's stop_assignment_date) in an earlier calendar month than the month the fee posted and the fee posted more than held_days_whole calendar days after the offer, half a held month when the seat was offered in an earlier calendar month and the fee posted held_days_half to held_days_whole calendar days after the offer, and no held month otherwise or when no stop is assigned; the held-seat charge is the fee less its application charge, times the held months divided by the months the fee covers plus the held months, and it is taken out of the net fee before the credited share is applied."
      request_received_at: "when the latest permit_cancellation request on the assignment that stands with request_status received (latest by its received time) was received"
      notice_months: "when the latest permit_cancellation request on the assignment that stands with request_status received (latest by its received time) was received notice_days_full or more calendar days before the last day of service, one month is added; when it was received notice_days_half to 13 calendar days before, half a month is added; otherwise nothing is added."
      card_paid: "each payment on the assignment made by online_card keeps card_processing_pct percent of that payment"
      ach_drafts: "each payment made by ach_bank_draft keeps ach_item_charge"
      processing_kept: "each payment on the assignment made by online_card keeps card_processing_pct percent of that payment, each payment made by ach_bank_draft keeps ach_item_charge, and a payment made by personal_check or money_order keeps nothing."
      processing: "a student holding any Free Meal Status tier pays no processing charge; a student holding any Reduced-Price Meal Status tier pays processing_charge_reduced; any other student pays processing_charge."
      share_total: "Every month a schedule below adds is added to the credited share at one month's share of the months the fee covers (one divided by them, and nothing for a fee that covers no months)"
      result: "times the credited share of the permit period, never below zero and never more than one, then less the processing charge, never below zero, rounded half-up to the cent once on the result."
    factors:
      - id: credited_share_method
        effect: method
        decides: credited_share
        bindings: [credited_share]
        ladder:
          - when: "the last day of service falls within cancellation_full_credit_days calendar days after the permit's start_date (start date = day 0), or the permit has no start_date (service never began)"
            method: "credit the whole fee (share one)"
          - when: "the last day falls later AND the permit is a Courtesy Rider Permit (Annual)"
            method: "credit the whole calendar months of the permit period after the month of the last day plus the last-day month by its day (whole on or before the 10th, half on the 11th-20th, none later), over the months the fee covers"
          - when: "otherwise"
            method: "credit the calendar days from the last day to the period's last day over the days of the fee's span"
        baseline:
          credited_share: "day_share"
        evidence: [date]
        cross_difficulty: null
      - id: application_charge_withheld
        effect: parameter
        decides: application_charge_withheld
        bindings: [application_charge_withheld]
        ladder:
          - when: "the application was received after the permit period's first school day"
            value: "K('late_charge_after_start')"
          - when: "a school_year or fall_semester application received after application_deadline_day and on or before that first school day"
            value: "K('late_charge')"
          - when: "otherwise"
            value: "0"
        baseline:
          application_charge_withheld: "0"
        evidence: [date]
        cross_difficulty: null
      - id: notice_lead_months
        effect: parameter
        decides: notice_months
        bindings: [request_received_at, notice_months]
        ladder:
          - when: "a received permit_cancellation request on the assignment AND the latest one was received notice_days_full or more calendar days before the last day of service"
            value: "1"
          - when: "a received permit_cancellation request on the assignment AND the latest one was received notice_days_half to 13 calendar days before the last day of service"
            value: "0.5"
          - when: "otherwise"
            value: "0"
        baseline:
          notice_months: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: unrefunded_held_seat
        effect: parameter
        decides: held_fraction
        bindings: [held_fraction]
        ladder:
          - when: "the seat was offered in an earlier calendar month than the month the fee posted AND the fee posted more than held_days_whole calendar days after the offer"
            value: "K('month_part_whole') / (fee_months + K('month_part_whole'))"
          - when: "the seat was offered in an earlier calendar month AND the fee posted held_days_half to held_days_whole calendar days after the offer"
            value: "K('month_part_half') / (fee_months + K('month_part_half'))"
          - when: "otherwise, or no stop is assigned"
            value: "0"
        baseline:
          held_fraction: "0"
        evidence: [date]
        cross_difficulty: null
      - id: payment_processing_kept
        effect: parameter
        decides: processing_kept
        bindings: [card_paid, ach_drafts, processing_kept]
        ladder:
          - when: "a payment toward the fee was made by online_card"
            value: "K('card_processing_pct') * card_paid / 100 + K('ach_item_charge') * ach_drafts"
          - when: "no online_card payment, and a payment toward the fee was made by ach_bank_draft"
            value: "K('ach_item_charge') * ach_drafts"
          - when: "otherwise (payments by personal_check or money_order only, or no payment)"
            value: "0"
        baseline:
          processing_kept: "0"
        evidence: [history]
        cross_difficulty: null
      - id: processing_charge_level
        effect: parameter
        decides: processing
        bindings: [processing]
        ladder:
          - when: "the student holds any Free Meal Status tier on the last day of service"
            value: "0"
          - when: "the student holds any Reduced-Price Meal Status tier on the last day of service"
            value: "K('processing_charge_reduced')"
          - when: "otherwise"
            value: "K('processing_charge')"
        baseline:
          processing: "K('processing_charge')"
        evidence: [cross_category]
        cross_difficulty: meals
    baseline:
      rule: >-
        The cancellation credit is the permit fee net of every meal-status waiver credit, household cap credit and billing correction credit against it, times the credited share of the permit period, never below zero and never more than one, then less the processing charge, never below zero, rounded half-up to the cent once on the result.
        In the standard figure the credited share is the calendar days from the last day of service to the last day of the permit period divided by the calendar days of the fee's span, no month is added, nothing is taken out of the net fee, no payment processing cost is kept, and the processing charge is processing_charge; the permit period's first school day is first_school_day_fall_semester for a school_year or fall_semester permit and first_school_day_spring_semester for a spring_semester permit, its last day is May 31 for a school_year or spring_semester permit and December 31 for a fall_semester permit, and it has months_school_year months for a school_year permit and months_semester months for a semester permit; the months the fee covers are all the months of the permit period for a fee posted before the permit period's first school day; for a school_year fee posted on or after that day they are the whole calendar months from the month the fee posted through May, that month included; for any other fee posted on or after that day they are the calendar days from the posting day to the period's last day divided by the calendar days from the period's first school day to its last day, times the months of the permit period; and the fee's span runs from the later of the period's first school day and the posting day to the period's last day.
      params: [months_school_year, months_semester, first_school_day_fall_semester, first_school_day_spring_semester, last_day_school_year, last_day_fall_semester, last_day_spring_semester, processing_charge]
  - id: transport_ext_offered_seat_permit_fee
    base_policy_refs: [transport_evt_permit_fee, transport_eligibility_basis, transport_agg_household_permit_cap, transport_stop_assignment_rules]
    overwrite:
      - base_policy: transport_evt_permit_fee
        superseded_clause: >-
          A courtesy rider permit fee of permit_fee posts on the application date for the permit period applied for: fall_semester (August - December) or spring_semester (January - May) for Courtesy Rider Permit (Semester), school_year (August - May) for Courtesy Rider Permit (Annual).
        replaced_by: >-
          Every courtesy rider permit fee is the courtesy permit fee of this schedule for the permit period applied for: fall_semester (August - December) or spring_semester (January - May) for Courtesy Rider Permit (Semester), school_year (August - May) for Courtesy Rider Permit (Annual); it posts on the application date, except that for a courtesy application in status applied that has no permit fee posted and whose stop_assignment_date falls after the first school day of its permit period, a seat offered from the waiting list, and only for such an application, it posts on the day the parent or guardian signs the courtesy rider permit agreement accepting the seat.
    trigger: on_request
