    rule: >-
      This is the Calloway Creek ISD courtesy rider permit fee schedule under Board Policy CNA(LOCAL); courtesy permits are sold on a space-available basis after eligible riders are seated.
      Every courtesy rider permit fee is the courtesy permit fee of this schedule for the permit period applied for: fall_semester (August - December) or spring_semester (January - May) for Courtesy Rider Permit (Semester), school_year (August - May) for Courtesy Rider Permit (Annual); it posts on the application date, except that for a courtesy application in status applied that has no permit fee posted and whose stop_assignment_date falls after the first school day of its permit period, a seat offered from the waiting list, and only for such an application, it posts on the day the parent or guardian signs the courtesy rider permit agreement accepting the seat.
      The agreement is the family's own signed acceptance of the bus rules and of the fee, so the parent or guardian signs it personally in the parent portal; the support desk tells the parent the fee to acknowledge and never signs for the family.
      The courtesy permit fee is the period rate times the billed share of the permit period, times the riding share, plus the application charge, rounded half-up to the cent once on the result; the permit period's first school day is first_school_day_fall for a school_year or fall_semester permit and first_school_day_spring for a spring_semester permit, its last day is May 31 for a school_year or spring_semester permit and December 31 for a fall_semester permit, and it has months_school_year months for a school_year permit and months_semester months for a semester permit; the posting day is the application date, or the signing day for a seat offered from the waiting list.
      In the standard figure the period rate is permit_fee, the billed share is the calendar days from the posting day to the last day of the permit period divided by the calendar days from the period's first school day to its last day, the riding share is one, and there is no application charge.
      A period rate set below replaces the standard one, every amount set below for the period rate is added to it, every month added below is added to the billed share at one month's share of the permit period (one divided by its months), and a share or an application charge set below replaces the standard one.
      The billed share depends on the posting day and on the permit: when the fee posts before the first school day of the permit period, the billed share is one, the whole period; when it posts on or after that day on a Courtesy Rider Permit (Annual), the billed share is the whole calendar months from the month of posting through the last month of the permit period, that month included, divided by the months of the permit period; otherwise the billed share is the calendar-day share of the standard figure.
      A seat held for the family is billed from the offer: when the seat was offered in an earlier calendar month than the month the agreement is signed, and the agreement is signed more than held_days_whole calendar days after the stop assignment date (the day the seat was offered), one month is added; when the seat was offered in an earlier calendar month and the agreement is signed held_days_half to held_days_whole calendar days after the offer, half a month is added; otherwise nothing is added.
      The application charge follows the day the application was received: an application received after the permit period's first school day carries late_charge_after_start; an application for a school_year or fall_semester permit received after application_deadline_day, the first-day application deadline, and on or before that first school day carries late_charge; any other application carries none.
      The rider's grade is the grade_level on the student's latest-registered district enrollment record for the school year (latest by registration_date); a student with no such record has no grade. The school-level table reads the rider's grade: a rider in grade KG through 05 pays annual_rate_elementary for a school_year permit or semester_rate_elementary for a semester permit; a rider in grade 09 through 12 pays annual_rate_high_school or semester_rate_high_school; any other rider, or a rider with no grade, pays permit_fee.
      The distance table reads the measured distance on the assignment against the walk zone of the rider's school level (walk_zone_miles_elementary for a rider in grade KG through 05, walk_zone_miles_secondary for any other grade or no grade): a rider whose measured distance is less than that walk zone has walk_zone_add_annual added for a school_year permit or walk_zone_add_semester for a semester permit; a rider whose measured distance is outer_band_miles or more and not less than that walk zone has outer_band_less_annual or outer_band_less_semester added; any other rider, including a rider with no measured distance, has nothing added.
      A rider who rides one way is billed a share of the seat: the rider's Creek Kids Club enrollment read is the one for the school year in status active (a withdrawn, dismissed or ended enrollment of the same year is not read; the care charter allows only one open enrollment per student and school year); when that active enrollment is at the campus the rider is transported to and on Creek Kids Club After-School Care (5 Days) or Creek Kids Club Before-School Care (5 Days), the riding share is one_way_share; when it is at that campus and on Creek Kids Club After-School Care (2 Days) or Creek Kids Club After-School Care (3 Days), the riding share is partial_week_share; otherwise the riding share is one.
    prerequisite: []
    cross_category:
      - category: enroll
        as: branch
        reads: [grade_level, registration_date]
        note: The school-level rate and the walk zone of the distance table are decided from the rider's district enrollment record for the school year.
      - category: care
        as: branch
        reads: [variant_name, status, campus]
        note: The riding share is decided from the rider's active Creek Kids Club enrollment plan and campus.
    inputs:
      history:
        - {table: transport_ledger, aggregate: count, field: transport_ledger_id, filters: {event_type: transport_permit_fee}}
      cross_category: [enroll, care]
    compute:
      - permit_months: "K('months_school_year') if F('variant_name') == 'Courtesy Rider Permit (Annual)' else K('months_semester')"
      - permit_first_day: "K('first_school_day_spring') if (F('variant_name') == 'Courtesy Rider Permit (Semester)' and NOW > K('last_day_fall_semester')) else K('first_school_day_fall')"
      - permit_last_day: "K('last_day_fall_semester') if (F('variant_name') == 'Courtesy Rider Permit (Semester)' and NOW <= K('last_day_fall_semester')) else K('last_day_school_year')"
      - is_annual: "F('variant_name') == 'Courtesy Rider Permit (Annual)'"
      - day_share: "MX(0, DAYS(NOW, permit_last_day)) / MX(1, DAYS(permit_first_day, permit_last_day))"
      - billed_share: "1 if NOW < permit_first_day else (((MONTHS(NOW, K('day_marker_31')) - MONTHS(permit_last_day, K('day_marker_31')) + 1) / permit_months) if is_annual else day_share)"
      - held_months: "0 if (F('stop_assignment_date') == None or F('stop_assignment_date') == '') else (1 if (MONTHS(F('stop_assignment_date'), K('day_marker_31')) > MONTHS(NOW, K('day_marker_31')) and DAYS(F('stop_assignment_date'), NOW) > K('held_days_whole')) else (0.5 if (MONTHS(F('stop_assignment_date'), K('day_marker_31')) > MONTHS(NOW, K('day_marker_31')) and DAYS(F('stop_assignment_date'), NOW) >= K('held_days_half')) else 0))"
      - application_charge: "0 if (F('application_date') == None or F('application_date') == '') else (K('late_charge_after_start') if DAYS(permit_first_day, F('application_date')) > 0 else (K('late_charge') if (permit_first_day == K('first_school_day_fall') and DAYS(K('application_deadline_day'), F('application_date')) > 0) else 0))"
      - level_rate: "(K('annual_rate_elementary') if is_annual else K('semester_rate_elementary')) if (XLATEST('enroll', 'enrollments', 'grade_level', date_field='registration_date', student_id=F('student_id'), school_year=F('school_year')) != None and (XLATEST('enroll', 'enrollments', 'grade_level', date_field='registration_date', student_id=F('student_id'), school_year=F('school_year')) == 'KG' or XLATEST('enroll', 'enrollments', 'grade_level', date_field='registration_date', student_id=F('student_id'), school_year=F('school_year')) <= '05')) else ((K('annual_rate_high_school') if is_annual else K('semester_rate_high_school')) if (XLATEST('enroll', 'enrollments', 'grade_level', date_field='registration_date', student_id=F('student_id'), school_year=F('school_year')) != None and XLATEST('enroll', 'enrollments', 'grade_level', date_field='registration_date', student_id=F('student_id'), school_year=F('school_year')) >= '09' and XLATEST('enroll', 'enrollments', 'grade_level', date_field='registration_date', student_id=F('student_id'), school_year=F('school_year')) <= '12') else P('permit_fee'))"
      - rider_walk_zone: "K('walk_zone_miles_elementary') if (XLATEST('enroll', 'enrollments', 'grade_level', date_field='registration_date', student_id=F('student_id'), school_year=F('school_year')) != None and (XLATEST('enroll', 'enrollments', 'grade_level', date_field='registration_date', student_id=F('student_id'), school_year=F('school_year')) == 'KG' or XLATEST('enroll', 'enrollments', 'grade_level', date_field='registration_date', student_id=F('student_id'), school_year=F('school_year')) <= '05')) else K('walk_zone_miles_secondary')"
      - distance_amount: "0 if F('measured_distance_miles') == None else ((K('walk_zone_add_annual') if is_annual else K('walk_zone_add_semester')) if F('measured_distance_miles') < rider_walk_zone else ((K('outer_band_less_annual') if is_annual else K('outer_band_less_semester')) if (F('measured_distance_miles') >= K('outer_band_miles') and F('measured_distance_miles') >= rider_walk_zone) else 0))"
      - care_plan: "CFIELD('care', 'variant_name', student_id=F('student_id'), school_year=F('school_year'), status='active')"
      - care_here: "CFIELD('care', 'campus', student_id=F('student_id'), school_year=F('school_year'), status='active') == F('campus')"
      - riding_share: "K('one_way_share') if (care_here and (care_plan == 'Creek Kids Club After-School Care (5 Days)' or care_plan == 'Creek Kids Club Before-School Care (5 Days)')) else (K('partial_week_share') if (care_here and (care_plan == 'Creek Kids Club After-School Care (2 Days)' or care_plan == 'Creek Kids Club After-School Care (3 Days)')) else 1)"
      - period_rate: "level_rate + distance_amount"
      - seat_share: "billed_share + held_months / permit_months"
      - result: "RND(MX(0, period_rate) * seat_share * riding_share + application_charge + 0.000000001, 2)"
    compute_basis:
      permit_months: "it has months_school_year months for a school_year permit and months_semester months for a semester permit"
      permit_first_day: "the permit period's first school day is first_school_day_fall for a school_year or fall_semester permit and first_school_day_spring for a spring_semester permit"
      permit_last_day: "its last day is May 31 for a school_year or spring_semester permit and December 31 for a fall_semester permit"
      is_annual: "school_year (August - May) for Courtesy Rider Permit (Annual)"
      day_share: "the billed share is the calendar days from the posting day to the last day of the permit period divided by the calendar days from the period's first school day to its last day"
      billed_share: "when the fee posts before the first school day of the permit period, the billed share is one, the whole period; when it posts on or after that day on a Courtesy Rider Permit (Annual), the billed share is the whole calendar months from the month of posting through the last month of the permit period, that month included, divided by the months of the permit period; otherwise the billed share is the calendar-day share of the standard figure."
      held_months: "when the seat was offered in an earlier calendar month than the month the agreement is signed, and the agreement is signed more than held_days_whole calendar days after the stop assignment date (the day the seat was offered), one month is added; when the seat was offered in an earlier calendar month and the agreement is signed held_days_half to held_days_whole calendar days after the offer, half a month is added; otherwise nothing is added."
      application_charge: "an application received after the permit period's first school day carries late_charge_after_start; an application for a school_year or fall_semester permit received after application_deadline_day, the first-day application deadline, and on or before that first school day carries late_charge; any other application carries none."
      level_rate: "The school-level table reads the rider's grade: a rider in grade KG through 05 pays annual_rate_elementary for a school_year permit or semester_rate_elementary for a semester permit; a rider in grade 09 through 12 pays annual_rate_high_school or semester_rate_high_school; any other rider, or a rider with no grade, pays permit_fee."
      rider_walk_zone: "against the walk zone of the rider's school level (walk_zone_miles_elementary for a rider in grade KG through 05, walk_zone_miles_secondary for any other grade or no grade)"
      distance_amount: "a rider whose measured distance is less than that walk zone has walk_zone_add_annual added for a school_year permit or walk_zone_add_semester for a semester permit; a rider whose measured distance is outer_band_miles or more and not less than that walk zone has outer_band_less_annual or outer_band_less_semester added; any other rider, including a rider with no measured distance, has nothing added."
      care_plan: "the rider's Creek Kids Club enrollment read is the one for the school year in status active (a withdrawn, dismissed or ended enrollment of the same year is not read; the care charter allows only one open enrollment per student and school year)"
      care_here: "when that active enrollment is at the campus the rider is transported to"
      riding_share: "when that active enrollment is at the campus the rider is transported to and on Creek Kids Club After-School Care (5 Days) or Creek Kids Club Before-School Care (5 Days), the riding share is one_way_share; when it is at that campus and on Creek Kids Club After-School Care (2 Days) or Creek Kids Club After-School Care (3 Days), the riding share is partial_week_share; otherwise the riding share is one."
      period_rate: "A period rate set below replaces the standard one, every amount set below for the period rate is added to it"
      seat_share: "every month added below is added to the billed share at one month's share of the permit period (one divided by its months)"
      result: "The courtesy permit fee is the period rate times the billed share of the permit period, times the riding share, plus the application charge, rounded half-up to the cent once on the result"
    factors:
      - id: billed_share_method
        effect: method
        decides: billed_share
        bindings: [billed_share]
        ladder:
          - when: "the fee posts before the first school day of the permit period"
            method: "bill the whole period (share one)"
          - when: "the fee posts on or after that day AND the permit is a Courtesy Rider Permit (Annual)"
            method: "bill the whole calendar months from the month of posting through the period's last month, that month included, over the months of the period"
          - when: "otherwise"
            method: "bill the calendar days from the posting day to the period's last day over the days from its first school day to its last day"
        baseline:
          billed_share: "day_share"
        evidence: [date]
        cross_difficulty: null
      - id: held_seat_months
        effect: parameter
        decides: held_months
        bindings: [held_months]
        ladder:
          - when: "the seat was offered in an earlier calendar month than the signing AND the agreement is signed more than held_days_whole calendar days after the stop assignment date"
            value: "1"
          - when: "the seat was offered in an earlier calendar month AND the agreement is signed held_days_half to held_days_whole calendar days after it"
            value: "0.5"
          - when: "otherwise"
            value: "0"
        baseline:
          held_months: "0"
        evidence: [date]
        cross_difficulty: null
      - id: application_timing_charge
        effect: parameter
        decides: application_charge
        bindings: [application_charge]
        ladder:
          - when: "the application was received after the permit period's first school day"
            value: "K('late_charge_after_start')"
          - when: "a school_year or fall_semester application received after application_deadline_day and on or before that first school day"
            value: "K('late_charge')"
          - when: "otherwise"
            value: "0"
        baseline:
          application_charge: "0"
        evidence: [date]
        cross_difficulty: null
      - id: school_level_rate
        effect: parameter
        decides: level_rate
        bindings: [level_rate]
        ladder:
          - when: "the rider's grade (latest-registered district enrollment record for the school year) is KG through 05"
            value: "K('annual_rate_elementary') for a school_year permit, K('semester_rate_elementary') for a semester permit"
          - when: "the rider's grade is 09 through 12"
            value: "K('annual_rate_high_school') for a school_year permit, K('semester_rate_high_school') for a semester permit"
          - when: "otherwise"
            value: "P('permit_fee')"
        baseline:
          level_rate: "P('permit_fee')"
        evidence: [cross_category]
        cross_difficulty: enroll
      - id: walk_zone_distance
        effect: parameter
        decides: distance_amount
        bindings: [rider_walk_zone, distance_amount]
        ladder:
          - when: "the measured distance is less than the walk zone of the rider's school level (by the rider's grade)"
            value: "K('walk_zone_add_annual') for a school_year permit, K('walk_zone_add_semester') for a semester permit"
          - when: "the measured distance is outer_band_miles or more AND not less than the walk zone of the rider's school level"
            value: "K('outer_band_less_annual') for a school_year permit, K('outer_band_less_semester') for a semester permit"
          - when: "otherwise"
            value: "0"
        baseline:
          distance_amount: "0"
        evidence: [cross_category]
        cross_difficulty: enroll
      - id: one_way_riding_share
        effect: parameter
        decides: riding_share
        bindings: [care_plan, care_here, riding_share]
        ladder:
          - when: "the rider's active Creek Kids Club enrollment for the school year is at the campus the rider is transported to AND on After-School Care (5 Days) or Before-School Care (5 Days)"
            value: "K('one_way_share')"
          - when: "that active enrollment is at that campus AND on After-School Care (2 Days) or After-School Care (3 Days)"
            value: "K('partial_week_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          riding_share: "1"
        evidence: [cross_category]
        cross_difficulty: care
    baseline:
      rule: >-
        The courtesy permit fee is the period rate times the billed share of the permit period, times the riding share, plus the application charge, rounded half-up to the cent once on the result; the permit period's first school day is first_school_day_fall for a school_year or fall_semester permit and first_school_day_spring for a spring_semester permit, its last day is May 31 for a school_year or spring_semester permit and December 31 for a fall_semester permit, and it has months_school_year months for a school_year permit and months_semester months for a semester permit; the posting day is the application date, or the signing day for a seat offered from the waiting list.
        In the standard figure the period rate is permit_fee, the billed share is the calendar days from the posting day to the last day of the permit period divided by the calendar days from the period's first school day to its last day, the riding share is one, and there is no application charge.
      params: [permit_fee, months_school_year, months_semester, last_day_school_year, last_day_fall_semester, last_day_spring_semester, first_school_day_fall, first_school_day_spring]
  - id: transport_ext_seat_fee_meal_waiver
    base_policy_refs: [transport_evt_permit_fee, transport_agg_household_permit_cap, transport_bus_pass, transport_cancellation_and_refunds]
    overwrite:
      - base_policy: transport_evt_permit_fee
        superseded_clause: >-
          The fee is waived by credit from the student's School Nutrition meal status on the posting date: a student holding any Free Meal Status tier is credited free_meal_fee_waiver_pct of the fee with credit_reason free_meal_waiver, and a student holding any Reduced-Price Meal Status tier is credited reduced_meal_fee_waiver_pct with credit_reason reduced_meal_waiver; the waiver credit is rounded to the nearest cent, half a cent rounding up.
        replaced_by: >-
          For a permit fee posted later than its assignment's application date, which is the fee of a seat accepted from the waiting list, and only for such a fee, the meal-status waiver credit is the seat waiver of this rule; every other permit fee keeps the rule that the fee, less the application charge it carries, is waived by credit from the student's School Nutrition meal status on the posting date: a student holding any Free Meal Status tier is credited free_meal_fee_waiver_pct of the fee with credit_reason free_meal_waiver, and a student holding any Reduced-Price Meal Status tier is credited reduced_meal_fee_waiver_pct with credit_reason reduced_meal_waiver; the waiver credit is rounded to the nearest cent, half a cent rounding up.
    trigger: state_due
    subject: [transport_fee_credit]
    computes: waiver_amount
    target_tool: post_waiver_credit_eb03a46e
    params:
      last_day_school_year: "2027-05-31"
      last_day_fall_semester: "2026-12-31"
      day_marker_10: "2027-12-10"
      day_marker_20: "2027-12-20"
      day_marker_31: "2027-12-31"
      month_part_whole: 1
      month_part_half: 0.5
      first_school_day_fall: "2026-08-12"
      first_school_day_spring: "2027-01-06"
      application_deadline_day: "2026-07-15"
      late_charge: 15.00
      late_charge_after_start: 25.00
      held_days_whole: 10
      held_days_half: 6
    rule: >-
      This is the Calloway Creek ISD seat waiver under Board Policy FP(LOCAL) (TEC 11.158(b) fee waivers): the meal-status waiver credit on the permit fee of a seat accepted from the waiting list, posted by the transportation office against that permit fee on the day it is figured, with credit_reason free_meal_waiver for a student holding any Free Meal Status tier and credit_reason reduced_meal_waiver for a student holding any Reduced-Price Meal Status tier.
      For a permit fee posted later than its assignment's application date, which is the fee of a seat accepted from the waiting list, and only for such a fee, the meal-status waiver credit is the seat waiver of this rule; every other permit fee keeps the rule that the fee, less the application charge it carries, is waived by credit from the student's School Nutrition meal status on the posting date: a student holding any Free Meal Status tier is credited free_meal_fee_waiver_pct of the fee with credit_reason free_meal_waiver, and a student holding any Reduced-Price Meal Status tier is credited reduced_meal_fee_waiver_pct with credit_reason reduced_meal_waiver; the waiver credit is rounded to the nearest cent, half a cent rounding up.
      The seat waiver is not figured until the permit fee for the accepted seat stands on the assignment's billing record.
      The seat waiver is the seat's permit fee as posted less the application charge and the held-seat charge it carries, times the status share, times the covered months, divided by one hundred and by the seat months, never more than the fee net of every credit already against it, rounded half-up to the cent once on the result; the seat months are the whole calendar months from the month the fee posted through the last month of the permit period, that month included, and the last month is December for a fall_semester fee and May otherwise.
      A seat waiver that figures to zero is owed as nothing and posts no credit entry.
      This rule figures no seat waiver for a permit fee that is not the fee of a seat accepted from the waiting list: such a fee keeps the posting-date waiver restated above, credited on its posting date, and nothing is owed for it under this rule.
      In the standard figure the status share is reduced_meal_fee_waiver_pct, the covered months are all the seat months, and no application charge and no held-seat charge is taken out of the fee.
      Every month added below is added to the covered months, the covered months are never below zero and never exceed the seat months, a share or a count of covered months set below replaces the standard one, and an application charge or a held-seat charge set below is taken out of the fee before the share is applied.
      The status share is read from the meal status on file in the student's School Nutrition meal account on the day the seat waiver is figured, by this record test: a status on file that took effect on or before the fee's posting date and is any Free Meal Status tier counts at free_meal_fee_waiver_pct; a status on file that is Paid Meal Status, or that took effect after the fee's posting date, or a student with no meal account counts at zero; a status on file that took effect on or before the posting date and is any Reduced-Price Meal Status tier counts at reduced_meal_fee_waiver_pct.
      The covered months follow the source the status rests on: for a status carried over from the prior school year, the covered months are the whole calendar months from the month the fee posted up to, but not including, the month of carryover_last_operating_day, plus that month counted as month_part_whole month when carryover_last_operating_day falls after the 20th day of its month, as month_part_half month when it falls on the 11th through the 20th day, and as nothing when it falls on or before the 10th day; for a status with a reduction pending, meaning the meal account's latest benefit notice (latest by notice date; an adverse_action notice that shares the latest notice date with another notice is the latest) is an adverse_action notice dated after the day the status on file took effect, the covered months are the whole calendar months from the month the fee posted through the month of that adverse_action notice, never below zero, because a reduction after verification takes effect only after the adverse action notice period of 7 CFR 245.6a; for any other status the covered months are all the seat months.
      Meal-status fee waivers never reach a late application charge, which is not a fee for service: the application charge the fee carries follows the day the application was received on the assignment, an application received after the permit period's first school day (first_school_day_fall for a school_year or fall_semester fee, first_school_day_spring for a spring_semester fee) carrying late_charge_after_start, an application for a school_year or fall_semester fee received after application_deadline_day and on or before that first school day carrying late_charge, and any other application carrying none. Meal-status fee waivers never reach a held-seat charge either, the months billed for a seat offered from the waiting list and held before the family accepted it: the fee carries one held month when the seat was offered (the assignment's stop_assignment_date) in an earlier calendar month than the month the fee posted and the fee posted more than held_days_whole calendar days after the offer, half a held month when the seat was offered in an earlier calendar month and the fee posted held_days_half to held_days_whole calendar days after the offer, and no held month otherwise or when no stop is assigned; the held-seat charge is the fee less its application charge, times the held months divided by the seat months plus the held months.
     
    prerequisite:
      - problem: transport_ext_offered_seat_permit_fee
        kind: value_input
        gate: seat_fee_posted
        form: state
        policy_source: >-
          The seat waiver is not figured until the permit fee for the accepted seat stands on the assignment's billing record.
        condition: >-
          The assignment's billing record carries a transport_permit_fee entry posted later than the assignment's application date (the fee of the accepted seat).
        resolved_by: sign_seat_agreement_96917571
        effect: >-
          The posted seat fee is the amount the seat waiver acts on (binding seat_fee_posted) and its posting month starts the seat months.
    cross_category:
      - category: meals
        as: branch
        reads: [variant_name, benefit_effective_date, carryover_last_operating_day, meal_notices.notice_type, meal_notices.notice_date]
        note: The status share, the covered-months method and the carryover end-month part are decided from the student's meal account, its tier and its benefit notices.
    inputs:
      history:
        - {table: transport_ledger, aggregate: sum, field: amount, filters: {event_type: transport_permit_fee}}
        - {category: meals, table: meal_notices, aggregate: latest, field: notice_type, filters: {event_type: meals_benefit_notice}}
      cross_category: [meals]
    compute:
      - seat_fee_posted: "SUM('transport_ledger', 'amount', event_type='transport_permit_fee')"
      - fee_entry: "LATEST('transport_ledger', 'transport_ledger_id', date_field='posted_date', event_type='transport_permit_fee')"
      - credits_against_fee: "SUM('transport_ledger', 'amount', event_type='transport_fee_credit', source_transport_ledger_id=fee_entry) if fee_entry != None else 0"
      - fee_posted_day: "LATEST('transport_ledger', 'posted_date', date_field='posted_date', event_type='transport_permit_fee')"
      - fee_day: "fee_posted_day if fee_posted_day != None else NOW"
      - seat_fee_scope: "F('application_date') != None and F('application_date') != '' and fee_day != None and DAYS(F('application_date'), fee_day) > 0"
      - fee_last_day: "K('last_day_fall_semester') if LATEST('transport_ledger', 'fee_period_label', date_field='posted_date', event_type='transport_permit_fee') == 'fall_semester' else K('last_day_school_year')"
      - seat_months: "MONTHS(fee_day, K('day_marker_31')) - MONTHS(fee_last_day, K('day_marker_31')) + 1"
      - status_share: "P('free_meal_fee_waiver_pct') if (CPARAM('meals', 'benefit_level', student_id=F('student_id')) == 'free' and CFIELD('meals', 'benefit_effective_date', student_id=F('student_id')) != None and DAYS(CFIELD('meals', 'benefit_effective_date', student_id=F('student_id')), fee_day) >= 0) else (0 if (CPARAM('meals', 'benefit_level', student_id=F('student_id')) == 'paid' or CPARAM('meals', 'benefit_level', student_id=F('student_id')) == None or CFIELD('meals', 'benefit_effective_date', student_id=F('student_id')) == None or DAYS(CFIELD('meals', 'benefit_effective_date', student_id=F('student_id')), fee_day) < 0) else P('reduced_meal_fee_waiver_pct'))"
      - latest_notice_type: "'adverse_action' if (XLATEST('meals', 'meal_notices', 'notice_date', date_field='notice_date', event_type='meals_benefit_notice', notice_type='adverse_action', meal_account_id=CFIELD('meals', 'meal_account_id', student_id=F('student_id'))) != None and XLATEST('meals', 'meal_notices', 'notice_date', date_field='notice_date', event_type='meals_benefit_notice', notice_type='adverse_action', meal_account_id=CFIELD('meals', 'meal_account_id', student_id=F('student_id'))) >= XLATEST('meals', 'meal_notices', 'notice_date', date_field='notice_date', event_type='meals_benefit_notice', meal_account_id=CFIELD('meals', 'meal_account_id', student_id=F('student_id')))) else XLATEST('meals', 'meal_notices', 'notice_type', date_field='notice_date', event_type='meals_benefit_notice', meal_account_id=CFIELD('meals', 'meal_account_id', student_id=F('student_id')))"
      - latest_notice_day: "XLATEST('meals', 'meal_notices', 'notice_date', date_field='notice_date', event_type='meals_benefit_notice', meal_account_id=CFIELD('meals', 'meal_account_id', student_id=F('student_id')))"
      - covered_months: "MX(0, MONTHS(fee_day, K('day_marker_31')) - MONTHS(CPARAM('meals', 'carryover_last_operating_day', student_id=F('student_id')), K('day_marker_31'))) + (K('month_part_whole') if MONTHS(CPARAM('meals', 'carryover_last_operating_day', student_id=F('student_id')), K('day_marker_20')) < MONTHS(CPARAM('meals', 'carryover_last_operating_day', student_id=F('student_id')), K('day_marker_31')) else (K('month_part_half') if MONTHS(CPARAM('meals', 'carryover_last_operating_day', student_id=F('student_id')), K('day_marker_10')) < MONTHS(CPARAM('meals', 'carryover_last_operating_day', student_id=F('student_id')), K('day_marker_31')) else 0)) if (seat_fee_scope and CPARAM('meals', 'eligibility_source', student_id=F('student_id')) == 'prior_year_status') else (MX(0, MONTHS(fee_day, K('day_marker_31')) - MONTHS(latest_notice_day, K('day_marker_31')) + 1) if (seat_fee_scope and latest_notice_type == 'adverse_action' and DAYS(CFIELD('meals', 'benefit_effective_date', student_id=F('student_id')), latest_notice_day) > 0) else seat_months)"
      - fee_first_school_day: "K('first_school_day_spring') if LATEST('transport_ledger', 'fee_period_label', date_field='posted_date', event_type='transport_permit_fee') == 'spring_semester' else K('first_school_day_fall')"
      - application_charge_excluded: "0 if (F('application_date') == None or F('application_date') == '') else (K('late_charge_after_start') if DAYS(fee_first_school_day, F('application_date')) > 0 else (K('late_charge') if (fee_first_school_day == K('first_school_day_fall') and DAYS(K('application_deadline_day'), F('application_date')) > 0) else 0))"
      - held_fraction: "0 if (fee_posted_day == None or F('stop_assignment_date') == None or F('stop_assignment_date') == '' or MONTHS(F('stop_assignment_date'), K('day_marker_31')) <= MONTHS(fee_day, K('day_marker_31')) or DAYS(F('stop_assignment_date'), fee_day) < K('held_days_half')) else ((K('month_part_whole') if DAYS(F('stop_assignment_date'), fee_day) > K('held_days_whole') else K('month_part_half')) / (MX(1, seat_months) + (K('month_part_whole') if DAYS(F('stop_assignment_date'), fee_day) > K('held_days_whole') else K('month_part_half'))))"
      - covered_total: "MN(seat_months, MX(0, covered_months))"
      - result: "RND(MN(MX(0, seat_fee_posted - credits_against_fee), MX(0, seat_fee_posted - application_charge_excluded) * (1 - held_fraction) * status_share * covered_total / 100 / MX(1, seat_months)) + 0.000000001, 2) if seat_fee_scope else 0"
    compute_basis:
      seat_fee_posted: "The seat waiver is the seat's permit fee as posted"
      fee_entry: "never more than the fee net of every credit already against it"
      credits_against_fee: "never more than the fee net of every credit already against it"
      fee_posted_day: "the seat months are the whole calendar months from the month the fee posted through the last month of the permit period, that month included"
      fee_day: "the seat months are the whole calendar months from the month the fee posted through the last month of the permit period, that month included"
      seat_fee_scope: "For a permit fee posted later than its assignment's application date, which is the fee of a seat accepted from the waiting list, and only for such a fee, the meal-status waiver credit is the seat waiver of this rule"
      fee_last_day: "the last month is December for a fall_semester fee and May otherwise."
      seat_months: "the seat months are the whole calendar months from the month the fee posted through the last month of the permit period, that month included"
      status_share: "a status on file that took effect on or before the fee's posting date and is any Free Meal Status tier counts at free_meal_fee_waiver_pct; a status on file that is Paid Meal Status, or that took effect after the fee's posting date, or a student with no meal account counts at zero; a status on file that took effect on or before the posting date and is any Reduced-Price Meal Status tier counts at reduced_meal_fee_waiver_pct."
      latest_notice_type: "the meal account's latest benefit notice (latest by notice date; an adverse_action notice that shares the latest notice date with another notice is the latest) is an adverse_action notice"
      latest_notice_day: "the covered months are the whole calendar months from the month the fee posted through the month of that adverse_action notice"
      covered_months: "for a status carried over from the prior school year, the covered months are the whole calendar months from the month the fee posted up to, but not including, the month of carryover_last_operating_day, plus that month counted as month_part_whole month when carryover_last_operating_day falls after the 20th day of its month, as month_part_half month when it falls on the 11th through the 20th day, and as nothing when it falls on or before the 10th day;"
      fee_first_school_day: "an application received after the permit period's first school day (first_school_day_fall for a school_year or fall_semester fee, first_school_day_spring for a spring_semester fee) carrying late_charge_after_start"
      application_charge_excluded: "the application charge the fee carries follows the day the application was received on the assignment, an application received after the permit period's first school day (first_school_day_fall for a school_year or fall_semester fee, first_school_day_spring for a spring_semester fee) carrying late_charge_after_start, an application for a school_year or fall_semester fee received after application_deadline_day and on or before that first school day carrying late_charge, and any other application carrying none."
      held_fraction: "the fee carries one held month when the seat was offered (the assignment's stop_assignment_date) in an earlier calendar month than the month the fee posted and the fee posted more than held_days_whole calendar days after the offer, half a held month when the seat was offered in an earlier calendar month and the fee posted held_days_half to held_days_whole calendar days after the offer, and no held month otherwise or when no stop is assigned; the held-seat charge is the fee less its application charge, times the held months divided by the seat months plus the held months."
      covered_total: "Every month added below is added to the covered months, the covered months are never below zero and never exceed the seat months"
      result: "The seat waiver is the seat's permit fee as posted less the application charge and the held-seat charge it carries, times the status share, times the covered months, divided by one hundred and by the seat months, never more than the fee net of every credit already against it, rounded half-up to the cent once on the result"
    factors:
      - id: seat_status_share
        effect: parameter
        decides: status_share
        bindings: [status_share]
        ladder:
          - when: "the status on file took effect on or before the fee's posting date AND is any Free Meal Status tier"
            value: "P('free_meal_fee_waiver_pct')"
          - when: "the status on file is Paid Meal Status, or took effect after the fee's posting date, or there is no meal account"
            value: "0"
          - when: "otherwise (a Reduced-Price Meal Status tier that took effect on or before the posting date)"
            value: "P('reduced_meal_fee_waiver_pct')"
        baseline:
          status_share: "P('reduced_meal_fee_waiver_pct')"
        evidence: [cross_category, date]
        cross_difficulty: meals
      - id: coverage_by_source
        effect: method
        decides: covered_months
        bindings: [latest_notice_type, latest_notice_day, covered_months]
        ladder:
          - when: "the fee is a seat fee AND the status is carried over from the prior school year"
            method: "cover the whole calendar months from the month the fee posted up to, but not including, the month of carryover_last_operating_day, plus that month by its last operating day (whole after the 20th, half on the 11th-20th, none on or before the 10th)"
          - when: "the fee is a seat fee AND the meal account's latest benefit notice is an adverse_action notice dated after the status on file took effect"
            method: "cover the whole calendar months from the month the fee posted through the month of that adverse_action notice, never below zero"
          - when: "otherwise"
            method: "cover all the seat months"
        baseline:
          covered_months: "seat_months"
        evidence: [cross_category, date]
        cross_difficulty: meals
      - id: unwaived_held_seat
        effect: parameter
        decides: held_fraction
        bindings: [held_fraction]
        ladder:
          - when: "the seat was offered in an earlier calendar month than the month the fee posted AND the fee posted more than held_days_whole calendar days after the offer"
            value: "K('month_part_whole') / (MX(1, seat_months) + K('month_part_whole'))"
          - when: "the seat was offered in an earlier calendar month AND the fee posted held_days_half to held_days_whole calendar days after the offer"
            value: "K('month_part_half') / (MX(1, seat_months) + K('month_part_half'))"
          - when: "otherwise, or no stop is assigned"
            value: "0"
        baseline:
          held_fraction: "0"
        evidence: [date]
        cross_difficulty: null
      - id: application_charge_excluded
        effect: parameter
        decides: application_charge_excluded
        bindings: [application_charge_excluded]
        ladder:
          - when: "the application was received after the permit period's first school day"
            value: "K('late_charge_after_start')"
          - when: "a school_year or fall_semester application received after application_deadline_day and on or before that first school day"
            value: "K('late_charge')"
          - when: "otherwise"
            value: "0"
        baseline:
          application_charge_excluded: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The seat waiver is the seat's permit fee as posted less the application charge and the held-seat charge it carries, times the status share, times the covered months, divided by one hundred and by the seat months, never more than the fee net of every credit already against it, rounded half-up to the cent once on the result; the seat months are the whole calendar months from the month the fee posted through the last month of the permit period, that month included, and the last month is December for a fall_semester fee and May otherwise.
        In the standard figure the status share is reduced_meal_fee_waiver_pct, the covered months are all the seat months, and no application charge and no held-seat charge is taken out of the fee.
      params: [last_day_school_year, last_day_fall_semester, reduced_meal_fee_waiver_pct]
