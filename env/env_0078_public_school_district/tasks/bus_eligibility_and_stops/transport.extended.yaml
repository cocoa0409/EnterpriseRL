      late_charge: 15.00
      late_charge_after_start: 25.00
      one_way_share: 0.60
      partial_week_share: 0.80
      annual_rate_elementary: 216.00
      annual_rate_high_school: 264.00
      semester_rate_elementary: 121.50
      semester_rate_high_school: 148.50
