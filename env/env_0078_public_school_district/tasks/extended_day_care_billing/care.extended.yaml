    meaning: "A family registers one student for one Creek Kids Club plan at one campus for one school year."
    grain: "One row per student per plan registration for a school year."
    fields:
      customer_id: "Household that registers the student."
      student_id: "Student being registered."
      variant_name: "Official name of the plan chosen."
      campus: "Campus where care will be provided; the campus the student attends."
      school_year: "School year of the registration, YYYY-YY."
      registration_date: "Date the registration was received."
      start_date: "Requested first day of care."
      subsidy_payer: "Third-party funder named on the registration (workforce_solutions_ccs) or none."
    triggers:
      - event: care:care_registration_fee
        map: {school_year: school_year, posted_date: registration_date}
  - type: care_activate
    target: care_enrollments
    mutation: {transition: {from: registered, to: active}}
    meaning: "The program office confirms the seat after the registration fee is settled, and care begins on the start date."
    grain: "One row per transaction."
    fields:
      start_date: "First day of care, confirmed."
    triggers:
      - event: care:care_tuition_charge
        map: {}
  - type: care_waitlist
    target: care_enrollments
    mutation: {transition: {from: registered, to: waitlisted}}
    meaning: "A registration is placed on the campus waitlist because the plan is at capacity."
    grain: "One row per transaction."
    fields:
      waitlist_date: "Date the registration joined the waitlist."
    triggers: []
  - type: care_waitlist_placement
    target: care_enrollments
    mutation: {transition: {from: waitlisted, to: active}}
    meaning: "The family accepts an offered seat and the waitlisted student starts care."
    grain: "One row per transaction."
    fields:
      start_date: "First day of care after the accepted offer."
    triggers:
      - event: care:care_tuition_charge
        map: {}
  - type: care_waitlist_release
    target: care_enrollments
    mutation: {transition: {from: waitlisted, to: withdrawn}}
    meaning: "A waitlist entry is released after the family declines an offered seat or the response window lapses."
    grain: "One row per transaction."
    fields:
      end_date: "Date the waitlist entry was released."
    triggers: []
  - type: care_suspension
    target: care_enrollments
    mutation: {transition: {from: active, to: suspended_nonpayment}}
    meaning: "Care is suspended for an unpaid past-due tuition balance."
    grain: "One row per transaction."
    fields:
      suspended_date: "Date care was suspended."
    triggers: []
  - type: care_reinstatement
    target: care_enrollments
    mutation: {transition: {from: suspended_nonpayment, to: active}}
    meaning: "A suspended enrollment resumes after the past-due balance is paid."
    grain: "One row per transaction."
    fields:
      suspended_date: "Cleared to empty when care resumes."
    triggers: []
  - type: care_nonpayment_withdrawal
    target: care_enrollments
    mutation: {transition: {from: suspended_nonpayment, to: withdrawn}}
    meaning: "A suspended enrollment that is still unpaid is withdrawn by the program office."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of the enrollment."
    triggers: []
  - type: care_withdrawal
    target: care_enrollments
    mutation: {transition: {from: active, to: withdrawn}}
    meaning: "The family withdraws the student from Extended Day by written notice."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of care, which is the notice's requested last day or the end of the notice period, whichever is later."
    triggers: []
  - type: care_dismissal
    target: care_enrollments
    mutation: {transition: {from: active, to: dismissed}}
    meaning: "The program director dismisses the student after the semester's late-pickup dismissal threshold is reached."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of care."
    triggers: []
  - type: care_program_end
    target: care_enrollments
    mutation: {transition: {from: active, to: ended}}
    meaning: "Care ends because the school year closed or the student withdrew from the district."
    grain: "One row per transaction."
    fields:
      end_date: "Last day of care."
    triggers: []
  - type: care_plan_change
    target: care_enrollments
    mutation: update
    meaning: "An approved request moves the enrollment to another Creek Kids Club plan from the first day of a billing month."
    grain: "One row per approved plan change."
    fields:
      variant_name: "Official name of the new plan."
      plan_change_effective_date: "First day of the billing month from which the new plan applies, YYYY-MM-01."
    triggers:
      - event: care:care_plan_change_fee
        map: {}
  - type: care_registration_fee
    target: care_ledger
    meaning: "The annual registration fee is posted for the enrollment."
    grain: "One row per enrollment per school year."
    distinguish_by: [school_year]
    fields:
      amount: "Registration fee posted, positive USD."
      posted_date: "Date the fee posted, the registration date."
      school_year: "School year the fee covers."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_tuition_charge
    target: care_ledger
    meaning: "One billing month's tuition is posted for the enrollment."
    grain: "One row per enrollment per billing month."
    distinguish_by: [billing_month]
    fields:
      amount: "Tuition charged for the month after rate basis, sibling position and proration, positive USD."
      posted_date: "Date the tuition posted."
      billing_month: "Billing month, YYYY-MM."
      rate_basis: "Rate basis applied: standard_rate, reduced_meal_rate, free_meal_rate or employee_rate."
      sibling_position: "Position of this child in the household's billing order for the month: 1 full rate, 2 second child, 3 third or later child."
      proration: "full_month, or half_month for a first month that starts on or after the half-month start day."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_day_fee
    target: care_ledger
    meaning: "A booked drop-in day, holiday camp day or early-release afternoon outside the plan's coverage is charged."
    grain: "One row per enrollment per service date per day type."
    distinguish_by: [service_date, day_type]
    fields:
      amount: "Day fee charged, positive USD."
      posted_date: "Date the booking was posted."
      service_date: "Date care is provided."
      day_type: "drop_in_day, holiday_camp_day or early_release_day."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_late_pickup_fee
    target: care_ledger
    meaning: "The late pickup fee for one chargeable late pickup is posted."
    grain: "One row per chargeable late pickup (one per service date)."
    distinguish_by: [service_date]
    fields:
      amount: "Late pickup fee, positive USD."
      posted_date: "Date the fee posted."
      service_date: "Date of the late pickup."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_late_payment_fee
    target: care_ledger
    meaning: "The monthly late payment fee is posted because a billing month's tuition was not paid in full by the due day."
    grain: "One row per enrollment per billing month."
    distinguish_by: [billing_month]
    fields:
      amount: "Late payment fee, positive USD."
      posted_date: "Date the fee posted."
      billing_month: "Billing month whose tuition was late, YYYY-MM."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_plan_change_fee
    target: care_ledger
    meaning: "The processing fee for an approved plan change is posted."
    grain: "One row per approved plan change, keyed by the month the change takes effect."
    distinguish_by: [billing_month]
    fields:
      amount: "Plan change fee, positive USD."
      posted_date: "Date the fee posted."
      billing_month: "Billing month in which the plan change takes effect, YYYY-MM."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_payment
    target: care_ledger
    meaning: "A family payment is applied to the enrollment."
    grain: "One row per payment confirmation."
    distinguish_by: [payment_reference]
    fields:
      amount: "Payment amount, positive USD."
      posted_date: "Date the payment posted."
      payment_method: "online_card, ach_bank_draft, personal_check or money_order."
      payment_reference: "Payment confirmation number exactly as issued by the payment portal or written on the receipt."
    account: care_balance_due
    direction: out
    triggers: []
  - type: care_subsidy_remittance
    target: care_ledger
    meaning: "A Workforce Solutions Child Care Services remittance for one billing month is applied to a CCS-funded enrollment."
    grain: "One row per enrollment per billing month remitted."
    distinguish_by: [billing_month]
    fields:
      amount: "Board remittance, positive USD."
      posted_date: "Date the remittance posted."
      billing_month: "Billing month the remittance covers, YYYY-MM."
      subsidy_payer: "workforce_solutions_ccs."
    account: care_balance_due
    direction: out
    triggers: []
  - type: care_credit
    target: care_ledger
    meaning: "A credit reduces one specific earlier charge on the enrollment (fee waiver, household cap, courtesy waiver, short-notice withdrawal adjustment or billing correction)."
    grain: "One row per credited source charge per credit reason."
    distinguish_by: [source_care_ledger_id, credit_reason]
    fields:
      amount: "Credit amount, positive USD, never more than the source charge."
      posted_date: "Date the credit posted."
      credit_reason: "registration_fee_meal_waiver, registration_fee_household_cap, late_fee_courtesy_waiver, notice_period_adjustment or billing_correction."
      source_care_ledger_id: "Reference of the charge being credited."
    account: care_balance_due
    direction: out
    triggers: []
  - type: care_returned_payment
    target: care_ledger
    meaning: "A family payment is returned unpaid by the bank and its amount is restored to the balance."
    grain: "One row per returned payment."
    distinguish_by: [source_care_ledger_id]
    fields:
      amount: "Returned payment amount, positive USD equal to the original payment."
      posted_date: "Date the return posted."
      source_care_ledger_id: "Reference of the original payment that was returned."
    account: care_balance_due
    direction: in
    triggers:
      - event: care:care_returned_payment_fee
        map: {source_care_ledger_id: source_care_ledger_id, posted_date: posted_date}
  - type: care_returned_payment_fee
    target: care_ledger
    meaning: "The returned payment fee is posted for one returned payment."
    grain: "One row per returned payment."
    distinguish_by: [source_care_ledger_id]
    fields:
      amount: "Returned payment fee, positive USD."
      posted_date: "Date the fee posted."
      source_care_ledger_id: "Reference of the original payment that was returned."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_refund
    target: care_ledger
    meaning: "A credit balance on a closed enrollment is refunded to the family by district check."
    grain: "One row per refund issued."
    distinguish_by: [posted_date]
    fields:
      amount: "Refund amount, positive USD, equal to the credit balance refunded."
      posted_date: "Date the refund was issued."
    account: care_balance_due
    direction: in
    triggers: []
  - type: care_late_pickup
    target: care_attendance_log
    meaning: "Staff record a pickup after the close time plus the grace period."
    grain: "One row per late pickup (one per service date)."
    distinguish_by: [service_date]
    fields:
      service_date: "Date of the late pickup."
      minutes_late: "Whole minutes between the close time and the sign-out time."
      fee_status: "chargeable, or waived_first_incident for the first late pickup of a semester under a plan that waives it."
      semester: "fall (August 1 - December 31) or spring (January 1 - June 30)."
    triggers:
      - event: care:care_late_pickup_fee
        when: {fee_status: chargeable}
        map: {service_date: service_date}
  - type: care_late_pickup_warning
    target: care_attendance_log
    meaning: "The program director issues the written late-pickup warning for the semester."
    grain: "One row per enrollment per semester."
    distinguish_by: [semester]
    fields:
      service_date: "Date the warning letter was issued."
      semester: "Semester the warning covers."
    triggers: []
  - type: care_funding_change
    target: care_enrollments
    mutation: update
    meaning: "The program office records that a Workforce Solutions Child Care Services authorization started or ended for the enrollment."
    grain: "One row per funding change."
    fields:
      subsidy_payer: "workforce_solutions_ccs when an authorization starts, none when it ends."
    triggers: []

measures:
  - id: care_msr_late_pickups_semester
    window: "The semester containing the service date: fall is August 1 - December 31, spring is January 1 - June 30."
    measure: "Count of care_late_pickup rows on the enrollment with that semester value, whatever their fee_status."
  - id: care_msr_drop_in_days_month
    window: "The calendar month containing the requested service date."
    measure: "Count of care_day_fee rows with day_type drop_in_day on the enrollment whose service_date falls in that month, not counting rows offset by a billing_correction credit."
  - id: care_msr_late_fee_waivers_year
    window: "The school year, July 1 - June 30, containing the request date."
    measure: "Count of care_credit rows with credit_reason late_fee_courtesy_waiver on the enrollment whose posted_date falls in that school year."
  - id: care_msr_plan_changes_semester
    window: "The semester (fall August 1 - December 31, spring January 1 - June 30) containing the month the requested change would take effect."
    measure: "Count of care_plan_change_fee rows on the enrollment whose billing_month falls in that semester."
  - id: care_msr_returned_payments_lookback
    window: "The certified_funds_lookback_months calendar months ending on the payment date, counted back to the same day of the month."
    measure: "Count of care_returned_payment rows across all of the household's Creek Kids Club enrollments whose posted_date falls in the window."
  - id: care_msr_household_registration_fees_year
    window: "The school year of the registration being charged."
    measure: "Sum of care_registration_fee amounts on the household's other Creek Kids Club enrollments of that school year registered earlier, less the care_credit amounts with credit_reason registration_fee_meal_waiver or registration_fee_household_cap posted against those fees."

policies:
  - id: care_agg_multi_holding
    subject: [care_registration]
    rule: >-
      A household may hold Creek Kids Club enrollments for any number of its students, and each enrollment covers one student.
      Registration is accepted only when the student has no other Creek Kids Club enrollment for the same school year in status registered, waitlisted, active or suspended_nonpayment.
      A student who needs a different plan keeps the existing enrollment and moves through a plan change; a second registration is never opened for the same student and school year.
      Enrollments closed as withdrawn, dismissed or ended do not count, so a withdrawn student may register again for the same school year, subject to every admission rule.
    eligibility:
      - id: one_open_enrollment_per_student
        applies_to: [care_registration]
        kind: dedup
        condition: "Registration is accepted only when the student has no other Creek Kids Club enrollment for the same school year in status registered, waitlisted, active or suspended_nonpayment."
        evidence_fields: [care_enrollments.student_id, care_enrollments.school_year, care_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.student_id, care_enrollments.school_year]
          action_bindings:
            care_enrollments.student_id: student_id
            care_enrollments.school_year: school_year
        dedup_contract:
          table: care_enrollments
          mode: separate_record
          object_bindings: {student_id: student_id, school_year: school_year}
          duplicate_filters: {status: [registered, waitlisted, active, suspended_nonpayment]}
          distinct_fields: []
    params:
      max_per_customer: null
      max_open_enrollments_per_student_per_school_year: 1

  - id: care_agg_sibling_billing
    subject: [care_tuition_charge]
    rule: >-
      Sibling discounts are computed across the household's portfolio each billing month.
      The children counted are the household's students whose Creek Kids Club enrollments receive a tuition charge for that billing month (status active or suspended_nonpayment on the posting date); an enrollment funded through Workforce Solutions Child Care Services is left out of the count when its plan's sibling_discount_with_subsidy is false.
      The counted children are ordered by the standard monthly_tuition of each child's plan, highest first, before any rate-basis discount; ties are broken by the earlier registration_date and then by the earlier start_date.
      The first child is sibling position 1 and pays the full rate, the second child is position 2 and receives second_child_sibling_discount_pct, and every later child is position 3 and receives third_plus_child_sibling_discount_pct.
      A household with one counted child has no sibling discount, and an enrollment that leaves the count changes the positions only from the next billing month posted.
    eligibility: []

  - id: care_tuition_rate
    subject: [care_tuition_charge]
    rule: >-
      Each billing month's tuition posts on tuition_posting_day for every enrollment in status active or suspended_nonpayment, and the first month's tuition (the billing month of the start_date) posts on the day the seat is confirmed.
      Tuition charges post only to an enrollment in status active or suspended_nonpayment.
      The starting point is the plan's monthly_tuition.
      The rate basis is decided once per billing month from the records on the posting date: free_meal_rate when the student's School Nutrition meal account holds any Free Meal Status tier (Prior-Year Carryover included), reduced_meal_rate when it holds any Reduced-Price Meal Status tier, employee_rate when the household profile is flagged as a district employee household, and standard_rate otherwise; when more than one applies, the rate basis with the largest discount is used, and rate-basis discounts never add together.
      The sibling discount of the child's sibling position (care_agg_sibling_billing) then applies to the rate-basis amount.
      A first month whose start_date falls on or after half_month_start_day is billed at half_month_rate_pct of the discounted amount (proration half_month); every other month is a full month, including a month in which care ends.
      The amount is rounded to the nearest cent, half a cent rounding up.
      A School Nutrition status change recorded during a month affects the next posting, never a tuition charge already posted; a plan change is billed at the new plan's monthly_tuition from the billing month of its plan_change_effective_date.
      An enrollment funded through Workforce Solutions Child Care Services is billed as care_subsidy_funding states.
    eligibility:
      - id: tuition_posts_to_open_seat
        applies_to: [care_tuition_charge]
        kind: state
        condition: "Tuition charges post only to an enrollment in status active or suspended_nonpayment."
        evidence_fields: [care_enrollments.status, care_enrollments.care_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.care_enrollment_id]
          action_bindings:
            care_enrollments.care_enrollment_id: care_enrollment_id
        state_contract:
          field: care_enrollments.status
          allowed: [active, suspended_nonpayment]
    params:
      per_tier:
        "Creek Kids Club After-School Care (2 Days)": {monthly_tuition: "=monthly_tuition"}
        "Creek Kids Club Before-School Care (5 Days)": {monthly_tuition: "=monthly_tuition"}
        "Creek Kids Club After-School Care (3 Days)": {monthly_tuition: "=monthly_tuition"}
        "Creek Kids Club After-School Care (5 Days)": {monthly_tuition: "=monthly_tuition"}
        "Creek Kids Club Before & After-School Care (5 Days)": {monthly_tuition: "=monthly_tuition"}
        "Creek Kids Club Pre-K Wraparound Care (5 Days)": {monthly_tuition: "=monthly_tuition"}
    formula:
      rate_discount_pct: "free_meal_rate_discount_pct if rate_basis == 'free_meal_rate' else (reduced_meal_rate_discount_pct if rate_basis == 'reduced_meal_rate' else (employee_rate_discount_pct if rate_basis == 'employee_rate' else 0))"
      sibling_pct: "second_child_sibling_discount_pct if sibling_position == 2 else (third_plus_child_sibling_discount_pct if sibling_position == 3 else 0)"
      proration_pct: "half_month_rate_pct if proration == 'half_month' else 100"
      amount: "round(monthly_tuition * (1 - rate_discount_pct / 100) * (1 - sibling_pct / 100) * proration_pct / 100, 2)"

  - id: care_subsidy_funding
    subject: [care_registration, care_subsidy_remittance, care_tuition_charge, care_funding_change]
    rule: >-
      An enrollment whose subsidy_payer is workforce_solutions_ccs is funded through Workforce Solutions Child Care Services; every plan whose subsidy_accepted is true takes such funding.
      A CCS-funded enrollment is billed on the subsidy_billing_basis: its tuition charge always uses rate_basis standard_rate, because meal-status and employee rates do not combine with CCS funding, and the sibling discount applies only when the plan's sibling_discount_with_subsidy is true.
      Each board remittance posts as one care_subsidy_remittance for the billing month it covers, and the household owes the rest of that month's charges, which is billed, made late and suspended like any other balance.
      When the program office records that the authorization has ended, subsidy_payer becomes none and the household's own rate basis and sibling position apply from the next billing month posted after the change; a remittance that arrives later for a month the authorization covered still posts to that month.
    eligibility: []

  - id: care_admission
    subject: [care_registration, care_activate, care_waitlist, care_waitlist_placement, care_waitlist_release]
    rule: >-
      Registration is open to a student whose current district enrollment record is in status enrolled at a campus in the plan's offered_campuses, and the Creek Kids Club enrollment's campus is that same campus.
      The student's current district enrollment record must show grade level PK3, PK4, KG, 01, 02, 03, 04 or 05.
      Within that range the chosen plan's eligible_grades decides which plans the student may hold.
      Registration is not accepted while any of the household's Creek Kids Club enrollments from an earlier school year still carries a balance above zero.
      A registration is waitlisted when the plan at the campus is at capacity on the registration date; capacity is managed by the program office, and waitlisted registrations are offered seats in registration_date order.
      The seat of a registration in status registered is confirmed only once the registration fee for that enrollment is settled, meaning the registration fee charge is fully offset by registration-fee credits and payments on the enrollment.
      A waitlisted family may accept an offered seat only within waitlist_offer_response_days after the program office offers the seat, counted in calendar days with the offer date as day 0, and a seat accepted on the last day of the window is still accepted.
      An offer not accepted in that window is released and the next registration on the list is offered; placement from the waitlist does not charge the registration fee again.
    eligibility:
      - id: district_enrollment_at_campus
        applies_to: [care_registration]
        kind: state
        condition: "Registration is open to a student whose current district enrollment record is in status enrolled at a campus in the plan's offered_campuses, and the Creek Kids Club enrollment's campus is that same campus."
        evidence_fields: [enrollments.status, enrollments.campus, enrollments.student_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.student_id]
          action_bindings:
            enrollments.student_id: student_id
        state_contract:
          field: enrollments.status
          allowed: [enrolled]
      - id: grade_in_program_range
        applies_to: [care_registration]
        kind: state
        condition: "The student's current district enrollment record must show grade level PK3, PK4, KG, 01, 02, 03, 04 or 05."
        evidence_fields: [enrollments.grade_level, enrollments.student_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.student_id]
          action_bindings:
            enrollments.student_id: student_id
        state_contract:
          field: enrollments.grade_level
          allowed: [PK3, PK4, KG, "01", "02", "03", "04", "05"]
      - id: no_prior_year_balance
        applies_to: [care_registration]
        kind: authorization
        condition: "Registration is not accepted while any of the household's Creek Kids Club enrollments from an earlier school year still carries a balance above zero."
        evidence_fields: [care_enrollments.customer_id, care_enrollments.school_year, care_ledger.care_enrollment_id, care_ledger.event_type, care_ledger.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.customer_id]
          action_bindings:
            care_enrollments.customer_id: customer_id
      - id: registration_fee_settled
        applies_to: [care_activate]
        kind: authorization
        condition: "The seat of a registration in status registered is confirmed only once the registration fee for that enrollment is settled, meaning the registration fee charge is fully offset by registration-fee credits and payments on the enrollment."
        evidence_fields: [care_ledger.care_enrollment_id, care_ledger.event_type, care_ledger.amount, care_ledger.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_ledger.care_enrollment_id]
          action_bindings:
            care_ledger.care_enrollment_id: care_enrollment_id
      - id: offer_response_window
        applies_to: [care_waitlist_placement]
        kind: time
        condition: "A waitlisted family may accept an offered seat only within waitlist_offer_response_days after the program office offers the seat, counted in calendar days with the offer date as day 0, and a seat accepted on the last day of the window is still accepted."
        evidence_fields: [care_enrollments.waitlist_offer_date, care_enrollments.care_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.care_enrollment_id]
          action_bindings:
            care_enrollments.care_enrollment_id: care_enrollment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the program office offers the seat"
          anchor_source: care_enrollments.waitlist_offer_date
          relation: not_after
          duration_source: variants.waitlist_offer_response_days
          unit: calendar_days
          counting_rule: "counted in calendar days with the offer date as day 0"
          boundary: inclusive
    params:
      per_tier:
        "Creek Kids Club After-School Care (2 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}
        "Creek Kids Club Before-School Care (5 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}
        "Creek Kids Club After-School Care (3 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}
        "Creek Kids Club After-School Care (5 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}
        "Creek Kids Club Before & After-School Care (5 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}
        "Creek Kids Club Pre-K Wraparound Care (5 Days)": {eligible_grades: "=eligible_grades", offered_campuses: "=offered_campuses"}

  - id: care_evt_registration_fee
    subject: [care_registration_fee, care_credit]
    rule: >-
      The registration fee posts at registration_fee_per_child on the registration date of every new registration, once per enrollment per school year.
      The fee is nonrefundable once posted: it is never credited because of a withdrawal, a waitlist release, a dismissal or the end of the program.
      Two credits may offset it on the day it posts, and no other credit reason applies to it.
      When the plan's registration_fee_waived_for_free_meal_status is true and the student's School Nutrition meal account holds any Free Meal Status tier on the registration date, the full fee is credited with credit_reason registration_fee_meal_waiver; a Reduced-Price Meal Status does not waive the fee.
      Otherwise, when the registration fees already charged to the household's other enrollments of the same school year, net of their registration-fee credits (care_msr_household_registration_fees_year), plus this fee exceed registration_fee_household_cap, the excess is credited with credit_reason registration_fee_household_cap.
      The household cap is computed from enrollments registered earlier; a later registration never changes a credit already posted on an earlier one.
    eligibility: []
    measures: [care_msr_household_registration_fees_year]
    formula:
      amount: "registration_fee_per_child"
      cap_credit: "max(0, care_msr_household_registration_fees_year + registration_fee_per_child - registration_fee_household_cap)"

  - id: care_evt_day_fees
    subject: [care_day_fee, care_credit]
    rule: >-
      Day fees are charged only on an enrollment in status active.
      A drop-in day may be booked only on a plan whose drop_in_days_allowed is true, for a weekday the plan's schedule does not already cover, at least drop_in_booking_lead_days calendar days before the service date, and for no more than drop_in_days_monthly_cap drop-in days per enrollment in one calendar month (care_msr_drop_in_days_month); each drop-in day is charged drop_in_day_fee.
      A holiday camp day may be booked only on a plan whose holiday_camp_access is true and is charged holiday_camp_day_fee.
      An early-release afternoon is covered without any fee when the plan's early_release_included is true; otherwise a booked early-release afternoon is charged early_release_day_fee.
      A booked day the family does not use is still charged; a day on which the district closes campuses is not charged, and a fee already posted for it is credited in full with credit_reason billing_correction.
      Day fees are not discounted by rate basis or sibling position.
    eligibility:
      - id: day_fee_on_active_enrollment
        applies_to: [care_day_fee]
        kind: state
        condition: "Day fees are charged only on an enrollment in status active."
        evidence_fields: [care_enrollments.status, care_enrollments.care_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.care_enrollment_id]
          action_bindings:
            care_enrollments.care_enrollment_id: care_enrollment_id
        state_contract:
          field: care_enrollments.status
          allowed: [active]
    measures: [care_msr_drop_in_days_month]
    params:
      per_tier:
        "Creek Kids Club After-School Care (2 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
        "Creek Kids Club Before-School Care (5 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
        "Creek Kids Club After-School Care (3 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
        "Creek Kids Club After-School Care (5 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
        "Creek Kids Club Before & After-School Care (5 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
        "Creek Kids Club Pre-K Wraparound Care (5 Days)": {drop_in_days_allowed: "=drop_in_days_allowed", holiday_camp_access: "=holiday_camp_access", early_release_included: "=early_release_included"}
    formula:
      amount: "drop_in_day_fee if day_type == 'drop_in_day' else (holiday_camp_day_fee if day_type == 'holiday_camp_day' else early_release_day_fee)"

  - id: care_evt_late_pickup
    subject: [care_late_pickup, care_late_pickup_fee, care_late_pickup_warning, care_dismissal]
    rule: >-
      A pickup is late when the student is signed out more than late_pickup_grace_minutes after the plan's after_care_end_time; minutes_late is counted from after_care_end_time itself, not from the end of the grace period.
      Each late pickup is recorded once per service date.
      The first late pickup of each semester is recorded with fee_status waived_first_incident when the plan's late_pickup_first_incident_waived is true; every other late pickup is chargeable and posts a late pickup fee of minutes_late times late_pickup_fee_per_minute.
      Semesters are fall (August 1 - December 31) and spring (January 1 - June 30), and the count of late pickups in a semester (care_msr_late_pickups_semester) includes waived incidents.
      When the count reaches late_pickup_warning_threshold, the program director issues one written warning for that semester; when it reaches late_pickup_dismissal_threshold, the student is dismissed after the fee for that pickup posts.
      Late pickup fees are not discounted by rate basis or sibling position and are not covered by Workforce Solutions remittances.
      A plan with no after-school session has no late pickups under this policy.
    eligibility: []
    measures: [care_msr_late_pickups_semester]
    formula:
      when: "minutes_late > late_pickup_grace_minutes"
      amount: "minutes_late * late_pickup_fee_per_minute"

  - id: care_billing_and_late_payment
    subject: [care_late_payment_fee, care_credit, care_suspension, care_reinstatement, care_nonpayment_withdrawal]
    rule: >-
      Tuition for each billing month is due by tuition_due_day of that month, and payments, remittances and credits are applied to the enrollment's oldest open charge first.
      When the amounts applied by the due day leave any part of that month's tuition unpaid, one late payment fee of late_payment_fee posts late_payment_fee_offset_days after the due day; a month whose tuition posted after its due day becomes late only at the next month's due day.
      At the family's request a late payment fee is credited back with credit_reason late_fee_courtesy_waiver.
      A late fee courtesy credit is granted only while fewer than late_fee_courtesy_waivers_per_year courtesy credits have been posted on the enrollment in the school year (care_msr_late_fee_waivers_year).
      When at least suspension_minimum_past_due of tuition remains unpaid more than suspension_days_past_due days after a month's due day, care is suspended; tuition continues to post while care is suspended, because the seat is held.
      A suspended enrollment resumes only after its entire past-due balance is paid.
      When the enrollment is still suspended nonpayment_withdrawal_days after its suspended_date, it is withdrawn and the balance remains owed.
    eligibility:
      - id: courtesy_waiver_remaining
        applies_to: [care_credit]
        kind: authorization
        condition: "A late fee courtesy credit is granted only while fewer than late_fee_courtesy_waivers_per_year courtesy credits have been posted on the enrollment in the school year (care_msr_late_fee_waivers_year)."
        evidence_fields: [care_ledger.care_enrollment_id, care_ledger.credit_reason, care_ledger.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_ledger.care_enrollment_id]
          action_bindings:
            care_ledger.care_enrollment_id: care_enrollment_id
      - id: past_due_cleared
        applies_to: [care_reinstatement]
        kind: authorization
        condition: "A suspended enrollment resumes only after its entire past-due balance is paid."
        evidence_fields: [care_ledger.care_enrollment_id, care_ledger.event_type, care_ledger.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_ledger.care_enrollment_id]
          action_bindings:
            care_ledger.care_enrollment_id: care_enrollment_id
    measures: [care_msr_late_fee_waivers_year]

  - id: care_withdrawal_and_refunds
    subject: [care_withdrawal, care_program_end, care_refund, care_credit]
    rule: >-
      A family ends care by written withdrawal notice, which the support desk records as a withdrawal_notice request; the withdrawal itself is the family's own action.
      The last day of care is the requested last day, but when the requested last day is earlier than withdrawal_notice_days calendar days after the notice was received, tuition is billed through the end of that notice period (billing_after_short_notice), the notice date counting as day 0.
      A billing month any day of which falls on or before the later of the requested last day and the end of the notice period is billed in full; a tuition charge already posted for a month that falls entirely after that later date is credited in full with credit_reason notice_period_adjustment.
      When the student withdraws from the district, care ends on the district withdrawal date and the notice period does not apply.
      A closed enrollment whose credits and payments exceed its charges is refunded by district check within credit_balance_refund_days calendar days after its end_date, and a refund is issued only on an enrollment in status withdrawn, dismissed or ended.
      The registration fee is never refunded, and an enrollment withdrawn with an unpaid balance keeps that balance owed.
    eligibility:
      - id: refund_after_close
        applies_to: [care_refund]
        kind: state
        condition: "a refund is issued only on an enrollment in status withdrawn, dismissed or ended."
        evidence_fields: [care_enrollments.status, care_enrollments.care_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.care_enrollment_id]
          action_bindings:
            care_enrollments.care_enrollment_id: care_enrollment_id
        state_contract:
          field: care_enrollments.status
          allowed: [withdrawn, dismissed, ended]

  - id: care_plan_changes
    subject: [care_plan_change, care_plan_change_fee]
    rule: >-
      Plan changes are made only on an enrollment in status active.
      A plan change request received on or before plan_change_request_cutoff_day of a month takes effect on the first day of the next month; a request received after that day takes effect on the first day of the month after next.
      The new plan must be offered at the enrollment's campus and admit the student's grade.
      At most plan_changes_per_semester plan changes take effect per enrollment per semester (care_msr_plan_changes_semester); a further request waits for the next semester.
      Each plan change posts one plan_change_fee for the billing month in which it takes effect; a month already posted under the old plan is not rebilled.
    eligibility:
      - id: plan_change_on_active
        applies_to: [care_plan_change, care_plan_change_fee]
        kind: state
        condition: "Plan changes are made only on an enrollment in status active."
        evidence_fields: [care_enrollments.status, care_enrollments.care_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_enrollments.care_enrollment_id]
          action_bindings:
            care_enrollments.care_enrollment_id: care_enrollment_id
        state_contract:
          field: care_enrollments.status
          allowed: [active]
    measures: [care_msr_plan_changes_semester]

  - id: care_payments_and_returns
    subject: [care_payment, care_returned_payment, care_returned_payment_fee]
    rule: >-
      Families pay by the methods in accepted_payment_methods; cash is not accepted.
      A payment posts to the enrollment the family names and is applied to that enrollment's oldest open charge first; a payment never moves between enrollments, siblings included.
      A payment returned unpaid by the bank restores its full amount to the balance and posts one returned_payment_fee for that payment, and a returned payment never counts as paid for late-fee or suspension purposes.
      When a household has had returned_payments_before_certified_funds or more returned payments across its Creek Kids Club enrollments within the last certified_funds_lookback_months calendar months (care_msr_returned_payments_lookback), further payments are accepted only by online_card or money_order.
    eligibility:
      - id: certified_funds_after_returns
        applies_to: [care_payment]
        kind: authorization
        condition: "When a household has had returned_payments_before_certified_funds or more returned payments across its Creek Kids Club enrollments within the last certified_funds_lookback_months calendar months (care_msr_returned_payments_lookback), further payments are accepted only by online_card or money_order."
        evidence_fields: [care_ledger.care_enrollment_id, care_ledger.customer_id, care_ledger.event_type, care_ledger.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_ledger.care_enrollment_id]
          action_bindings:
            care_ledger.care_enrollment_id: care_enrollment_id
    measures: [care_msr_returned_payments_lookback]

extended_policies:
  - id: care_ext_late_pickup_fee_schedule
    base_policy_refs: [care_evt_late_pickup]
    overwrite:
      - base_policy: care_evt_late_pickup
        superseded_clause: >-
          every other late pickup is chargeable and posts a late pickup fee of minutes_late times late_pickup_fee_per_minute.
        replaced_by: >-
          Every other late pickup is still chargeable and posts one late pickup fee; for a late pickup of the 2026-27 school year that fee is priced by the board-approved 2026-27 late pickup fee schedule below, and a late pickup of any other school year still posts a late pickup fee of minutes_late times late_pickup_fee_per_minute.
    trigger: state_due
    subject: [care_late_pickup_fee]
    computes: fee_amount
    target_tool: post_late_pickup_fee_6e670263
    params:
      schedule_year: "2026-27"
      pk_grades: ["PK3", "PK4"]
      kg_grade: "KG"
      pk_rate: 1.50
      kg_rate: 1.25
      warned_multiplier_pct: 200
      repeat_multiplier_pct: 150
      whole_rate_pct: 100
      quarter_hour_over_minutes: 30
      quarter_hour_minutes: 15
      minimum_block_minutes: 10
      after_hours_high_from_minutes: 40
      after_hours_mid_from_minutes: 20
      after_hours_charge_high: 25.00
      after_hours_charge_mid: 10.00
    rule: >-
      This policy prices the late pickup fee of the enrollment's most recently recorded chargeable late pickup; the fee of a late pickup is posted before the fee of any later late pickup, and an enrollment with no chargeable late pickup has no fee to price.
      Every other late pickup is still chargeable and posts one late pickup fee; for a late pickup of the 2026-27 school year that fee is priced by the board-approved 2026-27 late pickup fee schedule below, and a late pickup of any other school year still posts a late pickup fee of minutes_late times late_pickup_fee_per_minute.
      The standard late pickup fee is the pickup's minutes_late times late_pickup_fee_per_minute, minutes_late being counted from the plan's after_care_end_time itself, rounded to the nearest cent, half a cent rounding up.
      Each part of the schedule either sets a quantity that multiplies the minutes or sets a flat charge: the multiplying quantities act on the billed minutes together, the flat charges are then added, and the total is rounded once to the nearest cent, half a cent rounding up.
      The schedule's per-minute rate follows the grade on the student's district enrollment record for the enrollment's school year in status enrolled: pk_rate for grade PK3 or PK4, kg_rate for grade KG, and late_pickup_fee_per_minute for grades 01 through 05 and for a student with no such record.
      The schedule's repeat multiplier is warned_multiplier_pct percent when the written late-pickup warning for the pickup's semester was issued before the pickup's service date; it is repeat_multiplier_pct percent when no such warning was issued before the service date and the pickup is the second or later chargeable late pickup of that semester; it is the whole rate when neither holds.
      The schedule's billed minutes follow how late the pickup was: a pickup more than quarter_hour_over_minutes minutes late is billed in whole quarter hours of quarter_hour_minutes minutes, any part of a quarter hour counting as a whole one; a pickup no more than minimum_block_minutes minutes late is billed the minimum block of minimum_block_minutes minutes; any other pickup is billed by the minute as recorded.
      The schedule's after-hours charge is after_hours_charge_high for a pickup at least after_hours_high_from_minutes minutes late, after_hours_charge_mid for a pickup at least after_hours_mid_from_minutes and less than after_hours_high_from_minutes minutes late, and nothing for a pickup less than after_hours_mid_from_minutes minutes late.
    prerequisite: []
    cross_category:
      - category: enroll
        as: branch
        reads: [grade_level, status, school_year]
        note: The per-minute rate is read from the grade on the student's district enrollment record for the school year.
    compute:
      - pickup_date: "LATEST('care_attendance_log', 'service_date', date_field='service_date', event_type='care_late_pickup', fee_status='chargeable')"
      - pickup_minutes: "LATEST('care_attendance_log', 'minutes_late', date_field='service_date', event_type='care_late_pickup', fee_status='chargeable')"
      - pickup_semester: "LATEST('care_attendance_log', 'semester', date_field='service_date', event_type='care_late_pickup', fee_status='chargeable')"
      - district_grade: "CFIELD('enroll', 'grade_level', student_id=F('student_id'), school_year=F('school_year'), status='enrolled')"
      - grade_rate: "K('pk_rate') if district_grade in K('pk_grades') else (K('kg_rate') if (district_grade == K('kg_grade') and not district_grade in K('pk_grades')) else P('late_pickup_fee_per_minute'))"
      - warning_issued: "LATEST('care_attendance_log', 'service_date', date_field='service_date', event_type='care_late_pickup_warning', semester=pickup_semester)"
      - chargeable_in_semester: "COUNT('care_attendance_log', event_type='care_late_pickup', fee_status='chargeable', semester=pickup_semester)"
      - repeat_pct: "K('warned_multiplier_pct') if (warning_issued != None and warning_issued < pickup_date) else (K('repeat_multiplier_pct') if ((warning_issued == None or warning_issued >= pickup_date) and chargeable_in_semester >= 2) else K('whole_rate_pct'))"
      - minutes_for_billing: "LATEST('care_attendance_log', 'minutes_late', date_field='service_date', event_type='care_late_pickup', fee_status='chargeable')"
      - billed_minutes: "((minutes_for_billing + K('quarter_hour_minutes') - 1) // K('quarter_hour_minutes')) * K('quarter_hour_minutes') if minutes_for_billing > K('quarter_hour_over_minutes') else (MX(minutes_for_billing, K('minimum_block_minutes')) if minutes_for_billing <= K('minimum_block_minutes') else minutes_for_billing)"
      - minutes_for_after_hours: "LATEST('care_attendance_log', 'minutes_late', date_field='service_date', event_type='care_late_pickup', fee_status='chargeable')"
      - after_hours_amount: "K('after_hours_charge_high') if minutes_for_after_hours >= K('after_hours_high_from_minutes') else (K('after_hours_charge_mid') if (minutes_for_after_hours >= K('after_hours_mid_from_minutes') and minutes_for_after_hours < K('after_hours_high_from_minutes')) else 0)"
      - standard_fee: "pickup_minutes * P('late_pickup_fee_per_minute')"
      - schedule_fee: "billed_minutes * grade_rate * repeat_pct / 100 + after_hours_amount"
      - result: "(RND(schedule_fee + 0.000000001, 2) if F('school_year') == K('schedule_year') else RND(standard_fee + 0.000000001, 2)) if pickup_date != None else 0"
    compute_basis:
      pickup_date: "This policy prices the late pickup fee of the enrollment's most recently recorded chargeable late pickup; the fee of a late pickup is posted before the fee of any later late pickup, and an enrollment with no chargeable late pickup has no fee to price."
      pickup_minutes: "The standard late pickup fee is the pickup's minutes_late times late_pickup_fee_per_minute"
      pickup_semester: "the written late-pickup warning for the pickup's semester"
      district_grade: "The schedule's per-minute rate follows the grade on the student's district enrollment record for the enrollment's school year in status enrolled"
      grade_rate: "The schedule's per-minute rate follows the grade on the student's district enrollment record for the enrollment's school year in status enrolled: pk_rate for grade PK3 or PK4, kg_rate for grade KG, and late_pickup_fee_per_minute for grades 01 through 05 and for a student with no such record."
      warning_issued: "when the written late-pickup warning for the pickup's semester was issued before the pickup's service date"
      chargeable_in_semester: "the pickup is the second or later chargeable late pickup of that semester"
      repeat_pct: "The schedule's repeat multiplier is warned_multiplier_pct percent when the written late-pickup warning for the pickup's semester was issued before the pickup's service date; it is repeat_multiplier_pct percent when no such warning was issued before the service date and the pickup is the second or later chargeable late pickup of that semester; it is the whole rate when neither holds."
      minutes_for_billing: "The schedule's billed minutes follow how late the pickup was"
      billed_minutes: "a pickup more than quarter_hour_over_minutes minutes late is billed in whole quarter hours of quarter_hour_minutes minutes, any part of a quarter hour counting as a whole one; a pickup no more than minimum_block_minutes minutes late is billed the minimum block of minimum_block_minutes minutes; any other pickup is billed by the minute as recorded."
      minutes_for_after_hours: "The schedule's after-hours charge is after_hours_charge_high for a pickup at least after_hours_high_from_minutes minutes late"
      after_hours_amount: "The schedule's after-hours charge is after_hours_charge_high for a pickup at least after_hours_high_from_minutes minutes late, after_hours_charge_mid for a pickup at least after_hours_mid_from_minutes and less than after_hours_high_from_minutes minutes late, and nothing for a pickup less than after_hours_mid_from_minutes minutes late."
      standard_fee: "The standard late pickup fee is the pickup's minutes_late times late_pickup_fee_per_minute, minutes_late being counted from the plan's after_care_end_time itself"
      schedule_fee: "Each part of the schedule either sets a quantity that multiplies the minutes or sets a flat charge: the multiplying quantities act on the billed minutes together, the flat charges are then added"
      result: "for a late pickup of the 2026-27 school year that fee is priced by the board-approved 2026-27 late pickup fee schedule below, and a late pickup of any other school year still posts a late pickup fee of minutes_late times late_pickup_fee_per_minute."
    factors:
      - id: grade_band_minute_rate
        effect: parameter
        decides: grade_rate
        bindings: [district_grade, grade_rate]
        ladder:
          - when: "the student's district enrollment record for the school year shows grade PK3 or PK4"
            value: "K('pk_rate')"
          - when: "it shows grade KG"
            value: "K('kg_rate')"
          - when: "it shows grade 01 through 05, or the student holds no such record"
            value: "P('late_pickup_fee_per_minute')"
        baseline:
          grade_rate: "P('late_pickup_fee_per_minute')"
        evidence: [cross_category]
        cross_difficulty: enroll
      - id: semester_repeat_multiplier
        effect: parameter
        decides: repeat_pct
        bindings: [warning_issued, chargeable_in_semester, repeat_pct]
        ladder:
          - when: "the written late-pickup warning for the pickup's semester was issued before the pickup's service date"
            value: "K('warned_multiplier_pct')"
          - when: "no such warning was issued before the service date and the pickup is the second or later chargeable late pickup of that semester"
            value: "K('repeat_multiplier_pct')"
          - when: "neither holds"
            value: "K('whole_rate_pct')"
        baseline:
          repeat_pct: "K('whole_rate_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: minute_billing_convention
        effect: method
        decides: billed_minutes
        bindings: [minutes_for_billing, billed_minutes]
        ladder:
          - when: "the pickup was more than quarter_hour_over_minutes minutes late"
            method: "the minutes are rounded up to whole quarter hours"
          - when: "the pickup was no more than minimum_block_minutes minutes late"
            method: "the minimum block of minimum_block_minutes minutes is billed"
          - when: "any other pickup"
            method: "the minutes are billed as recorded"
        baseline:
          billed_minutes: "minutes_for_billing"
        evidence: [history]
        cross_difficulty: null
      - id: after_hours_charge
        effect: parameter
        decides: after_hours_amount
        bindings: [minutes_for_after_hours, after_hours_amount]
        ladder:
          - when: "the pickup was at least after_hours_high_from_minutes minutes late"
            value: "K('after_hours_charge_high')"
          - when: "the pickup was at least after_hours_mid_from_minutes and less than after_hours_high_from_minutes minutes late"
            value: "K('after_hours_charge_mid')"
          - when: "the pickup was less than after_hours_mid_from_minutes minutes late"
            value: "0"
        baseline:
          after_hours_amount: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard late pickup fee is the pickup's minutes_late times late_pickup_fee_per_minute, minutes_late being counted from the plan's after_care_end_time itself, rounded to the nearest cent, half a cent rounding up.
      params: [late_pickup_fee_per_minute]
    inputs:
      history:
        - {table: care_attendance_log, aggregate: latest, field: minutes_late, filters: {event_type: care_late_pickup, fee_status: chargeable}}
        - {table: care_attendance_log, aggregate: count, field: care_attendance_id, filters: {event_type: care_late_pickup, fee_status: chargeable}}
      cross_category: [enroll]
  - id: care_ext_late_payment_fee_schedule
    base_policy_refs: [care_billing_and_late_payment, care_payments_and_returns, care_tuition_rate]
    overwrite:
      - base_policy: care_billing_and_late_payment
        superseded_clause: >-
          When the amounts applied by the due day leave any part of that month's tuition unpaid, one late payment fee of late_payment_fee posts late_payment_fee_offset_days after the due day; a month whose tuition posted after its due day becomes late only at the next month's due day.
        replaced_by: >-
          When the amounts applied by the due day leave any part of that month's tuition unpaid, one late payment fee still posts late_payment_fee_offset_days after the due day; for a billing month of an enrollment of the 2026-27 school year, and only for such a month, that fee is priced by the board-approved 2026-27 late payment fee schedule below, and for a billing month of any other school year it is still late_payment_fee; a month whose tuition posted after its due day still becomes late only at the next month's due day.
    trigger: state_due
    subject: [care_late_payment_fee]
    computes: fee_amount
    target_tool: post_late_payment_fee_d20db65b
    params:
      schedule_year: "2026-27"
      two_day_plan_fee: 8.00
      three_four_day_plan_fee: 10.00
      percentage_rate_pct: 10
      percentage_from_amount: 100.00
      half_month_proration: "half_month"
      one_earlier_addition: 5.00
      two_earlier_addition: 10.00
      returned_months: 12
      one_return_addition: 5.00
      two_return_addition: 10.00
    rule: >-
      This policy prices the late payment fee of the enrollment's most recently posted tuition charge, for a month that owes one under the late-fee sentence below; a month's late payment fee is posted before the next month's tuition charge posts, and an enrollment with no posted tuition charge has no late payment fee to price.
      When the amounts applied by the due day leave any part of that month's tuition unpaid, one late payment fee still posts late_payment_fee_offset_days after the due day; for a billing month of an enrollment of the 2026-27 school year, and only for such a month, that fee is priced by the board-approved 2026-27 late payment fee schedule below, and for a billing month of any other school year it is still late_payment_fee; a month whose tuition posted after its due day still becomes late only at the next month's due day.
      Whether a month owes a late payment fee is decided as the base billing rules decide it: payments, remittances and credits are applied to the enrollment's oldest open charge first, and a returned payment never counts as paid; the schedule below sets only the amount of the fee.
      The standard late payment fee is the base late fee, late_payment_fee, rounded to the nearest cent, half a cent rounding up.
      The schedule's amounts work together in one order: the parts that set an amount from the base late fee and the month's tuition charge come first, the parts that add a fixed amount are then added to it, and the fee is rounded once at the end to the nearest cent, half a cent rounding up.
      The schedule's base late fee follows the enrollment's plan: two_day_plan_fee for a plan of two program days per week, three_four_day_plan_fee for a plan of three or four program days per week, and late_payment_fee for a plan of five program days per week.
      The schedule's fee form follows the month's tuition charge: for a full month whose tuition charge is at least percentage_from_amount, the fee is the larger of the base late fee and percentage_rate_pct percent of that charge; for a half-month first month, the fee is percentage_rate_pct percent of that charge; for any other full month, the fee is the base late fee.
      The schedule's repeat addition follows the late payment fees already posted on the enrollment for earlier billing months: two_earlier_addition when there are two or more, one_earlier_addition when there is exactly one, and nothing when there is none.
      The schedule's returned-payment addition follows the family payments on the enrollment that the bank returned, the return posting after the same day of the month returned_months months before the day the fee posts (the last day of that month when it has no such day) and on or before the day the fee posts: two_return_addition when two or more were returned, one_return_addition when exactly one was, and nothing when none was.
    prerequisite: []
    cross_category: []
    compute:
      - fee_month: "LATEST('care_ledger', 'billing_month', date_field='posted_date', event_type='care_tuition_charge')"
      - plan_fee_month: "LATEST('care_ledger', 'billing_month', date_field='posted_date', event_type='care_tuition_charge')"
      - base_late_fee: "(K('two_day_plan_fee') if P('days_per_week') == 2 else (K('three_four_day_plan_fee') if (P('days_per_week') == 3 or P('days_per_week') == 4) else P('late_payment_fee'))) if plan_fee_month != None else P('late_payment_fee')"
      - form_charge: "SUM('care_ledger', 'amount', event_type='care_tuition_charge', billing_month=fee_month) if fee_month != None else 0"
      - form_proration: "LATEST('care_ledger', 'proration', date_field='posted_date', event_type='care_tuition_charge', billing_month=fee_month) if fee_month != None else None"
      - fee_form: "'percentage_floor' if (form_proration != K('half_month_proration') and form_charge >= K('percentage_from_amount')) else ('percentage' if form_proration == K('half_month_proration') else 'base')"
      - form_amount: "MX(base_late_fee, form_charge * K('percentage_rate_pct') / 100) if fee_form == 'percentage_floor' else (form_charge * K('percentage_rate_pct') / 100 if fee_form == 'percentage' else base_late_fee)"
      - earlier_fees: "COUNT('care_ledger', event_type='care_late_payment_fee')"
      - repeat_addition: "K('two_earlier_addition') if earlier_fees >= 2 else (K('one_earlier_addition') if earlier_fees == 1 else 0)"
      - returns_recent: "COUNT('care_ledger', within_months=K('returned_months'), date_field='posted_date', event_type='care_returned_payment')"
      - return_addition: "K('two_return_addition') if returns_recent >= 2 else (K('one_return_addition') if returns_recent == 1 else 0)"
      - schedule_fee: "form_amount + repeat_addition + return_addition"
      - standard_fee: "P('late_payment_fee')"
      - result: "(RND(schedule_fee + 0.000000001, 2) if F('school_year') == K('schedule_year') else RND(standard_fee + 0.000000001, 2)) if fee_month != None else 0"
    compute_basis:
      fee_month: "This policy prices the late payment fee of the enrollment's most recently posted tuition charge"
      plan_fee_month: "The schedule's base late fee follows the enrollment's plan"
      base_late_fee: "The schedule's base late fee follows the enrollment's plan: two_day_plan_fee for a plan of two program days per week, three_four_day_plan_fee for a plan of three or four program days per week, and late_payment_fee for a plan of five program days per week."
      form_charge: "The schedule's fee form follows the month's tuition charge"
      form_proration: "for a half-month first month, the fee is percentage_rate_pct percent of that charge"
      fee_form: "The schedule's fee form follows the month's tuition charge: for a full month whose tuition charge is at least percentage_from_amount, the fee is the larger of the base late fee and percentage_rate_pct percent of that charge; for a half-month first month, the fee is percentage_rate_pct percent of that charge; for any other full month, the fee is the base late fee."
      form_amount: "the parts that set an amount from the base late fee and the month's tuition charge come first"
      earlier_fees: "The schedule's repeat addition follows the late payment fees already posted on the enrollment for earlier billing months"
      repeat_addition: "The schedule's repeat addition follows the late payment fees already posted on the enrollment for earlier billing months: two_earlier_addition when there are two or more, one_earlier_addition when there is exactly one, and nothing when there is none."
      returns_recent: "The schedule's returned-payment addition follows the family payments on the enrollment that the bank returned, the return posting after the same day of the month returned_months months before the day the fee posts (the last day of that month when it has no such day) and on or before the day the fee posts"
      return_addition: "The schedule's returned-payment addition follows the family payments on the enrollment that the bank returned, the return posting after the same day of the month returned_months months before the day the fee posts (the last day of that month when it has no such day) and on or before the day the fee posts: two_return_addition when two or more were returned, one_return_addition when exactly one was, and nothing when none was."
      schedule_fee: "The schedule's amounts work together in one order: the parts that set an amount from the base late fee and the month's tuition charge come first, the parts that add a fixed amount are then added to it, and the fee is rounded once at the end to the nearest cent, half a cent rounding up."
      standard_fee: "The standard late payment fee is the base late fee, late_payment_fee, rounded to the nearest cent, half a cent rounding up."
      result: "for a billing month of an enrollment of the 2026-27 school year, and only for such a month, that fee is priced by the board-approved 2026-27 late payment fee schedule below, and for a billing month of any other school year it is still late_payment_fee"
    factors:
      - id: plan_base_late_fee
        effect: parameter
        decides: base_late_fee
        bindings: [plan_fee_month, base_late_fee]
        ladder:
          - when: "the plan covers two program days per week"
            value: "K('two_day_plan_fee')"
          - when: "the plan covers three or four program days per week"
            value: "K('three_four_day_plan_fee')"
          - when: "the plan covers five program days per week"
            value: "P('late_payment_fee')"
        baseline:
          base_late_fee: "P('late_payment_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: late_fee_form
        effect: method
        decides: fee_form
        bindings: [form_charge, form_proration, fee_form]
        ladder:
          - when: "the month is a full month whose tuition charge is at least percentage_from_amount"
            method: "the fee is the larger of the base late fee and percentage_rate_pct percent of the month's tuition charge"
          - when: "the month is a half-month first month"
            method: "the fee is percentage_rate_pct percent of the month's tuition charge"
          - when: "the month is any other full month"
            method: "the fee is the base late fee"
        baseline:
          fee_form: "'base'"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_late_month_addition
        effect: parameter
        decides: repeat_addition
        bindings: [earlier_fees, repeat_addition]
        ladder:
          - when: "two or more late payment fees are already posted on the enrollment for earlier billing months"
            value: "K('two_earlier_addition')"
          - when: "exactly one is"
            value: "K('one_earlier_addition')"
          - when: "none is"
            value: "0"
        baseline:
          repeat_addition: "0"
        evidence: [history]
        cross_difficulty: null
      - id: returned_payment_late_addition
        effect: parameter
        decides: return_addition
        bindings: [returns_recent, return_addition]
        ladder:
          - when: "two or more family payments on the enrollment were returned by the bank, the return posting after the same day of the month returned_months months before the day the fee posts (the last day of that month when it has no such day) and on or before the day the fee posts"
            value: "K('two_return_addition')"
          - when: "exactly one was"
            value: "K('one_return_addition')"
          - when: "none was"
            value: "0"
        baseline:
          return_addition: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard late payment fee is the base late fee, late_payment_fee, rounded to the nearest cent, half a cent rounding up.
      params: [late_payment_fee]
    inputs:
      history:
        - {table: care_ledger, aggregate: sum, field: amount, filters: {event_type: care_tuition_charge}}
        - {table: care_ledger, aggregate: count, field: care_ledger_id, filters: {event_type: care_late_payment_fee}}
        - {table: care_ledger, aggregate: count, field: care_ledger_id, filters: {event_type: care_returned_payment}}
      cross_category: []
  - id: care_ext_booked_day_fee_schedule
    base_policy_refs: [care_evt_day_fees]
    overwrite:
      - base_policy: care_evt_day_fees
        superseded_clause: >-
          each drop-in day is charged drop_in_day_fee.
        replaced_by: >-
          each drop-in day is still charged drop_in_day_fee, which on an enrollment of the 2026-27 school year is the day rate the board-approved 2026-27 booked-day fee schedule below starts from.
      - base_policy: care_evt_day_fees
        superseded_clause: >-
          A holiday camp day may be booked only on a plan whose holiday_camp_access is true and is charged holiday_camp_day_fee.
        replaced_by: >-
          A holiday camp day may still be booked only on a plan whose holiday_camp_access is true and is still charged holiday_camp_day_fee, which on an enrollment of the 2026-27 school year is the day rate the schedule below starts from.
      - base_policy: care_evt_day_fees
        superseded_clause: >-
          An early-release afternoon is covered without any fee when the plan's early_release_included is true; otherwise a booked early-release afternoon is charged early_release_day_fee.
        replaced_by: >-
          An early-release afternoon is still covered without any fee when the plan's early_release_included is true; otherwise a booked early-release afternoon is still charged early_release_day_fee, which on an enrollment of the 2026-27 school year is the day rate the schedule below starts from.
      - base_policy: care_evt_day_fees
        superseded_clause: >-
          Day fees are not discounted by rate basis or sibling position.
        replaced_by: >-
          Day fees are still not discounted by sibling position, and are not discounted by rate basis except that, on an enrollment of the 2026-27 school year and only there, the schedule's rate-basis rule below sets the rate charged for the day.
    trigger: state_due
    subject: [care_day_fee]
    computes: fee_amount
    target_tool: post_booked_day_fee_4f9449e5
    params:
      schedule_year: "2026-27"
      holiday_camp_dates: ["2026-11-23", "2026-11-24", "2026-11-25", "2026-12-21", "2026-12-22", "2026-12-23", "2026-12-28", "2026-12-29", "2026-12-30", "2027-01-04", "2027-01-18", "2027-02-15", "2027-03-15", "2027-03-16", "2027-03-17", "2027-03-18", "2027-03-19"]
      early_release_dates: ["2026-10-09", "2026-12-18", "2027-03-12", "2027-05-27"]
      pk_grades: ["PK3", "PK4"]
      kg_grade: "KG"
      pk_supplement: 6.00
      kg_supplement: 4.00
      two_day_plan_supplement: 5.00
      three_four_day_plan_supplement: 3.00
      advance_lead_days: 14
      short_notice_lead_days: 6
      advance_adjustment: -3.00
      short_notice_adjustment: 5.00
      free_status_day_rate: 10.00
      reduced_status_rate_pct: 75
    rule: >-
      This policy prices the day fee of the most recent drop-in booking request that is received or completed (latest by the time it was received; a declined or cancelled request is never priced) of an enrollment of the 2026-27 school year, and only of such an enrollment; a booked day's fee is posted before the next booking request is received, an enrollment with no drop-in booking request has no booked-day fee to price, and a booking on an enrollment of any other school year is charged under the day-fee sentences below as they stand for that year.
      Under the base booking conditions, each drop-in day is still charged drop_in_day_fee, which on an enrollment of the 2026-27 school year is the day rate the board-approved 2026-27 booked-day fee schedule below starts from.
      A holiday camp day may still be booked only on a plan whose holiday_camp_access is true and is still charged holiday_camp_day_fee, which on an enrollment of the 2026-27 school year is the day rate the schedule below starts from.
      An early-release afternoon is still covered without any fee when the plan's early_release_included is true; otherwise a booked early-release afternoon is still charged early_release_day_fee, which on an enrollment of the 2026-27 school year is the day rate the schedule below starts from.
      Day fees are still not discounted by sibling position, and are not discounted by rate basis except that, on an enrollment of the 2026-27 school year and only there, the schedule's rate-basis rule below sets the rate charged for the day.
      The standard booked-day fee is the day rate of the requested date: holiday_camp_day_fee for a date that is one of the district's 2026-27 holiday camp dates, booked as a holiday camp day; for a date that is one of its 2026-27 early-release dates, booked as an early-release afternoon, early_release_day_fee when the plan's early_release_included is false and no fee when it is true; and drop_in_day_fee for any other date, booked as a drop-in day; the fee is rounded to the nearest cent, half a cent rounding up.
      The schedule's amounts work together in one order: the part that sets the rate charged acts on the day rate first, every part that adds or takes off a fixed amount is then applied, and the total is the fee, rounded once at the end; no fee posts when the day carries no day rate.
      The schedule's rate-basis rule follows the rate basis recorded on the enrollment's most recently posted tuition charge: when it is free_meal_rate, the rate charged is free_status_day_rate; when it is reduced_meal_rate, the rate charged is the larger of free_status_day_rate and reduced_status_rate_pct percent of the day rate; for any other rate basis, the rate charged is the day rate.
      The schedule's grade supplement follows the grade on the student's district enrollment record for the enrollment's school year in status enrolled: pk_supplement for grade PK3 or PK4, kg_supplement for grade KG, and nothing for grades 01 through 05 or for a student with no such record.
      The schedule's plan supplement follows the enrollment's plan: two_day_plan_supplement for a plan of two program days per week, three_four_day_plan_supplement for a plan of three or four program days per week, and nothing for a plan of five program days per week.
      The schedule's booking adjustment follows the calendar days between the request's receipt and the requested date: advance_adjustment when the request was received at least advance_lead_days days ahead, short_notice_adjustment when it was received no more than short_notice_lead_days days ahead, and nothing otherwise.
    prerequisite: []
    cross_category:
      - category: enroll
        as: branch
        reads: [grade_level, status, school_year]
        note: The grade supplement is read from the grade on the student's district enrollment record for the school year.
    compute:
      - requested_date: "(LATEST('care_requests', 'requested_date', date_field='created_at', request_type='drop_in_booking', request_status='completed') if (LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='completed') != None and (LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='received') == None or LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='completed') > LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='received'))) else LATEST('care_requests', 'requested_date', date_field='created_at', request_type='drop_in_booking', request_status='received'))"
      - day_rate: "(P('holiday_camp_day_fee') if requested_date in K('holiday_camp_dates') else ((0 if P('early_release_included') else P('early_release_day_fee')) if requested_date in K('early_release_dates') else P('drop_in_day_fee'))) if requested_date != None else 0"
      - rate_month: "LATEST('care_ledger', 'billing_month', date_field='posted_date', event_type='care_tuition_charge')"
      - free_rate_rows: "COUNT('care_ledger', event_type='care_tuition_charge', billing_month=rate_month, rate_basis='free_meal_rate') if rate_month != None else 0"
      - reduced_rate_rows: "COUNT('care_ledger', event_type='care_tuition_charge', billing_month=rate_month, rate_basis='reduced_meal_rate') if rate_month != None else 0"
      - rate_rule: "'free_flat' if free_rate_rows >= 1 else ('reduced_share' if reduced_rate_rows >= 1 else 'day_rate')"
      - rate_charged: "K('free_status_day_rate') if rate_rule == 'free_flat' else (MX(K('free_status_day_rate'), day_rate * K('reduced_status_rate_pct') / 100) if rate_rule == 'reduced_share' else day_rate)"
      - district_grade: "CFIELD('enroll', 'grade_level', student_id=F('student_id'), school_year=F('school_year'), status='enrolled')"
      - grade_supplement: "K('pk_supplement') if district_grade in K('pk_grades') else (K('kg_supplement') if (district_grade == K('kg_grade') and not district_grade in K('pk_grades')) else 0)"
      - plan_request_date: "(LATEST('care_requests', 'requested_date', date_field='created_at', request_type='drop_in_booking', request_status='completed') if (LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='completed') != None and (LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='received') == None or LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='completed') > LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='received'))) else LATEST('care_requests', 'requested_date', date_field='created_at', request_type='drop_in_booking', request_status='received'))"
      - plan_supplement: "(K('two_day_plan_supplement') if P('days_per_week') == 2 else (K('three_four_day_plan_supplement') if (P('days_per_week') == 3 or P('days_per_week') == 4) else 0)) if plan_request_date != None else 0"
      - request_received: "(LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='completed') if (LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='completed') != None and (LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='received') == None or LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='completed') > LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='received'))) else LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='received'))"
      - lead_request_date: "(LATEST('care_requests', 'requested_date', date_field='created_at', request_type='drop_in_booking', request_status='completed') if (LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='completed') != None and (LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='received') == None or LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='completed') > LATEST('care_requests', 'created_at', date_field='created_at', request_type='drop_in_booking', request_status='received'))) else LATEST('care_requests', 'requested_date', date_field='created_at', request_type='drop_in_booking', request_status='received'))"
      - lead_days: "DAYS(request_received, lead_request_date) if lead_request_date != None else 0"
      - booking_adjustment: "K('advance_adjustment') if lead_days >= K('advance_lead_days') else (K('short_notice_adjustment') if (lead_days <= K('short_notice_lead_days') and lead_days < K('advance_lead_days')) else 0)"
      - result: "RND(rate_charged + grade_supplement + plan_supplement + booking_adjustment + 0.000000001, 2) if (requested_date != None and day_rate > 0 and F('school_year') == K('schedule_year')) else 0"
    compute_basis:
      requested_date: "This policy prices the day fee of the most recent drop-in booking request that is received or completed (latest by the time it was received; a declined or cancelled request is never priced) of an enrollment of the 2026-27 school year"
      day_rate: "The standard booked-day fee is the day rate of the requested date: holiday_camp_day_fee for a date that is one of the district's 2026-27 holiday camp dates, booked as a holiday camp day; for a date that is one of its 2026-27 early-release dates, booked as an early-release afternoon, early_release_day_fee when the plan's early_release_included is false and no fee when it is true; and drop_in_day_fee for any other date, booked as a drop-in day; the fee is rounded to the nearest cent, half a cent rounding up."
      rate_month: "The schedule's rate-basis rule follows the rate basis recorded on the enrollment's most recently posted tuition charge"
      free_rate_rows: "when it is free_meal_rate, the rate charged is free_status_day_rate"
      reduced_rate_rows: "when it is reduced_meal_rate, the rate charged is the larger of free_status_day_rate and reduced_status_rate_pct percent of the day rate"
      rate_rule: "The schedule's rate-basis rule follows the rate basis recorded on the enrollment's most recently posted tuition charge: when it is free_meal_rate, the rate charged is free_status_day_rate; when it is reduced_meal_rate, the rate charged is the larger of free_status_day_rate and reduced_status_rate_pct percent of the day rate; for any other rate basis, the rate charged is the day rate."
      rate_charged: "the part that sets the rate charged acts on the day rate first"
      district_grade: "The schedule's grade supplement follows the grade on the student's district enrollment record for the enrollment's school year in status enrolled"
      grade_supplement: "The schedule's grade supplement follows the grade on the student's district enrollment record for the enrollment's school year in status enrolled: pk_supplement for grade PK3 or PK4, kg_supplement for grade KG, and nothing for grades 01 through 05 or for a student with no such record."
      plan_request_date: "The schedule's plan supplement follows the enrollment's plan"
      plan_supplement: "The schedule's plan supplement follows the enrollment's plan: two_day_plan_supplement for a plan of two program days per week, three_four_day_plan_supplement for a plan of three or four program days per week, and nothing for a plan of five program days per week."
      request_received: "The schedule's booking adjustment follows the calendar days between the request's receipt and the requested date"
      lead_request_date: "The schedule's booking adjustment follows the calendar days between the request's receipt and the requested date"
      lead_days: "The schedule's booking adjustment follows the calendar days between the request's receipt and the requested date"
      booking_adjustment: "The schedule's booking adjustment follows the calendar days between the request's receipt and the requested date: advance_adjustment when the request was received at least advance_lead_days days ahead, short_notice_adjustment when it was received no more than short_notice_lead_days days ahead, and nothing otherwise."
      result: "The schedule's amounts work together in one order: the part that sets the rate charged acts on the day rate first, every part that adds or takes off a fixed amount is then applied, and the total is the fee, rounded once at the end; no fee posts when the day carries no day rate."
    factors:
      - id: rate_basis_day_rate
        effect: method
        decides: rate_rule
        bindings: [rate_month, free_rate_rows, reduced_rate_rows, rate_rule]
        ladder:
          - when: "the enrollment's most recently posted tuition charge records rate basis free_meal_rate"
            method: "the rate charged is the flat free_status_day_rate"
          - when: "it records rate basis reduced_meal_rate"
            method: "the rate charged is the larger of free_status_day_rate and reduced_status_rate_pct percent of the day rate"
          - when: "it records any other rate basis"
            method: "the rate charged is the day rate"
        baseline:
          rate_rule: "'day_rate'"
        evidence: [history]
        cross_difficulty: null
      - id: grade_band_day_supplement
        effect: parameter
        decides: grade_supplement
        bindings: [district_grade, grade_supplement]
        ladder:
          - when: "the student's district enrollment record for the school year shows grade PK3 or PK4"
            value: "K('pk_supplement')"
          - when: "it shows grade KG"
            value: "K('kg_supplement')"
          - when: "it shows grade 01 through 05, or the student holds no such record"
            value: "0"
        baseline:
          grade_supplement: "0"
        evidence: [cross_category]
        cross_difficulty: enroll
      - id: plan_day_supplement
        effect: parameter
        decides: plan_supplement
        bindings: [plan_request_date, plan_supplement]
        ladder:
          - when: "the plan covers two program days per week"
            value: "K('two_day_plan_supplement')"
          - when: "the plan covers three or four program days per week"
            value: "K('three_four_day_plan_supplement')"
          - when: "the plan covers five program days per week"
            value: "0"
        baseline:
          plan_supplement: "0"
        evidence: [history]
        cross_difficulty: null
      - id: booking_lead_adjustment
        effect: parameter
        decides: booking_adjustment
        bindings: [request_received, lead_request_date, lead_days, booking_adjustment]
        ladder:
          - when: "the request was received at least advance_lead_days days before the requested date"
            value: "K('advance_adjustment')"
          - when: "it was received no more than short_notice_lead_days days before the requested date"
            value: "K('short_notice_adjustment')"
          - when: "otherwise"
            value: "0"
        baseline:
          booking_adjustment: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard booked-day fee is the day rate of the requested date: holiday_camp_day_fee for a date that is one of the district's 2026-27 holiday camp dates, booked as a holiday camp day; for a date that is one of its 2026-27 early-release dates, booked as an early-release afternoon, early_release_day_fee when the plan's early_release_included is false and no fee when it is true; and drop_in_day_fee for any other date, booked as a drop-in day; the fee is rounded to the nearest cent, half a cent rounding up.
      params: [drop_in_day_fee, holiday_camp_day_fee, early_release_day_fee, early_release_included]
    inputs:
      history:
        - {table: care_requests, aggregate: latest, field: requested_date, filters: {request_type: drop_in_booking, request_status: received}}
        - {table: care_requests, aggregate: latest, field: requested_date, filters: {request_type: drop_in_booking, request_status: completed}}
        - {table: care_ledger, aggregate: count, field: care_ledger_id, filters: {event_type: care_tuition_charge}}
      cross_category: [enroll]
  - id: care_ext_current_year_payment_plan
    base_policy_refs: [care_payments_and_returns, care_billing_and_late_payment]
    overwrite:
      - base_policy: care_billing_and_late_payment
        superseded_clause: >-
          When at least suspension_minimum_past_due of tuition remains unpaid more than suspension_days_past_due days after a month's due day, care is suspended; tuition continues to post while care is suspended, because the seat is held.
        replaced_by: >-
          When at least suspension_minimum_past_due of tuition remains unpaid more than suspension_days_past_due days after a month's due day, care is still suspended, except on an enrollment of the current school year whose family has paid the first payment of a payment plan under this policy and pays each later plan payment by the next tuition due day; tuition still continues to post while care is suspended, because the seat is held.
    trigger: on_request
    subject: [care_payment]
    computes: payment_amount
    target_tool: pay_extended_day_settlement_f9b88247
    params:
      four_payments_from: 300.00
      three_payments_from: 150.00
      two_payments_from: 50.00
      fall_last_month: "2026-12"
      fall_last_month_start: "2026-12-01"
      spring_last_month_start: "2027-05-01"
      short_window_months: 2
      middle_window_months: 4
      short_window_cap: 2
      middle_window_cap: 3
      open_window_cap: 12
      free_extra_payments: 2
      reduced_extra_payments: 1
      returned_months: 12
      minimum_payment: 25.00
      minimum_rule_below: 50.00
    rule: >-
      A family of the current school year that cannot pay its Creek Kids Club balance at once may ask for a payment plan; the family makes the plan's first payment itself through the district's online payment portal or at the campus cashier, the support desk quoting the amount and never taking card details, and the payment posts to the enrollment.
      When at least suspension_minimum_past_due of tuition remains unpaid more than suspension_days_past_due days after a month's due day, care is still suspended, except on an enrollment of the current school year whose family has paid the first payment of a payment plan under this policy and pays each later plan payment by the next tuition due day; tuition still continues to post while care is suspended, because the seat is held.
      The first plan payment is not fixed until the enrollment's most recently recorded chargeable late pickup carries its late pickup fee entry.
      The first plan payment is fixed only after the enrollment's most recently posted tuition charge carries its late payment fee entry whenever any part of that month's tuition was left unpaid on its due day.
      The first plan payment is fixed only after the enrollment's most recent drop-in booking request that is received or completed carries its booked-day fee entry whenever the booked day owes a fee.
      The plan works on the enrollment's open balance on the day of the payment: every charge posted on the enrollment less every payment, Workforce Solutions remittance and credit posted on it.
      The standard first plan payment is the whole open balance, the plan having one payment, rounded to the nearest cent, half a cent rounding up; nothing is due when the open balance is not above zero.
      The plan's terms work together in one order: of the number of payments the terms that set a number allow and the number the terms that limit it allow, the smaller applies first; the terms that add payments are then applied and the terms that take payments away after them, and the count is never fewer than one; the term that sets how the first payment is worked out then acts on that count, the first payment never exceeds the open balance, and it is rounded once at the end.
      The plan's balance scale sets four payments for an open balance of at least four_payments_from, three for at least three_payments_from and less than four_payments_from, two for at least two_payments_from and less than three_payments_from, and one for a smaller open balance.
      The plan's semester limit counts the billing months from the enrollment's most recently posted billing month through the last billing month of its semester (December for a fall month, May for a spring month): it allows short_window_cap payments when that count is at most short_window_months, middle_window_cap payments when it is more than short_window_months and at most middle_window_months, and sets no limit when it is larger.
      The plan's hardship terms add free_extra_payments payments when the student's active meal account holds a status whose benefit level is free and whose effective date is on or before the day of the payment, reduced_extra_payments payment when it holds one whose benefit level is reduced and whose effective date is on or before that day, and none otherwise.
      The plan's returned-payment rule takes away two payments when two or more family payments on the enrollment were returned by the bank, the return posting after the same day of the month returned_months months before the day of the payment (the last day of that month when it has no such day) and on or before the day of the payment, one payment when exactly one was, and none when none was.
      The plan's payment rule takes the late payment fee of the most recently posted billing month in full in the first payment, together with an equal share of the rest of the open balance, when that month carries a late payment fee; it takes the larger of minimum_payment and an equal share of the open balance when that month carries no late payment fee and the open balance is less than minimum_rule_below; it takes an equal share of the open balance otherwise.
    prerequisite:
      - problem: care_ext_late_pickup_fee_schedule
        kind: value_input
        gate: open_balance
        form: state
        policy_source: >-
          The first plan payment is not fixed until the enrollment's most recently recorded chargeable late pickup carries its late pickup fee entry.
        condition: >-
          The latest care_late_pickup row of the enrollment with fee_status chargeable has a care_late_pickup_fee entry on the enrollment for the same service_date.
        resolved_by: post_late_pickup_fee_6e670263
        effect: >-
          The late pickup fee entry raises the open balance, which moves the balance scale and the payments the plan divides.
      - problem: care_ext_late_payment_fee_schedule
        kind: value_input
        gate: open_balance
        form: state
        policy_source: >-
          The first plan payment is fixed only after the enrollment's most recently posted tuition charge carries its late payment fee entry whenever any part of that month's tuition was left unpaid on its due day.
        condition: >-
          When the amounts applied oldest first by the latest tuition charge's due day left part of that month's tuition unpaid, a care_late_payment_fee entry exists on the enrollment for that billing_month.
        resolved_by: post_late_payment_fee_d20db65b
        effect: >-
          The late payment fee entry raises the open balance and becomes the fee the payment rule takes in full.
      - problem: care_ext_booked_day_fee_schedule
        kind: value_input
        gate: open_balance
        form: state
        policy_source: >-
          The first plan payment is fixed only after the enrollment's most recent drop-in booking request that is received or completed carries its booked-day fee entry whenever the booked day owes a fee.
        condition: >-
          When the latest drop_in_booking request in status received or completed (by created_at) has a booked day that carries a rate, a care_day_fee entry exists on the enrollment for that request's requested_date.
        resolved_by: post_booked_day_fee_4f9449e5
        effect: >-
          The booked-day fee entry raises the open balance, which moves the payments the plan divides.
    cross_category:
      - category: meals
        as: branch
        reads: [benefit_level, benefit_effective_date]
        note: The hardship terms are read from the benefit level and effective date of the student's active meal account.
    compute:
      - charges_total: "SUM('care_ledger', 'amount', event_type='care_registration_fee') + SUM('care_ledger', 'amount', event_type='care_tuition_charge') + SUM('care_ledger', 'amount', event_type='care_day_fee') + SUM('care_ledger', 'amount', event_type='care_late_pickup_fee') + SUM('care_ledger', 'amount', event_type='care_late_payment_fee') + SUM('care_ledger', 'amount', event_type='care_plan_change_fee') + SUM('care_ledger', 'amount', event_type='care_returned_payment') + SUM('care_ledger', 'amount', event_type='care_returned_payment_fee') + SUM('care_ledger', 'amount', event_type='care_refund')"
      - reductions_total: "SUM('care_ledger', 'amount', event_type='care_payment') + SUM('care_ledger', 'amount', event_type='care_subsidy_remittance') + SUM('care_ledger', 'amount', event_type='care_credit')"
      - open_balance: "charges_total - reductions_total"
      - scale_balance: "SUM('care_ledger', 'amount', event_type='care_registration_fee') + SUM('care_ledger', 'amount', event_type='care_tuition_charge') + SUM('care_ledger', 'amount', event_type='care_day_fee') + SUM('care_ledger', 'amount', event_type='care_late_pickup_fee') + SUM('care_ledger', 'amount', event_type='care_late_payment_fee') + SUM('care_ledger', 'amount', event_type='care_plan_change_fee') + SUM('care_ledger', 'amount', event_type='care_returned_payment') + SUM('care_ledger', 'amount', event_type='care_returned_payment_fee') + SUM('care_ledger', 'amount', event_type='care_refund') - SUM('care_ledger', 'amount', event_type='care_payment') - SUM('care_ledger', 'amount', event_type='care_subsidy_remittance') - SUM('care_ledger', 'amount', event_type='care_credit')"
      - scale_payments: "4 if scale_balance >= K('four_payments_from') else (3 if (scale_balance >= K('three_payments_from') and scale_balance < K('four_payments_from')) else (2 if (scale_balance >= K('two_payments_from') and scale_balance < K('three_payments_from')) else 1))"
      - latest_month: "LATEST('care_ledger', 'billing_month', date_field='posted_date', event_type='care_tuition_charge')"
      - window_months: "(MONTHS(latest_month + '-01', K('fall_last_month_start')) + 1 if latest_month <= K('fall_last_month') else MONTHS(latest_month + '-01', K('spring_last_month_start')) + 1) if latest_month != None else 1"
      - semester_cap: "K('short_window_cap') if window_months <= K('short_window_months') else (K('middle_window_cap') if (window_months > K('short_window_months') and window_months <= K('middle_window_months')) else K('open_window_cap'))"
      - meal_level_now: "CPARAM('meals', 'benefit_level', student_id=F('student_id'), status='active')"
      - meal_effective_now: "CFIELD('meals', 'benefit_effective_date', student_id=F('student_id'), status='active')"
      - hardship_payments: "K('free_extra_payments') if (meal_level_now == 'free' and meal_effective_now != None and meal_effective_now <= NOW) else (K('reduced_extra_payments') if (meal_level_now == 'reduced' and meal_effective_now != None and meal_effective_now <= NOW) else 0)"
      - returned_recent: "COUNT('care_ledger', within_months=K('returned_months'), date_field='posted_date', event_type='care_returned_payment')"
      - returned_off: "2 if returned_recent >= 2 else (1 if returned_recent == 1 else 0)"
      - payment_count: "MX(1, MN(scale_payments, semester_cap) + hardship_payments - returned_off)"
      - month_late_fee: "SUM('care_ledger', 'amount', event_type='care_late_payment_fee', billing_month=latest_month) if latest_month != None else 0"
      - rule_balance: "SUM('care_ledger', 'amount', event_type='care_tuition_charge') + SUM('care_ledger', 'amount', event_type='care_registration_fee') + SUM('care_ledger', 'amount', event_type='care_day_fee') + SUM('care_ledger', 'amount', event_type='care_late_pickup_fee') + SUM('care_ledger', 'amount', event_type='care_late_payment_fee') + SUM('care_ledger', 'amount', event_type='care_plan_change_fee') + SUM('care_ledger', 'amount', event_type='care_returned_payment') + SUM('care_ledger', 'amount', event_type='care_returned_payment_fee') + SUM('care_ledger', 'amount', event_type='care_refund') - SUM('care_ledger', 'amount', event_type='care_payment') - SUM('care_ledger', 'amount', event_type='care_subsidy_remittance') - SUM('care_ledger', 'amount', event_type='care_credit')"
      - payment_rule: "'fee_first' if month_late_fee > 0 else ('minimum' if rule_balance < K('minimum_rule_below') else 'equal')"
      - first_payment: "(month_late_fee + (open_balance - month_late_fee) / payment_count) if payment_rule == 'fee_first' else (MX(K('minimum_payment'), open_balance / payment_count) if payment_rule == 'minimum' else open_balance / payment_count)"
      - result: "RND(MN(open_balance, first_payment) + 0.000000001, 2) if open_balance > 0 else 0"
    compute_basis:
      charges_total: "every charge posted on the enrollment"
      reductions_total: "less every payment, Workforce Solutions remittance and credit posted on it."
      open_balance: "The plan works on the enrollment's open balance on the day of the payment: every charge posted on the enrollment less every payment, Workforce Solutions remittance and credit posted on it."
      scale_balance: "The plan's balance scale sets four payments for an open balance of at least four_payments_from"
      scale_payments: "The plan's balance scale sets four payments for an open balance of at least four_payments_from, three for at least three_payments_from and less than four_payments_from, two for at least two_payments_from and less than three_payments_from, and one for a smaller open balance."
      latest_month: "counts the billing months from the enrollment's most recently posted billing month through the last billing month of its semester"
      window_months: "The plan's semester limit counts the billing months from the enrollment's most recently posted billing month through the last billing month of its semester (December for a fall month, May for a spring month)"
      semester_cap: "it allows short_window_cap payments when that count is at most short_window_months, middle_window_cap payments when it is more than short_window_months and at most middle_window_months, and sets no limit when it is larger."
      meal_level_now: "when the student's active meal account holds a status whose benefit level is free and whose effective date is on or before the day of the payment"
      meal_effective_now: "when the student's active meal account holds a status whose benefit level is free and whose effective date is on or before the day of the payment"
      hardship_payments: "The plan's hardship terms add free_extra_payments payments when the student's active meal account holds a status whose benefit level is free and whose effective date is on or before the day of the payment, reduced_extra_payments payment when it holds one whose benefit level is reduced and whose effective date is on or before that day, and none otherwise."
      returned_recent: "when two or more family payments on the enrollment were returned by the bank, the return posting after the same day of the month returned_months months before the day of the payment (the last day of that month when it has no such day) and on or before the day of the payment"
      returned_off: "The plan's returned-payment rule takes away two payments when two or more family payments on the enrollment were returned by the bank, the return posting after the same day of the month returned_months months before the day of the payment (the last day of that month when it has no such day) and on or before the day of the payment, one payment when exactly one was, and none when none was."
      payment_count: "of the number of payments the terms that set a number allow and the number the terms that limit it allow, the smaller applies first; the terms that add payments are then applied and the terms that take payments away after them, and the count is never fewer than one"
      month_late_fee: "when that month carries a late payment fee"
      rule_balance: "when that month carries no late payment fee and the open balance is less than minimum_rule_below"
      payment_rule: "The plan's payment rule takes the late payment fee of the most recently posted billing month in full in the first payment, together with an equal share of the rest of the open balance, when that month carries a late payment fee; it takes the larger of minimum_payment and an equal share of the open balance when that month carries no late payment fee and the open balance is less than minimum_rule_below; it takes an equal share of the open balance otherwise."
      first_payment: "the term that sets how the first payment is worked out then acts on that count"
      result: "the first payment never exceeds the open balance, and it is rounded once at the end."
    factors:
      - id: balance_payment_scale
        effect: parameter
        decides: scale_payments
        bindings: [scale_balance, scale_payments]
        ladder:
          - when: "the open balance is at least four_payments_from"
            value: "4"
          - when: "it is at least three_payments_from and less than four_payments_from"
            value: "3"
          - when: "it is at least two_payments_from and less than three_payments_from"
            value: "2"
          - when: "it is smaller"
            value: "1"
        baseline:
          scale_payments: "1"
        evidence: [history]
        cross_difficulty: null
      - id: semester_payment_limit
        effect: parameter
        decides: semester_cap
        bindings: [latest_month, window_months, semester_cap]
        ladder:
          - when: "the billing months from the most recently posted one through the semester's last are at most short_window_months"
            value: "K('short_window_cap')"
          - when: "they are more than short_window_months and at most middle_window_months"
            value: "K('middle_window_cap')"
          - when: "they are more than middle_window_months"
            value: "K('open_window_cap')"
        baseline:
          semester_cap: "K('open_window_cap')"
        evidence: [history, date]
        cross_difficulty: null
      - id: plan_hardship_terms
        effect: parameter
        decides: hardship_payments
        bindings: [meal_level_now, meal_effective_now, hardship_payments]
        ladder:
          - when: "the student's active meal account holds a status whose benefit level is free and whose effective date is on or before the day of the payment"
            value: "K('free_extra_payments')"
          - when: "it holds one whose benefit level is reduced and whose effective date is on or before that day"
            value: "K('reduced_extra_payments')"
          - when: "otherwise"
            value: "0"
        baseline:
          hardship_payments: "0"
        evidence: [cross_category, date]
        cross_difficulty: meals
      - id: plan_returned_payment_rule
        effect: parameter
        decides: returned_off
        bindings: [returned_recent, returned_off]
        ladder:
          - when: "two or more family payments on the enrollment were returned by the bank, the return posting after the same day of the month returned_months months before the day of the payment (the last day of that month when it has no such day) and on or before the day of the payment"
            value: "2"
          - when: "exactly one was"
            value: "1"
          - when: "none was"
            value: "0"
        baseline:
          returned_off: "0"
        evidence: [history]
        cross_difficulty: null
      - id: plan_payment_rule
        effect: method
        decides: payment_rule
        bindings: [month_late_fee, rule_balance, payment_rule]
        ladder:
          - when: "the most recently posted billing month carries a late payment fee"
            method: "that late payment fee is taken in full together with an equal share of the rest of the open balance"
          - when: "that month carries no late payment fee and the open balance is less than minimum_rule_below"
            method: "the larger of minimum_payment and an equal share of the open balance is taken"
          - when: "otherwise"
            method: "an equal share of the open balance is taken"
        baseline:
          payment_rule: "'equal'"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The plan works on the enrollment's open balance on the day of the payment: every charge posted on the enrollment less every payment, Workforce Solutions remittance and credit posted on it.
        The standard first plan payment is the whole open balance, the plan having one payment, rounded to the nearest cent, half a cent rounding up; nothing is due when the open balance is not above zero.
      params: []
    inputs:
      history:
        - {table: care_ledger, aggregate: sum, field: amount, filters: {}}
        - {table: care_ledger, aggregate: count, field: care_ledger_id, within_months: 12, filters: {event_type: care_returned_payment}}
      cross_category: [meals]
  - id: care_ext_notice_period_credit
    base_policy_refs: [care_withdrawal_and_refunds, care_billing_and_late_payment, care_evt_registration_fee, care_evt_day_fees, care_subsidy_funding]
    overwrite:
      - base_policy: care_withdrawal_and_refunds
        superseded_clause: >-
          The last day of care is the requested last day, but when the requested last day is earlier than withdrawal_notice_days calendar days after the notice was received, tuition is billed through the end of that notice period (billing_after_short_notice), the notice date counting as day 0.
        replaced_by: >-
          The last day of care is still the requested last day, and when the requested last day is earlier than the end of the notice period, tuition is still billed through the end of that notice period (billing_after_short_notice); the notice period runs for the length the notice-length schedule below sets for the plan, counted in calendar days from the notice's counting day as day 0, the counting day being set by the counting-day rule below.
      - base_policy: care_withdrawal_and_refunds
        superseded_clause: >-
          A billing month any day of which falls on or before the later of the requested last day and the end of the notice period is billed in full; a tuition charge already posted for a month that falls entirely after that later date is credited in full with credit_reason notice_period_adjustment.
        replaced_by: >-
          A tuition charge already posted for a month that falls entirely after the billing end is still credited in full with credit_reason notice_period_adjustment; a billing month in which the billing end falls is credited by the proration convention below with credit_reason notice_period_adjustment, and is billed in full only where that convention credits nothing.
    trigger: state_due
    subject: [care_credit]
    computes: credit_amount
    target_tool: post_notice_period_credit_667047da
    params:
      two_day_notice_days: 7
      three_day_notice_days: 10
      reference_monday: "2025-12-01"
      saturday_index: 5
      sunday_index: 6
      saturday_shift_days: 2
      sunday_shift_days: 1
      convention_month_days: 30
      convention_weeks_last_day: 28
      share_per_week_pct: 25
      whole_share_pct: 100
    rule: >-
      This policy credits a withdrawn Creek Kids Club enrollment for the tuition of its final billed month that care and the notice period do not reach; the credit is posted with credit_reason notice_period_adjustment against the enrollment's most recently posted tuition charge, and only against that charge, using the enrollment's most recent withdrawal_notice request that is received or completed (latest by the time it was received; a declined or cancelled notice is never used), its requested last day and the date it was received as the notice date.
      The last day of care is still the requested last day, and when the requested last day is earlier than the end of the notice period, tuition is still billed through the end of that notice period (billing_after_short_notice); the notice period runs for the length the notice-length schedule below sets for the plan, counted in calendar days from the notice's counting day as day 0, the counting day being set by the counting-day rule below.
      A tuition charge already posted for a month that falls entirely after the billing end is still credited in full with credit_reason notice_period_adjustment; a billing month in which the billing end falls is credited by the proration convention below with credit_reason notice_period_adjustment, and is billed in full only where that convention credits nothing.
      The billing end is the later of the requested last day and the last day of the notice period. The standard notice period is withdrawal_notice_days calendar days counted from the day the notice was received as day 0.
      The standard credit is the whole posted charge when the billing end falls before the first day of the charge's billing month and nothing otherwise, rounded to the nearest cent, half a cent rounding up.
      The credit's parts work together in one order: the parts that set a date come first and fix the billing end, the part that turns a date into a share of the month then sets the share credited, that share is then taken of the amount the credit is figured on, and the credit is rounded once at the end and never exceeds the charge.
      The notice-length schedule sets the notice period of the withdrawal notice on file at two_day_notice_days calendar days for a plan of two program days per week, at three_day_notice_days calendar days for a plan of three program days per week, and at withdrawal_notice_days calendar days for every other plan.
      The counting-day rule counts a notice received on a Saturday from saturday_shift_days days later, a notice received on a Sunday from sunday_shift_days day later, and a notice received on a weekday from the day it was received.
      The proration convention credits by the day when the student's district enrollment record for the enrollment's school year shows status withdrawn with a withdrawal date on or before the requested last day: one convention_month_days-th of the credit base for each day of the billing month after that date, the month counted as convention_month_days days; when that record shows no district withdrawal on or before the requested last day and the enrollment was withdrawn on the family's written notice, that is, it shows status withdrawn with no suspension date recorded and a withdrawal notice on file, it credits by the whole week: share_per_week_pct percent of the credit base for each whole week of seven days between the billing end and day convention_weeks_last_day of the billing month, and the whole credit base when the billing end falls before the first day of the billing month; in every other case, a student with no district enrollment record for the school year included, it credits as the standard credit does.
      The credit base is the family's share of the charge for an enrollment funded through Workforce Solutions Child Care Services: the charge less the board remittance posted for that billing month when one has posted, and the charge less the enrollment's most recent board remittance when none has posted for that month yet, the whole charge being the base when no board remittance has posted on the enrollment at all; for any other enrollment it is the whole charge.
    prerequisite: []
    cross_category:
      - category: enroll
        as: branch
        reads: [status, withdrawal_date, school_year]
        note: The proration convention reads whether the student's district enrollment record for the school year shows a district withdrawal.
    compute:
      - final_month: "LATEST('care_ledger', 'billing_month', date_field='posted_date', event_type='care_tuition_charge')"
      - final_charge: "SUM('care_ledger', 'amount', event_type='care_tuition_charge', billing_month=final_month) if final_month != None else 0"
      - month_first_day: "final_month + '-01' if final_month != None else NOW"
      - requested_last_day: "(LATEST('care_requests', 'requested_date', date_field='created_at', request_type='withdrawal_notice', request_status='completed') if (LATEST('care_requests', 'created_at', date_field='created_at', request_type='withdrawal_notice', request_status='completed') != None and (LATEST('care_requests', 'created_at', date_field='created_at', request_type='withdrawal_notice', request_status='received') == None or LATEST('care_requests', 'created_at', date_field='created_at', request_type='withdrawal_notice', request_status='completed') > LATEST('care_requests', 'created_at', date_field='created_at', request_type='withdrawal_notice', request_status='received'))) else LATEST('care_requests', 'requested_date', date_field='created_at', request_type='withdrawal_notice', request_status='received'))"
      - notice_received: "(LATEST('care_requests', 'created_at', date_field='created_at', request_type='withdrawal_notice', request_status='completed') if (LATEST('care_requests', 'created_at', date_field='created_at', request_type='withdrawal_notice', request_status='completed') != None and (LATEST('care_requests', 'created_at', date_field='created_at', request_type='withdrawal_notice', request_status='received') == None or LATEST('care_requests', 'created_at', date_field='created_at', request_type='withdrawal_notice', request_status='completed') > LATEST('care_requests', 'created_at', date_field='created_at', request_type='withdrawal_notice', request_status='received'))) else LATEST('care_requests', 'created_at', date_field='created_at', request_type='withdrawal_notice', request_status='received'))"
      - notice_on_file: "COUNT('care_requests', request_type='withdrawal_notice', request_status='received') + COUNT('care_requests', request_type='withdrawal_notice', request_status='completed')"
      - notice_length: "K('two_day_notice_days') if (P('days_per_week') == 2 and notice_on_file >= 1) else (K('three_day_notice_days') if (P('days_per_week') == 3 and notice_on_file >= 1) else P('withdrawal_notice_days'))"
      - notice_weekday: "DAYS(K('reference_monday'), notice_received) % 7 if notice_received != None else 0"
      - counting_shift: "K('saturday_shift_days') if notice_weekday == K('saturday_index') else (K('sunday_shift_days') if notice_weekday == K('sunday_index') else 0)"
      - district_status: "CFIELD('enroll', 'status', student_id=F('student_id'), school_year=F('school_year'))"
      - district_withdrawal_date: "CFIELD('enroll', 'withdrawal_date', student_id=F('student_id'), school_year=F('school_year'))"
      - conv_notice: "COUNT('care_requests', request_type='withdrawal_notice', request_status='received') + COUNT('care_requests', request_type='withdrawal_notice', request_status='completed')"
      - convention: "'daily' if (district_status == 'withdrawn' and district_withdrawal_date != None and district_withdrawal_date != '' and district_withdrawal_date <= requested_last_day) else ('weekly' if (F('status') == 'withdrawn' and F('suspended_date') == '' and conv_notice >= 1 and district_status != None and not (district_status == 'withdrawn' and district_withdrawal_date != None and district_withdrawal_date != '' and district_withdrawal_date <= requested_last_day)) else 'standard')"
      - ccs_funded: "F('subsidy_payer')"
      - month_remittance: "SUM('care_ledger', 'amount', event_type='care_subsidy_remittance', billing_month=final_month) if final_month != None else 0"
      - recent_remittance: "LATEST('care_ledger', 'amount', date_field='posted_date', event_type='care_subsidy_remittance')"
      - credit_base: "(final_charge - month_remittance) if (ccs_funded == 'workforce_solutions_ccs' and month_remittance > 0) else ((final_charge - (recent_remittance if recent_remittance != None else 0)) if (ccs_funded == 'workforce_solutions_ccs' and month_remittance == 0) else final_charge)"
      - billing_end_offset: "MX(DAYS(month_first_day, notice_received) + counting_shift + notice_length, DAYS(month_first_day, requested_last_day)) if (notice_received != None and requested_last_day != None) else 0"
      - daily_share: "MN(100, MX(0, K('convention_month_days') - (DAYS(month_first_day, district_withdrawal_date) + 1)) * 100 / K('convention_month_days')) if convention == 'daily' else 0"
      - weekly_share: "(K('whole_share_pct') if billing_end_offset < 0 else MN(K('whole_share_pct'), MX(0, (K('convention_weeks_last_day') - (billing_end_offset + 1)) // 7) * K('share_per_week_pct'))) if convention == 'weekly' else 0"
      - standard_share: "K('whole_share_pct') if billing_end_offset < 0 else 0"
      - credited_share: "daily_share if convention == 'daily' else (weekly_share if convention == 'weekly' else standard_share)"
      - result: "RND(MN(final_charge, MX(0, credit_base) * credited_share / 100) + 0.000000001, 2) if (final_month != None and requested_last_day != None) else 0"
    compute_basis:
      final_month: "the credit is posted with credit_reason notice_period_adjustment against the enrollment's most recently posted tuition charge, and only against that charge"
      final_charge: "against the enrollment's most recently posted tuition charge, and only against that charge"
      month_first_day: "when the billing end falls before the first day of the charge's billing month"
      requested_last_day: "using the enrollment's most recent withdrawal_notice request that is received or completed (latest by the time it was received; a declined or cancelled notice is never used), its requested last day and the date it was received as the notice date."
      notice_received: "using the enrollment's most recent withdrawal_notice request that is received or completed (latest by the time it was received; a declined or cancelled notice is never used), its requested last day and the date it was received as the notice date."
      notice_on_file: "The notice-length schedule sets the notice period of the withdrawal notice on file"
      notice_length: "The notice-length schedule sets the notice period of the withdrawal notice on file at two_day_notice_days calendar days for a plan of two program days per week, at three_day_notice_days calendar days for a plan of three program days per week, and at withdrawal_notice_days calendar days for every other plan."
      notice_weekday: "The counting-day rule counts a notice received on a Saturday from saturday_shift_days days later"
      counting_shift: "The counting-day rule counts a notice received on a Saturday from saturday_shift_days days later, a notice received on a Sunday from sunday_shift_days day later, and a notice received on a weekday from the day it was received."
      district_status: "when the student's district enrollment record for the enrollment's school year shows status withdrawn with a withdrawal date on or before the requested last day"
      district_withdrawal_date: "when the student's district enrollment record for the enrollment's school year shows status withdrawn with a withdrawal date on or before the requested last day"
      conv_notice: "it shows status withdrawn with no suspension date recorded and a withdrawal notice on file"
      convention: "The proration convention credits by the day when the student's district enrollment record for the enrollment's school year shows status withdrawn with a withdrawal date on or before the requested last day"
      ccs_funded: "The credit base is the family's share of the charge for an enrollment funded through Workforce Solutions Child Care Services"
      month_remittance: "the charge less the board remittance posted for that billing month when one has posted"
      recent_remittance: "the charge less the enrollment's most recent board remittance when none has posted for that month yet"
      credit_base: "The credit base is the family's share of the charge for an enrollment funded through Workforce Solutions Child Care Services: the charge less the board remittance posted for that billing month when one has posted, and the charge less the enrollment's most recent board remittance when none has posted for that month yet, the whole charge being the base when no board remittance has posted on the enrollment at all; for any other enrollment it is the whole charge."
      billing_end_offset: "The billing end is the later of the requested last day and the last day of the notice period."
      daily_share: "one convention_month_days-th of the credit base for each day of the billing month after that date, the month counted as convention_month_days days"
      weekly_share: "when that record shows no district withdrawal on or before the requested last day and the enrollment was withdrawn on the family's written notice, that is, it shows status withdrawn with no suspension date recorded and a withdrawal notice on file, it credits by the whole week: share_per_week_pct percent of the credit base for each whole week of seven days between the billing end and day convention_weeks_last_day of the billing month, and the whole credit base when the billing end falls before the first day of the billing month"
      standard_share: "The standard credit is the whole posted charge when the billing end falls before the first day of the charge's billing month and nothing otherwise"
      credited_share: "the part that turns a date into a share of the month then sets the share credited"
      result: "that share is then taken of the amount the credit is figured on, and the credit is rounded once at the end and never exceeds the charge."
    factors:
      - id: withdrawal_proration_convention
        effect: method
        decides: convention
        bindings: [district_status, district_withdrawal_date, conv_notice, convention]
        ladder:
          - when: "the student's district enrollment record for the school year shows status withdrawn with a withdrawal date on or before the requested last day"
            method: "the month is credited by the day after the district withdrawal date, the month counted as convention_month_days days"
          - when: "that record shows no district withdrawal on or before the requested last day and the enrollment shows status withdrawn with no suspension date recorded and a withdrawal notice on file"
            method: "the month is credited by the whole week after the billing end"
          - when: "every other case"
            method: "the month is credited as the standard credit does, in full only when the billing end falls before it"
        baseline:
          convention: "'standard'"
        evidence: [cross_category, date]
        cross_difficulty: enroll
      - id: plan_notice_length
        effect: parameter
        decides: notice_length
        bindings: [notice_on_file, notice_length]
        ladder:
          - when: "a withdrawal notice is on file and the plan covers two program days per week"
            value: "K('two_day_notice_days')"
          - when: "a withdrawal notice is on file and the plan covers three program days per week"
            value: "K('three_day_notice_days')"
          - when: "every other plan"
            value: "P('withdrawal_notice_days')"
        baseline:
          notice_length: "P('withdrawal_notice_days')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: notice_counting_day
        effect: parameter
        decides: counting_shift
        bindings: [notice_weekday, counting_shift]
        ladder:
          - when: "the notice was received on a Saturday"
            value: "K('saturday_shift_days')"
          - when: "the notice was received on a Sunday"
            value: "K('sunday_shift_days')"
          - when: "the notice was received on a weekday"
            value: "0"
        baseline:
          counting_shift: "0"
        evidence: [date]
        cross_difficulty: null
      - id: subsidy_credit_base
        effect: parameter
        decides: credit_base
        bindings: [ccs_funded, month_remittance, recent_remittance, credit_base]
        ladder:
          - when: "the enrollment is funded through Workforce Solutions Child Care Services and a board remittance has posted for the final billed month"
            value: "the charge less that month's board remittance"
          - when: "it is so funded and no board remittance has posted for that month yet"
            value: "the charge less the enrollment's most recent board remittance, or the whole charge when no board remittance has posted on the enrollment at all"
          - when: "any other enrollment"
            value: "the whole charge"
        baseline:
          credit_base: "final_charge"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The billing end is the later of the requested last day and the last day of the notice period. The standard notice period is withdrawal_notice_days calendar days counted from the day the notice was received as day 0.
        The standard credit is the whole posted charge when the billing end falls before the first day of the charge's billing month and nothing otherwise, rounded to the nearest cent, half a cent rounding up.
      params: [withdrawal_notice_days]
    inputs:
      history:
        - {table: care_ledger, aggregate: sum, field: amount, filters: {event_type: care_tuition_charge}}
        - {table: care_ledger, aggregate: sum, field: amount, filters: {event_type: care_subsidy_remittance}}
        - {table: care_requests, aggregate: latest, field: requested_date, filters: {request_type: withdrawal_notice, request_status: received}}
        - {table: care_requests, aggregate: latest, field: requested_date, filters: {request_type: withdrawal_notice, request_status: completed}}
      cross_category: [enroll]
  - id: care_ext_prior_year_installment_payment
    base_policy_refs: [care_payments_and_returns, care_admission]
    overwrite:
      - base_policy: care_admission
        superseded_clause: >-
          Registration is not accepted while any of the household's Creek Kids Club enrollments from an earlier school year still carries a balance above zero.
        replaced_by: >-
          Registration is still not accepted while any of the household's Creek Kids Club enrollments from an earlier school year carries a balance above zero, except that an earlier-year enrollment on which the family has paid the first installment of an installment arrangement under this policy no longer blocks registration while the rest of its balance is being paid.
    trigger: on_request
    subject: [care_payment]
    computes: payment_amount
    target_tool: pay_prior_year_installment_d4311e53
    params:
      three_installments_from: 200.00
      two_installments_from: 25.00
      free_extra_installments: 2
      reduced_extra_installments: 1
      returned_months: 12
      minimum_installment: 25.00
      minimum_rule_below: 50.00
      current_school_year: "2026-27"
      nonresident_variant: "Non-Resident Transfer"
    rule: >-
      A household whose earlier-school-year Creek Kids Club enrollment still carries a balance may ask to settle it in installments; the family pays the first installment itself through the district's online payment portal or at the campus cashier, the support desk quoting the amount and never taking card details, and the payment posts to that earlier-year enrollment.
      Registration is still not accepted while any of the household's Creek Kids Club enrollments from an earlier school year carries a balance above zero, except that an earlier-year enrollment on which the family has paid the first installment of an installment arrangement under this policy no longer blocks registration while the rest of its balance is being paid.
      The first installment is not fixed until the enrollment's final billed month has been credited for the part of its tuition that the notice period does not reach.
      The arrangement works on the enrollment's open balance on the day of the payment: every charge posted on the enrollment less every payment, Workforce Solutions remittance and credit posted on it.
      The standard first installment is the whole open balance, the arrangement having one installment, rounded to the nearest cent, half a cent rounding up; nothing is due when the open balance is not above zero.
      The arrangement's terms work together in one order: the installment count is the number the term that sets a number gives, with the installments the terms that add installments give added and the installments the terms that take installments away give taken off, and never fewer than one; the term that sets how the first installment is worked out then acts on that count, the first installment never exceeds the open balance, and it is rounded once at the end.
      The arrangement's size scale sets three installments for an open balance of at least three_installments_from, two installments for an open balance of at least two_installments_from and less than three_installments_from, and one installment for a smaller open balance.
      The arrangement's hardship terms add free_extra_installments installments when the student's active meal account holds a status whose benefit level is free and whose effective date is on or before the day of the payment, reduced_extra_installments installment when it holds one whose benefit level is reduced and whose effective date is on or before that day, and none otherwise.
      The arrangement's returned-payment term takes away two installments when two or more family payments on the enrollment were returned by the bank, the return posting after the same day of the month returned_months months before the day of the payment (the last day of that month when it has no such day) and on or before the day of the payment, one installment when exactly one was, and none when none was.
      The arrangement's residence term looks at the student's district enrollment record for the 2026-27 school year: it takes away two installments when the student holds no such record in status enrolled, one installment when that record is a Non-Resident Transfer, and none when it is any other enrollment type.
      The arrangement's installment rule takes the late payment fee of the enrollment's final billed month in full in the first installment, together with an equal share of the rest of the open balance, when that month carries a late payment fee; it takes the larger of minimum_installment and an equal share of the open balance when that month carries no late payment fee and the open balance is less than minimum_rule_below; it takes an equal share of the open balance otherwise.
    prerequisite:
      - problem: care_ext_notice_period_credit
        kind: value_input
        gate: open_balance_now
        form: action
        policy_source: >-
          The first installment is not fixed until the enrollment's final billed month has been credited for the part of its tuition that the notice period does not reach.
        fallback_reason: >-
          The notice-period credit books an entry only when the proration convention leaves a share above zero; when the billing end falls late in the final month nothing is booked, so no state the records show tells a reader that the final month was checked.
        condition: >-
          The final billed month's tuition charge carries the notice_period_adjustment credit the notice-period rules book for it, or those rules have shown that none is owed.
        resolved_by: post_notice_period_credit_667047da
        effect: >-
          The notice-period credit lowers the open balance, which moves the size scale, the share divided over the installments and the cap on the first installment.
    cross_category:
      - category: meals
        as: branch
        reads: [benefit_level, benefit_effective_date]
        note: The hardship terms are read from the benefit level and effective date of the student's active meal account.
      - category: enroll
        as: branch
        reads: [variant_name, status, school_year]
        note: The residence term is read from the student's district enrollment record for the 2026-27 school year.
    compute:
      - charges_posted: "SUM('care_ledger', 'amount', event_type='care_registration_fee') + SUM('care_ledger', 'amount', event_type='care_tuition_charge') + SUM('care_ledger', 'amount', event_type='care_day_fee') + SUM('care_ledger', 'amount', event_type='care_late_pickup_fee') + SUM('care_ledger', 'amount', event_type='care_late_payment_fee') + SUM('care_ledger', 'amount', event_type='care_plan_change_fee') + SUM('care_ledger', 'amount', event_type='care_returned_payment') + SUM('care_ledger', 'amount', event_type='care_returned_payment_fee') + SUM('care_ledger', 'amount', event_type='care_refund')"
      - reductions_posted: "SUM('care_ledger', 'amount', event_type='care_payment') + SUM('care_ledger', 'amount', event_type='care_subsidy_remittance') + SUM('care_ledger', 'amount', event_type='care_credit')"
      - open_balance_now: "charges_posted - reductions_posted"
      - size_balance: "SUM('care_ledger', 'amount', event_type='care_tuition_charge') + SUM('care_ledger', 'amount', event_type='care_registration_fee') + SUM('care_ledger', 'amount', event_type='care_day_fee') + SUM('care_ledger', 'amount', event_type='care_late_pickup_fee') + SUM('care_ledger', 'amount', event_type='care_late_payment_fee') + SUM('care_ledger', 'amount', event_type='care_plan_change_fee') + SUM('care_ledger', 'amount', event_type='care_returned_payment') + SUM('care_ledger', 'amount', event_type='care_returned_payment_fee') + SUM('care_ledger', 'amount', event_type='care_refund') - SUM('care_ledger', 'amount', event_type='care_payment') - SUM('care_ledger', 'amount', event_type='care_subsidy_remittance') - SUM('care_ledger', 'amount', event_type='care_credit')"
      - size_installments: "3 if size_balance >= K('three_installments_from') else (2 if (size_balance >= K('two_installments_from') and size_balance < K('three_installments_from')) else 1)"
      - meal_level_now: "CPARAM('meals', 'benefit_level', student_id=F('student_id'), status='active')"
      - meal_effective_now: "CFIELD('meals', 'benefit_effective_date', student_id=F('student_id'), status='active')"
      - hardship_installments: "K('free_extra_installments') if (meal_level_now == 'free' and meal_effective_now != None and meal_effective_now <= NOW) else (K('reduced_extra_installments') if (meal_level_now == 'reduced' and meal_effective_now != None and meal_effective_now <= NOW) else 0)"
      - returned_recent: "COUNT('care_ledger', within_months=K('returned_months'), date_field='posted_date', event_type='care_returned_payment')"
      - returned_installments_off: "2 if returned_recent >= 2 else (1 if returned_recent == 1 else 0)"
      - current_district_type: "CFIELD('enroll', 'variant_name', student_id=F('student_id'), school_year=K('current_school_year'), status='enrolled')"
      - residence_installments_off: "2 if current_district_type == None else (1 if current_district_type == K('nonresident_variant') else 0)"
      - installment_count: "MX(1, size_installments + hardship_installments - returned_installments_off - residence_installments_off)"
      - final_month: "LATEST('care_ledger', 'billing_month', date_field='posted_date', event_type='care_tuition_charge')"
      - month_late_fee: "SUM('care_ledger', 'amount', event_type='care_late_payment_fee', billing_month=final_month) if final_month != None else 0"
      - rule_balance: "SUM('care_ledger', 'amount', event_type='care_tuition_charge') + SUM('care_ledger', 'amount', event_type='care_late_payment_fee') + SUM('care_ledger', 'amount', event_type='care_registration_fee') + SUM('care_ledger', 'amount', event_type='care_day_fee') + SUM('care_ledger', 'amount', event_type='care_late_pickup_fee') + SUM('care_ledger', 'amount', event_type='care_plan_change_fee') + SUM('care_ledger', 'amount', event_type='care_returned_payment') + SUM('care_ledger', 'amount', event_type='care_returned_payment_fee') + SUM('care_ledger', 'amount', event_type='care_refund') - SUM('care_ledger', 'amount', event_type='care_payment') - SUM('care_ledger', 'amount', event_type='care_subsidy_remittance') - SUM('care_ledger', 'amount', event_type='care_credit')"
      - installment_rule: "'fee_first' if month_late_fee > 0 else ('minimum' if rule_balance < K('minimum_rule_below') else 'equal')"
      - first_installment: "(month_late_fee + (open_balance_now - month_late_fee) / installment_count) if installment_rule == 'fee_first' else (MX(K('minimum_installment'), open_balance_now / installment_count) if installment_rule == 'minimum' else open_balance_now / installment_count)"
      - result: "RND(MN(open_balance_now, first_installment) + 0.000000001, 2) if open_balance_now > 0 else 0"
    compute_basis:
      charges_posted: "every charge posted on the enrollment"
      reductions_posted: "less every payment, Workforce Solutions remittance and credit posted on it."
      open_balance_now: "The arrangement works on the enrollment's open balance on the day of the payment: every charge posted on the enrollment less every payment, Workforce Solutions remittance and credit posted on it."
      size_balance: "The arrangement's size scale sets three installments for an open balance of at least three_installments_from"
      size_installments: "The arrangement's size scale sets three installments for an open balance of at least three_installments_from, two installments for an open balance of at least two_installments_from and less than three_installments_from, and one installment for a smaller open balance."
      meal_level_now: "when the student's active meal account holds a status whose benefit level is free and whose effective date is on or before the day of the payment"
      meal_effective_now: "when the student's active meal account holds a status whose benefit level is free and whose effective date is on or before the day of the payment"
      hardship_installments: "The arrangement's hardship terms add free_extra_installments installments when the student's active meal account holds a status whose benefit level is free and whose effective date is on or before the day of the payment, reduced_extra_installments installment when it holds one whose benefit level is reduced and whose effective date is on or before that day, and none otherwise."
      returned_recent: "when two or more family payments on the enrollment were returned by the bank, the return posting after the same day of the month returned_months months before the day of the payment (the last day of that month when it has no such day) and on or before the day of the payment"
      returned_installments_off: "The arrangement's returned-payment term takes away two installments when two or more family payments on the enrollment were returned by the bank, the return posting after the same day of the month returned_months months before the day of the payment (the last day of that month when it has no such day) and on or before the day of the payment, one installment when exactly one was, and none when none was."
      current_district_type: "The arrangement's residence term looks at the student's district enrollment record for the 2026-27 school year"
      residence_installments_off: "it takes away two installments when the student holds no such record in status enrolled, one installment when that record is a Non-Resident Transfer, and none when it is any other enrollment type."
      installment_count: "the installment count is the number the term that sets a number gives, with the installments the terms that add installments give added and the installments the terms that take installments away give taken off, and never fewer than one"
      final_month: "The arrangement's installment rule takes the late payment fee of the enrollment's final billed month in full in the first installment"
      month_late_fee: "when that month carries a late payment fee"
      rule_balance: "when that month carries no late payment fee and the open balance is less than minimum_rule_below"
      installment_rule: "The arrangement's installment rule takes the late payment fee of the enrollment's final billed month in full in the first installment, together with an equal share of the rest of the open balance, when that month carries a late payment fee; it takes the larger of minimum_installment and an equal share of the open balance when that month carries no late payment fee and the open balance is less than minimum_rule_below; it takes an equal share of the open balance otherwise."
      first_installment: "the term that sets how the first installment is worked out then acts on that count"
      result: "the first installment never exceeds the open balance, and it is rounded once at the end."
    factors:
      - id: arrangement_size_scale
        effect: parameter
        decides: size_installments
        bindings: [size_balance, size_installments]
        ladder:
          - when: "the open balance is at least three_installments_from"
            value: "3"
          - when: "it is at least two_installments_from and less than three_installments_from"
            value: "2"
          - when: "it is smaller"
            value: "1"
        baseline:
          size_installments: "1"
        evidence: [history]
        cross_difficulty: null
      - id: arrangement_hardship_terms
        effect: parameter
        decides: hardship_installments
        bindings: [meal_level_now, meal_effective_now, hardship_installments]
        ladder:
          - when: "the student's active meal account holds a status whose benefit level is free and whose effective date is on or before the day of the payment"
            value: "K('free_extra_installments')"
          - when: "it holds one whose benefit level is reduced and whose effective date is on or before that day"
            value: "K('reduced_extra_installments')"
          - when: "otherwise"
            value: "0"
        baseline:
          hardship_installments: "0"
        evidence: [cross_category, date]
        cross_difficulty: meals
      - id: arrangement_returned_payment_term
        effect: parameter
        decides: returned_installments_off
        bindings: [returned_recent, returned_installments_off]
        ladder:
          - when: "two or more family payments on the enrollment were returned by the bank, the return posting after the same day of the month returned_months months before the day of the payment (the last day of that month when it has no such day) and on or before the day of the payment"
            value: "2"
          - when: "exactly one was"
            value: "1"
          - when: "none was"
            value: "0"
        baseline:
          returned_installments_off: "0"
        evidence: [history]
        cross_difficulty: null
      - id: arrangement_residence_term
        effect: parameter
        decides: residence_installments_off
        bindings: [current_district_type, residence_installments_off]
        ladder:
          - when: "the student holds no district enrollment record for the 2026-27 school year in status enrolled"
            value: "2"
          - when: "that record is a Non-Resident Transfer"
            value: "1"
          - when: "it is any other enrollment type"
            value: "0"
        baseline:
          residence_installments_off: "0"
        evidence: [cross_category]
        cross_difficulty: enroll
      - id: arrangement_installment_rule
        effect: method
        decides: installment_rule
        bindings: [final_month, month_late_fee, rule_balance, installment_rule]
        ladder:
          - when: "the enrollment's final billed month carries a late payment fee"
            method: "that late payment fee is taken in full together with an equal share of the rest of the open balance"
          - when: "that month carries no late payment fee and the open balance is less than minimum_rule_below"
            method: "the larger of minimum_installment and an equal share of the open balance is taken"
          - when: "otherwise"
            method: "an equal share of the open balance is taken"
        baseline:
          installment_rule: "'equal'"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The arrangement works on the enrollment's open balance on the day of the payment: every charge posted on the enrollment less every payment, Workforce Solutions remittance and credit posted on it.
        The standard first installment is the whole open balance, the arrangement having one installment, rounded to the nearest cent, half a cent rounding up; nothing is due when the open balance is not above zero.
      params: []
    inputs:
      history:
        - {table: care_ledger, aggregate: sum, field: amount, filters: {}}
        - {table: care_ledger, aggregate: count, field: care_ledger_id, within_months: 12, filters: {event_type: care_returned_payment}}
      cross_category: [meals, enroll]
