# Extended Day before- and after-school care (Creek Kids Club) — Calloway Creek ISD.
category: care
display_name: Creek Kids Club Extended Day Program

binding:
  holding_table: care_enrollments
  event_tables: [care_ledger, care_attendance_log]
  intake_tables: [care_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [registered, waitlisted, active, suspended_nonpayment, withdrawn, dismissed, ended]
  transitions:
    - {from: registered, to: active, by: agent, means: "The seat is confirmed once the registration fee for this enrollment is paid in full or waived, and care starts on the enrollment start_date."}
    - {from: registered, to: waitlisted, by: system, means: "The chosen plan at the campus is at capacity on the registration date, so the registration joins the campus waitlist in registration_date order."}
    - {from: waitlisted, to: active, by: user, means: "The family accepts an offered seat within the offer response window, which commits the household to the plan's tuition."}
    - {from: waitlisted, to: withdrawn, by: system, means: "A waitlist entry is released because the family declined the offered seat or let the response window lapse."}
    - {from: active, to: suspended_nonpayment, by: system, means: "Care is suspended because a tuition balance remains unpaid past the suspension point."}
    - {from: suspended_nonpayment, to: active, by: agent, means: "Care resumes once the full past-due balance on the enrollment has been paid."}
    - {from: suspended_nonpayment, to: withdrawn, by: system, means: "A suspended enrollment that is still unpaid at the nonpayment withdrawal point is withdrawn by the program office."}
    - {from: active, to: withdrawn, by: user, means: "The family withdraws the student from the program by written notice; the last day of care is the notice's effective date."}
    - {from: active, to: dismissed, by: system, means: "The program director dismisses the student after the late-pickup dismissal threshold is reached within a semester."}
    - {from: active, to: ended, by: system, means: "Care ends because the school year closed or the student left the district (district withdrawal recorded on the enrollment record)."}

accounts:
  - key: care_balance_due
    unit: USD
    meaning: "Amount the household owes on one Extended Day enrollment; charges (registration fee, tuition, day fees, late fees, returned payments, refunds disbursed) increase it and payments, Workforce Solutions remittances and credits decrease it; a negative value is a credit balance owed to the family."

parameter_schema:
  monthly_tuition: "Standard monthly tuition before any rate-basis or sibling discount, USD per billing month (August through May)."
  session_coverage: "Which care session the plan covers; enum before_school | after_school | before_and_after."
  days_per_week: "Number of program days per school week the plan covers; integer."
  eligible_grades: "Grade levels admitted to the plan, list of grade codes as recorded on the district enrollment record (PK3, PK4, KG, 01-05)."
  offered_campuses: "Campuses where the plan operates; list of official campus names."
  before_care_start_time: "Time before-school care opens, HH:MM 24-hour clock, or not_offered when the plan has no before-school session."
  after_care_end_time: "Time after-school care closes and pickup is due, HH:MM 24-hour clock, or not_offered when the plan has no after-school session."
  registration_fee_per_child: "Nonrefundable annual registration fee charged per enrolled child per school year, USD."
  registration_fee_household_cap: "Maximum total registration fees charged to one household per school year, USD."
  registration_fee_waived_for_free_meal_status: "Whether the registration fee is waived for a student whose School Nutrition meal status is any Free Meal Status tier on the registration date; boolean."
  free_meal_rate_discount_pct: "Tuition discount for a student holding any Free Meal Status tier on the tuition posting date, percent of monthly tuition."
  reduced_meal_rate_discount_pct: "Tuition discount for a student holding a Reduced-Price Meal Status tier on the tuition posting date, percent of monthly tuition."
  employee_rate_discount_pct: "Tuition discount for a household whose profile is flagged as a district employee household, percent of monthly tuition."
  second_child_sibling_discount_pct: "Sibling discount on the tuition of the household's second concurrently billed child, percent."
  third_plus_child_sibling_discount_pct: "Sibling discount on the tuition of each third or later concurrently billed child, percent."
  sibling_discount_with_subsidy: "Whether the sibling discount applies to an enrollment funded through Workforce Solutions Child Care Services; boolean."
  half_month_start_day: "Day of the month on or after which a new enrollment's first month is billed at the half-month rate; integer day 1-31."
  half_month_rate_pct: "Share of monthly tuition billed for a first month that starts on or after half_month_start_day, percent."
  tuition_posting_day: "Day of each billing month on which the month's tuition posts to the enrollment; integer."
  tuition_due_day: "Day of each billing month by which that month's tuition must be paid; integer."
  late_payment_fee: "Fee posted once per billing month when that month's tuition is not paid in full by the due day, USD."
  late_payment_fee_offset_days: "Calendar days after the due day on which the late payment fee posts; integer."
  late_fee_courtesy_waivers_per_year: "Number of late payment fees per enrollment per school year that are credited back as a courtesy on request; integer."
  suspension_days_past_due: "Calendar days after the due day after which an enrollment with tuition still unpaid is suspended; integer."
  suspension_minimum_past_due: "Minimum past-due amount that triggers suspension, USD."
  nonpayment_withdrawal_days: "Calendar days after the suspension date after which a still-unpaid suspended enrollment is withdrawn; integer."
  reinstatement_requires_full_balance: "Whether a suspended enrollment resumes only after the entire past-due balance is paid; boolean."
  prior_year_balance_blocks_registration: "Whether an unpaid balance on any of the household's prior-school-year Extended Day enrollments blocks a new registration; boolean."
  withdrawal_notice_days: "Minimum calendar days between the family's written withdrawal notice and the requested last day of care; integer."
  billing_after_short_notice: "How tuition is billed when the withdrawal notice is shorter than the notice period; enum bill_through_notice_period."
  plan_change_request_cutoff_day: "Last day of a month on which a plan change request takes effect on the first day of the next month; later requests take effect a month after that; integer."
  plan_change_fee: "Processing fee per approved plan change, USD."
  plan_changes_per_semester: "Maximum plan changes per enrollment per semester; integer."
  drop_in_days_allowed: "Whether the plan may book additional drop-in days beyond its scheduled weekdays; boolean."
  drop_in_day_fee: "Fee per booked drop-in day, USD."
  drop_in_days_monthly_cap: "Maximum drop-in days per enrollment per calendar month; integer."
  drop_in_booking_lead_days: "Minimum calendar days before the service date by which a drop-in day must be booked; integer."
  holiday_camp_access: "Whether the plan may book district holiday camp days (student holidays on which the campus program runs at a hub site); boolean."
  holiday_camp_day_fee: "Fee per booked holiday camp day, USD."
  early_release_included: "Whether early-release afternoons are covered by monthly tuition without a day fee; boolean."
  early_release_day_fee: "Fee per early-release afternoon when not included in the plan, USD."
  late_pickup_grace_minutes: "Minutes after the close time before a pickup counts as late; integer."
  late_pickup_fee_per_minute: "Late pickup fee per minute counted from the close time once the grace period is exceeded, USD per minute."
  late_pickup_first_incident_waived: "Whether the first late pickup of each semester is recorded without a fee; boolean."
  late_pickup_warning_threshold: "Number of late pickups in a semester at which a written warning is issued; integer."
  late_pickup_dismissal_threshold: "Number of late pickups in a semester at which the student is dismissed from the program; integer."
  returned_payment_fee: "Fee for each payment returned unpaid by the bank, USD."
  returned_payments_before_certified_funds: "Number of returned payments within the lookback period after which the household must pay by money order or card only; integer."
  certified_funds_lookback_months: "Lookback period for counting returned payments, calendar months."
  accepted_payment_methods: "Payment methods the program accepts from families; list of enum values online_card | ach_bank_draft | personal_check | money_order."
  waitlist_offer_response_days: "Calendar days, counted from the offer date, a family has to accept an offered seat before the waitlist entry is released; integer."
  subsidy_accepted: "Whether the plan accepts Workforce Solutions Child Care Services (CCS) funding; boolean."
  subsidy_billing_basis: "How a CCS-funded enrollment is billed; enum standard_rate_less_board_remittance (the standard monthly tuition is charged and the board remittance posts against it)."
  credit_balance_refund_days: "Calendar days after withdrawal within which a credit balance is refunded to the family; integer."

