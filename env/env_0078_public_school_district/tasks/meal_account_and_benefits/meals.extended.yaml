    q_left_end: through the last day of that month on which that calendar serves meals
    q_left_span: the weekdays after the quote date through the last day of that month on which that calendar serves meals
    q_left_weekday: the weekdays after the quote date
    q_left_weekdays: the weekdays after the quote date
    q_left_closed: less the calendar's closures that fall among them
    q_days_left: The serving days the quote counts left in the month of the quote date are the weekdays after the quote date
      through the last day of that month on which that calendar serves meals, less the calendar's closures that fall among
      them; a quote date before August 12, 2026 counts from August 12, 2026, and a quote date in July 2026 or after May 27,
