  - n_day_charge: n_lunch_charge + n_milk_rate + n_second_rate
  - n_keep: n_serving_days * n_day_charge + n_milk_once + n_second_once
  - n_free: n_balance - n_keep - n_card_hold
  - result: RND(MX(0, n_free) + 0.000000001, 2)
