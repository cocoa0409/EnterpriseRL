    - enroll
- id: meals_ext_departure_rollover
  base_policy_refs:
  - meals_refunds_and_transfers
  - meals_meal_pricing
  - meals_unpaid_meal_charges
  overwrite: []
  trigger: on_request
  subject:
  - meals_transfer_out
  - meals_transfer_in
  computes: amount
  target_tool: transfer_departure_rollover_b6d76228
  params: *id003
  rule: 'When a student has left the district for another state or country, as the leaver reason moved_out_of_state or returned_to_home_country
    on the student''s enrollment record in status withdrawn shows, the positive balance on the student''s inactive meal account
    is moved by sibling transfer to the household''s youngest active student whose account''s campus is not listed in cep_campuses,
    whose reimbursable meals are charged, for the purpose the household states when it agrees: to pay for that student''s
    meals and the items the student buys on their own from the day after the rollover date through the end of the calendar
    month after it, snacks included; when every active student''s account is at a campus listed in cep_campuses, the departed
    balance stays on the account for the household''s refund request; a household that asks instead for a refund check is
    refunded under the refund rules, and a departure for any other leaver reason is not rolled over this way. The departure
    rollover amount is worked out on the receiving account''s own records, and a departure rollover is owed and made only
    from a departed balance at least that amount; when the departed balance is smaller, no departure rollover is owed from
    it, and whatever a departure rollover does not move stays on the departed account for the household''s refund request.
    The departure rollover amount is fixed only after every graduate rollover owed to the receiving account has been made.
    The standard departure rollover amount funds twenty serving days (days_standard), a full school month, of one reimbursable
    lunch at the lunch charge the departure rollover counts, with nothing else added, less the account''s balance, so a negative
    balance adds its unpaid meal charges to the departure rollover. The receiving account''s balance for the departure rollover
    is its deposits, voids and transfers in less its purchases, refunds, transfers out and returned deposits, as they stand
    when the departure rollover is made. A date falls within the N months before the rollover date when fewer than N whole
    calendar months separate it from the rollover date, a whole month being reached on the same day of a later month or, when
    that later month has no such day, on the first day of the month after it. The district''s 2026-27 calendar serves meals
    on every weekday from August 12, 2026 through May 27, 2027, except Labor Day (September 7), October 12, the Thanksgiving
    week (November 23 through 27), the winter break (December 21 through January 1), January 18, February 15, the spring break
    (March 15 through 19) and March 26, and it serves no meals in June or July. The lunch charge the departure rollover counts
    is the student''s charge under the district''s meal pricing at the account''s campus: the secondary lunch charge of the
    student''s meal status at Ridgecrest Middle School, Calloway Creek High School or Mesquite Ridge High School, and the
    elementary lunch charge of the status at any other campus not listed in cep_campuses. The serving days the departure rollover
    funds run from the day after the rollover date through the end of the calendar month after it: the serving days left in
    the month of the rollover date together with the serving days of the calendar month after it. The serving days the departure
    rollover funds left in the month of the rollover date are the weekdays after the rollover date through the last day of
    that month on which that calendar serves meals, less the calendar''s closures that fall among them; a rollover date before
    August 12, 2026 counts from August 12, 2026, and a rollover date in July 2026 or after May 27, 2027 leaves none. The serving
    days the departure rollover funds of the calendar month after the rollover date on that calendar are fourteen (days_after_july)
    for a rollover date in July 2026, twenty-one (days_after_august_september) for one in August or September, sixteen (days_after_october)
    in October, fourteen (days_after_november) in November, nineteen (days_after_december_january) in December or January,
    seventeen (days_after_february) in February, twenty-two (days_after_march) in March, nineteen (days_after_april) in April,
    and none in May or June 2027; for a rollover date outside July 2026 through June 2027 they are the standard twenty (days_standard).
    The departure rollover adds a reimbursable breakfast to each serving day when a reimbursable breakfast was rung up on
    the account in the month before the rollover date: the secondary breakfast charge of the student''s meal status when the
    account''s campus is Ridgecrest Middle School, Calloway Creek High School or Mesquite Ridge High School; the elementary
    breakfast charge of the status when it is any other campus not listed in cep_campuses; nothing when no breakfast was rung
    up in that month or the account''s campus is listed in cep_campuses, where breakfast is served at no charge. The departure
    rollover counts milk bought on its own by how many times it was rung up on the account in the month before the rollover
    date: four (regular_buys) or more purchases make a regular buyer, and the milk-only price is added to every serving day
    counted; one to three purchases add once what the student spent on it in that month; no purchase adds nothing. The departure
    rollover counts a second meal by how many times it was rung up on the account in the month before the rollover date: four
    (regular_buys) or more purchases make a regular buyer, and the second-meal price is added to every serving day counted;
    one to three purchases add once what the student spent on it in that month; no purchase adds nothing. The departure rollover
    counts the snacks the student buys: when a la carte items were rung up on the account in the month before the rollover
    date, what was spent on them in that month is added; when none were rung up in that month but some were in the month before
    it, what was spent on them in that earlier month is added; otherwise nothing is added. The adjustments described in the
    schedules are applied to the standard departure rollover in this order: first everything the schedules charge per serving
    day is added together into the day charge; then the day charge is multiplied by the serving days the schedules count and
    every amount the schedules add once is added; then the receiving account''s balance is subtracted. The departure rollover
    amount is that total, never below nothing, rounded half up to the cent once, at the end; a departure rollover of zero
    moves nothing.'
  prerequisite:
  - problem: meals_ext_graduate_rollover
    kind: value_input
    gate: w_balance
    form: action
    policy_source: The departure rollover amount is fixed only after every graduate rollover owed to the receiving account
      has been made.
    fallback_reason: A graduate rollover lands on the receiving account as a sibling transfer in, which looks the same as
      any sibling transfer the household asked for, and no rollover is owed when the graduate balance is smaller than the
      rollover amount, so no record of the receiving account singles out that it has been made; the sentence names the action.
    condition: When a graduate's inactive account of the household owes a rollover to the receiving account, the receiving
      account carries a transfer in from it dated the rollover date for the rollover amount the receiving account's records
      give.
    resolved_by: transfer_graduate_rollover_43099774
    effect: The graduate rollover raises the receiving account's balance, which lowers the departure rollover by the same
      amount.
