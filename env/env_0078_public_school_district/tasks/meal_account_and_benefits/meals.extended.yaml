  compute:
  - n_bal_in: SUM('meal_transactions','amount', event_type='meals_deposit') + SUM('meal_transactions','amount', event_type='meals_purchase_void')
      + SUM('meal_transactions','amount', event_type='meals_transfer_in')
  - n_bal_out: SUM('meal_transactions','amount', event_type='meals_purchase') + SUM('meal_transactions','amount', event_type='meals_refund')
      + SUM('meal_transactions','amount', event_type='meals_transfer_out') + SUM('meal_transactions','amount', event_type='meals_returned_deposit')
  - n_balance: n_bal_in - n_bal_out
  - n_left_month_index: MONTHS('2026-07-01', NOW)
  - n_left_start: '''2026-08-11'' if NOW < ''2026-08-11'' else NOW'
  - n_left_end: ('2026-08-31' if n_left_month_index == 1 else ('2026-09-30' if n_left_month_index == 2 else ('2026-10-31'
      if n_left_month_index == 3 else ('2026-11-30' if n_left_month_index == 4 else ('2026-12-31' if n_left_month_index ==
      5 else ('2027-01-31' if n_left_month_index == 6 else ('2027-02-28' if n_left_month_index == 7 else ('2027-03-31' if
      n_left_month_index == 8 else ('2027-04-30' if n_left_month_index == 9 else ('2027-05-27' if n_left_month_index == 10
      else ''))))))))))
  - n_left_span: DAYS(n_left_start, n_left_end) if (n_left_month_index >= 1 and n_left_month_index <= 10 and n_left_start
      <= n_left_end) else 0
  - n_left_weekday: DAYS('2026-08-03', n_left_start) % 7
  - n_left_weekdays: (n_left_span // 7) * 5 + (1 if (n_left_span % 7 >= 1 and (n_left_weekday + 1) % 7 < 5) else 0) + (1 if
      (n_left_span % 7 >= 2 and (n_left_weekday + 2) % 7 < 5) else 0) + (1 if (n_left_span % 7 >= 3 and (n_left_weekday +
      3) % 7 < 5) else 0) + (1 if (n_left_span % 7 >= 4 and (n_left_weekday + 4) % 7 < 5) else 0) + (1 if (n_left_span % 7
      >= 5 and (n_left_weekday + 5) % 7 < 5) else 0) + (1 if (n_left_span % 7 >= 6 and (n_left_weekday + 6) % 7 < 5) else
      0)
  - n_left_closed: ((1 if (n_left_start < '2026-09-07' and '2026-09-07' <= n_left_end) else 0) + (1 if (n_left_start < '2026-10-12'
      and '2026-10-12' <= n_left_end) else 0) + (1 if (n_left_start < '2026-11-23' and '2026-11-23' <= n_left_end) else 0)
      + (1 if (n_left_start < '2026-11-24' and '2026-11-24' <= n_left_end) else 0) + (1 if (n_left_start < '2026-11-25' and
      '2026-11-25' <= n_left_end) else 0) + (1 if (n_left_start < '2026-11-26' and '2026-11-26' <= n_left_end) else 0) + (1
      if (n_left_start < '2026-11-27' and '2026-11-27' <= n_left_end) else 0) + (1 if (n_left_start < '2026-12-21' and '2026-12-21'
      <= n_left_end) else 0) + (1 if (n_left_start < '2026-12-22' and '2026-12-22' <= n_left_end) else 0) + (1 if (n_left_start
      < '2026-12-23' and '2026-12-23' <= n_left_end) else 0) + (1 if (n_left_start < '2026-12-24' and '2026-12-24' <= n_left_end)
      else 0) + (1 if (n_left_start < '2026-12-25' and '2026-12-25' <= n_left_end) else 0) + (1 if (n_left_start < '2026-12-28'
      and '2026-12-28' <= n_left_end) else 0) + (1 if (n_left_start < '2026-12-29' and '2026-12-29' <= n_left_end) else 0)
      + (1 if (n_left_start < '2026-12-30' and '2026-12-30' <= n_left_end) else 0) + (1 if (n_left_start < '2026-12-31' and
      '2026-12-31' <= n_left_end) else 0) + (1 if (n_left_start < '2027-01-01' and '2027-01-01' <= n_left_end) else 0) + (1
      if (n_left_start < '2027-01-18' and '2027-01-18' <= n_left_end) else 0) + (1 if (n_left_start < '2027-02-15' and '2027-02-15'
      <= n_left_end) else 0) + (1 if (n_left_start < '2027-03-15' and '2027-03-15' <= n_left_end) else 0) + (1 if (n_left_start
      < '2027-03-16' and '2027-03-16' <= n_left_end) else 0) + (1 if (n_left_start < '2027-03-17' and '2027-03-17' <= n_left_end)
      else 0) + (1 if (n_left_start < '2027-03-18' and '2027-03-18' <= n_left_end) else 0) + (1 if (n_left_start < '2027-03-19'
      and '2027-03-19' <= n_left_end) else 0) + (1 if (n_left_start < '2027-03-26' and '2027-03-26' <= n_left_end) else 0))
      if n_left_span > 0 else 0
  - n_days_left: MX(0, n_left_weekdays - n_left_closed) if (n_left_month_index >= 1 and n_left_month_index <= 10) else 0
  - n_next_month_index: MONTHS('2026-07-01', NOW)
  - n_days_next: K('days_after_july') if n_next_month_index == 0 else (K('days_after_august_september') if (n_next_month_index
      == 1 or n_next_month_index == 2) else (K('days_after_october') if n_next_month_index == 3 else (K('days_after_november')
      if n_next_month_index == 4 else (K('days_after_december_january') if (n_next_month_index == 5 or n_next_month_index
      == 6) else (K('days_after_february') if n_next_month_index == 7 else (K('days_after_march') if n_next_month_index ==
      8 else (K('days_after_april') if n_next_month_index == 9 else (0 if (n_next_month_index == 10 or n_next_month_index
      == 11) else K('days_standard')))))))))
  - n_serving_days: n_days_left + n_days_next
  - n_enroll_campus: CFIELD('enroll','campus', student_id=F('student_id'), status='enrolled')
  - n_lunch_charge: P('cep_meal_charge') if (n_enroll_campus == 'Cypress Hollow Elementary' or n_enroll_campus == 'Pecan Grove
      Elementary' or n_enroll_campus == 'Hollis Middle School') else (P('lunch_charge_secondary') if (n_enroll_campus == 'Ridgecrest
      Middle School' or n_enroll_campus == 'Calloway Creek High School' or n_enroll_campus == 'Mesquite Ridge High School')
      else P('lunch_charge_elementary'))
  - n_milk_days: COUNT('meal_transactions', within_months=1, date_field='transaction_date', event_type='meals_purchase', meal_type='milk_only')
