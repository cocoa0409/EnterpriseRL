    rule: The standard cover amount funds five serving days (days_week), a school week, of one reimbursable lunch at the elementary
      lunch charge of the student's meal status, with nothing else added, less the receiving account's balance, so a negative
      balance adds its unpaid meal charges to the cover. The receiving account's balance for the cover is its deposits, voids
      and transfers in less its purchases, refunds, transfers out and returned deposits, as they stand when the cover is made.
