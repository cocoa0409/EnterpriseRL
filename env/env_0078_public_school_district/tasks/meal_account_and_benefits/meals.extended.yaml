- id: meals_ext_inactive_repayment
  base_policy_refs:
  - meals_deposits_and_returns
  - meals_unpaid_meal_charges
  overwrite: []
  trigger: on_request
  subject:
  - meals_deposit
  computes: amount
  target_tool: pay_inactive_meal_installment_c0dba3e7
  params:
    plan_large: 20.0
    plan_small: 5.0
    installments_three: 3
    installments_two: 2
    installments_one: 1
    household_three_more: 2
    household_two_more: 1
    calendar_early: 1
    calendar_late: -1
    recent_payment: 1
    stale_payment: -1
    recent_days: 30
    stale_days: 60
  rule: 'A household that owes unpaid meal charges on an inactive meal account repays them under the district''s unpaid meal
    charge repayment plan, and each repayment payment is the parent''s own act: the parent pays it personally through the
    district''s online payment portal, because district staff never take card numbers; School Nutrition quotes the payment
    due on the day of the quote, and no fee, interest or penalty is ever added. The standard repayment payment is the inactive
    account''s unpaid meal charges in full, in a single payment, that is the amount by which the account''s balance is below
    zero. The inactive account''s balance for the repayment is its deposits, voids and transfers in less its purchases, refunds,
    transfers out and returned deposits, as they stand when the payment is quoted. A date falls within the N months before
    the quote date when fewer than N whole calendar months separate it from the quote date, a whole month being reached on
    the same day of a later month or, when that later month has no such day, on the first day of the month after it. The installments
    the repayment plan sets by the size of the unpaid meal charges are three (installments_three) when they exceed twenty
    dollars (plan_large), two (installments_two) when they exceed five dollars (plan_small) but not twenty dollars, and one
    (installments_one) otherwise. The repayment plan takes returned deposits up front, because a returned check is made good
    at once: when the inactive account shows returned deposits in the twelve months before the quote date amounting to at
    least its unpaid meal charges, all of the unpaid meal charges are paid up front; when it shows returned deposits in that
    period amounting to less, those returned deposits are paid up front and only the rest is spread; otherwise nothing is
    paid up front. The repayment plan sets more installments for a household that still has students in the district, counting
    the household''s enrollment records in status enrolled: two more (household_three_more) when there are three or more,
    one more (household_two_more) when there are two, and no change otherwise. The repayment plan''s installments follow the
    school year: one more (calendar_early) for a quote date in August, September, October or November, one fewer (calendar_late)
    for a quote date in March, April, May, June or July, and no change for a quote date in December, January or February.
    The repayment plan''s installments follow the account''s last online card payment: one more (recent_payment) when the
    latest online card deposit on the account posted thirty days (recent_days) or fewer before the quote date, counting the
    days from the deposit date to the quote date, one fewer (stale_payment) when the account shows no online card deposit
    or the latest posted more than sixty days (stale_days) before the quote date, and no change otherwise. The adjustments
    described in the schedules are applied to the standard repayment payment in this order: first the installments are counted,
    starting from the installments the schedules set by size and adding every change the schedules make to them, never fewer
    than one; then any part the schedules take up front is set aside and the rest of the unpaid meal charges is divided by
    the installments; then the part taken up front is added back to that share. The repayment payment is that total rounded
    half up to the cent once, at the end, then raised to the online deposit minimum when it is below it, and never more than
    the unpaid meal charges or the online deposit maximum; an account whose unpaid meal charges are below the online deposit
    minimum owes no repayment payment through the portal.'
  prerequisite: []
  cross_category:
  - category: enroll
    as: branch
    reads:
    - status
    note: The installments a household with students still in the district receives count the household's enrollment records
      in status enrolled.
  compute:
  - r_bal_in: SUM('meal_transactions','amount', event_type='meals_deposit') + SUM('meal_transactions','amount', event_type='meals_purchase_void')
      + SUM('meal_transactions','amount', event_type='meals_transfer_in')
  - r_bal_out: SUM('meal_transactions','amount', event_type='meals_purchase') + SUM('meal_transactions','amount', event_type='meals_refund')
      + SUM('meal_transactions','amount', event_type='meals_transfer_out') + SUM('meal_transactions','amount', event_type='meals_returned_deposit')
  - r_unpaid: MX(0, r_bal_out - r_bal_in)
  - r_size_charges: MX(0, SUM('meal_transactions','amount', event_type='meals_purchase') + SUM('meal_transactions','amount',
      event_type='meals_refund') + SUM('meal_transactions','amount', event_type='meals_transfer_out') + SUM('meal_transactions','amount',
      event_type='meals_returned_deposit') - SUM('meal_transactions','amount', event_type='meals_deposit') - SUM('meal_transactions','amount',
      event_type='meals_purchase_void') - SUM('meal_transactions','amount', event_type='meals_transfer_in'))
  - r_size_installments: K('installments_three') if r_size_charges > K('plan_large') else (K('installments_two') if r_size_charges
      > K('plan_small') else K('installments_one'))
  - r_returned_count: COUNT('meal_transactions', within_months=12, date_field='transaction_date', event_type='meals_returned_deposit')
  - r_returned_amount: SUM('meal_transactions','amount', within_months=12, date_field='transaction_date', event_type='meals_returned_deposit')
  - r_up_front: (r_unpaid if r_returned_amount >= r_unpaid else r_returned_amount) if r_returned_count >= 1 else 0
  - r_household_students: XCOUNT('enroll','enrollments', status='enrolled')
  - r_household_change: K('household_three_more') if r_household_students >= 3 else (K('household_two_more') if r_household_students
      == 2 else 0)
  - r_month_of_year: MONTHS('2026-01-01', NOW) % 12
  - r_calendar_change: K('calendar_early') if (r_month_of_year >= 7 and r_month_of_year <= 10) else (K('calendar_late') if
      (r_month_of_year >= 2 and r_month_of_year <= 6) else 0)
  - r_last_card_date: LATEST('meal_transactions','transaction_date', date_field='transaction_date', event_type='meals_deposit',
      deposit_method='online_card')
  - r_last_card_days: DAYS(r_last_card_date, NOW) if r_last_card_date != None else 9999
  - r_payment_change: K('recent_payment') if r_last_card_days <= K('recent_days') else (K('stale_payment') if r_last_card_days
      > K('stale_days') else 0)
  - r_installments: MX(1, r_size_installments + r_household_change + r_calendar_change + r_payment_change)
  - r_share: r_up_front + (r_unpaid - r_up_front) / r_installments
  - r_rounded: RND(r_share + 0.000000001, 2)
  - result: 0 if r_unpaid < P('online_deposit_minimum') else MN(P('online_deposit_maximum'), MN(r_unpaid, MX(P('online_deposit_minimum'),
      r_rounded)))
  compute_basis:
    r_bal_in: The inactive account's balance for the repayment is its deposits, voids and transfers in less its purchases,
      refunds, transfers out and returned deposits, as they stand when the payment is quoted.
    r_bal_out: The inactive account's balance for the repayment is its deposits, voids and transfers in less its purchases,
      refunds, transfers out and returned deposits, as they stand when the payment is quoted.
    r_unpaid: The standard repayment payment is the inactive account's unpaid meal charges in full, in a single payment, that
      is the amount by which the account's balance is below zero.
    r_size_charges: The installments the repayment plan sets by the size of the unpaid meal charges
    r_size_installments: The installments the repayment plan sets by the size of the unpaid meal charges are three (installments_three)
      when they exceed twenty dollars (plan_large), two (installments_two) when they exceed five dollars (plan_small) but
      not twenty dollars, and one (installments_one) otherwise.
    r_returned_count: when the inactive account shows returned deposits in the twelve months before the quote date
    r_returned_amount: those returned deposits are paid up front and only the rest is spread
    r_up_front: 'The repayment plan takes returned deposits up front, because a returned check is made good at once: when
      the inactive account shows returned deposits in the twelve months before the quote date amounting to at least its unpaid
      meal charges, all of the unpaid meal charges are paid up front; when it shows returned deposits in that period amounting
      to less, those returned deposits are paid up front and only the rest is spread; otherwise nothing is paid up front.'
    r_household_students: counting the household's enrollment records in status enrolled
    r_household_change: 'The repayment plan sets more installments for a household that still has students in the district,
      counting the household''s enrollment records in status enrolled: two more (household_three_more) when there are three
      or more, one more (household_two_more) when there are two, and no change otherwise.'
    r_month_of_year: The repayment plan's installments follow the school year
    r_calendar_change: 'The repayment plan''s installments follow the school year: one more (calendar_early) for a quote date
      in August, September, October or November, one fewer (calendar_late) for a quote date in March, April, May, June or
      July, and no change for a quote date in December, January or February.'
    r_last_card_date: the latest online card deposit on the account
    r_last_card_days: when the account shows no online card deposit or the latest posted more than sixty days (stale_days)
      before the quote date
    r_payment_change: 'The repayment plan''s installments follow the account''s last online card payment: one more (recent_payment)
      when the latest online card deposit on the account posted thirty days (recent_days) or fewer before the quote date,
      counting the days from the deposit date to the quote date, one fewer (stale_payment) when the account shows no online
      card deposit or the latest posted more than sixty days (stale_days) before the quote date, and no change otherwise.'
    r_installments: first the installments are counted, starting from the installments the schedules set by size and adding
      every change the schedules make to them, never fewer than one
    r_share: then any part the schedules take up front is set aside and the rest of the unpaid meal charges is divided by
      the installments; then the part taken up front is added back to that share.
    r_rounded: The repayment payment is that total rounded half up to the cent once, at the end
    result: The repayment payment is that total rounded half up to the cent once, at the end, then raised to the online deposit
      minimum when it is below it, and never more than the unpaid meal charges or the online deposit maximum; an account whose
      unpaid meal charges are below the online deposit minimum owes no repayment payment through the portal.
  factors:
  - id: plan_size_installments
    effect: parameter
    decides: r_size_installments
    bindings:
    - r_size_charges
    - r_size_installments
    ladder:
    - when: the unpaid meal charges exceed twenty dollars
      value: K('installments_three')
    - when: they exceed five dollars but not twenty dollars
      value: K('installments_two')
    - when: otherwise
      value: K('installments_one')
    baseline:
      r_size_installments: K('installments_one')
    evidence:
    - history
    cross_difficulty: null
  - id: plan_up_front
    effect: method
    decides: r_up_front
    bindings:
    - r_returned_count
    - r_returned_amount
    - r_up_front
    ladder:
    - when: returned deposits in the twelve months before the quote date amounting to at least the unpaid meal charges
      method: all of the unpaid meal charges are paid up front and nothing is spread
    - when: returned deposits in that period amounting to less than the unpaid meal charges
      method: those returned deposits are paid up front and only the rest is spread
    - when: no returned deposit in that period
      method: nothing is paid up front and all of the charges are spread
    baseline:
      r_up_front: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: plan_household_students
    effect: parameter
    decides: r_household_change
    bindings:
    - r_household_students
    - r_household_change
    ladder:
    - when: three or more of the household's enrollment records are in status enrolled
      value: K('household_three_more')
    - when: two are
      value: K('household_two_more')
    - when: otherwise
      value: '0'
    baseline:
      r_household_change: '0'
    evidence:
    - cross_category
    cross_difficulty: enroll
  - id: plan_school_calendar
    effect: parameter
    decides: r_calendar_change
    bindings:
    - r_month_of_year
    - r_calendar_change
    ladder:
    - when: a quote date in August through November
      value: K('calendar_early')
    - when: a quote date in March through July
      value: K('calendar_late')
    - when: a quote date in December through February
      value: '0'
    baseline:
      r_calendar_change: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: plan_last_payment
    effect: parameter
    decides: r_payment_change
    bindings:
    - r_last_card_date
    - r_last_card_days
    - r_payment_change
    ladder:
    - when: the latest online card deposit posted thirty days or fewer before the quote date
      value: K('recent_payment')
    - when: no online card deposit, or the latest posted more than sixty days before the quote date
      value: K('stale_payment')
    - when: otherwise
      value: '0'
    baseline:
      r_payment_change: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The standard repayment payment is the inactive account's unpaid meal charges in full, in a single payment, that
      is the amount by which the account's balance is below zero. The inactive account's balance for the repayment is its
      deposits, voids and transfers in less its purchases, refunds, transfers out and returned deposits, as they stand when
      the payment is quoted.
    params:
    - installments_one
  inputs:
    history: &id008
    - table: meal_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: all
    - table: meal_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: meals_returned_deposit
    - table: meal_transactions
      aggregate: latest
      field: transaction_date
      filters:
        event_type: meals_deposit
        deposit_method: online_card
    cross_category:
    - enroll
- id: meals_ext_cep_balance_refund
  base_policy_refs:
  - meals_refunds_and_transfers
  - meals_meal_pricing
  - meals_unpaid_meal_charges
  overwrite:
  - base_policy: meals_refunds_and_transfers
    superseded_clause: A positive balance is refunded by district check only on an inactive account, after the student withdraws
      or graduates, on the household's request, when the balance is at least refund_minimum; the check is mailed within refund_processing_days
      calendar days.
    replaced_by: A positive balance is refunded by district check on an inactive account after the student withdraws or graduates,
      on the household's request, when the balance is at least refund_minimum, and, for an active account at a campus listed
      in cep_campuses and only for such an account, on the household's request when the CEP refund amount is at least refund_minimum;
      no other active account is refunded, and every refund check is mailed within refund_processing_days calendar days.
  - base_policy: meals_refunds_and_transfers
    superseded_clause: A refund always pays out the entire positive balance.
    replaced_by: A refund from an inactive account always pays out the entire positive balance; a refund from an active account
      at a campus listed in cep_campuses pays out the CEP refund amount and leaves the rest of the balance on the account.
  trigger: on_request
  subject:
  - meals_refund
  computes: amount
  target_tool: refund_cep_meal_balance_19cb6a0f
  params:
    regular_buys: 4
  rule: 'Reimbursable breakfasts and lunches are served at no charge at a campus listed in cep_campuses, so a household may
    ask School Nutrition to refund the balance on an active account at such a campus. A positive balance is refunded by district
    check on an inactive account after the student withdraws or graduates, on the household''s request, when the balance is
    at least refund_minimum, and, for an active account at a campus listed in cep_campuses and only for such an account, on
    the household''s request when the CEP refund amount is at least refund_minimum; no other active account is refunded, and
    every refund check is mailed within refund_processing_days calendar days. A refund from an inactive account always pays
    out the entire positive balance; a refund from an active account at a campus listed in cep_campuses pays out the CEP refund
    amount and leaves the rest of the balance on the account. A CEP refund is not paid until every departure rollover owed
    from the inactive account of a sibling who left for another state or country has been made. A CEP refund is not paid until
    the household has made the repayment-plan payment due today on every other active account of the household whose unpaid
    meal charges are at least the online deposit minimum. A CEP refund is not paid until every rollover owed from a graduate''s
    inactive account in the household has been made. The standard CEP refund amount is the account''s whole balance, with
    nothing kept and no deposit held back. The account''s balance for the CEP refund is its deposits, voids and transfers
    in less its purchases, refunds, transfers out and returned deposits, as they stand when the CEP refund is made. A date
    falls within the N months before the refund date when fewer than N whole calendar months separate it from the refund date,
    a whole month being reached on the same day of a later month or, when that later month has no such day, on the first day
    of the month after it. The district''s 2026-27 calendar serves meals on every weekday from August 12, 2026 through May
    27, 2027, except Labor Day (September 7), October 12, the Thanksgiving week (November 23 through 27), the winter break
    (December 21 through January 1), January 18, February 15, the spring break (March 15 through 19) and March 26, and it
    serves no meals in June or July. The serving days the keep counts left in the month of the refund date are the weekdays
    after the refund date through the last day of that month on which that calendar serves meals, less the calendar''s closures
    that fall among them; a refund date before August 12, 2026 counts from August 12, 2026, and a refund date in July 2026
    or after May 27, 2027 leaves none. The keep counts milk bought on its own by how many times it was rung up on the account
    in the month before the refund date: four (regular_buys) or more purchases make a regular buyer, and the milk-only price
    is kept for every serving day left in the month of the refund date; one to three purchases keep once what the student
    spent on it in that month; no purchase keeps nothing. The keep counts a second meal by how many times it was rung up on
    the account in the month before the refund date: four (regular_buys) or more purchases make a regular buyer, and the second-meal
    price is kept for every serving day left in the month of the refund date; one to three purchases keep once what the student
    spent on it in that month; no purchase keeps nothing. The keep counts the snacks the student buys: when a la carte items
    were rung up on the account in the month before the refund date, what was spent on them in that month is added; when none
    were rung up in that month but some were in the month before it, what was spent on them in that earlier month is added;
    otherwise nothing is added. Check deposits still inside the bank''s return period for a check stay on the account: when
    the account shows a returned deposit in the twelve months before the refund date and check deposits in the two months
    before it, those check deposits of the two months stay; when it shows no returned deposit in that period and check deposits
    in the month before the refund date, those check deposits of the month stay; otherwise none stay. Online card deposits
    still inside the card dispute period stay on the account: when the account shows a returned deposit in the twelve months
    before the refund date and online card deposits in the two months before it, those online card deposits of the two months
    stay; when it shows no returned deposit in that period and online card deposits in the month before the refund date, those
    online card deposits of the month stay; otherwise none stay. The adjustments described in the schedules are applied to
    the standard CEP refund in this order: first every amount the schedules keep is added together, which gives the keep;
    then the keep and every deposit the schedules hold back are subtracted from the account''s balance. The CEP refund amount
    is that result, rounded half up to the cent once, at the end; when it is below the refund minimum no CEP refund is made.'
  prerequisite:
  - problem: meals_ext_departure_rollover
    kind: state_gate
    gate: meal_transactions.event_type
    form: action
    policy_source: A CEP refund is not paid until every departure rollover owed from the inactive account of a sibling who
      left for another state or country has been made.
    fallback_reason: A departure rollover leaves the departed account as a sibling transfer out, which looks the same as any
      sibling transfer the household asked for, and no rollover is owed when the departed balance is smaller than the rollover
      amount, so no record singles out that the rollover has been made; the sentence names the action.
    condition: Each inactive account of the household whose student left for another state or country and which owes a departure
      rollover carries a transfer out dated the refund date for the rollover amount the receiving account's records give.
    resolved_by: transfer_departure_rollover_b6d76228
    effect: Once the departure rollover has been made, the CEP refund may be paid; the CEP refund amount itself does not depend
      on it.
  - problem: meals_ext_collection_repayment
    kind: state_gate
    gate: meal_transactions.event_type
    form: action
    policy_source: A CEP refund is not paid until the household has made the repayment-plan payment due today on every other
      active account of the household whose unpaid meal charges are at least the online deposit minimum.
    fallback_reason: A repayment-plan payment posts as an ordinary online deposit on an active account, and the prepayment
      deposit of this charter posts the same kind of row on an active account, so the state 'an online deposit dated the refund
      date' would not single out one write; the sentence names the payment.
    condition: Each other active meal account of the household whose unpaid meal charges are at least the online deposit minimum
      carries an online deposit dated the refund date for the repayment payment its records give.
    resolved_by: pay_collection_meal_installment_be0f7285
    effect: Once the repayment payment has posted, the CEP refund may be paid; the CEP refund amount itself does not depend
      on it.
  - problem: meals_ext_graduate_rollover
    kind: state_gate
    gate: meal_transactions.event_type
    form: action
    policy_source: A CEP refund is not paid until every rollover owed from a graduate's inactive account in the household
      has been made.
    fallback_reason: The graduate rollover lands on another sibling's account as a sibling transfer, which looks the same
      as any household-requested transfer, and no rollover is owed when no active account carries unpaid meal charges, so
      no record singles out that it has been made; the sentence names the action.
    condition: Each graduate's inactive account of the household that owes a rollover carries a transfer out dated the refund
      date to the receiving account for the rollover amount that account's records give.
    resolved_by: transfer_graduate_rollover_43099774
    effect: Once the graduate rollover has been made, the CEP refund may be paid; the CEP refund amount itself does not depend
      on it.
  cross_category: []
  compute:
  - e_bal_in: SUM('meal_transactions','amount', event_type='meals_deposit') + SUM('meal_transactions','amount', event_type='meals_purchase_void')
      + SUM('meal_transactions','amount', event_type='meals_transfer_in')
  - e_bal_out: SUM('meal_transactions','amount', event_type='meals_purchase') + SUM('meal_transactions','amount', event_type='meals_refund')
      + SUM('meal_transactions','amount', event_type='meals_transfer_out') + SUM('meal_transactions','amount', event_type='meals_returned_deposit')
  - e_balance: e_bal_in - e_bal_out
  - em_left_month_index: MONTHS('2026-07-01', NOW)
  - em_left_start: '''2026-08-11'' if NOW < ''2026-08-11'' else NOW'
  - em_left_end: ('2026-08-31' if em_left_month_index == 1 else ('2026-09-30' if em_left_month_index == 2 else ('2026-10-31'
      if em_left_month_index == 3 else ('2026-11-30' if em_left_month_index == 4 else ('2026-12-31' if em_left_month_index
      == 5 else ('2027-01-31' if em_left_month_index == 6 else ('2027-02-28' if em_left_month_index == 7 else ('2027-03-31'
      if em_left_month_index == 8 else ('2027-04-30' if em_left_month_index == 9 else ('2027-05-27' if em_left_month_index
      == 10 else ''))))))))))
  - em_left_span: DAYS(em_left_start, em_left_end) if (em_left_month_index >= 1 and em_left_month_index <= 10 and em_left_start
      <= em_left_end) else 0
  - em_left_weekday: DAYS('2026-08-03', em_left_start) % 7
  - em_left_weekdays: (em_left_span // 7) * 5 + (1 if (em_left_span % 7 >= 1 and (em_left_weekday + 1) % 7 < 5) else 0) +
      (1 if (em_left_span % 7 >= 2 and (em_left_weekday + 2) % 7 < 5) else 0) + (1 if (em_left_span % 7 >= 3 and (em_left_weekday
      + 3) % 7 < 5) else 0) + (1 if (em_left_span % 7 >= 4 and (em_left_weekday + 4) % 7 < 5) else 0) + (1 if (em_left_span
      % 7 >= 5 and (em_left_weekday + 5) % 7 < 5) else 0) + (1 if (em_left_span % 7 >= 6 and (em_left_weekday + 6) % 7 < 5)
      else 0)
  - em_left_closed: ((1 if (em_left_start < '2026-09-07' and '2026-09-07' <= em_left_end) else 0) + (1 if (em_left_start <
      '2026-10-12' and '2026-10-12' <= em_left_end) else 0) + (1 if (em_left_start < '2026-11-23' and '2026-11-23' <= em_left_end)
      else 0) + (1 if (em_left_start < '2026-11-24' and '2026-11-24' <= em_left_end) else 0) + (1 if (em_left_start < '2026-11-25'
