      one reimbursable lunch at the elementary lunch charge of that student's meal status, with nothing else kept and no deposit
      held back. The giving account's balance for the netting is its deposits, voids and transfers in less its purchases,
      refunds, transfers out and returned deposits, as they stand when the netting is made.
    params:
    - days_standard
    - lunch_charge_elementary
  inputs:
