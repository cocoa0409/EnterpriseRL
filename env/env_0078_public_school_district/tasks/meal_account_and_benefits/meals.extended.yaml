  - n_milk_rate: P('milk_only_price') if n_milk_days >= K('regular_buys') else 0
  - n_milk_once: n_milk_spent if (n_milk_days >= 1 and n_milk_days < K('regular_buys')) else 0
  - n_second_days: COUNT('meal_transactions', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='second_meal')
  - n_second_spent: SUM('meal_transactions','amount', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='second_meal')
  - n_second_rate: P('second_meal_price') if n_second_days >= K('regular_buys') else 0
  - n_second_once: n_second_spent if (n_second_days >= 1 and n_second_days < K('regular_buys')) else 0
  - n_card_returned: COUNT('meal_transactions', within_months=12, date_field='transaction_date', event_type='meals_returned_deposit')
  - n_card_month: SUM('meal_transactions','amount', within_months=1, date_field='transaction_date', event_type='meals_deposit',
