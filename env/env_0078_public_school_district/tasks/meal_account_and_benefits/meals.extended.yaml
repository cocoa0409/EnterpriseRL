    - es_left_start
    - es_left_end
    - es_left_span
    - es_left_weekday
    - es_left_weekdays
    - es_left_closed
    - es_days_left
    - es_buys
    - es_spent
    - es_keep
    ladder:
    - when: a second meal rung up four or more times in the month before the refund date
      method: the second-meal price is kept for every serving day left in the month
    - when: rung up one to three times in that month
      method: what was spent on it in that month is kept once
    - when: not rung up in that month
      method: nothing is kept
    baseline:
      es_keep: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: cep_refund_keep_snacks
    effect: parameter
    decides: e_alacarte_keep
    bindings:
    - e_alacarte_month
    - e_alacarte_two_months
    - e_alacarte_keep
    ladder:
    - when: a la carte items rung up in the month before the refund date
      value: what was spent on them in that month
    - when: none in that month, some in the month before it
      value: what was spent on them in that earlier month
    - when: none in either month
      value: '0'
    baseline:
      e_alacarte_keep: '0'
