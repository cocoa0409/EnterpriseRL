- id: meals_ext_sibling_idle_netting
  base_policy_refs:
  - meals_refunds_and_transfers
  - meals_meal_pricing
  - meals_unpaid_meal_charges
  overwrite: []
  trigger: on_request
  subject:
  - meals_transfer_out
  - meals_transfer_in
  computes: amount
  target_tool: transfer_idle_sibling_balance_b810dc58
  params: *id003
  rule: 'A netting is made only as part of working out a departed-balance cover for a student''s active account, with the
    household''s agreement and for the purpose it states for the giving account''s own student: part of another active account''s
    balance is moved by sibling transfer to that student''s account, and the netting amount is worked out on the giving account''s
    own records. The standard netting amount is the giving account''s balance less a keep of twenty serving days (days_standard)
    of one reimbursable lunch at the elementary lunch charge of that student''s meal status, with nothing else kept and no
    deposit held back. The giving account''s balance for the netting is its deposits, voids and transfers in less its purchases,
    refunds, transfers out and returned deposits, as they stand when the netting is made. A date falls within the N months
    before the netting date when fewer than N whole calendar months separate it from the netting date, a whole month being
    reached on the same day of a later month or, when that later month has no such day, on the first day of the month after
    it. The district''s 2026-27 calendar serves meals on every weekday from August 12, 2026 through May 27, 2027, except Labor
    Day (September 7), October 12, the Thanksgiving week (November 23 through 27), the winter break (December 21 through January
    1), January 18, February 15, the spring break (March 15 through 19) and March 26, and it serves no meals in June or July.
    The serving days the keep counts run from the day after the netting date through the end of the calendar month after it:
    the serving days left in the month of the netting date together with the serving days of the calendar month after it.
    The serving days the keep counts left in the month of the netting date are the weekdays after the netting date through
    the last day of that month on which that calendar serves meals, less the calendar''s closures that fall among them; a
    netting date before August 12, 2026 counts from August 12, 2026, and a netting date in July 2026 or after May 27, 2027
    leaves none. The serving days the keep counts of the calendar month after the netting date on that calendar are fourteen
    (days_after_july) for a netting date in July 2026, twenty-one (days_after_august_september) for one in August or September,
    sixteen (days_after_october) in October, fourteen (days_after_november) in November, nineteen (days_after_december_january)
    in December or January, seventeen (days_after_february) in February, twenty-two (days_after_march) in March, nineteen
    (days_after_april) in April, and none in May or June 2027; for a netting date outside July 2026 through June 2027 they
    are the standard twenty (days_standard). The lunch charge the keep counts follows the campus on the student''s enrollment
    record in status enrolled: the CEP meal charge at Cypress Hollow Elementary, Pecan Grove Elementary or Hollis Middle School;
    the secondary lunch charge of the student''s meal status at Ridgecrest Middle School, Calloway Creek High School or Mesquite
    Ridge High School; the elementary lunch charge of the student''s meal status at any other campus or when the student holds
    no enrollment record in status enrolled. The keep counts milk bought on its own by how many times it was rung up on the
    account in the month before the netting date: four (regular_buys) or more purchases make a regular buyer, and the milk-only
    price is added to every serving day counted; one to three purchases add once what the student spent on it in that month;
    no purchase adds nothing. The keep counts a second meal by how many times it was rung up on the account in the month before
    the netting date: four (regular_buys) or more purchases make a regular buyer, and the second-meal price is added to every
    serving day counted; one to three purchases add once what the student spent on it in that month; no purchase adds nothing.
    Online card deposits still inside the card dispute period stay on the giving account: when the account shows a returned
    deposit in the twelve months before the netting date and online card deposits in the two months before it, those online
    card deposits of the two months stay; when it shows no returned deposit in that period and online card deposits in the
    month before the netting date, those online card deposits of the month stay; otherwise none stay. The adjustments described
    in the schedules are applied to the standard netting in this order: first everything the schedules charge per serving
    day is added together into the day charge; then the day charge is multiplied by the serving days the schedules count and
    every amount the schedules add once is added, which gives the keep; then the keep and every deposit the schedules hold
    back are subtracted from the giving account''s balance. The netting amount is that result, never below nothing, rounded
    half up to the cent once, at the end; a netting of zero moves nothing.'
