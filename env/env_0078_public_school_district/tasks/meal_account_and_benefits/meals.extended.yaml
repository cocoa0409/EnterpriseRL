- id: meals_ext_collection_repayment
  base_policy_refs:
  - meals_deposits_and_returns
  - meals_unpaid_meal_charges
  overwrite: []
  trigger: on_request
  subject:
  - meals_deposit
  computes: amount
  target_tool: pay_collection_meal_installment_be0f7285
  params:
    plan_large: 20.0
    plan_small: 5.0
    installments_three: 3
    installments_two: 2
    installments_one: 1
    household_three_more: 2
    household_two_more: 1
    calendar_early: 1
    calendar_late: -1
    recent_payment: 1
    stale_payment: -1
    recent_days: 30
    stale_days: 60
    level_high_more: 2
    level_middle_more: 1
  rule: 'When the household asks to repay the unpaid meal charges on an active meal account, or when School Nutrition quotes
    the repayment payment due today on an active meal account that carries unpaid meal charges of at least the online deposit
    minimum, the account''s unpaid meal charges are repaid under the district''s repayment plan for active accounts, and each
    repayment payment is the parent''s own act: the parent pays it personally through the district''s online payment portal,
    because district staff never take card numbers; School Nutrition quotes the payment due on the day of the quote, and no
    fee, interest or penalty is ever added. Unpaid meal charges on an inactive account are repaid under the repayment plan
    for inactive accounts, never this one, and a request for one deposit that brings an active account current and funds it
    ahead follows the prepayment quote, never this plan. The standard repayment payment on an active account is the account''s
    unpaid meal charges in full, in a single payment, that is the amount by which the account''s balance is below zero. The
    account''s balance for the repayment is its deposits, voids and transfers in less its purchases, refunds, transfers out
    and returned deposits, as they stand when the payment is quoted. A date falls within the N months before the quote date
    when fewer than N whole calendar months separate it from the quote date, a whole month being reached on the same day of
    a later month or, when that later month has no such day, on the first day of the month after it. The installments the
    repayment plan sets by the size of the unpaid meal charges are three (installments_three) when they exceed twenty dollars
    (plan_large), two (installments_two) when they exceed five dollars (plan_small) but not twenty dollars, and one (installments_one)
    otherwise. The repayment plan takes returned deposits up front, because a returned check is made good at once: when the
    account shows returned deposits in the twelve months before the quote date amounting to at least its unpaid meal charges,
    all of the unpaid meal charges are paid up front; when it shows returned deposits in that period amounting to less, those
    returned deposits are paid up front and only the rest is spread; otherwise nothing is paid up front. The repayment plan
    sets more installments for a household that still has students in the district, counting the household''s enrollment records
    in status enrolled: two more (household_three_more) when there are three or more, one more (household_two_more) when there
    are two, and no change otherwise. The repayment plan''s installments follow the school year: one more (calendar_early)
    for a quote date in August, September, October or November, one fewer (calendar_late) for a quote date in March, April,
    May, June or July, and no change for a quote date in December, January or February. The repayment plan''s installments
    follow the account''s last online card payment: one more (recent_payment) when the latest online card deposit on the account
    posted thirty days (recent_days) or fewer before the quote date, counting the days from the deposit date to the quote
    date, one fewer (stale_payment) when the account shows no online card deposit or the latest posted more than sixty days
    (stale_days) before the quote date, and no change otherwise. The repayment plan''s installments follow the campus level
    of the campus on the student''s enrollment record in status enrolled, because charges build up faster where meals cost
    more: two more (level_high_more) at Calloway Creek High School or Mesquite Ridge High School, one more (level_middle_more)
    at Hollis Middle School or Ridgecrest Middle School, and no change at any other campus or when the student holds no such
    record. The adjustments described in the schedules are applied to the standard repayment payment in this order: first
    the installments are counted, starting from the installments the schedules set by size and adding every change the schedules
    make to them, never fewer than one; then any part the schedules take up front is set aside and the rest of the unpaid
    meal charges is divided by the installments; then the part taken up front is added back to that share. The repayment payment
    is that total rounded half up to the cent once, at the end, then raised to the online deposit minimum when it is below
    it, and never more than the unpaid meal charges or the online deposit maximum; an account whose unpaid meal charges are
    below the online deposit minimum owes no repayment payment through the portal.'
  prerequisite: []
  cross_category:
  - category: enroll
    as: branch
    reads:
    - status
    - campus
    note: The plan counts the household's enrollment records in status enrolled and reads the campus level of the student's
      enrolled campus.
  compute:
  - k_bal_in: SUM('meal_transactions','amount', event_type='meals_deposit') + SUM('meal_transactions','amount', event_type='meals_purchase_void')
      + SUM('meal_transactions','amount', event_type='meals_transfer_in')
  - k_bal_out: SUM('meal_transactions','amount', event_type='meals_purchase') + SUM('meal_transactions','amount', event_type='meals_refund')
      + SUM('meal_transactions','amount', event_type='meals_transfer_out') + SUM('meal_transactions','amount', event_type='meals_returned_deposit')
  - k_unpaid: MX(0, k_bal_out - k_bal_in)
  - k_size_charges: MX(0, SUM('meal_transactions','amount', event_type='meals_purchase') + SUM('meal_transactions','amount',
      event_type='meals_refund') + SUM('meal_transactions','amount', event_type='meals_transfer_out') + SUM('meal_transactions','amount',
      event_type='meals_returned_deposit') - SUM('meal_transactions','amount', event_type='meals_deposit') - SUM('meal_transactions','amount',
      event_type='meals_purchase_void') - SUM('meal_transactions','amount', event_type='meals_transfer_in'))
  - k_size_installments: K('installments_three') if k_size_charges > K('plan_large') else (K('installments_two') if k_size_charges
      > K('plan_small') else K('installments_one'))
  - k_returned_count: COUNT('meal_transactions', within_months=12, date_field='transaction_date', event_type='meals_returned_deposit')
  - k_returned_amount: SUM('meal_transactions','amount', within_months=12, date_field='transaction_date', event_type='meals_returned_deposit')
  - k_up_front: (k_unpaid if k_returned_amount >= k_unpaid else k_returned_amount) if k_returned_count >= 1 else 0
  - k_household_students: XCOUNT('enroll','enrollments', status='enrolled')
  - k_household_change: K('household_three_more') if k_household_students >= 3 else (K('household_two_more') if k_household_students
      == 2 else 0)
  - k_month_of_year: MONTHS('2026-01-01', NOW) % 12
  - k_calendar_change: K('calendar_early') if (k_month_of_year >= 7 and k_month_of_year <= 10) else (K('calendar_late') if
      (k_month_of_year >= 2 and k_month_of_year <= 6) else 0)
  - k_last_card_date: LATEST('meal_transactions','transaction_date', date_field='transaction_date', event_type='meals_deposit',
      deposit_method='online_card')
  - k_last_card_days: DAYS(k_last_card_date, NOW) if k_last_card_date != None else 9999
  - k_payment_change: K('recent_payment') if k_last_card_days <= K('recent_days') else (K('stale_payment') if k_last_card_days
      > K('stale_days') else 0)
  - k_level_campus: CFIELD('enroll','campus', student_id=F('student_id'), status='enrolled')
  - k_level_change: K('level_high_more') if (k_level_campus == 'Calloway Creek High School' or k_level_campus == 'Mesquite
      Ridge High School') else (K('level_middle_more') if (k_level_campus == 'Hollis Middle School' or k_level_campus == 'Ridgecrest
      Middle School') else 0)
  - k_installments: MX(1, k_size_installments + k_household_change + k_calendar_change + k_payment_change + k_level_change)
  - k_share: k_up_front + (k_unpaid - k_up_front) / k_installments
  - k_rounded: RND(k_share + 0.000000001, 2)
  - result: 0 if k_unpaid < P('online_deposit_minimum') else MN(P('online_deposit_maximum'), MN(k_unpaid, MX(P('online_deposit_minimum'),
      k_rounded)))
  compute_basis:
    k_bal_in: The account's balance for the repayment is its deposits, voids and transfers in less its purchases, refunds,
      transfers out and returned deposits, as they stand when the payment is quoted.
    k_bal_out: The account's balance for the repayment is its deposits, voids and transfers in less its purchases, refunds,
      transfers out and returned deposits, as they stand when the payment is quoted.
    k_unpaid: The standard repayment payment on an active account is the account's unpaid meal charges in full, in a single
      payment, that is the amount by which the account's balance is below zero.
    k_size_charges: The installments the repayment plan sets by the size of the unpaid meal charges
    k_size_installments: The installments the repayment plan sets by the size of the unpaid meal charges are three (installments_three)
      when they exceed twenty dollars (plan_large), two (installments_two) when they exceed five dollars (plan_small) but
      not twenty dollars, and one (installments_one) otherwise.
    k_returned_count: when the account shows returned deposits in the twelve months before the quote date
    k_returned_amount: those returned deposits are paid up front and only the rest is spread
    k_up_front: 'The repayment plan takes returned deposits up front, because a returned check is made good at once: when
      the account shows returned deposits in the twelve months before the quote date amounting to at least its unpaid meal
      charges, all of the unpaid meal charges are paid up front; when it shows returned deposits in that period amounting
      to less, those returned deposits are paid up front and only the rest is spread; otherwise nothing is paid up front.'
    k_household_students: counting the household's enrollment records in status enrolled
    k_household_change: 'The repayment plan sets more installments for a household that still has students in the district,
      counting the household''s enrollment records in status enrolled: two more (household_three_more) when there are three
      or more, one more (household_two_more) when there are two, and no change otherwise.'
    k_month_of_year: The repayment plan's installments follow the school year
    k_calendar_change: 'The repayment plan''s installments follow the school year: one more (calendar_early) for a quote date
      in August, September, October or November, one fewer (calendar_late) for a quote date in March, April, May, June or
      July, and no change for a quote date in December, January or February.'
    k_last_card_date: the latest online card deposit on the account
    k_last_card_days: when the account shows no online card deposit or the latest posted more than sixty days (stale_days)
      before the quote date
    k_payment_change: 'The repayment plan''s installments follow the account''s last online card payment: one more (recent_payment)
      when the latest online card deposit on the account posted thirty days (recent_days) or fewer before the quote date,
      counting the days from the deposit date to the quote date, one fewer (stale_payment) when the account shows no online
      card deposit or the latest posted more than sixty days (stale_days) before the quote date, and no change otherwise.'
    k_installments: first the installments are counted, starting from the installments the schedules set by size and adding
      every change the schedules make to them, never fewer than one
    k_share: then any part the schedules take up front is set aside and the rest of the unpaid meal charges is divided by
      the installments; then the part taken up front is added back to that share.
    k_rounded: The repayment payment is that total rounded half up to the cent once, at the end
    result: The repayment payment is that total rounded half up to the cent once, at the end, then raised to the online deposit
      minimum when it is below it, and never more than the unpaid meal charges or the online deposit maximum; an account whose
      unpaid meal charges are below the online deposit minimum owes no repayment payment through the portal.
    k_level_change: 'The repayment plan''s installments follow the campus level of the campus on the student''s enrollment
      record in status enrolled, because charges build up faster where meals cost more: two more (level_high_more) at Calloway
      Creek High School or Mesquite Ridge High School, one more (level_middle_more) at Hollis Middle School or Ridgecrest
      Middle School, and no change at any other campus or when the student holds no such record.'
    k_level_campus: the campus on the student's enrollment record in status enrolled
  factors:
  - id: coll_size_installments
    effect: parameter
    decides: k_size_installments
    bindings:
    - k_size_charges
    - k_size_installments
    ladder:
    - when: the unpaid meal charges exceed twenty dollars
      value: K('installments_three')
    - when: they exceed five dollars but not twenty dollars
      value: K('installments_two')
    - when: otherwise
      value: K('installments_one')
    baseline:
      k_size_installments: K('installments_one')
    evidence:
    - history
    cross_difficulty: null
  - id: coll_up_front
    effect: method
    decides: k_up_front
    bindings:
    - k_returned_count
    - k_returned_amount
    - k_up_front
    ladder:
    - when: returned deposits in the twelve months before the quote date amounting to at least the unpaid meal charges
      method: all of the unpaid meal charges are paid up front and nothing is spread
    - when: returned deposits in that period amounting to less than the unpaid meal charges
      method: those returned deposits are paid up front and only the rest is spread
    - when: no returned deposit in that period
      method: nothing is paid up front and all of the charges are spread
    baseline:
      k_up_front: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: coll_household_students
    effect: parameter
    decides: k_household_change
    bindings:
    - k_household_students
    - k_household_change
    ladder:
    - when: three or more of the household's enrollment records are in status enrolled
      value: K('household_three_more')
    - when: two are
      value: K('household_two_more')
    - when: otherwise
      value: '0'
    baseline:
      k_household_change: '0'
    evidence:
    - cross_category
    cross_difficulty: enroll
  - id: coll_school_calendar
    effect: parameter
    decides: k_calendar_change
    bindings:
    - k_month_of_year
    - k_calendar_change
    ladder:
    - when: a quote date in August through November
      value: K('calendar_early')
    - when: a quote date in March through July
      value: K('calendar_late')
    - when: a quote date in December through February
      value: '0'
    baseline:
      k_calendar_change: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: coll_last_payment
    effect: parameter
    decides: k_payment_change
    bindings:
    - k_last_card_date
    - k_last_card_days
    - k_payment_change
    ladder:
    - when: the latest online card deposit posted thirty days or fewer before the quote date
      value: K('recent_payment')
    - when: no online card deposit, or the latest posted more than sixty days before the quote date
      value: K('stale_payment')
    - when: otherwise
      value: '0'
    baseline:
      k_payment_change: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: coll_campus_level
    effect: parameter
    decides: k_level_change
    bindings:
    - k_level_campus
    - k_level_change
    ladder:
    - when: the enrolled campus is Calloway Creek High School or Mesquite Ridge High School
      value: K('level_high_more')
    - when: the enrolled campus is Hollis Middle School or Ridgecrest Middle School
      value: K('level_middle_more')
    - when: any other campus, or no enrollment record in status enrolled
      value: '0'
    baseline:
      k_level_change: '0'
    evidence:
    - cross_category
    cross_difficulty: enroll
  baseline:
    rule: The standard repayment payment on an active account is the account's unpaid meal charges in full, in a single payment,
