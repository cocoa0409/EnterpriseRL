  - w_left_span: DAYS(w_left_start, w_left_end) if (w_left_month_index >= 1 and w_left_month_index <= 10 and w_left_start
      <= w_left_end) else 0
  - w_left_weekday: DAYS('2026-08-03', w_left_start) % 7
  - w_left_weekdays: (w_left_span // 7) * 5 + (1 if (w_left_span % 7 >= 1 and (w_left_weekday + 1) % 7 < 5) else 0) + (1 if
