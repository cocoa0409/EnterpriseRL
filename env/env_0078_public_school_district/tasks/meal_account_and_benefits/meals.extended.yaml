  - w_balance: w_bal_in - w_bal_out
  - w_lunch_charge: P('lunch_charge_secondary') if (F('campus') == 'Ridgecrest Middle School' or F('campus') == 'Calloway
      Creek High School' or F('campus') == 'Mesquite Ridge High School') else P('lunch_charge_elementary')
  - w_left_month_index: MONTHS('2026-07-01', NOW)
  - w_left_start: '''2026-08-11'' if NOW < ''2026-08-11'' else NOW'
  - w_left_end: ('2026-08-31' if w_left_month_index == 1 else ('2026-09-30' if w_left_month_index == 2 else ('2026-10-31'
      if w_left_month_index == 3 else ('2026-11-30' if w_left_month_index == 4 else ('2026-12-31' if w_left_month_index ==
      5 else ('2027-01-31' if w_left_month_index == 6 else ('2027-02-28' if w_left_month_index == 7 else ('2027-03-31' if
      w_left_month_index == 8 else ('2027-04-30' if w_left_month_index == 9 else ('2027-05-27' if w_left_month_index == 10
