    history: *id002
    cross_category: []
- id: meals_ext_graduate_rollover
  base_policy_refs:
  - meals_refunds_and_transfers
  - meals_meal_pricing
  - meals_unpaid_meal_charges
  overwrite: []
  trigger: state_due
  subject:
  - meals_transfer_out
  - meals_transfer_in
  computes: amount
  target_tool: transfer_graduate_rollover_43099774
  params:
    days_week: 5
    regular_buys: 4
  rule: 'When a student graduates, as the leaver reason graduated on the student''s completed enrollment record shows, the
    positive balance on the graduate''s inactive meal account is rolled to the household''s active account that carries unpaid
    meal charges (when several do, the one with the largest unpaid meal charges) for the purpose the household states when
    it agrees: to clear those charges and pay for the receiving student''s meals and the items the student buys on their own,
    snacks included, for the serving days left in the current month; when no active account carries unpaid meal charges, the
    graduate balance stays on the account for the household''s instruction. A student who withdrew is never a graduate here:
    that balance follows the departed-balance cover or the departure rollover. The rollover amount is worked out on the receiving
    account''s own records, and a rollover is owed and made only from a graduate balance at least that amount; when the graduate
    balance is smaller, no rollover is owed from it, and whatever a rollover does not move stays on the graduate''s account
    for the household''s instruction. The rollover amount is fixed only after the household has made the repayment-plan payment
    due today on the receiving account. The standard rollover amount funds five serving days (days_week), a school week, of
    one reimbursable lunch at the elementary lunch charge of the student''s meal status, with nothing else added, less the
    receiving account''s balance, so a negative balance adds its unpaid meal charges to the rollover. The receiving account''s
    balance for the rollover is its deposits, voids and transfers in less its purchases, refunds, transfers out and returned
    deposits, as they stand when the rollover is made. A date falls within the N months before the rollover date when fewer
    than N whole calendar months separate it from the rollover date, a whole month being reached on the same day of a later
    month or, when that later month has no such day, on the first day of the month after it. The district''s 2026-27 calendar
    serves meals on every weekday from August 12, 2026 through May 27, 2027, except Labor Day (September 7), October 12, the
    Thanksgiving week (November 23 through 27), the winter break (December 21 through January 1), January 18, February 15,
    the spring break (March 15 through 19) and March 26, and it serves no meals in June or July. The serving days the rollover
    funds left in the month of the rollover date are the weekdays after the rollover date through the last day of that month
    on which that calendar serves meals, less the calendar''s closures that fall among them; a rollover date before August
    12, 2026 counts from August 12, 2026, and a rollover date in July 2026 or after May 27, 2027 leaves none; a rollover date
    outside July 2026 through June 2027 counts the standard five (days_week). The lunch charge the rollover counts follows
    the campus on the student''s enrollment record in status enrolled: the CEP meal charge at Cypress Hollow Elementary, Pecan
    Grove Elementary or Hollis Middle School; the secondary lunch charge of the student''s meal status at Ridgecrest Middle
    School, Calloway Creek High School or Mesquite Ridge High School; the elementary lunch charge of the student''s meal status
    at any other campus or when the student holds no enrollment record in status enrolled. The rollover adds a reimbursable
    breakfast to each serving day when a reimbursable breakfast was rung up on the account in the month before the rollover
    date: the secondary breakfast charge of the student''s meal status when the account''s campus is Ridgecrest Middle School,
    Calloway Creek High School or Mesquite Ridge High School; the elementary breakfast charge of the status when it is any
    other campus not listed in cep_campuses; nothing when no breakfast was rung up in that month or the account''s campus
    is listed in cep_campuses, where breakfast is served at no charge. The rollover counts milk bought on its own by how many
    times it was rung up on the account in the month before the rollover date: four (regular_buys) or more purchases make
    a regular buyer, and the milk-only price is added to every serving day counted; one to three purchases add once what the
    student spent on it in that month; no purchase adds nothing. The rollover counts a second meal by how many times it was
    rung up on the account in the month before the rollover date: four (regular_buys) or more purchases make a regular buyer,
    and the second-meal price is added to every serving day counted; one to three purchases add once what the student spent
    on it in that month; no purchase adds nothing. The rollover counts the snacks the student buys: when a la carte items
    were rung up on the account in the month before the rollover date, what was spent on them in that month is added; when
    none were rung up in that month but some were in the month before it, what was spent on them in that earlier month is
    added; otherwise nothing is added. The adjustments described in the schedules are applied to the standard rollover in
    this order: first everything the schedules charge per serving day is added together into the day charge; then the day
    charge is multiplied by the serving days the schedules count and every amount the schedules add once is added; then the
    receiving account''s balance is subtracted. The rollover amount is that total, never below nothing, rounded half up to
    the cent once, at the end; a rollover of zero moves nothing.'
  prerequisite:
  - problem: meals_ext_collection_repayment
    kind: value_input
    gate: g_balance
    form: action
    policy_source: The rollover amount is fixed only after the household has made the repayment-plan payment due today on
      the receiving account.
    fallback_reason: A repayment-plan payment posts as an ordinary online deposit, which the receiving account's records cannot
      tell apart from any other online deposit, and an account owes no portal payment when its unpaid charges are below the
      online minimum; no record singles out that the payment has been made, so the sentence names it.
    condition: When the receiving account carries unpaid meal charges of at least the online deposit minimum, it carries an
      online deposit dated the rollover date for the repayment payment its records give.
    resolved_by: pay_collection_meal_installment_be0f7285
    effect: The repayment payment raises the receiving account's balance, which lowers the rollover amount by the same amount
      while it remains above zero.
  cross_category: *id001
  compute:
  - g_bal_in: SUM('meal_transactions','amount', event_type='meals_deposit') + SUM('meal_transactions','amount', event_type='meals_purchase_void')
