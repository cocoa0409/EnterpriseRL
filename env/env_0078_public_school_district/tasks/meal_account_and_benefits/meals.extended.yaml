  compute_basis:
    e_bal_in: The account's balance for the CEP refund is its deposits, voids and transfers in less its purchases, refunds,
      transfers out and returned deposits, as they stand when the CEP refund is made.
    e_bal_out: The account's balance for the CEP refund is its deposits, voids and transfers in less its purchases, refunds,
      transfers out and returned deposits, as they stand when the CEP refund is made.
    e_balance: The account's balance for the CEP refund is its deposits, voids and transfers in less its purchases, refunds,
      transfers out and returned deposits, as they stand when the CEP refund is made.
    em_left_month_index: the month of the refund date
    em_left_start: a refund date before August 12, 2026 counts from August 12, 2026
    em_left_end: through the last day of that month on which that calendar serves meals
    em_left_span: the weekdays after the refund date through the last day of that month on which that calendar serves meals
    em_left_weekday: the weekdays after the refund date
    em_left_weekdays: the weekdays after the refund date
    em_left_closed: less the calendar's closures that fall among them
    em_days_left: The serving days the keep counts left in the month of the refund date are the weekdays after the refund
      date through the last day of that month on which that calendar serves meals, less the calendar's closures that fall
      among them; a refund date before August 12, 2026 counts from August 12, 2026, and a refund date in July 2026 or after
      May 27, 2027 leaves none.
    em_buys: by how many times it was rung up on the account in the month before the refund date
    em_spent: one to three purchases keep once what the student spent on it in that month
    em_keep: 'The keep counts milk bought on its own by how many times it was rung up on the account in the month before the
      refund date: four (regular_buys) or more purchases make a regular buyer, and the milk-only price is kept for every serving
      day left in the month of the refund date; one to three purchases keep once what the student spent on it in that month;
      no purchase keeps nothing.'
    es_left_month_index: the month of the refund date
    es_left_start: a refund date before August 12, 2026 counts from August 12, 2026
    es_left_end: through the last day of that month on which that calendar serves meals
    es_left_span: the weekdays after the refund date through the last day of that month on which that calendar serves meals
    es_left_weekday: the weekdays after the refund date
    es_left_weekdays: the weekdays after the refund date
    es_left_closed: less the calendar's closures that fall among them
    es_days_left: The serving days the keep counts left in the month of the refund date are the weekdays after the refund
      date through the last day of that month on which that calendar serves meals, less the calendar's closures that fall
      among them; a refund date before August 12, 2026 counts from August 12, 2026, and a refund date in July 2026 or after
      May 27, 2027 leaves none.
    es_buys: by how many times it was rung up on the account in the month before the refund date
    es_spent: one to three purchases keep once what the student spent on it in that month
    es_keep: 'The keep counts a second meal by how many times it was rung up on the account in the month before the refund
      date: four (regular_buys) or more purchases make a regular buyer, and the second-meal price is kept for every serving
      day left in the month of the refund date; one to three purchases keep once what the student spent on it in that month;
      no purchase keeps nothing.'
    e_alacarte_month: when a la carte items were rung up on the account in the month before the refund date
    e_alacarte_two_months: but some were in the month before it
    e_alacarte_keep: 'The keep counts the snacks the student buys: when a la carte items were rung up on the account in the
      month before the refund date, what was spent on them in that month is added; when none were rung up in that month but
      some were in the month before it, what was spent on them in that earlier month is added; otherwise nothing is added.'
    e_check_returned: when the account shows a returned deposit in the twelve months before the refund date
    e_check_month: check deposits in the month before the refund date
    e_check_two_months: check deposits in the two months before it
    e_check_hold: 'Check deposits still inside the bank''s return period for a check stay on the account: when the account
      shows a returned deposit in the twelve months before the refund date and check deposits in the two months before it,
      those check deposits of the two months stay; when it shows no returned deposit in that period and check deposits in
      the month before the refund date, those check deposits of the month stay; otherwise none stay.'
    e_card_returned: when the account shows a returned deposit in the twelve months before the refund date
    e_card_month: online card deposits in the month before the refund date
    e_card_two_months: online card deposits in the two months before it
    e_card_hold: 'Online card deposits still inside the card dispute period stay on the account: when the account shows a
      returned deposit in the twelve months before the refund date and online card deposits in the two months before it, those
      online card deposits of the two months stay; when it shows no returned deposit in that period and online card deposits
      in the month before the refund date, those online card deposits of the month stay; otherwise none stay.'
    e_keep: first every amount the schedules keep is added together, which gives the keep
    e_refundable: then the keep and every deposit the schedules hold back are subtracted from the account's balance
    result: The CEP refund amount is that result, rounded half up to the cent once, at the end; when it is below the refund
      minimum no CEP refund is made.
  factors:
  - id: cep_refund_check_hold
    effect: parameter
    decides: e_check_hold
