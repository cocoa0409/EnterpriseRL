    - q_left_weekday
    - q_left_weekdays
    - q_left_closed
    - q_days_left
    - q_next_month_index
    - q_days_next
    - q_serving_days
    ladder:
    - when: a quote date in July 2026
      value: the serving days left after the quote date in its month plus none for July and fourteen for August
    - when: a quote date in August or September 2026
      value: the serving days left after the quote date in its month plus twenty-one for the month after
    - when: a quote date in October 2026
      value: the serving days left after the quote date in its month plus sixteen for November
    - when: a quote date in November 2026
      value: the serving days left after the quote date in its month plus fourteen for December
    - when: a quote date in December 2026 or January 2027
      value: the serving days left after the quote date in its month plus nineteen for the month after
    - when: a quote date in February 2027
      value: the serving days left after the quote date in its month plus seventeen for March
    - when: a quote date in March 2027
      value: the serving days left after the quote date in its month plus twenty-two for April
    - when: a quote date in April 2027
      value: the serving days left after the quote date in its month plus nineteen for May
    - when: a quote date in May or June 2027
      value: the serving days left after the quote date in its month plus none for June
    - when: a quote date outside July 2026 through June 2027
      value: the standard twenty (days_standard)
    baseline:
      q_serving_days: K('days_standard')
    evidence:
    - date
    cross_difficulty: null
  - id: quote_lunch_charge
    effect: parameter
    decides: q_lunch_charge
    bindings:
    - q_enroll_campus
    - q_lunch_charge
    ladder:
    - when: the enrolled campus is Cypress Hollow Elementary, Pecan Grove Elementary or Hollis Middle School
      value: P('cep_meal_charge')
    - when: the enrolled campus is Ridgecrest Middle School, Calloway Creek High School or Mesquite Ridge High School
      value: P('lunch_charge_secondary')
    - when: any other enrolled campus, or no enrollment record in status enrolled
      value: P('lunch_charge_elementary')
    baseline:
      q_lunch_charge: P('lunch_charge_elementary')
    evidence:
    - cross_category
    cross_difficulty: enroll
  - id: quote_breakfast
    effect: parameter
    decides: q_breakfast_charge
    bindings:
    - q_breakfasts
    - q_breakfast_charge
    ladder:
    - when: a breakfast rung up in the month before the quote date, account campus Ridgecrest Middle School, Calloway Creek
        High School or Mesquite Ridge High School
      value: P('breakfast_charge_secondary')
    - when: a breakfast rung up in that month, any other account campus not listed in cep_campuses
      value: P('breakfast_charge_elementary')
    - when: no breakfast rung up in that month, or an account campus listed in cep_campuses
      value: '0'
    baseline:
      q_breakfast_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: quote_milk
    effect: method
    decides: q_milk_rate
    bindings:
    - q_milk_days
    - q_milk_spent
    - q_milk_rate
    - q_milk_once
    ladder:
    - when: milk bought on its own rung up four or more times in the month before the quote date
      method: the milk-only price is added to every serving day counted
    - when: rung up one to three times in that month
      method: what was spent on it in that month is added once
    - when: not rung up in that month
      method: nothing is added
    baseline:
      q_milk_rate: '0'
      q_milk_once: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: quote_second_meal
    effect: method
    decides: q_second_rate
    bindings:
    - q_second_days
    - q_second_spent
    - q_second_rate
    - q_second_once
    ladder:
    - when: a second meal rung up four or more times in the month before the quote date
      method: the second-meal price is added to every serving day counted
    - when: rung up one to three times in that month
      method: what was spent on it in that month is added once
    - when: not rung up in that month
      method: nothing is added
    baseline:
      q_second_rate: '0'
      q_second_once: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The prepayment quote funds the student's reimbursable meals and the items the student buys on their own from the
      day after the quote date through the end of the calendar month after it, less the account's balance, so a negative balance
      adds its unpaid meal charges to the quote; the standard quote counts twenty serving days (days_standard), a full school
      month, of one reimbursable lunch at the elementary lunch charge of the student's meal status, with nothing else added.
      The account's balance for the quote is its deposits, voids and transfers in less its purchases, refunds, transfers out
      and returned deposits, as they stand when the quote is made.
    params:
    - days_standard
    - lunch_charge_elementary
  inputs:
    history: &id002
    - &id004
      table: meal_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: all
    - &id005
      table: meal_transactions
      aggregate: count
      field: meal_transaction_id
      within_months: 1
      filters:
        event_type: meals_purchase
        meal_type: breakfast|milk_only|second_meal
    cross_category:
    - enroll
- id: meals_ext_departed_charge_cover
  base_policy_refs:
  - meals_refunds_and_transfers
  - meals_meal_pricing
  - meals_unpaid_meal_charges
  overwrite: []
  trigger: on_request
  subject:
  - meals_transfer_out
  - meals_transfer_in
  computes: amount
  target_tool: transfer_departed_charge_cover_80639818
  params:
    days_week: 5
    regular_buys: 4
  rule: 'When a prepayment is quoted for a student, or when the household asks School Nutrition to settle a departed student''s
    account, the positive balance on the inactive account of a departed sibling in the same household is moved by sibling
    transfer to the student''s active account for the purpose the household states when it agrees: to clear the account''s
    unpaid meal charges and pay for the student''s meals and the items the student buys on their own for the serving days
    left in the current month; the cover amount is worked out on the receiving account''s own records. A departed sibling
    here is a student whose enrollment record in status withdrawn carries a leaver reason other than moved_out_of_state or
    returned_to_home_country; the balance of a student who left for another state or country follows the departure rollover,
    and the balance of a graduate follows the graduate rollover, never this cover. A cover is owed and made only from an inactive
    account whose positive balance is at least the cover amount; when the departed balance is smaller, no cover is owed from
    that account, and whatever a cover does not move stays on the inactive account for the household''s refund request or
    a later sibling transfer. The cover amount is fixed only after the idle balance of each other active account of the household
    has been netted to the receiving account. The standard cover amount funds five serving days (days_week), a school week,
    of one reimbursable lunch at the elementary lunch charge of the student''s meal status, with nothing else added, less
    the receiving account''s balance, so a negative balance adds its unpaid meal charges to the cover. The receiving account''s
    balance for the cover is its deposits, voids and transfers in less its purchases, refunds, transfers out and returned
    deposits, as they stand when the cover is made. A date falls within the N months before the cover date when fewer than
    N whole calendar months separate it from the cover date, a whole month being reached on the same day of a later month
    or, when that later month has no such day, on the first day of the month after it. The district''s 2026-27 calendar serves
    meals on every weekday from August 12, 2026 through May 27, 2027, except Labor Day (September 7), October 12, the Thanksgiving
    week (November 23 through 27), the winter break (December 21 through January 1), January 18, February 15, the spring break
    (March 15 through 19) and March 26, and it serves no meals in June or July. The serving days the cover funds left in the
    month of the cover date are the weekdays after the cover date through the last day of that month on which that calendar
    serves meals, less the calendar''s closures that fall among them; a cover date before August 12, 2026 counts from August
    12, 2026, and a cover date in July 2026 or after May 27, 2027 leaves none; a cover date outside July 2026 through June
    2027 counts the standard five (days_week). The lunch charge the cover counts follows the campus on the student''s enrollment
    record in status enrolled: the CEP meal charge at Cypress Hollow Elementary, Pecan Grove Elementary or Hollis Middle School;
    the secondary lunch charge of the student''s meal status at Ridgecrest Middle School, Calloway Creek High School or Mesquite
    Ridge High School; the elementary lunch charge of the student''s meal status at any other campus or when the student holds
    no enrollment record in status enrolled. The cover adds a reimbursable breakfast to each serving day when a reimbursable
    breakfast was rung up on the account in the month before the cover date: the secondary breakfast charge of the student''s
    meal status when the account''s campus is Ridgecrest Middle School, Calloway Creek High School or Mesquite Ridge High
    School; the elementary breakfast charge of the status when it is any other campus not listed in cep_campuses; nothing
    when no breakfast was rung up in that month or the account''s campus is listed in cep_campuses, where breakfast is served
    at no charge. The cover counts milk bought on its own by how many times it was rung up on the account in the month before
    the cover date: four (regular_buys) or more purchases make a regular buyer, and the milk-only price is added to every
    serving day counted; one to three purchases add once what the student spent on it in that month; no purchase adds nothing.
    The cover counts a second meal by how many times it was rung up on the account in the month before the cover date: four
    (regular_buys) or more purchases make a regular buyer, and the second-meal price is added to every serving day counted;
    one to three purchases add once what the student spent on it in that month; no purchase adds nothing. The adjustments
    described in the schedules are applied to the standard cover in this order: first everything the schedules charge per
    serving day is added together into the day charge; then the day charge is multiplied by the serving days the schedules
    count and every amount the schedules add once is added; then the receiving account''s balance is subtracted. The cover
    amount is that total, never below nothing, rounded half up to the cent once, at the end; a cover of zero moves nothing.'
  prerequisite:
  - problem: meals_ext_sibling_idle_netting
    kind: value_input
    gate: c_balance
    form: action
    policy_source: The cover amount is fixed only after the idle balance of each other active account of the household has
      been netted to the receiving account.
    fallback_reason: Netting moves nothing when a sibling account holds no more than its keep, and a sibling transfer in from
      an active account can also be one the household asked for at another time, so the receiving account's records cannot
      show that the netting has been done; the sentence names the action.
    condition: For each other active meal account of the household whose netting amount is above zero, the receiving account
      carries a transfer in from it dated the cover date for that netting amount.
    resolved_by: transfer_idle_sibling_balance_b810dc58
    effect: The netting's transfer in raises the receiving account's balance, which lowers the cover amount by the same amount
      while the cover remains above zero.
  cross_category: *id001
  compute:
  - c_bal_in: SUM('meal_transactions','amount', event_type='meals_deposit') + SUM('meal_transactions','amount', event_type='meals_purchase_void')
      + SUM('meal_transactions','amount', event_type='meals_transfer_in')
  - c_bal_out: SUM('meal_transactions','amount', event_type='meals_purchase') + SUM('meal_transactions','amount', event_type='meals_refund')
      + SUM('meal_transactions','amount', event_type='meals_transfer_out') + SUM('meal_transactions','amount', event_type='meals_returned_deposit')
  - c_balance: c_bal_in - c_bal_out
  - c_left_month_index: MONTHS('2026-07-01', NOW)
  - c_left_start: '''2026-08-11'' if NOW < ''2026-08-11'' else NOW'
  - c_left_end: ('2026-08-31' if c_left_month_index == 1 else ('2026-09-30' if c_left_month_index == 2 else ('2026-10-31'
      if c_left_month_index == 3 else ('2026-11-30' if c_left_month_index == 4 else ('2026-12-31' if c_left_month_index ==
      5 else ('2027-01-31' if c_left_month_index == 6 else ('2027-02-28' if c_left_month_index == 7 else ('2027-03-31' if
      c_left_month_index == 8 else ('2027-04-30' if c_left_month_index == 9 else ('2027-05-27' if c_left_month_index == 10
      else ''))))))))))
  - c_left_span: DAYS(c_left_start, c_left_end) if (c_left_month_index >= 1 and c_left_month_index <= 10 and c_left_start
      <= c_left_end) else 0
  - c_left_weekday: DAYS('2026-08-03', c_left_start) % 7
  - c_left_weekdays: (c_left_span // 7) * 5 + (1 if (c_left_span % 7 >= 1 and (c_left_weekday + 1) % 7 < 5) else 0) + (1 if
      (c_left_span % 7 >= 2 and (c_left_weekday + 2) % 7 < 5) else 0) + (1 if (c_left_span % 7 >= 3 and (c_left_weekday +
      3) % 7 < 5) else 0) + (1 if (c_left_span % 7 >= 4 and (c_left_weekday + 4) % 7 < 5) else 0) + (1 if (c_left_span % 7
      >= 5 and (c_left_weekday + 5) % 7 < 5) else 0) + (1 if (c_left_span % 7 >= 6 and (c_left_weekday + 6) % 7 < 5) else
      0)
  - c_left_closed: ((1 if (c_left_start < '2026-09-07' and '2026-09-07' <= c_left_end) else 0) + (1 if (c_left_start < '2026-10-12'
      and '2026-10-12' <= c_left_end) else 0) + (1 if (c_left_start < '2026-11-23' and '2026-11-23' <= c_left_end) else 0)
      + (1 if (c_left_start < '2026-11-24' and '2026-11-24' <= c_left_end) else 0) + (1 if (c_left_start < '2026-11-25' and
      '2026-11-25' <= c_left_end) else 0) + (1 if (c_left_start < '2026-11-26' and '2026-11-26' <= c_left_end) else 0) + (1
      if (c_left_start < '2026-11-27' and '2026-11-27' <= c_left_end) else 0) + (1 if (c_left_start < '2026-12-21' and '2026-12-21'
      <= c_left_end) else 0) + (1 if (c_left_start < '2026-12-22' and '2026-12-22' <= c_left_end) else 0) + (1 if (c_left_start
      < '2026-12-23' and '2026-12-23' <= c_left_end) else 0) + (1 if (c_left_start < '2026-12-24' and '2026-12-24' <= c_left_end)
      else 0) + (1 if (c_left_start < '2026-12-25' and '2026-12-25' <= c_left_end) else 0) + (1 if (c_left_start < '2026-12-28'
      and '2026-12-28' <= c_left_end) else 0) + (1 if (c_left_start < '2026-12-29' and '2026-12-29' <= c_left_end) else 0)
      + (1 if (c_left_start < '2026-12-30' and '2026-12-30' <= c_left_end) else 0) + (1 if (c_left_start < '2026-12-31' and
      '2026-12-31' <= c_left_end) else 0) + (1 if (c_left_start < '2027-01-01' and '2027-01-01' <= c_left_end) else 0) + (1
      if (c_left_start < '2027-01-18' and '2027-01-18' <= c_left_end) else 0) + (1 if (c_left_start < '2027-02-15' and '2027-02-15'
      <= c_left_end) else 0) + (1 if (c_left_start < '2027-03-15' and '2027-03-15' <= c_left_end) else 0) + (1 if (c_left_start
      < '2027-03-16' and '2027-03-16' <= c_left_end) else 0) + (1 if (c_left_start < '2027-03-17' and '2027-03-17' <= c_left_end)
      else 0) + (1 if (c_left_start < '2027-03-18' and '2027-03-18' <= c_left_end) else 0) + (1 if (c_left_start < '2027-03-19'
      and '2027-03-19' <= c_left_end) else 0) + (1 if (c_left_start < '2027-03-26' and '2027-03-26' <= c_left_end) else 0))
      if c_left_span > 0 else 0
  - c_days_left: MX(0, c_left_weekdays - c_left_closed) if (c_left_month_index >= 1 and c_left_month_index <= 10) else (K('days_week')
      if (c_left_month_index < 0 or c_left_month_index > 11) else 0)
  - c_enroll_campus: CFIELD('enroll','campus', student_id=F('student_id'), status='enrolled')
  - c_lunch_charge: P('cep_meal_charge') if (c_enroll_campus == 'Cypress Hollow Elementary' or c_enroll_campus == 'Pecan Grove
      Elementary' or c_enroll_campus == 'Hollis Middle School') else (P('lunch_charge_secondary') if (c_enroll_campus == 'Ridgecrest
      Middle School' or c_enroll_campus == 'Calloway Creek High School' or c_enroll_campus == 'Mesquite Ridge High School')
      else P('lunch_charge_elementary'))
  - c_breakfasts: COUNT('meal_transactions', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='breakfast')
  - c_breakfast_charge: (P('breakfast_charge_secondary') if (F('campus') == 'Ridgecrest Middle School' or F('campus') == 'Calloway
      Creek High School' or F('campus') == 'Mesquite Ridge High School') else (0 if (F('campus') == 'Cypress Hollow Elementary'
      or F('campus') == 'Pecan Grove Elementary' or F('campus') == 'Hollis Middle School') else P('breakfast_charge_elementary')))
      if c_breakfasts >= 1 else 0
  - c_milk_days: COUNT('meal_transactions', within_months=1, date_field='transaction_date', event_type='meals_purchase', meal_type='milk_only')
  - c_milk_spent: SUM('meal_transactions','amount', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='milk_only')
  - c_milk_rate: P('milk_only_price') if c_milk_days >= K('regular_buys') else 0
  - c_milk_once: c_milk_spent if (c_milk_days >= 1 and c_milk_days < K('regular_buys')) else 0
  - c_second_days: COUNT('meal_transactions', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='second_meal')
  - c_second_spent: SUM('meal_transactions','amount', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='second_meal')
  - c_second_rate: P('second_meal_price') if c_second_days >= K('regular_buys') else 0
  - c_second_once: c_second_spent if (c_second_days >= 1 and c_second_days < K('regular_buys')) else 0
  - c_day_charge: c_lunch_charge + c_breakfast_charge + c_milk_rate + c_second_rate
  - c_days_cost: c_days_left * c_day_charge + c_milk_once + c_second_once
  - c_total: c_days_cost - c_balance
  - result: RND(MX(0, c_total) + 0.000000001, 2)
  compute_basis:
    c_bal_in: The receiving account's balance for the cover is its deposits, voids and transfers in less its purchases, refunds,
      transfers out and returned deposits, as they stand when the cover is made.
    c_bal_out: The receiving account's balance for the cover is its deposits, voids and transfers in less its purchases, refunds,
      transfers out and returned deposits, as they stand when the cover is made.
    c_balance: The receiving account's balance for the cover is its deposits, voids and transfers in less its purchases, refunds,
      transfers out and returned deposits, as they stand when the cover is made.
    c_left_month_index: the month of the cover date
    c_left_start: a cover date before August 12, 2026 counts from August 12, 2026
    c_left_end: through the last day of that month on which that calendar serves meals
    c_left_span: the weekdays after the cover date through the last day of that month on which that calendar serves meals
    c_left_weekday: the weekdays after the cover date
    c_left_weekdays: the weekdays after the cover date
    c_left_closed: less the calendar's closures that fall among them
    c_days_left: The serving days the cover funds left in the month of the cover date are the weekdays after the cover date
      through the last day of that month on which that calendar serves meals, less the calendar's closures that fall among
      them; a cover date before August 12, 2026 counts from August 12, 2026, and a cover date in July 2026 or after May 27,
