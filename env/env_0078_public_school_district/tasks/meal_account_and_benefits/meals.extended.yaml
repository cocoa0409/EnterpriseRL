      the account''s campus is Ridgecrest Middle School, Calloway Creek High School or Mesquite Ridge High School; the elementary
      breakfast charge of the status when it is any other campus not listed in cep_campuses; nothing when no breakfast was
      rung up in that month or the account''s campus is listed in cep_campuses, where breakfast is served at no charge.'
    c_milk_days: by how many times it was rung up on the account in the month before the cover date
    c_milk_spent: three purchases add once what the student spent on it in that month
    c_milk_rate: 'The cover counts milk bought on its own by how many times it was rung up on the account in the month before
      the cover date: four (regular_buys) or more purchases make a regular buyer, and the milk-only price is added to every
      serving day counted; one to three purchases add once what the student spent on it in that month; no purchase adds nothing.'
    c_milk_once: 'The cover counts milk bought on its own by how many times it was rung up on the account in the month before
      the cover date: four (regular_buys) or more purchases make a regular buyer, and the milk-only price is added to every
      serving day counted; one to three purchases add once what the student spent on it in that month; no purchase adds nothing.'
    c_second_days: by how many times it was rung up on the account in the month before the cover date
    c_second_spent: three purchases add once what the student spent on it in that month
    c_second_rate: 'The cover counts a second meal by how many times it was rung up on the account in the month before the
      cover date: four (regular_buys) or more purchases make a regular buyer, and the second-meal price is added to every
      serving day counted; one to three purchases add once what the student spent on it in that month; no purchase adds nothing.'
    c_second_once: 'The cover counts a second meal by how many times it was rung up on the account in the month before the
      cover date: four (regular_buys) or more purchases make a regular buyer, and the second-meal price is added to every
      serving day counted; one to three purchases add once what the student spent on it in that month; no purchase adds nothing.'
    c_day_charge: first everything the schedules charge per serving day is added together into the day charge
    c_days_cost: then the day charge is multiplied by the serving days the schedules count and every amount the schedules
      add once is added
    c_total: then the receiving account's balance is subtracted
    result: The cover amount is that total, never below nothing, rounded half up to the cent once, at the end; a cover of
      zero moves nothing.
  factors:
  - id: cover_serving_days
    effect: parameter
    decides: c_days_left
    bindings:
    - c_left_month_index
    - c_left_start
    - c_left_end
    - c_left_span
    - c_left_weekday
    - c_left_weekdays
    - c_left_closed
    - c_days_left
    ladder:
    - when: a cover date from August 12, 2026 through May 27, 2027
      value: the weekdays after that date through the month's last serving day, less the calendar's closures among them
    - when: a cover date from August 1 through August 11, 2026
      value: the weekdays from August 12 through August 31, 2026, less the calendar's closures among them
    - when: a cover date in July 2026 or from May 28 through June 30, 2027
      value: '0'
    - when: a cover date outside July 2026 through June 2027
      value: K('days_week')
    baseline:
      c_days_left: K('days_week')
    evidence:
    - date
    cross_difficulty: null
  - id: cover_lunch
    effect: parameter
    decides: c_lunch_charge
    bindings:
    - c_enroll_campus
    - c_lunch_charge
    ladder:
    - when: the enrolled campus is Cypress Hollow Elementary, Pecan Grove Elementary or Hollis Middle School
      value: P('cep_meal_charge')
    - when: the enrolled campus is Ridgecrest Middle School, Calloway Creek High School or Mesquite Ridge High School
      value: P('lunch_charge_secondary')
    - when: any other enrolled campus, or no enrollment record in status enrolled
      value: P('lunch_charge_elementary')
    baseline:
      c_lunch_charge: P('lunch_charge_elementary')
    evidence:
    - cross_category
    cross_difficulty: enroll
  - id: cover_breakfast
    effect: parameter
    decides: c_breakfast_charge
    bindings:
    - c_breakfasts
    - c_breakfast_charge
    ladder:
    - when: a breakfast rung up in the month before the cover date, account campus Ridgecrest Middle School, Calloway Creek
        High School or Mesquite Ridge High School
      value: P('breakfast_charge_secondary')
    - when: a breakfast rung up in that month, any other account campus not listed in cep_campuses
      value: P('breakfast_charge_elementary')
    - when: no breakfast rung up in that month, or an account campus listed in cep_campuses
      value: '0'
    baseline:
      c_breakfast_charge: '0'
