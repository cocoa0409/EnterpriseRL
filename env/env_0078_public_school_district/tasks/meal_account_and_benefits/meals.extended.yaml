# School Nutrition Services meal accounts and NSLP/SBP meal benefit status — Calloway Creek ISD.
category: meals
display_name: School Nutrition Services Meal Account

binding:
  holding_table: meal_accounts
  event_tables: [meal_transactions, meal_notices]
  intake_tables: [meal_benefit_applications]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [active, inactive, closed]
  transitions:
    - {from: active, to: inactive, by: system, means: "The account becomes inactive when the student withdraws from the district or graduates; no meals can be purchased on it."}
    - {from: inactive, to: active, by: agent, means: "An inactive account is reactivated when the student re-enrolls; the same account and balance continue."}
    - {from: inactive, to: closed, by: agent, means: "An inactive account is closed once its balance is zero after a refund, a sibling transfer or the collection of unpaid charges."}

accounts:
  - key: meal_account_balance
    unit: USD
    meaning: "Prepaid cafeteria balance of one student's meal account; deposits, voids of purchases and sibling transfers in increase it, meal and a la carte purchases, refunds, transfers out and returned deposits decrease it; a negative value is unpaid meal charges owed by the household."

parameter_schema:
  benefit_level: "Meal benefit level of the status; enum paid | reduced | free."
  eligibility_source: "Source on which the status rests; enum none | household_application | direct_certification | categorical_designation | prior_year_status."
  breakfast_charge_elementary: "Charge for a reimbursable breakfast at an elementary or early childhood campus, USD."
  lunch_charge_elementary: "Charge for a reimbursable lunch at an elementary or early childhood campus, USD."
  breakfast_charge_secondary: "Charge for a reimbursable breakfast at a middle or high school campus, USD."
  lunch_charge_secondary: "Charge for a reimbursable lunch at a middle or high school campus, USD."
  second_meal_price: "Price of a second (non-reimbursable) breakfast or lunch on the same day, USD, the same at every campus and status."
  milk_only_price: "Price of a carton of milk bought on its own, USD."
  cep_campuses: "Campuses operating the Community Eligibility Provision for school year 2026-27, where reimbursable breakfast and lunch are served at no charge to every student; list of campus names."
  cep_meal_charge: "Charge for a reimbursable breakfast or lunch at a CEP campus, USD."
  campus_level: "Pricing level of each campus; mapping campus name -> elementary | middle | high (early childhood centers price as elementary)."
  meal_charging_allowed: "Whether a reimbursable meal may be charged against a zero or negative balance under the unpaid meal charge policy; boolean."
  charge_limit_elementary: "Largest negative balance an elementary student's account may reach through charged reimbursable meals, USD (stated as a positive amount)."
  charge_limit_middle: "Largest negative balance a middle school student's account may reach through charged reimbursable meals, USD (positive amount)."
  charge_limit_high: "Largest negative balance a high school student's account may reach through charged reimbursable meals, USD (positive amount)."
  meal_after_charge_limit: "What a student receives once the charge limit is reached; enum reimbursable_meal_served_and_charged."
  a_la_carte_on_negative_balance: "Whether a la carte items, second meals or milk may be bought when the balance would fall below zero; boolean."
  low_balance_threshold: "Balance at or below which a low-balance notice is sent while the balance is still zero or above, USD."
  negative_balance_notice_interval_days: "Calendar days between repeated negative-balance notices while the balance stays below zero; integer."
  negative_balance_carries_forward: "Whether unpaid meal charges carry into the next school year on the same account; boolean."
  year_end_collection_letter: "Whether a collection letter is sent for a negative balance remaining after the last instructional day; boolean."
  meal_charge_fees_allowed: "Whether any fee, interest or penalty may be added to unpaid meal charges; boolean."
  benefit_effective_basis: "Day a new or higher status takes effect; enum determination_date."
  benefit_term: "How long the status lasts; enum school_year_plus_carryover (the school year and the carryover period of the next) | through_carryover_last_operating_day | open_until_status_changes."
  carryover_last_operating_day: "Last day a prior-year status carries into school year 2026-27, the 30th operating day after the August 12, 2026 first day of school, YYYY-MM-DD."
  carryover_expiry_status: "Status a carryover account reverts to when the carryover period ends without a new determination; official tier name."
  carryover_expiry_notice_required: "Whether an adverse action notice is required before a carryover status expires; boolean."
  verification_subject: "Whether the status can be selected for income verification; boolean."
  verification_selection_deadline: "Date by which the district selects its verification sample of approved household applications, MM-DD."
  verification_response_days: "Calendar days a household selected for verification has to submit documents, the selection letter date being day 0; integer."
  adverse_action_notice_days: "Calendar days of advance written notice before a status is reduced or terminated after verification, the notice date being day 0; integer."
  determination_operating_days: "Operating days within which a submitted household application must be determined; integer."
  household_extension_basis: "Which students a determination reaches; enum all_students_in_household | individual_student | not_applicable."
  reapplication_anytime: "Whether a household may submit a new application at any time during the school year; boolean."
  online_deposit_minimum: "Smallest online card deposit accepted, USD."
  online_deposit_maximum: "Largest single online card deposit accepted, USD."
  online_processing_fee: "Convenience fee the payment processor charges per online deposit, USD; charged by the processor and never posted to the meal account."
  cafeteria_deposit_methods: "Deposit methods accepted at the cafeteria register; list of enum cash_cafeteria | check_cafeteria."
  check_deposits_after_return: "Whether check deposits are still accepted for the household after a returned check in the same school year; boolean."
  refund_minimum: "Smallest balance refunded by district check; smaller balances can only be transferred to a sibling or are held, USD."
  refund_processing_days: "Calendar days after an approved refund request within which the check is mailed; integer."
  unclaimed_balance_months: "Months after inactivation after which an unclaimed positive balance with no sibling account is applied to the district's student meal assistance fund; integer."
  sibling_transfer_allowed: "Whether a positive balance may be moved to another student's meal account in the same household; boolean."
  purchase_dispute_days: "Calendar days after a purchase within which the household may dispute it, the purchase date being day 0; integer."
  cashier_void_same_day_only: "Whether a cashier may void a purchase only on the day it was rung up; boolean."
  approval_letter_required: "Whether a written notice of eligibility is sent when the status is determined; boolean."
  categorical_designation_sources: "Designations that confer categorical free eligibility; list of enum homeless_mckinney_vento | foster_care | migrant | runaway."
  direct_certification_programs: "Programs whose data match confers direct certification; list of enum snap | tanf | fdpir | medicaid."
  status_precedence: "Rank of the status when several sources apply to the same student, 1 being the most beneficial; integer."

