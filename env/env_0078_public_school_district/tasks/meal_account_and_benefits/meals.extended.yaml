  - w_left_closed: ((1 if (w_left_start < '2026-09-07' and '2026-09-07' <= w_left_end) else 0) + (1 if (w_left_start < '2026-10-12'
      and '2026-10-12' <= w_left_end) else 0) + (1 if (w_left_start < '2026-11-23' and '2026-11-23' <= w_left_end) else 0)
      + (1 if (w_left_start < '2026-11-24' and '2026-11-24' <= w_left_end) else 0) + (1 if (w_left_start < '2026-11-25' and
      '2026-11-25' <= w_left_end) else 0) + (1 if (w_left_start < '2026-11-26' and '2026-11-26' <= w_left_end) else 0) + (1
      if (w_left_start < '2026-11-27' and '2026-11-27' <= w_left_end) else 0) + (1 if (w_left_start < '2026-12-21' and '2026-12-21'
      <= w_left_end) else 0) + (1 if (w_left_start < '2026-12-22' and '2026-12-22' <= w_left_end) else 0) + (1 if (w_left_start
      < '2026-12-23' and '2026-12-23' <= w_left_end) else 0) + (1 if (w_left_start < '2026-12-24' and '2026-12-24' <= w_left_end)
      else 0) + (1 if (w_left_start < '2026-12-25' and '2026-12-25' <= w_left_end) else 0) + (1 if (w_left_start < '2026-12-28'
      and '2026-12-28' <= w_left_end) else 0) + (1 if (w_left_start < '2026-12-29' and '2026-12-29' <= w_left_end) else 0)
      + (1 if (w_left_start < '2026-12-30' and '2026-12-30' <= w_left_end) else 0) + (1 if (w_left_start < '2026-12-31' and
      '2026-12-31' <= w_left_end) else 0) + (1 if (w_left_start < '2027-01-01' and '2027-01-01' <= w_left_end) else 0) + (1
      if (w_left_start < '2027-01-18' and '2027-01-18' <= w_left_end) else 0) + (1 if (w_left_start < '2027-02-15' and '2027-02-15'
      <= w_left_end) else 0) + (1 if (w_left_start < '2027-03-15' and '2027-03-15' <= w_left_end) else 0) + (1 if (w_left_start
      < '2027-03-16' and '2027-03-16' <= w_left_end) else 0) + (1 if (w_left_start < '2027-03-17' and '2027-03-17' <= w_left_end)
      else 0) + (1 if (w_left_start < '2027-03-18' and '2027-03-18' <= w_left_end) else 0) + (1 if (w_left_start < '2027-03-19'
      and '2027-03-19' <= w_left_end) else 0) + (1 if (w_left_start < '2027-03-26' and '2027-03-26' <= w_left_end) else 0))
      if w_left_span > 0 else 0
  - w_days_left: MX(0, w_left_weekdays - w_left_closed) if (w_left_month_index >= 1 and w_left_month_index <= 10) else 0
  - w_next_month_index: MONTHS('2026-07-01', NOW)
  - w_days_next: K('days_after_july') if w_next_month_index == 0 else (K('days_after_august_september') if (w_next_month_index
      == 1 or w_next_month_index == 2) else (K('days_after_october') if w_next_month_index == 3 else (K('days_after_november')
      if w_next_month_index == 4 else (K('days_after_december_january') if (w_next_month_index == 5 or w_next_month_index
      == 6) else (K('days_after_february') if w_next_month_index == 7 else (K('days_after_march') if w_next_month_index ==
      8 else (K('days_after_april') if w_next_month_index == 9 else (0 if (w_next_month_index == 10 or w_next_month_index
      == 11) else K('days_standard')))))))))
  - w_serving_days: w_days_left + w_days_next
  - w_breakfasts: COUNT('meal_transactions', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='breakfast')
  - w_breakfast_charge: (P('breakfast_charge_secondary') if (F('campus') == 'Ridgecrest Middle School' or F('campus') == 'Calloway
      Creek High School' or F('campus') == 'Mesquite Ridge High School') else (0 if (F('campus') == 'Cypress Hollow Elementary'
      or F('campus') == 'Pecan Grove Elementary' or F('campus') == 'Hollis Middle School') else P('breakfast_charge_elementary')))
      if w_breakfasts >= 1 else 0
  - w_milk_days: COUNT('meal_transactions', within_months=1, date_field='transaction_date', event_type='meals_purchase', meal_type='milk_only')
  - w_milk_spent: SUM('meal_transactions','amount', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='milk_only')
  - w_milk_rate: P('milk_only_price') if w_milk_days >= K('regular_buys') else 0
  - w_milk_once: w_milk_spent if (w_milk_days >= 1 and w_milk_days < K('regular_buys')) else 0
  - w_second_days: COUNT('meal_transactions', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='second_meal')
  - w_second_spent: SUM('meal_transactions','amount', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='second_meal')
  - w_second_rate: P('second_meal_price') if w_second_days >= K('regular_buys') else 0
  - w_second_once: w_second_spent if (w_second_days >= 1 and w_second_days < K('regular_buys')) else 0
  - w_alacarte_month: SUM('meal_transactions','amount', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='a_la_carte')
  - w_alacarte_two_months: SUM('meal_transactions','amount', within_months=2, date_field='transaction_date', event_type='meals_purchase',
      meal_type='a_la_carte')
  - w_alacarte_keep: w_alacarte_month if w_alacarte_month > 0 else ((w_alacarte_two_months - w_alacarte_month) if w_alacarte_two_months
      > w_alacarte_month else 0)
  - w_day_charge: w_lunch_charge + w_breakfast_charge + w_milk_rate + w_second_rate
  - w_days_cost: w_serving_days * w_day_charge + w_milk_once + w_second_once + w_alacarte_keep
  - w_total: w_days_cost - w_balance
  - result: RND(MX(0, w_total) + 0.000000001, 2)
  compute_basis:
    w_bal_in: The receiving account's balance for the departure rollover is its deposits, voids and transfers in less its
      purchases, refunds, transfers out and returned deposits, as they stand when the departure rollover is made.
    w_bal_out: The receiving account's balance for the departure rollover is its deposits, voids and transfers in less its
      purchases, refunds, transfers out and returned deposits, as they stand when the departure rollover is made.
    w_balance: The receiving account's balance for the departure rollover is its deposits, voids and transfers in less its
      purchases, refunds, transfers out and returned deposits, as they stand when the departure rollover is made.
    w_lunch_charge: 'The lunch charge the departure rollover counts is the student''s charge under the district''s meal pricing
      at the account''s campus: the secondary lunch charge of the student''s meal status at Ridgecrest Middle School, Calloway
      Creek High School or Mesquite Ridge High School, and the elementary lunch charge of the status at any other campus not
      listed in cep_campuses.'
    w_left_month_index: the month of the rollover date
    w_left_start: a rollover date before August 12, 2026 counts from August 12, 2026
    w_left_end: through the last day of that month on which that calendar serves meals
    w_left_span: the weekdays after the rollover date through the last day of that month on which that calendar serves meals
    w_left_weekday: the weekdays after the rollover date
    w_left_weekdays: the weekdays after the rollover date
    w_left_closed: less the calendar's closures that fall among them
    w_days_left: The serving days the departure rollover funds left in the month of the rollover date are the weekdays after
      the rollover date through the last day of that month on which that calendar serves meals, less the calendar's closures
      that fall among them; a rollover date before August 12, 2026 counts from August 12, 2026, and a rollover date in July
      2026 or after May 27, 2027 leaves none.
    w_next_month_index: the calendar month after the rollover date
    w_days_next: The serving days the departure rollover funds of the calendar month after the rollover date on that calendar
      are fourteen (days_after_july) for a rollover date in July 2026, twenty-one (days_after_august_september) for one in
      August or September, sixteen (days_after_october) in October, fourteen (days_after_november) in November, nineteen (days_after_december_january)
      in December or January, seventeen (days_after_february) in February, twenty-two (days_after_march) in March, nineteen
      (days_after_april) in April, and none in May or June 2027; for a rollover date outside July 2026 through June 2027 they
      are the standard twenty (days_standard).
    w_serving_days: 'The serving days the departure rollover funds run from the day after the rollover date through the end
      of the calendar month after it: the serving days left in the month of the rollover date together with the serving days
      of the calendar month after it.'
    w_breakfasts: when a reimbursable breakfast was rung up on the account in the month before the rollover date
    w_breakfast_charge: 'The departure rollover adds a reimbursable breakfast to each serving day when a reimbursable breakfast
      was rung up on the account in the month before the rollover date: the secondary breakfast charge of the student''s meal
      status when the account''s campus is Ridgecrest Middle School, Calloway Creek High School or Mesquite Ridge High School;
      the elementary breakfast charge of the status when it is any other campus not listed in cep_campuses; nothing when no
      breakfast was rung up in that month or the account''s campus is listed in cep_campuses, where breakfast is served at
      no charge.'
    w_milk_days: by how many times it was rung up on the account in the month before the rollover date
    w_milk_spent: three purchases add once what the student spent on it in that month
    w_milk_rate: 'The departure rollover counts milk bought on its own by how many times it was rung up on the account in
      the month before the rollover date: four (regular_buys) or more purchases make a regular buyer, and the milk-only price
      is added to every serving day counted; one to three purchases add once what the student spent on it in that month; no
      purchase adds nothing.'
    w_milk_once: 'The departure rollover counts milk bought on its own by how many times it was rung up on the account in
      the month before the rollover date: four (regular_buys) or more purchases make a regular buyer, and the milk-only price
      is added to every serving day counted; one to three purchases add once what the student spent on it in that month; no
      purchase adds nothing.'
    w_second_days: by how many times it was rung up on the account in the month before the rollover date
    w_second_spent: three purchases add once what the student spent on it in that month
    w_second_rate: 'The departure rollover counts a second meal by how many times it was rung up on the account in the month
      before the rollover date: four (regular_buys) or more purchases make a regular buyer, and the second-meal price is added
      to every serving day counted; one to three purchases add once what the student spent on it in that month; no purchase
      adds nothing.'
    w_second_once: 'The departure rollover counts a second meal by how many times it was rung up on the account in the month
      before the rollover date: four (regular_buys) or more purchases make a regular buyer, and the second-meal price is added
      to every serving day counted; one to three purchases add once what the student spent on it in that month; no purchase
      adds nothing.'
    w_alacarte_month: when a la carte items were rung up on the account in the month before the rollover date
    w_alacarte_two_months: but some were in the month before it
    w_alacarte_keep: 'The departure rollover counts the snacks the student buys: when a la carte items were rung up on the
      account in the month before the rollover date, what was spent on them in that month is added; when none were rung up
      in that month but some were in the month before it, what was spent on them in that earlier month is added; otherwise
      nothing is added.'
    w_day_charge: first everything the schedules charge per serving day is added together into the day charge
    w_days_cost: then the day charge is multiplied by the serving days the schedules count and every amount the schedules
      add once is added
    w_total: then the receiving account's balance is subtracted
    result: The departure rollover amount is that total, never below nothing, rounded half up to the cent once, at the end;
      a departure rollover of zero moves nothing.
  factors:
  - id: departure_serving_days
    effect: parameter
    decides: w_serving_days
    bindings:
    - w_left_month_index
    - w_left_start
    - w_left_end
    - w_left_span
    - w_left_weekday
    - w_left_weekdays
    - w_left_closed
    - w_days_left
    - w_next_month_index
    - w_days_next
    - w_serving_days
    ladder:
    - when: a rollover date in July 2026
      value: the serving days left after the rollover date in its month plus none for July and fourteen for August
    - when: a rollover date in August or September 2026
      value: the serving days left after the rollover date in its month plus twenty-one for the month after
    - when: a rollover date in October 2026
      value: the serving days left after the rollover date in its month plus sixteen for November
    - when: a rollover date in November 2026
      value: the serving days left after the rollover date in its month plus fourteen for December
    - when: a rollover date in December 2026 or January 2027
      value: the serving days left after the rollover date in its month plus nineteen for the month after
    - when: a rollover date in February 2027
      value: the serving days left after the rollover date in its month plus seventeen for March
    - when: a rollover date in March 2027
      value: the serving days left after the rollover date in its month plus twenty-two for April
    - when: a rollover date in April 2027
      value: the serving days left after the rollover date in its month plus nineteen for May
    - when: a rollover date in May or June 2027
      value: the serving days left after the rollover date in its month plus none for June
    - when: a rollover date outside July 2026 through June 2027
      value: the standard twenty (days_standard)
    baseline:
      w_serving_days: K('days_standard')
    evidence:
    - date
    cross_difficulty: null
  - id: departure_breakfast
    effect: parameter
    decides: w_breakfast_charge
    bindings:
    - w_breakfasts
    - w_breakfast_charge
    ladder:
    - when: a breakfast rung up in the month before the rollover date, account campus Ridgecrest Middle School, Calloway Creek
        High School or Mesquite Ridge High School
      value: P('breakfast_charge_secondary')
    - when: a breakfast rung up in that month, any other account campus not listed in cep_campuses
      value: P('breakfast_charge_elementary')
    - when: no breakfast rung up in that month, or an account campus listed in cep_campuses
      value: '0'
    baseline:
      w_breakfast_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: departure_milk
    effect: method
    decides: w_milk_rate
    bindings:
    - w_milk_days
    - w_milk_spent
    - w_milk_rate
    - w_milk_once
    ladder:
    - when: milk bought on its own rung up four or more times in the month before the rollover date
      method: the milk-only price is added to every serving day counted
    - when: rung up one to three times in that month
      method: what was spent on it in that month is added once
    - when: not rung up in that month
      method: nothing is added
    baseline:
      w_milk_rate: '0'
      w_milk_once: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: departure_second_meal
    effect: method
    decides: w_second_rate
    bindings:
    - w_second_days
    - w_second_spent
    - w_second_rate
    - w_second_once
    ladder:
    - when: a second meal rung up four or more times in the month before the rollover date
      method: the second-meal price is added to every serving day counted
    - when: rung up one to three times in that month
      method: what was spent on it in that month is added once
    - when: not rung up in that month
      method: nothing is added
    baseline:
      w_second_rate: '0'
      w_second_once: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: departure_snacks
    effect: parameter
    decides: w_alacarte_keep
    bindings:
    - w_alacarte_month
    - w_alacarte_two_months
    - w_alacarte_keep
    ladder:
    - when: a la carte items rung up in the month before the rollover date
      value: what was spent on them in that month
    - when: none in that month, some in the month before it
      value: what was spent on them in that earlier month
    - when: none in either month
      value: '0'
    baseline:
      w_alacarte_keep: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'The standard departure rollover amount funds twenty serving days (days_standard), a full school month, of one reimbursable
      lunch at the lunch charge the departure rollover counts, with nothing else added, less the account''s balance, so a
      negative balance adds its unpaid meal charges to the departure rollover. The receiving account''s balance for the departure
      rollover is its deposits, voids and transfers in less its purchases, refunds, transfers out and returned deposits, as
      they stand when the departure rollover is made. The lunch charge the departure rollover counts is the student''s charge
      under the district''s meal pricing at the account''s campus: the secondary lunch charge of the student''s meal status
      at Ridgecrest Middle School, Calloway Creek High School or Mesquite Ridge High School, and the elementary lunch charge
      of the status at any other campus not listed in cep_campuses.'
    params:
    - days_standard
    - lunch_charge_elementary
    - lunch_charge_secondary
