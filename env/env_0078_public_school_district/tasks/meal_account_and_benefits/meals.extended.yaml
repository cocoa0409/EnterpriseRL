  - g_balance: g_bal_in - g_bal_out
  - g_left_month_index: MONTHS('2026-07-01', NOW)
  - g_left_start: '''2026-08-11'' if NOW < ''2026-08-11'' else NOW'
  - g_left_end: ('2026-08-31' if g_left_month_index == 1 else ('2026-09-30' if g_left_month_index == 2 else ('2026-10-31'
      if g_left_month_index == 3 else ('2026-11-30' if g_left_month_index == 4 else ('2026-12-31' if g_left_month_index ==
      5 else ('2027-01-31' if g_left_month_index == 6 else ('2027-02-28' if g_left_month_index == 7 else ('2027-03-31' if
      g_left_month_index == 8 else ('2027-04-30' if g_left_month_index == 9 else ('2027-05-27' if g_left_month_index == 10
      else ''))))))))))
  - g_left_span: DAYS(g_left_start, g_left_end) if (g_left_month_index >= 1 and g_left_month_index <= 10 and g_left_start
      <= g_left_end) else 0
  - g_left_weekday: DAYS('2026-08-03', g_left_start) % 7
  - g_left_weekdays: (g_left_span // 7) * 5 + (1 if (g_left_span % 7 >= 1 and (g_left_weekday + 1) % 7 < 5) else 0) + (1 if
      (g_left_span % 7 >= 2 and (g_left_weekday + 2) % 7 < 5) else 0) + (1 if (g_left_span % 7 >= 3 and (g_left_weekday +
      3) % 7 < 5) else 0) + (1 if (g_left_span % 7 >= 4 and (g_left_weekday + 4) % 7 < 5) else 0) + (1 if (g_left_span % 7
      >= 5 and (g_left_weekday + 5) % 7 < 5) else 0) + (1 if (g_left_span % 7 >= 6 and (g_left_weekday + 6) % 7 < 5) else
      0)
  - g_left_closed: ((1 if (g_left_start < '2026-09-07' and '2026-09-07' <= g_left_end) else 0) + (1 if (g_left_start < '2026-10-12'
      and '2026-10-12' <= g_left_end) else 0) + (1 if (g_left_start < '2026-11-23' and '2026-11-23' <= g_left_end) else 0)
      + (1 if (g_left_start < '2026-11-24' and '2026-11-24' <= g_left_end) else 0) + (1 if (g_left_start < '2026-11-25' and
      '2026-11-25' <= g_left_end) else 0) + (1 if (g_left_start < '2026-11-26' and '2026-11-26' <= g_left_end) else 0) + (1
      if (g_left_start < '2026-11-27' and '2026-11-27' <= g_left_end) else 0) + (1 if (g_left_start < '2026-12-21' and '2026-12-21'
      <= g_left_end) else 0) + (1 if (g_left_start < '2026-12-22' and '2026-12-22' <= g_left_end) else 0) + (1 if (g_left_start
      < '2026-12-23' and '2026-12-23' <= g_left_end) else 0) + (1 if (g_left_start < '2026-12-24' and '2026-12-24' <= g_left_end)
      else 0) + (1 if (g_left_start < '2026-12-25' and '2026-12-25' <= g_left_end) else 0) + (1 if (g_left_start < '2026-12-28'
      and '2026-12-28' <= g_left_end) else 0) + (1 if (g_left_start < '2026-12-29' and '2026-12-29' <= g_left_end) else 0)
      + (1 if (g_left_start < '2026-12-30' and '2026-12-30' <= g_left_end) else 0) + (1 if (g_left_start < '2026-12-31' and
      '2026-12-31' <= g_left_end) else 0) + (1 if (g_left_start < '2027-01-01' and '2027-01-01' <= g_left_end) else 0) + (1
      if (g_left_start < '2027-01-18' and '2027-01-18' <= g_left_end) else 0) + (1 if (g_left_start < '2027-02-15' and '2027-02-15'
      <= g_left_end) else 0) + (1 if (g_left_start < '2027-03-15' and '2027-03-15' <= g_left_end) else 0) + (1 if (g_left_start
      < '2027-03-16' and '2027-03-16' <= g_left_end) else 0) + (1 if (g_left_start < '2027-03-17' and '2027-03-17' <= g_left_end)
      else 0) + (1 if (g_left_start < '2027-03-18' and '2027-03-18' <= g_left_end) else 0) + (1 if (g_left_start < '2027-03-19'
      and '2027-03-19' <= g_left_end) else 0) + (1 if (g_left_start < '2027-03-26' and '2027-03-26' <= g_left_end) else 0))
      if g_left_span > 0 else 0
  - g_days_left: MX(0, g_left_weekdays - g_left_closed) if (g_left_month_index >= 1 and g_left_month_index <= 10) else (K('days_week')
      if (g_left_month_index < 0 or g_left_month_index > 11) else 0)
  - g_enroll_campus: CFIELD('enroll','campus', student_id=F('student_id'), status='enrolled')
  - g_lunch_charge: P('cep_meal_charge') if (g_enroll_campus == 'Cypress Hollow Elementary' or g_enroll_campus == 'Pecan Grove
      Elementary' or g_enroll_campus == 'Hollis Middle School') else (P('lunch_charge_secondary') if (g_enroll_campus == 'Ridgecrest
      Middle School' or g_enroll_campus == 'Calloway Creek High School' or g_enroll_campus == 'Mesquite Ridge High School')
      else P('lunch_charge_elementary'))
  - g_breakfasts: COUNT('meal_transactions', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='breakfast')
  - g_breakfast_charge: (P('breakfast_charge_secondary') if (F('campus') == 'Ridgecrest Middle School' or F('campus') == 'Calloway
      Creek High School' or F('campus') == 'Mesquite Ridge High School') else (0 if (F('campus') == 'Cypress Hollow Elementary'
      or F('campus') == 'Pecan Grove Elementary' or F('campus') == 'Hollis Middle School') else P('breakfast_charge_elementary')))
      if g_breakfasts >= 1 else 0
  - g_milk_days: COUNT('meal_transactions', within_months=1, date_field='transaction_date', event_type='meals_purchase', meal_type='milk_only')
  - g_milk_spent: SUM('meal_transactions','amount', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='milk_only')
  - g_milk_rate: P('milk_only_price') if g_milk_days >= K('regular_buys') else 0
  - g_milk_once: g_milk_spent if (g_milk_days >= 1 and g_milk_days < K('regular_buys')) else 0
  - g_second_days: COUNT('meal_transactions', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='second_meal')
  - g_second_spent: SUM('meal_transactions','amount', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='second_meal')
  - g_second_rate: P('second_meal_price') if g_second_days >= K('regular_buys') else 0
  - g_second_once: g_second_spent if (g_second_days >= 1 and g_second_days < K('regular_buys')) else 0
  - g_alacarte_month: SUM('meal_transactions','amount', within_months=1, date_field='transaction_date', event_type='meals_purchase',
      meal_type='a_la_carte')
  - g_alacarte_two_months: SUM('meal_transactions','amount', within_months=2, date_field='transaction_date', event_type='meals_purchase',
      meal_type='a_la_carte')
  - g_alacarte_keep: g_alacarte_month if g_alacarte_month > 0 else ((g_alacarte_two_months - g_alacarte_month) if g_alacarte_two_months
      > g_alacarte_month else 0)
  - g_day_charge: g_lunch_charge + g_breakfast_charge + g_milk_rate + g_second_rate
  - g_days_cost: g_days_left * g_day_charge + g_milk_once + g_second_once + g_alacarte_keep
  - g_total: g_days_cost - g_balance
  - result: RND(MX(0, g_total) + 0.000000001, 2)
  compute_basis:
    g_bal_in: The receiving account's balance for the rollover is its deposits, voids and transfers in less its purchases,
      refunds, transfers out and returned deposits, as they stand when the rollover is made.
    g_bal_out: The receiving account's balance for the rollover is its deposits, voids and transfers in less its purchases,
      refunds, transfers out and returned deposits, as they stand when the rollover is made.
    g_balance: The receiving account's balance for the rollover is its deposits, voids and transfers in less its purchases,
      refunds, transfers out and returned deposits, as they stand when the rollover is made.
    g_left_month_index: the month of the rollover date
    g_left_start: a rollover date before August 12, 2026 counts from August 12, 2026
    g_left_end: through the last day of that month on which that calendar serves meals
    g_left_span: the weekdays after the rollover date through the last day of that month on which that calendar serves meals
    g_left_weekday: the weekdays after the rollover date
    g_left_weekdays: the weekdays after the rollover date
    g_left_closed: less the calendar's closures that fall among them
    g_days_left: The serving days the rollover funds left in the month of the rollover date are the weekdays after the rollover
      date through the last day of that month on which that calendar serves meals, less the calendar's closures that fall
      among them; a rollover date before August 12, 2026 counts from August 12, 2026, and a rollover date in July 2026 or
      after May 27, 2027 leaves none; a rollover date outside July 2026 through June 2027 counts the standard five (days_week).
    g_enroll_campus: The lunch charge the rollover counts follows the campus on the student's enrollment record in status
      enrolled
    g_lunch_charge: 'The lunch charge the rollover counts follows the campus on the student''s enrollment record in status
      enrolled: the CEP meal charge at Cypress Hollow Elementary, Pecan Grove Elementary or Hollis Middle School; the secondary
      lunch charge of the student''s meal status at Ridgecrest Middle School, Calloway Creek High School or Mesquite Ridge
      High School; the elementary lunch charge of the student''s meal status at any other campus or when the student holds
      no enrollment record in status enrolled.'
    g_breakfasts: when a reimbursable breakfast was rung up on the account in the month before the rollover date
    g_breakfast_charge: 'The rollover adds a reimbursable breakfast to each serving day when a reimbursable breakfast was
      rung up on the account in the month before the rollover date: the secondary breakfast charge of the student''s meal
      status when the account''s campus is Ridgecrest Middle School, Calloway Creek High School or Mesquite Ridge High School;
      the elementary breakfast charge of the status when it is any other campus not listed in cep_campuses; nothing when no
      breakfast was rung up in that month or the account''s campus is listed in cep_campuses, where breakfast is served at
      no charge.'
    g_milk_days: by how many times it was rung up on the account in the month before the rollover date
    g_milk_spent: three purchases add once what the student spent on it in that month
    g_milk_rate: 'The rollover counts milk bought on its own by how many times it was rung up on the account in the month
      before the rollover date: four (regular_buys) or more purchases make a regular buyer, and the milk-only price is added
      to every serving day counted; one to three purchases add once what the student spent on it in that month; no purchase
      adds nothing.'
    g_milk_once: 'The rollover counts milk bought on its own by how many times it was rung up on the account in the month
      before the rollover date: four (regular_buys) or more purchases make a regular buyer, and the milk-only price is added
      to every serving day counted; one to three purchases add once what the student spent on it in that month; no purchase
      adds nothing.'
    g_second_days: by how many times it was rung up on the account in the month before the rollover date
    g_second_spent: three purchases add once what the student spent on it in that month
    g_second_rate: 'The rollover counts a second meal by how many times it was rung up on the account in the month before
      the rollover date: four (regular_buys) or more purchases make a regular buyer, and the second-meal price is added to
      every serving day counted; one to three purchases add once what the student spent on it in that month; no purchase adds
      nothing.'
    g_second_once: 'The rollover counts a second meal by how many times it was rung up on the account in the month before
      the rollover date: four (regular_buys) or more purchases make a regular buyer, and the second-meal price is added to
      every serving day counted; one to three purchases add once what the student spent on it in that month; no purchase adds
      nothing.'
    g_alacarte_month: when a la carte items were rung up on the account in the month before the rollover date
    g_alacarte_two_months: but some were in the month before it
    g_alacarte_keep: 'The rollover counts the snacks the student buys: when a la carte items were rung up on the account in
      the month before the rollover date, what was spent on them in that month is added; when none were rung up in that month
      but some were in the month before it, what was spent on them in that earlier month is added; otherwise nothing is added.'
    g_day_charge: first everything the schedules charge per serving day is added together into the day charge
    g_days_cost: then the day charge is multiplied by the serving days the schedules count and every amount the schedules
      add once is added
    g_total: then the receiving account's balance is subtracted
    result: The rollover amount is that total, never below nothing, rounded half up to the cent once, at the end; a rollover
      of zero moves nothing.
  factors:
  - id: rollover_serving_days
    effect: parameter
    decides: g_days_left
    bindings:
    - g_left_month_index
    - g_left_start
    - g_left_end
    - g_left_span
    - g_left_weekday
    - g_left_weekdays
    - g_left_closed
    - g_days_left
    ladder:
    - when: a rollover date from August 12, 2026 through May 27, 2027
      value: the weekdays after that date through the month's last serving day, less the calendar's closures among them
    - when: a rollover date from August 1 through August 11, 2026
      value: the weekdays from August 12 through August 31, 2026, less the calendar's closures among them
    - when: a rollover date in July 2026 or from May 28 through June 30, 2027
      value: '0'
    - when: a rollover date outside July 2026 through June 2027
      value: K('days_week')
    baseline:
      g_days_left: K('days_week')
    evidence:
    - date
    cross_difficulty: null
  - id: rollover_lunch
    effect: parameter
    decides: g_lunch_charge
    bindings:
    - g_enroll_campus
    - g_lunch_charge
    ladder:
    - when: the enrolled campus is Cypress Hollow Elementary, Pecan Grove Elementary or Hollis Middle School
      value: P('cep_meal_charge')
    - when: the enrolled campus is Ridgecrest Middle School, Calloway Creek High School or Mesquite Ridge High School
      value: P('lunch_charge_secondary')
    - when: any other enrolled campus, or no enrollment record in status enrolled
      value: P('lunch_charge_elementary')
    baseline:
      g_lunch_charge: P('lunch_charge_elementary')
    evidence:
    - cross_category
    cross_difficulty: enroll
  - id: rollover_breakfast
    effect: parameter
    decides: g_breakfast_charge
    bindings:
    - g_breakfasts
    - g_breakfast_charge
    ladder:
    - when: a breakfast rung up in the month before the rollover date, account campus Ridgecrest Middle School, Calloway Creek
        High School or Mesquite Ridge High School
      value: P('breakfast_charge_secondary')
    - when: a breakfast rung up in that month, any other account campus not listed in cep_campuses
      value: P('breakfast_charge_elementary')
    - when: no breakfast rung up in that month, or an account campus listed in cep_campuses
      value: '0'
    baseline:
      g_breakfast_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rollover_milk
    effect: method
    decides: g_milk_rate
    bindings:
    - g_milk_days
    - g_milk_spent
    - g_milk_rate
    - g_milk_once
    ladder:
    - when: milk bought on its own rung up four or more times in the month before the rollover date
      method: the milk-only price is added to every serving day counted
    - when: rung up one to three times in that month
      method: what was spent on it in that month is added once
    - when: not rung up in that month
      method: nothing is added
    baseline:
      g_milk_rate: '0'
      g_milk_once: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rollover_second_meal
    effect: method
    decides: g_second_rate
    bindings:
    - g_second_days
    - g_second_spent
    - g_second_rate
    - g_second_once
    ladder:
    - when: a second meal rung up four or more times in the month before the rollover date
      method: the second-meal price is added to every serving day counted
    - when: rung up one to three times in that month
      method: what was spent on it in that month is added once
    - when: not rung up in that month
      method: nothing is added
    baseline:
      g_second_rate: '0'
      g_second_once: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rollover_snacks
    effect: parameter
    decides: g_alacarte_keep
    bindings:
    - g_alacarte_month
    - g_alacarte_two_months
    - g_alacarte_keep
    ladder:
    - when: a la carte items rung up in the month before the rollover date
      value: what was spent on them in that month
    - when: none in that month, some in the month before it
      value: what was spent on them in that earlier month
    - when: none in either month
      value: '0'
    baseline:
      g_alacarte_keep: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The standard rollover amount funds five serving days (days_week), a school week, of one reimbursable lunch at the
      elementary lunch charge of the student's meal status, with nothing else added, less the receiving account's balance,
      so a negative balance adds its unpaid meal charges to the rollover. The receiving account's balance for the rollover
      is its deposits, voids and transfers in less its purchases, refunds, transfers out and returned deposits, as they stand
      when the rollover is made.
    params:
    - days_week
    - lunch_charge_elementary
  inputs:
    history: *id002
    cross_category:
    - enroll
