# Student enrollment, campus transfers and Pre-K admissions — Calloway Creek ISD.
category: enroll
display_name: Student Enrollment, Transfers and Pre-Kindergarten Admissions

binding:
  holding_table: enrollments
  event_tables: [enrollment_ledger, enrollment_records_log]
  intake_tables: [transfer_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [provisional, enrolled, withdrawn, year_completed]
  transitions:
    - {from: provisional, to: enrolled, by: agent, means: "Registration is verified: the proof of residency (or, for a household without an in-district residence, the approved transfer) and the required documents are on file."}
    - {from: provisional, to: withdrawn, by: system, means: "A provisional registration is withdrawn because residency was not established by the provisional deadline and no transfer applies."}
    - {from: enrolled, to: withdrawn, by: user, means: "The parent or guardian of record withdraws the student by signing the district withdrawal form; the withdrawal date is the last day of attendance."}
    - {from: enrolled, to: year_completed, by: system, means: "The school year closes and the enrollment record for that year is completed."}

accounts:
  - key: prek_tuition_due
    unit: USD
    meaning: "Amount the household owes on one enrollment for Pre-Kindergarten tuition; tuition charges, late fees and refunds disbursed increase it, payments and credits decrease it; a negative value is a credit balance owed to the family."

parameter_schema:
  enrollment_type: "Kind of enrollment; enum zone | intra_district_transfer | non_resident_transfer | choice_program | prekindergarten."
  campus_assignment_basis: "How the campus is decided; enum attendance_zone (the student's zoned_campus) | approved_transfer_request (the requested campus of an approved transfer request) | program_admission (the campus of the admitted program)."
  eligible_grades: "Grade levels the enrollment type admits; list of grade codes."
  requires_approved_transfer_request: "Whether the enrollment requires an approved transfer request for the same school year; boolean."
  transfer_category: "Transfer request category that leads to this enrollment type; enum space_available | employee_child | non_resident | choice_program | not_applicable."
  application_window_start: "First day of the annual request window, MM-DD in the calendar year the requested school year starts (choice program windows open in the preceding calendar year), or not_applicable."
  application_window_end: "Last day of the annual request window, MM-DD, inclusive, or not_applicable."
  decision_notice_date: "Date by which decisions on requests filed in the window are issued, MM-DD, or not_applicable."
  placement_acceptance_days: "Calendar days after the decision date within which the family must accept an approved placement, the decision date being day 0; 0 when not applicable."
  mid_year_requests_accepted: "Whether a request filed outside the annual window is considered for the current school year; boolean."
  mid_year_effective_rule: "When a mid-year approved placement takes effect; enum next_semester_start | upon_acceptance | not_applicable."
  transfer_term: "How long an approved placement lasts; enum single_school_year | through_campus_highest_grade | not_applicable."
  annual_renewal_required: "Whether the placement must be requested again for every school year; boolean."
  sibling_priority: "Whether a request for a student whose sibling attends the requested campus on a placement of the same type is decided ahead of other requests; boolean."
  employee_status_required: "Whether the household profile must be flagged as a district employee household; boolean."
  resident_required: "Whether the household profile must show an in-district residence; boolean."
  revocation_unexcused_absence_threshold: "Unexcused absences in one semester at which the placement may be revoked; integer, 0 when the placement is not revocable for attendance."
  revocation_tardy_threshold: "Tardies in one semester at which the placement may be revoked; integer, 0 when not revocable for tardies."
  revocation_on_daep_placement: "Whether a disciplinary alternative education program placement allows revocation; boolean."
  revocation_effective_point: "When a revocation takes effect; enum end_of_current_semester | not_applicable."
  revocation_notice_days: "Minimum calendar days between the written revocation notice and the effective date; integer."
  district_transportation_eligible: "Whether the enrollment type keeps the student eligible for regular district bus service to the campus attended; boolean."
  hub_shuttle_eligible: "Whether the enrollment type qualifies for the choice program hub shuttle; boolean."
  residency_proof_required: "Whether a proof of residency dated within the last 60 days must be on file for the school year; boolean."
  residency_proof_deadline_days: "Calendar days after the registration date within which a provisional registration must establish residency, the registration date being day 0; integer."
  residency_annual_reverification: "Whether residency is re-verified for every school year; boolean."
  birth_certificate_deadline_days: "Calendar days after the entry date within which a certified birth certificate or other proof of identity must be on file; integer."
  immunization_provisional_days: "Calendar days a student transferring from another Texas public school may attend provisionally while immunization records are obtained; integer."
  withdrawal_signer: "Who may sign the district withdrawal form; enum parent_or_guardian_of_record."
  withdrawal_effective_basis: "Which date a withdrawal takes; enum last_day_of_attendance."
  prek_age_by_cutoff: "Age a child must reach on or before prek_age_cutoff for each Pre-K grade; mapping grade -> years, empty for non-Pre-K types."
  prek_age_cutoff: "Date in the year the school year starts by which the age in prek_age_by_cutoff must be reached, MM-DD, or not_applicable."
  prek_eligibility_required: "Whether a state Pre-K eligibility basis must be on file; boolean."
  prek_eligibility_bases: "State eligibility bases accepted (Texas Education Code 29.153); list of enum emergent_bilingual | free_or_reduced_meals | homeless | military_connected | foster_care | star_of_texas_family."
  prek_eligibility_carries_to_pk4: "Whether a child admitted to PK3 on a state eligibility basis stays eligible for PK4 the next school year; boolean."
  instructional_day: "Length of the instructional day; enum full_day | half_day."
  monthly_tuition: "Monthly tuition charged for the enrollment type, USD per billing month; 0.00 where no tuition applies."
  tuition_billing_months: "Months of the school year in which tuition posts; list of month numbers in billing order."
  tuition_due_day: "Day of each billing month by which tuition is due; integer, 0 where no tuition applies."
  tuition_late_fee: "Fee posted once per billing month when tuition is unpaid after the due day, USD."
  tuition_late_fee_offset_days: "Calendar days after the due day on which the late fee posts; integer."
  half_month_start_day: "Day of the month on or after which a first billing month is charged at the half-month rate; integer, 0 where no tuition applies."
  half_month_rate_pct: "Share of monthly tuition charged for such a first month, percent."
  tuition_withdrawal_notice_days: "Calendar days of written notice before withdrawal after which tuition stops, the notice date being day 0; integer."
  tuition_sibling_discount_pct: "Tuition discount for each additional child of the household enrolled on the same tuition-based type in the same school year, percent."
  prior_balance_blocks_reenrollment: "Whether an unpaid tuition balance from an earlier school year blocks registration on this type; boolean."
  selection_method: "How placements are allotted; enum zone_assignment | first_come_space_available | lottery | eligibility_verification."
  choice_programs: "Programs admitted under the type, mapping program name -> campus; empty where not applicable."
  closed_campuses: "Campuses closed to new placements of this type for the school year; list of campus names."
  accepted_payment_methods: "Payment methods accepted for tuition; list of enum online_card | ach_bank_draft | personal_check | money_order; empty where no tuition applies."
  credit_balance_refund_days: "Calendar days after withdrawal or year completion within which a tuition credit balance is refunded; integer."

