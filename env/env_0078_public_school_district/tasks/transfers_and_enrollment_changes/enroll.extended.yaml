  - paper_add: K('rp_paper_two') if rq_count >= 2 else (K('rp_paper_one') if rq_count == 1 else 0.0)
  - ra_months: >-
      (int((SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_payment')) / SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))) if SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) > 0 else 0)
