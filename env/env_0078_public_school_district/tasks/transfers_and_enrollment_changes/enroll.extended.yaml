    arrears_add: >-
      Under the account-standing schedule, the whole months of arrears being the enrollment's tuition charges and late fees less its payments, divided by the most recent billing month's tuition charge and rounded down, credits not being payments, a family whose account shows three or more whole months of arrears on the day the credit is posted has arrears_three_add added to the credit, one with two such months has arrears_two_add added, and one with fewer has nothing added.
