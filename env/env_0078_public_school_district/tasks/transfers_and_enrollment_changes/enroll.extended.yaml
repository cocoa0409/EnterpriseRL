      aggregate: sum
      field: amount
      filters:
        event_type: enroll_tuition_charge
    - category: care
      table: care_enrollments
      aggregate: count
      field: status
      filters:
        status: active
    cross_category:
    - care
- id: enroll_ext_eligibility_month_credit
  base_policy_refs:
  - enroll_prek_admission
  - enroll_tuition_payments_and_refunds
  overwrite:
  - base_policy: enroll_prek_admission
    superseded_clause: >-
      The move takes effect on the first day of the billing month after the basis is on file; a tuition charge already posted for that month or a later one is credited in full with credit_reason eligibility_established, and months before it remain owed.
    replaced_by: >-
      The move to state-eligible Pre-K takes effect on the first day of the billing month after the basis is on file, a tuition charge already posted for that month or a later one is credited in full with credit_reason eligibility_established, and months before the basis month remain owed; the basis month itself, the enrollment's most recent billing month when the basis comes on file, is credited under the basis-month schedule with credit_reason eligibility_established.
  trigger: state_due
  subject:
  - enroll_tuition_credit
  computes: amount
  target_tool: credit_prek_eligibility_month_43743e06
  params:
    half_month_start_day: 16
    month_days_convention: 30
    arrears_two_add: 5.0
    arrears_three_add: 7.5
    paper_one_add: 2.5
    paper_two_add: 5.0
    hh_two_add: 5.0
    hh_three_add: 7.5
  rule: >-
    The move to state-eligible Pre-K takes effect on the first day of the billing month after the basis is on file, a tuition charge already posted for that month or a later one is credited in full with credit_reason eligibility_established, and months before the basis month remain owed; the basis month itself, the enrollment's most recent billing month when the basis comes on file, is credited under the basis-month schedule with credit_reason eligibility_established. The basis-month credit is posted against the tuition charged for the basis month, read from the child's School Nutrition meal account in status active as it stands on the day the credit is posted, and it is never more than that charge. The basis-month credit is 0.00, the basis month remaining owed. Under the basis-month proration convention, read from the meal tier the child's meal account holds: a Free Meal Status (Household Application), Reduced-Price Meal Status, Free Meal Status (Prior-Year Carryover) or Reduced-Price Meal Status (Prior-Year Carryover) tier that took effect no later than day half_month_start_day less one of the basis month has the whole month's tuition credited, and one that took effect on or after day half_month_start_day of the basis month has half of it credited; a Free Meal Status (Direct Certification) or Free Meal Status (Categorical Eligibility) tier is credited by calendar days on a month of month_days_convention days, that is the tuition multiplied by the days counted from the effective date (month_days_convention less the days from the first of the basis month to the effective date, never more than month_days_convention) and divided by month_days_convention; a tier that took effect in a month after the basis month, and any other tier, has nothing credited. Under the account-standing schedule, the whole months of arrears being the enrollment's tuition charges and late fees less its payments, divided by the most recent billing month's tuition charge and rounded down, credits not being payments, a family whose account shows three or more whole months of arrears on the day the credit is posted has arrears_three_add added to the credit, one with two such months has arrears_two_add added, and one with fewer has nothing added. Under the payment-method schedule, a family whose enrollment shows two or more tuition payments by personal_check or money_order in the school year has paper_two_add added to the credit, one with exactly one has paper_one_add added, and one with none has nothing added. Under the household-size schedule, a household with three or more children holding a School Nutrition meal account in status active has hh_three_add added to the credit, one with exactly two such children has hh_two_add added, and one with fewer has nothing added. A child whose meal account in status active holds no Free Meal Status or Reduced-Price Meal Status tier, who has no such account, or whose tier took effect in a month after the enrollment's most recent billing month, has no basis-month credit, additions included. The schedules are applied in one order: first the method that applies, then additions, then the limit to the basis month's tuition charge, and only that final amount is rounded to the nearest cent, half a cent rounding up.
  prerequisite: []
  cross_category:
  - category: meals
    as: branch
    reads:
    - variant_name
    - benefit_effective_date
    - meal_accounts.status
    note: >-
      The child's active meal account (status and the date it took effect) decides the credited tuition; the household's active meal accounts decide the household-size addition.
  compute:
  - bm_charge: >-
      SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))
  - bc_status: CFIELD('meals', 'variant_name', student_id=F('student_id'), status='active')
  - bc_eff: CFIELD('meals', 'benefit_effective_date', student_id=F('student_id'), status='active')
  - bc_later: >-
      1 if (bc_eff == None or MONTHS(LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge') + '-01', bc_eff) >= 1) else 0
  - bc_offset: >-
      DAYS(LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge') + '-01', bc_eff) if bc_eff != None else 0
  - credited_tuition: >-
      0.0 if bc_later == 1 else ((SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) if bc_offset <= K('half_month_start_day') - 2 else SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) * 0.5) if (bc_status == 'Free Meal Status (Household Application)' or bc_status == 'Reduced-Price Meal Status' or bc_status == 'Free Meal Status (Prior-Year Carryover)' or bc_status == 'Reduced-Price Meal Status (Prior-Year Carryover)') else ((SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) * MX(0.0, MN(K('month_days_convention'), K('month_days_convention') - bc_offset)) / K('month_days_convention')) if (bc_status == 'Free Meal Status (Direct Certification)' or bc_status == 'Free Meal Status (Categorical Eligibility)') else 0.0))
  - ba_months: >-
      (int((SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_payment')) / SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))) if SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) > 0 else 0)
  - arrears_add: K('arrears_three_add') if ba_months >= 3 else (K('arrears_two_add') if ba_months == 2 else 0.0)
  - bp_count: >-
      COUNT('enrollment_ledger', event_type='enroll_tuition_payment', payment_method='personal_check') + COUNT('enrollment_ledger', event_type='enroll_tuition_payment', payment_method='money_order')
  - paper_add: K('paper_two_add') if bp_count >= 2 else (K('paper_one_add') if bp_count == 1 else 0.0)
  - hs_children: XCOUNT('meals', 'meal_accounts', status='active')
  - hh_add: K('hh_three_add') if hs_children >= 3 else (K('hh_two_add') if hs_children == 2 else 0.0)
  - scope_status: CFIELD('meals', 'variant_name', student_id=F('student_id'), status='active')
  - scope_eff: CFIELD('meals', 'benefit_effective_date', student_id=F('student_id'), status='active')
  - added: >-
      (credited_tuition + arrears_add + paper_add + hh_add) if ((scope_status == 'Free Meal Status (Prior-Year Carryover)' or scope_status == 'Free Meal Status (Household Application)' or scope_status == 'Free Meal Status (Direct Certification)' or scope_status == 'Free Meal Status (Categorical Eligibility)' or scope_status == 'Reduced-Price Meal Status (Prior-Year Carryover)' or scope_status == 'Reduced-Price Meal Status') and scope_eff != None and MONTHS(LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge') + '-01', scope_eff) < 1) else 0.0
  - limited: MN(bm_charge, added)
  - result: RND(limited + 0.000000001, 2)
  compute_basis:
    bm_charge: The basis-month credit is posted against the tuition charged for the basis month
    bc_status: >-
      Under the basis-month proration convention, read from the meal tier the child's meal account holds: a Free Meal Status (Household Application), Reduced-Price Meal Status, Free Meal Status (Prior-Year Carryover) or Reduced-Price Meal Status (Prior-Year Carryover) tier that took effect no later than day half_month_start_day less one of the basis month has the whole month's tuition credited, and one that took effect on or after day half_month_start_day of the basis month has half of it credited; a Free Meal Status (Direct Certification) or Free Meal Status (Categorical Eligibility) tier is credited by calendar days on a month of month_days_convention days, that is the tuition multiplied by the days counted from the effective date (month_days_convention less the days from the first of the basis month to the effective date, never more than month_days_convention) and divided by month_days_convention; a tier that took effect in a month after the basis month, and any other tier, has nothing credited.
