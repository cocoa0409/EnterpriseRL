- id: enroll_ext_late_fee_share_reversal
  base_policy_refs:
  - enroll_tuition_payments_and_refunds
  - enroll_prek_admission
  overwrite: []
  trigger: state_due
  subject:
  - enroll_tuition_credit
  computes: amount
  target_tool: credit_prek_late_fee_reversal_2a81de73
  params:
    rp_paper_one: 2.5
    rp_paper_two: 5.0
    rp_arrears_two: 2.5
    rp_arrears_three: 5.0
    rp_hh_two: 2.0
    rp_hh_three: 3.0
  rule: >-
    When the most recent billing month's tuition charge carries an eligibility credit, the late fee posted for that billing month is reversed in whole or in part by a credit against the late fee with credit_reason eligibility_established. The reversal is worked out on the late fee posted for the enrollment's most recent billing month, the latest billing month that carries a tuition charge, and on that month's tuition charge, and it is never more than that late fee; a most recent billing month that carries no late fee has nothing reversed. The reversal is 0.00. Under the credited-share rule, when the eligibility credits standing against the most recent billing month's tuition charge equal or exceed that charge the whole late fee is reversed, when they are more than zero but less than the charge the late fee is reversed pro rata, that is multiplied by those credits and divided by the charge, and when no eligibility credit stands against the charge nothing is reversed under this rule. Under the payment-method schedule, a family whose enrollment shows two or more tuition payments by personal_check or money_order in the school year adds rp_paper_two to the reversal, one with exactly one adds rp_paper_one, and one with none adds nothing. Under the account-standing schedule, the whole months of arrears being the enrollment's tuition charges and late fees less its payments, divided by the most recent billing month's tuition charge and rounded down, credits not being payments, a family whose account shows three or more whole months of arrears on the day the reversal is posted adds rp_arrears_three to the reversal, one with two such months adds rp_arrears_two, and one with fewer adds nothing. Under the household-size schedule, a household with three or more children holding a School Nutrition meal account in status active adds rp_hh_three to the reversal, one with exactly two such children adds rp_hh_two, and one with fewer adds nothing. A late fee on a billing month whose tuition charge carries no eligibility credit has no reversal, additions included. The schedules are applied in one order: first the method that applies, then additions, then the limit to the late fee, and only that final amount is rounded to the nearest cent, half a cent rounding up. The late-fee reversal is not fixed until the eligibility credit owed on the month's tuition has been worked out and posted.
