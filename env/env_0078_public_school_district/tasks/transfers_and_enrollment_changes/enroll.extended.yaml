- id: enroll_ext_payment_plan_installment
  base_policy_refs:
  - enroll_tuition_payments_and_refunds
  overwrite:
  - base_policy: enroll_tuition_payments_and_refunds
    superseded_clause: >-
      Tuition is paid by the methods in accepted_payment_methods and is applied to the enrollment's oldest open charge first; a payment never moves to a sibling's enrollment.
    replaced_by: >-
      Tuition is paid by the methods in accepted_payment_methods and is applied to the enrollment's oldest open charge first, and a payment never moves to a sibling's enrollment; an advance payment under the advance-payment schedule is made only in the district's online payment portal, which takes online_card and ach_bank_draft, a first installment under the payment-plan schedule is likewise made only in that portal, and every other tuition payment may still be made by personal_check or money_order at the campus cashier.
  trigger: on_request
  subject:
  - enroll_tuition_payment
  computes: amount
  target_tool: pay_prek_plan_installment_1e1e8562
  params:
    plan_installments_standard: 2
    plan_four_from: 1000.0
    plan_three_from: 500.0
    down_payment_pct: 20
    closing_recent_days: 30
    closing_recent_down: 25.0
    closing_down: 15.0
    paper_one_down: 10.0
    paper_two_down: 20.0
    free_extra: 2
    reduced_extra: 1
    hh_two_extra: 1
    hh_three_extra: 2
  rule: >-
    A family may settle the open balance of a Pre-K tuition account under the board-approved payment plan, whose first installment the parent or guardian pays personally in the district's online payment portal (district staff never take card or bank details); the later installments fall due on the first day of each following month. Tuition is paid by the methods in accepted_payment_methods and is applied to the enrollment's oldest open charge first, and a payment never moves to a sibling's enrollment; an advance payment under the advance-payment schedule is made only in the district's online payment portal, which takes online_card and ach_bank_draft, a first installment under the payment-plan schedule is likewise made only in that portal, and every other tuition payment may still be made by personal_check or money_order at the campus cashier. The open balance is the enrollment's tuition charges, late fees and refunds less its payments and credits; the plan neither charges a fee nor changes the balance, so the installments together equal the open balance. The plan divides the open balance into plan_installments_standard equal installments, and the first installment is one of them. Under the plan-length schedule, an open balance of plan_four_from or more is divided into four installments, one of plan_three_from or more but less than plan_four_from into three, and a smaller one into plan_installments_standard. Under the down-payment rule, an enrollment carrying two or more late fees in the school year pays down_payment_pct percent of the open balance as a down payment in the first installment before the rest is divided, one carrying exactly one late fee pays the amount of that late fee as posted, whatever credits stand against it, as the down payment, and one carrying none pays no down payment. A family whose child's meal account in status active holds any Free Meal Status tier has the plan spread over free_extra more installments, one whose child's meal account holds any Reduced-Price Meal Status tier over reduced_extra more, and any other family over none more. Under the closing-account schedule, a plan on an enrollment whose move to Pre-Kindergarten (State-Eligible) took effect no more than closing_recent_days days before the day the plan is set up, so that no more tuition posts on it, adds closing_recent_down to the down payment, one whose move took effect earlier adds closing_down, and a plan on any other enrollment adds nothing. Under the payment-method schedule, a family whose enrollment shows two or more tuition payments by personal_check or money_order in the school year adds paper_two_down to the down payment, one with exactly one adds paper_one_down, and one with none adds nothing. Under the household-size schedule, a household with three or more children holding a School Nutrition meal account in status active has the plan spread over hh_three_extra more installments, one with exactly two such children over hh_two_extra more, and one with fewer over none more. An account whose open balance is zero or less has no plan and pays no installment. The schedules are applied in one order: first the amounts set aside are combined, never more than the open balance, then the number of installments is fixed as the sum of the installment counts, then the rest of the open balance is divided by that number and one share is added to the amounts set aside, and only that final amount is rounded to the nearest cent, half a cent rounding up. The first installment of a payment plan is not fixed until the eligibility-transition waiver owed on the late fee of the enrollment's most recent billing month has been worked out and posted.
  prerequisite:
  - problem: enroll_ext_late_fee_transition_waiver
    kind: value_input
    gate: pl_open
    form: action
    policy_source: >-
      The first installment of a payment plan is not fixed until the eligibility-transition waiver owed on the late fee of the enrollment's most recent billing month has been worked out and posted.
    fallback_reason: >-
      The eligibility-transition schedule owes nothing for a late fee on a billing month whose tuition charge carries no eligibility credit, which books no row, so no record-visible state singles out a waiver worked out at nothing; the dependency is stated as the action.
    condition: >-
      The late fee of the enrollment's most recent billing month carries the waiver the eligibility-transition schedule gives (an enroll_tuition_credit row with credit_reason billing_correction whose source is that late fee), or the schedule owes nothing.
    resolved_by: credit_prek_late_fee_waiver_decba573
    effect: The waiver credit lowers the open balance the plan divides.
  cross_category:
  - category: meals
    as: branch
    reads:
    - variant_name
    - meal_accounts.status
    note: >-
      The child's active meal account decides the extra installments; the household's active meal accounts decide the household-size installments.
  compute:
  - pl_open: >-
      SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_refund') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_payment') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_credit')
  - ls_open: >-
      SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_refund') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_payment') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_credit')
  - plan_count: >-
      4 if ls_open >= K('plan_four_from') else (3 if (ls_open >= K('plan_three_from') and ls_open < K('plan_four_from')) else K('plan_installments_standard'))
  - dp_fees: COUNT('enrollment_ledger', event_type='enroll_tuition_late_fee')
  - dp_open: >-
      SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_refund') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_payment') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_credit')
  - down_payment: >-
      dp_open * K('down_payment_pct') / 100 if dp_fees >= 2 else (SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_late_fee')) if dp_fees == 1 else 0.0)
  - me_status: CFIELD('meals', 'variant_name', student_id=F('student_id'), status='active')
  - extra_installments: >-
      K('free_extra') if (me_status == 'Free Meal Status (Prior-Year Carryover)' or me_status == 'Free Meal Status (Household Application)' or me_status == 'Free Meal Status (Direct Certification)' or me_status == 'Free Meal Status (Categorical Eligibility)') else (K('reduced_extra') if (me_status == 'Reduced-Price Meal Status (Prior-Year Carryover)' or me_status == 'Reduced-Price Meal Status') else 0)
  - ca_days: >-
      DAYS(F('transfer_effective_date'), NOW) if (F('variant_name') == 'Pre-Kindergarten (State-Eligible)' and F('transfer_effective_date') != None and F('transfer_effective_date') != '') else -1
  - closing_down_add: >-
      K('closing_recent_down') if (ca_days >= 0 and ca_days <= K('closing_recent_days')) else (K('closing_down') if ca_days > K('closing_recent_days') else 0.0)
  - pd_count: >-
      COUNT('enrollment_ledger', event_type='enroll_tuition_payment', payment_method='personal_check') + COUNT('enrollment_ledger', event_type='enroll_tuition_payment', payment_method='money_order')
  - paper_down: K('paper_two_down') if pd_count >= 2 else (K('paper_one_down') if pd_count == 1 else 0.0)
  - hi_children: XCOUNT('meals', 'meal_accounts', status='active')
  - hh_extra: K('hh_three_extra') if hi_children >= 3 else (K('hh_two_extra') if hi_children == 2 else 0)
  - set_aside: MN(MX(0.0, pl_open), down_payment + closing_down_add + paper_down)
  - installments: plan_count + extra_installments + hh_extra
  - pl_scope: 1 if pl_open > 0 else 0
  - first_installment: (set_aside + (pl_open - set_aside) / installments) if pl_scope == 1 else 0.0
  - result: RND(first_installment + 0.000000001, 2)
  compute_basis:
    pl_open: >-
      The open balance is the enrollment's tuition charges, late fees and refunds less its payments and credits
    ls_open: >-
      Under the plan-length schedule, an open balance of plan_four_from or more is divided into four installments, one of plan_three_from or more but less than plan_four_from into three, and a smaller one into plan_installments_standard.
    plan_count: >-
      Under the plan-length schedule, an open balance of plan_four_from or more is divided into four installments, one of plan_three_from or more but less than plan_four_from into three, and a smaller one into plan_installments_standard.
    dp_fees: >-
      Under the down-payment rule, an enrollment carrying two or more late fees in the school year pays down_payment_pct percent of the open balance as a down payment in the first installment before the rest is divided, one carrying exactly one late fee pays the amount of that late fee as posted, whatever credits stand against it, as the down payment, and one carrying none pays no down payment.
    dp_open: >-
      Under the down-payment rule, an enrollment carrying two or more late fees in the school year pays down_payment_pct percent of the open balance as a down payment in the first installment before the rest is divided, one carrying exactly one late fee pays the amount of that late fee as posted, whatever credits stand against it, as the down payment, and one carrying none pays no down payment.
    down_payment: >-
      Under the down-payment rule, an enrollment carrying two or more late fees in the school year pays down_payment_pct percent of the open balance as a down payment in the first installment before the rest is divided, one carrying exactly one late fee pays the amount of that late fee as posted, whatever credits stand against it, as the down payment, and one carrying none pays no down payment.
    me_status: >-
      A family whose child's meal account in status active holds any Free Meal Status tier has the plan spread over free_extra more installments, one whose child's meal account holds any Reduced-Price Meal Status tier over reduced_extra more, and any other family over none more.
    extra_installments: >-
      A family whose child's meal account in status active holds any Free Meal Status tier has the plan spread over free_extra more installments, one whose child's meal account holds any Reduced-Price Meal Status tier over reduced_extra more, and any other family over none more.
    ca_days: >-
      Under the closing-account schedule, a plan on an enrollment whose move to Pre-Kindergarten (State-Eligible) took effect no more than closing_recent_days days before the day the plan is set up, so that no more tuition posts on it, adds closing_recent_down to the down payment, one whose move took effect earlier adds closing_down, and a plan on any other enrollment adds nothing.
    closing_down_add: >-
      Under the closing-account schedule, a plan on an enrollment whose move to Pre-Kindergarten (State-Eligible) took effect no more than closing_recent_days days before the day the plan is set up, so that no more tuition posts on it, adds closing_recent_down to the down payment, one whose move took effect earlier adds closing_down, and a plan on any other enrollment adds nothing.
    pd_count: >-
      Under the payment-method schedule, a family whose enrollment shows two or more tuition payments by personal_check or money_order in the school year adds paper_two_down to the down payment, one with exactly one adds paper_one_down, and one with none adds nothing.
    paper_down: >-
      Under the payment-method schedule, a family whose enrollment shows two or more tuition payments by personal_check or money_order in the school year adds paper_two_down to the down payment, one with exactly one adds paper_one_down, and one with none adds nothing.
    hi_children: >-
      Under the household-size schedule, a household with three or more children holding a School Nutrition meal account in status active has the plan spread over hh_three_extra more installments, one with exactly two such children over hh_two_extra more, and one with fewer over none more.
    hh_extra: >-
      Under the household-size schedule, a household with three or more children holding a School Nutrition meal account in status active has the plan spread over hh_three_extra more installments, one with exactly two such children over hh_two_extra more, and one with fewer over none more.
    set_aside: first the amounts set aside are combined, never more than the open balance
    installments: then the number of installments is fixed
    pl_scope: An account whose open balance is zero or less has no plan and pays no installment.
    first_installment: >-
      then the rest of the open balance is divided by that number and one share is added to the amounts set aside
    result: and only that final amount is rounded to the nearest cent, half a cent rounding up.
  factors:
  - id: plan_length_schedule
    effect: parameter
    decides: plan_count
    bindings:
    - ls_open
    - plan_count
    ladder:
    - when: an open balance of plan_four_from or more
      value: '4'
    - when: an open balance of plan_three_from or more but less than plan_four_from
      value: '3'
    - when: otherwise
      value: K('plan_installments_standard')
    baseline:
      plan_count: K('plan_installments_standard')
    evidence:
    - history
    cross_difficulty: null
  - id: down_payment_terms
    effect: method
    decides: down_payment
    bindings:
    - dp_fees
    - dp_open
    - down_payment
    ladder:
    - when: two or more late fees on the enrollment in the school year
      method: down_payment_pct percent of the open balance is paid down before the rest is divided
    - when: exactly one late fee
      method: >-
        the amount of that late fee as posted, whatever credits stand against it, is paid down before the rest is divided
    - when: otherwise
      method: no down payment; the whole open balance is divided
    baseline:
      down_payment: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: meal_status_extra_installment
    effect: parameter
    decides: extra_installments
    bindings:
    - me_status
    - extra_installments
    ladder:
    - when: the child's meal account in status active holds any Free Meal Status tier
      value: K('free_extra')
    - when: it holds any Reduced-Price Meal Status tier
      value: K('reduced_extra')
    - when: otherwise
      value: '0'
    baseline:
      extra_installments: '0'
    evidence:
    - cross_category
    cross_difficulty: meals
  - id: closing_account_down
    effect: parameter
    decides: closing_down_add
    bindings:
    - ca_days
    - closing_down_add
    ladder:
    - when: >-
        the enrollment's move to Pre-Kindergarten (State-Eligible) took effect no more than closing_recent_days days before the day the plan is set up
      value: K('closing_recent_down')
    - when: the move took effect more than closing_recent_days days before that day
      value: K('closing_down')
    - when: otherwise
      value: '0.00'
    baseline:
      closing_down_add: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: paper_down_addition
    effect: parameter
    decides: paper_down
    bindings:
    - pd_count
    - paper_down
    ladder:
    - when: two or more payments by personal_check or money_order in the school year
      value: K('paper_two_down')
    - when: exactly one
      value: K('paper_one_down')
    - when: otherwise
      value: '0.00'
    baseline:
      paper_down: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: household_size_installments
    effect: parameter
    decides: hh_extra
    bindings:
    - hi_children
    - hh_extra
    ladder:
    - when: three or more of the household's children hold a School Nutrition meal account in status active
      value: K('hh_three_extra')
    - when: exactly two do
      value: K('hh_two_extra')
    - when: otherwise
      value: '0'
    baseline:
      hh_extra: '0'
    evidence:
    - cross_category
    cross_difficulty: meals
  baseline:
    rule: >-
      The plan divides the open balance into plan_installments_standard equal installments, and the first installment is one of them.
    params:
    - plan_installments_standard
  inputs:
    history:
    - table: enrollment_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: enroll_tuition_payment
    - table: enrollment_ledger
      aggregate: count
      field: amount
      filters:
        event_type: enroll_tuition_late_fee
    cross_category:
    - meals
