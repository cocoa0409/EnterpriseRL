events:
  - type: enroll_registration
    target: enrollments
    mutation: create
    meaning: "A household registers a student for a school year on one enrollment type at one campus and grade."
    grain: "One row per student per school year registration."
    fields:
      customer_id: "Household registering the student."
      student_id: "Student registered."
      variant_name: "Official enrollment type."
      campus: "Campus assigned under the type's campus_assignment_basis."
      grade_level: "Grade level placed."
      school_year: "School year, YYYY-YY."
      entry_type: "new_to_district, returning_student or re_entry."
      registration_date: "Date the registration was submitted."
      entry_date: "First day of attendance."
      prek_eligibility_basis: "State Pre-K eligibility basis on file, or not_applicable."
      approved_transfer_request_id: "Approved transfer request the placement rests on, empty for zone and Pre-K enrollments."
    triggers:
      - event: meals:meals_account_open
        when: {entry_type: new_to_district}
        map: {student_id: student_id, campus: campus, opened_date: registration_date}
      - event: enroll:enroll_tuition_charge
        when: {variant_name: "Pre-Kindergarten (Tuition-Based)"}
        map: {}
  - type: enroll_verification_complete
    target: enrollments
    mutation: {transition: {from: provisional, to: enrolled}}
    meaning: "The registrar verifies residency and the required documents and the registration becomes a full enrollment."
    grain: "One row per transaction."
    fields:
      residency_verified_date: "Date residency was verified for the school year; empty when residency proof is not required for the type."
    triggers: []
  - type: enroll_residency_lapse
    target: enrollments
    mutation: {transition: {from: provisional, to: withdrawn}}
    meaning: "A provisional registration is withdrawn because residency was not established by the deadline."
    grain: "One row per transaction."
    fields:
      withdrawal_date: "Last day of attendance."
      leaver_reason: "residency_not_established."
    triggers:
      - event: meals:meals_account_inactivate
        map: {inactive_date: withdrawal_date}
  - type: enroll_withdrawal
    target: enrollments
    mutation: {transition: {from: enrolled, to: withdrawn}}
    meaning: "The parent or guardian of record withdraws the student from the district."
    grain: "One row per transaction."
    fields:
      withdrawal_date: "Last day of attendance."
      leaver_reason: "Reason recorded on the withdrawal form."
    triggers:
      - event: meals:meals_account_inactivate
        map: {inactive_date: withdrawal_date}
      - event: transport:transport_eligibility_end
        map: {end_date: withdrawal_date, end_reason: district_withdrawal}
      - event: care:care_program_end
        map: {end_date: withdrawal_date}
  - type: enroll_year_end
    target: enrollments
    mutation: {transition: {from: enrolled, to: year_completed}}
    meaning: "The school year closes and the enrollment record for that year is completed."
    grain: "One row per transaction."
    fields:
      withdrawal_date: "Last instructional day of the school year."
      leaver_reason: "graduated for a grade 12 graduate, otherwise not_applicable."
    triggers: []
  - type: enroll_transfer_placement
    target: enrollments
    mutation: update
    meaning: "An approved and accepted transfer or choice program placement moves the student's enrollment to the placement's type and campus."
    grain: "One row per placement applied."
    fields:
      variant_name: "Official enrollment type of the placement."
      campus: "Campus of the placement."
      approved_transfer_request_id: "Approved transfer request applied."
      transfer_effective_date: "Date the placement takes effect."
    triggers:
      - event: meals:meals_campus_change
        map: {campus: campus}
  - type: enroll_transfer_revocation
    target: enrollments
    mutation: update
    meaning: "A revoked transfer or choice placement returns the student to the zoned campus on Attendance Zone Enrollment."
    grain: "One row per revocation applied."
    fields:
      variant_name: "Attendance Zone Enrollment."
      campus: "The student's zoned campus."
      transfer_effective_date: "Date the revocation takes effect."
    triggers:
      - event: meals:meals_campus_change
        map: {campus: campus}
  - type: enroll_prek_eligibility_change
    target: enrollments
    mutation: update
    meaning: "A tuition-based Pre-K enrollment moves to state-eligible Pre-K because an eligibility basis is established."
    grain: "One row per eligibility change."
    fields:
      variant_name: "Pre-Kindergarten (State-Eligible)."
      prek_eligibility_basis: "Eligibility basis established."
      transfer_effective_date: "First day of the billing month from which tuition no longer applies."
    triggers: []
  - type: enroll_tuition_charge
    target: enrollment_ledger
    meaning: "One billing month's Pre-K tuition is posted."
    grain: "One row per enrollment per billing month."
    distinguish_by: [billing_month]
    fields:
      amount: "Tuition charged, positive USD."
      posted_date: "Date posted."
      billing_month: "Billing month, YYYY-MM."
      proration: "full_month or half_month."
      sibling_discount_applied: "Whether the tuition sibling discount was applied."
    account: prek_tuition_due
    direction: in
    triggers: []
  - type: enroll_tuition_late_fee
    target: enrollment_ledger
    meaning: "The monthly tuition late fee is posted."
    grain: "One row per enrollment per billing month."
    distinguish_by: [billing_month]
    fields:
      amount: "Late fee, positive USD."
      posted_date: "Date posted."
      billing_month: "Billing month whose tuition was late."
    account: prek_tuition_due
    direction: in
    triggers: []
  - type: enroll_tuition_payment
    target: enrollment_ledger
    meaning: "A family tuition payment is applied."
    grain: "One row per payment confirmation."
    distinguish_by: [payment_reference]
    fields:
      amount: "Payment amount, positive USD."
      posted_date: "Date posted."
      payment_method: "online_card, ach_bank_draft, personal_check or money_order."
      payment_reference: "Payment confirmation number exactly as issued."
    account: prek_tuition_due
    direction: out
    triggers: []
  - type: enroll_tuition_credit
    target: enrollment_ledger
    meaning: "A credit offsets one specific tuition charge or late fee."
    grain: "One row per credited source charge per reason."
    distinguish_by: [source_enrollment_ledger_id, credit_reason]
    fields:
      amount: "Credit amount, positive USD, never more than the source charge."
      posted_date: "Date posted."
      credit_reason: "eligibility_established, withdrawal_after_notice or billing_correction."
      source_enrollment_ledger_id: "Reference of the charge credited."
    account: prek_tuition_due
    direction: out
    triggers: []
  - type: enroll_tuition_refund
    target: enrollment_ledger
    meaning: "A tuition credit balance on a closed enrollment is refunded by district check."
    grain: "One row per refund issued."
    distinguish_by: [posted_date]
    fields:
      amount: "Refund amount, positive USD."
      posted_date: "Date issued."
    account: prek_tuition_due
    direction: in
    triggers: []
  - type: enroll_document_received
    target: enrollment_records_log
    meaning: "The registrar logs a registration document accepted for the enrollment."
    grain: "One row per document type per date received."
    distinguish_by: [document_type, received_date]
    fields:
      document_type: "proof_of_residency, birth_certificate, immunization_record, prior_school_records, prek_eligibility_proof, employee_verification or withdrawal_notice."
      received_date: "Date the document was accepted."
      document_date: "Date printed on the document (issue or statement date)."
    triggers: []

measures:
  - id: enroll_msr_tuition_siblings
    window: "The school year of the tuition charge."
    measure: "Count of the household's other enrollments on Pre-Kindergarten (Tuition-Based) for that school year in status provisional or enrolled whose registration_date is earlier than this enrollment's (ties broken by the earlier entry_date)."
  - id: enroll_msr_prior_tuition_balance
    window: "All school years before the school year being registered."
    measure: "Sum over the household's enrollments of earlier school years of prek_tuition_due deltas: tuition charges, late fees and refunds less payments and credits."

policies:
  - id: enroll_agg_multi_holding
    subject: [enroll_registration]
    rule: >-
      A household may enroll any number of students, and each enrollment record covers one student for one school year.
      A student is registered only when the student has no other enrollment for the same school year in status provisional or enrolled.
      A student who withdrew may be registered again in the same school year with entry_type re_entry, and a continuing student is registered for each new school year with entry_type returning_student; a student never attending the district before is new_to_district.
    eligibility:
      - id: one_open_enrollment_per_year
        applies_to: [enroll_registration]
        kind: dedup
        condition: "A student is registered only when the student has no other enrollment for the same school year in status provisional or enrolled."
        evidence_fields: [enrollments.student_id, enrollments.school_year, enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.student_id, enrollments.school_year]
          action_bindings:
            enrollments.student_id: student_id
            enrollments.school_year: school_year
        dedup_contract:
          table: enrollments
          mode: separate_record
          object_bindings: {student_id: student_id, school_year: school_year}
          duplicate_filters: {status: [provisional, enrolled]}
          distinct_fields: []
    params:
      max_per_customer: null
      max_open_enrollments_per_student_per_school_year: 1

  - id: enroll_agg_tuition_siblings
    subject: [enroll_tuition_charge]
    rule: >-
      The tuition sibling discount is decided across the household's enrollments of the same school year on Pre-Kindergarten (Tuition-Based).
      The child registered first (earliest registration_date, then earliest entry_date) pays the full monthly_tuition; each other child counted by enroll_msr_tuition_siblings receives tuition_sibling_discount_pct on every tuition charge.
      Children on Pre-Kindergarten (State-Eligible) or on any other enrollment type are not counted, and Creek Kids Club or other program enrollments never count toward this discount.
    eligibility: []
    measures: [enroll_msr_tuition_siblings]

  - id: enroll_registration_and_residency
    subject: [enroll_registration, enroll_verification_complete, enroll_residency_lapse, enroll_document_received]
    rule: >-
      A new registration starts provisional and the student attends from the entry_date.
      For an enrollment type whose resident_required is true, a student is registered only when the household profile shows an in-district residence.
      A provisional registration becomes enrolled only once the documents the type requires are on file for that enrollment: a proof of residency whose document_date is no more than 60 days before its received_date when residency_proof_required is true, and a birth certificate for a new_to_district student.
      When residency is not established within residency_proof_deadline_days calendar days after the registration date, the registration date being day 0, the registration is withdrawn with leaver_reason residency_not_established.
      A missing birth certificate after birth_certificate_deadline_days calendar days from the entry_date is referred to local law enforcement as Texas Education Code 25.002 requires and does not end the enrollment; a student transferring from another Texas public school may attend for immunization_provisional_days calendar days while immunization records are obtained.
      When residency_annual_reverification is true, a returning_student registration needs a new proof of residency for the new school year.
    eligibility:
      - id: in_district_residence
        applies_to: [enroll_registration]
        kind: state
        condition: "For an enrollment type whose resident_required is true, a student is registered only when the household profile shows an in-district residence."
        evidence_fields: [customers.in_district_residence, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
        state_contract:
          field: customers.in_district_residence
          allowed: [true]
      - id: documents_on_file
        applies_to: [enroll_verification_complete]
        kind: authorization
        condition: "A provisional registration becomes enrolled only once the documents the type requires are on file for that enrollment: a proof of residency whose document_date is no more than 60 days before its received_date when residency_proof_required is true, and a birth certificate for a new_to_district student."
        evidence_fields: [enrollment_records_log.enrollment_id, enrollment_records_log.document_type, enrollment_records_log.document_date, enrollment_records_log.received_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollment_records_log.enrollment_id]
          action_bindings:
            enrollment_records_log.enrollment_id: enrollment_id
    params:
      residency_proof_max_age_days: 60
      per_tier:
        "Attendance Zone Enrollment": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Intra-District Transfer (Space Available)": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Intra-District Transfer (Employee Child)": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Non-Resident Transfer": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Choice Program Enrollment": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Pre-Kindergarten (State-Eligible)": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}
        "Pre-Kindergarten (Tuition-Based)": {resident_required: "=resident_required", residency_proof_required: "=residency_proof_required"}

  - id: enroll_transfer_requests
    subject: [enroll_transfer_placement]
    rule: >-
      A transfer or choice placement rests on a transfer request of the matching transfer_category for the school year it names.
      Requests are taken from application_window_start through application_window_end, both days included; a request filed outside the window is considered for the current school year only when mid_year_requests_accepted is true, and then takes effect as mid_year_effective_rule states.
      Space-available and non-resident requests are decided first come by created_at, after sibling-priority requests, and no placement of the type is made at a campus listed in closed_campuses; choice program seats are allotted by lottery; an employee child request requires the household profile to be flagged as a district employee household.
      A placement is applied only for a transfer request whose request_status is approved.
      An approved placement is applied only when the family accepts it within placement_acceptance_days after the district issues the transfer decision, counted in calendar days with the decision date as day 0, and an acceptance on the last day still counts; an approval not accepted in time lapses and the student stays on the current enrollment.
      Once applied, the enrollment takes the placement's type and campus from the transfer_effective_date.
    eligibility:
      - id: request_approved
        applies_to: [enroll_transfer_placement]
        kind: state
        condition: "A placement is applied only for a transfer request whose request_status is approved."
        evidence_fields: [transfer_requests.request_status, transfer_requests.transfer_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [transfer_requests.transfer_request_id]
          action_bindings:
            transfer_requests.transfer_request_id: transfer_request_id
        state_contract:
          field: transfer_requests.request_status
          allowed: [approved]
      - id: acceptance_window
        applies_to: [enroll_transfer_placement]
        kind: time
        condition: "An approved placement is applied only when the family accepts it within placement_acceptance_days after the district issues the transfer decision, counted in calendar days with the decision date as day 0, and an acceptance on the last day still counts; an approval not accepted in time lapses and the student stays on the current enrollment."
        evidence_fields: [transfer_requests.decision_date, transfer_requests.transfer_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [transfer_requests.transfer_request_id]
          action_bindings:
            transfer_requests.transfer_request_id: transfer_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the district issues the transfer decision"
          anchor_source: transfer_requests.decision_date
          relation: not_after
          duration_source: variants.placement_acceptance_days
          unit: calendar_days
          counting_rule: "counted in calendar days with the decision date as day 0"
          boundary: inclusive
    params:
      per_tier:
        "Attendance Zone Enrollment": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Intra-District Transfer (Space Available)": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Intra-District Transfer (Employee Child)": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Non-Resident Transfer": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Choice Program Enrollment": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Pre-Kindergarten (State-Eligible)": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}
        "Pre-Kindergarten (Tuition-Based)": {application_window_start: "=application_window_start", application_window_end: "=application_window_end", closed_campuses: "=closed_campuses"}

  - id: enroll_transfer_effects
    subject: [enroll_transfer_placement, enroll_transfer_revocation, enroll_registration]
    rule: >-
      The enrollment type a student holds changes what other district programs owe the student.
      When the type's district_transportation_eligible is false, the student is not eligible for regular district bus service to the campus attended, whatever the distance, and the family provides transportation; a Choice Program Enrollment student instead qualifies for the choice program hub shuttle because hub_shuttle_eligible is true.
      A placement whose transfer_term is through_campus_highest_grade continues each following school year at the same campus without a new request, and the returning_student registration keeps the type; a placement whose transfer_term is single_school_year (annual_renewal_required) needs a newly approved request for every school year, and without one the student is registered on Attendance Zone Enrollment at the zoned campus.
      A student moving to the next campus level (elementary to middle school, middle school to high school) returns to the zoned campus of the new level unless a new request is approved.
      A change of residence within the district changes the zoned campus but does not end an approved placement.
    eligibility: []
    params:
      per_tier:
        "Attendance Zone Enrollment": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Intra-District Transfer (Space Available)": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Intra-District Transfer (Employee Child)": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Non-Resident Transfer": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Choice Program Enrollment": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Pre-Kindergarten (State-Eligible)": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}
        "Pre-Kindergarten (Tuition-Based)": {district_transportation_eligible: "=district_transportation_eligible", hub_shuttle_eligible: "=hub_shuttle_eligible", transfer_term: "=transfer_term"}

  - id: enroll_transfer_revocation_rules
    subject: [enroll_transfer_revocation]
    rule: >-
      A transfer or choice placement may be revoked by the campus principal when, in one semester, the student reaches revocation_unexcused_absence_threshold unexcused absences or revocation_tardy_threshold tardies (a threshold of 0 means the placement is not revocable on that ground), or when the student is placed in a disciplinary alternative education program and revocation_on_daep_placement is true.
      A revocation takes effect only at the end of the current semester (revocation_effective_point), and only when it is no earlier than revocation_notice_days after the campus issues the written revocation notice, counted in calendar days with the notice date as day 0; when the semester ends sooner, the revocation takes effect at the end of the following semester.
      On revocation the student returns to the zoned campus on Attendance Zone Enrollment and the transfer request's request_status becomes revoked; the family may file a new request in a later window.
      Attendance Zone Enrollment and Pre-Kindergarten enrollments are never revoked under this policy.
    eligibility:
      - id: revocation_notice_period
        applies_to: [enroll_transfer_revocation]
        kind: time
        condition: "A revocation takes effect only at the end of the current semester (revocation_effective_point), and only when it is no earlier than revocation_notice_days after the campus issues the written revocation notice, counted in calendar days with the notice date as day 0; when the semester ends sooner, the revocation takes effect at the end of the following semester."
        evidence_fields: [transfer_requests.revocation_notice_date, transfer_requests.transfer_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [transfer_requests.transfer_request_id]
          action_bindings:
            transfer_requests.transfer_request_id: transfer_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the campus issues the written revocation notice"
          anchor_source: transfer_requests.revocation_notice_date
          relation: not_before
          duration_source: variants.revocation_notice_days
          unit: calendar_days
          counting_rule: "counted in calendar days with the notice date as day 0"
          boundary: inclusive
    params:
      per_tier:
        "Attendance Zone Enrollment": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Intra-District Transfer (Space Available)": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Intra-District Transfer (Employee Child)": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Non-Resident Transfer": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Choice Program Enrollment": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Pre-Kindergarten (State-Eligible)": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}
        "Pre-Kindergarten (Tuition-Based)": {revocation_unexcused_absence_threshold: "=revocation_unexcused_absence_threshold", revocation_tardy_threshold: "=revocation_tardy_threshold"}

  - id: enroll_prek_admission
    subject: [enroll_registration, enroll_prek_eligibility_change, enroll_tuition_credit]
    rule: >-
      A Pre-K child must reach the age in prek_age_by_cutoff for the grade on or before prek_age_cutoff of the year the school year starts, judged from the student's date of birth on the student record.
      Pre-Kindergarten (State-Eligible) admits a child with at least one basis in prek_eligibility_bases on file: emergent_bilingual when the student record shows emergent bilingual identification; free_or_reduced_meals when the student's School Nutrition meal account holds any Free Meal Status or Reduced-Price Meal Status tier; homeless when the student record shows homeless_mckinney_vento; foster_care when it shows foster_care; military_connected when it shows a military-connected parent; star_of_texas_family when a prek_eligibility_proof document for that basis is on the enrollment.
      A child admitted to PK3 on a basis stays eligible for PK4 the next school year (prek_eligibility_carries_to_pk4) even when the basis no longer holds.
      A PK4 child with no basis may enroll on Pre-Kindergarten (Tuition-Based) when the household has no unpaid tuition balance from an earlier school year (enroll_msr_prior_tuition_balance is zero or below).
      A tuition-based enrollment moves to state-eligible Pre-K only when an eligibility basis is on file for the student.
      The move takes effect on the first day of the billing month after the basis is on file; a tuition charge already posted for that month or a later one is credited in full with credit_reason eligibility_established, and months before it remain owed.
    eligibility:
      - id: prior_tuition_balance_clear
        applies_to: [enroll_registration]
        kind: authorization
        condition: "A PK4 child with no basis may enroll on Pre-Kindergarten (Tuition-Based) when the household has no unpaid tuition balance from an earlier school year (enroll_msr_prior_tuition_balance is zero or below)."
        evidence_fields: [enrollments.customer_id, enrollments.school_year, enrollment_ledger.enrollment_id, enrollment_ledger.event_type, enrollment_ledger.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.customer_id]
          action_bindings:
            enrollments.customer_id: customer_id
      - id: eligibility_basis_on_file
        applies_to: [enroll_prek_eligibility_change]
        kind: authorization
        condition: "A tuition-based enrollment moves to state-eligible Pre-K only when an eligibility basis is on file for the student."
        evidence_fields: [enrollments.enrollment_id, enrollments.student_id, students.emergent_bilingual, students.categorical_status, students.military_connected, meal_accounts.variant_name, enrollment_records_log.document_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.enrollment_id]
          action_bindings:
            enrollments.enrollment_id: enrollment_id
    measures: [enroll_msr_prior_tuition_balance]
    params:
      per_tier:
        "Attendance Zone Enrollment": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Intra-District Transfer (Space Available)": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Intra-District Transfer (Employee Child)": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Non-Resident Transfer": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Choice Program Enrollment": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Pre-Kindergarten (State-Eligible)": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}
        "Pre-Kindergarten (Tuition-Based)": {prek_eligibility_required: "=prek_eligibility_required", prek_age_by_cutoff: "=prek_age_by_cutoff"}

  - id: enroll_prek_tuition
    subject: [enroll_tuition_charge, enroll_tuition_late_fee]
    rule: >-
      Tuition posts on the first day of each month listed in tuition_billing_months for an enrollment on Pre-Kindergarten (Tuition-Based), and the first month's tuition posts on the registration date.
      Tuition posts only on an enrollment in status provisional or enrolled.
      The charge is the type's monthly_tuition, less tuition_sibling_discount_pct when enroll_agg_tuition_siblings gives the child a sibling discount; a first month whose entry_date falls on or after half_month_start_day is charged half_month_rate_pct of that amount, and every other month is a full month.
      The amount is rounded to the nearest cent, half a cent rounding up.
      Tuition is due by tuition_due_day of the month; when any part of a month's tuition is still unpaid after the due day, one tuition_late_fee posts tuition_late_fee_offset_days after it, payments being applied to the oldest open charge first.
      Enrollment types with a monthly_tuition of 0.00 post no tuition.
    eligibility:
      - id: tuition_on_open_enrollment
        applies_to: [enroll_tuition_charge]
        kind: state
        condition: "Tuition posts only on an enrollment in status provisional or enrolled."
        evidence_fields: [enrollments.status, enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.enrollment_id]
          action_bindings:
            enrollments.enrollment_id: enrollment_id
        state_contract:
          field: enrollments.status
          allowed: [provisional, enrolled]
    params:
      per_tier:
        "Attendance Zone Enrollment": {monthly_tuition: "=monthly_tuition"}
        "Intra-District Transfer (Space Available)": {monthly_tuition: "=monthly_tuition"}
        "Intra-District Transfer (Employee Child)": {monthly_tuition: "=monthly_tuition"}
        "Non-Resident Transfer": {monthly_tuition: "=monthly_tuition"}
        "Choice Program Enrollment": {monthly_tuition: "=monthly_tuition"}
        "Pre-Kindergarten (State-Eligible)": {monthly_tuition: "=monthly_tuition"}
        "Pre-Kindergarten (Tuition-Based)": {monthly_tuition: "=monthly_tuition"}
    formula:
      sibling_pct: "tuition_sibling_discount_pct if sibling_discount_applied == True else 0"
      proration_pct: "half_month_rate_pct if proration == 'half_month' else 100"
      amount: "round(monthly_tuition * (1 - sibling_pct / 100) * proration_pct / 100, 2)"

  - id: enroll_tuition_payments_and_refunds
    subject: [enroll_tuition_payment, enroll_tuition_credit, enroll_tuition_refund]
    rule: >-
      Tuition is paid by the methods in accepted_payment_methods and is applied to the enrollment's oldest open charge first; a payment never moves to a sibling's enrollment.
      When the family gives written notice of withdrawal from tuition-based Pre-K (a withdrawal_notice document logged on the enrollment, its received_date being the notice date), tuition stops after tuition_withdrawal_notice_days calendar days from the notice date (day 0): a month that begins after the later of that day and the withdrawal date is not owed, and a charge already posted for such a month is credited in full with credit_reason withdrawal_after_notice.
      An enrollment withdrawn without notice owes every month that began on or before the last day of the notice period counted from the withdrawal date.
      A credit balance is refunded by district check within credit_balance_refund_days calendar days after the withdrawal date or the year end, and a refund is issued only on an enrollment in status withdrawn or year_completed.
    eligibility:
      - id: refund_after_close
        applies_to: [enroll_tuition_refund]
        kind: state
        condition: "a refund is issued only on an enrollment in status withdrawn or year_completed."
        evidence_fields: [enrollments.status, enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [enrollments.enrollment_id]
          action_bindings:
            enrollments.enrollment_id: enrollment_id
        state_contract:
          field: enrollments.status
          allowed: [withdrawn, year_completed]

  - id: enroll_withdrawal_and_year_end
    subject: [enroll_withdrawal, enroll_year_end]
    rule: >-
      Only the parent or guardian of record signs the district withdrawal form (withdrawal_signer); the support desk explains the form and the leaver reasons but the withdrawal is the family's own action.
      The withdrawal takes the last day of attendance as its withdrawal_date (withdrawal_effective_basis), and the leaver_reason is the one the family states on the form.
      A district withdrawal ends the student's other district programs on the same date: the School Nutrition meal account becomes inactive, Student Transportation eligibility ends with end_reason district_withdrawal, and an open Creek Kids Club enrollment ends.
      At the close of the school year every enrolled record is completed; a grade 12 graduate is completed with leaver_reason graduated.
    eligibility: []

extended_policies:
- id: enroll_ext_late_fee_assessment
  base_policy_refs:
  - enroll_prek_tuition
  overwrite:
  - base_policy: enroll_prek_tuition
    superseded_clause: >-
      Tuition is due by tuition_due_day of the month; when any part of a month's tuition is still unpaid after the due day, one tuition_late_fee posts tuition_late_fee_offset_days after it, payments being applied to the oldest open charge first.
    replaced_by: >-
      Tuition is due by tuition_due_day of the billing month or, for a month whose tuition charge posts after that day, tuition_due_day days after the charge posts, and payments are applied to the oldest open charge first; when part of a month's tuition is still unpaid after the due day, one late fee for that billing month is assessed by the Family Services desk no earlier than tuition_late_fee_offset_days after the due day, in the amount the board-approved late-fee schedule below gives on the records as they stand on the day the fee is assessed.
  trigger: state_due
  subject:
  - enroll_tuition_late_fee
  computes: amount
  target_tool: post_prek_late_fee_f766f23b
  params:
    fee_second: 30.0
    fee_third_plus: 35.0
    paper_one_add: 10.0
    paper_two_add: 15.0
    unpaid_whole_add: 15.0
    unpaid_half_add: 5.0
    yearly_cap: 150.0
    no_cap: 99999.0
    multi_two_cut: 5.0
    multi_three_cut: 10.0
  rule: >-
    Tuition is due by tuition_due_day of the billing month or, for a month whose tuition charge posts after that day, tuition_due_day days after the charge posts, and payments are applied to the oldest open charge first; when part of a month's tuition is still unpaid after the due day, one late fee for that billing month is assessed by the Family Services desk no earlier than tuition_late_fee_offset_days after the due day, in the amount the board-approved late-fee schedule below gives on the records as they stand on the day the fee is assessed. The late fee is assessed for the enrollment's most recent billing month, the latest billing month that carries a tuition charge, whose due day is day tuition_due_day of that billing month or, when that month's tuition charge posted after day tuition_due_day, the day tuition_due_day days after the charge posted. The open balance is the enrollment's tuition charges, late fees and refunds less its payments and credits, payments reaching the oldest open charge first, and the part of the month's tuition still unpaid is the lesser of that month's tuition charge and the open balance, never less than zero. The late fee is the type's tuition_late_fee. Under the repeat-lateness schedule, an enrollment that already carries two or more late fees in the school year is charged fee_third_plus in place of the type's tuition_late_fee, one that carries exactly one is charged fee_second, and one that carries none is charged the type's tuition_late_fee. Under the paper-payment handling schedule, a late fee on an enrollment that shows two or more tuition payments by personal_check or money_order in the school year carries paper_two_add, one on an enrollment that shows exactly one carries paper_one_add, and one on an enrollment that shows none carries nothing. Under the unpaid-month schedule, a month whose whole tuition charge is still unpaid adds unpaid_whole_add, one with at least half but not all of its tuition charge still unpaid adds unpaid_half_add, and one with less than half still unpaid adds nothing. Under the yearly cap, an enrollment's late fees in a school year never total more than yearly_cap, and the limit is worked out from the late fees already posted on the enrollment in the school year: when they already reach yearly_cap the limit is nothing, when they are above zero and below yearly_cap the limit is yearly_cap less those fees, and when there is no earlier late fee in the school year the fee is not limited by the cap. Under the multi-program household schedule, a household with three or more children holding a Creek Kids Club enrollment in status active (each such enrollment covers one child) has multi_three_cut taken off the late fee, one with exactly two such children has multi_two_cut taken off, and one with fewer has nothing taken off. A billing month that already carries a late fee, none of whose tuition is still unpaid on the day the fee is assessed, or whose due day is fewer than tuition_late_fee_offset_days days before that day, owes no late fee, additions included. The schedules are applied to the type's tuition_late_fee in one order: first replacements and additions, then the limit, then reductions, never taking the fee below zero, and only that final amount is rounded to the nearest cent, half a cent rounding up.
  prerequisite: []
  cross_category:
  - category: care
    as: history
    reads:
    - care_enrollments.status
    note: >-
      The number of the household's children holding an active Creek Kids Club enrollment decides the multi-program reduction.
  compute:
  - lf_month: >-
      LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')
  - lf_unpaid: >-
      MN(SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')), MX(0.0, SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_refund') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_payment') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_credit')))
  - rl_count: COUNT('enrollment_ledger', event_type='enroll_tuition_late_fee')
  - repeat_fee: >-
      K('fee_third_plus') if rl_count >= 2 else (K('fee_second') if rl_count == 1 else P('tuition_late_fee'))
  - pp_count: >-
      COUNT('enrollment_ledger', event_type='enroll_tuition_payment', payment_method='personal_check') + COUNT('enrollment_ledger', event_type='enroll_tuition_payment', payment_method='money_order')
  - paper_add: K('paper_two_add') if pp_count >= 2 else (K('paper_one_add') if pp_count == 1 else 0.0)
  - um_charge: >-
      SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))
  - um_part: >-
      MN(um_charge, MX(0.0, SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_refund') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_payment') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_credit')))
  - unpaid_add: >-
      0.0 if um_charge <= 0 else (K('unpaid_whole_add') if um_part >= um_charge else (K('unpaid_half_add') if um_part * 2 >= um_charge else 0.0))
  - cy_earlier: SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee')
  - cap_room: >-
      0.0 if cy_earlier >= K('yearly_cap') else ((K('yearly_cap') - cy_earlier) if cy_earlier > 0 else K('no_cap'))
  - mp_children: XCOUNT('care', 'care_enrollments', status='active')
  - multi_cut: K('multi_three_cut') if mp_children >= 3 else (K('multi_two_cut') if mp_children == 2 else 0.0)
  - lf_owed: >-
      1 if (COUNT('enrollment_ledger', event_type='enroll_tuition_late_fee', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) == 0 and lf_unpaid > 0 and DAYS(LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge') + '-01', NOW) - ((DAYS(LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge') + '-01', LATEST('enrollment_ledger', 'posted_date', date_field='billing_month', event_type='enroll_tuition_charge')) + P('tuition_due_day')) if DAYS(LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge') + '-01', LATEST('enrollment_ledger', 'posted_date', date_field='billing_month', event_type='enroll_tuition_charge')) >= P('tuition_due_day') else (P('tuition_due_day') - 1)) >= P('tuition_late_fee_offset_days')) else 0
  - combined_fee: repeat_fee + paper_add + unpaid_add
  - limited_fee: MN(combined_fee, cap_room)
  - reduced_fee: MX(0.0, limited_fee - multi_cut) if lf_owed == 1 else 0.0
  - result: RND(reduced_fee + 0.000000001, 2)
  compute_basis:
    lf_month: >-
      The late fee is assessed for the enrollment's most recent billing month, the latest billing month that carries a tuition charge, whose due day is day tuition_due_day of that billing month or, when that month's tuition charge posted after day tuition_due_day, the day tuition_due_day days after the charge posted.
    lf_unpaid: >-
      The open balance is the enrollment's tuition charges, late fees and refunds less its payments and credits, payments reaching the oldest open charge first, and the part of the month's tuition still unpaid is the lesser of that month's tuition charge and the open balance, never less than zero.
    rl_count: >-
      Under the repeat-lateness schedule, an enrollment that already carries two or more late fees in the school year is charged fee_third_plus in place of the type's tuition_late_fee, one that carries exactly one is charged fee_second, and one that carries none is charged the type's tuition_late_fee.
    repeat_fee: >-
      Under the repeat-lateness schedule, an enrollment that already carries two or more late fees in the school year is charged fee_third_plus in place of the type's tuition_late_fee, one that carries exactly one is charged fee_second, and one that carries none is charged the type's tuition_late_fee.
    pp_count: >-
      Under the paper-payment handling schedule, a late fee on an enrollment that shows two or more tuition payments by personal_check or money_order in the school year carries paper_two_add, one on an enrollment that shows exactly one carries paper_one_add, and one on an enrollment that shows none carries nothing.
    paper_add: >-
      Under the paper-payment handling schedule, a late fee on an enrollment that shows two or more tuition payments by personal_check or money_order in the school year carries paper_two_add, one on an enrollment that shows exactly one carries paper_one_add, and one on an enrollment that shows none carries nothing.
    um_charge: >-
      Under the unpaid-month schedule, a month whose whole tuition charge is still unpaid adds unpaid_whole_add, one with at least half but not all of its tuition charge still unpaid adds unpaid_half_add, and one with less than half still unpaid adds nothing.
    um_part: >-
      The open balance is the enrollment's tuition charges, late fees and refunds less its payments and credits, payments reaching the oldest open charge first, and the part of the month's tuition still unpaid is the lesser of that month's tuition charge and the open balance, never less than zero.
    unpaid_add: >-
      Under the unpaid-month schedule, a month whose whole tuition charge is still unpaid adds unpaid_whole_add, one with at least half but not all of its tuition charge still unpaid adds unpaid_half_add, and one with less than half still unpaid adds nothing.
    cy_earlier: >-
      Under the yearly cap, an enrollment's late fees in a school year never total more than yearly_cap, and the limit is worked out from the late fees already posted on the enrollment in the school year: when they already reach yearly_cap the limit is nothing, when they are above zero and below yearly_cap the limit is yearly_cap less those fees, and when there is no earlier late fee in the school year the fee is not limited by the cap.
    cap_room: >-
      Under the yearly cap, an enrollment's late fees in a school year never total more than yearly_cap, and the limit is worked out from the late fees already posted on the enrollment in the school year: when they already reach yearly_cap the limit is nothing, when they are above zero and below yearly_cap the limit is yearly_cap less those fees, and when there is no earlier late fee in the school year the fee is not limited by the cap.
    mp_children: >-
      Under the multi-program household schedule, a household with three or more children holding a Creek Kids Club enrollment in status active (each such enrollment covers one child) has multi_three_cut taken off the late fee, one with exactly two such children has multi_two_cut taken off, and one with fewer has nothing taken off.
    multi_cut: >-
      Under the multi-program household schedule, a household with three or more children holding a Creek Kids Club enrollment in status active (each such enrollment covers one child) has multi_three_cut taken off the late fee, one with exactly two such children has multi_two_cut taken off, and one with fewer has nothing taken off.
    lf_owed: >-
      A billing month that already carries a late fee, none of whose tuition is still unpaid on the day the fee is assessed, or whose due day is fewer than tuition_late_fee_offset_days days before that day, owes no late fee, additions included.
    combined_fee: first replacements and additions
    limited_fee: then the limit
    reduced_fee: then reductions, never taking the fee below zero
    result: and only that final amount is rounded to the nearest cent, half a cent rounding up.
  factors:
  - id: repeat_lateness_schedule
    effect: parameter
    decides: repeat_fee
    bindings:
    - rl_count
    - repeat_fee
    ladder:
    - when: two or more late fees already on the enrollment in the school year
      value: K('fee_third_plus')
    - when: exactly one late fee already on the enrollment in the school year
      value: K('fee_second')
    - when: otherwise
      value: P('tuition_late_fee')
    baseline:
      repeat_fee: P('tuition_late_fee')
    evidence:
    - history
    cross_difficulty: null
  - id: paper_payment_schedule
    effect: parameter
    decides: paper_add
    bindings:
    - pp_count
    - paper_add
    ladder:
    - when: >-
        the enrollment shows two or more tuition payments by personal_check or money_order in the school year
      value: K('paper_two_add')
    - when: it shows exactly one such payment
      value: K('paper_one_add')
    - when: otherwise
      value: '0.00'
    baseline:
      paper_add: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: unpaid_month_schedule
    effect: parameter
    decides: unpaid_add
    bindings:
    - um_charge
    - um_part
    - unpaid_add
    ladder:
    - when: the month's whole tuition charge is still unpaid
      value: K('unpaid_whole_add')
    - when: at least half of the month's tuition charge but not all of it is still unpaid
      value: K('unpaid_half_add')
    - when: otherwise
      value: '0.00'
    baseline:
      unpaid_add: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: yearly_late_fee_cap
    effect: method
    decides: cap_room
    bindings:
    - cy_earlier
    - cap_room
    ladder:
    - when: earlier late fees in the school year already reach yearly_cap
      method: the limit is nothing
    - when: earlier late fees in the school year are above zero and below yearly_cap
      method: the limit is yearly_cap less those fees
    - when: otherwise
      method: the fee is not limited by the cap
    baseline:
      cap_room: K('no_cap')
    evidence:
    - history
    cross_difficulty: null
  - id: multi_program_household_cut
    effect: parameter
    decides: multi_cut
    bindings:
    - mp_children
    - multi_cut
    ladder:
    - when: three or more of the household's children hold a Creek Kids Club enrollment in status active
      value: K('multi_three_cut')
    - when: exactly two do
      value: K('multi_two_cut')
    - when: otherwise
      value: '0.00'
    baseline:
      multi_cut: '0.0'
    evidence:
    - cross_category
    cross_difficulty: care
  baseline:
    rule: The late fee is the type's tuition_late_fee.
    params:
    - tuition_late_fee
  inputs:
    history:
    - table: enrollment_ledger
      aggregate: count
      field: amount
      filters:
        event_type: enroll_tuition_late_fee
    - table: enrollment_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: enroll_tuition_payment
    - category: care
      table: care_enrollments
      aggregate: count
      field: status
      filters:
        status: active
    cross_category:
    - care
- id: enroll_ext_combined_program_credit
  base_policy_refs:
  - enroll_tuition_payments_and_refunds
  - enroll_prek_admission
  - enroll_prek_tuition
  overwrite: []
  trigger: state_due
  subject:
  - enroll_tuition_credit
  computes: amount
  target_tool: credit_prek_combined_program_abf513c1
  params:
    credit_standard: 40.0
    credit_ccs: 20.0
    credit_discounted_rate: 25.0
    household_cap: 650.0
    children_two_add: 10.0
    children_three_add: 15.0
    early_near: 7
    early_far: 14
    early_near_add: 5.0
    early_far_add: 10.0
    arrears_two_cut: 7.5
    arrears_three_cut: 15.0
  rule: >-
    Under the board-approved combined-program schedule, a tuition-based Pre-K child who also attends Creek Kids Club Pre-K Wraparound Care (5 Days) is owed a combined-program credit against the tuition charged for each billing month in which the child holds that seat, posted against that month's tuition charge with credit_reason billing_correction. The credit is worked out for the enrollment's most recent billing month, the latest billing month that carries a tuition charge, from the child's Creek Kids Club enrollment in status active on the Pre-K Wraparound plan as it stands on the day the credit is posted, and it is never more than that month's tuition charge. The combined-program credit is credit_standard for the month. Under the funding schedule, a child whose active Pre-K Wraparound seat is funded by Workforce Solutions Child Care Services (subsidy_payer workforce_solutions_ccs) is credited credit_ccs in place of credit_standard, a child whose family-paid seat's latest Creek Kids Club tuition charge for the billing month (by posted date) carries a free_meal_rate, reduced_meal_rate or employee_rate rate basis is credited credit_discounted_rate, and every other child is credited credit_standard. The credit follows how Creek Kids Club bills the same month: a Pre-K Wraparound start date in a month after the billing month gives no credit for the month, a start date on or after the plan's half_month_start_day of the billing month gives half of the credit, and an earlier start date gives the whole credit. Under the combined Pre-K and wraparound tuition cap, when the month's Pre-K tuition charge and the family's Creek Kids Club charge for the Pre-K Wraparound seat for the same billing month together exceed household_cap, the excess is added to the credit, and otherwise nothing is added: for a seat funded by Workforce Solutions Child Care Services the family's charge is the Creek Kids Club tuition charged to that seat for the billing month less the Workforce Solutions remittances posted for that seat for the billing month, and for a family-paid seat it is that tuition alone. Under the multi-program household schedule, a household with three or more children holding a Creek Kids Club enrollment in status active (each such enrollment covers one child) has children_three_add added to the credit, one with exactly two such children has children_two_add added, and one with fewer has nothing added. Under the early-registration schedule, a Pre-K Wraparound seat registered at least early_far days before its start date adds early_far_add to the credit, one registered at least early_near but fewer than early_far days before it adds early_near_add, and a later registration adds nothing. Under the account-standing schedule, the whole months of arrears being the enrollment's tuition charges and late fees less its payments, divided by the most recent billing month's tuition charge and rounded down, credits not being payments, an account with three or more whole months of arrears on the day the credit is posted has arrears_three_cut taken off the credit, one with two has arrears_two_cut taken off, and one with fewer has nothing taken off. A child without a Creek Kids Club Pre-K Wraparound Care (5 Days) enrollment in status active has no combined-program credit, additions included. The schedules are applied to the standard credit in one order: first replacements, then multipliers, then additions and reductions, never taking the credit below zero, then the limit to the month's tuition charge, and only that final amount is rounded to the nearest cent, half a cent rounding up.
  prerequisite: []
  cross_category:
  - category: care
    as: branch
    reads:
    - variant_name
    - status
    - subsidy_payer
    - start_date
    - registration_date
    - half_month_start_day
    - care_ledger.amount
    - care_enrollments.status
    note: >-
      The child's active Pre-K Wraparound seat (funding, start and registration dates), the plan's half_month_start_day, the seat's Creek Kids Club tuition and remittance rows and the household's active Creek Kids Club enrollments decide the credit.
  compute:
  - cc_charge: >-
      SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))
  - wf_payer: >-
      CFIELD('care', 'subsidy_payer', student_id=F('student_id'), variant_name='Creek Kids Club Pre-K Wraparound Care (5 Days)', status='active')
  - wf_basis: >-
      XLATEST('care', 'care_ledger', 'rate_basis', date_field='posted_date', event_type='care_tuition_charge', care_enrollment_id=CFIELD('care', 'care_enrollment_id', student_id=F('student_id'), variant_name='Creek Kids Club Pre-K Wraparound Care (5 Days)', status='active'), billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))
  - seat_credit: >-
      K('credit_ccs') if wf_payer == 'workforce_solutions_ccs' else (K('credit_discounted_rate') if (wf_basis == 'free_meal_rate' or wf_basis == 'reduced_meal_rate' or wf_basis == 'employee_rate') else K('credit_standard'))
  - cp_start: >-
      CFIELD('care', 'start_date', student_id=F('student_id'), variant_name='Creek Kids Club Pre-K Wraparound Care (5 Days)', status='active')
  - seat_share: >-
      1.0 if cp_start == None else (0.0 if MONTHS(LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge') + '-01', cp_start) >= 1 else (0.5 if DAYS(LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge') + '-01', cp_start) >= CPARAM('care', 'half_month_start_day', student_id=F('student_id'), variant_name='Creek Kids Club Pre-K Wraparound Care (5 Days)', status='active') - 1 else 1.0))
  - ct_payer: >-
      CFIELD('care', 'subsidy_payer', student_id=F('student_id'), variant_name='Creek Kids Club Pre-K Wraparound Care (5 Days)', status='active')
  - ct_care: >-
      XSUM('care', 'care_ledger', 'amount', event_type='care_tuition_charge', care_enrollment_id=CFIELD('care', 'care_enrollment_id', student_id=F('student_id'), variant_name='Creek Kids Club Pre-K Wraparound Care (5 Days)', status='active'), billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))
  - ct_remit: >-
      XSUM('care', 'care_ledger', 'amount', event_type='care_subsidy_remittance', care_enrollment_id=CFIELD('care', 'care_enrollment_id', student_id=F('student_id'), variant_name='Creek Kids Club Pre-K Wraparound Care (5 Days)', status='active'), billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))
  - cap_addition: >-
      (SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) + ct_care - ct_remit - K('household_cap')) if (ct_payer == 'workforce_solutions_ccs' and SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) + ct_care - ct_remit > K('household_cap')) else ((SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) + ct_care - K('household_cap')) if (ct_payer != 'workforce_solutions_ccs' and SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) + ct_care > K('household_cap')) else 0.0)
  - ck_children: XCOUNT('care', 'care_enrollments', status='active')
  - children_add: >-
      K('children_three_add') if ck_children >= 3 else (K('children_two_add') if ck_children == 2 else 0.0)
  - er_reg: >-
      CFIELD('care', 'registration_date', student_id=F('student_id'), variant_name='Creek Kids Club Pre-K Wraparound Care (5 Days)', status='active')
  - er_start: >-
      CFIELD('care', 'start_date', student_id=F('student_id'), variant_name='Creek Kids Club Pre-K Wraparound Care (5 Days)', status='active')
  - er_days: DAYS(er_reg, er_start) if (er_reg != None and er_start != None) else 0
  - early_add: >-
      K('early_far_add') if er_days >= K('early_far') else (K('early_near_add') if (er_days >= K('early_near') and er_days < K('early_far')) else 0.0)
  - as_months: >-
      (int((SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_payment')) / SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))) if SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) > 0 else 0)
  - arrears_cut: K('arrears_three_cut') if as_months >= 3 else (K('arrears_two_cut') if as_months == 2 else 0.0)
  - scope_seat: >-
      CFIELD('care', 'status', student_id=F('student_id'), variant_name='Creek Kids Club Pre-K Wraparound Care (5 Days)', status='active')
  - seat_part: seat_credit * seat_share
  - adjusted: >-
      MX(0.0, seat_part + cap_addition + children_add + early_add - arrears_cut) if scope_seat == 'active' else 0.0
  - credit_total: MN(cc_charge, adjusted)
  - result: RND(credit_total + 0.000000001, 2)
  compute_basis:
    cc_charge: >-
      The credit is worked out for the enrollment's most recent billing month, the latest billing month that carries a tuition charge
    wf_payer: >-
      Under the funding schedule, a child whose active Pre-K Wraparound seat is funded by Workforce Solutions Child Care Services (subsidy_payer workforce_solutions_ccs) is credited credit_ccs in place of credit_standard, a child whose family-paid seat's latest Creek Kids Club tuition charge for the billing month (by posted date) carries a free_meal_rate, reduced_meal_rate or employee_rate rate basis is credited credit_discounted_rate, and every other child is credited credit_standard.
    wf_basis: >-
      Under the funding schedule, a child whose active Pre-K Wraparound seat is funded by Workforce Solutions Child Care Services (subsidy_payer workforce_solutions_ccs) is credited credit_ccs in place of credit_standard, a child whose family-paid seat's latest Creek Kids Club tuition charge for the billing month (by posted date) carries a free_meal_rate, reduced_meal_rate or employee_rate rate basis is credited credit_discounted_rate, and every other child is credited credit_standard.
    seat_credit: >-
      Under the funding schedule, a child whose active Pre-K Wraparound seat is funded by Workforce Solutions Child Care Services (subsidy_payer workforce_solutions_ccs) is credited credit_ccs in place of credit_standard, a child whose family-paid seat's latest Creek Kids Club tuition charge for the billing month (by posted date) carries a free_meal_rate, reduced_meal_rate or employee_rate rate basis is credited credit_discounted_rate, and every other child is credited credit_standard.
    cp_start: >-
      The credit follows how Creek Kids Club bills the same month: a Pre-K Wraparound start date in a month after the billing month gives no credit for the month, a start date on or after the plan's half_month_start_day of the billing month gives half of the credit, and an earlier start date gives the whole credit.
    seat_share: >-
      The credit follows how Creek Kids Club bills the same month: a Pre-K Wraparound start date in a month after the billing month gives no credit for the month, a start date on or after the plan's half_month_start_day of the billing month gives half of the credit, and an earlier start date gives the whole credit.
    ct_payer: >-
      Under the combined Pre-K and wraparound tuition cap, when the month's Pre-K tuition charge and the family's Creek Kids Club charge for the Pre-K Wraparound seat for the same billing month together exceed household_cap, the excess is added to the credit, and otherwise nothing is added: for a seat funded by Workforce Solutions Child Care Services the family's charge is the Creek Kids Club tuition charged to that seat for the billing month less the Workforce Solutions remittances posted for that seat for the billing month, and for a family-paid seat it is that tuition alone.
    ct_care: >-
      Under the combined Pre-K and wraparound tuition cap, when the month's Pre-K tuition charge and the family's Creek Kids Club charge for the Pre-K Wraparound seat for the same billing month together exceed household_cap, the excess is added to the credit, and otherwise nothing is added: for a seat funded by Workforce Solutions Child Care Services the family's charge is the Creek Kids Club tuition charged to that seat for the billing month less the Workforce Solutions remittances posted for that seat for the billing month, and for a family-paid seat it is that tuition alone.
    ct_remit: >-
      Under the combined Pre-K and wraparound tuition cap, when the month's Pre-K tuition charge and the family's Creek Kids Club charge for the Pre-K Wraparound seat for the same billing month together exceed household_cap, the excess is added to the credit, and otherwise nothing is added: for a seat funded by Workforce Solutions Child Care Services the family's charge is the Creek Kids Club tuition charged to that seat for the billing month less the Workforce Solutions remittances posted for that seat for the billing month, and for a family-paid seat it is that tuition alone.
    cap_addition: >-
      Under the combined Pre-K and wraparound tuition cap, when the month's Pre-K tuition charge and the family's Creek Kids Club charge for the Pre-K Wraparound seat for the same billing month together exceed household_cap, the excess is added to the credit, and otherwise nothing is added: for a seat funded by Workforce Solutions Child Care Services the family's charge is the Creek Kids Club tuition charged to that seat for the billing month less the Workforce Solutions remittances posted for that seat for the billing month, and for a family-paid seat it is that tuition alone.
    ck_children: >-
      Under the multi-program household schedule, a household with three or more children holding a Creek Kids Club enrollment in status active (each such enrollment covers one child) has children_three_add added to the credit, one with exactly two such children has children_two_add added, and one with fewer has nothing added.
    children_add: >-
      Under the multi-program household schedule, a household with three or more children holding a Creek Kids Club enrollment in status active (each such enrollment covers one child) has children_three_add added to the credit, one with exactly two such children has children_two_add added, and one with fewer has nothing added.
    er_reg: >-
      Under the early-registration schedule, a Pre-K Wraparound seat registered at least early_far days before its start date adds early_far_add to the credit, one registered at least early_near but fewer than early_far days before it adds early_near_add, and a later registration adds nothing.
    er_start: >-
      Under the early-registration schedule, a Pre-K Wraparound seat registered at least early_far days before its start date adds early_far_add to the credit, one registered at least early_near but fewer than early_far days before it adds early_near_add, and a later registration adds nothing.
    er_days: >-
      Under the early-registration schedule, a Pre-K Wraparound seat registered at least early_far days before its start date adds early_far_add to the credit, one registered at least early_near but fewer than early_far days before it adds early_near_add, and a later registration adds nothing.
    early_add: >-
      Under the early-registration schedule, a Pre-K Wraparound seat registered at least early_far days before its start date adds early_far_add to the credit, one registered at least early_near but fewer than early_far days before it adds early_near_add, and a later registration adds nothing.
    as_months: >-
      Under the account-standing schedule, the whole months of arrears being the enrollment's tuition charges and late fees less its payments, divided by the most recent billing month's tuition charge and rounded down, credits not being payments, an account with three or more whole months of arrears on the day the credit is posted has arrears_three_cut taken off the credit, one with two has arrears_two_cut taken off, and one with fewer has nothing taken off.
    arrears_cut: >-
      Under the account-standing schedule, the whole months of arrears being the enrollment's tuition charges and late fees less its payments, divided by the most recent billing month's tuition charge and rounded down, credits not being payments, an account with three or more whole months of arrears on the day the credit is posted has arrears_three_cut taken off the credit, one with two has arrears_two_cut taken off, and one with fewer has nothing taken off.
    scope_seat: >-
      A child without a Creek Kids Club Pre-K Wraparound Care (5 Days) enrollment in status active has no combined-program credit, additions included.
    seat_part: first replacements, then multipliers
    adjusted: then additions and reductions, never taking the credit below zero
    credit_total: then the limit to the month's tuition charge
    result: and only that final amount is rounded to the nearest cent, half a cent rounding up.
  factors:
  - id: wraparound_funding_tier
    effect: parameter
    decides: seat_credit
    bindings:
    - wf_payer
    - wf_basis
    - seat_credit
    ladder:
    - when: the active Pre-K Wraparound seat is funded by Workforce Solutions Child Care Services
      value: K('credit_ccs')
    - when: >-
        the family-paid seat's latest tuition charge for the billing month carries a free_meal_rate, reduced_meal_rate or employee_rate rate basis
      value: K('credit_discounted_rate')
    - when: otherwise
      value: K('credit_standard')
    baseline:
      seat_credit: K('credit_standard')
    evidence:
    - cross_category
    cross_difficulty: care
  - id: care_month_proration
    effect: parameter
    decides: seat_share
    bindings:
    - cp_start
    - seat_share
    ladder:
    - when: the Pre-K Wraparound start date falls in a month after the billing month
      value: '0'
    - when: it falls on or after the plan's half_month_start_day of the billing month
      value: '0.5'
    - when: otherwise
      value: '1'
    baseline:
      seat_share: '1.0'
    evidence:
    - cross_category
    - date
    cross_difficulty: care
  - id: combined_tuition_cap
    effect: method
    decides: cap_addition
    bindings:
    - ct_payer
    - ct_care
    - ct_remit
    - cap_addition
    ladder:
    - when: >-
        the seat is funded by Workforce Solutions Child Care Services and the month's Pre-K tuition charge plus the seat's Creek Kids Club tuition less its Workforce Solutions remittances exceeds household_cap
      method: that excess over household_cap is added
    - when: >-
        the seat is family-paid and the month's Pre-K tuition charge plus the seat's Creek Kids Club tuition exceeds household_cap
      method: that excess over household_cap is added
    - when: otherwise
      method: nothing is added
    baseline:
      cap_addition: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: care
  - id: creek_kids_children_tier
    effect: parameter
    decides: children_add
    bindings:
    - ck_children
    - children_add
    ladder:
    - when: three or more of the household's children hold a Creek Kids Club enrollment in status active
      value: K('children_three_add')
    - when: exactly two do
      value: K('children_two_add')
    - when: otherwise
      value: '0.00'
    baseline:
      children_add: '0.0'
    evidence:
    - cross_category
    cross_difficulty: care
  - id: wraparound_registration_lead
    effect: parameter
    decides: early_add
    bindings:
    - er_reg
    - er_start
    - er_days
    - early_add
    ladder:
    - when: the seat was registered at least early_far days before its start date
      value: K('early_far_add')
    - when: it was registered at least early_near but fewer than early_far days before
      value: K('early_near_add')
    - when: otherwise
      value: '0.00'
    baseline:
      early_add: '0.0'
    evidence:
    - cross_category
    - date
    cross_difficulty: care
  - id: account_standing_reduction
    effect: parameter
    decides: arrears_cut
    bindings:
    - as_months
    - arrears_cut
    ladder:
    - when: three or more whole months of arrears
      value: K('arrears_three_cut')
    - when: two whole months of arrears
      value: K('arrears_two_cut')
    - when: otherwise
      value: '0.00'
    baseline:
      arrears_cut: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The combined-program credit is credit_standard for the month.
    params:
    - credit_standard
  inputs:
    history:
    - table: enrollment_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: enroll_tuition_charge
    - category: care
      table: care_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: care_tuition_charge
    cross_category:
    - care
- id: enroll_ext_advance_payment
  base_policy_refs:
  - enroll_tuition_payments_and_refunds
  overwrite:
  - base_policy: enroll_tuition_payments_and_refunds
    superseded_clause: >-
      Tuition is paid by the methods in accepted_payment_methods and is applied to the enrollment's oldest open charge first; a payment never moves to a sibling's enrollment.
    replaced_by: >-
      Tuition is paid by the methods in accepted_payment_methods and is applied to the enrollment's oldest open charge first, and a payment never moves to a sibling's enrollment; an advance payment under the advance-payment schedule is made only in the district's online payment portal, which takes online_card and ach_bank_draft, a first installment under the payment-plan schedule is likewise made only in that portal, and every other tuition payment may still be made by personal_check or money_order at the campus cashier.
  trigger: on_request
  subject:
  - enroll_tuition_payment
  computes: amount
  target_tool: pay_prek_tuition_in_advance_058a705f
  params:
    school_year_billing_months: 10
    offer_pct: 3
    offer_pct_min: 3
    offer_half_month_min: 5
    window_late: 15
    arrears_two_cut: 10.0
    arrears_three_cut: 20.0
    kids_two_cut: 10.0
    kids_three_cut: 15.0
  rule: >-
    A family may pay the rest of the school year's Pre-K tuition in advance in one payment, which the parent or guardian makes personally in the district's online payment portal (district staff never take card or bank details), on the board-approved advance-payment schedule. Tuition is paid by the methods in accepted_payment_methods and is applied to the enrollment's oldest open charge first, and a payment never moves to a sibling's enrollment; an advance payment under the advance-payment schedule is made only in the district's online payment portal, which takes online_card and ach_bank_draft, a first installment under the payment-plan schedule is likewise made only in that portal, and every other tuition payment may still be made by personal_check or money_order at the campus cashier. The months the advance covers post on their usual dates and are paid from it, and any credit one of those months later receives stays on the account as a credit balance, refunded under the refund rule. The open balance is the enrollment's tuition charges, late fees and refunds less its payments and credits, and the months not yet posted are the school year's school_year_billing_months billing months less the tuition charges already posted on the enrollment. The advance payment is the open balance plus every month not yet posted at the most recent billing month's tuition charge, less the standard discount of offer_pct percent of those months at that charge. Under the pay-in-full offer, a family paying offer_half_month_min or more months in advance has half of one month at the most recent billing month's tuition charge taken off in place of the standard discount, a family paying fewer than offer_pct_min months in advance has no discount, and any other family has the standard discount. The discount is given in full when the advance is paid no later than the due day of the most recent billing month, at half when it is paid more than zero and no more than window_late days after that due day, and not at all when it is paid later, the due day being day tuition_due_day of that billing month or, when that month's tuition charge posted after day tuition_due_day, the day tuition_due_day days after the charge posted. Under the account-standing schedule, the whole months of arrears being the enrollment's tuition charges and late fees less its payments, divided by the most recent billing month's tuition charge and rounded down, credits not being payments, an advance made while the account carries three or more whole months of arrears has arrears_three_cut taken off the discount, one made with two has arrears_two_cut taken off, and one made with fewer has nothing taken off. Under the multi-program household schedule, a household with three or more children holding a Creek Kids Club enrollment in status active (each such enrollment covers one child) has kids_three_cut taken off the advance payment, one with exactly two such children has kids_two_cut taken off, and one with fewer has nothing taken off. When no month of the school year is left to post, nothing is taken off and the advance payment is the open balance. The schedules are applied in one order: first the months not yet posted are priced and added to the open balance, then replacements, then multipliers, then reductions of the discount, never taking it below zero, then the discount and the other reductions are taken off, and only that final amount is rounded to the nearest cent, half a cent rounding up. The advance payment is not fixed until the late fee owed for the enrollment's most recent billing month, when that month's tuition was left unpaid after its due day, has been assessed. The advance payment is fixed only after the combined-program credit owed on the most recent billing month has been worked out and posted for a child who attends Creek Kids Club Pre-K Wraparound Care (5 Days).
  prerequisite:
  - condition: >-
      When the enrollment's most recent billing month was left unpaid after its due day, the ledger carries the late fee the schedule gives for that billing month (an enroll_tuition_late_fee row with that billing_month), or the schedule owes nothing for it.
    effect: The late fee row raises the open balance by the assessed fee, which the advance payment includes.
    fallback_reason: >-
      The late-fee schedule can owe nothing for a month left unpaid after its due day (an enrollment whose earlier late fees in the school year already reach the yearly cap), and an assessment that owes nothing books no row, so no record-visible state singles out a completed assessment; the dependency is stated as the assessment itself.
    form: action
    gate: ap_open
    kind: value_input
    policy_source: >-
      The advance payment is not fixed until the late fee owed for the enrollment's most recent billing month, when that month's tuition was left unpaid after its due day, has been assessed.
    problem: enroll_ext_late_fee_assessment
    resolved_by: post_prek_late_fee_f766f23b
  - condition: >-
      The tuition charge of the enrollment's most recent billing month carries the combined-program credit (an enroll_tuition_credit row with credit_reason billing_correction whose source is that charge) when the schedule owes one.
    effect: The credit row lowers the open balance by the credit, which the advance payment includes.
    fallback_reason: >-
      The combined-program schedule can owe 0.00 for a month (a seat that starts after the billing month with nothing added, or an account-standing reduction that takes the credit to zero), which books no row, so no record-visible state distinguishes a credit worked out at nothing from one never worked out; the dependency is stated as the action.
    form: action
    gate: ap_open
    kind: value_input
    policy_source: >-
      The advance payment is fixed only after the combined-program credit owed on the most recent billing month has been worked out and posted for a child who attends Creek Kids Club Pre-K Wraparound Care (5 Days).
    problem: enroll_ext_combined_program_credit
    resolved_by: credit_prek_combined_program_abf513c1
  cross_category:
  - category: care
    as: history
    reads:
    - care_enrollments.status
    note: >-
      The number of the household's children holding an active Creek Kids Club enrollment decides the household reduction.
  compute:
  - ap_open: >-
      SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_refund') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_payment') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_credit')
  - ap_months: K('school_year_billing_months') - COUNT('enrollment_ledger', event_type='enroll_tuition_charge')
  - ap_rate: >-
      SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))
  - of_months: K('school_year_billing_months') - COUNT('enrollment_ledger', event_type='enroll_tuition_charge')
  - of_rate: >-
      SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))
  - offer_amount: >-
      of_rate * 0.5 if of_months >= K('offer_half_month_min') else (0.0 if of_months < K('offer_pct_min') else of_rate * of_months * K('offer_pct') / 100)
  - ow_due: >-
      ((DAYS(LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge') + '-01', LATEST('enrollment_ledger', 'posted_date', date_field='billing_month', event_type='enroll_tuition_charge')) + P('tuition_due_day')) if DAYS(LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge') + '-01', LATEST('enrollment_ledger', 'posted_date', date_field='billing_month', event_type='enroll_tuition_charge')) >= P('tuition_due_day') else (P('tuition_due_day') - 1))
  - ow_days: >-
      DAYS(LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge') + '-01', NOW) - ow_due
  - offer_share: >-
      0.0 if ow_days > K('window_late') else (0.5 if (ow_days > 0 and ow_days <= K('window_late')) else 1.0)
  - aa_months: >-
      (int((SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge') + SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_late_fee') - SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_payment')) / SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge'))) if SUM('enrollment_ledger', 'amount', event_type='enroll_tuition_charge', billing_month=LATEST('enrollment_ledger', 'billing_month', date_field='billing_month', event_type='enroll_tuition_charge')) > 0 else 0)
  - arrears_cut: K('arrears_three_cut') if aa_months >= 3 else (K('arrears_two_cut') if aa_months == 2 else 0.0)
  - hk_children: XCOUNT('care', 'care_enrollments', status='active')
  - kids_cut: K('kids_three_cut') if hk_children >= 3 else (K('kids_two_cut') if hk_children == 2 else 0.0)
  - priced: ap_open + ap_months * ap_rate
  - net_discount: MX(0.0, offer_amount * offer_share - arrears_cut)
  - advance_total: (priced - net_discount - kids_cut) if ap_months > 0 else ap_open
  - result: RND(advance_total + 0.000000001, 2)
  compute_basis:
    ap_open: >-
      The open balance is the enrollment's tuition charges, late fees and refunds less its payments and credits
    ap_months: >-
      the months not yet posted are the school year's school_year_billing_months billing months less the tuition charges already posted on the enrollment.
    ap_rate: >-
      The advance payment is the open balance plus every month not yet posted at the most recent billing month's tuition charge
    of_months: >-
      Under the pay-in-full offer, a family paying offer_half_month_min or more months in advance has half of one month at the most recent billing month's tuition charge taken off in place of the standard discount, a family paying fewer than offer_pct_min months in advance has no discount, and any other family has the standard discount.
    of_rate: >-
      Under the pay-in-full offer, a family paying offer_half_month_min or more months in advance has half of one month at the most recent billing month's tuition charge taken off in place of the standard discount, a family paying fewer than offer_pct_min months in advance has no discount, and any other family has the standard discount.
    offer_amount: >-
      Under the pay-in-full offer, a family paying offer_half_month_min or more months in advance has half of one month at the most recent billing month's tuition charge taken off in place of the standard discount, a family paying fewer than offer_pct_min months in advance has no discount, and any other family has the standard discount.
    ow_due: >-
      The discount is given in full when the advance is paid no later than the due day of the most recent billing month, at half when it is paid more than zero and no more than window_late days after that due day, and not at all when it is paid later, the due day being day tuition_due_day of that billing month or, when that month's tuition charge posted after day tuition_due_day, the day tuition_due_day days after the charge posted.
    ow_days: >-
      The discount is given in full when the advance is paid no later than the due day of the most recent billing month, at half when it is paid more than zero and no more than window_late days after that due day, and not at all when it is paid later, the due day being day tuition_due_day of that billing month or, when that month's tuition charge posted after day tuition_due_day, the day tuition_due_day days after the charge posted.
    offer_share: >-
      The discount is given in full when the advance is paid no later than the due day of the most recent billing month, at half when it is paid more than zero and no more than window_late days after that due day, and not at all when it is paid later, the due day being day tuition_due_day of that billing month or, when that month's tuition charge posted after day tuition_due_day, the day tuition_due_day days after the charge posted.
    aa_months: >-
      Under the account-standing schedule, the whole months of arrears being the enrollment's tuition charges and late fees less its payments, divided by the most recent billing month's tuition charge and rounded down, credits not being payments, an advance made while the account carries three or more whole months of arrears has arrears_three_cut taken off the discount, one made with two has arrears_two_cut taken off, and one made with fewer has nothing taken off.
    arrears_cut: >-
      Under the account-standing schedule, the whole months of arrears being the enrollment's tuition charges and late fees less its payments, divided by the most recent billing month's tuition charge and rounded down, credits not being payments, an advance made while the account carries three or more whole months of arrears has arrears_three_cut taken off the discount, one made with two has arrears_two_cut taken off, and one made with fewer has nothing taken off.
    hk_children: >-
      Under the multi-program household schedule, a household with three or more children holding a Creek Kids Club enrollment in status active (each such enrollment covers one child) has kids_three_cut taken off the advance payment, one with exactly two such children has kids_two_cut taken off, and one with fewer has nothing taken off.
    kids_cut: >-
      Under the multi-program household schedule, a household with three or more children holding a Creek Kids Club enrollment in status active (each such enrollment covers one child) has kids_three_cut taken off the advance payment, one with exactly two such children has kids_two_cut taken off, and one with fewer has nothing taken off.
    priced: first the months not yet posted are priced and added to the open balance
    net_discount: then replacements, then multipliers, then reductions of the discount, never taking it below zero
    advance_total: then the discount and the other reductions are taken off
    result: and only that final amount is rounded to the nearest cent, half a cent rounding up.
  factors:
  - id: pay_in_full_offer
    effect: method
    decides: offer_amount
    bindings:
    - of_months
    - of_rate
    - offer_amount
    ladder:
    - when: offer_half_month_min or more months paid in advance
      method: >-
        half of one month at the most recent billing month's tuition charge is taken off in place of the standard discount
    - when: fewer than offer_pct_min months paid in advance
      method: no discount
    - when: otherwise
      method: the standard discount of offer_pct percent of those months at that charge
    baseline:
      offer_amount: of_rate * of_months * K('offer_pct') / 100
    evidence:
    - history
    cross_difficulty: null
  - id: offer_timing_window
    effect: parameter
    decides: offer_share
    bindings:
    - ow_due
    - ow_days
    - offer_share
    ladder:
    - when: the advance is paid more than window_late days after the most recent billing month's due day
      value: '0'
    - when: it is paid more than zero and no more than window_late days after that due day
      value: '0.5'
    - when: otherwise
      value: '1'
    baseline:
      offer_share: '1.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: arrears_offer_reduction
    effect: parameter
    decides: arrears_cut
    bindings:
    - aa_months
    - arrears_cut
    ladder:
    - when: three or more whole months of arrears
      value: K('arrears_three_cut')
    - when: two whole months of arrears
      value: K('arrears_two_cut')
    - when: otherwise
      value: '0.00'
    baseline:
      arrears_cut: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: creek_kids_household_reduction
    effect: parameter
    decides: kids_cut
    bindings:
    - hk_children
    - kids_cut
    ladder:
    - when: three or more of the household's children hold a Creek Kids Club enrollment in status active
      value: K('kids_three_cut')
    - when: exactly two do
      value: K('kids_two_cut')
    - when: otherwise
      value: '0.00'
    baseline:
      kids_cut: '0.0'
    evidence:
    - cross_category
    cross_difficulty: care
  baseline:
    rule: >-
      The advance payment is the open balance plus every month not yet posted at the most recent billing month's tuition charge, less the standard discount of offer_pct percent of those months at that charge.
    params:
    - offer_pct
  inputs:
