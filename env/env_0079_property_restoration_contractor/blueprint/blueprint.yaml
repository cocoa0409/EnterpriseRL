name: env_0079_property_restoration_contractor
company: Ridgecrest Restoration & Reconstruction

background: |
  Ridgecrest Restoration & Reconstruction is an independent property damage restoration contractor with eleven branches across Texas, Louisiana and Florida, answering water, fire, smoke and mold losses around the clock and rebuilding what the loss destroyed. Its customer desk speaks plainly and calmly to people on one of the worst days of their year, and just as fluently to property managers, condominium associations and commercial owners who call about several buildings at once. The company sells seven lines of business, each held by the customer as a running job, contract, file or agreement that keeps booking charges, payments and paperwork until it closes. Water Damage Mitigation jobs are opened by an emergency dispatch and held at one of six tiers: Clean Water Mitigation - Standard Loss and - Large Loss, Gray Water Mitigation - Standard Loss and - Large Loss, and Black Water Mitigation - Standard Loss and - Large Loss; each job books its service call, drying equipment days, mitigation services, monitoring visits and payments. Fire & Smoke Mitigation jobs run from Smoke Odor Response through Light Smoke and Soot Cleanup, Moderate Fire and Smoke Cleanup, Heavy Fire Cleanup, Structural Fire Large Loss and Commercial Fire Large Loss, booking board-up, deodorization equipment and cleaning lines. Mold Remediation jobs are held as Spot, Limited, Standard or Extensive Mold Remediation, or as Attic and Crawlspace Mold Remediation or HVAC System Mold Remediation, and record their scope, equipment days, clearance attempts and payments. Reconstruction contracts are signed as a Repair Agreement - Minor Repairs, a Standard, Major or Full Structural Rebuild Agreement, a Multifamily Unit Rebuild Agreement or a Commercial Interior Rebuild Agreement, and move through permits, draws, change orders, completion and warranty. Contents Packout & Storage jobs range from On-Site Contents Manipulation and In-Plant Contents Cleaning to Partial, Full and High-Value Contents Packout and Commercial Contents and Records Recovery, booking packing, storage periods, cleaning, pack-back and custody credits. Insurance Claim Services files tie a loss to the carrier's claim under one of six billing arrangements, Homeowner Direct Pay Claim Support, Direction to Pay Claim Billing, Assignment of Benefits Claim Billing, Carrier Program Claim Billing, Public Adjuster Coordinated Claim Billing or Commercial Large Loss Claim Administration, and carry the estimate, supplements, carrier approvals and payments, and the insured's deductible. Commercial & Property Manager Service Agreements give business customers and insurance carriers a standing relationship as a Ready Profile, Silver, Gold or Platinum Priority Service Agreement, a Portfolio Master Service Agreement or a Carrier Preferred Vendor Agreement, booking term fees, response credits, rebates and carrier referrals. Most callers are homeowners and landlords with one loss open, typically a water or fire job, a claim file with their carrier, a contents job holding their belongings in storage and, weeks later, a rebuild contract at the same address. Property managers, associations and commercial owners hold several jobs and contracts across their buildings at once, often alongside a service agreement, while carrier program staff call about the referrals they have sent. By the time they call, most customers carry a history of dispatches, equipment days, approvals, two-party checks, draws and invoices, and they want to know what they owe, what their insurer has paid, when their belongings come home or how to move their job to the next step.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: water_mitigation_billing
    claim:
      categories: [water]
      event_types: [water_job_dispatch, water_work_authorization, water_dispatch_cancel, water_early_release, water_invoice_issue,
                    water_service_call_charge, water_equipment_day_charge, water_mitigation_service_charge, water_monitoring_visit_charge,
                    water_late_fee, water_card_surcharge, water_customer_payment, water_insurance_payment, water_adjustment_credit, water_refund]
    summary: >
      Homeowners, landlords, property managers, associations and commercial owners call about water mitigation jobs that sit at
      any point between dispatch and closing, held at one of the six Clean, Gray or Black Water Mitigation tiers, funded either
      as self-pay or under a claim file whose billing arrangement, status and carrier payments shape what the job may receive,
      and sometimes covered by a Commercial & Property Manager Service Agreement. The governing records are the job's status,
      water category, dispatch window, arrival minutes, year built, drying start and complete dates, drying outcome, invoice
      and due dates and balance, together with its charge lines and payment lines, the linked claim file and its carrier
      payments and postings already drawn from them on other jobs, and any service agreement the customer holds; the rules are
      the per-tier service call with surcharges and two waivers (water_evt_service_call), equipment days capped by the tier and
      extended only by same-day monitoring visits (water_evt_equipment_days, water_evt_monitoring), per-tier service rates with
      salvage, antimicrobial, PPE and regulated-material conditions (water_evt_mitigation_services, water_regulated_materials),
      deposits and authorization (water_authorization), card surcharges (water_evt_customer_payment), insurance postings bounded
      by the job balance and the carrier payment's unapplied remainder (water_evt_insurance_payment), dispute windows and
      goodwill caps (water_evt_adjustment), late fees with grace and claim-pending suspension (water_evt_late_fee), and refunds
      (water_evt_refund); in the natural course of the business a job is dispatched, authorized, dried, released or brought to
      the dry standard, invoiced and paid. The agent books dispatches, cancellations before authorization, charge lines,
      payments, insurance postings, credits, late fees, refunds and the final invoice, while the work authorization and the
      Early Equipment Removal Release are the customer's own signatures, handed over for the customer to complete. Goodwill above
      the job's cap, credit balances created by insurance proceeds, carrier overpayments and any request no water rule decides,
      such as a demand to move a credit to another job or to cancel an authorized job, fall outside policy and are handed to a
      human representative as not covered.

  - name: mold_remediation_jobs
    claim:
      categories: [mold]
      event_types: [mold_job_open, mold_authorization, mold_cancel, mold_clearance_request, mold_clearance_result, mold_invoice_issue,
                    mold_remediation_charge, mold_equipment_day_charge, mold_clearance_fee, mold_late_cancellation_fee, mold_late_fee,
                    mold_card_surcharge, mold_customer_payment, mold_insurance_payment, mold_adjustment_credit, mold_refund]
    summary: >
      Property owners and their agents call about mold remediation jobs at one of six tiers set by growth location and area,
      from booking and protocol through remediation, one or more clearance attempts, invoicing and payment; some jobs trace
      back to a company water job, some re-remediate an earlier mold job, and many are billed under a claim file whose mold
      sublimit is shared by every mold job of that loss. The records involved are the job's growth location and area,
      assessor and protocol date, funding source, scheduled start, containment, clearance, failed-clearance and cleared dates,
      its charges and clearance results, the linked water job's drying outcome and completion date, the earlier mold job's
      cleared date, and the claim file's mold sublimit, status and carrier payments; the rules are warranty funding and tier
      assignment (mold_tier_and_funding), the independent assessor and deposit conditions (mold_independent_assessment), per-tier
      scope and equipment rates with equipment caps and no billing for re-cleaning (mold_evt_remediation_scope), first-attempt
      clearance fees and attempt limits (mold_clearance), late cancellation (mold_cancellation), postings bounded by the shared
      sublimit (mold_agg_shared_sublimit, mold_evt_insurance_payment), disputes and goodwill caps (mold_evt_adjustment) and late
      fees (mold_evt_late_fee); the natural order of the business is booking, agreement, containment, clearance, invoice and
      payment. The agent books jobs, cancellations, scope and equipment lines, clearance requests and results, fees, payments,
      postings, credits and refunds, while signing the remediation agreement is the customer's own act handed over to the
      customer. Requests beyond any mold rule, such as asking the company to perform its own clearance, a job that has failed
      the tier's maximum clearance attempts, goodwill above the cap or insurance-created credit balances, are handed to a human
      representative as not covered by policy.

  - name: rebuild_contracts_and_draws
    claim:
      categories: [rebuild]
      event_types: [rebuild_contract_propose, rebuild_contract_sign, rebuild_proposal_decline, rebuild_contract_cancel, rebuild_work_suspension,
                    rebuild_work_resume, rebuild_final_invoice, rebuild_contract_sum_charge, rebuild_change_order_charge, rebuild_permit_charge,
                    rebuild_professional_fee_charge, rebuild_cancellation_charge, rebuild_remobilization_charge, rebuild_overdue_draw_charge,
                    rebuild_warranty_trip_charge, rebuild_draw_request, rebuild_draw_payment, rebuild_insurance_payment,
                    rebuild_change_order_credit, rebuild_warranty_report, rebuild_warranty_inspection]
    summary: >
      Homeowners, landlords, property managers, associations and commercial owners call about reconstruction contracts at one
      of six agreement tiers, from an unsigned proposal through signing, permits, construction, change orders, draws,
      substantial completion, final invoice and the warranty term, funded by the owner, by carrier payments that reached the
      company, or by releases from a mortgagee's loss-draft account. The governing records are the contract's tier, status,
      contract amount, signing location and date, permit, construction, suspension and completion dates and balance, its draw
      requests, payments, change orders and warranty reports, the linked claim file's mortgagee, payment routing, supplements
      and approvals, and the mitigation jobs of the same loss that are paid first; the rules are signing and the contract sum
      (rebuild_contract_signing), the Cooling-Off Rule right and later cancellation charges (rebuild_cancellation), permits and
      professional fees (rebuild_permits_and_fees), change order pricing with allowances, markup, minimums and the supplement
      condition for insurance scope (rebuild_change_orders), the per-tier draw schedule with deposit caps, retainage and
      funding route (rebuild_draws), payment and posting limits (rebuild_evt_payments), overdue draw charges, suspension and
      remobilization (rebuild_overdue_draws), completion (rebuild_completion) and the workmanship warranty in calendar months
      (rebuild_warranty); the natural order is proposal, signature, permit, construction with draws, completion, final invoice
      and warranty. The agent proposes contracts, records declined proposals, books charges, draws, payments, postings, credits,
      suspensions, the final invoice and warranty records, while signing a contract or a change order and cancelling a signed
      contract are the customer's own acts handed over to the customer. Cancelling a contract already permitted or in
      construction, warranty reports after the term and any other request no rebuild rule decides go to a human representative
      as not covered by policy.

  - name: contents_packout_and_storage
    claim:
      categories: [contents]
      event_types: [contents_job_open, contents_authorization, contents_cancel, contents_vault_change, contents_return_schedule,
                    contents_invoice_issue, contents_packout_charge, contents_storage_charge, contents_cleaning_charge,
                    contents_pack_back_charge, contents_late_fee, contents_card_surcharge, contents_customer_payment,
                    contents_insurance_payment, contents_adjustment_credit, contents_custody_credit, contents_refund]
    summary: >
      Owners of household and business contents call about contents jobs at one of six tiers, from on-site manipulation and
      in-plant cleaning to partial, full, high-value and commercial packouts, asking about storage bills, cleaning, items they
      want back, disposal of what cannot be saved and items lost or damaged while in the company's care, with storage that may
      be paid by the carrier for a time and by the customer afterwards. The records involved are the job's tier, status,
      custody start date, box and vault counts, declared value, return dates and balance, its charge lines and who each
      storage period is billed to, its disposal authorizations, the linked claim file's approved storage end date, loss type
      and contents-coverage payments, and the rebuild contracts at the same address whose progress decides when contents may
      come home; the rules are signing, deposits and vault counts (contents_signing_and_custody), per-tier packing and
      cleaning rates with the smoke-loss and signed-disposal conditions (contents_evt_packout_and_cleaning), storage periods
      and bill-to by the approved storage end date (contents_evt_storage), return readiness and notice (contents_return),
      custody compensation with report windows and liability caps (contents_evt_custody_credit), postings limited to contents
      coverage (contents_evt_insurance_payment), disputes (contents_evt_adjustment) and late fees (contents_evt_late_fee); the
      natural order is booking, authorization, custody, storage, return, invoice and payment. The agent books jobs,
      cancellations, vault changes, return scheduling, charges, payments, postings, credits and refunds, while signing the
      contents authorization and signing a disposal authorization are the customer's own acts handed over to the customer.
      Custody claims above the cap or after the window, customer storage long past due, goodwill above the cap and requests no
      contents rule decides are handed to a human representative as not covered by policy.

  - name: insurance_claim_services
    claim:
      categories: [claims]
      event_types: [claims_file_open, claims_estimate_submit, claims_file_withdraw, claims_file_close, claims_scope_approval,
                    claims_receivable_writeoff, claims_carrier_payment, claims_check_endorsement, claims_supplement_submit,
                    claims_depreciation_release_request, claims_storage_extension_request, claims_deductible_assessment,
                    claims_deductible_payment]
    summary: >
      Insured homeowners, landlords, property managers acting for owners, associations and commercial owners call about the
      claim file that ties their loss to the carrier, held under one of six billing arrangements, asking about their deductible,
      a two-party check, a supplement for hidden damage or code upgrades, recoverable depreciation, storage the carrier will
      pay for, or withdrawing an arrangement they signed. The records involved are the claim file's arrangement, status,
      carrier and claim number, policy state and issue date, deductible, mold and ordinance or law limits, mortgagee, public
      adjuster, referral number, approval date, approved storage end date, carrier receivable and deductible due, its
      approvals, carrier payments, requests and deductible lines, and the water, fire, mold, rebuild and contents jobs of the
      same loss whose status, completion and balances bear on supplements, releases and allocation; the rules are one file
      and one deductible per occurrence (claims_agg_one_file_per_claim), arrangement eligibility including Florida's assignment
      restriction and the public adjuster exclusion (claims_arrangement_eligibility), deductible collection that is never
      waived (claims_evt_deductible), estimate pricing (claims_estimate_submission), supplement windows, minimums and
      sublimit remainders (claims_evt_supplement), payment routing and allocation across jobs (claims_payment_allocation),
      depreciation release on completion within its window (claims_evt_depreciation_release), write-offs (claims_evt_writeoff),
      storage extensions (claims_storage_coverage) and withdrawal windows (claims_withdrawal); the natural order is file
      opening, estimate, carrier decision, payments and supplements, depreciation release, settlement and closing. The agent
      opens files, submits estimates, supplements, release and extension requests, records approvals, carrier payments,
      write-offs and deductible lines and closes settled files, while endorsing a two-party check and withdrawing the
      arrangement are the insured's own acts handed over to the insured. Requests to waive or rebate a deductible, write-offs
      above the desk cap, disputes at or above the appraisal threshold, payment remainders with no job left to pay and
      withdrawals outside the window are handed to a human representative as not covered by policy.
