category: account
display_name: Commercial & Property Manager Service Agreements
binding:
  holding_table: account_agreements
  event_tables:
  - account_charges
  - account_payments
  - account_referrals
  status_field: status
  variant_field: variant_name
  quantity_fields:
    agreement_balance: agreement_balance
lifecycle:
  states:
  - applied
  - active
  - suspended
  - expired
  - cancelled
  transitions:
  - from: applied
    to: active
    by: user
    means: The customer signs the agreement and the first term starts.
  - from: applied
    to: cancelled
    by: agent
    means: The unsigned enrollment is withdrawn or lapses.
  - from: active
    to: suspended
    by: system
    means: A charge is past due beyond the suspension days.
  - from: suspended
    to: active
    by: system
    means: The past-due balance is paid and the agreement reinstated.
  - from: active
    to: expired
    by: system
    means: The term ends without renewal.
  - from: active
    to: cancelled
    by: user
    means: The customer cancels mid-term.
accounts:
- key: agreement_balance
  unit: USD
  meaning: 'Amount the customer owes on the agreement: fees and refunds raise it; payments, SLA credits, rebates
    and proration credits lower it.'
parameter_schema:
  annual_fee: Agreement fee per 12-month term, billed at the start of each term, USD
  included_sites: Properties covered by the annual fee, count
  additional_site_fee: Fee per covered property beyond the included sites per term, USD
  max_sites: Most properties one agreement may cover, count
  term_months: Length of one agreement term, calendar months
  auto_renew_default: Whether the agreement renews for another term unless notice is given, boolean
  renewal_notice_days: Calendar days before the term end by which non-renewal notice must be given, count
  cancellation_notice_days: Calendar days of written notice required to cancel mid-term, count
  early_termination_fee_pct: Share of the unbilled remainder of the term's site fees charged on mid-term cancellation,
    percent
  annual_fee_refundable: Whether the unused part of the annual fee is prorated back on mid-term cancellation, boolean
  proration_basis_days: Days in the proration year used to prorate the annual fee, count
  service_call_fee_waived: Whether water and fire emergency service call fees are waived on the customer's jobs
    dispatched while the agreement is active, boolean
  response_commitment_minutes: Guaranteed on-site arrival for the customer's emergency calls measured from the booked
    call, minutes
  sla_credit_amount: Credit when an emergency dispatch for the customer misses the response commitment, per dispatch,
    USD
  sla_credit_cap_per_term: Most SLA credit posted in one agreement term, USD
  max_sla_credits_per_job: SLA credits allowed per mitigation job, count
  included_site_surveys: Pre-loss facility surveys (shutoff mapping, emergency profile) included per term, count
  site_survey_fee: Fee per facility survey beyond those included, USD
  included_training_sessions: On-site staff emergency-response training sessions included per term, count
  training_session_fee: Fee per training session beyond those included, USD
  training_max_attendees: Attendees per training session, count
  volume_rebate_threshold: Paid mitigation invoices of the customer in one term above which the volume rebate applies,
    USD
  volume_rebate_pct: Rebate on paid mitigation invoices above the threshold, percent
  volume_rebate_cap: Most volume rebate per term, USD
  payment_terms_days: Calendar days after an agreement charge posts by which it is due, count
  late_fee_pct_monthly: Late fee on past-due agreement charges per monthly fee period, percent
  late_fee_minimum: Minimum late fee per monthly fee period, USD
  late_fee_grace_days: Grace days after the due date before a late fee may post, calendar days
  suspension_after_days_past_due: Calendar days an agreement charge may be past due before the agreement is suspended,
    count
  reinstatement_fee: Fee to reinstate a suspended agreement, USD
  credit_card_surcharge_pct: Surcharge on agreement payments made by credit card, percent
  card_payments_accepted: Whether agreement charges may be paid by card, boolean
  refund_processing_business_days: Business days (Monday-Friday excluding company holidays) to issue a refund of
    an agreement credit balance, count
  referral_contact_commitment_hours: Hours after a carrier referral by which the insured is contacted, count
  referral_onsite_commitment_hours: Hours after a carrier referral by which a crew is on site for an emergency loss,
    count
  referral_estimate_upload_days: Calendar days after a carrier referral by which the estimate is uploaded to the
    carrier, count
  referral_loss_types: Loss types the carrier may refer under the agreement
  program_scorecard_minimum: Minimum carrier scorecard percentage of referrals meeting every commitment in a quarter
    before the carrier review, percent
  priority_dispatch_rank: Dispatch priority among simultaneous emergency calls, 1 being highest
  site_change_limit_per_term: Times the covered-property list may be changed in one term without a site change fee,
    count
  site_change_fee: Fee per covered-property list change beyond the free changes, USD
  enrollment_review_business_days: Business days (Monday-Friday excluding company holidays) to review an enrollment
    before it is offered for signature, count
  application_expiry_days: Calendar days an unsigned enrollment stays open before it is withdrawn, count
  minimum_paid_terms_for_rebate: Consecutive paid terms required before the volume rebate is earned, count
  sla_claim_window_days: Calendar days after a missed-response dispatch within which the customer may claim the
    SLA credit, count
  rebate_claim_window_days: Calendar days after a term ends within which the volume rebate is calculated and credited,
    count
  annual_fee_due_before_activation: Whether the first term's fee must be paid before the agreement is activated,
    boolean
  expired_reenrollment_wait_days: Calendar days after expiry or cancellation before the customer may enroll again
    at the same tier, count
