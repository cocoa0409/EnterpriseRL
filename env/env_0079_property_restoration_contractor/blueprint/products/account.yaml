events:
- type: account_enroll
  target: account_agreements
  mutation: create
  meaning: A business customer submits an enrollment for a service agreement.
  grain: one row per transaction on the job record
  fields:
    customer_id: customer
    variant_name: tier
    applied_date: submission date
    auto_renew: renewal election
    sites_covered: properties listed
    agreement_balance: '0.00'
  triggers: []
- type: account_activate
  target: account_agreements
  mutation:
    transition:
      from: applied
      to: active
  meaning: The customer signs the agreement and the first term starts.
  grain: one row per transaction on the job record
  fields:
    start_date: term start
    term_end_date: term end
  triggers:
  - event: account:account_annual_fee_charge
    map:
      charge_code: annual_fee
      term_start_date: start_date
- type: account_enrollment_withdraw
  target: account_agreements
  mutation:
    transition:
      from: applied
      to: cancelled
  meaning: An unsigned enrollment is withdrawn or lapses.
  grain: one row per transaction on the job record
  fields:
    cancelled_date: withdrawal date
  triggers: []
- type: account_suspend
  target: account_agreements
  mutation:
    transition:
      from: active
      to: suspended
  meaning: The agreement is suspended for past-due charges.
  grain: one row per transaction on the job record
  fields:
    suspended_date: suspension date
  triggers: []
- type: account_reinstate
  target: account_agreements
  mutation:
    transition:
      from: suspended
      to: active
  meaning: A suspended agreement is reinstated after payment.
  grain: one row per transaction on the job record
  fields:
    start_date: unchanged term start
  triggers:
  - event: account:account_reinstatement_fee
    map:
      charge_code: reinstatement_fee
      term_start_date: start_date
- type: account_expire
  target: account_agreements
  mutation:
    transition:
      from: active
      to: expired
  meaning: The term ends without renewal.
  grain: one row per transaction on the job record
  fields:
    expired_date: expiry date
  triggers: []
- type: account_cancel
  target: account_agreements
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: The customer cancels the agreement mid-term.
  grain: one row per transaction on the job record
  fields:
    cancelled_date: cancellation date
  triggers: []
- type: account_renew
  target: account_agreements
  mutation: update
  meaning: The agreement renews for a new term.
  grain: one row per transaction on the job record
  fields:
    start_date: new term start
    term_end_date: new term end
  triggers:
  - event: account:account_annual_fee_charge
    map:
      charge_code: annual_fee
      term_start_date: start_date
- type: account_site_change
  target: account_agreements
  mutation: update
  meaning: The covered-property list changes.
  grain: one row per transaction on the job record
  fields:
    sites_covered: properties now covered
    auto_renew: renewal election
  triggers: []
- type: account_annual_fee_charge
  target: account_charges
  meaning: The agreement fee for one term.
  grain: one row per term
  distinguish_by:
  - term_start_date
  fields:
    charge_code: annual_fee
    term_start_date: term start
    amount: fee
    posted_date: date posted
  account: agreement_balance
  direction: in
  triggers: []
- type: account_site_fee_charge
  target: account_charges
  meaning: Fees for covered properties beyond the included sites, for one term or one mid-term addition.
  grain: one row per term per service date
  distinguish_by:
  - term_start_date
  - service_date
  fields:
    charge_code: additional_site_fee
    term_start_date: term start
    service_date: date sites were added (term start for the term charge)
    quantity: additional sites
    amount: fee
    posted_date: date posted
  account: agreement_balance
  direction: in
  triggers: []
- type: account_service_charge
  target: account_charges
  meaning: A facility survey, training session or site-list change beyond those included.
  grain: one row per code per service date
  distinguish_by:
  - charge_code
  - service_date
  fields:
    charge_code: site_survey, training_session or site_change_fee
    term_start_date: term start
    service_date: date delivered
    quantity: count
    amount: fee
    posted_date: date posted
  account: agreement_balance
  direction: in
  triggers: []
- type: account_reinstatement_fee
  target: account_charges
  meaning: The fee to reinstate a suspended agreement.
  grain: one row per reinstatement
  distinguish_by:
  - service_date
  fields:
    charge_code: reinstatement_fee
    term_start_date: term start
    service_date: reinstatement date
    amount: fee
    posted_date: date posted
  account: agreement_balance
  direction: in
  triggers: []
- type: account_early_termination_fee
  target: account_charges
  meaning: The fee for cancelling mid-term.
  grain: one row per agreement
  distinguish_by:
  - charge_code
  fields:
    charge_code: early_termination_fee
    term_start_date: term start
    amount: fee
    posted_date: date posted
  account: agreement_balance
  direction: in
  triggers: []
- type: account_late_fee
  target: account_charges
  meaning: A late fee on past-due agreement charges for one monthly fee period.
  grain: one row per monthly fee period
  distinguish_by:
  - fee_period
  fields:
    charge_code: late_fee
    fee_period: fee period
    amount: late fee
    posted_date: date posted
  account: agreement_balance
  direction: in
  triggers: []
- type: account_card_surcharge
  target: account_charges
  meaning: The surcharge on one card payment.
  grain: one row per credit card payment
  distinguish_by:
  - source_payment_id
  fields:
    charge_code: card_surcharge
    source_payment_id: payment surcharged
    amount: surcharge
    posted_date: date posted
  account: agreement_balance
  direction: in
  triggers: []
- type: account_payment
  target: account_payments
  meaning: A payment toward agreement charges.
  grain: one row per tendered payment
  distinguish_by:
  - payment_reference
  fields:
    payment_method: tender
    payment_reference: check, wire or confirmation number
    posted_date: date posted
    amount: amount paid
  account: agreement_balance
  direction: out
  triggers: []
- type: account_sla_credit
  target: account_payments
  meaning: A credit for an emergency dispatch for the customer that missed the response commitment.
  grain: one row per mitigation job
  distinguish_by:
  - related_job_id
  fields:
    related_job_id: late job
    posted_date: date posted
    amount: credit
  account: agreement_balance
  direction: out
  triggers: []
- type: account_volume_rebate
  target: account_payments
  meaning: The volume rebate earned for one term.
  grain: one row per term
  distinguish_by:
  - term_start_date
  fields:
    term_start_date: term the rebate is for
    posted_date: date posted
    amount: rebate
  account: agreement_balance
  direction: out
  triggers: []
- type: account_proration_credit
  target: account_payments
  meaning: The prorated unused annual fee credited on mid-term cancellation.
  grain: one row per cancelled term
  distinguish_by:
  - term_start_date
  fields:
    term_start_date: term cancelled
    posted_date: date posted
    amount: credit
  account: agreement_balance
  direction: out
  triggers: []
- type: account_refund
  target: account_payments
  meaning: Refund of an agreement credit balance.
