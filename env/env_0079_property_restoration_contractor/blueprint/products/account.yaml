- id: account_evt_sla_credit
  subject:
  - account_sla_credit
  rule: The agreement must be in active status on the dispatch date of the job an SLA credit is claimed for. When
    the crew's recorded arrival on an emergency water or fire job of the customer exceeds the agreement's response
    commitment, the agreement earns the tier's SLA credit for that job, at most the tier's maximum credits per job
    and never more than the tier's SLA credit cap per term in total. An SLA credit may be posted only when the customer
    claims it no later than the SLA claim window after the late dispatch. The SLA claim window is counted in calendar
    days starting the day after the late job's opened_date, and a claim made on the last day of the window is in
    time. The SLA credit is posted on the agreement; it is separate from, and stacks with, any late-arrival waiver
    of the service call fee on the job itself.
  eligibility:
  - id: sla_active
    applies_to:
    - account_sla_credit
    kind: caller_fact
    condition: The agreement must be in active status on the dispatch date of the job an SLA credit is claimed for.
    evidence_fields:
    - account_agreements.status
    - water_jobs.opened_date
    - account_payments.related_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_payments.related_job_id
      action_bindings:
        account_payments.related_job_id: related_job_id
  - id: sla_window
    applies_to:
    - account_sla_credit
    kind: time
    condition: An SLA credit may be posted only when the customer claims it no later than the SLA claim window after
      the late dispatch.
    evidence_fields:
    - water_jobs.opened_date
    - account_payments.related_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_payments.related_job_id
      action_bindings:
        account_payments.related_job_id: related_job_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the late dispatch
      anchor_source: water_jobs.opened_date
      relation: not_after
      duration_source: variants.sla_claim_window_days
      unit: calendar_days
      counting_rule: The SLA claim window is counted in calendar days starting the day after the late job's opened_date,
        and a claim made on the last day of the window is in time.
      boundary: inclusive
  params:
    per_tier:
      Ready Profile Service Agreement:
        response_commitment_minutes: =response_commitment_minutes
        sla_credit_amount: =sla_credit_amount
        sla_credit_cap_per_term: =sla_credit_cap_per_term
        max_sla_credits_per_job: =max_sla_credits_per_job
        sla_claim_window_days: =sla_claim_window_days
        service_call_fee_waived: =service_call_fee_waived
