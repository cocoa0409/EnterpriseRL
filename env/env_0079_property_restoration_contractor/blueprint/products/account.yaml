- id: account_carrier_referrals
  subject:
  - account_job_referral
  rule: A referral is recorded only under a Carrier Preferred Vendor Agreement in active status. The carrier may
    refer only the loss types its agreement lists. For each referral the insured is contacted within the referral
    contact commitment hours, a crew is on site within the on-site commitment hours for an emergency loss, and the
    estimate is uploaded within the estimate upload days; a carrier whose quarterly scorecard falls below the scorecard
    minimum is reviewed by a human program manager. The referred loss is then handled as the insured's own jobs
    under a Carrier Program Claim Billing claim file.
