    and the properties listed may not exceed the tier's maximum sites. A customer whose agreement of the same tier
    expired or was cancelled may enroll again at that tier only after the tier's re-enrollment wait has passed.
    The agreement must be in applied status when it is activated or withdrawn. An enrollment is reviewed within
    the tier's review business days and offered for signature; the customer's signature activates the agreement
    and starts a term of the tier's length, and the first term's fee is charged at activation. On tiers that require
    it, the first term's fee is paid before activation. An unsigned enrollment is withdrawn after the tier's application
    expiry days.
