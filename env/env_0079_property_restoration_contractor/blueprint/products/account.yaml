- id: account_evt_payments_and_suspension
  subject:
  - account_payment
  - account_card_surcharge
  - account_late_fee
  - account_suspend
  - account_reinstate
  - account_reinstatement_fee
  - account_refund
  rule: Agreement charges are due the tier's payment terms days after they post and are paid by ACH, check or wire,
    or by card on tiers that accept cards, a credit card payment carrying the tier's surcharge percentage, rounded
    to the cent, half up. A late fee may post only after the grace period following the charge's due date has fully
    passed. The due date is the charge's posting date plus the tier's payment terms days, the grace period is counted
    in calendar days starting the day after that due date, and the first late fee may post on the day after the
    grace period's last day. The late fee is the tier's monthly percentage of the past-due agreement balance with
    the tier's minimum as a floor, at most once per calendar month fee period. An agreement with a charge past due
    longer than the tier's suspension days is suspended, its entitlements, including any service call fee waiver,
    do not apply while suspended, and it is reinstated with the tier's reinstatement fee once the past-due balance
    is paid. A credit balance is refunded to the original tender within the refund processing business days.
  eligibility:
  - id: lf_grace
    applies_to:
    - account_late_fee
    kind: caller_fact
    condition: A late fee may post only after the grace period following the charge's due date has fully passed.
    evidence_fields:
    - account_charges.posted_date
    - account_agreements.agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - account_agreements.agreement_id
      action_bindings:
        account_agreements.agreement_id: agreement_id
  params:
    per_tier:
      Ready Profile Service Agreement:
        payment_terms_days: =payment_terms_days
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        suspension_after_days_past_due: =suspension_after_days_past_due
        reinstatement_fee: =reinstatement_fee
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        card_payments_accepted: =card_payments_accepted
        refund_processing_business_days: =refund_processing_business_days
        late_fee_grace_days: =late_fee_grace_days
      Silver Priority Service Agreement:
