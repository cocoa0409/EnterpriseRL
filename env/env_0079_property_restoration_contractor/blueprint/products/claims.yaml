      timing: pre_action
      correlation_keys:
      - - claims_files.claim_file_id
      action_bindings:
        claims_files.claim_file_id: claim_file_id
    state_contract:
      field: claims_files.status
      allowed:
      - opened
      - estimate_submitted
      - approved
      - settled
  params:
    per_tier:
      Homeowner Direct Pay Claim Support:
        deductible_collected_by_company: =deductible_collected_by_company
