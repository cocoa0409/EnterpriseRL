- id: claims_storage_coverage
  subject:
  - claims_storage_extension_request
  - claims_storage_approval
  rule: The carrier pays contents storage only through the approved storage end date recorded on the claim file;
    the end date is set or moved only when the carrier confirms it in writing. The claim file must be in approved
    status when a storage extension is requested. Extensions may be requested only on tiers that allow them, for
    no more than the tier's storage extension maximum beyond the current approved end date, and only while a contents
    job of the file is in storage. A storage extension request must be submitted at least the tier's storage extension
    lead days before the approved storage end date. A request submitted later is not sent, and storage after the
    approved end date is billed to the customer under the contents storage rules.
  eligibility:
  - id: se_state
    applies_to:
    - claims_storage_extension_request
    kind: state
    condition: The claim file must be in approved status when a storage extension is requested.
    evidence_fields:
    - claims_files.status
    - claims_files.claim_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_files.claim_file_id
      action_bindings:
        claims_files.claim_file_id: claim_file_id
    state_contract:
      field: claims_files.status
      allowed:
      - approved
  - id: se_lead
    applies_to:
    - claims_storage_extension_request
    kind: caller_fact
    condition: A storage extension request must be submitted at least the tier's storage extension lead days before
      the approved storage end date.
    evidence_fields:
    - claims_files.approved_storage_end_date
    - claims_files.claim_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_files.claim_file_id
      action_bindings:
        claims_files.claim_file_id: claim_file_id
  params:
    per_tier:
      Homeowner Direct Pay Claim Support:
        storage_extension_request_allowed: =storage_extension_request_allowed
        storage_extension_max_days: =storage_extension_max_days
        storage_extension_lead_days: =storage_extension_lead_days
      Direction to Pay Claim Billing:
        storage_extension_request_allowed: =storage_extension_request_allowed
