- id: claims_evt_deductible
  subject:
  - claims_deductible_assessment
  - claims_deductible_payment
  rule: 'The claim file must be in opened, estimate_submitted, approved or settled status when a deductible line
    is posted. On arrangements where the carrier pays the company net of the deductible, the full per-occurrence
    deductible from the policy declarations is assessed once when the file opens and collected from the insured;
    on arrangements where the carrier pays the insured, no deductible is assessed on the file because the insured
    pays the company''s invoices in full. The deductible is due within the tier''s deductible due days counted in
    calendar days from the collection point: the earliest date on which a water, fire, mold or contents job of the
    file was authorized or a rebuild contract of the file was signed when the collection point is at_authorization,
    or the earliest final invoice date among the mitigation jobs and rebuild contract of the file when it is at_final_invoice.
    It may be paid in up to the tier''s maximum number of installments, numbered from 1, and by card only on tiers
    that accept cards. The company never waives, absorbs, discounts or rebates a deductible, and several states,
    Texas among them (Insurance Code Chapter 707), prohibit a contractor from doing so; a customer asking for that
    is told it is not available. A deductible payment larger than the remaining deductible due is not accepted for
    the excess.'
  eligibility:
  - id: dd_state
    applies_to:
    - claims_deductible_assessment
    - claims_deductible_payment
    kind: state
    condition: The claim file must be in opened, estimate_submitted, approved or settled status when a deductible
      line is posted.
    evidence_fields:
    - claims_files.status
    - claims_files.claim_file_id
    evidence_contract:
