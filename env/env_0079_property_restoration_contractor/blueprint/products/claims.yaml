category: claims
display_name: Insurance Claim Services
binding:
  holding_table: claims_files
  event_tables:
  - claims_approvals
  - claims_payments
  - claims_deductibles
  - claims_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    carrier_receivable: carrier_receivable
    deductible_due: deductible_due
lifecycle:
  states:
  - opened
  - estimate_submitted
  - approved
  - settled
  - closed
  - denied
  - withdrawn
  transitions:
  - from: opened
    to: estimate_submitted
    by: agent
    means: The estimate is submitted to the carrier or delivered to the insured.
  - from: estimate_submitted
    to: approved
    by: system
    means: The carrier's initial scope approval is received.
  - from: estimate_submitted
    to: denied
    by: system
    means: The carrier's denial of coverage is received.
  - from: opened
    to: withdrawn
    by: user
    means: The insured withdraws the arrangement.
  - from: approved
    to: settled
    by: system
    means: Every approved amount has been paid or written off.
  - from: settled
    to: closed
    by: agent
    means: The deductible is paid and every linked job is closed.
accounts:
- key: carrier_receivable
  unit: USD
  meaning: Amount the carrier has approved on the claim file and not yet paid or written off.
- key: deductible_due
  unit: USD
  meaning: Deductible assessed on the claim file that the insured has not yet paid.
parameter_schema:
  company_submits_estimate: Whether the company sends its estimate directly to the carrier (otherwise it is delivered
    to the insured or their adjuster to submit), boolean
  estimate_submission_target_days: Calendar days after the claim file is opened by which the estimate is submitted
    or delivered, count
  overhead_pct: Overhead percentage added to the estimate when general contractor overhead and profit applies, percent
  profit_pct: Profit percentage added to the estimate when general contractor overhead and profit applies, percent
  op_min_trades: Minimum number of distinct trades on the estimate for overhead and profit to apply, count
  program_pricing_discount_pct: Discount from the company price list required by the carrier program agreement,
    percent
  initial_reinspection_threshold: Estimate amount at or above which the carrier reinspects before approving, USD
  company_submits_supplements: Whether the company submits supplements to the carrier itself (otherwise it prepares
    them for the insured or public adjuster), boolean
  supplement_window_days: Calendar days after the carrier's initial approval within which a supplement may be submitted,
    count
  supplement_minimum_amount: Smallest supplement the company will submit, USD
  max_pending_supplements: Maximum supplements awaiting a carrier decision on one claim file at a time, count
  supplement_reinspection_threshold: Supplement amount at or above which the carrier reinspects before deciding,
    USD
  code_upgrade_supplement_allowed: Whether code-upgrade supplements may be submitted against the ordinance or law
    limit, boolean
  mold_supplement_allowed: Whether mold remediation supplements may be submitted against the mold sublimit, boolean
  contents_supplement_allowed: Whether contents-coverage supplements (packout, cleaning, storage) may be submitted,
    boolean
  equipment_days_supplement_allowed: Whether supplements for drying equipment days beyond the approved scope may
    be submitted, boolean
  supplement_followup_days: Calendar days without a carrier decision after which the company follows up on a supplement,
    count
  supplement_followups_before_escalation: Follow-ups without a carrier decision after which the supplement is escalated
    to the carrier's claim supervisor, count
  deductible_collected_by_company: Whether the carrier pays the company net of the deductible so the company collects
    the deductible from the insured, boolean
  deductible_collection_point: 'When the deductible is due: at_authorization (before work starts) or at_final_invoice'
  deductible_due_days: Calendar days after the collection point by which the deductible must be paid, count
  deductible_installments_max: Maximum number of installments the deductible may be paid in, count
  deductible_card_accepted: Whether the deductible may be paid by credit or debit card, boolean
  accepts_contractor_direct: Whether carrier payments may be issued directly to the company, boolean
  accepts_two_party_checks: Whether two-party checks naming the insured and the company are accepted for endorsement,
    boolean
  two_party_endorsement_days: Calendar days after the company notifies the insured of a two-party check by which
    the insured is asked to endorse it, count
  mortgagee_loss_draft_supported: Whether the company draws funds from a mortgagee loss-draft account through rebuild
    draw releases, boolean
  advance_request_allowed: Whether the company may request an emergency mitigation advance from the carrier, boolean
  emergency_advance_request_limit: Largest emergency mitigation advance the company requests, USD
  progress_billing_allowed: Whether interim progress billings are submitted to the carrier before job completion,
    boolean
  progress_billing_min_amount: Smallest interim progress billing submitted, USD
  progress_billing_interval_days: Minimum calendar days between interim progress billings, count
  payment_allocation_order: Order in which one dwelling-coverage carrier payment is applied across the jobs of a
    claim file
  depreciation_request_window_days: Calendar days after the first ACV payment within which the company or insured
    requests release of recoverable depreciation, count
  depreciation_release_requires_completion: Whether the release request requires the related job to be complete,
    boolean
  company_requests_depreciation: Whether the company submits the depreciation release request itself, boolean
  storage_extension_request_allowed: Whether the company may ask the carrier to extend the approved contents storage
    end date, boolean
  storage_extension_max_days: Longest extension of the storage end date asked for in one request, calendar days
  storage_extension_lead_days: Calendar days before the approved storage end date by which an extension request
    must be submitted, count
  withdrawal_window_days: Calendar days after the instrument is signed within which the insured may withdraw the
    arrangement, count
  withdrawal_after_work_allowed: Whether the arrangement may be withdrawn after any job of the claim file has been
    authorized, boolean
  public_adjuster_required: Whether a public adjuster must be on file, boolean
  carrier_referral_required: Whether a carrier program referral number must be on file, boolean
  aob_instrument: Whether the insured signs a post-loss assignment of benefits (rather than a direction to pay or
    nothing), boolean
  minimum_estimate_amount: Smallest estimate a file of this tier may carry, USD
  program_price_writeoff_allowed: Whether carrier program price adjustments are written off rather than billed to
    the insured, boolean
  denied_line_billable_to_customer: Whether a line the carrier declines may be billed to the customer, boolean
  appraisal_referral_threshold: Remaining disputed amount at or above which a scope dispute is referred to a human
    claims manager for appraisal, USD
  desk_writeoff_cap: Largest single carrier-denied-line write-off the desk may post, USD
