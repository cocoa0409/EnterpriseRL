events:
- type: claims_file_open
  target: claims_files
  mutation: create
  meaning: A claim file is opened for one carrier claim under one billing arrangement.
  grain: one row per transaction on the job record
  fields:
    customer_id: insured customer
    variant_name: claim billing arrangement
    carrier_name: carrier
    carrier_claim_number: carrier claim number
    policy_state: governing state
    policy_issue_date: policy issue date
    loss_type: peril
    loss_date: date of loss
    opened_date: file opening date
    assignment_signed_date: instrument signing date
    deductible_amount: deductible
    mold_sublimit: mold sublimit
    ordinance_law_limit: ordinance or law limit
    mortgagee_name: mortgagee
    public_adjuster_name: public adjuster
    carrier_referral_number: program referral number
    carrier_receivable: opening receivable, 0.00
    deductible_due: opening deductible due, 0.00
  triggers:
  - event: claims:claims_deductible_assessment
    when:
      variant_name:
      - Direction to Pay Claim Billing
      - Assignment of Benefits Claim Billing
      - Carrier Program Claim Billing
      - Commercial Large Loss Claim Administration
    map:
      amount: deductible_amount
      posted_date: opened_date
- type: claims_estimate_submit
  target: claims_files
  mutation:
    transition:
      from: opened
      to: estimate_submitted
  meaning: The company's estimate is submitted to the carrier or delivered to the insured.
  grain: one row per transaction on the job record
  fields:
    estimate_submitted_date: submission date
    estimate_amount: estimate RCV
    estimate_trade_count: distinct trades
  triggers: []
- type: claims_carrier_approval
  target: claims_files
  mutation:
    transition:
      from: estimate_submitted
      to: approved
  meaning: The carrier issues its initial scope approval.
  grain: one row per transaction on the job record
  fields:
    approved_date: approval date
  triggers:
  - event: claims:claims_scope_approval
    map:
      approval_type: initial
      posted_date: approved_date
- type: claims_carrier_denial
  target: claims_files
  mutation:
    transition:
      from: estimate_submitted
      to: denied
  meaning: The carrier denies coverage for the claim.
  grain: one row per transaction on the job record
  fields:
    denied_date: denial date
  triggers: []
- type: claims_file_withdraw
  target: claims_files
  mutation:
    transition:
      from: opened
      to: withdrawn
  meaning: The insured withdraws the direction to pay, assignment or claim support arrangement.
  grain: one row per transaction on the job record
  fields:
    withdrawn_date: withdrawal date
  triggers: []
- type: claims_file_settle
  target: claims_files
  mutation:
    transition:
      from: approved
      to: settled
  meaning: Every approved amount has been paid or written off.
  grain: one row per transaction on the job record
  fields:
    settled_date: settlement date
  triggers: []
- type: claims_file_close
  target: claims_files
  mutation:
    transition:
      from: settled
      to: closed
  meaning: The settled claim file is closed.
  grain: one row per transaction on the job record
  fields:
    closed_date: closing date
  triggers: []
- type: claims_storage_approval
  target: claims_files
  mutation: update
  meaning: The carrier confirms the date through which it will pay contents storage.
  grain: one row per transaction on the job record
  fields:
    approved_storage_end_date: approved storage end date
  triggers: []
- type: claims_scope_approval
  target: claims_approvals
  meaning: The carrier approves an amount of scope, initially or on a supplement.
  grain: one row per approval type per supplement request per coverage part
  distinguish_by:
  - approval_type
  - claim_request_id
  - coverage_part
  fields:
    approval_type: initial or supplement
    claim_request_id: supplement decided, empty for initial
    coverage_part: coverage
    depreciation_withheld: depreciation held back
    posted_date: date recorded
    amount: RCV approved
  account: carrier_receivable
  direction: in
  triggers: []
- type: claims_receivable_writeoff
  target: claims_approvals
  meaning: Part of an approved amount is written off as not collectible.
  grain: one row per approval line per write-off reason
  distinguish_by:
  - source_approval_id
  - writeoff_reason
  fields:
    source_approval_id: approval line reduced
    writeoff_reason: reason
    posted_date: date recorded
    amount: amount written off
  account: carrier_receivable
  direction: out
  triggers: []
- type: claims_carrier_payment
  target: claims_payments
  meaning: The carrier issues a payment on the claim.
  grain: one row per carrier check or EFT
  distinguish_by:
  - check_number
  fields:
    payment_type: what was paid
    coverage_part: coverage
    payee_route: how it was routed
    check_number: check or trace number
    received_date: date received
    amount: amount paid
  account: carrier_receivable
  direction: out
  triggers: []
- type: claims_check_endorsement
  target: claims_requests
  meaning: The insured endorses a two-party carrier check over to the company.
  grain: one row per two-party check endorsed
  distinguish_by:
  - claim_payment_id
  fields:
    claim_payment_id: two-party check endorsed
    request_date: date endorsed
    requested_amount: '0.00'
  triggers: []
- type: claims_supplement_submit
  target: claims_requests
  meaning: A supplement asking the carrier to approve additional scope is submitted.
  grain: one row per supplement number on the file
  distinguish_by:
  - supplement_number
  fields:
    supplement_number: sequence
    supplement_reason: basis
    coverage_part: coverage
    related_job_id: job concerned
    request_date: submission date
    requested_amount: amount requested
  triggers: []
- type: claims_depreciation_release_request
  target: claims_requests
  meaning: Release of recoverable depreciation withheld by the carrier is requested on proof of completion.
  grain: one row per coverage part per completed job
  distinguish_by:
  - coverage_part
  - related_job_id
  fields:
    coverage_part: coverage
    related_job_id: completed job evidencing completion
    request_date: submission date
    requested_amount: depreciation requested
  triggers: []
- type: claims_storage_extension_request
  target: claims_requests
  meaning: The carrier is asked to extend the date through which it pays contents storage.
  grain: one row per requested storage end date
  distinguish_by:
  - requested_storage_end_date
  fields:
    requested_storage_end_date: end date asked for
    related_job_id: contents job in storage
    request_date: submission date
    requested_amount: '0.00'
  triggers: []
- type: claims_deductible_assessment
  target: claims_deductibles
  meaning: The insured's deductible is assessed on the claim file.
  grain: one row per claim file
  distinguish_by:
  - posted_date
  fields:
    posted_date: assessment date
    amount: deductible assessed
  account: deductible_due
  direction: in
  triggers: []
- type: claims_deductible_payment
  target: claims_deductibles
  meaning: The insured pays all or an installment of the deductible.
  grain: one row per tendered deductible payment
  distinguish_by:
  - payment_reference
  fields:
    payment_method: tender
    payment_reference: check or confirmation number
    installment_number: installment sequence
