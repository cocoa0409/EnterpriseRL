- id: claims_evt_depreciation_release
  subject:
  - claims_depreciation_release_request
  rule: 'The claim file must be in approved status when a depreciation release is requested. Recoverable depreciation
    withheld on a replacement cost claim is released by the carrier only once the work is shown complete. The job
    named in the request must be complete: a water, fire or mold job in drying_complete, cleaning_complete, cleared,
    invoiced or closed status, a rebuild contract in substantially_complete, final_invoiced or closed status, or
    a contents job in returned, invoiced or closed status. A depreciation release may be requested only no later
    than the depreciation window after the first ACV payment was received on the claim file. The depreciation window
    is counted in calendar days starting the day after the received_date of the earliest acv carrier payment on
    the file, and a request submitted on the last day of the window is in time. The amount requested is the depreciation
    withheld on the approvals of that coverage part less any depreciation already released on it. Once the window
    has passed without a request, the withheld depreciation is written off as depreciation_forfeited and becomes
    the customer''s own responsibility on tiers where denied amounts are billable to the customer.'
  eligibility:
  - id: dr_state
    applies_to:
    - claims_depreciation_release_request
    kind: state
    condition: The claim file must be in approved status when a depreciation release is requested.
    evidence_fields:
    - claims_files.status
    - claims_files.claim_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_files.claim_file_id
      action_bindings:
        claims_files.claim_file_id: claim_file_id
    state_contract:
      field: claims_files.status
      allowed:
      - approved
  - id: dr_complete
    applies_to:
    - claims_depreciation_release_request
    kind: caller_fact
    condition: 'The job named in the request must be complete: a water, fire or mold job in drying_complete, cleaning_complete,
      cleared, invoiced or closed status, a rebuild contract in substantially_complete, final_invoiced or closed
      status, or a contents job in returned, invoiced or closed status.'
    evidence_fields:
    - claims_requests.related_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_requests.related_job_id
      action_bindings:
        claims_requests.related_job_id: related_job_id
  - id: dr_window
    applies_to:
    - claims_depreciation_release_request
    kind: time
    condition: A depreciation release may be requested only no later than the depreciation window after the first
      ACV payment was received on the claim file.
    evidence_fields:
    - claims_payments.received_date
    - claims_files.claim_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_files.claim_file_id
      action_bindings:
        claims_files.claim_file_id: claim_file_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the first ACV payment was received on the claim file
      anchor_source: claims_payments.received_date
      relation: not_after
      duration_source: variants.depreciation_request_window_days
      unit: calendar_days
      counting_rule: The depreciation window is counted in calendar days starting the day after the received_date
        of the earliest acv carrier payment on the file, and a request submitted on the last day of the window is
        in time.
      boundary: inclusive
  params:
    per_tier:
      Homeowner Direct Pay Claim Support:
        depreciation_request_window_days: =depreciation_request_window_days
        company_requests_depreciation: =company_requests_depreciation
        depreciation_release_requires_completion: =depreciation_release_requires_completion
      Direction to Pay Claim Billing:
        depreciation_request_window_days: =depreciation_request_window_days
        company_requests_depreciation: =company_requests_depreciation
        depreciation_release_requires_completion: =depreciation_release_requires_completion
      Assignment of Benefits Claim Billing:
        depreciation_request_window_days: =depreciation_request_window_days
        company_requests_depreciation: =company_requests_depreciation
        depreciation_release_requires_completion: =depreciation_release_requires_completion
      Carrier Program Claim Billing:
        depreciation_request_window_days: =depreciation_request_window_days
        company_requests_depreciation: =company_requests_depreciation
        depreciation_release_requires_completion: =depreciation_release_requires_completion
      Public Adjuster Coordinated Claim Billing:
        depreciation_request_window_days: =depreciation_request_window_days
        company_requests_depreciation: =company_requests_depreciation
        depreciation_release_requires_completion: =depreciation_release_requires_completion
      Commercial Large Loss Claim Administration:
        depreciation_request_window_days: =depreciation_request_window_days
        company_requests_depreciation: =company_requests_depreciation
        depreciation_release_requires_completion: =depreciation_release_requires_completion
- id: claims_evt_writeoff
  subject:
  - claims_receivable_writeoff
  rule: The claim file must be in approved status when a write-off is posted. A write-off names the approval line
    it reduces and never exceeds that line's amount less earlier write-offs of it. program_price_adjustment applies
    only on Carrier Program Claim Billing, where the carrier's program pricing review is final and the difference
    is never billed to the insured. carrier_denied_line records a line the carrier declined after approval; on tiers
    where denied lines are billable to the customer, the same amount stays owed by the customer on the job, and
    on Assignment of Benefits and Carrier Program files it is never billed to the customer. A carrier_denied_line
    write-off larger than the tier's desk write-off cap is not posted by the desk. A larger write-off, or a remaining
    dispute at or above the tier's appraisal referral threshold, is handed to a human representative as not covered
    by policy. depreciation_forfeited is posted only after the depreciation window has passed without a request.
  eligibility:
  - id: wo_state
    applies_to:
    - claims_receivable_writeoff
    kind: state
    condition: The claim file must be in approved status when a write-off is posted.
    evidence_fields:
    - claims_files.status
    - claims_files.claim_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_files.claim_file_id
      action_bindings:
        claims_files.claim_file_id: claim_file_id
    state_contract:
      field: claims_files.status
      allowed:
      - approved
  - id: wo_cap
    applies_to:
    - claims_receivable_writeoff
    kind: caller_fact
    condition: A carrier_denied_line write-off larger than the tier's desk write-off cap is not posted by the desk.
    evidence_fields:
    - claims_approvals.amount
    - claims_approvals.writeoff_reason
    - claims_approvals.claim_approval_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_approvals.claim_approval_id
      action_bindings:
        claims_approvals.claim_approval_id: source_approval_id
  params:
