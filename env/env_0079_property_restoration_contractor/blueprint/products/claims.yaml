- id: claims_withdrawal
  subject:
  - claims_file_withdraw
  rule: The claim file must be in opened status when the arrangement is withdrawn. Withdrawal is the insured's own
    act. The insured may withdraw the arrangement only no later than the withdrawal window after the arrangement
    instrument was signed. The withdrawal window is counted in calendar days starting the day after the claim file's
    assignment_signed_date, and a withdrawal on the last day of the window is in time. On tiers that do not allow
    withdrawal after work, no water, fire, mold or contents job linked to the claim file may have been authorized
    and no rebuild contract linked to it may have been signed. After withdrawal the carrier pays the insured directly,
    and every job of the loss is billed to the customer as self-pay. A withdrawal request outside these conditions
    is handed to a human representative as not covered by policy.
  eligibility:
  - id: wd_state
    applies_to:
    - claims_file_withdraw
    kind: state
    condition: The claim file must be in opened status when the arrangement is withdrawn.
    evidence_fields:
    - claims_files.status
    - claims_files.claim_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_files.claim_file_id
      action_bindings:
        claims_files.claim_file_id: claim_file_id
    state_contract:
      field: claims_files.status
      allowed:
      - opened
  - id: wd_window
    applies_to:
    - claims_file_withdraw
    kind: time
    condition: The insured may withdraw the arrangement only no later than the withdrawal window after the arrangement
      instrument was signed.
    evidence_fields:
    - claims_files.assignment_signed_date
    - claims_files.claim_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_files.claim_file_id
      action_bindings:
        claims_files.claim_file_id: claim_file_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the arrangement instrument was signed
      anchor_source: claims_files.assignment_signed_date
      relation: not_after
      duration_source: variants.withdrawal_window_days
      unit: calendar_days
      counting_rule: The withdrawal window is counted in calendar days starting the day after the claim file's assignment_signed_date,
        and a withdrawal on the last day of the window is in time.
      boundary: inclusive
  - id: wd_work
    applies_to:
    - claims_file_withdraw
    kind: caller_fact
    condition: On tiers that do not allow withdrawal after work, no water, fire, mold or contents job linked to
      the claim file may have been authorized and no rebuild contract linked to it may have been signed.
    evidence_fields:
    - water_jobs.authorized_date
    - fire_jobs.authorized_date
    - mold_jobs.authorized_date
    - rebuild_contracts.signed_date
    - contents_jobs.authorized_date
    - claims_files.claim_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_files.claim_file_id
      action_bindings:
        claims_files.claim_file_id: claim_file_id
  params:
    per_tier:
      Homeowner Direct Pay Claim Support:
        withdrawal_window_days: =withdrawal_window_days
        withdrawal_after_work_allowed: =withdrawal_after_work_allowed
      Direction to Pay Claim Billing:
        withdrawal_window_days: =withdrawal_window_days
        withdrawal_after_work_allowed: =withdrawal_after_work_allowed
      Assignment of Benefits Claim Billing:
        withdrawal_window_days: =withdrawal_window_days
        withdrawal_after_work_allowed: =withdrawal_after_work_allowed
      Carrier Program Claim Billing:
        withdrawal_window_days: =withdrawal_window_days
        withdrawal_after_work_allowed: =withdrawal_after_work_allowed
      Public Adjuster Coordinated Claim Billing:
        withdrawal_window_days: =withdrawal_window_days
        withdrawal_after_work_allowed: =withdrawal_after_work_allowed
      Commercial Large Loss Claim Administration:
