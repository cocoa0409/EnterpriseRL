  account: deductible_due
  direction: out
  triggers: []
measures:
- id: claims_msr_pending_supplements
  window: current state of one claim file
  measure: count of claims_supplement_submit rows on the file that no claims_scope_approval row references through
    claim_request_id
- id: claims_msr_code_upgrade_approved
  window: the life of one claim file
  measure: sum of amount over claims_scope_approval rows whose claim_request_id is a supplement with supplement_reason
    code_upgrade
- id: claims_msr_mold_approved
  window: the life of one claim file
  measure: sum of amount over claims_scope_approval rows whose claim_request_id is a supplement with supplement_reason
    mold_remediation, plus the mold portion of the initial approval when the loss_type is mold
- id: claims_msr_deductible_paid
  window: the life of one claim file
  measure: sum of amount over claims_deductible_payment rows on the file
policies:
- id: claims_agg_multi_holding
  subject:
  - claims_file_open
  rule: 'A customer may hold any number of claim files at once, one for each carrier claim; landlords, property
    managers and associations often have several losses open across their properties, and one insured can have claims
    with different carriers. Each claim file stands on its own: deductibles, approvals and carrier payments are
    never moved between claim files.'
  eligibility: []
  params:
    max_per_customer: null
- id: claims_agg_one_file_per_claim
  subject:
  - claims_file_open
  - claims_deductible_assessment
  rule: 'No other claim file that is not withdrawn may exist for the same carrier name and carrier claim number.
    Every job the company performs for the same loss, whether water, fire or mold mitigation, the rebuild contract
    or contents packout, is linked to that one claim file, because the carrier adjusts one claim per occurrence.
    The deductible is one per occurrence: it is assessed once on the claim file, however many jobs the loss produces,
    and it is never charged on a job.'
  eligibility:
  - id: one_file_per_claim
    applies_to:
    - claims_file_open
    kind: dedup
    condition: No other claim file that is not withdrawn may exist for the same carrier name and carrier claim number.
    evidence_fields:
    - claims_files.carrier_name
    - claims_files.carrier_claim_number
    - claims_files.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_files.carrier_name
        - claims_files.carrier_claim_number
      action_bindings:
        claims_files.carrier_name: carrier_name
        claims_files.carrier_claim_number: carrier_claim_number
    dedup_contract:
      table: claims_files
      mode: separate_record
      object_bindings:
        carrier_name: carrier_name
        carrier_claim_number: carrier_claim_number
      duplicate_filters:
        status:
        - opened
        - estimate_submitted
        - approved
        - settled
        - closed
        - denied
      distinct_fields: []
- id: claims_arrangement_eligibility
  subject:
  - claims_file_open
  rule: 'The customer''s customer type must be one of the customer types in the entry gate of the arrangement being
    opened. A Public Adjuster Coordinated Claim Billing file requires a public adjuster name on file, and a Carrier
    Program Claim Billing file requires a carrier referral number on file. An Assignment of Benefits Claim Billing
    file may not be opened when the policy state is FL and the policy issue date is on or after the Florida assignment
    cutoff date. Florida law makes post-loss assignments of benefits invalid under residential and commercial property
    policies issued on or after January 1, 2023, so such a file is opened as Direction to Pay Claim Billing instead
    when the insured agrees to sign a direction to pay. The arrangements are mutually exclusive: the company does
    not take an assignment of benefits from an insured who is represented by a public adjuster, and a carrier program
    referral is billed only under Carrier Program Claim Billing. The direction to pay or assignment is signed by
    the insured; the company never signs it on the insured''s behalf.'
