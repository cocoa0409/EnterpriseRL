events:
- type: contents_job_open
  target: contents_jobs
  mutation: create
  meaning: A contents job is booked for the contents at one loss address.
  grain: one row per transaction on the job record
  fields:
    customer_id: customer id
    variant_name: variant name
    claim_file_id: claim file id
    mitigation_job_id: mitigation job id
    loss_address: loss address
    funding_source: funding source
    opened_date: opened date
    balance_due: balance due
  triggers: []
- type: contents_authorization
  target: contents_jobs
  mutation:
    transition:
      from: scheduled
      to: authorized
  meaning: The customer signs the contents work authorization.
  grain: one row per transaction on the job record
  fields:
    authorized_date: date signed
    declared_value: declared value for coverage, 0.00 if declined
  triggers: []
- type: contents_cancel
  target: contents_jobs
  mutation:
    transition:
      from: scheduled
      to: cancelled
  meaning: The customer cancels the job before signing.
  grain: one row per transaction on the job record
  fields:
    cancelled_date: date cancelled
  triggers: []
- type: contents_custody_start
  target: contents_jobs
  mutation:
    transition:
      from: authorized
      to: in_custody
  meaning: The packout, pickup or on-site blocking is completed and the contents are in the company's care.
  grain: one row per transaction on the job record
  fields:
    custody_start_date: date completed
    box_count: boxes packed
    vault_count: vaults filled
  triggers: []
- type: contents_vault_change
  target: contents_jobs
  mutation: update
  meaning: Vaults are added or consolidated while the contents are in storage.
  grain: one row per transaction on the job record
  fields:
    vault_count: vaults now in use
  triggers: []
- type: contents_return_schedule
  target: contents_jobs
  mutation:
    transition:
      from: in_custody
      to: return_scheduled
  meaning: The pack-back or return delivery is scheduled.
  grain: one row per transaction on the job record
  fields:
    return_scheduled_date: scheduled date
  triggers: []
- type: contents_return_complete
  target: contents_jobs
  mutation:
    transition:
      from: return_scheduled
      to: returned
  meaning: The contents are returned and set.
  grain: one row per transaction on the job record
  fields:
    returned_date: return date
  triggers: []
- type: contents_invoice_issue
  target: contents_jobs
  mutation:
    transition:
      from: returned
      to: invoiced
  meaning: The final invoice is issued.
  grain: one row per transaction on the job record
  fields:
    invoiced_date: invoice date
    final_invoice_amount: total charges
    payment_due_date: due date
  triggers: []
- type: contents_job_close
  target: contents_jobs
  mutation:
    transition:
      from: invoiced
      to: closed
  meaning: The balance reaches zero and the job closes.
  grain: one row per transaction on the job record
  fields:
    closed_date: closing date
  triggers: []
- type: contents_packout_charge
  target: contents_charges
  meaning: One packing, moving, inventory, trip or disposal line.
  grain: one row per charge code per service date on the job
  distinguish_by:
  - charge_code
  - service_date
  fields:
    charge_code: code
    service_date: date performed
    quantity: quantity
    unit: unit
    unit_rate: rate
    amount: quantity times unit_rate
  account: balance_due
  direction: in
  triggers: []
- type: contents_storage_charge
  target: contents_charges
  meaning: Storage or declared-value coverage for one storage period.
  grain: one row per storage code per storage period on the job
  distinguish_by:
  - charge_code
  - storage_period_start
  fields:
    charge_code: storage code
    storage_period_start: first day of the period
    bill_to: insurance_claim or customer
    quantity: vaults, items or declared value
    unit: unit
    unit_rate: rate
    amount: charge
  account: balance_due
  direction: in
  triggers: []
- type: contents_cleaning_charge
  target: contents_charges
  meaning: One cleaning line for contents.
  grain: one row per cleaning code per service date on the job
  distinguish_by:
  - charge_code
  - service_date
  fields:
    charge_code: cleaning code
    service_date: date cleaned
    quantity: quantity
    unit: unit
    unit_rate: rate
    amount: quantity times unit_rate
  account: balance_due
  direction: in
  triggers: []
- type: contents_pack_back_charge
  target: contents_charges
  meaning: One move-back line.
  grain: one row per charge code per service date on the job
  distinguish_by:
  - charge_code
  - service_date
  fields:
    charge_code: pack-back code
    service_date: date performed
    quantity: quantity
    unit: unit
    unit_rate: rate
    amount: quantity times unit_rate
  account: balance_due
  direction: in
  triggers: []
- type: contents_late_fee
  target: contents_charges
  meaning: A late fee on a past-due invoiced balance for one monthly fee period.
  grain: one row per monthly fee period on the job
  distinguish_by:
  - fee_period
  fields:
    charge_code: late_fee
    fee_period: fee period
    amount: late fee
  account: balance_due
  direction: in
  triggers: []
- type: contents_card_surcharge
  target: contents_charges
  meaning: The surcharge on one customer payment made by credit card.
  grain: one row per credit card payment
  distinguish_by:
  - source_payment_id
  fields:
    charge_code: card_surcharge
    source_payment_id: payment surcharged
    amount: surcharge
  account: balance_due
  direction: in
  triggers: []
- type: contents_customer_payment
  target: contents_payments
  meaning: A payment by the customer toward the job.
  grain: one row per tendered payment
  distinguish_by:
  - payment_reference
  fields:
    payment_method: tender
    payment_reference: check or confirmation number
    posted_date: date posted
    amount: amount paid
  account: balance_due
  direction: out
  triggers: []
- type: contents_insurance_payment
  target: contents_payments
  meaning: Posting of contents-coverage insurance proceeds from one carrier payment.
  grain: one row per carrier payment posted to the job
  distinguish_by:
  - claim_payment_id
  fields:
    claim_payment_id: carrier payment drawn from
    posted_date: date posted
    amount: amount posted
  account: balance_due
  direction: out
  triggers: []
- type: contents_adjustment_credit
  target: contents_payments
  meaning: A credit correcting or relieving one charge line.
  grain: one row per charge line per credit reason
  distinguish_by:
  - source_charge_id
  - adjustment_reason
  fields:
    source_charge_id: charge credited
    adjustment_reason: reason
    posted_date: date posted
    amount: credit
  account: balance_due
  direction: out
  triggers: []
- type: contents_custody_credit
  target: contents_payments
  meaning: Compensation for one inventoried item lost or damaged in the company's custody.
  grain: one row per inventoried item
  distinguish_by:
  - inventory_tag
  fields:
    inventory_tag: item tag
    damage_type: lost or damaged
    posted_date: date posted
    amount: compensation
  account: balance_due
  direction: out
  triggers: []
- type: contents_refund
  target: contents_payments
  meaning: Refund of an overpayment to the customer's original tender.
  grain: one row per refunded customer payment
  distinguish_by:
  - source_payment_id
  fields:
    source_payment_id: payment refunded from
    payment_method: tender refunded to
    posted_date: refund date
    amount: refund
  account: balance_due
  direction: in
  triggers: []
measures:
- id: contents_msr_storage_periods_billed
  window: the life of one contents job
  measure: count of distinct storage_period_start values among contents_storage_charge rows on the job with charge_code
    vault_storage, climate_vault_storage or oversized_item_storage
- id: contents_msr_goodwill_credited
  window: the life of one contents job
  measure: sum of amount over contents_adjustment_credit rows on the job with adjustment_reason goodwill
- id: contents_msr_customer_storage_unpaid
  window: current state of one contents job
  measure: sum of amount over contents_storage_charge rows on the job with bill_to customer, less the sum of contents_customer_payment
    amounts posted to the job
policies:
- id: contents_agg_multi_holding
  subject:
  - contents_job_open
  rule: A customer may hold any number of contents jobs at once, one for each loss address; landlords and property
    managers with furnished units or common-area furnishings and commercial owners with several sites routinely
    hold more than one. Each job carries its own inventory, storage, ledger and invoice.
  eligibility: []
  params:
    max_per_customer: null
- id: contents_agg_one_job_per_address
  subject:
  - contents_job_open
  - contents_insurance_payment
  rule: 'No other contents job of the same customer for the same loss address may be open when a new job is booked.
    A job is open in every status except closed and cancelled. Contents work is billed under the contents coverage
    of the claim file, separate from the dwelling coverage that pays mitigation and rebuild: a contents-coverage
    carrier payment is posted only to the contents job of the claim file, and dwelling-coverage payments are never
    posted to a contents job.'
  eligibility:
  - id: one_open_contents_job
    applies_to:
    - contents_job_open
    kind: dedup
    condition: No other contents job of the same customer for the same loss address may be open when a new job is
      booked.
    evidence_fields:
    - contents_jobs.customer_id
    - contents_jobs.loss_address
    - contents_jobs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.customer_id
        - contents_jobs.loss_address
      action_bindings:
        contents_jobs.customer_id: customer_id
        contents_jobs.loss_address: loss_address
    dedup_contract:
      table: contents_jobs
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        loss_address: loss_address
      duplicate_filters:
        status:
        - scheduled
        - authorized
        - in_custody
        - return_scheduled
        - returned
        - invoiced
      distinct_fields: []
- id: contents_signing_and_custody
  subject:
  - contents_authorization
  - contents_cancel
  - contents_custody_start
  - contents_vault_change
  rule: The job must be in scheduled status when the contents authorization is signed or the job is cancelled. The
    tier is fixed at booking from the scope in each tier's entry gate. The contents authorization is signed by the
    owner of the contents, and on tiers that allow it the customer may declare a value for declared-value coverage
    at signing; a customer who declines declares 0.00. Contents may be taken into custody on a self-pay job only
    after customer payments posted to the job total at least the tier's self-pay deposit. Insurance-funded jobs
    require no deposit. A scheduled job cancelled before signing carries no charge. At custody start the vault count
    is the boxes packed divided by the tier's vault capacity, rounded up, with furniture packed into the same vaults;
    vaults may later be added or consolidated, and the vault count in force on the first day of a storage period
    is the count billed for that period.
  eligibility:
  - id: au_state
    applies_to:
    - contents_authorization
    - contents_cancel
    kind: state
    condition: The job must be in scheduled status when the contents authorization is signed or the job is cancelled.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - scheduled
  - id: deposit
    applies_to:
    - contents_custody_start
    kind: caller_fact
    condition: Contents may be taken into custody on a self-pay job only after customer payments posted to the job
      total at least the tier's self-pay deposit.
    evidence_fields:
    - contents_jobs.funding_source
    - contents_payments.amount
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
  params:
    per_tier:
      On-Site Contents Manipulation:
        self_pay_deposit_amount: =self_pay_deposit_amount
        vault_capacity_boxes: =vault_capacity_boxes
        valuation_coverage_allowed: =valuation_coverage_allowed
      In-Plant Contents Cleaning:
        self_pay_deposit_amount: =self_pay_deposit_amount
        vault_capacity_boxes: =vault_capacity_boxes
        valuation_coverage_allowed: =valuation_coverage_allowed
      Partial Contents Packout:
        self_pay_deposit_amount: =self_pay_deposit_amount
        vault_capacity_boxes: =vault_capacity_boxes
        valuation_coverage_allowed: =valuation_coverage_allowed
      Full Contents Packout:
        self_pay_deposit_amount: =self_pay_deposit_amount
        vault_capacity_boxes: =vault_capacity_boxes
        valuation_coverage_allowed: =valuation_coverage_allowed
      High-Value Contents Packout:
        self_pay_deposit_amount: =self_pay_deposit_amount
        vault_capacity_boxes: =vault_capacity_boxes
        valuation_coverage_allowed: =valuation_coverage_allowed
      Commercial Contents and Records Recovery:
        self_pay_deposit_amount: =self_pay_deposit_amount
        vault_capacity_boxes: =vault_capacity_boxes
        valuation_coverage_allowed: =valuation_coverage_allowed
- id: contents_evt_packout_and_cleaning
  subject:
  - contents_packout_charge
  - contents_cleaning_charge
  rule: 'The job must be in authorized, in_custody or return_scheduled status when a packout, cleaning or disposal
    line is charged. Packing lines are billed at the tier''s unit rate for each box size, wardrobe box, furniture
    item, crate and electronics item, and an itemized high-value inventory line per high-value item only on tiers
    that carry that rate; a code whose rate on the tier is 0.00 is not available on that tier. On-site manipulation
    is billed per room. Truck trips are billed per load and the inventory report once per job. Cleaning lines are
    billed per item, per box or per cubic foot at the tier''s rates. Deodorization is billable only when the loss
    is fire or smoke, as shown by the loss type of the linked claim file or by a linked fire job, and document freeze-drying
    only on the commercial tier. Non-salvageable items are never discarded on the company''s own decision: they
    stay inventoried until the owner signs a disposal authorization listing them, and on insurance-funded jobs the
    inventory with photos is part of the claim before anything is discarded. A disposal haul is charged only after
    the customer has signed a disposal authorization for the job. Amounts are quantity times unit rate, rounded
    to the cent, half up.'
  eligibility:
  - id: pk_state
    applies_to:
    - contents_packout_charge
    - contents_cleaning_charge
    kind: state
    condition: The job must be in authorized, in_custody or return_scheduled status when a packout, cleaning or
      disposal line is charged.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - authorized
      - in_custody
      - return_scheduled
  - id: disposal_signed
