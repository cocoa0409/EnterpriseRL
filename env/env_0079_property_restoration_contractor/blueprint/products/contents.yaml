    is scheduled only once every rebuild contract of the customer at the same loss address is in substantially_complete,
    final_invoiced or closed status. A loss address with no rebuild contract needs no such wait. The scheduled return
    date must be at least the tier's return notice business days after the day the return is scheduled. Business
    days are Monday through Friday excluding company holidays. Pack-back is billed per box and per furniture item
    reset at the tier's rates, rounded to the cent, half up; storage stops accruing with the storage period in which
    the contents are returned, and no period starting after the returned date is billed.
  eligibility:
  - id: rt_state
    applies_to:
