category: contents
display_name: Contents Packout & Storage
binding:
  holding_table: contents_jobs
  event_tables:
  - contents_charges
  - contents_payments
  intake_tables:
  - contents_disposal_authorizations
  status_field: status
  variant_field: variant_name
  quantity_fields:
    balance_due: balance_due
lifecycle:
  states:
  - scheduled
  - authorized
  - in_custody
  - return_scheduled
  - returned
  - invoiced
  - closed
  - cancelled
  transitions:
  - from: scheduled
    to: authorized
    by: user
    means: The owner of the contents signs the contents authorization.
  - from: scheduled
    to: cancelled
    by: agent
    means: The customer cancels the job before signing.
  - from: authorized
    to: in_custody
    by: system
    means: The packout, pickup or on-site blocking is completed.
  - from: in_custody
    to: return_scheduled
    by: agent
    means: The pack-back or return delivery is scheduled at the customer's request.
  - from: return_scheduled
    to: returned
    by: system
    means: The contents are returned and set.
  - from: returned
    to: invoiced
    by: agent
    means: The final invoice is issued.
  - from: invoiced
    to: closed
    by: system
    means: The balance reaches zero and the job closes.
accounts:
- key: balance_due
  unit: USD
  meaning: 'Amount the customer owes on one contents job: charges and refunds raise it, customer payments, insurance
    postings and credits lower it.'
parameter_schema:
  box_small_rate: Pack, inventory and move out per small box (1.5 cubic feet), USD
  box_medium_rate: Pack, inventory and move out per medium box (3.0 cubic feet), USD
  box_large_rate: Pack, inventory and move out per large box (4.5 cubic feet), USD
  wardrobe_box_rate: Pack, inventory and move out per wardrobe box, USD
  furniture_item_rate: Blanket wrap and move out per furniture item, USD
  crate_build_rate: Custom crate built for art, mirrors or glass per crate, USD
  electronics_item_rate: Pack and move out per electronics item with tagging of cables, USD
  high_value_inventory_item_rate: Itemized photo inventory and condition report per high-value item, USD
  onsite_block_pad_rate_per_room: Move, block and pad contents within the property per room, USD
  contents_tech_hourly_rate: Contents technician labor per hour for work not priced per unit, USD
  truck_trip_fee: Box truck trip per load to or from the facility, USD
  vault_monthly_rate: Standard storage vault (5 x 7 x 8 feet) per vault per storage period, USD
  climate_vault_monthly_rate: Climate-controlled storage vault per vault per storage period, USD
  oversized_item_monthly_rate: Storage of an item too large for a vault (piano, sectional, equipment) per item per
    storage period, USD
  storage_period_days: Length of one storage period, counted from the storage start date, calendar days
  vault_capacity_boxes: Boxes one vault holds when packed with furniture of a typical room, used to set the vault
    count, count
  climate_control_included: Whether vaults on this tier are climate-controlled, boolean
  valuation_coverage_allowed: Whether the customer may buy declared-value coverage for items in storage, boolean
  valuation_coverage_pct: Charge per storage period for declared-value coverage, percent of the declared value
  soft_goods_dry_clean_rate: Dry cleaning per soft-goods item (clothing, drapery panel, linens set), USD
  ultrasonic_cleaning_rate: Ultrasonic cleaning per hard-goods item, USD
  electronics_cleaning_rate: Electronics cleaning and function test per item, USD
  hard_goods_cleaning_rate_per_box: Hand cleaning of hard goods per box, USD
  deodorization_rate_per_box: Ozone or hydroxyl deodorization chamber per box, USD
  document_freeze_dry_rate_per_cuft: Vacuum freeze-drying of wet documents per cubic foot, USD
  deodorization_requires_smoke_loss: Whether deodorization is billable only when the loss is fire or smoke, boolean
  pack_back_box_rate: Move back in and unpack per box, USD
  furniture_reset_rate: Move back in, unwrap and set per furniture item, USD
  disposal_haul_fee_per_load: Haul-off of non-salvageable items per truck load after signed disposal authorization,
    USD
  disposal_authorization_required: Whether non-salvageable items are disposed of only on the customer's signed disposal
    authorization, boolean
  inventory_report_fee: Contents inventory report with photos for the claim, per job, USD
  return_notice_business_days: Business days (Monday-Friday excluding company holidays) of notice required before
    a scheduled pack-back date, count
  return_requires_rebuild_complete: Whether contents are returned only after a linked rebuild contract at the address
    reaches substantial completion, boolean
  custody_liability_cap_per_item: Company's maximum liability for an item lost or damaged in its custody without
    declared-value coverage, USD
  damage_report_days: Calendar days after the contents are returned within which loss or damage in custody must
    be reported, count
  self_pay_deposit_amount: Deposit a self-pay customer pays before the packout or pickup, USD
  payment_terms_days_self_pay: Days after the final invoice date by which a self-pay balance is due, calendar days
  payment_terms_days_insurance: Days after the final invoice date by which an insurance-funded balance is due, calendar
    days
  storage_invoice_due_days: Calendar days after a customer-billed storage period starts by which that period's storage
    is due, count
  storage_past_due_referral_days: Calendar days a customer-billed storage period may stay unpaid before the account
    is referred to a human collections manager, count
  late_fee_pct_monthly: Late fee on the past-due balance per monthly fee period, percent
  late_fee_minimum: Minimum late fee per monthly fee period, USD
  late_fee_grace_days: Grace days after the due date before the first late fee may post, calendar days
  claim_pending_late_fee_suspension_days: Days after the final invoice date during which late fees are suspended
    on an insurance-funded job whose claim file is still awaiting carrier payment, calendar days
  credit_card_surcharge_pct: Surcharge on payments made by credit card (never debit card, ACH or check), percent
  adjustment_dispute_window_days: Days after the final invoice date within which a billing-error or duplicate-line
    dispute may be credited, calendar days
  goodwill_credit_cap: Maximum total goodwill credit the desk may post on one job, USD
  refund_processing_business_days: Business days (Monday-Friday excluding company holidays) to issue an overpayment
    refund after it is approved, count
