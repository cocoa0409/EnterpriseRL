- id: contents_evt_custody_credit
  subject:
  - contents_custody_credit
  rule: The job must be in returned or invoiced status when a custody credit is posted. A custody credit may be
    posted only when the loss or damage is reported no later than the damage report window after the contents were
    returned. The damage report window is counted in calendar days starting the day after the job's returned_date,
    and a report made on the last day of the window is in time. Each inventoried item takes at most one custody
    credit. The item must appear on the job's inventory by its barcode tag. A lost item is compensated at its actual
    cash value and a damaged item at the lesser of its repair cost and its actual cash value, in either case never
    more than the tier's custody liability cap per item; when the customer bought declared-value coverage, the cap
    is replaced by the item's share of the declared value. Items listed on a signed disposal authorization are never
    compensated. A report after the window, or a claim above the cap, is handed to a human representative as not
    covered by policy.
  eligibility:
  - id: cu_state
    applies_to:
    - contents_custody_credit
    kind: state
    condition: The job must be in returned or invoiced status when a custody credit is posted.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - returned
      - invoiced
  - id: cu_window
    applies_to:
    - contents_custody_credit
    kind: time
    condition: A custody credit may be posted only when the loss or damage is reported no later than the damage
      report window after the contents were returned.
    evidence_fields:
    - contents_jobs.returned_date
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the contents were returned
      anchor_source: contents_jobs.returned_date
      relation: not_after
      duration_source: variants.damage_report_days
      unit: calendar_days
      counting_rule: The damage report window is counted in calendar days starting the day after the job's returned_date,
        and a report made on the last day of the window is in time.
      boundary: inclusive
  - id: cu_once
    applies_to:
    - contents_custody_credit
    kind: dedup
    condition: Each inventoried item takes at most one custody credit.
    evidence_fields:
    - contents_payments.contents_job_id
    - contents_payments.inventory_tag
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_payments.contents_job_id
        - contents_payments.inventory_tag
      action_bindings:
        contents_payments.contents_job_id: contents_job_id
        contents_payments.inventory_tag: inventory_tag
    dedup_contract:
      table: contents_payments
      mode: separate_record
      object_bindings:
        contents_job_id: contents_job_id
        inventory_tag: inventory_tag
      duplicate_filters:
        event_type:
        - contents_custody_credit
      distinct_fields: []
  params:
    per_tier:
      On-Site Contents Manipulation:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
      In-Plant Contents Cleaning:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
      Partial Contents Packout:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
      Full Contents Packout:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
      High-Value Contents Packout:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
      Commercial Contents and Records Recovery:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
- id: contents_invoicing
  subject:
  - contents_invoice_issue
  - contents_job_close
  rule: The job must be in returned status when the final invoice is issued. The final invoice amount is the total
    of every charge line on the job, and the payment due date is the invoice date plus the self-pay or insurance
    payment terms by funding source, counted in calendar days. The job closes when its balance due is exactly zero
    after invoicing.
  eligibility:
  - id: in_state
    applies_to:
    - contents_invoice_issue
    kind: state
    condition: The job must be in returned status when the final invoice is issued.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - returned
  params:
    per_tier:
      On-Site Contents Manipulation:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      In-Plant Contents Cleaning:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Partial Contents Packout:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Full Contents Packout:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      High-Value Contents Packout:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Commercial Contents and Records Recovery:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
- id: contents_evt_customer_payment
  subject:
  - contents_customer_payment
  - contents_card_surcharge
  - contents_refund
  rule: The job must not be closed when a customer payment is posted. Customer payments are accepted by credit card,
    debit card, ACH or check and are posted in full to the one job they name; a credit card payment carries a surcharge
    of the credit card surcharge percentage of the payment amount, booked as its own line and rounded to the cent,
    half up, and no other tender is surcharged. A refund is issued only while the job's balance due is negative,
    for the credit balance but never more than the customer payment it is returned from, to that payment's original
    tender, within the refund processing business days; a credit balance created by insurance proceeds is handed
    to a human representative as not covered by policy.
  eligibility:
  - id: py_state
    applies_to:
    - contents_customer_payment
    - contents_card_surcharge
    - contents_refund
    kind: state
    condition: The job must not be closed when a customer payment is posted.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - scheduled
      - authorized
      - in_custody
      - return_scheduled
      - returned
      - invoiced
      - cancelled
  params:
    per_tier:
      On-Site Contents Manipulation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      In-Plant Contents Cleaning:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Partial Contents Packout:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Full Contents Packout:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      High-Value Contents Packout:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Commercial Contents and Records Recovery:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
  formula:
    when: payment_method == 'credit_card'
    amount: round(amount * credit_card_surcharge_pct / 100, 2)
- id: contents_evt_insurance_payment
  subject:
  - contents_insurance_payment
  rule: The job must be in in_custody, return_scheduled, returned or invoiced status when insurance proceeds are
    posted. The carrier payment must be a contents-coverage payment recorded on the same claim file this job is
    linked to. It must have reached the company directly or by a two-party check the insured has endorsed. A carrier
    payment is posted to the same contents job at most once. The amount posted is the lesser of the job's balance
    due less every storage and valuation line billed to customer that is still unpaid, and the carrier payment's
    unapplied remainder after earlier postings from it; customer-billed storage and declared-value coverage are
    never paid from insurance proceeds.
  eligibility:
  - id: ip_state
    applies_to:
    - contents_insurance_payment
    kind: state
    condition: The job must be in in_custody, return_scheduled, returned or invoiced status when insurance proceeds
      are posted.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - in_custody
      - return_scheduled
      - returned
      - invoiced
  - id: ip_same
    applies_to:
    - contents_insurance_payment
    kind: authorization
    condition: The carrier payment must be a contents-coverage payment recorded on the same claim file this job
      is linked to.
    evidence_fields:
    - contents_jobs.claim_file_id
    - claims_payments.claim_file_id
    - claims_payments.coverage_part
    - claims_payments.claim_payment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_payments.claim_payment_id
      action_bindings:
        claims_payments.claim_payment_id: claim_payment_id
  - id: ip_once
    applies_to:
    - contents_insurance_payment
    kind: dedup
    condition: A carrier payment is posted to the same contents job at most once.
    evidence_fields:
    - contents_payments.contents_job_id
    - contents_payments.claim_payment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_payments.contents_job_id
        - contents_payments.claim_payment_id
      action_bindings:
        contents_payments.contents_job_id: contents_job_id
        contents_payments.claim_payment_id: claim_payment_id
    dedup_contract:
      table: contents_payments
      mode: separate_record
      object_bindings:
        contents_job_id: contents_job_id
        claim_payment_id: claim_payment_id
      duplicate_filters:
        event_type:
        - contents_insurance_payment
      distinct_fields: []
- id: contents_evt_adjustment
  subject:
  - contents_adjustment_credit
  rule: The job must be in returned or invoiced status when an adjustment credit is posted. A billing_error credit
    equals the amount charged on the line less the amount the tier's rate and the recorded quantity produce, including
    a storage period billed to the wrong party or after the returned date, which is credited in full; a duplicate_line
    credit equals the full amount of a line repeating another of the same code and date or period. A billing_error
    or duplicate_line credit may be posted only when the customer raises the dispute no later than the dispute window
    after the final invoice was issued on this job. The dispute window is counted in calendar days starting the
    day after the job's invoiced_date, and a dispute raised on the last day of the window is in time; on a job not
    yet invoiced the window has not started and the dispute is always in time. Goodwill credits on one job may not
    exceed the tier's goodwill credit cap in total. A goodwill request above the remaining cap is handed to a human
    representative as not covered by policy. Each charge line takes at most one adjustment credit.
  eligibility:
  - id: ad_state
    applies_to:
    - contents_adjustment_credit
    kind: state
    condition: The job must be in returned or invoiced status when an adjustment credit is posted.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - returned
      - invoiced
  - id: ad_window
    applies_to:
    - contents_adjustment_credit
    kind: time
    condition: A billing_error or duplicate_line credit may be posted only when the customer raises the dispute
      no later than the dispute window after the final invoice was issued on this job.
    evidence_fields:
    - contents_jobs.invoiced_date
    - contents_charges.contents_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_charges.contents_charge_id
      action_bindings:
        contents_charges.contents_charge_id: source_charge_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the final invoice was issued on this job
      anchor_source: contents_jobs.invoiced_date
      relation: not_after
      duration_source: variants.adjustment_dispute_window_days
      unit: calendar_days
      counting_rule: The dispute window is counted in calendar days starting the day after the job's invoiced_date,
        and a dispute raised on the last day of the window is in time; on a job not yet invoiced the window has
        not started and the dispute is always in time.
      boundary: inclusive
  - id: ad_goodwill
    applies_to:
    - contents_adjustment_credit
    kind: caller_fact
    condition: Goodwill credits on one job may not exceed the tier's goodwill credit cap in total.
    evidence_fields:
    - contents_payments.adjustment_reason
    - contents_payments.amount
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
  params:
    per_tier:
      On-Site Contents Manipulation:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      In-Plant Contents Cleaning:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Partial Contents Packout:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Full Contents Packout:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      High-Value Contents Packout:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Commercial Contents and Records Recovery:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
  measures:
  - contents_msr_goodwill_credited
- id: contents_evt_late_fee
  subject:
  - contents_late_fee
  rule: The job must be in invoiced status when a late fee is charged. A late fee may post only after the grace
    period following the payment due date recorded at invoicing has fully passed. The grace period is counted in
    calendar days starting the day after the payment_due_date, and the first late fee may post on the day after
    the grace period's last day. A late fee is assessed at most once per calendar month fee period at the late fee
    percentage of the balance due, with the late fee minimum as a floor, rounded to the cent, half up. No late fee
    posts on an insurance_claim job while its linked claim file is in opened, estimate_submitted or approved status
    and the suspension period counted from the invoice date has not ended. Late fees are never back-dated to a suspended
    period, and a job with a zero or negative balance is never charged a late fee.
  eligibility:
  - id: lf_state
    applies_to:
    - contents_late_fee
    kind: state
    condition: The job must be in invoiced status when a late fee is charged.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - invoiced
  - id: lf_grace
    applies_to:
    - contents_late_fee
    kind: time
    condition: A late fee may post only after the grace period following the payment due date recorded at invoicing
      has fully passed.
    evidence_fields:
    - contents_jobs.payment_due_date
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the payment due date recorded at invoicing
      anchor_source: contents_jobs.payment_due_date
      relation: not_before
      duration_source: variants.late_fee_grace_days
      unit: calendar_days
      counting_rule: The grace period is counted in calendar days starting the day after the payment_due_date, and
        the first late fee may post on the day after the grace period's last day.
      boundary: exclusive
  - id: lf_susp
    applies_to:
    - contents_late_fee
    kind: caller_fact
    condition: No late fee posts on an insurance_claim job while its linked claim file is in opened, estimate_submitted
      or approved status and the suspension period counted from the invoice date has not ended.
    evidence_fields:
    - contents_jobs.claim_file_id
    - claims_files.status
    - contents_jobs.invoiced_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.claim_file_id
      action_bindings:
        contents_jobs.claim_file_id: claim_file_id
  params:
    per_tier:
      On-Site Contents Manipulation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      In-Plant Contents Cleaning:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Partial Contents Packout:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Full Contents Packout:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      High-Value Contents Packout:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Commercial Contents and Records Recovery:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
  formula:
    amount: max(late_fee_minimum, round(balance_due * late_fee_pct_monthly / 100, 2))
