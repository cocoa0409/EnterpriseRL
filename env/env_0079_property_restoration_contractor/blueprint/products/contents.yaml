        storage_invoice_due_days: =storage_invoice_due_days
        storage_past_due_referral_days: =storage_past_due_referral_days
      Full Contents Packout:
        storage_period_days: =storage_period_days
        vault_monthly_rate: =vault_monthly_rate
        climate_vault_monthly_rate: =climate_vault_monthly_rate
        oversized_item_monthly_rate: =oversized_item_monthly_rate
