events:
- type: fire_job_dispatch
  target: fire_jobs
  mutation: create
  meaning: A fire or smoke call is booked and a crew is dispatched, opening a fire mitigation job.
  grain: one row per transaction on the job record
  fields:
    customer_id: customer id
    variant_name: variant name
    claim_file_id: claim file id
    loss_address: loss address
    property_type: property type
    year_built: year built
    loss_date: loss date
    opened_date: opened date
    dispatch_window: dispatch window
    onsite_arrival_minutes: onsite arrival minutes
    smoke_severity: smoke severity
    affected_area_sqft: affected area sqft
    occupied_during_work: occupied during work
    funding_source: funding source
    balance_due: balance due
  triggers: []
- type: fire_work_authorization
  target: fire_jobs
  mutation:
    transition:
      from: dispatched
      to: authorized
  meaning: The owner or the owner's authorized agent signs the cleaning authorization.
  grain: one row per transaction on the job record
  fields:
    authorized_date: date signed
  triggers: []
- type: fire_dispatch_cancel
  target: fire_jobs
  mutation:
    transition:
      from: dispatched
      to: cancelled
  meaning: The customer declines cleaning before signing.
  grain: one row per transaction on the job record
  fields:
    cancelled_date: date cancelled
  triggers: []
- type: fire_cleaning_start
  target: fire_jobs
  mutation:
    transition:
      from: authorized
      to: cleaning
  meaning: Cleaning and deodorization begin.
  grain: one row per transaction on the job record
  fields:
    cleaning_start_date: start date
  triggers: []
- type: fire_cleaning_complete
  target: fire_jobs
  mutation:
    transition:
      from: cleaning
      to: cleaning_complete
  meaning: Cleaning and deodorization are complete and equipment is removed.
  grain: one row per transaction on the job record
  fields:
    cleaning_complete_date: completion date
  triggers: []
- type: fire_invoice_issue
  target: fire_jobs
  mutation:
    transition:
      from: cleaning_complete
      to: invoiced
  meaning: The final invoice is issued.
  grain: one row per transaction on the job record
  fields:
    invoiced_date: invoice date
    final_invoice_amount: total charges
    payment_due_date: due date
  triggers: []
- type: fire_job_close
  target: fire_jobs
  mutation:
    transition:
      from: invoiced
      to: closed
  meaning: The balance reaches zero and the job closes.
  grain: one row per transaction on the job record
  fields:
    closed_date: closing date
  triggers: []
- type: fire_service_call_charge
  target: fire_charges
  meaning: The emergency service call fee for one dispatch.
  grain: one row per dispatch on the job
  distinguish_by:
  - service_date
  fields:
    charge_code: service_call
    service_date: dispatch date
    rate_window: rate window
    amount: fee
  account: balance_due
  direction: in
  triggers: []
- type: fire_board_up_charge
  target: fire_charges
  meaning: Emergency board-up, roof tarp or fencing installed to secure the structure.
  grain: one row per securing code per service date
  distinguish_by:
  - charge_code
  - service_date
  fields:
    charge_code: securing code
    service_date: date installed
    quantity: sheets, square feet or linear feet
    unit: unit
    unit_rate: rate
    amount: quantity times unit_rate
  account: balance_due
  direction: in
  triggers: []
- type: fire_equipment_day_charge
  target: fire_charges
  meaning: Air-cleaning or deodorization equipment for one calendar day.
  grain: one row per equipment type per calendar day
  distinguish_by:
  - charge_code
  - service_date
  fields:
    charge_code: equipment type
    service_date: day the equipment ran
    quantity: units running
    unit: unit_day
    unit_rate: daily rate
    amount: quantity times unit_rate
  account: balance_due
  direction: in
  triggers: []
- type: fire_cleaning_service_charge
  target: fire_charges
  meaning: One cleaning, demolition, deodorization or labor line.
  grain: one row per service code per service date per rate window
  distinguish_by:
  - charge_code
  - service_date
  - rate_window
  fields:
    charge_code: service code
    service_date: date performed
    quantity: quantity
    unit: unit
    unit_rate: rate
    rate_window: rate window
    amount: quantity times unit_rate
  account: balance_due
  direction: in
  triggers: []
- type: fire_late_fee
  target: fire_charges
  meaning: A late fee on a past-due invoiced balance for one monthly fee period.
  grain: one row per monthly fee period
  distinguish_by:
  - fee_period
  fields:
    charge_code: late_fee
    fee_period: fee period
    amount: late fee
  account: balance_due
  direction: in
  triggers: []
- type: fire_card_surcharge
  target: fire_charges
  meaning: The surcharge on one credit card payment.
  grain: one row per credit card payment
  distinguish_by:
  - source_payment_id
  fields:
    charge_code: card_surcharge
    source_payment_id: payment surcharged
    amount: surcharge
  account: balance_due
  direction: in
  triggers: []
- type: fire_customer_payment
  target: fire_payments
  meaning: A payment by the customer toward the job.
  grain: one row per tendered payment
  distinguish_by:
  - payment_reference
  fields:
    payment_method: tender
    payment_reference: check or confirmation number
    posted_date: date posted
    amount: amount paid
  account: balance_due
  direction: out
  triggers: []
- type: fire_insurance_payment
  target: fire_payments
  meaning: Posting of insurance proceeds from one carrier payment.
  grain: one row per carrier payment posted to the job
  distinguish_by:
  - claim_payment_id
  fields:
    claim_payment_id: carrier payment drawn from
    posted_date: date posted
    amount: amount posted
  account: balance_due
  direction: out
  triggers: []
- type: fire_adjustment_credit
  target: fire_payments
  meaning: A credit correcting or relieving one charge line.
  grain: one row per charge line per credit reason
  distinguish_by:
  - source_charge_id
  - adjustment_reason
  fields:
    source_charge_id: charge credited
    adjustment_reason: reason
    posted_date: date posted
    amount: credit
  account: balance_due
  direction: out
  triggers: []
- type: fire_refund
  target: fire_payments
  meaning: Refund of an overpayment to the original tender.
  grain: one row per refunded customer payment
  distinguish_by:
  - source_payment_id
  fields:
    source_payment_id: payment refunded from
    payment_method: tender refunded to
    posted_date: refund date
    amount: refund
  account: balance_due
  direction: in
  triggers: []
measures:
- id: fire_msr_billed_equipment_days
  window: the life of one fire job
  measure: count of distinct service_date values among fire_equipment_day_charge rows on the job
- id: fire_msr_goodwill_credited
  window: the life of one fire job
  measure: sum of amount over fire_adjustment_credit rows on the job with adjustment_reason goodwill
policies:
- id: fire_agg_multi_holding
  subject:
  - fire_job_dispatch
  rule: A customer may hold any number of fire and smoke jobs at once, one for each separate loss; each job has
    its own tier, authorization, ledger and invoice.
  eligibility: []
  params:
    max_per_customer: null
- id: fire_agg_same_loss_job
  subject:
  - fire_job_dispatch
  rule: 'No other fire job of the same customer for the same loss address and the same loss date may be open when
    a new dispatch is booked. A repeat call about a loss with an open job is handled on that job, a job being open
    in every status except closed and cancelled. Jobs are never combined for billing: each payment, posting, credit
    or refund names one job and moves only that job''s balance.'
  eligibility:
  - id: one_open_fire_job
    applies_to:
    - fire_job_dispatch
    kind: dedup
    condition: No other fire job of the same customer for the same loss address and the same loss date may be open
      when a new dispatch is booked.
    evidence_fields:
    - fire_jobs.customer_id
    - fire_jobs.loss_address
    - fire_jobs.loss_date
    - fire_jobs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fire_jobs.customer_id
        - fire_jobs.loss_address
        - fire_jobs.loss_date
      action_bindings:
        fire_jobs.customer_id: customer_id
        fire_jobs.loss_address: loss_address
        fire_jobs.loss_date: loss_date
    dedup_contract:
      table: fire_jobs
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        loss_address: loss_address
        loss_date: loss_date
      duplicate_filters:
        status:
        - dispatched
        - authorized
        - cleaning
        - cleaning_complete
        - invoiced
      distinct_fields: []
- id: fire_evt_emergency_services
  subject:
  - fire_service_call_charge
  - fire_board_up_charge
  rule: The job must be in dispatched, authorized or cleaning status when a service call or board-up line is charged.
    The tier is fixed at dispatch from the smoke severity, property type and affected area in each tier's entry
    gate. Every dispatch is charged the tier's service call fee, increased by the after-hours surcharge for an after_hours
    dispatch or by the holiday surcharge for a holiday dispatch, the holiday surcharge replacing the after-hours
    one; amounts are rounded to the cent, half up. The service call fee is not charged when the crew's recorded
    arrival time exceeds the arrival commitment of the job's tier. The fee is also not charged when, on the dispatch
    date, the customer holds a Commercial & Property Manager Service Agreement in active status whose tier carries
    the service call fee waiver entitlement of that charter. Emergency board-up, roof tarping and temporary fencing
    secure an open structure on tiers that include them and may be performed before the cleaning authorization is
    signed, billed at the tier's unit rates times the quantity installed.
  eligibility:
  - id: es_state
    applies_to:
    - fire_service_call_charge
    - fire_board_up_charge
    kind: state
    condition: The job must be in dispatched, authorized or cleaning status when a service call or board-up line
      is charged.
    evidence_fields:
    - fire_jobs.status
    - fire_jobs.fire_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fire_jobs.fire_job_id
      action_bindings:
        fire_jobs.fire_job_id: fire_job_id
    state_contract:
      field: fire_jobs.status
      allowed:
      - dispatched
      - authorized
      - cleaning
  - id: late_arrival
    applies_to:
    - fire_service_call_charge
    kind: caller_fact
    condition: The service call fee is not charged when the crew's recorded arrival time exceeds the arrival commitment
      of the job's tier.
    evidence_fields:
    - fire_jobs.onsite_arrival_minutes
    - fire_jobs.fire_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fire_jobs.fire_job_id
      action_bindings:
        fire_jobs.fire_job_id: fire_job_id
  params:
    per_tier:
      Smoke Odor Response:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
        board_up_allowed: =board_up_allowed
        late_arrival_waiver: =late_arrival_waiver
      Light Smoke and Soot Cleanup:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
        board_up_allowed: =board_up_allowed
        late_arrival_waiver: =late_arrival_waiver
      Moderate Fire and Smoke Cleanup:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
        board_up_allowed: =board_up_allowed
        late_arrival_waiver: =late_arrival_waiver
      Heavy Fire Cleanup:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
        board_up_allowed: =board_up_allowed
        late_arrival_waiver: =late_arrival_waiver
      Structural Fire Large Loss:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
        board_up_allowed: =board_up_allowed
        late_arrival_waiver: =late_arrival_waiver
      Commercial Fire Large Loss:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
        board_up_allowed: =board_up_allowed
        late_arrival_waiver: =late_arrival_waiver
    securing_unit_rates:
      board_up_plywood: =board_up_plywood_rate_per_sheet
      roof_tarp: =roof_tarp_rate_per_sqft
      temporary_fence: =temporary_fence_rate_per_lf
  formula:
    amount: round(emergency_service_call_fee * (1 + ((rate_window == 'after_hours') * after_hours_surcharge_pct
      + (rate_window == 'holiday') * holiday_surcharge_pct) / 100), 2)
- id: fire_evt_cleaning
  subject:
  - fire_equipment_day_charge
  - fire_cleaning_service_charge
  rule: The job must be in cleaning or cleaning_complete status when an equipment day or cleaning line is charged.
    Equipment is billed per unit per calendar day it runs, the set and removal days each counting, up to the tier's
    billable equipment day cap; days beyond the cap are not billed. Ozone may be billed only on a job whose occupants
    are not in the structure during the work. Cleaning, demolition, sealing and labor lines are billed at the tier's
    unit rate times the quantity, a code whose rate is 0.00 on the tier being unavailable, and after-hours labor
    at the hourly rate times the after-hours labor multiplier. An odor that returns within the tier's odor recheck
    window after cleaning complete is rechecked and re-treated once at no charge; further rechecks, or rechecks
    after the window, are billed at the odor recheck fee. Lead-safe setup is billable only for housing built before
    the RRP year-built cutoff where painted surfaces are disturbed, following the EPA Renovation, Repair and Painting
    Rule, and asbestos sampling only for buildings built before the asbestos sampling cutoff, before any demolition.
    Amounts are rounded to the cent, half up.
  eligibility:
  - id: cl_state
    applies_to:
    - fire_equipment_day_charge
    - fire_cleaning_service_charge
    kind: state
    condition: The job must be in cleaning or cleaning_complete status when an equipment day or cleaning line is
      charged.
    evidence_fields:
    - fire_jobs.status
    - fire_jobs.fire_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fire_jobs.fire_job_id
      action_bindings:
        fire_jobs.fire_job_id: fire_job_id
    state_contract:
      field: fire_jobs.status
      allowed:
      - cleaning
      - cleaning_complete
  - id: ozone_vacant
    applies_to:
    - fire_equipment_day_charge
    kind: caller_fact
    condition: Ozone may be billed only on a job whose occupants are not in the structure during the work.
    evidence_fields:
    - fire_jobs.occupied_during_work
    - fire_jobs.fire_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fire_jobs.fire_job_id
      action_bindings:
        fire_jobs.fire_job_id: fire_job_id
  params:
    per_tier:
      Smoke Odor Response:
        billable_equipment_day_cap: =billable_equipment_day_cap
        ozone_allowed_occupied: =ozone_allowed_occupied
        odor_recheck_included: =odor_recheck_included
        odor_recheck_window_days: =odor_recheck_window_days
        odor_recheck_fee: =odor_recheck_fee
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        after_hours_labor_multiplier: =after_hours_labor_multiplier
      Light Smoke and Soot Cleanup:
        billable_equipment_day_cap: =billable_equipment_day_cap
        ozone_allowed_occupied: =ozone_allowed_occupied
        odor_recheck_included: =odor_recheck_included
        odor_recheck_window_days: =odor_recheck_window_days
        odor_recheck_fee: =odor_recheck_fee
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        after_hours_labor_multiplier: =after_hours_labor_multiplier
      Moderate Fire and Smoke Cleanup:
        billable_equipment_day_cap: =billable_equipment_day_cap
        ozone_allowed_occupied: =ozone_allowed_occupied
        odor_recheck_included: =odor_recheck_included
        odor_recheck_window_days: =odor_recheck_window_days
        odor_recheck_fee: =odor_recheck_fee
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        after_hours_labor_multiplier: =after_hours_labor_multiplier
      Heavy Fire Cleanup:
        billable_equipment_day_cap: =billable_equipment_day_cap
        ozone_allowed_occupied: =ozone_allowed_occupied
        odor_recheck_included: =odor_recheck_included
        odor_recheck_window_days: =odor_recheck_window_days
        odor_recheck_fee: =odor_recheck_fee
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        after_hours_labor_multiplier: =after_hours_labor_multiplier
      Structural Fire Large Loss:
        billable_equipment_day_cap: =billable_equipment_day_cap
        ozone_allowed_occupied: =ozone_allowed_occupied
        odor_recheck_included: =odor_recheck_included
        odor_recheck_window_days: =odor_recheck_window_days
        odor_recheck_fee: =odor_recheck_fee
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        after_hours_labor_multiplier: =after_hours_labor_multiplier
      Commercial Fire Large Loss:
        billable_equipment_day_cap: =billable_equipment_day_cap
        ozone_allowed_occupied: =ozone_allowed_occupied
        odor_recheck_included: =odor_recheck_included
        odor_recheck_window_days: =odor_recheck_window_days
        odor_recheck_fee: =odor_recheck_fee
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        after_hours_labor_multiplier: =after_hours_labor_multiplier
    equipment_daily_rates:
      air_scrubber: =air_scrubber_daily_rate
      hydroxyl_generator: =hydroxyl_generator_daily_rate
      ozone_generator: =ozone_generator_daily_rate
    service_unit_rates:
      thermal_fogging: =thermal_fogging_fee
      dry_sponge: =dry_sponge_rate_per_sqft
      wet_clean: =wet_clean_rate_per_sqft
      ceiling_clean: =ceiling_clean_rate_per_sqft
      char_removal: =char_removal_rate_per_sqft
      selective_demo: =selective_demo_rate_per_sqft
      odor_sealer: =odor_sealer_rate_per_sqft
      duct_cleaning: =duct_cleaning_rate_per_vent
      contents_manipulation: =contents_manipulation_rate_per_room
      debris_haul: =debris_haul_fee_per_load
      dumpster: =dumpster_fee
      ppe: =ppe_rate_per_tech_day
      technician_labor: =technician_hourly_rate
      supervisor_labor: =supervisor_hourly_rate
      lead_safe_setup: =lead_safe_setup_fee
      asbestos_sampling: =asbestos_sampling_fee
      odor_recheck: =odor_recheck_fee
  formula:
    amount: round(quantity * unit_rate, 2)
  measures:
  - fire_msr_billed_equipment_days
- id: fire_authorization
  subject:
  - fire_work_authorization
  - fire_dispatch_cancel
  - fire_cleaning_start
  - fire_cleaning_complete
  rule: The job must be in dispatched status when the cleaning authorization is signed or the dispatch is cancelled.
    The cleaning authorization is signed by the owner or the owner's authorized agent. Cleaning may start on a self-pay
    job only after customer payments posted to the job total at least the tier's self-pay deposit. A customer may
    cancel the dispatch before signing; the service call stays billable, and board-up already installed stays billable
    on tiers where it does. Cleaning is complete when the supervisor's final walk finds no residual soot or odor
    and the equipment is removed.
  eligibility:
  - id: au_state
    applies_to:
    - fire_work_authorization
    - fire_dispatch_cancel
    kind: state
    condition: The job must be in dispatched status when the cleaning authorization is signed or the dispatch is
      cancelled.
    evidence_fields:
    - fire_jobs.status
    - fire_jobs.fire_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fire_jobs.fire_job_id
      action_bindings:
        fire_jobs.fire_job_id: fire_job_id
    state_contract:
      field: fire_jobs.status
      allowed:
      - dispatched
  - id: deposit
    applies_to:
    - fire_cleaning_start
    kind: caller_fact
    condition: Cleaning may start on a self-pay job only after customer payments posted to the job total at least
      the tier's self-pay deposit.
    evidence_fields:
    - fire_jobs.funding_source
    - fire_payments.amount
    - fire_jobs.fire_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fire_jobs.fire_job_id
      action_bindings:
        fire_jobs.fire_job_id: fire_job_id
  params:
    per_tier:
      Smoke Odor Response:
        self_pay_deposit_amount: =self_pay_deposit_amount
        cancellation_board_up_billable: =cancellation_board_up_billable
      Light Smoke and Soot Cleanup:
        self_pay_deposit_amount: =self_pay_deposit_amount
        cancellation_board_up_billable: =cancellation_board_up_billable
      Moderate Fire and Smoke Cleanup:
        self_pay_deposit_amount: =self_pay_deposit_amount
        cancellation_board_up_billable: =cancellation_board_up_billable
      Heavy Fire Cleanup:
        self_pay_deposit_amount: =self_pay_deposit_amount
        cancellation_board_up_billable: =cancellation_board_up_billable
      Structural Fire Large Loss:
        self_pay_deposit_amount: =self_pay_deposit_amount
        cancellation_board_up_billable: =cancellation_board_up_billable
      Commercial Fire Large Loss:
        self_pay_deposit_amount: =self_pay_deposit_amount
        cancellation_board_up_billable: =cancellation_board_up_billable
- id: fire_invoicing
  subject:
  - fire_invoice_issue
  - fire_job_close
  rule: The job must be in cleaning_complete status when the final invoice is issued. The final invoice amount is
    the total of every charge line, and the payment due date is the invoice date plus the self-pay or insurance
    payment terms by funding source, in calendar days. The job closes when its balance due is exactly zero after
    invoicing.
  eligibility:
  - id: in_state
    applies_to:
    - fire_invoice_issue
    kind: state
    condition: The job must be in cleaning_complete status when the final invoice is issued.
    evidence_fields:
    - fire_jobs.status
    - fire_jobs.fire_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fire_jobs.fire_job_id
      action_bindings:
        fire_jobs.fire_job_id: fire_job_id
    state_contract:
      field: fire_jobs.status
      allowed:
      - cleaning_complete
  params:
    per_tier:
      Smoke Odor Response:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Light Smoke and Soot Cleanup:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Moderate Fire and Smoke Cleanup:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Heavy Fire Cleanup:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Structural Fire Large Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Commercial Fire Large Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
- id: fire_evt_customer_payment
  subject:
  - fire_customer_payment
  - fire_card_surcharge
  - fire_refund
  rule: The job must not be closed when a customer payment is posted. Customer payments are accepted by credit card,
    debit card, ACH or check and posted in full to the one job they name; a credit card payment carries a surcharge
    of the credit card surcharge percentage of the payment amount, booked as its own line and rounded to the cent,
    half up. A refund is issued only while the balance due is negative, for the credit balance but never more than
    the customer payment it is returned from, to its original tender, within the refund processing business days;
    a credit balance created by insurance proceeds is handed to a human representative as not covered by policy.
  eligibility:
  - id: py_state
    applies_to:
    - fire_customer_payment
    - fire_card_surcharge
    - fire_refund
    kind: state
    condition: The job must not be closed when a customer payment is posted.
    evidence_fields:
    - fire_jobs.status
    - fire_jobs.fire_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fire_jobs.fire_job_id
      action_bindings:
        fire_jobs.fire_job_id: fire_job_id
    state_contract:
      field: fire_jobs.status
      allowed:
      - dispatched
      - authorized
      - cleaning
      - cleaning_complete
      - invoiced
      - cancelled
  params:
    per_tier:
      Smoke Odor Response:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Light Smoke and Soot Cleanup:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Moderate Fire and Smoke Cleanup:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Heavy Fire Cleanup:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Structural Fire Large Loss:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Commercial Fire Large Loss:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
  formula:
    when: payment_method == 'credit_card'
    amount: round(amount * credit_card_surcharge_pct / 100, 2)
- id: fire_evt_insurance_payment
  subject:
  - fire_insurance_payment
  rule: The job must be in authorized, cleaning, cleaning_complete or invoiced status when insurance proceeds are
    posted. The carrier payment must be recorded on the same claim file this job is linked to. Only dwelling-coverage
    payments that reached the company directly or by an endorsed two-party check are posted. A carrier payment is
    posted to the same fire job at most once. The amount posted is the lesser of the job's balance due and the carrier
    payment's unapplied remainder after every posting already made from it to any water, fire, mold or rebuild job,
    in the order of the claim payment allocation rule of the Insurance Claim Services charter.
  eligibility:
  - id: ip_state
    applies_to:
    - fire_insurance_payment
    kind: state
    condition: The job must be in authorized, cleaning, cleaning_complete or invoiced status when insurance proceeds
      are posted.
    evidence_fields:
    - fire_jobs.status
    - fire_jobs.fire_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fire_jobs.fire_job_id
      action_bindings:
        fire_jobs.fire_job_id: fire_job_id
    state_contract:
      field: fire_jobs.status
      allowed:
      - authorized
      - cleaning
      - cleaning_complete
      - invoiced
  - id: ip_same
    applies_to:
    - fire_insurance_payment
    kind: authorization
    condition: The carrier payment must be recorded on the same claim file this job is linked to.
    evidence_fields:
    - fire_jobs.claim_file_id
    - claims_payments.claim_file_id
    - claims_payments.claim_payment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_payments.claim_payment_id
      action_bindings:
        claims_payments.claim_payment_id: claim_payment_id
  - id: ip_once
    applies_to:
    - fire_insurance_payment
    kind: dedup
    condition: A carrier payment is posted to the same fire job at most once.
    evidence_fields:
    - fire_payments.fire_job_id
    - fire_payments.claim_payment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - fire_payments.fire_job_id
        - fire_payments.claim_payment_id
      action_bindings:
        fire_payments.fire_job_id: fire_job_id
        fire_payments.claim_payment_id: claim_payment_id
    dedup_contract:
      table: fire_payments
      mode: separate_record
      object_bindings:
        fire_job_id: fire_job_id
        claim_payment_id: claim_payment_id
      duplicate_filters:
        event_type:
        - fire_insurance_payment
      distinct_fields: []
- id: fire_evt_adjustment
  subject:
  - fire_adjustment_credit
  rule: The job must be in cleaning_complete or invoiced status when an adjustment credit is posted. A billing_error
    credit equals the amount charged less the amount the tier's rate and the recorded quantity produce; a duplicate_line
    credit equals the full amount of a repeated line. A billing_error or duplicate_line credit may be posted only
    when the customer raises the dispute no later than the dispute window after the final invoice was issued on
    this job. The dispute window is counted in calendar days starting the day after the job's invoiced_date, and
    a dispute raised on the last day of the window is in time; on a job not yet invoiced the window has not started
    and the dispute is always in time. Goodwill credits on one job may not exceed the tier's goodwill credit cap
    in total. A goodwill request above the remaining cap is handed to a human representative as not covered by policy.
    Each charge line takes at most one adjustment credit.
