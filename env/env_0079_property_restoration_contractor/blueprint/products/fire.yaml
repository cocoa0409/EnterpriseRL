category: fire
display_name: Fire & Smoke Mitigation
binding:
  holding_table: fire_jobs
  event_tables:
  - fire_charges
  - fire_payments
  status_field: status
  variant_field: variant_name
  quantity_fields:
    balance_due: balance_due
lifecycle:
  states:
  - dispatched
  - authorized
  - cleaning
  - cleaning_complete
  - invoiced
  - closed
  - cancelled
  transitions:
  - from: dispatched
    to: authorized
    by: user
    means: The owner or authorized agent signs the cleaning authorization.
  - from: dispatched
    to: cancelled
    by: agent
    means: The customer declines cleaning before signing.
  - from: authorized
    to: cleaning
    by: system
    means: Cleaning and deodorization begin.
  - from: cleaning
    to: cleaning_complete
    by: system
    means: The final walk finds no residual soot or odor and equipment is removed.
  - from: cleaning_complete
    to: invoiced
    by: agent
    means: The final invoice is issued.
  - from: invoiced
    to: closed
    by: system
    means: The balance reaches zero and the job closes.
accounts:
- key: balance_due
  unit: USD
  meaning: 'Amount the customer owes on one fire job: charges and refunds raise it, customer payments, insurance
    postings and credits lower it.'
parameter_schema:
  emergency_service_call_fee: Emergency service call (dispatch, safety walk and scoping) fee per dispatch, USD
  after_hours_surcharge_pct: Surcharge on the service call fee for an after_hours dispatch, percent
  holiday_surcharge_pct: Surcharge on the service call fee for a holiday dispatch (replaces the after-hours surcharge),
    percent
  response_commitment_minutes: On-site arrival commitment from the booked call, minutes
  late_arrival_waiver: Whether the service call fee is waived when the crew arrives later than the commitment, boolean
  board_up_plywood_rate_per_sheet: Emergency board-up per 4x8 plywood sheet installed, USD
  roof_tarp_rate_per_sqft: Emergency roof tarp installed per square foot, USD
  board_up_allowed: Whether emergency board-up and tarping are part of the tier, boolean
  temporary_fence_rate_per_lf: Temporary security fencing per linear foot per placement, USD
  air_scrubber_daily_rate: HEPA air scrubber per unit per billable day, USD
  hydroxyl_generator_daily_rate: Hydroxyl generator per unit per billable day, USD
  ozone_generator_daily_rate: Ozone generator per unit per billable day, USD
  ozone_allowed_occupied: Whether ozone may be used while the structure is occupied (it never may; ozone runs only
    in a vacated structure), boolean
  billable_equipment_day_cap: Deodorization and air-cleaning equipment days billable per job, count of calendar
    days
  thermal_fogging_fee: Thermal fogging deodorization per application, USD
  dry_sponge_rate_per_sqft: Dry chemical sponge soot removal per square foot, USD
  wet_clean_rate_per_sqft: Wet cleaning of walls and surfaces per square foot, USD
  ceiling_clean_rate_per_sqft: Ceiling soot cleaning per square foot, USD
  char_removal_rate_per_sqft: Wire brush or blast removal of charred framing per square foot, USD
  selective_demo_rate_per_sqft: Selective demolition of fire-damaged finishes per square foot, USD
  odor_sealer_rate_per_sqft: Odor-sealing primer on cleaned framing or surfaces per square foot, USD
  duct_cleaning_rate_per_vent: HVAC duct soot cleaning per vent, USD
  contents_manipulation_rate_per_room: Moving and blocking contents within the room per room, USD
  debris_haul_fee_per_load: Debris haul-off per pickup-truck load, USD
  dumpster_fee: Roll-off dumpster (30 cubic yard) per placement, USD
  ppe_rate_per_tech_day: PPE per technician per day, USD
  technician_hourly_rate: Fire and smoke technician labor per hour, business-hours rate, USD
  supervisor_hourly_rate: Supervisor labor per hour, business-hours rate, USD
  after_hours_labor_multiplier: Multiplier on hourly labor rates for labor performed in the after_hours or holiday
    window, decimal
  odor_recheck_included: Whether one odor recheck visit after cleaning complete is included without charge, boolean
  odor_recheck_window_days: Calendar days after cleaning complete within which a returning odor is rechecked and
    re-treated at no charge, count
  odor_recheck_fee: Odor recheck and re-treatment visit beyond the included recheck or after the recheck window,
    per visit, USD
  lead_safe_setup_fee: Lead-safe work practice setup per job, USD
  rrp_year_built_cutoff: Housing built before this year triggers lead-safe practices when painted surfaces are disturbed
    (EPA RRP pre-1978 housing), year
  asbestos_sampling_fee: Pre-demolition asbestos sampling per job, USD
  asbestos_sampling_year_cutoff: Buildings built before this year are sampled for asbestos before demolition (company
    policy), year
  self_pay_deposit_amount: Deposit a self-pay customer pays before cleaning starts, USD
  payment_terms_days_self_pay: Days after the final invoice date by which a self-pay balance is due, calendar days
  payment_terms_days_insurance: Days after the final invoice date by which an insurance-funded balance is due, calendar
    days
  late_fee_pct_monthly: Late fee on the past-due balance per monthly fee period, percent
  late_fee_minimum: Minimum late fee per monthly fee period, USD
  late_fee_grace_days: Grace days after the due date before the first late fee may post, calendar days
  claim_pending_late_fee_suspension_days: Days after the final invoice date during which late fees are suspended
    on an insurance-funded job whose claim file is still awaiting carrier payment, calendar days
  credit_card_surcharge_pct: Surcharge on payments made by credit card (never debit card, ACH or check), percent
  adjustment_dispute_window_days: Days after the final invoice date within which a billing-error or duplicate-line
    dispute may be credited, calendar days
  goodwill_credit_cap: Maximum total goodwill credit the desk may post on one job, USD
  refund_processing_business_days: Business days (Monday-Friday excluding company holidays) to issue an overpayment
    refund after it is approved, count
  cancellation_board_up_billable: Whether board-up already installed stays billable when the job is cancelled before
    authorization of cleaning, boolean
