  measures:
  - mold_msr_clearance_attempts
- id: mold_cancellation
  subject:
  - mold_cancel
  - mold_late_cancellation_fee
  rule: The job must be in scheduled status when it is cancelled. A customer may cancel a scheduled job before signing
    the remediation agreement. The late cancellation fee applies only when the cancellation comes later than the
    notice deadline before the scheduled start date. The notice deadline is the scheduled start date minus the tier's
    cancellation notice days, counted in calendar days; a cancellation on the deadline date itself is in time and
    carries no fee. Warranty jobs never carry a cancellation fee.
  eligibility:
  - id: ca_state
    applies_to:
    - mold_cancel
    kind: state
    condition: The job must be in scheduled status when it is cancelled.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - scheduled
  - id: lc_deadline
    applies_to:
    - mold_late_cancellation_fee
    kind: caller_fact
    condition: The late cancellation fee applies only when the cancellation comes later than the notice deadline
      before the scheduled start date.
    evidence_fields:
    - mold_jobs.scheduled_start_date
    - mold_jobs.cancelled_date
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
  params:
    per_tier:
      Spot Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
      Limited Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
      Standard Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
      Extensive Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
      Attic and Crawlspace Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
      HVAC System Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
  formula:
    amount: late_cancellation_fee
- id: mold_invoicing
  subject:
  - mold_invoice_issue
  - mold_job_close
  rule: The job must be in cleared status when the final invoice is issued. The final invoice amount is the total
    of every charge line on the job at invoicing, including any minimum_charge line, and the payment due date is
    the invoice date plus the self-pay or insurance payment terms by funding source, counted in calendar days. The
    job closes when its balance due is exactly zero after invoicing; a company_warranty job is invoiced at 0.00
    and closes on its invoice date.
  eligibility:
  - id: in_state
    applies_to:
    - mold_invoice_issue
    kind: state
    condition: The job must be in cleared status when the final invoice is issued.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - cleared
  params:
    per_tier:
      Spot Mold Remediation:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Limited Mold Remediation:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Standard Mold Remediation:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Extensive Mold Remediation:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Attic and Crawlspace Mold Remediation:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      HVAC System Mold Remediation:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
- id: mold_evt_customer_payment
  subject:
  - mold_customer_payment
  - mold_card_surcharge
  - mold_refund
  rule: The job must not be closed when a customer payment is posted. Customer payments are accepted by credit card,
    debit card, ACH or check and are posted in full to the one job they name; a credit card payment carries a surcharge
    of the credit card surcharge percentage of the payment amount, booked as its own line and rounded to the cent,
    half up, and no other tender is surcharged. A refund is issued only while the job's balance due is negative,
    for the credit balance but never more than the customer payment it is returned from, to that payment's original
    tender, within the refund processing business days; a credit balance created by insurance proceeds is handed
    to a human representative as not covered by policy.
  eligibility:
  - id: py_state
    applies_to:
    - mold_customer_payment
    - mold_card_surcharge
    - mold_refund
    kind: state
    condition: The job must not be closed when a customer payment is posted.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - scheduled
      - authorized
      - remediating
      - awaiting_clearance
      - cleared
      - invoiced
      - cancelled
  params:
    per_tier:
      Spot Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Limited Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Standard Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Extensive Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Attic and Crawlspace Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      HVAC System Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
  formula:
    when: payment_method == 'credit_card'
    amount: round(amount * credit_card_surcharge_pct / 100, 2)
- id: mold_evt_insurance_payment
  subject:
  - mold_insurance_payment
  rule: The job must be in remediating, awaiting_clearance, cleared or invoiced status when insurance proceeds are
    posted. The carrier payment must be recorded on the same claim file this job is linked to. Only dwelling-coverage
    carrier payments the company has received directly, or by a two-party check the insured has endorsed, are posted
    to a mold job. A carrier payment is posted to the same mold job at most once. The amount posted is the least
    of the job's balance due, the carrier payment's unapplied remainder after every posting already made from it
    to any water, fire, mold or rebuild job, and the claim file's mold sublimit less the insurance proceeds already
    posted to mold jobs of that claim file; jobs sharing one carrier payment are paid in the order of the claim
    payment allocation rule of the Insurance Claim Services charter.
  eligibility:
  - id: ip_state
    applies_to:
    - mold_insurance_payment
    kind: state
    condition: The job must be in remediating, awaiting_clearance, cleared or invoiced status when insurance proceeds
      are posted.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - remediating
      - awaiting_clearance
      - cleared
      - invoiced
  - id: ip_same_claim
    applies_to:
    - mold_insurance_payment
    kind: authorization
    condition: The carrier payment must be recorded on the same claim file this job is linked to.
    evidence_fields:
    - mold_jobs.claim_file_id
    - claims_payments.claim_file_id
    - claims_payments.claim_payment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_payments.claim_payment_id
      action_bindings:
        claims_payments.claim_payment_id: claim_payment_id
  - id: ip_once
    applies_to:
    - mold_insurance_payment
    kind: dedup
    condition: A carrier payment is posted to the same mold job at most once.
    evidence_fields:
    - mold_payments.mold_job_id
    - mold_payments.claim_payment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_payments.mold_job_id
        - mold_payments.claim_payment_id
      action_bindings:
        mold_payments.mold_job_id: mold_job_id
        mold_payments.claim_payment_id: claim_payment_id
    dedup_contract:
      table: mold_payments
      mode: separate_record
      object_bindings:
        mold_job_id: mold_job_id
        claim_payment_id: claim_payment_id
      duplicate_filters:
        event_type:
        - mold_insurance_payment
      distinct_fields: []
- id: mold_evt_adjustment
  subject:
  - mold_adjustment_credit
  rule: The job must be in cleared or invoiced status when an adjustment credit is posted. A billing_error credit
    equals the amount charged on the line less the amount the tier's rate and the recorded quantity produce; a duplicate_line
    credit equals the full amount of a line repeating another of the same code, date and quantity. A re-cleaning
    line billed after a failed clearance is credited in full as billing_error. A billing_error or duplicate_line
    credit may be posted only when the customer raises the dispute no later than the dispute window after the final
    invoice was issued on this job. The dispute window is counted in calendar days starting the day after the job's
    invoiced_date, and a dispute raised on the last day of the window is in time; on a job not yet invoiced the
    window has not started and the dispute is always in time. Goodwill credits on one job may not exceed the tier's
    goodwill credit cap in total. A goodwill request above the remaining cap is handed to a human representative
    as not covered by policy. Each charge line takes at most one adjustment credit.
  eligibility:
  - id: ad_state
    applies_to:
    - mold_adjustment_credit
    kind: state
    condition: The job must be in cleared or invoiced status when an adjustment credit is posted.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - cleared
      - invoiced
  - id: ad_window
    applies_to:
    - mold_adjustment_credit
    kind: time
    condition: A billing_error or duplicate_line credit may be posted only when the customer raises the dispute
      no later than the dispute window after the final invoice was issued on this job.
    evidence_fields:
    - mold_jobs.invoiced_date
    - mold_charges.mold_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_charges.mold_charge_id
      action_bindings:
        mold_charges.mold_charge_id: source_charge_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the final invoice was issued on this job
      anchor_source: mold_jobs.invoiced_date
      relation: not_after
      duration_source: variants.adjustment_dispute_window_days
      unit: calendar_days
      counting_rule: The dispute window is counted in calendar days starting the day after the job's invoiced_date,
        and a dispute raised on the last day of the window is in time; on a job not yet invoiced the window has
        not started and the dispute is always in time.
      boundary: inclusive
  - id: ad_goodwill
    applies_to:
    - mold_adjustment_credit
    kind: caller_fact
    condition: Goodwill credits on one job may not exceed the tier's goodwill credit cap in total.
    evidence_fields:
    - mold_payments.adjustment_reason
    - mold_payments.amount
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
  params:
    per_tier:
      Spot Mold Remediation:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Limited Mold Remediation:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Standard Mold Remediation:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Extensive Mold Remediation:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Attic and Crawlspace Mold Remediation:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      HVAC System Mold Remediation:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
  measures:
  - mold_msr_goodwill_credited
- id: mold_evt_late_fee
  subject:
  - mold_late_fee
  rule: The job must be in invoiced status when a late fee is charged. A late fee may post only after the grace
    period following the payment due date recorded at invoicing has fully passed. The grace period is counted in
    calendar days starting the day after the payment_due_date, and the first late fee may post on the day after
    the grace period's last day. A late fee is assessed at most once per calendar month fee period at the late fee
    percentage of the balance due, with the late fee minimum as a floor, rounded to the cent, half up. No late fee
    posts on an insurance_claim job while its linked claim file is in opened, estimate_submitted or approved status
    and the suspension period counted from the invoice date has not ended. Late fees are never back-dated to a suspended
    period, and a job with a zero or negative balance is never charged a late fee.
  eligibility:
  - id: lf_state
    applies_to:
    - mold_late_fee
    kind: state
    condition: The job must be in invoiced status when a late fee is charged.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - invoiced
  - id: lf_grace
    applies_to:
    - mold_late_fee
    kind: time
    condition: A late fee may post only after the grace period following the payment due date recorded at invoicing
      has fully passed.
    evidence_fields:
    - mold_jobs.payment_due_date
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the payment due date recorded at invoicing
      anchor_source: mold_jobs.payment_due_date
      relation: not_before
      duration_source: variants.late_fee_grace_days
      unit: calendar_days
      counting_rule: The grace period is counted in calendar days starting the day after the payment_due_date, and
        the first late fee may post on the day after the grace period's last day.
      boundary: exclusive
  - id: lf_susp
    applies_to:
    - mold_late_fee
    kind: caller_fact
    condition: No late fee posts on an insurance_claim job while its linked claim file is in opened, estimate_submitted
      or approved status and the suspension period counted from the invoice date has not ended.
    evidence_fields:
    - mold_jobs.claim_file_id
    - claims_files.status
    - mold_jobs.invoiced_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.claim_file_id
      action_bindings:
        mold_jobs.claim_file_id: claim_file_id
  params:
    per_tier:
      Spot Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Limited Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Standard Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Extensive Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Attic and Crawlspace Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      HVAC System Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
  formula:
    amount: max(late_fee_minimum, round(balance_due * late_fee_pct_monthly / 100, 2))
