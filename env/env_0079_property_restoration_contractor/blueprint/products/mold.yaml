        blasting_allowed: =blasting_allowed
        hvac_work_allowed: =hvac_work_allowed
        billable_equipment_day_cap: =billable_equipment_day_cap
        minimum_job_charge: =minimum_job_charge
        reclean_billable: =reclean_billable
        negative_air_required: =negative_air_required
