category: mold
display_name: Mold Remediation
binding:
  holding_table: mold_jobs
  event_tables:
  - mold_charges
  - mold_payments
  - mold_clearance_tests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    balance_due: balance_due
lifecycle:
  states:
  - scheduled
  - authorized
  - remediating
  - awaiting_clearance
  - cleared
  - invoiced
  - closed
  - cancelled
  transitions:
  - from: scheduled
    to: authorized
    by: user
    means: The owner or the owner's authorized agent signs the remediation agreement.
  - from: scheduled
    to: cancelled
    by: agent
    means: The customer cancels the scheduled job before signing.
  - from: authorized
    to: remediating
    by: system
    means: Containment is set and remediation begins.
  - from: remediating
    to: awaiting_clearance
    by: agent
    means: Remediation is reported complete and clearance is requested.
  - from: awaiting_clearance
    to: cleared
    by: system
    means: The clearance report passes.
  - from: awaiting_clearance
    to: remediating
    by: system
    means: The clearance report fails and re-cleaning begins.
  - from: cleared
    to: invoiced
    by: agent
    means: The final invoice is issued.
  - from: invoiced
    to: closed
    by: system
    means: The balance reaches zero and the job closes.
accounts:
- key: balance_due
  unit: USD
  meaning: 'Amount the customer owes on one mold job: charges and refunds raise it, customer payments, insurance
    postings and credits lower it.'
parameter_schema:
  protocol_required: Whether a written remediation protocol from an independent mold assessor must be on file before
    the remediation agreement is signed, boolean
  clearance_method: 'How clearance is established: supervisor_visual (post-remediation visual inspection by the
    company supervisor) or independent_assessor (post-remediation verification by the independent assessor)'
  containment_required: Whether poly containment under negative pressure is required, boolean
  containment_setup_fee: Poly containment with airlock and zipper door, per containment, USD
  negative_air_required: Whether a HEPA air scrubber must run under negative pressure for every remediation day,
    boolean
  air_scrubber_daily_rate: HEPA air scrubber / negative air machine per unit per billable day, USD
  dehumidifier_daily_rate: LGR dehumidifier per unit per billable day while the containment is held, USD
  billable_equipment_day_cap: Equipment days billable per job before re-cleaning, count of calendar days
  hepa_vacuum_rate_per_sqft: HEPA vacuuming of surfaces within the work area per square foot, USD
  drywall_removal_rate_per_sqft: Removal and bagging of mold-affected drywall per square foot, USD
  insulation_removal_rate_per_sqft: Removal and bagging of mold-affected insulation per square foot, USD
  antimicrobial_rate_per_sqft: Antimicrobial application to cleaned framing and sheathing per square foot, USD
  encapsulation_rate_per_sqft: Mold-resistant encapsulant coating per square foot, USD
  wire_brush_sanding_rate_per_sqft: Wire brushing and HEPA sanding of framing per square foot, USD
  soda_blasting_rate_per_sqft: Soda blasting of sheathing and framing per square foot, USD
  dry_ice_blasting_rate_per_sqft: Dry ice blasting of sheathing and framing per square foot, USD
  blasting_allowed: Whether media blasting (soda or dry ice) is an available method, boolean
  duct_cleaning_rate_per_vent: HVAC duct cleaning and sanitizing per supply or return vent, USD
  air_handler_cleaning_fee: Air handler cabinet and blower cleaning per unit, USD
  coil_cleaning_fee: Evaporator coil cleaning per coil, USD
  hvac_work_allowed: Whether HVAC duct, air handler and coil lines may be billed, boolean
  ppe_rate_per_tech_day: Respirator, suit and glove PPE per technician per day, USD
  respirator_level: 'Minimum respiratory protection for technicians: n95, half_face_p100 or full_face_p100'
  debris_disposal_fee_per_load: Bagged debris haul-off per pickup-truck load, USD
  technician_hourly_rate: Remediation technician labor per hour, business-hours rate, USD
  supervisor_hourly_rate: Remediation supervisor labor per hour, business-hours rate, USD
  after_hours_labor_multiplier: Multiplier on hourly labor rates for labor the customer asks to have performed in
    the after_hours window, decimal
  minimum_job_charge: Smallest total of remediation scope, equipment and clearance charges billed on a job; a shortfall
    is billed as a minimum charge line, USD
  clearance_test_fee: Independent post-remediation verification fee passed through for the first clearance attempt,
    USD
  retest_billable: Whether a clearance retest after a failed clearance is billable, boolean
  reclean_billable: Whether re-cleaning labor, materials and equipment after a failed clearance are billable, boolean
  max_clearance_attempts: Clearance attempts after which a job that still fails is escalated to a human project
    manager, count
  lead_safe_setup_fee: Lead-safe work practice setup per job, USD
  rrp_year_built_cutoff: Housing built before this year triggers lead-safe practices when painted surfaces are disturbed
    (EPA RRP pre-1978 housing), year
  asbestos_sampling_fee: Pre-removal asbestos sampling (collection plus lab) per job, USD
  asbestos_sampling_year_cutoff: Buildings built before this year are sampled for asbestos before drywall, texture
    or insulation removal (company policy), year
  self_pay_deposit_amount: Deposit a self-pay customer pays before containment is set, USD
  payment_terms_days_self_pay: Days after the final invoice date by which a self-pay balance is due, calendar days
  payment_terms_days_insurance: Days after the final invoice date by which an insurance-funded balance is due, calendar
    days
  late_fee_pct_monthly: Late fee on the past-due balance per monthly fee period, percent
  late_fee_minimum: Minimum late fee per monthly fee period, USD
  late_fee_grace_days: Grace days after the due date before the first late fee may post, calendar days
  claim_pending_late_fee_suspension_days: Days after the final invoice date during which late fees are suspended
    on an insurance-funded job whose claim file is still awaiting carrier payment, calendar days
  credit_card_surcharge_pct: Surcharge on payments made by credit card (never debit card, ACH or check), percent
  adjustment_dispute_window_days: Days after the final invoice date within which a billing-error or duplicate-line
    dispute may be credited, calendar days
  goodwill_credit_cap: Maximum total goodwill credit the desk may post on one job, USD
  cancellation_notice_days: Calendar days before the scheduled start date by which a cancellation avoids the late
    cancellation fee, count
  late_cancellation_fee: Fee for cancelling a scheduled job after the notice deadline, USD
  remediation_warranty_days: Days after the cleared date during which visible regrowth in the remediated area is
    re-remediated at no charge, calendar days
  secondary_damage_warranty_days: Days after a company water job reached the dry standard during which mold growth
    in the dried area is remediated at no charge, calendar days
  refund_processing_business_days: Business days (Monday-Friday excluding company holidays) to issue an overpayment
    refund after it is approved, count
