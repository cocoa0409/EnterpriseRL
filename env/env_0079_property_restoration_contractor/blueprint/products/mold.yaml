events:
- type: mold_job_open
  target: mold_jobs
  mutation: create
  meaning: A mold remediation job is booked for one growth location at one property.
  grain: one row per transaction on the job record
  fields:
    customer_id: customer id
    variant_name: variant name
    claim_file_id: claim file id
    water_job_id: water job id
    prior_mold_job_id: prior mold job id
    loss_address: loss address
    property_type: property type
    year_built: year built
    growth_location: growth location
    growth_area_sqft: growth area sqft
    assessor_name: assessor name
    protocol_date: protocol date
    funding_source: funding source
    opened_date: opened date
    scheduled_start_date: scheduled start date
    balance_due: balance due
  triggers: []
- type: mold_authorization
  target: mold_jobs
  mutation:
    transition:
      from: scheduled
      to: authorized
  meaning: The property owner or the owner's authorized agent signs the remediation agreement.
  grain: one row per transaction on the job record
  fields:
    authorized_date: date signed
  triggers: []
- type: mold_cancel
  target: mold_jobs
  mutation:
    transition:
      from: scheduled
      to: cancelled
  meaning: The customer cancels the scheduled job before signing the agreement.
  grain: one row per transaction on the job record
  fields:
    cancelled_date: date cancelled
  triggers: []
- type: mold_containment_start
  target: mold_jobs
  mutation:
    transition:
      from: authorized
      to: remediating
  meaning: Containment is set and remediation begins.
  grain: one row per transaction on the job record
  fields:
    containment_date: date containment was set
  triggers: []
- type: mold_clearance_request
  target: mold_jobs
  mutation:
    transition:
      from: remediating
      to: awaiting_clearance
  meaning: Remediation is reported complete and clearance is requested.
  grain: one row per transaction on the job record
  fields:
    clearance_requested_date: date requested
  triggers: []
- type: mold_clearance_pass
  target: mold_jobs
  mutation:
    transition:
      from: awaiting_clearance
      to: cleared
  meaning: The clearance passes.
  grain: one row per transaction on the job record
  fields:
    cleared_date: date clearance passed
  triggers: []
- type: mold_clearance_fail
  target: mold_jobs
  mutation:
    transition:
      from: awaiting_clearance
      to: remediating
  meaning: The clearance fails and the work area returns to remediation for re-cleaning.
  grain: one row per transaction on the job record
  fields:
    last_failed_clearance_date: date clearance failed
  triggers: []
- type: mold_invoice_issue
  target: mold_jobs
  mutation:
    transition:
      from: cleared
      to: invoiced
  meaning: The final invoice for the job is issued.
  grain: one row per transaction on the job record
  fields:
    invoiced_date: invoice date
    final_invoice_amount: total charges
    payment_due_date: due date
  triggers: []
- type: mold_job_close
  target: mold_jobs
  mutation:
    transition:
      from: invoiced
      to: closed
  meaning: The job's balance reaches zero and the job closes.
  grain: one row per transaction on the job record
  fields:
    closed_date: closing date
  triggers: []
- type: mold_clearance_result
  target: mold_clearance_tests
  meaning: The clearance report for one clearance attempt is received.
  grain: one row per clearance attempt on the job
  distinguish_by:
  - attempt_number
  fields:
    attempt_number: attempt sequence
    test_date: inspection date
    clearance_method: who established clearance
    result: pass or fail
  triggers:
  - event: mold:mold_clearance_pass
    when:
      result: pass
    map:
      cleared_date: test_date
  - event: mold:mold_clearance_fail
    when:
      result: fail
    map:
      last_failed_clearance_date: test_date
- type: mold_remediation_charge
  target: mold_charges
  meaning: One remediation scope or labor line performed on the job.
  grain: one row per scope code per service date per rate window on the job
  distinguish_by:
  - charge_code
  - service_date
  - rate_window
  fields:
    charge_code: scope code
    service_date: date performed
    quantity: quantity
    unit: unit
    unit_rate: rate per unit
    rate_window: rate window
    amount: quantity times unit_rate
  account: balance_due
  direction: in
  triggers: []
- type: mold_equipment_day_charge
  target: mold_charges
  meaning: Rental of one type of remediation equipment for one calendar day.
  grain: one row per equipment type per calendar day on the job
  distinguish_by:
  - charge_code
  - service_date
  fields:
    charge_code: equipment type
    service_date: day the equipment ran
    quantity: units running
    unit: unit_day
    unit_rate: daily rate
    amount: quantity times unit_rate
  account: balance_due
  direction: in
  triggers: []
- type: mold_clearance_fee
  target: mold_charges
  meaning: Pass-through of the clearance verification fee for one clearance attempt.
  grain: one row per billed clearance attempt
  distinguish_by:
  - mold_test_id
  fields:
    charge_code: clearance_test
    mold_test_id: clearance attempt billed
    service_date: test date
    amount: fee
  account: balance_due
  direction: in
  triggers: []
- type: mold_late_cancellation_fee
  target: mold_charges
  meaning: The fee for cancelling a scheduled job after the notice deadline.
  grain: one row per cancelled job
  distinguish_by:
  - charge_code
  fields:
    charge_code: late_cancellation_fee
    service_date: cancellation date
    amount: fee
  account: balance_due
  direction: in
  triggers: []
- type: mold_late_fee
  target: mold_charges
  meaning: A late fee on a past-due invoiced balance for one monthly fee period.
  grain: one row per monthly fee period on the job
  distinguish_by:
  - fee_period
  fields:
    charge_code: late_fee
    fee_period: fee period
    amount: late fee
  account: balance_due
  direction: in
  triggers: []
- type: mold_card_surcharge
  target: mold_charges
  meaning: The surcharge on one customer payment made by credit card.
  grain: one row per credit card payment
  distinguish_by:
  - source_payment_id
  fields:
    charge_code: card_surcharge
    source_payment_id: payment surcharged
    amount: surcharge
  account: balance_due
  direction: in
  triggers: []
- type: mold_customer_payment
  target: mold_payments
  meaning: A payment by the customer toward the job.
  grain: one row per tendered payment
  distinguish_by:
  - payment_reference
  fields:
    payment_method: tender
    payment_reference: check or confirmation number
    posted_date: date posted
    amount: amount paid
  account: balance_due
  direction: out
  triggers: []
- type: mold_insurance_payment
  target: mold_payments
  meaning: Posting of insurance proceeds from one carrier payment to the job.
  grain: one row per carrier payment posted to the job
  distinguish_by:
  - claim_payment_id
  fields:
    claim_payment_id: carrier payment drawn from
    posted_date: date posted
    amount: amount posted
  account: balance_due
  direction: out
  triggers: []
- type: mold_adjustment_credit
  target: mold_payments
  meaning: A credit correcting or relieving one charge line on the job.
  grain: one row per charge line per credit reason
  distinguish_by:
  - source_charge_id
  - adjustment_reason
  fields:
    source_charge_id: charge credited
    adjustment_reason: reason
    posted_date: date posted
    amount: credit
  account: balance_due
  direction: out
  triggers: []
- type: mold_refund
  target: mold_payments
  meaning: Refund of an overpayment to the customer's original tender.
  grain: one row per refunded customer payment
  distinguish_by:
  - source_payment_id
  fields:
    source_payment_id: payment refunded from
    payment_method: tender refunded to
    posted_date: refund date
    amount: refund
  account: balance_due
  direction: in
  triggers: []
measures:
- id: mold_msr_billed_equipment_days
  window: the life of one mold job
  measure: count of distinct service_date values among mold_equipment_day_charge rows on the job
- id: mold_msr_clearance_attempts
  window: the life of one mold job
  measure: count of mold_clearance_result rows on the job
- id: mold_msr_goodwill_credited
  window: the life of one mold job
  measure: sum of amount over mold_adjustment_credit rows on the job with adjustment_reason goodwill
- id: mold_msr_claim_mold_postings
  window: the life of one claim file
  measure: sum of amount over mold_insurance_payment rows of every mold job linked to the same claim file
policies:
- id: mold_agg_multi_holding
  subject:
  - mold_job_open
  rule: A customer may hold any number of mold remediation jobs at once, one for each growth location at each property.
    Each job has its own tier, protocol, agreement, clearance and invoice.
  eligibility: []
  params:
    max_per_customer: null
- id: mold_agg_shared_sublimit
  subject:
  - mold_job_open
  - mold_insurance_payment
  rule: 'No other mold job of the same customer for the same address and growth location may be open when a new
    job is booked. A job is open in every status except closed and cancelled. The policy''s mold sublimit on a claim
    file is one limit for the whole loss: insurance proceeds posted to all mold jobs linked to the same claim file
    together may never exceed the claim file''s mold sublimit, and when the claim file''s mold sublimit is 0.00
    no insurance proceeds are posted to a mold job at all. Charges above what the sublimit covers stay owed by the
    customer on the job.'
  eligibility:
  - id: one_open_mold_job
    applies_to:
    - mold_job_open
    kind: dedup
    condition: No other mold job of the same customer for the same address and growth location may be open when
      a new job is booked.
    evidence_fields:
    - mold_jobs.customer_id
    - mold_jobs.loss_address
    - mold_jobs.growth_location
    - mold_jobs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.customer_id
        - mold_jobs.loss_address
        - mold_jobs.growth_location
      action_bindings:
        mold_jobs.customer_id: customer_id
        mold_jobs.loss_address: loss_address
        mold_jobs.growth_location: growth_location
    dedup_contract:
      table: mold_jobs
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        loss_address: loss_address
        growth_location: growth_location
      duplicate_filters:
        status:
        - scheduled
        - authorized
        - remediating
        - awaiting_clearance
        - cleared
        - invoiced
      distinct_fields: []
  measures:
  - mold_msr_claim_mold_postings
- id: mold_tier_and_funding
  subject:
  - mold_job_open
  rule: 'The tier is fixed at booking from the growth location and the visible growth area in each tier''s entry
    gate: HVAC growth selects HVAC System Mold Remediation, attic or crawlspace growth selects Attic and Crawlspace
    Mold Remediation, and growth in a living area or basement selects Spot, Limited, Standard or Extensive Mold
    Remediation by area. A job whose linked water job ended with drying_outcome dry_standard_met, and whose opened
    date is no later than the secondary damage warranty days after that water job''s drying complete date, is funded
    as company_warranty. A job that re-remediates regrowth in the area of an earlier mold job of the company, opened
    no later than that earlier job''s remediation warranty days after its cleared date, is funded as company_warranty.
    The warranty tier and day count are the earlier job''s own. A water job that ended with drying_outcome customer_release
    carries no secondary damage warranty. A company_warranty job is performed at no charge: no charge line of any
    kind is booked on it, and it is never billed to a claim file. Otherwise the job is insurance_claim when it is
    linked to a claim file of the same customer that is not denied or withdrawn and self_pay when it is not.'
  eligibility:
  - id: secondary_warranty
    applies_to:
    - mold_job_open
    kind: caller_fact
    condition: A job whose linked water job ended with drying_outcome dry_standard_met, and whose opened date is
      no later than the secondary damage warranty days after that water job's drying complete date, is funded as
      company_warranty.
    evidence_fields:
    - water_jobs.drying_outcome
    - water_jobs.drying_complete_date
    - mold_jobs.water_job_id
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
  - id: remediation_warranty
    applies_to:
    - mold_job_open
    kind: caller_fact
    condition: A job that re-remediates regrowth in the area of an earlier mold job of the company, opened no later
      than that earlier job's remediation warranty days after its cleared date, is funded as company_warranty.
    evidence_fields:
    - mold_jobs.cleared_date
    - mold_jobs.variant_name
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: prior_mold_job_id
  params:
    per_tier:
      Spot Mold Remediation:
        remediation_warranty_days: =remediation_warranty_days
        secondary_damage_warranty_days: =secondary_damage_warranty_days
      Limited Mold Remediation:
        remediation_warranty_days: =remediation_warranty_days
        secondary_damage_warranty_days: =secondary_damage_warranty_days
      Standard Mold Remediation:
        remediation_warranty_days: =remediation_warranty_days
        secondary_damage_warranty_days: =secondary_damage_warranty_days
      Extensive Mold Remediation:
        remediation_warranty_days: =remediation_warranty_days
        secondary_damage_warranty_days: =secondary_damage_warranty_days
      Attic and Crawlspace Mold Remediation:
        remediation_warranty_days: =remediation_warranty_days
        secondary_damage_warranty_days: =secondary_damage_warranty_days
      HVAC System Mold Remediation:
        remediation_warranty_days: =remediation_warranty_days
        secondary_damage_warranty_days: =secondary_damage_warranty_days
- id: mold_independent_assessment
  subject:
  - mold_authorization
  - mold_containment_start
  rule: 'The job must be in scheduled status when the remediation agreement is signed. On tiers that require a protocol,
    an independent assessor''s written protocol dated on or before the signing date must be on file. The company
    never assesses or clears its own remediation work: the protocol and the post-remediation verification come from
    an independent assessor the customer engages, consistent with the states that license mold work, among them
    Texas and New York, which bar the same company from both assessing and remediating one project. The remediation
    agreement is signed by the property owner or the owner''s authorized agent. Containment may be set on a self-pay
    job only after customer payments posted to the job total at least the tier''s self-pay deposit. Insurance-funded
    and warranty jobs require no deposit. Before remediation starts, the moisture source must have been corrected;
    when the growth has a company water job behind it, that water job must be in drying_complete, invoiced or closed
    status.'
  eligibility:
  - id: au_state
    applies_to:
    - mold_authorization
    kind: state
    condition: The job must be in scheduled status when the remediation agreement is signed.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - scheduled
  - id: protocol
    applies_to:
    - mold_authorization
    kind: caller_fact
    condition: On tiers that require a protocol, an independent assessor's written protocol dated on or before the
      signing date must be on file.
    evidence_fields:
    - mold_jobs.protocol_date
    - mold_jobs.assessor_name
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
  - id: deposit
    applies_to:
    - mold_containment_start
    kind: caller_fact
    condition: Containment may be set on a self-pay job only after customer payments posted to the job total at
      least the tier's self-pay deposit.
    evidence_fields:
    - mold_jobs.funding_source
    - mold_payments.amount
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
  params:
    per_tier:
      Spot Mold Remediation:
        protocol_required: =protocol_required
        self_pay_deposit_amount: =self_pay_deposit_amount
      Limited Mold Remediation:
        protocol_required: =protocol_required
        self_pay_deposit_amount: =self_pay_deposit_amount
      Standard Mold Remediation:
        protocol_required: =protocol_required
        self_pay_deposit_amount: =self_pay_deposit_amount
      Extensive Mold Remediation:
        protocol_required: =protocol_required
        self_pay_deposit_amount: =self_pay_deposit_amount
      Attic and Crawlspace Mold Remediation:
        protocol_required: =protocol_required
        self_pay_deposit_amount: =self_pay_deposit_amount
      HVAC System Mold Remediation:
        protocol_required: =protocol_required
        self_pay_deposit_amount: =self_pay_deposit_amount
- id: mold_evt_remediation_scope
  subject:
  - mold_remediation_charge
  - mold_equipment_day_charge
  rule: The job must be in remediating, awaiting_clearance or cleared status when a scope line is charged. Each
    scope line is billed at the tier's unit rate for its code times the quantity performed, and labor the customer
    asks to have performed in the after_hours window is billed at the hourly rate times the after-hours labor multiplier.
    PPE is billed per technician-day at the tier's PPE rate, which is priced for the tier's minimum respiratory
    protection, and on tiers that require negative air an air scrubber runs on every day the containment is held.
    Containment is billed only on tiers that require it, media blasting only on tiers where it is allowed and HVAC
    duct, air handler and coil lines only on tiers where HVAC work is allowed. Air scrubbers and dehumidifiers are
    billed per unit per calendar day the containment is held, the set day and the teardown day each counting, up
    to the tier's billable equipment day cap; days beyond the cap are not billed. No scope line or equipment day
    may be charged with a service date after the job's last failed clearance date. Re-cleaning after a failed clearance
    is at the company's cost on every tier. Lead-safe setup is billable only for housing built before the RRP year-built
    cutoff where painted surfaces are disturbed, and asbestos sampling only for buildings built before the asbestos
    sampling year cutoff, sampled before any drywall, texture or insulation removal. When the job's total of scope,
    equipment and clearance charges is below the tier's minimum job charge at invoicing, one minimum_charge line
    for the shortfall is booked. Amounts are rounded to the cent, half up.
  eligibility:
  - id: sc_state
    applies_to:
    - mold_remediation_charge
    - mold_equipment_day_charge
    kind: state
    condition: The job must be in remediating, awaiting_clearance or cleared status when a scope line is charged.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - remediating
      - awaiting_clearance
      - cleared
  - id: no_reclean_billing
    applies_to:
    - mold_remediation_charge
    - mold_equipment_day_charge
    kind: caller_fact
    condition: No scope line or equipment day may be charged with a service date after the job's last failed clearance
      date.
    evidence_fields:
    - mold_jobs.last_failed_clearance_date
    - mold_charges.service_date
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
  params:
    per_tier:
      Spot Mold Remediation:
        containment_required: =containment_required
        blasting_allowed: =blasting_allowed
        hvac_work_allowed: =hvac_work_allowed
        billable_equipment_day_cap: =billable_equipment_day_cap
        minimum_job_charge: =minimum_job_charge
        reclean_billable: =reclean_billable
        negative_air_required: =negative_air_required
        respirator_level: =respirator_level
        after_hours_labor_multiplier: =after_hours_labor_multiplier
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
      Limited Mold Remediation:
        containment_required: =containment_required
        blasting_allowed: =blasting_allowed
        hvac_work_allowed: =hvac_work_allowed
        billable_equipment_day_cap: =billable_equipment_day_cap
        minimum_job_charge: =minimum_job_charge
        reclean_billable: =reclean_billable
        negative_air_required: =negative_air_required
        respirator_level: =respirator_level
