- id: rebuild_evt_payments
  subject:
  - rebuild_draw_payment
  - rebuild_insurance_payment
  rule: The contract must not be closed or cancelled when a draw payment or insurance posting is recorded. Each
    payment names the one draw it pays and is posted in full to the contract. Draws are paid by debit card, ACH,
    check or wire, and mortgagee releases arrive as mortgagee checks; credit cards are not accepted on reconstruction
    contracts. The carrier payment must be recorded on the same claim file this contract is linked to. Only dwelling-coverage
    carrier payments that reached the company directly, or by a two-party check the insured has endorsed, are posted
    to the contract, and only toward a carrier_direct draw. A carrier payment is posted to the same contract at
    most once. The amount posted is the least of the draw's unpaid amount, the contract balance and the carrier
    payment's unapplied remainder after every posting already made from it to any water, fire, mold or rebuild job,
    after the mitigation jobs of the claim file have been paid first under the claim payment allocation rule.
  eligibility:
  - id: pp_state
    applies_to:
    - rebuild_draw_payment
    - rebuild_insurance_payment
    kind: state
    condition: The contract must not be closed or cancelled when a draw payment or insurance posting is recorded.
    evidence_fields:
    - rebuild_contracts.status
    - rebuild_contracts.rebuild_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_contracts.rebuild_contract_id
      action_bindings:
        rebuild_contracts.rebuild_contract_id: rebuild_contract_id
    state_contract:
      field: rebuild_contracts.status
      allowed:
      - signed
      - permitted
      - in_construction
      - substantially_complete
      - final_invoiced
  - id: pp_same_claim
    applies_to:
    - rebuild_insurance_payment
    kind: authorization
    condition: The carrier payment must be recorded on the same claim file this contract is linked to.
    evidence_fields:
    - rebuild_contracts.claim_file_id
    - claims_payments.claim_file_id
    - claims_payments.claim_payment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_payments.claim_payment_id
      action_bindings:
        claims_payments.claim_payment_id: claim_payment_id
  - id: pp_once
    applies_to:
    - rebuild_insurance_payment
    kind: dedup
    condition: A carrier payment is posted to the same contract at most once.
    evidence_fields:
    - rebuild_payments.rebuild_contract_id
    - rebuild_payments.claim_payment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_payments.rebuild_contract_id
        - rebuild_payments.claim_payment_id
      action_bindings:
        rebuild_payments.rebuild_contract_id: rebuild_contract_id
        rebuild_payments.claim_payment_id: claim_payment_id
    dedup_contract:
      table: rebuild_payments
      mode: separate_record
      object_bindings:
        rebuild_contract_id: rebuild_contract_id
        claim_payment_id: claim_payment_id
      duplicate_filters:
        event_type:
        - rebuild_insurance_payment
      distinct_fields: []
- id: rebuild_overdue_draws
  subject:
  - rebuild_overdue_draw_charge
  - rebuild_work_suspension
  - rebuild_work_resume
  - rebuild_remobilization_charge
  rule: Overdue draw charges, suspension and remobilization apply only to customer-funded draws. Carrier-funded
    and mortgagee-funded draws carry none of them while the funds are pending, because their timing rests with the
    carrier or the mortgagee. An overdue draw charge may post only after the grace period following the draw's due
    date has fully passed. The grace period is counted in calendar days starting the day after the draw's due_date,
    and the first charge may post on the day after the grace period's last day. The charge is the tier's monthly
    overdue percentage of the draw's unpaid amount, at most once per draw per calendar month fee period, rounded
    to the cent, half up. When a customer-funded draw stays unpaid for more than the tier's stop-work days after
    its due date, work is suspended; when the draw is paid in full, work resumes and the tier's remobilization fee
    is booked once for that resumption.
  eligibility:
  - id: od_customer
    applies_to:
    - rebuild_overdue_draw_charge
    - rebuild_work_suspension
    kind: caller_fact
    condition: Overdue draw charges, suspension and remobilization apply only to customer-funded draws.
    evidence_fields:
    - rebuild_draws.funding_route
    - rebuild_draws.rebuild_draw_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_draws.rebuild_draw_id
      action_bindings:
        rebuild_draws.rebuild_draw_id: rebuild_draw_id
  - id: od_grace
    applies_to:
    - rebuild_overdue_draw_charge
    kind: time
    condition: An overdue draw charge may post only after the grace period following the draw's due date has fully
      passed.
    evidence_fields:
    - rebuild_draws.due_date
    - rebuild_draws.rebuild_draw_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_draws.rebuild_draw_id
      action_bindings:
        rebuild_draws.rebuild_draw_id: rebuild_draw_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the draw's due date
      anchor_source: rebuild_draws.due_date
      relation: not_before
      duration_source: variants.overdue_draw_grace_days
      unit: calendar_days
      counting_rule: The grace period is counted in calendar days starting the day after the draw's due_date, and
        the first charge may post on the day after the grace period's last day.
      boundary: exclusive
  params:
    per_tier:
      Repair Agreement - Minor Repairs:
        overdue_draw_grace_days: =overdue_draw_grace_days
        overdue_draw_charge_pct_monthly: =overdue_draw_charge_pct_monthly
        overdue_draw_stop_work_days: =overdue_draw_stop_work_days
        remobilization_fee: =remobilization_fee
      Standard Rebuild Agreement:
        overdue_draw_grace_days: =overdue_draw_grace_days
        overdue_draw_charge_pct_monthly: =overdue_draw_charge_pct_monthly
        overdue_draw_stop_work_days: =overdue_draw_stop_work_days
        remobilization_fee: =remobilization_fee
      Major Rebuild Agreement:
        overdue_draw_grace_days: =overdue_draw_grace_days
        overdue_draw_charge_pct_monthly: =overdue_draw_charge_pct_monthly
        overdue_draw_stop_work_days: =overdue_draw_stop_work_days
        remobilization_fee: =remobilization_fee
      Full Structural Rebuild Agreement:
        overdue_draw_grace_days: =overdue_draw_grace_days
        overdue_draw_charge_pct_monthly: =overdue_draw_charge_pct_monthly
        overdue_draw_stop_work_days: =overdue_draw_stop_work_days
        remobilization_fee: =remobilization_fee
      Multifamily Unit Rebuild Agreement:
        overdue_draw_grace_days: =overdue_draw_grace_days
        overdue_draw_charge_pct_monthly: =overdue_draw_charge_pct_monthly
        overdue_draw_stop_work_days: =overdue_draw_stop_work_days
        remobilization_fee: =remobilization_fee
