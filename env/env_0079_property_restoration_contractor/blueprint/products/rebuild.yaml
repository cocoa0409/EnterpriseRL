measures:
- id: rebuild_msr_current_contract_sum
  window: current state of one contract
  measure: contract_amount plus the amount of every signed additive change order (co_status signed, co_type not
    deductive) less the amount of every signed deductive change order
- id: rebuild_msr_pending_change_orders
  window: current state of one contract
  measure: count of rebuild_change_orders rows on the contract with co_status pending_signature
- id: rebuild_msr_draws_billed
  window: the life of one contract
  measure: sum of requested_amount over rebuild_draw_request rows on the contract
policies:
- id: rebuild_agg_multi_holding
  subject:
  - rebuild_contract_propose
  rule: A customer may hold any number of reconstruction contracts at once, one per property or unit being rebuilt;
    landlords, property managers and associations commonly hold several, one per damaged unit. Each contract carries
    its own draws, change orders, balance and warranty.
  eligibility: []
  params:
    max_per_customer: null
- id: rebuild_agg_one_contract_per_address
  subject:
  - rebuild_contract_propose
  - rebuild_insurance_payment
  rule: 'No other reconstruction contract of the same customer for the same loss address may be open when a new
    contract is proposed. A contract is open in every status except closed and cancelled; for multifamily units
    the unit number is part of the address, so each unit carries its own contract. The rebuild contract shares the
    claim file''s dwelling-coverage payments with the mitigation jobs of the same loss: under the claim payment
    allocation rule of the Insurance Claim Services charter, mitigation jobs are paid first and the rebuild contract
    last, so insurance proceeds reach the rebuild only after every mitigation job of the claim file has been paid
    in full.'
  eligibility:
  - id: one_open_contract
    applies_to:
    - rebuild_contract_propose
    kind: dedup
    condition: No other reconstruction contract of the same customer for the same loss address may be open when
      a new contract is proposed.
    evidence_fields:
    - rebuild_contracts.customer_id
    - rebuild_contracts.loss_address
    - rebuild_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_contracts.customer_id
        - rebuild_contracts.loss_address
      action_bindings:
        rebuild_contracts.customer_id: customer_id
        rebuild_contracts.loss_address: loss_address
    dedup_contract:
      table: rebuild_contracts
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        loss_address: loss_address
      duplicate_filters:
        status:
        - proposed
        - signed
        - permitted
        - in_construction
        - substantially_complete
        - final_invoiced
      distinct_fields: []
- id: rebuild_contract_signing
  subject:
  - rebuild_contract_sign
  - rebuild_proposal_decline
  - rebuild_contract_sum_charge
  rule: The contract must be in proposed status when it is signed or declined. The tier is fixed from the property
    type, the customer type and the contract amount in each tier's entry gate. The contract is signed by the property
    owner, or by the owner's agent such as the managing property manager or the association's authorized officer;
    the signature is the customer's own act, and the place of signing is recorded because it decides the cooling-off
    right. On signing, the contract price is booked to the contract as one contract_sum line. An insurance_claim
    contract must be linked to a claim file of the same customer that is not denied or withdrawn; otherwise the
    contract is self_pay. A proposal the customer declines, or does not sign, is cancelled with nothing billed.
  eligibility:
  - id: sg_state
    applies_to:
    - rebuild_contract_sign
    - rebuild_proposal_decline
    kind: state
    condition: The contract must be in proposed status when it is signed or declined.
    evidence_fields:
    - rebuild_contracts.status
    - rebuild_contracts.rebuild_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_contracts.rebuild_contract_id
      action_bindings:
        rebuild_contracts.rebuild_contract_id: rebuild_contract_id
    state_contract:
      field: rebuild_contracts.status
      allowed:
      - proposed
  formula:
    amount: contract_amount
- id: rebuild_cancellation
  subject:
  - rebuild_contract_cancel
  - rebuild_cancellation_charge
  rule: The contract must be in signed status when it is cancelled. Cancelling is the customer's own act. A cancellation
    is free of charge only when the contract was signed at the customer's home for at least the cooling-off minimum
    amount and the customer cancels no later than the cooling-off period after the customer signed the contract.
    The cooling-off period is counted in business days, which for this right are every calendar day except Sundays
    and federal holidays, starting the day after the signed_date, and a cancellation made on the last such day is
    in time. This is the buyer's right under the Federal Trade Commission's Cooling-Off Rule for sales made at the
    buyer's home; within it every draw already paid is refunded and nothing is charged. Any other cancellation of
    a signed contract before the permit stage carries the cancellation fee, the tier's cancellation fee percentage
    of the contract amount, plus the restocking percentage of the cost of any special-order materials already ordered.
    A contract already permitted or in construction cannot be cancelled by the desk; such a request is handed to
    a human representative as not covered by policy.
  eligibility:
  - id: cc_state
    applies_to:
    - rebuild_contract_cancel
    kind: state
    condition: The contract must be in signed status when it is cancelled.
    evidence_fields:
    - rebuild_contracts.status
    - rebuild_contracts.rebuild_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_contracts.rebuild_contract_id
      action_bindings:
        rebuild_contracts.rebuild_contract_id: rebuild_contract_id
    state_contract:
      field: rebuild_contracts.status
      allowed:
      - signed
  - id: cooling_off
    applies_to:
    - rebuild_cancellation_charge
    kind: time
    condition: A cancellation is free of charge only when the contract was signed at the customer's home for at
      least the cooling-off minimum amount and the customer cancels no later than the cooling-off period after the
      customer signed the contract.
    evidence_fields:
    - rebuild_contracts.signed_date
    - rebuild_contracts.signing_location
    - rebuild_contracts.contract_amount
    - rebuild_contracts.rebuild_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_contracts.rebuild_contract_id
      action_bindings:
        rebuild_contracts.rebuild_contract_id: rebuild_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the customer signed the contract
      anchor_source: rebuild_contracts.signed_date
      relation: not_after
      duration_source: variants.cooling_off_business_days
      unit: business_days
      counting_rule: The cooling-off period is counted in business days, which for this right are every calendar
        day except Sundays and federal holidays, starting the day after the signed_date, and a cancellation made
        on the last such day is in time.
      boundary: inclusive
  params:
    per_tier:
      Repair Agreement - Minor Repairs:
        cooling_off_business_days: =cooling_off_business_days
        cooling_off_min_amount: =cooling_off_min_amount
        cancellation_fee_pct: =cancellation_fee_pct
        special_order_restocking_pct: =special_order_restocking_pct
      Standard Rebuild Agreement:
        cooling_off_business_days: =cooling_off_business_days
        cooling_off_min_amount: =cooling_off_min_amount
        cancellation_fee_pct: =cancellation_fee_pct
        special_order_restocking_pct: =special_order_restocking_pct
      Major Rebuild Agreement:
        cooling_off_business_days: =cooling_off_business_days
        cooling_off_min_amount: =cooling_off_min_amount
        cancellation_fee_pct: =cancellation_fee_pct
        special_order_restocking_pct: =special_order_restocking_pct
      Full Structural Rebuild Agreement:
        cooling_off_business_days: =cooling_off_business_days
        cooling_off_min_amount: =cooling_off_min_amount
        cancellation_fee_pct: =cancellation_fee_pct
        special_order_restocking_pct: =special_order_restocking_pct
      Multifamily Unit Rebuild Agreement:
        cooling_off_business_days: =cooling_off_business_days
        cooling_off_min_amount: =cooling_off_min_amount
        cancellation_fee_pct: =cancellation_fee_pct
        special_order_restocking_pct: =special_order_restocking_pct
      Commercial Interior Rebuild Agreement:
        cooling_off_business_days: =cooling_off_business_days
        cooling_off_min_amount: =cooling_off_min_amount
        cancellation_fee_pct: =cancellation_fee_pct
        special_order_restocking_pct: =special_order_restocking_pct
  formula:
    when: charge_code == 'cancellation_fee'
    amount: round(contract_amount * cancellation_fee_pct / 100, 2)
- id: rebuild_permits_and_fees
  subject:
  - rebuild_permit_clearance
  - rebuild_construction_start
  - rebuild_permit_charge
  - rebuild_professional_fee_charge
  rule: Construction starts only after the permit is issued or the building department's no-permit determination
    is recorded. The contract must be in signed, permitted or in_construction status when a permit or professional
    fee is posted. Municipal permit fees are billed at the cost on the building department's receipt, one line per
    permit type, and the company's permit expediting fee is billed once per permit type pulled. Plan drawings are
    billed once per contract when the building department requires drawings, and an engineering letter once per
    letter when framing is altered; a tier whose fee is 0.00 bills neither. Lead-safe setup is billable only when
    the building was built before the RRP year-built cutoff and the work disturbs painted surfaces. Lead-safe work
    follows the EPA Renovation, Repair and Painting Rule and is done by the company's certified renovators. Commercial
    Interior Rebuild Agreements carry a project management fee of the tier's percentage of the contract sum, billed
    once at construction start.
  eligibility:
  - id: pm_state
    applies_to:
    - rebuild_permit_charge
    - rebuild_professional_fee_charge
    kind: state
    condition: The contract must be in signed, permitted or in_construction status when a permit or professional
      fee is posted.
    evidence_fields:
    - rebuild_contracts.status
    - rebuild_contracts.rebuild_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_contracts.rebuild_contract_id
      action_bindings:
        rebuild_contracts.rebuild_contract_id: rebuild_contract_id
    state_contract:
      field: rebuild_contracts.status
      allowed:
      - signed
      - permitted
      - in_construction
  - id: rrp
    applies_to:
    - rebuild_professional_fee_charge
    kind: caller_fact
    condition: Lead-safe setup is billable only when the building was built before the RRP year-built cutoff and
      the work disturbs painted surfaces.
    evidence_fields:
    - rebuild_contracts.year_built
    - rebuild_contracts.rebuild_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_contracts.rebuild_contract_id
      action_bindings:
        rebuild_contracts.rebuild_contract_id: rebuild_contract_id
