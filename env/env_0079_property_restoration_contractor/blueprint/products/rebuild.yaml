  - id: ch_state
    applies_to:
    - rebuild_change_order_charge
    - rebuild_change_order_credit
    kind: state
    condition: The contract must be in signed, permitted, in_construction or substantially_complete status when
      a change order is booked.
    evidence_fields:
    - rebuild_contracts.status
    - rebuild_contracts.rebuild_contract_id
    evidence_contract:
