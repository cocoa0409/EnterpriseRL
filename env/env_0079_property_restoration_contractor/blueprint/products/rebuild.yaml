- id: rebuild_draws
  subject:
  - rebuild_draw_request
  rule: 'A draw may be requested only when the contract''s status shows its milestone reached: contract_signing
    in signed, permitted or in_construction status; framing, rough-in, drywall and finishes milestones in in_construction
    status; substantial_completion and retainage_release in substantially_complete or final_invoiced status. Each
    milestone of the tier''s draw schedule is requested at most once per contract. A draw requests the milestone''s
    percentage of the current contract sum, which is the contract amount plus signed additive change orders less
    signed deductive change orders as of the request date; the contract_signing draw is also capped at the tier''s
    deposit maximum. On tiers with retainage, each draw withholds the retainage percentage, and the withheld total
    is requested as the retainage_release draw once the tier''s retainage release days have passed after substantial
    completion. Because each draw is a percentage of the contract sum current at its own request, the substantial_completion
    draw requests whatever remains of the current contract sum after every earlier draw before retainage, so that
    the draws together equal the current contract sum. The funding route is mortgagee_release when the linked claim
    file names a mortgagee and its dwelling-coverage payment was routed to the mortgagee''s loss-draft account,
    carrier_direct when the dwelling payment reached the company, and customer otherwise; a mortgagee_release draw
    is requested only after the mortgagee''s inspection of the milestone. On tiers that require it, each draw request
    carries a conditional progress lien waiver, and the substantial_completion draw a conditional final waiver.
    A customer-funded draw is due the tier''s draw due days after the request date.'
  eligibility:
  - id: dr_milestone_state
    applies_to:
    - rebuild_draw_request
    kind: caller_fact
    condition: 'A draw may be requested only when the contract''s status shows its milestone reached: contract_signing
      in signed, permitted or in_construction status; framing, rough-in, drywall and finishes milestones in in_construction
      status; substantial_completion and retainage_release in substantially_complete or final_invoiced status.'
    evidence_fields:
    - rebuild_contracts.status
    - rebuild_contracts.rebuild_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_contracts.rebuild_contract_id
      action_bindings:
        rebuild_contracts.rebuild_contract_id: rebuild_contract_id
  - id: dr_once
    applies_to:
    - rebuild_draw_request
    kind: dedup
    condition: Each milestone of the tier's draw schedule is requested at most once per contract.
    evidence_fields:
    - rebuild_draws.rebuild_contract_id
    - rebuild_draws.draw_milestone
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_draws.rebuild_contract_id
        - rebuild_draws.draw_milestone
      action_bindings:
        rebuild_draws.rebuild_contract_id: rebuild_contract_id
        rebuild_draws.draw_milestone: draw_milestone
    dedup_contract:
      table: rebuild_draws
      mode: separate_record
      object_bindings:
        rebuild_contract_id: rebuild_contract_id
        draw_milestone: draw_milestone
      duplicate_filters:
        event_type:
        - rebuild_draw_request
      distinct_fields: []
  params:
    per_tier:
      Repair Agreement - Minor Repairs:
        draw_schedule: =draw_schedule
        deposit_max_amount: =deposit_max_amount
        retainage_pct: =retainage_pct
        retainage_release_days: =retainage_release_days
        draw_due_days: =draw_due_days
        lien_waiver_with_each_draw: =lien_waiver_with_each_draw
        mortgagee_inspection_required: =mortgagee_inspection_required
      Standard Rebuild Agreement:
        draw_schedule: =draw_schedule
        deposit_max_amount: =deposit_max_amount
        retainage_pct: =retainage_pct
        retainage_release_days: =retainage_release_days
        draw_due_days: =draw_due_days
        lien_waiver_with_each_draw: =lien_waiver_with_each_draw
        mortgagee_inspection_required: =mortgagee_inspection_required
      Major Rebuild Agreement:
        draw_schedule: =draw_schedule
        deposit_max_amount: =deposit_max_amount
        retainage_pct: =retainage_pct
        retainage_release_days: =retainage_release_days
        draw_due_days: =draw_due_days
        lien_waiver_with_each_draw: =lien_waiver_with_each_draw
        mortgagee_inspection_required: =mortgagee_inspection_required
      Full Structural Rebuild Agreement:
        draw_schedule: =draw_schedule
        deposit_max_amount: =deposit_max_amount
        retainage_pct: =retainage_pct
        retainage_release_days: =retainage_release_days
        draw_due_days: =draw_due_days
        lien_waiver_with_each_draw: =lien_waiver_with_each_draw
