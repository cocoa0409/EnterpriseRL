events:
- type: rebuild_contract_propose
  target: rebuild_contracts
  mutation: create
  meaning: A reconstruction contract is written up and proposed to the customer.
  grain: one row per transaction on the job record
  fields:
    customer_id: customer id
    variant_name: variant name
    claim_file_id: claim file id
    mitigation_job_id: mitigation job id
    loss_address: loss address
    property_type: property type
    year_built: year built
    funding_source: funding source
    proposed_date: proposed date
    contract_amount: contract amount
    contract_balance: contract balance
  triggers: []
- type: rebuild_contract_sign
  target: rebuild_contracts
  mutation:
    transition:
      from: proposed
      to: signed
  meaning: The customer signs the reconstruction contract.
  grain: one row per transaction on the job record
  fields:
    signed_date: date signed
    signing_location: where signed
    contract_amount: contract price as signed
  triggers:
  - event: rebuild:rebuild_contract_sum_charge
    map:
      charge_code: contract_sum
      amount: contract_amount
      posted_date: signed_date
- type: rebuild_proposal_decline
  target: rebuild_contracts
  mutation:
    transition:
      from: proposed
      to: cancelled
  meaning: The customer declines the proposal or lets it lapse unsigned.
  grain: one row per transaction on the job record
  fields:
    cancelled_date: date declined
  triggers: []
- type: rebuild_contract_cancel
  target: rebuild_contracts
  mutation:
    transition:
      from: signed
      to: cancelled
  meaning: The customer cancels a signed contract before the permit stage.
  grain: one row per transaction on the job record
  fields:
    cancelled_date: date cancelled
  triggers: []
- type: rebuild_permit_clearance
  target: rebuild_contracts
  mutation:
    transition:
      from: signed
      to: permitted
  meaning: The permit is issued, or the building department's no-permit determination is recorded.
  grain: one row per transaction on the job record
  fields:
    permit_required: permit required
    permit_cleared_date: date cleared
  triggers: []
- type: rebuild_construction_start
  target: rebuild_contracts
  mutation:
    transition:
      from: permitted
      to: in_construction
  meaning: Construction starts on site.
  grain: one row per transaction on the job record
  fields:
    construction_start_date: start date
  triggers: []
- type: rebuild_work_suspension
  target: rebuild_contracts
  mutation: update
  meaning: Work is suspended because a draw is past due beyond the stop-work days.
  grain: one row per transaction on the job record
  fields:
    work_suspended_date: suspension date
  triggers: []
- type: rebuild_work_resume
  target: rebuild_contracts
  mutation: update
  meaning: Work resumes after the past-due draw is paid.
  grain: one row per transaction on the job record
  fields:
    work_resumed_date: resumption date
  triggers:
  - event: rebuild:rebuild_remobilization_charge
    map:
      charge_code: remobilization
      posted_date: work_resumed_date
- type: rebuild_substantial_completion
  target: rebuild_contracts
  mutation:
    transition:
      from: in_construction
      to: substantially_complete
  meaning: The final walkthrough records substantial completion.
  grain: one row per transaction on the job record
  fields:
    substantial_completion_date: walkthrough date
  triggers: []
- type: rebuild_final_invoice
  target: rebuild_contracts
  mutation:
    transition:
      from: substantially_complete
      to: final_invoiced
  meaning: The final invoice is issued.
  grain: one row per transaction on the job record
  fields:
    final_invoiced_date: invoice date
    final_invoice_amount: total charges
    payment_due_date: due date
  triggers: []
- type: rebuild_contract_close
  target: rebuild_contracts
  mutation:
    transition:
      from: final_invoiced
      to: closed
  meaning: The contract balance reaches zero and the contract closes.
  grain: one row per transaction on the job record
  fields:
    closed_date: closing date
  triggers: []
- type: rebuild_contract_sum_charge
  target: rebuild_charges
  meaning: The signed contract price is booked to the contract.
  grain: one row per contract
  distinguish_by:
  - charge_code
  fields:
    charge_code: contract_sum
    posted_date: signing date
    amount: contract price
  account: contract_balance
  direction: in
  triggers: []
- type: rebuild_change_order_charge
  target: rebuild_charges
  meaning: A signed additive change order is booked.
  grain: one row per signed additive change order
  distinguish_by:
  - change_order_id
  fields:
    charge_code: change_order
    change_order_id: change order billed
    posted_date: date booked
    amount: change order amount
  account: contract_balance
  direction: in
  triggers: []
- type: rebuild_permit_charge
  target: rebuild_charges
  meaning: A municipal permit fee or the company's expediting fee for one permit.
  grain: one row per charge code per permit type
  distinguish_by:
  - charge_code
  - permit_type
  fields:
    charge_code: permit_fee or permit_expediting
    permit_type: permit
    posted_date: date posted
    amount: fee
  account: contract_balance
  direction: in
  triggers: []
- type: rebuild_professional_fee_charge
  target: rebuild_charges
  meaning: Plan drawings, an engineer's letter, lead-safe setup or project management billed on the contract.
  grain: one row per charge code per posting date
  distinguish_by:
  - charge_code
  - posted_date
  fields:
    charge_code: plan_drawing, engineering_letter, lead_safe_setup or project_management
    posted_date: date posted
    amount: fee
  account: contract_balance
  direction: in
  triggers: []
- type: rebuild_cancellation_charge
  target: rebuild_charges
  meaning: The cancellation fee or special-order restocking charge on a cancelled contract.
  grain: one row per charge code on the contract
  distinguish_by:
  - charge_code
  fields:
    charge_code: cancellation_fee or restocking
    posted_date: date posted
    amount: charge
  account: contract_balance
  direction: in
  triggers: []
- type: rebuild_remobilization_charge
  target: rebuild_charges
  meaning: The remobilization fee after work resumes from a suspension.
  grain: one row per resumption
  distinguish_by:
  - posted_date
  fields:
    charge_code: remobilization
    posted_date: resumption date
    amount: fee
  account: contract_balance
  direction: in
  triggers: []
- type: rebuild_overdue_draw_charge
  target: rebuild_charges
  meaning: A charge on an overdue self-paid draw for one monthly fee period.
  grain: one row per overdue draw per monthly fee period
  distinguish_by:
  - rebuild_draw_id
  - fee_period
  fields:
    charge_code: overdue_draw_charge
    rebuild_draw_id: overdue draw
    fee_period: fee period
    posted_date: date posted
    amount: charge
  account: contract_balance
  direction: in
  triggers: []
- type: rebuild_warranty_trip_charge
  target: rebuild_charges
  meaning: The trip charge for a warranty inspection that found no covered defect.
  grain: one row per not-covered warranty inspection
  distinguish_by:
  - warranty_claim_id
  fields:
    charge_code: warranty_trip_charge
    warranty_claim_id: inspection billed
    posted_date: date posted
    amount: trip charge
  account: contract_balance
  direction: in
  triggers: []
- type: rebuild_draw_request
  target: rebuild_draws
  meaning: A draw is requested at a contract milestone.
  grain: one row per milestone on the contract
  distinguish_by:
  - draw_milestone
  fields:
    draw_milestone: milestone
    draw_number: sequence
    funding_route: who funds it
    lien_waiver_type: waiver delivered
    request_date: date requested
    due_date: date due
    requested_amount: amount requested
  triggers: []
- type: rebuild_draw_payment
  target: rebuild_payments
  meaning: A payment from the owner or a mortgagee release toward one draw.
  grain: one row per tendered payment
  distinguish_by:
