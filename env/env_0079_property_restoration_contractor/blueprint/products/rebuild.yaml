- id: rebuild_completion
  subject:
  - rebuild_substantial_completion
  - rebuild_final_invoice
  - rebuild_contract_close
  rule: Substantial completion is recorded at the final walkthrough, and punch list items are completed within the
    tier's punch list days after it. The contract must be in substantially_complete status when the final invoice
    is issued. The final invoice amount is the total of every charge line on the contract, and the final balance
    is due the tier's final payment due days after the invoice date. On an insurance_claim contract the final invoice
    and the completion date are the proof of completion the carrier needs to release recoverable depreciation. The
    contract closes when its balance is exactly zero after final invoicing.
  eligibility:
  - id: fi_state
    applies_to:
    - rebuild_final_invoice
    kind: state
    condition: The contract must be in substantially_complete status when the final invoice is issued.
    evidence_fields:
    - rebuild_contracts.status
    - rebuild_contracts.rebuild_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_contracts.rebuild_contract_id
      action_bindings:
        rebuild_contracts.rebuild_contract_id: rebuild_contract_id
    state_contract:
      field: rebuild_contracts.status
      allowed:
      - substantially_complete
  params:
    per_tier:
      Repair Agreement - Minor Repairs:
        punch_list_days: =punch_list_days
        final_payment_due_days: =final_payment_due_days
      Standard Rebuild Agreement:
        punch_list_days: =punch_list_days
        final_payment_due_days: =final_payment_due_days
      Major Rebuild Agreement:
        punch_list_days: =punch_list_days
        final_payment_due_days: =final_payment_due_days
      Full Structural Rebuild Agreement:
