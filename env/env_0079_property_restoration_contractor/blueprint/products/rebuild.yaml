category: rebuild
display_name: Reconstruction
binding:
  holding_table: rebuild_contracts
  event_tables:
  - rebuild_charges
  - rebuild_draws
  - rebuild_payments
  - rebuild_warranty_claims
  intake_tables:
  - rebuild_change_orders
  status_field: status
  variant_field: variant_name
  quantity_fields:
    contract_balance: contract_balance
lifecycle:
  states:
  - proposed
  - signed
  - permitted
  - in_construction
  - substantially_complete
  - final_invoiced
  - closed
  - cancelled
  transitions:
  - from: proposed
    to: signed
    by: user
    means: The customer signs the reconstruction contract.
  - from: proposed
    to: cancelled
    by: agent
    means: The customer declines the proposal or it lapses unsigned.
  - from: signed
    to: cancelled
    by: user
    means: The customer cancels the signed contract before the permit stage.
  - from: signed
    to: permitted
    by: system
    means: The permit is issued or the no-permit determination recorded.
  - from: permitted
    to: in_construction
    by: system
    means: Construction starts.
  - from: in_construction
    to: substantially_complete
    by: system
    means: The final walkthrough records substantial completion.
  - from: substantially_complete
    to: final_invoiced
    by: agent
    means: The final invoice is issued.
  - from: final_invoiced
    to: closed
    by: system
    means: The balance reaches zero and the contract closes.
accounts:
- key: contract_balance
  unit: USD
  meaning: 'Amount the customer owes on one reconstruction contract: charges raise it; draw payments, insurance
    postings and deductive change order credits lower it.'
parameter_schema:
  draw_schedule: Draw milestones and the percentage of the current contract sum billed at each (a milestone -> percent
    mapping summing to 100)
  deposit_max_amount: Cap on the contract_signing draw regardless of its percentage, USD
  retainage_pct: Percentage withheld from each draw payment until retainage release, percent
  retainage_release_days: Calendar days after substantial completion when the retainage draw may be requested, count
  draw_due_days: Calendar days after a draw request by which the draw is due from a self-paying customer, count
  overdue_draw_stop_work_days: Calendar days a draw may be past due before work is suspended, count
  change_order_markup_pct: Overhead and profit markup added to change order line pricing, percent
  owner_upgrade_deposit_pct: Share of an owner_upgrade change order that must be paid before the upgrade is ordered,
    percent
  change_order_validity_days: Calendar days a change order proposal remains open for signature before it is voided,
    count
  max_pending_change_orders: Change orders that may await signature on one contract at a time, count
  change_order_minimum_amount: Smallest additive change order written; smaller additions are absorbed, USD
  permit_fee_passthrough: Whether municipal permit fees are billed at cost to the customer, boolean
  permit_expediting_fee: Company fee for pulling and expediting each permit, USD
  plan_drawing_fee: Fee for permit drawings when the work requires them, per contract, USD
  engineering_letter_fee: Pass-through fee for a structural engineer's letter when framing is altered, per letter,
    USD
  dumpster_fee: Roll-off dumpster per placement, USD
  final_cleaning_fee: Post-construction final cleaning per contract, USD
  project_management_fee_pct: Project management fee on the line-item total, percent
  carpenter_hourly_rate: Finish carpenter labor per hour for change order and time-and-material work, USD
  painter_hourly_rate: Painter labor per hour for change order and time-and-material work, USD
  drywall_rate_per_sqft: Drywall hang, tape, finish (smooth) per square foot, USD
  paint_rate_per_sqft: Seal and two coats of paint per square foot of surface, USD
  insulation_rate_per_sqft: Batt insulation install per square foot, USD
  baseboard_install_rate_per_lf: Baseboard install, caulk and paint per linear foot, USD
  carpet_install_rate_per_sqft: Carpet and pad install per square foot (material excluded), USD
  lvp_install_rate_per_sqft: Luxury vinyl plank install per square foot (material excluded), USD
  tile_install_rate_per_sqft: Ceramic or porcelain tile install per square foot (material excluded), USD
  cabinet_install_rate_per_lf: Base or wall cabinet install per linear foot (cabinets excluded), USD
  flooring_allowance_per_sqft: Owner selection allowance for flooring material per square foot; a selection above
    it is an owner upgrade, USD
  cabinet_allowance_per_lf: Owner selection allowance for cabinet material per linear foot; a selection above it
    is an owner upgrade, USD
  fixture_allowance_per_each: Owner selection allowance per plumbing or lighting fixture; a selection above it is
    an owner upgrade, USD
  material_escalation_threshold_pct: Documented supplier price increase on a contract material above which the excess
    may be billed as a change order, percent
  cooling_off_business_days: Business days (every day except Sundays and federal holidays) after signing within
    which a home-solicitation contract may be cancelled without charge, count
  cooling_off_min_amount: Contract amount at or above which the cooling-off right applies to a contract signed at
    the buyer's home, USD
  cancellation_fee_pct: Cancellation fee as a percentage of the contract amount when the customer cancels after
    the cooling-off period and before construction starts, percent
  special_order_restocking_pct: Restocking charge on special-order materials already ordered when a contract or
    change order is cancelled, percent of the material cost
  workmanship_warranty_months: Months after substantial completion during which workmanship defects are repaired
    at no charge, count
  warranty_inspection_business_days: Business days (Monday-Friday excluding company holidays) to inspect a reported
    warranty defect, count
  warranty_covers_owner_supplied_materials: Whether the workmanship warranty extends to materials the owner supplied,
    boolean
  rrp_year_built_cutoff: Housing built before this year triggers lead-safe practices when painted surfaces are disturbed
    (EPA RRP pre-1978 housing), year
  lead_safe_setup_fee: Lead-safe work practice setup per contract, USD
  punch_list_days: Calendar days after the final walkthrough to complete punch list items, count
  final_payment_due_days: Calendar days after the final invoice by which the final balance is due, count
  lien_waiver_with_each_draw: Whether a conditional lien waiver accompanies each draw request, boolean
  mortgagee_inspection_required: Whether a draw funded by a mortgagee loss-draft release must follow a mortgagee
    inspection of the completed milestone, boolean
  overdue_draw_grace_days: Calendar days after a draw's due date before an overdue draw charge may post, count
  overdue_draw_charge_pct_monthly: Charge on an overdue self-paid draw balance per monthly fee period, percent
  remobilization_fee: Fee to remobilize the crew after work was suspended for a past-due draw, per suspension, USD
  warranty_trip_charge: Trip charge when a warranty inspection finds the reported item is not a covered workmanship
    defect, USD
