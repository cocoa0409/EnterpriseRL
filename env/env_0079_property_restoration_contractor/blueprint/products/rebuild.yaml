        final_payment_due_days: =final_payment_due_days
      Commercial Interior Rebuild Agreement:
        punch_list_days: =punch_list_days
        final_payment_due_days: =final_payment_due_days
- id: rebuild_warranty
  subject:
  - rebuild_warranty_report
  - rebuild_warranty_inspection
  - rebuild_warranty_trip_charge
  rule: The contract must be in substantially_complete, final_invoiced or closed status when a warranty defect is
    reported. A defect is covered only when it is reported no later than the warranty term after substantial completion
    was recorded on the contract. The warranty term is counted in calendar months from the substantial_completion_date
    to the same day of the month that many months later, or to the last day of that month when it has no such day,
    and a defect reported on that end date is in time. A reported defect is inspected within the tier's warranty
    inspection business days. The inspection finds covered_defect when the item is workmanship the company performed
    and is repaired at no charge, and not_covered when it is wear, owner damage, owner-supplied material on tiers
    whose warranty does not cover it, or work the company did not perform; a not_covered finding carries the tier's
    warranty trip charge. A report after the warranty term is not inspected under warranty and is handed to a human
    representative as not covered by policy.
  eligibility:
  - id: wr_state
    applies_to:
    - rebuild_warranty_report
    kind: state
    condition: The contract must be in substantially_complete, final_invoiced or closed status when a warranty defect
      is reported.
    evidence_fields:
    - rebuild_contracts.status
    - rebuild_contracts.rebuild_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_contracts.rebuild_contract_id
      action_bindings:
        rebuild_contracts.rebuild_contract_id: rebuild_contract_id
    state_contract:
      field: rebuild_contracts.status
      allowed:
      - substantially_complete
      - final_invoiced
      - closed
  - id: wr_term
    applies_to:
    - rebuild_warranty_report
    kind: time
    condition: A defect is covered only when it is reported no later than the warranty term after substantial completion
      was recorded on the contract.
    evidence_fields:
    - rebuild_contracts.substantial_completion_date
    - rebuild_contracts.rebuild_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rebuild_contracts.rebuild_contract_id
      action_bindings:
        rebuild_contracts.rebuild_contract_id: rebuild_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: substantial completion was recorded on the contract
      anchor_source: rebuild_contracts.substantial_completion_date
      relation: not_after
      duration_source: variants.workmanship_warranty_months
      unit: calendar_months
      counting_rule: The warranty term is counted in calendar months from the substantial_completion_date to the
        same day of the month that many months later, or to the last day of that month when it has no such day,
        and a defect reported on that end date is in time.
      boundary: inclusive
  params:
    per_tier:
      Repair Agreement - Minor Repairs:
        workmanship_warranty_months: =workmanship_warranty_months
        warranty_inspection_business_days: =warranty_inspection_business_days
        warranty_covers_owner_supplied_materials: =warranty_covers_owner_supplied_materials
        warranty_trip_charge: =warranty_trip_charge
      Standard Rebuild Agreement:
        workmanship_warranty_months: =workmanship_warranty_months
        warranty_inspection_business_days: =warranty_inspection_business_days
        warranty_covers_owner_supplied_materials: =warranty_covers_owner_supplied_materials
        warranty_trip_charge: =warranty_trip_charge
      Major Rebuild Agreement:
        workmanship_warranty_months: =workmanship_warranty_months
        warranty_inspection_business_days: =warranty_inspection_business_days
        warranty_covers_owner_supplied_materials: =warranty_covers_owner_supplied_materials
        warranty_trip_charge: =warranty_trip_charge
      Full Structural Rebuild Agreement:
        workmanship_warranty_months: =workmanship_warranty_months
        warranty_inspection_business_days: =warranty_inspection_business_days
        warranty_covers_owner_supplied_materials: =warranty_covers_owner_supplied_materials
        warranty_trip_charge: =warranty_trip_charge
      Multifamily Unit Rebuild Agreement:
