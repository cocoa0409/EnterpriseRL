events:
- type: water_job_dispatch
  target: water_jobs
  mutation: create
  meaning: An emergency water call is booked and a crew is dispatched, opening a water mitigation job.
  grain: one row per transaction on the job record
  fields:
    customer_id: customer who ordered the job
    variant_name: service tier fixed from the water category and affected area
    claim_file_id: claim file the job is billed under, empty for self-pay
    loss_address: loss street address
    property_type: property type
    year_built: year the building was built
    loss_date: date of the loss
    opened_date: booking and dispatch date
    dispatch_window: rate window of the dispatch
    onsite_arrival_minutes: minutes from call to arrival
    water_category: IICRC water category
    water_class: IICRC water class
    affected_area_sqft: affected area mapped
    funding_source: insurance_claim or self_pay
    balance_due: opening balance, 0.00
  triggers: []
- type: water_work_authorization
  target: water_jobs
  mutation:
    transition:
      from: dispatched
      to: authorized
  meaning: The property owner or the owner's authorized agent signs the work authorization.
  grain: one row per transaction on the job record
  fields:
    authorized_date: date signed
  triggers: []
- type: water_dispatch_cancel
  target: water_jobs
  mutation:
    transition:
      from: dispatched
      to: cancelled
  meaning: The customer declines the work before signing the authorization; only the service call remains billable.
  grain: one row per transaction on the job record
  fields:
    cancelled_date: date cancelled
  triggers: []
- type: water_drying_start
  target: water_jobs
  mutation:
    transition:
      from: authorized
      to: drying
  meaning: Drying equipment is set and the drying log is opened.
  grain: one row per transaction on the job record
  fields:
    drying_start_date: equipment set day
  triggers: []
- type: water_early_release
  target: water_jobs
  mutation: update
  meaning: The customer signs an Early Equipment Removal Release asking that drying stop before the dry standard
    is reached.
  grain: one row per transaction on the job record
  fields:
    release_signed_date: date the release was signed
  triggers: []
- type: water_drying_complete
  target: water_jobs
  mutation:
    transition:
      from: drying
      to: drying_complete
  meaning: The last drying equipment is removed from the site.
  grain: one row per transaction on the job record
  fields:
    drying_complete_date: removal date
    drying_outcome: dry_standard_met or customer_release
  triggers: []
- type: water_invoice_issue
  target: water_jobs
  mutation:
    transition:
      from: drying_complete
      to: invoiced
  meaning: The final invoice for the job is issued.
  grain: one row per transaction on the job record
  fields:
    invoiced_date: invoice date
    final_invoice_amount: total of all charges at invoicing
    payment_due_date: due date set from the payment terms
  triggers: []
- type: water_job_close
  target: water_jobs
  mutation:
    transition:
      from: invoiced
      to: closed
  meaning: The job's balance reaches zero and the job closes.
  grain: one row per transaction on the job record
  fields:
    closed_date: closing date
  triggers: []
- type: water_service_call_charge
  target: water_charges
  meaning: The emergency service call fee for one dispatch to the job.
  grain: one row per dispatch (initial or return) on the job
  distinguish_by:
  - service_date
  fields:
    charge_code: service_call
    service_date: dispatch date
    rate_window: rate window of the dispatch
    amount: fee charged
  account: balance_due
  direction: in
  triggers: []
- type: water_equipment_day_charge
  target: water_charges
  meaning: Rental of one type of drying equipment for one calendar day of operation.
  grain: one row per equipment type per calendar day on the job
  distinguish_by:
  - charge_code
  - service_date
  fields:
    charge_code: equipment type
    service_date: calendar day the equipment ran
    quantity: units of that type running that day
    unit: unit_day
    unit_rate: daily rate per unit
    amount: quantity times unit_rate
  account: balance_due
  direction: in
  triggers: []
- type: water_mitigation_service_charge
  target: water_charges
  meaning: One mitigation service or labor line performed on the job.
  grain: one row per service code per service date per rate window on the job
  distinguish_by:
  - charge_code
  - service_date
  - rate_window
  fields:
    charge_code: service code
    service_date: date performed
    quantity: quantity performed
    unit: unit of the quantity
    unit_rate: rate per unit after any after-hours multiplier
    rate_window: rate window the work was performed in
    amount: quantity times unit_rate
  account: balance_due
  direction: in
  triggers: []
- type: water_monitoring_visit_charge
  target: water_charges
  meaning: A daily moisture monitoring visit to the drying job.
  grain: one row per monitoring visit day on the job
  distinguish_by:
  - service_date
  fields:
    charge_code: monitoring_visit
    service_date: visit date
    amount: visit fee
  account: balance_due
  direction: in
  triggers: []
- type: water_late_fee
  target: water_charges
  meaning: A late fee assessed on a past-due invoiced balance for one monthly fee period.
  grain: one row per monthly fee period on the job
  distinguish_by:
  - fee_period
  fields:
    charge_code: late_fee
    fee_period: fee period YYYY-MM
    amount: late fee
  account: balance_due
  direction: in
  triggers: []
- type: water_card_surcharge
  target: water_charges
  meaning: The surcharge on one customer payment made by credit card.
  grain: one row per credit card payment
  distinguish_by:
  - source_payment_id
  fields:
    charge_code: card_surcharge
    source_payment_id: the credit card payment surcharged
    amount: surcharge
  account: balance_due
  direction: in
  triggers: []
- type: water_customer_payment
  target: water_payments
  meaning: A payment by the customer toward the job (deposit or balance).
  grain: one row per tendered payment
  distinguish_by:
  - payment_reference
  fields:
    payment_method: tender
    payment_reference: check or confirmation number
    posted_date: date posted
    amount: amount paid
  account: balance_due
  direction: out
  triggers: []
- type: water_insurance_payment
  target: water_payments
  meaning: Posting of insurance proceeds from one carrier payment to the job.
  grain: one row per carrier payment posted to the job
  distinguish_by:
  - claim_payment_id
  fields:
    claim_payment_id: carrier payment drawn from
    posted_date: date posted
    amount: amount posted
  account: balance_due
  direction: out
  triggers: []
- type: water_adjustment_credit
  target: water_payments
  meaning: A credit correcting or relieving one charge line on the job.
  grain: one row per charge line per credit reason
  distinguish_by:
  - source_charge_id
  - adjustment_reason
  fields:
    source_charge_id: charge line credited
    adjustment_reason: billing_error, duplicate_line or goodwill
    posted_date: date posted
    amount: credit amount
  account: balance_due
  direction: out
  triggers: []
- type: water_refund
  target: water_payments
  meaning: Refund of an overpayment back to the customer's original tender.
  grain: one row per refunded customer payment
  distinguish_by:
  - source_payment_id
  fields:
    source_payment_id: customer payment refunded from
    payment_method: tender refunded to (same as the source payment)
    posted_date: date the refund was issued
    amount: refund amount
  account: balance_due
  direction: in
  triggers: []
measures:
- id: water_msr_billed_drying_days
  window: the life of one water job
  measure: count of distinct service_date values among water_equipment_day_charge rows on the job
- id: water_msr_goodwill_credited
  window: the life of one water job
  measure: sum of amount over water_adjustment_credit rows on the job with adjustment_reason goodwill
- id: water_msr_open_jobs_at_address
  window: current state at the moment of booking
  measure: count of the customer's water_jobs rows with the same loss_address and loss_date whose status is not
    closed or cancelled
policies:
- id: water_agg_multi_holding
  subject:
  - water_job_dispatch
  rule: A customer may hold any number of water mitigation jobs at the same time, one for each separate loss; landlords,
    property managers, associations and commercial owners routinely carry several open jobs across their properties.
    Each job is a separate contract with its own tier, authorization, ledger and invoice.
  eligibility: []
  params:
    max_per_customer: null
- id: water_agg_same_loss_job
  subject:
  - water_job_dispatch
  - water_customer_payment
  - water_insurance_payment
  - water_adjustment_credit
  - water_refund
  rule: 'No other water job of the same customer for the same loss address and the same loss date may be open when
    a new dispatch is booked. A repeat call about a loss that already has an open job is handled on that existing
    job as a return visit, and a job is open in every status except closed and cancelled. Jobs are never combined
    for billing: each payment, insurance posting, credit or refund names exactly one job and moves only that job''s
    balance, and a credit balance on one job is refunded from that job rather than moved to another job of the same
    customer.'
  eligibility:
  - id: one_open_job_per_loss
    applies_to:
    - water_job_dispatch
    kind: dedup
    condition: No other water job of the same customer for the same loss address and the same loss date may be open
      when a new dispatch is booked.
    evidence_fields:
    - water_jobs.customer_id
    - water_jobs.loss_address
    - water_jobs.loss_date
    - water_jobs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.customer_id
        - water_jobs.loss_address
        - water_jobs.loss_date
      action_bindings:
        water_jobs.customer_id: customer_id
        water_jobs.loss_address: loss_address
        water_jobs.loss_date: loss_date
    dedup_contract:
      table: water_jobs
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        loss_address: loss_address
        loss_date: loss_date
      duplicate_filters:
        status:
        - dispatched
        - authorized
        - drying
        - drying_complete
        - invoiced
      distinct_fields: []
  measures:
  - water_msr_open_jobs_at_address
- id: water_tier_assignment
  subject:
  - water_job_dispatch
  rule: 'The tier of a water job is fixed at dispatch from the water category and the affected area mapped on arrival,
    using each tier''s entry gate: the water category selects Clean, Gray or Black Water Mitigation, and an affected
    area at or above the Large Loss threshold selects the Large Loss tier of that category. The tier stays fixed
    for the life of the job; when the water category is reassessed after dispatch (for example clean water that
    has stood long enough to degrade), the job is not repriced, and on an insurance-funded job the difference in
    scope is pursued as a supplement on the claim file. The funding source is insurance_claim only when the job
    is linked to a claim file of the same customer for the same loss date, and self_pay otherwise.'
  eligibility: []
- id: water_evt_service_call
  subject:
  - water_service_call_charge
  rule: The job must be in dispatched, authorized or drying status when a service call is charged. Every dispatch
    to a job, the first one and any return dispatch the customer books, is charged the service call fee of the job's
    tier, increased by the after-hours surcharge when the dispatch falls in the after_hours window or by the holiday
    surcharge when it falls in the holiday window; the holiday surcharge replaces the after-hours surcharge and
    the two never stack. The service call fee is not charged when the crew's recorded arrival time exceeds the arrival
    commitment of the job's tier. The service call fee is also not charged when, on the dispatch date, the customer
    holds a Commercial & Property Manager Service Agreement in active status whose tier carries the service call
    fee waiver entitlement of that charter. A waived service call is simply not booked; a waiver never creates a
    negative line, and the two waivers do not combine into any further credit. Amounts are rounded to the cent,
    half up.
  eligibility:
  - id: call_state
    applies_to:
    - water_service_call_charge
    kind: state
    condition: The job must be in dispatched, authorized or drying status when a service call is charged.
    evidence_fields:
    - water_jobs.status
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - dispatched
      - authorized
      - drying
  - id: late_arrival_waiver
    applies_to:
    - water_service_call_charge
    kind: caller_fact
    condition: The service call fee is not charged when the crew's recorded arrival time exceeds the arrival commitment
      of the job's tier.
    evidence_fields:
    - water_jobs.onsite_arrival_minutes
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
  params:
    per_tier:
      Clean Water Mitigation - Standard Loss:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
      Clean Water Mitigation - Large Loss:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
      Gray Water Mitigation - Standard Loss:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
      Gray Water Mitigation - Large Loss:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
      Black Water Mitigation - Standard Loss:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
      Black Water Mitigation - Large Loss:
        emergency_service_call_fee: =emergency_service_call_fee
        response_commitment_minutes: =response_commitment_minutes
  formula:
    amount: round(emergency_service_call_fee * (1 + ((rate_window == 'after_hours') * after_hours_surcharge_pct
      + (rate_window == 'holiday') * holiday_surcharge_pct) / 100), 2)
- id: water_evt_equipment_days
  subject:
  - water_equipment_day_charge
  rule: The job must be in drying or drying_complete status when an equipment day is charged. Drying equipment is
    billed per unit per calendar day at the daily rate of the job's tier for that equipment type; a calendar day
    is billable when the unit was on site and running at any time that day, so the equipment set day and the removal
    day each count as a full day. One line is booked per equipment type per calendar day, with the quantity equal
    to the units of that type running that day. The first calendar days of equipment, up to the tier's billable
    drying day cap counted from the drying start date, are billable without further support. A calendar day beyond
    the cap is billable only when a monitoring visit is recorded on the job for that same calendar day; a day beyond
    the cap with no monitoring visit is not billed for any equipment type. On tiers that require an air scrubber,
    the air scrubber runs for the whole drying period and is billed on every billable day. Equipment days after
    the drying complete date are never billed.
  eligibility:
  - id: equipment_state
    applies_to:
    - water_equipment_day_charge
    kind: state
    condition: The job must be in drying or drying_complete status when an equipment day is charged.
    evidence_fields:
    - water_jobs.status
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - drying
      - drying_complete
  params:
    per_tier:
      Clean Water Mitigation - Standard Loss:
        billable_drying_day_cap: =billable_drying_day_cap
        air_scrubber_required: =air_scrubber_required
        drying_extension_requires_monitoring: =drying_extension_requires_monitoring
      Clean Water Mitigation - Large Loss:
        billable_drying_day_cap: =billable_drying_day_cap
        air_scrubber_required: =air_scrubber_required
        drying_extension_requires_monitoring: =drying_extension_requires_monitoring
      Gray Water Mitigation - Standard Loss:
        billable_drying_day_cap: =billable_drying_day_cap
        air_scrubber_required: =air_scrubber_required
        drying_extension_requires_monitoring: =drying_extension_requires_monitoring
      Gray Water Mitigation - Large Loss:
        billable_drying_day_cap: =billable_drying_day_cap
        air_scrubber_required: =air_scrubber_required
        drying_extension_requires_monitoring: =drying_extension_requires_monitoring
      Black Water Mitigation - Standard Loss:
        billable_drying_day_cap: =billable_drying_day_cap
        air_scrubber_required: =air_scrubber_required
        drying_extension_requires_monitoring: =drying_extension_requires_monitoring
      Black Water Mitigation - Large Loss:
        billable_drying_day_cap: =billable_drying_day_cap
        air_scrubber_required: =air_scrubber_required
        drying_extension_requires_monitoring: =drying_extension_requires_monitoring
    equipment_daily_rates:
      air_mover: =air_mover_daily_rate
      lgr_dehumidifier: =lgr_dehumidifier_daily_rate
      xl_dehumidifier: =xl_dehumidifier_daily_rate
      desiccant_dehumidifier: =desiccant_dehumidifier_daily_rate
      air_scrubber: =air_scrubber_daily_rate
      drying_mat_system: =drying_mat_system_daily_rate
      heat_drying_unit: =heat_drying_unit_daily_rate
  formula:
    amount: round(quantity * unit_rate, 2)
  measures:
  - water_msr_billed_drying_days
- id: water_evt_mitigation_services
  subject:
  - water_mitigation_service_charge
  rule: 'The job must be in authorized, drying or drying_complete status when a mitigation service line is charged.
    Each mitigation service is billed at the unit rate of the job''s tier for its service code, multiplied by the
    quantity performed: extraction, antimicrobial, pad and carpet work and HEPA vacuuming by the square foot, flood
    cuts and baseboard by the linear foot, contents manipulation by the room, debris by the load, PPE by the technician-day,
    labor by the hour, and moisture mapping, thermal imaging, containment, dumpster, lead-safe setup and asbestos
    sampling by the each. Moisture mapping and thermal imaging are billed at most once per job. Antimicrobial is
    billed only on tiers where antimicrobial treatment is required, and PPE only on tiers where PPE is billable.
    Carpet that may be salvaged on the job''s tier is billed as detach and reset, and carpet that may not be salvaged
    is billed as carpet removal; carpet detach and reset and carpet removal are mutually exclusive for the same
    area. Carpet pad is billed as pad removal only on tiers where pad salvage is not allowed. Technician and supervisor
    labor performed in the after_hours or holiday window is billed at the hourly rate times the after-hours labor
    multiplier, and that adjusted rate is the line''s unit rate. Amounts are rounded to the cent, half up.'
  eligibility:
  - id: service_state
    applies_to:
    - water_mitigation_service_charge
    kind: state
    condition: The job must be in authorized, drying or drying_complete status when a mitigation service line is
      charged.
    evidence_fields:
    - water_jobs.status
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - authorized
      - drying
      - drying_complete
  params:
    per_tier:
      Clean Water Mitigation - Standard Loss:
        antimicrobial_required: =antimicrobial_required
        ppe_billable: =ppe_billable
        carpet_salvage_allowed: =carpet_salvage_allowed
        carpet_pad_salvage_allowed: =carpet_pad_salvage_allowed
        after_hours_labor_multiplier: =after_hours_labor_multiplier
      Clean Water Mitigation - Large Loss:
        antimicrobial_required: =antimicrobial_required
        ppe_billable: =ppe_billable
        carpet_salvage_allowed: =carpet_salvage_allowed
        carpet_pad_salvage_allowed: =carpet_pad_salvage_allowed
        after_hours_labor_multiplier: =after_hours_labor_multiplier
      Gray Water Mitigation - Standard Loss:
        antimicrobial_required: =antimicrobial_required
        ppe_billable: =ppe_billable
        carpet_salvage_allowed: =carpet_salvage_allowed
        carpet_pad_salvage_allowed: =carpet_pad_salvage_allowed
        after_hours_labor_multiplier: =after_hours_labor_multiplier
      Gray Water Mitigation - Large Loss:
        antimicrobial_required: =antimicrobial_required
        ppe_billable: =ppe_billable
        carpet_salvage_allowed: =carpet_salvage_allowed
        carpet_pad_salvage_allowed: =carpet_pad_salvage_allowed
        after_hours_labor_multiplier: =after_hours_labor_multiplier
      Black Water Mitigation - Standard Loss:
        antimicrobial_required: =antimicrobial_required
        ppe_billable: =ppe_billable
        carpet_salvage_allowed: =carpet_salvage_allowed
        carpet_pad_salvage_allowed: =carpet_pad_salvage_allowed
        after_hours_labor_multiplier: =after_hours_labor_multiplier
      Black Water Mitigation - Large Loss:
        antimicrobial_required: =antimicrobial_required
        ppe_billable: =ppe_billable
        carpet_salvage_allowed: =carpet_salvage_allowed
        carpet_pad_salvage_allowed: =carpet_pad_salvage_allowed
        after_hours_labor_multiplier: =after_hours_labor_multiplier
    service_unit_rates:
      moisture_mapping: =moisture_mapping_fee
      thermal_imaging: =thermal_imaging_fee
      extraction: =extraction_rate_per_sqft
      antimicrobial: =antimicrobial_rate_per_sqft
      flood_cut: =flood_cut_rate_per_lf
      baseboard_removal: =baseboard_removal_rate_per_lf
      pad_removal: =pad_removal_rate_per_sqft
      carpet_removal: =carpet_removal_rate_per_sqft
      carpet_detach_reset: =carpet_detach_reset_rate_per_sqft
      containment_setup: =containment_setup_fee
      ppe: =ppe_rate_per_tech_day
      hepa_vacuum: =hepa_vacuum_rate_per_sqft
      contents_manipulation: =contents_manipulation_rate_per_room
      debris_haul: =debris_haul_fee_per_load
      dumpster: =dumpster_fee
      technician_labor: =technician_hourly_rate
      supervisor_labor: =supervisor_hourly_rate
      lead_safe_setup: =lead_safe_setup_fee
      asbestos_sampling: =asbestos_sampling_fee
  formula:
    amount: round(quantity * unit_rate, 2)
- id: water_regulated_materials
  subject:
  - water_mitigation_service_charge
  rule: Lead-safe setup is billable only when the building was built before the RRP year-built cutoff and the work
    disturbs more interior painted surface in a room than the RRP interior threshold. This follows the EPA Renovation,
    Repair and Painting Rule, which applies lead-safe work practices to pre-1978 housing and child-occupied facilities
    when painted surfaces are disturbed beyond its minor repair and maintenance threshold, and lead-safe work is
    performed only by the company's EPA-certified renovators. Asbestos sampling is billable only when the building
    was built before the asbestos sampling year cutoff. Under company policy such a building is sampled before any
    flood cut, drywall or texture tear-out, and no flood cut line may be billed on that job with a service date
    earlier than the asbestos sampling line. Lead-safe setup and asbestos sampling are each billed once per job.
  eligibility:
  - id: rrp_year
    applies_to:
    - water_mitigation_service_charge
    kind: caller_fact
    condition: Lead-safe setup is billable only when the building was built before the RRP year-built cutoff and
      the work disturbs more interior painted surface in a room than the RRP interior threshold.
    evidence_fields:
    - water_jobs.year_built
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
  - id: asbestos_year
    applies_to:
    - water_mitigation_service_charge
    kind: caller_fact
    condition: Asbestos sampling is billable only when the building was built before the asbestos sampling year
      cutoff.
    evidence_fields:
    - water_jobs.year_built
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
  params:
    per_tier:
      Clean Water Mitigation - Standard Loss:
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        rrp_interior_threshold_sqft: =rrp_interior_threshold_sqft
        lead_safe_setup_fee: =lead_safe_setup_fee
        asbestos_sampling_fee: =asbestos_sampling_fee
      Clean Water Mitigation - Large Loss:
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        rrp_interior_threshold_sqft: =rrp_interior_threshold_sqft
        lead_safe_setup_fee: =lead_safe_setup_fee
        asbestos_sampling_fee: =asbestos_sampling_fee
      Gray Water Mitigation - Standard Loss:
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        rrp_interior_threshold_sqft: =rrp_interior_threshold_sqft
        lead_safe_setup_fee: =lead_safe_setup_fee
        asbestos_sampling_fee: =asbestos_sampling_fee
      Gray Water Mitigation - Large Loss:
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        rrp_interior_threshold_sqft: =rrp_interior_threshold_sqft
        lead_safe_setup_fee: =lead_safe_setup_fee
        asbestos_sampling_fee: =asbestos_sampling_fee
      Black Water Mitigation - Standard Loss:
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        rrp_interior_threshold_sqft: =rrp_interior_threshold_sqft
        lead_safe_setup_fee: =lead_safe_setup_fee
        asbestos_sampling_fee: =asbestos_sampling_fee
      Black Water Mitigation - Large Loss:
        rrp_year_built_cutoff: =rrp_year_built_cutoff
        asbestos_sampling_year_cutoff: =asbestos_sampling_year_cutoff
        rrp_interior_threshold_sqft: =rrp_interior_threshold_sqft
        lead_safe_setup_fee: =lead_safe_setup_fee
        asbestos_sampling_fee: =asbestos_sampling_fee
- id: water_evt_monitoring
  subject:
  - water_monitoring_visit_charge
  rule: The job must be in drying status when a monitoring visit is charged. Each day a technician takes and logs
    moisture readings on site is a monitoring visit day billed at the monitoring visit fee of the job's tier. At
    most one monitoring visit is charged per job per calendar day. On tiers where the set-day monitoring fee is
    waived, a visit on the drying start date is not charged because the set-day readings are covered by moisture
    mapping. A monitoring visit day is also what supports billing an equipment day beyond the billable drying day
    cap.
  eligibility:
  - id: monitoring_state
    applies_to:
    - water_monitoring_visit_charge
    kind: state
    condition: The job must be in drying status when a monitoring visit is charged.
    evidence_fields:
    - water_jobs.status
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - drying
  - id: one_visit_per_day
    applies_to:
    - water_monitoring_visit_charge
    kind: dedup
    condition: At most one monitoring visit is charged per job per calendar day.
    evidence_fields:
