        - water_charges.service_date
      action_bindings:
        water_charges.water_job_id: water_job_id
        water_charges.service_date: service_date
    dedup_contract:
      table: water_charges
      mode: separate_record
      object_bindings:
        water_job_id: water_job_id
        service_date: service_date
      duplicate_filters:
        event_type:
        - water_monitoring_visit_charge
      distinct_fields: []
  params:
    per_tier:
      Clean Water Mitigation - Standard Loss:
        monitoring_visit_fee: =monitoring_visit_fee
        monitoring_fee_waived_on_set_day: =monitoring_fee_waived_on_set_day
        max_monitoring_visits_per_day: =max_monitoring_visits_per_day
      Clean Water Mitigation - Large Loss:
        monitoring_visit_fee: =monitoring_visit_fee
        monitoring_fee_waived_on_set_day: =monitoring_fee_waived_on_set_day
        max_monitoring_visits_per_day: =max_monitoring_visits_per_day
      Gray Water Mitigation - Standard Loss:
        monitoring_visit_fee: =monitoring_visit_fee
        monitoring_fee_waived_on_set_day: =monitoring_fee_waived_on_set_day
        max_monitoring_visits_per_day: =max_monitoring_visits_per_day
      Gray Water Mitigation - Large Loss:
        monitoring_visit_fee: =monitoring_visit_fee
        monitoring_fee_waived_on_set_day: =monitoring_fee_waived_on_set_day
        max_monitoring_visits_per_day: =max_monitoring_visits_per_day
      Black Water Mitigation - Standard Loss:
        monitoring_visit_fee: =monitoring_visit_fee
        monitoring_fee_waived_on_set_day: =monitoring_fee_waived_on_set_day
        max_monitoring_visits_per_day: =max_monitoring_visits_per_day
      Black Water Mitigation - Large Loss:
        monitoring_visit_fee: =monitoring_visit_fee
        monitoring_fee_waived_on_set_day: =monitoring_fee_waived_on_set_day
        max_monitoring_visits_per_day: =max_monitoring_visits_per_day
  formula:
