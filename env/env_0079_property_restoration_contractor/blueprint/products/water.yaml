    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - drying_complete
  params:
    per_tier:
      Clean Water Mitigation - Standard Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Clean Water Mitigation - Large Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Gray Water Mitigation - Standard Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Gray Water Mitigation - Large Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Black Water Mitigation - Standard Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
      Black Water Mitigation - Large Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
        payment_terms_days_insurance: =payment_terms_days_insurance
- id: water_evt_customer_payment
  subject:
  - water_customer_payment
  - water_card_surcharge
  rule: The job must not be closed when a customer payment is posted. Customer payments are accepted by credit card,
    debit card, ACH or check and are posted in full to the one job they name. A payment made by credit card carries
    a surcharge of the credit card surcharge percentage of the payment amount, booked as its own line against that
    payment and rounded to the cent, half up; debit card, ACH and check payments carry no surcharge, and insurance
    proceeds are never surcharged. A payment larger than the balance creates a credit balance that is refunded,
    never applied to another job.
  eligibility:
  - id: pay_state
    applies_to:
    - water_customer_payment
    - water_card_surcharge
    kind: state
    condition: The job must not be closed when a customer payment is posted.
    evidence_fields:
    - water_jobs.status
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - dispatched
      - authorized
      - drying
      - drying_complete
      - invoiced
      - cancelled
  params:
    per_tier:
      Clean Water Mitigation - Standard Loss:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
      Clean Water Mitigation - Large Loss:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
      Gray Water Mitigation - Standard Loss:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
      Gray Water Mitigation - Large Loss:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
      Black Water Mitigation - Standard Loss:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
      Black Water Mitigation - Large Loss:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
  formula:
    when: payment_method == 'credit_card'
    amount: round(amount * credit_card_surcharge_pct / 100, 2)
- id: water_evt_insurance_payment
  subject:
  - water_insurance_payment
  rule: The job must be in authorized, drying, drying_complete or invoiced status when insurance proceeds are posted.
    The carrier payment must be recorded on the same claim file this job is linked to. Only dwelling-coverage carrier
    payments that reached the company, by direct payment or by a two-party check the customer has endorsed, are
    posted to a water job; payments routed to a mortgagee loss-draft account reach the company only through rebuild
    draws and are never posted here, and contents-coverage payments belong to contents jobs. A carrier payment is
    posted to the same water job at most once. The amount posted is the lesser of the job's balance due at posting
    and the carrier payment's unapplied remainder, where the unapplied remainder is the carrier payment amount less
    every posting already made from that same carrier payment to any water, fire, mold or rebuild job; when one
    carrier payment must cover several jobs, the order in which they are paid follows the claim payment allocation
    rule of the Insurance Claim Services charter.
  eligibility:
  - id: ins_state
    applies_to:
    - water_insurance_payment
    kind: state
    condition: The job must be in authorized, drying, drying_complete or invoiced status when insurance proceeds
      are posted.
    evidence_fields:
    - water_jobs.status
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - authorized
      - drying
      - drying_complete
      - invoiced
  - id: same_claim_file
    applies_to:
    - water_insurance_payment
    kind: authorization
    condition: The carrier payment must be recorded on the same claim file this job is linked to.
    evidence_fields:
    - water_jobs.claim_file_id
    - claims_payments.claim_file_id
    - claims_payments.claim_payment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_payments.claim_payment_id
      action_bindings:
        claims_payments.claim_payment_id: claim_payment_id
  - id: post_once
    applies_to:
    - water_insurance_payment
    kind: dedup
    condition: A carrier payment is posted to the same water job at most once.
    evidence_fields:
    - water_payments.water_job_id
    - water_payments.claim_payment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_payments.water_job_id
        - water_payments.claim_payment_id
      action_bindings:
        water_payments.water_job_id: water_job_id
        water_payments.claim_payment_id: claim_payment_id
    dedup_contract:
      table: water_payments
      mode: separate_record
      object_bindings:
        water_job_id: water_job_id
        claim_payment_id: claim_payment_id
      duplicate_filters:
        event_type:
        - water_insurance_payment
      distinct_fields: []
- id: water_evt_adjustment
  subject:
  - water_adjustment_credit
  rule: The job must be in drying_complete or invoiced status when an adjustment credit is posted. A billing_error
    credit equals the difference between the amount charged on the line and the amount the tier's rate and the recorded
    quantity produce; a duplicate_line credit equals the full amount of a line that repeats another line of the
    same code, date and quantity. A billing_error or duplicate_line credit may be posted only when the customer
    raises the dispute no later than the dispute window after the final invoice was issued on this job. The dispute
    window is counted in calendar days starting the day after the job's invoiced_date, and a dispute raised on the
    last day of the window is in time; on a job not yet invoiced the window has not started and the dispute is always
    in time. Goodwill credits on one job may not exceed the tier's goodwill credit cap in total. A goodwill request
    above the remaining cap is not credited by the desk and is handed to a human representative as not covered by
    policy. Each charge line takes at most one adjustment credit, so a line credited for one reason cannot be credited
    again for another, and late fees are never relieved as goodwill while the underlying balance is still unpaid.
  eligibility:
  - id: adj_state
    applies_to:
    - water_adjustment_credit
    kind: state
    condition: The job must be in drying_complete or invoiced status when an adjustment credit is posted.
    evidence_fields:
    - water_jobs.status
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - drying_complete
      - invoiced
  - id: dispute_window
    applies_to:
    - water_adjustment_credit
    kind: time
    condition: A billing_error or duplicate_line credit may be posted only when the customer raises the dispute
      no later than the dispute window after the final invoice was issued on this job.
    evidence_fields:
    - water_jobs.invoiced_date
    - water_charges.water_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_charges.water_charge_id
      action_bindings:
        water_charges.water_charge_id: source_charge_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the final invoice was issued on this job
      anchor_source: water_jobs.invoiced_date
      relation: not_after
      duration_source: variants.adjustment_dispute_window_days
      unit: calendar_days
      counting_rule: The dispute window is counted in calendar days starting the day after the job's invoiced_date,
        and a dispute raised on the last day of the window is in time; on a job not yet invoiced the window has
        not started and the dispute is always in time.
      boundary: inclusive
  - id: goodwill_cap
    applies_to:
    - water_adjustment_credit
    kind: caller_fact
    condition: Goodwill credits on one job may not exceed the tier's goodwill credit cap in total.
    evidence_fields:
    - water_payments.adjustment_reason
    - water_payments.amount
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
  params:
    per_tier:
      Clean Water Mitigation - Standard Loss:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Clean Water Mitigation - Large Loss:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Gray Water Mitigation - Standard Loss:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Gray Water Mitigation - Large Loss:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Black Water Mitigation - Standard Loss:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
      Black Water Mitigation - Large Loss:
        goodwill_credit_cap: =goodwill_credit_cap
        adjustment_dispute_window_days: =adjustment_dispute_window_days
  measures:
  - water_msr_goodwill_credited
- id: water_evt_late_fee
  subject:
  - water_late_fee
  rule: The job must be in invoiced status when a late fee is charged. A late fee may post only after the grace
    period following the payment due date recorded at invoicing has fully passed. The grace period is counted in
    calendar days starting the day after the payment_due_date, and the first late fee may post on the day after
    the grace period's last day. A late fee is assessed at most once per calendar month fee period, at the late
    fee percentage of the balance due at assessment, with the late fee minimum as a floor, rounded to the cent,
    half up. No late fee posts on an insurance_claim job while its linked claim file is in opened, estimate_submitted
    or approved status and the suspension period counted from the invoice date has not ended. Once that suspension
    period ends, or the claim file is settled, denied, withdrawn or closed, late fees resume for the fee periods
    that follow; no late fee is ever back-dated to a suspended period. A job whose balance due is zero or negative
    is never charged a late fee.
  eligibility:
  - id: lf_state
    applies_to:
    - water_late_fee
    kind: state
    condition: The job must be in invoiced status when a late fee is charged.
    evidence_fields:
    - water_jobs.status
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - invoiced
  - id: lf_grace
    applies_to:
    - water_late_fee
    kind: time
    condition: A late fee may post only after the grace period following the payment due date recorded at invoicing
      has fully passed.
    evidence_fields:
    - water_jobs.payment_due_date
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the payment due date recorded at invoicing
      anchor_source: water_jobs.payment_due_date
      relation: not_before
      duration_source: variants.late_fee_grace_days
      unit: calendar_days
      counting_rule: The grace period is counted in calendar days starting the day after the payment_due_date, and
        the first late fee may post on the day after the grace period's last day.
      boundary: exclusive
  - id: lf_claim_suspension
    applies_to:
    - water_late_fee
    kind: caller_fact
    condition: No late fee posts on an insurance_claim job while its linked claim file is in opened, estimate_submitted
      or approved status and the suspension period counted from the invoice date has not ended.
    evidence_fields:
    - water_jobs.funding_source
    - water_jobs.claim_file_id
    - claims_files.status
    - water_jobs.invoiced_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.claim_file_id
      action_bindings:
        water_jobs.claim_file_id: claim_file_id
  params:
    per_tier:
      Clean Water Mitigation - Standard Loss:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Clean Water Mitigation - Large Loss:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Gray Water Mitigation - Standard Loss:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Gray Water Mitigation - Large Loss:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Black Water Mitigation - Standard Loss:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Black Water Mitigation - Large Loss:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
  formula:
    amount: max(late_fee_minimum, round(balance_due * late_fee_pct_monthly / 100, 2))
- id: water_evt_refund
  subject:
  - water_refund
  rule: The job must be in invoiced or cancelled status when a refund is issued. A refund may be issued only while
    the job's balance due is negative. The refund equals the credit balance, but never more than the amount of the
    customer payment it is returned from, and goes back to that payment's original tender; when the credit balance
    exceeds the latest customer payment, the remainder is refunded from the next most recent customer payment. A
    credit balance created by insurance proceeds is not refunded to the customer by the desk and is handed to a
    human representative as not covered by policy, because carrier overpayments are returned to the carrier. The
