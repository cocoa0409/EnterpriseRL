        disposal_haul_fee_per_load: =disposal_haul_fee_per_load
        disposal_authorization_required: =disposal_authorization_required
      In-Plant Contents Cleaning:
        box_medium_rate: =box_medium_rate
        high_value_inventory_item_rate: =high_value_inventory_item_rate
        onsite_block_pad_rate_per_room: =onsite_block_pad_rate_per_room
        inventory_report_fee: =inventory_report_fee
        deodorization_requires_smoke_loss: =deodorization_requires_smoke_loss
