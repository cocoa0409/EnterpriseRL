        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
  formula:
    amount: max(late_fee_minimum, round(balance_due * late_fee_pct_monthly / 100, 2))
extended_policies:
- id: contents_ext_customer_vault_period
  base_policy_refs:
  - contents_evt_storage
  - contents_signing_and_custody
  - contents_return
  - contents_evt_packout_and_cleaning
  overwrite:
  - base_policy: contents_evt_storage
    superseded_clause: >-
      each period billed in full on its first day at the vault rate times the vault count in force that day
    replaced_by: >-
      For a vault storage line this policy prices, and only for such a line, the amount is figured as stated here; every other
      vault storage line is still billed in full on its period's first day at the vault rate times the vault count in force
      that day, rounded to the cent, half up.
  - base_policy: contents_signing_and_custody
    superseded_clause: the vault count in force on the first day of a storage period is the count billed for that period.
    replaced_by: >-
      For a vault storage line this policy prices, and only for such a line, the number of vaults charged follows the disposal
      and packing records as stated here; for every other storage line the vault count in force on the first day of a storage
      period is still the count billed for that period.
  - base_policy: contents_return
    superseded_clause: storage stops accruing with the storage period in which the contents are returned
    replaced_by: >-
      For a vault storage line this policy prices, and only for such a line, the period in which the scheduled return falls
      is charged for the fraction stated here; a declared-value coverage line that the declared-value coverage rule prices
      remains under that rule, and every other storage line, including every other declared-value coverage line, still stops
      accruing with the storage period in which the contents are returned, billed in full, and no period starting after the
      returned date is billed.
  trigger: state_due
  subject:
  - contents_storage_charge
  computes: amount
  target_tool: charge_customer_vault_storage_2f9c3128
  params:
    black_water_lining_pct: 12.0
    gray_water_lining_pct: 6.0
    florida_facility_factor: 1.15
    louisiana_facility_factor: 1.08
    secured_section_threshold: 20000.0
    secured_add_high: 22.0
    secured_add_low: 12.0
    racking_volume_threshold: 4
    racking_rate_volume: 14.0
    racking_rate_standard: 18.5
    half_period_days: 15
    rounding_epsilon: 1.0e-09
  rule: |
    This policy prices the vault storage line of a storage period billed to the customer on a Partial Contents Packout or Full Contents Packout job, and only such a line: a period is billed to the customer when the job is self-pay or when the period's first day falls after the approved storage end date on the linked claim file. Every other storage line, including every period billed to insurance_claim and every climate vault, oversized item and declared-value coverage line, remains under the base storage rule. The line is charged while its period runs, and the period being billed is the storage period, counted in whole periods of the tier's period length from the custody start date, that contains the day the line is charged. The standard vault storage line for such a period is the vault count recorded on the job times the tier's vault rate for the full period, rounded to the cent, half up. The vaults charged for the period follow the job's disposal and packing records: when a disposal haul line stands on the job and the job's signed disposal authorizations list at least one item, the vaults charged are found by taking the boxes packed less the items listed on signed disposal authorizations, each listed item counting as one packed box, dividing that difference by the tier's vault capacity and rounding up to a whole vault, never fewer than one vault; when no disposal haul line stands on the job and the vault count recorded on the job is greater than the boxes packed divided by the tier's vault capacity and rounded up to a whole vault, the vaults charged are that rounded-up figure; in every other case the vaults charged are the vault count recorded on the job. Contents from a contaminated water loss are kept in lined vaults: when the job's linked mitigation job is a company water job assessed category_3, the tier's vault rate carries the black-water lining percentage; when that water job is assessed category_2, the tier's vault rate carries the gray-water lining percentage; when the linked mitigation job is a water job assessed category_1, is not a water job, or there is none, no lining percentage applies. Vault storage follows the company's facility schedule by the policy state on the job's linked claim file: a policy state of FL carries the Florida facility factor, a policy state of LA carries the Louisiana facility factor, and any other policy state, or a job with no linked claim file, carries a facility factor of one. Jobs carrying declared-value coverage are kept in the secured section: when the largest declared value shown on the job's declared-value coverage lines is at least the secured-section threshold, each vault charged carries the high secured-section add; when that declared value is above zero but below the secured-section threshold, each vault charged carries the low secured-section add; a job with no declared-value coverage line carries no secured-section add. Crated art, mirrors and glass are kept on vault racking charged per crate for the period: when the crate quantities on the job's packout lines total at least the racking volume threshold, each crate is charged the volume racking rate; when they total at least one crate but fewer than the racking volume threshold, each crate is charged the standard racking rate; a job with no crate on its packout lines carries no racking. The fraction of the vault storage period charged follows the scheduled return, the days being counted from the period's first day through the scheduled return date with both of those days counted: when the job is in return_scheduled status, its scheduled return date falls inside the period being billed and those days number at least the half-period days, the fraction is those days divided by the tier's period length; when the job is in return_scheduled status, its scheduled return date falls inside the period being billed and those days number fewer than the half-period days, the fraction is the half-period days divided by the tier's period length; in every other case, including a job with no scheduled return date, the fraction is one. For a vault storage line this policy prices, and only for such a line, the amount is figured as stated here; every other vault storage line is still billed in full on its period's first day at the vault rate times the vault count in force that day, rounded to the cent, half up. The amounts are combined in one order: the rate per vault is the tier's vault rate with any percentage applied first, then any factor multiplying that result, then any add per vault; that rate per vault is multiplied by the number of vaults; any amount figured per item is added to that product; the resulting sum is multiplied by the fraction of the period, and that figure is rounded once to the cent, half up, as the line amount. For a vault storage line this policy prices, and only for such a line, the number of vaults charged follows the disposal and packing records as stated here; for every other storage line the vault count in force on the first day of a storage period is still the count billed for that period. For a vault storage line this policy prices, and only for such a line, the period in which the scheduled return falls is charged for the fraction stated here; a declared-value coverage line that the declared-value coverage rule prices remains under that rule, and every other storage line, including every other declared-value coverage line, still stops accruing with the storage period in which the contents are returned, billed in full, and no period starting after the returned date is billed. The line is billed to customer.
  prerequisite: []
  cross_category:
  - category: water
    as: branch
    reads:
    - water_category
    note: >-
      The lining factor's tier is the category assessed on the company water job linked to the contents job.
  - category: claims
    as: branch
    reads:
    - policy_state
    note: The facility factor's tier is the policy state on the linked claim file.
  compute:
  - period_days: P('storage_period_days')
  - vault_rate: P('vault_monthly_rate')
  - capacity: P('vault_capacity_boxes')
  - recorded_vaults: F('vault_count')
  - boxes_packed: F('box_count')
  - haul_lines: COUNT('contents_charges', charge_code='disposal_haul')
  - signed_listed: SUM('contents_disposal_authorizations', 'item_count', authorization_status='signed')
  - capacity_vaults: -((-boxes_packed) // capacity)
  - vaults_billed: >-
      MX(1, -((-(boxes_packed - signed_listed)) // capacity)) if (haul_lines >= 1 and signed_listed > 0) else (capacity_vaults
      if (haul_lines == 0 and recorded_vaults > capacity_vaults) else recorded_vaults)
  - water_category: CFIELD('water', 'water_category', water_job_id=F('mitigation_job_id'))
  - lining_pct: >-
      K('black_water_lining_pct') if water_category == 'category_3' else (K('gray_water_lining_pct') if water_category ==
      'category_2' else 0)
  - policy_state: CFIELD('claims', 'policy_state', claim_file_id=F('claim_file_id'))
  - facility_factor: >-
      K('florida_facility_factor') if policy_state == 'FL' else (K('louisiana_facility_factor') if policy_state == 'LA' else
      1)
  - declared_shown: MAX('contents_charges', 'quantity', charge_code='valuation_coverage')
  - secured_add: >-
      K('secured_add_high') if declared_shown >= K('secured_section_threshold') else (K('secured_add_low') if declared_shown
      > 0 else 0)
  - crates_packed: SUM('contents_charges', 'quantity', charge_code='crate')
  - racking_charge: >-
      crates_packed * K('racking_rate_volume') if crates_packed >= K('racking_volume_threshold') else (crates_packed * K('racking_rate_standard')
      if crates_packed >= 1 else 0)
  - return_date: F('return_scheduled_date')
  - today_index: DAYS(F('custody_start_date'), NOW) // period_days
  - return_offset: DAYS(F('custody_start_date'), return_date) if return_date else -1
  - return_in_period: >-
      F('status') == 'return_scheduled' and return_offset >= 0 and return_offset // period_days == today_index
  - days_to_return: return_offset % period_days + 1 if return_offset >= 0 else 0
  - period_share: >-
      days_to_return / period_days if (return_in_period and days_to_return >= K('half_period_days')) else (K('half_period_days')
      / period_days if (return_in_period and days_to_return < K('half_period_days')) else 1)
  - per_vault_rate: vault_rate * (1 + lining_pct / 100) * facility_factor + secured_add
  - full_period_amount: per_vault_rate * vaults_billed + racking_charge
  - result: RND(full_period_amount * period_share + K('rounding_epsilon'), 2)
  compute_basis:
    period_days: >-
