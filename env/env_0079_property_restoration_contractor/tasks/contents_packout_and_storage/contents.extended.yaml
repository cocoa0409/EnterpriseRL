    amount charged on the line less the amount the tier's rate and the recorded quantity produce, including a storage period
    billed to the wrong party or after the returned date, which is credited in full; a duplicate_line credit equals the full
    amount of a line repeating another of the same code and date or period. A billing_error or duplicate_line credit may be
    posted only when the customer raises the dispute no later than the dispute window after the final invoice was issued on
    this job. The dispute window is counted in calendar days starting the day after the job's invoiced_date, and a dispute
    raised on the last day of the window is in time; on a job not yet invoiced the window has not started and the dispute
    is always in time. Goodwill credits on one job may not exceed the tier's goodwill credit cap in total. A goodwill request
    above the remaining cap is handed to a human representative as not covered by policy. Each charge line takes at most one
    adjustment credit.
