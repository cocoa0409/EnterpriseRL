- id: contents_evt_customer_payment
  subject:
  - contents_customer_payment
  - contents_card_surcharge
  - contents_refund
  rule: >-
    The job must not be closed when a customer payment is posted. Customer payments are accepted by credit card, debit card,
    ACH or check and are posted in full to the one job they name; a credit card payment carries a surcharge of the credit
    card surcharge percentage of the payment amount, booked as its own line and rounded to the cent, half up, and no other
    tender is surcharged. A refund is issued only while the job's balance due is negative, for the credit balance but never
    more than the customer payment it is returned from, to that payment's original tender, within the refund processing business
    days; a credit balance created by insurance proceeds is handed to a human representative as not covered by policy.
  eligibility:
  - id: py_state
    applies_to:
    - contents_customer_payment
    - contents_card_surcharge
    - contents_refund
    kind: state
    condition: The job must not be closed when a customer payment is posted.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - scheduled
      - authorized
      - in_custody
      - return_scheduled
      - returned
      - invoiced
      - cancelled
  params:
    per_tier:
      On-Site Contents Manipulation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      In-Plant Contents Cleaning:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Partial Contents Packout:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Full Contents Packout:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      High-Value Contents Packout:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Commercial Contents and Records Recovery:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
  formula:
    when: payment_method == 'credit_card'
    amount: round(amount * credit_card_surcharge_pct / 100, 2)
