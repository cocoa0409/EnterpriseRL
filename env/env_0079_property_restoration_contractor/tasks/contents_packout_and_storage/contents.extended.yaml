    electronics_value_rider_pct: 0.06
    electronics_item_rider: 1.75
    coverage_florida_factor: 1.12
    coverage_louisiana_factor: 1.06
    coverage_half_period_days: 15
    rounding_epsilon: 1.0e-09
  rule: |
    This policy prices the declared-value coverage line of every storage period on a Partial Contents Packout or Full Contents Packout job whose customer declared a value above zero at signing and whose boxes packed are recorded above zero, and only such a line; every other declared-value coverage line remains under the base storage rule, and the line is always billed to customer, because the coverage is the customer's own election. The coverage line is charged while its period runs, and the coverage period being billed is the storage period, counted in whole periods of the tier's period length from the custody start date, that contains the day the line is charged. The value covered is the declared value recorded on the job, except that items listed on signed disposal authorizations leave the coverage, because they are never compensated: when the job's signed disposal authorizations list at least one item, the value covered is found by taking the boxes packed less the items listed on signed disposal authorizations, each listed item counting as one packed box, dividing that difference by the boxes packed, and multiplying the declared value by that ratio. The standard declared-value coverage line for a period is the value covered times the tier's valuation percentage, divided by one hundred, for the full period, rounded to the cent, half up. Coverage on contents from a contaminated water loss carries a loading: when the job's linked mitigation job is a company water job assessed category_3, the black-water coverage loading is added to the valuation percentage; when that water job is assessed category_2, the gray-water coverage loading is added; when the linked mitigation job is a water job assessed category_1, is not a water job, or there is none, no loading is added. Crated art, mirrors and glass carry a coverage rider: when the crate quantities on the job's packout lines total at least the crate rider threshold, the large crate rider is added to the valuation percentage; when they total at least one crate but fewer than the crate rider threshold, the small crate rider is added; a job with no crate on its packout lines carries no crate rider. Furniture carries a coverage rider: when the furniture item quantities on the job's packout lines total at least the furniture rider threshold, the large furniture rider is added to the valuation percentage; when they total at least one item but fewer than the furniture rider threshold, the small furniture rider is added; a job with no furniture item on its packout lines carries no furniture rider. Electronics are covered on their own schedule: when the electronics item quantities on the job's packout lines total at least the electronics rated threshold, the electronics coverage is the declared value times the electronics value rider percentage, divided by one hundred, never less than the per-item electronics rider times one item fewer than the electronics rated threshold; when they total at least one item but fewer than the electronics rated threshold, the electronics coverage is the number of electronics items times the per-item electronics rider; a job with no electronics item on its packout lines carries no electronics coverage. Coverage follows the company's coverage facility schedule by the policy state on the job's linked claim file: a policy state of FL carries the Florida coverage factor, a policy state of LA carries the Louisiana coverage factor, and any other policy state, or a job with no linked claim file, carries a coverage factor of one. The fraction of the coverage period charged follows the scheduled return, the days being counted from the coverage period's first day through the scheduled return date with both of those days counted: when the job is in return_scheduled status, its scheduled return date falls inside the coverage period being billed and those days number at least the coverage half-period days, the fraction is those days divided by the tier's period length; when the job is in return_scheduled status, its scheduled return date falls inside the coverage period being billed and those days number fewer than the coverage half-period days, the fraction is the coverage half-period days divided by the tier's period length; in every other case, including a job with no scheduled return date, the fraction is one. For a declared-value coverage line this policy prices, and only for such a line, the amount is figured as stated here; every declared-value coverage line this policy does not price is still billed each period at the tier's valuation percentage of the declared value, rounded to the cent, half up. The amounts are combined in one order: the coverage rate is the valuation percentage with every percentage added to it; the value covered is multiplied by that coverage rate and divided by one hundred; any amount figured per item or on the declared value is added to that product; the resulting sum is multiplied by any factor and then by the fraction of the period, and that figure is rounded once to the cent, half up, as the line amount. For a declared-value coverage line this policy prices, and only for such a line, the period in which the scheduled return falls is charged for the fraction stated here; a vault storage line that the customer vault storage rule prices remains under that rule, and every other storage line still stops accruing with the storage period in which the contents are returned, billed in full, and no period starting after the returned date is billed.
  prerequisite: []
  cross_category:
  - category: water
    as: branch
    reads:
    - water_category
    note: >-
      The coverage loading's tier is the category assessed on the company water job linked to the contents job.
  - category: claims
    as: branch
    reads:
    - policy_state
    note: The coverage facility factor's tier is the policy state on the linked claim file.
  compute:
  - period_days: P('storage_period_days')
  - valuation_pct: P('valuation_coverage_pct')
  - declared_value: F('declared_value')
  - boxes_packed: F('box_count')
  - signed_listed: SUM('contents_disposal_authorizations', 'item_count', authorization_status='signed')
  - value_covered: >-
      declared_value * ((boxes_packed - signed_listed) / boxes_packed) if (signed_listed > 0 and boxes_packed > 0) else declared_value
  - water_category: CFIELD('water', 'water_category', water_job_id=F('mitigation_job_id'))
  - coverage_loading: >-
      K('black_water_coverage_loading') if water_category == 'category_3' else (K('gray_water_coverage_loading') if water_category
      == 'category_2' else 0)
  - crates_packed: SUM('contents_charges', 'quantity', charge_code='crate')
  - crate_rider: >-
      K('crate_rider_large') if crates_packed >= K('crate_rider_threshold') else (K('crate_rider_small') if crates_packed
      >= 1 else 0)
  - furniture_packed: SUM('contents_charges', 'quantity', charge_code='furniture_item')
  - furniture_rider: >-
      K('furniture_rider_large') if furniture_packed >= K('furniture_rider_threshold') else (K('furniture_rider_small') if
      furniture_packed >= 1 else 0)
  - electronics_packed: SUM('contents_charges', 'quantity', charge_code='electronics_item')
  - electronics_coverage: >-
      MX(declared_value * K('electronics_value_rider_pct') / 100, (K('electronics_rated_threshold') - 1) * K('electronics_item_rider'))
      if electronics_packed >= K('electronics_rated_threshold') else (electronics_packed * K('electronics_item_rider') if
      electronics_packed >= 1 else 0)
  - policy_state: CFIELD('claims', 'policy_state', claim_file_id=F('claim_file_id'))
  - coverage_factor: >-
      K('coverage_florida_factor') if policy_state == 'FL' else (K('coverage_louisiana_factor') if policy_state == 'LA' else
      1)
  - return_date: F('return_scheduled_date')
  - today_index: DAYS(F('custody_start_date'), NOW) // period_days
  - return_offset: DAYS(F('custody_start_date'), return_date) if return_date else -1
  - return_in_period: >-
      F('status') == 'return_scheduled' and return_offset >= 0 and return_offset // period_days == today_index
  - days_to_return: return_offset % period_days + 1 if return_offset >= 0 else 0
  - coverage_share: >-
      days_to_return / period_days if (return_in_period and days_to_return >= K('coverage_half_period_days')) else (K('coverage_half_period_days')
      / period_days if (return_in_period and days_to_return < K('coverage_half_period_days')) else 1)
  - coverage_rate: valuation_pct + coverage_loading + crate_rider + furniture_rider
  - result: >-
      RND((value_covered * coverage_rate / 100 + electronics_coverage) * coverage_factor * coverage_share + K('rounding_epsilon'),
      2)
  compute_basis:
    period_days: >-
      the coverage period being billed is the storage period, counted in whole periods of the tier's period length from the
      custody start date, that contains the day the line is charged.
    valuation_pct: >-
      The standard declared-value coverage line for a period is the value covered times the tier's valuation percentage, divided
      by one hundred, for the full period, rounded to the cent, half up.
    declared_value: >-
      The value covered is the declared value recorded on the job, except that items listed on signed disposal authorizations
      leave the coverage, because they are never compensated
    signed_listed: when the job's signed disposal authorizations list at least one item
    value_covered: >-
      when the job's signed disposal authorizations list at least one item, the value covered is found by taking the boxes
      packed less the items listed on signed disposal authorizations, each listed item counting as one packed box, dividing
      that difference by the boxes packed, and multiplying the declared value by that ratio.
    water_category: when the job's linked mitigation job is a company water job assessed category_3
    coverage_loading: >-
      Coverage on contents from a contaminated water loss carries a loading: when the job's linked mitigation job is a company
      water job assessed category_3, the black-water coverage loading is added to the valuation percentage; when that water
      job is assessed category_2, the gray-water coverage loading is added; when the linked mitigation job is a water job
      assessed category_1, is not a water job, or there is none, no loading is added.
    crates_packed: when the crate quantities on the job's packout lines total at least the crate rider threshold
    crate_rider: >-
      Crated art, mirrors and glass carry a coverage rider: when the crate quantities on the job's packout lines total at
      least the crate rider threshold, the large crate rider is added to the valuation percentage; when they total at least
      one crate but fewer than the crate rider threshold, the small crate rider is added; a job with no crate on its packout
      lines carries no crate rider.
    furniture_packed: >-
      when the furniture item quantities on the job's packout lines total at least the furniture rider threshold
    furniture_rider: >-
      Furniture carries a coverage rider: when the furniture item quantities on the job's packout lines total at least the
      furniture rider threshold, the large furniture rider is added to the valuation percentage; when they total at least
      one item but fewer than the furniture rider threshold, the small furniture rider is added; a job with no furniture item
      on its packout lines carries no furniture rider.
    electronics_packed: >-
      when the electronics item quantities on the job's packout lines total at least the electronics rated threshold
    electronics_coverage: >-
      Electronics are covered on their own schedule: when the electronics item quantities on the job's packout lines total
      at least the electronics rated threshold, the electronics coverage is the declared value times the electronics value
      rider percentage, divided by one hundred, never less than the per-item electronics rider times one item fewer than the
      electronics rated threshold; when they total at least one item but fewer than the electronics rated threshold, the electronics
      coverage is the number of electronics items times the per-item electronics rider; a job with no electronics item on
      its packout lines carries no electronics coverage.
    policy_state: >-
      Coverage follows the company's coverage facility schedule by the policy state on the job's linked claim file
    coverage_factor: >-
      a policy state of FL carries the Florida coverage factor, a policy state of LA carries the Louisiana coverage factor,
      and any other policy state, or a job with no linked claim file, carries a coverage factor of one.
    today_index: >-
      the coverage period being billed is the storage period, counted in whole periods of the tier's period length from the
      custody start date, that contains the day the line is charged.
    return_offset: in every other case, including a job with no scheduled return date, the fraction is one.
    return_in_period: >-
      when the job is in return_scheduled status, its scheduled return date falls inside the coverage period being billed
    days_to_return: >-
      the days being counted from the coverage period's first day through the scheduled return date with both of those days
      counted
    coverage_share: >-
      The fraction of the coverage period charged follows the scheduled return, the days being counted from the coverage period's
      first day through the scheduled return date with both of those days counted: when the job is in return_scheduled status,
      its scheduled return date falls inside the coverage period being billed and those days number at least the coverage
      half-period days, the fraction is those days divided by the tier's period length; when the job is in return_scheduled
      status, its scheduled return date falls inside the coverage period being billed and those days number fewer than the
      coverage half-period days, the fraction is the coverage half-period days divided by the tier's period length; in every
      other case, including a job with no scheduled return date, the fraction is one.
    coverage_rate: the coverage rate is the valuation percentage with every percentage added to it
    result: >-
      the value covered is multiplied by that coverage rate and divided by one hundred; any amount figured per item or on
      the declared value is added to that product; the resulting sum is multiplied by any factor and then by the fraction
      of the period, and that figure is rounded once to the cent, half up, as the line amount.
  factors:
  - id: contaminated_coverage_loading
    effect: parameter
    decides: coverage_loading
    bindings:
    - water_category
    - coverage_loading
    ladder:
    - when: the linked mitigation job is a company water job assessed category_3
      value: K('black_water_coverage_loading')
    - when: the linked mitigation job is a company water job assessed category_2
      value: K('gray_water_coverage_loading')
    - when: otherwise (a category_1 water job, a job that is not a water job, or no linked mitigation job)
      value: '0'
    baseline:
      coverage_loading: '0'
    evidence:
    - cross_category
    cross_difficulty: water
  - id: crated_items_rider
    effect: parameter
    decides: crate_rider
    bindings:
    - crates_packed
    - crate_rider
    ladder:
    - when: the crate quantities on the job's packout lines total at least the crate rider threshold
      value: K('crate_rider_large')
    - when: they total at least one crate but fewer than the crate rider threshold
      value: K('crate_rider_small')
    - when: otherwise (no crate on the packout lines)
      value: '0'
    baseline:
      crate_rider: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: furniture_coverage_rider
    effect: parameter
    decides: furniture_rider
    bindings:
    - furniture_packed
    - furniture_rider
    ladder:
    - when: >-
        the furniture item quantities on the job's packout lines total at least the furniture rider threshold
      value: K('furniture_rider_large')
    - when: they total at least one item but fewer than the furniture rider threshold
      value: K('furniture_rider_small')
    - when: otherwise (no furniture item on the packout lines)
      value: '0'
    baseline:
      furniture_rider: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: electronics_coverage_schedule
    effect: method
    decides: electronics_coverage
    bindings:
    - electronics_packed
    - electronics_coverage
    ladder:
    - when: >-
        the electronics item quantities on the job's packout lines total at least the electronics rated threshold
      method: >-
        rated on value: the declared value times the electronics value rider percentage, divided by one hundred, never less
        than the per-item rider times one item fewer than the rated threshold
    - when: they total at least one item but fewer than the electronics rated threshold
      method: 'scheduled per item: the number of electronics items times the per-item electronics rider'
    - when: otherwise (no electronics item on the packout lines)
      method: no electronics coverage
    baseline:
      electronics_coverage: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: coverage_facility_schedule
    effect: parameter
    decides: coverage_factor
    bindings:
    - policy_state
    - coverage_factor
    ladder:
    - when: the policy state on the job's linked claim file is FL
      value: K('coverage_florida_factor')
    - when: the policy state on the job's linked claim file is LA
      value: K('coverage_louisiana_factor')
    - when: otherwise (any other policy state, or no linked claim file)
      value: '1'
    baseline:
      coverage_factor: '1'
    evidence:
    - cross_category
    cross_difficulty: claims
  - id: coverage_return_share
    effect: parameter
    decides: coverage_share
    bindings:
    - return_date
    - today_index
    - return_offset
    - return_in_period
    - days_to_return
    - coverage_share
    ladder:
    - when: >-
        the job is in return_scheduled status and its scheduled return date falls inside the coverage period being billed,
        the days from the period's first day through that date (both counted) numbering at least the coverage half-period
        days
      value: days_to_return / period_days (those days over the period length)
    - when: >-
        the job is in return_scheduled status and its scheduled return date falls inside the coverage period being billed,
        those days numbering fewer than the coverage half-period days
      value: K('coverage_half_period_days') / period_days
    - when: otherwise (no scheduled return date, or one outside the coverage period being billed)
      value: '1'
    baseline:
      coverage_share: '1'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The value covered is the declared value recorded on the job, except that items listed on signed disposal authorizations
      leave the coverage, because they are never compensated: when the job's signed disposal authorizations list at least
      one item, the value covered is found by taking the boxes packed less the items listed on signed disposal authorizations,
      each listed item counting as one packed box, dividing that difference by the boxes packed, and multiplying the declared
      value by that ratio. The standard declared-value coverage line for a period is the value covered times the tier's valuation
      percentage, divided by one hundred, for the full period, rounded to the cent, half up.
    params:
    - valuation_coverage_pct
    - storage_period_days
  inputs:
    history:
    - table: contents_disposal_authorizations
      aggregate: sum
      field: item_count
      filters:
        authorization_status: signed
    - table: contents_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: crate
    - table: contents_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: furniture_item
    - table: contents_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: electronics_item
    cross_category:
    - water
    - claims
- id: contents_ext_customer_share_payment
  base_policy_refs:
  - contents_evt_customer_payment
  - contents_evt_storage
  - contents_evt_insurance_payment
  - contents_agg_one_job_per_address
  overwrite: []
  trigger: on_request
  subject:
  - contents_customer_payment
  computes: amount
  target_tool: pay_contents_customer_share_24e82212
  params:
    rounding_epsilon: 1.0e-09
  rule: |
    This policy fixes the amount of the customer's own payment of the customer's share on an insurance-funded Partial Contents Packout or Full Contents Packout job in in_custody or return_scheduled status whose linked claim file is on an arrangement other than Homeowner Direct Pay Claim Support, and only that payment, while no storage line billed to customer on the job has stayed unpaid longer than the tier's referral days counted from the first day of its period, customer payments settling the oldest storage and declared-value coverage lines billed to customer first; an account past that point is referred under the base storage rule, a payment on a job the closing payment rule governs follows that rule, and a payment on any other job is posted in full as tendered under the base payment rule. The customer makes this payment personally through the company's secure payment channel, and staff never take card or bank details; a credit card payment carries the credit card surcharge percentage of the payment amount, booked with the payment as its own line under the base payment rule. A storage period falls to the customer when its first day falls after the approved storage end date on the linked claim file. The customer's share is fixed only after the storage period running today, when it falls to the customer, carries its vault storage line. Before the customer's share is figured, the storage period running today on a job carrying a declared value above zero must carry its declared-value coverage line. The standard customer's share is the storage and declared-value coverage lines on the job billed to customer, plus the card surcharge lines on the job, less the customer payments posted to the job net of the refunds returned from them, rounded to the cent, half up, and never below zero. The carrier pays contents work only up to the contents scope it approved, and approves storage separately by date: the contents work charged is every charge line on the job other than storage, declared-value coverage, card surcharge and late fee lines, and the approved contents scope is the total of the carrier's contents-coverage scope approvals on the linked claim file, and the most recent supplement request of a reason is the one of that reason carrying the highest supplement number on the file; when the claim file is in approved or settled status and the most recent contents_added supplement request on its contents coverage is named by no carrier approval, the share carries the contents work charged less the approved contents scope less the amount that request asks for, never below zero; when the claim file is in approved or settled status, no such request awaits a decision and more days than the arrangement's supplement window have passed since the carrier's initial approval date, the share carries the contents work charged less the approved contents scope, never below zero; in every other case nothing is added. Carrier money is the insured's to pass on where the carrier does not pay the company: when the linked claim file is in denied or withdrawn status, the share carries every charge line on the job other than lines billed to customer, card surcharge lines and late fee lines, less the insurance postings on the job, never below zero; when the claim file is in any other status and contents-coverage carrier payments issued insured_only are recorded on it, the share carries the lesser of two amounts, the first being those payments and the second being the approved contents scope less the carrier_denied_line write-offs on the contents coverage less the insurance postings on the job, never below zero; in every other case nothing is added. Lines the carrier declined on the contents coverage stay with the customer where the arrangement bills them: the share carries the carrier_denied_line write-offs recorded on the contents coverage less the contested amount, never below zero; the contested amount is the amount the most recent contents-coverage price_variance supplement request asks for when the arrangement bills denied lines to the customer and that request is named by no carrier approval, it is nothing when the arrangement bills denied lines to the customer and no such request awaits a decision, and in every other case it is the whole of those write-offs. The carrier pays storage only through the approved storage end date: the share carries the job's most recent vault, climate vault and oversized item storage lines billed to insurance_claim, taken together, times the uncovered days, divided by the tier's period length; the uncovered days are counted from the day after a cut-off date through the last day of the storage period that contains that date, and the storage extension request read is the one for this job that asks for the latest end date; when the approved storage end date falls before today and before the last day of its storage period and that request asks for an end date later than the approved storage end date and inside the same period, the cut-off is the requested end date; when the approved storage end date falls before today and before the last day of its storage period and no request for this job asks for an end date later than the approved storage end date, the cut-off is the approved storage end date; in every other case there are no uncovered days. The payment amount is found by adding to the standard customer's share, before its rounding and before its floor at zero, every amount the share carries, and rounding that total once to the cent, half up, never below zero.
  prerequisite:
  - problem: contents_ext_customer_vault_period
    kind: value_input
    gate: customer_lines
    form: state
    policy_source: >-
      The customer's share is fixed only after the storage period running today, when it falls to the customer, carries its
      vault storage line.
    condition: >-
      When the storage period whose first day is on or before today and whose last day is on or after today begins after the
      approved storage end date on the linked claim file, that period has a vault_storage line billed to customer on the job.
    resolved_by: charge_customer_vault_storage_2f9c3128
    effect: >-
      Once the vault storage line of the running period stands on the job, the lines billed to customer rise by that line's
      amount, and the share rises with them.
  - problem: contents_ext_customer_valuation_period
    kind: value_input
    gate: customer_lines
    form: state
    policy_source: >-
      Before the customer's share is figured, the storage period running today on a job carrying a declared value above zero
      must carry its declared-value coverage line.
    condition: >-
      On a job with a declared value above zero, the storage period whose first day is on or before today and whose last day
      is on or after today has a valuation_coverage line on the job.
    resolved_by: charge_declared_value_coverage_b3c8ef16
    effect: >-
      Once the declared-value coverage line of the running period stands on the job, the lines billed to customer rise by
      that line's amount, and the share rises with them.
  cross_category:
  - category: claims
    as: history
    reads:
    - status
    - variant_name
    - approved_date
    - approved_storage_end_date
    - denied_line_billable_to_customer
    - supplement_window_days
    - claims_approvals.amount
    - claims_approvals.claim_request_id
    - claims_payments.amount
    - claims_requests.requested_amount
    - claims_requests.supplement_number
    - claims_requests.claim_request_id
    - claims_requests.requested_storage_end_date
    note: >-
      The scope-excess, insured-proceeds, declined-lines and uncovered-days factors read the linked claim file and its approvals,
      write-offs, carrier payments and requests.
  compute:
  - period_days: P('storage_period_days')
  - customer_lines: SUM('contents_charges', 'amount', event_type='contents_storage_charge', bill_to='customer')
  - surcharge_lines: SUM('contents_charges', 'amount', event_type='contents_card_surcharge')
  - payments_posted: >-
      SUM('contents_payments', 'amount', event_type='contents_customer_payment') - SUM('contents_payments', 'amount', event_type='contents_refund')
  - excess_status: CFIELD('claims', 'status', claim_file_id=F('claim_file_id'))
  - work_all_lines: SUM('contents_charges', 'amount')
  - work_excluded_lines: >-
      SUM('contents_charges', 'amount', event_type='contents_storage_charge') + SUM('contents_charges', 'amount', event_type='contents_card_surcharge')
      + SUM('contents_charges', 'amount', event_type='contents_late_fee')
  - work_charged: work_all_lines - work_excluded_lines
  - excess_scope: >-
      XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_scope_approval', coverage_part='contents')
  - latest_added_number: >-
      XMAX('claims', 'claims_requests', 'supplement_number', claim_file_id=F('claim_file_id'), event_type='claims_supplement_submit',
      coverage_part='contents', supplement_reason='contents_added')
  - latest_added_request: >-
      XLATEST('claims', 'claims_requests', 'claim_request_id', date_field='request_date', claim_file_id=F('claim_file_id'),
      event_type='claims_supplement_submit', coverage_part='contents', supplement_reason='contents_added', supplement_number=int(latest_added_number))
      if latest_added_number > 0 else None
  - latest_added_decided: >-
      XCOUNT('claims', 'claims_approvals', claim_request_id=latest_added_request) if latest_added_request else 0
  - awaiting_amount: >-
      XLATEST('claims', 'claims_requests', 'requested_amount', date_field='request_date', claim_file_id=F('claim_file_id'),
      event_type='claims_supplement_submit', coverage_part='contents', supplement_reason='contents_added', supplement_number=int(latest_added_number))
      if (latest_added_request and latest_added_decided == 0) else 0
  - approved_on: CFIELD('claims', 'approved_date', claim_file_id=F('claim_file_id'))
  - supplement_window: CPARAM('claims', 'supplement_window_days', claim_file_id=F('claim_file_id'))
  - window_passed: approved_on and supplement_window != None and DAYS(approved_on, NOW) > supplement_window
  - excess_share: >-
      MX(0, work_charged - excess_scope - awaiting_amount) if ((excess_status == 'approved' or excess_status == 'settled')
      and awaiting_amount > 0) else (MX(0, work_charged - excess_scope) if ((excess_status == 'approved' or excess_status
      == 'settled') and awaiting_amount == 0 and window_passed) else 0)
  - proceeds_status: CFIELD('claims', 'status', claim_file_id=F('claim_file_id'))
  - proceeds_all_lines: >-
      SUM('contents_charges', 'amount') - SUM('contents_charges', 'amount', event_type='contents_storage_charge', bill_to='customer')
      - SUM('contents_charges', 'amount', event_type='contents_card_surcharge') - SUM('contents_charges', 'amount', event_type='contents_late_fee')
  - proceeds_postings: SUM('contents_payments', 'amount', event_type='contents_insurance_payment')
  - proceeds_scope: >-
      XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_scope_approval', coverage_part='contents')
  - proceeds_writeoffs: >-
      XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_receivable_writeoff',
      writeoff_reason='carrier_denied_line', coverage_part='contents')
  - insured_only_paid: >-
      XSUM('claims', 'claims_payments', 'amount', claim_file_id=F('claim_file_id'), coverage_part='contents', payee_route='insured_only')
  - proceeds_share: >-
      MX(0, proceeds_all_lines - proceeds_postings) if (proceeds_status == 'denied' or proceeds_status == 'withdrawn') else
      (MN(insured_only_paid, MX(0, proceeds_scope - proceeds_writeoffs - proceeds_postings)) if insured_only_paid > 0 else
      0)
  - denied_billable: CPARAM('claims', 'denied_line_billable_to_customer', claim_file_id=F('claim_file_id'))
  - denied_writeoffs: >-
      XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_receivable_writeoff',
      writeoff_reason='carrier_denied_line', coverage_part='contents')
  - price_number: >-
      XMAX('claims', 'claims_requests', 'supplement_number', claim_file_id=F('claim_file_id'), event_type='claims_supplement_submit',
      coverage_part='contents', supplement_reason='price_variance')
  - price_request: >-
      XLATEST('claims', 'claims_requests', 'claim_request_id', date_field='request_date', claim_file_id=F('claim_file_id'),
      event_type='claims_supplement_submit', coverage_part='contents', supplement_reason='price_variance', supplement_number=int(price_number))
      if price_number > 0 else None
  - price_decided: XCOUNT('claims', 'claims_approvals', claim_request_id=price_request) if price_request else 0
  - price_supplements: >-
      XLATEST('claims', 'claims_requests', 'requested_amount', date_field='request_date', claim_file_id=F('claim_file_id'),
      event_type='claims_supplement_submit', coverage_part='contents', supplement_reason='price_variance', supplement_number=int(price_number))
      if (price_request and price_decided == 0) else 0
  - contested_amount: >-
      price_supplements if (denied_billable == True and price_supplements > 0) else (0 if denied_billable == True else denied_writeoffs)
  - declined_share: MX(0, denied_writeoffs - contested_amount)
  - approved_end: CFIELD('claims', 'approved_storage_end_date', claim_file_id=F('claim_file_id'))
  - end_offset: DAYS(F('custody_start_date'), approved_end) if (approved_end and approved_end < NOW) else -1
  - days_after_end: period_days * (end_offset // period_days + 1) - end_offset - 1 if end_offset >= 0 else 0
  - requested_end: >-
      XLATEST('claims', 'claims_requests', 'requested_storage_end_date', date_field='requested_storage_end_date', claim_file_id=F('claim_file_id'),
      event_type='claims_storage_extension_request', related_job_id=HID)
  - later_request: requested_end and approved_end and requested_end > approved_end
  - requested_offset: DAYS(F('custody_start_date'), requested_end) if later_request else -1
  - request_same_period: later_request and end_offset >= 0 and requested_offset // period_days == end_offset // period_days
  - days_after_request: >-
      period_days * (requested_offset // period_days + 1) - requested_offset - 1 if request_same_period else 0
  - uncovered_days: >-
      days_after_request if (request_same_period and days_after_end > 0) else (days_after_end if ((not later_request) and
      days_after_end > 0) else 0)
  - insurer_storage_lines: >-
      (LATEST('contents_charges', 'amount', date_field='storage_period_start', charge_code='vault_storage', bill_to='insurance_claim')
      or 0) + (LATEST('contents_charges', 'amount', date_field='storage_period_start', charge_code='climate_vault_storage',
      bill_to='insurance_claim') or 0) + (LATEST('contents_charges', 'amount', date_field='storage_period_start', charge_code='oversized_item_storage',
      bill_to='insurance_claim') or 0)
  - uncovered_share: insurer_storage_lines * uncovered_days / period_days
  - result: >-
      RND(MX(0, customer_lines + surcharge_lines - payments_posted + excess_share + proceeds_share + declined_share + uncovered_share)
      + K('rounding_epsilon'), 2)
  compute_basis:
    period_days: divided by the tier's period length
    customer_lines: >-
      The standard customer's share is the storage and declared-value coverage lines on the job billed to customer, plus the
      card surcharge lines on the job, less the customer payments posted to the job net of the refunds returned from them,
      rounded to the cent, half up, and never below zero.
    surcharge_lines: >-
      The standard customer's share is the storage and declared-value coverage lines on the job billed to customer, plus the
      card surcharge lines on the job, less the customer payments posted to the job net of the refunds returned from them,
      rounded to the cent, half up, and never below zero.
    payments_posted: >-
      The standard customer's share is the storage and declared-value coverage lines on the job billed to customer, plus the
      card surcharge lines on the job, less the customer payments posted to the job net of the refunds returned from them,
      rounded to the cent, half up, and never below zero.
    excess_status: >-
      when the claim file is in approved or settled status and the most recent contents_added supplement request on its contents
      coverage is named by no carrier approval
    work_all_lines: >-
      the contents work charged is every charge line on the job other than storage, declared-value coverage, card surcharge
      and late fee lines
    work_excluded_lines: >-
      the contents work charged is every charge line on the job other than storage, declared-value coverage, card surcharge
      and late fee lines
    work_charged: >-
      the contents work charged is every charge line on the job other than storage, declared-value coverage, card surcharge
      and late fee lines
    excess_scope: >-
      the approved contents scope is the total of the carrier's contents-coverage scope approvals on the linked claim file
    latest_added_number: >-
      the most recent supplement request of a reason is the one of that reason carrying the highest supplement number on the
      file
    latest_added_request: >-
      the most recent contents_added supplement request on its contents coverage is named by no carrier approval
    latest_added_decided: >-
      the most recent contents_added supplement request on its contents coverage is named by no carrier approval
    awaiting_amount: >-
      the share carries the contents work charged less the approved contents scope less the amount that request asks for,
      never below zero
    approved_on: >-
      more days than the arrangement's supplement window have passed since the carrier's initial approval date
    supplement_window: >-
      more days than the arrangement's supplement window have passed since the carrier's initial approval date
    window_passed: >-
      more days than the arrangement's supplement window have passed since the carrier's initial approval date
    excess_share: >-
      The carrier pays contents work only up to the contents scope it approved, and approves storage separately by date: the
      contents work charged is every charge line on the job other than storage, declared-value coverage, card surcharge and
      late fee lines, and the approved contents scope is the total of the carrier's contents-coverage scope approvals on the
      linked claim file, and the most recent supplement request of a reason is the one of that reason carrying the highest
      supplement number on the file; when the claim file is in approved or settled status and the most recent contents_added
      supplement request on its contents coverage is named by no carrier approval, the share carries the contents work charged
      less the approved contents scope less the amount that request asks for, never below zero; when the claim file is in
      approved or settled status, no such request awaits a decision and more days than the arrangement's supplement window
      have passed since the carrier's initial approval date, the share carries the contents work charged less the approved
      contents scope, never below zero; in every other case nothing is added.
    proceeds_status: when the linked claim file is in denied or withdrawn status
    proceeds_all_lines: >-
      the share carries every charge line on the job other than lines billed to customer, card surcharge lines and late fee
      lines, less the insurance postings on the job, never below zero
    proceeds_postings: less the insurance postings on the job, never below zero
    proceeds_scope: >-
      the second being the approved contents scope less the carrier_denied_line write-offs on the contents coverage less the
      insurance postings on the job, never below zero
    proceeds_writeoffs: >-
      the second being the approved contents scope less the carrier_denied_line write-offs on the contents coverage less the
      insurance postings on the job, never below zero
    insured_only_paid: >-
      when the claim file is in any other status and contents-coverage carrier payments issued insured_only are recorded on
      it
    proceeds_share: >-
      Carrier money is the insured's to pass on where the carrier does not pay the company: when the linked claim file is
      in denied or withdrawn status, the share carries every charge line on the job other than lines billed to customer, card
      surcharge lines and late fee lines, less the insurance postings on the job, never below zero; when the claim file is
      in any other status and contents-coverage carrier payments issued insured_only are recorded on it, the share carries
      the lesser of two amounts, the first being those payments and the second being the approved contents scope less the
      carrier_denied_line write-offs on the contents coverage less the insurance postings on the job, never below zero; in
      every other case nothing is added.
    denied_billable: >-
      when the arrangement bills denied lines to the customer and that request is named by no carrier approval
    denied_writeoffs: >-
      the share carries the carrier_denied_line write-offs recorded on the contents coverage less the contested amount, never
      below zero
    price_supplements: >-
      the amount the most recent contents-coverage price_variance supplement request asks for when the arrangement bills denied
      lines to the customer and that request is named by no carrier approval
    contested_amount: >-
      the contested amount is the amount the most recent contents-coverage price_variance supplement request asks for when
      the arrangement bills denied lines to the customer and that request is named by no carrier approval, it is nothing when
      the arrangement bills denied lines to the customer and no such request awaits a decision, and in every other case it
      is the whole of those write-offs.
    declined_share: >-
      the share carries the carrier_denied_line write-offs recorded on the contents coverage less the contested amount, never
      below zero
    approved_end: The carrier pays storage only through the approved storage end date
    end_offset: when the approved storage end date falls before today and before the last day of its storage period
    days_after_end: >-
      the uncovered days are counted from the day after a cut-off date through the last day of the storage period that contains
      that date
    requested_end: the storage extension request read is the one for this job that asks for the latest end date
    later_request: >-
      that request asks for an end date later than the approved storage end date and inside the same period
    requested_offset: >-
      that request asks for an end date later than the approved storage end date and inside the same period
    request_same_period: >-
      that request asks for an end date later than the approved storage end date and inside the same period
    days_after_request: >-
      the uncovered days are counted from the day after a cut-off date through the last day of the storage period that contains
      that date
    uncovered_days: >-
      when the approved storage end date falls before today and before the last day of its storage period and that request
      asks for an end date later than the approved storage end date and inside the same period, the cut-off is the requested
      end date; when the approved storage end date falls before today and before the last day of its storage period and no
      request for this job asks for an end date later than the approved storage end date, the cut-off is the approved storage
      end date; in every other case there are no uncovered days.
    insurer_storage_lines: >-
      the share carries the job's most recent vault, climate vault and oversized item storage lines billed to insurance_claim,
      taken together, times the uncovered days, divided by the tier's period length
    uncovered_share: >-
      the share carries the job's most recent vault, climate vault and oversized item storage lines billed to insurance_claim,
      taken together, times the uncovered days, divided by the tier's period length
    result: >-
      The payment amount is found by adding to the standard customer's share, before its rounding and before its floor at
      zero, every amount the share carries, and rounding that total once to the cent, half up, never below zero.
    price_number: >-
      the most recent supplement request of a reason is the one of that reason carrying the highest supplement number on the
      file
    price_request: >-
      the amount the most recent contents-coverage price_variance supplement request asks for when the arrangement bills denied
      lines to the customer and that request is named by no carrier approval
    price_decided: >-
      the amount the most recent contents-coverage price_variance supplement request asks for when the arrangement bills denied
      lines to the customer and that request is named by no carrier approval
  factors:
  - id: approved_scope_overrun
    effect: method
    decides: excess_share
    bindings:
    - excess_status
    - work_all_lines
    - work_excluded_lines
    - work_charged
    - excess_scope
    - latest_added_number
    - latest_added_request
    - latest_added_decided
    - awaiting_amount
    - approved_on
    - supplement_window
    - window_passed
    - excess_share
    ladder:
    - when: >-
        the claim file is in approved or settled status and the most recent contents_added supplement request on the contents
        coverage is named by no carrier approval
      method: >-
        the contents work charged less the approved contents scope less the amount that request asks for, never below zero
    - when: >-
        the claim file is in approved or settled status, no such request awaits a decision and more days than the supplement
        window have passed since the initial approval date
      method: the contents work charged less the approved contents scope, never below zero
    - when: otherwise
      method: nothing is added
    baseline:
      excess_share: '0'
    evidence:
    - cross_category
    - date
    - history
    cross_difficulty: claims
  - id: insured_proceeds_pass_on
    effect: method
    decides: proceeds_share
    bindings:
    - proceeds_status
    - proceeds_all_lines
    - proceeds_postings
    - proceeds_scope
    - proceeds_writeoffs
    - insured_only_paid
    - proceeds_share
    ladder:
    - when: the linked claim file is in denied or withdrawn status
      method: >-
        every charge line other than customer lines, surcharges and late fees, less the insurance postings, never below zero
    - when: >-
        the claim file is in any other status and contents-coverage carrier payments issued insured_only are recorded on it
      method: >-
        the lesser of those payments and the approved contents scope less the carrier_denied_line write-offs less the insurance
        postings, never below zero
    - when: otherwise
      method: nothing is added
    baseline:
      proceeds_share: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: claims
  - id: declined_lines_contest
    effect: parameter
    decides: contested_amount
    bindings:
    - denied_billable
    - denied_writeoffs
    - price_number
    - price_request
    - price_decided
    - price_supplements
    - contested_amount
    - declined_share
    ladder:
    - when: >-
        the arrangement bills denied lines to the customer and the most recent contents-coverage price_variance supplement
        request is named by no carrier approval
      value: price_supplements (the amount that request asks for)
    - when: the arrangement bills denied lines to the customer and no such request awaits a decision
      value: '0'
    - when: otherwise (the arrangement does not bill denied lines to the customer, or no linked claim file)
      value: denied_writeoffs (the whole of the write-offs)
    baseline:
      contested_amount: denied_writeoffs
      declined_share: '0'
    evidence:
    - cross_category
    cross_difficulty: claims
  - id: uncovered_storage_days
    effect: parameter
    decides: uncovered_days
    bindings:
    - period_days
    - approved_end
    - end_offset
    - days_after_end
    - requested_end
    - later_request
    - requested_offset
    - request_same_period
    - days_after_request
    - uncovered_days
    - insurer_storage_lines
    - uncovered_share
    ladder:
    - when: >-
        the approved storage end date falls before today and before the last day of its storage period, and the request for
        this job asking the latest end date asks for one later than it and inside the same period
      value: the days after the requested end date through the period's last day
    - when: >-
        the approved storage end date falls before today and before the last day of its storage period, and no request for
        this job asks for a later end date
      value: the days after the approved storage end date through the period's last day
    - when: otherwise
      value: '0'
    baseline:
      uncovered_days: '0'
      uncovered_share: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: claims
  baseline:
    rule: >-
      The standard customer's share is the storage and declared-value coverage lines on the job billed to customer, plus the
      card surcharge lines on the job, less the customer payments posted to the job net of the refunds returned from them,
      rounded to the cent, half up, and never below zero.
    params:
    - rounding_epsilon
  inputs:
    history:
    - table: contents_charges
      aggregate: sum
      field: amount
      filters:
        event_type: contents_storage_charge
        bill_to: customer
    - table: contents_payments
      aggregate: sum
      field: amount
      filters:
        event_type: contents_customer_payment
    - table: contents_charges
      aggregate: sum
      field: amount
      filters:
        event_type: contents_card_surcharge
    - category: claims
      table: claims_approvals
      aggregate: sum
      field: amount
      filters:
        event_type: claims_scope_approval
        coverage_part: contents
    - category: claims
      table: claims_payments
      aggregate: sum
      field: amount
      filters:
        coverage_part: contents
        payee_route: insured_only
    cross_category:
    - claims
- id: contents_ext_pack_back_box_line
  base_policy_refs:
  - contents_return
  - contents_evt_packout_and_cleaning
  - contents_evt_custody_credit
  overwrite:
  - base_policy: contents_return
    superseded_clause: >-
      Pack-back is billed per box and per furniture item reset at the tier's rates, rounded to the cent, half up
    replaced_by: >-
      For the pack-back box line of a return, and only for that line, the amount is figured as stated here; the furniture
      reset line and the truck-load line of a return remain under their own rules, and any other pack-back line is still billed
      per box and per furniture item reset at the tier's rates, rounded to the cent, half up.
  trigger: state_due
  subject:
  - contents_pack_back_charge
  computes: amount
  target_tool: charge_pack_back_boxes_26b5c86b
  params:
    multifamily_carry_pct: 15.0
    condo_carry_pct: 8.0
    fresh_finish_days: 30
    floor_protection_fresh: 1.4
    floor_protection_settled: 0.7
    wardrobe_volume_threshold: 20
    wardrobe_hang_volume: 4.25
    wardrobe_hang_standard: 5.5
    high_value_hourly_threshold: 25
    high_value_check_hours_per_item: 0.25
    high_value_check_standard: 8.75
    heavy_odor_bag: 1.85
    moderate_odor_bag: 1.1
    heavy_box_volume_threshold: 60
    heavy_box_volume: 0.95
    heavy_box_standard: 1.25
    rounding_epsilon: 1.0e-09
  rule: |
    This policy prices the pack-back box line of a return on a Partial Contents Packout, Full Contents Packout, High-Value Contents Packout or Commercial Contents and Records Recovery job, and only that line: it is charged once the job is in returned status, dated the job's returned date, at most once per return. The boxes brought back are the boxes packed recorded on the job, except that items listed on signed disposal authorizations are not brought back, each listed item counting as one packed box: when the job's signed disposal authorizations list at least one item, the boxes brought back are the boxes packed less those listed items, never below zero. The standard pack-back box line is the boxes brought back times the tier's pack-back box rate, rounded to the cent, half up. The company rebuild contract read at the job's loss address is the one at that address on the job's own claim file, or with no claim file when the job has none, and among those the one furthest along, taking a closed contract first, then a final_invoiced, substantially_complete, in_construction, permitted, signed and proposed one in that order; a cancelled contract is never read; the company keeps one rebuild contract per claim file and address, added scope for the same claim and address being written as a change order on it, so no two contracts share that place in the order. Carrying boxes into a unit costs more than into a house: when the company rebuild contract read at the job's loss address is for a multifamily_unit property, the pack-back box rate carries the multifamily carry percentage; when it is for a condo_unit property, the condo carry percentage; when it is for any other property type, or no company rebuild contract is read at that address, no carry percentage applies. Newly finished floors are protected while boxes come back, the lead being the calendar days from the substantial completion date of the company rebuild contract read at the job's loss address to the job's returned date: when that lead is zero or more and no more than the fresh-finish days, each box brought back carries the fresh-finish floor protection; when it is more than the fresh-finish days, each box brought back carries the settled-finish floor protection; when no substantial completion date is recorded on the contract read, or the completion date falls after the returned date, no floor protection is charged. Wardrobe boxes are unpacked onto hanging rods: when the wardrobe box quantities on the job's packout lines total at least the wardrobe volume threshold, as many wardrobe boxes as that threshold carry the standard hanging charge and each wardrobe box beyond it carries the volume hanging charge; when they total at least one but fewer than the wardrobe volume threshold, each wardrobe box carries the standard hanging charge; a job with no wardrobe box carries no hanging charge. High-value items are unpacked with a condition check against the photo inventory: when the high-value inventory item quantities on the job's packout lines total at least the high-value hourly threshold, the check is charged as technician time, the high-value items times the check hours per item times the tier's contents technician hourly rate; when they total at least one but fewer than the high-value hourly threshold, the check is charged per item, the high-value items times the standard condition-check charge; a job with no high-value inventory item carries no condition check. Contents from a smoke loss come back in odor barrier bags: when the job's linked mitigation job is a company fire job with smoke severity heavy, each box brought back carries the heavy odor-bag charge; when that fire job's smoke severity is moderate, each box brought back carries the moderate odor-bag charge; when the smoke severity is light or odor_only, the linked mitigation job is not a fire job, or there is none, no odor-bag charge applies. Large boxes are carried up as heavy boxes: when the large box quantities on the job's packout lines total at least the heavy-box volume threshold, as many large boxes as that threshold carry the standard heavy-box charge and each large box beyond it carries the volume heavy-box charge; when they total at least one but fewer than the heavy-box volume threshold, each large box carries the standard heavy-box charge; a job with no large box carries no heavy-box charge. For the pack-back box line of a return, and only for that line, the amount is figured as stated here; the furniture reset line and the truck-load line of a return remain under their own rules, and any other pack-back line is still billed per box and per furniture item reset at the tier's rates, rounded to the cent, half up. The amounts are combined in one order: the rate per box is the tier's pack-back box rate with any percentage applied first and then every add per box added; that rate per box is multiplied by the boxes brought back; every amount figured per item is added to that product, and the total is rounded once to the cent, half up, as the line amount.
  prerequisite: []
  cross_category:
  - category: rebuild
    as: branch
    reads:
    - property_type
    - substantial_completion_date
    - status
    note: >-
      The carry and floor-protection factors take their tiers from the company rebuild contract read at the job's loss address.
  - category: fire
    as: branch
    reads:
    - smoke_severity
    note: The odor-bag factor takes its tier from the smoke severity of the linked fire job.
  compute:
  - box_rate: P('pack_back_box_rate')
  - boxes_packed: F('box_count')
  - signed_listed: SUM('contents_disposal_authorizations', 'item_count', authorization_status='signed')
  - boxes_back: MX(0, boxes_packed - signed_listed) if signed_listed > 0 else boxes_packed
  - rebuild_property: >-
      CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='closed')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='final_invoiced')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='substantially_complete')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='in_construction')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='permitted')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='signed')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='proposed')
  - carry_pct: >-
      K('multifamily_carry_pct') if rebuild_property == 'multifamily_unit' else (K('condo_carry_pct') if rebuild_property
      == 'condo_unit' else 0)
  - rebuild_completed: >-
      CFIELD('rebuild', 'substantial_completion_date', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='closed')
      or CFIELD('rebuild', 'substantial_completion_date', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'),
      status='final_invoiced') or CFIELD('rebuild', 'substantial_completion_date', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'),
      status='substantially_complete')
  - completion_lead_days: DAYS(rebuild_completed, F('returned_date')) if (rebuild_completed and F('returned_date')) else -1
  - floor_protection: >-
      K('floor_protection_fresh') if (completion_lead_days >= 0 and completion_lead_days <= K('fresh_finish_days')) else (K('floor_protection_settled')
      if completion_lead_days > K('fresh_finish_days') else 0)
  - wardrobe_boxes: SUM('contents_charges', 'quantity', charge_code='wardrobe_box')
  - hanging_charge: >-
      K('wardrobe_volume_threshold') * K('wardrobe_hang_standard') + (wardrobe_boxes - K('wardrobe_volume_threshold')) * K('wardrobe_hang_volume')
      if wardrobe_boxes >= K('wardrobe_volume_threshold') else (wardrobe_boxes * K('wardrobe_hang_standard') if wardrobe_boxes
      >= 1 else 0)
  - high_value_items: SUM('contents_charges', 'quantity', charge_code='high_value_inventory_item')
  - condition_check_charge: >-
      high_value_items * K('high_value_check_hours_per_item') * P('contents_tech_hourly_rate') if high_value_items >= K('high_value_hourly_threshold')
      else (high_value_items * K('high_value_check_standard') if high_value_items >= 1 else 0)
  - smoke_severity: CFIELD('fire', 'smoke_severity', fire_job_id=F('mitigation_job_id'))
  - odor_bag: >-
      K('heavy_odor_bag') if smoke_severity == 'heavy' else (K('moderate_odor_bag') if smoke_severity == 'moderate' else 0)
  - large_boxes: SUM('contents_charges', 'quantity', charge_code='box_large')
  - heavy_box_charge: >-
      K('heavy_box_volume_threshold') * K('heavy_box_standard') + (large_boxes - K('heavy_box_volume_threshold')) * K('heavy_box_volume')
      if large_boxes >= K('heavy_box_volume_threshold') else (large_boxes * K('heavy_box_standard') if large_boxes >= 1 else
      0)
  - per_box_rate: box_rate * (1 + carry_pct / 100) + floor_protection + odor_bag
  - result: >-
      RND(boxes_back * per_box_rate + hanging_charge + condition_check_charge + heavy_box_charge + K('rounding_epsilon'),
      2)
  compute_basis:
    box_rate: >-
      The standard pack-back box line is the boxes brought back times the tier's pack-back box rate, rounded to the cent,
      half up.
    boxes_packed: >-
      The boxes brought back are the boxes packed recorded on the job, except that items listed on signed disposal authorizations
      are not brought back, each listed item counting as one packed box
    signed_listed: >-
      when the job's signed disposal authorizations list at least one item, the boxes brought back are the boxes packed less
      those listed items, never below zero.
    boxes_back: >-
      when the job's signed disposal authorizations list at least one item, the boxes brought back are the boxes packed less
      those listed items, never below zero.
    rebuild_property: >-
      The company rebuild contract read at the job's loss address is the one at that address on the job's own claim file,
      or with no claim file when the job has none, and among those the one furthest along, taking a closed contract first,
      then a final_invoiced, substantially_complete, in_construction, permitted, signed and proposed one in that order; a
      cancelled contract is never read; the company keeps one rebuild contract per claim file and address, added scope for
      the same claim and address being written as a change order on it, so no two contracts share that place in the order.
    carry_pct: >-
      Carrying boxes into a unit costs more than into a house: when the company rebuild contract read at the job's loss address
      is for a multifamily_unit property, the pack-back box rate carries the multifamily carry percentage; when it is for
      a condo_unit property, the condo carry percentage; when it is for any other property type, or no company rebuild contract
      is read at that address, no carry percentage applies.
    rebuild_completed: >-
      The company rebuild contract read at the job's loss address is the one at that address on the job's own claim file,
      or with no claim file when the job has none, and among those the one furthest along, taking a closed contract first,
      then a final_invoiced, substantially_complete, in_construction, permitted, signed and proposed one in that order; a
      cancelled contract is never read; the company keeps one rebuild contract per claim file and address, added scope for
      the same claim and address being written as a change order on it, so no two contracts share that place in the order.
    completion_lead_days: >-
      the lead being the calendar days from the substantial completion date of the company rebuild contract read at the job's
      loss address to the job's returned date
    floor_protection: >-
      when that lead is zero or more and no more than the fresh-finish days, each box brought back carries the fresh-finish
      floor protection; when it is more than the fresh-finish days, each box brought back carries the settled-finish floor
      protection; when no substantial completion date is recorded on the contract read, or the completion date falls after
      the returned date, no floor protection is charged.
    wardrobe_boxes: >-
      when the wardrobe box quantities on the job's packout lines total at least the wardrobe volume threshold
    hanging_charge: >-
      Wardrobe boxes are unpacked onto hanging rods: when the wardrobe box quantities on the job's packout lines total at
      least the wardrobe volume threshold, as many wardrobe boxes as that threshold carry the standard hanging charge and
      each wardrobe box beyond it carries the volume hanging charge; when they total at least one but fewer than the wardrobe
      volume threshold, each wardrobe box carries the standard hanging charge; a job with no wardrobe box carries no hanging
      charge.
    high_value_items: >-
      when the high-value inventory item quantities on the job's packout lines total at least the high-value hourly threshold
    condition_check_charge: >-
      High-value items are unpacked with a condition check against the photo inventory: when the high-value inventory item
      quantities on the job's packout lines total at least the high-value hourly threshold, the check is charged as technician
      time, the high-value items times the check hours per item times the tier's contents technician hourly rate; when they
      total at least one but fewer than the high-value hourly threshold, the check is charged per item, the high-value items
      times the standard condition-check charge; a job with no high-value inventory item carries no condition check.
    smoke_severity: when the job's linked mitigation job is a company fire job with smoke severity heavy
    odor_bag: >-
      Contents from a smoke loss come back in odor barrier bags: when the job's linked mitigation job is a company fire job
      with smoke severity heavy, each box brought back carries the heavy odor-bag charge; when that fire job's smoke severity
      is moderate, each box brought back carries the moderate odor-bag charge; when the smoke severity is light or odor_only,
      the linked mitigation job is not a fire job, or there is none, no odor-bag charge applies.
    large_boxes: >-
      when the large box quantities on the job's packout lines total at least the heavy-box volume threshold
    heavy_box_charge: >-
      Large boxes are carried up as heavy boxes: when the large box quantities on the job's packout lines total at least the
      heavy-box volume threshold, as many large boxes as that threshold carry the standard heavy-box charge and each large
      box beyond it carries the volume heavy-box charge; when they total at least one but fewer than the heavy-box volume
      threshold, each large box carries the standard heavy-box charge; a job with no large box carries no heavy-box charge.
    per_box_rate: >-
      the rate per box is the tier's pack-back box rate with any percentage applied first and then every add per box added
    result: >-
      that rate per box is multiplied by the boxes brought back; every amount figured per item is added to that product, and
      the total is rounded once to the cent, half up, as the line amount.
  factors:
  - id: unit_carry
    effect: parameter
    decides: carry_pct
    bindings:
    - rebuild_property
    - carry_pct
    ladder:
    - when: the company rebuild contract read at the job's loss address is for a multifamily_unit property
      value: K('multifamily_carry_pct')
    - when: it is for a condo_unit property
      value: K('condo_carry_pct')
    - when: otherwise (any other property type, or no company rebuild contract read at the address)
      value: '0'
    baseline:
      carry_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: rebuild
  - id: new_floor_protection
    effect: parameter
    decides: floor_protection
    bindings:
    - rebuild_completed
    - completion_lead_days
    - floor_protection
    ladder:
    - when: >-
        the lead from the substantial completion date to the returned date is zero or more and no more than the fresh-finish
        days
      value: K('floor_protection_fresh')
    - when: that lead is more than the fresh-finish days
      value: K('floor_protection_settled')
    - when: >-
        otherwise (no substantial completion date on the contract read, or a completion after the returned date)
      value: '0'
    baseline:
      floor_protection: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: rebuild
  - id: wardrobe_hanging
    effect: method
    decides: hanging_charge
    bindings:
    - wardrobe_boxes
    - hanging_charge
    ladder:
    - when: the wardrobe box quantities on the packout lines total at least the wardrobe volume threshold
      method: >-
        graduated: as many boxes as the threshold at the standard hanging charge, plus each box beyond it at the volume hanging
        charge
    - when: they total at least one but fewer than the wardrobe volume threshold
      method: every wardrobe box at the standard hanging charge
    - when: otherwise (no wardrobe box)
      method: no hanging charge
    baseline:
      hanging_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: high_value_condition_check
    effect: method
    decides: condition_check_charge
    bindings:
    - high_value_items
    - condition_check_charge
    ladder:
    - when: >-
        the high-value inventory item quantities on the packout lines total at least the high-value hourly threshold
      method: >-
        technician time: the high-value items times the check hours per item times the tier's contents technician hourly rate
    - when: they total at least one but fewer than the high-value hourly threshold
      method: 'per item: the high-value items times the standard condition-check charge'
    - when: otherwise (no high-value inventory item)
      method: no condition check
    baseline:
      condition_check_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: odor_barrier_bagging
    effect: parameter
    decides: odor_bag
    bindings:
    - smoke_severity
    - odor_bag
    ladder:
    - when: the linked mitigation job is a company fire job with smoke severity heavy
      value: K('heavy_odor_bag')
    - when: that fire job's smoke severity is moderate
      value: K('moderate_odor_bag')
    - when: otherwise (light or odor_only smoke, no fire job, or no linked mitigation job)
      value: '0'
    baseline:
      odor_bag: '0'
    evidence:
    - cross_category
    cross_difficulty: fire
  - id: heavy_box_handling
    effect: method
    decides: heavy_box_charge
    bindings:
    - large_boxes
    - heavy_box_charge
    ladder:
    - when: the large box quantities on the packout lines total at least the heavy-box volume threshold
      method: >-
        graduated: as many boxes as the threshold at the standard heavy-box charge, plus each box beyond it at the volume
        heavy-box charge
    - when: they total at least one but fewer than the heavy-box volume threshold
      method: every large box at the standard heavy-box charge
    - when: otherwise (no large box)
      method: no heavy-box charge
    baseline:
      heavy_box_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The boxes brought back are the boxes packed recorded on the job, except that items listed on signed disposal authorizations
      are not brought back, each listed item counting as one packed box: when the job's signed disposal authorizations list
      at least one item, the boxes brought back are the boxes packed less those listed items, never below zero. The standard
      pack-back box line is the boxes brought back times the tier's pack-back box rate, rounded to the cent, half up.
    params:
    - pack_back_box_rate
  inputs:
    history:
    - table: contents_disposal_authorizations
      aggregate: sum
      field: item_count
      filters:
        authorization_status: signed
    - table: contents_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: wardrobe_box
    - table: contents_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: high_value_inventory_item
    - table: contents_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: box_large
    cross_category:
    - rebuild
    - fire
- id: contents_ext_furniture_reset_line
  base_policy_refs:
  - contents_return
  - contents_evt_storage
  - contents_evt_packout_and_cleaning
  overwrite:
  - base_policy: contents_return
    superseded_clause: >-
      Pack-back is billed per box and per furniture item reset at the tier's rates, rounded to the cent, half up
    replaced_by: >-
      For the furniture reset line of a return, and only for that line, the amount is figured as stated here; the pack-back
      box line and the truck-load line of a return remain under their own rules, and any other pack-back line is still billed
      per box and per furniture item reset at the tier's rates, rounded to the cent, half up.
  trigger: state_due
  subject:
  - contents_pack_back_charge
  computes: amount
  target_tool: charge_furniture_reset_9904d302
  params:
    reset_multifamily_carry_pct: 15.0
    reset_condo_carry_pct: 8.0
    reset_fresh_finish_days: 30
    runner_fresh: 2.1
    runner_settled: 1.05
    heavy_odor_wrap: 4.5
    moderate_odor_wrap: 2.75
    oversized_volume_threshold: 2
    oversized_set_volume: 120.0
    oversized_set_single: 145.0
    second_crew_hourly_threshold: 40
    second_crew_mid_threshold: 25
    second_crew_hours_per_piece: 0.2
    second_crew_mid: 3.25
    uncrate_volume_threshold: 4
    uncrate_volume: 22.0
    uncrate_standard: 28.0
    rounding_epsilon: 1.0e-09
  rule: |
    This policy prices the furniture reset line of a return on a Partial Contents Packout, Full Contents Packout, High-Value Contents Packout or Commercial Contents and Records Recovery job, and only that line: it is charged once the job is in returned status, dated the job's returned date, at most once per return. The pieces set are the furniture item quantities on the job's packout lines. The standard furniture reset line is the pieces set times the tier's furniture reset rate, rounded to the cent, half up. The company rebuild contract read at the job's loss address is the one at that address on the job's own claim file, or with no claim file when the job has none, and among those the one furthest along, taking a closed contract first, then a final_invoiced, substantially_complete, in_construction, permitted, signed and proposed one in that order; a cancelled contract is never read; the company keeps one rebuild contract per claim file and address, added scope for the same claim and address being written as a change order on it, so no two contracts share that place in the order. Setting furniture inside a unit costs more than inside a house: when the company rebuild contract read at the job's loss address is for a multifamily_unit property, the furniture reset rate carries the multifamily reset carry percentage; when it is for a condo_unit property, the condo reset carry percentage; when it is for any other property type, or no company rebuild contract is read at that address, no reset carry percentage applies. Floor runners are laid under every piece set on newly finished floors, the lead being the calendar days from the substantial completion date of the company rebuild contract read at the job's loss address to the job's returned date: when that lead is zero or more and no more than the reset fresh-finish days, each piece set carries the fresh-finish runner charge; when it is more than the reset fresh-finish days, each piece set carries the settled-finish runner charge; when no substantial completion date is recorded on the contract read, or the completion date falls after the returned date, no runner charge applies. Furniture from a smoke loss is unwrapped from odor barrier film at the reset: when the job's linked mitigation job is a company fire job with smoke severity heavy, each piece set carries the heavy odor-wrap charge; when that fire job's smoke severity is moderate, each piece set carries the moderate odor-wrap charge; when the smoke severity is light or odor_only, the linked mitigation job is not a fire job, or there is none, no odor-wrap charge applies. Items too large for a vault need a set crew of their own: when the largest oversized item quantity on the job's oversized item storage lines is at least the oversized volume threshold, each oversized item carries the volume oversized set charge; when it is one, the oversized item carries the single oversized set charge; a job with no oversized item storage line carries no oversized set charge. Large households take a second reset crew: when the furniture item quantities on the job's packout lines total at least the second-crew hourly threshold, the second crew is charged as technician time, the furniture items times the second-crew hours per piece times the tier's contents technician hourly rate; when they total at least the mid second-crew threshold but fewer than the hourly threshold, the second crew is charged per piece, the furniture items times the mid second-crew charge; with fewer furniture items than the mid threshold, no second crew is charged. Crated art, mirrors and glass are uncrated and hung at the reset: when the crate quantities on the job's packout lines total at least the uncrating volume threshold, each crate carries the volume uncrating charge; when they total at least one crate but fewer than the uncrating volume threshold, each crate carries the standard uncrating charge; a job with no crate on its packout lines carries no uncrating charge. For the furniture reset line of a return, and only for that line, the amount is figured as stated here; the pack-back box line and the truck-load line of a return remain under their own rules, and any other pack-back line is still billed per box and per furniture item reset at the tier's rates, rounded to the cent, half up. The amounts are combined in one order: the rate per piece is the tier's furniture reset rate with any percentage applied first and then every add per piece added; that rate per piece is multiplied by the pieces set; every amount figured per item or per crew is added to that product, and the total is rounded once to the cent, half up, as the line amount.
  prerequisite: []
  cross_category:
  - category: rebuild
    as: branch
    reads:
    - property_type
    - substantial_completion_date
    - status
    note: >-
      The reset carry and runner factors take their tiers from the company rebuild contract read at the job's loss address.
  - category: fire
    as: branch
    reads:
    - smoke_severity
    note: The odor-wrap factor takes its tier from the smoke severity of the linked fire job.
  compute:
  - reset_rate: P('furniture_reset_rate')
  - pieces_set: SUM('contents_charges', 'quantity', charge_code='furniture_item')
  - rebuild_property: >-
      CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='closed')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='final_invoiced')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='substantially_complete')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='in_construction')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='permitted')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='signed')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='proposed')
  - reset_carry_pct: >-
      K('reset_multifamily_carry_pct') if rebuild_property == 'multifamily_unit' else (K('reset_condo_carry_pct') if rebuild_property
      == 'condo_unit' else 0)
  - rebuild_completed: >-
      CFIELD('rebuild', 'substantial_completion_date', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='closed')
      or CFIELD('rebuild', 'substantial_completion_date', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'),
      status='final_invoiced') or CFIELD('rebuild', 'substantial_completion_date', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'),
      status='substantially_complete')
  - completion_lead_days: DAYS(rebuild_completed, F('returned_date')) if (rebuild_completed and F('returned_date')) else -1
  - runner_charge: >-
      K('runner_fresh') if (completion_lead_days >= 0 and completion_lead_days <= K('reset_fresh_finish_days')) else (K('runner_settled')
      if completion_lead_days > K('reset_fresh_finish_days') else 0)
  - smoke_severity: CFIELD('fire', 'smoke_severity', fire_job_id=F('mitigation_job_id'))
  - odor_wrap: >-
      K('heavy_odor_wrap') if smoke_severity == 'heavy' else (K('moderate_odor_wrap') if smoke_severity == 'moderate' else
      0)
  - oversized_items: MAX('contents_charges', 'quantity', charge_code='oversized_item_storage')
  - oversized_set_charge: >-
      oversized_items * K('oversized_set_volume') if oversized_items >= K('oversized_volume_threshold') else (K('oversized_set_single')
      if oversized_items == 1 else 0)
  - furniture_for_crew: SUM('contents_charges', 'quantity', charge_code='furniture_item')
  - second_crew_charge: >-
      furniture_for_crew * K('second_crew_hours_per_piece') * P('contents_tech_hourly_rate') if furniture_for_crew >= K('second_crew_hourly_threshold')
      else (furniture_for_crew * K('second_crew_mid') if furniture_for_crew >= K('second_crew_mid_threshold') else 0)
  - crates_packed: SUM('contents_charges', 'quantity', charge_code='crate')
  - uncrating_charge: >-
      crates_packed * K('uncrate_volume') if crates_packed >= K('uncrate_volume_threshold') else (crates_packed * K('uncrate_standard')
      if crates_packed >= 1 else 0)
  - per_piece_rate: reset_rate * (1 + reset_carry_pct / 100) + runner_charge + odor_wrap
  - result: >-
      RND(pieces_set * per_piece_rate + second_crew_charge + oversized_set_charge + uncrating_charge + K('rounding_epsilon'),
      2)
  compute_basis:
    reset_rate: >-
      The standard furniture reset line is the pieces set times the tier's furniture reset rate, rounded to the cent, half
      up.
    pieces_set: The pieces set are the furniture item quantities on the job's packout lines.
    rebuild_property: >-
      The company rebuild contract read at the job's loss address is the one at that address on the job's own claim file,
      or with no claim file when the job has none, and among those the one furthest along, taking a closed contract first,
      then a final_invoiced, substantially_complete, in_construction, permitted, signed and proposed one in that order; a
      cancelled contract is never read; the company keeps one rebuild contract per claim file and address, added scope for
      the same claim and address being written as a change order on it, so no two contracts share that place in the order.
    reset_carry_pct: >-
      Setting furniture inside a unit costs more than inside a house: when the company rebuild contract read at the job's
      loss address is for a multifamily_unit property, the furniture reset rate carries the multifamily reset carry percentage;
      when it is for a condo_unit property, the condo reset carry percentage; when it is for any other property type, or no
      company rebuild contract is read at that address, no reset carry percentage applies.
    rebuild_completed: >-
      The company rebuild contract read at the job's loss address is the one at that address on the job's own claim file,
      or with no claim file when the job has none, and among those the one furthest along, taking a closed contract first,
      then a final_invoiced, substantially_complete, in_construction, permitted, signed and proposed one in that order; a
      cancelled contract is never read; the company keeps one rebuild contract per claim file and address, added scope for
      the same claim and address being written as a change order on it, so no two contracts share that place in the order.
    completion_lead_days: >-
      the lead being the calendar days from the substantial completion date of the company rebuild contract read at the job's
      loss address to the job's returned date
    runner_charge: >-
      when that lead is zero or more and no more than the reset fresh-finish days, each piece set carries the fresh-finish
      runner charge; when it is more than the reset fresh-finish days, each piece set carries the settled-finish runner charge;
      when no substantial completion date is recorded on the contract read, or the completion date falls after the returned
      date, no runner charge applies.
    smoke_severity: >-
      when the job's linked mitigation job is a company fire job with smoke severity heavy, each piece set carries the heavy
      odor-wrap charge
    odor_wrap: >-
      Furniture from a smoke loss is unwrapped from odor barrier film at the reset: when the job's linked mitigation job is
      a company fire job with smoke severity heavy, each piece set carries the heavy odor-wrap charge; when that fire job's
      smoke severity is moderate, each piece set carries the moderate odor-wrap charge; when the smoke severity is light or
      odor_only, the linked mitigation job is not a fire job, or there is none, no odor-wrap charge applies.
    oversized_items: >-
      when the largest oversized item quantity on the job's oversized item storage lines is at least the oversized volume
      threshold
    oversized_set_charge: >-
      Items too large for a vault need a set crew of their own: when the largest oversized item quantity on the job's oversized
      item storage lines is at least the oversized volume threshold, each oversized item carries the volume oversized set
      charge; when it is one, the oversized item carries the single oversized set charge; a job with no oversized item storage
      line carries no oversized set charge.
    furniture_for_crew: >-
      when the furniture item quantities on the job's packout lines total at least the second-crew hourly threshold
    second_crew_charge: >-
      Large households take a second reset crew: when the furniture item quantities on the job's packout lines total at least
      the second-crew hourly threshold, the second crew is charged as technician time, the furniture items times the second-crew
      hours per piece times the tier's contents technician hourly rate; when they total at least the mid second-crew threshold
      but fewer than the hourly threshold, the second crew is charged per piece, the furniture items times the mid second-crew
      charge; with fewer furniture items than the mid threshold, no second crew is charged.
    crates_packed: when the crate quantities on the job's packout lines total at least the uncrating volume threshold
    uncrating_charge: >-
      Crated art, mirrors and glass are uncrated and hung at the reset: when the crate quantities on the job's packout lines
      total at least the uncrating volume threshold, each crate carries the volume uncrating charge; when they total at least
      one crate but fewer than the uncrating volume threshold, each crate carries the standard uncrating charge; a job with
      no crate on its packout lines carries no uncrating charge.
    per_piece_rate: >-
      the rate per piece is the tier's furniture reset rate with any percentage applied first and then every add per piece
      added
    result: >-
      that rate per piece is multiplied by the pieces set; every amount figured per item or per crew is added to that product,
      and the total is rounded once to the cent, half up, as the line amount.
  factors:
  - id: reset_unit_carry
    effect: parameter
    decides: reset_carry_pct
    bindings:
    - rebuild_property
    - reset_carry_pct
    ladder:
    - when: the company rebuild contract read at the job's loss address is for a multifamily_unit property
      value: K('reset_multifamily_carry_pct')
    - when: it is for a condo_unit property
      value: K('reset_condo_carry_pct')
    - when: otherwise (any other property type, or no company rebuild contract read at the address)
      value: '0'
    baseline:
      reset_carry_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: rebuild
  - id: reset_floor_runners
    effect: parameter
    decides: runner_charge
    bindings:
    - rebuild_completed
    - completion_lead_days
    - runner_charge
    ladder:
    - when: >-
        the lead from the substantial completion date to the returned date is zero or more and no more than the reset fresh-finish
        days
      value: K('runner_fresh')
    - when: that lead is more than the reset fresh-finish days
      value: K('runner_settled')
    - when: >-
        otherwise (no substantial completion date on the contract read, or a completion after the returned date)
      value: '0'
    baseline:
      runner_charge: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: rebuild
  - id: odor_film_unwrap
    effect: parameter
    decides: odor_wrap
    bindings:
    - smoke_severity
    - odor_wrap
    ladder:
    - when: the linked mitigation job is a company fire job with smoke severity heavy
      value: K('heavy_odor_wrap')
    - when: that fire job's smoke severity is moderate
      value: K('moderate_odor_wrap')
    - when: otherwise (light or odor_only smoke, no fire job, or no linked mitigation job)
      value: '0'
    baseline:
      odor_wrap: '0'
    evidence:
    - cross_category
    cross_difficulty: fire
  - id: oversized_set_crew
    effect: parameter
    decides: oversized_set_charge
    bindings:
    - oversized_items
    - oversized_set_charge
    ladder:
    - when: >-
        the largest oversized item quantity on the oversized item storage lines is at least the oversized volume threshold
      value: oversized_items * K('oversized_set_volume')
    - when: it is one
      value: K('oversized_set_single')
    - when: otherwise (no oversized item storage line)
      value: '0'
    baseline:
      oversized_set_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: second_reset_crew
    effect: method
    decides: second_crew_charge
    bindings:
    - furniture_for_crew
    - second_crew_charge
    ladder:
    - when: the furniture item quantities on the packout lines total at least the second-crew hourly threshold
      method: >-
        technician time: the furniture items times the second-crew hours per piece times the tier's contents technician hourly
        rate
    - when: they total at least the mid second-crew threshold but fewer than the hourly threshold
      method: 'per piece: the furniture items times the mid second-crew charge'
    - when: otherwise (fewer furniture items than the mid threshold)
      method: no second crew
    baseline:
      second_crew_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: crate_uncrating
    effect: parameter
    decides: uncrating_charge
    bindings:
    - crates_packed
    - uncrating_charge
    ladder:
    - when: the crate quantities on the packout lines total at least the uncrating volume threshold
      value: crates_packed * K('uncrate_volume')
    - when: they total at least one crate but fewer than the uncrating volume threshold
      value: crates_packed * K('uncrate_standard')
    - when: otherwise (no crate on the packout lines)
      value: '0'
    baseline:
      uncrating_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The pieces set are the furniture item quantities on the job's packout lines. The standard furniture reset line is the
      pieces set times the tier's furniture reset rate, rounded to the cent, half up.
    params:
    - furniture_reset_rate
  inputs:
    history:
    - table: contents_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: furniture_item
    - table: contents_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: crate
    - table: contents_charges
      aggregate: max
      field: quantity
      filters:
        charge_code: oversized_item_storage
    cross_category:
    - rebuild
    - fire
- id: contents_ext_return_truck_loads
  base_policy_refs:
  - contents_return
  - contents_evt_packout_and_cleaning
  - contents_signing_and_custody
  overwrite:
  - base_policy: contents_evt_packout_and_cleaning
    superseded_clause: Truck trips are billed per load
    replaced_by: >-
      For the truck loads that bring a job's contents home, and only for those, the loads and the line amount are figured
      by the return truck-load rule stated here and booked as one move-back line; every other truck trip is still billed per
      load.
  - base_policy: contents_evt_packout_and_cleaning
    superseded_clause: Amounts are quantity times unit rate
    replaced_by: >-
      For the move-back truck line of a return, and only for that line, the amount is figured as stated here; every packout,
      cleaning or disposal line amount is still quantity times unit rate.
  - base_policy: contents_evt_packout_and_cleaning
    superseded_clause: >-
      The job must be in authorized, in_custody or return_scheduled status when a packout, cleaning or disposal line is charged.
    replaced_by: >-
      For the move-back truck line of a return, and only for that line, the line is charged once the job is in returned status;
      every packout, cleaning or disposal line is still charged only while the job is in authorized, in_custody or return_scheduled
      status.
  trigger: state_due
  subject:
  - contents_pack_back_charge
  computes: amount
  target_tool: charge_return_truck_loads_2b0047ce
  params:
    air_ride_volume_threshold: 25
    air_ride_large_pct: 12.0
    air_ride_small_pct: 8.0
    oversized_move_volume_threshold: 2
    oversized_move_each: 140.0
    oversized_move_single: 165.0
    florida_trip_factor: 1.1
    louisiana_trip_factor: 1.05
    site_wait_open: 35.0
    site_wait_invoiced: 15.0
    multifamily_trip_access: 45.0
    condo_trip_access: 30.0
    rounding_epsilon: 1.0e-09
  rule: |
    This policy prices the truck loads that bring the contents of a Partial Contents Packout, Full Contents Packout, High-Value Contents Packout or Commercial Contents and Records Recovery job home, and only those: they are booked as one move-back line with charge code truck_trip once the job is in returned status, dated the job's returned date, at most once per return. For the truck loads that bring a job's contents home, and only for those, the loads and the line amount are figured by the return truck-load rule stated here and booked as one move-back line; every other truck trip is still billed per load. For the move-back truck line of a return, and only for that line, the amount is figured as stated here; every packout, cleaning or disposal line amount is still quantity times unit rate. For the move-back truck line of a return, and only for that line, the line is charged once the job is in returned status; every packout, cleaning or disposal line is still charged only while the job is in authorized, in_custody or return_scheduled status. The standard return truck line is one load for each vault recorded on the job, at the tier's truck trip fee, rounded to the cent, half up. The return loads follow what is left in the vaults: when a disposal haul line stands on the job and the job's signed disposal authorizations list at least one item, the return loads are found by taking the boxes packed less the items listed on signed disposal authorizations, each listed item counting as one packed box, dividing that difference by the tier's vault capacity and rounding up to a whole load, never fewer than one; when no disposal haul line stands on the job and the vault count recorded on the job is greater than the boxes packed divided by the tier's vault capacity and rounded up, the return loads are that rounded-up figure; in every other case the return loads are the vault count recorded on the job. High-value contents ride home in an air-ride truck: when the high-value inventory item quantities on the job's packout lines total at least the air-ride volume threshold, the truck trip fee carries the large air-ride percentage; when they total at least one but fewer than the air-ride volume threshold, it carries the small air-ride percentage; a job with no high-value inventory item carries no air-ride percentage. The company's trip schedule follows the policy state on the job's linked claim file: a policy state of FL carries the Florida trip factor, a policy state of LA carries the Louisiana trip factor, and any other policy state, or a job with no linked claim file, carries a trip factor of one. The company rebuild contract read at the job's loss address is the one at that address on the job's own claim file, or with no claim file when the job has none, and among those the one furthest along, taking a closed contract first, then a final_invoiced, substantially_complete, in_construction, permitted, signed and proposed one in that order; a cancelled contract is never read; the company keeps one rebuild contract per claim file and address, added scope for the same claim and address being written as a change order on it, so no two contracts share that place in the order. Delivering to a property whose rebuild the company has not yet closed out costs crew waiting time, and the wait charge is keyed on the contract's status alone: when the company rebuild contract read at the job's loss address is in substantially_complete status, each return load carries the open-site wait charge; when it is in final_invoiced status, each return load carries the invoiced-site wait charge; in any other status, or with no company rebuild contract read at that address, no wait charge applies. Unit deliveries need elevator or stair booking for each load: when the company rebuild contract read at the job's loss address is for a multifamily_unit property, each return load carries the multifamily access charge; when it is for a condo_unit property, each return load carries the condo access charge; when it is for any other property type, or no company rebuild contract is read at that address, no access charge applies. Items too large for a vault move on a dedicated truck: when the largest oversized item quantity on the job's oversized item storage lines is at least the oversized move threshold, each oversized item carries the per-item oversized move charge; when it is one, the oversized item carries the single oversized move charge; a job with no oversized item storage line carries no oversized move charge. The amounts are combined in one order: the rate per load is the tier's truck trip fee with any percentage applied first, then any factor multiplying that result, then every add per load added; that rate per load is multiplied by the return loads; any amount figured per item is added to that product, and the total is rounded once to the cent, half up, as the line amount.
  prerequisite: []
  cross_category:
  - category: claims
    as: branch
    reads:
    - policy_state
    note: The trip factor's tier is the policy state on the linked claim file.
  - category: rebuild
    as: branch
    reads:
    - status
    - property_type
    note: >-
      The site-wait and access factors take their tiers from the company rebuild contract read at the job's loss address.
  compute:
  - trip_fee: P('truck_trip_fee')
  - capacity: P('vault_capacity_boxes')
  - recorded_vaults: F('vault_count')
  - boxes_packed: F('box_count')
  - haul_lines: COUNT('contents_charges', charge_code='disposal_haul')
  - signed_listed: SUM('contents_disposal_authorizations', 'item_count', authorization_status='signed')
  - capacity_loads: -((-boxes_packed) // capacity)
  - return_loads: >-
      MX(1, -((-(boxes_packed - signed_listed)) // capacity)) if (haul_lines >= 1 and signed_listed > 0) else (capacity_loads
      if (haul_lines == 0 and recorded_vaults > capacity_loads) else recorded_vaults)
  - high_value_items: SUM('contents_charges', 'quantity', charge_code='high_value_inventory_item')
  - air_ride_pct: >-
      K('air_ride_large_pct') if high_value_items >= K('air_ride_volume_threshold') else (K('air_ride_small_pct') if high_value_items
      >= 1 else 0)
  - policy_state: CFIELD('claims', 'policy_state', claim_file_id=F('claim_file_id'))
  - trip_factor: >-
      K('florida_trip_factor') if policy_state == 'FL' else (K('louisiana_trip_factor') if policy_state == 'LA' else 1)
  - rebuild_status: >-
      CFIELD('rebuild', 'status', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='closed') or CFIELD('rebuild',
      'status', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='final_invoiced') or CFIELD('rebuild',
      'status', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='substantially_complete') or CFIELD('rebuild',
      'status', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='in_construction') or CFIELD('rebuild',
      'status', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='permitted') or CFIELD('rebuild',
      'status', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='signed') or CFIELD('rebuild', 'status',
      loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='proposed')
  - site_wait: >-
      K('site_wait_open') if rebuild_status == 'substantially_complete' else (K('site_wait_invoiced') if rebuild_status ==
      'final_invoiced' else 0)
  - rebuild_property: >-
      CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='closed')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='final_invoiced')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='substantially_complete')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='in_construction')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='permitted')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='signed')
      or CFIELD('rebuild', 'property_type', loss_address=F('loss_address'), claim_file_id=F('claim_file_id'), status='proposed')
  - trip_access: >-
      K('multifamily_trip_access') if rebuild_property == 'multifamily_unit' else (K('condo_trip_access') if rebuild_property
      == 'condo_unit' else 0)
  - oversized_items: MAX('contents_charges', 'quantity', charge_code='oversized_item_storage')
  - oversized_move: >-
      oversized_items * K('oversized_move_each') if oversized_items >= K('oversized_move_volume_threshold') else (K('oversized_move_single')
      if oversized_items == 1 else 0)
  - per_load_rate: trip_fee * (1 + air_ride_pct / 100) * trip_factor + site_wait + trip_access
  - result: RND(return_loads * per_load_rate + oversized_move + K('rounding_epsilon'), 2)
  compute_basis:
    trip_fee: >-
      The standard return truck line is one load for each vault recorded on the job, at the tier's truck trip fee, rounded
      to the cent, half up.
    recorded_vaults: >-
      The standard return truck line is one load for each vault recorded on the job, at the tier's truck trip fee, rounded
      to the cent, half up.
    haul_lines: >-
      when a disposal haul line stands on the job and the job's signed disposal authorizations list at least one item
    signed_listed: >-
      taking the boxes packed less the items listed on signed disposal authorizations, each listed item counting as one packed
      box
    capacity_loads: >-
      the vault count recorded on the job is greater than the boxes packed divided by the tier's vault capacity and rounded
      up
    return_loads: >-
      The return loads follow what is left in the vaults: when a disposal haul line stands on the job and the job's signed
      disposal authorizations list at least one item, the return loads are found by taking the boxes packed less the items
      listed on signed disposal authorizations, each listed item counting as one packed box, dividing that difference by the
      tier's vault capacity and rounding up to a whole load, never fewer than one; when no disposal haul line stands on the
      job and the vault count recorded on the job is greater than the boxes packed divided by the tier's vault capacity and
      rounded up, the return loads are that rounded-up figure; in every other case the return loads are the vault count recorded
      on the job.
    high_value_items: >-
      when the high-value inventory item quantities on the job's packout lines total at least the air-ride volume threshold
    air_ride_pct: >-
      High-value contents ride home in an air-ride truck: when the high-value inventory item quantities on the job's packout
      lines total at least the air-ride volume threshold, the truck trip fee carries the large air-ride percentage; when they
      total at least one but fewer than the air-ride volume threshold, it carries the small air-ride percentage; a job with
      no high-value inventory item carries no air-ride percentage.
    policy_state: The company's trip schedule follows the policy state on the job's linked claim file
    trip_factor: >-
      a policy state of FL carries the Florida trip factor, a policy state of LA carries the Louisiana trip factor, and any
      other policy state, or a job with no linked claim file, carries a trip factor of one.
    rebuild_status: >-
      The company rebuild contract read at the job's loss address is the one at that address on the job's own claim file,
      or with no claim file when the job has none, and among those the one furthest along, taking a closed contract first,
      then a final_invoiced, substantially_complete, in_construction, permitted, signed and proposed one in that order; a
      cancelled contract is never read; the company keeps one rebuild contract per claim file and address, added scope for
      the same claim and address being written as a change order on it, so no two contracts share that place in the order.
    site_wait: >-
      Delivering to a property whose rebuild the company has not yet closed out costs crew waiting time, and the wait charge
      is keyed on the contract's status alone: when the company rebuild contract read at the job's loss address is in substantially_complete
      status, each return load carries the open-site wait charge; when it is in final_invoiced status, each return load carries
      the invoiced-site wait charge; in any other status, or with no company rebuild contract read at that address, no wait
      charge applies.
    rebuild_property: >-
      The company rebuild contract read at the job's loss address is the one at that address on the job's own claim file,
      or with no claim file when the job has none, and among those the one furthest along, taking a closed contract first,
      then a final_invoiced, substantially_complete, in_construction, permitted, signed and proposed one in that order; a
      cancelled contract is never read; the company keeps one rebuild contract per claim file and address, added scope for
      the same claim and address being written as a change order on it, so no two contracts share that place in the order.
    trip_access: >-
      Unit deliveries need elevator or stair booking for each load: when the company rebuild contract read at the job's loss
      address is for a multifamily_unit property, each return load carries the multifamily access charge; when it is for a
      condo_unit property, each return load carries the condo access charge; when it is for any other property type, or no
      company rebuild contract is read at that address, no access charge applies.
    oversized_items: >-
      when the largest oversized item quantity on the job's oversized item storage lines is at least the oversized move threshold
    oversized_move: >-
      Items too large for a vault move on a dedicated truck: when the largest oversized item quantity on the job's oversized
      item storage lines is at least the oversized move threshold, each oversized item carries the per-item oversized move
      charge; when it is one, the oversized item carries the single oversized move charge; a job with no oversized item storage
      line carries no oversized move charge.
    per_load_rate: >-
      the rate per load is the tier's truck trip fee with any percentage applied first, then any factor multiplying that result,
      then every add per load added
    result: >-
      that rate per load is multiplied by the return loads; any amount figured per item is added to that product, and the
      total is rounded once to the cent, half up, as the line amount.
    capacity: >-
      the vault count recorded on the job is greater than the boxes packed divided by the tier's vault capacity and rounded
      up
    boxes_packed: >-
      the vault count recorded on the job is greater than the boxes packed divided by the tier's vault capacity and rounded
      up
  factors:
  - id: return_load_count
    effect: method
    decides: return_loads
    bindings:
    - capacity
    - boxes_packed
    - haul_lines
    - signed_listed
    - capacity_loads
    - return_loads
    ladder:
    - when: >-
        a disposal haul line stands on the job and the job's signed disposal authorizations list at least one item
      method: >-
        the boxes packed less the items listed on signed authorizations, divided by the tier's vault capacity, rounded up
        to a whole load, never fewer than one
    - when: >-
        no disposal haul line stands on the job and the vault count recorded on the job is greater than the boxes packed divided
        by the tier's vault capacity, rounded up
      method: the boxes packed divided by the tier's vault capacity, rounded up
    - when: otherwise
      method: the vault count recorded on the job
    baseline:
      return_loads: recorded_vaults
    evidence:
    - history
    cross_difficulty: null
  - id: air_ride_truck
    effect: parameter
    decides: air_ride_pct
    bindings:
    - high_value_items
    - air_ride_pct
    ladder:
    - when: >-
        the high-value inventory item quantities on the packout lines total at least the air-ride volume threshold
      value: K('air_ride_large_pct')
    - when: they total at least one but fewer than the air-ride volume threshold
      value: K('air_ride_small_pct')
    - when: otherwise (no high-value inventory item)
      value: '0'
    baseline:
      air_ride_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: state_trip_schedule
    effect: parameter
    decides: trip_factor
    bindings:
    - policy_state
    - trip_factor
    ladder:
    - when: the policy state on the job's linked claim file is FL
      value: K('florida_trip_factor')
    - when: the policy state on the job's linked claim file is LA
      value: K('louisiana_trip_factor')
    - when: otherwise (any other policy state, or no linked claim file)
      value: '1'
    baseline:
      trip_factor: '1'
    evidence:
    - cross_category
    cross_difficulty: claims
  - id: rebuild_site_wait
    effect: parameter
    decides: site_wait
    bindings:
    - rebuild_status
    - site_wait
    ladder:
    - when: the company rebuild contract read at the job's loss address is in substantially_complete status
      value: K('site_wait_open')
    - when: it is in final_invoiced status
      value: K('site_wait_invoiced')
    - when: otherwise (any other status, or no company rebuild contract at the address)
      value: '0'
    baseline:
      site_wait: '0'
    evidence:
    - cross_category
    cross_difficulty: rebuild
  - id: unit_delivery_access
    effect: parameter
    decides: trip_access
    bindings:
    - rebuild_property
    - trip_access
    ladder:
    - when: the company rebuild contract read at the job's loss address is for a multifamily_unit property
      value: K('multifamily_trip_access')
    - when: it is for a condo_unit property
      value: K('condo_trip_access')
    - when: otherwise (any other property type, or no company rebuild contract at the address)
      value: '0'
    baseline:
      trip_access: '0'
    evidence:
    - cross_category
    cross_difficulty: rebuild
  - id: oversized_move_truck
    effect: parameter
    decides: oversized_move
    bindings:
    - oversized_items
    - oversized_move
    ladder:
    - when: >-
        the largest oversized item quantity on the oversized item storage lines is at least the oversized move threshold
      value: oversized_items * K('oversized_move_each')
    - when: it is one
      value: K('oversized_move_single')
    - when: otherwise (no oversized item storage line)
      value: '0'
    baseline:
      oversized_move: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The standard return truck line is one load for each vault recorded on the job, at the tier's truck trip fee, rounded
      to the cent, half up.
    params:
    - truck_trip_fee
  inputs:
    history:
    - table: contents_charges
      aggregate: count
      field: contents_charge_id
      filters:
        charge_code: disposal_haul
    - table: contents_disposal_authorizations
      aggregate: sum
      field: item_count
      filters:
        authorization_status: signed
    - table: contents_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: high_value_inventory_item
    - table: contents_charges
      aggregate: max
      field: quantity
      filters:
        charge_code: oversized_item_storage
    cross_category:
    - claims
    - rebuild
- id: contents_ext_closing_payment
  base_policy_refs:
  - contents_evt_customer_payment
  - contents_evt_storage
  - contents_evt_insurance_payment
  - contents_evt_custody_credit
  - contents_evt_adjustment
  - contents_agg_one_job_per_address
  overwrite: []
  trigger: on_request
  subject:
  - contents_customer_payment
  computes: amount
  target_tool: pay_contents_closing_balance_f918d993
  params:
    rounding_epsilon: 1.0e-09
  rule: |
    This policy fixes the amount of the customer's own closing payment on an insurance-funded Partial Contents Packout, Full Contents Packout, High-Value Contents Packout or Commercial Contents and Records Recovery job in returned or invoiced status whose linked claim file is on an arrangement other than Homeowner Direct Pay Claim Support, and only that payment, while no storage line billed to customer on the job has stayed unpaid longer than the tier's referral days counted from the first day of its period, customer payments settling the oldest storage and declared-value coverage lines billed to customer first; an account past that point is referred under the base storage rule, a payment on a job the customer's-share rule governs follows that rule, and a payment on any other job is posted in full as tendered under the base payment rule. The customer makes the closing payment personally through the company's secure payment channel, and staff never take card or bank details; a credit card payment carries the credit card surcharge percentage of the payment amount, booked with the payment as its own line under the base payment rule. The closing payment is not figured until the job carries the pack-back box line owed for its return. The closing payment is not taken until the furniture reset line owed for the return stands on the job. The closing payment is fixed only after the truck loads that brought the contents home stand on the job as a move-back line. The standard closing payment is the storage and declared-value coverage lines on the job billed to customer, plus the card surcharge and late fee lines on the job, less the customer payments posted to the job net of the refunds returned from them, less the billing_error and duplicate_line adjustment credits on the job, rounded to the cent, half up, and never below zero. The carrier pays contents work only up to the contents scope it approved, and approves storage separately by date: the contents work charged is every charge line on the job other than storage, declared-value coverage, card surcharge and late fee lines, and the approved contents scope is the total of the carrier's contents-coverage scope approvals on the linked claim file, and the most recent supplement request of a reason is the one of that reason carrying the highest supplement number on the file; when the claim file is in approved or settled status and the most recent contents_added supplement request on its contents coverage is named by no carrier approval, the closing payment carries the contents work charged less the approved contents scope less the amount that request asks for, never below zero; when the claim file is in approved or settled status, no such request awaits a decision and more days than the arrangement's supplement window have passed since the carrier's initial approval date, it carries the contents work charged less the approved contents scope, never below zero; in every other case nothing is added. Carrier money is the insured's to pass on where the carrier does not pay the company: when the linked claim file is in denied or withdrawn status, the closing payment carries every charge line on the job other than lines billed to customer, card surcharge lines and late fee lines, less the insurance postings on the job, never below zero; when the claim file is in any other status and contents-coverage carrier payments other than depreciation releases issued insured_only are recorded on it, the closing payment carries the lesser of two amounts, the first being those payments and the second being the approved contents scope less the carrier_denied_line write-offs on the contents coverage less the insurance postings on the job, never below zero; in every other case nothing is added. Lines the carrier declined on the contents coverage stay with the customer where the arrangement bills them: the closing payment carries the carrier_denied_line write-offs recorded on the contents coverage less the disputed amount, never below zero; the disputed amount is the amount the most recent contents-coverage price_variance supplement request asks for when the arrangement bills denied lines to the customer and that request is named by no carrier approval, it is nothing when the arrangement bills denied lines to the customer and no such request awaits a decision, and in every other case it is the whole of those write-offs. The carrier pays storage only through the approved storage end date: the closing payment carries the job's most recent vault, climate vault and oversized item storage lines billed to insurance_claim, taken together, times the unpaid storage days, divided by the tier's period length; the unpaid storage days are counted from the day after a cut-off date through the last day of the storage period that contains that date, and the storage extension request read is the one for this job that asks for the latest end date; when the approved storage end date falls before today and before the last day of its storage period and that request asks for an end date later than the approved storage end date and inside the same period, the cut-off is the requested end date; when the approved storage end date falls before today and before the last day of its storage period and no request for this job asks for an end date later than the approved storage end date, the cut-off is the approved storage end date; in every other case there are no unpaid storage days. Recoverable depreciation the carrier withheld on the contents coverage and will not pay the company stays with the customer: when the arrangement bills denied lines to the customer and depreciation_forfeited write-offs on the contents coverage are recorded on the linked claim file, the closing payment carries those write-offs; when that does not hold and depreciation releases on the contents coverage were issued insured_only, it carries those releases, which the insured pays the company from; in every other case nothing is added. Compensation the company owes the customer is netted: when custody credits stand on the job, the goodwill on the job belongs to that damage settlement, and the closing payment is reduced by every custody credit and every goodwill adjustment credit on the job; when no custody credit stands and at least one goodwill adjustment credit does, that goodwill is a courtesy on the customer's own charges and never relieves the carrier, the customer's own charges being the lines billed to customer, card surcharge lines and late fee lines, and the closing payment is reduced by the lesser of those goodwill credits and the customer's own charges; otherwise nothing is netted. The closing payment amount is found by adding to the standard closing payment, before its rounding and before its floor at zero, every amount the closing payment carries, taking away every amount netted, and rounding that total once to the cent, half up, never below zero.
  prerequisite:
  - problem: contents_ext_pack_back_box_line
    kind: value_input
    gate: excess_share
    form: state
    policy_source: The closing payment is not figured until the job carries the pack-back box line owed for its return.
    condition: The job, in returned status, carries a pack_back_box line dated its returned date.
    resolved_by: charge_pack_back_boxes_26b5c86b
    effect: >-
      Once the pack-back box line stands, the contents work charged rises by its amount, and where the contents work charged
      exceeds the approved contents scope after the supplement window, the amount the closing payment carries above that scope
      rises with it.
  - problem: contents_ext_furniture_reset_line
    kind: value_input
    gate: excess_share
    form: state
    policy_source: >-
      The closing payment is not taken until the furniture reset line owed for the return stands on the job.
    condition: The job, in returned status, carries a furniture_reset line dated its returned date.
    resolved_by: charge_furniture_reset_9904d302
    effect: >-
      Once the furniture reset line stands, the contents work charged rises by its amount, and so does any amount carried
      above the approved contents scope.
  - problem: contents_ext_return_truck_loads
    kind: value_input
    gate: excess_share
    form: state
    policy_source: >-
      The closing payment is fixed only after the truck loads that brought the contents home stand on the job as a move-back
      line.
    condition: >-
      The job, in returned status, carries a move-back line with charge code truck_trip dated its returned date.
    resolved_by: charge_return_truck_loads_2b0047ce
    effect: >-
      Once the move-back truck line stands, the contents work charged rises by its amount, and so does any amount carried
      above the approved contents scope.
  cross_category:
  - category: claims
    as: history
    reads:
    - status
    - approved_date
    - approved_storage_end_date
    - denied_line_billable_to_customer
    - supplement_window_days
    - claims_approvals.amount
    - claims_approvals.claim_request_id
    - claims_payments.amount
    - claims_requests.requested_amount
    - claims_requests.claim_request_id
    - claims_requests.requested_storage_end_date
    - claims_requests.supplement_number
    note: >-
      The scope-overrun, insured-proceeds, declined-lines, unpaid-storage-days and withheld-depreciation factors read the
      linked claim file and its approvals, write-offs, carrier payments and requests.
  compute:
  - period_days: P('storage_period_days')
  - customer_lines: SUM('contents_charges', 'amount', event_type='contents_storage_charge', bill_to='customer')
  - other_customer_lines: >-
      SUM('contents_charges', 'amount', event_type='contents_card_surcharge') + SUM('contents_charges', 'amount', event_type='contents_late_fee')
  - payments_posted: >-
      SUM('contents_payments', 'amount', event_type='contents_customer_payment') - SUM('contents_payments', 'amount', event_type='contents_refund')
  - corrections: >-
      SUM('contents_payments', 'amount', event_type='contents_adjustment_credit', adjustment_reason='billing_error') + SUM('contents_payments',
      'amount', event_type='contents_adjustment_credit', adjustment_reason='duplicate_line')
  - overrun_status: CFIELD('claims', 'status', claim_file_id=F('claim_file_id'))
  - work_all_lines: SUM('contents_charges', 'amount')
  - work_excluded_lines: >-
      SUM('contents_charges', 'amount', event_type='contents_storage_charge') + SUM('contents_charges', 'amount', event_type='contents_card_surcharge')
      + SUM('contents_charges', 'amount', event_type='contents_late_fee')
  - work_charged: work_all_lines - work_excluded_lines
  - overrun_scope: >-
      XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_scope_approval', coverage_part='contents')
  - latest_added_number: >-
      XMAX('claims', 'claims_requests', 'supplement_number', claim_file_id=F('claim_file_id'), event_type='claims_supplement_submit',
      coverage_part='contents', supplement_reason='contents_added')
  - latest_added_request: >-
      XLATEST('claims', 'claims_requests', 'claim_request_id', date_field='request_date', claim_file_id=F('claim_file_id'),
      event_type='claims_supplement_submit', coverage_part='contents', supplement_reason='contents_added', supplement_number=int(latest_added_number))
      if latest_added_number > 0 else None
  - latest_added_decided: >-
      XCOUNT('claims', 'claims_approvals', claim_request_id=latest_added_request) if latest_added_request else 0
  - awaiting_amount: >-
      XLATEST('claims', 'claims_requests', 'requested_amount', date_field='request_date', claim_file_id=F('claim_file_id'),
      event_type='claims_supplement_submit', coverage_part='contents', supplement_reason='contents_added', supplement_number=int(latest_added_number))
      if (latest_added_request and latest_added_decided == 0) else 0
  - approved_on: CFIELD('claims', 'approved_date', claim_file_id=F('claim_file_id'))
  - supplement_window: CPARAM('claims', 'supplement_window_days', claim_file_id=F('claim_file_id'))
  - window_passed: approved_on and supplement_window != None and DAYS(approved_on, NOW) > supplement_window
  - excess_share: >-
      MX(0, work_charged - overrun_scope - awaiting_amount) if ((overrun_status == 'approved' or overrun_status == 'settled')
      and awaiting_amount > 0) else (MX(0, work_charged - overrun_scope) if ((overrun_status == 'approved' or overrun_status
      == 'settled') and awaiting_amount == 0 and window_passed) else 0)
  - proceeds_status: CFIELD('claims', 'status', claim_file_id=F('claim_file_id'))
  - proceeds_all_lines: >-
      SUM('contents_charges', 'amount') - SUM('contents_charges', 'amount', event_type='contents_storage_charge', bill_to='customer')
      - SUM('contents_charges', 'amount', event_type='contents_card_surcharge') - SUM('contents_charges', 'amount', event_type='contents_late_fee')
  - proceeds_postings: SUM('contents_payments', 'amount', event_type='contents_insurance_payment')
  - proceeds_scope: >-
      XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_scope_approval', coverage_part='contents')
  - proceeds_writeoffs: >-
      XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_receivable_writeoff',
      writeoff_reason='carrier_denied_line', coverage_part='contents')
  - insured_only_paid: >-
      XSUM('claims', 'claims_payments', 'amount', claim_file_id=F('claim_file_id'), coverage_part='contents', payee_route='insured_only')
      - XSUM('claims', 'claims_payments', 'amount', claim_file_id=F('claim_file_id'), coverage_part='contents', payee_route='insured_only',
      payment_type='depreciation_release')
  - proceeds_share: >-
      MX(0, proceeds_all_lines - proceeds_postings) if (proceeds_status == 'denied' or proceeds_status == 'withdrawn') else
      (MN(insured_only_paid, MX(0, proceeds_scope - proceeds_writeoffs - proceeds_postings)) if insured_only_paid > 0 else
      0)
  - denied_billable: CPARAM('claims', 'denied_line_billable_to_customer', claim_file_id=F('claim_file_id'))
  - denied_writeoffs: >-
      XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_receivable_writeoff',
      writeoff_reason='carrier_denied_line', coverage_part='contents')
  - price_number: >-
      XMAX('claims', 'claims_requests', 'supplement_number', claim_file_id=F('claim_file_id'), event_type='claims_supplement_submit',
      coverage_part='contents', supplement_reason='price_variance')
  - price_request: >-
      XLATEST('claims', 'claims_requests', 'claim_request_id', date_field='request_date', claim_file_id=F('claim_file_id'),
      event_type='claims_supplement_submit', coverage_part='contents', supplement_reason='price_variance', supplement_number=int(price_number))
      if price_number > 0 else None
  - price_decided: XCOUNT('claims', 'claims_approvals', claim_request_id=price_request) if price_request else 0
  - price_supplements: >-
      XLATEST('claims', 'claims_requests', 'requested_amount', date_field='request_date', claim_file_id=F('claim_file_id'),
      event_type='claims_supplement_submit', coverage_part='contents', supplement_reason='price_variance', supplement_number=int(price_number))
      if (price_request and price_decided == 0) else 0
  - disputed_amount: >-
      price_supplements if (denied_billable == True and price_supplements > 0) else (0 if denied_billable == True else denied_writeoffs)
  - declined_share: MX(0, denied_writeoffs - disputed_amount)
  - insurer_storage_lines: >-
      (LATEST('contents_charges', 'amount', date_field='storage_period_start', charge_code='vault_storage', bill_to='insurance_claim')
      or 0) + (LATEST('contents_charges', 'amount', date_field='storage_period_start', charge_code='climate_vault_storage',
      bill_to='insurance_claim') or 0) + (LATEST('contents_charges', 'amount', date_field='storage_period_start', charge_code='oversized_item_storage',
      bill_to='insurance_claim') or 0)
  - approved_end: CFIELD('claims', 'approved_storage_end_date', claim_file_id=F('claim_file_id'))
  - end_offset: DAYS(F('custody_start_date'), approved_end) if (approved_end and approved_end < NOW) else -1
  - days_after_end: period_days * (end_offset // period_days + 1) - end_offset - 1 if end_offset >= 0 else 0
  - requested_end: >-
      XLATEST('claims', 'claims_requests', 'requested_storage_end_date', date_field='requested_storage_end_date', claim_file_id=F('claim_file_id'),
      event_type='claims_storage_extension_request', related_job_id=HID)
  - later_request: requested_end and approved_end and requested_end > approved_end
  - requested_offset: DAYS(F('custody_start_date'), requested_end) if later_request else -1
  - request_same_period: later_request and end_offset >= 0 and requested_offset // period_days == end_offset // period_days
  - days_after_request: >-
      period_days * (requested_offset // period_days + 1) - requested_offset - 1 if request_same_period else 0
  - unpaid_storage_days: >-
      days_after_request if (request_same_period and days_after_end > 0) else (days_after_end if ((not later_request) and
      days_after_end > 0) else 0)
  - uncovered_share: insurer_storage_lines * unpaid_storage_days / period_days
  - custody_credits: SUM('contents_payments', 'amount', event_type='contents_custody_credit')
  - goodwill_credits: >-
      SUM('contents_payments', 'amount', event_type='contents_adjustment_credit', adjustment_reason='goodwill')
  - own_charges: >-
      SUM('contents_charges', 'amount', event_type='contents_storage_charge', bill_to='customer') + SUM('contents_charges',
      'amount', event_type='contents_card_surcharge') + SUM('contents_charges', 'amount', event_type='contents_late_fee')
  - credits_netted: >-
      custody_credits + goodwill_credits if custody_credits > 0 else (MN(goodwill_credits, own_charges) if goodwill_credits
      > 0 else 0)
  - depreciation_billable: CPARAM('claims', 'denied_line_billable_to_customer', claim_file_id=F('claim_file_id'))
  - depreciation_forfeited: >-
      XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_receivable_writeoff',
      writeoff_reason='depreciation_forfeited', coverage_part='contents')
  - depreciation_released_insured: >-
      XSUM('claims', 'claims_payments', 'amount', claim_file_id=F('claim_file_id'), coverage_part='contents', payee_route='insured_only',
      payment_type='depreciation_release')
  - depreciation_share: >-
      depreciation_forfeited if (depreciation_billable == True and depreciation_forfeited > 0) else (depreciation_released_insured
      if depreciation_released_insured > 0 else 0)
  - result: >-
      RND(MX(0, customer_lines + other_customer_lines - payments_posted - corrections + excess_share + proceeds_share + declined_share
      + uncovered_share + depreciation_share - credits_netted) + K('rounding_epsilon'), 2)
  compute_basis:
    period_days: divided by the tier's period length
    customer_lines: >-
      The standard closing payment is the storage and declared-value coverage lines on the job billed to customer, plus the
      card surcharge and late fee lines on the job, less the customer payments posted to the job net of the refunds returned
      from them, less the billing_error and duplicate_line adjustment credits on the job, rounded to the cent, half up, and
      never below zero.
    other_customer_lines: >-
      The standard closing payment is the storage and declared-value coverage lines on the job billed to customer, plus the
      card surcharge and late fee lines on the job, less the customer payments posted to the job net of the refunds returned
      from them, less the billing_error and duplicate_line adjustment credits on the job, rounded to the cent, half up, and
      never below zero.
    payments_posted: >-
      The standard closing payment is the storage and declared-value coverage lines on the job billed to customer, plus the
      card surcharge and late fee lines on the job, less the customer payments posted to the job net of the refunds returned
      from them, less the billing_error and duplicate_line adjustment credits on the job, rounded to the cent, half up, and
      never below zero.
    overrun_status: >-
      when the claim file is in approved or settled status and the most recent contents_added supplement request on its contents
      coverage is named by no carrier approval
    work_all_lines: >-
      the contents work charged is every charge line on the job other than storage, declared-value coverage, card surcharge
      and late fee lines
    work_excluded_lines: >-
      the contents work charged is every charge line on the job other than storage, declared-value coverage, card surcharge
      and late fee lines
    work_charged: >-
      the contents work charged is every charge line on the job other than storage, declared-value coverage, card surcharge
      and late fee lines
    overrun_scope: >-
      the approved contents scope is the total of the carrier's contents-coverage scope approvals on the linked claim file
    latest_added_number: >-
      the most recent supplement request of a reason is the one of that reason carrying the highest supplement number on the
      file
    latest_added_request: >-
      the most recent contents_added supplement request on its contents coverage is named by no carrier approval
    latest_added_decided: >-
      the most recent contents_added supplement request on its contents coverage is named by no carrier approval
    awaiting_amount: >-
      the closing payment carries the contents work charged less the approved contents scope less the amount that request
      asks for, never below zero
    approved_on: >-
      more days than the arrangement's supplement window have passed since the carrier's initial approval date
    supplement_window: >-
      more days than the arrangement's supplement window have passed since the carrier's initial approval date
    window_passed: >-
      more days than the arrangement's supplement window have passed since the carrier's initial approval date
    excess_share: >-
      The carrier pays contents work only up to the contents scope it approved, and approves storage separately by date: the
      contents work charged is every charge line on the job other than storage, declared-value coverage, card surcharge and
      late fee lines, and the approved contents scope is the total of the carrier's contents-coverage scope approvals on the
      linked claim file, and the most recent supplement request of a reason is the one of that reason carrying the highest
      supplement number on the file; when the claim file is in approved or settled status and the most recent contents_added
      supplement request on its contents coverage is named by no carrier approval, the closing payment carries the contents
      work charged less the approved contents scope less the amount that request asks for, never below zero; when the claim
      file is in approved or settled status, no such request awaits a decision and more days than the arrangement's supplement
      window have passed since the carrier's initial approval date, it carries the contents work charged less the approved
      contents scope, never below zero; in every other case nothing is added.
    proceeds_status: when the linked claim file is in denied or withdrawn status
    proceeds_all_lines: >-
      the closing payment carries every charge line on the job other than lines billed to customer, card surcharge lines and
      late fee lines, less the insurance postings on the job, never below zero
    proceeds_postings: less the insurance postings on the job, never below zero
    proceeds_scope: >-
      the second being the approved contents scope less the carrier_denied_line write-offs on the contents coverage less the
      insurance postings on the job, never below zero
    proceeds_writeoffs: >-
      the second being the approved contents scope less the carrier_denied_line write-offs on the contents coverage less the
      insurance postings on the job, never below zero
    insured_only_paid: >-
      when the claim file is in any other status and contents-coverage carrier payments other than depreciation releases issued
      insured_only are recorded on it
    proceeds_share: >-
      Carrier money is the insured's to pass on where the carrier does not pay the company: when the linked claim file is
      in denied or withdrawn status, the closing payment carries every charge line on the job other than lines billed to customer,
      card surcharge lines and late fee lines, less the insurance postings on the job, never below zero; when the claim file
      is in any other status and contents-coverage carrier payments other than depreciation releases issued insured_only are
      recorded on it, the closing payment carries the lesser of two amounts, the first being those payments and the second
      being the approved contents scope less the carrier_denied_line write-offs on the contents coverage less the insurance
      postings on the job, never below zero; in every other case nothing is added.
    denied_billable: >-
      when the arrangement bills denied lines to the customer and that request is named by no carrier approval
    denied_writeoffs: >-
      the closing payment carries the carrier_denied_line write-offs recorded on the contents coverage less the disputed amount,
      never below zero
    price_supplements: >-
      the amount the most recent contents-coverage price_variance supplement request asks for when the arrangement bills denied
      lines to the customer and that request is named by no carrier approval
    disputed_amount: >-
      the disputed amount is the amount the most recent contents-coverage price_variance supplement request asks for when
      the arrangement bills denied lines to the customer and that request is named by no carrier approval, it is nothing when
      the arrangement bills denied lines to the customer and no such request awaits a decision, and in every other case it
      is the whole of those write-offs.
    declined_share: >-
      the closing payment carries the carrier_denied_line write-offs recorded on the contents coverage less the disputed amount,
      never below zero
    insurer_storage_lines: >-
      the closing payment carries the job's most recent vault, climate vault and oversized item storage lines billed to insurance_claim,
      taken together, times the unpaid storage days, divided by the tier's period length
    approved_end: The carrier pays storage only through the approved storage end date
    end_offset: when the approved storage end date falls before today and before the last day of its storage period
    days_after_end: >-
      the unpaid storage days are counted from the day after a cut-off date through the last day of the storage period that
      contains that date
    requested_end: the storage extension request read is the one for this job that asks for the latest end date
    later_request: >-
      that request asks for an end date later than the approved storage end date and inside the same period
    requested_offset: >-
      that request asks for an end date later than the approved storage end date and inside the same period
    request_same_period: >-
      that request asks for an end date later than the approved storage end date and inside the same period
    days_after_request: >-
      the unpaid storage days are counted from the day after a cut-off date through the last day of the storage period that
      contains that date
    unpaid_storage_days: >-
      when the approved storage end date falls before today and before the last day of its storage period and that request
      asks for an end date later than the approved storage end date and inside the same period, the cut-off is the requested
      end date; when the approved storage end date falls before today and before the last day of its storage period and no
      request for this job asks for an end date later than the approved storage end date, the cut-off is the approved storage
      end date; in every other case there are no unpaid storage days.
    uncovered_share: >-
      the closing payment carries the job's most recent vault, climate vault and oversized item storage lines billed to insurance_claim,
      taken together, times the unpaid storage days, divided by the tier's period length
    custody_credits: >-
      when custody credits stand on the job, the goodwill on the job belongs to that damage settlement, and the closing payment
      is reduced by every custody credit and every goodwill adjustment credit on the job
    goodwill_credits: >-
      when no custody credit stands and at least one goodwill adjustment credit does, that goodwill is a courtesy on the customer's
      own charges and never relieves the carrier
    credits_netted: >-
      Compensation the company owes the customer is netted: when custody credits stand on the job, the goodwill on the job
      belongs to that damage settlement, and the closing payment is reduced by every custody credit and every goodwill adjustment
      credit on the job; when no custody credit stands and at least one goodwill adjustment credit does, that goodwill is
      a courtesy on the customer's own charges and never relieves the carrier, the customer's own charges being the lines
      billed to customer, card surcharge lines and late fee lines, and the closing payment is reduced by the lesser of those
      goodwill credits and the customer's own charges; otherwise nothing is netted.
    result: >-
      The closing payment amount is found by adding to the standard closing payment, before its rounding and before its floor
      at zero, every amount the closing payment carries, taking away every amount netted, and rounding that total once to
      the cent, half up, never below zero.
    own_charges: >-
      the customer's own charges being the lines billed to customer, card surcharge lines and late fee lines
    price_number: >-
      the most recent supplement request of a reason is the one of that reason carrying the highest supplement number on the
      file
    price_request: >-
      the amount the most recent contents-coverage price_variance supplement request asks for when the arrangement bills denied
      lines to the customer and that request is named by no carrier approval
    price_decided: >-
      the amount the most recent contents-coverage price_variance supplement request asks for when the arrangement bills denied
      lines to the customer and that request is named by no carrier approval
    corrections: less the billing_error and duplicate_line adjustment credits on the job
    depreciation_billable: >-
      when the arrangement bills denied lines to the customer and depreciation_forfeited write-offs on the contents coverage
      are recorded on the linked claim file, the closing payment carries those write-offs
    depreciation_forfeited: >-
      when the arrangement bills denied lines to the customer and depreciation_forfeited write-offs on the contents coverage
      are recorded on the linked claim file, the closing payment carries those write-offs
    depreciation_released_insured: >-
      when that does not hold and depreciation releases on the contents coverage were issued insured_only, it carries those
      releases, which the insured pays the company from
    depreciation_share: >-
      Recoverable depreciation the carrier withheld on the contents coverage and will not pay the company stays with the customer:
      when the arrangement bills denied lines to the customer and depreciation_forfeited write-offs on the contents coverage
      are recorded on the linked claim file, the closing payment carries those write-offs; when that does not hold and depreciation
      releases on the contents coverage were issued insured_only, it carries those releases, which the insured pays the company
      from; in every other case nothing is added.
  factors:
  - id: contents_scope_overrun
    effect: method
    decides: excess_share
    bindings:
    - overrun_status
    - work_all_lines
    - work_excluded_lines
    - work_charged
    - overrun_scope
    - latest_added_number
    - latest_added_request
    - latest_added_decided
    - awaiting_amount
    - approved_on
    - supplement_window
    - window_passed
    - excess_share
    ladder:
    - when: >-
        the claim file is in approved or settled status and the most recent contents_added supplement request on the contents
        coverage is named by no carrier approval
      method: >-
        the contents work charged less the approved contents scope less the amount that request asks for, never below zero
    - when: >-
        the claim file is in approved or settled status, no such request awaits a decision and more days than the supplement
        window have passed since the initial approval date
      method: the contents work charged less the approved contents scope, never below zero
    - when: otherwise
      method: nothing is added
    baseline:
      excess_share: '0'
    evidence:
    - cross_category
    - date
    - history
    cross_difficulty: claims
  - id: insured_money_pass_on
    effect: method
    decides: proceeds_share
    bindings:
    - proceeds_status
    - proceeds_all_lines
    - proceeds_postings
    - proceeds_scope
    - proceeds_writeoffs
    - insured_only_paid
    - proceeds_share
    ladder:
    - when: the linked claim file is in denied or withdrawn status
      method: >-
        every charge line other than customer lines, surcharges and late fees, less the insurance postings, never below zero
    - when: >-
        the claim file is in any other status and contents-coverage carrier payments other than depreciation releases issued
        insured_only are recorded on it
      method: >-
        the lesser of those payments and the approved contents scope less the carrier_denied_line write-offs less the insurance
        postings, never below zero
    - when: otherwise
      method: nothing is added
    baseline:
      proceeds_share: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: claims
  - id: declined_lines_dispute
    effect: parameter
    decides: disputed_amount
    bindings:
    - denied_billable
    - denied_writeoffs
    - price_number
    - price_request
    - price_decided
    - price_supplements
    - disputed_amount
    - declined_share
    ladder:
    - when: >-
        the arrangement bills denied lines to the customer and the most recent contents-coverage price_variance supplement
        request is named by no carrier approval
      value: price_supplements (the amount that request asks for)
    - when: the arrangement bills denied lines to the customer and no such request awaits a decision
      value: '0'
    - when: otherwise (the arrangement does not bill denied lines to the customer, or no linked claim file)
      value: denied_writeoffs (the whole of the write-offs)
    baseline:
      disputed_amount: denied_writeoffs
      declined_share: '0'
    evidence:
    - cross_category
    cross_difficulty: claims
  - id: unpaid_storage_tail
    effect: parameter
    decides: unpaid_storage_days
    bindings:
    - period_days
    - insurer_storage_lines
    - approved_end
    - end_offset
    - days_after_end
    - requested_end
    - later_request
    - requested_offset
    - request_same_period
    - days_after_request
    - unpaid_storage_days
    - uncovered_share
    ladder:
    - when: >-
        the approved storage end date falls before today and before the last day of its storage period, and the request for
        this job asking the latest end date asks for one later than it and inside the same period
      value: the days after the requested end date through the period's last day
    - when: >-
        the approved storage end date falls before today and before the last day of its storage period, and no request for
        this job asks for a later end date
      value: the days after the approved storage end date through the period's last day
    - when: otherwise
      value: '0'
    baseline:
      unpaid_storage_days: '0'
      uncovered_share: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: claims
  - id: owed_compensation_netting
    effect: method
    decides: credits_netted
    bindings:
    - custody_credits
    - goodwill_credits
    - own_charges
    - credits_netted
    ladder:
    - when: custody credits stand on the job
      method: every custody credit and every goodwill adjustment credit is netted in full
    - when: no custody credit stands and at least one goodwill adjustment credit does
      method: the lesser of the goodwill credits and the customer's own charges is netted
    - when: otherwise
      method: nothing is netted
    baseline:
      credits_netted: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: withheld_depreciation_carry
    effect: parameter
    decides: depreciation_share
    bindings:
    - depreciation_billable
    - depreciation_forfeited
    - depreciation_released_insured
    - depreciation_share
    ladder:
    - when: >-
        the arrangement bills denied lines to the customer and depreciation_forfeited write-offs on the contents coverage
        are recorded on the linked claim file
      value: depreciation_forfeited (those write-offs)
    - when: that does not hold and depreciation releases on the contents coverage were issued insured_only
      value: depreciation_released_insured (those releases)
    - when: otherwise
      value: '0'
    baseline:
      depreciation_share: '0'
    evidence:
    - cross_category
    cross_difficulty: claims
  baseline:
    rule: >-
      The standard closing payment is the storage and declared-value coverage lines on the job billed to customer, plus the
      card surcharge and late fee lines on the job, less the customer payments posted to the job net of the refunds returned
      from them, less the billing_error and duplicate_line adjustment credits on the job, rounded to the cent, half up, and
      never below zero.
    params:
    - rounding_epsilon
  inputs:
    history:
    - table: contents_charges
      aggregate: sum
      field: amount
      filters:
        event_type: contents_storage_charge
        bill_to: customer
    - table: contents_payments
      aggregate: sum
      field: amount
      filters:
        event_type: contents_customer_payment
    - table: contents_payments
      aggregate: sum
      field: amount
      filters:
        event_type: contents_custody_credit
    - category: claims
      table: claims_approvals
      aggregate: sum
      field: amount
      filters:
        event_type: claims_scope_approval
        coverage_part: contents
    - category: claims
      table: claims_payments
      aggregate: sum
      field: amount
      filters:
        coverage_part: contents
        payee_route: insured_only
    - aggregate: sum
      category: claims
      field: amount
      filters:
        coverage_part: contents
        event_type: claims_receivable_writeoff
        writeoff_reason: depreciation_forfeited
      table: claims_approvals
    cross_category:
    - claims
