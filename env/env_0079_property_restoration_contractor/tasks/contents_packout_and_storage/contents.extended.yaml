  trigger: state_due
  subject:
  - contents_storage_charge
  computes: amount
  target_tool: charge_declared_value_coverage_b3c8ef16
  params:
    black_water_coverage_loading: 0.2
    gray_water_coverage_loading: 0.1
    crate_rider_threshold: 4
    crate_rider_large: 0.08
    crate_rider_small: 0.05
    furniture_rider_threshold: 20
    furniture_rider_large: 0.04
    furniture_rider_small: 0.02
