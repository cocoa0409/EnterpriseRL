- id: contents_evt_storage
  subject:
  - contents_storage_charge
  rule: >-
    The job must be in in_custody or return_scheduled status when a storage period is charged. Storage is billed in storage
    periods of the tier's period length counted from the custody start date, each period billed in full on its first day at
    the vault rate times the vault count in force that day; climate-controlled tiers bill the climate vault rate and oversized
    items are billed per item per period. On-site manipulation and in-plant cleaning carry no storage. A storage period whose
    first day falls on or before the approved storage end date of the linked claim file is billed to insurance_claim, and
    any other storage period is billed to customer. A self-pay job's storage is always billed to customer. A customer-billed
    period is due the tier's storage invoice due days after its first day, and customer-billed storage left unpaid longer
    than the tier's referral days is referred to a human collections manager as not covered by policy. When the customer has
    declared a value, declared-value coverage is billed each period at the tier's valuation percentage of the declared value,
    rounded to the cent, half up, and always to customer, because it is the customer's own election.
  eligibility:
  - id: sg_state
    applies_to:
    - contents_storage_charge
    kind: state
    condition: The job must be in in_custody or return_scheduled status when a storage period is charged.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - in_custody
      - return_scheduled
  - id: sg_bill_to
    applies_to:
    - contents_storage_charge
    kind: caller_fact
    condition: >-
      A storage period whose first day falls on or before the approved storage end date of the linked claim file is billed
      to insurance_claim, and any other storage period is billed to customer.
    evidence_fields:
    - claims_files.approved_storage_end_date
    - contents_charges.storage_period_start
    - contents_jobs.claim_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
