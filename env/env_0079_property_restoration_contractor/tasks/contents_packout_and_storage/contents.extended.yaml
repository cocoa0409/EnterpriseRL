- id: contents_evt_custody_credit
  subject:
  - contents_custody_credit
  rule: >-
    The job must be in returned or invoiced status when a custody credit is posted. A custody credit may be posted only when
    the loss or damage is reported no later than the damage report window after the contents were returned. The damage report
    window is counted in calendar days starting the day after the job's returned_date, and a report made on the last day of
    the window is in time. Each inventoried item takes at most one custody credit. The item must appear on the job's inventory
    by its barcode tag. A lost item is compensated at its actual cash value and a damaged item at the lesser of its repair
    cost and its actual cash value, in either case never more than the tier's custody liability cap per item; when the customer
    bought declared-value coverage, the cap is replaced by the item's share of the declared value. Items listed on a signed
    disposal authorization are never compensated. A report after the window, or a claim above the cap, is handed to a human
    representative as not covered by policy.
  eligibility:
  - id: cu_state
    applies_to:
    - contents_custody_credit
    kind: state
    condition: The job must be in returned or invoiced status when a custody credit is posted.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - returned
      - invoiced
  - id: cu_window
    applies_to:
    - contents_custody_credit
    kind: time
    condition: >-
      A custody credit may be posted only when the loss or damage is reported no later than the damage report window after
      the contents were returned.
    evidence_fields:
    - contents_jobs.returned_date
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the contents were returned
      anchor_source: contents_jobs.returned_date
      relation: not_after
      duration_source: variants.damage_report_days
      unit: calendar_days
      counting_rule: >-
        The damage report window is counted in calendar days starting the day after the job's returned_date, and a report
        made on the last day of the window is in time.
      boundary: inclusive
  - id: cu_once
    applies_to:
    - contents_custody_credit
    kind: dedup
    condition: Each inventoried item takes at most one custody credit.
    evidence_fields:
    - contents_payments.contents_job_id
    - contents_payments.inventory_tag
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_payments.contents_job_id
        - contents_payments.inventory_tag
      action_bindings:
        contents_payments.contents_job_id: contents_job_id
        contents_payments.inventory_tag: inventory_tag
    dedup_contract:
      table: contents_payments
      mode: separate_record
      object_bindings:
        contents_job_id: contents_job_id
        inventory_tag: inventory_tag
      duplicate_filters:
        event_type:
        - contents_custody_credit
      distinct_fields: []
  params:
    per_tier:
      On-Site Contents Manipulation:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
      In-Plant Contents Cleaning:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
      Partial Contents Packout:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
      Full Contents Packout:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
      High-Value Contents Packout:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
      Commercial Contents and Records Recovery:
        custody_liability_cap_per_item: =custody_liability_cap_per_item
        damage_report_days: =damage_report_days
