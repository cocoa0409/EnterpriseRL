- id: contents_evt_late_fee
  subject:
  - contents_late_fee
  rule: >-
    The job must be in invoiced status when a late fee is charged. A late fee may post only after the grace period following
    the payment due date recorded at invoicing has fully passed. The grace period is counted in calendar days starting the
    day after the payment_due_date, and the first late fee may post on the day after the grace period's last day. A late fee
    is assessed at most once per calendar month fee period at the late fee percentage of the balance due, with the late fee
    minimum as a floor, rounded to the cent, half up. No late fee posts on an insurance_claim job while its linked claim file
    is in opened, estimate_submitted or approved status and the suspension period counted from the invoice date has not ended.
    Late fees are never back-dated to a suspended period, and a job with a zero or negative balance is never charged a late
    fee.
  eligibility:
  - id: lf_state
    applies_to:
    - contents_late_fee
    kind: state
    condition: The job must be in invoiced status when a late fee is charged.
    evidence_fields:
    - contents_jobs.status
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    state_contract:
      field: contents_jobs.status
      allowed:
      - invoiced
  - id: lf_grace
    applies_to:
    - contents_late_fee
    kind: time
    condition: >-
      A late fee may post only after the grace period following the payment due date recorded at invoicing has fully passed.
    evidence_fields:
    - contents_jobs.payment_due_date
    - contents_jobs.contents_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.contents_job_id
      action_bindings:
        contents_jobs.contents_job_id: contents_job_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the payment due date recorded at invoicing
      anchor_source: contents_jobs.payment_due_date
      relation: not_before
      duration_source: variants.late_fee_grace_days
      unit: calendar_days
      counting_rule: >-
        The grace period is counted in calendar days starting the day after the payment_due_date, and the first late fee may
        post on the day after the grace period's last day.
      boundary: exclusive
  - id: lf_susp
    applies_to:
    - contents_late_fee
    kind: caller_fact
    condition: >-
      No late fee posts on an insurance_claim job while its linked claim file is in opened, estimate_submitted or approved
      status and the suspension period counted from the invoice date has not ended.
    evidence_fields:
    - contents_jobs.claim_file_id
    - claims_files.status
    - contents_jobs.invoiced_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - contents_jobs.claim_file_id
      action_bindings:
        contents_jobs.claim_file_id: claim_file_id
  params:
    per_tier:
      On-Site Contents Manipulation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      In-Plant Contents Cleaning:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Partial Contents Packout:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Full Contents Packout:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      High-Value Contents Packout:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
