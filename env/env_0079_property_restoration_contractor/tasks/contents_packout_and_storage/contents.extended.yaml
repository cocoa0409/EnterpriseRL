  factors:
  - id: vaults_billed_count
    effect: method
    decides: vaults_billed
    bindings:
    - capacity
    - boxes_packed
    - haul_lines
    - signed_listed
    - capacity_vaults
    - vaults_billed
    ladder:
    - when: >-
        a disposal haul line stands on the job and the job's signed disposal authorizations list at least one item
      method: >-
        the boxes packed less the items listed on signed disposal authorizations (one box per listed item), that difference
        divided by the tier's vault capacity and rounded up to a whole vault, never fewer than one
    - when: >-
        no disposal haul line stands on the job and the vault count recorded on the job is greater than the boxes packed divided
        by the tier's vault capacity, rounded up
      method: the boxes packed divided by the tier's vault capacity, rounded up to a whole vault
    - when: otherwise
      method: the vault count recorded on the job
    baseline:
      vaults_billed: recorded_vaults
    evidence:
    - history
    cross_difficulty: null
  - id: contaminated_lining
    effect: parameter
    decides: lining_pct
    bindings:
    - water_category
    - lining_pct
    ladder:
    - when: the linked mitigation job is a company water job assessed category_3
      value: K('black_water_lining_pct')
    - when: the linked mitigation job is a company water job assessed category_2
      value: K('gray_water_lining_pct')
    - when: otherwise (a category_1 water job, a job that is not a water job, or no linked mitigation job)
      value: '0'
    baseline:
      lining_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: water
  - id: facility_schedule
    effect: parameter
    decides: facility_factor
    bindings:
    - policy_state
    - facility_factor
    ladder:
    - when: the policy state on the job's linked claim file is FL
      value: K('florida_facility_factor')
    - when: the policy state on the job's linked claim file is LA
      value: K('louisiana_facility_factor')
    - when: otherwise (any other policy state, or no linked claim file)
      value: '1'
    baseline:
      facility_factor: '1'
    evidence:
    - cross_category
    cross_difficulty: claims
  - id: secured_section
    effect: parameter
    decides: secured_add
    bindings:
    - declared_shown
    - secured_add
    ladder:
    - when: >-
        the largest declared value shown on the job's declared-value coverage lines is at least the secured-section threshold
      value: K('secured_add_high')
    - when: that declared value is above zero but below the secured-section threshold
      value: K('secured_add_low')
    - when: otherwise (no declared-value coverage line on the job)
      value: '0'
    baseline:
      secured_add: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: crate_racking
    effect: parameter
    decides: racking_charge
    bindings:
    - crates_packed
    - racking_charge
    ladder:
    - when: the crate quantities on the job's packout lines total at least the racking volume threshold
      value: crates_packed * K('racking_rate_volume')
    - when: they total at least one crate but fewer than the racking volume threshold
      value: crates_packed * K('racking_rate_standard')
    - when: otherwise (no crate on the packout lines)
      value: '0'
    baseline:
      racking_charge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: return_period_share
    effect: parameter
    decides: period_share
    bindings:
    - return_date
    - today_index
    - return_offset
    - return_in_period
    - days_to_return
    - period_share
    ladder:
    - when: >-
        the job is in return_scheduled status and its scheduled return date falls inside the period being billed, the days
        from the period's first day through that date (both counted) numbering at least the half-period days
      value: days_to_return / period_days (those days over the period length)
    - when: >-
        the job is in return_scheduled status and its scheduled return date falls inside the period being billed, those days
        numbering fewer than the half-period days
      value: K('half_period_days') / period_days
    - when: otherwise (no scheduled return date, or one outside the period being billed)
      value: '1'
    baseline:
      period_share: '1'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The standard vault storage line for such a period is the vault count recorded on the job times the tier's vault rate
