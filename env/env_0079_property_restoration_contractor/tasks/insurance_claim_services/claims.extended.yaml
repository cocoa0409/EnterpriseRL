      or 'no-line'
  - g_equip: >-
      XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='goodwill', source_charge_id=g_l0)
      + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='goodwill', source_charge_id=g_l1)
      + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='goodwill', source_charge_id=g_l2)
      + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='goodwill', source_charge_id=g_l3)
      + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='goodwill', source_charge_id=g_l4)
      + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='goodwill', source_charge_id=g_l5)
      + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='goodwill', source_charge_id=g_l6)
  - cw_good_taken: 0 if g_est <= g_dry else (g_equip if g_est < g_inv else g_all)
  - wp_tier: F('variant_name')
  - wp_trades: F('estimate_trade_count') or 0
  - wp_opened: CFIELD('water', 'opened_date', claim_file_id=HID) or '9999-12-31'
  - cw_wmult: >-
      (1 - P('program_pricing_discount_pct') / 100.0) if wp_tier == 'Carrier Program Claim Billing' else ((1 + (P('overhead_pct')
      + P('profit_pct')) / 100.0) if (wp_trades >= P('op_min_trades') and wp_opened <= (F('estimate_submitted_date') or ''))
      else 1)
  - cp_tier: F('variant_name')
  - cp_trades: F('estimate_trade_count') or 0
  - cp_signed: CFIELD('rebuild', 'signed_date', claim_file_id=HID) or ''
  - cw_cmult: >-
      (1 - P('program_pricing_discount_pct') / 100.0) if cp_tier == 'Carrier Program Claim Billing' else ((1 + (P('overhead_pct')
      + P('profit_pct')) / 100.0) if (cp_trades >= P('op_min_trades') and cp_signed != '') else 1)
  - cw_water_credits: cw_err_taken + cw_dup_taken + cw_good_taken
  - cw_priced: cw_water_credits * cw_wmult + cw_removed * cw_cmult
  - cw_initial: >-
      SUM('claims_approvals', 'amount', event_type='claims_scope_approval', approval_type='initial', coverage_part='dwelling')
  - cw_initial_id: >-
      LATEST('claims_approvals', 'claim_approval_id', date_field='posted_date', event_type='claims_scope_approval', approval_type='initial',
      coverage_part='dwelling')
  - cw_estimate: float(F('estimate_amount') or 0)
  - cw_value: >-
      (cw_priced * cw_initial / cw_estimate) if (cw_estimate > 0 and cw_initial < cw_estimate) else cw_priced
  - cw_written: >-
      SUM('claims_approvals', 'amount', event_type='claims_receivable_writeoff', source_approval_id=cw_initial_id)
  - result: RND(MX(0, MN(cw_value, cw_initial - cw_written)) + K('rounding_guard'), 2)
