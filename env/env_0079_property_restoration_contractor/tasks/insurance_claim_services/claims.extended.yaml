    mr_tech: >-
      Its labor is the technician and supervisor labor billed on that job, its after-hours part taken at the business-hours
      rate (the after-hours labor divided by the tier's after-hours labor multiplier) on a single-family house or condominium
      unit, where work outside working hours is the owner's own choice, and as billed on a multifamily unit or commercial
      property, where it spares the other occupants.
    mr_sup: >-
      Its labor is the technician and supervisor labor billed on that job, its after-hours part taken at the business-hours
      rate (the after-hours labor divided by the tier's after-hours labor multiplier) on a single-family house or condominium
      unit, where work outside working hours is the owner's own choice, and as billed on a multifamily unit or commercial
      property, where it spares the other occupants.
    mr_ah: >-
      Its labor is the technician and supervisor labor billed on that job, its after-hours part taken at the business-hours
      rate (the after-hours labor divided by the tier's after-hours labor multiplier) on a single-family house or condominium
      unit, where work outside working hours is the owner's own choice, and as billed on a multifamily unit or commercial
      property, where it spares the other occupants.
    mr_loc_lb: >-
      The labor is taken as follows: for growth in an attic or crawlspace, which no occupant uses, the labor billed with its
      after-hours part at the business-hours rate whatever the property, the after-hours premium being the customer's own
      choice there; for growth in the HVAC system, the labor billed with its after-hours part as billed whatever the property,
      because the system serving the building can be shut down for cleaning only outside its working hours; for growth in
      a living area or basement, the labor as stated above.
    mr_mult: >-
      Its labor is the technician and supervisor labor billed on that job, its after-hours part taken at the business-hours
      rate (the after-hours labor divided by the tier's after-hours labor multiplier) on a single-family house or condominium
      unit, where work outside working hours is the owner's own choice, and as billed on a multifamily unit or commercial
      property, where it spares the other occupants.
    mr_ptype_lb: >-
      Its labor is the technician and supervisor labor billed on that job, its after-hours part taken at the business-hours
      rate (the after-hours labor divided by the tier's after-hours labor multiplier) on a single-family house or condominium
      unit, where work outside working hours is the owner's own choice, and as billed on a multifamily unit or commercial
      property, where it spares the other occupants.
    mr_ah_cut: >-
      Its labor is the technician and supervisor labor billed on that job, its after-hours part taken at the business-hours
      rate (the after-hours labor divided by the tier's after-hours labor multiplier) on a single-family house or condominium
      unit, where work outside working hours is the owner's own choice, and as billed on a multifamily unit or commercial
      property, where it spares the other occupants.
    mr_labor: >-
      The labor is taken as follows: for growth in an attic or crawlspace, which no occupant uses, the labor billed with its
      after-hours part at the business-hours rate whatever the property, the after-hours premium being the customer's own
      choice there; for growth in the HVAC system, the labor billed with its after-hours part as billed whatever the property,
      because the system serving the building can be shut down for cleaning only outside its working hours; for growth in
      a living area or basement, the labor as stated above.
    mr_pending: >-
      The final figure is the core scope plus each scope family settled below, every family taken from the charge lines billed
      on the job awaiting clearance; from that sum every amount requested on mold_remediation supplements naming that job
      that still await the carrier's decision is subtracted, the figure is never below zero, it is held to the mold room and
      rounded to the cent, half up, once, on the final figure.
    mr_approved: >-
      The mold room is the file's mold sublimit less the mold amounts already approved on the file, never below zero, and
      the final figure may not exceed it.
    mr_room: >-
      The mold room is the file's mold sublimit less the mold amounts already approved on the file, never below zero, and
      the final figure may not exceed it.
    result: >-
      The final figure is the core scope plus each scope family settled below, every family taken from the charge lines billed
      on the job awaiting clearance; from that sum every amount requested on mold_remediation supplements naming that job
      that still await the carrier's decision is subtracted, the figure is never below zero, it is held to the mold room and
      rounded to the cent, half up, once, on the final figure.
  factors:
  - id: final_surface_lines
    effect: parameter
    decides: mr_surface
    bindings:
    - mr_loc
    - mr_blast
    - mr_hvaclines
    - mr_surface
    ladder:
    - when: growth in an attic or crawlspace
      value: the soda blasting and dry ice blasting lines billed on the job
    - when: growth in the HVAC system
      value: the duct, air handler and coil cleaning lines billed on the job
    - when: otherwise (growth in a living area or basement)
      value: the wire-brush sanding and encapsulation lines billed on the job (standard)
    baseline:
      mr_surface: mr_brush
    evidence:
    - cross_category
    - history
    cross_difficulty: mold
  - id: final_removal_lines
    effect: parameter
    decides: mr_removal
    bindings:
    - mr_loc_rm
    - mr_debris
    - mr_removal
    ladder:
    - when: growth in an attic or crawlspace
      value: the insulation removal lines and debris disposal loads billed on the job
    - when: growth in a basement
      value: the drywall removal lines billed on the job
    - when: otherwise
      value: the drywall and insulation removal lines billed on the job (standard)
    baseline:
      mr_removal: mr_drywall + mr_insul
    evidence:
    - cross_category
    - history
    cross_difficulty: mold
  - id: final_air_lines
    effect: parameter
    decides: mr_air
    bindings:
    - mr_cont_req
    - mr_negair_req
    - mr_cont
    - mr_scrub
    - mr_air
    ladder:
    - when: the tier requires both containment and negative air
      value: >-
        the containment setup line, the air scrubber days and the dehumidifier days billed on the job
    - when: the tier requires negative air but no containment
      value: the air scrubber days billed on the job
    - when: otherwise
      value: the dehumidifier days billed on the job (standard)
    baseline:
      mr_air: mr_dehu
    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: mold
  - id: final_regulated_lines
    effect: parameter
    decides: mr_reg
    bindings:
    - mr_lead
    - mr_asb
    - mr_loc_rg
    - mr_olaw
    - mr_reg
    ladder:
    - when: no ordinance-or-law limit on the file and growth in a living area or basement
      value: the lead-safe setup and asbestos sampling lines billed on the job
    - when: no ordinance-or-law limit on the file and any other growth outside the HVAC system
      value: the asbestos sampling lines billed on the job
    - when: otherwise
      value: '0'
    baseline:
      mr_reg: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: mold
  - id: final_labor_basis
    effect: method
    decides: mr_labor
    bindings:
    - mr_loc_lb
    - mr_labor
    ladder:
    - when: growth in an attic or crawlspace
      method: >-
        the labor billed with its after-hours part at the business-hours rate (after-hours labor divided by the tier multiplier)
    - when: growth in the HVAC system
      method: the technician and supervisor labor billed, its after-hours part as billed
    - when: otherwise (growth in a living area or basement)
      method: >-
        the labor as the standard method takes it: after-hours part at the business-hours rate on a single-family house or
        condominium unit, as billed on a multifamily unit or commercial property
    baseline:
      mr_labor: mr_tech + mr_sup - mr_ah_cut
    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: mold
  baseline:
    rule: >-
      The final figure takes as its core scope the HEPA vacuuming, antimicrobial, PPE, clearance test and minimum charge lines
      billed on the job awaiting clearance. Its standard surface treatment is the wire-brush sanding and encapsulation lines
      billed on that job. Its standard removal is the drywall removal and insulation removal lines billed on that job. Its
      standard air treatment is the dehumidifier days billed on that job. Its regulated-material lines are claimed only as
      settled below. Its labor is the technician and supervisor labor billed on that job, its after-hours part taken at the
      business-hours rate (the after-hours labor divided by the tier's after-hours labor multiplier) on a single-family house
      or condominium unit, where work outside working hours is the owner's own choice, and as billed on a multifamily unit
      or commercial property, where it spares the other occupants. The mold room is the file's mold sublimit less the mold
      amounts already approved on the file, never below zero, and the final figure may not exceed it.
    params:
    - rounding_guard
  inputs:
    history:
    - category: mold
      table: mold_charges
      aggregate: sum
      field: amount
      filters: {}
    - table: claims_requests
      aggregate: sum
      field: requested_amount
      filters:
        supplement_reason: mold_remediation
    cross_category:
    - mold
