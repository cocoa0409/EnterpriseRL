  factors:
  - id: reassessed_extraction
    effect: parameter
    decides: sc_extr
    bindings:
    - sc_extr_qty
    - sc_extr_rate
    - sc_extr
    ladder:
    - when: a Clean or Gray Water job whose recorded category is category_3
      value: extraction square feet times (Black Water rate less the dispatch tier rate)
    - when: a Clean Water job whose recorded category is category_2
      value: extraction square feet times (Gray Water rate less the dispatch tier rate)
    - when: otherwise
      value: '0'
    baseline:
      sc_extr: '0'
    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: water
  - id: reassessed_carpet_treatment
    effect: parameter
    decides: sc_carpet
    bindings:
    - sc_carpet_qty
    - sc_carpet
    ladder:
    - when: a Clean or Gray Water job whose recorded category is category_3
      value: the detach-and-reset carpet area priced as carpet removal at the Black Water rate
    - when: a Clean Water job whose recorded category is category_2
      value: the same area priced as pad removal at the Gray Water rate
    - when: otherwise
      value: '0'
    baseline:
      sc_carpet: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: water
  - id: reassessed_ppe
    effect: method
    decides: sc_ppe
    bindings:
    - sc_ppe_qty
    - sc_ppe_rate
    - sc_tech_lines
    - sc_ppe
    ladder:
    - when: a Gray Water job whose recorded category is category_3
      method: PPE technician-days billed times (Black Water PPE rate less the dispatch tier rate)
    - when: a Clean Water job whose recorded category is category_2 or category_3
      method: >-
        one technician-day per technician labor line at the PPE rate of the tier the recorded category selects
    - when: otherwise
      method: '0'
    baseline:
      sc_ppe: '0'
    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: water
  - id: reassessed_regulated_cleanup
    effect: parameter
    decides: sc_reg
    bindings:
    - sc_cont_line
    - sc_hepa_qty
    - sc_hepa_rate
