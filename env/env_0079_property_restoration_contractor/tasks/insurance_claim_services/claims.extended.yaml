    decides: cw_dup_taken
    bindings:
    - d_est
    - d_dry
    - d_inv
    - d_mm_fee
    - d_equip
    - cw_dup_taken
    ladder:
    - when: the estimate was submitted on or before the water job drying complete date
      value: '0'
    - when: the estimate was submitted after drying completed but before the invoiced date
      value: the duplicate_line credits equal to the tier moisture mapping fee only
    - when: otherwise
      value: the duplicate_line credits posted on the job (standard)
    baseline:
      cw_dup_taken: d_all
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: water
  - id: removed_scope_inclusion
    effect: method
    decides: cw_removed
    bindings:
    - r_est
    - r_co_last
    - r_add_last
    - r_add
    - r_markup
    - cw_removed
    ladder:
    - when: the latest change order credit was posted on or before the estimate submission date
      method: no change order credit
    - when: >-
        the latest change order credit was posted after the estimate was submitted and an additive change order charge was
        posted on or after it
      method: >-
        the change order credits less the additive charges net of the change order markup, never below zero
    - when: otherwise
      method: every change order credit posted on the contract (standard)
    baseline:
      cw_removed: r_co
    evidence:
    - cross_category
    - history
    - date
    - tier_param
    cross_difficulty: rebuild
  - id: goodwill_inclusion
    effect: parameter
    decides: cw_good_taken
    bindings:
    - g_est
    - g_dry
    - g_inv
    - g_last
    - g_l0
    - g_l1
    - g_l2
    - g_l3
    - g_l4
    - g_l5
    - g_l6
    - g_equip
    - cw_good_taken
    ladder:
    - when: the estimate was submitted on or before the water job drying complete date
      value: '0'
    - when: the estimate was submitted after drying completed but before the invoiced date
      value: the goodwill credits against the equipment-day lines dated on the last equipment day only
    - when: otherwise
      value: the goodwill credits posted on the job (standard)
    baseline:
      cw_good_taken: g_all
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: water
  - id: water_line_pricing_basis
    effect: parameter
    decides: cw_wmult
    bindings:
    - wp_tier
    - wp_trades
    - wp_opened
    - cw_wmult
    ladder:
    - when: a Carrier Program Claim Billing file
      value: the water job credit families less the program pricing discount
    - when: >-
        another file whose estimate carried at least the minimum number of distinct trades and was submitted on or after the
        water job was opened
      value: the water job credit families raised by overhead plus profit
    - when: otherwise
      value: the water job credit families stand
    baseline:
      cw_wmult: '1'
    evidence:
    - tier_param
    - date
    - cross_category
    cross_difficulty: water
  - id: contract_scope_pricing_basis
    effect: parameter
    decides: cw_cmult
    bindings:
    - cp_tier
    - cp_trades
    - cp_signed
    - cw_cmult
    ladder:
    - when: a Carrier Program Claim Billing file
      value: the removed scope less the program pricing discount
    - when: >-
        another file whose estimate carried at least the minimum number of distinct trades and whose insured holds a signed
        reconstruction contract linked to the file
      value: the removed scope raised by overhead plus profit
    - when: otherwise
      value: the removed scope stands
    baseline:
      cw_cmult: '1'
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: rebuild
  baseline:
    rule: >-
      The standard method takes every credit recorded on the water job, that is its billing_error, duplicate_line and goodwill
      credits, and every change order credit posted on the reconstruction contract, at their recorded amounts and the company's
      own prices, and applies the carrier's approval by scaling the credited value by the initial dwelling approval over the
      estimate amount submitted when the approval is below the estimate, because the carrier approved every line at that share;
      when the approval is at or above the estimate amount the credited value stands.
    params:
    - rounding_guard
  inputs:
    history:
    - category: water
      table: water_payments
      aggregate: sum
      field: amount
      filters:
        event_type: water_adjustment_credit
    - category: rebuild
      table: rebuild_payments
      aggregate: sum
      field: amount
      filters:
        event_type: rebuild_change_order_credit
    - category: rebuild
      table: rebuild_charges
      aggregate: sum
      field: amount
      filters:
        event_type: rebuild_change_order_charge
    cross_category:
    - water
    - rebuild
- id: claims_ext_insured_depreciation_release
  base_policy_refs:
  - claims_evt_depreciation_release
  - claims_payment_allocation
  - claims_agg_multi_holding
  overwrite:
  - base_policy: claims_evt_depreciation_release
    superseded_clause: >-
      The amount requested is the depreciation withheld on the approvals of that coverage part less any depreciation already
      released on it.
    replaced_by: >-
      For an insured's dwelling release this policy prices, and only for such a release, the amount requested is the release
      figure set out below; every other release request, a contents release and every release the company submits included,
      requests the depreciation withheld on the approvals of that coverage part less any depreciation already released on
      it.
  trigger: on_request
  subject:
  - claims_depreciation_release_request
  computes: requested_amount
  target_tool: submit_depreciation_release_d117c1f9
  params:
    rounding_guard: 1.0e-09
  rule: >-
    This policy prices the insured's dwelling release: the depreciation release request on the dwelling coverage that the
    insured submits from the company's claim portal on a Public Adjuster Coordinated Claim Billing file, where the company
    does not request depreciation itself, naming the file's reconstruction contract as the completed job, for an insured who
    holds exactly one water mitigation job and exactly one reconstruction contract, both linked to the file, on which no price_variance
    or scope_omission supplement has yet been decided and every supplement of any other reason has been decided; any other
    release request is handled under the base release rule. The claim file must be in approved status when a depreciation
    release is requested. The job named in the request must be complete: a rebuild contract in substantially_complete, final_invoiced
    or closed status. A depreciation release may be requested only no later than the depreciation window after the first ACV
    payment was received on the claim file, counted in calendar days starting the day after the received_date of the earliest
    acv carrier payment on the file, a request submitted on the last day of the window being in time. For an insured's dwelling
    release this policy prices, and only for such a release, the amount requested is the release figure set out below; every
    other release request, a contents release and every release the company submits included, requests the depreciation withheld
    on the approvals of that coverage part less any depreciation already released on it. The insured's depreciation release
    is not computed before the credited-line write-off owed on the initial dwelling approval has been worked out and, where
    it comes to more than nothing and within the desk write-off cap, posted. The insured's depreciation release is fixed only
    after the category reassessment supplement owed for the water job has been prepared and, where it reaches the supplement
    minimum, recorded on the file. The insured's depreciation release waits until the regulated-scope supplement owed for
    the water job has been prepared and, where it reaches the supplement minimum, recorded on the file. The release figure
    is the dwelling holdback less each deduction settled below, the deductions being independent of one another; the figure
    is never below zero and is rounded to the cent, half up, once, on the final figure. The dwelling holdback is the depreciation
    withheld on every dwelling scope approval of the file, less the depreciation_release carrier payments received on the
    dwelling coverage and less every write-off posted on the file's approvals, never below zero. The incurred-cost shortfall
    is the expected dwelling approvals less the billed cost, never below zero. The expected approvals are the dwelling approvals
    as recorded plus the amounts requested on dwelling scope_omission and price_variance supplements awaiting the carrier's
    decision, because a pending supplement is settled against the same approvals once decided and the release pays depreciation
    only on scope that was billed; the billed cost is the contract cost plus the water job cost, as settled below. The contract
    cost is the contract amount plus the change order charges and less the change order credits posted on the contract. The
    water job cost is every charge posted on the water job other than late fees and card surcharges. The contract cost is
    measured as follows: when the contract is closed, by the draw payments and insurance postings received on it, because
    a closed contract's cost is what was paid; when the contract is final_invoiced, by its final invoice amount; otherwise
    by the contract amount plus the change order charges less the change order credits. The water job cost is measured as
    follows: when the water job is closed, by its final invoice amount less the billing_error, duplicate_line and goodwill
    credits posted on it, because the credits of a closed job are final and lower the price the insured incurred; when the
    job is invoiced and not closed, by its final invoice amount, because its credits are not final until the job closes; otherwise
    by every charge posted on the job other than late fees and card surcharges. The deductible carry is set as follows: when
    the ACV carrier payments on the dwelling coverage are at least the initial dwelling approval less its depreciation withheld,
    the whole deductible; when they fall short of that figure by less than the deductible, the deductible less that shortfall;
    otherwise nothing. The advance recoupment is set as follows: when the ACV carrier payments on the dwelling coverage are
    at least the initial dwelling approval less its depreciation withheld less the deductible, every advance payment received
    on the dwelling coverage, because the carrier recoups an advance it did not deduct from the ACV payment out of the final
    payment; when they fall short of that figure by less than the advances, the advances less that shortfall; otherwise nothing.
    The code holdback cut is set as follows: when the depreciation withheld on the file's dwelling supplement approvals is
    above the change order charges posted on the contract and the contract is final_invoiced or closed, the withheld amount
    above those charges; when that withheld amount is above those charges and the contract is substantially_complete, the
    whole depreciation withheld on the dwelling supplement approvals; otherwise nothing. The supplement depreciation already
    paid is set as follows: when the supplement carrier payments on the dwelling coverage reach the dwelling supplement approvals,
    the whole depreciation withheld on those approvals, because the carrier has paid it with the supplement; when they exceed
    the supplement approvals less their depreciation withheld but fall short of the approvals, the supplement payments less
    that figure, because the carrier has paid that part of the withheld depreciation; otherwise nothing.
  prerequisite:
  - problem: claims_ext_credited_line_writeoff
    kind: value_input
    gate: rl_written
    form: action
    policy_source: >-
      The insured's depreciation release is not computed before the credited-line write-off owed on the initial dwelling approval
      has been worked out and, where it comes to more than nothing and within the desk write-off cap, posted.
    fallback_reason: >-
      The credited-line write-off leaves a write-off row only when it comes to more than nothing and stays within the desk
      write-off cap; otherwise no record appears, so a state sentence would wait on a row that never exists. The sentence
      names the working-out and, where it applies, the posting.
    condition: >-
      claims_approvals carries a claims_receivable_writeoff row against the initial dwelling approval for the credited lines,
      or that write-off works out to nothing or above the desk cap.
    resolved_by: post_credited_line_writeoff_e2edbc44
    effect: The write-off amount is subtracted from the dwelling holdback.
  - problem: claims_ext_category_reassessment_supplement
    kind: value_input
    gate: rl_pend_price
    form: action
    policy_source: >-
      The insured's depreciation release is fixed only after the category reassessment supplement owed for the water job has
      been prepared and, where it reaches the supplement minimum, recorded on the file.
    fallback_reason: >-
      The reassessment supplement leaves a pending price_variance request only when its figure reaches the supplement minimum;
      below it nothing is recorded, so a state sentence would wait forever.
    condition: >-
      claims_requests carries a pending price_variance supplement naming the water job, or the reassessment figure is below
      the supplement minimum.
    resolved_by: submit_category_reassessment_supplement_86febceb
    effect: Its requested amount is added to the expected approvals, raising the shortfall.
  - problem: claims_ext_regulated_scope_supplement
    kind: value_input
    gate: rl_pend_scope
    form: action
    policy_source: >-
      The insured's depreciation release waits until the regulated-scope supplement owed for the water job has been prepared
      and, where it reaches the supplement minimum, recorded on the file.
    fallback_reason: >-
      The regulated-scope supplement leaves a pending scope_omission request only when its figure reaches the supplement minimum;
      below it nothing is recorded.
    condition: >-
      claims_requests carries a pending scope_omission supplement naming the water job, or the regulated-scope figure is below
      the supplement minimum.
    resolved_by: submit_regulated_scope_supplement_ec41bed4
    effect: Its requested amount is added to the expected approvals, raising the shortfall.
  cross_category:
  - category: rebuild
    as: history
    reads:
    - status
    - final_invoice_amount
    - contract_amount
    - rebuild_charges.amount
    - rebuild_payments.amount
    note: >-
      the contract status, invoice, amount, change orders and payments decide the contract cost, pending and code tiers.
  - category: water
    as: history
    reads:
    - status
    - final_invoice_amount
    - water_charges.amount
    - water_payments.amount
    note: the water job status, invoice, charges and credits decide the water cost tier.
  compute:
  - rl_withheld: >-
      SUM('claims_approvals', 'depreciation_withheld', event_type='claims_scope_approval', coverage_part='dwelling')
  - rl_released: >-
      SUM('claims_payments', 'amount', payment_type='depreciation_release', coverage_part='dwelling')
  - rl_written: SUM('claims_approvals', 'amount', event_type='claims_receivable_writeoff')
  - rl_holdback: MX(0, rl_withheld - rl_released - rl_written)
  - rl_approved: >-
      SUM('claims_approvals', 'amount', event_type='claims_scope_approval', coverage_part='dwelling')
  - rb_status: CFIELD('rebuild', 'status', claim_file_id=HID) or ''
  - rb_paid: >-
      XSUM('rebuild', 'rebuild_payments', 'amount', event_type='rebuild_draw_payment') + XSUM('rebuild', 'rebuild_payments',
      'amount', event_type='rebuild_insurance_payment')
  - rb_final: float(CFIELD('rebuild', 'final_invoice_amount', claim_file_id=HID) or 0)
  - rb_amount: float(CFIELD('rebuild', 'contract_amount', claim_file_id=HID) or 0)
  - rb_co: XSUM('rebuild', 'rebuild_charges', 'amount', event_type='rebuild_change_order_charge')
  - rb_cr: XSUM('rebuild', 'rebuild_payments', 'amount', event_type='rebuild_change_order_credit')
  - rl_contract: >-
      rb_paid if rb_status == 'closed' else (rb_final if rb_status == 'final_invoiced' else rb_amount + rb_co - rb_cr)
  - wj_status: CFIELD('water', 'status', claim_file_id=HID) or ''
  - wj_final: float(CFIELD('water', 'final_invoice_amount', claim_file_id=HID) or 0)
  - wj_credits: >-
      XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='billing_error') +
      XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='duplicate_line')
      + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='goodwill')
  - wj_posted: >-
      XSUM('water', 'water_charges', 'amount') - XSUM('water', 'water_charges', 'amount', charge_code='late_fee') - XSUM('water',
      'water_charges', 'amount', charge_code='card_surcharge')
  - rl_water: >-
      (wj_final - wj_credits) if wj_status == 'closed' else (wj_final if wj_status == 'invoiced' else wj_posted)
  - rl_pend_scope: >-
      SUM('claims_requests', 'requested_amount', supplement_reason='scope_omission', coverage_part='dwelling')
  - rl_pend_price: >-
      SUM('claims_requests', 'requested_amount', supplement_reason='price_variance', coverage_part='dwelling')
  - rl_pending: rl_pend_price + rl_pend_scope
  - rl_shortfall: MX(0, rl_approved + rl_pending - (rl_contract + rl_water))
  - rl_init_amt: >-
      SUM('claims_approvals', 'amount', event_type='claims_scope_approval', approval_type='initial', coverage_part='dwelling')
  - rl_init_wh: >-
      SUM('claims_approvals', 'depreciation_withheld', event_type='claims_scope_approval', approval_type='initial', coverage_part='dwelling')
  - rl_acv: SUM('claims_payments', 'amount', payment_type='acv', coverage_part='dwelling')
  - rl_gap: (rl_init_amt - rl_init_wh) - rl_acv
  - rl_ded_amt: F('deductible_amount') or 0
  - rl_deductible: rl_ded_amt if rl_gap <= 0 else ((rl_ded_amt - rl_gap) if rl_gap < rl_ded_amt else 0)
  - rl_adv: SUM('claims_payments', 'amount', payment_type='advance', coverage_part='dwelling')
  - a_init_wh: >-
      SUM('claims_approvals', 'depreciation_withheld', event_type='claims_scope_approval', approval_type='initial', coverage_part='dwelling')
  - a_acv: SUM('claims_payments', 'amount', payment_type='acv', coverage_part='dwelling')
  - rl_adv_gap: (rl_init_amt - a_init_wh - (F('deductible_amount') or 0)) - a_acv
  - rl_advance: rl_adv if rl_adv_gap <= 0 else ((rl_adv - rl_adv_gap) if rl_adv_gap < rl_adv else 0)
  - rl_sup_wh: >-
      SUM('claims_approvals', 'depreciation_withheld', event_type='claims_scope_approval', approval_type='supplement', coverage_part='dwelling')
  - rb_status_c: CFIELD('rebuild', 'status', claim_file_id=HID) or ''
  - rb_co_c: XSUM('rebuild', 'rebuild_charges', 'amount', event_type='rebuild_change_order_charge')
  - rl_code_cut: >-
      (rl_sup_wh - rb_co_c) if (rl_sup_wh > rb_co_c and (rb_status_c == 'final_invoiced' or rb_status_c == 'closed')) else
      (rl_sup_wh if (rl_sup_wh > rb_co_c and rb_status_c == 'substantially_complete') else 0)
  - rl_sup_amt: >-
      SUM('claims_approvals', 'amount', event_type='claims_scope_approval', approval_type='supplement', coverage_part='dwelling')
  - rl_sup_wh2: >-
      SUM('claims_approvals', 'depreciation_withheld', event_type='claims_scope_approval', approval_type='supplement', coverage_part='dwelling')
  - rl_sup_paid: SUM('claims_payments', 'amount', payment_type='supplement', coverage_part='dwelling')
  - rl_sup_released: >-
      rl_sup_wh2 if rl_sup_paid >= rl_sup_amt else ((rl_sup_paid - (rl_sup_amt - rl_sup_wh2)) if rl_sup_paid > rl_sup_amt
      - rl_sup_wh2 else 0)
  - result: >-
      RND(MX(0, rl_holdback - rl_shortfall - rl_deductible - rl_advance - rl_code_cut - rl_sup_released) + K('rounding_guard'),
      2)
