      its whole line-item total; otherwise the water job credit families stand.
    cp_tier: >-
      The carrier's pricing for contract scope is applied as follows: on a Carrier Program Claim Billing file, the removed
      scope less the tier's program pricing discount; on any other file whose estimate carried at least the tier's minimum
      number of distinct trades and whose insured holds a signed reconstruction contract linked to the file, the removed scope
      raised by the tier's overhead percentage plus profit percentage, because general contractor overhead and profit on reconstruction
      scope are owed where a general contractor is retained for it; otherwise the removed scope stands.
