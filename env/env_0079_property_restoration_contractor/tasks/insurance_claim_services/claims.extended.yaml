- id: claims_settlement
  subject:
  - claims_file_settle
  - claims_file_close
  rule: A claim file is settled when its carrier receivable reaches zero through carrier payments and write-offs.
    A settled file is closed once its deductible due is zero and every job linked to it is closed; a file whose
    deductible is still owed stays settled. Denied and withdrawn files are not settled or closed through this path.
  eligibility: []

extended_policies:
- id: claims_ext_regulated_scope_supplement
  base_policy_refs:
  - claims_evt_supplement
  - claims_carrier_decision
  - claims_agg_multi_holding
  overwrite: []
  trigger: state_due
  subject:
  - claims_supplement_submit
  computes: requested_amount
  target_tool: submit_regulated_scope_supplement_ec41bed4
  params:
    rounding_guard: 1.0e-09
  rule: >-
    This policy prices the regulated-scope supplement: the scope_omission supplement the company prepares for the regulated-material
    work billed on the water mitigation job, which the estimate behind the carrier's initial approval leaves out because regulated-material
    work is claimed by its own supplement once sampling confirms it, naming that job, on a Public Adjuster Coordinated Claim
    Billing file whose insured holds exactly one water mitigation job, and that job is linked to the file and on which no
    billing_error or duplicate_line credit corrects a line this policy reads; any other supplement is handled under the base
    supplement rule. The claim file must be in approved status when a supplement is submitted. A supplement may be submitted
    only no later than the supplement window after the carrier's initial approval, counted in calendar days starting the day
    after the claim file's approved_date, a supplement submitted on the last day of the window being in time. A supplement
    may not be submitted while the file already has the tier's maximum number of supplements awaiting a carrier decision,
    and it is submitted only for an amount at least the tier's supplement minimum. The company prepares the supplement and
    records it on the day it is delivered to the insured or public adjuster, numbered in sequence on the file starting at
    1, coverage dwelling, reason scope_omission, naming the water job. The regulated-scope figure is the standard regulated
    lines plus each regulated family settled below, every family taken from the lines billed on the water job, and is rounded
    to the cent, half up, once, on the final figure. The regulated-scope figure takes the lead-safe setup and asbestos sampling
    lines billed on the water job at the amount billed. The RRP cleanup is taken as follows: when the building was built before
    the water job tier's RRP year-built cutoff and the job is on a Black Water tier, the HEPA vacuuming billed on the job,
    because black-water containment is already part of the sewage protocol; when the building was built before that cutoff
    and the job is on any other tier, the containment setup and the HEPA vacuuming billed on the job; otherwise no cleanup
    line. The abatement disposal is taken as follows: when the building was built before the water job tier's asbestos sampling
    year cutoff, the job billed an asbestos sampling line and the job billed a debris haul, the debris haul billed on the
    job; when the building was built before that cutoff, the job billed an asbestos sampling line and no debris haul, the
    dumpster billed on the job; otherwise no disposal line. The regulated PPE is taken as follows: when PPE is billable on
    the water job's tier and the job billed an asbestos sampling line, the PPE billed on the job; when PPE is billable on
    the job's tier, the job billed a lead-safe setup and no asbestos sampling line, one technician-day at the tier's PPE rate;
    otherwise no PPE. The certified-renovator labor is taken as follows: for housing (a single-family house, condominium unit
    or multifamily unit) built before the water job tier's RRP year-built cutoff, the supervisor labor billed on the service
    date of the job's latest containment setup line, because the Renovation, Repair and Painting Rule requires a certified
    renovator to set up or direct the containment of the work area; for a commercial property built before the tier's asbestos
    sampling year cutoff, the technician and supervisor labor billed on that date, because the asbestos NESHAP work practices
    govern the whole crew's sealing of the area before tear-out; otherwise no renovator labor. The regulated tear-out is taken
    as follows: for a multifamily unit or commercial property built before the water job tier's asbestos sampling year cutoff,
    the flood cut and baseboard removal lines billed on the job, because the asbestos NESHAP work practices govern tear-out
    in those buildings; for a single-family house or condominium unit built before the tier's RRP year-built cutoff, the baseboard
    removal lines billed on the job, because painted trim is the regulated surface the Renovation, Repair and Painting Rule
    governs there; otherwise no tear-out line. The cleaning-verification labor is taken as follows: for housing (a single-family
    house, condominium unit or multifamily unit) built before the water job tier's RRP year-built cutoff, the technician labor
    billed on the service date of the job's latest HEPA vacuuming line, because the Renovation, Repair and Painting Rule requires
    the work area to be cleaned and the cleaning verified before it is released; for a commercial property built before the
    tier's asbestos sampling year cutoff, the technician and supervisor labor billed on that date, because the asbestos NESHAP
    work practices require the supervised wet cleanup of the area after tear-out, except that a HEPA vacuuming date that is
    also the service date of the job's latest containment setup line takes none, the labor of that day being counted once;
    otherwise no verification labor.
  prerequisite: []
  cross_category:
  - category: water
    as: history
    reads:
    - year_built
    - variant_name
    - property_type
    - water_charges.amount
    - water_charges.service_date
    note: the water job lines, build year, tier and property type decide every regulated family.
  compute:
  - rs_lead: XSUM('water', 'water_charges', 'amount', charge_code='lead_safe_setup')
  - rs_asb: XSUM('water', 'water_charges', 'amount', charge_code='asbestos_sampling')
  - rs_built: int(CFIELD('water', 'year_built', claim_file_id=HID) or 9999)
  - rs_rrp: CPARAM('water', 'rrp_year_built_cutoff', claim_file_id=HID) or 0
  - rs_asbcut: CPARAM('water', 'asbestos_sampling_year_cutoff', claim_file_id=HID) or 0
  - rs_tier: CFIELD('water', 'variant_name', claim_file_id=HID) or ''
  - rs_cont: XSUM('water', 'water_charges', 'amount', charge_code='containment_setup')
  - rs_hepa: XSUM('water', 'water_charges', 'amount', charge_code='hepa_vacuum')
  - rs_cleanup: >-
      rs_hepa if (rs_built < rs_rrp and (rs_tier == 'Black Water Mitigation - Standard Loss' or rs_tier == 'Black Water Mitigation
      - Large Loss')) else ((rs_cont + rs_hepa) if rs_built < rs_rrp else 0)
  - rs_haul: XSUM('water', 'water_charges', 'amount', charge_code='debris_haul')
  - rs_dump: XSUM('water', 'water_charges', 'amount', charge_code='dumpster')
  - rs_disposal: >-
      rs_haul if (rs_built < rs_asbcut and rs_asb > 0 and rs_haul > 0) else (rs_dump if (rs_built < rs_asbcut and rs_asb >
      0 and rs_haul == 0) else 0)
  - rs_ppe_ok: CPARAM('water', 'ppe_billable', claim_file_id=HID) or False
  - rs_ppe_rate: CPARAM('water', 'ppe_rate_per_tech_day', claim_file_id=HID) or 0
  - rs_ppe_lines: XSUM('water', 'water_charges', 'amount', charge_code='ppe')
  - rs_ppe: >-
      rs_ppe_lines if (rs_ppe_ok and rs_asb > 0) else (rs_ppe_rate if (rs_ppe_ok and rs_asb == 0 and rs_lead > 0) else 0)
  - rs_ptype: CFIELD('water', 'property_type', claim_file_id=HID) or ''
  - rs_setup_date: >-
      XLATEST('water', 'water_charges', 'service_date', date_field='service_date', charge_code='containment_setup')
  - rs_sup: >-
      XSUM('water', 'water_charges', 'amount', charge_code='supervisor_labor', service_date=rs_setup_date)
  - rs_tech: >-
      XSUM('water', 'water_charges', 'amount', charge_code='technician_labor', service_date=rs_setup_date)
  - rs_labor: >-
      rs_sup if (rs_ptype != 'commercial' and rs_built < rs_rrp) else ((rs_tech + rs_sup) if (rs_ptype == 'commercial' and
      rs_built < rs_asbcut) else 0)
  - rs_ptype_t: CFIELD('water', 'property_type', claim_file_id=HID) or ''
  - rs_flood: XSUM('water', 'water_charges', 'amount', charge_code='flood_cut')
  - rs_base: XSUM('water', 'water_charges', 'amount', charge_code='baseboard_removal')
  - rs_tearout: >-
      (rs_flood + rs_base) if ((rs_ptype_t == 'multifamily_unit' or rs_ptype_t == 'commercial') and rs_built < rs_asbcut)
      else (rs_base if ((rs_ptype_t == 'single_family' or rs_ptype_t == 'condo_unit') and rs_built < rs_rrp) else 0)
  - rs_ptype_v: CFIELD('water', 'property_type', claim_file_id=HID) or ''
  - rs_hepa_date: >-
      XLATEST('water', 'water_charges', 'service_date', date_field='service_date', charge_code='hepa_vacuum')
  - rs_v_tech: >-
      XSUM('water', 'water_charges', 'amount', charge_code='technician_labor', service_date=rs_hepa_date)
  - rs_v_sup: >-
      XSUM('water', 'water_charges', 'amount', charge_code='supervisor_labor', service_date=rs_hepa_date)
  - rs_v_setup: >-
      XLATEST('water', 'water_charges', 'service_date', date_field='service_date', charge_code='containment_setup') or ''
  - rs_verify: >-
      rs_v_tech if (rs_ptype_v != 'commercial' and rs_built < rs_rrp) else (((rs_v_tech + rs_v_sup) if rs_hepa_date != rs_v_setup
      else 0) if (rs_ptype_v == 'commercial' and rs_built < rs_asbcut) else 0)
  - result: >-
      RND(rs_lead + rs_asb + rs_cleanup + rs_disposal + rs_ppe + rs_labor + rs_tearout + rs_verify + K('rounding_guard'),
      2)
