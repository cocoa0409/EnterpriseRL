- id: claims_evt_supplement
  subject:
  - claims_supplement_submit
  rule: The claim file must be in approved status when a supplement is submitted. A supplement may be submitted
    only no later than the supplement window after the carrier's initial approval. The supplement window is counted
    in calendar days starting the day after the claim file's approved_date, and a supplement submitted on the last
    day of the window is in time. A supplement may not be submitted while the file already has the tier's maximum
    number of supplements awaiting a carrier decision. A supplement is submitted only for an amount at least the
    tier's supplement minimum and only for a reason the tier allows. A code_upgrade supplement may request no more
    than the ordinance or law limit less the code upgrade amounts already approved on the file, and a mold_remediation
    supplement no more than the mold sublimit less the mold amounts already approved; when that remainder is zero
    the supplement is not submitted and the excess is the customer's own cost. Supplements are numbered in sequence
    on the file starting at 1. On tiers where the company does not submit supplements, the company prepares the
    supplement and records it on the day it is delivered to the insured or public adjuster. A supplement without
    a carrier decision is followed up after the tier's follow-up days and escalated after the tier's number of follow-ups.
  eligibility:
  - id: su_state
    applies_to:
    - claims_supplement_submit
    kind: state
    condition: The claim file must be in approved status when a supplement is submitted.
    evidence_fields:
    - claims_files.status
    - claims_files.claim_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_files.claim_file_id
      action_bindings:
        claims_files.claim_file_id: claim_file_id
    state_contract:
      field: claims_files.status
      allowed:
      - approved
  - id: su_window
    applies_to:
    - claims_supplement_submit
    kind: time
    condition: A supplement may be submitted only no later than the supplement window after the carrier's initial
      approval.
    evidence_fields:
    - claims_files.approved_date
    - claims_files.claim_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claims_files.claim_file_id
      action_bindings:
        claims_files.claim_file_id: claim_file_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the carrier's initial approval
      anchor_source: claims_files.approved_date
      relation: not_after
      duration_source: variants.supplement_window_days
      unit: calendar_days
      counting_rule: The supplement window is counted in calendar days starting the day after the claim file's approved_date,
        and a supplement submitted on the last day of the window is in time.
      boundary: inclusive
  - id: su_pending
    applies_to:
