      than the deductible, the deductible less that shortfall; otherwise nothing.
    rl_ded_amt: >-
      The deductible carry is set as follows: when the ACV carrier payments on the dwelling coverage are at least the initial
      dwelling approval less its depreciation withheld, the whole deductible; when they fall short of that figure by less
      than the deductible, the deductible less that shortfall; otherwise nothing.
    rl_deductible: >-
      The deductible carry is set as follows: when the ACV carrier payments on the dwelling coverage are at least the initial
      dwelling approval less its depreciation withheld, the whole deductible; when they fall short of that figure by less
      than the deductible, the deductible less that shortfall; otherwise nothing.
    rl_adv: >-
      The advance recoupment is set as follows: when the ACV carrier payments on the dwelling coverage are at least the initial
      dwelling approval less its depreciation withheld less the deductible, every advance payment received on the dwelling
      coverage, because the carrier recoups an advance it did not deduct from the ACV payment out of the final payment; when
      they fall short of that figure by less than the advances, the advances less that shortfall; otherwise nothing.
    a_init_wh: >-
      The advance recoupment is set as follows: when the ACV carrier payments on the dwelling coverage are at least the initial
      dwelling approval less its depreciation withheld less the deductible, every advance payment received on the dwelling
      coverage, because the carrier recoups an advance it did not deduct from the ACV payment out of the final payment; when
      they fall short of that figure by less than the advances, the advances less that shortfall; otherwise nothing.
    a_acv: >-
      The advance recoupment is set as follows: when the ACV carrier payments on the dwelling coverage are at least the initial
      dwelling approval less its depreciation withheld less the deductible, every advance payment received on the dwelling
      coverage, because the carrier recoups an advance it did not deduct from the ACV payment out of the final payment; when
      they fall short of that figure by less than the advances, the advances less that shortfall; otherwise nothing.
    rl_adv_gap: >-
      The advance recoupment is set as follows: when the ACV carrier payments on the dwelling coverage are at least the initial
      dwelling approval less its depreciation withheld less the deductible, every advance payment received on the dwelling
      coverage, because the carrier recoups an advance it did not deduct from the ACV payment out of the final payment; when
      they fall short of that figure by less than the advances, the advances less that shortfall; otherwise nothing.
    rl_advance: >-
      The advance recoupment is set as follows: when the ACV carrier payments on the dwelling coverage are at least the initial
      dwelling approval less its depreciation withheld less the deductible, every advance payment received on the dwelling
      coverage, because the carrier recoups an advance it did not deduct from the ACV payment out of the final payment; when
      they fall short of that figure by less than the advances, the advances less that shortfall; otherwise nothing.
    rl_sup_wh: >-
      The code holdback cut is set as follows: when the depreciation withheld on the file's dwelling supplement approvals
      is above the change order charges posted on the contract and the contract is final_invoiced or closed, the withheld
      amount above those charges; when that withheld amount is above those charges and the contract is substantially_complete,
      the whole depreciation withheld on the dwelling supplement approvals; otherwise nothing.
    rb_status_c: >-
      The code holdback cut is set as follows: when the depreciation withheld on the file's dwelling supplement approvals
      is above the change order charges posted on the contract and the contract is final_invoiced or closed, the withheld
      amount above those charges; when that withheld amount is above those charges and the contract is substantially_complete,
      the whole depreciation withheld on the dwelling supplement approvals; otherwise nothing.
    rb_co_c: >-
      The code holdback cut is set as follows: when the depreciation withheld on the file's dwelling supplement approvals
      is above the change order charges posted on the contract and the contract is final_invoiced or closed, the withheld
      amount above those charges; when that withheld amount is above those charges and the contract is substantially_complete,
      the whole depreciation withheld on the dwelling supplement approvals; otherwise nothing.
    rl_code_cut: >-
      The code holdback cut is set as follows: when the depreciation withheld on the file's dwelling supplement approvals
      is above the change order charges posted on the contract and the contract is final_invoiced or closed, the withheld
      amount above those charges; when that withheld amount is above those charges and the contract is substantially_complete,
      the whole depreciation withheld on the dwelling supplement approvals; otherwise nothing.
    rl_sup_amt: >-
      The supplement depreciation already paid is set as follows: when the supplement carrier payments on the dwelling coverage
      reach the dwelling supplement approvals, the whole depreciation withheld on those approvals, because the carrier has
      paid it with the supplement; when they exceed the supplement approvals less their depreciation withheld but fall short
      of the approvals, the supplement payments less that figure, because the carrier has paid that part of the withheld depreciation;
      otherwise nothing.
    rl_sup_wh2: >-
      The supplement depreciation already paid is set as follows: when the supplement carrier payments on the dwelling coverage
      reach the dwelling supplement approvals, the whole depreciation withheld on those approvals, because the carrier has
      paid it with the supplement; when they exceed the supplement approvals less their depreciation withheld but fall short
      of the approvals, the supplement payments less that figure, because the carrier has paid that part of the withheld depreciation;
      otherwise nothing.
    rl_sup_paid: >-
      The supplement depreciation already paid is set as follows: when the supplement carrier payments on the dwelling coverage
      reach the dwelling supplement approvals, the whole depreciation withheld on those approvals, because the carrier has
      paid it with the supplement; when they exceed the supplement approvals less their depreciation withheld but fall short
      of the approvals, the supplement payments less that figure, because the carrier has paid that part of the withheld depreciation;
      otherwise nothing.
    rl_sup_released: >-
      The supplement depreciation already paid is set as follows: when the supplement carrier payments on the dwelling coverage
      reach the dwelling supplement approvals, the whole depreciation withheld on those approvals, because the carrier has
      paid it with the supplement; when they exceed the supplement approvals less their depreciation withheld but fall short
      of the approvals, the supplement payments less that figure, because the carrier has paid that part of the withheld depreciation;
      otherwise nothing.
    result: >-
      The release figure is the dwelling holdback less each deduction settled below, the deductions being independent of one
      another; the figure is never below zero and is rounded to the cent, half up, once, on the final figure.
  factors:
  - id: contract_cost_measure
    effect: method
    decides: rl_contract
    bindings:
    - rb_status
    - rb_paid
    - rb_final
    - rl_contract
    ladder:
    - when: the contract is closed
      method: the draw payments and insurance postings received
    - when: the contract is final_invoiced
      method: its final invoice amount
    - when: otherwise
      method: contract amount plus change order charges less credits (standard)
    baseline:
      rl_contract: rb_amount + rb_co - rb_cr
    evidence:
    - cross_category
    - history
    cross_difficulty: rebuild
  - id: water_cost_measure
    effect: method
    decides: rl_water
    bindings:
    - wj_status
    - wj_final
    - wj_credits
    - rl_water
    ladder:
    - when: the water job is closed
      method: final invoice less billing_error, duplicate_line and goodwill credits
    - when: the water job is invoiced and not closed
      method: its final invoice amount
    - when: otherwise
      method: every charge posted other than late fees and card surcharges (standard)
    baseline:
      rl_water: wj_posted
    evidence:
    - cross_category
    - history
    cross_difficulty: water
  - id: deductible_carry_rule
    effect: parameter
    decides: rl_deductible
    bindings:
    - rl_init_wh
    - rl_acv
    - rl_gap
    - rl_ded_amt
    - rl_deductible
    ladder:
    - when: ACV payments at least the initial approval less its withheld depreciation
      value: the whole deductible
    - when: ACV payments short of that by less than the deductible
      value: the deductible less that shortfall
    - when: otherwise
      value: '0'
    baseline:
      rl_deductible: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: advance_recoupment_rule
    effect: parameter
    decides: rl_advance
    bindings:
    - rl_adv
    - a_init_wh
    - a_acv
    - rl_adv_gap
    - rl_advance
    ladder:
    - when: ACV payments at least the initial approval less withheld depreciation less the deductible
      value: every advance received
    - when: ACV payments short of that by less than the advances
      value: the advances less that shortfall
    - when: otherwise
      value: '0'
    baseline:
      rl_advance: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: code_holdback_cut_rule
    effect: method
    decides: rl_code_cut
    bindings:
    - rl_sup_wh
    - rb_status_c
    - rb_co_c
    - rl_code_cut
    ladder:
    - when: >-
        supplement withheld above the change order charges and the contract final_invoiced or closed
      method: the withheld amount above those charges
    - when: that withheld above those charges and the contract substantially_complete
      method: the whole supplement withheld
    - when: otherwise
      method: nothing
    baseline:
      rl_code_cut: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rebuild
  - id: supplement_depreciation_paid
    effect: parameter
    decides: rl_sup_released
    bindings:
    - rl_sup_amt
    - rl_sup_wh2
    - rl_sup_paid
    - rl_sup_released
    ladder:
    - when: supplement payments reach the supplement approvals
      value: the whole depreciation withheld on the supplement approvals
    - when: >-
        supplement payments exceed the approvals less their withheld depreciation but fall short of the approvals
      value: the supplement payments less the approvals net of withheld depreciation
    - when: otherwise
      value: '0'
    baseline:
      rl_sup_released: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The dwelling holdback is the depreciation withheld on every dwelling scope approval of the file, less the depreciation_release
      carrier payments received on the dwelling coverage and less every write-off posted on the file's approvals, never below
      zero. The incurred-cost shortfall is the expected dwelling approvals less the billed cost, never below zero. The expected
      approvals are the dwelling approvals as recorded plus the amounts requested on dwelling scope_omission and price_variance
      supplements awaiting the carrier's decision, because a pending supplement is settled against the same approvals once
      decided and the release pays depreciation only on scope that was billed; the billed cost is the contract cost plus the
      water job cost, as settled below. The contract cost is the contract amount plus the change order charges and less the
      change order credits posted on the contract. The water job cost is every charge posted on the water job other than late
      fees and card surcharges.
    params:
    - rounding_guard
  inputs:
    history:
    - table: claims_approvals
      aggregate: sum
      field: depreciation_withheld
      filters:
        coverage_part: dwelling
    - category: rebuild
      table: rebuild_payments
      aggregate: sum
      field: amount
      filters:
        event_type: rebuild_draw_payment
    - category: water
      table: water_charges
      aggregate: sum
      field: amount
      filters: {}
    cross_category:
    - rebuild
    - water
- id: claims_ext_mold_protocol_supplement
  base_policy_refs:
  - claims_evt_supplement
  - claims_carrier_decision
  - claims_agg_multi_holding
  overwrite: []
  trigger: state_due
  subject:
  - claims_supplement_submit
  computes: requested_amount
  target_tool: submit_mold_protocol_supplement_d9a0c26a
  params:
    rounding_guard: 1.0e-09
  rule: >-
    This policy prices the protocol supplement: the mold_remediation supplement the company prepares from the independent
    assessor's protocol for the mold job awaiting clearance, naming that job, on a Homeowner Direct Pay Claim Support file
    whose loss_type is not mold (so no part of the initial approval is a mold amount) and whose insured holds exactly two
    mold jobs, both linked to the file, one closed and one awaiting clearance, and on which every supplement approval decides
    a mold_remediation supplement; any other supplement is handled under the base supplement rule. The claim file must be
    in approved status when a supplement is submitted. A supplement may be submitted only no later than the supplement window
    after the carrier's initial approval, counted in calendar days starting the day after the claim file's approved_date,
    a supplement submitted on the last day of the window being in time. A supplement may not be submitted while the file already
    has the tier's maximum number of supplements awaiting a carrier decision; it is submitted only on tiers that allow mold
    supplements and only for an amount at least the tier's supplement minimum, and a protocol figure below that minimum is
    not submitted. The company prepares the protocol supplement and records it on the day it is delivered to the insured,
    numbered in sequence on the file starting at 1, coverage dwelling, reason mold_remediation, naming the job awaiting clearance.
    The protocol figure is the core scope plus each scope family settled below, every family priced from the growth area recorded
    on the job awaiting clearance and that job tier's rates; the sum is held to the mold room and rounded to the cent, half
    up, once, on the final figure. The protocol figure prices the growth area recorded on the job awaiting clearance at that
    job tier's HEPA vacuuming and antimicrobial rates per square foot as its core scope. Its standard surface treatment is
    wire-brush sanding and encapsulation of the growth area at the tier's rates per square foot. Its standard removal is drywall
    removal and insulation removal over the growth area at the tier's rates per square foot. Its standard air treatment is
    one dehumidifier for the tier's billable equipment day cap at the tier's dehumidifier daily rate. The mold room is the
    file's mold sublimit less the mold amounts already approved on the file, never below zero, and the protocol figure may
    not exceed it. The surface treatment is priced as follows: for growth in an attic or crawlspace, soda blasting of the
    growth area at the tier's soda blasting rate, because media blasting is the method the attic tier allows on framing and
    sheathing; for growth in the HVAC system, the tier's air handler cleaning fee and coil cleaning fee; for growth in a living
    area or basement, the standard surface treatment. The removal is priced as follows: for growth in an attic or crawlspace,
    insulation removal over the growth area plus one debris disposal load at the tier's fee, because an attic carries no drywall
    to remove and the insulation leaves the building as bagged debris; for growth in a basement, drywall removal over the
    growth area only, because basement walls are uninsulated foundation walls; for growth anywhere else, the standard removal.
    The air treatment is priced as follows: on a tier that requires both containment and negative air, the tier's containment
    setup fee plus one air scrubber and one dehumidifier at the tier's daily rates for each day the job's containment was
    held, that is the calendar days from the job's containment date up to its clearance request date (the containment date
    counted, the request date not), held to the billable equipment day cap, because both machines run inside the held containment;
    on a tier that requires negative air but no containment, one air scrubber at that rate for each calendar day from the
    job's scheduled start date up to its clearance request date, held to the cap, because the scrubber runs only while the
    work runs; when either date is not recorded the cap is used; on any other tier, the standard air treatment. The regulated-material
    fee is priced as follows: on a file that carries no ordinance-or-law limit, for growth in a living area or basement of
    housing (a single-family house, condominium unit or multifamily unit) built before the tier's RRP year-built cutoff, the
    tier's lead-safe setup fee plus its asbestos sampling fee, because removal there disturbs painted surfaces in target housing
    under the EPA Renovation, Repair and Painting Rule and the building also predates the asbestos sampling year cutoff; on
    a file that carries no ordinance-or-law limit, for any other growth outside the HVAC system in a building built before
    the tier's asbestos sampling year cutoff, the tier's asbestos sampling fee alone, because the suspect materials are sampled
    while lead-safe work is priced only with finished living spaces and basements; otherwise no regulated-material fee, because
    on a file with an ordinance-or-law limit the regulated-material work of a mold job is claimed as a code_upgrade supplement
    under that limit rather than against the mold sublimit, which caps every mold supplement, and HVAC cleaning disturbs no
    regulated material.
  prerequisite: []
  cross_category:
  - category: mold
    as: branch
    reads:
    - growth_area_sqft
    - growth_location
    - property_type
    - year_built
    - containment_date
    - clearance_requested_date
    - scheduled_start_date
    note: >-
      the job awaiting clearance decides every scope family and the regulated-material fee from its location, property, build
      year and tier.
  compute:
  - mp_area: >-
      float(CFIELD('mold', 'growth_area_sqft', claim_file_id=HID, status='awaiting_clearance') or 0)
  - mp_hepa_rate: >-
      CPARAM('mold', 'hepa_vacuum_rate_per_sqft', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_anti_rate: >-
      CPARAM('mold', 'antimicrobial_rate_per_sqft', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_core: mp_area * (mp_hepa_rate + mp_anti_rate)
  - mp_loc: CFIELD('mold', 'growth_location', claim_file_id=HID, status='awaiting_clearance')
  - mp_soda: >-
      CPARAM('mold', 'soda_blasting_rate_per_sqft', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_brush: >-
      CPARAM('mold', 'wire_brush_sanding_rate_per_sqft', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_encap: >-
      CPARAM('mold', 'encapsulation_rate_per_sqft', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_handler: >-
      CPARAM('mold', 'air_handler_cleaning_fee', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_coil: CPARAM('mold', 'coil_cleaning_fee', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_surface: >-
      mp_area * mp_soda if (mp_loc == 'attic' or mp_loc == 'crawlspace') else ((mp_handler + mp_coil) if mp_loc == 'hvac'
      else mp_area * (mp_brush + mp_encap))
  - mp_drywall: >-
      CPARAM('mold', 'drywall_removal_rate_per_sqft', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_insul: >-
      CPARAM('mold', 'insulation_removal_rate_per_sqft', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_loc_rm: CFIELD('mold', 'growth_location', claim_file_id=HID, status='awaiting_clearance')
  - mp_debris_fee: >-
      CPARAM('mold', 'debris_disposal_fee_per_load', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_removal: >-
      (mp_area * mp_insul + mp_debris_fee) if (mp_loc_rm == 'attic' or mp_loc_rm == 'crawlspace') else (mp_area * mp_drywall
      if mp_loc_rm == 'basement' else mp_area * (mp_drywall + mp_insul))
  - mp_cont_req: >-
      CPARAM('mold', 'containment_required', claim_file_id=HID, status='awaiting_clearance') or False
  - mp_negair_req: >-
      CPARAM('mold', 'negative_air_required', claim_file_id=HID, status='awaiting_clearance') or False
  - mp_cont_fee: >-
      CPARAM('mold', 'containment_setup_fee', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_scrub_rate: >-
      CPARAM('mold', 'air_scrubber_daily_rate', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_dehu_rate: >-
      CPARAM('mold', 'dehumidifier_daily_rate', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_cap: >-
      CPARAM('mold', 'billable_equipment_day_cap', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_cdate: CFIELD('mold', 'containment_date', claim_file_id=HID, status='awaiting_clearance') or ''
  - mp_rdate: >-
      CFIELD('mold', 'clearance_requested_date', claim_file_id=HID, status='awaiting_clearance') or ''
  - mp_sdate: >-
      CFIELD('mold', 'scheduled_start_date', claim_file_id=HID, status='awaiting_clearance') or ''
  - mp_hold: MN(mp_cap, DAYS(mp_cdate, mp_rdate)) if (mp_cdate != '' and mp_rdate != '') else mp_cap
  - mp_work: MN(mp_cap, DAYS(mp_sdate, mp_rdate)) if (mp_sdate != '' and mp_rdate != '') else mp_cap
  - mp_air: >-
      (mp_cont_fee + (mp_scrub_rate + mp_dehu_rate) * mp_hold) if (mp_cont_req and mp_negair_req) else ((mp_scrub_rate * mp_work)
      if (mp_negair_req and not mp_cont_req) else mp_dehu_rate * mp_cap)
  - mp_ptype: CFIELD('mold', 'property_type', claim_file_id=HID, status='awaiting_clearance')
  - mp_built: int(CFIELD('mold', 'year_built', claim_file_id=HID, status='awaiting_clearance') or 9999)
  - mp_rrp: >-
      CPARAM('mold', 'rrp_year_built_cutoff', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_asbcut: >-
      CPARAM('mold', 'asbestos_sampling_year_cutoff', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_leadfee: CPARAM('mold', 'lead_safe_setup_fee', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_asbfee: >-
      CPARAM('mold', 'asbestos_sampling_fee', claim_file_id=HID, status='awaiting_clearance') or 0
  - mp_loc_rg: CFIELD('mold', 'growth_location', claim_file_id=HID, status='awaiting_clearance')
  - mp_olaw: F('ordinance_law_limit') or 0
  - mp_reg: >-
      (mp_leadfee + mp_asbfee) if (mp_olaw == 0 and (mp_loc_rg == 'living_area' or mp_loc_rg == 'basement') and mp_ptype !=
      'commercial' and mp_built < mp_rrp) else (mp_asbfee if (mp_olaw == 0 and mp_loc_rg != 'hvac' and mp_built < mp_asbcut)
      else 0)
  - mp_approved: >-
      SUM('claims_approvals', 'amount', event_type='claims_scope_approval', approval_type='supplement')
  - mp_room: MX(0, (F('mold_sublimit') or 0) - mp_approved)
  - result: >-
      RND(MN(mp_core + mp_surface + mp_removal + mp_air + mp_reg, mp_room) + K('rounding_guard'), 2)
