- id: claims_carrier_decision
  subject:
  - claims_carrier_approval
  - claims_carrier_denial
  - claims_scope_approval
  rule: 'The carrier''s decision on the submitted estimate is recorded exactly as the carrier''s approval letter
    states it: an approval moves the file to approved and records the initial scope approval by coverage part, and
    a denial moves it to denied, after which nothing is billed under the file and every job of the loss becomes
    the customer''s own responsibility. The claim file must be in approved status when a scope approval is recorded.
    A supplement approval names the supplement request it decides and records the amount the carrier approved, which
    may be less than requested; the approved amount raises the carrier receivable and the depreciation the carrier
    withholds is recorded on the same line. An estimate at or above the tier''s initial reinspection threshold,
    or a supplement at or above the supplement reinspection threshold, is approved only after the carrier''s reinspection.'
  eligibility:
  - id: ap_state
    applies_to:
    - claims_scope_approval
    kind: state
    condition: The claim file must be in approved status when a scope approval is recorded.
    evidence_fields:
