  - claims_check_endorsement
  rule: 'The claim file must be in approved status when a carrier payment is recorded. Every carrier payment is
    recorded as the payment advice states it, including payments issued to the insured alone, and lowers the carrier
    receivable. A contractor_direct payment can be posted to the company''s jobs at once; an insured_two_party check
    can be posted only after the insured has endorsed it, and the insured is asked to endorse within the tier''s
    endorsement days of being notified; an insured_only payment is never posted to a job, because the insured pays
    the company''s invoices from it; a mortgagee_loss_draft payment stays with the mortgagee and reaches the company
    only as released rebuild draws. A two-party check may be endorsed only by the insured named on the claim file.
    A dwelling-coverage payment that can be posted is applied across the jobs of the claim file in the tier''s payment
    allocation order: first the mitigation jobs (water, fire and mold) in order of invoiced date, earliest first,
    then any mitigation jobs not yet invoiced in order of opened date, and last the rebuild contract; each job takes
    at most its own balance due before the next job is paid. A contents-coverage payment is applied only to the
    contents job of the claim file. A payment remainder left after every job of the file is paid in full is not
    posted anywhere and is handed to a human representative as not covered by policy.'
