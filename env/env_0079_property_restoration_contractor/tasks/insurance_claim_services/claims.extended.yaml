    difference.
  prerequisite:
  - problem: claims_ext_regulated_scope_supplement
    kind: value_input
    gate: sc_reg_pending
    form: action
    policy_source: >-
      The category reassessment supplement is fixed only after the regulated-scope supplement owed for the water job has been
      prepared and, where it reaches the supplement minimum, recorded on the file.
    fallback_reason: >-
      The regulated-scope supplement leaves a pending scope_omission request only when its figure reaches the supplement minimum;
      below it nothing is recorded, so a state sentence would wait on a record that never appears.
    condition: >-
      claims_requests carries a scope_omission supplement naming the water job that no approval decides, or the regulated-scope
      figure is below the supplement minimum.
    resolved_by: submit_regulated_scope_supplement_ec41bed4
    effect: >-
      The pending regulated scope turns the regulated-cleanup difference from the HEPA difference to the containment and HEPA
      difference.
  cross_category:
  - category: water
    as: branch
    reads:
    - variant_name
    - water_category
    - affected_area_sqft
    - water_charges.quantity
    note: >-
      the job tier, the recorded category and the area select every family; the billed quantities size them.
  compute:
  - sc_tier: CFIELD('water', 'variant_name', claim_file_id=HID) or ''
  - sc_cat: CFIELD('water', 'water_category', claim_file_id=HID) or ''
  - sc_area: float(CFIELD('water', 'affected_area_sqft', claim_file_id=HID) or 0)
  - sc_large: sc_area >= K('large_loss_area_sqft')
  - sc_clean: >-
      sc_tier == 'Clean Water Mitigation - Standard Loss' or sc_tier == 'Clean Water Mitigation - Large Loss'
  - sc_gray: >-
      sc_tier == 'Gray Water Mitigation - Standard Loss' or sc_tier == 'Gray Water Mitigation - Large Loss'
  - sc_extr_qty: XSUM('water', 'water_charges', 'quantity', charge_code='extraction')
  - sc_extr_rate: CPARAM('water', 'extraction_rate_per_sqft', claim_file_id=HID) or 0
  - sc_extr: >-
      sc_extr_qty * ((K('black_large_extraction_rate') if sc_large else K('black_std_extraction_rate')) - sc_extr_rate) if
      ((sc_clean or sc_gray) and sc_cat == 'category_3') else (sc_extr_qty * ((K('gray_large_extraction_rate') if sc_large
      else K('gray_std_extraction_rate')) - sc_extr_rate) if (sc_clean and sc_cat == 'category_2') else 0)
  - sc_carpet_qty: XSUM('water', 'water_charges', 'quantity', charge_code='carpet_detach_reset')
  - sc_carpet: >-
      sc_carpet_qty * (K('black_large_carpet_removal_rate') if sc_large else K('black_std_carpet_removal_rate')) if ((sc_clean
      or sc_gray) and sc_cat == 'category_3') else (sc_carpet_qty * (K('gray_large_pad_removal_rate') if sc_large else K('gray_std_pad_removal_rate'))
      if (sc_clean and sc_cat == 'category_2') else 0)
  - sc_ppe_qty: XSUM('water', 'water_charges', 'quantity', charge_code='ppe')
  - sc_ppe_rate: CPARAM('water', 'ppe_rate_per_tech_day', claim_file_id=HID) or 0
  - sc_tech_lines: XCOUNT('water', 'water_charges', charge_code='technician_labor')
  - sc_ppe: >-
      sc_ppe_qty * (K('black_ppe_rate') - sc_ppe_rate) if (sc_gray and sc_cat == 'category_3') else (sc_tech_lines * (K('black_ppe_rate')
      if sc_cat == 'category_3' else K('gray_ppe_rate')) if (sc_clean and (sc_cat == 'category_2' or sc_cat == 'category_3'))
      else 0)
  - sc_cont_line: XSUM('water', 'water_charges', 'amount', charge_code='containment_setup')
  - sc_hepa_qty: XSUM('water', 'water_charges', 'quantity', charge_code='hepa_vacuum')
  - sc_hepa_rate: CPARAM('water', 'hepa_vacuum_rate_per_sqft', claim_file_id=HID) or 0
  - sc_reg_pending: >-
      SUM('claims_requests', 'requested_amount', supplement_reason='scope_omission', related_job_id=CFIELD('water', 'water_job_id',
      claim_file_id=HID))
  - sc_reg: >-
      ((K('black_large_containment_fee') if sc_large else K('black_std_containment_fee')) - sc_cont_line + sc_hepa_qty * ((K('black_large_hepa_rate')
      if sc_large else K('black_std_hepa_rate')) - sc_hepa_rate)) if ((sc_clean or sc_gray) and sc_cat == 'category_3' and
      sc_reg_pending > 0) else ((sc_hepa_qty * ((K('black_large_hepa_rate') if sc_large else K('black_std_hepa_rate')) - sc_hepa_rate))
      if ((sc_clean or sc_gray) and sc_cat == 'category_3') else 0)
  - sc_scrub_req: CPARAM('water', 'air_scrubber_required', claim_file_id=HID) or False
  - sc_mover_days: XCOUNT('water', 'water_charges', charge_code='air_mover')
  - sc_scrub: >-
      sc_mover_days * (K('black_large_scrubber_rate') if sc_large else K('black_std_scrubber_rate')) if ((not sc_scrub_req)
      and sc_cat == 'category_3') else (sc_mover_days * K('gray_large_scrubber_rate') if ((not sc_scrub_req) and sc_cat ==
      'category_2' and sc_large) else 0)
  - sc_anti_qty: XSUM('water', 'water_charges', 'quantity', charge_code='antimicrobial')
  - sc_anti_amt: XSUM('water', 'water_charges', 'amount', charge_code='antimicrobial')
  - sc_anti_rate: CPARAM('water', 'antimicrobial_rate_per_sqft', claim_file_id=HID) or 0
  - sc_anti: >-
      MX(0, sc_area * ((K('black_large_antimicrobial_rate') if sc_large else K('black_std_antimicrobial_rate')) if sc_cat
      == 'category_3' else (K('gray_large_antimicrobial_rate') if sc_large else K('gray_std_antimicrobial_rate'))) - sc_anti_amt)
      if (sc_clean and (sc_cat == 'category_2' or sc_cat == 'category_3')) else (sc_anti_qty * ((K('black_large_antimicrobial_rate')
      if sc_large else K('black_std_antimicrobial_rate')) - sc_anti_rate) if (sc_gray and sc_cat == 'category_3') else 0)
  - result: >-
      RND(MX(0, sc_extr + sc_carpet + sc_ppe + sc_reg + sc_scrub + sc_anti) + K('rounding_guard'), 2)
