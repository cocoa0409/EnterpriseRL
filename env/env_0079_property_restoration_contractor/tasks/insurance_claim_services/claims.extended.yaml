    wp_tier: >-
      The carrier's pricing for water job lines is applied as follows: on a Carrier Program Claim Billing file, the water
      job credit families less the tier's program pricing discount, because the approved estimate was priced net of it; on
      any other file whose estimate carried at least the tier's minimum number of distinct trades and was submitted on or
      after the water job was opened, so that it carried the water job's mitigation lines, the water job credit families raised
      by the tier's overhead percentage plus profit percentage, because the approved estimate added overhead and profit to
      its whole line-item total; otherwise the water job credit families stand.
    wp_trades: >-
      The carrier's pricing for water job lines is applied as follows: on a Carrier Program Claim Billing file, the water
      job credit families less the tier's program pricing discount, because the approved estimate was priced net of it; on
      any other file whose estimate carried at least the tier's minimum number of distinct trades and was submitted on or
