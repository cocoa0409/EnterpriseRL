    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: water
  - id: reassessed_antimicrobial
    effect: method
    decides: sc_anti
    bindings:
    - sc_anti_qty
    - sc_anti_amt
    - sc_anti_rate
    - sc_anti
    ladder:
    - when: a Clean Water job whose recorded category is category_2 or category_3
      method: >-
        the affected area times the antimicrobial rate of the tier the recorded category selects, less the antimicrobial billed,
        never below zero
    - when: a Gray Water job whose recorded category is category_3
      method: antimicrobial square feet billed times (Black Water rate less the dispatch tier rate)
    - when: otherwise
      method: '0'
    baseline:
      sc_anti: '0'
    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: water
