  rule: >-
    This policy prices the category reassessment supplement: the price_variance supplement the company prepares for a water
    mitigation job whose water category recorded on the job differs from the category of the tier the job was dispatched at,
    naming that job, on a Public Adjuster Coordinated Claim Billing file whose insured holds exactly one water mitigation
    job, and that job is linked to the file, on which no price_variance or scope_omission supplement has yet been decided
    and on which no billing_error or duplicate_line credit corrects a line this policy reads. The water charter fixes the
    tier at dispatch and does not reprice the job when the category is reassessed; on an insurance-funded job the difference
    in scope is pursued as this supplement. Any other supplement is handled under the base supplement rule. The claim file
    must be in approved status when a supplement is submitted. A supplement may be submitted only no later than the supplement
    window after the carrier's initial approval, counted in calendar days starting the day after the claim file's approved_date,
    a supplement submitted on the last day of the window being in time. A supplement may not be submitted while the file already
    has the tier's maximum number of supplements awaiting a carrier decision, and it is submitted only for an amount at least
    the tier's supplement minimum. The company prepares the supplement and records it on the day it is delivered to the insured
    or public adjuster, numbered in sequence on the file starting at 1, coverage dwelling, reason price_variance, naming the
    water job. The reassessment figure adds up the line-family differences settled below, each priced from the water charter's
    rates for the tier the recorded category and the job's affected area select (Standard Loss below the 2,000 square foot
    Large Loss threshold of the water tiers' entry gates, Large Loss at or above it); the figure is never below zero and is
    rounded to the cent, half up, once, on the final figure. The reassessment figure starts from nothing: a line family adds
    a difference only as settled below. The extraction difference is set as follows: for a job dispatched at a Clean or Gray
    Water tier whose recorded category is category_3, the extraction square feet billed times the Black Water extraction rate
    less the dispatch tier's extraction rate; for a job dispatched at a Clean Water tier whose recorded category is category_2,
    the extraction square feet billed times the Gray Water extraction rate less the dispatch tier's extraction rate; otherwise
    no extraction difference. The carpet treatment is set as follows: for a job dispatched at a Clean or Gray Water tier whose
    recorded category is category_3, the carpet area billed as detach and reset is also priced as carpet removal at the Black
    Water carpet removal rate, because black-water carpet may not be salvaged; for a job dispatched at a Clean Water tier
    whose recorded category is category_2, the same area is priced as pad removal at the Gray Water pad removal rate, because
    gray-water pad may not be salvaged; otherwise no carpet treatment. The PPE difference is set as follows: for a job dispatched
    at a Gray Water tier whose recorded category is category_3, the PPE technician-days billed times the Black Water PPE rate
    less the dispatch tier's PPE rate; for a job dispatched at a Clean Water tier whose recorded category is category_2 or
    category_3, one PPE technician-day per technician labor line billed at the PPE rate of the tier the recorded category
    selects; otherwise no PPE difference. The regulated-cleanup difference is set as follows: for a job dispatched at a Clean
    or Gray Water tier whose recorded category is category_3, when the file carries a scope_omission supplement naming the
    water job that awaits the carrier's decision, the Black Water containment setup fee of the tier the job's affected area
    selects less the containment setup billed, plus the HEPA vacuuming square feet billed times the Black Water HEPA rate
    less the dispatch tier's HEPA rate, because the regulated cleanup that supplement claims is, on a category_3 job, performed
    to the Black Water standard, containment included; for such a job with no such pending supplement, only the HEPA vacuuming
    square feet billed times the Black Water HEPA rate less the dispatch tier's HEPA rate, because without regulated cleanup
    the containment setup serves the drying alone and stays at the dispatch tier's fee while HEPA vacuuming on a category_3
    job meets the Black Water standard; otherwise no regulated-cleanup difference. The category reassessment supplement is
    fixed only after the regulated-scope supplement owed for the water job has been prepared and, where it reaches the supplement
    minimum, recorded on the file. The air scrubber scope is set as follows: for a job dispatched at a tier that does not
    require an air scrubber whose recorded category is category_3, one air scrubber for every air mover day billed at the
    Black Water air scrubber daily rate, because every Black Water tier requires one; for such a job whose recorded category
    is category_2 and whose affected area is at or above the Large Loss threshold, one air scrubber per air mover day at the
    Gray Water Large Loss air scrubber rate; otherwise no air scrubber scope. The antimicrobial difference is set as follows:
    for a job dispatched at a Clean Water tier whose recorded category is category_2 or category_3, the affected area times
    the antimicrobial rate of the tier the recorded category selects, less the antimicrobial billed on the job, never below
    zero, because the recorded category requires antimicrobial application over the affected area while a Clean Water tier
