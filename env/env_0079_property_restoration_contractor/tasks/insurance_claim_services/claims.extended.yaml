  factors:
  - id: protocol_surface_method
    effect: parameter
    decides: mp_surface
    bindings:
    - mp_loc
    - mp_soda
    - mp_handler
    - mp_coil
    - mp_surface
    ladder:
    - when: growth in an attic or crawlspace
      value: soda blasting of the growth area at the tier soda blasting rate
    - when: growth in the HVAC system
      value: the tier air handler cleaning fee plus coil cleaning fee
    - when: otherwise (growth in a living area or basement)
      value: wire-brush sanding and encapsulation of the growth area (standard)
    baseline:
      mp_surface: mp_area * (mp_brush + mp_encap)
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: mold
  - id: protocol_removal_scope
    effect: parameter
    decides: mp_removal
    bindings:
    - mp_loc_rm
    - mp_debris_fee
    - mp_removal
    ladder:
    - when: growth in an attic or crawlspace
      value: insulation removal over the growth area plus one debris disposal load
    - when: growth in a basement
      value: drywall removal over the growth area only
    - when: otherwise
      value: drywall and insulation removal over the growth area (standard)
    baseline:
      mp_removal: mp_area * (mp_drywall + mp_insul)
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: mold
  - id: protocol_air_treatment
    effect: method
    decides: mp_air
    bindings:
    - mp_cont_req
    - mp_negair_req
    - mp_cont_fee
    - mp_scrub_rate
    - mp_cdate
    - mp_rdate
    - mp_sdate
    - mp_hold
    - mp_work
    - mp_air
    ladder:
    - when: the tier requires both containment and negative air
      method: >-
        containment setup fee plus one air scrubber and one dehumidifier for each day the containment was held (containment
        date up to clearance request date), held to the equipment day cap
    - when: the tier requires negative air but no containment
      method: >-
        one air scrubber for each day from the scheduled start date up to the clearance request date, held to the cap
    - when: otherwise
      method: one dehumidifier for the equipment day cap (standard)
    baseline:
      mp_air: mp_dehu_rate * mp_cap
    evidence:
    - cross_category
    - tier_param
    - date
    cross_difficulty: mold
  - id: protocol_regulated_fee
    effect: parameter
    decides: mp_reg
    bindings:
    - mp_ptype
    - mp_built
    - mp_rrp
    - mp_asbcut
    - mp_leadfee
    - mp_asbfee
    - mp_loc_rg
    - mp_olaw
    - mp_reg
    ladder:
    - when: >-
        no ordinance-or-law limit on the file and growth in a living area or basement of housing built before the tier RRP
        year-built cutoff
      value: the tier lead-safe setup fee plus the asbestos sampling fee
    - when: >-
        no ordinance-or-law limit on the file and any other growth outside the HVAC system in a building built before the
        tier asbestos sampling year cutoff
      value: the tier asbestos sampling fee alone
    - when: otherwise
      value: '0'
    baseline:
      mp_reg: '0'
    evidence:
    - cross_category
    - date
    - tier_param
    cross_difficulty: mold
  baseline:
    rule: >-
      The protocol figure prices the growth area recorded on the job awaiting clearance at that job tier's HEPA vacuuming
      and antimicrobial rates per square foot as its core scope. Its standard surface treatment is wire-brush sanding and
      encapsulation of the growth area at the tier's rates per square foot. Its standard removal is drywall removal and insulation
      removal over the growth area at the tier's rates per square foot. Its standard air treatment is one dehumidifier for
      the tier's billable equipment day cap at the tier's dehumidifier daily rate. The mold room is the file's mold sublimit
      less the mold amounts already approved on the file, never below zero, and the protocol figure may not exceed it.
    params:
    - rounding_guard
  inputs:
    history:
    - table: claims_approvals
      aggregate: sum
      field: amount
      filters:
        approval_type: supplement
    cross_category:
    - mold
- id: claims_ext_mold_reconciliation_supplement
  base_policy_refs:
  - claims_evt_supplement
  - claims_carrier_decision
  - claims_agg_multi_holding
  overwrite:
  - base_policy: claims_evt_supplement
    superseded_clause: >-
      On tiers where the company does not submit supplements, the company prepares the supplement and records it on the day
      it is delivered to the insured or public adjuster.
    replaced_by: >-
      For a final mold supplement this policy prices on a Homeowner Direct Pay Claim Support file, and only for such a supplement,
      the company prepares the supplement and the insured submits it to the carrier from the company's claim portal, and it
      is recorded on the day the insured submits it, because the insured holds the carrier claim and settles the job's final
      cost with the carrier; every other supplement on a tier where the company does not submit supplements, the protocol
      supplement included, is prepared by the company and recorded on the day it is delivered to the insured or public adjuster.
  trigger: on_request
  subject:
  - claims_supplement_submit
  computes: requested_amount
  target_tool: submit_mold_reconciliation_7e4d140d
  params:
    rounding_guard: 1.0e-09
  rule: >-
    This policy prices the final mold supplement: the mold_remediation supplement that claims the scope actually billed on
    the mold job awaiting clearance, every line family as settled below, beyond what that job's protocol supplement asked,
    naming that job, on a Homeowner Direct Pay Claim Support file whose loss_type is not mold (so no part of the initial approval
    is a mold amount) and whose insured holds exactly two mold jobs, both linked to the file, one closed and one awaiting
    clearance, and on which every supplement approval decides a mold_remediation supplement and none decides a supplement
    naming the job awaiting clearance; any other supplement is handled under the base supplement rule. The claim file must
    be in approved status when a supplement is submitted. A supplement may be submitted only no later than the supplement
    window after the carrier's initial approval, counted in calendar days starting the day after the claim file's approved_date,
    a supplement submitted on the last day of the window being in time. A supplement may not be submitted while the file already
    has the tier's maximum number of supplements awaiting a carrier decision; it is submitted only on tiers that allow mold
    supplements and only for an amount at least the tier's supplement minimum. Supplements are numbered in sequence on the
    file starting at 1; the final mold supplement is coverage dwelling, reason mold_remediation. For a final mold supplement
    this policy prices on a Homeowner Direct Pay Claim Support file, and only for such a supplement, the company prepares
    the supplement and the insured submits it to the carrier from the company's claim portal, and it is recorded on the day
    the insured submits it, because the insured holds the carrier claim and settles the job's final cost with the carrier;
    every other supplement on a tier where the company does not submit supplements, the protocol supplement included, is prepared
    by the company and recorded on the day it is delivered to the insured or public adjuster. The final mold supplement is
    fixed only after the protocol supplement for the job awaiting clearance has been prepared and, when it reaches the supplement
    minimum, recorded on the file. The final figure is the core scope plus each scope family settled below, every family taken
    from the charge lines billed on the job awaiting clearance; from that sum every amount requested on mold_remediation supplements
    naming that job that still await the carrier's decision is subtracted, the figure is never below zero, it is held to the
    mold room and rounded to the cent, half up, once, on the final figure. The final figure takes as its core scope the HEPA
    vacuuming, antimicrobial, PPE, clearance test and minimum charge lines billed on the job awaiting clearance. Its standard
    surface treatment is the wire-brush sanding and encapsulation lines billed on that job. Its standard removal is the drywall
    removal and insulation removal lines billed on that job. Its standard air treatment is the dehumidifier days billed on
    that job. Its regulated-material lines are claimed only as settled below. Its labor is the technician and supervisor labor
    billed on that job, its after-hours part taken at the business-hours rate (the after-hours labor divided by the tier's
    after-hours labor multiplier) on a single-family house or condominium unit, where work outside working hours is the owner's
    own choice, and as billed on a multifamily unit or commercial property, where it spares the other occupants. The mold
    room is the file's mold sublimit less the mold amounts already approved on the file, never below zero, and the final figure
    may not exceed it. The surface treatment is taken as follows: for growth in an attic or crawlspace, the soda blasting
    and dry ice blasting lines billed on the job; for growth in the HVAC system, the duct cleaning, air handler cleaning and
    coil cleaning lines billed on the job; for growth in a living area or basement, the standard surface treatment. The removal
    is taken as follows: for growth in an attic or crawlspace, the insulation removal lines and the debris disposal loads
    billed on the job, because attic insulation leaves the building as bagged debris; for growth in a basement, the drywall
    removal lines billed on the job; for growth anywhere else, the standard removal. The air treatment is taken as follows:
    on a tier that requires both containment and negative air, the containment setup line, the air scrubber days and the dehumidifier
    days billed on the job, because both machines run inside the held containment; on a tier that requires negative air but
    no containment, the air scrubber days billed on the job; on any other tier, the standard air treatment. The regulated-material
    lines are taken as follows: on a file that carries no ordinance-or-law limit, for growth in a living area or basement,
    the lead-safe setup and asbestos sampling lines billed on the job; on a file that carries no ordinance-or-law limit, for
    any other growth outside the HVAC system, the asbestos sampling lines billed on the job, lead-safe work being claimed
    only with finished living spaces and basements; otherwise no regulated-material line, because on a file with an ordinance-or-law
    limit the regulated-material work of a mold job is claimed as a code_upgrade supplement under that limit rather than against
    the mold sublimit, which caps every mold supplement, and HVAC cleaning disturbs no regulated material. The labor is taken
    as follows: for growth in an attic or crawlspace, which no occupant uses, the labor billed with its after-hours part at
    the business-hours rate whatever the property, the after-hours premium being the customer's own choice there; for growth
    in the HVAC system, the labor billed with its after-hours part as billed whatever the property, because the system serving
    the building can be shut down for cleaning only outside its working hours; for growth in a living area or basement, the
    labor as stated above.
  prerequisite:
  - problem: claims_ext_mold_protocol_supplement
    kind: value_input
    gate: mr_pending
    form: action
    policy_source: >-
      The final mold supplement is fixed only after the protocol supplement for the job awaiting clearance has been prepared
      and, when it reaches the supplement minimum, recorded on the file.
    fallback_reason: >-
      The state the protocol supplement leaves (a mold supplement naming the job awaiting clearance, pending) exists only
      when the protocol figure reaches the supplement minimum; below it nothing is recorded, so a state sentence would wait
      on a record that never appears. The sentence therefore names the preparation and, where it applies, the recording.
    condition: >-
      claims_requests carries a claims_supplement_submit row with supplement_reason mold_remediation naming the job awaiting
      clearance and no claims_scope_approval referencing it, or the protocol figure is below the tier's supplement minimum.
    resolved_by: submit_mold_protocol_supplement_d9a0c26a
    effect: >-
      The protocol supplement's requested amount enters the pending requests subtracted from the final figure.
  cross_category:
  - category: mold
    as: history
    reads:
    - mold_job_id
    - growth_location
    - property_type
    - mold_charges.amount
    - mold_charges.rate_window
    note: >-
      the job awaiting clearance decides every family from its billed lines, growth location and tier.
  compute:
  - mr_job: CFIELD('mold', 'mold_job_id', claim_file_id=HID, status='awaiting_clearance')
  - mr_hepa: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='hepa_vacuum')
  - mr_anti: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='antimicrobial')
  - mr_ppe: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='ppe')
  - mr_clear: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='clearance_test')
  - mr_minimum: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='minimum_charge')
  - mr_core: mr_hepa + mr_anti + mr_ppe + mr_clear + mr_minimum
  - mr_loc: CFIELD('mold', 'growth_location', claim_file_id=HID, status='awaiting_clearance')
  - mr_blast: >-
      XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='soda_blasting') + XSUM('mold', 'mold_charges',
      'amount', mold_job_id=mr_job, charge_code='dry_ice_blasting')
  - mr_hvaclines: >-
      XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='duct_cleaning') + XSUM('mold', 'mold_charges',
      'amount', mold_job_id=mr_job, charge_code='air_handler_cleaning') + XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job,
      charge_code='coil_cleaning')
  - mr_brush: >-
      XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='wire_brush_sanding') + XSUM('mold', 'mold_charges',
      'amount', mold_job_id=mr_job, charge_code='encapsulation')
  - mr_surface: >-
      mr_blast if (mr_loc == 'attic' or mr_loc == 'crawlspace') else (mr_hvaclines if mr_loc == 'hvac' else mr_brush)
  - mr_insul: >-
      XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='insulation_removal')
  - mr_drywall: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='drywall_removal')
  - mr_loc_rm: CFIELD('mold', 'growth_location', claim_file_id=HID, status='awaiting_clearance')
  - mr_debris: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='debris_disposal')
  - mr_removal: >-
      (mr_insul + mr_debris) if (mr_loc_rm == 'attic' or mr_loc_rm == 'crawlspace') else (mr_drywall if mr_loc_rm == 'basement'
      else mr_drywall + mr_insul)
  - mr_cont_req: >-
      CPARAM('mold', 'containment_required', claim_file_id=HID, status='awaiting_clearance') or False
  - mr_negair_req: >-
      CPARAM('mold', 'negative_air_required', claim_file_id=HID, status='awaiting_clearance') or False
  - mr_cont: >-
      XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='containment_setup')
  - mr_scrub: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='air_scrubber')
  - mr_dehu: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='dehumidifier')
  - mr_air: >-
      (mr_cont + mr_scrub + mr_dehu) if (mr_cont_req and mr_negair_req) else (mr_scrub if (mr_negair_req and not mr_cont_req)
      else mr_dehu)
  - mr_lead: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='lead_safe_setup')
  - mr_asb: >-
      XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='asbestos_sampling')
  - mr_loc_rg: CFIELD('mold', 'growth_location', claim_file_id=HID, status='awaiting_clearance')
  - mr_olaw: F('ordinance_law_limit') or 0
  - mr_reg: >-
      (mr_lead + mr_asb) if (mr_olaw == 0 and (mr_loc_rg == 'living_area' or mr_loc_rg == 'basement')) else (mr_asb if (mr_olaw
      == 0 and mr_loc_rg != 'hvac') else 0)
  - mr_tech: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='technician_labor')
  - mr_sup: XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='supervisor_labor')
  - mr_ah: >-
      XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='technician_labor', rate_window='after_hours')
      + XSUM('mold', 'mold_charges', 'amount', mold_job_id=mr_job, charge_code='supervisor_labor', rate_window='after_hours')
  - mr_loc_lb: CFIELD('mold', 'growth_location', claim_file_id=HID, status='awaiting_clearance')
  - mr_mult: >-
      CPARAM('mold', 'after_hours_labor_multiplier', claim_file_id=HID, status='awaiting_clearance') or 1
  - mr_ptype_lb: CFIELD('mold', 'property_type', claim_file_id=HID, status='awaiting_clearance') or ''
  - mr_ah_cut: >-
      (mr_ah - mr_ah / mr_mult) if (mr_ptype_lb == 'single_family' or mr_ptype_lb == 'condo_unit') else 0
  - mr_labor: >-
      (mr_tech + mr_sup - mr_ah + mr_ah / mr_mult) if (mr_loc_lb == 'attic' or mr_loc_lb == 'crawlspace') else ((mr_tech +
      mr_sup) if mr_loc_lb == 'hvac' else mr_tech + mr_sup - mr_ah_cut)
  - mr_pending: >-
      SUM('claims_requests', 'requested_amount', supplement_reason='mold_remediation', related_job_id=mr_job)
  - mr_approved: >-
      SUM('claims_approvals', 'amount', event_type='claims_scope_approval', approval_type='supplement')
  - mr_room: MX(0, (F('mold_sublimit') or 0) - mr_approved)
  - result: >-
      RND(MN(MX(0, mr_core + mr_surface + mr_removal + mr_air + mr_reg + mr_labor - mr_pending), mr_room) + K('rounding_guard'),
      2)
