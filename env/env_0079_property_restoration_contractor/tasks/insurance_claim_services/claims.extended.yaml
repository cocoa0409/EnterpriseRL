- id: claims_ext_credited_line_writeoff
  base_policy_refs:
  - claims_evt_writeoff
  - claims_carrier_decision
  - claims_agg_multi_holding
  overwrite:
  - base_policy: claims_evt_writeoff
    superseded_clause: carrier_denied_line records a line the carrier declined after approval;
    replaced_by: >-
      For a credited-line write-off this policy prices, and only for such a write-off, carrier_denied_line records the approved
      value of work that the water job credited or conceded as goodwill, or that signed deductive change orders removed from
      the contract, after the estimate the carrier approved carried it: the jobs no longer bill that work, so the company
      does not collect its approved value from the carrier, and because the jobs have already credited that amount, nothing
      stays owed by the customer on a job for it. Every other carrier_denied_line write-off records a line the carrier declined
      after approval, and on tiers where denied lines are billable to the customer the same amount stays owed by the customer
      on the job.
  - base_policy: claims_evt_writeoff
    superseded_clause: >-
      on tiers where denied lines are billable to the customer, the same amount stays owed by the customer on the job,
    replaced_by: >-
      For a credited-line write-off this policy prices, and only for such a write-off, carrier_denied_line records the approved
      value of work that the water job credited or conceded as goodwill, or that signed deductive change orders removed from
      the contract, after the estimate the carrier approved carried it: the jobs no longer bill that work, so the company
      does not collect its approved value from the carrier, and because the jobs have already credited that amount, nothing
      stays owed by the customer on a job for it. Every other carrier_denied_line write-off records a line the carrier declined
      after approval, and on tiers where denied lines are billable to the customer the same amount stays owed by the customer
      on the job.
  trigger: state_due
  subject:
  - claims_receivable_writeoff
  computes: amount
  target_tool: post_credited_line_writeoff_e2edbc44
  params:
    rounding_guard: 1.0e-09
  rule: >-
    This policy prices the credited-line write-off: the carrier_denied_line write-off, against the file's initial dwelling
    approval, of the approved value of water job lines the job credited or conceded as goodwill, and of contract scope signed
    deductive change orders removed, after the estimate the carrier approved carried them, on a Public Adjuster Coordinated
    or Carrier Program Claim Billing file whose insured holds exactly one water mitigation job, and that job is linked to
    the file, and at most one reconstruction contract, which, when held, is linked to the file, and on which no write-off
    has yet been posted; any other write-off is handled under the base write-off rule. The claim file must be in approved
    status when a write-off is posted. A write-off names the approval line it reduces and never exceeds that line's amount
    less earlier write-offs of it. A carrier_denied_line write-off larger than the tier's desk write-off cap is not posted
    by the desk; a larger write-off, or a remaining dispute at or above the tier's appraisal referral threshold, is handed
    to a human representative as not covered by policy. For a credited-line write-off this policy prices, and only for such
    a write-off, carrier_denied_line records the approved value of work that the water job credited or conceded as goodwill,
    or that signed deductive change orders removed from the contract, after the estimate the carrier approved carried it:
    the jobs no longer bill that work, so the company does not collect its approved value from the carrier, and because the
    jobs have already credited that amount, nothing stays owed by the customer on a job for it. Every other carrier_denied_line
    write-off records a line the carrier declined after approval, and on tiers where denied lines are billable to the customer
    the same amount stays owed by the customer on the job. The credited value combines the credit families the standard method
    takes, each as narrowed below and each converted to the carrier's pricing for its class of lines as settled below; that
    sum is converted to the carrier's approval as the standard method states, held to the approval line's amount less earlier
    write-offs of it, and rounded to the cent, half up, once, on the final figure. The standard method takes every credit
    recorded on the water job, that is its billing_error, duplicate_line and goodwill credits, and every change order credit
    posted on the reconstruction contract, at their recorded amounts and the company's own prices, and applies the carrier's
    approval by scaling the credited value by the initial dwelling approval over the estimate amount submitted when the approval
    is below the estimate, because the carrier approved every line at that share; when the approval is at or above the estimate
    amount the credited value stands. The billing-error credits are narrowed as follows: when the estimate was submitted on
    or before the water job's drying complete date, none, because an estimate built from the scope sheet carried the measured
    quantities, never the over-billed ones; when it was submitted after the drying complete date but before the invoiced_date,
    only the billing_error credits against the job's equipment-day lines dated on its last equipment day (one line per equipment
    type per day), because that estimate priced equipment through the last logged day from the daily log and every other line
    from the scope sheet; otherwise the billing_error credits as the standard method takes them, because an estimate built
    from the invoice carried the invoiced mitigation lines with their over-billed quantities. The duplicate-line credits are
    narrowed as follows: when the estimate was submitted on or before the water job's drying complete date, none, because
    the scope sheet that estimate was built from carries no duplicate; when it was submitted after the drying complete date
    but before the invoiced_date, only the duplicate_line credits equal to the water job tier's moisture mapping fee, because
    moisture mapping is booked once per job from the job's set-day record, which that estimate copied together with any double-keyed
    entry, while every other line it took from the scope sheet and the daily log; otherwise the duplicate_line credits as
    the standard method takes them, because an estimate built from the invoice carried the duplicated line. The change order
    credits are narrowed as follows: when the latest change order credit on the reconstruction contract was posted on or before
    the estimate submission date, none, because the estimate already left out the scope those signed deductive change orders
    removed; when it was posted after the estimate was submitted and an additive change order charge was posted on the contract
    on or after it, the change order credits less the additive change order charges taken net of the contract tier's change
    order markup (the charges divided by one plus that markup percentage), never below zero, because the insured put the removed
    scope's approved value toward the replacement scope, which the carrier funds up to that value; otherwise the change order
    credits as the standard method takes them, because the approved estimate carried the scope they removed outright. The
    goodwill credits are narrowed as follows: when the estimate was submitted on or before the water job's drying complete
    date, none, because the scope-sheet price that estimate carried is not the invoiced price a goodwill credit gives up;
    when it was submitted after the drying complete date but before the invoiced_date, only the goodwill credits against the
    job's equipment-day lines dated on its last equipment day (one line per equipment type per day), because that estimate
    priced equipment from the daily log and every other line from the scope sheet; otherwise the goodwill credits as the standard
    method takes them, because the estimate carried the invoiced price that a goodwill credit gives up. The carrier's pricing
    for water job lines is applied as follows: on a Carrier Program Claim Billing file, the water job credit families less
    the tier's program pricing discount, because the approved estimate was priced net of it; on any other file whose estimate
    carried at least the tier's minimum number of distinct trades and was submitted on or after the water job was opened,
    so that it carried the water job's mitigation lines, the water job credit families raised by the tier's overhead percentage
    plus profit percentage, because the approved estimate added overhead and profit to its whole line-item total; otherwise
    the water job credit families stand. The carrier's pricing for contract scope is applied as follows: on a Carrier Program
    Claim Billing file, the removed scope less the tier's program pricing discount; on any other file whose estimate carried
    at least the tier's minimum number of distinct trades and whose insured holds a signed reconstruction contract linked
    to the file, the removed scope raised by the tier's overhead percentage plus profit percentage, because general contractor
    overhead and profit on reconstruction scope are owed where a general contractor is retained for it; otherwise the removed
    scope stands.
  prerequisite: []
  cross_category:
  - category: water
    as: history
    reads:
    - opened_date
    - invoiced_date
    - drying_complete_date
    - water_payments.amount
    - water_payments.source_charge_id
    - water_charges.water_charge_id
    note: the water job credits and dates decide the billing-error and duplicate-line families.
  - category: rebuild
    as: history
    reads:
    - signed_date
    - rebuild_payments.amount
    - rebuild_payments.posted_date
    - rebuild_charges.amount
    - rebuild_charges.posted_date
    - change_order_markup_pct
    note: >-
      the contract change order credits and charges decide the removed-scope family; the signed contract decides overhead
      and profit.
  compute:
  - cw_err: >-
      XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='billing_error')
  - e_est: F('estimate_submitted_date') or ''
  - e_dry: CFIELD('water', 'drying_complete_date', claim_file_id=HID) or '9999-12-31'
  - e_inv: CFIELD('water', 'invoiced_date', claim_file_id=HID) or '9999-12-31'
  - e_last: >-
      XLATEST('water', 'water_charges', 'service_date', date_field='service_date', event_type='water_equipment_day_charge')
      or ''
  - e_l0: >-
      XLATEST('water', 'water_charges', 'water_charge_id', date_field='service_date', charge_code='air_mover', service_date=e_last)
      or 'no-line'
  - e_l1: >-
      XLATEST('water', 'water_charges', 'water_charge_id', date_field='service_date', charge_code='lgr_dehumidifier', service_date=e_last)
      or 'no-line'
  - e_l2: >-
      XLATEST('water', 'water_charges', 'water_charge_id', date_field='service_date', charge_code='xl_dehumidifier', service_date=e_last)
      or 'no-line'
  - e_l3: >-
      XLATEST('water', 'water_charges', 'water_charge_id', date_field='service_date', charge_code='desiccant_dehumidifier',
      service_date=e_last) or 'no-line'
  - e_l4: >-
      XLATEST('water', 'water_charges', 'water_charge_id', date_field='service_date', charge_code='air_scrubber', service_date=e_last)
      or 'no-line'
  - e_l5: >-
      XLATEST('water', 'water_charges', 'water_charge_id', date_field='service_date', charge_code='drying_mat_system', service_date=e_last)
      or 'no-line'
  - e_l6: >-
      XLATEST('water', 'water_charges', 'water_charge_id', date_field='service_date', charge_code='heat_drying_unit', service_date=e_last)
      or 'no-line'
  - e_equip: >-
      XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='billing_error', source_charge_id=e_l0)
      + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='billing_error',
      source_charge_id=e_l1) + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='billing_error',
      source_charge_id=e_l2) + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='billing_error',
      source_charge_id=e_l3) + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='billing_error',
      source_charge_id=e_l4) + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='billing_error',
      source_charge_id=e_l5) + XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='billing_error',
      source_charge_id=e_l6)
  - cw_err_taken: 0 if e_est <= e_dry else (e_equip if e_est < e_inv else cw_err)
  - d_all: >-
      XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='duplicate_line')
  - d_est: F('estimate_submitted_date') or ''
  - d_dry: CFIELD('water', 'drying_complete_date', claim_file_id=HID) or '9999-12-31'
  - d_inv: CFIELD('water', 'invoiced_date', claim_file_id=HID) or '9999-12-31'
  - d_mm_fee: CPARAM('water', 'moisture_mapping_fee', claim_file_id=HID) or -1
  - d_equip: >-
      XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='duplicate_line',
      amount=d_mm_fee)
  - cw_dup_taken: 0 if d_est <= d_dry else (d_equip if d_est < d_inv else d_all)
  - r_est: F('estimate_submitted_date') or ''
  - r_co_last: >-
      XLATEST('rebuild', 'rebuild_payments', 'posted_date', date_field='posted_date', event_type='rebuild_change_order_credit')
      or ''
  - r_co: XSUM('rebuild', 'rebuild_payments', 'amount', event_type='rebuild_change_order_credit')
  - r_add_last: >-
      XLATEST('rebuild', 'rebuild_charges', 'posted_date', date_field='posted_date', event_type='rebuild_change_order_charge')
      or ''
  - r_add: XSUM('rebuild', 'rebuild_charges', 'amount', event_type='rebuild_change_order_charge')
  - r_markup: CPARAM('rebuild', 'change_order_markup_pct', claim_file_id=HID) or 0
  - cw_removed: >-
      0 if (r_co_last != '' and r_co_last <= r_est) else ((MX(0, r_co - r_add / (1 + r_markup / 100.0))) if (r_co_last !=
      '' and r_add_last >= r_co_last) else r_co)
  - g_all: >-
      XSUM('water', 'water_payments', 'amount', event_type='water_adjustment_credit', adjustment_reason='goodwill')
  - g_est: F('estimate_submitted_date') or ''
  - g_dry: CFIELD('water', 'drying_complete_date', claim_file_id=HID) or '9999-12-31'
