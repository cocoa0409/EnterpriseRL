      timing: pre_action
      correlation_keys:
      - - mold_jobs.claim_file_id
      action_bindings:
        mold_jobs.claim_file_id: claim_file_id
  params:
    per_tier:
      Spot Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Limited Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Standard Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Extensive Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      Attic and Crawlspace Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
      HVAC System Mold Remediation:
        late_fee_pct_monthly: =late_fee_pct_monthly
        late_fee_minimum: =late_fee_minimum
        claim_pending_late_fee_suspension_days: =claim_pending_late_fee_suspension_days
  formula:
    amount: max(late_fee_minimum, round(balance_due * late_fee_pct_monthly / 100, 2))
extended_policies:
- id: mold_ext_presample_line
  base_policy_refs:
  - mold_evt_remediation_scope
  overwrite:
  - base_policy: mold_evt_remediation_scope
    superseded_clause: The job must be in remediating, awaiting_clearance or cleared status when a scope line is charged.
    replaced_by: For the pre-removal asbestos sampling line this policy prices, and only for that line, the job may
      be in scheduled, authorized, remediating, awaiting_clearance or cleared status when it is charged; the work-plan
      visit line is governed by its own schedule, and every other scope line and every equipment day still requires
      the job to be in remediating, awaiting_clearance or cleared status when it is charged.
  - base_policy: mold_evt_remediation_scope
    superseded_clause: Each scope line is billed at the tier's unit rate for its code times the quantity performed,
      and labor the customer asks to have performed in the after_hours window is billed at the hourly rate times the
      after-hours labor multiplier.
    replaced_by: For the pre-removal asbestos sampling line this policy prices, and only for that line, the amount
      is figured as set out here; the work-plan visit line and the bagged debris haul-off line are priced under their
      own schedules, and every other scope line remains billed at the tier's unit rate for its code times the quantity
      performed, with labor the customer asks to have performed in the after_hours window billed at the hourly rate
      times the after-hours labor multiplier.
  trigger: state_due
  subject:
  - mold_remediation_charge
  computes: amount
  target_tool: book_mold_presample_d4275783
  params:
    results_reuse_days: 365
    results_review_fee: 85.0
    confirmation_set_fee: 210.0
    plaster_era_age: 75
    plaster_set_fee: 145.0
    insulation_set_fee: 165.0
    rush_lead_days: 2
    expedite_lead_days: 5
    rush_pct: 40
    rush_minimum_fee: 200.0
    expedite_fee: 95.0
    adjuster_split_set_fee: 110.0
    program_custody_fee: 65.0
    cat3_handling_fee: 90.0
    cat2_handling_fee: 45.0
    collection_credit_full: 75.0
    collection_credit_partial: 40.0
  rule: >-
    This policy prices the pre-removal asbestos sampling line of a mold job in a building built before the asbestos
    sampling year cutoff. The samples are collected at the booking walkthrough, so the sampling line is dated the
    job's opened date and is booked once per job as one line of quantity 1 each whose rate is the line amount. A
    company_warranty job is performed at no charge and carries no sampling line; its sampling figure is 0.00 and
    nothing is booked. For the pre-removal asbestos sampling line this policy prices, and only for that line, the
    job may be in scheduled, authorized, remediating, awaiting_clearance or cleared status when it is charged; the
    work-plan visit line is governed by its own schedule, and every other scope line and every equipment day still
    requires the job to be in remediating, awaiting_clearance or cleared status when it is charged. For the pre-removal
    asbestos sampling line this policy prices, and only for that line, the amount is figured as set out here; the
    work-plan visit line and the bagged debris haul-off line are priced under their own schedules, and every other
    scope line remains billed at the tier's unit rate for its code times the quantity performed, with labor the customer
    asks to have performed in the after_hours window billed at the hourly rate times the after-hours labor multiplier.
    Standard method: the sampling line amount is the standard-set charge, which is the tier's asbestos sampling fee
    covering the collection visit and the laboratory analysis of the standard drywall, joint compound and texture
    set, rounded to the cent, half up.
    Where a schedule below applies, the amount it sets replaces the standard figure for its part or is added to or
    credited against the sampling line, as that schedule states, and the total is rounded once to the cent, half up.
    Results reuse schedule: the most recent asbestos sampling line booked on the company water job linked to the
    mold job decides the standard-set charge; if that water sampling line is dated no more than the results reuse
    days before the mold job's opened date, or on or after that opened date, the laboratory results on file are
    reviewed instead of re-sampling the standard set and the standard-set charge is the results review fee; if it
    is dated more than the results reuse days before the opened date, the standard-set charge is the confirmation
    set fee; when the mold job has no linked water job, or the linked water job carries no asbestos sampling line,
    the standard-set charge stays the tier's asbestos sampling fee. The days are counted in calendar days from the
    water sampling date to the opened date.
    Era material schedule: the building age is the whole years from 1 January of the year built to the job's opened
    date, counted in whole calendar months and divided by twelve with any fraction dropped; growth in a living_area
    or basement of a building whose age is at least the plaster-era age adds the plaster set fee for plaster, skim
    coat and lath; growth in an attic or crawlspace adds the insulation set fee for loose-fill and vermiculite
    insulation; every other job adds no era-material charge.
    Turnaround schedule: the laboratory turnaround follows the scheduled start date less the opened date in calendar
    days; a lead time of at most the rush lead days buys the 24-hour turnaround, charged at the rush percentage of
    the tier's asbestos sampling fee but never less than the rush minimum fee; a lead time above the rush lead days
    and at most the expedite lead days buys the 72-hour turnaround at the expedite fee; any longer lead time uses the
    standard turnaround with no turnaround charge.
    Documentation schedule: when the claim file linked to the mold job names a public adjuster, a split sample set
    is drawn for the adjuster and the adjuster split set fee is added; when the linked claim file names no public
    adjuster and its billing arrangement requires a carrier program referral number, the program chain-of-custody
    fee is added; every other job adds no documentation charge.
    Handling schedule: growth behind a linked water job of water category category_3 adds the category 3 sample
    handling fee for decontaminating the sampling tools and bagging the samples; growth behind a linked water job
    of category_2 adds the category 2 sample handling fee; every other job adds no handling charge.
    Collection schedule: the water crew's presence is judged on the mold job's opened date, when the samples are
    collected; when the linked water job's drying start date is on or before that opened date and it has no drying
    complete date on or before it, the drying crew collects the samples on a monitoring visit and the full collection
    credit is subtracted; when the linked water job was opened on or before the mold job's opened date but has neither
    a drying start date nor a cancelled date on or before it, the mobilising crew collects them and the partial
    collection credit is subtracted; with no linked water job, or a water job whose drying ended or which was cancelled
    on or before the opened date, or one opened after it, no collection credit applies.
  prerequisite: []
  cross_category:
  - category: water
    as: history
    reads:
    - water_charges.service_date
    - water_charges.charge_code
    - water_category
    - opened_date
    - drying_start_date
    - drying_complete_date
    - cancelled_date
    note: The results reuse factor reads the linked water job's asbestos sampling lines; the handling factor reads
      its water category; the collection factor reads its opened, drying and cancellation dates.
  - category: claims
    as: branch
    reads:
    - public_adjuster_name
    - variant_name
    note: The documentation factor reads the linked claim file's public adjuster and its arrangement's referral rule.
  compute:
  - warranty_job: F('funding_source') == 'company_warranty'
  - water_sampling_date: XLATEST('water','water_charges','service_date', date_field='service_date', charge_code='asbestos_sampling',
      water_job_id=F('water_job_id'))
  - standard_set: (K('results_review_fee') if DAYS(water_sampling_date, F('opened_date')) <= K('results_reuse_days') else
      K('confirmation_set_fee')) if water_sampling_date else P('asbestos_sampling_fee')
  - building_age: int(MONTHS(F('year_built') + '-01-01', F('opened_date')) / 12)
  - era_set: K('plaster_set_fee') if (building_age >= K('plaster_era_age') and (F('growth_location') == 'living_area' or
      F('growth_location') == 'basement')) else (K('insulation_set_fee') if (F('growth_location') == 'attic' or F('growth_location')
      == 'crawlspace') else 0)
  - lead_days: DAYS(F('opened_date'), F('scheduled_start_date'))
  - turnaround: MX(K('rush_minimum_fee'), P('asbestos_sampling_fee') * K('rush_pct') / 100) if lead_days <= K('rush_lead_days')
      else (K('expedite_fee') if lead_days <= K('expedite_lead_days') else 0)
  - claim_adjuster: CFIELD('claims','public_adjuster_name', claim_file_id=F('claim_file_id'))
  - claim_referral_rule: CPARAM('claims','carrier_referral_required', claim_file_id=F('claim_file_id'))
  - documentation_set: K('adjuster_split_set_fee') if claim_adjuster else (K('program_custody_fee') if claim_referral_rule
      == True else 0)
  - water_cat: CFIELD('water','water_category', water_job_id=F('water_job_id'))
  - handling_fee: K('cat3_handling_fee') if water_cat == 'category_3' else (K('cat2_handling_fee') if water_cat == 'category_2'
      else 0)
  - water_opened: CFIELD('water','opened_date', water_job_id=F('water_job_id'))
  - water_drying_start: CFIELD('water','drying_start_date', water_job_id=F('water_job_id'))
  - water_drying_done: CFIELD('water','drying_complete_date', water_job_id=F('water_job_id'))
  - water_cancelled: CFIELD('water','cancelled_date', water_job_id=F('water_job_id'))
  - collection_credit: K('collection_credit_full') if (water_drying_start and water_drying_start <= F('opened_date') and not
      (water_drying_done and water_drying_done <= F('opened_date'))) else (K('collection_credit_partial') if (water_opened
      and water_opened <= F('opened_date') and not (water_drying_start and water_drying_start <= F('opened_date')) and not
      (water_cancelled and water_cancelled <= F('opened_date'))) else 0)
  - result: 0 if warranty_job else RND(standard_set + era_set + turnaround + documentation_set + handling_fee - collection_credit
      + 0.000000001, 2)
  compute_basis:
    warranty_job: A company_warranty job is performed at no charge and carries no sampling line; its sampling figure is 0.00
      and nothing is booked.
    water_sampling_date: the most recent asbestos sampling line booked on the company water job linked to the mold job
      decides the standard-set charge
    standard_set: if that water sampling line is dated no more than the results reuse days before the mold job's opened
      date, or on or after that opened date, the laboratory results on file are reviewed instead of re-sampling the standard
      set and the standard-set charge is the results review fee; if it is dated more than the results reuse days before
      the opened date, the standard-set charge is the confirmation set fee; when the mold job has no linked water job, or
      the linked water job carries no asbestos sampling line, the standard-set charge stays the tier's asbestos sampling
      fee.
    building_age: the building age is the whole years from 1 January of the year built to the job's opened date, counted
      in whole calendar months and divided by twelve with any fraction dropped
    era_set: growth in a living_area or basement of a building whose age is at least the plaster-era age adds the plaster
      set fee for plaster, skim coat and lath; growth in an attic or crawlspace adds the insulation set fee for loose-fill
      and vermiculite insulation; every other job adds no era-material charge.
    lead_days: the laboratory turnaround follows the scheduled start date less the opened date in calendar days
    turnaround: a lead time of at most the rush lead days buys the 24-hour turnaround, charged at the rush percentage of
      the tier's asbestos sampling fee but never less than the rush minimum fee; a lead time above the rush lead days and
      at most the expedite lead days buys the 72-hour turnaround at the expedite fee; any longer lead time uses the standard
      turnaround with no turnaround charge.
    claim_adjuster: when the claim file linked to the mold job names a public adjuster
    claim_referral_rule: its billing arrangement requires a carrier program referral number
    documentation_set: when the claim file linked to the mold job names a public adjuster, a split sample set is drawn for
      the adjuster and the adjuster split set fee is added; when the linked claim file names no public adjuster and its
      billing arrangement requires a carrier program referral number, the program chain-of-custody fee is added; every
      other job adds no documentation charge.
    water_cat: growth behind a linked water job of water category category_3 adds the category 3 sample handling fee
    handling_fee: growth behind a linked water job of water category category_3 adds the category 3 sample handling fee
      for decontaminating the sampling tools and bagging the samples; growth behind a linked water job of category_2 adds
      the category 2 sample handling fee; every other job adds no handling charge.
    water_opened: when the linked water job was opened on or before the mold job's opened date
    water_drying_start: when the linked water job's drying start date is on or before that opened date
    water_drying_done: it has no drying complete date on or before it
    water_cancelled: has neither a drying start date nor a cancelled date on or before it
    collection_credit: when the linked water job's drying start date is on or before that opened date and it has no drying
      complete date on or before it, the drying crew collects the samples on a monitoring visit and the full collection
      credit is subtracted; when the linked water job was opened on or before the mold job's opened date but has neither
      a drying start date nor a cancelled date on or before it, the mobilising crew collects them and the partial collection
      credit is subtracted; with no linked water job, or a water job whose drying ended or which was cancelled on or before
      the opened date, or one opened after it, no collection credit applies.
    result: the amount it sets replaces the standard figure for its part or is added to or credited against the sampling
      line, as that schedule states, and the total is rounded once to the cent, half up.
  factors:
  - id: prior_results
    effect: parameter
    decides: standard_set
    bindings: [water_sampling_date, standard_set]
    ladder:
    - when: the linked water job's most recent asbestos sampling line is dated no more than the results reuse days before
        the opened date, or on or after it
      value: K('results_review_fee')
    - when: the linked water job's most recent asbestos sampling line is dated more than the results reuse days before the
        opened date
      value: K('confirmation_set_fee')
    - when: otherwise (no linked water job, or no asbestos sampling line on it)
      value: P('asbestos_sampling_fee')
    baseline:
      standard_set: P('asbestos_sampling_fee')
    evidence: [cross_category, date]
    cross_difficulty: water
  - id: building_age_set
    effect: parameter
    decides: era_set
    bindings: [building_age, era_set]
    ladder:
    - when: growth in a living_area or basement AND building age at least the plaster-era age
      value: K('plaster_set_fee')
    - when: growth in an attic or crawlspace
      value: K('insulation_set_fee')
    - when: otherwise
      value: '0'
    baseline:
      era_set: '0'
    evidence: [date]
    cross_difficulty: null
  - id: lab_turnaround
    effect: method
    decides: turnaround
    bindings: [lead_days, turnaround]
    ladder:
    - when: the scheduled start date less the opened date is at most the rush lead days
      method: 24-hour turnaround charged at the rush percentage of the tier's asbestos sampling fee, never less than the
        rush minimum fee (the larger of the two)
    - when: the lead time is above the rush lead days and at most the expedite lead days
      method: 72-hour turnaround charged at the flat expedite fee
    - when: otherwise
      method: standard turnaround, no turnaround charge
    baseline:
      turnaround: '0'
    evidence: [date]
    cross_difficulty: null
  - id: documentation_set
    effect: parameter
    decides: documentation_set
    bindings: [claim_adjuster, claim_referral_rule, documentation_set]
    ladder:
    - when: the linked claim file names a public adjuster
      value: K('adjuster_split_set_fee')
    - when: the linked claim file names no public adjuster AND its arrangement requires a carrier program referral number
      value: K('program_custody_fee')
    - when: otherwise
      value: '0'
    baseline:
      documentation_set: '0'
    evidence: [cross_category]
    cross_difficulty: claims
  - id: contaminated_handling
    effect: parameter
    decides: handling_fee
    bindings: [water_cat, handling_fee]
    ladder:
    - when: the linked water job's water category is category_3
      value: K('cat3_handling_fee')
    - when: the linked water job's water category is category_2
      value: K('cat2_handling_fee')
    - when: otherwise
      value: '0'
    baseline:
      handling_fee: '0'
    evidence: [cross_category]
    cross_difficulty: water
  - id: water_crew_collection
    effect: parameter
    decides: collection_credit
    bindings: [water_opened, water_drying_start, water_drying_done, water_cancelled, collection_credit]
    ladder:
    - when: the linked water job's drying start date is on or before the opened date AND it has no drying complete date
        on or before it
      value: K('collection_credit_full')
    - when: the linked water job was opened on or before the opened date AND has neither a drying start date nor a cancelled
        date on or before it
      value: K('collection_credit_partial')
    - when: otherwise
      value: '0'
    baseline:
      collection_credit: '0'
    evidence: [cross_category, date]
    cross_difficulty: water
  baseline:
    rule: 'Standard method: the sampling line amount is the standard-set charge, which is the tier''s asbestos sampling
      fee covering the collection visit and the laboratory analysis of the standard drywall, joint compound and texture
      set, rounded to the cent, half up.'
    params: [asbestos_sampling_fee]
  inputs:
    history:
    - {category: water, table: water_charges, aggregate: latest, field: service_date, filters: {charge_code: asbestos_sampling}}
    cross_category: [water, claims]
- id: mold_ext_workplan_line
  base_policy_refs:
  - mold_evt_remediation_scope
  overwrite:
  - base_policy: mold_evt_remediation_scope
    superseded_clause: The job must be in remediating, awaiting_clearance or cleared status when a scope line is charged.
    replaced_by: For the work-plan visit line this policy prices, and only for that line, the job may be in scheduled
      or authorized status as well as remediating, awaiting_clearance or cleared status when it is charged; the pre-removal
      asbestos sampling line is governed by its own schedule, and every other scope line and every equipment day still
      requires the job to be in remediating, awaiting_clearance or cleared status when it is charged.
  - base_policy: mold_evt_remediation_scope
    superseded_clause: Each scope line is billed at the tier's unit rate for its code times the quantity performed,
      and labor the customer asks to have performed in the after_hours window is billed at the hourly rate times the
      after-hours labor multiplier.
    replaced_by: For the work-plan visit line this policy prices, and only for that line, the amount is the scheduled
      visit hours set out here times the tier's supervisor hourly rate; the pre-removal asbestos sampling line and the
      bagged debris haul-off line are priced under their own schedules, and every other scope line remains billed at
      the tier's unit rate for its code times the quantity performed, with labor the customer asks to have performed
      in the after_hours window billed at the hourly rate times the after-hours labor multiplier.
  trigger: state_due
  subject:
  - mold_remediation_charge
  computes: amount
  target_tool: book_mold_workplan_1501986a
  params:
    work_plan_base_hours: 2.0
    footprint_large_sqft: 300
    footprint_mid_sqft: 150
    footprint_step_sqft: 100
    footprint_step_hours: 0.5
    walk_sqft_per_hour: 100
    adjuster_walk_hours: 0.5
    program_photo_hours: 0.25
    rrp_plan_hours: 1.0
    asbestos_plan_hours: 0.75
    drying_check_hours: 0.5
    release_check_hours: 1.0
    rush_plan_days: 2
    short_plan_days: 5
    rush_plan_hours: 0.5
    short_plan_hours: 0.25
    ceiling_survey_hours: 1.0
    wall_survey_hours: 0.5
  rule: >-
    Every job on a tier that requires a protocol carries one work-plan visit line: the remediation supervisor walks
    the site with the independent assessor's protocol and writes the remediation work plan the customer receives
    before remediation begins. The work-plan visit line is coded supervisor_labor, dated the job's opened date, in
    the business_hours window, and booked as one visit of quantity 1 each whose rate is the line amount. A
    company_warranty job is performed at no charge and carries no work-plan visit line; its work-plan figure is 0.00
    and nothing is booked. For the work-plan visit line this policy prices, and only for that line, the job may be
    in scheduled or authorized status as well as remediating, awaiting_clearance or cleared status when it is charged;
    the pre-removal asbestos sampling line is governed by its own schedule, and every other scope line and every equipment
    day still requires the job to be in remediating, awaiting_clearance or cleared status when it is charged. For the
    work-plan visit line this policy prices, and only for that line, the amount is the scheduled visit hours set out
    here times the tier's supervisor hourly rate; the pre-removal asbestos sampling line and the bagged debris haul-off
    line are priced under their own schedules, and every other scope line remains billed at the tier's unit rate for
    its code times the quantity performed, with labor the customer asks to have performed in the after_hours window
    billed at the hourly rate times the after-hours labor multiplier. Every schedule below judges the linked water job
    as its records stood on the mold job's opened date, the day of the visit.
    Standard method: the work-plan visit takes the base visit hours, and the work-plan line amount is the visit hours
    times the tier's supervisor hourly rate, rounded to the cent, half up.
    Where a schedule below applies, the hours it sets replace the base visit hours or are added to them, as that
    schedule states; the hours are summed before they are multiplied by the tier's supervisor hourly rate, and the
    product is rounded once to the cent, half up.
    Water footprint schedule: the walk covers the floor area the linked water job mapped as affected; an affected area above the large footprint threshold takes the quotient of the large footprint threshold divided by the walk rate in square feet per hour, to which the footprint step hours are added for each full or partial footprint step of affected area above that threshold; an affected area above the mid footprint threshold and at most the large footprint threshold takes the larger of two figures, the base visit hours and the quotient of the affected area divided by the walk rate; with no linked water job, or an affected area at most the mid footprint threshold, the walk takes the base visit hours.
    Claim coordination schedule: when the claim file linked to the job names a public adjuster, the supervisor walks
    the site with the adjuster and the adjuster walk hours are added; when the linked claim file names no public adjuster
    and its billing arrangement requires a carrier program referral number, the program photo documentation hours
    are added; every other job adds no claim-coordination hours.
    Regulated material schedule: when the linked water job carries a lead-safe setup line dated on or before the opened
    date, the lead-safe planning hours are added; when it carries no such lead-safe setup line but carries an asbestos
    sampling line dated on or before the opened date, the asbestos planning hours are added; every other job adds no
    regulated-material hours.
    Moisture verification schedule: when the linked water job's drying start date is on or before the opened date
    and it has no drying complete date on or before it, the drying-check hours are added; when its drying complete
    date is on or before the opened date and its drying ended with drying_outcome customer_release, the release-check
    hours are added; with no linked water job, a water job that never started drying by that date, or one that reached
    the dry standard, no moisture-verification hours are added.
    Work-plan lead-time schedule: the work-plan lead time is the scheduled start date less the opened date in calendar
    days; a work-plan lead time of at most the rush plan days adds the rush plan hours; above the rush plan days and
    at most the short plan days adds the short plan hours; any longer work-plan lead time adds no lead-time hours.
    Overhead survey schedule: growth behind a linked water job of water class class_3, where water came from overhead
    and saturated the ceilings, adds the ceiling survey hours; growth behind a linked water job of class_2 adds the
    wall survey hours; every other job adds no overhead-survey hours.
  prerequisite: []
  cross_category:
  - category: water
    as: history
    reads:
    - affected_area_sqft
    - water_charges.charge_code
    - water_charges.service_date
    - drying_start_date
    - drying_complete_date
    - drying_outcome
    - water_class
    note: The footprint factor reads the linked water job's affected area; the regulated material factor reads its
      lead-safe and asbestos lines and their dates; the moisture factor reads its drying dates and outcome; the overhead
      survey factor reads its water class.
  - category: claims
    as: branch
    reads:
    - public_adjuster_name
    - variant_name
    note: The claim coordination factor reads the linked claim file's public adjuster and its arrangement's referral rule.
  compute:
  - warranty_job: F('funding_source') == 'company_warranty'
  - water_footprint: float(CFIELD('water','affected_area_sqft', water_job_id=F('water_job_id')) or 0)
  - footprint_excess: water_footprint - K('footprint_large_sqft')
  - walk_hours: K('footprint_large_sqft') / K('walk_sqft_per_hour') + (int(footprint_excess / K('footprint_step_sqft')) + (1 if footprint_excess
      / K('footprint_step_sqft') > int(footprint_excess / K('footprint_step_sqft')) else 0)) * K('footprint_step_hours') if water_footprint
      > K('footprint_large_sqft') else (MX(K('work_plan_base_hours'), water_footprint / K('walk_sqft_per_hour')) if water_footprint
      > K('footprint_mid_sqft')
      else K('work_plan_base_hours'))
  - wp_adjuster: CFIELD('claims','public_adjuster_name', claim_file_id=F('claim_file_id'))
  - wp_referral_rule: CPARAM('claims','carrier_referral_required', claim_file_id=F('claim_file_id'))
  - coordination_hours: K('adjuster_walk_hours') if wp_adjuster else (K('program_photo_hours') if wp_referral_rule == True
      else 0)
  - water_lead_date: XLATEST('water','water_charges','service_date', date_field='service_date', charge_code='lead_safe_setup',
      water_job_id=F('water_job_id'))
  - water_asbestos_date: XLATEST('water','water_charges','service_date', date_field='service_date', charge_code='asbestos_sampling',
      water_job_id=F('water_job_id'))
  - regulated_hours: K('rrp_plan_hours') if (water_lead_date and water_lead_date <= F('opened_date')) else (K('asbestos_plan_hours')
      if (water_asbestos_date and water_asbestos_date <= F('opened_date')) else 0)
  - wp_drying_start: CFIELD('water','drying_start_date', water_job_id=F('water_job_id'))
  - wp_drying_done: CFIELD('water','drying_complete_date', water_job_id=F('water_job_id'))
  - wp_drying_outcome: CFIELD('water','drying_outcome', water_job_id=F('water_job_id'))
  - moisture_hours: K('drying_check_hours') if (wp_drying_start and wp_drying_start <= F('opened_date') and not (wp_drying_done
      and wp_drying_done <= F('opened_date'))) else (K('release_check_hours') if (wp_drying_done and wp_drying_done <= F('opened_date')
      and wp_drying_outcome == 'customer_release') else 0)
  - plan_lead_days: DAYS(F('opened_date'), F('scheduled_start_date'))
  - lead_hours: K('rush_plan_hours') if plan_lead_days <= K('rush_plan_days') else (K('short_plan_hours') if plan_lead_days
      <= K('short_plan_days') else 0)
  - water_class_wp: CFIELD('water','water_class', water_job_id=F('water_job_id'))
  - overhead_hours: K('ceiling_survey_hours') if water_class_wp == 'class_3' else (K('wall_survey_hours') if water_class_wp
      == 'class_2' else 0)
  - visit_hours: walk_hours + coordination_hours + regulated_hours + moisture_hours + lead_hours + overhead_hours
  - result: 0 if warranty_job else RND(visit_hours * P('supervisor_hourly_rate') + 0.000000001, 2)
  compute_basis:
    warranty_job: A company_warranty job is performed at no charge and carries no work-plan visit line; its work-plan figure
      is 0.00 and nothing is booked.
    water_footprint: the walk covers the floor area the linked water job mapped as affected
    footprint_excess: to which the footprint step hours are added for each full or partial footprint step of affected area above that threshold
    walk_hours: an affected area above the large footprint threshold takes the quotient of the large footprint threshold divided by the walk rate in square feet per hour, to which the footprint step hours are added for each full or partial footprint step of affected area above that threshold; an affected area above the mid footprint threshold and at most the large footprint threshold takes the larger of two figures, the base visit hours and the quotient of the affected area divided by the walk rate; with no linked water job, or an affected area at most the mid footprint threshold, the walk takes the base visit hours.
    wp_adjuster: when the claim file linked to the job names a public adjuster
    wp_referral_rule: its billing arrangement requires a carrier program referral number
    coordination_hours: when the claim file linked to the job names a public adjuster, the supervisor walks the site with
      the adjuster and the adjuster walk hours are added; when the linked claim file names no public adjuster and its billing
      arrangement requires a carrier program referral number, the program photo documentation hours are added; every other
      job adds no claim-coordination hours.
    water_lead_date: when the linked water job carries a lead-safe setup line dated on or before the opened date
    water_asbestos_date: carries an asbestos sampling line dated on or before the opened date
    regulated_hours: when the linked water job carries a lead-safe setup line dated on or before the opened date, the lead-safe
      planning hours are added; when it carries no such lead-safe setup line but carries an asbestos sampling line dated
      on or before the opened date, the asbestos planning hours are added; every other job adds no regulated-material hours.
    wp_drying_start: when the linked water job's drying start date is on or before the opened date
    wp_drying_done: it has no drying complete date on or before it
    wp_drying_outcome: its drying ended with drying_outcome customer_release
    moisture_hours: when the linked water job's drying start date is on or before the opened date and it has no drying complete
      date on or before it, the drying-check hours are added; when its drying complete date is on or before the opened date
      and its drying ended with drying_outcome customer_release, the release-check hours are added; with no linked water
      job, a water job that never started drying by that date, or one that reached the dry standard, no moisture-verification
      hours are added.
    plan_lead_days: the work-plan lead time is the scheduled start date less the opened date in calendar days
    lead_hours: a work-plan lead time of at most the rush plan days adds the rush plan hours; above the rush plan days and
      at most the short plan days adds the short plan hours; any longer work-plan lead time adds no lead-time hours.
    water_class_wp: growth behind a linked water job of water class class_3
    overhead_hours: growth behind a linked water job of water class class_3, where water came from overhead and saturated
      the ceilings, adds the ceiling survey hours; growth behind a linked water job of class_2 adds the wall survey hours;
      every other job adds no overhead-survey hours.
    visit_hours: the hours are summed before they are multiplied by the tier's supervisor hourly rate
    result: the hours it sets replace the base visit hours or are added to them, as that schedule states; the hours are
      summed before they are multiplied by the tier's supervisor hourly rate, and the product is rounded once to the cent,
      half up.
  factors:
  - id: water_footprint_walk
    effect: method
    decides: walk_hours
    bindings: [water_footprint, footprint_excess, walk_hours]
    ladder:
    - when: the linked water job's affected area is above the large footprint threshold
      method: the large footprint threshold divided by the walk rate, plus the footprint step hours for each full or partial footprint step above the threshold (stepped, rounded up)
    - when: the affected area is above the mid footprint threshold and at most the large footprint threshold
      method: the larger of the base visit hours and the affected area divided by the walk rate (proportional with a floor)
    - when: otherwise
      method: the base visit hours
    baseline:
      walk_hours: K('work_plan_base_hours')
    evidence: [cross_category]
    cross_difficulty: water
  - id: claim_coordination
    effect: parameter
    decides: coordination_hours
    bindings: [wp_adjuster, wp_referral_rule, coordination_hours]
    ladder:
    - when: the linked claim file names a public adjuster
      value: K('adjuster_walk_hours')
    - when: the linked claim file names no public adjuster AND its arrangement requires a carrier program referral number
      value: K('program_photo_hours')
    - when: otherwise
      value: '0'
    baseline:
      coordination_hours: '0'
    evidence: [cross_category]
    cross_difficulty: claims
  - id: regulated_planning
    effect: parameter
    decides: regulated_hours
    bindings: [water_lead_date, water_asbestos_date, regulated_hours]
    ladder:
    - when: the linked water job carries a lead-safe setup line dated on or before the opened date
      value: K('rrp_plan_hours')
    - when: no such lead-safe setup line AND an asbestos sampling line dated on or before the opened date
      value: K('asbestos_plan_hours')
    - when: otherwise
      value: '0'
    baseline:
      regulated_hours: '0'
    evidence: [cross_category, date]
    cross_difficulty: water
  - id: moisture_verification
    effect: parameter
    decides: moisture_hours
    bindings: [wp_drying_start, wp_drying_done, wp_drying_outcome, moisture_hours]
    ladder:
    - when: the linked water job's drying start date is on or before the opened date AND no drying complete date on or before
        it
      value: K('drying_check_hours')
    - when: its drying complete date is on or before the opened date AND drying_outcome customer_release
      value: K('release_check_hours')
    - when: otherwise
      value: '0'
    baseline:
      moisture_hours: '0'
    evidence: [cross_category, date]
    cross_difficulty: water
  - id: plan_lead_time
    effect: parameter
    decides: lead_hours
    bindings: [plan_lead_days, lead_hours]
    ladder:
    - when: work-plan lead time at most the rush plan days
      value: K('rush_plan_hours')
    - when: work-plan lead time above the rush plan days and at most the short plan days
      value: K('short_plan_hours')
    - when: otherwise
      value: '0'
    baseline:
      lead_hours: '0'
    evidence: [date]
    cross_difficulty: null
  - id: overhead_survey
    effect: parameter
    decides: overhead_hours
    bindings: [water_class_wp, overhead_hours]
    ladder:
    - when: the linked water job's water class is class_3
      value: K('ceiling_survey_hours')
    - when: the linked water job's water class is class_2
      value: K('wall_survey_hours')
    - when: otherwise
      value: '0'
    baseline:
      overhead_hours: '0'
    evidence: [cross_category]
    cross_difficulty: water
  baseline:
    rule: 'Standard method: the work-plan visit takes the base visit hours, and the work-plan line amount is the visit
      hours times the tier''s supervisor hourly rate, rounded to the cent, half up.'
    params: [work_plan_base_hours, supervisor_hourly_rate]
  inputs:
    history:
    - {category: water, table: water_charges, aggregate: latest, field: service_date, filters: {charge_code: lead_safe_setup}}
    cross_category: [water, claims]
- id: mold_ext_signing_deposit
  base_policy_refs:
  - mold_independent_assessment
  - mold_evt_customer_payment
  overwrite:
  - base_policy: mold_independent_assessment
    superseded_clause: Insurance-funded and warranty jobs require no deposit.
    replaced_by: An insurance_claim job pays the signing deposit set out here, reduced by its coverage credit, a self_pay
      job pays it in full, and a company_warranty job pays no signing deposit.
  trigger: on_request
  subject:
  - mold_authorization
  - mold_customer_payment
  computes: deposit_amount
  target_tool: sign_mold_agreement_2b99f603
  params:
    pending_credit_pct: 50
    rush_notice_days: 2
    short_notice_days: 5
    rush_notice_pct: 20
    rush_notice_minimum: 200.0
    short_notice_raise: 100.0
    rrp_wipe_fee: 135.0
    cat3_deposit_raise: 250.0
    cat2_deposit_raise: 120.0
    adjuster_route_raise: 300.0
    insured_route_raise: 200.0
  rule: >-
    The remediation agreement is signed by the property owner or the owner's authorized agent in the same act in
    which the customer pays the signing deposit through the company's secure payment channel; the customer completes
    the payment, and staff never take card details. The signing deposit is posted in full as one customer payment
    on the job on the signing date, a credit card payment carries its surcharge line under the customer payment rule,
    and a signing deposit of 0.00 posts no payment line. An insurance_claim job pays the signing deposit set out here,
    reduced by its coverage credit, a self_pay job pays it in full, and a company_warranty job pays no signing deposit.
    When another mold job linked to the same claim file has already received insurance proceeds, the part of the mold
    sublimit left for this job is not shown on this job's records, and the signing is handed to a human representative
    as not covered by policy.
    The signing deposit is fixed only after the job's charge lines carry the pre-removal asbestos sampling owed on a
    building built before the asbestos sampling year cutoff. The signing deposit is not worked out until the job's
    charge lines carry the work-plan visit owed on a tier that requires a protocol.
    Standard method: the signing deposit is the tier's self-pay deposit plus the total of every charge line booked
    on the job when the agreement is signed, less the customer payments already posted to the job, rounded to the
    cent, half up.
    Where a schedule below applies, a credit it sets is subtracted from the tier's self-pay deposit first and that
    difference is never below 0.00; every raise or prepayment a schedule sets is then added, the booked charge lines
    are added and the customer payments already posted are subtracted; the result is never below 0.00 and is rounded
    once to the cent, half up.
    Coverage credit schedule: a job linked to a claim file in approved status whose mold sublimit is above 0.00 takes
    a coverage credit equal to that mold sublimit; a job linked to a claim file in estimate_submitted status whose
    mold sublimit is above 0.00 takes a coverage credit of the pending credit percentage of that mold sublimit, rounded
    to the cent, half up; a job with no linked claim file, a claim file in any other status, or a mold sublimit of
    0.00 takes no coverage credit.
    Notice raise schedule: the deposit notice is the scheduled start date less the signing date in calendar days; a
    deposit notice of at most the rush notice days raises the deposit by the rush notice percentage of the tier's
    self-pay deposit, rounded to the cent, half up, but never by less than the rush notice minimum; a deposit notice
    above the rush notice days and at most the short notice days raises it by the flat short notice raise; any longer
    deposit notice takes no notice raise.
    Lead-safe prepayment schedule: when the company water job linked to the job carries a lead-safe setup line and
    the growth is in a living_area or basement, the tier's lead-safe setup fee is prepaid with the deposit; when the
    job has no linked water job, or its linked water job carries no lead-safe setup line, and the building was built
    before the RRP year-built cutoff, the lead dust-wipe fee is prepaid for the paint testing that decides whether
    lead-safe work is needed; every other job prepays nothing for lead.
    Contamination raise schedule: growth behind a linked water job of water category category_3 raises the deposit
    by the category 3 deposit raise; growth behind a linked water job of category_2 raises it by the category 2 deposit
    raise; every other job takes no contamination raise.
    Payment route schedule: the carrier's proceeds reach the company only through the route the claim file's arrangement
    sets; when the linked claim file names a public adjuster, the deposit is raised by the adjuster route raise; when
    the linked claim file names no public adjuster and its billing arrangement does not accept carrier payments issued
    directly to the company, the deposit is raised by the insured route raise; a job with no linked claim file, or
    one whose arrangement accepts direct carrier payments and names no public adjuster, takes no route raise.
  prerequisite:
  - problem: mold_ext_presample_line
    kind: value_input
    gate: booked_charges
    form: state
    policy_source: The signing deposit is fixed only after the job's charge lines carry the pre-removal asbestos sampling
      owed on a building built before the asbestos sampling year cutoff.
    condition: For a job built before the asbestos sampling year cutoff, mold_charges carries one asbestos_sampling
      line for the job.
    resolved_by: book_mold_presample_d4275783
    effect: The booked charge total the deposit adds rises by the sampling line amount, so the signing deposit rises
      by that amount.
  - problem: mold_ext_workplan_line
    kind: value_input
    gate: booked_charges
    form: state
    policy_source: The signing deposit is not worked out until the job's charge lines carry the work-plan visit owed
      on a tier that requires a protocol.
    condition: For a job on a tier that requires a protocol, mold_charges carries one supervisor_labor work-plan visit
      line dated the job's opened date.
    resolved_by: book_mold_workplan_1501986a
    effect: The booked charge total the deposit adds rises by the work-plan line amount, so the signing deposit rises
      by that amount.
  cross_category:
  - category: claims
    as: branch
    reads:
    - status
    - mold_sublimit
    - public_adjuster_name
    - variant_name
    note: The coverage credit factor reads the linked claim file's status and mold sublimit; the payment route factor
      reads its public adjuster and its arrangement's direct-payment rule.
  - category: water
    as: history
    reads:
    - water_charges.charge_code
    - water_category
    note: The lead-safe prepayment factor counts the linked water job's lead-safe setup lines; the contamination factor
      reads its water category.
  compute:
  - warranty_job: F('funding_source') == 'company_warranty'
  - booked_charges: SUM('mold_charges','amount')
  - posted_payments: SUM('mold_payments','amount', event_type='mold_customer_payment')
  - claim_status: CFIELD('claims','status', claim_file_id=F('claim_file_id'))
  - claim_sublimit: float(CFIELD('claims','mold_sublimit', claim_file_id=F('claim_file_id')) or 0)
  - coverage_credit: claim_sublimit if (claim_status == 'approved' and claim_sublimit > 0) else (RND(claim_sublimit * K('pending_credit_pct')
      / 100 + 0.000000001, 2) if (claim_status == 'estimate_submitted' and claim_sublimit > 0) else 0)
  - notice_days: DAYS(NOW, F('scheduled_start_date'))
  - notice_raise: MX(K('rush_notice_minimum'), RND(P('self_pay_deposit_amount') * K('rush_notice_pct') / 100 + 0.000000001,
      2)) if notice_days <= K('rush_notice_days') else (K('short_notice_raise') if notice_days <= K('short_notice_days') else
      0)
  - water_lead_setups: XCOUNT('water','water_charges', charge_code='lead_safe_setup', water_job_id=F('water_job_id'))
  - lead_prepay: P('lead_safe_setup_fee') if (water_lead_setups > 0 and (F('growth_location') == 'living_area' or F('growth_location')
      == 'basement')) else (K('rrp_wipe_fee') if (water_lead_setups == 0 and int(F('year_built')) < P('rrp_year_built_cutoff'))
      else 0)
  - water_category_dep: CFIELD('water','water_category', water_job_id=F('water_job_id'))
  - contamination_raise: K('cat3_deposit_raise') if water_category_dep == 'category_3' else (K('cat2_deposit_raise') if water_category_dep
      == 'category_2' else 0)
  - route_adjuster: CFIELD('claims','public_adjuster_name', claim_file_id=F('claim_file_id'))
  - route_direct: CPARAM('claims','accepts_contractor_direct', claim_file_id=F('claim_file_id'))
  - route_raise: K('adjuster_route_raise') if route_adjuster else (K('insured_route_raise') if route_direct == False else 0)
  - net_scope: MX(0, P('self_pay_deposit_amount') - coverage_credit)
  - result: 0 if warranty_job else RND(MX(0, net_scope + notice_raise + lead_prepay + contamination_raise + route_raise
      + booked_charges - posted_payments) + 0.000000001, 2)
  compute_basis:
    warranty_job: a company_warranty job pays no signing deposit
    booked_charges: the booked charge lines are added
    posted_payments: the customer payments already posted are subtracted
    claim_status: a job linked to a claim file in approved status whose mold sublimit is above 0.00 takes a coverage credit
      equal to that mold sublimit
    claim_sublimit: a job with no linked claim file, a claim file in any other status, or a mold sublimit of 0.00 takes
      no coverage credit.
    coverage_credit: a job linked to a claim file in approved status whose mold sublimit is above 0.00 takes a coverage
      credit equal to that mold sublimit; a job linked to a claim file in estimate_submitted status whose mold sublimit
      is above 0.00 takes a coverage credit of the pending credit percentage of that mold sublimit, rounded to the cent,
      half up; a job with no linked claim file, a claim file in any other status, or a mold sublimit of 0.00 takes no coverage
      credit.
    notice_days: the deposit notice is the scheduled start date less the signing date in calendar days
    notice_raise: a deposit notice of at most the rush notice days raises the deposit by the rush notice percentage of the
      tier's self-pay deposit, rounded to the cent, half up, but never by less than the rush notice minimum; a deposit notice
      above the rush notice days and at most the short notice days raises it by the flat short notice raise; any longer
      deposit notice takes no notice raise.
    water_lead_setups: when the company water job linked to the job carries a lead-safe setup line
    lead_prepay: when the company water job linked to the job carries a lead-safe setup line and the growth is in a living_area
      or basement, the tier's lead-safe setup fee is prepaid with the deposit; when the job has no linked water job, or
      its linked water job carries no lead-safe setup line, and the building was built before the RRP year-built cutoff,
      the lead dust-wipe fee is prepaid for the paint testing that decides whether lead-safe work is needed; every other
      job prepays nothing for lead.
    water_category_dep: growth behind a linked water job of water category category_3 raises the deposit by the category
      3 deposit raise
    contamination_raise: growth behind a linked water job of water category category_3 raises the deposit by the category
      3 deposit raise; growth behind a linked water job of category_2 raises it by the category 2 deposit raise; every other
      job takes no contamination raise.
    route_adjuster: when the linked claim file names a public adjuster, the deposit is raised by the adjuster route raise
    route_direct: its billing arrangement does not accept carrier payments issued directly to the company
    route_raise: when the linked claim file names a public adjuster, the deposit is raised by the adjuster route raise; when
      the linked claim file names no public adjuster and its billing arrangement does not accept carrier payments issued
      directly to the company, the deposit is raised by the insured route raise; a job with no linked claim file, or one
      whose arrangement accepts direct carrier payments and names no public adjuster, takes no route raise.
    net_scope: a credit it sets is subtracted from the tier's self-pay deposit first and that difference is never below
      0.00
    result: the result is never below 0.00 and is rounded once to the cent, half up.
  factors:
  - id: coverage_credit_tier
    effect: parameter
    decides: coverage_credit
    bindings: [claim_status, claim_sublimit, coverage_credit]
    ladder:
    - when: linked claim file in approved status AND its mold sublimit above 0.00
      value: the claim file's mold sublimit
    - when: linked claim file in estimate_submitted status AND its mold sublimit above 0.00
      value: K('pending_credit_pct') percent of the mold sublimit
    - when: otherwise
      value: '0'
    baseline:
      coverage_credit: '0'
    evidence: [cross_category]
    cross_difficulty: claims
  - id: notice_raise_tier
    effect: method
    decides: notice_raise
    bindings: [notice_days, notice_raise]
    ladder:
    - when: deposit notice at most the rush notice days
      method: the larger of the rush notice minimum and the rush notice percentage of the tier's self-pay deposit
    - when: deposit notice above the rush notice days and at most the short notice days
      method: the flat short notice raise
    - when: otherwise
      method: no notice raise
    baseline:
      notice_raise: '0'
    evidence: [date]
    cross_difficulty: null
  - id: lead_prepayment
    effect: parameter
    decides: lead_prepay
    bindings: [water_lead_setups, lead_prepay]
    ladder:
    - when: the linked water job carries a lead-safe setup line AND growth in a living_area or basement
      value: P('lead_safe_setup_fee')
    - when: no linked water job or no lead-safe setup line on it AND built before the RRP year-built cutoff
      value: K('rrp_wipe_fee')
    - when: otherwise
      value: '0'
    baseline:
      lead_prepay: '0'
    evidence: [cross_category, history]
    cross_difficulty: water
  - id: contamination_raise_tier
    effect: parameter
    decides: contamination_raise
    bindings: [water_category_dep, contamination_raise]
    ladder:
    - when: the linked water job's water category is category_3
      value: K('cat3_deposit_raise')
    - when: the linked water job's water category is category_2
      value: K('cat2_deposit_raise')
    - when: otherwise
      value: '0'
    baseline:
      contamination_raise: '0'
    evidence: [cross_category]
    cross_difficulty: water
  - id: payment_route_raise
    effect: parameter
    decides: route_raise
    bindings: [route_adjuster, route_direct, route_raise]
    ladder:
    - when: the linked claim file names a public adjuster
      value: K('adjuster_route_raise')
    - when: the linked claim file names no public adjuster AND its arrangement does not accept direct carrier payments
      value: K('insured_route_raise')
    - when: otherwise
      value: '0'
    baseline:
      route_raise: '0'
    evidence: [cross_category]
    cross_difficulty: claims
  baseline:
    rule: 'Standard method: the signing deposit is the tier''s self-pay deposit plus the total of every charge line booked
      on the job when the agreement is signed, less the customer payments already posted to the job, rounded to the cent,
      half up.'
    params: [self_pay_deposit_amount]
  inputs:
    history:
    - {table: mold_charges, aggregate: sum, field: amount, filters: {}}
    - {table: mold_payments, aggregate: sum, field: amount, filters: {event_type: mold_customer_payment}}
    - {category: water, table: water_charges, aggregate: count, field: charge_code, filters: {charge_code: lead_safe_setup}}
    cross_category: [claims, water]
- id: mold_ext_disposal_line
  base_policy_refs:
  - mold_evt_remediation_scope
  overwrite:
  - base_policy: mold_evt_remediation_scope
    superseded_clause: Each scope line is billed at the tier's unit rate for its code times the quantity performed,
      and labor the customer asks to have performed in the after_hours window is billed at the hourly rate times the
      after-hours labor multiplier.
    replaced_by: For the bagged debris haul-off line this policy prices, and only for that line, the amount is figured
      as set out here; the pre-removal asbestos sampling line and the work-plan visit line are priced under their own
      schedules, and every other scope line remains billed at the tier's unit rate for its code times the quantity performed,
      with labor the customer asks to have performed in the after_hours window billed at the hourly rate times the after-hours
      labor multiplier.
  trigger: state_due
  subject:
  - mold_remediation_charge
  computes: amount
  target_tool: book_mold_disposal_772b05b2
  params:
    drywall_sqft_per_load: 160
    insulation_sqft_per_load: 120
    roll_off_sqft: 400
    roll_off_min_loads: 4
    contaminated_load_fee: 289.0
    gray_load_fee: 241.0
    two_trip_fee: 150.0
    one_trip_fee: 75.0
    saturated_debris_fee: 110.0
    damp_debris_fee: 55.0
    verified_monitoring_days: 2
  rule: >-
    Every job with drywall or insulation removal lines carries one bagged debris haul-off line, coded debris_disposal,
    dated the latest service date among the job's drywall and insulation removal lines, and booked as one haul of
    quantity 1 each whose rate is the line amount. A company_warranty job is performed at no charge and carries no
    haul-off line; its haul-off figure is 0.00 and nothing is booked. For the bagged debris haul-off line this policy prices, and only
    for that line, the amount is figured as set out here; the pre-removal asbestos sampling line and the work-plan
    visit line are priced under their own schedules, and every other scope line remains billed at the tier's unit
    rate for its code times the quantity performed, with labor the customer asks to have performed in the after_hours
    window billed at the hourly rate times the after-hours labor multiplier. The removed square feet are the total
    quantity of the drywall removal lines and the total quantity of the insulation removal lines booked on the job.
    Standard method: the haul-off loads are the drywall and insulation removed square feet together divided by the
    drywall load capacity and rounded up to a whole load, and the haul-off line amount is the loads times the tier's
    debris disposal fee per load, rounded to the cent, half up.
    Where a schedule below applies, the loads or the per-load fee it sets replaces the standard figure, the loads
    are multiplied by the per-load fee, every charge a schedule adds is then added, and the total is rounded once
    to the cent, half up.
    Debris class schedule: growth behind a linked company water job of water category category_3 is hauled as contaminated
    debris at the contaminated load fee; growth behind a linked water job of category_2 is hauled at the gray load
    fee; every other job is hauled at the tier's debris disposal fee per load.
    Bagging stream schedule: a job with both drywall and insulation removal lines bags them as separate streams, and
    its loads are the drywall removed square feet divided by the drywall load capacity, rounded up to a whole load,
    plus the insulation removed square feet divided by the insulation load capacity, rounded up to a whole load; a
    job with drywall removal lines only, whose drywall removed square feet are above the roll-off threshold, is hauled in a roll-off priced at no fewer than the roll-off minimum loads, and its loads are the larger of two load counts, the roll-off minimum loads and the quotient of the drywall removed square feet divided by the drywall load capacity rounded up to a whole load; every other job's loads follow the standard method.
    Haul trip schedule: the haul days are the latest drywall removal date and the latest insulation removal date on
    the job; when both kinds of removal are booked and those two dates differ, the debris leaves on two trips and
    the two-trip charge is added; when the removal is on a single date that is not the job's containment date, the
    debris leaves on its own trip and the one-trip charge is added; when the removal is on the containment date, the
    debris rides out with the setup truck and no trip charge is added.
    Wet debris schedule: materials left behind a drying stopped early are hauled wet and weigh more; the verified drying
    days are the monitoring visit lines booked on the linked water job; growth behind a linked water job whose drying
    ended with drying_outcome customer_release and which carries fewer monitoring visit lines than the verified
    monitoring days adds the saturated debris fee; growth behind a linked water job whose drying ended with drying_outcome
    customer_release and which carries at least the verified monitoring days of monitoring visit lines adds the damp
    debris fee; every other job adds no wet-debris charge.
  prerequisite: []
  cross_category:
  - category: water
    as: branch
    reads:
    - water_category
    - drying_outcome
    - water_charges.charge_code
    note: The debris class factor reads the linked water job's water category; the wet debris factor reads its drying
      outcome and counts its monitoring visit lines.
  compute:
  - drywall_sqft: SUM('mold_charges','quantity', charge_code='drywall_removal')
  - insulation_sqft: SUM('mold_charges','quantity', charge_code='insulation_removal')
  - water_category_read: CFIELD('water','water_category', water_job_id=F('water_job_id'))
  - load_fee: K('contaminated_load_fee') if water_category_read == 'category_3' else (K('gray_load_fee') if water_category_read
      == 'category_2' else P('debris_disposal_fee_per_load'))
  - stream_loads: (int(drywall_sqft / K('drywall_sqft_per_load')) + (1 if drywall_sqft / K('drywall_sqft_per_load') > int(drywall_sqft
      / K('drywall_sqft_per_load')) else 0) + int(insulation_sqft / K('insulation_sqft_per_load')) + (1 if insulation_sqft
      / K('insulation_sqft_per_load') > int(insulation_sqft / K('insulation_sqft_per_load')) else 0)) if (drywall_sqft >
      0 and insulation_sqft > 0) else (MX(K('roll_off_min_loads'), int(drywall_sqft / K('drywall_sqft_per_load')) + (1 if
      drywall_sqft / K('drywall_sqft_per_load') > int(drywall_sqft / K('drywall_sqft_per_load')) else 0)) if (insulation_sqft
      == 0 and drywall_sqft > K('roll_off_sqft')) else int((drywall_sqft + insulation_sqft) / K('drywall_sqft_per_load'))
      + (1 if (drywall_sqft + insulation_sqft) / K('drywall_sqft_per_load') > int((drywall_sqft + insulation_sqft) / K('drywall_sqft_per_load'))
      else 0))
  - drywall_day: LATEST('mold_charges','service_date', date_field='service_date', charge_code='drywall_removal')
  - insulation_day: LATEST('mold_charges','service_date', date_field='service_date', charge_code='insulation_removal')
  - trip_charge: K('two_trip_fee') if (drywall_day and insulation_day and drywall_day != insulation_day) else (K('one_trip_fee')
      if ((drywall_day or insulation_day) and (drywall_day or insulation_day) != F('containment_date')) else 0)
  - water_outcome_read: CFIELD('water','drying_outcome', water_job_id=F('water_job_id'))
  - water_monitoring_lines: XCOUNT('water','water_charges', charge_code='monitoring_visit', water_job_id=F('water_job_id'))
  - wet_charge: K('saturated_debris_fee') if (water_outcome_read == 'customer_release' and water_monitoring_lines < K('verified_monitoring_days'))
      else (K('damp_debris_fee') if (water_outcome_read == 'customer_release' and water_monitoring_lines >= K('verified_monitoring_days'))
      else 0)
  - warranty_job: F('funding_source') == 'company_warranty'
  - result: 0 if warranty_job else RND(stream_loads * load_fee + trip_charge + wet_charge + 0.000000001, 2)
  compute_basis:
    drywall_sqft: The removed square feet are the total quantity of the drywall removal lines and the total quantity of
      the insulation removal lines booked on the job.
    insulation_sqft: The removed square feet are the total quantity of the drywall removal lines and the total quantity
      of the insulation removal lines booked on the job.
    water_category_read: growth behind a linked company water job of water category category_3 is hauled as contaminated
      debris at the contaminated load fee
    load_fee: growth behind a linked company water job of water category category_3 is hauled as contaminated debris at
      the contaminated load fee; growth behind a linked water job of category_2 is hauled at the gray load fee; every other
      job is hauled at the tier's debris disposal fee per load.
    stream_loads: a job with both drywall and insulation removal lines bags them as separate streams, and its loads are
      the drywall removed square feet divided by the drywall load capacity, rounded up to a whole load, plus the insulation
      removed square feet divided by the insulation load capacity, rounded up to a whole load; a job with drywall removal
      lines only, whose drywall removed square feet are above the roll-off threshold, is hauled in a roll-off priced at no fewer than the roll-off minimum loads, and its loads are the larger of two load counts, the roll-off minimum loads and the quotient of the drywall removed square feet divided by the drywall load capacity rounded up to a whole load; every other job's loads follow the standard method.
    drywall_day: the haul days are the latest drywall removal date and the latest insulation removal date on the job
    insulation_day: the haul days are the latest drywall removal date and the latest insulation removal date on the job
    trip_charge: when both kinds of removal are booked and those two dates differ, the debris leaves on two trips and the
      two-trip charge is added; when the removal is on a single date that is not the job's containment date, the debris
      leaves on its own trip and the one-trip charge is added; when the removal is on the containment date, the debris rides
      out with the setup truck and no trip charge is added.
    water_outcome_read: growth behind a linked water job whose drying ended with drying_outcome customer_release
    water_monitoring_lines: the verified drying days are the monitoring visit lines booked on the linked water job
    wet_charge: growth behind a linked water job whose drying ended with drying_outcome customer_release and which carries
      fewer monitoring visit lines than the verified monitoring days adds the saturated debris fee; growth behind a linked
      water job whose drying ended with drying_outcome customer_release and which carries at least the verified monitoring
      days of monitoring visit lines adds the damp debris fee; every other job adds no wet-debris charge.
    warranty_job: A company_warranty job is performed at no charge and carries no haul-off line; its haul-off figure is
      0.00 and nothing is booked.
    result: the loads or the per-load fee it sets replaces the standard figure, the loads are multiplied by the per-load
      fee, every charge a schedule adds is then added, and the total is rounded once to the cent, half up.
  factors:
  - id: debris_class
    effect: parameter
    decides: load_fee
    bindings: [water_category_read, load_fee]
    ladder:
    - when: the linked company water job's water category is category_3
      value: K('contaminated_load_fee')
    - when: the linked water job's water category is category_2
      value: K('gray_load_fee')
    - when: otherwise
      value: P('debris_disposal_fee_per_load')
    baseline:
      load_fee: P('debris_disposal_fee_per_load')
    evidence: [cross_category]
    cross_difficulty: water
  - id: bagging_streams
    effect: method
    decides: stream_loads
    bindings: [drywall_sqft, insulation_sqft, stream_loads]
    ladder:
    - when: both drywall and insulation removal lines on the job
      method: drywall loads and insulation loads rounded up separately, each at its own load capacity, then added
    - when: drywall removal lines only AND drywall removed square feet above the roll-off threshold
      method: the larger of the roll-off minimum loads and the drywall loads (quotient rounded up) — the roll-off minimum binds up to the minimum loads times the capacity
    - when: otherwise
      method: the removed square feet together over the drywall load capacity, rounded up
    baseline:
      stream_loads: int((drywall_sqft + insulation_sqft) / K('drywall_sqft_per_load')) + (1 if (drywall_sqft + insulation_sqft)
        / K('drywall_sqft_per_load') > int((drywall_sqft + insulation_sqft) / K('drywall_sqft_per_load')) else 0)
    evidence: [history]
    cross_difficulty: null
  - id: haul_trips
    effect: parameter
    decides: trip_charge
    bindings: [drywall_day, insulation_day, trip_charge]
    ladder:
    - when: both drywall and insulation removal booked AND their latest dates differ
      value: K('two_trip_fee')
    - when: all removal on a single date AND that date is not the containment date
      value: K('one_trip_fee')
    - when: otherwise (removal on the containment date, or no removal)
      value: '0'
    baseline:
      trip_charge: '0'
    evidence: [history, date]
    cross_difficulty: null
  - id: wet_debris
    effect: parameter
    decides: wet_charge
    bindings: [water_outcome_read, water_monitoring_lines, wet_charge]
    ladder:
    - when: linked water job drying ended with drying_outcome customer_release AND fewer monitoring visit lines than the
        verified monitoring days
      value: K('saturated_debris_fee')
    - when: linked water job drying ended with drying_outcome customer_release AND at least the verified monitoring days
        of monitoring visit lines
      value: K('damp_debris_fee')
    - when: otherwise
      value: '0'
    baseline:
      wet_charge: '0'
    evidence: [cross_category, history]
    cross_difficulty: water
  baseline:
    rule: 'Standard method: the haul-off loads are the drywall and insulation removed square feet together divided by
      the drywall load capacity and rounded up to a whole load, and the haul-off line amount is the loads times the tier''s
      debris disposal fee per load, rounded to the cent, half up.'
    params: [drywall_sqft_per_load, debris_disposal_fee_per_load]
  inputs:
    history:
    - {table: mold_charges, aggregate: sum, field: quantity, filters: {charge_code: drywall_removal}}
    - {table: mold_charges, aggregate: sum, field: quantity, filters: {charge_code: insulation_removal}}
    - {category: water, table: water_charges, aggregate: count, field: charge_code, filters: {charge_code: monitoring_visit}}
    cross_category: [water]
- id: mold_ext_insured_share
  base_policy_refs:
  - mold_evt_customer_payment
  - mold_agg_shared_sublimit
  overwrite: []
  trigger: on_request
  subject:
  - mold_customer_payment
  computes: payment_amount
  target_tool: pay_mold_insured_share_5816092f
  params:
    pending_allowance_pct: 50
  rule: >-
    When the customer asks to pay their own share of a mold job that is cleared or invoiced, the customer pays it
    through the company's secure payment channel; the customer completes the payment, staff never take card details,
    and the share is posted in full as one customer payment on the job, with a credit card payment carrying its
    surcharge line under the customer payment rule. A share of 0.00 takes no payment, and the customer is told that
    nothing is owed now. When another mold job linked to the same claim file has already received insurance proceeds,
    the part of the mold sublimit left for this job is not shown on this job's records, and the request is handed
    to a human representative as not covered by policy. On a claim file whose arrangement never bills declined lines to the customer, when a water mitigation job or reconstruction contract linked to the same claim file carries a billing error, duplicate line or goodwill credit or a change order credit, a carrier_denied_line write-off on the file may record value that job already credited rather than a line the carrier declined, and the request is likewise handed to a human representative as not covered by policy. The insured's own share is not worked out until the job's
    charge lines carry the bagged debris haul-off owed for the drywall or insulation removed on the job. The claim file's deductible is assessed and collected on the claim file, never on the job, and is not part of the insured's own share. The job's charge total is every charge line booked on the job; its mold-covered total is its remediation scope, equipment
    day and clearance fee lines.
    Standard method: the insured's own share is the job's charge total less the customer payments already posted
    to the job, rounded to the cent, half up.
    Where a schedule below applies: every write-down it sets is taken off both the charge total and the mold-covered
    total; an amount it carries under other coverage is taken off the mold-covered total, which is never below 0.00;
    what remains of the mold-covered total is capped at the coverage limit it sets; the carrier-payable amount is that
    capped figure plus the amount carried under other coverage; the insured's own share is the charge total less every
    write-down, less the carrier-payable amount, less the customer payments already posted, never below 0.00 and rounded
    once to the cent, half up.
    Coverage allowance schedule: a job linked to a claim file in approved status whose billing arrangement accepts
    carrier payments issued directly to the company has a coverage limit equal to the claim file's mold sublimit;
    a job linked to a claim file in estimate_submitted status whose billing arrangement accepts carrier payments issued
    directly to the company and whose mold sublimit is above 0.00 has a coverage limit of the pending allowance percentage
    of that mold sublimit, rounded to the cent, half up; every other job, including one whose arrangement pays the
    carrier's proceeds to the insured, has a coverage limit of 0.00.
    Ordinance-or-law schedule: the regulated-material lines are the job's asbestos sampling and lead-safe setup lines;
    on a claim file in approved status whose ordinance or law limit is at least their total, and that total is above
    0.00, the amount carried under ordinance or law coverage is that whole total; on a claim file in approved status
    whose ordinance or law limit is above 0.00 but below that total, it is the ordinance or law limit; in every other
    case it is 0.00.
    Declined line schedule: a line the carrier declines is recorded on the claim file as a carrier_denied_line write-off,
    and on an arrangement that never bills declined lines to the customer it is written down; when no water, fire,
    rebuild or contents job is linked to the same claim file, the declined-line write-down is the whole total of the
    claim file's carrier_denied_line write-offs; when a job of one of those categories is linked to it, the declined-line
    write-down is that total times the fraction of the mold-covered total over the claim file's estimate amount, the fraction never taken above 1, rounded to the cent, half up, and the whole total when the estimate amount is 0.00;
    on every other arrangement there is no declined-line write-down.
    Program price schedule: on an arrangement that writes off carrier program price adjustments, the program difference
    is never billed to the customer; when the claim file carries no program_price_adjustment write-off yet, the program
    write-down is the program pricing discount percentage of the mold-covered total, rounded to the cent, half up; when
    it carries program_price_adjustment write-offs, the program write-down is their total times the fraction of the mold-covered total over the claim file's estimate amount, the fraction never taken above 1, rounded to the cent, half
    up, and their whole total when the estimate amount is 0.00; on every other arrangement there is no program write-down.
  prerequisite:
  - problem: mold_ext_disposal_line
    kind: value_input
    gate: charge_total
    form: state
    policy_source: The insured's own share is not worked out until the job's charge lines carry the bagged debris haul-off
      owed for the drywall or insulation removed on the job.
    condition: For a job with drywall or insulation removal lines, mold_charges carries one debris_disposal line for
      the job.
    resolved_by: book_mold_disposal_772b05b2
    effect: The charge total and the mold-covered total rise by the haul-off line amount while the carrier-payable amount
      stays at the coverage limit plus the ordinance-or-law amount, so the insured's own share rises by that amount less
      the extra prorated write-downs it brings.
  cross_category:
  - category: claims
    as: history
    reads:
    - status
    - mold_sublimit
    - estimate_amount
    - ordinance_law_limit
    - variant_name
    - claims_approvals.amount
    - claims_approvals.writeoff_reason
    note: The coverage allowance, ordinance-or-law, declined line and program price factors read the linked claim file,
      its arrangement's parameters and its write-off lines.
  - category: water
    as: existence
    reads:
    - claim_file_id
    note: The declined line factor tests whether a water job is linked to the same claim file.
  - category: fire
    as: existence
    reads:
    - claim_file_id
    note: The declined line factor tests whether a fire job is linked to the same claim file.
  - category: rebuild
    as: existence
    reads:
    - claim_file_id
    note: The declined line factor tests whether a rebuild contract is linked to the same claim file.
  - category: contents
    as: existence
    reads:
    - claim_file_id
    note: The declined line factor tests whether a contents job is linked to the same claim file.
  compute:
  - charge_total: SUM('mold_charges','amount')
  - mold_covered: SUM('mold_charges','amount', event_type='mold_remediation_charge') + SUM('mold_charges','amount', event_type='mold_equipment_day_charge')
      + SUM('mold_charges','amount', event_type='mold_clearance_fee')
  - posted_payments: SUM('mold_payments','amount', event_type='mold_customer_payment')
  - claim_state: CFIELD('claims','status', claim_file_id=F('claim_file_id'))
  - claim_limit: float(CFIELD('claims','mold_sublimit', claim_file_id=F('claim_file_id')) or 0)
  - direct_pay_accepted: CPARAM('claims','accepts_contractor_direct', claim_file_id=F('claim_file_id'))
  - allowance: claim_limit if (claim_state == 'approved' and direct_pay_accepted == True) else (RND(claim_limit * K('pending_allowance_pct')
      / 100 + 0.000000001, 2) if (claim_state == 'estimate_submitted' and direct_pay_accepted == True and claim_limit > 0)
      else 0)
  - regulated_total: SUM('mold_charges','amount', charge_code='asbestos_sampling') + SUM('mold_charges','amount', charge_code='lead_safe_setup')
  - ol_limit: float(CFIELD('claims','ordinance_law_limit', claim_file_id=F('claim_file_id')) or 0)
  - ol_claim_state: CFIELD('claims','status', claim_file_id=F('claim_file_id'))
  - ol_carve: regulated_total if (ol_claim_state == 'approved' and ol_limit >= regulated_total and regulated_total > 0) else
      (ol_limit if (ol_claim_state == 'approved' and ol_limit > 0 and ol_limit < regulated_total) else 0)
  - declined_never_billed: CPARAM('claims','denied_line_billable_to_customer', claim_file_id=F('claim_file_id')) == False
  - denied_writeoffs: XSUM('claims','claims_approvals','amount', claim_file_id=F('claim_file_id'), event_type='claims_receivable_writeoff',
      writeoff_reason='carrier_denied_line')
  - other_jobs_linked: EXISTS('water', claim_file_id=F('claim_file_id')) or EXISTS('fire', claim_file_id=F('claim_file_id'))
      or EXISTS('rebuild', claim_file_id=F('claim_file_id')) or EXISTS('contents', claim_file_id=F('claim_file_id'))
  - denied_estimate: float(CFIELD('claims','estimate_amount', claim_file_id=F('claim_file_id')) or 0)
  - denied_writedown: (denied_writeoffs if not other_jobs_linked else (RND(denied_writeoffs * MN(1, mold_covered / denied_estimate)
      + 0.000000001, 2) if denied_estimate > 0 else denied_writeoffs)) if declined_never_billed else 0
  - program_tier: CPARAM('claims','program_price_writeoff_allowed', claim_file_id=F('claim_file_id'))
  - program_pct: float(CPARAM('claims','program_pricing_discount_pct', claim_file_id=F('claim_file_id')) or 0)
  - program_writeoffs: XSUM('claims','claims_approvals','amount', claim_file_id=F('claim_file_id'), event_type='claims_receivable_writeoff',
      writeoff_reason='program_price_adjustment')
  - program_estimate: float(CFIELD('claims','estimate_amount', claim_file_id=F('claim_file_id')) or 0)
  - program_writedown: (RND(mold_covered * program_pct / 100 + 0.000000001, 2) if program_writeoffs == 0 else (RND(program_writeoffs
      * MN(1, mold_covered / program_estimate) + 0.000000001, 2) if program_estimate > 0 else program_writeoffs)) if program_tier
      == True else 0
  - covered_left: MX(0, mold_covered - denied_writedown - program_writedown - ol_carve)
  - carrier_payable: MN(covered_left, allowance) + ol_carve
  - result: RND(MX(0, charge_total - denied_writedown - program_writedown - carrier_payable - posted_payments) + 0.000000001,
      2)
  compute_basis:
    charge_total: The job's charge total is every charge line booked on the job
    mold_covered: its mold-covered total is its remediation scope, equipment day and clearance fee lines.
    posted_payments: less the customer payments already posted
    claim_state: a job linked to a claim file in approved status whose billing arrangement accepts carrier payments issued
      directly to the company has a coverage limit equal to the claim file's mold sublimit
    claim_limit: has a coverage limit equal to the claim file's mold sublimit
    direct_pay_accepted: whose billing arrangement accepts carrier payments issued directly to the company
    allowance: a job linked to a claim file in approved status whose billing arrangement accepts carrier payments issued
      directly to the company has a coverage limit equal to the claim file's mold sublimit; a job linked to a claim file
      in estimate_submitted status whose billing arrangement accepts carrier payments issued directly to the company and
      whose mold sublimit is above 0.00 has a coverage limit of the pending allowance percentage of that mold sublimit,
      rounded to the cent, half up; every other job, including one whose arrangement pays the carrier's proceeds to the
      insured, has a coverage limit of 0.00.
    regulated_total: the regulated-material lines are the job's asbestos sampling and lead-safe setup lines
    ol_limit: on a claim file in approved status whose ordinance or law limit is at least their total
    ol_claim_state: on a claim file in approved status whose ordinance or law limit is at least their total
    ol_carve: on a claim file in approved status whose ordinance or law limit is at least their total, and that total is
      above 0.00, the amount carried under ordinance or law coverage is that whole total; on a claim file in approved status
      whose ordinance or law limit is above 0.00 but below that total, it is the ordinance or law limit; in every other
      case it is 0.00.
    declined_never_billed: on an arrangement that never bills declined lines to the customer it is written down
    denied_writeoffs: the whole total of the claim file's carrier_denied_line write-offs
    other_jobs_linked: when no water, fire, rebuild or contents job is linked to the same claim file
    denied_estimate: that total times the fraction of the mold-covered total over the claim file's estimate amount
    denied_writedown: when no water, fire, rebuild or contents job is linked to the same claim file, the declined-line write-down
      is the whole total of the claim file's carrier_denied_line write-offs; when a job of one of those categories is linked
      to it, the declined-line write-down is that total times the fraction of the mold-covered total over the claim file's estimate amount, the fraction never taken above 1, rounded to the cent, half up, and the whole total when the estimate
      amount is 0.00; on every other arrangement there is no declined-line write-down.
    program_tier: on an arrangement that writes off carrier program price adjustments, the program difference is never
      billed to the customer
    program_pct: the program write-down is the program pricing discount percentage of the mold-covered total
    program_writeoffs: when it carries program_price_adjustment write-offs
    program_estimate: their total times the fraction of the mold-covered total over the claim file's estimate amount
    program_writedown: when the claim file carries no program_price_adjustment write-off yet, the program write-down is the
      program pricing discount percentage of the mold-covered total, rounded to the cent, half up; when it carries program_price_adjustment
      write-offs, the program write-down is their total times the fraction of the mold-covered total over the claim file's estimate amount, the fraction never taken above 1, rounded to the cent, half up, and their whole total when the estimate
      amount is 0.00; on every other arrangement there is no program write-down.
    covered_left: every write-down it sets is taken off both the charge total and the mold-covered total; an amount it carries
      under other coverage is taken off the mold-covered total, which is never below 0.00
    carrier_payable: what remains of the mold-covered total is capped at the coverage limit it sets; the carrier-payable
      amount is that capped figure plus the amount carried under other coverage
    result: the insured's own share is the charge total less every write-down, less the carrier-payable amount, less the
      customer payments already posted, never below 0.00 and rounded once to the cent, half up.
  factors:
  - id: coverage_allowance
    effect: parameter
    decides: allowance
    bindings: [claim_state, claim_limit, direct_pay_accepted, allowance]
    ladder:
    - when: linked claim file in approved status AND its arrangement accepts carrier payments issued directly to the company
      value: the claim file's mold sublimit
    - when: linked claim file in estimate_submitted status AND its arrangement accepts direct carrier payments AND its mold
        sublimit above 0.00
      value: K('pending_allowance_pct') percent of the mold sublimit
    - when: otherwise
      value: '0'
    baseline:
      allowance: '0'
    evidence: [cross_category]
    cross_difficulty: claims
  - id: ordinance_carve
    effect: parameter
    decides: ol_carve
    bindings: [regulated_total, ol_limit, ol_claim_state, ol_carve]
    ladder:
    - when: claim file approved AND ordinance or law limit at least the regulated-material total, that total above 0.00
      value: the regulated-material total
    - when: claim file approved AND ordinance or law limit above 0.00 but below the regulated-material total
      value: the ordinance or law limit
    - when: otherwise
      value: '0'
    baseline:
      ol_carve: '0'
    evidence: [cross_category, history]
    cross_difficulty: claims
  - id: declined_line_writedown
    effect: method
    decides: denied_writedown
    bindings: [declined_never_billed, denied_writeoffs, other_jobs_linked, denied_estimate, denied_writedown]
    ladder:
    - when: arrangement never bills declined lines AND no water, fire, rebuild or contents job linked to the claim file
      method: the whole total of the claim file's carrier_denied_line write-offs
    - when: arrangement never bills declined lines AND a water, fire, rebuild or contents job linked to the claim file
      method: that total prorated by the mold-covered total over the claim file's estimate amount (fraction at most 1)
    - when: otherwise
      method: no declined-line write-down
    baseline:
      denied_writedown: '0'
    evidence: [cross_category, history]
    cross_difficulty: claims
  - id: program_price_writedown
    effect: method
    decides: program_writedown
    bindings: [program_tier, program_pct, program_writeoffs, program_estimate, program_writedown]
    ladder:
    - when: arrangement writes off program price adjustments AND no program_price_adjustment write-off on the claim file
      method: the program pricing discount percentage of the mold-covered total
    - when: arrangement writes off program price adjustments AND program_price_adjustment write-offs on the claim file
      method: those write-offs prorated by the mold-covered total over the claim file's estimate amount (fraction at most
        1)
    - when: otherwise
      method: no program write-down
    baseline:
      program_writedown: '0'
    evidence: [cross_category, history]
    cross_difficulty: claims
  baseline:
    rule: 'Standard method: the insured''s own share is the job''s charge total less the customer payments already posted
      to the job, rounded to the cent, half up.'
    params: []
  inputs:
    history:
    - {table: mold_charges, aggregate: sum, field: amount, filters: {}}
    - {table: mold_payments, aggregate: sum, field: amount, filters: {event_type: mold_customer_payment}}
    - {category: claims, table: claims_approvals, aggregate: sum, field: amount, filters: {event_type: claims_receivable_writeoff,
        writeoff_reason: carrier_denied_line}}
    - {category: claims, table: claims_approvals, aggregate: sum, field: amount, filters: {event_type: claims_receivable_writeoff,
        writeoff_reason: program_price_adjustment}}
    cross_category: [claims, water, fire, rebuild, contents]
