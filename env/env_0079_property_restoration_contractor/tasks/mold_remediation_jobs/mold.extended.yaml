  measures:
  - mold_msr_clearance_attempts
- id: mold_cancellation
  subject:
  - mold_cancel
  - mold_late_cancellation_fee
  rule: The job must be in scheduled status when it is cancelled. A customer may cancel a scheduled job before signing
    the remediation agreement. The late cancellation fee applies only when the cancellation comes later than the
    notice deadline before the scheduled start date. The notice deadline is the scheduled start date minus the tier's
    cancellation notice days, counted in calendar days; a cancellation on the deadline date itself is in time and
    carries no fee. Warranty jobs never carry a cancellation fee.
  eligibility:
  - id: ca_state
    applies_to:
    - mold_cancel
    kind: state
    condition: The job must be in scheduled status when it is cancelled.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - scheduled
  - id: lc_deadline
    applies_to:
    - mold_late_cancellation_fee
    kind: caller_fact
    condition: The late cancellation fee applies only when the cancellation comes later than the notice deadline
      before the scheduled start date.
    evidence_fields:
    - mold_jobs.scheduled_start_date
    - mold_jobs.cancelled_date
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
  params:
    per_tier:
      Spot Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
      Limited Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
      Standard Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
      Extensive Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
      Attic and Crawlspace Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
      HVAC System Mold Remediation:
        cancellation_notice_days: =cancellation_notice_days
        late_cancellation_fee: =late_cancellation_fee
  formula:
    amount: late_cancellation_fee
- id: mold_invoicing
  subject:
