- id: mold_clearance
  subject:
  - mold_clearance_request
  - mold_clearance_result
  - mold_clearance_pass
  - mold_clearance_fail
  - mold_clearance_fee
  rule: 'Clearance is requested once the supervisor reports remediation complete. The job must be in awaiting_clearance
    status when a clearance result is recorded. Clearance is established by the tier''s clearance method, and the
    result is recorded exactly as the clearance report states it, numbered by attempt from 1: a pass moves the job
    to cleared, and a fail returns it to remediation for re-cleaning. Only the first clearance attempt''s fee is
    billed. The fee passed through is the tier''s clearance test fee, and on supervisor_visual tiers that fee is
    0.00 and no fee line is booked. Retests after a failed clearance are at the company''s cost on every tier. A
    job that has failed the tier''s maximum number of clearance attempts is handed to a human project manager as
    not covered by policy.'
  eligibility:
  - id: cl_state
    applies_to:
    - mold_clearance_result
    kind: state
    condition: The job must be in awaiting_clearance status when a clearance result is recorded.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - awaiting_clearance
  - id: first_attempt_fee
    applies_to:
    - mold_clearance_fee
    kind: caller_fact
    condition: Only the first clearance attempt's fee is billed.
    evidence_fields:
    - mold_clearance_tests.attempt_number
    - mold_clearance_tests.mold_test_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_clearance_tests.mold_test_id
      action_bindings:
        mold_clearance_tests.mold_test_id: mold_test_id
  params:
    per_tier:
      Spot Mold Remediation:
        clearance_method: =clearance_method
        clearance_test_fee: =clearance_test_fee
        retest_billable: =retest_billable
        max_clearance_attempts: =max_clearance_attempts
      Limited Mold Remediation:
        clearance_method: =clearance_method
        clearance_test_fee: =clearance_test_fee
        retest_billable: =retest_billable
        max_clearance_attempts: =max_clearance_attempts
      Standard Mold Remediation:
        clearance_method: =clearance_method
        clearance_test_fee: =clearance_test_fee
        retest_billable: =retest_billable
        max_clearance_attempts: =max_clearance_attempts
      Extensive Mold Remediation:
        clearance_method: =clearance_method
        clearance_test_fee: =clearance_test_fee
        retest_billable: =retest_billable
        max_clearance_attempts: =max_clearance_attempts
      Attic and Crawlspace Mold Remediation:
        clearance_method: =clearance_method
        clearance_test_fee: =clearance_test_fee
        retest_billable: =retest_billable
        max_clearance_attempts: =max_clearance_attempts
      HVAC System Mold Remediation:
        clearance_method: =clearance_method
        clearance_test_fee: =clearance_test_fee
        retest_billable: =retest_billable
        max_clearance_attempts: =max_clearance_attempts
  formula:
