- id: mold_evt_late_fee
  subject:
  - mold_late_fee
  rule: The job must be in invoiced status when a late fee is charged. A late fee may post only after the grace
    period following the payment due date recorded at invoicing has fully passed. The grace period is counted in
    calendar days starting the day after the payment_due_date, and the first late fee may post on the day after
    the grace period's last day. A late fee is assessed at most once per calendar month fee period at the late fee
    percentage of the balance due, with the late fee minimum as a floor, rounded to the cent, half up. No late fee
    posts on an insurance_claim job while its linked claim file is in opened, estimate_submitted or approved status
    and the suspension period counted from the invoice date has not ended. Late fees are never back-dated to a suspended
    period, and a job with a zero or negative balance is never charged a late fee.
  eligibility:
  - id: lf_state
    applies_to:
    - mold_late_fee
    kind: state
    condition: The job must be in invoiced status when a late fee is charged.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - invoiced
  - id: lf_grace
    applies_to:
    - mold_late_fee
    kind: time
    condition: A late fee may post only after the grace period following the payment due date recorded at invoicing
      has fully passed.
    evidence_fields:
    - mold_jobs.payment_due_date
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the payment due date recorded at invoicing
      anchor_source: mold_jobs.payment_due_date
      relation: not_before
      duration_source: variants.late_fee_grace_days
      unit: calendar_days
      counting_rule: The grace period is counted in calendar days starting the day after the payment_due_date, and
        the first late fee may post on the day after the grace period's last day.
      boundary: exclusive
  - id: lf_susp
    applies_to:
    - mold_late_fee
    kind: caller_fact
    condition: No late fee posts on an insurance_claim job while its linked claim file is in opened, estimate_submitted
      or approved status and the suspension period counted from the invoice date has not ended.
    evidence_fields:
