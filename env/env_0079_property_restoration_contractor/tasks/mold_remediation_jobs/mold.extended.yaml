- id: mold_evt_adjustment
  subject:
  - mold_adjustment_credit
  rule: The job must be in cleared or invoiced status when an adjustment credit is posted. A billing_error credit
    equals the amount charged on the line less the amount the tier's rate and the recorded quantity produce; a duplicate_line
    credit equals the full amount of a line repeating another of the same code, date and quantity. A re-cleaning
    line billed after a failed clearance is credited in full as billing_error. A billing_error or duplicate_line
    credit may be posted only when the customer raises the dispute no later than the dispute window after the final
    invoice was issued on this job. The dispute window is counted in calendar days starting the day after the job's
    invoiced_date, and a dispute raised on the last day of the window is in time; on a job not yet invoiced the
    window has not started and the dispute is always in time. Goodwill credits on one job may not exceed the tier's
    goodwill credit cap in total. A goodwill request above the remaining cap is handed to a human representative
    as not covered by policy. Each charge line takes at most one adjustment credit.
  eligibility:
  - id: ad_state
    applies_to:
    - mold_adjustment_credit
    kind: state
    condition: The job must be in cleared or invoiced status when an adjustment credit is posted.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - cleared
      - invoiced
  - id: ad_window
    applies_to:
    - mold_adjustment_credit
    kind: time
    condition: A billing_error or duplicate_line credit may be posted only when the customer raises the dispute
      no later than the dispute window after the final invoice was issued on this job.
    evidence_fields:
    - mold_jobs.invoiced_date
    - mold_charges.mold_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_charges.mold_charge_id
      action_bindings:
        mold_charges.mold_charge_id: source_charge_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the final invoice was issued on this job
      anchor_source: mold_jobs.invoiced_date
      relation: not_after
      duration_source: variants.adjustment_dispute_window_days
      unit: calendar_days
      counting_rule: The dispute window is counted in calendar days starting the day after the job's invoiced_date,
        and a dispute raised on the last day of the window is in time; on a job not yet invoiced the window has
        not started and the dispute is always in time.
      boundary: inclusive
  - id: ad_goodwill
