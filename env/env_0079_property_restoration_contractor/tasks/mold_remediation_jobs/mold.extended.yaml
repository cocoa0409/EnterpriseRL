- id: mold_evt_customer_payment
  subject:
  - mold_customer_payment
  - mold_card_surcharge
  - mold_refund
  rule: The job must not be closed when a customer payment is posted. Customer payments are accepted by credit card,
    debit card, ACH or check and are posted in full to the one job they name; a credit card payment carries a surcharge
    of the credit card surcharge percentage of the payment amount, booked as its own line and rounded to the cent,
    half up, and no other tender is surcharged. A refund is issued only while the job's balance due is negative,
    for the credit balance but never more than the customer payment it is returned from, to that payment's original
    tender, within the refund processing business days; a credit balance created by insurance proceeds is handed
    to a human representative as not covered by policy.
  eligibility:
  - id: py_state
    applies_to:
    - mold_customer_payment
    - mold_card_surcharge
    - mold_refund
    kind: state
    condition: The job must not be closed when a customer payment is posted.
    evidence_fields:
    - mold_jobs.status
    - mold_jobs.mold_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - mold_jobs.mold_job_id
      action_bindings:
        mold_jobs.mold_job_id: mold_job_id
    state_contract:
      field: mold_jobs.status
      allowed:
      - scheduled
      - authorized
      - remediating
      - awaiting_clearance
      - cleared
      - invoiced
      - cancelled
  params:
    per_tier:
      Spot Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Limited Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Standard Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Extensive Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      Attic and Crawlspace Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
      HVAC System Mold Remediation:
        credit_card_surcharge_pct: =credit_card_surcharge_pct
        refund_processing_business_days: =refund_processing_business_days
  formula:
    when: payment_method == 'credit_card'
    amount: round(amount * credit_card_surcharge_pct / 100, 2)
- id: mold_evt_insurance_payment
  subject:
  - mold_insurance_payment
  rule: The job must be in remediating, awaiting_clearance, cleared or invoiced status when insurance proceeds are
    posted. The carrier payment must be recorded on the same claim file this job is linked to. Only dwelling-coverage
    carrier payments the company has received directly, or by a two-party check the insured has endorsed, are posted
    to a mold job. A carrier payment is posted to the same mold job at most once. The amount posted is the least
    of the job's balance due, the carrier payment's unapplied remainder after every posting already made from it
    to any water, fire, mold or rebuild job, and the claim file's mold sublimit less the insurance proceeds already
    posted to mold jobs of that claim file; jobs sharing one carrier payment are paid in the order of the claim
    payment allocation rule of the Insurance Claim Services charter.
