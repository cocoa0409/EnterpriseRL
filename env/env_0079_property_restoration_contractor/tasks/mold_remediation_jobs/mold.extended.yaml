  - mold_job_close
  rule: The job must be in cleared status when the final invoice is issued. The final invoice amount is the total
    of every charge line on the job at invoicing, including any minimum_charge line, and the payment due date is
    the invoice date plus the self-pay or insurance payment terms by funding source, counted in calendar days. The
    job closes when its balance due is exactly zero after invoicing; a company_warranty job is invoiced at 0.00
    and closes on its invoice date.
  eligibility:
