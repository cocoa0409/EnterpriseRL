    factors:
      - id: co_price_basis
        effect: method
        decides: co_unit_price
        bindings: [up_kind, up_supplement, up_approved, up_upgrade_allowance, co_unit_price]
        ladder:
          - when: "a carrier-scope line (an insurance_scope change order on an insurance_claim contract naming a supplement the carrier approved)"
            method: "the supplement's approved amount divided by the quantity written (the carrier's approved unit price: adds the approval input and a division)"
          - when: "an owner_upgrade change order on a flooring, cabinet or fixture upgrade line"
            method: "the owner's selected unit price written on the proposal less the tier's selection allowance for the line (adds the allowance and a subtraction)"
          - when: "otherwise"
            method: "the tier's rate for the scope code, or the unit price written where the scope code has no tier rate"
        baseline:
          co_unit_price: "scope_rate"
        evidence: [history, cross_category, tier_param]
        cross_difficulty: claims
      - id: co_overhead_profit
        effect: parameter
        decides: markup_rate
        bindings: [mk_kind, mk_carrier_line, mk_trades, mk_min_trades, mk_op_pct, markup_rate]
        ladder:
          - when: "an insurance_scope or code_required change order on an insurance_claim contract AND the linked claim file's estimate carries at least the arrangement's minimum trades for overhead and profit"
            value: "the arrangement's overhead percentage plus its profit percentage"
          - when: "an insurance_scope or code_required change order on an insurance_claim contract AND the estimate carries fewer trades than that minimum"
            value: "0 (no markup)"
          - when: "otherwise"
            value: "P('change_order_markup_pct')"
        baseline:
          markup_rate: "P('change_order_markup_pct')"
        evidence: [history, cross_category]
        cross_difficulty: claims
      - id: co_wall_treatment
        effect: parameter
        decides: treat_rate
        bindings: [wt_scope, wt_wall_line, wt_water_category, wt_fire_job, wt_mold_job, treat_rate]
        ladder:
          - when: "a drywall or insulation line AND the preceding company job is a water job assessed category_3"
            value: "the water job tier's antimicrobial rate per square foot"
          - when: "a drywall or insulation line AND the preceding company job is a fire job"
            value: "the fire job tier's odor sealer rate per square foot"
          - when: "a drywall or insulation line AND the preceding company job is a mold job"
            value: "the mold job tier's encapsulation rate per square foot"
          - when: "otherwise"
            value: "0 (no wall-closing treatment)"
        baseline:
          treat_rate: "0"
        evidence: [history, cross_category]
        cross_difficulty: water
      - id: co_drying_verification
        effect: parameter
        decides: verification_item
        bindings: [dv_scope, dv_wall_line, dv_outcome, dv_class, dv_mapping_fee, dv_imaging_fee, verification_item]
        ladder:
          - when: "a drywall or insulation line AND the preceding water job's drying outcome is customer_release AND its class is class_3 or class_4"
            value: "the water job tier's moisture mapping fee plus its thermal imaging fee"
          - when: "a drywall or insulation line AND the preceding water job's drying outcome is customer_release AND its class is class_1 or class_2"
            value: "the water job tier's moisture mapping fee"
          - when: "otherwise"
            value: "0 (no verification item)"
        baseline:
          verification_item: "0"
        evidence: [history, cross_category]
        cross_difficulty: water
      - id: co_lead_safe_work
        effect: parameter
        decides: lead_safe_item
        bindings: [ls_scope, ls_qty, ls_housing, ls_year, ls_setup_lines, lead_safe_item]
        ladder:
          - when: "a drywall or baseboard line (removal of painted components) on single_family, condo_unit or multifamily_unit housing built before the tier's RRP year-built cutoff AND the contract carries a lead_safe_setup charge line"
            value: "K('lead_safe_cleaning_verification_fee'), whatever the area (removal is never minor repair under the RRP)"
          - when: "a paint line (surface preparation) on such housing AND the contract carries a lead_safe_setup charge line"
            value: "K('lead_safe_cleaning_verification_fee') when the quantity written exceeds the RRP interior minor-repair area, otherwise 0"
          - when: "otherwise, including any line on a contract with no lead_safe_setup charge line"
            value: "0 (no lead-safe item)"
        baseline:
          lead_safe_item: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: co_framing_cleaning
        effect: parameter
        decides: clean_rate
        bindings: [cn_scope, cn_wall_line, cn_water_category, cn_fire_job, cn_mold_job, clean_rate]
        ladder:
          - when: "a drywall or insulation line AND the preceding company job is a water job assessed category_3"
            value: "the water job tier's HEPA vacuuming rate per square foot"
          - when: "a drywall or insulation line AND the preceding company job is a fire job"
            value: "the fire job tier's wet cleaning rate per square foot"
          - when: "a drywall or insulation line AND the preceding company job is a mold job"
            value: "the mold job tier's HEPA vacuuming rate per square foot"
          - when: "otherwise"
            value: "0 (no cleaning)"
        baseline:
          clean_rate: "0"
        evidence: [cross_category, history]
        cross_difficulty: water
    baseline:
      rule: >-
        The change order line is priced at the billed quantity times the change order unit price. The billed quantity is the quantity written on the proposal. The change order unit price is the tier's rate for the scope code, or, for a scope code that has no tier rate (an upgrade or escalation line), the unit price written on the proposal. The change order markup rate is the tier's change order markup percentage. The change order amount is put together in this order: first the billed quantity times the unit price gives the change order line; any treatment or cleaning charged on the quantity written on the proposal is added to that line; the change order markup rate is applied once to that sum; any fixed item the change order carries is then added without markup; and only the final total is rounded to the cent, half up.
      params: [change_order_markup_pct, drywall_rate_per_sqft, paint_rate_per_sqft, insulation_rate_per_sqft, baseboard_install_rate_per_lf, carpet_install_rate_per_sqft, lvp_install_rate_per_sqft, tile_install_rate_per_sqft, cabinet_install_rate_per_lf, carpenter_hourly_rate, painter_hourly_rate, dumpster_fee, final_cleaning_fee]
    inputs:
      history:
        - {table: rebuild_change_orders, aggregate: latest, field: quantity, filters: {co_status: pending_signature}}
        - {table: rebuild_charges, aggregate: count, field: rebuild_charge_id, filters: {charge_code: lead_safe_setup}}
        - {category: claims, table: claims_approvals, aggregate: sum, field: amount, filters: {event_type: claims_scope_approval}}
      cross_category: [claims, water, fire, mold]
  - id: rebuild_ext_final_draw
    base_policy_refs: [rebuild_draws]
    overwrite:
      - base_policy: rebuild_draws
        superseded_clause: >-
          A draw requests the milestone's percentage of the current contract sum, which is the contract amount plus signed additive change orders less signed deductive change orders as of the request date; the contract_signing draw is also capped at the tier's deposit maximum.
        replaced_by: >-
          For the substantial_completion draw, and only for that draw, the requested amount is worked out as this paragraph states; every other draw requests the milestone's percentage of the current contract sum, which is the contract amount plus signed additive change orders less signed deductive change orders as of the request date, and the contract_signing draw is also capped at the tier's deposit maximum, as the base draw rule states.
      - base_policy: rebuild_draws
        superseded_clause: >-
          Because each draw is a percentage of the contract sum current at its own request, the substantial_completion draw requests whatever remains of the current contract sum after every earlier draw before retainage, so that the draws together equal the current contract sum.
        replaced_by: >-
          The final draw's remainder is the current contract sum less the earlier draws counted before retainage, so that the earlier draws and the remainder together equal the current contract sum; every amount the final draw holds back is requested as the contract's retainage_release draw, the tier's retainage once the tier's retainage release days have passed after substantial completion and every other held amount once it is released.
      - base_policy: rebuild_draws
        superseded_clause: >-
          On tiers with retainage, each draw withholds the retainage percentage, and the withheld total is requested as the retainage_release draw once the tier's retainage release days have passed after substantial completion.
        replaced_by: >-
          On tiers with retainage every draw before the final one withholds the retainage percentage as the base draw rule states, and that withheld total is requested as the retainage_release draw once the tier's retainage release days have passed after substantial completion, together with the final retainage and every other amount the final draw holds back once each is released; the retainage withheld from earlier draws is requested there and only there.
    trigger: on_request
    subject: [rebuild_draw_request]
    computes: requested_amount
    target_tool: request_final_draw_345d01eb
    params:
      texas_owner_retention_pct: 10
      texas_retention_days: 30
    rule: >-
      For the substantial_completion draw, and only for that draw, the requested amount is worked out as this paragraph states; every other draw requests the milestone's percentage of the current contract sum, which is the contract amount plus signed additive change orders less signed deductive change orders as of the request date, and the contract_signing draw is also capped at the tier's deposit maximum, as the base draw rule states.
      The final draw's requested amount is fixed only after no change order proposal other than a deductive one stands on the contract awaiting the customer's signature; a proposal whose amount worked out under the change order signature rule falls below the tier's change order minimum is not counted, because it cannot be written.
      The current contract sum is the contract amount plus the amount of every signed change order other than a deductive one, less the amount of every signed deductive change order, as the records stand on the request date. The earlier draws are every draw already requested on the contract; their requested amounts are after any retainage withheld, so each is counted before retainage, that is its requested amount divided by one less the tier's retainage percentage.
      The final draw's remainder is the current contract sum less the earlier draws counted before retainage, so that the earlier draws and the remainder together equal the current contract sum; every amount the final draw holds back is requested as the contract's retainage_release draw, the tier's retainage once the tier's retainage release days have passed after substantial completion and every other held amount once it is released.
      On tiers with retainage every draw before the final one withholds the retainage percentage as the base draw rule states, and that withheld total is requested as the retainage_release draw once the tier's retainage release days have passed after substantial completion, together with the final retainage and every other amount the final draw holds back once each is released; the retainage withheld from earlier draws is requested there and only there.
      The final draw requests the current contract sum less the earlier draws counted before retainage, which is its remainder, less the final retainage, which on a tier with retainage is the tier's retainage percentage of that remainder, rounded to the cent, half up.
      The final draw's amount is put together in this order: first the remainder; then every amount the final draw also bills is added; then the final retainage and every amount held back are subtracted; a result below zero counts as zero; and only that result is rounded to the cent, half up.
      A final draw that works out to less than half a cent is not requested, and every amount it holds back is requested as the retainage_release draw as stated above.
      The final retainage follows the law of the property's state. For a property whose loss address is in Texas, the owner retains part of the contract price until the Texas statutory retention days after the work is completed (Texas Property Code, Chapter 53); the company's rules take that retention as the Texas owner retention percentage of the contract price. The owner holds it back itself from its own payments of the customer-funded draws, as the draw payment rules state, so the final draw holds it back only on the share of the current contract sum that the customer does not fund, which is the current contract sum less the earlier customer-funded draws counted before retainage, and only when the final draw is carrier-funded. So, on a carrier-funded final draw whose request falls no later than the Texas statutory retention days after the substantial completion date, the final retainage is the Texas owner retention percentage of that share on a tier that withholds no retainage, and, on a tier that withholds retainage, the greater of two amounts: that amount after the retainage withheld from the earlier draws that are not customer-funded is subtracted from it, or the tier's retainage percentage of the remainder; for every other final draw the final retainage is the tier's retainage percentage of the remainder.
      A final draw is carrier-funded when its funding route, set by the base draw rule from the linked claim file, is not the customer: the claim file has a dwelling payment the carrier issued to the company directly (contractor_direct), by a check naming the insured and the company (insured_two_party), or into the mortgagee's loss-draft account (mortgagee_loss_draft); on any other final draw no code, deductible, depreciation or owner-item amount is held, because the customer funds the draw.
      The code-item hold keeps out the owner's share of the code items the building official requires, which the carrier's ordinance or law coverage pays, once they are completed and incurred, only up to its limit: on a carrier-funded final draw, when the contract carries signed code_required change orders whose total exceeds the linked claim file's ordinance or law limit and that limit is above zero, the part of their total above the limit is held; when the claim file carries no ordinance or law coverage, a limit of zero or none recorded, the whole of their total is held; otherwise no code amount is held, because the work is complete at the final draw and the coverage pays the code items in full.
      The deductible hold keeps out the insured's deductible, which the carrier never pays: on a carrier-funded final draw, when the claim arrangement has the company collect the deductible and deductible is due on the claim file, the deductible due is held; when the claim arrangement does not have the company collect the deductible, the claim file's whole deductible amount is held, because the carrier paid net of it; otherwise no deductible is held.
      The owner-item hold keeps out the owner's own items: on a carrier-funded final draw, when the claim arrangement bills carrier-denied amounts to the customer, it is the amounts written off on the claim file as carrier_denied_line plus the amounts of the signed owner_upgrade change orders; when the claim arrangement does not bill carrier-denied amounts to the customer, it is the amounts of the signed owner_upgrade change orders; otherwise there is no owner-item hold.
      The depreciation hold keeps out the recoverable depreciation the carrier has not paid, which it releases only once the work is shown complete by the final invoice and the completion date: on a carrier-funded final draw, when the claim arrangement bills carrier-denied amounts to the customer, it is the dwelling depreciation withheld on the claim file's approvals less the dwelling depreciation the carrier has released, never below zero, the part written off as depreciation_forfeited being the customer's; when the claim arrangement does not bill carrier-denied amounts to the customer, it is that withheld depreciation less the depreciation released and less the amounts written off as depreciation_forfeited, never below zero; otherwise there is no depreciation hold.
      The pass-through charges are the charge lines booked outside the current contract sum that the final draw bills: on a carrier-funded final draw of an insurance_claim contract, the permit_fee, permit_expediting, plan_drawing, engineering_letter, lead_safe_setup and project_management lines; on a self_pay contract, every charge line other than the contract_sum, change_order, overdue_draw_charge and remobilization lines, which a draw payment carries; on any other contract no charge line is added, and those lines are billed on the final invoice.
    prerequisite:
      - problem: rebuild_ext_change_order_signature
        kind: value_input
        gate: current_sum
        form: state
        policy_source: >-
          The final draw's requested amount is fixed only after no change order proposal other than a deductive one stands on the contract awaiting the customer's signature; a proposal whose amount worked out under the change order signature rule falls below the tier's change order minimum is not counted, because it cannot be written.
        condition: >-
          No rebuild_change_orders row of the contract whose co_type is other than deductive carries co_status pending_signature at the moment the final draw is requested, other than one whose amount worked out under the change order signature rule falls below the tier's change order minimum.
        resolved_by: sign_change_order_7ffbf290
        effect: >-
          Once the additive proposal awaiting signature is signed, its amount enters the signed change order total, which raises the current contract sum and the remainder, and with them the Texas final retainage and, for a code_required item, the code-item hold.
    cross_category:
      - category: claims
        as: history
        reads: [ordinance_law_limit, deductible_due, deductible_amount, variant_name, claims_approvals.amount, claims_approvals.depreciation_withheld, claims_payments.payee_route, claims_payments.amount]
        note: The carrier-funded test, the code-item hold, the deductible hold, the owner-item hold, the depreciation hold and the pass-through tier read the claim file, its arrangement, its approvals, write-offs and payments.
    compute:
      - cs_signed_all: "SUM('rebuild_change_orders', 'amount', co_status='signed')"
      - cs_signed_deductive: "SUM('rebuild_change_orders', 'amount', co_status='signed', co_type='deductive')"
      - current_sum: "F('contract_amount') + cs_signed_all - 2 * cs_signed_deductive"
      - earlier_requested: "SUM('rebuild_draws', 'requested_amount')"
      - earlier_before_retainage: "earlier_requested * 100 / (100 - P('retainage_pct'))"
      - remainder: "current_sum - earlier_before_retainage"
      - carrier_funded: "XCOUNT('claims', 'claims_payments', claim_file_id=F('claim_file_id'), coverage_part='dwelling', payee_route='contractor_direct') + XCOUNT('claims', 'claims_payments', claim_file_id=F('claim_file_id'), coverage_part='dwelling', payee_route='insured_two_party') + XCOUNT('claims', 'claims_payments', claim_file_id=F('claim_file_id'), coverage_part='dwelling', payee_route='mortgagee_loss_draft') > 0"
      - rt_days_since_completion: "DAYS(F('substantial_completion_date'), NOW) if F('substantial_completion_date') != None else K('texas_retention_days') + 1"
      - rt_texas: "', TX ' in F('loss_address')"
      - rt_customer_requested: "SUM('rebuild_draws', 'requested_amount', funding_route='customer')"
      - rt_customer_share_out: "rt_customer_requested * 100 / (100 - P('retainage_pct'))"
      - rt_other_retainage: "(earlier_before_retainage - earlier_requested) - (rt_customer_share_out - rt_customer_requested)"
      - final_retainage: "K('texas_owner_retention_pct') / 100 * (current_sum - rt_customer_share_out) if (carrier_funded and rt_texas and rt_days_since_completion <= K('texas_retention_days') and P('retainage_pct') == 0) else (MX(K('texas_owner_retention_pct') / 100 * (current_sum - rt_customer_share_out) - rt_other_retainage, P('retainage_pct') / 100 * remainder) if (carrier_funded and rt_texas and rt_days_since_completion <= K('texas_retention_days') and P('retainage_pct') > 0) else P('retainage_pct') / 100 * remainder)"
      - ch_code_total: "SUM('rebuild_change_orders', 'amount', co_status='signed', co_type='code_required')"
      - ch_ol_limit: "CFIELD('claims', 'ordinance_law_limit', claim_file_id=F('claim_file_id')) or 0"
      - code_item_hold: "ch_code_total - ch_ol_limit if (carrier_funded and ch_code_total > ch_ol_limit and ch_ol_limit > 0) else (ch_code_total if (carrier_funded and ch_code_total > 0 and ch_ol_limit <= 0) else 0)"
      - dd_collects: "CPARAM('claims', 'deductible_collected_by_company', claim_file_id=F('claim_file_id'))"
      - dd_due: "CFIELD('claims', 'deductible_due', claim_file_id=F('claim_file_id')) or 0"
      - dd_amount: "CFIELD('claims', 'deductible_amount', claim_file_id=F('claim_file_id')) or 0"
      - deductible_hold: "dd_due if (carrier_funded and dd_collects == True and dd_due > 0) else (dd_amount if (carrier_funded and dd_collects == False) else 0)"
      - oi_billable: "CPARAM('claims', 'denied_line_billable_to_customer', claim_file_id=F('claim_file_id'))"
      - oi_writeoffs: "XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_receivable_writeoff', writeoff_reason='carrier_denied_line')"
      - oi_upgrades: "SUM('rebuild_change_orders', 'amount', co_status='signed', co_type='owner_upgrade')"
      - owner_item_hold: "oi_writeoffs + oi_upgrades if (carrier_funded and oi_billable == True) else (oi_upgrades if (carrier_funded and oi_billable != True) else 0)"
      - dp_billable: "CPARAM('claims', 'denied_line_billable_to_customer', claim_file_id=F('claim_file_id'))"
      - dp_withheld: "XSUM('claims', 'claims_approvals', 'depreciation_withheld', claim_file_id=F('claim_file_id'), event_type='claims_scope_approval', coverage_part='dwelling')"
      - dp_released: "XSUM('claims', 'claims_payments', 'amount', claim_file_id=F('claim_file_id'), payment_type='depreciation_release', coverage_part='dwelling')"
      - dp_forfeited: "XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_receivable_writeoff', writeoff_reason='depreciation_forfeited')"
      - depreciation_hold: "MX(0, dp_withheld - dp_released) if (carrier_funded and dp_billable == True) else (MX(0, dp_withheld - dp_released - dp_forfeited) if (carrier_funded and dp_billable != True) else 0)"
      - pt_carrier_lines: "SUM('rebuild_charges', 'amount', charge_code='permit_fee') + SUM('rebuild_charges', 'amount', charge_code='permit_expediting') + SUM('rebuild_charges', 'amount', charge_code='plan_drawing') + SUM('rebuild_charges', 'amount', charge_code='engineering_letter') + SUM('rebuild_charges', 'amount', charge_code='lead_safe_setup') + SUM('rebuild_charges', 'amount', charge_code='project_management')"
      - pt_all_outside: "SUM('rebuild_charges', 'amount') - SUM('rebuild_charges', 'amount', charge_code='contract_sum') - SUM('rebuild_charges', 'amount', charge_code='change_order') - SUM('rebuild_charges', 'amount', charge_code='overdue_draw_charge') - SUM('rebuild_charges', 'amount', charge_code='remobilization')"
      - pass_through: "pt_carrier_lines if (F('funding_source') == 'insurance_claim' and carrier_funded) else (pt_all_outside if F('funding_source') == 'self_pay' else 0)"
      - held_total: "final_retainage + code_item_hold + deductible_hold + owner_item_hold + depreciation_hold"
      - result: "RND(MX(0, remainder + pass_through - held_total) + 0.000000001, 2)"
