    factors:
      - id: fd_state_retainage
        effect: method
        decides: final_retainage
        bindings: [rt_days_since_completion, rt_texas, rt_customer_requested, rt_customer_share_out, rt_other_retainage, final_retainage]
        ladder:
          - when: "a carrier-funded final draw AND the loss address is in Texas AND the request falls no later than the Texas statutory retention days after substantial completion AND the tier withholds no retainage"
            method: "the Texas owner retention percentage of the difference between the current contract sum and the earlier customer-funded draws counted before retainage"
          - when: "a carrier-funded final draw AND the loss address is in Texas AND the request falls no later than the Texas statutory retention days after substantial completion AND the tier withholds retainage"
            method: "the greater of two amounts: that Texas amount after the retainage withheld from the earlier draws that are not customer-funded is subtracted from it, or the tier's retainage percentage of the remainder"
          - when: "otherwise"
            method: "the tier's retainage percentage of the remainder"
        baseline:
          final_retainage: "P('retainage_pct') / 100 * remainder"
        evidence: [date, history, tier_param]
        cross_difficulty: null
      - id: fd_code_item_hold
        effect: parameter
        decides: code_item_hold
        bindings: [ch_code_total, ch_ol_limit, code_item_hold]
        ladder:
          - when: "carrier-funded AND signed code_required change orders whose total exceeds an ordinance or law limit above zero"
            value: "the part of the code total above the ordinance or law limit"
          - when: "carrier-funded AND signed code_required change orders AND no ordinance or law coverage (a limit of zero or none recorded)"
            value: "the whole code total"
          - when: "otherwise"
            value: "0"
        baseline:
