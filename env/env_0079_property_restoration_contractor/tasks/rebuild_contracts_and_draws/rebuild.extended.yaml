        bindings: [pt_carrier_lines, pt_all_outside, pass_through]
        ladder:
          - when: "a carrier-funded final draw of an insurance_claim contract"
            value: "the permit_fee, permit_expediting, plan_drawing, engineering_letter, lead_safe_setup and project_management lines"
          - when: "a self_pay contract"
            value: "every charge line other than the contract_sum, change_order, overdue_draw_charge and remobilization lines"
          - when: "otherwise"
            value: "0"
        baseline:
          pass_through: "0"
        evidence: [history, cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The current contract sum is the contract amount plus the amount of every signed change order other than a deductive one, less the amount of every signed deductive change order, as the records stand on the request date. The earlier draws are every draw already requested on the contract; their requested amounts are after any retainage withheld, so each is counted before retainage, that is its requested amount divided by one less the tier's retainage percentage. The final draw requests the current contract sum less the earlier draws counted before retainage, which is its remainder, less the final retainage, which on a tier with retainage is the tier's retainage percentage of that remainder, rounded to the cent, half up.
      params: [retainage_pct]
    inputs:
      history:
        - {table: rebuild_change_orders, aggregate: sum, field: amount, filters: {co_status: signed}}
        - {table: rebuild_draws, aggregate: sum, field: requested_amount, filters: {}}
        - {table: rebuild_charges, aggregate: sum, field: amount, filters: {charge_code: permit_fee}}
        - {category: claims, table: claims_approvals, aggregate: sum, field: amount, filters: {event_type: claims_receivable_writeoff}}
        - {category: claims, table: claims_approvals, aggregate: sum, field: depreciation_withheld, filters: {event_type: claims_scope_approval}}
      cross_category: [claims]
  - id: rebuild_ext_deductive_signature
    base_policy_refs: [rebuild_change_orders]
    overwrite:
      - base_policy: rebuild_change_orders
        superseded_clause: >-
          A deductive change order is credited without markup.
        replaced_by: >-
          For a deductive change order that a customer signs on a contract carrying exactly one change order proposal awaiting signature, and only for such a change order, the credit is worked out as this paragraph states; an additive change order is priced at its signature under the additive change order signature rule, never under this paragraph; every deductive change order on a contract with more than one proposal awaiting signature is credited without markup at the base change order pricing of its line, install, finish and labor lines at the tier's rate times the quantity and flooring, cabinet and fixture upgrade lines at the owner's selected unit price less the tier's selection allowance, times the quantity, as the base change order rule states.
    trigger: on_request
    subject: [rebuild_change_order_credit]
    computes: amount
    target_tool: sign_deductive_change_order_5bfd6b95
    params:
      field_remeasure_deduction: 95.0
      plan_update_deduction: 45.0
    rule: >-
      For a deductive change order that a customer signs on a contract carrying exactly one change order proposal awaiting signature, and only for such a change order, the credit is worked out as this paragraph states; an additive change order is priced at its signature under the additive change order signature rule, never under this paragraph; every deductive change order on a contract with more than one proposal awaiting signature is credited without markup at the base change order pricing of its line, install, finish and labor lines at the tier's rate times the quantity and flooring, cabinet and fixture upgrade lines at the owner's selected unit price less the tier's selection allowance, times the quantity, as the base change order rule states.
      The signature is the customer's own act: the customer signs the deductive proposal awaiting signature, and the signature records the credit worked out here, on the records as they stand on the signing date, as the signed change order's amount and books it as one change order credit line naming that change order; the figure written on the proposal when it was drafted is not the credit.
      The removed line is read from the deductive proposal awaiting signature: its scope code, the quantity written on it and the unit price written on it.
      The change-order part of the removal is as much of the quantity written on the deductive proposal as remains of what the signed change orders of that scope code other than deductive ones added once the quantity signed deductive change orders of that scope code already removed is taken off it; the rest of the quantity written is the contract part, which comes off the contract's own scope. The removed line is credited at the change-order part times the credit unit price, without markup, and the contract part is credited at the credit unit price with nothing returned on it, because no change order charged anything on it. The credit unit price is the tier's rate for the scope code, or, for a scope code that has no tier rate, the unit price written on the proposal. The credit is put together in this order: first the removed line; any treatment or cleaning returned on the change-order part is added to it; any overhead and profit returned is applied once to that sum; the contract part's credit is then added; any fixed deduction the removal carries is then subtracted; a result below zero is credited as zero; and only that result is rounded to the cent, half up.
      A deductive change order whose credit worked out here is nothing is not written, because a change order and its credit line carry a positive amount.
      The removed line follows who priced the removed work: on an insurance_claim contract where the signed insurance_scope change order of the removed scope code with the highest change order number names a supplement the carrier approved, as much of the change-order part as the signed insurance_scope change orders of that scope code added is credited at the carrier's approved unit price taken from that change order, which is the amount the carrier approved on the supplement it names divided by the quantity written on it, and the rest of the change-order part at the tier's rate for the scope code, or, for a scope code that has no tier rate, the unit price written on the proposal; for a flooring_upgrade, cabinet_upgrade or fixture_upgrade line, the change-order part is credited at the owner's selected unit price written on the proposal less the tier's selection allowance for that line; for every other line, the change-order part is credited at the tier's rate for the scope code, or, for a scope code that has no tier rate, the unit price written on the proposal.
      The overhead and profit returned on the change-order part mirrors the markup charged when that scope was added: where the removed scope code was added on an insurance_claim contract by a signed insurance_scope or code_required change order and the linked claim file's estimate carries at least the claim arrangement's minimum number of trades for overhead and profit, the arrangement's overhead percentage plus its profit percentage is returned; where it was added by no such change order but by a signed additive change order of another kind, or by a signed insurance_scope or code_required change order on a contract that is not an insurance_claim contract, the tier's change order markup percentage is returned, because that markup was charged when the scope was added; otherwise nothing is returned.
      A drywall or insulation removal returns the wall-closing treatment priced with that scope, at the treatment rate times the change-order part: where the company mitigation job that preceded the rebuild is a water job assessed category_3, the water job tier's antimicrobial rate per square foot; where it is a fire job, the fire job tier's odor sealer rate per square foot; where it is a mold job, the mold job tier's encapsulation rate per square foot; otherwise no treatment is returned.
      A drywall or insulation removal returns the framing cleaning priced with that scope, at the cleaning rate times the change-order part: where the company mitigation job that preceded the rebuild is a water job assessed category_3, the water job tier's HEPA vacuuming rate per square foot; where it is a fire job, the fire job tier's wet cleaning rate per square foot; where it is a mold job, the mold job tier's HEPA vacuuming rate per square foot; otherwise no cleaning is returned.
      A removal after the work has been planned carries the company's change processing deduction: when construction on the contract has started, the field-remeasure deduction; when the permit has cleared but construction has not started, the plan-update deduction; before the permit clears there is no processing deduction.
    prerequisite: []
    cross_category:
      - category: claims
        as: branch
        reads: [estimate_trade_count, variant_name, claims_approvals.amount]
        note: The unit-price tier reads the approved amount of the supplement the deductive proposal names; the overhead-and-profit tier reads the trade count against the arrangement minimum.
      - category: water
        as: branch
        reads: [water_category, variant_name]
        note: The treatment-return tier reads the preceding water job's category and its tier's antimicrobial rate.
      - category: fire
        as: existence
        reads: [variant_name]
        note: The treatment-return tier reads whether the preceding job is a fire job and its odor sealer rate.
      - category: mold
        as: existence
        reads: [variant_name]
        note: The treatment-return tier reads whether the preceding job is a mold job and its encapsulation rate.
    compute:
      - dc_qty: "LATEST('rebuild_change_orders', 'quantity', date_field='created_at', co_status='pending_signature', co_type='deductive')"
      - dc_scope: "LATEST('rebuild_change_orders', 'scope_code', date_field='created_at', co_status='pending_signature', co_type='deductive')"
      - dc_written_price: "LATEST('rebuild_change_orders', 'unit_price', date_field='created_at', co_status='pending_signature', co_type='deductive')"
      - dc_tier_rate: "P('drywall_rate_per_sqft') if dc_scope == 'drywall' else (P('paint_rate_per_sqft') if dc_scope == 'paint' else (P('insulation_rate_per_sqft') if dc_scope == 'insulation' else (P('baseboard_install_rate_per_lf') if dc_scope == 'baseboard' else (P('carpet_install_rate_per_sqft') if dc_scope == 'carpet_install' else (P('lvp_install_rate_per_sqft') if dc_scope == 'lvp_install' else (P('tile_install_rate_per_sqft') if dc_scope == 'tile_install' else (P('cabinet_install_rate_per_lf') if dc_scope == 'cabinet_install' else (P('carpenter_hourly_rate') if dc_scope == 'carpenter_labor' else (P('painter_hourly_rate') if dc_scope == 'painter_labor' else (P('dumpster_fee') if dc_scope == 'dumpster' else (P('final_cleaning_fee') if dc_scope == 'final_cleaning' else dc_written_price)))))))))))"
      - ap_signed: "SUM('rebuild_change_orders', 'quantity', co_status='signed', scope_code=dc_scope)"
      - ap_deducted: "SUM('rebuild_change_orders', 'quantity', co_status='signed', scope_code=dc_scope, co_type='deductive')"
      - co_part: "MN(dc_qty, MX(0, ap_signed - 2 * ap_deducted))"
      - contract_part: "dc_qty - co_part"
      - cp_supplement: "LATEST('rebuild_change_orders', 'claim_request_id', date_field='co_number', co_status='signed', co_type='insurance_scope', scope_code=dc_scope)"
      - cp_approved: "XSUM('claims', 'claims_approvals', 'amount', claim_request_id=cp_supplement, event_type='claims_scope_approval') if cp_supplement != None else 0"
      - cp_billed_qty: "LATEST('rebuild_change_orders', 'quantity', date_field='co_number', co_status='signed', co_type='insurance_scope', scope_code=dc_scope) or 0"
      - cp_allowance: "P('flooring_allowance_per_sqft') if dc_scope == 'flooring_upgrade' else (P('cabinet_allowance_per_lf') if dc_scope == 'cabinet_upgrade' else P('fixture_allowance_per_each'))"
      - cp_added: "COUNT('rebuild_change_orders', co_status='signed', co_type='insurance_scope', scope_code=dc_scope)"
      - cp_carrier_qty: "SUM('rebuild_change_orders', 'quantity', co_status='signed', co_type='insurance_scope', scope_code=dc_scope)"
      - cp_rest_price: "dc_tier_rate"
      - removed_line: "MN(co_part, cp_carrier_qty) * cp_approved / cp_billed_qty + MX(0, co_part - cp_carrier_qty) * cp_rest_price if (F('funding_source') == 'insurance_claim' and cp_added > 0 and cp_approved > 0 and cp_billed_qty > 0) else (co_part * (dc_written_price - cp_allowance) if (dc_scope == 'flooring_upgrade' or dc_scope == 'cabinet_upgrade' or dc_scope == 'fixture_upgrade') else co_part * dc_tier_rate)"
      - or_trades: "CFIELD('claims', 'estimate_trade_count', claim_file_id=F('claim_file_id')) or 0"
      - or_min_trades: "CPARAM('claims', 'op_min_trades', claim_file_id=F('claim_file_id')) or 0"
      - or_op_pct: "(CPARAM('claims', 'overhead_pct', claim_file_id=F('claim_file_id')) or 0) + (CPARAM('claims', 'profit_pct', claim_file_id=F('claim_file_id')) or 0)"
      - or_scope: "LATEST('rebuild_change_orders', 'scope_code', date_field='created_at', co_status='pending_signature', co_type='deductive')"
      - or_carrier_added: "COUNT('rebuild_change_orders', co_status='signed', co_type='insurance_scope', scope_code=or_scope) + COUNT('rebuild_change_orders', co_status='signed', co_type='code_required', scope_code=or_scope)"
      - or_other_added: "COUNT('rebuild_change_orders', co_status='signed', co_type='owner_upgrade', scope_code=or_scope) + COUNT('rebuild_change_orders', co_status='signed', co_type='material_escalation', scope_code=or_scope)"
      - return_rate: "or_op_pct if (F('funding_source') == 'insurance_claim' and or_carrier_added > 0 and or_trades >= or_min_trades) else (P('change_order_markup_pct') if ((or_carrier_added == 0 and or_other_added > 0) or (or_carrier_added > 0 and F('funding_source') != 'insurance_claim')) else 0)"
      - tr_scope: "LATEST('rebuild_change_orders', 'scope_code', date_field='created_at', co_status='pending_signature', co_type='deductive')"
      - tr_wall_line: "tr_scope == 'drywall' or tr_scope == 'insulation'"
      - tr_water_category: "CFIELD('water', 'water_category', water_job_id=F('mitigation_job_id'))"
      - tr_fire_job: "EXISTS('fire', fire_job_id=F('mitigation_job_id'))"
      - tr_mold_job: "EXISTS('mold', mold_job_id=F('mitigation_job_id'))"
      - return_treat_rate: "(CPARAM('water', 'antimicrobial_rate_per_sqft', water_job_id=F('mitigation_job_id')) or 0) if (tr_wall_line and tr_water_category == 'category_3') else ((CPARAM('fire', 'odor_sealer_rate_per_sqft', fire_job_id=F('mitigation_job_id')) or 0) if (tr_wall_line and tr_fire_job) else ((CPARAM('mold', 'encapsulation_rate_per_sqft', mold_job_id=F('mitigation_job_id')) or 0) if (tr_wall_line and tr_mold_job) else 0))"
      - sf_started: "F('construction_start_date') != None and DAYS(F('construction_start_date'), NOW) >= 0"
      - sf_permit_cleared: "F('permit_cleared_date') != None and DAYS(F('permit_cleared_date'), NOW) >= 0"
      - stage_deduction: "K('field_remeasure_deduction') if (sf_started and sf_permit_cleared) else (K('plan_update_deduction') if (sf_permit_cleared and not sf_started) else 0)"
      - cl_scope: "LATEST('rebuild_change_orders', 'scope_code', date_field='created_at', co_status='pending_signature', co_type='deductive')"
      - cl_wall_line: "cl_scope == 'drywall' or cl_scope == 'insulation'"
      - cl_water_category: "CFIELD('water', 'water_category', water_job_id=F('mitigation_job_id'))"
      - cl_fire_job: "EXISTS('fire', fire_job_id=F('mitigation_job_id'))"
      - cl_mold_job: "EXISTS('mold', mold_job_id=F('mitigation_job_id'))"
      - return_clean_rate: "(CPARAM('water', 'hepa_vacuum_rate_per_sqft', water_job_id=F('mitigation_job_id')) or 0) if (cl_wall_line and cl_water_category == 'category_3') else ((CPARAM('fire', 'wet_clean_rate_per_sqft', fire_job_id=F('mitigation_job_id')) or 0) if (cl_wall_line and cl_fire_job) else ((CPARAM('mold', 'hepa_vacuum_rate_per_sqft', mold_job_id=F('mitigation_job_id')) or 0) if (cl_wall_line and cl_mold_job) else 0))"
      - returned_treatment: "return_treat_rate * co_part"
      - returned_cleaning: "return_clean_rate * co_part"
      - contract_line: "contract_part * dc_tier_rate"
      - result: "RND(MX(0, (removed_line + returned_treatment + returned_cleaning) * (1 + return_rate / 100) + contract_line - stage_deduction) + 0.000000001, 2)"
