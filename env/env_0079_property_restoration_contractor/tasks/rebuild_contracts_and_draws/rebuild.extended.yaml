        superseded_clause: >-
          When a customer-funded draw stays unpaid for more than the tier's stop-work days after its due date, work is suspended; when the draw is paid in full, work resumes and the tier's remobilization fee is booked once for that resumption.
        replaced_by: >-
          When a customer-funded draw stays unpaid for more than the tier's stop-work days after its due date, work is suspended, a Texas customer-funded draw that has everything but its statutory retention paid not being unpaid until the Texas statutory retention days after the substantial completion date have passed. For a draw paid by the payment this paragraph prices, the draw counts as paid in full once that payment is posted, or at once when the payment works out to less than half a cent and none is taken, because the amounts it leaves unpaid (the statutory retention, the change order credits applied to it and the part set aside for carrier money the insured is waiting for) are not due; work then resumes, and the tier's remobilization fee, which that payment carries, is booked once for that resumption. For every other draw, when the draw is paid in full, which on a Texas property until the Texas statutory retention days after the substantial completion date have passed is once everything but its statutory retention is paid, work resumes and the tier's remobilization fee is booked once for that resumption.
    trigger: on_request
    subject: [rebuild_draw_payment]
    computes: amount
    target_tool: pay_past_due_draw_ec4ba96a
    params:
      texas_owner_retention_pct: 10
      texas_retention_days: 30
    rule: >-
      For the customer's payment toward the contract's most recently requested customer-funded draw, the one with the highest draw number among the customer-funded draws, once that draw is past due and every earlier customer-funded draw of the contract is paid in full, and only for that payment, the amount is worked out as this paragraph states, and the payment names that one draw and is posted in full to the contract; every other payment names the one draw it pays and is posted in full to the contract, as the base payment rule states.
      On a Texas property, until the Texas statutory retention days after the substantial completion date have passed, a customer-funded draw is paid in full when all of it but the statutory retention has been paid; its statutory retention is the Texas owner retention percentage of its requested amount, on a tier that withholds retainage the part of that percentage above the tier's retainage percentage.
      When a customer-funded draw stays unpaid for more than the tier's stop-work days after its due date, work is suspended, a Texas customer-funded draw that has everything but its statutory retention paid not being unpaid until the Texas statutory retention days after the substantial completion date have passed. For a draw paid by the payment this paragraph prices, the draw counts as paid in full once that payment is posted, or at once when the payment works out to less than half a cent and none is taken, because the amounts it leaves unpaid (the statutory retention, the change order credits applied to it and the part set aside for carrier money the insured is waiting for) are not due; work then resumes, and the tier's remobilization fee, which that payment carries, is booked once for that resumption. For every other draw, when the draw is paid in full, which on a Texas property until the Texas statutory retention days after the substantial completion date have passed is once everything but its statutory retention is paid, work resumes and the tier's remobilization fee is booked once for that resumption.
      The payment is the customer's own act: the customer pays through the company's secure payment channel by debit card, ACH, check or wire, and staff never take card or account numbers.
      The amount of a payment that brings a past-due draw current is worked out only after the records carry the overdue draw charge owed on that draw for each calendar month fee period that is owed; a fee period owes no overdue draw charge, and no charge is recorded for it, when the charge worked out for it comes to less than half a cent.
      The past-due payment is fixed only after no deductive change order proposal remains on the contract awaiting the customer's signature; a deductive proposal whose credit worked out under the deductive change order signature rule is nothing is not counted, because it cannot be written.
      Counting back one month from the payment date, a date is within the past month when it falls after the same day of the month in the previous calendar month and on or before the payment date; when the previous calendar month has no such day, every date in that previous month is outside the past month. Days between two dates are counted as calendar days from the earlier date to the later one, the earlier day not counted.
      The payment toward a past-due draw is the draw's unpaid amount, its requested amount less every payment posted toward it, rounded to the cent, half up.
      The payment is put together in this order: first the draw's unpaid amount; then every amount the payment also carries is added; then every amount applied, retained or set aside against it is subtracted; a result below zero counts as zero; and only that result is rounded to the cent, half up.
      A payment that works out to less than half a cent is not taken: no payment is posted, and the draw counts as paid in full at once, because nothing on it is due.
      The overdue draw charges the payment carries follow the contract's work status: while work on the contract is suspended, that is when a suspension date is recorded with no resumption dated on or after it, the payment carries every overdue draw charge posted on the paid draw, which only this payment carries, because a draw it brings current is paid by no other payment of this kind; when work is not suspended and overdue draw charges were posted on the paid draw within the past month, it carries those charges, the earlier ones staying on the contract for the final invoice; otherwise it carries none.
      Change order credits are applied to the payment of the oldest unpaid customer-funded draw, which the paid draw is: when change order credit lines were posted on the contract within the past month and their total is below the draw's unpaid amount, their total is subtracted; when their total is at or above the draw's unpaid amount, only the draw's unpaid amount is subtracted and the rest stays on the contract; otherwise nothing is subtracted.
      The owner's statutory retention is held back from the payment. For a property whose loss address is in Texas, the owner retains part of the contract price until the Texas statutory retention days after the work is completed (Texas Property Code, Chapter 53); the company's rules take that retention as the Texas owner retention percentage of the contract price, which the owner holds back itself from its own payments of the customer-funded draws, while the final draw holds it back on the share of the contract the customer does not fund. So for a Texas property, until the Texas statutory retention days after the substantial completion date have passed, on a tier that withholds no retainage, the Texas owner retention percentage of the draw's requested amount is held back, and on a tier that withholds retainage, the part of the Texas owner retention percentage above the tier's retainage percentage, of the draw's requested amount; for every other property nothing is held back.
      The remobilization the payment carries follows the suspension: while work on the contract is suspended with no resumption dated on or after the suspension, the payment carries the tier's remobilization fee, booked when work resumes; when work resumed within the past month after a suspension without any draw payment posted on the contract on or after the suspension date, so that no payment carried its fee, and the remobilization line for that resumption is booked, the payment carries that line; otherwise it carries no remobilization.
      The part set aside for carrier money the insured is waiting for follows the base overdue rule, which carries nothing on carrier-funded draws while their funds are pending; the supplement money pending is the dwelling supplement approvals not yet matched by dwelling supplement payments, or, when there is no such unpaid approval and the dwelling supplement request with the highest supplement number has no supplement approval naming it, that request's requested amount (when an earlier dwelling supplement request still has no supplement approval naming it, the carrier has decided the supplements out of order and the payment is handed to a human representative as not covered by policy): when the claim arrangement has the carrier release recoverable depreciation only once the work is shown complete and the contract has no substantial completion date yet, the dwelling depreciation withheld on the linked claim file's approvals less the dwelling depreciation released and less the amounts written off as depreciation_forfeited, that difference taken as never below zero, with the supplement money pending then added to it, is set aside; when the contract has a substantial completion date and the latest depreciation release request on the claim file, of two on that date the one with the larger requested amount, has no depreciation release payment received on or after its request date, that request's requested amount plus the supplement money pending is set aside; otherwise, when supplement money is pending, it is set aside; otherwise nothing is set aside.
    prerequisite:
      - problem: rebuild_ext_overdue_draw_charge
        kind: value_input
        gate: overdue_carried
        form: state
        policy_source: >-
          The amount of a payment that brings a past-due draw current is worked out only after the records carry the overdue draw charge owed on that draw for each calendar month fee period that is owed; a fee period owes no overdue draw charge, and no charge is recorded for it, when the charge worked out for it comes to less than half a cent.
        condition: >-
          For each calendar month that has begun from the month containing the paid draw's first possible charge day onward, a rebuild_charges row with charge_code overdue_draw_charge, the paid draw's rebuild_draw_id and that month as fee_period exists at the moment the payment is made, unless that month owes no overdue draw charge because the charge worked out for it comes to less than half a cent.
        resolved_by: post_overdue_draw_charge_f6859441
        effect: >-
          Once the owed overdue draw charge is posted on the paid draw, it is among the overdue draw charges the payment carries, raising the payment by the charge.
      - problem: rebuild_ext_deductive_signature
        kind: value_input
        gate: credit_applied
        form: state
        policy_source: >-
          The past-due payment is fixed only after no deductive change order proposal remains on the contract awaiting the customer's signature; a deductive proposal whose credit worked out under the deductive change order signature rule is nothing is not counted, because it cannot be written.
        condition: >-
          No rebuild_change_orders row of the contract with co_type deductive carries co_status pending_signature at the moment the payment is made, other than one whose credit worked out under the deductive change order signature rule is nothing.
        resolved_by: sign_deductive_change_order_5bfd6b95
        effect: >-
          Once the deductive proposal is signed, its credit line is posted on the signing date, inside the past month, and is applied to the payment, lowering it by the credit.
    cross_category:
      - category: claims
        as: history
        reads: [variant_name, claims_approvals.depreciation_withheld, claims_approvals.amount, claims_payments.amount, claims_payments.payment_type, claims_payments.received_date, claims_requests.requested_amount, claims_requests.request_date]
        note: The carrier-money tier reads the claim arrangement's release practice, withheld depreciation, releases, forfeiture write-offs, the latest depreciation release request, supplement approvals, supplement payments and supplement requests.
    compute:
      - pd_draw_id: "LATEST('rebuild_draws', 'rebuild_draw_id', date_field='draw_number', funding_route='customer')"
      - pd_requested: "LATEST('rebuild_draws', 'requested_amount', date_field='draw_number', funding_route='customer')"
      - pd_unpaid: "pd_requested - SUM('rebuild_payments', 'amount', rebuild_draw_id=pd_draw_id)"
      - oc_on_draw: "SUM('rebuild_charges', 'amount', charge_code='overdue_draw_charge', rebuild_draw_id=pd_draw_id)"
      - oc_recent_on_draw: "SUM('rebuild_charges', 'amount', within_months=1, date_field='posted_date', charge_code='overdue_draw_charge', rebuild_draw_id=pd_draw_id)"
      - oc_suspended: "F('work_suspended_date') != None and (F('work_resumed_date') == None or F('work_resumed_date') < F('work_suspended_date'))"
      - overdue_carried: "oc_on_draw if (oc_suspended and oc_on_draw > 0) else (oc_recent_on_draw if ((not oc_suspended) and oc_recent_on_draw > 0) else 0)"
      - ca_recent_credits: "SUM('rebuild_payments', 'amount', within_months=1, date_field='posted_date', event_type='rebuild_change_order_credit')"
      - credit_applied: "ca_recent_credits if (ca_recent_credits > 0 and ca_recent_credits < pd_unpaid) else (pd_unpaid if (ca_recent_credits > 0 and ca_recent_credits >= pd_unpaid) else 0)"
      - rh_texas: "', TX ' in F('loss_address')"
      - rh_requested: "LATEST('rebuild_draws', 'requested_amount', date_field='draw_number', funding_route='customer')"
      - rh_in_period: "F('substantial_completion_date') == None or DAYS(F('substantial_completion_date'), NOW) <= K('texas_retention_days')"
      - retention_held: "K('texas_owner_retention_pct') / 100 * rh_requested if (rh_texas and rh_in_period and P('retainage_pct') == 0) else (MX(0, K('texas_owner_retention_pct') - P('retainage_pct')) / 100 * rh_requested if (rh_texas and rh_in_period and P('retainage_pct') > 0) else 0)"
      - rm_suspended: "F('work_suspended_date') != None and (F('work_resumed_date') == None or F('work_resumed_date') < F('work_suspended_date'))"
      - rm_recent_line: "SUM('rebuild_charges', 'amount', within_months=1, date_field='posted_date', charge_code='remobilization')"
      - rm_last_payment: "LATEST('rebuild_payments', 'posted_date', date_field='posted_date', event_type='rebuild_draw_payment')"
      - remobilization_carried: "P('remobilization_fee') if (rm_suspended and F('work_suspended_date') != None) else (rm_recent_line if ((not rm_suspended) and rm_recent_line > 0 and F('work_suspended_date') != None and (rm_last_payment == None or DAYS(F('work_suspended_date'), rm_last_payment) < 0)) else 0)"
      - sa_on_completion: "CPARAM('claims', 'depreciation_release_requires_completion', claim_file_id=F('claim_file_id'))"
      - sa_unreleased: "MX(0, XSUM('claims', 'claims_approvals', 'depreciation_withheld', claim_file_id=F('claim_file_id'), event_type='claims_scope_approval', coverage_part='dwelling') - XSUM('claims', 'claims_payments', 'amount', claim_file_id=F('claim_file_id'), payment_type='depreciation_release', coverage_part='dwelling') - XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_receivable_writeoff', writeoff_reason='depreciation_forfeited'))"
      - sa_request_date: "XLATEST('claims', 'claims_requests', 'request_date', date_field='request_date', claim_file_id=F('claim_file_id'), event_type='claims_depreciation_release_request')"
      - sa_request_amount: "XMAX('claims', 'claims_requests', 'requested_amount', claim_file_id=F('claim_file_id'), event_type='claims_depreciation_release_request', request_date=sa_request_date) if sa_request_date != None else 0"
      - sa_last_release: "XLATEST('claims', 'claims_payments', 'received_date', date_field='received_date', claim_file_id=F('claim_file_id'), payment_type='depreciation_release')"
      - sa_unpaid: "MX(0, XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_scope_approval', approval_type='supplement', coverage_part='dwelling') - XSUM('claims', 'claims_payments', 'amount', claim_file_id=F('claim_file_id'), payment_type='supplement', coverage_part='dwelling'))"
      - sa_last_id: "XLATEST('claims', 'claims_requests', 'claim_request_id', date_field='supplement_number', claim_file_id=F('claim_file_id'), event_type='claims_supplement_submit', coverage_part='dwelling')"
      - sa_open: "XCOUNT('claims', 'claims_approvals', claim_request_id=sa_last_id, event_type='claims_scope_approval') == 0 if sa_last_id != None else False"
      - sa_last_request: "XLATEST('claims', 'claims_requests', 'requested_amount', date_field='supplement_number', claim_file_id=F('claim_file_id'), event_type='claims_supplement_submit', coverage_part='dwelling') or 0"
      - sa_supplement: "sa_unpaid if sa_unpaid > 0 else (sa_last_request if sa_open else 0)"
      - pending_set_aside: "sa_unreleased + sa_supplement if (sa_on_completion == True and F('substantial_completion_date') == None) else (sa_request_amount + sa_supplement if (F('substantial_completion_date') != None and sa_request_date != None and (sa_last_release == None or DAYS(sa_request_date, sa_last_release) < 0)) else (sa_supplement if sa_supplement > 0 else 0))"
      - result: "RND(MX(0, pd_unpaid + overdue_carried + remobilization_carried - credit_applied - retention_held - pending_set_aside) + 0.000000001, 2)"
