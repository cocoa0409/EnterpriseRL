    factors:
      - id: dc_carrier_price
        effect: method
        decides: removed_line
        bindings: [cp_supplement, cp_approved, cp_billed_qty, cp_added, cp_allowance, cp_carrier_qty, cp_rest_price, removed_line]
        ladder:
          - when: "an insurance_claim contract AND the signed insurance_scope change order of the removed scope code with the highest change order number names an approved supplement"
            method: "the change-order part, up to the quantity the signed insurance_scope change orders of that scope code added, times the carrier unit price (that change order's approved amount divided by its written quantity), plus the rest of the change-order part times the tier's rate (or the written price where the scope code has no tier rate)"
          - when: "otherwise, a flooring_upgrade, cabinet_upgrade or fixture_upgrade line"
            method: "the change-order part times the difference between the owner's selected unit price written and the tier's selection allowance for that line"
          - when: "otherwise"
            method: "the change-order part times the tier's rate for the scope code, or, for a scope code that has no tier rate, the unit price written on the proposal"
        baseline:
          removed_line: "co_part * dc_tier_rate"
        evidence: [history, cross_category, tier_param]
        cross_difficulty: claims
      - id: dc_overhead_return
        effect: parameter
        decides: return_rate
        bindings: [or_trades, or_min_trades, or_op_pct, or_scope, or_carrier_added, or_other_added, return_rate]
        ladder:
          - when: "an insurance_claim contract AND the removed scope code was added by a signed insurance_scope or code_required change order AND the claim file's estimate carries at least the arrangement's minimum trades"
            value: "the arrangement's overhead percentage plus its profit percentage"
          - when: "the removed scope code was added by no insurance_scope or code_required change order but by another signed additive change order, OR by an insurance_scope or code_required change order on a contract that is not an insurance_claim contract"
            value: "P('change_order_markup_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          return_rate: "0"
        evidence: [history, cross_category]
        cross_difficulty: claims
      - id: dc_treatment_return
        effect: parameter
        decides: return_treat_rate
        bindings: [tr_scope, tr_wall_line, tr_water_category, tr_fire_job, tr_mold_job, return_treat_rate]
        ladder:
          - when: "a drywall or insulation removal AND the preceding company job is a water job assessed category_3"
            value: "the water job tier's antimicrobial rate per square foot"
          - when: "a drywall or insulation removal AND the preceding company job is a fire job"
            value: "the fire job tier's odor sealer rate per square foot"
          - when: "a drywall or insulation removal AND the preceding company job is a mold job"
            value: "the mold job tier's encapsulation rate per square foot"
          - when: "otherwise"
            value: "0"
        baseline:
          return_treat_rate: "0"
        evidence: [history, cross_category]
        cross_difficulty: water
      - id: dc_processing_deduction
        effect: parameter
        decides: stage_deduction
        bindings: [sf_started, sf_permit_cleared, stage_deduction]
        ladder:
          - when: "construction on the contract has started AND the permit has cleared"
            value: "K('field_remeasure_deduction')"
          - when: "the permit has cleared AND construction has not started"
            value: "K('plan_update_deduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          stage_deduction: "0"
        evidence: [date]
        cross_difficulty: null
      - id: dc_cleaning_return
        effect: parameter
        decides: return_clean_rate
        bindings: [cl_scope, cl_wall_line, cl_water_category, cl_fire_job, cl_mold_job, return_clean_rate]
        ladder:
          - when: "a drywall or insulation removal AND the preceding company job is a water job assessed category_3"
            value: "the water job tier's HEPA vacuuming rate per square foot"
          - when: "a drywall or insulation removal AND the preceding company job is a fire job"
            value: "the fire job tier's wet cleaning rate per square foot"
          - when: "a drywall or insulation removal AND the preceding company job is a mold job"
            value: "the mold job tier's HEPA vacuuming rate per square foot"
          - when: "otherwise"
            value: "0"
        baseline:
          return_clean_rate: "0"
        evidence: [cross_category, history]
        cross_difficulty: water
    baseline:
      rule: >-
        The change-order part of the removal is as much of the quantity written on the deductive proposal as remains of what the signed change orders of that scope code other than deductive ones added once the quantity signed deductive change orders of that scope code already removed is taken off it; the rest of the quantity written is the contract part, which comes off the contract's own scope. The removed line is credited at the change-order part times the credit unit price, without markup, and the contract part is credited at the credit unit price with nothing returned on it, because no change order charged anything on it. The credit unit price is the tier's rate for the scope code, or, for a scope code that has no tier rate, the unit price written on the proposal. The credit is put together in this order: first the removed line; any treatment or cleaning returned on the change-order part is added to it; any overhead and profit returned is applied once to that sum; the contract part's credit is then added; any fixed deduction the removal carries is then subtracted; a result below zero is credited as zero; and only that result is rounded to the cent, half up.
      params: [drywall_rate_per_sqft, paint_rate_per_sqft, insulation_rate_per_sqft, baseboard_install_rate_per_lf, carpet_install_rate_per_sqft, lvp_install_rate_per_sqft, tile_install_rate_per_sqft, cabinet_install_rate_per_lf, carpenter_hourly_rate, painter_hourly_rate, dumpster_fee, final_cleaning_fee]
    inputs:
      history:
        - {table: rebuild_change_orders, aggregate: latest, field: quantity, filters: {co_status: pending_signature, co_type: deductive}}
        - {table: rebuild_change_orders, aggregate: count, field: change_order_id, filters: {co_status: signed, co_type: owner_upgrade}}
        - {category: claims, table: claims_approvals, aggregate: sum, field: amount, filters: {event_type: claims_scope_approval}}
      cross_category: [claims, water, fire, mold]
  - id: rebuild_ext_overdue_draw_charge
    base_policy_refs: [rebuild_overdue_draws]
    overwrite:
      - base_policy: rebuild_overdue_draws
        superseded_clause: >-
          The charge is the tier's monthly overdue percentage of the draw's unpaid amount, at most once per draw per calendar month fee period, rounded to the cent, half up.
        replaced_by: >-
          For the overdue draw charge on the contract's most recently requested customer-funded draw, the one with the highest draw number among the customer-funded draws, when every earlier customer-funded draw of the contract is paid in full, so that it is the oldest unpaid customer-funded draw, and only for that draw, the charge for a fee period is worked out as this paragraph states; a charge on any other draw is the tier's monthly overdue percentage of the draw's unpaid amount, at most once per draw per calendar month fee period, rounded to the cent, half up, as the base overdue rule states, except that on a Texas property, until the Texas statutory retention days after the substantial completion date have passed, the unpaid amount of a customer-funded draw leaves out its statutory retention, so a Texas customer-funded draw that has everything but its statutory retention paid carries no overdue draw charge in that time.
    trigger: state_due
    subject: [rebuild_overdue_draw_charge]
    computes: amount
    target_tool: post_overdue_draw_charge_f6859441
    params:
      charge_window_days: 30
      texas_owner_retention_pct: 10
      texas_retention_days: 30
    rule: >-
      For the overdue draw charge on the contract's most recently requested customer-funded draw, the one with the highest draw number among the customer-funded draws, when every earlier customer-funded draw of the contract is paid in full, so that it is the oldest unpaid customer-funded draw, and only for that draw, the charge for a fee period is worked out as this paragraph states; a charge on any other draw is the tier's monthly overdue percentage of the draw's unpaid amount, at most once per draw per calendar month fee period, rounded to the cent, half up, as the base overdue rule states, except that on a Texas property, until the Texas statutory retention days after the substantial completion date have passed, the unpaid amount of a customer-funded draw leaves out its statutory retention, so a Texas customer-funded draw that has everything but its statutory retention paid carries no overdue draw charge in that time.
      For a property whose loss address is in Texas, until the Texas statutory retention days after the substantial completion date have passed, a customer-funded draw counts as paid in full once everything but its statutory retention is paid; its statutory retention is the Texas owner retention percentage of its requested amount, on a tier that withholds retainage the part of that percentage above the tier's retainage percentage.
      The overdue draw charge for a fee period is not fixed until no deductive change order proposal stands on the contract awaiting the customer's signature; a deductive proposal whose credit worked out under the deductive change order signature rule is nothing is not counted, because it cannot be written.
      The fee periods of a draw are calendar months: a charge is owed for each calendar month that has begun, from the month that contains the first day a charge may post (the day after the grace period's last day) onward, at most one charge per month, and the charge worked out here is the one for the earliest owed month that carries no charge on the draw yet, written as that month in YYYY-MM form; whichever owed month it is for, it is figured on the charge window ending on the charge date.
      A fee period owes no overdue draw charge, and no charge is recorded for it, when the charge worked out for it comes to less than half a cent.
      Counting back one month from the charge date, a date is within the past month when it falls after the same day of the month in the previous calendar month and on or before the charge date; when the previous calendar month has no such day, every date in that previous month is outside the past month. Days between two dates are counted as calendar days from the earlier date to the later one, the earlier day not counted.
      The draw's unpaid amount is its requested amount less every payment posted toward it.
      The overdue draw charge is the tier's monthly overdue percentage of the draw's unpaid amount, rounded to the cent, half up.
      The overdue draw charge is put together in this order: first the chargeable balance, which is the balance the charge is figured on less every amount set against it, never below zero; then the monthly rate is applied to it; and only that result is rounded to the cent, half up.
      The balance the charge is figured on is the draw's unpaid amount.
      The balance the charge is figured on follows the charge span and the payments toward the draw. The charge span runs to the charge date from the latest of the first day of the charge window, which is the charge window days ending on the charge date, the first day a charge may post, and, when the latest overdue draw charge already posted on the draw was posted on an earlier day, the day after that charge; a payment counts from the day after it is posted. When a payment toward the draw was posted within the past month, the balance is the draw's balance-days over the charge span divided by the charge window days, each day of the span up to and including the latest such payment's posting day counted at the balance before the payments posted within the past month, which is the unpaid amount plus those payments, and each later day at the unpaid amount now; when no such payment was posted and the charge span is shorter than the charge window, it is the unpaid amount times the days of the charge span divided by the charge window days; otherwise it is the draw's unpaid amount.
      Change order credits are applied to the oldest unpaid customer-funded draw, which this draw is: when change order credit lines were posted on the contract within the past month and their total is below the draw's unpaid amount, their total is set against the balance; when that total is at or above the draw's unpaid amount, only the unpaid amount is set against it; otherwise nothing is set against it.
      The owner's statutory retention is set against the balance, because a retained amount is not past due. For a property whose loss address is in Texas, the owner retains part of the contract price until the Texas statutory retention days after the work is completed (Texas Property Code, Chapter 53); the company's rules take that retention as the Texas owner retention percentage of the contract price, which the owner holds back itself from its own payments of the customer-funded draws, while the final draw holds it back on the share of the contract the customer does not fund. So for a Texas property, until the Texas statutory retention days after the substantial completion date have passed, on a tier that withholds no retainage, the Texas owner retention percentage of the draw's requested amount is set against the balance, and on a tier that withholds retainage, the part of the Texas owner retention percentage above the tier's retainage percentage, of the draw's requested amount; for every other property nothing is set against it.
      The company does not charge for carrier money the insured is still waiting for, as the base overdue rule carries no charge on carrier-funded draws while their funds are pending.
      The recoverable depreciation set against the balance follows the carrier's release practice: when the claim arrangement has the carrier release recoverable depreciation only once the work is shown complete and the contract has no substantial completion date yet, it is the dwelling depreciation withheld on the linked claim file's approvals less the dwelling depreciation released and less the amounts written off as depreciation_forfeited, never below zero; when the contract has a substantial completion date and the latest depreciation release request on the claim file, of two on that date the one with the larger requested amount, has no depreciation release payment received on or after its request date, it is that request's requested amount; otherwise no depreciation is set against it.
      The supplement money set against the balance follows the carrier's supplement decisions: when the claim file carries dwelling supplement approvals not yet matched by dwelling supplement payments, it is the approved amount not yet paid; when it carries no such unpaid approval and the dwelling supplement request with the highest supplement number has no supplement approval naming it, it is that request's requested amount; otherwise no supplement money is set against it. When a dwelling supplement request other than the one with the highest supplement number still has no supplement approval naming it, the carrier has decided the supplements out of order and the charge is handed to a human representative as not covered by policy.
    prerequisite:
      - problem: rebuild_ext_deductive_signature
        kind: value_input
        gate: credit_set_off
        form: state
        policy_source: >-
          The overdue draw charge for a fee period is not fixed until no deductive change order proposal stands on the contract awaiting the customer's signature; a deductive proposal whose credit worked out under the deductive change order signature rule is nothing is not counted, because it cannot be written.
        condition: >-
          No rebuild_change_orders row of the contract with co_type deductive carries co_status pending_signature at the moment the charge is posted, other than one whose credit worked out under the deductive change order signature rule is nothing.
        resolved_by: sign_deductive_change_order_5bfd6b95
        effect: >-
          Once the deductive proposal is signed, its credit line is posted on the signing date, inside the past month, so it is set against the balance the charge is figured on and lowers the charge.
    cross_category:
      - category: claims
        as: history
        reads: [variant_name, claims_approvals.depreciation_withheld, claims_approvals.amount, claims_payments.amount, claims_payments.payment_type, claims_payments.received_date, claims_requests.requested_amount, claims_requests.request_date]
        note: The depreciation tier reads the claim arrangement's release practice, withheld depreciation, releases, forfeiture write-offs and the latest depreciation release request; the supplement tier reads supplement approvals, supplement payments and supplement requests.
    compute:
      - od_draw_id: "LATEST('rebuild_draws', 'rebuild_draw_id', date_field='draw_number', funding_route='customer')"
      - od_requested: "LATEST('rebuild_draws', 'requested_amount', date_field='draw_number', funding_route='customer')"
      - od_unpaid: "od_requested - SUM('rebuild_payments', 'amount', rebuild_draw_id=od_draw_id)"
      - bd_due: "LATEST('rebuild_draws', 'due_date', date_field='draw_number', funding_route='customer')"
      - bd_last_charge: "LATEST('rebuild_charges', 'posted_date', date_field='posted_date', charge_code='overdue_draw_charge', rebuild_draw_id=od_draw_id)"
      - bd_span: "MN(K('charge_window_days'), DAYS(bd_due, NOW) - P('overdue_draw_grace_days'), DAYS(bd_last_charge, NOW) if (bd_last_charge != None and DAYS(bd_last_charge, NOW) > 0) else K('charge_window_days'))"
      - bd_recent_paid: "SUM('rebuild_payments', 'amount', within_months=1, date_field='posted_date', rebuild_draw_id=od_draw_id)"
      - bd_last_payment: "LATEST('rebuild_payments', 'posted_date', date_field='posted_date', rebuild_draw_id=od_draw_id)"
      - bd_later_days: "MN(bd_span, DAYS(bd_last_payment, NOW)) if (bd_recent_paid > 0 and bd_last_payment != None) else bd_span"
      - charge_basis: "((od_unpaid + bd_recent_paid) * MX(0, bd_span - bd_later_days) + od_unpaid * bd_later_days) / K('charge_window_days') if (bd_recent_paid > 0 and bd_last_payment != None) else (od_unpaid * bd_span / K('charge_window_days') if bd_span < K('charge_window_days') else od_unpaid)"
      - ca_recent_credits: "SUM('rebuild_payments', 'amount', within_months=1, date_field='posted_date', event_type='rebuild_change_order_credit')"
      - credit_set_off: "ca_recent_credits if (ca_recent_credits > 0 and ca_recent_credits < od_unpaid) else (od_unpaid if (ca_recent_credits > 0 and ca_recent_credits >= od_unpaid) else 0)"
      - tr_texas: "', TX ' in F('loss_address')"
      - tr_requested: "LATEST('rebuild_draws', 'requested_amount', date_field='draw_number', funding_route='customer')"
      - tr_in_period: "F('substantial_completion_date') == None or DAYS(F('substantial_completion_date'), NOW) <= K('texas_retention_days')"
      - retention_set_off: "K('texas_owner_retention_pct') / 100 * tr_requested if (tr_texas and tr_in_period and P('retainage_pct') == 0) else (MX(0, K('texas_owner_retention_pct') - P('retainage_pct')) / 100 * tr_requested if (tr_texas and tr_in_period and P('retainage_pct') > 0) else 0)"
      - dp_on_completion: "CPARAM('claims', 'depreciation_release_requires_completion', claim_file_id=F('claim_file_id'))"
      - dp_unreleased: "MX(0, XSUM('claims', 'claims_approvals', 'depreciation_withheld', claim_file_id=F('claim_file_id'), event_type='claims_scope_approval', coverage_part='dwelling') - XSUM('claims', 'claims_payments', 'amount', claim_file_id=F('claim_file_id'), payment_type='depreciation_release', coverage_part='dwelling') - XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_receivable_writeoff', writeoff_reason='depreciation_forfeited'))"
      - dp_request_date: "XLATEST('claims', 'claims_requests', 'request_date', date_field='request_date', claim_file_id=F('claim_file_id'), event_type='claims_depreciation_release_request')"
      - dp_request_amount: "XMAX('claims', 'claims_requests', 'requested_amount', claim_file_id=F('claim_file_id'), event_type='claims_depreciation_release_request', request_date=dp_request_date) if dp_request_date != None else 0"
      - dp_last_release: "XLATEST('claims', 'claims_payments', 'received_date', date_field='received_date', claim_file_id=F('claim_file_id'), payment_type='depreciation_release')"
      - depreciation_set_off: "dp_unreleased if (dp_on_completion == True and F('substantial_completion_date') == None) else (dp_request_amount if (F('substantial_completion_date') != None and dp_request_date != None and (dp_last_release == None or DAYS(dp_request_date, dp_last_release) < 0)) else 0)"
      - sp_unpaid: "MX(0, XSUM('claims', 'claims_approvals', 'amount', claim_file_id=F('claim_file_id'), event_type='claims_scope_approval', approval_type='supplement', coverage_part='dwelling') - XSUM('claims', 'claims_payments', 'amount', claim_file_id=F('claim_file_id'), payment_type='supplement', coverage_part='dwelling'))"
      - sp_last_id: "XLATEST('claims', 'claims_requests', 'claim_request_id', date_field='supplement_number', claim_file_id=F('claim_file_id'), event_type='claims_supplement_submit', coverage_part='dwelling')"
      - sp_open: "XCOUNT('claims', 'claims_approvals', claim_request_id=sp_last_id, event_type='claims_scope_approval') == 0 if sp_last_id != None else False"
      - sp_last_request: "XLATEST('claims', 'claims_requests', 'requested_amount', date_field='supplement_number', claim_file_id=F('claim_file_id'), event_type='claims_supplement_submit', coverage_part='dwelling') or 0"
      - supplement_set_off: "sp_unpaid if sp_unpaid > 0 else (sp_last_request if sp_open else 0)"
      - chargeable_balance: "MX(0, charge_basis - credit_set_off - retention_set_off - depreciation_set_off - supplement_set_off)"
      - result: "RND(chargeable_balance * P('overdue_draw_charge_pct_monthly') / 100 + 0.000000001, 2)"
