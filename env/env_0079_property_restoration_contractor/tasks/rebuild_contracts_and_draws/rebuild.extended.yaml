- id: rebuild_change_orders
  subject:
  - rebuild_change_order_charge
  - rebuild_change_order_credit
  rule: 'The contract must be in signed, permitted, in_construction or substantially_complete status when a change
    order is booked. A change order is booked only after the customer has signed it. Each change order carries one
    priced line: install, finish and labor lines are priced at the tier''s rate times the quantity; flooring, cabinet
    and fixture upgrades are priced at the owner''s selected unit price less the tier''s selection allowance, times
    the quantity; material escalation is priced at the documented supplier increase per unit times the quantity
    and is allowed only when the increase exceeds the tier''s escalation threshold. The change order markup is then
    added to every line except deductive ones, and the amount is rounded to the cent, half up. An additive change
    order below the tier''s change order minimum is not written. An insurance_scope change order on an insurance_claim
    contract is booked only after the carrier has approved the supplement the change order names. Owner upgrades
    are paid by the customer, and the tier''s upgrade deposit share of each owner_upgrade change order is due before
    the upgrade is ordered. A deductive change order is credited without markup. A contract may have at most the
    tier''s maximum number of change orders awaiting signature, and a proposal not signed within the tier''s validity
    days is voided.'
