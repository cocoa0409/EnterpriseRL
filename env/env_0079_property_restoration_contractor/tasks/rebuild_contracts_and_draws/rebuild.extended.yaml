    status; substantial_completion and retainage_release in substantially_complete or final_invoiced status. Each
    milestone of the tier''s draw schedule is requested at most once per contract. A draw requests the milestone''s
    percentage of the current contract sum, which is the contract amount plus signed additive change orders less
    signed deductive change orders as of the request date; the contract_signing draw is also capped at the tier''s
    deposit maximum. On tiers with retainage, each draw withholds the retainage percentage, and the withheld total
    is requested as the retainage_release draw once the tier''s retainage release days have passed after substantial
    completion. Because each draw is a percentage of the contract sum current at its own request, the substantial_completion
    draw requests whatever remains of the current contract sum after every earlier draw before retainage, so that
    the draws together equal the current contract sum. The funding route is mortgagee_release when the linked claim
    file names a mortgagee and its dwelling-coverage payment was routed to the mortgagee''s loss-draft account,
    carrier_direct when the dwelling payment reached the company, and customer otherwise; a mortgagee_release draw
    is requested only after the mortgagee''s inspection of the milestone. On tiers that require it, each draw request
    carries a conditional progress lien waiver, and the substantial_completion draw a conditional final waiver.
