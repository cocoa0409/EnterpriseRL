        ladder:
          - when: "carrier-funded AND the arrangement has the company collect the deductible AND deductible is due"
            value: "the deductible due"
          - when: "carrier-funded AND the arrangement does not have the company collect the deductible"
            value: "the claim file's whole deductible amount"
          - when: "otherwise"
            value: "0"
        baseline:
          deductible_hold: "0"
        evidence: [cross_category]
        cross_difficulty: claims
