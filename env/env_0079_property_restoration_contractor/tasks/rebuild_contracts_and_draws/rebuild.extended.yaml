    factors:
      - id: ov_balance_days
        effect: method
        decides: charge_basis
        bindings: [bd_due, bd_last_charge, bd_span, bd_recent_paid, bd_last_payment, bd_later_days, charge_basis]
        ladder:
          - when: "a payment toward the draw posted within the past month"
