            value: "the dwelling depreciation withheld less released less forfeited, that difference never below zero, with the supplement money pending then added"
          - when: "the contract has a substantial completion date AND the latest depreciation release request (of two on that date, the larger) has no release payment received on or after its request date"
            value: "that request's requested amount plus the supplement money pending"
          - when: "otherwise, supplement money pending (unpaid supplement approvals, or the highest-numbered supplement request with no approval naming it)"
            value: "the supplement money pending"
          - when: "otherwise"
            value: "0"
        baseline:
          pending_set_aside: "0"
        evidence: [cross_category, date, history]
        cross_difficulty: claims
