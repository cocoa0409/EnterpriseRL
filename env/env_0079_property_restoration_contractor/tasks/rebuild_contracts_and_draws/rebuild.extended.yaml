    and mortgagee-funded draws carry none of them while the funds are pending, because their timing rests with the
    carrier or the mortgagee. An overdue draw charge may post only after the grace period following the draw's due
    date has fully passed. The grace period is counted in calendar days starting the day after the draw's due_date,
    and the first charge may post on the day after the grace period's last day. The charge is the tier's monthly
    overdue percentage of the draw's unpaid amount, at most once per draw per calendar month fee period, rounded
    to the cent, half up. When a customer-funded draw stays unpaid for more than the tier's stop-work days after
    its due date, work is suspended; when the draw is paid in full, work resumes and the tier's remobilization fee
    is booked once for that resumption.
