extended_policies:
  - id: rebuild_ext_change_order_signature
    base_policy_refs: [rebuild_change_orders, rebuild_permits_and_fees]
    overwrite:
      - base_policy: rebuild_change_orders
        superseded_clause: >-
          Each change order carries one priced line: install, finish and labor lines are priced at the tier's rate times the quantity; flooring, cabinet and fixture upgrades are priced at the owner's selected unit price less the tier's selection allowance, times the quantity; material escalation is priced at the documented supplier increase per unit times the quantity and is allowed only when the increase exceeds the tier's escalation threshold.
        replaced_by: >-
          For an additive change order, which is every change order type except deductive, that a customer signs on a contract carrying exactly one change order proposal awaiting signature, and only for such a change order, the amount is worked out as this paragraph states; a deductive change order is priced at its signature under the deductive change order signature rule, never under this paragraph; every additive change order on a contract with more than one proposal awaiting signature remains under the base change order rule, which prices one line: install, finish and labor lines at the tier's rate times the quantity, flooring, cabinet and fixture upgrades at the owner's selected unit price less the tier's selection allowance, times the quantity, and material escalation at the documented supplier increase per unit times the quantity. For every additive change order, a material escalation line is allowed only when the increase exceeds the tier's escalation threshold.
      - base_policy: rebuild_change_orders
        superseded_clause: >-
          The change order markup is then added to every line except deductive ones, and the amount is rounded to the cent, half up.
        replaced_by: >-
          The change order amount is put together in this order: first the billed quantity times the unit price gives the change order line; any treatment or cleaning charged on the quantity written on the proposal is added to that line; the change order markup rate is applied once to that sum; any fixed item the change order carries is then added without markup; and only the final total is rounded to the cent, half up. For every change order outside this paragraph's scope, the change order markup is added to every line except deductive ones and the amount is rounded to the cent, half up, as the base change order rule states.
    trigger: on_request
    subject: [rebuild_change_order_charge]
    computes: amount
    target_tool: sign_change_order_7ffbf290
    params:
      lead_safe_cleaning_verification_fee: 125.0
      rrp_minor_repair_sqft: 6
    rule: >-
      For an additive change order, which is every change order type except deductive, that a customer signs on a contract carrying exactly one change order proposal awaiting signature, and only for such a change order, the amount is worked out as this paragraph states; a deductive change order is priced at its signature under the deductive change order signature rule, never under this paragraph; every additive change order on a contract with more than one proposal awaiting signature remains under the base change order rule, which prices one line: install, finish and labor lines at the tier's rate times the quantity, flooring, cabinet and fixture upgrades at the owner's selected unit price less the tier's selection allowance, times the quantity, and material escalation at the documented supplier increase per unit times the quantity. For every additive change order, a material escalation line is allowed only when the increase exceeds the tier's escalation threshold.
      The signature is the customer's own act: the customer signs the proposal awaiting signature, and the signature books the change order as one change_order charge line at the amount worked out here on the records as they stand on the signing date; the figure written on the proposal when it was drafted is not the booked amount.
      The change order line is read from the proposal awaiting signature: its scope code, the quantity written on it and the unit price written on it.
      The change order line is priced at the billed quantity times the change order unit price. The billed quantity is the quantity written on the proposal. The change order unit price is the tier's rate for the scope code, or, for a scope code that has no tier rate (an upgrade or escalation line), the unit price written on the proposal. The change order markup rate is the tier's change order markup percentage. The change order amount is put together in this order: first the billed quantity times the unit price gives the change order line; any treatment or cleaning charged on the quantity written on the proposal is added to that line; the change order markup rate is applied once to that sum; any fixed item the change order carries is then added without markup; and only the final total is rounded to the cent, half up. For every change order outside this paragraph's scope, the change order markup is added to every line except deductive ones and the amount is rounded to the cent, half up, as the base change order rule states.
      The change order unit price follows who pays for the line, read from the proposal's change order type and the supplement it names: for a carrier-scope line, which is an insurance_scope change order on an insurance_claim contract that names a supplement the carrier has approved, the carrier's approved unit price, which is the amount the carrier approved on that supplement divided by the quantity written on the proposal; for an owner_upgrade change order on a flooring_upgrade, cabinet_upgrade or fixture_upgrade line, the owner's selected unit price written on the proposal less the tier's selection allowance for its line (the flooring allowance for a flooring_upgrade line, the cabinet allowance for a cabinet_upgrade line, the fixture allowance for a fixture_upgrade line); for every other change order, the tier's rate for the scope code, or the unit price written on the proposal where the scope code has no tier rate.
      The change order markup rate follows the carrier's overhead and profit practice: for an insurance_scope or code_required change order on an insurance_claim contract whose linked claim file's estimate carries at least the claim arrangement's minimum number of trades for overhead and profit, the arrangement's overhead percentage plus its profit percentage; for an insurance_scope or code_required change order on an insurance_claim contract whose linked claim file's estimate carries fewer trades than that minimum, no markup; for every other change order, the tier's change order markup percentage.
      A drywall or insulation line closes walls over framing the loss reached, and its wall-closing treatment is the treatment rate times the quantity written on the proposal, the wall area the line closes, the treatment rate being chosen from the company mitigation job that preceded the rebuild at the same loss: where that job is a water job assessed category_3, the water job tier's antimicrobial rate per square foot; where it is a fire job, the fire job tier's odor sealer rate per square foot; where it is a mold job, the mold job tier's encapsulation rate per square foot; every other line, and a drywall or insulation line with no such preceding job, carries no wall-closing treatment.
      Before a drywall or insulation line closes walls over framing a water loss reached, the dryness of that framing is verified when the preceding company water job stopped drying early: where that water job's drying outcome is customer_release and its water class is class_3 or class_4, the verification item is the water job tier's moisture mapping fee plus its thermal imaging fee; where its drying outcome is customer_release and its water class is class_1 or class_2, the verification item is the water job tier's moisture mapping fee; every other line carries no verification item.
      Before a drywall or insulation line closes walls over framing the loss reached, the framing is cleaned at the rate of the company mitigation job that preceded the rebuild at the same loss, on the quantity written on the proposal, the wall area the line closes: where that job is a water job assessed category_3, the water job tier's HEPA vacuuming rate per square foot; where it is a fire job, the fire job tier's wet cleaning rate per square foot; where it is a mold job, the mold job tier's HEPA vacuuming rate per square foot; every other line, and a drywall or insulation line with no such preceding job, carries no cleaning.
      A drywall, paint or baseboard line disturbs painted surfaces, and its lead-safe item follows the EPA Renovation, Repair and Painting Rule the company's certified renovators work under, inside the lead-safe setup the permit and fee rule bills on the contract: on a single_family, condo_unit or multifamily_unit building built before the tier's RRP year-built cutoff whose contract carries a lead_safe_setup charge line, a drywall or baseboard line removes painted components, which that rule never treats as minor repair, so its lead-safe item is the lead-safe cleaning verification fee for the RRP cleaning verification of its work area; on such a building, a paint line only prepares painted surfaces, which that rule exempts as minor repair up to the RRP interior minor-repair area, so its lead-safe item is the lead-safe cleaning verification fee when the quantity written on it exceeds that area, and nothing otherwise; every other line, and every line on a contract that carries no lead_safe_setup charge line, carries no lead-safe item.
      An additive change order whose amount worked out here is below the tier's change order minimum is not written.
    prerequisite: []
    cross_category:
      - category: claims
        as: branch
        reads: [estimate_trade_count, variant_name, claims_approvals.amount]
        note: The markup tier reads the claim file's trade count against the arrangement's overhead-and-profit minimum; the unit price tier reads the approved amount of the supplement the proposal names.
      - category: water
        as: branch
        reads: [water_category, drying_outcome, water_class, variant_name]
        note: The wall-closing treatment, framing cleaning and drying verification tiers read the preceding water job's category, drying outcome, class and tier rates.
      - category: fire
        as: existence
        reads: [variant_name]
        note: The wall-closing treatment and framing cleaning tiers read whether the preceding job is a fire job and its tier's odor sealer and wet cleaning rates.
      - category: mold
        as: existence
        reads: [variant_name]
        note: The wall-closing treatment and framing cleaning tiers read whether the preceding job is a mold job and its tier's encapsulation and HEPA vacuuming rates.
    compute:
      - co_qty: "LATEST('rebuild_change_orders', 'quantity', date_field='created_at', co_status='pending_signature')"
      - co_scope: "LATEST('rebuild_change_orders', 'scope_code', date_field='created_at', co_status='pending_signature')"
      - co_written_price: "LATEST('rebuild_change_orders', 'unit_price', date_field='created_at', co_status='pending_signature')"
      - scope_rate: "P('drywall_rate_per_sqft') if co_scope == 'drywall' else (P('paint_rate_per_sqft') if co_scope == 'paint' else (P('insulation_rate_per_sqft') if co_scope == 'insulation' else (P('baseboard_install_rate_per_lf') if co_scope == 'baseboard' else (P('carpet_install_rate_per_sqft') if co_scope == 'carpet_install' else (P('lvp_install_rate_per_sqft') if co_scope == 'lvp_install' else (P('tile_install_rate_per_sqft') if co_scope == 'tile_install' else (P('cabinet_install_rate_per_lf') if co_scope == 'cabinet_install' else (P('carpenter_hourly_rate') if co_scope == 'carpenter_labor' else (P('painter_hourly_rate') if co_scope == 'painter_labor' else (P('dumpster_fee') if co_scope == 'dumpster' else (P('final_cleaning_fee') if co_scope == 'final_cleaning' else co_written_price)))))))))))"
      - up_kind: "LATEST('rebuild_change_orders', 'co_type', date_field='created_at', co_status='pending_signature')"
      - up_supplement: "LATEST('rebuild_change_orders', 'claim_request_id', date_field='created_at', co_status='pending_signature')"
      - up_approved: "XSUM('claims', 'claims_approvals', 'amount', claim_request_id=up_supplement, event_type='claims_scope_approval') if up_supplement != None else 0"
      - up_upgrade_allowance: "P('flooring_allowance_per_sqft') if co_scope == 'flooring_upgrade' else (P('cabinet_allowance_per_lf') if co_scope == 'cabinet_upgrade' else P('fixture_allowance_per_each'))"
      - co_unit_price: "up_approved / co_qty if (up_kind == 'insurance_scope' and F('funding_source') == 'insurance_claim' and up_approved > 0 and co_qty > 0) else ((co_written_price - up_upgrade_allowance) if (up_kind == 'owner_upgrade' and (co_scope == 'flooring_upgrade' or co_scope == 'cabinet_upgrade' or co_scope == 'fixture_upgrade')) else scope_rate)"
      - mk_kind: "LATEST('rebuild_change_orders', 'co_type', date_field='created_at', co_status='pending_signature')"
      - mk_carrier_line: "(mk_kind == 'insurance_scope' or mk_kind == 'code_required') and F('funding_source') == 'insurance_claim'"
      - mk_trades: "CFIELD('claims', 'estimate_trade_count', claim_file_id=F('claim_file_id')) or 0"
      - mk_min_trades: "CPARAM('claims', 'op_min_trades', claim_file_id=F('claim_file_id')) or 0"
      - mk_op_pct: "(CPARAM('claims', 'overhead_pct', claim_file_id=F('claim_file_id')) or 0) + (CPARAM('claims', 'profit_pct', claim_file_id=F('claim_file_id')) or 0)"
      - markup_rate: "mk_op_pct if (mk_carrier_line and mk_trades >= mk_min_trades) else (0 if (mk_carrier_line and mk_trades < mk_min_trades) else P('change_order_markup_pct'))"
      - wt_scope: "LATEST('rebuild_change_orders', 'scope_code', date_field='created_at', co_status='pending_signature')"
      - wt_wall_line: "wt_scope == 'drywall' or wt_scope == 'insulation'"
      - wt_water_category: "CFIELD('water', 'water_category', water_job_id=F('mitigation_job_id'))"
      - wt_fire_job: "EXISTS('fire', fire_job_id=F('mitigation_job_id'))"
      - wt_mold_job: "EXISTS('mold', mold_job_id=F('mitigation_job_id'))"
      - treat_rate: "(CPARAM('water', 'antimicrobial_rate_per_sqft', water_job_id=F('mitigation_job_id')) or 0) if (wt_wall_line and wt_water_category == 'category_3') else ((CPARAM('fire', 'odor_sealer_rate_per_sqft', fire_job_id=F('mitigation_job_id')) or 0) if (wt_wall_line and wt_fire_job) else ((CPARAM('mold', 'encapsulation_rate_per_sqft', mold_job_id=F('mitigation_job_id')) or 0) if (wt_wall_line and wt_mold_job) else 0))"
      - dv_scope: "LATEST('rebuild_change_orders', 'scope_code', date_field='created_at', co_status='pending_signature')"
      - dv_wall_line: "dv_scope == 'drywall' or dv_scope == 'insulation'"
      - dv_outcome: "CFIELD('water', 'drying_outcome', water_job_id=F('mitigation_job_id'))"
      - dv_class: "CFIELD('water', 'water_class', water_job_id=F('mitigation_job_id'))"
      - dv_mapping_fee: "CPARAM('water', 'moisture_mapping_fee', water_job_id=F('mitigation_job_id')) or 0"
      - dv_imaging_fee: "CPARAM('water', 'thermal_imaging_fee', water_job_id=F('mitigation_job_id')) or 0"
      - verification_item: "dv_mapping_fee + dv_imaging_fee if (dv_wall_line and dv_outcome == 'customer_release' and (dv_class == 'class_3' or dv_class == 'class_4')) else (dv_mapping_fee if (dv_wall_line and dv_outcome == 'customer_release' and (dv_class == 'class_1' or dv_class == 'class_2')) else 0)"
      - ls_scope: "LATEST('rebuild_change_orders', 'scope_code', date_field='created_at', co_status='pending_signature')"
      - ls_qty: "LATEST('rebuild_change_orders', 'quantity', date_field='created_at', co_status='pending_signature')"
      - ls_housing: "F('property_type') == 'single_family' or F('property_type') == 'condo_unit' or F('property_type') == 'multifamily_unit'"
      - ls_year: "int(F('year_built') or 9999)"
      - ls_setup_lines: "COUNT('rebuild_charges', charge_code='lead_safe_setup')"
      - lead_safe_item: "K('lead_safe_cleaning_verification_fee') if ((ls_scope == 'drywall' or ls_scope == 'baseboard') and ls_housing and ls_year < P('rrp_year_built_cutoff') and ls_setup_lines > 0) else ((K('lead_safe_cleaning_verification_fee') if (ls_qty or 0) > K('rrp_minor_repair_sqft') else 0) if (ls_scope == 'paint' and ls_housing and ls_year < P('rrp_year_built_cutoff') and ls_setup_lines > 0) else 0)"
      - cn_scope: "LATEST('rebuild_change_orders', 'scope_code', date_field='created_at', co_status='pending_signature')"
      - cn_wall_line: "cn_scope == 'drywall' or cn_scope == 'insulation'"
      - cn_water_category: "CFIELD('water', 'water_category', water_job_id=F('mitigation_job_id'))"
      - cn_fire_job: "EXISTS('fire', fire_job_id=F('mitigation_job_id'))"
      - cn_mold_job: "EXISTS('mold', mold_job_id=F('mitigation_job_id'))"
      - clean_rate: "(CPARAM('water', 'hepa_vacuum_rate_per_sqft', water_job_id=F('mitigation_job_id')) or 0) if (cn_wall_line and cn_water_category == 'category_3') else ((CPARAM('fire', 'wet_clean_rate_per_sqft', fire_job_id=F('mitigation_job_id')) or 0) if (cn_wall_line and cn_fire_job) else ((CPARAM('mold', 'hepa_vacuum_rate_per_sqft', mold_job_id=F('mitigation_job_id')) or 0) if (cn_wall_line and cn_mold_job) else 0))"
      - co_line: "co_qty * co_unit_price"
      - wall_treatment: "treat_rate * co_qty"
      - framing_cleaning: "clean_rate * co_qty"
      - result: "RND((co_line + wall_treatment + framing_cleaning) * (1 + markup_rate / 100) + verification_item + lead_safe_item + 0.000000001, 2)"
