    factors:
      - id: py_overdue_carried
        effect: parameter
        decides: overdue_carried
        bindings: [oc_on_draw, oc_recent_on_draw, oc_suspended, overdue_carried]
        ladder:
          - when: "work on the contract suspended AND overdue draw charges posted on the paid draw"
            value: "every overdue draw charge posted on the paid draw"
          - when: "work not suspended AND overdue draw charges posted on the paid draw within the past month"
            value: "the overdue draw charges posted on the paid draw within the past month"
          - when: "otherwise"
            value: "0"
        baseline:
          overdue_carried: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: py_credit_applied
        effect: method
        decides: credit_applied
        bindings: [ca_recent_credits, credit_applied]
        ladder:
          - when: "change order credit lines posted within the past month AND their total below the draw's unpaid amount"
            method: "subtract the credit total"
          - when: "change order credit lines posted within the past month AND their total at or above the draw's unpaid amount"
            method: "subtract only the draw's unpaid amount (the lesser of the two)"
          - when: "otherwise"
            method: "subtract nothing"
        baseline:
          credit_applied: "0"
        evidence: [history]
        cross_difficulty: null
      - id: py_owner_retention
        effect: parameter
        decides: retention_held
        bindings: [rh_texas, rh_requested, rh_in_period, retention_held]
        ladder:
          - when: "the loss address is in Texas AND the Texas statutory retention days after substantial completion have not passed AND the tier withholds no retainage"
            value: "the Texas owner retention percentage of the draw's requested amount"
          - when: "the loss address is in Texas AND the Texas statutory retention days after substantial completion have not passed AND the tier withholds retainage"
            value: "the part of the Texas owner retention percentage above the tier's retainage percentage, of the draw's requested amount"
          - when: "otherwise"
            value: "0"
        baseline:
          retention_held: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: py_remobilization
        effect: parameter
        decides: remobilization_carried
        bindings: [rm_suspended, rm_recent_line, rm_last_payment, remobilization_carried]
        ladder:
          - when: "work suspended AND no resumption dated on or after the suspension"
            value: "P('remobilization_fee')"
          - when: "work resumed within the past month after a suspension AND no draw payment posted on the contract on or after the suspension date AND its remobilization line booked"
            value: "the remobilization line's amount"
          - when: "otherwise"
            value: "0"
        baseline:
          remobilization_carried: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: py_carrier_pending
        effect: parameter
        decides: pending_set_aside
        bindings: [sa_on_completion, sa_unreleased, sa_request_date, sa_request_amount, sa_last_release, sa_unpaid, sa_last_id, sa_open, sa_last_request, sa_supplement, pending_set_aside]
        ladder:
