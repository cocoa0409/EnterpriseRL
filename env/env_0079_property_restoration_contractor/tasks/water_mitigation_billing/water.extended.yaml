  factors:
  - id: code_upgrade_supplement_decision
    effect: method
    decides: code_work_covered
    bindings:
    - cu_request_id
    - cu_job
    - cu_approved
    - cu_approval_count
    - cu_requested
    - code_work_covered
    ladder:
    - when: the latest code-upgrade supplement request on the linked claim file names this job and carries a carrier approval
      method: the amount the carrier approved on that request, no more than the ordinance or law limit
    - when: that request names this job and has no carrier approval yet
      method: the amount the request asks for, no more than the ordinance or law limit
    - when: otherwise (no code-upgrade supplement request naming this job)
      method: the claim file's ordinance or law limit
    baseline:
      code_work_covered: MX(0, ol_limit)
    evidence:
    - cross_category
    - history
    cross_difficulty: claims
  - id: emergency_premium_timing
    effect: parameter
    decides: premium_share
    bindings:
    - sc_premium
    - sh_stand_days
    - premium_share
    ladder:
    - when: the service call premium is above zero and the job's opened date is two or more days after its loss date
      value: '1'
    - when: the premium is above zero and the opened date is exactly one day after the loss date
      value: K('premium_share_next_day')
    - when: otherwise
      value: '0'
    baseline:
      premium_share: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: air_mover_placement_cap
    effect: method
    decides: covered_am_unit_days
    bindings:
    - am_line_days
    - am_run_lf
    - covered_am_unit_days
    ladder:
    - when: the job is class_3
      method: (floor term + wall term + ceiling term, each rounded up) x the number of air mover lines
    - when: the job is class_2
      method: (floor term + wall term, each rounded up) x the number of air mover lines
    - when: otherwise
      method: every billed air mover unit-day is covered
    baseline:
      covered_am_unit_days: am_unit_days
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: lgr_iicrc_sizing
    effect: method
    decides: covered_lgr_unit_days
    bindings:
    - lgr_line_days
    - lgr_run_lf
    - covered_lgr_unit_days
    ladder:
    - when: the job is class_3 or class_4 and carries LGR dehumidifier lines
      method: (floor term per 500 sq ft + wall term per 50 lf of baseboard run, each rounded up) x the number of LGR lines
    - when: the job is class_2 and carries LGR dehumidifier lines
      method: floor term per 500 sq ft, rounded up, x the number of LGR lines
    - when: otherwise
      method: every billed LGR unit-day is covered
    baseline:
      covered_lgr_unit_days: lgr_unit_days
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: hepa_stripped_floor_cover
    effect: method
    decides: hepa_outside_sqft
    bindings:
    - sh_hepa_sqft
    - sh_pad_sqft
    - sh_cut_lf
    - hepa_outside_sqft
    ladder:
    - when: the job is category_2 and carries HEPA vacuuming lines
      method: HEPA square feet above the pad removal square feet
    - when: the job is category_3 and carries HEPA vacuuming lines
      method: HEPA square feet above the sum of the pad removal square feet and 4 square feet per flood cut linear foot
    - when: otherwise
      method: no HEPA square feet non-covered
    baseline:
      hepa_outside_sqft: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: contents_room_block
    effect: parameter
    decides: room_block_sqft
    bindings:
    - room_lines
    - room_block_sqft
    ladder:
    - when: the job is category_3 and carries contents manipulation lines
      value: K('room_block_cat3')
    - when: the job is category_2 and carries contents manipulation lines
      value: K('room_block_cat2')
    - when: otherwise
      value: K('room_block_std')
    baseline:
      room_block_sqft: K('room_block_std')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: 'The insured''s share of a job is the part of its charges that the claim''s dwelling coverage does not pay and that the insured pays the company directly. The standard insured''s share is the total of the job''s card surcharge and late fee lines, the insured''s own finance charges, which insurance proceeds never pay. Lead-safe setup and asbestos sampling are paid by the dwelling coverage only through the linked claim file''s ordinance or law coverage: the amount by which the job''s lead-safe setup and asbestos sampling lines total more than the code work covered is a non-covered amount, and nothing is non-covered for them when that total is not above the code work covered. The standard code work covered is the claim file''s ordinance or law limit, taken as zero when the file carries no limit. Moving contents within rooms is covered for one room for every block of affected floor area, rounded up, the standard block being 400 square feet; the rooms on the job''s contents manipulation lines above the covered rooms, priced at the tier''s contents manipulation rate per room, are a non-covered amount. Non-covered amounts are billed to the insured only on a claim file whose billing arrangement lets a line the carrier declines be billed to the customer; on an arrangement that never bills such a line to the customer, no non-covered amount enters the share, as the claims charter provides for Assignment of Benefits and Carrier Program files. The insured''s share is the standard insured''s share plus every non-covered amount that applies to the job, rounded to the cent, half up, and never more than the job''s balance due; when the balance due or that amount is zero or less nothing is paid.'
    params:
    - contents_manipulation_rate_per_room
    - room_block_std
  inputs:
    history:
    - table: water_charges
      aggregate: sum
      field: amount
      filters:
        charge_code: card_surcharge
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: air_mover
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: lgr_dehumidifier
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: hepa_vacuum
    - category: claims
      table: claims_approvals
      aggregate: sum
      field: amount
      filters: {}
    - category: claims
      table: claims_requests
      aggregate: latest
      field: claim_request_id
      filters:
        supplement_reason: code_upgrade
    cross_category:
    - claims
