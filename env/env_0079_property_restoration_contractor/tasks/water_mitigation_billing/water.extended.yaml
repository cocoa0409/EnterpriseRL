category: water
display_name: Water Damage Mitigation
binding:
  holding_table: water_jobs
  event_tables:
  - water_charges
  - water_payments
  status_field: status
  variant_field: variant_name
  quantity_fields:
    balance_due: balance_due
lifecycle:
  states:
  - dispatched
  - authorized
  - drying
  - drying_complete
  - invoiced
  - closed
  - cancelled
  transitions:
  - from: dispatched
    to: authorized
    by: user
    means: The property owner or the owner's authorized agent signs the work authorization.
  - from: dispatched
    to: cancelled
    by: agent
    means: The customer declines the work before signing; the dispatch is cancelled with only the service call billable.
  - from: authorized
    to: drying
    by: system
    means: Drying equipment is set and the drying log opens.
  - from: drying
    to: drying_complete
    by: system
    means: The last drying equipment is removed, at the dry standard or under a signed early release.
  - from: drying_complete
    to: invoiced
    by: agent
    means: The final invoice is issued.
  - from: invoiced
    to: closed
    by: system
    means: The balance reaches zero and the job closes.
accounts:
- key: balance_due
  unit: USD
  meaning: 'Amount the customer owes on one water job: charges and refunds raise it, customer payments, insurance
    postings and credits lower it.'
parameter_schema:
  emergency_service_call_fee: Emergency service call (dispatch and initial inspection) fee per dispatch, USD
  after_hours_surcharge_pct: Surcharge on the service call fee when the dispatch falls in the after_hours window
    (weekdays 18:00-07:59 and weekends), percent
  holiday_surcharge_pct: Surcharge on the service call fee when the dispatch falls on a company-observed holiday,
    percent (replaces, never adds to, the after-hours surcharge)
  response_commitment_minutes: On-site arrival commitment measured from the booked call to crew arrival, minutes
  late_arrival_waiver: Whether the service call fee is waived when the crew arrives later than the arrival commitment,
    boolean
  air_mover_daily_rate: Air mover rental per unit per billable day, USD
  lgr_dehumidifier_daily_rate: LGR dehumidifier (standard) per unit per billable day, USD
  xl_dehumidifier_daily_rate: Large-capacity (XL) LGR dehumidifier per unit per billable day, USD
  desiccant_dehumidifier_daily_rate: Desiccant dehumidifier per unit per billable day, USD
  air_scrubber_daily_rate: HEPA air scrubber / negative air machine per unit per billable day, USD
  drying_mat_system_daily_rate: Wall or floor cavity drying mat / injection system per setup per billable day, USD
  heat_drying_unit_daily_rate: Indirect-fired heat drying unit per unit per billable day, USD
  air_scrubber_required: Whether a HEPA air scrubber must run for the whole drying period, boolean
  billable_drying_day_cap: Equipment days billable on a job without monitoring-supported extension, count of calendar
    days
  drying_extension_requires_monitoring: Whether an equipment day beyond the cap is billable only when a monitoring
    visit is recorded on that same calendar day, boolean
  monitoring_visit_fee: Daily moisture monitoring visit fee per visit day beyond the included visits, USD
  monitoring_fee_waived_on_set_day: Whether a monitoring visit on the drying start date (the equipment set day,
    covered by moisture mapping) is not billable, boolean
  max_monitoring_visits_per_day: Maximum monitoring visits billable per job per calendar day, count
  moisture_mapping_fee: Initial moisture mapping and documentation fee, once per job, USD
  thermal_imaging_fee: Infrared thermal imaging inspection fee, once per job, USD
  extraction_rate_per_sqft: Water extraction from flooring per square foot, USD
  antimicrobial_rate_per_sqft: Antimicrobial application per square foot, USD
  antimicrobial_required: Whether antimicrobial treatment of affected surfaces is required (and billable), boolean
  flood_cut_rate_per_lf: Flood cut of drywall per linear foot, USD
  baseboard_removal_rate_per_lf: Baseboard detach (and bag for reset) per linear foot, USD
  pad_removal_rate_per_sqft: Carpet pad tear-out and bagging per square foot, USD
  carpet_removal_rate_per_sqft: Carpet tear-out and disposal per square foot, USD
  carpet_detach_reset_rate_per_sqft: Carpet detach, float-dry and reset per square foot, USD
  carpet_salvage_allowed: Whether wet carpet may be dried in place / detached and reset instead of discarded, boolean
  carpet_pad_salvage_allowed: Whether wet carpet pad may be dried in place instead of discarded, boolean
  containment_setup_fee: Poly containment barrier with zipper door, per containment, USD
  ppe_rate_per_tech_day: Personal protective equipment per technician per day, USD
  ppe_billable: Whether PPE is a billable line on the job, boolean
  hepa_vacuum_rate_per_sqft: HEPA vacuuming of affected surfaces per square foot, USD
  contents_manipulation_rate_per_room: Moving and blocking contents within the room (no packout) per room, USD
  debris_haul_fee_per_load: Debris haul-off per pickup-truck load, USD
  dumpster_fee: Roll-off dumpster (20 cubic yard) per placement, USD
  technician_hourly_rate: Water mitigation technician labor per hour, business-hours rate, USD
  supervisor_hourly_rate: Mitigation supervisor labor per hour, business-hours rate, USD
  after_hours_labor_multiplier: Multiplier on hourly labor rates for labor performed in the after_hours or holiday
    window, decimal
  lead_safe_setup_fee: Lead-safe work practice setup (EPA RRP containment, cleaning verification) per job, USD
  rrp_year_built_cutoff: Housing built before this year triggers lead-safe practices when painted surfaces are disturbed
    (EPA RRP pre-1978 housing), year
  rrp_interior_threshold_sqft: Interior painted surface disturbed per room above which lead-safe practices apply
    (EPA RRP minor-repair threshold), square feet
  asbestos_sampling_fee: Pre-demolition asbestos sampling of drywall, joint compound and texture (collection plus
    lab), per job, USD
  asbestos_sampling_year_cutoff: Buildings built before this year are sampled for asbestos before any flood cut
    or tear-out (company policy), year
  self_pay_deposit_amount: Deposit a self-pay customer pays before drying equipment is set, USD
  payment_terms_days_self_pay: Days after the final invoice date by which a self-pay balance is due, calendar days
  payment_terms_days_insurance: Days after the final invoice date by which an insurance-funded balance is due, calendar
    days
  late_fee_pct_monthly: Late fee on the past-due balance per monthly fee period, percent
  late_fee_minimum: Minimum late fee per monthly fee period, USD
  late_fee_grace_days: Grace days after the due date before the first late fee may post, calendar days
  claim_pending_late_fee_suspension_days: Days after the final invoice date during which late fees are suspended
    on an insurance-funded job whose claim file is still awaiting carrier payment, calendar days
  credit_card_surcharge_pct: Surcharge on payments made by credit card (never debit card, ACH or check), percent
  adjustment_dispute_window_days: Days after the final invoice date within which a billing-error or duplicate-line
    dispute may be credited, calendar days
  goodwill_credit_cap: Maximum total goodwill credit the desk may post on one job, USD
  refund_processing_business_days: Business days (Monday-Friday excluding company holidays) to issue an overpayment
    refund after it is approved, count
