extended_policies:
- id: water_ext_tearout_debris
  base_policy_refs:
  - water_evt_mitigation_services
  - water_regulated_materials
  - water_agg_same_loss_job
  overwrite:
  - base_policy: water_evt_mitigation_services
    superseded_clause: 'Each mitigation service is billed at the unit rate of the job''s tier for its service code, multiplied by the quantity performed: extraction, antimicrobial, pad and carpet work and HEPA vacuuming by the square foot, flood cuts and baseboard by the linear foot, contents manipulation by the room, debris by the load, PPE by the technician-day, labor by the hour, and moisture mapping, thermal imaging, containment, dumpster, lead-safe setup and asbestos sampling by the each.'
    replaced_by: 'Every mitigation service line other than a tear-out debris haul-off line, a tear-out antimicrobial line and a final HEPA vacuuming line remains billed at the unit rate of the job''s tier for its service code multiplied by the quantity performed: extraction, antimicrobial, pad and carpet work and HEPA vacuuming by the square foot, flood cuts and baseboard by the linear foot, contents manipulation by the room, debris by the load, PPE by the technician-day, labor by the hour, and moisture mapping, thermal imaging, containment, dumpster, lead-safe setup and asbestos sampling by the each; for a job''s tear-out debris haul-off line, and only for that line, the loads and the per-load rate are set as follows, while the antimicrobial and final HEPA vacuuming lines are set by their own rules.'
  trigger: state_due
  subject:
  - water_mitigation_service_charge
  computes: amount
  target_tool: book_tearout_debris_a8b773d4
  params:
    flooring_load_sqft: 600
    wet2_load_sqft: 400
    wet1_load_sqft: 500
    drywall_load_lf: 120
    class3_load_lf: 80
    class2_load_lf: 100
    lead_trim_load_lf: 150
    cat3_trim_load_lf: 120
    access_multi: 1.2
    access_commercial: 1.1
    window_holiday: 1.5
    window_after_hours: 1.3
    san_cat3: 1.25
    san_cat2: 1.1
  rule: 'The job must be in authorized, drying or drying_complete status when a mitigation service line is charged. Every mitigation service line other than a tear-out debris haul-off line, a tear-out antimicrobial line and a final HEPA vacuuming line remains billed at the unit rate of the job''s tier for its service code multiplied by the quantity performed: extraction, antimicrobial, pad and carpet work and HEPA vacuuming by the square foot, flood cuts and baseboard by the linear foot, contents manipulation by the room, debris by the load, PPE by the technician-day, labor by the hour, and moisture mapping, thermal imaging, containment, dumpster, lead-safe setup and asbestos sampling by the each; for a job''s tear-out debris haul-off line, and only for that line, the loads and the per-load rate are set as follows, while the antimicrobial and final HEPA vacuuming lines are set by their own rules. A job''s tear-out debris is hauled off once and billed as one debris haul-off line in pickup-truck loads, dated the service date of the job''s latest flood cut line, or of its latest pad removal line when it has no flood cut line, or of its latest carpet removal line when it has neither; a job that already carries a debris haul-off line, or that carries no pad removal, carpet removal or flood cut line, is billed no tear-out debris line. The removed flooring area is the total square feet on the job''s pad removal and carpet removal lines, and the cut drywall run is the total linear feet on its flood cut lines. The flooring load size is 600 square feet of removed flooring per load. The drywall load size is 120 linear feet of cut drywall per load. The trim load term is zero, the baseboard being detached for reset. The loads are the removed flooring area divided by the flooring load size, plus the cut drywall run divided by the drywall load size, plus the trim load term, the total rounded up to a whole load. The per-load rate is the tier''s debris haul-off fee per load. The per-load rate is multiplied by every rate multiplier that applies to the line and then rounded to the cent, half up, and the line amount is the loads multiplied by that rounded per-load rate. Flooring that stood wet is heavier per square foot: when the job''s opened date is two or more days after its loss date, the flooring load size is 400 square feet per load; when the opened date is exactly one day after the loss date, it is 500 square feet per load; when the job was opened on its loss date, the standard flooring load size applies. The cut height follows the IICRC class of the intrusion: on a class_3 or class_4 job carrying flood cut lines, where walls are wet well above the floor, the drywall load size is 80 linear feet per load; on a class_2 job carrying flood cut lines it is 100 linear feet per load; on any other job the standard drywall load size applies. Trim disposal depends on the building and the water, measured on the baseboard run, the total linear feet on the job''s baseboard removal lines: in a building built before the RRP year-built cutoff of the job''s tier the baseboard is bagged as lead-painted trim and hauled as its own loads, so the trim load term is the baseboard run divided by 150 linear feet per load, rounded up to a whole load on its own; in a building built in or after that cutoff year on a category_3 job the contaminated baseboard is discarded with the drywall, so the trim load term is the baseboard run divided by 120 linear feet per load, not rounded on its own; in any other case the standard trim load term applies. Carrying removed flooring out of a shared building sets an access multiplier on the per-load rate: 1.2 for a condo_unit or multifamily_unit whose removed flooring area is above zero, 1.1 for a commercial property whose removed flooring area is above zero, and 1 in any other case. When the job''s latest flood cut line is dated the job''s opened date, the haul is made on the emergency dispatch and a haul-window multiplier applies to the per-load rate: 1.5 when the dispatch window is holiday and 1.3 when it is after_hours; in any other case the haul-window multiplier is 1. Contaminated debris is bagged and sealed before it leaves the property, setting a sanitation multiplier on the per-load rate: 1.25 on a category_3 job carrying pad removal or flood cut lines, 1.1 on a category_2 job carrying pad removal or flood cut lines, and 1 in any other case. Amounts are rounded to the cent, half up.'
  prerequisite: []
  cross_category: []
  compute:
  - prior_debris_lines: COUNT('water_charges', charge_code='debris_haul')
  - flooring_sqft: SUM('water_charges','quantity', charge_code='pad_removal') + SUM('water_charges','quantity', charge_code='carpet_removal')
  - cut_lf: SUM('water_charges','quantity', charge_code='flood_cut')
  - trim_lf: SUM('water_charges','quantity', charge_code='baseboard_removal')
  - stand_days: DAYS(F('loss_date'), F('opened_date'))
  - flooring_load_size: K('wet2_load_sqft') if stand_days >= 2 else (K('wet1_load_sqft') if stand_days == 1 else K('flooring_load_sqft'))
  - cut_line_count_d: COUNT('water_charges', charge_code='flood_cut')
  - drywall_load_size: K('class3_load_lf') if ((F('water_class') == 'class_3' or F('water_class') == 'class_4') and cut_line_count_d > 0) else (K('class2_load_lf') if (F('water_class') == 'class_2' and cut_line_count_d > 0) else K('drywall_load_lf'))
  - trim_load_term: (-((-(trim_lf / K('lead_trim_load_lf')))//1)) if int(F('year_built')) < P('rrp_year_built_cutoff') else (trim_lf / K('cat3_trim_load_lf') if F('water_category') == 'category_3' else 0)
  - access_flooring_lines: COUNT('water_charges', charge_code='pad_removal') + COUNT('water_charges', charge_code='carpet_removal')
  - access_multiplier: K('access_multi') if ((F('property_type') == 'condo_unit' or F('property_type') == 'multifamily_unit') and access_flooring_lines > 0) else (K('access_commercial') if (F('property_type') == 'commercial' and access_flooring_lines > 0) else 1)
  - cut_date: LATEST('water_charges','service_date', date_field='service_date', charge_code='flood_cut')
  - window_multiplier: K('window_holiday') if (cut_date == F('opened_date') and F('dispatch_window') == 'holiday') else (K('window_after_hours') if (cut_date == F('opened_date') and F('dispatch_window') == 'after_hours') else 1)
  - porous_lines: COUNT('water_charges', charge_code='pad_removal') + COUNT('water_charges', charge_code='flood_cut')
  - sanitation_multiplier: K('san_cat3') if (F('water_category') == 'category_3' and porous_lines > 0) else (K('san_cat2') if (F('water_category') == 'category_2' and porous_lines > 0) else 1)
  - loads: (-((-(flooring_sqft / flooring_load_size + cut_lf / drywall_load_size + trim_load_term))//1))
  - load_rate: RND(P('debris_haul_fee_per_load') * access_multiplier * window_multiplier * sanitation_multiplier + 0.000000001, 2)
  - debris_tearout_lines: COUNT('water_charges', charge_code='pad_removal') + COUNT('water_charges', charge_code='carpet_removal') + COUNT('water_charges', charge_code='flood_cut')
  - result: 0 if (prior_debris_lines > 0 or debris_tearout_lines == 0) else RND(loads * load_rate + 0.000000001, 2)
  compute_basis:
    prior_debris_lines: A job's tear-out debris is hauled off once and billed as one debris haul-off line in pickup-truck loads, dated the service date of the job's latest flood cut line, or of its latest pad removal line when it has no flood cut line, or of its latest carpet removal line when it has neither; a job that already carries a debris haul-off line, or that carries no pad removal, carpet removal or flood cut line, is billed no tear-out debris line.
    flooring_sqft: The removed flooring area is the total square feet on the job's pad removal and carpet removal lines, and the cut drywall run is the total linear feet on its flood cut lines.
    cut_lf: The removed flooring area is the total square feet on the job's pad removal and carpet removal lines, and the cut drywall run is the total linear feet on its flood cut lines.
    trim_lf: 'Trim disposal depends on the building and the water, measured on the baseboard run, the total linear feet on the job''s baseboard removal lines: in a building built before the RRP year-built cutoff of the job''s tier the baseboard is bagged as lead-painted trim and hauled as its own loads, so the trim load term is the baseboard run divided by 150 linear feet per load, rounded up to a whole load on its own; in a building built in or after that cutoff year on a category_3 job the contaminated baseboard is discarded with the drywall, so the trim load term is the baseboard run divided by 120 linear feet per load, not rounded on its own; in any other case the standard trim load term applies.'
    stand_days: 'Flooring that stood wet is heavier per square foot: when the job''s opened date is two or more days after its loss date, the flooring load size is 400 square feet per load; when the opened date is exactly one day after the loss date, it is 500 square feet per load; when the job was opened on its loss date, the standard flooring load size applies.'
    flooring_load_size: 'Flooring that stood wet is heavier per square foot: when the job''s opened date is two or more days after its loss date, the flooring load size is 400 square feet per load; when the opened date is exactly one day after the loss date, it is 500 square feet per load; when the job was opened on its loss date, the standard flooring load size applies.'
    drywall_load_size: 'The cut height follows the IICRC class of the intrusion: on a class_3 or class_4 job carrying flood cut lines, where walls are wet well above the floor, the drywall load size is 80 linear feet per load; on a class_2 job carrying flood cut lines it is 100 linear feet per load; on any other job the standard drywall load size applies.'
    trim_load_term: 'Trim disposal depends on the building and the water, measured on the baseboard run, the total linear feet on the job''s baseboard removal lines: in a building built before the RRP year-built cutoff of the job''s tier the baseboard is bagged as lead-painted trim and hauled as its own loads, so the trim load term is the baseboard run divided by 150 linear feet per load, rounded up to a whole load on its own; in a building built in or after that cutoff year on a category_3 job the contaminated baseboard is discarded with the drywall, so the trim load term is the baseboard run divided by 120 linear feet per load, not rounded on its own; in any other case the standard trim load term applies.'
    access_multiplier: 'Carrying removed flooring out of a shared building sets an access multiplier on the per-load rate: 1.2 for a condo_unit or multifamily_unit whose removed flooring area is above zero, 1.1 for a commercial property whose removed flooring area is above zero, and 1 in any other case.'
    access_flooring_lines: 'Carrying removed flooring out of a shared building sets an access multiplier on the per-load rate: 1.2 for a condo_unit or multifamily_unit whose removed flooring area is above zero, 1.1 for a commercial property whose removed flooring area is above zero, and 1 in any other case.'
    cut_line_count_d: 'The cut height follows the IICRC class of the intrusion: on a class_3 or class_4 job carrying flood cut lines, where walls are wet well above the floor, the drywall load size is 80 linear feet per load; on a class_2 job carrying flood cut lines it is 100 linear feet per load; on any other job the standard drywall load size applies.'
    porous_lines: 'Contaminated debris is bagged and sealed before it leaves the property, setting a sanitation multiplier on the per-load rate: 1.25 on a category_3 job carrying pad removal or flood cut lines, 1.1 on a category_2 job carrying pad removal or flood cut lines, and 1 in any other case.'
    cut_date: 'When the job''s latest flood cut line is dated the job''s opened date, the haul is made on the emergency dispatch and a haul-window multiplier applies to the per-load rate: 1.5 when the dispatch window is holiday and 1.3 when it is after_hours; in any other case the haul-window multiplier is 1.'
    window_multiplier: 'When the job''s latest flood cut line is dated the job''s opened date, the haul is made on the emergency dispatch and a haul-window multiplier applies to the per-load rate: 1.5 when the dispatch window is holiday and 1.3 when it is after_hours; in any other case the haul-window multiplier is 1.'
    sanitation_multiplier: 'Contaminated debris is bagged and sealed before it leaves the property, setting a sanitation multiplier on the per-load rate: 1.25 on a category_3 job carrying pad removal or flood cut lines, 1.1 on a category_2 job carrying pad removal or flood cut lines, and 1 in any other case.'
    loads: The loads are the removed flooring area divided by the flooring load size, plus the cut drywall run divided by the drywall load size, plus the trim load term, the total rounded up to a whole load.
    load_rate: The per-load rate is multiplied by every rate multiplier that applies to the line and then rounded to the cent, half up, and the line amount is the loads multiplied by that rounded per-load rate.
    debris_tearout_lines: A job's tear-out debris is hauled off once and billed as one debris haul-off line in pickup-truck loads, dated the service date of the job's latest flood cut line, or of its latest pad removal line when it has no flood cut line, or of its latest carpet removal line when it has neither; a job that already carries a debris haul-off line, or that carries no pad removal, carpet removal or flood cut line, is billed no tear-out debris line.
    result: A job's tear-out debris is hauled off once and billed as one debris haul-off line in pickup-truck loads, dated the service date of the job's latest flood cut line, or of its latest pad removal line when it has no flood cut line, or of its latest carpet removal line when it has neither; a job that already carries a debris haul-off line, or that carries no pad removal, carpet removal or flood cut line, is billed no tear-out debris line.
  factors:
  - id: wet_flooring_load
    effect: parameter
    decides: flooring_load_size
    bindings:
    - stand_days
    - flooring_load_size
    ladder:
    - when: the job's opened date is two or more days after its loss date
      value: K('wet2_load_sqft')
    - when: the job's opened date is exactly one day after its loss date
      value: K('wet1_load_sqft')
    - when: otherwise (opened on the loss date)
      value: K('flooring_load_sqft')
    baseline:
      flooring_load_size: K('flooring_load_sqft')
    evidence:
    - date
    cross_difficulty: null
  - id: class_cut_height
    effect: parameter
    decides: drywall_load_size
    bindings:
    - cut_line_count_d
    - drywall_load_size
    ladder:
    - when: the job is class_3 or class_4 and carries flood cut lines
      value: K('class3_load_lf')
    - when: the job is class_2 and carries flood cut lines
      value: K('class2_load_lf')
    - when: otherwise
      value: K('drywall_load_lf')
    baseline:
      drywall_load_size: K('drywall_load_lf')
    evidence:
    - tier_param
    cross_difficulty: null
  - id: trim_disposal
    effect: method
    decides: trim_load_term
    bindings:
    - trim_lf
    - trim_load_term
    ladder:
    - when: the building was built before the tier's RRP year-built cutoff
      method: the baseboard run divided by 150 linear feet per load, rounded up to a whole load on its own
    - when: the building was built in or after that cutoff year and the job is category_3
      method: the baseboard run divided by 120 linear feet per load, added unrounded to the drywall and flooring loads
    - when: otherwise
      method: no trim debris (the baseboard is detached for reset)
    baseline:
      trim_load_term: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: carry_out_access
    effect: parameter
    decides: access_multiplier
    bindings:
    - access_flooring_lines
    - access_multiplier
    ladder:
    - when: the property is a condo_unit or multifamily_unit and the removed flooring area is above zero
      value: K('access_multi')
    - when: the property is commercial and the removed flooring area is above zero
      value: K('access_commercial')
    - when: otherwise
      value: '1'
    baseline:
      access_multiplier: '1'
    evidence:
    - tier_param
    cross_difficulty: null
  - id: dispatch_haul_window
    effect: parameter
    decides: window_multiplier
    bindings:
    - cut_date
    - window_multiplier
    ladder:
    - when: the latest flood cut line is dated the job's opened date and the dispatch window is holiday
      value: K('window_holiday')
    - when: the latest flood cut line is dated the job's opened date and the dispatch window is after_hours
      value: K('window_after_hours')
    - when: otherwise
      value: '1'
    baseline:
      window_multiplier: '1'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: sealed_bagging
    effect: parameter
    decides: sanitation_multiplier
    bindings:
    - porous_lines
    - sanitation_multiplier
    ladder:
    - when: the job is category_3 and carries pad removal or flood cut lines
      value: K('san_cat3')
    - when: the job is category_2 and carries pad removal or flood cut lines
      value: K('san_cat2')
    - when: otherwise
      value: '1'
    baseline:
      sanitation_multiplier: '1'
    evidence:
    - tier_param
    cross_difficulty: null
  baseline:
    rule: The removed flooring area is the total square feet on the job's pad removal and carpet removal lines, and the cut drywall run is the total linear feet on its flood cut lines. The flooring load size is 600 square feet of removed flooring per load. The drywall load size is 120 linear feet of cut drywall per load. The trim load term is zero, the baseboard being detached for reset. The loads are the removed flooring area divided by the flooring load size, plus the cut drywall run divided by the drywall load size, plus the trim load term, the total rounded up to a whole load. The per-load rate is the tier's debris haul-off fee per load. The per-load rate is multiplied by every rate multiplier that applies to the line and then rounded to the cent, half up, and the line amount is the loads multiplied by that rounded per-load rate. Amounts are rounded to the cent, half up.
    params:
    - flooring_load_sqft
    - drywall_load_lf
    - debris_haul_fee_per_load
  inputs:
    history:
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: pad_removal
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: flood_cut
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: baseboard_removal
    - table: water_charges
      aggregate: latest
      field: service_date
      filters:
        charge_code: flood_cut
    cross_category: []
- id: water_ext_tearout_antimicrobial
  base_policy_refs:
  - water_evt_mitigation_services
  - water_regulated_materials
  - water_agg_same_loss_job
  overwrite:
  - base_policy: water_evt_mitigation_services
    superseded_clause: 'Each mitigation service is billed at the unit rate of the job''s tier for its service code, multiplied by the quantity performed: extraction, antimicrobial, pad and carpet work and HEPA vacuuming by the square foot, flood cuts and baseboard by the linear foot, contents manipulation by the room, debris by the load, PPE by the technician-day, labor by the hour, and moisture mapping, thermal imaging, containment, dumpster, lead-safe setup and asbestos sampling by the each.'
    replaced_by: 'Every mitigation service line other than a tear-out antimicrobial line, a tear-out debris haul-off line and a final HEPA vacuuming line remains billed at the unit rate of the job''s tier for its service code multiplied by the quantity performed: extraction, antimicrobial, pad and carpet work and HEPA vacuuming by the square foot, flood cuts and baseboard by the linear foot, contents manipulation by the room, debris by the load, PPE by the technician-day, labor by the hour, and moisture mapping, thermal imaging, containment, dumpster, lead-safe setup and asbestos sampling by the each; for a job''s tear-out antimicrobial line, and only for that line, the treated area, the coverage and the unit rate are set as follows, while the debris haul-off and final HEPA vacuuming lines are set by their own rules.'
  trigger: state_due
  subject:
  - water_mitigation_service_charge
  computes: amount
  target_tool: book_tearout_antimicrobial_173ee43e
  params:
    wall_height_class3_ft: 8
    wall_height_class2_ft: 2
    coverage_wet2: 1.5
    coverage_wet1: 1.25
    handling_lead: 1.3
    handling_asbestos: 1.1
  rule: 'The job must be in authorized, drying or drying_complete status when a mitigation service line is charged, and antimicrobial is billed only on tiers where antimicrobial treatment is required. Every mitigation service line other than a tear-out antimicrobial line, a tear-out debris haul-off line and a final HEPA vacuuming line remains billed at the unit rate of the job''s tier for its service code multiplied by the quantity performed: extraction, antimicrobial, pad and carpet work and HEPA vacuuming by the square foot, flood cuts and baseboard by the linear foot, contents manipulation by the room, debris by the load, PPE by the technician-day, labor by the hour, and moisture mapping, thermal imaging, containment, dumpster, lead-safe setup and asbestos sampling by the each; for a job''s tear-out antimicrobial line, and only for that line, the treated area, the coverage and the unit rate are set as follows, while the debris haul-off and final HEPA vacuuming lines are set by their own rules. The surfaces a tear-out exposes are treated once and billed as one tear-out antimicrobial line in square feet, dated the service date of the job''s latest flood cut line, or of its latest pad removal line when it has no flood cut line, or of its latest carpet removal line when it has neither; a job that already carries an antimicrobial line, or that carries no pad removal, carpet removal or flood cut line, is billed no tear-out antimicrobial line. The treated floor is the affected floor area mapped on the job. The treated wall and ceiling area is zero. The coverage factor is 1. The unit rate is the tier''s antimicrobial rate per square foot. The billed square feet are the treated floor plus the treated wall and ceiling area, multiplied by the coverage factor and rounded to two decimals, half up; the unit rate is multiplied by every rate multiplier that applies to the line and rounded to the cent, half up; the line amount is the billed square feet multiplied by that rounded unit rate, rounded to the cent, half up. The surfaces wetted follow the IICRC class: on a class_3 job, where water came from above, the treated wall and ceiling area is the baseboard run on the job''s baseboard removal lines times 8 feet of wall height plus the affected floor area again for the ceiling; on a class_2 job it is the baseboard run times 2 feet of wicking height; on any other job the standard treated wall and ceiling area applies. How the carpet came up sets the treated floor: when the job carries pad removal lines and carpet detach-and-reset lines, the back of the lifted carpet is treated along with the floor, so the treated floor is the affected floor area plus the square feet on the carpet detach-and-reset lines; when it carries pad removal lines and carpet removal lines, the treated floor is the larger of the affected floor area and the square feet on the carpet removal lines, because the discarded carpet often runs past the mapped wet area; in any other case the standard treated floor applies. Material that stood wet longer takes a heavier application: when the job''s opened date is two or more days after its loss date the coverage factor is 1.5, when it is exactly one day after the loss date the coverage factor is 1.25, and when the job was opened on its loss date the standard coverage factor applies. Surfaces inside a regulated work area are wet-wiped rather than sprayed, setting a handling multiplier on the unit rate: 1.3 when the building was built before the RRP year-built cutoff of the job''s tier and the job carries a lead-safe setup line, 1.1 when the building was built before the asbestos sampling year cutoff and the job carries an asbestos sampling line but no lead-safe setup line, and 1 in any other case. Amounts are rounded to the cent, half up.'
