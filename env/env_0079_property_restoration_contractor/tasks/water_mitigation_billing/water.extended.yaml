  cross_category: []
  compute:
  - prior_anti_lines: COUNT('water_charges', charge_code='antimicrobial')
  - tearout_lines: COUNT('water_charges', charge_code='pad_removal') + COUNT('water_charges', charge_code='carpet_removal') + COUNT('water_charges', charge_code='flood_cut')
  - pad_sqft: SUM('water_charges','quantity', charge_code='pad_removal')
  - detach_sqft: SUM('water_charges','quantity', charge_code='carpet_detach_reset')
  - carpet_out_sqft: SUM('water_charges','quantity', charge_code='carpet_removal')
  - treated_floor: F('affected_area_sqft') + detach_sqft if (pad_sqft > 0 and detach_sqft > 0) else (MX(F('affected_area_sqft'), carpet_out_sqft) if (pad_sqft > 0 and carpet_out_sqft > 0) else F('affected_area_sqft'))
  - base_run_lf: SUM('water_charges','quantity', charge_code='baseboard_removal')
  - treated_wall_ceiling: base_run_lf * K('wall_height_class3_ft') + F('affected_area_sqft') if F('water_class') == 'class_3' else (base_run_lf * K('wall_height_class2_ft') if F('water_class') == 'class_2' else 0)
  - anti_stand_days: DAYS(F('loss_date'), F('opened_date'))
  - coverage_factor: K('coverage_wet2') if anti_stand_days >= 2 else (K('coverage_wet1') if anti_stand_days == 1 else 1)
  - lead_setup_lines: COUNT('water_charges', charge_code='lead_safe_setup')
  - sampling_lines: COUNT('water_charges', charge_code='asbestos_sampling')
  - handling_multiplier: K('handling_lead') if (int(F('year_built')) < P('rrp_year_built_cutoff') and lead_setup_lines > 0) else (K('handling_asbestos') if (int(F('year_built')) < P('asbestos_sampling_year_cutoff') and sampling_lines > 0 and lead_setup_lines == 0) else 1)
  - billed_sqft: RND((treated_floor + treated_wall_ceiling) * coverage_factor + 0.000000001, 2)
  - anti_unit_rate: RND(P('antimicrobial_rate_per_sqft') * handling_multiplier + 0.000000001, 2)
  - result: 0 if (prior_anti_lines > 0 or tearout_lines == 0 or not P('antimicrobial_required')) else RND(billed_sqft * anti_unit_rate + 0.000000001, 2)
  compute_basis:
    prior_anti_lines: The surfaces a tear-out exposes are treated once and billed as one tear-out antimicrobial line in square feet, dated the service date of the job's latest flood cut line, or of its latest pad removal line when it has no flood cut line, or of its latest carpet removal line when it has neither; a job that already carries an antimicrobial line, or that carries no pad removal, carpet removal or flood cut line, is billed no tear-out antimicrobial line.
    tearout_lines: The surfaces a tear-out exposes are treated once and billed as one tear-out antimicrobial line in square feet, dated the service date of the job's latest flood cut line, or of its latest pad removal line when it has no flood cut line, or of its latest carpet removal line when it has neither; a job that already carries an antimicrobial line, or that carries no pad removal, carpet removal or flood cut line, is billed no tear-out antimicrobial line.
    pad_sqft: 'How the carpet came up sets the treated floor: when the job carries pad removal lines and carpet detach-and-reset lines, the back of the lifted carpet is treated along with the floor, so the treated floor is the affected floor area plus the square feet on the carpet detach-and-reset lines; when it carries pad removal lines and carpet removal lines, the treated floor is the larger of the affected floor area and the square feet on the carpet removal lines, because the discarded carpet often runs past the mapped wet area; in any other case the standard treated floor applies.'
    detach_sqft: 'How the carpet came up sets the treated floor: when the job carries pad removal lines and carpet detach-and-reset lines, the back of the lifted carpet is treated along with the floor, so the treated floor is the affected floor area plus the square feet on the carpet detach-and-reset lines; when it carries pad removal lines and carpet removal lines, the treated floor is the larger of the affected floor area and the square feet on the carpet removal lines, because the discarded carpet often runs past the mapped wet area; in any other case the standard treated floor applies.'
    carpet_out_sqft: 'How the carpet came up sets the treated floor: when the job carries pad removal lines and carpet detach-and-reset lines, the back of the lifted carpet is treated along with the floor, so the treated floor is the affected floor area plus the square feet on the carpet detach-and-reset lines; when it carries pad removal lines and carpet removal lines, the treated floor is the larger of the affected floor area and the square feet on the carpet removal lines, because the discarded carpet often runs past the mapped wet area; in any other case the standard treated floor applies.'
    treated_floor: 'How the carpet came up sets the treated floor: when the job carries pad removal lines and carpet detach-and-reset lines, the back of the lifted carpet is treated along with the floor, so the treated floor is the affected floor area plus the square feet on the carpet detach-and-reset lines; when it carries pad removal lines and carpet removal lines, the treated floor is the larger of the affected floor area and the square feet on the carpet removal lines, because the discarded carpet often runs past the mapped wet area; in any other case the standard treated floor applies.'
    base_run_lf: 'The surfaces wetted follow the IICRC class: on a class_3 job, where water came from above, the treated wall and ceiling area is the baseboard run on the job''s baseboard removal lines times 8 feet of wall height plus the affected floor area again for the ceiling; on a class_2 job it is the baseboard run times 2 feet of wicking height; on any other job the standard treated wall and ceiling area applies.'
    treated_wall_ceiling: 'The surfaces wetted follow the IICRC class: on a class_3 job, where water came from above, the treated wall and ceiling area is the baseboard run on the job''s baseboard removal lines times 8 feet of wall height plus the affected floor area again for the ceiling; on a class_2 job it is the baseboard run times 2 feet of wicking height; on any other job the standard treated wall and ceiling area applies.'
    anti_stand_days: 'Material that stood wet longer takes a heavier application: when the job''s opened date is two or more days after its loss date the coverage factor is 1.5, when it is exactly one day after the loss date the coverage factor is 1.25, and when the job was opened on its loss date the standard coverage factor applies.'
    coverage_factor: 'Material that stood wet longer takes a heavier application: when the job''s opened date is two or more days after its loss date the coverage factor is 1.5, when it is exactly one day after the loss date the coverage factor is 1.25, and when the job was opened on its loss date the standard coverage factor applies.'
    handling_multiplier: 'Surfaces inside a regulated work area are wet-wiped rather than sprayed, setting a handling multiplier on the unit rate: 1.3 when the building was built before the RRP year-built cutoff of the job''s tier and the job carries a lead-safe setup line, 1.1 when the building was built before the asbestos sampling year cutoff and the job carries an asbestos sampling line but no lead-safe setup line, and 1 in any other case.'
    lead_setup_lines: 'Surfaces inside a regulated work area are wet-wiped rather than sprayed, setting a handling multiplier on the unit rate: 1.3 when the building was built before the RRP year-built cutoff of the job''s tier and the job carries a lead-safe setup line, 1.1 when the building was built before the asbestos sampling year cutoff and the job carries an asbestos sampling line but no lead-safe setup line, and 1 in any other case.'
    sampling_lines: 'Surfaces inside a regulated work area are wet-wiped rather than sprayed, setting a handling multiplier on the unit rate: 1.3 when the building was built before the RRP year-built cutoff of the job''s tier and the job carries a lead-safe setup line, 1.1 when the building was built before the asbestos sampling year cutoff and the job carries an asbestos sampling line but no lead-safe setup line, and 1 in any other case.'
    billed_sqft: The billed square feet are the treated floor plus the treated wall and ceiling area, multiplied by the coverage factor and rounded to two decimals, half up; the unit rate is multiplied by every rate multiplier that applies to the line and rounded to the cent, half up; the line amount is the billed square feet multiplied by that rounded unit rate, rounded to the cent, half up.
    anti_unit_rate: The billed square feet are the treated floor plus the treated wall and ceiling area, multiplied by the coverage factor and rounded to two decimals, half up; the unit rate is multiplied by every rate multiplier that applies to the line and rounded to the cent, half up; the line amount is the billed square feet multiplied by that rounded unit rate, rounded to the cent, half up.
    result: The job must be in authorized, drying or drying_complete status when a mitigation service line is charged, and antimicrobial is billed only on tiers where antimicrobial treatment is required.
  factors:
  - id: class_wetted_surfaces
    effect: method
    decides: treated_wall_ceiling
    bindings:
    - base_run_lf
    - treated_wall_ceiling
    ladder:
    - when: the job is class_3
      method: baseboard run times 8 feet of wall height, plus the affected floor area again for the ceiling
    - when: the job is class_2
      method: baseboard run times 2 feet of wicking height
    - when: otherwise
      method: no wall or ceiling area
    baseline:
      treated_wall_ceiling: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: carpet_lift_treatment
    effect: method
    decides: treated_floor
    bindings:
    - pad_sqft
    - detach_sqft
    - carpet_out_sqft
    - treated_floor
    ladder:
    - when: the job carries pad removal lines and carpet detach-and-reset lines
      method: the affected floor area plus the square feet on the carpet detach-and-reset lines
    - when: the job carries pad removal lines and carpet removal lines
      method: the larger of the affected floor area and the square feet on the carpet removal lines
    - when: otherwise
      method: the affected floor area mapped on the job
    baseline:
      treated_floor: F('affected_area_sqft')
    evidence:
    - history
    cross_difficulty: null
  - id: stood_wet_coverage
    effect: parameter
    decides: coverage_factor
    bindings:
    - anti_stand_days
    - coverage_factor
    ladder:
    - when: the job's opened date is two or more days after its loss date
      value: K('coverage_wet2')
    - when: the job's opened date is exactly one day after its loss date
      value: K('coverage_wet1')
    - when: otherwise (opened on the loss date)
      value: '1'
    baseline:
      coverage_factor: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: regulated_wet_wipe
    effect: parameter
    decides: handling_multiplier
    bindings:
    - lead_setup_lines
    - sampling_lines
    - handling_multiplier
    ladder:
    - when: the building was built before the tier's RRP year-built cutoff and the job carries a lead-safe setup line
      value: K('handling_lead')
    - when: the building was built before the asbestos sampling year cutoff and the job carries an asbestos sampling line but no lead-safe setup line
      value: K('handling_asbestos')
    - when: otherwise
      value: '1'
    baseline:
      handling_multiplier: '1'
    evidence:
    - tier_param
    cross_difficulty: null
  baseline:
    rule: The treated floor is the affected floor area mapped on the job. The treated wall and ceiling area is zero. The coverage factor is 1. The unit rate is the tier's antimicrobial rate per square foot. The billed square feet are the treated floor plus the treated wall and ceiling area, multiplied by the coverage factor and rounded to two decimals, half up; the unit rate is multiplied by every rate multiplier that applies to the line and rounded to the cent, half up; the line amount is the billed square feet multiplied by that rounded unit rate, rounded to the cent, half up. Amounts are rounded to the cent, half up.
    params:
    - antimicrobial_rate_per_sqft
  inputs:
    history:
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: pad_removal
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: baseboard_removal
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: carpet_detach_reset
    cross_category: []
- id: water_ext_drying_deposit
  base_policy_refs:
  - water_authorization
  - water_evt_customer_payment
  - water_agg_same_loss_job
  - water_evt_equipment_days
  - water_tier_assignment
  overwrite:
  - base_policy: water_authorization
    superseded_clause: Drying equipment may be set on a self-pay job only after customer payments posted to the job total at least the tier's self-pay deposit.
    replaced_by: Drying equipment may be set on a self-pay job only after customer payments posted to the job cover every charge posted to the job plus the drying deposit, the drying deposit being worked out as follows; insurance-funded jobs collect no drying deposit, because the deductible is collected on the claim file rather than on the job.
  - base_policy: water_evt_customer_payment
    superseded_clause: Customer payments are accepted by credit card, debit card, ACH or check and are posted in full to the one job they name.
    replaced_by: Customer payments other than the drying deposit remain accepted by credit card, debit card, ACH or check, and every customer payment is posted in full to the one job it names; the drying deposit is taken by debit card, ACH or check only, so no card surcharge arises on it.
  trigger: on_request
  subject:
  - water_customer_payment
  computes: amount
  target_tool: pay_drying_deposit_ee9a2909
  params:
    am_floor_sqft: 60
    am_wall_lf: 14
    am_ceiling_sqft: 125
    dehu_sqft: 500
    credit_long: 1.5
    credit_short: 1.25
    credit_long_days: 60
    structure_shared: 1.15
    structure_commercial: 1.1
    deposit_share: 0.6
  rule: 'The job must be in authorized status when the drying deposit is collected, and only a self_pay job collects one; the drying deposit is the customer''s own payment, made by the customer through the company''s secure payment channel, and staff never take card numbers. Drying equipment may be set on a self-pay job only after customer payments posted to the job cover every charge posted to the job plus the drying deposit, the drying deposit being worked out as follows; insurance-funded jobs collect no drying deposit, because the deductible is collected on the claim file rather than on the job. Customer payments other than the drying deposit remain accepted by credit card, debit card, ACH or check, and every customer payment is posted in full to the one job it names; the drying deposit is taken by debit card, ACH or check only, so no card surcharge arises on it. On a job carrying pad removal, carpet removal or flood cut lines, the amount collected before drying equipment is set is fixed only after the job carries a debris haul-off line. On a tier that requires antimicrobial treatment, the amount collected before drying equipment is set on a job carrying pad removal, carpet removal or flood cut lines is not worked out until the job carries an antimicrobial line. The drying estimate prices the drying equipment the job will run: air movers at the tier''s air mover daily rate, dehumidifiers at a dehumidifier daily rate and air scrubbers at the tier''s air scrubber daily rate, for a number of drying days. The standard air mover count is one air mover for every 60 square feet of the affected floor area, rounded up. The dehumidifiers are one for every 500 square feet of the affected floor area, rounded up, and the standard dehumidifier daily rate is the tier''s LGR dehumidifier daily rate. The standard drying days are the tier''s billable drying day cap. The standard air scrubber count is one where the tier requires an air scrubber and none otherwise. The daily equipment cost is the air movers times the air mover daily rate, plus the dehumidifiers times the dehumidifier daily rate, plus the air scrubbers times the air scrubber daily rate; the drying estimate is the daily equipment cost times the drying days, multiplied by every estimate multiplier that applies to the job. The drying deposit is 60 percent of the drying estimate, rounded to the cent, half up, but never less than the tier''s self-pay deposit. The amount collected is the drying deposit plus every charge posted to the job, less every customer payment posted to the job and plus any refund issued from those payments, rounded to the cent, half up; when that amount is zero or less nothing is collected. Air mover placement follows the IICRC class: on a class_3 job the air movers are one for every 60 square feet of the affected floor area, plus one for every 14 linear feet of the baseboard run on the job''s baseboard removal lines, plus one for every 125 square feet of ceiling taken as the affected floor area, each of the three terms rounded up on its own; on a class_2 job they are the floor term plus the wall term, each rounded up on its own; on any other job the standard air mover count applies. Dehumidifier capacity follows the IICRC class and the open cavities: on a class_4 job carrying flood cut lines the dehumidifier daily rate is the tier''s desiccant dehumidifier daily rate, on a class_3 job carrying flood cut lines it is the tier''s large-capacity XL LGR dehumidifier daily rate, and on any other job the standard dehumidifier daily rate applies. Water that stood before the crew arrived lengthens drying: when the job''s opened date is two or more days after its loss date the drying days are the tier''s billable drying day cap plus one day, when the job was opened on its loss date they are the cap less one day, and in any other case the standard drying days apply. Tear-out raises dust in the drying chamber: on a category_3 job carrying flood cut lines the air scrubbers are two more than the standard air scrubber count, on a category_2 job carrying flood cut lines they are one more than the standard air scrubber count, and on any other job the standard air scrubber count applies. A customer whose invoiced mold remediation job with the company is past due pays a larger drying deposit: when the balance due on the customer''s mold remediation job in invoiced status is above zero and today is more than 60 days after that job''s payment due date, a credit multiplier of 1.5 applies to the drying estimate; when that balance due is above zero and today is 1 to 60 days after the payment due date, a credit multiplier of 1.25 applies; in any other case, including a customer with no invoiced mold remediation job, the credit multiplier is 1. When the customer holds more than one mold remediation job in invoiced status, the drying deposit is set by a human representative. Water that stood in a shared building spreads into the neighbouring structure and widens the drying chamber: a structure multiplier of 1.15 applies to the drying estimate on a condo_unit or multifamily_unit whose opened date is one or more days after its loss date, 1.1 on a commercial property whose opened date is one or more days after its loss date, and 1 in any other case.'
  prerequisite:
  - problem: water_ext_tearout_debris
    kind: value_input
    gate: charges_posted
    form: state
    policy_source: On a job carrying pad removal, carpet removal or flood cut lines, the amount collected before drying equipment is set is fixed only after the job carries a debris haul-off line.
    condition: The job carries a water_charges line with charge_code debris_haul whenever it carries pad_removal, carpet_removal or flood_cut lines.
    resolved_by: book_tearout_debris_a8b773d4
    effect: Booking the debris haul-off line raises the charges posted to the job by the line amount, which raises the amount collected by the same amount.
  - problem: water_ext_tearout_antimicrobial
    kind: value_input
    gate: charges_posted
    form: state
    policy_source: On a tier that requires antimicrobial treatment, the amount collected before drying equipment is set on a job carrying pad removal, carpet removal or flood cut lines is not worked out until the job carries an antimicrobial line.
    condition: On a tier whose antimicrobial_required is true, the job carries a water_charges line with charge_code antimicrobial whenever it carries pad_removal, carpet_removal or flood_cut lines.
    resolved_by: book_tearout_antimicrobial_173ee43e
    effect: Booking the tear-out antimicrobial line raises the charges posted to the job by the line amount, which raises the amount collected by the same amount.
  cross_category:
  - category: mold
    as: branch
    reads:
    - status
    - balance_due
    - payment_due_date
    note: past_due_mold_credit reads the balance due and payment due date of the customer's invoiced mold remediation job
  compute:
  - area: F('affected_area_sqft')
  - dep_run_lf: SUM('water_charges','quantity', charge_code='baseboard_removal')
  - floor_movers: (-((-(area / K('am_floor_sqft')))//1))
  - air_movers: floor_movers + (-((-(dep_run_lf / K('am_wall_lf')))//1)) + (-((-(area / K('am_ceiling_sqft')))//1)) if F('water_class') == 'class_3' else (floor_movers + (-((-(dep_run_lf / K('am_wall_lf')))//1)) if F('water_class') == 'class_2' else floor_movers)
  - dehumidifiers: (-((-(area / K('dehu_sqft')))//1))
  - dehu_cut_lines: COUNT('water_charges', charge_code='flood_cut')
  - dehu_rate: P('desiccant_dehumidifier_daily_rate') if (F('water_class') == 'class_4' and dehu_cut_lines > 0) else (P('xl_dehumidifier_daily_rate') if (F('water_class') == 'class_3' and dehu_cut_lines > 0) else P('lgr_dehumidifier_daily_rate'))
  - dep_stand_days: DAYS(F('loss_date'), F('opened_date'))
  - drying_days: P('billable_drying_day_cap') + 1 if dep_stand_days >= 2 else (P('billable_drying_day_cap') - 1 if dep_stand_days == 0 else P('billable_drying_day_cap'))
  - standard_scrubbers: 1 if P('air_scrubber_required') else 0
  - cut_line_count: COUNT('water_charges', charge_code='flood_cut')
  - air_scrubbers: standard_scrubbers + 2 if (F('water_category') == 'category_3' and cut_line_count > 0) else (standard_scrubbers + 1 if (F('water_category') == 'category_2' and cut_line_count > 0) else standard_scrubbers)
  - mold_balance_amt: CFIELD('mold','balance_due', status='invoiced') or 0
  - mold_due_date: CFIELD('mold','payment_due_date', status='invoiced')
  - mold_days_late: DAYS(mold_due_date, NOW) if mold_due_date else 0
  - credit_multiplier: K('credit_long') if (mold_balance_amt > 0 and mold_days_late > K('credit_long_days')) else (K('credit_short') if (mold_balance_amt > 0 and mold_days_late >= 1) else 1)
  - spread_days: DAYS(F('loss_date'), F('opened_date'))
  - structure_multiplier: K('structure_shared') if ((F('property_type') == 'condo_unit' or F('property_type') == 'multifamily_unit') and spread_days >= 1) else (K('structure_commercial') if (F('property_type') == 'commercial' and spread_days >= 1) else 1)
  - daily_cost: air_movers * P('air_mover_daily_rate') + dehumidifiers * dehu_rate + air_scrubbers * P('air_scrubber_daily_rate')
  - drying_estimate: daily_cost * drying_days * structure_multiplier * credit_multiplier
  - drying_deposit: MX(P('self_pay_deposit_amount'), RND(drying_estimate * K('deposit_share') + 0.000000001, 2))
  - charges_posted: SUM('water_charges','amount')
  - payments_posted: SUM('water_payments','amount', event_type='water_customer_payment')
  - refunds_issued: SUM('water_payments','amount', event_type='water_refund')
  - result: MX(0, RND(drying_deposit + charges_posted - payments_posted + refunds_issued + 0.000000001, 2))
  compute_basis:
    area: The standard air mover count is one air mover for every 60 square feet of the affected floor area, rounded up.
    dep_run_lf: 'Air mover placement follows the IICRC class: on a class_3 job the air movers are one for every 60 square feet of the affected floor area, plus one for every 14 linear feet of the baseboard run on the job''s baseboard removal lines, plus one for every 125 square feet of ceiling taken as the affected floor area, each of the three terms rounded up on its own; on a class_2 job they are the floor term plus the wall term, each rounded up on its own; on any other job the standard air mover count applies.'
    floor_movers: The standard air mover count is one air mover for every 60 square feet of the affected floor area, rounded up.
    air_movers: 'Air mover placement follows the IICRC class: on a class_3 job the air movers are one for every 60 square feet of the affected floor area, plus one for every 14 linear feet of the baseboard run on the job''s baseboard removal lines, plus one for every 125 square feet of ceiling taken as the affected floor area, each of the three terms rounded up on its own; on a class_2 job they are the floor term plus the wall term, each rounded up on its own; on any other job the standard air mover count applies.'
    dehumidifiers: The dehumidifiers are one for every 500 square feet of the affected floor area, rounded up, and the standard dehumidifier daily rate is the tier's LGR dehumidifier daily rate.
    dehu_rate: 'Dehumidifier capacity follows the IICRC class and the open cavities: on a class_4 job carrying flood cut lines the dehumidifier daily rate is the tier''s desiccant dehumidifier daily rate, on a class_3 job carrying flood cut lines it is the tier''s large-capacity XL LGR dehumidifier daily rate, and on any other job the standard dehumidifier daily rate applies.'
    dehu_cut_lines: 'Dehumidifier capacity follows the IICRC class and the open cavities: on a class_4 job carrying flood cut lines the dehumidifier daily rate is the tier''s desiccant dehumidifier daily rate, on a class_3 job carrying flood cut lines it is the tier''s large-capacity XL LGR dehumidifier daily rate, and on any other job the standard dehumidifier daily rate applies.'
    spread_days: 'Water that stood in a shared building spreads into the neighbouring structure and widens the drying chamber: a structure multiplier of 1.15 applies to the drying estimate on a condo_unit or multifamily_unit whose opened date is one or more days after its loss date, 1.1 on a commercial property whose opened date is one or more days after its loss date, and 1 in any other case.'
    dep_stand_days: 'Water that stood before the crew arrived lengthens drying: when the job''s opened date is two or more days after its loss date the drying days are the tier''s billable drying day cap plus one day, when the job was opened on its loss date they are the cap less one day, and in any other case the standard drying days apply.'
    drying_days: 'Water that stood before the crew arrived lengthens drying: when the job''s opened date is two or more days after its loss date the drying days are the tier''s billable drying day cap plus one day, when the job was opened on its loss date they are the cap less one day, and in any other case the standard drying days apply.'
    standard_scrubbers: The standard air scrubber count is one where the tier requires an air scrubber and none otherwise.
    cut_line_count: 'Tear-out raises dust in the drying chamber: on a category_3 job carrying flood cut lines the air scrubbers are two more than the standard air scrubber count, on a category_2 job carrying flood cut lines they are one more than the standard air scrubber count, and on any other job the standard air scrubber count applies.'
    air_scrubbers: 'Tear-out raises dust in the drying chamber: on a category_3 job carrying flood cut lines the air scrubbers are two more than the standard air scrubber count, on a category_2 job carrying flood cut lines they are one more than the standard air scrubber count, and on any other job the standard air scrubber count applies.'
    mold_balance_amt: 'A customer whose invoiced mold remediation job with the company is past due pays a larger drying deposit: when the balance due on the customer''s mold remediation job in invoiced status is above zero and today is more than 60 days after that job''s payment due date, a credit multiplier of 1.5 applies to the drying estimate; when that balance due is above zero and today is 1 to 60 days after the payment due date, a credit multiplier of 1.25 applies; in any other case, including a customer with no invoiced mold remediation job, the credit multiplier is 1.'
    mold_due_date: 'A customer whose invoiced mold remediation job with the company is past due pays a larger drying deposit: when the balance due on the customer''s mold remediation job in invoiced status is above zero and today is more than 60 days after that job''s payment due date, a credit multiplier of 1.5 applies to the drying estimate; when that balance due is above zero and today is 1 to 60 days after the payment due date, a credit multiplier of 1.25 applies; in any other case, including a customer with no invoiced mold remediation job, the credit multiplier is 1.'
    mold_days_late: 'A customer whose invoiced mold remediation job with the company is past due pays a larger drying deposit: when the balance due on the customer''s mold remediation job in invoiced status is above zero and today is more than 60 days after that job''s payment due date, a credit multiplier of 1.5 applies to the drying estimate; when that balance due is above zero and today is 1 to 60 days after the payment due date, a credit multiplier of 1.25 applies; in any other case, including a customer with no invoiced mold remediation job, the credit multiplier is 1.'
    credit_multiplier: 'A customer whose invoiced mold remediation job with the company is past due pays a larger drying deposit: when the balance due on the customer''s mold remediation job in invoiced status is above zero and today is more than 60 days after that job''s payment due date, a credit multiplier of 1.5 applies to the drying estimate; when that balance due is above zero and today is 1 to 60 days after the payment due date, a credit multiplier of 1.25 applies; in any other case, including a customer with no invoiced mold remediation job, the credit multiplier is 1.'
    structure_multiplier: 'Water that stood in a shared building spreads into the neighbouring structure and widens the drying chamber: a structure multiplier of 1.15 applies to the drying estimate on a condo_unit or multifamily_unit whose opened date is one or more days after its loss date, 1.1 on a commercial property whose opened date is one or more days after its loss date, and 1 in any other case.'
    daily_cost: The daily equipment cost is the air movers times the air mover daily rate, plus the dehumidifiers times the dehumidifier daily rate, plus the air scrubbers times the air scrubber daily rate; the drying estimate is the daily equipment cost times the drying days, multiplied by every estimate multiplier that applies to the job.
    drying_estimate: The daily equipment cost is the air movers times the air mover daily rate, plus the dehumidifiers times the dehumidifier daily rate, plus the air scrubbers times the air scrubber daily rate; the drying estimate is the daily equipment cost times the drying days, multiplied by every estimate multiplier that applies to the job.
    drying_deposit: The drying deposit is 60 percent of the drying estimate, rounded to the cent, half up, but never less than the tier's self-pay deposit.
    charges_posted: The amount collected is the drying deposit plus every charge posted to the job, less every customer payment posted to the job and plus any refund issued from those payments, rounded to the cent, half up; when that amount is zero or less nothing is collected.
    payments_posted: The amount collected is the drying deposit plus every charge posted to the job, less every customer payment posted to the job and plus any refund issued from those payments, rounded to the cent, half up; when that amount is zero or less nothing is collected.
    refunds_issued: The amount collected is the drying deposit plus every charge posted to the job, less every customer payment posted to the job and plus any refund issued from those payments, rounded to the cent, half up; when that amount is zero or less nothing is collected.
    result: The amount collected is the drying deposit plus every charge posted to the job, less every customer payment posted to the job and plus any refund issued from those payments, rounded to the cent, half up; when that amount is zero or less nothing is collected.
  factors:
  - id: iicrc_air_mover_plan
    effect: method
    decides: air_movers
    bindings:
    - dep_run_lf
    - air_movers
    ladder:
    - when: the job is class_3
      method: floor term (one per 60 sq ft) plus wall term (one per 14 lf of baseboard run) plus ceiling term (one per 125 sq ft), each rounded up on its own
    - when: the job is class_2
      method: floor term plus wall term, each rounded up on its own
    - when: otherwise
      method: one air mover per 60 sq ft of affected floor, rounded up
    baseline:
      air_movers: floor_movers
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: iicrc_dehumidifier_grade
    effect: parameter
    decides: dehu_rate
    bindings:
    - dehu_cut_lines
    - dehu_rate
    ladder:
    - when: the job is class_4 and carries flood cut lines
      value: P('desiccant_dehumidifier_daily_rate')
    - when: the job is class_3 and carries flood cut lines
      value: P('xl_dehumidifier_daily_rate')
    - when: otherwise
      value: P('lgr_dehumidifier_daily_rate')
    baseline:
      dehu_rate: P('lgr_dehumidifier_daily_rate')
    evidence:
    - tier_param
    cross_difficulty: null
  - id: standing_water_days
    effect: parameter
    decides: drying_days
    bindings:
    - dep_stand_days
    - drying_days
    ladder:
    - when: the job's opened date is two or more days after its loss date
      value: P('billable_drying_day_cap') + 1
    - when: the job was opened on its loss date
      value: P('billable_drying_day_cap') - 1
    - when: otherwise
      value: P('billable_drying_day_cap')
    baseline:
      drying_days: P('billable_drying_day_cap')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: tearout_dust_scrubbers
    effect: parameter
    decides: air_scrubbers
    bindings:
    - cut_line_count
    - air_scrubbers
    ladder:
    - when: the job is category_3 and carries flood cut lines
      value: standard_scrubbers + 2
    - when: the job is category_2 and carries flood cut lines
      value: standard_scrubbers + 1
    - when: otherwise
      value: standard_scrubbers
    baseline:
      air_scrubbers: standard_scrubbers
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: past_due_mold_credit
    effect: parameter
    decides: credit_multiplier
    bindings:
    - mold_balance_amt
    - mold_due_date
    - mold_days_late
    - credit_multiplier
    ladder:
    - when: the customer's invoiced mold remediation job has a balance due above zero and today is more than 60 days after its payment due date
      value: K('credit_long')
    - when: that balance due is above zero and today is 1 to 60 days after its payment due date
      value: K('credit_short')
    - when: otherwise (no past-due invoiced mold remediation balance)
      value: '1'
    baseline:
      credit_multiplier: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: mold
  - id: shared_structure_chamber
    effect: parameter
    decides: structure_multiplier
    bindings:
    - spread_days
    - structure_multiplier
    ladder:
    - when: the property is a condo_unit or multifamily_unit and its opened date is one or more days after its loss date
      value: K('structure_shared')
    - when: the property is commercial and its opened date is one or more days after its loss date
      value: K('structure_commercial')
    - when: otherwise
      value: '1'
    baseline:
      structure_multiplier: '1'
    evidence:
    - tier_param
    cross_difficulty: null
  baseline:
    rule: 'The drying estimate prices the drying equipment the job will run: air movers at the tier''s air mover daily rate, dehumidifiers at a dehumidifier daily rate and air scrubbers at the tier''s air scrubber daily rate, for a number of drying days. The standard air mover count is one air mover for every 60 square feet of the affected floor area, rounded up. The dehumidifiers are one for every 500 square feet of the affected floor area, rounded up, and the standard dehumidifier daily rate is the tier''s LGR dehumidifier daily rate. The standard drying days are the tier''s billable drying day cap. The standard air scrubber count is one where the tier requires an air scrubber and none otherwise. The daily equipment cost is the air movers times the air mover daily rate, plus the dehumidifiers times the dehumidifier daily rate, plus the air scrubbers times the air scrubber daily rate; the drying estimate is the daily equipment cost times the drying days, multiplied by every estimate multiplier that applies to the job. The drying deposit is 60 percent of the drying estimate, rounded to the cent, half up, but never less than the tier''s self-pay deposit. The amount collected is the drying deposit plus every charge posted to the job, less every customer payment posted to the job and plus any refund issued from those payments, rounded to the cent, half up; when that amount is zero or less nothing is collected.'
    params:
    - air_mover_daily_rate
    - lgr_dehumidifier_daily_rate
    - air_scrubber_daily_rate
    - billable_drying_day_cap
    - self_pay_deposit_amount
    - am_floor_sqft
    - dehu_sqft
    - deposit_share
  inputs:
    history:
    - table: water_charges
      aggregate: sum
      field: amount
      filters: {}
    - table: water_payments
      aggregate: sum
      field: amount
      filters:
        event_type: water_customer_payment
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: baseboard_removal
    cross_category:
    - mold
- id: water_ext_final_hepa_vacuum
  base_policy_refs:
  - water_evt_mitigation_services
  - water_regulated_materials
  - water_agg_same_loss_job
  - water_drying_completion
  overwrite:
  - base_policy: water_evt_mitigation_services
    superseded_clause: 'Each mitigation service is billed at the unit rate of the job''s tier for its service code, multiplied by the quantity performed: extraction, antimicrobial, pad and carpet work and HEPA vacuuming by the square foot, flood cuts and baseboard by the linear foot, contents manipulation by the room, debris by the load, PPE by the technician-day, labor by the hour, and moisture mapping, thermal imaging, containment, dumpster, lead-safe setup and asbestos sampling by the each.'
    replaced_by: 'Every mitigation service line other than a final HEPA vacuuming line, a tear-out debris haul-off line and a tear-out antimicrobial line remains billed at the unit rate of the job''s tier for its service code multiplied by the quantity performed: extraction, antimicrobial, pad and carpet work and HEPA vacuuming by the square foot, flood cuts and baseboard by the linear foot, contents manipulation by the room, debris by the load, PPE by the technician-day, labor by the hour, and moisture mapping, thermal imaging, containment, dumpster, lead-safe setup and asbestos sampling by the each; for a job''s final HEPA vacuuming line, and only for that line, the vacuumed square feet are set as follows, while the debris haul-off and antimicrobial lines are set by their own rules.'
  trigger: state_due
  subject:
  - water_mitigation_service_charge
  computes: amount
  target_tool: book_final_hepa_eb899e1c
  params:
    wall_cut_cat3_ft: 4
    wall_cut_cat2_ft: 2
    room_area_cat23: 120
    room_area_cat1: 60
    reg_pass_lead: 2
    reg_pass_asbestos: 1.5
    plate_class34_ft: 1
    plate_class2_ft: 0.5
    residue_pass_2: 1.4
    residue_pass_1: 1.2
  rule: 'The job must be in drying_complete status when the final HEPA vacuuming line is charged. Every mitigation service line other than a final HEPA vacuuming line, a tear-out debris haul-off line and a tear-out antimicrobial line remains billed at the unit rate of the job''s tier for its service code multiplied by the quantity performed: extraction, antimicrobial, pad and carpet work and HEPA vacuuming by the square foot, flood cuts and baseboard by the linear foot, contents manipulation by the room, debris by the load, PPE by the technician-day, labor by the hour, and moisture mapping, thermal imaging, containment, dumpster, lead-safe setup and asbestos sampling by the each; for a job''s final HEPA vacuuming line, and only for that line, the vacuumed square feet are set as follows, while the debris haul-off and antimicrobial lines are set by their own rules. Once drying is complete, the surfaces a tear-out exposed are HEPA vacuumed once in the final cleaning and billed as one final HEPA vacuuming line in square feet, dated the job''s drying complete date; a job that already carries a HEPA vacuuming line, or that carries no pad removal or carpet removal line, is billed no final HEPA vacuuming line. The vacuumed floor is the total square feet on the job''s pad removal and carpet removal lines. The vacuumed wall, contents and plate areas are zero, and the pass factors are 1. The billed square feet are the vacuumed floor plus the vacuumed wall, contents and plate areas, multiplied by every pass factor that applies to the job and rounded to two decimals, half up; the line amount is the billed square feet multiplied by the tier''s HEPA vacuuming rate per square foot, rounded to the cent, half up. Cut wall cavities are vacuumed up to the cut: on a category_3 job carrying flood cut lines the vacuumed wall area is the linear feet on its flood cut lines times 4 feet, on a category_2 job carrying flood cut lines it is those linear feet times 2 feet, and in any other case the standard vacuumed wall area applies. Rooms whose contents were moved and blocked are vacuumed where the contents stood: on a category_2 or category_3 job carrying contents manipulation lines the vacuumed contents area is 120 square feet for each room on those lines, on a category_1 job carrying contents manipulation lines it is 60 square feet for each room, and in any other case the standard vacuumed contents area applies. Regulated dust takes extra passes: the regulated pass factor is 2 when the building was built before the RRP year-built cutoff of the job''s tier and the job carries a lead-safe setup line, 1.5 when the building was built before the asbestos sampling year cutoff and the job carries an asbestos sampling line but no lead-safe setup line, and the standard pass factor in any other case. Where the carpet went sets the vacuumed floor: when the job carries carpet detach-and-reset lines and pad removal lines, the carpet was rolled back across the room and goes back down, so the vacuumed floor is the square feet on its pad removal lines plus the affected floor area for the carpet''s back; when it carries carpet removal lines and pad removal lines, carpet and pad left together and the vacuumed floor is the larger of the affected floor area and the square feet on its pad removal lines; in any other case the standard vacuumed floor applies. The bottom plate behind removed baseboard is vacuumed as a strip: on a class_3 or class_4 job carrying baseboard removal lines the vacuumed plate area is the linear feet on those lines times 1 foot, on a class_2 job carrying baseboard removal lines it is those linear feet times half a foot, and in any other case the standard vacuumed plate area applies. Silt left by standing water takes a heavier pass: the residue pass factor is 1.4 when the job''s opened date is two or more days after its loss date, 1.2 when it is exactly one day after the loss date, and the standard pass factor when the job was opened on its loss date. Amounts are rounded to the cent, half up.'
  prerequisite: []
  cross_category: []
  compute:
  - prior_hepa_lines: COUNT('water_charges', charge_code='hepa_vacuum')
  - hepa_tearout_lines: COUNT('water_charges', charge_code='pad_removal') + COUNT('water_charges', charge_code='carpet_removal')
  - hv_pad_sqft: SUM('water_charges','quantity', charge_code='pad_removal')
  - hv_carpet_out_sqft: SUM('water_charges','quantity', charge_code='carpet_removal')
  - standard_floor: hv_pad_sqft + hv_carpet_out_sqft
  - hv_detach_sqft: SUM('water_charges','quantity', charge_code='carpet_detach_reset')
  - vacuumed_floor: hv_pad_sqft + F('affected_area_sqft') if (hv_detach_sqft > 0 and hv_pad_sqft > 0) else (MX(F('affected_area_sqft'), hv_pad_sqft) if (hv_carpet_out_sqft > 0 and hv_pad_sqft > 0) else standard_floor)
  - hv_cut_lf: SUM('water_charges','quantity', charge_code='flood_cut')
  - vacuumed_wall: hv_cut_lf * K('wall_cut_cat3_ft') if (F('water_category') == 'category_3' and hv_cut_lf > 0) else (hv_cut_lf * K('wall_cut_cat2_ft') if (F('water_category') == 'category_2' and hv_cut_lf > 0) else 0)
  - hv_rooms: SUM('water_charges','quantity', charge_code='contents_manipulation')
  - vacuumed_contents: hv_rooms * K('room_area_cat23') if ((F('water_category') == 'category_2' or F('water_category') == 'category_3') and hv_rooms > 0) else (hv_rooms * K('room_area_cat1') if (F('water_category') == 'category_1' and hv_rooms > 0) else 0)
  - hv_lead_lines: COUNT('water_charges', charge_code='lead_safe_setup')
  - hv_sampling_lines: COUNT('water_charges', charge_code='asbestos_sampling')
  - regulated_pass: K('reg_pass_lead') if (int(F('year_built')) < P('rrp_year_built_cutoff') and hv_lead_lines > 0) else (K('reg_pass_asbestos') if (int(F('year_built')) < P('asbestos_sampling_year_cutoff') and hv_sampling_lines > 0 and hv_lead_lines == 0) else 1)
  - hv_base_lf: SUM('water_charges','quantity', charge_code='baseboard_removal')
  - vacuumed_plate: hv_base_lf * K('plate_class34_ft') if ((F('water_class') == 'class_3' or F('water_class') == 'class_4') and hv_base_lf > 0) else (hv_base_lf * K('plate_class2_ft') if (F('water_class') == 'class_2' and hv_base_lf > 0) else 0)
  - hv_stand_days: DAYS(F('loss_date'), F('opened_date'))
  - residue_pass: K('residue_pass_2') if hv_stand_days >= 2 else (K('residue_pass_1') if hv_stand_days == 1 else 1)
  - hepa_sqft: RND((vacuumed_floor + vacuumed_wall + vacuumed_contents + vacuumed_plate) * regulated_pass * residue_pass + 0.000000001, 2)
  - result: 0 if (prior_hepa_lines > 0 or hepa_tearout_lines == 0) else RND(hepa_sqft * P('hepa_vacuum_rate_per_sqft') + 0.000000001, 2)
  compute_basis:
    prior_hepa_lines: Once drying is complete, the surfaces a tear-out exposed are HEPA vacuumed once in the final cleaning and billed as one final HEPA vacuuming line in square feet, dated the job's drying complete date; a job that already carries a HEPA vacuuming line, or that carries no pad removal or carpet removal line, is billed no final HEPA vacuuming line.
    hepa_tearout_lines: Once drying is complete, the surfaces a tear-out exposed are HEPA vacuumed once in the final cleaning and billed as one final HEPA vacuuming line in square feet, dated the job's drying complete date; a job that already carries a HEPA vacuuming line, or that carries no pad removal or carpet removal line, is billed no final HEPA vacuuming line.
    hv_pad_sqft: The vacuumed floor is the total square feet on the job's pad removal and carpet removal lines.
    hv_carpet_out_sqft: The vacuumed floor is the total square feet on the job's pad removal and carpet removal lines.
    standard_floor: The vacuumed floor is the total square feet on the job's pad removal and carpet removal lines.
    hv_detach_sqft: 'Where the carpet went sets the vacuumed floor: when the job carries carpet detach-and-reset lines and pad removal lines, the carpet was rolled back across the room and goes back down, so the vacuumed floor is the square feet on its pad removal lines plus the affected floor area for the carpet''s back; when it carries carpet removal lines and pad removal lines, carpet and pad left together and the vacuumed floor is the larger of the affected floor area and the square feet on its pad removal lines; in any other case the standard vacuumed floor applies.'
    vacuumed_floor: 'Where the carpet went sets the vacuumed floor: when the job carries carpet detach-and-reset lines and pad removal lines, the carpet was rolled back across the room and goes back down, so the vacuumed floor is the square feet on its pad removal lines plus the affected floor area for the carpet''s back; when it carries carpet removal lines and pad removal lines, carpet and pad left together and the vacuumed floor is the larger of the affected floor area and the square feet on its pad removal lines; in any other case the standard vacuumed floor applies.'
    hv_cut_lf: 'Cut wall cavities are vacuumed up to the cut: on a category_3 job carrying flood cut lines the vacuumed wall area is the linear feet on its flood cut lines times 4 feet, on a category_2 job carrying flood cut lines it is those linear feet times 2 feet, and in any other case the standard vacuumed wall area applies.'
    vacuumed_wall: 'Cut wall cavities are vacuumed up to the cut: on a category_3 job carrying flood cut lines the vacuumed wall area is the linear feet on its flood cut lines times 4 feet, on a category_2 job carrying flood cut lines it is those linear feet times 2 feet, and in any other case the standard vacuumed wall area applies.'
    hv_rooms: 'Rooms whose contents were moved and blocked are vacuumed where the contents stood: on a category_2 or category_3 job carrying contents manipulation lines the vacuumed contents area is 120 square feet for each room on those lines, on a category_1 job carrying contents manipulation lines it is 60 square feet for each room, and in any other case the standard vacuumed contents area applies.'
    vacuumed_contents: 'Rooms whose contents were moved and blocked are vacuumed where the contents stood: on a category_2 or category_3 job carrying contents manipulation lines the vacuumed contents area is 120 square feet for each room on those lines, on a category_1 job carrying contents manipulation lines it is 60 square feet for each room, and in any other case the standard vacuumed contents area applies.'
    hv_lead_lines: 'Regulated dust takes extra passes: the regulated pass factor is 2 when the building was built before the RRP year-built cutoff of the job''s tier and the job carries a lead-safe setup line, 1.5 when the building was built before the asbestos sampling year cutoff and the job carries an asbestos sampling line but no lead-safe setup line, and the standard pass factor in any other case.'
    hv_sampling_lines: 'Regulated dust takes extra passes: the regulated pass factor is 2 when the building was built before the RRP year-built cutoff of the job''s tier and the job carries a lead-safe setup line, 1.5 when the building was built before the asbestos sampling year cutoff and the job carries an asbestos sampling line but no lead-safe setup line, and the standard pass factor in any other case.'
    regulated_pass: 'Regulated dust takes extra passes: the regulated pass factor is 2 when the building was built before the RRP year-built cutoff of the job''s tier and the job carries a lead-safe setup line, 1.5 when the building was built before the asbestos sampling year cutoff and the job carries an asbestos sampling line but no lead-safe setup line, and the standard pass factor in any other case.'
    hv_base_lf: 'The bottom plate behind removed baseboard is vacuumed as a strip: on a class_3 or class_4 job carrying baseboard removal lines the vacuumed plate area is the linear feet on those lines times 1 foot, on a class_2 job carrying baseboard removal lines it is those linear feet times half a foot, and in any other case the standard vacuumed plate area applies.'
    vacuumed_plate: 'The bottom plate behind removed baseboard is vacuumed as a strip: on a class_3 or class_4 job carrying baseboard removal lines the vacuumed plate area is the linear feet on those lines times 1 foot, on a class_2 job carrying baseboard removal lines it is those linear feet times half a foot, and in any other case the standard vacuumed plate area applies.'
    hv_stand_days: 'Silt left by standing water takes a heavier pass: the residue pass factor is 1.4 when the job''s opened date is two or more days after its loss date, 1.2 when it is exactly one day after the loss date, and the standard pass factor when the job was opened on its loss date.'
    residue_pass: 'Silt left by standing water takes a heavier pass: the residue pass factor is 1.4 when the job''s opened date is two or more days after its loss date, 1.2 when it is exactly one day after the loss date, and the standard pass factor when the job was opened on its loss date.'
    hepa_sqft: The billed square feet are the vacuumed floor plus the vacuumed wall, contents and plate areas, multiplied by every pass factor that applies to the job and rounded to two decimals, half up; the line amount is the billed square feet multiplied by the tier's HEPA vacuuming rate per square foot, rounded to the cent, half up.
    result: The billed square feet are the vacuumed floor plus the vacuumed wall, contents and plate areas, multiplied by every pass factor that applies to the job and rounded to two decimals, half up; the line amount is the billed square feet multiplied by the tier's HEPA vacuuming rate per square foot, rounded to the cent, half up.
  factors:
  - id: cut_cavity_vacuum
    effect: parameter
    decides: vacuumed_wall
    bindings:
    - hv_cut_lf
    - vacuumed_wall
    ladder:
    - when: the job is category_3 and carries flood cut lines
      value: flood cut linear feet x K('wall_cut_cat3_ft')
    - when: the job is category_2 and carries flood cut lines
      value: flood cut linear feet x K('wall_cut_cat2_ft')
    - when: otherwise
      value: '0'
    baseline:
      vacuumed_wall: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: moved_contents_vacuum
    effect: parameter
    decides: vacuumed_contents
    bindings:
    - hv_rooms
    - vacuumed_contents
    ladder:
    - when: the job is category_2 or category_3 and carries contents manipulation lines
      value: rooms x K('room_area_cat23')
    - when: the job is category_1 and carries contents manipulation lines
      value: rooms x K('room_area_cat1')
    - when: otherwise
      value: '0'
    baseline:
      vacuumed_contents: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: regulated_dust_passes
    effect: parameter
    decides: regulated_pass
    bindings:
    - hv_lead_lines
    - hv_sampling_lines
    - regulated_pass
    ladder:
    - when: the building was built before the tier's RRP year-built cutoff and the job carries a lead-safe setup line
      value: K('reg_pass_lead')
    - when: the building was built before the asbestos sampling year cutoff and the job carries an asbestos sampling line but no lead-safe setup line
      value: K('reg_pass_asbestos')
    - when: otherwise
      value: '1'
    baseline:
      regulated_pass: '1'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: lifted_carpet_back
    effect: method
    decides: vacuumed_floor
    bindings:
    - hv_detach_sqft
    - vacuumed_floor
    ladder:
    - when: the job carries carpet detach-and-reset lines and pad removal lines
      method: pad removal square feet plus the affected floor area
    - when: the job carries carpet removal lines and pad removal lines
      method: the larger of the affected floor area and the pad removal square feet
    - when: otherwise
      method: pad removal plus carpet removal square feet
    baseline:
      vacuumed_floor: standard_floor
    evidence:
    - history
    cross_difficulty: null
  - id: bottom_plate_strip
    effect: parameter
    decides: vacuumed_plate
    bindings:
    - hv_base_lf
    - vacuumed_plate
    ladder:
    - when: the job is class_3 or class_4 and carries baseboard removal lines
      value: baseboard linear feet x K('plate_class34_ft')
    - when: the job is class_2 and carries baseboard removal lines
      value: baseboard linear feet x K('plate_class2_ft')
    - when: otherwise
      value: '0'
    baseline:
      vacuumed_plate: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: silt_residue_pass
    effect: parameter
    decides: residue_pass
    bindings:
    - hv_stand_days
    - residue_pass
    ladder:
    - when: the job's opened date is two or more days after its loss date
      value: K('residue_pass_2')
    - when: the job's opened date is exactly one day after its loss date
      value: K('residue_pass_1')
    - when: otherwise (opened on the loss date)
      value: '1'
    baseline:
      residue_pass: '1'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The vacuumed floor is the total square feet on the job's pad removal and carpet removal lines. The vacuumed wall, contents and plate areas are zero, and the pass factors are 1. The billed square feet are the vacuumed floor plus the vacuumed wall, contents and plate areas, multiplied by every pass factor that applies to the job and rounded to two decimals, half up; the line amount is the billed square feet multiplied by the tier's HEPA vacuuming rate per square foot, rounded to the cent, half up. Amounts are rounded to the cent, half up.
    params:
    - hepa_vacuum_rate_per_sqft
  inputs:
    history:
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: pad_removal
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: flood_cut
    - table: water_charges
      aggregate: sum
      field: quantity
      filters:
        charge_code: contents_manipulation
    cross_category: []
