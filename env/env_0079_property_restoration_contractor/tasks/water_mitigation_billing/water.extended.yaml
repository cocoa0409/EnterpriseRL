    room_block_cat2: 300
  rule: 'Only an insurance_claim job linked to a claim file carries an insured''s share, and the job must not be closed when the insured pays it; the insured''s share is the insured''s own payment, made by the insured through the company''s secure payment channel, and staff never take card numbers. The insured''s share of a job whose drying is complete and whose final invoice has not yet been issued, and that carries pad removal or carpet removal lines, is fixed only after the job carries a HEPA vacuuming line. The insured''s share of a job is the part of its charges that the claim''s dwelling coverage does not pay and that the insured pays the company directly. The standard insured''s share is the total of the job''s card surcharge and late fee lines, the insured''s own finance charges, which insurance proceeds never pay. Lead-safe setup and asbestos sampling are paid by the dwelling coverage only through the linked claim file''s ordinance or law coverage: the amount by which the job''s lead-safe setup and asbestos sampling lines total more than the code work covered is a non-covered amount, and nothing is non-covered for them when that total is not above the code work covered. The standard code work covered is the claim file''s ordinance or law limit, taken as zero when the file carries no limit. Moving contents within rooms is covered for one room for every block of affected floor area, rounded up, the standard block being 400 square feet; the rooms on the job''s contents manipulation lines above the covered rooms, priced at the tier''s contents manipulation rate per room, are a non-covered amount. Non-covered amounts are billed to the insured only on a claim file whose billing arrangement lets a line the carrier declines be billed to the customer; on an arrangement that never bills such a line to the customer, no non-covered amount enters the share, as the claims charter provides for Assignment of Benefits and Carrier Program files. The insured''s share is the standard insured''s share plus every non-covered amount that applies to the job, rounded to the cent, half up, and never more than the job''s balance due; when the balance due or that amount is zero or less nothing is paid. A code-upgrade supplement for the job decides its code work: when the latest code-upgrade supplement request on the linked claim file names this job and carries a carrier approval, the code work covered is the amount the carrier approved on that request, whether or not it is less than the amount asked, but no more than the ordinance or law limit; when that request names this job and has no carrier approval yet, the code work covered is the amount the request asks for, but no more than the ordinance or law limit, while the carrier decides it; in any other case the standard code work covered applies. When the linked claim file carries more than one code-upgrade supplement request, or its code-upgrade supplement request names another job or no job, the regulated-materials amount is set by a human representative. The emergency premium on the service call, being the job''s service call line amounts less the tier''s service call fee for each of those lines, is paid by the dwelling coverage when the dispatch answered the loss as it happened: when the premium is above zero and the job''s opened date is two or more days after its loss date, the whole premium is a non-covered amount; when the premium is above zero and the opened date is exactly one day after the loss date, 40 percent of the premium is a non-covered amount; in any other case none of it is. Air movers are covered up to the IICRC placement count across the job''s air mover lines: on a class_3 job the placement count is one for every 60 square feet of the affected floor area, plus one for every 14 linear feet of the baseboard run on the job''s baseboard removal lines, plus one for every 125 square feet of ceiling taken as the affected floor area, each term rounded up on its own; on a class_2 job it is the floor term plus the wall term; the covered air mover unit-days are the placement count multiplied by the number of air mover lines, and the total unit-days on those lines above the covered unit-days, priced at the tier''s air mover daily rate, are a non-covered amount; on any other job every billed air mover unit-day is covered. LGR dehumidifiers are covered up to the IICRC sizing across the job''s LGR dehumidifier lines: on a class_3 or class_4 job carrying LGR lines the covered units are one for every 500 square feet of the affected floor area plus one for every 50 linear feet of the baseboard run on the job''s baseboard removal lines, each term rounded up on its own, because wet walls add evaporation load; on a class_2 job carrying LGR lines they are the floor term alone; the covered LGR unit-days are the covered units multiplied by the number of LGR lines, and the total unit-days on those lines above the covered unit-days, priced at the tier''s LGR dehumidifier daily rate, are a non-covered amount; on any other job every billed LGR unit-day is covered. HEPA vacuuming is covered on the stripped floor: on a category_2 job carrying HEPA vacuuming lines the square feet on those lines above the square feet on the job''s pad removal lines, and on a category_3 job carrying HEPA vacuuming lines the square feet on those lines above the sum of the pad removal square feet and 4 square feet for each linear foot on the flood cut lines, priced at the tier''s HEPA vacuuming rate per square foot, are a non-covered amount; in any other case the HEPA vacuuming is covered. Contaminated water spreads the contents that must be moved: on a category_3 job carrying contents manipulation lines the room block is 200 square feet, on a category_2 job carrying them it is 300 square feet, and in any other case the standard room block applies.'
  prerequisite:
  - problem: water_ext_final_hepa_vacuum
    kind: value_input
    gate: sh_hepa_sqft
    form: state
    policy_source: The insured's share of a job whose drying is complete and whose final invoice has not yet been issued, and that carries pad removal or carpet removal lines, is fixed only after the job carries a HEPA vacuuming line.
    condition: A job in drying_complete status (drying complete, not yet invoiced) that carries pad_removal or carpet_removal lines carries a water_charges line with charge_code hepa_vacuum.
    resolved_by: book_final_hepa_eb899e1c
    effect: Booking the final HEPA vacuuming line puts its square feet on the job, and the square feet above the stripped floor become a non-covered amount in the share.
  cross_category:
  - category: claims
    as: history
    reads:
    - denied_line_billable_to_customer
    - ordinance_law_limit
    - claims_requests.claim_request_id
    - claims_requests.related_job_id
    - claims_requests.requested_amount
    - claims_approvals.amount
    note: code_upgrade_supplement_decision reads the linked claim file's code-upgrade supplement request naming this job and its carrier approval; the cap reads the ordinance or law limit and the billability scope the arrangement's denied-line billability
  compute:
  - finance_charges: SUM('water_charges','amount', charge_code='late_fee') + SUM('water_charges','amount', charge_code='card_surcharge')
  - sh_billable: CPARAM('claims','denied_line_billable_to_customer', claim_file_id=F('claim_file_id'))
  - regulated_lines: COUNT('water_charges', charge_code='lead_safe_setup') + COUNT('water_charges', charge_code='asbestos_sampling')
  - regulated_total: SUM('water_charges','amount', charge_code='lead_safe_setup') + SUM('water_charges','amount', charge_code='asbestos_sampling')
  - ol_limit: CFIELD('claims','ordinance_law_limit', claim_file_id=F('claim_file_id')) or 0
  - cu_request_id: XLATEST('claims','claims_requests','claim_request_id', date_field='request_date', claim_file_id=F('claim_file_id'), supplement_reason='code_upgrade')
  - cu_job: XLATEST('claims','claims_requests','related_job_id', date_field='request_date', claim_file_id=F('claim_file_id'), supplement_reason='code_upgrade')
  - cu_approved: XSUM('claims','claims_approvals','amount', claim_file_id=F('claim_file_id'), claim_request_id=cu_request_id) if cu_request_id else 0
  - cu_approval_count: XCOUNT('claims','claims_approvals', claim_file_id=F('claim_file_id'), claim_request_id=cu_request_id) if cu_request_id else 0
  - cu_requested: XSUM('claims','claims_requests','requested_amount', claim_file_id=F('claim_file_id'), claim_request_id=cu_request_id) if cu_request_id else 0
  - code_work_covered: MN(cu_approved, MX(0, ol_limit)) if (cu_request_id and cu_job == HID and cu_approval_count > 0) else (MN(cu_requested, MX(0, ol_limit)) if (cu_request_id and cu_job == HID and cu_approval_count == 0) else MX(0, ol_limit))
  - noncovered_code_work: MX(0, regulated_total - code_work_covered) if regulated_lines > 0 else 0
  - sc_premium: SUM('water_charges','amount', charge_code='service_call') - COUNT('water_charges', charge_code='service_call') * P('emergency_service_call_fee')
  - sh_stand_days: DAYS(F('loss_date'), F('opened_date'))
  - premium_share: 1 if (sc_premium > 0 and sh_stand_days >= 2) else (K('premium_share_next_day') if (sc_premium > 0 and sh_stand_days == 1) else 0)
  - am_unit_days: SUM('water_charges','quantity', charge_code='air_mover')
  - am_line_days: COUNT('water_charges', charge_code='air_mover')
  - am_run_lf: SUM('water_charges','quantity', charge_code='baseboard_removal')
  - covered_am_unit_days: ((-((-(F('affected_area_sqft') / K('am_floor_sqft')))//1)) + (-((-(am_run_lf / K('am_wall_lf')))//1)) + (-((-(F('affected_area_sqft') / K('am_ceiling_sqft')))//1))) * am_line_days if F('water_class') == 'class_3' else (((-((-(F('affected_area_sqft') / K('am_floor_sqft')))//1)) + (-((-(am_run_lf / K('am_wall_lf')))//1))) * am_line_days if F('water_class') == 'class_2' else am_unit_days)
  - lgr_unit_days: SUM('water_charges','quantity', charge_code='lgr_dehumidifier')
  - lgr_line_days: COUNT('water_charges', charge_code='lgr_dehumidifier')
  - lgr_run_lf: SUM('water_charges','quantity', charge_code='baseboard_removal')
  - covered_lgr_unit_days: ((-((-(F('affected_area_sqft') / K('lgr_floor_sqft')))//1)) + (-((-(lgr_run_lf / K('lgr_wall_lf')))//1))) * lgr_line_days if ((F('water_class') == 'class_3' or F('water_class') == 'class_4') and lgr_line_days > 0) else ((-((-(F('affected_area_sqft') / K('lgr_floor_sqft')))//1)) * lgr_line_days if (F('water_class') == 'class_2' and lgr_line_days > 0) else lgr_unit_days)
  - sh_hepa_sqft: SUM('water_charges','quantity', charge_code='hepa_vacuum')
  - sh_pad_sqft: SUM('water_charges','quantity', charge_code='pad_removal')
  - sh_cut_lf: SUM('water_charges','quantity', charge_code='flood_cut')
  - hepa_outside_sqft: MX(0, sh_hepa_sqft - sh_pad_sqft) if (F('water_category') == 'category_2' and sh_hepa_sqft > 0) else (MX(0, sh_hepa_sqft - sh_pad_sqft - sh_cut_lf * K('cat3_wall_ft')) if (F('water_category') == 'category_3' and sh_hepa_sqft > 0) else 0)
  - sh_rooms: SUM('water_charges','quantity', charge_code='contents_manipulation')
  - room_lines: COUNT('water_charges', charge_code='contents_manipulation')
  - room_block_sqft: K('room_block_cat3') if (F('water_category') == 'category_3' and room_lines > 0) else (K('room_block_cat2') if (F('water_category') == 'category_2' and room_lines > 0) else K('room_block_std'))
  - covered_rooms: (-((-(F('affected_area_sqft') / room_block_sqft))//1))
  - noncovered_total: noncovered_code_work + sc_premium * premium_share + MX(0, am_unit_days - covered_am_unit_days) * P('air_mover_daily_rate') + MX(0, lgr_unit_days - covered_lgr_unit_days) * P('lgr_dehumidifier_daily_rate') + hepa_outside_sqft * P('hepa_vacuum_rate_per_sqft') + MX(0, sh_rooms - covered_rooms) * P('contents_manipulation_rate_per_room')
  - result: 0 if F('balance_due') <= 0 else MN(F('balance_due'), MX(0, RND(finance_charges + (noncovered_total if sh_billable else 0) + 0.000000001, 2)))
  compute_basis:
