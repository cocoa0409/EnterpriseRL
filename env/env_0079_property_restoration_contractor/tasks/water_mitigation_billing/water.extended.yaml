- id: water_authorization
  subject:
  - water_work_authorization
  - water_drying_start
  rule: The job must be in dispatched status when the work authorization is signed. No extraction, tear-out or drying
    begins until the property owner, or an agent the owner has authorized such as the property manager of a managed
    property, signs the work authorization; the signature is the customer's own act. Drying equipment may be set
    on a self-pay job only after customer payments posted to the job total at least the tier's self-pay deposit.
    Insurance-funded jobs require no deposit, because the deductible is collected on the claim file rather than
    on the job. Drying equipment is set only on an authorized job.
  eligibility:
  - id: auth_state
    applies_to:
    - water_work_authorization
    kind: state
    condition: The job must be in dispatched status when the work authorization is signed.
    evidence_fields:
    - water_jobs.status
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - dispatched
  - id: self_pay_deposit
    applies_to:
    - water_drying_start
    kind: caller_fact
    condition: Drying equipment may be set on a self-pay job only after customer payments posted to the job total
      at least the tier's self-pay deposit.
    evidence_fields:
    - water_jobs.funding_source
    - water_payments.amount
    - water_payments.event_type
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
  params:
    per_tier:
      Clean Water Mitigation - Standard Loss:
        self_pay_deposit_amount: =self_pay_deposit_amount
      Clean Water Mitigation - Large Loss:
        self_pay_deposit_amount: =self_pay_deposit_amount
      Gray Water Mitigation - Standard Loss:
        self_pay_deposit_amount: =self_pay_deposit_amount
      Gray Water Mitigation - Large Loss:
        self_pay_deposit_amount: =self_pay_deposit_amount
      Black Water Mitigation - Standard Loss:
        self_pay_deposit_amount: =self_pay_deposit_amount
      Black Water Mitigation - Large Loss:
        self_pay_deposit_amount: =self_pay_deposit_amount
- id: water_cancellation
  subject:
  - water_dispatch_cancel
  rule: The job must be in dispatched status when the dispatch is cancelled. A customer who declines the work after
    the crew has been dispatched, and before signing the work authorization, may cancel the dispatch; the service
    call already charged stays billable, nothing else is charged, and the cancelled job's service call balance is
    due within the self-pay payment terms counted from the cancelled date. Once the authorization is signed the
    job can no longer be cancelled; a customer who wants to stop drying after equipment is set does so through the
    Early Equipment Removal Release.
  eligibility:
  - id: cancel_state
    applies_to:
    - water_dispatch_cancel
    kind: state
    condition: The job must be in dispatched status when the dispatch is cancelled.
    evidence_fields:
    - water_jobs.status
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - dispatched
  params:
    per_tier:
      Clean Water Mitigation - Standard Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
      Clean Water Mitigation - Large Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
      Gray Water Mitigation - Standard Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
      Gray Water Mitigation - Large Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
      Black Water Mitigation - Standard Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
      Black Water Mitigation - Large Loss:
        payment_terms_days_self_pay: =payment_terms_days_self_pay
- id: water_drying_completion
  subject:
  - water_early_release
  - water_drying_complete
  rule: 'The job must be in drying status when an Early Equipment Removal Release is signed. Drying ends either
    when the logged readings of every affected material reach the dry standard, recorded as dry_standard_met, or
    when the customer signs an Early Equipment Removal Release and the equipment is pulled, recorded as customer_release.
    The release is the customer''s own decision and signature: it acknowledges that materials were not dry and that
    the company gives no warranty against secondary damage such as mold growth. A job whose release_signed_date
    is filled can only complete with drying_outcome customer_release. Equipment days are billable through the drying
    complete date under either outcome.'
  eligibility:
  - id: release_state
    applies_to:
    - water_early_release
    kind: state
    condition: The job must be in drying status when an Early Equipment Removal Release is signed.
    evidence_fields:
    - water_jobs.status
    - water_jobs.water_job_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - water_jobs.water_job_id
      action_bindings:
        water_jobs.water_job_id: water_job_id
    state_contract:
      field: water_jobs.status
      allowed:
      - drying
- id: water_invoicing
  subject:
  - water_invoice_issue
  - water_job_close
  rule: The job must be in drying_complete status when the final invoice is issued. The final invoice amount is
    the total of every charge line on the job at the moment of invoicing, and the payment due date is the invoice
    date plus the self-pay payment terms on a self_pay job or plus the insurance payment terms on an insurance_claim
    job, counted in calendar days. The job closes when its balance_due is exactly zero after the final invoice;
    a job with a credit balance stays invoiced until the credit is refunded.
  eligibility:
  - id: invoice_state
    applies_to:
    - water_invoice_issue
    kind: state
    condition: The job must be in drying_complete status when the final invoice is issued.
    evidence_fields:
    - water_jobs.status
