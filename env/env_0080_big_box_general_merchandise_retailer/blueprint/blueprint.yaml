name: env_0080_big_box_general_merchandise_retailer
company: Northgate Stores, Inc.

background: |
  Northgate Stores, Inc. is a national general merchandise retailer that runs about 1,900 big-box stores across the United States together with northgate.com and the Northgate app, selling groceries, household essentials, apparel, home goods, toys, electronics, appliances and furniture to households and to small businesses, schools and public agencies.
  Its customer care center speaks in a plain, friendly and practical voice and serves both consumer profiles and business profiles, each identified by one Northgate customer profile.
  Every purchase is held as an order in one of six fulfilment programs: Northgate In-Store Purchase, Northgate Order Pickup, Northgate Drive Up, Northgate Ship to Home, Northgate Same-Day Delivery and Northgate Scheduled Large-Item Delivery, and each order books its item lines, delivery fees, returns, price adjustments and refunds.
  Third-party sellers list on Northgate Marketplace under six seller programs, Northgate Marketplace Seller-Fulfilled, Northgate Marketplace Pro Seller, Northgate Marketplace Fulfilled by Northgate, Northgate Marketplace Freight Seller, Northgate Marketplace Certified Renewed and Northgate Marketplace International Seller, and each marketplace order books its lines, seller refunds and Northgate Marketplace Guarantee claims.
  The loyalty program runs from the free Northgate Rewards tier through the paid Northgate+ Assist, Northgate+ Student, Northgate+ Monthly, Northgate+ Annual and Northgate+ Business memberships, which carry delivery benefits and book membership fees, refunds, benefit uses and Northgate Cash earned and spent.
  Northgate Card credit accounts, issued by Harbor Point Bank, N.A., come as the Northgate Secured Card, Northgate Store Card, Northgate Mastercard, Northgate World Mastercard, Northgate Business Store Card and Northgate Business Mastercard, and each account books purchases, merchant credits, payments, interest, fees, statements and disputes.
  Northgate Protect protection plans, administered by Keystone Protection Services, are sold as Northgate Protect Standard 2-Year, Standard 3-Year, Accident 2-Year, Accident 3-Year and Accident 4-Year plans on single items, and as the Northgate Protect Complete Monthly subscription, and each plan books its price, registered items, claims, settlements and refunds.
  Businesses can buy on invoice through Northgate Business accounts on Net 15, Net 30 Standard, Net 30 Preferred, Net 45 Volume, Net 60 Enterprise and Net 30 Public Sector terms, which book invoices, payments, credit memos and late charges.
  Value cards come as the Northgate Gift Card, Northgate eGift Card, Northgate Merchandise Return Card, Northgate Promotional Gift Card, Northgate Business Bulk Gift Card and Northgate Reloadable Gift Card, each booking loads, redemptions and refunds.
  A typical caller holds a membership, often a Northgate Card, one or more protection plans and a stream of store, online and marketplace orders, so a single question about a refund or a fee usually touches several of these records at once.
  Callers bring histories of renewals and declined fees, statements and payments, returns and price drops, plan claims and repairs, seller messages and guarantee claims.
  Business callers are typically office managers, school purchasing staff and small contractors who combine a Northgate+ Business membership, a business card and invoice terms.
  Seasonal peaks around back-to-school, the November and December holidays and the January return season drive the heaviest call volumes.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: membership_fees_and_benefits
    claim:
      categories: [membership]
      event_types: [membership_fee_charge, membership_fee_refund, membership_fee_decline, membership_benefit_use, membership_cash_earn, membership_cash_reverse, membership_cash_redeem, membership_cancel_immediate, membership_schedule_cancel, membership_resume, membership_cancel_trial, membership_clear_payment_hold, membership_change_plan, membership_update_payment]
    summary: >
      Callers are consumer and business members on every tier from Northgate Rewards to Northgate+ Business, in trial,
      active, payment_hold or cancel_pending status, asking why a membership fee was charged or declined, whether a
      cancellation earns a refund, why a delivery fee was or was not waived on an order, or why Northgate Cash went up or
      down after a purchase or a return. The records involved are the membership holding with its tier, term, renewal and
      payment hold dates, the fee, decline, refund, benefit-use and Northgate Cash ledger, and the orders, Northgate Card
      account and returns that feed it; the rules are per tier, from fees and billing periods (membership_evt_fee_charge)
      and trials (membership_trial) to the full-refund window, benefit-use test and month-based proration
      (membership_evt_fee_refund), payment holds and grace periods (membership_evt_payment_hold), the delivery benefit and
      its stacking with card and order thresholds (membership_delivery_benefit), and the earn rate, annual cap,
      oldest-first redemption and reversal of Northgate Cash (membership_evt_cash_earn, membership_evt_cash_redeem_expire,
      membership_evt_cash_reverse), with fees charged at period start, benefits recorded per order and cash earned on
      fulfilment as the natural order of events. The agent looks up and verifies, computes fee refunds, benefit values and
      cash reversals, books the charges, refunds and plan or payment-method changes it is allowed to make, while a
      cancellation, an immediate cancellation, a resume of auto-renew and a trial cancellation are the member's own
      decisions recorded as requests and confirmed by the member. Requests no charter rule decides, such as a refund for
      unused streaming time, a cash payout of Northgate Cash, a goodwill credit for a late delivery, or reinstating a lapsed
      membership with its old renewal date, have no policy path and go to a human representative as POLICY_NOT_COVERED.

  - name: store_card_billing_and_disputes
    claim:
      categories: [card]
      event_types: [card_open_dispute, card_dispute_credit, card_reverse_dispute_credit, card_resolve_dispute, card_assess_fee, card_reverse_fee, card_assess_interest, card_post_payment, card_post_credit, card_refund_credit_balance, card_set_autopay, card_change_limit, card_close]
    summary: >
      Callers are consumer and business cardholders on secured, private-label and Mastercard tiers, with accounts that
      are active, suspended or closed, disputing a charge from a Northgate order, a marketplace seller or an outside
      merchant, contesting a late or returned payment fee, asking why interest or deferred interest appeared, or asking
      where a refund or payment went. The records are the card account with its limit, balance and disputed balance, the
      statements with minimum due and due dates, purchases, credits, payments, returned payments, fees and disputes, and the
      orders, marketplace orders and returns the charges come from; the rules include the billing-error notice window and
      the network window on Mastercard tiers, one dispute per transaction and the merchant-attempt evidence
      (card_billing_dispute), provisional and final credits by tier (card_dispute_credits), first and repeat fees capped at
      the minimum due, the single-event rule and the courtesy waiver (card_evt_late_and_returned_fees), interest, grace and
      special financing (card_evt_interest), payment crediting and credit balances (card_evt_payments), and the
      cardholder discount and extended return days (card_cardholder_benefits), with statement, payment due date, fee and
      dispute following one another in the natural order of a billing cycle. The agent verifies, reads the statements and
      source records, opens disputes, posts credits, reverses or assesses fees and sets autopay or limits within policy,
      while closing the account and requesting a credit balance refund are the cardholder's own decisions recorded as
      requests and confirmed by the cardholder. Situations the charter does not decide, such as re-aging a delinquent
      account, settling a charged-off balance, removing a credit-bureau report or reopening a resolved dispute, go to a human
      representative as POLICY_NOT_COVERED.

  - name: protection_plan_claims_and_refunds
    claim:
      categories: [plan]
      event_types: [plan_purchase, plan_register_item, plan_file_claim, plan_decide_claim, plan_settle_claim, plan_fulfil, plan_cancel, plan_cancel_before_start, plan_refund, plan_charge, plan_lapse]
    summary: >
      Callers are plan holders with single-item Standard or Accident plans of different terms, or a Complete Monthly
      subscription, whose plans are purchased, active, expired, fulfilled or lapsed, asking to buy a plan for a recent
      purchase, to file a claim for a failure, a drop or a battery, to understand a denial or a service fee, or to cancel a
      plan and learn the refund. The records are the plan holding with its covered order line, item price, coverage dates,
      premium and remaining liability, the claim, decision and settlement ledger, and the order line with its fulfilment
      date and manufacturer warranty, plus the returns and payment methods around it; the rules cover the purchase window
      and price ladder (plan_purchase_eligibility_and_price), coverage start, term and waiting period (plan_coverage_term),
      covered perils, filing deadline, manufacturer-warranty deferral and the rolling claim limit (plan_claim_eligibility),
      repair-or-replace thresholds, the no-lemon rule, the service fee ladder and liability (plan_claim_settlement), the
      full-refund window, proration and cancellation fee (plan_cancellation_refund), the Complete Monthly billing and grace
      period (plan_complete_billing), and the one-plan-per-item and Complete overlap rules, with purchase, activation on
      fulfilment, claim, decision and settlement as the natural order of events. The agent verifies, checks coverage,
      records claims, decisions and settlements and books charges and refunds, while cancelling a plan is the holder's own
      decision recorded as a request and confirmed by the holder. Theft or loss, cosmetic damage, an extension of an
      expired term, a cash payout instead of a repair or a claim on an item bought elsewhere have no policy path and go to
      a human representative as POLICY_NOT_COVERED.

  - name: order_returns_and_price_adjustments
    claim:
      categories: [order]
      event_types: [order_return_line, order_adjust_price, order_refund_charge, order_charge_fee, order_cancel, order_reschedule, order_mark_returned]
    summary: >
      Callers are consumers and business buyers with register purchases, pickup and Drive Up orders, shipped and same-day
      deliveries and scheduled large-item deliveries, in placed, ready, fulfilled or partly returned status, asking to
      return items with or without a receipt, to get a price drop or a competitor's lower price refunded, to cancel or
      reschedule an order, to be refunded for a missing or damaged item, or to understand a delivery fee. The records are
      the order with its program, dates and tender, the line ledger with item category, return class, discounts and
      warranty, the fee rows with their waiver source, earlier returns and adjustments, and the customer's membership,
      Northgate Card account and protection plans; the rules cover the return windows by class, the fulfilled-date anchor,
      the cardholder extension and the holiday start, returned units, restocking and fee refunds (order_returns), no-receipt
      limits across orders (order_agg_no_receipt_limits), the price adjustment window and one adjustment per line
      (order_price_adjustment), fees and their waiver sources (order_evt_fees), cancellation, holds and missing items
      (order_fulfilment_and_cancellation), and refund tenders (order_refund_tender), with purchase, fulfilment, return or
      adjustment and refund as the natural order of events. The agent verifies, computes refunds and books returns,
      adjustments and refunds, while cancelling an order, rescheduling a delivery and scheduling a return pickup are the
      customer's own decisions recorded as requests and confirmed by the customer. Requests outside every rule, such as a
      return of a non-returnable item, a price match against a membership-only or marketplace offer, compensation for a
      late delivery, or a cash refund of a card purchase, go to a human representative as POLICY_NOT_COVERED.

  - name: marketplace_orders_and_guarantee
    claim:
      categories: [market]
      event_types: [market_request_return, market_seller_respond, market_seller_refund, market_contact_seller, market_open_claim, market_decide_claim, market_guarantee_reimburse, market_cancel, market_mark_refunded, market_refund_in_transit]
    summary: >
      Callers are consumer and business buyers of Northgate Marketplace items from seller-fulfilled, Pro, Fulfilled by
      Northgate, freight, renewed and international sellers, with orders placed, shipped, delivered, canceled or refunded,
      asking where an item is, how to return it to the seller, why a seller has not refunded, whether a Northgate
      Marketplace Guarantee claim can be filed, or why a claim was closed. The records are the marketplace order with its
      seller, delivery estimate and tracking, the line and shipping ledger, return requests, seller responses and refunds,
      seller contacts, claims, decisions and reimbursements, and the buyer's Northgate Card disputes on the same charge;
      the rules cover return windows, restocking and return shipping by seller program (market_returns), cancellation
      before shipment (market_cancellation), delivery estimates and shipping (market_shipping_and_delivery), the claim
      window, the not-received wait, the seller-contact wait and the card-dispute exclusion (market_guarantee_eligibility),
      the reimbursement amount and per-order maximum (market_guarantee_decision), which Northgate benefits apply only to
      Fulfilled by Northgate items (market_fbn_benefits) and claim frequency across orders (market_agg_claim_frequency),
      with order, shipment, delivery, seller contact, return and claim as the natural order of events. The agent
      verifies, records seller contacts, return requests, claims and decisions and books reimbursements and refunds,
      while asking to cancel and filing the guarantee claim itself are the buyer's own decisions recorded as requests and
      confirmed by the buyer. Requests the charter does not cover, such as a refund for a change of mind beyond what the
      seller offers, compensation for customs delays, a claim above the guarantee maximum, or a claim after the buyer's
      claim count reaches specialist review, go to a human representative as POLICY_NOT_COVERED.
