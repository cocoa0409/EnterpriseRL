category: card
display_name: Northgate Card Credit Accounts (issued by Harbor Point Bank, N.A.)

binding:
  holding_table: card_holdings
  event_tables: [card_events]
  intake_tables: [card_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {current_balance: balance_owed, disputed_balance: disputed_amount, security_deposit_usd: security_deposit}

lifecycle:
  states: [applied, active, suspended, closed, charged_off, declined]
  transitions:
    - {from: applied, to: active, by: system, means: The issuer approves the application and opens the account with a credit limit and statement closing day.}
    - {from: applied, to: declined, by: system, means: The issuer declines the application and an adverse action notice is sent.}
    - {from: active, to: suspended, by: system, means: Charging privileges are suspended because the account is past due beyond the suspension threshold or is under fraud review.}
    - {from: suspended, to: active, by: system, means: The account is brought current or the fraud review clears and charging privileges return.}
    - {from: active, to: closed, by: user, means: The cardholder closes the account; any remaining balance continues to be repaid on the existing terms.}
    - {from: suspended, to: charged_off, by: system, means: The account reaches the charge-off threshold of days past due and is charged off.}

accounts:
  - key: balance_owed
    unit: USD
    meaning: Amount the cardholder owes on the account; purchases, cash advances, interest, fees, returned payments and reversed credits book in, and payments, merchant credits, dispute credits, fee reversals and reward credits book out.
  - key: disputed_amount
    unit: USD
    meaning: Amount currently under billing-error dispute; opening a dispute books in and resolving or withdrawing it books out.
  - key: security_deposit
    unit: USD
    meaning: Refundable security deposit held on a secured account; the deposit books in and its refund books out.

parameter_schema:
  card_network: 'Network on which the card runs: closed_loop (usable only at Northgate) or mastercard'
  annual_fee_usd: Annual account fee, USD
  purchase_apr_pct: Annual percentage rate on purchase balances in effect for new accounts, percent
  cash_advance_apr_pct: APR on cash advance balances, percent; not_applicable on closed-loop cards
  cash_advance_fee_min_usd: Minimum cash advance fee per advance, USD; not_applicable on closed-loop cards
  cash_advance_fee_pct: Cash advance fee as percent of the advance (the greater of this and the minimum applies);
    not_applicable on closed-loop cards
  penalty_apr_applies: Whether a penalty APR can ever be applied, boolean
  foreign_transaction_fee_pct: Fee on purchases processed outside the US, percent; not_applicable on closed-loop
    cards
  interest_method: Interest calculation method
  interest_days_in_year: Divisor used to turn the APR into a daily periodic rate
  minimum_interest_charge_usd: Smallest interest charge assessed in a cycle in which any interest is due, USD
  payment_due_days_after_close: Calendar days from the statement closing date to the payment due date (at least
    21 by law)
  grace_requires_prior_paid_in_full: Whether interest-free grace on new purchases requires the previous statement
    balance to have been paid in full by its due date, boolean
  min_payment_floor_usd: Floor of the minimum payment due, USD (the whole new balance when the balance is lower)
  min_payment_pct_of_balance: Percent of the new balance (excluding disputed amounts) that, plus that cycle's interest
    and fees, forms the minimum payment when it exceeds the floor
  payment_cutoff_time_et: Time (Eastern) by which a payment must be received on a business day to be credited that
    day
  payment_channels: Channels in which payments are accepted, list
  in_store_payment_max_usd: Largest single cash payment accepted at a Northgate register, USD; not_applicable where
    in-store payment is not offered
  autopay_options: Automatic payment amounts the cardholder can choose, list
  payment_allocation: How the part of a payment above the minimum is allocated
  late_fee_first_usd: Late payment fee for a first late payment, USD
  late_fee_repeat_usd: Late payment fee when another late payment occurred in any of the previous six billing cycles,
    USD
  late_fee_repeat_lookback_cycles: Number of previous billing cycles searched for an earlier late payment to apply
    the repeat late fee
  late_fee_cap_basis: 'Ceiling on a late fee: never more than the minimum payment that was due'
  returned_payment_fee_first_usd: Returned payment fee for a first returned payment, USD
  returned_payment_fee_repeat_usd: Returned payment fee when another returned payment occurred in the previous six
    billing cycles, USD
  courtesy_late_fee_waivers_per_12_months: Number of late fees that may be reversed as a courtesy in any rolling
    12 months
  over_limit_fee_usd: Over-the-limit fee, USD (Northgate Cards never charge one; transactions over the limit are
    declined)
  credit_limit_min_usd: Lowest credit limit assigned at opening, USD
  credit_limit_max_usd: Highest credit limit the tier carries, USD
  security_deposit_min_usd: Minimum refundable security deposit, USD (0.00 on unsecured tiers)
  secured_limit_equals_deposit: Whether the credit limit equals the security deposit, boolean
  graduation_review_on_time_cycles: Consecutive on-time statement cycles after which a secured account is reviewed
    for an unsecured Northgate Store Card (0 means not applicable)
  deposit_refund_business_days: Business days after graduation or after closure with a zero balance within which
    the security deposit is refunded
  credit_line_review_months: Minimum months on book, and months between reviews, before a requested credit line
    increase is considered
  cardholder_discount_pct: Discount taken at checkout on eligible Northgate purchases paid with the card, percent
  cardholder_discount_excluded: Purchase types on which the cardholder discount never applies, list
  cardholder_free_standard_shipping: Whether standard shipping on Ship to Home orders paid with the card is free
    regardless of order size, boolean
  cardholder_extra_return_days: Extra calendar days added to the standard return window for items bought with the
    card
  outside_rewards_pct: Rewards earned on purchases outside Northgate as a percent of the purchase, credited at statement
    close; not_applicable on closed-loop cards
  dispute_notice_days_after_statement: Calendar days after the statement on which the disputed transaction first
    appeared within which a billing-error notice must be received
  network_dispute_window_days: Calendar days after the transaction date within which a dispute on a non-Northgate
    Mastercard purchase can still be raised with the network; not_applicable on closed-loop cards
  dispute_ack_days: Calendar days after receiving a billing-error notice within which the issuer acknowledges it
  dispute_max_resolution_cycles: Maximum complete billing cycles to resolve a billing-error dispute (never more
    than 90 days)
  dispute_max_resolution_days: Maximum calendar days to resolve a billing-error dispute
  provisional_credit_on_open: Whether a provisional credit for the disputed amount is posted when a dispute is opened,
    boolean
  quality_dispute_requires_merchant_attempt: Whether a not_as_described or returned_not_credited dispute requires
    a prior good-faith attempt to resolve it with the merchant, boolean
  unauthorized_liability_usd: Cardholder liability for unauthorized use, USD
  change_in_terms_notice_days: Calendar days of advance notice before an APR increase or other significant change
    in terms
  suspension_days_past_due: Days past due at which charging privileges are suspended
  charge_off_days_past_due: Days past due at which the account is charged off
  credit_balance_refund_business_days: Business days after a written request within which a credit balance above
    the minimum is refunded
  credit_balance_refund_min_usd: Credit balance above which a refund is made on request, USD
  credit_balance_auto_refund_months: Months after which a remaining credit balance above the minimum is refunded
    without a request
  deferred_interest_min_purchase_usd: Smallest single Northgate purchase eligible for special financing, USD; not_applicable
    where special financing is not offered
  deferred_interest_promo_months: Special financing periods offered at checkout, months; empty where not offered
  authorized_users_max: Maximum authorized users or employee cards on the account
  reapply_wait_days: Calendar days after a declined application before the customer may apply for a Northgate Card
    again
  replacement_card_fee_usd: Fee for a replacement card, USD
