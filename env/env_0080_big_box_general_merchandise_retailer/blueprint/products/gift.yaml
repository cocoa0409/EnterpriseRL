events:
  - type: gift_issue_card
    target: gift_holdings
    mutation: create
    meaning: A gift card, eGift card, merchandise return card, promotional card or bulk card is issued.
    grain: One row per card.
    fields:
      variant_name: Card type.
      issue_date: Date of issue.
      issue_reason: purchase, no_receipt_return, gift_receipt_return, protection_claim_reimbursement, promotion or bulk_order.
      initial_value_usd: Value loaded at issue.
      card_number_last4: Last four digits of the card number.
    triggers:
      - event: gift:gift_load_value
        map: {amount_usd: initial_value_usd, event_date: issue_date, load_type: initial_load}
  - type: gift_activate
    target: gift_holdings
    mutation: {transition: {from: issued, to: active}}
    meaning: The card becomes usable.
    grain: One row per transaction.
    fields:
      activation_date: Activation date.
      expiration_date: Last usable day of a promotional card; empty otherwise.
    triggers: []
  - type: gift_cancel_unactivated
    target: gift_holdings
    mutation: {transition: {from: issued, to: canceled}}
    meaning: An unactivated card is voided.
    grain: One row per transaction.
    fields:
      closed_date: Void date.
    triggers: []
  - type: gift_freeze
    target: gift_holdings
    mutation: {transition: {from: active, to: frozen}}
    meaning: The card is frozen for a loss report or fraud review.
    grain: One row per transaction.
    fields:
      frozen_reason: lost_or_stolen or fraud_review.
    triggers: []
  - type: gift_unfreeze
    target: gift_holdings
    mutation: {transition: {from: frozen, to: active}}
    meaning: A fraud review clears.
    grain: One row per transaction.
    fields:
      frozen_reason: Reset to none.
    triggers: []
  - type: gift_close_replaced
    target: gift_holdings
    mutation: {transition: {from: frozen, to: canceled}}
    meaning: A frozen card is closed after its balance moves to a replacement card.
    grain: One row per transaction.
    fields:
      closed_date: Closing date.
      replaced_by_gift_card_id: The replacement card.
    triggers: []
  - type: gift_deplete
    target: gift_holdings
    mutation: {transition: {from: active, to: depleted}}
    meaning: The balance reaches zero.
    grain: One row per transaction.
    fields:
      closed_date: Date the balance reached zero.
    triggers: []
  - type: gift_reactivate
    target: gift_holdings
    mutation: {transition: {from: depleted, to: active}}
    meaning: A depleted card receives value again by reload or refund.
    grain: One row per transaction.
    fields:
      closed_date: Cleared to empty.
    triggers: []
  - type: gift_expire
    target: gift_holdings
    mutation: {transition: {from: active, to: expired}}
    meaning: A promotional card passes its expiration date.
    grain: One row per transaction.
    fields:
      closed_date: Day after the expiration date.
    triggers: []
  - type: gift_register
    target: gift_holdings
    mutation: update
    meaning: The card is registered to a customer profile.
    grain: One row per registration.
    fields:
      registered: Set to true.
    triggers: []
  - type: gift_load_value
    target: gift_events
    meaning: Value is loaded onto the card at issue, by reload or by a balance transfer in.
    grain: One row per load.
    distinguish_by: [load_type, event_date, load_reference]
    fields:
      event_date: Load date.
      amount_usd: Value loaded, positive.
      load_type: initial_load, reload or balance_transfer_in.
      load_reference: Register or online transaction reference of the load.
    account: gift_balance
    direction: in
    triggers: []
  - type: gift_redeem
    target: gift_events
    meaning: The card pays for all or part of a purchase.
    grain: One row per purchase paid.
    distinguish_by: [source_record_id, event_date]
    fields:
      event_date: Purchase date.
      amount_usd: Value used, positive.
      source_record_id: Northgate order or marketplace order paid.
    account: gift_balance
    direction: out
    triggers: []
  - type: gift_refund_to_card
    target: gift_events
    meaning: A refund of a purchase paid with the card is credited back to it.
    grain: One row per refund.
    distinguish_by: [original_event_id, event_date]
    fields:
      event_date: Refund date.
      amount_usd: Value credited, positive.
      original_event_id: The gift_redeem row of the refunded purchase.
      source_record_id: Return or refund record that produced the credit.
    account: gift_balance
    direction: in
    triggers: []
  - type: gift_expire_value
    target: gift_events
    meaning: Unused promotional value lapses.
    grain: One row per expired card.
    distinguish_by: [event_date]
    fields:
      event_date: Expiry date.
      amount_usd: Value lapsed, positive.
    account: gift_balance
    direction: out
    triggers: []
  - type: gift_transfer_out
    target: gift_events
    meaning: The balance is moved to a replacement or combined card.
    grain: One row per transfer.
    distinguish_by: [counterpart_gift_card_id]
    fields:
      event_date: Transfer date.
      amount_usd: Value moved, positive.
      counterpart_gift_card_id: The receiving card.
    account: gift_balance
    direction: out
    triggers: []
  - type: gift_void_value
    target: gift_events
    meaning: Value loaded through fraud, or a promotional value clawed back, is removed.
    grain: One row per voided load.
    distinguish_by: [original_event_id]
    fields:
      event_date: Void date.
      amount_usd: Value removed, positive.
      original_event_id: The load voided.
      void_reason: fraudulent_load or promo_clawback.
    account: gift_balance
    direction: out
    triggers: []

measures:
  - id: gift_msr_purchased_today
    window: The calendar day of the purchase being evaluated.
    measure: Sum of initial_value_usd of gift_holdings rows with issue_reason purchase or bulk_order issued to the customer that day, plus reload amounts loaded that day.
  - id: gift_msr_reloads_today
    window: The calendar day of the reload being evaluated.
    measure: Count of gift_load_value rows with load_type reload on the card that day.

policies:
  - id: gift_agg_multi_holding
    subject: [gift_issue_card]
    rule: >-
      A customer may hold any number of gift cards of any type at the same time, each card being its own record with
      its own balance.
    eligibility: []
    params:
      max_per_customer: null

  - id: gift_agg_tender_and_limits
    subject: [gift_issue_card, gift_redeem, gift_transfer_out]
    rule: >-
      Balances on different cards are never combined, except that a
      Northgate Reloadable Gift Card's balance may be moved onto another reloadable card of the same holder where
      balance_transfer_allowed is true. Up to max_cards_per_purchase cards may be used as tender in one purchase, and
      the daily purchase limit is measured across all cards bought by the customer that day.
    eligibility: []
    measures: [gift_msr_purchased_today]
    params:
      per_tier:
        Northgate Gift Card: {max_cards_per_purchase: "=max_cards_per_purchase", daily_purchase_limit_usd: "=daily_purchase_limit_usd"}
        Northgate eGift Card: {max_cards_per_purchase: "=max_cards_per_purchase", daily_purchase_limit_usd: "=daily_purchase_limit_usd"}
        Northgate Merchandise Return Card: {max_cards_per_purchase: "=max_cards_per_purchase", daily_purchase_limit_usd: "=daily_purchase_limit_usd"}
        Northgate Promotional Gift Card: {max_cards_per_purchase: "=max_cards_per_purchase", daily_purchase_limit_usd: "=daily_purchase_limit_usd"}
        Northgate Business Bulk Gift Card: {max_cards_per_purchase: "=max_cards_per_purchase", daily_purchase_limit_usd: "=daily_purchase_limit_usd"}
        Northgate Reloadable Gift Card: {max_cards_per_purchase: "=max_cards_per_purchase", daily_purchase_limit_usd: "=daily_purchase_limit_usd"}

  - id: gift_issue_and_activation
    subject: [gift_issue_card, gift_activate, gift_cancel_unactivated, gift_load_value]
    rule: >-
      A card is issued only for one of its type's issue_reasons, with an initial value between min_initial_value_usd and
      max_initial_value_usd, bought with the type's purchase_payment_methods and with no purchase fee. A merchandise return
      card is issued for the refund of a no-receipt or gift-receipt return, and an eGift card for a protection plan claim
      reimbursement, at the exact refund or reimbursement amount. A card becomes usable under activation_method after
      activation_hold_hours hours. A card sold but not activated can be voided and its purchase refunded only where
      unactivated_void_allowed is true. An activated card cannot be returned for a refund. Balances are never charged a
      dormancy fee and are paid out in cash only where state law requires it.
      dormancy_fee_usd and purchase_fee_usd are zero, refundable_after_activation is false, photo ID is checked at issue where id_required_for_issue is true, the holder's name is kept where holder_name_on_card is true, a custom message or logo is printed where card_design_customization is true, cards follow number_format, and cash payouts follow cash_out_policy. eGift cards are delivered under egift_delivery, may be scheduled up to egift_scheduled_delivery_max_days days ahead and resent where egift_resend_allowed is true.
    eligibility: []
    params:
      per_tier:
        Northgate Gift Card: {min_initial_value_usd: "=min_initial_value_usd", max_initial_value_usd: "=max_initial_value_usd", activation_hold_hours: "=activation_hold_hours"}
        Northgate eGift Card: {min_initial_value_usd: "=min_initial_value_usd", max_initial_value_usd: "=max_initial_value_usd", activation_hold_hours: "=activation_hold_hours"}
        Northgate Merchandise Return Card: {min_initial_value_usd: "=min_initial_value_usd", max_initial_value_usd: "=max_initial_value_usd", activation_hold_hours: "=activation_hold_hours"}
        Northgate Promotional Gift Card: {min_initial_value_usd: "=min_initial_value_usd", max_initial_value_usd: "=max_initial_value_usd", activation_hold_hours: "=activation_hold_hours"}
        Northgate Business Bulk Gift Card: {min_initial_value_usd: "=min_initial_value_usd", max_initial_value_usd: "=max_initial_value_usd", activation_hold_hours: "=activation_hold_hours"}
        Northgate Reloadable Gift Card: {min_initial_value_usd: "=min_initial_value_usd", max_initial_value_usd: "=max_initial_value_usd", activation_hold_hours: "=activation_hold_hours"}

  - id: gift_redemption
    subject: [gift_redeem, gift_deplete]
    rule: >-
      A card pays for purchases in its redemption_channels up to its balance, combined with other tenders, never for the
      purchases in excluded_purchases, and on Northgate Marketplace orders only where redeemable_on_marketplace is true. A
      card can be spent only while it is in active status. A promotional card applies only to a purchase of at least
      promo_min_purchase_usd and cannot be combined with another promotional card where promo_stackable is false. When the
      balance reaches zero the card becomes depleted.
      Cards combine with other tenders where split_tender_allowed is true, need the access number online where pin_required_online is true, and values are kept to balance_rounding. A card may be given to another person where transfer_to_another_person is true, and balances can be checked through balance_check_channels.
    eligibility:
      - id: spend_active_only
        applies_to: [gift_redeem]
        kind: state
        condition: A card can be spent only while it is in active status.
        evidence_fields: [gift_holdings.status, gift_holdings.gift_card_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gift_holdings.gift_card_id]
          action_bindings:
            gift_holdings.gift_card_id: gift_card_id
        state_contract:
          field: gift_holdings.status
          allowed: [active]
    params:
      per_tier:
        Northgate Gift Card: {redeemable_on_marketplace: "=redeemable_on_marketplace", promo_min_purchase_usd: "=promo_min_purchase_usd"}
        Northgate eGift Card: {redeemable_on_marketplace: "=redeemable_on_marketplace", promo_min_purchase_usd: "=promo_min_purchase_usd"}
        Northgate Merchandise Return Card: {redeemable_on_marketplace: "=redeemable_on_marketplace", promo_min_purchase_usd: "=promo_min_purchase_usd"}
        Northgate Promotional Gift Card: {redeemable_on_marketplace: "=redeemable_on_marketplace", promo_min_purchase_usd: "=promo_min_purchase_usd"}
        Northgate Business Bulk Gift Card: {redeemable_on_marketplace: "=redeemable_on_marketplace", promo_min_purchase_usd: "=promo_min_purchase_usd"}
        Northgate Reloadable Gift Card: {redeemable_on_marketplace: "=redeemable_on_marketplace", promo_min_purchase_usd: "=promo_min_purchase_usd"}

  - id: gift_refunds_to_card
    subject: [gift_refund_to_card, gift_reactivate]
    rule: >-
      When a purchase paid with a gift card is returned with a receipt, the part paid with the card is credited back to
      the same card where refund_back_to_card is true, even if the card was depleted, which makes it active again; if that
      card is expired or canceled the amount is issued on a new merchandise return card. The promotional-card portion of
      a returned purchase is handled under promo_portion_refund and is never refunded. A refund to a card never exceeds
      the amount the card paid on that purchase less earlier refunds to it.
    eligibility: []
    params:
      per_tier:
        Northgate Gift Card: {refund_back_to_card: "=refund_back_to_card", promo_portion_refund: "=promo_portion_refund"}
        Northgate eGift Card: {refund_back_to_card: "=refund_back_to_card", promo_portion_refund: "=promo_portion_refund"}
        Northgate Merchandise Return Card: {refund_back_to_card: "=refund_back_to_card", promo_portion_refund: "=promo_portion_refund"}
        Northgate Promotional Gift Card: {refund_back_to_card: "=refund_back_to_card", promo_portion_refund: "=promo_portion_refund"}
        Northgate Business Bulk Gift Card: {refund_back_to_card: "=refund_back_to_card", promo_portion_refund: "=promo_portion_refund"}
        Northgate Reloadable Gift Card: {refund_back_to_card: "=refund_back_to_card", promo_portion_refund: "=promo_portion_refund"}

  - id: gift_promo_expiry_and_clawback
    subject: [gift_expire, gift_expire_value, gift_void_value]
    rule: >-
      Only promotional value expires. A Northgate Promotional Gift Card can be used through its issue date plus
      promo_valid_days calendar days, the last usable day recorded as expiration_date, and any value left after that day
      lapses on the following day. Where promo_clawback_on_return is true and the purchase that earned the promotional card
      is returned, any unused promotional value is voided as promo_clawback, and value already spent is deducted from the
      return's refund. Value loaded through a fraudulent transaction is voided as fraudulent_load. Purchased, return and
      bulk cards never expire.
    eligibility: []
    params:
      per_tier:
        Northgate Gift Card: {promo_valid_days: "=promo_valid_days", promo_clawback_on_return: "=promo_clawback_on_return"}
        Northgate eGift Card: {promo_valid_days: "=promo_valid_days", promo_clawback_on_return: "=promo_clawback_on_return"}
        Northgate Merchandise Return Card: {promo_valid_days: "=promo_valid_days", promo_clawback_on_return: "=promo_clawback_on_return"}
        Northgate Promotional Gift Card: {promo_valid_days: "=promo_valid_days", promo_clawback_on_return: "=promo_clawback_on_return"}
        Northgate Business Bulk Gift Card: {promo_valid_days: "=promo_valid_days", promo_clawback_on_return: "=promo_clawback_on_return"}
        Northgate Reloadable Gift Card: {promo_valid_days: "=promo_valid_days", promo_clawback_on_return: "=promo_clawback_on_return"}

  - id: gift_lost_stolen
    subject: [gift_freeze, gift_unfreeze, gift_close_replaced, gift_transfer_out, gift_register]
    rule: >-
      A lost or stolen card can be frozen and replaced only when it is registered or the holder has the purchase receipt
      showing its number, as lost_replacement_requires states. Only the balance remaining when the loss is reported is
      protected; value spent before the report is not restored. A card can be frozen only while it is in active status.
      The replacement is a new card of the same type, with no fee, loaded with the protected balance by a balance transfer,
      and the old card is closed. A fraud review is completed within fraud_review_business_days business days and either
      unfreezes the card or voids the fraudulent value.
      Cards can be registered where registration_allowed is true, and replacement protects only what replacement_protects_from states.
    eligibility:
      - id: freeze_active_only
        applies_to: [gift_freeze]
        kind: state
        condition: A card can be frozen only while it is in active status.
        evidence_fields: [gift_holdings.status, gift_holdings.gift_card_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gift_holdings.gift_card_id]
          action_bindings:
            gift_holdings.gift_card_id: gift_card_id
        state_contract:
          field: gift_holdings.status
          allowed: [active]
    params:
      per_tier:
        Northgate Gift Card: {lost_replacement_requires: "=lost_replacement_requires", replacement_fee_usd: "=replacement_fee_usd"}
        Northgate eGift Card: {lost_replacement_requires: "=lost_replacement_requires", replacement_fee_usd: "=replacement_fee_usd"}
        Northgate Merchandise Return Card: {lost_replacement_requires: "=lost_replacement_requires", replacement_fee_usd: "=replacement_fee_usd"}
        Northgate Promotional Gift Card: {lost_replacement_requires: "=lost_replacement_requires", replacement_fee_usd: "=replacement_fee_usd"}
        Northgate Business Bulk Gift Card: {lost_replacement_requires: "=lost_replacement_requires", replacement_fee_usd: "=replacement_fee_usd"}
        Northgate Reloadable Gift Card: {lost_replacement_requires: "=lost_replacement_requires", replacement_fee_usd: "=replacement_fee_usd"}

  - id: gift_bulk_orders
    subject: [gift_issue_card]
    rule: >-
      Business bulk orders are placed by business profiles for at least bulk_min_order_usd and at most
      bulk_max_cards_per_order cards, paid by ACH, check or a Northgate Business Card, or charged to a Northgate Business
      invoice account where business_invoice_allowed is true. The order earns the bulk_discount_ladder discount for its
      total value, and the cards activate once the order is paid. The cards then follow the same rules as any other card.
    eligibility: []
    params:
      per_tier:
        Northgate Gift Card: {bulk_min_order_usd: "=bulk_min_order_usd", bulk_discount_ladder: "=bulk_discount_ladder"}
        Northgate eGift Card: {bulk_min_order_usd: "=bulk_min_order_usd", bulk_discount_ladder: "=bulk_discount_ladder"}
        Northgate Merchandise Return Card: {bulk_min_order_usd: "=bulk_min_order_usd", bulk_discount_ladder: "=bulk_discount_ladder"}
        Northgate Promotional Gift Card: {bulk_min_order_usd: "=bulk_min_order_usd", bulk_discount_ladder: "=bulk_discount_ladder"}
        Northgate Business Bulk Gift Card: {bulk_min_order_usd: "=bulk_min_order_usd", bulk_discount_ladder: "=bulk_discount_ladder"}
        Northgate Reloadable Gift Card: {bulk_min_order_usd: "=bulk_min_order_usd", bulk_discount_ladder: "=bulk_discount_ladder"}

  - id: gift_reload
    subject: [gift_load_value, gift_reactivate]
    rule: >-
      Only a Northgate Reloadable Gift Card can be reloaded, in reload_channels, by at least min_reload_usd, at most
      max_reloads_per_day times a day as gift_msr_reloads_today counts, and never above max_balance_usd. Value can be loaded only on a card in issued, active or depleted status, the issued case being the initial load at issue and a reload on a depleted card making it active again.
    eligibility:
      - id: reload_status
        applies_to: [gift_load_value]
        kind: state
        condition: Value can be loaded only on a card in issued, active or depleted status, the issued case being the initial load at issue and a reload on a depleted card making it active again.
        evidence_fields: [gift_holdings.status, gift_holdings.gift_card_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gift_holdings.gift_card_id]
          action_bindings:
            gift_holdings.gift_card_id: gift_card_id
        state_contract:
          field: gift_holdings.status
          allowed: [issued, active, depleted]
    measures: [gift_msr_reloads_today]
    params:
      per_tier:
        Northgate Gift Card: {min_reload_usd: "=min_reload_usd", max_reloads_per_day: "=max_reloads_per_day", max_balance_usd: "=max_balance_usd"}
        Northgate eGift Card: {min_reload_usd: "=min_reload_usd", max_reloads_per_day: "=max_reloads_per_day", max_balance_usd: "=max_balance_usd"}
        Northgate Merchandise Return Card: {min_reload_usd: "=min_reload_usd", max_reloads_per_day: "=max_reloads_per_day", max_balance_usd: "=max_balance_usd"}
        Northgate Promotional Gift Card: {min_reload_usd: "=min_reload_usd", max_reloads_per_day: "=max_reloads_per_day", max_balance_usd: "=max_balance_usd"}
        Northgate Business Bulk Gift Card: {min_reload_usd: "=min_reload_usd", max_reloads_per_day: "=max_reloads_per_day", max_balance_usd: "=max_balance_usd"}
        Northgate Reloadable Gift Card: {min_reload_usd: "=min_reload_usd", max_reloads_per_day: "=max_reloads_per_day", max_balance_usd: "=max_balance_usd"}
