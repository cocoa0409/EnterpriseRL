category: gift
display_name: Northgate Gift Cards and Merchandise Return Cards

binding:
  holding_table: gift_holdings
  event_tables: [gift_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_usd: gift_balance}

lifecycle:
  states: [issued, active, frozen, depleted, expired, canceled]
  transitions:
    - {from: issued, to: active, by: system, means: The card is activated at the register, at eGift delivery, or when a refund or reimbursement card is created.}
    - {from: issued, to: canceled, by: system, means: An unactivated card is voided, for example when a register sale is reversed before activation.}
    - {from: active, to: frozen, by: system, means: The card is frozen after the registered holder reports it lost or stolen, or for a fraud review.}
    - {from: frozen, to: active, by: system, means: The fraud review clears and the card can be used again.}
    - {from: frozen, to: canceled, by: system, means: A frozen card's balance is moved to a replacement card and the old card is closed.}
    - {from: active, to: depleted, by: system, means: The balance reaches zero.}
    - {from: depleted, to: active, by: system, means: A reloadable card is reloaded, or a refund is credited back to the card.}
    - {from: active, to: expired, by: system, means: A promotional card reaches its expiration date and the unused value lapses.}

accounts:
  - key: gift_balance
    unit: USD
    meaning: Spendable value on the card; loads, refunds to the card and balance transfers in book in, and redemptions, expirations, voids and transfers out book out.

parameter_schema:
  min_initial_value_usd: Smallest value a card can be issued with, USD
  max_initial_value_usd: Largest value a card can be issued with, USD
  max_balance_usd: Largest balance the card may hold at any time, USD
  reloadable: Whether value can be added after issue, boolean
  min_reload_usd: Smallest reload, USD; not_applicable where reloading is not allowed
  issue_reasons: Reasons for which the card type is issued, list
  activation_method: How the card becomes usable
  activation_hold_hours: Hours after purchase before the card can be used, as a fraud control
  expires: Whether unused value expires, boolean (only promotional value may expire)
  promo_valid_days: Calendar days after issue through which a promotional card can be used; not_applicable where
    value never expires
  promo_clawback_on_return: Whether returning the purchase that earned a promotional card deducts the promotional
    value from the refund when the card has been used, boolean
  dormancy_fee_usd: Monthly fee charged on an unused card, USD (Northgate charges none)
  purchase_fee_usd: Fee charged when buying the card, USD
  purchase_payment_methods: Tenders accepted to buy or load the card, list
  daily_purchase_limit_usd: Most worth of these cards one customer may buy per day, USD
  bulk_min_order_usd: Smallest bulk order, USD; 0.00 where bulk ordering does not apply
  bulk_discount_ladder: Discount on a bulk order by order value, list of [min_usd, max_usd, pct]
  bulk_max_cards_per_order: Most cards in one order
  redemption_channels: Where the card can be spent, list
  redeemable_on_marketplace: Whether the card can pay for Northgate Marketplace orders, boolean
  promo_min_purchase_usd: Smallest purchase on which a promotional card can be applied, USD; 0.00 where none
  excluded_purchases: Purchases the card cannot pay for, list
  refundable_after_activation: Whether an activated card can be returned for a refund, boolean
  unactivated_void_allowed: Whether a card sold but not yet activated can be voided and its purchase refunded, boolean
  refund_back_to_card: Whether a return of a purchase paid with the card credits the value back to the same card,
    boolean
  promo_portion_refund: How the promotional-card portion of a returned purchase is refunded
  registration_allowed: Whether the card can be registered to a customer profile, boolean
  lost_replacement_requires: 'What is needed to replace a lost or stolen card: registration, or the purchase receipt
    showing the card number'
  replacement_fee_usd: Fee to replace a lost or stolen card, USD
  replacement_protects_from: Only the balance remaining when the loss is reported is protected
  fraud_review_business_days: Business days a fraud review of a frozen card may take
  balance_transfer_allowed: Whether the balance can be moved to another card of the same holder (combining or replacing),
    boolean
  balance_check_channels: Ways to check the balance, list
  egift_delivery: How an eGift card is delivered; not_applicable for physical cards
  egift_scheduled_delivery_max_days: Most calendar days ahead an eGift delivery can be scheduled; 0 where not applicable
  egift_resend_allowed: Whether an eGift can be resent to the same recipient address, boolean
  id_required_for_issue: Whether photo ID is checked when the card is issued
  cash_out_policy: Whether a balance can be paid out in cash
  split_tender_allowed: Whether the card can be combined with other tenders in one purchase, boolean
  max_cards_per_purchase: Most gift cards usable as tender in one purchase
  number_format: Card number format
  pin_required_online: Whether the access number is needed to spend online, boolean
  business_invoice_allowed: Whether a bulk order can be charged to a Northgate Business invoice account, boolean
  balance_rounding: Rounding applied to card values
  reload_channels: Where a reload can be made, list; empty where reloading is not allowed
  max_reloads_per_day: Most reloads per day; 0 where reloading is not allowed
  card_design_customization: Whether a custom message or logo can be printed, boolean
  holder_name_on_card: Whether the holder's name is recorded with the card, boolean
  transfer_to_another_person: Whether the card can be given to another person, boolean
  promo_stackable: Whether more than one promotional card can be used on one purchase, boolean
