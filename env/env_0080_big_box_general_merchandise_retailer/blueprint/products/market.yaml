category: market
display_name: Northgate Marketplace Orders and the Northgate Marketplace Guarantee

binding:
  holding_table: market_holdings
  event_tables: [market_events]
  intake_tables: [market_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {amount_paid_usd: market_amount_paid}

lifecycle:
  states: [placed, shipped, delivered, canceled, refunded]
  transitions:
    - {from: placed, to: shipped, by: system, means: The seller, or Northgate for Fulfilled by Northgate items, ships the order with tracking.}
    - {from: shipped, to: delivered, by: system, means: The carrier confirms delivery.}
    - {from: placed, to: canceled, by: system, means: The order is canceled before shipment, at the buyer's request accepted by the seller, because the seller cannot fulfil it, or because it was not shipped in time.}
    - {from: shipped, to: refunded, by: system, means: A shipped order that never arrives is fully refunded by the seller or under the guarantee.}
    - {from: delivered, to: refunded, by: system, means: A delivered order is fully refunded by the seller or under the guarantee.}

accounts:
  - key: market_amount_paid
    unit: USD
    meaning: Net amount the buyer has paid on the marketplace order; item lines and seller shipping charges book in, and seller refunds and guarantee reimbursements book out.

parameter_schema:
  fulfilled_by: Who stores, packs and ships the item
  handling_business_days: Business days after the order date within which the item must ship
  transit_business_days_max: Longest transit time in business days used for the maximum estimated delivery date
  business_day_calendar: Calendar used for business days
  late_shipment_cancel_business_days: Business days after the handling deadline after which an unshipped order may
    be canceled by the buyer with a full refund
  shipping_fee_basis: 'Who sets the shipping charge: seller_rate, or northgate_ship_to_home meaning the order charter''s
    Ship to Home fee rules apply'
  membership_shipping_benefit_applies: Whether membership delivery benefits can apply, boolean
  cardholder_discount_applies: Whether the Northgate Card cardholder discount applies, boolean
  rewards_cash_earned: Whether Northgate Cash is earned on the items, boolean
  price_match_eligible: Whether Northgate price adjustment or price match applies, boolean
  protection_plan_eligible: Whether a Northgate Protect plan can cover the item, boolean
  item_condition: Condition in which items are sold
  return_window_days: Calendar days after delivery within which a return can be requested
  return_destination: Where returned items go
  changed_mind_return_shipping: Who pays return shipping when the buyer changed their mind
  seller_fault_return_shipping: Who pays return shipping when the item is defective, damaged, wrong or not as described
  seller_restocking_fee_max_pct: Highest restocking fee a seller may withhold on an opened item returned for changed_mind,
    percent
  seller_return_response_business_days: Business days within which the seller must answer a return request (authorize,
    refund without return, or decline with a reason); 0 where Northgate handles returns
  seller_refund_business_days: Business days after the return is delivered to the seller within which the seller
    must refund; 0 where Northgate refunds at drop-off
  partial_refund_without_return_allowed: Whether the seller may offer a partial refund to keep the item, boolean
  freight_damage_report_days: Calendar days after delivery within which freight damage must be reported; 0 where
    not applicable
  freight_delivery_appointment: Whether delivery is by appointment with the freight carrier, boolean
  signature_required_min_usd: Order total at or above which delivery needs a signature, USD
  renewed_warranty_months: Minimum seller warranty on renewed items in months; 0 where not applicable
  customs_duties: How import duties are handled
  guarantee_contact_seller_wait_business_days: Business days the buyer must give the seller to respond after contacting
    them before a guarantee claim can be filed; 0 where Northgate is the seller-side contact
  guarantee_not_received_wait_days: Calendar days after the maximum estimated delivery date after which a not-received
    claim can be filed
  guarantee_claim_window_days: Calendar days after the maximum estimated delivery date within which a guarantee
    claim must be filed
  guarantee_max_per_order_usd: Most reimbursed under the guarantee for one order, USD
  guarantee_covered_reasons: Claim reasons the guarantee covers, list
  guarantee_requires_return_for_not_as_described: Whether a not-as-described claim is reimbursed only after the
    item is returned with tracking, boolean
  guarantee_return_ship_by_days: Calendar days after a claim decision requiring a return within which the buyer
    must ship the item back
  guarantee_reimbursement_basis: 'Amount reimbursed: price paid for the affected items plus their shipping, less
    anything the seller already refunded'
  guarantee_reimbursement_method: Tender for guarantee reimbursements
  guarantee_seller_response_business_days: Business days the seller is given to answer a filed claim before Northgate
    decides
  guarantee_decision_business_days: Business days after the seller's response deadline within which Northgate decides
    the claim
  guarantee_claims_per_12_months: Guarantee claims a buyer may file in any rolling 12 months before further claims
    go to specialist review
  guarantee_excluded_with_card_dispute: Whether a claim is closed when the buyer has a card dispute open or resolved
    on the same charge, boolean
  guarantee_covers_buyer_remorse: Whether a change of mind is covered by the guarantee, boolean
  renewed_defect_window_days: Calendar days after delivery during which a renewed item that stops working is covered
    as renewed_defect; 0 where not applicable
  cancel_request_allowed_statuses: Order statuses in which the buyer may ask to cancel, list
  seller_cancel_response_business_days: Business days within which the seller must accept or decline a buyer cancellation
    request
  cancellation_refund_basis: Refund on a canceled order
  seller_refund_method: Tender for seller refunds
  shipping_refund_on_seller_fault: Whether the original shipping charge is refunded with a seller-fault return,
    boolean
  shipping_refund_on_changed_mind: Whether the original shipping charge is refunded with a changed_mind return,
    boolean
  tracking_required: Whether the shipment must carry carrier tracking, boolean
  return_drop_off_at_store: Whether the item can be dropped off at a Northgate store for return, boolean
  seller_contact_channel: Channel through which the buyer contacts the seller
  claim_channels: Channels in which a guarantee claim can be filed, list
  refund_rounding: Rounding applied to refunds and reimbursements
