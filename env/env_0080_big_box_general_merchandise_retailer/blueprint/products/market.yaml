events:
  - type: market_place
    target: market_holdings
    mutation: create
    meaning: A buyer places a Northgate Marketplace order with one seller.
    grain: One row per marketplace order (one seller per order).
    fields:
      variant_name: Seller program of the order.
      order_date: Order date.
      seller_name: Seller's storefront name.
      marketplace_order_number: Customer-facing marketplace order number.
      max_estimated_delivery_date: Last day of the delivery estimate shown at checkout, the order date plus handling and transit business days.
      payment_method_type: northgate_card or external_card.
      card_account_id: Northgate Card account charged, if any.
    triggers: []
  - type: market_ship
    target: market_holdings
    mutation: {transition: {from: placed, to: shipped}}
    meaning: The order ships with tracking.
    grain: One row per transaction.
    fields:
      shipped_date: Ship date.
      tracking_number: Carrier tracking number.
    triggers: []
  - type: market_deliver
    target: market_holdings
    mutation: {transition: {from: shipped, to: delivered}}
    meaning: The carrier confirms delivery.
    grain: One row per transaction.
    fields:
      delivered_date: Delivery date.
    triggers: []
  - type: market_cancel
    target: market_holdings
    mutation: {transition: {from: placed, to: canceled}}
    meaning: The order is canceled before shipment.
    grain: One row per transaction.
    fields:
      canceled_date: Cancellation date.
      cancel_initiator: buyer_request, seller_out_of_stock or late_shipment.
    triggers: []
  - type: market_refund_in_transit
    target: market_holdings
    mutation: {transition: {from: shipped, to: refunded}}
    meaning: A shipped order that never arrived is fully refunded.
    grain: One row per transaction.
    fields:
      refunded_date: Date the last refund made the order fully refunded.
    triggers: []
  - type: market_mark_refunded
    target: market_holdings
    mutation: {transition: {from: delivered, to: refunded}}
    meaning: A delivered order is fully refunded.
    grain: One row per transaction.
    fields:
      refunded_date: Date the last refund made the order fully refunded.
    triggers: []
  - type: market_post_line
    target: market_events
    meaning: One item line of a marketplace order is charged.
    grain: One row per order line.
    distinguish_by: [line_number]
    fields:
      event_date: Order date.
      line_number: Line position.
      sku: Marketplace item number.
      item_description: Item title as listed.
      quantity: Units bought.
      unit_price_usd: Price per unit.
      amount_usd: Line total, positive.
      item_condition: new or renewed.
    account: market_amount_paid
    direction: in
    triggers: []
  - type: market_charge_shipping
    target: market_events
    meaning: The seller's shipping charge on the order.
    grain: One row per order.
    distinguish_by: [event_date]
    fields:
      event_date: Order date.
      amount_usd: Shipping charged, 0.00 when free.
    account: market_amount_paid
    direction: in
    triggers: []
  - type: market_request_return
    target: market_events
    meaning: The buyer asks the seller to accept a return of units of one line.
    grain: One row per return request.
    distinguish_by: [original_event_id, event_date]
    fields:
      event_date: Request date.
      original_event_id: The market_post_line row.
      quantity: Units to return.
      return_reason: changed_mind, defective, damaged, wrong_item or not_as_described.
    triggers: []
  - type: market_seller_respond
    target: market_events
    meaning: The seller answers a return request.
    grain: One row per response.
    distinguish_by: [original_event_id]
    fields:
      event_date: Response date.
      original_event_id: The market_request_return row answered.
      seller_response: authorized_return, refund_without_return, partial_refund_offer or declined.
    triggers: []
  - type: market_seller_refund
    target: market_events
    meaning: The seller refunds the buyer.
    grain: One row per refund of one line or of shipping.
    distinguish_by: [original_event_id, refund_type, event_date]
    fields:
      event_date: Refund date.
      original_event_id: The market_post_line or market_charge_shipping row refunded.
      refund_type: return_refund, cancellation, partial_refund or shipping_refund.
      quantity: Units refunded, 0 for shipping or a partial refund.
      amount_usd: Amount refunded, positive, after any restocking fee.
      restocking_fee_usd: Restocking fee withheld.
      payment_method_type: Tender credited.
      card_account_id: Northgate Card account credited, if any.
    account: market_amount_paid
    direction: out
    triggers:
      - event: card:card_post_credit
        when: {payment_method_type: northgate_card}
        map: {card_account_id: card_account_id, amount_usd: amount_usd, event_date: event_date, merchant_type: northgate_marketplace}
  - type: market_contact_seller
    target: market_events
    meaning: The buyer contacts the seller about a problem with the order through the seller contact channel.
    grain: One row per contact about one problem.
    distinguish_by: [contact_reason, event_date]
    fields:
      event_date: Contact date.
      contact_reason: not_received, not_as_described, return_not_refunded, cancel_request or renewed_defect.
    triggers: []
  - type: market_open_claim
    target: market_events
    meaning: The buyer files a Northgate Marketplace Guarantee claim on the order.
    grain: One row per claim.
    distinguish_by: [claim_reason, event_date]
    fields:
      event_date: Filing date.
      claim_reason: not_received, not_as_described, return_not_refunded, seller_unresponsive or renewed_defect.
      amount_usd: Amount claimed, the price of the affected items plus their shipping, positive.
    triggers: []
  - type: market_decide_claim
    target: market_events
    meaning: Northgate decides a guarantee claim.
    grain: One row per claim decision.
    distinguish_by: [original_event_id]
    fields:
      event_date: Decision date.
      original_event_id: The market_open_claim row.
      claim_decision: granted, granted_pending_return, denied_not_covered, denied_window, denied_seller_not_contacted, denied_seller_resolved or closed_card_dispute.
    triggers:
      - event: market:market_guarantee_reimburse
        when: {claim_decision: granted}
        map: {original_event_id: original_event_id, event_date: event_date}
  - type: market_guarantee_reimburse
    target: market_events
    meaning: Northgate reimburses the buyer under the guarantee.
    grain: One row per reimbursed claim.
    distinguish_by: [original_event_id]
    fields:
      event_date: Reimbursement date.
      original_event_id: The market_open_claim row.
      amount_usd: Amount reimbursed, positive.
      payment_method_type: Tender credited.
      card_account_id: Northgate Card account credited, if any.
    account: market_amount_paid
    direction: out
    triggers:
      - event: card:card_post_credit
        when: {payment_method_type: northgate_card}
        map: {card_account_id: card_account_id, amount_usd: amount_usd, event_date: event_date, merchant_type: northgate_marketplace}

measures:
  - id: market_msr_claims_12m
    window: Rolling 12 calendar months ending on the filing date being evaluated, inclusive.
    measure: Count of market_open_claim rows on any marketplace order of the buyer with event_date in the window.
  - id: market_msr_seller_refunded
    window: The whole life of the marketplace order up to the date being evaluated.
    measure: Sum of amount_usd of market_seller_refund rows on the order, in total and per original_event_id.
  - id: market_msr_units_returned
    window: The whole life of the order line.
    measure: Sum of quantity of market_seller_refund rows with refund_type return_refund or cancellation whose original_event_id is the line.

policies:
  - id: market_agg_multi_holding
    subject: [market_place]
    rule: >-
      A buyer may have any number of marketplace orders. A checkout containing items from several sellers creates one
      marketplace order per seller, and each order has its own shipping, returns and guarantee protection; amounts on one
      order are never combined with another order's, and the guarantee maximum applies per order.
    eligibility: []
    params:
      max_per_customer: null

  - id: market_agg_claim_frequency
    subject: [market_open_claim]
    rule: >-
      Guarantee claims are counted across all of the buyer's marketplace orders. When market_msr_claims_12m has already
      reached guarantee_claims_per_12_months, a further claim is not decided in customer care but goes to specialist
      review by a human representative. Claims that were closed because of a card dispute still count.
    eligibility: []
    measures: [market_msr_claims_12m]
    params:
      per_tier:
        Northgate Marketplace Seller-Fulfilled: {guarantee_claims_per_12_months: "=guarantee_claims_per_12_months"}
        Northgate Marketplace Pro Seller: {guarantee_claims_per_12_months: "=guarantee_claims_per_12_months"}
        Northgate Marketplace Fulfilled by Northgate: {guarantee_claims_per_12_months: "=guarantee_claims_per_12_months"}
        Northgate Marketplace Freight Seller: {guarantee_claims_per_12_months: "=guarantee_claims_per_12_months"}
        Northgate Marketplace Certified Renewed: {guarantee_claims_per_12_months: "=guarantee_claims_per_12_months"}
        Northgate Marketplace International Seller: {guarantee_claims_per_12_months: "=guarantee_claims_per_12_months"}

  - id: market_shipping_and_delivery
    subject: [market_place, market_ship, market_deliver, market_charge_shipping]
    rule: >-
      The item must ship within handling_business_days business days after the order date, and the maximum estimated
      delivery date shown at checkout is the order date plus handling_business_days plus transit_business_days_max
      business days on the business_day_calendar. Shipping is charged at the seller's rate where shipping_fee_basis is
      seller_rate; where it is northgate_ship_to_home the fee follows order_evt_fees as a Ship to Home order. Every shipment
      carries carrier tracking, deliveries of signature_required_min_usd or more need a signature, and freight orders are
      delivered by appointment. Freight damage must be noted within freight_damage_report_days days of delivery to be
      treated as damaged in transit. International orders include import duties at checkout and the buyer owes nothing
      further on delivery.
      Items ship from the party in fulfilled_by, in the condition item_condition states; freight orders are delivered by appointment where freight_delivery_appointment is true, duties follow customs_duties, and tracking_required is true on every program.
    eligibility: []
    params:
      per_tier:
        Northgate Marketplace Seller-Fulfilled: {handling_business_days: "=handling_business_days", transit_business_days_max: "=transit_business_days_max", shipping_fee_basis: "=shipping_fee_basis"}
        Northgate Marketplace Pro Seller: {handling_business_days: "=handling_business_days", transit_business_days_max: "=transit_business_days_max", shipping_fee_basis: "=shipping_fee_basis"}
        Northgate Marketplace Fulfilled by Northgate: {handling_business_days: "=handling_business_days", transit_business_days_max: "=transit_business_days_max", shipping_fee_basis: "=shipping_fee_basis"}
        Northgate Marketplace Freight Seller: {handling_business_days: "=handling_business_days", transit_business_days_max: "=transit_business_days_max", shipping_fee_basis: "=shipping_fee_basis"}
        Northgate Marketplace Certified Renewed: {handling_business_days: "=handling_business_days", transit_business_days_max: "=transit_business_days_max", shipping_fee_basis: "=shipping_fee_basis"}
        Northgate Marketplace International Seller: {handling_business_days: "=handling_business_days", transit_business_days_max: "=transit_business_days_max", shipping_fee_basis: "=shipping_fee_basis"}

  - id: market_fbn_benefits
    subject: [market_post_line, market_charge_shipping]
    rule: >-
      Only Fulfilled by Northgate items share Northgate's own benefits: where membership_shipping_benefit_applies is true
      the membership delivery benefit applies to the order's shipping under membership_delivery_benefit, and where
      cardholder_discount_applies is true the Northgate Card discount applies under card_cardholder_benefits. Items from
      every other seller program pay the seller's prices and shipping with no membership benefit and no cardholder
      discount. No marketplace item earns Northgate Cash, qualifies for Northgate price adjustment or price match, or can be
      covered by a Northgate Protect plan.
      rewards_cash_earned, price_match_eligible and protection_plan_eligible are false on every program.
    eligibility: []
    params:
      per_tier:
        Northgate Marketplace Seller-Fulfilled: {membership_shipping_benefit_applies: "=membership_shipping_benefit_applies", cardholder_discount_applies: "=cardholder_discount_applies"}
        Northgate Marketplace Pro Seller: {membership_shipping_benefit_applies: "=membership_shipping_benefit_applies", cardholder_discount_applies: "=cardholder_discount_applies"}
        Northgate Marketplace Fulfilled by Northgate: {membership_shipping_benefit_applies: "=membership_shipping_benefit_applies", cardholder_discount_applies: "=cardholder_discount_applies"}
        Northgate Marketplace Freight Seller: {membership_shipping_benefit_applies: "=membership_shipping_benefit_applies", cardholder_discount_applies: "=cardholder_discount_applies"}
        Northgate Marketplace Certified Renewed: {membership_shipping_benefit_applies: "=membership_shipping_benefit_applies", cardholder_discount_applies: "=cardholder_discount_applies"}
        Northgate Marketplace International Seller: {membership_shipping_benefit_applies: "=membership_shipping_benefit_applies", cardholder_discount_applies: "=cardholder_discount_applies"}

  - id: market_cancellation
    subject: [market_cancel, market_seller_refund]
    rule: >-
      A buyer may ask to cancel only while the order is in placed status. The request is recorded in market_requests and
      passed to the seller, who must accept or decline it within seller_cancel_response_business_days business days; an
      order the seller has already shipped is no longer canceled but returned under market_returns. An order not shipped
      within late_shipment_cancel_business_days business days after its handling deadline may be canceled at the buyer's
      request without the seller's acceptance, and a seller who cannot fulfil cancels on its own. A canceled order refunds
      every line and the shipping charge in full under cancellation_refund_basis to the original payment.
      The statuses open to a cancellation request are listed in cancel_request_allowed_statuses.
    eligibility:
      - id: cancel_placed_only
        applies_to: [market_cancel]
        kind: state
        condition: A buyer may ask to cancel only while the order is in placed status.
        evidence_fields: [market_holdings.status, market_holdings.market_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_holdings.market_order_id]
          action_bindings:
            market_holdings.market_order_id: market_order_id
        state_contract:
          field: market_holdings.status
          allowed: [placed]
    params:
      per_tier:
        Northgate Marketplace Seller-Fulfilled: {seller_cancel_response_business_days: "=seller_cancel_response_business_days", late_shipment_cancel_business_days: "=late_shipment_cancel_business_days"}
        Northgate Marketplace Pro Seller: {seller_cancel_response_business_days: "=seller_cancel_response_business_days", late_shipment_cancel_business_days: "=late_shipment_cancel_business_days"}
        Northgate Marketplace Fulfilled by Northgate: {seller_cancel_response_business_days: "=seller_cancel_response_business_days", late_shipment_cancel_business_days: "=late_shipment_cancel_business_days"}
        Northgate Marketplace Freight Seller: {seller_cancel_response_business_days: "=seller_cancel_response_business_days", late_shipment_cancel_business_days: "=late_shipment_cancel_business_days"}
        Northgate Marketplace Certified Renewed: {seller_cancel_response_business_days: "=seller_cancel_response_business_days", late_shipment_cancel_business_days: "=late_shipment_cancel_business_days"}
        Northgate Marketplace International Seller: {seller_cancel_response_business_days: "=seller_cancel_response_business_days", late_shipment_cancel_business_days: "=late_shipment_cancel_business_days"}

  - id: market_returns
    subject: [market_request_return, market_seller_respond, market_seller_refund]
    rule: >-
      A return can be requested only when the request date is no later than the delivered date plus the tier's return
      window days. Calendar days are added to the delivered date, the day after delivery being day 1, and a request on the
      last day still qualifies. The units requested can never exceed the units bought less the units already refunded.
      The seller must answer within seller_return_response_business_days business days by authorizing the return, refunding
      without a return, offering a partial refund where partial_refund_without_return_allowed is true, or declining with a
      reason; a seller may decline only a changed_mind request outside the window or for an item not returnable as listed.
      Fulfilled by Northgate returns are accepted by Northgate directly, by mail or at a store where return_drop_off_at_store
      is true, and are refunded when dropped off. Return shipping is paid under changed_mind_return_shipping or
      seller_fault_return_shipping by reason. The seller must refund within seller_refund_business_days business days
      after the return is delivered, the price of the returned units less a restocking fee of at most
      seller_restocking_fee_max_pct percent on an opened changed_mind return, plus the original shipping charge where
      shipping_refund_on_seller_fault applies to the reason and never for changed_mind. Refunds go to the original payment.
      Returns go to return_destination, seller refunds use seller_refund_method, shipping_refund_on_changed_mind is false on every program, and the buyer reaches the seller through seller_contact_channel.
    eligibility:
      - id: return_window
        applies_to: [market_request_return]
        kind: time
        condition: A return can be requested only when the request date is no later than the delivered date plus the tier's return window days.
        evidence_fields: [market_holdings.delivered_date, market_holdings.market_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_holdings.market_order_id]
          action_bindings:
            market_holdings.market_order_id: market_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the delivered date
          anchor_source: market_holdings.delivered_date
          relation: not_after
          duration_source: variants.return_window_days
          unit: calendar_days
          counting_rule: Calendar days are added to the delivered date, the day after delivery being day 1, and a request on the last day still qualifies.
          boundary: inclusive
    measures: [market_msr_units_returned]
    params:
      per_tier:
        Northgate Marketplace Seller-Fulfilled: {return_window_days: "=return_window_days", seller_restocking_fee_max_pct: "=seller_restocking_fee_max_pct", seller_refund_business_days: "=seller_refund_business_days"}
        Northgate Marketplace Pro Seller: {return_window_days: "=return_window_days", seller_restocking_fee_max_pct: "=seller_restocking_fee_max_pct", seller_refund_business_days: "=seller_refund_business_days"}
        Northgate Marketplace Fulfilled by Northgate: {return_window_days: "=return_window_days", seller_restocking_fee_max_pct: "=seller_restocking_fee_max_pct", seller_refund_business_days: "=seller_refund_business_days"}
        Northgate Marketplace Freight Seller: {return_window_days: "=return_window_days", seller_restocking_fee_max_pct: "=seller_restocking_fee_max_pct", seller_refund_business_days: "=seller_refund_business_days"}
        Northgate Marketplace Certified Renewed: {return_window_days: "=return_window_days", seller_restocking_fee_max_pct: "=seller_restocking_fee_max_pct", seller_refund_business_days: "=seller_refund_business_days"}
        Northgate Marketplace International Seller: {return_window_days: "=return_window_days", seller_restocking_fee_max_pct: "=seller_restocking_fee_max_pct", seller_refund_business_days: "=seller_refund_business_days"}

  - id: market_guarantee_eligibility
    subject: [market_open_claim, market_contact_seller]
    rule: >-
      The Northgate Marketplace Guarantee covers the claim reasons in guarantee_covered_reasons and never a change of mind.
      A claim is accepted only when it is filed no later than the maximum estimated delivery date plus the tier's guarantee
      claim window days. Calendar days are added to the maximum estimated delivery date, the day after it being day 1, and
      a claim filed on the last day is on time. A not_received claim can be filed only after guarantee_not_received_wait_days
      days past the maximum estimated delivery date. Except on Fulfilled by Northgate orders, the buyer must first contact
      the seller about the same problem and give the seller guarantee_contact_seller_wait_business_days business days to
      respond; a return_not_refunded claim additionally needs a return request on record and the return delivered to the
      seller more than seller_refund_business_days business days earlier. A renewed_defect claim covers a renewed item that
      stops working within renewed_defect_window_days days of delivery; later failures go to the seller's warranty of at
      least renewed_warranty_months months. A claim is not accepted while the buyer has a card dispute on the same order.
      When the buyer opens a card dispute after filing, the claim is closed as closed_card_dispute.
      guarantee_covers_buyer_remorse is false and guarantee_excluded_with_card_dispute is true on every program, and claims are filed through claim_channels.
    eligibility:
      - id: claim_window
        applies_to: [market_open_claim]
        kind: time
        condition: A claim is accepted only when it is filed no later than the maximum estimated delivery date plus the tier's guarantee claim window days.
        evidence_fields: [market_holdings.max_estimated_delivery_date, market_holdings.market_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_holdings.market_order_id]
          action_bindings:
            market_holdings.market_order_id: market_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the maximum estimated delivery date
          anchor_source: market_holdings.max_estimated_delivery_date
          relation: not_after
          duration_source: variants.guarantee_claim_window_days
          unit: calendar_days
          counting_rule: Calendar days are added to the maximum estimated delivery date, the day after it being day 1, and a claim filed on the last day is on time.
          boundary: inclusive
      - id: no_card_dispute
        applies_to: [market_open_claim]
        kind: authorization
        condition: A claim is not accepted while the buyer has a card dispute on the same order.
        evidence_fields: [card_events.source_record_id, card_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_events.source_record_id]
          action_bindings:
            card_events.source_record_id: market_order_id
    params:
      per_tier:
        Northgate Marketplace Seller-Fulfilled: {guarantee_claim_window_days: "=guarantee_claim_window_days", guarantee_not_received_wait_days: "=guarantee_not_received_wait_days", guarantee_contact_seller_wait_business_days: "=guarantee_contact_seller_wait_business_days"}
        Northgate Marketplace Pro Seller: {guarantee_claim_window_days: "=guarantee_claim_window_days", guarantee_not_received_wait_days: "=guarantee_not_received_wait_days", guarantee_contact_seller_wait_business_days: "=guarantee_contact_seller_wait_business_days"}
        Northgate Marketplace Fulfilled by Northgate: {guarantee_claim_window_days: "=guarantee_claim_window_days", guarantee_not_received_wait_days: "=guarantee_not_received_wait_days", guarantee_contact_seller_wait_business_days: "=guarantee_contact_seller_wait_business_days"}
        Northgate Marketplace Freight Seller: {guarantee_claim_window_days: "=guarantee_claim_window_days", guarantee_not_received_wait_days: "=guarantee_not_received_wait_days", guarantee_contact_seller_wait_business_days: "=guarantee_contact_seller_wait_business_days"}
        Northgate Marketplace Certified Renewed: {guarantee_claim_window_days: "=guarantee_claim_window_days", guarantee_not_received_wait_days: "=guarantee_not_received_wait_days", guarantee_contact_seller_wait_business_days: "=guarantee_contact_seller_wait_business_days"}
        Northgate Marketplace International Seller: {guarantee_claim_window_days: "=guarantee_claim_window_days", guarantee_not_received_wait_days: "=guarantee_not_received_wait_days", guarantee_contact_seller_wait_business_days: "=guarantee_contact_seller_wait_business_days"}

  - id: market_guarantee_decision
    subject: [market_decide_claim, market_guarantee_reimburse, market_refund_in_transit, market_mark_refunded]
    rule: >-
      After a claim is filed the seller has guarantee_seller_response_business_days business days to resolve it, and
      Northgate decides within guarantee_decision_business_days business days after that deadline. A claim the seller
      resolves by refunding in full first is denied as denied_seller_resolved. A granted claim reimburses the price paid
      for the affected items plus their shipping, less everything the seller already refunded on them, capped at
      guarantee_max_per_order_usd per order across all claims on the order, rounded half up to the cent and paid to the
      original payment. Where guarantee_requires_return_for_not_as_described is true, a not_as_described claim is granted
      pending return and reimbursed only after the buyer ships the item back with tracking within
      guarantee_return_ship_by_days days of the decision; no shipment in that time closes it without reimbursement. Each
      claim is reimbursed at most once. When seller refunds and reimbursements together equal everything paid on the order,
      the order becomes refunded.
      The amount follows guarantee_reimbursement_basis, it is paid under guarantee_reimbursement_method, and it is rounded under refund_rounding.
    eligibility:
      - id: reimburse_once
        applies_to: [market_guarantee_reimburse]
        kind: dedup
        condition: Each claim is reimbursed at most once.
        evidence_fields: [market_events.original_event_id, market_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_events.original_event_id]
          action_bindings:
            market_events.original_event_id: original_event_id
        dedup_contract:
          table: market_events
          mode: separate_record
          object_bindings: {original_event_id: original_event_id}
          duplicate_filters: {event_type: [market_guarantee_reimburse]}
          distinct_fields: []
    measures: [market_msr_seller_refunded]
    params:
      per_tier:
        Northgate Marketplace Seller-Fulfilled: {guarantee_max_per_order_usd: "=guarantee_max_per_order_usd", guarantee_decision_business_days: "=guarantee_decision_business_days", guarantee_seller_response_business_days: "=guarantee_seller_response_business_days"}
        Northgate Marketplace Pro Seller: {guarantee_max_per_order_usd: "=guarantee_max_per_order_usd", guarantee_decision_business_days: "=guarantee_decision_business_days", guarantee_seller_response_business_days: "=guarantee_seller_response_business_days"}
        Northgate Marketplace Fulfilled by Northgate: {guarantee_max_per_order_usd: "=guarantee_max_per_order_usd", guarantee_decision_business_days: "=guarantee_decision_business_days", guarantee_seller_response_business_days: "=guarantee_seller_response_business_days"}
        Northgate Marketplace Freight Seller: {guarantee_max_per_order_usd: "=guarantee_max_per_order_usd", guarantee_decision_business_days: "=guarantee_decision_business_days", guarantee_seller_response_business_days: "=guarantee_seller_response_business_days"}
        Northgate Marketplace Certified Renewed: {guarantee_max_per_order_usd: "=guarantee_max_per_order_usd", guarantee_decision_business_days: "=guarantee_decision_business_days", guarantee_seller_response_business_days: "=guarantee_seller_response_business_days"}
        Northgate Marketplace International Seller: {guarantee_max_per_order_usd: "=guarantee_max_per_order_usd", guarantee_decision_business_days: "=guarantee_decision_business_days", guarantee_seller_response_business_days: "=guarantee_seller_response_business_days"}
