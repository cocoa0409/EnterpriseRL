category: order
display_name: Northgate Store and Online Orders

binding:
  holding_table: order_holdings
  event_tables: [order_events]
  intake_tables: [order_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {amount_paid_usd: order_amount_paid}

lifecycle:
  states: [placed, ready, fulfilled, canceled, returned]
  transitions:
    - {from: placed, to: ready, by: system, means: An Order Pickup or Drive Up order has been picked and is waiting at the store.}
    - {from: placed, to: fulfilled, by: system, means: The order is completed without a pickup step, by a register sale, a delivery or a shipment delivered.}
    - {from: ready, to: fulfilled, by: system, means: The customer collects a ready pickup or Drive Up order.}
    - {from: placed, to: canceled, by: user, means: The customer cancels the order before it is ready, shipped or out for delivery.}
    - {from: ready, to: canceled, by: system, means: A ready pickup or Drive Up order is not collected within the hold period and is canceled and refunded.}
    - {from: fulfilled, to: returned, by: system, means: Every unit on the order has been returned or refunded.}

accounts:
  - key: order_amount_paid
    unit: USD
    meaning: Net amount paid on the order before tax; merchandise lines and fees book in, and returns, price adjustments and other refunds book out.

parameter_schema:
  order_channels: Channels through which the fulfilment program can be ordered, list
  minimum_order_usd: Smallest merchandise subtotal accepted, USD
  standard_fee_usd: Standard fulfilment fee charged to a customer without a waiving benefit, USD (shipping, same-day
    delivery or large-item delivery)
  standard_fee_type: Fee type the standard fee is booked as
  free_standard_fee_min_order_usd: Merchandise subtotal at or above which the standard fee is waived for every customer,
    USD; not_applicable where no such threshold exists
  express_fee_usd: Fee for express (within the express window) delivery, USD; not_applicable where express is not
    offered
  express_window_hours: Hours within which an express order is delivered; 0 where express is not offered
  haul_away_fee_usd: Fee per old item hauled away at delivery, USD; not_applicable where not offered
  member_benefit_eligible: Whether membership delivery benefits can apply to the program's fees, boolean
  cardholder_shipping_benefit_eligible: Whether the Northgate Card free-shipping benefit can apply to the program's
    fee, boolean
  promised_lead: 'Promise made at checkout: ready_within_hours for pickup programs, business_days for shipping,
    same_day for delivery, scheduled_date for large items'
  pickup_hold_days: Calendar days after the ready date during which a ready order is held for collection; 0 where
    there is no pickup step
  unclaimed_refund: Refund made when a ready order is not collected within the hold period
  cancel_allowed_statuses: Order statuses in which the customer may cancel, list; empty where the sale is complete
    at the register
  cancel_cutoff_hours_before_scheduled: Hours before the scheduled delivery date before which a large-item order
    can be canceled or rescheduled without a fee; 0 where not applicable
  late_cancel_fee_usd: Fee for canceling a large-item delivery after the cutoff, USD; 0.00 where not applicable
  substitutions_allowed: Whether out-of-stock items may be substituted when the customer allows it, boolean
  substitution_price_rule: Price charged for an accepted substitute
  missing_item_report_days: Calendar days after fulfilment within which a missing or damaged-on-arrival item can
    be reported for a refund without a return
  return_window_days_by_class: Standard return window in calendar days per item return class (mapping)
  return_window_anchor: 'Date the return window is counted from: the fulfilled date, which for a register sale is
    the purchase date, for pickup the collection date and for delivery the delivery date'
  holiday_purchase_period: Month-day range of purchases (by order date) that get the holiday return start, [start
    MM-DD, end MM-DD]
  holiday_return_start: Month-day from which the return window of a holiday-period purchase is counted instead of
    its normal anchor, when later
  holiday_rule_classes: Return classes to which the holiday return start applies, list
  return_methods: Ways a return can be made, list
  mail_return_label_fee_usd: Fee for a prepaid mail return label, USD; not_applicable where mail returns are not
    offered
  restocking_fee_pct_changed_mind: Restocking fee as percent of the refunded merchandise amount when an opened item
    is returned with reason changed_mind
  restocking_fee_classes: Return classes to which the restocking fee applies, list
  fee_refund_reasons: Return reasons for which the order's fulfilment fee is refunded along with the merchandise,
    list
  receipt_lookup_methods: Proofs of purchase accepted as a receipt, list
  no_receipt_returns_allowed: Whether returns without a receipt are accepted (in store, with photo ID), boolean
  no_receipt_price_basis: Refund price for a return without a receipt
  no_receipt_refund_method: Tender for a refund without a receipt
  no_receipt_returns_per_45_days: Most returns without a receipt per customer in any rolling 45 days
  no_receipt_value_per_45_days_usd: Most refunded without a receipt per customer in any rolling 45 days, USD
  gift_receipt_refund_method: Tender for a refund on a gift receipt
  refund_tender_rule: 'How a refund with a receipt is paid: to the original payment method, Northgate Cash and gift
    card portions first back to the same tender'
  price_adjust_window_days: Calendar days after the order date within which a Northgate price drop or a competitor
    price match on the same item is refunded
  price_match_competitors: Competitors whose prices are matched, list
  price_match_exclusions: Offers never matched or adjusted to, list
  price_adjustments_per_line: Most price adjustments or matches per order line
  price_match_requires_identical_in_stock: Whether the competitor item must be identical (same brand, model, size,
    color) and in stock, boolean
  price_adjust_refund_basis: 'Refund basis of a price adjustment: (old net unit price - new unit price) x units
    still held, net of the cardholder discount where the card paid'
  large_item_reschedules_free: Number of delivery reschedules made before the cutoff that carry no fee; 0 where
    not applicable
  delivery_signature_required: Whether delivery requires an adult signature, boolean
  order_number_format: Format of the order or receipt reference shown to customers
  pickup_id_required: Whether photo ID is checked at pickup, boolean
  alcohol_allowed: Whether alcohol can be included (with age check at handover), boolean
  refund_rounding: Rounding applied to each refund line
  defective_after_window_route: Where a defect claim on an item outside its return window is sent
