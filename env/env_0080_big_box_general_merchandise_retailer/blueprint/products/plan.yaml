  - id: plan_complete_billing
    subject: [plan_charge, plan_charge_decline, plan_lapse]
    rule: >-
      Northgate Protect Complete Monthly is charged monthly_fee_usd on the enrollment date and then on the same calendar
      day of each month, falling back to the last day of a shorter month, to the payment method on the plan; a fee charged
      to a Northgate Card posts there as a purchase. When a monthly fee is declined the plan stays active but no claim is
      accepted while the fee is unpaid, since complete_claims_during_grace is false. A Complete Monthly plan lapses only
      when a declined monthly fee is still unpaid after the declined attempt date plus the tier's complete payment grace
      days. Calendar days are added to the date of the first declined attempt for that month, the day after it being day 1,
      and the plan lapses on the day after the last grace day. Paying the fee within the grace period restores claims from
      the payment date, and incidents during the unpaid days are not covered. One-time plans are charged once at purchase
      and are never charged again.
    eligibility:
      - id: lapse_after_grace
        applies_to: [plan_lapse]
        kind: time
        condition: A Complete Monthly plan lapses only when a declined monthly fee is still unpaid after the declined attempt date plus the tier's complete payment grace days.
        evidence_fields: [plan_events.event_date, plan_events.billing_period_start]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_events.billing_period_start]
          action_bindings:
            plan_events.billing_period_start: billing_period_start
        temporal_basis:
          clock: frozen_time
          anchor_event: the declined attempt date
          anchor_source: plan_events.event_date
          relation: not_before
          duration_source: variants.complete_payment_grace_days
          unit: calendar_days
          counting_rule: Calendar days are added to the date of the first declined attempt for that month, the day after it being day 1, and the plan lapses on the day after the last grace day.
          boundary: exclusive
    params:
      per_tier:
        Northgate Protect Standard 2-Year: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}
        Northgate Protect Standard 3-Year: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}
        Northgate Protect Accident 2-Year: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}
        Northgate Protect Accident 3-Year: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}
        Northgate Protect Accident 4-Year: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}
        Northgate Protect Complete Monthly: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}
