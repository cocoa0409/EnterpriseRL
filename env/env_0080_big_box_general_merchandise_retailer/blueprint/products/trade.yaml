category: trade
display_name: Northgate Business Invoice Accounts (Net Terms)

binding:
  holding_table: trade_holdings
  event_tables: [trade_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {outstanding_balance_usd: trade_receivable}

lifecycle:
  states: [applied, active, credit_hold, closed, declined]
  transitions:
    - {from: applied, to: active, by: system, means: Northgate Business credit approves the application and opens the account with a credit line and payment terms.}
    - {from: applied, to: declined, by: system, means: The application is declined.}
    - {from: active, to: credit_hold, by: system, means: New invoiced orders are stopped because an invoice is past due beyond the hold threshold or the credit line is exceeded beyond tolerance.}
    - {from: credit_hold, to: active, by: system, means: The past-due amount is paid or the balance returns within the line and invoiced ordering resumes.}
    - {from: active, to: closed, by: user, means: The business closes its invoice account; open invoices remain payable on their terms.}
    - {from: credit_hold, to: closed, by: system, means: An account past due beyond the collections threshold is closed and referred to collections.}

accounts:
  - key: trade_receivable
    unit: USD
    meaning: Amount the business owes on its invoice account; invoices, late charges and returned payments book in, and payments, credit memos, early-payment discounts, waivers and tax refunds book out.

parameter_schema:
  payment_terms_days: Calendar days after the invoice date by which an invoice is due
  terms_start_basis: Date the payment terms count from
  invoice_timing: 'When an order is invoiced: at fulfilment (pickup, delivery or shipment)'
  invoice_consolidation: How orders are grouped into invoices
  early_pay_discount_pct: Discount for paying an invoice in full early, percent of the merchandise amount
  early_pay_discount_days: Calendar days after the invoice date within which full payment earns the early-payment
    discount (0 means none)
  early_pay_discount_excludes: Invoice components never discounted for early payment, list
  credit_line_min_usd: Lowest credit line at opening, USD
  credit_line_max_usd: Highest credit line on the tier, USD
  over_line_tolerance_pct: Percent above the credit line that the balance may reach before new invoiced orders are
    held
  late_charge_pct_monthly: Late charge per month on past-due invoice balances, percent (0.0 means none)
  late_charge_min_usd: Smallest late charge assessed in a month in which any is due, USD
  late_charge_grace_days: Calendar days after the due date before an invoice counts as past due for late charges
  late_charge_basis: 'Balance the late charge is computed on: the past-due invoice principal at statement date,
    simple interest'
  late_charge_waivers_per_12_months: Late charges that may be waived as a courtesy in any rolling 12 months
  credit_hold_days_past_due: Days an invoice is past due at which new invoiced orders are held
  collections_days_past_due: Days an invoice is past due at which the account is closed and referred to collections
  returned_payment_fee_usd: Fee for a returned ACH or check payment, USD
  payment_methods: Accepted ways to pay invoices, list
  card_payment_surcharge_pct: Surcharge on invoices paid by card, percent
  payment_application_order: How a payment without remittance detail is applied
  remittance_detail_overrides: Whether invoice numbers on the remittance decide how the payment is applied, boolean
  invoice_dispute_days: Calendar days after the invoice date within which a line on it can be disputed
  disputed_amount_excluded_from_late_charge: Whether an amount under invoice dispute is excluded from late charges
    and holds, boolean
  credit_memo_on_return: Whether returns of invoiced items are credited by a credit memo against the account, boolean
  credit_balance_refund_days: Calendar days after a request within which a credit balance is refunded
  small_balance_writeoff_usd: Remaining invoice balance at or below which it is written off, USD
  po_required: Whether every invoiced order must carry a purchase order number, boolean
  authorized_buyers_max: Most authorized buyers on the account
  buyer_default_limit_usd: Default per-order limit of an authorized buyer, USD
  approval_threshold_usd: Order total above which the account administrator must approve the order, USD
  volume_discount_ladder: Discount on an invoiced order's merchandise by order subtotal, list of [min_usd, max_usd,
    pct]
  tax_exempt_supported: Whether tax-exempt purchasing is supported once a valid certificate is on file, boolean
  exemption_certificate_renewal_months: Months a tax exemption certificate stays valid on file before renewal is
    required
  tax_refund_window_days: Calendar days after an invoice date within which sales tax charged on it is refunded once
    a valid certificate covering that date is filed
  personal_guarantee_required: Whether an owner's personal guarantee is required, boolean
  financial_statements_required: Whether financial statements are required for approval and line reviews, boolean
  application_review_business_days: Business days within which an application is decided
  reapply_wait_days: Calendar days after a decline before the business may apply again
  line_review_months: Months on book, and months between reviews, before a credit line increase is considered
  line_increase_max_pct: Largest increase granted at one review, percent of the current line
  upgrade_spend_12m_usd: Invoiced spend over the last 12 months at which the account is reviewed for the next tier;
    not_applicable at the top of a ladder
  downgrade_late_invoices_12m: Invoices paid past their grace period in the last 12 months at which the account
    moves down one tier at its next review
  statement_day: Day of month on which the monthly account statement is issued and late charges are assessed
  invoice_delivery: How invoices and statements are delivered
  closure_notice_days: Calendar days of notice Northgate gives before closing an account for inactivity
  inactivity_close_months: Months without an invoice after which the account may be closed for inactivity
  early_pay_discount_on_partial: Whether a partial payment inside the discount period earns a proportional discount,
    boolean
  tax_exempt_certificate_states: 'Which states'' certificates cover purchases: the state of the store or shipping
    destination of the order'
  interest_rounding: Rounding of late charges and discounts
