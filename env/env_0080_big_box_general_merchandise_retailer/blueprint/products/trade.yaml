events:
  - type: trade_apply
    target: trade_holdings
    mutation: create
    meaning: A business applies for an invoice account with payment terms.
    grain: One row per application.
    fields:
      variant_name: Terms tier applied for.
      application_date: Date of application.
      organization_type: private_business, nonprofit, government, public_school or public_university.
    triggers: []
  - type: trade_approve
    target: trade_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: The account is approved and opened.
    grain: One row per transaction.
    fields:
      opened_date: Opening date.
      credit_line_usd: Credit line granted.
    triggers: []
  - type: trade_decline
    target: trade_holdings
    mutation: {transition: {from: applied, to: declined}}
    meaning: The application is declined.
    grain: One row per transaction.
    fields:
      declined_date: Date of decline.
    triggers: []
  - type: trade_place_hold
    target: trade_holdings
    mutation: {transition: {from: active, to: credit_hold}}
    meaning: Invoiced ordering is put on credit hold.
    grain: One row per transaction.
    fields:
      hold_date: Date of the hold.
      hold_reason: past_due or over_line.
    triggers: []
  - type: trade_release_hold
    target: trade_holdings
    mutation: {transition: {from: credit_hold, to: active}}
    meaning: The credit hold is released.
    grain: One row per transaction.
    fields:
      hold_reason: Reset to none.
    triggers: []
  - type: trade_close
    target: trade_holdings
    mutation: {transition: {from: active, to: closed}}
    meaning: The business's confirmed request to close its invoice account takes effect.
    grain: One row per transaction.
    fields:
      closed_date: Closing date.
    triggers: []
  - type: trade_close_collections
    target: trade_holdings
    mutation: {transition: {from: credit_hold, to: closed}}
    meaning: A seriously past-due account is closed and referred to collections.
    grain: One row per transaction.
    fields:
      closed_date: Closing date.
    triggers: []
  - type: trade_change_line
    target: trade_holdings
    mutation: update
    meaning: The credit line or terms tier changes after a review.
    grain: One row per change.
    fields:
      credit_line_usd: New credit line.
      variant_name: Terms tier after the review.
    triggers: []
  - type: trade_update_exemption
    target: trade_holdings
    mutation: update
    meaning: A tax exemption certificate is recorded, renewed or marked expired.
    grain: One row per certificate change.
    fields:
      tax_exempt_status: none, certificate_on_file or certificate_expired.
      exemption_certificate_date: Date the certificate on file was issued.
    triggers: []
  - type: trade_invoice
    target: trade_events
    meaning: A fulfilled Northgate order is invoiced to the account.
    grain: One row per invoice.
    distinguish_by: [invoice_number]
    fields:
      event_date: Invoice date.
      invoice_number: Invoice number.
      order_id: Northgate order invoiced; for a consolidated invoice, the last order included.
      po_number: Purchase order number the buyer gave.
      due_date: Invoice date plus payment terms.
      amount_usd: Invoice total including tax and fees, positive.
      sales_tax_usd: Sales tax included in the invoice.
    account: trade_receivable
    direction: in
    triggers: []
  - type: trade_payment
    target: trade_events
    meaning: A payment from the business is received.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      event_date: Date received.
      payment_reference: Payment reference.
      payment_method: ach, check, card, wire or p_card.
      invoice_number: Invoice named on the remittance; empty when none.
      amount_usd: Amount paid, positive.
    account: trade_receivable
    direction: out
    triggers: []
  - type: trade_return_payment
    target: trade_events
    meaning: An ACH or check payment is returned unpaid.
    grain: One row per returned payment.
    distinguish_by: [payment_reference]
    fields:
      event_date: Return date.
      payment_reference: The payment returned.
      amount_usd: Amount reversed, positive.
    account: trade_receivable
    direction: in
    triggers: []
  - type: trade_credit_memo
    target: trade_events
    meaning: A return, a resolved invoice dispute or a correction is credited against one invoice.
    grain: One row per credit memo.
    distinguish_by: [credit_memo_number]
    fields:
      event_date: Credit memo date.
      credit_memo_number: Credit memo number.
      invoice_number: Invoice credited.
      credit_reason: return, invoice_dispute or billing_correction.
      amount_usd: Amount credited, positive.
    account: trade_receivable
    direction: out
    triggers: []
  - type: trade_late_charge
    target: trade_events
    meaning: A monthly late charge is assessed on past-due invoices.
    grain: One row per statement.
    distinguish_by: [statement_date]
    fields:
      event_date: Statement date.
      statement_date: Statement on which the charge is assessed.
      amount_usd: Late charge, positive.
    account: trade_receivable
    direction: in
    triggers: []
  - type: trade_waive_charge
    target: trade_events
    meaning: A late charge or returned payment fee is waived.
    grain: One row per waived charge.
    distinguish_by: [original_event_id]
    fields:
      event_date: Waiver date.
      original_event_id: The charge waived.
      waiver_reason: courtesy or billing_error.
      amount_usd: Amount waived, positive.
    account: trade_receivable
    direction: out
    triggers: []
  - type: trade_returned_payment_fee
    target: trade_events
    meaning: A fee is charged for a returned payment.
    grain: One row per returned payment.
    distinguish_by: [payment_reference]
    fields:
      event_date: Fee date.
      payment_reference: The returned payment.
      amount_usd: Fee, positive.
    account: trade_receivable
    direction: in
    triggers: []
  - type: trade_early_pay_discount
    target: trade_events
    meaning: An early-payment discount is applied to an invoice paid in full within the discount period.
    grain: One row per invoice.
    distinguish_by: [invoice_number]
    fields:
      event_date: Date the discount was applied.
      invoice_number: Invoice discounted.
      amount_usd: Discount, positive.
    account: trade_receivable
    direction: out
    triggers: []
  - type: trade_tax_refund
    target: trade_events
    meaning: Sales tax charged on an invoice is credited after a valid exemption certificate is filed.
    grain: One row per invoice.
    distinguish_by: [invoice_number]
    fields:
      event_date: Credit date.
      invoice_number: Invoice whose tax is credited.
      amount_usd: Sales tax credited, positive.
    account: trade_receivable
    direction: out
    triggers: []

measures:
  - id: trade_msr_days_past_due
    window: From the due date of the oldest unpaid, undisputed invoice to the date being evaluated.
    measure: Calendar days elapsed; 0 when no undisputed invoice is unpaid after its due date.
  - id: trade_msr_spend_12m
    window: Rolling 12 calendar months ending on the review date, inclusive.
    measure: Sum of amount_usd of trade_invoice rows on the account in the window, less trade_credit_memo rows in the window.
  - id: trade_msr_late_invoices_12m
    window: Rolling 12 calendar months ending on the review date, inclusive.
    measure: Count of invoices on the account with a due date in the window that were not paid in full by the due date plus late_charge_grace_days.
  - id: trade_msr_waivers_12m
    window: Rolling 12 calendar months ending on the waiver date, inclusive.
    measure: Count of trade_waive_charge rows with waiver_reason courtesy on the account in the window.

policies:
  - id: trade_agg_multi_holding
    subject: [trade_apply]
    rule: >-
      A business profile may hold one Northgate Business invoice account at a time. A new application is accepted only
      when the business has no other invoice account in applied, active or credit_hold status. Changing terms tier is done
      on the existing account at a review.
    eligibility:
      - id: one_trade_account
        applies_to: [trade_apply]
        kind: dedup
        condition: A new application is accepted only when the business has no other invoice account in applied, active or credit_hold status.
        evidence_fields: [trade_holdings.customer_id, trade_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_holdings.customer_id]
          action_bindings:
            trade_holdings.customer_id: customer_id
        dedup_contract:
          table: trade_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, credit_hold]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: trade_application
    subject: [trade_apply, trade_approve, trade_decline]
    rule: >-
      Invoice accounts are only for business profiles. An application is accepted only from a customer whose profile
      customer type is business. The tier's entry gate sets the minimum time in business, the 12-month spend, the
      organization type and whether a personal guarantee or financial statements are required; Northgate Business credit
      decides within application_review_business_days business days and sets a line between credit_line_min_usd and
      credit_line_max_usd. A declined business may apply again after reapply_wait_days days.
      personal_guarantee_required and financial_statements_required state which documents the tier needs.
    eligibility:
      - id: business_only
        applies_to: [trade_apply]
        kind: authorization
        condition: An application is accepted only from a customer whose profile customer type is business.
        evidence_fields: [customers.customer_type, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      per_tier:
        Northgate Business Net 15: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", reapply_wait_days: "=reapply_wait_days"}
        Northgate Business Net 30 Standard: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", reapply_wait_days: "=reapply_wait_days"}
        Northgate Business Net 30 Preferred: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", reapply_wait_days: "=reapply_wait_days"}
        Northgate Business Net 45 Volume: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", reapply_wait_days: "=reapply_wait_days"}
        Northgate Business Net 60 Enterprise: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", reapply_wait_days: "=reapply_wait_days"}
        Northgate Business Net 30 Public Sector: {credit_line_min_usd: "=credit_line_min_usd", credit_line_max_usd: "=credit_line_max_usd", reapply_wait_days: "=reapply_wait_days"}

  - id: trade_evt_invoicing
    subject: [trade_invoice]
    rule: >-
      An order charged to the invoice account is invoiced when it is fulfilled, grouped under invoice_consolidation, and
      falls due payment_terms_days calendar days after the invoice date. Orders are invoiced only while the account is in
      active status. Where po_required is true every invoiced order carries the buyer's purchase order number. Orders above
      an authorized buyer's limit or above approval_threshold_usd need the administrator's approval before they are
      placed. The volume discount from volume_discount_ladder is applied to the order's merchandise before tax, and the
      Northgate Card discount and membership benefits never apply to invoiced orders.
      Terms count from terms_start_basis, orders are invoiced under invoice_timing and invoices are delivered under invoice_delivery. Up to authorized_buyers_max buyers may order, each limited to buyer_default_limit_usd per order unless the administrator sets otherwise.
    eligibility:
      - id: invoice_active_only
        applies_to: [trade_invoice]
        kind: state
        condition: Orders are invoiced only while the account is in active status.
        evidence_fields: [trade_holdings.status, trade_holdings.trade_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_holdings.trade_account_id]
          action_bindings:
            trade_holdings.trade_account_id: trade_account_id
        state_contract:
          field: trade_holdings.status
          allowed: [active]
    params:
      per_tier:
        Northgate Business Net 15: {payment_terms_days: "=payment_terms_days", volume_discount_ladder: "=volume_discount_ladder", approval_threshold_usd: "=approval_threshold_usd"}
        Northgate Business Net 30 Standard: {payment_terms_days: "=payment_terms_days", volume_discount_ladder: "=volume_discount_ladder", approval_threshold_usd: "=approval_threshold_usd"}
        Northgate Business Net 30 Preferred: {payment_terms_days: "=payment_terms_days", volume_discount_ladder: "=volume_discount_ladder", approval_threshold_usd: "=approval_threshold_usd"}
        Northgate Business Net 45 Volume: {payment_terms_days: "=payment_terms_days", volume_discount_ladder: "=volume_discount_ladder", approval_threshold_usd: "=approval_threshold_usd"}
        Northgate Business Net 60 Enterprise: {payment_terms_days: "=payment_terms_days", volume_discount_ladder: "=volume_discount_ladder", approval_threshold_usd: "=approval_threshold_usd"}
        Northgate Business Net 30 Public Sector: {payment_terms_days: "=payment_terms_days", volume_discount_ladder: "=volume_discount_ladder", approval_threshold_usd: "=approval_threshold_usd"}

  - id: trade_evt_early_pay_discount
    subject: [trade_early_pay_discount]
    rule: >-
      Where early_pay_discount_days is above zero, an invoice paid in full no later than the invoice date plus the tier's
      early pay discount days earns early_pay_discount_pct of its merchandise amount, excluding the components in
      early_pay_discount_excludes, rounded half up to the cent. Calendar days are added to the invoice date, the day after
      the invoice being day 1, and full payment received on the last day still earns the discount. A partial payment
      earns nothing, and each invoice earns the discount at most once.
      Where early_pay_discount_on_partial is false a partial payment earns no discount.
    eligibility:
      - id: discount_window
        applies_to: [trade_early_pay_discount]
        kind: time
        condition: Where early_pay_discount_days is above zero, an invoice paid in full no later than the invoice date plus the tier's early pay discount days earns early_pay_discount_pct of its merchandise amount, excluding the components in early_pay_discount_excludes, rounded half up to the cent.
        evidence_fields: [trade_events.event_date, trade_events.invoice_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_events.invoice_number]
          action_bindings:
            trade_events.invoice_number: invoice_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date
          anchor_source: trade_events.event_date
          relation: not_after
          duration_source: variants.early_pay_discount_days
          unit: calendar_days
          counting_rule: Calendar days are added to the invoice date, the day after the invoice being day 1, and full payment received on the last day still earns the discount.
          boundary: inclusive
    params:
      per_tier:
        Northgate Business Net 15: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days"}
        Northgate Business Net 30 Standard: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days"}
        Northgate Business Net 30 Preferred: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days"}
        Northgate Business Net 45 Volume: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days"}
        Northgate Business Net 60 Enterprise: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days"}
        Northgate Business Net 30 Public Sector: {early_pay_discount_pct: "=early_pay_discount_pct", early_pay_discount_days: "=early_pay_discount_days"}

  - id: trade_late_charges_and_holds
    subject: [trade_late_charge, trade_waive_charge, trade_place_hold, trade_release_hold, trade_close_collections]
    rule: >-
      On each statement_day, late_charge_pct_monthly percent is charged on the principal of invoices unpaid more than
      late_charge_grace_days days after their due date, as simple interest with no charge on earlier late charges, and at
      least late_charge_min_usd when any is due; amounts under invoice dispute are excluded. A tier whose late charge
      percent is 0.0 never charges one. New invoiced orders are put on credit hold when trade_msr_days_past_due reaches
      credit_hold_days_past_due, or when the balance exceeds the credit line by more than over_line_tolerance_pct, and the
      hold is released once both conditions clear. An account on hold that reaches collections_days_past_due is closed
      and referred to collections. A late charge may be waived as a courtesy only while trade_msr_waivers_12m is below
      late_charge_waivers_per_12_months; a charge made in error is always reversed as billing_error.
      Late charges follow late_charge_basis and interest_rounding, and disputed amounts are excluded where disputed_amount_excluded_from_late_charge is true.
    eligibility: []
    measures: [trade_msr_days_past_due, trade_msr_waivers_12m]
    params:
      per_tier:
        Northgate Business Net 15: {late_charge_pct_monthly: "=late_charge_pct_monthly", credit_hold_days_past_due: "=credit_hold_days_past_due", collections_days_past_due: "=collections_days_past_due"}
        Northgate Business Net 30 Standard: {late_charge_pct_monthly: "=late_charge_pct_monthly", credit_hold_days_past_due: "=credit_hold_days_past_due", collections_days_past_due: "=collections_days_past_due"}
        Northgate Business Net 30 Preferred: {late_charge_pct_monthly: "=late_charge_pct_monthly", credit_hold_days_past_due: "=credit_hold_days_past_due", collections_days_past_due: "=collections_days_past_due"}
        Northgate Business Net 45 Volume: {late_charge_pct_monthly: "=late_charge_pct_monthly", credit_hold_days_past_due: "=credit_hold_days_past_due", collections_days_past_due: "=collections_days_past_due"}
        Northgate Business Net 60 Enterprise: {late_charge_pct_monthly: "=late_charge_pct_monthly", credit_hold_days_past_due: "=credit_hold_days_past_due", collections_days_past_due: "=collections_days_past_due"}
        Northgate Business Net 30 Public Sector: {late_charge_pct_monthly: "=late_charge_pct_monthly", credit_hold_days_past_due: "=credit_hold_days_past_due", collections_days_past_due: "=collections_days_past_due"}

  - id: trade_payments
    subject: [trade_payment, trade_return_payment, trade_returned_payment_fee, trade_close]
    rule: >-
      Payments are accepted by the tier's payment_methods with no card surcharge. A payment whose remittance names
      invoices is applied to those invoices; otherwise it is applied under payment_application_order. A returned payment
      reverses its credit and carries returned_payment_fee_usd once per returned payment. A remaining invoice balance at or
      below small_balance_writeoff_usd is written off, and a credit balance is refunded within credit_balance_refund_days
      days of a request. Closing the account is the business's own decision and takes effect once confirmed; open invoices
      remain payable on their terms.
      card_payment_surcharge_pct applies to card payments, remittance detail decides application where remittance_detail_overrides is true, and Northgate may close an account with no invoice for inactivity_close_months months after closure_notice_days days' notice.
    eligibility: []
    params:
      per_tier:
        Northgate Business Net 15: {payment_methods: "=payment_methods", returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Northgate Business Net 30 Standard: {payment_methods: "=payment_methods", returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Northgate Business Net 30 Preferred: {payment_methods: "=payment_methods", returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Northgate Business Net 45 Volume: {payment_methods: "=payment_methods", returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Northgate Business Net 60 Enterprise: {payment_methods: "=payment_methods", returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Northgate Business Net 30 Public Sector: {payment_methods: "=payment_methods", returned_payment_fee_usd: "=returned_payment_fee_usd"}

  - id: trade_credit_memos_and_disputes
    subject: [trade_credit_memo]
    rule: >-
      A return of an invoiced item is credited by a credit memo against the invoice that billed it, for the merchandise
      amount the return refunds under order_returns plus the sales tax charged on it. A line on an invoice can be disputed
      only within invoice_dispute_days days of the invoice date; while disputed, its amount is excluded from late charges,
      holds and days past due, and a dispute resolved for the business is credited as invoice_dispute. Each credit memo
      refers to exactly one invoice and never exceeds that invoice's unpaid and paid total less earlier credits.
      Returns are credited this way where credit_memo_on_return is true.
    eligibility: []
    params:
      per_tier:
        Northgate Business Net 15: {invoice_dispute_days: "=invoice_dispute_days"}
        Northgate Business Net 30 Standard: {invoice_dispute_days: "=invoice_dispute_days"}
        Northgate Business Net 30 Preferred: {invoice_dispute_days: "=invoice_dispute_days"}
        Northgate Business Net 45 Volume: {invoice_dispute_days: "=invoice_dispute_days"}
        Northgate Business Net 60 Enterprise: {invoice_dispute_days: "=invoice_dispute_days"}
        Northgate Business Net 30 Public Sector: {invoice_dispute_days: "=invoice_dispute_days"}

  - id: trade_tax_exemption
    subject: [trade_update_exemption, trade_tax_refund]
    rule: >-
      Tax-exempt purchasing applies only while a certificate covering the order's ship-to or store state is on file and
      no more than exemption_certificate_renewal_months months have passed since its issue date; after that the status
      becomes certificate_expired and tax is charged until a new certificate is filed. Sales tax charged on an invoice is
      credited when a valid certificate covering the invoice date is filed no later than tax_refund_window_days days after
      that invoice date, at most once per invoice. A Northgate+ Business membership's tax-exempt checkout relies on this
      same certificate.
      This applies where tax_exempt_supported is true, with certificates covering the states named by tax_exempt_certificate_states.
    eligibility: []
    params:
      per_tier:
        Northgate Business Net 15: {exemption_certificate_renewal_months: "=exemption_certificate_renewal_months", tax_refund_window_days: "=tax_refund_window_days"}
        Northgate Business Net 30 Standard: {exemption_certificate_renewal_months: "=exemption_certificate_renewal_months", tax_refund_window_days: "=tax_refund_window_days"}
        Northgate Business Net 30 Preferred: {exemption_certificate_renewal_months: "=exemption_certificate_renewal_months", tax_refund_window_days: "=tax_refund_window_days"}
        Northgate Business Net 45 Volume: {exemption_certificate_renewal_months: "=exemption_certificate_renewal_months", tax_refund_window_days: "=tax_refund_window_days"}
        Northgate Business Net 60 Enterprise: {exemption_certificate_renewal_months: "=exemption_certificate_renewal_months", tax_refund_window_days: "=tax_refund_window_days"}
        Northgate Business Net 30 Public Sector: {exemption_certificate_renewal_months: "=exemption_certificate_renewal_months", tax_refund_window_days: "=tax_refund_window_days"}

  - id: trade_line_and_tier_review
    subject: [trade_change_line]
    rule: >-
      A credit line increase is considered after line_review_months months on book and then no more often than every
      line_review_months months, by at most line_increase_max_pct percent of the current line and never above
      credit_line_max_usd. At a review the account moves up one tier when trade_msr_spend_12m reaches upgrade_spend_12m_usd
      and the next tier's entry gate is met, and moves down one tier when trade_msr_late_invoices_12m reaches
      downgrade_late_invoices_12m; a move down takes precedence over a move up. Net 30 Public Sector accounts are never moved
      to another tier. Lines and tiers change only on an account in active status.
    eligibility:
      - id: review_active_only
        applies_to: [trade_change_line]
        kind: state
        condition: Lines and tiers change only on an account in active status.
        evidence_fields: [trade_holdings.status, trade_holdings.trade_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [trade_holdings.trade_account_id]
          action_bindings:
            trade_holdings.trade_account_id: trade_account_id
        state_contract:
          field: trade_holdings.status
          allowed: [active]
    measures: [trade_msr_spend_12m, trade_msr_late_invoices_12m]
    params:
      per_tier:
        Northgate Business Net 15: {upgrade_spend_12m_usd: "=upgrade_spend_12m_usd", downgrade_late_invoices_12m: "=downgrade_late_invoices_12m", line_review_months: "=line_review_months"}
        Northgate Business Net 30 Standard: {upgrade_spend_12m_usd: "=upgrade_spend_12m_usd", downgrade_late_invoices_12m: "=downgrade_late_invoices_12m", line_review_months: "=line_review_months"}
        Northgate Business Net 30 Preferred: {upgrade_spend_12m_usd: "=upgrade_spend_12m_usd", downgrade_late_invoices_12m: "=downgrade_late_invoices_12m", line_review_months: "=line_review_months"}
        Northgate Business Net 45 Volume: {upgrade_spend_12m_usd: "=upgrade_spend_12m_usd", downgrade_late_invoices_12m: "=downgrade_late_invoices_12m", line_review_months: "=line_review_months"}
        Northgate Business Net 60 Enterprise: {upgrade_spend_12m_usd: "=upgrade_spend_12m_usd", downgrade_late_invoices_12m: "=downgrade_late_invoices_12m", line_review_months: "=line_review_months"}
        Northgate Business Net 30 Public Sector: {upgrade_spend_12m_usd: "=upgrade_spend_12m_usd", downgrade_late_invoices_12m: "=downgrade_late_invoices_12m", line_review_months: "=line_review_months"}
