    u_ship_charge: >-
      The shipping portion added to the amount claimed for an unrefunded return depends on the seller program and on the
      shipping charged: on a Freight Seller order that was charged shipping, it is the order's shipping charge divided by
      the order's units times the requested units; on an order of any other seller program that was charged shipping, it
      is the order's shipping charge times the price paid for the requested units divided by the order's merchandise total;
      where no shipping was charged there is no shipping portion.
    u_ship: >-
      The shipping portion added to the amount claimed for an unrefunded return depends on the seller program and on the
      shipping charged: on a Freight Seller order that was charged shipping, it is the order's shipping charge divided by
      the order's units times the requested units; on an order of any other seller program that was charged shipping, it
      is the order's shipping charge times the price paid for the requested units divided by the order's merchandise total;
      where no shipping was charged there is no shipping portion.
    u_ship_refunds: >-
      The shipping refunds set off are the shipping refunds recorded on the order, shared out the way the shipping charge
      is: on a Freight Seller order with shipping refunds, the amount claimed for an unrefunded return gives up those refunds
      divided by the order's units times the requested units; on an order of any other seller program with shipping refunds,
      it gives up those refunds times the price paid for the requested units divided by the order's merchandise total; where
      no shipping refund is recorded nothing is given up.
    u_setoff: >-
      The shipping refunds set off are the shipping refunds recorded on the order, shared out the way the shipping charge
      is: on a Freight Seller order with shipping refunds, the amount claimed for an unrefunded return gives up those refunds
      divided by the order's units times the requested units; on an order of any other seller program with shipping refunds,
      it gives up those refunds times the price paid for the requested units divided by the order's merchandise total; where
      no shipping refund is recorded nothing is given up.
  factors:
  - id: u_line_pricing
    effect: method
    decides: u_merch
    bindings:
    - u_merch
    ladder:
    - when: the line is set-priced and the request gives changed_mind
      method: >-
        price paid less the set saving per unit times the units kept at the set price times the units divided by the units
        asked back for a change of mind
    - when: the line is set-priced and the reason is any other
      method: price paid (set price per unit times the units)
    - when: otherwise (the line is not set-priced)
      method: listed unit price times the units
    baseline:
      u_merch: u_units * u_unit
    evidence:
    - history
    cross_difficulty: null
  - id: u_restock_schedule
    effect: parameter
    decides: u_restock_rate
    bindings:
    - u_restock_rate
    ladder:
    - when: reason changed_mind and requested no more than early_return_days after delivery
      value: P('seller_restocking_fee_max_pct') / 2
    - when: reason changed_mind and requested later
      value: P('seller_restocking_fee_max_pct')
    - when: any other reason
      value: '0'
    baseline:
      u_restock_rate: '0'
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: u_partial_credit
    effect: parameter
    decides: u_partial
    bindings:
    - u_partials
    - u_partial
    ladder:
    - when: partial refunds on the line and units of the line kept
      value: partial refunds x units / units bought
    - when: partial refunds on the line and no unit of the line kept
      value: the whole of those partial refunds
    - when: otherwise
      value: '0'
    baseline:
      u_partial: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: u_promo_recovery
    effect: parameter
    decides: u_promo
    bindings:
    - u_promo_card
    - u_promo_kind
    - u_promo_spent
    - u_merch_refunded
    - u_merch_refunded_other
    - u_kept_before
    - u_kept_after
    - u_cov_last
    - u_order_refund_last
    - u_order_reimb_last
    - u_settles
    - u_promo
    ladder:
    - when: >-
        a qualifying promotional card earned by the order with value spent, the merchandise kept before the refund at or
        above promo_qualifying_total_usd and the merchandise kept after the refund below it
      value: >-
        the whole remaining spent value: value spent x merchandise kept before the refund / order merchandise total
    - when: >-
        a qualifying promotional card earned by the order with value spent, and the merchandise kept after the refund at
        or above promo_qualifying_total_usd
      value: value spent x price paid for the units / order merchandise total
    - when: >-
        otherwise (no such card, nothing spent, or the merchandise kept before the refund already below promo_qualifying_total_usd)
      value: '0'
    baseline:
      u_promo: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: gift
  - id: u_ship_allocation
    effect: method
    decides: u_ship
    bindings:
    - u_ship_charge
    - u_ship
    ladder:
    - when: Freight Seller order charged shipping
      method: shipping charge / order's units x units (per piece)
    - when: other seller program charged shipping
      method: shipping charge x price paid for the units / order merchandise total (value share)
    - when: no shipping charged
      method: no shipping portion
    baseline:
      u_ship: u_ship_charge
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: u_shipping_refund_setoff
    effect: method
    decides: u_setoff
    bindings:
    - u_ship_refunds
    - u_setoff
    ladder:
    - when: Freight Seller order with shipping refunds
      method: shipping refunds / order's units x units (per piece)
    - when: other seller program with shipping refunds
      method: shipping refunds x price paid for the units / order merchandise total
    - when: no shipping refund recorded
      method: nothing set off
    baseline:
      u_setoff: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      Standard method for the amount claimed for an unrefunded return: it is the merchandise value of the requested units,
      taken as the listed unit price of their line times the requested units, plus their shipping portion, taken as the
      order's whole shipping charge, less the refunds already received. The guarantee room for a new claim is the program's
      guarantee maximum per order, less every guarantee reimbursement already booked on the order, less the amounts claimed
      on the order's claims whose claim record shows no decision yet, a decision on a claim being shown on its claim record
      as well as on its decision entry. The amount claimed for an unrefunded return is limited to that guarantee room and
      never falls below zero, and only that final figure is rounded half up to the cent.
    params:
    - guarantee_max_per_order_usd
  inputs:
    history:
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_seller_refund
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_open_claim
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_redeem
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_refund_to_card
    - category: gift
      table: gift_events
      aggregate: latest
      field: gift_card_id
      filters:
        event_type: gift_load_value
    cross_category:
    - gift
- id: market_ext_return_refund_claim_reimbursement
  base_policy_refs:
  - market_guarantee_decision
  - market_returns
  overwrite:
  - base_policy: market_guarantee_decision
    superseded_clause: >-
      A granted claim reimburses the price paid for the affected items plus their shipping, less everything the seller already
      refunded on them, capped at guarantee_max_per_order_usd per order across all claims on the order, rounded half up
      to the cent and paid to the original payment.
    replaced_by: >-
      For a return-not-refunded claim within this policy's scope, and only for such a claim, the granted reimbursement is
      the return-refund reimbursement this policy fixes, paid to the external card the order was paid with; a seller-unresponsive
      claim or a not-received claim keeps the figure its own policy fixes, a claim of whose claimed units the seller has
      refunded every one is denied as seller-resolved as the base rule says, and every other granted claim, including every
      claim on an order paid with a Northgate Card, still reimburses the price paid for the affected items plus their shipping,
      less everything the seller already refunded on them, capped at the per-order maximum across all claims on the order,
      rounded half up to the cent and paid to the original payment.
  trigger: state_due
  subject:
  - market_decide_claim
  - market_guarantee_reimburse
  computes: amount_reimbursed_usd
  target_tool: grant_return_refund_claim_d58e2e3e
  params:
    early_return_days: 14
    promo_qualifying_total_usd: 1000.0
  rule: >-
    This policy fixes the return-refund reimbursement, the amount Northgate pays when it grants a return-not-refunded guarantee
    claim; the claim handled is the order's most recent return-not-refunded claim whose claim record shows no decision yet
    (where two such entries share a date, the one recorded first counts), and its claimed line, claimed units and claimed
    amount are the ones that claim records. The policy applies only where the order is of a seller program other than Fulfilled
    by Northgate, was paid with an external card and carries no more than ten lines, the claimed line carries exactly one
    return request, and the order carries exactly one return-not-refunded claim whose claim record shows no decision, and
    the seller has not refunded every claimed unit; elsewhere it fixes nothing, its figure is zero and the base rule stands:
    "A granted claim reimburses the price paid for the affected items plus their shipping, less everything the seller already
    refunded on them, capped at guarantee_max_per_order_usd per order across all claims on the order, rounded half up to
    the cent and paid to the original payment." Northgate decides such a claim once the seller's response period on it has
    run out. The return request behind that claim is the most recent return request recorded on the claimed line (where
    two such entries share a date, the one recorded first counts), with the reason and request date that request records.
    The claimed line's set price per unit is its line amount divided by the units bought on it, and the price paid for the
    claimed units is that set price per unit times the claimed units; the units of the claimed line still held are the units
    bought on it less the units asked back on it by change-of-mind return requests. The refunds already received on the
    claimed units are every unit refund entry recorded on the line, an entry that refunds no units not being a unit refund;
    they are taken from the return-refund reimbursement, and the units of the line refunded are counted the same way. The
    order's merchandise total is the sum of its line amounts and the order's units are the units bought across its lines.
    Standard method for the return-refund reimbursement: it is the merchandise value of the claimed units, taken as the
    listed unit price of their line times the claimed units, plus their shipping portion, taken as the order's whole shipping
    charge, less the refunds already received. The guarantee room for a return-not-refunded claim is the program's guarantee
    maximum per order, less every guarantee reimbursement already booked on the order, less the amounts claimed on the order's
    other claims whose claim record shows no decision yet, a decision on a claim being shown on its claim record as well
    as on its decision entry. The return-refund reimbursement is limited to that guarantee room and never falls below zero,
    and only that final figure is rounded half up to the cent. Each rule that follows adds to or takes from the return-refund
    reimbursement, as that rule itself states, before the limit to the guarantee room is applied. The merchandise value
    of the claimed units in the return-refund reimbursement depends on how the line was priced: where the line is set-priced,
    that is its line amount is below its listed unit price times the units bought, and the request gives the reason changed_mind,
    it is the price paid for the claimed units less the set saving per unit (listed unit price less set price per unit)
    times the units of the claimed line still held times the claimed units divided by the units asked back on the line for
    a change of mind; where the line is set-priced and the reason is any other, it is the price paid for the claimed units;
    on a line that is not set-priced it is the listed unit price times the claimed units. The restocking the seller may
    keep, taken from the return-refund reimbursement, is a percentage of the price paid for the claimed units following
    Northgate's changed-mind restocking schedule: where the request gives the reason changed_mind and was made no more than
    early_return_days calendar days after the order's delivered date, it is half the program's maximum restocking percentage;
    where the reason is changed_mind and the request was made later, it is the program's maximum restocking percentage;
    where the reason is any other, it is zero. The partial-refund credit taken from the return-refund reimbursement follows
    the seller's partial refunds recorded on that line: where the line carries partial refunds and the units of the claimed
    line still held are more than zero, the credit is those partial refunds times the claimed units divided by the units
    bought on the line; where the line carries partial refunds and no unit remains among the units of the claimed line still
    held, the credit is the whole of those partial refunds; otherwise there is no credit. The promotional recovery taken
    from the return-refund reimbursement follows Northgate's marketplace promotion, under which an order whose merchandise
    total reaches promo_qualifying_total_usd earns a Northgate Promotional Gift Card whose initial load names that order,
    and the value already spent from that card, that is its redemptions less any refunds credited back to it, is recovered
    from the refunds of that order's merchandise, whether by a seller refund or by a guarantee reimbursement, in proportion
    to the merchandise refunded over the order's merchandise total, except that a refund leaving the merchandise kept on
    the order below promo_qualifying_total_usd recovers the whole remaining spent value, that is the value spent less what
    the order's earlier refunds recovered under this sentence, and a refund made when the merchandise kept on the order
    was already below promo_qualifying_total_usd recovers nothing, so that no more than the value spent is ever recovered
    on the order, value not yet spent being voided on the card only under the gift card rules; the return-refund reimbursement
    counts as the refund of the claimed units, made after every other refund of the order's merchandise; the merchandise
    refunded on the order is, line by line, the line's set price per unit times the greater of the units its unit refunds
    and cancellation refunds refund and the units of its claims whose claim record shows them granted; the merchandise kept
    before the refund is the order's merchandise total less the merchandise refunded on the order other than on the claimed
    units, and the merchandise kept after the refund is that amount less the price paid for the claimed units; where the
    order earned such a card, value has been spent from it, the merchandise kept on the order, that is its merchandise total
    less the merchandise refunded on it, is already below promo_qualifying_total_usd and some of the claimed units have
    already been refunded, this policy fixes the return-refund reimbursement only if no seller refund and no guarantee reimbursement
    recorded on the order is dated after the most recent return refund on the line of the claimed units, and otherwise it
    fixes nothing, its figure is zero and the base rule quoted above stands: where the order earned such a card, value has
    been spent from it, the merchandise kept before the refund is at or above promo_qualifying_total_usd and the merchandise
    kept after the refund is below it, the recovery is the whole remaining spent value, which is the value spent times the
    merchandise kept before the refund divided by the order's merchandise total; where the order earned such a card, value
    has been spent from it and the merchandise kept after the refund is at or above promo_qualifying_total_usd, the recovery
    is the value spent times the price paid for the claimed units divided by the order's merchandise total; otherwise, including
    where the merchandise kept before the refund is already below promo_qualifying_total_usd, there is no promotional recovery.
    The shipping portion added to the return-refund reimbursement depends on the seller program and on the shipping charged:
    on a Freight Seller order that was charged shipping, it is the order's shipping charge divided by the order's units
    times the claimed units; on an order of any other seller program that was charged shipping, it is the order's shipping
    charge times the price paid for the claimed units divided by the order's merchandise total; where no shipping was charged
    there is no shipping portion. The shipping refunds set off are the shipping refunds recorded on the order, shared out
    the way the shipping charge is: on a Freight Seller order with shipping refunds, the return-refund reimbursement gives
    up those refunds divided by the order's units times the claimed units; on an order of any other seller program with
    shipping refunds, it gives up those refunds times the price paid for the claimed units divided by the order's merchandise
    total; where no shipping refund is recorded nothing is given up. Northgate decides such a claim by granting it with
    the return-refund reimbursement this policy fixes; where the return-refund reimbursement comes to zero and the guarantee
    reimbursements already booked on the order reach the program's guarantee maximum per order, Northgate decides the claim
    as not covered and books no reimbursement; where the return-refund reimbursement comes to zero otherwise, the claim
    is not decided in this conversation and is referred to a human representative. For a return-not-refunded claim within
    this policy's scope, and only for such a claim, the granted reimbursement is the return-refund reimbursement this policy
    fixes, paid to the external card the order was paid with; a seller-unresponsive claim or a not-received claim keeps
    the figure its own policy fixes, a claim of whose claimed units the seller has refunded every one is denied as seller-resolved
    as the base rule says, and every other granted claim, including every claim on an order paid with a Northgate Card,
    still reimburses the price paid for the affected items plus their shipping, less everything the seller already refunded
    on them, capped at the per-order maximum across all claims on the order, rounded half up to the cent and paid to the
    original payment.
  prerequisite: []
  cross_category:
  - category: gift
    as: history
    reads:
    - gift_events.gift_card_id
    - gift_events.amount_usd
    - variant_name
    note: the promotional-recovery factor reads the promotional card the order earned and its redemptions
  compute:
  - h_claim: >-
      LATEST('market_events', 'market_event_id', event_type='market_open_claim', claim_reason='return_not_refunded', claim_decision='not_applicable')
  - h_claimed: LATEST('market_events', 'amount_usd', market_event_id=h_claim) or 0
  - h_line: LATEST('market_events', 'original_event_id', market_event_id=h_claim)
  - h_units: LATEST('market_events', 'quantity', market_event_id=h_claim) or 0
  - h_req: >-
      LATEST('market_events', 'market_event_id', event_type='market_request_return', original_event_id=h_line)
  - h_reason: LATEST('market_events', 'return_reason', market_event_id=h_req)
  - h_req_date: LATEST('market_events', 'event_date', market_event_id=h_req)
  - h_qty: LATEST('market_events', 'quantity', market_event_id=h_line) or 1
  - h_unit: LATEST('market_events', 'unit_price_usd', market_event_id=h_line) or 0
  - h_amount: LATEST('market_events', 'amount_usd', market_event_id=h_line) or 0
  - h_paid: h_units * h_amount / h_qty
  - h_kept: >-
      h_qty - SUM('market_events', 'quantity', event_type='market_request_return', original_event_id=h_line, return_reason='changed_mind')
  - h_merch_total: SUM('market_events', 'amount_usd', event_type='market_post_line')
  - h_order_units: SUM('market_events', 'quantity', event_type='market_post_line')
  - h_unit_refunds: >-
      SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='return_refund', original_event_id=h_line)
      - SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='return_refund', original_event_id=h_line,
      quantity=0)
  - h_refunded_qty: >-
      SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='return_refund', original_event_id=h_line)
  - h_open: h_units - h_refunded_qty
  - h_line_requests: COUNT('market_events', event_type='market_request_return', original_event_id=h_line)
  - h_undecided: >-
      COUNT('market_events', event_type='market_open_claim', claim_reason='return_not_refunded', claim_decision='not_applicable')
  - h_in_scope: >-
      F('variant_name') != 'Northgate Marketplace Fulfilled by Northgate' and F('payment_method_type') == 'external_card'
      and COUNT('market_events', event_type='market_post_line') <= 10 and h_line_requests == 1 and h_undecided == 1
  - h_merch: >-
      (h_paid - ((LATEST('market_events', 'unit_price_usd', market_event_id=h_line) or 0) - h_amount / h_qty) * h_kept *
      h_units / (h_qty - h_kept)) if (h_amount < h_unit * h_qty and h_reason == 'changed_mind') else (h_paid if h_amount
      < h_unit * h_qty else h_units * h_unit)
  - h_restock_rate: >-
      P('seller_restocking_fee_max_pct') / 2 if (h_reason == 'changed_mind' and DAYS(F('delivered_date'), h_req_date) <=
      K('early_return_days')) else (P('seller_restocking_fee_max_pct') if h_reason == 'changed_mind' else 0)
  - h_restock: h_restock_rate / 100 * h_paid
  - h_partials: >-
      SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='partial_refund', original_event_id=h_line)
  - h_partial: >-
      h_partials * h_units / h_qty if (h_partials > 0 and h_kept > 0) else (h_partials if (h_partials > 0 and h_kept <=
      0) else 0)
  - h_promo_card: XLATEST('gift', 'gift_events', 'gift_card_id', event_type='gift_load_value', source_record_id=HID)
  - h_promo_kind: CFIELD('gift', 'variant_name', gift_card_id=h_promo_card)
  - h_promo_spent: >-
      XSUM('gift', 'gift_events', 'amount_usd', event_type='gift_redeem', gift_card_id=h_promo_card) - XSUM('gift', 'gift_events',
      'amount_usd', event_type='gift_refund_to_card', gift_card_id=h_promo_card)
  - h_merch_refunded: >-
      (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=1)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=1)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=1)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=1)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=1))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=2)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=2)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=2)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=2)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=2))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=3)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=3)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=3)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=3)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=3))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=4)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=4)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=4)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=4)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=4))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=5)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=5)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=5)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=5)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=5))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=6)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=6)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=6)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=6)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=6))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=7)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=7)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=7)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=7)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=7))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=8)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=8)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=8)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=8)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=8))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=9)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=9)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=9)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=9)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=9))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=10)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=10)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=10)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=10)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=10)))
  - h_merch_refunded_other: h_merch_refunded - h_amount / h_qty * (h_refunded_qty)
  - h_kept_before: h_merch_total - h_merch_refunded_other
  - h_kept_after: h_kept_before - h_paid
  - h_cov_last: >-
      LATEST('market_events', 'event_date', event_type='market_seller_refund', refund_type='return_refund', original_event_id=h_line)
  - h_order_refund_last: LATEST('market_events', 'event_date', event_type='market_seller_refund')
  - h_order_reimb_last: LATEST('market_events', 'event_date', event_type='market_guarantee_reimburse')
  - h_settles: >-
      not (h_promo_kind == 'Northgate Promotional Gift Card' and h_merch_total >= K('promo_qualifying_total_usd') and h_promo_spent
      > 0 and h_merch_total - h_merch_refunded < K('promo_qualifying_total_usd') and (h_refunded_qty) > 0) or ((h_cov_last
      or '') >= (h_order_refund_last or '') and (h_cov_last or '') >= (h_order_reimb_last or ''))
  - h_promo: >-
      h_promo_spent * h_kept_before / h_merch_total if (h_promo_kind == 'Northgate Promotional Gift Card' and h_merch_total
      >= K('promo_qualifying_total_usd') and h_promo_spent > 0 and h_kept_before >= K('promo_qualifying_total_usd') and
      h_kept_after < K('promo_qualifying_total_usd')) else (h_promo_spent * h_paid / h_merch_total if (h_promo_kind == 'Northgate
      Promotional Gift Card' and h_merch_total >= K('promo_qualifying_total_usd') and h_promo_spent > 0 and h_kept_after
      >= K('promo_qualifying_total_usd')) else 0)
  - h_ship_charge: SUM('market_events', 'amount_usd', event_type='market_charge_shipping')
  - h_ship: >-
      h_ship_charge / h_order_units * h_units if (F('variant_name') == 'Northgate Marketplace Freight Seller' and h_ship_charge
      > 0) else (h_ship_charge * h_paid / h_merch_total if (F('variant_name') != 'Northgate Marketplace Freight Seller'
      and h_ship_charge > 0) else 0)
  - h_ship_refunds: SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='shipping_refund')
  - h_setoff: >-
      h_ship_refunds / h_order_units * h_units if (F('variant_name') == 'Northgate Marketplace Freight Seller' and h_ship_refunds
      > 0) else (h_ship_refunds * h_paid / h_merch_total if (F('variant_name') != 'Northgate Marketplace Freight Seller'
      and h_ship_refunds > 0) else 0)
  - h_room: >-
      P('guarantee_max_per_order_usd') - SUM('market_events', 'amount_usd', event_type='market_guarantee_reimburse') - SUM('market_events',
