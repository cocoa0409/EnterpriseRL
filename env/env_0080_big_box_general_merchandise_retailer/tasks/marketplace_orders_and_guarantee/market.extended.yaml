      'market_event_id', event_type='market_post_line', line_number=9)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=9)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=9)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=9)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=9))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=10)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=10)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=10)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=10)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=10)))
  - r_merch_refunded_other: r_merch_refunded - r_amount / r_qty * (MN(r_line_unit_qty, r_units))
  - r_kept_before: r_merch_total - r_merch_refunded_other
  - r_kept_after: r_kept_before - r_paid
  - r_cov_last: >-
      LATEST('market_events', 'event_date', event_type='market_seller_refund', refund_type='return_refund', original_event_id=r_line)
  - r_order_refund_last: LATEST('market_events', 'event_date', event_type='market_seller_refund')
  - r_order_reimb_last: LATEST('market_events', 'event_date', event_type='market_guarantee_reimburse')
  - r_settles: >-
      not (r_promo_kind == 'Northgate Promotional Gift Card' and r_merch_total >= K('promo_qualifying_total_usd') and r_promo_spent
      > 0 and r_merch_total - r_merch_refunded < K('promo_qualifying_total_usd') and (MN(r_line_unit_qty, r_units)) > 0)
      or ((r_cov_last or '') >= (r_order_refund_last or '') and (r_cov_last or '') >= (r_order_reimb_last or ''))
  - r_promo: >-
      r_promo_spent * r_kept_before / r_merch_total if (r_promo_kind == 'Northgate Promotional Gift Card' and r_merch_total
      >= K('promo_qualifying_total_usd') and r_promo_spent > 0 and r_kept_before >= K('promo_qualifying_total_usd') and
      r_kept_after < K('promo_qualifying_total_usd')) else (r_promo_spent * r_paid / r_merch_total if (r_promo_kind == 'Northgate
      Promotional Gift Card' and r_merch_total >= K('promo_qualifying_total_usd') and r_promo_spent > 0 and r_kept_after
      >= K('promo_qualifying_total_usd')) else 0)
  - r_owed: r_merch - r_keepback - r_partial - r_promo
  - result: >-
      RND(MX(0, r_owed - r_line_refunds) + 0.000000001, 2) if (r_in_scope and r_units > 0 and r_settles) else 0
  compute_basis:
    r_req: >-
      This policy fixes the keep-it refund, the unit refund Northgate books when a seller answers a buyer's return request
      with a refund without return; the request handled is the return request most recently answered on the order with a
      refund without return (where two such entries share a date, the one recorded first counts), and the line, the requested
      units and the reason are the ones that request records. The policy applies only where the order is of a seller program
      other than Fulfilled by Northgate, was paid with an external card and carries no more than ten lines, the order carries
      exactly one return request the seller answered with a refund without return, the requested line carries exactly one
      return request, and the request names at least one unit; elsewhere it fixes nothing, its figure is zero and the base
      rule stands: "The seller must refund within seller_refund_business_days business days after the return is delivered,
      the price of the returned units less a restocking fee of at most seller_restocking_fee_max_pct percent on an opened
      changed_mind return, plus the original shipping charge where shipping_refund_on_seller_fault applies to the reason
      and never for changed_mind." A keep-it refund carries no shipping; the original shipping of a seller-fault request
      is refunded on its own shipping refund under the return rule.
