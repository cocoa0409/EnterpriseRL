  factors:
  - id: r_line_pricing
    effect: method
    decides: r_merch
    bindings:
    - r_merch
    ladder:
    - when: the line is set-priced and the request gives changed_mind
      method: >-
        price paid less the set saving per unit times the units kept at the set price times the units divided by the units
        asked back for a change of mind
    - when: the line is set-priced and the reason is any other
      method: price paid (set price per unit times the units)
    - when: otherwise (the line is not set-priced)
      method: listed unit price times the units
    baseline:
      r_merch: r_units * r_unit
    evidence:
    - history
    cross_difficulty: null
  - id: r_return_ship_keepback
    effect: method
    decides: r_keepback
    bindings:
    - r_order_units
    - r_ship_charge
    - r_keepback
    ladder:
    - when: changed_mind on a Freight Seller program where the buyer pays change-of-mind return shipping
      method: shipping charge / order's units x units (per piece)
    - when: changed_mind on another program where the buyer pays change-of-mind return shipping
      method: shipping charge x price paid for the units / order merchandise total
    - when: any other reason, or a program where the seller or Northgate pays change-of-mind return shipping
      method: no keep-back
    baseline:
      r_keepback: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: r_partial_credit
    effect: parameter
    decides: r_partial
    bindings:
    - r_partials
    - r_partial
    ladder:
    - when: partial refunds on the line and units of the line kept
      value: partial refunds x units / units bought
    - when: partial refunds on the line and no unit of the line kept
      value: the whole of those partial refunds
    - when: otherwise
      value: '0'
    baseline:
      r_partial: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: r_promo_recovery
    effect: parameter
    decides: r_promo
    bindings:
    - r_line_unit_qty
    - r_promo_card
    - r_promo_kind
    - r_promo_spent
    - r_merch_refunded
    - r_merch_refunded_other
    - r_kept_before
    - r_kept_after
    - r_cov_last
    - r_order_refund_last
    - r_order_reimb_last
    - r_settles
    - r_promo
    ladder:
    - when: >-
        a qualifying promotional card earned by the order with value spent, the merchandise kept before the refund at or
        above promo_qualifying_total_usd and the merchandise kept after the refund below it
      value: >-
        the whole remaining spent value: value spent x merchandise kept before the refund / order merchandise total
    - when: >-
        a qualifying promotional card earned by the order with value spent, and the merchandise kept after the refund at
        or above promo_qualifying_total_usd
      value: value spent x price paid for the units / order merchandise total
    - when: >-
        otherwise (no such card, nothing spent, or the merchandise kept before the refund already below promo_qualifying_total_usd)
      value: '0'
    baseline:
      r_promo: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: gift
  baseline:
    rule: >-
      Standard method for the keep-it refund: it is the listed unit price of the requested line times the requested units,
      less the return refunds already recorded on the requested line; it never falls below zero, and only that final figure
      is rounded half up to the cent.
    params: []
  inputs:
    history:
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_seller_refund
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_redeem
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_refund_to_card
    - category: gift
      table: gift_events
      aggregate: latest
      field: gift_card_id
      filters:
        event_type: gift_load_value
    cross_category:
    - gift
- id: market_ext_item_condition_claim_amount
  base_policy_refs:
  - market_agg_claim_frequency
  - market_guarantee_eligibility
  - market_guarantee_decision
  overwrite:
  - base_policy: market_guarantee_eligibility
    superseded_clause: A claim is not accepted while the buyer has a card dispute on the same order.
    replaced_by: >-
      For a not-as-described claim on an order paid with an external card, and only for such a claim, no Northgate Card
      dispute can stand on the order's charge, so the card-dispute exclusion is met by the order's own payment record; a
      return-not-refunded claim on such an order follows its own policy, and every other claim, including any claim on an
      order paid with a Northgate Card, is still not accepted while the buyer has a card dispute on the same order.
  trigger: on_request
  subject:
  - market_open_claim
  computes: amount_claimed_usd
  target_tool: file_item_condition_claim_763dfc78
  params:
    promo_qualifying_total_usd: 1000.0
  rule: >-
    This policy fixes the amount claimed for an item not as described, the amount a buyer claims when filing a not-as-described
    guarantee claim; the items claimed for are the ones in the return request most recently made on the order for the reason
    not_as_described (where two such entries share a date, the one recorded first counts), and the claim records that request's
    line and the units it names that are still unrefunded. The policy applies only where the order is of a seller program
    other than Fulfilled by Northgate, was paid with an external card and carries no more than ten lines, and the requested
    line carries exactly one return request and no not-as-described claim, and at least one requested unit is still unrefunded;
    elsewhere it fixes nothing, its figure is zero and the base rule stands: the amount claimed is as the base claim record
    defines it: "Amount claimed, the price of the affected items plus their shipping, positive." The requested line's set
    price per unit is its line amount divided by the units bought on it; the requested units still unrefunded are the units
    the request records less the units already refunded on the line, unit refund entries being counted by the units they
    refund, and the price paid for the requested units still unrefunded is that set price per unit times the requested units
    still unrefunded. The order's merchandise total is the sum of its line amounts and the order's units are the units bought
    across its lines. Standard method for the amount claimed for an item not as described: it is the merchandise value of
    the requested units still unrefunded, taken as the listed unit price of their line times the requested units still unrefunded,
    plus their shipping portion, taken as the order's whole shipping charge. The guarantee room for a new claim is the program's
    guarantee maximum per order, less every guarantee reimbursement already booked on the order, less the amounts claimed
    on the order's claims whose claim record shows no decision yet, a decision on a claim being shown on its claim record
    as well as on its decision entry. The amount claimed for an item not as described is limited to that guarantee room
    and never falls below zero, and only that final figure is rounded half up to the cent. Each rule that follows adds to
    or takes from the amount claimed for an item not as described, as that rule itself states, before the limit to the guarantee
    room is applied. The merchandise value of the requested units still unrefunded in the amount claimed for an item not
    as described depends on how the line was priced and what was already refunded on it: where the line is set-priced, that
    is its line amount is below its listed unit price times the units bought, and it carries unit refunds on fewer units
    than were bought, it is what remains of the line amount after the listed unit price of every unit already refunded on
    it, divided by the units not yet refunded, times the requested units still unrefunded; where the line is set-priced
    and carries no unit refund, or unit refunds on every unit bought, it is the price paid for the requested units still
    unrefunded; on a line that is not set-priced it is the listed unit price times the requested units still unrefunded.
    The partial-refund credit taken from the amount claimed for an item not as described follows the seller's partial refunds
    recorded on that line, the units of the requested line with the buyer being the units bought on it less the units asked
    back on it by change-of-mind return requests: where the line carries partial refunds and the units of the requested
    line with the buyer are more than zero, the credit is those partial refunds times the requested units still unrefunded
    divided by the units bought on the line; where the line carries partial refunds and no unit remains among the units
    of the requested line with the buyer, the credit is the whole of those partial refunds; otherwise there is no credit.
    The promotional recovery taken from the amount claimed for an item not as described follows Northgate's marketplace
    promotion, under which an order whose merchandise total reaches promo_qualifying_total_usd earns a Northgate Promotional
    Gift Card whose initial load names that order, and the value already spent from that card, that is its redemptions less
    any refunds credited back to it, is recovered from the refunds of that order's merchandise, whether by a seller refund
    or by a guarantee reimbursement, in proportion to the merchandise refunded over the order's merchandise total, except
    that a refund leaving the merchandise kept on the order below promo_qualifying_total_usd recovers the whole remaining
    spent value, that is the value spent less what the order's earlier refunds recovered under this sentence, and a refund
    made when the merchandise kept on the order was already below promo_qualifying_total_usd recovers nothing, so that no
    more than the value spent is ever recovered on the order, value not yet spent being voided on the card only under the
    gift card rules; the amount claimed for an item not as described counts as the refund of the requested units still unrefunded,
    made after every other refund of the order's merchandise; the merchandise refunded on the order is, line by line, the
    line's set price per unit times the greater of the units its unit refunds and cancellation refunds refund and the units
    of its claims whose claim record shows them granted; the merchandise kept before the refund is the order's merchandise
    total less the merchandise refunded on the order other than on the requested units still unrefunded, and the merchandise
    kept after the refund is that amount less the price paid for the requested units still unrefunded: where the order earned
    such a card, value has been spent from it, the merchandise kept before the refund is at or above promo_qualifying_total_usd
    and the merchandise kept after the refund is below it, the recovery is the whole remaining spent value, which is the
    value spent times the merchandise kept before the refund divided by the order's merchandise total; where the order earned
    such a card, value has been spent from it and the merchandise kept after the refund is at or above promo_qualifying_total_usd,
    the recovery is the value spent times the price paid for the requested units still unrefunded divided by the order's
    merchandise total; otherwise, including where the merchandise kept before the refund is already below promo_qualifying_total_usd,
    there is no promotional recovery. The shipping portion added to the amount claimed for an item not as described depends
    on the seller program and on the shipping charged: on a Freight Seller order that was charged shipping, it is the order's
    shipping charge divided by the order's units times the requested units still unrefunded; on an order of any other seller
    program that was charged shipping, it is the order's shipping charge times the price paid for the requested units still
    unrefunded divided by the order's merchandise total; where no shipping was charged there is no shipping portion. The
    shipping refunds set off are the shipping refunds recorded on the order, shared out the way the shipping charge is:
    on a Freight Seller order with shipping refunds, the amount claimed for an item not as described gives up those refunds
    divided by the order's units times the requested units still unrefunded; on an order of any other seller program with
    shipping refunds, it gives up those refunds times the price paid for the requested units still unrefunded divided by
    the order's merchandise total; where no shipping refund is recorded nothing is given up. For a not-as-described claim
    on an order paid with an external card, and only for such a claim, no Northgate Card dispute can stand on the order's
    charge, so the card-dispute exclusion is met by the order's own payment record; a return-not-refunded claim on such
    an order follows its own policy, and every other claim, including any claim on an order paid with a Northgate Card,
    is still not accepted while the buyer has a card dispute on the same order. Where the order carries exactly one not-received
    claim whose claim record shows no decision, the amount claimed for an item not as described is fixed only after that
    claim, if its seller response period has run out, the seller has not refunded every one of its claimed units and its
    claimed line carries no return request, carries a decision on its claim record; where that claim is referred to a human
    representative under its own policy, the filing is referred too and nothing is filed. The amount claimed for an item
    not as described is not fixed until Northgate has settled the restocking top-up on the return request most recently
    answered on the order with a return authorization. Where the amount claimed for an item not as described comes to zero
    there is nothing to claim and no claim is filed.
  prerequisite:
  - problem: market_ext_missing_item_reimbursement
    kind: value_input
    gate: q_room
    form: state
    policy_source: >-
      Where the order carries exactly one not-received claim whose claim record shows no decision, the amount claimed for
      an item not as described is fixed only after that claim, if its seller response period has run out, the seller has
      not refunded every one of its claimed units and its claimed line carries no return request, carries a decision on
      its claim record; where that claim is referred to a human representative under its own policy, the filing is referred
      too and nothing is filed.
    condition: >-
      where the order carries exactly one not_received market_open_claim with claim_decision not_applicable, that claim,
      if past its seller response period with claimed units still unrefunded and no market_request_return row on its claimed
      line, has claim_decision granted (with its market_decide_claim and market_guarantee_reimburse rows) or denied_not_covered
      (with its market_decide_claim row); a claim its policy refers to a human representative refers the filing too
    resolved_by: grant_missing_item_claim_35c21a00
    effect: >-
      the not-received claim carries a decision, so it stops reserving its claimed amount and counts only its reimbursement
      (none for a not-covered decision), and the guarantee room for the new claim changes
  - problem: market_ext_restocking_topup
    kind: state_gate
    gate: market_events.refund_type
    form: action
    policy_source: >-
      The amount claimed for an item not as described is not fixed until Northgate has settled the restocking top-up on
      the return request most recently answered on the order with a return authorization.
    fallback_reason: >-
      When the top-up figure comes to zero the settlement books nothing, so no record shows that the top-up was settled;
      only the settlement itself, not a record state, marks the wait as over.
    condition: >-
      the return request most recently answered with a return authorization either owes no top-up or carries a quantity-0
      return_refund top-up row on its line that brings the refunds on that line up to the refund owed
    resolved_by: refund_restocking_shortfall_469f1911
    effect: >-
      the seller's short refund on that request is made good on the order (or found to owe nothing) before the claim is
      filed
  cross_category:
  - category: gift
    as: history
    reads:
    - gift_events.gift_card_id
    - gift_events.amount_usd
    - variant_name
    note: the promotional-recovery factor reads the promotional card the order earned and its redemptions
  compute:
  - q_req: >-
      LATEST('market_events', 'market_event_id', event_type='market_request_return', return_reason='not_as_described')
  - q_line: LATEST('market_events', 'original_event_id', market_event_id=q_req)
  - q_recorded_units: LATEST('market_events', 'quantity', market_event_id=q_req) or 0
  - q_qty: LATEST('market_events', 'quantity', market_event_id=q_line) or 1
  - q_unit: LATEST('market_events', 'unit_price_usd', market_event_id=q_line) or 0
  - q_amount: LATEST('market_events', 'amount_usd', market_event_id=q_line) or 0
  - q_refunded: >-
      SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='return_refund', original_event_id=q_line)
  - q_units: MX(0, q_recorded_units - q_refunded)
  - q_paid: q_units * q_amount / q_qty
  - q_merch_total: SUM('market_events', 'amount_usd', event_type='market_post_line')
  - q_order_units: SUM('market_events', 'quantity', event_type='market_post_line')
  - q_line_requests: COUNT('market_events', event_type='market_request_return', original_event_id=q_line)
  - q_line_claims: >-
      COUNT('market_events', event_type='market_open_claim', claim_reason='not_as_described', original_event_id=q_line)
  - q_in_scope: >-
      F('variant_name') != 'Northgate Marketplace Fulfilled by Northgate' and F('payment_method_type') == 'external_card'
      and COUNT('market_events', event_type='market_post_line') <= 10 and q_line_requests == 1 and q_line_claims == 0
  - q_merch: >-
      (q_amount - q_unit * q_refunded) / (q_qty - q_refunded) * q_units if (q_amount < q_unit * q_qty and q_refunded > 0
      and q_refunded < q_qty) else (q_paid if q_amount < q_unit * q_qty else q_units * (LATEST('market_events', 'unit_price_usd',
      market_event_id=q_line) or 0))
  - q_kept: >-
      q_qty - SUM('market_events', 'quantity', event_type='market_request_return', original_event_id=q_line, return_reason='changed_mind')
  - q_partials: >-
      SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='partial_refund', original_event_id=q_line)
  - q_partial: >-
      q_partials * q_units / q_qty if (q_partials > 0 and q_kept > 0) else (q_partials if (q_partials > 0 and q_kept <=
      0) else 0)
  - q_promo_card: XLATEST('gift', 'gift_events', 'gift_card_id', event_type='gift_load_value', source_record_id=HID)
  - q_promo_kind: CFIELD('gift', 'variant_name', gift_card_id=q_promo_card)
  - q_promo_spent: >-
      XSUM('gift', 'gift_events', 'amount_usd', event_type='gift_redeem', gift_card_id=q_promo_card) - XSUM('gift', 'gift_events',
      'amount_usd', event_type='gift_refund_to_card', gift_card_id=q_promo_card)
  - q_merch_refunded: >-
      (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=1)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=1)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=1)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=1)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=1))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=2)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=2)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=2)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=2)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=2))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=3)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=3)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=3)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=3)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=3))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=4)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=4)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=4)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=4)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=4))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=5)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=5)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=5)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=5)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=5))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=6)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=6)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=6)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=6)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=6))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=7)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=7)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=7)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=7)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=7))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=8)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=8)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=8)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=8)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=8))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=9)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=9)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=9)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=9)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=9))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=10)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=10)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=10)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=10)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=10)))
  - q_merch_refunded_other: q_merch_refunded - q_amount / q_qty * (0)
  - q_kept_before: q_merch_total - q_merch_refunded_other
  - q_kept_after: q_kept_before - q_paid
  - q_promo: >-
      q_promo_spent * q_kept_before / q_merch_total if (q_promo_kind == 'Northgate Promotional Gift Card' and q_merch_total
      >= K('promo_qualifying_total_usd') and q_promo_spent > 0 and q_kept_before >= K('promo_qualifying_total_usd') and
      q_kept_after < K('promo_qualifying_total_usd')) else (q_promo_spent * q_paid / q_merch_total if (q_promo_kind == 'Northgate
      Promotional Gift Card' and q_merch_total >= K('promo_qualifying_total_usd') and q_promo_spent > 0 and q_kept_after
      >= K('promo_qualifying_total_usd')) else 0)
  - q_ship_charge: SUM('market_events', 'amount_usd', event_type='market_charge_shipping')
  - q_ship: >-
      q_ship_charge / q_order_units * q_units if (F('variant_name') == 'Northgate Marketplace Freight Seller' and q_ship_charge
      > 0) else (q_ship_charge * q_paid / q_merch_total if (F('variant_name') != 'Northgate Marketplace Freight Seller'
      and q_ship_charge > 0) else 0)
  - q_ship_refunds: SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='shipping_refund')
  - q_setoff: >-
      q_ship_refunds / q_order_units * q_units if (F('variant_name') == 'Northgate Marketplace Freight Seller' and q_ship_refunds
      > 0) else (q_ship_refunds * q_paid / q_merch_total if (F('variant_name') != 'Northgate Marketplace Freight Seller'
      and q_ship_refunds > 0) else 0)
  - q_room: >-
      P('guarantee_max_per_order_usd') - SUM('market_events', 'amount_usd', event_type='market_guarantee_reimburse') - SUM('market_events',
