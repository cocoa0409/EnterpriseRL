  factors:
  - id: n_line_pricing
    effect: method
    decides: n_merch
    bindings:
    - n_merch
    ladder:
    - when: the line is set-priced and carries unit refunds on fewer units than were bought
      method: >-
        what remains of the line amount after the listed price of the refunded units, per unit not yet refunded, times the
        units
    - when: the line is set-priced and carries no unit refund, or unit refunds on every unit bought
      method: price paid (set price per unit times the units)
    - when: otherwise (the line is not set-priced)
      method: listed unit price times the units
    baseline:
      n_merch: n_units * n_unit
    evidence:
    - history
    cross_difficulty: null
  - id: n_partial_credit
    effect: parameter
    decides: n_partial
    bindings:
    - n_kept
    - n_partials
    - n_partial
    ladder:
    - when: partial refunds on the line and units of the line kept
      value: partial refunds x units / units bought
    - when: partial refunds on the line and no unit of the line kept
      value: the whole of those partial refunds
    - when: otherwise
      value: '0'
    baseline:
      n_partial: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: n_promo_recovery
    effect: parameter
    decides: n_promo
    bindings:
    - n_promo_card
    - n_promo_kind
    - n_promo_spent
    - n_merch_refunded
    - n_merch_refunded_other
    - n_kept_before
    - n_kept_after
    - n_promo
    ladder:
    - when: >-
        a qualifying promotional card earned by the order with value spent, the merchandise kept before the refund at or
        above promo_qualifying_total_usd and the merchandise kept after the refund below it
      value: >-
        the whole remaining spent value: value spent x merchandise kept before the refund / order merchandise total
    - when: >-
        a qualifying promotional card earned by the order with value spent, and the merchandise kept after the refund at
        or above promo_qualifying_total_usd
      value: value spent x price paid for the units / order merchandise total
    - when: >-
        otherwise (no such card, nothing spent, or the merchandise kept before the refund already below promo_qualifying_total_usd)
      value: '0'
    baseline:
      n_promo: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: gift
  - id: n_ship_allocation
    effect: method
    decides: n_ship
    bindings:
    - n_ship_charge
    - n_ship
    ladder:
    - when: Freight Seller order charged shipping
      method: shipping charge / order's units x units (per piece)
    - when: other seller program charged shipping
      method: shipping charge x price paid for the units / order merchandise total (value share)
    - when: no shipping charged
      method: no shipping portion
    baseline:
      n_ship: n_ship_charge
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: n_shipping_refund_setoff
    effect: method
    decides: n_setoff
    bindings:
    - n_ship_refunds
    - n_setoff
    ladder:
    - when: Freight Seller order with shipping refunds
      method: shipping refunds / order's units x units (per piece)
    - when: other seller program with shipping refunds
      method: shipping refunds x price paid for the units / order merchandise total
    - when: no shipping refund recorded
      method: nothing set off
    baseline:
      n_setoff: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      Standard method for the missing-item reimbursement: it is the merchandise value of the missing units still unrefunded,
      taken as the listed unit price of their line times the missing units still unrefunded, plus their shipping portion,
      taken as the order's whole shipping charge. The guarantee room for a not-received claim is the program's guarantee
      maximum per order, less every guarantee reimbursement already booked on the order, less the amounts claimed on the
      order's other claims whose claim record shows no decision yet, a decision on a claim being shown on its claim record
      as well as on its decision entry. The missing-item reimbursement is limited to that guarantee room and never falls
      below zero, and only that final figure is rounded half up to the cent.
    params:
    - guarantee_max_per_order_usd
  inputs:
    history:
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_seller_refund
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_open_claim
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_redeem
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_refund_to_card
    - category: gift
      table: gift_events
      aggregate: latest
      field: gift_card_id
      filters:
        event_type: gift_load_value
    cross_category:
    - gift
- id: market_ext_restocking_topup
  base_policy_refs:
  - market_cancellation
  - market_returns
  overwrite:
  - base_policy: market_returns
    superseded_clause: >-
      The seller must refund within seller_refund_business_days business days after the return is delivered, the price of
      the returned units less a restocking fee of at most seller_restocking_fee_max_pct percent on an opened changed_mind
      return, plus the original shipping charge where shipping_refund_on_seller_fault applies to the reason and never for
      changed_mind.
    replaced_by: >-
      For a restocking top-up within this policy's scope, and only for such a refund, the refund owed for the returned units
      this policy fixes takes the place of the return rule's price of the returned units less a restocking fee of at most
      the program's maximum on an opened changed_mind return; a keep-it refund on such an order follows its own policy;
      and every other seller refund, including every refund on an order paid with a Northgate Card, still follows the return
      rule: the seller must refund within seller_refund_business_days business days after the return is delivered the price
      of the returned units less a restocking fee of at most the program's maximum percentage on an opened changed_mind
      return, plus the original shipping charge where the reason is a seller fault and never for changed_mind.
  trigger: state_due
  subject:
  - market_seller_refund
  computes: amount_refunded_usd
  target_tool: refund_restocking_shortfall_469f1911
  params:
    early_return_days: 14
    promo_qualifying_total_usd: 1000.0
  rule: >-
    This policy fixes the restocking top-up, the refund Northgate books when a seller has refunded every unit of a returned
    request but withheld more restocking than Northgate's schedule allows for the request's reason; the return handled is
    the return request most recently answered on the order with a return authorization (where two such entries share a date,
    the one recorded first counts), and the line, the returned units, the reason and the request date are the ones that
    request records. The refunds on the returned line are every refund entry recorded there as a return refund, top-ups
    already booked included; the seller's unit refunds among them are the entries that refund units, with the units they
    refund. The returned line's set price per unit is its line amount divided by the units bought on it, and the price paid
    for the returned units is that set price per unit times the returned units; the units of the returned line kept at the
    set price are the units bought on it less the units asked back on it by change-of-mind return requests. Standard method
    for the restocking top-up: the refund owed for the returned units is the listed unit price of their line times the returned
    units, and the restocking top-up is that refund owed less the refunds on the returned line; it never falls below zero,
    and only that final figure is rounded half up to the cent. A top-up is owed only where the order is of a seller program
    other than Fulfilled by Northgate and was paid with an external card and carries no more than ten lines, the order carries
    a single return authorization, the returned line carries exactly one return request, the seller's unit refunds on the
    returned line cover every returned unit; it is then the refund owed less the refunds on the returned line, and otherwise,
    or wherever that comes to zero, the top-up is settled with nothing booked and the base rule stands: "The seller must
    refund within seller_refund_business_days business days after the return is delivered, the price of the returned units
    less a restocking fee of at most seller_restocking_fee_max_pct percent on an opened changed_mind return, plus the original
    shipping charge where shipping_refund_on_seller_fault applies to the reason and never for changed_mind." Each rule that
    follows sets the merchandise value or takes an amount from the refund owed for the returned units, as that rule itself
    states, before the refunds on the line are subtracted. The merchandise value of the returned units in the refund owed
    for the returned units depends on how the line was priced: where the line is set-priced, that is its line amount is
    below its listed unit price times the units bought, and the request gives the reason changed_mind, it is the price paid
    for the returned units less the set saving per unit (listed unit price less set price per unit) times the units of the
    returned line kept at the set price times the returned units divided by the units asked back on the line for a change
    of mind; where the line is set-priced and the reason is any other, it is the price paid for the returned units; on a
    line that is not set-priced it is the listed unit price times the returned units. The restocking the schedule allows,
    taken from the refund owed for the returned units, is a percentage of the price paid for the returned units following
    Northgate's changed-mind restocking schedule: where the request gives the reason changed_mind and was made no more than
    early_return_days calendar days after the order's delivered date, it is half the program's maximum restocking percentage;
    where the reason is changed_mind and the request was made later, it is the program's maximum restocking percentage;
    where the reason is any other, it is zero; the restocking the seller withheld is the restocking fees recorded on the
    return refund entries on the returned line, and a top-up is owed only where that restocking is above that percentage
    of the price paid for the returned units, and otherwise the top-up is settled with nothing booked. The partial-refund
    credit taken from the refund owed for the returned units follows the seller's partial refunds recorded on that line:
    where the line carries partial refunds and the units of the returned line kept at the set price are more than zero,
    the credit is those partial refunds times the returned units divided by the units bought on the line; where the line
    carries partial refunds and no unit remains among the units of the returned line kept at the set price, the credit is
    the whole of those partial refunds; otherwise there is no credit. The promotional recovery taken from the refund owed
    for the returned units follows Northgate's marketplace promotion, under which an order whose merchandise total reaches
    promo_qualifying_total_usd earns a Northgate Promotional Gift Card whose initial load names that order, and the value
    already spent from that card, that is its redemptions less any refunds credited back to it, is recovered from the refunds
    of that order's merchandise, whether by a seller refund or by a guarantee reimbursement, in proportion to the merchandise
    refunded over the order's merchandise total, except that a refund leaving the merchandise kept on the order below promo_qualifying_total_usd
    recovers the whole remaining spent value, that is the value spent less what the order's earlier refunds recovered under
    this sentence, and a refund made when the merchandise kept on the order was already below promo_qualifying_total_usd
    recovers nothing, so that no more than the value spent is ever recovered on the order, value not yet spent being voided
    on the card only under the gift card rules, the order's merchandise total being the sum of its line amounts; the refund
    owed for the returned units counts as the refund of the returned units, made after every other refund of the order's
    merchandise; the merchandise refunded on the order is, line by line, the line's set price per unit times the greater
    of the units its unit refunds and cancellation refunds refund and the units of its claims whose claim record shows them
    granted; the merchandise kept before the refund is the order's merchandise total less the merchandise refunded on the
    order other than on the returned units, and the merchandise kept after the refund is that amount less the price paid
    for the returned units; where the order earned such a card, value has been spent from it, the merchandise kept on the
    order, that is its merchandise total less the merchandise refunded on it, is already below promo_qualifying_total_usd
    and some of the returned units have already been refunded, this policy fixes the refund owed for the returned units
    only if no seller refund and no guarantee reimbursement recorded on the order is dated after the most recent return
    refund on the line of the returned units, and otherwise it fixes nothing, its figure is zero and the base rule quoted
    above stands: where the order earned such a card, value has been spent from it, the merchandise kept before the refund
    is at or above promo_qualifying_total_usd and the merchandise kept after the refund is below it, the recovery is the
    whole remaining spent value, which is the value spent times the merchandise kept before the refund divided by the order's
    merchandise total; where the order earned such a card, value has been spent from it and the merchandise kept after the
    refund is at or above promo_qualifying_total_usd, the recovery is the value spent times the price paid for the returned
    units divided by the order's merchandise total; otherwise, including where the merchandise kept before the refund is
    already below promo_qualifying_total_usd, there is no promotional recovery. For a restocking top-up within this policy's
    scope, and only for such a refund, the refund owed for the returned units this policy fixes takes the place of the return
    rule's price of the returned units less a restocking fee of at most the program's maximum on an opened changed_mind
    return; a keep-it refund on such an order follows its own policy; and every other seller refund, including every refund
    on an order paid with a Northgate Card, still follows the return rule: the seller must refund within seller_refund_business_days
    business days after the return is delivered the price of the returned units less a restocking fee of at most the program's
    maximum percentage on an opened changed_mind return, plus the original shipping charge where the reason is a seller
    fault and never for changed_mind.
  prerequisite: []
  cross_category:
  - category: gift
    as: history
    reads:
    - gift_events.gift_card_id
    - gift_events.amount_usd
    - variant_name
    note: the promotional-recovery factor reads the promotional card the order earned and its redemptions
  compute:
  - s_req: >-
      LATEST('market_events', 'original_event_id', event_type='market_seller_respond', seller_response='authorized_return')
  - s_line: LATEST('market_events', 'original_event_id', market_event_id=s_req)
  - s_units: LATEST('market_events', 'quantity', market_event_id=s_req) or 0
  - s_reason: LATEST('market_events', 'return_reason', market_event_id=s_req)
  - s_req_date: LATEST('market_events', 'event_date', market_event_id=s_req)
  - s_paid_back: >-
      SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='return_refund', original_event_id=s_line)
  - s_seller_units: >-
      SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='return_refund', original_event_id=s_line)
  - s_line_requests: COUNT('market_events', event_type='market_request_return', original_event_id=s_line)
  - s_authorizations: COUNT('market_events', event_type='market_seller_respond', seller_response='authorized_return')
  - s_qty: LATEST('market_events', 'quantity', market_event_id=s_line) or 1
  - s_unit: LATEST('market_events', 'unit_price_usd', market_event_id=s_line) or 0
  - s_amount: LATEST('market_events', 'amount_usd', market_event_id=s_line) or 0
  - s_paid: s_units * s_amount / s_qty
  - s_kept: >-
      s_qty - SUM('market_events', 'quantity', event_type='market_request_return', original_event_id=s_line, return_reason='changed_mind')
  - s_merch: >-
      (s_paid - ((LATEST('market_events', 'unit_price_usd', market_event_id=s_line) or 0) - s_amount / s_qty) * s_kept *
      s_units / (s_qty - s_kept)) if (s_amount < s_unit * s_qty and s_reason == 'changed_mind') else (s_paid if s_amount
      < s_unit * s_qty else s_units * s_unit)
  - s_restock_rate: >-
      P('seller_restocking_fee_max_pct') / 2 if (s_reason == 'changed_mind' and DAYS(F('delivered_date'), s_req_date) <=
      K('early_return_days')) else (P('seller_restocking_fee_max_pct') if s_reason == 'changed_mind' else 0)
  - s_restock: s_restock_rate / 100 * s_paid
  - s_withheld: >-
      SUM('market_events', 'restocking_fee_usd', event_type='market_seller_refund', refund_type='return_refund', original_event_id=s_line)
  - s_over_allowance: s_withheld > s_restock_rate / 100 * s_paid
  - s_partials: >-
      SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='partial_refund', original_event_id=s_line)
  - s_partial: >-
      s_partials * s_units / s_qty if (s_partials > 0 and s_kept > 0) else (s_partials if (s_partials > 0 and s_kept <=
      0) else 0)
  - s_merch_total: SUM('market_events', 'amount_usd', event_type='market_post_line')
  - s_promo_card: XLATEST('gift', 'gift_events', 'gift_card_id', event_type='gift_load_value', source_record_id=HID)
  - s_promo_kind: CFIELD('gift', 'variant_name', gift_card_id=s_promo_card)
  - s_promo_spent: >-
      XSUM('gift', 'gift_events', 'amount_usd', event_type='gift_redeem', gift_card_id=s_promo_card) - XSUM('gift', 'gift_events',
