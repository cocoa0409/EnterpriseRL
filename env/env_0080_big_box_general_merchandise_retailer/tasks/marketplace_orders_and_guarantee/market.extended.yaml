    g_merch_total: >-
      The order's merchandise total is the sum of its line amounts and the order's units are the units bought across its
      lines.
    g_order_units: >-
      The order's merchandise total is the sum of its line amounts and the order's units are the units bought across its
      lines.
    g_room: >-
      The guarantee room for a seller-unresponsive claim is the program's guarantee maximum per order, less every guarantee
      reimbursement already booked on the order, less the amounts claimed on the order's other claims whose claim record
      shows no decision yet, a decision on a claim being shown on its claim record as well as on its decision entry.
    g_owed: >-
      Each rule that follows adds to or takes from the unresponsive-seller reimbursement, as that rule itself states, before
      the limit to the guarantee room is applied.
    result: >-
      The unresponsive-seller reimbursement is limited to that guarantee room and never falls below zero, and only that
      final figure is rounded half up to the cent.
    g_merch: >-
      The merchandise value of the claimed units still unrefunded in the unresponsive-seller reimbursement depends on how
      the line was priced and what was already refunded on it: where the line is set-priced, that is its line amount is
      below its listed unit price times the units bought, and it carries unit refunds on fewer units than were bought, it
      is what remains of the line amount after the listed unit price of every unit already refunded on it, divided by the
      units not yet refunded, times the claimed units still unrefunded; where the line is set-priced and carries no unit
      refund, or unit refunds on every unit bought, it is the price paid for the claimed units still unrefunded; on a line
      that is not set-priced it is the listed unit price times the claimed units still unrefunded.
    g_kept: >-
      The partial-refund credit taken from the unresponsive-seller reimbursement follows the seller's partial refunds recorded
      on that line, the units of the claimed line with the buyer being the units bought on it less the units asked back
      on it by change-of-mind return requests: where the line carries partial refunds and the units of the claimed line
      with the buyer are more than zero, the credit is those partial refunds times the claimed units still unrefunded divided
      by the units bought on the line; where the line carries partial refunds and no unit remains among the units of the
      claimed line with the buyer, the credit is the whole of those partial refunds; otherwise there is no credit.
    g_partials: >-
      The partial-refund credit taken from the unresponsive-seller reimbursement follows the seller's partial refunds recorded
