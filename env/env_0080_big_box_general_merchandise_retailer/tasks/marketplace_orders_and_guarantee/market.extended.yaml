  - n_merch_refunded_other: n_merch_refunded - n_amount / n_qty * (0)
  - n_kept_before: n_merch_total - n_merch_refunded_other
  - n_kept_after: n_kept_before - n_paid
  - n_promo: >-
      n_promo_spent * n_kept_before / n_merch_total if (n_promo_kind == 'Northgate Promotional Gift Card' and n_merch_total
      >= K('promo_qualifying_total_usd') and n_promo_spent > 0 and n_kept_before >= K('promo_qualifying_total_usd') and
      n_kept_after < K('promo_qualifying_total_usd')) else (n_promo_spent * n_paid / n_merch_total if (n_promo_kind == 'Northgate
      Promotional Gift Card' and n_merch_total >= K('promo_qualifying_total_usd') and n_promo_spent > 0 and n_kept_after
      >= K('promo_qualifying_total_usd')) else 0)
  - n_ship_charge: SUM('market_events', 'amount_usd', event_type='market_charge_shipping')
  - n_ship: >-
      n_ship_charge / n_order_units * n_units if (F('variant_name') == 'Northgate Marketplace Freight Seller' and n_ship_charge
      > 0) else (n_ship_charge * n_paid / n_merch_total if (F('variant_name') != 'Northgate Marketplace Freight Seller'
      and n_ship_charge > 0) else 0)
  - n_ship_refunds: SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='shipping_refund')
  - n_setoff: >-
      n_ship_refunds / n_order_units * n_units if (F('variant_name') == 'Northgate Marketplace Freight Seller' and n_ship_refunds
      > 0) else (n_ship_refunds * n_paid / n_merch_total if (F('variant_name') != 'Northgate Marketplace Freight Seller'
      and n_ship_refunds > 0) else 0)
  - n_room: >-
      P('guarantee_max_per_order_usd') - SUM('market_events', 'amount_usd', event_type='market_guarantee_reimburse') - SUM('market_events',
      'amount_usd', event_type='market_open_claim', claim_decision='not_applicable') + n_claimed
  - n_owed: n_merch - n_partial - n_promo + n_ship - n_setoff
  - result: RND(MX(0, MN(n_owed, n_room)) + 0.000000001, 2) if (n_in_scope and n_units > 0) else 0
  compute_basis:
    n_claim: >-
      This policy fixes the missing-item reimbursement, the amount Northgate pays when it grants a not-received guarantee
      claim; the claim handled is the order's most recent not-received claim whose claim record shows no decision yet (where
      two such entries share a date, the one recorded first counts), and its claimed line, the units it records and its
      claimed amount are the ones that claim records. The policy applies only where the order is of a seller program other
      than Fulfilled by Northgate, was paid with an external card and carries no more than ten lines, the claimed line carries
      no return request, and the order carries exactly one not-received claim whose claim record shows no decision, and
      at least one claimed unit is still unrefunded; elsewhere it fixes nothing, its figure is zero and the base rule stands:
      "A granted claim reimburses the price paid for the affected items plus their shipping, less everything the seller
      already refunded on them, capped at guarantee_max_per_order_usd per order across all claims on the order, rounded
      half up to the cent and paid to the original payment." Northgate decides such a claim once the seller's response period
      on it has run out.
