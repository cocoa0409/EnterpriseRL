    h_req: >-
      The return request behind that claim is the most recent return request recorded on the claimed line (where two such
      entries share a date, the one recorded first counts), with the reason and request date that request records.
    h_reason: >-
      The return request behind that claim is the most recent return request recorded on the claimed line (where two such
      entries share a date, the one recorded first counts), with the reason and request date that request records.
    h_req_date: >-
      The return request behind that claim is the most recent return request recorded on the claimed line (where two such
      entries share a date, the one recorded first counts), with the reason and request date that request records.
    h_qty: >-
      The claimed line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the claimed units is that set price per unit times the claimed units; the units of the claimed line still held are
      the units bought on it less the units asked back on it by change-of-mind return requests.
    h_unit: >-
      The claimed line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the claimed units is that set price per unit times the claimed units; the units of the claimed line still held are
      the units bought on it less the units asked back on it by change-of-mind return requests.
