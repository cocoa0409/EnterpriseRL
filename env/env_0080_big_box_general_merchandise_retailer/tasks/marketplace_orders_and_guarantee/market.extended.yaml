    h_ship_charge: >-
      The shipping portion added to the return-refund reimbursement depends on the seller program and on the shipping charged:
      on a Freight Seller order that was charged shipping, it is the order's shipping charge divided by the order's units
      times the claimed units; on an order of any other seller program that was charged shipping, it is the order's shipping
      charge times the price paid for the claimed units divided by the order's merchandise total; where no shipping was
      charged there is no shipping portion.
    h_ship: >-
      The shipping portion added to the return-refund reimbursement depends on the seller program and on the shipping charged:
      on a Freight Seller order that was charged shipping, it is the order's shipping charge divided by the order's units
      times the claimed units; on an order of any other seller program that was charged shipping, it is the order's shipping
      charge times the price paid for the claimed units divided by the order's merchandise total; where no shipping was
      charged there is no shipping portion.
    h_ship_refunds: >-
      The shipping refunds set off are the shipping refunds recorded on the order, shared out the way the shipping charge
      is: on a Freight Seller order with shipping refunds, the return-refund reimbursement gives up those refunds divided
      by the order's units times the claimed units; on an order of any other seller program with shipping refunds, it gives
      up those refunds times the price paid for the claimed units divided by the order's merchandise total; where no shipping
      refund is recorded nothing is given up.
    h_setoff: >-
      The shipping refunds set off are the shipping refunds recorded on the order, shared out the way the shipping charge
      is: on a Freight Seller order with shipping refunds, the return-refund reimbursement gives up those refunds divided
      by the order's units times the claimed units; on an order of any other seller program with shipping refunds, it gives
      up those refunds times the price paid for the claimed units divided by the order's merchandise total; where no shipping
      refund is recorded nothing is given up.
  factors:
  - id: h_line_pricing
    effect: method
    decides: h_merch
    bindings:
    - h_merch
    ladder:
    - when: the line is set-priced and the request gives changed_mind
      method: >-
        price paid less the set saving per unit times the units kept at the set price times the units divided by the units
        asked back for a change of mind
    - when: the line is set-priced and the reason is any other
      method: price paid (set price per unit times the units)
    - when: otherwise (the line is not set-priced)
      method: listed unit price times the units
    baseline:
      h_merch: h_units * h_unit
    evidence:
    - history
    cross_difficulty: null
  - id: h_restock_schedule
    effect: parameter
    decides: h_restock_rate
    bindings:
    - h_restock_rate
    ladder:
    - when: reason changed_mind and requested no more than early_return_days after delivery
      value: P('seller_restocking_fee_max_pct') / 2
    - when: reason changed_mind and requested later
      value: P('seller_restocking_fee_max_pct')
    - when: any other reason
      value: '0'
    baseline:
      h_restock_rate: '0'
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: h_partial_credit
    effect: parameter
    decides: h_partial
    bindings:
    - h_partials
    - h_partial
    ladder:
    - when: partial refunds on the line and units of the line kept
      value: partial refunds x units / units bought
    - when: partial refunds on the line and no unit of the line kept
      value: the whole of those partial refunds
    - when: otherwise
      value: '0'
    baseline:
      h_partial: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: h_promo_recovery
    effect: parameter
    decides: h_promo
    bindings:
    - h_promo_card
    - h_promo_kind
    - h_promo_spent
    - h_merch_refunded
    - h_merch_refunded_other
    - h_kept_before
    - h_kept_after
    - h_cov_last
    - h_order_refund_last
    - h_order_reimb_last
    - h_settles
    - h_promo
    ladder:
    - when: >-
        a qualifying promotional card earned by the order with value spent, the merchandise kept before the refund at or
        above promo_qualifying_total_usd and the merchandise kept after the refund below it
      value: >-
        the whole remaining spent value: value spent x merchandise kept before the refund / order merchandise total
    - when: >-
        a qualifying promotional card earned by the order with value spent, and the merchandise kept after the refund at
        or above promo_qualifying_total_usd
      value: value spent x price paid for the units / order merchandise total
    - when: >-
        otherwise (no such card, nothing spent, or the merchandise kept before the refund already below promo_qualifying_total_usd)
      value: '0'
    baseline:
      h_promo: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: gift
  - id: h_ship_allocation
    effect: method
    decides: h_ship
    bindings:
    - h_ship_charge
    - h_ship
    ladder:
    - when: Freight Seller order charged shipping
      method: shipping charge / order's units x units (per piece)
    - when: other seller program charged shipping
      method: shipping charge x price paid for the units / order merchandise total (value share)
    - when: no shipping charged
      method: no shipping portion
    baseline:
      h_ship: h_ship_charge
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: h_shipping_refund_setoff
    effect: method
    decides: h_setoff
    bindings:
    - h_ship_refunds
    - h_setoff
    ladder:
    - when: Freight Seller order with shipping refunds
      method: shipping refunds / order's units x units (per piece)
    - when: other seller program with shipping refunds
      method: shipping refunds x price paid for the units / order merchandise total
    - when: no shipping refund recorded
      method: nothing set off
    baseline:
      h_setoff: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      Standard method for the return-refund reimbursement: it is the merchandise value of the claimed units, taken as the
      listed unit price of their line times the claimed units, plus their shipping portion, taken as the order's whole shipping
      charge, less the refunds already received. The guarantee room for a return-not-refunded claim is the program's guarantee
      maximum per order, less every guarantee reimbursement already booked on the order, less the amounts claimed on the
      order's other claims whose claim record shows no decision yet, a decision on a claim being shown on its claim record
      as well as on its decision entry. The return-refund reimbursement is limited to that guarantee room and never falls
      below zero, and only that final figure is rounded half up to the cent.
    params:
    - guarantee_max_per_order_usd
  inputs:
    history:
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_seller_refund
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_open_claim
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_redeem
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_refund_to_card
    - category: gift
      table: gift_events
      aggregate: latest
      field: gift_card_id
      filters:
        event_type: gift_load_value
    cross_category:
    - gift
- id: market_ext_unresponsive_claim_reimbursement
  base_policy_refs:
  - market_guarantee_decision
  overwrite:
  - base_policy: market_guarantee_decision
    superseded_clause: >-
      A granted claim reimburses the price paid for the affected items plus their shipping, less everything the seller already
      refunded on them, capped at guarantee_max_per_order_usd per order across all claims on the order, rounded half up
      to the cent and paid to the original payment.
    replaced_by: >-
      For a seller-unresponsive claim within this policy's scope, and only for such a claim, the granted reimbursement is
      the unresponsive-seller reimbursement this policy fixes, paid to the external card the order was paid with; a return-not-refunded
      claim or a not-received claim keeps the figure its own policy fixes, a claim of whose claimed units the seller has
      refunded every one is denied as seller-resolved as the base rule says, and every other granted claim, including every
      claim on an order paid with a Northgate Card, still reimburses the price paid for the affected items plus their shipping,
      less everything the seller already refunded on them, capped at the per-order maximum across all claims on the order,
      rounded half up to the cent and paid to the original payment.
  trigger: state_due
  subject:
  - market_decide_claim
  - market_guarantee_reimburse
  computes: amount_reimbursed_usd
  target_tool: grant_unresponsive_seller_claim_064f9cf7
  params:
    promo_qualifying_total_usd: 1000.0
  rule: >-
    This policy fixes the unresponsive-seller reimbursement, the amount Northgate pays when it grants a seller-unresponsive
    guarantee claim; the claim handled is the order's most recent seller-unresponsive claim whose claim record shows no
    decision yet (where two such entries share a date, the one recorded first counts), and its claimed line, the units it
    records and its claimed amount are the ones that claim records. The policy applies only where the order is of a seller
    program other than Fulfilled by Northgate, was paid with an external card and carries no more than ten lines, the claimed
    line carries no return request, and the order carries exactly one seller-unresponsive claim whose claim record shows
    no decision, and at least one claimed unit is still unrefunded; elsewhere it fixes nothing, its figure is zero and the
    base rule stands: "A granted claim reimburses the price paid for the affected items plus their shipping, less everything
    the seller already refunded on them, capped at guarantee_max_per_order_usd per order across all claims on the order,
    rounded half up to the cent and paid to the original payment." Northgate decides such a claim once the seller's response
    period on it has run out. The claimed line's set price per unit is its line amount divided by the units bought on it;
    the claimed units still unrefunded are the units the claim records less the units already refunded on the line, unit
    refund entries being counted by the units they refund, and the price paid for the claimed units still unrefunded is
    that set price per unit times the claimed units still unrefunded. The order's merchandise total is the sum of its line
    amounts and the order's units are the units bought across its lines. Standard method for the unresponsive-seller reimbursement:
    it is the merchandise value of the claimed units still unrefunded, taken as the listed unit price of their line times
    the claimed units still unrefunded, plus their shipping portion, taken as the order's whole shipping charge. The guarantee
    room for a seller-unresponsive claim is the program's guarantee maximum per order, less every guarantee reimbursement
    already booked on the order, less the amounts claimed on the order's other claims whose claim record shows no decision
    yet, a decision on a claim being shown on its claim record as well as on its decision entry. The unresponsive-seller
    reimbursement is limited to that guarantee room and never falls below zero, and only that final figure is rounded half
    up to the cent. Each rule that follows adds to or takes from the unresponsive-seller reimbursement, as that rule itself
    states, before the limit to the guarantee room is applied. The merchandise value of the claimed units still unrefunded
    in the unresponsive-seller reimbursement depends on how the line was priced and what was already refunded on it: where
    the line is set-priced, that is its line amount is below its listed unit price times the units bought, and it carries
    unit refunds on fewer units than were bought, it is what remains of the line amount after the listed unit price of every
    unit already refunded on it, divided by the units not yet refunded, times the claimed units still unrefunded; where
    the line is set-priced and carries no unit refund, or unit refunds on every unit bought, it is the price paid for the
    claimed units still unrefunded; on a line that is not set-priced it is the listed unit price times the claimed units
    still unrefunded. The partial-refund credit taken from the unresponsive-seller reimbursement follows the seller's partial
    refunds recorded on that line, the units of the claimed line with the buyer being the units bought on it less the units
    asked back on it by change-of-mind return requests: where the line carries partial refunds and the units of the claimed
    line with the buyer are more than zero, the credit is those partial refunds times the claimed units still unrefunded
    divided by the units bought on the line; where the line carries partial refunds and no unit remains among the units
    of the claimed line with the buyer, the credit is the whole of those partial refunds; otherwise there is no credit.
    The promotional recovery taken from the unresponsive-seller reimbursement follows Northgate's marketplace promotion,
    under which an order whose merchandise total reaches promo_qualifying_total_usd earns a Northgate Promotional Gift Card
    whose initial load names that order, and the value already spent from that card, that is its redemptions less any refunds
    credited back to it, is recovered from the refunds of that order's merchandise, whether by a seller refund or by a guarantee
    reimbursement, in proportion to the merchandise refunded over the order's merchandise total, except that a refund leaving
    the merchandise kept on the order below promo_qualifying_total_usd recovers the whole remaining spent value, that is
    the value spent less what the order's earlier refunds recovered under this sentence, and a refund made when the merchandise
    kept on the order was already below promo_qualifying_total_usd recovers nothing, so that no more than the value spent
    is ever recovered on the order, value not yet spent being voided on the card only under the gift card rules; the unresponsive-seller
    reimbursement counts as the refund of the claimed units still unrefunded, made after every other refund of the order's
    merchandise; the merchandise refunded on the order is, line by line, the line's set price per unit times the greater
    of the units its unit refunds and cancellation refunds refund and the units of its claims whose claim record shows them
    granted; the merchandise kept before the refund is the order's merchandise total less the merchandise refunded on the
    order other than on the claimed units still unrefunded, and the merchandise kept after the refund is that amount less
    the price paid for the claimed units still unrefunded: where the order earned such a card, value has been spent from
    it, the merchandise kept before the refund is at or above promo_qualifying_total_usd and the merchandise kept after
    the refund is below it, the recovery is the whole remaining spent value, which is the value spent times the merchandise
    kept before the refund divided by the order's merchandise total; where the order earned such a card, value has been
    spent from it and the merchandise kept after the refund is at or above promo_qualifying_total_usd, the recovery is the
    value spent times the price paid for the claimed units still unrefunded divided by the order's merchandise total; otherwise,
    including where the merchandise kept before the refund is already below promo_qualifying_total_usd, there is no promotional
    recovery. The shipping portion added to the unresponsive-seller reimbursement depends on the seller program and on the
    shipping charged: on a Freight Seller order that was charged shipping, it is the order's shipping charge divided by
    the order's units times the claimed units still unrefunded; on an order of any other seller program that was charged
    shipping, it is the order's shipping charge times the price paid for the claimed units still unrefunded divided by the
    order's merchandise total; where no shipping was charged there is no shipping portion. The shipping refunds set off
    are the shipping refunds recorded on the order, shared out the way the shipping charge is: on a Freight Seller order
    with shipping refunds, the unresponsive-seller reimbursement gives up those refunds divided by the order's units times
    the claimed units still unrefunded; on an order of any other seller program with shipping refunds, it gives up those
    refunds times the price paid for the claimed units still unrefunded divided by the order's merchandise total; where
    no shipping refund is recorded nothing is given up. For a seller-unresponsive claim within this policy's scope, and
    only for such a claim, the granted reimbursement is the unresponsive-seller reimbursement this policy fixes, paid to
    the external card the order was paid with; a return-not-refunded claim or a not-received claim keeps the figure its
    own policy fixes, a claim of whose claimed units the seller has refunded every one is denied as seller-resolved as the
    base rule says, and every other granted claim, including every claim on an order paid with a Northgate Card, still reimburses
    the price paid for the affected items plus their shipping, less everything the seller already refunded on them, capped
    at the per-order maximum across all claims on the order, rounded half up to the cent and paid to the original payment.
    Northgate decides such a claim by granting it with the unresponsive-seller reimbursement this policy fixes; where the
    unresponsive-seller reimbursement comes to zero and the guarantee reimbursements already booked on the order reach the
    program's guarantee maximum per order, Northgate decides the claim as not covered and books no reimbursement; where
    the unresponsive-seller reimbursement comes to zero otherwise, the claim is not decided in this conversation and is
    referred to a human representative.
  prerequisite: []
  cross_category:
  - category: gift
    as: history
    reads:
    - gift_events.gift_card_id
    - gift_events.amount_usd
    - variant_name
    note: the promotional-recovery factor reads the promotional card the order earned and its redemptions
  compute:
  - g_claim: >-
      LATEST('market_events', 'market_event_id', event_type='market_open_claim', claim_reason='seller_unresponsive', claim_decision='not_applicable')
  - g_claimed: LATEST('market_events', 'amount_usd', market_event_id=g_claim) or 0
  - g_line: LATEST('market_events', 'original_event_id', market_event_id=g_claim)
  - g_recorded_units: LATEST('market_events', 'quantity', market_event_id=g_claim) or 0
  - g_qty: LATEST('market_events', 'quantity', market_event_id=g_line) or 1
  - g_unit: LATEST('market_events', 'unit_price_usd', market_event_id=g_line) or 0
  - g_amount: LATEST('market_events', 'amount_usd', market_event_id=g_line) or 0
  - g_refunded: >-
      SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='return_refund', original_event_id=g_line)
  - g_units: MX(0, g_recorded_units - g_refunded)
  - g_paid: g_units * g_amount / g_qty
  - g_merch_total: SUM('market_events', 'amount_usd', event_type='market_post_line')
  - g_order_units: SUM('market_events', 'quantity', event_type='market_post_line')
  - g_line_requests: COUNT('market_events', event_type='market_request_return', original_event_id=g_line)
  - g_undecided: >-
      COUNT('market_events', event_type='market_open_claim', claim_reason='seller_unresponsive', claim_decision='not_applicable')
  - g_in_scope: >-
      F('variant_name') != 'Northgate Marketplace Fulfilled by Northgate' and F('payment_method_type') == 'external_card'
      and COUNT('market_events', event_type='market_post_line') <= 10 and g_line_requests == 0 and g_undecided == 1
  - g_merch: >-
      (g_amount - g_unit * g_refunded) / (g_qty - g_refunded) * g_units if (g_amount < g_unit * g_qty and g_refunded > 0
      and g_refunded < g_qty) else (g_paid if g_amount < g_unit * g_qty else g_units * (LATEST('market_events', 'unit_price_usd',
      market_event_id=g_line) or 0))
  - g_kept: >-
      g_qty - SUM('market_events', 'quantity', event_type='market_request_return', original_event_id=g_line, return_reason='changed_mind')
  - g_partials: >-
      SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='partial_refund', original_event_id=g_line)
  - g_partial: >-
      g_partials * g_units / g_qty if (g_partials > 0 and g_kept > 0) else (g_partials if (g_partials > 0 and g_kept <=
      0) else 0)
  - g_promo_card: XLATEST('gift', 'gift_events', 'gift_card_id', event_type='gift_load_value', source_record_id=HID)
  - g_promo_kind: CFIELD('gift', 'variant_name', gift_card_id=g_promo_card)
  - g_promo_spent: >-
      XSUM('gift', 'gift_events', 'amount_usd', event_type='gift_redeem', gift_card_id=g_promo_card) - XSUM('gift', 'gift_events',
      'amount_usd', event_type='gift_refund_to_card', gift_card_id=g_promo_card)
  - g_merch_refunded: >-
      (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=1)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=1)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=1)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=1)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=1))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=2)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=2)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=2)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=2)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=2))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=3)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=3)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=3)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=3)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=3))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=4)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=4)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=4)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=4)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=4))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=5)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=5)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=5)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=5)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=5))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=6)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=6)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=6)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=6)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=6))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=7)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=7)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=7)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=7)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=7))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=8)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=8)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=8)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=8)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=8))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=9)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=9)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=9)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=9)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=9))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=10)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=10)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=10)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=10)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=10)))
  - g_merch_refunded_other: g_merch_refunded - g_amount / g_qty * (0)
  - g_kept_before: g_merch_total - g_merch_refunded_other
  - g_kept_after: g_kept_before - g_paid
  - g_promo: >-
      g_promo_spent * g_kept_before / g_merch_total if (g_promo_kind == 'Northgate Promotional Gift Card' and g_merch_total
      >= K('promo_qualifying_total_usd') and g_promo_spent > 0 and g_kept_before >= K('promo_qualifying_total_usd') and
      g_kept_after < K('promo_qualifying_total_usd')) else (g_promo_spent * g_paid / g_merch_total if (g_promo_kind == 'Northgate
      Promotional Gift Card' and g_merch_total >= K('promo_qualifying_total_usd') and g_promo_spent > 0 and g_kept_after
      >= K('promo_qualifying_total_usd')) else 0)
  - g_ship_charge: SUM('market_events', 'amount_usd', event_type='market_charge_shipping')
  - g_ship: >-
      g_ship_charge / g_order_units * g_units if (F('variant_name') == 'Northgate Marketplace Freight Seller' and g_ship_charge
      > 0) else (g_ship_charge * g_paid / g_merch_total if (F('variant_name') != 'Northgate Marketplace Freight Seller'
      and g_ship_charge > 0) else 0)
  - g_ship_refunds: SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='shipping_refund')
  - g_setoff: >-
      g_ship_refunds / g_order_units * g_units if (F('variant_name') == 'Northgate Marketplace Freight Seller' and g_ship_refunds
      > 0) else (g_ship_refunds * g_paid / g_merch_total if (F('variant_name') != 'Northgate Marketplace Freight Seller'
      and g_ship_refunds > 0) else 0)
  - g_room: >-
      P('guarantee_max_per_order_usd') - SUM('market_events', 'amount_usd', event_type='market_guarantee_reimburse') - SUM('market_events',
      'amount_usd', event_type='market_open_claim', claim_decision='not_applicable') + g_claimed
  - g_owed: g_merch - g_partial - g_promo + g_ship - g_setoff
  - result: RND(MX(0, MN(g_owed, g_room)) + 0.000000001, 2) if (g_in_scope and g_units > 0) else 0
  compute_basis:
    g_claim: >-
      This policy fixes the unresponsive-seller reimbursement, the amount Northgate pays when it grants a seller-unresponsive
      guarantee claim; the claim handled is the order's most recent seller-unresponsive claim whose claim record shows no
      decision yet (where two such entries share a date, the one recorded first counts), and its claimed line, the units
      it records and its claimed amount are the ones that claim records. The policy applies only where the order is of a
      seller program other than Fulfilled by Northgate, was paid with an external card and carries no more than ten lines,
      the claimed line carries no return request, and the order carries exactly one seller-unresponsive claim whose claim
      record shows no decision, and at least one claimed unit is still unrefunded; elsewhere it fixes nothing, its figure
      is zero and the base rule stands: "A granted claim reimburses the price paid for the affected items plus their shipping,
      less everything the seller already refunded on them, capped at guarantee_max_per_order_usd per order across all claims
      on the order, rounded half up to the cent and paid to the original payment." Northgate decides such a claim once the
      seller's response period on it has run out.
