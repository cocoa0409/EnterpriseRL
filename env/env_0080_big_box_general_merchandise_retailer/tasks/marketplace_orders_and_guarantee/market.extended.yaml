      reason not_as_described (where two such entries share a date, the one recorded first counts), and the claim records
      that request's line and the units it names that are still unrefunded. The policy applies only where the order is of
      a seller program other than Fulfilled by Northgate, was paid with an external card and carries no more than ten lines,
      and the requested line carries exactly one return request and no not-as-described claim, and at least one requested
      unit is still unrefunded; elsewhere it fixes nothing, its figure is zero and the base rule stands: the amount claimed
      is as the base claim record defines it: "Amount claimed, the price of the affected items plus their shipping, positive."
