    q_qty: >-
      The requested line's set price per unit is its line amount divided by the units bought on it; the requested units
      still unrefunded are the units the request records less the units already refunded on the line, unit refund entries
      being counted by the units they refund, and the price paid for the requested units still unrefunded is that set price
      per unit times the requested units still unrefunded.
