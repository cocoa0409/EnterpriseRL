    g_ship_charge: >-
      The shipping portion added to the unresponsive-seller reimbursement depends on the seller program and on the shipping
      charged: on a Freight Seller order that was charged shipping, it is the order's shipping charge divided by the order's
      units times the claimed units still unrefunded; on an order of any other seller program that was charged shipping,
      it is the order's shipping charge times the price paid for the claimed units still unrefunded divided by the order's
      merchandise total; where no shipping was charged there is no shipping portion.
