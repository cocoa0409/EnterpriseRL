      request but withheld more restocking than Northgate's schedule allows for the request's reason; the return handled
      is the return request most recently answered on the order with a return authorization (where two such entries share
      a date, the one recorded first counts), and the line, the returned units, the reason and the request date are the
      ones that request records.
    s_paid_back: >-
      The refunds on the returned line are every refund entry recorded there as a return refund, top-ups already booked
      included; the seller's unit refunds among them are the entries that refund units, with the units they refund.
    s_seller_units: >-
      The refunds on the returned line are every refund entry recorded there as a return refund, top-ups already booked
      included; the seller's unit refunds among them are the entries that refund units, with the units they refund.
    s_line_requests: >-
      A top-up is owed only where the order is of a seller program other than Fulfilled by Northgate and was paid with an
      external card and carries no more than ten lines, the order carries a single return authorization, the returned line
      carries exactly one return request, the seller's unit refunds on the returned line cover every returned unit; it is
      then the refund owed less the refunds on the returned line, and otherwise, or wherever that comes to zero, the top-up
      is settled with nothing booked and the base rule stands: "The seller must refund within seller_refund_business_days
      business days after the return is delivered, the price of the returned units less a restocking fee of at most seller_restocking_fee_max_pct
      percent on an opened changed_mind return, plus the original shipping charge where shipping_refund_on_seller_fault
      applies to the reason and never for changed_mind."
    s_authorizations: >-
      A top-up is owed only where the order is of a seller program other than Fulfilled by Northgate and was paid with an
      external card and carries no more than ten lines, the order carries a single return authorization, the returned line
      carries exactly one return request, the seller's unit refunds on the returned line cover every returned unit; it is
      then the refund owed less the refunds on the returned line, and otherwise, or wherever that comes to zero, the top-up
      is settled with nothing booked and the base rule stands: "The seller must refund within seller_refund_business_days
      business days after the return is delivered, the price of the returned units less a restocking fee of at most seller_restocking_fee_max_pct
      percent on an opened changed_mind return, plus the original shipping charge where shipping_refund_on_seller_fault
      applies to the reason and never for changed_mind."
    s_qty: >-
      The returned line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the returned units is that set price per unit times the returned units; the units of the returned line kept at the
      set price are the units bought on it less the units asked back on it by change-of-mind return requests.
    s_unit: >-
      The returned line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the returned units is that set price per unit times the returned units; the units of the returned line kept at the
      set price are the units bought on it less the units asked back on it by change-of-mind return requests.
    s_amount: >-
      The returned line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the returned units is that set price per unit times the returned units; the units of the returned line kept at the
      set price are the units bought on it less the units asked back on it by change-of-mind return requests.
    s_paid: >-
      The returned line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the returned units is that set price per unit times the returned units; the units of the returned line kept at the
      set price are the units bought on it less the units asked back on it by change-of-mind return requests.
    s_kept: >-
      The returned line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the returned units is that set price per unit times the returned units; the units of the returned line kept at the
      set price are the units bought on it less the units asked back on it by change-of-mind return requests.
    s_restock: >-
      The restocking the schedule allows, taken from the refund owed for the returned units, is a percentage of the price
      paid for the returned units following Northgate's changed-mind restocking schedule: where the request gives the reason
      changed_mind and was made no more than early_return_days calendar days after the order's delivered date, it is half
      the program's maximum restocking percentage; where the reason is changed_mind and the request was made later, it is
      the program's maximum restocking percentage; where the reason is any other, it is zero; the restocking the seller
      withheld is the restocking fees recorded on the return refund entries on the returned line, and a top-up is owed only
      where that restocking is above that percentage of the price paid for the returned units, and otherwise the top-up
      is settled with nothing booked.
    s_owed: >-
      Each rule that follows sets the merchandise value or takes an amount from the refund owed for the returned units,
      as that rule itself states, before the refunds on the line are subtracted.
    s_engaged: >-
      A top-up is owed only where the order is of a seller program other than Fulfilled by Northgate and was paid with an
      external card and carries no more than ten lines, the order carries a single return authorization, the returned line
      carries exactly one return request, the seller's unit refunds on the returned line cover every returned unit; it is
      then the refund owed less the refunds on the returned line, and otherwise, or wherever that comes to zero, the top-up
      is settled with nothing booked and the base rule stands: "The seller must refund within seller_refund_business_days
      business days after the return is delivered, the price of the returned units less a restocking fee of at most seller_restocking_fee_max_pct
      percent on an opened changed_mind return, plus the original shipping charge where shipping_refund_on_seller_fault
      applies to the reason and never for changed_mind."
    result: >-
      Standard method for the restocking top-up: the refund owed for the returned units is the listed unit price of their
      line times the returned units, and the restocking top-up is that refund owed less the refunds on the returned line;
      it never falls below zero, and only that final figure is rounded half up to the cent.
    s_merch: >-
      The merchandise value of the returned units in the refund owed for the returned units depends on how the line was
      priced: where the line is set-priced, that is its line amount is below its listed unit price times the units bought,
      and the request gives the reason changed_mind, it is the price paid for the returned units less the set saving per
      unit (listed unit price less set price per unit) times the units of the returned line kept at the set price times
      the returned units divided by the units asked back on the line for a change of mind; where the line is set-priced
      and the reason is any other, it is the price paid for the returned units; on a line that is not set-priced it is the
      listed unit price times the returned units.
    s_restock_rate: >-
      The restocking the schedule allows, taken from the refund owed for the returned units, is a percentage of the price
      paid for the returned units following Northgate's changed-mind restocking schedule: where the request gives the reason
