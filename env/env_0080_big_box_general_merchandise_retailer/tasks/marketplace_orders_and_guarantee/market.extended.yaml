      and the merchandise kept after the refund is below it, the recovery is the whole remaining spent value, which is the
      value spent times the merchandise kept before the refund divided by the order's merchandise total; where the order
      earned such a card, value has been spent from it and the merchandise kept after the refund is at or above promo_qualifying_total_usd,
      the recovery is the value spent times the price paid for the returned units divided by the order's merchandise total;
      otherwise, including where the merchandise kept before the refund is already below promo_qualifying_total_usd, there
      is no promotional recovery.
    s_promo: >-
      The promotional recovery taken from the refund owed for the returned units follows Northgate's marketplace promotion,
      under which an order whose merchandise total reaches promo_qualifying_total_usd earns a Northgate Promotional Gift
      Card whose initial load names that order, and the value already spent from that card, that is its redemptions less
      any refunds credited back to it, is recovered from the refunds of that order's merchandise, whether by a seller refund
      or by a guarantee reimbursement, in proportion to the merchandise refunded over the order's merchandise total, except
      that a refund leaving the merchandise kept on the order below promo_qualifying_total_usd recovers the whole remaining
      spent value, that is the value spent less what the order's earlier refunds recovered under this sentence, and a refund
      made when the merchandise kept on the order was already below promo_qualifying_total_usd recovers nothing, so that
      no more than the value spent is ever recovered on the order, value not yet spent being voided on the card only under
      the gift card rules, the order's merchandise total being the sum of its line amounts; the refund owed for the returned
      units counts as the refund of the returned units, made after every other refund of the order's merchandise; the merchandise
      refunded on the order is, line by line, the line's set price per unit times the greater of the units its unit refunds
      and cancellation refunds refund and the units of its claims whose claim record shows them granted; the merchandise
      kept before the refund is the order's merchandise total less the merchandise refunded on the order other than on the
      returned units, and the merchandise kept after the refund is that amount less the price paid for the returned units;
      where the order earned such a card, value has been spent from it, the merchandise kept on the order, that is its merchandise
      total less the merchandise refunded on it, is already below promo_qualifying_total_usd and some of the returned units
      have already been refunded, this policy fixes the refund owed for the returned units only if no seller refund and
      no guarantee reimbursement recorded on the order is dated after the most recent return refund on the line of the returned
      units, and otherwise it fixes nothing, its figure is zero and the base rule quoted above stands: where the order earned
      such a card, value has been spent from it, the merchandise kept before the refund is at or above promo_qualifying_total_usd
      and the merchandise kept after the refund is below it, the recovery is the whole remaining spent value, which is the
      value spent times the merchandise kept before the refund divided by the order's merchandise total; where the order
      earned such a card, value has been spent from it and the merchandise kept after the refund is at or above promo_qualifying_total_usd,
      the recovery is the value spent times the price paid for the returned units divided by the order's merchandise total;
      otherwise, including where the merchandise kept before the refund is already below promo_qualifying_total_usd, there
      is no promotional recovery.
  factors:
  - id: s_line_pricing
    effect: method
    decides: s_merch
    bindings:
    - s_merch
    ladder:
    - when: the line is set-priced and the request gives changed_mind
      method: >-
        price paid less the set saving per unit times the units kept at the set price times the units divided by the units
        asked back for a change of mind
    - when: the line is set-priced and the reason is any other
      method: price paid (set price per unit times the units)
    - when: otherwise (the line is not set-priced)
      method: listed unit price times the units
    baseline:
      s_merch: s_units * s_unit
    evidence:
    - history
    cross_difficulty: null
  - id: s_restock_schedule
    effect: parameter
    decides: s_restock_rate
    bindings:
    - s_restock_rate
    - s_withheld
    - s_over_allowance
    ladder:
    - when: reason changed_mind and requested no more than early_return_days after delivery
      value: P('seller_restocking_fee_max_pct') / 2
    - when: reason changed_mind and requested later
      value: P('seller_restocking_fee_max_pct')
    - when: any other reason
      value: '0'
    baseline:
      s_restock_rate: '0'
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: s_partial_credit
    effect: parameter
    decides: s_partial
    bindings:
    - s_partials
    - s_partial
    ladder:
    - when: partial refunds on the line and units of the line kept
      value: partial refunds x units / units bought
    - when: partial refunds on the line and no unit of the line kept
      value: the whole of those partial refunds
    - when: otherwise
      value: '0'
    baseline:
      s_partial: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: s_promo_recovery
    effect: parameter
    decides: s_promo
    bindings:
    - s_merch_total
    - s_promo_card
    - s_promo_kind
    - s_promo_spent
    - s_merch_refunded
    - s_merch_refunded_other
    - s_kept_before
    - s_kept_after
    - s_cov_last
    - s_order_refund_last
    - s_order_reimb_last
    - s_settles
    - s_promo
    ladder:
    - when: >-
        a qualifying promotional card earned by the order with value spent, the merchandise kept before the refund at or
        above promo_qualifying_total_usd and the merchandise kept after the refund below it
      value: >-
        the whole remaining spent value: value spent x merchandise kept before the refund / order merchandise total
    - when: >-
        a qualifying promotional card earned by the order with value spent, and the merchandise kept after the refund at
        or above promo_qualifying_total_usd
      value: value spent x price paid for the units / order merchandise total
    - when: >-
        otherwise (no such card, nothing spent, or the merchandise kept before the refund already below promo_qualifying_total_usd)
      value: '0'
    baseline:
      s_promo: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: gift
  baseline:
    rule: >-
      Standard method for the restocking top-up: the refund owed for the returned units is the listed unit price of their
      line times the returned units, and the restocking top-up is that refund owed less the refunds on the returned line;
      it never falls below zero, and only that final figure is rounded half up to the cent.
    params: []
  inputs:
    history:
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_seller_refund
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_redeem
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_refund_to_card
    - category: gift
      table: gift_events
      aggregate: latest
      field: gift_card_id
      filters:
        event_type: gift_load_value
    cross_category:
    - gift
