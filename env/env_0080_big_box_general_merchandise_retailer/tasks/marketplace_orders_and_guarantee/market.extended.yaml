    u_qty: >-
      The requested line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the requested units is that set price per unit times the requested units; the units of the requested line kept are
      the units bought on it less the units asked back on it by change-of-mind return requests.
    u_unit: >-
      The requested line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the requested units is that set price per unit times the requested units; the units of the requested line kept are
      the units bought on it less the units asked back on it by change-of-mind return requests.
    u_amount: >-
      The requested line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the requested units is that set price per unit times the requested units; the units of the requested line kept are
      the units bought on it less the units asked back on it by change-of-mind return requests.
    u_paid: >-
