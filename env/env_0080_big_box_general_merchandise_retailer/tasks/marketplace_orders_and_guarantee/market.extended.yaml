      'market_event_id', event_type='market_post_line', line_number=8)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=8)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=8)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=8)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=8))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=9)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=9)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=9)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=9)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=9))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=10)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=10)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=10)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=10)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=10)))
  - u_merch_refunded_other: u_merch_refunded - u_amount / u_qty * (u_refunded_qty)
  - u_kept_before: u_merch_total - u_merch_refunded_other
  - u_kept_after: u_kept_before - u_paid
  - u_cov_last: >-
      LATEST('market_events', 'event_date', event_type='market_seller_refund', refund_type='return_refund', original_event_id=u_line)
  - u_order_refund_last: LATEST('market_events', 'event_date', event_type='market_seller_refund')
  - u_order_reimb_last: LATEST('market_events', 'event_date', event_type='market_guarantee_reimburse')
  - u_settles: >-
      not (u_promo_kind == 'Northgate Promotional Gift Card' and u_merch_total >= K('promo_qualifying_total_usd') and u_promo_spent
      > 0 and u_merch_total - u_merch_refunded < K('promo_qualifying_total_usd') and (u_refunded_qty) > 0) or ((u_cov_last
      or '') >= (u_order_refund_last or '') and (u_cov_last or '') >= (u_order_reimb_last or ''))
  - u_promo: >-
      u_promo_spent * u_kept_before / u_merch_total if (u_promo_kind == 'Northgate Promotional Gift Card' and u_merch_total
      >= K('promo_qualifying_total_usd') and u_promo_spent > 0 and u_kept_before >= K('promo_qualifying_total_usd') and
      u_kept_after < K('promo_qualifying_total_usd')) else (u_promo_spent * u_paid / u_merch_total if (u_promo_kind == 'Northgate
      Promotional Gift Card' and u_merch_total >= K('promo_qualifying_total_usd') and u_promo_spent > 0 and u_kept_after
      >= K('promo_qualifying_total_usd')) else 0)
  - u_ship_charge: SUM('market_events', 'amount_usd', event_type='market_charge_shipping')
  - u_ship: >-
      u_ship_charge / u_order_units * u_units if (F('variant_name') == 'Northgate Marketplace Freight Seller' and u_ship_charge
      > 0) else (u_ship_charge * u_paid / u_merch_total if (F('variant_name') != 'Northgate Marketplace Freight Seller'
      and u_ship_charge > 0) else 0)
  - u_ship_refunds: SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='shipping_refund')
  - u_setoff: >-
      u_ship_refunds / u_order_units * u_units if (F('variant_name') == 'Northgate Marketplace Freight Seller' and u_ship_refunds
      > 0) else (u_ship_refunds * u_paid / u_merch_total if (F('variant_name') != 'Northgate Marketplace Freight Seller'
      and u_ship_refunds > 0) else 0)
  - u_room: >-
      P('guarantee_max_per_order_usd') - SUM('market_events', 'amount_usd', event_type='market_guarantee_reimburse') - SUM('market_events',
      'amount_usd', event_type='market_open_claim', claim_decision='not_applicable')
  - u_owed: u_merch - u_restock - u_partial - u_promo + u_ship - u_unit_refunds - u_setoff
  - result: RND(MX(0, MN(u_owed, u_room)) + 0.000000001, 2) if (u_in_scope and u_open > 0 and u_settles) else 0
  compute_basis:
    u_req: >-
      This policy fixes the amount claimed for an unrefunded return, the amount a buyer claims when filing a return-not-refunded
      guarantee claim; the return claimed for is the return request most recently answered on the order with a return authorization
      (where two such entries share a date, the one recorded first counts), and the claim records that request's line and
      its units, with the reason and request date the request records. The policy applies only where the order is of a seller
      program other than Fulfilled by Northgate, was paid with an external card and carries no more than ten lines, and
      the requested line carries exactly one return request and no return-not-refunded claim, and the seller has not refunded
      every unit the request names; elsewhere it fixes nothing, its figure is zero and the base rule stands: the amount
      claimed is as the base claim record defines it: "Amount claimed, the price of the affected items plus their shipping,
      positive."
