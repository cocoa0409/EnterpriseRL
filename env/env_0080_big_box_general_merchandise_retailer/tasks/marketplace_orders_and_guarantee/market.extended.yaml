  factors:
  - id: g_line_pricing
    effect: method
    decides: g_merch
    bindings:
    - g_merch
    ladder:
    - when: the line is set-priced and carries unit refunds on fewer units than were bought
      method: >-
        what remains of the line amount after the listed price of the refunded units, per unit not yet refunded, times the
        units
    - when: the line is set-priced and carries no unit refund, or unit refunds on every unit bought
      method: price paid (set price per unit times the units)
    - when: otherwise (the line is not set-priced)
      method: listed unit price times the units
    baseline:
      g_merch: g_units * g_unit
    evidence:
    - history
    cross_difficulty: null
  - id: g_partial_credit
    effect: parameter
    decides: g_partial
    bindings:
    - g_kept
    - g_partials
    - g_partial
    ladder:
    - when: partial refunds on the line and units of the line kept
      value: partial refunds x units / units bought
    - when: partial refunds on the line and no unit of the line kept
      value: the whole of those partial refunds
    - when: otherwise
      value: '0'
    baseline:
      g_partial: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: g_promo_recovery
    effect: parameter
    decides: g_promo
    bindings:
    - g_promo_card
    - g_promo_kind
    - g_promo_spent
    - g_merch_refunded
    - g_merch_refunded_other
    - g_kept_before
    - g_kept_after
    - g_promo
    ladder:
    - when: >-
        a qualifying promotional card earned by the order with value spent, the merchandise kept before the refund at or
        above promo_qualifying_total_usd and the merchandise kept after the refund below it
      value: >-
        the whole remaining spent value: value spent x merchandise kept before the refund / order merchandise total
    - when: >-
        a qualifying promotional card earned by the order with value spent, and the merchandise kept after the refund at
        or above promo_qualifying_total_usd
      value: value spent x price paid for the units / order merchandise total
    - when: >-
        otherwise (no such card, nothing spent, or the merchandise kept before the refund already below promo_qualifying_total_usd)
      value: '0'
    baseline:
      g_promo: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: gift
  - id: g_ship_allocation
    effect: method
    decides: g_ship
    bindings:
    - g_ship_charge
    - g_ship
    ladder:
    - when: Freight Seller order charged shipping
      method: shipping charge / order's units x units (per piece)
    - when: other seller program charged shipping
      method: shipping charge x price paid for the units / order merchandise total (value share)
    - when: no shipping charged
      method: no shipping portion
    baseline:
      g_ship: g_ship_charge
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: g_shipping_refund_setoff
    effect: method
    decides: g_setoff
    bindings:
    - g_ship_refunds
    - g_setoff
    ladder:
    - when: Freight Seller order with shipping refunds
      method: shipping refunds / order's units x units (per piece)
    - when: other seller program with shipping refunds
      method: shipping refunds x price paid for the units / order merchandise total
    - when: no shipping refund recorded
      method: nothing set off
    baseline:
      g_setoff: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      Standard method for the unresponsive-seller reimbursement: it is the merchandise value of the claimed units still
      unrefunded, taken as the listed unit price of their line times the claimed units still unrefunded, plus their shipping
      portion, taken as the order's whole shipping charge. The guarantee room for a seller-unresponsive claim is the program's
      guarantee maximum per order, less every guarantee reimbursement already booked on the order, less the amounts claimed
      on the order's other claims whose claim record shows no decision yet, a decision on a claim being shown on its claim
      record as well as on its decision entry. The unresponsive-seller reimbursement is limited to that guarantee room and
      never falls below zero, and only that final figure is rounded half up to the cent.
    params:
    - guarantee_max_per_order_usd
  inputs:
    history:
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_seller_refund
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_open_claim
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_redeem
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_refund_to_card
    - category: gift
      table: gift_events
      aggregate: latest
      field: gift_card_id
      filters:
        event_type: gift_load_value
    cross_category:
    - gift
- id: market_ext_keepit_unit_refund
  base_policy_refs:
  - market_cancellation
  - market_returns
  overwrite:
  - base_policy: market_returns
    superseded_clause: >-
      The seller must refund within seller_refund_business_days business days after the return is delivered, the price of
      the returned units less a restocking fee of at most seller_restocking_fee_max_pct percent on an opened changed_mind
      return, plus the original shipping charge where shipping_refund_on_seller_fault applies to the reason and never for
      changed_mind.
    replaced_by: >-
      For a keep-it refund within this policy's scope, and only for such a refund, the keep-it refund this policy fixes
      takes the place of the return rule's price of the returned units less a restocking fee of at most the program's maximum
      on an opened changed_mind return; a restocking top-up on such an order follows its own policy; and every other seller
      refund, including every refund on an order paid with a Northgate Card, still follows the return rule: the seller must
      refund within seller_refund_business_days business days after the return is delivered the price of the returned units
      less a restocking fee of at most the program's maximum percentage on an opened changed_mind return, plus the original
      shipping charge where the reason is a seller fault and never for changed_mind.
  trigger: state_due
  subject:
  - market_seller_refund
  computes: amount_refunded_usd
  target_tool: refund_keepit_units_1db7244d
  params:
    promo_qualifying_total_usd: 1000.0
  rule: >-
    This policy fixes the keep-it refund, the unit refund Northgate books when a seller answers a buyer's return request
    with a refund without return; the request handled is the return request most recently answered on the order with a refund
    without return (where two such entries share a date, the one recorded first counts), and the line, the requested units
    and the reason are the ones that request records. The policy applies only where the order is of a seller program other
    than Fulfilled by Northgate, was paid with an external card and carries no more than ten lines, the order carries exactly
    one return request the seller answered with a refund without return, the requested line carries exactly one return request,
    and the request names at least one unit; elsewhere it fixes nothing, its figure is zero and the base rule stands: "The
    seller must refund within seller_refund_business_days business days after the return is delivered, the price of the
    returned units less a restocking fee of at most seller_restocking_fee_max_pct percent on an opened changed_mind return,
    plus the original shipping charge where shipping_refund_on_seller_fault applies to the reason and never for changed_mind."
    A keep-it refund carries no shipping; the original shipping of a seller-fault request is refunded on its own shipping
    refund under the return rule. The requested line's set price per unit is its line amount divided by the units bought
    on it, and the price paid for the requested units is that set price per unit times the requested units; the units of
    the requested line kept at the set price are the units bought on it less the units asked back on it by change-of-mind
    return requests. The return refunds already recorded on the requested line are every return refund entry there. The
    order's merchandise total is the sum of its line amounts. Standard method for the keep-it refund: it is the listed unit
    price of the requested line times the requested units, less the return refunds already recorded on the requested line;
    it never falls below zero, and only that final figure is rounded half up to the cent. Each rule that follows sets the
    keep-it refund's merchandise value or takes an amount from the keep-it refund, as that rule itself states, before the
    return refunds already recorded on the requested line are subtracted and the final rounding. The merchandise value of
    the requested units in the keep-it refund depends on how the line was priced: where the line is set-priced, that is
    its line amount is below its listed unit price times the units bought, and the request gives the reason changed_mind,
    it is the price paid for the requested units less the set saving per unit (listed unit price less set price per unit)
    times the units of the requested line kept at the set price times the requested units divided by the units asked back
    on the line for a change of mind; where the line is set-priced and the reason is any other, it is the price paid for
    the requested units; on a line that is not set-priced it is the listed unit price times the requested units. The return-shipping
    keep-back taken from the keep-it refund applies to a change of mind on a seller program where the buyer pays change-of-mind
    return shipping, standing in for the return trip the buyer no longer pays: on such a Freight Seller order it is the
    order's shipping charge divided by the order's units times the requested units; on such an order of any other seller
    program it is the order's shipping charge times the price paid for the requested units divided by the order's merchandise
    total; for any other reason or program there is no keep-back; the order's units are the units bought across its lines.
    The partial-refund credit taken from the keep-it refund follows the seller's partial refunds recorded on that line:
    where the line carries partial refunds and the units of the requested line kept at the set price are more than zero,
    the credit is those partial refunds times the requested units divided by the units bought on the line; where the line
    carries partial refunds and no unit remains among the units of the requested line kept at the set price, the credit
    is the whole of those partial refunds; otherwise there is no credit. The promotional recovery taken from the keep-it
    refund follows Northgate's marketplace promotion, under which an order whose merchandise total reaches promo_qualifying_total_usd
    earns a Northgate Promotional Gift Card whose initial load names that order, and the value already spent from that card,
    that is its redemptions less any refunds credited back to it, is recovered from the refunds of that order's merchandise,
    whether by a seller refund or by a guarantee reimbursement, in proportion to the merchandise refunded over the order's
    merchandise total, except that a refund leaving the merchandise kept on the order below promo_qualifying_total_usd recovers
    the whole remaining spent value, that is the value spent less what the order's earlier refunds recovered under this
    sentence, and a refund made when the merchandise kept on the order was already below promo_qualifying_total_usd recovers
    nothing, so that no more than the value spent is ever recovered on the order, value not yet spent being voided on the
    card only under the gift card rules; the keep-it refund counts as the refund of the requested units, made after every
    other refund of the order's merchandise; the merchandise refunded on the order is, line by line, the line's set price
    per unit times the greater of the units its unit refunds and cancellation refunds refund and the units of its claims
    whose claim record shows them granted; the merchandise kept before the refund is the order's merchandise total less
    the merchandise refunded on the order other than on the requested units, the requested units already refunded being
    the units the return refund entries on the requested line refund, and the merchandise kept after the refund is that
    amount less the price paid for the requested units; where the order earned such a card, value has been spent from it,
    the merchandise kept on the order, that is its merchandise total less the merchandise refunded on it, is already below
    promo_qualifying_total_usd and some of the requested units have already been refunded, this policy fixes the keep-it
    refund only if no seller refund and no guarantee reimbursement recorded on the order is dated after the most recent
    return refund on the line of the requested units, and otherwise it fixes nothing, its figure is zero and the base rule
    quoted above stands: where the order earned such a card, value has been spent from it, the merchandise kept before the
    refund is at or above promo_qualifying_total_usd and the merchandise kept after the refund is below it, the recovery
    is the whole remaining spent value, which is the value spent times the merchandise kept before the refund divided by
    the order's merchandise total; where the order earned such a card, value has been spent from it and the merchandise
    kept after the refund is at or above promo_qualifying_total_usd, the recovery is the value spent times the price paid
    for the requested units divided by the order's merchandise total; otherwise, including where the merchandise kept before
    the refund is already below promo_qualifying_total_usd, there is no promotional recovery. For a keep-it refund within
    this policy's scope, and only for such a refund, the keep-it refund this policy fixes takes the place of the return
    rule's price of the returned units less a restocking fee of at most the program's maximum on an opened changed_mind
    return; a restocking top-up on such an order follows its own policy; and every other seller refund, including every
    refund on an order paid with a Northgate Card, still follows the return rule: the seller must refund within seller_refund_business_days
    business days after the return is delivered the price of the returned units less a restocking fee of at most the program's
    maximum percentage on an opened changed_mind return, plus the original shipping charge where the reason is a seller
    fault and never for changed_mind. Northgate books the keep-it refund this policy fixes on the requested line; where
    it comes to zero while no return refund is yet recorded on the requested line, the request is not settled in this conversation
    and is referred to a human representative.
  prerequisite: []
  cross_category:
  - category: gift
    as: history
    reads:
    - gift_events.gift_card_id
    - gift_events.amount_usd
    - variant_name
    note: the promotional-recovery factor reads the promotional card the order earned and its redemptions
  compute:
  - r_req: >-
      LATEST('market_events', 'original_event_id', event_type='market_seller_respond', seller_response='refund_without_return')
  - r_line: LATEST('market_events', 'original_event_id', market_event_id=r_req)
  - r_units: LATEST('market_events', 'quantity', market_event_id=r_req) or 0
  - r_reason: LATEST('market_events', 'return_reason', market_event_id=r_req)
  - r_qty: LATEST('market_events', 'quantity', market_event_id=r_line) or 1
  - r_unit: LATEST('market_events', 'unit_price_usd', market_event_id=r_line) or 0
  - r_amount: LATEST('market_events', 'amount_usd', market_event_id=r_line) or 0
  - r_paid: r_units * r_amount / r_qty
  - r_kept: >-
      r_qty - SUM('market_events', 'quantity', event_type='market_request_return', original_event_id=r_line, return_reason='changed_mind')
  - r_merch_total: SUM('market_events', 'amount_usd', event_type='market_post_line')
  - r_keepit_answers: COUNT('market_events', event_type='market_seller_respond', seller_response='refund_without_return')
  - r_line_requests: COUNT('market_events', event_type='market_request_return', original_event_id=r_line)
  - r_line_refunds: >-
      SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='return_refund', original_event_id=r_line)
  - r_in_scope: >-
      F('variant_name') != 'Northgate Marketplace Fulfilled by Northgate' and F('payment_method_type') == 'external_card'
      and COUNT('market_events', event_type='market_post_line') <= 10 and r_keepit_answers == 1 and r_line_requests == 1
  - r_merch: >-
      (r_paid - ((LATEST('market_events', 'unit_price_usd', market_event_id=r_line) or 0) - r_amount / r_qty) * r_kept *
      r_units / (r_qty - r_kept)) if (r_amount < r_unit * r_qty and r_reason == 'changed_mind') else (r_paid if r_amount
      < r_unit * r_qty else r_units * r_unit)
  - r_order_units: SUM('market_events', 'quantity', event_type='market_post_line')
  - r_ship_charge: SUM('market_events', 'amount_usd', event_type='market_charge_shipping')
  - r_keepback: >-
      r_ship_charge / r_order_units * r_units if (r_reason == 'changed_mind' and P('changed_mind_return_shipping') == 'buyer'
      and F('variant_name') == 'Northgate Marketplace Freight Seller') else (r_ship_charge * r_paid / r_merch_total if (r_reason
      == 'changed_mind' and P('changed_mind_return_shipping') == 'buyer' and F('variant_name') != 'Northgate Marketplace
      Freight Seller') else 0)
  - r_partials: >-
      SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='partial_refund', original_event_id=r_line)
  - r_partial: >-
      r_partials * r_units / r_qty if (r_partials > 0 and r_kept > 0) else (r_partials if (r_partials > 0 and r_kept <=
      0) else 0)
  - r_line_unit_qty: >-
      SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='return_refund', original_event_id=r_line)
  - r_promo_card: XLATEST('gift', 'gift_events', 'gift_card_id', event_type='gift_load_value', source_record_id=HID)
  - r_promo_kind: CFIELD('gift', 'variant_name', gift_card_id=r_promo_card)
  - r_promo_spent: >-
      XSUM('gift', 'gift_events', 'amount_usd', event_type='gift_redeem', gift_card_id=r_promo_card) - XSUM('gift', 'gift_events',
      'amount_usd', event_type='gift_refund_to_card', gift_card_id=r_promo_card)
  - r_merch_refunded: >-
      (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=1)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=1)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=1)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=1)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=1))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=2)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=2)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=2)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=2)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=2))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=3)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=3)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
