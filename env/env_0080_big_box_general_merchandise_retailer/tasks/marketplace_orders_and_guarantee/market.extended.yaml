      The shipping portion added to the amount claimed for an item not as described depends on the seller program and on
      the shipping charged: on a Freight Seller order that was charged shipping, it is the order's shipping charge divided
      by the order's units times the requested units still unrefunded; on an order of any other seller program that was
      charged shipping, it is the order's shipping charge times the price paid for the requested units still unrefunded
      divided by the order's merchandise total; where no shipping was charged there is no shipping portion.
    q_ship: >-
      The shipping portion added to the amount claimed for an item not as described depends on the seller program and on
      the shipping charged: on a Freight Seller order that was charged shipping, it is the order's shipping charge divided
      by the order's units times the requested units still unrefunded; on an order of any other seller program that was
      charged shipping, it is the order's shipping charge times the price paid for the requested units still unrefunded
      divided by the order's merchandise total; where no shipping was charged there is no shipping portion.
    q_ship_refunds: >-
      The shipping refunds set off are the shipping refunds recorded on the order, shared out the way the shipping charge
      is: on a Freight Seller order with shipping refunds, the amount claimed for an item not as described gives up those
      refunds divided by the order's units times the requested units still unrefunded; on an order of any other seller program
      with shipping refunds, it gives up those refunds times the price paid for the requested units still unrefunded divided
      by the order's merchandise total; where no shipping refund is recorded nothing is given up.
    q_setoff: >-
      The shipping refunds set off are the shipping refunds recorded on the order, shared out the way the shipping charge
      is: on a Freight Seller order with shipping refunds, the amount claimed for an item not as described gives up those
      refunds divided by the order's units times the requested units still unrefunded; on an order of any other seller program
      with shipping refunds, it gives up those refunds times the price paid for the requested units still unrefunded divided
      by the order's merchandise total; where no shipping refund is recorded nothing is given up.
  factors:
  - id: q_line_pricing
    effect: method
    decides: q_merch
    bindings:
    - q_merch
    ladder:
    - when: the line is set-priced and carries unit refunds on fewer units than were bought
      method: >-
        what remains of the line amount after the listed price of the refunded units, per unit not yet refunded, times the
        units
    - when: the line is set-priced and carries no unit refund, or unit refunds on every unit bought
      method: price paid (set price per unit times the units)
    - when: otherwise (the line is not set-priced)
      method: listed unit price times the units
    baseline:
      q_merch: q_units * q_unit
    evidence:
    - history
    cross_difficulty: null
  - id: q_partial_credit
    effect: parameter
    decides: q_partial
    bindings:
    - q_kept
    - q_partials
    - q_partial
    ladder:
    - when: partial refunds on the line and units of the line kept
      value: partial refunds x units / units bought
    - when: partial refunds on the line and no unit of the line kept
      value: the whole of those partial refunds
    - when: otherwise
      value: '0'
    baseline:
      q_partial: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: q_promo_recovery
    effect: parameter
    decides: q_promo
    bindings:
    - q_promo_card
    - q_promo_kind
    - q_promo_spent
    - q_merch_refunded
    - q_merch_refunded_other
    - q_kept_before
    - q_kept_after
    - q_promo
    ladder:
    - when: >-
        a qualifying promotional card earned by the order with value spent, the merchandise kept before the refund at or
        above promo_qualifying_total_usd and the merchandise kept after the refund below it
      value: >-
        the whole remaining spent value: value spent x merchandise kept before the refund / order merchandise total
    - when: >-
        a qualifying promotional card earned by the order with value spent, and the merchandise kept after the refund at
        or above promo_qualifying_total_usd
      value: value spent x price paid for the units / order merchandise total
    - when: >-
        otherwise (no such card, nothing spent, or the merchandise kept before the refund already below promo_qualifying_total_usd)
      value: '0'
    baseline:
      q_promo: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: gift
  - id: q_ship_allocation
    effect: method
    decides: q_ship
    bindings:
    - q_ship_charge
    - q_ship
    ladder:
    - when: Freight Seller order charged shipping
      method: shipping charge / order's units x units (per piece)
    - when: other seller program charged shipping
      method: shipping charge x price paid for the units / order merchandise total (value share)
    - when: no shipping charged
      method: no shipping portion
    baseline:
      q_ship: q_ship_charge
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: q_shipping_refund_setoff
    effect: method
    decides: q_setoff
    bindings:
    - q_ship_refunds
    - q_setoff
    ladder:
    - when: Freight Seller order with shipping refunds
      method: shipping refunds / order's units x units (per piece)
    - when: other seller program with shipping refunds
      method: shipping refunds x price paid for the units / order merchandise total
    - when: no shipping refund recorded
      method: nothing set off
    baseline:
      q_setoff: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      Standard method for the amount claimed for an item not as described: it is the merchandise value of the requested
      units still unrefunded, taken as the listed unit price of their line times the requested units still unrefunded, plus
      their shipping portion, taken as the order's whole shipping charge. The guarantee room for a new claim is the program's
      guarantee maximum per order, less every guarantee reimbursement already booked on the order, less the amounts claimed
      on the order's claims whose claim record shows no decision yet, a decision on a claim being shown on its claim record
      as well as on its decision entry. The amount claimed for an item not as described is limited to that guarantee room
      and never falls below zero, and only that final figure is rounded half up to the cent.
    params:
    - guarantee_max_per_order_usd
  inputs:
    history:
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_seller_refund
    - table: market_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: market_open_claim
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_redeem
    - category: gift
      table: gift_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: gift_refund_to_card
    - category: gift
      table: gift_events
      aggregate: latest
      field: gift_card_id
      filters:
        event_type: gift_load_value
    cross_category:
    - gift
- id: market_ext_missing_item_reimbursement
  base_policy_refs:
  - market_guarantee_decision
  overwrite:
  - base_policy: market_guarantee_decision
    superseded_clause: >-
      A granted claim reimburses the price paid for the affected items plus their shipping, less everything the seller already
      refunded on them, capped at guarantee_max_per_order_usd per order across all claims on the order, rounded half up
      to the cent and paid to the original payment.
    replaced_by: >-
      For a not-received claim within this policy's scope, and only for such a claim, the granted reimbursement is the missing-item
      reimbursement this policy fixes, paid to the external card the order was paid with; a return-not-refunded claim or
      a seller-unresponsive claim keeps the figure its own policy fixes, a claim of whose claimed units the seller has refunded
      every one is denied as seller-resolved as the base rule says, and every other granted claim, including every claim
      on an order paid with a Northgate Card, still reimburses the price paid for the affected items plus their shipping,
      less everything the seller already refunded on them, capped at the per-order maximum across all claims on the order,
      rounded half up to the cent and paid to the original payment.
  trigger: state_due
  subject:
  - market_decide_claim
  - market_guarantee_reimburse
  computes: amount_reimbursed_usd
  target_tool: grant_missing_item_claim_35c21a00
  params:
    promo_qualifying_total_usd: 1000.0
  rule: >-
    This policy fixes the missing-item reimbursement, the amount Northgate pays when it grants a not-received guarantee
    claim; the claim handled is the order's most recent not-received claim whose claim record shows no decision yet (where
    two such entries share a date, the one recorded first counts), and its claimed line, the units it records and its claimed
    amount are the ones that claim records. The policy applies only where the order is of a seller program other than Fulfilled
    by Northgate, was paid with an external card and carries no more than ten lines, the claimed line carries no return
    request, and the order carries exactly one not-received claim whose claim record shows no decision, and at least one
    claimed unit is still unrefunded; elsewhere it fixes nothing, its figure is zero and the base rule stands: "A granted
    claim reimburses the price paid for the affected items plus their shipping, less everything the seller already refunded
    on them, capped at guarantee_max_per_order_usd per order across all claims on the order, rounded half up to the cent
    and paid to the original payment." Northgate decides such a claim once the seller's response period on it has run out.
    The claimed line's set price per unit is its line amount divided by the units bought on it; the missing units still
    unrefunded are the units the claim records less the units already refunded on the line, unit refund entries being counted
    by the units they refund, and the price paid for the missing units still unrefunded is that set price per unit times
    the missing units still unrefunded. The order's merchandise total is the sum of its line amounts and the order's units
    are the units bought across its lines. Standard method for the missing-item reimbursement: it is the merchandise value
    of the missing units still unrefunded, taken as the listed unit price of their line times the missing units still unrefunded,
    plus their shipping portion, taken as the order's whole shipping charge. The guarantee room for a not-received claim
    is the program's guarantee maximum per order, less every guarantee reimbursement already booked on the order, less the
    amounts claimed on the order's other claims whose claim record shows no decision yet, a decision on a claim being shown
    on its claim record as well as on its decision entry. The missing-item reimbursement is limited to that guarantee room
    and never falls below zero, and only that final figure is rounded half up to the cent. Each rule that follows adds to
    or takes from the missing-item reimbursement, as that rule itself states, before the limit to the guarantee room is
    applied. The merchandise value of the missing units still unrefunded in the missing-item reimbursement depends on how
    the line was priced and what was already refunded on it: where the line is set-priced, that is its line amount is below
    its listed unit price times the units bought, and it carries unit refunds on fewer units than were bought, it is what
    remains of the line amount after the listed unit price of every unit already refunded on it, divided by the units not
    yet refunded, times the missing units still unrefunded; where the line is set-priced and carries no unit refund, or
    unit refunds on every unit bought, it is the price paid for the missing units still unrefunded; on a line that is not
    set-priced it is the listed unit price times the missing units still unrefunded. The partial-refund credit taken from
    the missing-item reimbursement follows the seller's partial refunds recorded on that line, the units of the claimed
    line with the buyer being the units bought on it less the units asked back on it by change-of-mind return requests:
    where the line carries partial refunds and the units of the claimed line with the buyer are more than zero, the credit
    is those partial refunds times the missing units still unrefunded divided by the units bought on the line; where the
    line carries partial refunds and no unit remains among the units of the claimed line with the buyer, the credit is the
    whole of those partial refunds; otherwise there is no credit. The promotional recovery taken from the missing-item reimbursement
    follows Northgate's marketplace promotion, under which an order whose merchandise total reaches promo_qualifying_total_usd
    earns a Northgate Promotional Gift Card whose initial load names that order, and the value already spent from that card,
    that is its redemptions less any refunds credited back to it, is recovered from the refunds of that order's merchandise,
    whether by a seller refund or by a guarantee reimbursement, in proportion to the merchandise refunded over the order's
    merchandise total, except that a refund leaving the merchandise kept on the order below promo_qualifying_total_usd recovers
    the whole remaining spent value, that is the value spent less what the order's earlier refunds recovered under this
    sentence, and a refund made when the merchandise kept on the order was already below promo_qualifying_total_usd recovers
    nothing, so that no more than the value spent is ever recovered on the order, value not yet spent being voided on the
    card only under the gift card rules; the missing-item reimbursement counts as the refund of the missing units still
    unrefunded, made after every other refund of the order's merchandise; the merchandise refunded on the order is, line
    by line, the line's set price per unit times the greater of the units its unit refunds and cancellation refunds refund
    and the units of its claims whose claim record shows them granted; the merchandise kept before the refund is the order's
    merchandise total less the merchandise refunded on the order other than on the missing units still unrefunded, and the
    merchandise kept after the refund is that amount less the price paid for the missing units still unrefunded: where the
    order earned such a card, value has been spent from it, the merchandise kept before the refund is at or above promo_qualifying_total_usd
    and the merchandise kept after the refund is below it, the recovery is the whole remaining spent value, which is the
    value spent times the merchandise kept before the refund divided by the order's merchandise total; where the order earned
    such a card, value has been spent from it and the merchandise kept after the refund is at or above promo_qualifying_total_usd,
    the recovery is the value spent times the price paid for the missing units still unrefunded divided by the order's merchandise
    total; otherwise, including where the merchandise kept before the refund is already below promo_qualifying_total_usd,
    there is no promotional recovery. The shipping portion added to the missing-item reimbursement depends on the seller
    program and on the shipping charged: on a Freight Seller order that was charged shipping, it is the order's shipping
    charge divided by the order's units times the missing units still unrefunded; on an order of any other seller program
    that was charged shipping, it is the order's shipping charge times the price paid for the missing units still unrefunded
    divided by the order's merchandise total; where no shipping was charged there is no shipping portion. The shipping refunds
    set off are the shipping refunds recorded on the order, shared out the way the shipping charge is: on a Freight Seller
    order with shipping refunds, the missing-item reimbursement gives up those refunds divided by the order's units times
    the missing units still unrefunded; on an order of any other seller program with shipping refunds, it gives up those
    refunds times the price paid for the missing units still unrefunded divided by the order's merchandise total; where
    no shipping refund is recorded nothing is given up. For a not-received claim within this policy's scope, and only for
    such a claim, the granted reimbursement is the missing-item reimbursement this policy fixes, paid to the external card
    the order was paid with; a return-not-refunded claim or a seller-unresponsive claim keeps the figure its own policy
    fixes, a claim of whose claimed units the seller has refunded every one is denied as seller-resolved as the base rule
    says, and every other granted claim, including every claim on an order paid with a Northgate Card, still reimburses
    the price paid for the affected items plus their shipping, less everything the seller already refunded on them, capped
    at the per-order maximum across all claims on the order, rounded half up to the cent and paid to the original payment.
    Northgate decides such a claim by granting it with the missing-item reimbursement this policy fixes; where the missing-item
    reimbursement comes to zero and the guarantee reimbursements already booked on the order reach the program's guarantee
    maximum per order, Northgate decides the claim as not covered and books no reimbursement; where the missing-item reimbursement
    comes to zero otherwise, the claim is not decided in this conversation and is referred to a human representative.
  prerequisite: []
  cross_category:
  - category: gift
    as: history
    reads:
    - gift_events.gift_card_id
    - gift_events.amount_usd
    - variant_name
    note: the promotional-recovery factor reads the promotional card the order earned and its redemptions
  compute:
  - n_claim: >-
      LATEST('market_events', 'market_event_id', event_type='market_open_claim', claim_reason='not_received', claim_decision='not_applicable')
  - n_claimed: LATEST('market_events', 'amount_usd', market_event_id=n_claim) or 0
  - n_line: LATEST('market_events', 'original_event_id', market_event_id=n_claim)
  - n_recorded_units: LATEST('market_events', 'quantity', market_event_id=n_claim) or 0
  - n_qty: LATEST('market_events', 'quantity', market_event_id=n_line) or 1
  - n_unit: LATEST('market_events', 'unit_price_usd', market_event_id=n_line) or 0
  - n_amount: LATEST('market_events', 'amount_usd', market_event_id=n_line) or 0
  - n_refunded: >-
      SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='return_refund', original_event_id=n_line)
  - n_units: MX(0, n_recorded_units - n_refunded)
  - n_paid: n_units * n_amount / n_qty
  - n_merch_total: SUM('market_events', 'amount_usd', event_type='market_post_line')
  - n_order_units: SUM('market_events', 'quantity', event_type='market_post_line')
  - n_line_requests: COUNT('market_events', event_type='market_request_return', original_event_id=n_line)
  - n_undecided: >-
      COUNT('market_events', event_type='market_open_claim', claim_reason='not_received', claim_decision='not_applicable')
  - n_in_scope: >-
      F('variant_name') != 'Northgate Marketplace Fulfilled by Northgate' and F('payment_method_type') == 'external_card'
      and COUNT('market_events', event_type='market_post_line') <= 10 and n_line_requests == 0 and n_undecided == 1
  - n_merch: >-
      (n_amount - n_unit * n_refunded) / (n_qty - n_refunded) * n_units if (n_amount < n_unit * n_qty and n_refunded > 0
      and n_refunded < n_qty) else (n_paid if n_amount < n_unit * n_qty else n_units * (LATEST('market_events', 'unit_price_usd',
      market_event_id=n_line) or 0))
  - n_kept: >-
      n_qty - SUM('market_events', 'quantity', event_type='market_request_return', original_event_id=n_line, return_reason='changed_mind')
  - n_partials: >-
      SUM('market_events', 'amount_usd', event_type='market_seller_refund', refund_type='partial_refund', original_event_id=n_line)
  - n_partial: >-
      n_partials * n_units / n_qty if (n_partials > 0 and n_kept > 0) else (n_partials if (n_partials > 0 and n_kept <=
      0) else 0)
  - n_promo_card: XLATEST('gift', 'gift_events', 'gift_card_id', event_type='gift_load_value', source_record_id=HID)
  - n_promo_kind: CFIELD('gift', 'variant_name', gift_card_id=n_promo_card)
  - n_promo_spent: >-
      XSUM('gift', 'gift_events', 'amount_usd', event_type='gift_redeem', gift_card_id=n_promo_card) - XSUM('gift', 'gift_events',
      'amount_usd', event_type='gift_refund_to_card', gift_card_id=n_promo_card)
  - n_merch_refunded: >-
      (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=1)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=1)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=1)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=1)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=1))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=2)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=2)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=2)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=2)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=2))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=3)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=3)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
      line_number=3)) + SUM('market_events', 'quantity', event_type='market_seller_refund', refund_type='cancellation',
      original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line', line_number=3)), SUM('market_events',
      'quantity', event_type='market_open_claim', claim_decision='granted', original_event_id=LATEST('market_events', 'market_event_id',
      event_type='market_post_line', line_number=3))) + (LATEST('market_events', 'amount_usd', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=4)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=4)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
      refund_type='return_refund', original_event_id=LATEST('market_events', 'market_event_id', event_type='market_post_line',
