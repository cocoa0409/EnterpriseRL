      the claimed units is that set price per unit times the claimed units; the units of the claimed line still held are
      the units bought on it less the units asked back on it by change-of-mind return requests.
    h_kept: >-
      The claimed line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the claimed units is that set price per unit times the claimed units; the units of the claimed line still held are
      the units bought on it less the units asked back on it by change-of-mind return requests.
    h_unit_refunds: >-
      The refunds already received on the claimed units are every unit refund entry recorded on the line, an entry that
      refunds no units not being a unit refund; they are taken from the return-refund reimbursement, and the units of the
      line refunded are counted the same way.
    h_refunded_qty: >-
      The refunds already received on the claimed units are every unit refund entry recorded on the line, an entry that
      refunds no units not being a unit refund; they are taken from the return-refund reimbursement, and the units of the
      line refunded are counted the same way.
    h_merch_total: >-
      The order's merchandise total is the sum of its line amounts and the order's units are the units bought across its
      lines.
    h_order_units: >-
      The order's merchandise total is the sum of its line amounts and the order's units are the units bought across its
      lines.
    h_restock: >-
      The restocking the seller may keep, taken from the return-refund reimbursement, is a percentage of the price paid
      for the claimed units following Northgate's changed-mind restocking schedule: where the request gives the reason changed_mind
      and was made no more than early_return_days calendar days after the order's delivered date, it is half the program's
      maximum restocking percentage; where the reason is changed_mind and the request was made later, it is the program's
      maximum restocking percentage; where the reason is any other, it is zero.
    h_room: >-
      The guarantee room for a return-not-refunded claim is the program's guarantee maximum per order, less every guarantee
      reimbursement already booked on the order, less the amounts claimed on the order's other claims whose claim record
      shows no decision yet, a decision on a claim being shown on its claim record as well as on its decision entry.
    h_owed: >-
      Each rule that follows adds to or takes from the return-refund reimbursement, as that rule itself states, before the
      limit to the guarantee room is applied.
    result: >-
      The return-refund reimbursement is limited to that guarantee room and never falls below zero, and only that final
      figure is rounded half up to the cent.
    h_merch: >-
      The merchandise value of the claimed units in the return-refund reimbursement depends on how the line was priced:
      where the line is set-priced, that is its line amount is below its listed unit price times the units bought, and the
      request gives the reason changed_mind, it is the price paid for the claimed units less the set saving per unit (listed
      unit price less set price per unit) times the units of the claimed line still held times the claimed units divided
      by the units asked back on the line for a change of mind; where the line is set-priced and the reason is any other,
      it is the price paid for the claimed units; on a line that is not set-priced it is the listed unit price times the
      claimed units.
    h_restock_rate: >-
      The restocking the seller may keep, taken from the return-refund reimbursement, is a percentage of the price paid
      for the claimed units following Northgate's changed-mind restocking schedule: where the request gives the reason changed_mind
      and was made no more than early_return_days calendar days after the order's delivered date, it is half the program's
      maximum restocking percentage; where the reason is changed_mind and the request was made later, it is the program's
      maximum restocking percentage; where the reason is any other, it is zero.
    h_partials: >-
      The partial-refund credit taken from the return-refund reimbursement follows the seller's partial refunds recorded
      on that line: where the line carries partial refunds and the units of the claimed line still held are more than zero,
      the credit is those partial refunds times the claimed units divided by the units bought on the line; where the line
      carries partial refunds and no unit remains among the units of the claimed line still held, the credit is the whole
      of those partial refunds; otherwise there is no credit.
    h_partial: >-
      The partial-refund credit taken from the return-refund reimbursement follows the seller's partial refunds recorded
      on that line: where the line carries partial refunds and the units of the claimed line still held are more than zero,
      the credit is those partial refunds times the claimed units divided by the units bought on the line; where the line
      carries partial refunds and no unit remains among the units of the claimed line still held, the credit is the whole
      of those partial refunds; otherwise there is no credit.
    h_promo_card: >-
      The promotional recovery taken from the return-refund reimbursement follows Northgate's marketplace promotion, under
      which an order whose merchandise total reaches promo_qualifying_total_usd earns a Northgate Promotional Gift Card
      whose initial load names that order, and the value already spent from that card, that is its redemptions less any
      refunds credited back to it, is recovered from the refunds of that order's merchandise, whether by a seller refund
      or by a guarantee reimbursement, in proportion to the merchandise refunded over the order's merchandise total, except
      that a refund leaving the merchandise kept on the order below promo_qualifying_total_usd recovers the whole remaining
      spent value, that is the value spent less what the order's earlier refunds recovered under this sentence, and a refund
      made when the merchandise kept on the order was already below promo_qualifying_total_usd recovers nothing, so that
      no more than the value spent is ever recovered on the order, value not yet spent being voided on the card only under
      the gift card rules; the return-refund reimbursement counts as the refund of the claimed units, made after every other
      refund of the order's merchandise; the merchandise refunded on the order is, line by line, the line's set price per
      unit times the greater of the units its unit refunds and cancellation refunds refund and the units of its claims whose
      claim record shows them granted; the merchandise kept before the refund is the order's merchandise total less the
      merchandise refunded on the order other than on the claimed units, and the merchandise kept after the refund is that
      amount less the price paid for the claimed units; where the order earned such a card, value has been spent from it,
      the merchandise kept on the order, that is its merchandise total less the merchandise refunded on it, is already below
      promo_qualifying_total_usd and some of the claimed units have already been refunded, this policy fixes the return-refund
      reimbursement only if no seller refund and no guarantee reimbursement recorded on the order is dated after the most
      recent return refund on the line of the claimed units, and otherwise it fixes nothing, its figure is zero and the
      base rule quoted above stands: where the order earned such a card, value has been spent from it, the merchandise kept
      before the refund is at or above promo_qualifying_total_usd and the merchandise kept after the refund is below it,
      the recovery is the whole remaining spent value, which is the value spent times the merchandise kept before the refund
      divided by the order's merchandise total; where the order earned such a card, value has been spent from it and the
      merchandise kept after the refund is at or above promo_qualifying_total_usd, the recovery is the value spent times
      the price paid for the claimed units divided by the order's merchandise total; otherwise, including where the merchandise
      kept before the refund is already below promo_qualifying_total_usd, there is no promotional recovery.
