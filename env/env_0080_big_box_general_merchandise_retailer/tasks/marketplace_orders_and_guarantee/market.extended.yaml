      the requested units is that set price per unit times the requested units; the units of the requested line kept are
      the units bought on it less the units asked back on it by change-of-mind return requests.
    u_kept: >-
      The requested line's set price per unit is its line amount divided by the units bought on it, and the price paid for
      the requested units is that set price per unit times the requested units; the units of the requested line kept are
      the units bought on it less the units asked back on it by change-of-mind return requests.
    u_unit_refunds: >-
      The refunds already received on the requested units are every unit refund entry recorded on the line, an entry that
      refunds no units not being a unit refund; they are taken from the amount claimed for an unrefunded return, and the
      units of the line refunded are counted the same way.
    u_refunded_qty: >-
      The refunds already received on the requested units are every unit refund entry recorded on the line, an entry that
      refunds no units not being a unit refund; they are taken from the amount claimed for an unrefunded return, and the
      units of the line refunded are counted the same way.
    u_merch_total: >-
      The order's merchandise total is the sum of its line amounts and the order's units are the units bought across its
      lines.
    u_order_units: >-
      The order's merchandise total is the sum of its line amounts and the order's units are the units bought across its
      lines.
    u_restock: >-
      The restocking allowance, taken from the amount claimed for an unrefunded return, is a percentage of the price paid
      for the requested units following Northgate's changed-mind restocking schedule: where the request gives the reason
      changed_mind and was made no more than early_return_days calendar days after the order's delivered date, it is half
      the program's maximum restocking percentage; where the reason is changed_mind and the request was made later, it is
      the program's maximum restocking percentage; where the reason is any other, it is zero.
    u_room: >-
      The guarantee room for a new claim is the program's guarantee maximum per order, less every guarantee reimbursement
      already booked on the order, less the amounts claimed on the order's claims whose claim record shows no decision yet,
      a decision on a claim being shown on its claim record as well as on its decision entry.
    u_owed: >-
      Each rule that follows adds to or takes from the amount claimed for an unrefunded return, as that rule itself states,
      before the limit to the guarantee room is applied.
    result: >-
      The amount claimed for an unrefunded return is limited to that guarantee room and never falls below zero, and only
      that final figure is rounded half up to the cent.
    u_merch: >-
      The merchandise value of the requested units in the amount claimed for an unrefunded return depends on how the line
      was priced: where the line is set-priced, that is its line amount is below its listed unit price times the units bought,
      and the request gives the reason changed_mind, it is the price paid for the requested units less the set saving per
      unit (listed unit price less set price per unit) times the units of the requested line kept times the requested units
      divided by the units asked back on the line for a change of mind; where the line is set-priced and the reason is any
      other, it is the price paid for the requested units; on a line that is not set-priced it is the listed unit price
      times the requested units.
    u_restock_rate: >-
      The restocking allowance, taken from the amount claimed for an unrefunded return, is a percentage of the price paid
      for the requested units following Northgate's changed-mind restocking schedule: where the request gives the reason
      changed_mind and was made no more than early_return_days calendar days after the order's delivered date, it is half
      the program's maximum restocking percentage; where the reason is changed_mind and the request was made later, it is
      the program's maximum restocking percentage; where the reason is any other, it is zero.
    u_partials: >-
      The partial-refund credit taken from the amount claimed for an unrefunded return follows the seller's partial refunds
      recorded on that line: where the line carries partial refunds and the units of the requested line kept are more than
      zero, the credit is those partial refunds times the requested units divided by the units bought on the line; where
      the line carries partial refunds and no unit remains among the units of the requested line kept, the credit is the
      whole of those partial refunds; otherwise there is no credit.
    u_partial: >-
      The partial-refund credit taken from the amount claimed for an unrefunded return follows the seller's partial refunds
      recorded on that line: where the line carries partial refunds and the units of the requested line kept are more than
      zero, the credit is those partial refunds times the requested units divided by the units bought on the line; where
      the line carries partial refunds and no unit remains among the units of the requested line kept, the credit is the
      whole of those partial refunds; otherwise there is no credit.
    u_promo_card: >-
      The promotional recovery taken from the amount claimed for an unrefunded return follows Northgate's marketplace promotion,
      under which an order whose merchandise total reaches promo_qualifying_total_usd earns a Northgate Promotional Gift
      Card whose initial load names that order, and the value already spent from that card, that is its redemptions less
      any refunds credited back to it, is recovered from the refunds of that order's merchandise, whether by a seller refund
      or by a guarantee reimbursement, in proportion to the merchandise refunded over the order's merchandise total, except
      that a refund leaving the merchandise kept on the order below promo_qualifying_total_usd recovers the whole remaining
      spent value, that is the value spent less what the order's earlier refunds recovered under this sentence, and a refund
      made when the merchandise kept on the order was already below promo_qualifying_total_usd recovers nothing, so that
      no more than the value spent is ever recovered on the order, value not yet spent being voided on the card only under
      the gift card rules; the amount claimed for an unrefunded return counts as the refund of the requested units, made
      after every other refund of the order's merchandise; the merchandise refunded on the order is, line by line, the line's
      set price per unit times the greater of the units its unit refunds and cancellation refunds refund and the units of
      its claims whose claim record shows them granted; the merchandise kept before the refund is the order's merchandise
      total less the merchandise refunded on the order other than on the requested units, and the merchandise kept after
      the refund is that amount less the price paid for the requested units; where the order earned such a card, value has
      been spent from it, the merchandise kept on the order, that is its merchandise total less the merchandise refunded
      on it, is already below promo_qualifying_total_usd and some of the requested units have already been refunded, this
      policy fixes the amount claimed for an unrefunded return only if no seller refund and no guarantee reimbursement recorded
      on the order is dated after the most recent return refund on the line of the requested units, and otherwise it fixes
      nothing, its figure is zero and the base rule quoted above stands: where the order earned such a card, value has been
      spent from it, the merchandise kept before the refund is at or above promo_qualifying_total_usd and the merchandise
      kept after the refund is below it, the recovery is the whole remaining spent value, which is the value spent times
      the merchandise kept before the refund divided by the order's merchandise total; where the order earned such a card,
      value has been spent from it and the merchandise kept after the refund is at or above promo_qualifying_total_usd,
      the recovery is the value spent times the price paid for the requested units divided by the order's merchandise total;
      otherwise, including where the merchandise kept before the refund is already below promo_qualifying_total_usd, there
      is no promotional recovery.
