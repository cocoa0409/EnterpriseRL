    g_qty: >-
      The claimed line's set price per unit is its line amount divided by the units bought on it; the claimed units still
      unrefunded are the units the claim records less the units already refunded on the line, unit refund entries being
      counted by the units they refund, and the price paid for the claimed units still unrefunded is that set price per
      unit times the claimed units still unrefunded.
