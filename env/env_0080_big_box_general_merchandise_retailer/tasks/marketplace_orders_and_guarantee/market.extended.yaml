      unrefunded are the units the claim records less the units already refunded on the line, unit refund entries being
      counted by the units they refund, and the price paid for the missing units still unrefunded is that set price per
      unit times the missing units still unrefunded.
    n_paid: >-
      The claimed line's set price per unit is its line amount divided by the units bought on it; the missing units still
      unrefunded are the units the claim records less the units already refunded on the line, unit refund entries being
      counted by the units they refund, and the price paid for the missing units still unrefunded is that set price per
      unit times the missing units still unrefunded.
    n_merch_total: >-
      The order's merchandise total is the sum of its line amounts and the order's units are the units bought across its
      lines.
    n_order_units: >-
      The order's merchandise total is the sum of its line amounts and the order's units are the units bought across its
      lines.
    n_room: >-
      The guarantee room for a not-received claim is the program's guarantee maximum per order, less every guarantee reimbursement
      already booked on the order, less the amounts claimed on the order's other claims whose claim record shows no decision
      yet, a decision on a claim being shown on its claim record as well as on its decision entry.
    n_owed: >-
      Each rule that follows adds to or takes from the missing-item reimbursement, as that rule itself states, before the
      limit to the guarantee room is applied.
    result: >-
      The missing-item reimbursement is limited to that guarantee room and never falls below zero, and only that final figure
      is rounded half up to the cent.
    n_merch: >-
      The merchandise value of the missing units still unrefunded in the missing-item reimbursement depends on how the line
      was priced and what was already refunded on it: where the line is set-priced, that is its line amount is below its
      listed unit price times the units bought, and it carries unit refunds on fewer units than were bought, it is what
      remains of the line amount after the listed unit price of every unit already refunded on it, divided by the units
      not yet refunded, times the missing units still unrefunded; where the line is set-priced and carries no unit refund,
      or unit refunds on every unit bought, it is the price paid for the missing units still unrefunded; on a line that
      is not set-priced it is the listed unit price times the missing units still unrefunded.
    n_kept: >-
      The partial-refund credit taken from the missing-item reimbursement follows the seller's partial refunds recorded
      on that line, the units of the claimed line with the buyer being the units bought on it less the units asked back
      on it by change-of-mind return requests: where the line carries partial refunds and the units of the claimed line
      with the buyer are more than zero, the credit is those partial refunds times the missing units still unrefunded divided
      by the units bought on the line; where the line carries partial refunds and no unit remains among the units of the
      claimed line with the buyer, the credit is the whole of those partial refunds; otherwise there is no credit.
    n_partials: >-
      The partial-refund credit taken from the missing-item reimbursement follows the seller's partial refunds recorded
      on that line, the units of the claimed line with the buyer being the units bought on it less the units asked back
      on it by change-of-mind return requests: where the line carries partial refunds and the units of the claimed line
      with the buyer are more than zero, the credit is those partial refunds times the missing units still unrefunded divided
      by the units bought on the line; where the line carries partial refunds and no unit remains among the units of the
      claimed line with the buyer, the credit is the whole of those partial refunds; otherwise there is no credit.
    n_partial: >-
      The partial-refund credit taken from the missing-item reimbursement follows the seller's partial refunds recorded
      on that line, the units of the claimed line with the buyer being the units bought on it less the units asked back
      on it by change-of-mind return requests: where the line carries partial refunds and the units of the claimed line
      with the buyer are more than zero, the credit is those partial refunds times the missing units still unrefunded divided
      by the units bought on the line; where the line carries partial refunds and no unit remains among the units of the
      claimed line with the buyer, the credit is the whole of those partial refunds; otherwise there is no credit.
    n_promo_card: >-
      The promotional recovery taken from the missing-item reimbursement follows Northgate's marketplace promotion, under
      which an order whose merchandise total reaches promo_qualifying_total_usd earns a Northgate Promotional Gift Card
      whose initial load names that order, and the value already spent from that card, that is its redemptions less any
      refunds credited back to it, is recovered from the refunds of that order's merchandise, whether by a seller refund
      or by a guarantee reimbursement, in proportion to the merchandise refunded over the order's merchandise total, except
      that a refund leaving the merchandise kept on the order below promo_qualifying_total_usd recovers the whole remaining
      spent value, that is the value spent less what the order's earlier refunds recovered under this sentence, and a refund
      made when the merchandise kept on the order was already below promo_qualifying_total_usd recovers nothing, so that
      no more than the value spent is ever recovered on the order, value not yet spent being voided on the card only under
      the gift card rules; the missing-item reimbursement counts as the refund of the missing units still unrefunded, made
      after every other refund of the order's merchandise; the merchandise refunded on the order is, line by line, the line's
      set price per unit times the greater of the units its unit refunds and cancellation refunds refund and the units of
      its claims whose claim record shows them granted; the merchandise kept before the refund is the order's merchandise
      total less the merchandise refunded on the order other than on the missing units still unrefunded, and the merchandise
      kept after the refund is that amount less the price paid for the missing units still unrefunded: where the order earned
      such a card, value has been spent from it, the merchandise kept before the refund is at or above promo_qualifying_total_usd
      and the merchandise kept after the refund is below it, the recovery is the whole remaining spent value, which is the
      value spent times the merchandise kept before the refund divided by the order's merchandise total; where the order
      earned such a card, value has been spent from it and the merchandise kept after the refund is at or above promo_qualifying_total_usd,
      the recovery is the value spent times the price paid for the missing units still unrefunded divided by the order's
      merchandise total; otherwise, including where the merchandise kept before the refund is already below promo_qualifying_total_usd,
      there is no promotional recovery.
