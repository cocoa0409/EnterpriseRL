      'market_event_id', event_type='market_post_line', line_number=4)) or 0) / (LATEST('market_events', 'quantity', market_event_id=LATEST('market_events',
      'market_event_id', event_type='market_post_line', line_number=4)) or 1) * MX(SUM('market_events', 'quantity', event_type='market_seller_refund',
