    g_ship_refunds: >-
      The shipping refunds set off are the shipping refunds recorded on the order, shared out the way the shipping charge
      is: on a Freight Seller order with shipping refunds, the unresponsive-seller reimbursement gives up those refunds
      divided by the order's units times the claimed units still unrefunded; on an order of any other seller program with
      shipping refunds, it gives up those refunds times the price paid for the claimed units still unrefunded divided by
      the order's merchandise total; where no shipping refund is recorded nothing is given up.
