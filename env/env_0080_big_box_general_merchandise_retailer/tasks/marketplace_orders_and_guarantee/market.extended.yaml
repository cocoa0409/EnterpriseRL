    g_promo_card: >-
      The promotional recovery taken from the unresponsive-seller reimbursement follows Northgate's marketplace promotion,
      under which an order whose merchandise total reaches promo_qualifying_total_usd earns a Northgate Promotional Gift
      Card whose initial load names that order, and the value already spent from that card, that is its redemptions less
      any refunds credited back to it, is recovered from the refunds of that order's merchandise, whether by a seller refund
      or by a guarantee reimbursement, in proportion to the merchandise refunded over the order's merchandise total, except
      that a refund leaving the merchandise kept on the order below promo_qualifying_total_usd recovers the whole remaining
      spent value, that is the value spent less what the order's earlier refunds recovered under this sentence, and a refund
      made when the merchandise kept on the order was already below promo_qualifying_total_usd recovers nothing, so that
      no more than the value spent is ever recovered on the order, value not yet spent being voided on the card only under
      the gift card rules; the unresponsive-seller reimbursement counts as the refund of the claimed units still unrefunded,
      made after every other refund of the order's merchandise; the merchandise refunded on the order is, line by line,
      the line's set price per unit times the greater of the units its unit refunds and cancellation refunds refund and
      the units of its claims whose claim record shows them granted; the merchandise kept before the refund is the order's
      merchandise total less the merchandise refunded on the order other than on the claimed units still unrefunded, and
      the merchandise kept after the refund is that amount less the price paid for the claimed units still unrefunded: where
      the order earned such a card, value has been spent from it, the merchandise kept before the refund is at or above
      promo_qualifying_total_usd and the merchandise kept after the refund is below it, the recovery is the whole remaining
      spent value, which is the value spent times the merchandise kept before the refund divided by the order's merchandise
      total; where the order earned such a card, value has been spent from it and the merchandise kept after the refund
      is at or above promo_qualifying_total_usd, the recovery is the value spent times the price paid for the claimed units
      still unrefunded divided by the order's merchandise total; otherwise, including where the merchandise kept before
      the refund is already below promo_qualifying_total_usd, there is no promotional recovery.
