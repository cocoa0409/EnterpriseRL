  compute_basis:
    h_claim: >-
      This policy fixes the return-refund reimbursement, the amount Northgate pays when it grants a return-not-refunded
      guarantee claim; the claim handled is the order's most recent return-not-refunded claim whose claim record shows no
      decision yet (where two such entries share a date, the one recorded first counts), and its claimed line, claimed units
      and claimed amount are the ones that claim records. The policy applies only where the order is of a seller program
      other than Fulfilled by Northgate, was paid with an external card and carries no more than ten lines, the claimed
      line carries exactly one return request, and the order carries exactly one return-not-refunded claim whose claim record
      shows no decision, and the seller has not refunded every claimed unit; elsewhere it fixes nothing, its figure is zero
      and the base rule stands: "A granted claim reimburses the price paid for the affected items plus their shipping, less
      everything the seller already refunded on them, capped at guarantee_max_per_order_usd per order across all claims
      on the order, rounded half up to the cent and paid to the original payment." Northgate decides such a claim once the
      seller's response period on it has run out.
