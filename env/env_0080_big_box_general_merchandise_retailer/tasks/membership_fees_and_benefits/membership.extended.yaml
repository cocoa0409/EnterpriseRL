    compute:
      - order_ref: "XLATEST('order', 'order_holdings', 'order_id', date_field='fulfilled_date', status='fulfilled')"
      - fulfilled_on: "XLATEST('order', 'order_holdings', 'fulfilled_date', date_field='fulfilled_date', status='fulfilled') or '0000-01-01'"
      - line_ref: "XLATEST('order', 'order_events', 'order_event_id', date_field='event_date', event_type='order_post_line', order_id=order_ref)"
      - line_net: "XSUM('order', 'order_events', 'amount_usd', order_event_id=line_ref)"
      - line_category: "XLATEST('order', 'order_events', 'item_category', order_event_id=line_ref)"
      - excluded_or_closed: "line_category == 'gift_cards' or line_category == 'prescriptions' or line_category == 'alcohol' or (F('canceled_date') or '9999-12-31') <= fulfilled_on"
      - order_program: "XLATEST('order', 'order_holdings', 'variant_name', date_field='fulfilled_date', order_id=order_ref)"
      - program_pts: "K('program_points_high') if ((order_program == 'Northgate Same-Day Delivery' or order_program == 'Northgate Drive Up') and F('variant_name') != 'Northgate Rewards') else (K('program_points_mid') if ((order_program == 'Northgate Ship to Home' or order_program == 'Northgate Order Pickup') and F('variant_name') != 'Northgate Rewards') else 0)"
      - tenure_months: "MONTHS(F('term_start_date') or fulfilled_on, fulfilled_on)"
      - tenure_pts: "K('tenure_points_high') if tenure_months >= K('tenure_months_high') else (K('tenure_points_mid') if tenure_months >= K('tenure_months_mid') else 0)"
      - returned_merch: "XSUM('order', 'order_events', 'amount_usd', event_type='order_return_line', original_event_id=line_ref)"
      - units_bought: "XSUM('order', 'order_events', 'quantity', order_event_id=line_ref)"
      - units_refunded: "XSUM('order', 'order_events', 'quantity', event_type='order_refund_charge', original_event_id=line_ref)"
      - earning_basis: "RND(line_net * (units_bought - units_refunded) / units_bought + 0.000000001, 2) if (units_refunded > 0 and returned_merch == 0) else (line_net - returned_merch if (returned_merch > 0 and units_refunded == 0) else (RND(line_net * (units_bought - units_refunded) / units_bought + 0.000000001, 2) - returned_merch if (units_refunded > 0 and returned_merch > 0) else line_net))"
      - bonus_category: "XLATEST('order', 'order_events', 'item_category', order_event_id=line_ref)"
      - category_pts: "K('category_points_high') if (bonus_category == 'grocery' or bonus_category == 'household_essentials') else (K('category_points_mid') if (bonus_category == 'beauty' or bonus_category == 'apparel') else 0)"
      - line_tender: "XLATEST('order', 'order_events', 'payment_method_type', order_event_id=line_ref)"
      - paying_card_tier: "CFIELD('card', 'variant_name', card_account_id=XLATEST('order', 'order_events', 'card_account_id', order_event_id=line_ref), status='active')"
      - card_pts: "K('card_points_high') if (line_tender == 'northgate_card' and (paying_card_tier == 'Northgate Store Card' or paying_card_tier == 'Northgate Mastercard' or paying_card_tier == 'Northgate World Mastercard')) else (K('card_points_mid') if (line_tender == 'northgate_card' and paying_card_tier == 'Northgate Secured Card') else 0)"
      - earning_pct: "P('rewards_earn_rate_pct') + program_pts + tenure_pts + category_pts + card_pts"
      - result: "0 if (order_ref == None or excluded_or_closed) else RND(earning_basis * earning_pct / 100 + 0.000000001, 2)"
    compute_basis:
