    factors:
      - id: delivery_program_points
        effect: parameter
        decides: program_pts
        bindings: [order_program, program_pts]
        ladder:
          - when: "the line is on a Northgate Same-Day Delivery or Northgate Drive Up order and the membership is on a paid Northgate+ tier"
            value: "K('program_points_high')"
          - when: "the line is on a Northgate Ship to Home or Northgate Order Pickup order and the membership is on a paid Northgate+ tier"
            value: "K('program_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {program_pts: "0"}
        evidence: [cross_category, tier_param]
        cross_difficulty: order
      - id: tenure_points
        effect: parameter
        decides: tenure_pts
        bindings: [tenure_months, tenure_pts]
        ladder:
          - when: "the order's fulfilled date is tenure_months_high or more whole calendar months after the membership's term start date"
            value: "K('tenure_points_high')"
          - when: "the order's fulfilled date is tenure_months_mid to fewer than tenure_months_high whole calendar months after the term start date"
            value: "K('tenure_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {tenure_pts: "0"}
        evidence: [date]
        cross_difficulty: null
      - id: kept_units_basis
        effect: method
        decides: earning_basis
        bindings: [units_bought, units_refunded, returned_merch, earning_basis]
        ladder:
          - when: "units of the line were refunded without a return and none were returned"
            method: "the earning basis is the net amount times the units bought less the units refunded without a return, divided by the units bought, rounded half up to the cent"
          - when: "units of the line were returned and none were refunded without a return"
            method: "the earning basis is the net amount less the merchandise refunded on the returns"
          - when: "units of the line were both refunded without a return and returned"
            method: "the earning basis is the net amount times the units bought less the units refunded without a return, divided by the units bought, rounded half up to the cent, less the merchandise refunded on the returns"
          - when: "otherwise"
            method: "the earning basis is the net amount"
        baseline: {earning_basis: "line_net"}
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: category_points
        effect: parameter
        decides: category_pts
        bindings: [bonus_category, category_pts]
        ladder:
          - when: "the line is a grocery or household essentials line"
            value: "K('category_points_high')"
          - when: "the line is a beauty or apparel line"
            value: "K('category_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {category_pts: "0"}
        evidence: [cross_category]
        cross_difficulty: order
      - id: card_points
        effect: parameter
        decides: card_pts
        bindings: [line_tender, paying_card_tier, card_pts]
        ladder:
          - when: "the line was paid with a Northgate Card whose account is a Northgate Store Card, Northgate Mastercard or Northgate World Mastercard in active status"
            value: "K('card_points_high')"
          - when: "the line was paid with a Northgate Card whose account is a Northgate Secured Card in active status"
            value: "K('card_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {card_pts: "0"}
        evidence: [cross_category]
        cross_difficulty: card
    baseline:
      rule: >-
        The consumer earning is the line's earning basis times the earning percentage, divided by 100 and rounded half up
        to the cent, and it posts on the order's fulfilled date. The earning basis is the line's net amount, the amount
        paid for the line after item promotions and the Northgate Card discount, before tax, fees, gift cards and
        Northgate Cash. The earning percentage is the tier's rewards_earn_rate_pct.
      params: [rewards_earn_rate_pct]
    inputs:
      history:
        - {category: order, table: order_holdings, aggregate: latest, field: order_id, filters: {status: fulfilled}}
        - {category: order, table: order_events, aggregate: latest, field: order_event_id, filters: {event_type: order_post_line}}
        - {category: order, table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_refund_charge}}
        - {category: order, table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_return_line}}
      cross_category: [order, card]
  - id: membership_ext_consumer_return_reversal
    base_policy_refs: [membership_evt_cash_reverse]
    overwrite:
      - base_policy: membership_evt_cash_reverse
        superseded_clause: >-
          When a line that earned Northgate Cash is returned for a refund, the cash earned on it is reversed in proportion to
          the merchandise amount refunded: earned amount x refunded merchandise amount / the earning's basis_amount_usd, rounded
          half up to the cent, the full earned amount when the whole line is refunded.
        replaced_by: >-
          For the most recent return recorded on the member's Northgate orders, the one with the latest return date and,
          among returns of the same date, the one recorded first, when the member holds a Northgate Rewards, Northgate+
          Assist, Northgate+ Student, Northgate+ Monthly or Northgate+ Annual membership, and only for that return, the
          Northgate Cash reversed is worked out under this consumer return reversal schedule; the same return on a
          Northgate+ Business membership is worked out under the Business return reversal schedule and the most recent
          refund without a return made because an item was damaged on arrival or never received on the member's
          Northgate orders, the one with the latest refund date and, among refunds of one kind on that date, the one
          recorded first, and when a damaged-on-arrival refund and a never-received refund share that date, the
          damaged-on-arrival refund under the refund-without-return reversal schedule, and every return or refund that none of the consumer return, Business return and refund-without-return reversal schedules settles stays under the base reversal rule, which no schedule of this charter prices or posts, reversing the Cash
          earned on a line returned or refunded in proportion to the merchandise amount refunded, earned amount x
          refunded merchandise amount / the earning's basis_amount_usd, rounded half up to the cent, and the full earned
          amount when the whole line is refunded.
    trigger: state_due
    subject: [membership_cash_reverse]
    computes: amount_usd
    target_tool: reverse_member_return_cash_50b9758d
    params:
      reason_relief_high: 0.2
      reason_relief_mid: 0.1
      tenure_months_high: 24
      tenure_months_mid: 12
      tenure_relief_high: 0.1
      tenure_relief_mid: 0.05
      first_return_relief_high: 0.1
      first_return_relief_mid: 0.05
    rule: >-
      For the most recent return recorded on the member's Northgate orders, the one with the latest return date and,
      among returns of the same date, the one recorded first, when the member holds a Northgate Rewards, Northgate+
      Assist, Northgate+ Student, Northgate+ Monthly or Northgate+ Annual membership, and only for that return, the
      Northgate Cash reversed is worked out under this consumer return reversal schedule; the same return on a
      Northgate+ Business membership is worked out under the Business return reversal schedule and the most recent
      refund without a return made because an item was damaged on arrival or never received on the member's
      Northgate orders, the one with the latest refund date and, among refunds of one kind on that date, the one
      recorded first, and when a damaged-on-arrival refund and a never-received refund share that date, the
      damaged-on-arrival refund under the refund-without-return reversal schedule, and every return or refund that none of the consumer return, Business return and refund-without-return reversal schedules settles stays under the base reversal rule, which no schedule of this charter prices or posts, reversing the Cash
      earned on a line returned or refunded in proportion to the merchandise amount refunded, earned amount x
      refunded merchandise amount / the earning's basis_amount_usd, rounded half up to the cent, and the full earned
      amount when the whole line is refunded.
      The return this consumer schedule settles is the most recent return recorded on the member's Northgate orders,
      the one with the latest return date and, among returns of the same date, the one recorded first; the earning
      it reverses is the Northgate Cash earning that points to the returned line, and when no such return is
      recorded or no earning points to that line, nothing is reversed.
      The consumer return reversal is the reversal share times one less the relief fraction, rounded half up to the cent.
      The reversal share is the earned amount times the merchandise refunded on the return divided by the earning's
      basis_amount_usd.
      The relief fraction is zero.
      Every schedule below either sets the reversal share or adds a fraction to the relief fraction, and the fractions
      added are summed.
      Closing-return share: when the units returned on all returns of the line reach the units bought on it, the reversal
      share is the earned amount less the Cash already reversed on that earning; when the units returned fall short of the
      units bought and the line carries a price adjustment, the reversal share is the earned amount times the units
      returned on this return divided by the units bought; otherwise the reversal share is the earned amount times the
      merchandise refunded on the return divided by the earning's basis_amount_usd.
      Reason relief: a return with reason wrong item or damaged in transit adds reason_relief_high to the relief fraction;
      a return with reason defective or not as described adds reason_relief_mid; a return with any other reason adds
      nothing.
      Tenure relief: a return dated tenure_months_high or more whole calendar months after the membership's term start
      date adds tenure_relief_high to the relief fraction; a return dated tenure_months_mid to fewer than
      tenure_months_high whole calendar months after it adds tenure_relief_mid; any other return adds nothing.
      First-return relief: when the return is the only return recorded on the member's Northgate orders dated within the
      twelve whole calendar months before today, it adds first_return_relief_high to the relief fraction; when it is one
      of exactly two such returns, it adds first_return_relief_mid; otherwise it adds nothing.
      A reversal is owed on the return this schedule settles when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the
      units bought less every unit refunded without a return on the line, divided by the units bought and rounded
      half up to the cent, less the merchandise refunded on every return of the line, and otherwise nothing is
      reversed. A line's net amount is the amount charged for the
      line after item promotions and the Northgate Card discount. Each return record reverses
      cash at most once, and an even exchange that refunds nothing reverses nothing.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [order_events.order_event_id, order_events.amount_usd, order_events.quantity, order_events.return_reason, order_events.original_event_id, order_events.event_date]
        note: The closing-return, reason and first-return schedules take their tiers from the member's return, line and price-adjustment records.
    compute:
      - return_ref: "XLATEST('order', 'order_events', 'order_event_id', date_field='event_date', event_type='order_return_line')"
      - refunded_merch: "XSUM('order', 'order_events', 'amount_usd', order_event_id=return_ref)"
      - return_units: "XSUM('order', 'order_events', 'quantity', order_event_id=return_ref)"
      - return_date: "XLATEST('order', 'order_events', 'event_date', order_event_id=return_ref) or NOW"
      - line_ref: "XLATEST('order', 'order_events', 'original_event_id', order_event_id=return_ref)"
      - earning_ref: "LATEST('membership_events', 'membership_event_id', event_type='membership_cash_earn', source_order_event_id=line_ref)"
      - earned: "SUM('membership_events', 'amount_usd', membership_event_id=earning_ref)"
      - earned_basis: "SUM('membership_events', 'basis_amount_usd', membership_event_id=earning_ref)"
      - line_net_amount: "XSUM('order', 'order_events', 'amount_usd', order_event_id=line_ref)"
      - line_units: "XSUM('order', 'order_events', 'quantity', order_event_id=line_ref)"
      - units_returned_line: "XSUM('order', 'order_events', 'quantity', event_type='order_return_line', original_event_id=line_ref)"
      - adjustments_on_line: "XCOUNT('order', 'order_events', event_type='order_adjust_price', original_event_id=line_ref)"
      - already_reversed: "SUM('membership_events', 'amount_usd', event_type='membership_cash_reverse', original_event_id=earning_ref)"
      - earning_rate: "earned / earned_basis if earned_basis > 0 else 0"
      - units_refunded_all: "XSUM('order', 'order_events', 'quantity', event_type='order_refund_charge', original_event_id=line_ref)"
      - returned_all: "XSUM('order', 'order_events', 'amount_usd', event_type='order_return_line', original_event_id=line_ref)"
      - kept_units_basis_now: "RND(line_net_amount * (line_units - units_refunded_all) / line_units + 0.000000001, 2) - returned_all if line_units > 0 else 0"
      - reversal_share: "earned - already_reversed if units_returned_line >= line_units else (earned * return_units / line_units if (units_returned_line < line_units and adjustments_on_line > 0) else earning_rate * refunded_merch)"
      - return_reason: "XLATEST('order', 'order_events', 'return_reason', order_event_id=return_ref)"
      - reason_fraction: "K('reason_relief_high') if (return_reason == 'wrong_item' or return_reason == 'damaged_in_transit') else (K('reason_relief_mid') if (return_reason == 'defective' or return_reason == 'not_as_described') else 0)"
      - months_at_return: "MONTHS(F('term_start_date') or return_date, return_date)"
