      earned_12m: "The Cash recovery is the member-bonus Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The member-bonus Cash is the net Cash minus the base-rate Cash. The net Cash is the Cash earned in that period minus the Cash reversed in that period. The base-rate Cash is the tier's rewards_earn_rate_pct percent of the net basis. The net basis is the earning bases of that period minus the reversal bases of that period."
      earned_basis_12m: "The Cash recovery is the member-bonus Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The member-bonus Cash is the net Cash minus the base-rate Cash. The net Cash is the Cash earned in that period minus the Cash reversed in that period. The base-rate Cash is the tier's rewards_earn_rate_pct percent of the net basis. The net basis is the earning bases of that period minus the reversal bases of that period."
      reversed_12m: "The Cash recovery is the member-bonus Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The member-bonus Cash is the net Cash minus the base-rate Cash. The net Cash is the Cash earned in that period minus the Cash reversed in that period. The base-rate Cash is the tier's rewards_earn_rate_pct percent of the net basis. The net basis is the earning bases of that period minus the reversal bases of that period."
      reversed_basis_12m: "The Cash recovery is the member-bonus Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The member-bonus Cash is the net Cash minus the base-rate Cash. The net Cash is the Cash earned in that period minus the Cash reversed in that period. The base-rate Cash is the tier's rewards_earn_rate_pct percent of the net basis. The net basis is the earning bases of that period minus the reversal bases of that period."
      bonus_net: "The Cash recovery is the member-bonus Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The member-bonus Cash is the net Cash minus the base-rate Cash. The net Cash is the Cash earned in that period minus the Cash reversed in that period. The base-rate Cash is the tier's rewards_earn_rate_pct percent of the net basis. The net basis is the earning bases of that period minus the reversal bases of that period."
      cash_recovery: "The Cash recovery is the member-bonus Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The member-bonus Cash is the net Cash minus the base-rate Cash. The net Cash is the Cash earned in that period minus the Cash reversed in that period. The base-rate Cash is the tier's rewards_earn_rate_pct percent of the net basis. The net basis is the earning bases of that period minus the reversal bases of that period."
      streaming_last: "Streaming partner month: when the bundled streaming subscription was activated on or after the charge date, one month's share of the fee, the fee divided by term_months, times streaming_share_current is taken from the refund; when it was last activated before the charge date but within the twelve whole calendar months before the cancellation date, that month's share times streaming_share_recent is taken from it; otherwise nothing is taken."
      streaming_take: "Streaming partner month: when the bundled streaming subscription was activated on or after the charge date, one month's share of the fee, the fee divided by term_months, times streaming_share_current is taken from the refund; when it was last activated before the charge date but within the twelve whole calendar months before the cancellation date, that month's share times streaming_share_recent is taken from it; otherwise nothing is taken."
      active_card_tier: "Cardholder courtesy: when the member holds a Northgate Store Card, Northgate Mastercard or Northgate World Mastercard account in active status, one month's share of the fee, the fee divided by term_months, times courtesy_share_high is added to the refund; when the member holds a Northgate Secured Card account in active status, one month's share times courtesy_share_mid is added; otherwise nothing is added."
      courtesy_add: "Cardholder courtesy: when the member holds a Northgate Store Card, Northgate Mastercard or Northgate World Mastercard account in active status, one month's share of the fee, the fee divided by term_months, times courtesy_share_high is added to the refund; when the member holds a Northgate Secured Card account in active status, one month's share times courtesy_share_mid is added; otherwise nothing is added."
      result: "The refund is the refund core less the Cash recovery, never more than that fee and never below zero, rounded down to the cent. When the refund comes to zero, the cancellation is still recorded and confirmed, and no refund entry is booked."
    prerequisite:
      - problem: membership_ext_consumer_cash_earning
        kind: value_input
        gate: bonus_net
        form: state
        policy_source: >-
          The refund is fixed only after the membership's ledger carries the Northgate Cash earning of the line recorded
          first on the member's Northgate order that has the latest fulfilled date among the member's orders in
          fulfilled status, on a shared latest date the order of them recorded first, when the line is not of a purchase
          type that never earns Northgate Cash, the membership is not canceled on its order's fulfilled date and the
          line's earning under the consumer earning schedule comes to at least one cent.
        condition: >-
          The line recorded first on the member's order with the latest fulfilled date among orders in fulfilled status
          (ties: the order recorded first), when that line earns (its category is not excluded, the membership was not
          canceled on the fulfilled date, the line's consumer-schedule earning is at least 0.01), has a
          membership_cash_earn row whose source_order_event_id is that line.
        resolved_by: post_member_cash_earning_0c0d8435
        effect: >-
          Posting the missing earning adds its amount and its earning basis to the Cash earned and the earning bases of the
          twelve months before the cancellation, which raises the member-bonus Cash the Cash recovery takes and so lowers
          the refund.
      - problem: membership_ext_consumer_return_reversal
        kind: value_input
        gate: bonus_net
        form: state
        policy_source: >-
          The refund is not fixed until the most recent return recorded on the member's Northgate orders, the one with
          the latest return date and, among returns of the same date, the one recorded first has its Cash reversal on
          the membership's ledger, when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less every
          unit refunded without a return on the line, divided by the units bought and rounded half up to the cent, less
          the merchandise refunded on every return of the line.
        condition: >-
          The latest order_return_line row on the member's orders (ties: recorded first) has a membership_cash_reverse
          row whose source_order_event_id is that return, when the line's membership_cash_earn basis_amount_usd differs
          from RND(line amount_usd x (line quantity - quantity of order_refund_charge rows on the line) / line quantity,
          2) - the amount_usd of order_return_line rows on the line.
        resolved_by: reverse_member_return_cash_50b9758d
        effect: >-
          Posting the missing reversal adds its amount and its refunded merchandise to the Cash reversed and the reversal
          bases of the twelve months before the cancellation, which changes the member-bonus Cash the Cash recovery takes
          and so the refund.
    cross_category:
      - category: card
        as: branch
        reads: [variant_name, status]
        note: The cardholder courtesy schedule takes its tier from the member's Northgate Card account in active status.
    factors:
      - id: money_back
        effect: method
        decides: refund_core
        bindings: [days_since_charge, last_use_on, recent_use_value, refund_core]
        ladder:
          - when: "the fee was charged no more than the tier's annual_full_refund_window_days days before the cancellation date and no benefit use is dated on or after the charge date"
            method: "the refund core is the whole fee"
          - when: "the fee was charged no more than that many days before and a benefit use is dated on or after the charge date"
            method: "the refund core is the whole fee less the value of the benefit uses dated within the one whole calendar month before the cancellation date, never less than the prorated fee"
          - when: "otherwise"
            method: "the refund core is the prorated fee"
        baseline: {refund_core: "prorated"}
        evidence: [date, history]
        cross_difficulty: null
      - id: recovery_share
        effect: parameter
        decides: recovery_share
        bindings: [settled_fees, recovery_share]
        ladder:
          - when: "the membership carries third_term_fees or more settled annual fees"
            value: "K('recovery_share_third')"
          - when: "the membership carries exactly second_term_fees settled annual fees"
            value: "K('recovery_share_second')"
          - when: "otherwise"
            value: "1"
        baseline: {recovery_share: "1"}
        evidence: [history]
        cross_difficulty: null
      - id: streaming_partner_month
        effect: parameter
        decides: streaming_take
        bindings: [streaming_last, streaming_take]
        ladder:
          - when: "the bundled streaming subscription was activated on or after the charge date"
            value: "fee / P('term_months') * K('streaming_share_current')"
          - when: "it was last activated before the charge date but within the twelve whole calendar months before the cancellation date"
            value: "fee / P('term_months') * K('streaming_share_recent')"
          - when: "otherwise"
            value: "0"
        baseline: {streaming_take: "0"}
        evidence: [history, date]
        cross_difficulty: null
      - id: cardholder_courtesy
        effect: parameter
        decides: courtesy_add
        bindings: [active_card_tier, courtesy_add]
        ladder:
          - when: "the member holds a Northgate Store Card, Northgate Mastercard or Northgate World Mastercard account in active status"
            value: "fee / P('term_months') * K('courtesy_share_high')"
          - when: "the member holds a Northgate Secured Card account in active status"
            value: "fee / P('term_months') * K('courtesy_share_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {courtesy_add: "0"}
        evidence: [cross_category]
        cross_difficulty: card
    baseline:
      rule: >-
        The refund refers to the most recent settled annual fee charge on the membership. When the membership carries
        no settled annual fee charge, nothing is refunded. The refund is the refund core less the Cash recovery, never more than that fee and never below zero, rounded down to the cent. When the refund comes to zero, the cancellation is still recorded and confirmed, and no refund entry is booked. The refund core is
        the prorated fee: the fee times the whole calendar months from the cancellation date to the renewal date, divided
        by the tier's term_months. The Cash recovery is the member-bonus Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The member-bonus Cash is the net Cash minus the base-rate Cash. The net Cash is the Cash earned in that period minus the Cash reversed in that period. The base-rate Cash is the tier's rewards_earn_rate_pct percent of the net basis. The net basis is the earning bases of that period minus the reversal bases of that period.
      params: [term_months, rewards_earn_rate_pct]
    inputs:
      history:
        - {table: membership_events, aggregate: latest, field: amount_usd, filters: {event_type: membership_fee_charge}}
        - {table: membership_events, aggregate: latest, field: event_date, filters: {event_type: membership_benefit_use}}
        - {table: membership_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: membership_cash_earn}}
        - {table: membership_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: membership_cash_reverse}}
        - {table: membership_events, aggregate: count, field: membership_event_id, filters: {event_type: membership_fee_charge}}
      cross_category: [card]
  - id: membership_ext_business_cash_earning
    base_policy_refs: [membership_evt_cash_earn]
    overwrite:
      - base_policy: membership_evt_cash_earn
        superseded_clause: >-
          Northgate Cash is earned on each fulfilled Northgate order line of the membership holder at the tier's
          rewards_earn_rate_pct of the line's eligible net merchandise amount, recorded as basis_amount_usd: the amount actually
          paid for the line after item promotions, price adjustments already granted at the time of fulfilment and the
          Northgate Card discount, before tax, fees, gift cards and Northgate Cash.
        replaced_by: >-
          For the line recorded first on the member's Northgate order that has the latest fulfilled date among the
          member's orders in fulfilled status, on a shared latest date the order of them recorded first, when the member
          holds a Northgate+ Business membership, and only for that line, the Northgate Cash posted is worked out under
          this Business earning schedule; the same line on a Northgate Rewards, Northgate+ Assist, Northgate+ Student,
          Northgate+ Monthly or Northgate+ Annual membership is worked out under the consumer earning schedule, and
          every fulfilled Northgate order line that neither the consumer nor the Business earning schedule settles stays
          under the base earning rule, which no schedule of this
          charter prices or posts, earning the tier's rewards_earn_rate_pct of the line's eligible net merchandise
          amount, recorded as basis_amount_usd: the amount actually paid for the line after item promotions, price
          adjustments already granted at the time of fulfilment and the Northgate Card discount, before tax, fees, gift
          cards and Northgate Cash.
      - base_policy: membership_evt_cash_earn
        superseded_clause: >-
          Where rewards_annual_earn_cap_usd is a number, an earning is reduced so that membership_msr_cash_earned_ytd does not
          exceed the cap, and no further earning posts in that calendar year once it is reached.
        replaced_by: >-
          On a Northgate+ Business membership the earning is reduced so that the Northgate Cash earned on the membership in the twelve whole calendar months before today, the day the earning is booked, this earning included, does not exceed the tier's
          rewards_annual_earn_cap_usd, and nothing posts once that limit is reached; on every other membership the cap, where
          the tier has one, limits the Cash earned in the calendar year of the earn date and no further earning posts in that
          calendar year once it is reached.
    trigger: state_due
    subject: [membership_cash_earn]
    computes: amount_usd
    target_tool: post_business_cash_earning_affdfb03
    params:
      hold_rate_pct: 1.0
      volume_high_usd: 5000
      volume_mid_usd: 2000
      volume_points_high: 0.5
      volume_points_mid: 0.25
      card_points_high: 0.5
      card_points_mid: 0.25
      pickup_points_high: 0.5
      pickup_points_mid: 0.25
      tenure_months_high: 24
      tenure_months_mid: 12
      tenure_points_high: 0.5
      tenure_points_mid: 0.25
    rule: >-
      For the line recorded first on the member's Northgate order that has the latest fulfilled date among the
      member's orders in fulfilled status, on a shared latest date the order of them recorded first, when the member
      holds a Northgate+ Business membership, and only for that line, the Northgate Cash posted is worked out under
      this Business earning schedule; the same line on a Northgate Rewards, Northgate+ Assist, Northgate+ Student,
      Northgate+ Monthly or Northgate+ Annual membership is worked out under the consumer earning schedule, and
      every fulfilled Northgate order line that neither the consumer nor the Business earning schedule settles stays
      under the base earning rule, which no schedule of this
      charter prices or posts, earning the tier's rewards_earn_rate_pct of the line's eligible net merchandise
      amount, recorded as basis_amount_usd: the amount actually paid for the line after item promotions, price
      adjustments already granted at the time of fulfilment and the Northgate Card discount, before tax, fees, gift
      cards and Northgate Cash.
      The line this Business schedule settles is the line recorded first on the member's Northgate order that has
      the latest fulfilled date among the member's orders in fulfilled status, on a shared latest date the order of
      them recorded first; when the member has no Northgate order in fulfilled status, nothing is posted.
      The Business earning is the line's Business earning basis times the Business earning percentage, divided by 100 and
      rounded half up to the cent, and it posts on the order's fulfilled date.
      The Business earning basis is the line's net amount, the amount paid for the line after item promotions and the
      Northgate Card discount, before tax, fees, gift cards and Northgate Cash.
      The Business base rate is the tier's rewards_earn_rate_pct, and the Business earning percentage is that base rate.
      Every schedule below either replaces the Business base rate, adds percentage points to the Business earning
      percentage or sets the Business earning basis, and the points added by the schedules are summed.
      Payment-hold rate: an order is held when it was fulfilled on or after the membership's payment hold date, the
      billing period starting on that payment hold date carries a declined attempt, and the fee of that billing
      period settled after the fulfilled date or has not yet settled. When the membership is not canceled on the
      fulfilled date and the order is held, the Business base rate is hold_rate_pct, the Northgate Rewards rate,
      because paid benefits do not apply on payment hold; when the membership is canceled on the fulfilled date the
      Business base rate is zero and the line earns nothing at all, whatever points the other schedules would add;
      otherwise the Business base rate is the tier's rewards_earn_rate_pct.
      Volume points: when the net amounts of the lines on the member's Northgate orders dated within the twelve whole
      calendar months before today total volume_high_usd or more, the line adds volume_points_high points; when they total
      volume_mid_usd to less than volume_high_usd, it adds volume_points_mid points; otherwise it adds no points.
      Business card points: a line paid with a Northgate Card whose account is a Northgate Business Mastercard in active
      status adds card_points_high points; a line paid with a Northgate Card whose account is a Northgate Business Store
      Card in active status adds card_points_mid points; any other line adds no points.
      Business kept-units basis: when units of the line were refunded without a return and none were returned, the
      Business earning basis is the net amount times the units bought less the units so refunded, divided by the
      units bought, rounded half up to the cent; when units were returned and none were refunded without a return,
      it is the net amount less the merchandise refunded on those returns; when both happened, it is the net amount
      times the units bought less the units refunded without a return, divided by the units bought, rounded half up
      to the cent, less the merchandise refunded on the returns; otherwise it is the net amount.
      Pickup points: a line on a Northgate Order Pickup or Northgate Drive Up order adds pickup_points_high points; a line
      on a Northgate Ship to Home or Northgate Same-Day Delivery order adds pickup_points_mid points; any other line adds
      no points.
      Business tenure points: a line whose order's fulfilled date is tenure_months_high or more whole calendar months after
      the membership's term start date adds tenure_points_high points; one fulfilled tenure_months_mid to fewer than
      tenure_months_high whole calendar months after it adds tenure_points_mid points; any other line adds no points.
      On a Northgate+ Business membership the earning is reduced so that the Northgate Cash earned on the membership in the twelve whole calendar months before today, the day the earning is booked, this earning included, does not exceed the tier's
      rewards_annual_earn_cap_usd, and nothing posts once that limit is reached; on every other membership the cap, where
      the tier has one, limits the Cash earned in the calendar year of the earn date and no further earning posts in that
      calendar year once it is reached.
      Lines of the purchase types in rewards_excluded_purchases never earn, and a line earns only if the membership
      is not canceled on the fulfilled date. The tier's annual Northgate Cash limit is its rewards_annual_earn_cap_usd. An earning is posted for the line this Business schedule settles only when the line is not of a purchase type that never earns Northgate Cash, the membership is not canceled on its order's fulfilled date, the Northgate Cash earned on the membership in the twelve whole calendar months before today is below the tier's annual Northgate Cash limit and the line's earning under the Business earning schedule comes to at least one cent; otherwise nothing is posted.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [order_holdings.order_id, order_holdings.variant_name, order_holdings.fulfilled_date, order_holdings.status, order_events.amount_usd, order_events.item_category, order_events.payment_method_type, order_events.card_account_id]
        note: The volume, pickup and kept-units schedules take their tiers from the member's orders, lines, returns and refunds.
      - category: card
        as: branch
        reads: [variant_name, status]
        note: The Business card points take their tier from the Northgate Card account that paid the line.
    compute:
      - order_ref: "XLATEST('order', 'order_holdings', 'order_id', date_field='fulfilled_date', status='fulfilled')"
      - fulfilled_on: "XLATEST('order', 'order_holdings', 'fulfilled_date', date_field='fulfilled_date', status='fulfilled') or '0000-01-01'"
      - line_ref: "XLATEST('order', 'order_events', 'order_event_id', date_field='event_date', event_type='order_post_line', order_id=order_ref)"
      - line_net: "XSUM('order', 'order_events', 'amount_usd', order_event_id=line_ref)"
      - line_category: "XLATEST('order', 'order_events', 'item_category', order_event_id=line_ref)"
      - excluded_line: "line_category == 'gift_cards' or line_category == 'prescriptions' or line_category == 'alcohol' or (F('canceled_date') or '9999-12-31') <= fulfilled_on"
      - held_period_settled: "LATEST('membership_events', 'event_date', event_type='membership_fee_charge', billing_period_start=F('payment_hold_date'))"
      - held_declines: "COUNT('membership_events', event_type='membership_fee_decline', billing_period_start=F('payment_hold_date'))"
      - base_rate: "K('hold_rate_pct') if ((F('canceled_date') or '9999-12-31') > fulfilled_on and held_declines > 0 and (F('payment_hold_date') or '9999-12-31') <= fulfilled_on and fulfilled_on < (held_period_settled or '9999-12-31')) else (0 if (F('canceled_date') or '9999-12-31') <= fulfilled_on else P('rewards_earn_rate_pct'))"
      - lines_12m: "XSUM('order', 'order_events', 'amount_usd', within_months=12, date_field='event_date', event_type='order_post_line')"
      - volume_pts: "K('volume_points_high') if lines_12m >= K('volume_high_usd') else (K('volume_points_mid') if lines_12m >= K('volume_mid_usd') else 0)"
      - line_tender: "XLATEST('order', 'order_events', 'payment_method_type', order_event_id=line_ref)"
      - paying_card_tier: "CFIELD('card', 'variant_name', card_account_id=XLATEST('order', 'order_events', 'card_account_id', order_event_id=line_ref), status='active')"
      - card_pts: "K('card_points_high') if (line_tender == 'northgate_card' and paying_card_tier == 'Northgate Business Mastercard') else (K('card_points_mid') if (line_tender == 'northgate_card' and paying_card_tier == 'Northgate Business Store Card') else 0)"
      - returned_merch: "XSUM('order', 'order_events', 'amount_usd', event_type='order_return_line', original_event_id=line_ref)"
      - units_bought: "XSUM('order', 'order_events', 'quantity', order_event_id=line_ref)"
      - units_refunded: "XSUM('order', 'order_events', 'quantity', event_type='order_refund_charge', original_event_id=line_ref)"
      - earning_basis: "RND(line_net * (units_bought - units_refunded) / units_bought + 0.000000001, 2) if (units_refunded > 0 and returned_merch == 0) else (line_net - returned_merch if (returned_merch > 0 and units_refunded == 0) else (RND(line_net * (units_bought - units_refunded) / units_bought + 0.000000001, 2) - returned_merch if (units_refunded > 0 and returned_merch > 0) else line_net))"
      - order_program: "XLATEST('order', 'order_holdings', 'variant_name', date_field='fulfilled_date', order_id=order_ref)"
      - pickup_pts: "K('pickup_points_high') if (order_program == 'Northgate Order Pickup' or order_program == 'Northgate Drive Up') else (K('pickup_points_mid') if (order_program == 'Northgate Ship to Home' or order_program == 'Northgate Same-Day Delivery') else 0)"
      - tenure_months: "MONTHS(F('term_start_date') or fulfilled_on, fulfilled_on)"
      - tenure_pts: "K('tenure_points_high') if tenure_months >= K('tenure_months_high') else (K('tenure_points_mid') if tenure_months >= K('tenure_months_mid') else 0)"
      - earning_pct: "base_rate + volume_pts + card_pts + pickup_pts + tenure_pts"
      - raw_earning: "RND(earning_basis * earning_pct / 100 + 0.000000001, 2)"
      - cash_12m: "SUM('membership_events', 'amount_usd', within_months=12, date_field='event_date', event_type='membership_cash_earn')"
      - result: "0 if (order_ref == None or excluded_line) else MN(raw_earning, MX(0, P('rewards_annual_earn_cap_usd') - cash_12m))"
    compute_basis:
      order_ref: "The line this Business schedule settles is the line recorded first on the member's Northgate order that has the latest fulfilled date among the member's orders in fulfilled status, on a shared latest date the order of them recorded first; when the member has no Northgate order in fulfilled status, nothing is posted."
      fulfilled_on: "The Business earning is the line's Business earning basis times the Business earning percentage, divided by 100 and rounded half up to the cent, and it posts on the order's fulfilled date."
      line_ref: "The line this Business schedule settles is the line recorded first on the member's Northgate order that has the latest fulfilled date among the member's orders in fulfilled status, on a shared latest date the order of them recorded first; when the member has no Northgate order in fulfilled status, nothing is posted."
      line_net: "The Business earning basis is the line's net amount, the amount paid for the line after item promotions and the Northgate Card discount, before tax, fees, gift cards and Northgate Cash."
      line_category: "Lines of the purchase types in rewards_excluded_purchases never earn, and a line earns only if the membership is not canceled on the fulfilled date. The tier's annual Northgate Cash limit is its rewards_annual_earn_cap_usd. An earning is posted for the line this Business schedule settles only when the line is not of a purchase type that never earns Northgate Cash, the membership is not canceled on its order's fulfilled date, the Northgate Cash earned on the membership in the twelve whole calendar months before today is below the tier's annual Northgate Cash limit and the line's earning under the Business earning schedule comes to at least one cent; otherwise nothing is posted."
      excluded_line: "Lines of the purchase types in rewards_excluded_purchases never earn, and a line earns only if the membership is not canceled on the fulfilled date. The tier's annual Northgate Cash limit is its rewards_annual_earn_cap_usd. An earning is posted for the line this Business schedule settles only when the line is not of a purchase type that never earns Northgate Cash, the membership is not canceled on its order's fulfilled date, the Northgate Cash earned on the membership in the twelve whole calendar months before today is below the tier's annual Northgate Cash limit and the line's earning under the Business earning schedule comes to at least one cent; otherwise nothing is posted."
      held_period_settled: "Payment-hold rate: an order is held when it was fulfilled on or after the membership's payment hold date, the billing period starting on that payment hold date carries a declined attempt, and the fee of that billing period settled after the fulfilled date or has not yet settled. When the membership is not canceled on the fulfilled date and the order is held, the Business base rate is hold_rate_pct, the Northgate Rewards rate, because paid benefits do not apply on payment hold; when the membership is canceled on the fulfilled date the Business base rate is zero and the line earns nothing at all, whatever points the other schedules would add; otherwise the Business base rate is the tier's rewards_earn_rate_pct."
      held_declines: "Payment-hold rate: an order is held when it was fulfilled on or after the membership's payment hold date, the billing period starting on that payment hold date carries a declined attempt, and the fee of that billing period settled after the fulfilled date or has not yet settled. When the membership is not canceled on the fulfilled date and the order is held, the Business base rate is hold_rate_pct, the Northgate Rewards rate, because paid benefits do not apply on payment hold; when the membership is canceled on the fulfilled date the Business base rate is zero and the line earns nothing at all, whatever points the other schedules would add; otherwise the Business base rate is the tier's rewards_earn_rate_pct."
      base_rate: "Payment-hold rate: an order is held when it was fulfilled on or after the membership's payment hold date, the billing period starting on that payment hold date carries a declined attempt, and the fee of that billing period settled after the fulfilled date or has not yet settled. When the membership is not canceled on the fulfilled date and the order is held, the Business base rate is hold_rate_pct, the Northgate Rewards rate, because paid benefits do not apply on payment hold; when the membership is canceled on the fulfilled date the Business base rate is zero and the line earns nothing at all, whatever points the other schedules would add; otherwise the Business base rate is the tier's rewards_earn_rate_pct."
      lines_12m: "Volume points: when the net amounts of the lines on the member's Northgate orders dated within the twelve whole calendar months before today total volume_high_usd or more, the line adds volume_points_high points; when they total volume_mid_usd to less than volume_high_usd, it adds volume_points_mid points; otherwise it adds no points."
      volume_pts: "Volume points: when the net amounts of the lines on the member's Northgate orders dated within the twelve whole calendar months before today total volume_high_usd or more, the line adds volume_points_high points; when they total volume_mid_usd to less than volume_high_usd, it adds volume_points_mid points; otherwise it adds no points."
      line_tender: "Business card points: a line paid with a Northgate Card whose account is a Northgate Business Mastercard in active status adds card_points_high points; a line paid with a Northgate Card whose account is a Northgate Business Store Card in active status adds card_points_mid points; any other line adds no points."
      paying_card_tier: "Business card points: a line paid with a Northgate Card whose account is a Northgate Business Mastercard in active status adds card_points_high points; a line paid with a Northgate Card whose account is a Northgate Business Store Card in active status adds card_points_mid points; any other line adds no points."
      card_pts: "Business card points: a line paid with a Northgate Card whose account is a Northgate Business Mastercard in active status adds card_points_high points; a line paid with a Northgate Card whose account is a Northgate Business Store Card in active status adds card_points_mid points; any other line adds no points."
      returned_merch: "Business kept-units basis: when units of the line were refunded without a return and none were returned, the Business earning basis is the net amount times the units bought less the units so refunded, divided by the units bought, rounded half up to the cent; when units were returned and none were refunded without a return, it is the net amount less the merchandise refunded on those returns; when both happened, it is the net amount times the units bought less the units refunded without a return, divided by the units bought, rounded half up to the cent, less the merchandise refunded on the returns; otherwise it is the net amount."
      units_bought: "Business kept-units basis: when units of the line were refunded without a return and none were returned, the Business earning basis is the net amount times the units bought less the units so refunded, divided by the units bought, rounded half up to the cent; when units were returned and none were refunded without a return, it is the net amount less the merchandise refunded on those returns; when both happened, it is the net amount times the units bought less the units refunded without a return, divided by the units bought, rounded half up to the cent, less the merchandise refunded on the returns; otherwise it is the net amount."
      units_refunded: "Business kept-units basis: when units of the line were refunded without a return and none were returned, the Business earning basis is the net amount times the units bought less the units so refunded, divided by the units bought, rounded half up to the cent; when units were returned and none were refunded without a return, it is the net amount less the merchandise refunded on those returns; when both happened, it is the net amount times the units bought less the units refunded without a return, divided by the units bought, rounded half up to the cent, less the merchandise refunded on the returns; otherwise it is the net amount."
      earning_basis: "Business kept-units basis: when units of the line were refunded without a return and none were returned, the Business earning basis is the net amount times the units bought less the units so refunded, divided by the units bought, rounded half up to the cent; when units were returned and none were refunded without a return, it is the net amount less the merchandise refunded on those returns; when both happened, it is the net amount times the units bought less the units refunded without a return, divided by the units bought, rounded half up to the cent, less the merchandise refunded on the returns; otherwise it is the net amount."
      order_program: "Pickup points: a line on a Northgate Order Pickup or Northgate Drive Up order adds pickup_points_high points; a line on a Northgate Ship to Home or Northgate Same-Day Delivery order adds pickup_points_mid points; any other line adds no points."
      pickup_pts: "Pickup points: a line on a Northgate Order Pickup or Northgate Drive Up order adds pickup_points_high points; a line on a Northgate Ship to Home or Northgate Same-Day Delivery order adds pickup_points_mid points; any other line adds no points."
      tenure_months: "Business tenure points: a line whose order's fulfilled date is tenure_months_high or more whole calendar months after the membership's term start date adds tenure_points_high points; one fulfilled tenure_months_mid to fewer than tenure_months_high whole calendar months after it adds tenure_points_mid points; any other line adds no points."
      tenure_pts: "Business tenure points: a line whose order's fulfilled date is tenure_months_high or more whole calendar months after the membership's term start date adds tenure_points_high points; one fulfilled tenure_months_mid to fewer than tenure_months_high whole calendar months after it adds tenure_points_mid points; any other line adds no points."
      earning_pct: "Every schedule below either replaces the Business base rate, adds percentage points to the Business earning percentage or sets the Business earning basis, and the points added by the schedules are summed."
      raw_earning: "The Business earning is the line's Business earning basis times the Business earning percentage, divided by 100 and rounded half up to the cent, and it posts on the order's fulfilled date."
      cash_12m: "On a Northgate+ Business membership the earning is reduced so that the Northgate Cash earned on the membership in the twelve whole calendar months before today, the day the earning is booked, this earning included, does not exceed the tier's rewards_annual_earn_cap_usd, and nothing posts once that limit is reached; on every other membership the cap, where the tier has one, limits the Cash earned in the calendar year of the earn date and no further earning posts in that calendar year once it is reached."
      result: "On a Northgate+ Business membership the earning is reduced so that the Northgate Cash earned on the membership in the twelve whole calendar months before today, the day the earning is booked, this earning included, does not exceed the tier's rewards_annual_earn_cap_usd, and nothing posts once that limit is reached; on every other membership the cap, where the tier has one, limits the Cash earned in the calendar year of the earn date and no further earning posts in that calendar year once it is reached. Lines of the purchase types in rewards_excluded_purchases never earn, and a line earns only if the membership is not canceled on the fulfilled date. The tier's annual Northgate Cash limit is its rewards_annual_earn_cap_usd. An earning is posted for the line this Business schedule settles only when the line is not of a purchase type that never earns Northgate Cash, the membership is not canceled on its order's fulfilled date, the Northgate Cash earned on the membership in the twelve whole calendar months before today is below the tier's annual Northgate Cash limit and the line's earning under the Business earning schedule comes to at least one cent; otherwise nothing is posted."
    factors:
      - id: payment_hold_rate
        effect: parameter
        decides: base_rate
        bindings: [held_declines, held_period_settled, base_rate]
        ladder:
          - when: "the membership is not canceled on the fulfilled date and the order is held: it was fulfilled on or after the membership's payment hold date, the billing period starting on that payment hold date carries a declined attempt, and the fee of that billing period settled after the fulfilled date or has not yet settled"
            value: "K('hold_rate_pct')"
          - when: "the membership is canceled on the fulfilled date"
            value: "0"
          - when: "otherwise"
            value: "P('rewards_earn_rate_pct')"
        baseline: {base_rate: "P('rewards_earn_rate_pct')"}
        evidence: [date, history]
        cross_difficulty: null
      - id: volume_points
        effect: parameter
        decides: volume_pts
        bindings: [lines_12m, volume_pts]
        ladder:
          - when: "the net amounts of the lines on the member's Northgate orders dated within the twelve whole calendar months before today total volume_high_usd or more"
            value: "K('volume_points_high')"
          - when: "they total volume_mid_usd to less than volume_high_usd"
            value: "K('volume_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {volume_pts: "0"}
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: business_card_points
        effect: parameter
        decides: card_pts
        bindings: [line_tender, paying_card_tier, card_pts]
        ladder:
          - when: "the line was paid with a Northgate Card whose account is a Northgate Business Mastercard in active status"
            value: "K('card_points_high')"
          - when: "the line was paid with a Northgate Card whose account is a Northgate Business Store Card in active status"
            value: "K('card_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {card_pts: "0"}
        evidence: [cross_category]
        cross_difficulty: card
      - id: business_kept_units
        effect: method
        decides: earning_basis
        bindings: [units_bought, units_refunded, returned_merch, earning_basis]
        ladder:
          - when: "units of the line were refunded without a return and none were returned"
            method: "the Business earning basis is the net amount times the units bought less the units refunded without a return, divided by the units bought, rounded half up to the cent"
          - when: "units were returned and none were refunded without a return"
            method: "the Business earning basis is the net amount less the merchandise refunded on the returns"
          - when: "units were both refunded without a return and returned"
            method: "the Business earning basis is the net amount times the units bought less the units refunded without a return, divided by the units bought, rounded half up to the cent, less the merchandise refunded on the returns"
          - when: "otherwise"
            method: "the Business earning basis is the net amount"
        baseline: {earning_basis: "line_net"}
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: pickup_points
        effect: parameter
        decides: pickup_pts
        bindings: [order_program, pickup_pts]
        ladder:
          - when: "the line is on a Northgate Order Pickup or Northgate Drive Up order"
            value: "K('pickup_points_high')"
          - when: "the line is on a Northgate Ship to Home or Northgate Same-Day Delivery order"
            value: "K('pickup_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {pickup_pts: "0"}
        evidence: [cross_category]
        cross_difficulty: order
      - id: business_tenure_points
        effect: parameter
        decides: tenure_pts
        bindings: [tenure_months, tenure_pts]
        ladder:
          - when: "the order's fulfilled date is tenure_months_high or more whole calendar months after the membership's term start date"
            value: "K('tenure_points_high')"
          - when: "it is tenure_months_mid to fewer than tenure_months_high whole calendar months after it"
            value: "K('tenure_points_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {tenure_pts: "0"}
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The Business earning is the line's Business earning basis times the Business earning percentage, divided by 100
        and rounded half up to the cent, and it posts on the order's fulfilled date. The Business earning basis is the
        line's net amount, the amount paid for the line after item promotions and the Northgate Card discount, before
        tax, fees, gift cards and Northgate Cash. The Business base rate is the tier's rewards_earn_rate_pct, and the
        Business earning percentage is that base rate.
      params: [rewards_earn_rate_pct, rewards_annual_earn_cap_usd]
    inputs:
      history:
        - {table: membership_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: membership_cash_earn}}
        - {table: membership_events, aggregate: latest, field: event_date, filters: {event_type: membership_fee_charge}}
        - {category: order, table: order_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: order_post_line}}
        - {category: order, table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_refund_charge}}
      cross_category: [order, card]
  - id: membership_ext_business_return_reversal
    base_policy_refs: [membership_evt_cash_reverse]
    overwrite:
      - base_policy: membership_evt_cash_reverse
        superseded_clause: >-
          When a line that earned Northgate Cash is returned for a refund, the cash earned on it is reversed
          in proportion to the merchandise amount refunded: earned amount x refunded merchandise amount / the
          earning's basis_amount_usd, rounded half up to the cent, the full earned amount when the whole line
          is refunded.
        replaced_by: >-
          For the most recent return recorded on the member's Northgate orders, the one with the latest return date and,
          among returns of the same date, the one recorded first, when the member holds a Northgate+ Business
          membership, and only for that return, the Northgate Cash reversed is worked out under this Business return
          reversal schedule; the same return on a Northgate Rewards, Northgate+ Assist, Northgate+ Student, Northgate+
          Monthly or Northgate+ Annual membership is worked out under the consumer return reversal schedule and the most
          recent refund without a return made because an item was damaged on arrival or never received on the member's
          Northgate orders, the one with the latest refund date and, among refunds of one kind on that date, the one
          recorded first, and when a damaged-on-arrival refund and a never-received refund share that date, the
          damaged-on-arrival refund under the refund-without-return reversal schedule, and every return or refund that none of the consumer return, Business return and refund-without-return reversal schedules settles stays under the base reversal rule, which no schedule of this charter prices or posts, reversing the Cash
          earned on a line returned or refunded in proportion to the merchandise amount refunded, earned amount x
          refunded merchandise amount / the earning's basis_amount_usd, rounded half up to the cent, and the full earned
          amount when the whole line is refunded.
    trigger: state_due
    subject: [membership_cash_reverse]
    computes: amount_usd
    target_tool: reverse_business_return_cash_4d4108b5
    params:
      reason_relief_high: 0.2
      reason_relief_mid: 0.1
      tenure_months_high: 24
      tenure_months_mid: 12
      tenure_relief_high: 0.1
      tenure_relief_mid: 0.05
      count_relief_high: 0.1
      count_relief_mid: 0.05
      volume_high_usd: 5000
      volume_mid_usd: 2000
      volume_relief_high: 0.1
      volume_relief_mid: 0.05
      bulk_units_high: 4
      bulk_units_mid: 2
      bulk_relief_high: 0.1
      bulk_relief_mid: 0.05
    rule: >-
      For the most recent return recorded on the member's Northgate orders, the one with the latest return date and,
      among returns of the same date, the one recorded first, when the member holds a Northgate+ Business
      membership, and only for that return, the Northgate Cash reversed is worked out under this Business return
      reversal schedule; the same return on a Northgate Rewards, Northgate+ Assist, Northgate+ Student, Northgate+
      Monthly or Northgate+ Annual membership is worked out under the consumer return reversal schedule and the most
      recent refund without a return made because an item was damaged on arrival or never received on the member's
      Northgate orders, the one with the latest refund date and, among refunds of one kind on that date, the one
      recorded first, and when a damaged-on-arrival refund and a never-received refund share that date, the
      damaged-on-arrival refund under the refund-without-return reversal schedule, and every return or refund that none of the consumer return, Business return and refund-without-return reversal schedules settles stays under the base reversal rule, which no schedule of this charter prices or posts, reversing the Cash
      earned on a line returned or refunded in proportion to the merchandise amount refunded, earned amount x
      refunded merchandise amount / the earning's basis_amount_usd, rounded half up to the cent, and the full earned
      amount when the whole line is refunded.
      The return this Business schedule settles is the most recent return recorded on the member's Northgate orders,
      the one with the latest return date and, among returns of the same date, the one recorded first; the earning
      it reverses is the Northgate Cash earning that points to the returned line, and when no such return is
      recorded or no earning points to that line, nothing is reversed.
      The Business return reversal is the reversal share times one less the relief fraction, rounded half up
      to the cent.
      The reversal share is the earned amount times the merchandise refunded on the return divided by the
      earning's basis_amount_usd.
      The relief fraction is zero.
      Every schedule below either sets the reversal share or adds a fraction to the relief fraction, and the
      fractions added are summed.
      Business closing-return share: when the units returned on all returns of the line reach the units bought
      on it, the reversal share is the earned amount less the Cash already reversed on that earning; when they
      fall short of the units bought and the line carries a price adjustment, the reversal share is the earned
      amount times the units on this return divided by the units bought; otherwise the reversal share is the
      earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd.
      Business reason relief: a return with reason wrong item or damaged in transit adds reason_relief_high to
      the relief fraction; a return with reason defective or not as described adds reason_relief_mid; a return
      with any other reason adds nothing.
      Business tenure relief: a return dated tenure_months_high or more whole calendar months after the
      membership's term start date adds tenure_relief_high to the relief fraction; one dated tenure_months_mid
      to fewer than tenure_months_high whole calendar months after it adds tenure_relief_mid; any other return
      adds nothing.
      Business first-return relief: when the return is the only return recorded on the member's Northgate
      orders dated within the twelve whole calendar months before today, it adds count_relief_high to the
      relief fraction; when it is one of exactly two such returns, it adds count_relief_mid; otherwise it adds
      nothing.
      Business volume relief: when the net amounts, the amounts charged after item promotions and the Northgate Card discount, of the lines on the member's Northgate orders dated within
      the twelve whole calendar months before today total volume_high_usd or more, the return adds
      volume_relief_high to the relief fraction; when they total volume_mid_usd to less than volume_high_usd,
      it adds volume_relief_mid; otherwise it adds nothing.
      Bulk-line relief: a return from a line bought in bulk_units_high or more units adds bulk_relief_high to
      the relief fraction; one from a line bought in bulk_units_mid to fewer than bulk_units_high units adds
      bulk_relief_mid; a return from a single-unit line adds nothing.
      A reversal is owed on the return this schedule settles when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the
      units bought less every unit refunded without a return on the line, divided by the units bought and rounded
      half up to the cent, less the merchandise refunded on every return of the line, and otherwise nothing is
      reversed. A line's net amount is the amount charged for the
      line after item promotions and the Northgate Card discount. Each return record reverses
      cash at most once, and nothing is reversed when nothing was refunded.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [order_events.order_event_id, order_events.amount_usd, order_events.quantity, order_events.original_event_id, order_events.event_date]
        note: The share and relief schedules take their tiers from the member's return, line, adjustment and order records.
    compute:
      - return_ref: "XLATEST('order', 'order_events', 'order_event_id', date_field='event_date', event_type='order_return_line')"
      - refunded_merch: "XSUM('order', 'order_events', 'amount_usd', order_event_id=return_ref)"
      - return_units: "XSUM('order', 'order_events', 'quantity', order_event_id=return_ref)"
      - return_date: "XLATEST('order', 'order_events', 'event_date', order_event_id=return_ref) or NOW"
      - line_ref: "XLATEST('order', 'order_events', 'original_event_id', order_event_id=return_ref)"
      - line_units: "XSUM('order', 'order_events', 'quantity', order_event_id=line_ref)"
      - earning_ref: "LATEST('membership_events', 'membership_event_id', event_type='membership_cash_earn', source_order_event_id=line_ref)"
      - earned: "SUM('membership_events', 'amount_usd', membership_event_id=earning_ref)"
      - earned_basis: "SUM('membership_events', 'basis_amount_usd', membership_event_id=earning_ref)"
      - line_net_amount: "XSUM('order', 'order_events', 'amount_usd', order_event_id=line_ref)"
      - units_on_line_kind: "XSUM('order', 'order_events', 'quantity', event_type='order_return_line', original_event_id=line_ref)"
      - adjustments_on_line: "XCOUNT('order', 'order_events', event_type='order_adjust_price', original_event_id=line_ref)"
      - already_reversed: "SUM('membership_events', 'amount_usd', event_type='membership_cash_reverse', original_event_id=earning_ref)"
      - earning_rate: "earned / earned_basis if earned_basis > 0 else 0"
      - units_refunded_all: "XSUM('order', 'order_events', 'quantity', event_type='order_refund_charge', original_event_id=line_ref)"
      - returned_all: "XSUM('order', 'order_events', 'amount_usd', event_type='order_return_line', original_event_id=line_ref)"
      - kept_units_basis_now: "RND(line_net_amount * (line_units - units_refunded_all) / line_units + 0.000000001, 2) - returned_all if line_units > 0 else 0"
      - reversal_share: "earned - already_reversed if units_on_line_kind >= line_units else (earned * return_units / line_units if (units_on_line_kind < line_units and adjustments_on_line > 0) else earning_rate * refunded_merch)"
      - return_reason: "XLATEST('order', 'order_events', 'return_reason', order_event_id=return_ref)"
      - reason_fraction: "K('reason_relief_high') if (return_reason == 'wrong_item' or return_reason == 'damaged_in_transit') else (K('reason_relief_mid') if (return_reason == 'defective' or return_reason == 'not_as_described') else 0)"
      - months_at_event: "MONTHS(F('term_start_date') or return_date, return_date)"
      - tenure_fraction: "K('tenure_relief_high') if months_at_event >= K('tenure_months_high') else (K('tenure_relief_mid') if months_at_event >= K('tenure_months_mid') else 0)"
      - events_12m: "XCOUNT('order', 'order_events', within_months=12, date_field='event_date', event_type='order_return_line')"
      - count_fraction: "K('count_relief_high') if events_12m == 1 else (K('count_relief_mid') if events_12m == 2 else 0)"
      - lines_12m: "XSUM('order', 'order_events', 'amount_usd', within_months=12, date_field='event_date', event_type='order_post_line')"
      - volume_fraction: "K('volume_relief_high') if lines_12m >= K('volume_high_usd') else (K('volume_relief_mid') if lines_12m >= K('volume_mid_usd') else 0)"
      - bulk_units: "XSUM('order', 'order_events', 'quantity', order_event_id=line_ref)"
      - bulk_fraction: "K('bulk_relief_high') if bulk_units >= K('bulk_units_high') else (K('bulk_relief_mid') if bulk_units >= K('bulk_units_mid') else 0)"
      - relief_fraction: "reason_fraction + tenure_fraction + count_fraction + volume_fraction + bulk_fraction"
      - result: "0 if (refunded_merch <= 0 or earned <= 0 or ABS(earned_basis - kept_units_basis_now) < 0.005) else RND(reversal_share * (1 - relief_fraction) + 0.000000001, 2)"
    compute_basis:
      return_ref: "The return this Business schedule settles is the most recent return recorded on the member's Northgate orders, the one with the latest return date and, among returns of the same date, the one recorded first; the earning it reverses is the Northgate Cash earning that points to the returned line, and when no such return is recorded or no earning points to that line, nothing is reversed."
      refunded_merch: "The reversal share is the earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd."
      return_units: "Business closing-return share: when the units returned on all returns of the line reach the units bought on it, the reversal share is the earned amount less the Cash already reversed on that earning; when they fall short of the units bought and the line carries a price adjustment, the reversal share is the earned amount times the units on this return divided by the units bought; otherwise the reversal share is the earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd."
      return_date: "Business tenure relief: a return dated tenure_months_high or more whole calendar months after the membership's term start date adds tenure_relief_high to the relief fraction; one dated tenure_months_mid to fewer than tenure_months_high whole calendar months after it adds tenure_relief_mid; any other return adds nothing."
      line_ref: "The return this Business schedule settles is the most recent return recorded on the member's Northgate orders, the one with the latest return date and, among returns of the same date, the one recorded first; the earning it reverses is the Northgate Cash earning that points to the returned line, and when no such return is recorded or no earning points to that line, nothing is reversed."
      line_units: "Business closing-return share: when the units returned on all returns of the line reach the units bought on it, the reversal share is the earned amount less the Cash already reversed on that earning; when they fall short of the units bought and the line carries a price adjustment, the reversal share is the earned amount times the units on this return divided by the units bought; otherwise the reversal share is the earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd."
      earning_ref: "The return this Business schedule settles is the most recent return recorded on the member's Northgate orders, the one with the latest return date and, among returns of the same date, the one recorded first; the earning it reverses is the Northgate Cash earning that points to the returned line, and when no such return is recorded or no earning points to that line, nothing is reversed."
      earned: "The reversal share is the earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd."
      earned_basis: "The reversal share is the earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd."
      line_net_amount: "A reversal is owed on the return this schedule settles when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less every unit refunded without a return on the line, divided by the units bought and rounded half up to the cent, less the merchandise refunded on every return of the line, and otherwise nothing is reversed. A line's net amount is the amount charged for the line after item promotions and the Northgate Card discount."
      earning_rate: "The reversal share is the earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd."
      units_refunded_all: "A reversal is owed on the return this schedule settles when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less every unit refunded without a return on the line, divided by the units bought and rounded half up to the cent, less the merchandise refunded on every return of the line, and otherwise nothing is reversed. A line's net amount is the amount charged for the line after item promotions and the Northgate Card discount."
      returned_all: "A reversal is owed on the return this schedule settles when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less every unit refunded without a return on the line, divided by the units bought and rounded half up to the cent, less the merchandise refunded on every return of the line, and otherwise nothing is reversed. A line's net amount is the amount charged for the line after item promotions and the Northgate Card discount."
      kept_units_basis_now: "A reversal is owed on the return this schedule settles when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less every unit refunded without a return on the line, divided by the units bought and rounded half up to the cent, less the merchandise refunded on every return of the line, and otherwise nothing is reversed. A line's net amount is the amount charged for the line after item promotions and the Northgate Card discount."
      units_on_line_kind: "Business closing-return share: when the units returned on all returns of the line reach the units bought on it, the reversal share is the earned amount less the Cash already reversed on that earning; when they fall short of the units bought and the line carries a price adjustment, the reversal share is the earned amount times the units on this return divided by the units bought; otherwise the reversal share is the earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd."
      adjustments_on_line: "Business closing-return share: when the units returned on all returns of the line reach the units bought on it, the reversal share is the earned amount less the Cash already reversed on that earning; when they fall short of the units bought and the line carries a price adjustment, the reversal share is the earned amount times the units on this return divided by the units bought; otherwise the reversal share is the earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd."
      already_reversed: "Business closing-return share: when the units returned on all returns of the line reach the units bought on it, the reversal share is the earned amount less the Cash already reversed on that earning; when they fall short of the units bought and the line carries a price adjustment, the reversal share is the earned amount times the units on this return divided by the units bought; otherwise the reversal share is the earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd."
      reversal_share: "Business closing-return share: when the units returned on all returns of the line reach the units bought on it, the reversal share is the earned amount less the Cash already reversed on that earning; when they fall short of the units bought and the line carries a price adjustment, the reversal share is the earned amount times the units on this return divided by the units bought; otherwise the reversal share is the earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd."
      return_reason: "Business reason relief: a return with reason wrong item or damaged in transit adds reason_relief_high to the relief fraction; a return with reason defective or not as described adds reason_relief_mid; a return with any other reason adds nothing."
      reason_fraction: "Business reason relief: a return with reason wrong item or damaged in transit adds reason_relief_high to the relief fraction; a return with reason defective or not as described adds reason_relief_mid; a return with any other reason adds nothing."
      months_at_event: "Business tenure relief: a return dated tenure_months_high or more whole calendar months after the membership's term start date adds tenure_relief_high to the relief fraction; one dated tenure_months_mid to fewer than tenure_months_high whole calendar months after it adds tenure_relief_mid; any other return adds nothing."
      tenure_fraction: "Business tenure relief: a return dated tenure_months_high or more whole calendar months after the membership's term start date adds tenure_relief_high to the relief fraction; one dated tenure_months_mid to fewer than tenure_months_high whole calendar months after it adds tenure_relief_mid; any other return adds nothing."
      events_12m: "Business first-return relief: when the return is the only return recorded on the member's Northgate orders dated within the twelve whole calendar months before today, it adds count_relief_high to the relief fraction; when it is one of exactly two such returns, it adds count_relief_mid; otherwise it adds nothing."
      count_fraction: "Business first-return relief: when the return is the only return recorded on the member's Northgate orders dated within the twelve whole calendar months before today, it adds count_relief_high to the relief fraction; when it is one of exactly two such returns, it adds count_relief_mid; otherwise it adds nothing."
      lines_12m: "Business volume relief: when the net amounts, the amounts charged after item promotions and the Northgate Card discount, of the lines on the member's Northgate orders dated within the twelve whole calendar months before today total volume_high_usd or more, the return adds volume_relief_high to the relief fraction; when they total volume_mid_usd to less than volume_high_usd, it adds volume_relief_mid; otherwise it adds nothing."
      volume_fraction: "Business volume relief: when the net amounts, the amounts charged after item promotions and the Northgate Card discount, of the lines on the member's Northgate orders dated within the twelve whole calendar months before today total volume_high_usd or more, the return adds volume_relief_high to the relief fraction; when they total volume_mid_usd to less than volume_high_usd, it adds volume_relief_mid; otherwise it adds nothing."
      bulk_units: "Bulk-line relief: a return from a line bought in bulk_units_high or more units adds bulk_relief_high to the relief fraction; one from a line bought in bulk_units_mid to fewer than bulk_units_high units adds bulk_relief_mid; a return from a single-unit line adds nothing."
      bulk_fraction: "Bulk-line relief: a return from a line bought in bulk_units_high or more units adds bulk_relief_high to the relief fraction; one from a line bought in bulk_units_mid to fewer than bulk_units_high units adds bulk_relief_mid; a return from a single-unit line adds nothing."
      relief_fraction: "Every schedule below either sets the reversal share or adds a fraction to the relief fraction, and the fractions added are summed."
      result: "The Business return reversal is the reversal share times one less the relief fraction, rounded half up to the cent."
    factors:
      - id: business_closing_share
        effect: method
        decides: reversal_share
        bindings: [units_on_line_kind, adjustments_on_line, already_reversed, reversal_share]
        ladder:
          - when: "the units returned on the line reach the units bought on it"
            method: "the reversal share is the earned amount less the Cash already reversed on that earning"
          - when: "they fall short of the units bought and the line carries a price adjustment"
            method: "the reversal share is the earned amount times the units on this return divided by the units bought"
          - when: "otherwise"
            method: "the reversal share is the earned amount times the merchandise refunded divided by the earning's basis_amount_usd"
        baseline: {reversal_share: "earning_rate * refunded_merch"}
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: business_reason_relief
        effect: parameter
        decides: reason_fraction
        bindings: [return_reason, reason_fraction]
        ladder:
          - when: "the return's reason is wrong item or damaged in transit"
            value: "K('reason_relief_high')"
          - when: "the return's reason is defective or not as described"
            value: "K('reason_relief_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {reason_fraction: "0"}
        evidence: [cross_category]
        cross_difficulty: order
      - id: business_tenure_relief
        effect: parameter
        decides: tenure_fraction
        bindings: [months_at_event, tenure_fraction]
        ladder:
          - when: "the return is dated tenure_months_high or more whole calendar months after the membership's term start date"
            value: "K('tenure_relief_high')"
          - when: "it is dated tenure_months_mid to fewer than tenure_months_high whole calendar months after it"
            value: "K('tenure_relief_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {tenure_fraction: "0"}
        evidence: [date]
        cross_difficulty: null
      - id: business_count_relief
        effect: parameter
        decides: count_fraction
        bindings: [events_12m, count_fraction]
        ladder:
          - when: "the return is the only one of its kind on the member's Northgate orders dated within the twelve whole calendar months before today"
            value: "K('count_relief_high')"
          - when: "it is one of exactly two such returns"
            value: "K('count_relief_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {count_fraction: "0"}
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: business_volume_relief
        effect: parameter
        decides: volume_fraction
        bindings: [lines_12m, volume_fraction]
        ladder:
          - when: "the net amounts, the amounts charged after item promotions and the Northgate Card discount, of the lines on the member's Northgate orders dated within the twelve whole calendar months before today total volume_high_usd or more"
            value: "K('volume_relief_high')"
          - when: "they total volume_mid_usd to less than volume_high_usd"
            value: "K('volume_relief_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {volume_fraction: "0"}
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: bulk_line_relief
        effect: parameter
        decides: bulk_fraction
        bindings: [bulk_units, bulk_fraction]
        ladder:
          - when: "the returned line was bought in bulk_units_high or more units"
            value: "K('bulk_relief_high')"
          - when: "it was bought in bulk_units_mid to fewer than bulk_units_high units"
            value: "K('bulk_relief_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {bulk_fraction: "0"}
        evidence: [cross_category]
        cross_difficulty: order
