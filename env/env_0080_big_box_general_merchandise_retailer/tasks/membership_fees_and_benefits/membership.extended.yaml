      reversal_share: "Closing-return share: when the units returned on all returns of the line reach the units bought on it, the reversal share is the earned amount less the Cash already reversed on that earning; when the units returned fall short of the units bought and the line carries a price adjustment, the reversal share is the earned amount times the units returned on this return divided by the units bought; otherwise the reversal share is the earned amount times the merchandise refunded on the return divided by the earning's basis_amount_usd."
      return_reason: "Reason relief: a return with reason wrong item or damaged in transit adds reason_relief_high to the relief fraction; a return with reason defective or not as described adds reason_relief_mid; a return with any other reason adds nothing."
      reason_fraction: "Reason relief: a return with reason wrong item or damaged in transit adds reason_relief_high to the relief fraction; a return with reason defective or not as described adds reason_relief_mid; a return with any other reason adds nothing."
      months_at_return: "Tenure relief: a return dated tenure_months_high or more whole calendar months after the membership's term start date adds tenure_relief_high to the relief fraction; a return dated tenure_months_mid to fewer than tenure_months_high whole calendar months after it adds tenure_relief_mid; any other return adds nothing."
