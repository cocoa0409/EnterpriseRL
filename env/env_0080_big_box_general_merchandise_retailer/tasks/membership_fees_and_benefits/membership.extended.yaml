      last_use_on: "Money-back schedule: when the fee was charged no more than the tier's annual_full_refund_window_days days before the cancellation date and no benefit use is dated on or after the charge date, the refund core is the whole fee; when the fee was charged no more than that many days before and a benefit use is dated on or after the charge date, the refund core is the whole fee less the value of the benefit uses dated within the one whole calendar month before the cancellation date, never less than the prorated fee; otherwise the refund core is the prorated fee."
