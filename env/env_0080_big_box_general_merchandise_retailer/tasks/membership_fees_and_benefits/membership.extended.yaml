      first_return_fraction: "First-return relief: when the return is the only return recorded on the member's Northgate orders dated within the twelve whole calendar months before today, it adds first_return_relief_high to the relief fraction; when it is one of exactly two such returns, it adds first_return_relief_mid; otherwise it adds nothing."
      relief_fraction: "Every schedule below either sets the reversal share or adds a fraction to the relief fraction, and the fractions added are summed."
