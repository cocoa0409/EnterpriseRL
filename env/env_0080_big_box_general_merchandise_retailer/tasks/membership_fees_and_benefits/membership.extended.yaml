  - id: membership_ext_unreturned_refund_reversal
    base_policy_refs: [membership_evt_cash_reverse]
    overwrite:
      - base_policy: membership_evt_cash_reverse
        superseded_clause: >-
          When a line that earned Northgate Cash is returned for a refund, the cash earned on it is reversed
          in proportion to the merchandise amount refunded: earned amount x refunded merchandise amount / the
          earning's basis_amount_usd, rounded half up to the cent, the full earned amount when the whole line
          is refunded.
        replaced_by: >-
          For the most recent refund without a return made because an item was damaged on arrival or never received on
          the member's Northgate orders, the one with the latest refund date and, among refunds of one kind on that
          date, the one recorded first, and when a damaged-on-arrival refund and a never-received refund share that
          date, the damaged-on-arrival refund, on any membership, and only for that refund, the Northgate Cash reversed
          is worked out under this refund-without-return reversal schedule; the most recent return recorded on the
          member's Northgate orders, the one with the latest return date and, among returns of the same date, the one
          recorded first is worked out under the consumer return reversal schedule or the Business return reversal
          schedule, and every return or refund that none of the consumer return, Business return and refund-without-return reversal schedules settles stays under the base reversal rule, which no schedule of this
          charter prices or posts, reversing the Cash earned on a line returned or refunded in proportion to the
          merchandise amount refunded, earned amount x refunded merchandise amount / the earning's basis_amount_usd,
          rounded half up to the cent, and the full earned amount when the whole line is refunded.
    trigger: state_due
    subject: [membership_cash_reverse]
    computes: amount_usd
    target_tool: reverse_unreturned_refund_cash_522719bc
    params:
      reason_relief_high: 0.2
      reason_relief_mid: 0.1
      tenure_months_high: 24
      tenure_months_mid: 12
      tenure_relief_high: 0.1
      tenure_relief_mid: 0.05
      count_relief_high: 0.1
      count_relief_mid: 0.05
      volume_high_usd: 5000
      volume_mid_usd: 2000
      volume_relief_high: 0.1
      volume_relief_mid: 0.05
    rule: >-
      For the most recent refund without a return made because an item was damaged on arrival or never received on
      the member's Northgate orders, the one with the latest refund date and, among refunds of one kind on that
      date, the one recorded first, and when a damaged-on-arrival refund and a never-received refund share that
      date, the damaged-on-arrival refund, on any membership, and only for that refund, the Northgate Cash reversed
      is worked out under this refund-without-return reversal schedule; the most recent return recorded on the
      member's Northgate orders, the one with the latest return date and, among returns of the same date, the one
      recorded first is worked out under the consumer return reversal schedule or the Business return reversal
      schedule, and every return or refund that none of the consumer return, Business return and refund-without-return reversal schedules settles stays under the base reversal rule, which no schedule of this
      charter prices or posts, reversing the Cash earned on a line returned or refunded in proportion to the
      merchandise amount refunded, earned amount x refunded merchandise amount / the earning's basis_amount_usd,
      rounded half up to the cent, and the full earned amount when the whole line is refunded.
      The refund this schedule settles is the most recent refund without a return made because an item was damaged
      on arrival or never received on the member's Northgate orders, the one with the latest refund date and, among
      refunds of one kind on that date, the one recorded first, and when a damaged-on-arrival refund and a
      never-received refund share that date, the damaged-on-arrival refund; the earning it reverses is the Northgate
      Cash earning that points to the refunded line, and when no such refund is recorded or no earning points to
      that line, nothing is reversed.
      The unreturned refund reversal is the reversal share times one less the relief fraction, rounded half up
      to the cent.
      The reversal share is the earned amount times the merchandise refunded on the refund divided by the
      earning's basis_amount_usd.
      The relief fraction is zero.
      Every schedule below either sets the reversal share or adds a fraction to the relief fraction, and the
      fractions added are summed.
      Closing-refund share: when the units refunded without a return on all such refunds of the line reach the
      units bought on it, the reversal share is the earned amount less the Cash already reversed on that
      earning; when they fall short of the units bought and the line carries a price adjustment, the reversal
      share is the earned amount times the units on this refund divided by the units bought; otherwise the
      reversal share is the earned amount times the merchandise refunded on the refund divided by the
      earning's basis_amount_usd.
      Refund reason relief: a refund made because the item was damaged on arrival adds reason_relief_high to the
      relief fraction; a refund made because the item was never received on a Northgate Ship to Home, Northgate
      Same-Day Delivery or Northgate Scheduled Large-Item Delivery order adds reason_relief_mid; a refund made
      because the item was never received on any other order adds nothing.
      Unreturned-refund tenure relief: a refund dated tenure_months_high or more whole calendar months after
      the membership's term start date adds tenure_relief_high to the relief fraction; one dated
      tenure_months_mid to fewer than tenure_months_high whole calendar months after it adds
      tenure_relief_mid; any other refund adds nothing.
      Unreturned-refund count relief: when the refund is the only refund without a return made because an item was damaged on arrival or never received that is recorded on the member's Northgate orders dated within the twelve whole calendar months before today, it adds
      count_relief_high to the relief fraction; when it is one of exactly two such refunds, it adds
      count_relief_mid; otherwise it adds nothing.
      Unreturned-refund volume relief: when the net amounts, the amounts charged after item promotions and the Northgate Card discount, of the lines on the member's Northgate orders dated within the twelve whole calendar months before today total volume_high_usd or more, the refund
      adds volume_relief_high to the relief fraction; when they total volume_mid_usd to less than
      volume_high_usd, it adds volume_relief_mid; otherwise it adds nothing.
      A reversal is owed on the refund this schedule settles when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the
      units bought less every unit refunded without a return on the line, divided by the units bought and rounded
      half up to the cent, less the merchandise refunded on every return of the line, and otherwise nothing is
      reversed. A line's net amount is the amount charged for the
      line after item promotions and the Northgate Card discount. Each refund record reverses
      cash at most once, and nothing is reversed when nothing was refunded.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [order_events.order_event_id, order_events.amount_usd, order_events.quantity, order_events.original_event_id, order_events.event_date]
        note: The share and relief schedules take their tiers from the member's refund, line, adjustment and order records.
    compute:
      - damaged_ref: "XLATEST('order', 'order_events', 'order_event_id', date_field='event_date', event_type='order_refund_charge', refund_reason='item_damaged_no_return')"
      - damaged_on: "XLATEST('order', 'order_events', 'event_date', date_field='event_date', event_type='order_refund_charge', refund_reason='item_damaged_no_return')"
      - missing_ref: "XLATEST('order', 'order_events', 'order_event_id', date_field='event_date', event_type='order_refund_charge', refund_reason='item_not_received')"
      - missing_on: "XLATEST('order', 'order_events', 'event_date', date_field='event_date', event_type='order_refund_charge', refund_reason='item_not_received')"
      - return_ref: "damaged_ref if (damaged_on or '0000-00-00') >= (missing_on or '0000-00-00') else missing_ref"
      - refunded_merch: "XSUM('order', 'order_events', 'amount_usd', order_event_id=return_ref)"
      - return_units: "XSUM('order', 'order_events', 'quantity', order_event_id=return_ref)"
      - return_date: "XLATEST('order', 'order_events', 'event_date', order_event_id=return_ref) or NOW"
      - line_ref: "XLATEST('order', 'order_events', 'original_event_id', order_event_id=return_ref)"
      - line_units: "XSUM('order', 'order_events', 'quantity', order_event_id=line_ref)"
      - earning_ref: "LATEST('membership_events', 'membership_event_id', event_type='membership_cash_earn', source_order_event_id=line_ref)"
      - earned: "SUM('membership_events', 'amount_usd', membership_event_id=earning_ref)"
      - earned_basis: "SUM('membership_events', 'basis_amount_usd', membership_event_id=earning_ref)"
      - line_net_amount: "XSUM('order', 'order_events', 'amount_usd', order_event_id=line_ref)"
      - units_on_line_kind: "XSUM('order', 'order_events', 'quantity', event_type='order_refund_charge', original_event_id=line_ref)"
      - adjustments_on_line: "XCOUNT('order', 'order_events', event_type='order_adjust_price', original_event_id=line_ref)"
      - already_reversed: "SUM('membership_events', 'amount_usd', event_type='membership_cash_reverse', original_event_id=earning_ref)"
      - earning_rate: "earned / earned_basis if earned_basis > 0 else 0"
      - units_refunded_all: "XSUM('order', 'order_events', 'quantity', event_type='order_refund_charge', original_event_id=line_ref)"
      - returned_all: "XSUM('order', 'order_events', 'amount_usd', event_type='order_return_line', original_event_id=line_ref)"
      - kept_units_basis_now: "RND(line_net_amount * (line_units - units_refunded_all) / line_units + 0.000000001, 2) - returned_all if line_units > 0 else 0"
      - reversal_share: "earned - already_reversed if units_on_line_kind >= line_units else (earned * return_units / line_units if (units_on_line_kind < line_units and adjustments_on_line > 0) else earning_rate * refunded_merch)"
      - return_reason: "XLATEST('order', 'order_events', 'refund_reason', order_event_id=return_ref)"
      - refund_program: "XLATEST('order', 'order_holdings', 'variant_name', date_field='order_date', order_id=XLATEST('order', 'order_events', 'order_id', order_event_id=return_ref))"
      - reason_fraction: "K('reason_relief_high') if return_reason == 'item_damaged_no_return' else (K('reason_relief_mid') if (return_reason == 'item_not_received' and (refund_program == 'Northgate Ship to Home' or refund_program == 'Northgate Same-Day Delivery' or refund_program == 'Northgate Scheduled Large-Item Delivery')) else 0)"
      - months_at_event: "MONTHS(F('term_start_date') or return_date, return_date)"
      - tenure_fraction: "K('tenure_relief_high') if months_at_event >= K('tenure_months_high') else (K('tenure_relief_mid') if months_at_event >= K('tenure_months_mid') else 0)"
      - events_12m: "XCOUNT('order', 'order_events', within_months=12, date_field='event_date', event_type='order_refund_charge', refund_reason='item_damaged_no_return') + XCOUNT('order', 'order_events', within_months=12, date_field='event_date', event_type='order_refund_charge', refund_reason='item_not_received')"
      - count_fraction: "K('count_relief_high') if events_12m == 1 else (K('count_relief_mid') if events_12m == 2 else 0)"
      - lines_12m: "XSUM('order', 'order_events', 'amount_usd', within_months=12, date_field='event_date', event_type='order_post_line')"
      - volume_fraction: "K('volume_relief_high') if lines_12m >= K('volume_high_usd') else (K('volume_relief_mid') if lines_12m >= K('volume_mid_usd') else 0)"
      - relief_fraction: "reason_fraction + tenure_fraction + count_fraction + volume_fraction"
      - result: "0 if (refunded_merch <= 0 or earned <= 0 or ABS(earned_basis - kept_units_basis_now) < 0.005) else RND(reversal_share * (1 - relief_fraction) + 0.000000001, 2)"
