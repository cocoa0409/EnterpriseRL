events:
  - type: membership_enroll
    target: membership_holdings
    mutation: create
    meaning: A customer enrolls in a Northgate Rewards or Northgate+ tier and the membership record is opened in the enrolled state.
    grain: One row per membership enrollment.
    fields:
      variant_name: Official tier name chosen at enrollment.
      enrolled_date: Date of enrollment (YYYY-MM-DD).
      auto_renew: Whether renewal is on; true for paid tiers at enrollment, false for the free tier.
      payment_method_type: How paid fees are charged (northgate_card, external_card, or none for the free tier).
      card_account_id: The Northgate Card account charged for fees when payment_method_type is northgate_card; empty otherwise.
      eligibility_program: The eligibility program claimed for Assist, Student or Business tiers; none otherwise.
    triggers:
      - event: membership:membership_activate
        when: {variant_name: Northgate Rewards}
        map: {term_start_date: enrolled_date}
  - type: membership_start_trial
    target: membership_holdings
    mutation: {transition: {from: enrolled, to: trial}}
    meaning: A first-time paid member starts the free trial of the tier.
    grain: One row per transaction.
    fields:
      trial_end_date: Last day of the trial, enrollment date plus the tier's free trial days.
      term_start_date: Set equal to the enrollment date.
    triggers: []
  - type: membership_activate
    target: membership_holdings
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The membership becomes active, either the free tier at once or a paid tier on settlement of its first fee without a trial.
    grain: One row per transaction.
    fields:
      term_start_date: First day of the first term.
      renewal_date: Next fee date for paid tiers; empty for the free tier.
      eligibility_verified_date: Date eligibility proof was confirmed for Assist, Student or Business; empty otherwise.
    triggers: []
  - type: membership_decline_eligibility
    target: membership_holdings
    mutation: {transition: {from: enrolled, to: canceled}}
    meaning: An enrollment whose eligibility proof cannot be confirmed is closed without charge.
    grain: One row per transaction.
    fields:
      canceled_date: Date the enrollment was closed.
    triggers: []
  - type: membership_convert_trial
    target: membership_holdings
    mutation: {transition: {from: trial, to: active}}
    meaning: The trial ends and the membership converts to paid on the trial end date.
    grain: One row per transaction.
    fields:
      term_start_date: The trial end date, which is the first paid day and the start of the first billing period.
      renewal_date: The next renewal date, term_start_date plus the tier's term_months.
    triggers: []
  - type: membership_cancel_trial
    target: membership_holdings
    mutation: {transition: {from: trial, to: canceled}}
    meaning: The member cancels during the trial and no fee is ever charged.
    grain: One row per transaction.
    fields:
      canceled_date: Date of cancellation.
    triggers: []
  - type: membership_place_payment_hold
    target: membership_holdings
    mutation: {transition: {from: active, to: payment_hold}}
    meaning: A scheduled renewal fee is declined and the membership moves to payment hold.
    grain: One row per transaction.
    fields:
      payment_hold_date: Date of the first declined renewal attempt.
    triggers: []
  - type: membership_clear_payment_hold
    target: membership_holdings
    mutation: {transition: {from: payment_hold, to: active}}
    meaning: The outstanding renewal fee settles on a retry or a new payment method and benefits resume.
    grain: One row per transaction.
    fields:
      renewal_date: Next renewal date, counted from the original renewal date that was declined, not from the settlement date.
    triggers: []
  - type: membership_lapse
    target: membership_holdings
    mutation: {transition: {from: payment_hold, to: canceled}}
    meaning: The payment hold grace period ends unpaid and the membership closes.
    grain: One row per transaction.
    fields:
      canceled_date: Last day of the grace period plus one.
    triggers: []
  - type: membership_schedule_cancel
    target: membership_holdings
    mutation: {transition: {from: active, to: cancel_pending}}
    meaning: The member turns off auto-renew; paid benefits continue until the renewal date.
    grain: One row per transaction.
    fields:
      auto_renew: Set to false.
    triggers: []
  - type: membership_resume
    target: membership_holdings
    mutation: {transition: {from: cancel_pending, to: active}}
    meaning: The member turns auto-renew back on before the renewal date.
    grain: One row per transaction.
    fields:
      auto_renew: Set to true.
    triggers: []
  - type: membership_end_term
    target: membership_holdings
    mutation: {transition: {from: cancel_pending, to: canceled}}
    meaning: The term ends with auto-renew off and the membership closes without renewal.
    grain: One row per transaction.
    fields:
      canceled_date: The renewal date on which the term ended.
    triggers: []
  - type: membership_cancel_immediate
    target: membership_holdings
    mutation: {transition: {from: active, to: canceled}}
    meaning: The member cancels immediately (free tier, or an annual-billed tier) and any fee refund is evaluated.
    grain: One row per transaction.
    fields:
      canceled_date: Date of cancellation.
    triggers: []
  - type: membership_change_plan
    target: membership_holdings
    mutation: update
    meaning: The member's tier changes between paid tiers, or an Assist or Student membership moves to its fallback tier after re-verification lapses.
    grain: One row per tier change.
    fields:
      variant_name: The new tier.
      billing_cycle: Billing cycle of the new tier.
      renewal_date: Renewal date after the change.
      eligibility_verified_date: Refreshed when a re-verification is completed.
    triggers: []
  - type: membership_update_payment
    target: membership_holdings
    mutation: update
    meaning: The payment method charged for membership fees is changed.
    grain: One row per change.
    fields:
      payment_method_type: northgate_card or external_card.
      card_account_id: The Northgate Card account charged when payment_method_type is northgate_card; empty otherwise.
    triggers: []
  - type: membership_update_household
    target: membership_holdings
    mutation: update
    meaning: The member adds or removes a household member, or a Business member changes the number of employee seats in use.
    grain: One row per change.
    fields:
      household_member_count: Number of additional household members sharing benefits.
      business_user_count: Number of employee seats in use.
    triggers: []
  - type: membership_fee_charge
    target: membership_events
    meaning: A membership fee settles for one billing period.
    grain: One row per settled fee per billing period.
    distinguish_by: [billing_period_start, fee_type]
    fields:
      event_date: Date the fee settled.
      amount_usd: Fee charged, positive.
      fee_type: monthly_fee or annual_fee.
      billing_period_start: First day of the billing period the fee pays for.
      tier_at_event: Tier whose fee was charged.
      payment_method_type: Method charged.
      card_account_id: Northgate Card account charged, if any.
    account: membership_fees
    direction: in
    triggers:
      - event: card:card_post_purchase
        when: {payment_method_type: northgate_card}
        map: {card_account_id: card_account_id, amount_usd: amount_usd, event_date: event_date, merchant_type: northgate_membership}
  - type: membership_fee_decline
    target: membership_events
    meaning: A scheduled renewal fee or a retry is declined by the payment method.
    grain: One row per declined attempt.
    distinguish_by: [billing_period_start, attempt_number]
    fields:
      event_date: Date of the declined attempt.
      amount_usd: Fee that was attempted.
      billing_period_start: Billing period the attempt was for.
      attempt_number: 0 for the scheduled renewal attempt, 1 and up for retries.
    triggers:
      - event: membership:membership_place_payment_hold
        when: {attempt_number: 0}
        map: {payment_hold_date: event_date}
  - type: membership_fee_refund
    target: membership_events
    meaning: All or part of one settled membership fee is refunded.
    grain: One row per refund of one fee charge.
    distinguish_by: [original_event_id, refund_basis]
    fields:
      event_date: Date the refund was issued.
      amount_usd: Amount refunded, positive.
      original_event_id: The membership fee charge being refunded.
      refund_basis: full_within_window, prorated_unused_months or billing_error.
      payment_method_type: Method credited, the same method the fee was charged to.
      card_account_id: Northgate Card account credited, if any.
    account: membership_fees
    direction: out
    triggers:
      - event: card:card_post_credit
        when: {payment_method_type: northgate_card}
        map: {card_account_id: card_account_id, amount_usd: amount_usd, event_date: event_date, merchant_type: northgate_membership}
  - type: membership_benefit_use
    target: membership_events
    meaning: A membership benefit is applied, recording the fee the member avoided.
    grain: One row per benefit applied to one order, or per streaming activation.
    distinguish_by: [order_id, benefit_type, event_date]
    fields:
      event_date: Date the benefit was applied (the order date, or the activation date).
      benefit_type: free_standard_shipping, free_same_day_delivery, member_same_day_fee, member_express_fee, free_return_pickup or streaming_activation.
      order_id: The Northgate order the benefit was applied to; empty for streaming_activation.
      amount_usd: Value of the benefit (fee avoided), positive.
    triggers: []
  - type: membership_cash_earn
    target: membership_events
    meaning: Northgate Cash is earned on a fulfilled eligible order line.
    grain: One row per earning order line.
    distinguish_by: [source_order_event_id]
    fields:
      event_date: Date the line was fulfilled.
      amount_usd: Northgate Cash earned, positive.
      basis_amount_usd: Eligible net merchandise amount of the line the earn rate was applied to, positive.
      order_id: The order the line belongs to.
      source_order_event_id: The order line that earned the cash.
    account: rewards_cash
    direction: in
    triggers: []
  - type: membership_cash_redeem
    target: membership_events
    meaning: Northgate Cash is applied as payment on an order.
    grain: One row per redemption on one order.
    distinguish_by: [order_id, event_date]
    fields:
      event_date: Date of redemption.
      amount_usd: Northgate Cash applied, positive.
      order_id: The order paid in part with Northgate Cash.
    account: rewards_cash
    direction: out
    triggers: []
  - type: membership_cash_reverse
    target: membership_events
    meaning: Northgate Cash earned on a line is reversed because the line was returned or refunded.
    grain: One row per return of one earning line.
    distinguish_by: [source_order_event_id]
    fields:
      event_date: Date the return was processed.
      amount_usd: Northgate Cash reversed, positive.
      basis_amount_usd: Merchandise amount refunded by the return that caused the reversal, positive.
      order_id: The order of the returned line.
      original_event_id: The membership_cash_earn row being reversed.
      source_order_event_id: The order return record that caused the reversal.
    account: rewards_cash
    direction: out
    triggers: []
  - type: membership_cash_expire
    target: membership_events
    meaning: Unredeemed Northgate Cash from one earning expires.
    grain: One row per expiring earning.
    distinguish_by: [original_event_id]
    fields:
      event_date: Expiry date.
      amount_usd: Northgate Cash expired, positive.
      original_event_id: The membership_cash_earn row whose unredeemed remainder expires.
    account: rewards_cash
    direction: out
    triggers: []

measures:
  - id: membership_msr_recent_paid_fees
    window: The trial_lookback_months calendar months ending on the enrollment date of the membership being evaluated, inclusive of both ends.
    measure: Count of membership_fee_charge rows on any membership record of the same customer whose event_date falls in the window.
  - id: membership_msr_benefit_uses_since_charge
    window: From the event_date of the fee charge being evaluated through the cancellation date, inclusive.
    measure: Count of membership_benefit_use rows on the same membership record whose event_date falls in the window.
  - id: membership_msr_unused_full_months
    window: From the cancellation date to the membership's renewal_date.
    measure: The largest whole number n such that the cancellation date plus n calendar months (falling back to the last day of a shorter month) is on or before renewal_date.
  - id: membership_msr_declines_in_hold
    window: The billing period whose renewal fee was declined, identified by billing_period_start.
    measure: Count of membership_fee_decline rows on the membership with that billing_period_start.
  - id: membership_msr_cash_earned_ytd
    window: The calendar year (January 1 through December 31) containing the earn date being evaluated.
    measure: Sum of amount_usd of membership_cash_earn rows on the membership with event_date in that year, not reduced by reversals or expirations.
  - id: membership_msr_student_months
    window: The customer's whole membership history up to the date being evaluated.
    measure: Count of membership_fee_charge rows on any membership record of the customer whose tier_at_event is Northgate+ Student.

policies:
  - id: membership_agg_multi_holding
    subject: [membership_enroll]
    rule: >-
      A customer profile may hold only one Northgate Rewards or Northgate+ membership at a time. Enrollment is accepted
      only when the customer has no other membership record in enrolled, trial, active, payment_hold or cancel_pending status.
      A canceled membership does not count and a customer may re-enroll after it closes. Moving between tiers is a plan
      change on the existing record, never a second enrollment. Household members and Business employee seats share the
      holder's benefits and never hold their own record.
    eligibility:
      - id: one_open_membership
        applies_to: [membership_enroll]
        kind: dedup
        condition: Enrollment is accepted only when the customer has no other membership record in enrolled, trial, active, payment_hold or cancel_pending status.
        evidence_fields: [membership_holdings.customer_id, membership_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.customer_id]
          action_bindings:
            membership_holdings.customer_id: customer_id
        dedup_contract:
          table: membership_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [enrolled, trial, active, payment_hold, cancel_pending]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: membership_enrollment_eligibility
    subject: [membership_enroll, membership_activate, membership_decline_eligibility]
    rule: >-
      Each tier admits only the customers its entry gate describes. The tier is open only to a customer whose profile
      customer type is listed in that tier's entry gate. Age is the customer's whole years of age on the enrollment date,
      computed from the profile date of birth, and must be at least the tier's minimum_age_years. Northgate+ Assist,
      Northgate+ Student and Northgate+ Business additionally require one of the tier's eligibility_proof_types to be
      confirmed by Northgate's eligibility verification partner; the confirmation date is recorded as
      eligibility_verified_date on activation, and an enrollment whose proof is not confirmed is closed through
      membership_decline_eligibility with no fee charged. Northgate Rewards, Northgate+ Monthly and Northgate+ Annual need
      no proof. A membership can be activated or declined only while it is in enrolled status. A customer's own statement
      that they receive SNAP or Medicaid benefits, are enrolled as a student or operate a business is never a substitute
      for the partner's confirmation.
    eligibility:
      - id: customer_type_admitted
        applies_to: [membership_enroll]
        kind: authorization
        condition: The tier is open only to a customer whose profile customer type is listed in that tier's entry gate.
        evidence_fields: [customers.customer_type, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: enrolled_only
        applies_to: [membership_activate, membership_decline_eligibility]
        kind: state
        condition: A membership can be activated or declined only while it is in enrolled status.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [enrolled]
    params:
      per_tier:
        Northgate Rewards: {minimum_age_years: "=minimum_age_years", eligibility_proof_types: "=eligibility_proof_types"}
        Northgate+ Assist: {minimum_age_years: "=minimum_age_years", eligibility_proof_types: "=eligibility_proof_types"}
        Northgate+ Student: {minimum_age_years: "=minimum_age_years", eligibility_proof_types: "=eligibility_proof_types"}
        Northgate+ Monthly: {minimum_age_years: "=minimum_age_years", eligibility_proof_types: "=eligibility_proof_types"}
        Northgate+ Annual: {minimum_age_years: "=minimum_age_years", eligibility_proof_types: "=eligibility_proof_types"}
        Northgate+ Business: {minimum_age_years: "=minimum_age_years", eligibility_proof_types: "=eligibility_proof_types"}

  - id: membership_trial
    subject: [membership_start_trial, membership_convert_trial, membership_cancel_trial]
    rule: >-
      A free trial is offered only on a tier whose free_trial_days is greater than zero, and only when
      membership_msr_recent_paid_fees is zero, that is, no membership fee settled for the customer within the tier's
      trial_lookback_months before the enrollment date; where trial_payment_method_required is true a payment method must
      be on file at enrollment. The trial starts on the enrollment date and the trial end date is the enrollment date plus
      the tier's free_trial_days calendar days. On the trial end date the membership converts to active, the trial end
      date becomes term_start_date and the first fee is charged under membership_evt_fee_charge. A trial can be canceled
      free of charge only when the cancellation date is earlier than the enrollment date plus the tier's free trial days. Calendar days are added to the enrollment date, the day after enrollment being day 1, and the cancellation date must fall strictly before the resulting date.
      A cancellation request made on or after that date is handled as a cancellation of the converted paid membership
      under membership_cancellation. A trial gives the full benefits of the tier and is recorded through
      membership_benefit_use like any paid term. A customer whose recent fee count is above zero enrolls directly into
      the paid term with no trial.
    eligibility:
      - id: trial_cancel_before_end
        applies_to: [membership_cancel_trial]
        kind: time
        condition: A trial can be canceled free of charge only when the cancellation date is earlier than the enrollment date plus the tier's free trial days. Calendar days are added to the enrollment date, the day after enrollment being day 1, and the cancellation date must fall strictly before the resulting date.
        evidence_fields: [membership_holdings.enrolled_date, membership_holdings.trial_end_date, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the enrollment date
          anchor_source: membership_holdings.enrolled_date
          relation: not_after
          duration_source: variants.free_trial_days
          unit: calendar_days
          counting_rule: Calendar days are added to the enrollment date, the day after enrollment being day 1, and the cancellation date must fall strictly before the resulting date.
          boundary: exclusive
    measures: [membership_msr_recent_paid_fees]
    params:
      per_tier:
        Northgate Rewards: {free_trial_days: "=free_trial_days"}
        Northgate+ Assist: {free_trial_days: "=free_trial_days"}
        Northgate+ Student: {free_trial_days: "=free_trial_days"}
        Northgate+ Monthly: {free_trial_days: "=free_trial_days"}
        Northgate+ Annual: {free_trial_days: "=free_trial_days"}
        Northgate+ Business: {free_trial_days: "=free_trial_days"}

  - id: membership_evt_fee_charge
    subject: [membership_fee_charge, membership_fee_decline, membership_activate, membership_convert_trial]
    rule: >-
      Paid tiers are charged the tier's fee_amount_usd once per billing period; Northgate Rewards is never charged. The
      tier charged is the tier recorded on the membership on the billing period start date, and a plan change takes
      effect only from the next renewal date. Billing periods start on term_start_date and then every term_months calendar
      months on the same calendar day, falling back to the last day of a shorter month; renewal_date is always the start
      of the next billing period. The fee is charged on the billing period start date to the payment method recorded on
      the membership, and a fee charged to a Northgate Card posts to that card account as a purchase. A renewal fee is
      charged only on a membership in enrolled, trial, active or payment_hold status. A membership in cancel_pending or
      canceled status is never charged again. A Northgate+ Student membership whose membership_msr_student_months has
      reached max_discounted_months is charged at the Northgate+ Monthly fee from the next renewal through
      membership_plan_change. Fees are not prorated when a period starts, and the Northgate Card cardholder discount never
      applies to membership fees. A declined scheduled attempt is recorded with attempt_number 0 and is handled under
      membership_evt_payment_hold.
      Renewal fees fall on the day set by fee_charge_day_basis. A reminder is sent trial_conversion_notice_days days before a trial converts and annual_renewal_notice_days days before an annual renewal; reminders do not move the charge date.
    eligibility:
      - id: chargeable_status
        applies_to: [membership_fee_charge]
        kind: state
        condition: A renewal fee is charged only on a membership in enrolled, trial, active or payment_hold status.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [enrolled, trial, active, payment_hold]
    measures: [membership_msr_student_months]
    formula:
      amount_usd: fee_amount_usd
    params:
      per_tier:
        Northgate Rewards: {fee_amount_usd: "=fee_amount_usd", billing_cycle: "=billing_cycle", term_months: "=term_months"}
        Northgate+ Assist: {fee_amount_usd: "=fee_amount_usd", billing_cycle: "=billing_cycle", term_months: "=term_months"}
        Northgate+ Student: {fee_amount_usd: "=fee_amount_usd", billing_cycle: "=billing_cycle", term_months: "=term_months"}
        Northgate+ Monthly: {fee_amount_usd: "=fee_amount_usd", billing_cycle: "=billing_cycle", term_months: "=term_months"}
        Northgate+ Annual: {fee_amount_usd: "=fee_amount_usd", billing_cycle: "=billing_cycle", term_months: "=term_months"}
        Northgate+ Business: {fee_amount_usd: "=fee_amount_usd", billing_cycle: "=billing_cycle", term_months: "=term_months"}

  - id: membership_evt_fee_refund
    subject: [membership_fee_refund, membership_cancel_immediate]
    rule: >-
      A fee refund always refers to one settled fee charge, identified by its membership event reference, and is credited
      to the payment method that fee was charged to. Each fee charge is refunded at most once. On an immediate cancellation
      of an annual-billed tier the refund is evaluated against the most recent settled fee charge on the membership. A full
      refund applies only when the immediate cancellation date is no later than the fee charge date plus the tier's annual
      full refund window days. Calendar days are added to the fee charge date, the day after the charge being day 1, and a cancellation on the last day of the window still qualifies. The full refund also requires membership_msr_benefit_uses_since_charge to be zero, and its refund basis is full_within_window. Otherwise, where prorated_refund_on_cancel is true, the refund is fee x
      membership_msr_unused_full_months / term_months rounded down to the cent, with basis prorated_unused_months, and no
      refund is made when that count is zero. Monthly-billed tiers and the free tier receive no refund on cancellation;
      their paid benefits run to the end of the billing period instead. Independently of tier and timing, a billing error
      is refunded in full with basis billing_error: a second settled fee carrying the same billing_period_start as an
      earlier one, or a fee whose billing_period_start is on or after the date a confirmed cancellation took effect. A
      refund never exceeds the fee it refers to, and benefits already used are never billed back.
      The benefit-use condition applies where full_refund_requires_no_benefit_use is true, proration follows prorated_refund_basis and refund_rounding, and billing errors are refunded under billing_error_refund.
    eligibility:
      - id: full_refund_window
        applies_to: [membership_fee_refund]
        kind: time
        condition: A full refund applies only when the immediate cancellation date is no later than the fee charge date plus the tier's annual full refund window days.
        evidence_fields: [membership_events.event_date, membership_events.membership_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_events.membership_event_id]
          action_bindings:
            membership_events.membership_event_id: original_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fee charge date
          anchor_source: membership_events.event_date
          relation: not_after
          duration_source: variants.annual_full_refund_window_days
          unit: calendar_days
          counting_rule: Calendar days are added to the fee charge date, the day after the charge being day 1, and a cancellation on the last day of the window still qualifies.
          boundary: inclusive
      - id: refund_once
        applies_to: [membership_fee_refund]
        kind: dedup
        condition: Each fee charge is refunded at most once.
        evidence_fields: [membership_events.original_event_id, membership_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_events.original_event_id]
          action_bindings:
            membership_events.original_event_id: original_event_id
        dedup_contract:
          table: membership_events
          mode: separate_record
          object_bindings: {original_event_id: original_event_id}
          duplicate_filters: {event_type: [membership_fee_refund]}
          distinct_fields: []
    measures: [membership_msr_benefit_uses_since_charge, membership_msr_unused_full_months]
    formula:
      when: refund_basis == 'prorated_unused_months'
      amount_usd: fee_amount_usd * membership_msr_unused_full_months / term_months
    params:
      per_tier:
        Northgate Rewards: {annual_full_refund_window_days: "=annual_full_refund_window_days", prorated_refund_on_cancel: "=prorated_refund_on_cancel"}
        Northgate+ Assist: {annual_full_refund_window_days: "=annual_full_refund_window_days", prorated_refund_on_cancel: "=prorated_refund_on_cancel"}
        Northgate+ Student: {annual_full_refund_window_days: "=annual_full_refund_window_days", prorated_refund_on_cancel: "=prorated_refund_on_cancel"}
        Northgate+ Monthly: {annual_full_refund_window_days: "=annual_full_refund_window_days", prorated_refund_on_cancel: "=prorated_refund_on_cancel"}
        Northgate+ Annual: {annual_full_refund_window_days: "=annual_full_refund_window_days", prorated_refund_on_cancel: "=prorated_refund_on_cancel"}
        Northgate+ Business: {annual_full_refund_window_days: "=annual_full_refund_window_days", prorated_refund_on_cancel: "=prorated_refund_on_cancel"}

  - id: membership_evt_payment_hold
    subject: [membership_fee_decline, membership_place_payment_hold, membership_clear_payment_hold, membership_lapse]
    rule: >-
      When the scheduled renewal attempt (attempt_number 0) is declined, the membership moves to payment_hold on that date,
      which is recorded as payment_hold_date. Automatic retries run every payment_retry_interval_days calendar days after the
      decline, up to payment_retry_attempts retries, each declined retry being recorded with the next attempt_number. The
      member may also update the payment method and have the outstanding fee charged at once. Paid benefits do not apply
      while the membership is on payment hold, and orders placed during the hold are charged the fees a non-member pays.
      A payment hold can be cleared only on or before the payment hold date plus the tier's payment hold grace days. Calendar days are added to the payment hold date, the day after the decline being day 1, and settlement on the last day of the grace period still clears the hold. When
      the outstanding fee settles the membership returns to active and the renewal_date is counted from the declined
      billing_period_start, not from the settlement date, so the member does not gain extra days. A membership still unpaid
      after the last day of the grace period lapses to canceled on the following day; no fee is owed for the unpaid period
      and the lapse is never reported as a member-initiated cancellation. A membership on payment hold cannot be scheduled
      for cancellation; it either clears or lapses.
    eligibility:
      - id: clear_within_grace
        applies_to: [membership_clear_payment_hold]
        kind: time
        condition: A payment hold can be cleared only on or before the payment hold date plus the tier's payment hold grace days. Calendar days are added to the payment hold date, the day after the decline being day 1, and settlement on the last day of the grace period still clears the hold.
        evidence_fields: [membership_holdings.payment_hold_date, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the payment hold date
          anchor_source: membership_holdings.payment_hold_date
          relation: not_after
          duration_source: variants.payment_hold_grace_days
          unit: calendar_days
          counting_rule: Calendar days are added to the payment hold date, the day after the decline being day 1, and settlement on the last day of the grace period still clears the hold.
          boundary: inclusive
    measures: [membership_msr_declines_in_hold]
    params:
      per_tier:
        Northgate Rewards: {payment_retry_attempts: "=payment_retry_attempts", payment_retry_interval_days: "=payment_retry_interval_days", payment_hold_grace_days: "=payment_hold_grace_days"}
        Northgate+ Assist: {payment_retry_attempts: "=payment_retry_attempts", payment_retry_interval_days: "=payment_retry_interval_days", payment_hold_grace_days: "=payment_hold_grace_days"}
        Northgate+ Student: {payment_retry_attempts: "=payment_retry_attempts", payment_retry_interval_days: "=payment_retry_interval_days", payment_hold_grace_days: "=payment_hold_grace_days"}
        Northgate+ Monthly: {payment_retry_attempts: "=payment_retry_attempts", payment_retry_interval_days: "=payment_retry_interval_days", payment_hold_grace_days: "=payment_hold_grace_days"}
        Northgate+ Annual: {payment_retry_attempts: "=payment_retry_attempts", payment_retry_interval_days: "=payment_retry_interval_days", payment_hold_grace_days: "=payment_hold_grace_days"}
        Northgate+ Business: {payment_retry_attempts: "=payment_retry_attempts", payment_retry_interval_days: "=payment_retry_interval_days", payment_hold_grace_days: "=payment_hold_grace_days"}

  - id: membership_delivery_benefit
    subject: [membership_benefit_use]
    rule: >-
      This is the single statement of the membership delivery and return-pickup benefits that apply to Northgate orders.
      A delivery benefit applies only when the membership status on the order date is one of the tier's benefit statuses.
      Where free_standard_shipping_min_order_usd is a number, standard shipping on a Ship to Home order is free when the order's merchandise subtotal is at least that amount; Northgate Rewards adds nothing to the order charter's standard shipping rule. Where same_day_delivery_included is true, the Same-Day Delivery fee is waived
      when the merchandise subtotal is at least same_day_free_min_order_usd, a smaller same-day order pays
      member_small_order_same_day_fee_usd in place of the standard fee, and an express order pays member_express_fee_usd in
      place of the standard express fee. Where free_return_pickup_included is true the member may schedule a from-home
      return pickup of eligible Northgate-sold items at no fee. The merchandise subtotal is the sum of the order's line
      prices after item promotions and before the Northgate Card discount, Northgate Cash, gift cards, tax and fees. Delivery
      benefits never apply to the fulfilment programs and item types in delivery_benefit_excluded_fulfilment, whose fees
      are set by the order or marketplace charter alone. Stacking: membership benefits only waive or reduce delivery and
      pickup fees and never reduce merchandise prices, so they combine with the Northgate Card discount, item promotions,
      price adjustments and Northgate Cash without interaction. When another source (a promotional free-delivery offer or
      a Northgate Card shipping benefit) also lowers the same fee, the fee charged is the single lowest fee any one source
      yields; sources are never added together and a fee never goes below zero. A membership_benefit_use row is recorded
      for each order on which the membership benefit produced that lowest fee, including ties with another source, and its
      amount is the standard fee minus the fee charged.
      The value of each recorded use follows benefit_value_basis, and no benefit applies on payment hold since benefits_during_payment_hold is false. The other tier benefits are the fuel discount of fuel_discount_cents_per_gallon, the streaming subscription where streaming_benefit_included is true, early_deal_access_hours of early deal access and, where business_tax_exempt_checkout is true, tax-exempt checkout under trade_tax_exemption; of these only streaming activations are recorded as benefit uses.
    eligibility:
      - id: benefit_status
        applies_to: [membership_benefit_use]
        kind: state
        condition: A delivery benefit applies only when the membership status on the order date is one of the tier's benefit statuses.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [trial, active, cancel_pending]
    params:
      per_tier:
        Northgate Rewards: {free_standard_shipping_min_order_usd: "=free_standard_shipping_min_order_usd", same_day_free_min_order_usd: "=same_day_free_min_order_usd", member_small_order_same_day_fee_usd: "=member_small_order_same_day_fee_usd", benefit_statuses: "=benefit_statuses"}
        Northgate+ Assist: {free_standard_shipping_min_order_usd: "=free_standard_shipping_min_order_usd", same_day_free_min_order_usd: "=same_day_free_min_order_usd", member_small_order_same_day_fee_usd: "=member_small_order_same_day_fee_usd", benefit_statuses: "=benefit_statuses"}
        Northgate+ Student: {free_standard_shipping_min_order_usd: "=free_standard_shipping_min_order_usd", same_day_free_min_order_usd: "=same_day_free_min_order_usd", member_small_order_same_day_fee_usd: "=member_small_order_same_day_fee_usd", benefit_statuses: "=benefit_statuses"}
        Northgate+ Monthly: {free_standard_shipping_min_order_usd: "=free_standard_shipping_min_order_usd", same_day_free_min_order_usd: "=same_day_free_min_order_usd", member_small_order_same_day_fee_usd: "=member_small_order_same_day_fee_usd", benefit_statuses: "=benefit_statuses"}
        Northgate+ Annual: {free_standard_shipping_min_order_usd: "=free_standard_shipping_min_order_usd", same_day_free_min_order_usd: "=same_day_free_min_order_usd", member_small_order_same_day_fee_usd: "=member_small_order_same_day_fee_usd", benefit_statuses: "=benefit_statuses"}
        Northgate+ Business: {free_standard_shipping_min_order_usd: "=free_standard_shipping_min_order_usd", same_day_free_min_order_usd: "=same_day_free_min_order_usd", member_small_order_same_day_fee_usd: "=member_small_order_same_day_fee_usd", benefit_statuses: "=benefit_statuses"}

  - id: membership_evt_cash_earn
    subject: [membership_cash_earn]
    rule: >-
      Northgate Cash is earned on each fulfilled Northgate order line of the membership holder at the tier's
      rewards_earn_rate_pct of the line's eligible net merchandise amount, recorded as basis_amount_usd: the amount actually
      paid for the line after item promotions, price adjustments already granted at the time of fulfilment and the
      Northgate Card discount, before tax, fees, gift cards and Northgate Cash. The earned amount is rounded half up to the
      cent and posts on the fulfilment date. Lines of the purchase types in rewards_excluded_purchases never earn, and a
      line earns only if the membership is not canceled on the fulfilment date. Where rewards_annual_earn_cap_usd is a
      number, an earning is reduced so that membership_msr_cash_earned_ytd does not exceed the cap, and no further earning
      posts in that calendar year once it is reached. A price adjustment granted after fulfilment does not change Northgate
      Cash already earned.
      Earnings post under rewards_earn_posting_basis and are rounded under rewards_rounding.
    eligibility: []
    measures: [membership_msr_cash_earned_ytd]
    formula:
      amount_usd: basis_amount_usd * rewards_earn_rate_pct / 100
    params:
      per_tier:
        Northgate Rewards: {rewards_earn_rate_pct: "=rewards_earn_rate_pct", rewards_annual_earn_cap_usd: "=rewards_annual_earn_cap_usd"}
        Northgate+ Assist: {rewards_earn_rate_pct: "=rewards_earn_rate_pct", rewards_annual_earn_cap_usd: "=rewards_annual_earn_cap_usd"}
        Northgate+ Student: {rewards_earn_rate_pct: "=rewards_earn_rate_pct", rewards_annual_earn_cap_usd: "=rewards_annual_earn_cap_usd"}
        Northgate+ Monthly: {rewards_earn_rate_pct: "=rewards_earn_rate_pct", rewards_annual_earn_cap_usd: "=rewards_annual_earn_cap_usd"}
        Northgate+ Annual: {rewards_earn_rate_pct: "=rewards_earn_rate_pct", rewards_annual_earn_cap_usd: "=rewards_annual_earn_cap_usd"}
        Northgate+ Business: {rewards_earn_rate_pct: "=rewards_earn_rate_pct", rewards_annual_earn_cap_usd: "=rewards_annual_earn_cap_usd"}

  - id: membership_evt_cash_redeem_expire
    subject: [membership_cash_redeem, membership_cash_expire]
    rule: >-
      Northgate Cash may be applied to a Northgate order in the tier's rewards_redemption_channels, in any amount from
      rewards_min_redemption_usd up to the current rewards_cash_balance, and never to the purchase types in
      rewards_redemption_excluded. Northgate Cash cannot be redeemed while the balance is zero or negative, and cannot be
      exchanged for cash. A redemption consumes the oldest unexpired earnings first. Each earning expires
      rewards_expiry_months calendar months after its earn date, on the same calendar day or the last day of a shorter
      month; the amount expired is the part of that earning not consumed by redemptions or reversals under that
      oldest-first order. Closing the membership does not forfeit Northgate Cash: the balance stays redeemable until each
      earning expires.
      This follows rewards_forfeit_on_cancel, which is false on every tier.
    eligibility: []
    params:
      per_tier:
        Northgate Rewards: {rewards_min_redemption_usd: "=rewards_min_redemption_usd", rewards_redemption_channels: "=rewards_redemption_channels"}
        Northgate+ Assist: {rewards_min_redemption_usd: "=rewards_min_redemption_usd", rewards_redemption_channels: "=rewards_redemption_channels"}
        Northgate+ Student: {rewards_min_redemption_usd: "=rewards_min_redemption_usd", rewards_redemption_channels: "=rewards_redemption_channels"}
        Northgate+ Monthly: {rewards_min_redemption_usd: "=rewards_min_redemption_usd", rewards_redemption_channels: "=rewards_redemption_channels"}
        Northgate+ Annual: {rewards_min_redemption_usd: "=rewards_min_redemption_usd", rewards_redemption_channels: "=rewards_redemption_channels"}
        Northgate+ Business: {rewards_min_redemption_usd: "=rewards_min_redemption_usd", rewards_redemption_channels: "=rewards_redemption_channels"}

  - id: membership_evt_cash_reverse
    subject: [membership_cash_reverse]
    rule: >-
      When a line that earned Northgate Cash is returned for a refund, the cash earned on it is reversed in proportion to
      the merchandise amount refunded: earned amount x refunded merchandise amount / the earning's basis_amount_usd, rounded
      half up to the cent, the full earned amount when the whole line is refunded. Each return record reverses cash at most
      once and points to the earning it reverses. A reversal larger than the current balance takes the balance below zero,
      and the negative balance is netted by later earnings. An even exchange that refunds nothing reverses nothing, and a
      price adjustment never reverses cash.
      Reversal applies where rewards_reversal_on_return is true, and the balance may go negative only where rewards_negative_balance_allowed is true.
    eligibility:
      - id: reverse_once_per_return
        applies_to: [membership_cash_reverse]
        kind: dedup
        condition: Each return record reverses cash at most once and points to the earning it reverses.
        evidence_fields: [membership_events.source_order_event_id, membership_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_events.source_order_event_id]
          action_bindings:
            membership_events.source_order_event_id: source_order_event_id
        dedup_contract:
          table: membership_events
          mode: separate_record
          object_bindings: {source_order_event_id: source_order_event_id}
          duplicate_filters: {event_type: [membership_cash_reverse]}
          distinct_fields: []
    params:
      reversal_rounding: round_half_up_to_cent

  - id: membership_plan_change
    subject: [membership_change_plan]
    rule: >-
      A member may move between paid tiers whose entry gates they meet, and the new tier, billing cycle and fee take
      effect on the next renewal date. A tier can be changed only while the membership is in trial or active status. A
      move to Northgate+ Assist or Northgate+ Student requires the tier's eligibility proof to be confirmed first. Assist
      and Student eligibility must be re-verified every eligibility_reverify_months months counted from
      eligibility_verified_date; a re-verification not completed by the first renewal date on or after that anniversary
      moves the membership to the tier's reverify_failure_tier at that renewal. A Northgate+ Student membership moves to
      Northgate+ Monthly at the renewal on which membership_msr_student_months reaches max_discounted_months. Business and
      consumer tiers are not interchangeable because their customer types differ, and leaving a paid tier for Northgate
      Rewards is a cancellation, not a plan change.
      Every tier change takes effect under plan_switch_effective.
    eligibility:
      - id: changeable_status
        applies_to: [membership_change_plan]
        kind: state
        condition: A tier can be changed only while the membership is in trial or active status.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [trial, active]
    measures: [membership_msr_student_months]
    params:
      per_tier:
        Northgate Rewards: {eligibility_reverify_months: "=eligibility_reverify_months", reverify_failure_tier: "=reverify_failure_tier", max_discounted_months: "=max_discounted_months"}
        Northgate+ Assist: {eligibility_reverify_months: "=eligibility_reverify_months", reverify_failure_tier: "=reverify_failure_tier", max_discounted_months: "=max_discounted_months"}
        Northgate+ Student: {eligibility_reverify_months: "=eligibility_reverify_months", reverify_failure_tier: "=reverify_failure_tier", max_discounted_months: "=max_discounted_months"}
        Northgate+ Monthly: {eligibility_reverify_months: "=eligibility_reverify_months", reverify_failure_tier: "=reverify_failure_tier", max_discounted_months: "=max_discounted_months"}
        Northgate+ Annual: {eligibility_reverify_months: "=eligibility_reverify_months", reverify_failure_tier: "=reverify_failure_tier", max_discounted_months: "=max_discounted_months"}
        Northgate+ Business: {eligibility_reverify_months: "=eligibility_reverify_months", reverify_failure_tier: "=reverify_failure_tier", max_discounted_months: "=max_discounted_months"}

  - id: membership_cancellation
    subject: [membership_schedule_cancel, membership_resume, membership_end_term, membership_cancel_immediate, membership_cancel_trial]
    rule: >-
      Cancelling, resuming and choosing immediate cancellation are the member's own decisions: the agent records the
      request in membership_requests and the member confirms it, and only the confirmed request changes the membership.
      Where monthly_cancel_effective is end_of_billing_period, a cancellation turns auto-renew off and the membership stays
      in cancel_pending with full benefits until the renewal date, when it closes without a further charge. Where
      immediate_cancel_allowed is true the member may instead cancel immediately; on an annual-billed tier any refund is
      evaluated under membership_evt_fee_refund, and on Northgate Rewards there is nothing to refund. A cancel_pending membership can be resumed only before its renewal date. The resume date is compared with the renewal date by calendar date, and a resume on the renewal date itself is too late because the term has already ended. Resuming restores auto-renew with the same renewal date and no new charge. A trial is canceled under membership_trial. A membership in payment_hold is not cancelled by
      request but clears or lapses under membership_evt_payment_hold. A cancellation, whether at term end or immediate, can be requested only on a membership in active status.
    eligibility:
      - id: immediate_from_active
        applies_to: [membership_cancel_immediate, membership_schedule_cancel]
        kind: state
        condition: A cancellation, whether at term end or immediate, can be requested only on a membership in active status.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [active]
      - id: resume_before_renewal
        applies_to: [membership_resume]
        kind: time
        condition: A cancel_pending membership can be resumed only before its renewal date.
        evidence_fields: [membership_holdings.renewal_date, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its renewal date
          anchor_source: membership_holdings.renewal_date
          relation: not_after
          duration_source: params.resume_cutoff_days
          unit: calendar_days
          counting_rule: The resume date is compared with the renewal date by calendar date, and a resume on the renewal date itself is too late because the term has already ended.
          boundary: exclusive
    params:
      resume_cutoff_days: 0
      per_tier:
        Northgate Rewards: {monthly_cancel_effective: "=monthly_cancel_effective", immediate_cancel_allowed: "=immediate_cancel_allowed"}
        Northgate+ Assist: {monthly_cancel_effective: "=monthly_cancel_effective", immediate_cancel_allowed: "=immediate_cancel_allowed"}
        Northgate+ Student: {monthly_cancel_effective: "=monthly_cancel_effective", immediate_cancel_allowed: "=immediate_cancel_allowed"}
        Northgate+ Monthly: {monthly_cancel_effective: "=monthly_cancel_effective", immediate_cancel_allowed: "=immediate_cancel_allowed"}
        Northgate+ Annual: {monthly_cancel_effective: "=monthly_cancel_effective", immediate_cancel_allowed: "=immediate_cancel_allowed"}
        Northgate+ Business: {monthly_cancel_effective: "=monthly_cancel_effective", immediate_cancel_allowed: "=immediate_cancel_allowed"}

  - id: membership_household_seats
    subject: [membership_update_household]
    rule: >-
      A Northgate+ Monthly or Northgate+ Annual member may share delivery benefits with up to
      household_additional_members_max additional household members, and a Northgate+ Business member with up to
      business_user_seats_max employee seats. Shared users use the holder's delivery benefits on orders placed in the
      holder's name but never earn or redeem the holder's Northgate Cash. Household members and seats can be changed only
      while the membership is in trial or active status. A request above the tier's maximum is declined, not partly
      applied.
    eligibility:
      - id: household_status
        applies_to: [membership_update_household]
        kind: state
        condition: Household members and seats can be changed only while the membership is in trial or active status.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [trial, active]
    params:
      per_tier:
        Northgate Rewards: {household_additional_members_max: "=household_additional_members_max", business_user_seats_max: "=business_user_seats_max"}
        Northgate+ Assist: {household_additional_members_max: "=household_additional_members_max", business_user_seats_max: "=business_user_seats_max"}
        Northgate+ Student: {household_additional_members_max: "=household_additional_members_max", business_user_seats_max: "=business_user_seats_max"}
        Northgate+ Monthly: {household_additional_members_max: "=household_additional_members_max", business_user_seats_max: "=business_user_seats_max"}
        Northgate+ Annual: {household_additional_members_max: "=household_additional_members_max", business_user_seats_max: "=business_user_seats_max"}
        Northgate+ Business: {household_additional_members_max: "=household_additional_members_max", business_user_seats_max: "=business_user_seats_max"}

  - id: membership_payment_method
    subject: [membership_update_payment, membership_enroll]
    rule: >-
      Paid membership fees are charged to either a Northgate Card account or an external debit or credit card. A
      Northgate Card can be set as the payment method only when that card account belongs to the same customer and is in active status. A card that is suspended, closed or charged off cannot be used. A payment method change applies to
      the next fee attempt, including a retry during a payment hold. Northgate Rewards has no payment method.
    eligibility:
      - id: card_active
        applies_to: [membership_update_payment]
        kind: state
        condition: A Northgate Card can be set as the payment method only when that card account belongs to the same customer and is in active status.
        evidence_fields: [card_holdings.status, card_holdings.customer_id, card_holdings.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.card_account_id]
          action_bindings:
            card_holdings.card_account_id: card_account_id
        state_contract:
          field: card_holdings.status
          allowed: [active]

extended_policies:
  - id: membership_ext_consumer_cash_earning
    base_policy_refs: [membership_evt_cash_earn]
    overwrite:
      - base_policy: membership_evt_cash_earn
        superseded_clause: >-
          Northgate Cash is earned on each fulfilled Northgate order line of the membership holder at the tier's
          rewards_earn_rate_pct of the line's eligible net merchandise amount, recorded as basis_amount_usd: the amount actually
          paid for the line after item promotions, price adjustments already granted at the time of fulfilment and the
          Northgate Card discount, before tax, fees, gift cards and Northgate Cash.
        replaced_by: >-
          For the line recorded first on the member's Northgate order that has the latest fulfilled date among the
          member's orders in fulfilled status, on a shared latest date the order of them recorded first, when the member
          holds a Northgate Rewards, Northgate+ Assist, Northgate+ Student, Northgate+ Monthly or Northgate+ Annual
          membership, and only for that line, the Northgate Cash posted is worked out under this consumer earning
          schedule; the same line on a Northgate+ Business membership is worked out under the Business earning schedule,
          and every fulfilled Northgate order line that neither the consumer nor the Business earning schedule settles stays under the base earning rule, which no schedule of this
          charter prices or posts, earning the tier's rewards_earn_rate_pct of the line's eligible net merchandise
          amount, recorded as basis_amount_usd: the amount actually paid for the line after item promotions, price
          adjustments already granted at the time of fulfilment and the Northgate Card discount, before tax, fees, gift
          cards and Northgate Cash.
    trigger: state_due
    subject: [membership_cash_earn]
    computes: amount_usd
    target_tool: post_member_cash_earning_0c0d8435
    params:
