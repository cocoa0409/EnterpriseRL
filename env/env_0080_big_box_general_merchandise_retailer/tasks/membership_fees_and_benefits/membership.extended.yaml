      schedule; the same line on a Northgate+ Business membership is worked out under the Business earning schedule,
      and every fulfilled Northgate order line that neither the consumer nor the Business earning schedule settles stays under the base earning rule, which no schedule of this
      charter prices or posts, earning the tier's rewards_earn_rate_pct of the line's eligible net merchandise
      amount, recorded as basis_amount_usd: the amount actually paid for the line after item promotions, price
      adjustments already granted at the time of fulfilment and the Northgate Card discount, before tax, fees, gift
      cards and Northgate Cash.
      The line this consumer schedule settles is the line recorded first on the member's Northgate order that has
      the latest fulfilled date among the member's orders in fulfilled status, on a shared latest date the order of
      them recorded first; when the member has no Northgate order in fulfilled status, nothing is posted.
      The consumer earning is the line's earning basis times the earning percentage, divided by 100 and rounded half up
      to the cent, and it posts on the order's fulfilled date.
      The earning basis is the line's net amount, the amount paid for the line after item promotions and the Northgate
      Card discount, before tax, fees, gift cards and Northgate Cash.
      The earning percentage is the tier's rewards_earn_rate_pct.
      Every schedule below either adds percentage points to the earning percentage or sets the earning basis, and the
      points added by the schedules are summed.
      Delivery-program points: a line on a Northgate Same-Day Delivery or Northgate Drive Up order of a membership on a
      paid Northgate+ tier adds program_points_high points; a line on a Northgate Ship to Home or Northgate Order Pickup
      order of a membership on a paid Northgate+ tier adds program_points_mid points; any other line adds no points.
      Tenure points: a line whose order's fulfilled date is tenure_months_high or more whole calendar months after the
      membership's term start date adds tenure_points_high points; a line fulfilled tenure_months_mid to fewer than
      tenure_months_high whole calendar months after it adds tenure_points_mid points; any other line adds no points.
      Kept-units basis: when units of the line were refunded without a return and none were returned, the earning
      basis is the net amount times the units bought less the units so refunded, divided by the units bought,
      rounded half up to the cent; when units of the line were returned and none were refunded without a return, the
      earning basis is the net amount less the merchandise refunded on those returns; when both happened, the
      earning basis is the net amount times the units bought less the units refunded without a return, divided by
      the units bought, rounded half up to the cent, less the merchandise refunded on the returns; otherwise the
      earning basis is the net amount.
      Category points: a grocery or household essentials line adds category_points_high points; a beauty or apparel line
      adds category_points_mid points; any other line adds no points.
      Card points: a line paid with a Northgate Card whose account is a Northgate Store Card, Northgate Mastercard or
      Northgate World Mastercard in active status adds card_points_high points; a line paid with a Northgate Card whose
      account is a Northgate Secured Card in active status adds card_points_mid points; any other line adds no points.
      Lines of the purchase types in rewards_excluded_purchases never earn, and a line earns only if the membership
      is not canceled on the fulfilled date. An earning is posted for the line this consumer schedule settles only
      when the line is not of a purchase type that never earns Northgate Cash, the membership is not canceled on its
      order's fulfilled date and the line's earning under the consumer earning schedule comes to at least one cent;
      otherwise nothing is posted.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [order_holdings.order_id, order_holdings.variant_name, order_holdings.fulfilled_date, order_holdings.status, order_events.amount_usd, order_events.item_category, order_events.payment_method_type, order_events.card_account_id]
        note: The delivery-program, category and kept-units schedules take their tiers from the member's order and its line, return and refund records.
      - category: card
        as: branch
        reads: [variant_name, status]
