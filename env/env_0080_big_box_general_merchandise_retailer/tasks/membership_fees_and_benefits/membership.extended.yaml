      earned: "The reversal share is the earned amount times the merchandise refunded on the refund divided by the earning's basis_amount_usd."
      earned_basis: "The reversal share is the earned amount times the merchandise refunded on the refund divided by the earning's basis_amount_usd."
      line_net_amount: "A reversal is owed on the refund this schedule settles when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less every unit refunded without a return on the line, divided by the units bought and rounded half up to the cent, less the merchandise refunded on every return of the line, and otherwise nothing is reversed. A line's net amount is the amount charged for the line after item promotions and the Northgate Card discount."
      earning_rate: "The reversal share is the earned amount times the merchandise refunded on the refund divided by the earning's basis_amount_usd."
      units_refunded_all: "A reversal is owed on the refund this schedule settles when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less every unit refunded without a return on the line, divided by the units bought and rounded half up to the cent, less the merchandise refunded on every return of the line, and otherwise nothing is reversed. A line's net amount is the amount charged for the line after item promotions and the Northgate Card discount."
      returned_all: "A reversal is owed on the refund this schedule settles when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less every unit refunded without a return on the line, divided by the units bought and rounded half up to the cent, less the merchandise refunded on every return of the line, and otherwise nothing is reversed. A line's net amount is the amount charged for the line after item promotions and the Northgate Card discount."
      kept_units_basis_now: "A reversal is owed on the refund this schedule settles when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less every unit refunded without a return on the line, divided by the units bought and rounded half up to the cent, less the merchandise refunded on every return of the line, and otherwise nothing is reversed. A line's net amount is the amount charged for the line after item promotions and the Northgate Card discount."
      units_on_line_kind: "Closing-refund share: when the units refunded without a return on all such refunds of the line reach the units bought on it, the reversal share is the earned amount less the Cash already reversed on that earning; when they fall short of the units bought and the line carries a price adjustment, the reversal share is the earned amount times the units on this refund divided by the units bought; otherwise the reversal share is the earned amount times the merchandise refunded on the refund divided by the earning's basis_amount_usd."
      adjustments_on_line: "Closing-refund share: when the units refunded without a return on all such refunds of the line reach the units bought on it, the reversal share is the earned amount less the Cash already reversed on that earning; when they fall short of the units bought and the line carries a price adjustment, the reversal share is the earned amount times the units on this refund divided by the units bought; otherwise the reversal share is the earned amount times the merchandise refunded on the refund divided by the earning's basis_amount_usd."
      already_reversed: "Closing-refund share: when the units refunded without a return on all such refunds of the line reach the units bought on it, the reversal share is the earned amount less the Cash already reversed on that earning; when they fall short of the units bought and the line carries a price adjustment, the reversal share is the earned amount times the units on this refund divided by the units bought; otherwise the reversal share is the earned amount times the merchandise refunded on the refund divided by the earning's basis_amount_usd."
      reversal_share: "Closing-refund share: when the units refunded without a return on all such refunds of the line reach the units bought on it, the reversal share is the earned amount less the Cash already reversed on that earning; when they fall short of the units bought and the line carries a price adjustment, the reversal share is the earned amount times the units on this refund divided by the units bought; otherwise the reversal share is the earned amount times the merchandise refunded on the refund divided by the earning's basis_amount_usd."
      return_reason: "Refund reason relief: a refund made because the item was damaged on arrival adds reason_relief_high to the relief fraction; a refund made because the item was never received on a Northgate Ship to Home, Northgate Same-Day Delivery or Northgate Scheduled Large-Item Delivery order adds reason_relief_mid; a refund made because the item was never received on any other order adds nothing."
      refund_program: "Refund reason relief: a refund made because the item was damaged on arrival adds reason_relief_high to the relief fraction; a refund made because the item was never received on a Northgate Ship to Home, Northgate Same-Day Delivery or Northgate Scheduled Large-Item Delivery order adds reason_relief_mid; a refund made because the item was never received on any other order adds nothing."
      reason_fraction: "Refund reason relief: a refund made because the item was damaged on arrival adds reason_relief_high to the relief fraction; a refund made because the item was never received on a Northgate Ship to Home, Northgate Same-Day Delivery or Northgate Scheduled Large-Item Delivery order adds reason_relief_mid; a refund made because the item was never received on any other order adds nothing."
      months_at_event: "Unreturned-refund tenure relief: a refund dated tenure_months_high or more whole calendar months after the membership's term start date adds tenure_relief_high to the relief fraction; one dated tenure_months_mid to fewer than tenure_months_high whole calendar months after it adds tenure_relief_mid; any other refund adds nothing."
      tenure_fraction: "Unreturned-refund tenure relief: a refund dated tenure_months_high or more whole calendar months after the membership's term start date adds tenure_relief_high to the relief fraction; one dated tenure_months_mid to fewer than tenure_months_high whole calendar months after it adds tenure_relief_mid; any other refund adds nothing."
      events_12m: "Unreturned-refund count relief: when the refund is the only refund without a return made because an item was damaged on arrival or never received that is recorded on the member's Northgate orders dated within the twelve whole calendar months before today, it adds count_relief_high to the relief fraction; when it is one of exactly two such refunds, it adds count_relief_mid; otherwise it adds nothing."
      count_fraction: "Unreturned-refund count relief: when the refund is the only refund without a return made because an item was damaged on arrival or never received that is recorded on the member's Northgate orders dated within the twelve whole calendar months before today, it adds count_relief_high to the relief fraction; when it is one of exactly two such refunds, it adds count_relief_mid; otherwise it adds nothing."
      lines_12m: "Unreturned-refund volume relief: when the net amounts, the amounts charged after item promotions and the Northgate Card discount, of the lines on the member's Northgate orders dated within the twelve whole calendar months before today total volume_high_usd or more, the refund adds volume_relief_high to the relief fraction; when they total volume_mid_usd to less than volume_high_usd, it adds volume_relief_mid; otherwise it adds nothing."
      volume_fraction: "Unreturned-refund volume relief: when the net amounts, the amounts charged after item promotions and the Northgate Card discount, of the lines on the member's Northgate orders dated within the twelve whole calendar months before today total volume_high_usd or more, the refund adds volume_relief_high to the relief fraction; when they total volume_mid_usd to less than volume_high_usd, it adds volume_relief_mid; otherwise it adds nothing."
      relief_fraction: "Every schedule below either sets the reversal share or adds a fraction to the relief fraction, and the fractions added are summed."
      result: "The unreturned refund reversal is the reversal share times one less the relief fraction, rounded half up to the cent."
    factors:
      - id: unreturned_closing_share
        effect: method
        decides: reversal_share
        bindings: [units_on_line_kind, adjustments_on_line, already_reversed, reversal_share]
        ladder:
          - when: "the units refunded without a return on the line reach the units bought on it"
            method: "the reversal share is the earned amount less the Cash already reversed on that earning"
          - when: "they fall short of the units bought and the line carries a price adjustment"
            method: "the reversal share is the earned amount times the units on this refund divided by the units bought"
          - when: "otherwise"
            method: "the reversal share is the earned amount times the merchandise refunded divided by the earning's basis_amount_usd"
        baseline: {reversal_share: "earning_rate * refunded_merch"}
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: unreturned_reason_relief
        effect: parameter
        decides: reason_fraction
        bindings: [return_reason, refund_program, reason_fraction]
        ladder:
          - when: "the refund was made because the item was damaged on arrival"
            value: "K('reason_relief_high')"
          - when: "the refund was made because the item was never received on a Northgate Ship to Home, Northgate Same-Day Delivery or Northgate Scheduled Large-Item Delivery order"
            value: "K('reason_relief_mid')"
          - when: "the refund was made because the item was never received on any other order"
            value: "0"
        baseline: {reason_fraction: "0"}
        evidence: [cross_category]
        cross_difficulty: order
      - id: unreturned_tenure_relief
        effect: parameter
        decides: tenure_fraction
        bindings: [months_at_event, tenure_fraction]
        ladder:
          - when: "the refund is dated tenure_months_high or more whole calendar months after the membership's term start date"
            value: "K('tenure_relief_high')"
          - when: "it is dated tenure_months_mid to fewer than tenure_months_high whole calendar months after it"
            value: "K('tenure_relief_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {tenure_fraction: "0"}
        evidence: [date]
        cross_difficulty: null
      - id: unreturned_count_relief
        effect: parameter
        decides: count_fraction
        bindings: [events_12m, count_fraction]
        ladder:
          - when: "the refund is the only refund without a return made because an item was damaged on arrival or never received on the member's Northgate orders dated within the twelve whole calendar months before today"
            value: "K('count_relief_high')"
          - when: "it is one of exactly two such refunds"
            value: "K('count_relief_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {count_fraction: "0"}
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: unreturned_volume_relief
        effect: parameter
        decides: volume_fraction
        bindings: [lines_12m, volume_fraction]
        ladder:
          - when: "the net amounts, the amounts charged after item promotions and the Northgate Card discount, of the lines on the member's Northgate orders dated within the twelve whole calendar months before today total volume_high_usd or more"
            value: "K('volume_relief_high')"
          - when: "they total volume_mid_usd to less than volume_high_usd"
            value: "K('volume_relief_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {volume_fraction: "0"}
        evidence: [cross_category, history]
        cross_difficulty: order
    baseline:
      rule: >-
        The unreturned refund reversal is the reversal share times one less the relief fraction, rounded half
        up to the cent. The reversal share is the earned amount times the merchandise refunded on the refund
        divided by the earning's basis_amount_usd. The relief fraction is zero.
      params: []
    inputs:
      history:
        - {table: membership_events, aggregate: sum, field: amount_usd, filters: {event_type: membership_cash_earn}}
        - {table: membership_events, aggregate: sum, field: amount_usd, filters: {event_type: membership_cash_reverse}}
        - {category: order, table: order_events, aggregate: count, field: order_event_id, within_months: 12, filters: {event_type: order_refund_charge}}
      cross_category: [order]
  - id: membership_ext_business_closure_refund
    base_policy_refs: [membership_evt_fee_refund, membership_cancellation]
    overwrite:
      - base_policy: membership_evt_fee_refund
        superseded_clause: >-
          The full refund also requires membership_msr_benefit_uses_since_charge to be zero, and its refund basis is
          full_within_window. Otherwise, where prorated_refund_on_cancel is true, the refund is fee x
          membership_msr_unused_full_months / term_months rounded down to the cent, with basis prorated_unused_months, and no
          refund is made when that count is zero.
        replaced_by: >-
          For the immediate cancellation of a Northgate+ Business membership whose most recent settled annual fee was charged
          to an external card, and only for such a cancellation, the refund is worked out under this Business closure
          schedule; the immediate cancellation of a Northgate+ Annual membership whose most recent settled annual fee was charged to an external card is worked out under the annual cancellation schedule, and every immediate cancellation that neither this Business closure schedule nor the annual cancellation schedule handles keeps the base measure, in which a cancellation inside the full refund window with no benefit use since the charge refunds the whole fee with basis full_within_window, and otherwise, where prorated_refund_on_cancel is true, the refund is the fee times the unused whole months divided by term_months, rounded down to the cent, with basis prorated_unused_months, and nothing is refunded when that count is zero.
      - base_policy: membership_evt_fee_refund
        superseded_clause: >-
          A refund never exceeds the fee it refers to, and benefits already used are never billed back.
        replaced_by: >-
          For a cancellation this Business closure schedule handles, the refund never exceeds the fee it
          refers to, and what the schedule takes from the refund for Northgate Cash or for benefits already
          received is taken only out of that refund, so nothing is ever billed to the member beyond it; for every cancellation that neither this Business closure schedule nor the annual cancellation schedule handles, a refund never exceeds the fee it refers to, and benefits already used are never billed back.
    trigger: on_request
    subject: [membership_fee_refund, membership_cancel_immediate]
    computes: refund_amount_usd
    target_tool: confirm_business_membership_closure_a0a2c96c
    params:
      rewards_base_rate_pct: 1.0
      volume_high_usd: 5000
      volume_mid_usd: 2000
      recovery_share_high: 0.5
      recovery_share_mid: 0.75
      days_in_year: 365
      hold_share_full: 1.0
      hold_share_half: 0.5
      courtesy_share_high: 0.25
      courtesy_share_mid: 0.125
      usage_uses_high: 6
      usage_uses_mid: 3
      usage_share_high: 0.5
      usage_share_mid: 0.25
      loyal_fees_high: 3
      loyal_fees_mid: 2
      loyal_share_high: 0.125
      loyal_share_mid: 0.0625
    rule: >-
      For the immediate cancellation of a Northgate+ Business membership whose most recent settled annual fee was charged
      to an external card, and only for such a cancellation, the refund is worked out under this Business closure
      schedule; the immediate cancellation of a Northgate+ Annual membership whose most recent settled annual fee was charged to an external card is worked out under the annual cancellation schedule, and every immediate cancellation that neither this Business closure schedule nor the annual cancellation schedule handles keeps the base measure, in which a cancellation inside the full refund window with no benefit use since the charge refunds the whole fee with basis full_within_window, and otherwise, where prorated_refund_on_cancel is true, the refund is the fee times the unused whole months divided by term_months, rounded down to the cent, with basis prorated_unused_months, and nothing is refunded when that count is zero.
      The closure is the business's own decision; its administrator confirms it, the membership closes on the
      cancellation date, and the Business refund is credited to the external card the fee was charged to. A line's
      net amount is the amount charged for the line after item promotions and the Northgate Card discount.
      For a cancellation this Business closure schedule handles, the refund never exceeds the fee it refers
      to, and what the schedule takes from the refund for Northgate Cash or for benefits already received is
      taken only out of that refund, so nothing is ever billed to the member beyond it; for every cancellation that neither this Business closure schedule nor the annual cancellation schedule handles, a refund never exceeds the fee it refers to, and benefits already used are never billed back.
      The Business refund is worked out only after the line recorded first on the member's Northgate order that has
      the latest fulfilled date among the member's orders in fulfilled status, on a shared latest date the order of
      them recorded first has its Northgate Cash earning on the membership's ledger, when the line is not of a
      purchase type that never earns Northgate Cash, the membership is not canceled on its order's fulfilled date,
      the Northgate Cash earned on the membership in the twelve whole calendar months before today is below the
      tier's annual Northgate Cash limit and the line's earning under the Business earning schedule comes to at
      least one cent.
      The Business refund is not worked out until the most recent return recorded on the member's Northgate orders,
      the one with the latest return date and, among returns of the same date, the one recorded first carries its
      reversal on the membership's ledger, when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less
      every unit refunded without a return on the line, divided by the units bought and rounded half up to the cent,
      less the merchandise refunded on every return of the line.
      Before the Business refund is worked out, the most recent refund without a return made because an item was
      damaged on arrival or never received on the member's Northgate orders, the one with the latest refund date
      and, among refunds of one kind on that date, the one recorded first, and when a damaged-on-arrival refund and
      a never-received refund share that date, the damaged-on-arrival refund must carry its reversal on the
      membership's ledger, when the earning basis recorded on the Northgate Cash earning that points to its line differs
      from that line's kept-units basis, which is the line's net amount times the units bought less every unit
      refunded without a return on the line, divided by the units bought and rounded half up to the cent, less the
      merchandise refunded on every return of the line.
      The tier's annual Northgate Cash limit is its rewards_annual_earn_cap_usd. The Business refund refers to the
      most recent settled annual fee charge on the membership. When the membership
      carries no settled annual fee charge, nothing is refunded.
      The Business refund is the closure core less the Business Cash recovery, never more than that fee and never
      below zero, rounded down to the cent. When the refund comes to zero, the cancellation is still recorded and
      confirmed, and no refund entry is booked.
      The closure core is the prorated fee: the fee times the whole calendar months from the cancellation date to the
      renewal date, divided by the tier's term_months.
      The Business Cash recovery is the Business-rate Northgate Cash of the twelve whole calendar months before the
      cancellation date, never below zero and rounded half up to the cent. The Business-rate Cash is the net
      Business Cash minus the Rewards-rate Cash. The net Business Cash is the Cash earned in that period minus the
      Cash reversed in that period. The Rewards-rate Cash is rewards_base_rate_pct percent, the Northgate Rewards
      rate, of the net Business basis. The net Business basis is the earning bases of that period minus the reversal
      bases of that period.
      Every schedule below either sets the closure core, sets the share of the Business-rate Cash that the Business Cash
      recovery takes, or adds an amount to or takes an amount from the Business refund before the cap, the floor and the
      rounding.
      Business money-back schedule: when the fee was charged no more than the tier's annual_full_refund_window_days days
      before the cancellation date and no benefit use is dated on or after the charge date, the closure core is the whole
      fee; when the fee was charged no more than that many days before and a benefit use is dated on or after the charge
      date, the closure core is the whole fee less the value of the benefit uses dated within the one whole calendar month
      before the cancellation date, never less than the prorated fee; otherwise the closure core is the prorated fee.
      Volume recovery share: when the net amounts, the amounts charged after item promotions and the Northgate Card discount, of the lines on the member's Northgate orders dated within the twelve
      whole calendar months before the cancellation date total volume_high_usd or more, the Business Cash recovery takes
      recovery_share_high of the Business-rate Cash; when they total volume_mid_usd to less than volume_high_usd, it takes
      recovery_share_mid of it; otherwise it takes all of it.
      Hold-day credit: when the billing period of the most recent settled fee carries two or more declined attempts, each day counted from that period's start date through the day before the fee settled is credited at the fee divided by days_in_year times
      hold_share_full; when it carries exactly one declined attempt, each such day is credited at that daily amount times
      hold_share_half; otherwise nothing is credited.
      Business cardholder courtesy: when the member holds a Northgate Business Mastercard account in active status, one
      month's share of the fee, the fee divided by term_months, times courtesy_share_high is added to the Business refund;
      when the member holds a Northgate Business Store Card account in active status, one month's share times
      courtesy_share_mid is added; otherwise nothing is added.
      Benefit-usage withholding: when usage_uses_high or more benefit uses are dated within the twelve whole calendar months before the cancellation date, one month's share of the fee, the fee divided by term_months, times usage_share_high is taken from the Business
      refund; when usage_uses_mid to fewer than usage_uses_high are, one month's share times usage_share_mid is taken;
      otherwise nothing is taken.
      Loyalty credit: when the membership carries loyal_fees_high or more settled annual fees, one month's share of the fee, the fee divided by term_months, times loyal_share_high is added to the Business refund; when it carries exactly loyal_fees_mid, one month's share
      times loyal_share_mid is added; otherwise nothing is added.
      The Business refund is recorded with basis full_within_window when the fee was charged no more than the tier's
      annual_full_refund_window_days days before the cancellation date, and with basis prorated_unused_months otherwise.
    compute:
      - fee_ref: "LATEST('membership_events', 'membership_event_id', event_type='membership_fee_charge')"
      - fee: "SUM('membership_events', 'amount_usd', membership_event_id=fee_ref)"
      - charged_on: "LATEST('membership_events', 'event_date', event_type='membership_fee_charge') or NOW"
      - months_left: "MONTHS(NOW, F('renewal_date') or NOW)"
      - prorated: "fee * months_left / P('term_months')"
      - days_since_charge: "DAYS(charged_on, NOW)"
      - last_use_on: "LATEST('membership_events', 'event_date', event_type='membership_benefit_use')"
      - recent_use_value: "SUM('membership_events', 'amount_usd', within_months=1, date_field='event_date', event_type='membership_benefit_use')"
      - closure_core: "fee if (days_since_charge <= P('annual_full_refund_window_days') and (last_use_on or '0000-00-00') < charged_on) else (MX(prorated, fee - recent_use_value) if (days_since_charge <= P('annual_full_refund_window_days') and (last_use_on or '0000-00-00') >= charged_on) else prorated)"
      - lines_12m: "XSUM('order', 'order_events', 'amount_usd', within_months=12, date_field='event_date', event_type='order_post_line')"
      - recovery_share: "K('recovery_share_high') if lines_12m >= K('volume_high_usd') else (K('recovery_share_mid') if lines_12m >= K('volume_mid_usd') else 1)"
      - earned_12m: "SUM('membership_events', 'amount_usd', within_months=12, date_field='event_date', event_type='membership_cash_earn')"
      - earned_basis_12m: "SUM('membership_events', 'basis_amount_usd', within_months=12, date_field='event_date', event_type='membership_cash_earn')"
      - reversed_12m: "SUM('membership_events', 'amount_usd', within_months=12, date_field='event_date', event_type='membership_cash_reverse')"
      - reversed_basis_12m: "SUM('membership_events', 'basis_amount_usd', within_months=12, date_field='event_date', event_type='membership_cash_reverse')"
      - business_rate_cash: "MX(0, (earned_12m - reversed_12m) - (earned_basis_12m - reversed_basis_12m) * K('rewards_base_rate_pct') / 100)"
      - cash_recovery: "RND(business_rate_cash * recovery_share + 0.000000001, 2)"
      - held_period: "LATEST('membership_events', 'billing_period_start', event_type='membership_fee_charge') or charged_on"
      - held_declines: "COUNT('membership_events', event_type='membership_fee_decline', billing_period_start=held_period)"
      - hold_credit: "DAYS(held_period, charged_on) * fee / K('days_in_year') * K('hold_share_full') if held_declines >= 2 else (DAYS(held_period, charged_on) * fee / K('days_in_year') * K('hold_share_half') if held_declines == 1 else 0)"
      - active_card_tier: "CFIELD('card', 'variant_name', status='active')"
      - courtesy_add: "fee / P('term_months') * K('courtesy_share_high') if active_card_tier == 'Northgate Business Mastercard' else (fee / P('term_months') * K('courtesy_share_mid') if active_card_tier == 'Northgate Business Store Card' else 0)"
      - uses_12m: "COUNT('membership_events', within_months=12, date_field='event_date', event_type='membership_benefit_use')"
      - usage_take: "fee / P('term_months') * K('usage_share_high') if uses_12m >= K('usage_uses_high') else (fee / P('term_months') * K('usage_share_mid') if uses_12m >= K('usage_uses_mid') else 0)"
      - settled_fees: "COUNT('membership_events', event_type='membership_fee_charge', fee_type='annual_fee')"
      - loyalty_add: "fee / P('term_months') * K('loyal_share_high') if settled_fees >= K('loyal_fees_high') else (fee / P('term_months') * K('loyal_share_mid') if settled_fees == K('loyal_fees_mid') else 0)"
      - result: "MX(0, int(MN(fee, closure_core + hold_credit + courtesy_add + loyalty_add - usage_take - cash_recovery) * 100 + 0.000000001) / 100)"
    compute_basis:
      fee_ref: "The tier's annual Northgate Cash limit is its rewards_annual_earn_cap_usd. The Business refund refers to the most recent settled annual fee charge on the membership. When the membership carries no settled annual fee charge, nothing is refunded."
      fee: "The tier's annual Northgate Cash limit is its rewards_annual_earn_cap_usd. The Business refund refers to the most recent settled annual fee charge on the membership. When the membership carries no settled annual fee charge, nothing is refunded."
      charged_on: "Business money-back schedule: when the fee was charged no more than the tier's annual_full_refund_window_days days before the cancellation date and no benefit use is dated on or after the charge date, the closure core is the whole fee; when the fee was charged no more than that many days before and a benefit use is dated on or after the charge date, the closure core is the whole fee less the value of the benefit uses dated within the one whole calendar month before the cancellation date, never less than the prorated fee; otherwise the closure core is the prorated fee."
      months_left: "The closure core is the prorated fee: the fee times the whole calendar months from the cancellation date to the renewal date, divided by the tier's term_months."
      prorated: "The closure core is the prorated fee: the fee times the whole calendar months from the cancellation date to the renewal date, divided by the tier's term_months."
      days_since_charge: "Business money-back schedule: when the fee was charged no more than the tier's annual_full_refund_window_days days before the cancellation date and no benefit use is dated on or after the charge date, the closure core is the whole fee; when the fee was charged no more than that many days before and a benefit use is dated on or after the charge date, the closure core is the whole fee less the value of the benefit uses dated within the one whole calendar month before the cancellation date, never less than the prorated fee; otherwise the closure core is the prorated fee."
      last_use_on: "Business money-back schedule: when the fee was charged no more than the tier's annual_full_refund_window_days days before the cancellation date and no benefit use is dated on or after the charge date, the closure core is the whole fee; when the fee was charged no more than that many days before and a benefit use is dated on or after the charge date, the closure core is the whole fee less the value of the benefit uses dated within the one whole calendar month before the cancellation date, never less than the prorated fee; otherwise the closure core is the prorated fee."
      recent_use_value: "Business money-back schedule: when the fee was charged no more than the tier's annual_full_refund_window_days days before the cancellation date and no benefit use is dated on or after the charge date, the closure core is the whole fee; when the fee was charged no more than that many days before and a benefit use is dated on or after the charge date, the closure core is the whole fee less the value of the benefit uses dated within the one whole calendar month before the cancellation date, never less than the prorated fee; otherwise the closure core is the prorated fee."
      closure_core: "Business money-back schedule: when the fee was charged no more than the tier's annual_full_refund_window_days days before the cancellation date and no benefit use is dated on or after the charge date, the closure core is the whole fee; when the fee was charged no more than that many days before and a benefit use is dated on or after the charge date, the closure core is the whole fee less the value of the benefit uses dated within the one whole calendar month before the cancellation date, never less than the prorated fee; otherwise the closure core is the prorated fee."
      lines_12m: "Volume recovery share: when the net amounts, the amounts charged after item promotions and the Northgate Card discount, of the lines on the member's Northgate orders dated within the twelve whole calendar months before the cancellation date total volume_high_usd or more, the Business Cash recovery takes recovery_share_high of the Business-rate Cash; when they total volume_mid_usd to less than volume_high_usd, it takes recovery_share_mid of it; otherwise it takes all of it."
      recovery_share: "Volume recovery share: when the net amounts, the amounts charged after item promotions and the Northgate Card discount, of the lines on the member's Northgate orders dated within the twelve whole calendar months before the cancellation date total volume_high_usd or more, the Business Cash recovery takes recovery_share_high of the Business-rate Cash; when they total volume_mid_usd to less than volume_high_usd, it takes recovery_share_mid of it; otherwise it takes all of it."
      earned_12m: "The Business Cash recovery is the Business-rate Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The Business-rate Cash is the net Business Cash minus the Rewards-rate Cash. The net Business Cash is the Cash earned in that period minus the Cash reversed in that period. The Rewards-rate Cash is rewards_base_rate_pct percent, the Northgate Rewards rate, of the net Business basis. The net Business basis is the earning bases of that period minus the reversal bases of that period."
      earned_basis_12m: "The Business Cash recovery is the Business-rate Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The Business-rate Cash is the net Business Cash minus the Rewards-rate Cash. The net Business Cash is the Cash earned in that period minus the Cash reversed in that period. The Rewards-rate Cash is rewards_base_rate_pct percent, the Northgate Rewards rate, of the net Business basis. The net Business basis is the earning bases of that period minus the reversal bases of that period."
      reversed_12m: "The Business Cash recovery is the Business-rate Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The Business-rate Cash is the net Business Cash minus the Rewards-rate Cash. The net Business Cash is the Cash earned in that period minus the Cash reversed in that period. The Rewards-rate Cash is rewards_base_rate_pct percent, the Northgate Rewards rate, of the net Business basis. The net Business basis is the earning bases of that period minus the reversal bases of that period."
      reversed_basis_12m: "The Business Cash recovery is the Business-rate Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The Business-rate Cash is the net Business Cash minus the Rewards-rate Cash. The net Business Cash is the Cash earned in that period minus the Cash reversed in that period. The Rewards-rate Cash is rewards_base_rate_pct percent, the Northgate Rewards rate, of the net Business basis. The net Business basis is the earning bases of that period minus the reversal bases of that period."
      business_rate_cash: "The Business Cash recovery is the Business-rate Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The Business-rate Cash is the net Business Cash minus the Rewards-rate Cash. The net Business Cash is the Cash earned in that period minus the Cash reversed in that period. The Rewards-rate Cash is rewards_base_rate_pct percent, the Northgate Rewards rate, of the net Business basis. The net Business basis is the earning bases of that period minus the reversal bases of that period."
      cash_recovery: "The Business Cash recovery is the Business-rate Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The Business-rate Cash is the net Business Cash minus the Rewards-rate Cash. The net Business Cash is the Cash earned in that period minus the Cash reversed in that period. The Rewards-rate Cash is rewards_base_rate_pct percent, the Northgate Rewards rate, of the net Business basis. The net Business basis is the earning bases of that period minus the reversal bases of that period."
      held_period: "Hold-day credit: when the billing period of the most recent settled fee carries two or more declined attempts, each day counted from that period's start date through the day before the fee settled is credited at the fee divided by days_in_year times hold_share_full; when it carries exactly one declined attempt, each such day is credited at that daily amount times hold_share_half; otherwise nothing is credited."
      held_declines: "Hold-day credit: when the billing period of the most recent settled fee carries two or more declined attempts, each day counted from that period's start date through the day before the fee settled is credited at the fee divided by days_in_year times hold_share_full; when it carries exactly one declined attempt, each such day is credited at that daily amount times hold_share_half; otherwise nothing is credited."
      hold_credit: "Hold-day credit: when the billing period of the most recent settled fee carries two or more declined attempts, each day counted from that period's start date through the day before the fee settled is credited at the fee divided by days_in_year times hold_share_full; when it carries exactly one declined attempt, each such day is credited at that daily amount times hold_share_half; otherwise nothing is credited."
      active_card_tier: "Business cardholder courtesy: when the member holds a Northgate Business Mastercard account in active status, one month's share of the fee, the fee divided by term_months, times courtesy_share_high is added to the Business refund; when the member holds a Northgate Business Store Card account in active status, one month's share times courtesy_share_mid is added; otherwise nothing is added."
      courtesy_add: "Business cardholder courtesy: when the member holds a Northgate Business Mastercard account in active status, one month's share of the fee, the fee divided by term_months, times courtesy_share_high is added to the Business refund; when the member holds a Northgate Business Store Card account in active status, one month's share times courtesy_share_mid is added; otherwise nothing is added."
      uses_12m: "Benefit-usage withholding: when usage_uses_high or more benefit uses are dated within the twelve whole calendar months before the cancellation date, one month's share of the fee, the fee divided by term_months, times usage_share_high is taken from the Business refund; when usage_uses_mid to fewer than usage_uses_high are, one month's share times usage_share_mid is taken; otherwise nothing is taken."
      usage_take: "Benefit-usage withholding: when usage_uses_high or more benefit uses are dated within the twelve whole calendar months before the cancellation date, one month's share of the fee, the fee divided by term_months, times usage_share_high is taken from the Business refund; when usage_uses_mid to fewer than usage_uses_high are, one month's share times usage_share_mid is taken; otherwise nothing is taken."
      settled_fees: "Loyalty credit: when the membership carries loyal_fees_high or more settled annual fees, one month's share of the fee, the fee divided by term_months, times loyal_share_high is added to the Business refund; when it carries exactly loyal_fees_mid, one month's share times loyal_share_mid is added; otherwise nothing is added."
      loyalty_add: "Loyalty credit: when the membership carries loyal_fees_high or more settled annual fees, one month's share of the fee, the fee divided by term_months, times loyal_share_high is added to the Business refund; when it carries exactly loyal_fees_mid, one month's share times loyal_share_mid is added; otherwise nothing is added."
      result: "The Business refund is the closure core less the Business Cash recovery, never more than that fee and never below zero, rounded down to the cent. When the refund comes to zero, the cancellation is still recorded and confirmed, and no refund entry is booked."
    prerequisite:
      - problem: membership_ext_business_cash_earning
        kind: value_input
        gate: business_rate_cash
        form: state
        policy_source: >-
          The Business refund is worked out only after the line recorded first on the member's Northgate order that has
          the latest fulfilled date among the member's orders in fulfilled status, on a shared latest date the order of
          them recorded first has its Northgate Cash earning on the membership's ledger, when the line is not of a
          purchase type that never earns Northgate Cash, the membership is not canceled on its order's fulfilled date,
          the Northgate Cash earned on the membership in the twelve whole calendar months before today is below the
          tier's annual Northgate Cash limit and the line's earning under the Business earning schedule comes to at
          least one cent.
        condition: >-
          The line recorded first on the member's order with the latest fulfilled date among orders in fulfilled status
          (ties: the order recorded first), when that line earns (its category is not excluded, the membership was not
          canceled on the fulfilled date, twelve-month membership_cash_earn total below rewards_annual_earn_cap_usd and
          the line's Business-schedule earning at least 0.01), has a membership_cash_earn row whose
          source_order_event_id is that line.
        resolved_by: post_business_cash_earning_affdfb03
        effect: >-
          Posting the missing earning adds its amount and basis to the twelve-month Cash earned and earning bases, which raises the Business-rate Cash the Business Cash recovery takes and lowers the Business refund.
      - problem: membership_ext_business_return_reversal
        kind: value_input
        gate: business_rate_cash
        form: state
        policy_source: >-
          The Business refund is not worked out until the most recent return recorded on the member's Northgate orders,
          the one with the latest return date and, among returns of the same date, the one recorded first carries its
          reversal on the membership's ledger, when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less
          every unit refunded without a return on the line, divided by the units bought and rounded half up to the cent,
          less the merchandise refunded on every return of the line.
        condition: >-
          The latest order_return_line row on the member's orders (ties: recorded first) has a membership_cash_reverse
          row whose source_order_event_id is that return, when the line's membership_cash_earn basis_amount_usd differs
          from RND(line amount_usd x (line quantity - quantity of order_refund_charge rows on the line) / line quantity,
          2) - the amount_usd of order_return_line rows on the line.
        resolved_by: reverse_business_return_cash_4d4108b5
        effect: >-
          Posting the missing reversal adds its amount and refunded merchandise to the twelve-month Cash reversed and reversal bases, which changes the Business-rate Cash the recovery takes and so the Business refund.
      - problem: membership_ext_unreturned_refund_reversal
        kind: value_input
        gate: business_rate_cash
        form: state
        policy_source: >-
          Before the Business refund is worked out, the most recent refund without a return made because an item was
          damaged on arrival or never received on the member's Northgate orders, the one with the latest refund date
          and, among refunds of one kind on that date, the one recorded first, and when a damaged-on-arrival refund and
          a never-received refund share that date, the damaged-on-arrival refund must carry its reversal on the
          membership's ledger, when the earning basis recorded on the Northgate Cash earning that points to its line differs
          from that line's kept-units basis, which is the line's net amount times the units bought less every unit
          refunded without a return on the line, divided by the units bought and rounded half up to the cent, less the
          merchandise refunded on every return of the line.
        condition: >-
          The latest order_refund_charge row with refund_reason item_damaged_no_return or item_not_received on the
          member's orders (ties: recorded first, damaged before never received) has a membership_cash_reverse row whose
          source_order_event_id is that refund, when the line's membership_cash_earn basis_amount_usd differs from
          RND(line amount_usd x (line quantity - quantity of order_refund_charge rows on the line) / line quantity, 2) -
          the amount_usd of order_return_line rows on the line.
        resolved_by: reverse_unreturned_refund_cash_522719bc
        effect: >-
          Posting the missing reversal adds its amount and refunded merchandise to the twelve-month Cash reversed and reversal bases, which changes the Business-rate Cash the recovery takes and so the Business refund.
    cross_category:
      - category: order
        as: history
        reads: [order_events.amount_usd, order_events.event_date, order_events.event_type]
        note: The volume recovery share takes its tier from the member's Northgate order lines of the last twelve months.
      - category: card
        as: branch
        reads: [variant_name, status]
        note: The Business cardholder courtesy takes its tier from the member's Northgate Card account in active status.
    factors:
      - id: business_money_back
        effect: method
        decides: closure_core
        bindings: [days_since_charge, last_use_on, recent_use_value, closure_core]
        ladder:
          - when: "the fee was charged no more than the tier's annual_full_refund_window_days days before the cancellation date and no benefit use is dated on or after the charge date"
            method: "the closure core is the whole fee"
          - when: "the fee was charged no more than that many days before and a benefit use is dated on or after the charge date"
            method: "the closure core is the whole fee less the value of the benefit uses dated within the one whole calendar month before the cancellation date, never less than the prorated fee"
          - when: "otherwise"
            method: "the closure core is the prorated fee"
        baseline: {closure_core: "prorated"}
        evidence: [date, history]
        cross_difficulty: null
      - id: volume_recovery_share
        effect: parameter
        decides: recovery_share
        bindings: [lines_12m, recovery_share]
        ladder:
          - when: "the member's Northgate order lines dated within the twelve whole calendar months before the cancellation date total volume_high_usd or more"
            value: "K('recovery_share_high')"
          - when: "they total volume_mid_usd to less than volume_high_usd"
            value: "K('recovery_share_mid')"
          - when: "otherwise"
            value: "1"
        baseline: {recovery_share: "1"}
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: hold_day_credit
        effect: parameter
        decides: hold_credit
        bindings: [held_period, held_declines, hold_credit]
        ladder:
          - when: "the billing period of the most recent settled fee carries two or more declined attempts"
            value: "DAYS(held_period, charged_on) * fee / K('days_in_year') * K('hold_share_full')"
          - when: "it carries exactly one declined attempt"
            value: "DAYS(held_period, charged_on) * fee / K('days_in_year') * K('hold_share_half')"
          - when: "otherwise"
            value: "0"
        baseline: {hold_credit: "0"}
        evidence: [history, date]
        cross_difficulty: null
      - id: business_cardholder_courtesy
        effect: parameter
        decides: courtesy_add
        bindings: [active_card_tier, courtesy_add]
        ladder:
          - when: "the member holds a Northgate Business Mastercard account in active status"
            value: "fee / P('term_months') * K('courtesy_share_high')"
          - when: "the member holds a Northgate Business Store Card account in active status"
            value: "fee / P('term_months') * K('courtesy_share_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {courtesy_add: "0"}
        evidence: [cross_category]
        cross_difficulty: card
      - id: benefit_usage_withholding
        effect: parameter
        decides: usage_take
        bindings: [uses_12m, usage_take]
        ladder:
          - when: "usage_uses_high or more benefit uses are dated within the twelve whole calendar months before the cancellation date"
            value: "fee / P('term_months') * K('usage_share_high')"
          - when: "usage_uses_mid to fewer than usage_uses_high are"
            value: "fee / P('term_months') * K('usage_share_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {usage_take: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: loyalty_credit
        effect: parameter
        decides: loyalty_add
        bindings: [settled_fees, loyalty_add]
        ladder:
          - when: "the membership carries loyal_fees_high or more settled annual fees"
            value: "fee / P('term_months') * K('loyal_share_high')"
          - when: "it carries exactly loyal_fees_mid settled annual fees"
            value: "fee / P('term_months') * K('loyal_share_mid')"
          - when: "otherwise"
            value: "0"
        baseline: {loyalty_add: "0"}
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The tier's annual Northgate Cash limit is its rewards_annual_earn_cap_usd. The Business refund refers to the
        most recent settled annual fee charge on the membership. When the membership
        carries no settled annual fee charge, nothing is refunded. The Business refund is the closure core less the Business Cash recovery, never more than that fee and never below zero, rounded down to the cent. When the refund comes to zero, the cancellation is still recorded and confirmed, and no refund entry is booked. The closure core is the prorated fee: the fee times the whole calendar months from the cancellation date
        to the renewal date, divided by the tier's term_months. The Business Cash recovery is the Business-rate Northgate Cash of the twelve whole calendar months before the cancellation date, never below zero and rounded half up to the cent. The Business-rate Cash is the net Business Cash minus the Rewards-rate Cash. The net Business Cash is the Cash earned in that period minus the Cash reversed in that period. The Rewards-rate Cash is rewards_base_rate_pct percent, the Northgate Rewards rate, of the net Business basis. The net Business basis is the earning bases of that period minus the reversal bases of that period.
      params: [term_months, rewards_base_rate_pct]
    inputs:
      history:
        - {table: membership_events, aggregate: latest, field: amount_usd, filters: {event_type: membership_fee_charge}}
        - {table: membership_events, aggregate: count, field: membership_event_id, filters: {event_type: membership_fee_decline}}
        - {table: membership_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: membership_cash_earn}}
        - {table: membership_events, aggregate: count, field: membership_event_id, within_months: 12, filters: {event_type: membership_benefit_use}}
        - {category: order, table: order_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: order_post_line}}
      cross_category: [order, card]
