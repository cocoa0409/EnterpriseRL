    factors:
      - id: closing_return_share
        effect: method
        decides: reversal_share
        bindings: [units_returned_line, adjustments_on_line, already_reversed, reversal_share]
        ladder:
          - when: "the units returned on all returns of the line reach the units bought on it"
            method: "the reversal share is the earned amount less the Cash already reversed on that earning"
          - when: "the units returned fall short of the units bought and the line carries a price adjustment"
            method: "the reversal share is the earned amount times the units returned on this return divided by the units bought"
          - when: "otherwise"
