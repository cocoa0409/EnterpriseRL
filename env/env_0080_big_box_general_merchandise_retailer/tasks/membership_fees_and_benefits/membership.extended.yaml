  - id: membership_ext_annual_cancel_refund
    base_policy_refs: [membership_evt_fee_refund, membership_cancellation]
    overwrite:
      - base_policy: membership_evt_fee_refund
        superseded_clause: >-
          The full refund also requires membership_msr_benefit_uses_since_charge to be zero, and its refund basis is
          full_within_window. Otherwise, where prorated_refund_on_cancel is true, the refund is fee x
          membership_msr_unused_full_months / term_months rounded down to the cent, with basis prorated_unused_months, and no
          refund is made when that count is zero.
        replaced_by: >-
          For the immediate cancellation of a Northgate+ Annual membership whose most recent settled annual fee was charged to
          an external card, and only for such a cancellation, the refund is worked out under this annual cancellation schedule; the immediate cancellation of a Northgate+ Business membership whose most recent settled annual fee was charged to an external card is worked out under the Business closure schedule, and every immediate cancellation that neither this annual cancellation schedule nor the Business closure schedule handles keeps the base measure, in which a cancellation inside the full refund window
          with no benefit use since the charge refunds the whole fee with basis full_within_window, and otherwise, where
          prorated_refund_on_cancel is true, the refund is the fee times the unused whole months divided by term_months,
          rounded down to the cent, with basis prorated_unused_months, and nothing is refunded when that count is zero.
      - base_policy: membership_evt_fee_refund
        superseded_clause: >-
          A refund never exceeds the fee it refers to, and benefits already used are never billed back.
        replaced_by: >-
          For a cancellation this annual cancellation schedule handles, the refund never exceeds the fee it
          refers to, and what the schedule takes from the refund for Northgate Cash or for benefits already
          received is taken only out of that refund, so nothing is ever billed to the member beyond it; for every cancellation that neither this annual cancellation schedule nor the Business closure schedule handles, a refund never exceeds the fee it refers to, and benefits already used are never billed back.
    trigger: on_request
    subject: [membership_fee_refund, membership_cancel_immediate]
    computes: refund_amount_usd
    target_tool: confirm_annual_membership_cancellation_fe7f482c
    params:
      third_term_fees: 3
      second_term_fees: 2
      recovery_share_third: 0.0
      recovery_share_second: 0.5
      streaming_share_current: 1.0
      streaming_share_recent: 0.5
      courtesy_share_high: 0.25
      courtesy_share_mid: 0.125
    rule: >-
      For the immediate cancellation of a Northgate+ Annual membership whose most recent settled annual fee was charged to
      an external card, and only for such a cancellation, the refund is worked out under this annual cancellation schedule; the immediate cancellation of a Northgate+ Business membership whose most recent settled annual fee was charged to an external card is worked out under the Business closure schedule, and every immediate cancellation that neither this annual cancellation schedule nor the Business closure schedule handles keeps the base measure, in which a cancellation inside the full refund window
      with no benefit use since the charge refunds the whole fee with basis full_within_window, and otherwise, where
      prorated_refund_on_cancel is true, the refund is the fee times the unused whole months divided by term_months,
      rounded down to the cent, with basis prorated_unused_months, and nothing is refunded when that count is zero.
      The cancellation is the member's own decision; the member confirms it, the membership closes on the
      cancellation date, and the refund is credited to the external card the fee was charged to. A line's net amount
      is the amount charged for the line after item promotions and the Northgate Card discount.
      For a cancellation this annual cancellation schedule handles, the refund never exceeds the fee it refers
      to, and what the schedule takes from the refund for Northgate Cash or for benefits already received is
      taken only out of that refund, so nothing is ever billed to the member beyond it; for every cancellation that neither this annual cancellation schedule nor the Business closure schedule handles, a refund never exceeds the fee it refers to, and benefits already used are never billed back.
      The refund is fixed only after the membership's ledger carries the Northgate Cash earning of the line recorded
      first on the member's Northgate order that has the latest fulfilled date among the member's orders in
      fulfilled status, on a shared latest date the order of them recorded first, when the line is not of a purchase
      type that never earns Northgate Cash, the membership is not canceled on its order's fulfilled date and the
      line's earning under the consumer earning schedule comes to at least one cent.
      The refund is not fixed until the most recent return recorded on the member's Northgate orders, the one with
      the latest return date and, among returns of the same date, the one recorded first has its Cash reversal on
      the membership's ledger, when the earning basis recorded on the Northgate Cash earning that points to its line differs from that line's kept-units basis, which is the line's net amount times the units bought less every
      unit refunded without a return on the line, divided by the units bought and rounded half up to the cent, less
      the merchandise refunded on every return of the line.
      The refund refers to the most recent settled annual fee charge on the membership. When the membership carries
      no settled annual fee charge, nothing is refunded.
      The refund is the refund core less the Cash recovery, never more than that fee and never below zero, rounded
      down to the cent. When the refund comes to zero, the cancellation is still recorded and confirmed, and no
      refund entry is booked.
      The refund core is the prorated fee: the fee times the whole calendar months from the cancellation date to the
      renewal date, divided by the tier's term_months.
      The Cash recovery is the member-bonus Northgate Cash of the twelve whole calendar months before the
      cancellation date, never below zero and rounded half up to the cent. The member-bonus Cash is the net Cash
      minus the base-rate Cash. The net Cash is the Cash earned in that period minus the Cash reversed in that
      period. The base-rate Cash is the tier's rewards_earn_rate_pct percent of the net basis. The net basis is the
      earning bases of that period minus the reversal bases of that period.
      Every schedule below either sets the refund core, sets the share of the member-bonus Cash that the Cash recovery
      takes, or adds an amount to or takes an amount from the refund before the cap, the floor and the rounding.
      Money-back schedule: when the fee was charged no more than the tier's annual_full_refund_window_days days before the
      cancellation date and no benefit use is dated on or after the charge date, the refund core is the whole fee; when
      the fee was charged no more than that many days before and a benefit use is dated on or after the charge date, the
      refund core is the whole fee less the value of the benefit uses dated within the one whole calendar month before the
      cancellation date, never less than the prorated fee; otherwise the refund core is the prorated fee.
      Recovery share: when the membership carries third_term_fees or more settled annual fees, the Cash recovery takes
      recovery_share_third of the member-bonus Cash; when it carries exactly second_term_fees, it takes
      recovery_share_second of it; otherwise it takes all of it.
      Streaming partner month: when the bundled streaming subscription was activated on or after the charge date, one
      month's share of the fee, the fee divided by term_months, times streaming_share_current is taken from the refund;
      when it was last activated before the charge date but within the twelve whole calendar months before the
      cancellation date, that month's share times streaming_share_recent is taken from it; otherwise nothing is taken.
      Cardholder courtesy: when the member holds a Northgate Store Card, Northgate Mastercard or Northgate World Mastercard
      account in active status, one month's share of the fee, the fee divided by term_months, times
      courtesy_share_high is added to the refund; when the
      member holds a Northgate Secured Card account in active status, one month's share times courtesy_share_mid is added;
      otherwise nothing is added.
      The refund is recorded with basis full_within_window when the fee was charged no more than the tier's
      annual_full_refund_window_days days before the cancellation date, and with basis prorated_unused_months otherwise.
    compute:
      - fee_ref: "LATEST('membership_events', 'membership_event_id', event_type='membership_fee_charge')"
      - fee: "SUM('membership_events', 'amount_usd', membership_event_id=fee_ref)"
      - charged_on: "LATEST('membership_events', 'event_date', event_type='membership_fee_charge') or NOW"
      - months_left: "MONTHS(NOW, F('renewal_date') or NOW)"
      - prorated: "fee * months_left / P('term_months')"
      - days_since_charge: "DAYS(charged_on, NOW)"
      - last_use_on: "LATEST('membership_events', 'event_date', event_type='membership_benefit_use')"
      - recent_use_value: "SUM('membership_events', 'amount_usd', within_months=1, date_field='event_date', event_type='membership_benefit_use')"
      - refund_core: "fee if (days_since_charge <= P('annual_full_refund_window_days') and (last_use_on or '0000-00-00') < charged_on) else (MX(prorated, fee - recent_use_value) if (days_since_charge <= P('annual_full_refund_window_days') and (last_use_on or '0000-00-00') >= charged_on) else prorated)"
      - settled_fees: "COUNT('membership_events', event_type='membership_fee_charge', fee_type='annual_fee')"
      - recovery_share: "K('recovery_share_third') if settled_fees >= K('third_term_fees') else (K('recovery_share_second') if settled_fees == K('second_term_fees') else 1)"
      - earned_12m: "SUM('membership_events', 'amount_usd', within_months=12, date_field='event_date', event_type='membership_cash_earn')"
      - earned_basis_12m: "SUM('membership_events', 'basis_amount_usd', within_months=12, date_field='event_date', event_type='membership_cash_earn')"
      - reversed_12m: "SUM('membership_events', 'amount_usd', within_months=12, date_field='event_date', event_type='membership_cash_reverse')"
      - reversed_basis_12m: "SUM('membership_events', 'basis_amount_usd', within_months=12, date_field='event_date', event_type='membership_cash_reverse')"
      - bonus_net: "MX(0, (earned_12m - reversed_12m) - (earned_basis_12m - reversed_basis_12m) * P('rewards_earn_rate_pct') / 100)"
      - cash_recovery: "RND(bonus_net * recovery_share + 0.000000001, 2)"
      - streaming_last: "LATEST('membership_events', 'event_date', event_type='membership_benefit_use', benefit_type='streaming_activation')"
      - streaming_take: "fee / P('term_months') * K('streaming_share_current') if (streaming_last or '0000-00-00') >= charged_on else (fee / P('term_months') * K('streaming_share_recent') if MONTHS(streaming_last or '0000-01-01', NOW) < 12 else 0)"
      - active_card_tier: "CFIELD('card', 'variant_name', status='active')"
      - courtesy_add: "fee / P('term_months') * K('courtesy_share_high') if (active_card_tier == 'Northgate Store Card' or active_card_tier == 'Northgate Mastercard' or active_card_tier == 'Northgate World Mastercard') else (fee / P('term_months') * K('courtesy_share_mid') if active_card_tier == 'Northgate Secured Card' else 0)"
      - result: "MX(0, int(MN(fee, refund_core - streaming_take + courtesy_add - cash_recovery) * 100 + 0.000000001) / 100)"
    compute_basis:
      fee_ref: "The refund refers to the most recent settled annual fee charge on the membership. When the membership carries no settled annual fee charge, nothing is refunded."
      fee: "The refund refers to the most recent settled annual fee charge on the membership. When the membership carries no settled annual fee charge, nothing is refunded."
