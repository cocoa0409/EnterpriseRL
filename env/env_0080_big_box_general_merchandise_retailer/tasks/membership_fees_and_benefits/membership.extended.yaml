      card_pts: "Card points: a line paid with a Northgate Card whose account is a Northgate Store Card, Northgate Mastercard or Northgate World Mastercard in active status adds card_points_high points; a line paid with a Northgate Card whose account is a Northgate Secured Card in active status adds card_points_mid points; any other line adds no points."
