category: membership
display_name: Northgate Rewards and Northgate+ Memberships

binding:
  holding_table: membership_holdings
  event_tables: [membership_events]
  intake_tables: [membership_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {rewards_cash_balance: rewards_cash}

lifecycle:
  states: [enrolled, trial, active, payment_hold, cancel_pending, canceled]
  transitions:
    - {from: enrolled, to: trial, by: system, means: A first-time paid member whose tier offers a free trial starts the trial on the enrollment date.}
    - {from: enrolled, to: active, by: system, means: The free tier activates at once, or a paid tier activates when its first fee settles without a trial.}
    - {from: enrolled, to: canceled, by: system, means: An Assist, Student or Business enrollment whose eligibility proof is not confirmed is closed without any charge.}
    - {from: trial, to: active, by: system, means: The trial ends on the trial end date and the first membership fee settles.}
    - {from: trial, to: canceled, by: user, means: The member cancels during the trial and is never charged.}
    - {from: active, to: payment_hold, by: system, means: A renewal fee is declined and paid benefits are suspended while retries run.}
    - {from: payment_hold, to: active, by: system, means: A retry or an updated payment method settles the outstanding fee.}
    - {from: payment_hold, to: canceled, by: system, means: The payment hold grace period lapses without a settled fee and the membership ends.}
    - {from: active, to: cancel_pending, by: user, means: The member turns off auto-renew and keeps paid benefits until the current term ends.}
    - {from: cancel_pending, to: active, by: user, means: The member turns auto-renew back on before the current term ends.}
    - {from: cancel_pending, to: canceled, by: system, means: The current term ends with auto-renew off and the membership closes without a renewal charge.}
    - {from: active, to: canceled, by: user, means: The member cancels an annual-billed membership immediately and the fee refund is evaluated.}

accounts:
  - key: membership_fees
    unit: USD
    meaning: Net membership fees collected on this membership; settled fee charges book in and fee refunds book out.
  - key: rewards_cash
    unit: USD
    meaning: Northgate Cash balance earned on eligible purchases; earnings book in, and redemptions, return reversals and expirations book out.

parameter_schema:
  fee_amount_usd: Membership fee charged each billing cycle, USD with 2 decimals (0.00 for the free tier)
  billing_cycle: Billing cycle of the fee, enum none|monthly|annual
  term_months: Length of one paid term in calendar months (0 for the free tier, which has no paid term)
  fee_charge_day_basis: Day of month on which renewal fees are charged; enrollment_day means the calendar day of
    term_start_date, falling back to the last day of a shorter month
  free_trial_days: Length of the free trial offered to first-time paid members, calendar days (0 means no trial
    is offered)
  trial_lookback_months: A trial is not offered if any settled membership fee was charged to this customer within
    this many calendar months before the enrollment date
  trial_payment_method_required: Whether a payment method must be on file to start a trial, boolean
  trial_conversion_notice_days: Calendar days before the trial end date on which the conversion reminder is sent
    (0 means no reminder because no trial exists)
  annual_renewal_notice_days: Calendar days before an annual renewal date on which the renewal reminder is sent
    (0 for tiers not billed annually)
  free_standard_shipping_min_order_usd: Merchandise subtotal at or above which a member gets free standard shipping
    on Ship to Home orders, USD; not_applicable where the tier adds no shipping benefit beyond the order charter's
    standard free-shipping rule
  same_day_delivery_included: Whether the tier includes free Same-Day Delivery at or above the same-day minimum,
    boolean
  same_day_free_min_order_usd: Merchandise subtotal at or above which the Same-Day Delivery fee is waived, USD;
    not_applicable where same-day is not included
  member_small_order_same_day_fee_usd: Reduced Same-Day Delivery fee a member pays on an order below the same-day
    minimum, USD; not_applicable where same-day is not included
  member_express_fee_usd: Express (within two hours) delivery fee charged to a member in place of the standard express
    fee, USD; not_applicable where same-day is not included
  free_return_pickup_included: Whether a member may schedule a free from-home return pickup for eligible Northgate-sold
    items, boolean
  delivery_benefit_excluded_fulfilment: Fulfilment programs and item types on which delivery benefits never apply,
    list
  benefit_statuses: Membership statuses in which delivery and fuel benefits apply on the order date, list
  benefit_value_basis: 'How the value of one benefit use is measured: the fee that would have been charged without
    the benefit, minus any fee actually charged'
  fuel_discount_cents_per_gallon: Fuel discount at Northgate Fuel stations, US cents per gallon
  streaming_benefit_included: Whether the tier includes the bundled streaming subscription, boolean
  early_deal_access_hours: Hours of early access to Northgate Deal Days events ahead of the general start
  household_additional_members_max: Number of additional household members who may share the delivery benefits
  business_user_seats_max: Number of employee sign-ins that may share a Business membership's benefits
  business_tax_exempt_checkout: Whether the membership supports tax-exempt checkout once a valid exemption certificate
    is on file with Northgate Business, boolean
  rewards_earn_rate_pct: Northgate Cash earned as a percentage of the eligible net merchandise amount
  rewards_annual_earn_cap_usd: Maximum Northgate Cash earned per calendar year, USD; no_cap means unlimited
  rewards_excluded_purchases: Purchase types that never earn Northgate Cash, list
  rewards_earn_posting_basis: 'When earned Northgate Cash posts: on the date the order line is fulfilled'
  rewards_rounding: Rounding applied to each earned or reversed Northgate Cash amount
  rewards_min_redemption_usd: Smallest Northgate Cash amount that can be applied to a purchase, USD
  rewards_redemption_channels: Channels where Northgate Cash can be redeemed, list
  rewards_redemption_excluded: Purchase types Northgate Cash cannot pay for, list
  rewards_expiry_months: Calendar months after the earn date at which unredeemed Northgate Cash from that earning
    expires
  rewards_reversal_on_return: Whether Northgate Cash earned on a returned or refunded line is reversed, boolean
  rewards_negative_balance_allowed: Whether a reversal larger than the current balance may take the balance below
    zero (netted by later earnings), boolean
  rewards_forfeit_on_cancel: Whether the Northgate Cash balance is forfeited when the membership closes, boolean
  annual_full_refund_window_days: Calendar days after a settled annual fee within which cancelling with no benefit
    use refunds the full fee (0 means no full-refund window)
  full_refund_requires_no_benefit_use: Whether the full refund inside the window requires zero benefit uses since
    that fee charge, boolean
  prorated_refund_on_cancel: Whether immediate cancellation outside the full-refund window refunds a prorated part
    of the fee, boolean
  prorated_refund_basis: 'Basis of the prorated refund: unused_full_months refunds fee x (whole calendar months
    remaining before renewal_date) / term_months; none means no proration'
  refund_rounding: Rounding of a prorated fee refund
  monthly_cancel_effective: When cancellation of a monthly-billed or free membership takes effect
  immediate_cancel_allowed: Whether the member may choose immediate cancellation instead of cancellation at term
    end, boolean
  billing_error_refund: Refund owed on a duplicate fee or a fee charged after a confirmed cancellation
  payment_retry_attempts: Number of automatic retries after a declined renewal fee
  payment_retry_interval_days: Calendar days between the decline and each automatic retry
  payment_hold_grace_days: Calendar days after the first declined renewal fee after which an unpaid membership lapses
    to canceled
  benefits_during_payment_hold: Whether paid benefits apply while the membership is on payment hold, boolean
  eligibility_reverify_months: Calendar months after eligibility_verified_date at which eligibility must be re-verified
    (0 means no re-verification)
  max_discounted_months: Maximum cumulative months a member may hold the discounted tier (0 means no limit)
  reverify_failure_tier: Tier the membership moves to at the next renewal when re-verification is not completed
  plan_switch_effective: When a change between paid tiers takes effect
  eligibility_proof_types: Accepted proofs of eligibility for the tier, list
  minimum_age_years: Minimum whole years of age on the enrollment date, computed from the profile date of birth
