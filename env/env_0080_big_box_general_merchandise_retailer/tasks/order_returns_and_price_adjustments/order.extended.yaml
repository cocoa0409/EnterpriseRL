events:
  - type: order_place
    target: order_holdings
    mutation: create
    meaning: A customer places an order in a fulfilment program or completes a purchase at a register.
    grain: One row per order or register receipt.
    fields:
      variant_name: Fulfilment program.
      order_date: Date of the order or register sale.
      channel: in_store, online or app.
      store_number: Store that sold, picks or ships the order.
      order_number: Customer-facing order or receipt number.
      payment_method_type: Primary tender.
      card_account_id: Northgate Card account charged, if any.
      scheduled_date: Delivery date chosen for a large-item order; empty otherwise.
    triggers: []
  - type: order_mark_ready
    target: order_holdings
    mutation: {transition: {from: placed, to: ready}}
    meaning: A pickup or Drive Up order is ready for collection.
    grain: One row per transaction.
    fields:
      ready_date: Date the order became ready.
    triggers: []
  - type: order_fulfil
    target: order_holdings
    mutation: {transition: {from: placed, to: fulfilled}}
    meaning: A register sale completes, or a shipped, same-day or large-item order is delivered.
    grain: One row per transaction.
    fields:
      fulfilled_date: Date of the sale or delivery.
    triggers: []
  - type: order_collect
    target: order_holdings
    mutation: {transition: {from: ready, to: fulfilled}}
    meaning: The customer collects a ready pickup or Drive Up order.
    grain: One row per transaction.
    fields:
      fulfilled_date: Date of collection.
    triggers: []
  - type: order_cancel
    target: order_holdings
    mutation: {transition: {from: placed, to: canceled}}
    meaning: The customer's confirmed cancellation of an order that is not yet ready, shipped or out for delivery.
    grain: One row per transaction.
    fields:
      canceled_date: Date of cancellation.
    triggers: []
  - type: order_cancel_unclaimed
    target: order_holdings
    mutation: {transition: {from: ready, to: canceled}}
    meaning: A ready order not collected within the hold period is canceled.
    grain: One row per transaction.
    fields:
      canceled_date: Day after the last hold day.
    triggers: []
  - type: order_mark_returned
    target: order_holdings
    mutation: {transition: {from: fulfilled, to: returned}}
    meaning: Every unit on the order has been returned or refunded.
    grain: One row per transaction.
    fields:
      returned_date: Date of the last return.
    triggers: []
  - type: order_reschedule
    target: order_holdings
    mutation: update
    meaning: The delivery date of a large-item order is changed.
    grain: One row per reschedule.
    fields:
      scheduled_date: New delivery date.
      reschedule_count: Number of reschedules made so far.
    triggers: []
  - type: order_post_line
    target: order_events
    meaning: One merchandise line of an order is charged.
    grain: One row per order line.
    distinguish_by: [sku, line_number]
    fields:
      event_date: Order date.
      line_number: Line position on the order.
      sku: Item number.
      item_description: Item name as printed on the receipt.
      item_category: Merchandise category.
      return_class: Return class that sets the return window.
      quantity: Units bought.
      unit_price_usd: Selling price per unit before promotions.
      promo_discount_usd: Item promotion discount on the line, positive.
      cardholder_discount_usd: Northgate Card discount on the line, positive.
      amount_usd: Net amount paid for the line before tax, positive.
      manufacturer_warranty_months: Manufacturer warranty length of the item in months.
      substituted: Whether the line is an accepted substitute.
      payment_method_type: Tender charged.
      card_account_id: Northgate Card account charged, if any.
    account: order_amount_paid
    direction: in
    triggers: []
  - type: order_charge_fee
    target: order_events
    meaning: A fulfilment, express, haul-away or late-cancellation fee is charged on an order, or recorded as waived.
    grain: One row per fee on an order.
    distinguish_by: [fee_type]
    fields:
      event_date: Order date.
      fee_type: shipping, same_day_delivery, express_delivery, large_item_delivery, haul_away or late_cancellation.
      standard_fee_usd: The fee before any benefit.
      amount_usd: Fee charged after benefits, 0.00 when fully waived.
      fee_waiver_source: none, membership, northgate_card, order_threshold or promotion.
      payment_method_type: Tender charged.
      card_account_id: Northgate Card account charged, if any.
    account: order_amount_paid
    direction: in
    triggers:
      - event: membership:membership_benefit_use
        when: {fee_waiver_source: membership}
        map: {order_id: order_id, event_date: event_date}
  - type: order_return_line
    target: order_events
    meaning: Units of one order line are returned and refunded.
    grain: One row per return transaction of one line.
    distinguish_by: [original_event_id, event_date, return_number]
    fields:
      event_date: Date the return was processed.
      original_event_id: The order_post_line row returned.
      return_number: Return authorization number printed on the return receipt.
      quantity: Units returned.
      amount_usd: Merchandise refund, positive, after any restocking fee.
      restocking_fee_usd: Restocking fee withheld, 0.00 when none.
      return_method: in_store, drive_up, mail or home_pickup.
      return_reason: changed_mind, defective, damaged_in_transit, wrong_item or not_as_described.
      receipt_type: receipt, gift_receipt or no_receipt.
      refund_method: original_payment, merchandise_return_card_no_receipt or merchandise_return_card_gift_receipt.
      plan_id: The Northgate Protect plan covering the returned unit, empty when none.
      payment_method_type: Tender credited.
      card_account_id: Northgate Card account credited, if any.
    account: order_amount_paid
    direction: out
    triggers:
      - event: card:card_post_credit
        when: {refund_method: original_payment, payment_method_type: northgate_card}
        map: {card_account_id: card_account_id, amount_usd: amount_usd, event_date: event_date}
      - event: gift:gift_issue_card
        when: {refund_method: merchandise_return_card_no_receipt}
        map: {initial_value_usd: amount_usd, issue_date: event_date, issue_reason: no_receipt_return}
      - event: gift:gift_issue_card
        when: {refund_method: merchandise_return_card_gift_receipt}
        map: {initial_value_usd: amount_usd, issue_date: event_date, issue_reason: gift_receipt_return}
      - event: plan:plan_cancel
        when: {plan_id: {not: ""}}
        map: {closed_date: event_date}
  - type: order_adjust_price
    target: order_events
    meaning: A price drop adjustment or competitor price match refunds part of one line.
    grain: One row per adjustment of one line.
    distinguish_by: [original_event_id]
    fields:
      event_date: Date of the adjustment.
      original_event_id: The order_post_line row adjusted.
      adjustment_type: price_drop_adjustment or competitor_price_match.
      matched_competitor: Competitor matched, or northgate for a price drop.
      adjusted_unit_price_usd: The lower unit price matched.
      quantity: Units adjusted (units still held).
      amount_usd: Amount refunded, positive.
      payment_method_type: Tender credited.
      card_account_id: Northgate Card account credited, if any.
    account: order_amount_paid
    direction: out
    triggers:
      - event: card:card_post_credit
        when: {payment_method_type: northgate_card}
        map: {card_account_id: card_account_id, amount_usd: amount_usd, event_date: event_date}
  - type: order_refund_charge
    target: order_events
    meaning: A line or fee is refunded without a return, because the order was canceled or unclaimed, an item never arrived or arrived damaged, or a fee is refunded.
    grain: One row per refunded line or fee.
    distinguish_by: [original_event_id, refund_reason]
    fields:
      event_date: Refund date.
      original_event_id: The order_post_line or order_charge_fee row refunded.
      refund_reason: order_canceled, unclaimed_pickup, item_not_received, item_damaged_no_return or fee_refund.
      quantity: Units refunded, 0 for a fee.
      amount_usd: Amount refunded, positive.
      payment_method_type: Tender credited.
      card_account_id: Northgate Card account credited, if any.
    account: order_amount_paid
    direction: out
    triggers:
      - event: card:card_post_credit
        when: {payment_method_type: northgate_card}
        map: {card_account_id: card_account_id, amount_usd: amount_usd, event_date: event_date}

measures:
  - id: order_msr_units_returned
    window: The whole life of the order line up to the date being evaluated.
    measure: Sum of quantity of order_return_line and order_refund_charge rows whose original_event_id is the order line being evaluated.
  - id: order_msr_no_receipt_returns_45d
    window: Rolling 45 calendar days ending on the return date being evaluated, inclusive.
    measure: Count, and separately the sum of amount_usd, of order_return_line rows on any order of the customer with receipt_type no_receipt and event_date in the window.
  - id: order_msr_line_adjustments
    window: The whole life of the order line.
    measure: Count of order_adjust_price rows whose original_event_id is the order line being evaluated.

policies:
  - id: order_agg_multi_holding
    subject: [order_place]
    rule: >-
      A customer may have any number of orders, in any mix of fulfilment programs, open at once; each order is its own
      record with its own payment, fees, return windows and adjustments, and nothing on one order is netted against
      another. Thresholds such as free-shipping minimums and minimum order amounts are measured on the single order's
      merchandise subtotal and never by combining orders.
    eligibility: []
    params:
      max_per_customer: null

  - id: order_agg_no_receipt_limits
    subject: [order_return_line]
    rule: >-
      Returns without a receipt are counted across all of the customer's orders and register purchases. They are accepted
      only in store, with photo ID, and only where no_receipt_returns_allowed is true. A return without a receipt is
      refused once order_msr_no_receipt_returns_45d has reached no_receipt_returns_per_45_days returns, or when it would take
      the 45-day refunded value above no_receipt_value_per_45_days_usd, in which case it is refused whole and not partly
      refunded. The refund price is the lowest selling price of the item in the 90 days before the return, and it is paid
      on a merchandise return card. A return with a gift receipt is refunded at the price paid, net of all discounts, on a
      merchandise return card and does not count toward these limits.
      These follow no_receipt_price_basis and no_receipt_refund_method.
    eligibility: []
    measures: [order_msr_no_receipt_returns_45d]
    params:
      per_tier:
        Northgate In-Store Purchase: {no_receipt_returns_per_45_days: "=no_receipt_returns_per_45_days", no_receipt_value_per_45_days_usd: "=no_receipt_value_per_45_days_usd"}
        Northgate Order Pickup: {no_receipt_returns_per_45_days: "=no_receipt_returns_per_45_days", no_receipt_value_per_45_days_usd: "=no_receipt_value_per_45_days_usd"}
        Northgate Drive Up: {no_receipt_returns_per_45_days: "=no_receipt_returns_per_45_days", no_receipt_value_per_45_days_usd: "=no_receipt_value_per_45_days_usd"}
        Northgate Ship to Home: {no_receipt_returns_per_45_days: "=no_receipt_returns_per_45_days", no_receipt_value_per_45_days_usd: "=no_receipt_value_per_45_days_usd"}
        Northgate Same-Day Delivery: {no_receipt_returns_per_45_days: "=no_receipt_returns_per_45_days", no_receipt_value_per_45_days_usd: "=no_receipt_value_per_45_days_usd"}
        Northgate Scheduled Large-Item Delivery: {no_receipt_returns_per_45_days: "=no_receipt_returns_per_45_days", no_receipt_value_per_45_days_usd: "=no_receipt_value_per_45_days_usd"}

  - id: order_evt_fees
    subject: [order_charge_fee]
    rule: >-
      Each order is charged its program's standard_fee_usd as fee type standard_fee_type, and an express order the
      express_fee_usd, unless a benefit lowers the fee. The standard fee is waived for every customer when the merchandise
      subtotal is at least free_standard_fee_min_order_usd, recorded with waiver source order_threshold. Where
      member_benefit_eligible is true the customer's membership delivery benefit applies as stated in
      membership_delivery_benefit, and where cardholder_shipping_benefit_eligible is true and the order is paid with a
      Northgate Card the cardholder shipping benefit applies as stated in card_cardholder_benefits. When several sources
      lower the same fee, the fee charged is the lowest any one source yields and the waiver source recorded is the one
      that yields it, in the order order_threshold, membership, northgate_card, promotion when two or more tie. The
      merchandise subtotal is the sum of line prices after item promotions and before the cardholder discount, Northgate
      Cash, gift cards and tax. A haul-away fee of haul_away_fee_usd is charged per old item removed, and a large-item
      order canceled or rescheduled within cancel_cutoff_hours_before_scheduled hours of the scheduled date, beyond the
      free reschedules, carries late_cancel_fee_usd. A fee is refunded only as stated in order_returns and
      order_fulfilment_and_cancellation.
      Express orders arrive within express_window_hours hours, the checkout promise follows promised_lead, and large-item deliveries need an adult signature where delivery_signature_required is true.
    eligibility: []
    params:
      per_tier:
        Northgate In-Store Purchase: {standard_fee_usd: "=standard_fee_usd", free_standard_fee_min_order_usd: "=free_standard_fee_min_order_usd", express_fee_usd: "=express_fee_usd"}
        Northgate Order Pickup: {standard_fee_usd: "=standard_fee_usd", free_standard_fee_min_order_usd: "=free_standard_fee_min_order_usd", express_fee_usd: "=express_fee_usd"}
        Northgate Drive Up: {standard_fee_usd: "=standard_fee_usd", free_standard_fee_min_order_usd: "=free_standard_fee_min_order_usd", express_fee_usd: "=express_fee_usd"}
        Northgate Ship to Home: {standard_fee_usd: "=standard_fee_usd", free_standard_fee_min_order_usd: "=free_standard_fee_min_order_usd", express_fee_usd: "=express_fee_usd"}
        Northgate Same-Day Delivery: {standard_fee_usd: "=standard_fee_usd", free_standard_fee_min_order_usd: "=free_standard_fee_min_order_usd", express_fee_usd: "=express_fee_usd"}
        Northgate Scheduled Large-Item Delivery: {standard_fee_usd: "=standard_fee_usd", free_standard_fee_min_order_usd: "=free_standard_fee_min_order_usd", express_fee_usd: "=express_fee_usd"}

  - id: order_placement_and_lines
    subject: [order_place, order_post_line]
    rule: >-
      An order is accepted only through the program's order_channels and only when its merchandise subtotal is at least
      minimum_order_usd. Each line is charged at its selling price less item promotions and, where the card pays and the
      item is eligible, the cardholder discount under card_cardholder_benefits; the net line amount is what the customer
      paid for the line before tax. Where substitutions_allowed is true and the customer allowed substitutes, an
      out-of-stock item may be replaced by a substitute charged under substitution_price_rule. Alcohol is sold only where
      alcohol_allowed is true and is handed over only after an age check. Northgate Cash earned on lines follows
      membership_evt_cash_earn.
      Each order carries a reference in order_number_format.
    eligibility: []
    params:
      per_tier:
        Northgate In-Store Purchase: {order_channels: "=order_channels", minimum_order_usd: "=minimum_order_usd", substitutions_allowed: "=substitutions_allowed"}
        Northgate Order Pickup: {order_channels: "=order_channels", minimum_order_usd: "=minimum_order_usd", substitutions_allowed: "=substitutions_allowed"}
        Northgate Drive Up: {order_channels: "=order_channels", minimum_order_usd: "=minimum_order_usd", substitutions_allowed: "=substitutions_allowed"}
        Northgate Ship to Home: {order_channels: "=order_channels", minimum_order_usd: "=minimum_order_usd", substitutions_allowed: "=substitutions_allowed"}
        Northgate Same-Day Delivery: {order_channels: "=order_channels", minimum_order_usd: "=minimum_order_usd", substitutions_allowed: "=substitutions_allowed"}
        Northgate Scheduled Large-Item Delivery: {order_channels: "=order_channels", minimum_order_usd: "=minimum_order_usd", substitutions_allowed: "=substitutions_allowed"}

  - id: order_fulfilment_and_cancellation
    subject: [order_mark_ready, order_fulfil, order_collect, order_cancel, order_cancel_unclaimed, order_reschedule, order_refund_charge, order_mark_returned]
    rule: >-
      A pickup or Drive Up order is held for pickup_hold_days calendar days after its ready date; collected within that
      time it becomes fulfilled on the collection date, and not collected it is canceled on the day after the last hold
      day and every line and fee is refunded with reason unclaimed_pickup. Cancelling an order is the customer's own
      decision, recorded in order_requests and confirmed by the customer. An order can be canceled only while it is in
      placed status. A canceled order refunds every line and fee with reason order_canceled, except the late
      cancellation fee of a large-item order under order_evt_fees. A large-item delivery may be rescheduled before the
      cutoff, the first large_item_reschedules_free reschedules carrying no fee. An item reported missing, or damaged on
      arrival, within missing_item_report_days days of the fulfilled date is refunded without a return with reason
      item_not_received or item_damaged_no_return; a report after that is handled as an ordinary return under
      order_returns. The fulfilment fee is refunded with reason fee_refund only when the whole order was not received or
      under order_returns. When every unit of every line has been returned or refunded the order becomes returned.
      The statuses open to cancellation are listed in cancel_allowed_statuses, an unclaimed order is refunded under unclaimed_refund, and photo ID is checked at pickup where pickup_id_required is true.
    eligibility:
      - id: cancel_placed_only
        applies_to: [order_cancel]
        kind: state
        condition: An order can be canceled only while it is in placed status.
        evidence_fields: [order_holdings.status, order_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.order_id]
          action_bindings:
            order_holdings.order_id: order_id
        state_contract:
          field: order_holdings.status
          allowed: [placed]
    params:
      per_tier:
        Northgate In-Store Purchase: {pickup_hold_days: "=pickup_hold_days", missing_item_report_days: "=missing_item_report_days", large_item_reschedules_free: "=large_item_reschedules_free"}
        Northgate Order Pickup: {pickup_hold_days: "=pickup_hold_days", missing_item_report_days: "=missing_item_report_days", large_item_reschedules_free: "=large_item_reschedules_free"}
        Northgate Drive Up: {pickup_hold_days: "=pickup_hold_days", missing_item_report_days: "=missing_item_report_days", large_item_reschedules_free: "=large_item_reschedules_free"}
        Northgate Ship to Home: {pickup_hold_days: "=pickup_hold_days", missing_item_report_days: "=missing_item_report_days", large_item_reschedules_free: "=large_item_reschedules_free"}
        Northgate Same-Day Delivery: {pickup_hold_days: "=pickup_hold_days", missing_item_report_days: "=missing_item_report_days", large_item_reschedules_free: "=large_item_reschedules_free"}
        Northgate Scheduled Large-Item Delivery: {pickup_hold_days: "=pickup_hold_days", missing_item_report_days: "=missing_item_report_days", large_item_reschedules_free: "=large_item_reschedules_free"}

  - id: order_returns
    subject: [order_return_line]
    rule: >-
      A return is accepted only on an order in fulfilled status. Each item's return window is the return_window_days_by_class
      entry for the line's return class; items of class non_returnable cannot be returned, only refunded under
      order_fulfilment_and_cancellation when missing or damaged on arrival. A return with a receipt is accepted only when
      the return date is no later than the fulfilled date plus the item's return window days. Calendar days are added to
      the fulfilled date, the day after it being day 1, after first extending the window by card_cardholder_benefits
      extra days when the line was paid with a Northgate Card and, for a line of a holiday_rule_classes class ordered
      inside holiday_purchase_period, counting from holiday_return_start of that year instead whenever that date is later
      than the fulfilled date; a return on the last day still qualifies. The units returned on a line can never exceed the
      units bought less the units already returned or refunded. The merchandise refund is the line's net amount per unit
      times the units returned, rounded half up to the cent, less restocking_fee_pct_changed_mind percent where the reason
      is changed_mind and the class is in restocking_fee_classes. The order's fulfilment fee is refunded with reason
      fee_refund only when the return reason is in fee_refund_reasons. A refund with a receipt is paid under
      refund_tender_rule, a gift-receipt or no-receipt return under order_agg_no_receipt_limits. Returns are made through
      the program's return_methods. A defect found after the window is routed under defective_after_window_route. A
      returned unit's Northgate Protect plan is canceled with a full refund under plan_cancellation_refund, and Northgate
      Cash earned on it is reversed under membership_evt_cash_reverse.
      The window anchor is return_window_anchor, a mail return label costs mail_return_label_fee_usd, and proof of purchase may be any of receipt_lookup_methods.
    eligibility:
      - id: fulfilled_only
        applies_to: [order_return_line]
        kind: state
        condition: A return is accepted only on an order in fulfilled status.
        evidence_fields: [order_holdings.status, order_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.order_id]
          action_bindings:
            order_holdings.order_id: order_id
        state_contract:
          field: order_holdings.status
          allowed: [fulfilled]
      - id: return_window
        applies_to: [order_return_line]
        kind: time
        condition: A return with a receipt is accepted only when the return date is no later than the fulfilled date plus the item's return window days.
        evidence_fields: [order_holdings.fulfilled_date, order_holdings.order_id, order_events.return_class]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.order_id]
          action_bindings:
            order_holdings.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fulfilled date
          anchor_source: order_holdings.fulfilled_date
          relation: not_after
          duration_source: variants.return_window_days_by_class
          unit: calendar_days
          counting_rule: Calendar days are added to the fulfilled date, the day after it being day 1, after first extending the window by card_cardholder_benefits extra days when the line was paid with a Northgate Card and, for a line of a holiday_rule_classes class ordered inside holiday_purchase_period, counting from holiday_return_start of that year instead whenever that date is later than the fulfilled date; a return on the last day still qualifies.
          boundary: inclusive
      - id: units_available
        applies_to: [order_return_line]
        kind: dedup
        condition: The units returned on a line can never exceed the units bought less the units already returned or refunded.
        evidence_fields: [order_events.original_event_id, order_events.quantity, order_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_events.original_event_id]
          action_bindings:
            order_events.original_event_id: original_event_id
        dedup_contract:
          table: order_events
          mode: separate_record
          object_bindings: {original_event_id: original_event_id}
          duplicate_filters: {event_type: [order_return_line, order_refund_charge]}
          distinct_fields: [return_number, event_date]
    measures: [order_msr_units_returned]
    params:
      per_tier:
        Northgate In-Store Purchase: {return_window_days_by_class: "=return_window_days_by_class", restocking_fee_pct_changed_mind: "=restocking_fee_pct_changed_mind", return_methods: "=return_methods"}
        Northgate Order Pickup: {return_window_days_by_class: "=return_window_days_by_class", restocking_fee_pct_changed_mind: "=restocking_fee_pct_changed_mind", return_methods: "=return_methods"}
        Northgate Drive Up: {return_window_days_by_class: "=return_window_days_by_class", restocking_fee_pct_changed_mind: "=restocking_fee_pct_changed_mind", return_methods: "=return_methods"}
        Northgate Ship to Home: {return_window_days_by_class: "=return_window_days_by_class", restocking_fee_pct_changed_mind: "=restocking_fee_pct_changed_mind", return_methods: "=return_methods"}
        Northgate Same-Day Delivery: {return_window_days_by_class: "=return_window_days_by_class", restocking_fee_pct_changed_mind: "=restocking_fee_pct_changed_mind", return_methods: "=return_methods"}
        Northgate Scheduled Large-Item Delivery: {return_window_days_by_class: "=return_window_days_by_class", restocking_fee_pct_changed_mind: "=restocking_fee_pct_changed_mind", return_methods: "=return_methods"}

  - id: order_price_adjustment
    subject: [order_adjust_price]
    rule: >-
      When Northgate lowers its own selling price on an item, or a listed competitor in price_match_competitors offers
      the identical item in stock at a lower price, the customer is refunded the difference on the units still held. A
      price adjustment or match is granted only when it is requested no later than the order date plus the tier's price
      adjust window days. Calendar days are added to the order date, the day after the order being day 1, and a request on
      the last day still qualifies. The lower price must be a regular or advertised price available to every customer;
      offers in price_match_exclusions are never matched, and Northgate Marketplace seller offers are never used. Each order
      line may be adjusted only once, whichever kind of adjustment is used first. The refund is (the line's net unit price
      before the cardholder discount minus the lower unit price) times the units still held (units bought less units
      returned or refunded), and where the line was paid with a Northgate Card the refund is reduced by the cardholder
      discount percentage so that it reflects what was actually paid; it is rounded half up to the cent and credited to
      the tender that paid the line. Northgate Cash already earned on the line is not changed. No adjustment is made on
      units already returned or on an order not yet fulfilled, which instead is charged the price at fulfilment.
      This follows price_adjustments_per_line, price_match_requires_identical_in_stock and price_adjust_refund_basis.
    eligibility:
      - id: adjust_window
        applies_to: [order_adjust_price]
        kind: time
        condition: A price adjustment or match is granted only when it is requested no later than the order date plus the tier's price adjust window days.
        evidence_fields: [order_holdings.order_date, order_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.order_id]
          action_bindings:
            order_holdings.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the order date
          anchor_source: order_holdings.order_date
          relation: not_after
          duration_source: variants.price_adjust_window_days
          unit: calendar_days
          counting_rule: Calendar days are added to the order date, the day after the order being day 1, and a request on the last day still qualifies.
          boundary: inclusive
      - id: once_per_line
        applies_to: [order_adjust_price]
        kind: dedup
        condition: Each order line may be adjusted only once, whichever kind of adjustment is used first.
        evidence_fields: [order_events.original_event_id, order_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_events.original_event_id]
          action_bindings:
            order_events.original_event_id: original_event_id
        dedup_contract:
          table: order_events
          mode: separate_record
          object_bindings: {original_event_id: original_event_id}
          duplicate_filters: {event_type: [order_adjust_price]}
          distinct_fields: []
    measures: [order_msr_line_adjustments, order_msr_units_returned]
    params:
      per_tier:
        Northgate In-Store Purchase: {price_adjust_window_days: "=price_adjust_window_days", price_match_competitors: "=price_match_competitors"}
        Northgate Order Pickup: {price_adjust_window_days: "=price_adjust_window_days", price_match_competitors: "=price_match_competitors"}
        Northgate Drive Up: {price_adjust_window_days: "=price_adjust_window_days", price_match_competitors: "=price_match_competitors"}
        Northgate Ship to Home: {price_adjust_window_days: "=price_adjust_window_days", price_match_competitors: "=price_match_competitors"}
