        Northgate Same-Day Delivery: {refund_tender_rule: "=refund_tender_rule", gift_receipt_refund_method: "=gift_receipt_refund_method", refund_rounding: "=refund_rounding"}
        Northgate Scheduled Large-Item Delivery: {refund_tender_rule: "=refund_tender_rule", gift_receipt_refund_method: "=gift_receipt_refund_method", refund_rounding: "=refund_rounding"}

extended_policies:
  - id: order_ext_late_change_fee
    base_policy_refs:
    - order_fulfilment_and_cancellation
    - order_evt_fees
    - order_agg_multi_holding
    overwrite:
    - base_policy: order_fulfilment_and_cancellation
      superseded_clause: A large-item delivery may be rescheduled before the cutoff, the first large_item_reschedules_free reschedules carrying no fee.
      replaced_by: 'A Scheduled Large-Item Delivery appointment may be rescheduled by the customer at any time down to the scheduled day itself, whatever tender paid the order: the program''s free reschedules made two or more days ahead carry no fee, and every other reschedule carries the late-change fee this rule sets; this sentence covers reschedules only, and a cancellation stays under the cancellation rules.'
    - base_policy: order_evt_fees
      superseded_clause: a large-item order canceled or rescheduled within cancel_cutoff_hours_before_scheduled hours of the scheduled date, beyond the free reschedules, carries late_cancel_fee_usd.
      replaced_by: For a customer's reschedule of a Scheduled Large-Item Delivery appointment, and only for such a reschedule, the late-change fee is the amount this rule works out, whatever tender paid the order; a large-item order canceled within the cutoff hours of its scheduled date, beyond the free reschedules, still carries the program's late cancellation fee.
    trigger: on_request
    subject:
    - order_reschedule
    - order_charge_fee
    computes: late_change_fee_usd
    target_tool: reschedule_large_item_delivery_d930ab59
    params:
      repeat_full: 20.0
      repeat_part: 10.0
      install_two: 20.0
      install_one: 10.0
      beyond_two: 15.0
      beyond_one: 5.0
      courtesy_two: 30.0
      courtesy_one: 15.0
    rule: 'When a customer reschedules the delivery appointment of a Scheduled Large-Item Delivery order, the new date is recorded on the order, the reschedule count goes up by one and the late-change fee is charged on the order with fee type late_cancellation, waiver source none; a reschedule that owes no late-change fee books no fee row. The late-change fee this rule works out is the same whatever tender paid the order. This rule books it only on an order paid in full by an external card with no Northgate Cash or gift card redeemed on it; on every other order the same late-change fee applies, its posting to the Northgate Card, Northgate Cash or gift card ledger is made by a human representative to whom the customer is handed over as POLICY_NOT_COVERED, and nothing is booked at the care desk. A reschedule requested two or more calendar days ahead of the scheduled date while the customer''s confirmed reschedule requests already on the order are fewer than the program''s free reschedules is a free reschedule and carries no late-change fee; every other reschedule carries the late-change fee below. The rescheduling is the customer''s own decision, recorded as a reschedule request and confirmed by the customer. The customer''s confirmed reschedule requests already on the order, the request being made not counted, are the confirmed reschedule requests recorded on the order before this request. The standard late-change notice charge is the program''s late cancellation fee, and the standard late-change fee is that notice charge, rounded half up to the cent. Every count of calendar days in this rule leaves out the day it starts from and includes the day it ends on. The late-change fee adds up every charge and surcharge the schedules below give, each schedule''s value standing in place of its standard value, and takes off every courtesy reduction they give; the total is rounded half up to the cent and is never below zero. The late-change notice charge, counted in calendar days from the day of the request to the scheduled date: on the scheduled day itself it is the large-item delivery fee still standing on the order, that is the delivery fee charged less refunds of it, because the truck slot is lost; two or more days ahead there is no notice charge; one day ahead it is the program''s late cancellation fee. The late-change surcharge for earlier late-change fees, taking the late-change fees charged on the order less refunds of them: where they stand at the program''s late cancellation fee or more the surcharge is twenty dollars; where they stand above zero but below that fee it is ten dollars; otherwise there is none. The late-change crew charge, taking the haul-away charge still standing on the order, that is the haul-away charged less refunds of it: where haul-away still stands and the request falls on the scheduled day the crew charge is that standing haul-away amount; where haul-away still stands and the request falls on an earlier day it is the program''s haul-away fee for one item; otherwise there is none. The late-change installation surcharge, counting the major appliance units on the order: two or more units carry twenty dollars; one unit carries ten dollars; otherwise there is none. The late-change surcharge for the customer''s own confirmed reschedule requests already on the order, the request being made not counted, measured against the program''s free reschedules: two or more above them carry fifteen dollars; exactly one above them carries five dollars; otherwise there is none. The late-change courtesy reduction for appointments Northgate itself moved, the number of such moves being the reschedule count less the customer''s confirmed reschedule requests: two or more moves take off thirty dollars; exactly one move takes off fifteen dollars; otherwise nothing is taken off. On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, the late-change fee is fixed only after the records carry the missed-appointment credit owed on a large-item delivery fee charged above zero for an order on which Northgate itself moved an appointment. On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, the late-change fee is not fixed until the records carry the replacement haul-away credit owed on a haul-away charge above zero of an order placed zero to ninety days after a Northgate Protect claim settlement that replaced or reimbursed an item of a merchandise category the order carries. On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, before the late-change fee is fixed, the records must carry the late-change goodwill refund owed on the latest late-change fee row with an amount above 0.00 on an order on which Northgate itself moved an appointment. A Scheduled Large-Item Delivery appointment may be rescheduled by the customer at any time down to the scheduled day itself, whatever tender paid the order: the program''s free reschedules made two or more days ahead carry no fee, and every other reschedule carries the late-change fee this rule sets; this sentence covers reschedules only, and a cancellation stays under the cancellation rules. For a customer''s reschedule of a Scheduled Large-Item Delivery appointment, and only for such a reschedule, the late-change fee is the amount this rule works out, whatever tender paid the order; a large-item order canceled within the cutoff hours of its scheduled date, beyond the free reschedules, still carries the program''s late cancellation fee.'
    prerequisite:
    - problem: order_ext_missed_appointment_credit
      kind: value_input
      gate: notice_charge
      form: state
      policy_source: On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, the late-change fee is fixed only after the records carry the missed-appointment credit owed on a large-item delivery fee charged above zero for an order on which Northgate itself moved an appointment.
      condition: On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, the large-item delivery fee row has a refund with reason fee_refund booked against it whenever that fee was charged above zero and the reschedule count exceeds the customer's confirmed reschedule requests.
      resolved_by: credit_missed_appointment_73d9a081
      effect: The missed-appointment credit lowers the large-item delivery fee still standing, which is the notice charge on the scheduled day.
    - problem: order_ext_replacement_haul_away_credit
      kind: value_input
      gate: crew_charge
      form: state
      policy_source: On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, the late-change fee is not fixed until the records carry the replacement haul-away credit owed on a haul-away charge above zero of an order placed zero to ninety days after a Northgate Protect claim settlement that replaced or reimbursed an item of a merchandise category the order carries.
      condition: On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, the haul-away fee row has a refund with reason fee_refund booked against it whenever the haul-away was charged above zero and the customer's most recent Northgate Protect claim settlement is a replacement or reimbursement of an item of a category the order carries, dated zero to ninety days before the order date.
      resolved_by: credit_replacement_haul_away_849732e1
      effect: The replacement haul-away credit lowers the haul-away charge still standing, which is the crew charge on the scheduled day.
    - problem: order_ext_late_fee_goodwill_refund
      kind: value_input
      gate: repeat_surcharge
      form: state
      policy_source: On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, before the late-change fee is fixed, the records must carry the late-change goodwill refund owed on the latest late-change fee row with an amount above 0.00 on an order on which Northgate itself moved an appointment.
      condition: On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, the latest late-change fee row with an amount above 0.00 has a refund with reason fee_refund booked against it whenever such a row stands on the order and the reschedule count exceeds the customer's confirmed reschedule requests.
      resolved_by: refund_late_change_fee_56da608d
      effect: The late-change goodwill refund lowers the late-change fees still standing below the program's late cancellation fee, moving the surcharge for earlier late-change fees to its lower step.
    cross_category: []
    compute:
    - days_ahead: DAYS(NOW, F('scheduled_date'))
    - delivery_standing: SUM('order_events','amount_usd', event_type='order_charge_fee', fee_type='large_item_delivery') - SUM('order_events','amount_usd', event_type='order_refund_charge', fee_type='large_item_delivery')
    - haul_standing: SUM('order_events','amount_usd', event_type='order_charge_fee', fee_type='haul_away') - SUM('order_events','amount_usd', event_type='order_refund_charge', fee_type='haul_away')
    - late_standing: SUM('order_events','amount_usd', event_type='order_charge_fee', fee_type='late_cancellation') - SUM('order_events','amount_usd', event_type='order_refund_charge', fee_type='late_cancellation')
    - own_requests: COUNT('order_requests', request_type='reschedule_delivery', request_status='confirmed')
    - northgate_moves: F('reschedule_count') - COUNT('order_requests', request_type='reschedule_delivery', request_status='confirmed')
    - appliance_units: SUM('order_events','quantity', event_type='order_post_line', item_category='major_appliances')
    - notice_charge: delivery_standing if days_ahead <= 0 else (0.0 if days_ahead >= 2 else P('late_cancel_fee_usd'))
    - repeat_surcharge: K('repeat_full') if late_standing >= P('late_cancel_fee_usd') else (K('repeat_part') if late_standing > 0 else 0.0)
    - crew_charge: haul_standing if (haul_standing > 0 and days_ahead <= 0) else (P('haul_away_fee_usd') if (haul_standing > 0 and days_ahead >= 1) else 0.0)
    - install_surcharge: K('install_two') if appliance_units >= 2 else (K('install_one') if appliance_units == 1 else 0.0)
    - requests_on_order: COUNT('order_requests', request_type='reschedule_delivery', request_status='confirmed')
    - requests_surcharge: K('beyond_two') if requests_on_order - P('large_item_reschedules_free') >= 2 else (K('beyond_one') if requests_on_order - P('large_item_reschedules_free') == 1 else 0.0)
    - courtesy: K('courtesy_two') if northgate_moves >= 2 else (K('courtesy_one') if northgate_moves == 1 else 0.0)
    - free_reschedule: days_ahead >= 2 and own_requests < P('large_item_reschedules_free')
    - result: 0.0 if free_reschedule else MX(0.0, RND(notice_charge + repeat_surcharge + crew_charge + install_surcharge + requests_surcharge - courtesy + 0.000000001, 2))
    compute_basis:
      days_ahead: counted in calendar days from the day of the request to the scheduled date
      delivery_standing: that is the delivery fee charged less refunds of it
      haul_standing: that is the haul-away charged less refunds of it
      late_standing: taking the late-change fees charged on the order less refunds of them
      own_requests: The customer's confirmed reschedule requests already on the order, the request being made not counted, are the confirmed reschedule requests recorded on the order before this request.
      northgate_moves: the number of such moves being the reschedule count less the customer's confirmed reschedule requests
      appliance_units: counting the major appliance units on the order
      notice_charge: on the scheduled day itself it is the large-item delivery fee still standing on the order, that is the delivery fee charged less refunds of it, because the truck slot is lost; two or more days ahead there is no notice charge; one day ahead it is the program's late cancellation fee.
      repeat_surcharge: where they stand at the program's late cancellation fee or more the surcharge is twenty dollars; where they stand above zero but below that fee it is ten dollars; otherwise there is none.
      crew_charge: where haul-away still stands and the request falls on the scheduled day the crew charge is that standing haul-away amount; where haul-away still stands and the request falls on an earlier day it is the program's haul-away fee for one item; otherwise there is none.
      install_surcharge: two or more units carry twenty dollars; one unit carries ten dollars; otherwise there is none.
      requests_surcharge: two or more above them carry fifteen dollars; exactly one above them carries five dollars; otherwise there is none.
      courtesy: two or more moves take off thirty dollars; exactly one move takes off fifteen dollars; otherwise nothing is taken off.
      result: The late-change fee adds up every charge and surcharge the schedules below give, each schedule's value standing in place of its standard value, and takes off every courtesy reduction they give; the total is rounded half up to the cent and is never below zero.
      free_reschedule: A reschedule requested two or more calendar days ahead of the scheduled date while the customer's confirmed reschedule requests already on the order are fewer than the program's free reschedules is a free reschedule and carries no late-change fee
      requests_on_order: The late-change surcharge for the customer's own confirmed reschedule requests already on the order, the request being made not counted
    factors:
    - id: notice_charge_step
      effect: method
      decides: notice_charge
      bindings:
      - delivery_standing
      - notice_charge
      ladder:
      - when: the request falls on the scheduled day itself
        method: the large-item delivery fee charged less refunds of it
      - when: the request falls two or more calendar days ahead of the scheduled date
        method: no notice charge
      - when: otherwise
        method: the program's late cancellation fee
      baseline:
        notice_charge: P('late_cancel_fee_usd')
      evidence:
      - date
      - history
      - tier_param
      cross_difficulty: null
    - id: earlier_fee_surcharge
      effect: parameter
      decides: repeat_surcharge
      bindings:
      - late_standing
      - repeat_surcharge
      ladder:
      - when: late-change fees standing at the program's late cancellation fee or more
        value: K('repeat_full')
      - when: late-change fees standing above zero but below the program's late cancellation fee
        value: K('repeat_part')
      - when: otherwise
        value: '0.0'
      baseline:
        repeat_surcharge: '0.0'
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: crew_charge_step
      effect: method
      decides: crew_charge
      bindings:
      - haul_standing
      - crew_charge
      ladder:
      - when: haul-away still standing and the request falls on the scheduled day
        method: the haul-away charged less refunds of it
      - when: haul-away still standing and the request falls on an earlier day
        method: the program's haul-away fee for one item
      - when: otherwise
        method: no crew charge
      baseline:
        crew_charge: '0.0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: installation_surcharge
      effect: parameter
      decides: install_surcharge
      bindings:
      - appliance_units
      - install_surcharge
      ladder:
      - when: two or more major appliance units on the order
        value: K('install_two')
      - when: one major appliance unit on the order
        value: K('install_one')
      - when: otherwise
        value: '0.0'
      baseline:
        install_surcharge: '0.0'
      evidence:
      - history
      cross_difficulty: null
    - id: own_requests_surcharge
      effect: parameter
      decides: requests_surcharge
      bindings:
      - requests_on_order
      - requests_surcharge
      ladder:
      - when: confirmed customer reschedule requests two or more above the free reschedules
        value: K('beyond_two')
      - when: confirmed customer reschedule requests exactly one above the free reschedules
        value: K('beyond_one')
      - when: otherwise
        value: '0.0'
      baseline:
        requests_surcharge: '0.0'
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: northgate_move_courtesy
      effect: parameter
      decides: courtesy
      bindings:
      - northgate_moves
      - courtesy
      ladder:
      - when: two or more Northgate moves recorded on the order
        value: K('courtesy_two')
      - when: exactly one Northgate move recorded on the order
        value: K('courtesy_one')
      - when: otherwise
        value: '0.0'
      baseline:
        courtesy: '0.0'
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: The standard late-change notice charge is the program's late cancellation fee, and the standard late-change fee is that notice charge, rounded half up to the cent.
      params:
      - late_cancel_fee_usd
    inputs:
      history:
      - table: order_events
        aggregate: sum
        field: amount_usd
        filters:
          event_type: order_charge_fee
      - table: order_events
        aggregate: sum
        field: amount_usd
        filters:
          event_type: order_refund_charge
      - table: order_requests
        aggregate: count
        field: order_request_id
        filters:
          request_type: reschedule_delivery
          request_status: confirmed
      - table: order_events
        aggregate: sum
        field: quantity
        filters:
          event_type: order_post_line
          item_category: major_appliances
      cross_category: []
  - id: order_ext_missed_appointment_credit
    base_policy_refs:
    - order_evt_fees
    - order_fulfilment_and_cancellation
    - order_refund_tender
    overwrite:
    - base_policy: order_evt_fees
      superseded_clause: A fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation.
      replaced_by: For the large-item delivery fee of a Scheduled Large-Item Delivery order on which Northgate itself moved a delivery appointment, and only for that fee, the missed-appointment credit is refunded as this rule states, whatever tender paid the order; for a haul-away charge or a late-change fee, and for every fee on any other order, a fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation, or in the rule written for that charge.
    - base_policy: order_fulfilment_and_cancellation
      superseded_clause: The fulfilment fee is refunded with reason fee_refund only when the whole order was not received or under order_returns.
      replaced_by: On an order on which Northgate itself moved a large-item delivery appointment, whatever tender paid it, the missed-appointment credit on the large-item delivery fee is booked with reason fee_refund as this rule states; apart from that credit the fulfilment fee is refunded with reason fee_refund only when the whole order was not received or under the returns rule.
    trigger: state_due
    subject:
    - order_refund_charge
    computes: credit_amount_usd
    target_tool: credit_missed_appointment_73d9a081
    params:
      base_share: 0.2
      three_moves_share: 0.4
      two_moves_share: 0.2
      long_wait_share: 0.1
      mid_wait_share: 0.05
      two_haul_share: 0.05
      one_haul_share: 0.02
      high_value_share: 0.05
      mid_value_share: 0.02
      within_allowance_share: 0.1
      first_paid_change_share: 0.05
      per_appliance_addon: 5.0
      single_appliance_addon: 7.5
    rule: 'When Northgate itself moves the delivery appointment of a Scheduled Large-Item Delivery order whose large-item delivery fee was charged above zero, the customer is owed a missed-appointment credit on that fee, booked as one refund of that fee with reason fee_refund. The amount this rule works out is the same whatever tender paid the order. This rule books it only on an order paid in full by an external card with no Northgate Cash or gift card redeemed on it; on every other order the same amount applies, its posting to the Northgate Card, Northgate Cash or gift card ledger is made by a human representative to whom the customer is handed over as POLICY_NOT_COVERED, and nothing is booked at the care desk. An appointment Northgate moved is a reschedule the order''s reschedule count records beyond the customer''s own confirmed reschedule requests on the order, so the number of Northgate moves is the reschedule count less the number of those confirmed requests. The standard missed-appointment credit is one fifth of the large-item delivery fee charged on the order, rounded half up to the cent. Every count of calendar days in this rule leaves out the day it starts from and includes the day it ends on. The missed-appointment credit percentage is that standard fifth plus every extra percentage the schedules below give; the large-item delivery fee charged is multiplied once by that percentage, any flat amount the schedules give is added, the sum is rounded half up to the cent, and the credit never exceeds the large-item delivery fee standing on the order, that is the fee charged less refunds already booked against it. The missed-appointment extra for Northgate moves: three or more moves add forty percent; exactly two moves add twenty percent; a single move adds nothing. The missed-appointment extra for waiting, counted in calendar days from the order date to the scheduled date the order carries when the credit is worked out: fourteen days or more add ten percent; seven to thirteen days add five percent; fewer than seven days add nothing. The missed-appointment extra for haul-away, counting the old items booked as the haul-away charge before benefits divided by the program''s haul-away fee per item: two or more old items add five percent; one old item adds two percent; no haul-away adds nothing. The missed-appointment extra for order value, taking the sum of the order''s merchandise line amounts: two thousand dollars or more adds five percent; one thousand dollars up to two thousand dollars adds two percent; less adds nothing. The missed-appointment extra for the customer''s own confirmed reschedule requests already on the order, measured against the program''s free reschedules: a count no higher than the free reschedules adds ten percent; a count exactly one above them adds five percent; a count two or more above them adds nothing. The missed-appointment flat amount for major appliances on the order, counted in units: two or more units give five dollars for each unit; exactly one unit gives a flat seven dollars fifty; no major appliance gives nothing. For the large-item delivery fee of a Scheduled Large-Item Delivery order on which Northgate itself moved a delivery appointment, and only for that fee, the missed-appointment credit is refunded as this rule states, whatever tender paid the order; for a haul-away charge or a late-change fee, and for every fee on any other order, a fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation, or in the rule written for that charge. On an order on which Northgate itself moved a large-item delivery appointment, whatever tender paid it, the missed-appointment credit on the large-item delivery fee is booked with reason fee_refund as this rule states; apart from that credit the fulfilment fee is refunded with reason fee_refund only when the whole order was not received or under the returns rule.'
    prerequisite: []
    cross_category: []
    compute:
    - delivery_charged: SUM('order_events','amount_usd', event_type='order_charge_fee', fee_type='large_item_delivery')
    - own_requests: COUNT('order_requests', request_type='reschedule_delivery', request_status='confirmed')
    - northgate_moves: F('reschedule_count') - COUNT('order_requests', request_type='reschedule_delivery', request_status='confirmed')
    - wait_days: DAYS(F('order_date'), F('scheduled_date'))
    - haul_items: RND(SUM('order_events','standard_fee_usd', event_type='order_charge_fee', fee_type='haul_away') / P('haul_away_fee_usd'), 0)
    - merchandise_total: SUM('order_events','amount_usd', event_type='order_post_line')
    - appliance_units: SUM('order_events','quantity', event_type='order_post_line', item_category='major_appliances')
    - move_extra: K('three_moves_share') if northgate_moves >= 3 else (K('two_moves_share') if northgate_moves == 2 else 0.0)
    - wait_extra: K('long_wait_share') if wait_days >= 14 else (K('mid_wait_share') if wait_days >= 7 else 0.0)
    - haul_extra: K('two_haul_share') if haul_items >= 2 else (K('one_haul_share') if haul_items == 1 else 0.0)
    - value_extra: K('high_value_share') if merchandise_total >= 2000 else (K('mid_value_share') if merchandise_total >= 1000 else 0.0)
    - allowance_extra: K('within_allowance_share') if own_requests <= P('large_item_reschedules_free') else (K('first_paid_change_share') if own_requests == P('large_item_reschedules_free') + 1 else 0.0)
    - appointment_amount: K('per_appliance_addon') * appliance_units if appliance_units >= 2 else (K('single_appliance_addon') if appliance_units == 1 else 0.0)
    - combined_share: K('base_share') + move_extra + wait_extra + haul_extra + value_extra + allowance_extra
    - delivery_standing: delivery_charged - SUM('order_events','amount_usd', event_type='order_refund_charge', fee_type='large_item_delivery')
    - result: MN(delivery_standing, RND(delivery_charged * combined_share + appointment_amount + 0.000000001, 2))
    compute_basis:
      delivery_charged: the large-item delivery fee charged on the order
      own_requests: the number of Northgate moves is the reschedule count less the number of those confirmed requests
      northgate_moves: the number of Northgate moves is the reschedule count less the number of those confirmed requests
      wait_days: counted in calendar days from the order date to the scheduled date the order carries when the credit is worked out
      haul_items: counting the old items booked as the haul-away charge before benefits divided by the program's haul-away fee per item
      merchandise_total: taking the sum of the order's merchandise line amounts
      appliance_units: The missed-appointment flat amount for major appliances on the order, counted in units
      move_extra: 'The missed-appointment extra for Northgate moves: three or more moves add forty percent; exactly two moves add twenty percent; a single move adds nothing.'
      wait_extra: fourteen days or more add ten percent; seven to thirteen days add five percent; fewer than seven days add nothing.
      haul_extra: two or more old items add five percent; one old item adds two percent; no haul-away adds nothing.
      value_extra: two thousand dollars or more adds five percent; one thousand dollars up to two thousand dollars adds two percent; less adds nothing.
      allowance_extra: a count no higher than the free reschedules adds ten percent; a count exactly one above them adds five percent; a count two or more above them adds nothing.
      appointment_amount: two or more units give five dollars for each unit; exactly one unit gives a flat seven dollars fifty; no major appliance gives nothing.
      combined_share: The missed-appointment credit percentage is that standard fifth plus every extra percentage the schedules below give
      result: the large-item delivery fee charged is multiplied once by that percentage, any flat amount the schedules give is added, the sum is rounded half up to the cent, and the credit never exceeds the large-item delivery fee standing on the order, that is the fee charged less refunds already booked against it.
      delivery_standing: the large-item delivery fee standing on the order, that is the fee charged less refunds already booked against it
    factors:
