  - id: order_ext_late_fee_goodwill_refund
    base_policy_refs:
    - order_evt_fees
    - order_fulfilment_and_cancellation
    - order_refund_tender
    overwrite:
    - base_policy: order_evt_fees
      superseded_clause: A fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation.
      replaced_by: For a late-change fee on a Scheduled Large-Item Delivery order on which Northgate itself moved a delivery appointment, and only for that fee, the late-change goodwill refund is made as this rule states, whatever tender paid the order; for a large-item delivery fee or a haul-away charge, and for every fee on any other order, a fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation, or in the rule written for that charge.
    trigger: state_due
    subject:
    - order_refund_charge
    computes: refund_amount_usd
    target_tool: refund_late_change_fee_56da608d
    params:
      base_share: 0.25
      three_moves_share: 0.5
      two_moves_share: 0.25
      recent_fee_share: 0.25
      month_fee_share: 0.1
      two_haul_share: 0.1
      one_haul_share: 0.05
      per_unit_standby: 2.5
      single_unit_standby: 4.0
    rule: 'A customer who paid a late-change fee on a Scheduled Large-Item Delivery order on which Northgate itself moved a delivery appointment is owed a late-change goodwill refund, booked as one refund of the latest late-change fee row with an amount above 0.00, with reason fee_refund. The amount this rule works out is the same whatever tender paid the order. This rule books it only on an order paid in full by an external card with no Northgate Cash or gift card redeemed on it; on every other order the same amount applies, its posting to the Northgate Card, Northgate Cash or gift card ledger is made by a human representative to whom the customer is handed over as POLICY_NOT_COVERED, and nothing is booked at the care desk. A reschedule that owes no late-change fee books no late-change fee row, so every late-change fee row on such an order carries an amount above 0.00, and the latest late-change fee row with an amount above 0.00 is the one with the latest date, and where two share that date the one recorded first. The number of Northgate moves is the order''s reschedule count less the customer''s confirmed reschedule requests on the order. The standard late-change goodwill refund is one quarter of the latest late-change fee with an amount above 0.00, rounded half up to the cent. Every count of calendar days in this rule leaves out the day it starts from and includes the day it ends on. The late-change goodwill percentage is that standard quarter plus every extra percentage the schedules below give; the latest late-change fee with an amount above 0.00 is multiplied once by that percentage, any flat amount the schedules give is added, the sum is rounded half up to the cent, and the refund never exceeds that fee less every refund already booked against the order''s late-change fees. The late-change goodwill extra for Northgate moves: three or more moves add fifty percent; exactly two moves add twenty-five percent; a single move adds nothing. The late-change goodwill extra for how recent the fee is, counted in calendar days from the date of the latest late-change fee with an amount above 0.00 to the scheduled date the order carries when the refund is worked out: seven days or fewer add twenty-five percent; eight to thirty days add ten percent; longer adds nothing. The late-change goodwill extra for the haul-away crew, counting the old items booked as the haul-away charge before benefits divided by the program''s haul-away fee per item: two or more old items add ten percent; one old item adds five percent; no haul-away adds nothing. The late-change goodwill standby amount for the installation crew, counting the major appliance units on the order: two or more units give two dollars fifty for each unit; exactly one unit gives a flat four dollars; no major appliance gives nothing. For a late-change fee on a Scheduled Large-Item Delivery order on which Northgate itself moved a delivery appointment, and only for that fee, the late-change goodwill refund is made as this rule states, whatever tender paid the order; for a large-item delivery fee or a haul-away charge, and for every fee on any other order, a fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation, or in the rule written for that charge.'
    prerequisite: []
    cross_category: []
    compute:
    - late_charged: LATEST('order_events','amount_usd', event_type='order_charge_fee', fee_type='late_cancellation')
    - own_requests: COUNT('order_requests', request_type='reschedule_delivery', request_status='confirmed')
    - northgate_moves: F('reschedule_count') - own_requests
    - last_fee_date: LATEST('order_events','event_date', event_type='order_charge_fee', fee_type='late_cancellation')
    - fee_age: DAYS(last_fee_date, F('scheduled_date')) if last_fee_date else 9999
    - haul_items: RND(SUM('order_events','standard_fee_usd', event_type='order_charge_fee', fee_type='haul_away') / P('haul_away_fee_usd'), 0)
    - appliance_units: SUM('order_events','quantity', event_type='order_post_line', item_category='major_appliances')
    - move_extra: K('three_moves_share') if northgate_moves >= 3 else (K('two_moves_share') if northgate_moves == 2 else 0.0)
    - recency_extra: K('recent_fee_share') if fee_age <= 7 else (K('month_fee_share') if fee_age <= 30 else 0.0)
    - crew_extra: K('two_haul_share') if haul_items >= 2 else (K('one_haul_share') if haul_items == 1 else 0.0)
    - standby_amount: K('per_unit_standby') * appliance_units if appliance_units >= 2 else (K('single_unit_standby') if appliance_units == 1 else 0.0)
    - combined_share: K('base_share') + move_extra + recency_extra + crew_extra
    - late_refunded: SUM('order_events','amount_usd', event_type='order_refund_charge', fee_type='late_cancellation')
    - result: MN(MX(0.0, late_charged - late_refunded), RND(late_charged * combined_share + standby_amount + 0.000000001, 2))
    compute_basis:
      late_charged: the latest late-change fee row with an amount above 0.00 is the one with the latest date, and where two share that date the one recorded first.
      own_requests: The number of Northgate moves is the order's reschedule count less the customer's confirmed reschedule requests on the order.
      northgate_moves: The number of Northgate moves is the order's reschedule count less the customer's confirmed reschedule requests on the order.
      last_fee_date: counted in calendar days from the date of the latest late-change fee with an amount above 0.00 to the scheduled date the order carries when the refund is worked out
      fee_age: counted in calendar days from the date of the latest late-change fee with an amount above 0.00 to the scheduled date the order carries when the refund is worked out
      haul_items: counting the old items booked as the haul-away charge before benefits divided by the program's haul-away fee per item
      appliance_units: counting the major appliance units on the order
      move_extra: 'The late-change goodwill extra for Northgate moves: three or more moves add fifty percent; exactly two moves add twenty-five percent; a single move adds nothing.'
      recency_extra: seven days or fewer add twenty-five percent; eight to thirty days add ten percent; longer adds nothing.
      crew_extra: two or more old items add ten percent; one old item adds five percent; no haul-away adds nothing.
      standby_amount: two or more units give two dollars fifty for each unit; exactly one unit gives a flat four dollars; no major appliance gives nothing.
      combined_share: The late-change goodwill percentage is that standard quarter plus every extra percentage the schedules below give
