  - id: order_ext_late_express_credit
    base_policy_refs:
    - order_evt_fees
    - order_fulfilment_and_cancellation
    - order_refund_tender
    overwrite:
    - base_policy: order_evt_fees
      superseded_clause: A fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation.
      replaced_by: For the express delivery fee of a Same-Day Delivery order fulfilled on a later calendar day than its order date, and only for that fee, the late-express credit is refunded as this rule states, whatever tender paid the order; for every other fee on that order and for every fee on any other order, a fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation, or in the rule written for that charge.
    trigger: state_due
    subject:
    - order_refund_charge
    computes: credit_amount_usd
    target_tool: credit_late_express_4845a2c0
    params:
      base_rate: 0.5
      three_day_rate: 0.9
      two_day_rate: 0.7
      large_basket_share: 0.1
      mid_basket_share: 0.05
      two_alcohol_share: 0.1
      one_alcohol_share: 0.05
      per_grocery_line: 0.75
      single_grocery_line: 1.0
    rule: 'A Same-Day Delivery express order promises delivery within the express window on its order date, so an express order whose express delivery fee was charged above zero and whose fulfilled date is a later calendar day than its order date missed that promise and is owed a late-express credit, booked as one refund of the order''s express delivery fee with reason fee_refund. The amount this rule works out is the same whatever tender paid the order. This rule books it only on an order paid in full by an external card with no Northgate Cash or gift card redeemed on it; on every other order the same amount applies, its posting to the Northgate Card, Northgate Cash or gift card ledger is made by a human representative to whom the customer is handed over as POLICY_NOT_COVERED, and nothing is booked at the care desk. The standard late-express credit is half the express delivery fee charged on the order, rounded half up to the cent. Every count of calendar days in this rule leaves out the day it starts from and includes the day it ends on. The late-express credit percentage is the standard half, or the rate a schedule below sets in its place, plus every extra percentage the schedules give; the express delivery fee charged is multiplied once by that percentage, any flat amount the schedules give is added, the sum is rounded half up to the cent, and the credit never exceeds the express delivery fee standing on the order, that is the fee charged less refunds already booked against it. The late-express lateness rate, counted in calendar days from the order date to the fulfilled date: three days or more give ninety percent; exactly two days give seventy percent; a single day gives the standard half. The late-express basket extra, taking the sum of the order''s merchandise line amounts: seventy-five dollars or more adds ten percent; thirty-five dollars up to seventy-five dollars adds five percent; less adds nothing. The late-express age-check extra, counting the order''s alcohol lines, which are handed over only after an age check so an adult must stay home for the delivery: two or more alcohol lines add ten percent; exactly one alcohol line adds five percent; no alcohol line adds nothing. The late-express grocery standby amount, counting the order''s grocery lines: two or more grocery lines give seventy-five cents for each line; exactly one grocery line gives a flat one dollar; no grocery line gives nothing. For the express delivery fee of a Same-Day Delivery order fulfilled on a later calendar day than its order date, and only for that fee, the late-express credit is refunded as this rule states, whatever tender paid the order; for every other fee on that order and for every fee on any other order, a fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation, or in the rule written for that charge.'
    prerequisite: []
    cross_category: []
    compute:
    - express_charged: SUM('order_events','amount_usd', event_type='order_charge_fee', fee_type='express_delivery')
    - express_standing: express_charged - SUM('order_events','amount_usd', event_type='order_refund_charge', fee_type='express_delivery')
    - days_late: DAYS(F('order_date'), F('fulfilled_date'))
    - basket_total: SUM('order_events','amount_usd', event_type='order_post_line')
    - alcohol_lines: COUNT('order_events', event_type='order_post_line', item_category='alcohol')
    - grocery_lines: COUNT('order_events', event_type='order_post_line', item_category='grocery')
    - lateness_rate: K('three_day_rate') if days_late >= 3 else (K('two_day_rate') if days_late == 2 else K('base_rate'))
    - basket_extra: K('large_basket_share') if basket_total >= 75 else (K('mid_basket_share') if basket_total >= 35 else 0.0)
    - age_check_extra: K('two_alcohol_share') if alcohol_lines >= 2 else (K('one_alcohol_share') if alcohol_lines == 1 else 0.0)
    - grocery_amount: K('per_grocery_line') * grocery_lines if grocery_lines >= 2 else (K('single_grocery_line') if grocery_lines == 1 else 0.0)
    - credit_rate: lateness_rate + basket_extra + age_check_extra
    - result: MN(express_standing, RND(express_charged * credit_rate + grocery_amount + 0.000000001, 2))
    compute_basis:
      express_charged: the express delivery fee charged on the order
      express_standing: the express delivery fee standing on the order, that is the fee charged less refunds already booked against it
      days_late: counted in calendar days from the order date to the fulfilled date
      basket_total: taking the sum of the order's merchandise line amounts
      alcohol_lines: counting the order's alcohol lines
      grocery_lines: counting the order's grocery lines
      lateness_rate: three days or more give ninety percent; exactly two days give seventy percent; a single day gives the standard half.
      basket_extra: seventy-five dollars or more adds ten percent; thirty-five dollars up to seventy-five dollars adds five percent; less adds nothing.
      age_check_extra: two or more alcohol lines add ten percent; exactly one alcohol line adds five percent; no alcohol line adds nothing.
      grocery_amount: two or more grocery lines give seventy-five cents for each line; exactly one grocery line gives a flat one dollar; no grocery line gives nothing.
      credit_rate: The late-express credit percentage is the standard half, or the rate a schedule below sets in its place, plus every extra percentage the schedules give
      result: the express delivery fee charged is multiplied once by that percentage, any flat amount the schedules give is added, the sum is rounded half up to the cent, and the credit never exceeds the express delivery fee standing on the order, that is the fee charged less refunds already booked against it.
    factors:
    - id: lateness_rate_step
      effect: parameter
      decides: lateness_rate
      bindings:
      - days_late
      - lateness_rate
      ladder:
      - when: fulfilled three or more calendar days after the order date
        value: K('three_day_rate')
      - when: fulfilled exactly two calendar days after the order date
        value: K('two_day_rate')
      - when: otherwise
        value: K('base_rate')
      baseline:
        lateness_rate: K('base_rate')
      evidence:
      - date
      cross_difficulty: null
    - id: basket_size_extra
      effect: parameter
      decides: basket_extra
      bindings:
      - basket_total
      - basket_extra
      ladder:
      - when: merchandise lines summing to 75 dollars or more
        value: K('large_basket_share')
      - when: merchandise lines summing to 35 up to 75 dollars
        value: K('mid_basket_share')
      - when: otherwise
        value: '0.0'
      baseline:
        basket_extra: '0.0'
      evidence:
      - history
      cross_difficulty: null
    - id: age_check_extra_step
      effect: parameter
      decides: age_check_extra
      bindings:
      - alcohol_lines
      - age_check_extra
      ladder:
      - when: two or more alcohol lines on the order
        value: K('two_alcohol_share')
      - when: exactly one alcohol line on the order
        value: K('one_alcohol_share')
      - when: otherwise
        value: '0.0'
      baseline:
        age_check_extra: '0.0'
      evidence:
      - history
      cross_difficulty: null
    - id: grocery_standby_amount
      effect: method
      decides: grocery_amount
      bindings:
      - grocery_lines
      - grocery_amount
      ladder:
      - when: two or more grocery lines on the order
        method: seventy-five cents multiplied by the number of grocery lines
      - when: exactly one grocery line on the order
        method: a flat one dollar
      - when: otherwise
