      note: The customer's most recent Northgate Protect claim settlement and the settlements of the same category decide the scope, the timing, kind and value extras and the credited haul-away.
    compute:
    - haul_charged: SUM('order_events','amount_usd', event_type='order_charge_fee', fee_type='haul_away')
    - haul_standard: SUM('order_events','standard_fee_usd', event_type='order_charge_fee', fee_type='haul_away')
    - haul_standing: haul_charged - SUM('order_events','amount_usd', event_type='order_refund_charge', fee_type='haul_away')
    - haul_items: RND(haul_standard / P('haul_away_fee_usd'), 0)
    - settle_date: XLATEST('plan','plan_events','event_date', event_type='plan_settle_claim')
    - settle_method: XLATEST('plan','plan_events','settlement_method', event_type='plan_settle_claim')
    - settle_category: XLATEST('plan','plan_events','covered_item_category', event_type='plan_settle_claim')
    - settle_amount: XLATEST('plan','plan_events','amount_usd', event_type='plan_settle_claim') or 0.0
    - settle_lag: DAYS(settle_date, F('order_date')) if settle_date else -1
    - category_units: SUM('order_events','quantity', event_type='order_post_line', item_category=settle_category)
    - in_scope: (settle_method == 'replacement' or settle_method == 'reimbursement_egift_card') and category_units >= 1 and settle_lag >= 0 and settle_lag <= 90 and haul_charged > 0
    - matched_settlements: XCOUNT('plan','plan_events', event_type='plan_settle_claim', event_date=settle_date, covered_item_category=settle_category, settlement_method='replacement') + XCOUNT('plan','plan_events', event_type='plan_settle_claim', event_date=settle_date, covered_item_category=settle_category, settlement_method='reimbursement_egift_card')
    - timing_lag: DAYS(XLATEST('plan','plan_events','event_date', event_type='plan_settle_claim'), F('order_date')) if XLATEST('plan','plan_events','event_date', event_type='plan_settle_claim') else -1
    - timing_extra: K('recent_settlement_share') if timing_lag <= 30 else (K('older_settlement_share') if timing_lag <= 60 else 0.0)
    - kind_category: XLATEST('plan','plan_events','covered_item_category', event_type='plan_settle_claim')
    - kind_extra: K('appliance_kind_share') if kind_category == 'major_appliances' else (K('bulky_kind_share') if (kind_category == 'furniture' or kind_category == 'fitness_equipment') else 0.0)
    - value_extra: K('high_value_share') if settle_amount >= 1000 else (K('mid_value_share') if settle_amount >= 500 else 0.0)
    - credited_haul: P('haul_away_fee_usd') * MN(matched_settlements, haul_items) if (matched_settlements >= 2 and haul_items >= 2) else (P('haul_away_fee_usd') if (matched_settlements == 1 and haul_items >= 2) else haul_charged)
    - combined_share: K('base_share') + timing_extra + kind_extra + value_extra
    - result: MN(haul_standing, RND(credited_haul * combined_share + 0.000000001, 2)) if in_scope else 0.0
    compute_basis:
      haul_charged: the haul-away charge on the order
      haul_standard: the haul-away charge before benefits
      haul_standing: the haul-away charge standing on the order, that is the haul-away charged less refunds already booked against it
      haul_items: counts the old items booked as the haul-away charge before benefits divided by the program's haul-away fee per item
      settle_date: The settlement read is the customer's most recent Northgate Protect claim settlement; where two settlements share the most recent date, the one recorded first is read.
      settle_method: The settlement read is the customer's most recent Northgate Protect claim settlement; where two settlements share the most recent date, the one recorded first is read.
      settle_category: The settlement read is the customer's most recent Northgate Protect claim settlement; where two settlements share the most recent date, the one recorded first is read.
      settle_amount: The replacement haul-away extra for the value the claim settled, the settlement amount
      settle_lag: counted in calendar days from the settlement date to the order date
      category_units: a settled item whose category no line of the order carries
      in_scope: A settlement by repair, a food loss payment, a settled item whose category no line of the order carries, and a settlement dated after the order date or more than ninety days before it owe no replacement haul-away credit.
      matched_settlements: counts the customer's settlements by replacement or reimbursement of items of the settled category dated the same day as the settlement read, the day that claim decision was settled
      timing_extra: zero to thirty days add forty percent; thirty-one to sixty days add twenty percent; sixty-one to ninety days add nothing.
      kind_extra: adds twenty percent; furniture or fitness equipment adds ten percent; any other large item adds nothing.
      value_extra: one thousand dollars or more adds ten percent; five hundred dollars up to one thousand dollars adds five percent; less adds nothing.
      credited_haul: where two or more such settlements stand and two or more old items are booked it is the program's haul-away fee per item times the lesser of those two counts; where exactly one such settlement stands and two or more old items are booked it is the program's haul-away fee for one item; otherwise it is the haul-away charge on the order.
      combined_share: The replacement haul-away credit percentage is that standard quarter plus every extra percentage the schedules below give
      result: the haul-away charge on the order, or the amount a schedule below sets in its place, is multiplied once by that percentage, the result is rounded half up to the cent, and the credit never exceeds the haul-away charge standing on the order, that is the haul-away charged less refunds already booked against it.
      timing_lag: counted in calendar days from the settlement date to the order date
      kind_category: The replacement haul-away extra for the kind of item replaced
    factors:
    - id: settlement_timing_extra
      effect: parameter
      decides: timing_extra
      bindings:
      - timing_lag
      - timing_extra
      ladder:
      - when: the settlement falls zero to thirty days before the order date
        value: K('recent_settlement_share')
      - when: the settlement falls thirty-one to sixty days before the order date
        value: K('older_settlement_share')
      - when: otherwise
        value: '0.0'
      baseline:
        timing_extra: '0.0'
      evidence:
      - cross_category
      - date
      cross_difficulty: plan
    - id: replaced_item_kind_extra
      effect: parameter
      decides: kind_extra
      bindings:
      - kind_category
      - kind_extra
      ladder:
      - when: the settled item is a major appliance
        value: K('appliance_kind_share')
      - when: the settled item is furniture or fitness equipment
        value: K('bulky_kind_share')
      - when: otherwise
        value: '0.0'
      baseline:
        kind_extra: '0.0'
      evidence:
      - cross_category
      cross_difficulty: plan
    - id: settled_value_extra
      effect: parameter
      decides: value_extra
      bindings:
      - settle_amount
      - value_extra
      ladder:
      - when: the settlement amount is one thousand dollars or more
        value: K('high_value_share')
      - when: the settlement amount is five hundred up to one thousand dollars
        value: K('mid_value_share')
      - when: otherwise
        value: '0.0'
      baseline:
        value_extra: '0.0'
      evidence:
      - cross_category
      cross_difficulty: plan
    - id: credited_haul_basis
      effect: method
      decides: credited_haul
      bindings:
      - haul_standard
      - haul_items
      - matched_settlements
      - credited_haul
      ladder:
      - when: two or more replacement or reimbursement settlements of the settled category on the date of the settlement read and two or more old items booked
        method: the program's haul-away fee per item times the lesser of the two counts
      - when: exactly one such settlement and two or more old items booked
        method: the program's haul-away fee for one item
      - when: otherwise
        method: the haul-away charge on the order
      baseline:
        credited_haul: haul_charged
      evidence:
      - cross_category
      - history
      - tier_param
      cross_difficulty: plan
    baseline:
      rule: The standard replacement haul-away credit is one quarter of the haul-away charge on the order, rounded half up to the cent.
      params:
