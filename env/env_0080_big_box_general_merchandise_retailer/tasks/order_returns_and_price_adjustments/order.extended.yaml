  - id: order_refund_tender
    subject: [order_return_line, order_refund_charge, order_adjust_price]
    rule: >-
      A refund with a receipt goes back to the tenders that paid the order under refund_tender_rule: any Northgate Cash
      redeemed on the order is restored first as Northgate Cash up to the amount redeemed and not already restored, any
      gift card amount is restored next to that gift card, and the remainder goes to the primary payment method, a
      Northgate Card refund posting to the card account as a merchant credit. Cash payments are refunded in cash at a
      store. A refund never exceeds what the order's tenders paid for the refunded lines and fees, net of earlier refunds
      on them. A refund to a closed Northgate Card account still posts to that account, where any resulting credit balance
      is handled under card_evt_payments. Refunds without a receipt or on a gift receipt are paid on a merchandise return
      card under order_agg_no_receipt_limits and never to a payment card.
    eligibility: []
    params:
