  - id: order_ext_drive_up_return_refund
    base_policy_refs:
    - order_returns
    - order_agg_no_receipt_limits
    - order_refund_tender
    overwrite:
    - base_policy: order_returns
      superseded_clause: The merchandise refund is the line's net amount per unit times the units returned, rounded half up to the cent, less restocking_fee_pct_changed_mind percent where the reason is changed_mind and the class is in restocking_fee_classes.
      replaced_by: For a changed-mind return, made with a receipt at a store's Drive Up, of the whole of the one electronics-class line of a Same-Day Delivery order on which every price adjustment stands on that line, and only for such a return, whatever tender paid the order, the merchandise refund is worked out as this rule states; every other return keeps the base refund, the line's net amount per unit times the units returned, rounded half up to the cent, less the program's changed-mind restocking percentage where the reason is changed_mind and the class is one of the program's restocking classes.
    trigger: on_request
    subject:
    - order_return_line
    computes: refund_amount_usd
    target_tool: return_item_at_drive_up_b4cf62ab
    params:
      standard_restock_rate: 0.1
      computer_tv_rate: 0.15
      smart_home_game_rate: 0.05
      late_hold_add: 0.05
      mid_hold_add: 0.02
      two_returns_add: 0.05
      one_return_add: 0.02
      two_market_add: 0.05
      one_market_add: 0.02
      late_flat_relief: 2.0
    rule: 'A customer may return a line of a Same-Day Delivery order at a store''s Drive Up because they changed their mind; the return is the customer''s own decision, recorded on the order as a return with a receipt, and it follows every gate of the returns rule: a fulfilled order, the item''s return window counted from the fulfilled date, and units no more than those bought less those already returned or refunded. The refund this rule works out is the same whatever tender paid the order. This rule books it only on an order paid in full by an external card with no Northgate Cash or gift card redeemed on it; on every other order the same refund applies, its posting to the Northgate Card, Northgate Cash or gift card ledger is made by a human representative to whom the customer is handed over as POLICY_NOT_COVERED, and nothing is booked at the care desk. The standard changed-mind refund for an electronics-class line returned at a Drive Up is the line''s net amount as charged, less a standard restocking fee of ten percent of that net amount, rounded half up to the cent. The changed-mind refund is the line''s net amount as charged, or the amount a schedule below sets in its place, less the restocking fee; the restocking fee is the line''s net amount as charged multiplied once by the sum of the restocking percentages, each schedule''s percentage standing in place of its standard value where it sets one, less every restocking relief the schedules give, rounded half up to the cent and never below zero; the refund is rounded half up to the cent and is never below zero. Every count of calendar days in this rule leaves out the day it starts from and includes the day it ends on. The changed-mind restocking percentage for the returned line''s category: a computer, tablet or TV and home theater line carries fifteen percent; a smart home or video game line carries five percent; any other electronics-class line carries the standard ten percent. The changed-mind restocking addition for how long the item was kept, counted in calendar days from the fulfilled date to the return date: more than fourteen days add five percent; eight to fourteen days add two percent; seven days or fewer add nothing. The changed-mind restocking addition for earlier changed-mind returns on the same order: two or more add five percent; one adds two percent; none adds nothing. The changed-mind restocking addition for Northgate Marketplace returns, counting the customer''s Northgate Marketplace return requests made for a change of mind, whatever the seller answered, whose request date falls fewer than twelve whole months before the return date: two or more add five percent; one adds two percent; none adds nothing. The changed-mind restocking relief: where the order was fulfilled on a later calendar day than its order date and a late-express credit stands on the order the relief is half of that credit; where the order was fulfilled on a later calendar day than its order date and no late-express credit stands the relief is a flat two dollars; otherwise there is no relief. The changed-mind refund basis: where a Northgate price drop adjustment stands on the line the basis is the adjusted unit price times the units returned; where a competitor price match stands on the line the basis is the line''s net amount less the amount of that match; otherwise the basis is the line''s net amount. On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, the refund for a changed-mind Drive Up return is not fixed until the records carry the late-express credit owed on an express delivery fee charged above zero of an order fulfilled on a later calendar day than its order date. For a changed-mind return, made with a receipt at a store''s Drive Up, of the whole of the one electronics-class line of a Same-Day Delivery order on which every price adjustment stands on that line, and only for such a return, whatever tender paid the order, the merchandise refund is worked out as this rule states; every other return keeps the base refund, the line''s net amount per unit times the units returned, rounded half up to the cent, less the program''s changed-mind restocking percentage where the reason is changed_mind and the class is one of the program''s restocking classes.'
    prerequisite:
    - problem: order_ext_late_express_credit
      kind: value_input
      gate: restock_relief
      form: state
      policy_source: On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, the refund for a changed-mind Drive Up return is not fixed until the records carry the late-express credit owed on an express delivery fee charged above zero of an order fulfilled on a later calendar day than its order date.
      condition: On an order paid in full by an external card with no Northgate Cash or gift card redeemed on it, the express delivery fee row has a refund with reason fee_refund booked against it whenever that fee was charged above zero and the fulfilled date is a later calendar day than the order date.
      resolved_by: credit_late_express_4845a2c0
      effect: Once the late-express credit stands, the restocking relief is half of that credit instead of the flat two dollars, which lowers the restocking fee and raises the refund.
    cross_category:
    - category: market
      as: history
      reads:
      - market_events.event_type
      - market_events.return_reason
      - market_events.event_date
      note: The customer's changed-mind Northgate Marketplace return requests in the last twelve months decide the Marketplace restocking addition.
    compute:
    - line_amount: SUM('order_events','amount_usd', event_type='order_post_line', return_class='electronics')
    - line_category: LATEST('order_events','item_category', event_type='order_post_line', return_class='electronics')
    - days_held: DAYS(F('fulfilled_date'), NOW)
    - earlier_cm_returns: COUNT('order_events', event_type='order_return_line', return_reason='changed_mind')
    - market_cm_requests: XCOUNT('market','market_events', within_months=12, event_type='market_request_return', return_reason='changed_mind')
    - late_credit: SUM('order_events','amount_usd', event_type='order_refund_charge', fee_type='express_delivery')
    - days_late: DAYS(F('order_date'), F('fulfilled_date'))
    - adj_type: LATEST('order_events','adjustment_type', event_type='order_adjust_price')
    - adj_price: LATEST('order_events','adjusted_unit_price_usd', event_type='order_adjust_price')
    - adj_amount: SUM('order_events','amount_usd', event_type='order_adjust_price')
    - line_units: SUM('order_events','quantity', event_type='order_post_line', return_class='electronics')
    - category_rate: K('computer_tv_rate') if (line_category == 'computers_tablets' or line_category == 'tv_home_theater') else (K('smart_home_game_rate') if (line_category == 'smart_home' or line_category == 'video_games') else K('standard_restock_rate'))
    - hold_add: K('late_hold_add') if days_held > 14 else (K('mid_hold_add') if days_held >= 8 else 0.0)
    - history_add: K('two_returns_add') if earlier_cm_returns >= 2 else (K('one_return_add') if earlier_cm_returns == 1 else 0.0)
    - market_add: K('two_market_add') if market_cm_requests >= 2 else (K('one_market_add') if market_cm_requests == 1 else 0.0)
    - restock_relief: late_credit / 2 if (days_late >= 1 and late_credit > 0) else (K('late_flat_relief') if (days_late >= 1 and late_credit == 0) else 0.0)
    - refund_basis: adj_price * line_units if adj_type == 'price_drop_adjustment' else (line_amount - adj_amount if adj_type == 'competitor_price_match' else line_amount)
    - restocking_fee: MX(0.0, RND(line_amount * (category_rate + hold_add + history_add + market_add) - restock_relief + 0.000000001, 2))
    - result: MX(0.0, RND(refund_basis - restocking_fee + 0.000000001, 2))
    compute_basis:
      line_amount: the line's net amount as charged
      line_category: The changed-mind restocking percentage for the returned line's category
      days_held: counted in calendar days from the fulfilled date to the return date
      earlier_cm_returns: The changed-mind restocking addition for earlier changed-mind returns on the same order
      late_credit: a late-express credit stands on the order the relief is half of that credit
      adj_type: where a Northgate price drop adjustment stands on the line the basis is the adjusted unit price times the units returned; where a competitor price match stands on the line the basis is the line's net amount less the amount of that match
      adj_price: the basis is the adjusted unit price times the units returned
      adj_amount: the basis is the line's net amount less the amount of that match
      line_units: the adjusted unit price times the units returned
      hold_add: more than fourteen days add five percent; eight to fourteen days add two percent; seven days or fewer add nothing.
      history_add: 'The changed-mind restocking addition for earlier changed-mind returns on the same order: two or more add five percent; one adds two percent; none adds nothing.'
      refund_basis: where a Northgate price drop adjustment stands on the line the basis is the adjusted unit price times the units returned; where a competitor price match stands on the line the basis is the line's net amount less the amount of that match; otherwise the basis is the line's net amount.
      days_late: where the order was fulfilled on a later calendar day than its order date
      market_cm_requests: counting the customer's Northgate Marketplace return requests made for a change of mind, whatever the seller answered, whose request date falls fewer than twelve whole months before the return date
      category_rate: a computer, tablet or TV and home theater line carries fifteen percent; a smart home or video game line carries five percent; any other electronics-class line carries the standard ten percent.
      market_add: two or more add five percent; one adds two percent; none adds nothing.
      restock_relief: where the order was fulfilled on a later calendar day than its order date and a late-express credit stands on the order the relief is half of that credit; where the order was fulfilled on a later calendar day than its order date and no late-express credit stands the relief is a flat two dollars; otherwise there is no relief.
      restocking_fee: the restocking fee is the line's net amount as charged multiplied once by the sum of the restocking percentages, each schedule's percentage standing in place of its standard value where it sets one, less every restocking relief the schedules give, rounded half up to the cent and never below zero
      result: The changed-mind refund is the line's net amount as charged, or the amount a schedule below sets in its place, less the restocking fee
    factors:
    - id: category_restocking_rate
      effect: parameter
      decides: category_rate
      bindings:
      - line_category
      - category_rate
      ladder:
      - when: the returned line is a computer, tablet or TV and home theater item
        value: K('computer_tv_rate')
      - when: the returned line is a smart home or video game item
        value: K('smart_home_game_rate')
      - when: otherwise
        value: K('standard_restock_rate')
      baseline:
        category_rate: K('standard_restock_rate')
      evidence:
      - history
      cross_difficulty: null
    - id: holding_time_addition
      effect: parameter
      decides: hold_add
      bindings:
      - days_held
      - hold_add
      ladder:
      - when: more than fourteen calendar days from the fulfilled date to the return date
        value: K('late_hold_add')
      - when: eight to fourteen calendar days from the fulfilled date to the return date
        value: K('mid_hold_add')
      - when: otherwise
        value: '0.0'
      baseline:
        hold_add: '0.0'
      evidence:
      - date
      cross_difficulty: null
    - id: return_history_addition
      effect: parameter
      decides: history_add
      bindings:
      - earlier_cm_returns
      - history_add
      ladder:
      - when: two or more earlier changed-mind returns on the order
        value: K('two_returns_add')
      - when: one earlier changed-mind return on the order
        value: K('one_return_add')
      - when: otherwise
        value: '0.0'
      baseline:
        history_add: '0.0'
      evidence:
      - history
      cross_difficulty: null
    - id: marketplace_return_addition
      effect: parameter
      decides: market_add
      bindings:
      - market_cm_requests
      - market_add
      ladder:
      - when: two or more changed-mind Northgate Marketplace return requests fewer than twelve whole months before the return date
        value: K('two_market_add')
      - when: one such request
        value: K('one_market_add')
      - when: otherwise
        value: '0.0'
      baseline:
        market_add: '0.0'
      evidence:
      - cross_category
      - history
      cross_difficulty: market
    - id: late_delivery_relief
      effect: method
      decides: restock_relief
      bindings:
      - late_credit
      - days_late
      - restock_relief
      ladder:
      - when: fulfilled on a later calendar day than the order date and a late-express credit stands on the order
        method: half of the late-express credit standing
      - when: fulfilled on a later calendar day than the order date and no late-express credit stands
        method: a flat two dollars
      - when: otherwise
        method: no relief
      baseline:
        restock_relief: '0.0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: adjusted_refund_basis
      effect: method
      decides: refund_basis
      bindings:
      - adj_type
      - adj_price
      - adj_amount
      - line_units
      - refund_basis
      ladder:
      - when: a Northgate price drop adjustment stands on the line
        method: the adjusted unit price times the units returned
      - when: a competitor price match stands on the line
        method: the line's net amount less the amount of that match
      - when: otherwise
        method: the line's net amount
