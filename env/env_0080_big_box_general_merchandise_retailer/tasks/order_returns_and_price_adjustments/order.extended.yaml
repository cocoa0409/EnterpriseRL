  - id: order_ext_replacement_haul_away_credit
    base_policy_refs:
    - order_evt_fees
    - order_fulfilment_and_cancellation
    - order_refund_tender
    overwrite:
    - base_policy: order_evt_fees
      superseded_clause: A fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation.
      replaced_by: For the haul-away charge of a Scheduled Large-Item Delivery order placed zero to ninety days after a Northgate Protect claim settlement that replaced or reimbursed an item of a merchandise category the order carries, and only for that charge, the replacement haul-away credit is refunded as this rule states, whatever tender paid the order; on every other order and for every other fee, a fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation, or in the rule written for that charge.
    trigger: state_due
    subject:
    - order_refund_charge
    computes: credit_amount_usd
    target_tool: credit_replacement_haul_away_849732e1
    params:
      base_share: 0.25
      recent_settlement_share: 0.4
      older_settlement_share: 0.2
      appliance_kind_share: 0.2
      bulky_kind_share: 0.1
      high_value_share: 0.1
      mid_value_share: 0.05
    rule: 'A customer whose Northgate Protect claim was settled by replacement or by reimbursement for an item of a merchandise category, and who then buys an item of the same category on a Scheduled Large-Item Delivery order with a haul-away charge above zero, placed zero to ninety days after that settlement, is owed a replacement haul-away credit for the old item the claim settled, booked as one refund of the haul-away charge with reason fee_refund. The amount this rule works out is the same whatever tender paid the order. This rule books it only on an order paid in full by an external card with no Northgate Cash or gift card redeemed on it; on every other order the same amount applies, its posting to the Northgate Card, Northgate Cash or gift card ledger is made by a human representative to whom the customer is handed over as POLICY_NOT_COVERED, and nothing is booked at the care desk. The settlement read is the customer''s most recent Northgate Protect claim settlement; where two settlements share the most recent date, the one recorded first is read. A settlement by repair, a food loss payment, a settled item whose category no line of the order carries, and a settlement dated after the order date or more than ninety days before it owe no replacement haul-away credit. Every count of calendar days in this rule leaves out the day it starts from and includes the day it ends on. The standard replacement haul-away credit is one quarter of the haul-away charge on the order, rounded half up to the cent. The replacement haul-away credit percentage is that standard quarter plus every extra percentage the schedules below give; the haul-away charge on the order, or the amount a schedule below sets in its place, is multiplied once by that percentage, the result is rounded half up to the cent, and the credit never exceeds the haul-away charge standing on the order, that is the haul-away charged less refunds already booked against it. The replacement haul-away extra for settlement timing, counted in calendar days from the settlement date to the order date: zero to thirty days add forty percent; thirty-one to sixty days add twenty percent; sixty-one to ninety days add nothing. The replacement haul-away extra for the kind of item replaced: a major appliance, whose disposal needs a two-person crew and refrigerant or appliance recycling, adds twenty percent; furniture or fitness equipment adds ten percent; any other large item adds nothing. The replacement haul-away extra for the value the claim settled, the settlement amount: one thousand dollars or more adds ten percent; five hundred dollars up to one thousand dollars adds five percent; less adds nothing. The credited haul-away for the replacement haul-away credit counts the old items booked as the haul-away charge before benefits divided by the program''s haul-away fee per item, and counts the customer''s settlements by replacement or reimbursement of items of the settled category dated the same day as the settlement read, the day that claim decision was settled: where two or more such settlements stand and two or more old items are booked it is the program''s haul-away fee per item times the lesser of those two counts; where exactly one such settlement stands and two or more old items are booked it is the program''s haul-away fee for one item; otherwise it is the haul-away charge on the order. For the haul-away charge of a Scheduled Large-Item Delivery order placed zero to ninety days after a Northgate Protect claim settlement that replaced or reimbursed an item of a merchandise category the order carries, and only for that charge, the replacement haul-away credit is refunded as this rule states, whatever tender paid the order; on every other order and for every other fee, a fee is refunded only as stated in order_returns and order_fulfilment_and_cancellation, or in the rule written for that charge.'
    prerequisite: []
    cross_category:
    - category: plan
      as: history
      reads:
      - plan_events.event_date
      - plan_events.settlement_method
      - plan_events.covered_item_category
