      inspection_charge: "An inspection charge is added to the authorized repair value for a plan bought after its item was fulfilled: the first-repair inspection charge when no repair settlement has yet been booked on the plan, the repeat inspection charge when one has, and nothing on a plan bought before its item was fulfilled."
      label_line_category: "A return-shipping label charge is added to the authorized repair value for depot repairs: the computer label charge for a computer or tablet outside the tier's in-home service categories, the standard label charge for any other item outside those categories, and nothing for an item in those categories."
      label_charge: "A return-shipping label charge is added to the authorized repair value for depot repairs: the computer label charge for a computer or tablet outside the tier's in-home service categories, the standard label charge for any other item outside those categories, and nothing for an item in those categories."
      repair_value: "Where several of these apply, the repair charge is settled first, every amount that is added is then applied to it, and the result is held to no more than the item's remaining share and rounded half up to the cent once at the end."
      same_failure_repairs: "Where the repair settlements already booked on the plan for the settled claim's type on the covered order line, each of which carries that claim type, have reached no_lemon_repairs, the claim is settled by replacement whatever the repair value, booked at the item's remaining share, and the plan is fulfilled on that date."
      approval_date: "A claim is not authorized on the day of its approval: where the most recent approval decision on the plan is dated today, no settlement is authorized that day and the settled claim's repair is authorized from the next day."
      settlement_value: "Otherwise, where the authorized repair value so worked out is more than replacement_threshold_pct percent of the covered item price recorded on the plan, the claim is settled by replacement instead, booked at the item's remaining share, and the plan is fulfilled on that date; otherwise it is settled by repair at the authorized repair value."
      result: "A claim is not authorized on the day of its approval: where the most recent approval decision on the plan is dated today, no settlement is authorized that day and the settled claim's repair is authorized from the next day."
    factors:
      - id: repair_charge_method
        effect: method
        decides: repair_charge
        bindings: [charge_line_category, repair_charge]
        ladder:
          - when: "the covered order line is a computer, tablet or mobile phone outside the tier's in-home service categories"
            method: "the flat repair charge for the claim's type scaled by the registered limit over K('portable_reference_price_usd')"
          - when: "the covered order line is in the tier's in-home service categories"
            method: "the greater of the flat repair charge and the in-home minimum charge K('in_home_minimum_usd')"
          - when: "otherwise"
            method: "the flat repair charge for the claim's type"
        baseline:
          repair_charge: "flat_charge"
        evidence: [cross_category, tier_param]
        cross_difficulty: order
      - id: parts_allowance_tier
        effect: parameter
        decides: parts_allowance
        bindings: [parts_limit, parts_allowance]
        ladder:
          - when: "the limit of liability registered on the plan is at least K('parts_high_floor_usd')"
            value: "K('parts_high_usd')"
          - when: "it is at least K('parts_mid_floor_usd') but below K('parts_high_floor_usd')"
            value: "K('parts_mid_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          parts_allowance: "0"
        evidence: [history]
        cross_difficulty: null
      - id: item_age_allowance
        effect: parameter
        decides: age_allowance
        bindings: [item_age_days, age_allowance]
        ladder:
          - when: "K('age_old_days') or more days from coverage_start_date to the incident date"
            value: "K('age_old_usd')"
          - when: "K('age_mid_days') or more but fewer than K('age_old_days') days"
            value: "K('age_mid_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          age_allowance: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: service_call_charge
        effect: parameter
        decides: service_call
        bindings: [call_line_category, service_call]
        ladder:
          - when: "the covered order line is in the tier's in-home service categories"
            value: "K('in_home_trip_usd')"
          - when: "the covered order line is a computer, tablet or mobile phone outside those categories"
            value: "K('depot_bench_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          service_call: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: order
      - id: inspection_charge_rule
        effect: parameter
        decides: inspection_charge
        bindings: [repairs_booked, inspection_charge]
        ladder:
          - when: "the plan was bought after its item was fulfilled and no repair settlement has been booked on it"
            value: "K('first_inspection_usd')"
          - when: "the plan was bought after its item was fulfilled and a repair settlement has been booked on it"
            value: "K('repeat_inspection_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          inspection_charge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: return_label_charge
        effect: parameter
        decides: label_charge
        bindings: [label_line_category, label_charge]
        ladder:
          - when: "the covered order line is a computer or tablet outside the tier's in-home service categories"
            value: "K('computer_label_usd')"
          - when: "the covered order line is any other item outside those categories"
            value: "K('other_label_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          label_charge: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: order
    baseline:
