  - id: plan_complete_billing
    subject: [plan_charge, plan_charge_decline, plan_lapse]
    rule: >-
      Northgate Protect Complete Monthly is charged monthly_fee_usd on the enrollment date and then on the same calendar
      day of each month, falling back to the last day of a shorter month, to the payment method on the plan; a fee charged
      to a Northgate Card posts there as a purchase. When a monthly fee is declined the plan stays active but no claim is
      accepted while the fee is unpaid, since complete_claims_during_grace is false. A Complete Monthly plan lapses only
      when a declined monthly fee is still unpaid after the declined attempt date plus the tier's complete payment grace
      days. Calendar days are added to the date of the first declined attempt for that month, the day after it being day 1,
      and the plan lapses on the day after the last grace day. Paying the fee within the grace period restores claims from
      the payment date, and incidents during the unpaid days are not covered. One-time plans are charged once at purchase
      and are never charged again.
    eligibility:
      - id: lapse_after_grace
        applies_to: [plan_lapse]
        kind: time
        condition: A Complete Monthly plan lapses only when a declined monthly fee is still unpaid after the declined attempt date plus the tier's complete payment grace days.
        evidence_fields: [plan_events.event_date, plan_events.billing_period_start]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_events.billing_period_start]
          action_bindings:
            plan_events.billing_period_start: billing_period_start
        temporal_basis:
          clock: frozen_time
          anchor_event: the declined attempt date
          anchor_source: plan_events.event_date
          relation: not_before
          duration_source: variants.complete_payment_grace_days
          unit: calendar_days
          counting_rule: Calendar days are added to the date of the first declined attempt for that month, the day after it being day 1, and the plan lapses on the day after the last grace day.
          boundary: exclusive
    params:
      per_tier:
        Northgate Protect Standard 2-Year: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}
        Northgate Protect Standard 3-Year: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}
        Northgate Protect Accident 2-Year: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}
        Northgate Protect Accident 3-Year: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}
        Northgate Protect Accident 4-Year: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}
        Northgate Protect Complete Monthly: {monthly_fee_usd: "=monthly_fee_usd", complete_payment_grace_days: "=complete_payment_grace_days"}

extended_policies:
  - id: plan_ext_limit_of_liability_registration
    base_policy_refs: [plan_coverage_term, plan_agg_complete_overlap, plan_claim_settlement]
    overwrite:
      - base_policy: plan_coverage_term
        superseded_clause: >-
          On activation the covered item is registered and its net price becomes the limit of liability.
        replaced_by: >-
          For a single-item plan, and only for a single-item plan, the covered item is registered on the plan with the
          registered limit of liability worked out below, whether the registration is booked on activation or later; an
          item registered on Complete Monthly is still registered at its net price under the base rules.
      - base_policy: plan_claim_settlement
        superseded_clause: >-
          The limit of liability of each item follows liability_limit_basis and every reimbursement follows
          reimbursement_basis; a TV's screen size is read from the covered line's item description.
        replaced_by: >-
          The limit of liability of a single-item plan's covered item is its registered limit of liability, while an item
          on Complete Monthly keeps the limit liability_limit_basis gives it; every reimbursement still follows
          reimbursement_basis, and a TV's screen size is still read from the covered line's item description.
    trigger: state_due
    subject: [plan_register_item]
    computes: amount_usd
    target_tool: register_item_limit_ba116528
    params:
      local_match_share: 1.0
      online_match_share: 0.5
      device_accessory_share: 1.0
      other_accessory_share: 0.5
      lowest_plan_price_usd: 20.0
      large_item_delivery_share: 1.0
      parcel_delivery_share: 0.75
    rule: >-
      For a single-item plan, and only for a single-item plan, the covered item is registered on the plan with the
      registered limit of liability worked out below, whether the registration is booked on activation or later; an item
      registered on Complete Monthly is still registered at its net price under the base rules. The limit of liability of
      a single-item plan's covered item is its registered limit of liability, while an item on Complete Monthly keeps the
      limit liability_limit_basis gives it; every reimbursement still follows reimbursement_basis, and a TV's screen size
      is still read from the covered line's item description. The covered order line is the order line named on the plan,
      and the covered order is the order named on the plan. The order's line composition is read once and used throughout: its
      merchandise lines are all lines of the covered order, whatever their category; its device lines are the merchandise
      lines in the covered item's category with the same return class as the covered order line, the covered order line
      included; and its accessory lines are the merchandise lines in the covered item's category whose return class is
      general merchandise, counted as accessories only where the covered order line's own return class is not general
      merchandise and every one of them has a line amount, the net price paid for the line before tax, below the lowest min_item_price_usd of the single-item tiers, so that no line that could carry a plan of its own is ever an accessory of another item; a general-merchandise line of the category at or above that amount may have been bought for its own sake, so the order then counts no accessories at all. The standard registered limit of liability is the covered item price recorded on the plan, rounded half up
      to the cent. The registered limit starts from the price it takes to replace the item at Northgate where the covered
      order line shows one: a line that carries an item promotion is registered from its selling price per unit before
      promotions; a line that carries a Northgate price-drop adjustment and no item promotion is registered from the
      lowered Northgate price that adjustment matched; any other line keeps the recorded covered item price. Competitor
      price-match adjustments booked on the covered order line come off the registered limit, per unit bought: the whole of
      a match to a local competitor's advertised price, one half of a match to an online competitor's price, and nothing
      where the line carries no competitor price match. An accessory allowance is added to the
      registered limit, shared equally among the device lines of the order: the whole accessory amount for a
      computer, tablet or mobile phone with accessories, one half of it for an item in any other category with
      accessories, and nothing without accessories. Delivery charges paid on the covered order are added to the
      registered limit by fulfilment program, shared equally among all merchandise lines of the order: the large-item
      delivery share of the large-item delivery and haul-away fees charged on a Northgate Scheduled Large-Item Delivery
      order, the parcel delivery share of the same-day delivery, shipping and express delivery fees charged on a Northgate
      Same-Day Delivery or Northgate Ship to Home order, and nothing on any other order. Where several of these apply, the
      starting price is settled first, every amount that comes off or is added is then applied to it, and the registered
      limit is rounded half up to the cent once at the end. The registration is booked under the plan against the covered
      order line, with the covered item's category.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [order_holdings.variant_name, order_events.unit_price_usd, order_events.amount_usd, order_events.quantity, order_events.promo_discount_usd, order_events.cardholder_discount_usd, order_events.adjustment_type, order_events.item_category, order_events.return_class, order_events.fee_type]
        note: The starting price, the price-adjustment reduction, the accessory allowance and the delivery share are read from the covered order and its lines.
    compute:
      - recorded_price: "F('covered_item_price_usd')"
      - line_units: "XLATEST('order', 'order_events', 'quantity', order_event_id=F('covered_order_event_id')) or 1"
      - line_class: "XLATEST('order', 'order_events', 'return_class', order_event_id=F('covered_order_event_id'))"
      - device_lines: "MX(1, XCOUNT('order', 'order_events', event_type='order_post_line', order_id=F('covered_order_id'), item_category=F('covered_item_category'), return_class=line_class))"
      - merchandise_lines: "MX(1, XCOUNT('order', 'order_events', event_type='order_post_line', order_id=F('covered_order_id')))"
      - accessory_price_top: "XMAX('order', 'order_events', 'amount_usd', event_type='order_post_line', order_id=F('covered_order_id'), item_category=F('covered_item_category'), return_class='general_merchandise')"
      - line_unit_price: "XLATEST('order', 'order_events', 'unit_price_usd', order_event_id=F('covered_order_event_id')) or 0"
      - line_promo: "XLATEST('order', 'order_events', 'promo_discount_usd', order_event_id=F('covered_order_event_id')) or 0"
      - drop_price: "XLATEST('order', 'order_events', 'adjusted_unit_price_usd', event_type='order_adjust_price', original_event_id=F('covered_order_event_id'), adjustment_type='price_drop_adjustment') or 0"
      - starting_price: "line_unit_price if line_promo > 0 else (drop_price if drop_price > 0 else recorded_price)"
      - local_matches: "XSUM('order', 'order_events', 'amount_usd', event_type='order_adjust_price', original_event_id=F('covered_order_event_id'), adjustment_type='competitor_price_match', matched_competitor='local_competitor_ad')"
      - all_matches: "XSUM('order', 'order_events', 'amount_usd', event_type='order_adjust_price', original_event_id=F('covered_order_event_id'), adjustment_type='competitor_price_match')"
      - match_reduction: "local_matches * K('local_match_share') / line_units if local_matches > 0 else ((all_matches - local_matches) * K('online_match_share') / line_units if all_matches > 0 else 0)"
      - general_lines_total: "XSUM('order', 'order_events', 'amount_usd', event_type='order_post_line', order_id=F('covered_order_id'), item_category=F('covered_item_category'), return_class='general_merchandise')"
      - accessory_amount: "general_lines_total if (line_class != 'general_merchandise' and accessory_price_top < K('lowest_plan_price_usd')) else 0"
      - accessory_allowance: "accessory_amount * K('device_accessory_share') / device_lines if ((F('covered_item_category') == 'computers_tablets' or F('covered_item_category') == 'mobile_phones') and accessory_amount > 0) else (accessory_amount * K('other_accessory_share') / device_lines if accessory_amount > 0 else 0)"
      - order_program: "CFIELD('order', 'variant_name', order_id=F('covered_order_id'))"
      - large_item_fees: "XSUM('order', 'order_events', 'amount_usd', event_type='order_charge_fee', order_id=F('covered_order_id'), fee_type='large_item_delivery') + XSUM('order', 'order_events', 'amount_usd', event_type='order_charge_fee', order_id=F('covered_order_id'), fee_type='haul_away')"
      - parcel_fees: "XSUM('order', 'order_events', 'amount_usd', event_type='order_charge_fee', order_id=F('covered_order_id'), fee_type='same_day_delivery') + XSUM('order', 'order_events', 'amount_usd', event_type='order_charge_fee', order_id=F('covered_order_id'), fee_type='shipping') + XSUM('order', 'order_events', 'amount_usd', event_type='order_charge_fee', order_id=F('covered_order_id'), fee_type='express_delivery')"
      - delivery_added: "large_item_fees * K('large_item_delivery_share') / merchandise_lines if order_program == 'Northgate Scheduled Large-Item Delivery' else (parcel_fees * K('parcel_delivery_share') / merchandise_lines if (order_program == 'Northgate Same-Day Delivery' or order_program == 'Northgate Ship to Home') else 0)"
      - result: "RND(starting_price - match_reduction + accessory_allowance + delivery_added + 0.000000001, 2)"
    compute_basis:
      recorded_price: "The standard registered limit of liability is the covered item price recorded on the plan, rounded half up to the cent."
      line_units: "The covered order line is the order line named on the plan, and the covered order is the order named on the plan."
      line_class: "The order's line composition is read once and used throughout: its merchandise lines are all lines of the covered order, whatever their category; its device lines are the merchandise lines in the covered item's category with the same return class as the covered order line, the covered order line included; and its accessory lines are the merchandise lines in the covered item's category whose return class is general merchandise, counted as accessories only where the covered order line's own return class is not general merchandise and every one of them has a line amount, the net price paid for the line before tax, below the lowest min_item_price_usd of the single-item tiers, so that no line that could carry a plan of its own is ever an accessory of another item; a general-merchandise line of the category at or above that amount may have been bought for its own sake, so the order then counts no accessories at all."
      device_lines: "The order's line composition is read once and used throughout: its merchandise lines are all lines of the covered order, whatever their category; its device lines are the merchandise lines in the covered item's category with the same return class as the covered order line, the covered order line included; and its accessory lines are the merchandise lines in the covered item's category whose return class is general merchandise, counted as accessories only where the covered order line's own return class is not general merchandise and every one of them has a line amount, the net price paid for the line before tax, below the lowest min_item_price_usd of the single-item tiers, so that no line that could carry a plan of its own is ever an accessory of another item; a general-merchandise line of the category at or above that amount may have been bought for its own sake, so the order then counts no accessories at all."
      merchandise_lines: "The order's line composition is read once and used throughout: its merchandise lines are all lines of the covered order, whatever their category; its device lines are the merchandise lines in the covered item's category with the same return class as the covered order line, the covered order line included; and its accessory lines are the merchandise lines in the covered item's category whose return class is general merchandise, counted as accessories only where the covered order line's own return class is not general merchandise and every one of them has a line amount, the net price paid for the line before tax, below the lowest min_item_price_usd of the single-item tiers, so that no line that could carry a plan of its own is ever an accessory of another item; a general-merchandise line of the category at or above that amount may have been bought for its own sake, so the order then counts no accessories at all."
      accessory_price_top: "The order's line composition is read once and used throughout: its merchandise lines are all lines of the covered order, whatever their category; its device lines are the merchandise lines in the covered item's category with the same return class as the covered order line, the covered order line included; and its accessory lines are the merchandise lines in the covered item's category whose return class is general merchandise, counted as accessories only where the covered order line's own return class is not general merchandise and every one of them has a line amount, the net price paid for the line before tax, below the lowest min_item_price_usd of the single-item tiers, so that no line that could carry a plan of its own is ever an accessory of another item; a general-merchandise line of the category at or above that amount may have been bought for its own sake, so the order then counts no accessories at all."
      line_unit_price: "a line that carries an item promotion is registered from its selling price per unit before promotions;"
