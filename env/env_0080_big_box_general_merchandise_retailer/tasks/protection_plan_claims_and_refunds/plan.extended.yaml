      middle_plan_credit_usd: 5.0
    rule: >-
      For an approved claim on an Accident-tier plan, and only for such a claim, the service fee owed is the claim service
      fee worked out below; on a claim on any other tier the service fee is taken from the tier's service_fee_ladder band
      containing the item's net price and is charged only on the claim types in service_fee_claim_types; every service fee
      is collected before the repair or replacement is released and never reduces liability. A claim decision is not recorded until every claim approved on the plan before today carries a settlement. The claim decided is the latest claim filed on the plan that does not yet carry a decision, a claim being marked with its decision when the decision is recorded; where two such claims share that filing date, it is the one listed first on the plan's ledger. A decision denying it carries no claim service fee. The standard claim service fee is the
