      mech_claim: "A spoilage allowance is added to the food-loss payment according to the failure claims, the mechanical-failure and power-surge claims filed on the plan with the same incident date as the food-loss claim:"
      surge_claim: "A spoilage allowance is added to the food-loss payment according to the failure claims, the mechanical-failure and power-surge claims filed on the plan with the same incident date as the food-loss claim:"
      failure_approvals: "where any of them was approved, the greater of the covered-failure allowance and the disposal rate applied to the food loss claimed;"
      failure_mw_denials: "where none was approved and one was denied as denied_manufacturer_warranty, the disposal rate applied to the food loss claimed;"
      spoilage_allowance: "A spoilage allowance is added to the food-loss payment according to the failure claims, the mechanical-failure and power-surge claims filed on the plan with the same incident date as the food-loss claim: where any of them was approved, the greater of the covered-failure allowance and the disposal rate applied to the food loss claimed; where none was approved and one was denied as denied_manufacturer_warranty, the disposal rate applied to the food loss claimed; otherwise nothing."
      report_lag: "A reporting allowance is added to the food-loss payment by the days from the incident date to the food-loss claim's filing date:"
      reporting_allowance: "the next-day allowance at no more than one day, the week allowance at two to seven days, and nothing later."
      haul_away_charged: "An installation allowance is added to the food-loss payment for a refrigerator or freezer Northgate installed:"
      order_program: "An installation allowance is added to the food-loss payment for a refrigerator or freezer Northgate installed:"
      install_allowance: "the replacement-install allowance when the covered order is a Northgate Scheduled Large-Item Delivery order on which a haul-away fee was charged for the old unit, the delivered-install allowance when it is such an order with no haul-away fee, and nothing for an item the customer took home or had shipped."
      result: "Where several of these apply, the per-claim food-loss limit is settled first, the food loss claimed is held to it, a share is then applied to that held amount, every allowance is added after that, and the result is held to no more than the item's remaining share and rounded half up to the cent once at the end; it is booked as a food-loss payment settlement of the food-loss claim."
    factors:
      - id: per_claim_food_limit
        effect: parameter
        decides: per_claim_limit
        bindings: [limit_basis, per_claim_limit]
        ladder:
          - when: "the limit of liability registered on the plan is at least K('high_limit_floor_usd')"
            value: "K('high_limit_cap_usd')"
          - when: "it is at least K('mid_limit_floor_usd') but below K('high_limit_floor_usd')"
            value: "K('mid_limit_cap_usd')"
          - when: "otherwise"
            value: "P('food_spoilage_max_usd')"
        baseline:
          per_claim_limit: "P('food_spoilage_max_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_food_share
        effect: parameter
        decides: repeat_share
        bindings: [food_payments_12m, repeat_share]
        ladder:
          - when: "two or more food-loss payments booked on the plan less than 12 whole months before today"
            value: "K('two_repeat_share')"
          - when: "exactly one such food-loss payment"
            value: "K('one_repeat_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          repeat_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: spoilage_cause_allowance
        effect: method
        decides: spoilage_allowance
        bindings: [mech_claim, surge_claim, failure_approvals, failure_mw_denials, spoilage_allowance]
        ladder:
          - when: "a same-day mechanical-failure or power-surge claim was approved"
            method: "add the greater of the covered-failure allowance K('covered_failure_allowance_usd') and the disposal rate K('disposal_rate') applied to the food loss claimed"
          - when: "none was approved and one was denied as denied_manufacturer_warranty"
            method: "add the disposal rate applied to the food loss claimed"
          - when: "otherwise"
            method: "add nothing"
        baseline:
          spoilage_allowance: "0"
        evidence: [history]
        cross_difficulty: null
      - id: reporting_speed_allowance
        effect: parameter
        decides: reporting_allowance
        bindings: [report_lag, reporting_allowance]
        ladder:
          - when: "the food-loss claim was filed no more than one day after its incident date"
            value: "K('next_day_allowance_usd')"
          - when: "it was filed two to seven days after its incident date"
            value: "K('week_allowance_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          reporting_allowance: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: northgate_install_allowance
        effect: parameter
        decides: install_allowance
        bindings: [haul_away_charged, order_program, install_allowance]
        ladder:
          - when: "the covered order is a Northgate Scheduled Large-Item Delivery order with a haul-away fee charged"
            value: "K('replacement_install_allowance_usd')"
          - when: "the covered order is a Northgate Scheduled Large-Item Delivery order with no haul-away fee"
            value: "K('delivered_install_allowance_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          install_allowance: "0"
        evidence: [cross_category]
        cross_difficulty: order
    baseline:
      rule: >-
        The food-loss claim paid is the latest food-loss claim filed on the plan, and the food loss claimed is the amount
        recorded on that claim; where two food-loss claims share the latest filing date, it is the one listed first on the
        plan's ledger. The item's remaining share is the limit of liability registered on the plan less the settlements
        already booked on the plan. The standard food-loss payment is the food loss claimed held to the per-claim food-loss
        limit, which is food_spoilage_max_usd, and no more than the item's remaining share, rounded half up to the cent.
      params: [food_spoilage_max_usd]
    inputs:
      history:
        - {table: plan_events, aggregate: latest, field: amount_usd, filters: {event_type: plan_file_claim, claim_type: food_spoilage}}
        - {table: plan_events, aggregate: count, within_months: 12, filters: {event_type: plan_settle_claim, settlement_method: food_loss_payment}}
        - {table: plan_events, aggregate: count, filters: {event_type: plan_decide_claim}}
        - {category: order, table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_charge_fee, fee_type: haul_away}}
      cross_category: [order]
  - id: plan_ext_standard_cancellation_refund
    base_policy_refs: [plan_cancellation_refund, plan_coverage_term]
    overwrite:
      - base_policy: plan_cancellation_refund
        superseded_clause: >-
          Outside that, a one-time plan refunds the plan price x plan_msr_unused_coverage_days / total coverage days, less a
          cancellation fee equal to the lesser of cancellation_fee_pct of the plan price and cancellation_fee_cap_usd,
          rounded down to the cent and never below zero, with basis prorated_unused_days.
        replaced_by: >-
          For a cancellation the plan holder requests on a Standard-tier plan, and only for such a cancellation, the refund
          outside the full-refund window is the Standard plan cancellation refund worked out below, with basis
          prorated_unused_days; a cancellation the plan holder requests on an Accident-tier plan is refunded under the
          Accident plan cancellation refund, and any other one-time plan refunds the plan price x
          plan_msr_unused_coverage_days / total coverage days, less a cancellation fee equal to the lesser of
          cancellation_fee_pct of the plan price and cancellation_fee_cap_usd, rounded down to the cent and never below
          zero, with basis prorated_unused_days.
    trigger: on_request
    subject: [plan_cancel, plan_refund]
    computes: refund_amount_usd
    target_tool: cancel_standard_plan_ca7b280f
    params:
      food_only_share: 0.5
      other_settlement_share: 1.0
      warranty_tail_months: 6
      tail_fee_rate: 0.05
      tail_fee_cap_usd: 15.0
      drop_rebate_share: 1.0
      match_rebate_share: 0.5
      many_claims: 3
      many_claims_charge_usd: 15.0
      few_claims_charge_usd: 7.5
      long_wait_days: 45
      short_wait_days: 14
      long_wait_rate: 0.08
      short_wait_rate: 0.04
    rule: >-
      For a cancellation the plan holder requests on a Standard-tier plan, and only for such a cancellation, the refund
      outside the full-refund window is the Standard plan cancellation refund worked out below, with basis
      prorated_unused_days; a cancellation the plan holder requests on an Accident-tier plan is refunded under the
      Accident plan cancellation refund, and any other one-time plan refunds the plan price x plan_msr_unused_coverage_days
      / total coverage days, less a cancellation fee equal to the lesser of cancellation_fee_pct of the plan price and
      cancellation_fee_cap_usd, rounded down to the cent and never below zero, with basis prorated_unused_days. The
      Standard plan cancellation refund is not fixed until every food-loss claim approved on the plan carries its
      food-loss payment. The Standard plan's cancellation date is today, and the Standard plan's price kept is its one-time
      charges less any refunds already booked on it. The standard Standard plan cancellation refund is the Standard plan's
      price kept times its unused share, which is its unused coverage days divided by its coverage days, where the
      coverage days run from coverage_start_date through the day before coverage_end_date and the unused coverage days run
      from the day after the cancellation date through the day before coverage_end_date, never more than the coverage
      days, less a cancellation fee equal to the lesser of cancellation_fee_pct of the price kept and
      cancellation_fee_cap_usd, never below zero and never more than the price kept, rounded down to the cent. The unused
      share of a Standard plan is figured in whole months where the covered order line carries manufacturer warranty
      months, because mechanical failures inside that warranty go to the manufacturer: where the warranty months are
      below term_months, it is one less the whole months elapsed from coverage_start_date to today beyond the warranty
      months, never below zero, divided by term_months less the warranty months; where the warranty months are term_months
      or more, it is one. Where the covered order line carries no warranty months and the plan was bought after its item
      was fulfilled, the unused share is the unused coverage days divided by the days from the plan purchase date through
      the day before coverage_end_date, never more than one; otherwise it stays the standard unused share. A claims
      deduction comes off the Standard plan cancellation refund for settlements booked on the plan: where any repair,
      replacement or reimbursement settlement is booked, the other-settlement share of all its settlements; where only
      food-loss payments are booked, the food-only share of those payments; where none is booked, nothing. The Standard
      plan's cancellation fee depends on the whole months from coverage_start_date to today against the covered order
      line's manufacturer warranty months: fewer than the warranty months, no fee; at least the warranty months but fewer
      than the warranty months plus the warranty tail months, the lesser of the tail fee rate times the price kept and the
      tail fee cap; otherwise the standard fee. A price-drop rebate is added to the Standard plan cancellation refund from
      the covered order line: where it carries Northgate price-drop adjustments, the drop rebate share of the price kept
      times those adjustments divided by the line's amount; where it carries only competitor price-match adjustments, the
      match rebate share of the price kept times those adjustments divided by the line's amount; otherwise nothing. A
      claim-handling charge comes off the Standard plan cancellation refund by the claims filed on the plan: the
      many-claims charge at the many-claims count or more, the few-claims charge for one claim up to below that count, and
      nothing with no claim. A waiting addition raises the Standard plan cancellation refund where the plan holder's most
      recent cancellation request on the plan that is still submitted, neither confirmed nor withdrawn, has waited some
      days: the long-wait rate at the long-wait days or more, the short-wait rate at the short-wait days or more but fewer
      than the long-wait days, and nothing for fewer days or no such request. Where several of these apply, the unused
      share and the cancellation fee are settled first; the refund is then figured as the standard method states with
      them; every amount that comes off or is added is applied next and the result is never below zero; a rate that raises
      the refund is applied after that; and the refund is held to no more than the price kept and rounded down to the cent
      once at the end.
    prerequisite:
      - problem: plan_ext_food_loss_payment
        kind: value_input
        gate: claims_deduction
        form: state
        policy_source: >-
          The Standard plan cancellation refund is not fixed until every food-loss claim approved on the plan carries its
          food-loss payment.
        condition: >-
          Every food-loss claim with an approved decision on the plan has a food-loss payment settlement booked against it.
        resolved_by: pay_food_loss_claim_b4f587dd
        effect: >-
          The food-loss payment raises the food-loss payments booked on the plan, which moves the claims deduction taken
          off the refund.
    cross_category:
      - category: order
        as: history
        reads: [order_events.manufacturer_warranty_months, order_events.amount_usd, order_events.adjustment_type]
        note: The unused share and the cancellation fee read the covered line's manufacturer warranty months; the price-drop rebate reads its adjustments.
    compute:
      - price_kept: "SUM('plan_events', 'amount_usd', event_type='plan_charge', charge_type='one_time_price') - SUM('plan_events', 'amount_usd', event_type='plan_refund')"
      - coverage_days: "DAYS(F('coverage_start_date'), F('coverage_end_date'))"
      - unused_days: "MN(coverage_days, MX(0, DAYS(NOW, F('coverage_end_date')) - 1))"
      - share_warranty_months: "XLATEST('order', 'order_events', 'manufacturer_warranty_months', order_event_id=F('covered_order_event_id')) or 0"
      - unused_share: "(1 if share_warranty_months >= P('term_months') else 1 - MX(0, MONTHS(F('coverage_start_date'), NOW) - share_warranty_months) / (P('term_months') - share_warranty_months)) if share_warranty_months > 0 else (MN(1, unused_days / DAYS(F('purchase_date'), F('coverage_end_date'))) if F('bought_after_fulfilment') == True else unused_days / coverage_days)"
      - food_payments: "SUM('plan_events', 'amount_usd', event_type='plan_settle_claim', settlement_method='food_loss_payment')"
      - other_settlements: "SUM('plan_events', 'amount_usd', event_type='plan_settle_claim') - food_payments"
      - claims_deduction: "K('other_settlement_share') * (other_settlements + food_payments) if other_settlements > 0 else (K('food_only_share') * food_payments if food_payments > 0 else 0)"
      - fee_warranty_months: "XLATEST('order', 'order_events', 'manufacturer_warranty_months', order_event_id=F('covered_order_event_id')) or 0"
      - months_covered: "MONTHS(F('coverage_start_date'), NOW)"
      - cancellation_fee: "0 if months_covered < fee_warranty_months else (MN(K('tail_fee_rate') * price_kept, K('tail_fee_cap_usd')) if months_covered < fee_warranty_months + K('warranty_tail_months') else MN(P('cancellation_fee_pct') / 100 * price_kept, P('cancellation_fee_cap_usd')))"
      - line_amount: "XLATEST('order', 'order_events', 'amount_usd', order_event_id=F('covered_order_event_id')) or 0"
      - drop_adjustments: "XSUM('order', 'order_events', 'amount_usd', event_type='order_adjust_price', original_event_id=F('covered_order_event_id'), adjustment_type='price_drop_adjustment')"
      - match_adjustments: "XSUM('order', 'order_events', 'amount_usd', event_type='order_adjust_price', original_event_id=F('covered_order_event_id'), adjustment_type='competitor_price_match')"
      - price_drop_rebate: "K('drop_rebate_share') * price_kept * drop_adjustments / line_amount if (drop_adjustments > 0 and line_amount > 0) else (K('match_rebate_share') * price_kept * match_adjustments / line_amount if (match_adjustments > 0 and line_amount > 0) else 0)"
      - claims_filed: "COUNT('plan_events', event_type='plan_file_claim')"
      - handling_charge: "K('many_claims_charge_usd') if claims_filed >= K('many_claims') else (K('few_claims_charge_usd') if claims_filed > 0 else 0)"
      - open_request_date: "LATEST('plan_requests', 'created_at', date_field='created_at', request_type='cancel_plan', request_status='submitted')"
      - request_wait_days: "DAYS(open_request_date, NOW) if open_request_date else 0"
      - waiting_rate: "K('long_wait_rate') if request_wait_days >= K('long_wait_days') else (K('short_wait_rate') if request_wait_days >= K('short_wait_days') else 0)"
      - net_refund: "MX(0, price_kept * unused_share + price_drop_rebate - cancellation_fee - handling_charge - claims_deduction)"
      - result: "int(MN(price_kept, net_refund * (1 + waiting_rate)) * 100 + 0.000000001) / 100"
    compute_basis:
      price_kept: "The Standard plan's cancellation date is today, and the Standard plan's price kept is its one-time charges less any refunds already booked on it."
      coverage_days: "where the coverage days run from coverage_start_date through the day before coverage_end_date"
      unused_days: "the unused coverage days run from the day after the cancellation date through the day before coverage_end_date, never more than the coverage days,"
      share_warranty_months: "The unused share of a Standard plan is figured in whole months where the covered order line carries manufacturer warranty months, because mechanical failures inside that warranty go to the manufacturer:"
      unused_share: "where the warranty months are below term_months, it is one less the whole months elapsed from coverage_start_date to today beyond the warranty months, never below zero, divided by term_months less the warranty months; where the warranty months are term_months or more, it is one. Where the covered order line carries no warranty months and the plan was bought after its item was fulfilled, the unused share is the unused coverage days divided by the days from the plan purchase date through the day before coverage_end_date, never more than one; otherwise it stays the standard unused share."
      food_payments: "A claims deduction comes off the Standard plan cancellation refund for settlements booked on the plan:"
      other_settlements: "A claims deduction comes off the Standard plan cancellation refund for settlements booked on the plan:"
      claims_deduction: "where any repair, replacement or reimbursement settlement is booked, the other-settlement share of all its settlements; where only food-loss payments are booked, the food-only share of those payments; where none is booked, nothing."
      fee_warranty_months: "The Standard plan's cancellation fee depends on the whole months from coverage_start_date to today against the covered order line's manufacturer warranty months:"
      months_covered: "The Standard plan's cancellation fee depends on the whole months from coverage_start_date to today against the covered order line's manufacturer warranty months:"
      cancellation_fee: "fewer than the warranty months, no fee; at least the warranty months but fewer than the warranty months plus the warranty tail months, the lesser of the tail fee rate times the price kept and the tail fee cap; otherwise the standard fee."
      line_amount: "A price-drop rebate is added to the Standard plan cancellation refund from the covered order line:"
      drop_adjustments: "where it carries Northgate price-drop adjustments, the drop rebate share of the price kept times those adjustments divided by the line's amount;"
      match_adjustments: "where it carries only competitor price-match adjustments, the match rebate share of the price kept times those adjustments divided by the line's amount; otherwise nothing."
      price_drop_rebate: "where it carries Northgate price-drop adjustments, the drop rebate share of the price kept times those adjustments divided by the line's amount; where it carries only competitor price-match adjustments, the match rebate share of the price kept times those adjustments divided by the line's amount; otherwise nothing."
      claims_filed: "A claim-handling charge comes off the Standard plan cancellation refund by the claims filed on the plan:"
      handling_charge: "the many-claims charge at the many-claims count or more, the few-claims charge for one claim up to below that count, and nothing with no claim."
      open_request_date: "A waiting addition raises the Standard plan cancellation refund where the plan holder's most recent cancellation request on the plan that is still submitted, neither confirmed nor withdrawn, has waited some days:"
      request_wait_days: "A waiting addition raises the Standard plan cancellation refund where the plan holder's most recent cancellation request on the plan that is still submitted, neither confirmed nor withdrawn, has waited some days:"
      waiting_rate: "the long-wait rate at the long-wait days or more, the short-wait rate at the short-wait days or more but fewer than the long-wait days, and nothing for fewer days or no such request."
      net_refund: "every amount that comes off or is added is applied next and the result is never below zero;"
      result: "a rate that raises the refund is applied after that; and the refund is held to no more than the price kept and rounded down to the cent once at the end."
    factors:
      - id: warranty_month_share
        effect: method
        decides: unused_share
        bindings: [share_warranty_months, unused_share]
        ladder:
          - when: "the covered order line carries manufacturer warranty months"
            method: "whole months: one less the months elapsed beyond the warranty months over term_months less the warranty months, or one where the warranty months are term_months or more"
          - when: "the covered order line carries no warranty months and the plan was bought after its item was fulfilled"
            method: "unused coverage days over the days from the plan purchase date through the day before coverage_end_date"
          - when: "otherwise"
            method: "unused coverage days over coverage days"
        baseline:
          unused_share: "unused_days / coverage_days"
        evidence: [cross_category, date]
        cross_difficulty: order
      - id: claims_deduction_share
        effect: parameter
        decides: claims_deduction
        bindings: [food_payments, other_settlements, claims_deduction]
        ladder:
          - when: "a repair, replacement or reimbursement settlement is booked on the plan"
            value: "K('other_settlement_share') of all settlements"
          - when: "only food-loss payments are booked on the plan"
            value: "K('food_only_share') of the food-loss payments"
          - when: "otherwise"
            value: "0"
        baseline:
          claims_deduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: warranty_period_fee
        effect: parameter
        decides: cancellation_fee
        bindings: [fee_warranty_months, months_covered, cancellation_fee]
        ladder:
          - when: "the whole months covered are fewer than the covered order line's manufacturer warranty months"
            value: "0"
          - when: "they are at least the warranty months but fewer than the warranty months plus K('warranty_tail_months')"
            value: "the lesser of K('tail_fee_rate') times the price kept and K('tail_fee_cap_usd')"
          - when: "otherwise"
            value: "the lesser of cancellation_fee_pct of the price kept and cancellation_fee_cap_usd"
        baseline:
          cancellation_fee: "MN(P('cancellation_fee_pct') / 100 * price_kept, P('cancellation_fee_cap_usd'))"
        evidence: [cross_category, date]
        cross_difficulty: order
      - id: price_drop_rebate_rule
        effect: parameter
        decides: price_drop_rebate
        bindings: [drop_adjustments, match_adjustments, price_drop_rebate]
        ladder:
          - when: "the covered order line carries Northgate price-drop adjustments"
            value: "K('drop_rebate_share') of the price kept in proportion to the adjustments"
          - when: "the covered order line carries only competitor price-match adjustments"
            value: "K('match_rebate_share') of the price kept in proportion to the adjustments"
          - when: "otherwise"
            value: "0"
        baseline:
          price_drop_rebate: "0"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: claim_handling_charge
        effect: parameter
        decides: handling_charge
        bindings: [claims_filed, handling_charge]
        ladder:
          - when: "K('many_claims') or more claims filed on the plan"
            value: "K('many_claims_charge_usd')"
          - when: "one claim up to fewer than K('many_claims')"
            value: "K('few_claims_charge_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          handling_charge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: request_waiting_addition
        effect: parameter
        decides: waiting_rate
        bindings: [open_request_date, request_wait_days, waiting_rate]
        ladder:
          - when: "the most recent still-submitted cancellation request has waited K('long_wait_days') days or more"
            value: "K('long_wait_rate')"
          - when: "it has waited K('short_wait_days') or more but fewer than K('long_wait_days') days"
            value: "K('short_wait_rate')"
          - when: "otherwise"
            value: "0"
        baseline:
          waiting_rate: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The Standard plan's cancellation date is today, and the Standard plan's price kept is its one-time charges less any
        refunds already booked on it. The standard Standard plan cancellation refund is the Standard plan's price kept times
        its unused share, which is its unused coverage days divided by its coverage days, where the coverage days run from
        coverage_start_date through the day before coverage_end_date and the unused coverage days run from the day after
        the cancellation date through the day before coverage_end_date, never more than the coverage days, less a
        cancellation fee equal to the lesser of cancellation_fee_pct of the price kept and cancellation_fee_cap_usd, never
        below zero and never more than the price kept, rounded down to the cent.
      params: [cancellation_fee_pct, cancellation_fee_cap_usd]
    inputs:
      history:
        - {table: plan_events, aggregate: sum, field: amount_usd, filters: {event_type: plan_charge}}
        - {table: plan_events, aggregate: sum, field: amount_usd, filters: {event_type: plan_settle_claim}}
        - {table: plan_events, aggregate: count, filters: {event_type: plan_file_claim}}
        - {category: order, table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_adjust_price}}
      cross_category: [order]
