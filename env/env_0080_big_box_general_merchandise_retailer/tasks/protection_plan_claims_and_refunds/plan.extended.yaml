  - id: plan_ext_repair_authorization_value
    base_policy_refs: [plan_claim_settlement, plan_agg_complete_overlap]
    overwrite: []
    trigger: state_due
    subject: [plan_settle_claim, plan_fulfil]
    computes: amount_usd
    target_tool: authorize_claim_repair_5d8df043
    params:
      flat_accidental_damage_usd: 289.0
      flat_mechanical_failure_usd: 199.0
      flat_power_surge_usd: 219.0
      flat_battery_failure_usd: 99.0
      portable_reference_price_usd: 1500.0
      in_home_minimum_usd: 249.0
      parts_high_floor_usd: 2000.0
      parts_mid_floor_usd: 1000.0
      parts_high_usd: 60.0
      parts_mid_usd: 30.0
      age_old_days: 730
      age_mid_days: 270
      age_old_usd: 60.0
      age_mid_usd: 30.0
      in_home_trip_usd: 65.0
      depot_bench_usd: 40.0
      first_inspection_usd: 20.0
      repeat_inspection_usd: 10.0
      computer_label_usd: 24.5
      other_label_usd: 12.75
    rule: >-
      For a claim approved on a single-item plan, the settlement the administrator authorizes is booked against the item's
      remaining share of the limit of liability. The claim settled is the claim with the most recent approval decision on
      the plan; where two approvals share that date, it is the one listed first on the plan's ledger. The authorized
      repair value is fixed only after the covered item carries its limit-of-liability registration on the plan. The
      item's remaining share is the limit of liability registered on the plan less the repair, replacement,
      reimbursement and food-loss settlements already booked on the plan. The standard authorized repair value is the flat
      repair charge for the settled claim's type, no more than the item's remaining share, rounded half up to the cent.
      The repair charge is figured differently for some covered items, read from the item category of the covered order
      line: for a computer, tablet or mobile phone outside the tier's in-home service categories it is the flat repair
      charge for the claim's type scaled by the limit of liability registered on the plan over the portable reference
      price; for an item in the tier's in-home service categories it is the greater of the flat repair charge for the
      claim's type and the in-home minimum charge; for any other item it stays the flat repair charge. A parts allowance is
      added to the authorized repair value by the limit of liability registered on the plan: the high parts allowance when
      it is at least the high parts floor, the middle parts allowance when it is at least the middle parts floor but below
      the high parts floor, and nothing below that. An age allowance is added to the authorized repair value by the days
      from coverage_start_date to the settled claim's incident date: the old-item allowance at the old-item days or more,
      the middle-age allowance at the middle-age days or more but fewer than the old-item days, and nothing for fewer. A
      service-call charge is added to the authorized repair value: the in-home trip charge for an item in the tier's
      in-home service categories, the depot bench charge for a computer, tablet or mobile phone outside those categories,
      and nothing for any other item. An inspection charge is added to the authorized repair value for a plan bought after
      its item was fulfilled: the first-repair inspection charge when no repair settlement has yet been booked on the plan,
      the repeat inspection charge when one has, and nothing on a plan bought before its item was fulfilled. A
      return-shipping label charge is added to the authorized repair value for depot repairs: the computer label charge for
      a computer or tablet outside the tier's in-home service categories, the standard label charge for any other item
      outside those categories, and nothing for an item in those categories. Where several of these apply, the repair
      charge is settled first, every amount that is added is then applied to it, and the result is held to no more than the
      item's remaining share and rounded half up to the cent once at the end. Where the repair settlements already booked on the plan for the
      settled claim's type on the covered order line, each of which carries that claim type, have reached no_lemon_repairs,
      the claim is settled by replacement whatever the repair value, booked at the item's remaining share, and the plan is
      fulfilled on that date. Otherwise, where the authorized repair value so worked out is more than
      replacement_threshold_pct percent of the covered item price recorded on the plan, the claim is settled by
      replacement instead, booked at the item's remaining share, and the plan is fulfilled on that date; otherwise it is
      settled by repair at the authorized repair value. A claim is not authorized on the day of its approval: where the most
      recent approval decision on the plan is dated today, no settlement is authorized that day and the settled claim's
      repair is authorized from the next day.
    prerequisite:
      - problem: plan_ext_limit_of_liability_registration
        kind: value_input
        gate: registered_limit
        form: state
        policy_source: >-
          The authorized repair value is fixed only after the covered item carries its limit-of-liability registration on
          the plan.
        condition: >-
          The plan carries a registration row for its covered order line, so the limit of liability registered on the plan
          is the registered limit and not zero.
        resolved_by: register_item_limit_ba116528
        effect: >-
          The registration row sets the limit of liability registered on the plan, which moves the remaining share, the
          portable repair charge and the parts allowance.
    cross_category:
      - category: order
        as: history
        reads: [order_events.item_category]
        note: The repair charge method, the service-call charge and the return-label charge are chosen by the item category of the covered order line.
    compute:
      - settled_claim: "LATEST('plan_events', 'original_event_id', event_type='plan_decide_claim', claim_decision='approved')"
      - claim_type: "LATEST('plan_events', 'claim_type', event_type='plan_file_claim', plan_event_id=settled_claim)"
      - incident_date: "LATEST('plan_events', 'incident_date', event_type='plan_file_claim', plan_event_id=settled_claim)"
      - registered_limit: "SUM('plan_events', 'amount_usd', event_type='plan_register_item')"
      - settled_before: "SUM('plan_events', 'amount_usd', event_type='plan_settle_claim')"
      - remaining_share: "MX(0, registered_limit - settled_before)"
      - flat_charge: "K('flat_accidental_damage_usd') if claim_type == 'accidental_damage' else (K('flat_mechanical_failure_usd') if claim_type == 'mechanical_failure' else (K('flat_power_surge_usd') if claim_type == 'power_surge' else (K('flat_battery_failure_usd') if claim_type == 'battery_failure' else 0)))"
      - charge_line_category: "XLATEST('order', 'order_events', 'item_category', order_event_id=F('covered_order_event_id'))"
      - repair_charge: "flat_charge * registered_limit / K('portable_reference_price_usd') if ((charge_line_category == 'computers_tablets' or charge_line_category == 'mobile_phones') and charge_line_category not in P('in_home_service_categories')) else (MX(flat_charge, K('in_home_minimum_usd')) if charge_line_category in P('in_home_service_categories') else flat_charge)"
      - parts_limit: "SUM('plan_events', 'amount_usd', event_type='plan_register_item')"
      - parts_allowance: "K('parts_high_usd') if parts_limit >= K('parts_high_floor_usd') else (K('parts_mid_usd') if parts_limit >= K('parts_mid_floor_usd') else 0)"
      - item_age_days: "DAYS(F('coverage_start_date'), incident_date)"
      - age_allowance: "K('age_old_usd') if item_age_days >= K('age_old_days') else (K('age_mid_usd') if item_age_days >= K('age_mid_days') else 0)"
      - call_line_category: "XLATEST('order', 'order_events', 'item_category', order_event_id=F('covered_order_event_id'))"
      - service_call: "K('in_home_trip_usd') if call_line_category in P('in_home_service_categories') else (K('depot_bench_usd') if (call_line_category == 'computers_tablets' or call_line_category == 'mobile_phones') else 0)"
      - repairs_booked: "COUNT('plan_events', event_type='plan_settle_claim', settlement_method='repair')"
      - inspection_charge: "K('first_inspection_usd') if (F('bought_after_fulfilment') == True and repairs_booked == 0) else (K('repeat_inspection_usd') if (F('bought_after_fulfilment') == True and repairs_booked > 0) else 0)"
      - label_line_category: "XLATEST('order', 'order_events', 'item_category', order_event_id=F('covered_order_event_id'))"
      - label_charge: "K('computer_label_usd') if (label_line_category == 'computers_tablets' and label_line_category not in P('in_home_service_categories')) else (K('other_label_usd') if label_line_category not in P('in_home_service_categories') else 0)"
      - repair_value: "MN(remaining_share, repair_charge + parts_allowance + age_allowance + service_call + inspection_charge + label_charge)"
      - same_failure_repairs: "COUNT('plan_events', event_type='plan_settle_claim', settlement_method='repair', claim_type=claim_type, covered_order_event_id=F('covered_order_event_id'))"
      - approval_date: "LATEST('plan_events', 'event_date', event_type='plan_decide_claim', claim_decision='approved')"
      - settlement_value: "remaining_share if (same_failure_repairs >= P('no_lemon_repairs') or repair_value > P('replacement_threshold_pct') / 100 * F('covered_item_price_usd')) else repair_value"
      - result: "RND((0 if approval_date == NOW else settlement_value) + 0.000000001, 2)"
