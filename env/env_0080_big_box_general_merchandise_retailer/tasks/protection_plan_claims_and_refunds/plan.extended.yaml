      wear and power surge on every tier; accidental damage from handling and battery failure where
      covers_accidental_damage and covers_battery_failure are true; food loss on a failed refrigerator or freezer where
      food_spoilage_max_usd is above zero, paid on a Standard-tier plan, and only on such a plan, as the food-loss payment
      worked out below, and on any other tier up to food_spoilage_max_usd. The food-loss claim paid is the latest
      food-loss claim filed on the plan, and the food loss claimed is the amount recorded on that claim; where two food-loss
      claims share the latest filing date, it is the one listed first on the plan's ledger. The item's remaining share is
      the limit of liability registered on the plan less the settlements already booked on the plan. The standard
      food-loss payment is the food loss claimed held to the per-claim food-loss limit, which is food_spoilage_max_usd, and
      no more than the item's remaining share, rounded half up to the cent. The per-claim food-loss limit is raised by the
      limit of liability registered on the plan: to the high food-loss limit when it is at least the high limit floor, to
      the middle food-loss limit when it is at least the middle limit floor but below the high limit floor, and it stays
      food_spoilage_max_usd below that. A repeat share applies to the food loss held within the per-claim food-loss limit,
      by the food-loss payments booked on the plan less than 12 whole months before today: the two-payment share when there
      are two or more, the one-payment share when there is exactly one, and the whole of it when there are none. A spoilage
      allowance is added to the food-loss payment according to the failure claims, the mechanical-failure and power-surge
      claims filed on the plan with the same incident date as the food-loss claim: where any of them was approved, the
      greater of the covered-failure allowance and the disposal rate applied to the food loss claimed; where none was
      approved and one was denied as denied_manufacturer_warranty, the disposal rate applied to the food loss claimed;
      otherwise nothing. A reporting allowance is added to the food-loss payment by the
      days from the incident date to the food-loss claim's filing date: the next-day allowance at no more than one day, the
      week allowance at two to seven days, and nothing later. An installation allowance is added to the food-loss payment
      for a refrigerator or freezer Northgate installed: the replacement-install allowance when the covered order is a
      Northgate Scheduled Large-Item Delivery order on which a haul-away fee was charged for the old unit, the
      delivered-install allowance when it is such an order with no haul-away fee, and nothing for an item the customer
      took home or had shipped. Where several of these apply, the per-claim food-loss limit is settled first, the food loss
      claimed is held to it, a share is then applied to that held amount, every allowance is added after that, and the
      result is held to no more than the item's remaining share and rounded half up to the cent once at the end; it is
      booked as a food-loss payment settlement of the food-loss claim.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [order_holdings.variant_name, order_events.fee_type, order_events.amount_usd]
        note: The installation allowance is read from the fulfilment program and the haul-away fee of the covered order.
    compute:
      - food_claimed: "LATEST('plan_events', 'amount_usd', event_type='plan_file_claim', claim_type='food_spoilage')"
      - food_incident: "LATEST('plan_events', 'incident_date', event_type='plan_file_claim', claim_type='food_spoilage')"
      - food_filed: "LATEST('plan_events', 'event_date', event_type='plan_file_claim', claim_type='food_spoilage')"
      - registered_limit: "SUM('plan_events', 'amount_usd', event_type='plan_register_item')"
      - remaining_share: "MX(0, registered_limit - SUM('plan_events', 'amount_usd', event_type='plan_settle_claim'))"
      - limit_basis: "SUM('plan_events', 'amount_usd', event_type='plan_register_item')"
      - per_claim_limit: "K('high_limit_cap_usd') if limit_basis >= K('high_limit_floor_usd') else (K('mid_limit_cap_usd') if limit_basis >= K('mid_limit_floor_usd') else P('food_spoilage_max_usd'))"
      - food_payments_12m: "COUNT('plan_events', within_months=12, event_type='plan_settle_claim', settlement_method='food_loss_payment')"
      - repeat_share: "K('two_repeat_share') if food_payments_12m >= 2 else (K('one_repeat_share') if food_payments_12m == 1 else 1)"
      - mech_claim: "LATEST('plan_events', 'plan_event_id', event_type='plan_file_claim', claim_type='mechanical_failure', incident_date=food_incident)"
      - surge_claim: "LATEST('plan_events', 'plan_event_id', event_type='plan_file_claim', claim_type='power_surge', incident_date=food_incident)"
      - failure_approvals: "(COUNT('plan_events', event_type='plan_decide_claim', original_event_id=mech_claim, claim_decision='approved') if mech_claim else 0) + (COUNT('plan_events', event_type='plan_decide_claim', original_event_id=surge_claim, claim_decision='approved') if surge_claim else 0)"
      - failure_mw_denials: "(COUNT('plan_events', event_type='plan_decide_claim', original_event_id=mech_claim, claim_decision='denied_manufacturer_warranty') if mech_claim else 0) + (COUNT('plan_events', event_type='plan_decide_claim', original_event_id=surge_claim, claim_decision='denied_manufacturer_warranty') if surge_claim else 0)"
      - spoilage_allowance: "MX(K('covered_failure_allowance_usd'), food_claimed * K('disposal_rate')) if failure_approvals > 0 else (food_claimed * K('disposal_rate') if failure_mw_denials > 0 else 0)"
      - report_lag: "DAYS(food_incident, food_filed)"
      - reporting_allowance: "K('next_day_allowance_usd') if report_lag <= K('next_day_days') else (K('week_allowance_usd') if report_lag <= K('week_days') else 0)"
      - haul_away_charged: "XSUM('order', 'order_events', 'amount_usd', event_type='order_charge_fee', order_id=F('covered_order_id'), fee_type='haul_away')"
      - order_program: "CFIELD('order', 'variant_name', order_id=F('covered_order_id'))"
      - install_allowance: "K('replacement_install_allowance_usd') if (order_program == 'Northgate Scheduled Large-Item Delivery' and haul_away_charged > 0) else (K('delivered_install_allowance_usd') if order_program == 'Northgate Scheduled Large-Item Delivery' else 0)"
      - result: "RND(MN(remaining_share, MN(food_claimed, per_claim_limit) * repeat_share + spoilage_allowance + reporting_allowance + install_allowance) + 0.000000001, 2)"
    compute_basis:
      food_claimed: "The food-loss claim paid is the latest food-loss claim filed on the plan, and the food loss claimed is the amount recorded on that claim; where two food-loss claims share the latest filing date, it is the one listed first on the plan's ledger."
      food_incident: "The food-loss claim paid is the latest food-loss claim filed on the plan, and the food loss claimed is the amount recorded on that claim; where two food-loss claims share the latest filing date, it is the one listed first on the plan's ledger."
      food_filed: "The food-loss claim paid is the latest food-loss claim filed on the plan, and the food loss claimed is the amount recorded on that claim; where two food-loss claims share the latest filing date, it is the one listed first on the plan's ledger."
      registered_limit: "The item's remaining share is the limit of liability registered on the plan less the settlements already booked on the plan."
