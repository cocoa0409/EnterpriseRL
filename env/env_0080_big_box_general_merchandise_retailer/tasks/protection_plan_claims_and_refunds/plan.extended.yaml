  - id: plan_ext_accident_cancellation_refund
    base_policy_refs: [plan_cancellation_refund, plan_coverage_term]
    overwrite:
      - base_policy: plan_cancellation_refund
        superseded_clause: >-
          Outside that, a one-time plan refunds the plan price x plan_msr_unused_coverage_days / total coverage days, less a
          cancellation fee equal to the lesser of cancellation_fee_pct of the plan price and cancellation_fee_cap_usd,
          rounded down to the cent and never below zero, with basis prorated_unused_days.
        replaced_by: >-
          For a cancellation the plan holder requests on an Accident-tier plan, and only for such a cancellation, the refund
          outside the full-refund window is the Accident plan cancellation refund worked out below, with basis
          prorated_unused_days; a cancellation the plan holder requests on a Standard-tier plan is refunded under the
          Standard plan cancellation refund, and any other one-time plan refunds the plan price x
          plan_msr_unused_coverage_days / total coverage days, less a cancellation fee equal to the lesser of
          cancellation_fee_pct of the plan price and cancellation_fee_cap_usd, rounded down to the cent and never below
          zero, with basis prorated_unused_days.
    trigger: on_request
    subject: [plan_cancel, plan_refund]
    computes: refund_amount_usd
    target_tool: cancel_accident_plan_cec4ac7d
    params:
      payout_threshold_share: 0.25
      heavy_payout_weight: 0.5
      light_payout_weight: 0.25
      long_held_months: 24
      mid_held_months: 6
      mid_fee_rate: 0.1
      mid_fee_cap_usd: 15.0
      long_fee_rate: 0.0
      long_fee_cap_usd: 0.0
      slow_request_days: 30
      late_request_days: 7
      slow_handling_rate: 0.10
      late_handling_rate: 0.05
      delivery_wait_days: 7
      many_approvals: 2
      many_approvals_charge_usd: 15.0
      one_approval_charge_usd: 7.5
    rule: >-
      For a cancellation the plan holder requests on an Accident-tier plan, and only for such a cancellation, the refund
      outside the full-refund window is the Accident plan cancellation refund worked out below, with basis
      prorated_unused_days; a cancellation the plan holder requests on a Standard-tier plan is refunded under the Standard
      plan cancellation refund, and any other one-time plan refunds the plan price x plan_msr_unused_coverage_days / total
      coverage days, less a cancellation fee equal to the lesser of cancellation_fee_pct of the plan price and
      cancellation_fee_cap_usd, rounded down to the cent and never below zero, with basis prorated_unused_days. The
      Accident plan cancellation refund is not worked out until every claim filed on the plan carries the administrator's
      decision. The Accident plan cancellation refund is fixed only after every claim approved on the plan before today carries a settlement. The cancellation date is today. The plan price kept is the plan's
      one-time charges less any refunds already booked on the plan. The standard Accident plan cancellation refund is the
      plan price kept times the unused coverage days divided by the coverage days, where the coverage days run from
      coverage_start_date through the day before coverage_end_date and the unused coverage days run from the day after the
      cancellation date through the day before coverage_end_date, never more than the coverage days, less a cancellation
      fee equal to the lesser of cancellation_fee_pct of the plan price kept and cancellation_fee_cap_usd, less the claim
      service fees still owed, never below zero and never more than the plan price kept, rounded down to the cent. The
      claim service fees still owed are the service fees recorded on claim decisions dated less than one whole month before
      today. A claim approved on the cancellation date stays covered for its incident: its service fee is
      among the claim service fees still owed and is taken from the refund, and its repair is authorized after the
      cancellation under the repair rules. Where the counting of coverage days starts depends on how the plan was bought: for a plan bought after its
      item was fulfilled, the coverage days start on the day after the waiting period ends, that is coverage_start_date
      plus waiting_period_days; for a plan bought on or before its item was fulfilled whose coverage started more than
      the delivery-wait days after the plan purchase date, the coverage days start on the plan purchase date; for any other plan they start on
      coverage_start_date; the unused coverage days are never more than the coverage days so counted. A payout weighting is
      added to the used share, which is one less the unused coverage days divided by the coverage days, by the payout share,
      that is the repair, replacement, reimbursement and food-loss settlements booked on the plan divided by the limit of
      liability registered on the plan, zero when no limit is registered: the heavy payout weight times the payout share
      where the payout share is at least the payout threshold share, the light payout weight times the payout share where it
      is above zero but below that threshold, and nothing where it is zero; the used share is never more than one. The
      cancellation fee depends on how many whole months the plan has been held since its purchase date: at the long-held
      months or more, the lesser of the long-held rate times the plan price kept and the long-held cap; at the mid-held
      months or more but fewer than the long-held months, the lesser of the mid-held rate times the plan price kept and the
      mid-held cap; for fewer, the standard fee. A claim-administration charge comes off the refund by the claims approved
      on the plan: the many-approvals charge at the many-approvals count or more, the one-approval charge for exactly one,
      and nothing for none. A late-handling addition raises the refund where the plan holder's most recent cancellation
      request on the plan that is still submitted, neither confirmed nor withdrawn, was recorded some days before today:
      the slow-handling rate at the slow-request days or more, the late-handling rate at the late-request days or more but
      fewer than the slow-request days, and nothing for fewer days or no such request. Where several of these apply, the
      counting start, the used share and the cancellation fee are settled first; the refund is then figured as the
      standard method states with them; every charge that comes off is applied next and the result is never below zero; a
      rate that raises the refund is applied after that; and the refund is held to no more than the plan price kept and
      rounded down to the cent once at the end.
    prerequisite:
      - problem: plan_ext_accident_claim_service_fee
        kind: value_input
        gate: fees_owed
        form: state
        policy_source: >-
          The Accident plan cancellation refund is not worked out until every claim filed on the plan carries the
          administrator's decision.
        condition: >-
          Every claim filed on the plan has a claim decision row recording its decision and service fee.
        resolved_by: record_claim_decision_cf68f06d
        effect: >-
          The decision row on the latest claim records its service fee dated today, which enters the claim service fees
          still owed, and its approval enters the claims approved on the plan.
      - problem: plan_ext_repair_authorization_value
        kind: value_input
        gate: payout_share
        form: state
        policy_source: >-
          The Accident plan cancellation refund is fixed only after every claim approved on the plan before today carries
          a settlement.
        condition: >-
          Every claim whose approval is dated before today has a settlement row of any method booked against it.
        resolved_by: authorize_claim_repair_5d8df043
        effect: >-
          The settlement row raises the settlements booked on the plan, which moves the payout share and the payout
          weighting of the used share.
    cross_category: []
    compute:
      - price_kept: "SUM('plan_events', 'amount_usd', event_type='plan_charge', charge_type='one_time_price') - SUM('plan_events', 'amount_usd', event_type='plan_refund')"
      - full_span_days: "DAYS(F('coverage_start_date'), F('coverage_end_date'))"
      - days_to_end: "MX(0, DAYS(NOW, F('coverage_end_date')) - 1)"
      - start_offset_days: "P('waiting_period_days') if F('bought_after_fulfilment') == True else (0 - DAYS(F('purchase_date'), F('coverage_start_date')) if DAYS(F('purchase_date'), F('coverage_start_date')) > K('delivery_wait_days') else 0)"
      - coverage_days: "full_span_days - start_offset_days"
      - unused_days: "MN(coverage_days, days_to_end)"
      - time_used_share: "1 - unused_days / coverage_days"
      - settled_total: "SUM('plan_events', 'amount_usd', event_type='plan_settle_claim')"
      - registered_limit: "SUM('plan_events', 'amount_usd', event_type='plan_register_item')"
      - payout_share: "settled_total / registered_limit if registered_limit > 0 else 0"
      - payout_weighting: "K('heavy_payout_weight') * payout_share if payout_share >= K('payout_threshold_share') else (K('light_payout_weight') * payout_share if payout_share > 0 else 0)"
      - used_share: "MN(1, time_used_share + payout_weighting)"
      - months_held: "MONTHS(F('purchase_date'), NOW)"
      - cancellation_fee: "MN(K('long_fee_rate') * price_kept, K('long_fee_cap_usd')) if months_held >= K('long_held_months') else (MN(K('mid_fee_rate') * price_kept, K('mid_fee_cap_usd')) if months_held >= K('mid_held_months') else MN(P('cancellation_fee_pct') / 100 * price_kept, P('cancellation_fee_cap_usd')))"
      - fees_owed: "SUM('plan_events', 'service_fee_usd', within_months=1, event_type='plan_decide_claim')"
      - approvals: "COUNT('plan_events', event_type='plan_decide_claim', claim_decision='approved')"
      - admin_charge: "K('many_approvals_charge_usd') if approvals >= K('many_approvals') else (K('one_approval_charge_usd') if approvals == 1 else 0)"
      - open_request_date: "LATEST('plan_requests', 'created_at', date_field='created_at', request_type='cancel_plan', request_status='submitted')"
      - request_age_days: "DAYS(open_request_date, NOW) if open_request_date else 0"
      - handling_rate: "K('slow_handling_rate') if request_age_days >= K('slow_request_days') else (K('late_handling_rate') if request_age_days >= K('late_request_days') else 0)"
      - net_refund: "MX(0, price_kept * (1 - used_share) - cancellation_fee - fees_owed - admin_charge)"
      - result: "int(MN(price_kept, net_refund * (1 + handling_rate)) * 100 + 0.000000001) / 100"
    compute_basis:
      price_kept: "The plan price kept is the plan's one-time charges less any refunds already booked on the plan."
      full_span_days: "where the coverage days run from coverage_start_date through the day before coverage_end_date"
      days_to_end: "the unused coverage days run from the day after the cancellation date through the day before coverage_end_date, never more than the coverage days,"
      start_offset_days: "Where the counting of coverage days starts depends on how the plan was bought: for a plan bought after its item was fulfilled, the coverage days start on the day after the waiting period ends, that is coverage_start_date plus waiting_period_days; for a plan bought on or before its item was fulfilled whose coverage started more than the delivery-wait days after the plan purchase date, the coverage days start on the plan purchase date; for any other plan they start on coverage_start_date;"
      coverage_days: "where the coverage days run from coverage_start_date through the day before coverage_end_date"
      unused_days: "the unused coverage days are never more than the coverage days so counted."
      time_used_share: "A payout weighting is added to the used share, which is one less the unused coverage days divided by the coverage days,"
      settled_total: "by the payout share, that is the repair, replacement, reimbursement and food-loss settlements booked on the plan divided by the limit of liability registered on the plan, zero when no limit is registered:"
      registered_limit: "by the payout share, that is the repair, replacement, reimbursement and food-loss settlements booked on the plan divided by the limit of liability registered on the plan, zero when no limit is registered:"
      payout_share: "by the payout share, that is the repair, replacement, reimbursement and food-loss settlements booked on the plan divided by the limit of liability registered on the plan, zero when no limit is registered:"
      payout_weighting: "the heavy payout weight times the payout share where the payout share is at least the payout threshold share, the light payout weight times the payout share where it is above zero but below that threshold, and nothing where it is zero;"
      used_share: "the used share is never more than one."
      months_held: "The cancellation fee depends on how many whole months the plan has been held since its purchase date:"
      cancellation_fee: "at the long-held months or more, the lesser of the long-held rate times the plan price kept and the long-held cap; at the mid-held months or more but fewer than the long-held months, the lesser of the mid-held rate times the plan price kept and the mid-held cap; for fewer, the standard fee."
      fees_owed: "The claim service fees still owed are the service fees recorded on claim decisions dated less than one whole month before today."
      approvals: "A claim-administration charge comes off the refund by the claims approved on the plan:"
      admin_charge: "the many-approvals charge at the many-approvals count or more, the one-approval charge for exactly one, and nothing for none."
      open_request_date: "A late-handling addition raises the refund where the plan holder's most recent cancellation request on the plan that is still submitted, neither confirmed nor withdrawn, was recorded some days before today:"
      request_age_days: "A late-handling addition raises the refund where the plan holder's most recent cancellation request on the plan that is still submitted, neither confirmed nor withdrawn, was recorded some days before today:"
      handling_rate: "the slow-handling rate at the slow-request days or more, the late-handling rate at the late-request days or more but fewer than the slow-request days, and nothing for fewer days or no such request."
      net_refund: "every charge that comes off is applied next and the result is never below zero;"
      result: "a rate that raises the refund is applied after that; and the refund is held to no more than the plan price kept and rounded down to the cent once at the end."
    factors:
      - id: coverage_count_start
        effect: method
        decides: start_offset_days
        bindings: [start_offset_days]
        ladder:
          - when: "the plan was bought after its item was fulfilled"
            method: "coverage days start on coverage_start_date plus waiting_period_days"
          - when: "the plan was bought on or before its item was fulfilled and coverage started more than K('delivery_wait_days') days after the plan purchase date"
            method: "coverage days start on the plan purchase date"
