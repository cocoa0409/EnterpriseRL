events:
  - type: plan_purchase
    target: plan_holdings
    mutation: create
    meaning: A customer buys a single-item Northgate Protect plan for an item bought at Northgate, or enrolls in Complete Monthly.
    grain: One row per plan purchased.
    fields:
      variant_name: Plan tier bought.
      purchase_date: Date the plan was bought or enrolled.
      covered_order_id: Order containing the covered item; empty for Complete Monthly.
      covered_order_event_id: The order line of the covered item; empty for Complete Monthly.
      covered_item_category: Item category of the covered item; not_applicable for Complete Monthly.
      covered_item_price_usd: Net price paid for the covered item before tax; 0.00 for Complete Monthly.
      bought_after_fulfilment: Whether the plan was bought after the covered item had already been fulfilled.
      payment_method_type: northgate_card or external_card.
      card_account_id: Northgate Card account charged, if any.
    triggers: []
  - type: plan_activate
    target: plan_holdings
    mutation: {transition: {from: purchased, to: active}}
    meaning: Coverage starts.
    grain: One row per transaction.
    fields:
      coverage_start_date: The covered item's fulfilment date, or the enrollment date for Complete Monthly.
      coverage_end_date: Coverage start date plus term_months, the last covered day being the day before; empty for Complete Monthly.
    triggers: []
  - type: plan_cancel_before_start
    target: plan_holdings
    mutation: {transition: {from: purchased, to: canceled}}
    meaning: The plan is canceled before coverage starts because the covered item was canceled or returned unfulfilled.
    grain: One row per transaction.
    fields:
      closed_date: Date of cancellation.
    triggers: []
  - type: plan_fulfil
    target: plan_holdings
    mutation: {transition: {from: active, to: fulfilled}}
    meaning: A single-item plan ends after its item is replaced or reimbursed, or its limit of liability is used up.
    grain: One row per transaction.
    fields:
      closed_date: Date of the settlement that ended the plan.
    triggers: []
  - type: plan_expire
    target: plan_holdings
    mutation: {transition: {from: active, to: expired}}
    meaning: The coverage term ends.
    grain: One row per transaction.
    fields:
      closed_date: The coverage end date.
    triggers: []
  - type: plan_cancel
    target: plan_holdings
    mutation: {transition: {from: active, to: canceled}}
    meaning: The plan holder's confirmed cancellation, or the return of the covered item, ends an active plan.
    grain: One row per transaction.
    fields:
      closed_date: Date of cancellation.
    triggers: []
  - type: plan_lapse
    target: plan_holdings
    mutation: {transition: {from: active, to: lapsed}}
    meaning: Complete Monthly ends because a monthly fee stayed unpaid past the grace period.
    grain: One row per transaction.
    fields:
      closed_date: Day after the grace period ended.
    triggers: []
  - type: plan_charge
    target: plan_events
    meaning: The one-time plan price or a Complete Monthly fee is charged.
    grain: One row per charge per billing period.
    distinguish_by: [charge_type, billing_period_start]
    fields:
      event_date: Charge date.
      amount_usd: Amount charged, positive.
      charge_type: one_time_price or monthly_fee.
      billing_period_start: Purchase date for a one-time price, or the first day of the month the fee pays for.
      payment_method_type: northgate_card or external_card.
      card_account_id: Northgate Card account charged, if any.
    account: plan_premium
    direction: in
    triggers:
      - event: card:card_post_purchase
        when: {payment_method_type: northgate_card}
        map: {card_account_id: card_account_id, amount_usd: amount_usd, event_date: event_date, merchant_type: northgate_protection_plan}
  - type: plan_charge_decline
    target: plan_events
    meaning: A Complete Monthly fee attempt is declined.
    grain: One row per declined attempt.
    distinguish_by: [billing_period_start, event_date]
    fields:
      event_date: Date of the declined attempt.
      amount_usd: Fee attempted, positive.
      billing_period_start: Month the fee was for.
    triggers: []
  - type: plan_refund
    target: plan_events
    meaning: All or part of a plan charge is refunded.
    grain: One row per refund of one charge.
    distinguish_by: [original_event_id, refund_basis]
    fields:
      event_date: Refund date.
      amount_usd: Amount refunded, positive.
      original_event_id: The plan_charge row refunded.
      refund_basis: full_within_window, prorated_unused_days, item_returned or billing_error.
      payment_method_type: Method credited, the method originally charged.
      card_account_id: Northgate Card account credited, if any.
    account: plan_premium
    direction: out
    triggers:
      - event: card:card_post_credit
        when: {payment_method_type: northgate_card}
        map: {card_account_id: card_account_id, amount_usd: amount_usd, event_date: event_date, merchant_type: northgate_protection_plan}
  - type: plan_register_item
    target: plan_events
    meaning: A covered item and its limit of liability are registered on the plan.
    grain: One row per covered item.
    distinguish_by: [covered_order_event_id]
    fields:
      event_date: Registration date.
      amount_usd: Limit of liability added, the item's net price.
      covered_order_event_id: The order line of the covered item.
      covered_item_category: Item category of the covered item.
    account: liability_remaining
    direction: in
    triggers: []
  - type: plan_file_claim
    target: plan_events
    meaning: The plan holder files a claim for one covered item.
    grain: One row per claim filed.
    distinguish_by: [covered_order_event_id, incident_date, claim_type]
    fields:
      event_date: Filing date.
      covered_order_event_id: The order line of the item claimed on.
      claim_type: mechanical_failure, accidental_damage, power_surge, battery_failure or food_spoilage.
      incident_date: Date the failure or accident happened, as reported by the plan holder.
      amount_usd: Food loss claimed for food_spoilage claims; 0.00 otherwise.
    triggers: []
  - type: plan_decide_claim
    target: plan_events
    meaning: The administrator approves or denies a filed claim.
    grain: One row per claim decision.
    distinguish_by: [original_event_id]
    fields:
      event_date: Decision date.
      original_event_id: The plan_file_claim row decided.
      claim_decision: approved, denied_not_covered, denied_manufacturer_warranty, denied_waiting_period, denied_filing_late, denied_claim_limit or denied_outside_term.
      service_fee_usd: Service fee owed for an approved claim; 0.00 otherwise.
    triggers: []
  - type: plan_settle_claim
    target: plan_events
    meaning: An approved claim is settled by repair, replacement, reimbursement or a food-loss payment.
    grain: One row per settlement of one claim.
    distinguish_by: [original_event_id, settlement_method]
    fields:
      event_date: Settlement date.
      amount_usd: Value of the settlement (repair cost, replacement cost or amount paid), positive.
      original_event_id: The plan_file_claim row settled.
      covered_order_event_id: The order line of the item.
      settlement_method: repair, replacement, reimbursement_egift_card or food_loss_payment.
    account: liability_remaining
    direction: out
    triggers:
      - event: gift:gift_issue_card
        when: {settlement_method: reimbursement_egift_card}
        map: {initial_value_usd: amount_usd, issue_date: event_date, issue_reason: protection_claim_reimbursement}

measures:
  - id: plan_msr_approved_claims_12m
    window: Rolling 12 calendar months ending on the filing date of the claim being evaluated, inclusive.
    measure: Count of plan_decide_claim rows on the plan with claim_decision approved and event_date in the window.
  - id: plan_msr_payouts_12m
    window: Rolling 12 calendar months ending on the settlement date being evaluated, inclusive.
    measure: Sum of amount_usd of plan_settle_claim rows on the plan with event_date in the window.
  - id: plan_msr_item_repairs
    window: The whole coverage term of the plan.
    measure: Count of plan_settle_claim rows on the plan with settlement_method repair for the same covered_order_event_id and the same claim_type as the claim being evaluated.
  - id: plan_msr_claims_filed
    window: From the plan purchase date to the cancellation date, inclusive.
    measure: Count of plan_file_claim rows on the plan.
  - id: plan_msr_unused_coverage_days
    window: From the day after the cancellation date through the day before coverage_end_date.
    measure: Number of calendar days in the window (0 when the cancellation date is on or after the day before coverage_end_date); the total coverage days are the days from coverage_start_date through the day before coverage_end_date, and before coverage starts every coverage day is unused.

policies:
  - id: plan_agg_multi_holding
    subject: [plan_purchase]
    rule: >-
      A customer may hold any number of single-item Northgate Protect plans, one for each covered item, but at most one
      Northgate Protect Complete Monthly plan. An item can be covered by only one single-item plan at a time. A single-item
      plan cannot be bought for an order line that already has a single-item plan in purchased or active status. A plan
      that is canceled, expired, fulfilled or lapsed no longer counts.
    eligibility:
      - id: one_plan_per_item
        applies_to: [plan_purchase]
        kind: dedup
        condition: An item can be covered by only one single-item plan at a time.
        evidence_fields: [plan_holdings.covered_order_event_id, plan_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_holdings.covered_order_event_id]
          action_bindings:
            plan_holdings.covered_order_event_id: covered_order_event_id
        dedup_contract:
          table: plan_holdings
          mode: separate_record
          object_bindings: {covered_order_event_id: covered_order_event_id}
          duplicate_filters: {status: [purchased, active]}
          distinct_fields: []
    params:
      max_per_customer: null
      max_complete_monthly_per_customer: 1

  - id: plan_agg_complete_overlap
    subject: [plan_register_item, plan_file_claim]
    rule: >-
      Northgate Protect Complete Monthly and single-item plans are mutually exclusive for any one item. An item that has
      an active single-item plan is not registered on the customer's Complete Monthly plan while that plan is active, and
      becomes registrable on the day after the single-item plan ends. A claim for an item is filed on the plan on which the
      item is registered and never on both. On Complete Monthly the limit of liability is held per item: each registered
      item adds its net price to liability_remaining, and a settlement on one item reduces only that item's share, which is
      that item's net price minus earlier settlements on it.
    eligibility: []

  - id: plan_purchase_eligibility_and_price
    subject: [plan_purchase, plan_charge]
    rule: >-
      A single-item plan covers one item bought from Northgate in store, online or in the app, whose item category is
      listed in the tier's eligible_item_categories and whose net price paid before tax lies between min_item_price_usd and
      max_item_price_usd. Northgate Marketplace items cannot be covered where covers_marketplace_items is false. A
      single-item plan can be bought only within the tier's plan purchase window days after the order date of the covered
      item. Calendar days are added to the order date, the day after the order being day 1, and a purchase on the last day
      still qualifies. Its price is the plan_price_usd of the price_ladder band containing the item's net price, charged
      once at purchase to the plan holder's payment method; the cardholder discount never applies to plan prices.
      Complete Monthly is enrolled by consumer customers with a payment method on file and is charged monthly_fee_usd under
      plan_complete_billing.
      The tier is paid as its billing_cycle states, the purchase window is plan_purchase_window_days, and no item may be covered by more than max_plans_per_item plans at once.
    eligibility:
      - id: purchase_window
        applies_to: [plan_purchase]
        kind: time
        condition: A single-item plan can be bought only within the tier's plan purchase window days after the order date of the covered item.
        evidence_fields: [order_holdings.order_date, order_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.order_id]
          action_bindings:
            order_holdings.order_id: covered_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the order date of the covered item
          anchor_source: order_holdings.order_date
          relation: not_after
          duration_source: variants.plan_purchase_window_days
          unit: calendar_days
          counting_rule: Calendar days are added to the order date, the day after the order being day 1, and a purchase on the last day still qualifies.
          boundary: inclusive
    params:
      per_tier:
        Northgate Protect Standard 2-Year: {price_ladder: "=price_ladder", min_item_price_usd: "=min_item_price_usd", max_item_price_usd: "=max_item_price_usd"}
        Northgate Protect Standard 3-Year: {price_ladder: "=price_ladder", min_item_price_usd: "=min_item_price_usd", max_item_price_usd: "=max_item_price_usd"}
        Northgate Protect Accident 2-Year: {price_ladder: "=price_ladder", min_item_price_usd: "=min_item_price_usd", max_item_price_usd: "=max_item_price_usd"}
        Northgate Protect Accident 3-Year: {price_ladder: "=price_ladder", min_item_price_usd: "=min_item_price_usd", max_item_price_usd: "=max_item_price_usd"}
        Northgate Protect Accident 4-Year: {price_ladder: "=price_ladder", min_item_price_usd: "=min_item_price_usd", max_item_price_usd: "=max_item_price_usd"}
        Northgate Protect Complete Monthly: {price_ladder: "=price_ladder", min_item_price_usd: "=min_item_price_usd", max_item_price_usd: "=max_item_price_usd"}

  - id: plan_coverage_term
    subject: [plan_activate, plan_expire, plan_register_item, plan_cancel_before_start]
    rule: >-
      Coverage of a single-item plan starts on the fulfilment date of the covered item, the date it was picked up,
      delivered or bought at the register, and runs for term_months calendar months: coverage_end_date is the start date
      plus term_months (falling back to the last day of a shorter month) and the last covered day is the day before it. On
      activation the covered item is registered and its net price becomes the limit of liability. If the item is canceled
      or returned before it is fulfilled, the plan is canceled before start with a full refund. Complete Monthly coverage
      starts on the enrollment date; it registers every eligible item fulfilled from Northgate orders placed within
      complete_prior_purchase_lookback_days before enrollment and every eligible item fulfilled while it is active, each on
      its fulfilment date or the enrollment date, whichever is later. Where waiting_period_days is above zero and the plan
      was bought after the item was fulfilled, no claim with an incident date inside the waiting period is covered. A
      single-item plan expires at the end of its term; Complete Monthly runs month to month until canceled or lapsed.
      The start event follows coverage_start_basis.
    eligibility: []
    params:
      per_tier:
        Northgate Protect Standard 2-Year: {term_months: "=term_months", waiting_period_days: "=waiting_period_days"}
        Northgate Protect Standard 3-Year: {term_months: "=term_months", waiting_period_days: "=waiting_period_days"}
        Northgate Protect Accident 2-Year: {term_months: "=term_months", waiting_period_days: "=waiting_period_days"}
        Northgate Protect Accident 3-Year: {term_months: "=term_months", waiting_period_days: "=waiting_period_days"}
        Northgate Protect Accident 4-Year: {term_months: "=term_months", waiting_period_days: "=waiting_period_days"}
        Northgate Protect Complete Monthly: {term_months: "=term_months", waiting_period_days: "=waiting_period_days"}

  - id: plan_claim_eligibility
    subject: [plan_file_claim, plan_decide_claim]
    rule: >-
      A claim is covered only for the perils the tier covers: mechanical and electrical failure from normal use, normal
      wear and power surge on every tier; accidental damage from handling and battery failure where covers_accidental_damage
      and covers_battery_failure are true; food loss on a failed refrigerator or freezer up to food_spoilage_max_usd where
      that amount is above zero. Theft, loss and cosmetic damage are never covered. The incident date must fall between
      coverage_start_date and the day before coverage_end_date, or within the paid month on Complete Monthly, and outside
      any waiting period under plan_coverage_term. A claim must be filed within the tier's claim filing days after the
      incident date. Calendar days are added to the incident date, the day after the incident being day 1, and a claim
      filed on the last day is on time. A claim can be filed only on a plan in active or expired status, the expired case
      covering incidents inside the term filed after it ended. Where defer_to_manufacturer_warranty is true, a mechanical
      failure whose incident date is inside the manufacturer warranty months recorded on the covered order line, counted
      from the item's fulfilment date, is denied as denied_manufacturer_warranty and referred to the manufacturer;
      accidental damage is never deferred. A claim is denied as denied_claim_limit when plan_msr_approved_claims_12m has
      already reached claims_per_rolling_12_months. The administrator decides within claim_decision_business_days business
      days, and the decision states the service fee owed under plan_claim_settlement.
      On every tier covers_mechanical_failure, covers_normal_wear and covers_power_surge are true and covers_theft_or_loss and covers_cosmetic_damage are false. Claims are filed through claim_channels within claim_filing_days_after_incident days.
    eligibility:
      - id: filing_deadline
        applies_to: [plan_file_claim]
        kind: time
        condition: A claim must be filed within the tier's claim filing days after the incident date.
        evidence_fields: [plan_events.incident_date, plan_events.covered_order_event_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [plan_events.covered_order_event_id]
          action_bindings:
            plan_events.covered_order_event_id: covered_order_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the incident date
          anchor_source: plan_events.incident_date
          relation: not_after
          duration_source: variants.claim_filing_days_after_incident
          unit: calendar_days
          counting_rule: Calendar days are added to the incident date, the day after the incident being day 1, and a claim filed on the last day is on time.
          boundary: inclusive
      - id: claimable_status
        applies_to: [plan_file_claim]
        kind: state
        condition: A claim can be filed only on a plan in active or expired status, the expired case covering incidents inside the term filed after it ended.
        evidence_fields: [plan_holdings.status, plan_holdings.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_holdings.plan_id]
          action_bindings:
            plan_holdings.plan_id: plan_id
        state_contract:
          field: plan_holdings.status
          allowed: [active, expired]
    measures: [plan_msr_approved_claims_12m]
    params:
      per_tier:
        Northgate Protect Standard 2-Year: {claims_per_rolling_12_months: "=claims_per_rolling_12_months", covers_accidental_damage: "=covers_accidental_damage", covers_battery_failure: "=covers_battery_failure", food_spoilage_max_usd: "=food_spoilage_max_usd"}
        Northgate Protect Standard 3-Year: {claims_per_rolling_12_months: "=claims_per_rolling_12_months", covers_accidental_damage: "=covers_accidental_damage", covers_battery_failure: "=covers_battery_failure", food_spoilage_max_usd: "=food_spoilage_max_usd"}
        Northgate Protect Accident 2-Year: {claims_per_rolling_12_months: "=claims_per_rolling_12_months", covers_accidental_damage: "=covers_accidental_damage", covers_battery_failure: "=covers_battery_failure", food_spoilage_max_usd: "=food_spoilage_max_usd"}
        Northgate Protect Accident 3-Year: {claims_per_rolling_12_months: "=claims_per_rolling_12_months", covers_accidental_damage: "=covers_accidental_damage", covers_battery_failure: "=covers_battery_failure", food_spoilage_max_usd: "=food_spoilage_max_usd"}
        Northgate Protect Accident 4-Year: {claims_per_rolling_12_months: "=claims_per_rolling_12_months", covers_accidental_damage: "=covers_accidental_damage", covers_battery_failure: "=covers_battery_failure", food_spoilage_max_usd: "=food_spoilage_max_usd"}
        Northgate Protect Complete Monthly: {claims_per_rolling_12_months: "=claims_per_rolling_12_months", covers_accidental_damage: "=covers_accidental_damage", covers_battery_failure: "=covers_battery_failure", food_spoilage_max_usd: "=food_spoilage_max_usd"}

  - id: plan_claim_settlement
    subject: [plan_settle_claim, plan_fulfil, plan_decide_claim]
    rule: >-
      An approved claim is settled by repair where repair_first is true and the repair estimate is no more than
      replacement_threshold_pct percent of the item's net price; otherwise by replacement with a new item under
      replacement_basis, and where no such item is available by reimbursement through reimbursement_method of the item's
      net price minus earlier settlements on that item. Once plan_msr_item_repairs has reached no_lemon_repairs, the next
      approved claim for the same failure on that item is settled by replacement whatever the estimate. Major appliances,
      fitness equipment, furniture and TVs with a screen of at least in_home_tv_min_screen_inches, in the tier's
      in_home_service_categories, are repaired in the home; other items go to depot repair with shipping under
      depot_shipping. The service fee is taken from the tier's service_fee_ladder band containing the item's net price and
      is charged only on the claim types in service_fee_claim_types; it is collected before the repair or replacement is
      released and never reduces liability. Each settlement books its value against liability_remaining, and a settlement
      never exceeds the item's remaining share of the limit of liability. On Complete Monthly no settlement may take
      plan_msr_payouts_12m above complete_annual_payout_cap_usd. Where plan_ends_on_replacement is true, a replacement or
      reimbursement, or a settlement that leaves liability_remaining at zero, ends the plan as fulfilled on the settlement
      date. A reimbursement is issued as a Northgate eGift Card.
      The limit of liability of each item follows liability_limit_basis and every reimbursement follows reimbursement_basis; a TV's screen size is read from the covered line's item description.
    eligibility: []
    measures: [plan_msr_item_repairs, plan_msr_payouts_12m]
    params:
      per_tier:
        Northgate Protect Standard 2-Year: {service_fee_ladder: "=service_fee_ladder", service_fee_claim_types: "=service_fee_claim_types", replacement_threshold_pct: "=replacement_threshold_pct"}
        Northgate Protect Standard 3-Year: {service_fee_ladder: "=service_fee_ladder", service_fee_claim_types: "=service_fee_claim_types", replacement_threshold_pct: "=replacement_threshold_pct"}
        Northgate Protect Accident 2-Year: {service_fee_ladder: "=service_fee_ladder", service_fee_claim_types: "=service_fee_claim_types", replacement_threshold_pct: "=replacement_threshold_pct"}
        Northgate Protect Accident 3-Year: {service_fee_ladder: "=service_fee_ladder", service_fee_claim_types: "=service_fee_claim_types", replacement_threshold_pct: "=replacement_threshold_pct"}
        Northgate Protect Accident 4-Year: {service_fee_ladder: "=service_fee_ladder", service_fee_claim_types: "=service_fee_claim_types", replacement_threshold_pct: "=replacement_threshold_pct"}
        Northgate Protect Complete Monthly: {service_fee_ladder: "=service_fee_ladder", service_fee_claim_types: "=service_fee_claim_types", replacement_threshold_pct: "=replacement_threshold_pct"}

  - id: plan_cancellation_refund
    subject: [plan_cancel, plan_refund, plan_cancel_before_start]
    rule: >-
      Cancelling a plan is the plan holder's own decision, recorded in plan_requests and confirmed by the plan holder;
      the return of the covered item to Northgate cancels its single-item plan without a separate request. Each plan
      charge is refunded at most once, and the refund goes to the method that paid it. When the covered item is returned
      or canceled the refund is the full plan price with basis item_returned, whatever the timing. Otherwise a full refund
      applies only when the cancellation date is no later than the plan purchase date plus the tier's full refund window
      days, and only when plan_msr_claims_filed is zero. Calendar days are added to the plan purchase date, the day after the
      purchase being day 1, and a cancellation on the last day still qualifies. Outside that, a one-time plan refunds the
      plan price x plan_msr_unused_coverage_days / total coverage days, less a cancellation fee equal to the lesser of
      cancellation_fee_pct of the plan price and cancellation_fee_cap_usd, rounded down to the cent and never below zero,
      with basis prorated_unused_days. No cancellation refund is paid after a replacement or reimbursement settlement on
      the plan. Complete Monthly may be canceled at any time effective at once, and the current month's fee is not refunded
      outside the full-refund window. A charge made in error is refunded in full as billing_error.
      The item-return refund follows item_return_refund, proration follows prorated_refund_basis and refund_rounding, and refund_after_settled_claim is false on every tier.
    eligibility:
      - id: full_refund_window
        applies_to: [plan_refund]
        kind: time
        condition: Otherwise a full refund applies only when the cancellation date is no later than the plan purchase date plus the tier's full refund window days, and only when plan_msr_claims_filed is zero.
        evidence_fields: [plan_holdings.purchase_date, plan_holdings.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_holdings.plan_id]
          action_bindings:
            plan_holdings.plan_id: plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan purchase date
          anchor_source: plan_holdings.purchase_date
          relation: not_after
          duration_source: variants.full_refund_window_days
          unit: calendar_days
          counting_rule: Calendar days are added to the plan purchase date, the day after the purchase being day 1, and a cancellation on the last day still qualifies.
          boundary: inclusive
      - id: refund_once
        applies_to: [plan_refund]
        kind: dedup
        condition: Each plan charge is refunded at most once, and the refund goes to the method that paid it.
        evidence_fields: [plan_events.original_event_id, plan_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_events.original_event_id]
          action_bindings:
            plan_events.original_event_id: original_event_id
        dedup_contract:
          table: plan_events
          mode: separate_record
          object_bindings: {original_event_id: original_event_id}
          duplicate_filters: {event_type: [plan_refund]}
          distinct_fields: []
    measures: [plan_msr_claims_filed, plan_msr_unused_coverage_days]
    params:
