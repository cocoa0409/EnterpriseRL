      drop_price: "a line that carries a Northgate price-drop adjustment and no item promotion is registered from the lowered Northgate price that adjustment matched;"
      starting_price: "The registered limit starts from the price it takes to replace the item at Northgate where the covered order line shows one: a line that carries an item promotion is registered from its selling price per unit before promotions; a line that carries a Northgate price-drop adjustment and no item promotion is registered from the lowered Northgate price that adjustment matched; any other line keeps the recorded covered item price."
      local_matches: "Competitor price-match adjustments booked on the covered order line come off the registered limit, per unit bought:"
      all_matches: "Competitor price-match adjustments booked on the covered order line come off the registered limit, per unit bought:"
      match_reduction: "the whole of a match to a local competitor's advertised price, one half of a match to an online competitor's price, and nothing where the line carries no competitor price match."
      general_lines_total: "The order's line composition is read once and used throughout: its merchandise lines are all lines of the covered order, whatever their category; its device lines are the merchandise lines in the covered item's category with the same return class as the covered order line, the covered order line included; and its accessory lines are the merchandise lines in the covered item's category whose return class is general merchandise, counted as accessories only where the covered order line's own return class is not general merchandise and every one of them has a line amount, the net price paid for the line before tax, below the lowest min_item_price_usd of the single-item tiers, so that no line that could carry a plan of its own is ever an accessory of another item; a general-merchandise line of the category at or above that amount may have been bought for its own sake, so the order then counts no accessories at all."
      accessory_amount: "The order's line composition is read once and used throughout: its merchandise lines are all lines of the covered order, whatever their category; its device lines are the merchandise lines in the covered item's category with the same return class as the covered order line, the covered order line included; and its accessory lines are the merchandise lines in the covered item's category whose return class is general merchandise, counted as accessories only where the covered order line's own return class is not general merchandise and every one of them has a line amount, the net price paid for the line before tax, below the lowest min_item_price_usd of the single-item tiers, so that no line that could carry a plan of its own is ever an accessory of another item; a general-merchandise line of the category at or above that amount may have been bought for its own sake, so the order then counts no accessories at all."
      accessory_allowance: "An accessory allowance is added to the registered limit, shared equally among the device lines of the order: the whole accessory amount for a computer, tablet or mobile phone with accessories, one half of it for an item in any other category with accessories, and nothing without accessories."
      order_program: "Delivery charges paid on the covered order are added to the registered limit by fulfilment program, shared equally among all merchandise lines of the order:"
      large_item_fees: "the large-item delivery share of the large-item delivery and haul-away fees charged on a Northgate Scheduled Large-Item Delivery order,"
