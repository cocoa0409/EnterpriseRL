      delivery_added: "Delivery charges paid on the covered order are added to the registered limit by fulfilment program, shared equally among all merchandise lines of the order: the large-item delivery share of the large-item delivery and haul-away fees charged on a Northgate Scheduled Large-Item Delivery order, the parcel delivery share of the same-day delivery, shipping and express delivery fees charged on a Northgate Same-Day Delivery or Northgate Ship to Home order, and nothing on any other order."
      result: "Where several of these apply, the starting price is settled first, every amount that comes off or is added is then applied to it, and the registered limit is rounded half up to the cent once at the end."
    factors:
      - id: replacement_price_basis
        effect: method
        decides: starting_price
        bindings: [line_unit_price, line_promo, drop_price, starting_price]
        ladder:
          - when: "the covered order line carries an item promotion"
            method: "the line's selling price per unit before promotions"
          - when: "the covered order line carries a Northgate price-drop adjustment and no item promotion"
            method: "the lowered Northgate price that adjustment matched"
          - when: "otherwise"
            method: "the covered item price recorded on the plan"
        baseline:
          starting_price: "recorded_price"
        evidence: [cross_category]
        cross_difficulty: order
      - id: competitor_match_reduction
        effect: parameter
        decides: match_reduction
        bindings: [local_matches, all_matches, match_reduction]
        ladder:
          - when: "the covered order line carries a match to a local competitor's advertised price"
            value: "K('local_match_share') of the match amount per unit bought"
          - when: "the covered order line carries a match to an online competitor's price only"
            value: "K('online_match_share') of the match amount per unit bought"
          - when: "otherwise"
            value: "0"
        baseline:
          match_reduction: "0"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: accessory_allowance_rule
        effect: parameter
        decides: accessory_allowance
        bindings: [line_class, device_lines, general_lines_total, accessory_price_top, accessory_amount, accessory_allowance]
        ladder:
          - when: "the covered item is a computer, tablet or mobile phone whose line is not general merchandise and the covered order carries accessory lines in its category"
            value: "K('device_accessory_share') of the accessory amount, shared among the device lines"
          - when: "the covered item is in any other category, its line is not general merchandise, and such accessory lines exist"
            value: "K('other_accessory_share') of the accessory amount, shared among the device lines"
          - when: "otherwise"
            value: "0"
        baseline:
          accessory_allowance: "0"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: delivery_charge_share
        effect: parameter
        decides: delivery_added
        bindings: [merchandise_lines, order_program, large_item_fees, parcel_fees, delivery_added]
        ladder:
          - when: "the covered order is a Northgate Scheduled Large-Item Delivery order"
            value: "K('large_item_delivery_share') of its large-item delivery and haul-away fees, shared among all merchandise lines of the order"
          - when: "the covered order is a Northgate Same-Day Delivery or Northgate Ship to Home order"
            value: "K('parcel_delivery_share') of its same-day delivery, shipping and express delivery fees, shared among all merchandise lines of the order"
          - when: "otherwise"
            value: "0"
        baseline:
          delivery_added: "0"
        evidence: [cross_category, history]
        cross_difficulty: order
    baseline:
