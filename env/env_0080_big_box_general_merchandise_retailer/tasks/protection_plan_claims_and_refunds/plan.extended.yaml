category: plan
display_name: Northgate Protect Protection Plans (administered by Keystone Protection Services)

binding:
  holding_table: plan_holdings
  event_tables: [plan_events]
  intake_tables: [plan_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_paid_usd: plan_premium, liability_remaining_usd: liability_remaining}

lifecycle:
  states: [purchased, active, fulfilled, expired, canceled, lapsed]
  transitions:
    - {from: purchased, to: active, by: system, means: Coverage starts on the coverage start date, the fulfilment date of the covered item for single-item plans or the enrollment date for Complete Monthly.}
    - {from: purchased, to: canceled, by: system, means: The plan is canceled before coverage starts because the covered item was canceled or returned before fulfilment.}
    - {from: active, to: fulfilled, by: system, means: A single-item plan ends because the item was replaced or reimbursed, or the limit of liability was exhausted.}
    - {from: active, to: expired, by: system, means: The coverage term ends.}
    - {from: active, to: canceled, by: user, means: The plan holder cancels the plan, or the covered item is returned, and the cancellation refund is evaluated.}
    - {from: active, to: lapsed, by: system, means: A Complete Monthly plan ends because its monthly fee went unpaid past the payment grace period.}

accounts:
  - key: plan_premium
    unit: USD
    meaning: Net plan price or monthly fees paid for the plan; charges book in and refunds book out.
  - key: liability_remaining
    unit: USD
    meaning: Remaining limit of liability; registering a covered item books its purchase price in and each claim settlement books its value out.

parameter_schema:
  term_months: Coverage term in calendar months (1 for Complete Monthly, which renews monthly)
  billing_cycle: 'How the plan is paid: one_time at purchase or monthly'
  monthly_fee_usd: Monthly fee, USD; not_applicable for one-time plans
  price_ladder: One-time plan price by covered item price band, list of [band_min_usd, band_max_usd, plan_price_usd];
    the item price is the net price paid for the item before tax; not_applicable for Complete Monthly
  min_item_price_usd: Lowest net item price a plan can cover, USD
  max_item_price_usd: Highest net item price a plan can cover, USD
  eligible_item_categories: Item categories the tier can cover, list
  covers_marketplace_items: Whether Northgate Marketplace items can be covered, boolean (Fulfilled by Northgate
    items included only where true)
  plan_purchase_window_days: Calendar days after the covered item's purchase date within which a single-item plan
    may be bought
  complete_prior_purchase_lookback_days: For Complete Monthly, calendar days before enrollment within which earlier
    Northgate purchases are covered; not_applicable for single-item plans
  waiting_period_days: Calendar days after coverage starts during which no claim is accepted when the plan was bought
    after the item was fulfilled (0 means none)
  coverage_start_basis: Event that starts coverage
  covers_mechanical_failure: Whether mechanical and electrical failures from normal use are covered, boolean
  covers_normal_wear: Whether failures caused by normal wear and tear are covered, boolean
  covers_power_surge: Whether damage from a power surge is covered, boolean
  covers_accidental_damage: Whether accidental damage from handling (drops, spills, cracked screens) is covered,
    boolean
  covers_battery_failure: Whether a rechargeable battery holding less than 80 percent of original capacity is covered,
    boolean
  covers_theft_or_loss: Whether theft or loss is covered, boolean
  covers_cosmetic_damage: Whether cosmetic damage that does not affect function is covered, boolean
  defer_to_manufacturer_warranty: Whether a mechanical failure inside the manufacturer warranty period is referred
    to the manufacturer instead of being covered, boolean
  food_spoilage_max_usd: Most paid for food lost when a covered refrigerator or freezer fails, per claim, USD
  claims_per_rolling_12_months: Most approved claims in any rolling 12 months on the plan; no_limit means unlimited
  liability_limit_basis: 'Limit of liability per covered item: the net price paid for the item before tax'
  complete_annual_payout_cap_usd: Most paid on all claims in a rolling 12 months on Complete Monthly, USD; not_applicable
    for single-item plans
  service_fee_ladder: Service fee per approved claim by covered item price band, list of [band_min_usd, band_max_usd,
    fee_usd]
  service_fee_claim_types: Claim types on which the service fee is charged, list
  repair_first: Whether a repairable item is repaired before replacement is considered, boolean
  replacement_threshold_pct: Repair estimate, as percent of the item's net price, above which the item is replaced
    instead of repaired
  no_lemon_repairs: Number of completed repairs for the same failure after which the next qualifying failure is
    settled by replacement
  replacement_basis: 'What a replacement provides: a new item of like kind and quality with equal or better features,
    not exceeding the item''s net price'
  reimbursement_method: How a claim is reimbursed when no replacement is available
  reimbursement_basis: 'Amount reimbursed: the covered item''s net price minus all earlier settlements on that item'
  plan_ends_on_replacement: Whether a single-item plan is fulfilled and ends once its item is replaced or reimbursed,
    boolean (Complete Monthly continues for other items)
  in_home_service_categories: Item categories repaired in the home; other categories go to depot repair
  in_home_tv_min_screen_inches: Smallest TV screen size repaired in the home; smaller TVs go to depot repair
  depot_shipping: Who pays shipping for depot repair
  claim_filing_days_after_incident: Calendar days after the incident date within which a claim must be filed
  claim_decision_business_days: Business days within which the administrator decides a filed claim
  claim_channels: Channels in which a claim can be filed, list
  full_refund_window_days: Calendar days after plan purchase or enrollment within which cancelling refunds the full
    price when no claim has been filed
  prorated_refund_basis: 'Basis of a refund outside the full-refund window: unused_days refunds price x (coverage
    days remaining / total coverage days); current_month_not_refunded means no refund'
  cancellation_fee_pct: Cancellation fee as percent of the plan price, applied to prorated refunds (the lesser of
    this and the cap)
  cancellation_fee_cap_usd: Most charged as a cancellation fee, USD
  refund_after_settled_claim: Whether a cancellation refund is paid after a replacement or reimbursement settlement
    on the plan, boolean
  item_return_refund: 'Refund when the covered item is returned to Northgate: the full plan price'
  refund_rounding: Rounding of a prorated refund
  complete_payment_grace_days: Calendar days after a declined monthly fee before Complete Monthly lapses; not_applicable
    for one-time plans
  complete_claims_during_grace: Whether claims are accepted on Complete Monthly while a fee is unpaid within the
    grace period, boolean
  max_plans_per_item: Most plans that can cover one item at the same time
