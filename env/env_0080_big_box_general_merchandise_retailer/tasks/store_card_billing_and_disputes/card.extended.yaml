    decides: reinstated
    bindings:
    - latest_purchase_int
    - latest_min_charge
    - reinstated
    ladder:
    - when: the correct part is above zero and that statement charged purchase interest
      value: the correct part times the tier's purchase APR divided by 100 and by 365, times the days from the notice date through that statement's closing date, both counted, with no days when the notice came after that closing date, rounded half up to the cent
    - when: the correct part is above zero and that statement charged no purchase interest but a minimum interest charge
      value: P('minimum_interest_charge_usd')
    - when: otherwise
      value: '0'
    baseline:
      reinstated: '0'
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
