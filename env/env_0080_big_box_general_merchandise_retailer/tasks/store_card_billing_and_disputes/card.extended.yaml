    payment_hold: 'The payment clearing hold follows the account''s payment record and the payments credited in the last month: where the payment record is not clean, every payment credited in the last month is held, less the returned payments posted in that month, never less than zero; where it is clean, the payments credited in the last month that were mailed, or that were made online, in the app, by phone or by automatic payment through a channel that no payment in the last 12 months had used before that month, are held; in every other case nothing is held. A held payment is released once a month has passed from its credit date.'
    disputes_opened: the disputed amounts opened exceeding the amounts that have left dispute status
    disputes_left: the disputed amounts opened exceeding the amounts that have left dispute status
    provisional_posted: and a provisional dispute credit has posted on the account, the amount still under dispute is held
    rebilled: the hold is the provisional dispute credits posted less those already re-billed
    cardholder_resolved: less the amounts of disputes resolved for the cardholder
    dispute_hold: 'The dispute hold follows the disputes on the account: where a dispute stands open, the disputed amounts opened exceeding the amounts that have left dispute status, and a provisional dispute credit has posted on the account, the amount still under dispute is held; where no dispute stands open, the hold is the provisional dispute credits posted less those already re-billed and less the amounts of disputes resolved for the cardholder, never less than zero; in every other case nothing is held.'
    latest_stmt: 'The residual interest hold follows the most recent statement: where it charged purchase interest and the payments recorded against it reach its new balance, the hold is its new balance times the tier''s purchase APR divided by 100 and by 365, times the days from the day after its closing date to the day before the most recent payment recorded against it, both counted, rounded half up to the cent and never below the tier''s minimum interest charge; where it charged purchase interest and the payments recorded against it fall short of its new balance, the hold is that unpaid part times the same daily rate, times the days from the day after its closing date through today, rounded half up to the cent and never below the tier''s minimum interest charge; in every other case nothing is held.'
    latest_nb: 'The residual interest hold follows the most recent statement: where it charged purchase interest and the payments recorded against it reach its new balance, the hold is its new balance times the tier''s purchase APR divided by 100 and by 365, times the days from the day after its closing date to the day before the most recent payment recorded against it, both counted, rounded half up to the cent and never below the tier''s minimum interest charge; where it charged purchase interest and the payments recorded against it fall short of its new balance, the hold is that unpaid part times the same daily rate, times the days from the day after its closing date through today, rounded half up to the cent and never below the tier''s minimum interest charge; in every other case nothing is held.'
    latest_int: 'The residual interest hold follows the most recent statement: where it charged purchase interest and the payments recorded against it reach its new balance, the hold is its new balance times the tier''s purchase APR divided by 100 and by 365, times the days from the day after its closing date to the day before the most recent payment recorded against it, both counted, rounded half up to the cent and never below the tier''s minimum interest charge; where it charged purchase interest and the payments recorded against it fall short of its new balance, the hold is that unpaid part times the same daily rate, times the days from the day after its closing date through today, rounded half up to the cent and never below the tier''s minimum interest charge; in every other case nothing is held.'
    latest_paid: A payment is recorded against the statement whose balance it pays, and the payments recorded against a statement are all the payment entries that carry that statement's closing date.
    latest_pay_date: 'The residual interest hold follows the most recent statement: where it charged purchase interest and the payments recorded against it reach its new balance, the hold is its new balance times the tier''s purchase APR divided by 100 and by 365, times the days from the day after its closing date to the day before the most recent payment recorded against it, both counted, rounded half up to the cent and never below the tier''s minimum interest charge; where it charged purchase interest and the payments recorded against it fall short of its new balance, the hold is that unpaid part times the same daily rate, times the days from the day after its closing date through today, rounded half up to the cent and never below the tier''s minimum interest charge; in every other case nothing is held.'
    residual_hold: 'The residual interest hold follows the most recent statement: where it charged purchase interest and the payments recorded against it reach its new balance, the hold is its new balance times the tier''s purchase APR divided by 100 and by 365, times the days from the day after its closing date to the day before the most recent payment recorded against it, both counted, rounded half up to the cent and never below the tier''s minimum interest charge; where it charged purchase interest and the payments recorded against it fall short of its new balance, the hold is that unpaid part times the same daily rate, times the days from the day after its closing date through today, rounded half up to the cent and never below the tier''s minimum interest charge; in every other case nothing is held.'
    mc_out_1: 'A merchant credit names the purchase it credits by that purchase''s reference, and an unreferenced merchant credit is one whose purchase reference is empty. The merchant credit hold follows the account''s payment record and the merchant credits posted in the last month: where the payment record is not clean, every merchant credit posted in the last month by a merchant other than Northgate is held; where it is clean and an unreferenced merchant credit was posted in the last month by a merchant other than Northgate, those unreferenced credits are held; in every other case nothing is held. A held merchant credit is released once a month has passed from its posting date.'
    mc_blind_1: 'A merchant credit names the purchase it credits by that purchase''s reference, and an unreferenced merchant credit is one whose purchase reference is empty. The merchant credit hold follows the account''s payment record and the merchant credits posted in the last month: where the payment record is not clean, every merchant credit posted in the last month by a merchant other than Northgate is held; where it is clean and an unreferenced merchant credit was posted in the last month by a merchant other than Northgate, those unreferenced credits are held; in every other case nothing is held. A held merchant credit is released once a month has passed from its posting date.'
    credit_hold: 'A merchant credit names the purchase it credits by that purchase''s reference, and an unreferenced merchant credit is one whose purchase reference is empty. The merchant credit hold follows the account''s payment record and the merchant credits posted in the last month: where the payment record is not clean, every merchant credit posted in the last month by a merchant other than Northgate is held; where it is clean and an unreferenced merchant credit was posted in the last month by a merchant other than Northgate, those unreferenced credits are held; in every other case nothing is held. A held merchant credit is released once a month has passed from its posting date.'
    result: The refund is the credit balance less every amount this rule holds, never less than zero, kept to the cent.
  factors:
  - id: payment_clearing
    effect: parameter
    decides: payment_hold
    bindings:
    - pay_1
    - ret_1
    - mail_1
    - n12_online
    - n1_online
    - p1_online
    - n12_app
    - n1_app
    - p1_app
    - n12_phone
    - n1_phone
    - p1_phone
    - n12_autopay
    - n1_autopay
    - p1_autopay
    - payment_hold
    ladder:
    - when: the payment record is not clean
      value: every payment credited in the last month is held, less the returned payments posted in that month
    - when: it is clean
      value: the payments credited in the last month that were mailed, or that were made online, in the app, by phone or by automatic payment through a channel that no payment in the last 12 months had used before that month, are held
    - when: otherwise
      value: '0'
    baseline:
      payment_hold: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: open_dispute_hold
    effect: parameter
    decides: dispute_hold
    bindings:
    - disputes_opened
    - disputes_left
    - provisional_posted
    - rebilled
    - cardholder_resolved
    - dispute_hold
    ladder:
    - when: a dispute stands open, the disputed amounts opened exceeding the amounts that have left dispute status, and a provisional dispute credit has posted on the account
      value: the amount still under dispute
    - when: no dispute stands open
      value: the provisional dispute credits posted less those already re-billed and less the amounts of disputes resolved for the cardholder, never less than zero
    - when: otherwise
      value: '0'
    baseline:
      dispute_hold: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: merchant_credit_hold
    effect: parameter
    decides: credit_hold
    bindings:
    - mc_out_1
    - mc_blind_1
    - credit_hold
    ladder:
    - when: the payment record is not clean
      value: every merchant credit posted in the last month by a merchant other than Northgate is held
    - when: it is clean and an unreferenced merchant credit was posted in the last month by a merchant other than Northgate
      value: those unreferenced credits are held
    - when: otherwise
      value: '0'
    baseline:
      credit_hold: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: residual_interest_hold
    effect: method
    decides: residual_hold
    bindings:
    - latest_paid
    - latest_stmt
    - latest_nb
    - latest_int
    - latest_pay_date
    - residual_hold
    ladder:
    - when: it charged purchase interest and the payments recorded against it reach its new balance
      method: its new balance times the tier's purchase APR divided by 100 and by 365, times the days from the day after its closing date to the day before the most recent payment recorded against it, both counted, rounded half up to the cent and never below the tier's minimum interest charge
    - when: it charged purchase interest and the payments recorded against it fall short of its new balance
      method: that unpaid part times the same daily rate, times the days from the day after its closing date through today, rounded half up to the cent and never below the tier's minimum interest charge
    - when: otherwise
      method: nothing is held
    baseline:
      residual_hold: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: Before any hold this rule sets, the credit balance refund is the whole credit balance.
