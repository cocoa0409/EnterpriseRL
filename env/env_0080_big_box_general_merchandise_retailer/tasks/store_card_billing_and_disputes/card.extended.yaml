  factors:
  - id: conduct_percentage
    effect: parameter
    decides: inc_pct
    bindings:
    - late_fees_12
    - returns_12
    - inc_pct
    ladder:
    - when: no late fee and no returned payment were recorded in that time
      value: K('clean_increase_pct')
    - when: exactly one returned payment and no more than two late fees were recorded in that time
      value: K('returned_increase_pct')
    - when: more than two late fees or more than one returned payment were recorded in that time
      value: '0'
    - when: otherwise
      value: K('std_increase_pct')
    baseline:
      inc_pct: K('std_increase_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: usage_line_addition
    effect: method
    decides: use_add
    bindings:
    - line_use
    - top_statement
    - use_payments_12
    - use_add
    ladder:
    - when: the use is at least 70 percent
      method: 5 percent of the highest new balance shown on any statement of the account
    - when: the use is below 10 percent
      method: 5 percent of the payments credited on the account over the last 12 months less the payments returned unpaid in that time
    - when: otherwise
      method: none
    baseline:
      use_add: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: membership_line_addition
    effect: parameter
    decides: member_add
    bindings:
    - member_tier
    - member_add
    ladder:
    - when: a Northgate+ Annual or Northgate+ Business membership
      value: K('member_major_usd')
    - when: any other Northgate+ membership
      value: K('member_other_usd')
    - when: otherwise
      value: '0'
    baseline:
      member_add: '0'
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: tenure_line_addition
    effect: parameter
    decides: tenure_add
    bindings:
    - months_open
    - tenure_add
    ladder:
    - when: 36 months or more
      value: K('tenure_long_usd')
    - when: 18 months up to 35 months
      value: K('tenure_mid_usd')
    - when: otherwise
      value: '0'
    baseline:
      tenure_add: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: purchase_volume_addition
    effect: parameter
    decides: volume_add
    bindings:
    - purchases_12
    - merchant_credits_12
    - dispute_credits_12
    - net_purchases
    - volume_add
    ladder:
    - when: net purchases of 6,000 dollars or more
      value: K('volume_high_add_usd')
    - when: net purchases of 2,500 dollars or more but below 6,000 dollars
      value: K('volume_mid_add_usd')
    - when: otherwise
      value: '0'
    baseline:
      volume_add: '0'
    evidence:
    - history
    cross_difficulty: null
