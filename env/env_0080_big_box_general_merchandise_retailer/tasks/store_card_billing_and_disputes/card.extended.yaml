- id: card_ext_catch_up_payment
  base_policy_refs:
  - card_evt_payments
  overwrite: []
  trigger: on_request
  subject:
  - card_post_payment
  computes: amount_usd
  target_tool: make_card_payment_5ec32b69
  params:
    late_band_days: 30
    fee_window_months: 2
    mail_hold_months: 1
  rule: 'The catch-up payment is the payment a cardholder makes to bring a past-due Northgate Card account back to good standing; the cardholder makes it in person through the secure payment line, entering there the bank account it is paid from, because representatives never take bank or card numbers. It is measured on the missed statement, which is the statement for which the most recent late fee on the account was recorded, and of two late fees posted the same day the one entered first in the account history; the catch-up payment is recorded against the missed statement. The catch-up payment is not fixed until the most recent duplicate-posting dispute on the account, when it still stands open with its source a Northgate order on a tier without provisional dispute credits and two or more postings carrying that order''s reference exceed what the order record charged, has its final credit posted. Each payment counts against the statement whose balance it pays, and a returned payment counts against the same statement as the payment it returns. The minimum payment due on the missed statement is the minimum printed on it, less the amount the base rule excludes while a billing-error dispute stands open: where exactly one billing-error dispute is recorded on a transaction the missed statement first showed, it still stands open with no resolution entry referring back to it and its notice was received after that statement''s closing date, the minimum payment due is worked out in two steps, first the tier''s minimum payment percentage of the disputed amount, rounded half up to the cent, is taken off the printed minimum, then where what remains is below the tier''s minimum payment floor the floor is used instead, never more than the printed minimum; in every other case the minimum payment due is the printed minimum. While the missed statement carries two or more billing-error disputes on transactions it first showed, whether resolved or not, the catch-up payment is referred to the disputes team: no catch-up payment is booked and the customer is handed over to a human representative because no published policy sets the payment in this conversation. The missed statement is met when its minimum payment due is met in full by the payments recorded against it that were not returned unpaid; while it is met, nothing is owed under this rule and the catch-up payment is nothing. The days since the missed due date are the calendar days from the missed statement''s payment due date to today. The catch-up payment is the minimum payment due on the missed statement less the payments recorded against that statement, and never less than zero. The shortfall on the missed statement follows what happened to the payments recorded against it: where one of them was returned unpaid, the shortfall is its minimum payment due less those payments net of the returned amounts; where none was returned and one or more of them were mailed and credited in the last month, a month counted back from today to the same calendar day, those mailed payments count only once they clear a month after they were credited, so the shortfall is the minimum payment due less the other payments recorded against it; in every other case the shortfall is the minimum payment due less the payments recorded against it; a shortfall is never less than zero. The amount owed today is read from the account history: purchases and cash advances, interest, fees, returned payments, re-billed dispute credits and credit balance refunds raise it; payments, merchant credits, dispute credits, fee reversals and reward credits lower it; the amounts still under dispute are the disputed amounts of the disputes opened on the account less the amounts that have left dispute status. The over-limit restoration follows the amount owed today less the amounts still under dispute: where that amount is above the credit limit, the over-limit restoration is the excess; where it is within the credit limit but leaves less room than the tier''s minimum payment floor, it is that floor less the room left; in every other case there is none. The standing late fee is the late fee recorded for the missed statement less every reversal already posted against it, never less than zero. The restoration fee follows the days since the missed due date and the standing late fee: where 30 or more days have passed and the standing late fee is above zero, it is every late fee recorded on the account in the last two months less the fee reversals posted in that time, never less than zero, a month counted back from today to the same calendar day; where 1 to 29 days have passed and the standing late fee is above zero, it is the standing late fee; in every other case there is none. The cycle-since-miss restoration follows the days since the missed due date and the statements closed since the miss: where 30 or more days have passed, it is the minimum payment due on the most recent statement; where 1 to 29 days have passed and the most recent statement closed after the missed statement''s payment due date, it is the purchase interest charged on that most recent statement; in every other case there is none. While the missed statement is not met, the catch-up payment adds together every amount this rule sets, each already in whole cents, and the total is kept to the cent.'
  prerequisite:
  - problem: card_ext_duplicate_final_credit
    kind: value_input
    gate: owed_net
    form: state
    policy_source: The catch-up payment is not fixed until the most recent duplicate-posting dispute on the account, when it still stands open with its source a Northgate order on a tier without provisional dispute credits and two or more postings carrying that order's reference exceed what the order record charged, has its final credit posted.
    condition: The latest card_open_dispute entry with dispute_reason duplicate, when no card_resolve_dispute entry refers back to it, its source_record_id is a Northgate order on a tier without provisional credit and two or more card_post_purchase entries carry that order with a total above the order's amount_paid_usd plus the refunds its order_events book, has a card_dispute_credit entry with credit_stage final referring back to it.
    resolved_by: settle_duplicate_dispute_b93aba52
    effect: The final credit lowers the amount owed and the resolution takes the disputed amount out of dispute status, so owed_net (amount owed less amounts still under dispute) falls by the final credit less the released amount, which moves the over-limit restoration.
  cross_category: []
  compute:
  - cure_stmt: LATEST('card_events','statement_date', date_field='event_date', event_type='card_assess_fee', fee_type='late_payment')
  - cure_min: LATEST('card_events','minimum_due_usd', date_field='event_date', event_type='card_issue_statement', statement_date=cure_stmt) or 0
  - cure_due: LATEST('card_events','payment_due_date', date_field='event_date', event_type='card_issue_statement', statement_date=cure_stmt)
  - cure_paid: SUM('card_events','amount_usd', event_type='card_post_payment', statement_date=cure_stmt)
  - days_since_due: DAYS(cure_due, NOW) if cure_due else 0
  - cure_returned: SUM('card_events','amount_usd', event_type='card_return_payment', statement_date=cure_stmt)
  - s_disp_n: COUNT('card_events', event_type='card_open_dispute', dispute_track='billing_error', statement_date=cure_stmt)
  - s_disp_id: LATEST('card_events','card_event_id', date_field='event_date', event_type='card_open_dispute', dispute_track='billing_error', statement_date=cure_stmt)
  - s_disp_amt: LATEST('card_events','amount_usd', date_field='event_date', event_type='card_open_dispute', dispute_track='billing_error', statement_date=cure_stmt) or 0
  - s_disp_date: LATEST('card_events','event_date', date_field='event_date', event_type='card_open_dispute', dispute_track='billing_error', statement_date=cure_stmt)
  - s_disp_res: COUNT('card_events', event_type='card_resolve_dispute', original_event_id=s_disp_id)
  - m_min: MN(cure_min, MX(P('min_payment_floor_usd'), RND(cure_min - RND(P('min_payment_pct_of_balance') / 100 * s_disp_amt + 0.000000001, 2), 2))) if (s_disp_n == 1 and s_disp_res == 0 and s_disp_date and s_disp_date > cure_stmt) else cure_min
  - referral: s_disp_n >= 2
  - cure_unmet: RND(m_min - (cure_paid - cure_returned), 2) if (cure_stmt and not referral) else 0
  - cure_mail_1: SUM('card_events','amount_usd', within_months=K('mail_hold_months'), event_type='card_post_payment', payment_channel='mail', statement_date=cure_stmt)
  - shortfall: MX(0, RND(m_min - (cure_paid - cure_returned), 2)) if cure_returned > 0 else (MX(0, RND(m_min - (cure_paid - cure_mail_1), 2)) if cure_mail_1 > 0 else MX(0, RND(m_min - cure_paid, 2)))
  - owed_in: SUM('card_events','amount_usd', event_type='card_post_purchase') + SUM('card_events','amount_usd', event_type='card_assess_interest') + SUM('card_events','amount_usd', event_type='card_assess_fee') + SUM('card_events','amount_usd', event_type='card_return_payment') + SUM('card_events','amount_usd', event_type='card_reverse_dispute_credit') + SUM('card_events','amount_usd', event_type='card_refund_credit_balance')
  - owed_out: SUM('card_events','amount_usd', event_type='card_post_payment') + SUM('card_events','amount_usd', event_type='card_post_credit') + SUM('card_events','amount_usd', event_type='card_dispute_credit') + SUM('card_events','amount_usd', event_type='card_reverse_fee') + SUM('card_events','amount_usd', event_type='card_post_reward_credit')
  - under_dispute: SUM('card_events','amount_usd', event_type='card_open_dispute') - SUM('card_events','amount_usd', event_type='card_resolve_dispute')
  - owed_net: RND(owed_in - owed_out - under_dispute, 2)
  - over_add: RND(owed_net - F('credit_limit_usd'), 2) if owed_net > F('credit_limit_usd') else (RND(P('min_payment_floor_usd') - (F('credit_limit_usd') - owed_net), 2) if (F('credit_limit_usd') - owed_net) < P('min_payment_floor_usd') else 0)
  - cure_fee_id: LATEST('card_events','card_event_id', date_field='event_date', event_type='card_assess_fee', fee_type='late_payment', statement_date=cure_stmt)
  - cure_fee_amt: LATEST('card_events','amount_usd', date_field='event_date', event_type='card_assess_fee', fee_type='late_payment', statement_date=cure_stmt) or 0
  - cure_fee_reversed: SUM('card_events','amount_usd', event_type='card_reverse_fee', original_event_id=cure_fee_id)
  - standing_fee: MX(0, RND(cure_fee_amt - cure_fee_reversed, 2))
  - window_fees: MX(0, RND(SUM('card_events','amount_usd', within_months=K('fee_window_months'), event_type='card_assess_fee', fee_type='late_payment') - SUM('card_events','amount_usd', within_months=K('fee_window_months'), event_type='card_reverse_fee'), 2))
  - fee_add: window_fees if (days_since_due >= K('late_band_days') and standing_fee > 0) else (standing_fee if (days_since_due >= 1 and days_since_due < K('late_band_days') and standing_fee > 0) else 0)
  - latest_stmt: LATEST('card_events','statement_date', date_field='statement_date', event_type='card_issue_statement')
  - latest_min: LATEST('card_events','minimum_due_usd', date_field='event_date', event_type='card_issue_statement', statement_date=latest_stmt) or 0
  - latest_int: SUM('card_events','amount_usd', event_type='card_assess_interest', interest_type='purchase', statement_date=latest_stmt)
  - scope_add: latest_min if days_since_due >= K('late_band_days') else (latest_int if (days_since_due >= 1 and cure_due and latest_stmt > cure_due) else 0)
  - result: RND(shortfall + over_add + fee_add + scope_add + 0.000000001, 2) if cure_unmet > 0 else 0
  compute_basis:
    cure_stmt: It is measured on the missed statement, which is the statement for which the most recent late fee on the account was recorded, and of two late fees posted the same day the one entered first in the account history; the catch-up payment is recorded against the missed statement.
    cure_min: The catch-up payment is the minimum payment due on the missed statement less the payments recorded against that statement, and never less than zero.
    cure_due: The days since the missed due date are the calendar days from the missed statement's payment due date to today.
    cure_paid: Each payment counts against the statement whose balance it pays, and a returned payment counts against the same statement as the payment it returns.
    days_since_due: The days since the missed due date are the calendar days from the missed statement's payment due date to today.
    cure_returned: where one of them was returned unpaid, the shortfall is its minimum payment due less those payments net of the returned amounts
    s_disp_n: 'The minimum payment due on the missed statement is the minimum printed on it, less the amount the base rule excludes while a billing-error dispute stands open: where exactly one billing-error dispute is recorded on a transaction the missed statement first showed, it still stands open with no resolution entry referring back to it and its notice was received after that statement''s closing date, the minimum payment due is worked out in two steps, first the tier''s minimum payment percentage of the disputed amount, rounded half up to the cent, is taken off the printed minimum, then where what remains is below the tier''s minimum payment floor the floor is used instead, never more than the printed minimum; in every other case the minimum payment due is the printed minimum.'
    s_disp_id: 'The minimum payment due on the missed statement is the minimum printed on it, less the amount the base rule excludes while a billing-error dispute stands open: where exactly one billing-error dispute is recorded on a transaction the missed statement first showed, it still stands open with no resolution entry referring back to it and its notice was received after that statement''s closing date, the minimum payment due is worked out in two steps, first the tier''s minimum payment percentage of the disputed amount, rounded half up to the cent, is taken off the printed minimum, then where what remains is below the tier''s minimum payment floor the floor is used instead, never more than the printed minimum; in every other case the minimum payment due is the printed minimum.'
    s_disp_amt: 'The minimum payment due on the missed statement is the minimum printed on it, less the amount the base rule excludes while a billing-error dispute stands open: where exactly one billing-error dispute is recorded on a transaction the missed statement first showed, it still stands open with no resolution entry referring back to it and its notice was received after that statement''s closing date, the minimum payment due is worked out in two steps, first the tier''s minimum payment percentage of the disputed amount, rounded half up to the cent, is taken off the printed minimum, then where what remains is below the tier''s minimum payment floor the floor is used instead, never more than the printed minimum; in every other case the minimum payment due is the printed minimum.'
    s_disp_date: 'The minimum payment due on the missed statement is the minimum printed on it, less the amount the base rule excludes while a billing-error dispute stands open: where exactly one billing-error dispute is recorded on a transaction the missed statement first showed, it still stands open with no resolution entry referring back to it and its notice was received after that statement''s closing date, the minimum payment due is worked out in two steps, first the tier''s minimum payment percentage of the disputed amount, rounded half up to the cent, is taken off the printed minimum, then where what remains is below the tier''s minimum payment floor the floor is used instead, never more than the printed minimum; in every other case the minimum payment due is the printed minimum.'
    s_disp_res: 'The minimum payment due on the missed statement is the minimum printed on it, less the amount the base rule excludes while a billing-error dispute stands open: where exactly one billing-error dispute is recorded on a transaction the missed statement first showed, it still stands open with no resolution entry referring back to it and its notice was received after that statement''s closing date, the minimum payment due is worked out in two steps, first the tier''s minimum payment percentage of the disputed amount, rounded half up to the cent, is taken off the printed minimum, then where what remains is below the tier''s minimum payment floor the floor is used instead, never more than the printed minimum; in every other case the minimum payment due is the printed minimum.'
    m_min: 'The minimum payment due on the missed statement is the minimum printed on it, less the amount the base rule excludes while a billing-error dispute stands open: where exactly one billing-error dispute is recorded on a transaction the missed statement first showed, it still stands open with no resolution entry referring back to it and its notice was received after that statement''s closing date, the minimum payment due is worked out in two steps, first the tier''s minimum payment percentage of the disputed amount, rounded half up to the cent, is taken off the printed minimum, then where what remains is below the tier''s minimum payment floor the floor is used instead, never more than the printed minimum; in every other case the minimum payment due is the printed minimum.'
    referral: 'While the missed statement carries two or more billing-error disputes on transactions it first showed, whether resolved or not, the catch-up payment is referred to the disputes team: no catch-up payment is booked and the customer is handed over to a human representative because no published policy sets the payment in this conversation.'
    cure_unmet: The missed statement is met when its minimum payment due is met in full by the payments recorded against it that were not returned unpaid; while it is met, nothing is owed under this rule and the catch-up payment is nothing.
    cure_mail_1: where none was returned and one or more of them were mailed and credited in the last month, a month counted back from today to the same calendar day, those mailed payments count only once they clear a month after they were credited, so the shortfall is the minimum payment due less the other payments recorded against it;
    shortfall: 'The shortfall on the missed statement follows what happened to the payments recorded against it: where one of them was returned unpaid, the shortfall is its minimum payment due less those payments net of the returned amounts; where none was returned and one or more of them were mailed and credited in the last month, a month counted back from today to the same calendar day, those mailed payments count only once they clear a month after they were credited, so the shortfall is the minimum payment due less the other payments recorded against it; in every other case the shortfall is the minimum payment due less the payments recorded against it; a shortfall is never less than zero.'
    owed_in: purchases and cash advances, interest, fees, returned payments, re-billed dispute credits and credit balance refunds raise it
    owed_out: payments, merchant credits, dispute credits, fee reversals and reward credits lower it
    under_dispute: the amounts still under dispute are the disputed amounts of the disputes opened on the account less the amounts that have left dispute status.
    owed_net: The over-limit restoration follows the amount owed today less the amounts still under dispute
    over_add: 'The over-limit restoration follows the amount owed today less the amounts still under dispute: where that amount is above the credit limit, the over-limit restoration is the excess; where it is within the credit limit but leaves less room than the tier''s minimum payment floor, it is that floor less the room left; in every other case there is none.'
    cure_fee_id: The standing late fee is the late fee recorded for the missed statement less every reversal already posted against it, never less than zero.
    cure_fee_amt: The standing late fee is the late fee recorded for the missed statement less every reversal already posted against it, never less than zero.
    cure_fee_reversed: The standing late fee is the late fee recorded for the missed statement less every reversal already posted against it, never less than zero.
    standing_fee: The standing late fee is the late fee recorded for the missed statement less every reversal already posted against it, never less than zero.
    window_fees: it is every late fee recorded on the account in the last two months less the fee reversals posted in that time, never less than zero, a month counted back from today to the same calendar day
    fee_add: 'The restoration fee follows the days since the missed due date and the standing late fee: where 30 or more days have passed and the standing late fee is above zero, it is every late fee recorded on the account in the last two months less the fee reversals posted in that time, never less than zero, a month counted back from today to the same calendar day; where 1 to 29 days have passed and the standing late fee is above zero, it is the standing late fee; in every other case there is none.'
    latest_stmt: where 1 to 29 days have passed and the most recent statement closed after the missed statement's payment due date, it is the purchase interest charged on that most recent statement
    latest_min: where 30 or more days have passed, it is the minimum payment due on the most recent statement
    latest_int: it is the purchase interest charged on that most recent statement
    scope_add: 'The cycle-since-miss restoration follows the days since the missed due date and the statements closed since the miss: where 30 or more days have passed, it is the minimum payment due on the most recent statement; where 1 to 29 days have passed and the most recent statement closed after the missed statement''s payment due date, it is the purchase interest charged on that most recent statement; in every other case there is none.'
    result: While the missed statement is not met, the catch-up payment adds together every amount this rule sets, each already in whole cents, and the total is kept to the cent.
  factors:
  - id: shortfall_measure
    effect: method
