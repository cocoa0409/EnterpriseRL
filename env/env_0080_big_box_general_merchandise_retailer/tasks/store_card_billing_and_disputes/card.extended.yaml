    fee_reversed: The courtesy late fee is the most recent late fee recorded on the account, and of two posted the same day the one entered first in the account history; its standing part is the fee less every reversal already posted against it, never less than zero; it is a qualifying courtesy late fee when it is the only late fee recorded on the account in the last 12 months, no courtesy reversal was posted on the account in that time, and at least 1.00 of it still stands.
    standing: The courtesy late fee is the most recent late fee recorded on the account, and of two posted the same day the one entered first in the account history; its standing part is the fee less every reversal already posted against it, never less than zero; it is a qualifying courtesy late fee when it is the only late fee recorded on the account in the last 12 months, no courtesy reversal was posted on the account in that time, and at least 1.00 of it still stands.
    late_fees_12: The courtesy late fee is the most recent late fee recorded on the account, and of two posted the same day the one entered first in the account history; its standing part is the fee less every reversal already posted against it, never less than zero; it is a qualifying courtesy late fee when it is the only late fee recorded on the account in the last 12 months, no courtesy reversal was posted on the account in that time, and at least 1.00 of it still stands.
    courtesies_12: The courtesy late fee is the most recent late fee recorded on the account, and of two posted the same day the one entered first in the account history; its standing part is the fee less every reversal already posted against it, never less than zero; it is a qualifying courtesy late fee when it is the only late fee recorded on the account in the last 12 months, no courtesy reversal was posted on the account in that time, and at least 1.00 of it still stands.
    qualifies: A qualifying courtesy late fee is reversed as a courtesy at the cardholder's next contact, whatever the contact is about; a late fee that does not qualify receives nothing under this rule.
    fee_due: counted in calendar days from the fee statement's payment due date to that payment's credit date
    fee_paid: The fee statement is the statement the courtesy late fee was recorded for, and the payments recorded against it are the payment entries that carry its closing date.
    months_open: The tenure points follow the whole calendar months from the account's opened date to today
    tenure_pts: 'The tenure points follow the whole calendar months from the account''s opened date to today: 60 months or more grant 15 points; 24 months up to 59 months grant 8 points; fewer than 24 months grant none.'
    last_pay_date: The lateness points follow the most recent payment recorded against the fee statement
    days_late: counted in calendar days from the fee statement's payment due date to that payment's credit date
    late_pts: 'The lateness points follow the most recent payment recorded against the fee statement, counted in calendar days from the fee statement''s payment due date to that payment''s credit date, and of two credited the same day the one entered first: a payment credited 1 to 3 days after the due date grants 15 points; a payment credited 4 to 10 days after the due date grants 8 points; a payment credited on or before the due date or more than 10 days after it, or no payment, grants none.'
    member_tier: where the cardholder holds a Northgate+ membership in active status
    member_since: they are the whole years from that membership's enrolled date to today, at most 10
    rewards_12: outside-purchase rewards were credited on the account in the last 12 months
    loyalty_pts: 'The loyalty points follow the cardholder''s wider relationship with Northgate: where the cardholder holds a Northgate+ membership in active status, they are the whole years from that membership''s enrolled date to today, at most 10; where the cardholder holds no Northgate+ membership in active status and outside-purchase rewards were credited on the account in the last 12 months, they are the whole tens of dollars of those rewards, at most 10; in every other case there are none.'
    autopay_12: The automatic-payment points follow the payments credited through automatic payment over the last 12 months
    autopay_pts: 'The automatic-payment points follow the payments credited through automatic payment over the last 12 months: 6 or more grant 10 points; 1 to 5 grant 5 points; none grants none.'
    late_fees_24: A count or total over the last 12 or 24 months takes the entries dated after the same calendar day 12 or 24 months before today.
    returns_24: A count or total over the last 12 or 24 months takes the entries dated after the same calendar day 12 or 24 months before today.
    returns_12: A count or total over the last 12 or 24 months takes the entries dated after the same calendar day 12 or 24 months before today.
    history_pts: 'The history points follow the account''s late fees and returned payments over the last 24 months: where the courtesy late fee is the only late fee in that time and no payment was returned in that time, 12 points; where no more than two late fees were recorded in that time and no payment was returned in the last 12 months, but either a second late fee was recorded or a payment was returned more than 12 months ago, 6 points; in every other case none.'
    fee_nb: payments reaching its whole new balance grant 8 points
    fee_min: payments reaching its minimum payment due but not its new balance grant 4 points
    coverage_pts: 'The coverage points follow what the payments recorded against the fee statement covered: payments reaching its whole new balance grant 8 points; payments reaching its minimum payment due but not its new balance grant 4 points; anything less grants none.'
    share: The courtesy share is 25 percent together with every point this rule grants, never above 100 percent, and the courtesy reversal is that share of the standing part of the courtesy late fee, rounded half up to the cent.
    result: The courtesy reversal is 25 percent of the standing part of the courtesy late fee, rounded half up to the cent.
  factors:
  - id: tenure_points
    effect: parameter
    decides: tenure_pts
    bindings:
    - months_open
    - tenure_pts
    ladder:
    - when: 60 months or more
      value: K('tenure_long_pts')
    - when: 24 months up to 59 months
      value: K('tenure_mid_pts')
    - when: otherwise
      value: '0'
    baseline:
      tenure_pts: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: lateness_points
    effect: parameter
    decides: late_pts
    bindings:
    - fee_due
    - last_pay_date
    - days_late
    - late_pts
    ladder:
    - when: a payment credited 1 to 3 days after the due date
      value: K('prompt_pts')
    - when: a payment credited 4 to 10 days after the due date
      value: K('slow_pts')
    - when: otherwise
      value: '0'
    baseline:
      late_pts: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: loyalty_points
    effect: method
    decides: loyalty_pts
    bindings:
    - member_tier
    - member_since
    - rewards_12
    - loyalty_pts
    ladder:
    - when: the cardholder holds a Northgate+ membership in active status
      method: the whole years from that membership's enrolled date to today, at most 10
    - when: the cardholder holds no Northgate+ membership in active status and outside-purchase rewards were credited on the account in the last 12 months
      method: the whole tens of dollars of those rewards, at most 10
    - when: otherwise
      method: none
    baseline:
      loyalty_pts: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: membership
  - id: automatic_payment_points
    effect: parameter
    decides: autopay_pts
    bindings:
    - autopay_12
    - autopay_pts
    ladder:
    - when: 6 or more
      value: K('autopay_steady_pts')
    - when: 1 to 5
      value: K('autopay_new_pts')
    - when: otherwise
      value: '0'
    baseline:
      autopay_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: history_points
    effect: parameter
    decides: history_pts
    bindings:
    - late_fees_24
    - returns_24
    - returns_12
    - history_pts
    ladder:
    - when: the courtesy late fee is the only late fee in that time and no payment was returned in that time
      value: K('history_clean_pts')
    - when: no more than two late fees were recorded in that time and no payment was returned in the last 12 months, but either a second late fee was recorded or a payment was returned more than 12 months ago
      value: K('history_mixed_pts')
    - when: otherwise
      value: '0'
    baseline:
      history_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: coverage_points
    effect: parameter
    decides: coverage_pts
    bindings:
    - fee_paid
    - fee_nb
    - fee_min
    - coverage_pts
    ladder:
    - when: payments reaching its whole new balance
      value: K('coverage_full_pts')
    - when: payments reaching its minimum payment due but not its new balance
      value: K('coverage_min_pts')
    - when: otherwise
      value: '0'
    baseline:
      coverage_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The courtesy reversal is 25 percent of the standing part of the courtesy late fee, rounded half up to the cent.
    params:
    - base_share_pct
  inputs:
    history:
    - table: card_events
      aggregate: count
      field: card_event_id
      within_months: 12
      filters:
        event_type: card_assess_fee
        fee_type: late_payment
    - table: card_events
      aggregate: count
      field: card_event_id
      within_months: 24
      filters:
        event_type: card_return_payment
    - table: card_events
      aggregate: count
      field: card_event_id
      within_months: 12
      filters:
        event_type: card_post_payment
        payment_channel: autopay
    - table: card_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: card_post_payment
    cross_category:
    - membership
- id: card_ext_credit_balance_refund
  base_policy_refs:
  - card_evt_payments
  overwrite:
  - base_policy: card_evt_payments
    superseded_clause: a credit balance above credit_balance_refund_min_usd is refunded within credit_balance_refund_business_days business days of the cardholder's written request, and any credit balance above that amount remaining after credit_balance_auto_refund_months months is refunded without a request.
    replaced_by: 'On a refund request this rule handles, and only on such a request, the credit balance above the base minimum is refunded at once less the amounts this rule holds, and the held amounts stay on the account as a credit balance, refunded on a later request once released, and in every case within the base number of business days of a written request, or, when still above the base minimum after the base number of months, without a request; every other credit balance follows the base rule: a credit balance above the base minimum is refunded within the base number of business days of the cardholder''s written request, and any credit balance above that amount remaining after the base number of months is refunded without a request.'
  trigger: on_request
  subject:
  - card_refund_credit_balance
  computes: refund_amount_usd
  target_tool: refund_credit_balance_0212c7e9
  params:
    lookback_months: 12
    hold_months: 1
  rule: 'A credit balance refund is the cardholder''s own decision: the representative records the request, the cardholder confirms it, and the refund is issued at once from a credit balance above the base minimum. The credit balance refund is fixed only after every late fee that is the only late fee of the last 12 months, with at least 1.00 of it still standing after the reversals already posted against it, on an account with no courtesy reversal in that time carries its courtesy reversal. On a refund request this rule handles, and only on such a request, the credit balance above the base minimum is refunded at once less the amounts this rule holds, and the held amounts stay on the account as a credit balance, refunded on a later request once released, and in every case within the base number of business days of a written request, or, when still above the base minimum after the base number of months, without a request; every other credit balance follows the base rule: a credit balance above the base minimum is refunded within the base number of business days of the cardholder''s written request, and any credit balance above that amount remaining after the base number of months is refunded without a request. A count or total over the last 12 months takes the entries dated after the same calendar day 12 months before today, and one over the last month the entries dated after the same calendar day one month before today. The credit balance is the amount owed on the account below zero, and nothing when the account owes money. Before any hold this rule sets, the credit balance refund is the whole credit balance. The refund is the credit balance less every amount this rule holds, never less than zero, kept to the cent. The account''s payment record is clean when no payment was returned unpaid in the last 12 months. The payment clearing hold follows the account''s payment record and the payments credited in the last month: where the payment record is not clean, every payment credited in the last month is held, less the returned payments posted in that month, never less than zero; where it is clean, the payments credited in the last month that were mailed, or that were made online, in the app, by phone or by automatic payment through a channel that no payment in the last 12 months had used before that month, are held; in every other case nothing is held. A held payment is released once a month has passed from its credit date. The dispute hold follows the disputes on the account: where a dispute stands open, the disputed amounts opened exceeding the amounts that have left dispute status, and a provisional dispute credit has posted on the account, the amount still under dispute is held; where no dispute stands open, the hold is the provisional dispute credits posted less those already re-billed and less the amounts of disputes resolved for the cardholder, never less than zero; in every other case nothing is held. A payment is recorded against the statement whose balance it pays, and the payments recorded against a statement are all the payment entries that carry that statement''s closing date. The residual interest hold follows the most recent statement: where it charged purchase interest and the payments recorded against it reach its new balance, the hold is its new balance times the tier''s purchase APR divided by 100 and by 365, times the days from the day after its closing date to the day before the most recent payment recorded against it, both counted, rounded half up to the cent and never below the tier''s minimum interest charge; where it charged purchase interest and the payments recorded against it fall short of its new balance, the hold is that unpaid part times the same daily rate, times the days from the day after its closing date through today, rounded half up to the cent and never below the tier''s minimum interest charge; in every other case nothing is held. A merchant credit names the purchase it credits by that purchase''s reference, and an unreferenced merchant credit is one whose purchase reference is empty. The merchant credit hold follows the account''s payment record and the merchant credits posted in the last month: where the payment record is not clean, every merchant credit posted in the last month by a merchant other than Northgate is held; where it is clean and an unreferenced merchant credit was posted in the last month by a merchant other than Northgate, those unreferenced credits are held; in every other case nothing is held. A held merchant credit is released once a month has passed from its posting date.'
  prerequisite:
  - problem: card_ext_first_late_fee_courtesy
    kind: value_input
    gate: credit_bal
    form: state
    policy_source: The credit balance refund is fixed only after every late fee that is the only late fee of the last 12 months, with at least 1.00 of it still standing after the reversals already posted against it, on an account with no courtesy reversal in that time carries its courtesy reversal.
    condition: When the account's only late_payment fee of the last 12 months has at least 1.00 standing after the card_reverse_fee entries against it and no card_reverse_fee with reversal_reason courtesy_waiver exists in that time, a card_reverse_fee courtesy_waiver entry referring back to that fee exists.
    resolved_by: reverse_late_fee_courtesy_ba087f69
    effect: The courtesy reversal lowers the amount owed, so credit_bal (the amount owed below zero) grows by the reversed amount and the refund grows with it.
  cross_category: []
  compute:
  - credit_bal: MX(0, RND(0 - F('current_balance'), 2))
  - returns_12: COUNT('card_events', within_months=K('lookback_months'), event_type='card_return_payment')
  - pay_1: SUM('card_events','amount_usd', within_months=K('hold_months'), event_type='card_post_payment')
  - ret_1: SUM('card_events','amount_usd', within_months=K('hold_months'), event_type='card_return_payment')
  - mail_1: SUM('card_events','amount_usd', within_months=K('hold_months'), event_type='card_post_payment', payment_channel='mail')
  - n12_online: COUNT('card_events', within_months=K('lookback_months'), event_type='card_post_payment', payment_channel='online')
  - n1_online: COUNT('card_events', within_months=K('hold_months'), event_type='card_post_payment', payment_channel='online')
  - p1_online: SUM('card_events','amount_usd', within_months=K('hold_months'), event_type='card_post_payment', payment_channel='online')
  - n12_app: COUNT('card_events', within_months=K('lookback_months'), event_type='card_post_payment', payment_channel='app')
  - n1_app: COUNT('card_events', within_months=K('hold_months'), event_type='card_post_payment', payment_channel='app')
  - p1_app: SUM('card_events','amount_usd', within_months=K('hold_months'), event_type='card_post_payment', payment_channel='app')
  - n12_phone: COUNT('card_events', within_months=K('lookback_months'), event_type='card_post_payment', payment_channel='phone')
  - n1_phone: COUNT('card_events', within_months=K('hold_months'), event_type='card_post_payment', payment_channel='phone')
  - p1_phone: SUM('card_events','amount_usd', within_months=K('hold_months'), event_type='card_post_payment', payment_channel='phone')
  - n12_autopay: COUNT('card_events', within_months=K('lookback_months'), event_type='card_post_payment', payment_channel='autopay')
  - n1_autopay: COUNT('card_events', within_months=K('hold_months'), event_type='card_post_payment', payment_channel='autopay')
  - p1_autopay: SUM('card_events','amount_usd', within_months=K('hold_months'), event_type='card_post_payment', payment_channel='autopay')
  - payment_hold: MX(0, RND(pay_1 - ret_1, 2)) if returns_12 > 0 else RND(mail_1 + (p1_online if (n1_online > 0 and n12_online == n1_online) else 0) + (p1_app if (n1_app > 0 and n12_app == n1_app) else 0) + (p1_phone if (n1_phone > 0 and n12_phone == n1_phone) else 0) + (p1_autopay if (n1_autopay > 0 and n12_autopay == n1_autopay) else 0), 2)
  - disputes_opened: SUM('card_events','amount_usd', event_type='card_open_dispute')
  - disputes_left: SUM('card_events','amount_usd', event_type='card_resolve_dispute')
  - provisional_posted: SUM('card_events','amount_usd', event_type='card_dispute_credit', credit_stage='provisional')
  - rebilled: SUM('card_events','amount_usd', event_type='card_reverse_dispute_credit')
  - cardholder_resolved: SUM('card_events','amount_usd', event_type='card_resolve_dispute', dispute_outcome='resolved_for_cardholder')
  - dispute_hold: RND(disputes_opened - disputes_left, 2) if (disputes_opened - disputes_left > 0 and provisional_posted > 0) else (MX(0, RND(provisional_posted - rebilled - cardholder_resolved, 2)) if (disputes_opened - disputes_left <= 0) else 0)
  - latest_stmt: LATEST('card_events','statement_date', date_field='statement_date', event_type='card_issue_statement')
  - latest_nb: LATEST('card_events','new_balance_usd', date_field='event_date', event_type='card_issue_statement', statement_date=latest_stmt) or 0
  - latest_int: SUM('card_events','amount_usd', event_type='card_assess_interest', interest_type='purchase', statement_date=latest_stmt)
  - latest_paid: SUM('card_events','amount_usd', event_type='card_post_payment', statement_date=latest_stmt)
  - latest_pay_date: LATEST('card_events','event_date', date_field='event_date', event_type='card_post_payment', statement_date=latest_stmt)
  - residual_hold: MX(P('minimum_interest_charge_usd'), RND(latest_nb * P('purchase_apr_pct') / 100 / 365 * MX(0, DAYS(latest_stmt, latest_pay_date) - 1) + 0.000000001, 2)) if (latest_int > 0 and latest_paid >= latest_nb) else (MX(P('minimum_interest_charge_usd'), RND((latest_nb - latest_paid) * P('purchase_apr_pct') / 100 / 365 * DAYS(latest_stmt, NOW) + 0.000000001, 2)) if (latest_int > 0 and latest_paid < latest_nb) else 0)
  - mc_out_1: SUM('card_events','amount_usd', within_months=K('hold_months'), event_type='card_post_credit', merchant_type='external_merchant')
  - mc_blind_1: SUM('card_events','amount_usd', within_months=K('hold_months'), event_type='card_post_credit', merchant_type='external_merchant', original_transaction_reference='')
  - credit_hold: mc_out_1 if returns_12 > 0 else (mc_blind_1 if mc_blind_1 > 0 else 0)
  - result: MX(0, RND(credit_bal - payment_hold - dispute_hold - residual_hold - credit_hold + 0.000000001, 2))
  compute_basis:
    credit_bal: The credit balance is the amount owed on the account below zero, and nothing when the account owes money.
    returns_12: The account's payment record is clean when no payment was returned unpaid in the last 12 months.
    pay_1: 'The payment clearing hold follows the account''s payment record and the payments credited in the last month: where the payment record is not clean, every payment credited in the last month is held, less the returned payments posted in that month, never less than zero; where it is clean, the payments credited in the last month that were mailed, or that were made online, in the app, by phone or by automatic payment through a channel that no payment in the last 12 months had used before that month, are held; in every other case nothing is held. A held payment is released once a month has passed from its credit date.'
