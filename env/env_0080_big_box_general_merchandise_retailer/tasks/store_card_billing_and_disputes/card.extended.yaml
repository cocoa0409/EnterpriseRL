    - shortfall
    ladder:
    - when: one of them was returned unpaid
      method: its minimum payment due less those payments net of the returned amounts
    - when: none was returned and one or more of them were mailed and credited in the last month
      method: the minimum payment due less the other payments recorded against it
    - when: otherwise
