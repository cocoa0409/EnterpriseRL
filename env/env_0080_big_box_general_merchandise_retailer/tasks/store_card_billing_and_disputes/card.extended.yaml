    use_add_pct: 5
  rule: 'A requested credit line increase on a Northgate Card account is reviewed on the account as it stands at the review, and the review sets the new credit limit; it is considered only when the base rule''s account-age and active-status conditions hold. A requested credit line increase is granted only after the minimum payment due on the statement for which the most recent late fee was recorded, the missed statement, is met in full by the payments recorded against that statement that were not returned unpaid. A requested credit line increase is not granted, and is referred to the disputes team, while the statement for which the most recent late fee was recorded carries two or more billing-error disputes on transactions it first showed, whether resolved or not: no limit change is booked and the customer is handed over to a human representative because no published policy decides the increase in this conversation. The minimum payment due on that statement is the minimum printed on it, less the amount the base rule excludes while a billing-error dispute stands open: where exactly one billing-error dispute is recorded on a transaction that statement first showed, it still stands open with no resolution entry referring back to it and its notice was received after that statement''s closing date, the minimum payment due is worked out in two steps, first the tier''s minimum payment percentage of the disputed amount, rounded half up to the cent, is taken off the printed minimum, then where what remains is below the tier''s minimum payment floor the floor is used instead, never more than the printed minimum; in every other case the minimum payment due is the printed minimum. A payment is recorded against the statement whose balance it pays, and a returned payment against the same statement as the payment it returns; where two late fees posted the same day, the most recent late fee is the one entered first in the account history, and while the increase is not granted the credit limit stays as it is. A count or total over the last 12 months takes the entries dated after the same calendar day twelve months before the review date, and purchases are the purchase postings only, never cash advances. The line increase is taken at 10 percent of the account''s current credit limit, and the new credit limit is the current credit limit plus the line increase, rounded down to a whole hundred dollars and never above the tier''s highest credit limit. The percentage at which the line increase is taken follows the account''s payment conduct over the last 12 months: where no late fee and no returned payment were recorded in that time, it is 20 percent; where exactly one returned payment and no more than two late fees were recorded in that time, it is 5 percent; where more than two late fees or more than one returned payment were recorded in that time, it is nothing; in every other case, one or two late fees and no returned payment, it is 10 percent. The usage line addition follows the account''s use of its line at the review, the use being the amount owed divided by the current credit limit: where the use is at least 70 percent, it is 5 percent of the highest new balance shown on any statement of the account, rounded half up to the cent; where the use is below 10 percent, it is 5 percent of the payments credited on the account over the last 12 months less the payments returned unpaid in that time, that difference never less than zero, rounded half up to the cent; in every other case there is none. The membership line addition follows the cardholder''s Northgate membership in active status at the review: a Northgate+ Annual or Northgate+ Business membership adds 500 dollars; any other Northgate+ membership adds 250 dollars; no Northgate+ membership in active status adds nothing. The tenure line addition follows the whole calendar months from the account''s opened date to the review date: 36 months or more add 400 dollars; 18 months up to 35 months add 200 dollars; fewer than 18 months add nothing. The purchase-volume line addition follows the account''s net purchases over the last 12 months, being the purchases less the merchant credits and the dispute credits posted in that time: net purchases of 6,000 dollars or more add 300 dollars; net purchases of 2,500 dollars or more but below 6,000 dollars add 150 dollars; lower net purchases add nothing. Every line addition is added to the current credit limit together with the line increase before the rounding down to a whole hundred dollars and the tier ceiling.'
  prerequisite:
  - problem: card_ext_catch_up_payment
    kind: value_input
    gate: cure_unmet
    form: state
    policy_source: A requested credit line increase is granted only after the minimum payment due on the statement for which the most recent late fee was recorded, the missed statement, is met in full by the payments recorded against that statement that were not returned unpaid.
    condition: The card_post_payment entries carrying the statement_date of the most recent late_payment fee, less the card_return_payment entries carrying that date, total at least that statement's minimum_due_usd, less the minimum payment percentage of the one open billing_error card_open_dispute carrying that statement_date and an event_date after it (never below the minimum payment floor or above the printed minimum).
    resolved_by: make_card_payment_5ec32b69
    effect: The cardholder's catch-up payment recorded against the missed statement lifts its payments not returned to at least its minimum payment due, so cure_unmet falls to zero or below and the review grants the increase instead of leaving the credit limit as it is; the payment also lowers the amount owed that the usage line addition reads.
  cross_category:
  - category: membership
    as: branch
    reads:
    - variant_name
    - status
    note: The membership line addition reads the tier of the cardholder's Northgate membership in active status.
  compute:
  - cure_stmt: LATEST('card_events','statement_date', date_field='event_date', event_type='card_assess_fee', fee_type='late_payment')
  - cure_min: LATEST('card_events','minimum_due_usd', date_field='event_date', event_type='card_issue_statement', statement_date=cure_stmt) or 0
  - cure_paid: SUM('card_events','amount_usd', event_type='card_post_payment', statement_date=cure_stmt)
  - cure_returned: SUM('card_events','amount_usd', event_type='card_return_payment', statement_date=cure_stmt)
  - s_disp_n: COUNT('card_events', event_type='card_open_dispute', dispute_track='billing_error', statement_date=cure_stmt)
  - s_disp_id: LATEST('card_events','card_event_id', date_field='event_date', event_type='card_open_dispute', dispute_track='billing_error', statement_date=cure_stmt)
  - s_disp_amt: LATEST('card_events','amount_usd', date_field='event_date', event_type='card_open_dispute', dispute_track='billing_error', statement_date=cure_stmt) or 0
  - s_disp_date: LATEST('card_events','event_date', date_field='event_date', event_type='card_open_dispute', dispute_track='billing_error', statement_date=cure_stmt)
  - s_disp_res: COUNT('card_events', event_type='card_resolve_dispute', original_event_id=s_disp_id)
  - m_min: MN(cure_min, MX(P('min_payment_floor_usd'), RND(cure_min - RND(P('min_payment_pct_of_balance') / 100 * s_disp_amt + 0.000000001, 2), 2))) if (s_disp_n == 1 and s_disp_res == 0 and s_disp_date and s_disp_date > cure_stmt) else cure_min
  - referral: s_disp_n >= 2
  - cure_unmet: RND(m_min - (cure_paid - cure_returned), 2) if cure_stmt else 0
  - purchases_12: SUM('card_events','amount_usd', within_months=12, event_type='card_post_purchase', transaction_kind='purchase')
  - merchant_credits_12: SUM('card_events','amount_usd', within_months=12, event_type='card_post_credit')
  - dispute_credits_12: SUM('card_events','amount_usd', within_months=12, event_type='card_dispute_credit')
  - net_purchases: RND(purchases_12 - merchant_credits_12 - dispute_credits_12, 2)
  - late_fees_12: COUNT('card_events', within_months=12, event_type='card_assess_fee', fee_type='late_payment')
  - returns_12: COUNT('card_events', within_months=12, event_type='card_return_payment')
  - inc_pct: K('clean_increase_pct') if (late_fees_12 == 0 and returns_12 == 0) else (K('returned_increase_pct') if (returns_12 == K('single_return') and late_fees_12 <= K('returned_max_late_fees')) else (0 if (late_fees_12 > K('severe_late_fees') or returns_12 > K('severe_returns')) else K('std_increase_pct')))
  - line_use: F('current_balance') / F('credit_limit_usd')
  - top_statement: MAX('card_events','new_balance_usd', event_type='card_issue_statement')
  - use_payments_12: SUM('card_events','amount_usd', within_months=12, event_type='card_post_payment') - SUM('card_events','amount_usd', within_months=12, event_type='card_return_payment')
  - use_add: RND(K('use_add_pct') / 100 * top_statement + 0.000000001, 2) if line_use >= K('high_use_ratio') else (RND(K('use_add_pct') / 100 * MX(0, use_payments_12) + 0.000000001, 2) if line_use < K('low_use_ratio') else 0)
  - member_tier: CFIELD('membership','variant_name', status='active')
  - member_add: K('member_major_usd') if (member_tier == 'Northgate+ Annual' or member_tier == 'Northgate+ Business') else (K('member_other_usd') if (member_tier == 'Northgate+ Assist' or member_tier == 'Northgate+ Student' or member_tier == 'Northgate+ Monthly') else 0)
  - months_open: MONTHS(F('opened_date'), NOW)
  - tenure_add: K('tenure_long_usd') if months_open >= K('tenure_long_months') else (K('tenure_mid_usd') if months_open >= K('tenure_mid_months') else 0)
  - volume_add: K('volume_high_add_usd') if net_purchases >= K('volume_high_usd') else (K('volume_mid_add_usd') if net_purchases >= K('volume_mid_usd') else 0)
  - raw_limit: F('credit_limit_usd') + inc_pct / 100 * F('credit_limit_usd') + use_add + member_add + tenure_add + volume_add
  - result: F('credit_limit_usd') if (cure_unmet > 0 or referral) else float(MN(P('credit_limit_max_usd'), int(raw_limit / K('limit_step_usd')) * K('limit_step_usd')))
