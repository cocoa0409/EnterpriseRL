    - history
    - date
    cross_difficulty: null
  - id: cycle_since_miss
    effect: method
    decides: scope_add
    bindings:
    - latest_stmt
    - latest_min
    - latest_int
    - scope_add
    ladder:
    - when: 30 or more days have passed
      method: the minimum payment due on the most recent statement
    - when: 1 to 29 days have passed and the most recent statement closed after the missed statement's payment due date
      method: the purchase interest charged on that most recent statement
    - when: otherwise
      method: none
    baseline:
      scope_add: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
