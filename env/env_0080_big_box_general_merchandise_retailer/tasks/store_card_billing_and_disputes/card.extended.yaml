- id: card_ext_first_late_fee_courtesy
  base_policy_refs:
  - card_evt_late_and_returned_fees
  overwrite:
  - base_policy: card_evt_late_and_returned_fees
    superseded_clause: One late fee per account may be reversed as a courtesy when card_msr_courtesy_waivers_12m is below courtesy_late_fee_waivers_per_12_months and the account has no other late fee in the previous six statements; returned payment fees and cash advance fees are never waived as a courtesy.
    replaced_by: 'Courtesy reversals of late fees follow this rule alone: a qualifying courtesy late fee is reversed in its courtesy share at the cardholder''s next contact, no other late fee is reversed as a courtesy, and returned payment fees and cash advance fees are never waived as a courtesy.'
  trigger: state_due
  subject:
  - card_reverse_fee
  computes: reversal_amount_usd
  target_tool: reverse_late_fee_courtesy_ba087f69
  params:
    base_share_pct: 25
    max_share_pct: 100
    tenure_long_months: 60
    tenure_mid_months: 24
    tenure_long_pts: 15
    tenure_mid_pts: 8
    prompt_days: 3
    slow_days: 10
    prompt_pts: 15
    autopay_steady_count: 6
    autopay_steady_pts: 10
    autopay_new_pts: 5
    history_clean_pts: 12
    history_mixed_pts: 6
    slow_pts: 8
    history_max_late: 2
    coverage_full_pts: 8
    coverage_min_pts: 4
    loyalty_max_pts: 10
    standing_min_usd: 1.0
    reward_step_usd: 10
  rule: 'The courtesy late fee is the most recent late fee recorded on the account, and of two posted the same day the one entered first in the account history; its standing part is the fee less every reversal already posted against it, never less than zero; it is a qualifying courtesy late fee when it is the only late fee recorded on the account in the last 12 months, no courtesy reversal was posted on the account in that time, and at least 1.00 of it still stands. A count or total over the last 12 or 24 months takes the entries dated after the same calendar day 12 or 24 months before today. A qualifying courtesy late fee is reversed as a courtesy at the cardholder''s next contact, whatever the contact is about; a late fee that does not qualify receives nothing under this rule. Courtesy reversals of late fees follow this rule alone: a qualifying courtesy late fee is reversed in its courtesy share at the cardholder''s next contact, no other late fee is reversed as a courtesy, and returned payment fees and cash advance fees are never waived as a courtesy. The courtesy reversal is 25 percent of the standing part of the courtesy late fee, rounded half up to the cent. The fee statement is the statement the courtesy late fee was recorded for, and the payments recorded against it are the payment entries that carry its closing date. The tenure points follow the whole calendar months from the account''s opened date to today: 60 months or more grant 15 points; 24 months up to 59 months grant 8 points; fewer than 24 months grant none. The lateness points follow the most recent payment recorded against the fee statement, counted in calendar days from the fee statement''s payment due date to that payment''s credit date, and of two credited the same day the one entered first: a payment credited 1 to 3 days after the due date grants 15 points; a payment credited 4 to 10 days after the due date grants 8 points; a payment credited on or before the due date or more than 10 days after it, or no payment, grants none. The loyalty points follow the cardholder''s wider relationship with Northgate: where the cardholder holds a Northgate+ membership in active status, they are the whole years from that membership''s enrolled date to today, at most 10; where the cardholder holds no Northgate+ membership in active status and outside-purchase rewards were credited on the account in the last 12 months, they are the whole tens of dollars of those rewards, at most 10; in every other case there are none. The automatic-payment points follow the payments credited through automatic payment over the last 12 months: 6 or more grant 10 points; 1 to 5 grant 5 points; none grants none. The history points follow the account''s late fees and returned payments over the last 24 months: where the courtesy late fee is the only late fee in that time and no payment was returned in that time, 12 points; where no more than two late fees were recorded in that time and no payment was returned in the last 12 months, but either a second late fee was recorded or a payment was returned more than 12 months ago, 6 points; in every other case none. The coverage points follow what the payments recorded against the fee statement covered: payments reaching its whole new balance grant 8 points; payments reaching its minimum payment due but not its new balance grant 4 points; anything less grants none. The courtesy share is 25 percent together with every point this rule grants, never above 100 percent, and the courtesy reversal is that share of the standing part of the courtesy late fee, rounded half up to the cent.'
  prerequisite: []
  cross_category:
  - category: membership
    as: branch
    reads:
    - variant_name
    - status
    - enrolled_date
    note: The loyalty points read the tier and enrolled date of the cardholder's Northgate membership in active status.
  compute:
  - fee_stmt: LATEST('card_events','statement_date', date_field='event_date', event_type='card_assess_fee', fee_type='late_payment')
  - fee_id: LATEST('card_events','card_event_id', date_field='event_date', event_type='card_assess_fee', fee_type='late_payment')
  - fee_amt: LATEST('card_events','amount_usd', date_field='event_date', event_type='card_assess_fee', fee_type='late_payment') or 0
  - fee_reversed: SUM('card_events','amount_usd', event_type='card_reverse_fee', original_event_id=fee_id)
  - standing: MX(0, RND(fee_amt - fee_reversed, 2))
  - late_fees_12: COUNT('card_events', within_months=12, event_type='card_assess_fee', fee_type='late_payment')
  - courtesies_12: COUNT('card_events', within_months=12, event_type='card_reverse_fee', reversal_reason='courtesy_waiver')
  - qualifies: late_fees_12 == 1 and courtesies_12 == 0 and standing >= K('standing_min_usd')
  - fee_due: LATEST('card_events','payment_due_date', date_field='event_date', event_type='card_issue_statement', statement_date=fee_stmt)
  - fee_paid: SUM('card_events','amount_usd', event_type='card_post_payment', statement_date=fee_stmt)
  - months_open: MONTHS(F('opened_date'), NOW)
  - tenure_pts: K('tenure_long_pts') if months_open >= K('tenure_long_months') else (K('tenure_mid_pts') if months_open >= K('tenure_mid_months') else 0)
  - last_pay_date: LATEST('card_events','event_date', date_field='event_date', event_type='card_post_payment', statement_date=fee_stmt)
  - days_late: DAYS(fee_due, last_pay_date) if (fee_due and last_pay_date) else 0
  - late_pts: K('prompt_pts') if (days_late >= 1 and days_late <= K('prompt_days')) else (K('slow_pts') if (days_late > K('prompt_days') and days_late <= K('slow_days')) else 0)
  - member_tier: CFIELD('membership','variant_name', status='active')
  - member_since: CFIELD('membership','enrolled_date', status='active')
  - rewards_12: SUM('card_events','amount_usd', within_months=12, event_type='card_post_reward_credit')
  - loyalty_pts: MN(K('loyalty_max_pts'), int(MONTHS(member_since, NOW) / 12)) if (member_tier == 'Northgate+ Assist' or member_tier == 'Northgate+ Student' or member_tier == 'Northgate+ Monthly' or member_tier == 'Northgate+ Annual' or member_tier == 'Northgate+ Business') else (MN(K('loyalty_max_pts'), int(rewards_12 / K('reward_step_usd'))) if rewards_12 > 0 else 0)
  - autopay_12: COUNT('card_events', within_months=12, event_type='card_post_payment', payment_channel='autopay')
  - autopay_pts: K('autopay_steady_pts') if autopay_12 >= K('autopay_steady_count') else (K('autopay_new_pts') if autopay_12 >= 1 else 0)
  - late_fees_24: COUNT('card_events', within_months=24, event_type='card_assess_fee', fee_type='late_payment')
  - returns_24: COUNT('card_events', within_months=24, event_type='card_return_payment')
  - returns_12: COUNT('card_events', within_months=12, event_type='card_return_payment')
  - history_pts: K('history_clean_pts') if (late_fees_24 == 1 and returns_24 == 0) else (K('history_mixed_pts') if (late_fees_24 <= K('history_max_late') and returns_12 == 0 and (late_fees_24 == 2 or returns_24 > 0)) else 0)
  - fee_nb: LATEST('card_events','new_balance_usd', date_field='event_date', event_type='card_issue_statement', statement_date=fee_stmt) or 0
  - fee_min: LATEST('card_events','minimum_due_usd', date_field='event_date', event_type='card_issue_statement', statement_date=fee_stmt) or 0
  - coverage_pts: K('coverage_full_pts') if (fee_nb > 0 and fee_paid >= fee_nb) else (K('coverage_min_pts') if (fee_paid >= fee_min and fee_paid < fee_nb) else 0)
  - share: MN(K('max_share_pct'), K('base_share_pct') + tenure_pts + late_pts + loyalty_pts + autopay_pts + history_pts + coverage_pts)
  - result: RND(standing * share / 100 + 0.000000001, 2) if qualifies else 0
