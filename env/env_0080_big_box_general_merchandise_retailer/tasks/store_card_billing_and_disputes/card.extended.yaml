    deferred_interest_promo_months: []
    authorized_users_max: 25
    reapply_wait_days: 30
    replacement_card_fee_usd: 0.0

events:
  - type: card_apply
    target: card_holdings
    mutation: create
    meaning: A customer applies for a Northgate Card and the application record is opened.
    grain: One row per application.
    fields:
      variant_name: Tier applied for.
      application_date: Date of application.
      application_channel: in_store, online or app.
    triggers: []
  - type: card_approve
    target: card_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: The issuer approves the application and the account opens.
    grain: One row per transaction.
    fields:
      opened_date: Account opening date.
      credit_limit_usd: Credit limit assigned.
      statement_closing_day: Day of month on which statements close.
      card_last4: Last four digits of the card number issued.
    triggers: []
  - type: card_decline_application
    target: card_holdings
    mutation: {transition: {from: applied, to: declined}}
    meaning: The issuer declines the application.
    grain: One row per transaction.
    fields:
      declined_date: Date of the decline.
    triggers: []
  - type: card_suspend
    target: card_holdings
    mutation: {transition: {from: active, to: suspended}}
    meaning: Charging privileges are suspended.
    grain: One row per transaction.
    fields:
      suspended_date: Date of suspension.
      suspension_reason: past_due or fraud_review.
    triggers: []
  - type: card_reinstate
    target: card_holdings
    mutation: {transition: {from: suspended, to: active}}
    meaning: Charging privileges are restored.
    grain: One row per transaction.
    fields:
      suspended_date: Cleared to empty.
    triggers: []
  - type: card_close
    target: card_holdings
    mutation: {transition: {from: active, to: closed}}
    meaning: The cardholder's confirmed request to close the account takes effect.
    grain: One row per transaction.
    fields:
      closed_date: Date the account closed to new charges.
    triggers: []
  - type: card_charge_off
    target: card_holdings
    mutation: {transition: {from: suspended, to: charged_off}}
    meaning: A seriously past-due account is charged off.
    grain: One row per transaction.
    fields:
      closed_date: Date of charge-off.
    triggers: []
  - type: card_change_product
    target: card_holdings
    mutation: update
    meaning: The account moves to another tier of the same customer type, such as a secured graduation or an upgrade to a Mastercard.
    grain: One row per product change.
    fields:
      variant_name: New tier.
      credit_limit_usd: Credit limit after the change.
    triggers: []
  - type: card_change_limit
    target: card_holdings
    mutation: update
    meaning: The credit limit is increased or decreased.
    grain: One row per limit change.
    fields:
      credit_limit_usd: New credit limit.
    triggers: []
  - type: card_set_autopay
    target: card_holdings
    mutation: update
    meaning: The cardholder enrolls in, changes or stops automatic payments.
    grain: One row per change.
    fields:
      autopay_option: none, minimum_due, statement_balance or fixed_amount.
    triggers: []
  - type: card_post_purchase
    target: card_events
    meaning: A purchase or cash advance posts to the account.
    grain: One row per authorized transaction.
    distinguish_by: [transaction_reference]
    fields:
      card_account_id: The card account the transaction posts to.
      event_date: Transaction date.
      amount_usd: Amount charged, positive, after any cardholder discount taken at checkout.
      transaction_reference: Network or Northgate transaction reference.
      transaction_kind: purchase or cash_advance.
      merchant_type: Northgate channel or external_merchant.
      merchant_name: Merchant name as it appears on the statement.
      source_record_id: The Northgate order, marketplace order, membership fee or protection plan record the charge pays for; empty for external merchants.
      promo_financing: none, deferred_6 or deferred_12.
    account: balance_owed
    direction: in
    triggers: []
  - type: card_post_credit
    target: card_events
    meaning: A merchant credit or refund posts to the account.
    grain: One row per merchant credit.
    distinguish_by: [transaction_reference]
    fields:
      card_account_id: The card account the transaction posts to.
      event_date: Credit posting date.
      amount_usd: Amount credited, positive.
      transaction_reference: Reference of this credit.
      original_transaction_reference: The purchase being credited.
      merchant_type: Northgate channel or external_merchant.
      source_record_id: The Northgate record (return, refund or cancellation source) that produced the credit; empty for external merchants.
    account: balance_owed
    direction: out
    triggers: []
  - type: card_post_payment
    target: card_events
    meaning: A cardholder payment is credited.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      event_date: Date the payment is credited, which is the receipt date when received by the cutoff time on a business day and the next business day otherwise.
      amount_usd: Amount paid, positive.
      payment_reference: Payment confirmation number.
      payment_channel: online, app, phone, in_store, mail or autopay.
    account: balance_owed
    direction: out
    triggers: []
  - type: card_return_payment
    target: card_events
    meaning: A previously credited payment is returned unpaid by the cardholder's bank.
    grain: One row per returned payment.
    distinguish_by: [payment_reference]
    fields:
      event_date: Date the return was received.
      amount_usd: Amount of the returned payment, positive.
      payment_reference: The payment that was returned.
      return_reason: insufficient_funds, account_closed, stop_payment or invalid_account.
    account: balance_owed
    direction: in
    triggers: []
  - type: card_assess_interest
    target: card_events
    meaning: Interest is charged at statement close.
    grain: One row per interest type per statement.
    distinguish_by: [statement_date, interest_type]
    fields:
      event_date: Statement closing date.
      statement_date: Statement the interest is charged on.
      amount_usd: Interest charged, positive.
      interest_type: purchase, cash_advance, deferred_interest, minimum_charge or reinstated_dispute.
    account: balance_owed
    direction: in
    triggers: []
  - type: card_assess_fee
    target: card_events
    meaning: A late payment, returned payment or cash advance fee is charged.
    grain: One row per fee occurrence.
    distinguish_by: [fee_type, statement_date, original_transaction_reference]
    fields:
      event_date: Date the fee posted.
      amount_usd: Fee charged, positive.
      fee_type: late_payment, returned_payment or cash_advance.
      statement_date: Statement whose payment due date was missed, or the statement cycle in which the fee posted.
      original_transaction_reference: The returned payment or the cash advance the fee arises from; empty for a late fee.
    account: balance_owed
    direction: in
    triggers: []
  - type: card_reverse_fee
    target: card_events
    meaning: A fee previously charged is reversed.
    grain: One row per reversed fee.
    distinguish_by: [original_event_id]
    fields:
      event_date: Date of reversal.
      amount_usd: Amount reversed, positive.
      original_event_id: The card_assess_fee row reversed.
      reversal_reason: courtesy_waiver, billing_error or regulatory_cap.
    account: balance_owed
    direction: out
    triggers: []
  - type: card_issue_statement
    target: card_events
    meaning: A periodic statement closes and is sent to the cardholder.
    grain: One row per statement.
    distinguish_by: [statement_date]
    fields:
      event_date: Date the statement was sent.
      statement_date: Statement closing date.
      new_balance_usd: New balance at closing.
      minimum_due_usd: Minimum payment due.
      payment_due_date: Payment due date.
    triggers: []
  - type: card_open_dispute
    target: card_events
    meaning: The cardholder disputes one posted transaction.
    grain: One row per disputed transaction.
    distinguish_by: [original_transaction_reference]
    fields:
      event_date: Date the dispute notice was received.
      amount_usd: Amount disputed, positive.
      original_transaction_reference: The disputed transaction.
      statement_date: Closing date of the first statement on which the disputed transaction appeared.
      dispute_reason: unauthorized, not_received, not_as_described, returned_not_credited, duplicate or incorrect_amount.
      dispute_track: billing_error or network_only.
      source_record_id: The Northgate order or marketplace order the disputed charge paid for; empty for external merchants.
    account: disputed_amount
    direction: in
    triggers: []
  - type: card_dispute_credit
    target: card_events
    meaning: A provisional or final credit for a disputed amount posts.
    grain: One row per credit stage of one dispute.
    distinguish_by: [original_event_id, credit_stage]
    fields:
      event_date: Credit posting date.
      amount_usd: Amount credited, positive.
      original_event_id: The card_open_dispute row.
      credit_stage: provisional or final.
    account: balance_owed
    direction: out
    triggers: []
  - type: card_reverse_dispute_credit
    target: card_events
    meaning: A provisional dispute credit is reversed after the dispute is resolved for the merchant.
    grain: One row per reversed provisional credit.
    distinguish_by: [original_event_id]
    fields:
      event_date: Reversal date.
      amount_usd: Amount re-billed, positive.
      original_event_id: The card_open_dispute row.
    account: balance_owed
    direction: in
    triggers: []
  - type: card_resolve_dispute
    target: card_events
    meaning: A dispute is resolved or withdrawn and leaves dispute status.
    grain: One row per resolved dispute.
    distinguish_by: [original_event_id]
    fields:
      event_date: Resolution date.
      amount_usd: Amount leaving dispute status, positive.
      original_event_id: The card_open_dispute row.
      dispute_outcome: resolved_for_cardholder, resolved_for_merchant or withdrawn.
    account: disputed_amount
    direction: out
    triggers: []
  - type: card_post_reward_credit
    target: card_events
    meaning: Outside-purchase rewards earned in a cycle are credited at statement close.
    grain: One row per statement.
    distinguish_by: [statement_date]
    fields:
      event_date: Statement closing date.
      statement_date: Statement the rewards are credited on.
      amount_usd: Rewards credited, positive.
    account: balance_owed
    direction: out
    triggers: []
  - type: card_refund_credit_balance
    target: card_events
    meaning: A credit balance on the account is refunded to the cardholder.
    grain: One row per refund.
    distinguish_by: [event_date]
    fields:
      event_date: Refund date.
      amount_usd: Amount refunded, positive, bringing the balance toward zero.
    account: balance_owed
    direction: in
    triggers: []
  - type: card_post_deposit
    target: card_events
    meaning: A security deposit is received on a secured account.
    grain: One row per deposit payment.
    distinguish_by: [payment_reference]
    fields:
      event_date: Date the deposit was received.
      amount_usd: Deposit amount, positive.
      payment_reference: Confirmation number of the deposit payment.
    account: security_deposit
    direction: in
    triggers: []
  - type: card_refund_deposit
    target: card_events
    meaning: The security deposit is refunded on graduation or closure.
    grain: One row per deposit refund.
    distinguish_by: [event_date]
    fields:
      event_date: Refund date.
      amount_usd: Deposit refunded, positive.
    account: security_deposit
    direction: out
    triggers: []

measures:
  - id: card_msr_prior_late_fees
    window: The late_fee_repeat_lookback_cycles statements immediately before the statement whose due date was missed.
    measure: Count of card_assess_fee rows on the account with fee_type late_payment whose statement_date is one of those statements.
  - id: card_msr_prior_returned_payments
    window: The six statement cycles before the cycle in which the payment was returned, by statement_date.
    measure: Count of card_return_payment rows on the account with event_date inside those cycles.
  - id: card_msr_courtesy_waivers_12m
    window: Rolling 12 calendar months ending on the date being evaluated, inclusive.
    measure: Count of card_reverse_fee rows on the account with reversal_reason courtesy_waiver and event_date in the window.
  - id: card_msr_on_time_cycles
    window: Consecutive statements ending with the most recent statement whose payment due date has passed.
    measure: Number of consecutive such statements, counted backwards, for which payments credited by the payment due date reached the minimum payment due.
  - id: card_msr_days_past_due
    window: From the payment due date of the oldest statement whose minimum payment remains unmet, to the date being evaluated.
    measure: Calendar days elapsed; 0 when every minimum payment due has been met.
  - id: card_msr_cycle_payments
    window: From the day after the statement closing date through the payment due date of that statement, inclusive.
    measure: Sum of amount_usd of card_post_payment rows in the window minus card_return_payment rows for those payments.

  - id: card_msr_average_daily_balance
    window: The billing cycle from the day after the previous statement closing date through the current closing date.
    measure: Average of the end-of-day purchase balances of each day in the cycle, including new purchases on their posting date and excluding amounts under billing-error dispute and special financing balances inside their promotional period.
  - id: card_msr_days_in_cycle
    window: The billing cycle from the day after the previous statement closing date through the current closing date.
    measure: Number of calendar days in the cycle.

policies:
  - id: card_agg_multi_holding
    subject: [card_apply]
    rule: >-
      A customer profile may hold one Northgate Card account at a time; a consumer holds a consumer tier and a business
      profile holds a business tier. A new application is accepted only when the customer has no other card account in
      applied, active or suspended status. Moving between tiers of the same customer type is a product change on the
      existing account, never a second account. Closed, charged-off and declined accounts do not count.
    eligibility:
      - id: one_card_account
        applies_to: [card_apply]
        kind: dedup
        condition: A new application is accepted only when the customer has no other card account in applied, active or suspended status.
        evidence_fields: [card_holdings.customer_id, card_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.customer_id]
          action_bindings:
            card_holdings.customer_id: customer_id
        dedup_contract:
          table: card_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: card_application
    subject: [card_apply, card_approve, card_decline_application, card_post_deposit]
    rule: >-
      Applications are taken in store, online or in the app and decided by Harbor Point Bank, N.A.; the agent records
      the application but never approves, declines or assigns a credit limit. Consumer tiers accept only consumer profiles
      and business tiers only business profiles. The tier is open only to a customer whose profile customer type is listed
      in that tier's entry gate. A new application is accepted only when it is made at least the tier's reapply wait days
      after the declined date of the customer's most recent declined application. Calendar days are added to the declined
      date, the day after the decline being day 1, and an application on the last day of the wait is still too early. On
      approval the credit limit lies between credit_limit_min_usd and credit_limit_max_usd; on Northgate Secured Card the
      account opens only once a security deposit of at least security_deposit_min_usd is received, and the credit limit
      equals the deposit.
      The card is usable where its card_network allows, only at Northgate on closed_loop cards. On Northgate Secured Card secured_limit_equals_deposit is true, and the wait after a decline is reapply_wait_days.
    eligibility:
      - id: customer_type_admitted
        applies_to: [card_apply]
        kind: authorization
        condition: The tier is open only to a customer whose profile customer type is listed in that tier's entry gate.
        evidence_fields: [customers.customer_type, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: reapply_wait
        applies_to: [card_apply]
        kind: time
        condition: A new application is accepted only when it is made at least the tier's reapply wait days after the declined date of the customer's most recent declined application.
        evidence_fields: [card_holdings.declined_date, card_holdings.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.customer_id]
          action_bindings:
            card_holdings.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the declined date of the customer's most recent declined application
          anchor_source: card_holdings.declined_date
          relation: not_before
          duration_source: variants.reapply_wait_days
          unit: calendar_days
          counting_rule: Calendar days are added to the declined date, the day after the decline being day 1, and an application on the last day of the wait is still too early.
          boundary: exclusive
    params:
      per_tier:
        Northgate Secured Card: {credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd"}
        Northgate Store Card: {credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd"}
        Northgate Mastercard: {credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd"}
        Northgate World Mastercard: {credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd"}
        Northgate Business Store Card: {credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd"}
        Northgate Business Mastercard: {credit_limit_min_usd: "=credit_limit_min_usd", credit_limit_max_usd: "=credit_limit_max_usd", security_deposit_min_usd: "=security_deposit_min_usd"}

  - id: card_cardholder_benefits
    subject: [card_post_purchase, card_post_credit]
    rule: >-
      This is the single statement of the Northgate Card benefits that apply to Northgate purchases. The cardholder
      discount of cardholder_discount_pct is taken at checkout on each eligible line paid with the card, and the purchase
      posts net of it. The cardholder discount applies only when the card account is in active status at the time of
      purchase. The discount base is the line price after item promotions, price matches and price adjustments, before
      Northgate Cash, gift cards and tax; the discount is rounded half up to the cent per line. It never applies to the
      purchase types in cardholder_discount_excluded, and it applies to Northgate Marketplace items only when they are
      Fulfilled by Northgate. Stacking: the discount is applied last, on the line price left after every other price reduction, so it never compounds with or is applied before another discount; membership benefits only affect delivery fees and do not interact with it. Where cardholder_free_standard_shipping is true, standard shipping on Ship to Home
      orders paid with the card is free regardless of size, and where that and a membership benefit both waive the same
      fee the fee is waived once. Items bought with the card get cardholder_extra_return_days added to the standard return
      window of the item. A refund for a returned line credits the amount actually paid for that line, net of the
      discount, back to the card.
    eligibility:
      - id: active_card
        applies_to: [card_post_purchase]
        kind: state
        condition: The cardholder discount applies only when the card account is in active status at the time of purchase.
        evidence_fields: [card_holdings.status, card_holdings.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.card_account_id]
          action_bindings:
            card_holdings.card_account_id: card_account_id
        state_contract:
          field: card_holdings.status
          allowed: [active]
    params:
      per_tier:
        Northgate Secured Card: {cardholder_discount_pct: "=cardholder_discount_pct", cardholder_free_standard_shipping: "=cardholder_free_standard_shipping", cardholder_extra_return_days: "=cardholder_extra_return_days"}
        Northgate Store Card: {cardholder_discount_pct: "=cardholder_discount_pct", cardholder_free_standard_shipping: "=cardholder_free_standard_shipping", cardholder_extra_return_days: "=cardholder_extra_return_days"}
        Northgate Mastercard: {cardholder_discount_pct: "=cardholder_discount_pct", cardholder_free_standard_shipping: "=cardholder_free_standard_shipping", cardholder_extra_return_days: "=cardholder_extra_return_days"}
        Northgate World Mastercard: {cardholder_discount_pct: "=cardholder_discount_pct", cardholder_free_standard_shipping: "=cardholder_free_standard_shipping", cardholder_extra_return_days: "=cardholder_extra_return_days"}
        Northgate Business Store Card: {cardholder_discount_pct: "=cardholder_discount_pct", cardholder_free_standard_shipping: "=cardholder_free_standard_shipping", cardholder_extra_return_days: "=cardholder_extra_return_days"}
        Northgate Business Mastercard: {cardholder_discount_pct: "=cardholder_discount_pct", cardholder_free_standard_shipping: "=cardholder_free_standard_shipping", cardholder_extra_return_days: "=cardholder_extra_return_days"}

  - id: card_evt_interest
    subject: [card_assess_interest, card_issue_statement]
    rule: >-
      Interest is charged at each statement close by the average daily balance method including new purchases: the
      daily periodic rate is purchase_apr_pct / 100 / interest_days_in_year, applied to the average daily balance of the
      cycle times the number of days in the cycle, rounded half up to the cent. New purchases carry no interest in a cycle
      when the previous statement balance was paid in full by its payment due date. Amounts under billing-error dispute
      are excluded from the balance on which interest accrues while the dispute is open. When any interest is due and
      the computed amount is below minimum_interest_charge_usd, the minimum charge applies instead (interest_type
      minimum_charge). A special financing purchase carries no billed interest during its promotional period; if any of
      it remains unpaid at the end of the period, the interest accrued from the purchase date at purchase_apr_pct is
      charged on the statement after the period ends (interest_type deferred_interest), and nothing is charged if it was
      paid in full. During the last two billing cycles before a promotional period ends, payment above the minimum is
      applied first to that promotional balance. Cash advances accrue interest from the transaction date at
      cash_advance_apr_pct with no grace period. Each statement shows the new balance, the minimum payment due and the
      payment due date, which is payment_due_days_after_close calendar days after the closing date. The minimum payment
      due is the greater of min_payment_floor_usd and min_payment_pct_of_balance percent of the new balance excluding
      disputed amounts plus that cycle's interest and fees, but never more than the new balance.
      Interest is computed by interest_method, and grace depends on the previous balance as grace_requires_prior_paid_in_full states. No penalty APR is ever applied since penalty_apr_applies is false, no annual fee is charged beyond annual_fee_usd, and purchases processed outside the US carry foreign_transaction_fee_pct on Mastercard tiers. Special financing is offered only on tiers with deferred_interest_promo_months, on a single Northgate purchase of at least deferred_interest_min_purchase_usd. An APR increase or other significant change in terms takes effect only after change_in_terms_notice_days days' written notice and applies only to transactions made after it takes effect.
    eligibility: []
    measures: [card_msr_average_daily_balance, card_msr_days_in_cycle]
    formula:
      amount_usd: round(card_msr_average_daily_balance * purchase_apr_pct / 100 / interest_days_in_year * card_msr_days_in_cycle, 2)
    params:
      per_tier:
        Northgate Secured Card: {purchase_apr_pct: "=purchase_apr_pct", cash_advance_apr_pct: "=cash_advance_apr_pct", min_payment_floor_usd: "=min_payment_floor_usd", min_payment_pct_of_balance: "=min_payment_pct_of_balance"}
        Northgate Store Card: {purchase_apr_pct: "=purchase_apr_pct", cash_advance_apr_pct: "=cash_advance_apr_pct", min_payment_floor_usd: "=min_payment_floor_usd", min_payment_pct_of_balance: "=min_payment_pct_of_balance"}
        Northgate Mastercard: {purchase_apr_pct: "=purchase_apr_pct", cash_advance_apr_pct: "=cash_advance_apr_pct", min_payment_floor_usd: "=min_payment_floor_usd", min_payment_pct_of_balance: "=min_payment_pct_of_balance"}
        Northgate World Mastercard: {purchase_apr_pct: "=purchase_apr_pct", cash_advance_apr_pct: "=cash_advance_apr_pct", min_payment_floor_usd: "=min_payment_floor_usd", min_payment_pct_of_balance: "=min_payment_pct_of_balance"}
        Northgate Business Store Card: {purchase_apr_pct: "=purchase_apr_pct", cash_advance_apr_pct: "=cash_advance_apr_pct", min_payment_floor_usd: "=min_payment_floor_usd", min_payment_pct_of_balance: "=min_payment_pct_of_balance"}
        Northgate Business Mastercard: {purchase_apr_pct: "=purchase_apr_pct", cash_advance_apr_pct: "=cash_advance_apr_pct", min_payment_floor_usd: "=min_payment_floor_usd", min_payment_pct_of_balance: "=min_payment_pct_of_balance"}

  - id: card_evt_late_and_returned_fees
    subject: [card_assess_fee, card_reverse_fee, card_return_payment]
    rule: >-
      A late fee is assessed only when payments credited by the payment due date total less than the minimum payment due
      on that statement, as given by card_msr_cycle_payments. The fee is late_fee_first_usd, or late_fee_repeat_usd when
      card_msr_prior_late_fees is at least one, and it never exceeds the minimum payment that was due. No late fee is
      assessed when the minimum payment due was 0.00 or when the only unpaid amount is under billing-error dispute. A
      returned payment reverses the credited payment and may carry a returned payment fee of
      returned_payment_fee_first_usd, or returned_payment_fee_repeat_usd when card_msr_prior_returned_payments is at least
      one, again never more than the minimum payment due for that cycle. Each returned payment carries at most one returned
      payment fee. When a returned payment also causes the minimum payment to be missed, only one fee may be charged for
      that single event: the late fee is charged and no returned payment fee. A cash advance fee is the greater of
      cash_advance_fee_min_usd and cash_advance_fee_pct of the advance. One late fee per account may be reversed as a
      courtesy when card_msr_courtesy_waivers_12m is below courtesy_late_fee_waivers_per_12_months and the account has
      no other late fee in the previous six statements; returned payment fees and cash advance fees are never waived as a
      courtesy. A fee charged in error, or above the minimum-payment ceiling, is reversed in full as billing_error or for
      the excess as regulatory_cap.
      The repeat-fee search covers late_fee_repeat_lookback_cycles statements, and the ceiling follows late_fee_cap_basis.
    eligibility:
      - id: one_returned_fee_per_payment
        applies_to: [card_assess_fee]
        kind: dedup
        condition: Each returned payment carries at most one returned payment fee.
        evidence_fields: [card_events.original_transaction_reference, card_events.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_events.original_transaction_reference]
          action_bindings:
            card_events.original_transaction_reference: original_transaction_reference
        dedup_contract:
          table: card_events
          mode: separate_record
          object_bindings: {original_transaction_reference: original_transaction_reference}
          duplicate_filters: {fee_type: [returned_payment]}
          distinct_fields: []
    measures: [card_msr_prior_late_fees, card_msr_prior_returned_payments, card_msr_courtesy_waivers_12m, card_msr_cycle_payments]
    params:
      per_tier:
        Northgate Secured Card: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", returned_payment_fee_first_usd: "=returned_payment_fee_first_usd", returned_payment_fee_repeat_usd: "=returned_payment_fee_repeat_usd"}
        Northgate Store Card: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", returned_payment_fee_first_usd: "=returned_payment_fee_first_usd", returned_payment_fee_repeat_usd: "=returned_payment_fee_repeat_usd"}
        Northgate Mastercard: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", returned_payment_fee_first_usd: "=returned_payment_fee_first_usd", returned_payment_fee_repeat_usd: "=returned_payment_fee_repeat_usd"}
        Northgate World Mastercard: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", returned_payment_fee_first_usd: "=returned_payment_fee_first_usd", returned_payment_fee_repeat_usd: "=returned_payment_fee_repeat_usd"}
        Northgate Business Store Card: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", returned_payment_fee_first_usd: "=returned_payment_fee_first_usd", returned_payment_fee_repeat_usd: "=returned_payment_fee_repeat_usd"}
        Northgate Business Mastercard: {late_fee_first_usd: "=late_fee_first_usd", late_fee_repeat_usd: "=late_fee_repeat_usd", returned_payment_fee_first_usd: "=returned_payment_fee_first_usd", returned_payment_fee_repeat_usd: "=returned_payment_fee_repeat_usd"}

  - id: card_billing_dispute
    subject: [card_open_dispute, card_resolve_dispute]
    rule: >-
      A cardholder may dispute one posted transaction as a billing error: an unauthorized charge, goods or services not
      received, goods not as described, a return that was not credited, a duplicate charge or an incorrect amount.
      Billing-error protections apply only when the dispute notice is received no later than the statement date of the
      first statement showing the transaction plus the tier's dispute notice days. Calendar days are added to that
      statement date, the day after it being day 1, and a notice received on the last day still qualifies. Such a dispute
      is opened on the billing_error track: the issuer acknowledges it within dispute_ack_days and resolves it within
      dispute_max_resolution_cycles complete billing cycles and never more than dispute_max_resolution_days; while it is
      open the disputed amount is excluded from the minimum payment and from interest, no late fee arises from leaving it
      unpaid, and it is not reported as delinquent. On Mastercard tiers a dispute about a purchase from a merchant other
      than Northgate received after that deadline but no later than the transaction date plus network_dispute_window_days
      is opened on the network_only track, without those protections; on closed-loop tiers and for Northgate purchases a
      late notice is not accepted. A transaction can be disputed only once; a resolved dispute is not reopened by a new
      dispute. For a Northgate purchase, a not_as_described or returned_not_credited dispute is accepted only when a return
      of the disputed item is on record with Northgate. For a Northgate Marketplace purchase, such a dispute is accepted only when a return request to the seller or a Northgate Marketplace Guarantee claim for the order is on record, and opening the dispute closes any guarantee claim on that order under market_guarantee_eligibility. For other merchants the cardholder's account of a good-faith attempt to resolve it with the merchant is accepted. A dispute is resolved for the cardholder when the investigation
      confirms the error, for the merchant when it does not, and withdrawn when the cardholder withdraws it or the
      merchant credits the transaction in full first. If a billing-error dispute is not resolved within the limits, the
      cardholder keeps up to dispute_noncompliance_forfeit_usd of the disputed amount even if the charge proves correct.
      The merchant-attempt requirement applies where quality_dispute_requires_merchant_attempt is true.
    eligibility:
      - id: billing_error_window
        applies_to: [card_open_dispute]
        kind: time
        condition: Billing-error protections apply only when the dispute notice is received no later than the statement date of the first statement showing the transaction plus the tier's dispute notice days.
        evidence_fields: [card_events.statement_date, card_events.transaction_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_events.transaction_reference]
          action_bindings:
            card_events.transaction_reference: original_transaction_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the statement date of the first statement showing the transaction
          anchor_source: card_events.statement_date
          relation: not_after
          duration_source: variants.dispute_notice_days_after_statement
          unit: calendar_days
          counting_rule: Calendar days are added to that statement date, the day after it being day 1, and a notice received on the last day still qualifies.
          boundary: inclusive
      - id: dispute_once
        applies_to: [card_open_dispute]
        kind: dedup
        condition: A transaction can be disputed only once; a resolved dispute is not reopened by a new dispute.
        evidence_fields: [card_events.original_transaction_reference, card_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_events.original_transaction_reference]
          action_bindings:
            card_events.original_transaction_reference: original_transaction_reference
        dedup_contract:
          table: card_events
          mode: separate_record
          object_bindings: {original_transaction_reference: original_transaction_reference}
          duplicate_filters: {event_type: [card_open_dispute]}
          distinct_fields: []
      - id: northgate_return_on_record
        applies_to: [card_open_dispute]
        kind: authorization
        condition: For a Northgate purchase, a not_as_described or returned_not_credited dispute is accepted only when a return of the disputed item is on record with Northgate.
        evidence_fields: [order_events.order_id, order_events.event_type, card_events.source_record_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_events.source_record_id]
          action_bindings:
            card_events.source_record_id: source_record_id
    params:
      dispute_noncompliance_forfeit_usd: 50.00
      per_tier:
        Northgate Secured Card: {dispute_notice_days_after_statement: "=dispute_notice_days_after_statement", network_dispute_window_days: "=network_dispute_window_days"}
        Northgate Store Card: {dispute_notice_days_after_statement: "=dispute_notice_days_after_statement", network_dispute_window_days: "=network_dispute_window_days"}
        Northgate Mastercard: {dispute_notice_days_after_statement: "=dispute_notice_days_after_statement", network_dispute_window_days: "=network_dispute_window_days"}
        Northgate World Mastercard: {dispute_notice_days_after_statement: "=dispute_notice_days_after_statement", network_dispute_window_days: "=network_dispute_window_days"}
        Northgate Business Store Card: {dispute_notice_days_after_statement: "=dispute_notice_days_after_statement", network_dispute_window_days: "=network_dispute_window_days"}
        Northgate Business Mastercard: {dispute_notice_days_after_statement: "=dispute_notice_days_after_statement", network_dispute_window_days: "=network_dispute_window_days"}

  - id: card_dispute_credits
    subject: [card_dispute_credit, card_reverse_dispute_credit, card_resolve_dispute]
    rule: >-
      Where provisional_credit_on_open is true, the disputed amount is credited provisionally when the dispute is opened;
      where it is false, the disputed amount is only set aside under card_billing_dispute and no credit posts until
      resolution. A dispute credit can be posted only on an account in active, suspended or closed status. When a dispute
      is resolved for the cardholder, a provisional credit becomes final with no further posting, and on a tier without
      provisional credit a final credit of the disputed amount posts. When it is resolved for the merchant, any
      provisional credit is reversed, and interest that would have accrued on the disputed amount while it was set aside
      is charged on the next statement as interest_type reinstated_dispute; the cardholder is given at least the grace
      period of payment_due_days_after_close before a late fee can arise on that amount. A withdrawn dispute is treated
      like one resolved for the merchant, except that when it was withdrawn because the merchant credited the
      transaction, the provisional credit is reversed against the merchant credit and no interest is reinstated.
      Unauthorized charges are always credited in full because cardholder liability is unauthorized_liability_usd.
    eligibility:
      - id: credit_account_status
        applies_to: [card_dispute_credit]
        kind: state
        condition: A dispute credit can be posted only on an account in active, suspended or closed status.
        evidence_fields: [card_holdings.status, card_holdings.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.card_account_id]
          action_bindings:
            card_holdings.card_account_id: card_account_id
        state_contract:
          field: card_holdings.status
          allowed: [active, suspended, closed]
    params:
      per_tier:
        Northgate Secured Card: {provisional_credit_on_open: "=provisional_credit_on_open"}
        Northgate Store Card: {provisional_credit_on_open: "=provisional_credit_on_open"}
        Northgate Mastercard: {provisional_credit_on_open: "=provisional_credit_on_open"}
        Northgate World Mastercard: {provisional_credit_on_open: "=provisional_credit_on_open"}
        Northgate Business Store Card: {provisional_credit_on_open: "=provisional_credit_on_open"}
        Northgate Business Mastercard: {provisional_credit_on_open: "=provisional_credit_on_open"}

  - id: card_evt_payments
    subject: [card_post_payment, card_set_autopay, card_refund_credit_balance]
    rule: >-
      Payments are accepted through the tier's payment_channels; a payment received by payment_cutoff_time_et Eastern on
      a business day is credited that day, otherwise on the next business day, and a cash payment at a Northgate register
      may not exceed in_store_payment_max_usd. Payments are accepted on an account in active, suspended, closed or
      charged_off status. The minimum payment is applied as the issuer chooses, and any amount above it is applied by
      payment_allocation, except in the last two cycles of a special financing period as stated in card_evt_interest.
      Automatic payments may be set to one of the tier's autopay_options and are drawn on the payment due date. A payment
      larger than the balance leaves a credit balance; a credit balance above credit_balance_refund_min_usd is refunded
      within credit_balance_refund_business_days business days of the cardholder's written request, and any credit
      balance above that amount remaining after credit_balance_auto_refund_months months is refunded without a request.
    eligibility:
      - id: payable_status
        applies_to: [card_post_payment]
        kind: state
        condition: Payments are accepted on an account in active, suspended, closed or charged_off status.
        evidence_fields: [card_holdings.status, card_holdings.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.card_account_id]
          action_bindings:
            card_holdings.card_account_id: card_account_id
        state_contract:
          field: card_holdings.status
          allowed: [active, suspended, closed, charged_off]
    params:
      per_tier:
        Northgate Secured Card: {payment_channels: "=payment_channels", autopay_options: "=autopay_options", in_store_payment_max_usd: "=in_store_payment_max_usd"}
        Northgate Store Card: {payment_channels: "=payment_channels", autopay_options: "=autopay_options", in_store_payment_max_usd: "=in_store_payment_max_usd"}
        Northgate Mastercard: {payment_channels: "=payment_channels", autopay_options: "=autopay_options", in_store_payment_max_usd: "=in_store_payment_max_usd"}
        Northgate World Mastercard: {payment_channels: "=payment_channels", autopay_options: "=autopay_options", in_store_payment_max_usd: "=in_store_payment_max_usd"}
        Northgate Business Store Card: {payment_channels: "=payment_channels", autopay_options: "=autopay_options", in_store_payment_max_usd: "=in_store_payment_max_usd"}
        Northgate Business Mastercard: {payment_channels: "=payment_channels", autopay_options: "=autopay_options", in_store_payment_max_usd: "=in_store_payment_max_usd"}

  - id: card_account_status
    subject: [card_suspend, card_reinstate, card_close, card_charge_off, card_refund_deposit]
    rule: >-
      Charging privileges are suspended when card_msr_days_past_due reaches suspension_days_past_due, or at once while a
      fraud review is open, and are restored when every past-due minimum payment has been met or the fraud review clears.
      A suspended account is charged off when card_msr_days_past_due reaches charge_off_days_past_due. Closing the account
      is the cardholder's own decision: the agent records the request in card_requests and the cardholder confirms it. An
      account can be closed at the cardholder's request only while it is in active status. A closed account takes no new
      charges, but the remaining balance continues to be repaid on the existing terms, open disputes continue to their
      resolution and special financing periods continue to run. On a Northgate Secured Card the security deposit is
      refunded within deposit_refund_business_days business days after the account is closed with a zero balance, or
      after graduation; where a balance remains at closure the deposit is first applied to it and only the remainder is
      refunded.
    eligibility:
      - id: closable_status
        applies_to: [card_close]
        kind: state
        condition: An account can be closed at the cardholder's request only while it is in active status.
        evidence_fields: [card_holdings.status, card_holdings.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.card_account_id]
          action_bindings:
            card_holdings.card_account_id: card_account_id
        state_contract:
          field: card_holdings.status
          allowed: [active]
    measures: [card_msr_days_past_due]
    params:
      per_tier:
        Northgate Secured Card: {suspension_days_past_due: "=suspension_days_past_due", charge_off_days_past_due: "=charge_off_days_past_due", deposit_refund_business_days: "=deposit_refund_business_days"}
        Northgate Store Card: {suspension_days_past_due: "=suspension_days_past_due", charge_off_days_past_due: "=charge_off_days_past_due", deposit_refund_business_days: "=deposit_refund_business_days"}
        Northgate Mastercard: {suspension_days_past_due: "=suspension_days_past_due", charge_off_days_past_due: "=charge_off_days_past_due", deposit_refund_business_days: "=deposit_refund_business_days"}
        Northgate World Mastercard: {suspension_days_past_due: "=suspension_days_past_due", charge_off_days_past_due: "=charge_off_days_past_due", deposit_refund_business_days: "=deposit_refund_business_days"}
        Northgate Business Store Card: {suspension_days_past_due: "=suspension_days_past_due", charge_off_days_past_due: "=charge_off_days_past_due", deposit_refund_business_days: "=deposit_refund_business_days"}
        Northgate Business Mastercard: {suspension_days_past_due: "=suspension_days_past_due", charge_off_days_past_due: "=charge_off_days_past_due", deposit_refund_business_days: "=deposit_refund_business_days"}

  - id: card_product_and_limit
    subject: [card_change_product, card_change_limit]
    rule: >-
      A Northgate Secured Card is reviewed for graduation to a Northgate Store Card once card_msr_on_time_cycles reaches
      graduation_review_on_time_cycles; on graduation the limit is at least the deposit and the deposit is refunded under
      card_account_status. Other product changes move between tiers of the same customer type and are decided by the
      issuer. A requested credit line increase is considered only when the account has been open at least the tier's
      credit line review months. Calendar months are added to the opened date, falling back to the last day of a shorter
      month, and a request on that date qualifies. A further request is considered no sooner than the same number of
      months after the last limit change. A product change or limit change can be made only on an account in active
      status. A limit decrease below the current balance never creates an over-limit fee, because over_limit_fee_usd
      applies, and transactions above the limit are declined.
      An account may carry up to authorized_users_max authorized users, and a replacement card costs replacement_card_fee_usd.
    eligibility:
      - id: line_review_age
        applies_to: [card_change_limit]
        kind: time
        condition: A requested credit line increase is considered only when the account has been open at least the tier's credit line review months.
        evidence_fields: [card_holdings.opened_date, card_holdings.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.card_account_id]
          action_bindings:
            card_holdings.card_account_id: card_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the account has been open
          anchor_source: card_holdings.opened_date
          relation: not_before
          duration_source: variants.credit_line_review_months
          unit: calendar_months
          counting_rule: Calendar months are added to the opened date, falling back to the last day of a shorter month, and a request on that date qualifies.
          boundary: inclusive
      - id: change_active_only
        applies_to: [card_change_product, card_change_limit]
        kind: state
        condition: A product change or limit change can be made only on an account in active status.
        evidence_fields: [card_holdings.status, card_holdings.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.card_account_id]
          action_bindings:
            card_holdings.card_account_id: card_account_id
        state_contract:
          field: card_holdings.status
          allowed: [active]
    measures: [card_msr_on_time_cycles]
    params:
      per_tier:
        Northgate Secured Card: {graduation_review_on_time_cycles: "=graduation_review_on_time_cycles", credit_line_review_months: "=credit_line_review_months"}
        Northgate Store Card: {graduation_review_on_time_cycles: "=graduation_review_on_time_cycles", credit_line_review_months: "=credit_line_review_months"}
        Northgate Mastercard: {graduation_review_on_time_cycles: "=graduation_review_on_time_cycles", credit_line_review_months: "=credit_line_review_months"}
        Northgate World Mastercard: {graduation_review_on_time_cycles: "=graduation_review_on_time_cycles", credit_line_review_months: "=credit_line_review_months"}
        Northgate Business Store Card: {graduation_review_on_time_cycles: "=graduation_review_on_time_cycles", credit_line_review_months: "=credit_line_review_months"}
        Northgate Business Mastercard: {graduation_review_on_time_cycles: "=graduation_review_on_time_cycles", credit_line_review_months: "=credit_line_review_months"}

  - id: card_outside_rewards
    subject: [card_post_reward_credit, card_post_deposit]
    rule: >-
      On Mastercard tiers, purchases at merchants other than Northgate earn outside_rewards_pct of the purchase amount,
      net of merchant credits posted in the same cycle, and the cycle's rewards are credited to the balance at statement
      close, rounded half up to the cent. Cash advances, payments, fees and interest earn nothing, and closed-loop tiers
      earn no outside rewards. Rewards are not earned in a cycle that closes while the account is suspended. A security
      deposit is accepted only on Northgate Secured Card.
    eligibility: []
    params:
      per_tier:
        Northgate Secured Card: {outside_rewards_pct: "=outside_rewards_pct"}
        Northgate Store Card: {outside_rewards_pct: "=outside_rewards_pct"}
        Northgate Mastercard: {outside_rewards_pct: "=outside_rewards_pct"}
        Northgate World Mastercard: {outside_rewards_pct: "=outside_rewards_pct"}
        Northgate Business Store Card: {outside_rewards_pct: "=outside_rewards_pct"}
        Northgate Business Mastercard: {outside_rewards_pct: "=outside_rewards_pct"}

extended_policies:
- id: card_ext_duplicate_final_credit
  base_policy_refs:
  - card_dispute_credits
  - card_billing_dispute
  - card_evt_late_and_returned_fees
  overwrite:
  - base_policy: card_dispute_credits
    superseded_clause: When a dispute is resolved for the cardholder, a provisional credit becomes final with no further posting, and on a tier without provisional credit a final credit of the disputed amount posts.
    replaced_by: For a duplicate dispute this rule settles, and only for such a dispute, the final credit that posts on resolution for the cardholder is the duplicate-posting final credit worked out below instead of the disputed amount; every other dispute resolved for the cardholder keeps a provisional credit as final with no further posting or, on a tier without provisional credit, posts a final credit of the disputed amount.
  - base_policy: card_evt_late_and_returned_fees
    superseded_clause: A fee charged in error, or above the minimum-payment ceiling, is reversed in full as billing_error or for the excess as regulatory_cap.
    replaced_by: For the late fee recorded for the statement that first showed the disputed posting of a dispute this rule settles, and only where the late fee carried by the error worked out below is above zero, the part charged in error or above the dispute-adjusted minimum is credited inside the duplicate-posting final credit as worked out below instead of being reversed as a fee; where the late fee carried by the error is nothing, and for every other fee, a fee charged in error, or above the minimum-payment ceiling, is reversed in full as a billing error or for the excess as a regulatory cap correction.
  trigger: state_due
  subject:
  - card_dispute_credit
  - card_resolve_dispute
  computes: final_credit_usd
  target_tool: settle_duplicate_dispute_b93aba52
  params:
    noncompliance_keep_usd: 50.0
  rule: 'This rule settles one kind of dispute only: the most recent billing-error dispute on the account recorded with the reason duplicate, that is the one with the latest notice date and, of two received the same day, the one entered first in the account history, when that dispute still stands open, no resolution entry referring back to it, its source record is a Northgate order and the account''s tier posts no provisional dispute credit; when that most recent duplicate dispute has been resolved or withdrawn, has another source, or the tier posts provisional dispute credits, this rule settles nothing and its amount is nothing. The investigation of that dispute compares the card purchase postings that carry the order''s reference with what the Northgate order record charged, that is the order''s amount paid plus the refunds its order history books against it as returns, price adjustments and other refunds: when two or more such postings carry the order''s reference and together they exceed what the order charged, the investigation confirms the error at once, the dispute is resolved for the cardholder, its whole disputed amount leaves dispute status and the duplicate-posting final credit posts; in every other case this rule settles nothing and its amount is nothing. For a duplicate dispute this rule settles, and only for such a dispute, the final credit that posts on resolution for the cardholder is the duplicate-posting final credit worked out below instead of the disputed amount; every other dispute resolved for the cardholder keeps a provisional credit as final with no further posting or, on a tier without provisional credit, posts a final credit of the disputed amount. For the late fee recorded for the statement that first showed the disputed posting of a dispute this rule settles, and only where the late fee carried by the error worked out below is above zero, the part charged in error or above the dispute-adjusted minimum is credited inside the duplicate-posting final credit as worked out below instead of being reversed as a fee; where the late fee carried by the error is nothing, and for every other fee, a fee charged in error, or above the minimum-payment ceiling, is reversed in full as a billing error or for the excess as a regulatory cap correction. The duplicate-posting final credit is the disputed amount recorded on the dispute. The duplicate excess is the amount by which the purchase postings carrying the order''s reference exceed what the order record charged, and never less than zero. The settled principal is set by what the records show about the disputed posting: where a Northgate credit has posted against the disputed posting itself, the settled principal is the disputed amount less those credits; where no Northgate credit has posted against the disputed posting and the duplicate excess is above zero and below the disputed amount, the settled principal is the duplicate excess; in every other case the settled principal is the disputed amount. A payment is recorded against the statement whose balance it pays, and the payments recorded against a statement are all the payment entries that carry that statement''s closing date. The finance charge carried by the error is the duplicate excess times the tier''s purchase APR divided by 100 and by 365, times the carried-error days, rounded half up to the cent on its own. The carried-error days are set by the statement that first showed the disputed posting: where that statement charged purchase interest and the payments recorded against it total less than its new balance, they run from the posting date of the disputed posting to the notice date, the posting date counted and the notice date not; where that statement charged purchase interest and the payments recorded against it reach its new balance, they run from the posting date through that statement''s closing date, both counted; in every other case there are none. The correct part of the dispute is the disputed amount less the duplicate excess, and never less than zero. The dispute is past its resolution limit when the most recent statement on the account closed before today and at least the tier''s maximum resolution cycles in whole calendar months after the notice date, or when more than the tier''s maximum resolution days have passed from the notice date to today. The noncompliance allowance follows the resolution limit: where the dispute is past its resolution limit and the correct part is at least the noncompliance amount of this rule, the noncompliance allowance is that noncompliance amount; where the dispute is past its resolution limit and the correct part is below that amount, the noncompliance allowance is the correct part; in every other case there is no noncompliance allowance. The dispute-adjusted minimum is worked out in two steps: first the tier''s minimum payment percentage of the disputed amount, rounded half up to the cent, is taken off the minimum payment due printed on the statement that first showed the disputed posting, which still included that amount because the notice came after the statement closed; then, where what remains is below the tier''s minimum payment floor, the floor is used instead. The standing late fee is the late fee recorded for the statement that first showed the disputed posting, less every reversal already posted against that fee, never less than zero. The late fee carried by the error is set by that standing late fee: where the standing late fee is above zero, the dispute being settled is the only billing-error dispute on a transaction that statement first showed, its notice was received after that statement''s closing date and on or before its payment due date and the payments recorded against that statement reach the dispute-adjusted minimum, it is the whole standing late fee; where the standing late fee is above zero, the dispute being settled is the only billing-error dispute on a transaction that statement first showed, its notice was received after that statement''s closing date and on or before its payment due date, the payments recorded against that statement fall short of the dispute-adjusted minimum and the standing late fee is above the dispute-adjusted minimum, it is the standing late fee less the dispute-adjusted minimum; in every other case it is nothing. The interest reinstated on the correct part is set by the most recent statement on the account: where the correct part is above zero and that statement charged purchase interest, it is the correct part times the tier''s purchase APR divided by 100 and by 365, times the days from the notice date through that statement''s closing date, both counted, with no days when the notice came after that closing date, rounded half up to the cent; where the correct part is above zero and that statement charged no purchase interest but a minimum interest charge, it is the tier''s minimum interest charge; in every other case it is nothing. The amount posted adds together every amount this rule credits and takes away every amount it reinstates, each item already in whole cents, and the total is kept to the cent with no further rounding.'
  prerequisite: []
  cross_category:
  - category: order
    as: branch
    reads:
    - amount_paid_usd
    - order_events.amount_usd
    note: The duplicate excess compares the card postings carrying the order's reference with the order record's amount paid plus the refunds its order history books.
  compute:
  - d_id: LATEST('card_events','card_event_id', date_field='event_date', event_type='card_open_dispute', dispute_reason='duplicate')
  - d_ref: LATEST('card_events','original_transaction_reference', date_field='event_date', event_type='card_open_dispute', dispute_reason='duplicate')
  - d_resolved: COUNT('card_events', event_type='card_resolve_dispute', original_event_id=d_id)
  - d_amt: LATEST('card_events','amount_usd', date_field='event_date', event_type='card_open_dispute', dispute_reason='duplicate') or 0
  - d_date: LATEST('card_events','event_date', date_field='event_date', event_type='card_open_dispute', dispute_reason='duplicate')
  - d_src: LATEST('card_events','source_record_id', date_field='event_date', event_type='card_open_dispute', dispute_reason='duplicate')
  - d_stmt: LATEST('card_events','statement_date', date_field='event_date', event_type='card_open_dispute', dispute_reason='duplicate')
  - post_date: LATEST('card_events','event_date', date_field='event_date', event_type='card_post_purchase', transaction_reference=d_ref)
  - order_rec: CFIELD('order','order_id', order_id=d_src)
  - order_postings: SUM('card_events','amount_usd', event_type='card_post_purchase', source_record_id=d_src)
  - order_post_count: COUNT('card_events', event_type='card_post_purchase', source_record_id=d_src)
  - order_paid: CFIELD('order','amount_paid_usd', order_id=d_src) or 0
  - order_refunds: XSUM('order','order_events','amount_usd', event_type='order_return_line', order_id=d_src) + XSUM('order','order_events','amount_usd', event_type='order_adjust_price', order_id=d_src) + XSUM('order','order_events','amount_usd', event_type='order_refund_charge', order_id=d_src)
  - order_charged: RND(order_paid + order_refunds, 2)
  - confirmed: d_amt > 0 and d_resolved == 0 and order_rec != None and P('provisional_credit_on_open') == False and order_post_count >= 2 and order_postings > order_charged
  - dup_excess: MX(0, RND(order_postings - order_charged, 2))
  - posting_credits: SUM('card_events','amount_usd', event_type='card_post_credit', original_transaction_reference=d_ref)
  - principal: RND(d_amt - posting_credits, 2) if posting_credits > 0 else (dup_excess if (dup_excess > 0 and dup_excess < d_amt) else d_amt)
  - first_paid: SUM('card_events','amount_usd', event_type='card_post_payment', statement_date=d_stmt)
  - first_purchase_int: SUM('card_events','amount_usd', event_type='card_assess_interest', interest_type='purchase', statement_date=d_stmt)
  - first_nb: LATEST('card_events','new_balance_usd', date_field='event_date', event_type='card_issue_statement', statement_date=d_stmt) or 0
  - carried_days: DAYS(post_date, d_date) if (post_date and first_purchase_int > 0 and first_paid < first_nb) else ((DAYS(post_date, d_stmt) + 1) if (post_date and first_purchase_int > 0 and first_paid >= first_nb) else 0)
  - carried_interest: RND(dup_excess * P('purchase_apr_pct') / 100 / 365 * carried_days + 0.000000001, 2)
  - correct_part: MX(0, RND(d_amt - dup_excess, 2))
  - latest_close: LATEST('card_events','statement_date', date_field='statement_date', event_type='card_issue_statement')
  - past_limit: d_amt > 0 and ((latest_close < NOW and MONTHS(d_date, latest_close) >= P('dispute_max_resolution_cycles')) or DAYS(d_date, NOW) > P('dispute_max_resolution_days'))
  - allowance: K('noncompliance_keep_usd') if (past_limit and correct_part >= K('noncompliance_keep_usd')) else (correct_part if (past_limit and correct_part < K('noncompliance_keep_usd')) else 0)
  - first_min: LATEST('card_events','minimum_due_usd', date_field='event_date', event_type='card_issue_statement', statement_date=d_stmt) or 0
  - first_due: LATEST('card_events','payment_due_date', date_field='event_date', event_type='card_issue_statement', statement_date=d_stmt)
  - adj_min: MX(P('min_payment_floor_usd'), RND(first_min - RND(P('min_payment_pct_of_balance') / 100 * d_amt + 0.000000001, 2), 2))
  - fee_id: LATEST('card_events','card_event_id', date_field='event_date', event_type='card_assess_fee', fee_type='late_payment', statement_date=d_stmt)
  - fee_amt: LATEST('card_events','amount_usd', date_field='event_date', event_type='card_assess_fee', fee_type='late_payment', statement_date=d_stmt) or 0
  - fee_reversed: SUM('card_events','amount_usd', event_type='card_reverse_fee', original_event_id=fee_id)
  - standing_fee: MX(0, RND(fee_amt - fee_reversed, 2))
  - stmt_disputes: COUNT('card_events', event_type='card_open_dispute', dispute_track='billing_error', statement_date=d_stmt)
  - carried_fee: standing_fee if (standing_fee > 0 and stmt_disputes == 1 and d_date > d_stmt and d_date <= first_due and first_paid >= adj_min) else (RND(standing_fee - adj_min, 2) if (standing_fee > 0 and stmt_disputes == 1 and d_date > d_stmt and d_date <= first_due and first_paid < adj_min and standing_fee > adj_min) else 0)
  - latest_purchase_int: SUM('card_events','amount_usd', event_type='card_assess_interest', interest_type='purchase', statement_date=latest_close)
  - latest_min_charge: SUM('card_events','amount_usd', event_type='card_assess_interest', interest_type='minimum_charge', statement_date=latest_close)
  - reinstated: RND(correct_part * P('purchase_apr_pct') / 100 / 365 * MX(0, DAYS(d_date, latest_close) + 1) + 0.000000001, 2) if (correct_part > 0 and latest_purchase_int > 0) else (P('minimum_interest_charge_usd') if (correct_part > 0 and latest_purchase_int == 0 and latest_min_charge > 0) else 0)
  - result: RND(principal + carried_interest + allowance + carried_fee - reinstated + 0.000000001, 2) if confirmed else 0
