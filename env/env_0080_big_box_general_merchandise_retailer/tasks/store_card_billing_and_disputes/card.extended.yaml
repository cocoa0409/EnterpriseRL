  factors:
  - id: settled_principal
    effect: method
    decides: principal
    bindings:
    - posting_credits
    - principal
    ladder:
    - when: a Northgate credit has posted against the disputed posting itself
      method: the disputed amount less those credits
    - when: no Northgate credit has posted against the disputed posting and the duplicate excess is above zero and below the disputed amount
      method: the amount by which the purchase postings carrying the order's reference exceed what the order record charged
    - when: otherwise
      method: the disputed amount
    baseline:
      principal: d_amt
    evidence:
    - history
    cross_difficulty: null
  - id: carried_error_days
    effect: parameter
    decides: carried_days
    bindings:
    - post_date
    - first_purchase_int
    - first_nb
    - carried_days
    - carried_interest
    ladder:
    - when: that statement charged purchase interest and the payments recorded against it total less than its new balance
      value: from the posting date of the disputed posting to the notice date, the posting date counted and the notice date not
    - when: that statement charged purchase interest and the payments recorded against it reach its new balance
      value: from the posting date through that statement's closing date, both counted
    - when: otherwise
      value: '0'
    baseline:
      carried_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: noncompliance_allowance
    effect: parameter
    decides: allowance
    bindings:
    - past_limit
    - allowance
    ladder:
    - when: the dispute is past its resolution limit and the correct part is at least the noncompliance amount of this rule
      value: K('noncompliance_keep_usd')
    - when: the dispute is past its resolution limit and the correct part is below that amount
      value: the correct part
    - when: otherwise
      value: '0'
    baseline:
      allowance: '0'
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: error_late_fee
    effect: parameter
    decides: carried_fee
    bindings:
    - first_min
    - first_due
    - adj_min
    - fee_id
    - fee_amt
    - fee_reversed
    - standing_fee
    - stmt_disputes
    - carried_fee
    ladder:
    - when: the standing late fee is above zero, the dispute being settled is the only billing-error dispute on a transaction that statement first showed, its notice was received after that statement's closing date and on or before its payment due date and the payments recorded against that statement reach the dispute-adjusted minimum
      value: the whole standing late fee
    - when: the standing late fee is above zero, the dispute being settled is the only billing-error dispute on a transaction that statement first showed, its notice was received after that statement's closing date and on or before its payment due date, the payments recorded against that statement fall short of the dispute-adjusted minimum and the standing late fee is above the dispute-adjusted minimum
      value: the standing late fee less the dispute-adjusted minimum
    - when: otherwise
