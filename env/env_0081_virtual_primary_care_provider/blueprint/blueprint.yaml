name: env_0081_virtual_primary_care_provider
company: Larkspur Health
background: |
  Larkspur Health is a US telehealth and virtual primary care practice, headquartered in Boston, whose employed physicians, nurse practitioners and licensed therapists see roughly 410,000 patients a year by secure video and in-app messaging, with a calm, plain-spoken and clinically careful tone of voice.
  Patients come to Larkspur directly as consumers or through their employer, and every patient keeps one Larkspur profile that carries everything they hold across the product lines.
  Consumers hold a Larkspur Membership, a running subscription on one of six tiers: Larkspur Access, Larkspur Essentials Monthly, Larkspur Essentials Annual, Larkspur Plus Monthly, Larkspur Plus Annual and Larkspur Premier Annual; memberships are billed as dues per billing period and can carry account credit.
  Employers buy Larkspur at Work for their workforce, and each covered employee or dependent holds an enrollment on the employer's chosen plan: Larkspur at Work Virtual Urgent Care, Larkspur at Work Core, Larkspur at Work Core with Behavioral Health, Larkspur at Work Enhanced, Larkspur at Work Total Care or Larkspur at Work Total Care Plus, fed by the employer's eligibility file and funded partly by employee payroll contributions.
  Patients who prefer to pay as they go can buy Larkspur Visit Packs, prepaid bundles of visit credits: the Urgent Care 3-Visit Pack, Urgent Care 6-Visit Pack, Primary Care 4-Visit Pack, Behavioral Health 4-Session Pack, Behavioral Health 8-Session Pack and Behavioral Health 12-Session Pack, each with its own credit ledger.
  Every appointment is a Virtual Visit of one of seven types, from the Asynchronous Message Consult and Urgent Care Video Visit through the Primary Care Follow-Up Visit, Primary Care New Patient Visit, Annual Preventive Video Visit, Behavioral Health Follow-Up Session and Behavioral Health Initial Assessment, and each visit books its own fees, cost-share collections and refunds.
  Prescriptions written by Larkspur clinicians are filled either by Larkspur Pharmacy, the company's licensed home-delivery pharmacy, under its cash formulary levels Larkspur Rx Value Generics, Larkspur Rx Core Generics, Larkspur Rx Extended Generics, Larkspur Rx Specialty Generics, Larkspur Rx Preferred Brands and Larkspur Rx Non-Preferred Brands, or by a retail pharmacy the patient names; each fill and shipment is booked against the prescription.
  Lab work is ordered as a Lab Order for one of six panels, the Hemoglobin A1c Test, Lipid Panel, Comprehensive Metabolic Panel, Thyroid Panel with Reflex, STI Screening Panel and Comprehensive Wellness Panel, collected at a partner patient service center or with an at-home kit, and each order books its own panel, collection and kit charges.
  Patients who use health insurance keep their coverage on file as Insurance Coverage records on six plan types, Commercial HMO Coverage, Commercial EPO Coverage, Commercial POS Coverage, Commercial PPO Coverage, High-Deductible Health Plan Coverage and Out-of-Network Coverage, and Larkspur's billing office files claims against them, posts payer remittances and keeps a running patient balance.
  When care has to continue in person, clinicians issue an In-Person Care Referral, from an In-Person Primary Care Referral or Physical Therapy Referral to a Diagnostic Imaging Referral, Specialist Consultation Referral, Behavioral Health Specialty Referral or Surgical Consultation Referral, coordinated with outside providers and, where the plan requires it, the patient's insurer.
  Larkspur is in network with six commercial health plans in the states where its clinicians hold licenses, and patients without in-network coverage pay self-pay prices.
  The patients who contact support are mostly working adults between 22 and 64, many with a membership or an employer plan on top of insurance coverage, a few recent visits, one or two maintenance prescriptions and an occasional lab order or referral.
  They bring a history of dues charges, failed card payments, visit fees, cancelled and missed appointments, pack credits used and reinstated, pharmacy fills and shipments, lab collections, payer remittances and patient statements, and they usually call about what one of those charges was, whether it should have happened, or what they can do next.
logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs
difficulties:
  - name: membership_dues_and_changes
    claim:
      categories: [membership]
      event_types: [membership_dues_charged, membership_upgrade_proration_charged, membership_dues_refunded, membership_credit_issued, membership_credit_applied, membership_credit_expired, membership_tier_changed, membership_cancelled, membership_trial_cancelled, membership_paused, membership_auto_renew_changed, membership_payment_recovered, membership_reactivated]
    summary: >
      Consumer members call about Larkspur Membership money and changes: a dues charge they did not expect after a trial or an
      annual renewal, a card decline that left the membership past due or suspended, a wish to upgrade, downgrade or switch between
      monthly and annual billing, a pause, turning auto-renew off, a cancellation with a refund question, or credit they believe they
      earned for a referral or for a visit Larkspur cancelled; the setting varies with the tier held (from Larkspur Access to
      Larkspur Premier Annual), the membership status, where the patient is in the billing period and the membership year, and
      whether the patient is joining from or overlapping with a Larkspur at Work employer enrollment.
      The records involved are the membership itself, its billing lines, credit lines, notices and change requests, and, read from
      other product lines, the patient's visit appointments (completed visits decide whether a refund window still applies, and a
      visit cancelled by Larkspur is what earns a goodwill credit) and Larkspur at Work enrollments; the governing rules are the state
      gates on each change, the refund order and windows in membership_cancellation_refund, the upgrade proration in
      membership_tier_change, credit issuance, caps and expiry in membership_evt_credits, retry and grace handling in
      membership_evt_failed_payment, pause limits in membership_pause and the employer conversion discount and overlap refund in
      membership_sponsor_coordination, all priced per tier from the membership catalogue.
      In the natural order of the business a membership is enrolled, may trial, is billed each period, may fail a payment and recover,
      may change tier or pause, and finally closes, and refunds and credits always point to the exact billing line or credit they
      settle.
      Billing lines, credits, tier changes, renewals settings and pause starts are agent service actions on a verified account, while
      ending the membership is the patient's own decision and is carried out by the patient through a hand-over, after the agent has
      registered the request.
      Requests no membership rule decides, such as a cash payout of account credit, a refund to a different card or person, waiving a
      chargeback the issuer already reversed, or pricing the patient negotiated elsewhere, are uncovered and go to a human
      representative as POLICY_NOT_COVERED.
  - name: virtual_visit_booking_and_fees
    claim:
      categories: [visit]
      event_types: [visit_booked, visit_rescheduled, visit_cancelled, visit_late_cancelled, visit_fee_charged, visit_after_hours_surcharge_charged, visit_cost_share_collected, visit_late_cancel_fee_charged, visit_no_show_fee_charged, visit_charge_refunded, visit_payment_path_changed, visit_gfe_issued]
    summary: >
      Patients call to book, move or cancel a virtual visit and to question what a visit cost them: a fee higher than they expected,
      an after-hours surcharge, a copay or deductible estimate collected at booking, a late-cancellation or no-show fee, a refund
      that has not appeared, or a missing Good Faith Estimate; the setting varies with the visit type, the scheduled time and where
      the patient will be, the payment path the visit falls on, and the patient's other holdings, because a Larkspur at Work plan, a
      membership tier, a visit pack and a verified insurance coverage can each change how the same visit is paid.
      The records involved are the visit appointment, its billing lines, estimates and fee reviews, and, read from other product lines,
      the patient's membership (tier and status decide member prices, included visits, surcharge and fee exemptions), Larkspur at Work
      enrollment, visit packs and insurance coverage benefit figures; the governing rules are the path order in
      visit_evt_payment_path, prices in visit_evt_fee_pricing, the surcharge in visit_evt_after_hours, the booking estimate in
      visit_evt_insurance_cost_share, windows, fees and courtesy waivers in visit_cancellation_fees, rescheduling limits in
      visit_rescheduling, licensure, age and established-patient gates in visit_booking_eligibility, and the No Surprises Act estimate
      duties in visit_evt_gfe, with per-visit-type values in the visit catalogue.
      In the natural order of the business a visit is booked on one path and charged at booking, may be rescheduled or have its path
      change before it starts, and then is attended, cancelled, missed or cancelled by Larkspur, each outcome settling its own lines.
      Booking, rescheduling, cancelling, charging and refunding are agent service actions on a verified account, while choosing
      between insurance, a pack and paying directly is the patient's own choice and asking for a fee review is the patient's own
      request, which the billing team decides.
      Situations outside every visit rule, such as care for a patient physically outside every licensed state, a request to treat an
      emergency virtually, a dispute the patient takes to federal dispute resolution, or compensation beyond refunds and credits, are
      uncovered and go to a human representative as POLICY_NOT_COVERED.
  - name: pharmacy_fills_and_renewals
    claim:
      categories: [rx]
      event_types: [rx_fill_dispensed, rx_fill_charged, rx_shipping_charged, rx_charge_refunded, rx_fill_reshipped, rx_fill_returned, rx_prescription_written, rx_transferred_out, rx_auto_refill_changed, rx_billing_choice_changed, rx_hold_released]
    summary: >
      Patients call Larkspur Pharmacy about their prescriptions: a refill that will not ship yet, a fill price that differs from last
      time, a shipping charge, a package that never arrived or arrived damaged, a renewal for an expiring prescription, moving a
      prescription to a retail pharmacy, auto-refill, or switching between their pharmacy benefit and the cash price; the setting
      varies with the formulary level of the drug, the days supply and fill units left, the prescription's status and hold reason, the
      timing of the last fill, and the patient's membership tier and insurance coverage.
      The records involved are the prescription, its fill movements, billing lines and pharmacy requests, and, read from other product
      lines, the patient's membership (which sets the cash discount and free expedited shipping), insurance coverage (whose pharmacy
      benefit must be verified) and visit appointments (a recent completed qualifying visit decides whether a renewal needs a new
      visit); the governing rules are the cash and benefit pricing in rx_evt_fill_pricing, shipping fees in rx_evt_shipping, the
      refill-too-soon clock and override in rx_refill_timing, renewal requirements and bridge supplies in rx_renewals, hold limits in
      rx_holds, transfer limits in rx_transfers, and the no-returns, lost-package and undeliverable handling in rx_returns_and_reships,
      with per-level values in the rx catalogue.
      In the natural order of the business a prescription is written at a completed visit, authorizes fill units, ships fill by fill
      until it completes, expires, is transferred out or is replaced by a renewal, with holds pausing it in between.
      Dispensing, charging, refunding, reshipping and recording transfers are agent service actions on a verified account, while the
      choice of pharmacy, of benefit or cash billing and of auto-refill belongs to the patient, and renewals and new prescriptions are
      written only by a clinician.
      Requests no pharmacy rule decides, such as a controlled substance, returning dispensed medication that was filled correctly, a
      price match with another pharmacy, or a clinical question about dosing, are uncovered and go to a human representative as
      POLICY_NOT_COVERED.
  - name: lab_orders_and_collection_fees
    claim:
      categories: [lab]
      event_types: [lab_ordered, lab_panel_charged, lab_collection_fee_charged, lab_charge_refunded, lab_cancelled, lab_kit_cancelled, lab_collection_method_changed, lab_payment_path_changed, lab_requisition_reissued]
    summary: >
      Patients call about lab work their clinician ordered: what a panel and its draw, kit or mobile phlebotomy fee cost, why they were
      charged when they expected the panel to be included, switching from a service center to an at-home kit, cancelling before
      collection, an expired requisition, or a rejected specimen that needs a redraw; the setting varies with the panel, the
      collection method, the order's status and dates, the patient's home state, and whether a Larkspur at Work plan, a membership
      benefit or insurance pays.
      The records involved are the lab order and its billing lines, and, read from other product lines, the ordering visit (its
      completion date opens the ordering window), the patient's membership tier and status, Larkspur at Work enrollment and insurance
      coverage; the governing rules are the path order in lab_evt_payment_path, panel prices in lab_evt_panel_pricing, collection fees
      and waivers in lab_evt_collection_fees, ordering gates in lab_ordering_eligibility, duplicate and frequency limits in
      lab_agg_duplicate_testing, refunds, expiry and reissue in lab_cancellation_and_expiry, and redraw charging in
      lab_specimen_rejection_redraws, with per-panel values in the lab catalogue.
      In the natural order of the business a panel is ordered from a completed visit and charged at ordering, a kit may ship, the
      specimen is collected, resulted and reviewed, or the order is cancelled, expires or is rejected and redrawn.
      Ordering follow-ups, changing the method or path, charging, refunding and reissuing are agent service actions on a verified
      account, while the choice of collection method and of insurance or paying directly is the patient's own, and only a clinician
      orders a panel.
      Situations no lab rule decides, such as a bill the partner lab sent the patient directly for an insurance-billed panel, a request
      to order a test no clinician has ordered, or interpreting results, are uncovered and go to a human representative as
      POLICY_NOT_COVERED.
  - name: insurance_claims_and_patient_balances
    claim:
      categories: [claim]
      event_types: [claim_coverage_added, claim_coverage_details_changed, claim_coverage_terminated, claim_coverage_order_changed, claim_corrected_submitted, claim_self_pay_rebill_posted, claim_time_of_service_applied, claim_patient_payment_posted, claim_prompt_pay_discount_applied, claim_small_balance_written_off, claim_credit_transferred, claim_credit_received, claim_credit_refunded]
    summary: >
      Patients who use insurance call about the bill that follows a visit: a statement they do not understand, a balance after their
      copay or deductible estimate, a denial for terminated coverage or a missing PCP designation, a credit they are owed, a new or
      changed insurance card, which of two coverages pays first, a payment, a prompt-pay discount, a payment plan or a hardship
      request; the setting varies with the plan type, payer and benefit figures on the coverage, the claim's remittance or denial
      code, the statement history, and the patient's other open balances.
      The records involved are the insurance coverage, its claims, remittances, balance entries, statements and billing requests, and,
      read from other product lines, the billed visit appointment and its booking collections, the visit type's list and member
      prices and the patient's membership on the service date (which set a price-path rebill); the governing rules are coordination in
      claim_agg_coordination_of_benefits, verification in claim_coverage_verification, timely filing and corrected claims in
      claim_evt_submission, posting in claim_evt_remittance_posting, denial outcomes in claim_denial_handling, statements and
      small balances in claim_statements_and_collections, discounts and payment plans in claim_payments_and_discounts, and credit moves
      and refunds in claim_credits_and_refunds, with per-plan-type values in the claim catalogue and per-payer filing limits in its
      policy parameters.
      In the natural order of the business a coverage is added and verified, a completed visit is claimed, the remittance or denial is
      posted against what was collected at booking, and the resulting balance is stated, paid, discounted, adjusted or turned into a
      credit that is moved or refunded.
      Coverage updates, corrected claims, postings, write-offs, credit moves and refunds are agent service actions on a verified
      account, while the card details are read out by the patient, a payment plan or hardship review is the patient's own request, and
      an appeal to the payer is the patient's own right.
      Requests no billing rule decides, such as asking Larkspur to overturn a payer's adjudication, billing a payer Larkspur is not in
      network with, waiving insured cost share as a courtesy, or settling a balance already with the collections partner, are
      uncovered and go to a human representative as POLICY_NOT_COVERED.
