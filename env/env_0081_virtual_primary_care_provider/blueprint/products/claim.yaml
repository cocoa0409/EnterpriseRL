# Product charter: claim. Larkspur Health.
category: claim
display_name: Insurance Billing
binding:
  holding_table: insurance_coverages
  event_tables:
  - insurance_claims
  - claim_remittances
  - patient_balance_entries
  - patient_statements
  intake_tables:
  - claim_billing_requests
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - pending_verification
  - verified
  - verification_failed
  - terminated
  transitions:
  - from: pending_verification
    to: verified
    by: system
    means: The payer's eligibility response confirms active coverage and returns current benefits.
  - from: pending_verification
    to: verification_failed
    by: system
    means: The payer finds no active coverage for the details given.
  - from: verification_failed
    to: pending_verification
    by: agent
    means: The patient corrects the card details and the coverage is submitted for verification again.
  - from: verified
    to: pending_verification
    by: agent
    means: The patient changes the member ID or group number on a verified coverage
    which must be verified again.: null
  - from: verified
    to: terminated
    by: system
    means: The payer reports
    or the patient tells Larkspur: null
    that the coverage has ended.: null
  - from: pending_verification
    to: terminated
    by: system
    means: The coverage turns out to have ended before it could be verified.
accounts:
- key: patient_balance
  unit: USD
  meaning: What the patient owes Larkspur on insurance-billed visits; patient responsibility and self-pay rebills
    add to it, time-of-service collections, payments, discounts and write-offs reduce it, and a negative balance
    is a credit owed to the patient.
parameter_schema:
  claims_filed_by_larkspur: Whether Larkspur files claims to the payer for this plan type; boolean.
  superbill_provided: Whether Larkspur gives the patient an itemized superbill to submit to the payer themselves;
    boolean.
  superbill_delivery_business_days: Business days after the visit (or the request) within which the superbill is
    delivered.
  time_of_service_basis: 'What is collected at booking on visits billed to this plan type: estimate (copay or deductible/coinsurance
    estimate under the visit rules) or price_path (the visit is priced as self-pay or member rate).'
  pcp_designation_required: Whether the payer requires Larkspur to be the member's primary care provider of record
    for primary care visits; boolean.
  pcp_required_visit_types: Visit types that need PCP designation on plan types requiring it.
  pcp_cure_days: Calendar days after a pcp_not_designated denial within which the patient may designate Larkspur
    so a corrected claim can be filed.
  reverification_interval_days: Calendar days after last_verified_date after which coverage must be verified again
    before a visit is billed.
  preventive_zero_cost_share: Whether in-network preventive services carry no cost share when the plan is not grandfathered
    (ACA section 2713); boolean.
  secondary_billing: Whether a secondary coverage is billed after the primary remittance; boolean.
  secondary_submit_days_after_primary: Calendar days after the primary remittance within which the secondary claim
    is submitted.
  cob_order_rule: 'How primary and secondary are set: self_then_birthday (the patient''s own coverage first; for
    a child, the parent whose birthday month-and-day falls earlier in the year).'
  claim_submission_target_business_days: Business days after the service date within which Larkspur submits the
    claim.
  balance_billing_prohibited: Whether the patient may never be billed the difference between billed and allowed
    amounts (in-network contract); boolean.
  timely_filing_denial_handling: 'Who bears a timely-filing denial: provider_writeoff (the patient is never billed).'
  eligibility_denial_handling: 'Handling of an eligibility_terminated denial: rebill_price_path (the patient owes
    what the visit would have cost on the price path).'
  not_covered_denial_handling: 'Handling of a not_covered_service denial: rebill_price_path.'
  pcp_denial_handling: 'Handling of a pcp_not_designated denial: corrected_claim_if_cured_else_rebill_price_path.'
  missing_information_handling: 'Handling of a missing_information denial: corrected_claim (never billed to the
    patient).'
  duplicate_denial_handling: 'Handling of a duplicate_claim denial: no_action (the original claim stands).'
  statement_first_days_after_remit: Calendar days after the remittance (or rebill) on which the first statement
    is issued.
  statement_cycle_days: Calendar days between statements while a balance stays unpaid.
  statement_due_days: Calendar days after the statement date by which payment is due.
  statements_before_collections: Statements issued before an unpaid balance may be referred to collections; count.
  collections_min_days_after_first_statement: Calendar days after the first statement before a balance may be referred
    to collections.
  collections_min_balance: Smallest balance that may be referred to collections; USD.
  small_balance_writeoff_threshold: A claim balance at or below this amount when a statement would be issued is
    written off instead; USD.
  prompt_pay_discount_pct: Percent off a self-pay rebill balance paid in full by the prompt-pay deadline; percent.
  prompt_pay_days: Calendar days after the first statement date within which full payment earns the prompt-pay discount.
  prompt_pay_applies_to: 'Balances eligible for the prompt-pay discount: self_pay_rebill only (insured cost share
    is never discounted).'
  payment_plan_min_balance: Smallest total open balance that may be put on a payment plan; USD.
  payment_plan_max_months: Longest payment plan; months.
  payment_plan_min_monthly: Smallest monthly installment; USD.
  payment_plan_interest_pct: Interest charged on payment plans; percent.
  payment_plan_pauses_collections: Whether a balance on an approved payment plan in good standing is never referred
    to collections; boolean.
  hardship_full_fpl_pct: Household income at or below this percent of the federal poverty guideline qualifies for
    a full hardship adjustment; percent.
  hardship_partial_fpl_pct: Household income at or below this percent of the poverty guideline (and above the full
    level) qualifies for a partial hardship adjustment; percent.
  hardship_partial_discount_pct: Percent of the open balance adjusted under a partial hardship approval; percent.
  hardship_applies_to: 'Balances a hardship adjustment may reduce: self_pay_rebill and patient_responsibility.'
  credit_apply_to_open_balances_first: Whether a credit on one claim is first moved to the patient's other open
    claim balances (oldest service date first) before any refund; boolean.
  credit_refund_days: Calendar days after a claim balance turns into a credit within which the remaining credit
    is refunded to the card.
  credit_refund_minimum: Smallest credit refunded; a smaller credit stays on file for future balances; USD.
  corrected_claim_allowed: Whether a corrected claim may replace a denied or wrongly adjudicated claim; boolean.
  member_internal_appeal_days: Days after a denial notice within which the member may file their own internal appeal
    with the payer (ACA); calendar days.
  member_appeal_records_business_days: Business days within which Larkspur sends the records a patient requests
    for their own appeal.
  accumulator_refresh_on_remit: Whether deductible_met and oop_met on the coverage are refreshed from each remittance;
    boolean.
  billing_rounding: 'Rounding of computed billing amounts: half_up_cent.'
  max_corrected_claims_per_visit: Corrected claims that may be filed for one visit; count.
  payment_plan_missed_installments_limit: Missed installments after which a payment plan ends and the remaining
    balance returns to the statement cycle; count.
