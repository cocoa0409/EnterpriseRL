# Product charter: lab. Larkspur Health.
category: lab
display_name: Lab Orders
binding:
  holding_table: lab_orders
  event_tables:
  - lab_charges
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - ordered
  - kit_shipped
  - collected
  - resulted
  - reviewed
  - specimen_rejected
  - cancelled
  - expired
  transitions:
  - from: ordered
    to: kit_shipped
    by: system
    means: The at-home collection kit ships to the patient.
  - from: ordered
    to: collected
    by: system
    means: The specimen is drawn at a partner patient service center or by a mobile phlebotomist.
  - from: kit_shipped
    to: collected
    by: system
    means: The lab receives the returned kit with its specimen.
  - from: collected
    to: resulted
    by: system
    means: The lab reports results.
  - from: collected
    to: specimen_rejected
    by: system
    means: The lab cannot process the specimen and reports a rejection reason.
  - from: resulted
    to: reviewed
    by: system
    means: A clinician reviews the results and releases the interpretation.
  - from: ordered
    to: cancelled
    by: agent
    means: The order is cancelled at the patient's request before collection.
  - from: kit_shipped
    to: cancelled
    by: agent
    means: The order is cancelled at the patient's request after the kit shipped and before it is returned.
  - from: ordered
    to: expired
    by: system
    means: The requisition expiry date passes with no collection.
  - from: kit_shipped
    to: expired
    by: system
    means: The kit is not returned by the requisition expiry date.
accounts:
- key: lab_billed
  unit: USD
  meaning: Net amount Larkspur charged the patient for one lab order (panel and collection fees less refunds).
parameter_schema:
  panel_price: Self-pay price of the panel; USD.
  member_price_by_membership_tier: Panel price on the member_rate path by membership tier; mapping tier -> USD;
    0.00 means included without limit.
  included_per_membership_year_by_tier: Panels of this kind included at no charge per membership year before the
    member price applies; mapping tier -> count.
  member_price_statuses: Membership statuses that qualify for membership_included or member_rate.
  sponsor_covered_by_plan: Whether the Larkspur at Work plan pays the panel; mapping plan -> boolean.
  sponsor_employee_fee_by_plan: Amount the covered patient pays on the sponsor_plan path; mapping plan -> USD.
  sponsor_per_plan_year_by_plan: Panels of this kind the plan pays per plan year; mapping plan -> count or unlimited
    (0 where not covered).
  kit_fee_waived_sponsor_plans: Larkspur at Work plans that also pay the at-home kit or mobile phlebotomy fee on
    the sponsor_plan path.
  insurance_billable: Whether the partner lab may bill the patient's in-network insurance for the panel; boolean.
  insurance_billed_by: 'Who bills insurance for the panel: partner_lab (Larkspur posts no panel charge on the insurance
    path).'
  cpt_codes: CPT codes the lab bills for the panel.
  panel_components: Component tests contained in the panel, used for duplicate checks.
  duplicate_component_window_days: Calendar days within which a panel sharing a component with another open or collected
    order of the patient is refused.
  repeat_frequency_min_days: Minimum calendar days between the collected_date of a completed panel of this kind
    and the ordered_date of the next one.
  collection_methods_available: Collection methods offered for the panel.
  specimen_type: 'Specimen collected: capillary_or_venous_blood, venous_blood, or urine_swab_and_blood.'
  psc_draw_fee: Draw fee at a partner patient service center on the self_pay and member_rate paths; USD.
  at_home_kit_fee: Fee for an at-home collection kit including return shipping; USD.
  mobile_phlebotomy_fee: Fee for a mobile phlebotomist home visit; USD.
  collection_fee_paths: Payment paths on which the at-home kit or mobile phlebotomy fee is charged.
  collection_fee_waived_membership_tiers: Membership tiers whose members never pay a kit or mobile phlebotomy fee.
  mobile_phlebotomy_states: States where mobile phlebotomy is available, by the patient's home_state.
  mobile_booking_lead_days: Calendar days ahead a mobile phlebotomy appointment must be booked.
  kit_ship_excluded_states: Home states to which at-home kits are not shipped.
  kit_shipping_business_days: Business days for the kit to reach the patient.
  kit_specimen_stability_hours: Hours between kit collection and lab receipt beyond which the specimen is rejected
    as received_too_late.
  requisition_validity_days: Calendar days from ordered_date to requisition_expiry_date.
  kit_return_window_days: For kits, calendar days from kit_shipped_date by which the kit must be collected and sent
    back (requisition_expiry_date is the earlier of this and the requisition validity).
  requisition_reissues_allowed: Times an expiring requisition may be reissued with a new validity period; count.
  requisition_reissue_window_days: Calendar days before requisition_expiry_date within which a reissue may be requested.
  fasting_hours: Hours of fasting required before collection (0 = none).
  min_patient_age_months: Minimum patient age in completed months on the ordered_date (216 = 18 years).
  order_requires_completed_visit: Whether the order must come from a completed visit; boolean.
  ordering_window_days: Calendar days after the ordering visit's completed_date within which the order may be placed.
  max_open_orders_same_panel: Orders of the same panel in status ordered or kit_shipped at once per patient; count.
  result_turnaround_business_days: Business days after collection by which results are expected.
  clinician_review_business_days: Business days after resulted_date within which a clinician reviews results.
  lab_side_rejection_reasons: Rejection reasons treated as the lab's or Larkspur's responsibility.
  free_patient_side_redraws: Redraws after a patient-side rejection (any reason not in lab_side_rejection_reasons)
    at no charge per original order; count.
  redraw_window_days: Calendar days after the rejection within which a redraw order may be placed.
  cancellation_refund_before_collection: 'Refund on cancellation before collection: panel charge in full, plus the
    collection fee unless the kit has shipped.'
  kit_fee_refundable_after_shipment: Whether the kit fee is refunded once the kit has shipped; boolean.
  expired_refund_processing_fee: Amount kept from the panel refund when a requisition expires unused; USD.
  expired_refund_request_days: Calendar days after expiry within which the patient may ask for the expired-order
    refund.
  charge_timing: 'When the panel and collection fees are charged: at_order.'
  price_rounding: 'Rounding of computed lab amounts: half_up_cent.'
  kit_replacement_on_damage: Whether a kit that arrives damaged is replaced at no charge without a new order; boolean.
  psc_draw_fee_paths: Payment paths on which the patient service center draw fee is charged (on the other paths
    the draw is billed with the panel or paid by the plan).
