- id: membership_tier_change
  subject:
  - membership_tier_changed
  - membership_upgrade_proration_charged
  rule: 'A tier change is an upgrade when the new tier''s proration_monthly_rate is higher than the current tier''s
    and a downgrade when it is lower; a move between the monthly and annual version of the same plan family (Larkspur
    Essentials Monthly and Larkspur Essentials Annual, or Larkspur Plus Monthly and Larkspur Plus Annual) is a cycle
    switch instead, allowed only when the current tier''s cycle_switch_allowed is true. A tier change may be requested
    only while the membership status is active. A tier change is refused when membership_msr_tier_changes_year has
    already reached the current tier''s tier_changes_per_membership_year. An upgrade, and a cycle switch from monthly
    to annual, takes effect immediately: a new billing period at the new tier starts on the change date, and the
    upgrade proration line charges the new tier''s dues_amount less the unused value of the current period, never
    below 0.00. The unused value is the gross amount of the current period''s dues or proration line multiplied
    by the unused days and divided by the period days, where unused days run from the change date to current_period_end
    and period days from current_period_start to current_period_end; a period paid entirely by a conversion discount
    or with no line (Larkspur Access) has an unused value of 0.00. No separate dues line is written for the new
    period, and open credit applies to the proration line as to dues. A downgrade, and a cycle switch from annual
    to monthly, takes effect on current_period_end: it is recorded as a pending request with that effective date,
    the membership renews at the new tier on that date, and nothing is refunded for the current period. Every tier
    change is recorded as a membership request of type upgrade, downgrade or cycle_switch. A tier change never starts
    a free trial and never moves membership_year_start; the result is rounded half up to the cent. Upgrades follow
    upgrade_effective (immediate) and downgrades follow downgrade_effective (the next billing date).'
  eligibility:
  - id: tier_change_active
    applies_to:
    - membership_tier_changed
    - membership_upgrade_proration_charged
    kind: state
    condition: A tier change may be requested only while the membership status is active.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - active
  params:
    per_tier:
      Larkspur Access:
        tier_changes_per_membership_year: =tier_changes_per_membership_year
        cycle_switch_allowed: =cycle_switch_allowed
        upgrade_credit_basis: =upgrade_credit_basis
      Larkspur Essentials Monthly:
        tier_changes_per_membership_year: =tier_changes_per_membership_year
        cycle_switch_allowed: =cycle_switch_allowed
        upgrade_credit_basis: =upgrade_credit_basis
      Larkspur Essentials Annual:
        tier_changes_per_membership_year: =tier_changes_per_membership_year
        cycle_switch_allowed: =cycle_switch_allowed
        upgrade_credit_basis: =upgrade_credit_basis
