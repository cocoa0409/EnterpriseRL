- id: membership_sponsor_coordination
  subject:
  - membership_enrolled
  - membership_dues_charged
  - membership_cancelled
  - membership_dues_refunded
  rule: 'A Larkspur at Work enrollment and a paid consumer membership are never in force at the same time. When
    a Larkspur at Work enrollment of the patient becomes active while the patient holds a paid membership, the patient
    may cancel the membership effective on the sponsor coverage_start_date even on an end_of_period tier, and the
    refund follows sponsor_overlap_refund_basis instead of the ordinary refund order: the gross amount of the current
    period''s dues or proration line multiplied by the unused days and divided by the period days, unused days counted
    from the sponsor coverage_start_date to current_period_end; this refund applies to monthly tiers as well and
    carries refund_reason sponsor_overlap. The sponsor overlap refund applies only when the patient''s Larkspur
    at Work enrollment status is active. A patient whose Larkspur at Work enrollment ended may enroll as an employer_conversion.
    A conversion enrollment requires that the Larkspur at Work enrollment it converts from has status ended. An
    enrollment counts as an employer_conversion only when the enrolled date is no more than sponsor_conversion_window_days
    calendar days after that enrollment''s coverage_end_date. Day counts are calendar days added to the anchor date
    (the anchor date plus N days is the date N days later), never full 24-hour periods, and the boundary date itself
    counts as within the limit. The first dues line of a conversion is the tier''s dues_amount reduced by sponsor_conversion_first_period_discount_pct
    percent and rounded half up to the cent; open credit then applies to the reduced amount, a conversion never
    receives a free trial, and every later period is charged at the full dues_amount.'
  eligibility:
  - id: conversion_window
    applies_to:
    - membership_enrolled
    - membership_dues_charged
    kind: time
    condition: An enrollment counts as an employer_conversion only when the enrolled date is no more than sponsor_conversion_window_days
      calendar days after that enrollment's coverage_end_date.
    evidence_fields:
    - sponsor_enrollments.coverage_end_date
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    temporal_basis:
      clock: frozen_time
      anchor_event: that enrollment's coverage_end_date
      anchor_source: sponsor_enrollments.coverage_end_date
      relation: not_after
      duration_source: variants.sponsor_conversion_window_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  - id: converted_from_ended
    applies_to:
    - membership_enrolled
    kind: state
    condition: A conversion enrollment requires that the Larkspur at Work enrollment it converts from has status
      ended.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - ended
  - id: overlap_sponsor_active
    applies_to:
    - membership_cancelled
    - membership_dues_refunded
    kind: state
    condition: The sponsor overlap refund applies only when the patient's Larkspur at Work enrollment status is
      active.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - active
  formula:
    amount: round(dues_amount * (100 - sponsor_conversion_first_period_discount_pct) / 100, 2)
- id: membership_notices
  subject:
  - membership_renewal_notice_sent
  - membership_trial_reminder_sent
  - membership_auto_renew_changed
  - membership_term_expired
  rule: Before every annual renewal a renewal notice is sent on each channel in the tier's notice_channels, no more
    than renewal_notice_max_days_before and at least renewal_notice_min_days_before calendar days before current_period_end,
    with one notice record per channel carrying the renewal date as period_start. Tiers whose notice days are zero
    (the monthly tiers and Larkspur Access) send no renewal notice. A trial reminder is sent trial_reminder_days_before_end
    calendar days before trial_end_date on each channel in notice_channels. Auto-renew may be changed only while
    the membership status is trialing, active, past_due or paused. Turning auto-renew off is registered as a membership
    request of type auto_renew_off effective at once; the membership then closes at current_period_end with no renewal
    and no refund, and turning it back on before that date restores renewal. A missing or late renewal notice does
    not stop the renewal; its only consequence is the waiver in the cancellation refund rule.
  eligibility:
  - id: auto_renew_change_state
    applies_to:
    - membership_auto_renew_changed
    kind: state
    condition: Auto-renew may be changed only while the membership status is trialing, active, past_due or paused.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
      - paused
- id: membership_clinician_assignment
  subject:
  - membership_clinician_assigned
  rule: Only a tier whose dedicated_clinician is true has a named primary clinician; the first assignment is made
    on activation, on trial start, or when the member upgrades to such a tier, and is not limited by the wait. A
    clinician may be assigned only while the membership status is trialing, active or past_due. A member may switch
    to a different primary clinician only when the frozen time is at or after clinician_assigned_date plus clinician_change_wait_days
    calendar days. Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
    N days later), never full 24-hour periods, and the boundary date itself counts as within the limit. A downgrade
    to a tier without a dedicated clinician clears primary_clinician and clinician_assigned_date when it takes effect.
  eligibility:
  - id: clinician_state
    applies_to:
    - membership_clinician_assigned
    kind: state
    condition: A clinician may be assigned only while the membership status is trialing, active or past_due.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
  - id: clinician_wait
    applies_to:
    - membership_clinician_assigned
    kind: time
    condition: A member may switch to a different primary clinician only when the frozen time is at or after clinician_assigned_date
      plus clinician_change_wait_days calendar days.
    evidence_fields:
    - membership_holdings.clinician_assigned_date
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: clinician_assigned_date
      anchor_source: membership_holdings.clinician_assigned_date
      relation: not_before
      duration_source: variants.clinician_change_wait_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
- id: membership_billing_corrections
  subject:
  - membership_dues_refunded
  - membership_chargeback_recorded
  - membership_chargeback_suspended
  rule: A billing error is a dues, enrollment-fee or proration line whose amount differs from what the charter prices
    for the tier and period it covers; the error is corrected by a refund of the overcharged difference with refund_reason
    billing_error, and an undercharge is never re-billed. A billing-error refund may be issued only while the membership
    status is active, past_due, paused, suspended or cancelled. A line may be refunded or charged back only when
    no refund or chargeback line already points to it. When the patient's card issuer reverses a membership line
    through a chargeback (chargeback_action suspend), the reversal is recorded against that line and the membership
    is suspended on the chargeback date; the reversed line is never also refunded, and the membership is reactivated
    only by paying a new billing period as for any suspension.
  eligibility:
  - id: one_reversal_per_line
    applies_to:
    - membership_dues_refunded
    - membership_chargeback_recorded
    kind: dedup
    condition: A line may be refunded or charged back only when no refund or chargeback line already points to it.
    evidence_fields:
    - membership_charges.original_charge_id
    - membership_charges.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_charges.original_charge_id
      action_bindings:
        membership_charges.original_charge_id: original_charge_id
    dedup_contract:
      table: membership_charges
      mode: separate_record
      object_bindings:
        original_charge_id: original_charge_id
      duplicate_filters:
        event_type:
        - membership_dues_refunded
        - membership_chargeback_recorded
      distinct_fields: []
  - id: refund_state
    applies_to:
    - membership_dues_refunded
    kind: state
    condition: A billing-error refund may be issued only while the membership status is active, past_due, paused,
      suspended or cancelled.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - active
      - past_due
      - paused
      - suspended
      - cancelled
