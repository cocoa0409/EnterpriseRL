    kind: time
    condition: A pause may start only on a date at least pause_request_notice_days calendar days after the date
      the patient requested it.
    evidence_fields:
    - membership_requests.requested_date
    - membership_requests.mem_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_requests.mem_request_id
      action_bindings:
        membership_requests.mem_request_id: mem_request_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the patient requested it
      anchor_source: membership_requests.requested_date
      relation: not_before
      duration_source: variants.pause_request_notice_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  - id: pause_tenure
    applies_to:
    - membership_paused
    kind: time
    condition: A pause may start only when at least pause_eligible_after_months calendar months have passed since
      the membership's activated_date.
    evidence_fields:
    - membership_holdings.activated_date
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the membership's activated_date
      anchor_source: membership_holdings.activated_date
      relation: not_before
      duration_source: variants.pause_eligible_after_months
      unit: calendar_months
      counting_rule: Month counts are calendar months added to the anchor date; when that day does not exist in
        the target month the last day of that month is used, and the boundary date itself counts as reached.
      boundary: inclusive
  - id: hold_fee_when_paused
    applies_to:
