events:
- type: pack_purchased
  target: pack_holdings
  mutation: create
  meaning: A patient buys a visit pack (directly, by auto-reload, or as an upgrade).
  grain: one row per pack bought
  fields:
    variant_name: Pack bought.
    purchase_date: Date bought.
    expiry_date: purchase_date plus validity_months.
    credits_remaining: credits_included at purchase.
    price_paid: Amount charged after discounts or upgrade credit.
    purchase_origin: standard, auto_reload or upgrade.
    upgraded_from_pack_id: Pack replaced by an upgrade.
    auto_reload: false unless the patient turns it on.
    membership_id: Membership whose discount applied.
  triggers:
  - event: pack:pack_credit_purchased
    map:
      credits: credits_remaining
      entry_date: purchase_date
  - event: pack:pack_purchase_charged
    map:
      amount: price_paid
      payment_date: purchase_date
- type: pack_exhausted
  target: pack_holdings
  mutation:
    transition:
      from: active
      to: exhausted
  meaning: The last credit of the pack is redeemed.
  grain: one row per transaction
  fields:
    credits_remaining: 0.0
  triggers: []
- type: pack_reactivated
  target: pack_holdings
  mutation:
    transition:
      from: exhausted
      to: active
  meaning: A reinstated credit returns an exhausted pack to active.
  grain: one row per transaction
  fields:
    credits_remaining: Credits after reinstatement.
  triggers: []
- type: pack_expired
  target: pack_holdings
  mutation:
    transition:
      from: active
      to: expired
  meaning: The pack passes its expiry date with credits left.
  grain: one row per transaction
  fields:
    credits_remaining: 0 after expiry.
    closed_date: Day after expiry_date.
  triggers:
  - event: pack:pack_credit_expired
    map:
      entry_date: closed_date
- type: pack_refunded
  target: pack_holdings
  mutation:
    transition:
      from: active
      to: refunded
  meaning: The patient's refund request for the pack is issued.
  grain: one row per transaction
  fields:
    credits_remaining: 0 after refund.
    closed_date: Refund date.
  triggers:
  - event: pack:pack_credit_removed
    map:
      entry_date: closed_date
  - event: pack:pack_refund_issued
    map:
      payment_date: closed_date
- type: pack_upgraded
  target: pack_holdings
  mutation:
    transition:
      from: active
      to: upgraded
  meaning: The patient trades the pack in for a larger pack of the same family.
  grain: one row per transaction
  fields:
    credits_remaining: 0 after trade-in.
    closed_date: Upgrade date.
  triggers:
  - event: pack:pack_credit_removed
    map:
      entry_date: closed_date
- type: pack_extended
  target: pack_holdings
  mutation: update
  meaning: The pack's expiry date is extended.
  grain: one row per transaction
  fields:
    expiry_date: New expiry date.
    extensions_used: Incremented by one.
  triggers:
  - event: pack:pack_extension_fee_charged
    map: {}
- type: pack_auto_reload_changed
  target: pack_holdings
  mutation: update
  meaning: The patient turns auto-reload on or off, or a failed reload turns it off.
  grain: one row per transaction
  fields:
    auto_reload: New setting.
  triggers: []
- type: pack_credit_purchased
  target: pack_credit_ledger
  meaning: Credits are granted on purchase.
  grain: one row per pack
  distinguish_by:
  - entry_date
  fields:
    credits: credits_included.
    entry_date: Purchase date.
  account: visit_credits
  direction: in
  triggers: []
- type: pack_credit_redeemed
  target: pack_credit_ledger
  meaning: Credits are redeemed for a booked visit.
  grain: one row per visit
  distinguish_by:
  - visit_id
  fields:
    credits: credits_per_visit_type of the visit type.
    entry_date: Booking date.
    visit_id: Visit booked.
  account: visit_credits
  direction: out
  triggers: []
- type: pack_credit_reinstated
  target: pack_credit_ledger
  meaning: Credits of a cancelled visit are returned to the pack.
  grain: one row per redemption line
  distinguish_by:
  - source_entry_id
  fields:
    credits: Credits of the redemption line.
    entry_date: Cancellation date.
    visit_id: Visit cancelled.
    source_entry_id: Redemption line reinstated.
  account: visit_credits
  direction: in
  triggers: []
- type: pack_credit_forfeited
  target: pack_credit_ledger
  meaning: The credits of a late-cancelled or missed visit are kept as used.
  grain: one row per redemption line
  distinguish_by:
  - source_entry_id
  fields:
    credits: Credits of the redemption line kept as used.
    entry_date: Date of the late cancellation or no-show.
    visit_id: Visit missed.
    source_entry_id: Redemption line forfeited.
  triggers: []
- type: pack_credit_expired
  target: pack_credit_ledger
  meaning: Credits left at expiry lapse.
  grain: one row per pack
  distinguish_by:
  - entry_date
  fields:
    credits: Credits lapsed.
    entry_date: Day after expiry_date.
  account: visit_credits
  direction: out
  triggers: []
- type: pack_credit_removed
  target: pack_credit_ledger
  meaning: Credits left on a refunded or upgraded pack are removed.
  grain: one row per pack
  distinguish_by:
  - entry_date
  fields:
    credits: Credits removed.
    entry_date: Refund or upgrade date.
  account: visit_credits
  direction: out
  triggers: []
- type: pack_purchase_charged
  target: pack_payments
  meaning: The pack price is charged.
  grain: one row per pack
  distinguish_by:
  - payment_date
  fields:
    amount: price_paid.
    payment_date: Purchase date.
  account: pack_paid
  direction: in
  triggers: []
- type: pack_extension_fee_charged
  target: pack_payments
  meaning: The fee for an expiry extension is charged.
  grain: one row per extension
  distinguish_by:
  - payment_date
  fields:
    amount: expiry_extension_fee.
    payment_date: Extension date.
  account: pack_paid
  direction: in
  triggers: []
- type: pack_refund_issued
  target: pack_payments
  meaning: Money is returned for a pack refund, an upgrade trade-in or a credit that could not be reinstated after
    expiry.
  grain: one row per refund occasion
  distinguish_by:
  - refund_basis
  - visit_id
  fields:
    amount: Negative refund.
    payment_date: Refund date.
    refund_basis: Basis of the refund.
    visit_id: Visit of a post_expiry_credit refund.
    original_payment_id: Purchase line refunded.
  account: pack_paid
  direction: out
  triggers: []
measures:
- id: pack_msr_reserved_credits
  window: current state at frozen_time
  measure: sum of credits over pack_credit_redeemed lines of the pack whose visit has status scheduled
- id: pack_msr_forfeitures
  window: life of the pack
  measure: count of pack_credit_forfeited lines of the pack
- id: pack_msr_used_value_at_list
  window: life of the pack
  measure: sum, over redemption lines not reinstated, of the list_price (visit charter) of the visit type of each
    line's visit
policies:
- id: pack_agg_multi_holding
  subject:
  - pack_purchased
  rule: 'A patient may hold packs of different families at the same time but at most max_active_packs_same_family
    pack of each family, so at most one urgent_care, one primary_care and one behavioral_health pack are open at
    once. A pack may be bought only when the patient holds no other pack of the same pack_family whose status is
    active or exhausted. An upgrade purchase is the exception: the new pack is bought in the same step in which
    the old pack becomes upgraded. Expired, refunded and upgraded packs never count.'
  eligibility:
  - id: one_open_pack_per_family
    applies_to:
    - pack_purchased
    kind: dedup
    condition: A pack may be bought only when the patient holds no other pack of the same pack_family whose status
      is active or exhausted.
    evidence_fields:
    - pack_holdings.customer_id
    - pack_holdings.status
    - pack_holdings.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pack_holdings.customer_id
      action_bindings:
        pack_holdings.customer_id: customer_id
    dedup_contract:
      table: pack_holdings
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - active
        - exhausted
      distinct_fields:
      - variant_name
  params:
    max_per_customer: 3
- id: pack_agg_redemption_order
  subject:
  - pack_credit_redeemed
  rule: When more than one open pack of the patient covers the visit type being booked on the pack_credit path (for
    example an urgent_care pack and a primary_care pack for an Urgent Care Video Visit), the credits come from the
    pack with the earliest expiry_date, and between packs with the same expiry_date from the one with the earliest
    purchase_date (redemption_order). One visit is never split across two packs; when the chosen pack has fewer
    credits left than the visit needs, the next pack in that order pays it, and when none has enough the pack_credit
    path is not open for that visit.
  eligibility: []
- id: pack_purchase
  subject:
  - pack_purchased
  - pack_purchase_charged
  - pack_credit_purchased
  rule: A pack may be bought only when the patient's age on the purchase date is at least min_purchase_age_months
    completed calendar months after the patient's date of birth. Month counts are calendar months added to the anchor
    date; when that day does not exist in the target month the last day of that month is used, and the boundary
    date itself counts as reached. A pack is refused when sponsor_covered_purchase_blocked is true and every visit
    type in its credits_per_visit_type is covered by the patient's Larkspur at Work plan whose enrollment status
    is active or on_leave. The price charged is pack_price less member_discount_pct_by_membership_tier percent for
    the buyer's membership tier. The member discount applies only while the buyer's membership status is trialing,
    active or past_due. An auto-reload purchase takes auto_reload_discount_pct instead when that is larger, and
    the two are never added. An upgrade purchase is priced under the upgrade rule. The result is rounded half up
    to the cent (price_rounding). The pack grants credits_included credits on the purchase date and expires validity_months
    calendar months later; the credits belong to the holder alone (transferable and household_sharing are false).
    Only the membership statuses in member_discount_statuses qualify for the member discount.
  eligibility:
  - id: pack_min_age
    applies_to:
    - pack_purchased
    kind: time
    condition: A pack may be bought only when the patient's age on the purchase date is at least min_purchase_age_months
      completed calendar months after the patient's date of birth.
    evidence_fields:
    - customers.date_of_birth
    - customers.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the patient's date of birth
      anchor_source: customers.date_of_birth
      relation: not_before
      duration_source: variants.min_purchase_age_months
      unit: calendar_months
      counting_rule: Month counts are calendar months added to the anchor date; when that day does not exist in
        the target month the last day of that month is used, and the boundary date itself counts as reached.
      boundary: inclusive
  - id: member_discount_state
    applies_to:
    - pack_purchase_charged
    kind: state
    condition: The member discount applies only while the buyer's membership status is trialing, active or past_due.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
  params:
    per_tier:
      Urgent Care 3-Visit Pack:
        pack_price: =pack_price
        credits_included: =credits_included
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
      Urgent Care 6-Visit Pack:
        pack_price: =pack_price
        credits_included: =credits_included
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
      Primary Care 4-Visit Pack:
        pack_price: =pack_price
        credits_included: =credits_included
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
      Behavioral Health 4-Session Pack:
        pack_price: =pack_price
        credits_included: =credits_included
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
      Behavioral Health 8-Session Pack:
        pack_price: =pack_price
        credits_included: =credits_included
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
      Behavioral Health 12-Session Pack:
        pack_price: =pack_price
        credits_included: =credits_included
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
  formula:
    amount: round(pack_price * (100 - max(member_discount_pct_by_membership_tier, auto_reload_discount_pct)) / 100,
      2)
- id: pack_evt_redemption
  subject:
  - pack_credit_redeemed
  - pack_exhausted
  rule: A visit on the pack_credit path redeems at booking (redemption_timing) the number of credits that credits_per_visit_type
    gives for its visit type; a visit type not listed there cannot use the pack. Credits may be redeemed only while
    the pack status is active. Credits may be redeemed for a visit only when no redemption line already exists for
    the same visit. The visit must be scheduled on or before expiry_date, and pack_msr_reserved_credits plus the
    credits needed may not exceed max_reserved_credits. When credits_remaining reaches zero the pack becomes exhausted.
  eligibility:
  - id: redeem_active
    applies_to:
    - pack_credit_redeemed
    kind: state
    condition: Credits may be redeemed only while the pack status is active.
    evidence_fields:
    - pack_holdings.status
    - pack_holdings.pack_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pack_holdings.pack_id
      action_bindings:
        pack_holdings.pack_id: pack_id
    state_contract:
      field: pack_holdings.status
      allowed:
      - active
  - id: one_redemption_per_visit
    applies_to:
    - pack_credit_redeemed
    kind: dedup
    condition: Credits may be redeemed for a visit only when no redemption line already exists for the same visit.
    evidence_fields:
    - pack_credit_ledger.visit_id
    - pack_credit_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pack_credit_ledger.visit_id
      action_bindings:
        pack_credit_ledger.visit_id: visit_id
    dedup_contract:
      table: pack_credit_ledger
      mode: separate_record
      object_bindings:
        visit_id: visit_id
      duplicate_filters:
        event_type:
        - pack_credit_redeemed
      distinct_fields: []
  params:
    per_tier:
      Urgent Care 3-Visit Pack:
        credits_per_visit_type: =credits_per_visit_type
        max_reserved_credits: =max_reserved_credits
      Urgent Care 6-Visit Pack:
        credits_per_visit_type: =credits_per_visit_type
        max_reserved_credits: =max_reserved_credits
      Primary Care 4-Visit Pack:
        credits_per_visit_type: =credits_per_visit_type
        max_reserved_credits: =max_reserved_credits
      Behavioral Health 4-Session Pack:
        credits_per_visit_type: =credits_per_visit_type
        max_reserved_credits: =max_reserved_credits
      Behavioral Health 8-Session Pack:
        credits_per_visit_type: =credits_per_visit_type
        max_reserved_credits: =max_reserved_credits
      Behavioral Health 12-Session Pack:
        credits_per_visit_type: =credits_per_visit_type
        max_reserved_credits: =max_reserved_credits
  measures:
  - pack_msr_reserved_credits
- id: pack_evt_reinstatement_forfeiture
  subject:
  - pack_credit_reinstated
  - pack_credit_forfeited
  - pack_reactivated
  - pack_refund_issued
  rule: When a visit paid with pack credits is cancelled on time by the patient (reinstate_on_on_time_cancel) or
    cancelled by Larkspur (reinstate_on_provider_cancel), its credits are reinstated to the same pack with the pack's
    original expiry_date (reinstated_credit_expiry). When it is late-cancelled and forfeit_on_late_cancel is true,
    or missed and forfeit_on_no_show is true, the credits are forfeited and stay used, except that while pack_msr_forfeitures
    is below courtesy_reinstatements_per_pack the credits are reinstated as a courtesy instead; a late cancellation
    on a pack whose forfeit_on_late_cancel is false is reinstated like an on-time cancellation. Credits may be reinstated
    or forfeited only when no reinstatement or forfeiture line already exists for the same redemption line. A reinstated
    credit returns an exhausted pack to active (exhausted_reactivation). A credit that would be reinstated after
    expiry_date, or to a pack no longer active or exhausted, is paid out instead as a refund of per_credit_value
    for each credit (post_expiry_reinstatement_handling) with refund_basis post_expiry_credit. Visit pack credits
    never carry a late-cancellation or no-show fee.
  eligibility:
  - id: one_settlement_per_redemption
    applies_to:
    - pack_credit_reinstated
    - pack_credit_forfeited
    kind: dedup
    condition: Credits may be reinstated or forfeited only when no reinstatement or forfeiture line already exists
      for the same redemption line.
    evidence_fields:
    - pack_credit_ledger.source_entry_id
    - pack_credit_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pack_credit_ledger.source_entry_id
      action_bindings:
        pack_credit_ledger.source_entry_id: source_entry_id
    dedup_contract:
      table: pack_credit_ledger
      mode: separate_record
      object_bindings:
        source_entry_id: source_entry_id
      duplicate_filters:
        event_type:
        - pack_credit_reinstated
        - pack_credit_forfeited
      distinct_fields: []
  params:
    per_tier:
      Urgent Care 3-Visit Pack:
        forfeit_on_late_cancel: =forfeit_on_late_cancel
        courtesy_reinstatements_per_pack: =courtesy_reinstatements_per_pack
      Urgent Care 6-Visit Pack:
        forfeit_on_late_cancel: =forfeit_on_late_cancel
        courtesy_reinstatements_per_pack: =courtesy_reinstatements_per_pack
      Primary Care 4-Visit Pack:
        forfeit_on_late_cancel: =forfeit_on_late_cancel
        courtesy_reinstatements_per_pack: =courtesy_reinstatements_per_pack
      Behavioral Health 4-Session Pack:
        forfeit_on_late_cancel: =forfeit_on_late_cancel
        courtesy_reinstatements_per_pack: =courtesy_reinstatements_per_pack
      Behavioral Health 8-Session Pack:
        forfeit_on_late_cancel: =forfeit_on_late_cancel
        courtesy_reinstatements_per_pack: =courtesy_reinstatements_per_pack
      Behavioral Health 12-Session Pack:
        forfeit_on_late_cancel: =forfeit_on_late_cancel
        courtesy_reinstatements_per_pack: =courtesy_reinstatements_per_pack
  measures:
  - pack_msr_forfeitures
- id: pack_expiry_extension
  subject:
  - pack_extended
  - pack_extension_fee_charged
  - pack_expired
  - pack_credit_expired
  rule: Credits may be used for visits scheduled on or before expiry_date. An expiry notice is sent expiry_notice_days_before
    calendar days before expiry_date on each of expiry_notice_channels. Where expiry_extension_allowed is true and
    extensions_used is below expiry_extensions_max, the patient may extend the pack by expiry_extension_months calendar
    months for expiry_extension_fee, charged on the extension date. An extension may be requested only while the
    pack status is active. An extension may be requested only when the frozen time is no more than extension_request_window_days
    calendar days before the pack's expiry_date and not after it. Day counts are calendar days added to the anchor
    date (the anchor date plus N days is the date N days later), never full 24-hour periods, and the boundary date
    itself counts as within the limit. Month counts are calendar months added to the anchor date; when that day
    does not exist in the target month the last day of that month is used, and the boundary date itself counts as
    reached. On the day after expiry_date an active pack expires and its remaining credits lapse; credits reserved
    by visits scheduled on or before expiry_date stay redeemed. An exhausted pack does not expire.
  eligibility:
  - id: extend_active
    applies_to:
    - pack_extended
    kind: state
    condition: An extension may be requested only while the pack status is active.
    evidence_fields:
    - pack_holdings.status
    - pack_holdings.pack_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pack_holdings.pack_id
      action_bindings:
        pack_holdings.pack_id: pack_id
    state_contract:
      field: pack_holdings.status
      allowed:
      - active
  params:
    per_tier:
      Urgent Care 3-Visit Pack:
        expiry_extension_fee: =expiry_extension_fee
        expiry_extensions_max: =expiry_extensions_max
      Urgent Care 6-Visit Pack:
        expiry_extension_fee: =expiry_extension_fee
        expiry_extensions_max: =expiry_extensions_max
      Primary Care 4-Visit Pack:
        expiry_extension_fee: =expiry_extension_fee
        expiry_extensions_max: =expiry_extensions_max
      Behavioral Health 4-Session Pack:
        expiry_extension_fee: =expiry_extension_fee
        expiry_extensions_max: =expiry_extensions_max
      Behavioral Health 8-Session Pack:
        expiry_extension_fee: =expiry_extension_fee
        expiry_extensions_max: =expiry_extensions_max
      Behavioral Health 12-Session Pack:
        expiry_extension_fee: =expiry_extension_fee
        expiry_extensions_max: =expiry_extensions_max
- id: pack_refunds
  subject:
  - pack_refunded
  - pack_refund_issued
  - pack_credit_removed
  rule: Only the patient can ask for a pack refund, at most refund_requests_per_pack per pack. A pack may be refunded
    only while its status is active. A full refund may be issued only when the frozen time is no more than full_refund_window_days
    calendar days after the pack's purchase_date. Day counts are calendar days added to the anchor date (the anchor
    date plus N days is the date N days later), never full 24-hour periods, and the boundary date itself counts
    as within the limit. Inside that window a pack with no credit ever redeemed (full_refund_requires_no_redemption)
    is refunded in full, price_paid, with refund_basis full_window. Otherwise the refund is price_paid less pack_msr_used_value_at_list
    (each redeemed or forfeited visit valued at its visit type's list price under post_window_refund_method), never
    below refund_floor, with refund_basis unused_value; when that is 0.00 no refund is issued and the pack stays
    active. An expired pack is never refunded (refund_after_expiry_allowed). Credits reserved by scheduled visits
    must be cancelled first. The refund goes to the original payment method, every remaining credit is removed,
    and the pack becomes refunded.
  eligibility:
  - id: refund_active
    applies_to:
    - pack_refunded
    kind: state
    condition: A pack may be refunded only while its status is active.
    evidence_fields:
    - pack_holdings.status
    - pack_holdings.pack_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pack_holdings.pack_id
      action_bindings:
        pack_holdings.pack_id: pack_id
    state_contract:
      field: pack_holdings.status
      allowed:
      - active
  - id: full_refund_window
    applies_to:
    - pack_refund_issued
    kind: time
    condition: A full refund may be issued only when the frozen time is no more than full_refund_window_days calendar
      days after the pack's purchase_date.
    evidence_fields:
    - pack_holdings.purchase_date
    - pack_holdings.pack_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pack_holdings.pack_id
      action_bindings:
        pack_holdings.pack_id: pack_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the pack's purchase_date
      anchor_source: pack_holdings.purchase_date
      relation: not_after
      duration_source: variants.full_refund_window_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  params:
    per_tier:
      Urgent Care 3-Visit Pack:
        full_refund_window_days: =full_refund_window_days
      Urgent Care 6-Visit Pack:
        full_refund_window_days: =full_refund_window_days
      Primary Care 4-Visit Pack:
        full_refund_window_days: =full_refund_window_days
      Behavioral Health 4-Session Pack:
        full_refund_window_days: =full_refund_window_days
      Behavioral Health 8-Session Pack:
        full_refund_window_days: =full_refund_window_days
      Behavioral Health 12-Session Pack:
        full_refund_window_days: =full_refund_window_days
  measures:
  - pack_msr_used_value_at_list
- id: pack_upgrade
  subject:
  - pack_upgraded
  - pack_purchased
  rule: Where upgrade_allowed is true, the patient may trade a pack in for one of its upgrade_targets. A pack may
    be upgraded only while its status is active. An upgrade may be made only when the frozen time is no more than
    upgrade_window_days calendar days after the pack's purchase_date. Day counts are calendar days added to the
    anchor date (the anchor date plus N days is the date N days later), never full 24-hour periods, and the boundary
    date itself counts as within the limit. The trade-in value is price_paid less the credits redeemed and forfeited
    multiplied by per_credit_value, never below 0.00 (upgrade_credit_basis); the new pack's price_paid is its pack_price,
    less the buyer's member discount, less the trade-in value, rounded half up to the cent, and it carries purchase_origin
    upgrade and upgraded_from_pack_id. Credits reserved by scheduled visits move with the trade-in as redeemed credits
    of the new pack. The new pack's expiry is validity_months from the upgrade date (upgrade_carries_expiry); the
    old pack's remaining credits are removed and it becomes upgraded.
  eligibility:
  - id: upgrade_active
    applies_to:
    - pack_upgraded
    kind: state
    condition: A pack may be upgraded only while its status is active.
    evidence_fields:
    - pack_holdings.status
    - pack_holdings.pack_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pack_holdings.pack_id
      action_bindings:
        pack_holdings.pack_id: pack_id
    state_contract:
      field: pack_holdings.status
      allowed:
      - active
  - id: upgrade_window
    applies_to:
    - pack_upgraded
    kind: time
    condition: An upgrade may be made only when the frozen time is no more than upgrade_window_days calendar days
      after the pack's purchase_date.
    evidence_fields:
    - pack_holdings.purchase_date
    - pack_holdings.pack_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pack_holdings.pack_id
      action_bindings:
        pack_holdings.pack_id: pack_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the pack's purchase_date
      anchor_source: pack_holdings.purchase_date
      relation: not_after
      duration_source: variants.upgrade_window_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
- id: pack_auto_reload
  subject:
  - pack_auto_reload_changed
  - pack_purchased
  rule: Where auto_reload_available is true the patient may turn auto-reload on. Auto-reload may be turned on only
    while the pack status is active. When credits_remaining of a pack with auto_reload true reaches auto_reload_trigger_credits,
    a new pack of the same kind is bought the same day with purchase_origin auto_reload and auto_reload true, and
    the old pack's auto_reload is turned off; the max_active_packs_same_family limit does not block that purchase
    because the old pack is exhausted at that moment and is the one being replaced. When the auto-reload charge
    fails, auto-reload is turned off and no pack is bought (auto_reload_failed_payment_action).
  eligibility:
  - id: auto_reload_active
    applies_to:
    - pack_auto_reload_changed
    kind: state
    condition: Auto-reload may be turned on only while the pack status is active.
    evidence_fields:
    - pack_holdings.status
    - pack_holdings.pack_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pack_holdings.pack_id
      action_bindings:
        pack_holdings.pack_id: pack_id
    state_contract:
      field: pack_holdings.status
      allowed:
      - active
