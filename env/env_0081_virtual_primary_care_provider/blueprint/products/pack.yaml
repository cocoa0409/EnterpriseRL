# Product charter: pack. Larkspur Health.
category: pack
display_name: Larkspur Visit Packs
binding:
  holding_table: pack_holdings
  event_tables:
  - pack_credit_ledger
  - pack_payments
  status_field: status
  variant_field: variant_name
  quantity_fields:
    credits_remaining: visit_credits
lifecycle:
  states:
  - active
  - exhausted
  - expired
  - refunded
  - upgraded
  transitions:
  - from: active
    to: exhausted
    by: system
    means: The last remaining credit is redeemed.
  - from: exhausted
    to: active
    by: system
    means: A redeemed credit is reinstated before the expiry date.
  - from: active
    to: expired
    by: system
    means: The expiry date passes with credits unused.
  - from: active
    to: refunded
    by: user
    means: The patient asks for a refund of the pack and the refund is issued.
  - from: active
    to: upgraded
    by: user
    means: The patient trades the pack in for a larger pack of the same family.
accounts:
- key: visit_credits
  unit: credits
  meaning: Visit credits held on the pack and not yet used.
- key: pack_paid
  unit: USD
  meaning: Net amount paid for the pack (purchase and extension fees less refunds).
parameter_schema:
  pack_price: List price of the pack; USD.
  credits_included: Visit credits granted at purchase; credits.
  per_credit_value: Value of one credit (pack_price / credits_included, rounded half up to the cent); USD.
  pack_family: 'Family of the pack: urgent_care, primary_care or behavioral_health.'
  credits_per_visit_type: Credits one visit of each covered visit type uses; mapping visit type -> credits (types
    not listed are not covered).
  validity_months: Calendar months from purchase_date to expiry_date (month-end fallback).
  min_purchase_age_months: Minimum age of the holder at purchase in completed months (216 = 18 years).
  member_discount_pct_by_membership_tier: Percent off pack_price by the buyer's membership tier; mapping tier ->
    percent.
  member_discount_statuses: Membership statuses that qualify for the member discount.
  sponsor_covered_purchase_blocked: Whether a pack is refused when every visit type it covers is covered by the
    patient's active Larkspur at Work plan; boolean.
  max_reserved_credits: Maximum credits of the pack reserved at once by visits in status scheduled; credits.
  redemption_timing: 'When credits are redeemed: at_booking.'
  redemption_order: 'Which pack pays when several could: earliest_expiry_first (then earliest purchase_date).'
  reinstate_on_on_time_cancel: Whether an on-time patient cancellation reinstates the credits; boolean.
  reinstate_on_provider_cancel: Whether a Larkspur cancellation reinstates the credits; boolean.
  forfeit_on_late_cancel: Whether a late cancellation forfeits the credits; boolean.
  forfeit_on_no_show: Whether a no-show forfeits the credits; boolean.
  courtesy_reinstatements_per_pack: Forfeitures per pack that are reinstated anyway as a courtesy; count.
  reinstated_credit_expiry: 'Expiry of a reinstated credit: original_expiry (the pack''s expiry_date).'
  post_expiry_reinstatement_handling: 'When a credit would be reinstated after expiry_date: cash_refund_per_credit_value.'
  full_refund_window_days: Calendar days after purchase_date within which an unused pack is refunded in full.
  full_refund_requires_no_redemption: Whether the full refund requires that no credit was ever redeemed; boolean.
  post_window_refund_method: 'Refund after the full window: price_less_used_at_list (price_paid less each redeemed
    and forfeited visit valued at its visit type''s list price, floor refund_floor).'
  refund_floor: Lowest refund amount; USD.
  refund_after_expiry_allowed: Whether an expired pack can be refunded; boolean.
  refund_requests_per_pack: Refunds that can be issued per pack; count.
  expiry_extension_allowed: Whether the expiry date can be extended; boolean.
  expiry_extension_months: Calendar months one extension adds to expiry_date.
  expiry_extension_fee: Fee for one extension; USD.
  expiry_extensions_max: Maximum extensions per pack; count.
  extension_request_window_days: An extension must be requested no more than this many calendar days before expiry_date
    and not after it.
  expiry_notice_days_before: Calendar days before expiry_date on which the expiry notice is sent.
  expiry_notice_channels: Channels for the expiry notice.
  auto_reload_available: Whether auto-reload can be turned on; boolean.
  auto_reload_discount_pct: Percent off pack_price for an auto-reload purchase (not combined with the member discount;
    the larger applies).
  auto_reload_trigger_credits: credits_remaining at which auto-reload buys the next pack; credits.
  auto_reload_failed_payment_action: 'What happens when the auto-reload charge fails: disable_auto_reload.'
  upgrade_allowed: Whether the pack can be traded in for a larger pack of the same family; boolean.
  upgrade_window_days: Calendar days after purchase_date within which an upgrade is allowed.
  upgrade_targets: Packs this pack can be upgraded to.
  upgrade_credit_basis: 'Trade-in value of the old pack: price_paid less credits redeemed and forfeited x per_credit_value,
    floor 0.00.'
  upgrade_carries_expiry: 'Expiry of the new pack on an upgrade: new_validity_from_upgrade_date.'
  transferable: Whether credits can be moved to another patient; boolean.
  household_sharing: Whether household members may redeem the holder's credits; boolean.
  max_active_packs_same_family: Maximum packs of one family in status active or exhausted at once per patient; count.
  price_rounding: 'Rounding of computed pack amounts: half_up_cent.'
  exhausted_reactivation: Whether a reinstated credit returns an exhausted pack to active; boolean.
  refund_method: 'Where refunds go: original_payment_method.'
