events:
- type: referral_issued
  target: referrals
  mutation: create
  meaning: A Larkspur clinician issues an in-person care referral.
  grain: one row per referral
  fields:
    variant_name: Referral type.
    referral_date: Date issued.
    referring_visit_id: Visit the referral came from.
    specialty: Specialty or service.
    imaging_modality: Modality for imaging referrals.
    urgency: routine or urgent.
    coverage_id: Coverage governing authorization.
    visits_remaining: 0 until authorized.
    valid_through: referral_date plus default_valid_days.
    reissue_count: 0.0
  triggers: []
- type: referral_ready
  target: referrals
  mutation:
    transition:
      from: pending_authorization
      to: ready_to_schedule
  meaning: Authorization is approved, or none is needed.
  grain: one row per transaction
  fields:
    authorization_number: Payer number when one was issued.
    visits_remaining: Visits authorized.
    valid_through: Validity end.
  triggers: []
- type: referral_denied
  target: referrals
  mutation:
    transition:
      from: pending_authorization
      to: denied
  meaning: The payer denies authorization.
  grain: one row per transaction
  fields:
    closed_date: Denial date.
  triggers: []
- type: referral_scheduled
  target: referrals
  mutation:
    transition:
      from: ready_to_schedule
      to: scheduled_externally
  meaning: The outside appointment is booked.
  grain: one row per transaction
  fields:
    receiving_provider_name: Provider chosen.
    receiving_in_network: Network status for the coverage.
    appointment_date: Appointment date.
  triggers:
  - event: referral:referral_records_sent
    map: {}
- type: referral_completed
  target: referrals
  mutation:
    transition:
      from: scheduled_externally
      to: completed
  meaning: The last authorized visit or the consult report is reported.
  grain: one row per transaction
  fields:
    closed_date: Completion date.
  triggers: []
- type: referral_expired
  target: referrals
  mutation:
    transition:
      from: ready_to_schedule
      to: expired
  meaning: The referral passes valid_through unscheduled.
  grain: one row per transaction
  fields:
    closed_date: Day after valid_through.
  triggers: []
- type: referral_lapsed
  target: referrals
  mutation:
    transition:
      from: scheduled_externally
      to: expired
  meaning: The referral passes valid_through with authorized visits unused.
  grain: one row per transaction
  fields:
    closed_date: Day after valid_through.
  triggers: []
- type: referral_withdrawn
  target: referrals
  mutation:
    transition:
      from: pending_authorization
      to: cancelled
  meaning: The patient withdraws the referral before authorization is decided.
  grain: one row per transaction
  fields:
    closed_date: Withdrawal date.
  triggers: []
- type: referral_cancelled
  target: referrals
  mutation:
    transition:
      from: ready_to_schedule
      to: cancelled
  meaning: The patient withdraws the referral before scheduling.
  grain: one row per transaction
  fields:
    closed_date: Withdrawal date.
  triggers: []
- type: referral_reissued
  target: referrals
  mutation:
    transition:
      from: expired
      to: ready_to_schedule
  meaning: An expired referral is reissued within the grace period.
  grain: one row per transaction
  fields:
    valid_through: Reissue date plus default_valid_days.
    reissue_count: Incremented by one.
    closed_date: Cleared.
  triggers: []
- type: referral_appointment_changed
  target: referrals
  mutation: update
  meaning: The outside appointment date or provider changes.
  grain: one row per transaction
  fields:
    appointment_date: New date.
    receiving_provider_name: Provider.
    receiving_in_network: Network status.
  triggers: []
- type: referral_authorization_requested
  target: referral_authorizations
  meaning: Authorization is requested from the payer.
  grain: one row per request
  distinguish_by:
  - line_date
  - request_priority
  fields:
    line_date: Request date.
    request_priority: standard or expedited.
  triggers: []
- type: referral_authorization_approved
  target: referral_authorizations
  meaning: The payer approves visits and a validity period, or the referral is cleared as needing no authorization.
  grain: one row per decision
  distinguish_by:
  - line_date
  fields:
    visits: Visits authorized.
    line_date: Decision date.
    valid_through: Validity end.
  account: authorized_visits
  direction: in
  triggers:
  - event: referral:referral_ready
    map:
      valid_through: valid_through
- type: referral_authorization_denied
  target: referral_authorizations
  meaning: The payer denies the authorization.
  grain: one row per decision
  distinguish_by:
  - line_date
  fields:
    line_date: Decision date.
  triggers:
  - event: referral:referral_denied
    map:
      closed_date: line_date
- type: referral_extension_approved
  target: referral_authorizations
  meaning: Additional visits or days are approved.
  grain: one row per extension
  distinguish_by:
  - line_date
  fields:
    visits: Visits added.
    line_date: Approval date.
    valid_through: New validity end.
  account: authorized_visits
  direction: in
  triggers: []
- type: referral_visit_reported
  target: referral_authorizations
  meaning: The receiving provider reports an outside visit used under the referral.
  grain: one row per outside visit
  distinguish_by:
  - reported_visit_date
  fields:
    visits: 1.0
    line_date: Date reported.
    reported_visit_date: Date of the outside visit.
  account: authorized_visits
  direction: out
  triggers: []
- type: referral_records_sent
  target: referral_coordination
  meaning: The referral packet is sent to the receiving provider.
  grain: one row per scheduled appointment
  distinguish_by:
  - activity_date
  fields:
    activity_date: Date sent.
    records_scope: Packet sent.
  triggers: []
- type: referral_followup_contact
  target: referral_coordination
  meaning: A navigator follows up on an unscheduled referral.
  grain: one row per contact
  distinguish_by:
  - contact_number
  fields:
    activity_date: Contact date.
    contact_number: Sequence.
  triggers: []
- type: referral_consult_report_received
  target: referral_coordination
  meaning: The receiving provider's consult report is received.
  grain: one row per report
  distinguish_by:
  - activity_date
  fields:
    activity_date: Date received.
  triggers: []
measures:
- id: referral_msr_open_same_specialty
  window: current state at frozen_time
  measure: count of the patient's referrals with the same specialty whose status is pending_authorization, ready_to_schedule
    or scheduled_externally
- id: referral_msr_extensions
  window: life of the referral
  measure: count of referral_extension_approved lines of the referral
- id: referral_msr_followups
  window: life of the referral
  measure: count of referral_followup_contact records of the referral
policies:
- id: referral_agg_multi_holding
  subject:
  - referral_issued
  rule: A patient may hold any number of referrals over time (max_per_customer is unlimited); how open referrals
    combine is set by the open-referral rule.
  eligibility: []
  params:
    max_per_customer: null
- id: referral_agg_open_referrals
  subject:
  - referral_issued
  rule: 'Referrals are combined per patient and specialty: at most max_open_referrals_same_specialty may be open
    at once (referral_msr_open_same_specialty). A referral may be issued only when the patient holds no other referral
    for the same specialty whose status is pending_authorization, ready_to_schedule or scheduled_externally. Referrals
    for different specialties are independent, and authorized visits are never pooled across referrals.'
  eligibility:
  - id: one_open_per_specialty
    applies_to:
    - referral_issued
    kind: dedup
    condition: A referral may be issued only when the patient holds no other referral for the same specialty whose
      status is pending_authorization, ready_to_schedule or scheduled_externally.
    evidence_fields:
    - referrals.customer_id
    - referrals.specialty
    - referrals.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - referrals.customer_id
      action_bindings:
        referrals.customer_id: customer_id
    dedup_contract:
      table: referrals
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        specialty: specialty
      duplicate_filters:
        status:
        - pending_authorization
        - ready_to_schedule
        - scheduled_externally
      distinct_fields: []
  measures:
  - referral_msr_open_same_specialty
- id: referral_issuance
  subject:
  - referral_issued
  - referral_authorization_requested
  rule: A referral may be issued only from a visit appointment whose status is completed. A referral may be issued
    only when the frozen time is no more than referring_visit_lookback_days calendar days after the referring visit's
    completed_date. Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
    N days later), never full 24-hour periods, and the boundary date itself counts as within the limit. Only a type
    whose urgent_eligible is true may be urgent. Larkspur charges no referral_fee. Authorization is needed when
    the governing coverage's plan type is in the type's auth_required_plan_types, or, for a Diagnostic Imaging Referral
    whose imaging_modality is in advanced_imaging_modalities, in advanced_imaging_auth_plan_types; only the primary
    coverage is asked (auth_from_primary_only). An urgent referral is requested as expedited and decided within
    auth_turnaround_business_days_expedited business days, any other within auth_turnaround_business_days_standard.
    Business days are Monday to Friday excluding US federal holidays, counted from the day after the anchor date.
    A referral that needs no authorization is cleared at once for default_authorized_visits and default_valid_days.
    Authorization is never sought after the outside visit (retro_authorization_allowed). A patient without coverage
    is told that the outside provider bills them directly (self_pay_estimate_notice).
  eligibility:
  - id: referral_from_completed_visit
    applies_to:
    - referral_issued
    kind: state
    condition: A referral may be issued only from a visit appointment whose status is completed.
    evidence_fields:
    - visit_appointments.status
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    state_contract:
      field: visit_appointments.status
      allowed:
      - completed
  - id: referral_lookback
    applies_to:
    - referral_issued
    kind: time
    condition: A referral may be issued only when the frozen time is no more than referring_visit_lookback_days
      calendar days after the referring visit's completed_date.
    evidence_fields:
    - visit_appointments.completed_date
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the referring visit's completed_date
      anchor_source: visit_appointments.completed_date
      relation: not_after
      duration_source: variants.referring_visit_lookback_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  params:
    per_tier:
      In-Person Primary Care Referral:
        auth_required_plan_types: =auth_required_plan_types
        default_authorized_visits: =default_authorized_visits
        default_valid_days: =default_valid_days
      Physical Therapy Referral:
        auth_required_plan_types: =auth_required_plan_types
        default_authorized_visits: =default_authorized_visits
        default_valid_days: =default_valid_days
      Diagnostic Imaging Referral:
        auth_required_plan_types: =auth_required_plan_types
        default_authorized_visits: =default_authorized_visits
        default_valid_days: =default_valid_days
      Specialist Consultation Referral:
        auth_required_plan_types: =auth_required_plan_types
        default_authorized_visits: =default_authorized_visits
        default_valid_days: =default_valid_days
      Behavioral Health Specialty Referral:
        auth_required_plan_types: =auth_required_plan_types
        default_authorized_visits: =default_authorized_visits
        default_valid_days: =default_valid_days
      Surgical Consultation Referral:
        auth_required_plan_types: =auth_required_plan_types
        default_authorized_visits: =default_authorized_visits
        default_valid_days: =default_valid_days
- id: referral_authorization_decisions
  subject:
  - referral_authorization_approved
  - referral_authorization_denied
  - referral_ready
  - referral_denied
  - referral_withdrawn
  rule: An authorization decision may be recorded only while the referral status is pending_authorization. An approval
    records the visits and valid_through the payer granted, which replace the defaults, and the referral becomes
    ready_to_schedule; a denial closes the referral as denied. After a denial the referring clinician may ask for
    a peer-to-peer review within peer_to_peer_request_days calendar days, and the member may file their own appeal
    with the payer within member_appeal_days calendar days (decided within expedited_member_appeal_hours hours when
    urgent); both are outside the patient's referral record. A referral still pending after pending_auth_limit_days
    calendar days is escalated to the referring clinician. The patient may withdraw a pending referral.
  eligibility:
  - id: decision_when_pending
    applies_to:
    - referral_authorization_approved
    - referral_authorization_denied
    kind: state
    condition: An authorization decision may be recorded only while the referral status is pending_authorization.
    evidence_fields:
    - referrals.status
    - referrals.referral_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - referrals.referral_id
      action_bindings:
        referrals.referral_id: referral_id
    state_contract:
      field: referrals.status
      allowed:
      - pending_authorization
- id: referral_scheduling_and_coordination
  subject:
  - referral_scheduled
  - referral_appointment_changed
  - referral_records_sent
  - referral_followup_contact
  - referral_cancelled
  rule: A care navigator contacts the patient to arrange a routine referral within the coordination_business_days_by_membership_tier
    of the patient's membership tier (Larkspur Access when the patient holds no membership in status trialing, active
    or past_due) and an urgent one within urgent_coordination_business_days; members of concierge_scheduling_membership_tiers
    have the outside appointment booked for them. Business days are Monday to Friday excluding US federal holidays,
    counted from the day after the anchor date. An outside appointment may be recorded only while the referral status
    is ready_to_schedule. Where authorization was required, scheduling waits for the authorization number. On plan
    types in in_network_required_plan_types the patient is told that an out-of-network receiving provider will not
    be covered, and may still choose one. The referral packet (records_bundle) is sent within records_send_business_days
    business days of scheduling without a HIPAA authorization, because a disclosure for treatment needs none; psychotherapy
    notes are never included, and substance use disorder treatment records go only with the patient's written consent.
    A referral still unscheduled followup_contact_days_if_unscheduled calendar days after it became ready gets a
    follow-up contact, at most followup_contacts_max (referral_msr_followups). The patient may withdraw a referral
    before scheduling. Where out_of_network_choice_allowed is true the patient may still pick an out-of-network
    provider; treatment_disclosure_authorization_needed, psychotherapy_notes_included and sud_records_consent_required
    set the packet rules above; scheduling waits for the authorization number where authorization_number_required_to_schedule
    is true; a changed outside appointment is re-recorded (appointment_change_reporting); the patient may withdraw
    before scheduling (cancellation_allowed_before_scheduling); language assistance is free (navigator_language_access);
    a behavioral referral that reveals imminent risk gives the crisis_redirect_line; and a surgical consult's preop_lab_panels
    are ordered under the lab rules.
  eligibility:
  - id: schedule_when_ready
    applies_to:
    - referral_scheduled
    kind: state
    condition: An outside appointment may be recorded only while the referral status is ready_to_schedule.
    evidence_fields:
    - referrals.status
    - referrals.referral_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - referrals.referral_id
      action_bindings:
        referrals.referral_id: referral_id
    state_contract:
      field: referrals.status
      allowed:
      - ready_to_schedule
  params:
    per_tier:
      In-Person Primary Care Referral:
        coordination_business_days_by_membership_tier: =coordination_business_days_by_membership_tier
      Physical Therapy Referral:
        coordination_business_days_by_membership_tier: =coordination_business_days_by_membership_tier
      Diagnostic Imaging Referral:
        coordination_business_days_by_membership_tier: =coordination_business_days_by_membership_tier
      Specialist Consultation Referral:
        coordination_business_days_by_membership_tier: =coordination_business_days_by_membership_tier
      Behavioral Health Specialty Referral:
        coordination_business_days_by_membership_tier: =coordination_business_days_by_membership_tier
      Surgical Consultation Referral:
        coordination_business_days_by_membership_tier: =coordination_business_days_by_membership_tier
  measures:
  - referral_msr_followups
- id: referral_extensions
  subject:
  - referral_extension_approved
  rule: Where extension_allowed is true and referral_msr_extensions is below extension_max_count, a referral may
    be extended by extension_additional_visits visits and extension_additional_days calendar days, subject to the
    payer's approval where authorization was required. An extension may be approved only while the referral status
    is ready_to_schedule or scheduled_externally. An extension may be requested only when the frozen time is no
    more than extension_request_window_days calendar days before the referral's valid_through and not after it.
    Day counts are calendar days added to the anchor date (the anchor date plus N days is the date N days later),
    never full 24-hour periods, and the boundary date itself counts as within the limit.
  eligibility:
  - id: extend_open
    applies_to:
    - referral_extension_approved
    kind: state
    condition: An extension may be approved only while the referral status is ready_to_schedule or scheduled_externally.
    evidence_fields:
    - referrals.status
    - referrals.referral_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - referrals.referral_id
      action_bindings:
        referrals.referral_id: referral_id
    state_contract:
      field: referrals.status
      allowed:
      - ready_to_schedule
      - scheduled_externally
  params:
    per_tier:
      In-Person Primary Care Referral:
        extension_additional_visits: =extension_additional_visits
      Physical Therapy Referral:
        extension_additional_visits: =extension_additional_visits
      Diagnostic Imaging Referral:
        extension_additional_visits: =extension_additional_visits
      Specialist Consultation Referral:
        extension_additional_visits: =extension_additional_visits
      Behavioral Health Specialty Referral:
        extension_additional_visits: =extension_additional_visits
      Surgical Consultation Referral:
        extension_additional_visits: =extension_additional_visits
  measures:
  - referral_msr_extensions
- id: referral_usage_and_closure
  subject:
  - referral_visit_reported
  - referral_consult_report_received
  - referral_completed
  - referral_expired
  - referral_lapsed
  rule: An outside visit may be reported only while the referral status is scheduled_externally. Each outside visit
    the receiving provider reports uses one authorized visit (visit_usage_source); the patient is told that visits
    beyond those authorized may not be covered (overrun_notice). The referral is completed when its last authorized
    visit is reported or, for a single-visit type, when the consult report arrives, which is expected within consult_report_expected_days
    calendar days of the appointment (closed_loop_tracking). A referral passing valid_through without being completed
    expires.
  eligibility:
  - id: report_when_scheduled
    applies_to:
    - referral_visit_reported
    kind: state
    condition: An outside visit may be reported only while the referral status is scheduled_externally.
    evidence_fields:
    - referrals.status
    - referrals.referral_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - referrals.referral_id
      action_bindings:
        referrals.referral_id: referral_id
    state_contract:
      field: referrals.status
      allowed:
      - scheduled_externally
- id: referral_reissue
  subject:
  - referral_reissued
  rule: A referral may be reissued only while its status is expired. An expired referral may be reissued only when
    the frozen time is no more than reissue_grace_days calendar days after its valid_through. Day counts are calendar
    days added to the anchor date (the anchor date plus N days is the date N days later), never full 24-hour periods,
    and the boundary date itself counts as within the limit. At most referral_reissues_max reissues are allowed;
    a reissued referral runs for default_valid_days calendar days from the reissue date and needs a new payer authorization
    where one was required (reissue_requires_reauthorization). Past the grace period a new referral, which needs
    a new completed visit, is required.
  eligibility:
  - id: reissue_expired
    applies_to:
    - referral_reissued
    kind: state
    condition: A referral may be reissued only while its status is expired.
    evidence_fields:
    - referrals.status
    - referrals.referral_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - referrals.referral_id
      action_bindings:
        referrals.referral_id: referral_id
    state_contract:
      field: referrals.status
      allowed:
      - expired
  - id: reissue_grace
    applies_to:
    - referral_reissued
    kind: time
    condition: An expired referral may be reissued only when the frozen time is no more than reissue_grace_days
      calendar days after its valid_through.
    evidence_fields:
    - referrals.valid_through
    - referrals.referral_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - referrals.referral_id
      action_bindings:
        referrals.referral_id: referral_id
    temporal_basis:
      clock: frozen_time
      anchor_event: its valid_through
      anchor_source: referrals.valid_through
      relation: not_after
      duration_source: variants.reissue_grace_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
