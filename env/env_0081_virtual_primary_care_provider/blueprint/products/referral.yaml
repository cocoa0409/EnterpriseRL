# Product charter: referral. Larkspur Health.
category: referral
display_name: In-Person Care Referrals
binding:
  holding_table: referrals
  event_tables:
  - referral_authorizations
  - referral_coordination
  status_field: status
  variant_field: variant_name
  quantity_fields:
    visits_remaining: authorized_visits
lifecycle:
  states:
  - pending_authorization
  - ready_to_schedule
  - scheduled_externally
  - completed
  - denied
  - expired
  - cancelled
  transitions:
  - from: pending_authorization
    to: ready_to_schedule
    by: system
    means: The payer approves the authorization
    or the referral needs none.: null
  - from: pending_authorization
    to: denied
    by: system
    means: The payer denies the authorization.
  - from: ready_to_schedule
    to: scheduled_externally
    by: agent
    means: The patient's outside appointment is booked and recorded.
  - from: scheduled_externally
    to: completed
    by: system
    means: The outside provider reports the last authorized visit or the consult report arrives.
  - from: ready_to_schedule
    to: expired
    by: system
    means: The validity date passes before an appointment is booked.
  - from: scheduled_externally
    to: expired
    by: system
    means: The validity date passes with authorized visits unused.
  - from: pending_authorization
    to: cancelled
    by: agent
    means: The referral is withdrawn at the patient's request before authorization is decided.
  - from: ready_to_schedule
    to: cancelled
    by: agent
    means: The referral is withdrawn at the patient's request before scheduling.
  - from: expired
    to: ready_to_schedule
    by: agent
    means: An expired referral is reissued within the grace period.
accounts:
- key: authorized_visits
  unit: visits
  meaning: In-person visits authorized under the referral and not yet used.
parameter_schema:
  default_valid_days: Calendar days from referral_date (or approval) to valid_through.
  default_authorized_visits: Visits authorized by default per referral; visits.
  auth_required_plan_types: Plan types (insurance coverage tiers) whose payers require authorization for this referral
    type.
  advanced_imaging_modalities: Imaging modalities that need authorization on every in-network plan type.
  advanced_imaging_auth_plan_types: Plan types needing authorization for advanced imaging.
  auth_turnaround_business_days_standard: Business days a payer takes to decide a standard authorization request.
  auth_turnaround_business_days_expedited: Business days a payer takes to decide an expedited (urgent) request.
  urgent_eligible: Whether the type may be marked urgent and requested as expedited; boolean.
  retro_authorization_allowed: Whether authorization may be sought after the outside visit happened; boolean.
  auth_from_primary_only: Whether only the primary coverage's authorization is sought; boolean.
  in_network_required_plan_types: Plan types on which the receiving provider must be in network for the visit to
    be covered.
  out_of_network_choice_allowed: Whether the patient may still choose an out-of-network provider after being told
    it will not be covered; boolean.
  extension_allowed: Whether validity and visits may be extended once; boolean.
  extension_max_count: Extensions per referral; count.
  extension_additional_visits: Visits added by an extension; visits.
  extension_additional_days: Calendar days added to valid_through by an extension.
  extension_request_window_days: An extension may be requested no more than this many calendar days before valid_through
    and not after it.
  coordination_business_days_by_membership_tier: Business days within which a care navigator contacts the patient
    to arrange a routine referral, by membership tier (patients without a membership use Larkspur Access); mapping
    tier -> business days.
  urgent_coordination_business_days: Business days within which an urgent referral is arranged for every patient.
  concierge_scheduling_membership_tiers: Membership tiers whose members have the outside appointment booked for
    them by the navigator.
  followup_contact_days_if_unscheduled: Calendar days after a referral becomes ready_to_schedule without an appointment
    before the navigator follows up.
  followup_contacts_max: Follow-up contacts per referral; count.
  records_send_business_days: Business days after scheduling within which the referral packet is sent to the receiving
    provider.
  records_bundle: Records sent in the standard packet.
  treatment_disclosure_authorization_needed: Whether the patient must sign a HIPAA authorization before records
    go to the treating provider (treatment disclosures need none); boolean.
  psychotherapy_notes_included: Whether psychotherapy notes are ever included in the packet (they need a separate
    written authorization); boolean.
  sud_records_consent_required: Whether substance use disorder treatment records need the patient's written consent
    before they are sent (42 CFR Part 2); boolean.
  consult_report_expected_days: Calendar days after the appointment by which the receiving provider's report is
    expected.
  closed_loop_tracking: Whether the referral stays open until the report or last visit is reported; boolean.
  referring_visit_lookback_days: Calendar days after the referring visit's completed_date within which the referral
    may be issued.
  max_open_referrals_same_specialty: Open referrals (pending_authorization, ready_to_schedule or scheduled_externally)
    for the same specialty per patient; count.
  peer_to_peer_request_days: Calendar days after a denial within which the referring clinician may request a peer-to-peer
    review.
  member_appeal_days: Calendar days after a denial within which the member may file their own appeal with the payer
    (ACA).
  expedited_member_appeal_hours: Hours within which the payer must decide an urgent pre-service appeal (ACA).
  referral_fee: Fee Larkspur charges for issuing and coordinating a referral; USD.
  reissue_grace_days: Calendar days after valid_through within which an expired referral may be reissued without
    a new visit.
  referral_reissues_max: Reissues allowed per referral; count.
  reissue_requires_reauthorization: Whether a reissued referral needs a new payer authorization when one was required;
    boolean.
  pending_auth_limit_days: Calendar days a referral may stay pending_authorization before the navigator escalates
    to the referring clinician.
  visit_usage_source: 'How used visits are known: receiving_provider_report.'
  overrun_notice: Whether the patient is told that visits beyond the authorized count may not be covered; boolean.
  crisis_redirect_line: Crisis line given when a behavioral referral reveals imminent risk.
  preop_lab_panels: Lab panels the surgical consult typically needs before surgery, ordered under the lab rules.
  self_pay_estimate_notice: Whether a patient with no coverage is told the outside provider bills them directly;
    boolean.
  cancellation_allowed_before_scheduling: Whether the patient may withdraw the referral before an appointment is
    booked; boolean.
  appointment_change_reporting: Whether a rescheduled outside appointment is re-recorded on the referral; boolean.
  authorization_number_required_to_schedule: Whether scheduling waits for an authorization number where authorization
    is required; boolean.
  navigator_language_access: 'Language assistance offered at no charge (Section 1557): interpreter_free.'
