# Product charter: rx. Larkspur Health.
category: rx
display_name: Larkspur Pharmacy Prescriptions
binding:
  holding_table: rx_prescriptions
  event_tables:
  - rx_fills
  - rx_charges
  intake_tables:
  - rx_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    fills_remaining: fill_units
lifecycle:
  states:
  - active
  - on_hold
  - completed
  - expired
  - transferred_out
  - discontinued
  transitions:
  - from: active
    to: on_hold
    by: system
    means: A fill cannot proceed because of a prior authorization
    an insurance rejection: null
    a declined card or an address problem.: null
  - from: on_hold
    to: active
    by: system
    means: The hold reason is resolved.
  - from: active
    to: completed
    by: system
    means: The last authorized fill unit is dispensed.
  - from: active
    to: expired
    by: system
    means: The expiration date passes with fill units left.
  - from: on_hold
    to: expired
    by: system
    means: The expiration date passes while on hold.
  - from: active
    to: transferred_out
    by: agent
    means: The remaining fills are transferred to a retail pharmacy at the patient's request.
  - from: active
    to: discontinued
    by: system
    means: The clinician stops the medication
    or a renewal replaces the prescription.: null
  - from: on_hold
    to: discontinued
    by: system
    means: The hold lasts beyond the hold limit
    or the clinician stops the medication.: null
accounts:
- key: fill_units
  unit: 30-day fill units
  meaning: Authorized 30-day fill units not yet dispensed.
- key: rx_billed
  unit: USD
  meaning: Net amount charged to the patient for the prescription (fill and shipping charges less refunds).
parameter_schema:
  cash_price_available: Whether the level is sold at a Larkspur Pharmacy cash price; boolean (brands are dispensed
    only through the pharmacy benefit).
  cash_price_30_day: Cash price of a 30-day fill; USD (0.00 where no cash price is offered).
  cash_price_90_day: Cash price of a 90-day fill; USD (0.00 where no cash price is offered).
  days_supply_options: Days supply that may be dispensed per fill.
  fill_units_per_90_day: 30-day fill units one 90-day fill uses; units.
  member_discount_pct_by_membership_tier: Percent off the cash price by the patient's membership tier; mapping tier
    -> percent.
  member_discount_statuses: Membership statuses that qualify for the member discount.
  member_discount_applies_to: 'What the member discount reduces: cash_drug_price only (never shipping or pharmacy-benefit
    patient pay).'
  insurance_billing_available: Whether fills may be billed to the patient's pharmacy benefit; boolean.
  lower_of_cash_or_benefit: Whether a benefit-billed fill is charged the lower of the benefit patient pay and the
    patient's cash price; boolean.
  prior_authorization_typical: Whether benefit-billed fills of this level commonly need prior authorization before
    dispensing; boolean.
  prior_auth_hold_limit_days: Calendar days a prescription may stay on hold for prior authorization before it is
    discontinued.
  other_hold_limit_days: Calendar days a prescription may stay on hold for any other reason before it is discontinued.
  shipping_standard_fee: Fee for standard shipping; USD.
  shipping_expedited_fee: Fee for expedited shipping; USD.
  shipping_overnight_fee: Fee for overnight shipping; USD.
  free_expedited_membership_tiers: Membership tiers whose members get expedited shipping at no charge (overnight
    is charged the overnight fee less the expedited fee).
  standard_delivery_business_days: Business days after shipping for standard delivery.
  expedited_delivery_business_days: Business days after shipping for expedited delivery.
  overnight_delivery_business_days: Business days after shipping for overnight delivery.
  signature_required: Whether delivery requires an adult signature; boolean.
  ship_states: States to which Larkspur Pharmacy may ship (its pharmacy licenses), by the patient's home_state.
  refill_min_elapsed_pct: Percent of the previous fill's days supply that must have elapsed since its fill_date
    before the next fill is dispensed.
  early_refill_overrides_per_12_months: Early-refill overrides (travel or lost medication) allowed per rolling 12
    months per prescription; count.
  early_override_min_elapsed_pct: Percent of the previous fill's days supply that must have elapsed for an early-refill
    override.
  rx_validity_months: Calendar months from written_date to expiration_date.
  renewal_visit_lookback_months: Calendar months before the renewal request within which the patient must have a
    completed qualifying visit for the clinician to renew without a new visit.
  renewal_qualifying_visit_types: Completed visit types that support a renewal.
  renewal_review_business_days: Business days within which a clinician decides a renewal request.
  renewal_request_window_days: Calendar days before expiration_date (or after the last fill unit) from which a renewal
    may be requested.
  renewal_fills_authorized: 30-day fill units authorized on a renewal written without a new visit.
  bridge_supply_fill_units: 30-day fill units a clinician may authorize as a one-time bridge while the patient waits
    for a booked qualifying visit; 0 = none.
  bridge_requires_booked_visit_within_days: Calendar days ahead within which the qualifying visit must be scheduled
    for a bridge supply.
  auto_refill_available: Whether auto-refill can be turned on; boolean.
  auto_refill_ship_days_before_due: Calendar days before the refill due date on which an auto-refill ships.
  auto_refill_cancel_cutoff_days: Calendar days before the auto-refill ship date after which that shipment can no
    longer be stopped.
  transfer_out_allowed: Whether remaining fills may be transferred to a retail pharmacy; boolean.
  transfers_out_per_rx: Transfers out allowed per prescription; count.
  transfer_fee: Fee to transfer a prescription out; USD.
  transfer_back_allowed: Whether a prescription transferred out can return to Larkspur Pharmacy (a new prescription
    is needed instead); boolean.
  returns_accepted: 'Which dispensed fills are taken back for refund: pharmacy_error_only (state pharmacy law bars
    restocking dispensed medication).'
  pharmacy_error_remedy: 'Remedy for a dispensing error: full_refund_and_reship.'
  lost_package_report_days: Calendar days after the expected delivery date within which a lost or damaged package
    must be reported.
  lost_package_reships_per_fill: Free reships per dispensed fill for a lost or damaged package; count.
  undeliverable_return_handling: 'What happens when a package is returned undeliverable: restock_units_and_refund
    (fill units restored and fill and shipping charges refunded).'
  charge_timing: 'When fills and shipping are charged: at_shipment.'
  controlled_substances_prescribed: Whether Larkspur clinicians prescribe DEA Schedule II-V controlled substances
    for this level; boolean.
  price_rounding: 'Rounding of computed pharmacy amounts: half_up_cent.'
  max_active_rx_same_drug: Prescriptions for the same drug_name that may be active or on_hold at once per patient;
    count.
