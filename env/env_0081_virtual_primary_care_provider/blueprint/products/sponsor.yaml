# Product charter: sponsor. Larkspur Health.
category: sponsor
display_name: Larkspur at Work
binding:
  holding_table: sponsor_enrollments
  event_tables:
  - sponsor_contributions
  - sponsor_eligibility_records
  - sponsor_incentives
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - pending_eligibility
  - active
  - on_leave
  - ended
  transitions:
  - from: pending_eligibility
    to: active
    by: system
    means: The registration matches the employer's eligibility record and the coverage start date is reached.
  - from: pending_eligibility
    to: ended
    by: system
    means: The registration never matches an eligibility record within the expiry period and is closed.
  - from: active
    to: on_leave
    by: system
    means: The employer's file reports an approved leave of absence for the employee.
  - from: on_leave
    to: active
    by: system
    means: The employer's file reports the employee's return from leave.
  - from: active
    to: ended
    by: system
    means: Coverage reaches its coverage_end_date after a termination
    age-out or contract end.: null
  - from: on_leave
    to: ended
    by: system
    means: Leave continuation runs out
    direct-bill contributions lapse: null
    or employment ends during leave.: null
  - from: ended
    to: active
    by: system
    means: The employer reinstates the patient within the retroactive reinstatement limit.
accounts:
- key: employee_contributions
  unit: USD
  meaning: Net contributions the patient has paid toward the Larkspur at Work plan (payroll deductions and direct-bill
    payments less refunds).
- key: wellness_rewards
  unit: USD
  meaning: Wellness incentive earned but not yet paid out to the patient through payroll.
parameter_schema:
  employee_monthly_contribution: Monthly contribution the employee pays for their own coverage; USD.
  spouse_monthly_contribution: Monthly contribution for a covered spouse; USD.
  child_monthly_contribution: Monthly contribution for each covered child; USD.
  family_contribution_cap_monthly: Maximum total monthly contribution across all enrollments under one subscriber;
    USD.
  contribution_basis: 'Unit for contributions: per_covered_month (one posting per calendar month of coverage).'
  contribution_first_month_rule: 'First-month contribution: full_if_start_on_or_before_15th (a month whose coverage
    starts after the 15th carries no contribution).'
  contribution_last_month_rule: 'Last-month contribution: full_month (the month containing coverage_end_date is
    charged in full).'
  contribution_refund_on_retro_term: Whether contributions posted for months wholly after a retroactive coverage_end_date
    are refunded; boolean.
  contribution_refund_limit_months: Maximum number of covered months refunded after a retroactive termination; months.
  contribution_rounding: 'Rounding of computed contribution amounts: half_up_cent.'
  spouse_eligible: Whether a spouse may be covered; boolean.
  children_eligible: Whether children may be covered; boolean.
  max_dependents: Maximum spouse plus child enrollments under one subscriber at any time; count.
  dependent_child_age_limit_months: A child's coverage ends at the age-out point reached at this age in completed
    months (312 = 26 years).
  dependent_age_out_rule: 'When a child''s coverage ends on reaching the age limit: end_of_birthday_month.'
  min_member_age_months: Minimum age of a covered patient in completed months (36 = 3 years).
  coverage_start_rule: 'How coverage_start_date is set: later_of_eligibility_and_registration (the later of eligibility_effective_date
    and registered_date).'
  waiting_period_days: Calendar days added to eligibility_effective_date before coverage may start (the employer's
    new-hire waiting period on this plan).
  eligibility_match_fields: 'Profile facts a registration must match against the eligibility record: full_name,
    date_of_birth and home_zip.'
  pending_registration_expiry_days: Calendar days after registered_date after which an unmatched registration is
    closed.
  eligibility_file_frequency_days: Calendar days between the employer's scheduled eligibility files.
  file_processing_lag_days: Business days Larkspur takes to apply an eligibility file after file_date.
  termination_effective_rule: 'How coverage_end_date follows a terminate line: end_of_month (last day of the month
    containing the stated effective date).'
  retro_termination_limit_days: Furthest a terminate line's effective date may precede its file_date; calendar days.
  retro_reinstatement_limit_days: Furthest a reinstate line may follow the coverage_end_date it reverses; calendar
    days.
  retro_add_limit_days: Furthest an add line's effective date may precede its file_date; calendar days.
  reinstatement_contribution_backbill: Whether contributions are posted for the months restored by a reinstatement;
    boolean.
  backbill_limit_months: Maximum restored months back-billed after a reinstatement; months.
  plan_year_length_months: Length of the employer plan year; months.
  mid_year_plan_change_allowed: Whether the employer may move the group to another plan mid plan year; boolean.
  plan_change_effective: 'When a plan_change line takes effect: plan_year_start (the next plan year start).'
  special_enrollment_window_days: Calendar days after a qualifying life event within which a mid-year dependent
    add is accepted.
  qualifying_life_events: Qualifying life events accepted for a mid-year dependent add.
  newborn_retro_to_birth: Whether coverage for a newborn or adopted child starts on the date of birth or placement;
    boolean.
  loa_continuation_months: Whole months coverage continues during an approved leave of absence; months.
  loa_contribution_method: 'How contributions are collected during leave: direct_bill.'
  direct_bill_due_days: Calendar days after the first day of a leave month by which its direct-bill contribution
    is due.
  direct_bill_grace_days: Calendar days after the direct-bill due date before an unpaid leave month ends coverage.
  wellness_incentive_amount: Incentive earned for one completed qualifying visit; USD.
  wellness_incentive_max_per_plan_year: Maximum incentives earned per enrollment per plan year; count.
  wellness_qualifying_visit_type: Visit type whose completion earns the incentive (official visit type name).
  spouse_incentive_eligible: Whether a covered spouse may earn the incentive; boolean.
  incentive_payout_method: 'How an earned incentive is paid: payroll_credit through the employer.'
  incentive_payout_lag_days: Calendar days after earning by which the incentive is paid.
  incentive_requires_active_on_payout: Whether the enrollment must be active or on_leave on the payout date, otherwise
    the incentive is forfeited; boolean.
  incentive_claim_deadline_days: Calendar days after the plan year ends during which a visit completed in that plan
    year can still earn its incentive.
  dual_enrollment_priority: 'Which enrollment stays when a patient appears under two groups: employee_over_dependent,
    then earliest coverage_start_date.'
  dependent_requires_covered_subscriber: Whether a spouse or child may be covered only while the employee subscriber's
    own enrollment is active or on_leave; boolean.
