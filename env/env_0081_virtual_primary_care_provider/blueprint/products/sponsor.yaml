events:
- type: sponsor_enrollment_registered
  target: sponsor_enrollments
  mutation: create
  meaning: A patient registers in the app under an employer's Larkspur at Work group.
  grain: one row per registration
  fields:
    variant_name: Plan of the employer group.
    employer_name: Employer as shown on the group.
    employer_group_number: Group number the patient entered.
    member_relationship: employee, spouse or child.
    subscriber_customer_id: The employee subscriber.
    registered_date: Date of registration.
    plan_year_start: Current plan year start of the group.
    contribution_method: payroll at registration.
  triggers: []
- type: sponsor_coverage_started
  target: sponsor_enrollments
  mutation:
    transition:
      from: pending_eligibility
      to: active
  meaning: A matched registration reaches its coverage start date.
  grain: one row per transaction
  fields:
    eligibility_effective_date: Effective date on the matching eligibility line.
    coverage_start_date: Start date set by coverage_start_rule and waiting_period_days.
  triggers: []
- type: sponsor_registration_expired
  target: sponsor_enrollments
  mutation:
    transition:
      from: pending_eligibility
      to: ended
  meaning: A registration that never matched an eligibility line is closed.
  grain: one row per transaction
  fields:
    termination_reason: registration_expired.
  triggers: []
- type: sponsor_leave_started
  target: sponsor_enrollments
  mutation:
    transition:
      from: active
      to: on_leave
  meaning: The employee starts an approved leave of absence reported by the employer.
  grain: one row per transaction
  fields:
    leave_start_date: First day of leave.
    contribution_method: direct_bill during leave.
  triggers: []
- type: sponsor_leave_ended
  target: sponsor_enrollments
  mutation:
    transition:
      from: on_leave
      to: active
  meaning: The employee returns from leave.
  grain: one row per transaction
  fields:
    leave_start_date: Cleared to empty.
    contribution_method: payroll again.
  triggers: []
- type: sponsor_coverage_ended
  target: sponsor_enrollments
  mutation:
    transition:
      from: active
      to: ended
  meaning: Coverage passes its coverage_end_date.
  grain: one row per transaction
  fields:
    coverage_end_date: Last covered day.
    termination_reason: Reason for the end.
  triggers: []
- type: sponsor_leave_coverage_ended
  target: sponsor_enrollments
  mutation:
    transition:
      from: on_leave
      to: ended
  meaning: Coverage ends while the employee is on leave.
  grain: one row per transaction
  fields:
    coverage_end_date: Last covered day.
    termination_reason: Reason for the end.
  triggers: []
- type: sponsor_coverage_reinstated
  target: sponsor_enrollments
  mutation:
    transition:
      from: ended
      to: active
  meaning: The employer reinstates an ended enrollment within the retroactive limit.
  grain: one row per transaction
  fields:
    coverage_end_date: Cleared to empty.
    termination_reason: Reset to none.
  triggers: []
- type: sponsor_plan_changed
  target: sponsor_enrollments
  mutation: update
  meaning: The employer group moves to another plan at a plan year start.
  grain: one row per transaction
  fields:
    variant_name: New plan.
    plan_year_start: The new plan year start.
  triggers: []
- type: sponsor_coverage_end_scheduled
  target: sponsor_enrollments
  mutation: update
  meaning: A coverage end date is set from a terminate line, an age-out or a contract end.
  grain: one row per transaction
  fields:
    coverage_end_date: Last covered day under termination_effective_rule or dependent_age_out_rule.
    termination_reason: Reason for the end.
  triggers: []
- type: sponsor_contribution_posted
  target: sponsor_contributions
  meaning: The patient's contribution for one covered month is collected.
  grain: one row per enrollment per covered month
  distinguish_by:
  - contribution_month
  fields:
    amount: Contribution for the month.
    contribution_month: Month covered.
    posted_date: Date collected.
    contribution_method: payroll or direct_bill.
  account: employee_contributions
  direction: in
  triggers: []
- type: sponsor_contribution_refunded
  target: sponsor_contributions
  meaning: A contribution for a month that turned out not to be covered is returned.
  grain: one row per refunded posting
  distinguish_by:
  - original_contribution_id
  fields:
    amount: Negative amount returned.
    contribution_month: Month of the original posting.
    posted_date: Refund date.
    contribution_method: Method of the original posting.
    original_contribution_id: Posting returned.
  account: employee_contributions
  direction: out
  triggers: []
- type: sponsor_eligibility_record_received
  target: sponsor_eligibility_records
  meaning: An employer eligibility-file line about the patient is received.
  grain: one row per file line
  distinguish_by:
  - file_date
  - change_type
  - effective_date
  fields:
    change_type: Change reported.
    effective_date: Effective date stated by the employer.
    file_date: Date the file was received.
    qle_type: Qualifying life event of a dependent add.
    new_variant_name: Target plan of a plan_change line.
  triggers:
  - event: sponsor:sponsor_coverage_end_scheduled
    when:
      change_type: terminate
    map: {}
  - event: sponsor:sponsor_leave_started
    when:
      change_type: leave_start
    map:
      leave_start_date: effective_date
  - event: sponsor:sponsor_leave_ended
    when:
      change_type: leave_end
    map: {}
- type: sponsor_incentive_earned
  target: sponsor_incentives
  meaning: A completed qualifying visit earns the plan's wellness incentive.
  grain: one row per qualifying visit
  distinguish_by:
  - qualifying_visit_id
  fields:
    amount: wellness_incentive_amount.
    incentive_date: Date earned (the visit completion date).
    plan_year_start: Plan year of the visit.
    qualifying_visit_id: The completed visit.
  account: wellness_rewards
  direction: in
  triggers: []
- type: sponsor_incentive_paid
  target: sponsor_incentives
  meaning: An earned incentive is paid through payroll.
  grain: one row per earned incentive
  distinguish_by:
  - source_incentive_id
  fields:
    amount: Amount paid.
    incentive_date: Payout date.
    plan_year_start: Plan year of the earned line.
    qualifying_visit_id: Visit of the earned line.
    source_incentive_id: Earned line paid.
  account: wellness_rewards
  direction: out
  triggers: []
- type: sponsor_incentive_forfeited
  target: sponsor_incentives
  meaning: An earned incentive is forfeited because coverage ended before payout.
  grain: one row per earned incentive
  distinguish_by:
  - source_incentive_id
  fields:
    amount: Amount forfeited.
    incentive_date: Forfeiture date.
    plan_year_start: Plan year of the earned line.
    qualifying_visit_id: Visit of the earned line.
    source_incentive_id: Earned line forfeited.
  account: wellness_rewards
  direction: out
  triggers: []
measures:
- id: sponsor_msr_active_dependents
  window: current state at frozen_time
  measure: count of sponsor_enrollments rows whose subscriber_customer_id is the subscriber, member_relationship
    is spouse or child, and status is pending_eligibility, active or on_leave
- id: sponsor_msr_family_contribution_month
  window: one contribution_month
  measure: sum of amount over sponsor_contribution_posted rows of every enrollment sharing the subscriber_customer_id
    for that contribution_month
- id: sponsor_msr_incentives_plan_year
  window: the plan year identified by plan_year_start
  measure: count of sponsor_incentive_earned rows of the enrollment with that plan_year_start
policies:
- id: sponsor_agg_multi_holding
  subject:
  - sponsor_enrollment_registered
  rule: 'A patient is covered by at most one Larkspur at Work enrollment at a time. A new registration may be created
    only when the patient holds no other enrollment whose status is pending_eligibility, active or on_leave. When
    an employer file names a patient already covered under another group, dual_enrollment_priority decides which
    enrollment stays: an employee enrollment is kept over a dependent one, and between two of the same kind the
    one with the earlier coverage_start_date is kept; the other registration is not created. Ended enrollments never
    block a new registration.'
  eligibility:
  - id: one_open_enrollment
    applies_to:
    - sponsor_enrollment_registered
    kind: dedup
    condition: A new registration may be created only when the patient holds no other enrollment whose status is
      pending_eligibility, active or on_leave.
    evidence_fields:
    - sponsor_enrollments.customer_id
    - sponsor_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.customer_id
      action_bindings:
        sponsor_enrollments.customer_id: customer_id
    dedup_contract:
      table: sponsor_enrollments
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - pending_eligibility
        - active
        - on_leave
      distinct_fields: []
  params:
    max_per_customer: 1
- id: sponsor_registration_eligibility
  subject:
  - sponsor_enrollment_registered
  - sponsor_coverage_started
  - sponsor_registration_expired
  rule: Coverage exists only for patients the employer names on its eligibility file. A registration matches an
    eligibility line when every fact in eligibility_match_fields on the patient profile equals the line, and an
    unmatched registration stays pending_eligibility. A registration may start coverage only while its status is
    pending_eligibility. Coverage starts on the later of the eligibility line's effective date plus waiting_period_days
    calendar days and the registered_date (coverage_start_rule). A patient may be covered only when the patient's
    age on the coverage start date is at least min_member_age_months completed calendar months after the patient's
    date of birth. Month counts are calendar months added to the anchor date; when that day does not exist in the
    target month the last day of that month is used, and the boundary date itself counts as reached. An unmatched
    registration may be closed only when the frozen time is at or after its registered_date plus pending_registration_expiry_days
    calendar days. Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
    N days later), never full 24-hour periods, and the boundary date itself counts as within the limit. Eligibility
    lines are applied within file_processing_lag_days business days (Monday to Friday, excluding US federal holidays)
    of their file_date; an add line whose effective date precedes its file_date by more than retro_add_limit_days
    calendar days starts coverage on file_date minus retro_add_limit_days instead. Employers send eligibility files
    every eligibility_file_frequency_days calendar days.
  eligibility:
  - id: pending_to_start
    applies_to:
    - sponsor_coverage_started
    kind: state
    condition: A registration may start coverage only while its status is pending_eligibility.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - pending_eligibility
  - id: registration_expiry
    applies_to:
    - sponsor_registration_expired
    kind: time
    condition: An unmatched registration may be closed only when the frozen time is at or after its registered_date
      plus pending_registration_expiry_days calendar days.
    evidence_fields:
    - sponsor_enrollments.registered_date
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    temporal_basis:
      clock: frozen_time
      anchor_event: its registered_date
      anchor_source: sponsor_enrollments.registered_date
      relation: not_before
      duration_source: variants.pending_registration_expiry_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  - id: member_min_age
    applies_to:
    - sponsor_coverage_started
    kind: time
    condition: A patient may be covered only when the patient's age on the coverage start date is at least min_member_age_months
      completed calendar months after the patient's date of birth.
    evidence_fields:
    - customers.date_of_birth
    - customers.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the patient's date of birth
      anchor_source: customers.date_of_birth
      relation: not_before
      duration_source: variants.min_member_age_months
      unit: calendar_months
      counting_rule: Month counts are calendar months added to the anchor date; when that day does not exist in
        the target month the last day of that month is used, and the boundary date itself counts as reached.
      boundary: inclusive
  params:
    per_tier:
      Larkspur at Work Virtual Urgent Care:
        waiting_period_days: =waiting_period_days
        min_member_age_months: =min_member_age_months
      Larkspur at Work Core:
        waiting_period_days: =waiting_period_days
        min_member_age_months: =min_member_age_months
      Larkspur at Work Core with Behavioral Health:
        waiting_period_days: =waiting_period_days
        min_member_age_months: =min_member_age_months
      Larkspur at Work Enhanced:
        waiting_period_days: =waiting_period_days
        min_member_age_months: =min_member_age_months
      Larkspur at Work Total Care:
        waiting_period_days: =waiting_period_days
        min_member_age_months: =min_member_age_months
      Larkspur at Work Total Care Plus:
        waiting_period_days: =waiting_period_days
        min_member_age_months: =min_member_age_months
- id: sponsor_dependents
  subject:
  - sponsor_enrollment_registered
  - sponsor_coverage_started
  - sponsor_coverage_end_scheduled
  rule: A spouse may be covered only on a plan whose spouse_eligible is true and a child only on a plan whose children_eligible
    is true, and sponsor_msr_active_dependents may not exceed max_dependents. A spouse or child's coverage may start
    only while the subscriber's own enrollment status is active or on_leave. Dependents added at the employee's
    own registration or at the plan year start need no qualifying event; any other dependent add is a mid-year add
    that needs one of qualifying_life_events. A mid-year dependent add may be accepted only when the frozen time
    is no more than special_enrollment_window_days calendar days after the qualifying life event's effective date.
    Day counts are calendar days added to the anchor date (the anchor date plus N days is the date N days later),
    never full 24-hour periods, and the boundary date itself counts as within the limit. A newborn or newly adopted
    child's coverage starts on the date of birth or placement where newborn_retro_to_birth is true, otherwise on
    the date the dependent_add line is applied. A child's coverage ends at the end of the month in which the child
    reaches dependent_child_age_limit_months (dependent_age_out_rule), and the end date is scheduled with termination_reason
    dependent_age_out. When the subscriber's enrollment ends, every dependent enrollment under it ends on the same
    coverage_end_date. Where dependent_requires_covered_subscriber is true, a dependent is covered only while the
    subscriber is.
  eligibility:
  - id: subscriber_covered
    applies_to:
    - sponsor_coverage_started
    kind: state
    condition: A spouse or child's coverage may start only while the subscriber's own enrollment status is active
      or on_leave.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.subscriber_customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.subscriber_customer_id
      action_bindings:
        sponsor_enrollments.subscriber_customer_id: subscriber_customer_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - active
      - on_leave
  - id: special_enrollment_window
    applies_to:
    - sponsor_enrollment_registered
    kind: time
    condition: A mid-year dependent add may be accepted only when the frozen time is no more than special_enrollment_window_days
      calendar days after the qualifying life event's effective date.
    evidence_fields:
    - sponsor_eligibility_records.effective_date
    - sponsor_eligibility_records.qle_type
    - sponsor_eligibility_records.elig_record_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_eligibility_records.elig_record_id
      action_bindings:
        sponsor_eligibility_records.elig_record_id: elig_record_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the qualifying life event's effective date
      anchor_source: sponsor_eligibility_records.effective_date
      relation: not_after
      duration_source: variants.special_enrollment_window_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  params:
    per_tier:
      Larkspur at Work Virtual Urgent Care:
        spouse_eligible: =spouse_eligible
        children_eligible: =children_eligible
        max_dependents: =max_dependents
      Larkspur at Work Core:
        spouse_eligible: =spouse_eligible
        children_eligible: =children_eligible
        max_dependents: =max_dependents
      Larkspur at Work Core with Behavioral Health:
        spouse_eligible: =spouse_eligible
        children_eligible: =children_eligible
        max_dependents: =max_dependents
      Larkspur at Work Enhanced:
        spouse_eligible: =spouse_eligible
        children_eligible: =children_eligible
        max_dependents: =max_dependents
      Larkspur at Work Total Care:
        spouse_eligible: =spouse_eligible
        children_eligible: =children_eligible
        max_dependents: =max_dependents
      Larkspur at Work Total Care Plus:
        spouse_eligible: =spouse_eligible
        children_eligible: =children_eligible
        max_dependents: =max_dependents
  measures:
  - sponsor_msr_active_dependents
- id: sponsor_terminations
  subject:
  - sponsor_eligibility_record_received
  - sponsor_coverage_end_scheduled
  - sponsor_coverage_ended
  - sponsor_coverage_reinstated
  rule: Coverage ends only on the employer's eligibility file, an age-out or the end of the employer's contract;
    a patient cannot end an employer enrollment. A coverage end date may be scheduled only while the enrollment
    status is pending_eligibility, active or on_leave. A terminate line sets coverage_end_date to the last day of
    the month containing its stated effective date (termination_effective_rule). A terminate line may be applied
    as stated only when the frozen time is no more than retro_termination_limit_days calendar days after the line's
    effective date. Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
    N days later), never full 24-hour periods, and the boundary date itself counts as within the limit. A line that
    is more retroactive than that ends coverage on the last day of the month containing the frozen time minus retro_termination_limit_days.
    On coverage_end_date the enrollment ends. Visits and lab orders that Larkspur at Work already paid for on dates
    later than a retroactive coverage_end_date are never re-billed to the patient. An ended enrollment may be reinstated
    only when the frozen time is no more than retro_reinstatement_limit_days calendar days after its coverage_end_date.
    A reinstatement clears coverage_end_date and termination_reason and restores coverage without a gap.
  eligibility:
  - id: end_schedulable
    applies_to:
    - sponsor_coverage_end_scheduled
    kind: state
    condition: A coverage end date may be scheduled only while the enrollment status is pending_eligibility, active
      or on_leave.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - pending_eligibility
      - active
      - on_leave
  - id: retro_term_limit
    applies_to:
    - sponsor_coverage_end_scheduled
    kind: time
    condition: A terminate line may be applied as stated only when the frozen time is no more than retro_termination_limit_days
      calendar days after the line's effective date.
    evidence_fields:
    - sponsor_eligibility_records.effective_date
    - sponsor_eligibility_records.elig_record_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_eligibility_records.elig_record_id
      action_bindings:
        sponsor_eligibility_records.elig_record_id: elig_record_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the line's effective date
      anchor_source: sponsor_eligibility_records.effective_date
      relation: not_after
      duration_source: variants.retro_termination_limit_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  - id: reinstatement_limit
    applies_to:
    - sponsor_coverage_reinstated
    kind: time
    condition: An ended enrollment may be reinstated only when the frozen time is no more than retro_reinstatement_limit_days
      calendar days after its coverage_end_date.
    evidence_fields:
    - sponsor_enrollments.coverage_end_date
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    temporal_basis:
      clock: frozen_time
      anchor_event: its coverage_end_date
      anchor_source: sponsor_enrollments.coverage_end_date
      relation: not_after
      duration_source: variants.retro_reinstatement_limit_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
- id: sponsor_evt_contributions
  subject:
  - sponsor_contribution_posted
  - sponsor_contribution_refunded
  rule: Each covered calendar month carries one contribution at the plan's employee_monthly_contribution, spouse_monthly_contribution
    or child_monthly_contribution according to member_relationship (contribution_basis). The first month is charged
    in full when coverage starts on or before the 15th and not at all when it starts later (contribution_first_month_rule);
    the month containing coverage_end_date is charged in full (contribution_last_month_rule). A contribution may
    be posted only while the enrollment status is active or on_leave. A contribution for a month may be posted only
    when no posting already exists for the same enrollment and contribution_month. Across all enrollments sharing
    one subscriber_customer_id, sponsor_msr_family_contribution_month may not exceed family_contribution_cap_monthly;
    the posting that would pass the cap is reduced to the room left, and later postings for that month are 0.00
    and not written. Contributions are collected by payroll, or by direct bill while on leave. After a retroactive
    termination, every posting for a month wholly after the new coverage_end_date is refunded in full, at most contribution_refund_limit_months
    postings, latest month first (contribution_refund_on_retro_term). After a reinstatement, the restored months
    are posted where reinstatement_contribution_backbill is true, at most backbill_limit_months. Amounts are rounded
    half up to the cent. Rounding follows contribution_rounding.
  eligibility:
  - id: one_posting_per_month
    applies_to:
    - sponsor_contribution_posted
    kind: dedup
    condition: A contribution for a month may be posted only when no posting already exists for the same enrollment
      and contribution_month.
    evidence_fields:
    - sponsor_contributions.enrollment_id
    - sponsor_contributions.contribution_month
    - sponsor_contributions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_contributions.enrollment_id
      action_bindings:
        sponsor_contributions.enrollment_id: enrollment_id
    dedup_contract:
      table: sponsor_contributions
      mode: separate_record
      object_bindings:
        enrollment_id: enrollment_id
        contribution_month: contribution_month
      duplicate_filters:
        event_type:
        - sponsor_contribution_posted
      distinct_fields: []
  - id: contribution_state
    applies_to:
    - sponsor_contribution_posted
    kind: state
    condition: A contribution may be posted only while the enrollment status is active or on_leave.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - active
      - on_leave
  params:
    per_tier:
      Larkspur at Work Virtual Urgent Care:
        employee_monthly_contribution: =employee_monthly_contribution
        spouse_monthly_contribution: =spouse_monthly_contribution
        child_monthly_contribution: =child_monthly_contribution
        family_contribution_cap_monthly: =family_contribution_cap_monthly
      Larkspur at Work Core:
        employee_monthly_contribution: =employee_monthly_contribution
        spouse_monthly_contribution: =spouse_monthly_contribution
        child_monthly_contribution: =child_monthly_contribution
        family_contribution_cap_monthly: =family_contribution_cap_monthly
      Larkspur at Work Core with Behavioral Health:
        employee_monthly_contribution: =employee_monthly_contribution
        spouse_monthly_contribution: =spouse_monthly_contribution
        child_monthly_contribution: =child_monthly_contribution
        family_contribution_cap_monthly: =family_contribution_cap_monthly
      Larkspur at Work Enhanced:
        employee_monthly_contribution: =employee_monthly_contribution
        spouse_monthly_contribution: =spouse_monthly_contribution
        child_monthly_contribution: =child_monthly_contribution
        family_contribution_cap_monthly: =family_contribution_cap_monthly
      Larkspur at Work Total Care:
        employee_monthly_contribution: =employee_monthly_contribution
        spouse_monthly_contribution: =spouse_monthly_contribution
        child_monthly_contribution: =child_monthly_contribution
        family_contribution_cap_monthly: =family_contribution_cap_monthly
      Larkspur at Work Total Care Plus:
        employee_monthly_contribution: =employee_monthly_contribution
        spouse_monthly_contribution: =spouse_monthly_contribution
        child_monthly_contribution: =child_monthly_contribution
        family_contribution_cap_monthly: =family_contribution_cap_monthly
  measures:
  - sponsor_msr_family_contribution_month
- id: sponsor_leave_of_absence
  subject:
  - sponsor_leave_started
  - sponsor_leave_ended
  - sponsor_leave_coverage_ended
  rule: An employee on an approved leave of absence keeps coverage, with every dependent, for up to loa_continuation_months.
    Leave coverage may continue only until the frozen time reaches the leave_start_date plus loa_continuation_months
    calendar months. Month counts are calendar months added to the anchor date; when that day does not exist in
    the target month the last day of that month is used, and the boundary date itself counts as reached. During
    leave each month's contribution is direct-billed (loa_contribution_method) and is due direct_bill_due_days calendar
    days after the first day of that month; when it is still unpaid direct_bill_grace_days calendar days after the
    due date, coverage ends on the last day of the month before the unpaid month. When the continuation runs out,
    coverage ends on that date, unless the employer's file reports the return first. A leave_end line returns the
    enrollment to active with payroll contributions from the next month.
  eligibility:
  - id: loa_continuation
    applies_to:
    - sponsor_leave_coverage_ended
    - sponsor_leave_ended
    kind: time
    condition: Leave coverage may continue only until the frozen time reaches the leave_start_date plus loa_continuation_months
      calendar months.
    evidence_fields:
    - sponsor_enrollments.leave_start_date
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the leave_start_date
      anchor_source: sponsor_enrollments.leave_start_date
      relation: not_after
      duration_source: variants.loa_continuation_months
      unit: calendar_months
      counting_rule: Month counts are calendar months added to the anchor date; when that day does not exist in
        the target month the last day of that month is used, and the boundary date itself counts as reached.
      boundary: exclusive
- id: sponsor_plan_year_changes
  subject:
  - sponsor_plan_changed
  rule: The employer chooses the plan for a whole plan year of plan_year_length_months; a plan_change line takes
    effect on the next plan_year_start (plan_change_effective) because mid_year_plan_change_allowed is false on
    every plan. A plan change may be applied only while the enrollment status is pending_eligibility, active or
    on_leave. Plan-year limits and incentives reset on plan_year_start, and the enrollment keeps its coverage_start_date
    across plan changes.
  eligibility:
  - id: plan_change_state
    applies_to:
    - sponsor_plan_changed
    kind: state
    condition: A plan change may be applied only while the enrollment status is pending_eligibility, active or on_leave.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - pending_eligibility
      - active
      - on_leave
- id: sponsor_evt_wellness_incentive
  subject:
  - sponsor_incentive_earned
  - sponsor_incentive_paid
  - sponsor_incentive_forfeited
  rule: A covered employee earns wellness_incentive_amount when a visit of wellness_qualifying_visit_type is completed
    on a date of coverage, at most wellness_incentive_max_per_plan_year per plan year (sponsor_msr_incentives_plan_year);
    a spouse earns it only where spouse_incentive_eligible is true and children never do. An incentive may be earned
    only for a qualifying visit appointment whose status is completed. An incentive may be earned only when no incentive
    already exists for the same qualifying visit. A visit completed in a plan year can still earn its incentive
    for incentive_claim_deadline_days calendar days after that plan year ends. The incentive is paid as a payroll
    credit (incentive_payout_method) within incentive_payout_lag_days calendar days of earning. An earned incentive
    may be paid only while the enrollment status is active or on_leave. An earned incentive whose enrollment has
    ended before payout is forfeited (incentive_requires_active_on_payout).
  eligibility:
  - id: visit_completed
    applies_to:
    - sponsor_incentive_earned
    kind: state
    condition: An incentive may be earned only for a qualifying visit appointment whose status is completed.
    evidence_fields:
    - visit_appointments.status
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    state_contract:
      field: visit_appointments.status
      allowed:
      - completed
  - id: one_incentive_per_visit
    applies_to:
    - sponsor_incentive_earned
    kind: dedup
    condition: An incentive may be earned only when no incentive already exists for the same qualifying visit.
    evidence_fields:
    - sponsor_incentives.qualifying_visit_id
    - sponsor_incentives.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_incentives.qualifying_visit_id
      action_bindings:
        sponsor_incentives.qualifying_visit_id: qualifying_visit_id
    dedup_contract:
      table: sponsor_incentives
      mode: separate_record
      object_bindings:
        qualifying_visit_id: qualifying_visit_id
      duplicate_filters:
        event_type:
        - sponsor_incentive_earned
      distinct_fields: []
  - id: payout_state
    applies_to:
    - sponsor_incentive_paid
    kind: state
    condition: An earned incentive may be paid only while the enrollment status is active or on_leave.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - active
      - on_leave
  params:
    per_tier:
      Larkspur at Work Virtual Urgent Care:
        wellness_incentive_amount: =wellness_incentive_amount
      Larkspur at Work Core:
        wellness_incentive_amount: =wellness_incentive_amount
      Larkspur at Work Core with Behavioral Health:
        wellness_incentive_amount: =wellness_incentive_amount
      Larkspur at Work Enhanced:
        wellness_incentive_amount: =wellness_incentive_amount
      Larkspur at Work Total Care:
        wellness_incentive_amount: =wellness_incentive_amount
      Larkspur at Work Total Care Plus:
        wellness_incentive_amount: =wellness_incentive_amount
  measures:
  - sponsor_msr_incentives_plan_year
