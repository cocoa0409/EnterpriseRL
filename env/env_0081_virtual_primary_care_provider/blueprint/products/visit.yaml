- id: visit_cancellation_fees
  subject:
  - visit_cancelled
  - visit_late_cancelled
  - visit_no_show
  - visit_late_cancel_fee_charged
  - visit_no_show_fee_charged
  - visit_charge_refunded
  rule: 'A patient cancellation is a late cancellation when it is made at or after scheduled_start minus the visit
    type''s late_cancel_window_hours, and an on-time cancellation when made earlier; a type with a zero window has
    no late cancellations. A video visit whose patient has not joined by scheduled_start plus no_show_grace_minutes
    becomes a no-show. A cancellation, late cancellation or no-show may be recorded only while the visit status
    is scheduled. When a visit is cancelled, late-cancelled or a no-show, every charge line of the visit (visit
    fee, after-hours surcharge and cost-share collection) is refunded in full with refund_reason patient_cancelled.
    A late cancellation then carries the visit type''s late_cancel_fee and a no-show its no_show_fee, but only on
    the payment paths in fees_apply_on_paths: on the pack_credit path the credit is forfeited under the visit pack
    rules instead, and on the sponsor_plan path no fee is charged. A late-cancellation or no-show fee may be charged
    only while the visit status is late_cancelled or no_show. A late-cancellation or no-show fee may be charged
    only when no such fee line already exists for the same visit. No fee is charged when the patient''s membership
    tier is in fee_exempt_membership_tiers and that membership''s status is trialing, active or past_due on the
    scheduled date, and none is charged as a courtesy while visit_msr_fee_occurrences_12m is below courtesy_waivers_per_rolling_12_months;
    a waived occurrence still counts in later windows. A late cancellation or no-show of a membership_included visit
    still uses up the included visit. Fees are never reduced by membership pricing, and a patient''s location outside
    the service states is never a reason to waive one.'
