  rule: A scheduled_start is in after-hours time when it falls on a Saturday or Sunday (after_hours_weekend_applies),
    or on a weekday earlier than after_hours_weekday_start or at or after after_hours_weekday_end, all in US Eastern
    Time. A visit type whose after_hours_surcharge is above zero carries the surcharge as its own line when its
    scheduled_start is in after-hours time, on the self_pay and member_rate paths only. The surcharge is never charged
    on the membership_included, sponsor_plan, insurance or pack_credit paths, never charged to a patient whose membership
    tier is in after_hours_waived_membership_tiers while that membership's status is trialing, active or past_due,
    and never reduced by membership pricing. An after-hours surcharge may be charged only while the visit status
    is scheduled. When a reschedule moves the visit out of after-hours time the surcharge line is refunded in full
    with refund_reason surcharge_removed; when it moves the visit into after-hours time the surcharge is charged
    on the reschedule date; a reschedule from one after-hours time to another changes nothing.
