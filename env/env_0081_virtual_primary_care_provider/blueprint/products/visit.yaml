- id: visit_rescheduling
  subject:
  - visit_rescheduled
  rule: A visit may be rescheduled only while its status is scheduled. A visit may be rescheduled only when its
    reschedule_count is below the visit type's reschedule_limit_per_visit. Where reschedule_outside_window_only
    is true, a reschedule is accepted only before scheduled_start minus late_cancel_window_hours; inside that window
    the patient can only cancel, which is a late cancellation. The new start must meet the booking horizon counted
    from the reschedule date, the booking lead time and the location rule, and the patient restates the state they
    will be in. A reschedule keeps the visit's payment path and visit fee; only the after-hours surcharge and the
    Good Faith Estimate follow the new time.
  eligibility:
  - id: reschedule_state
    applies_to:
    - visit_rescheduled
    kind: state
    condition: A visit may be rescheduled only while its status is scheduled.
    evidence_fields:
    - visit_appointments.status
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    state_contract:
      field: visit_appointments.status
      allowed:
      - scheduled
  params:
    per_tier:
      Asynchronous Message Consult:
        reschedule_limit_per_visit: =reschedule_limit_per_visit
      Urgent Care Video Visit:
        reschedule_limit_per_visit: =reschedule_limit_per_visit
      Primary Care Follow-Up Visit:
        reschedule_limit_per_visit: =reschedule_limit_per_visit
      Primary Care New Patient Visit:
        reschedule_limit_per_visit: =reschedule_limit_per_visit
      Annual Preventive Video Visit:
        reschedule_limit_per_visit: =reschedule_limit_per_visit
      Behavioral Health Follow-Up Session:
        reschedule_limit_per_visit: =reschedule_limit_per_visit
      Behavioral Health Initial Assessment:
        reschedule_limit_per_visit: =reschedule_limit_per_visit
- id: visit_evt_gfe
  subject:
  - visit_gfe_issued
  - visit_charge_refunded
  rule: Under the federal No Surprises Act a patient on a path in gfe_paths is treated as self-pay. A Good Faith
    Estimate is issued when such a visit is scheduled at least gfe_min_lead_business_days business days ahead, and
    whenever the patient asks for one. Business days are Monday to Friday excluding US federal holidays, counted
    from the day after the anchor date. It is due within gfe_due_business_days_short business days of booking when
    the visit is scheduled fewer than gfe_long_lead_threshold_business_days business days ahead, within gfe_due_business_days_long
    business days when scheduled at least that far ahead, and within gfe_due_business_days_long business days of
    a request. A Good Faith Estimate may be issued only when no estimate already exists for the same visit and scheduled_start.
    The estimate states the visit fee of the path plus the after-hours surcharge expected for the scheduled time,
    and a reschedule that changes the expected charges requires a new estimate for the new time. Under gfe_charge_cap_rule
    the self-pay charges posted for the visit never exceed the latest estimate issued for it, and any excess is
    refunded with refund_reason gfe_cap; late-cancellation and no-show fees are outside the estimate and the cap.
    A patient billed at least ppdr_threshold_amount above an estimate may start the federal patient-provider dispute
    resolution process within ppdr_window_days calendar days of the bill; that process is the patient's own and
    is not decided by Larkspur.
  eligibility:
  - id: one_gfe_per_time
    applies_to:
    - visit_gfe_issued
    kind: dedup
    condition: A Good Faith Estimate may be issued only when no estimate already exists for the same visit and scheduled_start.
    evidence_fields:
    - visit_estimates.visit_id
    - visit_estimates.scheduled_start
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_estimates.visit_id
      action_bindings:
        visit_estimates.visit_id: visit_id
    dedup_contract:
      table: visit_estimates
      mode: separate_record
      object_bindings:
        visit_id: visit_id
        scheduled_start: scheduled_start
      duplicate_filters:
        event_type:
        - visit_gfe_issued
      distinct_fields: []
  params:
    ppdr_threshold_amount: 400.0
    ppdr_window_days: 120
- id: visit_async_consults
  subject:
  - visit_consult_answered
  - visit_consult_converted
  - visit_charge_refunded
  rule: An Asynchronous Message Consult is answered by a clinician within async_response_hours of its scheduled_start.
    When the clinician finds that the request needs a video visit, the clinician answers the consult with that finding
    and the consult is converted by linking it to the video visit booked in its place. A consult may be converted
    only while its status is completed. Where async_fee_refund_if_converted is true, the consult's charge line is
    refunded in full with refund_reason async_converted once the replacement video visit is booked. The conversion
    refund may be issued only when the frozen time is no more than async_conversion_booking_days calendar days after
    the consult's scheduled_start date. Day counts are calendar days added to the anchor date (the anchor date plus
    N days is the date N days later), never full 24-hour periods, and the boundary date itself counts as within
    the limit. The replacement video visit is priced on its own payment path like any other visit.
  eligibility:
  - id: convert_after_answer
    applies_to:
    - visit_consult_converted
    kind: state
    condition: A consult may be converted only while its status is completed.
    evidence_fields:
    - visit_appointments.status
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    state_contract:
      field: visit_appointments.status
      allowed:
      - completed
  - id: conversion_refund_window
    applies_to:
    - visit_charge_refunded
    kind: time
    condition: The conversion refund may be issued only when the frozen time is no more than async_conversion_booking_days
      calendar days after the consult's scheduled_start date.
    evidence_fields:
    - visit_appointments.scheduled_start
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the consult's scheduled_start date
      anchor_source: visit_appointments.scheduled_start
      relation: not_after
      duration_source: variants.async_conversion_booking_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
- id: visit_attendance
  subject:
  - visit_checked_in
  - visit_completed
  - visit_consult_answered
  rule: A video visit may be checked in only while its status is scheduled. A patient may join from scheduled_start
    minus checkin_opens_minutes_before minutes until scheduled_start plus no_show_grace_minutes; the clinician completes
    the visit by signing the visit note, which sets completed_date, and only a visit with status completed counts
    as a completed visit anywhere in Larkspur's rules. A completed visit is never refunded except for a converted
    consult or an approved fee review. A completed visit is delivered by the visit type's modality and is coded
    for any claim with its primary_cpt_code, claim_modifier and place_of_service_code.
  eligibility:
  - id: checkin_from_scheduled
    applies_to:
    - visit_checked_in
    kind: state
    condition: A video visit may be checked in only while its status is scheduled.
    evidence_fields:
    - visit_appointments.status
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    state_contract:
      field: visit_appointments.status
      allowed:
      - scheduled
  params:
    checkin_opens_minutes_before: 15
- id: visit_billing_corrections
  subject:
  - visit_charge_refunded
  rule: 'Every refund points to exactly one charge line, and the refunds of one line never total more than its amount.
    A refund may be issued only when the refunds already pointing to the same line total less than that line''s
    amount. A patient who disputes a late-cancellation or no-show fee may ask for a fee review, registered as a
    pending review naming the fee line and one review_reason. A fee review may be registered only when the frozen
    time is no more than fee_review_window_days calendar days after the fee line''s charge_date. Day counts are
    calendar days added to the anchor date (the anchor date plus N days is the date N days later), never full 24-hour
    periods, and the boundary date itself counts as within the limit. The billing team decides each review: an approved
    review refunds the fee line in full with refund_reason fee_review_approved, a denied review changes nothing,
    and an agent never decides a review. A line charged at a price other than the one these rules give for its path,
    time and status is corrected by refunding the overcharged difference with refund_reason billing_error; an undercharge
    is never re-billed.'
  eligibility:
  - id: refund_not_exceeding
    applies_to:
    - visit_charge_refunded
    kind: dedup
    condition: A refund may be issued only when the refunds already pointing to the same line total less than that
      line's amount.
    evidence_fields:
    - visit_charges.original_charge_id
    - visit_charges.amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_charges.original_charge_id
      action_bindings:
        visit_charges.original_charge_id: original_charge_id
    dedup_contract:
      table: visit_charges
      mode: separate_record
      object_bindings:
        original_charge_id: original_charge_id
      duplicate_filters:
        event_type:
        - visit_charge_refunded
      distinct_fields: []
  - id: fee_review_window
    applies_to:
    - visit_charge_refunded
    kind: time
    condition: A fee review may be registered only when the frozen time is no more than fee_review_window_days calendar
      days after the fee line's charge_date.
    evidence_fields:
    - visit_charges.charge_date
    - visit_charges.visit_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_charges.visit_charge_id
      action_bindings:
        visit_charges.visit_charge_id: visit_charge_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the fee line's charge_date
      anchor_source: visit_charges.charge_date
      relation: not_after
      duration_source: params.fee_review_window_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  params:
    fee_review_window_days: 60
