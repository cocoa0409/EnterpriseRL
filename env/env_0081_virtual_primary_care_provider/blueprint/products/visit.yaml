# Product charter: visit. Larkspur Health.
category: visit
display_name: Virtual Visits
binding:
  holding_table: visit_appointments
  event_tables:
  - visit_charges
  - visit_estimates
  intake_tables:
  - visit_fee_reviews
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - scheduled
  - checked_in
  - completed
  - cancelled
  - late_cancelled
  - no_show
  - provider_cancelled
  transitions:
  - from: scheduled
    to: checked_in
    by: system
    means: The patient joins the virtual waiting room for a video visit.
  - from: checked_in
    to: completed
    by: system
    means: The clinician finishes the video visit and signs the visit note.
  - from: scheduled
    to: completed
    by: system
    means: The clinician answers an Asynchronous Message Consult and signs it.
  - from: scheduled
    to: cancelled
    by: agent
    means: The visit is cancelled at the patient's request before the late-cancellation window opens.
  - from: scheduled
    to: late_cancelled
    by: agent
    means: The visit is cancelled at the patient's request inside the late-cancellation window.
  - from: scheduled
    to: no_show
    by: system
    means: The patient has not joined by the end of the no-show grace period.
  - from: scheduled
    to: provider_cancelled
    by: system
    means: Larkspur cancels the visit before it starts (clinician unavailable
    scheduling error: null
    or the clinician cannot treat the request virtually).: null
  - from: checked_in
    to: provider_cancelled
    by: system
    means: The visit cannot be completed after check-in because of a Larkspur technical failure or clinician unavailability.
accounts:
- key: visit_billed
  unit: USD
  meaning: Net amount charged to the patient's card for one visit; fees, surcharges and cost-share collections add
    to it, refunds reduce it.
parameter_schema:
  list_price: Self-pay price of the visit type; USD.
  member_price_by_membership_tier: Price on the member_rate path by the patient's membership tier (Larkspur Access
    pays the list price); mapping tier -> USD; 0.00 means the visit is included without limit.
  included_per_membership_year_by_tier: Visits of this type included at no charge per membership year before the
    member price applies, by membership tier; mapping tier -> count.
  sponsor_covered_by_plan: Whether the Larkspur at Work plan covers this visit type; mapping plan -> boolean.
  sponsor_employee_fee_by_plan: Amount the covered patient pays per visit on the sponsor_plan path, by plan (meaningful
    only where the plan covers the type); mapping plan -> USD.
  sponsor_visits_per_plan_year_by_plan: Visits of this type the plan pays per plan year, by plan; mapping plan ->
    count or unlimited (0 where not covered).
  insurance_billable: Whether the visit type may be billed to in-network insurance (the insurance path); boolean.
  preventive_service: Whether the visit is an ACA preventive service with no in-network cost share on a non-grandfathered
    plan; boolean.
  estimated_allowed_amount: Larkspur's expected in-network allowed amount for the visit, used only for the time-of-service
    estimate on the insurance path; USD.
  primary_cpt_code: CPT code billed for the visit; for the preventive visit a mapping by new/established status
    and age band.
  claim_modifier: Telehealth modifier appended on the claim line; empty string for none.
  place_of_service_code: 'Place-of-service code on the claim: 10 (telehealth in the patient''s home).'
  modality: 'How the visit is delivered: async_message or video.'
  duration_minutes: Scheduled length of the visit; minutes (0 for asynchronous consults).
  min_patient_age_months: Minimum patient age on the scheduled date in completed months (36 = 3 years, 216 = 18
    years).
  service_states: States where Larkspur clinicians for this visit type are licensed; the patient must be located
    in one of them during the visit.
  booking_horizon_days: Furthest ahead the visit can be scheduled; calendar days after the booking date (0 = same
    day only).
  min_booking_lead_minutes: Minimum minutes between booking and scheduled_start.
  established_patient_lookback_months: Months before the scheduled date within which a qualifying completed visit
    makes the patient established (CMS three-year new/established rule).
  established_qualifying_types: Completed visit types that make a patient established for this type; empty when
    the type has no established-patient rule.
  established_requirement: requires_established (the type may be booked only by an established patient), requires_new
    (only by a patient who is not established), or none.
  preventive_frequency_months: Months that must pass after the last completed visit of this type before another
    is booked (0 = no limit).
  after_hours_surcharge: Surcharge for a visit whose scheduled_start falls in after-hours time; USD.
  after_hours_waived_membership_tiers: Membership tiers whose members never pay the after-hours surcharge.
  after_hours_weekday_start: Start of weekday business hours, US Eastern Time (HH:MM); a start earlier than this
    is after-hours.
  after_hours_weekday_end: End of weekday business hours, US Eastern Time (HH:MM); a start at or after this is after-hours.
  after_hours_weekend_applies: Whether every scheduled_start on a Saturday or Sunday is after-hours; boolean.
  late_cancel_window_hours: Hours before scheduled_start inside which a patient cancellation is a late cancellation
    (0 = no late window).
  late_cancel_fee: Fee for a late cancellation; USD.
  no_show_fee: Fee for a no-show; USD.
  no_show_grace_minutes: Minutes after scheduled_start the patient may still join before the visit becomes a no-show.
  fee_exempt_membership_tiers: Membership tiers whose members are never charged a late-cancellation or no-show fee.
  courtesy_waivers_per_rolling_12_months: Late cancellations and no-shows per rolling 12 months that are waived
    as a courtesy before fees apply; count.
  courtesy_lookback_days: Length of the rolling courtesy window; calendar days ending the day before the scheduled
    date of the occurrence.
  fees_apply_on_paths: Payment paths on which late-cancellation and no-show fees are charged.
  reschedule_limit_per_visit: Times one visit may be rescheduled; count.
  reschedule_outside_window_only: Whether a reschedule is accepted only before the late-cancellation window opens;
    boolean.
  charge_timing: 'When the visit fee and cost share are charged: at_booking.'
  max_open_bookings_of_type: Maximum visits of this type the patient may have in status scheduled at once; count.
  gfe_min_lead_business_days: A self-pay visit scheduled at least this many business days ahead requires a Good
    Faith Estimate; business days.
  gfe_due_business_days_short: Business days after booking within which the estimate is due when scheduled 3 to
    9 business days ahead.
  gfe_long_lead_threshold_business_days: Scheduling lead (business days) at and above which the longer delivery
    time applies.
  gfe_due_business_days_long: Business days after booking within which the estimate is due when scheduled at least
    10 business days ahead.
  gfe_paths: Payment paths on which the patient is treated as self-pay for Good Faith Estimate purposes.
  gfe_charge_cap_rule: 'honor_estimate: self-pay charges for the visit never exceed the latest estimate issued for
    it.'
  async_response_hours: Hours within which a clinician answers an Asynchronous Message Consult (0 for video visits).
  async_fee_refund_if_converted: Whether the consult charge is refunded when the clinician converts the consult
    to a video visit; boolean.
  async_conversion_booking_days: Calendar days after the consult's scheduled_start within which the replacement
    video visit must be booked for the refund (0 = not applicable).
  charge_rounding: 'Rounding of computed visit amounts: half_up_cent.'
