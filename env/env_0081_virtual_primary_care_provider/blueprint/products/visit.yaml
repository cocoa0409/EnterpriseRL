- id: visit_evt_insurance_cost_share
  subject:
  - visit_cost_share_collected
  rule: 'On the insurance path Larkspur collects an estimate of the patient''s cost share at booking from the benefit
    figures on the billed insurance coverage; the claim adjudication later settles the true patient responsibility
    against it. A cost share may be collected only while the visit status is scheduled. A cost share may be collected
    only while the billed insurance coverage status is verified. Nothing is collected for a visit type whose preventive_service
    is true. Otherwise, when the coverage''s telehealth_copay is above 0.00, that copay is collected with pricing_basis
    insurance_copay. Otherwise the estimate is built from the visit type''s estimated_allowed_amount: the deductible
    part is the smaller of estimated_allowed_amount and the deductible remaining (deductible_individual less deductible_met,
    never below 0.00); the coinsurance part is coinsurance_pct percent of estimated_allowed_amount less the deductible
    part; the amount collected is their sum, capped at the out-of-pocket remaining (oop_max less oop_met, never
    below 0.00), rounded half up to the cent, with pricing_basis insurance_estimate. Nothing is collected when the
    result is 0.00. The collection is made once per visit and is not recomputed when the coverage figures change
    after booking.'
