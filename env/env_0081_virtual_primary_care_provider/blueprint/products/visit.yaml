    type's member_price_by_membership_tier for the tier the patient's membership holds on the booking date. On the
    sponsor_plan path it is the plan's sponsor_employee_fee_by_plan for the visit type. On the membership_included
    path nothing is charged, and on the insurance and pack_credit paths the visit fee is replaced by the cost-share
    collection and the pack credit. No line is ever written for a 0.00 amount. A visit fee may be charged only while
    the visit status is scheduled. A visit fee may be charged only when no visit fee line already exists for the
    same visit. The fee is charged at booking (charge_timing) and is never re-priced by a reschedule or by a later
    membership tier change, and the after-hours surcharge is a separate line. Amounts are rounded half up to the
    cent (charge_rounding).
