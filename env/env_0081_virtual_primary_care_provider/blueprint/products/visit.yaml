- id: visit_provider_cancellation
  subject:
  - visit_provider_cancelled
  - visit_provider_ended
  - visit_charge_refunded
  rule: Larkspur may cancel a visit before it starts only while the visit status is scheduled. Larkspur may end
    a visit after check-in only while the visit status is checked_in. When Larkspur cancels a visit before it starts,
    or cannot complete it after check-in because of a Larkspur technical failure or clinician unavailability, every
    charge line of the visit is refunded in full with refund_reason provider_cancelled, no late-cancellation or
    no-show fee is charged, an included or sponsor-paid visit stops counting toward its limit, and a pack credit
    is reinstated under the visit pack rules. A member is also compensated with a goodwill credit under the membership
    credit rules. A patient who cannot join for reasons on the patient's side, or who is located outside the visit
    type's service_states at the visit time, is never treated as a Larkspur cancellation.
  eligibility:
  - id: provider_cancel_before_start
    applies_to:
    - visit_provider_cancelled
    kind: state
    condition: Larkspur may cancel a visit before it starts only while the visit status is scheduled.
    evidence_fields:
