events:
- type: visit_booked
  target: visit_appointments
  mutation: create
  meaning: A visit is booked, or an Asynchronous Message Consult is submitted.
  grain: one row per appointment
  fields:
    variant_name: Visit type.
    booked_date: Booking date.
    scheduled_start: Scheduled start (submission moment for a consult).
    patient_location_state: State the patient will be in during the visit.
    payment_path: Path set by the payment path rule.
    membership_id: Membership whose benefit or member price applies.
    enrollment_id: Larkspur at Work enrollment paying the visit.
    coverage_id: Insurance coverage billed.
    pack_id: Visit pack whose credit pays the visit.
    clinician_name: Clinician booked.
    reschedule_count: 0 at booking.
  triggers:
  - event: visit:visit_fee_charged
    when:
      payment_path:
      - self_pay
      - member_rate
    map: {}
  - event: pack:pack_credit_redeemed
    when:
      payment_path: pack_credit
    map:
      visit_id: visit_id
- type: visit_checked_in
  target: visit_appointments
  mutation:
    transition:
      from: scheduled
      to: checked_in
  meaning: The patient joins the virtual waiting room and confirms where they are.
  grain: one row per transaction
  fields:
    patient_location_state: State the patient confirms being in at check-in.
  triggers: []
- type: visit_completed
  target: visit_appointments
  mutation:
    transition:
      from: checked_in
      to: completed
  meaning: The clinician completes and signs the video visit.
  grain: one row per transaction
  fields:
    completed_date: Date signed.
  triggers: []
- type: visit_consult_answered
  target: visit_appointments
  mutation:
    transition:
      from: scheduled
      to: completed
  meaning: The clinician answers and signs an Asynchronous Message Consult.
  grain: one row per transaction
  fields:
    completed_date: Date answered.
  triggers: []
- type: visit_cancelled
  target: visit_appointments
  mutation:
    transition:
      from: scheduled
      to: cancelled
  meaning: The patient cancels before the late-cancellation window opens.
  grain: one row per transaction
  fields:
    payment_path: Path of the visit.
    cancelled_at: Moment of cancellation.
  triggers:
  - event: pack:pack_credit_reinstated
    when:
      payment_path: pack_credit
    map:
      visit_id: visit_id
- type: visit_late_cancelled
  target: visit_appointments
  mutation:
    transition:
      from: scheduled
      to: late_cancelled
  meaning: The patient cancels inside the late-cancellation window.
  grain: one row per transaction
  fields:
    payment_path: Path of the visit.
    cancelled_at: Moment of cancellation.
  triggers:
  - event: pack:pack_credit_forfeited
    when:
      payment_path: pack_credit
    map:
      visit_id: visit_id
- type: visit_no_show
  target: visit_appointments
  mutation:
    transition:
      from: scheduled
      to: no_show
  meaning: The patient does not join within the no-show grace period.
  grain: one row per transaction
  fields:
    payment_path: Path of the visit.
    cancelled_at: End of the grace period.
  triggers:
  - event: pack:pack_credit_forfeited
    when:
      payment_path: pack_credit
    map:
      visit_id: visit_id
- type: visit_provider_cancelled
  target: visit_appointments
  mutation:
    transition:
      from: scheduled
      to: provider_cancelled
  meaning: Larkspur cancels the visit before it starts.
  grain: one row per transaction
  fields:
    payment_path: Path of the visit.
    cancelled_at: Moment of cancellation.
  triggers:
  - event: pack:pack_credit_reinstated
    when:
      payment_path: pack_credit
    map:
      visit_id: visit_id
- type: visit_provider_ended
  target: visit_appointments
  mutation:
    transition:
      from: checked_in
      to: provider_cancelled
  meaning: The visit cannot be completed after check-in because of a Larkspur failure.
  grain: one row per transaction
  fields:
    payment_path: Path of the visit.
    cancelled_at: Moment the visit was ended.
  triggers:
  - event: pack:pack_credit_reinstated
    when:
      payment_path: pack_credit
    map:
      visit_id: visit_id
- type: visit_rescheduled
  target: visit_appointments
  mutation: update
  meaning: A scheduled visit is moved to a new start time.
  grain: one row per transaction
  fields:
    scheduled_start: New start.
    patient_location_state: Location for the new time.
    reschedule_count: Incremented by one.
  triggers: []
- type: visit_payment_path_changed
  target: visit_appointments
  mutation: update
  meaning: The payment path of a scheduled visit changes before the visit (coverage newly verified or ended, membership
    or sponsor status changed, or the patient switches between insurance and self-pay).
  grain: one row per transaction
  fields:
    payment_path: New path.
    membership_id: Membership now applied.
    enrollment_id: Enrollment now applied.
    coverage_id: Coverage now billed.
  triggers: []
- type: visit_consult_converted
  target: visit_appointments
  mutation: update
  meaning: The clinician converts an Asynchronous Message Consult into a video visit.
  grain: one row per transaction
  fields:
    converted_to_visit_id: The video visit booked in its place.
  triggers: []
- type: visit_fee_charged
  target: visit_charges
  meaning: The visit fee is charged on the self_pay, member_rate or sponsor_plan path.
  grain: one row per visit
  distinguish_by:
  - pricing_basis
  fields:
    amount: Fee charged.
    charge_date: Booking date.
    pricing_basis: list_price, member_rate or sponsor_employee_fee.
  account: visit_billed
  direction: in
  triggers: []
- type: visit_after_hours_surcharge_charged
  target: visit_charges
  meaning: The after-hours surcharge is charged for a visit scheduled in after-hours time.
  grain: one row per visit per scheduled time that carries a surcharge
  distinguish_by:
  - charge_date
  fields:
    amount: Surcharge.
    charge_date: Date the booking or reschedule placed the visit in after-hours time.
    pricing_basis: after_hours_surcharge.
  account: visit_billed
  direction: in
  triggers: []
- type: visit_cost_share_collected
  target: visit_charges
  meaning: The estimated patient cost share of an insurance-billed visit is collected.
  grain: one row per visit
  distinguish_by:
  - pricing_basis
  fields:
    amount: Copay or estimate collected.
    charge_date: Booking date, or the date the path changed to insurance.
    pricing_basis: insurance_copay or insurance_estimate.
  account: visit_billed
  direction: in
  triggers: []
- type: visit_late_cancel_fee_charged
  target: visit_charges
  meaning: The late-cancellation fee is charged.
  grain: one row per visit
  distinguish_by:
  - pricing_basis
  fields:
    amount: Fee.
    charge_date: Cancellation date.
    pricing_basis: late_cancel_fee.
  account: visit_billed
  direction: in
  triggers: []
- type: visit_no_show_fee_charged
  target: visit_charges
  meaning: The no-show fee is charged.
  grain: one row per visit
  distinguish_by:
  - pricing_basis
  fields:
    amount: Fee.
    charge_date: No-show date.
    pricing_basis: no_show_fee.
  account: visit_billed
  direction: in
  triggers: []
- type: visit_charge_refunded
  target: visit_charges
  meaning: All or part of one visit billing line is refunded to the card.
  grain: one row per refunded line
  distinguish_by:
  - original_charge_id
  fields:
    amount: Negative amount refunded.
    charge_date: Refund date.
    pricing_basis: refund.
    original_charge_id: Line refunded.
    refund_reason: Basis of the refund.
  account: visit_billed
  direction: out
  triggers: []
- type: visit_gfe_issued
  target: visit_estimates
  meaning: A Good Faith Estimate of expected self-pay charges is delivered for a visit.
  grain: one row per visit per scheduled start
  distinguish_by:
  - scheduled_start
  fields:
    estimate_amount: Total expected charges.
    issued_date: Delivery date.
    scheduled_start: Scheduled start the estimate covers.
  triggers: []
measures:
- id: visit_msr_included_used_year
  window: the patient's current membership year (membership_holdings.membership_year_start up to the scheduled date)
  measure: count of the patient's visit_appointments of the same variant_name with payment_path membership_included,
    status in (scheduled, checked_in, completed, late_cancelled, no_show), and scheduled_start date on or after
    membership_year_start
- id: visit_msr_sponsor_used_plan_year
  window: the enrollment's current plan year (sponsor_enrollments.plan_year_start up to the scheduled date)
  measure: count of the patient's visit_appointments of the same variant_name with payment_path sponsor_plan, status
    in (scheduled, checked_in, completed), and scheduled_start date on or after plan_year_start
- id: visit_msr_fee_occurrences_12m
  window: courtesy_lookback_days calendar days ending the day before the scheduled date of the occurrence being
    priced
  measure: count of the patient's visit_appointments with status late_cancelled or no_show whose scheduled_start
    date falls in the window
- id: visit_msr_open_bookings_of_type
  window: current state at frozen_time
  measure: count of the patient's visit_appointments of the same variant_name with status scheduled
- id: visit_msr_last_completed_of_types
  window: established_patient_lookback_months calendar months ending on the scheduled date
  measure: latest completed_date among the patient's visit_appointments with status completed whose variant_name
    is in established_qualifying_types (empty when none)
policies:
- id: visit_agg_multi_holding
  subject:
  - visit_booked
  rule: A patient holds a separate visit appointment for every visit, so there is no lifetime limit on visits (max_per_customer
    is unlimited). A visit may be booked only when visit_msr_open_bookings_of_type is below the visit type's max_open_bookings_of_type.
    Visits already completed, cancelled, late-cancelled, missed or cancelled by Larkspur never count toward that
    limit.
  eligibility: []
  params:
    max_per_customer: null
  measures:
  - visit_msr_open_bookings_of_type
- id: visit_agg_open_schedule
  subject:
  - visit_booked
  - visit_rescheduled
  rule: 'Visits are combined per patient on one calendar: two video visits of the same patient may not overlap,
    where a video visit occupies its scheduled_start plus the visit type''s duration_minutes, and a new or rescheduled
    video visit that would overlap another visit in status scheduled or checked_in is refused. Asynchronous Message
    Consults occupy no time and never overlap. Benefit counters that span several visits (included membership visits,
    sponsor plan visits per plan year and the courtesy waiver count) are always counted across all of the patient''s
    visits of the stated type, never per clinician or per booking channel.'
  eligibility: []
  measures:
  - visit_msr_included_used_year
  - visit_msr_sponsor_used_plan_year
- id: visit_booking_eligibility
  subject:
  - visit_booked
  - visit_rescheduled
  rule: State licensure follows the patient's physical location during the visit, not the home address. A visit
    may be booked or rescheduled only when the state the patient says they will be in during the visit is one of
    the visit type's service_states. A visit may be booked only when the patient's age on the scheduled date is
    at least min_patient_age_months completed calendar months after the patient's date of birth. Month counts are
    calendar months added to the anchor date; when that day does not exist in the target month the last day of that
    month is used, and the boundary date itself counts as reached. A visit may be scheduled no later than booking_horizon_days
    calendar days after the booking date and no earlier than min_booking_lead_minutes after the moment of booking.
    A patient is established for a visit type when the patient has a visit with status completed of one of that
    type's established_qualifying_types whose completed_date is no more than established_patient_lookback_months
    calendar months before the scheduled date (visit_msr_last_completed_of_types); a type whose established_requirement
    is requires_established may be booked only by an established patient, and a type whose requirement is requires_new
    only by a patient who is not established, who books the matching follow-up type instead. An Annual Preventive
    Video Visit may be booked only when no visit of that type was completed in the preventive_frequency_months calendar
    months before the scheduled date. Location, age and established status are never reasons to change a fee.
  eligibility:
  - id: location_in_service_state
    applies_to:
    - visit_booked
    - visit_rescheduled
    kind: caller_fact
    condition: A visit may be booked or rescheduled only when the state the patient says they will be in during
      the visit is one of the visit type's service_states.
    evidence_fields:
    - visit_appointments.patient_location_state
    - visit_appointments.visit_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
  - id: visit_min_age
    applies_to:
    - visit_booked
    kind: time
    condition: A visit may be booked only when the patient's age on the scheduled date is at least min_patient_age_months
      completed calendar months after the patient's date of birth.
    evidence_fields:
    - customers.date_of_birth
    - customers.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the patient's date of birth
      anchor_source: customers.date_of_birth
      relation: not_before
      duration_source: variants.min_patient_age_months
      unit: calendar_months
      counting_rule: Month counts are calendar months added to the anchor date; when that day does not exist in
        the target month the last day of that month is used, and the boundary date itself counts as reached.
      boundary: inclusive
  params:
    per_tier:
      Asynchronous Message Consult:
        service_states: =service_states
        min_patient_age_months: =min_patient_age_months
        established_requirement: =established_requirement
      Urgent Care Video Visit:
        service_states: =service_states
        min_patient_age_months: =min_patient_age_months
        established_requirement: =established_requirement
      Primary Care Follow-Up Visit:
        service_states: =service_states
        min_patient_age_months: =min_patient_age_months
        established_requirement: =established_requirement
      Primary Care New Patient Visit:
        service_states: =service_states
        min_patient_age_months: =min_patient_age_months
        established_requirement: =established_requirement
      Annual Preventive Video Visit:
        service_states: =service_states
        min_patient_age_months: =min_patient_age_months
        established_requirement: =established_requirement
      Behavioral Health Follow-Up Session:
        service_states: =service_states
        min_patient_age_months: =min_patient_age_months
        established_requirement: =established_requirement
      Behavioral Health Initial Assessment:
        service_states: =service_states
        min_patient_age_months: =min_patient_age_months
        established_requirement: =established_requirement
  measures:
  - visit_msr_last_completed_of_types
- id: visit_evt_payment_path
  subject:
  - visit_booked
  - visit_payment_path_changed
  rule: 'Every visit is paid on exactly one payment path, fixed at booking by the first of these steps that applies,
    and the visit is priced only on that path. First, sponsor_plan: the patient holds a Larkspur at Work enrollment
    whose coverage_start_date is on or before the scheduled date and whose coverage_end_date, when set, is on or
    after it, the plan''s sponsor_covered_by_plan is true for the visit type, and visit_msr_sponsor_used_plan_year
    is below the plan''s sponsor_visits_per_plan_year_by_plan (unlimited never runs out). The sponsor_plan path
    may be used only while the patient''s Larkspur at Work enrollment status is active or on_leave. Second, membership_included:
    the patient holds a membership, and either the tier''s member_price_by_membership_tier for the visit type is
    0.00 or visit_msr_included_used_year is below the tier''s included_per_membership_year_by_tier. A membership
    benefit or member price may be used only while the patient''s membership status is trialing, active or past_due.
    Third, the patient chooses among the paths open to them: pack_credit, when the patient holds a visit pack whose
    expiry_date is on or after the scheduled date, whose credits_remaining is above zero and whose tier covers the
    visit type; insurance, when the visit type''s insurance_billable is true and the patient holds an insurance
    coverage whose tier files claims; and otherwise the price path, which is member_rate for a patient holding a
    membership and self_pay for a patient who does not. The insurance path may be used only while the billed insurance
    coverage status is verified. The pack_credit path may be used only while the visit pack status is active. Among
    the paths of the third step, the path used is the one the patient chooses. Membership pricing never applies
    on the sponsor_plan, insurance or pack_credit paths, and one visit never combines a Larkspur at Work plan, a
    membership benefit, pack credit or insurance. The path is determined again, and recorded as a path change, only
    before the visit starts and only when the patient switches between the choices of the third step, when a coverage
    becomes verified or ends, or when a membership, enrollment or pack status change removes or opens a path; the
    charges of the old path are then refunded in full with refund_reason path_changed and those of the new path
    are charged on the change date.'
  eligibility:
  - id: sponsor_path_state
    applies_to:
    - visit_booked
    - visit_payment_path_changed
    kind: state
    condition: The sponsor_plan path may be used only while the patient's Larkspur at Work enrollment status is
      active or on_leave.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - active
      - on_leave
  - id: membership_path_state
    applies_to:
    - visit_booked
    - visit_payment_path_changed
    kind: state
    condition: A membership benefit or member price may be used only while the patient's membership status is trialing,
      active or past_due.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
  - id: insurance_path_state
