    state_contract:
      field: visit_appointments.status
      allowed:
      - late_cancelled
      - no_show
  - id: one_miss_fee
    applies_to:
    - visit_late_cancel_fee_charged
    - visit_no_show_fee_charged
    kind: dedup
    condition: A late-cancellation or no-show fee may be charged only when no such fee line already exists for the
