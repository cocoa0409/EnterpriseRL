  baseline:
    rule: >-
      The credit move this rule prices is the move from the crediting claim, which is the claim of the patient's most recent claim_adjudicated remittance, onto the receiving claim, which is the claim whose first statement was issued most recently.
      A crediting claim with no counted entries offers no credit.
      A receiving claim with no counted charge carries only its other entries.
      Under the standard order the claim whose third statement was issued most recently takes the lesser of the credit and the amount due on its latest statement before the receiving claim.
      The amount moved is the lesser of the credit left after the part taken ahead and the receiving balance, never below 0.00, rounded half up to the cent; the move is written as a positive transfer entry on the crediting claim and a matching negative received entry on the receiving claim.
