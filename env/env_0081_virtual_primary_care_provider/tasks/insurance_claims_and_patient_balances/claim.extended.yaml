events:
- type: claim_coverage_added
  target: insurance_coverages
  mutation: create
  meaning: The patient adds an insurance coverage from their card.
  grain: one row per coverage
  fields:
    variant_name: Plan type.
    payer_name: Payer.
    member_number: Member ID from the card.
    group_number: Group number from the card.
    subscriber_relationship: Relationship to the subscriber.
    subscriber_date_of_birth: Subscriber's date of birth.
    coverage_order: primary or secondary under the coordination rule.
    effective_date: Coverage start reported by the patient.
  triggers: []
- type: claim_coverage_verified
  target: insurance_coverages
  mutation:
    transition:
      from: pending_verification
      to: verified
  meaning: The payer confirms active coverage and returns its benefits.
  grain: one row per transaction
  fields:
    last_verified_date: Date verified.
    effective_date: Effective date per the payer.
    plan_grandfathered: Grandfathered status per the payer.
    pcp_designated: PCP of record status per the payer.
    telehealth_copay: Telehealth copay per the payer.
    deductible_individual: Deductible per the payer.
    deductible_met: Deductible met per the payer.
    coinsurance_pct: Coinsurance per the payer.
    oop_max: Out-of-pocket maximum per the payer.
    oop_met: Out-of-pocket met per the payer.
  triggers: []
- type: claim_verification_failed
  target: insurance_coverages
  mutation:
    transition:
      from: pending_verification
      to: verification_failed
  meaning: The payer finds no active coverage for the details given.
  grain: one row per transaction
  fields:
    last_verified_date: Unchanged.
  triggers: []
- type: claim_coverage_resubmitted
  target: insurance_coverages
  mutation:
    transition:
      from: verification_failed
      to: pending_verification
  meaning: Corrected card details are submitted for verification again.
  grain: one row per transaction
  fields:
    member_number: Corrected member ID.
    group_number: Corrected group number.
  triggers: []
- type: claim_coverage_details_changed
  target: insurance_coverages
  mutation:
    transition:
      from: verified
      to: pending_verification
  meaning: The patient changes card details on a verified coverage.
  grain: one row per transaction
  fields:
    member_number: New member ID.
    group_number: New group number.
  triggers: []
- type: claim_coverage_terminated
  target: insurance_coverages
  mutation:
    transition:
      from: verified
      to: terminated
  meaning: The coverage ends.
  grain: one row per transaction
  fields:
    termination_date: Last day in force.
  triggers: []
- type: claim_unverified_coverage_terminated
  target: insurance_coverages
  mutation:
    transition:
      from: pending_verification
      to: terminated
  meaning: The coverage turns out to have ended before verification.
  grain: one row per transaction
  fields:
    termination_date: Last day in force.
  triggers: []
- type: claim_benefits_refreshed
  target: insurance_coverages
  mutation: update
  meaning: Benefit figures are refreshed from a reverification or a remittance.
  grain: one row per transaction
  fields:
    last_verified_date: Date of a reverification (unchanged on a remittance refresh).
    telehealth_copay: Current copay.
    deductible_met: Current deductible met.
    oop_met: Current out-of-pocket met.
    pcp_designated: Current PCP of record status.
  triggers: []
- type: claim_coverage_order_changed
  target: insurance_coverages
  mutation: update
  meaning: The primary or secondary order of a coverage is corrected under the coordination rule.
  grain: one row per transaction
  fields:
    coverage_order: New order.
  triggers: []
- type: claim_submitted
  target: insurance_claims
  meaning: Larkspur files an original claim for an insurance-billed visit.
  grain: one row per coverage per visit
  distinguish_by:
  - visit_id
  fields:
    visit_id: Visit billed.
    service_date: Date of service.
    cpt_code: Code billed.
    billed_amount: Charge billed.
    submission_date: Date received by the payer.
  triggers: []
- type: claim_corrected_submitted
  target: insurance_claims
  meaning: A corrected claim replaces an earlier submission.
  grain: one row per replaced submission
  distinguish_by:
  - original_claim_id
  fields:
    visit_id: Visit billed.
    service_date: Date of service.
    cpt_code: Code billed.
    billed_amount: Charge billed.
    submission_date: Date received by the payer.
    original_claim_id: Submission replaced.
  triggers: []
- type: claim_adjudicated
  target: claim_remittances
  meaning: The payer processes a claim and assigns allowed, paid and patient amounts.
  grain: one row per submission
  distinguish_by:
  - claim_id
  fields:
    claim_id: Submission adjudicated.
    adjudication_date: Remittance date.
    allowed_amount: Allowed amount.
    payer_paid: Paid by the payer.
    deductible_applied: Deductible part.
    copay_applied: Copay part.
    coinsurance_applied: Coinsurance part.
    patient_responsibility: Patient total.
  triggers:
  - event: claim:claim_benefits_refreshed
    map: {}
- type: claim_denied
  target: claim_remittances
  meaning: The payer denies a claim with a denial code.
  grain: one row per submission
  distinguish_by:
  - claim_id
  fields:
    claim_id: Submission denied.
    adjudication_date: Remittance date.
    denial_code: Reason.
  triggers: []
- type: claim_patient_balance_posted
  target: patient_balance_entries
  meaning: The patient responsibility of an adjudicated claim is posted.
  grain: one row per remittance
  distinguish_by:
  - claim_id
  fields:
    claim_id: Claim.
    visit_id: Visit.
    amount: patient_responsibility (positive).
    entry_date: Posting date.
  account: patient_balance
  direction: in
  triggers: []
- type: claim_self_pay_rebill_posted
  target: patient_balance_entries
  meaning: A denied visit is re-billed to the patient on the price path.
  grain: one row per denied claim
  distinguish_by:
  - claim_id
  fields:
    claim_id: Denied claim.
    visit_id: Visit.
    amount: Price-path amount (positive).
    entry_date: Posting date.
  account: patient_balance
  direction: in
  triggers: []
- type: claim_time_of_service_applied
  target: patient_balance_entries
  meaning: The cost share collected at booking is applied to the claim balance.
  grain: one row per claim
  distinguish_by:
  - claim_id
  fields:
    claim_id: Claim.
    visit_id: Visit.
    amount: Negative amount collected at booking.
    entry_date: Posting date.
  account: patient_balance
  direction: out
  triggers: []
- type: claim_patient_payment_posted
  target: patient_balance_entries
  meaning: A patient payment toward a claim balance is posted.
  grain: one row per payment per claim
  distinguish_by:
  - claim_id
  - entry_date
  fields:
    claim_id: Claim.
    visit_id: Visit.
    amount: Negative payment.
    entry_date: Payment date.
  account: patient_balance
  direction: out
  triggers: []
- type: claim_prompt_pay_discount_applied
  target: patient_balance_entries
  meaning: The prompt-pay discount is applied to a self-pay rebill paid in full on time.
  grain: one row per claim
  distinguish_by:
  - claim_id
  fields:
    claim_id: Claim.
    visit_id: Visit.
    amount: Negative discount.
    entry_date: Payment date.
  account: patient_balance
  direction: out
  triggers: []
- type: claim_small_balance_written_off
  target: patient_balance_entries
  meaning: A claim balance at or below the small-balance threshold is written off.
  grain: one row per claim
  distinguish_by:
  - claim_id
  fields:
    claim_id: Claim.
    visit_id: Visit.
    amount: Negative balance written off.
    entry_date: Write-off date.
  account: patient_balance
  direction: out
  triggers: []
- type: claim_hardship_adjustment_posted
  target: patient_balance_entries
  meaning: An approved hardship review reduces a claim balance.
  grain: one row per claim
  distinguish_by:
  - claim_id
  fields:
    claim_id: Claim.
    visit_id: Visit.
    amount: Negative adjustment.
    entry_date: Approval date.
  account: patient_balance
  direction: out
  triggers: []
- type: claim_credit_transferred
  target: patient_balance_entries
  meaning: Credit on one claim is moved off it toward another open claim balance.
  grain: one row per transfer
  distinguish_by:
  - claim_id
  - entry_date
  fields:
    claim_id: Claim holding the credit.
    visit_id: Visit of that claim.
    amount: Positive credit moved away.
    entry_date: Transfer date.
  account: patient_balance
  direction: in
  triggers: []
- type: claim_credit_received
  target: patient_balance_entries
  meaning: Credit moved from another claim reduces this claim's open balance.
  grain: one row per transfer
  distinguish_by:
  - source_entry_id
  fields:
    claim_id: Claim receiving the credit.
    visit_id: Visit of that claim.
    amount: Negative credit received.
    entry_date: Transfer date.
    source_entry_id: The transfer entry.
  account: patient_balance
  direction: out
  triggers: []
- type: claim_credit_refunded
  target: patient_balance_entries
  meaning: Remaining credit on a claim is refunded to the patient's card.
  grain: one row per claim
  distinguish_by:
  - claim_id
  fields:
    claim_id: Claim.
    visit_id: Visit.
    amount: Positive amount refunded.
    entry_date: Refund date.
  account: patient_balance
  direction: in
  triggers: []
- type: claim_statement_issued
  target: patient_statements
  meaning: A statement for an open claim balance is issued.
  grain: one row per claim balance per statement cycle
  distinguish_by:
  - statement_number
  fields:
    claim_id: Claim billed.
    statement_number: Sequence.
    statement_date: Date issued.
    amount_due: Balance due.
    due_date: statement_date plus statement_due_days.
  triggers: []
measures:
- id: claim_msr_claim_balance
  window: life of the claim
  measure: sum of amount over patient_balance_entries of the claim (including entries of the corrected claims that
    replaced it)
- id: claim_msr_open_balances
  window: current state at frozen_time
  measure: the patient's claims whose claim_msr_claim_balance is above 0.00, ordered by service_date
- id: claim_msr_statements_issued
  window: life of the claim balance
  measure: count of claim_statement_issued rows of the claim and the date of the first one
- id: claim_msr_time_of_service_collected
  window: life of the visit
  measure: sum of amount over the visit's visit_cost_share_collected lines less its refund lines (visit charges)
policies:
- id: claim_agg_multi_holding
  subject:
  - claim_coverage_added
  rule: A patient may keep at most two open coverages, one primary and one secondary. A coverage may be added only
    when the patient holds no other coverage with the same coverage_order whose status is pending_verification,
    verified or verification_failed. A terminated coverage never counts; a patient whose plan changed adds the new
    coverage once the old one is terminated, or reports the old one ended in the same contact.
  eligibility:
  - id: one_open_coverage_per_order
    applies_to:
    - claim_coverage_added
    kind: dedup
    condition: A coverage may be added only when the patient holds no other coverage with the same coverage_order
      whose status is pending_verification, verified or verification_failed.
    evidence_fields:
    - insurance_coverages.customer_id
    - insurance_coverages.coverage_order
    - insurance_coverages.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - insurance_coverages.customer_id
      action_bindings:
        insurance_coverages.customer_id: customer_id
    dedup_contract:
      table: insurance_coverages
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        coverage_order: coverage_order
      duplicate_filters:
        status:
        - pending_verification
        - verified
        - verification_failed
      distinct_fields: []
  params:
    max_per_customer: 2
- id: claim_agg_coordination_of_benefits
  subject:
  - claim_coverage_order_changed
  - claim_submitted
  - claim_patient_balance_posted
  rule: 'When a patient holds two coverages, cob_order_rule decides which pays first: the patient''s own coverage
    (subscriber_relationship self) is primary over a coverage held as a spouse or child; for a child covered by
    two parents, the coverage whose subscriber_date_of_birth has the earlier month and day in the calendar year
    is primary, and when both are the same, the coverage with the earlier effective_date. An order recorded against
    that rule is corrected. The primary is billed first. A secondary claim may be submitted only after the primary
    coverage''s remittance for the same visit exists. The secondary is billed within secondary_submit_days_after_primary
    calendar days of the primary remittance where secondary_billing is true. When a secondary is billed, only the
    secondary remittance''s patient_responsibility is posted to the patient, never more than the primary''s; when
    it is not billed, the primary''s is posted. Time-of-service collections are applied once, to the claim whose
    responsibility is posted.'
  eligibility:
  - id: primary_remit_first
    applies_to:
    - claim_submitted
    kind: authorization
    condition: A secondary claim may be submitted only after the primary coverage's remittance for the same visit
      exists.
    evidence_fields:
    - claim_remittances.claim_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_remittances.claim_id
      action_bindings:
        claim_remittances.claim_id: claim_id
- id: claim_coverage_verification
  subject:
  - claim_coverage_added
  - claim_coverage_verified
  - claim_verification_failed
  - claim_coverage_resubmitted
  - claim_coverage_details_changed
  - claim_benefits_refreshed
  rule: 'A coverage is added from the patient''s card with its payer_name, member_number and group_number. Card
    details are recorded exactly as the patient reads them from the insurance card. A plan issued by one of Larkspur''s
    in-network payers is classified by its plan type; a plan from any other payer is Out-of-Network Coverage. Every
    new or changed coverage is checked with the payer before it is billed: it becomes verified, with the payer''s
    benefit figures, or verification_failed. Corrected card details may be resubmitted only while the coverage status
    is verification_failed. A visit may be billed to a coverage only when its last_verified_date is no more than
    reverification_interval_days calendar days before the visit''s service date; an older verification is refreshed
    first, and every remittance refreshes deductible_met and oop_met where accumulator_refresh_on_remit is true.
    Day counts are calendar days added to the anchor date (the anchor date plus N days is the date N days later),
    never full 24-hour periods, and the boundary date itself counts as within the limit.'
  eligibility:
  - id: card_verbatim
    applies_to:
    - claim_coverage_added
    - claim_coverage_resubmitted
    - claim_coverage_details_changed
    kind: caller_fact
    condition: Card details are recorded exactly as the patient reads them from the insurance card.
    evidence_fields:
    - insurance_coverages.member_number
    - insurance_coverages.group_number
    - insurance_coverages.coverage_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - insurance_coverages.coverage_id
      action_bindings:
        insurance_coverages.coverage_id: coverage_id
  - id: resubmit_from_failed
    applies_to:
    - claim_coverage_resubmitted
    kind: state
    condition: Corrected card details may be resubmitted only while the coverage status is verification_failed.
    evidence_fields:
    - insurance_coverages.status
    - insurance_coverages.coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - insurance_coverages.coverage_id
      action_bindings:
        insurance_coverages.coverage_id: coverage_id
    state_contract:
      field: insurance_coverages.status
      allowed:
      - verification_failed
  params:
    per_tier:
      Commercial HMO Coverage:
        reverification_interval_days: =reverification_interval_days
      Commercial EPO Coverage:
        reverification_interval_days: =reverification_interval_days
      Commercial POS Coverage:
        reverification_interval_days: =reverification_interval_days
      Commercial PPO Coverage:
        reverification_interval_days: =reverification_interval_days
      High-Deductible Health Plan Coverage:
        reverification_interval_days: =reverification_interval_days
      Out-of-Network Coverage:
        reverification_interval_days: =reverification_interval_days
- id: claim_coverage_termination
  subject:
  - claim_coverage_terminated
  - claim_unverified_coverage_terminated
  rule: A coverage may be terminated only while its status is pending_verification or verified. The termination_date
    is the last day the payer reports the coverage in force, or the last day the patient states when the patient
    reports it first. Visits scheduled after the termination_date move off the insurance path under the visit payment
    path rule; visits already completed on or before it stay billed to it; a visit completed after it and billed
    anyway is handled as an eligibility_terminated denial.
  eligibility:
  - id: terminate_open
    applies_to:
    - claim_coverage_terminated
    - claim_unverified_coverage_terminated
    kind: state
    condition: A coverage may be terminated only while its status is pending_verification or verified.
    evidence_fields:
    - insurance_coverages.status
    - insurance_coverages.coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - insurance_coverages.coverage_id
      action_bindings:
        insurance_coverages.coverage_id: coverage_id
    state_contract:
      field: insurance_coverages.status
      allowed:
      - pending_verification
      - verified
- id: claim_evt_submission
  subject:
  - claim_submitted
  - claim_corrected_submitted
  rule: Larkspur files claims only for plan types whose claims_filed_by_larkspur is true and only for visits on
    the insurance path. A claim may be submitted only for a visit appointment whose status is completed. An original
    claim may be submitted only when no original claim already exists for the same coverage and visit. The claim
    carries the visit type's primary_cpt_code (for the Annual Preventive Video Visit, the code for the patient's
    new or established status and age band on the service date), its claim_modifier and place_of_service_code, and
    the visit type's list_price as billed_amount; the service date is the date of the visit's scheduled_start. Claims
    are submitted within claim_submission_target_business_days business days of the service date. Business days
    are Monday to Friday excluding US federal holidays, counted from the day after the anchor date. A claim may
    be filed only when the frozen time is no more than the payer's timely_filing_days_by_payer calendar days after
    the visit's service date. Day counts are calendar days added to the anchor date (the anchor date plus N days
    is the date N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
    A corrected claim replaces a submission whose remittance was wrong or denied for a correctable reason; it may
    be filed only within corrected_claim_days_by_payer calendar days of that remittance's adjudication_date and
    carries the replaced claim in original_claim_id. Corrected claims are filed only where corrected_claim_allowed
    is true and at most max_corrected_claims_per_visit per visit.
  eligibility:
  - id: visit_completed_for_claim
    applies_to:
    - claim_submitted
    kind: state
    condition: A claim may be submitted only for a visit appointment whose status is completed.
    evidence_fields:
    - visit_appointments.status
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    state_contract:
      field: visit_appointments.status
      allowed:
      - completed
  - id: one_original_claim
    applies_to:
    - claim_submitted
    kind: dedup
    condition: An original claim may be submitted only when no original claim already exists for the same coverage
      and visit.
    evidence_fields:
    - insurance_claims.coverage_id
    - insurance_claims.visit_id
    - insurance_claims.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - insurance_claims.visit_id
      action_bindings:
        insurance_claims.visit_id: visit_id
    dedup_contract:
      table: insurance_claims
      mode: separate_record
      object_bindings:
        coverage_id: coverage_id
        visit_id: visit_id
      duplicate_filters:
        event_type:
        - claim_submitted
      distinct_fields: []
  - id: timely_filing
    applies_to:
    - claim_submitted
    - claim_corrected_submitted
    kind: time
    condition: A claim may be filed only when the frozen time is no more than the payer's timely_filing_days_by_payer
      calendar days after the visit's service date.
    evidence_fields:
    - insurance_claims.service_date
    - insurance_claims.claim_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - insurance_claims.claim_id
      action_bindings:
        insurance_claims.claim_id: claim_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the visit's service date
      anchor_source: insurance_claims.service_date
      relation: not_after
      duration_source: params.timely_filing_days_by_payer
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  params:
    timely_filing_days_by_payer:
      Northwind Health Plan: 90
      Cascadia Mutual Health: 180
      Keystone Benefit Health: 120
      Bayline Health Partners: 365
      Summit Crest Health: 90
      Prairie Lantern Health: 180
    corrected_claim_days_by_payer:
      Northwind Health Plan: 90
      Cascadia Mutual Health: 180
      Keystone Benefit Health: 120
      Bayline Health Partners: 180
      Summit Crest Health: 90
      Prairie Lantern Health: 120
- id: claim_evt_remittance_posting
  subject:
  - claim_adjudicated
  - claim_patient_balance_posted
  - claim_time_of_service_applied
  - claim_benefits_refreshed
  rule: 'Each remittance is posted as the payer sent it. On an adjudicated claim the patient owes exactly the remittance''s
    patient_responsibility, never the difference between billed_amount and allowed_amount (balance_billing_prohibited).
    Patient responsibility may be posted only when no balance posting already exists for the same claim. The amount
    collected at booking for the visit (claim_msr_time_of_service_collected) is then applied against it as one entry,
    so the claim balance is patient_responsibility less that amount; a negative result is a credit owed to the patient.
    The remittance refreshes the coverage''s deductible_met and oop_met. Amounts are rounded half up to the cent.
    Where preventive_zero_cost_share is true, the coverage''s plan_grandfathered is false and the remittance assigns
    patient responsibility to an Annual Preventive Video Visit, the remittance is treated as wrongly adjudicated:
    nothing is posted to the patient and a corrected claim is filed. On a plan type whose time_of_service_basis
    is price_path nothing is claimed or posted. Every computed amount is rounded under billing_rounding.'
  eligibility:
  - id: one_posting_per_claim
    applies_to:
    - claim_patient_balance_posted
    kind: dedup
    condition: Patient responsibility may be posted only when no balance posting already exists for the same claim.
    evidence_fields:
    - patient_balance_entries.claim_id
    - patient_balance_entries.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - patient_balance_entries.claim_id
      action_bindings:
        patient_balance_entries.claim_id: claim_id
    dedup_contract:
      table: patient_balance_entries
      mode: separate_record
      object_bindings:
        claim_id: claim_id
      duplicate_filters:
        event_type:
        - claim_patient_balance_posted
      distinct_fields: []
  formula:
    amount: patient_responsibility
  measures:
  - claim_msr_time_of_service_collected
  - claim_msr_claim_balance
- id: claim_denial_handling
  subject:
  - claim_denied
  - claim_self_pay_rebill_posted
  - claim_corrected_submitted
  rule: 'A denial is handled by its denial_code alone. timely_filing: Larkspur writes the visit off (timely_filing_denial_handling),
    the patient owes nothing for it, and everything collected at booking is applied to the claim and so becomes
    a credit. eligibility_terminated and not_covered_service: the visit is re-billed on the price path (eligibility_denial_handling,
    not_covered_denial_handling): the patient owes the visit fee the visit rules give on the member_rate path when
    the patient held a membership whose status was trialing, active or past_due on the service date and on the self_pay
    path otherwise, plus the after-hours surcharge those rules would have charged, and the booking collection is
    applied against it. A self-pay rebill may be posted only when no rebill already exists for the same claim. pcp_not_designated:
    when the coverage''s pcp_designated has become true, a corrected claim is filed; otherwise the visit is re-billed
    on the price path once the cure period has passed. A pcp_not_designated denial may be cured by a corrected claim
    only when the frozen time is no more than pcp_cure_days calendar days after the denial''s adjudication_date.
    Day counts are calendar days added to the anchor date (the anchor date plus N days is the date N days later),
    never full 24-hour periods, and the boundary date itself counts as within the limit. missing_information: a
    corrected claim is filed and nothing is billed to the patient. duplicate_claim: nothing is done. A denial never
    changes the visit fee rules themselves. The pcp_not_designated outcome follows pcp_denial_handling and applies
    only to visit types in pcp_required_visit_types; missing_information follows missing_information_handling and
    duplicate_claim follows duplicate_denial_handling.'
  eligibility:
  - id: one_rebill_per_claim
    applies_to:
    - claim_self_pay_rebill_posted
    kind: dedup
    condition: A self-pay rebill may be posted only when no rebill already exists for the same claim.
    evidence_fields:
    - patient_balance_entries.claim_id
    - patient_balance_entries.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - patient_balance_entries.claim_id
      action_bindings:
        patient_balance_entries.claim_id: claim_id
    dedup_contract:
      table: patient_balance_entries
      mode: separate_record
      object_bindings:
        claim_id: claim_id
      duplicate_filters:
        event_type:
        - claim_self_pay_rebill_posted
      distinct_fields: []
  - id: pcp_cure_window
    applies_to:
    - claim_corrected_submitted
    kind: time
    condition: A pcp_not_designated denial may be cured by a corrected claim only when the frozen time is no more
      than pcp_cure_days calendar days after the denial's adjudication_date.
    evidence_fields:
    - claim_remittances.adjudication_date
    - claim_remittances.claim_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_remittances.claim_id
      action_bindings:
        claim_remittances.claim_id: claim_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the denial's adjudication_date
      anchor_source: claim_remittances.adjudication_date
      relation: not_after
      duration_source: variants.pcp_cure_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  params:
    per_tier:
      Commercial HMO Coverage:
        pcp_cure_days: =pcp_cure_days
        pcp_designation_required: =pcp_designation_required
      Commercial EPO Coverage:
        pcp_cure_days: =pcp_cure_days
        pcp_designation_required: =pcp_designation_required
      Commercial POS Coverage:
        pcp_cure_days: =pcp_cure_days
        pcp_designation_required: =pcp_designation_required
      Commercial PPO Coverage:
        pcp_cure_days: =pcp_cure_days
        pcp_designation_required: =pcp_designation_required
      High-Deductible Health Plan Coverage:
        pcp_cure_days: =pcp_cure_days
        pcp_designation_required: =pcp_designation_required
      Out-of-Network Coverage:
        pcp_cure_days: =pcp_cure_days
        pcp_designation_required: =pcp_designation_required
- id: claim_statements_and_collections
  subject:
  - claim_statement_issued
  - claim_small_balance_written_off
  rule: A claim whose balance (claim_msr_claim_balance) is above zero gets its first statement statement_first_days_after_remit
    calendar days after the remittance or rebill, and another every statement_cycle_days calendar days while unpaid,
    up to statements_before_collections statements; each is due statement_due_days calendar days after its statement_date.
    A statement may be issued only when no statement with the same statement_number already exists for the claim.
    When a statement would be issued for a balance at or below small_balance_writeoff_threshold, the balance is
    written off instead and no statement is issued. A balance of at least collections_min_balance may be referred
    to the collections partner only after statements_before_collections statements and at least collections_min_days_after_first_statement
    calendar days after the first statement, and never while it is on an approved payment plan in good standing
    (payment_plan_pauses_collections). Day counts are calendar days added to the anchor date (the anchor date plus
    N days is the date N days later), never full 24-hour periods, and the boundary date itself counts as within
    the limit.
  eligibility:
  - id: one_statement_per_number
    applies_to:
    - claim_statement_issued
    kind: dedup
    condition: A statement may be issued only when no statement with the same statement_number already exists for
      the claim.
    evidence_fields:
    - patient_statements.claim_id
    - patient_statements.statement_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - patient_statements.claim_id
      action_bindings:
        patient_statements.claim_id: claim_id
    dedup_contract:
      table: patient_statements
      mode: separate_record
      object_bindings:
        claim_id: claim_id
        statement_number: statement_number
      duplicate_filters:
        event_type:
        - claim_statement_issued
      distinct_fields: []
  measures:
  - claim_msr_claim_balance
  - claim_msr_statements_issued
- id: claim_payments_and_discounts
  subject:
  - claim_patient_payment_posted
  - claim_prompt_pay_discount_applied
  rule: A patient payment is posted to the claim the patient names, and otherwise to the open claim with the oldest
    service date. A self-pay rebill balance (prompt_pay_applies_to) paid in full by the prompt-pay deadline earns
    prompt_pay_discount_pct percent off the balance, posted with the payment so that the payment due is the balance
    less the discount; patient responsibility on an adjudicated claim is never discounted. The prompt-pay discount
    may be applied only when the frozen time is no more than prompt_pay_days calendar days after the claim's first
    statement_date. Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
    N days later), never full 24-hour periods, and the boundary date itself counts as within the limit. A patient
    may ask for a payment plan, registered as a request of type payment_plan; it is approved when the patient's
    total open balance is at least payment_plan_min_balance and the plan has at most payment_plan_max_months monthly
    installments of at least payment_plan_min_monthly, the installment being the total open balance divided by the
    months and rounded up to the cent, at payment_plan_interest_pct interest; otherwise it is denied. Amounts are
    rounded half up to the cent unless stated otherwise. A payment plan with payment_plan_missed_installments_limit
    missed installments ends, and its remaining balance returns to the statement cycle.
  eligibility:
  - id: prompt_pay_window
    applies_to:
    - claim_prompt_pay_discount_applied
    kind: time
    condition: The prompt-pay discount may be applied only when the frozen time is no more than prompt_pay_days
      calendar days after the claim's first statement_date.
    evidence_fields:
    - patient_statements.statement_date
    - patient_statements.statement_number
    - patient_statements.claim_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - patient_statements.claim_id
      action_bindings:
        patient_statements.claim_id: claim_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the claim's first statement_date
      anchor_source: patient_statements.statement_date
      relation: not_after
      duration_source: variants.prompt_pay_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  params:
    per_tier:
      Commercial HMO Coverage:
        prompt_pay_discount_pct: =prompt_pay_discount_pct
        payment_plan_min_balance: =payment_plan_min_balance
      Commercial EPO Coverage:
        prompt_pay_discount_pct: =prompt_pay_discount_pct
        payment_plan_min_balance: =payment_plan_min_balance
      Commercial POS Coverage:
        prompt_pay_discount_pct: =prompt_pay_discount_pct
        payment_plan_min_balance: =payment_plan_min_balance
      Commercial PPO Coverage:
        prompt_pay_discount_pct: =prompt_pay_discount_pct
        payment_plan_min_balance: =payment_plan_min_balance
      High-Deductible Health Plan Coverage:
        prompt_pay_discount_pct: =prompt_pay_discount_pct
        payment_plan_min_balance: =payment_plan_min_balance
      Out-of-Network Coverage:
        prompt_pay_discount_pct: =prompt_pay_discount_pct
        payment_plan_min_balance: =payment_plan_min_balance
  formula:
    amount: -round(claim_msr_claim_balance * prompt_pay_discount_pct / 100, 2)
  measures:
  - claim_msr_claim_balance
- id: claim_credits_and_refunds
  subject:
  - claim_credit_transferred
  - claim_credit_received
  - claim_credit_refunded
  rule: A claim whose balance is below zero holds a credit owed to the patient. A credit may be moved or refunded
    only when the claim balance is below zero. Where credit_apply_to_open_balances_first is true, the credit first
    pays the patient's other open claim balances (claim_msr_open_balances), oldest service date first, each move
    written as a transfer entry on the crediting claim and a received entry on the paid claim, never more than that
    claim's balance. Credit still left is refunded to the card within credit_refund_days calendar days when it is
    at least credit_refund_minimum, and otherwise stays on file. Credit is never paid out as cash while another
    claim of the patient has an open balance.
  eligibility:
  - id: credit_balance_negative
    applies_to:
    - claim_credit_transferred
    - claim_credit_refunded
    kind: authorization
    condition: A credit may be moved or refunded only when the claim balance is below zero.
    evidence_fields:
    - patient_balance_entries.claim_id
    - patient_balance_entries.amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - patient_balance_entries.claim_id
      action_bindings:
        patient_balance_entries.claim_id: claim_id
  measures:
  - claim_msr_open_balances
  - claim_msr_claim_balance
- id: claim_hardship
  subject:
  - claim_hardship_adjustment_posted
  rule: 'A patient who cannot pay may ask for a hardship review, registered as a pending request of type hardship_review;
    the billing team decides it from documented household income, never the agent. An approved review adjusts the
    balances listed in hardship_applies_to: in full when the income is at or below hardship_full_fpl_pct percent
    of the federal poverty guideline, and by hardship_partial_discount_pct percent of the open balance when it is
    above that and at or below hardship_partial_fpl_pct percent. A hardship adjustment may be posted only for a
    hardship review whose request_status is approved. A balance under review is not referred to collections.'
  eligibility:
  - id: hardship_approved
    applies_to:
    - claim_hardship_adjustment_posted
    kind: state
    condition: A hardship adjustment may be posted only for a hardship review whose request_status is approved.
    evidence_fields:
    - claim_billing_requests.request_status
    - claim_billing_requests.billing_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - claim_billing_requests.billing_request_id
      action_bindings:
        claim_billing_requests.billing_request_id: billing_request_id
    state_contract:
      field: claim_billing_requests.request_status
      allowed:
      - approved
- id: claim_superbills_and_appeals
  subject:
  - claim_coverage_added
  - claim_denied
  rule: On a plan type whose claims_filed_by_larkspur is false, the visit is paid on the price path at booking and
    Larkspur gives the patient a superbill within superbill_delivery_business_days business days so the patient
    can claim out-of-network benefits directly; Larkspur never files that claim or refunds the price on the payer's
    decision. A superbill is provided only for a visit billed under a coverage whose plan type does not file claims.
    Business days are Monday to Friday excluding US federal holidays, counted from the day after the anchor date.
    After a denial the member may file their own internal appeal with the payer within member_internal_appeal_days
    calendar days of the denial notice; that appeal is the patient's own, and Larkspur's part is to send the requested
    visit records within member_appeal_records_business_days business days of a request of type member_appeal_records.
    Superbills are given only where superbill_provided is true.
  eligibility:
  - id: superbill_plan_type
    applies_to:
    - claim_coverage_added
    kind: authorization
    condition: A superbill is provided only for a visit billed under a coverage whose plan type does not file claims.
    evidence_fields:
    - insurance_coverages.variant_name
    - insurance_coverages.coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - insurance_coverages.coverage_id
      action_bindings:
        insurance_coverages.coverage_id: coverage_id

extended_policies:
- id: claim_ext_small_balance_writeoff
  base_policy_refs: [claim_statements_and_collections, claim_evt_remittance_posting, claim_credits_and_refunds, claim_payments_and_discounts]
  overwrite:
    - base_policy: claim_statements_and_collections
      superseded_clause: >-
        When a statement would be issued for a balance at or below small_balance_writeoff_threshold, the balance is written off instead and no statement is issued.
      replaced_by: >-
        For a claim that has fewer than three statements, a balance at or below small_balance_writeoff_threshold is written off instead of a statement when the next statement falls due, and no statement is issued.
  trigger: state_due
  subject: [claim_small_balance_written_off]
  computes: writeoff_amount
  target_tool: post_small_balance_writeoff_bfef4ea9
  params: {}
  rule: >-
    The small-balance write-off is decided for the patient's claim whose third statement was issued most recently; when no claim has a third statement, nothing is written off under this rule.
    The written-off balance counts the claim's charge as follows: when a patient responsibility posting stands on the claim, it counts that posting; when instead a self-pay rebill stands on it, it counts the rebill; otherwise it counts no charge.
    With no entry counted the written-off balance is 0.00.
    The booking collection that the written-off balance counts is chosen as follows: when a time-of-service entry stands on the claim itself, the written-off balance counts that entry; when none stands on the claim but one stands on the submission the claim replaced, it counts that entry; otherwise it counts no booking collection.
    The credit that the written-off balance counts is chosen as follows: when the claim carries both credit received from another claim and credit moved away from it or refunded, it counts both; when it carries only credit received, it counts the credit received; when it carries only credit moved away or refunded, it counts that credit; otherwise it counts no credit.
    The patient money that the written-off balance counts is chosen as follows: when the claim carries both patient payments and prompt-pay discounts, it counts both; when it carries only patient payments, it counts the payments; when it carries only prompt-pay discounts, it counts the discounts; otherwise it counts none.
    The written-off balance is the counted charge plus the counted booking collection, credit and patient money, each with the sign its entry carries.
    Whether the written-off balance is written off is decided as follows: when the claim's third statement has been issued and the frozen date is after that statement's due_date, the balance is written off when it is above 0.00 and below collections_min_balance; when the third statement has been issued and its due_date has not passed, nothing is written off; otherwise the claim is handled under the next two sentences.
    For a claim that has fewer than three statements, a balance at or below small_balance_writeoff_threshold is written off instead of a statement when the next statement falls due, and no statement is issued.
    The next statement falls due when the frozen date is at least statement_cycle_days calendar days after the claim's latest statement_date.
    The write-off entry carries the written-off balance as a negative amount, rounded half up to the cent; when nothing is written off no entry is booked.
  prerequisite: []
  cross_category: []
  compute:
    - sb_claim: "LATEST('patient_statements', 'claim_id', date_field='statement_date', statement_number=3)"
    - sb_count: "COUNT('patient_statements', claim_id=sb_claim)"
    - sb_last_date: "LATEST('patient_statements', 'statement_date', date_field='statement_date', claim_id=sb_claim)"
    - sb_third_due: "LATEST('patient_statements', 'due_date', date_field='statement_date', claim_id=sb_claim, statement_number=3)"
    - sb_pr: "SUM('patient_balance_entries', 'amount', claim_id=sb_claim, event_type='claim_patient_balance_posted')"
    - sb_rb: "SUM('patient_balance_entries', 'amount', claim_id=sb_claim, event_type='claim_self_pay_rebill_posted')"
    - sb_resp: "sb_pr if sb_pr != 0 else (sb_rb if sb_rb != 0 else 0.0)"
    - sb_tos_own: "SUM('patient_balance_entries', 'amount', claim_id=sb_claim, event_type='claim_time_of_service_applied')"
    - sb_replaced: "LATEST('insurance_claims', 'original_claim_id', date_field='submission_date', claim_id=sb_claim)"
    - sb_tos_replaced: "SUM('patient_balance_entries', 'amount', claim_id=sb_replaced, event_type='claim_time_of_service_applied')"
    - sb_collect: "sb_tos_own if sb_tos_own != 0 else (sb_tos_replaced if (sb_tos_replaced != 0 and sb_replaced) else 0.0)"
    - sb_rcv: "SUM('patient_balance_entries', 'amount', claim_id=sb_claim, event_type='claim_credit_received')"
    - sb_out: "SUM('patient_balance_entries', 'amount', claim_id=sb_claim, event_type='claim_credit_transferred') + SUM('patient_balance_entries', 'amount', claim_id=sb_claim, event_type='claim_credit_refunded')"
    - sb_credit: "sb_rcv + sb_out if (sb_rcv != 0 and sb_out != 0) else (sb_rcv if (sb_rcv != 0 and sb_out == 0) else (sb_out if (sb_out != 0 and sb_rcv == 0) else 0.0))"
    - sb_paid_raw: "SUM('patient_balance_entries', 'amount', claim_id=sb_claim, event_type='claim_patient_payment_posted')"
    - sb_disc_raw: "SUM('patient_balance_entries', 'amount', claim_id=sb_claim, event_type='claim_prompt_pay_discount_applied')"
    - sb_patient: "sb_paid_raw + sb_disc_raw if (sb_paid_raw != 0 and sb_disc_raw != 0) else (sb_paid_raw if (sb_paid_raw != 0 and sb_disc_raw == 0) else (sb_disc_raw if (sb_disc_raw != 0 and sb_paid_raw == 0) else 0.0))"
    - sb_balance: "sb_resp + sb_collect + sb_credit + sb_patient"
    - sb_limit: "(P('collections_min_balance') - 0.01) if (sb_count >= 3 and DAYS(sb_third_due, NOW) > 0) else (0.0 if (sb_count >= 3 and DAYS(sb_third_due, NOW) <= 0) else (P('small_balance_writeoff_threshold') if (sb_count >= 1 and DAYS(sb_last_date, NOW) >= P('statement_cycle_days')) else 0.0))"
    - result: "RND(sb_balance + 0.000000001, 2) if (sb_balance > 0 and sb_balance <= sb_limit) else 0.0"
  compute_basis:
    sb_claim: "The small-balance write-off is decided for the patient's claim whose third statement was issued most recently; when no claim has a third statement, nothing is written off under this rule."
    sb_count: "Whether the written-off balance is written off is decided as follows: when the claim's third statement has been issued and the frozen date is after that statement's due_date, the balance is written off when it is above 0.00 and below collections_min_balance; when the third statement has been issued and its due_date has not passed, nothing is written off; otherwise the claim is handled under the next two sentences."
    sb_last_date: "The next statement falls due when the frozen date is at least statement_cycle_days calendar days after the claim's latest statement_date."
    sb_third_due: "Whether the written-off balance is written off is decided as follows: when the claim's third statement has been issued and the frozen date is after that statement's due_date, the balance is written off when it is above 0.00 and below collections_min_balance; when the third statement has been issued and its due_date has not passed, nothing is written off; otherwise the claim is handled under the next two sentences."
    sb_pr: "The written-off balance counts the claim's charge as follows: when a patient responsibility posting stands on the claim, it counts that posting; when instead a self-pay rebill stands on it, it counts the rebill; otherwise it counts no charge."
    sb_rb: "The written-off balance counts the claim's charge as follows: when a patient responsibility posting stands on the claim, it counts that posting; when instead a self-pay rebill stands on it, it counts the rebill; otherwise it counts no charge."
    sb_resp: "The written-off balance counts the claim's charge as follows: when a patient responsibility posting stands on the claim, it counts that posting; when instead a self-pay rebill stands on it, it counts the rebill; otherwise it counts no charge."
    sb_tos_own: "The booking collection that the written-off balance counts is chosen as follows: when a time-of-service entry stands on the claim itself, the written-off balance counts that entry; when none stands on the claim but one stands on the submission the claim replaced, it counts that entry; otherwise it counts no booking collection."
    sb_replaced: "The booking collection that the written-off balance counts is chosen as follows: when a time-of-service entry stands on the claim itself, the written-off balance counts that entry; when none stands on the claim but one stands on the submission the claim replaced, it counts that entry; otherwise it counts no booking collection."
    sb_tos_replaced: "The booking collection that the written-off balance counts is chosen as follows: when a time-of-service entry stands on the claim itself, the written-off balance counts that entry; when none stands on the claim but one stands on the submission the claim replaced, it counts that entry; otherwise it counts no booking collection."
    sb_collect: "The booking collection that the written-off balance counts is chosen as follows: when a time-of-service entry stands on the claim itself, the written-off balance counts that entry; when none stands on the claim but one stands on the submission the claim replaced, it counts that entry; otherwise it counts no booking collection."
    sb_rcv: "The credit that the written-off balance counts is chosen as follows: when the claim carries both credit received from another claim and credit moved away from it or refunded, it counts both; when it carries only credit received, it counts the credit received; when it carries only credit moved away or refunded, it counts that credit; otherwise it counts no credit."
    sb_out: "The credit that the written-off balance counts is chosen as follows: when the claim carries both credit received from another claim and credit moved away from it or refunded, it counts both; when it carries only credit received, it counts the credit received; when it carries only credit moved away or refunded, it counts that credit; otherwise it counts no credit."
    sb_credit: "The credit that the written-off balance counts is chosen as follows: when the claim carries both credit received from another claim and credit moved away from it or refunded, it counts both; when it carries only credit received, it counts the credit received; when it carries only credit moved away or refunded, it counts that credit; otherwise it counts no credit."
    sb_paid_raw: "The patient money that the written-off balance counts is chosen as follows: when the claim carries both patient payments and prompt-pay discounts, it counts both; when it carries only patient payments, it counts the payments; when it carries only prompt-pay discounts, it counts the discounts; otherwise it counts none."
    sb_disc_raw: "The patient money that the written-off balance counts is chosen as follows: when the claim carries both patient payments and prompt-pay discounts, it counts both; when it carries only patient payments, it counts the payments; when it carries only prompt-pay discounts, it counts the discounts; otherwise it counts none."
    sb_patient: "The patient money that the written-off balance counts is chosen as follows: when the claim carries both patient payments and prompt-pay discounts, it counts both; when it carries only patient payments, it counts the payments; when it carries only prompt-pay discounts, it counts the discounts; otherwise it counts none."
    sb_balance: "The written-off balance is the counted charge plus the counted booking collection, credit and patient money, each with the sign its entry carries."
    sb_limit: "Whether the written-off balance is written off is decided as follows: when the claim's third statement has been issued and the frozen date is after that statement's due_date, the balance is written off when it is above 0.00 and below collections_min_balance; when the third statement has been issued and its due_date has not passed, nothing is written off; otherwise the claim is handled under the next two sentences."
    result: "The write-off entry carries the written-off balance as a negative amount, rounded half up to the cent; when nothing is written off no entry is booked."
  factors:
    - id: sbw_closing_rule
      effect: method
      decides: sb_limit
      bindings: [sb_count, sb_last_date, sb_third_due, sb_limit]
      ladder:
        - when: "the claim's third statement has been issued and the frozen date is after that statement's due_date"
          method: "the balance is written off when it is above 0.00 and below collections_min_balance"
        - when: "the claim's third statement has been issued and its due_date has not passed"
          method: "nothing is written off"
        - when: "otherwise"
          method: "a balance at or below small_balance_writeoff_threshold is written off when the next statement falls due"
      baseline:
        sb_limit: "P('small_balance_writeoff_threshold') if (sb_count >= 1 and sb_count < 3 and DAYS(sb_last_date, NOW) >= P('statement_cycle_days')) else 0.0"
      evidence: [history, date]
      cross_difficulty: null
    - id: sbw_booking_collection_count
      effect: parameter
      decides: sb_collect
      bindings: [sb_tos_own, sb_replaced, sb_tos_replaced, sb_collect]
      ladder:
        - when: "a time-of-service entry stands on the claim itself"
          value: "that entry's amount"
        - when: "no time-of-service entry stands on the claim and one stands on the submission the claim replaced"
          value: "that replaced submission's entry amount"
        - when: "otherwise"
          value: "0.00"
      baseline:
        sb_collect: "0.0"
      evidence: [history]
      cross_difficulty: null
    - id: sbw_credit_count
      effect: parameter
      decides: sb_credit
      bindings: [sb_rcv, sb_out, sb_credit]
      ladder:
        - when: "the claim carries both credit received from another claim and credit moved away or refunded"
          value: "both credit amounts"
        - when: "the claim carries only credit received"
          value: "the credit received"
        - when: "the claim carries only credit moved away or refunded"
          value: "the credit moved away or refunded"
        - when: "otherwise"
          value: "0.00"
      baseline:
        sb_credit: "0.0"
      evidence: [history]
      cross_difficulty: null
    - id: sbw_patient_money_count
      effect: parameter
      decides: sb_patient
      bindings: [sb_paid_raw, sb_disc_raw, sb_patient]
      ladder:
        - when: "the claim carries both patient payments and prompt-pay discounts"
          value: "both amounts"
        - when: "the claim carries only patient payments"
          value: "the payments"
        - when: "the claim carries only prompt-pay discounts"
          value: "the discounts"
        - when: "otherwise"
          value: "0.00"
      baseline:
        sb_patient: "0.0"
      evidence: [history]
      cross_difficulty: null
    - id: sbw_charge_count
      effect: parameter
      decides: sb_resp
      bindings: [sb_pr, sb_rb, sb_resp]
      ladder:
        - when: "a patient responsibility posting stands on the claim"
          value: "that posting"
        - when: "no patient responsibility posting stands on it and a self-pay rebill does"
          value: "the rebill"
        - when: "otherwise"
          value: "0.00"
      baseline:
        sb_resp: "0.0"
      evidence: [history]
      cross_difficulty: null
  baseline:
    rule: >-
      The small-balance write-off is decided for the patient's claim whose third statement was issued most recently; when no claim has a third statement, nothing is written off under this rule.
      With no entry counted the written-off balance is 0.00.
      For a claim that has fewer than three statements, a balance at or below small_balance_writeoff_threshold is written off instead of a statement when the next statement falls due, and no statement is issued.
      The next statement falls due when the frozen date is at least statement_cycle_days calendar days after the claim's latest statement_date.
      The write-off entry carries the written-off balance as a negative amount, rounded half up to the cent; when nothing is written off no entry is booked.
    params: [small_balance_writeoff_threshold, statement_cycle_days]
  inputs:
    history:
      - {table: patient_statements, aggregate: latest, field: claim_id, filters: {statement_number: 3}}
      - {table: patient_balance_entries, aggregate: sum, field: amount, filters: {}}
    cross_category: []
- id: claim_ext_open_balance_credit_transfer
  base_policy_refs: [claim_credits_and_refunds, claim_evt_remittance_posting, claim_statements_and_collections]
  overwrite: []
  trigger: state_due
  subject: [claim_credit_transferred, claim_credit_received]
  computes: transfer_amount
  target_tool: transfer_claim_credit_12a8a2c0
  params: {}
  rule: >-
    The credit move this rule prices is the move from the crediting claim, which is the claim of the patient's most recent claim_adjudicated remittance, onto the receiving claim, which is the claim whose first statement was issued most recently.
    The credit the move draws on counts the crediting claim's charge as follows: when a patient responsibility posting stands on the crediting claim, the credit counts that posting; when instead a self-pay rebill stands on it, the credit counts the rebill; otherwise the credit counts no charge.
    The credit the move draws on counts the crediting claim's booking collection as follows: when a time-of-service entry stands on the crediting claim itself, the credit counts that entry; when none stands on it but one stands on the submission it replaced, the credit counts that entry; otherwise the credit counts no booking collection.
    The credit the move draws on is the counted booking collection and the counted charge added together with their signs and then turned positive; when that figure is not above 0.00 there is no credit.
    A crediting claim with no counted entries offers no credit.
    The receiving balance counts the receiving claim's charge as follows: when a self-pay rebill stands on the receiving claim, it counts the rebill; when instead a patient responsibility posting stands on it, it counts that posting; otherwise it counts no charge.
    The receiving balance is the counted charge plus every other entry posted on the receiving claim.
    A receiving claim with no counted charge carries only its other entries.
    The part of the credit taken ahead of the receiving claim is decided as follows: when the claim whose third statement was issued most recently carries a ledger balance above 0.00 and its visit's scheduled_start is earlier than the receiving claim's visit's scheduled_start, that older claim takes the lesser of the credit and its ledger balance first; when that older claim carries no ledger balance above 0.00 and its visit's scheduled_start is earlier, nothing is taken ahead because nothing is owed on it; otherwise the older claim takes the lesser of the credit and the amount due on its latest statement.
    Under the standard order the claim whose third statement was issued most recently takes the lesser of the credit and the amount due on its latest statement before the receiving claim.
    The amount moved is fixed only after every claim whose third statement's due date has passed with a balance below the smallest balance that may go to collections carries its small-balance write-off entry.
    The amount moved is the lesser of the credit left after the part taken ahead and the receiving balance, never below 0.00, rounded half up to the cent; the move is written as a positive transfer entry on the crediting claim and a matching negative received entry on the receiving claim.
  prerequisite:
    - problem: claim_ext_small_balance_writeoff
      kind: value_input
      gate: xf_old_bal
      form: state
      policy_source: >-
        The amount moved is fixed only after every claim whose third statement's due date has passed with a balance below the smallest balance that may go to collections carries its small-balance write-off entry.
      condition: >-
        The claim whose third statement was issued most recently carries a claim_small_balance_written_off entry, so its ledger balance is 0.00.
      resolved_by: post_small_balance_writeoff_bfef4ea9
      effect: >-
        The older claim's ledger balance drops to 0.00, so nothing of the credit is taken ahead and the whole credit is available to the receiving claim.
  cross_category:
    - category: visit
      as: branch
      reads: [visit_appointments.scheduled_start]
      note: The visits' scheduled_start orders the older claim against the receiving claim.
  compute:
    - xf_src: "LATEST('claim_remittances', 'claim_id', date_field='adjudication_date', event_type='claim_adjudicated')"
    - xf_src_pr: "SUM('patient_balance_entries', 'amount', claim_id=xf_src, event_type='claim_patient_balance_posted')"
