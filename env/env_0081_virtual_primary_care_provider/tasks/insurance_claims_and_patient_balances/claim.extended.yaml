    cs_charge: "The cost-share balance counts the claim's charge as follows: when a patient responsibility posting stands on the claim, it counts that posting; when instead a self-pay rebill stands on it, it counts the rebill; otherwise it counts no charge."
    cs_tos_a: "The cost-share balance takes booking collection by this selection rule: when time-of-service entries stand both on the claim and on the submission it replaced, it takes both; when they stand only on the claim, it takes those; when they stand only on the replaced submission, it takes those; otherwise it takes none."
    cs_tos_b: "The cost-share balance takes booking collection by this selection rule: when time-of-service entries stand both on the claim and on the submission it replaced, it takes both; when they stand only on the claim, it takes those; when they stand only on the replaced submission, it takes those; otherwise it takes none."
