    - pr_tos: "SUM('patient_balance_entries', 'amount', claim_id=pr_claim, event_type='claim_time_of_service_applied')"
    - pr_prior: "LATEST('insurance_claims', 'original_claim_id', date_field='submission_date', claim_id=pr_claim)"
    - pr_prior_tos: "SUM('patient_balance_entries', 'amount', claim_id=pr_prior, event_type='claim_time_of_service_applied')"
    - pr_collect: "pr_tos if pr_tos != 0 else (pr_prior_tos if (pr_prior_tos != 0 and pr_prior) else 0.0)"
    - pr_rcv: "SUM('patient_balance_entries', 'amount', claim_id=pr_claim, event_type='claim_credit_received')"
    - pr_out: "SUM('patient_balance_entries', 'amount', claim_id=pr_claim, event_type='claim_credit_transferred') + SUM('patient_balance_entries', 'amount', claim_id=pr_claim, event_type='claim_credit_refunded')"
    - pr_credit: "pr_rcv + pr_out if (pr_rcv != 0 and pr_out != 0) else (pr_rcv if (pr_rcv != 0 and pr_out == 0) else (pr_out if (pr_out != 0 and pr_rcv == 0) else 0.0))"
    - pr_pay: "SUM('patient_balance_entries', 'amount', claim_id=pr_claim, event_type='claim_patient_payment_posted')"
    - pr_disc: "SUM('patient_balance_entries', 'amount', claim_id=pr_claim, event_type='claim_prompt_pay_discount_applied')"
    - pr_patient: "pr_pay + pr_disc if (pr_pay != 0 and pr_disc != 0) else (pr_pay if (pr_pay != 0 and pr_disc == 0) else (pr_disc if (pr_disc != 0 and pr_pay == 0) else 0.0))"
    - pr_balance: "pr_charge + pr_collect + pr_credit + pr_patient"
    - pr_rb_n: "COUNT('patient_balance_entries', claim_id=pr_claim, event_type='claim_self_pay_rebill_posted')"
    - pr_resp_n: "COUNT('patient_balance_entries', claim_id=pr_claim, event_type='claim_patient_balance_posted')"
    - pr_rate: "P('prompt_pay_discount_pct') if (pr_rb_n > 0 and pr_resp_n == 0) else (0.0 if (pr_resp_n > 0 and pr_rb_n >= 0) else 0.0)"
    - pr_first_n: "COUNT('patient_statements', claim_id=pr_claim, statement_number=1)"
    - pr_first_date: "LATEST('patient_statements', 'statement_date', date_field='statement_date', claim_id=pr_claim, statement_number=1)"
    - pr_applied: "1 if (pr_first_n > 0 and DAYS(pr_first_date, NOW) <= P('prompt_pay_days')) else (0 if (pr_first_n > 0 and DAYS(pr_first_date, NOW) > P('prompt_pay_days')) else 0)"
    - pr_discount: "RND(MX(pr_balance, 0.0) * pr_rate * pr_applied / 100 + 0.000000001, 2)"
    - result: "RND(pr_balance - pr_discount + 0.000000001, 2) if pr_balance > 0 else 0.0"
