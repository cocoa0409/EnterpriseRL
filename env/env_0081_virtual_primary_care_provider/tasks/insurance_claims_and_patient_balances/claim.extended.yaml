    - ts_collection: "ts_copay + ts_estimate + ts_cp_err + ts_cp_path + ts_es_err"
    - ts_own_tos: "SUM('patient_balance_entries', 'amount', claim_id=ts_claim, event_type='claim_time_of_service_applied')"
    - ts_prior: "LATEST('insurance_claims', 'original_claim_id', date_field='submission_date', claim_id=ts_claim)"
