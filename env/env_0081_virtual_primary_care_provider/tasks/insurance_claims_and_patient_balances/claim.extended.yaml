    - ts_applied: "-ts_own_tos if ts_own_tos != 0 else (-ts_prior_tos if (ts_prior_tos != 0 and ts_prior) else 0.0)"
    - result: "RND(MX(ts_collection - ts_applied, 0.0) + 0.000000001, 2)"
