- id: claim_ext_booking_collection_application
  base_policy_refs: [claim_evt_remittance_posting, claim_agg_coordination_of_benefits, claim_denial_handling]
  overwrite: []
  trigger: state_due
  subject: [claim_time_of_service_applied]
  computes: collection_amount
  target_tool: apply_booking_collection_b81aee5f
  params: {}
  rule: >-
    The booking collection this rule applies belongs to the claim whose first statement was issued most recently and to that claim's visit.
    With no booking line counted, the booking collection applied is 0.00.
    The booking collection counts copay lines as follows: when cost-share lines with pricing_basis insurance_copay stand on the visit, it counts their total; when none stands on the visit but some stand on the consult the visit replaced, it counts that total; otherwise it counts none.
    The booking collection counts estimate lines as follows: when cost-share lines with pricing_basis insurance_estimate stand on the visit, it counts their total; when none stands on the visit but some stand on the consult the visit replaced, it counts that total; otherwise it counts none.
    The booking collection counts billing-error refunds of copay lines as follows: when refund lines with refund_reason billing_error point at the visit's copay line, it counts their total; when none does but such refunds point at the replaced consult's copay line, it counts that total; otherwise it counts none.
    The booking collection counts path-change refunds of copay lines as follows: when refund lines with refund_reason path_changed point at the visit's copay line, it counts their total; when none does but such refunds point at the replaced consult's copay line, it counts that total; otherwise it counts none.
    The booking collection counts billing-error refunds of estimate lines as follows: when refund lines with refund_reason billing_error point at the visit's estimate line, it counts their total; when none does but such refunds point at the replaced consult's estimate line, it counts that total; otherwise it counts none.
    The booking collection is the counted lines and counted refunds added together with their signs.
    What is already applied is decided by this selection rule: when time-of-service entries stand on the claim itself, the booking collection already applied is their total turned positive; when none stands on the claim but some stand on the submission the claim replaced, it is that total turned positive; otherwise nothing is already applied.
    The amount applied is the booking collection less what is already applied, never below 0.00, rounded half up to the cent, and is booked as one negative time-of-service entry on the claim; time-of-service collections are applied once across a claim and the submission it replaced.
  prerequisite: []
  cross_category:
