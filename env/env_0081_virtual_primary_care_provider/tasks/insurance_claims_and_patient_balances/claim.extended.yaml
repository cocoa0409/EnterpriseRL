  factors:
    - id: cost_share_charge_count
      effect: parameter
      decides: cs_charge
      bindings: [cs_pr, cs_rb, cs_charge]
      ladder:
        - when: "a patient responsibility posting stands on the claim"
          value: "that posting"
        - when: "no patient responsibility posting and a self-pay rebill stands"
          value: "the rebill"
        - when: "otherwise"
          value: "0.00"
