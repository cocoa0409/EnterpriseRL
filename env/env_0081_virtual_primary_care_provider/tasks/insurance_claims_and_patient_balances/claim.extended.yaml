- name: Commercial HMO Coverage
  rank: 1
  entry_gate:
    payer_in_network: true
    card_details_required:
    - payer_name
    - member_number
    - group_number
  parameters:
    claims_filed_by_larkspur: true
    superbill_provided: false
    superbill_delivery_business_days: 0
    time_of_service_basis: estimate
    pcp_designation_required: true
    pcp_required_visit_types:
    - Primary Care Follow-Up Visit
    - Primary Care New Patient Visit
    - Annual Preventive Video Visit
    pcp_cure_days: 30
    reverification_interval_days: 30
    preventive_zero_cost_share: true
    secondary_billing: true
    secondary_submit_days_after_primary: 30
    cob_order_rule: self_then_birthday
    claim_submission_target_business_days: 5
    balance_billing_prohibited: true
    timely_filing_denial_handling: provider_writeoff
    eligibility_denial_handling: rebill_price_path
    not_covered_denial_handling: rebill_price_path
    pcp_denial_handling: corrected_claim_if_cured_else_rebill_price_path
    missing_information_handling: corrected_claim
    duplicate_denial_handling: no_action
    statement_first_days_after_remit: 7
    statement_cycle_days: 30
    statement_due_days: 30
    statements_before_collections: 3
    collections_min_days_after_first_statement: 120
    collections_min_balance: 25.0
    small_balance_writeoff_threshold: 4.99
    prompt_pay_discount_pct: 10
    prompt_pay_days: 30
    prompt_pay_applies_to: self_pay_rebill
    payment_plan_min_balance: 100.0
    payment_plan_max_months: 12
    payment_plan_min_monthly: 25.0
    payment_plan_interest_pct: 0
    payment_plan_pauses_collections: true
    hardship_full_fpl_pct: 200
    hardship_partial_fpl_pct: 300
    hardship_partial_discount_pct: 50
    hardship_applies_to: &id001
    - self_pay_rebill
    - patient_responsibility
    credit_apply_to_open_balances_first: true
    credit_refund_days: 30
    credit_refund_minimum: 1.0
    corrected_claim_allowed: true
    member_internal_appeal_days: 180
    member_appeal_records_business_days: 5
    accumulator_refresh_on_remit: true
    billing_rounding: half_up_cent
    max_corrected_claims_per_visit: 2
    payment_plan_missed_installments_limit: 2
