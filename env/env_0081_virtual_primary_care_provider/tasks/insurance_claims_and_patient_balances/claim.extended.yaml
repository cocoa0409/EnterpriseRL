      decides: cs_tos
      bindings: [cs_tos_a, cs_tos_b, cs_tos]
      ladder:
        - when: "time-of-service entries stand on the claim and on the submission it replaced"
          method: "take both"
        - when: "they stand only on the claim"
          method: "take those"
        - when: "they stand only on the replaced submission"
          method: "take those"
        - when: "otherwise"
