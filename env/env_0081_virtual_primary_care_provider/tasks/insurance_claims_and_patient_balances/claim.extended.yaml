- id: claim_ext_rebill_balance_payment
  base_policy_refs: [claim_payments_and_discounts, claim_denial_handling, claim_evt_remittance_posting, claim_credits_and_refunds, claim_statements_and_collections]
  overwrite: []
  trigger: on_request
  subject: [claim_patient_payment_posted, claim_prompt_pay_discount_applied]
  computes: payment_amount
  target_tool: post_rebill_balance_payment_9bd5f69d
  params: {}
  rule: >-
    A patient who pays a self-pay rebill balance in full makes that payment personally with a card the patient reads out after the agent quotes the amount; the payment and any prompt-pay discount it earns are posted together on the claim paid.
    The claim paid is the patient's claim whose first statement was issued most recently.
    The balance paid starts from the self-pay rebill and the patient responsibility posted on that claim.
    The balance paid takes booking collection by this selection rule: when a time-of-service entry stands on the claim itself, it takes that entry; when none stands on the claim but one stands on the submission the claim replaced, it takes that entry; otherwise it takes none.
    The balance paid counts credit as follows: when the claim carries both credit received from another claim and credit moved away or refunded, it counts both; when it carries only credit received, it counts the credit received; when it carries only credit moved away or refunded, it counts that credit; otherwise it counts no credit.
    The balance paid counts earlier patient money as follows: when the claim carries both patient payments and prompt-pay discounts, it counts both; when it carries only patient payments, it counts the payments; when it carries only prompt-pay discounts, it counts the discounts; otherwise it counts none.
    The balance paid is the sum of the counted entries with their signs.
    The prompt-pay rate for the payment is set by the kind of balance: when a self-pay rebill stands on the claim and no patient responsibility posting does, the rate is prompt_pay_discount_pct percent; when a patient responsibility posting stands on the claim, the rate is 0 because insured cost share is never discounted; otherwise the rate is 0.
    Whether the prompt-pay rate is applied is decided by the statement dates: when the claim's first statement has been issued and the frozen date is no more than prompt_pay_days calendar days after that statement_date, the rate is applied; when the first statement has been issued and that window has passed, it is not applied; otherwise, with no statement issued, it is not applied.
    Day counts are calendar days added to the anchor date (the anchor date plus N days is the date N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
    The prompt-pay discount is the balance paid multiplied by the applied rate and divided by 100, rounded half up to the cent, and the payment is the balance paid less that discount, rounded half up to the cent; with no rate applied the payment is the balance paid.
    A balance paid at or below 0.00 takes no payment.
    The payment is fixed only after no claim of the patient whose balance is below zero is left while this claim's balance is above zero.
  prerequisite:
    - problem: claim_ext_open_balance_credit_transfer
      kind: value_input
      gate: pr_credit
      form: state
      policy_source: >-
        The payment is fixed only after no claim of the patient whose balance is below zero is left while this claim's balance is above zero.
      condition: >-
        The crediting claim's balance is no longer below 0.00 because its credit has been moved by a transfer entry onto the claim paid, which carries the matching credit-received entry.
      resolved_by: transfer_claim_credit_12a8a2c0
      effect: >-
        The claim paid carries a credit-received entry, so the balance paid, the discount and the payment all drop.
