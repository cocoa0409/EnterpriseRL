- id: claim_ext_cost_share_balance_payment
  base_policy_refs: [claim_payments_and_discounts, claim_evt_remittance_posting, claim_credits_and_refunds, claim_hardship]
  overwrite: []
  trigger: on_request
  subject: [claim_patient_payment_posted]
  computes: payment_amount
  target_tool: post_cost_share_payment_1adf649d
  params: {}
  rule: >-
    A patient who pays an insured cost-share balance makes that payment personally with a card the patient reads out after the agent quotes the amount.
    The claim paid is the patient's claim whose first statement was issued most recently.
    With no entry counted, the cost-share balance paid is 0.00 and no payment is taken.
    The cost-share balance counts the claim's charge as follows: when a patient responsibility posting stands on the claim, it counts that posting; when instead a self-pay rebill stands on it, it counts the rebill; otherwise it counts no charge.
    The cost-share balance takes booking collection by this selection rule: when time-of-service entries stand both on the claim and on the submission it replaced, it takes both; when they stand only on the claim, it takes those; when they stand only on the replaced submission, it takes those; otherwise it takes none.
    The cost-share balance counts credit received as follows: when credit-received entries stand on the claim and the claim also shows credit moved away or refunded, it counts both; when only credit received stands, it counts the credit received; when only credit moved away or refunded stands, it counts that; otherwise it counts none.
    The cost-share balance counts earlier patient payments as follows: when patient payments and prompt-pay discounts both stand on the claim, it counts both; when only patient payments stand, it counts the payments; when only prompt-pay discounts stand, it counts the discounts; otherwise it counts none.
    The cost-share balance counts Larkspur adjustments as follows: when a hardship adjustment and a small-balance write-off both stand on the claim, it counts both; when only a hardship adjustment stands, it counts it; when only a small-balance write-off stands, it counts it; otherwise it counts none.
    The cost-share balance is the counted entries added together with their signs.
    The payment is the cost-share balance rounded half up to the cent; a balance at or below 0.00 takes no payment.
    The payment is fixed only after the time-of-service entries on the claim and on the submission it replaced together carry the whole booking collection of the claim's visit.
  prerequisite:
    - problem: claim_ext_booking_collection_application
      kind: value_input
      gate: cs_tos
      form: state
      policy_source: >-
        The payment is fixed only after the time-of-service entries on the claim and on the submission it replaced together carry the whole booking collection of the claim's visit.
      condition: >-
        The claim paid and the submission it replaced together carry time-of-service entries equal to the booking collection of the visit (cost-share lines less their refunds).
      resolved_by: apply_booking_collection_b81aee5f
      effect: >-
        The claim paid gains the missing time-of-service entry, so the cost-share balance and the payment drop by that amount.
  cross_category: []
  compute:
    - cs_claim: "LATEST('patient_statements', 'claim_id', date_field='statement_date', statement_number=1)"
    - cs_prior: "LATEST('insurance_claims', 'original_claim_id', date_field='submission_date', claim_id=cs_claim)"
    - cs_pr: "SUM('patient_balance_entries', 'amount', claim_id=cs_claim, event_type='claim_patient_balance_posted')"
    - cs_rb: "SUM('patient_balance_entries', 'amount', claim_id=cs_claim, event_type='claim_self_pay_rebill_posted')"
    - cs_charge: "cs_pr if cs_pr != 0 else (cs_rb if cs_rb != 0 else 0.0)"
    - cs_tos_a: "SUM('patient_balance_entries', 'amount', claim_id=cs_claim, event_type='claim_time_of_service_applied')"
    - cs_tos_b: "SUM('patient_balance_entries', 'amount', claim_id=cs_prior, event_type='claim_time_of_service_applied')"
    - cs_tos: "cs_tos_a + cs_tos_b if (cs_tos_a != 0 and cs_tos_b != 0) else (cs_tos_a if (cs_tos_a != 0 and cs_tos_b == 0) else (cs_tos_b if (cs_tos_b != 0 and cs_tos_a == 0) else 0.0))"
    - cs_credit_a: "SUM('patient_balance_entries', 'amount', claim_id=cs_claim, event_type='claim_credit_received')"
    - cs_credit_b: "SUM('patient_balance_entries', 'amount', claim_id=cs_claim, event_type='claim_credit_transferred') + SUM('patient_balance_entries', 'amount', claim_id=cs_claim, event_type='claim_credit_refunded')"
    - cs_credit: "cs_credit_a + cs_credit_b if (cs_credit_a != 0 and cs_credit_b != 0) else (cs_credit_a if (cs_credit_a != 0 and cs_credit_b == 0) else (cs_credit_b if (cs_credit_b != 0 and cs_credit_a == 0) else 0.0))"
    - cs_paid_a: "SUM('patient_balance_entries', 'amount', claim_id=cs_claim, event_type='claim_patient_payment_posted')"
    - cs_paid_b: "SUM('patient_balance_entries', 'amount', claim_id=cs_claim, event_type='claim_prompt_pay_discount_applied')"
    - cs_paid: "cs_paid_a + cs_paid_b if (cs_paid_a != 0 and cs_paid_b != 0) else (cs_paid_a if (cs_paid_a != 0 and cs_paid_b == 0) else (cs_paid_b if (cs_paid_b != 0 and cs_paid_a == 0) else 0.0))"
    - cs_adj_a: "SUM('patient_balance_entries', 'amount', claim_id=cs_claim, event_type='claim_hardship_adjustment_posted')"
    - cs_adj_b: "SUM('patient_balance_entries', 'amount', claim_id=cs_claim, event_type='claim_small_balance_written_off')"
    - cs_adj: "cs_adj_a + cs_adj_b if (cs_adj_a != 0 and cs_adj_b != 0) else (cs_adj_a if (cs_adj_a != 0 and cs_adj_b == 0) else (cs_adj_b if (cs_adj_b != 0 and cs_adj_a == 0) else 0.0))"
    - cs_balance: "cs_charge + cs_tos + cs_credit + cs_paid + cs_adj"
    - result: "RND(cs_balance + 0.000000001, 2) if cs_balance > 0 else 0.0"
  compute_basis:
    cs_claim: "The claim paid is the patient's claim whose first statement was issued most recently."
    cs_prior: "The cost-share balance takes booking collection by this selection rule: when time-of-service entries stand both on the claim and on the submission it replaced, it takes both; when they stand only on the claim, it takes those; when they stand only on the replaced submission, it takes those; otherwise it takes none."
