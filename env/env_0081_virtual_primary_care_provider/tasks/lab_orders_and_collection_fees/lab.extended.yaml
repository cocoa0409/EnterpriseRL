      Larkspur at Work Core with Behavioral Health: 0.0
      Larkspur at Work Enhanced: 0.0
      Larkspur at Work Total Care: 0.0
      Larkspur at Work Total Care Plus: 0.0
    sponsor_per_plan_year_by_plan:
      Larkspur at Work Virtual Urgent Care: 0
      Larkspur at Work Core: 0
      Larkspur at Work Core with Behavioral Health: 0
      Larkspur at Work Enhanced: 1
      Larkspur at Work Total Care: 1
      Larkspur at Work Total Care Plus: 1
    kit_fee_waived_sponsor_plans: *id002
    insurance_billable: true
    insurance_billed_by: partner_lab
    cpt_codes:
    - '80053'
    - '80061'
    - '83036'
    - '85025'
    - '84443'
    panel_components:
    - cmp
    - lipids
    - a1c
    - cbc
    - tsh
    duplicate_component_window_days: 30
    repeat_frequency_min_days: 330
    collection_methods_available:
    - patient_service_center
    - mobile_phlebotomy
    specimen_type: venous_blood
    psc_draw_fee: 8.0
    at_home_kit_fee: 0.0
    mobile_phlebotomy_fee: 59.0
    collection_fee_paths: *id003
    collection_fee_waived_membership_tiers: *id004
    mobile_phlebotomy_states: *id005
    mobile_booking_lead_days: 2
    kit_ship_excluded_states: *id006
    kit_shipping_business_days: 3
    kit_specimen_stability_hours: 0
    requisition_validity_days: 90
    kit_return_window_days: 0
    requisition_reissues_allowed: 1
    requisition_reissue_window_days: 14
    fasting_hours: 9
    min_patient_age_months: 216
    order_requires_completed_visit: true
    ordering_window_days: 14
    max_open_orders_same_panel: 1
    result_turnaround_business_days: 3
    clinician_review_business_days: 2
    lab_side_rejection_reasons: *id007
    free_patient_side_redraws: 1
    redraw_window_days: 30
    cancellation_refund_before_collection: panel_full_fee_unless_shipped
    kit_fee_refundable_after_shipment: false
    expired_refund_processing_fee: 10.0
    expired_refund_request_days: 60
    charge_timing: at_order
    price_rounding: half_up_cent
    kit_replacement_on_damage: true
    psc_draw_fee_paths: *id008
events:
- type: lab_ordered
  target: lab_orders
  mutation: create
  meaning: A Larkspur clinician orders a panel (a first order or a redraw).
  grain: one row per order
  fields:
    variant_name: Panel.
    ordered_date: Order date.
    ordering_visit_id: Visit the order came from.
    collection_method: Method chosen.
    payment_path: Path set by the lab payment path rule.
    membership_id: Membership applied.
    enrollment_id: Enrollment paying.
    coverage_id: Coverage the partner lab bills.
    requisition_expiry_date: ordered_date plus requisition_validity_days.
    redraw_of_order_id: Rejected order this redraw replaces.
    reissue_count: 0.0
  triggers:
  - event: lab:lab_panel_charged
    when:
      payment_path:
      - self_pay
      - member_rate
    map:
      charge_date: ordered_date
- type: lab_kit_shipped
  target: lab_orders
  mutation:
    transition:
      from: ordered
      to: kit_shipped
  meaning: The at-home kit ships.
  grain: one row per transaction
  fields:
    kit_shipped_date: Ship date.
    requisition_expiry_date: The earlier of the requisition validity and kit_shipped_date plus kit_return_window_days.
  triggers: []
- type: lab_collected_at_site
  target: lab_orders
  mutation:
    transition:
      from: ordered
      to: collected
  meaning: The specimen is drawn at a patient service center or by a mobile phlebotomist.
  grain: one row per transaction
  fields:
    collected_date: Draw date.
  triggers: []
- type: lab_kit_received
  target: lab_orders
  mutation:
    transition:
      from: kit_shipped
      to: collected
  meaning: The lab receives the returned kit.
  grain: one row per transaction
  fields:
    collected_date: Collection date written on the kit.
  triggers: []
- type: lab_resulted
  target: lab_orders
  mutation:
    transition:
      from: collected
      to: resulted
  meaning: The lab reports results.
  grain: one row per transaction
  fields:
    resulted_date: Date results arrived.
  triggers: []
- type: lab_specimen_rejected
  target: lab_orders
  mutation:
    transition:
      from: collected
      to: specimen_rejected
  meaning: The lab rejects the specimen.
  grain: one row per transaction
  fields:
    rejection_reason: Reason reported.
    resulted_date: Date the rejection was reported.
  triggers: []
- type: lab_results_reviewed
  target: lab_orders
  mutation:
    transition:
      from: resulted
      to: reviewed
  meaning: A clinician reviews the results.
  grain: one row per transaction
  fields:
    reviewed_date: Review date.
  triggers: []
- type: lab_cancelled
  target: lab_orders
  mutation:
    transition:
      from: ordered
      to: cancelled
  meaning: The patient cancels the order before collection.
  grain: one row per transaction
  fields:
    cancelled_date: Cancellation date.
  triggers: []
- type: lab_kit_cancelled
  target: lab_orders
  mutation:
    transition:
      from: kit_shipped
      to: cancelled
  meaning: The patient cancels after the kit shipped and before returning it.
  grain: one row per transaction
  fields:
    cancelled_date: Cancellation date.
  triggers: []
- type: lab_requisition_expired
  target: lab_orders
  mutation:
    transition:
      from: ordered
      to: expired
  meaning: The requisition expires with no collection.
  grain: one row per transaction
  fields:
    cancelled_date: Day after requisition_expiry_date.
  triggers: []
- type: lab_kit_expired
  target: lab_orders
  mutation:
    transition:
      from: kit_shipped
      to: expired
  meaning: The kit is not returned by the requisition expiry date.
  grain: one row per transaction
  fields:
    cancelled_date: Day after requisition_expiry_date.
  triggers: []
- type: lab_requisition_reissued
  target: lab_orders
  mutation: update
  meaning: An expiring requisition is reissued with a new validity period.
  grain: one row per transaction
  fields:
    requisition_expiry_date: Reissue date plus requisition_validity_days.
    reissue_count: Incremented by one.
  triggers: []
- type: lab_collection_method_changed
  target: lab_orders
  mutation: update
  meaning: The patient switches the collection method before collection.
  grain: one row per transaction
  fields:
    collection_method: New method.
  triggers: []
- type: lab_payment_path_changed
  target: lab_orders
  mutation: update
  meaning: The payment path changes before collection.
  grain: one row per transaction
  fields:
    payment_path: New path.
    membership_id: Membership now applied.
    enrollment_id: Enrollment now applied.
    coverage_id: Coverage now billed.
  triggers: []
- type: lab_panel_charged
  target: lab_charges
  meaning: The panel price is charged on the self_pay, member_rate or sponsor_plan path.
  grain: one row per order
  distinguish_by:
  - pricing_basis
  fields:
    amount: Panel charge.
    charge_date: Order date or path change date.
    pricing_basis: list_price, member_rate or sponsor_employee_fee.
  account: lab_billed
  direction: in
  triggers: []
- type: lab_collection_fee_charged
  target: lab_charges
  meaning: A patient service center draw fee, at-home kit fee or mobile phlebotomy fee is charged.
  grain: one row per order per collection method charged
  distinguish_by:
  - pricing_basis
  fields:
    amount: Fee.
    charge_date: Order date or method change date.
    pricing_basis: psc_draw_fee, kit_fee or mobile_phlebotomy_fee.
  account: lab_billed
  direction: in
  triggers: []
- type: lab_charge_refunded
  target: lab_charges
  meaning: All or part of a lab line is refunded.
  grain: one row per refunded line
  distinguish_by:
  - original_charge_id
  fields:
    amount: Negative refund.
    charge_date: Refund date.
    pricing_basis: refund.
    original_charge_id: Line refunded.
    refund_reason: Basis.
  account: lab_billed
  direction: out
  triggers: []
measures:
- id: lab_msr_included_used_year
  window: the patient's current membership year
  measure: count of the patient's lab_orders of the same variant_name with payment_path membership_included, status
    not cancelled or expired, and ordered_date on or after membership_year_start, redraws excluded
- id: lab_msr_sponsor_used_plan_year
  window: the enrollment's current plan year
  measure: count of the patient's lab_orders of the same variant_name with payment_path sponsor_plan, status not
    cancelled or expired, and ordered_date on or after plan_year_start, redraws excluded
- id: lab_msr_last_collected_same_panel
  window: all time
  measure: latest collected_date among the patient's lab_orders of the same variant_name with status resulted or
    reviewed
- id: lab_msr_patient_side_redraws
  window: the chain of redraws from one original order
  measure: count of redraw orders in the chain created after a rejection whose reason is not in lab_side_rejection_reasons
- id: lab_msr_open_component_overlap
  window: duplicate_component_window_days calendar days ending on the ordered_date
  measure: count of the patient's other lab_orders sharing a panel_components entry whose status is ordered, kit_shipped
    or collected, or whose collected_date falls in the window
policies:
- id: lab_agg_multi_holding
  subject:
  - lab_ordered
  rule: A patient may hold any number of lab orders over time, one record per panel ordered (max_per_customer is
    unlimited); how orders of the same patient combine is set by the duplicate-testing rule.
  eligibility: []
  params:
    max_per_customer: null
- id: lab_agg_duplicate_testing
  subject:
  - lab_ordered
  rule: Orders are combined per patient across all panels. A panel may be ordered only when the patient holds no
    other order of the same panel whose status is ordered or kit_shipped. A panel is refused while lab_msr_open_component_overlap
    is above zero, that is when another order shares a component in panel_components and is still open or was collected
    within duplicate_component_window_days calendar days. A panel is also refused when fewer than repeat_frequency_min_days
    calendar days have passed since lab_msr_last_collected_same_panel. Day counts are calendar days added to the
    anchor date (the anchor date plus N days is the date N days later), never full 24-hour periods, and the boundary
    date itself counts as within the limit. A redraw replaces its rejected order and is never a duplicate of it.
    That limit is max_open_orders_same_panel.
  eligibility:
  - id: one_open_order_per_panel
    applies_to:
    - lab_ordered
    kind: dedup
    condition: A panel may be ordered only when the patient holds no other order of the same panel whose status
      is ordered or kit_shipped.
    evidence_fields:
    - lab_orders.customer_id
    - lab_orders.variant_name
    - lab_orders.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lab_orders.customer_id
      action_bindings:
        lab_orders.customer_id: customer_id
    dedup_contract:
      table: lab_orders
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        variant_name: variant_name
      duplicate_filters:
        status:
        - ordered
        - kit_shipped
      distinct_fields: []
  params:
    per_tier:
      Hemoglobin A1c Test:
        repeat_frequency_min_days: =repeat_frequency_min_days
      Lipid Panel:
        repeat_frequency_min_days: =repeat_frequency_min_days
      Comprehensive Metabolic Panel:
        repeat_frequency_min_days: =repeat_frequency_min_days
      Thyroid Panel with Reflex:
        repeat_frequency_min_days: =repeat_frequency_min_days
      STI Screening Panel:
        repeat_frequency_min_days: =repeat_frequency_min_days
      Comprehensive Wellness Panel:
        repeat_frequency_min_days: =repeat_frequency_min_days
  measures:
  - lab_msr_open_component_overlap
  - lab_msr_last_collected_same_panel
- id: lab_ordering_eligibility
  subject:
  - lab_ordered
  - lab_collection_method_changed
  rule: Only a Larkspur clinician orders labs, from a visit. A panel may be ordered only from a visit appointment
    whose status is completed. A panel may be ordered only when the frozen time is no more than ordering_window_days
    calendar days after the ordering visit's completed_date. Day counts are calendar days added to the anchor date
    (the anchor date plus N days is the date N days later), never full 24-hour periods, and the boundary date itself
    counts as within the limit. A panel may be ordered only when the patient's age on the ordered date is at least
    min_patient_age_months completed calendar months after the patient's date of birth. Month counts are calendar
    months added to the anchor date; when that day does not exist in the target month the last day of that month
    is used, and the boundary date itself counts as reached. The collection method must be one of the panel's collection_methods_available;
    an at-home kit is not shipped to a patient whose home_state is in kit_ship_excluded_states, and mobile phlebotomy
    is offered only where home_state is in mobile_phlebotomy_states and the appointment is at least mobile_booking_lead_days
    calendar days ahead. The patient is told the panel's fasting_hours before collection. The method may be changed
    only while the order is ordered. The order must come from a completed visit (order_requires_completed_visit),
    and the panel's specimen_type decides whether an at-home kit can collect it.
  eligibility:
  - id: from_completed_visit
    applies_to:
    - lab_ordered
    kind: state
    condition: A panel may be ordered only from a visit appointment whose status is completed.
    evidence_fields:
    - visit_appointments.status
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    state_contract:
      field: visit_appointments.status
      allowed:
      - completed
  - id: ordering_window
    applies_to:
    - lab_ordered
    kind: time
    condition: A panel may be ordered only when the frozen time is no more than ordering_window_days calendar days
      after the ordering visit's completed_date.
    evidence_fields:
    - visit_appointments.completed_date
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the ordering visit's completed_date
      anchor_source: visit_appointments.completed_date
      relation: not_after
      duration_source: variants.ordering_window_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  - id: lab_min_age
    applies_to:
    - lab_ordered
    kind: time
    condition: A panel may be ordered only when the patient's age on the ordered date is at least min_patient_age_months
      completed calendar months after the patient's date of birth.
    evidence_fields:
    - customers.date_of_birth
    - customers.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the patient's date of birth
      anchor_source: customers.date_of_birth
      relation: not_before
      duration_source: variants.min_patient_age_months
      unit: calendar_months
      counting_rule: Month counts are calendar months added to the anchor date; when that day does not exist in
        the target month the last day of that month is used, and the boundary date itself counts as reached.
      boundary: inclusive
  - id: method_change_state
    applies_to:
    - lab_collection_method_changed
    kind: state
    condition: The method may be changed only while the order is ordered.
    evidence_fields:
    - lab_orders.status
    - lab_orders.lab_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lab_orders.lab_order_id
      action_bindings:
        lab_orders.lab_order_id: lab_order_id
    state_contract:
      field: lab_orders.status
      allowed:
      - ordered
  params:
    per_tier:
      Hemoglobin A1c Test:
        collection_methods_available: =collection_methods_available
      Lipid Panel:
        collection_methods_available: =collection_methods_available
      Comprehensive Metabolic Panel:
        collection_methods_available: =collection_methods_available
      Thyroid Panel with Reflex:
        collection_methods_available: =collection_methods_available
      STI Screening Panel:
        collection_methods_available: =collection_methods_available
      Comprehensive Wellness Panel:
        collection_methods_available: =collection_methods_available
- id: lab_evt_payment_path
  subject:
  - lab_ordered
  - lab_payment_path_changed
  rule: 'Every lab order is paid on exactly one payment path, fixed at ordering by the first of these steps that
    applies. First, sponsor_plan: the patient''s Larkspur at Work enrollment covers the ordered_date, the plan''s
    sponsor_covered_by_plan is true for the panel, and lab_msr_sponsor_used_plan_year is below sponsor_per_plan_year_by_plan.
    The sponsor_plan path may be used only while the patient''s Larkspur at Work enrollment status is active or
    on_leave. Second, membership_included: the patient holds a membership, and either the tier''s member_price_by_membership_tier
    for the panel is 0.00 or lab_msr_included_used_year is below included_per_membership_year_by_tier. A membership
    benefit or member price may be used only while the patient''s membership status is trialing, active or past_due.
    Third, the patient chooses insurance, when the panel''s insurance_billable is true and the patient holds an
    insurance coverage whose tier files claims, or the price path, which is member_rate for a patient holding a
    membership and self_pay otherwise. The insurance path may be used only while the billed insurance coverage status
    is verified. Between insurance and the price path, the path used is the one the patient chooses. On the insurance
    path the partner lab bills the insurer and the patient directly for the panel and the draw (insurance_billed_by),
    and Larkspur posts no panel charge. Membership pricing never applies on the sponsor_plan or insurance paths.
    The path may change only while the order is ordered; the old path''s panel and fee lines are refunded with refund_reason
    path_changed and the new path''s are charged on the change date. Only the membership statuses in member_price_statuses
    qualify for membership_included or member_rate; on the insurance path the partner lab bills the panel''s cpt_codes.'
  eligibility:
  - id: lab_sponsor_state
    applies_to:
    - lab_ordered
    - lab_payment_path_changed
    kind: state
    condition: The sponsor_plan path may be used only while the patient's Larkspur at Work enrollment status is
      active or on_leave.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - active
      - on_leave
  - id: lab_membership_state
    applies_to:
    - lab_ordered
    - lab_payment_path_changed
    kind: state
    condition: A membership benefit or member price may be used only while the patient's membership status is trialing,
      active or past_due.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
  - id: lab_coverage_state
    applies_to:
    - lab_ordered
    - lab_payment_path_changed
    kind: state
    condition: The insurance path may be used only while the billed insurance coverage status is verified.
    evidence_fields:
    - insurance_coverages.status
    - insurance_coverages.coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - insurance_coverages.coverage_id
      action_bindings:
        insurance_coverages.coverage_id: coverage_id
    state_contract:
      field: insurance_coverages.status
      allowed:
      - verified
  - id: lab_path_choice
    applies_to:
    - lab_ordered
    - lab_payment_path_changed
    kind: caller_fact
    condition: Between insurance and the price path, the path used is the one the patient chooses.
    evidence_fields:
    - lab_orders.payment_path
    - lab_orders.lab_order_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - lab_orders.lab_order_id
      action_bindings:
        lab_orders.lab_order_id: lab_order_id
  params:
    per_tier:
      Hemoglobin A1c Test:
        sponsor_covered_by_plan: =sponsor_covered_by_plan
        included_per_membership_year_by_tier: =included_per_membership_year_by_tier
      Lipid Panel:
        sponsor_covered_by_plan: =sponsor_covered_by_plan
        included_per_membership_year_by_tier: =included_per_membership_year_by_tier
      Comprehensive Metabolic Panel:
        sponsor_covered_by_plan: =sponsor_covered_by_plan
        included_per_membership_year_by_tier: =included_per_membership_year_by_tier
      Thyroid Panel with Reflex:
        sponsor_covered_by_plan: =sponsor_covered_by_plan
        included_per_membership_year_by_tier: =included_per_membership_year_by_tier
      STI Screening Panel:
        sponsor_covered_by_plan: =sponsor_covered_by_plan
        included_per_membership_year_by_tier: =included_per_membership_year_by_tier
      Comprehensive Wellness Panel:
        sponsor_covered_by_plan: =sponsor_covered_by_plan
        included_per_membership_year_by_tier: =included_per_membership_year_by_tier
  measures:
  - lab_msr_included_used_year
  - lab_msr_sponsor_used_plan_year
- id: lab_evt_panel_pricing
  subject:
  - lab_panel_charged
  rule: On the self_pay path the panel charge is the panel_price; on the member_rate path it is the panel's member_price_by_membership_tier
    for the patient's tier on the ordered_date; on the sponsor_plan path it is the plan's sponsor_employee_fee_by_plan;
    on the membership_included and insurance paths Larkspur charges nothing for the panel. No line is written for
    a 0.00 amount. A panel charge may be posted only when no panel charge line already exists for the same order.
    The charge is posted at ordering (charge_timing) and rounded half up to the cent; a redraw order is priced under
    the redraw rule.
  eligibility:
  - id: one_panel_line
    applies_to:
    - lab_panel_charged
    kind: dedup
    condition: A panel charge may be posted only when no panel charge line already exists for the same order.
    evidence_fields:
    - lab_charges.lab_order_id
    - lab_charges.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lab_charges.lab_order_id
      action_bindings:
        lab_charges.lab_order_id: lab_order_id
    dedup_contract:
      table: lab_charges
      mode: separate_record
      object_bindings:
        lab_order_id: lab_order_id
      duplicate_filters:
        event_type:
        - lab_panel_charged
      distinct_fields: []
  params:
    per_tier:
      Hemoglobin A1c Test:
        panel_price: =panel_price
        member_price_by_membership_tier: =member_price_by_membership_tier
        sponsor_employee_fee_by_plan: =sponsor_employee_fee_by_plan
      Lipid Panel:
        panel_price: =panel_price
        member_price_by_membership_tier: =member_price_by_membership_tier
        sponsor_employee_fee_by_plan: =sponsor_employee_fee_by_plan
      Comprehensive Metabolic Panel:
        panel_price: =panel_price
        member_price_by_membership_tier: =member_price_by_membership_tier
        sponsor_employee_fee_by_plan: =sponsor_employee_fee_by_plan
      Thyroid Panel with Reflex:
        panel_price: =panel_price
        member_price_by_membership_tier: =member_price_by_membership_tier
        sponsor_employee_fee_by_plan: =sponsor_employee_fee_by_plan
      STI Screening Panel:
        panel_price: =panel_price
        member_price_by_membership_tier: =member_price_by_membership_tier
        sponsor_employee_fee_by_plan: =sponsor_employee_fee_by_plan
      Comprehensive Wellness Panel:
        panel_price: =panel_price
        member_price_by_membership_tier: =member_price_by_membership_tier
        sponsor_employee_fee_by_plan: =sponsor_employee_fee_by_plan
  formula:
    amount: panel_price if payment_path == 'self_pay' else member_price_by_membership_tier if payment_path == 'member_rate'
      else sponsor_employee_fee_by_plan
- id: lab_evt_collection_fees
  subject:
  - lab_collection_fee_charged
  - lab_collection_method_changed
  rule: The collection fee depends on the collection method. At a patient service center the psc_draw_fee is charged
    only on the paths in psc_draw_fee_paths. An at-home kit carries the at_home_kit_fee and mobile phlebotomy the
    mobile_phlebotomy_fee on every path in collection_fee_paths, except that neither is charged to a patient whose
    membership tier is in collection_fee_waived_membership_tiers, nor on the sponsor_plan path of a plan in kit_fee_waived_sponsor_plans.
    The kit or mobile phlebotomy fee is waived only while the patient's membership status is trialing, active or
    past_due. Membership pricing never reduces a collection fee. The fee is charged at ordering; when the method
    changes before collection, the old method's fee is refunded in full unless a kit has already shipped, and the
    new method's fee is charged on the change date. No line is written for a 0.00 amount.
  eligibility:
  - id: lab_fee_waiver_state
    applies_to:
    - lab_collection_fee_charged
    kind: state
    condition: The kit or mobile phlebotomy fee is waived only while the patient's membership status is trialing,
      active or past_due.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
  params:
    per_tier:
      Hemoglobin A1c Test:
        at_home_kit_fee: =at_home_kit_fee
        psc_draw_fee: =psc_draw_fee
      Lipid Panel:
        at_home_kit_fee: =at_home_kit_fee
        psc_draw_fee: =psc_draw_fee
      Comprehensive Metabolic Panel:
        at_home_kit_fee: =at_home_kit_fee
        psc_draw_fee: =psc_draw_fee
      Thyroid Panel with Reflex:
        at_home_kit_fee: =at_home_kit_fee
        psc_draw_fee: =psc_draw_fee
      STI Screening Panel:
        at_home_kit_fee: =at_home_kit_fee
        psc_draw_fee: =psc_draw_fee
      Comprehensive Wellness Panel:
        at_home_kit_fee: =at_home_kit_fee
        psc_draw_fee: =psc_draw_fee
- id: lab_cancellation_and_expiry
  subject:
  - lab_cancelled
  - lab_kit_cancelled
  - lab_requisition_expired
  - lab_kit_expired
  - lab_requisition_reissued
  - lab_charge_refunded
  rule: An order may be cancelled only while its status is ordered or kit_shipped. On cancellation before collection
    the panel charge is refunded in full, and the collection fee is refunded too unless the kit has shipped (cancellation_refund_before_collection,
    kit_fee_refundable_after_shipment), with refund_reason cancelled_before_collection. An order not collected by
    requisition_expiry_date expires; on the patient's request the panel charge is then refunded less expired_refund_processing_fee,
    never below 0.00, with refund_reason expired_unused, and a collection fee is not refunded. An expired-order
    refund may be issued only when the frozen time is no more than expired_refund_request_days calendar days after
    the order's cancelled_date. Day counts are calendar days added to the anchor date (the anchor date plus N days
    is the date N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
    Before it expires a requisition may be reissued, at most requisition_reissues_allowed times, for a new requisition_validity_days
    from the reissue date; an expiring kit is reissued only within the panel's requisition validity. A requisition
    may be reissued only when the frozen time is no more than requisition_reissue_window_days calendar days before
    its requisition_expiry_date and not after it. For an at-home kit the requisition_expiry_date is the earlier
    of the requisition validity and kit_return_window_days calendar days after kit_shipped_date.
  eligibility:
  - id: cancel_before_collection
    applies_to:
    - lab_cancelled
    - lab_kit_cancelled
    kind: state
    condition: An order may be cancelled only while its status is ordered or kit_shipped.
    evidence_fields:
    - lab_orders.status
    - lab_orders.lab_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lab_orders.lab_order_id
      action_bindings:
        lab_orders.lab_order_id: lab_order_id
    state_contract:
      field: lab_orders.status
      allowed:
      - ordered
      - kit_shipped
  - id: expired_refund_window
    applies_to:
    - lab_charge_refunded
    kind: time
    condition: An expired-order refund may be issued only when the frozen time is no more than expired_refund_request_days
      calendar days after the order's cancelled_date.
    evidence_fields:
    - lab_orders.cancelled_date
    - lab_orders.lab_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lab_orders.lab_order_id
      action_bindings:
        lab_orders.lab_order_id: lab_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the order's cancelled_date
      anchor_source: lab_orders.cancelled_date
      relation: not_after
      duration_source: variants.expired_refund_request_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  params:
    per_tier:
      Hemoglobin A1c Test:
        expired_refund_processing_fee: =expired_refund_processing_fee
      Lipid Panel:
        expired_refund_processing_fee: =expired_refund_processing_fee
      Comprehensive Metabolic Panel:
        expired_refund_processing_fee: =expired_refund_processing_fee
      Thyroid Panel with Reflex:
        expired_refund_processing_fee: =expired_refund_processing_fee
      STI Screening Panel:
        expired_refund_processing_fee: =expired_refund_processing_fee
      Comprehensive Wellness Panel:
        expired_refund_processing_fee: =expired_refund_processing_fee
- id: lab_specimen_rejection_redraws
  subject:
  - lab_specimen_rejected
  - lab_ordered
  - lab_charge_refunded
  rule: 'When the lab rejects a specimen, the order ends as specimen_rejected and a redraw may be ordered as a new
    order naming it in redraw_of_order_id, with the same panel, path and a new requisition. A redraw may be ordered
    only for an order whose status is specimen_rejected. A redraw may be ordered only when no other redraw already
    names the same rejected order. A redraw may be ordered only when the frozen time is no more than redraw_window_days
    calendar days after the rejected order''s resulted_date, the date the rejection was reported. Day counts are
    calendar days added to the anchor date (the anchor date plus N days is the date N days later), never full 24-hour
    periods, and the boundary date itself counts as within the limit. After a rejection whose reason is in lab_side_rejection_reasons
    the redraw is free: no panel or collection fee is charged on it. After a patient-side rejection the redraw is
    free only while lab_msr_patient_side_redraws is below free_patient_side_redraws; a later patient-side redraw
    is charged its panel and collection fees as a new order. The rejected order''s own charges are never refunded
    except for a lab-side rejection with no redraw ordered within the window, which refunds the panel charge with
    refund_reason lab_side_rejection.'
  eligibility:
  - id: redraw_from_rejected
    applies_to:
    - lab_ordered
    kind: authorization
    condition: A redraw may be ordered only for an order whose status is specimen_rejected.
    evidence_fields:
    - lab_orders.status
    - lab_orders.redraw_of_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lab_orders.redraw_of_order_id
      action_bindings:
        lab_orders.redraw_of_order_id: redraw_of_order_id
  - id: one_redraw_per_rejection
    applies_to:
    - lab_ordered
    kind: dedup
    condition: A redraw may be ordered only when no other redraw already names the same rejected order.
    evidence_fields:
    - lab_orders.redraw_of_order_id
    - lab_orders.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lab_orders.redraw_of_order_id
      action_bindings:
        lab_orders.redraw_of_order_id: redraw_of_order_id
    dedup_contract:
      table: lab_orders
      mode: separate_record
      object_bindings:
        redraw_of_order_id: redraw_of_order_id
      duplicate_filters:
        status:
        - ordered
        - kit_shipped
        - collected
        - resulted
        - reviewed
        - specimen_rejected
        - expired
      distinct_fields: []
  - id: redraw_window
    applies_to:
    - lab_ordered
    kind: time
    condition: A redraw may be ordered only when the frozen time is no more than redraw_window_days calendar days
      after the rejected order's resulted_date, the date the rejection was reported.
    evidence_fields:
    - lab_orders.resulted_date
    - lab_orders.lab_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lab_orders.lab_order_id
      action_bindings:
        lab_orders.lab_order_id: lab_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the rejected order's resulted_date
      anchor_source: lab_orders.resulted_date
      relation: not_after
      duration_source: variants.redraw_window_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  measures:
  - lab_msr_patient_side_redraws
- id: lab_results_review
  subject:
  - lab_kit_shipped
  - lab_collected_at_site
  - lab_kit_received
  - lab_resulted
  - lab_results_reviewed
  rule: Kits arrive within kit_shipping_business_days business days of shipping; a kit specimen received more than
    kit_specimen_stability_hours after its collection is rejected as received_too_late, and a kit that arrives damaged
    is replaced at no charge (kit_replacement_on_damage). Business days are Monday to Friday excluding US federal
    holidays, counted from the day after the anchor date. Results are expected within result_turnaround_business_days
    business days of collection and are released to the patient as soon as they arrive. Results may be reviewed
    only while the order status is resulted. A clinician reviews them within clinician_review_business_days business
    days of resulted_date; any follow-up visit is booked and priced under the visit rules.
  eligibility:
  - id: review_after_result
    applies_to:
    - lab_results_reviewed
    kind: state
    condition: Results may be reviewed only while the order status is resulted.
    evidence_fields:
    - lab_orders.status
    - lab_orders.lab_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lab_orders.lab_order_id
      action_bindings:
        lab_orders.lab_order_id: lab_order_id
    state_contract:
      field: lab_orders.status
      allowed:
      - resulted
- id: lab_billing_corrections
  subject:
  - lab_charge_refunded
  rule: Every refund points to exactly one charge line. A refund may be issued only when no refund already points
    to the same line. A line charged at a price other than the one these rules give for its path, method and status
    is corrected by refunding the overcharged difference with refund_reason billing_error; an undercharge is never
    re-billed. Refunds go to the card on file. Every computed amount is rounded half up to the cent (price_rounding).
  eligibility:
  - id: one_refund_per_line
    applies_to:
    - lab_charge_refunded
    kind: dedup
    condition: A refund may be issued only when no refund already points to the same line.
    evidence_fields:
    - lab_charges.original_charge_id
    - lab_charges.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - lab_charges.original_charge_id
      action_bindings:
        lab_charges.original_charge_id: original_charge_id
    dedup_contract:
      table: lab_charges
      mode: separate_record
      object_bindings:
        original_charge_id: original_charge_id
      duplicate_filters:
        event_type:
        - lab_charge_refunded
      distinct_fields: []

extended_policies:
- id: lab_ext_member_rate_correction
  base_policy_refs:
  - lab_billing_corrections
  - lab_evt_panel_pricing
  - lab_evt_payment_path
  - lab_cancellation_and_expiry
  - lab_specimen_rejection_redraws
  overwrite:
  - base_policy: lab_evt_panel_pricing
    superseded_clause: On the self_pay path the panel charge is the panel_price; on the member_rate path it is the panel's member_price_by_membership_tier for the patient's tier on the ordered_date
    replaced_by: Larkspur Health's published price of a panel charged on the self_pay or member_rate path is the panel's tier price plus the specimen handling charge plus the specimen courier charge plus the partner lab processing charge, each fixed as this rule states.
  - base_policy: lab_evt_payment_path
    superseded_clause: The path may change only while the order is ordered; the old path's panel and fee lines are refunded with refund_reason path_changed and the new path's are charged on the change date.
    replaced_by: When the order was posted on the self_pay path although its patient held a qualifying membership on the ordered date, the order is moved in place to the member_rate path with that membership recorded on it, its panel line keeps its charge and is corrected by one billing_error refund of the overcharged difference, and its other lines stay as they are; every other path change happens only while the order is ordered, with the old path's panel and fee lines refunded with refund_reason path_changed and the new path's charged on the change date.
  trigger: state_due
  subject:
  - lab_charge_refunded
  computes: refund_amount
  target_tool: correct_member_rate_order_9be954a8
  params:
    premier_a1c: 0.0
    premier_lipid: 0.0
    premier_cmp: 0.0
    premier_thyroid: 0.0
    premier_sti: 79.0
    premier_wellness: 0.0
    plus_a1c: 19.0
    plus_lipid: 24.0
    plus_cmp: 27.0
    plus_thyroid: 42.0
    plus_sti: 95.0
    plus_wellness: 139.0
    essentials_a1c: 24.0
    essentials_lipid: 29.0
    essentials_cmp: 32.0
    essentials_thyroid: 49.0
    essentials_sti: 109.0
    essentials_wellness: 159.0
    handling_per_specimen: 2.0
    multi_specimen_count: 3
    blood_handling: 2.5
    courier_corridor: 3.0
    courier_regional: 1.5
    processing_urgent: 5.0
    processing_async: 2.5
  rule: 'A panel line is corrected under this rule when the order was posted on the self_pay path although its patient held a qualifying membership on the ordered date. A qualifying membership is the patient''s membership whose status is trialing, active or past_due, whose activated_date is on or before the ordered date, and which was not suspended over the ordered date (a suspended_date on or before the ordered date together with a current_period_start after the ordered date shows a suspension that lasted past it). A panel that the qualifying membership includes at a member price of 0.00 is outside this rule and is corrected under the billing-error rule alone. The member-price correction refund is the panel charge on the order less the panel''s correct price, never below 0.00, rounded half up to the cent once, on that difference. As standard, the panel''s correct price is its panel_price, the list price; every amount that applies to the correct price is added to it once, and no amount is applied to another. Larkspur Health''s published price of a panel charged on the self_pay or member_rate path is the panel''s tier price plus the specimen handling charge plus the specimen courier charge plus the partner lab processing charge, each fixed as this rule states. The tier price that replaces the list price in the correct price is the Larkspur Premier Annual member price when the qualifying membership is a Larkspur Premier Annual membership; the Larkspur Plus member price when the qualifying membership is a Larkspur Plus Monthly or Larkspur Plus Annual membership; the Larkspur Essentials member price when the qualifying membership is a Larkspur Essentials Monthly or Larkspur Essentials Annual membership; and the panel_price otherwise. The member prices are those of the lab catalogue''s member_price_by_membership_tier, restated in this rule''s params. The specimen handling charge added to the correct price is worked out per specimen, as the handling charge per specimen times the three specimens, for a panel whose specimen is urine, swab and blood when the order carries a patient service center draw fee line; it is one flat blood handling charge for a panel whose specimen is venous blood or capillary or venous blood when the order carries a patient service center draw fee line; and it is 0.00 otherwise. The specimen courier charge added to the correct price follows the state the patient was in at the ordering visit: the corridor courier charge for New York, New Jersey or Connecticut; the regional courier charge for Pennsylvania, Delaware, Maryland, Virginia, Massachusetts, Rhode Island, New Hampshire, Vermont or Maine; and 0.00 for any other state. The partner lab processing charge added to the correct price follows the type of the ordering visit: the urgent processing charge for an Urgent Care Video Visit; the asynchronous processing charge for an Asynchronous Message Consult; and 0.00 for any other visit type. When the order was posted on the self_pay path although its patient held a qualifying membership on the ordered date, the order is moved in place to the member_rate path with that membership recorded on it, its panel line keeps its charge and is corrected by one billing_error refund of the overcharged difference, and its other lines stay as they are; every other path change happens only while the order is ordered, with the old path''s panel and fee lines refunded with refund_reason path_changed and the new path''s charged on the change date. The refund points to the panel line, and no line is written for a 0.00 refund.'
  prerequisite: []
  cross_category:
  - category: membership
    as: branch
    reads:
    - variant_name
    - status
    - activated_date
    - suspended_date
    - current_period_start
    note: The tier price factor reads the patient's membership tier and the records that show it qualified on the ordered date.
  - category: visit
    as: branch
    reads:
    - patient_location_state
    - variant_name
    note: The courier and processing factors read the ordering visit's location state and visit type.
  compute:
  - ordered: F('ordered_date')
  - panel: F('variant_name')
  - charged: SUM('lab_charges', 'amount', event_type='lab_panel_charged')
  - mem_status: CFIELD('membership', 'status')
  - mem_activated: CFIELD('membership', 'activated_date')
  - mem_suspended: CFIELD('membership', 'suspended_date')
  - mem_period_start: CFIELD('membership', 'current_period_start')
  - qualifies: (mem_status == 'trialing' or mem_status == 'active' or mem_status == 'past_due') and (mem_activated or '9999-12-31') <= ordered and not ((mem_suspended or '9999-12-31') <= ordered and (mem_period_start or '0000-01-01') > ordered)
  - premier_price: K('premier_a1c') if panel == 'Hemoglobin A1c Test' else (K('premier_lipid') if panel == 'Lipid Panel' else (K('premier_cmp') if panel == 'Comprehensive Metabolic Panel' else (K('premier_thyroid') if panel == 'Thyroid Panel with Reflex' else (K('premier_sti') if panel == 'STI Screening Panel' else K('premier_wellness')))))
  - plus_price: K('plus_a1c') if panel == 'Hemoglobin A1c Test' else (K('plus_lipid') if panel == 'Lipid Panel' else (K('plus_cmp') if panel == 'Comprehensive Metabolic Panel' else (K('plus_thyroid') if panel == 'Thyroid Panel with Reflex' else (K('plus_sti') if panel == 'STI Screening Panel' else K('plus_wellness')))))
  - essentials_price: K('essentials_a1c') if panel == 'Hemoglobin A1c Test' else (K('essentials_lipid') if panel == 'Lipid Panel' else (K('essentials_cmp') if panel == 'Comprehensive Metabolic Panel' else (K('essentials_thyroid') if panel == 'Thyroid Panel with Reflex' else (K('essentials_sti') if panel == 'STI Screening Panel' else K('essentials_wellness')))))
  - mem_tier: CFIELD('membership', 'variant_name')
  - tier_price: premier_price if (mem_tier == 'Larkspur Premier Annual' and qualifies) else (plus_price if ((mem_tier == 'Larkspur Plus Monthly' or mem_tier == 'Larkspur Plus Annual') and qualifies) else (essentials_price if ((mem_tier == 'Larkspur Essentials Monthly' or mem_tier == 'Larkspur Essentials Annual') and qualifies) else P('panel_price')))
  - specimen: P('specimen_type')
  - psc_lines: COUNT('lab_charges', event_type='lab_collection_fee_charged', pricing_basis='psc_draw_fee')
  - handling: K('handling_per_specimen') * K('multi_specimen_count') if (specimen == 'urine_swab_and_blood' and psc_lines > 0) else (K('blood_handling') if ((specimen == 'venous_blood' or specimen == 'capillary_or_venous_blood') and psc_lines > 0) else 0.0)
  - visit_state: CFIELD('visit', 'patient_location_state', visit_id=F('ordering_visit_id'))
  - courier: K('courier_corridor') if (visit_state == 'NY' or visit_state == 'NJ' or visit_state == 'CT') else (K('courier_regional') if (visit_state == 'PA' or visit_state == 'DE' or visit_state == 'MD' or visit_state == 'VA' or visit_state == 'MA' or visit_state == 'RI' or visit_state == 'NH' or visit_state == 'VT' or visit_state == 'ME') else 0.0)
  - visit_type: CFIELD('visit', 'variant_name', visit_id=F('ordering_visit_id'))
  - processing: K('processing_urgent') if visit_type == 'Urgent Care Video Visit' else (K('processing_async') if visit_type == 'Asynchronous Message Consult' else 0.0)
  - result: RND(MX(0.0, charged - (tier_price + handling + courier + processing)) + 0.000000001, 2)
  compute_basis:
    charged: The member-price correction refund is the panel charge on the order less the panel's correct price, never below 0.00, rounded half up to the cent once, on that difference.
    mem_status: A qualifying membership is the patient's membership whose status is trialing, active or past_due, whose activated_date is on or before the ordered date, and which was not suspended over the ordered date (a suspended_date on or before the ordered date together with a current_period_start after the ordered date shows a suspension that lasted past it).
    mem_activated: whose activated_date is on or before the ordered date
    mem_suspended: a suspended_date on or before the ordered date together with a current_period_start after the ordered date shows a suspension that lasted past it
    mem_period_start: a suspended_date on or before the ordered date together with a current_period_start after the ordered date shows a suspension that lasted past it
    qualifies: A qualifying membership is the patient's membership whose status is trialing, active or past_due, whose activated_date is on or before the ordered date, and which was not suspended over the ordered date (a suspended_date on or before the ordered date together with a current_period_start after the ordered date shows a suspension that lasted past it).
    premier_price: The member prices are those of the lab catalogue's member_price_by_membership_tier, restated in this rule's params.
    plus_price: The member prices are those of the lab catalogue's member_price_by_membership_tier, restated in this rule's params.
    essentials_price: The member prices are those of the lab catalogue's member_price_by_membership_tier, restated in this rule's params.
    mem_tier: The tier price that replaces the list price in the correct price is the Larkspur Premier Annual member price when the qualifying membership is a Larkspur Premier Annual membership; the Larkspur Plus member price when the qualifying membership is a Larkspur Plus Monthly or Larkspur Plus Annual membership; the Larkspur Essentials member price when the qualifying membership is a Larkspur Essentials Monthly or Larkspur Essentials Annual membership; and the panel_price otherwise.
    tier_price: The tier price that replaces the list price in the correct price is the Larkspur Premier Annual member price when the qualifying membership is a Larkspur Premier Annual membership; the Larkspur Plus member price when the qualifying membership is a Larkspur Plus Monthly or Larkspur Plus Annual membership; the Larkspur Essentials member price when the qualifying membership is a Larkspur Essentials Monthly or Larkspur Essentials Annual membership; and the panel_price otherwise.
    psc_lines: when the order carries a patient service center draw fee line
    handling: The specimen handling charge added to the correct price is worked out per specimen, as the handling charge per specimen times the three specimens, for a panel whose specimen is urine, swab and blood when the order carries a patient service center draw fee line; it is one flat blood handling charge for a panel whose specimen is venous blood or capillary or venous blood when the order carries a patient service center draw fee line; and it is 0.00 otherwise.
    visit_state: The specimen courier charge added to the correct price follows the state the patient was in at the ordering visit
    courier: 'The specimen courier charge added to the correct price follows the state the patient was in at the ordering visit: the corridor courier charge for New York, New Jersey or Connecticut; the regional courier charge for Pennsylvania, Delaware, Maryland, Virginia, Massachusetts, Rhode Island, New Hampshire, Vermont or Maine; and 0.00 for any other state.'
    visit_type: The partner lab processing charge added to the correct price follows the type of the ordering visit
    processing: 'The partner lab processing charge added to the correct price follows the type of the ordering visit: the urgent processing charge for an Urgent Care Video Visit; the asynchronous processing charge for an Asynchronous Message Consult; and 0.00 for any other visit type.'
    result: The member-price correction refund is the panel charge on the order less the panel's correct price, never below 0.00, rounded half up to the cent once, on that difference. As standard, the panel's correct price is its panel_price, the list price; every amount that applies to the correct price is added to it once, and no amount is applied to another.
  factors:
  - id: membership_tier_pricing
    effect: parameter
    decides: tier_price
    bindings:
    - mem_tier
    - tier_price
    ladder:
    - when: the qualifying membership on the ordered date is a Larkspur Premier Annual membership
      value: the Larkspur Premier Annual member price for the panel
    - when: the qualifying membership on the ordered date is a Larkspur Plus Monthly or Larkspur Plus Annual membership
      value: the Larkspur Plus member price for the panel
    - when: the qualifying membership on the ordered date is a Larkspur Essentials Monthly or Larkspur Essentials Annual membership
      value: the Larkspur Essentials member price for the panel
    - when: otherwise
      value: P('panel_price')
    baseline:
      tier_price: P('panel_price')
    evidence:
    - cross_category
    - date
    cross_difficulty: membership
  - id: specimen_handling
    effect: method
    decides: handling
    bindings:
    - psc_lines
    - handling
    ladder:
    - when: the panel's specimen is urine, swab and blood and the order carries a patient service center draw fee line
      method: the handling charge per specimen times the three specimens
    - when: the panel's specimen is venous blood or capillary or venous blood and the order carries a patient service center draw fee line
      method: one flat blood handling charge
    - when: otherwise
      method: no handling charge (0.00)
    baseline:
      handling: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: specimen_courier
    effect: parameter
    decides: courier
    bindings:
    - visit_state
    - courier
    ladder:
    - when: the patient was in New York, New Jersey or Connecticut at the ordering visit
      value: K('courier_corridor')
    - when: the patient was in Pennsylvania, Delaware, Maryland, Virginia, Massachusetts, Rhode Island, New Hampshire, Vermont or Maine at the ordering visit
      value: K('courier_regional')
    - when: otherwise
      value: '0.00'
    baseline:
      courier: '0.0'
    evidence:
    - cross_category
    cross_difficulty: visit
  - id: partner_lab_processing
    effect: parameter
    decides: processing
    bindings:
    - visit_type
    - processing
    ladder:
    - when: the ordering visit is an Urgent Care Video Visit
      value: K('processing_urgent')
    - when: the ordering visit is an Asynchronous Message Consult
      value: K('processing_async')
    - when: otherwise
      value: '0.00'
    baseline:
      processing: '0.0'
    evidence:
    - cross_category
    cross_difficulty: visit
  baseline:
    rule: The member-price correction refund is the panel charge on the order less the panel's correct price, never below 0.00, rounded half up to the cent once, on that difference. As standard, the panel's correct price is its panel_price, the list price; every amount that applies to the correct price is added to it once, and no amount is applied to another.
    params:
    - panel_price
  inputs:
    history:
    - table: lab_charges
      aggregate: sum
      field: amount
      filters:
        event_type: lab_panel_charged
    - table: lab_charges
      aggregate: count
      field: lab_charge_id
      filters:
        event_type: lab_collection_fee_charged
        pricing_basis: psc_draw_fee
    cross_category:
    - membership
    - visit
- id: lab_ext_home_kit_switch_charge
  base_policy_refs:
  - lab_evt_collection_fees
  - lab_ordering_eligibility
  overwrite:
  - base_policy: lab_evt_collection_fees
    superseded_clause: An at-home kit carries the at_home_kit_fee and mobile phlebotomy the mobile_phlebotomy_fee on every path in collection_fee_paths, except that neither is charged to a patient whose membership tier is in collection_fee_waived_membership_tiers, nor on the sponsor_plan path of a plan in kit_fee_waived_sponsor_plans.
    replaced_by: For a switch from a patient service center draw to an at-home kit on an order that is not on the sponsor_plan path, the kit fee is the panel's at_home_kit_fee, waived when the membership the order records is a Larkspur Premier Annual membership whose status is trialing, active or past_due; for a switch from a patient service center draw to mobile phlebotomy on such an order the mobile phlebotomy fee is the home-visit charge Larkspur Health publishes for that switch; in every other case an at-home kit carries the at_home_kit_fee and mobile phlebotomy the mobile_phlebotomy_fee on every path in collection_fee_paths, except that neither is charged to a patient whose membership tier is in collection_fee_waived_membership_tiers, nor on the sponsor_plan path of a plan in kit_fee_waived_sponsor_plans.
  - base_policy: lab_evt_collection_fees
    superseded_clause: when the method changes before collection, the old method's fee is refunded in full unless a kit has already shipped, and the new method's fee is charged on the change date.
    replaced_by: On such a switch the patient service center draw fee already standing on the order is not refunded; it enters the kit line as the prior collection credit this rule states, and the kit line is the only line written on the change date; on a switch from a patient service center draw to mobile phlebotomy the draw fee is likewise not refunded and enters the home-visit charge as its credit; on every other method change the old method's fee is refunded in full unless a kit has already shipped, and the new method's fee is charged on the change date.
  trigger: on_request
  subject:
  - lab_collection_method_changed
  - lab_collection_fee_charged
  computes: kit_charge
  target_tool: switch_order_to_home_kit_d2ed4950
  params:
    expedited_fee: 9.95
    overnight_fee: 24.95
    overnight_days: 10
    expedited_days: 30
    multi_specimen_return: 4.5
    priority_return: 6.5
    stability_threshold_hours: 96
    credit_full_days: 30
    credit_partial_days: 60
    card_cost_pct: 0.029
    card_cost_fixed: 0.3
    zone_mid_atlantic: 3.95
    zone_distant: 6.95
    older_order_mid: 4.0
    older_order_late: 8.0
    older_order_mid_days: 14
    older_order_late_days: 45
    saturday_pickup: 12.0
    sunday_pickup: 8.0
    reference_saturday: '2026-01-03'
  rule: 'This rule prices the patient''s own switch of an order whose status is ordered from a patient service center draw to an at-home kit, when the order is not on the sponsor_plan path; the patient chooses the switch and confirms the switch charge herself. The switch charge for an order posted at the list price although its patient held a membership that was trialing, active or past due on its ordered date is fixed only after the order records that membership. The switch charge is one kit line posted on the change date. As standard, the switch charge is the panel''s at_home_kit_fee, waived when the membership the order records is a Larkspur Premier Annual membership whose status is trialing, active or past_due; every amount that applies to the switch charge is added to it or taken from it once in a single sum, the sum is never below 0.00, and it is rounded half up to the cent once, at the end. For a switch from a patient service center draw to an at-home kit on an order that is not on the sponsor_plan path, the kit fee is the panel''s at_home_kit_fee, waived when the membership the order records is a Larkspur Premier Annual membership whose status is trialing, active or past_due; for a switch from a patient service center draw to mobile phlebotomy on such an order the mobile phlebotomy fee is the home-visit charge Larkspur Health publishes for that switch; in every other case an at-home kit carries the at_home_kit_fee and mobile phlebotomy the mobile_phlebotomy_fee on every path in collection_fee_paths, except that neither is charged to a patient whose membership tier is in collection_fee_waived_membership_tiers, nor on the sponsor_plan path of a plan in kit_fee_waived_sponsor_plans. The kit ships from Larkspur Pharmacy at the Larkspur Pharmacy shipping speeds, and the kit outbound shipping added to the switch charge follows the calendar days from the change date to the requisition_expiry_date and the membership the order records: the overnight fee less the expedited fee when 10 or fewer days remain and that membership is a Larkspur Premier Annual membership whose status is trialing, active or past_due; the overnight fee when 10 or fewer days remain and the order records no such membership; the expedited fee when 11 to 30 days remain and the order records no such membership; and 0.00 otherwise. The kit return pack added to the switch charge follows the order''s earlier kit lines and the panel''s specimen: the multi-specimen return pack charge when the order carries no kit fee line yet and the panel''s specimen is urine, swab and blood; the priority return charge when the order carries no kit fee line yet and the panel''s kit_specimen_stability_hours is under 96; and 0.00 otherwise. The prior collection credit taken from the switch charge follows the calendar days from the charge_date of the patient service center draw fee standing on the order to the change date: the full draw fee standing on the order when 30 or fewer days have passed; the draw fee standing on the order less the card cost Larkspur bore on it, that is less 2.9 percent of it and less 0.30, when 31 to 60 days have passed; and nothing otherwise. The kit dispatch zone charge added to the switch charge follows the state the patient gave at the ordering visit: the Mid-Atlantic zone charge for New York, New Jersey, Pennsylvania, Delaware, Maryland or Virginia; the distant zone charge for Illinois, Ohio, Michigan, Wisconsin, Minnesota, Florida, Georgia, North Carolina, Colorado or Washington; and 0.00 otherwise. The older-order handling charge added to the switch charge follows the calendar days from the ordered date to the change date: the late handling charge when more than 45 days have passed; the mid handling charge when 15 to 45 days have passed; and 0.00 when 14 or fewer days have passed. The weekend dispatch charge added to the switch charge follows the weekday of the change date: the Saturday pickup charge on a Saturday; the Sunday pickup charge on a Sunday;
    and 0.00 on a weekday. On such a switch the patient service center draw fee already standing on the order is not refunded; it enters the kit line as the prior collection credit this rule states, and the kit line is the only line written on the change date; on a switch from a patient service center draw to mobile phlebotomy the draw fee is likewise not refunded and enters the home-visit charge as its credit; on every other method change the old method''s fee is refunded in full unless a kit has already shipped, and the new method''s fee is charged on the change date. The order''s collection method becomes at_home_kit, and no line is written for a 0.00 switch charge.'
  prerequisite:
  - problem: lab_ext_member_rate_correction
    kind: value_input
    gate: link_tier
    form: state
    policy_source: The switch charge for an order posted at the list price although its patient held a membership that was trialing, active or past due on its ordered date is fixed only after the order records that membership.
    condition: lab_orders.membership_id names the patient's membership that was trialing, active or past_due on the ordered date.
    resolved_by: correct_member_rate_order_9be954a8
    effect: Once the order records the membership, the membership the switch charge reads is that membership, so the kit fee waiver and the kit outbound shipping tier follow its tier and status.
  cross_category:
  - category: membership
    as: branch
    reads:
    - variant_name
    - status
    note: The kit outbound shipping factor reads the tier and status of the membership the order records.
  - category: visit
    as: branch
    reads:
    - patient_location_state
    note: The kit dispatch zone factor reads the state the patient gave at the ordering visit.
  compute:
  - waive_tier: CFIELD('membership', 'variant_name', membership_id=F('membership_id'))
  - waive_status: CFIELD('membership', 'status', membership_id=F('membership_id'))
  - kit_fee_due: 0.0 if (waive_tier == 'Larkspur Premier Annual' and (waive_status == 'trialing' or waive_status == 'active' or waive_status == 'past_due')) else P('at_home_kit_fee')
  - link_tier: CFIELD('membership', 'variant_name', membership_id=F('membership_id'))
  - link_status: CFIELD('membership', 'status', membership_id=F('membership_id'))
  - premier_benefit: link_tier == 'Larkspur Premier Annual' and (link_status == 'trialing' or link_status == 'active' or link_status == 'past_due')
  - days_left: DAYS(NOW, F('requisition_expiry_date'))
  - outbound: K('overnight_fee') - K('expedited_fee') if (days_left <= K('overnight_days') and premier_benefit) else (K('overnight_fee') if (days_left <= K('overnight_days') and not premier_benefit) else (K('expedited_fee') if (days_left <= K('expedited_days') and not premier_benefit) else 0.0))
  - kit_lines: COUNT('lab_charges', event_type='lab_collection_fee_charged', pricing_basis='kit_fee')
  - return_pack: K('multi_specimen_return') if (kit_lines == 0 and P('specimen_type') == 'urine_swab_and_blood') else (K('priority_return') if (kit_lines == 0 and P('kit_specimen_stability_hours') < K('stability_threshold_hours')) else 0.0)
  - draw_standing: SUM('lab_charges', 'amount', event_type='lab_collection_fee_charged', pricing_basis='psc_draw_fee')
  - draw_date: LATEST('lab_charges', 'charge_date', date_field='charge_date', event_type='lab_collection_fee_charged', pricing_basis='psc_draw_fee')
  - draw_age: DAYS(draw_date or NOW, NOW)
  - prior_credit: draw_standing if (draw_age <= K('credit_full_days') and draw_standing > 0) else (draw_standing - draw_standing * K('card_cost_pct') - K('card_cost_fixed') if (draw_age <= K('credit_partial_days') and draw_standing > 0) else 0.0)
  - visit_state: CFIELD('visit', 'patient_location_state', visit_id=F('ordering_visit_id'))
  - dispatch_zone: K('zone_mid_atlantic') if (visit_state == 'NY' or visit_state == 'NJ' or visit_state == 'PA' or visit_state == 'DE' or visit_state == 'MD' or visit_state == 'VA') else (K('zone_distant') if (visit_state == 'IL' or visit_state == 'OH' or visit_state == 'MI' or visit_state == 'WI' or visit_state == 'MN' or visit_state == 'FL' or visit_state == 'GA' or visit_state == 'NC' or visit_state == 'CO' or visit_state == 'WA') else 0.0)
  - order_age: DAYS(F('ordered_date'), NOW)
  - older_order: K('older_order_late') if order_age > K('older_order_late_days') else (K('older_order_mid') if order_age > K('older_order_mid_days') else 0.0)
  - weekday_index: DAYS(K('reference_saturday'), NOW) % 7
  - weekend: K('saturday_pickup') if weekday_index == 0 else (K('sunday_pickup') if weekday_index == 1 else 0.0)
  - result: RND(MX(0.0, kit_fee_due + outbound + return_pack - prior_credit + dispatch_zone + older_order + weekend) + 0.000000001, 2)
  compute_basis:
    waive_tier: As standard, the switch charge is the panel's at_home_kit_fee, waived when the membership the order records is a Larkspur Premier Annual membership whose status is trialing, active or past_due
    waive_status: waived when the membership the order records is a Larkspur Premier Annual membership whose status is trialing, active or past_due
    kit_fee_due: As standard, the switch charge is the panel's at_home_kit_fee, waived when the membership the order records is a Larkspur Premier Annual membership whose status is trialing, active or past_due
    link_tier: the kit outbound shipping added to the switch charge follows the calendar days from the change date to the requisition_expiry_date and the membership the order records
    link_status: that membership is a Larkspur Premier Annual membership whose status is trialing, active or past_due
    premier_benefit: that membership is a Larkspur Premier Annual membership whose status is trialing, active or past_due
    days_left: the kit outbound shipping added to the switch charge follows the calendar days from the change date to the requisition_expiry_date and the membership the order records
    outbound: the overnight fee less the expedited fee when 10 or fewer days remain and that membership is a Larkspur Premier Annual membership whose status is trialing, active or past_due; the overnight fee when 10 or fewer days remain and the order records no such membership; the expedited fee when 11 to 30 days remain and the order records no such membership; and 0.00 otherwise.
    kit_lines: when the order carries no kit fee line yet
    return_pack: 'The kit return pack added to the switch charge follows the order''s earlier kit lines and the panel''s specimen: the multi-specimen return pack charge when the order carries no kit fee line yet and the panel''s specimen is urine, swab and blood; the priority return charge when the order carries no kit fee line yet and the panel''s kit_specimen_stability_hours is under 96; and 0.00 otherwise.'
    draw_standing: the full draw fee standing on the order
    draw_date: The prior collection credit taken from the switch charge follows the calendar days from the charge_date of the patient service center draw fee standing on the order to the change date
    draw_age: The prior collection credit taken from the switch charge follows the calendar days from the charge_date of the patient service center draw fee standing on the order to the change date
    prior_credit: the full draw fee standing on the order when 30 or fewer days have passed; the draw fee standing on the order less the card cost Larkspur bore on it, that is less 2.9 percent of it and less 0.30, when 31 to 60 days have passed; and nothing otherwise.
    visit_state: The kit dispatch zone charge added to the switch charge follows the state the patient gave at the ordering visit
    dispatch_zone: the Mid-Atlantic zone charge for New York, New Jersey, Pennsylvania, Delaware, Maryland or Virginia; the distant zone charge for Illinois, Ohio, Michigan, Wisconsin, Minnesota, Florida, Georgia, North Carolina, Colorado or Washington; and 0.00 otherwise.
    order_age: The older-order handling charge added to the switch charge follows the calendar days from the ordered date to the change date
    older_order: the late handling charge when more than 45 days have passed; the mid handling charge when 15 to 45 days have passed; and 0.00 when 14 or fewer days have passed.
    weekday_index: The weekend dispatch charge added to the switch charge follows the weekday of the change date
    weekend: the Saturday pickup charge on a Saturday; the Sunday pickup charge on a Sunday; and 0.00 on a weekday.
    result: every amount that applies to the switch charge is added to it or taken from it once in a single sum, the sum is never below 0.00, and it is rounded half up to the cent once, at the end.
  factors:
  - id: kit_outbound_shipping
    effect: parameter
    decides: outbound
    bindings:
    - link_tier
    - link_status
    - premier_benefit
    - days_left
    - outbound
    ladder:
    - when: 10 or fewer calendar days remain to the requisition_expiry_date and the order records a Larkspur Premier Annual membership whose status is trialing, active or past_due
      value: K('overnight_fee') - K('expedited_fee')
    - when: 10 or fewer calendar days remain and the order records no such membership
      value: K('overnight_fee')
    - when: 11 to 30 calendar days remain and the order records no such membership
      value: K('expedited_fee')
    - when: otherwise
      value: '0.00'
    baseline:
      outbound: '0.0'
    evidence:
    - date
    - cross_category
    cross_difficulty: membership
  - id: kit_return_pack
    effect: parameter
    decides: return_pack
    bindings:
    - kit_lines
    - return_pack
    ladder:
    - when: the order carries no kit fee line yet and the panel's specimen is urine, swab and blood
      value: K('multi_specimen_return')
    - when: the order carries no kit fee line yet and the panel's kit_specimen_stability_hours is under 96
      value: K('priority_return')
    - when: otherwise
      value: '0.00'
    baseline:
      return_pack: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: prior_collection_credit
    effect: method
    decides: prior_credit
    bindings:
    - draw_standing
    - draw_date
    - draw_age
    - prior_credit
    ladder:
    - when: 30 or fewer calendar days from the standing draw fee's charge_date to the change date
      method: the full draw fee standing on the order is taken from the switch charge
    - when: 31 to 60 calendar days from the standing draw fee's charge_date to the change date
      method: the draw fee standing on the order less 2.9 percent of it and less 0.30 is taken from the switch charge
    - when: otherwise
      method: nothing is taken from the switch charge
    baseline:
      prior_credit: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: kit_dispatch_zone
    effect: parameter
    decides: dispatch_zone
    bindings:
    - visit_state
    - dispatch_zone
    ladder:
    - when: the patient gave New York, New Jersey, Pennsylvania, Delaware, Maryland or Virginia at the ordering visit
      value: K('zone_mid_atlantic')
    - when: the patient gave Illinois, Ohio, Michigan, Wisconsin, Minnesota, Florida, Georgia, North Carolina, Colorado or Washington at the ordering visit
      value: K('zone_distant')
    - when: otherwise
      value: '0.00'
    baseline:
      dispatch_zone: '0.0'
    evidence:
    - cross_category
    cross_difficulty: visit
  - id: older_order_handling
    effect: parameter
    decides: older_order
    bindings:
    - order_age
    - older_order
    ladder:
    - when: more than 45 calendar days from the ordered date to the change date
      value: K('older_order_late')
    - when: 15 to 45 calendar days from the ordered date to the change date
      value: K('older_order_mid')
    - when: otherwise (14 or fewer days)
      value: '0.00'
    baseline:
      older_order: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: weekend_dispatch
    effect: parameter
    decides: weekend
    bindings:
    - weekday_index
    - weekend
    ladder:
    - when: the change date is a Saturday
      value: K('saturday_pickup')
    - when: the change date is a Sunday
      value: K('sunday_pickup')
    - when: otherwise (a weekday)
      value: '0.00'
    baseline:
      weekend: '0.0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The switch charge is one kit line posted on the change date. As standard, the switch charge is the panel's at_home_kit_fee, waived when the membership the order records is a Larkspur Premier Annual membership whose status is trialing, active or past_due; every amount that applies to the switch charge is added to it or taken from it once in a single sum, the sum is never below 0.00, and it is rounded half up to the cent once, at the end.
    params:
    - at_home_kit_fee
  inputs:
    history:
    - table: lab_charges
      aggregate: sum
      field: amount
      filters:
        event_type: lab_collection_fee_charged
        pricing_basis: psc_draw_fee
    - table: lab_charges
      aggregate: count
      field: lab_charge_id
      filters:
        event_type: lab_collection_fee_charged
        pricing_basis: kit_fee
    cross_category:
    - membership
    - visit
- id: lab_ext_requisition_reissue_validity
  base_policy_refs:
  - lab_cancellation_and_expiry
  overwrite:
  - base_policy: lab_cancellation_and_expiry
    superseded_clause: Before it expires a requisition may be reissued, at most requisition_reissues_allowed times, for a new requisition_validity_days from the reissue date; an expiring kit is reissued only within the panel's requisition validity.
    replaced_by: Before it expires a requisition may be reissued, at most requisition_reissues_allowed times, for the reissued validity this rule states, a whole number of calendar days added to the reissue date; an expiring kit is reissued only within the panel's requisition validity.
  trigger: on_request
  subject:
  - lab_requisition_reissued
  computes: validity_days
  target_tool: reissue_requisition_d14f4a64
  params:
    currency_cut_mid: 45
    currency_cut_late: 60
    currency_mid_days: 45
    currency_late_days: 90
    fasting_reserve_drawn: 5
    fasting_reserve_other: 2
    clinician_extension_premier: 14
    clinician_extension_plus: 10
    urgency_cut_urgent: 20
    urgency_cut_async: 10
    urgency_cut_follow_up: 5
    carry_full_days: 7
    carry_half_days: 14
    minimum_validity_days: 14
  rule: 'Before it expires a requisition may be reissued, at most requisition_reissues_allowed times, for the reissued validity this rule states, a whole number of calendar days added to the reissue date; an expiring kit is reissued only within the panel''s requisition validity. A requisition may be reissued only when the frozen time is no more than requisition_reissue_window_days calendar days before its requisition_expiry_date and not after it. The reissued validity is worked out in whole calendar days. As standard, the reissued validity is the panel''s requisition_validity_days; every number of days that applies to the reissued validity is added to it or taken from it once, the reissued validity is never below 14 days before the carried-over days are added, and the carried-over days are added last. The clinical currency cut taken from the reissued validity follows the calendar days from the ordering visit''s completed_date to the reissue date: the late currency cut when more than 90 days have passed; the mid currency cut when 46 to 90 days have passed; and 0 days when 45 or fewer days have passed. The fasting reserve taken from the reissued validity follows the panel''s fasting_hours and the draw fee standing on the order: the drawn-panel fasting reserve when the panel needs 8 or more fasting hours and a patient service center draw fee stands on the order; the other fasting reserve when the panel needs 8 or more fasting hours and no patient service center draw fee stands on the order; and 0 days otherwise. The patient service center draw fee standing on the order is its draw fee lines less the billing_error refunds booked on the order. The dedicated clinician extension added to the reissued validity follows the patient''s membership: the Premier extension when the patient''s membership is a Larkspur Premier Annual membership with a primary clinician assigned; the Plus extension when the patient''s membership is a Larkspur Plus Monthly or Larkspur Plus Annual membership with a primary clinician assigned; and 0 days otherwise. The order urgency cut taken from the reissued validity follows the type of the ordering visit: the urgent cut for an Urgent Care Video Visit; the asynchronous cut for an Asynchronous Message Consult; the follow-up cut for a Primary Care Follow-Up Visit; and 0 days for any other visit type. The carried-over days added last follow the calendar days left from the reissue date to the old requisition_expiry_date: all the days left, never below 0, when 7 or fewer remain; half the days left, rounded down to a whole day, when 8 to 14 remain; and 0 days otherwise. The order''s requisition_expiry_date becomes the reissue date plus the reissued validity, and its reissue_count rises by one.'
  prerequisite: []
  cross_category:
  - category: membership
    as: branch
    reads:
    - variant_name
    - primary_clinician
    note: The dedicated clinician extension reads the patient's membership tier and assigned primary clinician.
  - category: visit
    as: branch
    reads:
    - completed_date
    - variant_name
    note: The clinical currency cut and the order urgency cut read the ordering visit's completion date and type.
  compute:
  - base_validity: P('requisition_validity_days')
  - visit_done: CFIELD('visit', 'completed_date', visit_id=F('ordering_visit_id'))
  - visit_age: DAYS(visit_done or NOW, NOW)
  - currency_cut: K('currency_cut_late') if visit_age > K('currency_late_days') else (K('currency_cut_mid') if visit_age > K('currency_mid_days') else 0)
  - fasting: P('fasting_hours')
  - drawn_lines: SUM('lab_charges', 'amount', event_type='lab_collection_fee_charged', pricing_basis='psc_draw_fee') + SUM('lab_charges', 'amount', event_type='lab_charge_refunded', refund_reason='billing_error')
  - fasting_reserve: K('fasting_reserve_drawn') if (fasting >= 8 and drawn_lines > 0) else (K('fasting_reserve_other') if (fasting >= 8 and drawn_lines <= 0) else 0)
  - member_tier: CFIELD('membership', 'variant_name')
  - member_clinician: CFIELD('membership', 'primary_clinician')
  - clinician_extension: K('clinician_extension_premier') if (member_tier == 'Larkspur Premier Annual' and (member_clinician or '') != '') else (K('clinician_extension_plus') if ((member_tier == 'Larkspur Plus Monthly' or member_tier == 'Larkspur Plus Annual') and (member_clinician or '') != '') else 0)
  - visit_kind: CFIELD('visit', 'variant_name', visit_id=F('ordering_visit_id'))
  - urgency_cut: K('urgency_cut_urgent') if visit_kind == 'Urgent Care Video Visit' else (K('urgency_cut_async') if visit_kind == 'Asynchronous Message Consult' else (K('urgency_cut_follow_up') if visit_kind == 'Primary Care Follow-Up Visit' else 0))
  - remaining: DAYS(NOW, F('requisition_expiry_date'))
  - carried_days: MX(0, remaining) if remaining <= K('carry_full_days') else (int(remaining / 2) if remaining <= K('carry_half_days') else 0)
  - result: MX(K('minimum_validity_days'), base_validity - currency_cut - fasting_reserve - urgency_cut + clinician_extension) + carried_days
  compute_basis:
    base_validity: As standard, the reissued validity is the panel's requisition_validity_days
    visit_done: The clinical currency cut taken from the reissued validity follows the calendar days from the ordering visit's completed_date to the reissue date
    visit_age: The clinical currency cut taken from the reissued validity follows the calendar days from the ordering visit's completed_date to the reissue date
    currency_cut: the late currency cut when more than 90 days have passed; the mid currency cut when 46 to 90 days have passed; and 0 days when 45 or fewer days have passed.
    drawn_lines: The patient service center draw fee standing on the order is its draw fee lines less the billing_error refunds booked on the order.
    fasting_reserve: the drawn-panel fasting reserve when the panel needs 8 or more fasting hours and a patient service center draw fee stands on the order; the other fasting reserve when the panel needs 8 or more fasting hours and no patient service center draw fee stands on the order; and 0 days otherwise.
    member_tier: The dedicated clinician extension added to the reissued validity follows the patient's membership
    member_clinician: with a primary clinician assigned
    clinician_extension: the Premier extension when the patient's membership is a Larkspur Premier Annual membership with a primary clinician assigned; the Plus extension when the patient's membership is a Larkspur Plus Monthly or Larkspur Plus Annual membership with a primary clinician assigned; and 0 days otherwise.
    visit_kind: The order urgency cut taken from the reissued validity follows the type of the ordering visit
    urgency_cut: the urgent cut for an Urgent Care Video Visit; the asynchronous cut for an Asynchronous Message Consult; the follow-up cut for a Primary Care Follow-Up Visit; and 0 days for any other visit type.
    remaining: The carried-over days added last follow the calendar days left from the reissue date to the old requisition_expiry_date
    carried_days: all the days left, never below 0, when 7 or fewer remain; half the days left, rounded down to a whole day, when 8 to 14 remain; and 0 days otherwise.
    result: every number of days that applies to the reissued validity is added to it or taken from it once, the reissued validity is never below 14 days before the carried-over days are added, and the carried-over days are added last.
  factors:
  - id: clinical_currency_cut
    effect: parameter
    decides: currency_cut
    bindings:
    - visit_done
    - visit_age
    - currency_cut
    ladder:
    - when: more than 90 calendar days from the ordering visit's completed_date to the reissue date
      value: K('currency_cut_late')
    - when: 46 to 90 calendar days from the ordering visit's completed_date to the reissue date
      value: K('currency_cut_mid')
    - when: otherwise (45 or fewer days)
      value: '0'
    baseline:
      currency_cut: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: visit
  - id: fasting_reserve_days
    effect: parameter
    decides: fasting_reserve
    bindings:
    - drawn_lines
    - fasting_reserve
    ladder:
    - when: the panel needs 8 or more fasting hours and a patient service center draw fee stands on the order
      value: K('fasting_reserve_drawn')
    - when: the panel needs 8 or more fasting hours and no patient service center draw fee stands on the order
      value: K('fasting_reserve_other')
    - when: otherwise
      value: '0'
    baseline:
      fasting_reserve: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: dedicated_clinician_extension
    effect: parameter
    decides: clinician_extension
    bindings:
    - member_tier
    - member_clinician
    - clinician_extension
    ladder:
    - when: the patient's membership is a Larkspur Premier Annual membership with a primary clinician assigned
      value: K('clinician_extension_premier')
    - when: the patient's membership is a Larkspur Plus Monthly or Larkspur Plus Annual membership with a primary clinician assigned
      value: K('clinician_extension_plus')
    - when: otherwise
      value: '0'
    baseline:
      clinician_extension: '0'
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: order_urgency_cut
    effect: parameter
    decides: urgency_cut
    bindings:
    - visit_kind
    - urgency_cut
    ladder:
    - when: the ordering visit is an Urgent Care Video Visit
      value: K('urgency_cut_urgent')
    - when: the ordering visit is an Asynchronous Message Consult
      value: K('urgency_cut_async')
    - when: the ordering visit is a Primary Care Follow-Up Visit
      value: K('urgency_cut_follow_up')
    - when: otherwise
      value: '0'
    baseline:
      urgency_cut: '0'
    evidence:
    - cross_category
    cross_difficulty: visit
  - id: carried_over_days
    effect: method
    decides: carried_days
    bindings:
    - remaining
    - carried_days
    ladder:
    - when: 7 or fewer calendar days left on the old requisition
      method: all the days left (never below 0) are added to the reissued validity
    - when: 8 to 14 calendar days left on the old requisition
      method: half the days left, rounded down to a whole day, are added to the reissued validity
    - when: otherwise
      method: no days are carried over
    baseline:
      carried_days: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The reissued validity is worked out in whole calendar days. As standard, the reissued validity is the panel's requisition_validity_days; every number of days that applies to the reissued validity is added to it or taken from it once, the reissued validity is never below 14 days before the carried-over days are added, and the carried-over days are added last.
    params:
    - requisition_validity_days
    - minimum_validity_days
  inputs:
    history:
    - table: lab_charges
      aggregate: count
      field: lab_charge_id
      filters:
        event_type: lab_collection_fee_charged
        pricing_basis: psc_draw_fee
    cross_category:
    - membership
    - visit
- id: lab_ext_home_phlebotomy_switch_charge
  base_policy_refs:
  - lab_evt_collection_fees
  - lab_ordering_eligibility
  overwrite:
  - base_policy: lab_evt_collection_fees
    superseded_clause: An at-home kit carries the at_home_kit_fee and mobile phlebotomy the mobile_phlebotomy_fee on every path in collection_fee_paths, except that neither is charged to a patient whose membership tier is in collection_fee_waived_membership_tiers, nor on the sponsor_plan path of a plan in kit_fee_waived_sponsor_plans.
    replaced_by: For a switch from a patient service center draw to mobile phlebotomy on an order that is not on the sponsor_plan path, the mobile phlebotomy fee is the home-visit charge this rule states; for a switch from a patient service center draw to an at-home kit on such an order the kit fee is the switch charge Larkspur Health publishes for that switch; in every other case an at-home kit carries the at_home_kit_fee and mobile phlebotomy the mobile_phlebotomy_fee on every path in collection_fee_paths, except that neither is charged to a patient whose membership tier is in collection_fee_waived_membership_tiers, nor on the sponsor_plan path of a plan in kit_fee_waived_sponsor_plans.
  - base_policy: lab_evt_collection_fees
    superseded_clause: when the method changes before collection, the old method's fee is refunded in full unless a kit has already shipped, and the new method's fee is charged on the change date.
    replaced_by: On a switch from a patient service center draw to mobile phlebotomy the draw fee standing on the order is not refunded; it enters the home-visit charge as the prior draw credit this rule states, and the home-visit line is the only line written on the change date; on a switch from a patient service center draw to an at-home kit the draw fee is likewise not refunded and enters the switch charge as its credit; on every other method change the old method's fee is refunded in full unless a kit has already shipped, and the new method's fee is charged on the change date.
  trigger: on_request
  subject:
  - lab_collection_method_changed
  - lab_collection_fee_charged
  computes: home_visit_charge
  target_tool: switch_order_to_home_phlebotomy_06c13f87
  params:
    booking_lead_days: 2
    early_slot_long: 15.0
    early_slot_short: 8.0
    zone_metro: 10.0
    zone_standard: 5.0
    notice_short: 25.0
    notice_mid: 10.0
    notice_short_days: 14
    notice_mid_days: 60
    draw_credit_full_days: 45
    draw_credit_partial_days: 90
    reservation_charge: 2.0
    centrifuge_charge: 6.0
    urine_transport_charge: 3.0
    paperwork_near: 4.0
    paperwork_far: 2.0
  rule: 'This rule prices the patient''s own switch of an order whose status is ordered from a patient service center draw to mobile phlebotomy, when the order is not on the sponsor_plan path; the patient chooses the switch and confirms the home-visit charge herself or himself. The home-visit charge for an order whose requisition expires within 14 days of the switch date is not fixed until the order''s requisition carries a reissue. The home-visit charge is one mobile phlebotomy line posted on the change date. As standard, the home-visit charge is the panel''s mobile_phlebotomy_fee, waived when the patient''s membership is a Larkspur Premier Annual membership whose status is trialing, active or past_due; every amount that applies to the home-visit charge is added to it or taken from it once in a single sum, the sum is never below 0.00, and it is rounded half up to the cent once, at the end. For a switch from a patient service center draw to mobile phlebotomy on an order that is not on the sponsor_plan path, the mobile phlebotomy fee is the home-visit charge this rule states; for a switch from a patient service center draw to an at-home kit on such an order the kit fee is the switch charge Larkspur Health publishes for that switch; in every other case an at-home kit carries the at_home_kit_fee and mobile phlebotomy the mobile_phlebotomy_fee on every path in collection_fee_paths, except that neither is charged to a patient whose membership tier is in collection_fee_waived_membership_tiers, nor on the sponsor_plan path of a plan in kit_fee_waived_sponsor_plans. The early-morning slot charge added to the home-visit charge follows the panel''s fasting_hours and the calendar days left to book: the long fasting slot charge when the panel needs 8 or more fasting hours and at least 2 calendar days remain to the requisition_expiry_date; the short fasting slot charge when the panel needs 1 to 7 fasting hours and at least 2 calendar days remain to the requisition_expiry_date; and 0.00 otherwise. The home-visit zone charge added to the home-visit charge follows the state the patient gave at the ordering visit: the metro zone charge for New York, New Jersey or Massachusetts; the standard zone charge for Connecticut, Illinois, Maryland, Pennsylvania or Virginia; and 0.00 otherwise. The dispatch notice charge added to the home-visit charge follows the calendar days from the change date to the requisition_expiry_date: the short-notice charge when 14 or fewer days remain; the mid-notice charge when 15 to 60 days remain; and 0.00 when more than 60 days remain. The draw fee standing on the order is its patient service center draw fee lines less the billing_error refunds booked on the order. The prior draw credit taken from the home-visit charge follows the calendar days from the latest charge_date of the patient service center draw fee lines to the change date: the draw fee standing on the order when 45 or fewer days have passed; the draw fee standing on the order less the partner service center reservation charge, never below 0.00, when 46 to 90 days have passed; and nothing otherwise. The serum handling charge added to the home-visit charge follows the panel''s specimen and the mobile phlebotomy fee standing on the order: the portable centrifuge charge when the panel''s specimen is venous blood and no mobile phlebotomy fee stands on the order; the urine transport charge when the panel''s specimen is urine, swab and blood and no mobile phlebotomy fee stands on the order; and 0.00 otherwise. The mobile phlebotomy fee standing on the order is its mobile phlebotomy fee lines less the cancelled_before_collection refunds booked on the order. The requisition paperwork charge added to the home-visit charge follows the order''s reissue_count and the calendar days left on the requisition: the near paperwork charge when the requisition carries a reissue and 60 or fewer days remain to its requisition_expiry_date; the far paperwork charge when the requisition
    carries a reissue and more than 60 days remain; and 0.00 otherwise. On a switch from a patient service center draw to mobile phlebotomy the draw fee standing on the order is not refunded; it enters the home-visit charge as the prior draw credit this rule states, and the home-visit line is the only line written on the change date; on a switch from a patient service center draw to an at-home kit the draw fee is likewise not refunded and enters the switch charge as its credit; on every other method change the old method''s fee is refunded in full unless a kit has already shipped, and the new method''s fee is charged on the change date. The order''s collection method becomes mobile_phlebotomy, and no line is written for a 0.00 home-visit charge.'
  prerequisite:
  - problem: lab_ext_requisition_reissue_validity
    kind: value_input
    gate: days_left
    form: state
    policy_source: The home-visit charge for an order whose requisition expires within 14 days of the switch date is not fixed until the order's requisition carries a reissue.
    condition: lab_orders.reissue_count is at least 1 for an order whose requisition_expiry_date was within 14 days of the switch date.
    resolved_by: reissue_requisition_d14f4a64
    effect: Once the requisition is reissued, the requisition_expiry_date moves out and the reissue_count becomes 1, so the dispatch notice tier and the requisition paperwork tier are read from the reissued requisition.
  cross_category:
  - category: membership
    as: branch
    reads:
    - variant_name
    - status
    note: The plain Premier waiver of the mobile phlebotomy fee reads the patient's membership tier and status.
  - category: visit
    as: branch
    reads:
    - patient_location_state
    note: The home-visit zone factor reads the state the patient gave at the ordering visit.
  compute:
  - mob_tier: CFIELD('membership', 'variant_name')
  - mob_status: CFIELD('membership', 'status')
  - mobile_fee_due: 0.0 if (mob_tier == 'Larkspur Premier Annual' and (mob_status == 'trialing' or mob_status == 'active' or mob_status == 'past_due')) else P('mobile_phlebotomy_fee')
  - fasting: P('fasting_hours')
  - specimen: P('specimen_type')
  - slot_window: DAYS(NOW, F('requisition_expiry_date'))
  - early_slot: K('early_slot_long') if (fasting >= 8 and slot_window >= K('booking_lead_days')) else (K('early_slot_short') if (fasting >= 1 and slot_window >= K('booking_lead_days')) else 0.0)
  - visit_state: CFIELD('visit', 'patient_location_state', visit_id=F('ordering_visit_id'))
  - home_zone: K('zone_metro') if (visit_state == 'NY' or visit_state == 'NJ' or visit_state == 'MA') else (K('zone_standard') if (visit_state == 'CT' or visit_state == 'IL' or visit_state == 'MD' or visit_state == 'PA' or visit_state == 'VA') else 0.0)
  - days_left: DAYS(NOW, F('requisition_expiry_date'))
  - dispatch_notice: K('notice_short') if days_left <= K('notice_short_days') else (K('notice_mid') if days_left <= K('notice_mid_days') else 0.0)
  - draw_standing: SUM('lab_charges', 'amount', event_type='lab_collection_fee_charged', pricing_basis='psc_draw_fee') + SUM('lab_charges', 'amount', event_type='lab_charge_refunded', refund_reason='billing_error')
  - draw_date: LATEST('lab_charges', 'charge_date', date_field='charge_date', event_type='lab_collection_fee_charged', pricing_basis='psc_draw_fee')
  - draw_age: DAYS(draw_date or NOW, NOW)
  - draw_credit: draw_standing if (draw_age <= K('draw_credit_full_days') and draw_standing > 0) else (MX(0.0, draw_standing - K('reservation_charge')) if (draw_age <= K('draw_credit_partial_days') and draw_standing > 0) else 0.0)
  - mobile_lines: SUM('lab_charges', 'amount', event_type='lab_collection_fee_charged', pricing_basis='mobile_phlebotomy_fee') + SUM('lab_charges', 'amount', event_type='lab_charge_refunded', refund_reason='cancelled_before_collection')
  - serum_handling: K('centrifuge_charge') if (specimen == 'venous_blood' and mobile_lines <= 0) else (K('urine_transport_charge') if (specimen == 'urine_swab_and_blood' and mobile_lines <= 0) else 0.0)
  - paper_window: DAYS(NOW, F('requisition_expiry_date'))
  - paperwork: K('paperwork_near') if (F('reissue_count') >= 1 and paper_window <= K('notice_mid_days')) else (K('paperwork_far') if (F('reissue_count') >= 1 and paper_window > K('notice_mid_days')) else 0.0)
  - result: RND(MX(0.0, mobile_fee_due + early_slot + home_zone + dispatch_notice - draw_credit + serum_handling + paperwork) + 0.000000001, 2)
  compute_basis:
    mob_tier: waived when the patient's membership is a Larkspur Premier Annual membership whose status is trialing, active or past_due
    mob_status: waived when the patient's membership is a Larkspur Premier Annual membership whose status is trialing, active or past_due
    mobile_fee_due: As standard, the home-visit charge is the panel's mobile_phlebotomy_fee, waived when the patient's membership is a Larkspur Premier Annual membership whose status is trialing, active or past_due
    slot_window: at least 2 calendar days remain to the requisition_expiry_date
    early_slot: the long fasting slot charge when the panel needs 8 or more fasting hours and at least 2 calendar days remain to the requisition_expiry_date; the short fasting slot charge when the panel needs 1 to 7 fasting hours and at least 2 calendar days remain to the requisition_expiry_date; and 0.00 otherwise.
    visit_state: The home-visit zone charge added to the home-visit charge follows the state the patient gave at the ordering visit
    home_zone: the metro zone charge for New York, New Jersey or Massachusetts; the standard zone charge for Connecticut, Illinois, Maryland, Pennsylvania or Virginia; and 0.00 otherwise.
    days_left: The dispatch notice charge added to the home-visit charge follows the calendar days from the change date to the requisition_expiry_date
    dispatch_notice: the short-notice charge when 14 or fewer days remain; the mid-notice charge when 15 to 60 days remain; and 0.00 when more than 60 days remain.
    draw_standing: The draw fee standing on the order is its patient service center draw fee lines less the billing_error refunds booked on the order.
    draw_date: follows the calendar days from the latest charge_date of the patient service center draw fee lines to the change date
    draw_age: follows the calendar days from the latest charge_date of the patient service center draw fee lines to the change date
    draw_credit: the draw fee standing on the order when 45 or fewer days have passed; the draw fee standing on the order less the partner service center reservation charge, never below 0.00, when 46 to 90 days have passed; and nothing otherwise.
    mobile_lines: The mobile phlebotomy fee standing on the order is its mobile phlebotomy fee lines less the cancelled_before_collection refunds booked on the order.
    serum_handling: the portable centrifuge charge when the panel's specimen is venous blood and no mobile phlebotomy fee stands on the order; the urine transport charge when the panel's specimen is urine, swab and blood and no mobile phlebotomy fee stands on the order; and 0.00 otherwise.
    paper_window: The requisition paperwork charge added to the home-visit charge follows the order's reissue_count and the calendar days left on the requisition
    paperwork: the near paperwork charge when the requisition carries a reissue and 60 or fewer days remain to its requisition_expiry_date; the far paperwork charge when the requisition carries a reissue and more than 60 days remain; and 0.00 otherwise.
    result: every amount that applies to the home-visit charge is added to it or taken from it once in a single sum, the sum is never below 0.00, and it is rounded half up to the cent once, at the end.
  factors:
  - id: fasting_slot_premium
    effect: parameter
    decides: early_slot
    bindings:
    - slot_window
    - early_slot
    ladder:
    - when: the panel needs 8 or more fasting hours and at least 2 calendar days remain to the requisition_expiry_date
      value: K('early_slot_long')
    - when: the panel needs 1 to 7 fasting hours and at least 2 calendar days remain to the requisition_expiry_date
      value: K('early_slot_short')
    - when: otherwise
      value: '0.00'
    baseline:
      early_slot: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: home_visit_zone
    effect: parameter
    decides: home_zone
    bindings:
    - visit_state
    - home_zone
    ladder:
    - when: the patient gave New York, New Jersey or Massachusetts at the ordering visit
      value: K('zone_metro')
    - when: the patient gave Connecticut, Illinois, Maryland, Pennsylvania or Virginia at the ordering visit
      value: K('zone_standard')
    - when: otherwise
      value: '0.00'
    baseline:
      home_zone: '0.0'
    evidence:
    - cross_category
    cross_difficulty: visit
  - id: dispatch_notice_tier
    effect: parameter
    decides: dispatch_notice
    bindings:
    - days_left
    - dispatch_notice
    ladder:
    - when: 14 or fewer calendar days from the change date to the requisition_expiry_date
      value: K('notice_short')
    - when: 15 to 60 calendar days from the change date to the requisition_expiry_date
      value: K('notice_mid')
    - when: otherwise (more than 60 days)
      value: '0.00'
    baseline:
      dispatch_notice: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: prior_draw_credit
    effect: method
    decides: draw_credit
    bindings:
    - draw_standing
    - draw_date
    - draw_age
    - draw_credit
    ladder:
    - when: 45 or fewer calendar days from the latest draw fee line's charge_date to the change date
      method: the draw fee standing on the order is taken from the home-visit charge
    - when: 46 to 90 calendar days from the latest draw fee line's charge_date to the change date
      method: the draw fee standing on the order less the partner service center reservation charge, never below 0.00, is taken from the home-visit charge
    - when: otherwise
      method: nothing is taken from the home-visit charge
    baseline:
      draw_credit: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: serum_handling_charge
    effect: parameter
    decides: serum_handling
    bindings:
    - mobile_lines
    - serum_handling
    ladder:
    - when: the panel's specimen is venous blood and no mobile phlebotomy fee stands on the order
      value: K('centrifuge_charge')
    - when: the panel's specimen is urine, swab and blood and no mobile phlebotomy fee stands on the order
      value: K('urine_transport_charge')
    - when: otherwise
      value: '0.00'
    baseline:
      serum_handling: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: requisition_paperwork
    effect: parameter
    decides: paperwork
    bindings:
    - paper_window
    - paperwork
    ladder:
    - when: the requisition carries a reissue and 60 or fewer calendar days remain to its requisition_expiry_date
      value: K('paperwork_near')
    - when: the requisition carries a reissue and more than 60 calendar days remain
      value: K('paperwork_far')
    - when: otherwise
      value: '0.00'
    baseline:
      paperwork: '0.0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The home-visit charge is one mobile phlebotomy line posted on the change date. As standard, the home-visit charge is the panel's mobile_phlebotomy_fee, waived when the patient's membership is a Larkspur Premier Annual membership whose status is trialing, active or past_due; every amount that applies to the home-visit charge is added to it or taken from it once in a single sum, the sum is never below 0.00, and it is rounded half up to the cent once, at the end.
    params:
    - mobile_phlebotomy_fee
  inputs:
    history:
    - table: lab_charges
      aggregate: sum
      field: amount
      filters:
        event_type: lab_collection_fee_charged
        pricing_basis: psc_draw_fee
    - table: lab_charges
      aggregate: count
      field: lab_charge_id
      filters:
        event_type: lab_collection_fee_charged
        pricing_basis: mobile_phlebotomy_fee
    cross_category:
    - membership
    - visit
