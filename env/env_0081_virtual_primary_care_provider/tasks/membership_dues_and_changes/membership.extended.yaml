    cross_difficulty: visit
  - id: billing_error_exclusion
    effect: parameter
    decides: cash_returned
    bindings: [billing_error_refunds, cash_returned]
    ladder:
    - when: billing-error refunds pointing to the current period's line total its whole amount or more
      value: the line's whole amount
    - when: they total less than the line's amount but more than 0.00
      value: their total
    - when: otherwise (none)
      value: '0'
    baseline:
      cash_returned: '0'
    evidence: [history]
    cross_difficulty: null
  - id: applied_credit_exclusion
    effect: parameter
    decides: credit_excluded
    bindings: [credit_on_line, credit_excluded]
    ladder:
    - when: account credit applied to the current period's line covers its whole amount or more
      value: the line's whole amount
    - when: applied credit covers less than the line's amount but more than 0.00
      value: the applied credit
    - when: otherwise (no credit applied)
      value: '0'
    baseline:
      credit_excluded: '0'
    evidence: [history]
    cross_difficulty: null
  - id: urgent_care_benefit_recapture
    effect: parameter
    decides: urgent_care_recapture
    bindings: [urgent_care_taken, urgent_care_list, urgent_care_recapture]
    ladder:
    - when: two or more membership-included Urgent Care Video Visits were completed in the month before the request date
      value: twice the Urgent Care Video Visit list_price
    - when: exactly one such visit was completed in that month
      value: the Urgent Care Video Visit list_price
    - when: otherwise
      value: '0'
    baseline:
      urgent_care_recapture: '0'
    evidence: [history, cross_category]
    cross_difficulty: visit
  - id: lab_benefit_recapture
    effect: parameter
    decides: lab_recapture
    bindings: [member_panels_taken, lab_recapture]
    ladder:
    - when: two or more reviewed membership-included lab orders of this membership were ordered in the month before the request date
      value: 2 * K('lab_panel_recapture')
    - when: exactly one such order was placed in that month
      value: K('lab_panel_recapture')
    - when: otherwise
      value: '0'
    baseline:
      lab_recapture: '0'
    evidence: [history, cross_category]
    cross_difficulty: lab
  - id: pharmacy_benefit_recapture
    effect: parameter
    decides: pharmacy_recapture
    bindings: [member_fill_charges, pharmacy_recapture]
    ladder:
    - when: two or more fill charges at the member cash price were posted in the month before the request date
      value: 2 * K('rx_fill_recapture')
    - when: exactly one such fill charge was posted in that month
      value: K('rx_fill_recapture')
    - when: otherwise
      value: '0'
    baseline:
      pharmacy_recapture: '0'
    evidence: [history, cross_category]
    cross_difficulty: rx
  baseline:
    rule: The current period's line is the membership_upgrade_proration_charged line of this membership whose period_start equals current_period_start, or, when there is none, the membership_dues_charged line whose period_start equals current_period_start. The cancellation refund is the refund basis amount, capped at the cash collected on the current period's line, then reduced by every amount the rules below subtract, never below 0.00, rounded half up to the cent after the full computation. The cash collected on the current period's line is the line's amount less every part of it that the rules below exclude from a cash refund. By the standard method the refund basis amount is the whole unused months multiplied by the tier's proration_monthly_rate, where whole unused months is the number of calendar months from the request date to current_period_end, less one when the day number of current_period_end is smaller than the day number of the request date.
    params: [proration_monthly_rate]
  inputs:
    history:
    - {table: membership_charges, aggregate: latest, field: amount, filters: {event_type: membership_dues_charged}}
    - {table: membership_charges, aggregate: sum, field: amount, filters: {event_type: membership_dues_refunded, refund_reason: billing_error}}
    - {table: membership_credits, aggregate: sum, field: amount, filters: {event_type: membership_credit_applied}}
    - {table: membership_notices, aggregate: count, field: mem_notice_id, filters: {event_type: membership_renewal_notice_sent}}
    - {category: visit, table: visit_appointments, aggregate: latest, field: scheduled_start, filters: {status: completed}}
    - {category: visit, table: visit_appointments, aggregate: count, field: visit_id, within_months: 1, filters: {status: completed, payment_path: membership_included, variant_name: Urgent Care Video Visit}}
    - {category: lab, table: lab_orders, aggregate: count, field: lab_order_id, within_months: 1, filters: {status: reviewed, payment_path: membership_included}}
    - {category: rx, table: rx_charges, aggregate: count, field: rx_charge_id, within_months: 1, filters: {event_type: rx_fill_charged, price_basis: cash_member_price}}
    cross_category: [visit, lab, rx, sponsor]
- id: membership_ext_goodwill_credit
  base_policy_refs:
  - membership_evt_credits
  overwrite:
  - base_policy: membership_evt_credits
    superseded_clause: A goodwill credit of goodwill_credit_per_provider_cancellation compensates one visit that Larkspur
      cancelled.
    replaced_by: A goodwill credit compensates one visit that Larkspur cancelled, and by the standard method it is the
      goodwill_credit_per_provider_cancellation of the tier the membership holds on the credit date.
  - base_policy: membership_evt_credits
    superseded_clause: The goodwill credit is reduced to the room left when membership_msr_goodwill_year plus the credit
      would exceed goodwill_credit_cap_per_membership_year, and nothing is issued when no room is left.
    replaced_by: The goodwill credit is reduced to the room left under goodwill_credit_cap_per_membership_year, the room
      being that cap less the goodwill credits issued to this membership in the twelve months before the credit date,
      never below 0.00, and nothing is issued when no room is left
  - base_policy: membership_evt_credits
    superseded_clause: Annual caps reset at each membership_year_start under membership_year_basis.
    replaced_by: The goodwill cap and the referral cap are counted over the twelve months before the credit date rather
      than over the membership year.
  - base_policy: membership_evt_credits
    superseded_clause: A goodwill credit may be issued only for a visit appointment of the member whose status is provider_cancelled.
    replaced_by: A goodwill credit may be issued only for a visit appointment of the member whose status is
      provider_cancelled, the visit the credit line names.
  - base_policy: membership_evt_credits
    superseded_clause: A referral credit may be issued only when no referral credit already exists for the same referred
      patient.
    replaced_by: The one-credit-per-referred-patient limit belongs to referral credits and never governs a goodwill
      credit.
  trigger: state_due
  subject:
  - membership_credit_issued
  computes: credit_amount
  target_tool: issue_goodwill_credit_9ab1aff0
  params:
    same_day_notice: 10.0
    long_visit: 10.0
    mid_visit: 5.0
    twice_moved: 10.0
    once_moved: 5.0
    self_pay_visit: 10.0
    member_rate_visit: 5.0
    rx_two_weeks: 10.0
    rx_month: 5.0
    own_clinician: 3.0
    other_clinician: 1.0
  rule: >-
    A goodwill credit compensates one visit that Larkspur cancelled, and by the standard method it is the
    goodwill_credit_per_provider_cancellation of the tier the membership holds on the credit date. A goodwill credit may
    be issued only for a visit appointment of the member whose status is provider_cancelled, the visit the credit line
    names. The visit compensated is the patient's visit appointment with status provider_cancelled that has the latest
    scheduled_start. The goodwill credit is the standard amount plus every addition the rules below grant, then reduced
    to the room left, rounded half up to the cent. The goodwill credit is reduced to the room left under
    goodwill_credit_cap_per_membership_year, the room being that cap less the goodwill credits issued to this membership
    in the twelve months before the credit date, never below 0.00, and nothing is issued when no room is left; a record
    counts as dated in those twelve months when its date is not after the credit date and adding twelve calendar months
    to it, keeping the day number and treating a day number the later month lacks as falling after that month's last
    day, gives a date after the credit date. The goodwill cap and the referral cap are counted over the twelve months
    before the credit date rather than over the membership year. The notice Larkspur gave decides an addition: when
    Larkspur ended the visit at or after its scheduled_start, the standard amount is added a second time; when Larkspur
    cancelled it earlier on the calendar day of its scheduled_start, same_day_notice is added; otherwise nothing is added
    for notice. The length of the visit lost decides an addition: when the visit type's duration_minutes is 45 or more,
    long_visit is added; when it is from 20 to 44, mid_visit is added; otherwise nothing is added for length. A visit already rescheduled before
    Larkspur cancelled it decides an addition: when the visit's reschedule_count is 2 or more, twice_moved is added;
    when it is 1, once_moved is added; otherwise nothing is added for rescheduling. The way the visit was paid decides an
    addition: when its payment_path is self_pay, self_pay_visit is added; when it is member_rate, member_rate_visit is
    added; otherwise nothing is added for payment. A prescription running out decides an addition: when the patient's
    prescription with status active has an expiration_date from 0 to 14 calendar days after the credit date,
    rx_two_weeks is added; when it is from 15 to 30 calendar days after, rx_month is added; otherwise nothing is added
    for the prescription. The clinician who cancelled decides an addition: when the membership has a primary_clinician
    and the visit's clinician_name is that clinician, own_clinician is added; when the membership has a
    primary_clinician and the visit was with another clinician, other_clinician is added; otherwise nothing is added for
    the clinician. The one-credit-per-referred-patient limit belongs to referral credits and never governs a goodwill
    credit.
  prerequisite: []
  cross_category:
  - category: visit
    as: history
    reads: [visit_appointments.status, visit_appointments.scheduled_start, visit_appointments.cancelled_at, visit_appointments.reschedule_count, visit_appointments.payment_path, visit_appointments.clinician_name, visit_appointments.variant_name, duration_minutes]
    note: decides the notice, length, rescheduling, payment and clinician additions from the latest Larkspur-cancelled visit.
  - category: rx
    as: branch
    reads: [expiration_date]
    note: decides the prescription addition from the active prescription's expiration_date.
  compute:
  - visit_type_lost: XLATEST('visit','visit_appointments','variant_name', date_field='scheduled_start', status='provider_cancelled')
  - visit_start_lost: XLATEST('visit','visit_appointments','scheduled_start', date_field='scheduled_start', status='provider_cancelled')
  - visit_cancel_moment: XLATEST('visit','visit_appointments','cancelled_at', date_field='scheduled_start', status='provider_cancelled')
  - visit_moves: XLATEST('visit','visit_appointments','reschedule_count', date_field='scheduled_start', status='provider_cancelled')
  - visit_path_lost: XLATEST('visit','visit_appointments','payment_path', date_field='scheduled_start', status='provider_cancelled')
  - visit_clinician_lost: XLATEST('visit','visit_appointments','clinician_name', date_field='scheduled_start', status='provider_cancelled')
  - standard_goodwill: P('goodwill_credit_per_provider_cancellation')
  - notice_addition: standard_goodwill if (visit_cancel_moment >= visit_start_lost) else (K('same_day_notice') if (DAYS(visit_cancel_moment, visit_start_lost) == 0 and visit_cancel_moment < visit_start_lost) else 0)
  - visit_minutes_lost: CPARAM('visit','duration_minutes', variant_name=visit_type_lost)
  - length_addition: K('long_visit') if visit_minutes_lost >= 45 else (K('mid_visit') if visit_minutes_lost >= 20 else 0)
  - moved_addition: K('twice_moved') if visit_moves >= 2 else (K('once_moved') if visit_moves == 1 else 0)
  - payment_addition: K('self_pay_visit') if visit_path_lost == 'self_pay' else (K('member_rate_visit') if visit_path_lost == 'member_rate' else 0)
  - active_rx_expiry: CFIELD('rx','expiration_date', status='active')
  - prescription_addition: K('rx_two_weeks') if (active_rx_expiry != None and DAYS(NOW, active_rx_expiry) >= 0 and DAYS(NOW, active_rx_expiry) <= 14) else (K('rx_month') if (active_rx_expiry != None and DAYS(NOW, active_rx_expiry) >= 15 and DAYS(NOW, active_rx_expiry) <= 30) else 0)
  - clinician_addition: K('own_clinician') if (F('primary_clinician') and visit_clinician_lost == F('primary_clinician')) else (K('other_clinician') if (F('primary_clinician') and visit_clinician_lost != F('primary_clinician')) else 0)
  - goodwill_last_year: SUM('membership_credits','amount', within_months=12, date_field='credit_date', event_type='membership_credit_issued', credit_reason='goodwill')
  - goodwill_room: MX(0, P('goodwill_credit_cap_per_membership_year') - goodwill_last_year)
  - result: RND(MN(goodwill_room, standard_goodwill + notice_addition + length_addition + moved_addition + payment_addition + prescription_addition + clinician_addition) + 0.000000001, 2)
  compute_basis:
    visit_type_lost: The visit compensated is the patient's visit appointment with status provider_cancelled that has the latest scheduled_start.
    visit_start_lost: The visit compensated is the patient's visit appointment with status provider_cancelled that has the latest scheduled_start.
    visit_cancel_moment: The visit compensated is the patient's visit appointment with status provider_cancelled that has the latest scheduled_start.
    visit_moves: The visit compensated is the patient's visit appointment with status provider_cancelled that has the latest scheduled_start.
    visit_path_lost: The visit compensated is the patient's visit appointment with status provider_cancelled that has the latest scheduled_start.
    visit_clinician_lost: The visit compensated is the patient's visit appointment with status provider_cancelled that has the latest scheduled_start.
    standard_goodwill: A goodwill credit compensates one visit that Larkspur cancelled, and by the standard method it is the goodwill_credit_per_provider_cancellation of the tier the membership holds on the credit date.
    notice_addition: 'The notice Larkspur gave decides an addition: when Larkspur ended the visit at or after its scheduled_start, the standard amount is added a second time; when Larkspur cancelled it earlier on the calendar day of its scheduled_start, same_day_notice is added; otherwise nothing is added for notice.'
    visit_minutes_lost: 'The length of the visit lost decides an addition: when the visit type''s duration_minutes is 45 or more, long_visit is added; when it is from 20 to 44, mid_visit is added; otherwise nothing is added for length.'
    length_addition: 'The length of the visit lost decides an addition: when the visit type''s duration_minutes is 45 or more, long_visit is added; when it is from 20 to 44, mid_visit is added; otherwise nothing is added for length.'
    moved_addition: 'A visit already rescheduled before Larkspur cancelled it decides an addition: when the visit''s reschedule_count is 2 or more, twice_moved is added; when it is 1, once_moved is added; otherwise nothing is added for rescheduling.'
    payment_addition: 'The way the visit was paid decides an addition: when its payment_path is self_pay, self_pay_visit is added; when it is member_rate, member_rate_visit is added; otherwise nothing is added for payment.'
    active_rx_expiry: 'A prescription running out decides an addition: when the patient''s prescription with status active has an expiration_date from 0 to 14 calendar days after the credit date, rx_two_weeks is added; when it is from 15 to 30 calendar days after, rx_month is added; otherwise nothing is added for the prescription.'
    prescription_addition: 'A prescription running out decides an addition: when the patient''s prescription with status active has an expiration_date from 0 to 14 calendar days after the credit date, rx_two_weeks is added; when it is from 15 to 30 calendar days after, rx_month is added; otherwise nothing is added for the prescription.'
    clinician_addition: 'The clinician who cancelled decides an addition: when the membership has a primary_clinician and the visit''s clinician_name is that clinician, own_clinician is added; when the membership has a primary_clinician and the visit was with another clinician, other_clinician is added; otherwise nothing is added for the clinician.'
    goodwill_last_year: The goodwill credit is reduced to the room left under goodwill_credit_cap_per_membership_year, the room being that cap less the goodwill credits issued to this membership in the twelve months before the credit date, never below 0.00, and nothing is issued when no room is left; a record counts as dated in those twelve months when its date is not after the credit date and adding twelve calendar months to it, keeping the day number and treating a day number the later month lacks as falling after that month's last day, gives a date after the credit date.
    goodwill_room: The goodwill credit is reduced to the room left under goodwill_credit_cap_per_membership_year, the room being that cap less the goodwill credits issued to this membership in the twelve months before the credit date, never below 0.00, and nothing is issued when no room is left; a record counts as dated in those twelve months when its date is not after the credit date and adding twelve calendar months to it, keeping the day number and treating a day number the later month lacks as falling after that month's last day, gives a date after the credit date.
    result: The goodwill credit is the standard amount plus every addition the rules below grant, then reduced to the room left, rounded half up to the cent.
  factors:
  - id: notice_given
    effect: method
    decides: notice_addition
    bindings: [visit_start_lost, visit_cancel_moment, notice_addition]
    ladder:
    - when: Larkspur ended the visit at or after its scheduled_start
      method: the standard amount is added a second time (the credit doubles)
    - when: Larkspur cancelled it earlier on the calendar day of its scheduled_start
      method: the fixed same_day_notice is added
    - when: otherwise
      method: nothing is added
    baseline:
      notice_addition: '0'
    evidence: [date, cross_category]
    cross_difficulty: visit
  - id: visit_length
    effect: parameter
    decides: length_addition
    bindings: [visit_type_lost, visit_minutes_lost, length_addition]
    ladder:
    - when: the visit type's duration_minutes is 45 or more
      value: K('long_visit')
    - when: it is from 20 to 44
      value: K('mid_visit')
    - when: otherwise
      value: '0'
    baseline:
      length_addition: '0'
    evidence: [cross_category]
    cross_difficulty: visit
  - id: prior_moves
    effect: parameter
    decides: moved_addition
    bindings: [visit_moves, moved_addition]
    ladder:
    - when: the visit's reschedule_count is 2 or more
      value: K('twice_moved')
    - when: it is 1
      value: K('once_moved')
    - when: otherwise
      value: '0'
    baseline:
      moved_addition: '0'
    evidence: [cross_category]
    cross_difficulty: visit
  - id: payment_way
    effect: parameter
    decides: payment_addition
    bindings: [visit_path_lost, payment_addition]
    ladder:
    - when: the visit's payment_path is self_pay
      value: K('self_pay_visit')
    - when: it is member_rate
      value: K('member_rate_visit')
    - when: otherwise
      value: '0'
    baseline:
      payment_addition: '0'
    evidence: [cross_category]
    cross_difficulty: visit
  - id: rx_running_out
    effect: parameter
    decides: prescription_addition
    bindings: [active_rx_expiry, prescription_addition]
    ladder:
    - when: the active prescription's expiration_date is 0 to 14 calendar days after the credit date
      value: K('rx_two_weeks')
    - when: it is 15 to 30 calendar days after
      value: K('rx_month')
    - when: otherwise
      value: '0'
    baseline:
      prescription_addition: '0'
    evidence: [date, cross_category]
    cross_difficulty: rx
  - id: cancelling_clinician
    effect: parameter
    decides: clinician_addition
    bindings: [visit_clinician_lost, clinician_addition]
    ladder:
    - when: the membership has a primary_clinician and the visit was with that clinician
      value: K('own_clinician')
    - when: the membership has a primary_clinician and the visit was with another clinician
      value: K('other_clinician')
    - when: otherwise
      value: '0'
    baseline:
      clinician_addition: '0'
    evidence: [cross_category]
    cross_difficulty: visit
  baseline:
    rule: A goodwill credit compensates one visit that Larkspur cancelled, and by the standard method it is the goodwill_credit_per_provider_cancellation of the tier the membership holds on the credit date. The visit compensated is the patient's visit appointment with status provider_cancelled that has the latest scheduled_start. The goodwill credit is the standard amount plus every addition the rules below grant, then reduced to the room left, rounded half up to the cent. The goodwill credit is reduced to the room left under goodwill_credit_cap_per_membership_year, the room being that cap less the goodwill credits issued to this membership in the twelve months before the credit date, never below 0.00, and nothing is issued when no room is left; a record counts as dated in those twelve months when its date is not after the credit date and adding twelve calendar months to it, keeping the day number and treating a day number the later month lacks as falling after that month's last day, gives a date after the credit date.
    params: [goodwill_credit_per_provider_cancellation, goodwill_credit_cap_per_membership_year]
  inputs:
    history:
    - {table: membership_credits, aggregate: sum, field: amount, within_months: 12, filters: {event_type: membership_credit_issued, credit_reason: goodwill}}
    - {category: visit, table: visit_appointments, aggregate: latest, field: scheduled_start, filters: {status: provider_cancelled}}
    cross_category: [visit, rx]
- id: membership_ext_referral_credit
  base_policy_refs:
  - membership_evt_credits
  overwrite:
  - base_policy: membership_evt_credits
    superseded_clause: A referral credit of the referring membership's referral_credit_amount is issued when a patient
      whose membership names that referrer in referred_by_customer_id has the first dues line of a first paid period
      charged successfully.
    replaced_by: A referral credit is issued to the referring membership when a patient whose membership names that
      referrer in referred_by_customer_id has the first dues line of a first paid period charged successfully, and by
      the standard method it is the referral_credit_amount of the tier the referring membership holds on the credit date.
  - base_policy: membership_evt_credits
    superseded_clause: A referral is refused when membership_msr_referral_credits_year has already reached referral_credits_max_per_membership_year.
    replaced_by: A referral is refused, with nothing issued, when the referral credits issued to this membership in the
      twelve months before the credit date have already reached referral_credits_max_per_membership_year
  - base_policy: membership_evt_credits
    superseded_clause: Annual caps reset at each membership_year_start under membership_year_basis.
    replaced_by: The goodwill cap and the referral cap are counted over the twelve months before the credit date rather
      than over the membership year.
  - base_policy: membership_evt_credits
    superseded_clause: A goodwill credit may be issued only when no goodwill credit already exists for the same visit appointment.
    replaced_by: The one-credit-per-visit limit belongs to goodwill credits and never governs a referral credit.
  trigger: state_due
  subject:
  - membership_credit_issued
  computes: credit_amount
  target_tool: issue_referral_credit_f4907f54
  params:
    second_referral_step: 10.0
    annual_plan_bonus: 10.0
    monthly_plan_bonus: 5.0
    streak_year: 5.0
    streak_two_years: 3.0
    premier_family_bonus: 10.0
    plus_family_bonus: 5.0
    referred_member_bonus: 5.0
    converted_member_bonus: 3.0
  rule: >-
    A referral credit is issued to the referring membership when a patient whose membership names that referrer in
    referred_by_customer_id has the first dues line of a first paid period charged successfully, and by the standard
    method it is the referral_credit_amount of the tier the referring membership holds on the credit date. The referral
    credit is the standard amount plus every addition the referral program below grants, rounded half up to the cent. A
    referral is refused, with nothing issued, when the referral credits issued to this membership in the twelve months
    before the credit date have already reached referral_credits_max_per_membership_year; a record counts as dated in
    those twelve months when its date is not after the credit date and adding twelve calendar months to it, keeping the
    day number and treating a day number the later month lacks as falling after that month's last day, gives a date
    after the credit date. The goodwill cap and the referral cap are counted over the twelve months before the credit
    date rather than over the membership year. The referral program counts milestones: when this membership already
    holds two or more referral credit lines issued, the standard amount is added a second time; when it holds exactly
    one, second_referral_step is added; otherwise nothing is added for milestones. The referral program rewards
    annual billing: when the referring membership's current billing period runs twelve calendar months from
    current_period_start to current_period_end, annual_plan_bonus is added; when it runs one calendar month,
    monthly_plan_bonus is added; otherwise nothing is added for the billing cycle. The referral program rewards a
    streak: when the latest earlier referral credit line of this membership is dated no more than 365 calendar days
    before the credit date, streak_year is added; when it is dated 366 to 730 calendar days before, streak_two_years is
    added; otherwise nothing is added for the streak. The referral program rewards the plan family billed: when the
    latest dues line of this membership names Larkspur Premier Annual, premier_family_bonus is added; when it names
    Larkspur Plus Monthly or Larkspur Plus Annual, plus_family_bonus is added; otherwise nothing is added for the plan
    family. The referral program rewards members who themselves came through a program: when the referring membership
    names a referrer in referred_by_customer_id, referred_member_bonus is added; when it has enrollment_channel
    employer_conversion and names no referrer, converted_member_bonus is added; otherwise nothing is added for how the
    member joined. The one-credit-per-visit limit belongs to goodwill credits and never governs a referral credit.
  prerequisite: []
  cross_category: []
  compute:
  - standard_referral: P('referral_credit_amount')
  - referrals_last_year: COUNT('membership_credits', within_months=12, date_field='credit_date', event_type='membership_credit_issued', credit_reason='referral')
  - earlier_referral_lines: COUNT('membership_credits', event_type='membership_credit_issued', credit_reason='referral')
  - milestone_addition: standard_referral if earlier_referral_lines >= 2 else (K('second_referral_step') if earlier_referral_lines == 1 else 0)
  - billing_period_months: MONTHS(F('current_period_start'), F('current_period_end'))
  - cycle_addition: K('annual_plan_bonus') if billing_period_months == 12 else (K('monthly_plan_bonus') if billing_period_months == 1 else 0)
  - latest_referral_date: LATEST('membership_credits','credit_date', date_field='credit_date', event_type='membership_credit_issued', credit_reason='referral')
  - streak_addition: K('streak_year') if (latest_referral_date != None and DAYS(latest_referral_date, NOW) <= 365) else (K('streak_two_years') if (latest_referral_date != None and DAYS(latest_referral_date, NOW) <= 730) else 0)
  - latest_tier_billed: LATEST('membership_charges','tier_charged', date_field='charge_date', event_type='membership_dues_charged')
  - family_addition: K('premier_family_bonus') if latest_tier_billed == 'Larkspur Premier Annual' else (K('plus_family_bonus') if (latest_tier_billed == 'Larkspur Plus Monthly' or latest_tier_billed == 'Larkspur Plus Annual') else 0)
  - member_referrer: LATEST('membership_holdings','referred_by_customer_id', date_field='enrolled_date')
  - member_channel: LATEST('membership_holdings','enrollment_channel', date_field='enrolled_date')
  - joining_addition: K('referred_member_bonus') if member_referrer != None else (K('converted_member_bonus') if member_channel == 'employer_conversion' else 0)
  - result: 0 if referrals_last_year >= P('referral_credits_max_per_membership_year') else RND(standard_referral + milestone_addition + cycle_addition + streak_addition + family_addition + joining_addition + 0.000000001, 2)
  compute_basis:
    standard_referral: A referral credit is issued to the referring membership when a patient whose membership names that referrer in referred_by_customer_id has the first dues line of a first paid period charged successfully, and by the standard method it is the referral_credit_amount of the tier the referring membership holds on the credit date.
    referrals_last_year: A referral is refused, with nothing issued, when the referral credits issued to this membership in the twelve months before the credit date have already reached referral_credits_max_per_membership_year; a record counts as dated in those twelve months when its date is not after the credit date and adding twelve calendar months to it, keeping the day number and treating a day number the later month lacks as falling after that month's last day, gives a date after the credit date.
    earlier_referral_lines: 'The referral program counts milestones: when this membership already holds two or more referral credit lines issued, the standard amount is added a second time; when it holds exactly one, second_referral_step is added; otherwise nothing is added for milestones.'
    milestone_addition: 'The referral program counts milestones: when this membership already holds two or more referral credit lines issued, the standard amount is added a second time; when it holds exactly one, second_referral_step is added; otherwise nothing is added for milestones.'
    billing_period_months: 'The referral program rewards annual billing: when the referring membership''s current billing period runs twelve calendar months from current_period_start to current_period_end, annual_plan_bonus is added; when it runs one calendar month, monthly_plan_bonus is added; otherwise nothing is added for the billing cycle.'
    cycle_addition: 'The referral program rewards annual billing: when the referring membership''s current billing period runs twelve calendar months from current_period_start to current_period_end, annual_plan_bonus is added; when it runs one calendar month, monthly_plan_bonus is added; otherwise nothing is added for the billing cycle.'
    latest_referral_date: 'The referral program rewards a streak: when the latest earlier referral credit line of this membership is dated no more than 365 calendar days before the credit date, streak_year is added; when it is dated 366 to 730 calendar days before, streak_two_years is added; otherwise nothing is added for the streak.'
    streak_addition: 'The referral program rewards a streak: when the latest earlier referral credit line of this membership is dated no more than 365 calendar days before the credit date, streak_year is added; when it is dated 366 to 730 calendar days before, streak_two_years is added; otherwise nothing is added for the streak.'
    latest_tier_billed: 'The referral program rewards the plan family billed: when the latest dues line of this membership names Larkspur Premier Annual, premier_family_bonus is added; when it names Larkspur Plus Monthly or Larkspur Plus Annual, plus_family_bonus is added; otherwise nothing is added for the plan family.'
    family_addition: 'The referral program rewards the plan family billed: when the latest dues line of this membership names Larkspur Premier Annual, premier_family_bonus is added; when it names Larkspur Plus Monthly or Larkspur Plus Annual, plus_family_bonus is added; otherwise nothing is added for the plan family.'
    member_referrer: 'The referral program rewards members who themselves came through a program: when the referring membership names a referrer in referred_by_customer_id, referred_member_bonus is added; when it has enrollment_channel employer_conversion and names no referrer, converted_member_bonus is added; otherwise nothing is added for how the member joined.'
    member_channel: 'The referral program rewards members who themselves came through a program: when the referring membership names a referrer in referred_by_customer_id, referred_member_bonus is added; when it has enrollment_channel employer_conversion and names no referrer, converted_member_bonus is added; otherwise nothing is added for how the member joined.'
    joining_addition: 'The referral program rewards members who themselves came through a program: when the referring membership names a referrer in referred_by_customer_id, referred_member_bonus is added; when it has enrollment_channel employer_conversion and names no referrer, converted_member_bonus is added; otherwise nothing is added for how the member joined.'
    result: The referral credit is the standard amount plus every addition the referral program below grants, rounded half up to the cent.
  factors:
  - id: referral_milestone
    effect: method
    decides: milestone_addition
    bindings: [earlier_referral_lines, milestone_addition]
    ladder:
    - when: this membership already holds two or more referral credit lines
      method: the standard amount is added a second time (the credit doubles)
    - when: it holds exactly one
      method: the fixed second_referral_step is added
    - when: otherwise
      method: nothing is added
    baseline:
      milestone_addition: '0'
    evidence: [history]
    cross_difficulty: null
  - id: billing_cycle_bonus
    effect: parameter
    decides: cycle_addition
    bindings: [billing_period_months, cycle_addition]
    ladder:
    - when: the current billing period runs twelve calendar months
      value: K('annual_plan_bonus')
    - when: it runs one calendar month
      value: K('monthly_plan_bonus')
    - when: otherwise
      value: '0'
    baseline:
      cycle_addition: '0'
    evidence: [date]
    cross_difficulty: null
  - id: referral_streak
    effect: parameter
    decides: streak_addition
    bindings: [latest_referral_date, streak_addition]
    ladder:
    - when: the latest earlier referral credit line is dated no more than 365 calendar days before the credit date
      value: K('streak_year')
    - when: it is dated 366 to 730 calendar days before
      value: K('streak_two_years')
    - when: otherwise
      value: '0'
    baseline:
      streak_addition: '0'
    evidence: [history, date]
    cross_difficulty: null
  - id: plan_family_bonus
    effect: parameter
    decides: family_addition
    bindings: [latest_tier_billed, family_addition]
    ladder:
    - when: the latest dues line names Larkspur Premier Annual
      value: K('premier_family_bonus')
    - when: it names Larkspur Plus Monthly or Larkspur Plus Annual
      value: K('plus_family_bonus')
    - when: otherwise
      value: '0'
    baseline:
      family_addition: '0'
    evidence: [history]
    cross_difficulty: null
  - id: joining_route
    effect: parameter
    decides: joining_addition
    bindings: [member_referrer, member_channel, joining_addition]
    ladder:
    - when: the referring membership names a referrer in referred_by_customer_id
      value: K('referred_member_bonus')
    - when: it has enrollment_channel employer_conversion and names no referrer
      value: K('converted_member_bonus')
    - when: otherwise
      value: '0'
    baseline:
      joining_addition: '0'
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: A referral credit is issued to the referring membership when a patient whose membership names that referrer in referred_by_customer_id has the first dues line of a first paid period charged successfully, and by the standard method it is the referral_credit_amount of the tier the referring membership holds on the credit date. The referral credit is the standard amount plus every addition the referral program below grants, rounded half up to the cent. A referral is refused, with nothing issued, when the referral credits issued to this membership in the twelve months before the credit date have already reached referral_credits_max_per_membership_year; a record counts as dated in those twelve months when its date is not after the credit date and adding twelve calendar months to it, keeping the day number and treating a day number the later month lacks as falling after that month's last day, gives a date after the credit date.
    params: [referral_credit_amount, referral_credits_max_per_membership_year]
  inputs:
    history:
    - {table: membership_credits, aggregate: count, field: mem_credit_id, filters: {event_type: membership_credit_issued, credit_reason: referral}}
    - {table: membership_charges, aggregate: latest, field: tier_charged, filters: {event_type: membership_dues_charged}}
