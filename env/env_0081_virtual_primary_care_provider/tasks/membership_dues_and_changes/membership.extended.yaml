- id: membership_ext_past_due_payment
  base_policy_refs:
  - membership_evt_dues_billing
  - membership_evt_failed_payment
  - membership_evt_credits
  - membership_sponsor_coordination
  overwrite:
  - base_policy: membership_evt_dues_billing
    superseded_clause: Dues may be charged only while the membership status is active.
    replaced_by: The past-due period's dues line is charged in the same payment that returns the membership to active.
  - base_policy: membership_evt_dues_billing
    superseded_clause: Open account credit is applied to every dues and upgrade proration charge before the card is charged,
      drawing down credits in the order set by credit_application_order and never using a credit on or after its expiry_date;
    replaced_by: The payment charges the period's single dues line at the gross dues and draws the credit the rules below
      allow against that line, each credit drawn writing its own applied line in the order set by
      credit_application_order, and the card pays the rest.
  - base_policy: membership_evt_credits
    superseded_clause: A credit may be applied only when the charge date is earlier than its credit_date plus credit_expiry_months
      calendar months.
    replaced_by: A credit whose expiry date falls while the membership is past_due does not lapse; it is carried and drawn
      when the past-due period is paid, and every other credit may be applied only when the charge date is earlier than
      its credit_date plus credit_expiry_months calendar months.
  - base_policy: membership_evt_credits
    superseded_clause: On the expiry date, or on the cancellation date if earlier, an expired line records the unused remainder
      of the credit.
    replaced_by: A credit whose expiry date falls while the membership is past_due does not lapse; it is carried and drawn
      when the past-due period is paid, and every other credit may be applied only when the charge date is earlier than
      its credit_date plus credit_expiry_months calendar months.
  - base_policy: membership_sponsor_coordination
    superseded_clause: An enrollment counts as an employer_conversion only when the enrolled date is no more than sponsor_conversion_window_days
      calendar days after that enrollment's coverage_end_date.
    replaced_by: The employer-conversion window governs only the first dues line of a conversion and never the dues of a
      past-due renewal period.
  trigger: on_request
  subject:
  - membership_payment_recovered
  - membership_dues_charged
  - membership_credit_applied
  computes: card_amount
  target_tool: pay_past_due_dues_3656db9c
  params: {}
  rule: >-
    When a membership is past_due, the patient settles the unpaid period in person: after the agent quotes the amount,
    the patient pays it with a card the patient reads out or enters, a charge to an updated card counting as the next
    attempt, and the payment returns the membership to active for the same period. The past-due period's dues line is
    charged in the same payment that returns the membership to active. The payment charges the period's single dues line
    at the gross dues and draws the credit the rules below allow against that line, each credit drawn writing its own
    applied line in the order set by credit_application_order, and the card pays the rest. The amount the card pays for
    a past-due period is the dues_amount of the tier held for that period, less every credit amount the rules below draw
    against it, never below 0.00, rounded half up to the cent. The amount the card pays for a past-due period is fixed
    only after every visit of the patient that Larkspur cancelled carries a goodwill credit line naming it. The
    past-due payment is not taken until every patient whose membership names this member as the referring patient and whose first dues line has been charged carries a referral credit line on this membership. A record counts as dated
    in the twelve months before the payment date when its date is not after the payment date and adding twelve calendar
    months to it, keeping the day number and treating a day number the later month lacks as falling after that month's
    last day, gives a date after the payment date, and it counts as dated in the thirteenth month before the payment date
    when adding thirteen calendar months gives a date after the payment date but adding twelve does not. Referral credit
    is drawn as follows: the referral credit issued to this membership in the twelve months before the payment date, less
    the referral credit applied and expired lines dated in those twelve months, is drawn in full when it totals more than
    0.00 and less than the dues, the whole dues are drawn when it totals the dues or more, and nothing is drawn otherwise.
    Goodwill credit is drawn as follows: the goodwill credit issued to this membership in the twelve months before the
    payment date, less the goodwill credit applied and expired lines dated in those twelve months, is drawn in full when
    it totals more than 0.00 and less than the dues, the whole dues are drawn when it totals the dues or more, and nothing
    is drawn otherwise. A credit whose expiry date falls while the membership is past_due does not lapse; it is carried
    and drawn when the past-due period is paid, and every other credit may be applied only when the charge date is
    earlier than its credit_date plus credit_expiry_months calendar months. Carried referral credit is drawn as follows:
    when the membership is past_due and bills in twelve-month periods, the referral credit lines issued in the thirteenth
    month before the payment date, which reached their expiry during the unpaid period without meeting any charge, are
    drawn at their issued amount when that total is less than the dues, the whole dues are drawn when it is the dues or
    more, and nothing is drawn otherwise. Carried goodwill credit is drawn as follows: when the membership is past_due and
    bills in twelve-month periods, the goodwill credit lines issued in the thirteenth month before the payment date are
    drawn at their issued amount when that total is less than the dues, the whole dues are drawn when it is the dues or
    more, and nothing is drawn otherwise. The employer-conversion window governs only the first dues line of a
    conversion and never the dues of a past-due renewal period.
  prerequisite:
  - problem: membership_ext_goodwill_credit
    kind: value_input
    gate: goodwill_drawn
    form: state
    policy_source: The amount the card pays for a past-due period is fixed only after every visit of the patient that Larkspur cancelled carries a goodwill credit line naming it.
    condition: every visit_appointments row of the patient with status provider_cancelled is named by the
      related_visit_id of a membership_credit_issued line with credit_reason goodwill on this membership.
    resolved_by: issue_goodwill_credit_9ab1aff0
    effect: the goodwill credit issued for the uncompensated Larkspur-cancelled visit is drawn against the past-due dues
      line, so the goodwill credit drawn rises from 0.00 to that credit and the card amount falls by it.
  - problem: membership_ext_referral_credit
    kind: value_input
    gate: referral_drawn
    form: state
    policy_source: The past-due payment is not taken until every patient whose membership names this member as the referring patient and whose first dues line has been charged carries a referral credit line on this
      membership.
    condition: every membership_holdings row naming this member in referred_by_customer_id whose first membership_dues_charged
      line exists is named by the referred_customer_id of a referral credit line on this membership.
    resolved_by: issue_referral_credit_f4907f54
    effect: the referral credit issued for the newly converted referred patient is drawn against the past-due dues line,
      so the referral credit drawn rises by that credit and the card amount falls by it.
  cross_category: []
  compute:
  - period_dues: P('dues_amount')
  - referral_open: SUM('membership_credits','amount', within_months=12, date_field='credit_date', event_type='membership_credit_issued', credit_reason='referral') - SUM('membership_credits','amount', within_months=12, date_field='credit_date', event_type='membership_credit_applied', credit_reason='referral') - SUM('membership_credits','amount', within_months=12, date_field='credit_date', event_type='membership_credit_expired', credit_reason='referral')
  - referral_drawn: period_dues if referral_open >= period_dues else (referral_open if referral_open > 0 else 0)
  - goodwill_open: SUM('membership_credits','amount', within_months=12, date_field='credit_date', event_type='membership_credit_issued', credit_reason='goodwill') - SUM('membership_credits','amount', within_months=12, date_field='credit_date', event_type='membership_credit_applied', credit_reason='goodwill') - SUM('membership_credits','amount', within_months=12, date_field='credit_date', event_type='membership_credit_expired', credit_reason='goodwill')
  - goodwill_drawn: period_dues if goodwill_open >= period_dues else (goodwill_open if goodwill_open > 0 else 0)
  - annual_arrears: F('status') == 'past_due' and MONTHS(F('current_period_start'), F('current_period_end')) == 12
  - carried_referral_lines: SUM('membership_credits','amount', within_months=13, date_field='credit_date', event_type='membership_credit_issued', credit_reason='referral') - SUM('membership_credits','amount', within_months=12, date_field='credit_date', event_type='membership_credit_issued', credit_reason='referral')
  - carried_referral: period_dues if (annual_arrears and carried_referral_lines >= period_dues) else (carried_referral_lines if (annual_arrears and carried_referral_lines > 0) else 0)
  - carried_goodwill_lines: SUM('membership_credits','amount', within_months=13, date_field='credit_date', event_type='membership_credit_issued', credit_reason='goodwill') - SUM('membership_credits','amount', within_months=12, date_field='credit_date', event_type='membership_credit_issued', credit_reason='goodwill')
  - carried_goodwill: period_dues if (annual_arrears and carried_goodwill_lines >= period_dues) else (carried_goodwill_lines if (annual_arrears and carried_goodwill_lines > 0) else 0)
  - result: MX(0, RND(period_dues - referral_drawn - goodwill_drawn - carried_referral - carried_goodwill + 0.000000001, 2))
  compute_basis:
    period_dues: The amount the card pays for a past-due period is the dues_amount of the tier held for that period, less every credit amount the rules below draw against it, never below 0.00, rounded half up to the cent.
    referral_open: 'Referral credit is drawn as follows: the referral credit issued to this membership in the twelve months before the payment date, less the referral credit applied and expired lines dated in those twelve months, is drawn in full when it totals more than 0.00 and less than the dues, the whole dues are drawn when it totals the dues or more, and nothing is drawn otherwise.'
    referral_drawn: 'Referral credit is drawn as follows: the referral credit issued to this membership in the twelve months before the payment date, less the referral credit applied and expired lines dated in those twelve months, is drawn in full when it totals more than 0.00 and less than the dues, the whole dues are drawn when it totals the dues or more, and nothing is drawn otherwise.'
    goodwill_open: 'Goodwill credit is drawn as follows: the goodwill credit issued to this membership in the twelve months before the payment date, less the goodwill credit applied and expired lines dated in those twelve months, is drawn in full when it totals more than 0.00 and less than the dues, the whole dues are drawn when it totals the dues or more, and nothing is drawn otherwise.'
    goodwill_drawn: 'Goodwill credit is drawn as follows: the goodwill credit issued to this membership in the twelve months before the payment date, less the goodwill credit applied and expired lines dated in those twelve months, is drawn in full when it totals more than 0.00 and less than the dues, the whole dues are drawn when it totals the dues or more, and nothing is drawn otherwise.'
    annual_arrears: 'Carried referral credit is drawn as follows: when the membership is past_due and bills in twelve-month periods, the referral credit lines issued in the thirteenth month before the payment date, which reached their expiry during the unpaid period without meeting any charge, are drawn at their issued amount when that total is less than the dues, the whole dues are drawn when it is the dues or more, and nothing is drawn otherwise.'
    carried_referral_lines: A record counts as dated in the twelve months before the payment date when its date is not after the payment date and adding twelve calendar months to it, keeping the day number and treating a day number the later month lacks as falling after that month's last day, gives a date after the payment date, and it counts as dated in the thirteenth month before the payment date when adding thirteen calendar months gives a date after the payment date but adding twelve does not.
    carried_referral: 'Carried referral credit is drawn as follows: when the membership is past_due and bills in twelve-month periods, the referral credit lines issued in the thirteenth month before the payment date, which reached their expiry during the unpaid period without meeting any charge, are drawn at their issued amount when that total is less than the dues, the whole dues are drawn when it is the dues or more, and nothing is drawn otherwise.'
    carried_goodwill_lines: A record counts as dated in the twelve months before the payment date when its date is not after the payment date and adding twelve calendar months to it, keeping the day number and treating a day number the later month lacks as falling after that month's last day, gives a date after the payment date, and it counts as dated in the thirteenth month before the payment date when adding thirteen calendar months gives a date after the payment date but adding twelve does not.
    carried_goodwill: 'Carried goodwill credit is drawn as follows: when the membership is past_due and bills in twelve-month periods, the goodwill credit lines issued in the thirteenth month before the payment date are drawn at their issued amount when that total is less than the dues, the whole dues are drawn when it is the dues or more, and nothing is drawn otherwise.'
    result: The amount the card pays for a past-due period is the dues_amount of the tier held for that period, less every credit amount the rules below draw against it, never below 0.00, rounded half up to the cent.
  factors:
  - id: referral_draw
    effect: method
    decides: referral_drawn
    bindings: [referral_open, referral_drawn]
    ladder:
    - when: the referral credit open from the last twelve months totals the dues or more
      method: the whole dues are drawn (the draw is capped at the dues)
    - when: it totals more than 0.00 and less than the dues
      method: the open referral credit is drawn in full
    - when: otherwise
      method: nothing is drawn
    baseline:
