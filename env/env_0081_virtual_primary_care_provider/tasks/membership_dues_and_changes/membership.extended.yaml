# Product charter: membership. Larkspur Health.
category: membership
display_name: Larkspur Membership
binding:
  holding_table: membership_holdings
  event_tables:
  - membership_charges
  - membership_credits
  - membership_notices
  intake_tables:
  - membership_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    credit_balance: account_credit
lifecycle:
  states:
  - pending_payment
  - trialing
  - active
  - past_due
  - suspended
  - paused
  - cancelled
  transitions:
  - from: pending_payment
    to: trialing
    by: system
    means: The card on file is authorized at sign-up for a tier with a free trial and the trial clock starts.
  - from: pending_payment
    to: active
    by: system
    means: The first dues charge succeeds (or the tier carries no dues) and the first paid period starts.
  - from: pending_payment
    to: cancelled
    by: system
    means: Sign-up is abandoned because the card on file could not be authorized or charged at enrollment.
  - from: trialing
    to: active
    by: system
    means: The trial ends and the first dues charge succeeds on the trial end date.
  - from: trialing
    to: past_due
    by: system
    means: The first dues charge at the end of the trial fails.
  - from: trialing
    to: cancelled
    by: user
    means: The patient cancels during the free trial; no dues are ever charged.
  - from: active
    to: past_due
    by: system
    means: A renewal dues charge fails on the billing date.
  - from: past_due
    to: active
    by: system
    means: A retry or a charge to an updated card pays the dues of the period that failed.
  - from: past_due
    to: suspended
    by: system
    means: The failed-payment grace period elapses with the period's dues still unpaid.
  - from: active
    to: suspended
    by: system
    means: The patient's card issuer reverses a membership charge through a chargeback.
  - from: suspended
    to: active
    by: system
    means: The patient pays dues for a new billing period starting on the reactivation date.
  - from: suspended
    to: cancelled
    by: system
    means: The membership stays suspended for the tier's auto-cancel period and is closed.
  - from: active
    to: paused
    by: system
    means: An approved pause request reaches its pause start date.
  - from: paused
    to: active
    by: system
    means: The pause end date arrives
    or the patient resumes early.: null
  - from: active
    to: cancelled
    by: user
    means: The patient cancels; immediate-cancellation tiers close on the request date
    end-of-period tiers close on the next billing date.: null
  - from: active
    to: cancelled
    by: system
    means: Auto-renew is off and the current period ends without renewal.
  - from: past_due
    to: cancelled
    by: user
    means: The patient cancels while dues are past due; the unpaid period is never charged.
  - from: paused
    to: cancelled
    by: user
    means: The patient cancels while the membership is paused.
accounts:
- key: membership_billed
  unit: USD
  meaning: Net amount billed for the membership; dues, enrollment fees, upgrade proration and pause hold fees add
    to it, refunds and chargebacks reduce it.
- key: account_credit
  unit: USD
  meaning: Non-cash account credit held on the membership (referral and goodwill credits), usable only toward dues
    and upgrade proration charges.
parameter_schema:
  dues_amount: Dues charged at the start of each billing period; USD.
  billing_cycle_months: Length of one billing period in calendar months; integer.
  proration_monthly_rate: Monthly-equivalent rate used to value whole unused months on annual refunds (annual dues
    / 12, rounded half-up to the cent); USD.
  enrollment_fee: One-time enrollment fee charged with the first paid period; USD.
  rejoin_fee_waiver_days: The enrollment fee is waived when the patient's previous membership was cancelled no more
    than this many calendar days before the new enrolled date; calendar days.
  enrollment_fee_refundable_in_window: Whether the enrollment fee is refunded together with the first period dues
    on a full-refund-window cancellation; boolean.
  free_trial_days: Length of the free trial at a new enrollment; calendar days; 0 = no trial.
  trial_limit_per_lifetime: Maximum number of free trials one patient may ever start across all memberships; count.
  trial_reminder_days_before_end: Days before trial_end_date on which the trial-ending reminder is sent; calendar
    days; 0 = no reminder (no trial).
  renewal_notice_min_days_before: 'Latest point for the annual renewal notice: at least this many calendar days
    before current_period_end; 0 = no renewal notice (monthly or free tier).'
  renewal_notice_max_days_before: 'Earliest point for the annual renewal notice: no more than this many calendar
    days before current_period_end; 0 = no renewal notice.'
  renewal_notice_missing_waives_visit_condition: Whether a missing renewal notice waives the no-completed-visit
    condition of the renewal refund window; boolean.
  notice_channels: Channels through which every renewal notice and trial reminder is sent, one notice record per
    channel; list of email/sms.
  auto_renew_default: Auto-renew setting at enrollment; boolean.
  payment_retry_count: Number of automatic retries after a failed dues attempt within the same period (attempts
    2..retry_count+1); count.
  payment_retry_interval_days: Calendar days between consecutive automatic dues attempts in the same period.
  failed_payment_grace_days: Calendar days after the first failed attempt of a period during which the membership
    stays past_due before suspension.
  suspended_auto_cancel_days: Calendar days a membership may stay suspended before it is cancelled by the system.
  reactivation_new_period: Whether reactivation from suspension starts a new billing period on the reactivation
    date (the unpaid period is never charged); boolean.
  pause_allowed: Whether the tier may be paused; boolean.
  pause_eligible_after_months: Whole months the membership must have been active (since activated_date) before a
    pause may start; months.
  pause_min_months: Minimum length of one pause; whole months.
  pause_max_months_per_membership_year: Maximum total paused months whose pause starts within one membership year;
    whole months.
  pause_request_notice_days: A pause may start no earlier than this many calendar days after the request date.
  pause_hold_fee_per_month: Hold fee per paused month, charged in full on the pause start date; USD.
  pause_extends_period: Whether current_period_end is pushed back by the paused months; boolean.
  cancellation_effective: 'When a patient cancellation takes effect: immediate (request date) or end_of_period (current_period_end).'
  full_refund_window_days: Calendar days after activated_date within which a cancellation of the first paid period
    earns a full refund; 0 = no window.
  full_refund_requires_no_completed_visit: Whether the full refund window requires that no visit was completed since
    activated_date; boolean.
  post_window_refund_method: 'Refund outside the full and renewal windows: none, or unused_full_months (whole unused
    months x proration_monthly_rate).'
  renewal_refund_window_days: Calendar days after an annual renewal charge within which a cancellation earns a full
    refund of that renewal charge; 0 = no window.
  upgrade_effective: 'When a move to a tier with a higher proration_monthly_rate takes effect: immediate.'
  upgrade_credit_basis: 'How the unused part of the current period is valued on an upgrade: unused_days (gross amount
    paid for the period x unused days / period days).'
  downgrade_effective: 'When a move to a tier with a lower proration_monthly_rate takes effect: next_billing_date
    (current_period_end).'
  tier_changes_per_membership_year: Maximum applied upgrade, downgrade and cycle_switch requests effective within
    one membership year, counted on the tier held when the request is made; count.
  cycle_switch_allowed: Whether the member may switch between the monthly and annual version of the same plan family
    (Essentials, Plus); boolean.
  referral_credit_amount: Account credit issued to the referring member when a referred patient's first paid dues
    charge succeeds; USD.
  referral_credits_max_per_membership_year: Maximum referral credits issued to one referring membership within one
    membership year; count.
  goodwill_credit_per_provider_cancellation: Goodwill credit issued for one visit cancelled by Larkspur (visit status
    provider_cancelled); USD.
  goodwill_credit_cap_per_membership_year: Maximum total goodwill credit issued within one membership year; USD.
  credit_expiry_months: Calendar months after credit_date at which an unused credit expires (month-end fallback);
    months.
  credit_application_order: Order in which open credits are drawn down against a charge.
  min_enrollment_age_months: Minimum age of the patient on the enrolled date, in completed calendar months (216
    = 18 years).
  dedicated_clinician: Whether the tier includes a named primary care clinician; boolean.
  clinician_change_wait_days: Calendar days after clinician_assigned_date before the member may switch to a different
    primary clinician; 0 = no dedicated clinician.
  sponsor_conversion_first_period_discount_pct: Percent off the first dues charge for a patient converting from
    an ended Larkspur at Work enrollment; percent.
  sponsor_conversion_window_days: Calendar days after the Larkspur at Work coverage_end_date within which an enrollment
    counts as a conversion; 0 = no conversion offer.
  sponsor_overlap_refund_basis: 'Refund basis when a paid membership is cancelled because a Larkspur at Work enrollment
    became active: unused_days (gross amount paid for the period x unused days / period days, counted from the sponsor
    coverage_start_date).'
  chargeback_action: 'Effect of a card chargeback on a membership charge: suspend.'
  dues_rounding: 'Rounding of every computed membership amount: half_up_cent (round half up to 2 decimals after
    the full computation).'
  membership_year_basis: 'Basis of the membership year: activation_anniversary (starts on activated_date and every
    12 calendar months after, month-end fallback).'
