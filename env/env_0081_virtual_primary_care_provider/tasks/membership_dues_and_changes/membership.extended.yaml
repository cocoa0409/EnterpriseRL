events:
- type: membership_enrolled
  target: membership_holdings
  mutation: create
  meaning: A patient signs up for a Larkspur membership tier.
  grain: one row per membership enrollment
  fields:
    variant_name: Tier enrolled in.
    enrolled_date: Date of sign-up.
    trial_end_date: enrolled_date plus the tier's free_trial_days when a trial is granted; empty otherwise.
    auto_renew: Set from the tier's auto_renew_default.
    enrollment_channel: Channel of the sign-up; employer_conversion for conversions from Larkspur at Work.
    referred_by_customer_id: Referring patient, when a referral link was used.
  triggers: []
- type: membership_trial_started
  target: membership_holdings
  mutation:
    transition:
      from: pending_payment
      to: trialing
  meaning: The free trial of a newly enrolled membership starts.
  grain: one row per transaction
  fields:
    trial_end_date: Date the trial ends.
  triggers:
  - event: membership:membership_trial_reminder_sent
    map: {}
- type: membership_activated
  target: membership_holdings
  mutation:
    transition:
      from: pending_payment
      to: active
  meaning: A membership without a trial becomes active on its first paid period.
  grain: one row per transaction
  fields:
    variant_name: Tier being activated.
    activated_date: First day of the first paid period.
    current_period_start: Same as activated_date.
    current_period_end: activated_date plus billing_cycle_months.
    membership_year_start: Same as activated_date.
  triggers:
  - event: membership:membership_dues_charged
    when:
      variant_name:
        not: Larkspur Access
    map:
      period_start: current_period_start
      period_end: current_period_end
      tier_charged: variant_name
- type: membership_signup_abandoned
  target: membership_holdings
  mutation:
    transition:
      from: pending_payment
      to: cancelled
  meaning: A sign-up whose card could not be authorized or charged is closed without service.
  grain: one row per transaction
  fields:
    cancelled_date: Date the sign-up was closed.
  triggers: []
- type: membership_trial_converted
  target: membership_holdings
  mutation:
    transition:
      from: trialing
      to: active
  meaning: The trial ends and the membership becomes paid.
  grain: one row per transaction
  fields:
    variant_name: Tier being converted.
    activated_date: Equal to trial_end_date.
    current_period_start: Equal to trial_end_date.
    current_period_end: trial_end_date plus billing_cycle_months.
    membership_year_start: Equal to trial_end_date.
  triggers:
  - event: membership:membership_dues_charged
    map:
      period_start: current_period_start
      period_end: current_period_end
      tier_charged: variant_name
- type: membership_trial_conversion_failed
  target: membership_holdings
  mutation:
    transition:
      from: trialing
      to: past_due
  meaning: The first dues charge at trial end fails.
  grain: one row per transaction
  fields:
    current_period_start: Equal to trial_end_date (the period that failed).
    current_period_end: trial_end_date plus billing_cycle_months.
  triggers: []
- type: membership_trial_cancelled
  target: membership_holdings
  mutation:
    transition:
      from: trialing
      to: cancelled
  meaning: The patient cancels during the free trial.
  grain: one row per transaction
  fields:
    cancelled_date: Date of the cancellation (immediate).
  triggers: []
- type: membership_renewal_failed
  target: membership_holdings
  mutation:
    transition:
      from: active
      to: past_due
  meaning: The dues charge on a billing date fails.
  grain: one row per transaction
  fields:
    current_period_start: The billing date whose dues failed.
    current_period_end: current_period_start plus billing_cycle_months.
  triggers: []
- type: membership_payment_recovered
  target: membership_holdings
  mutation:
    transition:
      from: past_due
      to: active
  meaning: The unpaid dues of the past-due period are paid by a retry or an updated card.
  grain: one row per transaction
  fields:
    variant_name: Tier held.
    current_period_start: Unchanged; the period that had failed.
    current_period_end: Unchanged.
  triggers:
  - event: membership:membership_dues_charged
    map:
      period_start: current_period_start
      period_end: current_period_end
      tier_charged: variant_name
- type: membership_suspended
  target: membership_holdings
  mutation:
    transition:
      from: past_due
      to: suspended
  meaning: The grace period ends with the period's dues still unpaid.
  grain: one row per transaction
  fields:
    suspended_date: Date the membership was suspended.
  triggers: []
- type: membership_chargeback_suspended
  target: membership_holdings
  mutation:
    transition:
      from: active
      to: suspended
  meaning: A chargeback on a membership charge suspends the membership.
  grain: one row per transaction
  fields:
    suspended_date: Date the membership was suspended.
  triggers: []
- type: membership_reactivated
  target: membership_holdings
  mutation:
    transition:
      from: suspended
      to: active
  meaning: A suspended membership is reactivated by paying a new billing period.
  grain: one row per transaction
  fields:
    variant_name: Tier held.
    current_period_start: The reactivation date.
    current_period_end: Reactivation date plus billing_cycle_months.
  triggers:
  - event: membership:membership_dues_charged
    map:
      period_start: current_period_start
      period_end: current_period_end
      tier_charged: variant_name
- type: membership_suspension_lapsed
  target: membership_holdings
  mutation:
    transition:
      from: suspended
      to: cancelled
  meaning: A membership left suspended for the auto-cancel period is closed.
  grain: one row per transaction
  fields:
    cancelled_date: Date of closure.
  triggers: []
- type: membership_paused
  target: membership_holdings
  mutation:
    transition:
      from: active
      to: paused
  meaning: An approved pause starts.
  grain: one row per transaction
  fields:
    variant_name: Tier held (unchanged by the pause).
    pause_start_date: First paused day.
    pause_end_date: pause_start_date plus the requested pause_months.
    current_period_end: Pushed back by pause_months on tiers whose pause_extends_period is true.
  triggers:
  - event: membership:membership_pause_fee_charged
    when:
      variant_name: Larkspur Premier Annual
    map:
      period_start: pause_start_date
      period_end: pause_end_date
      tier_charged: variant_name
- type: membership_resumed
  target: membership_holdings
  mutation:
    transition:
      from: paused
      to: active
  meaning: A paused membership resumes on its pause end date or early at the patient's request.
  grain: one row per transaction
  fields:
    pause_end_date: Actual resume date.
    current_period_end: Re-stated when an early resume shortens the extension.
  triggers: []
- type: membership_cancelled
  target: membership_holdings
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: The patient's cancellation of an active membership takes effect.
  grain: one row per transaction
  fields:
    cancelled_date: Date the cancellation took effect.
  triggers: []
- type: membership_term_expired
  target: membership_holdings
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: A membership with auto-renew turned off reaches current_period_end and closes.
  grain: one row per transaction
  fields:
    cancelled_date: Equal to current_period_end.
  triggers: []
- type: membership_cancelled_while_past_due
  target: membership_holdings
  mutation:
    transition:
      from: past_due
      to: cancelled
  meaning: The patient cancels while the period's dues are unpaid.
  grain: one row per transaction
  fields:
    cancelled_date: Date of cancellation (immediate).
  triggers: []
- type: membership_cancelled_while_paused
  target: membership_holdings
  mutation:
    transition:
      from: paused
      to: cancelled
  meaning: The patient cancels a paused membership.
  grain: one row per transaction
  fields:
    cancelled_date: Date of cancellation (immediate).
  triggers: []
- type: membership_renewed
  target: membership_holdings
  mutation: update
  meaning: An auto-renewing membership starts its next billing period.
  grain: one row per transaction
  fields:
    variant_name: Tier for the new period (a pending downgrade or cycle switch applies here).
    current_period_start: The previous current_period_end.
    current_period_end: New current_period_start plus billing_cycle_months.
    membership_year_start: Advanced by 12 months when the anniversary is reached.
  triggers:
  - event: membership:membership_dues_charged
    map:
      period_start: current_period_start
      period_end: current_period_end
      tier_charged: variant_name
- type: membership_tier_changed
  target: membership_holdings
  mutation: update
  meaning: The membership moves to another tier (immediate upgrade, or downgrade at the billing date).
  grain: one row per transaction
  fields:
    variant_name: New tier.
    current_period_start: Reset to the change date on an upgrade.
    current_period_end: Change date plus the new tier's billing_cycle_months on an upgrade.
  triggers: []
- type: membership_auto_renew_changed
  target: membership_holdings
  mutation: update
  meaning: The patient turns auto-renew on or off.
  grain: one row per transaction
  fields:
    auto_renew: New setting.
  triggers: []
- type: membership_clinician_assigned
  target: membership_holdings
  mutation: update
  meaning: A dedicated primary clinician is assigned or changed.
  grain: one row per transaction
  fields:
    primary_clinician: Name of the clinician now assigned.
    clinician_assigned_date: Date of the assignment.
  triggers: []
- type: membership_dues_charged
  target: membership_charges
  meaning: Dues for one billing period are charged.
  grain: one row per membership per billing period
  distinguish_by:
  - period_start
  fields:
    amount: Dues for the period (after any conversion discount, before account credit).
    charge_date: Date charged (the period start, or the recovery date).
    period_start: First day of the period.
    period_end: Exclusive end of the period.
    tier_charged: Tier priced.
  account: membership_billed
  direction: in
  triggers: []
- type: membership_enrollment_fee_charged
  target: membership_charges
  meaning: The one-time enrollment fee is charged with the first paid period.
  grain: one row per membership
  distinguish_by:
  - period_start
  fields:
    amount: The tier's enrollment_fee.
    charge_date: Activation date.
    period_start: First period start.
    period_end: First period end.
    tier_charged: Tier priced.
  account: membership_billed
  direction: in
  triggers: []
- type: membership_upgrade_proration_charged
  target: membership_charges
  meaning: The net charge for an immediate upgrade, which pays the new period that starts on the change date.
  grain: one row per upgrade
  distinguish_by:
  - period_start
  - tier_charged
  fields:
    amount: New tier dues less the unused value of the current period (never below 0.00).
    charge_date: Change date.
    period_start: Change date.
    period_end: Change date plus the new tier's billing_cycle_months.
    tier_charged: New tier.
  account: membership_billed
  direction: in
  triggers: []
- type: membership_pause_fee_charged
  target: membership_charges
  meaning: The hold fee for a pause is charged on the pause start date.
  grain: one row per pause
  distinguish_by:
  - period_start
  fields:
    amount: pause_hold_fee_per_month x paused months.
    charge_date: Pause start date.
    period_start: Pause start date.
    period_end: Pause end date.
    tier_charged: Tier held.
  account: membership_billed
  direction: in
  triggers: []
- type: membership_dues_refunded
  target: membership_charges
  meaning: All or part of a dues, enrollment-fee or proration line is refunded to the original card.
  grain: one row per refunded original line
  distinguish_by:
  - original_charge_id
  fields:
    amount: Negative refund amount.
    charge_date: Refund date.
    period_start: Period of the original line.
    period_end: Period end of the original line.
    tier_charged: Tier of the original line.
    original_charge_id: The line refunded.
    refund_reason: Basis of the refund.
  account: membership_billed
  direction: out
  triggers: []
- type: membership_chargeback_recorded
  target: membership_charges
  meaning: The card issuer reverses a membership charge on the patient's dispute.
  grain: one row per reversed original line
  distinguish_by:
  - original_charge_id
  fields:
    amount: Negative amount reversed.
    charge_date: Date the chargeback was received.
    period_start: Period of the original line.
    period_end: Period end of the original line.
    tier_charged: Tier of the original line.
    original_charge_id: The line reversed.
  account: membership_billed
  direction: out
  triggers:
  - event: membership:membership_chargeback_suspended
    map: {}
- type: membership_payment_failed
  target: membership_charges
  meaning: One dues attempt is declined.
  grain: one row per declined attempt
  distinguish_by:
  - period_start
  - attempt_number
  fields:
    amount: Amount attempted.
    charge_date: Attempt date.
    period_start: Period the attempt was for.
    period_end: End of that period.
    tier_charged: Tier priced.
    attempt_number: Attempt sequence within the period.
  triggers: []
- type: membership_credit_issued
  target: membership_credits
  meaning: Referral or goodwill account credit is added to the membership.
  grain: one row per credit grant (one per referred patient, or one per provider-cancelled visit)
  distinguish_by:
  - credit_reason
  - referred_customer_id
  - related_visit_id
  fields:
    amount: Credit granted.
    credit_date: Date granted.
    credit_reason: referral or goodwill.
    referred_customer_id: Referred patient (referral credits only).
    related_visit_id: Provider-cancelled visit the goodwill credit compensates (goodwill credits only).
    expiry_date: credit_date plus credit_expiry_months.
  account: account_credit
  direction: in
  triggers: []
- type: membership_credit_applied
  target: membership_credits
  meaning: Open credit is drawn down against a dues or upgrade proration line.
  grain: one row per issued credit per charge line
  distinguish_by:
  - source_credit_id
  - applied_charge_id
  fields:
    amount: Credit used.
    credit_date: Date applied (the charge date).
    credit_reason: Reason of the source credit.
    source_credit_id: Credit drawn down.
    applied_charge_id: Line paid toward.
    expiry_date: Expiry of the source credit.
  account: account_credit
  direction: out
  triggers: []
- type: membership_credit_expired
  target: membership_credits
  meaning: The unused remainder of a credit lapses at expiry or at cancellation.
  grain: one row per issued credit
  distinguish_by:
  - source_credit_id
  fields:
    amount: Remainder lapsed.
    credit_date: Expiry or cancellation date.
    credit_reason: Reason of the source credit.
    source_credit_id: Credit lapsed.
    expiry_date: Expiry of the source credit.
  account: account_credit
  direction: out
  triggers: []
- type: membership_renewal_notice_sent
  target: membership_notices
  meaning: The advance notice of an annual renewal is sent.
  grain: one row per renewal period per channel
  distinguish_by:
  - period_start
  - channel
  fields:
    notice_date: Date sent.
    period_start: The renewal date announced.
    channel: Channel used.
  triggers: []
- type: membership_trial_reminder_sent
  target: membership_notices
  meaning: The reminder that a free trial is about to convert to paid is sent.
  grain: one row per trial per channel
  distinguish_by:
  - period_start
  - channel
  fields:
    notice_date: Date sent.
    period_start: The trial end date announced.
    channel: Channel used.
  triggers: []
measures:
- id: membership_msr_lifetime_trials
  window: all time, across every membership the patient has ever held
  measure: count of the patient's membership_holdings rows whose trial_end_date is not empty
- id: membership_msr_tier_changes_year
  window: the current membership year (membership_year_start up to frozen_time)
  measure: count of membership_requests rows of this membership with request_type in (upgrade, downgrade, cycle_switch),
    request_status applied, and effective_date on or after membership_year_start
- id: membership_msr_pause_months_year
  window: the current membership year
  measure: sum of pause_months over membership_requests rows of this membership with request_type pause, request_status
    in (pending, applied), and effective_date on or after membership_year_start
- id: membership_msr_referral_credits_year
  window: the current membership year
  measure: count of membership_credit_issued rows of this membership with credit_reason referral and credit_date
    on or after membership_year_start
- id: membership_msr_goodwill_year
  window: the current membership year
  measure: sum of amount over membership_credit_issued rows of this membership with credit_reason goodwill and credit_date
    on or after membership_year_start
- id: membership_msr_failed_attempts_period
  window: the billing period identified by period_start
  measure: count of membership_payment_failed rows of this membership with the same period_start
policies:
- id: membership_agg_multi_holding
  subject:
  - membership_enrolled
  rule: A patient may hold only one Larkspur membership at a time. A new membership may be enrolled only when the
    patient holds no other membership whose status is pending_payment, trialing, active, past_due, suspended or
    paused. A patient who already holds a membership and wants another tier changes tier on that membership instead
    of enrolling a second one; a cancelled membership never blocks a new enrollment.
  eligibility:
  - id: one_open_membership
    applies_to:
    - membership_enrolled
    kind: dedup
    condition: A new membership may be enrolled only when the patient holds no other membership whose status is
      pending_payment, trialing, active, past_due, suspended or paused.
    evidence_fields:
    - membership_holdings.customer_id
    - membership_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.customer_id
      action_bindings:
        membership_holdings.customer_id: customer_id
    dedup_contract:
      table: membership_holdings
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - pending_payment
        - trialing
        - active
        - past_due
        - suspended
        - paused
      distinct_fields: []
  params:
    max_per_customer: 1
- id: membership_enrollment
  subject:
  - membership_enrolled
  - membership_trial_started
  - membership_activated
  - membership_signup_abandoned
  - membership_enrollment_fee_charged
  rule: A membership may be enrolled only when the patient's age on the enrolled date is at least min_enrollment_age_months
    completed calendar months after the patient's date of birth. Month counts are calendar months added to the anchor
    date; when that day does not exist in the target month the last day of that month is used, and the boundary
    date itself counts as reached. A paid tier may be enrolled only when every Larkspur at Work enrollment the patient
    holds has a status other than active. Larkspur Access carries no dues and may be enrolled at any time. A free
    trial is granted only when the tier's free_trial_days is above zero, the enrollment is not an employer_conversion,
    and membership_msr_lifetime_trials is below the tier's trial_limit_per_lifetime; the trial then ends free_trial_days
    calendar days after the enrolled date and the membership moves to trialing with no charge. Without a trial,
    the membership becomes active on the enrolled date once the first dues charge succeeds (Larkspur Access activates
    with no charge); when the card cannot be authorized or charged, the sign-up is closed as cancelled the same
    day and nothing is billed. The enrollment fee is charged once, on activation, on a tier whose enrollment_fee
    is above zero, unless the patient's most recently cancelled membership has a cancelled_date no more than rejoin_fee_waiver_days
    calendar days before the new enrolled date, in which case it is waived and no enrollment fee line is written.
    Account credit never pays an enrollment fee. A new membership starts with auto_renew set to the tier's auto_renew_default.
  eligibility:
  - id: minimum_age
    applies_to:
    - membership_enrolled
    kind: time
    condition: A membership may be enrolled only when the patient's age on the enrolled date is at least min_enrollment_age_months
      completed calendar months after the patient's date of birth.
    evidence_fields:
    - customers.date_of_birth
    - customers.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the patient's date of birth
      anchor_source: customers.date_of_birth
      relation: not_before
      duration_source: variants.min_enrollment_age_months
      unit: calendar_months
      counting_rule: Month counts are calendar months added to the anchor date; when that day does not exist in
        the target month the last day of that month is used, and the boundary date itself counts as reached.
      boundary: inclusive
  - id: no_active_sponsor_plan
    applies_to:
    - membership_enrolled
    kind: state
    condition: A paid tier may be enrolled only when every Larkspur at Work enrollment the patient holds has a status
      other than active.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.customer_id
      action_bindings:
        sponsor_enrollments.customer_id: customer_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - pending_eligibility
      - ended
  measures:
  - membership_msr_lifetime_trials
- id: membership_evt_dues_billing
  subject:
  - membership_dues_charged
  - membership_renewed
  - membership_credit_applied
  - membership_activated
  - membership_trial_converted
  rule: Dues are billed in advance on the first day of each billing period at the dues_amount of the tier held on
    that day, and each billing period runs billing_cycle_months calendar months from its start. Month counts are
    calendar months added to the anchor date; when that day does not exist in the target month the last day of that
    month is used, and the boundary date itself counts as reached. Dues may be charged only while the membership
    status is active. Dues for a period may be charged only when no membership_dues_charged line exists for the
    same membership and period_start. A membership may renew only when its auto_renew is true. On each billing date
    an auto-renewing membership first starts its next period (a pending downgrade or cycle switch takes effect in
    that same step) and the dues for the new period are then charged; a membership whose auto_renew is false does
    not renew and closes at current_period_end. Open account credit is applied to every dues and upgrade proration
    charge before the card is charged, drawing down credits in the order set by credit_application_order and never
    using a credit on or after its expiry_date; each credit used writes its own applied line pointing to the charge,
    the charge line keeps the gross amount, and the card is charged the gross amount less the credit applied. Credit
    is never applied to an enrollment fee or a pause hold fee. A retried or recovered payment writes the single
    dues line of the period that failed. Every computed membership amount is rounded half up to the cent after the
    full computation (dues_rounding).
  eligibility:
  - id: membership_active
    applies_to:
    - membership_dues_charged
    - membership_credit_applied
    - membership_renewed
    kind: state
    condition: Dues may be charged only while the membership status is active.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - active
  - id: one_dues_line_per_period
    applies_to:
    - membership_dues_charged
    kind: dedup
    condition: Dues for a period may be charged only when no membership_dues_charged line exists for the same membership
      and period_start.
    evidence_fields:
    - membership_charges.membership_id
    - membership_charges.period_start
    - membership_charges.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_charges.membership_id
      action_bindings:
        membership_charges.membership_id: membership_id
    dedup_contract:
      table: membership_charges
      mode: separate_record
      object_bindings:
        membership_id: membership_id
        period_start: period_start
      duplicate_filters:
        event_type:
        - membership_dues_charged
      distinct_fields: []
  - id: auto_renew_on
    applies_to:
    - membership_renewed
    kind: state
    condition: A membership may renew only when its auto_renew is true.
    evidence_fields:
    - membership_holdings.auto_renew
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.auto_renew
      allowed:
      - true
- id: membership_evt_failed_payment
  subject:
  - membership_payment_failed
  - membership_renewal_failed
  - membership_trial_conversion_failed
  - membership_payment_recovered
  - membership_suspended
  - membership_reactivated
  - membership_suspension_lapsed
  rule: When the dues attempt on a billing date or on the trial end date is declined, a payment-failed line with
    attempt_number 1 is recorded and the membership moves to past_due for that period. A declined attempt may be
    recorded only while the membership status is trialing, active or past_due. Automatic retries follow every payment_retry_interval_days
    calendar days after the previous attempt, up to payment_retry_count retries, and each declined retry records
    its own line with the next attempt_number; a charge to a card the patient updates counts as the next attempt.
    Member benefits continue while past_due. The first attempt that succeeds returns the membership to active for
    the same period, the period's single dues line is then charged, and the period dates do not move. A membership
    may be suspended only when the frozen time is at or after the date of the first declined attempt of the unpaid
    period plus the tier's failed_payment_grace_days calendar days. Day counts are calendar days added to the anchor
    date (the anchor date plus N days is the date N days later), never full 24-hour periods, and the boundary date
    itself counts as within the limit. Benefits are unavailable while suspended. A suspended membership is reactivated
    when the patient pays dues for a new billing period that starts on the reactivation date (reactivation_new_period);
    the unpaid period is never charged and membership_year_start does not change. A suspended membership may be
    closed by the system only when the frozen time is at or after its suspended_date plus the tier's suspended_auto_cancel_days
    calendar days.
  eligibility:
  - id: attempt_state
    applies_to:
    - membership_payment_failed
    kind: state
    condition: A declined attempt may be recorded only while the membership status is trialing, active or past_due.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
  - id: grace_elapsed
    applies_to:
    - membership_suspended
    kind: time
    condition: A membership may be suspended only when the frozen time is at or after the date of the first declined
      attempt of the unpaid period plus the tier's failed_payment_grace_days calendar days.
    evidence_fields:
    - membership_charges.charge_date
    - membership_charges.attempt_number
    - membership_charges.period_start
    - membership_charges.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_charges.membership_id
      action_bindings:
        membership_charges.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date of the first declined attempt of the unpaid period
      anchor_source: membership_charges.charge_date
      relation: not_before
      duration_source: variants.failed_payment_grace_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  - id: suspension_elapsed
    applies_to:
