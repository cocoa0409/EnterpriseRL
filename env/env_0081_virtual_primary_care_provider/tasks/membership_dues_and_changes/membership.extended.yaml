- id: membership_evt_credits
  subject:
  - membership_credit_issued
  - membership_credit_applied
  - membership_credit_expired
  rule: Account credit is non-cash value applied only to dues and upgrade proration lines of the same membership.
    A referral credit of the referring membership's referral_credit_amount is issued when a patient whose membership
    names that referrer in referred_by_customer_id has the first dues line of a first paid period charged successfully.
    A referral credit may be issued only when no referral credit already exists for the same referred patient. A
    credit may be issued only while the receiving membership status is active or past_due. A referral is refused
    when membership_msr_referral_credits_year has already reached referral_credits_max_per_membership_year. A goodwill
    credit of goodwill_credit_per_provider_cancellation compensates one visit that Larkspur cancelled. A goodwill
    credit may be issued only for a visit appointment of the member whose status is provider_cancelled. A goodwill
    credit may be issued only when no goodwill credit already exists for the same visit appointment. The goodwill
    credit is reduced to the room left when membership_msr_goodwill_year plus the credit would exceed goodwill_credit_cap_per_membership_year,
    and nothing is issued when no room is left. Tiers whose caps are zero receive no credit. Every credit expires
    credit_expiry_months calendar months after its credit_date. Month counts are calendar months added to the anchor
    date; when that day does not exist in the target month the last day of that month is used, and the boundary
    date itself counts as reached. A credit may be applied only when the charge date is earlier than its credit_date
    plus credit_expiry_months calendar months. On the expiry date, or on the cancellation date if earlier, an expired
    line records the unused remainder of the credit. Annual caps reset at each membership_year_start under membership_year_basis.
  eligibility:
  - id: one_referral_credit
    applies_to:
    - membership_credit_issued
    kind: dedup
    condition: A referral credit may be issued only when no referral credit already exists for the same referred
      patient.
    evidence_fields:
    - membership_credits.referred_customer_id
    - membership_credits.credit_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_credits.referred_customer_id
      action_bindings:
        membership_credits.referred_customer_id: referred_customer_id
    dedup_contract:
      table: membership_credits
      mode: separate_record
      object_bindings:
        referred_customer_id: referred_customer_id
      duplicate_filters:
        credit_reason:
        - referral
      distinct_fields: []
  - id: one_goodwill_per_visit
    applies_to:
    - membership_credit_issued
    kind: dedup
    condition: A goodwill credit may be issued only when no goodwill credit already exists for the same visit appointment.
    evidence_fields:
    - membership_credits.related_visit_id
    - membership_credits.credit_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_credits.related_visit_id
      action_bindings:
        membership_credits.related_visit_id: related_visit_id
    dedup_contract:
      table: membership_credits
      mode: separate_record
      object_bindings:
        related_visit_id: related_visit_id
      duplicate_filters:
        credit_reason:
        - goodwill
      distinct_fields: []
  - id: visit_provider_cancelled
    applies_to:
    - membership_credit_issued
    kind: state
    condition: A goodwill credit may be issued only for a visit appointment of the member whose status is provider_cancelled.
    evidence_fields:
    - visit_appointments.status
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    state_contract:
      field: visit_appointments.status
      allowed:
      - provider_cancelled
  - id: receiving_membership_open
    applies_to:
    - membership_credit_issued
    kind: state
    condition: A credit may be issued only while the receiving membership status is active or past_due.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - active
      - past_due
  - id: credit_not_expired
    applies_to:
    - membership_credit_applied
    kind: time
    condition: A credit may be applied only when the charge date is earlier than its credit_date plus credit_expiry_months
      calendar months.
    evidence_fields:
    - membership_credits.credit_date
    - membership_credits.mem_credit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_credits.mem_credit_id
      action_bindings:
        membership_credits.mem_credit_id: mem_credit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: its credit_date
      anchor_source: membership_credits.credit_date
      relation: not_after
      duration_source: variants.credit_expiry_months
      unit: calendar_months
      counting_rule: Month counts are calendar months added to the anchor date; when that day does not exist in
        the target month the last day of that month is used, and the boundary date itself counts as reached.
      boundary: exclusive
