- id: membership_sponsor_coordination
  subject:
  - membership_enrolled
  - membership_dues_charged
  - membership_cancelled
  - membership_dues_refunded
  rule: 'A Larkspur at Work enrollment and a paid consumer membership are never in force at the same time. When
    a Larkspur at Work enrollment of the patient becomes active while the patient holds a paid membership, the patient
    may cancel the membership effective on the sponsor coverage_start_date even on an end_of_period tier, and the
    refund follows sponsor_overlap_refund_basis instead of the ordinary refund order: the gross amount of the current
    period''s dues or proration line multiplied by the unused days and divided by the period days, unused days counted
    from the sponsor coverage_start_date to current_period_end; this refund applies to monthly tiers as well and
    carries refund_reason sponsor_overlap. The sponsor overlap refund applies only when the patient''s Larkspur
    at Work enrollment status is active. A patient whose Larkspur at Work enrollment ended may enroll as an employer_conversion.
    A conversion enrollment requires that the Larkspur at Work enrollment it converts from has status ended. An
    enrollment counts as an employer_conversion only when the enrolled date is no more than sponsor_conversion_window_days
    calendar days after that enrollment''s coverage_end_date. Day counts are calendar days added to the anchor date
    (the anchor date plus N days is the date N days later), never full 24-hour periods, and the boundary date itself
    counts as within the limit. The first dues line of a conversion is the tier''s dues_amount reduced by sponsor_conversion_first_period_discount_pct
    percent and rounded half up to the cent; open credit then applies to the reduced amount, a conversion never
    receives a free trial, and every later period is charged at the full dues_amount.'
  eligibility:
  - id: conversion_window
    applies_to:
    - membership_enrolled
    - membership_dues_charged
    kind: time
    condition: An enrollment counts as an employer_conversion only when the enrolled date is no more than sponsor_conversion_window_days
      calendar days after that enrollment's coverage_end_date.
    evidence_fields:
    - sponsor_enrollments.coverage_end_date
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    temporal_basis:
      clock: frozen_time
      anchor_event: that enrollment's coverage_end_date
      anchor_source: sponsor_enrollments.coverage_end_date
      relation: not_after
      duration_source: variants.sponsor_conversion_window_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  - id: converted_from_ended
    applies_to:
    - membership_enrolled
    kind: state
    condition: A conversion enrollment requires that the Larkspur at Work enrollment it converts from has status
      ended.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - ended
  - id: overlap_sponsor_active
    applies_to:
    - membership_cancelled
    - membership_dues_refunded
    kind: state
    condition: The sponsor overlap refund applies only when the patient's Larkspur at Work enrollment status is
      active.
    evidence_fields:
    - sponsor_enrollments.status
    - sponsor_enrollments.enrollment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - sponsor_enrollments.enrollment_id
      action_bindings:
        sponsor_enrollments.enrollment_id: enrollment_id
    state_contract:
      field: sponsor_enrollments.status
      allowed:
      - active
  formula:
    amount: round(dues_amount * (100 - sponsor_conversion_first_period_discount_pct) / 100, 2)
- id: membership_notices
  subject:
  - membership_renewal_notice_sent
  - membership_trial_reminder_sent
  - membership_auto_renew_changed
  - membership_term_expired
  rule: Before every annual renewal a renewal notice is sent on each channel in the tier's notice_channels, no more
    than renewal_notice_max_days_before and at least renewal_notice_min_days_before calendar days before current_period_end,
    with one notice record per channel carrying the renewal date as period_start. Tiers whose notice days are zero
    (the monthly tiers and Larkspur Access) send no renewal notice. A trial reminder is sent trial_reminder_days_before_end
    calendar days before trial_end_date on each channel in notice_channels. Auto-renew may be changed only while
    the membership status is trialing, active, past_due or paused. Turning auto-renew off is registered as a membership
    request of type auto_renew_off effective at once; the membership then closes at current_period_end with no renewal
    and no refund, and turning it back on before that date restores renewal. A missing or late renewal notice does
    not stop the renewal; its only consequence is the waiver in the cancellation refund rule.
  eligibility:
  - id: auto_renew_change_state
    applies_to:
    - membership_auto_renew_changed
    kind: state
    condition: Auto-renew may be changed only while the membership status is trialing, active, past_due or paused.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
      - paused
- id: membership_clinician_assignment
  subject:
  - membership_clinician_assigned
  rule: Only a tier whose dedicated_clinician is true has a named primary clinician; the first assignment is made
    on activation, on trial start, or when the member upgrades to such a tier, and is not limited by the wait. A
    clinician may be assigned only while the membership status is trialing, active or past_due. A member may switch
    to a different primary clinician only when the frozen time is at or after clinician_assigned_date plus clinician_change_wait_days
    calendar days. Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
    N days later), never full 24-hour periods, and the boundary date itself counts as within the limit. A downgrade
    to a tier without a dedicated clinician clears primary_clinician and clinician_assigned_date when it takes effect.
  eligibility:
  - id: clinician_state
    applies_to:
    - membership_clinician_assigned
    kind: state
    condition: A clinician may be assigned only while the membership status is trialing, active or past_due.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
  - id: clinician_wait
    applies_to:
    - membership_clinician_assigned
    kind: time
    condition: A member may switch to a different primary clinician only when the frozen time is at or after clinician_assigned_date
      plus clinician_change_wait_days calendar days.
    evidence_fields:
    - membership_holdings.clinician_assigned_date
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: clinician_assigned_date
      anchor_source: membership_holdings.clinician_assigned_date
      relation: not_before
      duration_source: variants.clinician_change_wait_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
- id: membership_billing_corrections
  subject:
  - membership_dues_refunded
  - membership_chargeback_recorded
  - membership_chargeback_suspended
  rule: A billing error is a dues, enrollment-fee or proration line whose amount differs from what the charter prices
    for the tier and period it covers; the error is corrected by a refund of the overcharged difference with refund_reason
    billing_error, and an undercharge is never re-billed. A billing-error refund may be issued only while the membership
    status is active, past_due, paused, suspended or cancelled. A line may be refunded or charged back only when
    no refund or chargeback line already points to it. When the patient's card issuer reverses a membership line
    through a chargeback (chargeback_action suspend), the reversal is recorded against that line and the membership
    is suspended on the chargeback date; the reversed line is never also refunded, and the membership is reactivated
    only by paying a new billing period as for any suspension.
  eligibility:
  - id: one_reversal_per_line
    applies_to:
    - membership_dues_refunded
    - membership_chargeback_recorded
    kind: dedup
    condition: A line may be refunded or charged back only when no refund or chargeback line already points to it.
    evidence_fields:
    - membership_charges.original_charge_id
    - membership_charges.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_charges.original_charge_id
      action_bindings:
        membership_charges.original_charge_id: original_charge_id
    dedup_contract:
      table: membership_charges
      mode: separate_record
      object_bindings:
        original_charge_id: original_charge_id
      duplicate_filters:
        event_type:
        - membership_dues_refunded
        - membership_chargeback_recorded
      distinct_fields: []
  - id: refund_state
    applies_to:
    - membership_dues_refunded
    kind: state
    condition: A billing-error refund may be issued only while the membership status is active, past_due, paused,
      suspended or cancelled.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - active
      - past_due
      - paused
      - suspended
      - cancelled
extended_policies:
- id: membership_ext_superseded_tier_correction
  base_policy_refs:
  - membership_billing_corrections
  - membership_tier_change
  - membership_cancellation_refund
  - membership_sponsor_coordination
  - membership_evt_dues_billing
  overwrite:
  - base_policy: membership_cancellation_refund
    superseded_clause: A full refund of the first paid period may be issued only when the cancellation request date
      is no more than full_refund_window_days calendar days after the membership's activated_date.
    replaced_by: The full refund window of the first paid period and the renewal refund window limit only refunds
      made on a cancellation, and neither window limits a superseded-tier correction.
  - base_policy: membership_cancellation_refund
    superseded_clause: A full refund of a renewal charge may be issued only when the cancellation request date is
      no more than renewal_refund_window_days calendar days after the charge date of that renewal dues line.
    replaced_by: The full refund window of the first paid period and the renewal refund window limit only refunds
      made on a cancellation, and neither window limits a superseded-tier correction.
  - base_policy: membership_sponsor_coordination
    superseded_clause: The sponsor overlap refund applies only when the patient's Larkspur at Work enrollment status
      is active.
    replaced_by: The sponsor overlap refund keeps its own condition on the Larkspur at Work enrollment status and
      never governs a superseded-tier correction.
  - base_policy: membership_tier_change
    superseded_clause: 'A downgrade, and a cycle switch from annual to monthly, takes effect on current_period_end:
      it is recorded as a pending request with that effective date, the membership renews at the new tier on that
      date, and nothing is refunded for the current period.'
    replaced_by: A downgrade or cycle switch from annual to monthly still takes effect on current_period_end and
      the membership renews at the new tier on that date with nothing refunded for the period it ends; where the
      request was left pending past that date, the correction applies it late and refunds as stated here.
  trigger: state_due
  subject:
  - membership_dues_refunded
  - membership_tier_changed
  computes: refund_amount
  target_tool: correct_superseded_tier_billing_563ffb83
  params:
    dues_access: 0.0
    dues_essentials_monthly: 12.99
    dues_essentials_annual: 129.0
    dues_plus_monthly: 29.99
    dues_plus_annual: 299.0
    bh_session_netting: 95.0
    lab_panel_netting: 24.0
    expedited_shipping_netting: 9.95
    value_core_extra_pct: 10.0
    value_core_premier_paid_pct: 70.0
    extended_extra_pct: 10.0
    extended_premier_paid_pct: 75.0
  rule: >-
    A superseded-tier correction applies to the current period's dues line, the membership_dues_charged line whose
    period_start equals the membership's current_period_start, and the line's amount is the dues charged on the membership_dues_charged lines for that period_start. The billing-error refund on a dues line is the line's
    amount less the price the charter gives for that line, never below 0.00, rounded half up to the cent after the
    full computation. The price the charter gives for a dues line is the dues_amount of the tier the line names, which
    is the line's own amount. Every adjustment stated below for a superseded-tier correction is subtracted from that
    difference, each computed to the cent first, before the floor and the rounding are applied. Where a membership
    request with request_status pending has an effective_date equal to the current period's period_start, the price
    the charter gives for that line is instead the dues_amount of the tier the request names (Larkspur Access,
    Larkspur Essentials Monthly, Larkspur Essentials Annual, Larkspur Plus Monthly or Larkspur Plus Annual), and where
    no such pending request exists the line keeps its own amount. A record counts as dated in the month before the
    correction date when its date is not after the correction date and adding one calendar month to it, keeping the
    day number and treating a day number the later month lacks as falling after that month's last day, gives a date
    after the correction date. Behavioral health sessions taken on the higher tier are netted as follows: when the
    current period's dues line names Larkspur Premier Annual and two or more Behavioral Health Follow-Up Sessions with
    status completed and payment_path membership_included have a completed_date in the month before the correction
    date, twice bh_session_netting is subtracted; when that line names Larkspur Premier Annual and exactly one such
    session does, bh_session_netting is subtracted once; otherwise no session amount is subtracted. Lab panels taken
    on the higher tier are netted as follows: when the current period's dues line names Larkspur Premier Annual and
    two or more lab orders of this membership with status reviewed and payment_path membership_included have an
    ordered_date in the month before the correction date, twice lab_panel_netting is subtracted; when that line names
    Larkspur Premier Annual and exactly one such order does, lab_panel_netting is subtracted once; otherwise no panel
    amount is subtracted. Expedited pharmacy shipping taken on the higher tier is netted as follows: when the current
    period's dues line names Larkspur Premier Annual and two or more Larkspur Pharmacy fills dispensed with
    shipping_speed expedited have a fill_date in the month before the correction date, twice
    expedited_shipping_netting is subtracted; when that line names Larkspur Premier Annual and exactly one such fill
    does, expedited_shipping_netting is subtracted once; otherwise no shipping amount is subtracted. The extra
    Premier cash discount on pharmacy fills is netted as follows: the fill charges posted at price_basis
    cash_member_price in the month before the correction date are added up; when the current period's dues line names
    Larkspur Premier Annual and the patient's prescription with status active is at Larkspur Rx Value Generics or
    Larkspur Rx Core Generics, that total multiplied by value_core_extra_pct and divided by value_core_premier_paid_pct
    is subtracted; when that line names Larkspur Premier Annual and the active prescription is at Larkspur Rx Extended
    Generics, that total multiplied by extended_extra_pct and divided by extended_premier_paid_pct is subtracted;
    otherwise no discount amount is subtracted; the discount amount is rounded half up to the cent. The correction
    applies the pending request on the correction date, moving the membership to the tier the request names and
    marking the request applied, and books the refund as one line pointing to the current period's dues line with
    refund_reason billing_error; when the refund is 0.00 no refund line is written and the request is still applied.
    The full refund window of the first paid period and the renewal refund window limit only refunds made on a
    cancellation, and neither window limits a superseded-tier correction. The sponsor overlap refund keeps its own
    condition on the Larkspur at Work enrollment status and never governs a superseded-tier correction. A downgrade or
    cycle switch from annual to monthly still takes effect on current_period_end and the membership renews at the new
    tier on that date with nothing refunded for the period it ends; where the request was left pending past that
    date, the correction applies it late and refunds as stated here.
  prerequisite: []
  cross_category:
  - category: visit
    as: history
    reads: [visit_appointments.status, visit_appointments.payment_path, visit_appointments.variant_name, visit_appointments.completed_date]
    note: decides the session netting tier from completed membership-included Behavioral Health Follow-Up Sessions.
  - category: lab
    as: history
    reads: [lab_orders.status, lab_orders.payment_path, lab_orders.membership_id, lab_orders.ordered_date]
    note: decides the panel netting tier from reviewed membership-included lab orders of this membership.
  - category: rx
    as: history
    reads: [rx_fills.shipping_speed, rx_fills.fill_date, rx_charges.price_basis, rx_charges.amount, rx_prescriptions.variant_name]
    note: decides the shipping netting tier and the discount netting method from fills, fill charges and the active prescription level.
  compute:
  - line_amount: SUM('membership_charges','amount', event_type='membership_dues_charged', period_start=F('current_period_start'))
  - line_tier: LATEST('membership_charges','tier_charged', date_field='charge_date', event_type='membership_dues_charged', period_start=F('current_period_start'))
  - pending_target: LATEST('membership_requests','target_variant_name', date_field='requested_date', request_status='pending', effective_date=F('current_period_start'))
  - superseded_price: K('dues_access') if pending_target == 'Larkspur Access' else (K('dues_essentials_monthly') if pending_target == 'Larkspur Essentials Monthly' else (K('dues_essentials_annual') if pending_target == 'Larkspur Essentials Annual' else (K('dues_plus_monthly') if pending_target == 'Larkspur Plus Monthly' else (K('dues_plus_annual') if pending_target == 'Larkspur Plus Annual' else line_amount))))
  - bh_sessions_taken: XCOUNT('visit','visit_appointments', within_months=1, date_field='completed_date', status='completed', payment_path='membership_included', variant_name='Behavioral Health Follow-Up Session')
  - session_netting: 2 * K('bh_session_netting') if (line_tier == 'Larkspur Premier Annual' and bh_sessions_taken >= 2) else (K('bh_session_netting') if (line_tier == 'Larkspur Premier Annual' and bh_sessions_taken == 1) else 0)
  - panels_taken: XCOUNT('lab','lab_orders', within_months=1, date_field='ordered_date', status='reviewed', payment_path='membership_included', membership_id=HID)
  - panel_netting: 2 * K('lab_panel_netting') if (line_tier == 'Larkspur Premier Annual' and panels_taken >= 2) else (K('lab_panel_netting') if (line_tier == 'Larkspur Premier Annual' and panels_taken == 1) else 0)
  - expedited_fills: XCOUNT('rx','rx_fills', within_months=1, date_field='fill_date', event_type='rx_fill_dispensed', shipping_speed='expedited')
  - shipping_netting: 2 * K('expedited_shipping_netting') if (line_tier == 'Larkspur Premier Annual' and expedited_fills >= 2) else (K('expedited_shipping_netting') if (line_tier == 'Larkspur Premier Annual' and expedited_fills == 1) else 0)
  - member_price_fill_total: XSUM('rx','rx_charges','amount', within_months=1, date_field='charge_date', event_type='rx_fill_charged', price_basis='cash_member_price')
  - active_rx_level: CFIELD('rx','variant_name', status='active')
  - discount_netting: RND(member_price_fill_total * K('value_core_extra_pct') / K('value_core_premier_paid_pct') + 0.000000001, 2) if (line_tier == 'Larkspur Premier Annual' and (active_rx_level == 'Larkspur Rx Value Generics' or active_rx_level == 'Larkspur Rx Core Generics')) else (RND(member_price_fill_total * K('extended_extra_pct') / K('extended_premier_paid_pct') + 0.000000001, 2) if (line_tier == 'Larkspur Premier Annual' and active_rx_level == 'Larkspur Rx Extended Generics') else 0)
  - result: MX(0, RND(line_amount - superseded_price - session_netting - panel_netting - shipping_netting - discount_netting + 0.000000001, 2))
  compute_basis:
    line_amount: A superseded-tier correction applies to the current period's dues line, the membership_dues_charged line whose period_start equals the membership's current_period_start, and the line's amount is the dues charged on the membership_dues_charged lines for that period_start.
    line_tier: The price the charter gives for a dues line is the dues_amount of the tier the line names, which is the line's own amount.
    pending_target: Where a membership request with request_status pending has an effective_date equal to the current period's period_start, the price the charter gives for that line is instead the dues_amount of the tier the request names (Larkspur Access, Larkspur Essentials Monthly, Larkspur Essentials Annual, Larkspur Plus Monthly or Larkspur Plus Annual), and where no such pending request exists the line keeps its own amount.
    superseded_price: Where a membership request with request_status pending has an effective_date equal to the current period's period_start, the price the charter gives for that line is instead the dues_amount of the tier the request names (Larkspur Access, Larkspur Essentials Monthly, Larkspur Essentials Annual, Larkspur Plus Monthly or Larkspur Plus Annual), and where no such pending request exists the line keeps its own amount.
    bh_sessions_taken: A record counts as dated in the month before the correction date when its date is not after the correction date and adding one calendar month to it, keeping the day number and treating a day number the later month lacks as falling after that month's last day, gives a date after the correction date.
    session_netting: 'Behavioral health sessions taken on the higher tier are netted as follows: when the current period''s dues line names Larkspur Premier Annual and two or more Behavioral Health Follow-Up Sessions with status completed and payment_path membership_included have a completed_date in the month before the correction date, twice bh_session_netting is subtracted; when that line names Larkspur Premier Annual and exactly one such session does, bh_session_netting is subtracted once; otherwise no session amount is subtracted.'
    panels_taken: A record counts as dated in the month before the correction date when its date is not after the correction date and adding one calendar month to it, keeping the day number and treating a day number the later month lacks as falling after that month's last day, gives a date after the correction date.
    panel_netting: 'Lab panels taken on the higher tier are netted as follows: when the current period''s dues line names Larkspur Premier Annual and two or more lab orders of this membership with status reviewed and payment_path membership_included have an ordered_date in the month before the correction date, twice lab_panel_netting is subtracted; when that line names Larkspur Premier Annual and exactly one such order does, lab_panel_netting is subtracted once; otherwise no panel amount is subtracted.'
    expedited_fills: A record counts as dated in the month before the correction date when its date is not after the correction date and adding one calendar month to it, keeping the day number and treating a day number the later month lacks as falling after that month's last day, gives a date after the correction date.
    shipping_netting: 'Expedited pharmacy shipping taken on the higher tier is netted as follows: when the current period''s dues line names Larkspur Premier Annual and two or more Larkspur Pharmacy fills dispensed with shipping_speed expedited have a fill_date in the month before the correction date, twice expedited_shipping_netting is subtracted; when that line names Larkspur Premier Annual and exactly one such fill does, expedited_shipping_netting is subtracted once; otherwise no shipping amount is subtracted.'
    member_price_fill_total: 'The extra Premier cash discount on pharmacy fills is netted as follows: the fill charges posted at price_basis cash_member_price in the month before the correction date are added up;'
    active_rx_level: when the current period's dues line names Larkspur Premier Annual and the patient's prescription with status active is at Larkspur Rx Value Generics or Larkspur Rx Core Generics, that total multiplied by value_core_extra_pct and divided by value_core_premier_paid_pct is subtracted;
    discount_netting: when the current period's dues line names Larkspur Premier Annual and the patient's prescription with status active is at Larkspur Rx Value Generics or Larkspur Rx Core Generics, that total multiplied by value_core_extra_pct and divided by value_core_premier_paid_pct is subtracted; when that line names Larkspur Premier Annual and the active prescription is at Larkspur Rx Extended Generics, that total multiplied by extended_extra_pct and divided by extended_premier_paid_pct is subtracted; otherwise no discount amount is subtracted; the discount amount is rounded half up to the cent.
    result: Every adjustment stated below for a superseded-tier correction is subtracted from that difference, each computed to the cent first, before the floor and the rounding are applied.
  factors:
  - id: superseded_tier_price
    effect: parameter
    decides: superseded_price
    bindings: [pending_target, superseded_price]
    ladder:
    - when: a pending membership request effective on the current period's period_start names Larkspur Access
      value: K('dues_access')
    - when: such a pending request names Larkspur Essentials Monthly
      value: K('dues_essentials_monthly')
    - when: such a pending request names Larkspur Essentials Annual
      value: K('dues_essentials_annual')
    - when: such a pending request names Larkspur Plus Monthly
      value: K('dues_plus_monthly')
    - when: such a pending request names Larkspur Plus Annual
      value: K('dues_plus_annual')
    - when: otherwise (no pending request effective on that period_start)
      value: the line's own amount
    baseline:
      superseded_price: line_amount
    evidence: [history]
    cross_difficulty: null
  - id: premier_session_netting
    effect: parameter
    decides: session_netting
    bindings: [bh_sessions_taken, session_netting]
    ladder:
    - when: the current period's dues line names Larkspur Premier Annual and two or more membership-included Behavioral Health Follow-Up Sessions were completed in the month before the correction date
      value: 2 * K('bh_session_netting')
    - when: that line names Larkspur Premier Annual and exactly one such session was completed in that month
      value: K('bh_session_netting')
    - when: otherwise
      value: '0'
    baseline:
      session_netting: '0'
    evidence: [history, cross_category]
    cross_difficulty: visit
  - id: premier_panel_netting
    effect: parameter
    decides: panel_netting
    bindings: [panels_taken, panel_netting]
    ladder:
    - when: the current period's dues line names Larkspur Premier Annual and two or more reviewed membership-included lab orders of this membership were ordered in the month before the correction date
      value: 2 * K('lab_panel_netting')
    - when: that line names Larkspur Premier Annual and exactly one such order was placed in that month
      value: K('lab_panel_netting')
    - when: otherwise
      value: '0'
    baseline:
      panel_netting: '0'
    evidence: [history, cross_category]
    cross_difficulty: lab
  - id: premier_shipping_netting
    effect: parameter
    decides: shipping_netting
    bindings: [expedited_fills, shipping_netting]
    ladder:
    - when: the current period's dues line names Larkspur Premier Annual and two or more fills were dispensed with expedited shipping in the month before the correction date
      value: 2 * K('expedited_shipping_netting')
    - when: that line names Larkspur Premier Annual and exactly one such fill was dispensed in that month
      value: K('expedited_shipping_netting')
    - when: otherwise
      value: '0'
    baseline:
      shipping_netting: '0'
    evidence: [history, cross_category]
    cross_difficulty: rx
  - id: premier_discount_netting
    effect: method
    decides: discount_netting
    bindings: [member_price_fill_total, active_rx_level, discount_netting]
    ladder:
    - when: the current period's dues line names Larkspur Premier Annual and the active prescription is at Larkspur Rx Value Generics or Larkspur Rx Core Generics
      method: the month's member-price fill charges times value_core_extra_pct divided by value_core_premier_paid_pct, rounded half up to the cent
    - when: that line names Larkspur Premier Annual and the active prescription is at Larkspur Rx Extended Generics
      method: the month's member-price fill charges times extended_extra_pct divided by extended_premier_paid_pct, rounded half up to the cent
    - when: otherwise
      method: no discount amount is netted
    baseline:
      discount_netting: '0'
    evidence: [history, cross_category]
    cross_difficulty: rx
  baseline:
    rule: The billing-error refund on a dues line is the line's amount less the price the charter gives for that line, never below 0.00, rounded half up to the cent after the full computation. The price the charter gives for a dues line is the dues_amount of the tier the line names, which is the line's own amount. Every adjustment stated below for a superseded-tier correction is subtracted from that difference, each computed to the cent first, before the floor and the rounding are applied.
    params: [dues_amount]
  inputs:
    history:
    - {table: membership_charges, aggregate: sum, field: amount, filters: {event_type: membership_dues_charged}}
    - {table: membership_requests, aggregate: latest, field: target_variant_name, filters: {request_status: pending}}
    - {category: visit, table: visit_appointments, aggregate: count, field: visit_id, within_months: 1, filters: {status: completed, payment_path: membership_included, variant_name: Behavioral Health Follow-Up Session}}
    - {category: lab, table: lab_orders, aggregate: count, field: lab_order_id, within_months: 1, filters: {status: reviewed, payment_path: membership_included}}
    - {category: rx, table: rx_fills, aggregate: count, field: rx_fill_id, within_months: 1, filters: {event_type: rx_fill_dispensed, shipping_speed: expedited}}
    - {category: rx, table: rx_charges, aggregate: sum, field: amount, within_months: 1, filters: {event_type: rx_fill_charged, price_basis: cash_member_price}}
    cross_category: [visit, lab, rx]
- id: membership_ext_cancellation_settlement
  base_policy_refs:
  - membership_cancellation_refund
  - membership_sponsor_coordination
  - membership_billing_corrections
  - membership_evt_credits
  overwrite:
  - base_policy: membership_cancellation_refund
    superseded_clause: A full refund of the first paid period may be issued only when the cancellation request date
      is no more than full_refund_window_days calendar days after the membership's activated_date.
    replaced_by: The request date falls within the refund window when the current period is the first paid period
      (current_period_start equals activated_date) and the request date is no more than full_refund_window_days
      calendar days after activated_date, or when the current period is a later period and the request date is no
      more than renewal_refund_window_days calendar days after the line's charge_date.
  - base_policy: membership_cancellation_refund
    superseded_clause: the first period's dues line is then refunded in full, together with the enrollment fee line
      where enrollment_fee_refundable_in_window is true.
    replaced_by: The cancellation refund is the refund basis amount, capped at the cash collected on the current
      period's line, then reduced by every amount the rules below subtract, never below 0.00, rounded half up to the
      cent after the full computation.
  - base_policy: membership_cancellation_refund
    superseded_clause: the renewal dues line is then refunded in full.
    replaced_by: The cancellation refund is the refund basis amount, capped at the cash collected on the current
      period's line, then reduced by every amount the rules below subtract, never below 0.00, rounded half up to the
      cent after the full computation.
  - base_policy: membership_cancellation_refund
    superseded_clause: Third, under post_window_refund_method unused_full_months the refund equals the whole unused
      months multiplied by proration_monthly_rate, where whole unused months is the largest number of calendar months
      that can be added to the request date without passing current_period_end, capped at the gross amount of the
      current period's dues or proration line; under none nothing is refunded.
    replaced_by: By the standard method the refund basis amount is the whole unused months multiplied by the tier's
      proration_monthly_rate, where whole unused months is the number of calendar months from the request date to
      current_period_end, less one when the day number of current_period_end is smaller than the day number of the
      request date.
  - base_policy: membership_cancellation_refund
    superseded_clause: Month counts are calendar months added to the anchor date; when that day does not exist in
      the target month the last day of that month is used, and the boundary date itself counts as reached.
    replaced_by: By the standard method the refund basis amount is the whole unused months multiplied by the tier's
      proration_monthly_rate, where whole unused months is the number of calendar months from the request date to
      current_period_end, less one when the day number of current_period_end is smaller than the day number of the
      request date.
  - base_policy: membership_sponsor_coordination
    superseded_clause: 'the refund follows sponsor_overlap_refund_basis instead of the ordinary refund order: the
      gross amount of the current period''s dues or proration line multiplied by the unused days and divided by the
      period days, unused days counted from the sponsor coverage_start_date to current_period_end; this refund applies
      to monthly tiers as well and carries refund_reason sponsor_overlap.'
    replaced_by: when a Larkspur at Work enrollment of the patient has status active and a coverage_start_date on or
      before the request date, it is the line's amount multiplied by the days from that coverage_start_date to
      current_period_end and divided by the days from current_period_start to current_period_end, rounded half up to
      the cent, with refund_reason sponsor_overlap;
  - base_policy: membership_sponsor_coordination
    superseded_clause: The sponsor overlap refund applies only when the patient's Larkspur at Work enrollment status
      is active.
    replaced_by: when a Larkspur at Work enrollment of the patient has status active and a coverage_start_date on or
      before the request date, it is the line's amount multiplied by the days from that coverage_start_date to
      current_period_end and divided by the days from current_period_start to current_period_end, rounded half up to
      the cent, with refund_reason sponsor_overlap;
  - base_policy: membership_billing_corrections
    superseded_clause: A line may be refunded or charged back only when no refund or chargeback line already points
      to it.
    replaced_by: A line may be refunded or charged back only when no refund or chargeback line already points to it,
      except that a cancellation refund may point to a line whose only earlier refunds are billing-error refunds.
  trigger: on_request
  subject:
  - membership_cancelled
  - membership_dues_refunded
  computes: refund_amount
  target_tool: settle_membership_cancellation_8920d9b4
  params:
    lab_panel_recapture: 11.0
    rx_fill_recapture: 6.0
  rule: >-
    This settlement covers the cancellation of an active membership on a tier whose cancellation_effective is
    immediate and whose dues_amount is above zero; every other cancellation follows the base cancellation rule. Only
    the patient ends a membership: after the agent quotes the refund, the patient carries out the cancellation in
    person, which registers a membership request of type cancel with request_status applied, closes the membership as
    cancelled on the request date and books the cancellation refund as one line pointing to the current period's line
    with the refund_reason of the basis that applied; a refund of 0.00 books no line. The cancellation refund is fixed
    only after no downgrade or cycle-switch request of the membership whose effective date has already passed is still
    pending. The current period's line is the membership_upgrade_proration_charged line of this membership whose
    period_start equals current_period_start, or, when there is none, the membership_dues_charged line whose
    period_start equals current_period_start. The cancellation refund is the refund basis amount, capped at the cash
    collected on the current period's line, then reduced by every amount the rules below subtract, never below 0.00,
    rounded half up to the cent after the full computation. The cash collected on the current period's line is the
    line's amount less every part of it that the rules below exclude from a cash refund. By the standard method the
    refund basis amount is the whole unused months multiplied by the tier's proration_monthly_rate, where whole unused
    months is the number of calendar months from the request date to current_period_end, less one when the day number
    of current_period_end is smaller than the day number of the request date. The request date falls within the refund
    window when the current period is the first paid period (current_period_start equals activated_date) and the
    request date is no more than full_refund_window_days calendar days after activated_date, or when the current period
    is a later period and the request date is no more than renewal_refund_window_days calendar days after the line's
    charge_date. Day counts are the number of calendar days from the earlier date to the later date. The renewal notice
    waiver applies when the current period is a later period, the tier's renewal_notice_missing_waives_visit_condition
    is true and no membership_renewal_notice_sent record exists for the current period_start. The refund basis amount
    instead follows the first of these that holds: when a Larkspur at Work enrollment of the patient has status active
    and a coverage_start_date on or before the request date, it is the line's amount multiplied by the days from that
    coverage_start_date to current_period_end and divided by the days from current_period_start to current_period_end,
    rounded half up to the cent, with refund_reason sponsor_overlap; when no such enrollment exists, the request date
    falls within the refund window and either no visit appointment of the patient with status completed has a
    scheduled_start date on or after the line's charge_date or the renewal notice waiver applies, it is the line's
    whole amount, with refund_reason full_refund_window for the first paid period and renewal_refund_window for a
    later period; otherwise the standard method applies, with refund_reason unused_months. Billing-error refunds
    already pointing to the current period's line are excluded from the cash collected: when they total the line's
    whole amount or more the whole amount is excluded, when they total less the total is excluded, and when there are
    none nothing is excluded. Account credit applied to the current period's line is never paid out and is excluded
    from the cash collected: when the applied credit covers the line's whole amount or more the whole amount is
    excluded, when it covers less the applied credit is excluded, and when none was applied nothing is excluded.
    Larkspur recaptures member benefits taken in the month before the request date, where a record counts as dated in
    that month when its date is not after the request date and adding one calendar month to it, keeping the day number
    and treating a day number the later month lacks as falling after that month's last day, gives a date after the
    request date. Included urgent care is recaptured as follows: when two or more Urgent Care Video Visits of the
    patient with status completed and payment_path membership_included have a completed_date in that month, twice the
    Urgent Care Video Visit list_price is subtracted; when exactly one does, that list_price is subtracted once;
    otherwise no urgent care amount is subtracted. Member lab pricing is recaptured as follows: when two or more lab
    orders of this membership with status reviewed and payment_path membership_included have an ordered_date in that
    month, twice lab_panel_recapture is subtracted; when exactly one does, lab_panel_recapture is subtracted once;
    otherwise no lab amount is subtracted. Member pharmacy pricing is recaptured as follows: when two or more fill
    charges of the patient posted at price_basis cash_member_price have a charge_date in that month, twice
    rx_fill_recapture is subtracted; when exactly one does, rx_fill_recapture is subtracted once; otherwise no pharmacy
    amount is subtracted. A line may be refunded or charged back only when no refund or chargeback line already points
    to it, except that a cancellation refund may point to a line whose only earlier refunds are billing-error refunds.
  prerequisite:
  - problem: membership_ext_superseded_tier_correction
    kind: value_input
    gate: cash_returned
    form: state
    policy_source: The cancellation refund is fixed only after no downgrade or cycle-switch request of the membership
      whose effective date has already passed is still pending.
    condition: no membership_requests row of this membership with request_type downgrade or cycle_switch,
      request_status pending and an effective_date on or before the request date.
    resolved_by: correct_superseded_tier_billing_563ffb83
    effect: the superseded-tier correction applies the pending request and books a billing-error refund pointing to
      the current period's dues line, so the billing-error refunds excluded from the cash collected rise from 0.00 to
      that refund, and the tier whose proration_monthly_rate the standard method reads becomes the requested tier.
  cross_category:
  - category: visit
    as: history
    reads: [visit_appointments.status, visit_appointments.scheduled_start, visit_appointments.completed_date, visit_appointments.payment_path, visit_appointments.variant_name, list_price]
    note: decides the refund basis (completed visit since the line's charge date) and the included urgent care recapture tier.
  - category: lab
    as: history
    reads: [lab_orders.status, lab_orders.payment_path, lab_orders.membership_id, lab_orders.ordered_date]
    note: decides the member lab pricing recapture tier.
  - category: rx
    as: history
    reads: [rx_charges.price_basis, rx_charges.charge_date]
    note: decides the member pharmacy pricing recapture tier.
  - category: sponsor
    as: branch
    reads: [status, coverage_start_date]
    note: decides whether the sponsor overlap basis applies.
  compute:
  - proration_line_amount: LATEST('membership_charges','amount', date_field='charge_date', event_type='membership_upgrade_proration_charged', period_start=F('current_period_start'))
  - dues_line_amount: LATEST('membership_charges','amount', date_field='charge_date', event_type='membership_dues_charged', period_start=F('current_period_start'))
  - line_amount: proration_line_amount if proration_line_amount != None else dues_line_amount
  - proration_line_id: LATEST('membership_charges','mem_charge_id', date_field='charge_date', event_type='membership_upgrade_proration_charged', period_start=F('current_period_start'))
  - dues_line_id: LATEST('membership_charges','mem_charge_id', date_field='charge_date', event_type='membership_dues_charged', period_start=F('current_period_start'))
  - line_id: proration_line_id if proration_line_id != None else dues_line_id
  - proration_line_date: LATEST('membership_charges','charge_date', date_field='charge_date', event_type='membership_upgrade_proration_charged', period_start=F('current_period_start'))
  - dues_line_date: LATEST('membership_charges','charge_date', date_field='charge_date', event_type='membership_dues_charged', period_start=F('current_period_start'))
  - line_charge_date: proration_line_date if proration_line_date != None else dues_line_date
  - first_period: F('current_period_start') == F('activated_date')
  - in_refund_window: (DAYS(F('activated_date'), NOW) <= P('full_refund_window_days')) if first_period else (DAYS(line_charge_date, NOW) <= P('renewal_refund_window_days'))
  - last_completed_start: XLATEST('visit','visit_appointments','scheduled_start', date_field='scheduled_start', status='completed')
  - visit_since_charge: (last_completed_start or '') >= line_charge_date
  - notices_for_period: COUNT('membership_notices', event_type='membership_renewal_notice_sent', period_start=F('current_period_start'))
  - notice_waiver: (not first_period) and notices_for_period == 0 and P('renewal_notice_missing_waives_visit_condition') == True
  - sponsor_status: CFIELD('sponsor','status', status='active')
  - sponsor_start: CFIELD('sponsor','coverage_start_date', status='active')
  - unused_months: MONTHS(NOW, F('current_period_end'))
  - refund_basis: RND(line_amount * DAYS(sponsor_start, F('current_period_end')) / DAYS(F('current_period_start'), F('current_period_end')) + 0.000000001, 2) if (sponsor_status == 'active' and (sponsor_start or '9999-12-31') <= NOW) else (line_amount if (in_refund_window and ((not visit_since_charge) or notice_waiver)) else RND(unused_months * P('proration_monthly_rate') + 0.000000001, 2))
  - billing_error_refunds: 0 - SUM('membership_charges','amount', event_type='membership_dues_refunded', refund_reason='billing_error', original_charge_id=line_id)
  - cash_returned: line_amount if billing_error_refunds >= line_amount else (billing_error_refunds if billing_error_refunds > 0 else 0)
  - credit_on_line: SUM('membership_credits','amount', event_type='membership_credit_applied', applied_charge_id=line_id)
  - credit_excluded: line_amount if credit_on_line >= line_amount else (credit_on_line if credit_on_line > 0 else 0)
  - urgent_care_taken: XCOUNT('visit','visit_appointments', within_months=1, date_field='completed_date', status='completed', payment_path='membership_included', variant_name='Urgent Care Video Visit')
  - urgent_care_list: CPARAM('visit','list_price', variant_name='Urgent Care Video Visit')
  - urgent_care_recapture: 2 * urgent_care_list if urgent_care_taken >= 2 else (urgent_care_list if urgent_care_taken == 1 else 0)
  - member_panels_taken: XCOUNT('lab','lab_orders', within_months=1, date_field='ordered_date', status='reviewed', payment_path='membership_included', membership_id=HID)
  - lab_recapture: 2 * K('lab_panel_recapture') if member_panels_taken >= 2 else (K('lab_panel_recapture') if member_panels_taken == 1 else 0)
  - member_fill_charges: XCOUNT('rx','rx_charges', within_months=1, date_field='charge_date', event_type='rx_fill_charged', price_basis='cash_member_price')
  - pharmacy_recapture: 2 * K('rx_fill_recapture') if member_fill_charges >= 2 else (K('rx_fill_recapture') if member_fill_charges == 1 else 0)
  - result: MX(0, RND(MN(refund_basis, line_amount - cash_returned - credit_excluded) - urgent_care_recapture - lab_recapture - pharmacy_recapture + 0.000000001, 2))
  compute_basis:
    proration_line_amount: The current period's line is the membership_upgrade_proration_charged line of this membership whose period_start equals current_period_start, or, when there is none, the membership_dues_charged line whose period_start equals current_period_start.
