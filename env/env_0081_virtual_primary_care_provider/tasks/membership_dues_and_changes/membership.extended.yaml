  params:
    per_tier:
      Larkspur Access:
        pause_allowed: =pause_allowed
        pause_max_months_per_membership_year: =pause_max_months_per_membership_year
        pause_hold_fee_per_month: =pause_hold_fee_per_month
      Larkspur Essentials Monthly:
        pause_allowed: =pause_allowed
        pause_max_months_per_membership_year: =pause_max_months_per_membership_year
        pause_hold_fee_per_month: =pause_hold_fee_per_month
      Larkspur Essentials Annual:
