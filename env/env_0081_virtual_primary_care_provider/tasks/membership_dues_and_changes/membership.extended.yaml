- id: membership_ext_premier_upgrade_charge
  base_policy_refs:
  - membership_tier_change
  overwrite:
  - base_policy: membership_tier_change
    superseded_clause: the upgrade proration line charges the new tier's dues_amount less the unused value of the current
      period, never below 0.00.
    replaced_by: The upgrade charge is the premier_annual_dues of Larkspur Premier Annual less the upgrade credit, never
      below 0.00, rounded half up to the cent.
  - base_policy: membership_tier_change
    superseded_clause: The unused value is the gross amount of the current period's dues or proration line multiplied
      by the unused days and divided by the period days, where unused days run from the change date to current_period_end
      and period days from current_period_start to current_period_end; a period paid entirely by a conversion discount
      or with no line (Larkspur Access) has an unused value of 0.00.
    replaced_by: By the standard method the upgrade credit is the amount of the current period's lines multiplied by the
      unused days and divided by the period days, where unused days run from the change date to current_period_end and
      period days from current_period_start to current_period_end, rounded half up to the cent; a period with no line
      has an upgrade credit of 0.00.
  trigger: on_request
  subject:
  - membership_tier_changed
  - membership_upgrade_proration_charged
  computes: proration_amount
  target_tool: apply_tier_upgrade_8d7c34c0
  params:
    premier_annual_dues: 899.0
    upgrade_uc_recapture: 45.0
    upgrade_pc_recapture: 40.0
    upgrade_member_rate_recapture: 15.0
    upgrade_lab_recapture: 11.0
    upgrade_rx_recapture: 6.0
  rule: >-
    This rule prices an immediate upgrade of an active membership to Larkspur Premier Annual; an upgrade to any other
    tier follows the base tier-change rule. The upgrade charge is fixed only after the current period's dues line is
    charged and the membership status is active. The upgrade is recorded as an applied membership request of type
    upgrade, a new billing period at Larkspur Premier Annual starts on the change date, and the upgrade proration line
    books the charge. The upgrade charge is the premier_annual_dues of Larkspur Premier Annual less the upgrade credit,
    never below 0.00, rounded half up to the cent. The current period's lines are the membership_dues_charged and
    membership_upgrade_proration_charged lines whose period_start equals current_period_start, their amount being the
    total of those lines and their charge_date the latest charge_date among them. By the standard method the upgrade
    credit is the amount of the current period's lines multiplied by the unused days and divided by the period days,
    where unused days run from the change date to current_period_end and period days from current_period_start to
    current_period_end, rounded half up to the cent; a period with no line has an upgrade credit of 0.00. Every amount
    the rules below recapture is subtracted from the upgrade credit, which never falls below 0.00. The upgrade credit
    instead follows the first of these that holds: when the change date is no more than renewal_refund_window_days
    calendar days after the lines' charge_date (no more than full_refund_window_days calendar days after activated_date
    when current_period_start equals activated_date) and no visit appointment of the patient with status completed has a
    scheduled_start date on or after that charge_date, it is the whole amount of the current period's lines; when the
    tier bills in twelve-calendar-month periods and the change date is outside that window, it is the whole unused months
    multiplied by proration_monthly_rate, whole unused months being the number of calendar months from the change date
    to current_period_end, less one when the day number of current_period_end is smaller than that of the change date, rounded half up to the cent and never more than the amount of the current period's lines; otherwise the standard method applies. A record counts as dated in the month before the
    change date when its date is not after the change date and adding one calendar month to it, keeping the day number
    and treating a day number the later month lacks as falling after that month's last day, gives a date after the change
    date. Included urgent care is recaptured from the upgrade credit as follows: when two or more Urgent Care Video Visits
    of the patient with status completed and payment_path membership_included have a completed_date in the month before
    the change date, twice upgrade_uc_recapture is recaptured; when exactly one does, upgrade_uc_recapture is recaptured
    once; otherwise nothing is recaptured for urgent care. Included primary care is recaptured from the upgrade credit as
    follows: when two or more Primary Care Follow-Up Visits, Primary Care New Patient Visits or Annual Preventive Video
    Visits of the patient with status completed and payment_path membership_included have a completed_date in the month
    before the change date, twice upgrade_pc_recapture is recaptured; when exactly one does, upgrade_pc_recapture is
    recaptured once; otherwise nothing is recaptured for primary care. Member-rate visits are recaptured from the upgrade
    credit as follows: when two or more visits of the patient with status completed and payment_path member_rate have a
    completed_date in the month before the change date, twice upgrade_member_rate_recapture is recaptured; when exactly
    one does, upgrade_member_rate_recapture is recaptured once; otherwise nothing is recaptured for member-rate visits.
    Included lab panels are recaptured from the upgrade credit as follows: when two or more lab orders of this membership
    with status reviewed and payment_path membership_included have an ordered_date in the month before the change date,
    twice upgrade_lab_recapture is recaptured; when exactly one does, upgrade_lab_recapture is recaptured once; otherwise
    nothing is recaptured for lab panels. Member pharmacy pricing is recaptured from the upgrade credit as follows: when
    two or more fill charges of the patient posted at price_basis cash_member_price have a charge_date in the month before
    the change date, twice upgrade_rx_recapture is recaptured; when exactly one does, upgrade_rx_recapture is recaptured
    once; otherwise nothing is recaptured for pharmacy pricing.
  prerequisite:
  - problem: membership_ext_past_due_payment
    kind: value_input
    gate: period_lines_total
    form: state
    policy_source: The upgrade charge is fixed only after the current period's dues line is charged and the membership
      status is active.
    condition: a membership_dues_charged line with period_start equal to current_period_start exists and the membership
      status is active.
    resolved_by: pay_past_due_dues_3656db9c
    effect: the past-due payment charges the period's dues line and returns the membership to active, so the amount of
      the current period's lines rises from 0.00 to the gross dues and the upgrade credit is computed on it.
  cross_category:
  - category: visit
    as: history
    reads: [visit_appointments.status, visit_appointments.payment_path, visit_appointments.variant_name, visit_appointments.completed_date, visit_appointments.scheduled_start]
    note: decides the upgrade credit basis (completed visit since the charge date) and the visit recapture tiers.
  - category: lab
    as: history
    reads: [lab_orders.status, lab_orders.payment_path, lab_orders.membership_id, lab_orders.ordered_date]
    note: decides the lab recapture tier.
  - category: rx
    as: history
    reads: [rx_charges.price_basis, rx_charges.charge_date]
    note: decides the pharmacy recapture tier.
  compute:
  - premier_price: 'K(''premier_annual_dues'')'
  - dues_lines_total: 'SUM(''membership_charges'',''amount'', event_type=''membership_dues_charged'', period_start=F(''current_period_start''))'
  - proration_lines_total: 'SUM(''membership_charges'',''amount'', event_type=''membership_upgrade_proration_charged'', period_start=F(''current_period_start''))'
  - period_lines_total: 'dues_lines_total + proration_lines_total'
  - dues_lines_date: 'LATEST(''membership_charges'',''charge_date'', date_field=''charge_date'', event_type=''membership_dues_charged'', period_start=F(''current_period_start''))'
  - proration_lines_date: 'LATEST(''membership_charges'',''charge_date'', date_field=''charge_date'', event_type=''membership_upgrade_proration_charged'', period_start=F(''current_period_start''))'
  - period_lines_date: 'proration_lines_date if (proration_lines_date != None and (dues_lines_date == None or proration_lines_date > dues_lines_date)) else dues_lines_date'
  - standard_upgrade_credit: 'RND(period_lines_total * DAYS(NOW, F(''current_period_end'')) / DAYS(F(''current_period_start''), F(''current_period_end'')) + 0.000000001, 2)'
  - first_paid_period: 'F(''current_period_start'') == F(''activated_date'')'
  - upgrade_in_window: '(DAYS(F(''activated_date''), NOW) <= P(''full_refund_window_days'')) if first_paid_period else (period_lines_date != None and DAYS(period_lines_date, NOW) <= P(''renewal_refund_window_days''))'
  - latest_completed_visit: 'XLATEST(''visit'',''visit_appointments'',''scheduled_start'', date_field=''scheduled_start'', status=''completed'')'
  - visit_after_charge: 'period_lines_date != None and (latest_completed_visit or '''') >= period_lines_date'
  - months_left: 'MONTHS(NOW, F(''current_period_end''))'
  - upgrade_credit_basis: 'period_lines_total if (upgrade_in_window and not visit_after_charge) else (MN(period_lines_total, RND(months_left * P(''proration_monthly_rate'') + 0.000000001, 2)) if (MONTHS(F(''current_period_start''), F(''current_period_end'')) == 12 and not upgrade_in_window) else standard_upgrade_credit)'
  - uc_taken: 'XCOUNT(''visit'',''visit_appointments'', within_months=1, date_field=''completed_date'', status=''completed'', payment_path=''membership_included'', variant_name=''Urgent Care Video Visit'')'
  - uc_recapture: '2 * K(''upgrade_uc_recapture'') if uc_taken >= 2 else (K(''upgrade_uc_recapture'') if uc_taken == 1 else 0)'
  - pc_taken: 'XCOUNT(''visit'',''visit_appointments'', within_months=1, date_field=''completed_date'', status=''completed'', payment_path=''membership_included'', variant_name=''Primary Care Follow-Up Visit'') + XCOUNT(''visit'',''visit_appointments'', within_months=1, date_field=''completed_date'', status=''completed'', payment_path=''membership_included'', variant_name=''Primary Care New Patient Visit'') + XCOUNT(''visit'',''visit_appointments'', within_months=1, date_field=''completed_date'', status=''completed'', payment_path=''membership_included'', variant_name=''Annual Preventive Video Visit'')'
  - pc_recapture: '2 * K(''upgrade_pc_recapture'') if pc_taken >= 2 else (K(''upgrade_pc_recapture'') if pc_taken == 1 else 0)'
  - member_rate_taken: 'XCOUNT(''visit'',''visit_appointments'', within_months=1, date_field=''completed_date'', status=''completed'', payment_path=''member_rate'')'
  - member_rate_recapture: '2 * K(''upgrade_member_rate_recapture'') if member_rate_taken >= 2 else (K(''upgrade_member_rate_recapture'') if member_rate_taken == 1 else 0)'
  - panels_included_taken: 'XCOUNT(''lab'',''lab_orders'', within_months=1, date_field=''ordered_date'', status=''reviewed'', payment_path=''membership_included'', membership_id=HID)'
  - panel_recapture: '2 * K(''upgrade_lab_recapture'') if panels_included_taken >= 2 else (K(''upgrade_lab_recapture'') if panels_included_taken == 1 else 0)'
  - member_price_fills: 'XCOUNT(''rx'',''rx_charges'', within_months=1, date_field=''charge_date'', event_type=''rx_fill_charged'', price_basis=''cash_member_price'')'
  - fill_recapture: '2 * K(''upgrade_rx_recapture'') if member_price_fills >= 2 else (K(''upgrade_rx_recapture'') if member_price_fills == 1 else 0)'
  - result: 'MX(0, RND(premier_price - MX(0, upgrade_credit_basis - uc_recapture - pc_recapture - member_rate_recapture - panel_recapture - fill_recapture) + 0.000000001, 2))'
