  factors:
  - id: credit_basis_choice
    effect: method
    decides: upgrade_credit_basis
    bindings: [first_paid_period, upgrade_in_window, latest_completed_visit, visit_after_charge, months_left, upgrade_credit_basis]
    ladder:
    - when: 'the change date is inside the refund window of the current lines and no completed visit has a scheduled_start on or after their charge_date'
      method: 'the whole amount of the current period lines'
    - when: 'the tier bills in twelve-month periods and the change date is outside that window'
      method: 'whole unused months times proration_monthly_rate, rounded half up to the cent, never more than the current period lines'
    - when: 'otherwise'
      method: 'the standard daily share of the current period lines'
    baseline:
      upgrade_credit_basis: 'standard_upgrade_credit'
    evidence: [date, history, cross_category]
    cross_difficulty: visit
  - id: urgent_care_used
    effect: parameter
    decides: uc_recapture
    bindings: [uc_taken, uc_recapture]
    ladder:
    - when: 'two or more included Urgent Care Video Visits completed in the month before'
      value: '2 * K(''upgrade_uc_recapture'')'
    - when: 'exactly one'
      value: 'K(''upgrade_uc_recapture'')'
    - when: 'otherwise'
      value: '0'
    baseline:
      uc_recapture: '0'
    evidence: [history, cross_category]
    cross_difficulty: visit
  - id: primary_care_used
    effect: parameter
    decides: pc_recapture
    bindings: [pc_taken, pc_recapture]
    ladder:
    - when: 'two or more included primary care or preventive visits completed in the month before'
      value: '2 * K(''upgrade_pc_recapture'')'
    - when: 'exactly one'
      value: 'K(''upgrade_pc_recapture'')'
    - when: 'otherwise'
      value: '0'
    baseline:
      pc_recapture: '0'
    evidence: [history, cross_category]
    cross_difficulty: visit
  - id: member_rate_used
    effect: parameter
    decides: member_rate_recapture
    bindings: [member_rate_taken, member_rate_recapture]
    ladder:
    - when: 'two or more member-rate visits completed in the month before'
      value: '2 * K(''upgrade_member_rate_recapture'')'
    - when: 'exactly one'
      value: 'K(''upgrade_member_rate_recapture'')'
    - when: 'otherwise'
      value: '0'
    baseline:
      member_rate_recapture: '0'
    evidence: [history, cross_category]
    cross_difficulty: visit
  - id: panels_used
    effect: parameter
    decides: panel_recapture
    bindings: [panels_included_taken, panel_recapture]
    ladder:
    - when: 'two or more reviewed included lab orders of this membership ordered in the month before'
      value: '2 * K(''upgrade_lab_recapture'')'
    - when: 'exactly one'
      value: 'K(''upgrade_lab_recapture'')'
    - when: 'otherwise'
      value: '0'
    baseline:
      panel_recapture: '0'
    evidence: [history, cross_category]
    cross_difficulty: lab
  - id: fills_used
    effect: parameter
    decides: fill_recapture
    bindings: [member_price_fills, fill_recapture]
    ladder:
    - when: 'two or more member-price fill charges in the month before'
      value: '2 * K(''upgrade_rx_recapture'')'
    - when: 'exactly one'
      value: 'K(''upgrade_rx_recapture'')'
    - when: 'otherwise'
      value: '0'
    baseline:
      fill_recapture: '0'
    evidence: [history, cross_category]
    cross_difficulty: rx
  baseline:
    rule: 'The upgrade charge is the premier_annual_dues of Larkspur Premier Annual less the upgrade credit, never below 0.00, rounded half up to the cent. The current period''s lines are the membership_dues_charged and membership_upgrade_proration_charged lines whose period_start equals current_period_start, their amount being the total of those lines and their charge_date the latest charge_date among them. By the standard method the upgrade credit is the amount of the current period''s lines multiplied by the unused days and divided by the period days, where unused days run from the change date to current_period_end and period days from current_period_start to current_period_end, rounded half up to the cent; a period with no line has an upgrade credit of 0.00. Every amount the rules below recapture is subtracted from the upgrade credit, which never falls below 0.00.'
