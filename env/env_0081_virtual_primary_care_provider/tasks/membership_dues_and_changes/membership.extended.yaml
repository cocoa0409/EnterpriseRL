- id: membership_cancellation_refund
  subject:
  - membership_cancelled
  - membership_trial_cancelled
  - membership_cancelled_while_past_due
  - membership_cancelled_while_paused
  - membership_term_expired
  - membership_dues_refunded
  - membership_credit_expired
  rule: 'Only the patient can cancel a membership, and every cancellation is registered as a membership request
    of type cancel. A membership can be cancelled only while its status is trialing, active, past_due or paused.
    A trial, past-due or paused membership closes on the request date and nothing further is charged. For an active
    membership the tier''s cancellation_effective sets the effective date: immediate tiers close on the request
    date, and end_of_period tiers close on current_period_end and keep every benefit until then without any refund.
    Refunds on cancellation apply only to tiers whose cancellation_effective is immediate and only to a membership
    cancelled while active, and exactly one refund basis applies, tested in this order. First, the full refund window:
    A full refund of the first paid period may be issued only when the cancellation request date is no more than
    full_refund_window_days calendar days after the membership''s activated_date. It also requires that the current
    period is the first paid period and, where full_refund_requires_no_completed_visit is true, that the patient
    has no visit appointment with status completed whose scheduled_start date is on or after activated_date; the
    first period''s dues line is then refunded in full, together with the enrollment fee line where enrollment_fee_refundable_in_window
    is true. Second, the renewal refund window: A full refund of a renewal charge may be issued only when the cancellation
    request date is no more than renewal_refund_window_days calendar days after the charge date of that renewal
    dues line. It also requires that the patient has no visit appointment with status completed whose scheduled_start
    date is on or after that charge date, except that where renewal_notice_missing_waives_visit_condition is true
    and no renewal notice record exists for that period_start the completed-visit condition is waived; the renewal
    dues line is then refunded in full. Third, under post_window_refund_method unused_full_months the refund equals
    the whole unused months multiplied by proration_monthly_rate, where whole unused months is the largest number
    of calendar months that can be added to the request date without passing current_period_end, capped at the gross
    amount of the current period''s dues or proration line; under none nothing is refunded. Day counts are calendar
    days added to the anchor date (the anchor date plus N days is the date N days later), never full 24-hour periods,
    and the boundary date itself counts as within the limit. Month counts are calendar months added to the anchor
    date; when that day does not exist in the target month the last day of that month is used, and the boundary
    date itself counts as reached. Each refund is one line pointing to the line it refunds, with the matching refund_reason,
    and is rounded half up to the cent. Account credit is never paid out: on the cancellation date every open credit
    expires with an expired line for its unused remainder. A membership whose auto_renew is false closes on current_period_end
    without a refund.'
  eligibility:
  - id: cancellable_state
    applies_to:
    - membership_cancelled
    - membership_trial_cancelled
    - membership_cancelled_while_past_due
    - membership_cancelled_while_paused
    kind: state
    condition: A membership can be cancelled only while its status is trialing, active, past_due or paused.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
      - paused
  - id: full_refund_window
    applies_to:
    - membership_dues_refunded
    kind: time
    condition: A full refund of the first paid period may be issued only when the cancellation request date is no
      more than full_refund_window_days calendar days after the membership's activated_date.
    evidence_fields:
    - membership_holdings.activated_date
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the membership's activated_date
      anchor_source: membership_holdings.activated_date
      relation: not_after
      duration_source: variants.full_refund_window_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  - id: renewal_refund_window
    applies_to:
    - membership_dues_refunded
    kind: time
    condition: A full refund of a renewal charge may be issued only when the cancellation request date is no more
      than renewal_refund_window_days calendar days after the charge date of that renewal dues line.
    evidence_fields:
    - membership_charges.charge_date
    - membership_charges.mem_charge_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_charges.mem_charge_id
      action_bindings:
        membership_charges.mem_charge_id: mem_charge_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the charge date of that renewal dues line
      anchor_source: membership_charges.charge_date
      relation: not_after
      duration_source: variants.renewal_refund_window_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  params:
    per_tier:
      Larkspur Access:
        cancellation_effective: =cancellation_effective
        full_refund_window_days: =full_refund_window_days
        renewal_refund_window_days: =renewal_refund_window_days
        post_window_refund_method: =post_window_refund_method
        proration_monthly_rate: =proration_monthly_rate
      Larkspur Essentials Monthly:
        cancellation_effective: =cancellation_effective
        full_refund_window_days: =full_refund_window_days
        renewal_refund_window_days: =renewal_refund_window_days
        post_window_refund_method: =post_window_refund_method
        proration_monthly_rate: =proration_monthly_rate
      Larkspur Essentials Annual:
        cancellation_effective: =cancellation_effective
        full_refund_window_days: =full_refund_window_days
        renewal_refund_window_days: =renewal_refund_window_days
        post_window_refund_method: =post_window_refund_method
        proration_monthly_rate: =proration_monthly_rate
      Larkspur Plus Monthly:
        cancellation_effective: =cancellation_effective
        full_refund_window_days: =full_refund_window_days
        renewal_refund_window_days: =renewal_refund_window_days
        post_window_refund_method: =post_window_refund_method
        proration_monthly_rate: =proration_monthly_rate
      Larkspur Plus Annual:
        cancellation_effective: =cancellation_effective
        full_refund_window_days: =full_refund_window_days
        renewal_refund_window_days: =renewal_refund_window_days
        post_window_refund_method: =post_window_refund_method
        proration_monthly_rate: =proration_monthly_rate
      Larkspur Premier Annual:
        cancellation_effective: =cancellation_effective
        full_refund_window_days: =full_refund_window_days
        renewal_refund_window_days: =renewal_refund_window_days
        post_window_refund_method: =post_window_refund_method
        proration_monthly_rate: =proration_monthly_rate
- id: membership_pause
  subject:
  - membership_paused
  - membership_resumed
  - membership_pause_fee_charged
  rule: 'Only a tier whose pause_allowed is true can be paused, and only the patient can ask for a pause, registered
    as a membership request of type pause carrying the requested pause_months and the pause start as its effective
    date. A pause may start only while the membership status is active. A pause may start only on a date at least
    pause_request_notice_days calendar days after the date the patient requested it. Day counts are calendar days
    added to the anchor date (the anchor date plus N days is the date N days later), never full 24-hour periods,
    and the boundary date itself counts as within the limit. A pause may start only when at least pause_eligible_after_months
    calendar months have passed since the membership''s activated_date. Month counts are calendar months added to
    the anchor date; when that day does not exist in the target month the last day of that month is used, and the
    boundary date itself counts as reached. Each pause lasts a whole number of months of at least pause_min_months,
    and membership_msr_pause_months_year plus the requested months may not exceed pause_max_months_per_membership_year;
    a request that would exceed it is refused rather than shortened. The pause ends pause_months calendar months
    after the pause start; where pause_extends_period is true current_period_end moves back by the same number of
    months. No dues are charged and no renewal happens while paused, and member benefits are unavailable while paused.
    Where pause_hold_fee_per_month is above zero, the hold fee for all requested months is charged once on the pause
    start date, and credit is never applied to it. A patient may resume early: the membership returns to active
    on the resume date, current_period_end becomes the original end plus the number of paused months begun (a started
    month counts as a whole month), and the hold fee is not refunded. A hold fee may be charged only while the membership
    status is paused.'
  eligibility:
  - id: pause_from_active
    applies_to:
    - membership_paused
    kind: state
    condition: A pause may start only while the membership status is active.
    evidence_fields:
