events:
- type: rx_prescription_written
  target: rx_prescriptions
  mutation: create
  meaning: A Larkspur clinician writes a prescription (a new medication or a renewal).
  grain: one row per prescription
  fields:
    variant_name: Formulary level of the drug.
    drug_name: Drug as written.
    written_date: Date signed.
    expiration_date: written_date plus rx_validity_months.
    days_supply: Days per fill as written.
    fills_authorized: Fill units authorized.
    fulfillment: Larkspur Pharmacy or the retail pharmacy the patient chose.
    external_pharmacy_name: Retail pharmacy for an external prescription.
    prescribing_visit_id: Visit at which it was written.
    renewed_from_rx_id: Prescription renewed.
    auto_refill: false unless the patient opts in.
    insurance_billing: The patient's choice of pharmacy benefit or cash.
    coverage_id: Coverage whose pharmacy benefit is billed.
  triggers:
  - event: rx:rx_fills_authorized
    map:
      fill_units: fills_authorized
      fill_date: written_date
- type: rx_placed_on_hold
  target: rx_prescriptions
  mutation:
    transition:
      from: active
      to: on_hold
  meaning: A fill is held for a prior authorization, benefit rejection, declined card or address problem.
  grain: one row per transaction
  fields:
    hold_reason: Reason.
    hold_start_date: Date the hold started.
  triggers: []
- type: rx_hold_released
  target: rx_prescriptions
  mutation:
    transition:
      from: on_hold
      to: active
  meaning: The hold reason is resolved and fills may proceed.
  grain: one row per transaction
  fields:
    hold_reason: none.
    hold_start_date: Cleared.
    insurance_billing: Re-stated when the patient switches to cash to end a benefit hold.
  triggers: []
- type: rx_completed
  target: rx_prescriptions
  mutation:
    transition:
      from: active
      to: completed
  meaning: The last fill unit is dispensed.
  grain: one row per transaction
  fields:
    fills_remaining: 0.0
  triggers: []
- type: rx_expired
  target: rx_prescriptions
  mutation:
    transition:
      from: active
      to: expired
  meaning: The prescription passes its expiration date with units left.
  grain: one row per transaction
  fields:
    fills_remaining: Units left unused.
  triggers: []
- type: rx_hold_expired
  target: rx_prescriptions
  mutation:
    transition:
      from: on_hold
      to: expired
  meaning: The prescription passes its expiration date while on hold.
  grain: one row per transaction
  fields:
    fills_remaining: Units left unused.
  triggers: []
- type: rx_transferred_out
  target: rx_prescriptions
  mutation:
    transition:
      from: active
      to: transferred_out
  meaning: The remaining fills are transferred to a retail pharmacy.
  grain: one row per transaction
  fields:
    fulfillment: external_pharmacy.
    external_pharmacy_name: Receiving pharmacy as the patient gave it.
    transferred_date: Transfer date.
  triggers: []
- type: rx_discontinued
  target: rx_prescriptions
  mutation:
    transition:
      from: active
      to: discontinued
  meaning: The clinician stops the medication or a renewal replaces the prescription.
  grain: one row per transaction
  fields:
    fills_remaining: Units left unused.
  triggers: []
- type: rx_hold_discontinued
  target: rx_prescriptions
  mutation:
    transition:
      from: on_hold
      to: discontinued
  meaning: A hold outlasts its limit, or the clinician stops the medication during a hold.
  grain: one row per transaction
  fields:
    fills_remaining: Units left unused.
  triggers: []
- type: rx_auto_refill_changed
  target: rx_prescriptions
  mutation: update
  meaning: The patient turns auto-refill on or off.
  grain: one row per transaction
  fields:
    auto_refill: New setting.
  triggers: []
- type: rx_billing_choice_changed
  target: rx_prescriptions
  mutation: update
  meaning: The patient switches future fills between the pharmacy benefit and the cash price.
  grain: one row per transaction
  fields:
    insurance_billing: New choice.
    coverage_id: Coverage billed, or empty for cash.
  triggers: []
- type: rx_fills_authorized
  target: rx_fills
  meaning: The fill units of a prescription are authorized when it is written.
  grain: one row per prescription
  distinguish_by:
  - fill_date
  fields:
    fill_units: fills_authorized.
    fill_date: written_date.
  account: fill_units
  direction: in
  triggers: []
- type: rx_fill_dispensed
  target: rx_fills
  meaning: Larkspur Pharmacy dispenses and ships one fill.
  grain: one row per shipment
  distinguish_by:
  - fill_date
  fields:
    fill_units: 1 for a 30-day fill, fill_units_per_90_day for a 90-day fill.
    fill_date: Ship date.
    days_supply_dispensed: 30 or 90.
    shipping_speed: Speed chosen.
    early_override: Whether the early-refill override was used.
  account: fill_units
  direction: out
  triggers: []
- type: rx_fill_returned
  target: rx_fills
  meaning: A package returned undeliverable is restocked and its units restored.
  grain: one row per dispensed line
  distinguish_by:
  - source_fill_id
  fields:
    fill_units: Units of the returned fill.
    fill_date: Date returned to the pharmacy.
    source_fill_id: Dispensed line returned.
    reship_reason: none.
  account: fill_units
  direction: in
  triggers: []
- type: rx_fill_reshipped
  target: rx_fills
  meaning: A replacement is shipped at no charge for a lost, damaged or mis-filled package.
  grain: one row per dispensed line
  distinguish_by:
  - source_fill_id
  fields:
    fill_date: Reship date.
    days_supply_dispensed: Same as the original.
    shipping_speed: Same as the original.
    source_fill_id: Dispensed line replaced.
    reship_reason: Reason.
  triggers: []
- type: rx_fill_charged
  target: rx_charges
  meaning: The drug charge for one dispensed fill is posted.
  grain: one row per dispensed fill
  distinguish_by:
  - rx_fill_id
  fields:
    amount: Charge for the fill.
    charge_date: Ship date.
    rx_fill_id: Dispensed fill.
    price_basis: cash_price, cash_member_price or pbm_patient_pay.
    pbm_patient_pay: Patient pay returned by the pharmacy benefit.
  account: rx_billed
  direction: in
  triggers: []
- type: rx_shipping_charged
  target: rx_charges
  meaning: The shipping fee for one shipment is posted.
  grain: one row per dispensed fill
  distinguish_by:
  - rx_fill_id
  fields:
    amount: Shipping fee.
    charge_date: Ship date.
    rx_fill_id: Dispensed fill.
    price_basis: shipping.
  account: rx_billed
  direction: in
  triggers: []
- type: rx_charge_refunded
  target: rx_charges
  meaning: A fill or shipping charge is refunded.
  grain: one row per refunded line
  distinguish_by:
  - original_charge_id
  fields:
    amount: Negative refund.
    charge_date: Refund date.
    rx_fill_id: Fill of the original line.
    price_basis: refund.
    original_charge_id: Line refunded.
    refund_reason: Basis.
  account: rx_billed
  direction: out
  triggers: []
measures:
- id: rx_msr_last_dispensed
  window: life of the prescription
  measure: the latest rx_fill_dispensed line of the prescription (its fill_date and days_supply_dispensed); empty
    before the first fill
- id: rx_msr_overrides_12m
  window: 365 calendar days ending on the request date
  measure: count of rx_fill_dispensed lines of the prescription with early_override true
- id: rx_msr_reships_per_fill
  window: life of the dispensed fill
  measure: count of rx_fill_reshipped lines whose source_fill_id is the fill, with reship_reason lost_in_transit
    or damaged_in_transit
- id: rx_msr_transfers_out
  window: life of the prescription
  measure: count of rx_requests rows of the prescription with request_type transfer_out and request_status approved
- id: rx_msr_last_qualifying_visit
  window: renewal_visit_lookback_months calendar months ending on the renewal request date
  measure: latest completed_date among the patient's visit_appointments with status completed whose variant_name
    is in renewal_qualifying_visit_types
policies:
- id: rx_agg_multi_holding
  subject:
  - rx_prescription_written
  rule: A patient may hold any number of prescriptions over time, one record per drug as written (max_per_customer
    is unlimited); how prescriptions for the same drug combine is set by the same-drug rule.
  eligibility: []
  params:
    max_per_customer: null
- id: rx_agg_same_drug
  subject:
  - rx_prescription_written
  - rx_discontinued
  rule: 'Prescriptions are combined per patient and drug_name: at most max_active_rx_same_drug may be active or
    on_hold at once. A prescription may be written only when the patient holds no other prescription for the same
    drug_name whose status is active or on_hold, unless it is a renewal of that prescription. A renewal names the
    prescription it renews in renewed_from_rx_id, and on the day the renewal is written the renewed prescription,
    if still active, is discontinued and its remaining fill units lapse; fill history and refill timing carry over
    from the renewed prescription to the renewal, so a renewal never resets the refill-too-soon clock.'
  eligibility:
  - id: one_open_rx_per_drug
    applies_to:
    - rx_prescription_written
    kind: dedup
    condition: A prescription may be written only when the patient holds no other prescription for the same drug_name
      whose status is active or on_hold, unless it is a renewal of that prescription.
    evidence_fields:
    - rx_prescriptions.customer_id
    - rx_prescriptions.drug_name
    - rx_prescriptions.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_prescriptions.customer_id
      action_bindings:
        rx_prescriptions.customer_id: customer_id
    dedup_contract:
      table: rx_prescriptions
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        drug_name: drug_name
      duplicate_filters:
        status:
        - active
        - on_hold
      distinct_fields: []
- id: rx_prescribing_scope
  subject:
  - rx_prescription_written
  - rx_fills_authorized
  - rx_discontinued
  - rx_hold_discontinued
  rule: Larkspur clinicians never prescribe DEA Schedule II-V controlled substances through telehealth on any level
    (controlled_substances_prescribed is false), so a request to start, renew or transfer a controlled substance
    is not handled by any Larkspur pharmacy rule. A prescription may be written only from a visit appointment whose
    status is completed. The prescription expires rx_validity_months calendar months after written_date. Month counts
    are calendar months added to the anchor date; when that day does not exist in the target month the last day
    of that month is used, and the boundary date itself counts as reached. Fill units are counted in 30-day units
    and never exceed what the validity period can use. The patient chooses Larkspur Pharmacy home delivery or a
    named retail pharmacy at writing; an external prescription is sent electronically and is never dispensed or
    charged by Larkspur. A prescription may be routed to Larkspur Pharmacy only when the patient's home_state is
    one of the level's ship_states. A level whose cash_price_available is false can be filled at Larkspur Pharmacy
    only through the pharmacy benefit. The clinician may discontinue a prescription at any time for clinical reasons;
    remaining units then lapse.
  eligibility:
  - id: written_from_completed_visit
    applies_to:
    - rx_prescription_written
    kind: state
    condition: A prescription may be written only from a visit appointment whose status is completed.
    evidence_fields:
    - visit_appointments.status
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    state_contract:
      field: visit_appointments.status
      allowed:
      - completed
  - id: home_state_shippable
    applies_to:
    - rx_prescription_written
    kind: authorization
    condition: A prescription may be routed to Larkspur Pharmacy only when the patient's home_state is one of the
      level's ship_states.
    evidence_fields:
    - customers.home_state
    - customers.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  params:
    per_tier:
      Larkspur Rx Value Generics:
        cash_price_available: =cash_price_available
        ship_states: =ship_states
      Larkspur Rx Core Generics:
        cash_price_available: =cash_price_available
        ship_states: =ship_states
      Larkspur Rx Extended Generics:
        cash_price_available: =cash_price_available
        ship_states: =ship_states
      Larkspur Rx Specialty Generics:
        cash_price_available: =cash_price_available
        ship_states: =ship_states
      Larkspur Rx Preferred Brands:
        cash_price_available: =cash_price_available
        ship_states: =ship_states
      Larkspur Rx Non-Preferred Brands:
        cash_price_available: =cash_price_available
        ship_states: =ship_states
- id: rx_evt_fill_pricing
  subject:
  - rx_fill_charged
  - rx_billing_choice_changed
  rule: Each fill Larkspur Pharmacy dispenses is charged once, at shipment (charge_timing). A fill may be charged
    only while the prescription status is active or completed. On a cash fill (insurance_billing false) the charge
    is the level's cash_price_30_day or cash_price_90_day for the days supply dispensed, less the member_discount_pct_by_membership_tier
    percent of the patient's membership tier, rounded half up to the cent; the basis is cash_member_price when a
    discount applied and cash_price when not. The member discount applies only while the patient's membership status
    is trialing, active or past_due. On a benefit fill the charge is the pbm_patient_pay the pharmacy benefit returned;
    where lower_of_cash_or_benefit is true and the patient's discounted cash price is lower, the cash price is charged
    instead with its cash basis, and the benefit claim is reversed. A fill may be billed to the pharmacy benefit
    only while the billed insurance coverage status is verified. The member discount reduces only the cash drug
    price (member_discount_applies_to), never shipping and never a benefit patient pay. No line is written for a
    0.00 amount. The patient may switch future fills between the benefit and cash at any time; a level whose cash_price_available
    is false stays on the benefit. Only the membership statuses in member_discount_statuses qualify for the member
    discount; benefit billing is offered only where insurance_billing_available is true; every amount is rounded
    under price_rounding.
  eligibility:
  - id: charge_state
    applies_to:
    - rx_fill_charged
    kind: state
    condition: A fill may be charged only while the prescription status is active or completed.
    evidence_fields:
    - rx_prescriptions.status
    - rx_prescriptions.rx_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_prescriptions.rx_id
      action_bindings:
        rx_prescriptions.rx_id: rx_id
    state_contract:
      field: rx_prescriptions.status
      allowed:
      - active
      - completed
  - id: rx_member_discount_state
    applies_to:
    - rx_fill_charged
    kind: state
    condition: The member discount applies only while the patient's membership status is trialing, active or past_due.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
  - id: benefit_coverage_verified
    applies_to:
    - rx_fill_charged
    - rx_billing_choice_changed
    kind: state
    condition: A fill may be billed to the pharmacy benefit only while the billed insurance coverage status is verified.
    evidence_fields:
    - insurance_coverages.status
    - insurance_coverages.coverage_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - insurance_coverages.coverage_id
      action_bindings:
        insurance_coverages.coverage_id: coverage_id
    state_contract:
      field: insurance_coverages.status
      allowed:
      - verified
  params:
    per_tier:
      Larkspur Rx Value Generics:
        cash_price_30_day: =cash_price_30_day
        cash_price_90_day: =cash_price_90_day
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
        lower_of_cash_or_benefit: =lower_of_cash_or_benefit
      Larkspur Rx Core Generics:
        cash_price_30_day: =cash_price_30_day
        cash_price_90_day: =cash_price_90_day
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
        lower_of_cash_or_benefit: =lower_of_cash_or_benefit
      Larkspur Rx Extended Generics:
        cash_price_30_day: =cash_price_30_day
        cash_price_90_day: =cash_price_90_day
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
        lower_of_cash_or_benefit: =lower_of_cash_or_benefit
      Larkspur Rx Specialty Generics:
        cash_price_30_day: =cash_price_30_day
        cash_price_90_day: =cash_price_90_day
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
        lower_of_cash_or_benefit: =lower_of_cash_or_benefit
      Larkspur Rx Preferred Brands:
        cash_price_30_day: =cash_price_30_day
        cash_price_90_day: =cash_price_90_day
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
        lower_of_cash_or_benefit: =lower_of_cash_or_benefit
      Larkspur Rx Non-Preferred Brands:
        cash_price_30_day: =cash_price_30_day
        cash_price_90_day: =cash_price_90_day
        member_discount_pct_by_membership_tier: =member_discount_pct_by_membership_tier
        lower_of_cash_or_benefit: =lower_of_cash_or_benefit
  formula:
    cash_amount: round((cash_price_90_day if days_supply_dispensed == 90 else cash_price_30_day) * (100 - member_discount_pct_by_membership_tier)
      / 100, 2)
    amount: (min(pbm_patient_pay, cash_amount) if lower_of_cash_or_benefit else pbm_patient_pay) if insurance_billing
      else cash_amount
- id: rx_evt_shipping
  subject:
  - rx_shipping_charged
  rule: 'Every shipment carries the fee of the speed the patient chose: shipping_standard_fee, shipping_expedited_fee
    or shipping_overnight_fee. A patient whose membership tier is in free_expedited_membership_tiers pays nothing
    for expedited shipping and pays shipping_overnight_fee less shipping_expedited_fee for overnight. Expedited
    shipping is free only while the patient''s membership status is trialing, active or past_due. Delivery is expected
    standard_delivery_business_days, expedited_delivery_business_days or overnight_delivery_business_days business
    days after the fill_date. Business days are Monday to Friday excluding US federal holidays, counted from the
    day after the anchor date. A level whose signature_required is true needs an adult signature. Shipping is charged
    once per dispensed fill; a reship is never charged; no line is written for a 0.00 fee; the member drug discount
    never applies to shipping.'
  eligibility:
  - id: free_expedited_state
    applies_to:
    - rx_shipping_charged
    kind: state
    condition: Expedited shipping is free only while the patient's membership status is trialing, active or past_due.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - trialing
      - active
      - past_due
- id: rx_refill_timing
  subject:
  - rx_fill_dispensed
  - rx_completed
  - rx_expired
  rule: 'A fill may be dispensed only while the prescription status is active. A fill is dispensed only on or before
    expiration_date and only when fills_remaining covers the units it uses: one unit for a 30-day fill and fill_units_per_90_day
    units for a 90-day fill, which needs that many units left; the days supply must be one of days_supply_options.
    A refill may ship only when at least refill_min_elapsed_pct percent of the days_supply_dispensed of the previous
    fill (rx_msr_last_dispensed) has passed since that fill''s fill_date, the elapsed days being rounded up to a
    whole day. Day counts are calendar days added to the anchor date (the anchor date plus N days is the date N
    days later), never full 24-hour periods, and the boundary date itself counts as within the limit. For travel
    or lost medication the patient may ask for an early-refill override, registered as a request of type early_refill_override;
    it lets the fill ship once early_override_min_elapsed_pct percent has passed, and only while rx_msr_overrides_12m
    is below early_refill_overrides_per_12_months. When the last unit is dispensed the prescription is completed;
    when expiration_date passes with units left it expires.'
  eligibility:
  - id: dispense_active
    applies_to:
    - rx_fill_dispensed
    kind: state
    condition: A fill may be dispensed only while the prescription status is active.
    evidence_fields:
    - rx_prescriptions.status
    - rx_prescriptions.rx_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_prescriptions.rx_id
      action_bindings:
        rx_prescriptions.rx_id: rx_id
    state_contract:
      field: rx_prescriptions.status
      allowed:
      - active
  params:
    per_tier:
      Larkspur Rx Value Generics:
        refill_min_elapsed_pct: =refill_min_elapsed_pct
        early_refill_overrides_per_12_months: =early_refill_overrides_per_12_months
      Larkspur Rx Core Generics:
        refill_min_elapsed_pct: =refill_min_elapsed_pct
        early_refill_overrides_per_12_months: =early_refill_overrides_per_12_months
      Larkspur Rx Extended Generics:
        refill_min_elapsed_pct: =refill_min_elapsed_pct
        early_refill_overrides_per_12_months: =early_refill_overrides_per_12_months
      Larkspur Rx Specialty Generics:
        refill_min_elapsed_pct: =refill_min_elapsed_pct
        early_refill_overrides_per_12_months: =early_refill_overrides_per_12_months
      Larkspur Rx Preferred Brands:
        refill_min_elapsed_pct: =refill_min_elapsed_pct
        early_refill_overrides_per_12_months: =early_refill_overrides_per_12_months
      Larkspur Rx Non-Preferred Brands:
        refill_min_elapsed_pct: =refill_min_elapsed_pct
        early_refill_overrides_per_12_months: =early_refill_overrides_per_12_months
  measures:
  - rx_msr_last_dispensed
  - rx_msr_overrides_12m
- id: rx_auto_refill
  subject:
  - rx_auto_refill_changed
  rule: Where auto_refill_available is true and the prescription is filled at Larkspur Pharmacy, the patient may
    turn auto-refill on or off. Auto-refill may be changed only while the prescription status is active or on_hold.
    With auto-refill on, each refill ships auto_refill_ship_days_before_due calendar days before the date the previous
    fill's supply runs out, at standard shipping unless the patient chose another speed, and is charged under the
    fill pricing rule. A shipment can no longer be stopped once its ship date is less than auto_refill_cancel_cutoff_days
    calendar days away, and a shipped auto-refill is a dispensed fill like any other.
  eligibility:
  - id: auto_refill_state
    applies_to:
    - rx_auto_refill_changed
    kind: state
    condition: Auto-refill may be changed only while the prescription status is active or on_hold.
    evidence_fields:
    - rx_prescriptions.status
    - rx_prescriptions.rx_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_prescriptions.rx_id
      action_bindings:
        rx_prescriptions.rx_id: rx_id
    state_contract:
      field: rx_prescriptions.status
      allowed:
      - active
      - on_hold
- id: rx_renewals
  subject:
  - rx_prescription_written
  - rx_discontinued
  rule: A patient asks for a renewal when the prescription is within renewal_request_window_days calendar days of
    its expiration_date, or has completed or expired; the request is registered as a pending request of type renewal
    and decided by a clinician within renewal_review_business_days business days. Business days are Monday to Friday
    excluding US federal holidays, counted from the day after the anchor date. A renewal may be written without
    a new visit only when the frozen time is no more than renewal_visit_lookback_months calendar months after the
    completed_date of the patient's latest qualifying visit. Month counts are calendar months added to the anchor
    date; when that day does not exist in the target month the last day of that month is used, and the boundary
    date itself counts as reached. A qualifying visit is a visit with status completed whose variant_name is in
    renewal_qualifying_visit_types (rx_msr_last_qualifying_visit). When it qualifies, the clinician writes a renewal
    with renewal_fills_authorized units that names the renewed prescription; otherwise the request is denied_visit_required
    and the patient must book a qualifying visit. While that visit is scheduled within bridge_requires_booked_visit_within_days
    calendar days, the clinician may write a one-time bridge renewal of bridge_supply_fill_units units where that
    is above zero. A clinician may still deny any renewal for clinical reasons.
  eligibility:
  - id: renewal_visit_recency
    applies_to:
    - rx_prescription_written
    kind: time
    condition: A renewal may be written without a new visit only when the frozen time is no more than renewal_visit_lookback_months
      calendar months after the completed_date of the patient's latest qualifying visit.
    evidence_fields:
    - visit_appointments.completed_date
    - visit_appointments.visit_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - visit_appointments.visit_id
      action_bindings:
        visit_appointments.visit_id: visit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the completed_date of the patient's latest qualifying visit
      anchor_source: visit_appointments.completed_date
      relation: not_after
      duration_source: variants.renewal_visit_lookback_months
      unit: calendar_months
      counting_rule: Month counts are calendar months added to the anchor date; when that day does not exist in
        the target month the last day of that month is used, and the boundary date itself counts as reached.
      boundary: inclusive
  params:
    per_tier:
      Larkspur Rx Value Generics:
        renewal_visit_lookback_months: =renewal_visit_lookback_months
        renewal_fills_authorized: =renewal_fills_authorized
      Larkspur Rx Core Generics:
        renewal_visit_lookback_months: =renewal_visit_lookback_months
        renewal_fills_authorized: =renewal_fills_authorized
      Larkspur Rx Extended Generics:
        renewal_visit_lookback_months: =renewal_visit_lookback_months
        renewal_fills_authorized: =renewal_fills_authorized
      Larkspur Rx Specialty Generics:
        renewal_visit_lookback_months: =renewal_visit_lookback_months
        renewal_fills_authorized: =renewal_fills_authorized
      Larkspur Rx Preferred Brands:
        renewal_visit_lookback_months: =renewal_visit_lookback_months
        renewal_fills_authorized: =renewal_fills_authorized
      Larkspur Rx Non-Preferred Brands:
        renewal_visit_lookback_months: =renewal_visit_lookback_months
        renewal_fills_authorized: =renewal_fills_authorized
  measures:
  - rx_msr_last_qualifying_visit
- id: rx_holds
  subject:
  - rx_placed_on_hold
  - rx_hold_released
  - rx_hold_expired
  - rx_hold_discontinued
  rule: 'A prescription goes on hold, with its hold_reason and hold_start_date, when a benefit fill needs prior
    authorization or is rejected, when the card is declined at shipment, or when the shipping address cannot be
    served. A hold may be released only while the prescription status is on_hold. A hold is released when the reason
    is resolved: the authorization is approved, the patient switches a level whose cash_price_available is true
    to cash, the card is updated, or the address is corrected. A prescription held for prior authorization may be
    discontinued only when the frozen time is at or after its hold_start_date plus prior_auth_hold_limit_days calendar
    days. Day counts are calendar days added to the anchor date (the anchor date plus N days is the date N days
    later), never full 24-hour periods, and the boundary date itself counts as within the limit. A hold for any
    other reason ends the same way after other_hold_limit_days calendar days. A prescription whose expiration_date
    passes while on hold expires. Levels whose prior_authorization_typical is true are expected to need prior authorization
    on benefit fills, and the patient is told so when the prescription is written.'
  eligibility:
  - id: release_from_hold
    applies_to:
    - rx_hold_released
    kind: state
    condition: A hold may be released only while the prescription status is on_hold.
    evidence_fields:
    - rx_prescriptions.status
    - rx_prescriptions.rx_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_prescriptions.rx_id
      action_bindings:
        rx_prescriptions.rx_id: rx_id
    state_contract:
      field: rx_prescriptions.status
      allowed:
      - on_hold
  - id: prior_auth_limit
    applies_to:
    - rx_hold_discontinued
    kind: time
    condition: A prescription held for prior authorization may be discontinued only when the frozen time is at or
      after its hold_start_date plus prior_auth_hold_limit_days calendar days.
    evidence_fields:
    - rx_prescriptions.hold_start_date
    - rx_prescriptions.rx_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_prescriptions.rx_id
      action_bindings:
        rx_prescriptions.rx_id: rx_id
    temporal_basis:
      clock: frozen_time
      anchor_event: its hold_start_date
      anchor_source: rx_prescriptions.hold_start_date
      relation: not_before
      duration_source: variants.prior_auth_hold_limit_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  params:
    per_tier:
      Larkspur Rx Value Generics:
        prior_auth_hold_limit_days: =prior_auth_hold_limit_days
      Larkspur Rx Core Generics:
        prior_auth_hold_limit_days: =prior_auth_hold_limit_days
      Larkspur Rx Extended Generics:
        prior_auth_hold_limit_days: =prior_auth_hold_limit_days
      Larkspur Rx Specialty Generics:
        prior_auth_hold_limit_days: =prior_auth_hold_limit_days
      Larkspur Rx Preferred Brands:
        prior_auth_hold_limit_days: =prior_auth_hold_limit_days
      Larkspur Rx Non-Preferred Brands:
        prior_auth_hold_limit_days: =prior_auth_hold_limit_days
- id: rx_transfers
  subject:
  - rx_transferred_out
  rule: 'Where transfer_out_allowed is true the patient may move the remaining fill units of a Larkspur Pharmacy
    prescription to a retail pharmacy, registered as a request of type transfer_out; there is no transfer_fee. A
    prescription may be transferred out only while its status is active. The receiving pharmacy is recorded exactly
    as the patient names it. A prescription may be transferred out only while rx_msr_transfers_out is below transfers_out_per_rx,
    and it never returns (transfer_back_allowed is false): filling at Larkspur Pharmacy again needs a new prescription.
    Fills already shipped are not affected.'
  eligibility:
  - id: transfer_active
    applies_to:
    - rx_transferred_out
    kind: state
    condition: A prescription may be transferred out only while its status is active.
    evidence_fields:
    - rx_prescriptions.status
    - rx_prescriptions.rx_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_prescriptions.rx_id
      action_bindings:
        rx_prescriptions.rx_id: rx_id
    state_contract:
      field: rx_prescriptions.status
      allowed:
      - active
  - id: pharmacy_named_by_patient
    applies_to:
    - rx_transferred_out
    kind: caller_fact
    condition: The receiving pharmacy is recorded exactly as the patient names it.
    evidence_fields:
    - rx_prescriptions.external_pharmacy_name
    - rx_prescriptions.rx_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - rx_prescriptions.rx_id
      action_bindings:
        rx_prescriptions.rx_id: rx_id
  measures:
  - rx_msr_transfers_out
- id: rx_returns_and_reships
  subject:
  - rx_fill_returned
  - rx_fill_reshipped
  - rx_charge_refunded
  rule: 'Dispensed medication is never taken back for a refund (returns_accepted pharmacy_error_only), except for
    a pharmacy error, which is remedied by a full refund of the fill and shipping charges and a reship at no charge
    (pharmacy_error_remedy). A package reported lost or damaged in transit is reshipped at no charge, at most lost_package_reships_per_fill
    per fill (rx_msr_reships_per_fill), with no refund. A lost-package or damage claim may be accepted only when
    the frozen time is no more than lost_package_report_days calendar days after the fill''s expected delivery date.
    The expected delivery date is the fill_date plus the delivery business days of the shipping speed. Day counts
    are calendar days added to the anchor date (the anchor date plus N days is the date N days later), never full
    24-hour periods, and the boundary date itself counts as within the limit. A package returned to the pharmacy
    as undeliverable is restocked: its units are restored and its fill and shipping charges are refunded (undeliverable_return_handling).
    A refund may be issued only when no refund already points to the same line. A charge differing from these rules
    is corrected by refunding the overcharged difference with refund_reason billing_error.'
  eligibility:
  - id: one_refund_per_line
    applies_to:
    - rx_charge_refunded
    kind: dedup
    condition: A refund may be issued only when no refund already points to the same line.
    evidence_fields:
    - rx_charges.original_charge_id
    - rx_charges.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_charges.original_charge_id
      action_bindings:
        rx_charges.original_charge_id: original_charge_id
    dedup_contract:
      table: rx_charges
      mode: separate_record
      object_bindings:
        original_charge_id: original_charge_id
      duplicate_filters:
        event_type:
        - rx_charge_refunded
      distinct_fields: []
  - id: lost_report_window
    applies_to:
    - rx_fill_reshipped
    kind: time
    condition: A lost-package or damage claim may be accepted only when the frozen time is no more than lost_package_report_days
      calendar days after the fill's expected delivery date.
    evidence_fields:
    - rx_fills.fill_date
    - rx_fills.rx_fill_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_fills.rx_fill_id
      action_bindings:
        rx_fills.rx_fill_id: rx_fill_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the fill's expected delivery date
      anchor_source: rx_fills.fill_date
      relation: not_after
      duration_source: variants.lost_package_report_days
      unit: calendar_days
      counting_rule: Day counts are calendar days added to the anchor date (the anchor date plus N days is the date
        N days later), never full 24-hour periods, and the boundary date itself counts as within the limit.
      boundary: inclusive
  measures:
  - rx_msr_reships_per_fill
extended_policies:
- id: rx_ext_shipping_overcharge_refund
  base_policy_refs:
  - rx_returns_and_reships
  - rx_evt_shipping
  overwrite:
  - base_policy: rx_evt_shipping
    superseded_clause: 'Every shipment carries the fee of the speed the patient chose: shipping_standard_fee, shipping_expedited_fee
      or shipping_overnight_fee.'
    replaced_by: 'Every shipment carries the fee of the speed the patient chose: shipping_standard_fee, shipping_expedited_fee
      or shipping_overnight_fee, together with the Larkspur Pharmacy shipping surcharges stated in this rule for
      the fill''s records, each counted once.'
  trigger: state_due
  subject:
  - rx_charge_refunded
  computes: amount
  target_tool: refund_rx_shipping_overcharge_36ef431c
  params:
    peak_start: '2026-10-01'
    peak_end: '2027-01-15'
    peak_overnight: 3.5
    peak_expedited: 1.75
    weekday_anchor_monday: '2024-01-01'
    wknd_overnight: 8.0
    wknd_expedited: 4.0
    p90_overnight: 4.0
    p90_expedited: 2.0
    prot_high_floor: 100.0
    prot_mid_floor: 50.0
    prot_high: 2.95
    prot_mid: 1.95
  rule: 'A shipping line of a Larkspur Pharmacy shipment posted above the shipping schedule is corrected on its
    own line when the shipment''s fill charge line was posted on the cash member price basis; the shipment is the
    prescription''s latest dispensed fill, latest by fill_date, and its shipping line is the latest shipping charge
    line pointing at that fill. Every shipment carries the fee of the speed the patient chose: shipping_standard_fee,
    shipping_expedited_fee or shipping_overnight_fee, together with the Larkspur Pharmacy shipping surcharges stated
    in this rule for the fill''s records, each counted once. The shipping fee the shipping overcharge refund allows
    is the speed fee the shipping overcharge refund allows plus the surcharges and fees the shipping overcharge
    refund allows for the fill, each counted once. The speed fee the shipping overcharge refund allows is the fee
    of the speed recorded on the dispensed fill, taken from the level as shipping_standard_fee, shipping_expedited_fee
    or shipping_overnight_fee. The net shipping line the shipping overcharge refund measures is the amount of the
    shipment''s shipping line plus every refund line pointing at that shipping line. The shipping overcharge refund
    is the net shipping line less the shipping fee the shipping overcharge refund allows, rounded half up to the
    cent; when that difference is not above zero nothing is refunded and no line is written. The speed fee the shipping
    overcharge refund allows is set by the patient''s membership on the records: where the membership tier is in
    free_expedited_membership_tiers and the membership status is trialing, active or past_due and the fill shipped
    expedited, the speed fee the shipping overcharge refund allows is 0.00; where that tier and one of those statuses
    hold and the fill shipped overnight, the speed fee the shipping overcharge refund allows is shipping_overnight_fee
    less shipping_expedited_fee; for every other fill it is the fee of the speed recorded on the fill. The carrier
    peak-season surcharge the shipping overcharge refund allows applies to fills whose fill_date falls from peak_start
    through peak_end, both dates included: a fill shipped overnight on such a date carries peak_overnight; a fill
    shipped expedited on such a date carries peak_expedited; every other fill carries no peak-season surcharge.
    The weekend-transit fee the shipping overcharge refund allows depends on the weekday of the fill_date: a fill
    shipped overnight on a Friday carries wknd_overnight; a fill shipped expedited on a Thursday or a Friday carries
    wknd_expedited; every other fill carries no weekend-transit fee. The 90-day parcel surcharge the shipping overcharge
    refund allows depends on the days supply dispensed: a 90-day fill shipped overnight carries p90_overnight; a
    90-day fill shipped expedited carries p90_expedited; every other fill carries no 90-day parcel surcharge. The
    package protection the shipping overcharge refund allows is set by the fill charge lines posted for the dispensed
    fill on its fill_date: an expedited or overnight fill whose fill charges posted that day total prot_high_floor
    or more carries prot_high; an expedited or overnight fill whose fill charges posted that day total prot_mid_floor
    or more but less than prot_high_floor carries prot_mid; every other fill carries no package protection. The
    refund is written as one billing-error refund line pointing at the shipping line, and it is an agent correction
    on the verified account.'
  prerequisite: []
  cross_category:
  - category: membership
    as: branch
    reads:
    - variant_name
    - status
    note: the Premier speed waiver is decided from the patient's membership tier and status
  compute:
  - fid: LATEST('rx_fills','rx_fill_id', date_field='fill_date', event_type='rx_fill_dispensed')
  - speed: LATEST('rx_fills','shipping_speed', date_field='fill_date', rx_fill_id=fid)
  - fdate: LATEST('rx_fills','fill_date', date_field='fill_date', rx_fill_id=fid)
  - days: LATEST('rx_fills','days_supply_dispensed', date_field='fill_date', rx_fill_id=fid)
  - speed_fee: P('shipping_overnight_fee') if speed == 'overnight' else (P('shipping_expedited_fee') if speed ==
      'expedited' else P('shipping_standard_fee'))
  - ship_line: LATEST('rx_charges','rx_charge_id', date_field='charge_date', event_type='rx_shipping_charged', rx_fill_id=fid)
  - ship_posted: SUM('rx_charges','amount', event_type='rx_shipping_charged', rx_charge_id=ship_line)
  - ship_refunded: SUM('rx_charges','amount', event_type='rx_charge_refunded', original_charge_id=ship_line)
  - ship_net: ship_posted + ship_refunded
  - drug_basis: LATEST('rx_charges','price_basis', date_field='charge_date', event_type='rx_fill_charged', rx_fill_id=fid,
      charge_date=fdate)
  - in_scope: drug_basis == 'cash_member_price'
  - sp_tier: CFIELD('membership','variant_name')
  - sp_stat: CFIELD('membership','status')
  - sp_fee: 0.0 if (sp_tier in P('free_expedited_membership_tiers') and sp_stat in P('member_discount_statuses')
      and speed == 'expedited') else ((P('shipping_overnight_fee') - P('shipping_expedited_fee')) if (sp_tier in
      P('free_expedited_membership_tiers') and sp_stat in P('member_discount_statuses') and speed == 'overnight')
      else speed_fee)
  - pk_date: LATEST('rx_fills','fill_date', date_field='fill_date', rx_fill_id=fid) or ''
  - pk_fee: K('peak_overnight') if (pk_date >= K('peak_start') and pk_date <= K('peak_end') and speed == 'overnight')
      else (K('peak_expedited') if (pk_date >= K('peak_start') and pk_date <= K('peak_end') and speed == 'expedited')
      else 0.0)
  - wk_wd: DAYS(K('weekday_anchor_monday'), LATEST('rx_fills','fill_date', date_field='fill_date', rx_fill_id=fid)
      or K('weekday_anchor_monday')) % 7
  - wk_fee: K('wknd_overnight') if (wk_wd == 4 and speed == 'overnight') else (K('wknd_expedited') if ((wk_wd ==
      3 or wk_wd == 4) and speed == 'expedited') else 0.0)
  - pn_days: LATEST('rx_fills','days_supply_dispensed', date_field='fill_date', rx_fill_id=fid)
  - pn_fee: K('p90_overnight') if (pn_days == 90 and speed == 'overnight') else (K('p90_expedited') if (pn_days
      == 90 and speed == 'expedited') else 0.0)
  - pr_drug: SUM('rx_charges','amount', event_type='rx_fill_charged', rx_fill_id=fid, charge_date=fdate)
  - pr_fee: K('prot_high') if (pr_drug >= K('prot_high_floor') and (speed == 'expedited' or speed == 'overnight'))
      else (K('prot_mid') if (pr_drug >= K('prot_mid_floor') and pr_drug < K('prot_high_floor') and (speed == 'expedited'
      or speed == 'overnight')) else 0.0)
  - allowed: sp_fee + pk_fee + wk_fee + pn_fee + pr_fee
  - result: RND(MX(0.0, ship_net - allowed) + 0.000000001, 2) if in_scope else 0.0
  compute_basis:
    fid: A shipping line of a Larkspur Pharmacy shipment posted above the shipping schedule is corrected on its
      own line when the shipment's fill charge line was posted on the cash member price basis; the shipment is the
      prescription's latest dispensed fill, latest by fill_date, and its shipping line is the latest shipping charge
      line pointing at that fill.
    speed: The speed fee the shipping overcharge refund allows is the fee of the speed recorded on the dispensed
      fill, taken from the level as shipping_standard_fee, shipping_expedited_fee or shipping_overnight_fee.
    fdate: 'The carrier peak-season surcharge the shipping overcharge refund allows applies to fills whose fill_date
      falls from peak_start through peak_end, both dates included: a fill shipped overnight on such a date carries
      peak_overnight; a fill shipped expedited on such a date carries peak_expedited; every other fill carries no
      peak-season surcharge.'
    days: 'The 90-day parcel surcharge the shipping overcharge refund allows depends on the days supply dispensed:
      a 90-day fill shipped overnight carries p90_overnight; a 90-day fill shipped expedited carries p90_expedited;
      every other fill carries no 90-day parcel surcharge.'
    speed_fee: The speed fee the shipping overcharge refund allows is the fee of the speed recorded on the dispensed
      fill, taken from the level as shipping_standard_fee, shipping_expedited_fee or shipping_overnight_fee.
    ship_line: A shipping line of a Larkspur Pharmacy shipment posted above the shipping schedule is corrected on
      its own line when the shipment's fill charge line was posted on the cash member price basis; the shipment
      is the prescription's latest dispensed fill, latest by fill_date, and its shipping line is the latest shipping
      charge line pointing at that fill.
    ship_posted: The net shipping line the shipping overcharge refund measures is the amount of the shipment's shipping
      line plus every refund line pointing at that shipping line.
    ship_refunded: The net shipping line the shipping overcharge refund measures is the amount of the shipment's
      shipping line plus every refund line pointing at that shipping line.
    drug_basis: A shipping line of a Larkspur Pharmacy shipment posted above the shipping schedule is corrected
      on its own line when the shipment's fill charge line was posted on the cash member price basis; the shipment
      is the prescription's latest dispensed fill, latest by fill_date, and its shipping line is the latest shipping
      charge line pointing at that fill.
    in_scope: A shipping line of a Larkspur Pharmacy shipment posted above the shipping schedule is corrected on
      its own line when the shipment's fill charge line was posted on the cash member price basis; the shipment
      is the prescription's latest dispensed fill, latest by fill_date, and its shipping line is the latest shipping
      charge line pointing at that fill.
    sp_tier: 'The speed fee the shipping overcharge refund allows is set by the patient''s membership on the records:
      where the membership tier is in free_expedited_membership_tiers and the membership status is trialing, active
      or past_due and the fill shipped expedited, the speed fee the shipping overcharge refund allows is 0.00; where
      that tier and one of those statuses hold and the fill shipped overnight, the speed fee the shipping overcharge
      refund allows is shipping_overnight_fee less shipping_expedited_fee; for every other fill it is the fee of
      the speed recorded on the fill.'
    sp_stat: 'The speed fee the shipping overcharge refund allows is set by the patient''s membership on the records:
      where the membership tier is in free_expedited_membership_tiers and the membership status is trialing, active
      or past_due and the fill shipped expedited, the speed fee the shipping overcharge refund allows is 0.00; where
      that tier and one of those statuses hold and the fill shipped overnight, the speed fee the shipping overcharge
      refund allows is shipping_overnight_fee less shipping_expedited_fee; for every other fill it is the fee of
      the speed recorded on the fill.'
    sp_fee: 'The speed fee the shipping overcharge refund allows is set by the patient''s membership on the records:
      where the membership tier is in free_expedited_membership_tiers and the membership status is trialing, active
      or past_due and the fill shipped expedited, the speed fee the shipping overcharge refund allows is 0.00; where
      that tier and one of those statuses hold and the fill shipped overnight, the speed fee the shipping overcharge
      refund allows is shipping_overnight_fee less shipping_expedited_fee; for every other fill it is the fee of
      the speed recorded on the fill.'
    pk_date: 'The carrier peak-season surcharge the shipping overcharge refund allows applies to fills whose fill_date
      falls from peak_start through peak_end, both dates included: a fill shipped overnight on such a date carries
      peak_overnight; a fill shipped expedited on such a date carries peak_expedited; every other fill carries no
      peak-season surcharge.'
    pk_fee: 'The carrier peak-season surcharge the shipping overcharge refund allows applies to fills whose fill_date
      falls from peak_start through peak_end, both dates included: a fill shipped overnight on such a date carries
      peak_overnight; a fill shipped expedited on such a date carries peak_expedited; every other fill carries no
      peak-season surcharge.'
    wk_wd: 'The weekend-transit fee the shipping overcharge refund allows depends on the weekday of the fill_date:
      a fill shipped overnight on a Friday carries wknd_overnight; a fill shipped expedited on a Thursday or a Friday
      carries wknd_expedited; every other fill carries no weekend-transit fee.'
    wk_fee: 'The weekend-transit fee the shipping overcharge refund allows depends on the weekday of the fill_date:
      a fill shipped overnight on a Friday carries wknd_overnight; a fill shipped expedited on a Thursday or a Friday
      carries wknd_expedited; every other fill carries no weekend-transit fee.'
    pn_days: 'The 90-day parcel surcharge the shipping overcharge refund allows depends on the days supply dispensed:
      a 90-day fill shipped overnight carries p90_overnight; a 90-day fill shipped expedited carries p90_expedited;
      every other fill carries no 90-day parcel surcharge.'
    pn_fee: 'The 90-day parcel surcharge the shipping overcharge refund allows depends on the days supply dispensed:
      a 90-day fill shipped overnight carries p90_overnight; a 90-day fill shipped expedited carries p90_expedited;
      every other fill carries no 90-day parcel surcharge.'
    pr_drug: 'The package protection the shipping overcharge refund allows is set by the fill charge lines posted
      for the dispensed fill on its fill_date: an expedited or overnight fill whose fill charges posted that day
      total prot_high_floor or more carries prot_high; an expedited or overnight fill whose fill charges posted
      that day total prot_mid_floor or more but less than prot_high_floor carries prot_mid; every other fill carries
      no package protection.'
    pr_fee: 'The package protection the shipping overcharge refund allows is set by the fill charge lines posted
      for the dispensed fill on its fill_date: an expedited or overnight fill whose fill charges posted that day
      total prot_high_floor or more carries prot_high; an expedited or overnight fill whose fill charges posted
      that day total prot_mid_floor or more but less than prot_high_floor carries prot_mid; every other fill carries
      no package protection.'
    allowed: The shipping fee the shipping overcharge refund allows is the speed fee the shipping overcharge refund
      allows plus the surcharges and fees the shipping overcharge refund allows for the fill, each counted once.
    result: The shipping overcharge refund is the net shipping line less the shipping fee the shipping overcharge
      refund allows, rounded half up to the cent; when that difference is not above zero nothing is refunded and
      no line is written.
  factors:
  - id: premier_speed_waiver
    effect: method
    decides: sp_fee
    bindings:
    - sp_tier
    - sp_stat
    - sp_fee
    ladder:
    - when: the membership tier is in free_expedited_membership_tiers AND its status is trialing, active or past_due
        AND the fill shipped expedited
      method: 'the speed fee is waived: 0.00'
    - when: the membership tier is in free_expedited_membership_tiers AND its status is trialing, active or past_due
        AND the fill shipped overnight
      method: the speed fee is computed as shipping_overnight_fee less shipping_expedited_fee
    - when: otherwise
      method: the speed fee is the fee of the speed recorded on the fill
    baseline:
      sp_fee: speed_fee
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: peak_season_surcharge
    effect: parameter
    decides: pk_fee
    bindings:
    - pk_date
    - pk_fee
    ladder:
    - when: fill_date from peak_start through peak_end AND shipped overnight
      value: K('peak_overnight')
    - when: fill_date from peak_start through peak_end AND shipped expedited
      value: K('peak_expedited')
    - when: otherwise
      value: '0.00'
    baseline:
      pk_fee: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: weekend_transit_fee
    effect: parameter
    decides: wk_fee
    bindings:
    - wk_wd
    - wk_fee
    ladder:
    - when: fill_date is a Friday AND shipped overnight
      value: K('wknd_overnight')
    - when: fill_date is a Thursday or a Friday AND shipped expedited
      value: K('wknd_expedited')
    - when: otherwise
      value: '0.00'
    baseline:
      wk_fee: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: ninety_day_parcel
    effect: parameter
    decides: pn_fee
    bindings:
    - pn_days
    - pn_fee
    ladder:
    - when: 90-day fill AND shipped overnight
      value: K('p90_overnight')
    - when: 90-day fill AND shipped expedited
      value: K('p90_expedited')
    - when: otherwise
      value: '0.00'
    baseline:
      pn_fee: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: package_protection
    effect: parameter
    decides: pr_fee
    bindings:
    - pr_drug
    - pr_fee
    ladder:
    - when: fill charges posted on the fill_date total prot_high_floor or more AND shipped expedited or overnight
      value: K('prot_high')
    - when: fill charges posted on the fill_date total prot_mid_floor or more but less than prot_high_floor AND
        shipped expedited or overnight
      value: K('prot_mid')
    - when: otherwise
      value: '0.00'
    baseline:
      pr_fee: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The shipping fee the shipping overcharge refund allows is the speed fee the shipping overcharge refund
      allows plus the surcharges and fees the shipping overcharge refund allows for the fill, each counted once.
      The speed fee the shipping overcharge refund allows is the fee of the speed recorded on the dispensed fill,
      taken from the level as shipping_standard_fee, shipping_expedited_fee or shipping_overnight_fee. The net shipping
      line the shipping overcharge refund measures is the amount of the shipment's shipping line plus every refund
      line pointing at that shipping line. The shipping overcharge refund is the net shipping line less the shipping
      fee the shipping overcharge refund allows, rounded half up to the cent; when that difference is not above
      zero nothing is refunded and no line is written.
    params:
    - shipping_standard_fee
    - shipping_expedited_fee
    - shipping_overnight_fee
  inputs:
    history:
    - table: rx_fills
      aggregate: latest
      field: shipping_speed
      filters:
        event_type: rx_fill_dispensed
    - table: rx_charges
      aggregate: sum
      field: amount
      filters:
        event_type: rx_shipping_charged
    - table: rx_charges
      aggregate: sum
      field: amount
      filters:
        event_type: rx_charge_refunded
    - table: rx_charges
      aggregate: sum
      field: amount
      filters:
        event_type: rx_fill_charged
    cross_category:
    - membership
- id: rx_ext_cash_shipment_balance
  base_policy_refs:
  - rx_evt_fill_pricing
  - rx_evt_shipping
  overwrite:
  - base_policy: rx_evt_fill_pricing
    superseded_clause: Each fill Larkspur Pharmacy dispenses is charged once, at shipment (charge_timing).
    replaced_by: Each fill Larkspur Pharmacy dispenses is charged at shipment (charge_timing), and a cash shipment
      whose fill charge was posted on the cash member price basis below these rules is charged its balance later
      as a second fill charge line; every other fill is charged once.
  - base_policy: rx_evt_shipping
    superseded_clause: 'Every shipment carries the fee of the speed the patient chose: shipping_standard_fee, shipping_expedited_fee
      or shipping_overnight_fee.'
    replaced_by: 'Every shipment carries the fee of the speed the patient chose: shipping_standard_fee, shipping_expedited_fee
      or shipping_overnight_fee, together with the Larkspur Pharmacy shipping surcharges stated in this rule for
      the fill''s records, each counted once.'
  trigger: state_due
  subject:
  - rx_fill_charged
  computes: amount
  target_tool: pay_rx_shipment_balance_955e5801
  params:
    pct_premier_core: 30
    pct_plus_core: 20
    pct_ess_core: 10
    pct_premier_ext: 25
    pct_plus_ext: 15
    pct_ess_ext: 10
    pct_premier_spec: 15
    pct_plus_spec: 10
    pct_ess_spec: 5
    peak_start: '2026-10-01'
    peak_end: '2027-01-15'
    peak_overnight: 3.5
    peak_expedited: 1.75
    weekday_anchor_monday: '2024-01-01'
    wknd_overnight: 8.0
    wknd_expedited: 4.0
    p90_overnight: 4.0
    p90_expedited: 2.0
    prot_high_floor: 100.0
    prot_mid_floor: 50.0
    prot_high: 2.95
    prot_mid: 1.95
  rule: 'A cash shipment whose fill charge line was posted on the cash member price basis and which collected less
    than these rules give is settled by a balance charge; the shipment is the prescription''s latest dispensed fill,
    latest by fill_date. Each fill Larkspur Pharmacy dispenses is charged at shipment (charge_timing), and a cash
    shipment whose fill charge was posted on the cash member price basis below these rules is charged its balance
    later as a second fill charge line; every other fill is charged once. Every shipment carries the fee of the
    speed the patient chose: shipping_standard_fee, shipping_expedited_fee or shipping_overnight_fee, together with
    the Larkspur Pharmacy shipping surcharges stated in this rule for the fill''s records, each counted once. The
    total the shipment balance allows is the drug charge the shipment balance allows plus the shipping fee the shipment
    balance allows. The drug charge the shipment balance allows is the level''s cash_price_90_day for a 90-day fill
    and its cash_price_30_day for any other fill, as reduced by any percent this rule takes off it, rounded half
    up to the cent. The shipping fee the shipment balance allows is the speed fee the shipment balance allows plus
    the surcharges and fees the shipment balance allows for the fill, each counted once. The speed fee the shipment
    balance allows is the fee of the speed recorded on the dispensed fill, taken from the level as shipping_standard_fee,
    shipping_expedited_fee or shipping_overnight_fee. The amount the shipment balance counts as collected is every
    fill charge line and shipping charge line pointing at the dispensed fill plus every refund line pointing at
    that fill. The shipment balance is the total the shipment balance allows less the amount the shipment balance
    counts as collected, rounded half up to the cent; when that difference is not above zero no balance is owed
    and no line is written. The member percent the shipment balance takes off the cash price is the level''s member_discount_pct_by_membership_tier
    for the tier on the patient''s membership record, and applies only while that membership''s status is trialing,
    active or past_due: a Larkspur Premier Annual membership in one of those statuses takes the level''s Premier
    percent; a Larkspur Plus Monthly or Larkspur Plus Annual membership in one of those statuses takes the level''s
    Plus percent; a Larkspur Essentials Monthly or Larkspur Essentials Annual membership in one of those statuses
    takes the level''s Essentials percent; every other patient takes no member percent. The speed fee the shipment
    balance allows is set by the patient''s membership on the records: where the membership tier is in free_expedited_membership_tiers
    and the membership status is trialing, active or past_due and the fill shipped expedited, the speed fee the
    shipment balance allows is 0.00; where that tier and one of those statuses hold and the fill shipped overnight,
    the speed fee the shipment balance allows is shipping_overnight_fee less shipping_expedited_fee; for every other
    fill it is the fee of the speed recorded on the fill. The carrier peak-season surcharge the shipment balance
    allows applies to fills whose fill_date falls from peak_start through peak_end, both dates included: a fill
    shipped overnight on such a date carries peak_overnight; a fill shipped expedited on such a date carries peak_expedited;
    every other fill carries no peak-season surcharge. The weekend-transit fee the shipment balance allows depends
    on the weekday of the fill_date: a fill shipped overnight on a Friday carries wknd_overnight; a fill shipped
    expedited on a Thursday or a Friday carries wknd_expedited; every other fill carries no weekend-transit fee.
    The 90-day parcel surcharge the shipment balance allows depends on the days supply dispensed: a 90-day fill
    shipped overnight carries p90_overnight; a 90-day fill shipped expedited carries p90_expedited; every other
    fill carries no 90-day parcel surcharge. The package protection the shipment balance allows is set by the fill
    charge lines posted for the dispensed fill on its fill_date: an expedited or overnight fill whose fill charges
    posted that day total prot_high_floor or more carries prot_high; an expedited or overnight fill whose fill charges
    posted that day total prot_mid_floor or more but less than prot_high_floor carries prot_mid; every other fill
    carries no package protection. The shipment balance is fixed only after the shipment''s shipping line, plus
    every refund line pointing at it, stands no higher than the shipping fee the shipment balance allows. The shipment
    balance is not collected until every fill charge line of the same prescription posted on the pharmacy-benefit
    basis above the lesser of its recorded pbm patient pay and its member cash price carries a billing-error refund.
    Because the shortfall was not taken at shipment, the shipment balance is the patient''s own payment, made by
    the patient after the agent quotes the amount, and it is posted as one fill charge line on the cash member price
    basis pointing at the dispensed fill.'
  prerequisite:
  - problem: rx_ext_shipping_overcharge_refund
    kind: value_input
    gate: collected
    form: state
    policy_source: The shipment balance is fixed only after the shipment's shipping line, plus every refund line
      pointing at it, stands no higher than the shipping fee the shipment balance allows.
    condition: the shipment's shipping charge line plus the refund lines whose original_charge_id is that line total
      no more than the shipping fee the shipment balance allows
    resolved_by: refund_rx_shipping_overcharge_36ef431c
    effect: the billing-error refund on the shipping line lowers the amount the shipment balance counts as collected
      by the shipping overcharge, so the balance rises by that amount
  - problem: rx_ext_benefit_line_refund
    kind: state_gate
    gate: rx_charges.original_charge_id
    form: state
    policy_source: The shipment balance is not collected until every fill charge line of the same prescription posted
      on the pharmacy-benefit basis above the lesser of its recorded pbm patient pay and its member cash price carries
      a billing-error refund.
    condition: every pharmacy-benefit-basis fill charge line of the prescription posted above the lesser of its
      pbm patient pay and member cash price has a refund line whose original_charge_id names it
    resolved_by: refund_rx_benefit_line_87d0f93d
    effect: once the benefit-basis line carries its billing-error refund the shipment balance may be collected
  cross_category:
  - category: membership
    as: branch
    reads:
    - variant_name
    - status
    note: the member percent and the Premier speed waiver are decided from the patient's membership tier and status
  compute:
  - fid: LATEST('rx_fills','rx_fill_id', date_field='fill_date', event_type='rx_fill_dispensed')
  - speed: LATEST('rx_fills','shipping_speed', date_field='fill_date', rx_fill_id=fid)
  - fdate: LATEST('rx_fills','fill_date', date_field='fill_date', rx_fill_id=fid)
  - days: LATEST('rx_fills','days_supply_dispensed', date_field='fill_date', rx_fill_id=fid)
  - speed_fee: P('shipping_overnight_fee') if speed == 'overnight' else (P('shipping_expedited_fee') if speed ==
      'expedited' else P('shipping_standard_fee'))
  - drug_basis: LATEST('rx_charges','price_basis', date_field='charge_date', event_type='rx_fill_charged', rx_fill_id=fid,
      charge_date=fdate)
  - in_scope: drug_basis == 'cash_member_price'
  - cash: P('cash_price_90_day') if days == 90 else P('cash_price_30_day')
  - premier_pct_lvl: K('pct_premier_core') if (F('variant_name') == 'Larkspur Rx Value Generics' or F('variant_name')
      == 'Larkspur Rx Core Generics') else (K('pct_premier_ext') if F('variant_name') == 'Larkspur Rx Extended Generics'
      else (K('pct_premier_spec') if F('variant_name') == 'Larkspur Rx Specialty Generics' else 0))
  - plus_pct_lvl: K('pct_plus_core') if (F('variant_name') == 'Larkspur Rx Value Generics' or F('variant_name')
      == 'Larkspur Rx Core Generics') else (K('pct_plus_ext') if F('variant_name') == 'Larkspur Rx Extended Generics'
      else (K('pct_plus_spec') if F('variant_name') == 'Larkspur Rx Specialty Generics' else 0))
  - ess_pct_lvl: K('pct_ess_core') if (F('variant_name') == 'Larkspur Rx Value Generics' or F('variant_name') ==
      'Larkspur Rx Core Generics') else (K('pct_ess_ext') if F('variant_name') == 'Larkspur Rx Extended Generics'
      else (K('pct_ess_spec') if F('variant_name') == 'Larkspur Rx Specialty Generics' else 0))
  - mb_tier: CFIELD('membership','variant_name')
  - mb_stat: CFIELD('membership','status')
  - mb_pct: premier_pct_lvl if (mb_tier == 'Larkspur Premier Annual' and mb_stat in P('member_discount_statuses'))
      else (plus_pct_lvl if ((mb_tier == 'Larkspur Plus Monthly' or mb_tier == 'Larkspur Plus Annual') and mb_stat
      in P('member_discount_statuses')) else (ess_pct_lvl if ((mb_tier == 'Larkspur Essentials Monthly' or mb_tier
      == 'Larkspur Essentials Annual') and mb_stat in P('member_discount_statuses')) else 0))
  - drug_total: RND(cash * (100 - mb_pct) / 100 + 0.000000001, 2)
  - sp_tier: CFIELD('membership','variant_name')
  - sp_stat: CFIELD('membership','status')
  - sp_fee: 0.0 if (sp_tier in P('free_expedited_membership_tiers') and sp_stat in P('member_discount_statuses')
      and speed == 'expedited') else ((P('shipping_overnight_fee') - P('shipping_expedited_fee')) if (sp_tier in
      P('free_expedited_membership_tiers') and sp_stat in P('member_discount_statuses') and speed == 'overnight')
      else speed_fee)
  - pk_date: LATEST('rx_fills','fill_date', date_field='fill_date', rx_fill_id=fid) or ''
  - pk_fee: K('peak_overnight') if (pk_date >= K('peak_start') and pk_date <= K('peak_end') and speed == 'overnight')
      else (K('peak_expedited') if (pk_date >= K('peak_start') and pk_date <= K('peak_end') and speed == 'expedited')
      else 0.0)
  - wk_wd: DAYS(K('weekday_anchor_monday'), LATEST('rx_fills','fill_date', date_field='fill_date', rx_fill_id=fid)
      or K('weekday_anchor_monday')) % 7
  - wk_fee: K('wknd_overnight') if (wk_wd == 4 and speed == 'overnight') else (K('wknd_expedited') if ((wk_wd ==
      3 or wk_wd == 4) and speed == 'expedited') else 0.0)
  - pn_days: LATEST('rx_fills','days_supply_dispensed', date_field='fill_date', rx_fill_id=fid)
  - pn_fee: K('p90_overnight') if (pn_days == 90 and speed == 'overnight') else (K('p90_expedited') if (pn_days
      == 90 and speed == 'expedited') else 0.0)
  - pr_drug: SUM('rx_charges','amount', event_type='rx_fill_charged', rx_fill_id=fid, charge_date=fdate)
  - pr_fee: K('prot_high') if (pr_drug >= K('prot_high_floor') and (speed == 'expedited' or speed == 'overnight'))
      else (K('prot_mid') if (pr_drug >= K('prot_mid_floor') and pr_drug < K('prot_high_floor') and (speed == 'expedited'
      or speed == 'overnight')) else 0.0)
  - ship_total: sp_fee + pk_fee + wk_fee + pn_fee + pr_fee
  - collected: SUM('rx_charges','amount', rx_fill_id=fid)
  - result: RND(MX(0.0, drug_total + ship_total - collected) + 0.000000001, 2) if in_scope else 0.0
