  factors:
  - id: member_percent
    effect: parameter
    decides: mb_pct
    bindings:
    - mb_tier
    - mb_stat
    - mb_pct
    ladder:
    - when: membership tier Larkspur Premier Annual AND status trialing, active or past_due
      value: the level's Premier member_discount_pct_by_membership_tier
    - when: membership tier Larkspur Plus Monthly or Larkspur Plus Annual AND status trialing, active or past_due
      value: the level's Plus member_discount_pct_by_membership_tier
    - when: membership tier Larkspur Essentials Monthly or Larkspur Essentials Annual AND status trialing, active
        or past_due
      value: the level's Essentials member_discount_pct_by_membership_tier
    - when: otherwise
      value: '0'
    baseline:
      mb_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: premier_speed_waiver
    effect: method
    decides: sp_fee
    bindings:
    - sp_tier
    - sp_stat
    - sp_fee
    ladder:
    - when: the membership tier is in free_expedited_membership_tiers AND its status is trialing, active or past_due
        AND the fill shipped expedited
      method: 'the speed fee is waived: 0.00'
    - when: the membership tier is in free_expedited_membership_tiers AND its status is trialing, active or past_due
        AND the fill shipped overnight
      method: the speed fee is computed as shipping_overnight_fee less shipping_expedited_fee
    - when: otherwise
      method: the speed fee is the fee of the speed recorded on the fill
    baseline:
      sp_fee: speed_fee
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: weekend_transit_fee
    effect: parameter
    decides: wk_fee
    bindings:
    - wk_wd
    - wk_fee
    ladder:
    - when: fill_date is a Friday AND shipped overnight
      value: K('wknd_overnight')
    - when: fill_date is a Thursday or a Friday AND shipped expedited
      value: K('wknd_expedited')
    - when: otherwise
      value: '0.00'
    baseline:
      wk_fee: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: ninety_day_parcel
    effect: parameter
    decides: pn_fee
    bindings:
    - pn_days
    - pn_fee
    ladder:
    - when: 90-day fill AND shipped overnight
      value: K('p90_overnight')
    - when: 90-day fill AND shipped expedited
      value: K('p90_expedited')
    - when: otherwise
      value: '0.00'
    baseline:
      pn_fee: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: package_protection
    effect: parameter
    decides: pr_fee
    bindings:
    - pr_drug
    - pr_fee
    ladder:
    - when: fill charges posted on the fill_date total prot_high_floor or more AND shipped expedited or overnight
      value: K('prot_high')
    - when: fill charges posted on the fill_date total prot_mid_floor or more but less than prot_high_floor AND
        shipped expedited or overnight
      value: K('prot_mid')
    - when: otherwise
      value: '0.00'
    baseline:
      pr_fee: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The total the benefit-line refund allows is the drug charge the benefit-line refund allows plus the shipping
      fee the benefit-line refund allows. The drug charge the benefit-line refund allows is the lesser of the pbm
      patient pay recorded on the line and the member cash price the benefit-line refund allows. The member cash
      price the benefit-line refund allows is the level's cash_price_90_day for a 90-day fill and its cash_price_30_day
      for any other fill, as reduced by any percent this rule takes off it, rounded half up to the cent. The shipping
      fee the benefit-line refund allows is the speed fee the benefit-line refund allows plus the surcharges and
      fees the benefit-line refund allows for the fill, each counted once. The speed fee the benefit-line refund
      allows is the fee of the speed recorded on the dispensed fill, taken from the level as shipping_standard_fee,
      shipping_expedited_fee or shipping_overnight_fee. The amount the benefit-line refund counts as collected is
      every fill charge line and shipping charge line pointing at the dispensed fill plus every refund line pointing
      at that fill. The benefit-line refund is the amount the benefit-line refund counts as collected less the total
      the benefit-line refund allows, rounded half up to the cent; when that difference is not above zero nothing
      is refunded and no line is written.
