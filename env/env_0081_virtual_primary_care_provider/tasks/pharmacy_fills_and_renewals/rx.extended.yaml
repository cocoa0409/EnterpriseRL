    an expedited or overnight fill whose fill charges posted that day total prot_mid_floor or more but less than
    prot_high_floor carries prot_mid; every other fill carries no package protection. Because the fee was not taken
    at shipment, the owed shipping payment is the patient''s own payment, made by the patient after the agent quotes
    the amount, and it is posted as one shipping charge line pointing at the dispensed fill.'
