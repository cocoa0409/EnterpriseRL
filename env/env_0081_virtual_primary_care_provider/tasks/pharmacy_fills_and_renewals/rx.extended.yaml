    charges posted that day total prot_high_floor or more carries prot_high; an expedited or overnight fill whose
    fill charges posted that day total prot_mid_floor or more but less than prot_high_floor carries prot_mid; every
    other fill carries no package protection. The cash shipment refund is worked out only after the shipment''s
    records carry a shipping line for the dispensed fill whenever the shipping fee the cash shipment refund allows
    is above zero. The refund is written as one billing-error refund line pointing at the shipment''s fill charge
    line, and it is an agent correction on the verified account.'
