    or shipping_overnight_fee. The amount the cash shipment refund counts as collected is every fill charge line
    and shipping charge line pointing at the dispensed fill plus every refund line pointing at that fill. The cash
    shipment refund is the amount the cash shipment refund counts as collected less the total the cash shipment
    refund allows, rounded half up to the cent; when that difference is not above zero nothing is refunded and no
    line is written. The member percent the cash shipment refund takes off the cash price is the level''s member_discount_pct_by_membership_tier
    for the tier on the patient''s membership record, and applies only while that membership''s status is trialing,
    active or past_due: a Larkspur Premier Annual membership in one of those statuses takes the level''s Premier
    percent; a Larkspur Plus Monthly or Larkspur Plus Annual membership in one of those statuses takes the level''s
    Plus percent; a Larkspur Essentials Monthly or Larkspur Essentials Annual membership in one of those statuses
    takes the level''s Essentials percent; every other patient takes no member percent. The speed fee the cash shipment
    refund allows is set by the patient''s membership on the records: where the membership tier is in free_expedited_membership_tiers
    and the membership status is trialing, active or past_due and the fill shipped expedited, the speed fee the
    cash shipment refund allows is 0.00; where that tier and one of those statuses hold and the fill shipped overnight,
    the speed fee the cash shipment refund allows is shipping_overnight_fee less shipping_expedited_fee; for every
