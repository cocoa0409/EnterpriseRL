  rule: 'A shipment whose fill charge line was posted on the cash price basis and whose records carry no shipping
    line owes the shipping fee this rule gives it; the shipment is the prescription''s latest dispensed fill, latest
    by fill_date. Every shipment carries the fee of the speed the patient chose: shipping_standard_fee, shipping_expedited_fee
    or shipping_overnight_fee, together with the Larkspur Pharmacy shipping surcharges stated in this rule for the
    fill''s records, each counted once. The shipping fee the owed shipping payment allows is the speed fee the owed
    shipping payment allows plus the surcharges and fees the owed shipping payment allows for the fill, each counted
    once. The speed fee the owed shipping payment allows is the fee of the speed recorded on the dispensed fill,
    taken from the level as shipping_standard_fee, shipping_expedited_fee or shipping_overnight_fee. The owed shipping
    payment is the shipping fee the owed shipping payment allows, rounded half up to the cent; when that fee is
    not above zero, or a shipping line already points at the fill, nothing is owed and no line is written. The speed
    fee the owed shipping payment allows is set by the patient''s membership on the records: where the membership
    tier is in free_expedited_membership_tiers and the membership status is trialing, active or past_due and the
    fill shipped expedited, the speed fee the owed shipping payment allows is 0.00; where that tier and one of those
    statuses hold and the fill shipped overnight, the speed fee the owed shipping payment allows is shipping_overnight_fee
    less shipping_expedited_fee; for every other fill it is the fee of the speed recorded on the fill. The carrier
    peak-season surcharge the owed shipping payment allows applies to fills whose fill_date falls from peak_start
    through peak_end, both dates included: a fill shipped overnight on such a date carries peak_overnight; a fill
    shipped expedited on such a date carries peak_expedited; every other fill carries no peak-season surcharge.
    The weekend-transit fee the owed shipping payment allows depends on the weekday of the fill_date: a fill shipped
    overnight on a Friday carries wknd_overnight; a fill shipped expedited on a Thursday or a Friday carries wknd_expedited;
    every other fill carries no weekend-transit fee. The 90-day parcel surcharge the owed shipping payment allows
    depends on the days supply dispensed: a 90-day fill shipped overnight carries p90_overnight; a 90-day fill shipped
    expedited carries p90_expedited; every other fill carries no 90-day parcel surcharge. The package protection
