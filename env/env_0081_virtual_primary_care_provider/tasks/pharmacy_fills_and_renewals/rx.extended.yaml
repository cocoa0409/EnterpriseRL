- id: rx_ext_benefit_line_refund
  base_policy_refs:
  - rx_returns_and_reships
  - rx_evt_fill_pricing
  - rx_evt_shipping
  overwrite:
  - base_policy: rx_returns_and_reships
    superseded_clause: A charge differing from these rules is corrected by refunding the overcharged difference
      with refund_reason billing_error.
    replaced_by: 'A charge differing from these rules is corrected by refunding the overcharged difference on its
      own line with refund_reason billing_error, except on two kinds of shipment, each settled by one billing-error
      refund on its fill charge line for the whole shipment: a shipment whose fill charge line was posted on the
      cash price basis, and a shipment whose fill charge line was posted on the pharmacy-benefit basis for a level
      whose lower_of_cash_or_benefit is true.'
  - base_policy: rx_evt_shipping
    superseded_clause: 'Every shipment carries the fee of the speed the patient chose: shipping_standard_fee, shipping_expedited_fee
      or shipping_overnight_fee.'
    replaced_by: 'Every shipment carries the fee of the speed the patient chose: shipping_standard_fee, shipping_expedited_fee
      or shipping_overnight_fee, together with the Larkspur Pharmacy shipping surcharges stated in this rule for
      the fill''s records, each counted once.'
  trigger: state_due
  subject:
  - rx_charge_refunded
  computes: amount
  target_tool: refund_rx_benefit_line_87d0f93d
  params:
    pct_premier_core: 30
    pct_plus_core: 20
    pct_ess_core: 10
    pct_premier_ext: 25
    pct_plus_ext: 15
    pct_ess_ext: 10
    pct_premier_spec: 15
    pct_plus_spec: 10
    pct_ess_spec: 5
    peak_start: '2026-10-01'
    peak_end: '2027-01-15'
    peak_overnight: 3.5
    peak_expedited: 1.75
    weekday_anchor_monday: '2024-01-01'
    wknd_overnight: 8.0
    wknd_expedited: 4.0
    p90_overnight: 4.0
    p90_expedited: 2.0
    prot_high_floor: 100.0
    prot_mid_floor: 50.0
    prot_high: 2.95
    prot_mid: 1.95
  rule: 'A fill charge line posted on the pharmacy-benefit basis for a level whose lower_of_cash_or_benefit is true
    is re-priced by this refund; the line is the prescription''s latest fill charge line posted on that basis, latest
    by charge_date, and the shipment is the dispensed fill that line points at. A charge differing from these rules
    is corrected by refunding the overcharged difference on its own line with refund_reason billing_error, except
    on two kinds of shipment, each settled by one billing-error refund on its fill charge line for the whole shipment:
    a shipment whose fill charge line was posted on the cash price basis, and a shipment whose fill charge line
    was posted on the pharmacy-benefit basis for a level whose lower_of_cash_or_benefit is true. Every shipment
    carries the fee of the speed the patient chose: shipping_standard_fee, shipping_expedited_fee or shipping_overnight_fee,
    together with the Larkspur Pharmacy shipping surcharges stated in this rule for the fill''s records, each counted
    once. The total the benefit-line refund allows is the drug charge the benefit-line refund allows plus the shipping
    fee the benefit-line refund allows. The drug charge the benefit-line refund allows is the lesser of the pbm
    patient pay recorded on the line and the member cash price the benefit-line refund allows. The member cash price
    the benefit-line refund allows is the level''s cash_price_90_day for a 90-day fill and its cash_price_30_day
    for any other fill, as reduced by any percent this rule takes off it, rounded half up to the cent. The shipping
    fee the benefit-line refund allows is the speed fee the benefit-line refund allows plus the surcharges and fees
    the benefit-line refund allows for the fill, each counted once. The speed fee the benefit-line refund allows
    is the fee of the speed recorded on the dispensed fill, taken from the level as shipping_standard_fee, shipping_expedited_fee
    or shipping_overnight_fee. The amount the benefit-line refund counts as collected is every fill charge line
    and shipping charge line pointing at the dispensed fill plus every refund line pointing at that fill. The benefit-line
    refund is the amount the benefit-line refund counts as collected less the total the benefit-line refund allows,
    rounded half up to the cent; when that difference is not above zero nothing is refunded and no line is written.
    The member percent the benefit-line refund takes off the cash price is the level''s member_discount_pct_by_membership_tier
    for the tier on the patient''s membership record, and applies only while that membership''s status is trialing,
    active or past_due: a Larkspur Premier Annual membership in one of those statuses takes the level''s Premier
    percent; a Larkspur Plus Monthly or Larkspur Plus Annual membership in one of those statuses takes the level''s
    Plus percent; a Larkspur Essentials Monthly or Larkspur Essentials Annual membership in one of those statuses
    takes the level''s Essentials percent; every other patient takes no member percent. The speed fee the benefit-line
    refund allows is set by the patient''s membership on the records: where the membership tier is in free_expedited_membership_tiers
    and the membership status is trialing, active or past_due and the fill shipped expedited, the speed fee the
    benefit-line refund allows is 0.00; where that tier and one of those statuses hold and the fill shipped overnight,
    the speed fee the benefit-line refund allows is shipping_overnight_fee less shipping_expedited_fee; for every
    other fill it is the fee of the speed recorded on the fill. The carrier peak-season surcharge the benefit-line
    refund allows applies to fills whose fill_date falls from peak_start through peak_end, both dates included:
    a fill shipped overnight on such a date carries peak_overnight; a fill shipped expedited on such a date carries
    peak_expedited; every other fill carries no peak-season surcharge. The weekend-transit fee the benefit-line
    refund allows depends on the weekday of the fill_date: a fill shipped overnight on a Friday carries wknd_overnight;
    a fill shipped expedited on a Thursday or a Friday carries wknd_expedited; every other fill carries no weekend-transit
    fee. The 90-day parcel surcharge the benefit-line refund allows depends on the days supply dispensed: a 90-day
    fill shipped overnight carries p90_overnight; a 90-day fill shipped expedited carries p90_expedited; every other
    fill carries no 90-day parcel surcharge. The package protection the benefit-line refund allows is set by the
    fill charge lines posted for the dispensed fill on its fill_date: an expedited or overnight fill whose fill
    charges posted that day total prot_high_floor or more carries prot_high; an expedited or overnight fill whose
    fill charges posted that day total prot_mid_floor or more but less than prot_high_floor carries prot_mid; every
    other fill carries no package protection. The refund is written as one billing-error refund line pointing at
    the benefit-basis fill charge line, and it is an agent correction on the verified account.'
  prerequisite: []
  cross_category:
  - category: membership
    as: branch
    reads:
    - variant_name
    - status
    note: the member percent and the Premier speed waiver are decided from the patient's membership tier and status
  compute:
  - bline: LATEST('rx_charges','rx_charge_id', date_field='charge_date', event_type='rx_fill_charged', price_basis='pbm_patient_pay')
  - pbm: LATEST('rx_charges','pbm_patient_pay', date_field='charge_date', rx_charge_id=bline)
  - fid: LATEST('rx_charges','rx_fill_id', date_field='charge_date', event_type='rx_fill_charged', price_basis='pbm_patient_pay')
  - speed: LATEST('rx_fills','shipping_speed', date_field='fill_date', rx_fill_id=fid)
  - fdate: LATEST('rx_fills','fill_date', date_field='fill_date', rx_fill_id=fid)
  - days: LATEST('rx_fills','days_supply_dispensed', date_field='fill_date', rx_fill_id=fid)
  - speed_fee: P('shipping_overnight_fee') if speed == 'overnight' else (P('shipping_expedited_fee') if speed ==
      'expedited' else P('shipping_standard_fee'))
  - in_scope: P('lower_of_cash_or_benefit') == True and bline != None
  - cash: P('cash_price_90_day') if days == 90 else P('cash_price_30_day')
  - premier_pct_lvl: K('pct_premier_core') if (F('variant_name') == 'Larkspur Rx Value Generics' or F('variant_name')
      == 'Larkspur Rx Core Generics') else (K('pct_premier_ext') if F('variant_name') == 'Larkspur Rx Extended Generics'
      else (K('pct_premier_spec') if F('variant_name') == 'Larkspur Rx Specialty Generics' else 0))
  - plus_pct_lvl: K('pct_plus_core') if (F('variant_name') == 'Larkspur Rx Value Generics' or F('variant_name')
      == 'Larkspur Rx Core Generics') else (K('pct_plus_ext') if F('variant_name') == 'Larkspur Rx Extended Generics'
      else (K('pct_plus_spec') if F('variant_name') == 'Larkspur Rx Specialty Generics' else 0))
  - ess_pct_lvl: K('pct_ess_core') if (F('variant_name') == 'Larkspur Rx Value Generics' or F('variant_name') ==
      'Larkspur Rx Core Generics') else (K('pct_ess_ext') if F('variant_name') == 'Larkspur Rx Extended Generics'
      else (K('pct_ess_spec') if F('variant_name') == 'Larkspur Rx Specialty Generics' else 0))
  - mb_tier: CFIELD('membership','variant_name')
  - mb_stat: CFIELD('membership','status')
  - mb_pct: premier_pct_lvl if (mb_tier == 'Larkspur Premier Annual' and mb_stat in P('member_discount_statuses'))
      else (plus_pct_lvl if ((mb_tier == 'Larkspur Plus Monthly' or mb_tier == 'Larkspur Plus Annual') and mb_stat
      in P('member_discount_statuses')) else (ess_pct_lvl if ((mb_tier == 'Larkspur Essentials Monthly' or mb_tier
      == 'Larkspur Essentials Annual') and mb_stat in P('member_discount_statuses')) else 0))
  - member_cash: RND(cash * (100 - mb_pct) / 100 + 0.000000001, 2)
  - drug_total: MN(pbm, member_cash) if pbm != None else member_cash
  - sp_tier: CFIELD('membership','variant_name')
  - sp_stat: CFIELD('membership','status')
  - sp_fee: 0.0 if (sp_tier in P('free_expedited_membership_tiers') and sp_stat in P('member_discount_statuses')
      and speed == 'expedited') else ((P('shipping_overnight_fee') - P('shipping_expedited_fee')) if (sp_tier in
      P('free_expedited_membership_tiers') and sp_stat in P('member_discount_statuses') and speed == 'overnight')
      else speed_fee)
  - pk_date: LATEST('rx_fills','fill_date', date_field='fill_date', rx_fill_id=fid) or ''
  - pk_fee: K('peak_overnight') if (pk_date >= K('peak_start') and pk_date <= K('peak_end') and speed == 'overnight')
      else (K('peak_expedited') if (pk_date >= K('peak_start') and pk_date <= K('peak_end') and speed == 'expedited')
      else 0.0)
  - wk_wd: DAYS(K('weekday_anchor_monday'), LATEST('rx_fills','fill_date', date_field='fill_date', rx_fill_id=fid)
      or K('weekday_anchor_monday')) % 7
  - wk_fee: K('wknd_overnight') if (wk_wd == 4 and speed == 'overnight') else (K('wknd_expedited') if ((wk_wd ==
      3 or wk_wd == 4) and speed == 'expedited') else 0.0)
  - pn_days: LATEST('rx_fills','days_supply_dispensed', date_field='fill_date', rx_fill_id=fid)
  - pn_fee: K('p90_overnight') if (pn_days == 90 and speed == 'overnight') else (K('p90_expedited') if (pn_days
      == 90 and speed == 'expedited') else 0.0)
  - pr_drug: SUM('rx_charges','amount', event_type='rx_fill_charged', rx_fill_id=fid, charge_date=fdate)
  - pr_fee: K('prot_high') if (pr_drug >= K('prot_high_floor') and (speed == 'expedited' or speed == 'overnight'))
      else (K('prot_mid') if (pr_drug >= K('prot_mid_floor') and pr_drug < K('prot_high_floor') and (speed == 'expedited'
      or speed == 'overnight')) else 0.0)
  - ship_total: sp_fee + pk_fee + wk_fee + pn_fee + pr_fee
  - collected: SUM('rx_charges','amount', rx_fill_id=fid)
  - result: RND(MX(0.0, collected - drug_total - ship_total) + 0.000000001, 2) if in_scope else 0.0
  compute_basis:
