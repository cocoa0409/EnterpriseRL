  - speed_fee: P('shipping_overnight_fee') if speed == 'overnight' else (P('shipping_expedited_fee') if speed ==
      'expedited' else P('shipping_standard_fee'))
  - drug_basis: LATEST('rx_charges','price_basis', date_field='charge_date', event_type='rx_fill_charged', rx_fill_id=fid,
      charge_date=fdate)
  - in_scope: drug_basis == 'cash_price'
  - cash: P('cash_price_90_day') if days == 90 else P('cash_price_30_day')
  - premier_pct_lvl: K('pct_premier_core') if (F('variant_name') == 'Larkspur Rx Value Generics' or F('variant_name')
      == 'Larkspur Rx Core Generics') else (K('pct_premier_ext') if F('variant_name') == 'Larkspur Rx Extended Generics'
      else (K('pct_premier_spec') if F('variant_name') == 'Larkspur Rx Specialty Generics' else 0))
  - plus_pct_lvl: K('pct_plus_core') if (F('variant_name') == 'Larkspur Rx Value Generics' or F('variant_name')
      == 'Larkspur Rx Core Generics') else (K('pct_plus_ext') if F('variant_name') == 'Larkspur Rx Extended Generics'
      else (K('pct_plus_spec') if F('variant_name') == 'Larkspur Rx Specialty Generics' else 0))
  - ess_pct_lvl: K('pct_ess_core') if (F('variant_name') == 'Larkspur Rx Value Generics' or F('variant_name') ==
      'Larkspur Rx Core Generics') else (K('pct_ess_ext') if F('variant_name') == 'Larkspur Rx Extended Generics'
      else (K('pct_ess_spec') if F('variant_name') == 'Larkspur Rx Specialty Generics' else 0))
  - mb_tier: CFIELD('membership','variant_name')
  - mb_stat: CFIELD('membership','status')
  - mb_pct: premier_pct_lvl if (mb_tier == 'Larkspur Premier Annual' and mb_stat in P('member_discount_statuses'))
      else (plus_pct_lvl if ((mb_tier == 'Larkspur Plus Monthly' or mb_tier == 'Larkspur Plus Annual') and mb_stat
      in P('member_discount_statuses')) else (ess_pct_lvl if ((mb_tier == 'Larkspur Essentials Monthly' or mb_tier
      == 'Larkspur Essentials Annual') and mb_stat in P('member_discount_statuses')) else 0))
  - drug_total: RND(cash * (100 - mb_pct) / 100 + 0.000000001, 2)
  - sp_tier: CFIELD('membership','variant_name')
  - sp_stat: CFIELD('membership','status')
  - sp_fee: 0.0 if (sp_tier in P('free_expedited_membership_tiers') and sp_stat in P('member_discount_statuses')
      and speed == 'expedited') else ((P('shipping_overnight_fee') - P('shipping_expedited_fee')) if (sp_tier in
      P('free_expedited_membership_tiers') and sp_stat in P('member_discount_statuses') and speed == 'overnight')
      else speed_fee)
  - pk_date: LATEST('rx_fills','fill_date', date_field='fill_date', rx_fill_id=fid) or ''
  - pk_fee: K('peak_overnight') if (pk_date >= K('peak_start') and pk_date <= K('peak_end') and speed == 'overnight')
      else (K('peak_expedited') if (pk_date >= K('peak_start') and pk_date <= K('peak_end') and speed == 'expedited')
      else 0.0)
  - wk_wd: DAYS(K('weekday_anchor_monday'), LATEST('rx_fills','fill_date', date_field='fill_date', rx_fill_id=fid)
      or K('weekday_anchor_monday')) % 7
  - wk_fee: K('wknd_overnight') if (wk_wd == 4 and speed == 'overnight') else (K('wknd_expedited') if ((wk_wd ==
      3 or wk_wd == 4) and speed == 'expedited') else 0.0)
  - pn_days: LATEST('rx_fills','days_supply_dispensed', date_field='fill_date', rx_fill_id=fid)
  - pn_fee: K('p90_overnight') if (pn_days == 90 and speed == 'overnight') else (K('p90_expedited') if (pn_days
      == 90 and speed == 'expedited') else 0.0)
  - pr_drug: SUM('rx_charges','amount', event_type='rx_fill_charged', rx_fill_id=fid, charge_date=fdate)
  - pr_fee: K('prot_high') if (pr_drug >= K('prot_high_floor') and (speed == 'expedited' or speed == 'overnight'))
      else (K('prot_mid') if (pr_drug >= K('prot_mid_floor') and pr_drug < K('prot_high_floor') and (speed == 'expedited'
      or speed == 'overnight')) else 0.0)
  - ship_total: sp_fee + pk_fee + wk_fee + pn_fee + pr_fee
  - collected: SUM('rx_charges','amount', rx_fill_id=fid)
  - result: RND(MX(0.0, collected - drug_total - ship_total) + 0.000000001, 2) if in_scope else 0.0
  compute_basis:
    fid: A cash shipment whose fill charge line was posted on the cash price basis is settled by one refund for
      the whole shipment; the shipment is the prescription's latest dispensed fill, latest by fill_date.
    drug_basis: A cash shipment whose fill charge line was posted on the cash price basis is settled by one refund
      for the whole shipment; the shipment is the prescription's latest dispensed fill, latest by fill_date.
    in_scope: A cash shipment whose fill charge line was posted on the cash price basis is settled by one refund
      for the whole shipment; the shipment is the prescription's latest dispensed fill, latest by fill_date.
    drug_total: The drug charge the cash shipment refund allows is the level's cash_price_90_day for a 90-day fill
      and its cash_price_30_day for any other fill, as reduced by any percent this rule takes off it, rounded half
      up to the cent.
    collected: The amount the cash shipment refund counts as collected is every fill charge line and shipping charge
      line pointing at the dispensed fill plus every refund line pointing at that fill.
    result: The cash shipment refund is the amount the cash shipment refund counts as collected less the total the
      cash shipment refund allows, rounded half up to the cent; when that difference is not above zero nothing is
      refunded and no line is written.
    speed: The speed fee the cash shipment refund allows is the fee of the speed recorded on the dispensed fill,
      taken from the level as shipping_standard_fee, shipping_expedited_fee or shipping_overnight_fee.
    fdate: 'The carrier peak-season surcharge the cash shipment refund allows applies to fills whose fill_date falls
      from peak_start through peak_end, both dates included: a fill shipped overnight on such a date carries peak_overnight;
      a fill shipped expedited on such a date carries peak_expedited; every other fill carries no peak-season surcharge.'
    days: 'The 90-day parcel surcharge the cash shipment refund allows depends on the days supply dispensed: a 90-day
      fill shipped overnight carries p90_overnight; a 90-day fill shipped expedited carries p90_expedited; every
      other fill carries no 90-day parcel surcharge.'
    speed_fee: The speed fee the cash shipment refund allows is the fee of the speed recorded on the dispensed fill,
      taken from the level as shipping_standard_fee, shipping_expedited_fee or shipping_overnight_fee.
    sp_tier: 'The speed fee the cash shipment refund allows is set by the patient''s membership on the records:
      where the membership tier is in free_expedited_membership_tiers and the membership status is trialing, active
      or past_due and the fill shipped expedited, the speed fee the cash shipment refund allows is 0.00; where that
      tier and one of those statuses hold and the fill shipped overnight, the speed fee the cash shipment refund
      allows is shipping_overnight_fee less shipping_expedited_fee; for every other fill it is the fee of the speed
      recorded on the fill.'
    sp_stat: 'The speed fee the cash shipment refund allows is set by the patient''s membership on the records:
      where the membership tier is in free_expedited_membership_tiers and the membership status is trialing, active
      or past_due and the fill shipped expedited, the speed fee the cash shipment refund allows is 0.00; where that
      tier and one of those statuses hold and the fill shipped overnight, the speed fee the cash shipment refund
      allows is shipping_overnight_fee less shipping_expedited_fee; for every other fill it is the fee of the speed
      recorded on the fill.'
    sp_fee: 'The speed fee the cash shipment refund allows is set by the patient''s membership on the records: where
      the membership tier is in free_expedited_membership_tiers and the membership status is trialing, active or
      past_due and the fill shipped expedited, the speed fee the cash shipment refund allows is 0.00; where that
      tier and one of those statuses hold and the fill shipped overnight, the speed fee the cash shipment refund
      allows is shipping_overnight_fee less shipping_expedited_fee; for every other fill it is the fee of the speed
      recorded on the fill.'
    pk_date: 'The carrier peak-season surcharge the cash shipment refund allows applies to fills whose fill_date
      falls from peak_start through peak_end, both dates included: a fill shipped overnight on such a date carries
      peak_overnight; a fill shipped expedited on such a date carries peak_expedited; every other fill carries no
      peak-season surcharge.'
    pk_fee: 'The carrier peak-season surcharge the cash shipment refund allows applies to fills whose fill_date
      falls from peak_start through peak_end, both dates included: a fill shipped overnight on such a date carries
      peak_overnight; a fill shipped expedited on such a date carries peak_expedited; every other fill carries no
      peak-season surcharge.'
    wk_wd: 'The weekend-transit fee the cash shipment refund allows depends on the weekday of the fill_date: a fill
      shipped overnight on a Friday carries wknd_overnight; a fill shipped expedited on a Thursday or a Friday carries
      wknd_expedited; every other fill carries no weekend-transit fee.'
    wk_fee: 'The weekend-transit fee the cash shipment refund allows depends on the weekday of the fill_date: a
      fill shipped overnight on a Friday carries wknd_overnight; a fill shipped expedited on a Thursday or a Friday
      carries wknd_expedited; every other fill carries no weekend-transit fee.'
    pn_days: 'The 90-day parcel surcharge the cash shipment refund allows depends on the days supply dispensed:
      a 90-day fill shipped overnight carries p90_overnight; a 90-day fill shipped expedited carries p90_expedited;
      every other fill carries no 90-day parcel surcharge.'
    pn_fee: 'The 90-day parcel surcharge the cash shipment refund allows depends on the days supply dispensed: a
      90-day fill shipped overnight carries p90_overnight; a 90-day fill shipped expedited carries p90_expedited;
      every other fill carries no 90-day parcel surcharge.'
    pr_drug: 'The package protection the cash shipment refund allows is set by the fill charge lines posted for
      the dispensed fill on its fill_date: an expedited or overnight fill whose fill charges posted that day total
      prot_high_floor or more carries prot_high; an expedited or overnight fill whose fill charges posted that day
      total prot_mid_floor or more but less than prot_high_floor carries prot_mid; every other fill carries no package
      protection.'
    pr_fee: 'The package protection the cash shipment refund allows is set by the fill charge lines posted for the
      dispensed fill on its fill_date: an expedited or overnight fill whose fill charges posted that day total prot_high_floor
      or more carries prot_high; an expedited or overnight fill whose fill charges posted that day total prot_mid_floor
      or more but less than prot_high_floor carries prot_mid; every other fill carries no package protection.'
    ship_total: The shipping fee the cash shipment refund allows is the speed fee the cash shipment refund allows
      plus the surcharges and fees the cash shipment refund allows for the fill, each counted once.
    premier_pct_lvl: 'The member percent the cash shipment refund takes off the cash price is the level''s member_discount_pct_by_membership_tier
      for the tier on the patient''s membership record, and applies only while that membership''s status is trialing,
      active or past_due: a Larkspur Premier Annual membership in one of those statuses takes the level''s Premier
      percent; a Larkspur Plus Monthly or Larkspur Plus Annual membership in one of those statuses takes the level''s
      Plus percent; a Larkspur Essentials Monthly or Larkspur Essentials Annual membership in one of those statuses
      takes the level''s Essentials percent; every other patient takes no member percent.'
    plus_pct_lvl: 'The member percent the cash shipment refund takes off the cash price is the level''s member_discount_pct_by_membership_tier
      for the tier on the patient''s membership record, and applies only while that membership''s status is trialing,
      active or past_due: a Larkspur Premier Annual membership in one of those statuses takes the level''s Premier
      percent; a Larkspur Plus Monthly or Larkspur Plus Annual membership in one of those statuses takes the level''s
      Plus percent; a Larkspur Essentials Monthly or Larkspur Essentials Annual membership in one of those statuses
      takes the level''s Essentials percent; every other patient takes no member percent.'
    ess_pct_lvl: 'The member percent the cash shipment refund takes off the cash price is the level''s member_discount_pct_by_membership_tier
      for the tier on the patient''s membership record, and applies only while that membership''s status is trialing,
      active or past_due: a Larkspur Premier Annual membership in one of those statuses takes the level''s Premier
      percent; a Larkspur Plus Monthly or Larkspur Plus Annual membership in one of those statuses takes the level''s
      Plus percent; a Larkspur Essentials Monthly or Larkspur Essentials Annual membership in one of those statuses
      takes the level''s Essentials percent; every other patient takes no member percent.'
    mb_tier: 'The member percent the cash shipment refund takes off the cash price is the level''s member_discount_pct_by_membership_tier
      for the tier on the patient''s membership record, and applies only while that membership''s status is trialing,
      active or past_due: a Larkspur Premier Annual membership in one of those statuses takes the level''s Premier
      percent; a Larkspur Plus Monthly or Larkspur Plus Annual membership in one of those statuses takes the level''s
      Plus percent; a Larkspur Essentials Monthly or Larkspur Essentials Annual membership in one of those statuses
      takes the level''s Essentials percent; every other patient takes no member percent.'
    mb_stat: 'The member percent the cash shipment refund takes off the cash price is the level''s member_discount_pct_by_membership_tier
      for the tier on the patient''s membership record, and applies only while that membership''s status is trialing,
      active or past_due: a Larkspur Premier Annual membership in one of those statuses takes the level''s Premier
      percent; a Larkspur Plus Monthly or Larkspur Plus Annual membership in one of those statuses takes the level''s
      Plus percent; a Larkspur Essentials Monthly or Larkspur Essentials Annual membership in one of those statuses
      takes the level''s Essentials percent; every other patient takes no member percent.'
    mb_pct: 'The member percent the cash shipment refund takes off the cash price is the level''s member_discount_pct_by_membership_tier
      for the tier on the patient''s membership record, and applies only while that membership''s status is trialing,
      active or past_due: a Larkspur Premier Annual membership in one of those statuses takes the level''s Premier
      percent; a Larkspur Plus Monthly or Larkspur Plus Annual membership in one of those statuses takes the level''s
      Plus percent; a Larkspur Essentials Monthly or Larkspur Essentials Annual membership in one of those statuses
      takes the level''s Essentials percent; every other patient takes no member percent.'
    cash: The drug charge the cash shipment refund allows is the level's cash_price_90_day for a 90-day fill and
      its cash_price_30_day for any other fill, as reduced by any percent this rule takes off it, rounded half up
      to the cent.
  factors:
  - id: member_percent
    effect: parameter
    decides: mb_pct
    bindings:
    - mb_tier
    - mb_stat
    - mb_pct
    ladder:
    - when: membership tier Larkspur Premier Annual AND status trialing, active or past_due
      value: the level's Premier member_discount_pct_by_membership_tier
    - when: membership tier Larkspur Plus Monthly or Larkspur Plus Annual AND status trialing, active or past_due
      value: the level's Plus member_discount_pct_by_membership_tier
    - when: membership tier Larkspur Essentials Monthly or Larkspur Essentials Annual AND status trialing, active
        or past_due
      value: the level's Essentials member_discount_pct_by_membership_tier
    - when: otherwise
      value: '0'
    baseline:
      mb_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: premier_speed_waiver
    effect: method
    decides: sp_fee
    bindings:
    - sp_tier
    - sp_stat
    - sp_fee
    ladder:
    - when: the membership tier is in free_expedited_membership_tiers AND its status is trialing, active or past_due
        AND the fill shipped expedited
      method: 'the speed fee is waived: 0.00'
    - when: the membership tier is in free_expedited_membership_tiers AND its status is trialing, active or past_due
        AND the fill shipped overnight
      method: the speed fee is computed as shipping_overnight_fee less shipping_expedited_fee
    - when: otherwise
      method: the speed fee is the fee of the speed recorded on the fill
    baseline:
      sp_fee: speed_fee
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: peak_season_surcharge
    effect: parameter
    decides: pk_fee
    bindings:
    - pk_date
    - pk_fee
    ladder:
    - when: fill_date from peak_start through peak_end AND shipped overnight
      value: K('peak_overnight')
    - when: fill_date from peak_start through peak_end AND shipped expedited
      value: K('peak_expedited')
    - when: otherwise
      value: '0.00'
    baseline:
      pk_fee: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: weekend_transit_fee
    effect: parameter
    decides: wk_fee
    bindings:
    - wk_wd
    - wk_fee
    ladder:
    - when: fill_date is a Friday AND shipped overnight
      value: K('wknd_overnight')
    - when: fill_date is a Thursday or a Friday AND shipped expedited
      value: K('wknd_expedited')
    - when: otherwise
      value: '0.00'
    baseline:
      wk_fee: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: package_protection
    effect: parameter
    decides: pr_fee
    bindings:
    - pr_drug
    - pr_fee
    ladder:
    - when: fill charges posted on the fill_date total prot_high_floor or more AND shipped expedited or overnight
      value: K('prot_high')
    - when: fill charges posted on the fill_date total prot_mid_floor or more but less than prot_high_floor AND
        shipped expedited or overnight
      value: K('prot_mid')
    - when: otherwise
      value: '0.00'
    baseline:
      pr_fee: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The total the cash shipment refund allows is the drug charge the cash shipment refund allows plus the
      shipping fee the cash shipment refund allows. The drug charge the cash shipment refund allows is the level's
      cash_price_90_day for a 90-day fill and its cash_price_30_day for any other fill, as reduced by any percent
      this rule takes off it, rounded half up to the cent. The shipping fee the cash shipment refund allows is the
      speed fee the cash shipment refund allows plus the surcharges and fees the cash shipment refund allows for
      the fill, each counted once. The speed fee the cash shipment refund allows is the fee of the speed recorded
      on the dispensed fill, taken from the level as shipping_standard_fee, shipping_expedited_fee or shipping_overnight_fee.
      The amount the cash shipment refund counts as collected is every fill charge line and shipping charge line
      pointing at the dispensed fill plus every refund line pointing at that fill. The cash shipment refund is the
      amount the cash shipment refund counts as collected less the total the cash shipment refund allows, rounded
      half up to the cent; when that difference is not above zero nothing is refunded and no line is written.
    params:
    - cash_price_90_day
    - cash_price_30_day
    - shipping_standard_fee
    - shipping_expedited_fee
    - shipping_overnight_fee
  inputs:
    history:
    - table: rx_fills
      aggregate: latest
      field: shipping_speed
      filters:
        event_type: rx_fill_dispensed
    - table: rx_charges
      aggregate: sum
      field: amount
      filters: {}
    cross_category:
    - membership
