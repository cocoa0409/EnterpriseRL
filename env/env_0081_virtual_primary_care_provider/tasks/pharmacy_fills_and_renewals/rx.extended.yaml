  - ship_lines: COUNT('rx_charges', event_type='rx_shipping_charged', rx_fill_id=fid)
  - in_scope: drug_basis == 'cash_price' and ship_lines == 0
  - sp_tier: CFIELD('membership','variant_name')
  - sp_stat: CFIELD('membership','status')
