name: env_0082_community_solar_subscription_provider
company: Meadowlark Community Solar

background: |
  Meadowlark Community Solar is a community solar subscription provider that develops, owns and operates about seventy ground-mounted community solar projects in New York, Minnesota, Illinois and Maryland and serves roughly 41,000 subscriber accounts from its subscriber services center in Saint Paul, Minnesota.
  Each project is built under its state's program — New York Community Distributed Generation with Value Stack crediting, Xcel Energy Solar*Rewards Community in Minnesota, Illinois Shines community solar, and Maryland Community Solar — and is interconnected to one utility, such as National Grid, NYSEG, Central Hudson, Xcel Energy, ComEd, Ameren Illinois, BGE or Pepco.
  The company's tone is plain-spoken and practical: subscribers are neighbors buying a share of a local solar farm, not investors, and staff explain credits, filings and bills in everyday words.
  A subscription is a share of one project, measured in kilowatts of capacity, tied to one utility account; the utility credits that account each month with the value of the share's production, and Meadowlark bills its subscription charge against those credits.
  Residential households hold Residential Community Solar Subscriptions on the plans Meadowlark Flex 5, Meadowlark Standard 10, Meadowlark Commit 3, Meadowlark Commit 5, Meadowlark Commit 10 and Meadowlark Commit 20.
  Income-eligible households hold Meadowlark Access Income-Eligible Subscriptions on Meadowlark Access 15, Meadowlark Access 20, Meadowlark Access 25, Meadowlark Access Housing 20, Meadowlark Access Neighborhood 15 and Meadowlark Access Solar for All 50.
  Small businesses hold Small Business Community Solar Subscriptions on Meadowlark Business Starter, Meadowlark Business Standard, Meadowlark Business Plus, Meadowlark Business Pro, Meadowlark Business Premier and Meadowlark Business Multi-Site.
  In Minnesota, older and some newer gardens are sold as Garden Fixed-Rate Subscriptions at a contracted price per kilowatt-hour with an annual escalator: Garden Fixed 10, Garden Fixed 15, Garden Fixed 20, Garden Fixed 25, Garden Business Fixed 15 and Garden Business Fixed 25.
  Farms hold Agricultural Community Solar Subscriptions (Meadowlark Farm Flex, Meadowlark Farm 5, Meadowlark Farm 10, Meadowlark Farm 20, Meadowlark Farm Irrigation 10 and Meadowlark Farm Co-op 20), and nonprofits, houses of worship and public agencies hold Civic and Nonprofit Community Solar Subscriptions (Meadowlark Civic Flex, Meadowlark Civic 5, Meadowlark Civic 10, Meadowlark Civic 20, Meadowlark Faith Community 10 and Meadowlark Public Agency 20).
  When a project is full, customers hold Project Waitlist Reservations in one of six classes: the Income-Eligible Priority Waitlist, Relocation Priority Waitlist, Residential Standard Waitlist, Residential Add-On Waitlist, Small Business Waitlist and Community Partner Waitlist.
  Every subscription is booked as a stream of records: allocation filings submitted to the utility, monthly bill credit statements reported by the utility, subscription charges, payments, fees and billing credits on its ledger, annual true-up reviews, and subscriber requests for allocation changes, move transfers, billing changes and cancellations.
  Callers are mostly homeowners and renters checking why a month's credit or charge looks different, people about to move, small business owners resizing a share after changing their premises, and organizations' bookkeepers reconciling invoices.
  A typical household holds one residential or Access subscription, sometimes a second share on another project or a Minnesota fixed-rate garden share, and often a waitlist reservation for more capacity; a business may hold several sites, a fixed-rate garden share and a reservation for a new project.
  Their histories carry months of credit statements and charges, the odd late or reversed utility credit, earlier allocation changes, past true-ups, and sometimes a subscription closed after a move to another utility's territory.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: residential_bill_credits_and_charges
    claim:
      categories: [home]
      event_types: [home_credit_posted, home_credit_reversed, home_charge_billed, home_late_fee_assessed, home_payment_received,
                    home_payment_returned, home_returned_fee_assessed, home_billing_credited, home_billing_type_changed]
    summary: >
      Residential subscribers on every plan from Meadowlark Flex 5 to Meadowlark Commit 20 call about the monthly flow of
      utility bill credits and Meadowlark subscription charges: a credit that posted late, was reversed and re-posted, or was
      partly banked by the utility, a charge that looks wrong for the month, a late fee, a returned payment, or a wish to
      switch between consolidated and dual billing; their situation varies with plan, billing arrangement, program and
      utility, subscription status (active, transfer pending, notice given, or closed with credits still arriving), and with
      other Meadowlark holdings such as a second share or a Minnesota fixed-rate garden share on the same utility account.
      The records involved are the subscription, its credit statements, its billing ledger and its billing requests, read
      against the utility account and project, and the governing rules are home_evt_subscription_charge (pricing of each
      posted credit by the plan's savings rate, invoicing and due dates, estimates and their offset),
      home_evt_credit_correction (reversals, billing errors, disputes), home_evt_payment_application, home_evt_late_fee (grace
      period and fee bounds per plan), home_billing_arrangement and the account-wide home_benefit_basis; in the natural
      course of the business the utility posts a credit, the charge is invoiced, payment or the utility's remittance follows,
      and any reversal or correction is booked afterwards.
      The agent verifies the caller, reads the statements and ledger, and books charges, billing credits and fees the rules
      determine, while payments are made by the subscriber through the secure payment portal and a billing-arrangement
      switch or billing dispute is the subscriber's own request.
      Requests no rule decides — such as compensation for value the utility itself miscalculated in its Value Stack or
      bill-credit components, refunds of utility charges, or relief from the utility's own late fees — have no policy
      here and are handed to a person as POLICY_NOT_COVERED.

  - name: business_allocation_changes_and_trueups
    claim:
      categories: [biz]
      event_types: [biz_allocation_filed, biz_allocation_reduced, biz_change_fee_assessed, biz_trueup_completed,
                    biz_billing_credited]
    summary: >
      Small business subscribers on plans from Meadowlark Business Starter to Meadowlark Business Multi-Site call to grow or
      shrink a share after expanding, downsizing or changing equipment at a premises, or to understand the outcome of the
      annual true-up that compares a contract year's credited production with the usage of the utility account and with the
      plan's production guarantee; their setting varies with plan and term, contract year, the number and timing of earlier
      changes, program filing calendars, project capacity, the account's usage history, and other holdings that share the
      same utility account's sizing limit, such as a Garden Business fixed-rate share or a waitlist reservation.
      The records are the subscription, its allocation filings, requests, credit statements, billing ledger and true-up
      reviews, read with the utility account and project, under biz_allocation_change (filing calendar, first-change wait,
      yearly change limit and decrease allowance with the excess-decrease fee per plan), biz_agg_account_sizing (cross-line
      sizing against usage and program ceilings) and biz_evt_annual_trueup (production guarantee shortfall credit and
      right-sizing); in the natural course of business a request is received, filed in the next window and takes effect from
      the utility's next cycle, and each anniversary closes a contract year that is reviewed once.
      The agent files the increases, decreases, fees, review results and guarantee credits that the rules determine, while
      the change request itself is the business's own request and the agent never invents a size the records and rules do
      not yield.
      Requests outside the rules — a share larger than any program allows, compensation for business interruption, a
      retroactive allocation for months already credited, or a guarantee on a plan that carries none — are not covered and
      go to a person as POLICY_NOT_COVERED.

  - name: income_eligible_move_transfers
    claim:
      categories: [access]
      event_types: [access_transfer_requested, access_transfer_completed, access_transfer_lapsed, access_allocation_reassigned,
                    access_allocation_reduced, access_recertified, access_charge_billed]
    summary: >
      Income-eligible households on Meadowlark Access plans call when they are moving and want to keep their share, when
      the new home is in another utility's territory, when the new account's usage is lower than the old one's, or when a
      recertification falls due around the move; the setting varies with plan and eligibility track (income documents,
      utility assistance enrollment, affordable housing residence, geographic designation or Illinois Solar for All),
      program and utility, move-out date and the timing of the request, the new account's status, data authorization,
      usage and community designation, and the household's other records such as a closed residential plan or a waitlist
      reservation.
      The records are the Access subscription and its requests, allocation filings and credit statements, the old and new
      utility accounts and the project, under access_transfer_at_move (transfer window, same-utility requirement,
      resize to the new account, lapse), access_eligibility_tracks and access_recertification, together with the filing
      calendar of access_allocation_change and the sizing limits of access_agg_account_sizing; in the natural course of a
      move the household states its move-out date and new account, the reassignment is filed in the next window, and credits
      for earlier months keep posting to the old account until it takes effect.
      The agent records the transfer outcome, reassignment, resize or lapse and any recertification the rules and records
      support, while the transfer request and the facts about the move are the household's own statements and the
      household's eligibility evidence is never replaced by what the caller says.
      Situations the rules do not decide — a move to a utility where Meadowlark has no project and the caller asks for
      compensation, a request to hold the share for a property not yet purchased, or disputes over the utility's final
      bill — are handed to a person as POLICY_NOT_COVERED.

  - name: project_waitlist_reservations
    claim:
      categories: [waitlist]
      event_types: [waitlist_joined, waitlist_confirmed, waitlist_declined_ineligible, waitlist_offer_extended,
                    waitlist_offer_made, waitlist_offer_declined, waitlist_offer_expired, waitlist_lapsed, waitlist_reinstated,
                    waitlist_withdrawn, waitlist_reconfirmed, waitlist_request_updated]
    summary: >
      Households, small businesses and community organizations call about reservations for full projects: joining a class,
      learning why a reservation was declined or lapsed, asking what an offer of capacity contains, declining or letting an
      offer expire, reconfirming, changing the requested size or utility account, or asking to be reinstated; their setting
      varies with the class (Income-Eligible Priority, Relocation Priority, Residential Standard, Residential Add-On, Small
      Business, Community Partner), the target line and plan, the queue date and decline history, and the subscriptions the
      same utility account already holds in any line, which limit the size any offer can have.
      The records are the reservation, its offers and notices, the projects' capacity and estimates, the utility account,
      and the customer's subscriptions and closed subscriptions in every line, under waitlist_eligibility,
      waitlist_agg_account_headroom, waitlist_queue_order, waitlist_evt_offer_terms (offered size, plan, first-year kWh and
      savings estimate, response date), waitlist_offer_response, waitlist_reconfirmation, waitlist_request_changes and
      waitlist_withdrawal_and_reinstatement; in the natural course a reservation is submitted, confirmed into the queue,
      reconfirmed periodically and eventually offered capacity.
      The agent confirms, declines, sizes and records offers, reconfirmations, changes, lapses and reinstatements the rules
      determine, while joining, answering an offer, withdrawing and reconfirming are the customer's own acts.
      Requests no rule decides — jumping the queue for a reason no class recognizes, a guaranteed offer date, reserving
      capacity on a project in a different utility territory, or payment for a missed offer — are handed to a person as
      POLICY_NOT_COVERED.

  - name: garden_cancellations_and_termination_fees
    claim:
      categories: [garden]
      event_types: [garden_notice_given, garden_notice_withdrawn, garden_closed, garden_preactivation_cancelled,
                    garden_etf_assessed, garden_allocation_reduced, garden_successor_assigned, garden_transfer_lapsed,
                    garden_charge_billed]
    summary: >
      Minnesota subscribers on Garden Fixed-Rate plans (Garden Fixed 10 through Garden Fixed 25 and the two Garden Business
      Fixed plans) call to cancel, to understand the scheduled end date and early termination fee, to withdraw a notice, to
      cancel before their share starts producing, to assign the contract to the buyer of their home or business, or because
      they are leaving Xcel Energy's territory; the setting varies with plan and term, contract year and escalated contract
      rate, notice date against the filing calendar, closure reason (cancellation, death of the subscriber, out-of-territory
      move, successor assignment), and other holdings such as a percent-savings subscription on another project or a
      waitlist reservation.
      The records are the garden subscription with its contract rate, notice and scheduled end dates, its allocation
      filings, credit statements, billing ledger and requests, read with the utility account and project, under
      garden_cancellation (notice period, scheduled end date, the fee per kW per remaining contract year with its per-plan
      cap and waivers), garden_transfer_at_move, garden_evt_subscription_charge for credits that keep posting after closing,
      and the filing calendar of garden_allocation_change; in the natural course notice is given, the removal is filed for
      the first effective date the notice period allows, the subscription closes and the fee, if any, is assessed on the
      closing date.
      The agent records the notice outcome, removal, closing and fee the rules determine, while giving or withdrawing
      notice and assigning the contract are the subscriber's own acts and an estate's notice comes from the estate.
      Requests the rules do not decide — buying out the fixed rate early at a negotiated price, a refund of escalator
      increases already billed, or a reduced fee for hardship — are not covered and go to a person as POLICY_NOT_COVERED.
