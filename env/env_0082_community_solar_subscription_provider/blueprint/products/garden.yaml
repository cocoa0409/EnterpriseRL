# Policy charter of one product category of Meadowlark Community Solar (env_0082).
# Single registry of every quantified policy of this category; the runtime never reads this file.
category: garden
display_name: Garden Fixed-Rate Subscriptions
binding:
  holding_table: garden_subscriptions
  event_tables: [garden_allocations, garden_credits, garden_billing, garden_reviews]
  intake_tables: [garden_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {allocation_kw: allocation}
lifecycle:
  states: [applied, allocated, active, transfer_pending, notice_given, closed]
  transitions:
  - {from: applied, to: allocated, by: agent, means: Meadowlark approves the utility-data review and submits
      the initial allocation filing.}
  - {from: applied, to: closed, by: user, means: The subscriber rescinds the signed agreement within the
      rescission period.}
  - {from: applied, to: closed, by: agent, means: Meadowlark declines the application because an enrollment
      requirement is not met.}
  - {from: allocated, to: active, by: system, means: The first bill credit statement posts on the utility
      account.}
  - {from: allocated, to: closed, by: user, means: The subscriber cancels before the first bill credit
      posts.}
  - {from: active, to: transfer_pending, by: user, means: The subscriber requests a move transfer to a
      new utility account.}
  - {from: transfer_pending, to: active, by: system, means: The reassignment filing to the new utility
      account takes effect.}
  - {from: transfer_pending, to: closed, by: system, means: The move transfer cannot be completed and
      the allocation is removed.}
  - {from: active, to: notice_given, by: user, means: The subscriber gives notice of cancellation.}
  - {from: notice_given, to: active, by: user, means: The subscriber withdraws the cancellation notice
      before the scheduled end date.}
  - {from: notice_given, to: closed, by: system, means: The allocation removal takes effect on the scheduled
      end date.}
  - {from: active, to: closed, by: agent, means: Meadowlark removes the subscriber for nonpayment after
      the removal notice period.}
  - {from: active, to: closed, by: user, means: The subscriber assigns the agreement to a successor who
      enrolls in their own name.}
accounts:
- key: allocation
  unit: kW AC
  meaning: >-
    share of the project filed with the utility for this subscription; holding field allocation_kw is
    its running sum
- {key: bill_credit, unit: USD, meaning: cumulative utility bill credit value allocated to the subscriber's
    utility account under this subscription}
- key: balance
  unit: USD
  meaning: >-
    amount the subscriber owes Meadowlark under this subscription (charges and fees less payments and
    billing credits)
parameter_schema:
  eligible_customer_types: list of customer_type values that may sign this plan
  eligible_programs: list of program codes (projects.program) whose projects offer this plan
  min_annual_usage_kwh: minimum trailing-12-month consumption of the utility account to enroll, kWh
  min_allocation_kw: smallest share that may be held on this plan, kW AC
  max_allocation_kw: largest share that may be held on one subscription of this plan, kW AC
  allocation_increment_kw: shares, increases, decreases and resizes are sized down to a whole multiple
    of this, kW AC
  sizing_cap_pct: >-
    plan sizing cap: expected annual production of the utility account's Meadowlark shares may not exceed
    this percent of its annual usage (the lesser of this and the program ceiling applies)
  usage_data_max_age_months: >-
    the utility account's annual_usage_kwh may be used for sizing only if usage_as_of_month is no more
    than this many months before the month of the sizing decision
  credit_review_required: true when the plan requires a business credit review before approval (switch)
  income_verification_required: true when the plan requires verified income or program eligibility (switch)
  utility_data_authorization_required: true when a utility-data release authorization must be on file
    before enrollment (switch)
  pricing_method: >-
    pct_of_credit (charge = credit value less the savings rate) or fixed_rate (charge = credited kWh times
    the contract rate)
  savings_rate_pct: >-
    percent of each bill credit's value the subscriber keeps on pct_of_credit plans; 0.0 on fixed_rate
    plans (not applicable)
  fixed_rate_per_kwh: >-
    contract rate offered to new signings on fixed_rate plans, USD per kWh, 4 decimals; 0.0000 on pct_of_credit
    plans
  annual_escalator_pct: >-
    yearly escalation of the fixed contract rate at each contract anniversary, percent; 0.0 where the
    rate does not escalate
  charge_rounding: 'rounding of every money amount: half_up_cent (round half up to the cent)'
  invoice_issue_days_after_posting: calendar days after a credit statement's posted_date on which its
    subscription charge is invoiced
  estimated_billing_allowed: true when Meadowlark may bill an estimated charge for a late utility statement
    (switch)
  estimate_wait_days: calendar days after the end of a statement month without a posted credit before
    an estimate may be billed
  estimate_basis_months: number of most recent actual subscription charges averaged to form an estimate
  max_consecutive_estimates: most estimated charges that may be billed in a row before billing waits for
    the utility statement
  billing_types_offered: >-
    billing arrangements the plan supports (consolidated, dual); consolidated also requires a program
    listed for it
  invoice_due_days: calendar days from invoice date to due date for dual-billed charges and fees
  late_fee_grace_days: calendar days after the due date before a late fee may be assessed
  late_fee_pct: late fee as a percent of the unpaid amount of the overdue charge; 0.0 means the plan carries
    no late fee
  late_fee_min_usd: minimum late fee per overdue charge, USD
  late_fee_max_usd: maximum late fee per overdue charge, USD
  returned_payment_fee_usd: fee per payment returned unpaid by the bank, USD; 0.00 means no fee
  payment_methods: payment methods accepted for dual-billed balances
  payment_application_order: 'order in which payments settle open lines: oldest_due_first'
  nonpayment_removal_days_past_due: >-
    calendar days a dual-billed charge must remain unpaid past its due date before removal for nonpayment
    may proceed
  nonpayment_removal_min_balance_usd: past-due balance at or above which removal for nonpayment may proceed,
    USD
  removal_notice_days: calendar days between the removal notice and the removal
  security_deposit_months: >-
    months of estimated subscription charges held as a security deposit when the credit review requires
    one; 0 where no deposit is taken
  deposit_refund_on_time_months: >-
    consecutive statement months without a late fee after which a held deposit is released; 0 where no
    deposit is taken
  allocation_changes_per_contract_year: subscriber-requested allocation changes (increases and decreases)
    allowed per contract year
  max_decrease_pct_per_contract_year: >-
    percent of the share held at the start of the contract year that may be removed by subscriber decreases
    in that year without fee
  excess_decrease_fee_per_kw_usd: fee per kW removed beyond the yearly decrease allowance, USD per kW
  min_months_before_first_change: >-
    whole calendar months after activation_date before the first subscriber-requested allocation change
    may be filed
  increase_waitlist_when_full: >-
    true when an increase the project cannot fill may be queued on the Residential Add-On Waitlist (or
    the line's waitlist class) (switch)
  term_months: committed term from activation, months; 0 means no committed term
  post_term_renewal: 'what follows the committed term: month_to_month on the same savings terms'
  cancellation_notice_days: calendar days of notice before the cancellation removal may take effect
  preactivation_cancel_fee_usd: fee for cancelling after approval but before the first credit posts, USD;
    0.00 means none
  etf_per_kw_per_remaining_year_usd: early termination fee per kW of share per remaining contract year
    or part year, USD
  etf_cap_usd: maximum early termination fee per subscription, USD
  etf_waiver_out_of_territory_move: >-
    true when the ETF is waived for a move to an address no Meadowlark project can serve under the same
    utility (switch)
  etf_waiver_deceased: true when the ETF is waived when the subscriber has died and the estate gives notice
    (switch)
  etf_waiver_successor_transfer: true when the ETF is waived on assignment to a qualifying successor (switch)
  rescission_business_days: business days after the signing day within which the subscriber may rescind
    without fee
  transfer_window_days: calendar days after the stated move-out date within which a move transfer request
    must be received
  successor_transfer_allowed: true when the agreement may be assigned to a successor (switch)
  transfer_resize_to_new_usage: true when a move transfer resizes the share to the new account's sizing
    limit (switch)
  production_guarantee_pct: percent of expected annual production the plan guarantees per contract year;
    0 means no guarantee
  annual_review_enabled: true when the annual true-up is performed for this plan (switch)
  oversize_review_threshold_pct: the true-up resizes the share when its expected annual production exceeds
    this percent of the year's usage
  resize_target_pct: percent of the year's usage the expected annual production is resized down to
  recert_interval_months: months between eligibility recertifications; 0 means no recertification
  dispute_late_fee_hold: true when no late fee may be assessed on a line under an open billing dispute
    (switch)
  dispute_resolution_days: calendar days from receipt within which Meadowlark decides a billing dispute
