- id: garden_transfer_at_move
  subject: [garden_transfer_requested, garden_transfer_completed, garden_transfer_lapsed, garden_allocation_reassigned,
    garden_successor_assigned]
  rule: >-
    A subscriber who moves may keep the share by transferring it to a new utility account in their own
    name. A move transfer is accepted only when its request is received no later than transfer_window_days
    calendar days after the move-out date the subscriber states. Calendar days are counted from the day
    after the stated move-out date; the last window day still qualifies. The new account must be on file,
    active, carry a data_authorization_date and be served by the same utility as the project, because
    an allocation can only be credited inside the project's utility territory. The reassignment is filed
    under the filing calendar of garden_allocation_change, counted from the request's received_date, and
    the subscription returns to active on its effective date with the new utility_account_id. When transfer_resize_to_new_usage
    is true and the new account's sizing limit (garden_agg_account_sizing) is below the share's expected
    production, the excess kW, sized up to a whole multiple of allocation_increment_kw, is removed in
    the same filing as a move_resize reduction, without fee and outside the yearly change allowance; when
    the remaining share would be below min_allocation_kw the transfer is not completed. Credits for statement
    months before the reassignment take effect are priced normally. When the new address is served by
    a different utility, or no qualifying new account is supplied within the window, the transfer lapses:
    the share is removed under the filing calendar and the subscription closes with closure_reason moved_out_of_territory
    (different utility) or transfer_not_completed; the early termination fee of garden_cancellation applies
    unless waived there. A subscriber leaving the territory may join the Relocation Priority Waitlist
    for a Meadowlark project serving the new utility. When successor_transfer_allowed is true, the subscriber
    may instead assign the agreement to a successor who meets the plan's enrollment requirements on the
    same project; the successor signs a new agreement on the same plan for the remaining term, and the
    original closes with closure_reason successor_transfer.
  eligibility:
  - id: within_transfer_window
    applies_to: [garden_transfer_requested, garden_transfer_completed]
    kind: time
    condition: >-
      A move transfer is accepted only when its request is received no later than transfer_window_days
      calendar days after the move-out date the subscriber states.
    evidence_fields: [garden_subscriptions.move_out_date, garden_requests.received_date, garden_subscriptions.garden_sub_id,
      garden_requests.garden_request_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [garden_subscriptions.garden_sub_id, garden_requests.garden_request_id]
      action_bindings: {garden_subscriptions.garden_sub_id: garden_sub_id, garden_requests.garden_request_id: garden_request_id}
    temporal_basis: {clock: frozen_time, anchor_event: the move-out date the subscriber states, anchor_source: garden_subscriptions.move_out_date,
      relation: not_after, duration_source: variants.transfer_window_days, unit: calendar_days, counting_rule: Calendar
        days are counted from the day after the stated move-out date; the last window day still qualifies.,
      boundary: inclusive}
  params:
    per_tier:
      Garden Fixed 10: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Garden Fixed 15: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Garden Fixed 20: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Garden Fixed 25: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Garden Business Fixed 15: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Garden Business Fixed 25: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
- id: garden_cancellation
  subject: [garden_notice_given, garden_notice_withdrawn, garden_closed, garden_preactivation_cancelled,
    garden_etf_assessed]
  rule: >-
    A subscriber may cancel at any time by notice. A cancellation removal takes effect no earlier than
    cancellation_notice_days calendar days after the subscriber gives notice of cancellation. Calendar
    days are counted from the day after the notice_date; the removal may take effect on the last notice
    day. The scheduled_end_date is the effective date of the first filing under the filing calendar of
    garden_allocation_change whose effective date falls on or after the notice_date plus cancellation_notice_days;
    the removal is filed for that date and the subscription closes on it. A notice may be withdrawn up
    to the cutoff day of the filing that would carry the removal. Before activation (status allocated)
    the subscriber cancels without notice period, the removal is filed in the next filing and preactivation_cancel_fee_usd
    is the only fee (none when 0.00). Early termination fee: when term_months is greater than 0 and the
    closing date is on or before term_end_date, the fee is allocation_kw held on the day before closing
    multiplied by etf_per_kw_per_remaining_year_usd and by the remaining contract years (garden_msr_remaining_contract_years:
    contract years from the closing date through term_end_date, a part year counting as a whole year),
    rounded half up to the cent and limited to etf_cap_usd; it is assessed on the closing date and due
    invoice_due_days later. An early termination fee is assessed at most once per subscription. No fee
    applies after the term, on plans without a term, when etf_waiver_deceased is true and the subscription
    closes with closure_reason deceased on notice from the estate, when etf_waiver_out_of_territory_move
    is true and the subscription closes with closure_reason moved_out_of_territory, or when etf_waiver_successor_transfer
    is true and it closes with closure_reason successor_transfer. No other circumstance waives or reduces
    the early termination fee of a Garden plan. Credits for statement months up to the closing date that
    post later are priced normally; a balance left after closing remains due.
  eligibility:
  - id: notice_period_served
    applies_to: [garden_closed]
    kind: time
    condition: >-
      A cancellation removal takes effect no earlier than cancellation_notice_days calendar days after
      the subscriber gives notice of cancellation.
    evidence_fields: [garden_subscriptions.notice_date, garden_subscriptions.garden_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [garden_subscriptions.garden_sub_id]
      action_bindings: {garden_subscriptions.garden_sub_id: garden_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the subscriber gives notice of cancellation
      anchor_source: garden_subscriptions.notice_date
      relation: not_before
      duration_source: variants.cancellation_notice_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the notice_date; the removal may take effect on the
        last notice day.
      boundary: inclusive
  - id: one_etf
    applies_to: [garden_etf_assessed]
    kind: dedup
    condition: An early termination fee is assessed at most once per subscription.
    evidence_fields: [garden_billing.garden_sub_id, garden_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [garden_billing.garden_sub_id]
      action_bindings: {garden_billing.garden_sub_id: garden_sub_id}
    dedup_contract:
      table: garden_billing
      mode: separate_record
      object_bindings: {garden_sub_id: garden_sub_id}
      duplicate_filters:
        event_type: [garden_etf_assessed]
      distinct_fields: []
  params:
    per_tier:
      Garden Fixed 10: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Garden Fixed 15: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Garden Fixed 20: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Garden Fixed 25: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Garden Business Fixed 15: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Garden Business Fixed 25: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
  formula:
    amount: >-
      min(etf_cap_usd, round(allocation_kw * etf_per_kw_per_remaining_year_usd * garden_msr_remaining_contract_years,
      2))
  measures: [garden_msr_remaining_contract_years]
- id: garden_evt_annual_trueup
  subject: [garden_trueup_completed]
  rule: >-
    When annual_review_enabled is true Meadowlark completes a true-up for every contract year. A contract
    year's true-up is completed no earlier than the anniversary that ends that year, counted from the
    day the first bill credit posts on the subscription. Contract year n ends on the activation_date plus
    n times review_interval_months calendar months; when that month has no such day, the last day of the
    month is used. Each contract year of a subscription is reviewed exactly once. The review period is
    the twelve statement months ending with the month before the anniversary month. credited_kwh_12m and
    the net credit value are postings less reversals over the period (garden_msr_net_credited_kwh_period,
    garden_msr_net_credit_value_period); avg_credit_rate is the net credit value divided by credited_kwh_12m,
    rounded half up to four decimals; usage_kwh_12m is the utility account's reported usage for the same
    months. Production guarantee: when production_guarantee_pct is greater than 0, guaranteed_kwh is allocation_kw
    on the review_date multiplied by the project's expected_yield_kwh_per_kw and by production_guarantee_pct
    divided by 100, rounded half up to a whole kWh, and shortfall_kwh is guaranteed_kwh less credited_kwh_12m
    when positive. The guarantee is not assessed (guaranteed_kwh 0) for a year in which the subscription
    was not active for all twelve months, the utility account changed, or the allocation changed. The
    guarantee credit is shortfall_kwh multiplied by the amount by which avg_credit_rate exceeds the escalated
    rate in force on the review_date (zero when it does not exceed it), rounded half up to the cent. A
    guarantee credit is posted as a billing credit with credit_reason production_guarantee on the review_date.
    Right-sizing: when the share's expected annual production exceeds oversize_review_threshold_pct of
    usage_kwh_12m, resize_kw is the kW that must be removed so that the remaining share, a whole multiple
    of allocation_increment_kw, is the largest whose expected production does not exceed resize_target_pct
    of usage_kwh_12m, but never below min_allocation_kw; the removal is filed as annual_resize under the
    filing calendar without fee. The outcome records which of the two applied.
  eligibility:
  - id: after_anniversary
    applies_to: [garden_trueup_completed]
    kind: time
    condition: >-
      A contract year's true-up is completed no earlier than the anniversary that ends that year, counted
      from the day the first bill credit posts on the subscription.
    evidence_fields: [garden_subscriptions.activation_date, garden_subscriptions.garden_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [garden_subscriptions.garden_sub_id]
      action_bindings: {garden_subscriptions.garden_sub_id: garden_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the first bill credit posts on the subscription
      anchor_source: garden_subscriptions.activation_date
      relation: not_before
      duration_source: params.review_interval_months
      unit: calendar_months
      counting_rule: >-
        Contract year n ends on the activation_date plus n times review_interval_months calendar months;
        when that month has no such day, the last day of the month is used.
      boundary: inclusive
  - id: one_review_per_year
    applies_to: [garden_trueup_completed]
    kind: dedup
    condition: Each contract year of a subscription is reviewed exactly once.
    evidence_fields: [garden_reviews.garden_sub_id, garden_reviews.contract_year]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [garden_reviews.garden_sub_id, garden_reviews.contract_year]
      action_bindings: {garden_reviews.garden_sub_id: garden_sub_id, garden_reviews.contract_year: contract_year}
    dedup_contract:
      table: garden_reviews
      mode: separate_record
      object_bindings: {garden_sub_id: garden_sub_id, contract_year: contract_year}
      duplicate_filters:
        event_type: [garden_trueup_completed]
      distinct_fields: []
  params:
    review_interval_months: 12
    per_tier:
      Garden Fixed 10: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Garden Fixed 15: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Garden Fixed 20: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Garden Fixed 25: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Garden Business Fixed 15: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Garden Business Fixed 25: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
  formula: {escalated_rate: 'round(contract_rate_per_kwh * (1 + annual_escalator_pct / 100) ** garden_msr_contract_years_elapsed,
      4)', shortfall_kwh: 'max(0, guaranteed_kwh - credited_kwh_12m)', guarantee_credit: 'round(shortfall_kwh
      * max(0, avg_credit_rate - escalated_rate), 2)'}
  measures: [garden_msr_net_credited_kwh_period, garden_msr_net_credit_value_period, garden_msr_contract_years_elapsed]
- id: garden_nonpayment_removal
  subject: [garden_removed_nonpayment, garden_removal_notice_sent]
  rule: >-
    Removal for nonpayment applies only to dual-billed subscriptions; consolidated-billed subscribers
    are never removed by Meadowlark for nonpayment because the utility collects the charge. A removal
    notice may be sent when a charge has remained unpaid for nonpayment_removal_days_past_due calendar
    days after its due_date and the past-due balance (garden_msr_past_due_balance) is at least nonpayment_removal_min_balance_usd.
    A removal for nonpayment takes effect no earlier than removal_notice_days calendar days after Meadowlark
    sends the removal notice. Calendar days are counted from the day after the removal_notice_date; removal
    may occur on the last notice day. Payment of the whole past-due balance before the removal date clears
    the notice (removal_notice_date emptied) and no removal follows. A removal closes the subscription
    with closure_reason nonpayment_removal; the removal is filed under the filing calendar and the early
    termination fee of garden_cancellation applies as for a cancellation closing on the removal date.
  eligibility:
  - id: removal_notice_served
    applies_to: [garden_removed_nonpayment]
    kind: time
    condition: >-
      A removal for nonpayment takes effect no earlier than removal_notice_days calendar days after Meadowlark
      sends the removal notice.
    evidence_fields: [garden_subscriptions.removal_notice_date, garden_subscriptions.garden_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [garden_subscriptions.garden_sub_id]
      action_bindings: {garden_subscriptions.garden_sub_id: garden_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: Meadowlark sends the removal notice
      anchor_source: garden_subscriptions.removal_notice_date
      relation: not_before
      duration_source: variants.removal_notice_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the removal_notice_date; removal may occur on the
        last notice day.
      boundary: inclusive
  params:
    per_tier:
      Garden Fixed 10: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Garden Fixed 15: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Garden Fixed 20: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Garden Fixed 25: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Garden Business Fixed 15: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due,
        nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd, removal_notice_days: =removal_notice_days}
      Garden Business Fixed 25: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due,
        nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd, removal_notice_days: =removal_notice_days}
  measures: [garden_msr_past_due_balance]
- id: garden_benefit_basis
  subject: [garden_charge_billed, garden_billing_credited]
  rule: >-
    Account-wide benefit rule, the same for every Meadowlark subscription line: a subscription's charges
    are priced only by its own plan's pricing (its savings_rate_pct, or its contract rate with escalator
    on fixed-rate plans); no promotion, referral reward, second subscription, waitlist reservation or
    other line's plan changes that price, and benefits never stack. Billing credits are separate ledger
    lines and never reduce a charge's own amount. Each subscription keeps its own ledger: a payment, credit
    or fee belongs only to the subscription it is recorded on and is never moved to another subscription
    or line.
  eligibility: []
- id: garden_billing_arrangement
  subject: [garden_billing_type_changed, garden_enrolled]
  rule: >-
    Consolidated billing (utility net crediting) is available only for projects in a program listed in
    consolidated_billing_programs and only on plans whose billing_types_offered include it; every other
    subscription is dual billed. A change of billing arrangement is accepted only for a subscription in
    active status. A switch is requested by the subscriber and applies to charges invoiced on or after
    the first day of the month following the request's received_date; charges already invoiced keep their
    billing_type. Switching to consolidated billing requires that no dual-billed line is past due.
  eligibility:
  - id: switch_status
    applies_to: [garden_billing_type_changed]
    kind: state
    condition: A change of billing arrangement is accepted only for a subscription in active status.
    evidence_fields: [garden_subscriptions.status, garden_subscriptions.garden_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [garden_subscriptions.garden_sub_id]
      action_bindings: {garden_subscriptions.garden_sub_id: garden_sub_id}
    state_contract:
      field: garden_subscriptions.status
      allowed: [active]
  params:
    consolidated_billing_programs: [NY_VDER]
    per_tier:
      Garden Fixed 10: {billing_types_offered: =billing_types_offered}
      Garden Fixed 15: {billing_types_offered: =billing_types_offered}
      Garden Fixed 20: {billing_types_offered: =billing_types_offered}
      Garden Fixed 25: {billing_types_offered: =billing_types_offered}
      Garden Business Fixed 15: {billing_types_offered: =billing_types_offered}
      Garden Business Fixed 25: {billing_types_offered: =billing_types_offered}
