events:
- type: waitlist_joined
  target: waitlist_reservations
  mutation: create
  meaning: A customer submits a waitlist reservation for a project.
  grain: one row per reservation; this event writes that row
  fields: {customer_id: customer, variant_name: class, utility_account_id: account, project_id: project,
    requested_kw: kW requested, target_line: line, requested_plan: plan, conversion_kind: kind, partner_code: partner
      code or empty, submitted_date: submission date}
  triggers: []
- type: waitlist_confirmed
  target: waitlist_reservations
  mutation:
    transition: {from: submitted, to: queued}
  meaning: Meadowlark confirms the reservation and queues it.
  grain: one row per reservation; this event writes that row
  fields: {queue_date: queue date, reconfirm_due_date: first reconfirmation due date}
  triggers: []
- type: waitlist_declined_ineligible
  target: waitlist_reservations
  mutation:
    transition: {from: submitted, to: lapsed}
  meaning: Meadowlark declines an ineligible reservation.
  grain: one row per reservation; this event writes that row
  fields: {closed_date: decline date, closure_reason: ineligible}
  triggers: []
- type: waitlist_offer_extended
  target: waitlist_reservations
  mutation:
    transition: {from: queued, to: offered}
  meaning: Meadowlark extends an offer of capacity to a queued reservation.
  grain: one row per reservation; this event writes that row
  fields: {status: offered}
  triggers:
  - event: waitlist:waitlist_offer_made
    map: {}
- type: waitlist_offer_made
  target: waitlist_offers
  meaning: The written offer (project, kW, plan, estimate, response date) is issued.
  grain: one row per offer sent
  distinguish_by: [offer_date, project_id]
  fields: {project_id: project, offer_date: sent date, offered_kw: kW offered, offered_plan: plan offered,
    estimated_annual_kwh: first-year kWh estimate, estimated_annual_savings: first-year savings estimate,
    respond_by_date: last acceptance day}
  triggers: []
- type: waitlist_offer_accepted
  target: waitlist_reservations
  mutation:
    transition: {from: offered, to: converted}
  meaning: The customer accepts the offer.
  grain: one row per reservation; this event writes that row
  fields: {closed_date: acceptance date, closure_reason: converted, target_line: line converted into,
    conversion_kind: new subscription or increase}
  triggers:
  - event: home:home_enrolled
    when: {target_line: home, conversion_kind: new_subscription}
    map: {sales_channel: waitlist_offer}
  - event: home:home_allocation_filed
    when: {target_line: home, conversion_kind: allocation_increase}
    map: {filing_reason: subscriber_increase}
  - event: biz:biz_enrolled
    when: {target_line: biz, conversion_kind: new_subscription}
    map: {sales_channel: waitlist_offer}
  - event: biz:biz_allocation_filed
    when: {target_line: biz, conversion_kind: allocation_increase}
    map: {filing_reason: subscriber_increase}
  - event: access:access_enrolled
    when: {target_line: access, conversion_kind: new_subscription}
    map: {sales_channel: waitlist_offer}
  - event: access:access_allocation_filed
    when: {target_line: access, conversion_kind: allocation_increase}
    map: {filing_reason: subscriber_increase}
  - event: garden:garden_enrolled
    when: {target_line: garden, conversion_kind: new_subscription}
    map: {sales_channel: waitlist_offer}
  - event: garden:garden_allocation_filed
    when: {target_line: garden, conversion_kind: allocation_increase}
    map: {filing_reason: subscriber_increase}
  - event: farm:farm_enrolled
    when: {target_line: farm, conversion_kind: new_subscription}
    map: {sales_channel: waitlist_offer}
  - event: farm:farm_allocation_filed
    when: {target_line: farm, conversion_kind: allocation_increase}
    map: {filing_reason: subscriber_increase}
  - event: civic:civic_enrolled
    when: {target_line: civic, conversion_kind: new_subscription}
    map: {sales_channel: waitlist_offer}
  - event: civic:civic_allocation_filed
    when: {target_line: civic, conversion_kind: allocation_increase}
    map: {filing_reason: subscriber_increase}
- type: waitlist_offer_declined
  target: waitlist_reservations
  mutation:
    transition: {from: offered, to: queued}
  meaning: The customer declines the offer.
  grain: one row per reservation; this event writes that row
  fields: {declines_counted: count after this decline, queue_date: unchanged or reset per class}
  triggers: []
- type: waitlist_offer_expired
  target: waitlist_reservations
  mutation:
    transition: {from: offered, to: queued}
  meaning: The offer passes its respond_by_date unanswered.
  grain: one row per reservation; this event writes that row
  fields: {declines_counted: count after this expiry, queue_date: unchanged or reset per class}
  triggers: []
- type: waitlist_lapsed
  target: waitlist_reservations
  mutation:
    transition: {from: queued, to: lapsed}
  meaning: The reservation lapses.
  grain: one row per reservation; this event writes that row
  fields: {closed_date: lapse date, closure_reason: 'decline_limit, reconfirmation_missed, utility_account_final_billed
      or converted'}
  triggers: []
- type: waitlist_reinstated
  target: waitlist_reservations
  mutation:
    transition: {from: lapsed, to: queued}
  meaning: A lapsed reservation is reinstated.
  grain: one row per reservation; this event writes that row
  fields: {closed_date: cleared, closure_reason: not_closed, reconfirm_due_date: new due date, declines_counted: reset
      to 0}
  triggers: []
- type: waitlist_withdrawn
  target: waitlist_reservations
  mutation:
    transition: {from: queued, to: withdrawn}
  meaning: The customer withdraws the reservation.
  grain: one row per reservation; this event writes that row
  fields: {closed_date: withdrawal date, closure_reason: withdrawn_by_subscriber}
  triggers: []
- type: waitlist_reconfirmed
  target: waitlist_reservations
  mutation: update
  meaning: The customer reconfirms continued interest.
  grain: one row per reservation; this event writes that row
  fields: {reconfirm_due_date: next due date}
  triggers: []
- type: waitlist_request_updated
  target: waitlist_reservations
  mutation: update
  meaning: The requested kW or utility account of an open reservation is changed.
  grain: one row per reservation; this event writes that row
  fields: {requested_kw: new kW, utility_account_id: new account, queue_date: kept or reset per class}
  triggers: []
- type: waitlist_reconfirm_notice_sent
  target: waitlist_notices
  meaning: Meadowlark sends a reconfirmation notice.
  grain: one notice per reservation and due date
  distinguish_by: [respond_by_date]
  fields: {notice_date: sent date, respond_by_date: due date referred to, queue_position: '0'}
  triggers: []
- type: waitlist_position_notice_sent
  target: waitlist_notices
  meaning: Meadowlark sends a periodic queue-position notice.
  grain: one notice per reservation and notice date
  distinguish_by: [notice_date]
  fields: {notice_date: sent date, queue_position: position}
  triggers: []
measures: []
policies:
- id: waitlist_agg_multi_holding
  subject: [waitlist_joined]
  rule: >-
    A customer may hold at most max_per_customer open reservations (submitted, queued or offered) across
    all classes and utility accounts, and at most max_open_reservations_in_class in any one class. A utility
    account may hold only one open reservation per project. A reservation beyond a limit is declined as
    ineligible.
  eligibility:
  - id: one_per_account_project
    applies_to: [waitlist_joined]
    kind: dedup
    condition: A utility account may hold only one open reservation per project.
    evidence_fields: [waitlist_reservations.utility_account_id, waitlist_reservations.project_id, waitlist_reservations.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [waitlist_reservations.utility_account_id, waitlist_reservations.project_id]
      action_bindings: {waitlist_reservations.utility_account_id: utility_account_id, waitlist_reservations.project_id: project_id}
    dedup_contract:
      table: waitlist_reservations
      mode: separate_record
      object_bindings: {utility_account_id: utility_account_id, project_id: project_id}
      duplicate_filters:
        status: [submitted, queued, offered]
      distinct_fields: []
  params:
    max_per_customer: 3
    per_tier:
      Income-Eligible Priority Waitlist: {max_open_reservations_in_class: =max_open_reservations_in_class}
      Relocation Priority Waitlist: {max_open_reservations_in_class: =max_open_reservations_in_class}
      Residential Standard Waitlist: {max_open_reservations_in_class: =max_open_reservations_in_class}
      Residential Add-On Waitlist: {max_open_reservations_in_class: =max_open_reservations_in_class}
      Small Business Waitlist: {max_open_reservations_in_class: =max_open_reservations_in_class}
      Community Partner Waitlist: {max_open_reservations_in_class: =max_open_reservations_in_class}
- id: waitlist_agg_account_headroom
  subject: [waitlist_joined, waitlist_offer_extended, waitlist_request_updated]
  rule: >-
    Requested and offered kW are limited by the sizing headroom of the reservation's utility account,
    decided across every Meadowlark line exactly as the target line's account sizing policy (<line>_agg_account_sizing)
    decides it: the effective cap is the lesser of the class sizing_cap_pct, the requested plan's sizing_cap_pct
    and that policy's program ceiling for the project's program; the headroom in kW is the sizing limit
    less the expected annual production of every open subscription on the account in any line, divided
    by the project's expected_yield_kwh_per_kw and sized down to a whole multiple of increment_kw. At
    submission and on every change, requested_kw may not exceed the headroom; at an offer, offered_kw
    may not exceed the headroom on the offer date. Open reservations do not reduce one another's headroom,
    but once one of them converts the others are re-sized against the new headroom and, when lapse_on_conversion_elsewhere
    is true and no headroom remains, they lapse with closure_reason converted. Usage on file may be used
    only when usage_as_of_month is no more than usage_data_max_age_months before the month of the decision.
  eligibility: []
  params:
    per_tier:
      Income-Eligible Priority Waitlist: {sizing_cap_pct: =sizing_cap_pct, increment_kw: =increment_kw,
        usage_data_max_age_months: =usage_data_max_age_months, lapse_on_conversion_elsewhere: =lapse_on_conversion_elsewhere}
      Relocation Priority Waitlist: {sizing_cap_pct: =sizing_cap_pct, increment_kw: =increment_kw, usage_data_max_age_months: =usage_data_max_age_months,
        lapse_on_conversion_elsewhere: =lapse_on_conversion_elsewhere}
      Residential Standard Waitlist: {sizing_cap_pct: =sizing_cap_pct, increment_kw: =increment_kw, usage_data_max_age_months: =usage_data_max_age_months,
        lapse_on_conversion_elsewhere: =lapse_on_conversion_elsewhere}
      Residential Add-On Waitlist: {sizing_cap_pct: =sizing_cap_pct, increment_kw: =increment_kw, usage_data_max_age_months: =usage_data_max_age_months,
        lapse_on_conversion_elsewhere: =lapse_on_conversion_elsewhere}
      Small Business Waitlist: {sizing_cap_pct: =sizing_cap_pct, increment_kw: =increment_kw, usage_data_max_age_months: =usage_data_max_age_months,
        lapse_on_conversion_elsewhere: =lapse_on_conversion_elsewhere}
      Community Partner Waitlist: {sizing_cap_pct: =sizing_cap_pct, increment_kw: =increment_kw, usage_data_max_age_months: =usage_data_max_age_months,
        lapse_on_conversion_elsewhere: =lapse_on_conversion_elsewhere}
- id: waitlist_eligibility
  subject: [waitlist_joined, waitlist_confirmed, waitlist_declined_ineligible]
  rule: >-
    A reservation is confirmed within confirmation_days of its submitted_date when: the customer's customer_type
    is in the class's eligible_customer_types; target_line is in eligible_target_lines and requested_plan
    is a plan of that line; the project's program is in eligible_programs and the utility account is active,
    in the customer's name and served by the project's utility; annual_usage_kwh is at least min_annual_usage_kwh;
    requested_kw lies between min_requested_kw and max_requested_kw as a multiple of increment_kw. Meadowlark
    confirms a reservation only for a utility account whose data_authorization_date is on file. Class
    requirements: when requires_open_subscription is true the account must hold an open subscription of
    the target line on the requested project and conversion_kind is allocation_increase; when requires_income_eligibility
    is true the household must meet an Access plan's eligibility (access_eligibility_tracks); when requires_relocation_event
    is true the customer must have a Meadowlark subscription in any line closed with closure_reason moved_out_of_territory
    whose closed_date is no more than relocation_window_days before submitted_date; when requires_partner_referral
    is true a partner_code must be recorded. Except on the Residential Add-On Waitlist, a utility account
    may not queue for a project on which it already holds an open subscription in any line. On confirmation
    queue_date is the submitted_date and reconfirm_due_date is queue_date plus reconfirm_interval_months;
    a reservation that fails a requirement is declined with closure_reason ineligible.
  eligibility:
  - id: data_authorized
    applies_to: [waitlist_confirmed]
    kind: authorization
    condition: Meadowlark confirms a reservation only for a utility account whose data_authorization_date
      is on file.
    evidence_fields: [utility_accounts.data_authorization_date, utility_accounts.utility_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [utility_accounts.utility_account_id]
      action_bindings: {utility_accounts.utility_account_id: utility_account_id}
  params:
    per_tier:
      Income-Eligible Priority Waitlist: {eligible_customer_types: =eligible_customer_types, eligible_target_lines: =eligible_target_lines,
        eligible_programs: =eligible_programs, requires_open_subscription: =requires_open_subscription,
        requires_income_eligibility: =requires_income_eligibility, requires_relocation_event: =requires_relocation_event,
        relocation_window_days: =relocation_window_days, requires_partner_referral: =requires_partner_referral,
        min_requested_kw: =min_requested_kw, max_requested_kw: =max_requested_kw, min_annual_usage_kwh: =min_annual_usage_kwh,
        utility_data_authorization_required: =utility_data_authorization_required, confirmation_days: =confirmation_days,
        queue_date_basis: =queue_date_basis, reconfirm_interval_months: =reconfirm_interval_months}
      Relocation Priority Waitlist: {eligible_customer_types: =eligible_customer_types, eligible_target_lines: =eligible_target_lines,
        eligible_programs: =eligible_programs, requires_open_subscription: =requires_open_subscription,
        requires_income_eligibility: =requires_income_eligibility, requires_relocation_event: =requires_relocation_event,
        relocation_window_days: =relocation_window_days, requires_partner_referral: =requires_partner_referral,
        min_requested_kw: =min_requested_kw, max_requested_kw: =max_requested_kw, min_annual_usage_kwh: =min_annual_usage_kwh,
        utility_data_authorization_required: =utility_data_authorization_required, confirmation_days: =confirmation_days,
        queue_date_basis: =queue_date_basis, reconfirm_interval_months: =reconfirm_interval_months}
      Residential Standard Waitlist: {eligible_customer_types: =eligible_customer_types, eligible_target_lines: =eligible_target_lines,
        eligible_programs: =eligible_programs, requires_open_subscription: =requires_open_subscription,
        requires_income_eligibility: =requires_income_eligibility, requires_relocation_event: =requires_relocation_event,
        relocation_window_days: =relocation_window_days, requires_partner_referral: =requires_partner_referral,
        min_requested_kw: =min_requested_kw, max_requested_kw: =max_requested_kw, min_annual_usage_kwh: =min_annual_usage_kwh,
        utility_data_authorization_required: =utility_data_authorization_required, confirmation_days: =confirmation_days,
        queue_date_basis: =queue_date_basis, reconfirm_interval_months: =reconfirm_interval_months}
      Residential Add-On Waitlist: {eligible_customer_types: =eligible_customer_types, eligible_target_lines: =eligible_target_lines,
        eligible_programs: =eligible_programs, requires_open_subscription: =requires_open_subscription,
        requires_income_eligibility: =requires_income_eligibility, requires_relocation_event: =requires_relocation_event,
        relocation_window_days: =relocation_window_days, requires_partner_referral: =requires_partner_referral,
        min_requested_kw: =min_requested_kw, max_requested_kw: =max_requested_kw, min_annual_usage_kwh: =min_annual_usage_kwh,
        utility_data_authorization_required: =utility_data_authorization_required, confirmation_days: =confirmation_days,
        queue_date_basis: =queue_date_basis, reconfirm_interval_months: =reconfirm_interval_months}
      Small Business Waitlist: {eligible_customer_types: =eligible_customer_types, eligible_target_lines: =eligible_target_lines,
        eligible_programs: =eligible_programs, requires_open_subscription: =requires_open_subscription,
        requires_income_eligibility: =requires_income_eligibility, requires_relocation_event: =requires_relocation_event,
        relocation_window_days: =relocation_window_days, requires_partner_referral: =requires_partner_referral,
        min_requested_kw: =min_requested_kw, max_requested_kw: =max_requested_kw, min_annual_usage_kwh: =min_annual_usage_kwh,
        utility_data_authorization_required: =utility_data_authorization_required, confirmation_days: =confirmation_days,
        queue_date_basis: =queue_date_basis, reconfirm_interval_months: =reconfirm_interval_months}
      Community Partner Waitlist: {eligible_customer_types: =eligible_customer_types, eligible_target_lines: =eligible_target_lines,
        eligible_programs: =eligible_programs, requires_open_subscription: =requires_open_subscription,
        requires_income_eligibility: =requires_income_eligibility, requires_relocation_event: =requires_relocation_event,
        relocation_window_days: =relocation_window_days, requires_partner_referral: =requires_partner_referral,
        min_requested_kw: =min_requested_kw, max_requested_kw: =max_requested_kw, min_annual_usage_kwh: =min_annual_usage_kwh,
        utility_data_authorization_required: =utility_data_authorization_required, confirmation_days: =confirmation_days,
        queue_date_basis: =queue_date_basis, reconfirm_interval_months: =reconfirm_interval_months}
- id: waitlist_queue_order
  subject: [waitlist_offer_extended]
  rule: >-
    When a project's unallocated_kw grows (a new project, a cancellation or a resize), capacity is offered
    first to the Income-Eligible Priority Waitlist up to capacity_set_aside_pct of the newly available
    kW, then to classes in priority_rank order; within a class reservations are ordered by queue_date
    and then by offer_order_tiebreak. A class with any_project_in_territory true is offered capacity on
    any Meadowlark project of the same utility, otherwise only on its requested project. An offer is extended
    only to a reservation in queued status. When one_open_offer_per_reservation is true a reservation
    with an unanswered offer is passed over. A reservation whose required business credit review (business_credit_review_before_offer)
    or Access verification (income_verification_before_offer) is incomplete is passed over without losing
    its place.
  eligibility: []
  params:
    per_tier:
      Income-Eligible Priority Waitlist: {priority_rank: =priority_rank, capacity_set_aside_pct: =capacity_set_aside_pct,
        any_project_in_territory: =any_project_in_territory, offer_order_tiebreak: =offer_order_tiebreak,
        one_open_offer_per_reservation: =one_open_offer_per_reservation, business_credit_review_before_offer: =business_credit_review_before_offer,
        income_verification_before_offer: =income_verification_before_offer}
      Relocation Priority Waitlist: {priority_rank: =priority_rank, capacity_set_aside_pct: =capacity_set_aside_pct,
        any_project_in_territory: =any_project_in_territory, offer_order_tiebreak: =offer_order_tiebreak,
        one_open_offer_per_reservation: =one_open_offer_per_reservation, business_credit_review_before_offer: =business_credit_review_before_offer,
        income_verification_before_offer: =income_verification_before_offer}
      Residential Standard Waitlist: {priority_rank: =priority_rank, capacity_set_aside_pct: =capacity_set_aside_pct,
        any_project_in_territory: =any_project_in_territory, offer_order_tiebreak: =offer_order_tiebreak,
        one_open_offer_per_reservation: =one_open_offer_per_reservation, business_credit_review_before_offer: =business_credit_review_before_offer,
        income_verification_before_offer: =income_verification_before_offer}
      Residential Add-On Waitlist: {priority_rank: =priority_rank, capacity_set_aside_pct: =capacity_set_aside_pct,
        any_project_in_territory: =any_project_in_territory, offer_order_tiebreak: =offer_order_tiebreak,
        one_open_offer_per_reservation: =one_open_offer_per_reservation, business_credit_review_before_offer: =business_credit_review_before_offer,
        income_verification_before_offer: =income_verification_before_offer}
      Small Business Waitlist: {priority_rank: =priority_rank, capacity_set_aside_pct: =capacity_set_aside_pct,
        any_project_in_territory: =any_project_in_territory, offer_order_tiebreak: =offer_order_tiebreak,
        one_open_offer_per_reservation: =one_open_offer_per_reservation, business_credit_review_before_offer: =business_credit_review_before_offer,
        income_verification_before_offer: =income_verification_before_offer}
      Community Partner Waitlist: {priority_rank: =priority_rank, capacity_set_aside_pct: =capacity_set_aside_pct,
        any_project_in_territory: =any_project_in_territory, offer_order_tiebreak: =offer_order_tiebreak,
        one_open_offer_per_reservation: =one_open_offer_per_reservation, business_credit_review_before_offer: =business_credit_review_before_offer,
        income_verification_before_offer: =income_verification_before_offer}
- id: waitlist_evt_offer_terms
  subject: [waitlist_offer_made]
  rule: >-
    The offered_kw is the least of requested_kw, the project capacity available to the reservation and
    the account headroom of waitlist_agg_account_headroom, sized down to a whole multiple of increment_kw.
    When it is below requested_kw the offer is a partial offer, allowed only when partial_offer_allowed
    is true and offered_kw is at least min_partial_offer_pct of requested_kw; an offer is never below
    min_offer_kw; a reservation that cannot receive a valid offer is passed over. The offered_plan is
    the requested_plan when that plan is open on the project's program, otherwise default_conversion_plan.
    estimated_annual_kwh is offered_kw multiplied by the project's expected_yield_kwh_per_kw and estimate_years,
    rounded half up to a whole kWh. estimated_annual_savings is estimated_annual_kwh multiplied by the
    project's est_credit_rate_per_kwh and by the offered plan's savings_rate_pct divided by 100 on percent-savings
    plans, or by the amount the project's est_credit_rate_per_kwh exceeds the plan's fixed_rate_per_kwh
    on fixed-rate plans (0.00 when it does not), rounded half up to the cent; it is an estimate and never
    a promise. respond_by_date is offer_date plus offer_response_days calendar days. An offer is recorded
    only for a reservation in offered status. The offered plan's pricing is held for conversion_rate_lock_days
    after offer_date.
  eligibility:
  - id: offered_only
    applies_to: [waitlist_offer_made]
    kind: state
    condition: An offer is recorded only for a reservation in offered status.
    evidence_fields: [waitlist_reservations.status, waitlist_reservations.wait_res_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [waitlist_reservations.wait_res_id]
      action_bindings: {waitlist_reservations.wait_res_id: wait_res_id}
    state_contract:
      field: waitlist_reservations.status
      allowed: [offered]
  params:
    per_tier:
      Income-Eligible Priority Waitlist: {partial_offer_allowed: =partial_offer_allowed, min_partial_offer_pct: =min_partial_offer_pct,
        min_offer_kw: =min_offer_kw, default_conversion_plan: =default_conversion_plan, offer_response_days: =offer_response_days,
        conversion_rate_lock_days: =conversion_rate_lock_days, estimate_years: =estimate_years, estimate_rounding: =estimate_rounding,
        increment_kw: =increment_kw}
      Relocation Priority Waitlist: {partial_offer_allowed: =partial_offer_allowed, min_partial_offer_pct: =min_partial_offer_pct,
        min_offer_kw: =min_offer_kw, default_conversion_plan: =default_conversion_plan, offer_response_days: =offer_response_days,
        conversion_rate_lock_days: =conversion_rate_lock_days, estimate_years: =estimate_years, estimate_rounding: =estimate_rounding,
        increment_kw: =increment_kw}
      Residential Standard Waitlist: {partial_offer_allowed: =partial_offer_allowed, min_partial_offer_pct: =min_partial_offer_pct,
        min_offer_kw: =min_offer_kw, default_conversion_plan: =default_conversion_plan, offer_response_days: =offer_response_days,
        conversion_rate_lock_days: =conversion_rate_lock_days, estimate_years: =estimate_years, estimate_rounding: =estimate_rounding,
        increment_kw: =increment_kw}
      Residential Add-On Waitlist: {partial_offer_allowed: =partial_offer_allowed, min_partial_offer_pct: =min_partial_offer_pct,
        min_offer_kw: =min_offer_kw, default_conversion_plan: =default_conversion_plan, offer_response_days: =offer_response_days,
        conversion_rate_lock_days: =conversion_rate_lock_days, estimate_years: =estimate_years, estimate_rounding: =estimate_rounding,
        increment_kw: =increment_kw}
      Small Business Waitlist: {partial_offer_allowed: =partial_offer_allowed, min_partial_offer_pct: =min_partial_offer_pct,
        min_offer_kw: =min_offer_kw, default_conversion_plan: =default_conversion_plan, offer_response_days: =offer_response_days,
        conversion_rate_lock_days: =conversion_rate_lock_days, estimate_years: =estimate_years, estimate_rounding: =estimate_rounding,
        increment_kw: =increment_kw}
      Community Partner Waitlist: {partial_offer_allowed: =partial_offer_allowed, min_partial_offer_pct: =min_partial_offer_pct,
        min_offer_kw: =min_offer_kw, default_conversion_plan: =default_conversion_plan, offer_response_days: =offer_response_days,
        conversion_rate_lock_days: =conversion_rate_lock_days, estimate_years: =estimate_years, estimate_rounding: =estimate_rounding,
        increment_kw: =increment_kw}
- id: waitlist_offer_response
  subject: [waitlist_offer_accepted, waitlist_offer_declined, waitlist_offer_expired]
  rule: >-
    The customer answers an offer personally. An offer is accepted only when the acceptance is received
    no later than offer_response_days calendar days after Meadowlark sends the offer (the offer's respond_by_date).
    Calendar days are counted from the day after offer_date; acceptance on the respond_by_date itself
    qualifies. A decline, and an offer that expires unanswered when expired_offer_counts_as_decline is
    true, adds one to declines_counted, except that declining a partial offer is not counted when decline_partial_without_penalty
    is true; when queue_date_reset_on_decline is true a counted decline moves queue_date to the decline
    date. When declines_counted reaches max_declines_before_lapse the reservation lapses with closure_reason
    decline_limit.
  eligibility:
  - id: respond_in_time
    applies_to: [waitlist_offer_accepted]
    kind: time
    condition: >-
      An offer is accepted only when the acceptance is received no later than offer_response_days calendar
      days after Meadowlark sends the offer (the offer's respond_by_date).
    evidence_fields: [waitlist_offers.offer_date, waitlist_offers.wait_offer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [waitlist_offers.wait_offer_id]
      action_bindings: {waitlist_offers.wait_offer_id: wait_offer_id}
    temporal_basis: {clock: frozen_time, anchor_event: Meadowlark sends the offer, anchor_source: waitlist_offers.offer_date,
      relation: not_after, duration_source: variants.offer_response_days, unit: calendar_days, counting_rule: Calendar
        days are counted from the day after offer_date; acceptance on the respond_by_date itself qualifies.,
      boundary: inclusive}
  params:
    per_tier:
      Income-Eligible Priority Waitlist: {offer_response_days: =offer_response_days, max_declines_before_lapse: =max_declines_before_lapse,
        expired_offer_counts_as_decline: =expired_offer_counts_as_decline, queue_date_reset_on_decline: =queue_date_reset_on_decline,
        decline_partial_without_penalty: =decline_partial_without_penalty}
      Relocation Priority Waitlist: {offer_response_days: =offer_response_days, max_declines_before_lapse: =max_declines_before_lapse,
        expired_offer_counts_as_decline: =expired_offer_counts_as_decline, queue_date_reset_on_decline: =queue_date_reset_on_decline,
        decline_partial_without_penalty: =decline_partial_without_penalty}
      Residential Standard Waitlist: {offer_response_days: =offer_response_days, max_declines_before_lapse: =max_declines_before_lapse,
        expired_offer_counts_as_decline: =expired_offer_counts_as_decline, queue_date_reset_on_decline: =queue_date_reset_on_decline,
        decline_partial_without_penalty: =decline_partial_without_penalty}
      Residential Add-On Waitlist: {offer_response_days: =offer_response_days, max_declines_before_lapse: =max_declines_before_lapse,
        expired_offer_counts_as_decline: =expired_offer_counts_as_decline, queue_date_reset_on_decline: =queue_date_reset_on_decline,
        decline_partial_without_penalty: =decline_partial_without_penalty}
      Small Business Waitlist: {offer_response_days: =offer_response_days, max_declines_before_lapse: =max_declines_before_lapse,
        expired_offer_counts_as_decline: =expired_offer_counts_as_decline, queue_date_reset_on_decline: =queue_date_reset_on_decline,
        decline_partial_without_penalty: =decline_partial_without_penalty}
      Community Partner Waitlist: {offer_response_days: =offer_response_days, max_declines_before_lapse: =max_declines_before_lapse,
        expired_offer_counts_as_decline: =expired_offer_counts_as_decline, queue_date_reset_on_decline: =queue_date_reset_on_decline,
        decline_partial_without_penalty: =decline_partial_without_penalty}
- id: waitlist_conversion
  subject: [waitlist_offer_accepted]
  rule: >-
    Accepting an offer is the customer's signature: for conversion_kind new_subscription it enrolls a
    subscription in the target_line on the offered_plan for offered_kw on the offered project, with signed_date
    the acceptance date and sales_channel waitlist_offer, after which that line's enrollment, rescission,
    sizing and filing rules apply in full; for conversion_kind allocation_increase it is a subscriber-requested
    increase of offered_kw on the existing subscription, filed under that line's allocation-change rules
    and counted toward its yearly change limit. The offered plan's pricing as of offer_date applies when
    the subscription or increase takes effect within conversion_rate_lock_days.
  eligibility: []
  params:
    per_tier:
      Income-Eligible Priority Waitlist: {conversion_rate_lock_days: =conversion_rate_lock_days, default_conversion_plan: =default_conversion_plan}
      Relocation Priority Waitlist: {conversion_rate_lock_days: =conversion_rate_lock_days, default_conversion_plan: =default_conversion_plan}
      Residential Standard Waitlist: {conversion_rate_lock_days: =conversion_rate_lock_days, default_conversion_plan: =default_conversion_plan}
      Residential Add-On Waitlist: {conversion_rate_lock_days: =conversion_rate_lock_days, default_conversion_plan: =default_conversion_plan}
      Small Business Waitlist: {conversion_rate_lock_days: =conversion_rate_lock_days, default_conversion_plan: =default_conversion_plan}
      Community Partner Waitlist: {conversion_rate_lock_days: =conversion_rate_lock_days, default_conversion_plan: =default_conversion_plan}
- id: waitlist_reconfirmation
  subject: [waitlist_reconfirmed, waitlist_reconfirm_notice_sent, waitlist_lapsed]
  rule: >-
    A reconfirmation notice is sent reconfirm_notice_days_before calendar days before reconfirm_due_date.
    The customer reconfirms at any time up to the end of the grace period, which sets reconfirm_due_date
    to the previous due date plus reconfirm_interval_months. A reservation lapses for a missed reconfirmation
    only after reconfirm_grace_days calendar days have fully passed after the reservation's reconfirmation
    falls due (its reconfirm_due_date). Calendar days are counted from the day after reconfirm_due_date;
    the lapse may occur from the day after the last grace day. No lapse for a missed reconfirmation occurs
    while an offer is open when waive_reconfirm_when_offer_pending is true. A reservation also lapses
    when its utility account is final billed without a move and removal_on_final_bill is true (closure_reason
    utility_account_final_billed).
  eligibility:
  - id: after_reconfirm_grace
    applies_to: [waitlist_lapsed]
    kind: time
    condition: >-
      A reservation lapses for a missed reconfirmation only after reconfirm_grace_days calendar days have
      fully passed after the reservation's reconfirmation falls due (its reconfirm_due_date).
    evidence_fields: [waitlist_reservations.reconfirm_due_date, waitlist_reservations.wait_res_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [waitlist_reservations.wait_res_id]
      action_bindings: {waitlist_reservations.wait_res_id: wait_res_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the reservation's reconfirmation falls due
      anchor_source: waitlist_reservations.reconfirm_due_date
      relation: not_before
      duration_source: variants.reconfirm_grace_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after reconfirm_due_date; the lapse may occur from the
        day after the last grace day.
      boundary: exclusive
  params:
    per_tier:
      Income-Eligible Priority Waitlist: {reconfirm_interval_months: =reconfirm_interval_months, reconfirm_notice_days_before: =reconfirm_notice_days_before,
        reconfirm_grace_days: =reconfirm_grace_days, waive_reconfirm_when_offer_pending: =waive_reconfirm_when_offer_pending,
        removal_on_final_bill: =removal_on_final_bill}
      Relocation Priority Waitlist: {reconfirm_interval_months: =reconfirm_interval_months, reconfirm_notice_days_before: =reconfirm_notice_days_before,
        reconfirm_grace_days: =reconfirm_grace_days, waive_reconfirm_when_offer_pending: =waive_reconfirm_when_offer_pending,
        removal_on_final_bill: =removal_on_final_bill}
      Residential Standard Waitlist: {reconfirm_interval_months: =reconfirm_interval_months, reconfirm_notice_days_before: =reconfirm_notice_days_before,
        reconfirm_grace_days: =reconfirm_grace_days, waive_reconfirm_when_offer_pending: =waive_reconfirm_when_offer_pending,
        removal_on_final_bill: =removal_on_final_bill}
      Residential Add-On Waitlist: {reconfirm_interval_months: =reconfirm_interval_months, reconfirm_notice_days_before: =reconfirm_notice_days_before,
        reconfirm_grace_days: =reconfirm_grace_days, waive_reconfirm_when_offer_pending: =waive_reconfirm_when_offer_pending,
        removal_on_final_bill: =removal_on_final_bill}
      Small Business Waitlist: {reconfirm_interval_months: =reconfirm_interval_months, reconfirm_notice_days_before: =reconfirm_notice_days_before,
        reconfirm_grace_days: =reconfirm_grace_days, waive_reconfirm_when_offer_pending: =waive_reconfirm_when_offer_pending,
        removal_on_final_bill: =removal_on_final_bill}
      Community Partner Waitlist: {reconfirm_interval_months: =reconfirm_interval_months, reconfirm_notice_days_before: =reconfirm_notice_days_before,
        reconfirm_grace_days: =reconfirm_grace_days, waive_reconfirm_when_offer_pending: =waive_reconfirm_when_offer_pending,
        removal_on_final_bill: =removal_on_final_bill}
- id: waitlist_request_changes
  subject: [waitlist_request_updated, waitlist_position_notice_sent]
  rule: >-
    While a reservation is submitted or queued the customer may change it. Raising requested_kw moves
    queue_date to the change date when kw_increase_resets_queue_date is true; lowering it keeps queue_date
    when kw_decrease_allowed is true. Moving the reservation to another utility account in the customer's
    name is allowed when utility_account_change_allowed is true and the new account is served by the same
    utility; queue_date is kept when queue_date_kept_on_move is true; a move to another utility requires
    withdrawing and submitting a new reservation. Every change is re-sized under waitlist_agg_account_headroom.
    A queue-position notice is sent every position_notice_interval_months months after queue_date.
  eligibility: []
  params:
    per_tier:
      Income-Eligible Priority Waitlist: {kw_increase_resets_queue_date: =kw_increase_resets_queue_date,
        kw_decrease_allowed: =kw_decrease_allowed, utility_account_change_allowed: =utility_account_change_allowed,
        queue_date_kept_on_move: =queue_date_kept_on_move, position_notice_interval_months: =position_notice_interval_months}
      Relocation Priority Waitlist: {kw_increase_resets_queue_date: =kw_increase_resets_queue_date, kw_decrease_allowed: =kw_decrease_allowed,
        utility_account_change_allowed: =utility_account_change_allowed, queue_date_kept_on_move: =queue_date_kept_on_move,
        position_notice_interval_months: =position_notice_interval_months}
      Residential Standard Waitlist: {kw_increase_resets_queue_date: =kw_increase_resets_queue_date, kw_decrease_allowed: =kw_decrease_allowed,
        utility_account_change_allowed: =utility_account_change_allowed, queue_date_kept_on_move: =queue_date_kept_on_move,
        position_notice_interval_months: =position_notice_interval_months}
      Residential Add-On Waitlist: {kw_increase_resets_queue_date: =kw_increase_resets_queue_date, kw_decrease_allowed: =kw_decrease_allowed,
        utility_account_change_allowed: =utility_account_change_allowed, queue_date_kept_on_move: =queue_date_kept_on_move,
        position_notice_interval_months: =position_notice_interval_months}
      Small Business Waitlist: {kw_increase_resets_queue_date: =kw_increase_resets_queue_date, kw_decrease_allowed: =kw_decrease_allowed,
        utility_account_change_allowed: =utility_account_change_allowed, queue_date_kept_on_move: =queue_date_kept_on_move,
        position_notice_interval_months: =position_notice_interval_months}
      Community Partner Waitlist: {kw_increase_resets_queue_date: =kw_increase_resets_queue_date, kw_decrease_allowed: =kw_decrease_allowed,
        utility_account_change_allowed: =utility_account_change_allowed, queue_date_kept_on_move: =queue_date_kept_on_move,
        position_notice_interval_months: =position_notice_interval_months}
- id: waitlist_withdrawal_and_reinstatement
  subject: [waitlist_withdrawn, waitlist_reinstated, waitlist_declined_ineligible]
  rule: >-
    The customer may withdraw a reservation at any time before accepting an offer; withdrawal ends it
    with closure_reason withdrawn_by_subscriber and carries no fee, as no fee or deposit is ever charged
    for a waitlist reservation. A reservation declined as ineligible or withdrawn is never reinstated.
    A lapsed reservation is reinstated only when the reinstatement request is received no later than reinstatement_days
    calendar days after the reservation lapses (its closed_date). Calendar days are counted from the day
    after closed_date; the last day of the period still qualifies. Reinstatement keeps the original queue_date,
    resets declines_counted to 0 and sets a new reconfirm_due_date of the reinstatement date plus reconfirm_interval_months.
  eligibility:
  - id: within_reinstatement
    applies_to: [waitlist_reinstated]
    kind: time
    condition: >-
      A lapsed reservation is reinstated only when the reinstatement request is received no later than
      reinstatement_days calendar days after the reservation lapses (its closed_date).
    evidence_fields: [waitlist_reservations.closed_date, waitlist_reservations.wait_res_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [waitlist_reservations.wait_res_id]
      action_bindings: {waitlist_reservations.wait_res_id: wait_res_id}
    temporal_basis: {clock: frozen_time, anchor_event: the reservation lapses, anchor_source: waitlist_reservations.closed_date,
      relation: not_after, duration_source: variants.reinstatement_days, unit: calendar_days, counting_rule: Calendar
        days are counted from the day after closed_date; the last day of the period still qualifies.,
      boundary: inclusive}
  params:
    per_tier:
      Income-Eligible Priority Waitlist: {reinstatement_days: =reinstatement_days}
      Relocation Priority Waitlist: {reinstatement_days: =reinstatement_days}
      Residential Standard Waitlist: {reinstatement_days: =reinstatement_days}
      Residential Add-On Waitlist: {reinstatement_days: =reinstatement_days}
      Small Business Waitlist: {reinstatement_days: =reinstatement_days}
      Community Partner Waitlist: {reinstatement_days: =reinstatement_days}
