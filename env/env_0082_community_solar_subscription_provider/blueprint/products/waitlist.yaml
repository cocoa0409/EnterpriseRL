# Policy charter of one product category of Meadowlark Community Solar (env_0082).
# Single registry of every quantified policy of this category; the runtime never reads this file.
category: waitlist
display_name: Project Waitlist Reservations
binding:
  holding_table: waitlist_reservations
  event_tables: [waitlist_offers, waitlist_notices]
  status_field: status
  variant_field: variant_name
lifecycle:
  states: [submitted, queued, offered, converted, lapsed, withdrawn]
  transitions:
  - {from: submitted, to: queued, by: agent, means: Meadowlark confirms the reservation's eligibility
      and places it in the class queue.}
  - {from: submitted, to: lapsed, by: agent, means: Meadowlark declines a reservation that does not meet
      the class requirements.}
  - {from: queued, to: offered, by: agent, means: Capacity opens and Meadowlark sends an offer.}
  - {from: offered, to: converted, by: user, means: The customer accepts the offer and signs the subscription
      or increase.}
  - {from: offered, to: queued, by: user, means: The customer declines the offer and stays in the queue.}
  - {from: offered, to: queued, by: system, means: The offer expires unanswered and the reservation returns
      to the queue.}
  - {from: queued, to: lapsed, by: system, means: 'The reservation lapses (decline limit, missed reconfirmation,
      final-billed account or conversion elsewhere).'}
  - {from: lapsed, to: queued, by: agent, means: A lapsed reservation is reinstated with its queue_date
      within the reinstatement period.}
  - {from: queued, to: withdrawn, by: user, means: The customer withdraws the reservation.}
accounts: []
parameter_schema:
  priority_rank: order in which classes receive offers when capacity opens (1 first)
  eligible_customer_types: customer_type values that may join this class
  eligible_target_lines: subscription lines (home, biz, access, garden, farm, civic) a reservation of
    this class may convert into
  eligible_programs: programs whose projects this class queues for
  requires_open_subscription: >-
    true when the utility account must already hold an open subscription in the target line on the requested
    project (switch)
  requires_income_eligibility: true when the household must qualify for a Meadowlark Access plan (switch)
  requires_relocation_event: >-
    true when the customer must have had a Meadowlark subscription closed with closure_reason moved_out_of_territory
    (switch)
  relocation_window_days: calendar days after that closing within which the reservation must be submitted;
    0 where not applicable
  requires_partner_referral: true when a community partner code must be recorded on the reservation (switch)
  min_requested_kw: smallest kW that may be requested, kW AC
  max_requested_kw: largest kW that may be requested, kW AC
  increment_kw: requested and offered kW are sized down to a whole multiple of this, kW AC
  sizing_cap_pct: >-
    class sizing cap, percent of the utility account's annual usage (the lesser of this and the target
    line's program ceiling applies)
  min_annual_usage_kwh: minimum annual usage of the utility account, kWh
  usage_data_max_age_months: >-
    usage on file may be used for sizing an offer only if usage_as_of_month is no more than this many
    months before the offer month
  utility_data_authorization_required: true when a utility-data release authorization must be on file
    (switch)
  max_open_reservations_in_class: open reservations (submitted, queued or offered) one customer may hold
    in this class
  any_project_in_territory: >-
    true when any Meadowlark project of the same utility may fill the reservation, false when only the
    requested project may (switch)
  capacity_set_aside_pct: percent of each project's newly available capacity offered first to this class;
    0 where no set-aside
  offer_response_days: calendar days after offer_date by which an offer must be accepted
  max_declines_before_lapse: declined or expired offers counted before the reservation lapses
  expired_offer_counts_as_decline: true when an offer left unanswered counts as a decline (switch)
  queue_date_reset_on_decline: true when a counted decline moves queue_date to the decline date (switch)
  partial_offer_allowed: true when less than the requested kW may be offered (switch)
  min_partial_offer_pct: a partial offer must reach at least this percent of requested_kw
  min_offer_kw: smallest kW that may be offered, kW AC
  decline_partial_without_penalty: true when declining a partial offer is not counted (switch)
  reconfirm_interval_months: months after queue_date (and after each reconfirmation) by which the reservation
    must be reconfirmed
  reconfirm_notice_days_before: calendar days before reconfirm_due_date the reconfirmation notice is sent
  reconfirm_grace_days: calendar days after reconfirm_due_date before an unconfirmed reservation lapses
  reinstatement_days: calendar days after a lapse within which the reservation may be reinstated with
    its queue_date
  kw_increase_resets_queue_date: true when raising requested_kw moves queue_date to the change date (switch)
  kw_decrease_allowed: true when requested_kw may be lowered without losing queue_date (switch)
  utility_account_change_allowed: true when the reservation may move to another utility account of the
    same utility (switch)
  queue_date_kept_on_move: true when such a move keeps queue_date (switch)
  removal_on_final_bill: true when the reservation lapses once its utility account is final billed without
    a move (switch)
  default_conversion_plan: >-
    plan offered when the requested plan is not open on the project's program; same_as_existing_subscription
    for add-ons
  conversion_rate_lock_days: calendar days after offer_date during which the offered plan's pricing is
    held
  estimate_years: years of production covered by the savings estimate in an offer
  estimate_rounding: 'rounding of offer estimates: half_up_cent for dollars, half_up whole kWh'
  position_notice_interval_months: months between queue-position notices
  business_credit_review_before_offer: true when the business credit review of the target plan must be
    complete before an offer (switch)
  income_verification_before_offer: true when Access eligibility must be verified before an offer (switch)
  confirmation_days: calendar days after submitted_date within which Meadowlark confirms or declines the
    reservation
  queue_date_basis: 'what sets queue_date at confirmation: submitted_date'
  offer_order_tiebreak: 'order among reservations of one class with the same queue_date: submitted_date_then_smaller_requested_kw'
  one_open_offer_per_reservation: true when a reservation may have only one unanswered offer at a time
    (switch)
  waive_reconfirm_when_offer_pending: true when no lapse for missed reconfirmation occurs while an offer
    is open (switch)
  lapse_on_conversion_elsewhere: >-
    true when the reservation closes once its requested kW is filled by another conversion on the same
    utility account (switch)
