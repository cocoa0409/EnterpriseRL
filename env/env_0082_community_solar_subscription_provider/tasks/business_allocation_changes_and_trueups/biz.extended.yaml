    factors:
    - id: estimating_method
      effect: method
      decides: estimated_kwh
      bindings:
      - y_kwh
      - y_count
      - estimated_kwh
      ladder:
      - when: the basis window's count is below estimate_basis_months AND the year-earlier window's count is one or more
        method: the kWh of the basis window and of the year-earlier window together divided by their counts together
      - when: the basis window's count is below estimate_basis_months AND the year-earlier window's count is 0 AND a true-up is on file
        method: the reviewed monthly production
      - when: otherwise
        method: the basis window's kWh divided by its count, and 0 when its count is 0
      baseline:
        estimated_kwh: w_kwh / w_count if w_count > 0 else 0
      evidence:
      - history
      cross_difficulty: null
    - id: current_tariff_rate
      effect: parameter
      decides: estimate_rate
      bindings:
      - latest_post_rate
      - trueup_rate
      - estimate_rate
      ladder:
      - when: the basis window's count is 0 AND the subscription has a credit posting
        value: the latest posting rate
      - when: the basis window's count is 0 AND the subscription has no credit posting
        value: the avg_credit_rate of its true-up with the latest review_date (0 when none is on file)
      - when: otherwise (the basis window's count is one or more)
        value: the basis window's credit value divided by its kWh
      baseline:
        estimate_rate: w_value / w_kwh if w_kwh > 0 else 0
      evidence:
      - history
      cross_difficulty: null
    - id: share_restatement
      effect: method
      decides: share_adjustment
      bindings:
      - share_now
      - moved_12
      - lines_12
      - initial_kw
      - share_adjustment
      ladder:
      - when: filing lines took effect in the restatement period AND the share 12 months back is more than 0
        method: multiply the estimated kWh by the share on file for the estimate divided by the share 12 months back
      - when: filing lines took effect in the restatement period AND the share 12 months back is 0
        method: multiply the estimated kWh by the share on file for the estimate divided by the kW of the subscription's initial filing line
      - when: otherwise (no filing line took effect in the restatement period)
        method: multiply the estimated kWh by 1
      baseline:
        share_adjustment: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: production_decline_restatement
      effect: parameter
      decides: decline_pct
      bindings:
      - first_year_reviews
      - later_reviews
      - decline_pct
      ladder:
      - when: the basis window's count is below estimate_basis_months AND a true-up for contract year 1 has a review_date within the 12 months before today
        value: K('decline_first_pct')
      - when: the basis window's count is below estimate_basis_months AND a true-up of a later contract year has a review_date in that period
        value: K('decline_later_pct')
      - when: otherwise
        value: '0'
      baseline:
        decline_pct: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: sister_garden_index
      effect: method
      decides: garden_index
      bindings:
      - g_w_kwh
      - g_w_count
      - g_y_kwh
      - g_y_count
      - g_latest_date
      - g_latest_avg
      - garden_index
      ladder:
      - when: there are recent garden postings AND earlier garden postings
        method: multiply the estimated kWh by the average credited_kwh per recent garden posting divided by the average per earlier garden posting
      - when: there are earlier garden postings AND no recent one
        method: multiply the estimated kWh by the average credited_kwh of the garden postings with the latest posted_date divided by the average per earlier garden posting
      - when: otherwise (no earlier garden posting)
        method: multiply the estimated kWh by 1
      baseline:
        garden_index: '1'
      evidence:
      - cross_category
      - history
      cross_difficulty: garden
    - id: outstanding_estimate_blend
      effect: method
      decides: blend_kwh
      bindings:
      - open_estimates
      - blend_kwh
      ladder:
      - when: two or more outstanding estimates AND a true-up is on file
        method: replace the estimated kWh by the average of themselves and the lower of the reviewed monthly production and the latest posting kWh
      - when: exactly one outstanding estimate AND a true-up is on file
        method: replace the estimated kWh by the average of themselves and the reviewed monthly production
      - when: otherwise
        method: no blend
      baseline:
        blend_kwh: '0'
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: 'For an estimated charge, and only for such a charge, when estimated_billing_allowed is true and no credit has posted for a statement month estimate_wait_days calendar days after that month ends, the estimated charge this policy prices may be billed with charge_basis estimated and no credit reference, is invoiced on the day it is billed and falls due invoice_due_days later, and no more than max_consecutive_estimates estimates may be billed in a row (the run is measured by biz_msr_consecutive_estimates); every other charge remains under the base rule, which reads: estimates: when estimated_billing_allowed is true and no credit has posted for a statement month estimate_wait_days calendar days after that month ends, an estimated charge equal to the average of the last estimate_basis_months actual charges, rounded half up to the cent, may be billed with charge_basis estimated and no credit reference; no more than max_consecutive_estimates estimates may be billed in a row (the run is measured by biz_msr_consecutive_estimates). The basis window holds the subscription''s credit postings and credit reversals whose posted_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today; its kWh are the credited_kwh of its postings less the credited_kwh of its reversals, its credit value is the credit_value of its postings less that of its reversals, and its count is the number of its postings less the number of its reversals. The estimated kWh are the basis window''s kWh divided by its count, and 0 when its count is 0. The estimate rate is the basis window''s credit value divided by its kWh, and 0 when it has no kWh. The estimated charge is the estimated kWh multiplied by the estimate rate and by (100 minus the plan''s savings_rate_pct) divided by 100, rounded half up to the cent; no estimate is billed when it is 0.00.'
      params:
      - estimate_basis_months
      - estimate_wait_days
      - max_consecutive_estimates
      - invoice_due_days
      - savings_rate_pct
    inputs:
      history:
      - table: biz_credits
        aggregate: sum
        field: credited_kwh
        within_months: 3
        filters:
          event_type: biz_credit_posted
      - table: biz_credits
        aggregate: sum
        field: credited_kwh
        within_months: 15
        filters:
          event_type: biz_credit_posted
      - table: biz_credits
        aggregate: latest
        field: posted_date
        filters:
          event_type: biz_credit_posted
      - table: biz_allocations
        aggregate: sum
        field: kw
        within_months: 12
        filters:
          event_type: biz_allocation_reduced
      - table: biz_reviews
        aggregate: latest
        field: credited_kwh_12m
        filters:
          event_type: biz_trueup_completed
      - table: biz_billing
        aggregate: count
        field: biz_bill_id
        within_months: 3
        filters:
          event_type: biz_charge_billed
          charge_basis: estimated
      - category: garden
        table: garden_credits
        aggregate: sum
        field: credited_kwh
        within_months: 15
        filters:
          event_type: garden_credit_posted
      cross_category:
      - garden
  - id: biz_ext_increase_deposit
    base_policy_refs:
    - biz_evt_security_deposit
    overwrite:
    - base_policy: biz_evt_security_deposit
      superseded_clause: The deposit equals security_deposit_months multiplied by the estimated monthly charge, where the estimated monthly charge is contract_kw multiplied by the project's expected_yield_kwh_per_kw and est_credit_rate_per_kwh and by (100 minus savings_rate_pct) divided by 100, divided by 12; the product is rounded half up to the cent once.
      replaced_by: 'For an increase deposit, and only for such a deposit, the deposit is worked out from the subscription''s own invoiced charges as this policy states, its total is rounded half up to the cent once, and a deposit of 0.00 writes no deposit line; every other deposit remains under the base rule, which reads: the deposit equals security_deposit_months multiplied by the estimated monthly charge, where the estimated monthly charge is contract_kw multiplied by the project''s expected_yield_kwh_per_kw and est_credit_rate_per_kwh and by (100 minus savings_rate_pct) divided by 100, divided by 12; the product is rounded half up to the cent once.'
    - base_policy: biz_evt_security_deposit
      superseded_clause: The deposit is paid by the business through the secure payment portal (ach) or by check before approval and never by a representative taking account numbers.
      replaced_by: 'For an increase deposit, and only for such a deposit, the deposit is paid by the business through the secure payment portal (ach) or by mailed check after the increase request is received and before the increase is filed, and never by a representative taking account numbers; every other deposit remains under the base rule, which reads: the deposit is paid by the business through the secure payment portal (ach) or by check before approval and never by a representative taking account numbers.'
    trigger: on_request
    subject:
    - biz_deposit_held
    computes: deposit_amount
    target_tool: pay_increase_deposit_a318506d
    params:
      band_large_kw: 40
      band_mid_kw: 20
      band_large_mult: 0.95
      band_mid_mult: 0.98
      depth_high_pct: 40
      depth_mid_pct: 20
      depth_high_mult: 1.2
      depth_mid_mult: 1.1
      term_short_months: 12
      term_mid_months: 24
      term_short_mult: 0.5
      term_mid_mult: 0.75
      returned_two_months: 1
      returned_one_months: 0.5
    rule: 'This policy prices the increase deposit: the security deposit Meadowlark holds for an allocation-increase request on a subscription whose credit_review is deposit_required and which has exactly one allocation-increase request with outcome received, while that request awaits its filing; the business pays it itself through the secure payment portal by ach or by mailed check, the payment method is never on file, and a Meadowlark representative never takes bank account numbers. The policy applies while no more than max_consecutive_estimates statement months in a row have passed their estimate waiting period without a credit posting. For an increase deposit, and only for such a deposit, the deposit is worked out from the subscription''s own invoiced charges as this policy states, its total is rounded half up to the cent once, and a deposit of 0.00 writes no deposit line; every other deposit remains under the base rule, which reads: the deposit equals security_deposit_months multiplied by the estimated monthly charge, where the estimated monthly charge is contract_kw multiplied by the project''s expected_yield_kwh_per_kw and est_credit_rate_per_kwh and by (100 minus savings_rate_pct) divided by 100, divided by 12; the product is rounded half up to the cent once. For an increase deposit, and only for such a deposit, the deposit is paid by the business through the secure payment portal (ach) or by mailed check after the increase request is received and before the increase is filed, and never by a representative taking account numbers; every other deposit remains under the base rule, which reads: the deposit is paid by the business through the secure payment portal (ach) or by check before approval and never by a representative taking account numbers. The increase deposit is not fixed until the billing ledger carries an estimated charge for every statement month whose estimate waiting period has passed without a credit posting. A statement month''s estimate waiting period passes estimate_wait_days calendar days after the month ends. The increase request is the subscription''s one allocation-increase request with outcome received. The added kW are the increase request''s requested_kw sized down to a whole multiple of the plan''s allocation_increment_kw. The share before the increase is the kW of the subscription''s allocation filing lines that add kW less the kW of those that remove kW. The monthly charge estimate is the amount of the subscription charges, actual and estimated, whose bill_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today, divided by their number, and 0 when there are none. The per-kW monthly estimate is the monthly charge estimate divided by the share before the increase. The deposit months are the plan''s security_deposit_months. The added-kW requirement is the deposit months multiplied by the per-kW monthly estimate and by the added kW. The increase deposit is the added-kW requirement plus the held-deposit top-up, rounded half up to the cent, and 0.00 when that is not positive; the held-deposit top-up is 0. Payment-record months: the late fees counted are the late fees assessed on the subscription and those assessed on the customer''s garden shares whose bill_date falls after the same calendar day deposit_refund_on_time_months months before today (the last day of that month when it has no such day) and on or before today; the deposit months are security_deposit_months plus 1 when the subscription is dual-billed and two or more late fees are counted, 1 when the subscription is dual-billed and no late fee is counted, and security_deposit_months otherwise. Returned-payment months: the returned payments counted are the subscription''s payments returned unpaid whose bill_date falls after the same calendar day deposit_refund_on_time_months months before today (the last day of that month when it has no such day) and on or before today; the returned-payment months are returned_two_months when two or more are counted, returned_one_months when exactly one is, and 0 when none is, and they are added to the deposit months. Enlarged-share band: the enlarged share is the share before the increase plus the added kW; the added-kW requirement is multiplied by band_large_mult when the enlarged share is band_large_kw or more, by band_mid_mult when it is band_mid_kw or more and below band_large_kw, and by 1 when it is below band_mid_kw. Increase-depth level: the added-kW requirement is multiplied by depth_high_mult when the added kW are more than depth_high_pct percent of the share before the increase, by depth_mid_mult when they are more than depth_mid_pct percent and at most depth_high_pct percent of it, and by 1 when they are at most depth_mid_pct percent of it. Remaining-term level: the months left are the whole months from today to the term_end_date (whole months are counted as calendar months, a month becoming whole when the later date''s day of the month reaches the earlier date''s day of the month, with no other month-end adjustment); the added-kW requirement is multiplied by term_short_mult when the term_end_date is today or later and fewer than term_short_months months are left, by term_mid_mult when term_short_months or more but fewer than term_mid_months months are left, and by 1 when term_mid_months or more are left, when the term_end_date has passed or when the plan has no committed term. Held-deposit top-up: the held deposit is the amount of the subscription''s deposit-held lines less the amount of its deposit-released lines, and the current-share requirement is the plan''s security_deposit_months multiplied by the monthly charge estimate; when the held deposit is more than 0 and below the current-share requirement, the held-deposit top-up is the current-share requirement less the held deposit; when the held deposit is 0 and the subscription has a deposit-released line, the held-deposit top-up is the current-share requirement; and otherwise it is 0. The adjustments act on the standard method''s quantities as each states: the returned-payment months are added to the deposit months, the multipliers then apply together to the added-kW requirement, and the held-deposit top-up is added last, before the single rounding.'
    prerequisite:
    - problem: biz_ext_late_statement_estimate
      kind: value_input
      gate: monthly_estimate
      form: state
      policy_source: The increase deposit is not fixed until the billing ledger carries an estimated charge for every statement month whose estimate waiting period has passed without a credit posting.
      condition: biz_billing carries a biz_charge_billed row with charge_basis estimated for every statement month of the subscription that ended more than estimate_wait_days calendar days before today and has no credit posting.
      resolved_by: bill_statement_estimate_b08e308f
      effect: The estimated charge billed for the unreported statement month enters the subscription charges whose bill_date falls in the estimate_basis_months months before today, so the monthly charge estimate, the per-kW monthly estimate and the current-share requirement all change.
    cross_category:
    - category: garden
      as: history
      reads:
      - garden_billing.event_type
      - garden_billing.bill_date
      note: the payment-record months count the late fees assessed on the customer's garden shares within deposit_refund_on_time_months months.
    compute:
    - requested_kw: LATEST('biz_requests', 'requested_kw', date_field='received_date', request_type='allocation_increase', outcome='received')
    - added_kw: int(requested_kw / P('allocation_increment_kw')) * P('allocation_increment_kw')
    - share_kw: (SUM('biz_allocations', 'kw', event_type='biz_allocation_filed') - SUM('biz_allocations', 'kw', event_type='biz_allocation_reduced'))
    - charge_count: COUNT('biz_billing', within_months=P('estimate_basis_months'), date_field='bill_date', event_type='biz_charge_billed')
    - charge_sum: SUM('biz_billing', 'amount', within_months=P('estimate_basis_months'), date_field='bill_date', event_type='biz_charge_billed')
    - monthly_estimate: charge_sum / charge_count if charge_count > 0 else 0
    - per_kw_estimate: monthly_estimate / share_kw if share_kw > 0 else 0
    - late_fees_counted: COUNT('biz_billing', within_months=P('deposit_refund_on_time_months'), date_field='bill_date', event_type='biz_late_fee_assessed') + XCOUNT('garden', 'garden_billing', within_months=P('deposit_refund_on_time_months'), date_field='bill_date', event_type='garden_late_fee_assessed')
    - deposit_months: P('security_deposit_months') + 1 if (F('billing_type') == 'dual' and late_fees_counted >= 2) else (1 if (F('billing_type') == 'dual' and late_fees_counted == 0) else P('security_deposit_months'))
    - returned_counted: COUNT('biz_billing', within_months=P('deposit_refund_on_time_months'), date_field='bill_date', event_type='biz_payment_returned')
    - returned_months: K('returned_two_months') if returned_counted >= 2 else (K('returned_one_months') if returned_counted == 1 else 0)
    - enlarged_kw: (SUM('biz_allocations', 'kw', event_type='biz_allocation_filed') - SUM('biz_allocations', 'kw', event_type='biz_allocation_reduced')) + added_kw
    - band_mult: K('band_large_mult') if enlarged_kw >= K('band_large_kw') else (K('band_mid_mult') if enlarged_kw >= K('band_mid_kw') else 1)
    - depth_pct: added_kw * 100 / (SUM('biz_allocations', 'kw', event_type='biz_allocation_filed') - SUM('biz_allocations', 'kw', event_type='biz_allocation_reduced'))
    - depth_mult: K('depth_high_mult') if depth_pct > K('depth_high_pct') else (K('depth_mid_mult') if depth_pct > K('depth_mid_pct') else 1)
    - term_open: P('term_months') > 0 and DAYS(NOW, F('term_end_date')) >= 0
    - months_left: MONTHS(NOW, F('term_end_date')) if term_open else 0
    - term_mult: K('term_short_mult') if (term_open and months_left < K('term_short_months')) else (K('term_mid_mult') if (term_open and months_left < K('term_mid_months')) else 1)
    - added_requirement: (deposit_months + returned_months) * per_kw_estimate * added_kw * band_mult * depth_mult * term_mult
    - held_deposit: SUM('biz_billing', 'amount', event_type='biz_deposit_held') - SUM('biz_billing', 'amount', event_type='biz_deposit_released')
    - released_lines: COUNT('biz_billing', event_type='biz_deposit_released')
    - current_requirement: P('security_deposit_months') * monthly_estimate
    - held_topup: current_requirement - held_deposit if (held_deposit > 0 and held_deposit < current_requirement) else (current_requirement if (held_deposit <= 0 and released_lines >= 1) else 0)
    - result: RND(MX(0, added_requirement + held_topup) + 0.000000001, 2)
    compute_basis:
      requested_kw: The increase request is the subscription's one allocation-increase request with outcome received.
      added_kw: The added kW are the increase request's requested_kw sized down to a whole multiple of the plan's allocation_increment_kw.
      share_kw: The share before the increase is the kW of the subscription's allocation filing lines that add kW less the kW of those that remove kW.
      charge_count: The monthly charge estimate is the amount of the subscription charges, actual and estimated, whose bill_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today, divided by their number, and 0 when there are none.
      charge_sum: The monthly charge estimate is the amount of the subscription charges, actual and estimated, whose bill_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today, divided by their number, and 0 when there are none.
      monthly_estimate: The monthly charge estimate is the amount of the subscription charges, actual and estimated, whose bill_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today, divided by their number, and 0 when there are none.
      per_kw_estimate: The per-kW monthly estimate is the monthly charge estimate divided by the share before the increase.
      late_fees_counted: the late fees counted are the late fees assessed on the subscription and those assessed on the customer's garden shares whose bill_date falls after the same calendar day deposit_refund_on_time_months months before today (the last day of that month when it has no such day) and on or before today
      deposit_months: the deposit months are security_deposit_months plus 1 when the subscription is dual-billed and two or more late fees are counted, 1 when the subscription is dual-billed and no late fee is counted, and security_deposit_months otherwise.
      returned_counted: the returned payments counted are the subscription's payments returned unpaid whose bill_date falls after the same calendar day deposit_refund_on_time_months months before today (the last day of that month when it has no such day) and on or before today
      returned_months: the returned-payment months are returned_two_months when two or more are counted, returned_one_months when exactly one is, and 0 when none is, and they are added to the deposit months.
      enlarged_kw: the enlarged share is the share before the increase plus the added kW
      band_mult: the added-kW requirement is multiplied by band_large_mult when the enlarged share is band_large_kw or more, by band_mid_mult when it is band_mid_kw or more and below band_large_kw, and by 1 when it is below band_mid_kw.
      depth_pct: when the added kW are more than depth_high_pct percent of the share before the increase
      depth_mult: the added-kW requirement is multiplied by depth_high_mult when the added kW are more than depth_high_pct percent of the share before the increase, by depth_mid_mult when they are more than depth_mid_pct percent and at most depth_high_pct percent of it, and by 1 when they are at most depth_mid_pct percent of it.
      term_open: when the term_end_date is today or later and fewer than term_short_months months are left, by term_mid_mult when term_short_months or more but fewer than term_mid_months months are left, and by 1 when term_mid_months or more are left, when the term_end_date has passed or when the plan has no committed term.
      months_left: the months left are the whole months from today to the term_end_date (whole months are counted as calendar months, a month becoming whole when the later date's day of the month reaches the earlier date's day of the month, with no other month-end adjustment)
      term_mult: the added-kW requirement is multiplied by term_short_mult when the term_end_date is today or later and fewer than term_short_months months are left, by term_mid_mult when term_short_months or more but fewer than term_mid_months months are left, and by 1 when term_mid_months or more are left, when the term_end_date has passed or when the plan has no committed term.
      added_requirement: The added-kW requirement is the deposit months multiplied by the per-kW monthly estimate and by the added kW.
      held_deposit: the held deposit is the amount of the subscription's deposit-held lines less the amount of its deposit-released lines
      released_lines: when the held deposit is 0 and the subscription has a deposit-released line, the held-deposit top-up is the current-share requirement; and otherwise it is 0.
      current_requirement: the current-share requirement is the plan's security_deposit_months multiplied by the monthly charge estimate
      held_topup: when the held deposit is more than 0 and below the current-share requirement, the held-deposit top-up is the current-share requirement less the held deposit; when the held deposit is 0 and the subscription has a deposit-released line, the held-deposit top-up is the current-share requirement; and otherwise it is 0.
      result: The increase deposit is the added-kW requirement plus the held-deposit top-up, rounded half up to the cent, and 0.00 when that is not positive; the held-deposit top-up is 0.
    factors:
    - id: payment_record_months
      effect: parameter
      decides: deposit_months
      bindings:
      - late_fees_counted
      - deposit_months
      ladder:
      - when: the subscription is dual-billed AND two or more late fees are counted (on it and on the customer's garden shares together)
        value: P('security_deposit_months') + 1
      - when: the subscription is dual-billed AND no late fee is counted
        value: '1'
      - when: otherwise
        value: P('security_deposit_months')
      baseline:
        deposit_months: P('security_deposit_months')
      evidence:
      - history
      - cross_category
      cross_difficulty: garden
    - id: returned_payment_months
      effect: parameter
      decides: returned_months
      bindings:
      - returned_counted
      - returned_months
      ladder:
      - when: two or more returned payments are counted
        value: K('returned_two_months')
      - when: exactly one is counted
        value: K('returned_one_months')
      - when: otherwise (none)
        value: '0'
      baseline:
        returned_months: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: enlarged_share_band
      effect: parameter
      decides: band_mult
      bindings:
      - enlarged_kw
      - band_mult
      ladder:
      - when: the enlarged share is band_large_kw or more
        value: K('band_large_mult')
      - when: the enlarged share is band_mid_kw or more and below band_large_kw
        value: K('band_mid_mult')
      - when: otherwise (below band_mid_kw)
        value: '1'
      baseline:
        band_mult: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: increase_depth_level
      effect: parameter
      decides: depth_mult
      bindings:
      - depth_pct
      - depth_mult
      ladder:
      - when: the added kW are more than depth_high_pct percent of the share before the increase
        value: K('depth_high_mult')
      - when: they are more than depth_mid_pct percent and at most depth_high_pct percent of it
        value: K('depth_mid_mult')
      - when: otherwise (at most depth_mid_pct percent)
        value: '1'
      baseline:
        depth_mult: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: remaining_term_level
      effect: parameter
      decides: term_mult
      bindings:
      - term_open
      - months_left
      - term_mult
      ladder:
      - when: the term_end_date is today or later AND fewer than term_short_months months are left
        value: K('term_short_mult')
      - when: the term_end_date is today or later AND term_short_months or more but fewer than term_mid_months months are left
        value: K('term_mid_mult')
      - when: otherwise (term_mid_months or more left, term_end_date passed, or no committed term)
        value: '1'
      baseline:
        term_mult: '1'
      evidence:
      - date
      cross_difficulty: null
    - id: held_deposit_topup
      effect: method
      decides: held_topup
      bindings:
      - held_deposit
      - released_lines
      - current_requirement
      - held_topup
      ladder:
      - when: the held deposit is more than 0 AND below the current-share requirement
        method: add the current-share requirement less the held deposit
      - when: the held deposit is 0 AND the subscription has a deposit-released line
        method: add the current-share requirement
      - when: otherwise
        method: add nothing
      baseline:
        held_topup: '0'
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: 'For an increase deposit, and only for such a deposit, the deposit is worked out from the subscription''s own invoiced charges as this policy states, its total is rounded half up to the cent once, and a deposit of 0.00 writes no deposit line; every other deposit remains under the base rule, which reads: the deposit equals security_deposit_months multiplied by the estimated monthly charge, where the estimated monthly charge is contract_kw multiplied by the project''s expected_yield_kwh_per_kw and est_credit_rate_per_kwh and by (100 minus savings_rate_pct) divided by 100, divided by 12; the product is rounded half up to the cent once. For an increase deposit, and only for such a deposit, the deposit is paid by the business through the secure payment portal (ach) or by mailed check after the increase request is received and before the increase is filed, and never by a representative taking account numbers; every other deposit remains under the base rule, which reads: the deposit is paid by the business through the secure payment portal (ach) or by check before approval and never by a representative taking account numbers. The increase request is the subscription''s one allocation-increase request with outcome received. The added kW are the increase request''s requested_kw sized down to a whole multiple of the plan''s allocation_increment_kw. The share before the increase is the kW of the subscription''s allocation filing lines that add kW less the kW of those that remove kW. The monthly charge estimate is the amount of the subscription charges, actual and estimated, whose bill_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today, divided by their number, and 0 when there are none. The per-kW monthly estimate is the monthly charge estimate divided by the share before the increase. The deposit months are the plan''s security_deposit_months. The added-kW requirement is the deposit months multiplied by the per-kW monthly estimate and by the added kW. The increase deposit is the added-kW requirement plus the held-deposit top-up, rounded half up to the cent, and 0.00 when that is not positive; the held-deposit top-up is 0.'
      params:
      - security_deposit_months
      - estimate_basis_months
      - allocation_increment_kw
    inputs:
      history:
      - table: biz_billing
        aggregate: sum
        field: amount
        within_months: 3
        filters:
          event_type: biz_charge_billed
      - table: biz_billing
        aggregate: count
        field: biz_bill_id
        within_months: 12
        filters:
          event_type: biz_late_fee_assessed
      - table: biz_billing
        aggregate: count
        field: biz_bill_id
        within_months: 12
        filters:
          event_type: biz_payment_returned
      - table: biz_billing
        aggregate: sum
        field: amount
        filters:
          event_type: biz_deposit_held
      - table: biz_billing
        aggregate: count
        field: biz_bill_id
        filters:
          event_type: biz_deposit_released
      - category: garden
        table: garden_billing
        aggregate: count
        field: garden_bill_id
        within_months: 12
        filters:
          event_type: garden_late_fee_assessed
      cross_category:
      - garden
