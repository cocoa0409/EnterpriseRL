- id: biz_benefit_basis
  subject: [biz_charge_billed, biz_billing_credited]
  rule: >-
    Account-wide benefit rule, the same for every Meadowlark subscription line: a subscription's charges
    are priced only by its own plan's pricing (its savings_rate_pct, or its contract rate with escalator
    on fixed-rate plans); no promotion, referral reward, second subscription, waitlist reservation or
    other line's plan changes that price, and benefits never stack. Billing credits are separate ledger
    lines and never reduce a charge's own amount. Each subscription keeps its own ledger: a payment, credit
    or fee belongs only to the subscription it is recorded on and is never moved to another subscription
    or line.
  eligibility: []
- id: biz_billing_arrangement
  subject: [biz_billing_type_changed, biz_enrolled]
  rule: >-
    Consolidated billing (utility net crediting) is available only for projects in a program listed in
    consolidated_billing_programs and only on plans whose billing_types_offered include it; every other
    subscription is dual billed. A change of billing arrangement is accepted only for a subscription in
    active status. A switch is requested by the subscriber and applies to charges invoiced on or after
    the first day of the month following the request's received_date; charges already invoiced keep their
    billing_type. Switching to consolidated billing requires that no dual-billed line is past due.
  eligibility:
  - id: switch_status
    applies_to: [biz_billing_type_changed]
    kind: state
    condition: A change of billing arrangement is accepted only for a subscription in active status.
    evidence_fields: [biz_subscriptions.status, biz_subscriptions.biz_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [biz_subscriptions.biz_sub_id]
      action_bindings: {biz_subscriptions.biz_sub_id: biz_sub_id}
    state_contract:
      field: biz_subscriptions.status
      allowed: [active]
  params:
    consolidated_billing_programs: [NY_VDER]
    per_tier:
      Meadowlark Business Starter: {billing_types_offered: =billing_types_offered}
      Meadowlark Business Standard: {billing_types_offered: =billing_types_offered}
      Meadowlark Business Plus: {billing_types_offered: =billing_types_offered}
      Meadowlark Business Pro: {billing_types_offered: =billing_types_offered}
      Meadowlark Business Premier: {billing_types_offered: =billing_types_offered}
      Meadowlark Business Multi-Site: {billing_types_offered: =billing_types_offered}
- id: biz_evt_security_deposit
  subject: [biz_credit_reviewed, biz_deposit_held, biz_deposit_released]
  rule: >-
    Plans with credit_review_required true are approved only after the business credit review; the review
    outcome is approved or deposit_required, and plans without review record not_required. A security
    deposit is held only on a subscription whose credit_review is deposit_required. The deposit equals
    security_deposit_months multiplied by the estimated monthly charge, where the estimated monthly charge
    is contract_kw multiplied by the project's expected_yield_kwh_per_kw and est_credit_rate_per_kwh and
    by (100 minus savings_rate_pct) divided by 100, divided by 12; the product is rounded half up to the
    cent once. The deposit is paid by the business through the secure payment portal (ach) or by check
    before approval and never by a representative taking account numbers. It is released in full after
    deposit_refund_on_time_months consecutive statement months in which no late fee was assessed on the
    subscription, or at closing, when it is first applied to any balance still owed and the remainder
    refunded. A held deposit is released exactly once. A deposit does not earn interest and is never applied
    to monthly charges while the subscription is open.
  eligibility:
  - id: deposit_required_only
    applies_to: [biz_deposit_held]
    kind: state
    condition: A security deposit is held only on a subscription whose credit_review is deposit_required.
    evidence_fields: [biz_subscriptions.credit_review, biz_subscriptions.biz_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [biz_subscriptions.biz_sub_id]
      action_bindings: {biz_subscriptions.biz_sub_id: biz_sub_id}
    state_contract:
      field: biz_subscriptions.credit_review
      allowed: [deposit_required]
  - id: release_once
    applies_to: [biz_deposit_released]
    kind: dedup
    condition: A held deposit is released exactly once.
    evidence_fields: [biz_billing.biz_ref_bill_id, biz_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [biz_billing.biz_ref_bill_id]
      action_bindings: {biz_billing.biz_ref_bill_id: biz_ref_bill_id}
    dedup_contract:
      table: biz_billing
      mode: separate_record
      object_bindings: {biz_ref_bill_id: biz_ref_bill_id}
      duplicate_filters:
        event_type: [biz_deposit_released]
      distinct_fields: []
  params:
    per_tier:
      Meadowlark Business Starter: {credit_review_required: =credit_review_required, security_deposit_months: =security_deposit_months,
        deposit_refund_on_time_months: =deposit_refund_on_time_months, savings_rate_pct: =savings_rate_pct}
      Meadowlark Business Standard: {credit_review_required: =credit_review_required, security_deposit_months: =security_deposit_months,
        deposit_refund_on_time_months: =deposit_refund_on_time_months, savings_rate_pct: =savings_rate_pct}
      Meadowlark Business Plus: {credit_review_required: =credit_review_required, security_deposit_months: =security_deposit_months,
        deposit_refund_on_time_months: =deposit_refund_on_time_months, savings_rate_pct: =savings_rate_pct}
      Meadowlark Business Pro: {credit_review_required: =credit_review_required, security_deposit_months: =security_deposit_months,
        deposit_refund_on_time_months: =deposit_refund_on_time_months, savings_rate_pct: =savings_rate_pct}
      Meadowlark Business Premier: {credit_review_required: =credit_review_required, security_deposit_months: =security_deposit_months,
        deposit_refund_on_time_months: =deposit_refund_on_time_months, savings_rate_pct: =savings_rate_pct}
      Meadowlark Business Multi-Site: {credit_review_required: =credit_review_required, security_deposit_months: =security_deposit_months,
        deposit_refund_on_time_months: =deposit_refund_on_time_months, savings_rate_pct: =savings_rate_pct}
extended_policies:
  - id: biz_ext_guarantee_trueup
    base_policy_refs:
    - biz_evt_annual_trueup
    - biz_benefit_basis
    overwrite:
    - base_policy: biz_evt_annual_trueup
      superseded_clause: The review period is the twelve statement months ending with the month before the anniversary month.
      replaced_by: 'For a guarantee-schedule year, and only for such a year, the measured lines are the subscription''s credit postings and credit reversals whose posted_date falls after the same calendar day twelve months before the review date and on or before the review date, the true-up records the earliest and the latest statement_month of the measured postings as its period_start_month and period_end_month, and its usage_kwh_12m is the utility account''s reported annual_usage_kwh for the twelve months ending with that latest statement month; every other contract year remains under the base rule, which reads: the review period is the twelve statement months ending with the month before the anniversary month.'
    - base_policy: biz_evt_annual_trueup
      superseded_clause: 'Production guarantee: when production_guarantee_pct is greater than 0, guaranteed_kwh is allocation_kw on the review_date multiplied by the project''s expected_yield_kwh_per_kw and by production_guarantee_pct divided by 100, rounded half up to a whole kWh, and shortfall_kwh is guaranteed_kwh less credited_kwh_12m when positive.'
      replaced_by: 'For a guarantee-schedule year, and only for such a year, the year''s guaranteed kWh are the guaranteed_kwh recorded on the subscription''s most recent true-up reduced by the degradation step percent and rounded half up to a whole kWh, and the guaranteed kWh for the period are the year''s guaranteed kWh multiplied by the period share and rounded half up to a whole kWh; every other contract year remains under the base rule, which reads: when production_guarantee_pct is greater than 0, guaranteed_kwh is allocation_kw on the review_date multiplied by the project''s expected_yield_kwh_per_kw and by production_guarantee_pct divided by 100, rounded half up to a whole kWh, and shortfall_kwh is guaranteed_kwh less credited_kwh_12m when positive.'
    - base_policy: biz_evt_annual_trueup
      superseded_clause: The guarantee credit is shortfall_kwh multiplied by avg_credit_rate and by savings_rate_pct divided by 100 (the savings the missing production would have earned), rounded half up to the cent.
      replaced_by: 'For a guarantee-schedule year, and only for such a year, the guarantee credit is the shortfall multiplied by the valuation rate and by the savings percentage divided by 100, rounded half up to the cent, and a credit of 0.00 posts no billing credit; every other contract year remains under the base rule, which reads: the guarantee credit is shortfall_kwh multiplied by avg_credit_rate and by savings_rate_pct divided by 100 (the savings the missing production would have earned), rounded half up to the cent.'
    - base_policy: biz_evt_annual_trueup
      superseded_clause: Each contract year of a subscription is reviewed exactly once.
      replaced_by: 'For a guarantee-schedule year, and only for such a year, the true-up closes the contract year reviewed and is recorded only when no true-up of the subscription already closes that contract year; every other contract year remains under the base rule, which reads: each contract year of a subscription is reviewed exactly once.'
    trigger: state_due
    subject:
    - biz_trueup_completed
    computes: guarantee_credit
    target_tool: complete_guarantee_trueup_bd5f1ac2
    params:
      lid_step_pct: 2.0
      step_pct: 0.5
      excused_min_months: 9
      carry_cap_pct: 5
      banked_high_pct: 25
      band_large_kw: 150
      band_mid_kw: 50
      band_large_points: 3.0
      band_mid_points: 1.5
    rule: 'This policy prices the production-guarantee credit of a guarantee-schedule year: a contract year after the first, of a subscription whose plan has a production_guarantee_pct greater than 0, whose most recent true-up closed the previous contract year with a guaranteed_kwh greater than 0, in which no allocation filing line of the subscription took effect, and through which the subscription stayed active (status active on the review date, with no notice_date, move_out_date or removal_notice_date on file). For a guarantee-schedule year, and only for such a year, the measured lines are the subscription''s credit postings and credit reversals whose posted_date falls after the same calendar day twelve months before the review date and on or before the review date, the true-up records the earliest and the latest statement_month of the measured postings as its period_start_month and period_end_month, and its usage_kwh_12m is the utility account''s reported annual_usage_kwh for the twelve months ending with that latest statement month; every other contract year remains under the base rule, which reads: the review period is the twelve statement months ending with the month before the anniversary month. For a guarantee-schedule year, and only for such a year, the year''s guaranteed kWh are the guaranteed_kwh recorded on the subscription''s most recent true-up reduced by the degradation step percent and rounded half up to a whole kWh, and the guaranteed kWh for the period are the year''s guaranteed kWh multiplied by the period share and rounded half up to a whole kWh; every other contract year remains under the base rule, which reads: when production_guarantee_pct is greater than 0, guaranteed_kwh is allocation_kw on the review_date multiplied by the project''s expected_yield_kwh_per_kw and by production_guarantee_pct divided by 100, rounded half up to a whole kWh, and shortfall_kwh is guaranteed_kwh less credited_kwh_12m when positive. For a guarantee-schedule year, and only for such a year, the guarantee credit is the shortfall multiplied by the valuation rate and by the savings percentage divided by 100, rounded half up to the cent, and a credit of 0.00 posts no billing credit; every other contract year remains under the base rule, which reads: the guarantee credit is shortfall_kwh multiplied by avg_credit_rate and by savings_rate_pct divided by 100 (the savings the missing production would have earned), rounded half up to the cent. For a guarantee-schedule year, and only for such a year, the true-up closes the contract year reviewed and is recorded only when no true-up of the subscription already closes that contract year; every other contract year remains under the base rule, which reads: each contract year of a subscription is reviewed exactly once. The most recent true-up is the subscription''s true-up with the latest review_date; a subscription''s true-ups close different contract years on different review dates. The contract year reviewed is the contract_year of the most recent true-up plus 1. The true-up of a guarantee-schedule year records the year''s guaranteed kWh as its guaranteed_kwh, the measured kWh as its credited_kwh_12m and the shortfall as its shortfall_kwh. The degradation step is 0. The period share is 1. The measured kWh are the credited_kwh of the measured postings less the credited_kwh of the measured reversals. The shortfall is the guaranteed kWh for the period less the measured kWh and less the carried-over kWh, and zero when that is negative; the carried-over kWh are 0. The valuation rate is the average credit rate: the credit_value of the measured postings less the credit_value of the measured reversals, divided by the measured kWh and rounded half up to four decimals, and zero when there are no measured kWh. The savings percentage is the plan''s savings_rate_pct. Degradation schedule: the degradation step is lid_step_pct when the contract year reviewed is 2, the year that carries the modules'' first-year degradation; step_pct when the contract year reviewed is 3 or later and ends within the committed term (the contract year reviewed times 12 is at most the plan''s term_months); and 0 when the contract year reviewed is 3 or later and ends after the committed term, where the schedule stays at its last figure. Excused statement months: the credited months are the number of measured postings less the number of measured reversals, and the period share is 0 when the credited months are fewer than excused_min_months, the credited months divided by 12 when they are excused_min_months or more and fewer than 12, and 1 when they are 12 or more. Surplus carryover: the carried-over kWh are the most recent true-up''s credited_kwh_12m less its guaranteed_kwh, limited to carry_cap_pct percent of that true-up''s guaranteed_kwh rounded half up to a whole kWh, when that true-up''s credited_kwh_12m exceeds its guaranteed_kwh by more than that limit; the whole excess when it exceeds its guaranteed_kwh by more than 0 and at most that limit; and 0 when that true-up shows no excess. Banked-credit valuation: the banked share is the banked_value of the measured postings as a percentage of their credit_value, and the applied rate is the credit_value of the measured postings less their banked_value and less the credit_value of the measured reversals, divided by the measured kWh and rounded half up to four decimals; the valuation rate is the applied rate when the banked share is above banked_high_pct, the mean of the average credit rate and the applied rate rounded half up to four decimals when the banked share is above 0 and at most banked_high_pct, and the average credit rate when nothing was banked. Share-size guarantee schedule: the savings percentage is the plan''s savings_rate_pct plus band_large_points when the allocation_kw on file on the review date, the kW of the subscription''s allocation filing lines that add kW less the kW of those that remove kW, is band_large_kw or more, the plan''s savings_rate_pct plus band_mid_points when it is band_mid_kw or more and below band_large_kw, and the plan''s savings_rate_pct when it is below band_mid_kw. Each adjustment acts on the quantity it names in the standard method: the degradation step applies to the year''s guaranteed kWh before the period share applies to the guaranteed kWh for the period, and the carried-over kWh are deducted before the shortfall''s zero floor.'
    prerequisite: []
    cross_category: []
    compute:
    - contract_year_reviewed: LATEST('biz_reviews', 'contract_year', date_field='review_date') + 1
    - prior_guaranteed_kwh: LATEST('biz_reviews', 'guaranteed_kwh', date_field='review_date')
    - prior_credited_kwh: LATEST('biz_reviews', 'credited_kwh_12m', date_field='review_date')
    - degradation_step: K('lid_step_pct') if contract_year_reviewed == 2 else (K('step_pct') if contract_year_reviewed * 12 <= P('term_months') else 0)
    - year_guaranteed_kwh: int(prior_guaranteed_kwh * (100 - degradation_step) / 100 + 0.5)
    - posting_count: COUNT('biz_credits', within_months=12, date_field='posted_date', event_type='biz_credit_posted')
    - reversal_count: COUNT('biz_credits', within_months=12, date_field='posted_date', event_type='biz_credit_reversed')
    - credited_months: posting_count - reversal_count
    - period_share: 0 if credited_months < K('excused_min_months') else (credited_months / 12 if credited_months < 12 else 1)
    - period_guaranteed_kwh: int(year_guaranteed_kwh * period_share + 0.5)
    - posted_kwh: SUM('biz_credits', 'credited_kwh', within_months=12, date_field='posted_date', event_type='biz_credit_posted')
    - reversed_kwh: SUM('biz_credits', 'credited_kwh', within_months=12, date_field='posted_date', event_type='biz_credit_reversed')
    - measured_kwh: posted_kwh - reversed_kwh
    - carry_limit_kwh: int(prior_guaranteed_kwh * K('carry_cap_pct') / 100 + 0.5)
    - prior_excess_kwh: prior_credited_kwh - prior_guaranteed_kwh
    - carried_over_kwh: carry_limit_kwh if prior_excess_kwh > carry_limit_kwh else (prior_excess_kwh if prior_excess_kwh > 0 else 0)
    - shortfall_kwh: MX(0, period_guaranteed_kwh - measured_kwh - carried_over_kwh)
    - posted_value: SUM('biz_credits', 'credit_value', within_months=12, date_field='posted_date', event_type='biz_credit_posted')
    - reversed_value: SUM('biz_credits', 'credit_value', within_months=12, date_field='posted_date', event_type='biz_credit_reversed')
    - posted_banked: SUM('biz_credits', 'banked_value', within_months=12, date_field='posted_date', event_type='biz_credit_posted')
    - average_rate: RND((posted_value - reversed_value) / measured_kwh + 0.000000001, 4) if measured_kwh > 0 else 0
    - banked_share_pct: posted_banked * 100 / posted_value if posted_value > 0 else 0
    - applied_rate: RND((posted_value - posted_banked - reversed_value) / measured_kwh + 0.000000001, 4) if measured_kwh > 0 else 0
    - valuation_rate: applied_rate if banked_share_pct > K('banked_high_pct') else (RND((average_rate + applied_rate) / 2 + 0.000000001, 4) if banked_share_pct > 0 else average_rate)
    - band_share_kw: SUM('biz_allocations', 'kw', event_type='biz_allocation_filed') - SUM('biz_allocations', 'kw', event_type='biz_allocation_reduced')
    - savings_pct: P('savings_rate_pct') + K('band_large_points') if band_share_kw >= K('band_large_kw') else (P('savings_rate_pct') + K('band_mid_points') if band_share_kw >= K('band_mid_kw') else P('savings_rate_pct'))
    - result: RND(shortfall_kwh * valuation_rate * savings_pct / 100 + 0.000000001, 2)
    compute_basis:
      contract_year_reviewed: The contract year reviewed is the contract_year of the most recent true-up plus 1.
      prior_guaranteed_kwh: The most recent true-up is the subscription's true-up with the latest review_date; a subscription's true-ups close different contract years on different review dates.
      prior_credited_kwh: 'Surplus carryover: the carried-over kWh are the most recent true-up''s credited_kwh_12m less its guaranteed_kwh'
      degradation_step: 'Degradation schedule: the degradation step is lid_step_pct when the contract year reviewed is 2, the year that carries the modules'' first-year degradation; step_pct when the contract year reviewed is 3 or later and ends within the committed term (the contract year reviewed times 12 is at most the plan''s term_months); and 0 when the contract year reviewed is 3 or later and ends after the committed term, where the schedule stays at its last figure.'
      year_guaranteed_kwh: the year's guaranteed kWh are the guaranteed_kwh recorded on the subscription's most recent true-up reduced by the degradation step percent and rounded half up to a whole kWh
      posting_count: the credited months are the number of measured postings less the number of measured reversals
      reversal_count: the credited months are the number of measured postings less the number of measured reversals
      credited_months: the credited months are the number of measured postings less the number of measured reversals
      period_share: the period share is 0 when the credited months are fewer than excused_min_months, the credited months divided by 12 when they are excused_min_months or more and fewer than 12, and 1 when they are 12 or more.
      period_guaranteed_kwh: the guaranteed kWh for the period are the year's guaranteed kWh multiplied by the period share and rounded half up to a whole kWh
      posted_kwh: the measured lines are the subscription's credit postings and credit reversals whose posted_date falls after the same calendar day twelve months before the review date and on or before the review date
      reversed_kwh: the measured lines are the subscription's credit postings and credit reversals whose posted_date falls after the same calendar day twelve months before the review date and on or before the review date
      measured_kwh: The measured kWh are the credited_kwh of the measured postings less the credited_kwh of the measured reversals.
      carry_limit_kwh: limited to carry_cap_pct percent of that true-up's guaranteed_kwh rounded half up to a whole kWh
      prior_excess_kwh: 'Surplus carryover: the carried-over kWh are the most recent true-up''s credited_kwh_12m less its guaranteed_kwh'
      carried_over_kwh: 'Surplus carryover: the carried-over kWh are the most recent true-up''s credited_kwh_12m less its guaranteed_kwh, limited to carry_cap_pct percent of that true-up''s guaranteed_kwh rounded half up to a whole kWh, when that true-up''s credited_kwh_12m exceeds its guaranteed_kwh by more than that limit; the whole excess when it exceeds its guaranteed_kwh by more than 0 and at most that limit; and 0 when that true-up shows no excess.'
      shortfall_kwh: The shortfall is the guaranteed kWh for the period less the measured kWh and less the carried-over kWh, and zero when that is negative; the carried-over kWh are 0.
      posted_value: 'The valuation rate is the average credit rate: the credit_value of the measured postings less the credit_value of the measured reversals, divided by the measured kWh and rounded half up to four decimals, and zero when there are no measured kWh.'
      reversed_value: 'The valuation rate is the average credit rate: the credit_value of the measured postings less the credit_value of the measured reversals, divided by the measured kWh and rounded half up to four decimals, and zero when there are no measured kWh.'
      average_rate: 'The valuation rate is the average credit rate: the credit_value of the measured postings less the credit_value of the measured reversals, divided by the measured kWh and rounded half up to four decimals, and zero when there are no measured kWh.'
      posted_banked: the banked share is the banked_value of the measured postings as a percentage of their credit_value
      banked_share_pct: the banked share is the banked_value of the measured postings as a percentage of their credit_value
      applied_rate: the applied rate is the credit_value of the measured postings less their banked_value and less the credit_value of the measured reversals, divided by the measured kWh and rounded half up to four decimals
      valuation_rate: the valuation rate is the applied rate when the banked share is above banked_high_pct, the mean of the average credit rate and the applied rate rounded half up to four decimals when the banked share is above 0 and at most banked_high_pct, and the average credit rate when nothing was banked.
      band_share_kw: the allocation_kw on file on the review date, the kW of the subscription's allocation filing lines that add kW less the kW of those that remove kW
      savings_pct: 'Share-size guarantee schedule: the savings percentage is the plan''s savings_rate_pct plus band_large_points when the allocation_kw on file on the review date, the kW of the subscription''s allocation filing lines that add kW less the kW of those that remove kW, is band_large_kw or more, the plan''s savings_rate_pct plus band_mid_points when it is band_mid_kw or more and below band_large_kw, and the plan''s savings_rate_pct when it is below band_mid_kw.'
      result: the guarantee credit is the shortfall multiplied by the valuation rate and by the savings percentage divided by 100, rounded half up to the cent, and a credit of 0.00 posts no billing credit
    factors:
    - id: degradation_schedule
      effect: parameter
      decides: degradation_step
      bindings:
      - contract_year_reviewed
      - degradation_step
      ladder:
      - when: the contract year reviewed is 2
        value: K('lid_step_pct')
      - when: the contract year reviewed is 3 or later and ends within the committed term (contract year reviewed times 12 at most the plan's term_months)
        value: K('step_pct')
      - when: otherwise (the contract year reviewed is 3 or later and ends after the committed term)
        value: '0'
      baseline:
        degradation_step: '0'
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: excused_statement_months
      effect: method
      decides: period_share
      bindings:
      - posting_count
      - reversal_count
      - credited_months
      - period_share
      ladder:
      - when: the credited months (measured postings less measured reversals) are fewer than excused_min_months
        method: 'no guarantee is owed for the period: the period share is 0'
      - when: the credited months are excused_min_months or more and fewer than 12
        method: 'the guarantee is prorated: the period share is the credited months divided by 12'
      - when: otherwise (the credited months are 12 or more)
        method: 'the whole year is guaranteed: the period share is 1'
      baseline:
        period_share: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: surplus_carryover
      effect: method
      decides: carried_over_kwh
      bindings:
      - prior_credited_kwh
      - carry_limit_kwh
      - prior_excess_kwh
      - carried_over_kwh
      ladder:
      - when: the most recent true-up's credited_kwh_12m exceeds its guaranteed_kwh by more than carry_cap_pct percent of that guaranteed_kwh
        method: the carried-over kWh are the limit, carry_cap_pct percent of that true-up's guaranteed_kwh
      - when: it exceeds its guaranteed_kwh by more than 0 and at most that limit
        method: the carried-over kWh are the whole excess
      - when: otherwise (that true-up shows no excess)
        method: nothing is carried over
      baseline:
        carried_over_kwh: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: banked_credit_valuation
      effect: method
      decides: valuation_rate
      bindings:
      - posted_banked
      - banked_share_pct
      - applied_rate
      - valuation_rate
      ladder:
      - when: the banked share of the measured postings is above banked_high_pct
        method: the shortfall is valued at the applied rate (credit value less banked value, per measured kWh)
      - when: the banked share is above 0 and at most banked_high_pct
        method: the shortfall is valued at the mean of the average credit rate and the applied rate
      - when: otherwise (nothing was banked)
        method: the shortfall is valued at the average credit rate
      baseline:
        valuation_rate: average_rate
      evidence:
      - history
      cross_difficulty: null
    - id: share_size_guarantee_schedule
      effect: parameter
      decides: savings_pct
      bindings:
      - band_share_kw
      - savings_pct
      ladder:
      - when: the allocation_kw on file on the review date is band_large_kw or more
        value: P('savings_rate_pct') + K('band_large_points')
      - when: it is band_mid_kw or more and below band_large_kw
        value: P('savings_rate_pct') + K('band_mid_points')
      - when: otherwise (below band_mid_kw)
        value: P('savings_rate_pct')
      baseline:
        savings_pct: P('savings_rate_pct')
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: 'For a guarantee-schedule year, and only for such a year, the measured lines are the subscription''s credit postings and credit reversals whose posted_date falls after the same calendar day twelve months before the review date and on or before the review date, the true-up records the earliest and the latest statement_month of the measured postings as its period_start_month and period_end_month, and its usage_kwh_12m is the utility account''s reported annual_usage_kwh for the twelve months ending with that latest statement month; every other contract year remains under the base rule, which reads: the review period is the twelve statement months ending with the month before the anniversary month. For a guarantee-schedule year, and only for such a year, the year''s guaranteed kWh are the guaranteed_kwh recorded on the subscription''s most recent true-up reduced by the degradation step percent and rounded half up to a whole kWh, and the guaranteed kWh for the period are the year''s guaranteed kWh multiplied by the period share and rounded half up to a whole kWh; every other contract year remains under the base rule, which reads: when production_guarantee_pct is greater than 0, guaranteed_kwh is allocation_kw on the review_date multiplied by the project''s expected_yield_kwh_per_kw and by production_guarantee_pct divided by 100, rounded half up to a whole kWh, and shortfall_kwh is guaranteed_kwh less credited_kwh_12m when positive. For a guarantee-schedule year, and only for such a year, the guarantee credit is the shortfall multiplied by the valuation rate and by the savings percentage divided by 100, rounded half up to the cent, and a credit of 0.00 posts no billing credit; every other contract year remains under the base rule, which reads: the guarantee credit is shortfall_kwh multiplied by avg_credit_rate and by savings_rate_pct divided by 100 (the savings the missing production would have earned), rounded half up to the cent. The most recent true-up is the subscription''s true-up with the latest review_date; a subscription''s true-ups close different contract years on different review dates. The contract year reviewed is the contract_year of the most recent true-up plus 1. The true-up of a guarantee-schedule year records the year''s guaranteed kWh as its guaranteed_kwh, the measured kWh as its credited_kwh_12m and the shortfall as its shortfall_kwh. The degradation step is 0. The period share is 1. The measured kWh are the credited_kwh of the measured postings less the credited_kwh of the measured reversals. The shortfall is the guaranteed kWh for the period less the measured kWh and less the carried-over kWh, and zero when that is negative; the carried-over kWh are 0. The valuation rate is the average credit rate: the credit_value of the measured postings less the credit_value of the measured reversals, divided by the measured kWh and rounded half up to four decimals, and zero when there are no measured kWh. The savings percentage is the plan''s savings_rate_pct.'
      params:
      - savings_rate_pct
      - production_guarantee_pct
    inputs:
      history:
      - table: biz_reviews
        aggregate: latest
        field: guaranteed_kwh
        filters: {}
      - table: biz_reviews
        aggregate: latest
        field: credited_kwh_12m
        filters: {}
      - table: biz_reviews
        aggregate: latest
        field: contract_year
        filters: {}
      - table: biz_credits
        aggregate: sum
        field: credited_kwh
        within_months: 12
        filters:
          event_type: biz_credit_posted
      - table: biz_credits
        aggregate: sum
        field: credit_value
        within_months: 12
        filters:
          event_type: biz_credit_posted
      - table: biz_credits
        aggregate: sum
        field: banked_value
        within_months: 12
        filters:
          event_type: biz_credit_posted
      - table: biz_credits
        aggregate: count
        field: biz_credit_id
        within_months: 12
        filters:
          event_type: biz_credit_posted
      - table: biz_credits
        aggregate: sum
        field: credited_kwh
        within_months: 12
        filters:
          event_type: biz_credit_reversed
      cross_category: []
  - id: biz_ext_decrease_amendment_fee
    base_policy_refs:
    - biz_allocation_change
    - biz_benefit_basis
    overwrite:
    - base_policy: biz_allocation_change
      superseded_clause: Subscriber decreases in one contract year up to max_decrease_pct_per_contract_year of the allocation_kw held on the first day of that contract year carry no fee (biz_msr_subscriber_decrease_kw_contract_year totals them); each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed once per decrease request on the filing's effective_date and due invoice_due_days later.
      replaced_by: 'For a decrease amendment, and only for such an amendment, the excess-decrease fee is the chargeable kW multiplied by the per-kW rate, rounded half up to the cent, assessed on the day the subscriber accepts the amendment, billed for the filing month of the decrease and due invoice_due_days later, and a fee of 0.00 writes no fee line; every other subscriber decrease remains under the base rule, which reads: subscriber decreases in one contract year up to max_decrease_pct_per_contract_year of the allocation_kw held on the first day of that contract year carry no fee (biz_msr_subscriber_decrease_kw_contract_year totals them), and each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed once per decrease request on the filing''s effective_date and due invoice_due_days later.'
    trigger: on_request
    subject:
    - biz_change_fee_assessed
    computes: excess_decrease_fee
    target_tool: accept_share_decrease_75e61509
    params:
      decline_ratio_pct: 75
      allow_combined_pct: 50
      allow_decline_pct: 40
      depth_deep_pct: 50
      depth_mid_pct: 30
      depth_deep_mult: 1.5
      depth_mid_mult: 1.25
      lead_first_mult: 0.75
      lead_second_mult: 0.9
      size_large_kw: 150
      size_mid_kw: 50
      size_large_mult: 0.8
      size_mid_mult: 0.9
    rule: 'This policy prices the excess-decrease fee of a decrease amendment: the amendment Meadowlark issues for a subscriber''s allocation-decrease request on a subscription that has exactly one allocation-decrease request with outcome received, when that request is the first subscriber-requested allocation change received in its contract year and no allocation filing line of the subscription takes effect in that contract year, and which the subscriber accepts in person; the filing month and the effective date of the decrease follow the filing calendar counted from the request''s received_date. For a decrease amendment, and only for such an amendment, the excess-decrease fee is the chargeable kW multiplied by the per-kW rate, rounded half up to the cent, assessed on the day the subscriber accepts the amendment, billed for the filing month of the decrease and due invoice_due_days later, and a fee of 0.00 writes no fee line; every other subscriber decrease remains under the base rule, which reads: subscriber decreases in one contract year up to max_decrease_pct_per_contract_year of the allocation_kw held on the first day of that contract year carry no fee (biz_msr_subscriber_decrease_kw_contract_year totals them), and each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed once per decrease request on the filing''s effective_date and due invoice_due_days later. The excess-decrease fee of a decrease amendment is fixed only after the records carry a completed true-up for every contract year of the subscription that has ended. The amended request is the subscription''s one allocation-decrease request with outcome received. The requested kW are the amended request''s requested_kw sized down to a whole multiple of the plan''s allocation_increment_kw. The share on file is the subscription''s allocation_kw on the acceptance date, which is the kW of its allocation filing lines that add kW less the kW of those that remove kW. The latest true-up is the subscription''s true-up with the latest review_date; a subscription''s true-ups close different contract years on different review dates. The allowance percentage is the plan''s max_decrease_pct_per_contract_year. The fee-free allowance is the allowance percentage of the share on file. The chargeable kW are the requested kW less the fee-free allowance and less the released kW, and zero when that is negative; the released kW are 0. The per-kW rate is the plan''s excess_decrease_fee_per_kw_usd. Usage-decline allowance: the peak usage is the highest usage_kwh_12m among the subscription''s true-ups; the allowance percentage is allow_combined_pct when the latest true-up''s usage_kwh_12m is at most decline_ratio_pct percent of the peak usage and an active garden share is filed on the same utility account, allow_decline_pct when the latest true-up''s usage_kwh_12m is at most decline_ratio_pct percent of the peak usage and no active garden share is filed on that utility account, and the plan''s max_decrease_pct_per_contract_year otherwise, including for a subscription without a true-up. Usage-matched release: on a plan whose production_guarantee_pct is greater than 0 and whose latest true-up records a guaranteed_kwh greater than 0, the expected production is that guaranteed_kwh divided by the plan''s production_guarantee_pct percent, and the usage-matched share is the share on file multiplied by that true-up''s usage_kwh_12m and divided by the expected production (whole months are counted as calendar months, a month becoming whole when the later date''s day of the month reaches the earlier date''s day of the month, with no other month-end adjustment). When the latest true-up was completed fewer than twelve whole months before the acceptance date and the expected production exceeds oversize_review_threshold_pct percent of its usage_kwh_12m, the released kW are the share on file less the largest whole multiple of allocation_increment_kw whose expected production, at the expected production per kW of the share on file, does not exceed resize_target_pct percent of that usage_kwh_12m, that multiple never taken below the plan''s min_allocation_kw (the kW the annual right-size would remove); when the latest true-up was completed fewer than twelve whole months before the acceptance date and the expected production exceeds its usage_kwh_12m but not oversize_review_threshold_pct percent of it, the released kW are half of the share on file less the usage-matched share; and otherwise, including a latest true-up completed earlier, a plan whose production_guarantee_pct is 0 or a share whose expected production does not exceed the usage, the released kW are 0. Term-position proration: the per-kW rate is 0.00 when the acceptance date is after the term_end_date, the plan''s excess_decrease_fee_per_kw_usd multiplied by the whole months from the acceptance date to the term_end_date and divided by 12 when fewer than twelve whole months separate them (whole months are counted as calendar months, a month becoming whole when the later date''s day of the month reaches the earlier date''s day of the month, with no other month-end adjustment), and the plan''s excess_decrease_fee_per_kw_usd otherwise, including on a plan whose term_months is 0. Change-depth multiplier: the per-kW rate is multiplied by depth_deep_mult when the requested kW are more than depth_deep_pct percent of the share on file, by depth_mid_mult when they are more than depth_mid_pct percent and at most depth_deep_pct percent of it, and by 1 when they are at most depth_mid_pct percent of it. Contract-year timing multiplier: the months into the contract year are the whole months from the activation_date to the amended request''s received_date (whole months are counted as calendar months, a month becoming whole when the later date''s day of the month reaches the earlier date''s day of the month, with no other month-end adjustment), less 12 for every whole contract year in them; the per-kW rate is multiplied by lead_first_mult when the months into the contract year are 0, by lead_second_mult when they are 1 or 2, and by 1 when they are 3 or more. Share-size multiplier: the per-kW rate is multiplied by size_large_mult when the share on file is size_large_kw or more, by size_mid_mult when the share on file is size_mid_kw or more and below size_large_kw, and by 1 when the share on file is below size_mid_kw. Each adjustment acts on the quantity it names in the standard method: a replacement of the per-kW rate applies before the multipliers of the per-kW rate, the multipliers apply together to that rate, and the released kW are deducted before the chargeable kW''s zero floor.'
    prerequisite:
    - problem: biz_ext_guarantee_trueup
      kind: value_input
      gate: latest_usage_kwh
      form: state
      policy_source: The excess-decrease fee of a decrease amendment is fixed only after the records carry a completed true-up for every contract year of the subscription that has ended.
      condition: biz_reviews carries a biz_trueup_completed row for the subscription for every contract year whose anniversary (activation_date plus 12 months per year) is on or before the acceptance date.
      resolved_by: complete_guarantee_trueup_bd5f1ac2
      effect: The completed true-up of the ended contract year becomes the latest true-up, so the usage_kwh_12m, guaranteed_kwh and review_date this policy reads are that year's; the allowance percentage and the released kW are measured on them.
    cross_category:
    - category: garden
      as: branch
      reads:
      - allocation_kw
      - status
      - utility_account_id
      note: the usage-decline allowance tier is chosen by whether an active garden share is filed on the same utility account.
    compute:
    - requested_kw: LATEST('biz_requests', 'requested_kw', date_field='received_date', request_type='allocation_decrease', outcome='received')
    - decrease_kw: int(requested_kw / P('allocation_increment_kw')) * P('allocation_increment_kw')
    - share_kw: F('allocation_kw')
    - latest_usage_kwh: LATEST('biz_reviews', 'usage_kwh_12m', date_field='review_date') or 0
    - peak_usage_kwh: MAX('biz_reviews', 'usage_kwh_12m')
    - garden_kw: CFIELD('garden', 'allocation_kw', utility_account_id=F('utility_account_id'), status='active') or 0
    - allowance_pct: K('allow_combined_pct') if (peak_usage_kwh > 0 and latest_usage_kwh * 100 <= peak_usage_kwh * K('decline_ratio_pct') and garden_kw > 0) else (K('allow_decline_pct') if (peak_usage_kwh > 0 and latest_usage_kwh * 100 <= peak_usage_kwh * K('decline_ratio_pct') and garden_kw == 0) else P('max_decrease_pct_per_contract_year'))
    - allowance_kw: share_kw * allowance_pct / 100
    - latest_guaranteed_kwh: LATEST('biz_reviews', 'guaranteed_kwh', date_field='review_date') or 0
    - latest_review_date: LATEST('biz_reviews', 'review_date', date_field='review_date')
    - expected_kwh: latest_guaranteed_kwh * 100 / P('production_guarantee_pct') if P('production_guarantee_pct') > 0 else 0
    - released_kw: 0 if (expected_kwh <= 0 or latest_usage_kwh <= 0 or MONTHS(latest_review_date, NOW) >= 12) else (share_kw - MX(P('min_allocation_kw'), int(latest_usage_kwh * P('resize_target_pct') / 100 / (expected_kwh / share_kw) / P('allocation_increment_kw')) * P('allocation_increment_kw')) if expected_kwh * 100 > latest_usage_kwh * P('oversize_review_threshold_pct') else ((share_kw - share_kw * latest_usage_kwh / expected_kwh) / 2 if expected_kwh > latest_usage_kwh else 0))
    - chargeable_kw: MX(0, decrease_kw - allowance_kw - released_kw)
    - term_rate: 0 if (P('term_months') > 0 and DAYS(F('term_end_date'), NOW) > 0) else (P('excess_decrease_fee_per_kw_usd') * MONTHS(NOW, F('term_end_date')) / 12 if (P('term_months') > 0 and MONTHS(NOW, F('term_end_date')) < 12) else P('excess_decrease_fee_per_kw_usd'))
    - depth_pct: decrease_kw * 100 / (SUM('biz_allocations', 'kw', event_type='biz_allocation_filed') - SUM('biz_allocations', 'kw', event_type='biz_allocation_reduced'))
    - depth_mult: K('depth_deep_mult') if depth_pct > K('depth_deep_pct') else (K('depth_mid_mult') if depth_pct > K('depth_mid_pct') else 1)
    - request_received: LATEST('biz_requests', 'received_date', date_field='received_date', request_type='allocation_decrease', outcome='received')
    - months_into_year: MONTHS(F('activation_date'), request_received) % 12
    - lead_mult: K('lead_first_mult') if months_into_year == 0 else (K('lead_second_mult') if months_into_year <= 2 else 1)
    - size_share_kw: SUM('biz_allocations', 'kw', event_type='biz_allocation_filed') - SUM('biz_allocations', 'kw', event_type='biz_allocation_reduced')
    - size_mult: K('size_large_mult') if size_share_kw >= K('size_large_kw') else (K('size_mid_mult') if size_share_kw >= K('size_mid_kw') else 1)
    - per_kw_rate: term_rate * depth_mult * lead_mult * size_mult
    - result: RND(chargeable_kw * per_kw_rate + 0.000000001, 2)
    compute_basis:
      requested_kw: The amended request is the subscription's one allocation-decrease request with outcome received.
      decrease_kw: The requested kW are the amended request's requested_kw sized down to a whole multiple of the plan's allocation_increment_kw.
      share_kw: The share on file is the subscription's allocation_kw on the acceptance date, which is the kW of its allocation filing lines that add kW less the kW of those that remove kW.
      latest_usage_kwh: The latest true-up is the subscription's true-up with the latest review_date; a subscription's true-ups close different contract years on different review dates.
      peak_usage_kwh: the peak usage is the highest usage_kwh_12m among the subscription's true-ups
      garden_kw: an active garden share is filed on the same utility account
      allowance_pct: the allowance percentage is allow_combined_pct when the latest true-up's usage_kwh_12m is at most decline_ratio_pct percent of the peak usage and an active garden share is filed on the same utility account, allow_decline_pct when the latest true-up's usage_kwh_12m is at most decline_ratio_pct percent of the peak usage and no active garden share is filed on that utility account, and the plan's max_decrease_pct_per_contract_year otherwise, including for a subscription without a true-up.
      allowance_kw: The fee-free allowance is the allowance percentage of the share on file.
      latest_guaranteed_kwh: whose latest true-up records a guaranteed_kwh greater than 0
      latest_review_date: When the latest true-up was completed fewer than twelve whole months before the acceptance date
      expected_kwh: the expected production is that guaranteed_kwh divided by the plan's production_guarantee_pct percent
      released_kw: When the latest true-up was completed fewer than twelve whole months before the acceptance date and the expected production exceeds oversize_review_threshold_pct percent of its usage_kwh_12m, the released kW are the share on file less the largest whole multiple of allocation_increment_kw whose expected production, at the expected production per kW of the share on file, does not exceed resize_target_pct percent of that usage_kwh_12m, that multiple never taken below the plan's min_allocation_kw (the kW the annual right-size would remove); when the latest true-up was completed fewer than twelve whole months before the acceptance date and the expected production exceeds its usage_kwh_12m but not oversize_review_threshold_pct percent of it, the released kW are half of the share on file less the usage-matched share; and otherwise, including a latest true-up completed earlier, a plan whose production_guarantee_pct is 0 or a share whose expected production does not exceed the usage, the released kW are 0.
      chargeable_kw: The chargeable kW are the requested kW less the fee-free allowance and less the released kW, and zero when that is negative; the released kW are 0.
      term_rate: 'Term-position proration: the per-kW rate is 0.00 when the acceptance date is after the term_end_date, the plan''s excess_decrease_fee_per_kw_usd multiplied by the whole months from the acceptance date to the term_end_date and divided by 12 when fewer than twelve whole months separate them (whole months are counted as calendar months, a month becoming whole when the later date''s day of the month reaches the earlier date''s day of the month, with no other month-end adjustment), and the plan''s excess_decrease_fee_per_kw_usd otherwise, including on a plan whose term_months is 0.'
      depth_pct: when the requested kW are more than depth_deep_pct percent of the share on file
      depth_mult: 'Change-depth multiplier: the per-kW rate is multiplied by depth_deep_mult when the requested kW are more than depth_deep_pct percent of the share on file, by depth_mid_mult when they are more than depth_mid_pct percent and at most depth_deep_pct percent of it, and by 1 when they are at most depth_mid_pct percent of it.'
      request_received: the months into the contract year are the whole months from the activation_date to the amended request's received_date (whole months are counted as calendar months, a month becoming whole when the later date's day of the month reaches the earlier date's day of the month, with no other month-end adjustment), less 12 for every whole contract year in them
      months_into_year: the months into the contract year are the whole months from the activation_date to the amended request's received_date (whole months are counted as calendar months, a month becoming whole when the later date's day of the month reaches the earlier date's day of the month, with no other month-end adjustment), less 12 for every whole contract year in them
      lead_mult: the per-kW rate is multiplied by lead_first_mult when the months into the contract year are 0, by lead_second_mult when they are 1 or 2, and by 1 when they are 3 or more.
      size_share_kw: which is the kW of its allocation filing lines that add kW less the kW of those that remove kW
      size_mult: 'Share-size multiplier: the per-kW rate is multiplied by size_large_mult when the share on file is size_large_kw or more, by size_mid_mult when the share on file is size_mid_kw or more and below size_large_kw, and by 1 when the share on file is below size_mid_kw.'
      per_kw_rate: a replacement of the per-kW rate applies before the multipliers of the per-kW rate, the multipliers apply together to that rate
      result: the excess-decrease fee is the chargeable kW multiplied by the per-kW rate, rounded half up to the cent
    factors:
    - id: usage_decline_allowance
      effect: parameter
      decides: allowance_pct
      bindings:
      - peak_usage_kwh
      - garden_kw
      - allowance_pct
      ladder:
      - when: the latest true-up's usage_kwh_12m is at most decline_ratio_pct percent of the peak usage AND an active garden share is filed on the same utility account
        value: K('allow_combined_pct')
      - when: the latest true-up's usage_kwh_12m is at most decline_ratio_pct percent of the peak usage AND no active garden share is filed on that utility account
        value: K('allow_decline_pct')
      - when: otherwise, including a subscription without a true-up
        value: P('max_decrease_pct_per_contract_year')
      baseline:
        allowance_pct: P('max_decrease_pct_per_contract_year')
      evidence:
      - history
      - cross_category
      cross_difficulty: garden
    - id: usage_matched_release
      effect: method
      decides: released_kw
      bindings:
      - latest_guaranteed_kwh
      - latest_review_date
      - expected_kwh
      - released_kw
      ladder:
      - when: the latest true-up was completed fewer than twelve whole months before the acceptance date AND its expected production exceeds oversize_review_threshold_pct percent of its usage_kwh_12m
        method: the released kW are the kW the annual right-size would remove (share on file less the largest increment multiple within resize_target_pct of usage, never below min_allocation_kw)
      - when: the latest true-up was completed fewer than twelve whole months before the acceptance date AND its expected production exceeds its usage_kwh_12m but not oversize_review_threshold_pct percent of it
        method: the released kW are half of the share on file less the usage-matched share
      - when: otherwise (an older true-up, a plan without a guarantee, or a share not above its usage)
        method: no kW are released
      baseline:
        released_kw: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: term_position_proration
      effect: method
      decides: term_rate
      bindings:
      - term_rate
      ladder:
      - when: the acceptance date is after the term_end_date
        method: no fee per kW is charged (0.00)
      - when: fewer than twelve whole months separate the acceptance date from the term_end_date
        method: the plan's excess_decrease_fee_per_kw_usd is prorated by the whole months left divided by 12
      - when: otherwise, including a plan whose term_months is 0
        method: the plan's excess_decrease_fee_per_kw_usd in full
      baseline:
        term_rate: P('excess_decrease_fee_per_kw_usd')
      evidence:
      - date
      - tier_param
      cross_difficulty: null
    - id: change_depth_multiplier
      effect: parameter
      decides: depth_mult
      bindings:
      - depth_pct
      - depth_mult
      ladder:
      - when: the requested kW are more than depth_deep_pct percent of the share on file
        value: K('depth_deep_mult')
      - when: the requested kW are more than depth_mid_pct percent and at most depth_deep_pct percent of the share on file
        value: K('depth_mid_mult')
      - when: otherwise (at most depth_mid_pct percent)
        value: '1'
      baseline:
        depth_mult: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: contract_year_timing_multiplier
      effect: parameter
      decides: lead_mult
      bindings:
      - request_received
      - months_into_year
      - lead_mult
      ladder:
      - when: the months into the contract year at the amended request's received_date are 0
        value: K('lead_first_mult')
      - when: they are 1 or 2
        value: K('lead_second_mult')
      - when: otherwise (3 or more)
        value: '1'
      baseline:
        lead_mult: '1'
      evidence:
      - date
      - history
      cross_difficulty: null
    - id: share_size_multiplier
      effect: parameter
      decides: size_mult
      bindings:
      - size_share_kw
      - size_mult
      ladder:
      - when: the share on file is size_large_kw or more
        value: K('size_large_mult')
      - when: the share on file is size_mid_kw or more and below size_large_kw
        value: K('size_mid_mult')
      - when: otherwise (below size_mid_kw)
        value: '1'
      baseline:
        size_mult: '1'
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: 'For a decrease amendment, and only for such an amendment, the excess-decrease fee is the chargeable kW multiplied by the per-kW rate, rounded half up to the cent, assessed on the day the subscriber accepts the amendment, billed for the filing month of the decrease and due invoice_due_days later, and a fee of 0.00 writes no fee line; every other subscriber decrease remains under the base rule, which reads: subscriber decreases in one contract year up to max_decrease_pct_per_contract_year of the allocation_kw held on the first day of that contract year carry no fee (biz_msr_subscriber_decrease_kw_contract_year totals them), and each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed once per decrease request on the filing''s effective_date and due invoice_due_days later. The amended request is the subscription''s one allocation-decrease request with outcome received. The requested kW are the amended request''s requested_kw sized down to a whole multiple of the plan''s allocation_increment_kw. The share on file is the subscription''s allocation_kw on the acceptance date, which is the kW of its allocation filing lines that add kW less the kW of those that remove kW. The allowance percentage is the plan''s max_decrease_pct_per_contract_year. The fee-free allowance is the allowance percentage of the share on file. The chargeable kW are the requested kW less the fee-free allowance and less the released kW, and zero when that is negative; the released kW are 0. The per-kW rate is the plan''s excess_decrease_fee_per_kw_usd.'
      params:
      - max_decrease_pct_per_contract_year
      - excess_decrease_fee_per_kw_usd
      - allocation_increment_kw
      - invoice_due_days
    inputs:
      history:
      - table: biz_requests
        aggregate: latest
        field: requested_kw
        filters:
          request_type: allocation_decrease
          outcome: received
      - table: biz_reviews
        aggregate: latest
        field: usage_kwh_12m
        filters: {}
      - table: biz_reviews
        aggregate: max
        field: usage_kwh_12m
        filters: {}
      - table: biz_reviews
        aggregate: latest
        field: guaranteed_kwh
        filters: {}
      cross_category:
      - garden
  - id: biz_ext_late_statement_estimate
    base_policy_refs:
    - biz_evt_subscription_charge
    - biz_benefit_basis
    overwrite:
    - base_policy: biz_evt_subscription_charge
      superseded_clause: 'Estimates: when estimated_billing_allowed is true and no credit has posted for a statement month estimate_wait_days calendar days after that month ends, an estimated charge equal to the average of the last estimate_basis_months actual charges, rounded half up to the cent, may be billed with charge_basis estimated and no credit reference; no more than max_consecutive_estimates estimates may be billed in a row (the run is measured by biz_msr_consecutive_estimates).'
      replaced_by: 'For an estimated charge, and only for such a charge, when estimated_billing_allowed is true and no credit has posted for a statement month estimate_wait_days calendar days after that month ends, the estimated charge this policy prices may be billed with charge_basis estimated and no credit reference, is invoiced on the day it is billed and falls due invoice_due_days later, and no more than max_consecutive_estimates estimates may be billed in a row (the run is measured by biz_msr_consecutive_estimates); every other charge remains under the base rule, which reads: estimates: when estimated_billing_allowed is true and no credit has posted for a statement month estimate_wait_days calendar days after that month ends, an estimated charge equal to the average of the last estimate_basis_months actual charges, rounded half up to the cent, may be billed with charge_basis estimated and no credit reference; no more than max_consecutive_estimates estimates may be billed in a row (the run is measured by biz_msr_consecutive_estimates).'
    trigger: state_due
    subject:
    - biz_charge_billed
    computes: estimated_charge
    target_tool: bill_statement_estimate_b08e308f
    params:
      decline_first_pct: 2.0
      decline_later_pct: 0.5
    rule: 'This policy prices the estimated charge Meadowlark bills for a statement month of a billable subscription when estimated_billing_allowed is true and no credit has posted for that month estimate_wait_days calendar days after it ended. For an estimated charge, and only for such a charge, when estimated_billing_allowed is true and no credit has posted for a statement month estimate_wait_days calendar days after that month ends, the estimated charge this policy prices may be billed with charge_basis estimated and no credit reference, is invoiced on the day it is billed and falls due invoice_due_days later, and no more than max_consecutive_estimates estimates may be billed in a row (the run is measured by biz_msr_consecutive_estimates); every other charge remains under the base rule, which reads: estimates: when estimated_billing_allowed is true and no credit has posted for a statement month estimate_wait_days calendar days after that month ends, an estimated charge equal to the average of the last estimate_basis_months actual charges, rounded half up to the cent, may be billed with charge_basis estimated and no credit reference; no more than max_consecutive_estimates estimates may be billed in a row (the run is measured by biz_msr_consecutive_estimates). The basis window holds the subscription''s credit postings and credit reversals whose posted_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today; its kWh are the credited_kwh of its postings less the credited_kwh of its reversals, its credit value is the credit_value of its postings less that of its reversals, and its count is the number of its postings less the number of its reversals. The estimated kWh are the basis window''s kWh divided by its count, and 0 when its count is 0. The estimate rate is the basis window''s credit value divided by its kWh, and 0 when it has no kWh. The estimated charge is the estimated kWh multiplied by the estimate rate and by (100 minus the plan''s savings_rate_pct) divided by 100, rounded half up to the cent; no estimate is billed when it is 0.00. The latest posting date is the most recent posted_date of the subscription''s credit postings, and the latest posting kWh are the credited_kwh of its postings on that date together. The reviewed monthly production is the credited_kwh_12m of the subscription''s true-up with the latest review_date divided by 12, and 0 when no true-up is on file; a subscription''s true-ups close different contract years on different review dates. Estimating method: the year-earlier window holds the subscription''s credit postings and credit reversals whose posted_date falls after the same calendar day estimate_basis_months plus 12 months before today and on or before the same calendar day 12 months before today (the last day of that month when it has no such day), its kWh and count netted as in the basis window; when the basis window''s count is below estimate_basis_months and the year-earlier window''s count is one or more, the estimated kWh are the kWh of the basis window and of the year-earlier window together divided by their counts together; when the basis window''s count is below estimate_basis_months, the year-earlier window''s count is 0 and a true-up is on file, the estimated kWh are the reviewed monthly production; and otherwise the estimated kWh are the basis window''s kWh divided by its count, and 0 when its count is 0. Current-tariff rate: the latest posting rate is the credit_value of the subscription''s postings on the latest posting date divided by their credited_kwh; when the basis window''s count is 0 and the subscription has a credit posting, the estimate rate is the latest posting rate; when the basis window''s count is 0 and the subscription has no credit posting, the estimate rate is the avg_credit_rate of its true-up with the latest review_date, and 0 when no true-up is on file; and otherwise the estimate rate is the basis window''s credit value divided by its kWh. Share restatement: the share on file for the estimate is the kW of the subscription''s allocation filing lines that add kW less the kW of those that remove kW, the restatement period runs from after the same calendar day 12 months before today (the last day of that month when it has no such day) to today inclusive, and the share 12 months back is the share on file for the estimate less the kW of adding lines and plus the kW of removing lines whose effective_date falls in the restatement period; when filing lines took effect in the restatement period and the share 12 months back is more than 0, the estimated kWh are multiplied by the share on file for the estimate divided by the share 12 months back; when filing lines took effect in the restatement period and the share 12 months back is 0, they are multiplied by the share on file for the estimate divided by the kW of the subscription''s initial filing line; and when no filing line took effect in the restatement period, they are multiplied by 1. Production-decline restatement: when the basis window''s count is below estimate_basis_months and a true-up of the subscription for contract year 1 has a review_date after the same calendar day 12 months before today (the last day of that month when it has no such day) and on or before today, the estimated kWh are multiplied by (100 minus decline_first_pct) divided by 100; when the basis window''s count is below estimate_basis_months and a true-up of a later contract year has a review_date in that period, they are multiplied by (100 minus decline_later_pct) divided by 100; and otherwise they are multiplied by 1. Sister-garden index: the recent garden postings are the credit postings of the customer''s garden shares on the subscription''s utility account whose posted_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today, and the earlier garden postings are those whose posted_date falls after the same calendar day estimate_basis_months plus 12 months before today and on or before the same calendar day 12 months before today; when there are recent and earlier garden postings, the estimated kWh are multiplied by the average credited_kwh per recent garden posting divided by the average credited_kwh per earlier garden posting; when there are earlier garden postings and no recent one, they are multiplied by the average credited_kwh of the garden postings with the latest posted_date divided by the average credited_kwh per earlier garden posting; and otherwise they are multiplied by 1. Outstanding-estimate blend: the outstanding estimates are the subscription''s estimated charges whose bill_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today; when there are two or more outstanding estimates and a true-up is on file, the estimated kWh are replaced by the average of themselves and the lower of the reviewed monthly production and the latest posting kWh; when there is exactly one outstanding estimate and a true-up is on file, they are replaced by the average of themselves and the reviewed monthly production; and otherwise they are not blended. The adjustments act on the standard method''s quantities as each states: the multiplications of the estimated kWh apply together, a blend of the estimated kWh applies after them, and the estimated charge then values the result at the estimate rate and is rounded once.'
    prerequisite: []
    cross_category:
    - category: garden
      as: history
      reads:
      - garden_credits.credited_kwh
      - garden_credits.posted_date
      - garden_credits.utility_account_id
      note: the sister-garden index compares the credited kWh of the customer's garden shares on the same utility account in the recent and earlier windows.
    compute:
    - w_kwh: (SUM('biz_credits', 'credited_kwh', within_months=P('estimate_basis_months'), date_field='posted_date', event_type='biz_credit_posted') - SUM('biz_credits', 'credited_kwh', within_months=P('estimate_basis_months'), date_field='posted_date', event_type='biz_credit_reversed'))
    - w_value: (SUM('biz_credits', 'credit_value', within_months=P('estimate_basis_months'), date_field='posted_date', event_type='biz_credit_posted') - SUM('biz_credits', 'credit_value', within_months=P('estimate_basis_months'), date_field='posted_date', event_type='biz_credit_reversed'))
    - w_count: (COUNT('biz_credits', within_months=P('estimate_basis_months'), date_field='posted_date', event_type='biz_credit_posted') - COUNT('biz_credits', within_months=P('estimate_basis_months'), date_field='posted_date', event_type='biz_credit_reversed'))
    - latest_post_date: LATEST('biz_credits', 'posted_date', date_field='posted_date', event_type='biz_credit_posted')
    - latest_post_kwh: SUM('biz_credits', 'credited_kwh', event_type='biz_credit_posted', posted_date=latest_post_date) if latest_post_date else 0
    - review_count: COUNT('biz_reviews', event_type='biz_trueup_completed')
    - reviewed_monthly: (LATEST('biz_reviews', 'credited_kwh_12m', date_field='review_date', event_type='biz_trueup_completed') or 0) / 12
    - y_kwh: (SUM('biz_credits', 'credited_kwh', within_months=P('estimate_basis_months') + 12, date_field='posted_date', event_type='biz_credit_posted') - SUM('biz_credits', 'credited_kwh', within_months=P('estimate_basis_months') + 12, date_field='posted_date', event_type='biz_credit_reversed')) - (SUM('biz_credits', 'credited_kwh', within_months=12, date_field='posted_date', event_type='biz_credit_posted') - SUM('biz_credits', 'credited_kwh', within_months=12, date_field='posted_date', event_type='biz_credit_reversed'))
    - y_count: (COUNT('biz_credits', within_months=P('estimate_basis_months') + 12, date_field='posted_date', event_type='biz_credit_posted') - COUNT('biz_credits', within_months=P('estimate_basis_months') + 12, date_field='posted_date', event_type='biz_credit_reversed')) - (COUNT('biz_credits', within_months=12, date_field='posted_date', event_type='biz_credit_posted') - COUNT('biz_credits', within_months=12, date_field='posted_date', event_type='biz_credit_reversed'))
    - estimated_kwh: (w_kwh + y_kwh) / (w_count + y_count) if (w_count < P('estimate_basis_months') and y_count >= 1) else (reviewed_monthly if (w_count < P('estimate_basis_months') and review_count >= 1) else (w_kwh / w_count if w_count > 0 else 0))
    - latest_post_rate: (SUM('biz_credits', 'credit_value', event_type='biz_credit_posted', posted_date=latest_post_date) / latest_post_kwh) if latest_post_kwh > 0 else 0
    - trueup_rate: LATEST('biz_reviews', 'avg_credit_rate', date_field='review_date', event_type='biz_trueup_completed') or 0
    - estimate_rate: latest_post_rate if (w_count <= 0 and latest_post_kwh > 0) else (trueup_rate if w_count <= 0 else (w_value / w_kwh if w_kwh > 0 else 0))
    - share_now: SUM('biz_allocations', 'kw', event_type='biz_allocation_filed') - SUM('biz_allocations', 'kw', event_type='biz_allocation_reduced')
    - moved_12: SUM('biz_allocations', 'kw', within_months=12, date_field='effective_date', event_type='biz_allocation_filed') - SUM('biz_allocations', 'kw', within_months=12, date_field='effective_date', event_type='biz_allocation_reduced')
    - lines_12: COUNT('biz_allocations', within_months=12, date_field='effective_date', event_type='biz_allocation_filed') + COUNT('biz_allocations', within_months=12, date_field='effective_date', event_type='biz_allocation_reduced')
    - initial_kw: SUM('biz_allocations', 'kw', event_type='biz_allocation_filed', filing_reason='initial')
    - share_adjustment: share_now / (share_now - moved_12) if (lines_12 > 0 and share_now - moved_12 > 0) else ((share_now / initial_kw if initial_kw > 0 else 1) if lines_12 > 0 else 1)
    - first_year_reviews: COUNT('biz_reviews', within_months=12, date_field='review_date', event_type='biz_trueup_completed', contract_year=1)
    - later_reviews: COUNT('biz_reviews', within_months=12, date_field='review_date', event_type='biz_trueup_completed') - first_year_reviews
    - decline_pct: K('decline_first_pct') if (w_count < P('estimate_basis_months') and first_year_reviews >= 1) else (K('decline_later_pct') if (w_count < P('estimate_basis_months') and later_reviews >= 1) else 0)
    - g_w_kwh: XSUM('garden', 'garden_credits', 'credited_kwh', within_months=P('estimate_basis_months'), date_field='posted_date', event_type='garden_credit_posted', utility_account_id=F('utility_account_id'))
    - g_w_count: XCOUNT('garden', 'garden_credits', within_months=P('estimate_basis_months'), date_field='posted_date', event_type='garden_credit_posted', utility_account_id=F('utility_account_id'))
    - g_y_kwh: XSUM('garden', 'garden_credits', 'credited_kwh', within_months=P('estimate_basis_months') + 12, date_field='posted_date', event_type='garden_credit_posted', utility_account_id=F('utility_account_id')) - XSUM('garden', 'garden_credits', 'credited_kwh', within_months=12, date_field='posted_date', event_type='garden_credit_posted', utility_account_id=F('utility_account_id'))
    - g_y_count: XCOUNT('garden', 'garden_credits', within_months=P('estimate_basis_months') + 12, date_field='posted_date', event_type='garden_credit_posted', utility_account_id=F('utility_account_id')) - XCOUNT('garden', 'garden_credits', within_months=12, date_field='posted_date', event_type='garden_credit_posted', utility_account_id=F('utility_account_id'))
    - g_latest_date: XLATEST('garden', 'garden_credits', 'posted_date', date_field='posted_date', event_type='garden_credit_posted', utility_account_id=F('utility_account_id'))
    - g_latest_avg: (XSUM('garden', 'garden_credits', 'credited_kwh', event_type='garden_credit_posted', utility_account_id=F('utility_account_id'), posted_date=g_latest_date) / XCOUNT('garden', 'garden_credits', event_type='garden_credit_posted', utility_account_id=F('utility_account_id'), posted_date=g_latest_date)) if g_latest_date else 0
    - garden_index: ((g_w_kwh / g_w_count) / (g_y_kwh / g_y_count)) if (g_w_count >= 1 and g_y_count >= 1) else ((g_latest_avg / (g_y_kwh / g_y_count)) if (g_y_count >= 1 and g_y_kwh > 0) else 1)
    - open_estimates: COUNT('biz_billing', within_months=P('estimate_basis_months'), date_field='bill_date', event_type='biz_charge_billed', charge_basis='estimated')
    - blend_kwh: MN(reviewed_monthly, latest_post_kwh) if (open_estimates >= 2 and review_count >= 1) else (reviewed_monthly if (open_estimates == 1 and review_count >= 1) else 0)
    - adjusted_kwh: estimated_kwh * share_adjustment * (100 - decline_pct) / 100 * garden_index
    - blended_kwh: (adjusted_kwh + blend_kwh) / 2 if blend_kwh > 0 else adjusted_kwh
    - result: RND(blended_kwh * estimate_rate * (100 - P('savings_rate_pct')) / 100 + 0.000000001, 2)
    compute_basis:
      w_kwh: The basis window holds the subscription's credit postings and credit reversals whose posted_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today; its kWh are the credited_kwh of its postings less the credited_kwh of its reversals, its credit value is the credit_value of its postings less that of its reversals, and its count is the number of its postings less the number of its reversals.
      w_value: The basis window holds the subscription's credit postings and credit reversals whose posted_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today; its kWh are the credited_kwh of its postings less the credited_kwh of its reversals, its credit value is the credit_value of its postings less that of its reversals, and its count is the number of its postings less the number of its reversals.
      w_count: The basis window holds the subscription's credit postings and credit reversals whose posted_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today; its kWh are the credited_kwh of its postings less the credited_kwh of its reversals, its credit value is the credit_value of its postings less that of its reversals, and its count is the number of its postings less the number of its reversals.
      latest_post_date: The latest posting date is the most recent posted_date of the subscription's credit postings
      latest_post_kwh: the latest posting kWh are the credited_kwh of its postings on that date together
      review_count: The reviewed monthly production is the credited_kwh_12m of the subscription's true-up with the latest review_date divided by 12, and 0 when no true-up is on file
      reviewed_monthly: The reviewed monthly production is the credited_kwh_12m of the subscription's true-up with the latest review_date divided by 12, and 0 when no true-up is on file
      y_kwh: the year-earlier window holds the subscription's credit postings and credit reversals whose posted_date falls after the same calendar day estimate_basis_months plus 12 months before today and on or before the same calendar day 12 months before today (the last day of that month when it has no such day), its kWh and count netted as in the basis window
      y_count: the year-earlier window holds the subscription's credit postings and credit reversals whose posted_date falls after the same calendar day estimate_basis_months plus 12 months before today and on or before the same calendar day 12 months before today (the last day of that month when it has no such day), its kWh and count netted as in the basis window
      estimated_kwh: when the basis window's count is below estimate_basis_months and the year-earlier window's count is one or more, the estimated kWh are the kWh of the basis window and of the year-earlier window together divided by their counts together; when the basis window's count is below estimate_basis_months, the year-earlier window's count is 0 and a true-up is on file, the estimated kWh are the reviewed monthly production; and otherwise the estimated kWh are the basis window's kWh divided by its count, and 0 when its count is 0.
      latest_post_rate: the latest posting rate is the credit_value of the subscription's postings on the latest posting date divided by their credited_kwh
      trueup_rate: the estimate rate is the avg_credit_rate of its true-up with the latest review_date, and 0 when no true-up is on file
      estimate_rate: when the basis window's count is 0 and the subscription has a credit posting, the estimate rate is the latest posting rate; when the basis window's count is 0 and the subscription has no credit posting, the estimate rate is the avg_credit_rate of its true-up with the latest review_date, and 0 when no true-up is on file; and otherwise the estimate rate is the basis window's credit value divided by its kWh.
      share_now: the share on file for the estimate is the kW of the subscription's allocation filing lines that add kW less the kW of those that remove kW
      moved_12: the share 12 months back is the share on file for the estimate less the kW of adding lines and plus the kW of removing lines whose effective_date falls in the restatement period
      lines_12: the restatement period runs from after the same calendar day 12 months before today (the last day of that month when it has no such day) to today inclusive
      initial_kw: the kW of the subscription's initial filing line; and when no filing line took effect in the restatement period, they are multiplied by 1.
      share_adjustment: when filing lines took effect in the restatement period and the share 12 months back is more than 0, the estimated kWh are multiplied by the share on file for the estimate divided by the share 12 months back; when filing lines took effect in the restatement period and the share 12 months back is 0, they are multiplied by the share on file for the estimate divided by the kW of the subscription's initial filing line; and when no filing line took effect in the restatement period, they are multiplied by 1.
      first_year_reviews: a true-up of the subscription for contract year 1 has a review_date after the same calendar day 12 months before today (the last day of that month when it has no such day) and on or before today
      later_reviews: a true-up of a later contract year has a review_date in that period
      decline_pct: 'Production-decline restatement: when the basis window''s count is below estimate_basis_months and a true-up of the subscription for contract year 1 has a review_date after the same calendar day 12 months before today (the last day of that month when it has no such day) and on or before today, the estimated kWh are multiplied by (100 minus decline_first_pct) divided by 100; when the basis window''s count is below estimate_basis_months and a true-up of a later contract year has a review_date in that period, they are multiplied by (100 minus decline_later_pct) divided by 100; and otherwise they are multiplied by 1.'
      g_w_kwh: the recent garden postings are the credit postings of the customer's garden shares on the subscription's utility account whose posted_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today
      g_w_count: the recent garden postings are the credit postings of the customer's garden shares on the subscription's utility account whose posted_date falls after the same calendar day estimate_basis_months months before today (the last day of that month when it has no such day) and on or before today
      g_y_kwh: the earlier garden postings are those whose posted_date falls after the same calendar day estimate_basis_months plus 12 months before today
      g_y_count: the earlier garden postings are those whose posted_date falls after the same calendar day estimate_basis_months plus 12 months before today
