    prerequisite: []
    cross_category:
    - category: home
      as: history
      reads:
      - home_allocations.kw
      - home_allocations.filing_month
      - home_allocations.home_sub_id
      - variant_name
      note: line_switch_credit tier from residential initial filings in the removal filing month
    - category: biz
      as: history
      reads:
      - biz_allocations.kw
      - biz_allocations.filing_month
      - biz_allocations.biz_sub_id
      - variant_name
      note: line_switch_credit tier from small business initial filings in the removal filing month
    compute:
    - closing_date: F('closed_date')
    - request_date: F('notice_date') or LATEST('garden_requests','received_date', date_field='received_date', request_type='move_transfer')
        or ''
    - removal_kw: SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='cancellation_removal')
        + SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='move_removal') + SUM('garden_allocations','kw',
        event_type='garden_allocation_reduced', filing_reason='nonpayment_removal')
    - removal_month: LATEST('garden_allocations','filing_month', date_field='effective_date', event_type='garden_allocation_reduced',
        filing_reason='cancellation_removal') or LATEST('garden_allocations','filing_month', date_field='effective_date',
        event_type='garden_allocation_reduced', filing_reason='move_removal') or LATEST('garden_allocations','filing_month',
        date_field='effective_date', event_type='garden_allocation_reduced', filing_reason='nonpayment_removal') or
        ''
    - months_left: MONTHS(closing_date, F('term_end_date'))
    - years: (months_left + 1) / K('final_year_months') if months_left < K('final_year_months') else (months_left //
        12 if months_left % 12 < K('short_part_months') else months_left // 12 + 1)
    - base_rate: P('etf_per_kw_per_remaining_year_usd')
    - band_kw: SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='cancellation_removal')
        + SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='move_removal') + SUM('garden_allocations','kw',
        event_type='garden_allocation_reduced', filing_reason='nonpayment_removal')
    - rate: base_rate * K('band_large_pct') / 100 if band_kw >= K('band_large_kw') else (base_rate * K('band_mid_pct')
        / 100 if band_kw >= K('band_mid_kw') else base_rate)
    - moved_home_kw: XSUM('home','home_allocations','kw', event_type='home_allocation_filed', filing_reason='initial',
        filing_month=removal_month)
    - moved_biz_kw: XSUM('biz','biz_allocations','kw', event_type='biz_allocation_filed', filing_reason='initial', filing_month=removal_month)
    - moved_home_eff: XLATEST('home','home_allocations','effective_date', date_field='effective_date', event_type='home_allocation_filed',
        filing_reason='initial', filing_month=removal_month) or ''
    - moved_biz_eff: XLATEST('biz','biz_allocations','effective_date', date_field='effective_date', event_type='biz_allocation_filed',
        filing_reason='initial', filing_month=removal_month) or ''
    - moved_home_term: CPARAM('home','term_months', home_sub_id=XLATEST('home','home_allocations','home_sub_id', date_field='effective_date',
        event_type='home_allocation_filed', filing_reason='initial', filing_month=removal_month)) or 0
    - moved_biz_term: CPARAM('biz','term_months', biz_sub_id=XLATEST('biz','biz_allocations','biz_sub_id', date_field='effective_date',
        event_type='biz_allocation_filed', filing_reason='initial', filing_month=removal_month)) or 0
    - moved_kw: moved_home_kw + moved_biz_kw
    - moved_term: moved_home_term if moved_home_eff > moved_biz_eff else moved_biz_term
    - switch_kw: moved_kw if (moved_kw > 0 and moved_term > 0) else (moved_kw * K('noterm_credit_pct') / 100 if (moved_kw
        > 0 and moved_term == 0) else 0)
    - lead_days: DAYS(request_date, closing_date) if request_date != '' else -1
    - lead_pct: K('lead_long_pct') if lead_days >= K('lead_long_days') else (K('lead_mid_pct') if lead_days >= K('lead_mid_days')
        else 100)
    - form_v2_days: DAYS(F('signed_date'), K('form_v2_date'))
    - form_v3_days: DAYS(F('signed_date'), K('form_v3_date'))
    - form_pct: K('form_v1_pct') if form_v2_days > 0 else (K('form_v2_pct') if form_v3_days > 0 else 100)
    - dec_date: LATEST('garden_allocations','effective_date', date_field='effective_date', event_type='garden_allocation_reduced',
        filing_reason='subscriber_decrease') or ''
    - dec_kw: LATEST('garden_allocations','kw', date_field='effective_date', event_type='garden_allocation_reduced',
        filing_reason='subscriber_decrease') or 0
    - dec_months: MONTHS(dec_date, closing_date) if dec_date != '' else 9999
    - addback_kw: dec_kw if (dec_date != '' and dec_months < K('addback_full_months')) else (dec_kw * K('addback_half_pct')
        / 100 if (dec_date != '' and dec_months < K('addback_half_months')) else 0)
    - basis_kw: MX(0, removal_kw + addback_kw - switch_kw)
    - fee_raw: basis_kw * rate * years * lead_pct / 100 * form_pct / 100
    - result: MN(P('etf_cap_usd'), RND(fee_raw + 0.000000001, 2))
