      under the retired sentence. Apart from the waivers of the base rule, the early termination fee of a subscription
      on a residential Garden plan (Garden Fixed 10, Garden Fixed 15, Garden Fixed 20 or Garden Fixed 25) is adjusted
      only as this rule states, and that of a subscription on a Garden Business plan (Garden Business Fixed 15 or Garden
      Business Fixed 25) only as the early termination fee rule for business Garden plans states; no other circumstance
      waives or reduces the early termination fee of a Garden plan. On a residential Garden plan, the fee applies only
      when term_months is greater than 0 and the closing date is on or before term_end_date; no fee applies after the
      term or on a plan without a term. An early termination fee is assessed at most once per subscription. On a residential
      Garden plan, the fee is assessed on the closing date, with billing_month the month of the closing date, and falls
      due invoice_due_days calendar days after the closing date; when the computed fee is 0.00 no fee line is written.
      On a residential Garden plan, whole calendar months between two dates are the difference in calendar months, less
      one when the later date's day of the month is smaller than the earlier date's; no last-day-of-month substitution
      is made. On a residential Garden plan, standard method: the fee is the kW removed by the removal lines of the
      closing (the allocation lines with filing_reason cancellation_removal, move_removal or nonpayment_removal, together
      being the share held on the day before closing), multiplied by the plan's etf_per_kw_per_remaining_year_usd and
      by the remaining contract years. On a residential Garden plan, the remaining contract years are the whole calendar
      months from the closing date to term_end_date, divided by twelve and rounded down, plus one for the part year
      in progress. On a residential Garden plan, the fee is rounded half up to the cent and then limited to the plan's
      etf_cap_usd. On a residential Garden plan, the request date of a closing is the notice_date when the subscription
      closed after a cancellation notice, otherwise the received_date of its move_transfer request; a closing with neither
      (a nonpayment removal) has no request date. On a residential Garden plan, where one of the adjustments below applies,
      it acts on the matching element of the standard method: kilowatts it adds or deducts change the kW removed (the
      result never falling below zero), a per-kW rate or a remaining-year count it gives replaces the standard one,
      and a percentage it gives multiplies the product of kilowatts, rate and years; all of this happens before the
      rounding and the cap of the standard method, which apply last. On a residential Garden plan, remaining-year count
      by position in the term: when fewer than final_year_months whole months remain from the closing date to term_end_date,
      the remaining contract years are those whole months plus one, divided by twelve; when final_year_months or more
      whole months remain and the whole months left over beyond the whole years number fewer than short_part_months,
      the remaining contract years are the whole years only, the short part year not being charged; otherwise the standard
      count applies. On a residential Garden plan, per-kW rate by share size: when the kW removed by the removal lines
      of the closing are band_large_kw or more, the per-kW rate is band_large_pct percent of etf_per_kw_per_remaining_year_usd;
      when they are band_mid_kw or more but less than band_large_kw, the per-kW rate is band_mid_pct percent of it;
      otherwise the per-kW rate is etf_per_kw_per_remaining_year_usd. On a residential Garden plan, kilowatts moved
      to another Meadowlark line: the moved kW are the kW of the initial allocation lines of the customer's residential
      and small business subscriptions whose filing_month equals the filing_month of the closing's removal lines (the
      share filed in the same allocation schedule that removes the Garden share), and the moved subscription is the
      one whose such line takes effect latest; when moved kW exist and the moved subscription's plan carries a committed
      term (term_months greater than 0), the moved kW are deducted from the kW removed; when moved kW exist and its
      plan carries no committed term (term_months equal to 0), noterm_credit_pct percent of the moved kW are deducted;
      otherwise nothing is deducted. On a residential Garden plan, percentage by request lead time: when the request
      date lies lead_long_days or more calendar days before the closing date, the product is taken at lead_long_pct
      percent; when it lies lead_mid_days or more but fewer than lead_long_days calendar days before, at lead_mid_pct
      percent; otherwise, or when the closing has no request date, in full. The lead time is the calendar days from
      the request date to the closing date. On a residential Garden plan, percentage by agreement form: the termination
      schedule is that of the agreement form in force on the signed_date; when the signed_date is before form_v2_date,
      the product is taken at form_v1_pct percent; when it is on or after form_v2_date but before form_v3_date, at form_v2_pct
      percent; otherwise in full. On a residential Garden plan, kilowatts decreased shortly before closing: when the
      most recent subscriber_decrease line of the subscription took effect fewer than addback_full_months whole calendar
      months before the closing date, its kW are added to the kW removed; when it took effect addback_full_months or
      more but fewer than addback_half_months whole months before the closing date, addback_half_pct percent of its
