      basis_kw: >-
        On a Garden Business plan, where one of the adjustments below applies, it acts on the matching element of the
        standard method: kilowatts it adds or deducts change the kW removed (the result never falling below zero), a
        per-kW rate or a remaining-year count it gives replaces the standard one, and a percentage it gives multiplies
        the product of kilowatts, rate and years; all of this happens before the rounding and the cap of the standard
        method, which apply last.
      fee_raw: >-
        On a Garden Business plan, where one of the adjustments below applies, it acts on the matching element of the
        standard method: kilowatts it adds or deducts change the kW removed (the result never falling below zero), a
        per-kW rate or a remaining-year count it gives replaces the standard one, and a percentage it gives multiplies
        the product of kilowatts, rate and years; all of this happens before the rounding and the cap of the standard
        method, which apply last.
      result: >-
