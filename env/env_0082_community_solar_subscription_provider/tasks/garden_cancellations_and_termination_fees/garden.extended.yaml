    factors:
    - id: term_position_allowance
      effect: parameter
      decides: allow_pct
      bindings:
      - term_left
      - allow_pct
      ladder:
      - when: fewer than short_term_months whole months from the effective_date to term_end_date
        value: K('allow_short_pct')
      - when: short_term_months or more but fewer than mid_term_months
        value: K('allow_mid_pct')
      - when: otherwise
        value: P('max_decrease_pct_per_contract_year')
      baseline:
        allow_pct: P('max_decrease_pct_per_contract_year')
      evidence:
      - date
      - tier_param
      cross_difficulty: null
      realism: R2 months remaining on the term
    - id: decrease_size_rate
      effect: parameter
      decides: fee_rate
      bindings:
      - size_kw
      - fee_rate
      ladder:
      - when: decrease >= band_large_kw kW
        value: P('excess_decrease_fee_per_kw_usd') * K('band_large_pct') / 100
      - when: decrease >= band_mid_kw and < band_large_kw
        value: P('excess_decrease_fee_per_kw_usd') * K('band_mid_pct') / 100
      - when: otherwise
        value: P('excess_decrease_fee_per_kw_usd')
      baseline:
        fee_rate: P('excess_decrease_fee_per_kw_usd')
      evidence:
      - history
      - tier_param
      cross_difficulty: null
      realism: R1 size-band schedule
    - id: advance_request_terms
      effect: parameter
      decides: lead_pct
      bindings:
      - request_date
      - request_lead
      - lead_pct
      ladder:
      - when: decrease request received lead_long_days or more days before the effective_date
        value: K('lead_long_pct')
      - when: lead_mid_days or more but fewer than lead_long_days
        value: K('lead_mid_pct')
      - when: otherwise
        value: '100'
      baseline:
        lead_pct: '100'
      evidence:
      - history
      - date
      cross_difficulty: null
      realism: R2 notice lead before the filing
    - id: allowance_basis_rule
      effect: method
      decides: allow_base
      bindings:
      - initial_kw
      - increase_kw
      - allow_base
      ladder:
      - when: initial allocation line smaller than contract_kw
        method: allowance worked out on contract_kw
      - when: initial line not smaller than contract_kw and subscriber_increase lines exist
        method: allowance worked out on the allocation held before the decrease less the increase kW
      - when: otherwise
        method: allowance worked out on the allocation held before the decrease
      baseline:
        allow_base: held_before
      evidence:
      - history
      cross_difficulty: null
      realism: 'R6 allowance basis net of earlier subscriber increases (catalogue: no unused honest method lever)'
    - id: closing_overlap_share
      effect: parameter
      decides: overlap_pct
      bindings:
      - gap_months
      - overlap_pct
      ladder:
      - when: closed fewer than overlap_near_months whole months after the decrease effective_date
        value: K('overlap_near_pct')
      - when: closed overlap_near_months or more but fewer than overlap_far_months after
        value: K('overlap_far_pct')
      - when: otherwise or still open
        value: '100'
      baseline:
        overlap_pct: '100'
      evidence:
      - date
      cross_difficulty: null
      realism: 'R6 no double recovery with the termination fee (catalogue: no unused honest lever)'
    baseline:
      rule: >-
        On a residential Garden plan, standard method: the allowance is max_decrease_pct_per_contract_year percent of
        the allocation held before the decrease; the fee is the kW of the decrease beyond that allowance (nothing when
        the decrease is within it) multiplied by excess_decrease_fee_per_kw_usd, rounded half up to the cent.
      params:
      - max_decrease_pct_per_contract_year
      - excess_decrease_fee_per_kw_usd
    inputs:
      history:
      - table: garden_allocations
        aggregate: latest
        field: kw
        filters:
          event_type: garden_allocation_reduced
          filing_reason: subscriber_decrease
      - table: garden_allocations
