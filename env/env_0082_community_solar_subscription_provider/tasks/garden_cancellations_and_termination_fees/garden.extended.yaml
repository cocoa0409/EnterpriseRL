    factors:
    - id: closing_line_scope
      effect: parameter
      decides: line_sum
      bindings:
      - lines_billed
      - lines_all
      - line_sum
      ladder:
      - when: subscription in closed status
        value: every charge and fee line whatever its due_date
      - when: subscription in notice_given or transfer_pending status
        value: every charge and fee line billed on or before the payment date
      - when: otherwise
        value: the lines due on or before the payment date
      baseline:
        line_sum: lines_due
      evidence:
      - history
      - date
      cross_difficulty: null
      realism: 'R6 acceleration of an ended agreement (catalogue: no honest lever on a payment amount)'
    - id: reported_statement_prepay
      effect: method
      decides: prepay
      bindings:
      - st_month
      - st_kwh
      - st_posted
      - st_billed
      - st_rate
      - last_amt
      - last_kwh
      - prepay
      ladder:
      - when: closed AND the most recently posted statement has no actual charge
        method: add credited_kwh x the escalated contract rate on its posted_date (the charge rule's own price)
      - when: notice_given or transfer_pending AND that statement has no actual charge
        method: add credited_kwh x the per-kWh rate of the latest actual charge
      - when: otherwise
        method: add nothing
      baseline:
        prepay: '0'
      evidence:
      - history
      - date
      - tier_param
      cross_difficulty: null
      realism: 'R6 settlement covers credit statements already reported (no estimate: the statement has posted)'
    - id: dispute_holdback
      effect: parameter
      decides: dispute_hold
      bindings:
      - d_bill
      - d_recv
      - d_days
      - d_amt
      - d_late
      - dispute_hold
      ladder:
      - when: open billing_dispute received fewer than dispute_resolution_days days before the payment date
        value: the disputed line held back
      - when: open billing_dispute received dispute_resolution_days or more days before
        value: the disputed line and its late fee lines held back
      - when: otherwise
        value: '0'
      baseline:
        dispute_hold: '0'
      evidence:
      - history
      - date
      - tier_param
      cross_difficulty: null
      realism: R6 disputed amounts not collected before the decision (base dispute rules)
    - id: moved_share_deferral
      effect: parameter
      decides: etf_hold
      bindings:
      - mv_kw
      - mv_home_eff
      - mv_biz_eff
      - mv_term
      - etf_amt
      - etf_wait
      - etf_hold
      ladder:
      - when: termination fee line not yet due AND moved kW exist AND moved plan term_months > 0
        value: the whole termination fee line held back to its due date
      - when: not yet due AND moved kW exist AND moved plan term_months = 0
        value: K('defer_noterm_pct') percent of the line held back
      - when: otherwise
        value: '0'
      baseline:
        etf_hold: '0'
      evidence:
      - cross_category
      - history
      - date
      - tier_param
      cross_difficulty: biz
      realism: 'R6 timing only: the fee stays owed in full and falls due on its own due date'
    baseline:
      rule: >-
        On a Garden Business plan, standard method: the settlement amount is the sum of the subscription's charge, late
        fee, returned-payment fee, early termination fee and excess-decrease fee lines whose due_date is on or before
        the payment date, plus its payment_returned lines, less its payment and billing credit lines, rounded half up
        to the cent.
      params: []
    inputs:
      history:
      - table: garden_billing
        aggregate: sum
        field: amount
        filters:
          event_type: garden_charge_billed
      - table: garden_billing
        aggregate: sum
        field: amount
        filters:
          event_type: garden_payment_received
      - table: garden_credits
        aggregate: latest
        field: credited_kwh
        filters:
          event_type: garden_credit_posted
      - table: garden_requests
        aggregate: latest
        field: garden_disputed_bill_id
        filters:
          request_type: billing_dispute
      - category: home
        table: home_allocations
        aggregate: sum
        field: kw
        filters:
          filing_reason: initial
      - category: biz
        table: biz_allocations
        aggregate: sum
        field: kw
        filters:
          filing_reason: initial
      cross_category:
      - home
      - biz
  - id: garden_ext_business_etf
    base_policy_refs:
    - garden_cancellation
    - garden_transfer_at_move
    - garden_nonpayment_removal
    overwrite:
    - base_policy: garden_cancellation
      superseded_clause: >-
        Early termination fee: when term_months is greater than 0 and the closing date is on or before term_end_date,
        the fee is allocation_kw held on the day before closing multiplied by etf_per_kw_per_remaining_year_usd and
        by the remaining contract years (garden_msr_remaining_contract_years: contract years from the closing date through
        term_end_date, a part year counting as a whole year), rounded half up to the cent and limited to etf_cap_usd;
        it is assessed on the closing date and due invoice_due_days later.
      replaced_by: >-
        For a subscription on a Garden Business plan (Garden Business Fixed 15 or Garden Business Fixed 25) the fee
        is computed as this rule sets out, including a closing by nonpayment removal, which the base nonpayment removal
        rule prices as a cancellation closing on the removal date; a subscription on a residential Garden plan (Garden
        Fixed 10, Garden Fixed 15, Garden Fixed 20 or Garden Fixed 25) is priced by the early termination fee rule for
        residential Garden plans, and no Garden subscription remains under the retired sentence.
    - base_policy: garden_cancellation
      superseded_clause: >-
        No other circumstance waives or reduces the early termination fee of a Garden plan.
      replaced_by: >-
        Apart from the waivers of the base rule, the early termination fee of a subscription on a Garden Business plan
        (Garden Business Fixed 15 or Garden Business Fixed 25) is adjusted only as this rule states, and that of a subscription
        on a residential Garden plan (Garden Fixed 10, Garden Fixed 15, Garden Fixed 20 or Garden Fixed 25) only as
        the early termination fee rule for residential Garden plans states; no other circumstance waives or reduces
        the early termination fee of a Garden plan.
    trigger: state_due
    subject:
    - garden_etf_assessed
    computes: amount
    target_tool: assess_closing_etf_d780691d
    params:
      final_year_months: 12
      short_part_months: 6
      band_large_kw: 25
      band_mid_kw: 10
      band_large_pct: 85
      band_mid_pct: 92
      noterm_credit_pct: 50
      lead_long_days: 150
      lead_mid_days: 100
      lead_long_pct: 80
      lead_mid_pct: 90
      form_v2_date: '2020-07-01'
      form_v3_date: '2023-01-01'
      form_v1_pct: 85
      form_v2_pct: 92
      addback_full_months: 12
      addback_half_months: 24
      addback_half_pct: 50
    rule: >-
      This rule prices the early termination fee of a subscription on a Garden Business plan (Garden Business Fixed
      15 or Garden Business Fixed 25), and only of such a subscription. For a subscription on a Garden Business plan
      (Garden Business Fixed 15 or Garden Business Fixed 25) the fee is computed as this rule sets out, including a
      closing by nonpayment removal, which the base nonpayment removal rule prices as a cancellation closing on the
      removal date; a subscription on a residential Garden plan (Garden Fixed 10, Garden Fixed 15, Garden Fixed 20 or
      Garden Fixed 25) is priced by the early termination fee rule for residential Garden plans, and no Garden subscription
      remains under the retired sentence. Apart from the waivers of the base rule, the early termination fee of a subscription
      on a Garden Business plan (Garden Business Fixed 15 or Garden Business Fixed 25) is adjusted only as this rule
      states, and that of a subscription on a residential Garden plan (Garden Fixed 10, Garden Fixed 15, Garden Fixed
      20 or Garden Fixed 25) only as the early termination fee rule for residential Garden plans states; no other circumstance
      waives or reduces the early termination fee of a Garden plan. On a Garden Business plan, the fee applies only
      when term_months is greater than 0 and the closing date is on or before term_end_date; no fee applies after the
      term or on a plan without a term. An early termination fee is assessed at most once per subscription. On a Garden
      Business plan, the fee is assessed on the closing date, with billing_month the month of the closing date, and
      falls due invoice_due_days calendar days after the closing date; when the computed fee is 0.00 no fee line is
      written. On a Garden Business plan, whole calendar months between two dates are the difference in calendar months,
      less one when the later date's day of the month is smaller than the earlier date's; no last-day-of-month substitution
      is made. On a Garden Business plan, standard method: the fee is the kW removed by the removal lines of the closing
      (the allocation lines with filing_reason cancellation_removal, move_removal or nonpayment_removal, together being
      the share held on the day before closing), multiplied by the plan's etf_per_kw_per_remaining_year_usd and by the
      remaining contract years. On a Garden Business plan, the remaining contract years are the whole calendar months
      from the closing date to term_end_date, divided by twelve and rounded down, plus one for the part year in progress.
      On a Garden Business plan, the fee is rounded half up to the cent and then limited to the plan's etf_cap_usd.
      On a Garden Business plan, the request date of a closing is the notice_date when the subscription closed after
      a cancellation notice, otherwise the received_date of its move_transfer request; a closing with neither (a nonpayment
      removal) has no request date. On a Garden Business plan, where one of the adjustments below applies, it acts on
      the matching element of the standard method: kilowatts it adds or deducts change the kW removed (the result never
      falling below zero), a per-kW rate or a remaining-year count it gives replaces the standard one, and a percentage
      it gives multiplies the product of kilowatts, rate and years; all of this happens before the rounding and the
      cap of the standard method, which apply last. On a Garden Business plan, remaining-year count by position in the
      term: when fewer than final_year_months whole months remain from the closing date to term_end_date, the remaining
      contract years are those whole months plus one, divided by twelve; when final_year_months or more whole months
      remain and the whole months left over beyond the whole years number fewer than short_part_months, the remaining
      contract years are the whole years only, the short part year not being charged; otherwise the standard count applies.
      On a Garden Business plan, per-kW rate by share size: when the kW removed by the removal lines of the closing
      are band_large_kw or more, the per-kW rate is band_large_pct percent of etf_per_kw_per_remaining_year_usd; when
      they are band_mid_kw or more but less than band_large_kw, the per-kW rate is band_mid_pct percent of it; otherwise
      the per-kW rate is etf_per_kw_per_remaining_year_usd. On a Garden Business plan, kilowatts moved to another Meadowlark
      line: the moved kW are the kW of the initial allocation lines of the customer's residential and small business
      subscriptions whose filing_month equals the filing_month of the closing's removal lines (the share filed in the
      same allocation schedule that removes the Garden share), and the moved subscription is the one whose such line
      takes effect latest; when moved kW exist and the moved subscription's plan carries a committed term (term_months
      greater than 0), the moved kW are deducted from the kW removed; when moved kW exist and its plan carries no committed
      term (term_months equal to 0), noterm_credit_pct percent of the moved kW are deducted; otherwise nothing is deducted.
      On a Garden Business plan, percentage by request lead time: when the request date lies lead_long_days or more
      calendar days before the closing date, the product is taken at lead_long_pct percent; when it lies lead_mid_days
      or more but fewer than lead_long_days calendar days before, at lead_mid_pct percent; otherwise, or when the closing
      has no request date, in full. The lead time is the calendar days from the request date to the closing date. On
      a Garden Business plan, percentage by agreement form: the termination schedule is that of the agreement form in
      force on the signed_date; when the signed_date is before form_v2_date, the product is taken at form_v1_pct percent;
      when it is on or after form_v2_date but before form_v3_date, at form_v2_pct percent; otherwise in full. On a Garden
      Business plan, kilowatts decreased shortly before closing: when the most recent subscriber_decrease line of the
      subscription took effect fewer than addback_full_months whole calendar months before the closing date, its kW
      are added to the kW removed; when it took effect addback_full_months or more but fewer than addback_half_months
      whole months before the closing date, addback_half_pct percent of its kW are added; otherwise, or when the subscription
      has no subscriber_decrease line, nothing is added. The whole months are counted from that line's effective_date
      to the closing date.
    prerequisite: []
    cross_category:
    - category: home
      as: history
      reads:
      - home_allocations.kw
      - home_allocations.filing_month
      - home_allocations.home_sub_id
      - variant_name
      note: line_switch_credit tier from residential initial filings in the removal filing month
    - category: biz
      as: history
      reads:
      - biz_allocations.kw
      - biz_allocations.filing_month
      - biz_allocations.biz_sub_id
      - variant_name
      note: line_switch_credit tier from small business initial filings in the removal filing month
    compute:
    - closing_date: F('closed_date')
    - request_date: F('notice_date') or LATEST('garden_requests','received_date', date_field='received_date', request_type='move_transfer')
        or ''
    - removal_kw: SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='cancellation_removal')
        + SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='move_removal') + SUM('garden_allocations','kw',
        event_type='garden_allocation_reduced', filing_reason='nonpayment_removal')
    - removal_month: LATEST('garden_allocations','filing_month', date_field='effective_date', event_type='garden_allocation_reduced',
        filing_reason='cancellation_removal') or LATEST('garden_allocations','filing_month', date_field='effective_date',
        event_type='garden_allocation_reduced', filing_reason='move_removal') or LATEST('garden_allocations','filing_month',
        date_field='effective_date', event_type='garden_allocation_reduced', filing_reason='nonpayment_removal') or
        ''
    - months_left: MONTHS(closing_date, F('term_end_date'))
    - years: (months_left + 1) / K('final_year_months') if months_left < K('final_year_months') else (months_left //
        12 if months_left % 12 < K('short_part_months') else months_left // 12 + 1)
    - base_rate: P('etf_per_kw_per_remaining_year_usd')
    - band_kw: SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='cancellation_removal')
        + SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='move_removal') + SUM('garden_allocations','kw',
        event_type='garden_allocation_reduced', filing_reason='nonpayment_removal')
    - rate: base_rate * K('band_large_pct') / 100 if band_kw >= K('band_large_kw') else (base_rate * K('band_mid_pct')
        / 100 if band_kw >= K('band_mid_kw') else base_rate)
    - moved_home_kw: XSUM('home','home_allocations','kw', event_type='home_allocation_filed', filing_reason='initial',
        filing_month=removal_month)
    - moved_biz_kw: XSUM('biz','biz_allocations','kw', event_type='biz_allocation_filed', filing_reason='initial', filing_month=removal_month)
    - moved_home_eff: XLATEST('home','home_allocations','effective_date', date_field='effective_date', event_type='home_allocation_filed',
        filing_reason='initial', filing_month=removal_month) or ''
    - moved_biz_eff: XLATEST('biz','biz_allocations','effective_date', date_field='effective_date', event_type='biz_allocation_filed',
        filing_reason='initial', filing_month=removal_month) or ''
    - moved_home_term: CPARAM('home','term_months', home_sub_id=XLATEST('home','home_allocations','home_sub_id', date_field='effective_date',
        event_type='home_allocation_filed', filing_reason='initial', filing_month=removal_month)) or 0
    - moved_biz_term: CPARAM('biz','term_months', biz_sub_id=XLATEST('biz','biz_allocations','biz_sub_id', date_field='effective_date',
        event_type='biz_allocation_filed', filing_reason='initial', filing_month=removal_month)) or 0
    - moved_kw: moved_home_kw + moved_biz_kw
    - moved_term: moved_home_term if moved_home_eff > moved_biz_eff else moved_biz_term
    - switch_kw: moved_kw if (moved_kw > 0 and moved_term > 0) else (moved_kw * K('noterm_credit_pct') / 100 if (moved_kw
        > 0 and moved_term == 0) else 0)
    - lead_days: DAYS(request_date, closing_date) if request_date != '' else -1
    - lead_pct: K('lead_long_pct') if lead_days >= K('lead_long_days') else (K('lead_mid_pct') if lead_days >= K('lead_mid_days')
        else 100)
    - form_v2_days: DAYS(F('signed_date'), K('form_v2_date'))
    - form_v3_days: DAYS(F('signed_date'), K('form_v3_date'))
    - form_pct: K('form_v1_pct') if form_v2_days > 0 else (K('form_v2_pct') if form_v3_days > 0 else 100)
    - dec_date: LATEST('garden_allocations','effective_date', date_field='effective_date', event_type='garden_allocation_reduced',
        filing_reason='subscriber_decrease') or ''
    - dec_kw: LATEST('garden_allocations','kw', date_field='effective_date', event_type='garden_allocation_reduced',
        filing_reason='subscriber_decrease') or 0
    - dec_months: MONTHS(dec_date, closing_date) if dec_date != '' else 9999
    - addback_kw: dec_kw if (dec_date != '' and dec_months < K('addback_full_months')) else (dec_kw * K('addback_half_pct')
        / 100 if (dec_date != '' and dec_months < K('addback_half_months')) else 0)
    - basis_kw: MX(0, removal_kw + addback_kw - switch_kw)
    - fee_raw: basis_kw * rate * years * lead_pct / 100 * form_pct / 100
    - result: MN(P('etf_cap_usd'), RND(fee_raw + 0.000000001, 2))
    compute_basis:
      closing_date: >-
        On a Garden Business plan, the remaining contract years are the whole calendar months from the closing date
        to term_end_date, divided by twelve and rounded down, plus one for the part year in progress.
      request_date: >-
        On a Garden Business plan, the request date of a closing is the notice_date when the subscription closed after
        a cancellation notice, otherwise the received_date of its move_transfer request; a closing with neither (a nonpayment
        removal) has no request date.
      removal_kw: >-
        On a Garden Business plan, standard method: the fee is the kW removed by the removal lines of the closing (the
        allocation lines with filing_reason cancellation_removal, move_removal or nonpayment_removal, together being
