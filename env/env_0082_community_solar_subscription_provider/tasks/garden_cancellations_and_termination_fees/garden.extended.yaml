    - base_policy: garden_cancellation
      superseded_clause: >-
        Early termination fee: when term_months is greater than 0 and the closing date is on or before term_end_date,
        the fee is allocation_kw held on the day before closing multiplied by etf_per_kw_per_remaining_year_usd and
        by the remaining contract years (garden_msr_remaining_contract_years: contract years from the closing date through
        term_end_date, a part year counting as a whole year), rounded half up to the cent and limited to etf_cap_usd;
        it is assessed on the closing date and due invoice_due_days later.
      replaced_by: >-
        For a subscription on a residential Garden plan (Garden Fixed 10, Garden Fixed 15, Garden Fixed 20 or Garden
        Fixed 25) the fee is computed as this rule sets out, including a closing by nonpayment removal, which the base
        nonpayment removal rule prices as a cancellation closing on the removal date; a subscription on a Garden Business
        plan (Garden Business Fixed 15 or Garden Business Fixed 25) is priced by the early termination fee rule for
        business Garden plans, and no Garden subscription remains under the retired sentence.
    - base_policy: garden_cancellation
