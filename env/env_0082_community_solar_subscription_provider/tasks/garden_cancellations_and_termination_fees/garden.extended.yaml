        line of the subscription took effect fewer than addback_full_months whole calendar months before the closing
        date, its kW are added to the kW removed; when it took effect addback_full_months or more but fewer than addback_half_months
        whole months before the closing date, addback_half_pct percent of its kW are added; otherwise, or when the subscription
