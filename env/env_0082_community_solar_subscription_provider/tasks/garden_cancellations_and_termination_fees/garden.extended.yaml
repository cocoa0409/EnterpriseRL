  - id: garden_ext_residential_returned_late_fee
    base_policy_refs:
    - garden_evt_late_fee
    - garden_evt_payment_application
    overwrite:
    - base_policy: garden_evt_late_fee
      superseded_clause: >-
        The fee is the unpaid amount of that one charge on the assessment date (garden_msr_unpaid_on_charge) multiplied
        by late_fee_pct and divided by 100, rounded half up to the cent, raised to late_fee_min_usd when lower and limited
        to late_fee_max_usd when higher.
      replaced_by: >-
        For the subscription charge that the most recent returned payment of a subscription on a residential Garden
        plan (Garden Fixed 10, Garden Fixed 15, Garden Fixed 20 or Garden Fixed 25) re-opened, the late fee is computed
        as this rule sets out; the same charge of a subscription on a Garden Business plan (Garden Business Fixed 15
        or Garden Business Fixed 25) is priced by the returned-payment late fee rule for business Garden plans; every
        other late fee remains under the base rule, which reads: The fee is the unpaid amount of that one charge on
        the assessment date (garden_msr_unpaid_on_charge) multiplied by late_fee_pct and divided by 100, rounded half
        up to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher.
    trigger: state_due
    subject:
    - garden_late_fee_assessed
    computes: amount
    target_tool: assess_reopened_late_fee_3e91b283
    params:
      accrual_days: 30
      repeat2_pts: 1.0
      repeat1_pts: 0.5
      band_high_usd: 1000
      band_mid_usd: 200
      band_high_pct: 80
      band_mid_pct: 90
      closed_load_pct: 125
      pending_load_pct: 110
      check_pts: 0.5
      ach_pts: 0.25
    rule: >-
      This rule prices the late fee on the subscription charge that the most recent returned payment of a subscription
      on a residential Garden plan (Garden Fixed 10, Garden Fixed 15, Garden Fixed 20 or Garden Fixed 25) re-opened,
      and only that late fee. For the subscription charge that the most recent returned payment of a subscription on
      a residential Garden plan (Garden Fixed 10, Garden Fixed 15, Garden Fixed 20 or Garden Fixed 25) re-opened, the
      late fee is computed as this rule sets out; the same charge of a subscription on a Garden Business plan (Garden
      Business Fixed 15 or Garden Business Fixed 25) is priced by the returned-payment late fee rule for business Garden
      plans; every other late fee remains under the base rule, which reads: The fee is the unpaid amount of that one
      charge on the assessment date (garden_msr_unpaid_on_charge) multiplied by late_fee_pct and divided by 100, rounded
      half up to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher. On a residential
      Garden plan, the charge concerned is the actual subscription charge, with the latest bill_date among those, whose
      billing_month equals the billing_month of the subscription's most recent payment_returned line (the line with
      the latest bill_date). On a residential Garden plan, its unpaid amount on the assessment date is the amount payment
      application leaves open on it: payments settle open lines in payment_application_order and each payment is recorded
      under the billing_month of the line it settles, so the unpaid amount is the charge's amount, less the payments
      recorded for that billing_month, plus the payment_returned amounts recorded for that billing_month, less the billing
      credits referring to the charge, and never below zero; when it is 0.00 no fee is written. On a residential Garden
      plan, the fee is assessed only on a dual-billed charge, only after the late fee grace period that starts when
      the charge reaches its due_date has fully passed, at most once per charge, and not when the charge is under an
      open billing dispute; the assessment date is the day the fee is booked, the fee's billing_month is the billing_month
      of the charge and the fee falls due invoice_due_days calendar days after the assessment date. On a residential
      Garden plan, whole calendar months between two dates are the difference in calendar months, less one when the
      later date's day of the month is smaller than the earlier date's; no last-day-of-month substitution is made. On
      a residential Garden plan, standard method: the fee is the unpaid amount of the charge multiplied by the rate
      late_fee_pct and divided by 100, rounded half up to the cent, then raised to late_fee_min_usd when lower and limited
      to late_fee_max_usd when higher. On a residential Garden plan, where one of the adjustments below applies, it
      acts on the matching element of the standard method: a rate it gives replaces late_fee_pct, percentage points
      it gives are added to the rate in use, and a percentage it gives multiplies the unpaid amount times the rate;
      all of this happens before the rounding, the minimum and the maximum of the standard method, which apply last
      in that order. On a residential Garden plan, lateness accrual: when the returned payment came back after the charge's
      due_date and more than accrual_days calendar days separate its return date from the assessment date, the rate
      is late_fee_pct for every started accrual_days-day period from the return date to the assessment date; when the
      returned payment came back on or before the due_date and more than accrual_days calendar days separate the due_date
      from the assessment date, the rate is late_fee_pct for every started accrual_days-day period from the due_date
      to the assessment date; otherwise the rate is late_fee_pct. On a residential Garden plan, repeat lateness on the
      subscription: when two or more late fee lines of the subscription carry a bill_date fewer than twelve whole calendar
      months before the assessment date, repeat2_pts percentage points are added to the rate; when exactly one does,
      repeat1_pts points are added; otherwise none. On a residential Garden plan, charge size band: when the amount
      of the charge concerned is band_high_usd or more, the unpaid amount times the rate is taken at band_high_pct percent;
      when it is band_mid_usd or more but less than band_high_usd, at band_mid_pct percent; otherwise in full. On a
      residential Garden plan, closing status: when the subscription's closed_date is on or before the assessment date,
      the unpaid amount times the rate is taken at closed_load_pct percent; when it has no closed_date but carries a
      scheduled_end_date on or after the assessment date or a move_out_date on or before it, at pending_load_pct percent;
      otherwise in full. On a residential Garden plan, returned instrument: when the most recent payment_returned line
      of the subscription has payment_method check, check_pts percentage points are added to the rate; when it has payment_method
      ach, ach_pts points are added; otherwise none.
    prerequisite: []
    cross_category: []
    compute:
    - ret_month: LATEST('garden_billing','billing_month', date_field='bill_date', event_type='garden_payment_returned')
        or ''
    - charge_id: LATEST('garden_billing','garden_bill_id', date_field='bill_date', event_type='garden_charge_billed',
        charge_basis='actual', billing_month=ret_month) or ''
    - charge_amt: LATEST('garden_billing','amount', date_field='bill_date', event_type='garden_charge_billed', charge_basis='actual',
        billing_month=ret_month) or 0
    - charge_due: LATEST('garden_billing','due_date', date_field='bill_date', event_type='garden_charge_billed', charge_basis='actual',
        billing_month=ret_month) or NOW
    - paid: SUM('garden_billing','amount', event_type='garden_payment_received', billing_month=ret_month)
    - returned: SUM('garden_billing','amount', event_type='garden_payment_returned', billing_month=ret_month)
    - credited: SUM('garden_billing','amount', event_type='garden_billing_credited', garden_ref_bill_id=charge_id)
    - unpaid: MX(0, charge_amt - paid + returned - credited)
    - ret_date: LATEST('garden_billing','bill_date', date_field='bill_date', event_type='garden_payment_returned') or
        NOW
    - ret_after_due: DAYS(charge_due, ret_date)
    - from_return: DAYS(ret_date, NOW)
    - from_due: DAYS(charge_due, NOW)
    - rate: P('late_fee_pct') * ((from_return + K('accrual_days') - 1) // K('accrual_days')) if (ret_after_due > 0 and
        from_return > K('accrual_days')) else (P('late_fee_pct') * ((from_due + K('accrual_days') - 1) // K('accrual_days'))
        if (ret_after_due <= 0 and from_due > K('accrual_days')) else P('late_fee_pct'))
    - own_late_n: COUNT('garden_billing', within_months=12, date_field='bill_date', event_type='garden_late_fee_assessed')
    - repeat_pts: K('repeat2_pts') if own_late_n >= 2 else (K('repeat1_pts') if own_late_n == 1 else 0)
    - band_amt: LATEST('garden_billing','amount', date_field='bill_date', event_type='garden_charge_billed', charge_basis='actual',
        billing_month=ret_month) or 0
    - band_pct: K('band_high_pct') if band_amt >= K('band_high_usd') else (K('band_mid_pct') if band_amt >= K('band_mid_usd')
        else 100)
    - closed_days: DAYS(F('closed_date'), NOW) if (F('closed_date') or '') != '' else -1
    - pending_days: DAYS(NOW, F('scheduled_end_date')) if (F('scheduled_end_date') or '') != '' else (DAYS(F('move_out_date'),
        NOW) if (F('move_out_date') or '') != '' else -1)
    - status_pct: K('closed_load_pct') if closed_days >= 0 else (K('pending_load_pct') if pending_days >= 0 else 100)
    - ret_method: LATEST('garden_billing','payment_method', date_field='bill_date', event_type='garden_payment_returned')
        or ''
    - instrument_pts: K('check_pts') if ret_method == 'check' else (K('ach_pts') if ret_method == 'ach' else 0)
    - fee_raw: unpaid * (rate + repeat_pts + instrument_pts) / 100 * band_pct / 100 * status_pct / 100
    - result: 0 if unpaid <= 0 else MN(P('late_fee_max_usd'), MX(P('late_fee_min_usd'), RND(fee_raw + 0.000000001, 2)))
