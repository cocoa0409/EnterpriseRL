    factors:
    - id: closing_line_scope
      effect: parameter
      decides: line_sum
      bindings:
      - lines_billed
      - lines_all
      - line_sum
      ladder:
      - when: subscription in closed status
        value: every charge and fee line whatever its due_date
      - when: subscription in notice_given or transfer_pending status
        value: every charge and fee line billed on or before the payment date
      - when: otherwise
        value: the lines due on or before the payment date
      baseline:
        line_sum: lines_due
      evidence:
      - history
      - date
      cross_difficulty: null
      realism: 'R6 acceleration of an ended agreement (catalogue: no honest lever on a payment amount)'
    - id: reported_statement_prepay
      effect: method
      decides: prepay
      bindings:
      - st_month
      - st_kwh
      - st_posted
      - st_billed
      - st_rate
      - last_amt
      - last_kwh
      - prepay
      ladder:
      - when: closed AND the most recently posted statement has no actual charge
        method: add credited_kwh x the escalated contract rate on its posted_date (the charge rule's own price)
      - when: notice_given or transfer_pending AND that statement has no actual charge
        method: add credited_kwh x the per-kWh rate of the latest actual charge
      - when: otherwise
        method: add nothing
      baseline:
        prepay: '0'
      evidence:
      - history
      - date
      - tier_param
      cross_difficulty: null
      realism: 'R6 settlement covers credit statements already reported (no estimate: the statement has posted)'
    - id: dispute_holdback
      effect: parameter
      decides: dispute_hold
      bindings:
      - d_bill
      - d_recv
      - d_days
      - d_amt
      - d_late
      - dispute_hold
      ladder:
      - when: open billing_dispute received fewer than dispute_resolution_days days before the payment date
        value: the disputed line held back
      - when: open billing_dispute received dispute_resolution_days or more days before
        value: the disputed line and its late fee lines held back
      - when: otherwise
        value: '0'
      baseline:
        dispute_hold: '0'
      evidence:
      - history
      - date
      - tier_param
      cross_difficulty: null
      realism: R6 disputed amounts not collected before the decision (base dispute rules)
    - id: moved_share_deferral
      effect: parameter
      decides: etf_hold
      bindings:
      - mv_kw
      - mv_home_eff
      - mv_biz_eff
      - mv_term
      - etf_amt
      - etf_wait
      - etf_hold
      ladder:
      - when: termination fee line not yet due AND moved kW exist AND moved plan term_months > 0
        value: the whole termination fee line held back to its due date
      - when: not yet due AND moved kW exist AND moved plan term_months = 0
        value: K('defer_noterm_pct') percent of the line held back
      - when: otherwise
        value: '0'
      baseline:
        etf_hold: '0'
      evidence:
      - cross_category
      - history
      - date
      - tier_param
      cross_difficulty: home
      realism: 'R6 timing only: the fee stays owed in full and falls due on its own due date'
