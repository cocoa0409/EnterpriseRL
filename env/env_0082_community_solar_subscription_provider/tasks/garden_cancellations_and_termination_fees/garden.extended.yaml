    factors:
    - id: remaining_year_rule
      effect: method
      decides: years
      bindings:
      - months_left
      - years
      ladder:
      - when: fewer than final_year_months whole months remain from the closing date to term_end_date
        method: remaining contract years = (whole months remaining + 1) / 12
      - when: final_year_months or more whole months remain and the whole months beyond the whole years are fewer than
          short_part_months
        method: remaining contract years = whole years only (short part year not charged)
      - when: otherwise
        method: 'standard count: whole years rounded down plus one'
      baseline:
        years: months_left // 12 + 1
      evidence:
      - date
      cross_difficulty: null
      realism: R3 proration of the part year (months remaining on the term)
    - id: share_band_rate
      effect: parameter
      decides: rate
      bindings:
      - band_kw
      - rate
      ladder:
      - when: kW removed by the removal lines of the closing >= band_large_kw
        value: P('etf_per_kw_per_remaining_year_usd') * K('band_large_pct') / 100
      - when: kW removed >= band_mid_kw and < band_large_kw
        value: P('etf_per_kw_per_remaining_year_usd') * K('band_mid_pct') / 100
      - when: otherwise
        value: P('etf_per_kw_per_remaining_year_usd')
      baseline:
        rate: base_rate
      evidence:
      - history
      - tier_param
      cross_difficulty: null
      realism: R1 share-size band schedule
    - id: line_switch_credit
      effect: parameter
      decides: switch_kw
      bindings:
      - moved_home_kw
      - moved_biz_kw
      - moved_home_eff
      - moved_biz_eff
      - moved_home_term
      - moved_biz_term
      - moved_kw
      - moved_term
      - switch_kw
      ladder:
      - when: moved kW exist (home/biz initial lines filed in the filing_month of the removal) AND the moved plan term_months
          > 0
        value: 100 percent of the moved kW deducted
      - when: moved kW exist AND the moved plan term_months = 0
        value: K('noterm_credit_pct') percent of the moved kW deducted
      - when: otherwise
        value: '0'
      baseline:
        switch_kw: '0'
      evidence:
      - cross_category
      - history
      - tier_param
      cross_difficulty: biz
      realism: 'R6 (precedent: home_cancellation converted_to_access carries no ETF); catalogue: needed for the cross-difficulty
        floor'
    - id: notice_lead_rate
      effect: parameter
      decides: lead_pct
      bindings:
      - lead_days
      - lead_pct
      ladder:
      - when: request date lead_long_days or more calendar days before the closing date
        value: K('lead_long_pct')
      - when: request date lead_mid_days or more but fewer than lead_long_days days before
        value: K('lead_mid_pct')
      - when: otherwise or no request date
        value: '100'
      baseline:
        lead_pct: '100'
      evidence:
      - date
      cross_difficulty: null
      realism: R2 notice lead before the removal filing
    - id: agreement_form_terms
      effect: parameter
      decides: form_pct
      bindings:
      - form_v2_days
      - form_v3_days
      - form_pct
      ladder:
      - when: signed_date before form_v2_date
        value: K('form_v1_pct')
      - when: signed_date on or after form_v2_date and before form_v3_date
        value: K('form_v2_pct')
      - when: otherwise
        value: '100'
      baseline:
        form_pct: '100'
      evidence:
      - date
      cross_difficulty: null
      realism: 'R6 termination schedule of the agreement form in force on the signed_date (catalogue: no unused honest
        lever on this computation)'
    - id: prior_decrease_addback
      effect: parameter
      decides: addback_kw
      bindings:
      - dec_date
      - dec_kw
      - dec_months
      - addback_kw
      ladder:
      - when: most recent subscriber_decrease line took effect fewer than addback_full_months whole months before the
          closing date
        value: 100 percent of its kW added
      - when: it took effect addback_full_months or more but fewer than addback_half_months whole months before
        value: K('addback_half_pct') percent of its kW added
      - when: otherwise or no subscriber_decrease line
        value: '0'
      baseline:
        addback_kw: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
      realism: R6 anti-avoidance look-back on recorded decrease lines
    baseline:
      rule: >-
        On a Garden Business plan, standard method: the fee is the kW removed by the removal lines of the closing (the
        allocation lines with filing_reason cancellation_removal, move_removal or nonpayment_removal, together being
        the share held on the day before closing), multiplied by the plan's etf_per_kw_per_remaining_year_usd and by
        the remaining contract years. On a Garden Business plan, the remaining contract years are the whole calendar
        months from the closing date to term_end_date, divided by twelve and rounded down, plus one for the part year
        in progress. On a Garden Business plan, the fee is rounded half up to the cent and then limited to the plan's
        etf_cap_usd.
      params:
      - etf_per_kw_per_remaining_year_usd
      - etf_cap_usd
    inputs:
      history:
      - table: garden_allocations
        aggregate: sum
        field: kw
        filters:
          event_type: garden_allocation_reduced
          filing_reason: cancellation_removal
      - table: garden_allocations
        aggregate: latest
        field: kw
        filters:
          event_type: garden_allocation_reduced
          filing_reason: subscriber_decrease
      - category: home
        table: home_allocations
        aggregate: sum
        field: kw
        filters:
          filing_reason: initial
      - category: biz
        table: biz_allocations
        aggregate: sum
        field: kw
        filters:
          filing_reason: initial
      cross_category:
      - home
      - biz
  - id: garden_ext_business_returned_late_fee
    base_policy_refs:
    - garden_evt_late_fee
    - garden_evt_payment_application
    overwrite:
    - base_policy: garden_evt_late_fee
      superseded_clause: >-
        The fee is the unpaid amount of that one charge on the assessment date (garden_msr_unpaid_on_charge) multiplied
        by late_fee_pct and divided by 100, rounded half up to the cent, raised to late_fee_min_usd when lower and limited
        to late_fee_max_usd when higher.
      replaced_by: >-
        For the subscription charge that the most recent returned payment of a subscription on a Garden Business plan
        (Garden Business Fixed 15 or Garden Business Fixed 25) re-opened, the late fee is computed as this rule sets
        out; the same charge of a subscription on a residential Garden plan (Garden Fixed 10, Garden Fixed 15, Garden
        Fixed 20 or Garden Fixed 25) is priced by the returned-payment late fee rule for residential Garden plans; every
        other late fee remains under the base rule, which reads: The fee is the unpaid amount of that one charge on
        the assessment date (garden_msr_unpaid_on_charge) multiplied by late_fee_pct and divided by 100, rounded half
        up to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher.
    trigger: state_due
    subject:
    - garden_late_fee_assessed
    computes: amount
    target_tool: assess_reopened_late_fee_7f086ee4
    params:
      accrual_days: 30
      repeat2_pts: 1.0
      repeat1_pts: 0.5
      band_high_usd: 1000
      band_mid_usd: 200
      band_high_pct: 80
      band_mid_pct: 90
      closed_load_pct: 125
      pending_load_pct: 110
      check_pts: 0.5
      ach_pts: 0.25
      other2_pts: 1.0
      other1_pts: 0.5
    rule: >-
      This rule prices the late fee on the subscription charge that the most recent returned payment of a subscription
      on a Garden Business plan (Garden Business Fixed 15 or Garden Business Fixed 25) re-opened, and only that late
      fee. For the subscription charge that the most recent returned payment of a subscription on a Garden Business
      plan (Garden Business Fixed 15 or Garden Business Fixed 25) re-opened, the late fee is computed as this rule sets
      out; the same charge of a subscription on a residential Garden plan (Garden Fixed 10, Garden Fixed 15, Garden
      Fixed 20 or Garden Fixed 25) is priced by the returned-payment late fee rule for residential Garden plans; every
      other late fee remains under the base rule, which reads: The fee is the unpaid amount of that one charge on the
      assessment date (garden_msr_unpaid_on_charge) multiplied by late_fee_pct and divided by 100, rounded half up to
      the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher. On a Garden Business
      plan, the charge concerned is the actual subscription charge, with the latest bill_date among those, whose billing_month
      equals the billing_month of the subscription's most recent payment_returned line (the line with the latest bill_date).
      On a Garden Business plan, its unpaid amount on the assessment date is the amount payment application leaves open
      on it: payments settle open lines in payment_application_order and each payment is recorded under the billing_month
      of the line it settles, so the unpaid amount is the charge's amount, less the payments recorded for that billing_month,
      plus the payment_returned amounts recorded for that billing_month, less the billing credits referring to the charge,
      and never below zero; when it is 0.00 no fee is written. On a Garden Business plan, the fee is assessed only on
      a dual-billed charge, only after the late fee grace period that starts when the charge reaches its due_date has
      fully passed, at most once per charge, and not when the charge is under an open billing dispute; the assessment
      date is the day the fee is booked, the fee's billing_month is the billing_month of the charge and the fee falls
      due invoice_due_days calendar days after the assessment date. On a Garden Business plan, whole calendar months
      between two dates are the difference in calendar months, less one when the later date's day of the month is smaller
      than the earlier date's; no last-day-of-month substitution is made. On a Garden Business plan, standard method:
      the fee is the unpaid amount of the charge multiplied by the rate late_fee_pct and divided by 100, rounded half
      up to the cent, then raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher. On a Garden
      Business plan, where one of the adjustments below applies, it acts on the matching element of the standard method:
      a rate it gives replaces late_fee_pct, percentage points it gives are added to the rate in use, and a percentage
      it gives multiplies the unpaid amount times the rate; all of this happens before the rounding, the minimum and
      the maximum of the standard method, which apply last in that order. On a Garden Business plan, lateness accrual:
      when the returned payment came back after the charge's due_date and more than accrual_days calendar days separate
      its return date from the assessment date, the rate is late_fee_pct for every started accrual_days-day period from
      the return date to the assessment date; when the returned payment came back on or before the due_date and more
      than accrual_days calendar days separate the due_date from the assessment date, the rate is late_fee_pct for every
      started accrual_days-day period from the due_date to the assessment date; otherwise the rate is late_fee_pct.
      On a Garden Business plan, repeat lateness on the subscription: when two or more late fee lines of the subscription
      carry a bill_date fewer than twelve whole calendar months before the assessment date, repeat2_pts percentage points
      are added to the rate; when exactly one does, repeat1_pts points are added; otherwise none. On a Garden Business
      plan, charge size band: when the amount of the charge concerned is band_high_usd or more, the unpaid amount times
      the rate is taken at band_high_pct percent; when it is band_mid_usd or more but less than band_high_usd, at band_mid_pct
      percent; otherwise in full. On a Garden Business plan, closing status: when the subscription's closed_date is
      on or before the assessment date, the unpaid amount times the rate is taken at closed_load_pct percent; when it
      has no closed_date but carries a scheduled_end_date on or after the assessment date or a move_out_date on or before
      it, at pending_load_pct percent; otherwise in full. On a Garden Business plan, returned instrument: when the most
      recent payment_returned line of the subscription has payment_method check, check_pts percentage points are added
      to the rate; when it has payment_method ach, ach_pts points are added; otherwise none. On a Garden Business plan,
      lateness on the customer's other Meadowlark lines: when two or more late fee lines on the customer's residential
      or small business subscriptions carry a bill_date fewer than twelve whole calendar months before the assessment
      date, other2_pts percentage points are added to the rate; when exactly one does, other1_pts points are added;
      otherwise none.
    prerequisite: []
    cross_category:
    - category: home
      as: history
      reads:
      - home_billing.event_type
      - home_billing.bill_date
      note: other_line_lateness_points tier from late fee lines on residential subscriptions
    - category: biz
      as: history
      reads:
      - biz_billing.event_type
      - biz_billing.bill_date
      note: other_line_lateness_points tier from late fee lines on small business subscriptions
    compute:
    - ret_month: LATEST('garden_billing','billing_month', date_field='bill_date', event_type='garden_payment_returned')
        or ''
    - charge_id: LATEST('garden_billing','garden_bill_id', date_field='bill_date', event_type='garden_charge_billed',
        charge_basis='actual', billing_month=ret_month) or ''
    - charge_amt: LATEST('garden_billing','amount', date_field='bill_date', event_type='garden_charge_billed', charge_basis='actual',
        billing_month=ret_month) or 0
    - charge_due: LATEST('garden_billing','due_date', date_field='bill_date', event_type='garden_charge_billed', charge_basis='actual',
        billing_month=ret_month) or NOW
    - paid: SUM('garden_billing','amount', event_type='garden_payment_received', billing_month=ret_month)
    - returned: SUM('garden_billing','amount', event_type='garden_payment_returned', billing_month=ret_month)
    - credited: SUM('garden_billing','amount', event_type='garden_billing_credited', garden_ref_bill_id=charge_id)
    - unpaid: MX(0, charge_amt - paid + returned - credited)
    - ret_date: LATEST('garden_billing','bill_date', date_field='bill_date', event_type='garden_payment_returned') or
        NOW
    - ret_after_due: DAYS(charge_due, ret_date)
    - from_return: DAYS(ret_date, NOW)
    - from_due: DAYS(charge_due, NOW)
    - rate: P('late_fee_pct') * ((from_return + K('accrual_days') - 1) // K('accrual_days')) if (ret_after_due > 0 and
        from_return > K('accrual_days')) else (P('late_fee_pct') * ((from_due + K('accrual_days') - 1) // K('accrual_days'))
        if (ret_after_due <= 0 and from_due > K('accrual_days')) else P('late_fee_pct'))
    - own_late_n: COUNT('garden_billing', within_months=12, date_field='bill_date', event_type='garden_late_fee_assessed')
    - repeat_pts: K('repeat2_pts') if own_late_n >= 2 else (K('repeat1_pts') if own_late_n == 1 else 0)
    - band_amt: LATEST('garden_billing','amount', date_field='bill_date', event_type='garden_charge_billed', charge_basis='actual',
        billing_month=ret_month) or 0
    - band_pct: K('band_high_pct') if band_amt >= K('band_high_usd') else (K('band_mid_pct') if band_amt >= K('band_mid_usd')
        else 100)
    - closed_days: DAYS(F('closed_date'), NOW) if (F('closed_date') or '') != '' else -1
    - pending_days: DAYS(NOW, F('scheduled_end_date')) if (F('scheduled_end_date') or '') != '' else (DAYS(F('move_out_date'),
        NOW) if (F('move_out_date') or '') != '' else -1)
    - status_pct: K('closed_load_pct') if closed_days >= 0 else (K('pending_load_pct') if pending_days >= 0 else 100)
    - ret_method: LATEST('garden_billing','payment_method', date_field='bill_date', event_type='garden_payment_returned')
        or ''
    - instrument_pts: K('check_pts') if ret_method == 'check' else (K('ach_pts') if ret_method == 'ach' else 0)
    - other_late_n: XCOUNT('home','home_billing', within_months=12, date_field='bill_date', event_type='home_late_fee_assessed')
        + XCOUNT('biz','biz_billing', within_months=12, date_field='bill_date', event_type='biz_late_fee_assessed')
    - other_pts: K('other2_pts') if other_late_n >= 2 else (K('other1_pts') if other_late_n == 1 else 0)
    - fee_raw: unpaid * (rate + repeat_pts + instrument_pts + other_pts) / 100 * band_pct / 100 * status_pct / 100
    - result: 0 if unpaid <= 0 else MN(P('late_fee_max_usd'), MX(P('late_fee_min_usd'), RND(fee_raw + 0.000000001, 2)))
    compute_basis:
      ret_month: >-
        On a Garden Business plan, the charge concerned is the actual subscription charge, with the latest bill_date
        among those, whose billing_month equals the billing_month of the subscription's most recent payment_returned
        line (the line with the latest bill_date).
      charge_id: >-
        On a Garden Business plan, the charge concerned is the actual subscription charge, with the latest bill_date
        among those, whose billing_month equals the billing_month of the subscription's most recent payment_returned
        line (the line with the latest bill_date).
      charge_amt: >-
        On a Garden Business plan, the charge concerned is the actual subscription charge, with the latest bill_date
        among those, whose billing_month equals the billing_month of the subscription's most recent payment_returned
        line (the line with the latest bill_date).
      charge_due: >-
        On a Garden Business plan, the charge concerned is the actual subscription charge, with the latest bill_date
        among those, whose billing_month equals the billing_month of the subscription's most recent payment_returned
        line (the line with the latest bill_date).
      paid: >-
        On a Garden Business plan, its unpaid amount on the assessment date is the amount payment application leaves
        open on it: payments settle open lines in payment_application_order and each payment is recorded under the billing_month
        of the line it settles, so the unpaid amount is the charge's amount, less the payments recorded for that billing_month,
        plus the payment_returned amounts recorded for that billing_month, less the billing credits referring to the
        charge, and never below zero; when it is 0.00 no fee is written.
      returned: >-
        On a Garden Business plan, its unpaid amount on the assessment date is the amount payment application leaves
        open on it: payments settle open lines in payment_application_order and each payment is recorded under the billing_month
        of the line it settles, so the unpaid amount is the charge's amount, less the payments recorded for that billing_month,
        plus the payment_returned amounts recorded for that billing_month, less the billing credits referring to the
        charge, and never below zero; when it is 0.00 no fee is written.
      credited: >-
        On a Garden Business plan, its unpaid amount on the assessment date is the amount payment application leaves
        open on it: payments settle open lines in payment_application_order and each payment is recorded under the billing_month
        of the line it settles, so the unpaid amount is the charge's amount, less the payments recorded for that billing_month,
        plus the payment_returned amounts recorded for that billing_month, less the billing credits referring to the
        charge, and never below zero; when it is 0.00 no fee is written.
      unpaid: >-
        On a Garden Business plan, its unpaid amount on the assessment date is the amount payment application leaves
        open on it: payments settle open lines in payment_application_order and each payment is recorded under the billing_month
        of the line it settles, so the unpaid amount is the charge's amount, less the payments recorded for that billing_month,
        plus the payment_returned amounts recorded for that billing_month, less the billing credits referring to the
        charge, and never below zero; when it is 0.00 no fee is written.
      ret_date: >-
        On a Garden Business plan, lateness accrual: when the returned payment came back after the charge's due_date
        and more than accrual_days calendar days separate its return date from the assessment date, the rate is late_fee_pct
        for every started accrual_days-day period from the return date to the assessment date; when the returned payment
        came back on or before the due_date and more than accrual_days calendar days separate the due_date from the
        assessment date, the rate is late_fee_pct for every started accrual_days-day period from the due_date to the
        assessment date; otherwise the rate is late_fee_pct.
      ret_after_due: >-
        On a Garden Business plan, lateness accrual: when the returned payment came back after the charge's due_date
        and more than accrual_days calendar days separate its return date from the assessment date, the rate is late_fee_pct
        for every started accrual_days-day period from the return date to the assessment date; when the returned payment
        came back on or before the due_date and more than accrual_days calendar days separate the due_date from the
        assessment date, the rate is late_fee_pct for every started accrual_days-day period from the due_date to the
        assessment date; otherwise the rate is late_fee_pct.
      from_return: >-
        On a Garden Business plan, lateness accrual: when the returned payment came back after the charge's due_date
        and more than accrual_days calendar days separate its return date from the assessment date, the rate is late_fee_pct
        for every started accrual_days-day period from the return date to the assessment date; when the returned payment
        came back on or before the due_date and more than accrual_days calendar days separate the due_date from the
        assessment date, the rate is late_fee_pct for every started accrual_days-day period from the due_date to the
        assessment date; otherwise the rate is late_fee_pct.
      from_due: >-
        On a Garden Business plan, lateness accrual: when the returned payment came back after the charge's due_date
        and more than accrual_days calendar days separate its return date from the assessment date, the rate is late_fee_pct
        for every started accrual_days-day period from the return date to the assessment date; when the returned payment
        came back on or before the due_date and more than accrual_days calendar days separate the due_date from the
        assessment date, the rate is late_fee_pct for every started accrual_days-day period from the due_date to the
        assessment date; otherwise the rate is late_fee_pct.
      rate: >-
        On a Garden Business plan, lateness accrual: when the returned payment came back after the charge's due_date
        and more than accrual_days calendar days separate its return date from the assessment date, the rate is late_fee_pct
        for every started accrual_days-day period from the return date to the assessment date; when the returned payment
        came back on or before the due_date and more than accrual_days calendar days separate the due_date from the
        assessment date, the rate is late_fee_pct for every started accrual_days-day period from the due_date to the
        assessment date; otherwise the rate is late_fee_pct.
      own_late_n: >-
        On a Garden Business plan, repeat lateness on the subscription: when two or more late fee lines of the subscription
        carry a bill_date fewer than twelve whole calendar months before the assessment date, repeat2_pts percentage
        points are added to the rate; when exactly one does, repeat1_pts points are added; otherwise none.
      repeat_pts: >-
        On a Garden Business plan, repeat lateness on the subscription: when two or more late fee lines of the subscription
        carry a bill_date fewer than twelve whole calendar months before the assessment date, repeat2_pts percentage
        points are added to the rate; when exactly one does, repeat1_pts points are added; otherwise none.
      band_amt: >-
        On a Garden Business plan, charge size band: when the amount of the charge concerned is band_high_usd or more,
        the unpaid amount times the rate is taken at band_high_pct percent; when it is band_mid_usd or more but less
        than band_high_usd, at band_mid_pct percent; otherwise in full.
      band_pct: >-
        On a Garden Business plan, charge size band: when the amount of the charge concerned is band_high_usd or more,
        the unpaid amount times the rate is taken at band_high_pct percent; when it is band_mid_usd or more but less
        than band_high_usd, at band_mid_pct percent; otherwise in full.
      closed_days: >-
        On a Garden Business plan, closing status: when the subscription's closed_date is on or before the assessment
        date, the unpaid amount times the rate is taken at closed_load_pct percent; when it has no closed_date but carries
        a scheduled_end_date on or after the assessment date or a move_out_date on or before it, at pending_load_pct
        percent; otherwise in full.
      pending_days: >-
        On a Garden Business plan, closing status: when the subscription's closed_date is on or before the assessment
        date, the unpaid amount times the rate is taken at closed_load_pct percent; when it has no closed_date but carries
        a scheduled_end_date on or after the assessment date or a move_out_date on or before it, at pending_load_pct
        percent; otherwise in full.
      status_pct: >-
        On a Garden Business plan, closing status: when the subscription's closed_date is on or before the assessment
        date, the unpaid amount times the rate is taken at closed_load_pct percent; when it has no closed_date but carries
        a scheduled_end_date on or after the assessment date or a move_out_date on or before it, at pending_load_pct
        percent; otherwise in full.
      ret_method: >-
        On a Garden Business plan, returned instrument: when the most recent payment_returned line of the subscription
        has payment_method check, check_pts percentage points are added to the rate; when it has payment_method ach,
        ach_pts points are added; otherwise none.
      instrument_pts: >-
        On a Garden Business plan, returned instrument: when the most recent payment_returned line of the subscription
        has payment_method check, check_pts percentage points are added to the rate; when it has payment_method ach,
        ach_pts points are added; otherwise none.
      fee_raw: >-
        On a Garden Business plan, where one of the adjustments below applies, it acts on the matching element of the
        standard method: a rate it gives replaces late_fee_pct, percentage points it gives are added to the rate in
        use, and a percentage it gives multiplies the unpaid amount times the rate; all of this happens before the rounding,
        the minimum and the maximum of the standard method, which apply last in that order.
      result: >-
        On a Garden Business plan, standard method: the fee is the unpaid amount of the charge multiplied by the rate
        late_fee_pct and divided by 100, rounded half up to the cent, then raised to late_fee_min_usd when lower and
        limited to late_fee_max_usd when higher.
      other_late_n: >-
        On a Garden Business plan, lateness on the customer's other Meadowlark lines: when two or more late fee lines
        on the customer's residential or small business subscriptions carry a bill_date fewer than twelve whole calendar
        months before the assessment date, other2_pts percentage points are added to the rate; when exactly one does,
        other1_pts points are added; otherwise none.
      other_pts: >-
        On a Garden Business plan, lateness on the customer's other Meadowlark lines: when two or more late fee lines
        on the customer's residential or small business subscriptions carry a bill_date fewer than twelve whole calendar
        months before the assessment date, other2_pts percentage points are added to the rate; when exactly one does,
        other1_pts points are added; otherwise none.
    factors:
    - id: lateness_accrual
      effect: method
      decides: rate
      bindings:
      - ret_date
      - ret_after_due
      - from_return
      - from_due
      - rate
      ladder:
      - when: payment returned after the due_date AND more than accrual_days days from the return date to the assessment
          date
        method: rate = late_fee_pct x started accrual_days-day periods counted from the return date
      - when: payment returned on or before the due_date AND more than accrual_days days from the due_date to the assessment
          date
        method: rate = late_fee_pct x started accrual_days-day periods counted from the due_date
      - when: otherwise
        method: rate = late_fee_pct
      baseline:
        rate: P('late_fee_pct')
      evidence:
      - date
      - history
      - tier_param
      cross_difficulty: null
      realism: R2 monthly accrual of the plan late-fee rate (anchor chosen by when the payment came back)
    - id: repeat_lateness_points
      effect: parameter
      decides: repeat_pts
      bindings:
      - own_late_n
      - repeat_pts
      ladder:
      - when: two or more late fee lines of the subscription in the twelve months before
        value: K('repeat2_pts')
      - when: exactly one such line
        value: K('repeat1_pts')
      - when: otherwise
        value: '0'
      baseline:
        repeat_pts: '0'
      evidence:
      - history
      cross_difficulty: null
      realism: R6 repeat-lateness schedule on recorded late fee lines
    - id: unpaid_band_share
      effect: parameter
      decides: band_pct
      bindings:
      - band_amt
      - band_pct
      ladder:
      - when: amount of the charge concerned >= band_high_usd
        value: K('band_high_pct')
      - when: amount of the charge concerned >= band_mid_usd and < band_high_usd
        value: K('band_mid_pct')
      - when: otherwise
        value: '100'
      baseline:
        band_pct: '100'
      evidence:
      - history
      cross_difficulty: null
      realism: R6 charge-size band
    - id: closing_status_load
      effect: parameter
      decides: status_pct
      bindings:
      - closed_days
      - pending_days
      - status_pct
      ladder:
      - when: closed_date on or before the assessment date
        value: K('closed_load_pct')
      - when: no closed_date, and a scheduled_end_date on or after the assessment date or a move_out_date on or before
          it
        value: K('pending_load_pct')
      - when: otherwise
        value: '100'
      baseline:
        status_pct: '100'
      evidence:
      - date
      cross_difficulty: null
      realism: R6 final-account schedule keyed on recorded closing dates
    - id: returned_instrument_points
      effect: parameter
      decides: instrument_pts
      bindings:
      - ret_method
      - instrument_pts
      ladder:
      - when: most recent payment_returned line has payment_method check
        value: K('check_pts')
      - when: it has payment_method ach
        value: K('ach_pts')
      - when: otherwise
        value: '0'
      baseline:
        instrument_pts: '0'
      evidence:
      - history
      cross_difficulty: null
      realism: R6 schedule keyed on the recorded returned-payment method
    - id: other_line_lateness_points
      effect: parameter
      decides: other_pts
      bindings:
      - other_late_n
      - other_pts
      ladder:
      - when: two or more late fee lines on the customer's home or biz subscriptions in the twelve months before
        value: K('other2_pts')
      - when: exactly one such line
        value: K('other1_pts')
      - when: otherwise
        value: '0'
      baseline:
        other_pts: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: biz
      realism: R6 customer-level payment history across lines
    baseline:
      rule: >-
        On a Garden Business plan, standard method: the fee is the unpaid amount of the charge multiplied by the rate
        late_fee_pct and divided by 100, rounded half up to the cent, then raised to late_fee_min_usd when lower and
        limited to late_fee_max_usd when higher.
      params:
      - late_fee_pct
      - late_fee_min_usd
      - late_fee_max_usd
    inputs:
      history:
      - table: garden_billing
        aggregate: latest
        field: amount
        filters:
          event_type: garden_charge_billed
      - table: garden_billing
        aggregate: sum
        field: amount
        filters:
          event_type: garden_payment_received
      - table: garden_billing
        aggregate: count
        field: garden_bill_id
        within_months: 12
        filters:
          event_type: garden_late_fee_assessed
      - category: biz
        table: biz_billing
        aggregate: count
        field: biz_bill_id
        within_months: 12
        filters:
          event_type: biz_late_fee_assessed
      - category: home
        table: home_billing
        aggregate: count
        field: home_bill_id
        within_months: 12
        filters:
          event_type: home_late_fee_assessed
      cross_category:
      - home
      - biz
  - id: garden_ext_business_excess_decrease_fee
    base_policy_refs:
    - garden_allocation_change
    overwrite:
    - base_policy: garden_allocation_change
      superseded_clause: >-
        Subscriber decreases in one contract year up to max_decrease_pct_per_contract_year of the allocation_kw held
        on the first day of that contract year carry no fee (garden_msr_subscriber_decrease_kw_contract_year totals
        them); each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed once per decrease
        request on the filing's effective_date and due invoice_due_days later.
      replaced_by: >-
        For the most recent subscriber decrease of a subscription on a Garden Business plan (Garden Business Fixed 15
        or Garden Business Fixed 25) the allowance and the fee are computed as this rule sets out; the same decrease
        of a subscription on a residential Garden plan (Garden Fixed 10, Garden Fixed 15, Garden Fixed 20 or Garden
        Fixed 25) is priced by the excess-decrease fee rule for residential Garden plans; every other subscriber decrease
        remains under the base rule, which reads: Subscriber decreases in one contract year up to max_decrease_pct_per_contract_year
        of the allocation_kw held on the first day of that contract year carry no fee (garden_msr_subscriber_decrease_kw_contract_year
        totals them); each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed once
        per decrease request on the filing's effective_date and due invoice_due_days later.
    trigger: state_due
    subject:
    - garden_change_fee_assessed
    computes: amount
    target_tool: assess_decrease_fee_e48668a1
    params:
      short_term_months: 60
      mid_term_months: 120
      allow_short_pct: 35
      allow_mid_pct: 25
      band_large_kw: 5
      band_mid_kw: 1
      band_large_pct: 85
      band_mid_pct: 95
      lead_long_days: 30
      lead_mid_days: 20
      lead_long_pct: 80
      lead_mid_pct: 90
      overlap_near_months: 12
      overlap_far_months: 24
      overlap_near_pct: 50
      overlap_far_pct: 75
    rule: >-
      This rule prices the excess-decrease fee of the most recent subscriber decrease of a subscription on a Garden
      Business plan (Garden Business Fixed 15 or Garden Business Fixed 25), and only that fee. For the most recent subscriber
      decrease of a subscription on a Garden Business plan (Garden Business Fixed 15 or Garden Business Fixed 25) the
      allowance and the fee are computed as this rule sets out; the same decrease of a subscription on a residential
      Garden plan (Garden Fixed 10, Garden Fixed 15, Garden Fixed 20 or Garden Fixed 25) is priced by the excess-decrease
      fee rule for residential Garden plans; every other subscriber decrease remains under the base rule, which reads:
      Subscriber decreases in one contract year up to max_decrease_pct_per_contract_year of the allocation_kw held on
      the first day of that contract year carry no fee (garden_msr_subscriber_decrease_kw_contract_year totals them);
      each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed once per decrease request
      on the filing's effective_date and due invoice_due_days later. On a Garden Business plan, the decrease concerned
      is the one carried out for the subscription's completed allocation_decrease request (outcome completed) with the
      latest received_date: its kW are the kW of the subscriber_decrease allocation lines filed for that request and
      its effective date is their effective_date; the allocation held before it is the kW of the subscription's filed
      allocation lines less the kW of its reduced allocation lines other than that decrease and any cancellation_removal
      or move_removal line of a closing; every Garden plan allows one subscriber change per contract year, so no earlier
      subscriber decrease falls in the same contract year. On a Garden Business plan, the fee is assessed once per decrease
      request on the filing's effective_date or, when it was not assessed on that day, on the day it is booked, and
      falls due invoice_due_days calendar days after its assessment date; its billing_month is the filing_month of the
      decrease; when the computed fee is 0.00 no fee line is written. Whole calendar months between two dates are the
      difference in calendar months, less one when the later date's day of the month is smaller than the earlier date's;
      no last-day-of-month substitution is made. On a Garden Business plan, standard method: the allowance is max_decrease_pct_per_contract_year
      percent of the allocation held before the decrease; the fee is the kW of the decrease beyond that allowance (nothing
      when the decrease is within it) multiplied by excess_decrease_fee_per_kw_usd, rounded half up to the cent. On
      a Garden Business plan, where one of the adjustments below applies, it acts on the matching element of the standard
      method: an allowance percentage or an allowance basis it gives replaces the standard one before the kW beyond
      the allowance are worked out, a per-kW fee it gives replaces excess_decrease_fee_per_kw_usd, and a percentage
      it gives multiplies the kW beyond the allowance times the per-kW fee; the rounding of the standard method applies
      last. On a Garden Business plan, allowance by position in the term: when fewer than short_term_months whole calendar
      months remain from the decrease's effective_date to term_end_date, the allowance percentage is allow_short_pct;
      when short_term_months or more but fewer than mid_term_months whole months remain, allow_mid_pct; otherwise max_decrease_pct_per_contract_year.
      On a Garden Business plan, per-kW fee by decrease size: when the decrease is band_large_kw kW or more, the per-kW
      fee is band_large_pct percent of excess_decrease_fee_per_kw_usd; when it is band_mid_kw kW or more but less than
      band_large_kw, band_mid_pct percent of it; otherwise excess_decrease_fee_per_kw_usd. On a Garden Business plan,
      advance notice of the decrease: when the decrease request's received_date lies lead_long_days or more calendar
      days before the decrease's effective_date, the fee is taken at lead_long_pct percent; when it lies lead_mid_days
      or more but fewer than lead_long_days calendar days before, at lead_mid_pct percent; otherwise in full.  On a
      Garden Business plan, allowance basis: when the subscription's initial allocation line is smaller than its contract_kw,
      the allowance is worked out on the contract_kw; when the initial line is not smaller than the contract_kw and
      the subscription has subscriber_increase lines, it is worked out on the allocation held before the decrease less
      the kW of those increase lines; otherwise on the allocation held before the decrease. On a Garden Business plan,
      decrease followed by a closing: when the subscription closed fewer than overlap_near_months whole calendar months
      after the decrease's effective_date, the fee is taken at overlap_near_pct percent; when it closed overlap_near_months
      or more but fewer than overlap_far_months whole months after, at overlap_far_pct percent; otherwise, or while
      the subscription is open, in full.
    prerequisite: []
    cross_category: []
    compute:
    - dec_request: LATEST('garden_requests','garden_request_id', date_field='received_date', request_type='allocation_decrease',
        outcome='completed') or ''
    - dec_date: LATEST('garden_allocations','effective_date', date_field='effective_date', event_type='garden_allocation_reduced',
        filing_reason='subscriber_decrease', garden_request_id=dec_request) or NOW
    - dec_kw: SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='subscriber_decrease',
        garden_request_id=dec_request)
    - held_before: SUM('garden_allocations','kw', event_type='garden_allocation_filed') - SUM('garden_allocations','kw',
        event_type='garden_allocation_reduced') + dec_kw + SUM('garden_allocations','kw', event_type='garden_allocation_reduced',
        filing_reason='cancellation_removal') + SUM('garden_allocations','kw', event_type='garden_allocation_reduced',
        filing_reason='move_removal')
    - term_left: MONTHS(dec_date, F('term_end_date'))
    - allow_pct: K('allow_short_pct') if term_left < K('short_term_months') else (K('allow_mid_pct') if term_left <
        K('mid_term_months') else P('max_decrease_pct_per_contract_year'))
    - initial_kw: LATEST('garden_allocations','kw', date_field='effective_date', event_type='garden_allocation_filed',
        filing_reason='initial') or 0
    - increase_kw: SUM('garden_allocations','kw', event_type='garden_allocation_filed', filing_reason='subscriber_increase')
    - allow_base: F('contract_kw') if initial_kw < F('contract_kw') else (held_before - increase_kw if increase_kw >
        0 else held_before)
    - size_kw: SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='subscriber_decrease',
        garden_request_id=dec_request)
    - fee_rate: P('excess_decrease_fee_per_kw_usd') * K('band_large_pct') / 100 if size_kw >= K('band_large_kw') else
        (P('excess_decrease_fee_per_kw_usd') * K('band_mid_pct') / 100 if size_kw >= K('band_mid_kw') else P('excess_decrease_fee_per_kw_usd'))
    - request_date: LATEST('garden_requests','received_date', date_field='received_date', garden_request_id=dec_request)
        or dec_date
    - request_lead: DAYS(request_date, dec_date)
    - lead_pct: K('lead_long_pct') if request_lead >= K('lead_long_days') else (K('lead_mid_pct') if request_lead >=
        K('lead_mid_days') else 100)
    - gap_months: MONTHS(dec_date, F('closed_date')) if (F('closed_date') or '') != '' else 9999
    - overlap_pct: K('overlap_near_pct') if gap_months < K('overlap_near_months') else (K('overlap_far_pct') if gap_months
        < K('overlap_far_months') else 100)
    - excess_kw: MX(0, dec_kw - allow_pct / 100 * allow_base)
    - fee_raw: excess_kw * fee_rate * lead_pct / 100 * overlap_pct / 100
    - result: RND(fee_raw + 0.000000001, 2)
    compute_basis:
      dec_request: >-
        On a Garden Business plan, the decrease concerned is the one carried out for the subscription's completed allocation_decrease
        request (outcome completed) with the latest received_date: its kW are the kW of the subscriber_decrease allocation
        lines filed for that request and its effective date is their effective_date; the allocation held before it is
        the kW of the subscription's filed allocation lines less the kW of its reduced allocation lines other than that
        decrease and any cancellation_removal or move_removal line of a closing; every Garden plan allows one subscriber
        change per contract year, so no earlier subscriber decrease falls in the same contract year.
      dec_date: >-
        On a Garden Business plan, the decrease concerned is the one carried out for the subscription's completed allocation_decrease
        request (outcome completed) with the latest received_date: its kW are the kW of the subscriber_decrease allocation
        lines filed for that request and its effective date is their effective_date; the allocation held before it is
        the kW of the subscription's filed allocation lines less the kW of its reduced allocation lines other than that
        decrease and any cancellation_removal or move_removal line of a closing; every Garden plan allows one subscriber
        change per contract year, so no earlier subscriber decrease falls in the same contract year.
      dec_kw: >-
        On a Garden Business plan, the decrease concerned is the one carried out for the subscription's completed allocation_decrease
        request (outcome completed) with the latest received_date: its kW are the kW of the subscriber_decrease allocation
        lines filed for that request and its effective date is their effective_date; the allocation held before it is
        the kW of the subscription's filed allocation lines less the kW of its reduced allocation lines other than that
        decrease and any cancellation_removal or move_removal line of a closing; every Garden plan allows one subscriber
        change per contract year, so no earlier subscriber decrease falls in the same contract year.
      held_before: >-
        On a Garden Business plan, the decrease concerned is the one carried out for the subscription's completed allocation_decrease
        request (outcome completed) with the latest received_date: its kW are the kW of the subscriber_decrease allocation
        lines filed for that request and its effective date is their effective_date; the allocation held before it is
        the kW of the subscription's filed allocation lines less the kW of its reduced allocation lines other than that
        decrease and any cancellation_removal or move_removal line of a closing; every Garden plan allows one subscriber
        change per contract year, so no earlier subscriber decrease falls in the same contract year.
      term_left: >-
        Whole calendar months between two dates are the difference in calendar months, less one when the later date's
        day of the month is smaller than the earlier date's; no last-day-of-month substitution is made.
      allow_pct: >-
        On a Garden Business plan, allowance by position in the term: when fewer than short_term_months whole calendar
        months remain from the decrease's effective_date to term_end_date, the allowance percentage is allow_short_pct;
        when short_term_months or more but fewer than mid_term_months whole months remain, allow_mid_pct; otherwise
        max_decrease_pct_per_contract_year.
      initial_kw: >-
        On a Garden Business plan, allowance basis: when the subscription's initial allocation line is smaller than
        its contract_kw, the allowance is worked out on the contract_kw; when the initial line is not smaller than the
        contract_kw and the subscription has subscriber_increase lines, it is worked out on the allocation held before
        the decrease less the kW of those increase lines; otherwise on the allocation held before the decrease.
      increase_kw: >-
        On a Garden Business plan, allowance basis: when the subscription's initial allocation line is smaller than
        its contract_kw, the allowance is worked out on the contract_kw; when the initial line is not smaller than the
        contract_kw and the subscription has subscriber_increase lines, it is worked out on the allocation held before
        the decrease less the kW of those increase lines; otherwise on the allocation held before the decrease.
      allow_base: >-
        On a Garden Business plan, allowance basis: when the subscription's initial allocation line is smaller than
        its contract_kw, the allowance is worked out on the contract_kw; when the initial line is not smaller than the
        contract_kw and the subscription has subscriber_increase lines, it is worked out on the allocation held before
        the decrease less the kW of those increase lines; otherwise on the allocation held before the decrease.
      size_kw: >-
        On a Garden Business plan, per-kW fee by decrease size: when the decrease is band_large_kw kW or more, the per-kW
        fee is band_large_pct percent of excess_decrease_fee_per_kw_usd; when it is band_mid_kw kW or more but less
        than band_large_kw, band_mid_pct percent of it; otherwise excess_decrease_fee_per_kw_usd.
      fee_rate: >-
        On a Garden Business plan, per-kW fee by decrease size: when the decrease is band_large_kw kW or more, the per-kW
        fee is band_large_pct percent of excess_decrease_fee_per_kw_usd; when it is band_mid_kw kW or more but less
        than band_large_kw, band_mid_pct percent of it; otherwise excess_decrease_fee_per_kw_usd.
      request_date: "On a Garden Business plan, advance notice of the decrease: when the decrease request's received_date\
        \ lies lead_long_days or more calendar days before the decrease's effective_date, the fee is taken at lead_long_pct\
        \ percent; when it lies lead_mid_days or more but fewer than lead_long_days calendar days before, at lead_mid_pct\
        \ percent; otherwise in full. "
      request_lead: "On a Garden Business plan, advance notice of the decrease: when the decrease request's received_date\
        \ lies lead_long_days or more calendar days before the decrease's effective_date, the fee is taken at lead_long_pct\
        \ percent; when it lies lead_mid_days or more but fewer than lead_long_days calendar days before, at lead_mid_pct\
        \ percent; otherwise in full. "
      lead_pct: "On a Garden Business plan, advance notice of the decrease: when the decrease request's received_date\
        \ lies lead_long_days or more calendar days before the decrease's effective_date, the fee is taken at lead_long_pct\
        \ percent; when it lies lead_mid_days or more but fewer than lead_long_days calendar days before, at lead_mid_pct\
        \ percent; otherwise in full. "
      gap_months: >-
        On a Garden Business plan, decrease followed by a closing: when the subscription closed fewer than overlap_near_months
        whole calendar months after the decrease's effective_date, the fee is taken at overlap_near_pct percent; when
        it closed overlap_near_months or more but fewer than overlap_far_months whole months after, at overlap_far_pct
        percent; otherwise, or while the subscription is open, in full.
      overlap_pct: >-
        On a Garden Business plan, decrease followed by a closing: when the subscription closed fewer than overlap_near_months
        whole calendar months after the decrease's effective_date, the fee is taken at overlap_near_pct percent; when
        it closed overlap_near_months or more but fewer than overlap_far_months whole months after, at overlap_far_pct
        percent; otherwise, or while the subscription is open, in full.
      excess_kw: >-
        On a Garden Business plan, standard method: the allowance is max_decrease_pct_per_contract_year percent of the
        allocation held before the decrease; the fee is the kW of the decrease beyond that allowance (nothing when the
        decrease is within it) multiplied by excess_decrease_fee_per_kw_usd, rounded half up to the cent.
      fee_raw: >-
        On a Garden Business plan, where one of the adjustments below applies, it acts on the matching element of the
        standard method: an allowance percentage or an allowance basis it gives replaces the standard one before the
        kW beyond the allowance are worked out, a per-kW fee it gives replaces excess_decrease_fee_per_kw_usd, and a
        percentage it gives multiplies the kW beyond the allowance times the per-kW fee; the rounding of the standard
        method applies last.
      result: >-
        On a Garden Business plan, standard method: the allowance is max_decrease_pct_per_contract_year percent of the
        allocation held before the decrease; the fee is the kW of the decrease beyond that allowance (nothing when the
        decrease is within it) multiplied by excess_decrease_fee_per_kw_usd, rounded half up to the cent.
    factors:
    - id: term_position_allowance
      effect: parameter
      decides: allow_pct
      bindings:
      - term_left
      - allow_pct
      ladder:
      - when: fewer than short_term_months whole months from the effective_date to term_end_date
        value: K('allow_short_pct')
      - when: short_term_months or more but fewer than mid_term_months
        value: K('allow_mid_pct')
      - when: otherwise
        value: P('max_decrease_pct_per_contract_year')
      baseline:
        allow_pct: P('max_decrease_pct_per_contract_year')
      evidence:
      - date
      - tier_param
      cross_difficulty: null
      realism: R2 months remaining on the term
    - id: decrease_size_rate
      effect: parameter
      decides: fee_rate
      bindings:
      - size_kw
      - fee_rate
      ladder:
      - when: decrease >= band_large_kw kW
        value: P('excess_decrease_fee_per_kw_usd') * K('band_large_pct') / 100
      - when: decrease >= band_mid_kw and < band_large_kw
        value: P('excess_decrease_fee_per_kw_usd') * K('band_mid_pct') / 100
      - when: otherwise
        value: P('excess_decrease_fee_per_kw_usd')
      baseline:
        fee_rate: P('excess_decrease_fee_per_kw_usd')
      evidence:
      - history
      - tier_param
      cross_difficulty: null
      realism: R1 size-band schedule
    - id: advance_request_terms
      effect: parameter
      decides: lead_pct
      bindings:
      - request_date
      - request_lead
      - lead_pct
      ladder:
      - when: decrease request received lead_long_days or more days before the effective_date
        value: K('lead_long_pct')
      - when: lead_mid_days or more but fewer than lead_long_days
        value: K('lead_mid_pct')
      - when: otherwise
        value: '100'
      baseline:
        lead_pct: '100'
      evidence:
      - history
      - date
      cross_difficulty: null
      realism: R2 notice lead before the filing
    - id: allowance_basis_rule
      effect: method
      decides: allow_base
      bindings:
      - initial_kw
      - increase_kw
      - allow_base
      ladder:
      - when: initial allocation line smaller than contract_kw
        method: allowance worked out on contract_kw
      - when: initial line not smaller than contract_kw and subscriber_increase lines exist
        method: allowance worked out on the allocation held before the decrease less the increase kW
      - when: otherwise
        method: allowance worked out on the allocation held before the decrease
      baseline:
        allow_base: held_before
      evidence:
      - history
      cross_difficulty: null
      realism: 'R6 allowance basis net of earlier subscriber increases (catalogue: no unused honest method lever)'
    - id: closing_overlap_share
      effect: parameter
      decides: overlap_pct
      bindings:
      - gap_months
      - overlap_pct
      ladder:
      - when: closed fewer than overlap_near_months whole months after the decrease effective_date
        value: K('overlap_near_pct')
      - when: closed overlap_near_months or more but fewer than overlap_far_months after
        value: K('overlap_far_pct')
      - when: otherwise or still open
        value: '100'
      baseline:
        overlap_pct: '100'
      evidence:
      - date
      cross_difficulty: null
      realism: 'R6 no double recovery with the termination fee (catalogue: no unused honest lever)'
    baseline:
      rule: >-
        On a Garden Business plan, standard method: the allowance is max_decrease_pct_per_contract_year percent of the
        allocation held before the decrease; the fee is the kW of the decrease beyond that allowance (nothing when the
        decrease is within it) multiplied by excess_decrease_fee_per_kw_usd, rounded half up to the cent.
      params:
      - max_decrease_pct_per_contract_year
      - excess_decrease_fee_per_kw_usd
    inputs:
      history:
      - table: garden_allocations
        aggregate: latest
        field: kw
        filters:
          event_type: garden_allocation_reduced
          filing_reason: subscriber_decrease
      - table: garden_allocations
        aggregate: sum
        field: kw
        filters:
          event_type: garden_allocation_filed
      cross_category: []
  - id: garden_ext_residential_settlement_payment
    base_policy_refs:
    - garden_evt_payment_application
    - garden_benefit_basis
    - garden_evt_credit_correction
    - garden_evt_subscription_charge
    overwrite: []
    trigger: on_request
    subject:
    - garden_payment_received
    computes: amount
    target_tool: pay_garden_settlement_8237cc21
    params:
      defer_noterm_pct: 50
    rule: >-
      This rule fixes the settlement amount a subscriber on a residential Garden plan (Garden Fixed 10, Garden Fixed
      15, Garden Fixed 20 or Garden Fixed 25) pays in person to settle a subscription, and only that amount; a subscriber
      on a Garden Business plan (Garden Business Fixed 15 or Garden Business Fixed 25) settles under the settlement
      rule for business Garden plans. On a residential Garden plan, meadowlark representatives never take card or bank
      account numbers and no payment method is held on file: the subscriber makes the settlement payment personally
      through the secure payment portal by ach or card, and the payment is recorded on the subscription with billing_month
      the month of the payment date; what the payment covers is settled under payment application, and a part of it
      that covers no open line stays on the subscription for the line it was taken for. A household's settlement amount
      is not fixed until the share's billing ledger carries the early termination fee line owed for the share's closing.
      A household's settlement amount is fixed only after the share's billing ledger carries the late fee owed on the
      charge its most recent returned payment re-opened. Before a household's settlement amount is worked out, the share's
      billing ledger must carry the excess-decrease fee line owed for the share's most recent subscriber decrease. On
      a residential Garden plan, whole calendar months between two dates are the difference in calendar months, less
      one when the later date's day of the month is smaller than the earlier date's; no last-day-of-month substitution
      is made. On a residential Garden plan, standard method: the settlement amount is the sum of the subscription's
      charge, late fee, returned-payment fee, early termination fee and excess-decrease fee lines whose due_date is
      on or before the payment date, plus its payment_returned lines, less its payment and billing credit lines, rounded
      half up to the cent. On a residential Garden plan, where one of the adjustments below applies, it acts on the
      standard amount: a line scope it gives replaces the lines due on or before the payment date, an amount it adds
      is added, and an amount it holds back is deducted, the result never falling below zero; the rounding of the standard
      method applies last. On a residential Garden plan, line scope at closing: when the subscription is in closed status,
      the settlement takes every charge, late fee, returned-payment fee, early termination fee and excess-decrease fee
      line whatever its due_date; when it is in notice_given or transfer_pending status, every such line whose bill_date
      is on or before the payment date; otherwise the lines due on or before the payment date. On a residential Garden
      plan, statement already reported but not yet invoiced: the most recently posted credit statement (the posted line
      with the latest posted_date) is not yet invoiced when no actual charge carries its billing_month; when the subscription
      is in closed status and that statement is not yet invoiced, the settlement adds its charge as the charge rule
      will price it, credited_kwh times contract_rate_per_kwh increased by annual_escalator_pct once for every complete
      contract year elapsed on its posted_date, compounded and rounded half up to four decimals, the product rounded
      half up to the cent; when the subscription is in notice_given or transfer_pending status and that statement is
      not yet invoiced, the settlement adds credited_kwh times the per-kWh rate of the latest actual charge (its amount
      divided by the credited_kwh of the statement it priced), rounded half up to the cent; otherwise nothing is added.
      The payment then settles that charge when it is invoiced. On a residential Garden plan, open billing dispute:
      the dispute concerned is the subscription's billing_dispute request with outcome received and the latest received_date;
      when it was received fewer than dispute_resolution_days calendar days before the payment date, the amount of the
      disputed line is held back from the settlement; when it was received dispute_resolution_days or more calendar
      days before, the amount of the disputed line and of the late fee lines referring to it are held back; otherwise
      nothing is held back. On a residential Garden plan, early termination fee of a share moved to another Meadowlark
      line: the moved kW are the kW of the initial allocation lines of the customer's residential and small business
      subscriptions whose filing_month equals the filing_month of the closing's removal lines, and the moved subscription
      is the one whose such line takes effect latest; when the early termination fee line is not yet due on the payment
      date, moved kW exist and the moved plan carries a committed term (term_months greater than 0), the whole early
      termination fee line is held back to its due date; when it is not yet due, moved kW exist and the moved plan carries
      no committed term, defer_noterm_pct percent of that line is held back to its due date; otherwise nothing is held
      back.
    prerequisite:
    - problem: garden_ext_residential_etf
      kind: value_input
      gate: lines_all
      form: state
      policy_source: >-
        A household's settlement amount is not fixed until the share's billing ledger carries the early termination
        fee line owed for the share's closing.
      condition: >-
        The subscription billing ledger holds a garden_etf_assessed line for its closing.
      resolved_by: assess_closing_etf_e3af903e
      effect: >-
        The early termination fee line enters the sum of lines; the moved-share deferral reads the same line.
    - problem: garden_ext_residential_returned_late_fee
      kind: value_input
      gate: lines_all
      form: state
      policy_source: >-
        A household's settlement amount is fixed only after the share's billing ledger carries the late fee owed on
        the charge its most recent returned payment re-opened.
      condition: >-
        The billing ledger holds a garden_late_fee_assessed line referring to the charge the most recent payment_returned
        line re-opened.
      resolved_by: assess_reopened_late_fee_3e91b283
      effect: >-
        The late fee line enters the sum of lines, raising the settlement amount by the fee.
    - problem: garden_ext_residential_excess_decrease_fee
      kind: value_input
      gate: lines_all
      form: state
      policy_source: >-
        Before a household's settlement amount is worked out, the share's billing ledger must carry the excess-decrease
        fee line owed for the share's most recent subscriber decrease.
      condition: >-
        The billing ledger holds a garden_change_fee_assessed line for the most recent subscriber_decrease filing.
      resolved_by: assess_decrease_fee_99d02cc8
      effect: >-
        The excess-decrease fee line enters the sum of lines, raising the settlement amount by the fee.
    cross_category:
    - category: home
      as: history
      reads:
      - home_allocations.kw
      - home_allocations.filing_month
      - home_allocations.home_sub_id
      - variant_name
      note: moved_share_deferral tier from residential initial filings in the removal filing month
    - category: biz
      as: history
      reads:
      - biz_allocations.kw
      - biz_allocations.filing_month
      - biz_allocations.biz_sub_id
      - variant_name
      note: moved_share_deferral tier from small business initial filings in the removal filing month
    compute:
    - returned_total: SUM('garden_billing','amount', event_type='garden_payment_returned')
    - paid_total: SUM('garden_billing','amount', event_type='garden_payment_received')
    - credit_total: SUM('garden_billing','amount', event_type='garden_billing_credited')
    - lines_due: SUM('garden_billing','amount', within_months=9999, date_field='due_date', event_type='garden_charge_billed')
        + SUM('garden_billing','amount', within_months=9999, date_field='due_date', event_type='garden_late_fee_assessed')
        + SUM('garden_billing','amount', within_months=9999, date_field='due_date', event_type='garden_returned_fee_assessed')
        + SUM('garden_billing','amount', within_months=9999, date_field='due_date', event_type='garden_etf_assessed')
        + SUM('garden_billing','amount', within_months=9999, date_field='due_date', event_type='garden_change_fee_assessed')
    - lines_billed: SUM('garden_billing','amount', within_months=9999, date_field='bill_date', event_type='garden_charge_billed')
        + SUM('garden_billing','amount', within_months=9999, date_field='bill_date', event_type='garden_late_fee_assessed')
        + SUM('garden_billing','amount', within_months=9999, date_field='bill_date', event_type='garden_returned_fee_assessed')
        + SUM('garden_billing','amount', within_months=9999, date_field='bill_date', event_type='garden_etf_assessed')
        + SUM('garden_billing','amount', within_months=9999, date_field='bill_date', event_type='garden_change_fee_assessed')
    - lines_all: SUM('garden_billing','amount', event_type='garden_charge_billed') + SUM('garden_billing','amount',
        event_type='garden_late_fee_assessed') + SUM('garden_billing','amount', event_type='garden_returned_fee_assessed')
        + SUM('garden_billing','amount', event_type='garden_etf_assessed') + SUM('garden_billing','amount', event_type='garden_change_fee_assessed')
    - line_sum: lines_all if F('status') == 'closed' else (lines_billed if (F('status') == 'notice_given' or F('status')
        == 'transfer_pending') else lines_due)
    - st_month: LATEST('garden_credits','statement_month', date_field='posted_date', event_type='garden_credit_posted')
        or ''
    - st_kwh: LATEST('garden_credits','credited_kwh', date_field='posted_date', event_type='garden_credit_posted') or
        0
    - st_posted: LATEST('garden_credits','posted_date', date_field='posted_date', event_type='garden_credit_posted')
        or NOW
    - st_billed: COUNT('garden_billing', event_type='garden_charge_billed', charge_basis='actual', billing_month=st_month)
    - st_rate: RND(F('contract_rate_per_kwh') * (1 + P('annual_escalator_pct') / 100) ** (MONTHS(F('activation_date'),
        st_posted) // 12) + 0.000000001, 4)
    - last_amt: LATEST('garden_billing','amount', date_field='bill_date', event_type='garden_charge_billed', charge_basis='actual')
        or 0
    - last_kwh: LATEST('garden_credits','credited_kwh', date_field='posted_date', garden_credit_id=LATEST('garden_billing','garden_credit_id',
        date_field='bill_date', event_type='garden_charge_billed', charge_basis='actual')) or 1
    - prepay: RND(st_kwh * st_rate + 0.000000001, 2) if (F('status') == 'closed' and st_billed == 0 and st_month !=
        '') else (RND(st_kwh * last_amt / last_kwh + 0.000000001, 2) if ((F('status') == 'notice_given' or F('status')
        == 'transfer_pending') and st_billed == 0 and st_month != '') else 0)
    - d_bill: LATEST('garden_requests','garden_disputed_bill_id', date_field='received_date', request_type='billing_dispute',
        outcome='received') or ''
    - d_recv: LATEST('garden_requests','received_date', date_field='received_date', request_type='billing_dispute',
        outcome='received') or ''
    - d_days: DAYS(d_recv, NOW) if d_recv != '' else -1
    - d_amt: SUM('garden_billing','amount', garden_bill_id=d_bill)
    - d_late: SUM('garden_billing','amount', event_type='garden_late_fee_assessed', garden_ref_bill_id=d_bill)
    - dispute_hold: d_amt if (d_bill != '' and d_days >= 0 and d_days < P('dispute_resolution_days')) else (d_amt +
        d_late if (d_bill != '' and d_days >= P('dispute_resolution_days')) else 0)
    - rem_month: LATEST('garden_allocations','filing_month', date_field='effective_date', event_type='garden_allocation_reduced',
        filing_reason='cancellation_removal') or LATEST('garden_allocations','filing_month', date_field='effective_date',
        event_type='garden_allocation_reduced', filing_reason='move_removal') or LATEST('garden_allocations','filing_month',
        date_field='effective_date', event_type='garden_allocation_reduced', filing_reason='nonpayment_removal') or
        ''
    - mv_kw: XSUM('home','home_allocations','kw', event_type='home_allocation_filed', filing_reason='initial', filing_month=rem_month)
        + XSUM('biz','biz_allocations','kw', event_type='biz_allocation_filed', filing_reason='initial', filing_month=rem_month)
