      lead_days: >-
        On a Garden Business plan, percentage by request lead time: when the request date lies lead_long_days or more
        calendar days before the closing date, the product is taken at lead_long_pct percent; when it lies lead_mid_days
        or more but fewer than lead_long_days calendar days before, at lead_mid_pct percent; otherwise, or when the
        closing has no request date, in full. The lead time is the calendar days from the request date to the closing
        date.
      lead_pct: >-
