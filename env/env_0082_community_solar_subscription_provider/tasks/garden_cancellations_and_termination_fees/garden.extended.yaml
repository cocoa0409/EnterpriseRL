    baseline:
      rule: >-
        On a residential Garden plan, standard method: the fee is the kW removed by the removal lines of the closing
        (the allocation lines with filing_reason cancellation_removal, move_removal or nonpayment_removal, together
        being the share held on the day before closing), multiplied by the plan's etf_per_kw_per_remaining_year_usd
        and by the remaining contract years. On a residential Garden plan, the remaining contract years are the whole
        calendar months from the closing date to term_end_date, divided by twelve and rounded down, plus one for the
        part year in progress. On a residential Garden plan, the fee is rounded half up to the cent and then limited
        to the plan's etf_cap_usd.
