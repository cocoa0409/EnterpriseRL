      form_v2_days: >-
        On a Garden Business plan, percentage by agreement form: the termination schedule is that of the agreement form
        in force on the signed_date; when the signed_date is before form_v2_date, the product is taken at form_v1_pct
        percent; when it is on or after form_v2_date but before form_v3_date, at form_v2_pct percent; otherwise in full.
      form_v3_days: >-
        On a Garden Business plan, percentage by agreement form: the termination schedule is that of the agreement form
        in force on the signed_date; when the signed_date is before form_v2_date, the product is taken at form_v1_pct
