  - id: garden_ext_residential_excess_decrease_fee
    base_policy_refs:
    - garden_allocation_change
    overwrite:
    - base_policy: garden_allocation_change
      superseded_clause: >-
        Subscriber decreases in one contract year up to max_decrease_pct_per_contract_year of the allocation_kw held
        on the first day of that contract year carry no fee (garden_msr_subscriber_decrease_kw_contract_year totals
        them); each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed once per decrease
        request on the filing's effective_date and due invoice_due_days later.
      replaced_by: >-
        For the most recent subscriber decrease of a subscription on a residential Garden plan (Garden Fixed 10, Garden
        Fixed 15, Garden Fixed 20 or Garden Fixed 25) the allowance and the fee are computed as this rule sets out;
        the same decrease of a subscription on a Garden Business plan (Garden Business Fixed 15 or Garden Business Fixed
        25) is priced by the excess-decrease fee rule for business Garden plans; every other subscriber decrease remains
        under the base rule, which reads: Subscriber decreases in one contract year up to max_decrease_pct_per_contract_year
        of the allocation_kw held on the first day of that contract year carry no fee (garden_msr_subscriber_decrease_kw_contract_year
        totals them); each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed once
        per decrease request on the filing's effective_date and due invoice_due_days later.
    trigger: state_due
    subject:
    - garden_change_fee_assessed
    computes: amount
    target_tool: assess_decrease_fee_99d02cc8
    params:
      short_term_months: 60
      mid_term_months: 120
      allow_short_pct: 35
      allow_mid_pct: 25
      band_large_kw: 5
      band_mid_kw: 1
      band_large_pct: 85
      band_mid_pct: 95
      lead_long_days: 30
      lead_mid_days: 20
      lead_long_pct: 80
      lead_mid_pct: 90
      overlap_near_months: 12
      overlap_far_months: 24
      overlap_near_pct: 50
      overlap_far_pct: 75
    rule: >-
      This rule prices the excess-decrease fee of the most recent subscriber decrease of a subscription on a residential
      Garden plan (Garden Fixed 10, Garden Fixed 15, Garden Fixed 20 or Garden Fixed 25), and only that fee. For the
      most recent subscriber decrease of a subscription on a residential Garden plan (Garden Fixed 10, Garden Fixed
      15, Garden Fixed 20 or Garden Fixed 25) the allowance and the fee are computed as this rule sets out; the same
      decrease of a subscription on a Garden Business plan (Garden Business Fixed 15 or Garden Business Fixed 25) is
      priced by the excess-decrease fee rule for business Garden plans; every other subscriber decrease remains under
      the base rule, which reads: Subscriber decreases in one contract year up to max_decrease_pct_per_contract_year
      of the allocation_kw held on the first day of that contract year carry no fee (garden_msr_subscriber_decrease_kw_contract_year
      totals them); each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed once per
      decrease request on the filing's effective_date and due invoice_due_days later. On a residential Garden plan,
      the decrease concerned is the one carried out for the subscription's completed allocation_decrease request (outcome
      completed) with the latest received_date: its kW are the kW of the subscriber_decrease allocation lines filed
      for that request and its effective date is their effective_date; the allocation held before it is the kW of the
      subscription's filed allocation lines less the kW of its reduced allocation lines other than that decrease and
      any cancellation_removal or move_removal line of a closing; every Garden plan allows one subscriber change per
      contract year, so no earlier subscriber decrease falls in the same contract year. On a residential Garden plan,
      the fee is assessed once per decrease request on the filing's effective_date or, when it was not assessed on that
      day, on the day it is booked, and falls due invoice_due_days calendar days after its assessment date; its billing_month
      is the filing_month of the decrease; when the computed fee is 0.00 no fee line is written. Whole calendar months
      between two dates are the difference in calendar months, less one when the later date's day of the month is smaller
      than the earlier date's; no last-day-of-month substitution is made. On a residential Garden plan, standard method:
      the allowance is max_decrease_pct_per_contract_year percent of the allocation held before the decrease; the fee
      is the kW of the decrease beyond that allowance (nothing when the decrease is within it) multiplied by excess_decrease_fee_per_kw_usd,
      rounded half up to the cent. On a residential Garden plan, where one of the adjustments below applies, it acts
      on the matching element of the standard method: an allowance percentage or an allowance basis it gives replaces
      the standard one before the kW beyond the allowance are worked out, a per-kW fee it gives replaces excess_decrease_fee_per_kw_usd,
      and a percentage it gives multiplies the kW beyond the allowance times the per-kW fee; the rounding of the standard
      method applies last. On a residential Garden plan, allowance by position in the term: when fewer than short_term_months
      whole calendar months remain from the decrease's effective_date to term_end_date, the allowance percentage is
      allow_short_pct; when short_term_months or more but fewer than mid_term_months whole months remain, allow_mid_pct;
      otherwise max_decrease_pct_per_contract_year. On a residential Garden plan, per-kW fee by decrease size: when
      the decrease is band_large_kw kW or more, the per-kW fee is band_large_pct percent of excess_decrease_fee_per_kw_usd;
      when it is band_mid_kw kW or more but less than band_large_kw, band_mid_pct percent of it; otherwise excess_decrease_fee_per_kw_usd.
      On a residential Garden plan, advance notice of the decrease: when the decrease request's received_date lies lead_long_days
      or more calendar days before the decrease's effective_date, the fee is taken at lead_long_pct percent; when it
      lies lead_mid_days or more but fewer than lead_long_days calendar days before, at lead_mid_pct percent; otherwise
      in full.  On a residential Garden plan, allowance basis: when the subscription's initial allocation line is smaller
      than its contract_kw, the allowance is worked out on the contract_kw; when the initial line is not smaller than
      the contract_kw and the subscription has subscriber_increase lines, it is worked out on the allocation held before
      the decrease less the kW of those increase lines; otherwise on the allocation held before the decrease. On a residential
      Garden plan, decrease followed by a closing: when the subscription closed fewer than overlap_near_months whole
      calendar months after the decrease's effective_date, the fee is taken at overlap_near_pct percent; when it closed
      overlap_near_months or more but fewer than overlap_far_months whole months after, at overlap_far_pct percent;
      otherwise, or while the subscription is open, in full.
    prerequisite: []
    cross_category: []
    compute:
    - dec_request: LATEST('garden_requests','garden_request_id', date_field='received_date', request_type='allocation_decrease',
        outcome='completed') or ''
    - dec_date: LATEST('garden_allocations','effective_date', date_field='effective_date', event_type='garden_allocation_reduced',
        filing_reason='subscriber_decrease', garden_request_id=dec_request) or NOW
    - dec_kw: SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='subscriber_decrease',
        garden_request_id=dec_request)
    - held_before: SUM('garden_allocations','kw', event_type='garden_allocation_filed') - SUM('garden_allocations','kw',
        event_type='garden_allocation_reduced') + dec_kw + SUM('garden_allocations','kw', event_type='garden_allocation_reduced',
        filing_reason='cancellation_removal') + SUM('garden_allocations','kw', event_type='garden_allocation_reduced',
        filing_reason='move_removal')
    - term_left: MONTHS(dec_date, F('term_end_date'))
    - allow_pct: K('allow_short_pct') if term_left < K('short_term_months') else (K('allow_mid_pct') if term_left <
        K('mid_term_months') else P('max_decrease_pct_per_contract_year'))
    - initial_kw: LATEST('garden_allocations','kw', date_field='effective_date', event_type='garden_allocation_filed',
        filing_reason='initial') or 0
    - increase_kw: SUM('garden_allocations','kw', event_type='garden_allocation_filed', filing_reason='subscriber_increase')
    - allow_base: F('contract_kw') if initial_kw < F('contract_kw') else (held_before - increase_kw if increase_kw >
        0 else held_before)
    - size_kw: SUM('garden_allocations','kw', event_type='garden_allocation_reduced', filing_reason='subscriber_decrease',
        garden_request_id=dec_request)
    - fee_rate: P('excess_decrease_fee_per_kw_usd') * K('band_large_pct') / 100 if size_kw >= K('band_large_kw') else
        (P('excess_decrease_fee_per_kw_usd') * K('band_mid_pct') / 100 if size_kw >= K('band_mid_kw') else P('excess_decrease_fee_per_kw_usd'))
    - request_date: LATEST('garden_requests','received_date', date_field='received_date', garden_request_id=dec_request)
        or dec_date
    - request_lead: DAYS(request_date, dec_date)
    - lead_pct: K('lead_long_pct') if request_lead >= K('lead_long_days') else (K('lead_mid_pct') if request_lead >=
        K('lead_mid_days') else 100)
    - gap_months: MONTHS(dec_date, F('closed_date')) if (F('closed_date') or '') != '' else 9999
    - overlap_pct: K('overlap_near_pct') if gap_months < K('overlap_near_months') else (K('overlap_far_pct') if gap_months
        < K('overlap_far_months') else 100)
    - excess_kw: MX(0, dec_kw - allow_pct / 100 * allow_base)
    - fee_raw: excess_kw * fee_rate * lead_pct / 100 * overlap_pct / 100
    - result: RND(fee_raw + 0.000000001, 2)
    compute_basis:
