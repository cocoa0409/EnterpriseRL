- id: access_transfer_at_move
  subject: [access_transfer_requested, access_transfer_completed, access_transfer_lapsed, access_allocation_reassigned,
    access_successor_assigned]
  rule: >-
    A subscriber who moves may keep the share by transferring it to a new utility account in their own
    name. A move transfer is accepted only when its request is received no later than transfer_window_days
    calendar days after the move-out date the subscriber states. Calendar days are counted from the day
    after the stated move-out date; the last window day still qualifies. The new account must be on file,
    active, carry a data_authorization_date and be served by the same utility as the project, because
    an allocation can only be credited inside the project's utility territory. The reassignment is filed
    under the filing calendar of access_allocation_change, counted from the request's received_date, and
    the subscription returns to active on its effective date with the new utility_account_id. When transfer_resize_to_new_usage
    is true and the new account's sizing limit (access_agg_account_sizing) is below the share's expected
    production, the excess kW, sized up to a whole multiple of allocation_increment_kw, is removed in
    the same filing as a move_resize reduction, without fee and outside the yearly change allowance; when
    the remaining share would be below min_allocation_kw the transfer is not completed. Credits for statement
    months before the reassignment take effect are priced normally. When the new address is served by
    a different utility, or no qualifying new account is supplied within the window, the transfer lapses:
    the share is removed under the filing calendar and the subscription closes with closure_reason moved_out_of_territory
    (different utility) or transfer_not_completed; the early termination fee of access_cancellation applies
    unless waived there. A subscriber leaving the territory may join the Relocation Priority Waitlist
    for a Meadowlark project serving the new utility. When successor_transfer_allowed is true, the subscriber
    may instead assign the agreement to a successor who meets the plan's enrollment requirements on the
    same project; the successor signs a new agreement on the same plan for the remaining term, and the
    original closes with closure_reason successor_transfer. Access eligibility follows the household,
    except on two tracks that depend on the address: on the geographic_eligibility track a transfer is
    completed only when the new utility account's designated_community is not none, and on the assistance_program_enrollment
    track only when the new account's assistance_program_enrolled is true or the household is verified
    again under income_documentation; otherwise the transfer lapses with closure_reason eligibility_lapsed
    and no fee.
  eligibility:
  - id: within_transfer_window
    applies_to: [access_transfer_requested, access_transfer_completed]
    kind: time
    condition: >-
      A move transfer is accepted only when its request is received no later than transfer_window_days
      calendar days after the move-out date the subscriber states.
    evidence_fields: [access_subscriptions.move_out_date, access_requests.received_date, access_subscriptions.access_sub_id,
      access_requests.access_request_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [access_subscriptions.access_sub_id, access_requests.access_request_id]
      action_bindings: {access_subscriptions.access_sub_id: access_sub_id, access_requests.access_request_id: access_request_id}
    temporal_basis: {clock: frozen_time, anchor_event: the move-out date the subscriber states, anchor_source: access_subscriptions.move_out_date,
      relation: not_after, duration_source: variants.transfer_window_days, unit: calendar_days, counting_rule: Calendar
        days are counted from the day after the stated move-out date; the last window day still qualifies.,
      boundary: inclusive}
  params:
    per_tier:
      Meadowlark Access 15: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Meadowlark Access 20: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Meadowlark Access 25: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Meadowlark Access Housing 20: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Meadowlark Access Neighborhood 15: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Meadowlark Access Solar for All 50: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
- id: access_cancellation
  subject: [access_notice_given, access_notice_withdrawn, access_closed, access_preactivation_cancelled,
    access_etf_assessed]
  rule: >-
    A subscriber may cancel at any time by notice. A cancellation removal takes effect no earlier than
    cancellation_notice_days calendar days after the subscriber gives notice of cancellation. Calendar
    days are counted from the day after the notice_date; the removal may take effect on the last notice
    day. The scheduled_end_date is the effective date of the first filing under the filing calendar of
    access_allocation_change whose effective date falls on or after the notice_date plus cancellation_notice_days;
    the removal is filed for that date and the subscription closes on it. A notice may be withdrawn up
    to the cutoff day of the filing that would carry the removal. Before activation (status allocated)
    the subscriber cancels without notice period, the removal is filed in the next filing and preactivation_cancel_fee_usd
    is the only fee (none when 0.00). Early termination fee: when term_months is greater than 0 and the
    closing date is on or before term_end_date, the fee is allocation_kw held on the day before closing
    multiplied by etf_per_kw_per_remaining_year_usd and by the remaining contract years (access_msr_remaining_contract_years:
    contract years from the closing date through term_end_date, a part year counting as a whole year),
    rounded half up to the cent and limited to etf_cap_usd; it is assessed on the closing date and due
    invoice_due_days later. An early termination fee is assessed at most once per subscription. No fee
    applies after the term, on plans without a term, when etf_waiver_deceased is true and the subscription
    closes with closure_reason deceased on notice from the estate, when etf_waiver_out_of_territory_move
    is true and the subscription closes with closure_reason moved_out_of_territory, or when etf_waiver_successor_transfer
    is true and it closes with closure_reason successor_transfer. Access plans carry no committed term,
    so no early termination fee arises on them. Credits for statement months up to the closing date that
    post later are priced normally; a balance left after closing remains due.
  eligibility:
  - id: notice_period_served
    applies_to: [access_closed]
    kind: time
    condition: >-
      A cancellation removal takes effect no earlier than cancellation_notice_days calendar days after
      the subscriber gives notice of cancellation.
    evidence_fields: [access_subscriptions.notice_date, access_subscriptions.access_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_subscriptions.access_sub_id]
      action_bindings: {access_subscriptions.access_sub_id: access_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the subscriber gives notice of cancellation
      anchor_source: access_subscriptions.notice_date
      relation: not_before
      duration_source: variants.cancellation_notice_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the notice_date; the removal may take effect on the
        last notice day.
      boundary: inclusive
  - id: one_etf
    applies_to: [access_etf_assessed]
    kind: dedup
    condition: An early termination fee is assessed at most once per subscription.
    evidence_fields: [access_billing.access_sub_id, access_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_billing.access_sub_id]
      action_bindings: {access_billing.access_sub_id: access_sub_id}
    dedup_contract:
      table: access_billing
      mode: separate_record
      object_bindings: {access_sub_id: access_sub_id}
      duplicate_filters:
        event_type: [access_etf_assessed]
      distinct_fields: []
  params:
    per_tier:
      Meadowlark Access 15: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Meadowlark Access 20: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Meadowlark Access 25: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Meadowlark Access Housing 20: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Meadowlark Access Neighborhood 15: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Meadowlark Access Solar for All 50: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
  formula:
    amount: >-
      min(etf_cap_usd, round(allocation_kw * etf_per_kw_per_remaining_year_usd * access_msr_remaining_contract_years,
      2))
  measures: [access_msr_remaining_contract_years]
- id: access_evt_annual_trueup
  subject: [access_trueup_completed]
  rule: >-
    When annual_review_enabled is true Meadowlark completes a true-up for every contract year. A contract
    year's true-up is completed no earlier than the anniversary that ends that year, counted from the
    day the first bill credit posts on the subscription. Contract year n ends on the activation_date plus
    n times review_interval_months calendar months; when that month has no such day, the last day of the
    month is used. Each contract year of a subscription is reviewed exactly once. The review period is
    the twelve statement months ending with the month before the anniversary month. credited_kwh_12m and
    the net credit value are postings less reversals over the period (access_msr_net_credited_kwh_period,
    access_msr_net_credit_value_period); avg_credit_rate is the net credit value divided by credited_kwh_12m,
    rounded half up to four decimals; usage_kwh_12m is the utility account's reported usage for the same
    months. Production guarantee: when production_guarantee_pct is greater than 0, guaranteed_kwh is allocation_kw
    on the review_date multiplied by the project's expected_yield_kwh_per_kw and by production_guarantee_pct
    divided by 100, rounded half up to a whole kWh, and shortfall_kwh is guaranteed_kwh less credited_kwh_12m
    when positive. The guarantee is not assessed (guaranteed_kwh 0) for a year in which the subscription
    was not active for all twelve months, the utility account changed, or the allocation changed. The
    guarantee credit is shortfall_kwh multiplied by avg_credit_rate and by savings_rate_pct divided by
    100 (the savings the missing production would have earned), rounded half up to the cent. A guarantee
    credit is posted as a billing credit with credit_reason production_guarantee on the review_date. Right-sizing:
    when the share's expected annual production exceeds oversize_review_threshold_pct of usage_kwh_12m,
    resize_kw is the kW that must be removed so that the remaining share, a whole multiple of allocation_increment_kw,
    is the largest whose expected production does not exceed resize_target_pct of usage_kwh_12m, but never
    below min_allocation_kw; the removal is filed as annual_resize under the filing calendar without fee.
    The outcome records which of the two applied.
  eligibility:
  - id: after_anniversary
    applies_to: [access_trueup_completed]
    kind: time
    condition: >-
      A contract year's true-up is completed no earlier than the anniversary that ends that year, counted
      from the day the first bill credit posts on the subscription.
    evidence_fields: [access_subscriptions.activation_date, access_subscriptions.access_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_subscriptions.access_sub_id]
      action_bindings: {access_subscriptions.access_sub_id: access_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the first bill credit posts on the subscription
      anchor_source: access_subscriptions.activation_date
      relation: not_before
      duration_source: params.review_interval_months
      unit: calendar_months
      counting_rule: >-
        Contract year n ends on the activation_date plus n times review_interval_months calendar months;
        when that month has no such day, the last day of the month is used.
      boundary: inclusive
  - id: one_review_per_year
    applies_to: [access_trueup_completed]
    kind: dedup
    condition: Each contract year of a subscription is reviewed exactly once.
    evidence_fields: [access_reviews.access_sub_id, access_reviews.contract_year]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_reviews.access_sub_id, access_reviews.contract_year]
      action_bindings: {access_reviews.access_sub_id: access_sub_id, access_reviews.contract_year: contract_year}
    dedup_contract:
      table: access_reviews
      mode: separate_record
      object_bindings: {access_sub_id: access_sub_id, contract_year: contract_year}
      duplicate_filters:
        event_type: [access_trueup_completed]
      distinct_fields: []
  params:
    review_interval_months: 12
    per_tier:
      Meadowlark Access 15: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Meadowlark Access 20: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Meadowlark Access 25: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Meadowlark Access Housing 20: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Meadowlark Access Neighborhood 15: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Meadowlark Access Solar for All 50: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
  formula: {shortfall_kwh: 'max(0, guaranteed_kwh - credited_kwh_12m)', guarantee_credit: 'round(shortfall_kwh
      * avg_credit_rate * savings_rate_pct / 100, 2)'}
  measures: [access_msr_net_credited_kwh_period, access_msr_net_credit_value_period]
- id: access_nonpayment_removal
  subject: [access_removed_nonpayment, access_removal_notice_sent]
  rule: >-
    Removal for nonpayment applies only to dual-billed subscriptions; consolidated-billed subscribers
    are never removed by Meadowlark for nonpayment because the utility collects the charge. A removal
    notice may be sent when a charge has remained unpaid for nonpayment_removal_days_past_due calendar
    days after its due_date and the past-due balance (access_msr_past_due_balance) is at least nonpayment_removal_min_balance_usd.
    A removal for nonpayment takes effect no earlier than removal_notice_days calendar days after Meadowlark
    sends the removal notice. Calendar days are counted from the day after the removal_notice_date; removal
    may occur on the last notice day. Payment of the whole past-due balance before the removal date clears
    the notice (removal_notice_date emptied) and no removal follows. A removal closes the subscription
    with closure_reason nonpayment_removal; the removal is filed under the filing calendar and the early
    termination fee of access_cancellation applies as for a cancellation closing on the removal date.
  eligibility:
  - id: removal_notice_served
    applies_to: [access_removed_nonpayment]
    kind: time
    condition: >-
      A removal for nonpayment takes effect no earlier than removal_notice_days calendar days after Meadowlark
      sends the removal notice.
    evidence_fields: [access_subscriptions.removal_notice_date, access_subscriptions.access_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_subscriptions.access_sub_id]
      action_bindings: {access_subscriptions.access_sub_id: access_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: Meadowlark sends the removal notice
      anchor_source: access_subscriptions.removal_notice_date
      relation: not_before
      duration_source: variants.removal_notice_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the removal_notice_date; removal may occur on the
        last notice day.
      boundary: inclusive
  params:
    per_tier:
      Meadowlark Access 15: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Meadowlark Access 20: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Meadowlark Access 25: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Meadowlark Access Housing 20: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due,
        nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd, removal_notice_days: =removal_notice_days}
      Meadowlark Access Neighborhood 15: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due,
        nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd, removal_notice_days: =removal_notice_days}
      Meadowlark Access Solar for All 50: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due,
        nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd, removal_notice_days: =removal_notice_days}
  measures: [access_msr_past_due_balance]
- id: access_benefit_basis
  subject: [access_charge_billed, access_billing_credited]
  rule: >-
    Account-wide benefit rule, the same for every Meadowlark subscription line: a subscription's charges
    are priced only by its own plan's pricing (its savings_rate_pct, or its contract rate with escalator
    on fixed-rate plans); no promotion, referral reward, second subscription, waitlist reservation or
    other line's plan changes that price, and benefits never stack. Billing credits are separate ledger
    lines and never reduce a charge's own amount. Each subscription keeps its own ledger: a payment, credit
    or fee belongs only to the subscription it is recorded on and is never moved to another subscription
    or line.
  eligibility: []
- id: access_billing_arrangement
  subject: [access_billing_type_changed, access_enrolled]
  rule: >-
    Consolidated billing (utility net crediting) is available only for projects in a program listed in
    consolidated_billing_programs and only on plans whose billing_types_offered include it; every other
    subscription is dual billed. A change of billing arrangement is accepted only for a subscription in
    active status. A switch is requested by the subscriber and applies to charges invoiced on or after
    the first day of the month following the request's received_date; charges already invoiced keep their
    billing_type. Switching to consolidated billing requires that no dual-billed line is past due.
  eligibility:
  - id: switch_status
    applies_to: [access_billing_type_changed]
    kind: state
    condition: A change of billing arrangement is accepted only for a subscription in active status.
    evidence_fields: [access_subscriptions.status, access_subscriptions.access_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_subscriptions.access_sub_id]
      action_bindings: {access_subscriptions.access_sub_id: access_sub_id}
    state_contract:
      field: access_subscriptions.status
      allowed: [active]
  params:
    consolidated_billing_programs: [NY_VDER]
    per_tier:
      Meadowlark Access 15: {billing_types_offered: =billing_types_offered}
      Meadowlark Access 20: {billing_types_offered: =billing_types_offered}
      Meadowlark Access 25: {billing_types_offered: =billing_types_offered}
      Meadowlark Access Housing 20: {billing_types_offered: =billing_types_offered}
      Meadowlark Access Neighborhood 15: {billing_types_offered: =billing_types_offered}
      Meadowlark Access Solar for All 50: {billing_types_offered: =billing_types_offered}
- id: access_eligibility_tracks
  subject: [access_enrolled, access_recertified]
  rule: >-
    An Access plan is enrolled or recertified only under an eligibility_track listed for that plan in
    accepted_tracks. The evidence for each track is: income_documentation, household income documents
    reviewed by Meadowlark against the plan's income limit; assistance_program_enrollment, the utility
    account's assistance_program_enrolled flag reported by the utility; affordable_housing_residence,
    a lease or certification from a regulated affordable housing property for the service address; geographic_eligibility,
    the service address's designated_community other than none; ilsfa_verification, income verification
    completed under Illinois Solar for All. The household states the facts; Meadowlark records the verification
    date as income_verified_date, and a customer statement never replaces the recorded verification. Eligibility
    is personal to the household and never passes to a successor.
  eligibility:
  - id: track_accepted
    applies_to: [access_enrolled, access_recertified]
    kind: authorization
    condition: >-
      An Access plan is enrolled or recertified only under an eligibility_track listed for that plan in
      accepted_tracks.
    evidence_fields: [access_subscriptions.eligibility_track, access_subscriptions.income_verified_date,
      access_subscriptions.access_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_subscriptions.access_sub_id]
      action_bindings: {access_subscriptions.access_sub_id: access_sub_id}
  params:
    accepted_tracks:
      Meadowlark Access 15: [income_documentation, assistance_program_enrollment]
      Meadowlark Access 20: [income_documentation, assistance_program_enrollment]
      Meadowlark Access 25: [income_documentation]
      Meadowlark Access Housing 20: [affordable_housing_residence]
      Meadowlark Access Neighborhood 15: [geographic_eligibility]
      Meadowlark Access Solar for All 50: [ilsfa_verification]
    per_tier:
      Meadowlark Access 15: {income_verification_required: =income_verification_required}
      Meadowlark Access 20: {income_verification_required: =income_verification_required}
      Meadowlark Access 25: {income_verification_required: =income_verification_required}
      Meadowlark Access Housing 20: {income_verification_required: =income_verification_required}
      Meadowlark Access Neighborhood 15: {income_verification_required: =income_verification_required}
      Meadowlark Access Solar for All 50: {income_verification_required: =income_verification_required}
- id: access_recertification
  subject: [access_recertified, access_charge_billed]
  rule: >-
    When recert_interval_months is greater than 0, recert_due_date is income_verified_date plus recert_interval_months
    calendar months (the last day of the month when that day does not exist). Recertification may be completed
    at any time from recert_notice_days_before days before recert_due_date and sets a new income_verified_date
    and recert_due_date. When a recertification is not completed by recert_due_date plus recert_grace_days
    calendar days, every charge pricing a credit posted after that date and before the recertification
    is completed is priced at lapsed_savings_rate_pct instead of the plan's savings_rate_pct; the plan
    itself does not change, the household is not removed, and no charge already billed is repriced when
    the household later recertifies. Plans with recert_interval_months 0 are never repriced under this
    policy.
  eligibility: []
  params:
    recert_notice_days_before: 60
    per_tier:
      Meadowlark Access 15: {recert_interval_months: =recert_interval_months, recert_grace_days: =recert_grace_days,
        lapsed_savings_rate_pct: =lapsed_savings_rate_pct}
      Meadowlark Access 20: {recert_interval_months: =recert_interval_months, recert_grace_days: =recert_grace_days,
        lapsed_savings_rate_pct: =lapsed_savings_rate_pct}
      Meadowlark Access 25: {recert_interval_months: =recert_interval_months, recert_grace_days: =recert_grace_days,
        lapsed_savings_rate_pct: =lapsed_savings_rate_pct}
      Meadowlark Access Housing 20: {recert_interval_months: =recert_interval_months, recert_grace_days: =recert_grace_days,
        lapsed_savings_rate_pct: =lapsed_savings_rate_pct}
      Meadowlark Access Neighborhood 15: {recert_interval_months: =recert_interval_months, recert_grace_days: =recert_grace_days,
        lapsed_savings_rate_pct: =lapsed_savings_rate_pct}
      Meadowlark Access Solar for All 50: {recert_interval_months: =recert_interval_months, recert_grace_days: =recert_grace_days,
        lapsed_savings_rate_pct: =lapsed_savings_rate_pct}

# ---------------------------------------------------------------------------
# extended_policies (income_eligible_move_transfers)
# ---------------------------------------------------------------------------
extended_policies:
- id: access_ext_move_reassignment_sizing
  base_policy_refs: [access_transfer_at_move, access_agg_account_sizing, access_allocation_change, access_eligibility_tracks]
  overwrite:
    - base_policy: access_transfer_at_move
      superseded_clause: >-
        When transfer_resize_to_new_usage is true and the new account's sizing limit (access_agg_account_sizing)
        is below the share's expected production, the excess kW, sized up to a whole multiple of
        allocation_increment_kw, is removed in the same filing as a move_resize reduction, without fee and
        outside the yearly change allowance; when the remaining share would be below min_allocation_kw the
        transfer is not completed.
      replaced_by: >-
        For a move transfer to a new utility account that carries no twelve months of usage on file (its
        usage_as_of_month is empty), and only for such a transfer, the share filed to the new account is sized
        as this rule sets out, any kW it does not keep is removed in the same filing as a move_resize reduction,
        without fee and outside the yearly change allowance, and when the share kept would be below
        min_allocation_kw the transfer is not completed; every other transfer remains under the base rule,
        which reads: When transfer_resize_to_new_usage is true and the new account's sizing limit
        (access_agg_account_sizing) is below the share's expected production, the excess kW, sized up to a
        whole multiple of allocation_increment_kw, is removed in the same filing as a move_resize reduction,
        without fee and outside the yearly change allowance; when the remaining share would be below
        min_allocation_kw the transfer is not completed.
    - base_policy: access_agg_account_sizing
      superseded_clause: >-
        The usage figure may be used only when usage_as_of_month is no more than usage_data_max_age_months
        before the month of the decision; older usage must be refreshed from the utility before sizing.
      replaced_by: >-
        For the move sizing of this rule, and only for it, the usage figure is the household's consumption
        record named below in place of the new account's usage on file; for every other sizing decision the
        base rule remains, which reads: The usage figure may be used only when usage_as_of_month is no more
        than usage_data_max_age_months before the month of the decision; older usage must be refreshed from the
        utility before sizing.
  trigger: on_request
  subject: [access_allocation_reassigned]
  computes: kw
  target_tool: file_move_reassignment_5a7d54a1
  params:
    frequent_banking_cap_pct: 90
    occasional_banking_cap_pct: 95
    record_max_age_months: 18
    overdue_verification_allowance_pct: 97
    aging_verification_allowance_pct: 99
    mid_share_allowance_pct: 98
    large_share_allowance_pct: 96
    recent_restatement_allowance_pct: 98
    older_restatement_allowance_pct: 99
    recent_conversion_allowance_pct: 97
    settled_conversion_allowance_pct: 99
  rule: >-
    This rule sizes the share a household keeps when its Meadowlark Access subscription moves to a new
    utility account. For a move transfer to a new utility account that carries no twelve months of usage on
    file (its usage_as_of_month is empty), and only for such a transfer, the share filed to the new account is
    sized as this rule sets out, any kW it does not keep is removed in the same filing as a move_resize
    reduction, without fee and outside the yearly change allowance, and when the share kept would be below
    min_allocation_kw the transfer is not completed; every other transfer remains under the base rule, which
    reads: When transfer_resize_to_new_usage is true and the new account's sizing limit
    (access_agg_account_sizing) is below the share's expected production, the excess kW, sized up to a whole
    multiple of allocation_increment_kw, is removed in the same filing as a move_resize reduction, without fee
    and outside the yearly change allowance; when the remaining share would be below min_allocation_kw the
    transfer is not completed. For the move sizing of this rule, and only for it, the usage figure is the
    household's consumption record named below in place of the new account's usage on file; for every other
    sizing decision the base rule remains, which reads: The usage figure may be used only when
    usage_as_of_month is no more than usage_data_max_age_months before the month of the decision; older usage
    must be refreshed from the utility before sizing.
    The reassignment of the share to the new account is filed only after the subscription carries a move
    settlement payment received on or after the move-out date the household stated.
    The standard move sizing rests on the household's own consumption record, the subscription's latest
    completed annual true-up (the access_reviews line with the latest review_date): the record usage is its
    usage_kwh_12m and the record yield is its credited_kwh_12m divided by the subscription's contract_kw. The
    supported share is the plan's sizing_cap_pct of the record usage, divided by 100 and by the record yield.
    The share kept is the supported share rounded down to a whole multiple of allocation_increment_kw and never
    more than the subscription's allocation_kw; when the subscription carries no consumption record the share
    kept is its whole allocation_kw.
    Each adjustment below changes the consumption record, the sizing cap percent or an allowance percentage; the
    supported share is the adjusted sizing cap percent of the record usage, multiplied by every allowance
    percentage below divided by 100, divided by 100 and by the record yield, and the share kept is figured from
    it as stated above; the kW filed to the new account is the share kept.
    Consumption record source for the move: when the subscription carries no completed true-up and a
    residential plan on the same utility account closed with closure_reason converted_to_access carries a
    completed true-up (home_reviews line), the consumption record is that residential true-up with the latest
    review_date, its record yield being its credited_kwh_12m divided by the residential plan's contract_kw;
    when the subscription's latest completed true-up was completed more than record_max_age_months whole
    calendar months before the sizing date and the subscription carries an access_allocation_reassigned line,
    the record belongs to an earlier home and the subscription carries no consumption record for this move;
    otherwise the consumption record is the subscription's own latest completed true-up.
    Banking evidence for the move sizing cap: when three or more of the subscription's access_credit_posted lines
    posted in the last twelve whole months carry a banked_value above 0.00, the sizing cap percent is
    frequent_banking_cap_pct; when one or two of those lines do, it is occasional_banking_cap_pct; otherwise it is
    the plan's sizing_cap_pct.
    Verification-age allowance of the move sizing: when more than 730 calendar days have passed from the
    subscription's income_verified_date to the sizing date, the verification-age allowance is
    overdue_verification_allowance_pct; when 366 to 730 days have passed, it is aging_verification_allowance_pct;
    otherwise it is 100.
    Share-size allowance of the move sizing: the share size is the kW of the subscription's
    access_allocation_filed lines with filing_reason initial. When it is more than 6.00 kW, the share-size
    allowance is large_share_allowance_pct; when it is more than 3.00 kW but at most 6.00 kW, it is
    mid_share_allowance_pct; otherwise it is 100.
    Restatement allowance of the move sizing: when the subscription carries an access_credit_reversed line posted
    in the last three whole months, the restatement allowance is recent_restatement_allowance_pct; when its
    latest access_credit_reversed line posted three to eleven whole months before, it is
    older_restatement_allowance_pct; otherwise it is 100.
    Conversion allowance of the move sizing: when a residential plan on the same utility account closed with
    closure_reason converted_to_access fewer than six whole calendar months before the sizing date, the
    conversion allowance is recent_conversion_allowance_pct; when it closed six to eleven whole calendar months
    before, it is settled_conversion_allowance_pct; otherwise it is 100.
    The share kept is filed to the new account in the reassignment line, under the filing calendar of
    access_allocation_change counted from the move transfer request's received_date.
  prerequisite:
    - problem: access_ext_move_settlement_payment
      kind: state_gate
      gate: access_billing.bill_date
      form: state
      policy_source: >-
        The reassignment of the share to the new account is filed only after the subscription carries a move
        settlement payment received on or after the move-out date the household stated.
      condition: >-
        The subscription carries an access_payment_received line whose bill_date is on or after the
        subscription's move_out_date.
      resolved_by: pay_move_settlement_0f5b0288
      effect: >-
        Once the household's move settlement payment is received, the reassignment of the share may be filed.
  cross_category:
    - category: home
      as: history
      reads: [closure_reason, utility_account_id, contract_kw, closed_date, home_reviews.usage_kwh_12m, home_reviews.credited_kwh_12m, home_reviews.review_date]
      note: the consumption record source reads the converted residential plan's latest true-up on the same utility account
  compute:
    - own_review_count: "COUNT('access_reviews', event_type='access_trueup_completed')"
    - own_usage: "LATEST('access_reviews','usage_kwh_12m', date_field='review_date', event_type='access_trueup_completed')"
    - own_credited: "LATEST('access_reviews','credited_kwh_12m', date_field='review_date', event_type='access_trueup_completed')"
    - own_review_date: "LATEST('access_reviews','review_date', date_field='review_date', event_type='access_trueup_completed')"
    - base_usage: "float(own_usage) if own_review_count >= 1 else 0.0"
    - base_yield: "(float(own_credited) / float(F('contract_kw'))) if own_review_count >= 1 else 0.0"
    - res_converted: "EXISTS('home', utility_account_id=F('utility_account_id'), closure_reason='converted_to_access')"
    - res_sub: "CFIELD('home','home_sub_id', utility_account_id=F('utility_account_id'), closure_reason='converted_to_access')"
    - res_review_count: "XCOUNT('home','home_reviews', event_type='home_trueup_completed', home_sub_id=res_sub)"
    - res_usage: "XLATEST('home','home_reviews','usage_kwh_12m', date_field='review_date', event_type='home_trueup_completed', home_sub_id=res_sub)"
    - res_credited: "XLATEST('home','home_reviews','credited_kwh_12m', date_field='review_date', event_type='home_trueup_completed', home_sub_id=res_sub)"
    - res_contract_kw: "CFIELD('home','contract_kw', utility_account_id=F('utility_account_id'), closure_reason='converted_to_access')"
    - prior_reassign_count: "COUNT('access_allocations', event_type='access_allocation_reassigned')"
    - record_source: "2 if (own_review_count == 0 and res_converted and res_review_count >= 1) else (1 if (own_review_count >= 1 and MONTHS(own_review_date, NOW) > K('record_max_age_months') and prior_reassign_count >= 1) else 0)"
    - record_usage: "float(res_usage) if record_source == 2 else (0.0 if record_source == 1 else base_usage)"
    - record_yield: "(float(res_credited) / float(res_contract_kw)) if record_source == 2 else (0.0 if record_source == 1 else base_yield)"
    - banked_lines_12m: "COUNT('access_credits', within_months=12, date_field='posted_date', event_type='access_credit_posted') - COUNT('access_credits', within_months=12, date_field='posted_date', event_type='access_credit_posted', banked_value=0.0)"
    - cap_pct: "K('frequent_banking_cap_pct') if banked_lines_12m >= 3 else (K('occasional_banking_cap_pct') if banked_lines_12m >= 1 else P('sizing_cap_pct'))"
    - verification_days: "DAYS(F('income_verified_date'), NOW)"
    - verify_pct: "K('overdue_verification_allowance_pct') if verification_days > 730 else (K('aging_verification_allowance_pct') if verification_days >= 366 else 100)"
    - initial_kw: "SUM('access_allocations','kw', event_type='access_allocation_filed', filing_reason='initial')"
    - size_pct: "K('large_share_allowance_pct') if initial_kw > 6.0 else (K('mid_share_allowance_pct') if initial_kw > 3.0 else 100)"
    - latest_reversal_date: "LATEST('access_credits','posted_date', date_field='posted_date', event_type='access_credit_reversed')"
    - reversal_months: "MONTHS(latest_reversal_date, NOW) if latest_reversal_date else -1"
    - restate_pct: "K('recent_restatement_allowance_pct') if (reversal_months >= 0 and reversal_months < 3) else (K('older_restatement_allowance_pct') if (reversal_months >= 3 and reversal_months < 12) else 100)"
    - res_closed_date: "CFIELD('home','closed_date', utility_account_id=F('utility_account_id'), closure_reason='converted_to_access')"
    - conversion_months: "MONTHS(res_closed_date, NOW) if res_closed_date else -1"
    - conversion_pct: "K('recent_conversion_allowance_pct') if (conversion_months >= 0 and conversion_months < 6) else (K('settled_conversion_allowance_pct') if (conversion_months >= 6 and conversion_months < 12) else 100)"
    - supported_kw: "(cap_pct * record_usage * verify_pct / 100 * size_pct / 100 * restate_pct / 100 * conversion_pct / 100 / 100 / record_yield) if record_yield > 0 else F('allocation_kw')"
    - kept_kw: "int(supported_kw / P('allocation_increment_kw') + 0.000001) * P('allocation_increment_kw')"
    - result: "RND(MN(F('allocation_kw'), kept_kw) + 0.000000001, 2)"
  compute_basis:
    own_review_count: "the subscription's latest completed annual true-up (the access_reviews line with the latest review_date)"
    own_usage: "the record usage is its usage_kwh_12m"
    own_credited: "the record yield is its credited_kwh_12m divided by the subscription's contract_kw"
    own_review_date: "the subscription's latest completed annual true-up (the access_reviews line with the latest review_date)"
    base_usage: "the record usage is its usage_kwh_12m"
    base_yield: "the record yield is its credited_kwh_12m divided by the subscription's contract_kw"
    res_converted: "a residential plan on the same utility account closed with closure_reason converted_to_access"
    res_sub: "a residential plan on the same utility account closed with closure_reason converted_to_access"
    res_review_count: "carries a completed true-up (home_reviews line)"
    res_usage: "the consumption record is that residential true-up with the latest review_date"
    res_credited: "its record yield being its credited_kwh_12m divided by the residential plan's contract_kw"
    res_contract_kw: "its record yield being its credited_kwh_12m divided by the residential plan's contract_kw"
    prior_reassign_count: "the subscription carries an access_allocation_reassigned line"
    record_source: "when the subscription carries no completed true-up and a residential plan on the same utility account closed with closure_reason converted_to_access carries a completed true-up (home_reviews line), the consumption record is that residential true-up with the latest review_date, its record yield being its credited_kwh_12m divided by the residential plan's contract_kw; when the subscription's latest completed true-up was completed more than record_max_age_months whole calendar months before the sizing date and the subscription carries an access_allocation_reassigned line, the record belongs to an earlier home and the subscription carries no consumption record for this move; otherwise the consumption record is the subscription's own latest completed true-up."
    record_usage: "the record usage is its usage_kwh_12m"
    record_yield: "its record yield being its credited_kwh_12m divided by the residential plan's contract_kw"
    banked_lines_12m: "of the subscription's access_credit_posted lines posted in the last twelve whole months carry a banked_value above 0.00"
    cap_pct: "when three or more of the subscription's access_credit_posted lines posted in the last twelve whole months carry a banked_value above 0.00, the sizing cap percent is frequent_banking_cap_pct; when one or two of those lines do, it is occasional_banking_cap_pct; otherwise it is the plan's sizing_cap_pct."
    verification_days: "from the subscription's income_verified_date to the sizing date"
    verify_pct: "when more than 730 calendar days have passed from the subscription's income_verified_date to the sizing date, the verification-age allowance is overdue_verification_allowance_pct; when 366 to 730 days have passed, it is aging_verification_allowance_pct; otherwise it is 100."
    initial_kw: "the share size is the kW of the subscription's access_allocation_filed lines with filing_reason initial"
    size_pct: "When it is more than 6.00 kW, the share-size allowance is large_share_allowance_pct; when it is more than 3.00 kW but at most 6.00 kW, it is mid_share_allowance_pct; otherwise it is 100."
    latest_reversal_date: "its latest access_credit_reversed line"
    reversal_months: "posted in the last three whole months"
    restate_pct: "when the subscription carries an access_credit_reversed line posted in the last three whole months, the restatement allowance is recent_restatement_allowance_pct; when its latest access_credit_reversed line posted three to eleven whole months before, it is older_restatement_allowance_pct; otherwise it is 100."
    res_closed_date: "a residential plan on the same utility account closed with closure_reason converted_to_access"
    conversion_months: "fewer than six whole calendar months before the sizing date"
    conversion_pct: "when a residential plan on the same utility account closed with closure_reason converted_to_access fewer than six whole calendar months before the sizing date, the conversion allowance is recent_conversion_allowance_pct; when it closed six to eleven whole calendar months before, it is settled_conversion_allowance_pct; otherwise it is 100."
    supported_kw: "the supported share is the adjusted sizing cap percent of the record usage, multiplied by every allowance percentage below divided by 100, divided by 100 and by the record yield"
    kept_kw: "The share kept is the supported share rounded down to a whole multiple of allocation_increment_kw"
    result: "never more than the subscription's allocation_kw; when the subscription carries no consumption record the share kept is its whole allocation_kw."
  factors:
    - id: record_source
      effect: method
      decides: record_source
      bindings: [res_converted, res_sub, res_review_count, res_usage, res_credited, res_contract_kw, prior_reassign_count, record_source]
      ladder:
        - when: "the subscription carries no completed true-up AND a residential plan on the same utility account closed converted_to_access carries a completed true-up"
          method: "the record is the residential plan's latest true-up; record yield = its credited_kwh_12m / the residential plan's contract_kw"
        - when: "the subscription's latest true-up was completed more than record_max_age_months months before the sizing date AND the subscription carries an access_allocation_reassigned line"
          method: "no consumption record: the share moves whole"
        - when: "otherwise"
          method: "the record is the subscription's own latest completed true-up"
      baseline:
        record_source: "0"
      evidence: [cross_category, history, date]
      cross_difficulty: home
    - id: banking_cap
      effect: parameter
      decides: cap_pct
      bindings: [banked_lines_12m, cap_pct]
      ladder:
        - when: "three or more access_credit_posted lines of the last twelve whole months carry a banked_value above 0.00"
          value: "K('frequent_banking_cap_pct')"
        - when: "one or two of those lines do"
          value: "K('occasional_banking_cap_pct')"
        - when: "otherwise"
          value: "P('sizing_cap_pct')"
      baseline:
        cap_pct: "P('sizing_cap_pct')"
      evidence: [history]
      cross_difficulty: null
    - id: verification_age_allowance
      effect: parameter
      decides: verify_pct
      bindings: [verification_days, verify_pct]
      ladder:
        - when: "more than 730 days from income_verified_date to the sizing date"
          value: "K('overdue_verification_allowance_pct')"
        - when: "366 to 730 days"
          value: "K('aging_verification_allowance_pct')"
        - when: "otherwise"
          value: "100"
      baseline:
        verify_pct: "100"
      evidence: [date]
      cross_difficulty: null
    - id: share_size_allowance
      effect: parameter
      decides: size_pct
      bindings: [initial_kw, size_pct]
      ladder:
        - when: "initial filing kW more than 6.00"
          value: "K('large_share_allowance_pct')"
        - when: "more than 3.00 and at most 6.00"
          value: "K('mid_share_allowance_pct')"
        - when: "otherwise"
          value: "100"
      baseline:
        size_pct: "100"
      evidence: [history]
      cross_difficulty: null
    - id: restatement_allowance
      effect: parameter
      decides: restate_pct
      bindings: [latest_reversal_date, reversal_months, restate_pct]
      ladder:
        - when: "an access_credit_reversed line posted in the last three whole months"
          value: "K('recent_restatement_allowance_pct')"
        - when: "the latest one posted three to eleven whole months before"
          value: "K('older_restatement_allowance_pct')"
        - when: "otherwise"
          value: "100"
      baseline:
        restate_pct: "100"
      evidence: [history, date]
      cross_difficulty: null
    - id: conversion_allowance
      effect: parameter
      decides: conversion_pct
      bindings: [res_closed_date, conversion_months, conversion_pct]
      ladder:
        - when: "a residential plan on the same utility account closed converted_to_access fewer than six whole months before"
          value: "K('recent_conversion_allowance_pct')"
        - when: "it closed six to eleven whole months before"
          value: "K('settled_conversion_allowance_pct')"
        - when: "otherwise"
          value: "100"
      baseline:
        conversion_pct: "100"
      evidence: [cross_category, date]
      cross_difficulty: home
  baseline:
    rule: >-
      The standard move sizing rests on the household's own consumption record, the subscription's latest
      completed annual true-up (the access_reviews line with the latest review_date): the record usage is its
      usage_kwh_12m and the record yield is its credited_kwh_12m divided by the subscription's contract_kw. The
      supported share is the plan's sizing_cap_pct of the record usage, divided by 100 and by the record yield.
      The share kept is the supported share rounded down to a whole multiple of allocation_increment_kw and never
      more than the subscription's allocation_kw; when the subscription carries no consumption record the share
      kept is its whole allocation_kw.
    params: [sizing_cap_pct, allocation_increment_kw]
  inputs:
    history:
      - {table: access_reviews, aggregate: latest, field: usage_kwh_12m, filters: {event_type: access_trueup_completed}}
      - {table: access_credits, aggregate: count, field: banked_value, within_months: 12, filters: {event_type: access_credit_posted}}
      - {table: access_requests, aggregate: latest, field: received_date, filters: {request_type: move_transfer}}
      - {category: home, table: home_reviews, aggregate: latest, field: usage_kwh_12m, filters: {event_type: home_trueup_completed}}
    cross_category: [home]
- id: access_ext_move_settlement_payment
  base_policy_refs: [access_evt_payment_application, access_evt_subscription_charge, access_benefit_basis]
  overwrite: []
  trigger: on_request
  subject: [access_payment_received]
  computes: amount
  target_tool: pay_move_settlement_0f5b0288
  params:
    full_share_pct: 100
    half_share_pct: 50
  rule: >-
    This rule fixes the move settlement a household pays itself, through the secure payment portal, to settle
    the old address's ledger of a Meadowlark Access share awaiting its move to a new utility account (status
    transfer_pending). Meadowlark representatives never take card or bank account numbers and no payment method
    is kept on file: the household makes the payment in person by ach or card through the portal, and the
    payment settles open lines under the base payment application order; any part not yet matched by a line is
    held as a credit against the old address's later statements.
    The move settlement is fixed only after every reversal line posted on the subscription carries its
    reversal-correction billing credit. The move settlement is not fixed until every statement month that has
    gone the plan's estimate waiting period after its end without a posted credit carries an estimated charge.
    The standard move settlement is the past-due balance of the subscription: the amount of every
    access_charge_billed line whose due_date is on or before the settlement date, plus every
    access_payment_returned line, less every access_payment_received line and every access_billing_credited line
    of the subscription, never below 0.00.
    Each adjustment below adds a share of a further ledger component; the move settlement is the past-due figure
    (the charges due, plus returned payments, less payments and billing credits, which may come to less than
    zero) plus every added share, never below 0.00, rounded half up to the cent.
    Not-yet-due charges of the move settlement: the component is the amount of the subscription's
    access_charge_billed lines with charge_basis actual whose due_date is after the settlement date. When more
    than 14 calendar days have passed from the stated move_out_date to the settlement date, the settlement adds
    full_share_pct percent of it; when 1 to 14 days have passed, half_share_pct percent of it; otherwise none of
    it.
    Open estimates of the move settlement: the component is the amount of the subscription's
    access_charge_billed lines with charge_basis estimated whose due_date is after the settlement date. When the
    subscription carries no actual subscription charge invoiced in the last two whole calendar months, the
    settlement adds full_share_pct percent of it; when it carries exactly one, half_share_pct percent of it; when
    it carries two or more, none of it.
    Unbilled statement of the move settlement: the component is the credit statement the subscription's latest
    access_credit_posted line reports when no subscription charge yet prices it, valued at the unbilled value
    below and multiplied by (100 minus the rate in force on the settlement date) and divided by 100. The rate in
    force on the settlement date is lapsed_savings_rate_pct when the subscription's recert_due_date lies more
    than recert_grace_days calendar days before the settlement date and its income_verified_date is not later
    than that recert_due_date, and otherwise the plan's savings_rate_pct. When the move transfer request
    (the subscription's latest access_requests line of request_type move_transfer) was received more than 7
    calendar days before the settlement date, the settlement adds full_share_pct percent of it; when 1 to 7 days
    before, half_share_pct percent of it; otherwise none of it.
    Unbilled value of that statement: when the statement carries a banked_value equal to its whole
    credit_value, the unbilled value is its credit_value less its banked_value plus half its banked_value; when it
    carries a banked_value above 0.00 but below its credit_value, the unbilled value is its credit_value less
    its banked_value; otherwise it is its credit_value.
    Final-month prepayment of the move settlement: the component is one statement's worth for the old address's
    final statement month (the month before the reassignment takes effect), valued at the prepayment basis below.
    When more than 30 calendar days have passed from the bill_date of the subscription's latest
    access_payment_received line to the settlement date, the settlement adds full_share_pct percent of it; when 1
    to 30 days have passed, half_share_pct percent of it; otherwise none of it.
    Prepayment basis of the final month: when the subscription carries an open estimated charge, the basis is
    the amount of its latest estimated charge; when it carries none but carries at least two actual charges, the
    basis is the average amount of its actual charges; otherwise the basis is the amount of its latest actual
    charge.
  prerequisite:
    - problem: access_ext_move_partial_reversal_credit
      kind: value_input
      gate: credits_total
      form: state
      policy_source: >-
        The move settlement is fixed only after every reversal line posted on the subscription carries its
        reversal-correction billing credit.
      condition: >-
        Every access_credit_reversed line of the subscription is named by an access_billing_credited line with
        credit_reason credit_reversal_correction.
      resolved_by: credit_partial_reversal_7609dc6e
      effect: >-
        The reversal-correction billing credit enters the billing credits the standard move settlement deducts.
    - problem: access_ext_move_pending_estimate
      kind: value_input
      gate: estimate_open
      form: state
      policy_source: >-
        The move settlement is not fixed until every statement month that has gone the plan's estimate waiting period
        after its end without a posted credit carries an estimated charge.
      condition: >-
        Every statement month of the subscription that ended more than estimate_wait_days calendar days before the
        settlement date carries an access_credit_posted line or an access_charge_billed line with charge_basis
        estimated.
      resolved_by: bill_pending_estimate_ff226895
      effect: >-
        The estimated charge enters the open-estimates component and the final-month prepayment basis.
  cross_category: []
  compute:
    - s_plan: "P('lapsed_savings_rate_pct') if ((F('recert_due_date') != None and F('recert_due_date') != '') and DAYS(F('recert_due_date'), NOW) > P('recert_grace_days') and DAYS(F('recert_due_date'), F('income_verified_date')) <= 0) else P('savings_rate_pct')"
    - due_charges: "SUM('access_billing','amount', within_months=600, date_field='due_date', event_type='access_charge_billed')"
    - returned_total: "SUM('access_billing','amount', event_type='access_payment_returned')"
    - paid_total: "SUM('access_billing','amount', event_type='access_payment_received')"
    - credits_total: "SUM('access_billing','amount', event_type='access_billing_credited')"
    - past_due: "MX(0, due_charges + returned_total - paid_total - credits_total)"
    - actual_all: "SUM('access_billing','amount', event_type='access_charge_billed', charge_basis='actual')"
    - actual_due: "SUM('access_billing','amount', within_months=600, date_field='due_date', event_type='access_charge_billed', charge_basis='actual')"
    - nyd_component: "actual_all - actual_due"
    - moved_days: "DAYS(F('move_out_date'), NOW) if F('move_out_date') else 0"
    - nyd_share: "K('full_share_pct') if moved_days > 14 else (K('half_share_pct') if moved_days >= 1 else 0)"
    - estimated_all: "SUM('access_billing','amount', event_type='access_charge_billed', charge_basis='estimated')"
    - estimated_due: "SUM('access_billing','amount', within_months=600, date_field='due_date', event_type='access_charge_billed', charge_basis='estimated')"
    - estimate_open: "estimated_all - estimated_due"
    - recent_actuals: "COUNT('access_billing', within_months=2, date_field='bill_date', event_type='access_charge_billed', charge_basis='actual')"
    - estimate_share: "K('full_share_pct') if recent_actuals == 0 else (K('half_share_pct') if recent_actuals == 1 else 0)"
    - latest_credit_id: "LATEST('access_credits','access_credit_id', date_field='posted_date', event_type='access_credit_posted')"
    - latest_credit_priced: "COUNT('access_billing', event_type='access_charge_billed', access_credit_id=latest_credit_id) if latest_credit_id else 1"
    - latest_credit_value: "float(LATEST('access_credits','credit_value', date_field='posted_date', event_type='access_credit_posted') or 0)"
    - latest_credit_banked: "float(LATEST('access_credits','banked_value', date_field='posted_date', event_type='access_credit_posted') or 0)"
    - unbilled_value: "(latest_credit_value - latest_credit_banked + latest_credit_banked / 2) if (latest_credit_banked > 0 and latest_credit_banked >= latest_credit_value) else ((latest_credit_value - latest_credit_banked) if latest_credit_banked > 0 else latest_credit_value)"
    - unbilled_component: "(unbilled_value * (100 - s_plan) / 100) if latest_credit_priced == 0 else 0.0"
    - req_received: "LATEST('access_requests','received_date', date_field='received_date', request_type='move_transfer')"
    - req_wait_days: "DAYS(req_received, NOW) if req_received else 0"
    - unbilled_share: "K('full_share_pct') if req_wait_days > 7 else (K('half_share_pct') if req_wait_days >= 1 else 0)"
    - latest_estimate: "float(LATEST('access_billing','amount', date_field='bill_date', event_type='access_charge_billed', charge_basis='estimated') or 0)"
    - n_actual: "COUNT('access_billing', event_type='access_charge_billed', charge_basis='actual')"
    - latest_actual: "float(LATEST('access_billing','amount', date_field='bill_date', event_type='access_charge_billed', charge_basis='actual') or 0)"
    - prepay_basis: "latest_estimate if estimate_open > 0 else ((actual_all / n_actual) if n_actual >= 2 else latest_actual)"
    - last_pay_date: "LATEST('access_billing','bill_date', date_field='bill_date', event_type='access_payment_received')"
    - last_pay_days: "DAYS(last_pay_date, NOW) if last_pay_date else 0"
    - prepay_share: "K('full_share_pct') if last_pay_days > 30 else (K('half_share_pct') if last_pay_days >= 1 else 0)"
    - past_due_raw: "due_charges + returned_total - paid_total - credits_total"
    - result: "RND(MX(0, past_due_raw + nyd_component * nyd_share / 100 + estimate_open * estimate_share / 100 + unbilled_component * unbilled_share / 100 + prepay_basis * prepay_share / 100) + 0.000000001, 2)"
  compute_basis:
    s_plan: "The rate in force on the settlement date is lapsed_savings_rate_pct when the subscription's recert_due_date lies more than recert_grace_days calendar days before the settlement date and its income_verified_date is not later than that recert_due_date, and otherwise the plan's savings_rate_pct."
    due_charges: "the amount of every access_charge_billed line whose due_date is on or before the settlement date"
    returned_total: "plus every access_payment_returned line"
    paid_total: "less every access_payment_received line and every access_billing_credited line of the subscription"
    credits_total: "less every access_payment_received line and every access_billing_credited line of the subscription"
    past_due: "never below 0.00"
    actual_all: "the component is the amount of the subscription's access_charge_billed lines with charge_basis actual whose due_date is after the settlement date"
    actual_due: "the component is the amount of the subscription's access_charge_billed lines with charge_basis actual whose due_date is after the settlement date"
    nyd_component: "the component is the amount of the subscription's access_charge_billed lines with charge_basis actual whose due_date is after the settlement date"
    moved_days: "from the stated move_out_date to the settlement date"
    nyd_share: "When more than 14 calendar days have passed from the stated move_out_date to the settlement date, the settlement adds full_share_pct percent of it; when 1 to 14 days have passed, half_share_pct percent of it; otherwise none of it."
    estimated_all: "the component is the amount of the subscription's access_charge_billed lines with charge_basis estimated whose due_date is after the settlement date"
    estimated_due: "the component is the amount of the subscription's access_charge_billed lines with charge_basis estimated whose due_date is after the settlement date"
    estimate_open: "the component is the amount of the subscription's access_charge_billed lines with charge_basis estimated whose due_date is after the settlement date"
    recent_actuals: "When the subscription carries no actual subscription charge invoiced in the last two whole calendar months"
    estimate_share: "When the subscription carries no actual subscription charge invoiced in the last two whole calendar months, the settlement adds full_share_pct percent of it; when it carries exactly one, half_share_pct percent of it; when it carries two or more, none of it."
    latest_credit_id: "the credit statement the subscription's latest access_credit_posted line reports"
    latest_credit_priced: "when no subscription charge yet prices it"
    latest_credit_value: "otherwise it is its credit_value"
    latest_credit_banked: "when it carries a banked_value above 0.00 but below its credit_value, the unbilled value is its credit_value less its banked_value"
    unbilled_value: "when the statement carries a banked_value equal to its whole credit_value, the unbilled value is its credit_value less its banked_value plus half its banked_value; when it carries a banked_value above 0.00 but below its credit_value, the unbilled value is its credit_value less its banked_value; otherwise it is its credit_value."
    unbilled_component: "valued at the unbilled value below and multiplied by (100 minus the rate in force on the settlement date) and divided by 100"
    req_received: "the move transfer request (the subscription's latest access_requests line of request_type move_transfer)"
    req_wait_days: "was received more than 7 calendar days before the settlement date"
    unbilled_share: "When the move transfer request (the subscription's latest access_requests line of request_type move_transfer) was received more than 7 calendar days before the settlement date, the settlement adds full_share_pct percent of it; when 1 to 7 days before, half_share_pct percent of it; otherwise none of it."
    latest_estimate: "the basis is the amount of its latest estimated charge"
    n_actual: "when it carries none but carries at least two actual charges"
    latest_actual: "otherwise the basis is the amount of its latest actual charge"
    prepay_basis: "when the subscription carries an open estimated charge, the basis is the amount of its latest estimated charge; when it carries none but carries at least two actual charges, the basis is the average amount of its actual charges; otherwise the basis is the amount of its latest actual charge."
    last_pay_date: "the bill_date of the subscription's latest access_payment_received line"
    last_pay_days: "from the bill_date of the subscription's latest access_payment_received line to the settlement date"
    prepay_share: "When more than 30 calendar days have passed from the bill_date of the subscription's latest access_payment_received line to the settlement date, the settlement adds full_share_pct percent of it; when 1 to 30 days have passed, half_share_pct percent of it; otherwise none of it."
    past_due_raw: "the past-due figure (the charges due, plus returned payments, less payments and billing credits, which may come to less than zero)"
    result: "plus every added share, never below 0.00, rounded half up to the cent."
  factors:
    - id: not_yet_due_share
      effect: parameter
      decides: nyd_share
      bindings: [actual_due, nyd_component, moved_days, nyd_share]
      ladder:
        - when: "more than 14 calendar days from the stated move_out_date to the settlement date"
          value: "K('full_share_pct')"
        - when: "1 to 14 days"
          value: "K('half_share_pct')"
        - when: "otherwise"
          value: "0"
      baseline:
        nyd_share: "0"
      evidence: [history, date]
      cross_difficulty: null
    - id: open_estimate_share
      effect: parameter
      decides: estimate_share
      bindings: [recent_actuals, estimate_share]
      ladder:
        - when: "no actual subscription charge invoiced in the last two whole calendar months"
          value: "K('full_share_pct')"
        - when: "exactly one"
          value: "K('half_share_pct')"
        - when: "otherwise (two or more)"
          value: "0"
      baseline:
        estimate_share: "0"
      evidence: [history]
      cross_difficulty: null
    - id: unbilled_statement_share
      effect: parameter
      decides: unbilled_share
      bindings: [req_wait_days, unbilled_share]
      ladder:
        - when: "the move transfer request was received more than 7 calendar days before the settlement date"
          value: "K('full_share_pct')"
        - when: "1 to 7 days before"
          value: "K('half_share_pct')"
        - when: "otherwise"
          value: "0"
      baseline:
        unbilled_share: "0"
      evidence: [history, date]
      cross_difficulty: null
    - id: unbilled_banked_value
      effect: method
      decides: unbilled_value
      bindings: [latest_credit_value, latest_credit_banked, unbilled_value]
      ladder:
        - when: "the statement's banked_value equals its whole credit_value"
          method: "credit_value less banked_value plus half the banked_value"
        - when: "banked_value above 0.00 but below credit_value"
          method: "credit_value less banked_value"
        - when: "otherwise"
          method: "credit_value"
      baseline:
        unbilled_value: "latest_credit_value"
      evidence: [history]
      cross_difficulty: null
    - id: final_month_prepay_share
      effect: parameter
      decides: prepay_share
      bindings: [last_pay_date, last_pay_days, prepay_share]
      ladder:
        - when: "more than 30 calendar days from the latest payment's bill_date to the settlement date"
          value: "K('full_share_pct')"
        - when: "1 to 30 days"
          value: "K('half_share_pct')"
        - when: "otherwise"
          value: "0"
      baseline:
        prepay_share: "0"
      evidence: [history, date]
      cross_difficulty: null
    - id: final_month_prepay_basis
      effect: method
      decides: prepay_basis
      bindings: [latest_estimate, n_actual, latest_actual, prepay_basis]
      ladder:
        - when: "the subscription carries an open estimated charge"
          method: "the amount of its latest estimated charge"
        - when: "no open estimate AND at least two actual charges"
          method: "the average amount of its actual charges"
        - when: "otherwise"
          method: "the amount of its latest actual charge"
      baseline:
        prepay_basis: "latest_actual"
      evidence: [history]
      cross_difficulty: null
  baseline:
    rule: >-
      The standard move settlement is the past-due balance of the subscription: the amount of every
      access_charge_billed line whose due_date is on or before the settlement date, plus every
      access_payment_returned line, less every access_payment_received line and every access_billing_credited line
      of the subscription, never below 0.00.
    params: []
  inputs:
    history:
      - {table: access_billing, aggregate: sum, field: amount, filters: {event_type: access_charge_billed}}
      - {table: access_billing, aggregate: sum, field: amount, filters: {event_type: access_payment_received}}
      - {table: access_billing, aggregate: sum, field: amount, filters: {event_type: access_billing_credited}}
      - {table: access_credits, aggregate: latest, field: credit_value, filters: {event_type: access_credit_posted}}
    cross_category: []
- id: access_ext_move_pending_estimate
  base_policy_refs: [access_evt_subscription_charge, access_recertification, access_benefit_basis]
  overwrite:
    - base_policy: access_evt_subscription_charge
      superseded_clause: >-
        an estimated charge equal to the average of the last estimate_basis_months actual charges, rounded half
        up to the cent, may be billed with charge_basis estimated and no credit reference
      replaced_by: >-
        For a subscription in transfer_pending status that carries at least one and no more than
        estimate_basis_months actual subscription charges, and only for such a subscription, the estimated charge for a statement month that
        has gone estimate_wait_days calendar days after its end without a posted credit is figured as this rule
        sets out and is billed with charge_basis estimated and no credit reference; every other estimate remains
        under the base rule, which reads: an estimated charge equal to the average of the last
        estimate_basis_months actual charges, rounded half up to the cent, may be billed with charge_basis
        estimated and no credit reference.
  trigger: state_due
  subject: [access_charge_billed]
  computes: amount
  target_tool: bill_pending_estimate_ff226895
  params:
    young_share_pct_under_6: 90
    young_share_pct_6_to_11: 95
    request_wait_pct_over_7_days: 97
    request_wait_pct_1_to_7_days: 99
    moved_out_pct_over_30_days: 95
    moved_out_pct_1_to_30_days: 98
    share_band_pct_3_to_6_kw: 98
    share_band_pct_over_6_kw: 96
    full_pct: 100
  rule: >-
    This rule prices the estimated subscription charge of a share awaiting its move to a new utility account.
    For a subscription in transfer_pending status that carries at least one and no more than
    estimate_basis_months actual subscription charges, and only for such a subscription, the estimated charge for a statement month that has
    gone estimate_wait_days calendar days after its end without a posted credit is figured as this rule sets out
    and is billed with charge_basis estimated and no credit reference; every other estimate remains under the
    base rule, which reads: an estimated charge equal to the average of the last estimate_basis_months actual
    charges, rounded half up to the cent, may be billed with charge_basis estimated and no credit reference.
    The rate in force on the estimate date is lapsed_savings_rate_pct when the subscription's recert_due_date
    lies more than recert_grace_days calendar days before the estimate date and its income_verified_date is not
    later than that recert_due_date, and otherwise the plan's savings_rate_pct.
    The standard awaiting-move estimate is the average of the subscription's actual subscription charges: the
    basis sum is the amount of every access_charge_billed line of the subscription with charge_basis actual,
    the basis count is the number of those lines, and the estimated charge is the basis sum divided by the basis
    count, rounded half up to the cent.
    Each adjustment below changes the basis sum or sets a percentage; the estimated charge is the adjusted basis
    sum divided by the basis count, multiplied by every percentage below divided by 100, and rounded half up to
    the cent only at the end.
    Rate restatement of the awaiting-move basis: the priced statements are the subscription's
    access_credit_posted lines other than its latest one when no subscription charge prices that latest one, and
    the restated sum is their credit_value multiplied by (100 minus the rate in force on the estimate date) and
    divided by 100. When the billed basis sum differs from the restated sum by more than one cent per basis
    charge and the subscription carries a billing credit with credit_reason billing_error, the basis sum is the
    billed basis sum less those billing-error credits; when it differs by more than one cent per basis charge
    and the subscription carries no billing-error credit, the basis sum is the restated sum; otherwise the
    basis sum is kept as billed.
    Reversal deduction of the awaiting-move basis: when the statement month of the subscription's reversal
    reported last (the access_credit_reversed line with the latest posted_date) carries two or more
    access_credit_posted lines, the basis sum loses nothing for reversals, the re-posting standing in for the
    reversed statement; when the subscription carries an access_credit_reversed line and that statement month
    carries a single access_credit_posted line, the basis sum loses the credit_value of every
    access_credit_reversed line of the subscription multiplied by (100 minus the rate in force on the estimate
    date) and divided by 100; otherwise it loses nothing.
    Young-share percentage of the awaiting-move estimate: when fewer than six whole calendar months have passed
    from the subscription's activation_date to the estimate date, the young-share percentage is
    young_share_pct_under_6; when at least six but fewer than twelve whole calendar months have passed, it is
    young_share_pct_6_to_11; otherwise it is full_pct. Whole calendar months are counted from the
    activation_date to the estimate date, a month being complete on the same day of the later month.
    Request-wait percentage of the awaiting-move estimate: when more than 7 calendar days have passed from the
    received_date of the subscription's latest move_transfer request to the estimate date, the request-wait
    percentage is request_wait_pct_over_7_days; when 1 to 7 days have passed, it is request_wait_pct_1_to_7_days;
    otherwise it is full_pct.
    Moved-out percentage of the awaiting-move estimate: when more than 30 calendar days have passed from the
    stated move_out_date to the estimate date, the moved-out percentage is moved_out_pct_over_30_days; when at
    least one but at most 30 days have passed, it is moved_out_pct_1_to_30_days; otherwise it is full_pct.
    Share-size percentage of the awaiting-move estimate: the share size is the kW of the subscription's
    access_allocation_filed lines with filing_reason initial. When it is more than 6.00 kW, the share-size
    percentage is share_band_pct_over_6_kw; when it is more than 3.00 kW but at most 6.00 kW, it is
    share_band_pct_3_to_6_kw; otherwise it is full_pct.
    The estimated charge is billed on the estimate date and falls due invoice_due_days calendar days later.
  prerequisite: []
  cross_category: []
  compute:
    - rate_now: "P('lapsed_savings_rate_pct') if ((F('recert_due_date') != None and F('recert_due_date') != '') and DAYS(F('recert_due_date'), NOW) > P('recert_grace_days') and DAYS(F('recert_due_date'), F('income_verified_date')) <= 0) else P('savings_rate_pct')"
    - basis_sum_billed: "SUM('access_billing','amount', event_type='access_charge_billed', charge_basis='actual')"
    - basis_count: "COUNT('access_billing', event_type='access_charge_billed', charge_basis='actual')"
    - posted_value_all: "SUM('access_credits','credit_value', event_type='access_credit_posted')"
    - latest_posted_id: "LATEST('access_credits','access_credit_id', date_field='posted_date', event_type='access_credit_posted')"
    - latest_posted_priced: "COUNT('access_billing', event_type='access_charge_billed', access_credit_id=latest_posted_id) if latest_posted_id else 1"
    - latest_posted_value: "float(LATEST('access_credits','credit_value', date_field='posted_date', event_type='access_credit_posted') or 0)"
    - priced_value: "posted_value_all - (latest_posted_value if latest_posted_priced == 0 else 0)"
    - restated_sum: "priced_value * (100 - rate_now) / 100"
    - error_credits: "SUM('access_billing','amount', event_type='access_billing_credited', credit_reason='billing_error')"
    - basis_sum: "(basis_sum_billed - error_credits) if (ABS(basis_sum_billed - restated_sum) > 0.01 * basis_count and error_credits > 0) else (restated_sum if ABS(basis_sum_billed - restated_sum) > 0.01 * basis_count else basis_sum_billed)"
    - rev_value: "SUM('access_credits','credit_value', event_type='access_credit_reversed')"
    - rev_month: "LATEST('access_credits','statement_month', date_field='posted_date', event_type='access_credit_reversed')"
    - rev_month_postings: "COUNT('access_credits', event_type='access_credit_posted', statement_month=rev_month) if rev_month else 0"
    - rev_deduct: "0 if (rev_month and rev_month_postings >= 2) else ((rev_value * (100 - rate_now) / 100) if (rev_month and rev_month_postings == 1) else 0)"
    - months_active: "MONTHS(F('activation_date'), NOW)"
    - young_pct: "K('young_share_pct_under_6') if months_active < 6 else (K('young_share_pct_6_to_11') if months_active < 12 else K('full_pct'))"
    - req_received: "LATEST('access_requests','received_date', date_field='received_date', request_type='move_transfer')"
    - req_wait_days: "DAYS(req_received, NOW) if req_received else 0"
    - wait_pct: "K('request_wait_pct_over_7_days') if req_wait_days > 7 else (K('request_wait_pct_1_to_7_days') if req_wait_days >= 1 else K('full_pct'))"
    - moved_out_days: "DAYS(F('move_out_date'), NOW) if F('move_out_date') else 0"
    - moved_out_pct: "K('moved_out_pct_over_30_days') if moved_out_days > 30 else (K('moved_out_pct_1_to_30_days') if moved_out_days >= 1 else K('full_pct'))"
    - initial_kw: "SUM('access_allocations','kw', event_type='access_allocation_filed', filing_reason='initial')"
    - share_pct: "K('share_band_pct_over_6_kw') if initial_kw > 6.0 else (K('share_band_pct_3_to_6_kw') if initial_kw > 3.0 else K('full_pct'))"
    - basis_average: "(basis_sum - rev_deduct) / basis_count"
    - result: "RND(basis_average * young_pct / 100 * wait_pct / 100 * moved_out_pct / 100 * share_pct / 100 + 0.000000001, 2)"
  compute_basis:
    rate_now: "The rate in force on the estimate date is lapsed_savings_rate_pct when the subscription's recert_due_date lies more than recert_grace_days calendar days before the estimate date and its income_verified_date is not later than that recert_due_date, and otherwise the plan's savings_rate_pct."
    basis_sum_billed: "the basis sum is the amount of every access_charge_billed line of the subscription with charge_basis actual"
    basis_count: "the basis count is the number of those lines"
    posted_value_all: "the priced statements are the subscription's access_credit_posted lines other than its latest one when no subscription charge prices that latest one"
    latest_posted_id: "other than its latest one when no subscription charge prices that latest one"
    latest_posted_priced: "when no subscription charge prices that latest one"
    latest_posted_value: "other than its latest one when no subscription charge prices that latest one"
    priced_value: "the priced statements are the subscription's access_credit_posted lines other than its latest one when no subscription charge prices that latest one"
    restated_sum: "the restated sum is their credit_value multiplied by (100 minus the rate in force on the estimate date) and divided by 100"
    error_credits: "the subscription carries a billing credit with credit_reason billing_error"
    basis_sum: "When the billed basis sum differs from the restated sum by more than one cent per basis charge and the subscription carries a billing credit with credit_reason billing_error, the basis sum is the billed basis sum less those billing-error credits; when it differs by more than one cent per basis charge and the subscription carries no billing-error credit, the basis sum is the restated sum; otherwise the basis sum is kept as billed."
    rev_value: "the credit_value of every access_credit_reversed line of the subscription"
    rev_month: "the statement month of the subscription's reversal reported last (the access_credit_reversed line with the latest posted_date)"
    rev_month_postings: "carries two or more access_credit_posted lines"
    rev_deduct: "when the statement month of the subscription's reversal reported last (the access_credit_reversed line with the latest posted_date) carries two or more access_credit_posted lines, the basis sum loses nothing for reversals, the re-posting standing in for the reversed statement; when the subscription carries an access_credit_reversed line and that statement month carries a single access_credit_posted line, the basis sum loses the credit_value of every access_credit_reversed line of the subscription multiplied by (100 minus the rate in force on the estimate date) and divided by 100; otherwise it loses nothing."
    months_active: "Whole calendar months are counted from the activation_date to the estimate date, a month being complete on the same day of the later month."
    young_pct: "when fewer than six whole calendar months have passed from the subscription's activation_date to the estimate date, the young-share percentage is young_share_pct_under_6; when at least six but fewer than twelve whole calendar months have passed, it is young_share_pct_6_to_11; otherwise it is full_pct."
    req_received: "the received_date of the subscription's latest move_transfer request"
    req_wait_days: "from the received_date of the subscription's latest move_transfer request to the estimate date"
    wait_pct: "when more than 7 calendar days have passed from the received_date of the subscription's latest move_transfer request to the estimate date, the request-wait percentage is request_wait_pct_over_7_days; when 1 to 7 days have passed, it is request_wait_pct_1_to_7_days; otherwise it is full_pct."
    moved_out_days: "from the stated move_out_date to the estimate date"
    moved_out_pct: "when more than 30 calendar days have passed from the stated move_out_date to the estimate date, the moved-out percentage is moved_out_pct_over_30_days; when at least one but at most 30 days have passed, it is moved_out_pct_1_to_30_days; otherwise it is full_pct."
    initial_kw: "the share size is the kW of the subscription's access_allocation_filed lines with filing_reason initial"
    share_pct: "When it is more than 6.00 kW, the share-size percentage is share_band_pct_over_6_kw; when it is more than 3.00 kW but at most 6.00 kW, it is share_band_pct_3_to_6_kw; otherwise it is full_pct."
    basis_average: "the estimated charge is the adjusted basis sum divided by the basis count"
    result: "multiplied by every percentage below divided by 100, and rounded half up to the cent only at the end."
  factors:
    - id: basis_rate_restatement
      effect: method
      decides: basis_sum
      bindings: [posted_value_all, latest_posted_id, latest_posted_priced, latest_posted_value, priced_value, restated_sum, error_credits, basis_sum]
      ladder:
        - when: "the billed basis differs from the restated sum by more than one cent per charge AND a billing-error credit is on the subscription"
          method: "billed basis sum less the billing-error credits"
        - when: "the billed basis differs by more than one cent per charge AND no billing-error credit is on the subscription"
          method: "the restated sum (priced statements at the rate in force on the estimate date)"
        - when: "otherwise"
          method: "the billed basis sum"
      baseline:
        basis_sum: "basis_sum_billed"
      evidence: [history]
      cross_difficulty: null
    - id: reversal_deduction
      effect: method
      decides: rev_deduct
      bindings: [rev_value, rev_month, rev_month_postings, rev_deduct]
      ladder:
        - when: "the statement month of the reversal reported last carries two or more access_credit_posted lines"
          method: "nothing comes off; the re-posting stands in for the reversed statement"
        - when: "the subscription carries a reversal AND that month carries a single posted line"
          method: "every reversal's credit_value priced at the rate in force comes off the basis sum"
        - when: "otherwise"
          method: "nothing comes off"
      baseline:
        rev_deduct: "0"
      evidence: [history]
      cross_difficulty: null
    - id: young_share_pct
      effect: parameter
      decides: young_pct
      bindings: [months_active, young_pct]
      ladder:
        - when: "fewer than six whole calendar months from activation_date to the estimate date"
          value: "K('young_share_pct_under_6')"
        - when: "at least six but fewer than twelve whole calendar months"
          value: "K('young_share_pct_6_to_11')"
        - when: "otherwise"
          value: "K('full_pct')"
      baseline:
        young_pct: "K('full_pct')"
      evidence: [date]
      cross_difficulty: null
    - id: request_wait_pct
      effect: parameter
      decides: wait_pct
      bindings: [req_wait_days, wait_pct]
      ladder:
        - when: "more than 7 calendar days from the latest move_transfer request's received_date to the estimate date"
          value: "K('request_wait_pct_over_7_days')"
        - when: "1 to 7 days"
          value: "K('request_wait_pct_1_to_7_days')"
        - when: "otherwise"
          value: "K('full_pct')"
      baseline:
        wait_pct: "K('full_pct')"
      evidence: [history, date]
      cross_difficulty: null
    - id: moved_out_pct
      effect: parameter
      decides: moved_out_pct
      bindings: [moved_out_days, moved_out_pct]
      ladder:
        - when: "more than 30 calendar days from the stated move_out_date to the estimate date"
          value: "K('moved_out_pct_over_30_days')"
        - when: "at least one but at most 30 days"
          value: "K('moved_out_pct_1_to_30_days')"
        - when: "otherwise"
          value: "K('full_pct')"
      baseline:
        moved_out_pct: "K('full_pct')"
      evidence: [date]
      cross_difficulty: null
    - id: share_band_pct
      effect: parameter
      decides: share_pct
      bindings: [initial_kw, share_pct]
      ladder:
        - when: "initial filing kW more than 6.00"
          value: "K('share_band_pct_over_6_kw')"
        - when: "initial filing kW more than 3.00 and at most 6.00"
          value: "K('share_band_pct_3_to_6_kw')"
        - when: "otherwise"
          value: "K('full_pct')"
      baseline:
        share_pct: "K('full_pct')"
      evidence: [history]
      cross_difficulty: null
  baseline:
    rule: >-
      The standard awaiting-move estimate is the average of the subscription's actual subscription charges: the
      basis sum is the amount of every access_charge_billed line of the subscription with charge_basis actual,
      the basis count is the number of those lines, and the estimated charge is the basis sum divided by the basis
      count, rounded half up to the cent.
    params: []
  inputs:
    history:
      - {table: access_billing, aggregate: sum, field: amount, filters: {event_type: access_charge_billed, charge_basis: actual}}
      - {table: access_credits, aggregate: sum, field: credit_value, filters: {event_type: access_credit_posted}}
      - {table: access_credits, aggregate: sum, field: credit_value, filters: {event_type: access_credit_reversed}}
    cross_category: []
- id: access_ext_move_partial_reversal_credit
  base_policy_refs: [access_evt_credit_correction, access_recertification, access_benefit_basis]
  overwrite:
    - base_policy: access_evt_credit_correction
      superseded_clause: >-
        When the utility reverses a posted credit, the subscription charge that priced that credit line is offset
        by a billing credit equal to that charge's full amount, with credit_reason credit_reversal_correction,
        referring to the charge and carrying the reversed credit line.
      replaced_by: >-
        For a reversal posted on a subscription in transfer_pending status whose credited_kwh is below the
        credited_kwh of the credit line it reverses, and only for such a partial reversal, the reversal-correction
        billing credit is figured as this rule sets out, with credit_reason credit_reversal_correction, referring
        to the charge and carrying the reversed credit line; every other reversal remains under the base rule,
        which reads: When the utility reverses a posted credit, the subscription charge that priced that credit
        line is offset by a billing credit equal to that charge's full amount, with credit_reason
        credit_reversal_correction, referring to the charge and carrying the reversed credit line.
  trigger: state_due
  subject: [access_billing_credited]
  computes: amount
  target_tool: credit_partial_reversal_7609dc6e
  params:
    standard_held_interest_pct: 2.0
    held_interest_pct_over_60_days: 6.0
    held_interest_pct_15_to_60_days: 4.0
    days_per_year_actual: 365
    days_per_year_banker: 360
    rate_restatement_tolerance: 0.0005
    late_restatement_uplift_pct: 2.0
    slow_restatement_uplift_pct: 1.0
  rule: >-
    This rule figures the reversal-correction billing credit for a partial utility reversal that reaches a
    share awaiting its move. For a reversal posted on a subscription in transfer_pending status whose
    credited_kwh is below the credited_kwh of the credit line it reverses, and only for such a partial
    reversal, the reversal-correction billing credit is figured as this rule sets out, with credit_reason
    credit_reversal_correction, referring to the charge and carrying the reversed credit line; every other
    reversal remains under the base rule, which reads: When the utility reverses a posted credit, the
    subscription charge that priced that credit line is offset by a billing credit equal to that charge's full
    amount, with credit_reason credit_reversal_correction, referring to the charge and carrying the reversed
    credit line.
    The reversal taken is the subscription's access_credit_reversed line with the latest posted_date (a
    subscription carries at most one reversal per posted_date); the reversed line is the credit line it names;
    the reversed part is the credit_value and the credited_kwh of every access_credit_reversed line that names
    the reversed line;
    the offset charge is the access_charge_billed line that priced the reversed line; the household's payment
    is the subscription's latest access_payment_received line.
    The standard reversal correction prices the reversed part at the plan's savings rate: the corrected value
    is the reversed part's credit_value, and the correction amount is the corrected value multiplied by (100 minus
    savings_rate_pct) and divided by 100. When the household's payment was received after the offset charge's
    bill_date, the standard correction adds held-payment interest on the correction amount at
    standard_held_interest_pct per year for the days held, the days held being counted from the day after the
    payment's bill_date to the correction date and the year counted as days_per_year_actual days. The standard
    reversal correction is the correction amount plus that interest, rounded half up to the cent.
    Each adjustment below replaces the rate, the corrected value, the interest rate, the start of the days held
    or the length of the interest year, or raises the interest rate; the reversal correction is the corrected value multiplied by (100 minus
    the rate) and divided by 100, plus interest on that amount at the interest rate for the days held over the
    interest year, rounded half up to the cent only at the end.
    Rate of the reversed part: when the reversed line posted more than recert_grace_days calendar days after
    the subscription's recert_due_date and the subscription's income_verified_date is not later than that
    recert_due_date, the reversed part is priced at lapsed_savings_rate_pct; when the offset charge's amount
    differs by more than one cent from the reversed line's credit_value multiplied by (100 minus
    savings_rate_pct) and divided by 100 and that lapse does not apply, the reversed part is priced at the rate
    the offset charge was billed at (100 times one less the offset charge's amount divided by the reversed
    line's credit_value); otherwise it is priced at savings_rate_pct.
    Corrected value of the reversed part: when the reversal's credit_value per credited kWh differs from the
    reversed line's credit_value per credited kWh by more than rate_restatement_tolerance dollars, the
    utility restated the line's rate as well as its kWh, and the corrected value is the reversal's credited_kwh
    multiplied by the reversed line's credit_value per credited kWh; when the reversal carries the reversed
    line's whole credit_value but less than its credited_kwh, the corrected value is the reversed line's
    credit_value multiplied by the reversal's credited_kwh and divided by the reversed line's credited_kwh;
    otherwise the corrected value is the reversal's credit_value.
    Held-payment interest rate of the correction: when more than 60 calendar days have passed from the offset
    charge's due_date to the correction date, the interest rate is held_interest_pct_over_60_days per year; when
    15 to 60 days have passed, it is held_interest_pct_15_to_60_days per year; otherwise it is
    standard_held_interest_pct.
    Start of the days held: when the household's payment was received on or before the offset charge's
    due_date, the days held are counted from the day after the due_date; when it was received after the
    due_date, they are counted from the day after the payment's bill_date; when no payment was received after
    the offset charge's bill_date, no interest is added.
    Interest year of the correction: when the household's payment was made by check, the interest year is
    days_per_year_banker days; when it was made by ach or card, it is days_per_year_actual days; otherwise no
    interest is added.
    Restatement-lag uplift of the interest rate: when the reversal posted more than 60 calendar days after the
    reversed line posted, the interest rate rises by late_restatement_uplift_pct per year; when it posted 31 to
    60 days after, by slow_restatement_uplift_pct per year; otherwise it does not rise.
  prerequisite: []
  cross_category: []
  compute:
    - rev_credit_id: "LATEST('access_credits','access_reversed_credit_id', date_field='posted_date', event_type='access_credit_reversed')"
    - rev_value: "SUM('access_credits','credit_value', event_type='access_credit_reversed', access_reversed_credit_id=rev_credit_id)"
    - rev_kwh: "SUM('access_credits','credited_kwh', event_type='access_credit_reversed', access_reversed_credit_id=rev_credit_id)"
    - line_value: "float(LATEST('access_credits','credit_value', date_field='posted_date', access_credit_id=rev_credit_id))"
    - line_kwh: "float(LATEST('access_credits','credited_kwh', date_field='posted_date', access_credit_id=rev_credit_id))"
    - line_posted: "LATEST('access_credits','posted_date', date_field='posted_date', access_credit_id=rev_credit_id)"
    - charge_amount: "float(LATEST('access_billing','amount', date_field='bill_date', event_type='access_charge_billed', access_credit_id=rev_credit_id))"
    - charge_bill_date: "LATEST('access_billing','bill_date', date_field='bill_date', event_type='access_charge_billed', access_credit_id=rev_credit_id)"
    - charge_due_date: "LATEST('access_billing','due_date', date_field='bill_date', event_type='access_charge_billed', access_credit_id=rev_credit_id)"
    - pay_date: "LATEST('access_billing','bill_date', date_field='bill_date', event_type='access_payment_received')"
    - pay_method: "LATEST('access_billing','payment_method', date_field='bill_date', event_type='access_payment_received')"
    - paid_after_bill: "(pay_date != None) and DAYS(charge_bill_date, pay_date) > 0"
    - s_plan: "P('savings_rate_pct')"
    - lapse_applies: "(F('recert_due_date') != None and F('recert_due_date') != '') and DAYS(F('recert_due_date'), line_posted) > P('recert_grace_days') and DAYS(F('recert_due_date'), F('income_verified_date')) <= 0"
    - billed_off_plan: "ABS(charge_amount - RND(line_value * (100 - s_plan) / 100 + 0.000000001, 2)) > 0.01"
    - rev_rate: "P('lapsed_savings_rate_pct') if lapse_applies else ((100 * (1 - charge_amount / line_value)) if billed_off_plan else s_plan)"
    - unit_gap: "ABS(rev_value / rev_kwh - line_value / line_kwh)"
    - corrected_value: "(rev_kwh * line_value / line_kwh) if unit_gap > K('rate_restatement_tolerance') else ((line_value * rev_kwh / line_kwh) if (rev_value >= line_value and rev_kwh < line_kwh) else rev_value)"
    - correction_base: "corrected_value * (100 - rev_rate) / 100"
    - days_from_due: "DAYS(charge_due_date, NOW)"
    - days_from_pay: "DAYS(pay_date, NOW) if pay_date else 0"
    - days_held: "(days_from_due if DAYS(charge_due_date, pay_date) <= 0 else days_from_pay) if paid_after_bill else 0"
    - due_age_days: "DAYS(charge_due_date, NOW)"
    - interest_pct: "K('held_interest_pct_over_60_days') if due_age_days > 60 else (K('held_interest_pct_15_to_60_days') if due_age_days >= 15 else K('standard_held_interest_pct'))"
    - year_days: "K('days_per_year_banker') if pay_method == 'check' else (K('days_per_year_actual') if (pay_method == 'ach' or pay_method == 'card') else 0)"
    - rev_posted: "LATEST('access_credits','posted_date', date_field='posted_date', event_type='access_credit_reversed')"
    - restatement_lag: "DAYS(line_posted, rev_posted)"
    - uplift_pct: "K('late_restatement_uplift_pct') if restatement_lag > 60 else (K('slow_restatement_uplift_pct') if restatement_lag >= 31 else 0)"
    - interest: "(correction_base * (interest_pct + uplift_pct) / 100 * days_held / year_days) if (year_days > 0 and days_held > 0) else 0.0"
    - result: "RND(correction_base + interest + 0.000000001, 2)"
  compute_basis:
    rev_credit_id: "the reversed line is the credit line it names"
    rev_value: "the reversed part is the credit_value and the credited_kwh of every access_credit_reversed line that names the reversed line"
    rev_kwh: "the reversed part is the credit_value and the credited_kwh of every access_credit_reversed line that names the reversed line"
    line_value: "the reversed line's credit_value per credited kWh"
    line_kwh: "the reversed line's credited_kwh"
    line_posted: "when the reversed line posted more than recert_grace_days calendar days after the subscription's recert_due_date"
    charge_amount: "the offset charge is the access_charge_billed line that priced the reversed line"
    charge_bill_date: "When the household's payment was received after the offset charge's bill_date"
    charge_due_date: "when the household's payment was received on or before the offset charge's due_date, the days held are counted from the day after the due_date"
    pay_date: "the household's payment is the subscription's latest access_payment_received line"
    pay_method: "when the household's payment was made by check, the interest year is days_per_year_banker days; when it was made by ach or card, it is days_per_year_actual days"
    paid_after_bill: "When the household's payment was received after the offset charge's bill_date"
    s_plan: "the correction amount is the corrected value multiplied by (100 minus savings_rate_pct) and divided by 100"
    lapse_applies: "when the reversed line posted more than recert_grace_days calendar days after the subscription's recert_due_date and the subscription's income_verified_date is not later than that recert_due_date"
    billed_off_plan: "when the offset charge's amount differs by more than one cent from the reversed line's credit_value multiplied by (100 minus savings_rate_pct) and divided by 100 and that lapse does not apply"
    rev_rate: "when the reversed line posted more than recert_grace_days calendar days after the subscription's recert_due_date and the subscription's income_verified_date is not later than that recert_due_date, the reversed part is priced at lapsed_savings_rate_pct; when the offset charge's amount differs by more than one cent from the reversed line's credit_value multiplied by (100 minus savings_rate_pct) and divided by 100 and that lapse does not apply, the reversed part is priced at the rate the offset charge was billed at (100 times one less the offset charge's amount divided by the reversed line's credit_value); otherwise it is priced at savings_rate_pct."
    unit_gap: "when the reversal's credit_value per credited kWh differs from the reversed line's credit_value per credited kWh by more than rate_restatement_tolerance dollars"
    corrected_value: "when the reversal's credit_value per credited kWh differs from the reversed line's credit_value per credited kWh by more than rate_restatement_tolerance dollars, the utility restated the line's rate as well as its kWh, and the corrected value is the reversal's credited_kwh multiplied by the reversed line's credit_value per credited kWh; when the reversal carries the reversed line's whole credit_value but less than its credited_kwh, the corrected value is the reversed line's credit_value multiplied by the reversal's credited_kwh and divided by the reversed line's credited_kwh; otherwise the corrected value is the reversal's credit_value."
    correction_base: "the reversal correction is the corrected value multiplied by (100 minus the rate) and divided by 100"
    days_from_due: "the days held are counted from the day after the due_date"
    days_from_pay: "they are counted from the day after the payment's bill_date"
    days_held: "when the household's payment was received on or before the offset charge's due_date, the days held are counted from the day after the due_date; when it was received after the due_date, they are counted from the day after the payment's bill_date; when no payment was received after the offset charge's bill_date, no interest is added."
    due_age_days: "from the offset charge's due_date to the correction date"
    interest_pct: "when more than 60 calendar days have passed from the offset charge's due_date to the correction date, the interest rate is held_interest_pct_over_60_days per year; when 15 to 60 days have passed, it is held_interest_pct_15_to_60_days per year; otherwise it is standard_held_interest_pct."
    year_days: "when the household's payment was made by check, the interest year is days_per_year_banker days; when it was made by ach or card, it is days_per_year_actual days; otherwise no interest is added."
    rev_posted: "when the reversal posted more than 60 calendar days after the reversed line posted"
    restatement_lag: "when the reversal posted more than 60 calendar days after the reversed line posted"
    uplift_pct: "when the reversal posted more than 60 calendar days after the reversed line posted, the interest rate rises by late_restatement_uplift_pct per year; when it posted 31 to 60 days after, by slow_restatement_uplift_pct per year; otherwise it does not rise."
    interest: "plus interest on that amount at the interest rate for the days held over the interest year"
    result: "rounded half up to the cent only at the end."
  factors:
    - id: reversed_part_rate
      effect: parameter
      decides: rev_rate
      bindings: [line_posted, lapse_applies, billed_off_plan, rev_rate]
      ladder:
        - when: "the reversed line posted more than recert_grace_days days after recert_due_date AND income_verified_date not later than recert_due_date"
          value: "P('lapsed_savings_rate_pct')"
        - when: "the offset charge differs by more than one cent from the plan-rate price of the reversed line AND that lapse does not apply"
          value: "the rate the offset charge was billed at"
        - when: "otherwise"
          value: "P('savings_rate_pct')"
      baseline:
        rev_rate: "s_plan"
      evidence: [history, date]
      cross_difficulty: null
    - id: corrected_value_basis
      effect: method
      decides: corrected_value
      bindings: [rev_kwh, line_kwh, unit_gap, corrected_value]
      ladder:
        - when: "the reversal's value per kWh differs from the reversed line's by more than rate_restatement_tolerance"
          method: "reversal kWh times the reversed line's value per kWh"
        - when: "the reversal carries the line's whole credit_value but less than its kWh"
          method: "the line's credit_value times reversal kWh over line kWh"
        - when: "otherwise"
          method: "the reversal's credit_value"
      baseline:
        corrected_value: "rev_value"
      evidence: [history]
      cross_difficulty: null
    - id: held_interest_rate
      effect: parameter
      decides: interest_pct
      bindings: [due_age_days, interest_pct]
      ladder:
        - when: "more than 60 days from the offset charge's due_date to the correction date"
          value: "K('held_interest_pct_over_60_days')"
        - when: "15 to 60 days"
          value: "K('held_interest_pct_15_to_60_days')"
        - when: "otherwise"
          value: "K('standard_held_interest_pct')"
      baseline:
        interest_pct: "K('standard_held_interest_pct')"
      evidence: [date]
      cross_difficulty: null
    - id: held_days_start
      effect: method
      decides: days_held
      bindings: [days_from_due, days_held]
      ladder:
        - when: "the household's payment was received on or before the offset charge's due_date"
          method: "days held counted from the day after the due_date"
        - when: "the payment was received after the due_date"
          method: "days held counted from the day after the payment's bill_date"
        - when: "otherwise (no payment after the offset charge's bill_date)"
          method: "no interest"
      baseline:
        days_held: "days_from_pay if paid_after_bill else 0"
      evidence: [history, date]
      cross_difficulty: null
    - id: interest_year
      effect: parameter
      decides: year_days
      bindings: [pay_method, year_days]
      ladder:
        - when: "the household's payment was made by check"
          value: "K('days_per_year_banker')"
        - when: "it was made by ach or card"
          value: "K('days_per_year_actual')"
        - when: "otherwise"
          value: "no interest"
      baseline:
        year_days: "K('days_per_year_actual')"
      evidence: [history]
      cross_difficulty: null
    - id: restatement_lag_uplift
      effect: parameter
      decides: uplift_pct
      bindings: [rev_posted, restatement_lag, uplift_pct]
      ladder:
        - when: "the reversal posted more than 60 calendar days after the reversed line posted"
          value: "K('late_restatement_uplift_pct')"
        - when: "it posted 31 to 60 days after"
          value: "K('slow_restatement_uplift_pct')"
        - when: "otherwise"
          value: "0"
      baseline:
        uplift_pct: "0"
      evidence: [history, date]
      cross_difficulty: null
  baseline:
    rule: >-
      The standard reversal correction prices the reversed part at the plan's savings rate: the corrected value
      is the reversed part's credit_value, and the correction amount is the corrected value multiplied by (100 minus
      savings_rate_pct) and divided by 100. When the household's payment was received after the offset charge's
      bill_date, the standard correction adds held-payment interest on the correction amount at
      standard_held_interest_pct per year for the days held, the days held being counted from the day after the
      payment's bill_date to the correction date and the year counted as days_per_year_actual days. The standard
      reversal correction is the correction amount plus that interest, rounded half up to the cent.
    params: [savings_rate_pct, standard_held_interest_pct, days_per_year_actual]
  inputs:
    history:
      - {table: access_credits, aggregate: latest, field: credit_value, filters: {event_type: access_credit_reversed}}
      - {table: access_billing, aggregate: latest, field: amount, filters: {event_type: access_charge_billed}}
      - {table: access_billing, aggregate: latest, field: bill_date, filters: {event_type: access_payment_received}}
    cross_category: []
- id: access_ext_move_closing_payment
  base_policy_refs: [access_evt_payment_application, access_evt_subscription_charge, access_benefit_basis]
  overwrite: []
  trigger: on_request
  subject: [access_payment_received]
  computes: amount
  target_tool: pay_closing_balance_ce594868
  params:
    full_share_pct: 100
    half_share_pct: 50
  rule: >-
    This rule fixes the closing payment a household pays itself, through the secure payment portal, to settle
    the ledger of a Meadowlark Access share that closed at a move (status closed with closure_reason
    moved_out_of_territory, transfer_not_completed or eligibility_lapsed). Meadowlark representatives never take card or bank account numbers and no payment method
    is kept on file: the household makes the payment in person by ach or card through the portal, and the
    payment settles open lines under the base payment application order; any part not yet matched by a line is
    held as a credit against the closed share's later statements.
    The closing payment is fixed only after every reversal line posted on the closed subscription carries
    its reversal-correction billing credit. The closing payment is not fixed until every statement month before the
    closing that has gone the plan's estimate waiting period after its end without a posted credit carries an
    estimated charge.
    The standard closing payment is the past-due balance of the subscription: the amount of every
    access_charge_billed line whose due_date is on or before the settlement date, plus every
    access_payment_returned line, less every access_payment_received line and every access_billing_credited line
    of the subscription, never below 0.00.
    Each adjustment below adds a share of a further ledger component; the closing payment is the past-due figure
    (the charges due, plus returned payments, less payments and billing credits, which may come to less than
    zero) plus every added share, never below 0.00, rounded half up to the cent.
    Not-yet-due charges of the closing payment: the component is the amount of the subscription's
    access_charge_billed lines with charge_basis actual whose due_date is after the settlement date. When more
    than 14 calendar days have passed from the stated move_out_date to the settlement date, the settlement adds
    full_share_pct percent of it; when 1 to 14 days have passed, half_share_pct percent of it; otherwise none of
    it.
    Open estimates of the closing payment: the component is the amount of the subscription's
    access_charge_billed lines with charge_basis estimated whose due_date is after the settlement date. When the
    subscription carries no actual subscription charge invoiced in the last two whole calendar months, the
    settlement adds full_share_pct percent of it; when it carries exactly one, half_share_pct percent of it; when
    it carries two or more, none of it.
    Unbilled statement of the closing payment: the component is the credit statement the subscription's latest
    access_credit_posted line reports when no subscription charge yet prices it, valued at the unbilled value
    below and multiplied by (100 minus the rate in force on the settlement date) and divided by 100. The rate in
    force on the settlement date is lapsed_savings_rate_pct when the subscription's recert_due_date lies more
    than recert_grace_days calendar days before the settlement date and its income_verified_date is not later
    than that recert_due_date, and otherwise the plan's savings_rate_pct. When the move transfer request
    (the subscription's latest access_requests line of request_type move_transfer) was received more than 7
    calendar days before the settlement date, the settlement adds full_share_pct percent of it; when 1 to 7 days
    before, half_share_pct percent of it; otherwise none of it.
    Unbilled value of that statement: when the statement carries a banked_value equal to its whole
    credit_value, the unbilled value is its credit_value less its banked_value plus half its banked_value; when it
    carries a banked_value above 0.00 but below its credit_value, the unbilled value is its credit_value less
    its banked_value; otherwise it is its credit_value.
    Final-month prepayment of the closing payment: the component is one statement's worth for the closed share's
    final statement month (the month before the closing date), valued at the prepayment basis below.
    When more than 30 calendar days have passed from the bill_date of the subscription's latest
    access_payment_received line to the settlement date, the settlement adds full_share_pct percent of it; when 1
    to 30 days have passed, half_share_pct percent of it; otherwise none of it.
    Prepayment basis of the final month: when the subscription carries an open estimated charge, the basis is
    the amount of its latest estimated charge; when it carries none but carries at least two actual charges, the
    basis is the average amount of its actual charges; otherwise the basis is the amount of its latest actual
    charge.
  prerequisite:
    - problem: access_ext_move_closed_reversal_credit
      kind: value_input
      gate: credits_total
      form: state
      policy_source: >-
        The closing payment is fixed only after every reversal line posted on the closed subscription carries
        its reversal-correction billing credit.
      condition: >-
        Every access_credit_reversed line of the subscription is named by an access_billing_credited line with
        credit_reason credit_reversal_correction.
      resolved_by: credit_closed_reversal_cc3dddf3
      effect: >-
        The reversal-correction billing credit enters the billing credits the standard closing payment deducts.
    - problem: access_ext_move_closing_estimate
      kind: value_input
      gate: estimate_open
      form: state
      policy_source: >-
        The closing payment is not fixed until every statement month before the closing that has gone
        the plan's estimate waiting period after its end without a posted credit carries an estimated charge.
      condition: >-
        Every statement month of the subscription that ended more than estimate_wait_days calendar days before the
        settlement date carries an access_credit_posted line or an access_charge_billed line with charge_basis
        estimated.
      resolved_by: bill_closing_estimate_4dff6268
      effect: >-
        The estimated charge enters the open-estimates component and the final-month prepayment basis.
  cross_category: []
  compute:
    - s_plan: "P('lapsed_savings_rate_pct') if ((F('recert_due_date') != None and F('recert_due_date') != '') and DAYS(F('recert_due_date'), NOW) > P('recert_grace_days') and DAYS(F('recert_due_date'), F('income_verified_date')) <= 0) else P('savings_rate_pct')"
    - due_charges: "SUM('access_billing','amount', within_months=600, date_field='due_date', event_type='access_charge_billed')"
    - returned_total: "SUM('access_billing','amount', event_type='access_payment_returned')"
    - paid_total: "SUM('access_billing','amount', event_type='access_payment_received')"
    - credits_total: "SUM('access_billing','amount', event_type='access_billing_credited')"
    - past_due: "MX(0, due_charges + returned_total - paid_total - credits_total)"
    - actual_all: "SUM('access_billing','amount', event_type='access_charge_billed', charge_basis='actual')"
    - actual_due: "SUM('access_billing','amount', within_months=600, date_field='due_date', event_type='access_charge_billed', charge_basis='actual')"
    - nyd_component: "actual_all - actual_due"
    - moved_days: "DAYS(F('move_out_date'), NOW) if F('move_out_date') else 0"
    - nyd_share: "K('full_share_pct') if moved_days > 14 else (K('half_share_pct') if moved_days >= 1 else 0)"
    - estimated_all: "SUM('access_billing','amount', event_type='access_charge_billed', charge_basis='estimated')"
    - estimated_due: "SUM('access_billing','amount', within_months=600, date_field='due_date', event_type='access_charge_billed', charge_basis='estimated')"
    - estimate_open: "estimated_all - estimated_due"
    - recent_actuals: "COUNT('access_billing', within_months=2, date_field='bill_date', event_type='access_charge_billed', charge_basis='actual')"
    - estimate_share: "K('full_share_pct') if recent_actuals == 0 else (K('half_share_pct') if recent_actuals == 1 else 0)"
    - latest_credit_id: "LATEST('access_credits','access_credit_id', date_field='posted_date', event_type='access_credit_posted')"
    - latest_credit_priced: "COUNT('access_billing', event_type='access_charge_billed', access_credit_id=latest_credit_id) if latest_credit_id else 1"
    - latest_credit_value: "float(LATEST('access_credits','credit_value', date_field='posted_date', event_type='access_credit_posted') or 0)"
    - latest_credit_banked: "float(LATEST('access_credits','banked_value', date_field='posted_date', event_type='access_credit_posted') or 0)"
    - unbilled_value: "(latest_credit_value - latest_credit_banked + latest_credit_banked / 2) if (latest_credit_banked > 0 and latest_credit_banked >= latest_credit_value) else ((latest_credit_value - latest_credit_banked) if latest_credit_banked > 0 else latest_credit_value)"
    - unbilled_component: "(unbilled_value * (100 - s_plan) / 100) if latest_credit_priced == 0 else 0.0"
    - req_received: "LATEST('access_requests','received_date', date_field='received_date', request_type='move_transfer')"
    - req_wait_days: "DAYS(req_received, NOW) if req_received else 0"
    - unbilled_share: "K('full_share_pct') if req_wait_days > 7 else (K('half_share_pct') if req_wait_days >= 1 else 0)"
    - latest_estimate: "float(LATEST('access_billing','amount', date_field='bill_date', event_type='access_charge_billed', charge_basis='estimated') or 0)"
    - n_actual: "COUNT('access_billing', event_type='access_charge_billed', charge_basis='actual')"
    - latest_actual: "float(LATEST('access_billing','amount', date_field='bill_date', event_type='access_charge_billed', charge_basis='actual') or 0)"
    - prepay_basis: "latest_estimate if estimate_open > 0 else ((actual_all / n_actual) if n_actual >= 2 else latest_actual)"
    - last_pay_date: "LATEST('access_billing','bill_date', date_field='bill_date', event_type='access_payment_received')"
    - last_pay_days: "DAYS(last_pay_date, NOW) if last_pay_date else 0"
    - prepay_share: "K('full_share_pct') if last_pay_days > 30 else (K('half_share_pct') if last_pay_days >= 1 else 0)"
    - past_due_raw: "due_charges + returned_total - paid_total - credits_total"
    - result: "RND(MX(0, past_due_raw + nyd_component * nyd_share / 100 + estimate_open * estimate_share / 100 + unbilled_component * unbilled_share / 100 + prepay_basis * prepay_share / 100) + 0.000000001, 2)"
  compute_basis:
    s_plan: "The rate in force on the settlement date is lapsed_savings_rate_pct when the subscription's recert_due_date lies more than recert_grace_days calendar days before the settlement date and its income_verified_date is not later than that recert_due_date, and otherwise the plan's savings_rate_pct."
    due_charges: "the amount of every access_charge_billed line whose due_date is on or before the settlement date"
    returned_total: "plus every access_payment_returned line"
    paid_total: "less every access_payment_received line and every access_billing_credited line of the subscription"
    credits_total: "less every access_payment_received line and every access_billing_credited line of the subscription"
    past_due: "never below 0.00"
    actual_all: "the component is the amount of the subscription's access_charge_billed lines with charge_basis actual whose due_date is after the settlement date"
    actual_due: "the component is the amount of the subscription's access_charge_billed lines with charge_basis actual whose due_date is after the settlement date"
    nyd_component: "the component is the amount of the subscription's access_charge_billed lines with charge_basis actual whose due_date is after the settlement date"
    moved_days: "from the stated move_out_date to the settlement date"
    nyd_share: "When more than 14 calendar days have passed from the stated move_out_date to the settlement date, the settlement adds full_share_pct percent of it; when 1 to 14 days have passed, half_share_pct percent of it; otherwise none of it."
    estimated_all: "the component is the amount of the subscription's access_charge_billed lines with charge_basis estimated whose due_date is after the settlement date"
    estimated_due: "the component is the amount of the subscription's access_charge_billed lines with charge_basis estimated whose due_date is after the settlement date"
    estimate_open: "the component is the amount of the subscription's access_charge_billed lines with charge_basis estimated whose due_date is after the settlement date"
    recent_actuals: "When the subscription carries no actual subscription charge invoiced in the last two whole calendar months"
    estimate_share: "When the subscription carries no actual subscription charge invoiced in the last two whole calendar months, the settlement adds full_share_pct percent of it; when it carries exactly one, half_share_pct percent of it; when it carries two or more, none of it."
    latest_credit_id: "the credit statement the subscription's latest access_credit_posted line reports"
    latest_credit_priced: "when no subscription charge yet prices it"
    latest_credit_value: "otherwise it is its credit_value"
    latest_credit_banked: "when it carries a banked_value above 0.00 but below its credit_value, the unbilled value is its credit_value less its banked_value"
    unbilled_value: "when the statement carries a banked_value equal to its whole credit_value, the unbilled value is its credit_value less its banked_value plus half its banked_value; when it carries a banked_value above 0.00 but below its credit_value, the unbilled value is its credit_value less its banked_value; otherwise it is its credit_value."
    unbilled_component: "valued at the unbilled value below and multiplied by (100 minus the rate in force on the settlement date) and divided by 100"
    req_received: "the move transfer request (the subscription's latest access_requests line of request_type move_transfer)"
    req_wait_days: "was received more than 7 calendar days before the settlement date"
    unbilled_share: "When the move transfer request (the subscription's latest access_requests line of request_type move_transfer) was received more than 7 calendar days before the settlement date, the settlement adds full_share_pct percent of it; when 1 to 7 days before, half_share_pct percent of it; otherwise none of it."
    latest_estimate: "the basis is the amount of its latest estimated charge"
    n_actual: "when it carries none but carries at least two actual charges"
    latest_actual: "otherwise the basis is the amount of its latest actual charge"
    prepay_basis: "when the subscription carries an open estimated charge, the basis is the amount of its latest estimated charge; when it carries none but carries at least two actual charges, the basis is the average amount of its actual charges; otherwise the basis is the amount of its latest actual charge."
    last_pay_date: "the bill_date of the subscription's latest access_payment_received line"
    last_pay_days: "from the bill_date of the subscription's latest access_payment_received line to the settlement date"
    prepay_share: "When more than 30 calendar days have passed from the bill_date of the subscription's latest access_payment_received line to the settlement date, the settlement adds full_share_pct percent of it; when 1 to 30 days have passed, half_share_pct percent of it; otherwise none of it."
    past_due_raw: "the past-due figure (the charges due, plus returned payments, less payments and billing credits, which may come to less than zero)"
    result: "plus every added share, never below 0.00, rounded half up to the cent."
  factors:
    - id: not_yet_due_share
      effect: parameter
      decides: nyd_share
      bindings: [actual_due, nyd_component, moved_days, nyd_share]
      ladder:
        - when: "more than 14 calendar days from the stated move_out_date to the settlement date"
          value: "K('full_share_pct')"
        - when: "1 to 14 days"
          value: "K('half_share_pct')"
        - when: "otherwise"
          value: "0"
      baseline:
        nyd_share: "0"
      evidence: [history, date]
      cross_difficulty: null
    - id: open_estimate_share
      effect: parameter
      decides: estimate_share
      bindings: [recent_actuals, estimate_share]
      ladder:
        - when: "no actual subscription charge invoiced in the last two whole calendar months"
          value: "K('full_share_pct')"
        - when: "exactly one"
          value: "K('half_share_pct')"
        - when: "otherwise (two or more)"
          value: "0"
      baseline:
        estimate_share: "0"
      evidence: [history]
      cross_difficulty: null
    - id: unbilled_statement_share
      effect: parameter
      decides: unbilled_share
      bindings: [req_wait_days, unbilled_share]
      ladder:
        - when: "the move transfer request was received more than 7 calendar days before the settlement date"
          value: "K('full_share_pct')"
        - when: "1 to 7 days before"
          value: "K('half_share_pct')"
        - when: "otherwise"
          value: "0"
      baseline:
        unbilled_share: "0"
      evidence: [history, date]
      cross_difficulty: null
    - id: unbilled_banked_value
      effect: method
      decides: unbilled_value
      bindings: [latest_credit_value, latest_credit_banked, unbilled_value]
      ladder:
        - when: "the statement's banked_value equals its whole credit_value"
          method: "credit_value less banked_value plus half the banked_value"
        - when: "banked_value above 0.00 but below credit_value"
          method: "credit_value less banked_value"
        - when: "otherwise"
          method: "credit_value"
      baseline:
        unbilled_value: "latest_credit_value"
      evidence: [history]
      cross_difficulty: null
    - id: final_month_prepay_share
      effect: parameter
      decides: prepay_share
      bindings: [last_pay_date, last_pay_days, prepay_share]
      ladder:
        - when: "more than 30 calendar days from the latest payment's bill_date to the settlement date"
          value: "K('full_share_pct')"
        - when: "1 to 30 days"
          value: "K('half_share_pct')"
        - when: "otherwise"
          value: "0"
      baseline:
        prepay_share: "0"
      evidence: [history, date]
      cross_difficulty: null
    - id: final_month_prepay_basis
      effect: method
      decides: prepay_basis
      bindings: [latest_estimate, n_actual, latest_actual, prepay_basis]
      ladder:
        - when: "the subscription carries an open estimated charge"
          method: "the amount of its latest estimated charge"
        - when: "no open estimate AND at least two actual charges"
          method: "the average amount of its actual charges"
        - when: "otherwise"
          method: "the amount of its latest actual charge"
      baseline:
        prepay_basis: "latest_actual"
      evidence: [history]
      cross_difficulty: null
  baseline:
    rule: >-
      The standard closing payment is the past-due balance of the subscription: the amount of every
      access_charge_billed line whose due_date is on or before the settlement date, plus every
      access_payment_returned line, less every access_payment_received line and every access_billing_credited line
      of the subscription, never below 0.00.
    params: []
  inputs:
    history:
      - {table: access_billing, aggregate: sum, field: amount, filters: {event_type: access_charge_billed}}
      - {table: access_billing, aggregate: sum, field: amount, filters: {event_type: access_payment_received}}
      - {table: access_billing, aggregate: sum, field: amount, filters: {event_type: access_billing_credited}}
      - {table: access_credits, aggregate: latest, field: credit_value, filters: {event_type: access_credit_posted}}
    cross_category: []
- id: access_ext_move_closing_estimate
  base_policy_refs: [access_evt_subscription_charge, access_recertification, access_benefit_basis]
  overwrite:
    - base_policy: access_evt_subscription_charge
      superseded_clause: >-
        an estimated charge equal to the average of the last estimate_basis_months actual charges, rounded half
        up to the cent, may be billed with charge_basis estimated and no credit reference
      replaced_by: >-
        For a subscription that closed at a move transfer (closure_reason moved_out_of_territory,
        transfer_not_completed or eligibility_lapsed) and carries at least one but fewer than estimate_basis_months actual
        subscription charges, and only for such a subscription, the estimated charge for a statement month that has gone
        estimate_wait_days calendar days after its end without a posted credit is figured as this rule sets out
        and is billed with charge_basis estimated and no credit reference; every other estimate remains under
        the base rule, which reads: an estimated charge equal to the average of the last estimate_basis_months
        actual charges, rounded half up to the cent, may be billed with charge_basis estimated and no credit
        reference.
  trigger: state_due
  subject: [access_charge_billed]
  computes: amount
  target_tool: bill_closing_estimate_4dff6268
  params:
    young_share_pct_under_6: 90
    young_share_pct_6_to_11: 95
    request_age_pct_over_45_days: 96
    request_age_pct_15_to_45_days: 98
    departure_pct_over_30_days: 94
    departure_pct_1_to_30_days: 97
    share_band_pct_3_to_6_kw: 98
    share_band_pct_over_6_kw: 96
    full_pct: 100
  rule: >-
    This rule prices the estimated subscription charge of a share that closed at a move. For a subscription
    that closed at a move transfer (closure_reason moved_out_of_territory, transfer_not_completed or
    eligibility_lapsed) and carries at least one but fewer than estimate_basis_months actual subscription charges, and only for
    such a subscription, the estimated charge for a statement month that has gone estimate_wait_days calendar
    days after its end without a posted credit is figured as this rule sets out and is billed with
    charge_basis estimated and no credit reference; every other estimate remains under the base rule, which
    reads: an estimated charge equal to the average of the last estimate_basis_months actual charges, rounded
    half up to the cent, may be billed with charge_basis estimated and no credit reference.
    The rate in force on the estimate date is lapsed_savings_rate_pct when the subscription's recert_due_date
    lies more than recert_grace_days calendar days before the estimate date and its income_verified_date is not
    later than that recert_due_date, and otherwise the plan's savings_rate_pct.
    The standard estimate for a share closed at a move rests on the subscription's own priced statements: the
    priced statements are its access_credit_posted lines other than its latest one when no subscription charge
    prices that latest one; the basis sum is their credit_value and the basis count is their number. The
    standard estimated charge is the basis sum divided by the basis count, multiplied by (100 minus the rate in
    force on the estimate date) and divided by 100, rounded half up to the cent.
    Each adjustment below changes the basis sum, the basis count or a percentage; the estimated charge is the
    adjusted basis sum divided by the adjusted basis count, multiplied by (100 minus the rate in force on the
    estimate date) and divided by 100, then multiplied by every percentage below divided by 100, and rounded
    half up to the cent only at the end.
    Reversal restatement of the estimate basis: when the statement month of the subscription's reversal
    reported last (the access_credit_reversed line with the latest posted_date) carries two or more
    access_credit_posted lines, the reversed statement was re-posted: the credit_value of every
    access_credit_reversed line of the subscription comes off the basis sum and the basis count falls by one;
    when the subscription carries an access_credit_reversed line and that statement month carries a single
    access_credit_posted line, the credit_value of every access_credit_reversed line of the subscription comes
    off the basis sum and the basis count is unchanged; otherwise the basis is taken as posted.
    Residential fill of the estimate basis: the basis sum takes the value of the added statements and the
    basis count takes their number, set as follows. When a
    residential plan on the same utility account closed with closure_reason converted_to_access and that plan
    carries at least as many home_credit_posted lines as the estimate basis lacks (estimate_basis_months less
    the basis count), the estimate basis takes as many added statements as it lacks; when such a converted
    residential plan carries at least one home_credit_posted line but fewer than the basis lacks, the estimate
    basis takes as many added statements as that plan carries; otherwise the estimate basis takes no added
    statement. Each added statement is valued at the credit_value of the converted residential plan's
    home_credit_posted line with the latest posted_date (the utility's own reported value; it is priced
    only through the rate in force on this subscription).
    Young-share percentage of the estimate: when fewer than six whole calendar months have passed from the
    subscription's activation_date to the estimate date, the young-share percentage is
    young_share_pct_under_6; when at least six but fewer than twelve whole calendar months have passed, it is
    young_share_pct_6_to_11; otherwise it is full_pct. Whole calendar months are counted from the
    activation_date to the estimate date, a month being complete on the same day of the later month.
    Request-age percentage of the estimate: when more than 45 calendar days have passed from the received_date of
    the subscription's latest move_transfer request to the estimate date, the request-age percentage is
    request_age_pct_over_45_days; when 15 to 45 days have passed, it is request_age_pct_15_to_45_days; otherwise it is
    full_pct.
    Departure percentage of the estimate: when more than 30 calendar days have passed from the subscription's
    closed_date to the estimate date, the departure percentage is departure_pct_over_30_days; when 1 to 30
    days have passed, it is departure_pct_1_to_30_days; otherwise it is full_pct.
    Share-size percentage of the estimate: the share size is the kW of the subscription's
    access_allocation_filed lines with filing_reason initial. When it is more than 6.00 kW, the share-size
    percentage is share_band_pct_over_6_kw; when it is more than 3.00 kW but at most 6.00 kW, it is
    share_band_pct_3_to_6_kw; otherwise it is full_pct.
    The estimated charge is billed on the estimate date and falls due invoice_due_days calendar days later.
  prerequisite: []
  cross_category:
    - category: home
      as: history
      reads: [closure_reason, utility_account_id, home_credits.credit_value, home_credits.posted_date, home_credits.event_type]
      note: residential fill of the estimate basis reads the converted residential plan on the same utility account and its posted statements
  compute:
    - s_plan: "P('lapsed_savings_rate_pct') if ((F('recert_due_date') != None and F('recert_due_date') != '') and DAYS(F('recert_due_date'), NOW) > P('recert_grace_days') and DAYS(F('recert_due_date'), F('income_verified_date')) <= 0) else P('savings_rate_pct')"
    - posted_sum: "SUM('access_credits','credit_value', event_type='access_credit_posted')"
    - posted_count: "COUNT('access_credits', event_type='access_credit_posted')"
    - latest_posted_id: "LATEST('access_credits','access_credit_id', date_field='posted_date', event_type='access_credit_posted')"
    - latest_posted_priced: "COUNT('access_billing', event_type='access_charge_billed', access_credit_id=latest_posted_id) if latest_posted_id else 1"
    - latest_posted_value: "float(LATEST('access_credits','credit_value', date_field='posted_date', event_type='access_credit_posted') or 0)"
    - basis_sum: "posted_sum - (latest_posted_value if latest_posted_priced == 0 else 0)"
    - basis_count: "posted_count - (1 if latest_posted_priced == 0 else 0)"
    - basis_lack: "MX(0, P('estimate_basis_months') - basis_count)"
    - rev_value: "SUM('access_credits','credit_value', event_type='access_credit_reversed')"
    - rev_month: "LATEST('access_credits','statement_month', date_field='posted_date', event_type='access_credit_reversed')"
    - rev_month_postings: "COUNT('access_credits', event_type='access_credit_posted', statement_month=rev_month) if rev_month else 0"
    - reversal_mode: "2 if (rev_month and rev_month_postings >= 2) else (1 if (rev_month and rev_month_postings == 1) else 0)"
    - rev_sum_off: "rev_value if reversal_mode >= 1 else 0"
    - rev_count_off: "1 if reversal_mode == 2 else 0"
    - res_converted: "EXISTS('home', utility_account_id=F('utility_account_id'), closure_reason='converted_to_access')"
    - res_statements: "XCOUNT('home','home_credits', event_type='home_credit_posted', utility_account_id=F('utility_account_id'))"
    - res_latest_value: "XLATEST('home','home_credits','credit_value', date_field='posted_date', event_type='home_credit_posted', utility_account_id=F('utility_account_id'))"
    - added_statements: "basis_lack if (res_converted and res_statements >= basis_lack and basis_lack > 0) else (res_statements if (res_converted and res_statements >= 1 and res_statements < basis_lack) else 0)"
    - added_value: "added_statements * float(res_latest_value or 0)"
    - months_active: "MONTHS(F('activation_date'), NOW)"
    - young_pct: "K('young_share_pct_under_6') if months_active < 6 else (K('young_share_pct_6_to_11') if months_active < 12 else K('full_pct'))"
    - req_received: "LATEST('access_requests','received_date', date_field='received_date', request_type='move_transfer')"
    - gap_days: "DAYS(req_received, NOW) if req_received else 0"
    - gap_pct: "K('request_age_pct_over_45_days') if gap_days > 45 else (K('request_age_pct_15_to_45_days') if gap_days >= 15 else K('full_pct'))"
    - closed_days: "DAYS(F('closed_date'), NOW) if F('closed_date') else 0"
    - departure_pct: "K('departure_pct_over_30_days') if closed_days > 30 else (K('departure_pct_1_to_30_days') if closed_days >= 1 else K('full_pct'))"
    - initial_kw: "SUM('access_allocations','kw', event_type='access_allocation_filed', filing_reason='initial')"
    - share_pct: "K('share_band_pct_over_6_kw') if initial_kw > 6.0 else (K('share_band_pct_3_to_6_kw') if initial_kw > 3.0 else K('full_pct'))"
    - basis_average: "(basis_sum - rev_sum_off + added_value) / (basis_count - rev_count_off + added_statements)"
    - result: "RND(basis_average * (100 - s_plan) / 100 * young_pct / 100 * gap_pct / 100 * departure_pct / 100 * share_pct / 100 + 0.000000001, 2)"
  compute_basis:
    s_plan: "The rate in force on the estimate date is lapsed_savings_rate_pct when the subscription's recert_due_date lies more than recert_grace_days calendar days before the estimate date and its income_verified_date is not later than that recert_due_date, and otherwise the plan's savings_rate_pct."
    posted_sum: "the priced statements are its access_credit_posted lines other than its latest one when no subscription charge prices that latest one"
    posted_count: "the priced statements are its access_credit_posted lines other than its latest one when no subscription charge prices that latest one"
    latest_posted_id: "other than its latest one when no subscription charge prices that latest one"
    latest_posted_priced: "when no subscription charge prices that latest one"
    latest_posted_value: "other than its latest one when no subscription charge prices that latest one"
    basis_sum: "the basis sum is their credit_value and the basis count is their number"
    basis_count: "the basis sum is their credit_value and the basis count is their number"
    rev_value: "the credit_value of every access_credit_reversed line of the subscription comes off the basis sum"
    rev_month: "the statement month of the subscription's reversal reported last (the access_credit_reversed line with the latest posted_date)"
    rev_month_postings: "carries two or more access_credit_posted lines"
    reversal_mode: "when the statement month of the subscription's reversal reported last (the access_credit_reversed line with the latest posted_date) carries two or more access_credit_posted lines, the reversed statement was re-posted: the credit_value of every access_credit_reversed line of the subscription comes off the basis sum and the basis count falls by one; when the subscription carries an access_credit_reversed line and that statement month carries a single access_credit_posted line, the credit_value of every access_credit_reversed line of the subscription comes off the basis sum and the basis count is unchanged; otherwise the basis is taken as posted."
    rev_sum_off: "the credit_value of every access_credit_reversed line of the subscription comes off the basis sum"
    rev_count_off: "the basis count falls by one"
    basis_lack: "the estimate basis lacks (estimate_basis_months less the basis count)"
    res_converted: "When a residential plan on the same utility account closed with closure_reason converted_to_access"
    res_statements: "that plan carries at least as many home_credit_posted lines as the estimate basis lacks"
    res_latest_value: "Each added statement is valued at the credit_value of the converted residential plan's home_credit_posted line with the latest posted_date"
    added_statements: "When a residential plan on the same utility account closed with closure_reason converted_to_access and that plan carries at least as many home_credit_posted lines as the estimate basis lacks (estimate_basis_months less the basis count), the estimate basis takes as many added statements as it lacks; when such a converted residential plan carries at least one home_credit_posted line but fewer than the basis lacks, the estimate basis takes as many added statements as that plan carries; otherwise the estimate basis takes no added statement."
    added_value: "Each added statement is valued at the credit_value of the converted residential plan's home_credit_posted line with the latest posted_date"
    months_active: "Whole calendar months are counted from the activation_date to the estimate date, a month being complete on the same day of the later month."
    young_pct: "when fewer than six whole calendar months have passed from the subscription's activation_date to the estimate date, the young-share percentage is young_share_pct_under_6; when at least six but fewer than twelve whole calendar months have passed, it is young_share_pct_6_to_11; otherwise it is full_pct."
    req_received: "the received_date of the subscription's latest move_transfer request"
    gap_days: "from the received_date of the subscription's latest move_transfer request to the estimate date"
    gap_pct: "when more than 45 calendar days have passed from the received_date of the subscription's latest move_transfer request to the estimate date, the request-age percentage is request_age_pct_over_45_days; when 15 to 45 days have passed, it is request_age_pct_15_to_45_days; otherwise it is full_pct."
    closed_days: "from the subscription's closed_date to the estimate date"
    departure_pct: "when more than 30 calendar days have passed from the subscription's closed_date to the estimate date, the departure percentage is departure_pct_over_30_days; when 1 to 30 days have passed, it is departure_pct_1_to_30_days; otherwise it is full_pct."
    initial_kw: "the share size is the kW of the subscription's access_allocation_filed lines with filing_reason initial"
    share_pct: "When it is more than 6.00 kW, the share-size percentage is share_band_pct_over_6_kw; when it is more than 3.00 kW but at most 6.00 kW, it is share_band_pct_3_to_6_kw; otherwise it is full_pct."
    basis_average: "the estimated charge is the adjusted basis sum divided by the adjusted basis count"
    result: "multiplied by (100 minus the rate in force on the estimate date) and divided by 100, then multiplied by every percentage below divided by 100, and rounded half up to the cent only at the end."
  factors:
    - id: residential_fill
      effect: parameter
      decides: added_statements
      bindings: [res_converted, res_statements, res_latest_value, added_statements, added_value]
      ladder:
        - when: "a residential plan on the same utility account closed with closure_reason converted_to_access AND it carries at least as many home_credit_posted lines as the estimate basis lacks"
          value: "as many added statements as the basis lacks (estimate_basis_months less the basis count)"
        - when: "such a converted residential plan carries at least one home_credit_posted line AND fewer than the basis lacks"
          value: "as many added statements as that plan carries"
        - when: "otherwise"
          value: "no added statement"
      baseline:
        added_statements: "0"
      evidence: [cross_category, history]
      cross_difficulty: home
    - id: reversal_restatement
      effect: method
      decides: reversal_mode
      bindings: [rev_value, rev_month, rev_month_postings, reversal_mode, rev_sum_off, rev_count_off]
      ladder:
        - when: "the statement month of the reversal reported last carries two or more access_credit_posted lines (re-posted)"
          method: "every reversal's credit_value comes off the basis sum and the basis count falls by one"
        - when: "the subscription carries a reversal AND that statement month carries a single access_credit_posted line"
          method: "every reversal's credit_value comes off the basis sum; the basis count is unchanged"
        - when: "otherwise"
          method: "the basis is taken as posted"
      baseline:
        reversal_mode: "0"
      evidence: [history]
      cross_difficulty: null
    - id: young_share_pct
      effect: parameter
      decides: young_pct
      bindings: [months_active, young_pct]
      ladder:
        - when: "fewer than six whole calendar months from activation_date to the estimate date"
          value: "K('young_share_pct_under_6')"
        - when: "at least six but fewer than twelve whole calendar months"
          value: "K('young_share_pct_6_to_11')"
        - when: "otherwise"
          value: "K('full_pct')"
      baseline:
        young_pct: "K('full_pct')"
      evidence: [date]
      cross_difficulty: null
    - id: request_age_pct
      effect: parameter
      decides: gap_pct
      bindings: [req_received, gap_days, gap_pct]
      ladder:
        - when: "more than 45 calendar days from the latest move_transfer request's received_date to the estimate date"
          value: "K('request_age_pct_over_45_days')"
        - when: "15 to 45 days"
          value: "K('request_age_pct_15_to_45_days')"
        - when: "otherwise"
          value: "K('full_pct')"
      baseline:
        gap_pct: "K('full_pct')"
      evidence: [history, date]
      cross_difficulty: null
    - id: departure_pct
      effect: parameter
      decides: departure_pct
      bindings: [closed_days, departure_pct]
      ladder:
        - when: "more than 30 calendar days from closed_date to the estimate date"
          value: "K('departure_pct_over_30_days')"
        - when: "1 to 30 days"
          value: "K('departure_pct_1_to_30_days')"
        - when: "otherwise"
          value: "K('full_pct')"
      baseline:
        departure_pct: "K('full_pct')"
      evidence: [date]
      cross_difficulty: null
    - id: share_band_pct
      effect: parameter
      decides: share_pct
      bindings: [initial_kw, share_pct]
      ladder:
        - when: "initial filing kW more than 6.00"
          value: "K('share_band_pct_over_6_kw')"
        - when: "initial filing kW more than 3.00 and at most 6.00"
          value: "K('share_band_pct_3_to_6_kw')"
        - when: "otherwise"
          value: "K('full_pct')"
      baseline:
        share_pct: "K('full_pct')"
      evidence: [history]
      cross_difficulty: null
  baseline:
    rule: >-
      The standard estimate for a share closed at a move rests on the subscription's own priced statements: the
      priced statements are its access_credit_posted lines other than its latest one when no subscription charge
      prices that latest one; the basis sum is their credit_value and the basis count is their number. The
      standard estimated charge is the basis sum divided by the basis count, multiplied by (100 minus the rate in
      force on the estimate date) and divided by 100, rounded half up to the cent.
    params: [savings_rate_pct, lapsed_savings_rate_pct]
  inputs:
    history:
      - {table: access_credits, aggregate: sum, field: credit_value, filters: {event_type: access_credit_posted}}
      - {table: access_credits, aggregate: sum, field: credit_value, filters: {event_type: access_credit_reversed}}
      - {table: access_billing, aggregate: latest, field: bill_date, filters: {event_type: access_charge_billed, charge_basis: actual}}
      - {category: home, table: home_credits, aggregate: latest, field: credit_value, filters: {event_type: home_credit_posted}}
    cross_category: [home]
- id: access_ext_move_closed_reversal_credit
  base_policy_refs: [access_evt_credit_correction, access_recertification, access_benefit_basis]
  overwrite:
    - base_policy: access_evt_credit_correction
      superseded_clause: >-
        When the utility reverses a posted credit, the subscription charge that priced that credit line is offset
        by a billing credit equal to that charge's full amount, with credit_reason credit_reversal_correction,
        referring to the charge and carrying the reversed credit line.
      replaced_by: >-
        For a reversal posted on a subscription closed at a move (closure_reason moved_out_of_territory,
        transfer_not_completed or eligibility_lapsed) whose credited_kwh is below the
        credited_kwh of the credit line it reverses, and only for such a partial reversal, the reversal-correction
        billing credit is figured as this rule sets out, with credit_reason credit_reversal_correction, referring
        to the charge and carrying the reversed credit line; every other reversal remains under the base rule,
        which reads: When the utility reverses a posted credit, the subscription charge that priced that credit
        line is offset by a billing credit equal to that charge's full amount, with credit_reason
        credit_reversal_correction, referring to the charge and carrying the reversed credit line.
  trigger: state_due
  subject: [access_billing_credited]
  computes: amount
  target_tool: credit_closed_reversal_cc3dddf3
  params:
    standard_held_interest_pct: 2.0
    held_interest_pct_over_60_days: 6.0
    held_interest_pct_15_to_60_days: 4.0
    days_per_year_actual: 365
    rate_restatement_tolerance: 0.0005
  rule: >-
    This rule figures the reversal-correction billing credit for a partial utility reversal that reaches a
    share that closed at a move. For a reversal posted on a subscription closed at a move (closure_reason moved_out_of_territory,
    transfer_not_completed or eligibility_lapsed) whose
    credited_kwh is below the credited_kwh of the credit line it reverses, and only for such a partial
    reversal, the reversal-correction billing credit is figured as this rule sets out, with credit_reason
    credit_reversal_correction, referring to the charge and carrying the reversed credit line; every other
    reversal remains under the base rule, which reads: When the utility reverses a posted credit, the
    subscription charge that priced that credit line is offset by a billing credit equal to that charge's full
    amount, with credit_reason credit_reversal_correction, referring to the charge and carrying the reversed
    credit line.
    The reversal taken is the subscription's access_credit_reversed line with the latest posted_date (a
    subscription carries at most one reversal per posted_date); the reversed line is the credit line it names;
    the reversed part is the credit_value and the credited_kwh of every access_credit_reversed line that names
    the reversed line;
    the offset charge is the access_charge_billed line that priced the reversed line; the household's payment
    is the subscription's latest access_payment_received line.
    The standard reversal correction prices the reversed part at the plan's savings rate: the corrected value
    is the reversed part's credit_value, and the correction amount is the corrected value multiplied by (100 minus
    savings_rate_pct) and divided by 100. When the household's payment was received after the offset charge's
    bill_date, the standard correction adds held-payment interest on the correction amount at
    standard_held_interest_pct per year for the days held, the days held being counted from the day after the
    payment's bill_date to the correction date and the year counted as days_per_year_actual days. The standard
    reversal correction is the correction amount plus that interest, rounded half up to the cent.
    Each adjustment below replaces the rate, the corrected value, the interest rate or the start of the days
    held; the reversal correction is the corrected value multiplied by (100 minus
    the rate) and divided by 100, plus interest on that amount at the interest rate for the days held over a year of
    days_per_year_actual days, rounded half up to the cent only at the end.
    Rate of the reversed part: when the reversed line posted more than recert_grace_days calendar days after
    the subscription's recert_due_date and the subscription's income_verified_date is not later than that
    recert_due_date, the reversed part is priced at lapsed_savings_rate_pct; when the offset charge's amount
    differs by more than one cent from the reversed line's credit_value multiplied by (100 minus
    savings_rate_pct) and divided by 100 and that lapse does not apply, the reversed part is priced at the rate
    the offset charge was billed at (100 times one less the offset charge's amount divided by the reversed
    line's credit_value); otherwise it is priced at savings_rate_pct.
    Corrected value of the reversed part: when the reversal's credit_value per credited kWh differs from the
    reversed line's credit_value per credited kWh by more than rate_restatement_tolerance dollars, the
    utility restated the line's rate as well as its kWh, and the corrected value is the reversal's credited_kwh
    multiplied by the reversed line's credit_value per credited kWh; when the reversal carries the reversed
    line's whole credit_value but less than its credited_kwh, the corrected value is the reversed line's
    credit_value multiplied by the reversal's credited_kwh and divided by the reversed line's credited_kwh;
    otherwise the corrected value is the reversal's credit_value.
    Held-payment interest rate of the correction: when more than 60 calendar days have passed from the offset
    charge's due_date to the correction date, the interest rate is held_interest_pct_over_60_days per year; when
    15 to 60 days have passed, it is held_interest_pct_15_to_60_days per year; otherwise it is
    standard_held_interest_pct.
    Start of the days held: when the household's payment was received on or before the offset charge's
    due_date, the days held are counted from the day after the due_date; when it was received after the
    due_date, they are counted from the day after the payment's bill_date; when no payment was received after
    the offset charge's bill_date, no interest is added.

  prerequisite: []
  cross_category: []
  compute:
    - rev_credit_id: "LATEST('access_credits','access_reversed_credit_id', date_field='posted_date', event_type='access_credit_reversed')"
    - rev_value: "SUM('access_credits','credit_value', event_type='access_credit_reversed', access_reversed_credit_id=rev_credit_id)"
    - rev_kwh: "SUM('access_credits','credited_kwh', event_type='access_credit_reversed', access_reversed_credit_id=rev_credit_id)"
    - line_value: "float(LATEST('access_credits','credit_value', date_field='posted_date', access_credit_id=rev_credit_id))"
    - line_kwh: "float(LATEST('access_credits','credited_kwh', date_field='posted_date', access_credit_id=rev_credit_id))"
    - line_posted: "LATEST('access_credits','posted_date', date_field='posted_date', access_credit_id=rev_credit_id)"
    - charge_amount: "float(LATEST('access_billing','amount', date_field='bill_date', event_type='access_charge_billed', access_credit_id=rev_credit_id))"
    - charge_bill_date: "LATEST('access_billing','bill_date', date_field='bill_date', event_type='access_charge_billed', access_credit_id=rev_credit_id)"
    - charge_due_date: "LATEST('access_billing','due_date', date_field='bill_date', event_type='access_charge_billed', access_credit_id=rev_credit_id)"
    - pay_date: "LATEST('access_billing','bill_date', date_field='bill_date', event_type='access_payment_received')"
    - paid_after_bill: "(pay_date != None) and DAYS(charge_bill_date, pay_date) > 0"
    - s_plan: "P('savings_rate_pct')"
    - lapse_applies: "(F('recert_due_date') != None and F('recert_due_date') != '') and DAYS(F('recert_due_date'), line_posted) > P('recert_grace_days') and DAYS(F('recert_due_date'), F('income_verified_date')) <= 0"
    - billed_off_plan: "ABS(charge_amount - RND(line_value * (100 - s_plan) / 100 + 0.000000001, 2)) > 0.01"
    - rev_rate: "P('lapsed_savings_rate_pct') if lapse_applies else ((100 * (1 - charge_amount / line_value)) if billed_off_plan else s_plan)"
    - unit_gap: "ABS(rev_value / rev_kwh - line_value / line_kwh)"
    - corrected_value: "(rev_kwh * line_value / line_kwh) if unit_gap > K('rate_restatement_tolerance') else ((line_value * rev_kwh / line_kwh) if (rev_value >= line_value and rev_kwh < line_kwh) else rev_value)"
    - correction_base: "corrected_value * (100 - rev_rate) / 100"
    - days_from_due: "DAYS(charge_due_date, NOW)"
    - days_from_pay: "DAYS(pay_date, NOW) if pay_date else 0"
    - days_held: "(days_from_due if DAYS(charge_due_date, pay_date) <= 0 else days_from_pay) if paid_after_bill else 0"
    - due_age_days: "DAYS(charge_due_date, NOW)"
    - interest_pct: "K('held_interest_pct_over_60_days') if due_age_days > 60 else (K('held_interest_pct_15_to_60_days') if due_age_days >= 15 else K('standard_held_interest_pct'))"
    - year_days: "K('days_per_year_actual')"
    - interest: "(correction_base * interest_pct / 100 * days_held / year_days) if days_held > 0 else 0.0"
    - result: "RND(correction_base + interest + 0.000000001, 2)"
  compute_basis:
    rev_credit_id: "the reversed line is the credit line it names"
    rev_value: "the reversed part is the credit_value and the credited_kwh of every access_credit_reversed line that names the reversed line"
    rev_kwh: "the reversed part is the credit_value and the credited_kwh of every access_credit_reversed line that names the reversed line"
    line_value: "the reversed line's credit_value per credited kWh"
    line_kwh: "the reversed line's credited_kwh"
    line_posted: "when the reversed line posted more than recert_grace_days calendar days after the subscription's recert_due_date"
    charge_amount: "the offset charge is the access_charge_billed line that priced the reversed line"
    charge_bill_date: "When the household's payment was received after the offset charge's bill_date"
    charge_due_date: "when the household's payment was received on or before the offset charge's due_date, the days held are counted from the day after the due_date"
    pay_date: "the household's payment is the subscription's latest access_payment_received line"
    paid_after_bill: "When the household's payment was received after the offset charge's bill_date"
    s_plan: "the correction amount is the corrected value multiplied by (100 minus savings_rate_pct) and divided by 100"
    lapse_applies: "when the reversed line posted more than recert_grace_days calendar days after the subscription's recert_due_date and the subscription's income_verified_date is not later than that recert_due_date"
    billed_off_plan: "when the offset charge's amount differs by more than one cent from the reversed line's credit_value multiplied by (100 minus savings_rate_pct) and divided by 100 and that lapse does not apply"
    rev_rate: "when the reversed line posted more than recert_grace_days calendar days after the subscription's recert_due_date and the subscription's income_verified_date is not later than that recert_due_date, the reversed part is priced at lapsed_savings_rate_pct; when the offset charge's amount differs by more than one cent from the reversed line's credit_value multiplied by (100 minus savings_rate_pct) and divided by 100 and that lapse does not apply, the reversed part is priced at the rate the offset charge was billed at (100 times one less the offset charge's amount divided by the reversed line's credit_value); otherwise it is priced at savings_rate_pct."
    unit_gap: "when the reversal's credit_value per credited kWh differs from the reversed line's credit_value per credited kWh by more than rate_restatement_tolerance dollars"
    corrected_value: "when the reversal's credit_value per credited kWh differs from the reversed line's credit_value per credited kWh by more than rate_restatement_tolerance dollars, the utility restated the line's rate as well as its kWh, and the corrected value is the reversal's credited_kwh multiplied by the reversed line's credit_value per credited kWh; when the reversal carries the reversed line's whole credit_value but less than its credited_kwh, the corrected value is the reversed line's credit_value multiplied by the reversal's credited_kwh and divided by the reversed line's credited_kwh; otherwise the corrected value is the reversal's credit_value."
    correction_base: "the reversal correction is the corrected value multiplied by (100 minus the rate) and divided by 100"
    days_from_due: "the days held are counted from the day after the due_date"
    days_from_pay: "they are counted from the day after the payment's bill_date"
    days_held: "when the household's payment was received on or before the offset charge's due_date, the days held are counted from the day after the due_date; when it was received after the due_date, they are counted from the day after the payment's bill_date; when no payment was received after the offset charge's bill_date, no interest is added."
    due_age_days: "from the offset charge's due_date to the correction date"
    interest_pct: "when more than 60 calendar days have passed from the offset charge's due_date to the correction date, the interest rate is held_interest_pct_over_60_days per year; when 15 to 60 days have passed, it is held_interest_pct_15_to_60_days per year; otherwise it is standard_held_interest_pct."
    year_days: "over a year of days_per_year_actual days"
    interest: "plus interest on that amount at the interest rate for the days held over a year of days_per_year_actual days"
    result: "rounded half up to the cent only at the end."
  factors:
    - id: reversed_part_rate
      effect: parameter
      decides: rev_rate
      bindings: [line_posted, lapse_applies, billed_off_plan, rev_rate]
      ladder:
        - when: "the reversed line posted more than recert_grace_days days after recert_due_date AND income_verified_date not later than recert_due_date"
          value: "P('lapsed_savings_rate_pct')"
        - when: "the offset charge differs by more than one cent from the plan-rate price of the reversed line AND that lapse does not apply"
          value: "the rate the offset charge was billed at"
        - when: "otherwise"
          value: "P('savings_rate_pct')"
      baseline:
        rev_rate: "s_plan"
      evidence: [history, date]
      cross_difficulty: null
    - id: corrected_value_basis
      effect: method
      decides: corrected_value
      bindings: [rev_kwh, line_kwh, unit_gap, corrected_value]
      ladder:
        - when: "the reversal's value per kWh differs from the reversed line's by more than rate_restatement_tolerance"
          method: "reversal kWh times the reversed line's value per kWh"
        - when: "the reversal carries the line's whole credit_value but less than its kWh"
          method: "the line's credit_value times reversal kWh over line kWh"
        - when: "otherwise"
          method: "the reversal's credit_value"
      baseline:
        corrected_value: "rev_value"
      evidence: [history]
      cross_difficulty: null
    - id: held_interest_rate
      effect: parameter
      decides: interest_pct
      bindings: [due_age_days, interest_pct]
      ladder:
        - when: "more than 60 days from the offset charge's due_date to the correction date"
          value: "K('held_interest_pct_over_60_days')"
        - when: "15 to 60 days"
          value: "K('held_interest_pct_15_to_60_days')"
        - when: "otherwise"
          value: "K('standard_held_interest_pct')"
      baseline:
        interest_pct: "K('standard_held_interest_pct')"
      evidence: [date]
      cross_difficulty: null
    - id: held_days_start
      effect: method
      decides: days_held
      bindings: [days_from_due, days_held]
      ladder:
        - when: "the household's payment was received on or before the offset charge's due_date"
          method: "days held counted from the day after the due_date"
        - when: "the payment was received after the due_date"
          method: "days held counted from the day after the payment's bill_date"
        - when: "otherwise (no payment after the offset charge's bill_date)"
          method: "no interest"
      baseline:
        days_held: "days_from_pay if paid_after_bill else 0"
      evidence: [history, date]
      cross_difficulty: null
  baseline:
    rule: >-
      The standard reversal correction prices the reversed part at the plan's savings rate: the corrected value
      is the reversed part's credit_value, and the correction amount is the corrected value multiplied by (100 minus
      savings_rate_pct) and divided by 100. When the household's payment was received after the offset charge's
      bill_date, the standard correction adds held-payment interest on the correction amount at
      standard_held_interest_pct per year for the days held, the days held being counted from the day after the
      payment's bill_date to the correction date and the year counted as days_per_year_actual days. The standard
      reversal correction is the correction amount plus that interest, rounded half up to the cent.
    params: [savings_rate_pct, standard_held_interest_pct, days_per_year_actual]
  inputs:
    history:
      - {table: access_credits, aggregate: latest, field: credit_value, filters: {event_type: access_credit_reversed}}
      - {table: access_billing, aggregate: latest, field: amount, filters: {event_type: access_charge_billed}}
      - {table: access_billing, aggregate: latest, field: bill_date, filters: {event_type: access_payment_received}}
    cross_category: []
