- id: access_rescission
  subject: [access_rescinded]
  rule: >-
    Every Meadowlark Access Income-Eligible Subscriptions agreement, whatever the signing channel, carries
    a rescission period of rescission_business_days business days, at least as generous as the federal
    Cooling-Off Rule for agreements signed at the home and extended by Meadowlark to every channel. A
    rescission is honoured when it is received no later than the last business day of the rescission period
    that starts when the subscriber signs the agreement. Business days are Monday through Friday excluding
    US federal holidays; the signing day is not counted and the rescission period ends at the end of the
    last of its business days. A rescission closes the application with closure_reason rescinded, no fee
    of any kind and no filing. After the rescission period the subscriber cancels under access_cancellation
    instead.
  eligibility:
  - id: within_rescission_period
    applies_to: [access_rescinded]
    kind: time
    condition: >-
      A rescission is honoured when it is received no later than the last business day of the rescission
      period that starts when the subscriber signs the agreement.
    evidence_fields: [access_subscriptions.signed_date, access_subscriptions.access_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_subscriptions.access_sub_id]
      action_bindings: {access_subscriptions.access_sub_id: access_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the subscriber signs the agreement
      anchor_source: access_subscriptions.signed_date
      relation: not_after
      duration_source: variants.rescission_business_days
      unit: business_days
      counting_rule: >-
        Business days are Monday through Friday excluding US federal holidays; the signing day is not
        counted and the rescission period ends at the end of the last of its business days.
      boundary: inclusive
  params:
    per_tier:
      Meadowlark Access 15: {rescission_business_days: =rescission_business_days}
      Meadowlark Access 20: {rescission_business_days: =rescission_business_days}
      Meadowlark Access 25: {rescission_business_days: =rescission_business_days}
      Meadowlark Access Housing 20: {rescission_business_days: =rescission_business_days}
      Meadowlark Access Neighborhood 15: {rescission_business_days: =rescission_business_days}
      Meadowlark Access Solar for All 50: {rescission_business_days: =rescission_business_days}
- id: access_evt_subscription_charge
  subject: [access_credit_posted, access_charge_billed, access_activated]
  rule: >-
    The charge for a posted credit statement equals its credit_value multiplied by (100 minus savings_rate_pct)
    and divided by 100, rounded half up to the cent; the savings rate is that of the subscription's plan
    (variant_name). The whole credit_value is priced whether the utility applied it to that month's bill
    or banked part of it (banked_value). Each posted credit statement line is priced by exactly one actual
    subscription charge. A subscription charge is billed only on a subscription in allocated, active,
    transfer_pending, notice_given or closed status. The charge is invoiced invoice_issue_days_after_posting
    calendar days after the credit's posted_date and falls due invoice_due_days calendar days after the
    invoice date; its billing_type is the subscription's billing_type on the invoice date. Under consolidated
    billing the utility nets the charge on its own bill and remits it to Meadowlark, which records the
    remittance as a payment by utility_remittance. The first posted credit activates the subscription:
    activation_date is its posted_date and term_end_date is activation_date plus term_months less one
    day (empty when term_months is 0). Credits for statement months before closing that post after the
    closed_date are priced the same way. Estimates: when estimated_billing_allowed is true and no credit
    has posted for a statement month estimate_wait_days calendar days after that month ends, an estimated
    charge equal to the average of the last estimate_basis_months actual charges, rounded half up to the
    cent, may be billed with charge_basis estimated and no credit reference; no more than max_consecutive_estimates
    estimates may be billed in a row (the run is measured by access_msr_consecutive_estimates). When the
    late statement posts, its actual charge is billed and the estimate is offset in full by a billing
    credit with credit_reason estimate_trueup referring to the estimate. On Access plans the savings rate
    is the plan's savings_rate_pct except while a recertification is overdue, when access_recertification
    sets the rate.
  eligibility:
  - id: one_charge_per_credit
    applies_to: [access_charge_billed]
    kind: dedup
    condition: Each posted credit statement line is priced by exactly one actual subscription charge.
    evidence_fields: [access_billing.access_credit_id, access_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_billing.access_credit_id]
      action_bindings: {access_billing.access_credit_id: access_credit_id}
    dedup_contract:
      table: access_billing
      mode: separate_record
      object_bindings: {access_credit_id: access_credit_id}
      duplicate_filters:
        event_type: [access_charge_billed]
      distinct_fields: []
  - id: billable_status
    applies_to: [access_charge_billed]
    kind: state
    condition: >-
      A subscription charge is billed only on a subscription in allocated, active, transfer_pending, notice_given
      or closed status.
    evidence_fields: [access_subscriptions.status, access_subscriptions.access_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_subscriptions.access_sub_id]
      action_bindings: {access_subscriptions.access_sub_id: access_sub_id}
    state_contract:
      field: access_subscriptions.status
      allowed: [allocated, active, transfer_pending, notice_given, closed]
  params:
    per_tier:
      Meadowlark Access 15: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct, fixed_rate_per_kwh: =fixed_rate_per_kwh,
        annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding, invoice_issue_days_after_posting: =invoice_issue_days_after_posting,
        invoice_due_days: =invoice_due_days, estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
      Meadowlark Access 20: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct, fixed_rate_per_kwh: =fixed_rate_per_kwh,
        annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding, invoice_issue_days_after_posting: =invoice_issue_days_after_posting,
        invoice_due_days: =invoice_due_days, estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
      Meadowlark Access 25: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct, fixed_rate_per_kwh: =fixed_rate_per_kwh,
        annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding, invoice_issue_days_after_posting: =invoice_issue_days_after_posting,
        invoice_due_days: =invoice_due_days, estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
      Meadowlark Access Housing 20: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct,
        fixed_rate_per_kwh: =fixed_rate_per_kwh, annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding,
        invoice_issue_days_after_posting: =invoice_issue_days_after_posting, invoice_due_days: =invoice_due_days,
        estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
      Meadowlark Access Neighborhood 15: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct,
        fixed_rate_per_kwh: =fixed_rate_per_kwh, annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding,
        invoice_issue_days_after_posting: =invoice_issue_days_after_posting, invoice_due_days: =invoice_due_days,
        estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
      Meadowlark Access Solar for All 50: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct,
        fixed_rate_per_kwh: =fixed_rate_per_kwh, annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding,
        invoice_issue_days_after_posting: =invoice_issue_days_after_posting, invoice_due_days: =invoice_due_days,
        estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
  formula: {amount: 'round(credit_value * (100 - savings_rate_pct) / 100, 2)'}
  measures: [access_msr_consecutive_estimates]
- id: access_evt_credit_correction
  subject: [access_credit_reversed, access_billing_credited]
  rule: >-
    When the utility reverses a posted credit, the subscription charge that priced that credit line is
    offset by a billing credit equal to that charge's full amount, with credit_reason credit_reversal_correction,
    referring to the charge and carrying the reversed credit line. A reversed credit statement line is
    offset by exactly one reversal-correction billing credit. A late fee already assessed on the offset
    charge is offset by its own billing credit with credit_reason fee_waiver. A corrected credit the utility
    posts afterwards is a new posting priced under access_evt_subscription_charge. A charge Meadowlark
    billed at a wrong amount for its own reasons (wrong plan rate, wrong credit line) is corrected by
    a billing credit with credit_reason billing_error for the overbilled difference only; Meadowlark issues
    no supplemental charge for its own underbilling. A billing dispute received as a request is decided
    within dispute_resolution_days of its received_date; while it is open, when dispute_late_fee_hold
    is true, no late fee is assessed on the disputed line. Billing credits never carry a negative amount
    and never exceed the line they correct.
  eligibility:
  - id: one_correction_per_reversal
    applies_to: [access_billing_credited]
    kind: dedup
    condition: A reversed credit statement line is offset by exactly one reversal-correction billing credit.
    evidence_fields: [access_billing.access_credit_id, access_billing.credit_reason]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_billing.access_credit_id]
      action_bindings: {access_billing.access_credit_id: access_credit_id}
    dedup_contract:
      table: access_billing
      mode: separate_record
      object_bindings: {access_credit_id: access_credit_id}
      duplicate_filters:
        credit_reason: [credit_reversal_correction]
      distinct_fields: []
  params:
    per_tier:
      Meadowlark Access 15: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
      Meadowlark Access 20: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
      Meadowlark Access 25: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
      Meadowlark Access Housing 20: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
      Meadowlark Access Neighborhood 15: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
      Meadowlark Access Solar for All 50: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
- id: access_evt_payment_application
  subject: [access_payment_received, access_payment_returned, access_returned_fee_assessed]
  rule: >-
    Payments settle open charge and fee lines of the same subscription in payment_application_order: the
    line with the earliest due_date first, and among lines due the same day charges before fees, then
    by bill_date. Meadowlark representatives never take card or bank account numbers; dual-billed balances
    are paid by the subscriber through the secure payment portal (ach or card) or by mailed check, using
    only methods in payment_methods. Under consolidated billing the utility's remittance is the only payment
    of the charge, recorded with payment_method utility_remittance. When a dual-billed payment is returned
    unpaid, its amount is restored to the balance by a payment_returned line referring to the payment,
    and the lines it had settled are open again from their original due dates. A returned-payment fee
    is assessed at most once per returned payment. The fee equals returned_payment_fee_usd and is due
    invoice_due_days after assessment; when returned_payment_fee_usd is 0.00 no fee line is written.
  eligibility:
  - id: one_fee_per_return
    applies_to: [access_returned_fee_assessed]
    kind: dedup
    condition: A returned-payment fee is assessed at most once per returned payment.
    evidence_fields: [access_billing.access_ref_bill_id, access_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_billing.access_ref_bill_id]
      action_bindings: {access_billing.access_ref_bill_id: access_ref_bill_id}
    dedup_contract:
      table: access_billing
      mode: separate_record
      object_bindings: {access_ref_bill_id: access_ref_bill_id}
      duplicate_filters:
        event_type: [access_returned_fee_assessed]
      distinct_fields: []
  params:
    per_tier:
      Meadowlark Access 15: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
      Meadowlark Access 20: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
      Meadowlark Access 25: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
      Meadowlark Access Housing 20: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
      Meadowlark Access Neighborhood 15: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
      Meadowlark Access Solar for All 50: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
- id: access_evt_late_fee
  subject: [access_late_fee_assessed]
  rule: >-
    Late fees apply only to dual-billed subscription charges (never to consolidated-billed charges, fees,
    early termination fees or estimates later offset). A late fee may be assessed on a subscription charge
    only after the late fee grace period that starts when the overdue charge reaches its due_date has
    fully passed. Calendar days are counted from the day after due_date; the fee may be assessed from
    the day after the last grace day. The fee is the unpaid amount of that one charge on the assessment
    date (access_msr_unpaid_on_charge) multiplied by late_fee_pct and divided by 100, rounded half up
    to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher. At
    most one late fee is assessed per charge. No fee is written when late_fee_pct is 0.0, when the charge
    is fully paid or credited by the assessment date, or when the charge is under an open billing dispute
    and dispute_late_fee_hold is true.
  eligibility:
  - id: after_grace
    applies_to: [access_late_fee_assessed]
    kind: time
    condition: >-
      A late fee may be assessed on a subscription charge only after the late fee grace period that starts
      when the overdue charge reaches its due_date has fully passed.
    evidence_fields: [access_billing.due_date, access_billing.access_bill_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_billing.access_bill_id]
      action_bindings: {access_billing.access_bill_id: access_ref_bill_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the overdue charge reaches its due_date
      anchor_source: access_billing.due_date
      relation: not_before
      duration_source: variants.late_fee_grace_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after due_date; the fee may be assessed from the day after
        the last grace day.
      boundary: exclusive
  - id: one_fee_per_charge
    applies_to: [access_late_fee_assessed]
    kind: dedup
    condition: At most one late fee is assessed per charge.
    evidence_fields: [access_billing.access_ref_bill_id, access_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_billing.access_ref_bill_id]
      action_bindings: {access_billing.access_ref_bill_id: access_ref_bill_id}
    dedup_contract:
      table: access_billing
      mode: separate_record
      object_bindings: {access_ref_bill_id: access_ref_bill_id}
      duplicate_filters:
        event_type: [access_late_fee_assessed]
      distinct_fields: []
  params:
    per_tier:
      Meadowlark Access 15: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct, late_fee_min_usd: =late_fee_min_usd,
        late_fee_max_usd: =late_fee_max_usd}
      Meadowlark Access 20: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct, late_fee_min_usd: =late_fee_min_usd,
        late_fee_max_usd: =late_fee_max_usd}
      Meadowlark Access 25: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct, late_fee_min_usd: =late_fee_min_usd,
        late_fee_max_usd: =late_fee_max_usd}
      Meadowlark Access Housing 20: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct,
        late_fee_min_usd: =late_fee_min_usd, late_fee_max_usd: =late_fee_max_usd}
      Meadowlark Access Neighborhood 15: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct,
        late_fee_min_usd: =late_fee_min_usd, late_fee_max_usd: =late_fee_max_usd}
      Meadowlark Access Solar for All 50: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct,
        late_fee_min_usd: =late_fee_min_usd, late_fee_max_usd: =late_fee_max_usd}
  formula: {amount: 'min(late_fee_max_usd, max(late_fee_min_usd, round(access_msr_unpaid_on_charge * late_fee_pct
      / 100, 2)))'}
  measures: [access_msr_unpaid_on_charge]
- id: access_allocation_change
  subject: [access_allocation_filed, access_allocation_reduced, access_change_fee_assessed]
  rule: >-
    Filing calendar (the single calendar for every allocation filing of this line): for a monthly program,
    a request received on or before the program's cutoff_day of a month is filed in that month and takes
    effect on the first day of the following month, and a request received after the cutoff_day is filed
    in the following month; for a quarterly program, filings are made only in the last month of a calendar
    quarter (March, June, September, December), a request received on or before the cutoff_day of that
    month is filed in it and takes effect on the first day of the next quarter, and a later request waits
    for the next quarter's filing. The utility applies a filing from the first billing cycle that begins
    on or after its effective date. Subscriber-requested increases and decreases are received as requests
    and filed under this calendar. A subscriber-requested allocation change is filed only when its request's
    received_date is at least min_months_before_first_change whole calendar months after the first bill
    credit posts on the subscription (the activation_date). Months are counted as calendar months from
    the activation_date; when the target month has no such day, the last day of that month is used. An
    allocation increase is filed only on a subscription in allocated or active status. An allocation reduction
    is filed only on a subscription in active, transfer_pending, notice_given or closed status. At most
    allocation_changes_per_contract_year subscriber-requested changes are filed in one contract year (access_msr_subscriber_changes_contract_year
    counts increases and decreases alike); contract years run from the activation_date. Every requested
    kW figure is sized down to a whole multiple of allocation_increment_kw. An increase is limited by
    the sizing check of access_agg_account_sizing and by the project's unallocated_kw; the part the project
    cannot fill is not filed, and when increase_waitlist_when_full is true the subscriber may queue it
    on the waitlist. A decrease may not leave less than min_allocation_kw (a subscriber wanting less cancels
    instead). Subscriber decreases in one contract year up to max_decrease_pct_per_contract_year of the
    allocation_kw held on the first day of that contract year carry no fee (access_msr_subscriber_decrease_kw_contract_year
    totals them); each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed
    once per decrease request on the filing's effective_date and due invoice_due_days later. Company-initiated
    lines (initial filing, annual resize, move resize, removals) never count toward the allowance, the
    yearly change limit or the fee.
  eligibility:
  - id: first_change_wait
    applies_to: [access_allocation_filed, access_allocation_reduced]
    kind: time
    condition: >-
      A subscriber-requested allocation change is filed only when its request's received_date is at least
      min_months_before_first_change whole calendar months after the first bill credit posts on the subscription
      (the activation_date).
    evidence_fields: [access_subscriptions.activation_date, access_requests.received_date, access_subscriptions.access_sub_id,
      access_requests.access_request_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [access_subscriptions.access_sub_id, access_requests.access_request_id]
      action_bindings: {access_subscriptions.access_sub_id: access_sub_id, access_requests.access_request_id: access_request_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the first bill credit posts on the subscription
      anchor_source: access_subscriptions.activation_date
      relation: not_before
      duration_source: variants.min_months_before_first_change
      unit: calendar_months
      counting_rule: >-
        Months are counted as calendar months from the activation_date; when the target month has no such
