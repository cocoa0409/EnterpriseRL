    acct_unbanked: 'Standard banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the standard credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced.'
    acct_banked_val: 'Standard banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the standard credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced.'
    acct_kwh12: 'Standard banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the standard credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced.'
    banked_deduct: 'Standard banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the standard credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced.'
    out_per_kw: 'The standard adjustments below act in this order: a figure that replaces the standard annual output figure is taken first and the floor on it is applied next; the standard output per kW is then formed from the floored figure and the blend is applied to it before the standard first-year kWh estimate is rounded; a figure that replaces the standard credit value per kWh is taken first, the trend multiplier is applied to it next and the banked-credit reduction is subtracted last, before it multiplies the rounded estimate.'
    per_kw: 'The standard adjustments below act in this order: a figure that replaces the standard annual output figure is taken first and the floor on it is applied next; the standard output per kW is then formed from the floored figure and the blend is applied to it before the standard first-year kWh estimate is rounded; a figure that replaces the standard credit value per kWh is taken first, the trend multiplier is applied to it next and the banked-credit reduction is subtracted last, before it multiplies the rounded estimate.'
    offered_kw: Such a Residential Standard offer is made for the reservation's requested kW.
    est_kwh: The standard first-year kWh estimate is the offered kW multiplied by the standard output per kW and by estimate_years, rounded half up to a whole kWh.
    value_used: 'The standard adjustments below act in this order: a figure that replaces the standard annual output figure is taken first and the floor on it is applied next; the standard output per kW is then formed from the floored figure and the blend is applied to it before the standard first-year kWh estimate is rounded; a figure that replaces the standard credit value per kWh is taken first, the trend multiplier is applied to it next and the banked-credit reduction is subtracted last, before it multiplies the rounded estimate.'
    plan_pct: The standard first-year savings estimate is the rounded standard first-year kWh estimate multiplied by the standard credit value per kWh and by the requested plan's savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise.
    result: The standard first-year savings estimate is the rounded standard first-year kWh estimate multiplied by the standard credit value per kWh and by the requested plan's savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise.
  factors:
  - id: output_history_basis
    effect: method
    decides: out_kwh
    bindings:
    - kwh_all
    - out_kwh
    ladder:
    - when: the household share's latest annual true-up was completed within the last twelve whole months
      method: the standard annual output figure is that true-up's credited_kwh_12m
    - when: the household share has no annual true-up and carries fewer than twelve posted lines
      method: net credited kWh of all its statements times twelve divided by the number of posted lines
    - when: otherwise (latest true-up completed twelve or more whole months ago, or no true-up and twelve or more posted lines)
      method: net credited kWh of the statements posted in the last twelve whole months (standard method)
    baseline:
      out_kwh: kwh12
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  - id: guarantee_output_floor
    effect: parameter
    decides: floor_kwh
    bindings:
    - tu_short
    - prev_short
    - floor_kwh
    ladder:
    - when: the latest annual true-up was completed within the last twelve whole months with a shortfall_kwh above 0 and the true-up of the contract year before it also recorded a shortfall_kwh above 0
      value: that latest true-up's guaranteed_kwh
    - when: the latest annual true-up was completed within the last twelve whole months with a shortfall_kwh above 0 and the earlier true-up recorded none or does not exist
      value: half the sum of that latest true-up's credited_kwh_12m and guaranteed_kwh
    - when: otherwise (no true-up, latest completed twelve or more whole months ago, or no shortfall)
      value: 0 (no floor)
    baseline:
      floor_kwh: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  - id: young_share_blend
    effect: parameter
    decides: blend_w
    bindings:
    - blend_lines
    - design_kw
    - blend_w
    ladder:
    - when: fewer than 24 posted credit statement lines and the latest annual true-up assessed a guarantee
      value: '0.50'
    - when: 24 to 35 posted credit statement lines and the latest annual true-up assessed a guarantee
      value: '0.75'
    - when: otherwise (36 or more lines, or no guarantee assessed, or no true-up)
      value: 1.00 (unblended)
    baseline:
      blend_w: '1.0'
    evidence:
    - history
    - cross_category
    - tier_param
    cross_difficulty: home
  - id: credit_value_recency
    effect: method
    decides: value_kwh
    bindings:
    - kwh_since
    - val_since
    - value_kwh
    ladder:
    - when: the latest annual true-up was completed within the last six whole months
      method: that true-up's avg_credit_rate
    - when: the latest annual true-up was completed six to eleven whole months ago and the statements posted in the whole months since its review_date carry a net credited kWh above 0
      method: net credit value divided by net credited kWh of those statements
    - when: otherwise (no true-up, completed twelve or more whole months ago, or no net kWh since)
      method: the twelve-month credit value per kWh (standard method)
    baseline:
      value_kwh: val12 / kwh12
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  - id: credit_rate_trend
    effect: parameter
    decides: trend
    bindings:
    - prev_rate
    - prev_date
    - prev_age
    - trend
    ladder:
    - when: the true-up of the contract year before the latest one was completed within the last 24 whole months
      value: the latest avg_credit_rate divided by the earlier one, kept between 0.95 and 1.05
    - when: that earlier true-up was completed 24 to 35 whole months ago
      value: 1 plus half of that ratio's difference from 1, kept between 0.95 and 1.05
    - when: otherwise (no such earlier true-up, or completed 36 or more whole months ago)
      value: '1'
    baseline:
      trend: '1.0'
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  - id: banked_value_allowance
    effect: parameter
    decides: banked_deduct
    bindings:
    - acct_lines
    - acct_unbanked
    - acct_banked_val
    - acct_kwh12
    - banked_deduct
    ladder:
    - when: the account share carries four or more lines posted in the last twelve whole months with banked_value above 0
      value: its twelve-month banked value divided by its twelve-month net credited kWh
    - when: the account share carries one to three such lines
      value: half of that figure
    - when: otherwise (no active account share, or none of its lines banked)
      value: '0'
    baseline:
      banked_deduct: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  baseline:
    rule: Such a Residential Standard offer is made for the reservation's requested kW. The standard first-year kWh estimate is the offered kW multiplied by the standard output per kW and by estimate_years, rounded half up to a whole kWh. The standard output per kW is the standard annual output figure divided by the household share's allocation_kw. The standard annual output figure is the net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted on the household share in the last twelve whole months. The standard first-year savings estimate is the rounded standard first-year kWh estimate multiplied by the standard credit value per kWh and by the requested plan's savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise. The standard credit value per kWh is the net credit value (credit value posted less credit value reversed) of the credit statements posted on the household share in the last twelve whole months divided by their net credited kWh.
    params:
    - estimate_years
  inputs:
    history:
    - category: home
      table: home_credits
      aggregate: sum
      field: credited_kwh
      within_months: 12
      filters:
        event_type: home_credit_posted
    - category: home
      table: home_credits
      aggregate: sum
      field: credit_value
      within_months: 12
      filters:
        event_type: home_credit_posted
    - category: home
      table: home_reviews
      aggregate: latest
      field: credited_kwh_12m
      within_months: 120
      filters: {}
    cross_category:
    - home
- id: waitlist_ext_addon_request_fit
  base_policy_refs:
  - waitlist_agg_account_headroom
  - waitlist_request_changes
  overwrite: []
  trigger: on_request
  subject:
  - waitlist_request_updated
  computes: requested_kw
  target_tool: fit_addon_request_598035d1
  params: {}
  rule: 'When the subscriber asks to fit a Residential Add-On reservation to the usage room of its utility account, the request is set as worked out here. This applies to a Residential Add-On reservation whose existing share, the only active Residential Community Solar Subscription on its utility account, is on the reservation''s project, carries a plan with a production guarantee, has at least one annual true-up and at least one credit statement posted in the last twelve whole months, and is both the account share and the household share, when the add-on fitted size is at least min_requested_kw and the request so set is within the account headroom of waitlist_agg_account_headroom, and only to such a reservation; a change to any other reservation follows the base rule. The add-on usage room is the add-on usage figure less the add-on existing output, divided by the add-on target yield, and never below 0; the add-on fitted size is the add-on usage room sized down to a whole multiple of increment_kw. The add-on usage figure is the usage_kwh_12m of the account share''s latest annual true-up. The add-on existing output is the account share''s expected annual production: its latest annual true-up''s guaranteed_kwh divided by the account share''s plan''s production_guarantee_pct divided by 100. The add-on target yield is the household share''s net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted in the last twelve whole months divided by its allocation_kw. When the subscriber asks to fit the request, the requested kW is set to the lesser of the reservation''s current requested_kw and the add-on fitted size, rounded to two decimals. For the add-on fit, a count of whole months between two dates is the difference between their calendar months, less one when the later date''s day of the month is earlier than the earlier date''s; a statement line, filing, offer or true-up falls in the last N whole months when fewer than N whole months separate its date (posted_date, effective_date, offer_date or review_date) from today, and was completed N whole months ago when exactly N whole months separate its review_date from today. The add-on adjustments below act in this order: a figure that replaces the add-on usage figure is taken first; the add-on banking margin multiplies the usage figure next; a figure that replaces the add-on existing output is taken first; a figure that replaces the add-on target yield is taken; the add-on usage room is then formed from these figures and only then sized down. Add-on usage averaging: where three or more annual true-ups of the account share were completed in the last 36 whole months, the add-on usage figure is the average of their usage_kwh_12m; where fewer than three were completed in the last 36 whole months and exactly two in the last 24 whole months, it is the average of those two; otherwise it is the figure of the standard method. Add-on banking margin: where the account share carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the add-on usage figure is multiplied by 0.90; where it carries one to three such lines, by 0.95; otherwise by 1. Add-on existing output by record: where the account share''s latest annual true-up recorded a shortfall_kwh above 0, the add-on existing output is that true-up''s credited_kwh_12m; where that true-up assessed no guarantee (guaranteed_kwh 0), it is the account share''s net credited kWh of the credit statements posted in the last twelve whole months; otherwise it is the figure of the standard method. Add-on target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the add-on target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
  prerequisite: []
  cross_category:
  - category: home
    as: history
    reads:
    - home_sub_id
    - allocation_kw
    - status
    - project_id
    - utility_account_id
    - variant_name
    - home_credits.credited_kwh
    - home_credits.posted_date
    - home_reviews.usage_kwh_12m
    - home_reviews.guaranteed_kwh
    - home_reviews.shortfall_kwh
    - home_reviews.credited_kwh_12m
    - home_reviews.review_date
    - home_credits.banked_value
    note: Every factor reads the Residential share on the reservation's account or the household share on its project.
  compute:
  - acct_sid: CFIELD('home','home_sub_id', utility_account_id=F('utility_account_id'), status='active')
  - acct_pct: CPARAM('home','production_guarantee_pct', home_sub_id=acct_sid)
  - a_tu_usage: XLATEST('home','home_reviews','usage_kwh_12m', date_field='review_date', home_sub_id=acct_sid)
  - a_tu_guar: XLATEST('home','home_reviews','guaranteed_kwh', date_field='review_date', home_sub_id=acct_sid)
  - hh_sid: CFIELD('home','home_sub_id', project_id=F('project_id'), status='active')
  - hh_alloc: CFIELD('home','allocation_kw', home_sub_id=hh_sid)
  - hh_kwh12: XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=hh_sid) - XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=hh_sid)
  - n36: XCOUNT('home','home_reviews', within_months=36, date_field='review_date', home_sub_id=acct_sid)
  - n24: XCOUNT('home','home_reviews', within_months=24, date_field='review_date', home_sub_id=acct_sid)
  - usage_fig: XSUM('home','home_reviews','usage_kwh_12m', within_months=36, date_field='review_date', home_sub_id=acct_sid) / n36 if n36 >= 3 else (XSUM('home','home_reviews','usage_kwh_12m', within_months=24, date_field='review_date', home_sub_id=acct_sid) / 2 if n24 == 2 else a_tu_usage)
  - m_lines: XCOUNT('home','home_credits', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=acct_sid)
  - m_unbanked: XCOUNT('home','home_credits', within_months=12, date_field='posted_date', event_type='home_credit_posted', banked_value=0.0, home_sub_id=acct_sid)
  - margin: 0.9 if m_lines - m_unbanked >= 4 else (0.95 if m_lines - m_unbanked >= 1 else 1.0)
  - a_tu_short: XLATEST('home','home_reviews','shortfall_kwh', date_field='review_date', home_sub_id=acct_sid)
  - a_tu_kwh: XLATEST('home','home_reviews','credited_kwh_12m', date_field='review_date', home_sub_id=acct_sid)
  - a_kwh12: XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=acct_sid) - XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=acct_sid)
  - existing: a_tu_kwh if (a_tu_short or 0) > 0 else (a_kwh12 if (a_tu_guar or 0) == 0 else a_tu_guar / (acct_pct / 100))
  - o_recent: COUNT('waitlist_offers', within_months=12, date_field='offer_date', project_id=F('project_id'))
  - o_date: LATEST('waitlist_offers','offer_date', date_field='offer_date', project_id=F('project_id'))
  - o_kw: MAX('waitlist_offers','offered_kw', offer_date=o_date, project_id=F('project_id'))
  - o_kwh: MAX('waitlist_offers','estimated_annual_kwh', offer_date=o_date, offered_kw=o_kw, project_id=F('project_id'))
  - hh_tu_date: XLATEST('home','home_reviews','review_date', date_field='review_date', home_sub_id=hh_sid)
  - hh_tu_kwh: XLATEST('home','home_reviews','credited_kwh_12m', date_field='review_date', home_sub_id=hh_sid)
  - target: o_kwh / o_kw / P('estimate_years') if o_recent > 0 else (hh_tu_kwh / hh_alloc if (hh_tu_date and MONTHS(hh_tu_date, NOW) < 12) else hh_kwh12 / hh_alloc)
  - room: MX(0, usage_fig * margin - existing) / target
  - fitted: int(room / P('increment_kw') + 0.000000001) * P('increment_kw')
  - result: RND(MN(F('requested_kw'), fitted) + 0.000000001, 2)
  compute_basis:
    acct_sid: When the subscriber asks to fit a Residential Add-On reservation to the usage room of its utility account, the request is set as worked out here. This applies to a Residential Add-On reservation whose existing share, the only active Residential Community Solar Subscription on its utility account, is on the reservation's project, carries a plan with a production guarantee, has at least one annual true-up and at least one credit statement posted in the last twelve whole months, and is both the account share and the household share, when the add-on fitted size is at least min_requested_kw and the request so set is within the account headroom of waitlist_agg_account_headroom, and only to such a reservation; a change to any other reservation follows the base rule.
    acct_pct: 'The add-on existing output is the account share''s expected annual production: its latest annual true-up''s guaranteed_kwh divided by the account share''s plan''s production_guarantee_pct divided by 100.'
    a_tu_usage: The add-on usage figure is the usage_kwh_12m of the account share's latest annual true-up.
    a_tu_guar: 'The add-on existing output is the account share''s expected annual production: its latest annual true-up''s guaranteed_kwh divided by the account share''s plan''s production_guarantee_pct divided by 100.'
    hh_sid: When the subscriber asks to fit a Residential Add-On reservation to the usage room of its utility account, the request is set as worked out here. This applies to a Residential Add-On reservation whose existing share, the only active Residential Community Solar Subscription on its utility account, is on the reservation's project, carries a plan with a production guarantee, has at least one annual true-up and at least one credit statement posted in the last twelve whole months, and is both the account share and the household share, when the add-on fitted size is at least min_requested_kw and the request so set is within the account headroom of waitlist_agg_account_headroom, and only to such a reservation; a change to any other reservation follows the base rule.
    hh_alloc: The add-on target yield is the household share's net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted in the last twelve whole months divided by its allocation_kw.
    hh_kwh12: The add-on target yield is the household share's net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted in the last twelve whole months divided by its allocation_kw.
    n36: 'Add-on usage averaging: where three or more annual true-ups of the account share were completed in the last 36 whole months, the add-on usage figure is the average of their usage_kwh_12m; where fewer than three were completed in the last 36 whole months and exactly two in the last 24 whole months, it is the average of those two; otherwise it is the figure of the standard method.'
    n24: 'Add-on usage averaging: where three or more annual true-ups of the account share were completed in the last 36 whole months, the add-on usage figure is the average of their usage_kwh_12m; where fewer than three were completed in the last 36 whole months and exactly two in the last 24 whole months, it is the average of those two; otherwise it is the figure of the standard method.'
