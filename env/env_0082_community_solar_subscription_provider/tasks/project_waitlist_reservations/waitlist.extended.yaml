    m_lines: 'Add-on banking margin: where the account share carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the add-on usage figure is multiplied by 0.90; where it carries one to three such lines, by 0.95; otherwise by 1.'
    m_unbanked: 'Add-on banking margin: where the account share carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the add-on usage figure is multiplied by 0.90; where it carries one to three such lines, by 0.95; otherwise by 1.'
    margin: 'Add-on banking margin: where the account share carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the add-on usage figure is multiplied by 0.90; where it carries one to three such lines, by 0.95; otherwise by 1.'
    a_tu_short: 'Add-on existing output by record: where the account share''s latest annual true-up recorded a shortfall_kwh above 0, the add-on existing output is that true-up''s credited_kwh_12m; where that true-up assessed no guarantee (guaranteed_kwh 0), it is the account share''s net credited kWh of the credit statements posted in the last twelve whole months; otherwise it is the figure of the standard method.'
    a_tu_kwh: 'Add-on existing output by record: where the account share''s latest annual true-up recorded a shortfall_kwh above 0, the add-on existing output is that true-up''s credited_kwh_12m; where that true-up assessed no guarantee (guaranteed_kwh 0), it is the account share''s net credited kWh of the credit statements posted in the last twelve whole months; otherwise it is the figure of the standard method.'
    a_kwh12: 'Add-on existing output by record: where the account share''s latest annual true-up recorded a shortfall_kwh above 0, the add-on existing output is that true-up''s credited_kwh_12m; where that true-up assessed no guarantee (guaranteed_kwh 0), it is the account share''s net credited kWh of the credit statements posted in the last twelve whole months; otherwise it is the figure of the standard method.'
    existing: 'Add-on existing output by record: where the account share''s latest annual true-up recorded a shortfall_kwh above 0, the add-on existing output is that true-up''s credited_kwh_12m; where that true-up assessed no guarantee (guaranteed_kwh 0), it is the account share''s net credited kWh of the credit statements posted in the last twelve whole months; otherwise it is the figure of the standard method.'
    o_recent: 'Add-on target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the add-on target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    o_date: 'Add-on target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the add-on target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    o_kw: 'Add-on target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the add-on target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    o_kwh: 'Add-on target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the add-on target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    hh_tu_date: 'Add-on target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the add-on target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    hh_tu_kwh: 'Add-on target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the add-on target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    target: 'Add-on target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the add-on target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    room: 'The add-on adjustments below act in this order: a figure that replaces the add-on usage figure is taken first; the add-on banking margin multiplies the usage figure next; a figure that replaces the add-on existing output is taken first; a figure that replaces the add-on target yield is taken; the add-on usage room is then formed from these figures and only then sized down.'
    fitted: The add-on usage room is the add-on usage figure less the add-on existing output, divided by the add-on target yield, and never below 0; the add-on fitted size is the add-on usage room sized down to a whole multiple of increment_kw.
    result: When the subscriber asks to fit the request, the requested kW is set to the lesser of the reservation's current requested_kw and the add-on fitted size, rounded to two decimals.
  factors:
  - id: usage_figure_averaging
    effect: parameter
    decides: usage_fig
    bindings:
    - n36
    - n24
    - usage_fig
    ladder:
    - when: three or more annual true-ups of the account share completed in the last 36 whole months
      value: the average of their usage_kwh_12m
    - when: fewer than three in the last 36 whole months and exactly two in the last 24 whole months
      value: the average of those two usage_kwh_12m
    - when: otherwise
      value: usage_kwh_12m of the latest true-up (standard method)
    baseline:
      usage_fig: a_tu_usage
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  - id: banking_margin
    effect: parameter
    decides: margin
    bindings:
    - m_lines
    - m_unbanked
    - margin
    ladder:
    - when: four or more account-share lines posted in the last twelve whole months with banked_value above 0
      value: '0.90'
    - when: one to three such lines
      value: '0.95'
    - when: otherwise (no such line)
      value: '1'
    baseline:
      margin: '1.0'
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  - id: existing_output_basis
    effect: method
    decides: existing
    bindings:
    - a_tu_short
    - a_tu_kwh
    - a_kwh12
    - existing
    ladder:
    - when: the account share's latest annual true-up recorded a shortfall_kwh above 0
      method: that true-up's credited_kwh_12m
    - when: that true-up assessed no guarantee (guaranteed_kwh 0)
      method: net credited kWh of the account share's statements posted in the last twelve whole months
    - when: otherwise
      method: guaranteed_kwh divided by the plan's production_guarantee_pct over 100 (standard method)
    baseline:
      existing: a_tu_guar / (acct_pct / 100)
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  - id: target_yield_source
    effect: parameter
    decides: target
    bindings:
    - o_recent
    - o_date
    - o_kw
    - o_kwh
    - hh_tu_date
    - hh_tu_kwh
    - target
    ladder:
    - when: this reservation has received at least one offer on its own project in the last twelve whole months
      value: the latest such offer's estimated_annual_kwh divided by its offered_kw and estimate_years
    - when: no such offer and the household share's latest annual true-up was completed within the last twelve whole months
      value: that true-up's credited_kwh_12m divided by the household share's allocation_kw
    - when: otherwise
      value: the household share's twelve-month output per kW (standard method)
    baseline:
      target: hh_kwh12 / hh_alloc
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  baseline:
    rule: 'The add-on usage room is the add-on usage figure less the add-on existing output, divided by the add-on target yield, and never below 0; the add-on fitted size is the add-on usage room sized down to a whole multiple of increment_kw. The add-on usage figure is the usage_kwh_12m of the account share''s latest annual true-up. The add-on existing output is the account share''s expected annual production: its latest annual true-up''s guaranteed_kwh divided by the account share''s plan''s production_guarantee_pct divided by 100. The add-on target yield is the household share''s net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted in the last twelve whole months divided by its allocation_kw. When the subscriber asks to fit the request, the requested kW is set to the lesser of the reservation''s current requested_kw and the add-on fitted size, rounded to two decimals.'
    params:
    - increment_kw
    - estimate_years
  inputs:
    history:
    - table: waitlist_offers
      aggregate: latest
      field: estimated_annual_kwh
      within_months: 12
      filters: {}
    - category: home
      table: home_reviews
      aggregate: latest
      field: usage_kwh_12m
      within_months: 36
      filters: {}
    - category: home
      table: home_credits
      aggregate: count
      field: banked_value
      within_months: 12
      filters:
        event_type: home_credit_posted
    cross_category:
    - home
- id: waitlist_ext_addon_offer_estimate
  base_policy_refs:
  - waitlist_queue_order
  - waitlist_agg_account_headroom
  - waitlist_evt_offer_terms
  overwrite:
  - base_policy: waitlist_evt_offer_terms
    superseded_clause: estimated_annual_kwh is offered_kw multiplied by the project's expected_yield_kwh_per_kw and estimate_years, rounded half up to a whole kWh.
    replaced_by: 'For a full Residential Add-On offer that this policy settles, and only for such an offer, the add-on first-year kWh estimate is taken from the household share''s own record as set out here; a full Relocation Priority or Residential Standard offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_kwh is offered_kw multiplied by the project''s expected_yield_kwh_per_kw and estimate_years, rounded half up to a whole kWh.'
  - base_policy: waitlist_evt_offer_terms
    superseded_clause: estimated_annual_savings is estimated_annual_kwh multiplied by the project's est_credit_rate_per_kwh and by the offered plan's savings_rate_pct divided by 100 on percent-savings plans, or by the amount the project's est_credit_rate_per_kwh exceeds the plan's fixed_rate_per_kwh on fixed-rate plans (0.00 when it does not), rounded half up to the cent; it is an estimate and never a promise.
    replaced_by: 'For the same full Residential Add-On offers, and only for them, the savings estimate is figured from the add-on first-year kWh estimate and the add-on credit value per kWh as set out here; a full Relocation Priority or Residential Standard offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_savings is estimated_annual_kwh multiplied by the project''s est_credit_rate_per_kwh and by the offered plan''s savings_rate_pct divided by 100 on percent-savings plans, or by the amount the project''s est_credit_rate_per_kwh exceeds the plan''s fixed_rate_per_kwh on fixed-rate plans (0.00 when it does not), rounded half up to the cent; it is an estimate and never a promise.'
  trigger: state_due
  subject:
  - waitlist_offer_extended
  - waitlist_offer_made
  computes: estimated_annual_savings
  target_tool: extend_addon_offer_d026003c
  params: {}
  rule: 'This policy settles the estimate written on a full offer to a Residential Add-On reservation (offered kW equal to the requested kW, the project capacity available to the reservation and the account headroom on the offer date both covering it) on the project of the customer''s active Residential Community Solar Subscription on the same utility account, the only active Residential share on that account, with at least one credit statement posted on it in the last twelve whole months (the household share, which is also the account share); it applies to such an offer and only to such an offer. An add-on offer and its estimate are fixed only after the add-on''s requested kW is no more than the add-on fitted size of its utility account. An add-on offer is made only after no Residential Standard reservation on the same project that can receive a valid offer is left in queued status. Such an add-on offer is made for the reservation''s requested kW. The add-on first-year kWh estimate is the offered kW multiplied by the add-on output per kW and by estimate_years, rounded half up to a whole kWh. The add-on output per kW is the add-on annual output figure divided by the household share''s allocation_kw. The add-on annual output figure is the net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted on the household share in the last twelve whole months. The add-on first-year savings estimate is the rounded add-on first-year kWh estimate multiplied by the add-on credit value per kWh and by the requested plan''s savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise. The add-on credit value per kWh is the net credit value (credit value posted less credit value reversed) of the credit statements posted on the household share in the last twelve whole months divided by their net credited kWh. For the add-on figures, a count of whole months between two dates is the difference between their calendar months, less one when the later date''s day of the month is earlier than the earlier date''s; a statement line, filing, offer or true-up falls in the last N whole months when fewer than N whole months separate its date (posted_date, effective_date, offer_date or review_date) from today, and was completed N whole months ago when exactly N whole months separate its review_date from today. The add-on adjustments below act in this order: a figure that replaces the add-on annual output figure is taken first and the floor on it is applied next; the add-on output per kW is then formed from the floored figure and the blend is applied to it before the add-on first-year kWh estimate is rounded; a figure that replaces the add-on credit value per kWh is taken first, the trend multiplier is applied to it next and the banked-credit reduction is subtracted last, before it multiplies the rounded estimate. Add-on output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the add-on annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method. Add-on guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the add-on annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies. Add-on young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the add-on output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the add-on output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100. Add-on credit value by recency: where the household share''s latest annual true-up was completed within the last six whole months, the add-on credit value per kWh is that true-up''s avg_credit_rate; where it was completed six to eleven whole months ago and the credit statements posted on the household share in the last N whole months, N being the number of whole months from that true-up''s review_date to today, carry a net credited kWh above 0, it is the net credit value of those statements divided by their net credited kWh; otherwise it is the twelve-month figure of the standard method. Add-on credit-rate trend: where the true-up of the contract year before the household share''s latest annual true-up was completed within the last 24 whole months, the add-on credit value per kWh is multiplied by the latest true-up''s avg_credit_rate divided by that earlier true-up''s avg_credit_rate, the multiplier kept between 0.95 and 1.05; where that earlier true-up was completed 24 to 35 whole months ago, it is multiplied by 1 plus half of the amount by which that ratio differs from 1, the multiplier kept between 0.95 and 1.05; where there is no such earlier true-up or it was completed 36 or more whole months ago, it is multiplied by 1. Add-on banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the add-on credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced. For a full Residential Add-On offer that this policy settles, and only for such an offer, the add-on first-year kWh estimate is taken from the household share''s own record as set out here; a full Relocation Priority or Residential Standard offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_kwh is offered_kw multiplied by the project''s expected_yield_kwh_per_kw and estimate_years, rounded half up to a whole kWh. For the same full Residential Add-On offers, and only for them, the savings estimate is figured from the add-on first-year kWh estimate and the add-on credit value per kWh as set out here; a full Relocation Priority or Residential Standard offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_savings is estimated_annual_kwh multiplied by the project''s est_credit_rate_per_kwh and by the offered plan''s savings_rate_pct divided by 100 on percent-savings plans, or by the amount the project''s est_credit_rate_per_kwh exceeds the plan''s fixed_rate_per_kwh on fixed-rate plans (0.00 when it does not), rounded half up to the cent; it is an estimate and never a promise.'
  prerequisite:
  - problem: waitlist_ext_addon_request_fit
    kind: value_input
    gate: offered_kw
    form: state
    policy_source: An add-on offer and its estimate are fixed only after the add-on's requested kW is no more than the add-on fitted size of its utility account.
    condition: The Residential Add-On reservation's requested_kw is no more than the add-on fitted size its utility account gives under the add-on fit rule.
    resolved_by: fit_addon_request_598035d1
    effect: The offered kW (the add-on's requested_kw) falls to the add-on fitted size, so the estimates are figured on that size.
  - problem: waitlist_ext_standard_offer_estimate
    kind: state_gate
    gate: waitlist_reservations.status
    form: state
    policy_source: An add-on offer is made only after no Residential Standard reservation on the same project that can receive a valid offer is left in queued status.
    condition: No Residential Standard reservation on the add-on's project that can receive a valid offer under the base offer terms is in queued status.
    resolved_by: extend_standard_offer_cf280a13
    effect: The higher-ranked Residential Standard reservation on the project moves from queued to offered, so the add-on offer may be made.
  cross_category:
  - category: home
    as: history
    reads:
    - home_sub_id
    - allocation_kw
    - status
    - project_id
    - utility_account_id
    - variant_name
    - home_credits.credited_kwh
    - home_credits.credit_value
    - home_credits.posted_date
    - home_reviews.credited_kwh_12m
    - home_reviews.avg_credit_rate
    - home_reviews.guaranteed_kwh
    - home_reviews.shortfall_kwh
    - home_reviews.review_date
    - home_reviews.contract_year
    - home_credits.banked_value
    note: Every factor reads the household share on the offered project or the Residential share on the reservation's own account (statements, true-ups, plan).
  compute:
  - ref_sid: CFIELD('home','home_sub_id', project_id=F('project_id'), status='active')
  - ref_alloc: CFIELD('home','allocation_kw', home_sub_id=ref_sid)
  - ref_pct: CPARAM('home','production_guarantee_pct', home_sub_id=ref_sid)
  - tu_date: XLATEST('home','home_reviews','review_date', date_field='review_date', home_sub_id=ref_sid)
  - tu_kwh: XLATEST('home','home_reviews','credited_kwh_12m', date_field='review_date', home_sub_id=ref_sid)
  - tu_rate: XLATEST('home','home_reviews','avg_credit_rate', date_field='review_date', home_sub_id=ref_sid)
  - tu_guar: XLATEST('home','home_reviews','guaranteed_kwh', date_field='review_date', home_sub_id=ref_sid)
  - tu_cy: XLATEST('home','home_reviews','contract_year', date_field='review_date', home_sub_id=ref_sid)
  - tu_age: MONTHS(tu_date, NOW) if tu_date else 999
  - n_stmt: XCOUNT('home','home_credits', event_type='home_credit_posted', home_sub_id=ref_sid)
  - kwh12: XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)
  - val12: XSUM('home','home_credits','credit_value', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credit_value', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)
  - kwh_all: XSUM('home','home_credits','credited_kwh', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credited_kwh', event_type='home_credit_reversed', home_sub_id=ref_sid)
  - out_kwh: tu_kwh if (tu_date and tu_age < 12) else (kwh_all * 12 / n_stmt if (n_stmt < 12 and not tu_date) else kwh12)
  - tu_short: XLATEST('home','home_reviews','shortfall_kwh', date_field='review_date', home_sub_id=ref_sid)
  - prev_short: XLATEST('home','home_reviews','shortfall_kwh', date_field='review_date', contract_year=(tu_cy or 0) - 1, home_sub_id=ref_sid)
  - floor_kwh: tu_guar if (tu_date and tu_age < 12 and (tu_short or 0) > 0 and (prev_short or 0) > 0) else ((tu_kwh + tu_guar) / 2 if (tu_date and tu_age < 12 and (tu_short or 0) > 0) else 0)
  - blend_lines: XCOUNT('home','home_credits', event_type='home_credit_posted', home_sub_id=ref_sid)
  - design_kw: tu_guar / ref_alloc / (ref_pct / 100) if ((tu_guar or 0) > 0 and (ref_pct or 0) > 0) else 0
  - blend_w: 0.5 if (blend_lines < 24 and (tu_guar or 0) > 0) else (0.75 if (blend_lines >= 24 and blend_lines < 36 and (tu_guar or 0) > 0) else 1.0)
  - kwh_since: (XSUM('home','home_credits','credited_kwh', within_months=tu_age, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credited_kwh', within_months=tu_age, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)) if (tu_date and tu_age < 12) else 0
  - val_since: (XSUM('home','home_credits','credit_value', within_months=tu_age, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credit_value', within_months=tu_age, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)) if (tu_date and tu_age < 12) else 0
  - value_kwh: tu_rate if (tu_date and tu_age < 6) else (val_since / kwh_since if (tu_date and tu_age >= 6 and tu_age < 12 and kwh_since > 0) else val12 / kwh12)
  - prev_rate: XLATEST('home','home_reviews','avg_credit_rate', date_field='review_date', contract_year=(tu_cy or 0) - 1, home_sub_id=ref_sid)
  - prev_date: XLATEST('home','home_reviews','review_date', date_field='review_date', contract_year=(tu_cy or 0) - 1, home_sub_id=ref_sid)
  - prev_age: MONTHS(prev_date, NOW) if prev_date else 999
  - trend: MN(1.05, MX(0.95, tu_rate / prev_rate)) if prev_age < 24 else (MN(1.05, MX(0.95, 1 + (tu_rate / prev_rate - 1) / 2)) if prev_age < 36 else 1.0)
  - acct_sid: CFIELD('home','home_sub_id', utility_account_id=F('utility_account_id'), status='active')
  - acct_lines: XCOUNT('home','home_credits', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=acct_sid)
  - acct_unbanked: XCOUNT('home','home_credits', within_months=12, date_field='posted_date', event_type='home_credit_posted', banked_value=0.0, home_sub_id=acct_sid)
  - acct_banked_val: XSUM('home','home_credits','banked_value', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=acct_sid)
  - acct_kwh12: XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=acct_sid) - XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=acct_sid)
  - banked_deduct: acct_banked_val / acct_kwh12 if (acct_sid and acct_lines - acct_unbanked >= 4 and acct_kwh12 > 0) else (acct_banked_val / acct_kwh12 / 2 if (acct_sid and acct_lines - acct_unbanked >= 1 and acct_kwh12 > 0) else 0)
  - out_per_kw: MX(out_kwh, floor_kwh) / ref_alloc
  - per_kw: blend_w * out_per_kw + (1 - blend_w) * design_kw
  - offered_kw: F('requested_kw')
  - est_kwh: RND(offered_kw * per_kw * P('estimate_years') + 0.000000001, 0)
  - value_used: value_kwh * trend - banked_deduct
  - plan_pct: CPARAM('home','savings_rate_pct', variant_name=F('requested_plan'))
  - result: RND(est_kwh * value_used * plan_pct / 100 + 0.000000001, 2)
  compute_basis:
    ref_sid: This policy settles the estimate written on a full offer to a Residential Add-On reservation (offered kW equal to the requested kW, the project capacity available to the reservation and the account headroom on the offer date both covering it) on the project of the customer's active Residential Community Solar Subscription on the same utility account, the only active Residential share on that account, with at least one credit statement posted on it in the last twelve whole months (the household share, which is also the account share); it applies to such an offer and only to such an offer.
    ref_alloc: The add-on output per kW is the add-on annual output figure divided by the household share's allocation_kw.
    ref_pct: 'Add-on young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the add-on output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the add-on output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100.'
    tu_date: 'Add-on output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the add-on annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method.'
    tu_kwh: 'Add-on output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the add-on annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method.'
    tu_rate: 'Add-on credit value by recency: where the household share''s latest annual true-up was completed within the last six whole months, the add-on credit value per kWh is that true-up''s avg_credit_rate; where it was completed six to eleven whole months ago and the credit statements posted on the household share in the last N whole months, N being the number of whole months from that true-up''s review_date to today, carry a net credited kWh above 0, it is the net credit value of those statements divided by their net credited kWh; otherwise it is the twelve-month figure of the standard method.'
    tu_guar: 'Add-on guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the add-on annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    tu_cy: 'Add-on guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the add-on annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    tu_age: For the add-on figures, a count of whole months between two dates is the difference between their calendar months, less one when the later date's day of the month is earlier than the earlier date's; a statement line, filing, offer or true-up falls in the last N whole months when fewer than N whole months separate its date (posted_date, effective_date, offer_date or review_date) from today, and was completed N whole months ago when exactly N whole months separate its review_date from today.
    n_stmt: 'Add-on output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the add-on annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method.'
    kwh12: The add-on annual output figure is the net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted on the household share in the last twelve whole months.
    val12: The add-on credit value per kWh is the net credit value (credit value posted less credit value reversed) of the credit statements posted on the household share in the last twelve whole months divided by their net credited kWh.
    kwh_all: 'Add-on output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the add-on annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method.'
    out_kwh: 'Add-on output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the add-on annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method.'
    tu_short: 'Add-on guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the add-on annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    prev_short: 'Add-on guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the add-on annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    floor_kwh: 'Add-on guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the add-on annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    blend_lines: 'Add-on young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the add-on output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the add-on output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100.'
    design_kw: 'Add-on young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the add-on output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the add-on output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100.'
    blend_w: 'Add-on young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the add-on output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the add-on output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100.'
    kwh_since: 'Add-on credit value by recency: where the household share''s latest annual true-up was completed within the last six whole months, the add-on credit value per kWh is that true-up''s avg_credit_rate; where it was completed six to eleven whole months ago and the credit statements posted on the household share in the last N whole months, N being the number of whole months from that true-up''s review_date to today, carry a net credited kWh above 0, it is the net credit value of those statements divided by their net credited kWh; otherwise it is the twelve-month figure of the standard method.'
    val_since: 'Add-on credit value by recency: where the household share''s latest annual true-up was completed within the last six whole months, the add-on credit value per kWh is that true-up''s avg_credit_rate; where it was completed six to eleven whole months ago and the credit statements posted on the household share in the last N whole months, N being the number of whole months from that true-up''s review_date to today, carry a net credited kWh above 0, it is the net credit value of those statements divided by their net credited kWh; otherwise it is the twelve-month figure of the standard method.'
    value_kwh: 'Add-on credit value by recency: where the household share''s latest annual true-up was completed within the last six whole months, the add-on credit value per kWh is that true-up''s avg_credit_rate; where it was completed six to eleven whole months ago and the credit statements posted on the household share in the last N whole months, N being the number of whole months from that true-up''s review_date to today, carry a net credited kWh above 0, it is the net credit value of those statements divided by their net credited kWh; otherwise it is the twelve-month figure of the standard method.'
    prev_rate: 'Add-on credit-rate trend: where the true-up of the contract year before the household share''s latest annual true-up was completed within the last 24 whole months, the add-on credit value per kWh is multiplied by the latest true-up''s avg_credit_rate divided by that earlier true-up''s avg_credit_rate, the multiplier kept between 0.95 and 1.05; where that earlier true-up was completed 24 to 35 whole months ago, it is multiplied by 1 plus half of the amount by which that ratio differs from 1, the multiplier kept between 0.95 and 1.05; where there is no such earlier true-up or it was completed 36 or more whole months ago, it is multiplied by 1.'
    prev_date: 'Add-on credit-rate trend: where the true-up of the contract year before the household share''s latest annual true-up was completed within the last 24 whole months, the add-on credit value per kWh is multiplied by the latest true-up''s avg_credit_rate divided by that earlier true-up''s avg_credit_rate, the multiplier kept between 0.95 and 1.05; where that earlier true-up was completed 24 to 35 whole months ago, it is multiplied by 1 plus half of the amount by which that ratio differs from 1, the multiplier kept between 0.95 and 1.05; where there is no such earlier true-up or it was completed 36 or more whole months ago, it is multiplied by 1.'
    prev_age: 'Add-on credit-rate trend: where the true-up of the contract year before the household share''s latest annual true-up was completed within the last 24 whole months, the add-on credit value per kWh is multiplied by the latest true-up''s avg_credit_rate divided by that earlier true-up''s avg_credit_rate, the multiplier kept between 0.95 and 1.05; where that earlier true-up was completed 24 to 35 whole months ago, it is multiplied by 1 plus half of the amount by which that ratio differs from 1, the multiplier kept between 0.95 and 1.05; where there is no such earlier true-up or it was completed 36 or more whole months ago, it is multiplied by 1.'
    trend: 'Add-on credit-rate trend: where the true-up of the contract year before the household share''s latest annual true-up was completed within the last 24 whole months, the add-on credit value per kWh is multiplied by the latest true-up''s avg_credit_rate divided by that earlier true-up''s avg_credit_rate, the multiplier kept between 0.95 and 1.05; where that earlier true-up was completed 24 to 35 whole months ago, it is multiplied by 1 plus half of the amount by which that ratio differs from 1, the multiplier kept between 0.95 and 1.05; where there is no such earlier true-up or it was completed 36 or more whole months ago, it is multiplied by 1.'
    acct_sid: 'Add-on banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the add-on credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced.'
    acct_lines: 'Add-on banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the add-on credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced.'
    acct_unbanked: 'Add-on banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the add-on credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced.'
    acct_banked_val: 'Add-on banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the add-on credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced.'
    acct_kwh12: 'Add-on banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the add-on credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced.'
    banked_deduct: 'Add-on banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the add-on credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced.'
    out_per_kw: 'The add-on adjustments below act in this order: a figure that replaces the add-on annual output figure is taken first and the floor on it is applied next; the add-on output per kW is then formed from the floored figure and the blend is applied to it before the add-on first-year kWh estimate is rounded; a figure that replaces the add-on credit value per kWh is taken first, the trend multiplier is applied to it next and the banked-credit reduction is subtracted last, before it multiplies the rounded estimate.'
    per_kw: 'The add-on adjustments below act in this order: a figure that replaces the add-on annual output figure is taken first and the floor on it is applied next; the add-on output per kW is then formed from the floored figure and the blend is applied to it before the add-on first-year kWh estimate is rounded; a figure that replaces the add-on credit value per kWh is taken first, the trend multiplier is applied to it next and the banked-credit reduction is subtracted last, before it multiplies the rounded estimate.'
    offered_kw: Such an add-on offer is made for the reservation's requested kW.
    est_kwh: The add-on first-year kWh estimate is the offered kW multiplied by the add-on output per kW and by estimate_years, rounded half up to a whole kWh.
    value_used: 'The add-on adjustments below act in this order: a figure that replaces the add-on annual output figure is taken first and the floor on it is applied next; the add-on output per kW is then formed from the floored figure and the blend is applied to it before the add-on first-year kWh estimate is rounded; a figure that replaces the add-on credit value per kWh is taken first, the trend multiplier is applied to it next and the banked-credit reduction is subtracted last, before it multiplies the rounded estimate.'
    plan_pct: The add-on first-year savings estimate is the rounded add-on first-year kWh estimate multiplied by the add-on credit value per kWh and by the requested plan's savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise.
    result: The add-on first-year savings estimate is the rounded add-on first-year kWh estimate multiplied by the add-on credit value per kWh and by the requested plan's savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise.
  factors:
  - id: output_history_basis
    effect: method
    decides: out_kwh
    bindings:
    - kwh_all
    - out_kwh
    ladder:
    - when: the household share's latest annual true-up was completed within the last twelve whole months
      method: the add-on annual output figure is that true-up's credited_kwh_12m
    - when: the household share has no annual true-up and carries fewer than twelve posted lines
      method: net credited kWh of all its statements times twelve divided by the number of posted lines
    - when: otherwise (latest true-up completed twelve or more whole months ago, or no true-up and twelve or more posted lines)
      method: net credited kWh of the statements posted in the last twelve whole months (standard method)
    baseline:
      out_kwh: kwh12
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  - id: guarantee_output_floor
    effect: parameter
    decides: floor_kwh
    bindings:
    - tu_short
    - prev_short
    - floor_kwh
    ladder:
    - when: the latest annual true-up was completed within the last twelve whole months with a shortfall_kwh above 0 and the true-up of the contract year before it also recorded a shortfall_kwh above 0
      value: that latest true-up's guaranteed_kwh
    - when: the latest annual true-up was completed within the last twelve whole months with a shortfall_kwh above 0 and the earlier true-up recorded none or does not exist
      value: half the sum of that latest true-up's credited_kwh_12m and guaranteed_kwh
    - when: otherwise (no true-up, latest completed twelve or more whole months ago, or no shortfall)
      value: 0 (no floor)
    baseline:
      floor_kwh: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  - id: young_share_blend
    effect: parameter
    decides: blend_w
    bindings:
    - blend_lines
    - design_kw
    - blend_w
    ladder:
    - when: fewer than 24 posted credit statement lines and the latest annual true-up assessed a guarantee
      value: '0.50'
    - when: 24 to 35 posted credit statement lines and the latest annual true-up assessed a guarantee
      value: '0.75'
    - when: otherwise (36 or more lines, or no guarantee assessed, or no true-up)
      value: 1.00 (unblended)
    baseline:
      blend_w: '1.0'
    evidence:
    - history
    - cross_category
    - tier_param
    cross_difficulty: home
  - id: credit_value_recency
    effect: method
    decides: value_kwh
    bindings:
    - kwh_since
    - val_since
    - value_kwh
    ladder:
    - when: the latest annual true-up was completed within the last six whole months
      method: that true-up's avg_credit_rate
    - when: the latest annual true-up was completed six to eleven whole months ago and the statements posted in the whole months since its review_date carry a net credited kWh above 0
      method: net credit value divided by net credited kWh of those statements
    - when: otherwise (no true-up, completed twelve or more whole months ago, or no net kWh since)
      method: the twelve-month credit value per kWh (standard method)
    baseline:
      value_kwh: val12 / kwh12
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  - id: credit_rate_trend
    effect: parameter
    decides: trend
    bindings:
    - prev_rate
    - prev_date
    - prev_age
    - trend
    ladder:
    - when: the true-up of the contract year before the latest one was completed within the last 24 whole months
      value: the latest avg_credit_rate divided by the earlier one, kept between 0.95 and 1.05
    - when: that earlier true-up was completed 24 to 35 whole months ago
      value: 1 plus half of that ratio's difference from 1, kept between 0.95 and 1.05
    - when: otherwise (no such earlier true-up, or completed 36 or more whole months ago)
      value: '1'
    baseline:
      trend: '1.0'
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  - id: banked_value_allowance
    effect: parameter
    decides: banked_deduct
    bindings:
    - acct_lines
    - acct_unbanked
    - acct_banked_val
    - acct_kwh12
    - banked_deduct
    ladder:
    - when: the account share carries four or more lines posted in the last twelve whole months with banked_value above 0
      value: its twelve-month banked value divided by its twelve-month net credited kWh
    - when: the account share carries one to three such lines
      value: half of that figure
    - when: otherwise (no active account share, or none of its lines banked)
      value: '0'
    baseline:
      banked_deduct: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  baseline:
    rule: Such an add-on offer is made for the reservation's requested kW. The add-on first-year kWh estimate is the offered kW multiplied by the add-on output per kW and by estimate_years, rounded half up to a whole kWh. The add-on output per kW is the add-on annual output figure divided by the household share's allocation_kw. The add-on annual output figure is the net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted on the household share in the last twelve whole months. The add-on first-year savings estimate is the rounded add-on first-year kWh estimate multiplied by the add-on credit value per kWh and by the requested plan's savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise. The add-on credit value per kWh is the net credit value (credit value posted less credit value reversed) of the credit statements posted on the household share in the last twelve whole months divided by their net credited kWh.
    params:
    - estimate_years
  inputs:
    history:
    - category: home
      table: home_credits
      aggregate: sum
      field: credited_kwh
      within_months: 12
      filters:
        event_type: home_credit_posted
    - category: home
      table: home_credits
      aggregate: sum
      field: credit_value
      within_months: 12
      filters:
        event_type: home_credit_posted
    - category: home
      table: home_reviews
      aggregate: latest
      field: credited_kwh_12m
      within_months: 120
      filters: {}
    cross_category:
    - home
