    old_tu_guar: 'Prior output guarantee floor: where the closed share''s latest annual true-up, completed fewer than twelve whole months before its closed_date, recorded a shortfall_kwh above 0 and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the prior output is not taken below that latest true-up''s guaranteed_kwh; where only that latest true-up recorded a shortfall_kwh above 0 (the earlier one recorded none or does not exist), it is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    old_prev_short: 'Prior output guarantee floor: where the closed share''s latest annual true-up, completed fewer than twelve whole months before its closed_date, recorded a shortfall_kwh above 0 and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the prior output is not taken below that latest true-up''s guaranteed_kwh; where only that latest true-up recorded a shortfall_kwh above 0 (the earlier one recorded none or does not exist), it is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    prior_floor: 'Prior output guarantee floor: where the closed share''s latest annual true-up, completed fewer than twelve whole months before its closed_date, recorded a shortfall_kwh above 0 and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the prior output is not taken below that latest true-up''s guaranteed_kwh; where only that latest true-up recorded a shortfall_kwh above 0 (the earlier one recorded none or does not exist), it is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    old_tu_resize: 'Kept share of the prior output: where the closed share''s latest annual true-up recorded a resize_kw above 0, the prior output is multiplied by the kW its move_removal filing removed divided by that kW plus the resize_kw; where that true-up recorded no resize and subscriber_increase filings on the closed share took effect in the last N whole months, N being the number of whole months from that true-up''s review_date to today, it is multiplied by the move_removal kW divided by the move_removal kW less the kW of those filings; otherwise it is multiplied by 1.'
    old_removed: 'Kept share of the prior output: where the closed share''s latest annual true-up recorded a resize_kw above 0, the prior output is multiplied by the kW its move_removal filing removed divided by that kW plus the resize_kw; where that true-up recorded no resize and subscriber_increase filings on the closed share took effect in the last N whole months, N being the number of whole months from that true-up''s review_date to today, it is multiplied by the move_removal kW divided by the move_removal kW less the kW of those filings; otherwise it is multiplied by 1.'
    old_inc_after: 'Kept share of the prior output: where the closed share''s latest annual true-up recorded a resize_kw above 0, the prior output is multiplied by the kW its move_removal filing removed divided by that kW plus the resize_kw; where that true-up recorded no resize and subscriber_increase filings on the closed share took effect in the last N whole months, N being the number of whole months from that true-up''s review_date to today, it is multiplied by the move_removal kW divided by the move_removal kW less the kW of those filings; otherwise it is multiplied by 1.'
    kept_ratio: 'Kept share of the prior output: where the closed share''s latest annual true-up recorded a resize_kw above 0, the prior output is multiplied by the kW its move_removal filing removed divided by that kW plus the resize_kw; where that true-up recorded no resize and subscriber_increase filings on the closed share took effect in the last N whole months, N being the number of whole months from that true-up''s review_date to today, it is multiplied by the move_removal kW divided by the move_removal kW less the kW of those filings; otherwise it is multiplied by 1.'
    ref_guar: 'Restore yield by record: where the household share''s latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the restore yield is the household share''s design output per kW, that true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100; where that true-up assessed no guarantee and was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    ref_tu_date: 'Restore yield by record: where the household share''s latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the restore yield is the household share''s design output per kW, that true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100; where that true-up assessed no guarantee and was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    ref_tu_kwh: 'Restore yield by record: where the household share''s latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the restore yield is the household share''s design output per kW, that true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100; where that true-up assessed no guarantee and was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    restore_yield: 'Restore yield by record: where the household share''s latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the restore yield is the household share''s design output per kW, that true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100; where that true-up assessed no guarantee and was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    raw_kw: 'The restore adjustments below act in this order: a figure that replaces the prior output is taken first, the floor on it is applied next and the kept-share multiplier last; a figure that replaces the restore yield is taken; the restored size is then formed from these figures and only then sized down.'
    restored_kw: The restored size is the closed share's prior output divided by the restore yield, sized down to a whole multiple of increment_kw.
    result: The request is set to the lesser of the reservation's current requested_kw and the restored size, rounded to two decimals.
  factors:
  - id: prior_output_history
    effect: method
    decides: prior_out
    bindings:
    - old_tu_kwh
    - old_n
    - old_all_kwh
    - prior_out
    ladder:
    - when: the closed share's latest annual true-up was completed fewer than twelve whole months before its closed_date
      method: the prior output is that true-up's credited_kwh_12m
    - when: the closed share has no annual true-up and carries fewer than twelve posted credit statement lines
      method: the net credited kWh of all its statements times twelve divided by the number of its posted lines
    - when: otherwise
      method: the net credited kWh of the statements posted in the last N whole months, N being twelve plus the whole months from closed_date to today (standard method)
    baseline:
      prior_out: old_win_kwh
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  - id: prior_output_guarantee_floor
    effect: parameter
    decides: prior_floor
    bindings:
    - old_tu_short
    - old_tu_guar
    - old_prev_short
    - prior_floor
    ladder:
    - when: the closed share's latest annual true-up, completed fewer than twelve whole months before closed_date, and the true-up of the contract year before it both recorded a shortfall_kwh above 0
      value: that latest true-up's guaranteed_kwh
    - when: only that latest true-up recorded a shortfall_kwh above 0
      value: half the sum of its credited_kwh_12m and guaranteed_kwh
    - when: otherwise
      value: 0 (no floor)
    baseline:
      prior_floor: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  - id: kept_share_of_output
    effect: method
    decides: kept_ratio
    bindings:
    - old_tu_resize
    - old_removed
    - old_inc_after
    - kept_ratio
    ladder:
    - when: the closed share's latest annual true-up recorded a resize_kw above 0
      method: multiply by the move_removal kW divided by that kW plus the resize_kw
    - when: that true-up recorded no resize and subscriber_increase filings took effect in the whole months since its review_date
      method: multiply by the move_removal kW divided by the move_removal kW less those filings' kW
    - when: otherwise
      method: multiply by 1
    baseline:
      kept_ratio: '1.0'
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  - id: restore_yield_basis
    effect: parameter
    decides: restore_yield
    bindings:
    - ref_guar
    - ref_tu_date
    - ref_tu_kwh
    - restore_yield
    ladder:
    - when: the household share's latest annual true-up assessed a guarantee
      value: the household share's design output per kW
    - when: that true-up assessed no guarantee and was completed within the last twelve whole months
      value: that true-up's credited_kwh_12m divided by allocation_kw
    - when: otherwise
      value: the household share's twelve-month output per kW (standard method)
    baseline:
      restore_yield: hh_kwh12 / ref_alloc
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  baseline:
    rule: The restored size is the closed share's prior output divided by the restore yield, sized down to a whole multiple of increment_kw. The closed share's prior output is the net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted on the closed share in the last N whole months, N being twelve plus the number of whole months from its closed_date to today. The restore yield is the household share's net credited kWh of the credit statements posted in the last twelve whole months divided by its allocation_kw. The request is set to the lesser of the reservation's current requested_kw and the restored size, rounded to two decimals.
    params:
    - increment_kw
  inputs:
    history:
    - category: home
      table: home_credits
      aggregate: sum
      field: credited_kwh
      within_months: 15
      filters:
        event_type: home_credit_posted
    - category: home
      table: home_reviews
      aggregate: latest
      field: credited_kwh_12m
      within_months: 120
      filters: {}
    - category: home
      table: home_allocations
      aggregate: sum
      field: kw
      within_months: 120
      filters:
        filing_reason: move_removal
    cross_category:
    - home
- id: waitlist_ext_relocation_offer_estimate
  base_policy_refs:
  - waitlist_queue_order
  - waitlist_agg_account_headroom
  - waitlist_evt_offer_terms
  overwrite:
  - base_policy: waitlist_evt_offer_terms
    superseded_clause: estimated_annual_kwh is offered_kw multiplied by the project's expected_yield_kwh_per_kw and estimate_years, rounded half up to a whole kWh.
    replaced_by: 'For a full Relocation Priority offer that this policy settles, and only for such an offer, the relocation first-year kWh estimate is taken from the household share''s own record as set out here; a full Residential Standard or Residential Add-On offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_kwh is offered_kw multiplied by the project''s expected_yield_kwh_per_kw and estimate_years, rounded half up to a whole kWh.'
  - base_policy: waitlist_evt_offer_terms
    superseded_clause: estimated_annual_savings is estimated_annual_kwh multiplied by the project's est_credit_rate_per_kwh and by the offered plan's savings_rate_pct divided by 100 on percent-savings plans, or by the amount the project's est_credit_rate_per_kwh exceeds the plan's fixed_rate_per_kwh on fixed-rate plans (0.00 when it does not), rounded half up to the cent; it is an estimate and never a promise.
    replaced_by: 'For the same full Relocation Priority offers, and only for them, the savings estimate is figured from the relocation first-year kWh estimate and the relocation credit value per kWh as set out here; a full Residential Standard or Residential Add-On offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_savings is estimated_annual_kwh multiplied by the project''s est_credit_rate_per_kwh and by the offered plan''s savings_rate_pct divided by 100 on percent-savings plans, or by the amount the project''s est_credit_rate_per_kwh exceeds the plan''s fixed_rate_per_kwh on fixed-rate plans (0.00 when it does not), rounded half up to the cent; it is an estimate and never a promise.'
  trigger: state_due
  subject:
  - waitlist_offer_extended
  - waitlist_offer_made
  computes: estimated_annual_savings
  target_tool: extend_relocation_offer_f94b15ad
  params: {}
  rule: 'This policy settles the estimate written on a full offer to a Relocation Priority reservation (offered kW equal to the requested kW, the project capacity available to the reservation and the account headroom on the offer date both covering it) whose requested_plan is the plan of the customer''s Residential Community Solar Subscription closed with closure_reason moved_out_of_territory, when the customer also holds exactly one active Residential Community Solar Subscription on the offered project, under another utility account, with at least one credit statement posted on it in the last twelve whole months (the household share); it applies to such an offer and only to such an offer. A Relocation Priority offer and its estimate are fixed only after the reservation''s requested kW is no more than the restored size of the household''s closed share. Such a Relocation Priority offer is made for the reservation''s requested kW. The relocation first-year kWh estimate is the offered kW multiplied by the relocation output per kW and by estimate_years, rounded half up to a whole kWh. The relocation output per kW is the relocation annual output figure divided by the household share''s allocation_kw. The relocation annual output figure is the net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted on the household share in the last twelve whole months. The relocation first-year savings estimate is the rounded relocation first-year kWh estimate multiplied by the relocation credit value per kWh and by the requested plan''s savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise. The relocation credit value per kWh is the net credit value (credit value posted less credit value reversed) of the credit statements posted on the household share in the last twelve whole months divided by their net credited kWh. For the relocation figures, a count of whole months between two dates is the difference between their calendar months, less one when the later date''s day of the month is earlier than the earlier date''s; a statement line, filing, offer or true-up falls in the last N whole months when fewer than N whole months separate its date (posted_date, effective_date, offer_date or review_date) from today, and was completed N whole months ago when exactly N whole months separate its review_date from today. The relocation adjustments below act in this order: a figure that replaces the relocation annual output figure is taken first and the floor on it is applied next; the relocation output per kW is then formed from the floored figure and the blend is applied to it before the relocation first-year kWh estimate is rounded; a figure that replaces the relocation credit value per kWh is taken first, the trend multiplier is applied to it next, before it multiplies the rounded estimate. Relocation output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the relocation annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method. Relocation guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the relocation annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies. Relocation young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the relocation output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the relocation output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100. Relocation credit value by recency: where the household share''s latest annual true-up was completed within the last six whole months, the relocation credit value per kWh is that true-up''s avg_credit_rate; where it was completed six to eleven whole months ago and the credit statements posted on the household share in the last N whole months, N being the number of whole months from that true-up''s review_date to today, carry a net credited kWh above 0, it is the net credit value of those statements divided by their net credited kWh; otherwise it is the twelve-month figure of the standard method. Relocation credit-rate trend: where the true-up of the contract year before the household share''s latest annual true-up was completed within the last 24 whole months, the relocation credit value per kWh is multiplied by the latest true-up''s avg_credit_rate divided by that earlier true-up''s avg_credit_rate, the multiplier kept between 0.95 and 1.05; where that earlier true-up was completed 24 to 35 whole months ago, it is multiplied by 1 plus half of the amount by which that ratio differs from 1, the multiplier kept between 0.95 and 1.05; where there is no such earlier true-up or it was completed 36 or more whole months ago, it is multiplied by 1. For a full Relocation Priority offer that this policy settles, and only for such an offer, the relocation first-year kWh estimate is taken from the household share''s own record as set out here; a full Residential Standard or Residential Add-On offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_kwh is offered_kw multiplied by the project''s expected_yield_kwh_per_kw and estimate_years, rounded half up to a whole kWh. For the same full Relocation Priority offers, and only for them, the savings estimate is figured from the relocation first-year kWh estimate and the relocation credit value per kWh as set out here; a full Residential Standard or Residential Add-On offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_savings is estimated_annual_kwh multiplied by the project''s est_credit_rate_per_kwh and by the offered plan''s savings_rate_pct divided by 100 on percent-savings plans, or by the amount the project''s est_credit_rate_per_kwh exceeds the plan''s fixed_rate_per_kwh on fixed-rate plans (0.00 when it does not), rounded half up to the cent; it is an estimate and never a promise.'
  prerequisite:
  - problem: waitlist_ext_relocation_restore_size
    kind: value_input
    gate: offered_kw
    form: state
    policy_source: A Relocation Priority offer and its estimate are fixed only after the reservation's requested kW is no more than the restored size of the household's closed share.
    condition: The Relocation Priority reservation's requested_kw is no more than the restored size its closed share gives under the restore rule.
    resolved_by: set_relocation_request_cdb5c762
    effect: The offered kW (the reservation's requested_kw) falls to the restored size, so the first-year kWh and savings estimates are figured on that size.
  cross_category:
  - category: home
    as: history
    reads:
    - home_sub_id
    - allocation_kw
    - status
    - project_id
    - utility_account_id
    - variant_name
    - home_credits.credited_kwh
    - home_credits.credit_value
    - home_credits.posted_date
    - home_reviews.credited_kwh_12m
    - home_reviews.avg_credit_rate
    - home_reviews.guaranteed_kwh
    - home_reviews.shortfall_kwh
    - home_reviews.review_date
    - home_reviews.contract_year
    note: Every factor reads the household share on the offered project (statements, true-ups, plan).
  compute:
  - ref_sid: CFIELD('home','home_sub_id', project_id=F('project_id'), status='active')
  - ref_alloc: CFIELD('home','allocation_kw', home_sub_id=ref_sid)
  - ref_pct: CPARAM('home','production_guarantee_pct', home_sub_id=ref_sid)
  - tu_date: XLATEST('home','home_reviews','review_date', date_field='review_date', home_sub_id=ref_sid)
  - tu_kwh: XLATEST('home','home_reviews','credited_kwh_12m', date_field='review_date', home_sub_id=ref_sid)
  - tu_rate: XLATEST('home','home_reviews','avg_credit_rate', date_field='review_date', home_sub_id=ref_sid)
  - tu_guar: XLATEST('home','home_reviews','guaranteed_kwh', date_field='review_date', home_sub_id=ref_sid)
  - tu_cy: XLATEST('home','home_reviews','contract_year', date_field='review_date', home_sub_id=ref_sid)
  - tu_age: MONTHS(tu_date, NOW) if tu_date else 999
  - n_stmt: XCOUNT('home','home_credits', event_type='home_credit_posted', home_sub_id=ref_sid)
  - kwh12: XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)
  - val12: XSUM('home','home_credits','credit_value', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credit_value', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)
  - kwh_all: XSUM('home','home_credits','credited_kwh', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credited_kwh', event_type='home_credit_reversed', home_sub_id=ref_sid)
  - out_kwh: tu_kwh if (tu_date and tu_age < 12) else (kwh_all * 12 / n_stmt if (n_stmt < 12 and not tu_date) else kwh12)
  - tu_short: XLATEST('home','home_reviews','shortfall_kwh', date_field='review_date', home_sub_id=ref_sid)
  - prev_short: XLATEST('home','home_reviews','shortfall_kwh', date_field='review_date', contract_year=(tu_cy or 0) - 1, home_sub_id=ref_sid)
  - floor_kwh: tu_guar if (tu_date and tu_age < 12 and (tu_short or 0) > 0 and (prev_short or 0) > 0) else ((tu_kwh + tu_guar) / 2 if (tu_date and tu_age < 12 and (tu_short or 0) > 0) else 0)
  - blend_lines: XCOUNT('home','home_credits', event_type='home_credit_posted', home_sub_id=ref_sid)
  - design_kw: tu_guar / ref_alloc / (ref_pct / 100) if ((tu_guar or 0) > 0 and (ref_pct or 0) > 0) else 0
  - blend_w: 0.5 if (blend_lines < 24 and (tu_guar or 0) > 0) else (0.75 if (blend_lines >= 24 and blend_lines < 36 and (tu_guar or 0) > 0) else 1.0)
  - kwh_since: (XSUM('home','home_credits','credited_kwh', within_months=tu_age, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credited_kwh', within_months=tu_age, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)) if (tu_date and tu_age < 12) else 0
  - val_since: (XSUM('home','home_credits','credit_value', within_months=tu_age, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credit_value', within_months=tu_age, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)) if (tu_date and tu_age < 12) else 0
  - value_kwh: tu_rate if (tu_date and tu_age < 6) else (val_since / kwh_since if (tu_date and tu_age >= 6 and tu_age < 12 and kwh_since > 0) else val12 / kwh12)
  - prev_rate: XLATEST('home','home_reviews','avg_credit_rate', date_field='review_date', contract_year=(tu_cy or 0) - 1, home_sub_id=ref_sid)
  - prev_date: XLATEST('home','home_reviews','review_date', date_field='review_date', contract_year=(tu_cy or 0) - 1, home_sub_id=ref_sid)
  - prev_age: MONTHS(prev_date, NOW) if prev_date else 999
  - trend: MN(1.05, MX(0.95, tu_rate / prev_rate)) if prev_age < 24 else (MN(1.05, MX(0.95, 1 + (tu_rate / prev_rate - 1) / 2)) if prev_age < 36 else 1.0)
  - out_per_kw: MX(out_kwh, floor_kwh) / ref_alloc
  - per_kw: blend_w * out_per_kw + (1 - blend_w) * design_kw
  - offered_kw: F('requested_kw')
  - est_kwh: RND(offered_kw * per_kw * P('estimate_years') + 0.000000001, 0)
  - value_used: value_kwh * trend
  - plan_pct: CPARAM('home','savings_rate_pct', variant_name=F('requested_plan'))
  - result: RND(est_kwh * value_used * plan_pct / 100 + 0.000000001, 2)
  compute_basis:
    ref_sid: This policy settles the estimate written on a full offer to a Relocation Priority reservation (offered kW equal to the requested kW, the project capacity available to the reservation and the account headroom on the offer date both covering it) whose requested_plan is the plan of the customer's Residential Community Solar Subscription closed with closure_reason moved_out_of_territory, when the customer also holds exactly one active Residential Community Solar Subscription on the offered project, under another utility account, with at least one credit statement posted on it in the last twelve whole months (the household share); it applies to such an offer and only to such an offer.
    ref_alloc: The relocation output per kW is the relocation annual output figure divided by the household share's allocation_kw.
    ref_pct: 'Relocation young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the relocation output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the relocation output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100.'
    tu_date: 'Relocation output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the relocation annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method.'
    tu_kwh: 'Relocation output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the relocation annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method.'
    tu_rate: 'Relocation credit value by recency: where the household share''s latest annual true-up was completed within the last six whole months, the relocation credit value per kWh is that true-up''s avg_credit_rate; where it was completed six to eleven whole months ago and the credit statements posted on the household share in the last N whole months, N being the number of whole months from that true-up''s review_date to today, carry a net credited kWh above 0, it is the net credit value of those statements divided by their net credited kWh; otherwise it is the twelve-month figure of the standard method.'
    tu_guar: 'Relocation guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the relocation annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    tu_cy: 'Relocation guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the relocation annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    tu_age: For the relocation figures, a count of whole months between two dates is the difference between their calendar months, less one when the later date's day of the month is earlier than the earlier date's; a statement line, filing, offer or true-up falls in the last N whole months when fewer than N whole months separate its date (posted_date, effective_date, offer_date or review_date) from today, and was completed N whole months ago when exactly N whole months separate its review_date from today.
    n_stmt: 'Relocation output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the relocation annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method.'
    kwh12: The relocation annual output figure is the net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted on the household share in the last twelve whole months.
    val12: The relocation credit value per kWh is the net credit value (credit value posted less credit value reversed) of the credit statements posted on the household share in the last twelve whole months divided by their net credited kWh.
    kwh_all: 'Relocation output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the relocation annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method.'
    out_kwh: 'Relocation output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the relocation annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method.'
    tu_short: 'Relocation guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the relocation annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    prev_short: 'Relocation guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the relocation annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    floor_kwh: 'Relocation guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the relocation annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies.'
    blend_lines: 'Relocation young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the relocation output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the relocation output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100.'
    design_kw: 'Relocation young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the relocation output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the relocation output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100.'
    blend_w: 'Relocation young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the relocation output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the relocation output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100.'
    kwh_since: 'Relocation credit value by recency: where the household share''s latest annual true-up was completed within the last six whole months, the relocation credit value per kWh is that true-up''s avg_credit_rate; where it was completed six to eleven whole months ago and the credit statements posted on the household share in the last N whole months, N being the number of whole months from that true-up''s review_date to today, carry a net credited kWh above 0, it is the net credit value of those statements divided by their net credited kWh; otherwise it is the twelve-month figure of the standard method.'
    val_since: 'Relocation credit value by recency: where the household share''s latest annual true-up was completed within the last six whole months, the relocation credit value per kWh is that true-up''s avg_credit_rate; where it was completed six to eleven whole months ago and the credit statements posted on the household share in the last N whole months, N being the number of whole months from that true-up''s review_date to today, carry a net credited kWh above 0, it is the net credit value of those statements divided by their net credited kWh; otherwise it is the twelve-month figure of the standard method.'
    value_kwh: 'Relocation credit value by recency: where the household share''s latest annual true-up was completed within the last six whole months, the relocation credit value per kWh is that true-up''s avg_credit_rate; where it was completed six to eleven whole months ago and the credit statements posted on the household share in the last N whole months, N being the number of whole months from that true-up''s review_date to today, carry a net credited kWh above 0, it is the net credit value of those statements divided by their net credited kWh; otherwise it is the twelve-month figure of the standard method.'
    prev_rate: 'Relocation credit-rate trend: where the true-up of the contract year before the household share''s latest annual true-up was completed within the last 24 whole months, the relocation credit value per kWh is multiplied by the latest true-up''s avg_credit_rate divided by that earlier true-up''s avg_credit_rate, the multiplier kept between 0.95 and 1.05; where that earlier true-up was completed 24 to 35 whole months ago, it is multiplied by 1 plus half of the amount by which that ratio differs from 1, the multiplier kept between 0.95 and 1.05; where there is no such earlier true-up or it was completed 36 or more whole months ago, it is multiplied by 1.'
    prev_date: 'Relocation credit-rate trend: where the true-up of the contract year before the household share''s latest annual true-up was completed within the last 24 whole months, the relocation credit value per kWh is multiplied by the latest true-up''s avg_credit_rate divided by that earlier true-up''s avg_credit_rate, the multiplier kept between 0.95 and 1.05; where that earlier true-up was completed 24 to 35 whole months ago, it is multiplied by 1 plus half of the amount by which that ratio differs from 1, the multiplier kept between 0.95 and 1.05; where there is no such earlier true-up or it was completed 36 or more whole months ago, it is multiplied by 1.'
    prev_age: 'Relocation credit-rate trend: where the true-up of the contract year before the household share''s latest annual true-up was completed within the last 24 whole months, the relocation credit value per kWh is multiplied by the latest true-up''s avg_credit_rate divided by that earlier true-up''s avg_credit_rate, the multiplier kept between 0.95 and 1.05; where that earlier true-up was completed 24 to 35 whole months ago, it is multiplied by 1 plus half of the amount by which that ratio differs from 1, the multiplier kept between 0.95 and 1.05; where there is no such earlier true-up or it was completed 36 or more whole months ago, it is multiplied by 1.'
    trend: 'Relocation credit-rate trend: where the true-up of the contract year before the household share''s latest annual true-up was completed within the last 24 whole months, the relocation credit value per kWh is multiplied by the latest true-up''s avg_credit_rate divided by that earlier true-up''s avg_credit_rate, the multiplier kept between 0.95 and 1.05; where that earlier true-up was completed 24 to 35 whole months ago, it is multiplied by 1 plus half of the amount by which that ratio differs from 1, the multiplier kept between 0.95 and 1.05; where there is no such earlier true-up or it was completed 36 or more whole months ago, it is multiplied by 1.'
    out_per_kw: 'The relocation adjustments below act in this order: a figure that replaces the relocation annual output figure is taken first and the floor on it is applied next; the relocation output per kW is then formed from the floored figure and the blend is applied to it before the relocation first-year kWh estimate is rounded; a figure that replaces the relocation credit value per kWh is taken first, the trend multiplier is applied to it next, before it multiplies the rounded estimate.'
    per_kw: 'The relocation adjustments below act in this order: a figure that replaces the relocation annual output figure is taken first and the floor on it is applied next; the relocation output per kW is then formed from the floored figure and the blend is applied to it before the relocation first-year kWh estimate is rounded; a figure that replaces the relocation credit value per kWh is taken first, the trend multiplier is applied to it next, before it multiplies the rounded estimate.'
    offered_kw: Such a Relocation Priority offer is made for the reservation's requested kW.
    est_kwh: The relocation first-year kWh estimate is the offered kW multiplied by the relocation output per kW and by estimate_years, rounded half up to a whole kWh.
    value_used: 'The relocation adjustments below act in this order: a figure that replaces the relocation annual output figure is taken first and the floor on it is applied next; the relocation output per kW is then formed from the floored figure and the blend is applied to it before the relocation first-year kWh estimate is rounded; a figure that replaces the relocation credit value per kWh is taken first, the trend multiplier is applied to it next, before it multiplies the rounded estimate.'
    plan_pct: The relocation first-year savings estimate is the rounded relocation first-year kWh estimate multiplied by the relocation credit value per kWh and by the requested plan's savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise.
    result: The relocation first-year savings estimate is the rounded relocation first-year kWh estimate multiplied by the relocation credit value per kWh and by the requested plan's savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise.
  factors:
  - id: output_history_basis
    effect: method
    decides: out_kwh
    bindings:
    - kwh_all
    - out_kwh
    ladder:
    - when: the household share's latest annual true-up was completed within the last twelve whole months
      method: the relocation annual output figure is that true-up's credited_kwh_12m
    - when: the household share has no annual true-up and carries fewer than twelve posted lines
      method: net credited kWh of all its statements times twelve divided by the number of posted lines
    - when: otherwise (latest true-up completed twelve or more whole months ago, or no true-up and twelve or more posted lines)
      method: net credited kWh of the statements posted in the last twelve whole months (standard method)
    baseline:
      out_kwh: kwh12
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  - id: guarantee_output_floor
    effect: parameter
    decides: floor_kwh
    bindings:
    - tu_short
    - prev_short
    - floor_kwh
    ladder:
    - when: the latest annual true-up was completed within the last twelve whole months with a shortfall_kwh above 0 and the true-up of the contract year before it also recorded a shortfall_kwh above 0
      value: that latest true-up's guaranteed_kwh
    - when: the latest annual true-up was completed within the last twelve whole months with a shortfall_kwh above 0 and the earlier true-up recorded none or does not exist
      value: half the sum of that latest true-up's credited_kwh_12m and guaranteed_kwh
    - when: otherwise (no true-up, latest completed twelve or more whole months ago, or no shortfall)
      value: 0 (no floor)
    baseline:
      floor_kwh: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  - id: young_share_blend
    effect: parameter
    decides: blend_w
    bindings:
    - blend_lines
    - design_kw
    - blend_w
    ladder:
    - when: fewer than 24 posted credit statement lines and the latest annual true-up assessed a guarantee
      value: '0.50'
    - when: 24 to 35 posted credit statement lines and the latest annual true-up assessed a guarantee
      value: '0.75'
    - when: otherwise (36 or more lines, or no guarantee assessed, or no true-up)
      value: 1.00 (unblended)
    baseline:
      blend_w: '1.0'
    evidence:
    - history
    - cross_category
    - tier_param
    cross_difficulty: home
  - id: credit_value_recency
    effect: method
    decides: value_kwh
    bindings:
    - kwh_since
    - val_since
    - value_kwh
    ladder:
    - when: the latest annual true-up was completed within the last six whole months
      method: that true-up's avg_credit_rate
    - when: the latest annual true-up was completed six to eleven whole months ago and the statements posted in the whole months since its review_date carry a net credited kWh above 0
      method: net credit value divided by net credited kWh of those statements
    - when: otherwise (no true-up, completed twelve or more whole months ago, or no net kWh since)
      method: the twelve-month credit value per kWh (standard method)
    baseline:
      value_kwh: val12 / kwh12
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  - id: credit_rate_trend
    effect: parameter
    decides: trend
    bindings:
    - prev_rate
    - prev_date
    - prev_age
    - trend
    ladder:
    - when: the true-up of the contract year before the latest one was completed within the last 24 whole months
      value: the latest avg_credit_rate divided by the earlier one, kept between 0.95 and 1.05
    - when: that earlier true-up was completed 24 to 35 whole months ago
      value: 1 plus half of that ratio's difference from 1, kept between 0.95 and 1.05
    - when: otherwise (no such earlier true-up, or completed 36 or more whole months ago)
      value: '1'
    baseline:
      trend: '1.0'
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  baseline:
    rule: Such a Relocation Priority offer is made for the reservation's requested kW. The relocation first-year kWh estimate is the offered kW multiplied by the relocation output per kW and by estimate_years, rounded half up to a whole kWh. The relocation output per kW is the relocation annual output figure divided by the household share's allocation_kw. The relocation annual output figure is the net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted on the household share in the last twelve whole months. The relocation first-year savings estimate is the rounded relocation first-year kWh estimate multiplied by the relocation credit value per kWh and by the requested plan's savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise. The relocation credit value per kWh is the net credit value (credit value posted less credit value reversed) of the credit statements posted on the household share in the last twelve whole months divided by their net credited kWh.
    params:
    - estimate_years
  inputs:
    history:
    - category: home
      table: home_credits
      aggregate: sum
      field: credited_kwh
      within_months: 12
      filters:
        event_type: home_credit_posted
    - category: home
      table: home_credits
      aggregate: sum
      field: credit_value
      within_months: 12
      filters:
        event_type: home_credit_posted
    - category: home
      table: home_reviews
      aggregate: latest
      field: credited_kwh_12m
      within_months: 120
      filters: {}
    cross_category:
    - home
- id: waitlist_ext_standard_request_fit
  base_policy_refs:
  - waitlist_agg_account_headroom
  - waitlist_request_changes
  overwrite: []
  trigger: on_request
  subject:
  - waitlist_request_updated
  computes: requested_kw
  target_tool: fit_standard_request_b636e3b6
  params: {}
  rule: 'When the subscriber asks to fit a Residential Standard reservation to the usage room of its utility account, the request is set as worked out here. This applies to a Residential Standard reservation whose utility account holds exactly one active Residential Community Solar Subscription, on another project, whose plan carries a production guarantee and which has at least one annual true-up (the account share), and whose customer holds exactly one active Residential Community Solar Subscription on the reservation''s project, under another utility account, with at least one credit statement posted on it in the last twelve whole months (the household share), when the standard fitted size is at least min_requested_kw and the request so set is within the account headroom of waitlist_agg_account_headroom, and only to such a reservation; a change to any other reservation follows the base rule. The standard usage room is the standard usage figure less the standard existing output, divided by the standard target yield, and never below 0; the standard fitted size is the standard usage room sized down to a whole multiple of increment_kw. The standard usage figure is the usage_kwh_12m of the account share''s latest annual true-up. The standard existing output is the account share''s expected annual production: its latest annual true-up''s guaranteed_kwh divided by the account share''s plan''s production_guarantee_pct divided by 100. The standard target yield is the household share''s net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted in the last twelve whole months divided by its allocation_kw. When the subscriber asks to fit the request, the requested kW is set to the lesser of the reservation''s current requested_kw and the standard fitted size, rounded to two decimals. For the standard fit, a count of whole months between two dates is the difference between their calendar months, less one when the later date''s day of the month is earlier than the earlier date''s; a statement line, filing, offer or true-up falls in the last N whole months when fewer than N whole months separate its date (posted_date, effective_date, offer_date or review_date) from today, and was completed N whole months ago when exactly N whole months separate its review_date from today. The standard adjustments below act in this order: a figure that replaces the standard usage figure is taken first; the standard banking margin multiplies the usage figure next; a figure that replaces the standard existing output is taken first and the standard kept-share multiplier applies to it next; a figure that replaces the standard target yield is taken; the standard usage room is then formed from these figures and only then sized down. Standard usage averaging: where three or more annual true-ups of the account share were completed in the last 36 whole months, the standard usage figure is the average of their usage_kwh_12m; where fewer than three were completed in the last 36 whole months and exactly two in the last 24 whole months, it is the average of those two; otherwise it is the figure of the standard method. Standard banking margin: where the account share carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the standard usage figure is multiplied by 0.90; where it carries one to three such lines, by 0.95; otherwise by 1. Standard existing output by record: where the account share''s latest annual true-up recorded a shortfall_kwh above 0, the standard existing output is that true-up''s credited_kwh_12m; where that true-up assessed no guarantee (guaranteed_kwh 0), it is the account share''s net credited kWh of the credit statements posted in the last twelve whole months; otherwise it is the figure of the standard method. Standard kept-share multiplier: where the account share''s latest annual true-up recorded a resize_kw above 0, the standard existing output is multiplied by the account share''s allocation_kw divided by that allocation_kw plus the resize_kw; where that true-up recorded no resize and subscriber_increase filings on the account share took effect in the last N whole months, N being the number of whole months from that true-up''s review_date to today, it is multiplied by the allocation_kw divided by the allocation_kw less the kW of those filings; otherwise it is multiplied by 1. Standard target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the standard target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
  prerequisite: []
  cross_category:
  - category: home
    as: history
    reads:
    - home_sub_id
    - allocation_kw
    - status
    - project_id
    - utility_account_id
    - variant_name
    - home_credits.credited_kwh
    - home_credits.posted_date
    - home_reviews.usage_kwh_12m
    - home_reviews.guaranteed_kwh
    - home_reviews.shortfall_kwh
    - home_reviews.credited_kwh_12m
    - home_reviews.review_date
    - home_credits.banked_value
    - home_reviews.resize_kw
    - home_allocations.kw
    - home_allocations.effective_date
    - home_allocations.filing_reason
    note: Every factor reads the Residential share on the reservation's account or the household share on its project.
  compute:
  - acct_sid: CFIELD('home','home_sub_id', utility_account_id=F('utility_account_id'), status='active')
  - acct_pct: CPARAM('home','production_guarantee_pct', home_sub_id=acct_sid)
  - a_tu_usage: XLATEST('home','home_reviews','usage_kwh_12m', date_field='review_date', home_sub_id=acct_sid)
  - a_tu_guar: XLATEST('home','home_reviews','guaranteed_kwh', date_field='review_date', home_sub_id=acct_sid)
  - hh_sid: CFIELD('home','home_sub_id', project_id=F('project_id'), status='active')
  - hh_alloc: CFIELD('home','allocation_kw', home_sub_id=hh_sid)
  - hh_kwh12: XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=hh_sid) - XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=hh_sid)
  - n36: XCOUNT('home','home_reviews', within_months=36, date_field='review_date', home_sub_id=acct_sid)
  - n24: XCOUNT('home','home_reviews', within_months=24, date_field='review_date', home_sub_id=acct_sid)
  - usage_fig: XSUM('home','home_reviews','usage_kwh_12m', within_months=36, date_field='review_date', home_sub_id=acct_sid) / n36 if n36 >= 3 else (XSUM('home','home_reviews','usage_kwh_12m', within_months=24, date_field='review_date', home_sub_id=acct_sid) / 2 if n24 == 2 else a_tu_usage)
  - m_lines: XCOUNT('home','home_credits', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=acct_sid)
  - m_unbanked: XCOUNT('home','home_credits', within_months=12, date_field='posted_date', event_type='home_credit_posted', banked_value=0.0, home_sub_id=acct_sid)
  - margin: 0.9 if m_lines - m_unbanked >= 4 else (0.95 if m_lines - m_unbanked >= 1 else 1.0)
  - a_tu_short: XLATEST('home','home_reviews','shortfall_kwh', date_field='review_date', home_sub_id=acct_sid)
  - a_tu_kwh: XLATEST('home','home_reviews','credited_kwh_12m', date_field='review_date', home_sub_id=acct_sid)
  - a_kwh12: XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=acct_sid) - XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=acct_sid)
  - existing: a_tu_kwh if (a_tu_short or 0) > 0 else (a_kwh12 if (a_tu_guar or 0) == 0 else a_tu_guar / (acct_pct / 100))
  - acct_alloc: CFIELD('home','allocation_kw', home_sub_id=acct_sid)
  - a_tu_date: XLATEST('home','home_reviews','review_date', date_field='review_date', home_sub_id=acct_sid)
  - a_resize: XLATEST('home','home_reviews','resize_kw', date_field='review_date', home_sub_id=acct_sid)
  - a_inc: XSUM('home','home_allocations','kw', within_months=MONTHS(a_tu_date, NOW), date_field='effective_date', event_type='home_allocation_filed', filing_reason='subscriber_increase', home_sub_id=acct_sid) if a_tu_date else 0
  - kept: acct_alloc / (acct_alloc + a_resize) if (a_resize or 0) > 0 else (acct_alloc / (acct_alloc - a_inc) if a_inc > 0 else 1.0)
  - o_recent: COUNT('waitlist_offers', within_months=12, date_field='offer_date', project_id=F('project_id'))
  - o_date: LATEST('waitlist_offers','offer_date', date_field='offer_date', project_id=F('project_id'))
  - o_kw: MAX('waitlist_offers','offered_kw', offer_date=o_date, project_id=F('project_id'))
  - o_kwh: MAX('waitlist_offers','estimated_annual_kwh', offer_date=o_date, offered_kw=o_kw, project_id=F('project_id'))
  - hh_tu_date: XLATEST('home','home_reviews','review_date', date_field='review_date', home_sub_id=hh_sid)
  - hh_tu_kwh: XLATEST('home','home_reviews','credited_kwh_12m', date_field='review_date', home_sub_id=hh_sid)
  - target: o_kwh / o_kw / P('estimate_years') if o_recent > 0 else (hh_tu_kwh / hh_alloc if (hh_tu_date and MONTHS(hh_tu_date, NOW) < 12) else hh_kwh12 / hh_alloc)
  - room: MX(0, usage_fig * margin - existing * kept) / target
  - fitted: int(room / P('increment_kw') + 0.000000001) * P('increment_kw')
  - result: RND(MN(F('requested_kw'), fitted) + 0.000000001, 2)
  compute_basis:
    acct_sid: When the subscriber asks to fit a Residential Standard reservation to the usage room of its utility account, the request is set as worked out here. This applies to a Residential Standard reservation whose utility account holds exactly one active Residential Community Solar Subscription, on another project, whose plan carries a production guarantee and which has at least one annual true-up (the account share), and whose customer holds exactly one active Residential Community Solar Subscription on the reservation's project, under another utility account, with at least one credit statement posted on it in the last twelve whole months (the household share), when the standard fitted size is at least min_requested_kw and the request so set is within the account headroom of waitlist_agg_account_headroom, and only to such a reservation; a change to any other reservation follows the base rule.
    acct_pct: 'The standard existing output is the account share''s expected annual production: its latest annual true-up''s guaranteed_kwh divided by the account share''s plan''s production_guarantee_pct divided by 100.'
    a_tu_usage: The standard usage figure is the usage_kwh_12m of the account share's latest annual true-up.
    a_tu_guar: 'The standard existing output is the account share''s expected annual production: its latest annual true-up''s guaranteed_kwh divided by the account share''s plan''s production_guarantee_pct divided by 100.'
    hh_sid: When the subscriber asks to fit a Residential Standard reservation to the usage room of its utility account, the request is set as worked out here. This applies to a Residential Standard reservation whose utility account holds exactly one active Residential Community Solar Subscription, on another project, whose plan carries a production guarantee and which has at least one annual true-up (the account share), and whose customer holds exactly one active Residential Community Solar Subscription on the reservation's project, under another utility account, with at least one credit statement posted on it in the last twelve whole months (the household share), when the standard fitted size is at least min_requested_kw and the request so set is within the account headroom of waitlist_agg_account_headroom, and only to such a reservation; a change to any other reservation follows the base rule.
    hh_alloc: The standard target yield is the household share's net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted in the last twelve whole months divided by its allocation_kw.
    hh_kwh12: The standard target yield is the household share's net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted in the last twelve whole months divided by its allocation_kw.
    n36: 'Standard usage averaging: where three or more annual true-ups of the account share were completed in the last 36 whole months, the standard usage figure is the average of their usage_kwh_12m; where fewer than three were completed in the last 36 whole months and exactly two in the last 24 whole months, it is the average of those two; otherwise it is the figure of the standard method.'
    n24: 'Standard usage averaging: where three or more annual true-ups of the account share were completed in the last 36 whole months, the standard usage figure is the average of their usage_kwh_12m; where fewer than three were completed in the last 36 whole months and exactly two in the last 24 whole months, it is the average of those two; otherwise it is the figure of the standard method.'
    usage_fig: 'Standard usage averaging: where three or more annual true-ups of the account share were completed in the last 36 whole months, the standard usage figure is the average of their usage_kwh_12m; where fewer than three were completed in the last 36 whole months and exactly two in the last 24 whole months, it is the average of those two; otherwise it is the figure of the standard method.'
    m_lines: 'Standard banking margin: where the account share carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the standard usage figure is multiplied by 0.90; where it carries one to three such lines, by 0.95; otherwise by 1.'
    m_unbanked: 'Standard banking margin: where the account share carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the standard usage figure is multiplied by 0.90; where it carries one to three such lines, by 0.95; otherwise by 1.'
    margin: 'Standard banking margin: where the account share carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the standard usage figure is multiplied by 0.90; where it carries one to three such lines, by 0.95; otherwise by 1.'
    a_tu_short: 'Standard existing output by record: where the account share''s latest annual true-up recorded a shortfall_kwh above 0, the standard existing output is that true-up''s credited_kwh_12m; where that true-up assessed no guarantee (guaranteed_kwh 0), it is the account share''s net credited kWh of the credit statements posted in the last twelve whole months; otherwise it is the figure of the standard method.'
    a_tu_kwh: 'Standard existing output by record: where the account share''s latest annual true-up recorded a shortfall_kwh above 0, the standard existing output is that true-up''s credited_kwh_12m; where that true-up assessed no guarantee (guaranteed_kwh 0), it is the account share''s net credited kWh of the credit statements posted in the last twelve whole months; otherwise it is the figure of the standard method.'
    a_kwh12: 'Standard existing output by record: where the account share''s latest annual true-up recorded a shortfall_kwh above 0, the standard existing output is that true-up''s credited_kwh_12m; where that true-up assessed no guarantee (guaranteed_kwh 0), it is the account share''s net credited kWh of the credit statements posted in the last twelve whole months; otherwise it is the figure of the standard method.'
    existing: 'Standard existing output by record: where the account share''s latest annual true-up recorded a shortfall_kwh above 0, the standard existing output is that true-up''s credited_kwh_12m; where that true-up assessed no guarantee (guaranteed_kwh 0), it is the account share''s net credited kWh of the credit statements posted in the last twelve whole months; otherwise it is the figure of the standard method.'
    acct_alloc: 'Standard kept-share multiplier: where the account share''s latest annual true-up recorded a resize_kw above 0, the standard existing output is multiplied by the account share''s allocation_kw divided by that allocation_kw plus the resize_kw; where that true-up recorded no resize and subscriber_increase filings on the account share took effect in the last N whole months, N being the number of whole months from that true-up''s review_date to today, it is multiplied by the allocation_kw divided by the allocation_kw less the kW of those filings; otherwise it is multiplied by 1.'
    a_tu_date: 'Standard kept-share multiplier: where the account share''s latest annual true-up recorded a resize_kw above 0, the standard existing output is multiplied by the account share''s allocation_kw divided by that allocation_kw plus the resize_kw; where that true-up recorded no resize and subscriber_increase filings on the account share took effect in the last N whole months, N being the number of whole months from that true-up''s review_date to today, it is multiplied by the allocation_kw divided by the allocation_kw less the kW of those filings; otherwise it is multiplied by 1.'
    a_resize: 'Standard kept-share multiplier: where the account share''s latest annual true-up recorded a resize_kw above 0, the standard existing output is multiplied by the account share''s allocation_kw divided by that allocation_kw plus the resize_kw; where that true-up recorded no resize and subscriber_increase filings on the account share took effect in the last N whole months, N being the number of whole months from that true-up''s review_date to today, it is multiplied by the allocation_kw divided by the allocation_kw less the kW of those filings; otherwise it is multiplied by 1.'
    a_inc: 'Standard kept-share multiplier: where the account share''s latest annual true-up recorded a resize_kw above 0, the standard existing output is multiplied by the account share''s allocation_kw divided by that allocation_kw plus the resize_kw; where that true-up recorded no resize and subscriber_increase filings on the account share took effect in the last N whole months, N being the number of whole months from that true-up''s review_date to today, it is multiplied by the allocation_kw divided by the allocation_kw less the kW of those filings; otherwise it is multiplied by 1.'
    kept: 'Standard kept-share multiplier: where the account share''s latest annual true-up recorded a resize_kw above 0, the standard existing output is multiplied by the account share''s allocation_kw divided by that allocation_kw plus the resize_kw; where that true-up recorded no resize and subscriber_increase filings on the account share took effect in the last N whole months, N being the number of whole months from that true-up''s review_date to today, it is multiplied by the allocation_kw divided by the allocation_kw less the kW of those filings; otherwise it is multiplied by 1.'
    o_recent: 'Standard target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the standard target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    o_date: 'Standard target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the standard target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    o_kw: 'Standard target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the standard target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    o_kwh: 'Standard target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the standard target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    hh_tu_date: 'Standard target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the standard target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    hh_tu_kwh: 'Standard target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the standard target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    target: 'Standard target yield by source: where this reservation has received at least one offer on its own project in the last twelve whole months, the standard target yield is the estimated_annual_kwh of the latest of this reservation''s offers on that project (the one with the latest offer_date; of two on that date, the one with the larger offered_kw, and of two of the same size, the one with the larger estimated_annual_kwh) divided by its offered_kw and by estimate_years; where it has received no such offer and the household share''s latest annual true-up was completed within the last twelve whole months, it is that true-up''s credited_kwh_12m divided by the household share''s allocation_kw; otherwise it is the figure of the standard method.'
    room: 'The standard adjustments below act in this order: a figure that replaces the standard usage figure is taken first; the standard banking margin multiplies the usage figure next; a figure that replaces the standard existing output is taken first and the standard kept-share multiplier applies to it next; a figure that replaces the standard target yield is taken; the standard usage room is then formed from these figures and only then sized down.'
    fitted: The standard usage room is the standard usage figure less the standard existing output, divided by the standard target yield, and never below 0; the standard fitted size is the standard usage room sized down to a whole multiple of increment_kw.
    result: When the subscriber asks to fit the request, the requested kW is set to the lesser of the reservation's current requested_kw and the standard fitted size, rounded to two decimals.
  factors:
  - id: usage_figure_averaging
    effect: parameter
    decides: usage_fig
    bindings:
    - n36
    - n24
    - usage_fig
    ladder:
    - when: three or more annual true-ups of the account share completed in the last 36 whole months
      value: the average of their usage_kwh_12m
    - when: fewer than three in the last 36 whole months and exactly two in the last 24 whole months
      value: the average of those two usage_kwh_12m
    - when: otherwise
      value: usage_kwh_12m of the latest true-up (standard method)
    baseline:
      usage_fig: a_tu_usage
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  - id: banking_margin
    effect: parameter
    decides: margin
    bindings:
    - m_lines
    - m_unbanked
    - margin
    ladder:
    - when: four or more account-share lines posted in the last twelve whole months with banked_value above 0
      value: '0.90'
    - when: one to three such lines
      value: '0.95'
    - when: otherwise (no such line)
      value: '1'
    baseline:
      margin: '1.0'
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  - id: existing_output_basis
    effect: method
    decides: existing
    bindings:
    - a_tu_short
    - a_tu_kwh
    - a_kwh12
    - existing
    ladder:
    - when: the account share's latest annual true-up recorded a shortfall_kwh above 0
      method: that true-up's credited_kwh_12m
    - when: that true-up assessed no guarantee (guaranteed_kwh 0)
      method: net credited kWh of the account share's statements posted in the last twelve whole months
    - when: otherwise
      method: guaranteed_kwh divided by the plan's production_guarantee_pct over 100 (standard method)
    baseline:
      existing: a_tu_guar / (acct_pct / 100)
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  - id: existing_kept_share
    effect: method
    decides: kept
    bindings:
    - a_resize
    - a_inc
    - kept
    ladder:
    - when: the account share's latest annual true-up recorded a resize_kw above 0
      method: multiply by allocation_kw divided by allocation_kw plus the resize_kw
    - when: no resize and subscriber_increase filings took effect in the whole months since that true-up's review_date
      method: multiply by allocation_kw divided by allocation_kw less the kW of those filings
    - when: otherwise
      method: multiply by 1
    baseline:
      kept: '1.0'
    evidence:
    - history
    - cross_category
    cross_difficulty: home
  - id: target_yield_source
    effect: parameter
    decides: target
    bindings:
    - o_recent
    - o_date
    - o_kw
    - o_kwh
    - hh_tu_date
    - hh_tu_kwh
    - target
    ladder:
    - when: this reservation has received at least one offer on its own project in the last twelve whole months
      value: the latest such offer's estimated_annual_kwh divided by its offered_kw and estimate_years
    - when: no such offer and the household share's latest annual true-up was completed within the last twelve whole months
      value: that true-up's credited_kwh_12m divided by the household share's allocation_kw
    - when: otherwise
      value: the household share's twelve-month output per kW (standard method)
    baseline:
      target: hh_kwh12 / hh_alloc
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: home
  baseline:
    rule: 'The standard usage room is the standard usage figure less the standard existing output, divided by the standard target yield, and never below 0; the standard fitted size is the standard usage room sized down to a whole multiple of increment_kw. The standard usage figure is the usage_kwh_12m of the account share''s latest annual true-up. The standard existing output is the account share''s expected annual production: its latest annual true-up''s guaranteed_kwh divided by the account share''s plan''s production_guarantee_pct divided by 100. The standard target yield is the household share''s net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted in the last twelve whole months divided by its allocation_kw. When the subscriber asks to fit the request, the requested kW is set to the lesser of the reservation''s current requested_kw and the standard fitted size, rounded to two decimals.'
    params:
    - increment_kw
    - estimate_years
  inputs:
    history:
    - table: waitlist_offers
      aggregate: latest
      field: estimated_annual_kwh
      within_months: 12
      filters: {}
    - category: home
      table: home_reviews
      aggregate: latest
      field: usage_kwh_12m
      within_months: 36
      filters: {}
    - category: home
      table: home_credits
      aggregate: count
      field: banked_value
      within_months: 12
      filters:
        event_type: home_credit_posted
    cross_category:
    - home
- id: waitlist_ext_standard_offer_estimate
  base_policy_refs:
  - waitlist_queue_order
  - waitlist_agg_account_headroom
  - waitlist_evt_offer_terms
  overwrite:
  - base_policy: waitlist_evt_offer_terms
    superseded_clause: estimated_annual_kwh is offered_kw multiplied by the project's expected_yield_kwh_per_kw and estimate_years, rounded half up to a whole kWh.
    replaced_by: 'For a full Residential Standard offer that this policy settles, and only for such an offer, the standard first-year kWh estimate is taken from the household share''s own record as set out here; a full Relocation Priority or Residential Add-On offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_kwh is offered_kw multiplied by the project''s expected_yield_kwh_per_kw and estimate_years, rounded half up to a whole kWh.'
  - base_policy: waitlist_evt_offer_terms
    superseded_clause: estimated_annual_savings is estimated_annual_kwh multiplied by the project's est_credit_rate_per_kwh and by the offered plan's savings_rate_pct divided by 100 on percent-savings plans, or by the amount the project's est_credit_rate_per_kwh exceeds the plan's fixed_rate_per_kwh on fixed-rate plans (0.00 when it does not), rounded half up to the cent; it is an estimate and never a promise.
    replaced_by: 'For the same full Residential Standard offers, and only for them, the savings estimate is figured from the standard first-year kWh estimate and the standard credit value per kWh as set out here; a full Relocation Priority or Residential Add-On offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_savings is estimated_annual_kwh multiplied by the project''s est_credit_rate_per_kwh and by the offered plan''s savings_rate_pct divided by 100 on percent-savings plans, or by the amount the project''s est_credit_rate_per_kwh exceeds the plan''s fixed_rate_per_kwh on fixed-rate plans (0.00 when it does not), rounded half up to the cent; it is an estimate and never a promise.'
  trigger: state_due
  subject:
  - waitlist_offer_extended
  - waitlist_offer_made
  computes: estimated_annual_savings
  target_tool: extend_standard_offer_cf280a13
  params: {}
  rule: 'This policy settles the estimate written on a full offer to a Residential Standard reservation (offered kW equal to the requested kW, the project capacity available to the reservation and the account headroom on the offer date both covering it) whose requested_plan is the plan of a Residential share the customer holds and whose utility account holds no more than one active Residential share, when the customer also holds exactly one active Residential Community Solar Subscription on the offered project, under another utility account, with at least one credit statement posted on it in the last twelve whole months (the household share); it applies to such an offer and only to such an offer. A Residential Standard offer and its estimate are fixed only after the reservation''s requested kW is no more than the standard fitted size of its utility account. Such a Residential Standard offer is made for the reservation''s requested kW. The standard first-year kWh estimate is the offered kW multiplied by the standard output per kW and by estimate_years, rounded half up to a whole kWh. The standard output per kW is the standard annual output figure divided by the household share''s allocation_kw. The standard annual output figure is the net credited kWh (credited kWh posted less kWh reversed) of the credit statements posted on the household share in the last twelve whole months. The standard first-year savings estimate is the rounded standard first-year kWh estimate multiplied by the standard credit value per kWh and by the requested plan''s savings_rate_pct divided by 100, rounded half up to the cent; it is an estimate and never a promise. The standard credit value per kWh is the net credit value (credit value posted less credit value reversed) of the credit statements posted on the household share in the last twelve whole months divided by their net credited kWh. For the standard figures, a count of whole months between two dates is the difference between their calendar months, less one when the later date''s day of the month is earlier than the earlier date''s; a statement line, filing, offer or true-up falls in the last N whole months when fewer than N whole months separate its date (posted_date, effective_date, offer_date or review_date) from today, and was completed N whole months ago when exactly N whole months separate its review_date from today. The standard adjustments below act in this order: a figure that replaces the standard annual output figure is taken first and the floor on it is applied next; the standard output per kW is then formed from the floored figure and the blend is applied to it before the standard first-year kWh estimate is rounded; a figure that replaces the standard credit value per kWh is taken first, the trend multiplier is applied to it next and the banked-credit reduction is subtracted last, before it multiplies the rounded estimate. Standard output by history: where the household share''s latest annual true-up was completed within the last twelve whole months, the standard annual output figure is that true-up''s credited_kwh_12m; where the household share has no annual true-up and carries fewer than twelve posted credit statement lines (each posting counted, a re-posting after a reversal counted as its own line), it is the net credited kWh of all its statements multiplied by twelve and divided by the number of those posted lines; otherwise it is the twelve-month figure of the standard method. Standard guarantee floor: where the household share''s latest annual true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0, and the true-up of the contract year before it also recorded a shortfall_kwh above 0, the standard annual output figure is not taken below that latest true-up''s guaranteed_kwh; where that latest true-up was completed within the last twelve whole months and recorded a shortfall_kwh above 0 but the true-up of the contract year before it recorded none or does not exist, the figure is not taken below half the sum of that latest true-up''s credited_kwh_12m and guaranteed_kwh; otherwise no floor applies. Standard young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the standard output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the standard output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100. Standard credit value by recency: where the household share''s latest annual true-up was completed within the last six whole months, the standard credit value per kWh is that true-up''s avg_credit_rate; where it was completed six to eleven whole months ago and the credit statements posted on the household share in the last N whole months, N being the number of whole months from that true-up''s review_date to today, carry a net credited kWh above 0, it is the net credit value of those statements divided by their net credited kWh; otherwise it is the twelve-month figure of the standard method. Standard credit-rate trend: where the true-up of the contract year before the household share''s latest annual true-up was completed within the last 24 whole months, the standard credit value per kWh is multiplied by the latest true-up''s avg_credit_rate divided by that earlier true-up''s avg_credit_rate, the multiplier kept between 0.95 and 1.05; where that earlier true-up was completed 24 to 35 whole months ago, it is multiplied by 1 plus half of the amount by which that ratio differs from 1, the multiplier kept between 0.95 and 1.05; where there is no such earlier true-up or it was completed 36 or more whole months ago, it is multiplied by 1. Standard banked-credit allowance: where the active Residential share on the reservation''s own utility account (the account share) carries four or more credit statement lines posted in the last twelve whole months with a banked_value above 0, the standard credit value per kWh is reduced by the account share''s banked value of those twelve months divided by its net credited kWh of the same months; where it carries one to three such lines, by half of that figure; where the reservation''s utility account holds no active Residential share or none of those lines was banked, it is not reduced. For a full Residential Standard offer that this policy settles, and only for such an offer, the standard first-year kWh estimate is taken from the household share''s own record as set out here; a full Relocation Priority or Residential Add-On offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_kwh is offered_kw multiplied by the project''s expected_yield_kwh_per_kw and estimate_years, rounded half up to a whole kWh. For the same full Residential Standard offers, and only for them, the savings estimate is figured from the standard first-year kWh estimate and the standard credit value per kWh as set out here; a full Relocation Priority or Residential Add-On offer estimated from a household share is settled by its own rule, and every other offer remains under the base rule, which reads: estimated_annual_savings is estimated_annual_kwh multiplied by the project''s est_credit_rate_per_kwh and by the offered plan''s savings_rate_pct divided by 100 on percent-savings plans, or by the amount the project''s est_credit_rate_per_kwh exceeds the plan''s fixed_rate_per_kwh on fixed-rate plans (0.00 when it does not), rounded half up to the cent; it is an estimate and never a promise.'
  prerequisite:
  - problem: waitlist_ext_standard_request_fit
    kind: value_input
    gate: offered_kw
    form: state
    policy_source: A Residential Standard offer and its estimate are fixed only after the reservation's requested kW is no more than the standard fitted size of its utility account.
    condition: The Residential Standard reservation's requested_kw is no more than the standard fitted size its utility account gives under the standard fit rule.
    resolved_by: fit_standard_request_b636e3b6
    effect: The offered kW (the reservation's requested_kw) falls to the standard fitted size, so the estimates are figured on that size.
  cross_category:
  - category: home
    as: history
    reads:
    - home_sub_id
    - allocation_kw
    - status
    - project_id
    - utility_account_id
    - variant_name
    - home_credits.credited_kwh
    - home_credits.credit_value
    - home_credits.posted_date
    - home_reviews.credited_kwh_12m
    - home_reviews.avg_credit_rate
    - home_reviews.guaranteed_kwh
    - home_reviews.shortfall_kwh
    - home_reviews.review_date
    - home_reviews.contract_year
    - home_credits.banked_value
    note: Every factor reads the household share on the offered project or the Residential share on the reservation's own account (statements, true-ups, plan).
  compute:
  - ref_sid: CFIELD('home','home_sub_id', project_id=F('project_id'), status='active')
  - ref_alloc: CFIELD('home','allocation_kw', home_sub_id=ref_sid)
  - ref_pct: CPARAM('home','production_guarantee_pct', home_sub_id=ref_sid)
  - tu_date: XLATEST('home','home_reviews','review_date', date_field='review_date', home_sub_id=ref_sid)
  - tu_kwh: XLATEST('home','home_reviews','credited_kwh_12m', date_field='review_date', home_sub_id=ref_sid)
  - tu_rate: XLATEST('home','home_reviews','avg_credit_rate', date_field='review_date', home_sub_id=ref_sid)
  - tu_guar: XLATEST('home','home_reviews','guaranteed_kwh', date_field='review_date', home_sub_id=ref_sid)
  - tu_cy: XLATEST('home','home_reviews','contract_year', date_field='review_date', home_sub_id=ref_sid)
  - tu_age: MONTHS(tu_date, NOW) if tu_date else 999
  - n_stmt: XCOUNT('home','home_credits', event_type='home_credit_posted', home_sub_id=ref_sid)
  - kwh12: XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)
  - val12: XSUM('home','home_credits','credit_value', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credit_value', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)
  - kwh_all: XSUM('home','home_credits','credited_kwh', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credited_kwh', event_type='home_credit_reversed', home_sub_id=ref_sid)
  - out_kwh: tu_kwh if (tu_date and tu_age < 12) else (kwh_all * 12 / n_stmt if (n_stmt < 12 and not tu_date) else kwh12)
  - tu_short: XLATEST('home','home_reviews','shortfall_kwh', date_field='review_date', home_sub_id=ref_sid)
  - prev_short: XLATEST('home','home_reviews','shortfall_kwh', date_field='review_date', contract_year=(tu_cy or 0) - 1, home_sub_id=ref_sid)
  - floor_kwh: tu_guar if (tu_date and tu_age < 12 and (tu_short or 0) > 0 and (prev_short or 0) > 0) else ((tu_kwh + tu_guar) / 2 if (tu_date and tu_age < 12 and (tu_short or 0) > 0) else 0)
  - blend_lines: XCOUNT('home','home_credits', event_type='home_credit_posted', home_sub_id=ref_sid)
  - design_kw: tu_guar / ref_alloc / (ref_pct / 100) if ((tu_guar or 0) > 0 and (ref_pct or 0) > 0) else 0
  - blend_w: 0.5 if (blend_lines < 24 and (tu_guar or 0) > 0) else (0.75 if (blend_lines >= 24 and blend_lines < 36 and (tu_guar or 0) > 0) else 1.0)
  - kwh_since: (XSUM('home','home_credits','credited_kwh', within_months=tu_age, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credited_kwh', within_months=tu_age, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)) if (tu_date and tu_age < 12) else 0
  - val_since: (XSUM('home','home_credits','credit_value', within_months=tu_age, date_field='posted_date', event_type='home_credit_posted', home_sub_id=ref_sid) - XSUM('home','home_credits','credit_value', within_months=tu_age, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=ref_sid)) if (tu_date and tu_age < 12) else 0
  - value_kwh: tu_rate if (tu_date and tu_age < 6) else (val_since / kwh_since if (tu_date and tu_age >= 6 and tu_age < 12 and kwh_since > 0) else val12 / kwh12)
  - prev_rate: XLATEST('home','home_reviews','avg_credit_rate', date_field='review_date', contract_year=(tu_cy or 0) - 1, home_sub_id=ref_sid)
  - prev_date: XLATEST('home','home_reviews','review_date', date_field='review_date', contract_year=(tu_cy or 0) - 1, home_sub_id=ref_sid)
  - prev_age: MONTHS(prev_date, NOW) if prev_date else 999
  - trend: MN(1.05, MX(0.95, tu_rate / prev_rate)) if prev_age < 24 else (MN(1.05, MX(0.95, 1 + (tu_rate / prev_rate - 1) / 2)) if prev_age < 36 else 1.0)
  - acct_sid: CFIELD('home','home_sub_id', utility_account_id=F('utility_account_id'), status='active')
  - acct_lines: XCOUNT('home','home_credits', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=acct_sid)
  - acct_unbanked: XCOUNT('home','home_credits', within_months=12, date_field='posted_date', event_type='home_credit_posted', banked_value=0.0, home_sub_id=acct_sid)
  - acct_banked_val: XSUM('home','home_credits','banked_value', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=acct_sid)
  - acct_kwh12: XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_posted', home_sub_id=acct_sid) - XSUM('home','home_credits','credited_kwh', within_months=12, date_field='posted_date', event_type='home_credit_reversed', home_sub_id=acct_sid)
  - banked_deduct: acct_banked_val / acct_kwh12 if (acct_sid and acct_lines - acct_unbanked >= 4 and acct_kwh12 > 0) else (acct_banked_val / acct_kwh12 / 2 if (acct_sid and acct_lines - acct_unbanked >= 1 and acct_kwh12 > 0) else 0)
  - out_per_kw: MX(out_kwh, floor_kwh) / ref_alloc
  - per_kw: blend_w * out_per_kw + (1 - blend_w) * design_kw
  - offered_kw: F('requested_kw')
  - est_kwh: RND(offered_kw * per_kw * P('estimate_years') + 0.000000001, 0)
  - value_used: value_kwh * trend - banked_deduct
  - plan_pct: CPARAM('home','savings_rate_pct', variant_name=F('requested_plan'))
  - result: RND(est_kwh * value_used * plan_pct / 100 + 0.000000001, 2)
  compute_basis:
    ref_sid: This policy settles the estimate written on a full offer to a Residential Standard reservation (offered kW equal to the requested kW, the project capacity available to the reservation and the account headroom on the offer date both covering it) whose requested_plan is the plan of a Residential share the customer holds and whose utility account holds no more than one active Residential share, when the customer also holds exactly one active Residential Community Solar Subscription on the offered project, under another utility account, with at least one credit statement posted on it in the last twelve whole months (the household share); it applies to such an offer and only to such an offer.
    ref_alloc: The standard output per kW is the standard annual output figure divided by the household share's allocation_kw.
    ref_pct: 'Standard young-share blend: where the household share carries fewer than 24 posted credit statement lines and its latest annual true-up assessed a guarantee (guaranteed_kwh above 0), the standard output per kW is 0.50 times the figure otherwise worked out plus 0.50 times the household share''s design output per kW; where it carries 24 to 35 posted lines and its latest annual true-up assessed a guarantee, it is 0.75 times that figure plus 0.25 times the design output per kW; otherwise the standard output per kW is used unblended. The household share''s design output per kW is that latest true-up''s guaranteed_kwh divided by the household share''s allocation_kw and by its plan''s production_guarantee_pct divided by 100.'
