        method: hold the charge's unpaid amount plus every late fee referring to it
      - when: it names a fee line (late fee, returned-payment fee, early termination fee or change fee)
        method: hold the fee's amount less billing credits referring to it
      - when: otherwise (no open dispute, or it names a payment, returned payment or billing credit)
