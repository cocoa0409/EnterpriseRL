  - id: home_ext_estimated_charge
    base_policy_refs: [home_evt_subscription_charge, home_benefit_basis]
    overwrite:
    - base_policy: home_evt_subscription_charge
      superseded_clause: >-
        Estimates: when estimated_billing_allowed is true and no credit has posted for a statement month estimate_wait_days
        calendar days after that month ends, an estimated charge equal to the average of the last estimate_basis_months actual
        charges, rounded half up to the cent, may be billed with charge_basis estimated and no credit reference; no more than
        max_consecutive_estimates estimates may be billed in a row (the run is measured by home_msr_consecutive_estimates).
      replaced_by: >-
        For every estimated charge of a residential subscription, and only for an estimated charge: when estimated_billing_allowed
        is true, the subscription is dual billed and no credit has posted for a statement month estimate_wait_days calendar
        days after that month ends, Meadowlark bills an estimated charge for that month with charge_basis estimated, no credit
        reference and billing_type dual, invoiced on the day it is billed and due invoice_due_days calendar days later, its
        amount worked out as this rule states; a consolidated-billed subscription is not estimated and waits for the utility
        statement, because the utility nets only posted credits; actual charges remain under the base rule.
    - base_policy: home_evt_subscription_charge
      superseded_clause: >-
        Each posted credit statement line is priced by exactly one actual subscription charge.
      replaced_by: >-
        An estimated charge prices no credit statement line and carries no credit reference, so no estimate is counted
        against a credit line; every posted credit statement line remains under the base rule, which reads: Each posted
        credit statement line is priced by exactly one actual subscription charge.
    trigger: state_due
    subject: [home_charge_billed]
    computes: amount
    target_tool: bill_estimated_charge_232393a8
    params:
      basis_window_months: 6
      season_lookback_months: 13
      season_history_long: 24
      season_history_short: 12
      season_weight_long: 0.5
      season_weight_short: 0.25
      rate_band_wide_pct: 10
      rate_band_narrow_pct: 5
      rate_weight_narrow: 0.5
      run_window_months: 2
      unpriced_weight_late: 2
    rule: >-
      For every estimated charge of a residential subscription, and only for an estimated charge: when estimated_billing_allowed
      is true, the subscription is dual billed and no credit has posted for a statement month estimate_wait_days calendar
      days after that month ends, Meadowlark bills an estimated charge for that month with charge_basis estimated, no credit
      reference and billing_type dual, invoiced on the day it is billed and due invoice_due_days calendar days later, its
      amount worked out as this rule states; a consolidated-billed subscription is not estimated and waits for the utility
      statement, because the utility nets only posted credits; actual charges remain under the base rule. An estimated
      charge prices no credit statement line and carries no credit reference, so no estimate is counted against a credit
      line; every posted credit statement line remains under the base rule, which reads: Each posted credit statement line
      is priced by exactly one actual subscription charge.
      No estimate is billed while the latest subscription charge by bill_date (among charges invoiced the same day the first
      on record) is an estimated charge and at least max_consecutive_estimates estimated charges have a bill_date fewer than
      run_window_months whole months before today; billing then waits for the utility statement.
      The estimate window holds the actual subscription charges whose bill_date lies fewer than basis_window_months whole
      months before today (whole months counted from the bill_date to today, a month ending on the same day of the month).
      The estimate basis is the average of the actual charges in the estimate window, and the estimated charge is the estimate
      basis rounded half up to the cent; when the estimate window holds no actual charge the estimated charge is 0.00 and no
      estimate is billed.
      The estimate's dispute and error standing is settled by the window's charges: when the most recently received billing
      dispute that is still open (outcome received; the latest received_date, and among requests received the same day the
      first on record) names an actual charge in the estimate window and at least one other actual charge is in the window,
      that disputed charge is left out of the estimate basis; when no charge is left out for a dispute and billing credits
      with credit_reason billing_error were posted (bill_date) in the same window, those billing-error credits are taken off
      the window's actual charges, the number of charges unchanged; otherwise nothing is taken off for standing.
      The estimate's reversal standing is settled by the reversal-correction billing credits (credit_reason
      credit_reversal_correction) posted in the estimate window: when there are such credits and at least two actual charges
      remain in the window once the charges they offset are left out, the offset charges are left out (each such credit
      equals the charge it offsets, so their sum is taken off and their number is taken off the count); when there are such
      credits and fewer than two would remain, the offset charges are left out and the actual charges whose bill_date lies
      exactly basis_window_months whole months before today are taken in; otherwise nothing is taken off for reversals.
      The estimate's unpriced-credit weight is settled by the posted credit line with the latest posted_date (among lines
      posted the same day the first on record): when no subscription charge prices that line yet and its statement month
      already carries an estimated charge, its weight is unpriced_weight_late; when no charge prices it yet and its statement
      month carries no estimated charge, its weight is 1; otherwise 0. That line joins the estimate basis as that many charges
      of its credit_value multiplied by (100 minus savings_rate_pct) and divided by 100.
      The estimated charge's season weight is settled from the subscription's actual-charge record: the same-season reference
      charge is the average of the actual charges whose bill_date lies exactly season_lookback_months whole months before
      today; when at least season_history_long actual charges are on record and such a same-season charge exists, the season
      weight is season_weight_long; when at least season_history_short but fewer than season_history_long actual charges are
      on record and such a charge exists, the season weight is season_weight_short; otherwise the season weight is 0. The
      blended estimate is the estimate basis plus the season weight times the same-season reference charge less the estimate
      basis.
      The estimated charge's capacity ratio is settled from the subscriber-requested allocation changes: the latest change is
      the filing line with filing_reason subscriber_increase or subscriber_decrease carrying the latest effective_date, and it
      took effect within the estimate window when its effective_date is on or before today and the whole months from its
      effective_date to today are fewer than basis_window_months. When it took effect within the window and at least one
      actual charge has a bill_date fewer than N whole months before today, N being one less than the whole months from that
      effective_date to today, the capacity ratio is the average of those later actual charges divided by the average of
      every actual charge in the estimate window; when it took effect within the window and no such later charge exists, the
      capacity ratio is the kW the share holds divided by the kW it held before the window's changes, the kW held being every
      filing line that adds kW less every subscriber_decrease, annual_resize and move_resize line, and the kW held before
      being that figure less the subscriber_increase kW plus the subscriber_decrease kW of filing lines whose effective_date
      lies within the window; otherwise the capacity ratio is 1.
      The estimated charge's credit-rate weight is settled from the posted credit lines: the latest credit rate is the
      credit_value divided by the credited_kwh of the posted credit line with the latest posted_date (among lines posted the
      same day the first on record), the window credit rate is the credit_value of every posted credit line whose posted_date
      lies fewer than basis_window_months whole months before today divided by their credited_kwh, and the relative change is
      the latest credit rate divided by the window credit rate, less 1. When the relative change is at least
      rate_band_wide_pct percent up or down, the credit-rate weight is 1; when it is at least rate_band_narrow_pct percent but
      less than rate_band_wide_pct percent up or down, the credit-rate weight is rate_weight_narrow; otherwise it is 0. The
      estimate follows the credit rate by 1 plus the credit-rate weight times the relative change.
      The estimated charge is assembled in one fixed order: the estimate basis is the window's actual charges, less what the
      standing and reversal rules take off and plus what they take in, plus the unpriced line at its weight, divided by the
      resulting number of charges; the blending adjustment is applied to it next; the blended estimate is then multiplied, in
      a single step, by every multiplying ratio; the product is rounded half up to the cent once, at the end, and no estimate
      is billed when the product is 0.00 or no charge remains in the basis.
    compute:
    - est_win_sum: "SUM('home_billing', 'amount', within_months=K('basis_window_months'), date_field='bill_date', event_type='home_charge_billed', charge_basis='actual')"
    - est_win_n: "COUNT('home_billing', within_months=K('basis_window_months'), date_field='bill_date', event_type='home_charge_billed', charge_basis='actual')"
    - est_win_avg: "est_win_sum / est_win_n if est_win_n > 0 else 0"
    - run_last_basis: "LATEST('home_billing', 'charge_basis', date_field='bill_date', event_type='home_charge_billed') or 'none'"
    - run_recent_est: "COUNT('home_billing', within_months=K('run_window_months'), date_field='bill_date', event_type='home_charge_billed', charge_basis='estimated')"
    - run_open: "0 if (run_last_basis == 'estimated' and run_recent_est >= P('max_consecutive_estimates')) else 1"
    - bas_dispute_id: "LATEST('home_requests', 'home_disputed_bill_id', date_field='received_date', request_type='billing_dispute', outcome='received') or 'none'"
    - bas_dispute_amt: "SUM('home_billing', 'amount', within_months=K('basis_window_months'), date_field='bill_date', event_type='home_charge_billed', charge_basis='actual', home_bill_id=bas_dispute_id)"
    - bas_error_cr: "SUM('home_billing', 'amount', within_months=K('basis_window_months'), date_field='bill_date', event_type='home_billing_credited', credit_reason='billing_error')"
    - st_n: "1 if (bas_dispute_amt > 0 and est_win_n > 1) else 0"
    - st_amt: "bas_dispute_amt if (bas_dispute_amt > 0 and est_win_n > 1) else (bas_error_cr if bas_error_cr > 0 else 0)"
    - rev_cr: "SUM('home_billing', 'amount', within_months=K('basis_window_months'), date_field='bill_date', event_type='home_billing_credited', credit_reason='credit_reversal_correction')"
    - rev_cnt: "COUNT('home_billing', within_months=K('basis_window_months'), date_field='bill_date', event_type='home_billing_credited', credit_reason='credit_reversal_correction')"
    - rev_ext_sum: "SUM('home_billing', 'amount', within_months=K('basis_window_months') + 1, date_field='bill_date', event_type='home_charge_billed', charge_basis='actual') - est_win_sum"
    - rev_ext_n: "COUNT('home_billing', within_months=K('basis_window_months') + 1, date_field='bill_date', event_type='home_charge_billed', charge_basis='actual') - est_win_n"
    - rev_dn: "rev_cnt if (rev_cnt > 0 and est_win_n - rev_cnt >= 2) else (rev_cnt - rev_ext_n if rev_cnt > 0 else 0)"
    - rev_amt: "rev_cr if (rev_cnt > 0 and est_win_n - rev_cnt >= 2) else (rev_cr - rev_ext_sum if rev_cnt > 0 else 0)"
    - un_id: "LATEST('home_credits', 'home_credit_id', date_field='posted_date', event_type='home_credit_posted') or 'none'"
    - un_month: "LATEST('home_credits', 'statement_month', date_field='posted_date', event_type='home_credit_posted') or 'none'"
    - un_priced: "COUNT('home_billing', event_type='home_charge_billed', home_credit_id=un_id)"
    - un_value: "SUM('home_credits', 'credit_value', home_credit_id=un_id)"
    - un_est: "COUNT('home_billing', event_type='home_charge_billed', charge_basis='estimated', billing_month=un_month)"
    - un_weight: "K('unpriced_weight_late') if (un_priced == 0 and un_value > 0 and un_est > 0) else (1 if (un_priced == 0 and un_value > 0) else 0)"
    - un_charge: "un_value * (100 - P('savings_rate_pct')) / 100"
    - sea_hist_n: "COUNT('home_billing', event_type='home_charge_billed', charge_basis='actual')"
    - sea_ref_sum: "SUM('home_billing', 'amount', within_months=K('season_lookback_months') + 1, date_field='bill_date', event_type='home_charge_billed', charge_basis='actual') - SUM('home_billing', 'amount', within_months=K('season_lookback_months'), date_field='bill_date', event_type='home_charge_billed', charge_basis='actual')"
    - sea_ref_n: "COUNT('home_billing', within_months=K('season_lookback_months') + 1, date_field='bill_date', event_type='home_charge_billed', charge_basis='actual') - COUNT('home_billing', within_months=K('season_lookback_months'), date_field='bill_date', event_type='home_charge_billed', charge_basis='actual')"
    - sea_ref: "sea_ref_sum / sea_ref_n if sea_ref_n > 0 else 0"
    - sea_weight: "K('season_weight_long') if (sea_hist_n >= K('season_history_long') and sea_ref_n >= 1) else (K('season_weight_short') if (sea_hist_n >= K('season_history_short') and sea_ref_n >= 1) else 0)"
    - cap_inc_eff: "LATEST('home_allocations', 'effective_date', date_field='effective_date', filing_reason='subscriber_increase') or '0001-01-01'"
    - cap_dec_eff: "LATEST('home_allocations', 'effective_date', date_field='effective_date', filing_reason='subscriber_decrease') or '0001-01-01'"
    - cap_eff: "cap_inc_eff if cap_inc_eff > cap_dec_eff else cap_dec_eff"
    - cap_age: "MONTHS(cap_eff, NOW)"
    - cap_in: "cap_eff <= NOW and cap_age < K('basis_window_months')"
    - cap_post_sum: "SUM('home_billing', 'amount', within_months=cap_age - 1, date_field='bill_date', event_type='home_charge_billed', charge_basis='actual')"
    - cap_post_n: "COUNT('home_billing', within_months=cap_age - 1, date_field='bill_date', event_type='home_charge_billed', charge_basis='actual')"
    - cap_kw_held: "SUM('home_allocations', 'kw', event_type='home_allocation_filed') - SUM('home_allocations', 'kw', filing_reason='subscriber_decrease') - SUM('home_allocations', 'kw', filing_reason='annual_resize') - SUM('home_allocations', 'kw', filing_reason='move_resize')"
    - cap_kw_net_win: "SUM('home_allocations', 'kw', within_months=K('basis_window_months'), date_field='effective_date', filing_reason='subscriber_increase') - SUM('home_allocations', 'kw', within_months=K('basis_window_months'), date_field='effective_date', filing_reason='subscriber_decrease')"
    - cap_ratio: "(cap_post_sum / cap_post_n) / est_win_avg if (cap_in and cap_post_n > 0 and est_win_avg > 0) else (cap_kw_held / (cap_kw_held - cap_kw_net_win) if (cap_in and cap_kw_held - cap_kw_net_win > 0) else 1)"
    - rate_last_cv: "LATEST('home_credits', 'credit_value', date_field='posted_date', event_type='home_credit_posted') or 0"
    - rate_last_kwh: "LATEST('home_credits', 'credited_kwh', date_field='posted_date', event_type='home_credit_posted') or 0"
    - rate_win_cv: "SUM('home_credits', 'credit_value', within_months=K('basis_window_months'), date_field='posted_date', event_type='home_credit_posted')"
    - rate_win_kwh: "SUM('home_credits', 'credited_kwh', within_months=K('basis_window_months'), date_field='posted_date', event_type='home_credit_posted')"
    - rate_change: "(float(rate_last_cv) / float(rate_last_kwh)) / (rate_win_cv / rate_win_kwh) - 1 if (float(rate_last_kwh) > 0 and rate_win_kwh > 0 and rate_win_cv > 0) else 0"
    - rate_weight: "1 if ABS(rate_change) >= K('rate_band_wide_pct') / 100 else (K('rate_weight_narrow') if ABS(rate_change) >= K('rate_band_narrow_pct') / 100 else 0)"
    - est_basis_n: "est_win_n - st_n - rev_dn + un_weight"
    - est_basis: "(est_win_sum - st_amt - rev_amt + un_weight * un_charge) / est_basis_n if est_basis_n > 0 else 0"
    - est_blended: "est_basis + sea_weight * (sea_ref - est_basis)"
    - est_product: "est_blended * cap_ratio * (1 + rate_weight * rate_change) * run_open"
    - result: "RND(est_product + 0.000000001, 2) if (est_product > 0 and est_basis_n > 0) else 0"
