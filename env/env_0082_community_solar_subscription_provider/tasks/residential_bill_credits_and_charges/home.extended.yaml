events:
- type: home_enrolled
  target: home_subscriptions
  mutation: create
  meaning: A subscriber signs a subscription agreement for a utility account and a project.
  grain: one row per subscription agreement; this event writes that row
  fields: {customer_id: subscriber, variant_name: plan signed, project_id: project the share comes from,
    utility_account_id: utility account to be credited, contract_kw: share size signed, billing_type: billing
      arrangement chosen, sales_channel: signing channel, signed_date: signature date}
  triggers: []
- type: home_allocation_approved
  target: home_subscriptions
  mutation:
    transition: {from: applied, to: allocated}
  meaning: Meadowlark approves the utility-data review and submits the initial allocation filing.
  grain: one row per subscription agreement; this event writes that row
  fields: {approved_date: approval date}
  triggers:
  - event: home:home_allocation_filed
    map: {filing_reason: initial}
- type: home_rescinded
  target: home_subscriptions
  mutation:
    transition: {from: applied, to: closed}
  meaning: The subscriber rescinds the agreement within the rescission period.
  grain: one row per subscription agreement; this event writes that row
  fields: {closed_date: rescission date, closure_reason: rescinded}
  triggers: []
- type: home_application_declined
  target: home_subscriptions
  mutation:
    transition: {from: applied, to: closed}
  meaning: Meadowlark declines the application because an enrollment requirement is not met.
  grain: one row per subscription agreement; this event writes that row
  fields: {closed_date: decline date, closure_reason: application_declined}
  triggers: []
- type: home_activated
  target: home_subscriptions
  mutation:
    transition: {from: allocated, to: active}
  meaning: The first bill credit statement posts and the subscription becomes active.
  grain: one row per subscription agreement; this event writes that row
  fields: {activation_date: posting date of the first credit, term_end_date: 'end of the committed term,
      empty without a term'}
  triggers: []
- type: home_preactivation_cancelled
  target: home_subscriptions
  mutation:
    transition: {from: allocated, to: closed}
  meaning: The subscriber cancels after allocation filing but before the first credit posts.
  grain: one row per subscription agreement; this event writes that row
  fields: {notice_date: date the cancellation was received, closed_date: closing date, closure_reason: preactivation_cancellation}
  triggers:
  - event: home:home_allocation_reduced
    map: {filing_reason: cancellation_removal}
- type: home_transfer_requested
  target: home_subscriptions
  mutation:
    transition: {from: active, to: transfer_pending}
  meaning: The subscriber asks to move the share to a new utility account because they are moving.
  grain: one row per subscription agreement; this event writes that row
  fields: {move_out_date: stated move-out date, pending_utility_account_id: new utility account named}
  triggers: []
- type: home_transfer_completed
  target: home_subscriptions
  mutation:
    transition: {from: transfer_pending, to: active}
  meaning: The reassignment filing to the new utility account takes effect.
  grain: one row per subscription agreement; this event writes that row
  fields: {utility_account_id: the new utility account, pending_utility_account_id: cleared, move_out_date: cleared}
  triggers:
  - event: home:home_allocation_reassigned
    map: {filing_reason: move_transfer}
- type: home_transfer_lapsed
  target: home_subscriptions
  mutation:
    transition: {from: transfer_pending, to: closed}
  meaning: A move transfer cannot be completed and the share is removed from the old utility account.
  grain: one row per subscription agreement; this event writes that row
  fields: {closed_date: closing date, closure_reason: moved_out_of_territory or transfer_not_completed}
  triggers:
  - event: home:home_allocation_reduced
    map: {filing_reason: move_removal}
- type: home_notice_given
  target: home_subscriptions
  mutation:
    transition: {from: active, to: notice_given}
  meaning: The subscriber gives notice of cancellation.
  grain: one row per subscription agreement; this event writes that row
  fields: {notice_date: date the notice was received, scheduled_end_date: effective date of the removal
      filing}
  triggers: []
- type: home_notice_withdrawn
  target: home_subscriptions
  mutation:
    transition: {from: notice_given, to: active}
  meaning: The subscriber withdraws a cancellation notice before the scheduled end date.
  grain: one row per subscription agreement; this event writes that row
  fields: {notice_date: cleared, scheduled_end_date: cleared}
  triggers: []
- type: home_closed
  target: home_subscriptions
  mutation:
    transition: {from: notice_given, to: closed}
  meaning: The allocation removal takes effect on the scheduled end date and the subscription closes.
  grain: one row per subscription agreement; this event writes that row
  fields: {closed_date: the scheduled end date, closure_reason: subscriber_cancellation or deceased}
  triggers:
  - event: home:home_allocation_reduced
    map: {filing_reason: cancellation_removal}
- type: home_removed_nonpayment
  target: home_subscriptions
  mutation:
    transition: {from: active, to: closed}
  meaning: Meadowlark removes the subscriber for nonpayment.
  grain: one row per subscription agreement; this event writes that row
  fields: {closed_date: removal date, closure_reason: nonpayment_removal}
  triggers:
  - event: home:home_allocation_reduced
    map: {filing_reason: nonpayment_removal}
- type: home_successor_assigned
  target: home_subscriptions
  mutation:
    transition: {from: active, to: closed}
  meaning: The subscriber assigns the agreement to a successor, who enrolls under their own agreement.
  grain: one row per subscription agreement; this event writes that row
  fields: {closed_date: assignment date, closure_reason: successor_transfer}
  triggers:
  - event: home:home_allocation_reduced
    map: {filing_reason: successor_transfer}
- type: home_billing_type_changed
  target: home_subscriptions
  mutation: update
  meaning: The billing arrangement of an open subscription is switched between consolidated and dual billing.
  grain: one row per subscription agreement; this event writes that row
  fields: {billing_type: the new arrangement}
  triggers: []
- type: home_removal_notice_sent
  target: home_subscriptions
  mutation: update
  meaning: Meadowlark sends a nonpayment removal notice, or clears it when the past-due balance is paid.
  grain: one row per subscription agreement; this event writes that row
  fields: {removal_notice_date: 'notice date, or cleared'}
  triggers: []
- type: home_allocation_filed
  target: home_allocations
  meaning: A line adding kW to the utility account is filed in the allocation schedule.
  grain: one filing line per subscription, filing month and reason
  distinguish_by: [filing_month, filing_reason, kw]
  fields: {utility_account_id: account credited, kw: kW added, filing_month: submission month, effective_date: first
      day the utility applies it, filing_reason: initial or subscriber_increase, home_request_id: 'request
      carried out, empty for the initial filing'}
  account: allocation
  direction: in
  triggers: []
- type: home_allocation_reduced
  target: home_allocations
  meaning: A line removing kW from the utility account is filed in the allocation schedule.
  grain: one filing line per subscription, filing month and reason
  distinguish_by: [filing_month, filing_reason, kw]
  fields: {utility_account_id: account the kW is removed from, kw: kW removed, filing_month: submission
      month, effective_date: first day the utility applies it, filing_reason: 'subscriber_decrease, annual_resize,
      move_resize or a removal reason', home_request_id: 'request carried out, empty for company-initiated
      lines'}
  account: allocation
  direction: out
  triggers: []
- type: home_allocation_reassigned
  target: home_allocations
  meaning: A line moving the whole share from the old utility account to a new one is filed.
  grain: one filing line per subscription, receiving account and filing month
  distinguish_by: [filing_month, utility_account_id]
  fields: {utility_account_id: receiving account, kw: kW moved, filing_month: submission month, effective_date: first
      day the utility applies it, filing_reason: move_transfer, home_request_id: move transfer request
      carried out}
  triggers: []
- type: home_credit_posted
  target: home_credits
  meaning: The utility posts the month's bill credit for the share on the subscriber's utility account.
  grain: one row per utility statement month and posting
  distinguish_by: [statement_month, posted_date]
  fields: {utility_account_id: account credited, statement_month: utility billing month, credited_kwh: kWh
      credited, credit_value: credit value reported by the utility, banked_value: part carried forward,
    posted_date: report date}
  account: bill_credit
  direction: in
  triggers:
  - event: home:home_charge_billed
    map: {charge_basis: actual}
- type: home_credit_reversed
  target: home_credits
  meaning: The utility reverses a previously posted credit (for example after a meter or allocation correction).
  grain: one row per reversed credit statement line
  distinguish_by: [home_reversed_credit_id]
  fields: {utility_account_id: account debited, statement_month: month of the reversed statement, credited_kwh: kWh
      reversed, credit_value: value reversed, banked_value: '0.00', posted_date: report date, home_reversed_credit_id: the
      credit line reversed}
  account: bill_credit
  direction: out
  triggers:
  - event: home:home_billing_credited
    map: {credit_reason: credit_reversal_correction}
- type: home_charge_billed
  target: home_billing
  meaning: Meadowlark bills the subscription charge that prices one credit statement (or an estimate of
    a late one).
  grain: one charge per priced credit statement, or per estimated month
  distinguish_by: [home_credit_id, billing_month, charge_basis]
  fields: {amount: charge amount, bill_date: invoice date, billing_month: statement month priced, due_date: due
      date, home_credit_id: credit line priced; empty for an estimate, charge_basis: actual or estimated,
    billing_type: arrangement in force}
  account: balance
  direction: in
  triggers: []
- type: home_late_fee_assessed
  target: home_billing
  meaning: A late fee is assessed on a dual-billed charge left unpaid past its grace period.
  grain: one fee per overdue charge
  distinguish_by: [home_ref_bill_id]
  fields: {amount: fee, bill_date: assessment date, billing_month: month of the overdue charge, due_date: fee
      due date, home_ref_bill_id: overdue charge, billing_type: dual}
  account: balance
  direction: in
  triggers: []
- type: home_payment_received
  target: home_billing
  meaning: A payment from the subscriber (or the utility's remittance under consolidated billing) is received.
  grain: one row per payment receipt
  distinguish_by: [bill_date, amount, payment_method]
  fields: {amount: payment amount, bill_date: receipt date, billing_month: statement month paid, payment_method: method,
    billing_type: arrangement in force}
  account: balance
  direction: out
  triggers: []
- type: home_payment_returned
  target: home_billing
  meaning: A subscriber payment is returned unpaid by the bank.
  grain: one row per returned payment
  distinguish_by: [home_ref_bill_id]
  fields: {amount: returned amount, bill_date: return date, billing_month: month of the payment, home_ref_bill_id: payment
      returned, payment_method: method of the returned payment}
  account: balance
  direction: in
  triggers:
  - event: home:home_returned_fee_assessed
    map: {billing_type: dual}
- type: home_returned_fee_assessed
  target: home_billing
  meaning: The returned-payment fee is assessed for a returned payment.
  grain: one fee per returned payment
  distinguish_by: [home_ref_bill_id]
  fields: {amount: fee, bill_date: assessment date, billing_month: month of the payment, due_date: fee
      due date, home_ref_bill_id: returned payment, billing_type: arrangement in force}
  account: balance
  direction: in
  triggers: []
- type: home_etf_assessed
  target: home_billing
  meaning: The early termination fee is assessed when a committed-term subscription closes before its
    term ends.
  grain: one fee per subscription closing
  distinguish_by: [bill_date]
  fields: {amount: fee, bill_date: assessment date, billing_month: month of closing, due_date: fee due
      date, billing_type: arrangement in force}
  account: balance
  direction: in
  triggers: []
- type: home_change_fee_assessed
  target: home_billing
  meaning: The excess-decrease fee is assessed on kW removed beyond the plan's yearly decrease allowance.
  grain: one fee per decrease request
  distinguish_by: [bill_date, billing_month]
  fields: {amount: fee, bill_date: assessment date, billing_month: month of the decrease filing, due_date: fee
      due date, billing_type: arrangement in force}
  account: balance
  direction: in
  triggers: []
- type: home_billing_credited
  target: home_billing
  meaning: A billing credit lowers the subscriber's balance (correction, true-up, guarantee or fee waiver).
  grain: one credit per corrected line or per true-up
  distinguish_by: [home_ref_bill_id, credit_reason, billing_month]
  fields: {amount: credit amount, bill_date: posting date, billing_month: month concerned, home_ref_bill_id: 'line
      corrected, empty for a guarantee credit', home_credit_id: reversed credit line for a reversal correction,
    credit_reason: reason, billing_type: arrangement in force}
  account: balance
  direction: out
  triggers: []
- type: home_trueup_completed
  target: home_reviews
  meaning: Meadowlark completes the annual true-up of a contract year.
  grain: one review per subscription and contract year
  distinguish_by: [contract_year]
  fields: {contract_year: year closed, review_date: completion date, period_start_month: first month,
    period_end_month: last month, credited_kwh_12m: net kWh credited, usage_kwh_12m: utility usage, guaranteed_kwh: guaranteed
      kWh, shortfall_kwh: shortfall, avg_credit_rate: average credit rate, guarantee_credit: credit owed,
    resize_kw: kW removed, outcome: result}
  triggers:
  - event: home:home_billing_credited
    when:
      outcome: [guarantee_credit, resize_and_credit]
    map: {credit_reason: production_guarantee}
  - event: home:home_allocation_reduced
    when:
      outcome: [resize_down, resize_and_credit]
    map: {filing_reason: annual_resize}
measures:
- {id: home_msr_consecutive_estimates, window: the run of subscription charges ending with the latest
    one billed, measure: 'count of consecutive home_charge_billed lines with charge_basis estimated, ending
    with the latest charge'}
- {id: home_msr_unpaid_on_charge, window: from the charge's bill_date to the assessment date, measure: the
    charge's amount less payments settled to it and billing credits referring to it}
- id: home_msr_subscriber_changes_contract_year
  window: the current contract year (from the last activation_date anniversary)
  measure: >-
    count of home_allocation_filed and home_allocation_reduced lines with filing_reason subscriber_increase
    or subscriber_decrease whose filing_month falls in the window
- id: home_msr_subscriber_decrease_kw_contract_year
  window: the current contract year
  measure: >-
    sum of kw on home_allocation_reduced lines with filing_reason subscriber_decrease whose filing_month
    falls in the window
- {id: home_msr_remaining_contract_years, window: from the closing date through term_end_date, measure: 'number
    of contract years remaining, a part year counting as a whole year; 0 when closing after term_end_date'}
- {id: home_msr_net_credited_kwh_period, window: the twelve statement months of a true-up period, measure: sum
    of credited_kwh on home_credit_posted lines less home_credit_reversed lines in the window}
- {id: home_msr_net_credit_value_period, window: the twelve statement months of a true-up period, measure: sum
    of credit_value on home_credit_posted lines less home_credit_reversed lines in the window}
- {id: home_msr_past_due_balance, window: all open lines as of the decision date, measure: sum of unpaid
    amounts of charge and fee lines whose due_date has passed}
policies:
- id: home_agg_multi_holding
  subject: [home_enrolled]
  rule: >-
    A customer may hold at most max_per_customer open Residential Community Solar Subscriptions subscriptions
    (any status other than closed) across all of their utility accounts; when max_per_customer is null
    there is no customer-level limit. A utility account may hold only one open Meadowlark subscription
    per project, counting every Meadowlark subscription line. An enrollment that would exceed either limit
    is declined; an existing subscription on the same project and utility account is changed through an
    allocation increase instead. Closed subscriptions never count.
  eligibility:
  - id: one_per_project_account
    applies_to: [home_enrolled]
    kind: dedup
    condition: >-
      A utility account may hold only one open Meadowlark subscription per project, counting every Meadowlark
      subscription line.
    evidence_fields: [home_subscriptions.utility_account_id, home_subscriptions.project_id, home_subscriptions.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.utility_account_id, home_subscriptions.project_id]
      action_bindings: {home_subscriptions.utility_account_id: utility_account_id, home_subscriptions.project_id: project_id}
    dedup_contract:
      table: home_subscriptions
      mode: separate_record
      object_bindings: {utility_account_id: utility_account_id, project_id: project_id}
      duplicate_filters:
        status: [applied, allocated, active, transfer_pending, notice_given]
      distinct_fields: []
  params: {max_per_customer: 3}
- id: home_agg_account_sizing
  subject: [home_enrolled, home_allocation_approved, home_allocation_filed]
  rule: >-
    Sizing is decided per utility account across every Meadowlark subscription line, residential, business,
    income-eligible, fixed-rate, agricultural and civic alike. The expected annual production of a share
    is its allocation_kw (contract_kw while not yet filed) multiplied by the project's expected_yield_kwh_per_kw;
    the account's expected production is the sum over all of its open subscriptions in every line. The
    effective sizing cap is the lesser of the plan's sizing_cap_pct and Meadowlark's sizing ceiling for
    the project's program (program_sizing_ceiling_pct, set at or below each program's own subscription-size
    limit), and the sizing limit is that percent of the utility account's annual_usage_kwh. An enrollment,
    the initial filing and every increase filing may proceed only while the account's expected production
    after the filing stays at or below the sizing limit; otherwise the requested kW is cut to the largest
    multiple of allocation_increment_kw that fits, and when that is below min_allocation_kw (for an enrollment)
    or zero (for an increase) the request is declined. The usage figure may be used only when usage_as_of_month
    is no more than usage_data_max_age_months before the month of the decision; older usage must be refreshed
    from the utility before sizing. No single customer's open shares in one project may exceed project_share_limit_pct
    of the project's capacity_kw_ac, the single-subscriber limit Meadowlark applies under each program.
    Meadowlark files a share only for a utility account whose data_authorization_date is on file. Decreases,
    removals and reassignments are never limited by this policy.
  eligibility:
  - id: utility_data_authorized
    applies_to: [home_enrolled, home_allocation_approved, home_allocation_filed]
    kind: authorization
    condition: Meadowlark files a share only for a utility account whose data_authorization_date is on
      file.
    evidence_fields: [utility_accounts.data_authorization_date, utility_accounts.utility_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [utility_accounts.utility_account_id]
      action_bindings: {utility_accounts.utility_account_id: utility_account_id}
  params:
    program_sizing_ceiling_pct: {NY_VDER: 100, MN_CSG: 120, IL_SHINES: 100, MD_CS: 200}
    project_share_limit_pct: {NY_VDER: 40, MN_CSG: 40, IL_SHINES: 40, MD_CS: 40}
    per_tier:
      Meadowlark Flex 5: {sizing_cap_pct: =sizing_cap_pct, allocation_increment_kw: =allocation_increment_kw,
        min_allocation_kw: =min_allocation_kw, usage_data_max_age_months: =usage_data_max_age_months}
      Meadowlark Standard 10: {sizing_cap_pct: =sizing_cap_pct, allocation_increment_kw: =allocation_increment_kw,
        min_allocation_kw: =min_allocation_kw, usage_data_max_age_months: =usage_data_max_age_months}
      Meadowlark Commit 3: {sizing_cap_pct: =sizing_cap_pct, allocation_increment_kw: =allocation_increment_kw,
        min_allocation_kw: =min_allocation_kw, usage_data_max_age_months: =usage_data_max_age_months}
      Meadowlark Commit 5: {sizing_cap_pct: =sizing_cap_pct, allocation_increment_kw: =allocation_increment_kw,
        min_allocation_kw: =min_allocation_kw, usage_data_max_age_months: =usage_data_max_age_months}
      Meadowlark Commit 10: {sizing_cap_pct: =sizing_cap_pct, allocation_increment_kw: =allocation_increment_kw,
        min_allocation_kw: =min_allocation_kw, usage_data_max_age_months: =usage_data_max_age_months}
      Meadowlark Commit 20: {sizing_cap_pct: =sizing_cap_pct, allocation_increment_kw: =allocation_increment_kw,
        min_allocation_kw: =min_allocation_kw, usage_data_max_age_months: =usage_data_max_age_months}
- id: home_enrollment
  subject: [home_enrolled, home_application_declined, home_allocation_approved]
  rule: >-
    An application for a Residential Community Solar Subscriptions plan is accepted when the customer's
    customer_type is one of the plan's eligible_customer_types, the project's program is one of the plan's
    eligible_programs, the utility account is held in the customer's name (utility_accounts.customer_id)
    with the same utility as the project, its annual_usage_kwh is at least min_annual_usage_kwh, and contract_kw
    lies between min_allocation_kw and max_allocation_kw as a multiple of allocation_increment_kw. Meadowlark
    enrolls a share only on a utility account whose account_status is active. The project must be operating
    or under construction and its unallocated_kw must cover contract_kw; when it does not, the application
    is declined and the customer may join the line's waitlist class. The billing type chosen must be one
    the plan offers and, for consolidated billing, one the project's program supports (see home_billing_arrangement).  A
    utility account that holds an open Meadowlark Access subscription may not enroll in a residential
    plan; the household converts to Access instead (see access_enrollment). The plan named in variant_name
    is fixed for the life of the agreement; Meadowlark does not change the plan of an open subscription.
    An application that fails any requirement is declined with closure_reason application_declined. The
    initial allocation filing is approved no earlier than the first calendar day after the rescission
    period that starts when the subscriber signs the agreement has ended. Business days are Monday through
    Friday excluding US federal holidays; the signing day is not counted and the rescission period ends
    at the end of the last of its business days. On approval the initial filing of contract_kw is made
    under the filing calendar of home_allocation_change, after the sizing check of home_agg_account_sizing.
  eligibility:
  - id: account_active
    applies_to: [home_enrolled, home_allocation_approved]
    kind: state
    condition: Meadowlark enrolls a share only on a utility account whose account_status is active.
    evidence_fields: [utility_accounts.account_status, utility_accounts.utility_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [utility_accounts.utility_account_id]
      action_bindings: {utility_accounts.utility_account_id: utility_account_id}
    state_contract:
      field: utility_accounts.account_status
      allowed: [active]
  - id: after_rescission_period
    applies_to: [home_allocation_approved]
    kind: time
    condition: >-
      The initial allocation filing is approved no earlier than the first calendar day after the rescission
      period that starts when the subscriber signs the agreement has ended.
    evidence_fields: [home_subscriptions.signed_date, home_subscriptions.home_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.home_sub_id]
      action_bindings: {home_subscriptions.home_sub_id: home_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the subscriber signs the agreement
      anchor_source: home_subscriptions.signed_date
      relation: not_before
      duration_source: variants.rescission_business_days
      unit: business_days
      counting_rule: >-
        Business days are Monday through Friday excluding US federal holidays; the signing day is not
        counted and the rescission period ends at the end of the last of its business days.
      boundary: exclusive
  params:
    per_tier:
      Meadowlark Flex 5: {eligible_customer_types: =eligible_customer_types, eligible_programs: =eligible_programs,
        min_annual_usage_kwh: =min_annual_usage_kwh, min_allocation_kw: =min_allocation_kw, max_allocation_kw: =max_allocation_kw,
        credit_review_required: =credit_review_required, income_verification_required: =income_verification_required,
        utility_data_authorization_required: =utility_data_authorization_required}
      Meadowlark Standard 10: {eligible_customer_types: =eligible_customer_types, eligible_programs: =eligible_programs,
        min_annual_usage_kwh: =min_annual_usage_kwh, min_allocation_kw: =min_allocation_kw, max_allocation_kw: =max_allocation_kw,
        credit_review_required: =credit_review_required, income_verification_required: =income_verification_required,
        utility_data_authorization_required: =utility_data_authorization_required}
      Meadowlark Commit 3: {eligible_customer_types: =eligible_customer_types, eligible_programs: =eligible_programs,
        min_annual_usage_kwh: =min_annual_usage_kwh, min_allocation_kw: =min_allocation_kw, max_allocation_kw: =max_allocation_kw,
        credit_review_required: =credit_review_required, income_verification_required: =income_verification_required,
        utility_data_authorization_required: =utility_data_authorization_required}
      Meadowlark Commit 5: {eligible_customer_types: =eligible_customer_types, eligible_programs: =eligible_programs,
        min_annual_usage_kwh: =min_annual_usage_kwh, min_allocation_kw: =min_allocation_kw, max_allocation_kw: =max_allocation_kw,
        credit_review_required: =credit_review_required, income_verification_required: =income_verification_required,
        utility_data_authorization_required: =utility_data_authorization_required}
      Meadowlark Commit 10: {eligible_customer_types: =eligible_customer_types, eligible_programs: =eligible_programs,
        min_annual_usage_kwh: =min_annual_usage_kwh, min_allocation_kw: =min_allocation_kw, max_allocation_kw: =max_allocation_kw,
        credit_review_required: =credit_review_required, income_verification_required: =income_verification_required,
        utility_data_authorization_required: =utility_data_authorization_required}
      Meadowlark Commit 20: {eligible_customer_types: =eligible_customer_types, eligible_programs: =eligible_programs,
        min_annual_usage_kwh: =min_annual_usage_kwh, min_allocation_kw: =min_allocation_kw, max_allocation_kw: =max_allocation_kw,
        credit_review_required: =credit_review_required, income_verification_required: =income_verification_required,
        utility_data_authorization_required: =utility_data_authorization_required}
- id: home_rescission
  subject: [home_rescinded]
  rule: >-
    Every Residential Community Solar Subscriptions agreement, whatever the signing channel, carries a
    rescission period of rescission_business_days business days, at least as generous as the federal Cooling-Off
    Rule for agreements signed at the home and extended by Meadowlark to every channel. A rescission is
    honoured when it is received no later than the last business day of the rescission period that starts
    when the subscriber signs the agreement. Business days are Monday through Friday excluding US federal
    holidays; the signing day is not counted and the rescission period ends at the end of the last of
    its business days. A rescission closes the application with closure_reason rescinded, no fee of any
    kind and no filing. After the rescission period the subscriber cancels under home_cancellation instead.
  eligibility:
  - id: within_rescission_period
    applies_to: [home_rescinded]
    kind: time
    condition: >-
      A rescission is honoured when it is received no later than the last business day of the rescission
      period that starts when the subscriber signs the agreement.
    evidence_fields: [home_subscriptions.signed_date, home_subscriptions.home_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.home_sub_id]
      action_bindings: {home_subscriptions.home_sub_id: home_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the subscriber signs the agreement
      anchor_source: home_subscriptions.signed_date
      relation: not_after
      duration_source: variants.rescission_business_days
      unit: business_days
      counting_rule: >-
        Business days are Monday through Friday excluding US federal holidays; the signing day is not
        counted and the rescission period ends at the end of the last of its business days.
      boundary: inclusive
  params:
    per_tier:
      Meadowlark Flex 5: {rescission_business_days: =rescission_business_days}
      Meadowlark Standard 10: {rescission_business_days: =rescission_business_days}
      Meadowlark Commit 3: {rescission_business_days: =rescission_business_days}
      Meadowlark Commit 5: {rescission_business_days: =rescission_business_days}
      Meadowlark Commit 10: {rescission_business_days: =rescission_business_days}
      Meadowlark Commit 20: {rescission_business_days: =rescission_business_days}
- id: home_evt_subscription_charge
  subject: [home_credit_posted, home_charge_billed, home_activated]
  rule: >-
    The charge for a posted credit statement equals its credit_value multiplied by (100 minus savings_rate_pct)
    and divided by 100, rounded half up to the cent; the savings rate is that of the subscription's plan
    (variant_name). The whole credit_value is priced whether the utility applied it to that month's bill
    or banked part of it (banked_value). Each posted credit statement line is priced by exactly one actual
    subscription charge. A subscription charge is billed only on a subscription in allocated, active,
    transfer_pending, notice_given or closed status. The charge is invoiced invoice_issue_days_after_posting
    calendar days after the credit's posted_date and falls due invoice_due_days calendar days after the
    invoice date; its billing_type is the subscription's billing_type on the invoice date. Under consolidated
    billing the utility nets the charge on its own bill and remits it to Meadowlark, which records the
    remittance as a payment by utility_remittance. The first posted credit activates the subscription:
    activation_date is its posted_date and term_end_date is activation_date plus term_months less one
    day (empty when term_months is 0). Credits for statement months before closing that post after the
    closed_date are priced the same way. Estimates: when estimated_billing_allowed is true and no credit
    has posted for a statement month estimate_wait_days calendar days after that month ends, an estimated
    charge equal to the average of the last estimate_basis_months actual charges, rounded half up to the
    cent, may be billed with charge_basis estimated and no credit reference; no more than max_consecutive_estimates
    estimates may be billed in a row (the run is measured by home_msr_consecutive_estimates). When the
    late statement posts, its actual charge is billed and the estimate is offset in full by a billing
    credit with credit_reason estimate_trueup referring to the estimate.
  eligibility:
  - id: one_charge_per_credit
    applies_to: [home_charge_billed]
    kind: dedup
    condition: Each posted credit statement line is priced by exactly one actual subscription charge.
    evidence_fields: [home_billing.home_credit_id, home_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_billing.home_credit_id]
      action_bindings: {home_billing.home_credit_id: home_credit_id}
    dedup_contract:
      table: home_billing
      mode: separate_record
      object_bindings: {home_credit_id: home_credit_id}
      duplicate_filters:
        event_type: [home_charge_billed]
      distinct_fields: []
  - id: billable_status
    applies_to: [home_charge_billed]
    kind: state
    condition: >-
      A subscription charge is billed only on a subscription in allocated, active, transfer_pending, notice_given
      or closed status.
    evidence_fields: [home_subscriptions.status, home_subscriptions.home_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.home_sub_id]
      action_bindings: {home_subscriptions.home_sub_id: home_sub_id}
    state_contract:
      field: home_subscriptions.status
      allowed: [allocated, active, transfer_pending, notice_given, closed]
  params:
    per_tier:
      Meadowlark Flex 5: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct, fixed_rate_per_kwh: =fixed_rate_per_kwh,
        annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding, invoice_issue_days_after_posting: =invoice_issue_days_after_posting,
        invoice_due_days: =invoice_due_days, estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
      Meadowlark Standard 10: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct, fixed_rate_per_kwh: =fixed_rate_per_kwh,
        annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding, invoice_issue_days_after_posting: =invoice_issue_days_after_posting,
        invoice_due_days: =invoice_due_days, estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
      Meadowlark Commit 3: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct, fixed_rate_per_kwh: =fixed_rate_per_kwh,
        annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding, invoice_issue_days_after_posting: =invoice_issue_days_after_posting,
        invoice_due_days: =invoice_due_days, estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
      Meadowlark Commit 5: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct, fixed_rate_per_kwh: =fixed_rate_per_kwh,
        annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding, invoice_issue_days_after_posting: =invoice_issue_days_after_posting,
        invoice_due_days: =invoice_due_days, estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
      Meadowlark Commit 10: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct, fixed_rate_per_kwh: =fixed_rate_per_kwh,
        annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding, invoice_issue_days_after_posting: =invoice_issue_days_after_posting,
        invoice_due_days: =invoice_due_days, estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
      Meadowlark Commit 20: {pricing_method: =pricing_method, savings_rate_pct: =savings_rate_pct, fixed_rate_per_kwh: =fixed_rate_per_kwh,
        annual_escalator_pct: =annual_escalator_pct, charge_rounding: =charge_rounding, invoice_issue_days_after_posting: =invoice_issue_days_after_posting,
        invoice_due_days: =invoice_due_days, estimated_billing_allowed: =estimated_billing_allowed, estimate_wait_days: =estimate_wait_days,
        estimate_basis_months: =estimate_basis_months, max_consecutive_estimates: =max_consecutive_estimates,
        term_months: =term_months}
  formula: {amount: 'round(credit_value * (100 - savings_rate_pct) / 100, 2)'}
  measures: [home_msr_consecutive_estimates]
- id: home_evt_credit_correction
  subject: [home_credit_reversed, home_billing_credited]
  rule: >-
    When the utility reverses a posted credit, the subscription charge that priced that credit line is
    offset by a billing credit equal to that charge's full amount, with credit_reason credit_reversal_correction,
    referring to the charge and carrying the reversed credit line. A reversed credit statement line is
    offset by exactly one reversal-correction billing credit. A late fee already assessed on the offset
    charge is offset by its own billing credit with credit_reason fee_waiver. A corrected credit the utility
    posts afterwards is a new posting priced under home_evt_subscription_charge. A charge Meadowlark billed
    at a wrong amount for its own reasons (wrong plan rate, wrong credit line) is corrected by a billing
    credit with credit_reason billing_error for the overbilled difference only; Meadowlark issues no supplemental
    charge for its own underbilling. A billing dispute received as a request is decided within dispute_resolution_days
    of its received_date; while it is open, when dispute_late_fee_hold is true, no late fee is assessed
    on the disputed line. Billing credits never carry a negative amount and never exceed the line they
    correct.
  eligibility:
  - id: one_correction_per_reversal
    applies_to: [home_billing_credited]
    kind: dedup
    condition: A reversed credit statement line is offset by exactly one reversal-correction billing credit.
    evidence_fields: [home_billing.home_credit_id, home_billing.credit_reason]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_billing.home_credit_id]
      action_bindings: {home_billing.home_credit_id: home_credit_id}
    dedup_contract:
      table: home_billing
      mode: separate_record
      object_bindings: {home_credit_id: home_credit_id}
      duplicate_filters:
        credit_reason: [credit_reversal_correction]
      distinct_fields: []
  params:
    per_tier:
      Meadowlark Flex 5: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
      Meadowlark Standard 10: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
      Meadowlark Commit 3: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
      Meadowlark Commit 5: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
      Meadowlark Commit 10: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
      Meadowlark Commit 20: {dispute_late_fee_hold: =dispute_late_fee_hold, dispute_resolution_days: =dispute_resolution_days}
- id: home_evt_payment_application
  subject: [home_payment_received, home_payment_returned, home_returned_fee_assessed]
  rule: >-
    Payments settle open charge and fee lines of the same subscription in payment_application_order: the
    line with the earliest due_date first, and among lines due the same day charges before fees, then
    by bill_date. Meadowlark representatives never take card or bank account numbers; dual-billed balances
    are paid by the subscriber through the secure payment portal (ach or card) or by mailed check, using
    only methods in payment_methods. Under consolidated billing the utility's remittance is the only payment
    of the charge, recorded with payment_method utility_remittance. When a dual-billed payment is returned
    unpaid, its amount is restored to the balance by a payment_returned line referring to the payment,
    and the lines it had settled are open again from their original due dates. A returned-payment fee
    is assessed at most once per returned payment. The fee equals returned_payment_fee_usd and is due
    invoice_due_days after assessment; when returned_payment_fee_usd is 0.00 no fee line is written.
  eligibility:
  - id: one_fee_per_return
    applies_to: [home_returned_fee_assessed]
    kind: dedup
    condition: A returned-payment fee is assessed at most once per returned payment.
    evidence_fields: [home_billing.home_ref_bill_id, home_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_billing.home_ref_bill_id]
      action_bindings: {home_billing.home_ref_bill_id: home_ref_bill_id}
    dedup_contract:
      table: home_billing
      mode: separate_record
      object_bindings: {home_ref_bill_id: home_ref_bill_id}
      duplicate_filters:
        event_type: [home_returned_fee_assessed]
      distinct_fields: []
  params:
    per_tier:
      Meadowlark Flex 5: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
      Meadowlark Standard 10: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
      Meadowlark Commit 3: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
      Meadowlark Commit 5: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
      Meadowlark Commit 10: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
      Meadowlark Commit 20: {payment_methods: =payment_methods, payment_application_order: =payment_application_order,
        returned_payment_fee_usd: =returned_payment_fee_usd}
- id: home_evt_late_fee
  subject: [home_late_fee_assessed]
  rule: >-
    Late fees apply only to dual-billed subscription charges (never to consolidated-billed charges, fees,
    early termination fees or estimates later offset). A late fee may be assessed on a subscription charge
    only after the late fee grace period that starts when the overdue charge reaches its due_date has
    fully passed. Calendar days are counted from the day after due_date; the fee may be assessed from
    the day after the last grace day. The fee is the unpaid amount of that one charge on the assessment
    date (home_msr_unpaid_on_charge) multiplied by late_fee_pct and divided by 100, rounded half up to
    the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher. At most
    one late fee is assessed per charge. No fee is written when late_fee_pct is 0.0, when the charge is
    fully paid or credited by the assessment date, or when the charge is under an open billing dispute
    and dispute_late_fee_hold is true.
  eligibility:
  - id: after_grace
    applies_to: [home_late_fee_assessed]
    kind: time
    condition: >-
      A late fee may be assessed on a subscription charge only after the late fee grace period that starts
      when the overdue charge reaches its due_date has fully passed.
    evidence_fields: [home_billing.due_date, home_billing.home_bill_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_billing.home_bill_id]
      action_bindings: {home_billing.home_bill_id: home_ref_bill_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the overdue charge reaches its due_date
      anchor_source: home_billing.due_date
      relation: not_before
      duration_source: variants.late_fee_grace_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after due_date; the fee may be assessed from the day after
        the last grace day.
      boundary: exclusive
  - id: one_fee_per_charge
    applies_to: [home_late_fee_assessed]
    kind: dedup
    condition: At most one late fee is assessed per charge.
    evidence_fields: [home_billing.home_ref_bill_id, home_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_billing.home_ref_bill_id]
      action_bindings: {home_billing.home_ref_bill_id: home_ref_bill_id}
    dedup_contract:
      table: home_billing
      mode: separate_record
      object_bindings: {home_ref_bill_id: home_ref_bill_id}
      duplicate_filters:
        event_type: [home_late_fee_assessed]
      distinct_fields: []
  params:
    per_tier:
      Meadowlark Flex 5: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct, late_fee_min_usd: =late_fee_min_usd,
        late_fee_max_usd: =late_fee_max_usd}
      Meadowlark Standard 10: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct,
        late_fee_min_usd: =late_fee_min_usd, late_fee_max_usd: =late_fee_max_usd}
      Meadowlark Commit 3: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct, late_fee_min_usd: =late_fee_min_usd,
        late_fee_max_usd: =late_fee_max_usd}
      Meadowlark Commit 5: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct, late_fee_min_usd: =late_fee_min_usd,
        late_fee_max_usd: =late_fee_max_usd}
      Meadowlark Commit 10: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct, late_fee_min_usd: =late_fee_min_usd,
        late_fee_max_usd: =late_fee_max_usd}
      Meadowlark Commit 20: {late_fee_grace_days: =late_fee_grace_days, late_fee_pct: =late_fee_pct, late_fee_min_usd: =late_fee_min_usd,
        late_fee_max_usd: =late_fee_max_usd}
  formula: {amount: 'min(late_fee_max_usd, max(late_fee_min_usd, round(home_msr_unpaid_on_charge * late_fee_pct
      / 100, 2)))'}
  measures: [home_msr_unpaid_on_charge]
- id: home_allocation_change
  subject: [home_allocation_filed, home_allocation_reduced, home_change_fee_assessed]
  rule: >-
    Filing calendar (the single calendar for every allocation filing of this line): for a monthly program,
    a request received on or before the program's cutoff_day of a month is filed in that month and takes
    effect on the first day of the following month, and a request received after the cutoff_day is filed
    in the following month; for a quarterly program, filings are made only in the last month of a calendar
    quarter (March, June, September, December), a request received on or before the cutoff_day of that
    month is filed in it and takes effect on the first day of the next quarter, and a later request waits
    for the next quarter's filing. The utility applies a filing from the first billing cycle that begins
    on or after its effective date. Subscriber-requested increases and decreases are received as requests
    and filed under this calendar. A subscriber-requested allocation change is filed only when its request's
    received_date is at least min_months_before_first_change whole calendar months after the first bill
    credit posts on the subscription (the activation_date). Months are counted as calendar months from
    the activation_date; when the target month has no such day, the last day of that month is used. An
    allocation increase is filed only on a subscription in allocated or active status. An allocation reduction
    is filed only on a subscription in active, transfer_pending, notice_given or closed status. At most
    allocation_changes_per_contract_year subscriber-requested changes are filed in one contract year (home_msr_subscriber_changes_contract_year
    counts increases and decreases alike); contract years run from the activation_date. Every requested
    kW figure is sized down to a whole multiple of allocation_increment_kw. An increase is limited by
    the sizing check of home_agg_account_sizing and by the project's unallocated_kw; the part the project
    cannot fill is not filed, and when increase_waitlist_when_full is true the subscriber may queue it
    on the waitlist. A decrease may not leave less than min_allocation_kw (a subscriber wanting less cancels
    instead). Subscriber decreases in one contract year up to max_decrease_pct_per_contract_year of the
    allocation_kw held on the first day of that contract year carry no fee (home_msr_subscriber_decrease_kw_contract_year
    totals them); each kW removed beyond that allowance is charged excess_decrease_fee_per_kw_usd, assessed
    once per decrease request on the filing's effective_date and due invoice_due_days later. Company-initiated
    lines (initial filing, annual resize, move resize, removals) never count toward the allowance, the
    yearly change limit or the fee.
  eligibility:
  - id: first_change_wait
    applies_to: [home_allocation_filed, home_allocation_reduced]
    kind: time
    condition: >-
      A subscriber-requested allocation change is filed only when its request's received_date is at least
      min_months_before_first_change whole calendar months after the first bill credit posts on the subscription
      (the activation_date).
    evidence_fields: [home_subscriptions.activation_date, home_requests.received_date, home_subscriptions.home_sub_id,
      home_requests.home_request_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.home_sub_id, home_requests.home_request_id]
      action_bindings: {home_subscriptions.home_sub_id: home_sub_id, home_requests.home_request_id: home_request_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the first bill credit posts on the subscription
      anchor_source: home_subscriptions.activation_date
      relation: not_before
      duration_source: variants.min_months_before_first_change
      unit: calendar_months
      counting_rule: >-
        Months are counted as calendar months from the activation_date; when the target month has no such
        day, the last day of that month is used.
      boundary: inclusive
  - id: increase_status
    applies_to: [home_allocation_filed]
    kind: state
    condition: An allocation increase is filed only on a subscription in allocated or active status.
    evidence_fields: [home_subscriptions.status, home_subscriptions.home_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.home_sub_id]
      action_bindings: {home_subscriptions.home_sub_id: home_sub_id}
    state_contract:
      field: home_subscriptions.status
      allowed: [allocated, active]
  - id: reduction_status
    applies_to: [home_allocation_reduced]
    kind: state
    condition: >-
      An allocation reduction is filed only on a subscription in active, transfer_pending, notice_given
      or closed status.
    evidence_fields: [home_subscriptions.status, home_subscriptions.home_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.home_sub_id]
      action_bindings: {home_subscriptions.home_sub_id: home_sub_id}
    state_contract:
      field: home_subscriptions.status
      allowed: [active, transfer_pending, notice_given, closed]
  params:
    filing_calendar:
      NY_VDER: {cadence: monthly, cutoff_day: 15}
      MN_CSG: {cadence: monthly, cutoff_day: 10}
      IL_SHINES: {cadence: quarterly, cutoff_day: 15}
      MD_CS: {cadence: monthly, cutoff_day: 20}
    per_tier:
      Meadowlark Flex 5: {allocation_changes_per_contract_year: =allocation_changes_per_contract_year,
