      baseline: {st_amt: "0", st_n: "0"}
      evidence: [history]
      cross_difficulty: null
    - id: est_reversals
      effect: method
      decides: rev_amt
      bindings: [rev_cr, rev_cnt, rev_ext_sum, rev_ext_n, rev_dn, rev_amt]
      ladder:
      - when: "reversal-correction credits were posted in the estimate window and at least two actual charges remain once the offset charges are left out"
        method: "the offset charges are left out (their sum and their number taken off)"
      - when: "such credits were posted and fewer than two actual charges would remain"
        method: "the offset charges are left out and the actual charges invoiced exactly basis_window_months whole months before today are taken in"
      - when: "otherwise"
        method: "nothing is taken off for reversals"
      baseline: {rev_amt: "0", rev_dn: "0"}
      evidence: [history]
      cross_difficulty: null
    - id: est_unpriced_line
      effect: parameter
      decides: un_weight
      bindings: [un_id, un_month, un_priced, un_value, un_est, un_weight]
      ladder:
      - when: "the latest posted credit line is not yet priced by a charge and its statement month already carries an estimated charge"
        value: "K('unpriced_weight_late')"
      - when: "it is not yet priced and its statement month carries no estimated charge"
        value: "1"
      - when: "otherwise"
        value: "0"
      baseline: {un_weight: "0"}
      evidence: [history]
      cross_difficulty: null
    - id: est_season
      effect: parameter
      decides: sea_weight
      bindings: [sea_hist_n, sea_ref_sum, sea_ref_n, sea_ref, sea_weight]
      ladder:
      - when: "at least season_history_long actual charges on record and an actual charge invoiced exactly season_lookback_months whole months before today"
        value: "K('season_weight_long')"
      - when: "at least season_history_short but fewer than season_history_long actual charges on record and such a same-season charge"
        value: "K('season_weight_short')"
      - when: "otherwise"
        value: "0"
      baseline: {sea_weight: "0"}
      evidence: [history, date]
      cross_difficulty: null
    - id: est_capacity
      effect: method
      decides: cap_ratio
      bindings: [cap_inc_eff, cap_dec_eff, cap_eff, cap_age, cap_in, cap_post_sum, cap_post_n, cap_kw_held, cap_kw_net_win, cap_ratio]
      ladder:
      - when: "the latest subscriber increase or decrease took effect (effective_date on or before today) within the estimate window and an actual charge was invoiced fewer than N whole months before today (N one less than the whole months since that effective_date)"
        method: "the capacity ratio is the average of those later actual charges divided by the average of every actual charge in the estimate window"
      - when: "the latest subscriber change took effect within the window and no such later actual charge exists"
        method: "the capacity ratio is the kW held divided by the kW held before the window's changes"
      - when: "otherwise"
        method: "the capacity ratio is 1"
      baseline: {cap_ratio: "1"}
      evidence: [history, date]
      cross_difficulty: null
    - id: est_credit_rate
      effect: parameter
      decides: rate_weight
      bindings: [rate_last_cv, rate_last_kwh, rate_win_cv, rate_win_kwh, rate_change, rate_weight]
      ladder:
      - when: "the latest credit rate differs from the window credit rate by at least rate_band_wide_pct percent up or down"
        value: "1"
      - when: "it differs by at least rate_band_narrow_pct but less than rate_band_wide_pct percent up or down"
        value: "K('rate_weight_narrow')"
      - when: "otherwise"
        value: "0"
      baseline: {rate_weight: "0"}
      evidence: [history]
      cross_difficulty: null
    baseline:
      rule: >-
        The estimate window holds the actual subscription charges whose bill_date lies fewer than basis_window_months whole
        months before today (whole months counted from the bill_date to today, a month ending on the same day of the month).
        The estimate basis is the average of the actual charges in the estimate window, and the estimated charge is the estimate
        basis rounded half up to the cent; when the estimate window holds no actual charge the estimated charge is 0.00 and no
        estimate is billed.
      params: [basis_window_months]
    prerequisite: []
    cross_category: []
