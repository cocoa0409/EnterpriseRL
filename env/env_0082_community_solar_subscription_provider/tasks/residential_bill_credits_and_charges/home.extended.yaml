- id: home_transfer_at_move
  subject: [home_transfer_requested, home_transfer_completed, home_transfer_lapsed, home_allocation_reassigned,
    home_successor_assigned]
  rule: >-
    A subscriber who moves may keep the share by transferring it to a new utility account in their own
    name. A move transfer is accepted only when its request is received no later than transfer_window_days
    calendar days after the move-out date the subscriber states. Calendar days are counted from the day
    after the stated move-out date; the last window day still qualifies. The new account must be on file,
    active, carry a data_authorization_date and be served by the same utility as the project, because
    an allocation can only be credited inside the project's utility territory. The reassignment is filed
    under the filing calendar of home_allocation_change, counted from the request's received_date, and
    the subscription returns to active on its effective date with the new utility_account_id. When transfer_resize_to_new_usage
    is true and the new account's sizing limit (home_agg_account_sizing) is below the share's expected
    production, the excess kW, sized up to a whole multiple of allocation_increment_kw, is removed in
    the same filing as a move_resize reduction, without fee and outside the yearly change allowance; when
    the remaining share would be below min_allocation_kw the transfer is not completed. Credits for statement
    months before the reassignment take effect are priced normally. When the new address is served by
    a different utility, or no qualifying new account is supplied within the window, the transfer lapses:
    the share is removed under the filing calendar and the subscription closes with closure_reason moved_out_of_territory
    (different utility) or transfer_not_completed; the early termination fee of home_cancellation applies
    unless waived there. A subscriber leaving the territory may join the Relocation Priority Waitlist
    for a Meadowlark project serving the new utility. When successor_transfer_allowed is true, the subscriber
    may instead assign the agreement to a successor who meets the plan's enrollment requirements on the
    same project; the successor signs a new agreement on the same plan for the remaining term, and the
    original closes with closure_reason successor_transfer.
  eligibility:
  - id: within_transfer_window
    applies_to: [home_transfer_requested, home_transfer_completed]
    kind: time
    condition: >-
      A move transfer is accepted only when its request is received no later than transfer_window_days
      calendar days after the move-out date the subscriber states.
    evidence_fields: [home_subscriptions.move_out_date, home_requests.received_date, home_subscriptions.home_sub_id,
      home_requests.home_request_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.home_sub_id, home_requests.home_request_id]
      action_bindings: {home_subscriptions.home_sub_id: home_sub_id, home_requests.home_request_id: home_request_id}
    temporal_basis: {clock: frozen_time, anchor_event: the move-out date the subscriber states, anchor_source: home_subscriptions.move_out_date,
      relation: not_after, duration_source: variants.transfer_window_days, unit: calendar_days, counting_rule: Calendar
        days are counted from the day after the stated move-out date; the last window day still qualifies.,
      boundary: inclusive}
  params:
    per_tier:
      Meadowlark Flex 5: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Meadowlark Standard 10: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Meadowlark Commit 3: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Meadowlark Commit 5: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Meadowlark Commit 10: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
      Meadowlark Commit 20: {transfer_window_days: =transfer_window_days, successor_transfer_allowed: =successor_transfer_allowed,
        transfer_resize_to_new_usage: =transfer_resize_to_new_usage, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move}
- id: home_cancellation
  subject: [home_notice_given, home_notice_withdrawn, home_closed, home_preactivation_cancelled, home_etf_assessed]
  rule: >-
    A subscriber may cancel at any time by notice. A cancellation removal takes effect no earlier than
    cancellation_notice_days calendar days after the subscriber gives notice of cancellation. Calendar
    days are counted from the day after the notice_date; the removal may take effect on the last notice
    day. The scheduled_end_date is the effective date of the first filing under the filing calendar of
    home_allocation_change whose effective date falls on or after the notice_date plus cancellation_notice_days;
    the removal is filed for that date and the subscription closes on it. A notice may be withdrawn up
    to the cutoff day of the filing that would carry the removal. Before activation (status allocated)
    the subscriber cancels without notice period, the removal is filed in the next filing and preactivation_cancel_fee_usd
    is the only fee (none when 0.00). Early termination fee: when term_months is greater than 0 and the
    closing date is on or before term_end_date, the fee is allocation_kw held on the day before closing
    multiplied by etf_per_kw_per_remaining_year_usd and by the remaining contract years (home_msr_remaining_contract_years:
    contract years from the closing date through term_end_date, a part year counting as a whole year),
    rounded half up to the cent and limited to etf_cap_usd; it is assessed on the closing date and due
    invoice_due_days later. An early termination fee is assessed at most once per subscription. No fee
    applies after the term, on plans without a term, when etf_waiver_deceased is true and the subscription
    closes with closure_reason deceased on notice from the estate, when etf_waiver_out_of_territory_move
    is true and the subscription closes with closure_reason moved_out_of_territory, or when etf_waiver_successor_transfer
    is true and it closes with closure_reason successor_transfer. When a residential subscription closes
    because the same utility account converts to a Meadowlark Access plan, it closes with closure_reason
    converted_to_access on the date the Access share takes effect and no early termination fee applies.
    Credits for statement months up to the closing date that post later are priced normally; a balance
    left after closing remains due.
  eligibility:
  - id: notice_period_served
    applies_to: [home_closed]
    kind: time
    condition: >-
      A cancellation removal takes effect no earlier than cancellation_notice_days calendar days after
      the subscriber gives notice of cancellation.
    evidence_fields: [home_subscriptions.notice_date, home_subscriptions.home_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.home_sub_id]
      action_bindings: {home_subscriptions.home_sub_id: home_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the subscriber gives notice of cancellation
      anchor_source: home_subscriptions.notice_date
      relation: not_before
      duration_source: variants.cancellation_notice_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the notice_date; the removal may take effect on the
        last notice day.
      boundary: inclusive
  - id: one_etf
    applies_to: [home_etf_assessed]
    kind: dedup
    condition: An early termination fee is assessed at most once per subscription.
    evidence_fields: [home_billing.home_sub_id, home_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_billing.home_sub_id]
      action_bindings: {home_billing.home_sub_id: home_sub_id}
    dedup_contract:
      table: home_billing
      mode: separate_record
      object_bindings: {home_sub_id: home_sub_id}
      duplicate_filters:
        event_type: [home_etf_assessed]
      distinct_fields: []
  params:
    per_tier:
      Meadowlark Flex 5: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Meadowlark Standard 10: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Meadowlark Commit 3: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Meadowlark Commit 5: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Meadowlark Commit 10: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
      Meadowlark Commit 20: {cancellation_notice_days: =cancellation_notice_days, preactivation_cancel_fee_usd: =preactivation_cancel_fee_usd,
        term_months: =term_months, post_term_renewal: =post_term_renewal, etf_per_kw_per_remaining_year_usd: =etf_per_kw_per_remaining_year_usd,
        etf_cap_usd: =etf_cap_usd, etf_waiver_deceased: =etf_waiver_deceased, etf_waiver_out_of_territory_move: =etf_waiver_out_of_territory_move,
        etf_waiver_successor_transfer: =etf_waiver_successor_transfer}
  formula:
    amount: >-
      min(etf_cap_usd, round(allocation_kw * etf_per_kw_per_remaining_year_usd * home_msr_remaining_contract_years,
      2))
  measures: [home_msr_remaining_contract_years]
- id: home_evt_annual_trueup
  subject: [home_trueup_completed]
  rule: >-
    When annual_review_enabled is true Meadowlark completes a true-up for every contract year. A contract
    year's true-up is completed no earlier than the anniversary that ends that year, counted from the
    day the first bill credit posts on the subscription. Contract year n ends on the activation_date plus
    n times review_interval_months calendar months; when that month has no such day, the last day of the
    month is used. Each contract year of a subscription is reviewed exactly once. The review period is
    the twelve statement months ending with the month before the anniversary month. credited_kwh_12m and
    the net credit value are postings less reversals over the period (home_msr_net_credited_kwh_period,
    home_msr_net_credit_value_period); avg_credit_rate is the net credit value divided by credited_kwh_12m,
    rounded half up to four decimals; usage_kwh_12m is the utility account's reported usage for the same
    months. Production guarantee: when production_guarantee_pct is greater than 0, guaranteed_kwh is allocation_kw
    on the review_date multiplied by the project's expected_yield_kwh_per_kw and by production_guarantee_pct
    divided by 100, rounded half up to a whole kWh, and shortfall_kwh is guaranteed_kwh less credited_kwh_12m
    when positive. The guarantee is not assessed (guaranteed_kwh 0) for a year in which the subscription
    was not active for all twelve months, the utility account changed, or the allocation changed. The
    guarantee credit is shortfall_kwh multiplied by avg_credit_rate and by savings_rate_pct divided by
    100 (the savings the missing production would have earned), rounded half up to the cent. A guarantee
    credit is posted as a billing credit with credit_reason production_guarantee on the review_date. Right-sizing:
    when the share's expected annual production exceeds oversize_review_threshold_pct of usage_kwh_12m,
    resize_kw is the kW that must be removed so that the remaining share, a whole multiple of allocation_increment_kw,
    is the largest whose expected production does not exceed resize_target_pct of usage_kwh_12m, but never
    below min_allocation_kw; the removal is filed as annual_resize under the filing calendar without fee.
    The outcome records which of the two applied.
  eligibility:
  - id: after_anniversary
    applies_to: [home_trueup_completed]
    kind: time
    condition: >-
      A contract year's true-up is completed no earlier than the anniversary that ends that year, counted
      from the day the first bill credit posts on the subscription.
    evidence_fields: [home_subscriptions.activation_date, home_subscriptions.home_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.home_sub_id]
      action_bindings: {home_subscriptions.home_sub_id: home_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the first bill credit posts on the subscription
      anchor_source: home_subscriptions.activation_date
      relation: not_before
      duration_source: params.review_interval_months
      unit: calendar_months
      counting_rule: >-
        Contract year n ends on the activation_date plus n times review_interval_months calendar months;
        when that month has no such day, the last day of the month is used.
      boundary: inclusive
  - id: one_review_per_year
    applies_to: [home_trueup_completed]
    kind: dedup
    condition: Each contract year of a subscription is reviewed exactly once.
    evidence_fields: [home_reviews.home_sub_id, home_reviews.contract_year]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_reviews.home_sub_id, home_reviews.contract_year]
      action_bindings: {home_reviews.home_sub_id: home_sub_id, home_reviews.contract_year: contract_year}
    dedup_contract:
      table: home_reviews
      mode: separate_record
      object_bindings: {home_sub_id: home_sub_id, contract_year: contract_year}
      duplicate_filters:
        event_type: [home_trueup_completed]
      distinct_fields: []
  params:
    review_interval_months: 12
    per_tier:
      Meadowlark Flex 5: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Meadowlark Standard 10: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Meadowlark Commit 3: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Meadowlark Commit 5: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Meadowlark Commit 10: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
      Meadowlark Commit 20: {annual_review_enabled: =annual_review_enabled, production_guarantee_pct: =production_guarantee_pct,
        oversize_review_threshold_pct: =oversize_review_threshold_pct, resize_target_pct: =resize_target_pct,
        savings_rate_pct: =savings_rate_pct}
  formula: {shortfall_kwh: 'max(0, guaranteed_kwh - credited_kwh_12m)', guarantee_credit: 'round(shortfall_kwh
      * avg_credit_rate * savings_rate_pct / 100, 2)'}
  measures: [home_msr_net_credited_kwh_period, home_msr_net_credit_value_period]
- id: home_nonpayment_removal
  subject: [home_removed_nonpayment, home_removal_notice_sent]
  rule: >-
    Removal for nonpayment applies only to dual-billed subscriptions; consolidated-billed subscribers
    are never removed by Meadowlark for nonpayment because the utility collects the charge. A removal
    notice may be sent when a charge has remained unpaid for nonpayment_removal_days_past_due calendar
    days after its due_date and the past-due balance (home_msr_past_due_balance) is at least nonpayment_removal_min_balance_usd.
    A removal for nonpayment takes effect no earlier than removal_notice_days calendar days after Meadowlark
    sends the removal notice. Calendar days are counted from the day after the removal_notice_date; removal
    may occur on the last notice day. Payment of the whole past-due balance before the removal date clears
    the notice (removal_notice_date emptied) and no removal follows. A removal closes the subscription
    with closure_reason nonpayment_removal; the removal is filed under the filing calendar and the early
    termination fee of home_cancellation applies as for a cancellation closing on the removal date.
  eligibility:
  - id: removal_notice_served
    applies_to: [home_removed_nonpayment]
    kind: time
    condition: >-
      A removal for nonpayment takes effect no earlier than removal_notice_days calendar days after Meadowlark
      sends the removal notice.
    evidence_fields: [home_subscriptions.removal_notice_date, home_subscriptions.home_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.home_sub_id]
      action_bindings: {home_subscriptions.home_sub_id: home_sub_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: Meadowlark sends the removal notice
      anchor_source: home_subscriptions.removal_notice_date
      relation: not_before
      duration_source: variants.removal_notice_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the removal_notice_date; removal may occur on the
        last notice day.
      boundary: inclusive
  params:
    per_tier:
      Meadowlark Flex 5: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Meadowlark Standard 10: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Meadowlark Commit 3: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Meadowlark Commit 5: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Meadowlark Commit 10: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
      Meadowlark Commit 20: {nonpayment_removal_days_past_due: =nonpayment_removal_days_past_due, nonpayment_removal_min_balance_usd: =nonpayment_removal_min_balance_usd,
        removal_notice_days: =removal_notice_days}
  measures: [home_msr_past_due_balance]
- id: home_benefit_basis
  subject: [home_charge_billed, home_billing_credited]
  rule: >-
    Account-wide benefit rule, the same for every Meadowlark subscription line: a subscription's charges
    are priced only by its own plan's pricing (its savings_rate_pct, or its contract rate with escalator
    on fixed-rate plans); no promotion, referral reward, second subscription, waitlist reservation or
    other line's plan changes that price, and benefits never stack. Billing credits are separate ledger
    lines and never reduce a charge's own amount. Each subscription keeps its own ledger: a payment, credit
    or fee belongs only to the subscription it is recorded on and is never moved to another subscription
    or line.
  eligibility: []
- id: home_billing_arrangement
  subject: [home_billing_type_changed, home_enrolled]
  rule: >-
    Consolidated billing (utility net crediting) is available only for projects in a program listed in
    consolidated_billing_programs and only on plans whose billing_types_offered include it; every other
    subscription is dual billed. A change of billing arrangement is accepted only for a subscription in
    active status. A switch is requested by the subscriber and applies to charges invoiced on or after
    the first day of the month following the request's received_date; charges already invoiced keep their
    billing_type. Switching to consolidated billing requires that no dual-billed line is past due.
  eligibility:
  - id: switch_status
    applies_to: [home_billing_type_changed]
    kind: state
    condition: A change of billing arrangement is accepted only for a subscription in active status.
    evidence_fields: [home_subscriptions.status, home_subscriptions.home_sub_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [home_subscriptions.home_sub_id]
      action_bindings: {home_subscriptions.home_sub_id: home_sub_id}
    state_contract:
      field: home_subscriptions.status
      allowed: [active]
  params:
    consolidated_billing_programs: [NY_VDER]
    per_tier:
      Meadowlark Flex 5: {billing_types_offered: =billing_types_offered}
      Meadowlark Standard 10: {billing_types_offered: =billing_types_offered}
      Meadowlark Commit 3: {billing_types_offered: =billing_types_offered}
      Meadowlark Commit 5: {billing_types_offered: =billing_types_offered}
      Meadowlark Commit 10: {billing_types_offered: =billing_types_offered}
      Meadowlark Commit 20: {billing_types_offered: =billing_types_offered}
extended_policies:
  - id: home_ext_final_balance_payment
    base_policy_refs:
    - home_evt_payment_application
    - home_cancellation
    - home_benefit_basis
    overwrite:
    - base_policy: home_evt_payment_application
      superseded_clause: 'Payments settle open charge and fee lines of the same subscription in payment_application_order: the
        line with the earliest due_date first, and among lines due the same day charges before fees, then by bill_date.'
      replaced_by: 'For every payment on a residential subscription, and only for a payment, payments settle open charge and
        fee lines of the same subscription in payment_application_order: the line with the earliest due_date first, and among
        lines due the same day charges before fees, then by bill_date, except that a line named by an open billing dispute,
        and every late fee referring to it, is settled by no payment while the dispute is open; each payment line records as
        its billing_month the statement month of the oldest open line it settles.'
    trigger: on_request
    subject:
    - home_payment_received
    computes: amount
    target_tool: pay_final_balance_42abd449
    params:
      fee_share_access: 0.5
      fee_share_waitlist: 0.75
      fee_window_months: 1
      estimate_share_closed: 0.6
      estimate_share_notice: 0.8
      estimate_window_months: 3
    rule: 'A final-balance payment is the payment a subscriber makes on a call to settle what a subscription owes. Meadowlark
      representatives never take card or bank account numbers and no payment method is held on file: the subscriber pays personally
      through the secure payment portal, by ach or card. The payment is recorded on that subscription''s own ledger with billing_type
      dual. For every payment on a residential subscription, and only for a payment, payments settle open charge and fee lines
      of the same subscription in payment_application_order: the line with the earliest due_date first, and among lines due
      the same day charges before fees, then by bill_date, except that a line named by an open billing dispute, and every late
      fee referring to it, is settled by no payment while the dispute is open; each payment line records as its billing_month
      the statement month of the oldest open line it settles. The final-balance payment is fixed only after every statement
      month that ended the plan''s estimate wait or more calendar days ago without a posted credit carries an estimated subscription
      charge, wherever the estimating rule bills one for it. The final-balance payment is not fixed until the subscription''s
      latest-invoiced actual dual-billed charge, once its late-fee grace period has passed with the charge still unpaid, carries
      a late fee line referring to it, wherever the overdue-charge late fee rule writes one. The final-balance payment covers
      every open line: the sum of the subscription''s charge and fee lines plus every returned-payment line, less every payment
      received and every billing credit posted on the subscription, never below 0.00; the payment is that amount rounded half
      up to the cent. The final-balance payment''s dispute hold is settled by the most recently received billing dispute that
      is still open (outcome received; the latest received_date, the first on record among requests received the same day):
      when it names a subscription charge, the hold is that charge''s unpaid amount (its amount less the payments recorded for
      its statement month plus the returned payments recorded for that month, less the billing credits referring to it, never
      below 0.00) plus every late fee referring to it; when it names a fee line (a late fee, returned-payment fee, early termination
      fee or change fee), the hold is that fee''s amount less the billing credits referring to it, never below 0.00; when it
      names any other line (a payment, a returned payment or a billing credit) or no billing dispute is open, the hold is 0.00.
      The hold is deducted from the final-balance payment and stays open until the dispute is decided. The final-balance payment''s
      pending-statement addition is settled by the posted credit line with the latest posted_date (the first on record among
      lines posted the same day): when no subscription charge prices that line yet and its statement month carries an open estimate
      (estimated charges of that month less the estimate_trueup billing credits of that month) not held for a dispute, the addition
      is that line''s credit_value multiplied by (100 minus savings_rate_pct) and divided by 100, rounded half up to the cent,
      less that open estimate, which the coming charge replaces; when no charge prices that line yet and its statement month
      carries no such open estimate, the addition is that priced amount alone; otherwise the addition is 0.00. The addition
      is added to the final-balance payment, so that the charge invoiced for that credit is already paid when it is billed.
      The final-balance payment''s fee share is settled from the household''s income-eligibility records in Meadowlark''s other
      lines: when the customer holds a Meadowlark Access subscription in active status whose recert_due_date is on or after
      today, fee_share_access; when that does not hold and the customer holds an Income-Eligible Priority Waitlist reservation
      in queued or offered status on this subscription''s utility account, fee_share_waitlist; otherwise 1. The recent fee lines
      are the late fees and returned-payment fees with a bill_date fewer than fee_window_months whole months before today, other
      than a fee held for a dispute; the part of them beyond the fee share is deducted from the final-balance payment and stays
      open for a later payment. The final-balance payment''s estimate share is settled from the subscription''s status and its
      latest charge: when the status is closed and the latest subscription charge by bill_date (the first on record among charges
      invoiced the same day) is an estimated charge, estimate_share_closed; when the status is notice_given and the latest charge
      is an estimated charge, estimate_share_notice; otherwise 1. The open estimates are the estimated charges with a bill_date
      fewer than estimate_window_months whole months before today, less the billing credits with credit_reason estimate_trueup
      posted in the same period, less an estimate held for a dispute and less the open estimate of the statement month of an
      unpriced latest posted credit line, never below 0.00; the part of them beyond the estimate share is deducted from the
      final-balance payment and stays open until the utility statement posts. The final-balance payment is assembled once: the
      covered lines plus the pending-statement addition, less every deduction stated for it, each deduction taken once on its
      own lines and none applied to another, never below 0.00, rounded half up to the cent once at the end; the lines left open
      remain due on the subscription.'
    compute:
    - pay_chg: SUM('home_billing', 'amount', event_type='home_charge_billed')
    - pay_fees: SUM('home_billing', 'amount', event_type='home_late_fee_assessed') + SUM('home_billing', 'amount', event_type='home_returned_fee_assessed')
        + SUM('home_billing', 'amount', event_type='home_etf_assessed') + SUM('home_billing', 'amount', event_type='home_change_fee_assessed')
    - pay_ret: SUM('home_billing', 'amount', event_type='home_payment_returned')
    - pay_paid: SUM('home_billing', 'amount', event_type='home_payment_received')
    - pay_cr: SUM('home_billing', 'amount', event_type='home_billing_credited')
    - pay_open: MX(0, pay_chg + pay_fees + pay_ret - pay_paid - pay_cr)
    - hld_id: LATEST('home_requests', 'home_disputed_bill_id', date_field='received_date', request_type='billing_dispute', outcome='received')
        or 'none'
    - hld_kind: LATEST('home_billing', 'event_type', date_field='bill_date', home_bill_id=hld_id) or 'none'
    - hld_amt: SUM('home_billing', 'amount', home_bill_id=hld_id)
    - hld_month: LATEST('home_billing', 'billing_month', date_field='bill_date', home_bill_id=hld_id) or 'none'
    - hld_paid: SUM('home_billing', 'amount', event_type='home_payment_received', billing_month=hld_month) - SUM('home_billing',
        'amount', event_type='home_payment_returned', billing_month=hld_month)
    - hld_cr: SUM('home_billing', 'amount', event_type='home_billing_credited', home_ref_bill_id=hld_id)
    - hld_fees: SUM('home_billing', 'amount', event_type='home_late_fee_assessed', home_ref_bill_id=hld_id)
    - hld_hold: MX(0, hld_amt - hld_paid - hld_cr) + hld_fees if hld_kind == 'home_charge_billed' else (MX(0, hld_amt - hld_cr)
        if (hld_kind == 'home_late_fee_assessed' or hld_kind == 'home_returned_fee_assessed' or hld_kind == 'home_etf_assessed'
        or hld_kind == 'home_change_fee_assessed') else 0)
    - pnd_id: LATEST('home_credits', 'home_credit_id', date_field='posted_date', event_type='home_credit_posted') or 'none'
    - pnd_month: LATEST('home_credits', 'statement_month', date_field='posted_date', event_type='home_credit_posted') or 'none'
    - pnd_priced: COUNT('home_billing', event_type='home_charge_billed', home_credit_id=pnd_id)
    - pnd_value: SUM('home_credits', 'credit_value', home_credit_id=pnd_id)
    - pnd_dispute: LATEST('home_requests', 'home_disputed_bill_id', date_field='received_date', request_type='billing_dispute',
        outcome='received') or 'none'
    - pnd_est: MX(0, SUM('home_billing', 'amount', event_type='home_charge_billed', charge_basis='estimated', billing_month=pnd_month)
        - SUM('home_billing', 'amount', event_type='home_billing_credited', credit_reason='estimate_trueup', billing_month=pnd_month)
        - SUM('home_billing', 'amount', event_type='home_charge_billed', charge_basis='estimated', billing_month=pnd_month,
        home_bill_id=pnd_dispute))
    - pnd_charge: RND(pnd_value * (100 - P('savings_rate_pct')) / 100 + 0.000000001, 2)
    - pnd_add: pnd_charge - pnd_est if (pnd_priced == 0 and pnd_value > 0 and pnd_est > 0) else (pnd_charge if (pnd_priced ==
        0 and pnd_value > 0) else 0)
    - fsh_acc_active: EXISTS('access', status='active')
    - fsh_acc_recert: CFIELD('access', 'recert_due_date', status='active') or '0001-01-01'
    - fsh_wl_queued: CFIELD('waitlist', 'utility_account_id', variant_name='Income-Eligible Priority Waitlist', status='queued')
        or 'none'
    - fsh_wl_offered: CFIELD('waitlist', 'utility_account_id', variant_name='Income-Eligible Priority Waitlist', status='offered')
        or 'none'
    - fsh_share: K('fee_share_access') if (fsh_acc_active and fsh_acc_recert >= NOW) else (K('fee_share_waitlist') if (fsh_wl_queued
        == F('utility_account_id') or fsh_wl_offered == F('utility_account_id')) else 1)
    - rcf_dispute: LATEST('home_requests', 'home_disputed_bill_id', date_field='received_date', request_type='billing_dispute',
        outcome='received') or 'none'
    - rcf_lines: SUM('home_billing', 'amount', within_months=K('fee_window_months'), date_field='bill_date', event_type='home_late_fee_assessed')
        + SUM('home_billing', 'amount', within_months=K('fee_window_months'), date_field='bill_date', event_type='home_returned_fee_assessed')
        - SUM('home_billing', 'amount', within_months=K('fee_window_months'), date_field='bill_date', event_type='home_late_fee_assessed',
        home_ref_bill_id=rcf_dispute) - SUM('home_billing', 'amount', within_months=K('fee_window_months'), date_field='bill_date',
        home_bill_id=rcf_dispute, event_type='home_late_fee_assessed') - SUM('home_billing', 'amount', within_months=K('fee_window_months'),
        date_field='bill_date', home_bill_id=rcf_dispute, event_type='home_returned_fee_assessed')
    - oes_last: LATEST('home_billing', 'charge_basis', date_field='bill_date', event_type='home_charge_billed') or 'none'
    - oes_share: K('estimate_share_closed') if (F('status') == 'closed' and oes_last == 'estimated') else (K('estimate_share_notice')
        if (F('status') == 'notice_given' and oes_last == 'estimated') else 1)
    - oes_dispute: LATEST('home_requests', 'home_disputed_bill_id', date_field='received_date', request_type='billing_dispute',
        outcome='received') or 'none'
    - oes_pend_id: LATEST('home_credits', 'home_credit_id', date_field='posted_date', event_type='home_credit_posted') or 'none'
    - oes_pend_month: LATEST('home_credits', 'statement_month', date_field='posted_date', event_type='home_credit_posted') or
        'none'
    - oes_pend_priced: COUNT('home_billing', event_type='home_charge_billed', home_credit_id=oes_pend_id)
    - oes_open: MX(0, SUM('home_billing', 'amount', within_months=K('estimate_window_months'), date_field='bill_date', event_type='home_charge_billed',
        charge_basis='estimated') - SUM('home_billing', 'amount', within_months=K('estimate_window_months'), date_field='bill_date',
        event_type='home_billing_credited', credit_reason='estimate_trueup') - SUM('home_billing', 'amount', within_months=K('estimate_window_months'),
        date_field='bill_date', event_type='home_charge_billed', charge_basis='estimated', home_bill_id=oes_dispute) - (SUM('home_billing',
        'amount', within_months=K('estimate_window_months'), date_field='bill_date', event_type='home_charge_billed', charge_basis='estimated',
        billing_month=oes_pend_month) if oes_pend_priced == 0 else 0))
    - pay_amount: pay_open + pnd_add - hld_hold - (1 - fsh_share) * rcf_lines - (1 - oes_share) * oes_open
    - result: RND(MX(0, pay_amount) + 0.000000001, 2)
    compute_basis:
