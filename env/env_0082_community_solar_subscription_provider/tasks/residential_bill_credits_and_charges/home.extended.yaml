      term_mult_after_term: 0.9
      fee_ceiling_usd: 35
    rule: 'For the returned-payment fee of a residential subscription, and only for that fee, the fee is worked out as this
      rule states, is due invoice_due_days after assessment, and no fee line is written when returned_payment_fee_usd is 0.00;
      every other fee remains under the base rule. The returned item is the payment named on the subscription''s returned-payment
      line with the latest bill_date (among lines recorded the same day the first on record); the returned amount is that line''s
      amount. The returned-payment fee is returned_payment_fee_usd, rounded half up to the cent. The base the returned-payment
      fee is figured on is settled by the returned amount: when the returned amount is large_item_usd or more, it is the greater
      of returned_payment_fee_usd and large_item_pct percent of the returned amount; when the returned amount is less than returned_payment_fee_usd,
      it is the returned amount itself; otherwise it is returned_payment_fee_usd. The returned-payment fee''s item multiplier
      is settled from the payment_method recorded on the returned-payment line: a card payment reversed by the card issuer,
      item_mult_card; a returned ach debit, item_mult_ach; otherwise (a returned check) 1. The returned-payment fee''s term
      multiplier is settled from the subscription''s committed term: a plan with a committed term (term_months greater than
      0) whose term_end_date is on or after today, term_mult_in_term; a plan with a committed term whose term_end_date has passed
      (month to month after the term), term_mult_after_term; a plan without a committed term, 1. The returned-payment fee''s
      repeat multiplier is settled from the returned-payment lines with a bill_date fewer than repeat_window_months whole months
      before today, this return included: three or more, repeat_mult_three; exactly two, repeat_mult_two; one, 1. The returned-payment
      fee''s household-income multiplier is settled from the household''s income-eligibility records in Meadowlark''s other
      lines: when the customer holds a Meadowlark Access subscription in active status whose recert_due_date is on or after
      today, income_mult_access; when that does not hold and the customer holds an Income-Eligible Priority Waitlist reservation
      in queued or offered status on this subscription''s utility account, income_mult_waitlist; otherwise 1. The returned-payment
      fee is assembled in one fixed order: the base the fee is figured on comes first; it is then multiplied, in a single step,
      by every multiplier; the product is limited to fee_ceiling_usd, and for a returned check to returned_payment_fee_usd;
      the result is rounded half up to the cent once, at the end.'
    compute:
    - rf_ret_line: LATEST('home_billing', 'home_bill_id', date_field='bill_date', event_type='home_payment_returned') or 'none'
    - rf_item_id: LATEST('home_billing', 'home_ref_bill_id', date_field='bill_date', event_type='home_payment_returned') or
        'none'
    - rf_ret_date: LATEST('home_billing', 'bill_date', date_field='bill_date', home_bill_id=rf_ret_line) or NOW
    - rfb_amount: SUM('home_billing', 'amount', home_bill_id=rf_ret_line)
    - rfb_base: MX(P('returned_payment_fee_usd'), rfb_amount * K('large_item_pct') / 100) if rfb_amount >= K('large_item_usd')
        else (rfb_amount if rfb_amount < P('returned_payment_fee_usd') else P('returned_payment_fee_usd'))
    - rfm_method: LATEST('home_billing', 'payment_method', date_field='bill_date', home_bill_id=rf_ret_line) or 'none'
    - rfm_mult: K('item_mult_card') if rfm_method == 'card' else (K('item_mult_ach') if rfm_method == 'ach' else 1)
    - rfr_count: COUNT('home_billing', within_months=K('repeat_window_months'), date_field='bill_date', event_type='home_payment_returned')
    - rfr_mult: K('repeat_mult_three') if rfr_count >= 3 else (K('repeat_mult_two') if rfr_count == 2 else 1)
    - rfi_acc_active: EXISTS('access', status='active')
    - rfi_acc_recert: CFIELD('access', 'recert_due_date', status='active') or '0001-01-01'
    - rfi_wl_queued: CFIELD('waitlist', 'utility_account_id', variant_name='Income-Eligible Priority Waitlist', status='queued')
        or 'none'
    - rfi_wl_offered: CFIELD('waitlist', 'utility_account_id', variant_name='Income-Eligible Priority Waitlist', status='offered')
        or 'none'
    - rfi_mult: K('income_mult_access') if (rfi_acc_active and rfi_acc_recert >= NOW) else (K('income_mult_waitlist') if (rfi_wl_queued
        == F('utility_account_id') or rfi_wl_offered == F('utility_account_id')) else 1)
    - rft_months_left: MONTHS(NOW, F('term_end_date') or '0001-01-01')
    - rft_mult: K('term_mult_in_term') if (P('term_months') > 0 and F('term_end_date') and rft_months_left >= 0) else (K('term_mult_after_term')
        if P('term_months') > 0 else 1)
    - rf_product: rfb_base * rfm_mult * rft_mult * rfr_mult * rfi_mult
    - rf_capped: MN(K('fee_ceiling_usd'), MN(P('returned_payment_fee_usd'), rf_product) if rfm_method == 'check' else rf_product)
    - result: RND(rf_capped + 0.000000001, 2) if (P('returned_payment_fee_usd') > 0 and rf_capped > 0) else 0
    compute_basis:
      rf_ret_line: The returned item is the payment named on the subscription's returned-payment line with the latest bill_date
        (among lines recorded the same day the first on record)
      rf_item_id: The returned item is the payment named on the subscription's returned-payment line with the latest bill_date
        (among lines recorded the same day the first on record)
      rf_ret_date: The returned item is the payment named on the subscription's returned-payment line with the latest bill_date
        (among lines recorded the same day the first on record)
      rfb_amount: the returned amount is that line's amount.
      rfb_base: 'The base the returned-payment fee is figured on is settled by the returned amount: when the returned amount
        is large_item_usd or more, it is the greater of returned_payment_fee_usd and large_item_pct percent of the returned
        amount; when the returned amount is less than returned_payment_fee_usd, it is the returned amount itself; otherwise
        it is returned_payment_fee_usd.'
      rfm_method: The returned-payment fee's item multiplier is settled from the payment_method recorded on the returned-payment
        line
      rfm_mult: a card payment reversed by the card issuer, item_mult_card; a returned ach debit, item_mult_ach; otherwise (a
        returned check) 1.
      rfr_count: The returned-payment fee's repeat multiplier is settled from the returned-payment lines with a bill_date fewer
        than repeat_window_months whole months before today, this return included
      rfr_mult: three or more, repeat_mult_three; exactly two, repeat_mult_two; one, 1.
      rfi_acc_active: when the customer holds a Meadowlark Access subscription in active status whose recert_due_date is on
        or after today, income_mult_access
      rfi_acc_recert: when the customer holds a Meadowlark Access subscription in active status whose recert_due_date is on
        or after today, income_mult_access
      rfi_wl_queued: when that does not hold and the customer holds an Income-Eligible Priority Waitlist reservation in queued
        or offered status on this subscription's utility account, income_mult_waitlist; otherwise 1.
      rfi_wl_offered: when that does not hold and the customer holds an Income-Eligible Priority Waitlist reservation in queued
        or offered status on this subscription's utility account, income_mult_waitlist; otherwise 1.
      rfi_mult: 'The returned-payment fee''s household-income multiplier is settled from the household''s income-eligibility
        records in Meadowlark''s other lines: when the customer holds a Meadowlark Access subscription in active status whose
        recert_due_date is on or after today, income_mult_access; when that does not hold and the customer holds an Income-Eligible
        Priority Waitlist reservation in queued or offered status on this subscription''s utility account, income_mult_waitlist;
        otherwise 1.'
      rf_product: it is then multiplied, in a single step, by every multiplier
      result: the result is rounded half up to the cent once, at the end.
      rft_months_left: The returned-payment fee's term multiplier is settled from the subscription's committed term
      rft_mult: a plan with a committed term (term_months greater than 0) whose term_end_date is on or after today, term_mult_in_term;
        a plan with a committed term whose term_end_date has passed (month to month after the term), term_mult_after_term; a
        plan without a committed term, 1.
      rf_capped: the product is limited to fee_ceiling_usd, and for a returned check to returned_payment_fee_usd
    factors:
    - id: rpf_item_base
      effect: method
      decides: rfb_base
      bindings:
      - rfb_amount
      - rfb_base
      ladder:
      - when: the returned amount is large_item_usd or more
        method: the greater of returned_payment_fee_usd and large_item_pct percent of the returned amount
      - when: the returned amount is less than returned_payment_fee_usd
        method: the returned amount itself
      - when: otherwise
        method: returned_payment_fee_usd
      baseline:
        rfb_base: P('returned_payment_fee_usd')
      evidence:
      - history
      cross_difficulty: null
    - id: rpf_item_kind
      effect: parameter
      decides: rfm_mult
      bindings:
      - rfm_method
      - rfm_mult
      ladder:
      - when: the returned-payment line records payment_method card (reversed by the card issuer)
        value: K('item_mult_card')
      - when: it records payment_method ach (a returned ach debit)
        value: K('item_mult_ach')
      - when: otherwise (a returned check)
        value: '1'
      baseline:
        rfm_mult: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: rpf_committed_term
      effect: parameter
      decides: rft_mult
      bindings:
      - rft_months_left
      - rft_mult
      ladder:
      - when: a plan with a committed term whose term_end_date is on or after today
        value: K('term_mult_in_term')
      - when: a plan with a committed term whose term_end_date has passed
        value: K('term_mult_after_term')
      - when: otherwise (no committed term)
        value: '1'
      baseline:
        rft_mult: '1'
      evidence:
      - date
      - tier_param
      cross_difficulty: null
    - id: rpf_repeat
      effect: parameter
      decides: rfr_mult
      bindings:
      - rfr_count
      - rfr_mult
      ladder:
      - when: three or more returned-payment lines with a bill_date fewer than repeat_window_months whole months before today
        value: K('repeat_mult_three')
      - when: exactly two
        value: K('repeat_mult_two')
      - when: otherwise
        value: '1'
      baseline:
        rfr_mult: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: rpf_household_income
      effect: parameter
      decides: rfi_mult
      bindings:
      - rfi_acc_active
      - rfi_acc_recert
      - rfi_wl_queued
      - rfi_wl_offered
      - rfi_mult
      ladder:
      - when: the customer holds an active Meadowlark Access subscription and its recert_due_date is on or after today
        value: K('income_mult_access')
      - when: not the above, and an Income-Eligible Priority Waitlist reservation in queued or offered status stands on this
          subscription's utility account
        value: K('income_mult_waitlist')
      - when: otherwise
        value: '1'
      baseline:
        rfi_mult: '1'
      evidence:
      - cross_category
      - date
      cross_difficulty: waitlist
    baseline:
      rule: The returned item is the payment named on the subscription's returned-payment line with the latest bill_date (among
        lines recorded the same day the first on record); the returned amount is that line's amount. The returned-payment fee
        is returned_payment_fee_usd, rounded half up to the cent.
      params:
      - returned_payment_fee_usd
    prerequisite: []
    cross_category:
    - category: waitlist
      as: branch
      reads:
      - variant_name
      - status
      - utility_account_id
      note: The household-income multiplier reads the customer's Income-Eligible Priority Waitlist reservation on this utility
        account.
    - category: access
      as: branch
      reads:
      - status
      - recert_due_date
      note: The household-income multiplier reads whether the customer holds an active Access subscription with current income
        verification.
    inputs:
      history:
      - table: home_billing
        aggregate: latest
        field: home_bill_id
        within_months: 12
        filters:
          event_type: home_payment_returned
      - table: home_billing
        aggregate: count
        field: home_bill_id
        within_months: 12
        filters:
          event_type: home_payment_returned
      cross_category:
      - waitlist
      - access
  - id: home_ext_reopened_late_fee
    base_policy_refs: [home_evt_late_fee, home_evt_payment_application, home_evt_credit_correction]
    overwrite:
    - base_policy: home_evt_late_fee
      superseded_clause: >-
        The fee is the unpaid amount of that one charge on the assessment date (home_msr_unpaid_on_charge) multiplied by
        late_fee_pct and divided by 100, rounded half up to the cent, raised to late_fee_min_usd when lower and limited to
        late_fee_max_usd when higher.
      replaced_by: >-
        For the late fee on the actual dual-billed charge of the statement month named on a subscription's latest
        returned-payment line, the charge that returned payment reopened, and only for such a charge, the reopened-charge
        late fee is worked out as this rule states; the late fee on a subscription's latest-invoiced actual dual-billed
        charge that is not that charge is worked out by the overdue-charge late fee rule, and every other late fee
        remains under the base rule, which reads: The fee is the
        unpaid amount of that one charge on the assessment date (home_msr_unpaid_on_charge) multiplied by late_fee_pct and
        divided by 100, rounded half up to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd
        when higher.
    trigger: state_due
    subject: [home_late_fee_assessed]
    computes: amount
    target_tool: assess_reopened_charge_late_fee_2381e61d
    params:
      months_long: 2
      months_mult_long: 3
      months_mult_one: 2
      income_mult_access: 0.5
      income_mult_waitlist: 0.8
      repeat_window_months: 12
      repeat_count_high: 3
      repeat_mult_high: 1.3
      repeat_mult_low: 1.2
      size_large_usd: 150
      size_mid_usd: 75
      size_mult_large: 0.9
      size_mult_mid: 0.95
    rule: >-
      For the late fee on the actual dual-billed charge of the statement month named on a subscription's latest
      returned-payment line, the charge that returned payment reopened, and only for such a charge, the reopened-charge
      late fee is worked out as this rule states; the late fee on a subscription's latest-invoiced actual dual-billed
      charge that is not that charge is worked out by the overdue-charge late fee rule, and every other late fee
      remains under the base rule, which reads: The fee is the
      unpaid amount of that one charge on the assessment date (home_msr_unpaid_on_charge) multiplied by late_fee_pct and
      divided by 100, rounded half up to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd
      when higher.
      The reopened charge is the subscription's actual subscription charge with billing_type dual whose billing_month is the
      statement month named on the returned-payment line with the latest bill_date (among lines on the same day the first on
      record); when that month carries more than one actual charge (a corrected credit re-posted after a reversal), it is the
      one with the latest bill_date, the first on record among charges invoiced the same day; its unpaid amount is its amount less every payment
      recorded for its statement month (a payment line records as its billing_month the statement month of the oldest
      open line it settled under the payment-application order), plus every returned payment recorded for that month,
      less every billing credit referring to it, never below 0.00.
      The reopened-charge late fee is the reopened charge's unpaid amount multiplied by late_fee_pct and divided by 100,
      rounded half up to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher; no fee
      is written when late_fee_pct is 0.0.
      The amount the reopened-charge late fee is priced on is settled by the payments toward the reopened charge's statement
      month: when a returned payment is recorded for that month, it is the reopened charge's amount less the billing credits
      referring to it, every payment for that month disregarded; when no returned payment is recorded for that month and the
      most recent payment toward it (latest bill_date, the first on record among payments received the same day) was
      received after the reopened charge's due_date, it is the unpaid amount plus that most recent payment; otherwise it is
      the unpaid amount.
      The reopened-charge late fee's month multiplier is settled from the whole months from the reopened charge's due_date to
      today: months_long or more whole months, months_mult_long; exactly one whole month, months_mult_one; fewer than one
      whole month, 1.
      The reopened-charge late fee's household-income multiplier is settled from the household's income-eligibility records
      in Meadowlark's other lines: when the customer holds a Meadowlark Access subscription in active status whose
      recert_due_date is on or after today, income_mult_access; when that does not hold and the customer holds an
      Income-Eligible Priority Waitlist reservation in queued or offered status on this subscription's utility account,
      income_mult_waitlist; otherwise 1.
      The reopened-charge late fee's repeat multiplier is settled from the late fees assessed on the subscription with a
      bill_date fewer than repeat_window_months whole months before today: repeat_count_high or more, repeat_mult_high; at
      least one but fewer than repeat_count_high, repeat_mult_low; none, 1.
      The reopened-charge late fee's size multiplier is settled from the reopened charge's amount: size_large_usd or more,
      size_mult_large; at least size_mid_usd but less than size_large_usd, size_mult_mid; less than size_mid_usd, 1.
      The reopened-charge late fee's banked-share multiplier is settled from the credit line the reopened charge prices: when
      that line's banked_value is equal to or greater than its credit_value, no fee is written and the multiplier is 0; when
      its banked_value is greater than 0.00 but less than its credit_value, the multiplier is 1 less the banked_value divided
      by the credit_value, so that the fee falls only on the part of the credit the utility applied to the bill; otherwise
      the multiplier is 1.
      The reopened-charge late fee is assembled in one fixed order: the amount the fee is priced on replaces the unpaid amount
      first; that amount is multiplied by late_fee_pct divided by 100 and then, in a single step, by every multiplier; the
      product is rounded half up to the cent once, then raised to late_fee_min_usd when lower and limited to
      late_fee_max_usd when higher; no fee is written when the product rounds to 0.00.
    compute:
    - lf_ret_month: "LATEST('home_billing', 'billing_month', date_field='bill_date', event_type='home_payment_returned') or 'none'"
    - lf_ref_id: "LATEST('home_billing', 'home_bill_id', date_field='bill_date', event_type='home_charge_billed', charge_basis='actual', billing_type='dual', billing_month=lf_ret_month) or 'none'"
    - lf_amt: "SUM('home_billing', 'amount', home_bill_id=lf_ref_id)"
    - lf_month: "LATEST('home_billing', 'billing_month', date_field='bill_date', home_bill_id=lf_ref_id) or 'none'"
    - lf_due: "LATEST('home_billing', 'due_date', date_field='bill_date', home_bill_id=lf_ref_id) or NOW"
    - lf_paid: "SUM('home_billing', 'amount', event_type='home_payment_received', billing_month=lf_month)"
    - lf_returned: "SUM('home_billing', 'amount', event_type='home_payment_returned', billing_month=lf_month)"
    - lf_credited: "SUM('home_billing', 'amount', event_type='home_billing_credited', home_ref_bill_id=lf_ref_id)"
    - lf_unpaid: "MX(0, lf_amt - lf_paid + lf_returned - lf_credited)"
    - rfl_ret_seen: "COUNT('home_billing', event_type='home_payment_returned', billing_month=lf_month)"
    - rfl_last_pay_date: "LATEST('home_billing', 'bill_date', date_field='bill_date', event_type='home_payment_received', billing_month=lf_month) or '0001-01-01'"
    - rfl_last_pay_amt: "LATEST('home_billing', 'amount', date_field='bill_date', event_type='home_payment_received', billing_month=lf_month) or 0"
    - rfl_priced_on: "MX(0, lf_amt - lf_credited) if rfl_ret_seen > 0 else (lf_unpaid + float(rfl_last_pay_amt) if rfl_last_pay_date > lf_due else lf_unpaid)"
    - rfl_age: "MONTHS(lf_due, NOW)"
    - rfl_month_mult: "K('months_mult_long') if rfl_age >= K('months_long') else (K('months_mult_one') if rfl_age >= 1 else 1)"
    - rfl_acc_active: "EXISTS('access', status='active')"
    - rfl_acc_recert: "CFIELD('access', 'recert_due_date', status='active') or '0001-01-01'"
    - rfl_wl_queued: "CFIELD('waitlist', 'utility_account_id', variant_name='Income-Eligible Priority Waitlist', status='queued') or 'none'"
    - rfl_wl_offered: "CFIELD('waitlist', 'utility_account_id', variant_name='Income-Eligible Priority Waitlist', status='offered') or 'none'"
    - rfl_income_mult: "K('income_mult_access') if (rfl_acc_active and rfl_acc_recert >= NOW) else (K('income_mult_waitlist') if (rfl_wl_queued == F('utility_account_id') or rfl_wl_offered == F('utility_account_id')) else 1)"
    - rfl_fee_count: "COUNT('home_billing', within_months=K('repeat_window_months'), date_field='bill_date', event_type='home_late_fee_assessed')"
    - rfl_repeat_mult: "K('repeat_mult_high') if rfl_fee_count >= K('repeat_count_high') else (K('repeat_mult_low') if rfl_fee_count >= 1 else 1)"
    - rfl_size_amt: "SUM('home_billing', 'amount', home_bill_id=lf_ref_id)"
    - rfl_size_mult: "K('size_mult_large') if rfl_size_amt >= K('size_large_usd') else (K('size_mult_mid') if rfl_size_amt >= K('size_mid_usd') else 1)"
    - rfl_credit_id: "LATEST('home_billing', 'home_credit_id', date_field='bill_date', home_bill_id=lf_ref_id) or 'none'"
    - rfl_banked: "SUM('home_credits', 'banked_value', home_credit_id=rfl_credit_id)"
    - rfl_value: "SUM('home_credits', 'credit_value', home_credit_id=rfl_credit_id)"
    - rfl_banked_mult: "0 if (rfl_value > 0 and rfl_banked >= rfl_value) else (1 - rfl_banked / rfl_value if (rfl_value > 0 and rfl_banked > 0) else 1)"
    - lf_raw: "rfl_priced_on * P('late_fee_pct') / 100 * rfl_month_mult * rfl_income_mult * rfl_repeat_mult * rfl_size_mult * rfl_banked_mult"
    - result: "0 if (RND(MX(0, lf_raw) + 0.000000001, 2) <= 0 or P('late_fee_pct') == 0) else MN(P('late_fee_max_usd'), MX(P('late_fee_min_usd'), RND(lf_raw + 0.000000001, 2)))"
    compute_basis:
      lf_ret_month: "whose billing_month is the statement month named on the returned-payment line with the latest bill_date (among lines on the same day the first on record)"
      lf_ref_id: "when that month carries more than one actual charge (a corrected credit re-posted after a reversal), it is the one with the latest bill_date, the first on record among charges invoiced the same day"
      lf_amt: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      lf_month: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      lf_due: "was received after the reopened charge's due_date"
      lf_paid: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      lf_returned: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      lf_credited: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      lf_unpaid: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      rfl_ret_seen: "when a returned payment is recorded for that month, it is the reopened charge's amount less the billing credits referring to it, every payment for that month disregarded"
      rfl_last_pay_date: "the most recent payment toward it (latest bill_date, the first on record among payments received the same day) was received after the reopened charge's due_date"
      rfl_last_pay_amt: "it is the unpaid amount plus that most recent payment"
      rfl_priced_on: "The amount the reopened-charge late fee is priced on is settled by the payments toward the reopened charge's statement month: when a returned payment is recorded for that month, it is the reopened charge's amount less the billing credits referring to it, every payment for that month disregarded; when no returned payment is recorded for that month and the most recent payment toward it (latest bill_date, the first on record among payments received the same day) was received after the reopened charge's due_date, it is the unpaid amount plus that most recent payment; otherwise it is the unpaid amount."
      rfl_age: "The reopened-charge late fee's month multiplier is settled from the whole months from the reopened charge's due_date to today"
      rfl_month_mult: "months_long or more whole months, months_mult_long; exactly one whole month, months_mult_one; fewer than one whole month, 1."
      rfl_acc_active: "when the customer holds a Meadowlark Access subscription in active status whose recert_due_date is on or after today, income_mult_access"
      rfl_acc_recert: "when the customer holds a Meadowlark Access subscription in active status whose recert_due_date is on or after today, income_mult_access"
      rfl_wl_queued: "when that does not hold and the customer holds an Income-Eligible Priority Waitlist reservation in queued or offered status on this subscription's utility account, income_mult_waitlist; otherwise 1."
      rfl_wl_offered: "when that does not hold and the customer holds an Income-Eligible Priority Waitlist reservation in queued or offered status on this subscription's utility account, income_mult_waitlist; otherwise 1."
      rfl_income_mult: "The reopened-charge late fee's household-income multiplier is settled from the household's income-eligibility records in Meadowlark's other lines: when the customer holds a Meadowlark Access subscription in active status whose recert_due_date is on or after today, income_mult_access; when that does not hold and the customer holds an Income-Eligible Priority Waitlist reservation in queued or offered status on this subscription's utility account, income_mult_waitlist; otherwise 1."
      rfl_fee_count: "The reopened-charge late fee's repeat multiplier is settled from the late fees assessed on the subscription with a bill_date fewer than repeat_window_months whole months before today"
      rfl_repeat_mult: "repeat_count_high or more, repeat_mult_high; at least one but fewer than repeat_count_high, repeat_mult_low; none, 1."
      rfl_size_amt: "The reopened-charge late fee's size multiplier is settled from the reopened charge's amount"
      rfl_size_mult: "size_large_usd or more, size_mult_large; at least size_mid_usd but less than size_large_usd, size_mult_mid; less than size_mid_usd, 1."
      rfl_credit_id: "The reopened-charge late fee's banked-share multiplier is settled from the credit line the reopened charge prices"
      rfl_banked: "when that line's banked_value is equal to or greater than its credit_value, no fee is written and the multiplier is 0"
      rfl_value: "when its banked_value is greater than 0.00 but less than its credit_value, the multiplier is 1 less the banked_value divided by the credit_value"
      rfl_banked_mult: "when that line's banked_value is equal to or greater than its credit_value, no fee is written and the multiplier is 0; when its banked_value is greater than 0.00 but less than its credit_value, the multiplier is 1 less the banked_value divided by the credit_value, so that the fee falls only on the part of the credit the utility applied to the bill; otherwise the multiplier is 1."
      lf_raw: "that amount is multiplied by late_fee_pct divided by 100 and then, in a single step, by every multiplier"
      result: "the product is rounded half up to the cent once, then raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher; no fee is written when the product rounds to 0.00."
    factors:
    - id: rfl_priced_amount
      effect: method
      decides: rfl_priced_on
      bindings: [rfl_ret_seen, rfl_last_pay_date, rfl_last_pay_amt, rfl_priced_on]
      ladder:
      - when: "a returned payment is recorded for the reopened charge's statement month"
        method: "the fee is priced on the charge's amount less billing credits referring to it, every payment for that month disregarded"
      - when: "no returned payment for that month and its most recent payment was received after the charge's due_date"
        method: "the fee is priced on the unpaid amount plus that most recent payment"
      - when: "otherwise"
        method: "the fee is priced on the unpaid amount"
      baseline: {rfl_priced_on: "lf_unpaid"}
      evidence: [history, date]
      cross_difficulty: null
    - id: rfl_months
      effect: parameter
      decides: rfl_month_mult
      bindings: [rfl_age, rfl_month_mult]
      ladder:
      - when: "months_long or more whole months from the reopened charge's due_date to today"
        value: "K('months_mult_long')"
      - when: "exactly one whole month"
        value: "K('months_mult_one')"
      - when: "otherwise"
        value: "1"
      baseline: {rfl_month_mult: "1"}
      evidence: [date]
      cross_difficulty: null
    - id: rfl_household_income
      effect: parameter
      decides: rfl_income_mult
      bindings: [rfl_acc_active, rfl_acc_recert, rfl_wl_queued, rfl_wl_offered, rfl_income_mult]
      ladder:
      - when: "the customer holds an active Meadowlark Access subscription and its recert_due_date is on or after today"
        value: "K('income_mult_access')"
      - when: "not the above, and an Income-Eligible Priority Waitlist reservation in queued or offered status stands on this subscription's utility account"
        value: "K('income_mult_waitlist')"
      - when: "otherwise"
        value: "1"
      baseline: {rfl_income_mult: "1"}
      evidence: [cross_category, date]
      cross_difficulty: waitlist
    - id: rfl_repeat
      effect: parameter
      decides: rfl_repeat_mult
      bindings: [rfl_fee_count, rfl_repeat_mult]
      ladder:
      - when: "repeat_count_high or more late fees assessed with a bill_date fewer than repeat_window_months whole months before today"
        value: "K('repeat_mult_high')"
      - when: "at least one but fewer than repeat_count_high such late fees"
        value: "K('repeat_mult_low')"
      - when: "otherwise"
        value: "1"
      baseline: {rfl_repeat_mult: "1"}
      evidence: [history]
      cross_difficulty: null
    - id: rfl_size
      effect: parameter
      decides: rfl_size_mult
      bindings: [rfl_size_amt, rfl_size_mult]
      ladder:
      - when: "the reopened charge's amount is size_large_usd or more"
        value: "K('size_mult_large')"
      - when: "at least size_mid_usd but less than size_large_usd"
        value: "K('size_mult_mid')"
      - when: "otherwise"
        value: "1"
      baseline: {rfl_size_mult: "1"}
      evidence: [history]
      cross_difficulty: null
    - id: rfl_banked_share
      effect: method
      decides: rfl_banked_mult
      bindings: [rfl_credit_id, rfl_banked, rfl_value, rfl_banked_mult]
      ladder:
      - when: "the priced credit line's banked_value is equal to or greater than its credit_value"
        method: "no fee is written (multiplier 0)"
      - when: "its banked_value is above 0.00 but below its credit_value"
        method: "the fee falls on the applied part only: multiplier 1 less banked_value divided by credit_value"
      - when: "otherwise"
        method: "multiplier 1"
      baseline: {rfl_banked_mult: "1"}
      evidence: [history]
      cross_difficulty: null
    baseline:
      rule: >-
        The reopened charge is the subscription's actual subscription charge with billing_type dual whose billing_month is the
        statement month named on the returned-payment line with the latest bill_date (among lines on the same day the first on
        record); when that month carries more than one actual charge (a corrected credit re-posted after a reversal), it is the
        one with the latest bill_date, the first on record among charges invoiced the same day; its unpaid amount is its amount less every payment
        recorded for its statement month (a payment line records as its billing_month the statement month of the oldest
        open line it settled under the payment-application order), plus every returned payment recorded for that month,
        less every billing credit referring to it, never below 0.00.
        The reopened-charge late fee is the reopened charge's unpaid amount multiplied by late_fee_pct and divided by 100,
        rounded half up to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher; no fee
        is written when late_fee_pct is 0.0.
      params: [late_fee_pct, late_fee_min_usd, late_fee_max_usd]
    prerequisite: []
    cross_category:
    - category: waitlist
      as: branch
      reads: [variant_name, status, utility_account_id]
      note: The household-income multiplier reads the customer's Income-Eligible Priority Waitlist reservation on this utility account.
    - category: access
      as: branch
      reads: [status, recert_due_date]
      note: The household-income multiplier reads whether the customer holds an active Access subscription with current income verification.
    inputs:
      history:
      - {table: home_billing, aggregate: latest, field: billing_month, within_months: 12, filters: {event_type: home_payment_returned}}
      - {table: home_billing, aggregate: latest, field: home_bill_id, within_months: 12, filters: {event_type: home_charge_billed, charge_basis: actual, billing_type: dual}}
      - {table: home_billing, aggregate: sum, field: amount, within_months: 12, filters: {event_type: home_payment_received}}
      - {table: home_billing, aggregate: count, field: home_bill_id, within_months: 12, filters: {event_type: home_late_fee_assessed}}
      - {table: home_credits, aggregate: sum, field: banked_value, within_months: 12, filters: {event_type: home_credit_posted}}
      cross_category: [waitlist, access]
