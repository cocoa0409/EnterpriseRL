      history:
      - {table: home_billing, aggregate: sum, field: amount, within_months: 6, filters: {event_type: home_charge_billed, charge_basis: actual}}
      - {table: home_billing, aggregate: count, field: home_bill_id, within_months: 13, filters: {event_type: home_charge_billed, charge_basis: actual}}
      - {table: home_billing, aggregate: sum, field: amount, within_months: 6, filters: {event_type: home_billing_credited, credit_reason: credit_reversal_correction}}
      - {table: home_credits, aggregate: latest, field: credit_value, within_months: 6, filters: {event_type: home_credit_posted}}
      - {table: home_allocations, aggregate: latest, field: effective_date, within_months: 6, filters: {filing_reason: subscriber_decrease}}
      - {table: home_requests, aggregate: latest, field: home_disputed_bill_id, within_months: 6, filters: {request_type: billing_dispute, outcome: received}}
      cross_category: []
  - id: home_ext_overdue_late_fee
    base_policy_refs: [home_evt_late_fee, home_evt_payment_application, home_evt_credit_correction]
    overwrite:
    - base_policy: home_evt_late_fee
      superseded_clause: >-
        The fee is the unpaid amount of that one charge on the assessment date (home_msr_unpaid_on_charge) multiplied by
        late_fee_pct and divided by 100, rounded half up to the cent, raised to late_fee_min_usd when lower and limited to
        late_fee_max_usd when higher.
      replaced_by: >-
        For the late fee on a subscription's latest-invoiced actual dual-billed charge, and only for such a charge, when it
        is not the charge of the statement month named on the subscription's latest returned-payment line, the
        overdue-charge late fee is worked out as this rule states; the late fee on the charge of the statement month named
        on the latest returned-payment line is worked out by the reopened-charge late fee rule, and every other late fee
        remains under the base rule, which reads: The fee is the
        unpaid amount of that one charge on the assessment date (home_msr_unpaid_on_charge) multiplied by late_fee_pct and
        divided by 100, rounded half up to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd
        when higher.
    trigger: state_due
    subject: [home_late_fee_assessed]
    computes: amount
    target_tool: assess_overdue_charge_late_fee_df41ca22
    params:
      months_long: 2
      months_mult_long: 3
      months_mult_one: 2
      income_mult_access: 0.5
      income_mult_waitlist: 0.8
      repeat_window_months: 12
      repeat_count_high: 3
      repeat_mult_high: 1.3
      repeat_mult_low: 1.2
      size_large_usd: 150
      size_mid_usd: 75
      size_mult_large: 0.9
      size_mult_mid: 0.95
    rule: >-
      For the late fee on a subscription's latest-invoiced actual dual-billed charge, and only for such a charge, when it
      is not the charge of the statement month named on the subscription's latest returned-payment line, the
      overdue-charge late fee is worked out as this rule states; the late fee on the charge of the statement month named
      on the latest returned-payment line is worked out by the reopened-charge late fee rule, and every other late fee
      remains under the base rule, which reads: The fee is the
      unpaid amount of that one charge on the assessment date (home_msr_unpaid_on_charge) multiplied by late_fee_pct and
      divided by 100, rounded half up to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd
      when higher.
      The overdue charge is the subscription's actual subscription charge with billing_type dual and the latest bill_date
      (among charges invoiced the same day the first on record); its unpaid amount is its amount less every payment
      recorded for its statement month (a payment line records as its billing_month the statement month of the oldest
      open line it settled under the payment-application order), plus every returned payment recorded for that month,
      less every billing credit referring to it, never below 0.00.
      The overdue-charge late fee is the overdue charge's unpaid amount multiplied by late_fee_pct and divided by 100,
      rounded half up to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher; no fee
      is written when late_fee_pct is 0.0.
      The amount the overdue-charge late fee is priced on is settled by the payments toward the overdue charge's statement
      month: when a returned payment is recorded for that month, it is the overdue charge's amount less the billing credits
      referring to it, every payment for that month disregarded; when no returned payment is recorded for that month and the
      most recent payment toward it (latest bill_date, the first on record among payments received the same day) was
      received after the overdue charge's due_date, it is the unpaid amount plus that most recent payment; otherwise it is
      the unpaid amount.
      The overdue-charge late fee's month multiplier is settled from the whole months from the overdue charge's due_date to
      today: months_long or more whole months, months_mult_long; exactly one whole month, months_mult_one; fewer than one
      whole month, 1.
      The overdue-charge late fee's household-income multiplier is settled from the household's income-eligibility records
      in Meadowlark's other lines: when the customer holds a Meadowlark Access subscription in active status whose
      recert_due_date is on or after today, income_mult_access; when that does not hold and the customer holds an
      Income-Eligible Priority Waitlist reservation in queued or offered status on this subscription's utility account,
      income_mult_waitlist; otherwise 1.
      The overdue-charge late fee's repeat multiplier is settled from the late fees assessed on the subscription with a
      bill_date fewer than repeat_window_months whole months before today: repeat_count_high or more, repeat_mult_high; at
      least one but fewer than repeat_count_high, repeat_mult_low; none, 1.
      The overdue-charge late fee's size multiplier is settled from the overdue charge's amount: size_large_usd or more,
      size_mult_large; at least size_mid_usd but less than size_large_usd, size_mult_mid; less than size_mid_usd, 1.
      The overdue-charge late fee's banked-share multiplier is settled from the credit line the overdue charge prices: when
      that line's banked_value is equal to or greater than its credit_value, no fee is written and the multiplier is 0; when
      its banked_value is greater than 0.00 but less than its credit_value, the multiplier is 1 less the banked_value divided
      by the credit_value, so that the fee falls only on the part of the credit the utility applied to the bill; otherwise
      the multiplier is 1.
      The overdue-charge late fee is assembled in one fixed order: the amount the fee is priced on replaces the unpaid amount
      first; that amount is multiplied by late_fee_pct divided by 100 and then, in a single step, by every multiplier; the
      product is rounded half up to the cent once, then raised to late_fee_min_usd when lower and limited to
      late_fee_max_usd when higher; no fee is written when the product rounds to 0.00.
    compute:
    - lf_ref_id: "LATEST('home_billing', 'home_bill_id', date_field='bill_date', event_type='home_charge_billed', charge_basis='actual', billing_type='dual') or 'none'"
    - lf_amt: "SUM('home_billing', 'amount', home_bill_id=lf_ref_id)"
    - lf_month: "LATEST('home_billing', 'billing_month', date_field='bill_date', home_bill_id=lf_ref_id) or 'none'"
    - lf_due: "LATEST('home_billing', 'due_date', date_field='bill_date', home_bill_id=lf_ref_id) or NOW"
    - lf_paid: "SUM('home_billing', 'amount', event_type='home_payment_received', billing_month=lf_month)"
    - lf_returned: "SUM('home_billing', 'amount', event_type='home_payment_returned', billing_month=lf_month)"
    - lf_credited: "SUM('home_billing', 'amount', event_type='home_billing_credited', home_ref_bill_id=lf_ref_id)"
    - lf_unpaid: "MX(0, lf_amt - lf_paid + lf_returned - lf_credited)"
    - ofl_ret_seen: "COUNT('home_billing', event_type='home_payment_returned', billing_month=lf_month)"
    - ofl_last_pay_date: "LATEST('home_billing', 'bill_date', date_field='bill_date', event_type='home_payment_received', billing_month=lf_month) or '0001-01-01'"
    - ofl_last_pay_amt: "LATEST('home_billing', 'amount', date_field='bill_date', event_type='home_payment_received', billing_month=lf_month) or 0"
    - ofl_priced_on: "MX(0, lf_amt - lf_credited) if ofl_ret_seen > 0 else (lf_unpaid + float(ofl_last_pay_amt) if ofl_last_pay_date > lf_due else lf_unpaid)"
    - ofl_age: "MONTHS(lf_due, NOW)"
    - ofl_month_mult: "K('months_mult_long') if ofl_age >= K('months_long') else (K('months_mult_one') if ofl_age >= 1 else 1)"
    - ofl_acc_active: "EXISTS('access', status='active')"
    - ofl_acc_recert: "CFIELD('access', 'recert_due_date', status='active') or '0001-01-01'"
    - ofl_wl_queued: "CFIELD('waitlist', 'utility_account_id', variant_name='Income-Eligible Priority Waitlist', status='queued') or 'none'"
    - ofl_wl_offered: "CFIELD('waitlist', 'utility_account_id', variant_name='Income-Eligible Priority Waitlist', status='offered') or 'none'"
    - ofl_income_mult: "K('income_mult_access') if (ofl_acc_active and ofl_acc_recert >= NOW) else (K('income_mult_waitlist') if (ofl_wl_queued == F('utility_account_id') or ofl_wl_offered == F('utility_account_id')) else 1)"
    - ofl_fee_count: "COUNT('home_billing', within_months=K('repeat_window_months'), date_field='bill_date', event_type='home_late_fee_assessed')"
    - ofl_repeat_mult: "K('repeat_mult_high') if ofl_fee_count >= K('repeat_count_high') else (K('repeat_mult_low') if ofl_fee_count >= 1 else 1)"
    - ofl_size_amt: "SUM('home_billing', 'amount', home_bill_id=lf_ref_id)"
    - ofl_size_mult: "K('size_mult_large') if ofl_size_amt >= K('size_large_usd') else (K('size_mult_mid') if ofl_size_amt >= K('size_mid_usd') else 1)"
    - ofl_credit_id: "LATEST('home_billing', 'home_credit_id', date_field='bill_date', home_bill_id=lf_ref_id) or 'none'"
    - ofl_banked: "SUM('home_credits', 'banked_value', home_credit_id=ofl_credit_id)"
    - ofl_value: "SUM('home_credits', 'credit_value', home_credit_id=ofl_credit_id)"
    - ofl_banked_mult: "0 if (ofl_value > 0 and ofl_banked >= ofl_value) else (1 - ofl_banked / ofl_value if (ofl_value > 0 and ofl_banked > 0) else 1)"
    - lf_raw: "ofl_priced_on * P('late_fee_pct') / 100 * ofl_month_mult * ofl_income_mult * ofl_repeat_mult * ofl_size_mult * ofl_banked_mult"
    - result: "0 if (RND(MX(0, lf_raw) + 0.000000001, 2) <= 0 or P('late_fee_pct') == 0) else MN(P('late_fee_max_usd'), MX(P('late_fee_min_usd'), RND(lf_raw + 0.000000001, 2)))"
    compute_basis:
      lf_ref_id: "The overdue charge is the subscription's actual subscription charge with billing_type dual and the latest bill_date (among charges invoiced the same day the first on record)"
      lf_amt: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      lf_month: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      lf_due: "was received after the overdue charge's due_date"
      lf_paid: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      lf_returned: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      lf_credited: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      lf_unpaid: "its unpaid amount is its amount less every payment recorded for its statement month (a payment line records as its billing_month the statement month of the oldest open line it settled under the payment-application order), plus every returned payment recorded for that month, less every billing credit referring to it, never below 0.00."
      ofl_ret_seen: "when a returned payment is recorded for that month, it is the overdue charge's amount less the billing credits referring to it, every payment for that month disregarded"
      ofl_last_pay_date: "the most recent payment toward it (latest bill_date, the first on record among payments received the same day) was received after the overdue charge's due_date"
      ofl_last_pay_amt: "it is the unpaid amount plus that most recent payment"
      ofl_priced_on: "The amount the overdue-charge late fee is priced on is settled by the payments toward the overdue charge's statement month: when a returned payment is recorded for that month, it is the overdue charge's amount less the billing credits referring to it, every payment for that month disregarded; when no returned payment is recorded for that month and the most recent payment toward it (latest bill_date, the first on record among payments received the same day) was received after the overdue charge's due_date, it is the unpaid amount plus that most recent payment; otherwise it is the unpaid amount."
      ofl_age: "The overdue-charge late fee's month multiplier is settled from the whole months from the overdue charge's due_date to today"
      ofl_month_mult: "months_long or more whole months, months_mult_long; exactly one whole month, months_mult_one; fewer than one whole month, 1."
      ofl_acc_active: "when the customer holds a Meadowlark Access subscription in active status whose recert_due_date is on or after today, income_mult_access"
      ofl_acc_recert: "when the customer holds a Meadowlark Access subscription in active status whose recert_due_date is on or after today, income_mult_access"
      ofl_wl_queued: "when that does not hold and the customer holds an Income-Eligible Priority Waitlist reservation in queued or offered status on this subscription's utility account, income_mult_waitlist; otherwise 1."
      ofl_wl_offered: "when that does not hold and the customer holds an Income-Eligible Priority Waitlist reservation in queued or offered status on this subscription's utility account, income_mult_waitlist; otherwise 1."
      ofl_income_mult: "The overdue-charge late fee's household-income multiplier is settled from the household's income-eligibility records in Meadowlark's other lines: when the customer holds a Meadowlark Access subscription in active status whose recert_due_date is on or after today, income_mult_access; when that does not hold and the customer holds an Income-Eligible Priority Waitlist reservation in queued or offered status on this subscription's utility account, income_mult_waitlist; otherwise 1."
      ofl_fee_count: "The overdue-charge late fee's repeat multiplier is settled from the late fees assessed on the subscription with a bill_date fewer than repeat_window_months whole months before today"
      ofl_repeat_mult: "repeat_count_high or more, repeat_mult_high; at least one but fewer than repeat_count_high, repeat_mult_low; none, 1."
      ofl_size_amt: "The overdue-charge late fee's size multiplier is settled from the overdue charge's amount"
      ofl_size_mult: "size_large_usd or more, size_mult_large; at least size_mid_usd but less than size_large_usd, size_mult_mid; less than size_mid_usd, 1."
      ofl_credit_id: "The overdue-charge late fee's banked-share multiplier is settled from the credit line the overdue charge prices"
      ofl_banked: "when that line's banked_value is equal to or greater than its credit_value, no fee is written and the multiplier is 0"
      ofl_value: "when its banked_value is greater than 0.00 but less than its credit_value, the multiplier is 1 less the banked_value divided by the credit_value"
      ofl_banked_mult: "when that line's banked_value is equal to or greater than its credit_value, no fee is written and the multiplier is 0; when its banked_value is greater than 0.00 but less than its credit_value, the multiplier is 1 less the banked_value divided by the credit_value, so that the fee falls only on the part of the credit the utility applied to the bill; otherwise the multiplier is 1."
      lf_raw: "that amount is multiplied by late_fee_pct divided by 100 and then, in a single step, by every multiplier"
      result: "the product is rounded half up to the cent once, then raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher; no fee is written when the product rounds to 0.00."
    factors:
    - id: ofl_priced_amount
      effect: method
      decides: ofl_priced_on
      bindings: [ofl_ret_seen, ofl_last_pay_date, ofl_last_pay_amt, ofl_priced_on]
      ladder:
      - when: "a returned payment is recorded for the overdue charge's statement month"
        method: "the fee is priced on the charge's amount less billing credits referring to it, every payment for that month disregarded"
      - when: "no returned payment for that month and its most recent payment was received after the charge's due_date"
        method: "the fee is priced on the unpaid amount plus that most recent payment"
      - when: "otherwise"
        method: "the fee is priced on the unpaid amount"
      baseline: {ofl_priced_on: "lf_unpaid"}
      evidence: [history, date]
      cross_difficulty: null
    - id: ofl_months
      effect: parameter
      decides: ofl_month_mult
      bindings: [ofl_age, ofl_month_mult]
      ladder:
      - when: "months_long or more whole months from the overdue charge's due_date to today"
        value: "K('months_mult_long')"
      - when: "exactly one whole month"
        value: "K('months_mult_one')"
      - when: "otherwise"
        value: "1"
      baseline: {ofl_month_mult: "1"}
      evidence: [date]
      cross_difficulty: null
    - id: ofl_household_income
      effect: parameter
      decides: ofl_income_mult
      bindings: [ofl_acc_active, ofl_acc_recert, ofl_wl_queued, ofl_wl_offered, ofl_income_mult]
      ladder:
      - when: "the customer holds an active Meadowlark Access subscription and its recert_due_date is on or after today"
        value: "K('income_mult_access')"
      - when: "not the above, and an Income-Eligible Priority Waitlist reservation in queued or offered status stands on this subscription's utility account"
        value: "K('income_mult_waitlist')"
      - when: "otherwise"
        value: "1"
      baseline: {ofl_income_mult: "1"}
      evidence: [cross_category, date]
      cross_difficulty: waitlist
    - id: ofl_repeat
      effect: parameter
      decides: ofl_repeat_mult
      bindings: [ofl_fee_count, ofl_repeat_mult]
      ladder:
      - when: "repeat_count_high or more late fees assessed with a bill_date fewer than repeat_window_months whole months before today"
        value: "K('repeat_mult_high')"
      - when: "at least one but fewer than repeat_count_high such late fees"
        value: "K('repeat_mult_low')"
      - when: "otherwise"
        value: "1"
      baseline: {ofl_repeat_mult: "1"}
      evidence: [history]
      cross_difficulty: null
    - id: ofl_size
      effect: parameter
      decides: ofl_size_mult
      bindings: [ofl_size_amt, ofl_size_mult]
      ladder:
      - when: "the overdue charge's amount is size_large_usd or more"
        value: "K('size_mult_large')"
      - when: "at least size_mid_usd but less than size_large_usd"
        value: "K('size_mult_mid')"
      - when: "otherwise"
        value: "1"
      baseline: {ofl_size_mult: "1"}
      evidence: [history]
      cross_difficulty: null
    - id: ofl_banked_share
      effect: method
      decides: ofl_banked_mult
      bindings: [ofl_credit_id, ofl_banked, ofl_value, ofl_banked_mult]
      ladder:
      - when: "the priced credit line's banked_value is equal to or greater than its credit_value"
        method: "no fee is written (multiplier 0)"
      - when: "its banked_value is above 0.00 but below its credit_value"
        method: "the fee falls on the applied part only: multiplier 1 less banked_value divided by credit_value"
      - when: "otherwise"
        method: "multiplier 1"
      baseline: {ofl_banked_mult: "1"}
      evidence: [history]
      cross_difficulty: null
    baseline:
      rule: >-
        The overdue charge is the subscription's actual subscription charge with billing_type dual and the latest bill_date
        (among charges invoiced the same day the first on record); its unpaid amount is its amount less every payment
        recorded for its statement month (a payment line records as its billing_month the statement month of the oldest
        open line it settled under the payment-application order), plus every returned payment recorded for that month,
        less every billing credit referring to it, never below 0.00.
        The overdue-charge late fee is the overdue charge's unpaid amount multiplied by late_fee_pct and divided by 100,
        rounded half up to the cent, raised to late_fee_min_usd when lower and limited to late_fee_max_usd when higher; no fee
