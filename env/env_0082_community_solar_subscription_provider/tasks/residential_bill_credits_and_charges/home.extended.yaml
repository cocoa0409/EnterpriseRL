    factors:
    - id: rpp_dispute_hold
      effect: method
      decides: hld_hold
      bindings:
      - hld_id
      - hld_kind
      - hld_amt
      - hld_month
      - hld_paid
      - hld_cr
      - hld_fees
      - hld_hold
      ladder:
      - when: the most recently received open billing dispute names a subscription charge
        method: hold the charge's unpaid amount plus every late fee referring to it
      - when: it names a fee line (late fee, returned-payment fee, early termination fee or change fee)
        method: hold the fee's amount less billing credits referring to it
      - when: otherwise (no open dispute, or it names a payment, returned payment or billing credit)
        method: no hold (0.00)
      baseline:
        hld_hold: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: rpp_pending_statement
      effect: method
      decides: pnd_add
      bindings:
      - pnd_id
      - pnd_month
      - pnd_priced
      - pnd_value
      - pnd_dispute
      - pnd_est
      - pnd_charge
      - pnd_add
      ladder:
      - when: the latest posted credit line is not yet priced and its statement month carries an open estimate not held for
          a dispute
        method: add the charge that credit will bring, less that open estimate
      - when: the latest posted credit line is not yet priced and its month carries no such open estimate
        method: add the charge that credit will bring
      - when: otherwise
        method: no addition
      baseline:
        pnd_add: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: rpp_household_income
      effect: parameter
      decides: fsh_share
      bindings:
      - fsh_acc_active
      - fsh_acc_recert
      - fsh_wl_queued
      - fsh_wl_offered
      - fsh_share
      ladder:
      - when: the customer holds an active Meadowlark Access subscription and its recert_due_date is on or after today
        value: K('fee_share_access')
      - when: not the above, and an Income-Eligible Priority Waitlist reservation in queued or offered status stands on this
          subscription's utility account
        value: K('fee_share_waitlist')
      - when: otherwise
        value: '1'
      baseline:
        fsh_share: '1'
      evidence:
      - cross_category
      - date
      cross_difficulty: waitlist
    - id: rpp_reversal_kind
      effect: parameter
      decides: rvs_share
      bindings:
      - rvs_method
      - rvs_share
      ladder:
      - when: the latest returned-payment line records payment_method card (reversed by the card issuer)
        value: K('reversal_share_card')
      - when: it records payment_method check
        value: K('reversal_share_check')
      - when: otherwise
        value: '1'
      baseline:
        rvs_share: '1'
      evidence:
      - history
      cross_difficulty: null
