      - {table: home_billing, aggregate: sum, field: amount, within_months: 12, filters: {event_type: home_payment_received}}
      - {table: home_billing, aggregate: count, field: home_bill_id, within_months: 12, filters: {event_type: home_late_fee_assessed}}
      - {table: home_credits, aggregate: sum, field: banked_value, within_months: 12, filters: {event_type: home_credit_posted}}
      cross_category: [waitlist, access]
  - id: home_ext_reversed_payment_replacement
    base_policy_refs:
    - home_evt_payment_application
    - home_benefit_basis
    overwrite:
    - base_policy: home_evt_payment_application
      superseded_clause: 'Payments settle open charge and fee lines of the same subscription in payment_application_order: the
        line with the earliest due_date first, and among lines due the same day charges before fees, then by bill_date.'
      replaced_by: 'For every payment on a residential subscription, and only for a payment, payments settle open charge and
        fee lines of the same subscription in payment_application_order: the line with the earliest due_date first, and among
        lines due the same day charges before fees, then by bill_date, except that a line named by an open billing dispute,
        and every late fee referring to it, is settled by no payment while the dispute is open; each payment line records as
        its billing_month the statement month of the oldest open line it settles.'
    trigger: on_request
    subject:
    - home_payment_received
    computes: amount
    target_tool: pay_reversed_payment_replacement_378a2026
    params:
      fee_share_access: 0.5
      fee_share_waitlist: 0.75
      fee_window_months: 1
      reversal_share_card: 0.5
      reversal_share_check: 0.75
    rule: 'A replacement payment is the payment a subscriber makes on a call to make good a payment of theirs that the bank
      returned or the card issuer reversed. Meadowlark representatives never take card or bank account numbers and no payment
      method is held on file: the subscriber pays personally through the secure payment portal, by ach or card. The payment
      is recorded on that subscription''s own ledger with billing_type dual. For every payment on a residential subscription,
      and only for a payment, payments settle open charge and fee lines of the same subscription in payment_application_order:
      the line with the earliest due_date first, and among lines due the same day charges before fees, then by bill_date, except
      that a line named by an open billing dispute, and every late fee referring to it, is settled by no payment while the dispute
      is open; each payment line records as its billing_month the statement month of the oldest open line it settles. The replacement
      payment is fixed only after every returned payment on the subscription carries its returned-payment fee, wherever the
      returned-payment fee rule writes one. The replacement payment is not fixed until the charge of the statement month named
      on the latest returned-payment line, once its late-fee grace period has passed with the charge unpaid, carries a late
      fee line referring to it, wherever the reopened-charge late fee rule writes one. The replacement payment covers every
      open line: the sum of the subscription''s charge and fee lines plus every returned-payment line, less every payment received
      and every billing credit posted on the subscription, never below 0.00; the payment is that amount rounded half up to the
      cent. The replacement payment''s dispute hold is settled by the most recently received billing dispute that is still open
      (outcome received; the latest received_date, the first on record among requests received the same day): when it names
      a subscription charge, the hold is that charge''s unpaid amount (its amount less the payments recorded for its statement
      month plus the returned payments recorded for that month, less the billing credits referring to it, never below 0.00)
      plus every late fee referring to it; when it names a fee line (a late fee, returned-payment fee, early termination fee
      or change fee), the hold is that fee''s amount less the billing credits referring to it, never below 0.00; when it names
      any other line (a payment, a returned payment or a billing credit) or no billing dispute is open, the hold is 0.00. The
      hold is deducted from the replacement payment and stays open until the dispute is decided. The replacement payment''s
      pending-statement addition is settled by the posted credit line with the latest posted_date (the first on record among
      lines posted the same day): when no subscription charge prices that line yet and its statement month carries an open estimate
      (estimated charges of that month less the estimate_trueup billing credits of that month) not held for a dispute, the addition
      is that line''s credit_value multiplied by (100 minus savings_rate_pct) and divided by 100, rounded half up to the cent,
      less that open estimate, which the coming charge replaces; when no charge prices that line yet and its statement month
      carries no such open estimate, the addition is that priced amount alone; otherwise the addition is 0.00. The addition
      is added to the replacement payment, so that the charge invoiced for that credit is already paid when it is billed. The
      replacement payment''s fee share is settled from the household''s income-eligibility records in Meadowlark''s other lines:
      when the customer holds a Meadowlark Access subscription in active status whose recert_due_date is on or after today,
      fee_share_access; when that does not hold and the customer holds an Income-Eligible Priority Waitlist reservation in queued
      or offered status on this subscription''s utility account, fee_share_waitlist; otherwise 1. The recent fee lines are the
      late fees and returned-payment fees with a bill_date fewer than fee_window_months whole months before today, other than
      a fee held for a dispute; the part of them beyond the fee share is deducted from the replacement payment and stays open
      for a later payment. The replacement payment''s reversal share is settled from the payment_method recorded on the returned-payment
      line with the latest bill_date (the first on record among lines of the same day): a card payment reversed by the card
      issuer, reversal_share_card; a returned check, reversal_share_check; otherwise 1. The reopened late fees are the late
      fees referring to the latest-invoiced actual dual-billed charge of the statement month named on that returned-payment
      line, other than a fee held for a dispute; the part of them beyond the reversal share is deducted from the replacement
      payment and stays open for a later payment. The replacement payment is assembled once: the covered lines plus the pending-statement
      addition, less every deduction stated for it, each deduction taken once on its own lines and none applied to another,
      never below 0.00, rounded half up to the cent once at the end; the lines left open remain due on the subscription.'
    compute:
    - pay_chg: SUM('home_billing', 'amount', event_type='home_charge_billed')
    - pay_fees: SUM('home_billing', 'amount', event_type='home_late_fee_assessed') + SUM('home_billing', 'amount', event_type='home_returned_fee_assessed')
        + SUM('home_billing', 'amount', event_type='home_etf_assessed') + SUM('home_billing', 'amount', event_type='home_change_fee_assessed')
    - pay_ret: SUM('home_billing', 'amount', event_type='home_payment_returned')
    - pay_paid: SUM('home_billing', 'amount', event_type='home_payment_received')
    - pay_cr: SUM('home_billing', 'amount', event_type='home_billing_credited')
    - pay_open: MX(0, pay_chg + pay_fees + pay_ret - pay_paid - pay_cr)
    - hld_id: LATEST('home_requests', 'home_disputed_bill_id', date_field='received_date', request_type='billing_dispute', outcome='received')
        or 'none'
    - hld_kind: LATEST('home_billing', 'event_type', date_field='bill_date', home_bill_id=hld_id) or 'none'
    - hld_amt: SUM('home_billing', 'amount', home_bill_id=hld_id)
    - hld_month: LATEST('home_billing', 'billing_month', date_field='bill_date', home_bill_id=hld_id) or 'none'
    - hld_paid: SUM('home_billing', 'amount', event_type='home_payment_received', billing_month=hld_month) - SUM('home_billing',
        'amount', event_type='home_payment_returned', billing_month=hld_month)
    - hld_cr: SUM('home_billing', 'amount', event_type='home_billing_credited', home_ref_bill_id=hld_id)
    - hld_fees: SUM('home_billing', 'amount', event_type='home_late_fee_assessed', home_ref_bill_id=hld_id)
    - hld_hold: MX(0, hld_amt - hld_paid - hld_cr) + hld_fees if hld_kind == 'home_charge_billed' else (MX(0, hld_amt - hld_cr)
        if (hld_kind == 'home_late_fee_assessed' or hld_kind == 'home_returned_fee_assessed' or hld_kind == 'home_etf_assessed'
        or hld_kind == 'home_change_fee_assessed') else 0)
    - pnd_id: LATEST('home_credits', 'home_credit_id', date_field='posted_date', event_type='home_credit_posted') or 'none'
    - pnd_month: LATEST('home_credits', 'statement_month', date_field='posted_date', event_type='home_credit_posted') or 'none'
    - pnd_priced: COUNT('home_billing', event_type='home_charge_billed', home_credit_id=pnd_id)
    - pnd_value: SUM('home_credits', 'credit_value', home_credit_id=pnd_id)
    - pnd_dispute: LATEST('home_requests', 'home_disputed_bill_id', date_field='received_date', request_type='billing_dispute',
        outcome='received') or 'none'
    - pnd_est: MX(0, SUM('home_billing', 'amount', event_type='home_charge_billed', charge_basis='estimated', billing_month=pnd_month)
        - SUM('home_billing', 'amount', event_type='home_billing_credited', credit_reason='estimate_trueup', billing_month=pnd_month)
        - SUM('home_billing', 'amount', event_type='home_charge_billed', charge_basis='estimated', billing_month=pnd_month,
        home_bill_id=pnd_dispute))
    - pnd_charge: RND(pnd_value * (100 - P('savings_rate_pct')) / 100 + 0.000000001, 2)
    - pnd_add: pnd_charge - pnd_est if (pnd_priced == 0 and pnd_value > 0 and pnd_est > 0) else (pnd_charge if (pnd_priced ==
        0 and pnd_value > 0) else 0)
    - fsh_acc_active: EXISTS('access', status='active')
    - fsh_acc_recert: CFIELD('access', 'recert_due_date', status='active') or '0001-01-01'
    - fsh_wl_queued: CFIELD('waitlist', 'utility_account_id', variant_name='Income-Eligible Priority Waitlist', status='queued')
        or 'none'
    - fsh_wl_offered: CFIELD('waitlist', 'utility_account_id', variant_name='Income-Eligible Priority Waitlist', status='offered')
        or 'none'
    - fsh_share: K('fee_share_access') if (fsh_acc_active and fsh_acc_recert >= NOW) else (K('fee_share_waitlist') if (fsh_wl_queued
        == F('utility_account_id') or fsh_wl_offered == F('utility_account_id')) else 1)
    - rcf_dispute: LATEST('home_requests', 'home_disputed_bill_id', date_field='received_date', request_type='billing_dispute',
        outcome='received') or 'none'
    - rcf_lines: SUM('home_billing', 'amount', within_months=K('fee_window_months'), date_field='bill_date', event_type='home_late_fee_assessed')
        + SUM('home_billing', 'amount', within_months=K('fee_window_months'), date_field='bill_date', event_type='home_returned_fee_assessed')
        - SUM('home_billing', 'amount', within_months=K('fee_window_months'), date_field='bill_date', event_type='home_late_fee_assessed',
        home_ref_bill_id=rcf_dispute) - SUM('home_billing', 'amount', within_months=K('fee_window_months'), date_field='bill_date',
        home_bill_id=rcf_dispute, event_type='home_late_fee_assessed') - SUM('home_billing', 'amount', within_months=K('fee_window_months'),
        date_field='bill_date', home_bill_id=rcf_dispute, event_type='home_returned_fee_assessed')
    - rvs_method: LATEST('home_billing', 'payment_method', date_field='bill_date', event_type='home_payment_returned') or 'none'
    - rvs_share: K('reversal_share_card') if rvs_method == 'card' else (K('reversal_share_check') if rvs_method == 'check' else
        1)
    - rvs_month: LATEST('home_billing', 'billing_month', date_field='bill_date', event_type='home_payment_returned') or 'none'
    - rvs_charge: LATEST('home_billing', 'home_bill_id', date_field='bill_date', event_type='home_charge_billed', charge_basis='actual',
        billing_type='dual', billing_month=rvs_month) or 'none'
    - rvs_dispute: LATEST('home_requests', 'home_disputed_bill_id', date_field='received_date', request_type='billing_dispute',
        outcome='received') or 'none'
    - rvs_fees: SUM('home_billing', 'amount', event_type='home_late_fee_assessed', home_ref_bill_id=rvs_charge) if rvs_charge
        != rvs_dispute else 0
    - pay_amount: pay_open + pnd_add - hld_hold - (1 - fsh_share) * rcf_lines - (1 - rvs_share) * rvs_fees
    - result: RND(MX(0, pay_amount) + 0.000000001, 2)
    compute_basis:
      pay_chg: the sum of the subscription's charge and fee lines plus every returned-payment line, less every payment received
