name: env_0083_fleet_fuel_card_provider
company: Meridian Fleet Payments, Inc.

background: |
  Meridian Fleet Payments, Inc. is a Kansas City-based commercial fleet card issuer and processor that serves about 41,000 business and public-sector fleets across the United States, from two-truck landscapers to regional carriers, utilities and school districts, through a fuel acceptance network of roughly 52,000 in-network and partner sites plus Mastercard acceptance for its universal programs.
  Its fleet support desk speaks to account administrators, fleet managers, bookkeepers and drivers in a plain, businesslike tone, and every account is a business account rather than a consumer card.
  A fleet's card spending runs on a Fleet Card Program held at one of six tiers: Meridian Fleet Essential, Meridian Fleet Standard, Meridian Fleet Plus, Meridian Fleet Universal, Meridian Fleet Premier and Meridian Fleet Enterprise; each program posts Level-3 fuel and non-fuel purchases with gallons, price per gallon, product, site and odometer, and books its program fees, per-card fees and per-transaction fees.
  Every program bills through the fleet's one Commercial Credit Line, underwritten at one of six tiers (Meridian Secured Fleet Line, Meridian Starter Fleet Line, Meridian Standard Fleet Line, Meridian Preferred Fleet Line, Meridian Premier Fleet Line and Meridian Corporate Fleet Line), which issues weekly, semimonthly or monthly statements and books payments, returned payments, credit fees, limit changes and security deposits.
  Under each program the fleet holds Fleet Cards of six card products: Fuel-Only Vehicle Card, Fuel-Only Driver Card, Fuel & Maintenance Vehicle Card, Fuel & Maintenance Driver Card, All-Purchase Driver Card and Equipment & Off-Road Card, each card carrying its own lifecycle of orders, activations, holds, replacements, reassignments and closures.
  Every card carries a Purchase Controls profile built from one of six templates (Fuel Only Profile, Fuel & Fluids Profile, Fuel & Maintenance Profile, Fleet Services Profile, All Purchases Profile and Bulk & Equipment Fuel Profile), and its authorization declines and one-time overrides are logged against that profile.
  Transaction Disputes are opened one purchase at a time under six case types: Merchant Error Dispute (Quantity or Price), Duplicate Posting Dispute, Credit Not Processed Dispute, Counterfeit Card Fraud Claim, Lost or Stolen Card Fraud Claim and Employee Misuse Review, and they book provisional credits, final credits and reversals.
  Fleets that buy enough fuel enroll in the Volume Rebate Program on Meridian Rebate Schedule A through Meridian Rebate Schedule F, which accrues a cents-per-gallon rebate each month on gallons billed across all of the fleet's programs and settles it on a later statement or by ACH.
  Fleets whose programs allow maintenance may also enroll vehicles in Fleet Maintenance Management at the Maintenance Assist Basic, Maintenance Assist Plus, Maintenance Assist Pro, Managed Maintenance Select, Managed Maintenance Premier or Managed Maintenance Enterprise level, which posts repair orders and per-vehicle service fees.
  A typical caller's account holds one credit line, one to three card programs with anywhere from a handful to several hundred cards, a set of control profiles, often a rebate plan, and a history of statements, payments, posted purchases, fees, card replacements and the occasional dispute.
  Public-sector and school fleets add federal excise tax exempt billing to their programs, carriers add IFTA jurisdiction reports, and most fleets bring months of seasonal fueling patterns, driver turnover and a few late or returned payments into the call.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: program_fees_and_postings
    claim:
      categories: [program]
      event_types: [program_card_fee, program_monthly_fee, program_oon_fee, program_manual_entry_fee, program_intl_fee, program_ifta_report_fee, program_fet_credit, program_fet_credit_reversal, program_fee_reversal, program_fet_status_change, program_ifta_enrollment, program_tier_change]
    summary: >
      Fleet administrators and bookkeepers call about the program side of their bill: a per-card fee that counted cards they believe were closed, a monthly program fee they expected to be waived on gallons, out-of-network, manual-entry or cross-border fees on particular purchases, a quarterly IFTA report fee, a tier move, or a public-sector fleet asking why its federal excise tax credit is missing on some fuel purchases.
      The setting varies by program tier and by when a tier change took effect, by how many cards were active across all of the fleet's programs in the fee cycle (program_agg_fleet_size_band), by each purchase's network, site service, product code, country and entry method, by whether a damaged card's replacement was on order (program_evt_manual_entry_fee), by merchant credits posted later against a purchase, and by the fleet's type and exemption certificate date (program_evt_fet_credit).
      The governing rules are the per-card fee count and ladder (program_evt_card_fee), the program fee waivers (program_evt_monthly_fee), the per-transaction fees with their cycle caps (program_evt_oon_fee, program_evt_manual_entry_fee, program_evt_intl_fee), purchase posting and partner discounts (program_evt_purchase_posting), the tier in effect on a date (program_tier_change) and the two-case fee reversal rule (program_evt_fee_reversal); in the domain, purchases post first, per-transaction fees and federal excise tax credits follow each posting, and monthly and quarterly fees are assessed after the cycle closes.
      The representative verifies the caller, reads the program, card, purchase and charge records, and books fee corrections, reversals, exemption billing changes and IFTA enrollment as service actions, while an exemption certificate or a closure instruction must come from the fleet's authorized administrator in person.
      Requests no rule decides, such as refunding a correctly assessed fee as goodwill, crediting federal excise tax on purchases dated before the certificate was received, pricing purchases at another network's price, or changing how a merchant priced fuel at the pump, have no policy path and go to a human representative as not covered.
  - name: credit_line_billing
    claim:
      categories: [credit]
      event_types: [credit_late_fee, credit_returned_payment_fee, credit_paper_statement_fee, credit_fee_reversal, credit_payment, credit_payment_return, credit_temp_increase, credit_limit_request, credit_deposit_received, credit_reinstate, credit_wire_only, credit_delivery_change, credit_terms_change]
    summary: >
      Fleet owners, controllers and accounts-payable staff call about their commercial credit line: a late fee they think is wrong, a returned ACH payment and its fee, paper statement charges, a suspended line they want reinstated, a temporary limit increase for a busy season, a permanent increase, a billing cycle change, or funding a security deposit.
      The setting varies by credit tier, billing cycle and payment terms, by the statement history and which payments posted inside each statement's due date and grace days, by returned payments in the last twelve months, by open dispute cases whose amounts are left out of the past-due amount (credit_evt_late_fee), by courtesy waivers already used, and by how much of the line the fleet's programs are using.
      The governing rules are statement composition and due dates (credit_evt_statement), payment posting, returns and the wire-only requirement (credit_evt_payment), the greater-of late fee on the past-due amount with its threshold and grace days (credit_evt_late_fee), the returned-payment and paper statement fees (credit_evt_returned_payment_fee, credit_evt_paper_statement_fee), fee reversals and courtesy waivers (credit_evt_fee_reversal), temporary increases (credit_temp_increase_rule), limit reviews (credit_limit_review), suspension and reinstatement (credit_lifecycle) and deposits (credit_deposit_rule); in the domain, a statement is issued, its due date and grace days pass, a late fee follows any past-due amount, and suspension follows a longer delay.
      The representative verifies the caller, reads statements, ledger entries, disputes and programs, and books fee reversals, temporary increases, limit requests, delivery and cycle changes and reinstatements as service actions, while payments and security deposits can only be made by the fleet's authorized payer from the fleet's own bank account through secure self-service, and a closure must be instructed by the administrator.
      Requests outside the rules, such as waiving a returned-payment fee as a courtesy, granting a permanent increase on the call, accepting card or bank details by phone, or extending payment terms beyond the tier's schedule, have no policy path and go to a human representative as not covered.
  - name: driver_card_changes
    claim:
      categories: [card]
      event_types: [card_order, card_activate, card_replacement, card_shipping_fee, card_fee_reversal, card_report_lost_stolen, card_cancel, card_close_suspended, card_driver_update, card_vehicle_update, card_control_assign, card_pin_reset, card_suspend, card_unsuspend]
    summary: >
      Fleet managers, administrators and sometimes drivers call to report a lost or stolen card, replace a damaged card, order cards for new drivers or vehicles with expedited shipping, reassign a card to another driver or vehicle, reset a PIN, place or lift a temporary hold, or cancel the card of a driver who has left.
      The setting varies by card product and assignment type, by the tier of the program each card sits under (card_agg_program_rank_benefits), by how many damaged replacements, reassignments, PIN resets and lost or stolen reports a card or assignee already had in the rolling windows, by the program's card cap and purchase scope, and by whether a card is ordered, active, suspended or closed.
      The governing rules are card ordering and activation (card_order_rule), replacement fees with their order of waivers (card_evt_replacement), shipping fees (card_evt_shipping_fee), fee reversals (card_evt_fee_reversal), lost and stolen blocks (card_lost_stolen), reassignment and cancellation (card_driver_changes), holds (card_hold_rule) and PIN resets and renewals (card_pin_and_renewal); in the domain, a lost or stolen card is blocked before its replacement is ordered, a damaged card stays usable until its replacement is activated, and a cancelled card declines from the recorded confirmation moment.
      The representative verifies the caller, reads the program, card, card-event and profile records, and books blocks, replacements, shipping, reassignments, holds and PIN resets as service actions, while confirming a driver termination or card cancellation is the fleet's authorized administrator's own act.
      Requests no rule decides, such as reactivating a card reported lost after it is found, waiving a replacement fee as a courtesy, issuing a card on a suspended or closed program, or reading a PIN aloud, have no policy path and go to a human representative as not covered.
  - name: transaction_disputes
    claim:
      categories: [dispute]
      event_types: [dispute_open, dispute_request_affidavit, dispute_affidavit_submit, dispute_begin_review, dispute_provisional_credit, dispute_provisional_reversal, dispute_withdraw]
    summary: >
      Fleet administrators call to dispute posted purchases: a pump that billed more gallons than the tank holds or a price that did not match the sign, a purchase posted twice, a refund the merchant promised and never posted, purchases made with a skimmed or counterfeit card, purchases after a card went missing, or purchases by a driver who had already been let go.
      The setting varies by case type, by which statement billed the purchase and how far its statement date lies behind today (dispute_open_rule), by the purchase's network, gallons, price, partner discount and per-transaction fees, by any federal excise tax credit it earned, by the card's tank capacity and its recorded lost, stolen or cancellation moment, by merchant credits already posted, and by the fleet's earlier cases on the same card and program.
      The governing rules are case opening with its filing window, one-case-per-purchase rule and disputed amount basis (dispute_open_rule, dispute_agg_multi_holding), affidavits (dispute_affidavit_rule), provisional credit with its threshold, fee and tax components (dispute_evt_provisional_credit), liability (dispute_liability), chargebacks (dispute_chargeback_rule) and credit settlement and reversal (dispute_evt_credit_settlement); in the domain, a fraud claim follows the card's block, a case is reviewed after its evidence or affidavit is in, provisional credit follows review, and resolution settles or reverses it.
      The representative verifies the caller, reads the purchase, statement, card, charge and earlier case records, and opens cases, records evidence and books provisional credits and reversals as service actions, while signing a dispute affidavit or withdrawing a case is the fleet's authorized administrator's own act through the secure portal.
      Requests outside the rules, such as reopening a resolved or withdrawn case, crediting a purchase past its filing window, absorbing purchases an employee made before the card was cancelled, or promising a chargeback outcome, have no policy path and go to a human representative as not covered.
  - name: volume_rebates
    claim:
      categories: [rebate]
      event_types: [rebate_enroll, rebate_accrual, rebate_adjustment, rebate_reversal, rebate_forfeit, rebate_credit, rebate_schedule_change, rebate_payout_change]
    summary: >
      Fleet owners and finance staff call about volume rebates: a monthly accrual that looks short, a rebate missing from the expected statement, a forfeiture after a late payment, a balance carried forward below the minimum, a schedule review, a request to be paid by ACH, or enrolling a growing fleet.
      The setting varies by rebate schedule and its ladder method, by the month's gallons across all of the fleet's programs and how many of them were partner-discounted, out-of-network, Canadian, mobile-fueled, dyed diesel or DEF, by merchant and dispute credits that took gallons back, by whether any statement due that month was paid late on the credit line, and by the settlement frequency and credit lag.
      The governing rules are the account-wide rebate basis and no-stacking rule (rebate_agg_account_basis), qualifying gallons (rebate_evt_qualifying), the accrual ladder, minimum, diesel bonus and cap (rebate_evt_accrual), forfeitures (rebate_evt_forfeit), settlement and payout (rebate_evt_settlement), corrections (rebate_evt_correction), enrollment (rebate_enrollment) and schedule reviews (rebate_schedule_review); in the domain, a month's purchases post, its accrual posts early the next month, any late statement's forfeiture follows it, and settlement credits the period on a later statement.
      The representative verifies the caller, reads purchases, statements, ledger entries, dispute credits and rebate entries, and books accrual corrections, forfeiture corrections, settlement credits, payout changes and schedule moves as service actions, while ending the rebate agreement is the fleet's authorized administrator's own act.
      Requests no rule decides, such as a rebate on partner-discounted gallons, restoring a forfeiture as goodwill, a negotiated rate outside the published schedules, or a cash payout below the ACH minimum, have no policy path and go to a human representative as not covered.
