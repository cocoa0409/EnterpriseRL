events:
  - type: card_order
    target: fleet_cards
    mutation: create
    meaning: "A new card (first issue or replacement) is ordered on a program."
    grain: "One row per card ordered."
    fields:
      fleet_card_id: "Reference of the card."
      customer_id: "The fleet."
      program_id: "Program the card is issued under."
      control_profile_id: "Purchase-control profile the card carries."
      variant_name: "Card product."
      card_last4: "Last four digits of the card number."
      vehicle_unit_number: "Vehicle or equipment unit number; empty on a driver card."
      tank_capacity_gal: "Recorded tank capacity; 0 when not recorded."
      driver_name: "Assigned driver; empty on vehicle and equipment cards."
      driver_prompt_number: "Driver ID used at the pump; empty when none."
      ordered_on: "Order date."
      expires_on: "Expiry date."
      replaces_card_id: "Card this one replaces; empty on a first issue."
    triggers: []
  - type: card_activate
    target: fleet_cards
    mutation: {transition: {from: ordered, to: active}}
    meaning: "The card is activated."
    grain: "One row per activation."
    fields: {activated_on: "Activation date."}
    triggers: []
  - type: card_order_close
    target: fleet_cards
    mutation: {transition: {from: ordered, to: closed}}
    meaning: "A card never activated within its window, or withdrawn before activation, is closed."
    grain: "One row per closed order."
    fields:
      closed_on: "Closure date."
      close_reason: "not_activated or no_longer_needed."
    triggers: []
  - type: card_suspend
    target: fleet_cards
    mutation: {transition: {from: active, to: suspended}}
    meaning: "A temporary hold is placed on the card."
    grain: "One row per hold."
    fields: {suspended_on: "Date the hold began."}
    triggers: []
  - type: card_unsuspend
    target: fleet_cards
    mutation: {transition: {from: suspended, to: active}}
    meaning: "The hold is lifted."
    grain: "One row per lifted hold."
    fields: {suspended_on: "Cleared (empty) when the hold is lifted."}
    triggers: []
  - type: card_report_lost_stolen
    target: fleet_cards
    mutation: {transition: {from: active, to: closed}}
    meaning: "Anyone on the fleet reports the card lost or stolen and it is blocked and closed at once."
    grain: "One row per report."
    fields:
      closed_on: "Report date."
      closed_time: "Central time of the report, when the block took effect."
      close_reason: "lost or stolen."
    triggers: []
  - type: card_cancel
    target: fleet_cards
    mutation: {transition: {from: active, to: closed}}
    meaning: "The fleet's administrator confirms cancellation of an active card."
    grain: "One row per confirmed cancellation."
    fields:
      closed_on: "Confirmation date."
      closed_time: "Central time of the confirmation."
      close_reason: "driver_terminated, vehicle_retired or no_longer_needed."
    triggers: []
  - type: card_retire_replaced
    target: fleet_cards
    mutation: {transition: {from: active, to: closed}}
    meaning: "A card replaced for damage, compromise or a name change closes when its replacement is activated."
    grain: "One row per retired card."
    fields:
      closed_on: "Activation date of the replacement."
      close_reason: "Always replaced."
    triggers: []
  - type: card_close_suspended
    target: fleet_cards
    mutation: {transition: {from: suspended, to: closed}}
    meaning: "A suspended card is closed: reported lost or stolen, its hold ran out, or its cancellation was confirmed."
    grain: "One row per closure."
    fields:
      closed_on: "Closure date."
      closed_time: "Central time of the closure."
      close_reason: "lost, stolen, hold_expired, driver_terminated, vehicle_retired or no_longer_needed."
    triggers: []
  - type: card_driver_update
    target: fleet_cards
    mutation: update
    meaning: "A driver card is reassigned to another driver by changing its driver ID, or a vehicle card's prompted driver ID changes."
    grain: "One row per reassignment."
    fields:
      driver_name: "Newly assigned driver."
      driver_prompt_number: "Driver ID now used at the pump."
    triggers: []
  - type: card_vehicle_update
    target: fleet_cards
    mutation: update
    meaning: "A vehicle or equipment card is moved to another unit or its tank capacity is corrected."
    grain: "One row per change."
    fields:
      vehicle_unit_number: "Unit number now assigned."
      tank_capacity_gal: "Tank capacity now recorded."
    triggers: []
  - type: card_control_assign
    target: fleet_cards
    mutation: update
    meaning: "The card is moved to another purchase-control profile of the same program."
    grain: "One row per profile change."
    fields: {control_profile_id: "Profile now applied."}
    triggers: []
  - type: card_renewal
    target: fleet_cards
    mutation: update
    meaning: "A renewal card with a new expiry date is shipped before the card expires."
    grain: "One row per renewal."
    fields:
      expires_on: "New expiry date."
      reissued_on: "Date the renewal was shipped."
    triggers: []
  - type: card_replacement
    target: card_events
    meaning: "A replacement is ordered for a card that is lost, stolen, damaged, compromised or needs a new embossed name or unit, with the replacement fee."
    grain: "One row per replacement ordered, on the card being replaced."
    distinguish_by: [event_date, reason_code]
    fields:
      card_event_id: "Reference of the replacement."
      fleet_card_id: "The card being replaced."
      event_date: "Order date of the replacement."
      reason_code: "lost, stolen, damaged, compromised or name_change."
      new_card_id: "The replacement card ordered."
      amount: "Replacement fee charged; 0.00 when no fee applies."
    account: card_fees
    direction: in
    triggers:
      - event: card:card_order
        map: {customer_id: customer_id, replaces_card_id: fleet_card_id, ordered_on: event_date, fleet_card_id: new_card_id}
  - type: card_shipping_fee
    target: card_events
    meaning: "The fee for shipping one card expedited or overnight."
    grain: "One row per card shipped by a paid method."
    distinguish_by: [event_date, shipping_method]
    fields:
      card_event_id: "Reference of the fee."
      fleet_card_id: "The card shipped."
      event_date: "Ship date."
      shipping_method: "expedited or overnight."
      amount: "Fee charged; 0.00 when the program tier ships free."
    account: card_fees
    direction: in
    triggers: []
  - type: card_fee_reversal
    target: card_events
    meaning: "A replacement or shipping fee is reversed in full."
    grain: "One row per reversed fee."
    distinguish_by: [original_event_id]
    fields:
      card_event_id: "Reference of the reversal."
      fleet_card_id: "Card of the original fee."
      original_event_id: "The fee reversed."
      event_date: "Reversal date."
      amount: "Amount reversed (positive)."
      reversal_reason: "assessed_in_error or carrier_late."
    account: card_fees
    direction: out
    triggers: []
  - type: card_pin_reset
    target: card_events
    meaning: "The card PIN (or driver ID used as PIN) is reset and a new one sent."
    grain: "One row per reset."
    distinguish_by: [event_date, pin_reset_channel]
    fields:
      card_event_id: "Reference of the reset."
      fleet_card_id: "The card."
      event_date: "Reset date."
      pin_reset_channel: "representative or admin_portal."
    triggers: []

measures:
  - id: card_msr_damaged_replacements_12m
    window: "Rolling 12 months ending on the day before the replacement order date."
    measure: "Count of card_replacement rows on the same card (or the card it replaced, chained through replaces_card_id) with reason_code damaged."
  - id: card_msr_pin_resets_30d
    window: "Rolling 30 days ending on the reset date, inclusive."
    measure: "Count of card_pin_reset rows on the card with pin_reset_channel representative."
  - id: card_msr_reassignments_12m
    window: "Rolling 12 months ending on the day before the reassignment date."
    measure: "Count of card_driver_update and card_vehicle_update rows on the card that changed the assignee (a tank capacity correction alone does not count)."
  - id: card_msr_lost_stolen_12m
    window: "Rolling 12 months ending on the report date."
    measure: "Count of card_report_lost_stolen and card_close_suspended rows with close_reason lost or stolen on cards of the same program assigned to the same driver or unit."
  - id: card_msr_open_cards_on_program
    window: "Current state."
    measure: "Count of the program's cards in status ordered or active."

policies:
  - id: card_agg_multi_holding
    subject: [card_order]
    rule: "A customer may hold any number of cards (max_per_customer null), bounded per program by the program tier's max_active_cards counted by card_msr_open_cards_on_program, and per assignee by max_active_per_assignee: the cards of one program in status ordered, active or suspended assigned to the same vehicle unit, driver or equipment unit may not exceed it. A replacement ordered for a lost, stolen or compromised card does not count the card it replaces, which is already closed or closes on the replacement's activation."
    eligibility: []
    params: {max_per_customer: null, max_active_per_assignee: =max_active_per_assignee}
    measures: [card_msr_open_cards_on_program]
  - id: card_agg_program_rank_benefits
    subject: [card_replacement, card_shipping_fee]
    rule: "A card's fees depend on the program it is issued under: a card on a program whose tier rank in the Fleet Card Program ladder (on the fee date) is at or above the card product's replacement_fee_waived_program_min_rank pays no replacement fee, and one at or above expedited_free_program_min_rank pays no expedited or overnight shipping fee. These are the only program-based card fee benefits, and they apply before any other card fee rule; a benefit that already makes a fee 0.00 is not counted as a free damaged replacement."
    eligibility: []
    params:
      per_tier:
        Fuel-Only Vehicle Card: {replacement_fee_waived_program_min_rank: =replacement_fee_waived_program_min_rank, expedited_free_program_min_rank: =expedited_free_program_min_rank}
        Fuel-Only Driver Card: {replacement_fee_waived_program_min_rank: =replacement_fee_waived_program_min_rank, expedited_free_program_min_rank: =expedited_free_program_min_rank}
        Fuel & Maintenance Vehicle Card: {replacement_fee_waived_program_min_rank: =replacement_fee_waived_program_min_rank, expedited_free_program_min_rank: =expedited_free_program_min_rank}
        Fuel & Maintenance Driver Card: {replacement_fee_waived_program_min_rank: =replacement_fee_waived_program_min_rank, expedited_free_program_min_rank: =expedited_free_program_min_rank}
        All-Purchase Driver Card: {replacement_fee_waived_program_min_rank: =replacement_fee_waived_program_min_rank, expedited_free_program_min_rank: =expedited_free_program_min_rank}
        Equipment & Off-Road Card: {replacement_fee_waived_program_min_rank: =replacement_fee_waived_program_min_rank, expedited_free_program_min_rank: =expedited_free_program_min_rank}
  - id: card_order_rule
    subject: [card_order, card_activate, card_order_close]
    rule: "A card is ordered only on a program in status active. Its product_restriction may be no broader than the program tier's max_purchase_scope, a driver card needs the program tier's driver_id_prompting to be optional, a card with mobile_wallet_token needs the program's mobile_wallet_payments, and the card must carry a purchase-control profile of the same program in status active. Vehicle cards need vin_required and vehicle_description_required data and, where tank_capacity_required is true, a tank capacity no greater than max_tank_capacity_gal. expires_on is the last day of the month card_validity_months months after the order month. Card orders carry card_order_fee_usd. A card not activated within activation_window_days calendar days of ordered_on is closed with close_reason not_activated; a card activates only after the fleet confirms receipt."
    eligibility:
      - id: program_active
        applies_to: [card_order]
        kind: state
        condition: "A card is ordered only on a program in status active."
        evidence_fields: [fleet_programs.status, fleet_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fleet_programs.program_id]]
          action_bindings: {fleet_programs.program_id: program_id}
        state_contract:
          field: fleet_programs.status
          allowed: [active]
    params: {card_validity_months: =card_validity_months, activation_window_days: =activation_window_days, card_order_fee_usd: =card_order_fee_usd, vin_required: =vin_required, vehicle_description_required: =vehicle_description_required, tank_capacity_required: =tank_capacity_required, max_tank_capacity_gal: =max_tank_capacity_gal, product_restriction: =product_restriction, assignment_type: =assignment_type}
  - id: card_evt_replacement
    subject: [card_replacement, card_retire_replaced]
    rule: "A replacement is ordered for reason lost or stolen only after the card has been blocked by a lost or stolen report; for damaged, compromised or name_change the old card stays usable until the replacement is activated, when it closes with close_reason replaced (replacement_activation_closes_old). The replacement keeps the card product, program, profile and assignee of the card it replaces, with a new number for lost, stolen and compromised and the same number otherwise (replacement_number_basis). The fee is figured in this order: a program-rank benefit under card_agg_program_rank_benefits makes it 0.00; otherwise reason compromised carries no fee where compromised_replacement_fee_waived is true; reason damaged carries no fee while card_msr_damaged_replacements_12m is below free_damaged_replacements_per_12m; reason name_change carries name_change_replacement_fee_usd; every other replacement carries replacement_fee_usd. The fee is the card product's on the replacement date. When card_msr_lost_stolen_12m has reached lost_stolen_reports_per_12m_before_review, a replacement for lost or stolen is ordered only on the administrator's confirmation."
    eligibility: []
    params:
      per_tier:
        Fuel-Only Vehicle Card: {replacement_fee_usd: =replacement_fee_usd, name_change_replacement_fee_usd: =name_change_replacement_fee_usd, free_damaged_replacements_per_12m: =free_damaged_replacements_per_12m, compromised_replacement_fee_waived: =compromised_replacement_fee_waived}
        Fuel-Only Driver Card: {replacement_fee_usd: =replacement_fee_usd, name_change_replacement_fee_usd: =name_change_replacement_fee_usd, free_damaged_replacements_per_12m: =free_damaged_replacements_per_12m, compromised_replacement_fee_waived: =compromised_replacement_fee_waived}
        Fuel & Maintenance Vehicle Card: {replacement_fee_usd: =replacement_fee_usd, name_change_replacement_fee_usd: =name_change_replacement_fee_usd, free_damaged_replacements_per_12m: =free_damaged_replacements_per_12m, compromised_replacement_fee_waived: =compromised_replacement_fee_waived}
        Fuel & Maintenance Driver Card: {replacement_fee_usd: =replacement_fee_usd, name_change_replacement_fee_usd: =name_change_replacement_fee_usd, free_damaged_replacements_per_12m: =free_damaged_replacements_per_12m, compromised_replacement_fee_waived: =compromised_replacement_fee_waived}
        All-Purchase Driver Card: {replacement_fee_usd: =replacement_fee_usd, name_change_replacement_fee_usd: =name_change_replacement_fee_usd, free_damaged_replacements_per_12m: =free_damaged_replacements_per_12m, compromised_replacement_fee_waived: =compromised_replacement_fee_waived}
        Equipment & Off-Road Card: {replacement_fee_usd: =replacement_fee_usd, name_change_replacement_fee_usd: =name_change_replacement_fee_usd, free_damaged_replacements_per_12m: =free_damaged_replacements_per_12m, compromised_replacement_fee_waived: =compromised_replacement_fee_waived}
    measures: [card_msr_damaged_replacements_12m, card_msr_lost_stolen_12m]
  - id: card_evt_shipping_fee
    subject: [card_shipping_fee]
    rule: "Cards ship standard at no charge within standard_shipping_business_days. A card the fleet asks to ship expedited (expedited_shipping_business_days) carries expedited_shipping_fee_usd and one shipped overnight carries overnight_shipping_fee_usd, per card, at the card product's fee on the ship date, unless the program-rank benefit makes it 0.00. An overnight order placed after overnight_order_cutoff_time ships the next business day. A renewal card ships standard and carries reissue_fee_usd."
    eligibility: []
    params: {expedited_shipping_fee_usd: =expedited_shipping_fee_usd, overnight_shipping_fee_usd: =overnight_shipping_fee_usd, standard_shipping_business_days: =standard_shipping_business_days, expedited_shipping_business_days: =expedited_shipping_business_days, overnight_order_cutoff_time: =overnight_order_cutoff_time, reissue_fee_usd: =reissue_fee_usd}
  - id: card_evt_fee_reversal
    subject: [card_fee_reversal]
    rule: "A replacement or shipping fee is reversed in full, naming it, in two cases only: reason assessed_in_error when the fee was not owed under this charter (a program-rank benefit, a free damaged replacement or the compromised waiver applied, or the wrong product's fee was used); reason carrier_late for an expedited or overnight fee when the carrier delivered later than the paid method's business days. A fee is reversed at most once and never as a courtesy."
    eligibility:
      - id: card_fee_not_already_reversed
        applies_to: [card_fee_reversal]
        kind: dedup
        condition: "A fee is reversed at most once and never as a courtesy."
        evidence_fields: [card_events.original_event_id, card_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_events.original_event_id]]
          action_bindings: {card_events.original_event_id: original_event_id}
        dedup_contract:
          table: card_events
          mode: separate_record
          object_bindings: {original_event_id: original_event_id}
          duplicate_filters: {event_type: [card_fee_reversal]}
          distinct_fields: []
  - id: card_lost_stolen
    subject: [card_report_lost_stolen, card_close_suspended]
    rule: "Anyone calling for the fleet who can name the card may report it lost or stolen; the card is blocked and closed at once (lost_stolen_block_effective), and closed_on and closed_time record the moment of the report. A card reported lost is never reactivated even if found (found_card_reactivation). Purchases on the card authorized before the recorded report moment remain the fleet's responsibility except as the dispute charter provides; purchases authorized after it are declined. A suspended card reported lost or stolen closes the same way."
    eligibility: []
    params: {lost_stolen_block_effective: =lost_stolen_block_effective, found_card_reactivation: =found_card_reactivation, lost_stolen_reports_per_12m_before_review: =lost_stolen_reports_per_12m_before_review}
  - id: card_driver_changes
    subject: [card_driver_update, card_vehicle_update, card_cancel, card_control_assign]
    rule: "A card moves to another assignee as its reassignment_method allows: vehicle_update changes the unit number (and tank capacity), driver_id_update changes the driver and driver ID, and replacement_required means a name_change replacement must be ordered instead. Reassignments are allowed while card_msr_reassignments_12m is below reassignments_per_12m; a card whose limit is reached is moved by a name_change replacement. A driver card whose embossed driver leaves must not be reassigned without a replacement where driver_name_embossed is true. Cancelling a card for a terminated driver, a retired vehicle or no further need is confirmed by the fleet's authorized administrator in person and closes the card the same day (termination_close_effective); purchases authorized after the recorded confirmation moment are declined. A card may move only to an active purchase-control profile of its own program."
    eligibility: []
    params: {reassignment_method: =reassignment_method, reassignments_per_12m: =reassignments_per_12m, driver_name_embossed: =driver_name_embossed, vehicle_unit_embossed: =vehicle_unit_embossed, termination_close_effective: =termination_close_effective, driver_id_prompt: =driver_id_prompt, odometer_prompt: =odometer_prompt}
    measures: [card_msr_reassignments_12m]
  - id: card_hold_rule
    subject: [card_suspend, card_unsuspend]
    rule: "A temporary hold is placed at the fleet's request or by the system when an active card has had no posted purchase for dormant_suspend_days days since its activation or last purchase. A hold is lifted on the fleet's request. A hold that reaches suspension_max_days days from suspended_on without being lifted closes the card with close_reason hold_expired."
    eligibility: []
    params: {suspension_max_days: =suspension_max_days, dormant_suspend_days: =dormant_suspend_days}
  - id: card_pin_and_renewal
    subject: [card_pin_reset, card_renewal]
    rule: "A representative may reset a card's PIN while card_msr_pin_resets_30d is below pin_resets_per_30d; beyond that only the account administrator resets it through the portal. The new PIN (pin_length digits) reaches the cardholder by pin_delivery and is never read out by phone. pin_attempts_before_lock wrong entries lock the card at the pump until reset. An active card with a purchase in the last 6 months is renewed auto_reissue_days_before_expiry days before expires_on with a new expires_on card_validity_months later, and the renewal must be activated where renewal_activation_required is true. Card features contactless_enabled, chip_enabled, mobile_wallet_token, dyed_diesel_allowed, def_allowed, receipt_prompt and card_count_toward_fee are set by the card product."
    eligibility: []
    params: {pin_resets_per_30d: =pin_resets_per_30d, pin_length: =pin_length, pin_attempts_before_lock: =pin_attempts_before_lock, pin_delivery: =pin_delivery, auto_reissue_days_before_expiry: =auto_reissue_days_before_expiry, renewal_activation_required: =renewal_activation_required}
    measures: [card_msr_pin_resets_30d]
