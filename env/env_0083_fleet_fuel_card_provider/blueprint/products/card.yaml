# Fleet Cards charter — Meridian Fleet Payments. Each card issued under a fleet's card program is a
# holding: a vehicle-assigned, driver-assigned or equipment card of one card product, with its
# prompts, its purchase-control profile and its lifecycle from order to closure. Replacements,
# shipping, PIN resets, reassignment, suspension, lost/stolen blocks and driver terminations are
# booked here; card fees bill on the fleet's credit line statement.
category: card
display_name: Fleet Cards

binding:
  holding_table: fleet_cards
  event_tables: [card_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [ordered, active, suspended, closed]
  transitions:
    - {from: ordered, to: active, by: agent, means: "The card is activated for use after the fleet confirms receipt."}
    - {from: ordered, to: closed, by: system, means: "A card not activated within its activation window, or an order withdrawn before activation, is closed."}
    - {from: active, to: suspended, by: agent, means: "A temporary hold is placed on the card at the fleet's request or for dormancy; it declines while suspended."}
    - {from: suspended, to: active, by: agent, means: "The temporary hold is lifted."}
    - {from: active, to: closed, by: agent, means: "The card is reported lost or stolen and is blocked and closed at once."}
    - {from: active, to: closed, by: user, means: "The fleet's authorized administrator confirms cancellation of the card (driver terminated, vehicle retired, no longer needed)."}
    - {from: active, to: closed, by: system, means: "A card being replaced for damage, compromise or a name change closes when its replacement is activated."}
    - {from: suspended, to: closed, by: agent, means: "A suspended card is reported lost or stolen, its hold reaches the maximum length, or its cancellation is confirmed."}

accounts:
  - key: card_fees
    unit: USD
    meaning: "Card replacement and expedited shipping fees charged to the fleet: replacement and shipping fees book in, card fee reversals book out."

parameter_schema:
  assignment_type: What the card is assigned to (enum vehicle | driver | equipment).
  product_restriction: Product restriction code of the card (enum fuel_only | fuel_and_maintenance | all_purchases); never broader than the program tier's max_purchase_scope.
  dyed_diesel_allowed: Whether the card may buy dyed (off-road, untaxed) diesel (boolean).
  def_allowed: Whether the card may buy diesel exhaust fluid (boolean).
  driver_id_prompt: Driver ID prompt at the pump (enum optional | required).
  odometer_prompt: Odometer or hour-meter prompt at the pump (enum odometer_required | hour_meter_required).
  vin_required: Whether the vehicle's VIN must be on file to order the card (boolean).
  tank_capacity_required: Whether the tank capacity in gallons must be recorded on the card (boolean).
  pin_length: Digits in the card PIN or driver ID used as PIN (integer).
  pin_attempts_before_lock: Consecutive wrong PIN or driver ID entries that lock the card at the pump (integer).
  pin_resets_per_30d: PIN resets a representative may perform on one card within any rolling 30 days; beyond it only the account administrator may reset through the portal (integer).
  pin_delivery: How a new or reset PIN reaches the cardholder (enum mailer | app_or_mailer).
  replacement_fee_usd: Fee per replacement card ordered for lost, stolen or damaged (USD).
  name_change_replacement_fee_usd: Fee per replacement ordered for a change of embossed name or unit (USD).
  free_damaged_replacements_per_12m: Replacements for reason damaged per card within any rolling 12 months that carry no fee (integer).
  compromised_replacement_fee_waived: Whether a replacement Meridian orders because the card number was compromised at a merchant carries no fee (boolean).
  replacement_fee_waived_program_min_rank: Program tier rank (Fleet Card Program ladder) at or above which replacement fees are not charged (integer rank; 7 = never waived).
  standard_shipping_business_days: Business days for standard delivery of a card (integer).
  expedited_shipping_business_days: Business days for expedited (two-day) delivery (integer).
  expedited_shipping_fee_usd: Fee per card shipped expedited (USD).
  overnight_shipping_fee_usd: Fee per card shipped overnight (USD).
  overnight_order_cutoff_time: Central time by which an overnight order must be placed to ship that business day (HH:MM).
  expedited_free_program_min_rank: Program tier rank at or above which expedited and overnight shipping carry no fee (integer rank; 7 = never free).
  card_validity_months: Months from the order date to the card's expiry month (integer months).
  auto_reissue_days_before_expiry: Days before expires_on on which a renewal card is shipped automatically to active cards with a purchase in the last 6 months (integer days).
  reissue_fee_usd: Fee for an automatic renewal card (USD).
  card_order_fee_usd: Fee for issuing a new card on order (USD).
  max_active_per_assignee: Cards in status ordered, active or suspended allowed per vehicle unit, driver or piece of equipment on one program (integer).
  driver_name_embossed: Whether the driver's name is embossed (boolean).
  vehicle_unit_embossed: Whether the vehicle or equipment unit number is embossed (boolean).
  reassignment_method: How the card moves to another assignee (enum vehicle_update | driver_id_update | replacement_required).
  reassignments_per_12m: Reassignments allowed per card within any rolling 12 months (integer; 0 = none, a replacement is required).
  suspension_max_days: Longest a card may stay suspended on a temporary hold before it must be reactivated or closed (integer days).
  dormant_suspend_days: Days with no posted purchase after activation or the last purchase at which an active card is suspended for dormancy (integer days).
  activation_window_days: Days after the order date within which the card must be activated before the order is closed (integer days).
  lost_stolen_reports_per_12m_before_review: Lost or stolen reports on cards of the same assignee within rolling 12 months after which the next replacement needs administrator confirmation (integer).
  contactless_enabled: Whether the card carries contactless payment (boolean).
  chip_enabled: Whether the card carries an EMV chip (boolean).
  mobile_wallet_token: Whether the card can be added to the Meridian Fleet app for pay-at-pump (boolean; needs the program's mobile_wallet_payments).
  replacement_number_basis: 'Whether a replacement carries a new card number (enum new_number_lost_stolen_compromised: new number for lost, stolen and compromised; same number for damaged and name change).'
  lost_stolen_block_effective: When a lost or stolen report blocks the card (enum immediate_on_report).
  termination_close_effective: When a confirmed driver termination or card cancellation closes the card (enum same_day_on_confirmation).
  found_card_reactivation: Whether a card reported lost may be reactivated if found (boolean).
  replacement_activation_closes_old: Whether activating a damaged, compromised or name-change replacement closes the old card the same day (boolean).
  renewal_activation_required: Whether a renewal card must be activated before use (boolean).
  max_tank_capacity_gal: Largest tank capacity that may be recorded on the card (integer gallons; 0 = not recorded).
  receipt_prompt: Whether the pump prompts for a receipt image upload in the app (boolean).
  vehicle_description_required: Whether year, make and model must be on file (boolean).
  card_count_toward_fee: Whether the card counts toward the program's per-card fee while active (boolean).

