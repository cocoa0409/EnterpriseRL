# Purchase Controls charter — Meridian Fleet Payments. A purchase-control profile is the rule set an
# account administrator places on a program's cards: product restriction code, per-transaction,
# daily and weekly dollar limits, gallon and transaction-count limits, day-of-week and time-of-day
# windows, tank-capacity and prompt checks. Authorization declines and one-time overrides are booked
# against the profile.
category: control
display_name: Purchase Controls

binding:
  holding_table: control_profiles
  event_tables: [control_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending, active, retired]
  transitions:
    - {from: pending, to: active, by: agent, means: "A profile set up at the administrator's instruction is put in force."}
    - {from: pending, to: retired, by: system, means: "A profile never put in force within 30 days is discarded."}
    - {from: active, to: retired, by: user, means: "The fleet's authorized account administrator retires the profile once no card carries it."}

accounts: []

parameter_schema:
  product_restriction_code: Product restriction code the profile applies (enum fuel_only | fuel_and_maintenance | all_purchases).
  allowed_product_codes: Product codes that authorize under the profile (list).
  default_per_txn_limit_usd: Per-transaction dollar limit set when the profile is created (USD).
  max_per_txn_limit_usd: Highest per-transaction limit the profile may carry (USD).
  default_daily_limit_usd: Daily dollar limit set at creation (USD).
  max_daily_limit_usd: Highest daily dollar limit (USD).
  default_weekly_limit_usd: Weekly dollar limit set at creation (USD).
  max_weekly_limit_usd: Highest weekly dollar limit (USD).
  default_daily_gallon_limit: Daily gallon limit set at creation (integer gallons).
  max_daily_gallon_limit: Highest daily gallon limit (integer gallons).
  default_daily_txn_limit: Fuel purchases per day set at creation (integer).
  max_daily_txn_limit: Highest fuel purchases per day (integer).
  default_allowed_days: Days purchases authorize at creation (enum all_days | mon_fri | mon_sat).
  default_window_start: Start of the allowed time window at creation, site local time (HH:MM).
  default_window_end: End of the allowed time window at creation, site local time, inclusive (HH:MM).
  min_window_hours: Shortest custom time window allowed (integer hours).
  tank_capacity_check_default: Whether the tank-capacity check is on at creation where the program allows it (boolean).
  tank_capacity_tolerance_pct: Percent above the card's recorded tank capacity a single fill may reach before it declines (percent).
  override_available: Whether a representative may grant a one-time override of a declined limit (boolean).
  override_max_amount_usd: Largest one-time override authorization (USD).
  override_valid_hours: Hours a one-time override stays usable from its grant (integer hours).
  overrides_per_card_30d: One-time overrides per card within rolling 30 days (integer).
  override_requires_admin: Whether the account administrator must request the override (boolean; false = the driver may ask with the card in hand).
  overridable_reasons: Decline reasons a one-time override may lift (list).
  weekly_period_basis: Week used for weekly limits (enum monday_to_sunday).
  daily_period_basis: Day used for daily limits (enum site_local_calendar_day).
  limit_change_effective: When a limit change applies (enum immediate_on_save).
  limit_changes_by: Who may set or raise a profile's limits (enum account_administrator).
  nonfuel_per_txn_limit_usd: Separate per-transaction limit on non-fuel purchases (USD; 0.00 = no non-fuel purchases).
  car_wash_allowed: Whether car washes authorize (boolean).
  merchandise_allowed: Whether merchandise authorizes (boolean).
  maintenance_allowed: Whether maintenance services authorize (boolean).
  def_allowed: Whether DEF authorizes (boolean).
  premium_grade_allowed: Whether premium unleaded authorizes (boolean; when false only regular and midgrade).
  full_serve_allowed: Whether full-serve fueling authorizes (boolean).
  out_of_network_allowed: Whether purchases at out_of_network sites authorize (boolean).
  canada_allowed: Whether Canadian purchases authorize where the program accepts them (boolean).
  odometer_validation: 'Odometer check at the pump (enum none | reasonableness: not lower than the last entry and not more than odometer_max_miles_between_fills above it).'
  odometer_max_miles_between_fills: Largest odometer advance accepted between fills (integer miles).
  driver_id_validation: Whether the entered driver ID must match a driver on file (boolean).
  velocity_minutes: Minutes that must pass between two fuel purchases on the same card (integer).
  state_restriction_available: Whether purchases may be limited to listed states (boolean).
  max_states_listed: Most states a state restriction may list (integer; 0 = not available).
  holiday_window_rule: How a time window treats US federal holidays (enum same_as_weekday).
  time_zone_basis: Clock a time window is tested against (enum site_local_time).
  max_cards_per_profile: Cards that may carry the profile (integer).
  retire_requires_no_cards: Whether a profile may be retired only when no card carries it (boolean).
  decline_evaluation_order: Order in which checks are applied at authorization; the first failing check is the recorded decline_reason (list).

