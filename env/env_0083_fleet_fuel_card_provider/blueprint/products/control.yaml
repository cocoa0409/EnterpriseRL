events:
  - type: control_create
    target: control_profiles
    mutation: create
    meaning: "A purchase-control profile is set up on a program at the administrator's instruction."
    grain: "One row per profile."
    fields:
      control_profile_id: "Reference of the profile."
      customer_id: "The fleet."
      program_id: "Program the profile belongs to."
      variant_name: "Profile template."
      profile_name: "Name the administrator gives the profile."
      per_txn_limit_usd: "Per-transaction limit."
      daily_limit_usd: "Daily limit."
      weekly_limit_usd: "Weekly limit."
      daily_gallon_limit: "Daily gallon limit."
      daily_txn_limit: "Fuel purchases per day."
      allowed_days: "Days purchases authorize."
      window_start: "Start of the time window."
      window_end: "End of the time window."
      tank_capacity_check: "Whether the tank-capacity check is on."
      created_on: "Set-up date."
    triggers: []
  - type: control_activate
    target: control_profiles
    mutation: {transition: {from: pending, to: active}}
    meaning: "The profile is put in force."
    grain: "One row per activation."
    fields: {activated_on: "Date in force."}
    triggers: []
  - type: control_discard
    target: control_profiles
    mutation: {transition: {from: pending, to: retired}}
    meaning: "A profile never put in force is discarded."
    grain: "One row per discarded profile."
    fields: {retired_on: "Discard date."}
    triggers: []
  - type: control_retire
    target: control_profiles
    mutation: {transition: {from: active, to: retired}}
    meaning: "The administrator retires a profile no card carries."
    grain: "One row per retirement."
    fields: {retired_on: "Retirement date."}
    triggers: []
  - type: control_limit_change
    target: control_profiles
    mutation: update
    meaning: "The administrator changes the profile's dollar, gallon or count limits."
    grain: "One row per change."
    fields:
      per_txn_limit_usd: "New per-transaction limit."
      daily_limit_usd: "New daily limit."
      weekly_limit_usd: "New weekly limit."
      daily_gallon_limit: "New daily gallon limit."
      daily_txn_limit: "New purchases per day."
    triggers: []
  - type: control_window_change
    target: control_profiles
    mutation: update
    meaning: "The administrator changes the days, time window or tank-capacity check."
    grain: "One row per change."
    fields:
      allowed_days: "New allowed days."
      window_start: "New window start."
      window_end: "New window end."
      tank_capacity_check: "New tank-capacity setting."
    triggers: []
  - type: control_decline
    target: control_events
    meaning: "A purchase attempt is declined at authorization."
    grain: "One row per declined authorization attempt."
    distinguish_by: [fleet_card_id, event_date, event_time]
    fields:
      control_event_id: "Reference of the decline."
      fleet_card_id: "Card presented."
      event_date: "Attempt date (site local)."
      event_time: "Attempt time (site local)."
      site_number: "Site number."
      product_code: "Product attempted."
      attempted_amount: "Amount requested."
      attempted_gallons: "Gallons requested; 0.000 for non-fuel."
      decline_reason: "First failing check."
    triggers: []
  - type: control_override
    target: control_events
    meaning: "A one-time override lets one purchase authorize past a declined limit."
    grain: "One row per override granted."
    distinguish_by: [fleet_card_id, event_date, event_time]
    fields:
      control_event_id: "Reference of the override."
      fleet_card_id: "Card the override is for."
      event_date: "Grant date."
      event_time: "Grant time (Central)."
      decline_reason: "The decline reason lifted."
      override_amount: "Most the one purchase may authorize."
      override_expires_on: "Date the override stops being usable."
      override_expires_time: "Time it stops being usable (Central)."
    triggers: []

measures:
  - id: control_msr_overrides_30d
    window: "Rolling 30 days ending on the grant date, inclusive."
    measure: "Count of control_override rows on the same card."
  - id: control_msr_profiles_in_force
    window: "Current state."
    measure: "Count of the program's control_profiles in status pending or active."

policies:
  - id: control_agg_multi_holding
    subject: [control_create]
    rule: "A customer may hold any number of profiles (max_per_customer null), bounded per program by the program tier's max_control_profiles counted by control_msr_profiles_in_force; each card carries exactly one profile of its own program, and a profile may be carried by at most max_cards_per_profile cards."
    eligibility: []
    params: {max_per_customer: null, max_cards_per_profile: =max_cards_per_profile}
    measures: [control_msr_profiles_in_force]
  - id: control_agg_program_scope
    subject: [control_create, control_window_change]
    rule: "A profile is bounded by its program: its product_restriction_code may be no broader than the program tier's max_purchase_scope; a day-of-week or time window other than the defaults is allowed only where the program tier's custom_time_windows is true; the tank-capacity check may be on only where tank_capacity_check_available is true; Canadian purchases authorize only where both canada_allowed and the program's canada_acceptance are true."
    eligibility: []
    params: {product_restriction_code: =product_restriction_code, canada_allowed: =canada_allowed}
  - id: control_create_rule
    subject: [control_create, control_activate, control_discard]
    rule: "A profile is created only on the instruction of the fleet's authorized account administrator (limit_changes_by), starting from its template's defaults (default_per_txn_limit_usd, default_daily_limit_usd, default_weekly_limit_usd, default_daily_gallon_limit, default_daily_txn_limit, default_allowed_days, default_window_start, default_window_end, tank_capacity_check_default) unless the administrator sets other values within the template's maxima, and the per-transaction limit is never above the daily limit nor the daily above the weekly. A profile not put in force within 30 days is discarded."
    eligibility: []
    params: {default_per_txn_limit_usd: =default_per_txn_limit_usd, default_daily_limit_usd: =default_daily_limit_usd, default_weekly_limit_usd: =default_weekly_limit_usd, default_daily_gallon_limit: =default_daily_gallon_limit, default_daily_txn_limit: =default_daily_txn_limit, default_allowed_days: =default_allowed_days, default_window_start: =default_window_start, default_window_end: =default_window_end, tank_capacity_check_default: =tank_capacity_check_default, limit_changes_by: =limit_changes_by}
  - id: control_limit_change_rule
    subject: [control_limit_change]
    rule: "Limits change only on the instruction of the fleet's authorized account administrator and take effect at once (limit_change_effective). Each limit stays at or below its template maximum (max_per_txn_limit_usd, max_daily_limit_usd, max_weekly_limit_usd, max_daily_gallon_limit, max_daily_txn_limit), the per-transaction limit at or below the daily limit and the daily at or below the weekly; a change outside these bounds is not made. A request above a maximum needs a different template."
    eligibility: []
    params:
      per_tier:
        Fuel Only Profile: {max_per_txn_limit_usd: =max_per_txn_limit_usd, max_daily_limit_usd: =max_daily_limit_usd, max_weekly_limit_usd: =max_weekly_limit_usd, max_daily_gallon_limit: =max_daily_gallon_limit, max_daily_txn_limit: =max_daily_txn_limit}
        Fuel & Fluids Profile: {max_per_txn_limit_usd: =max_per_txn_limit_usd, max_daily_limit_usd: =max_daily_limit_usd, max_weekly_limit_usd: =max_weekly_limit_usd, max_daily_gallon_limit: =max_daily_gallon_limit, max_daily_txn_limit: =max_daily_txn_limit}
        Fuel & Maintenance Profile: {max_per_txn_limit_usd: =max_per_txn_limit_usd, max_daily_limit_usd: =max_daily_limit_usd, max_weekly_limit_usd: =max_weekly_limit_usd, max_daily_gallon_limit: =max_daily_gallon_limit, max_daily_txn_limit: =max_daily_txn_limit}
        Fleet Services Profile: {max_per_txn_limit_usd: =max_per_txn_limit_usd, max_daily_limit_usd: =max_daily_limit_usd, max_weekly_limit_usd: =max_weekly_limit_usd, max_daily_gallon_limit: =max_daily_gallon_limit, max_daily_txn_limit: =max_daily_txn_limit}
        All Purchases Profile: {max_per_txn_limit_usd: =max_per_txn_limit_usd, max_daily_limit_usd: =max_daily_limit_usd, max_weekly_limit_usd: =max_weekly_limit_usd, max_daily_gallon_limit: =max_daily_gallon_limit, max_daily_txn_limit: =max_daily_txn_limit}
        Bulk & Equipment Fuel Profile: {max_per_txn_limit_usd: =max_per_txn_limit_usd, max_daily_limit_usd: =max_daily_limit_usd, max_weekly_limit_usd: =max_weekly_limit_usd, max_daily_gallon_limit: =max_daily_gallon_limit, max_daily_txn_limit: =max_daily_txn_limit}
  - id: control_window_rule
    subject: [control_window_change]
    rule: "A custom window is at least min_window_hours long, is tested against site_local_time (time_zone_basis) with both ends inclusive, and applies on US federal holidays as on any other day of its allowed_days (holiday_window_rule). A state restriction may list up to max_states_listed states where state_restriction_available is true."
    eligibility: []
    params: {min_window_hours: =min_window_hours, time_zone_basis: =time_zone_basis, holiday_window_rule: =holiday_window_rule, state_restriction_available: =state_restriction_available, max_states_listed: =max_states_listed}
  - id: control_evt_decline
    subject: [control_decline]
    rule: "At authorization the checks run in decline_evaluation_order and the first that fails is recorded as decline_reason. Daily limits count purchases on the site-local calendar day (daily_period_basis) and weekly limits Monday through Sunday (weekly_period_basis), both by authorized amount. A fuel product outside allowed_product_codes, premium grade where premium_grade_allowed is false, full serve where full_serve_allowed is false, an out-of-network site where out_of_network_allowed is false, and a non-fuel purchase above nonfuel_per_txn_limit_usd fail product_restricted (car_wash_allowed, merchandise_allowed, maintenance_allowed and def_allowed set the non-fuel and fluid codes). A fill above the card's tank_capacity_gal by more than tank_capacity_tolerance_pct percent fails tank_capacity where the check is on. A purchase less than velocity_minutes after the card's previous fuel purchase fails velocity. Odometer and driver ID checks follow odometer_validation, odometer_max_miles_between_fills and driver_id_validation."
    eligibility: []
    params: {decline_evaluation_order: =decline_evaluation_order, daily_period_basis: =daily_period_basis, weekly_period_basis: =weekly_period_basis, allowed_product_codes: =allowed_product_codes, premium_grade_allowed: =premium_grade_allowed, full_serve_allowed: =full_serve_allowed, out_of_network_allowed: =out_of_network_allowed, nonfuel_per_txn_limit_usd: =nonfuel_per_txn_limit_usd, car_wash_allowed: =car_wash_allowed, merchandise_allowed: =merchandise_allowed, maintenance_allowed: =maintenance_allowed, def_allowed: =def_allowed, tank_capacity_tolerance_pct: =tank_capacity_tolerance_pct, velocity_minutes: =velocity_minutes, odometer_validation: =odometer_validation, odometer_max_miles_between_fills: =odometer_max_miles_between_fills, driver_id_validation: =driver_id_validation}
  - id: control_evt_override
    subject: [control_override]
    rule: "A one-time override lets exactly one purchase authorize past a decline whose reason is in overridable_reasons; it is never granted for product_restricted, tank_capacity, invalid_driver_id, card_inactive, program_suspended or credit_limit declines. It is granted only where override_available is true, while control_msr_overrides_30d is below overrides_per_card_30d, for at most override_max_amount_usd, and it expires override_valid_hours hours after the grant. Where override_requires_admin is true only the account administrator may ask for it; otherwise the driver may ask with the card in hand."
    eligibility: []
    params: {overridable_reasons: =overridable_reasons, override_available: =override_available, overrides_per_card_30d: =overrides_per_card_30d, override_max_amount_usd: =override_max_amount_usd, override_valid_hours: =override_valid_hours, override_requires_admin: =override_requires_admin}
    measures: [control_msr_overrides_30d]
  - id: control_retire_rule
    subject: [control_retire]
    rule: "Only the fleet's authorized account administrator retires a profile, and only when no card carries it (retire_requires_no_cards); its cards must first be moved to another active profile of the same program."
    eligibility: []
    params: {retire_requires_no_cards: =retire_requires_no_cards}
