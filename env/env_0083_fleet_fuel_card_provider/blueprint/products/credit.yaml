# Commercial Credit Line charter — Meridian Fleet Payments. The fleet's receivable account: the
# credit limit set by underwriting, the billing cycle and net payment terms, statements, payments,
# returned payments, late fees, temporary and permanent limit changes and security deposits. Every
# Fleet Card Program, card fee, maintenance charge, dispute credit and rebate credit of the customer
# is billed on this line's statements.
category: credit
display_name: Commercial Credit Line

binding:
  holding_table: credit_lines
  event_tables: [credit_statements, credit_ledger, credit_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {current_balance: outstanding_balance, security_deposit_held: security_deposit}

lifecycle:
  states: [applied, active, suspended, closed]
  transitions:
    - {from: applied, to: active, by: system, means: "Underwriting approves the credit application (and, for a deposit-secured tier, the required deposit has been received)."}
    - {from: applied, to: closed, by: system, means: "Underwriting declines the credit application."}
    - {from: active, to: suspended, by: system, means: "The line is suspended for a past-due balance or a returned payment that is not made good; every program billed on it is suspended with it."}
    - {from: suspended, to: active, by: agent, means: "The line is reinstated once the amount its tier requires for reinstatement has been paid with good funds."}
    - {from: active, to: closed, by: user, means: "The fleet's authorized account administrator instructs closure of the credit line; no program may remain open on it."}
    - {from: suspended, to: closed, by: system, means: "A suspended line still past due at the charge-off day is closed and referred to collections."}

accounts:
  - key: outstanding_balance
    unit: USD
    meaning: "The amount the fleet owes on the line: each statement's billed activity, late fees, returned-payment fees, paper statement fees and returned payments book in; payments, deposit applications and credit fee reversals book out. current_balance on the line is its running sum."
  - key: security_deposit
    unit: USD
    meaning: "Cash the fleet has placed with Meridian as security for the line: deposits received book in; refunds and applications of the deposit to the balance book out. security_deposit_held on the line is its running sum."

parameter_schema:
  credit_limit_min_usd: Lowest credit limit underwriting sets on the tier (USD).
  credit_limit_max_usd: Highest credit limit the tier carries, temporary increases excluded (USD).
  security_deposit_pct: Security deposit required, percent of the credit limit (percent; 0.00 = no deposit).
  deposit_min_usd: Minimum security deposit where a deposit is required (USD; 0.00 = no deposit).
  deposit_review_months: Months after approval at which a deposit-secured line is reviewed for release of the deposit (integer months; 0 = no deposit).
  deposit_release_on_time_statements: Consecutive statements paid in full by their due date (grace days included) required for deposit release at the deposit review (integer statements; 0 = no deposit).
  deposit_refund_days: Calendar days after a deposit release or after the final balance is paid on closure within which the deposit remainder is refunded (integer days).
  billing_cycles_offered: Billing cycles a line on the tier may choose (list of weekly | semimonthly | monthly).
  payment_terms_days: Calendar days from the statement date to the due date, by billing cycle (mapping cycle -> integer days; 0 = cycle not offered).
  late_fee_min_usd: Minimum late fee (USD).
  late_fee_pct: Late fee percent of the past-due amount (percent).
  late_fee_threshold_usd: Past-due amount below which no late fee is assessed (USD).
  late_fee_grace_days: Calendar days after the due date through which a payment still counts as on time (integer days).
  courtesy_late_fee_waivers_per_12m: Late fees that may be reversed as a courtesy within any rolling 12 months (integer; 0 = none).
  returned_payment_fee_usd: Fee per returned payment (USD).
  returned_payments_before_certified_funds: Returned payments within rolling 12 months after which payments must be made by wire (integer).
  certified_funds_months: Months a wire-only payment requirement lasts once imposed (integer months).
  paper_statement_fee_usd: Fee per statement mailed on paper (USD; 0.00 = no fee).
  suspend_days_past_due: Calendar days after a due date at which a line with a past-due amount at or above late_fee_threshold_usd is suspended (integer days).
  chargeoff_days_past_due: Calendar days after a missed due date at which a suspended line still past due is closed and referred to collections (integer days).
  reinstatement_requires: What must be paid with good funds to reinstate a suspended line (enum full_balance_paid | past_due_paid).
  temp_increase_max_pct: Largest temporary limit increase, percent of the credit limit (percent; 0.00 = not offered).
  temp_increase_max_days: Longest a temporary limit increase lasts, counted in calendar days from its grant date (integer days; 0 = not offered).
  temp_increases_per_12m: Temporary limit increases that may be granted within any rolling 12 months (integer; 0 = not offered).
  temp_increase_min_months_open: Months since approval before a temporary increase may be granted (integer months).
  cli_min_months_open: Months since approval before a permanent limit increase is reviewed (integer months).
  cli_min_months_since_review: Months since the last credit review before another permanent increase is reviewed (integer months).
  cli_max_step_pct: Largest permanent increase at one review, percent of the current limit (percent).
  credit_review_interval_months: Months between scheduled credit reviews of the line (integer months).
  over_limit_buffer_pct: Percent above the effective limit up to which purchases still authorize (percent; 0.00 = declines at the limit).
  autopay_required: Whether the line must pay by ACH autopay (boolean).
  payment_methods_accepted: Payment methods accepted on the line (list of ach_autopay | ach_portal | check | wire).
  payment_cutoff_time: Local time (Central) by which a payment received on a business day posts that day (HH:MM).
  check_posting_business_days: Business days after receipt at the lockbox within which a check payment posts (integer days).
  minimum_due_basis: 'Amount due on each statement (enum full_new_balance: the line is a charge account paid in full every cycle).'
  payment_allocation: Order in which a payment is applied (enum oldest_statement_first).
  statement_delivery_default: Delivery method set at approval (enum electronic).
  disputed_amounts_excluded_from_past_due: Whether open disputed amounts are left out of the past-due amount (boolean).
  final_balance_due_days: Calendar days after a closure takes effect within which the final balance is due (integer days).
  personal_guarantee_required: Whether a principal's personal guarantee is required (boolean).
  financials_required: Financial documentation underwriting requires (enum none | bank_statements | financial_statements | audited_financials).
  entry_min_years_in_business: Years in business required to open the tier (integer years).
  entry_min_monthly_fuel_spend_usd: Projected monthly fuel spend required to open the tier (USD).
  tier_upgrade_on_time_statements: Consecutive statements paid in full by due date (grace included) after which the line is reviewed for the next tier up (integer; 0 = top tier).
  dedicated_credit_analyst: Whether a named credit analyst handles the line (boolean).
  statement_copy_months_online: Months of statements kept available online (integer months).
  payment_portal_same_day: Whether a portal payment made before the cutoff posts the same business day (boolean).
  closure_requires_zero_programs: Whether every program billed on the line must be closed before the line closes (boolean).
  returned_payment_suspends: Whether a returned payment that leaves a past-due amount at or above late_fee_threshold_usd suspends the line at once (boolean).

