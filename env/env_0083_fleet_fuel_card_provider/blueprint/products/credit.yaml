events:
  - type: credit_open
    target: credit_lines
    mutation: create
    meaning: "A fleet applies for a commercial credit line at a tier."
    grain: "One row per credit application."
    fields:
      credit_line_id: "Reference of the line."
      customer_id: "The fleet applying."
      variant_name: "Tier applied for."
      credit_limit: "Limit requested, within the tier's range."
      billing_cycle: "Cycle chosen from the tier's billing_cycles_offered."
      payment_terms_days: "Terms of the tier for that cycle."
      statement_delivery: "electronic at opening."
      opened_on: "Application date."
    triggers: []
  - type: credit_approve
    target: credit_lines
    mutation: {transition: {from: applied, to: active}}
    meaning: "Underwriting approves the line."
    grain: "One row per approval."
    fields:
      approved_on: "Approval date."
      credit_limit: "Limit set by underwriting."
      last_review_on: "Equals the approval date."
    triggers: []
  - type: credit_decline
    target: credit_lines
    mutation: {transition: {from: applied, to: closed}}
    meaning: "Underwriting declines the application."
    grain: "One row per decline."
    fields:
      closed_on: "Decline date."
      close_reason: "Always application_declined."
    triggers: []
  - type: credit_suspend
    target: credit_lines
    mutation: {transition: {from: active, to: suspended}}
    meaning: "The line is suspended for a past-due balance or a returned payment."
    grain: "One row per suspension."
    fields: {status: "Becomes suspended."}
    triggers: []
  - type: credit_reinstate
    target: credit_lines
    mutation: {transition: {from: suspended, to: active}}
    meaning: "A suspended line is reinstated after payment with good funds."
    grain: "One row per reinstatement."
    fields: {status: "Becomes active."}
    triggers: []
  - type: credit_close
    target: credit_lines
    mutation: {transition: {from: active, to: closed}}
    meaning: "The fleet's administrator instructs closure of the line."
    grain: "One row per closure."
    fields:
      closed_on: "Closure effective date."
      close_reason: "Always customer_instruction."
    triggers: []
  - type: credit_close_suspended
    target: credit_lines
    mutation: {transition: {from: suspended, to: closed}}
    meaning: "A suspended line still past due at the charge-off day is closed and referred to collections."
    grain: "One row per charge-off closure."
    fields:
      closed_on: "Charge-off date."
      close_reason: "Always charged_off."
    triggers: []
  - type: credit_limit_change
    target: credit_lines
    mutation: update
    meaning: "Underwriting sets a new permanent credit limit at a review or on a request."
    grain: "One row per permanent limit change."
    fields:
      credit_limit: "New permanent limit."
      last_review_on: "Date of the review that set it."
    triggers: []
  - type: credit_temp_increase
    target: credit_lines
    mutation: update
    meaning: "A temporary limit increase is granted or ends."
    grain: "One row per grant or end of a temporary increase."
    fields:
      temp_limit_increase: "Amount added to the limit; 0.00 when none is in force."
      temp_limit_expires_on: "Last day the increase is in force; empty when none."
    triggers: []
  - type: credit_terms_change
    target: credit_lines
    mutation: update
    meaning: "The line's billing cycle (and with it the payment terms) changes."
    grain: "One row per cycle change."
    fields:
      billing_cycle: "New cycle."
      payment_terms_days: "Terms of the tier for the new cycle."
    triggers: []
  - type: credit_delivery_change
    target: credit_lines
    mutation: update
    meaning: "Statement delivery or autopay enrollment changes."
    grain: "One row per change."
    fields:
      statement_delivery: "paper or electronic."
      autopay_enrolled: "true while autopay is on."
    triggers: []
  - type: credit_wire_only
    target: credit_lines
    mutation: update
    meaning: "A wire-only payment requirement is imposed after returned payments, or lapses."
    grain: "One row per imposition or lapse."
    fields: {wire_only_until: "Last day payments must be made by wire; empty when no requirement is in force."}
    triggers: []
  - type: credit_tier_change
    target: credit_lines
    mutation: update
    meaning: "The line moves to another tier at a credit review or on deposit release."
    grain: "One row per tier change."
    fields:
      variant_name: "New official tier name."
      last_review_on: "Date of the review that moved it."
    triggers: []
  - type: credit_statement
    target: credit_statements
    meaning: "The statement for one billing cycle, billing every program, card, maintenance, dispute and rebate movement posted in the cycle."
    grain: "One row per credit line per billing cycle."
    distinguish_by: [cycle_start, cycle_end]
    fields:
      statement_id: "Reference of the statement."
      billing_cycle: "Cycle in force for this statement."
      cycle_start: "First posting date covered."
      cycle_end: "Last posting date covered."
      statement_date: "Equals cycle_end."
      due_date: "statement_date plus payment_terms_days."
      previous_balance: "new_balance of the previous statement (0.00 for the first)."
      payments_amount: "Payments posted in the cycle less payments returned in the cycle."
      purchases_amount: "Net purchases posted in the cycle across all programs."
      program_fees_amount: "Program fees less fee reversals and federal excise tax credits posted in the cycle."
      card_fees_amount: "Card fees less card fee reversals posted in the cycle."
      maint_amount: "Net maintenance charges posted in the cycle."
      dispute_credits_amount: "Net dispute credits posted in the cycle (positive reduces the bill)."
      rebate_credits_amount: "Rebate credits applied to this statement (positive reduces the bill)."
      billed_amount: "purchases + program fees + card fees + maintenance - dispute credits - rebate credits; may be negative."
      credit_fees_amount: "Late, returned-payment and paper statement fees less their reversals posted in the cycle."
      new_balance: "previous_balance - payments_amount + billed_amount + credit_fees_amount."
      past_due_amount: "Unpaid past-due amount of the previous statement, shown for information."
      delivery_method: "paper or electronic."
    account: outstanding_balance
    direction: in
    triggers:
      - event: credit:credit_paper_statement_fee
        when: {delivery_method: paper}
        map: {statement_id: statement_id, entry_date: statement_date}
  - type: credit_payment
    target: credit_ledger
    meaning: "A payment posts to the line (autopay, portal ACH, check, wire, or the security deposit applied at closure)."
    grain: "One row per posted payment, identified by its payment reference (a deposit application, which has none, by its date)."
    distinguish_by: [payment_ref, entry_date]
    fields:
      credit_entry_id: "Reference of the posting."
      entry_date: "Posting date."
      amount: "Amount paid (positive)."
      payment_ref: "Confirmation or trace number of the payment; empty on a deposit application."
      payment_method: "How it was paid."
    account: outstanding_balance
    direction: out
    triggers: []
  - type: credit_payment_return
    target: credit_ledger
    meaning: "The fleet's bank returns an ACH or check payment unpaid."
    grain: "One row per returned payment."
    distinguish_by: [original_entry_id]
    fields:
      credit_entry_id: "Reference of the return."
      original_entry_id: "The payment returned."
      entry_date: "Return posting date."
      amount: "Amount of the returned payment (positive)."
      return_code: "ACH return reason code, or check_returned."
    account: outstanding_balance
    direction: in
    triggers:
      - event: credit:credit_returned_payment_fee
        map: {original_entry_id: credit_entry_id, entry_date: entry_date}
  - type: credit_late_fee
    target: credit_ledger
    meaning: "A late fee on a statement whose past-due amount was unpaid after the due date and grace days."
    grain: "One row per statement whose due date was missed."
    distinguish_by: [statement_id]
    fields:
      credit_entry_id: "Reference of the fee."
      statement_id: "The statement whose due date was missed."
      entry_date: "Assessment date: the day after the last grace day."
      basis_amount: "Past-due amount the fee was figured on."
      amount: "Fee assessed."
    account: outstanding_balance
    direction: in
    triggers: []
  - type: credit_returned_payment_fee
    target: credit_ledger
    meaning: "The fee for a returned payment."
    grain: "One row per returned payment."
    distinguish_by: [original_entry_id]
    fields:
      credit_entry_id: "Reference of the fee."
      original_entry_id: "The payment return it is charged for."
      entry_date: "Return posting date."
      amount: "Fee assessed."
    account: outstanding_balance
    direction: in
    triggers: []
  - type: credit_paper_statement_fee
    target: credit_ledger
    meaning: "The fee for a statement mailed on paper."
    grain: "One row per paper statement."
    distinguish_by: [statement_id]
    fields:
      credit_entry_id: "Reference of the fee."
      statement_id: "The paper statement."
      entry_date: "Statement date."
      amount: "Fee assessed; no row is written where the tier's fee is 0.00."
    account: outstanding_balance
    direction: in
    triggers: []
  - type: credit_fee_reversal
    target: credit_ledger
    meaning: "A late, returned-payment or paper statement fee is reversed in full."
    grain: "One row per reversed fee."
    distinguish_by: [original_entry_id]
    fields:
      credit_entry_id: "Reference of the reversal."
      original_entry_id: "The fee reversed."
      entry_date: "Reversal date."
      amount: "Amount reversed (positive)."
      reversal_reason: "assessed_in_error or courtesy_waiver."
    account: outstanding_balance
    direction: out
    triggers: []
  - type: credit_deposit_received
    target: credit_ledger
    meaning: "The fleet funds or tops up its security deposit from its own bank account."
    grain: "One row per deposit received, identified by its payment reference."
    distinguish_by: [payment_ref]
    fields:
      credit_entry_id: "Reference of the deposit posting."
      entry_date: "Date received."
      amount: "Amount received (positive)."
      payment_ref: "Confirmation or trace number."
      payment_method: "ach_portal or wire."
      basis_amount: "Deposit required at the time (the tier's percent of the limit, not below the tier minimum)."
    account: security_deposit
    direction: in
    triggers: []
  - type: credit_deposit_refund
    target: credit_ledger
    meaning: "Deposit is returned to the fleet on release or after closure."
    grain: "One row per refund."
    distinguish_by: [entry_date]
    fields:
      credit_entry_id: "Reference of the refund."
      entry_date: "Refund date."
      amount: "Amount refunded (positive)."
    account: security_deposit
    direction: out
    triggers: []
  - type: credit_deposit_application
    target: credit_ledger
    meaning: "Deposit is applied against the balance on closure or charge-off."
    grain: "One row per application."
    distinguish_by: [entry_date]
    fields:
      credit_entry_id: "Reference of the application."
      entry_date: "Application date."
      amount: "Amount applied (positive)."
    account: security_deposit
    direction: out
    triggers:
      - event: credit:credit_payment
        map: {entry_date: entry_date, amount: amount, payment_method: deposit_application}
  - type: credit_limit_request
    target: credit_requests
    meaning: "The fleet asks for a permanent credit limit increase, which underwriting decides."
    grain: "One row per request."
    distinguish_by: [request_date]
    fields:
      credit_request_id: "Reference of the request."
      request_date: "Date asked."
      requested_limit: "Permanent limit asked for."
      decision: "pending, approved or declined."
      decided_on: "Decision date; empty while pending."
      approved_limit: "Limit approved; 0.00 unless approved."
    triggers: []

measures:
  - id: credit_msr_past_due
    window: "One statement, from the day after its statement_date through its due_date plus late_fee_grace_days (or through the test day for suspension)."
    measure: "The statement's new_balance less credit_payment amounts posted in the window whose payment has no credit_payment_return, less the open disputed amount (see credit_evt_late_fee), never below 0.00."
  - id: credit_msr_courtesy_waivers_12m
    window: "Rolling 12 months ending on the day before the reversal date."
    measure: "Count of credit_fee_reversal rows with reversal_reason courtesy_waiver."
  - id: credit_msr_returned_payments_12m
    window: "Rolling 12 months ending on the return date, inclusive."
    measure: "Count of credit_payment_return rows."
  - id: credit_msr_temp_increases_12m
    window: "Rolling 12 months ending on the day before the grant date."
    measure: "Count of credit_temp_increase grants (rows setting temp_limit_increase above 0.00)."
  - id: credit_msr_on_time_statements
    window: "Statements of the line, newest first, up to the first statement not paid on time."
    measure: "Count of consecutive statements whose credit_msr_past_due at the end of their grace days was 0.00."

policies:
  - id: credit_agg_multi_holding
    subject: [credit_open]
    rule: "A customer holds at most one credit line in status applied, active or suspended; every program, card fee, maintenance charge, dispute credit and rebate credit of the customer bills on that one line. A second application while one is held is not opened; a fleet needing more credit asks for a limit increase on its line."
    eligibility: []
    params: {max_per_customer: 1}
  - id: credit_open_underwriting
    subject: [credit_open, credit_approve, credit_decline]
    rule: "A line is applied for at a tier whose entry gate the fleet meets: entry_min_years_in_business, entry_min_monthly_fuel_spend_usd, a personal guarantee where personal_guarantee_required is true, and the documentation in financials_required. The limit requested lies between credit_limit_min_usd and credit_limit_max_usd and the cycle is one of billing_cycles_offered, with payment_terms_days of that cycle. On a tier whose security_deposit_pct is above 0.00 the required deposit is the greater of deposit_min_usd and security_deposit_pct percent of the credit limit, rounded half up to the cent, and the line is approved only once security_deposit_held is at least that amount; the fleet funds the deposit itself from its own bank account. Underwriting approves (credit_approve) or declines (credit_decline)."
    eligibility: []
    params:
      per_tier:
        Meridian Secured Fleet Line: {security_deposit_pct: =security_deposit_pct, deposit_min_usd: =deposit_min_usd, credit_limit_min_usd: =credit_limit_min_usd, credit_limit_max_usd: =credit_limit_max_usd}
        Meridian Starter Fleet Line: {security_deposit_pct: =security_deposit_pct, deposit_min_usd: =deposit_min_usd, credit_limit_min_usd: =credit_limit_min_usd, credit_limit_max_usd: =credit_limit_max_usd}
        Meridian Standard Fleet Line: {security_deposit_pct: =security_deposit_pct, deposit_min_usd: =deposit_min_usd, credit_limit_min_usd: =credit_limit_min_usd, credit_limit_max_usd: =credit_limit_max_usd}
        Meridian Preferred Fleet Line: {security_deposit_pct: =security_deposit_pct, deposit_min_usd: =deposit_min_usd, credit_limit_min_usd: =credit_limit_min_usd, credit_limit_max_usd: =credit_limit_max_usd}
        Meridian Premier Fleet Line: {security_deposit_pct: =security_deposit_pct, deposit_min_usd: =deposit_min_usd, credit_limit_min_usd: =credit_limit_min_usd, credit_limit_max_usd: =credit_limit_max_usd}
        Meridian Corporate Fleet Line: {security_deposit_pct: =security_deposit_pct, deposit_min_usd: =deposit_min_usd, credit_limit_min_usd: =credit_limit_min_usd, credit_limit_max_usd: =credit_limit_max_usd}
  - id: credit_evt_statement
    subject: [credit_statement]
    rule: "A weekly cycle runs Monday through Sunday, a semimonthly cycle the 1st through the 15th and the 16th through the last day of the month, and a monthly cycle the calendar month. One statement is issued per cycle, dated cycle_end, even when nothing posted. A movement belongs to the cycle containing its posting date: purchases and merchant credits by post_date, program and card fees and credits by their charge or event date, maintenance by its posting date, dispute credits by entry_date; rebate credits belong to the statement their rebate entry names. due_date is statement_date plus payment_terms_days of the cycle in force on the statement date, counted in calendar days with no move for weekends or holidays. The amount due is the full new_balance (minimum_due_basis). credit_fees_amount carries the line's own late, returned-payment and paper statement fees (net of their reversals) posted in the cycle; those fees are booked by their own entries and are not part of billed_amount."
    eligibility: []
    params: {payment_terms_days: =payment_terms_days, minimum_due_basis: =minimum_due_basis}
    formula:
      billed_amount: "purchases_amount + program_fees_amount + card_fees_amount + maint_amount - dispute_credits_amount - rebate_credits_amount"
      new_balance: "previous_balance - payments_amount + billed_amount + credit_fees_amount"
  - id: credit_evt_payment
    subject: [credit_payment, credit_payment_return, credit_wire_only]
    rule: "Payments are made by the fleet's authorized payer from the fleet's own bank account through ACH autopay, the secure payment portal, check to the lockbox or wire; Meridian representatives never take bank account or card numbers by phone. A payment received on a business day before payment_cutoff_time posts that day (a check posts within check_posting_business_days of receipt); later payments post the next business day. Payments apply to the oldest unpaid statement first (payment_allocation). A payment the bank returns is reversed by a credit_payment_return naming it and counts as never received. Once credit_msr_returned_payments_12m reaches returned_payments_before_certified_funds, a wire-only requirement is imposed with wire_only_until set certified_funds_months calendar months after the return date, during which only wire payments are accepted. Where autopay_required is true the line must keep autopay_enrolled true."
    eligibility: []
    params: {payment_cutoff_time: =payment_cutoff_time, check_posting_business_days: =check_posting_business_days, payment_allocation: =payment_allocation, returned_payments_before_certified_funds: =returned_payments_before_certified_funds, certified_funds_months: =certified_funds_months, payment_methods_accepted: =payment_methods_accepted, autopay_required: =autopay_required, payment_portal_same_day: =payment_portal_same_day}
    measures: [credit_msr_returned_payments_12m]
  - id: credit_evt_late_fee
    subject: [credit_late_fee]
    rule: "A statement is paid on time when credit_msr_past_due for it, counted through its due_date plus late_fee_grace_days, is 0.00. The open disputed amount left out of the past-due amount is the sum of disputed_amount of every dispute case that is in status opened, pending_affidavit, under_review or chargeback_filed on the last grace day, whose disputed purchase posted on or before this statement's statement_date, and which has no dispute_provisional_credit entry dated on or before that statement_date. When the past-due amount is at or above late_fee_threshold_usd, one late fee is assessed on the day after the last grace day: the greater of late_fee_min_usd and late_fee_pct percent of the past-due amount rounded half up to the cent, at the tier in effect on the assessment date; basis_amount records the past-due amount. A past-due amount below the threshold carries no late fee and no row. One late fee at most per statement."
    eligibility: []
    params:
      per_tier:
        Meridian Secured Fleet Line: {late_fee_min_usd: =late_fee_min_usd, late_fee_pct: =late_fee_pct, late_fee_threshold_usd: =late_fee_threshold_usd, late_fee_grace_days: =late_fee_grace_days}
        Meridian Starter Fleet Line: {late_fee_min_usd: =late_fee_min_usd, late_fee_pct: =late_fee_pct, late_fee_threshold_usd: =late_fee_threshold_usd, late_fee_grace_days: =late_fee_grace_days}
        Meridian Standard Fleet Line: {late_fee_min_usd: =late_fee_min_usd, late_fee_pct: =late_fee_pct, late_fee_threshold_usd: =late_fee_threshold_usd, late_fee_grace_days: =late_fee_grace_days}
        Meridian Preferred Fleet Line: {late_fee_min_usd: =late_fee_min_usd, late_fee_pct: =late_fee_pct, late_fee_threshold_usd: =late_fee_threshold_usd, late_fee_grace_days: =late_fee_grace_days}
        Meridian Premier Fleet Line: {late_fee_min_usd: =late_fee_min_usd, late_fee_pct: =late_fee_pct, late_fee_threshold_usd: =late_fee_threshold_usd, late_fee_grace_days: =late_fee_grace_days}
        Meridian Corporate Fleet Line: {late_fee_min_usd: =late_fee_min_usd, late_fee_pct: =late_fee_pct, late_fee_threshold_usd: =late_fee_threshold_usd, late_fee_grace_days: =late_fee_grace_days}
    formula:
      when_not: "basis_amount < late_fee_threshold_usd"
      amount: "max(late_fee_min_usd, round(basis_amount * late_fee_pct / 100, 2))"
    measures: [credit_msr_past_due]
  - id: credit_evt_returned_payment_fee
    subject: [credit_returned_payment_fee]
    rule: "Every returned payment carries one returned-payment fee at the returned_payment_fee_usd of the tier in effect on the return date, whatever the return code. A deposit application never returns and never carries the fee."
    eligibility: []
    params: {returned_payment_fee_usd: =returned_payment_fee_usd}
  - id: credit_evt_paper_statement_fee
    subject: [credit_paper_statement_fee, credit_delivery_change]
    rule: "A statement whose delivery_method is paper carries one paper statement fee at paper_statement_fee_usd of the tier in effect on the statement date; no row is written where that fee is 0.00. Electronic statements carry none. A change of delivery applies from the next statement issued after the change."
    eligibility: []
    params: {paper_statement_fee_usd: =paper_statement_fee_usd, statement_delivery_default: =statement_delivery_default}
  - id: credit_evt_fee_reversal
    subject: [credit_fee_reversal]
    rule: "A late, returned-payment or paper statement fee is reversed in full, naming it, in two cases only. Reason assessed_in_error: the fee was not owed under this charter (the past-due amount was below the threshold once figured correctly, a payment had posted in time, the return was the bank's error, the statement was electronic). Reason courtesy_waiver: a late fee on a tier whose courtesy_late_fee_waivers_per_12m is above 0, when credit_msr_courtesy_waivers_12m is below that number and the line has no credit_payment_return in the 12 months before the reversal date. Returned-payment and paper statement fees are never waived as a courtesy. A fee is reversed at most once."
    eligibility:
      - id: fee_not_already_reversed
        applies_to: [credit_fee_reversal]
        kind: dedup
        condition: "A fee is reversed at most once."
        evidence_fields: [credit_ledger.original_entry_id, credit_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_ledger.original_entry_id]]
          action_bindings: {credit_ledger.original_entry_id: original_entry_id}
        dedup_contract:
          table: credit_ledger
          mode: separate_record
          object_bindings: {original_entry_id: original_entry_id}
          duplicate_filters: {event_type: [credit_fee_reversal]}
          distinct_fields: []
    params:
      per_tier:
        Meridian Secured Fleet Line: {courtesy_late_fee_waivers_per_12m: =courtesy_late_fee_waivers_per_12m}
        Meridian Starter Fleet Line: {courtesy_late_fee_waivers_per_12m: =courtesy_late_fee_waivers_per_12m}
        Meridian Standard Fleet Line: {courtesy_late_fee_waivers_per_12m: =courtesy_late_fee_waivers_per_12m}
        Meridian Preferred Fleet Line: {courtesy_late_fee_waivers_per_12m: =courtesy_late_fee_waivers_per_12m}
        Meridian Premier Fleet Line: {courtesy_late_fee_waivers_per_12m: =courtesy_late_fee_waivers_per_12m}
        Meridian Corporate Fleet Line: {courtesy_late_fee_waivers_per_12m: =courtesy_late_fee_waivers_per_12m}
    measures: [credit_msr_courtesy_waivers_12m]
  - id: credit_temp_increase_rule
    subject: [credit_temp_increase]
    rule: "A temporary limit increase is granted only on a line in status active. The line has no statement with a past-due amount at or above late_fee_threshold_usd, at least temp_increase_min_months_open months have passed since approved_on, and credit_msr_temp_increases_12m is below temp_increases_per_12m. The increase is at most temp_increase_max_pct percent of credit_limit, rounded down to the dollar, and temp_limit_expires_on is at most temp_increase_max_days calendar days after the grant date (the grant date counts as day 0). A tier whose temp_increase_max_pct is 0.00 offers none. The effective limit is credit_limit plus temp_limit_increase through temp_limit_expires_on and credit_limit alone afterwards; on the day after expiry the system writes temp_limit_increase 0.00 and clears the date. Purchases authorize up to the effective limit plus over_limit_buffer_pct percent of it, less current_balance and unposted authorizations."
    eligibility:
      - id: line_active
        applies_to: [credit_temp_increase]
        kind: state
        condition: "A temporary limit increase is granted only on a line in status active."
        evidence_fields: [credit_lines.status, credit_lines.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_lines.credit_line_id]]
          action_bindings: {credit_lines.credit_line_id: credit_line_id}
        state_contract:
          field: credit_lines.status
          allowed: [active]
    params:
      per_tier:
        Meridian Secured Fleet Line: {temp_increase_max_pct: =temp_increase_max_pct, temp_increase_max_days: =temp_increase_max_days, temp_increases_per_12m: =temp_increases_per_12m, temp_increase_min_months_open: =temp_increase_min_months_open}
        Meridian Starter Fleet Line: {temp_increase_max_pct: =temp_increase_max_pct, temp_increase_max_days: =temp_increase_max_days, temp_increases_per_12m: =temp_increases_per_12m, temp_increase_min_months_open: =temp_increase_min_months_open}
        Meridian Standard Fleet Line: {temp_increase_max_pct: =temp_increase_max_pct, temp_increase_max_days: =temp_increase_max_days, temp_increases_per_12m: =temp_increases_per_12m, temp_increase_min_months_open: =temp_increase_min_months_open}
        Meridian Preferred Fleet Line: {temp_increase_max_pct: =temp_increase_max_pct, temp_increase_max_days: =temp_increase_max_days, temp_increases_per_12m: =temp_increases_per_12m, temp_increase_min_months_open: =temp_increase_min_months_open}
        Meridian Premier Fleet Line: {temp_increase_max_pct: =temp_increase_max_pct, temp_increase_max_days: =temp_increase_max_days, temp_increases_per_12m: =temp_increases_per_12m, temp_increase_min_months_open: =temp_increase_min_months_open}
        Meridian Corporate Fleet Line: {temp_increase_max_pct: =temp_increase_max_pct, temp_increase_max_days: =temp_increase_max_days, temp_increases_per_12m: =temp_increases_per_12m, temp_increase_min_months_open: =temp_increase_min_months_open}
    measures: [credit_msr_temp_increases_12m]
  - id: credit_limit_review
    subject: [credit_limit_request, credit_limit_change, credit_tier_change]
    rule: "A permanent limit increase request is logged as pending and decided by underwriting, never by the representative. It is reviewed only when at least cli_min_months_open months have passed since approved_on and at least cli_min_months_since_review months since last_review_on; otherwise it is declined on the decision date. An approved increase is at most cli_max_step_pct percent of the current credit_limit and never above credit_limit_max_usd of the tier. Scheduled credit reviews run every credit_review_interval_months. At a review, a line whose credit_msr_on_time_statements has reached tier_upgrade_on_time_statements and which meets the next tier's entry gate moves up one tier (credit_tier_change); a line with a statement unpaid past its suspension day in the last 12 months moves down one tier, and its credit_limit is reduced to the lower tier's credit_limit_max_usd when above it."
    eligibility: []
    params: {cli_min_months_open: =cli_min_months_open, cli_min_months_since_review: =cli_min_months_since_review, cli_max_step_pct: =cli_max_step_pct, credit_review_interval_months: =credit_review_interval_months, tier_upgrade_on_time_statements: =tier_upgrade_on_time_statements, financials_required: =financials_required, personal_guarantee_required: =personal_guarantee_required, dedicated_credit_analyst: =dedicated_credit_analyst}
    measures: [credit_msr_on_time_statements]
  - id: credit_lifecycle
    subject: [credit_suspend, credit_reinstate, credit_close, credit_close_suspended, credit_terms_change]
    rule: "A line is suspended on the day that is suspend_days_past_due calendar days after a statement's due date when credit_msr_past_due for that statement, counted through that day, is at or above late_fee_threshold_usd, or at once on a returned payment that leaves such a past-due amount where returned_payment_suspends is true; every program billed on the line is suspended with it. A suspended line is reinstated once the amount reinstatement_requires names has posted with good funds (full_balance_paid: current_balance 0.00 or below; past_due_paid: no statement with a past-due amount at or above the threshold). A line still suspended chargeoff_days_past_due calendar days after the missed due date is closed as charged off. A closure on instruction requires that no program billed on the line is open (closure_requires_zero_programs); the final balance is due final_balance_due_days after the closure. A billing cycle change takes effect at the start of the first full new cycle after the request, and payment_terms_days moves with it."
    eligibility: []
    params: {suspend_days_past_due: =suspend_days_past_due, chargeoff_days_past_due: =chargeoff_days_past_due, reinstatement_requires: =reinstatement_requires, returned_payment_suspends: =returned_payment_suspends, final_balance_due_days: =final_balance_due_days, closure_requires_zero_programs: =closure_requires_zero_programs, billing_cycles_offered: =billing_cycles_offered, statement_copy_months_online: =statement_copy_months_online, disputed_amounts_excluded_from_past_due: =disputed_amounts_excluded_from_past_due}
    measures: [credit_msr_past_due]
  - id: credit_deposit_rule
    subject: [credit_deposit_received, credit_deposit_refund, credit_deposit_application]
    rule: "A security deposit is funded by the fleet's authorized payer from the fleet's own bank account by portal ACH or wire; basis_amount records the deposit required at that time. At the deposit review, deposit_review_months after approved_on, a line whose credit_msr_on_time_statements has reached deposit_release_on_time_statements and which meets the entry gate of Meridian Standard Fleet Line moves to that tier and its whole deposit is refunded within deposit_refund_days; otherwise the deposit is kept and reviewed again deposit_review_months later. On closure or charge-off the deposit is first applied against current_balance (up to the lesser of the deposit held and the balance) and any remainder is refunded within deposit_refund_days after the final balance is paid. A deposit never earns interest."
    eligibility: []
    params: {deposit_review_months: =deposit_review_months, deposit_release_on_time_statements: =deposit_release_on_time_statements, deposit_refund_days: =deposit_refund_days, entry_min_years_in_business: =entry_min_years_in_business, entry_min_monthly_fuel_spend_usd: =entry_min_monthly_fuel_spend_usd, over_limit_buffer_pct: =over_limit_buffer_pct}
    measures: [credit_msr_on_time_statements]
