# Transaction Disputes charter — Meridian Fleet Payments. A dispute case is opened on one posted
# purchase of a fleet's card program; the case type (merchant error, duplicate posting, credit not
# processed, counterfeit fraud, lost or stolen card fraud, employee misuse review) fixes the filing
# window, the evidence, provisional credit, chargeback rights and who bears the loss. Dispute credits
# bill on the fleet's credit line statement.
category: dispute
display_name: Transaction Disputes

binding:
  holding_table: dispute_cases
  event_tables: [dispute_entries]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [opened, pending_affidavit, under_review, chargeback_filed, resolved_fleet_favor, resolved_merchant_favor, withdrawn]
  transitions:
    - {from: opened, to: pending_affidavit, by: agent, means: "A case type that needs a signed affidavit waits for it after the request is sent to the account administrator."}
    - {from: pending_affidavit, to: under_review, by: user, means: "The fleet's authorized account administrator signs and submits the dispute affidavit through the secure portal."}
    - {from: opened, to: under_review, by: agent, means: "A case type that needs no affidavit goes straight to review once its evidence is recorded."}
    - {from: under_review, to: chargeback_filed, by: system, means: "A purchase that cleared through the Mastercard network is charged back to the merchant's acquirer."}
    - {from: under_review, to: resolved_fleet_favor, by: system, means: "The review finds the fleet is not liable for the disputed amount."}
    - {from: under_review, to: resolved_merchant_favor, by: system, means: "The review finds the charge valid or the fleet liable."}
    - {from: chargeback_filed, to: resolved_fleet_favor, by: system, means: "The chargeback stands (no representment, or the representment fails)."}
    - {from: chargeback_filed, to: resolved_merchant_favor, by: system, means: "The merchant's representment succeeds."}
    - {from: opened, to: withdrawn, by: user, means: "The fleet's authorized administrator withdraws the case before review."}
    - {from: pending_affidavit, to: withdrawn, by: system, means: "The affidavit was not received by its due date and the case lapses."}

accounts:
  - key: dispute_credit
    unit: USD
    meaning: "Credits Meridian grants the fleet on disputed purchases: provisional and final credits book in; reversals of provisional credit book out."

parameter_schema:
  filing_window_days: Calendar days after the statement date of the statement that billed the purchase within which the case must be opened (integer days).
  min_dispute_amount_usd: Smallest disputed amount accepted as a case (USD; 0.01 = any amount).
  partial_dispute_allowed: Whether only part of the purchase may be disputed (boolean).
  disputed_amount_basis: How disputed_amount is figured (enum excess_quantity_or_price | full_net_amount | promised_credit).
  related_fees_credited: Whether a credit on the case also credits the purchase's out-of-network, manual-entry and cross-border fees when the full purchase is credited (boolean).
  provisional_credit_eligible: Whether a provisional credit is given while the case is reviewed (boolean).
  provisional_credit_business_days: Business days after the case reaches under_review within which the provisional credit posts (integer; 0 = none).
  provisional_credit_min_amount_usd: Disputed amount at or above which a provisional credit is given (USD).
  provisional_credit_pct: Percent of the credited amount given provisionally (percent; 0.00 = none).
  provisional_reversal_notice_days: Calendar days after a merchant-favor resolution on which a provisional credit is reversed (integer days).
  affidavit_required: Whether the account administrator's signed affidavit is required (boolean).
  affidavit_due_days: Calendar days after affidavit_requested_on within which the signed affidavit must be received (integer; 0 = none required).
  police_report_required: Whether a police report number must accompany the affidavit (boolean).
  card_block_required: Whether the card must already be closed (or a compromised replacement ordered) before the case is opened (boolean).
  card_in_possession_required: Whether the fleet attests the genuine card was in its possession when the purchase was made (boolean).
  coverage_hours_before_report: Hours before the recorded lost or stolen report moment within which unauthorized purchases are not charged to the fleet (integer hours; 0 = none).
  fleet_liability_default: Who bears a purchase the review cannot attribute to merchant error or fraud (enum fleet | issuer).
  misuse_after_cancellation_covered: Whether purchases authorized after the recorded cancellation moment of the card are not charged to the fleet (boolean).
  chargeback_eligible: Whether a purchase that cleared through Mastercard (out_of_network site) may be charged back (boolean).
  chargeback_time_limit_days: Calendar days after the purchase's post_date within which Meridian can still file a Mastercard chargeback (integer; 0 = not eligible).
  chargeback_reason_category: Mastercard dispute category used (enum point_of_interaction_error | cardholder_dispute | fraud | not_applicable).
  representment_days: Calendar days the acquirer has to represent after a chargeback (integer days).
  network_merchant_response_days: Calendar days a Meridian network or partner merchant has to answer a dispute (integer days).
  investigation_target_days: Calendar days from under_review within which the case is normally resolved (integer days).
  max_resolution_days: Calendar days from opened_on by which every case is resolved (integer days).
  tank_overfill_tolerance_pct: Percent above the card's recorded tank capacity beyond which posted gallons are treated as a merchant quantity error (percent; 0.00 = not used).
  duplicate_match_window_hours: Hours within which an earlier purchase on the same card, site and amount makes a post a duplicate (integer; 0 = not used).
  merchant_credit_wait_days: Calendar days after the merchant's credit promise date before a credit-not-processed case may be opened (integer; 0 = not used).
  merchant_contact_required_first: Whether the fleet must first have asked the merchant to correct the charge (boolean).
  documentation_required: Evidence the case needs (enum receipt_or_pump_reading | statement_lines | credit_promise | affidavit | affidavit_and_police_report | affidavit_and_cancellation_record).
  pump_inspection_request: Whether the site's weights-and-measures pump inspection record is requested (boolean).
  odometer_evidence_used: Whether the odometer entries on the card's purchases are weighed in the review (boolean).
  card_reissue_on_claim: Card action that accompanies the case (enum none | compromised_replacement | lost_stolen_replacement).
  fraud_claims_before_program_hold: Fraud claims on one program within 30 days after which a fraud hold is placed on the program (integer; 0 = not used).
  claims_per_card_12m_before_review: Cases on one card within rolling 12 months after which the next case goes to senior review (integer).
  credited_gallons_excluded_from_rebate: Whether gallons on a purchase credited in full by the case stop counting toward volume rebates (boolean).
  withdrawal_allowed: Whether the fleet may withdraw before review (boolean).
  refile_allowed: Whether a resolved or withdrawn case may be refiled on the same purchase (boolean).
  status_update_days: Calendar days between status notices to the fleet while a case is open (integer days).
  max_open_cases_per_purchase: Open cases allowed on one purchase (integer).
  affidavit_signer: Who signs the affidavit (enum account_administrator | not_applicable).
  liability_review_basis: Moment the liability review keys on (enum posting_record | genuine_card_possession | report_moment | cancellation_moment).
  merchant_credit_supersedes: Whether a merchant credit posted on the purchase during the case replaces the issuer's credit (boolean).
  late_fee_exclusion_while_open: Whether the open disputed amount is left out of the credit line's past-due amount (boolean).
  written_resolution_notice: Whether the resolution is sent in writing with the reason (boolean).
  network_scope: Purchases the case type covers (enum all_networks).
  fet_credit_netted: Whether the credited amount is reduced by the share of any federal excise tax credit the purchase earned on the credited gallons (boolean).
  senior_review_amount_usd: Disputed amount at or above which the case goes to senior review (USD).

