events:
  - type: dispute_open
    target: dispute_cases
    mutation: create
    meaning: "A dispute case is opened on one posted purchase."
    grain: "One row per case."
    fields:
      dispute_case_id: "Reference of the case."
      customer_id: "The fleet."
      program_id: "Program the purchase posted to."
      program_txn_id: "The disputed purchase."
      fleet_card_id: "Card used for the purchase."
      statement_id: "Statement that billed the purchase."
      variant_name: "Case type."
      opened_on: "Date the case was opened."
      claimed_gallons: "Gallons the fleet says were dispensed (quantity cases); 0.000 otherwise."
      claimed_unit_price: "Price per gallon the fleet says applied (price cases); 0.000 otherwise."
      promised_credit_amount: "Credit the merchant promised (credit-not-processed cases); 0.00 otherwise."
      disputed_amount: "Amount in dispute, figured by the case type's disputed_amount_basis."
    triggers: []
  - type: dispute_request_affidavit
    target: dispute_cases
    mutation: {transition: {from: opened, to: pending_affidavit}}
    meaning: "The affidavit is requested from the account administrator."
    grain: "One row per request."
    fields: {affidavit_requested_on: "Date the request was sent."}
    triggers: []
  - type: dispute_affidavit_submit
    target: dispute_cases
    mutation: {transition: {from: pending_affidavit, to: under_review}}
    meaning: "The account administrator signs and submits the affidavit."
    grain: "One row per affidavit."
    fields:
      affidavit_received_on: "Date the signed affidavit was received."
      police_report_number: "Police report number given with the affidavit, exactly as the fleet states it; empty when none."
    triggers: []
  - type: dispute_begin_review
    target: dispute_cases
    mutation: {transition: {from: opened, to: under_review}}
    meaning: "A case needing no affidavit goes to review."
    grain: "One row per case moved to review."
    fields: {review_started_on: "Date review began."}
    triggers: []
  - type: dispute_chargeback
    target: dispute_cases
    mutation: {transition: {from: under_review, to: chargeback_filed}}
    meaning: "A Mastercard chargeback is filed."
    grain: "One row per chargeback."
    fields: {chargeback_filed_on: "Filing date."}
    triggers: []
  - type: dispute_resolve_fleet
    target: dispute_cases
    mutation: {transition: {from: under_review, to: resolved_fleet_favor}}
    meaning: "Review resolves the case in the fleet's favor."
    grain: "One row per resolution."
    fields:
      resolved_on: "Resolution date."
      liability: "merchant or issuer."
    triggers: []
  - type: dispute_resolve_merchant
    target: dispute_cases
    mutation: {transition: {from: under_review, to: resolved_merchant_favor}}
    meaning: "Review resolves the case against the fleet."
    grain: "One row per resolution."
    fields:
      resolved_on: "Resolution date."
      liability: "Always fleet."
    triggers: []
  - type: dispute_chargeback_won
    target: dispute_cases
    mutation: {transition: {from: chargeback_filed, to: resolved_fleet_favor}}
    meaning: "The chargeback stands."
    grain: "One row per resolution."
    fields:
      resolved_on: "Resolution date."
      liability: "Always merchant."
    triggers: []
  - type: dispute_chargeback_lost
    target: dispute_cases
    mutation: {transition: {from: chargeback_filed, to: resolved_merchant_favor}}
    meaning: "The merchant's representment succeeds."
    grain: "One row per resolution."
    fields:
      resolved_on: "Resolution date."
      liability: "Always fleet."
    triggers: []
  - type: dispute_withdraw
    target: dispute_cases
    mutation: {transition: {from: opened, to: withdrawn}}
    meaning: "The fleet's administrator withdraws the case."
    grain: "One row per withdrawal."
    fields: {resolved_on: "Withdrawal date."}
    triggers: []
  - type: dispute_affidavit_lapse
    target: dispute_cases
    mutation: {transition: {from: pending_affidavit, to: withdrawn}}
    meaning: "The case lapses because the affidavit was not received in time."
    grain: "One row per lapsed case."
    fields: {resolved_on: "Day after the affidavit due date."}
    triggers: []
  - type: dispute_provisional_credit
    target: dispute_entries
    meaning: "A provisional credit posts while the case is reviewed."
    grain: "One row per case given provisional credit."
    distinguish_by: [entry_date]
    fields:
      dispute_entry_id: "Reference of the credit."
      dispute_case_id: "The case."
      entry_date: "Posting date."
      amount: "Credit (positive)."
      fees_included_amount: "Part of amount that credits the purchase's per-transaction fees; 0.00 when none."
    account: dispute_credit
    direction: in
    triggers: []
  - type: dispute_final_credit
    target: dispute_entries
    meaning: "A final credit posts on a case resolved in the fleet's favor that had no provisional credit."
    grain: "One row per case credited at resolution."
    distinguish_by: [entry_date]
    fields:
      dispute_entry_id: "Reference of the credit."
      dispute_case_id: "The case."
      entry_date: "Resolution date."
      amount: "Credit (positive)."
      fees_included_amount: "Part of amount that credits the purchase's per-transaction fees; 0.00 when none."
    account: dispute_credit
    direction: in
    triggers: []
  - type: dispute_provisional_reversal
    target: dispute_entries
    meaning: "A provisional credit is reversed because the case was resolved against the fleet or the merchant posted its own credit."
    grain: "One row per reversed provisional credit."
    distinguish_by: [original_entry_id]
    fields:
      dispute_entry_id: "Reference of the reversal."
      dispute_case_id: "The case."
      original_entry_id: "The provisional credit reversed."
      entry_date: "Reversal date."
      amount: "Amount reversed (positive)."
      reversal_reason: "merchant_favor, merchant_credit_posted or case_withdrawn."
    account: dispute_credit
    direction: out
    triggers: []

measures:
  - id: dispute_msr_cases_on_card_12m
    window: "Rolling 12 months ending on the day before opened_on."
    measure: "Count of dispute_cases on the same fleet_card_id."
  - id: dispute_msr_fraud_claims_program_30d
    window: "Rolling 30 days ending on opened_on, inclusive."
    measure: "Count of dispute_cases of type Counterfeit Card Fraud Claim or Lost or Stolen Card Fraud Claim on the same program, withdrawn cases excluded."
  - id: dispute_msr_open_cases_on_purchase
    window: "Current state."
    measure: "Count of dispute_cases on the same program_txn_id in status opened, pending_affidavit, under_review or chargeback_filed."

policies:
  - id: dispute_agg_multi_holding
    subject: [dispute_open]
    rule: "A customer may have any number of dispute cases (max_per_customer null), but each case concerns exactly one posted purchase and a purchase may carry at most max_open_cases_per_purchase open case; several purchases are disputed as several cases. A purchase whose case was resolved or withdrawn is never disputed again (refile_allowed)."
    eligibility: []
    params: {max_per_customer: null, max_open_cases_per_purchase: =max_open_cases_per_purchase, refile_allowed: =refile_allowed}
    measures: [dispute_msr_open_cases_on_purchase]
  - id: dispute_agg_program_fraud
    subject: [dispute_open, dispute_resolve_fleet]
    rule: "Cases are also read across a program and a card: when dispute_msr_fraud_claims_program_30d reaches fraud_claims_before_program_hold, the program is put on a fraud hold under the Fleet Card Program charter's suspension rule; when dispute_msr_cases_on_card_12m has reached claims_per_card_12m_before_review, or the disputed_amount is at or above senior_review_amount_usd, the case is decided by senior review rather than by the standard review. A fraud claim also carries the card action card_reissue_on_claim, booked under the Fleet Cards charter."
    eligibility: []
    params: {fraud_claims_before_program_hold: =fraud_claims_before_program_hold, claims_per_card_12m_before_review: =claims_per_card_12m_before_review, senior_review_amount_usd: =senior_review_amount_usd, card_reissue_on_claim: =card_reissue_on_claim}
    measures: [dispute_msr_fraud_claims_program_30d, dispute_msr_cases_on_card_12m]
  - id: dispute_open_rule
    subject: [dispute_open]
    rule: "A case names the purchase, the card it was made on and the statement that billed it. The case is opened no later than filing_window_days calendar days after the statement date of the statement that billed the purchase. The window is counted in calendar days starting the day after the statement date, and a case opened on the last day of the window is in time. A purchase already carrying a dispute case is not disputed again. The disputed_amount is figured by disputed_amount_basis: excess_quantity_or_price is, when the fleet states claimed_gallons, net_amount times (gallons less claimed_gallons) divided by gallons, and otherwise (unit_price less claimed_unit_price) times gallons, rounded half up to the cent; full_net_amount is the purchase's net_amount less merchant credits already posted against it; promised_credit is promised_credit_amount, never above net_amount. A case is not opened when the disputed_amount is below min_dispute_amount_usd, when partial_dispute_allowed is false and less than the whole purchase is disputed, when merchant_contact_required_first is true and the fleet has not first asked the merchant, before merchant_credit_wait_days calendar days have passed since the merchant's credit promise, or, where card_block_required is true, before the card is closed or a compromised replacement has been ordered for it."
    eligibility:
      - id: within_filing_window
        applies_to: [dispute_open]
        kind: time
        condition: "The case is opened no later than filing_window_days calendar days after the statement date of the statement that billed the purchase."
        evidence_fields: [credit_statements.statement_date, credit_statements.statement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_statements.statement_id]]
          action_bindings: {credit_statements.statement_id: statement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the statement date of the statement that billed the purchase"
          anchor_source: credit_statements.statement_date
          relation: not_after
          duration_source: variants.filing_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the statement date, and a case opened on the last day of the window is in time."
          boundary: inclusive
      - id: one_case_per_purchase
        applies_to: [dispute_open]
        kind: dedup
        condition: "A purchase already carrying a dispute case is not disputed again."
        evidence_fields: [dispute_cases.program_txn_id, dispute_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dispute_cases.program_txn_id]]
          action_bindings: {dispute_cases.program_txn_id: program_txn_id}
        dedup_contract:
          table: dispute_cases
          mode: separate_record
          object_bindings: {program_txn_id: program_txn_id}
          duplicate_filters: {status: [opened, pending_affidavit, under_review, chargeback_filed, resolved_fleet_favor, resolved_merchant_favor, withdrawn]}
          distinct_fields: []
    params:
      per_tier:
        Merchant Error Dispute (Quantity or Price): {filing_window_days: =filing_window_days, min_dispute_amount_usd: =min_dispute_amount_usd, disputed_amount_basis: =disputed_amount_basis}
        Duplicate Posting Dispute: {filing_window_days: =filing_window_days, min_dispute_amount_usd: =min_dispute_amount_usd, disputed_amount_basis: =disputed_amount_basis}
        Credit Not Processed Dispute: {filing_window_days: =filing_window_days, min_dispute_amount_usd: =min_dispute_amount_usd, disputed_amount_basis: =disputed_amount_basis}
        Counterfeit Card Fraud Claim: {filing_window_days: =filing_window_days, min_dispute_amount_usd: =min_dispute_amount_usd, disputed_amount_basis: =disputed_amount_basis}
        Lost or Stolen Card Fraud Claim: {filing_window_days: =filing_window_days, min_dispute_amount_usd: =min_dispute_amount_usd, disputed_amount_basis: =disputed_amount_basis}
        Employee Misuse Review: {filing_window_days: =filing_window_days, min_dispute_amount_usd: =min_dispute_amount_usd, disputed_amount_basis: =disputed_amount_basis}
  - id: dispute_affidavit_rule
    subject: [dispute_request_affidavit, dispute_affidavit_submit, dispute_affidavit_lapse, dispute_begin_review]
    rule: "A case type whose affidavit_required is true moves to pending_affidavit when the affidavit request is sent to the account administrator; only the fleet's authorized account administrator (affidavit_signer) can sign and submit it, through the secure portal, because it attests facts under the fleet's own signature (for a counterfeit claim, that the genuine card was in the fleet's possession; for a lost or stolen claim, with the police report number where police_report_required is true; for an employee misuse review, the cancellation record of the driver's card). An affidavit not received within affidavit_due_days calendar days after affidavit_requested_on lets the case lapse to withdrawn on the following day. A case type needing no affidavit moves to under_review once its documentation_required evidence is recorded."
    eligibility: []
    params: {affidavit_required: =affidavit_required, affidavit_due_days: =affidavit_due_days, affidavit_signer: =affidavit_signer, police_report_required: =police_report_required, documentation_required: =documentation_required, card_in_possession_required: =card_in_possession_required}
  - id: dispute_evt_provisional_credit
    subject: [dispute_provisional_credit]
    rule: "A provisional credit posts within provisional_credit_business_days business days after the case reaches under_review when the case type's provisional_credit_eligible is true and the disputed_amount is at or above provisional_credit_min_amount_usd. The credited amount of a case is its disputed_amount, plus, where related_fees_credited is true and the whole purchase is disputed, the purchase's out-of-network, manual-entry and cross-border fees net of any reversal of them (fees_included_amount records this part), less, where fet_credit_netted is true, the federal excise tax credit the purchase earned times the credited share of its gallons. The provisional credit is provisional_credit_pct percent of the credited amount, rounded half up to the cent. One provisional credit at most per case."
    eligibility: []
    params:
      per_tier:
        Merchant Error Dispute (Quantity or Price): {provisional_credit_eligible: =provisional_credit_eligible, provisional_credit_min_amount_usd: =provisional_credit_min_amount_usd, provisional_credit_pct: =provisional_credit_pct, related_fees_credited: =related_fees_credited, fet_credit_netted: =fet_credit_netted}
        Duplicate Posting Dispute: {provisional_credit_eligible: =provisional_credit_eligible, provisional_credit_min_amount_usd: =provisional_credit_min_amount_usd, provisional_credit_pct: =provisional_credit_pct, related_fees_credited: =related_fees_credited, fet_credit_netted: =fet_credit_netted}
        Credit Not Processed Dispute: {provisional_credit_eligible: =provisional_credit_eligible, provisional_credit_min_amount_usd: =provisional_credit_min_amount_usd, provisional_credit_pct: =provisional_credit_pct, related_fees_credited: =related_fees_credited, fet_credit_netted: =fet_credit_netted}
        Counterfeit Card Fraud Claim: {provisional_credit_eligible: =provisional_credit_eligible, provisional_credit_min_amount_usd: =provisional_credit_min_amount_usd, provisional_credit_pct: =provisional_credit_pct, related_fees_credited: =related_fees_credited, fet_credit_netted: =fet_credit_netted}
        Lost or Stolen Card Fraud Claim: {provisional_credit_eligible: =provisional_credit_eligible, provisional_credit_min_amount_usd: =provisional_credit_min_amount_usd, provisional_credit_pct: =provisional_credit_pct, related_fees_credited: =related_fees_credited, fet_credit_netted: =fet_credit_netted}
        Employee Misuse Review: {provisional_credit_eligible: =provisional_credit_eligible, provisional_credit_min_amount_usd: =provisional_credit_min_amount_usd, provisional_credit_pct: =provisional_credit_pct, related_fees_credited: =related_fees_credited, fet_credit_netted: =fet_credit_netted}
  - id: dispute_liability
    subject: [dispute_resolve_fleet, dispute_resolve_merchant]
    rule: "The review decides liability by liability_review_basis. posting_record: a quantity or price case is in the fleet's favor when the receipt or pump reading supports it or the posted gallons exceed the card's tank_capacity_gal by more than tank_overfill_tolerance_pct percent; a duplicate posting is in the fleet's favor when an earlier purchase on the same card, site_number and net_amount posted within duplicate_match_window_hours hours before it and was not itself credited; a credit-not-processed case is in the fleet's favor when the merchant cannot show the credit. genuine_card_possession: a counterfeit purchase made while the fleet held the genuine card is not the fleet's. report_moment: a lost or stolen card purchase is not the fleet's when it was authorized at or after the moment coverage_hours_before_report hours before the card's recorded closed_on and closed_time, and is the fleet's when authorized earlier. cancellation_moment: an employee misuse purchase is the fleet's when authorized before the recorded cancellation moment of the card, and, where misuse_after_cancellation_covered is true, not the fleet's when authorized after it. A purchase the review cannot attribute is borne by fleet_liability_default. A merchant credit posted on the purchase during the case resolves it in the fleet's favor with the merchant's credit taking the place of the issuer's (merchant_credit_supersedes). Cases are resolved within investigation_target_days of review and never later than max_resolution_days after opened_on; the fleet gets a status notice every status_update_days and a written resolution."
    eligibility: []
    params:
      per_tier:
        Merchant Error Dispute (Quantity or Price): {liability_review_basis: =liability_review_basis, coverage_hours_before_report: =coverage_hours_before_report, tank_overfill_tolerance_pct: =tank_overfill_tolerance_pct, duplicate_match_window_hours: =duplicate_match_window_hours, fleet_liability_default: =fleet_liability_default}
        Duplicate Posting Dispute: {liability_review_basis: =liability_review_basis, coverage_hours_before_report: =coverage_hours_before_report, tank_overfill_tolerance_pct: =tank_overfill_tolerance_pct, duplicate_match_window_hours: =duplicate_match_window_hours, fleet_liability_default: =fleet_liability_default}
        Credit Not Processed Dispute: {liability_review_basis: =liability_review_basis, coverage_hours_before_report: =coverage_hours_before_report, tank_overfill_tolerance_pct: =tank_overfill_tolerance_pct, duplicate_match_window_hours: =duplicate_match_window_hours, fleet_liability_default: =fleet_liability_default}
        Counterfeit Card Fraud Claim: {liability_review_basis: =liability_review_basis, coverage_hours_before_report: =coverage_hours_before_report, tank_overfill_tolerance_pct: =tank_overfill_tolerance_pct, duplicate_match_window_hours: =duplicate_match_window_hours, fleet_liability_default: =fleet_liability_default}
        Lost or Stolen Card Fraud Claim: {liability_review_basis: =liability_review_basis, coverage_hours_before_report: =coverage_hours_before_report, tank_overfill_tolerance_pct: =tank_overfill_tolerance_pct, duplicate_match_window_hours: =duplicate_match_window_hours, fleet_liability_default: =fleet_liability_default}
        Employee Misuse Review: {liability_review_basis: =liability_review_basis, coverage_hours_before_report: =coverage_hours_before_report, tank_overfill_tolerance_pct: =tank_overfill_tolerance_pct, duplicate_match_window_hours: =duplicate_match_window_hours, fleet_liability_default: =fleet_liability_default}
  - id: dispute_chargeback_rule
    subject: [dispute_chargeback, dispute_chargeback_won, dispute_chargeback_lost]
    rule: "Only a purchase posted at an out_of_network site cleared through Mastercard and can be charged back; purchases at in_network and partner sites are resolved with the merchant under the Meridian network agreement, which gives the merchant network_merchant_response_days to answer. A chargeback is filed under chargeback_reason_category when chargeback_eligible is true and the filing date is no later than chargeback_time_limit_days calendar days after the purchase's post_date; past that limit the case is decided by the review alone. The acquirer has representment_days to represent; with no representment the chargeback stands."
    eligibility: []
    params: {chargeback_eligible: =chargeback_eligible, chargeback_time_limit_days: =chargeback_time_limit_days, chargeback_reason_category: =chargeback_reason_category, representment_days: =representment_days, network_merchant_response_days: =network_merchant_response_days, network_scope: =network_scope}
  - id: dispute_evt_credit_settlement
    subject: [dispute_final_credit, dispute_provisional_reversal]
    rule: "A case resolved in the fleet's favor keeps any provisional credit as final; when it had no provisional credit, a final credit of the credited amount posts on the resolution date, unless a merchant credit superseded it. A case resolved in the merchant's favor has its provisional credit reversed in full provisional_reversal_notice_days calendar days after resolved_on, reason merchant_favor. When the merchant posts its own credit on the purchase while a provisional credit stands, the provisional credit is reversed on the merchant credit's post_date, reason merchant_credit_posted. A withdrawn or lapsed case keeps no credit: any provisional credit is reversed on the withdrawal or lapse date, reason case_withdrawn. Gallons of a purchase credited in full stop counting toward volume rebates where credited_gallons_excluded_from_rebate is true."
    eligibility: []
    params: {provisional_reversal_notice_days: =provisional_reversal_notice_days, merchant_credit_supersedes: =merchant_credit_supersedes, credited_gallons_excluded_from_rebate: =credited_gallons_excluded_from_rebate, late_fee_exclusion_while_open: =late_fee_exclusion_while_open, written_resolution_notice: =written_resolution_notice}
  - id: dispute_withdraw_rule
    subject: [dispute_withdraw]
    rule: "Only the fleet's authorized account administrator may withdraw a case, and only before review (withdrawal_allowed); a withdrawn case is never refiled. odometer_evidence_used and pump_inspection_request set the evidence weighed in review for each case type."
    eligibility: []
    params: {withdrawal_allowed: =withdrawal_allowed, odometer_evidence_used: =odometer_evidence_used, pump_inspection_request: =pump_inspection_request, investigation_target_days: =investigation_target_days, max_resolution_days: =max_resolution_days, status_update_days: =status_update_days}
