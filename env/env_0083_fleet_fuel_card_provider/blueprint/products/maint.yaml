# Fleet Maintenance charter — Meridian Fleet Payments. A fleet enrolls vehicles of a card program in
# a maintenance service level: network repair shops paid with program cards, repair-order approval
# by Meridian technicians above a threshold, network labor/parts/tire discounts, and a per-vehicle
# monthly service fee. Repair orders and fees bill on the fleet's credit line statement.
category: maint
display_name: Fleet Maintenance Management

binding:
  holding_table: maint_programs
  event_tables: [maint_orders]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending, active, ended]
  transitions:
    - {from: pending, to: active, by: system, means: "The enrollment takes effect on the first day of the next calendar month."}
    - {from: pending, to: ended, by: system, means: "The enrollment is not accepted (program not active or too few vehicles)."}
    - {from: active, to: ended, by: user, means: "The fleet's authorized administrator ends the maintenance service, effective the last day of the month."}

accounts:
  - key: maint_charges
    unit: USD
    meaning: "Maintenance charges billed to the fleet: posted repair orders and service fees book in; repair-order credits and fee reversals book out."

parameter_schema:
  monthly_fee_per_vehicle_usd: Service fee per enrolled vehicle per calendar month (USD).
  min_enrolled_vehicles: Fewest vehicles that may be enrolled (integer).
  max_enrolled_vehicles: Most vehicles that may be enrolled (integer).
  technician_review: Whether Meridian technicians review repair orders (boolean).
  approval_threshold_usd: Repair-order estimate above which technician approval is needed before work (USD; 0.00 = no approval service).
  auto_approve_pm: Whether preventive maintenance at a network shop is approved without review at any amount (boolean).
  network_labor_discount_pct: Discount on labor at network shops (percent).
  network_parts_discount_pct: Discount on parts at network shops (percent).
  tire_discount_pct: Discount on tires at network tire dealers (percent).
  labor_rate_cap_usd: Highest hourly labor rate a network shop may bill (USD per hour; 0.00 = no cap).
  out_of_network_shops_allowed: Whether repairs at shops outside the network may be paid with the program's cards (boolean).
  oon_approval_threshold_usd: Estimate above which an out-of-network repair needs approval (USD; 0.00 = no approval service).
  pm_reminders: Whether preventive-maintenance reminders are sent (boolean).
  pm_interval_miles_default: Default preventive-maintenance interval (integer miles).
  roadside_assistance: Whether 24-hour roadside dispatch is included (boolean).
  roadside_calls_per_vehicle_12m: Roadside dispatches included per vehicle per 12 months (integer; 0 = none).
  warranty_recovery: Whether repairs are screened for manufacturer warranty recovery (boolean).
  recall_alerts: Whether open-recall alerts are sent by VIN (boolean).
  dedicated_maintenance_advisor: Whether a named maintenance advisor is assigned (boolean).
  ro_credit_window_days: Calendar days after posting within which a shop may credit a repair order (integer days).
  comeback_warranty_days: Days a network shop's repair is warranted against comeback (integer days).
  comeback_warranty_miles: Miles a network shop's repair is warranted against comeback (integer miles).
  fee_proration: How the vehicle fee treats a vehicle enrolled part of a month (enum full_month_if_enrolled_on_last_day).
  first_month_fee_waived: Whether the first calendar month's vehicle fee is waived (boolean).
  vehicle_change_effective: When a change in enrolled vehicles applies (enum next_month).
  term_months: Service term from activation, renewing automatically (integer months).
  early_end_fee_per_vehicle_usd: Fee per enrolled vehicle when the service ends inside its term (USD).
  end_notice_days: Days of notice to end the service (integer days).
  ro_documentation: Repair-order detail captured (enum summary | line_item).
  parts_markup_cap_pct: Highest markup over list a network shop may bill on parts (percent; 0.00 = no cap).
  tire_program_brands: Tire lines the network discount applies to (enum all_brands).
  emergency_repair_after_hours: Whether after-hours repair approvals are available (boolean).
  approval_response_minutes: Target minutes for a technician approval decision (integer; 0 = no approval service).
  max_ro_amount_usd: Largest single repair order that may be paid with the program's cards (USD).
  ro_split_allowed: Whether one repair may be split across several repair orders (boolean).
  declined_work_tracking: Whether work a technician declined is tracked (boolean).
  reporting_level: Maintenance reporting (enum basic | standard | advanced).
  fleet_size_band_pricing: Whether the vehicle fee falls by fleet-size band (boolean).
  discount_application: 'When network discounts apply (enum at_posting: the shop bills the discounted amount and discount_amount records it).'
  discount_rounding: Rounding of discounts (enum half_up_cent).
  unapproved_ro_handling: What happens to a repair order that needed approval and lacked it (enum fleet_liable).
  annual_inspection_reminders: Whether DOT annual inspection reminders are sent (boolean).
  telematics_fault_alerts: Whether engine fault codes from telematics open service tickets (boolean).
  network_shop_count_tier: Network access (enum national_network).
  mobile_repair_access: Whether mobile repair vendors may be used (boolean).
  fee_waived_inactive_vehicle: Whether no fee is charged for an enrolled vehicle whose card was closed all month (boolean).
  enrollment_fee_usd: One-time enrollment fee (USD).
  max_programs_linked: Card programs one maintenance service may cover (integer).

