events:
  - type: maint_enroll
    target: maint_programs
    mutation: create
    meaning: "A fleet enrolls vehicles of a card program in a maintenance service level."
    grain: "One row per enrollment."
    fields:
      maint_program_id: "Reference of the enrollment."
      customer_id: "The fleet."
      program_id: "Card program covered."
      variant_name: "Service level."
      enrolled_vehicles: "Vehicles enrolled."
      enrolled_on: "Enrollment date."
    triggers: []
  - type: maint_activate
    target: maint_programs
    mutation: {transition: {from: pending, to: active}}
    meaning: "The service takes effect."
    grain: "One row per activation."
    fields: {activated_on: "First day of the next month."}
    triggers: []
  - type: maint_decline
    target: maint_programs
    mutation: {transition: {from: pending, to: ended}}
    meaning: "The enrollment is not accepted."
    grain: "One row per decline."
    fields: {ended_on: "Decline date."}
    triggers: []
  - type: maint_end
    target: maint_programs
    mutation: {transition: {from: active, to: ended}}
    meaning: "The administrator ends the service."
    grain: "One row per ending."
    fields: {ended_on: "Last day of the month the notice runs out."}
    triggers: []
  - type: maint_vehicle_change
    target: maint_programs
    mutation: update
    meaning: "The number of enrolled vehicles changes."
    grain: "One row per change."
    fields: {enrolled_vehicles: "New count, effective next month."}
    triggers: []
  - type: maint_ro_approval
    target: maint_orders
    meaning: "A Meridian technician approves or declines a repair-order estimate before work."
    grain: "One row per estimate decided, identified by the shop's repair-order number."
    distinguish_by: [ro_number]
    fields:
      repair_order_id: "Reference of the decision."
      fleet_card_id: "Card of the vehicle."
      ro_number: "Shop's repair-order number."
      ro_date: "Decision date."
      shop_name: "Shop."
      shop_network: "in_network or out_of_network."
      service_category: "Kind of work."
      amount: "Estimate amount."
      approval_status: "approved or declined."
    triggers: []
  - type: maint_ro_posted
    target: maint_orders
    meaning: "A completed repair order paid with a program card posts."
    grain: "One row per posted repair order."
    distinguish_by: [ro_number]
    fields:
      repair_order_id: "Reference of the posting."
      fleet_card_id: "Card used."
      ro_number: "Shop's repair-order number."
      ro_date: "Posting date."
      shop_name: "Shop."
      shop_network: "in_network or out_of_network."
      service_category: "Kind of work."
      labor_amount: "Labor billed before discount."
      parts_amount: "Parts and tires billed before discount."
      discount_amount: "Network discount; 0.00 out of network."
      amount: "labor + parts - discount."
      approval_status: "approved, not_required or missing."
    account: maint_charges
    direction: in
    triggers: []
  - type: maint_ro_credit
    target: maint_orders
    meaning: "A shop credits a posted repair order (comeback, overcharge, warranty recovery)."
    grain: "One row per shop credit."
    distinguish_by: [ro_number, original_order_id]
    fields:
      repair_order_id: "Reference of the credit."
      original_order_id: "The repair order credited."
      ro_number: "Credit memo number."
      ro_date: "Posting date."
      amount: "Amount credited (positive)."
    account: maint_charges
    direction: out
    triggers: []
  - type: maint_service_fee
    target: maint_orders
    meaning: "The monthly per-vehicle service fee."
    grain: "One row per enrollment per calendar month."
    distinguish_by: [period_start]
    fields:
      repair_order_id: "Reference of the fee."
      ro_date: "Assessment date: first day after the month."
      period_start: "First day of the month."
      billed_vehicles: "Vehicles billed for the month."
      amount: "Billed vehicles times the fee."
    account: maint_charges
    direction: in
    triggers: []
  - type: maint_early_end_fee
    target: maint_orders
    meaning: "The early end fee when the service ends inside its term."
    grain: "One row per ended enrollment charged."
    distinguish_by: [ro_date]
    fields:
      repair_order_id: "Reference of the fee."
      ro_date: "Effective end date."
      billed_vehicles: "Vehicles enrolled at the end."
      amount: "Billed vehicles times the per-vehicle early end fee."
    account: maint_charges
    direction: in
    triggers: []
  - type: maint_fee_reversal
    target: maint_orders
    meaning: "A service fee assessed in error is reversed in full."
    grain: "One row per reversed fee."
    distinguish_by: [original_order_id]
    fields:
      repair_order_id: "Reference of the reversal."
      original_order_id: "The fee reversed."
      ro_date: "Reversal date."
      amount: "Amount reversed (positive)."
    account: maint_charges
    direction: out
    triggers: []

measures:
  - id: maint_msr_billed_vehicles
    window: "One calendar month."
    measure: "enrolled_vehicles in force on the month's last day, less enrolled vehicles whose program card was closed on every day of the month where fee_waived_inactive_vehicle is true."

policies:
  - id: maint_agg_multi_holding
    subject: [maint_enroll]
    rule: "A customer may hold one maintenance enrollment per card program, so never more enrollments than the programs it holds (max_per_customer); each covers only the vehicles of its own program (max_programs_linked)."
    eligibility: []
    params: {max_per_customer: 3, max_programs_linked: =max_programs_linked}
  - id: maint_agg_fleet_fee
    subject: [maint_service_fee]
    rule: "Service fees are figured per enrollment and never pooled across the customer's enrollments; a vehicle enrolled under two programs pays under each. fleet_size_band_pricing is false on every level, so the fee does not fall with the total number of vehicles."
    eligibility: []
    params: {fleet_size_band_pricing: =fleet_size_band_pricing}
  - id: maint_enroll_rule
    subject: [maint_enroll, maint_activate, maint_decline, maint_vehicle_change]
    rule: "An enrollment is taken only on a program in status active whose tier's max_purchase_scope covers maintenance, for between min_enrolled_vehicles and max_enrolled_vehicles vehicles; it activates on the first day of the next month. A change in enrolled vehicles applies from the next month (vehicle_change_effective). enrollment_fee_usd is charged on enrollment."
    eligibility:
      - id: maint_program_active
        applies_to: [maint_enroll]
        kind: state
        condition: "An enrollment is taken only on a program in status active whose tier's max_purchase_scope covers maintenance, for between min_enrolled_vehicles and max_enrolled_vehicles vehicles; it activates on the first day of the next month."
        evidence_fields: [fleet_programs.status, fleet_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fleet_programs.program_id]]
          action_bindings: {fleet_programs.program_id: program_id}
        state_contract:
          field: fleet_programs.status
          allowed: [active]
    params: {min_enrolled_vehicles: =min_enrolled_vehicles, max_enrolled_vehicles: =max_enrolled_vehicles, vehicle_change_effective: =vehicle_change_effective, enrollment_fee_usd: =enrollment_fee_usd}
  - id: maint_evt_approval
    subject: [maint_ro_approval]
    rule: "Where technician_review is true, a network repair estimate above approval_threshold_usd, or an out-of-network estimate above oon_approval_threshold_usd, needs a technician's approval before work; preventive maintenance at a network shop needs none where auto_approve_pm is true. No repair order may exceed max_ro_amount_usd or be split (ro_split_allowed). Technicians answer within approval_response_minutes, after hours only where emergency_repair_after_hours is true."
    eligibility: []
    params:
      per_tier:
        Maintenance Assist Basic: {approval_threshold_usd: =approval_threshold_usd, oon_approval_threshold_usd: =oon_approval_threshold_usd, technician_review: =technician_review}
        Maintenance Assist Plus: {approval_threshold_usd: =approval_threshold_usd, oon_approval_threshold_usd: =oon_approval_threshold_usd, technician_review: =technician_review}
        Maintenance Assist Pro: {approval_threshold_usd: =approval_threshold_usd, oon_approval_threshold_usd: =oon_approval_threshold_usd, technician_review: =technician_review}
        Managed Maintenance Select: {approval_threshold_usd: =approval_threshold_usd, oon_approval_threshold_usd: =oon_approval_threshold_usd, technician_review: =technician_review}
        Managed Maintenance Premier: {approval_threshold_usd: =approval_threshold_usd, oon_approval_threshold_usd: =oon_approval_threshold_usd, technician_review: =technician_review}
        Managed Maintenance Enterprise: {approval_threshold_usd: =approval_threshold_usd, oon_approval_threshold_usd: =oon_approval_threshold_usd, technician_review: =technician_review}
  - id: maint_evt_ro_posting
    subject: [maint_ro_posted]
    rule: "At a network shop the discount is network_labor_discount_pct percent of labor_amount plus network_parts_discount_pct percent of parts_amount (tire_discount_pct for tires), rounded half up to the cent and applied at posting; out-of-network repair orders carry no discount. Labor above labor_rate_cap_usd per hour and parts markup above parts_markup_cap_pct are not billable at network shops where those caps are above 0.00. A repair order that needed approval and lacked it is posted with approval_status missing and remains the fleet's (unapproved_ro_handling)."
    eligibility: []
    params: {network_labor_discount_pct: =network_labor_discount_pct, network_parts_discount_pct: =network_parts_discount_pct, tire_discount_pct: =tire_discount_pct, labor_rate_cap_usd: =labor_rate_cap_usd, parts_markup_cap_pct: =parts_markup_cap_pct, unapproved_ro_handling: =unapproved_ro_handling}
    formula:
      amount: "labor_amount + parts_amount - discount_amount"
  - id: maint_evt_ro_credit
    subject: [maint_ro_credit]
    rule: "A shop may credit a posted repair order within ro_credit_window_days of its posting, never for more than its amount less earlier credits. A comeback within comeback_warranty_days or comeback_warranty_miles of the original repair is redone or credited by the network shop; warranty_recovery screening may produce a credit from the manufacturer."
    eligibility: []
    params: {ro_credit_window_days: =ro_credit_window_days, comeback_warranty_days: =comeback_warranty_days, comeback_warranty_miles: =comeback_warranty_miles, warranty_recovery: =warranty_recovery}
  - id: maint_evt_service_fee
    subject: [maint_service_fee, maint_fee_reversal]
    rule: "On the first day after each calendar month in which the enrollment was active, one fee row is written: billed_vehicles is maint_msr_billed_vehicles and amount is billed_vehicles times monthly_fee_per_vehicle_usd; the first month is not charged where first_month_fee_waived is true, and no row is written where the fee is 0.00. A fee assessed contrary to this rule is reversed in full once; a correct fee is never reversed."
    eligibility: []
    params: {monthly_fee_per_vehicle_usd: =monthly_fee_per_vehicle_usd, first_month_fee_waived: =first_month_fee_waived, fee_proration: =fee_proration, fee_waived_inactive_vehicle: =fee_waived_inactive_vehicle}
    formula:
      amount: "billed_vehicles * monthly_fee_per_vehicle_usd"
    measures: [maint_msr_billed_vehicles]
  - id: maint_end_rule
    subject: [maint_end, maint_early_end_fee]
    rule: "Only the fleet's authorized administrator ends the service, with end_notice_days of notice, effective the last day of the month in which the notice runs out; ending inside term_months carries early_end_fee_per_vehicle_usd per enrolled vehicle, booked as one maint_early_end_fee row on the effective end date. Service features (pm_reminders, pm_interval_miles_default, roadside_assistance, roadside_calls_per_vehicle_12m, recall_alerts, dedicated_maintenance_advisor, ro_documentation, declined_work_tracking, reporting_level, annual_inspection_reminders, telematics_fault_alerts, mobile_repair_access, tire_program_brands, network_shop_count_tier, discount_application, discount_rounding, out_of_network_shops_allowed) are set by the service level."
    eligibility: []
    params: {end_notice_days: =end_notice_days, term_months: =term_months, early_end_fee_per_vehicle_usd: =early_end_fee_per_vehicle_usd}
