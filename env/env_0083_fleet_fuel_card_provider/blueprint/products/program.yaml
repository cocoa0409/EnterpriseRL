      txn_date: "Date of the purchase."
      txn_time: "Local time of the purchase."
      post_date: "Posting date."
      merchant_name: "Merchant name."
      site_number: "Site or merchant number."
      site_state: "State or province."
      site_country: "US or CA."
      network: "in_network, partner or out_of_network."
      site_service: "Always not_applicable."
      product_code: "Non-fuel product code."
      gallons: "Always 0.000."
      unit_price: "Always 0.000."
      gross_amount: "Purchase amount."
      partner_discount_amount: "Always 0.00."
      net_amount: "Equals the gross amount."
      odometer: "Odometer entered; 0 when not prompted."
      driver_prompt_number: "Driver ID entered; empty when not prompted."
      entry_method: "How the card was read."
    account: program_charges
    direction: in
    triggers:
      - event: program:program_manual_entry_fee
        when: {entry_method: [key_entered, voice_authorization]}
        map: {related_txn_id: program_txn_id, charge_date: post_date}
      - event: program:program_intl_fee
        when: {site_country: CA}
        map: {related_txn_id: program_txn_id, charge_date: post_date}
  - type: program_txn_reversal
    target: program_transactions
    meaning: "The merchant posts a credit against an earlier purchase (pump error, duplicate post, refund)."
    grain: "One row per merchant credit, identified by its own merchant reference and the purchase it credits."
    distinguish_by: [txn_ref, original_txn_id]
    fields:
