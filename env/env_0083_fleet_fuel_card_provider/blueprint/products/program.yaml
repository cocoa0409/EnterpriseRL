measures:
  - id: program_msr_counted_cards
    window: "One fee cycle (calendar month) of one program."
    measure: "Count of fleet_cards on the program whose activated_on is on or before cycle_end and whose closed_on is empty or on or after cycle_start (a card active on any day of the cycle, suspended days included); under new_card_first_cycle_card_fee = waived, cards whose activated_on falls inside the cycle are left out."
  - id: program_msr_fleet_counted_cards
    window: "One fee cycle (calendar month), across every program the customer holds."
    measure: "Count of fleet_cards on any of the customer's programs whose activated_on is on or before cycle_end and whose closed_on is empty or on or after cycle_start."
  - id: program_msr_cycle_billed_gallons
    window: "One fee cycle (calendar month) of one program, by post_date."
    measure: "Sum of gallons of program_fuel_purchase rows posted in the cycle less the sum of gallons of program_txn_reversal rows posted in the cycle."
  - id: program_msr_cycle_oon_fees
    window: "One fee cycle (calendar month) of one program, by charge_date, before the fee being assessed."
    measure: "Sum of amount of program_oon_fee rows already assessed in the cycle, less any program_fee_reversal amounts reversing them."
  - id: program_msr_cycle_manual_fees
    window: "One fee cycle (calendar month) of one program, by charge_date, before the fee being assessed."
    measure: "Sum of amount of program_manual_entry_fee rows already assessed in the cycle, less any program_fee_reversal amounts reversing them."
  - id: program_msr_months_since_purchase
    window: "From the post_date of the program's latest program_fuel_purchase or program_nonfuel_purchase (or activated_on when none) to today."
    measure: "Whole calendar months elapsed, counted by month-day anniversary."
  - id: program_msr_review_avg_gallons
    window: "The tier_review_interval_months full calendar months ending on the last day before the review date."
    measure: "program_msr_cycle_billed_gallons summed over those months divided by the number of months."

policies:
  - id: program_agg_multi_holding
    subject: [program_open]
    rule: "A customer may hold up to the max_per_customer number of programs in status applied, active or suspended at the same time; closed programs do not count. Every program a customer holds is billed through that customer's one credit line, and a program application names that credit line. A further application beyond the cap is not opened; the fleet may instead add cards to an existing program within its tier's max_active_cards."
    eligibility: []
    params: {max_per_customer: 3}
  - id: program_agg_fleet_size_band
    subject: [program_card_fee, program_open, program_tier_change]
    rule: "The fleet-size band is set by program_msr_fleet_counted_cards: the total cards counted for the same fee cycle across all of the customer's programs, not the cards on one program. The per-card fee of every program is the fee_usd of the card_fee_ladder band of that program's own tier whose from_cards to to_cards range contains the fleet-size band count (both ends inclusive; a null to_cards has no upper bound). For an application or a tier move, entry_min_active_cards is tested against the active cards across all of the customer's programs on the application date."
    eligibility: []
    params:
      per_tier:
        Meridian Fleet Essential: {card_fee_ladder: =card_fee_ladder, entry_min_active_cards: =entry_min_active_cards}
        Meridian Fleet Standard: {card_fee_ladder: =card_fee_ladder, entry_min_active_cards: =entry_min_active_cards}
        Meridian Fleet Plus: {card_fee_ladder: =card_fee_ladder, entry_min_active_cards: =entry_min_active_cards}
        Meridian Fleet Universal: {card_fee_ladder: =card_fee_ladder, entry_min_active_cards: =entry_min_active_cards}
        Meridian Fleet Premier: {card_fee_ladder: =card_fee_ladder, entry_min_active_cards: =entry_min_active_cards}
        Meridian Fleet Enterprise: {card_fee_ladder: =card_fee_ladder, entry_min_active_cards: =entry_min_active_cards}
    measures: [program_msr_fleet_counted_cards]
  - id: program_open_eligibility
    subject: [program_open, program_activate, program_decline]
    rule: "A program application is taken only on a credit line that can bill it. The credit line named on the application is in status active. The applied-for tier's entry gate must hold on the application date: active cards across all of the customer's programs of at least the tier's min_active_cards, and the credit line's tier rank (its rank in the credit charter's ladder) of at least min_credit_line_rank; a tier whose gate does not hold is not applied for, and the fleet is offered the highest tier whose gate holds. Underwriting approves (program_activate) or declines (program_decline); approval sets activated_on, which anchors every first-cycle waiver, the setup fee and the early termination period."
    eligibility:
      - id: credit_line_active
        applies_to: [program_open]
        kind: state
        condition: "The credit line named on the application is in status active."
        evidence_fields: [credit_lines.status, credit_lines.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_lines.credit_line_id]]
          action_bindings: {credit_lines.credit_line_id: credit_line_id}
        state_contract:
          field: credit_lines.status
          allowed: [active]
  - id: program_evt_purchase_posting
    subject: [program_fuel_purchase, program_nonfuel_purchase]
    rule: "Every purchase posts with its Level-3 data. For fuel, gross_amount is gallons times unit_price rounded half up to the cent. A partner-site discount applies only to a fuel purchase whose network is partner, whose product_code is unleaded_regular, unleaded_midgrade, unleaded_premium or diesel, and whose site_service is self_serve (or full_serve where the tier's partner_discount_full_serve is true): partner_discount_amount is the lesser of gallons and partner_discount_max_gallons_per_txn, times partner_discount_cpg_gasoline for the three unleaded grades or partner_discount_cpg_diesel for diesel, rounded half up to the cent; every other purchase carries 0.00. net_amount is gross_amount less partner_discount_amount. Dyed diesel and DEF never earn a partner discount. A non-fuel purchase carries gallons 0.000, unit_price 0.000 and net_amount equal to gross_amount. A purchase posts under the tier in effect on its post_date (the current tier from tier_effective_on onward, prior_variant_name before it). A purchase posts within posting_business_days of its txn_date."
    eligibility: []
    params:
      per_tier:
        Meridian Fleet Essential: {partner_discount_cpg_gasoline: =partner_discount_cpg_gasoline, partner_discount_cpg_diesel: =partner_discount_cpg_diesel, partner_discount_max_gallons_per_txn: =partner_discount_max_gallons_per_txn}
        Meridian Fleet Standard: {partner_discount_cpg_gasoline: =partner_discount_cpg_gasoline, partner_discount_cpg_diesel: =partner_discount_cpg_diesel, partner_discount_max_gallons_per_txn: =partner_discount_max_gallons_per_txn}
        Meridian Fleet Plus: {partner_discount_cpg_gasoline: =partner_discount_cpg_gasoline, partner_discount_cpg_diesel: =partner_discount_cpg_diesel, partner_discount_max_gallons_per_txn: =partner_discount_max_gallons_per_txn}
        Meridian Fleet Universal: {partner_discount_cpg_gasoline: =partner_discount_cpg_gasoline, partner_discount_cpg_diesel: =partner_discount_cpg_diesel, partner_discount_max_gallons_per_txn: =partner_discount_max_gallons_per_txn}
        Meridian Fleet Premier: {partner_discount_cpg_gasoline: =partner_discount_cpg_gasoline, partner_discount_cpg_diesel: =partner_discount_cpg_diesel, partner_discount_max_gallons_per_txn: =partner_discount_max_gallons_per_txn}
        Meridian Fleet Enterprise: {partner_discount_cpg_gasoline: =partner_discount_cpg_gasoline, partner_discount_cpg_diesel: =partner_discount_cpg_diesel, partner_discount_max_gallons_per_txn: =partner_discount_max_gallons_per_txn}
    formula:
      gross_amount: "round(gallons * unit_price, 2)"
      net_amount: "gross_amount - partner_discount_amount"
  - id: program_evt_card_fee
    subject: [program_card_fee]
    rule: "The fee cycle for program fees is the calendar month. On the first day after each fee cycle one per-card fee row is written for every program that was active or suspended on any day of the cycle. active_card_count is program_msr_counted_cards for the cycle. billed_card_count is active_card_count less the tier's fee_free_cards, never below 0. unit_amount is the per-card fee set by program_agg_fleet_size_band, and amount is billed_card_count times unit_amount. The tier is the one in effect on cycle_end. A cycle with no billed card records 0.00. A per-card fee is never prorated by days."
    eligibility: []
    params:
      per_tier:
        Meridian Fleet Essential: {fee_free_cards: =fee_free_cards, new_card_first_cycle_card_fee: =new_card_first_cycle_card_fee}
        Meridian Fleet Standard: {fee_free_cards: =fee_free_cards, new_card_first_cycle_card_fee: =new_card_first_cycle_card_fee}
        Meridian Fleet Plus: {fee_free_cards: =fee_free_cards, new_card_first_cycle_card_fee: =new_card_first_cycle_card_fee}
        Meridian Fleet Universal: {fee_free_cards: =fee_free_cards, new_card_first_cycle_card_fee: =new_card_first_cycle_card_fee}
        Meridian Fleet Premier: {fee_free_cards: =fee_free_cards, new_card_first_cycle_card_fee: =new_card_first_cycle_card_fee}
        Meridian Fleet Enterprise: {fee_free_cards: =fee_free_cards, new_card_first_cycle_card_fee: =new_card_first_cycle_card_fee}
    formula:
      billed_card_count: "max(active_card_count - fee_free_cards, 0)"
      amount: "round(billed_card_count * unit_amount, 2)"
    measures: [program_msr_counted_cards]
  - id: program_evt_monthly_fee
    subject: [program_monthly_fee]
    rule: "The monthly program fee is assessed on the first day after each fee cycle for a program that was active or suspended on any day of the cycle, at the monthly_program_fee_usd of the tier in effect on cycle_end. The fee is not assessed, and no row is written, in any of these cases: the tier's monthly_program_fee_usd is 0.00; the cycle is one of the first program_fee_waived_first_cycles fee cycles counted from the cycle containing activated_on; or the tier's program_fee_waiver_gallons is above 0 and program_msr_cycle_billed_gallons for the cycle is at or above it. gallons on the row records program_msr_cycle_billed_gallons."
    eligibility: []
    params:
      per_tier:
        Meridian Fleet Essential: {monthly_program_fee_usd: =monthly_program_fee_usd, program_fee_waiver_gallons: =program_fee_waiver_gallons, program_fee_waived_first_cycles: =program_fee_waived_first_cycles}
        Meridian Fleet Standard: {monthly_program_fee_usd: =monthly_program_fee_usd, program_fee_waiver_gallons: =program_fee_waiver_gallons, program_fee_waived_first_cycles: =program_fee_waived_first_cycles}
        Meridian Fleet Plus: {monthly_program_fee_usd: =monthly_program_fee_usd, program_fee_waiver_gallons: =program_fee_waiver_gallons, program_fee_waived_first_cycles: =program_fee_waived_first_cycles}
        Meridian Fleet Universal: {monthly_program_fee_usd: =monthly_program_fee_usd, program_fee_waiver_gallons: =program_fee_waiver_gallons, program_fee_waived_first_cycles: =program_fee_waived_first_cycles}
        Meridian Fleet Premier: {monthly_program_fee_usd: =monthly_program_fee_usd, program_fee_waiver_gallons: =program_fee_waiver_gallons, program_fee_waived_first_cycles: =program_fee_waived_first_cycles}
        Meridian Fleet Enterprise: {monthly_program_fee_usd: =monthly_program_fee_usd, program_fee_waiver_gallons: =program_fee_waiver_gallons, program_fee_waived_first_cycles: =program_fee_waived_first_cycles}
    measures: [program_msr_cycle_billed_gallons]
  - id: program_evt_oon_fee
    subject: [program_oon_fee]
    rule: "Every fuel purchase posted at an out_of_network site carries one out-of-network fee row at the oon_fee_usd of the tier in effect on its post_date. The fee cycle is the calendar month of the charge_date. The amount is the lesser of oon_fee_usd and the tier's oon_fee_cycle_cap_usd less program_msr_cycle_oon_fees, never below 0.00; once the cap is reached the row records 0.00. Purchases at in_network and partner sites and all non-fuel purchases carry no out-of-network fee."
    eligibility: []
    params:
      per_tier:
        Meridian Fleet Essential: {oon_fee_usd: =oon_fee_usd, oon_fee_cycle_cap_usd: =oon_fee_cycle_cap_usd}
        Meridian Fleet Standard: {oon_fee_usd: =oon_fee_usd, oon_fee_cycle_cap_usd: =oon_fee_cycle_cap_usd}
        Meridian Fleet Plus: {oon_fee_usd: =oon_fee_usd, oon_fee_cycle_cap_usd: =oon_fee_cycle_cap_usd}
        Meridian Fleet Universal: {oon_fee_usd: =oon_fee_usd, oon_fee_cycle_cap_usd: =oon_fee_cycle_cap_usd}
        Meridian Fleet Premier: {oon_fee_usd: =oon_fee_usd, oon_fee_cycle_cap_usd: =oon_fee_cycle_cap_usd}
        Meridian Fleet Enterprise: {oon_fee_usd: =oon_fee_usd, oon_fee_cycle_cap_usd: =oon_fee_cycle_cap_usd}
    formula:
      amount: "max(min(oon_fee_usd, oon_fee_cycle_cap_usd - program_msr_cycle_oon_fees), 0)"
    measures: [program_msr_cycle_oon_fees]
  - id: program_evt_manual_entry_fee
    subject: [program_manual_entry_fee]
    rule: "Every purchase whose entry_method is key_entered or voice_authorization carries one manual-entry fee row at the manual_entry_fee_usd of the tier in effect on its post_date, capped so that the cycle's manual-entry fees do not exceed manual_entry_fee_cycle_cap_usd (the amount is the lesser of the fee and the cap less program_msr_cycle_manual_fees, never below 0.00). The fee is waived (the row records 0.00) when the purchase was made with a card for which a card_replacement row with reason_code damaged exists in the card records and the purchase's txn_date is on or after that replacement's event_date and no more than manual_entry_waiver_days calendar days after it; a tier whose manual_entry_waiver_days is 0 has no such waiver."
    eligibility: []
    params:
      per_tier:
        Meridian Fleet Essential: {manual_entry_fee_usd: =manual_entry_fee_usd, manual_entry_fee_cycle_cap_usd: =manual_entry_fee_cycle_cap_usd, manual_entry_waiver_days: =manual_entry_waiver_days}
        Meridian Fleet Standard: {manual_entry_fee_usd: =manual_entry_fee_usd, manual_entry_fee_cycle_cap_usd: =manual_entry_fee_cycle_cap_usd, manual_entry_waiver_days: =manual_entry_waiver_days}
        Meridian Fleet Plus: {manual_entry_fee_usd: =manual_entry_fee_usd, manual_entry_fee_cycle_cap_usd: =manual_entry_fee_cycle_cap_usd, manual_entry_waiver_days: =manual_entry_waiver_days}
        Meridian Fleet Universal: {manual_entry_fee_usd: =manual_entry_fee_usd, manual_entry_fee_cycle_cap_usd: =manual_entry_fee_cycle_cap_usd, manual_entry_waiver_days: =manual_entry_waiver_days}
        Meridian Fleet Premier: {manual_entry_fee_usd: =manual_entry_fee_usd, manual_entry_fee_cycle_cap_usd: =manual_entry_fee_cycle_cap_usd, manual_entry_waiver_days: =manual_entry_waiver_days}
        Meridian Fleet Enterprise: {manual_entry_fee_usd: =manual_entry_fee_usd, manual_entry_fee_cycle_cap_usd: =manual_entry_fee_cycle_cap_usd, manual_entry_waiver_days: =manual_entry_waiver_days}
    measures: [program_msr_cycle_manual_fees]
  - id: program_evt_intl_fee
    subject: [program_intl_fee]
    rule: "A purchase at a site whose site_country is CA carries a cross-border fee of intl_fee_pct percent of the purchase's net_amount, rounded half up to the cent, at the tier in effect on its post_date; unit_amount records the percent. Purchases at US sites carry none. A program whose tier has canada_acceptance false cannot post a Canadian purchase, so no fee arises on it."
    eligibility: []
    params: {intl_fee_pct: =intl_fee_pct, canada_acceptance: =canada_acceptance}
    formula:
      amount: "round(net_amount * intl_fee_pct / 100, 2)"
  - id: program_evt_fet_credit
    subject: [program_fet_credit, program_fet_credit_reversal, program_fet_status_change]
    rule: "Federal excise tax exempt billing is available only to a customer whose fleet_type is state_local_government or nonprofit_educational, on a program whose tier has fet_exempt_billing_available true, after the fleet's signed exemption certificate is received (fet_certificate_on set and fet_exemption_status moved to active). The program's fet_exemption_status is active. While it is active, every program_fuel_purchase posted at a US site whose txn_date is on or after fet_certificate_on earns one credit row: gallons times the federal rate for its product (fet_rate_gasoline_per_gal for unleaded_regular, unleaded_midgrade and unleaded_premium; fet_rate_diesel_per_gal for diesel), rounded half up to the cent; unit_amount records the rate. Dyed diesel (sold untaxed), DEF, non-fuel purchases and Canadian purchases earn no credit. Purchases dated before fet_certificate_on are not credited retroactively by the program; the fleet claims those from the IRS itself. When the merchant later credits a purchase that earned a federal excise tax credit, the credit is offset by a program_fet_credit_reversal for the credited gallons times the same rate, rounded half up to the cent. When fet_exemption_status moves to ended, purchases dated after the end earn no credit."
    eligibility:
      - id: fet_status_active
        applies_to: [program_fet_credit]
        kind: state
        condition: "The program's fet_exemption_status is active."
        evidence_fields: [fleet_programs.fet_exemption_status, fleet_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fleet_programs.program_id]]
          action_bindings: {fleet_programs.program_id: program_id}
        state_contract:
          field: fleet_programs.fet_exemption_status
          allowed: [active]
    params: {fet_rate_gasoline_per_gal: 0.183, fet_rate_diesel_per_gal: 0.243, fet_exempt_billing_available: =fet_exempt_billing_available}
    formula:
      amount: "round(gallons * unit_amount, 2)"
  - id: program_evt_txn_reversal
    subject: [program_txn_reversal]
    rule: "A merchant credit is posted only as the merchant sends it and always names the purchase it credits (original_txn_id). Its gallons, gross_amount, partner_discount_amount and net_amount are positive and never exceed those of the original purchase less any earlier credits against it. A credit equal to the original purchase's remaining net_amount is a full credit; anything less is a partial credit. A credit posts in the fee cycle of its own post_date, not that of the purchase. Credits the issuer grants on a dispute are not merchant credits; they are booked by the dispute charter."
    eligibility: []
  - id: program_evt_fee_reversal
    subject: [program_fee_reversal]
    rule: "A program fee row is reversed in full, naming it as original_charge_id, in exactly two cases: the fee was assessed contrary to this charter's fee rules (wrong tier, wrong count, a waiver that applied, a purchase that did not qualify), reason assessed_in_error; or the out-of-network, manual-entry or cross-border fee belongs to a purchase that the merchant later credited in full, reason transaction_credited. A partially credited purchase keeps its per-transaction fee. A fee assessed correctly is never reversed as a courtesy. A fee is reversed at most once. When an assessed-in-error fee is replaced by the correct amount, the reversal books first and the correct fee is booked as a new row for the same cycle or purchase."
    eligibility:
      - id: not_already_reversed
        applies_to: [program_fee_reversal]
        kind: dedup
        condition: "A fee is reversed at most once."
        evidence_fields: [program_charges.original_charge_id, program_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[program_charges.original_charge_id]]
          action_bindings: {program_charges.original_charge_id: original_charge_id}
        dedup_contract:
          table: program_charges
          mode: separate_record
          object_bindings: {original_charge_id: original_charge_id}
          duplicate_filters: {event_type: [program_fee_reversal]}
          distinct_fields: []
  - id: program_tier_review
    subject: [program_tier_change]
    rule: "A program moves tier at its scheduled tier review every tier_review_interval_months from activated_on, or earlier on the fleet's request for an upgrade. An upgrade requires the new tier's entry gate to hold on the request date. At a review, a program is moved down one tier when active cards across all programs are below the tier's downgrade_review_active_cards or program_msr_review_avg_gallons is below maintain_min_monthly_gallons (a 0 threshold is never failed). Upgrades and downgrades both take effect at the start of the next billing cycle (tier_upgrade_effective, tier_downgrade_effective): tier_effective_on records that date and prior_variant_name the tier held before it. Fees for a fee cycle use the tier in effect on cycle_end; per-transaction fees use the tier in effect on the purchase's post_date. A tier move is not a closure and carries no early termination fee. A downgrade that would leave more cards on the program than the lower tier's max_active_cards is not made; the program stays on its tier until the next review."
    eligibility: []
    params:
      per_tier:
        Meridian Fleet Essential: {tier_review_interval_months: =tier_review_interval_months, downgrade_review_active_cards: =downgrade_review_active_cards, maintain_min_monthly_gallons: =maintain_min_monthly_gallons}
        Meridian Fleet Standard: {tier_review_interval_months: =tier_review_interval_months, downgrade_review_active_cards: =downgrade_review_active_cards, maintain_min_monthly_gallons: =maintain_min_monthly_gallons}
        Meridian Fleet Plus: {tier_review_interval_months: =tier_review_interval_months, downgrade_review_active_cards: =downgrade_review_active_cards, maintain_min_monthly_gallons: =maintain_min_monthly_gallons}
        Meridian Fleet Universal: {tier_review_interval_months: =tier_review_interval_months, downgrade_review_active_cards: =downgrade_review_active_cards, maintain_min_monthly_gallons: =maintain_min_monthly_gallons}
        Meridian Fleet Premier: {tier_review_interval_months: =tier_review_interval_months, downgrade_review_active_cards: =downgrade_review_active_cards, maintain_min_monthly_gallons: =maintain_min_monthly_gallons}
        Meridian Fleet Enterprise: {tier_review_interval_months: =tier_review_interval_months, downgrade_review_active_cards: =downgrade_review_active_cards, maintain_min_monthly_gallons: =maintain_min_monthly_gallons}
    measures: [program_msr_review_avg_gallons]
  - id: program_lifecycle
    subject: [program_suspend, program_reinstate, program_close, program_close_suspended]
    rule: "A program is suspended when the credit line billing it is suspended, and reinstated when that credit line returns to active; a confirmed fraud hold suspends only the program it concerns and is lifted when the fraud review clears. A program in status suspended is closed when its credit line closes. An active program is closed on the written instruction of the fleet's authorized account administrator, effective closure_notice_days calendar days after the instruction date (on the instruction date when 0), or by the system once program_msr_months_since_purchase reaches inactivity_close_months. Fees continue to accrue on a suspended program. Closure ends every card on the program."
    eligibility: []
    params: {closure_notice_days: =closure_notice_days, inactivity_close_months: =inactivity_close_months}
    measures: [program_msr_months_since_purchase]
  - id: program_evt_one_time_fees
    subject: [program_setup_fee, program_early_termination_fee, program_activate]
    rule: "On activation a setup fee row is written at the tier's setup_fee_usd, charge_date equal to activated_on; no row is written where the tier's setup_fee_usd is 0.00. A closure on the administrator's instruction whose effective date is before the date early_termination_months calendar months after activated_on (same day of month, falling back to the month's last day when that day does not exist) carries one early termination fee at early_termination_fee_usd of the tier held at closure; a closure on or after that date, a closure for inactivity, a closure following a credit line closure and a tier move carry none."
    eligibility: []
    params:
      per_tier:
        Meridian Fleet Essential: {setup_fee_usd: =setup_fee_usd, early_termination_months: =early_termination_months, early_termination_fee_usd: =early_termination_fee_usd}
        Meridian Fleet Standard: {setup_fee_usd: =setup_fee_usd, early_termination_months: =early_termination_months, early_termination_fee_usd: =early_termination_fee_usd}
        Meridian Fleet Plus: {setup_fee_usd: =setup_fee_usd, early_termination_months: =early_termination_months, early_termination_fee_usd: =early_termination_fee_usd}
        Meridian Fleet Universal: {setup_fee_usd: =setup_fee_usd, early_termination_months: =early_termination_months, early_termination_fee_usd: =early_termination_fee_usd}
        Meridian Fleet Premier: {setup_fee_usd: =setup_fee_usd, early_termination_months: =early_termination_months, early_termination_fee_usd: =early_termination_fee_usd}
        Meridian Fleet Enterprise: {setup_fee_usd: =setup_fee_usd, early_termination_months: =early_termination_months, early_termination_fee_usd: =early_termination_fee_usd}
  - id: program_evt_ifta_report
    subject: [program_ifta_enrollment, program_ifta_report_fee]
    rule: "A program may enroll in the quarterly IFTA jurisdiction fuel report only where its tier's ifta_reporting_available is true. The report lists billed fuel gallons by site_state for the calendar quarter; it is a reporting service and files nothing with any jurisdiction for the fleet. On the first day after each calendar quarter in which ifta_reporting was true on the quarter's last day, one fee row at the tier's ifta_report_fee_usd is written; no row is written where that fee is 0.00. Leaving the report stops the fee from the next quarter."
    eligibility: []
    params: {ifta_reporting_available: =ifta_reporting_available, ifta_report_fee_usd: =ifta_report_fee_usd}
  - id: program_purchase_scope
    subject: [program_nonfuel_purchase, program_fuel_purchase]
    rule: "The cards on a program may carry a product restriction no broader than the tier's max_purchase_scope, and the program may hold no more than max_control_profiles purchase-control profiles in force and max_active_cards cards in status active or ordered. Non-fuel purchases at non-fuel Mastercard merchants post only where the tier's nonfuel_mastercard_acceptance is true. Mobile-wallet purchases post only where mobile_wallet_payments is true, mobile fueling only where mobile_fueling_access is true, and Canadian purchases only where canada_acceptance is true. Driver ID prompting (driver_id_prompting), odometer prompting (odometer_prompting), tank-capacity checks (tank_capacity_check_available) and custom time windows (custom_time_windows) are available to purchase-control profiles as the tier sets them. The tier also sets the fleet's service entitlements: level3_statement_detail, decline_alerts, fraud_monitoring, reporting_package, data_feed_access, dedicated_account_manager and support_hours."
    eligibility: []
    params: {max_purchase_scope: =max_purchase_scope, max_control_profiles: =max_control_profiles, max_active_cards: =max_active_cards, nonfuel_mastercard_acceptance: =nonfuel_mastercard_acceptance, mobile_wallet_payments: =mobile_wallet_payments, mobile_fueling_access: =mobile_fueling_access}
