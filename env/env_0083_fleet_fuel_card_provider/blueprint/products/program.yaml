# Fleet Card Program charter — Meridian Fleet Payments. The card program a fleet holds: the network it
# buys on, the purchase scope its cards may carry, the per-card and program fees, the per-transaction
# fees, Level-3 fuel transaction posting, merchant reversals and the federal excise tax credit for
# exempt fleets. Every program bills through the fleet's single commercial credit line (credit charter).
category: program
display_name: Fleet Card Program

binding:
  holding_table: fleet_programs
  event_tables: [program_transactions, program_charges]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [applied, active, suspended, closed]
  transitions:
    - {from: applied, to: active, by: system, means: "Underwriting approves the program application and the program opens for card orders and purchases."}
    - {from: applied, to: closed, by: system, means: "Underwriting declines the program application; no card is ever issued under it."}
    - {from: active, to: suspended, by: agent, means: "The program is placed on hold because the credit line billing it is suspended or a confirmed fraud hold is required; every card on it declines while suspended."}
    - {from: suspended, to: active, by: agent, means: "The hold is lifted once the credit line billing the program is active again or the fraud hold is cleared."}
    - {from: active, to: closed, by: user, means: "The fleet's authorized account administrator instructs closure of the program in writing; every card on it is closed with it."}
    - {from: suspended, to: closed, by: agent, means: "A suspended program is closed because the credit line billing it has been closed."}

accounts:
  - key: program_charges
    unit: USD
    meaning: "Charges posted to the program and not yet offset — purchases and program fees book in; merchant reversals, fee reversals and federal excise tax credits book out. The credit charter's statement bills the net of a cycle's movements."

parameter_schema:
  nonfuel_mastercard_acceptance: Whether All-Purchase cards on the program are also accepted at non-fuel Mastercard merchants (boolean); when false, non-fuel purchases are possible only at network and partner sites and in-network service shops.
  canada_acceptance: Whether cards on the program are accepted at Canadian fuel sites (boolean).
  max_purchase_scope: Broadest product restriction a card on the program may carry (enum fuel_only | fuel_and_maintenance | all_purchases).
  entry_min_active_cards: Minimum active cards across all of the customer's programs on the application date for the tier to be opened or moved to (integer, cards).
  max_active_cards: Maximum cards in status active or ordered on this one program at any time (integer, cards).
  card_fee_ladder: 'Monthly per-card fee by fleet-size band: list of {from_cards, to_cards (null = no upper bound), fee_usd}; the band is the fleet-size band defined in program_agg_fleet_size_band (USD per billed card per cycle).'
  fee_free_cards: Number of counted cards per program per cycle carried without a per-card fee (integer, cards).
  card_fee_count_basis: 'Which cards count for the per-card fee (enum active_any_day_of_cycle: a card counts if its status was active on any day of the cycle).'
  new_card_first_cycle_card_fee: Whether a card first activated inside a cycle is counted in that first cycle (enum charged | waived).
  monthly_program_fee_usd: Program fee assessed once per monthly fee cycle (USD).
  program_fee_waiver_gallons: Billed fuel gallons on the program within the fee cycle at or above which the program fee is waived (integer gallons; 0 = no gallon waiver exists for the tier).
  program_fee_waived_first_cycles: Number of fee cycles, counted from the cycle containing the activation date, in which the program fee is not assessed (integer cycles).
  oon_fee_usd: Out-of-network fee per fuel purchase posted at an out_of_network site (USD per transaction).
  oon_fee_cycle_cap_usd: Maximum total out-of-network fees assessed on the program in one fee cycle (USD).
  partner_discount_cpg_gasoline: Partner-site discount on unleaded regular, midgrade and premium gallons (USD per gallon).
  partner_discount_cpg_diesel: Partner-site discount on diesel gallons (USD per gallon; never on dyed diesel or DEF).
  partner_discount_max_gallons_per_txn: Gallons per transaction on which the partner-site discount is given (integer gallons).
  partner_discount_full_serve: Whether the partner-site discount also applies at full-serve islands (boolean; self-serve always qualifies).
  manual_entry_fee_usd: Fee per purchase authorized by key entry or voice authorization instead of a card read (USD per transaction).
  manual_entry_fee_cycle_cap_usd: Maximum total manual-entry fees assessed on the program in one fee cycle (USD).
  manual_entry_waiver_days: Calendar days, counted from the order date of a replacement for a damaged card, during which key-entered purchases on that damaged card carry no manual-entry fee (integer days; 0 = no waiver).
  intl_fee_pct: Cross-border fee on purchases at Canadian sites, percent of the purchase net amount (percent; 0.00 where Canada acceptance is off).
  ifta_reporting_available: Whether the quarterly IFTA jurisdiction fuel report can be enrolled on the program (boolean).
  ifta_report_fee_usd: Fee per calendar quarter for the IFTA jurisdiction fuel report while enrolled (USD per quarter).
  mobile_wallet_payments: Whether drivers may pay at the pump with the Meridian Fleet app (boolean; posts with entry method mobile_wallet).
  mobile_fueling_access: Whether on-site mobile fueling vendors may be paid with program cards (boolean; posts with site service mobile_fueling).
  max_control_profiles: Maximum purchase-control profiles that may be in force on the program at once (integer).
  custom_time_windows: Whether a purchase-control profile on the program may carry its own day-of-week and time-of-day window (boolean).
  setup_fee_usd: One-time program setup fee assessed on activation (USD).
  early_termination_months: Months from the activation date within which a customer-instructed closure carries the early termination fee (integer months; 0 = none).
  early_termination_fee_usd: Fee for a customer-instructed closure inside the early termination period (USD).
  closure_notice_days: Calendar days of written notice before a customer-instructed closure takes effect (integer days; 0 = effective on the instruction date).
  tier_review_interval_months: Months between scheduled tier reviews of the program (integer months).
  downgrade_review_active_cards: Active cards across all programs below which a program is moved down at its tier review (integer cards; 0 = never moved down on card count).
  maintain_min_monthly_gallons: Average billed fuel gallons per month over the review period below which a program is moved down at its tier review (integer gallons; 0 = no gallon test).
  tier_upgrade_effective: When an approved tier upgrade takes effect (enum next_cycle_start).
  tier_downgrade_effective: When a tier downgrade takes effect (enum next_cycle_start).
  inactivity_close_months: Consecutive calendar months with no posted purchase after which the program is closed for inactivity (integer months).
  posting_business_days: Business days (Monday-Friday, excluding US federal holidays) within which a purchase posts after its transaction date (integer days).
  level3_statement_detail: Whether the statement carries line-item Level-3 detail (gallons, price per gallon, product, odometer) for every purchase (boolean).
  fet_exempt_billing_available: Whether federal excise tax exempt billing can be set up on the program for an eligible fleet (boolean).
  driver_id_prompting: Driver ID prompting available at the pump (enum not_available | optional).
  odometer_prompting: Odometer prompting at the pump (enum optional).
  tank_capacity_check_available: Whether a purchase-control profile on the program may decline fuel above the vehicle's recorded tank capacity (boolean).
  decline_alerts: Real-time decline alert channels (enum email | email_and_text | email_text_and_api).
  fraud_monitoring: Fraud monitoring level applied to purchases (enum standard | enhanced).
  reporting_package: Online reporting package (enum basic | standard | advanced).
  data_feed_access: Transaction data delivery to the fleet's systems (enum none | daily_file | api).
  dedicated_account_manager: Whether a named account manager is assigned (boolean).
  support_hours: Fleet support line hours (enum business_hours | extended_hours | all_hours).

