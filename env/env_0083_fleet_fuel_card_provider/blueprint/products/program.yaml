        map: {related_txn_id: program_txn_id, charge_date: post_date}
      - event: program:program_intl_fee
        when: {site_country: CA}
        map: {related_txn_id: program_txn_id, charge_date: post_date}
  - type: program_nonfuel_purchase
    target: program_transactions
    meaning: "A maintenance, car wash, motor oil or merchandise purchase posts to the program."
