events:
  - type: program_open
    target: fleet_programs
    mutation: create
    meaning: "A fleet applies for a card program at a chosen tier, billed through its commercial credit line."
    grain: "One row per program application."
    fields:
      program_id: "Reference of the new program."
      customer_id: "The fleet applying."
      credit_line_id: "The customer's credit line that will bill the program."
      program_number: "Program account number printed on statements and cards."
      variant_name: "Official tier name applied for."
      opened_on: "Application date."
      tier_effective_on: "Date the applied-for tier takes effect; equals the application date at opening."
    triggers: []
  - type: program_activate
    target: fleet_programs
    mutation: {transition: {from: applied, to: active}}
    meaning: "Underwriting approves the application and the program becomes usable."
    grain: "One row per program approval."
    fields:
      activated_on: "Approval date."
    triggers: []
  - type: program_decline
    target: fleet_programs
    mutation: {transition: {from: applied, to: closed}}
    meaning: "Underwriting declines the program application."
    grain: "One row per declined application."
    fields:
      closed_on: "Decline date."
      close_reason: "Always application_declined."
    triggers: []
  - type: program_suspend
    target: fleet_programs
    mutation: {transition: {from: active, to: suspended}}
    meaning: "The program is placed on hold; its cards decline while it is suspended."
    grain: "One row per suspension."
    fields: {status: "Becomes suspended."}
    triggers: []
  - type: program_reinstate
    target: fleet_programs
    mutation: {transition: {from: suspended, to: active}}
    meaning: "A suspended program is returned to active."
    grain: "One row per reinstatement."
    fields: {status: "Becomes active."}
    triggers: []
  - type: program_close
    target: fleet_programs
    mutation: {transition: {from: active, to: closed}}
    meaning: "The fleet's authorized administrator instructs closure of an active program, or the program is closed for inactivity."
    grain: "One row per closure."
    fields:
      closed_on: "Date the closure takes effect."
      close_reason: "customer_instruction or inactivity."
    triggers: []
  - type: program_close_suspended
    target: fleet_programs
    mutation: {transition: {from: suspended, to: closed}}
    meaning: "A suspended program is closed because the credit line billing it was closed."
    grain: "One row per closure."
    fields:
      closed_on: "Closure date."
      close_reason: "Always credit_line_closed."
    triggers: []
  - type: program_tier_change
    target: fleet_programs
    mutation: update
    meaning: "The program moves to another tier at a tier review or on the fleet's request."
    grain: "One row per tier change."
    fields:
      variant_name: "The new official tier name."
      prior_variant_name: "The tier held immediately before this change."
      tier_effective_on: "First day of the billing cycle following the change, on which the new tier takes effect."
    triggers: []
  - type: program_fet_status_change
    target: fleet_programs
    mutation: update
    meaning: "Federal excise tax exempt billing is set up, activated or ended on the program."
    grain: "One row per status change."
    fields:
      fet_exemption_status: "New exemption billing status."
      fet_certificate_on: "Date the fleet's signed exemption certificate was received; empty when none is on file."
    triggers: []
  - type: program_ifta_enrollment
    target: fleet_programs
    mutation: update
    meaning: "The fleet enrolls in or leaves the quarterly IFTA jurisdiction fuel report."
    grain: "One row per enrollment change."
    fields: {ifta_reporting: "true while enrolled."}
    triggers: []
  - type: program_fuel_purchase
    target: program_transactions
    meaning: "A fuel purchase (gasoline, diesel, dyed diesel or DEF) posts to the program with Level-3 data."
    grain: "One row per posted fuel purchase, identified by the merchant transaction reference."
    distinguish_by: [txn_ref]
    fields:
      program_txn_id: "Reference of the posted purchase."
      fleet_card_id: "Card used."
      txn_ref: "Merchant transaction reference printed on the statement."
      txn_date: "Date of the purchase at the site."
      txn_time: "Local time of the purchase."
      post_date: "Date the purchase posted to the program."
      merchant_name: "Site name."
      site_number: "Site number."
      site_state: "Two-letter US state or Canadian province of the site."
      site_country: "US or CA."
      network: "in_network, partner or out_of_network."
      site_service: "self_serve, full_serve or mobile_fueling."
      product_code: "Fuel product."
      gallons: "Gallons dispensed."
      unit_price: "Pump price per gallon before any discount."
      gross_amount: "Gallons times unit price."
      partner_discount_amount: "Partner-site discount; 0.00 where none applies."
      net_amount: "Gross amount less partner discount; the amount billed."
      odometer: "Odometer entered at the pump; 0 when not prompted."
      driver_prompt_number: "Driver ID entered at the pump; empty when not prompted."
      entry_method: "How the card was read."
