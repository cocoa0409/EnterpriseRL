events:
  - type: rebate_enroll
    target: rebate_plans
    mutation: create
    meaning: "A fleet enrolls in the volume rebate program on a schedule."
    grain: "One row per enrollment."
    fields:
      rebate_plan_id: "Reference of the plan."
      customer_id: "The fleet."
      variant_name: "Schedule enrolled on."
      enrolled_on: "Enrollment date."
      payout_method: "statement_credit at enrollment."
    triggers: []
  - type: rebate_activate
    target: rebate_plans
    mutation: {transition: {from: pending, to: active}}
    meaning: "The plan starts earning."
    grain: "One row per activation."
    fields: {activated_on: "First day of the month after acceptance."}
    triggers: []
  - type: rebate_decline
    target: rebate_plans
    mutation: {transition: {from: pending, to: ended}}
    meaning: "The enrollment is not accepted."
    grain: "One row per declined enrollment."
    fields:
      ended_on: "Decline date."
      end_reason: "Always not_accepted."
    triggers: []
  - type: rebate_suspend
    target: rebate_plans
    mutation: {transition: {from: active, to: suspended}}
    meaning: "Earning is suspended with the credit line."
    grain: "One row per suspension."
    fields: {status: "Becomes suspended."}
    triggers: []
  - type: rebate_resume
    target: rebate_plans
    mutation: {transition: {from: suspended, to: active}}
    meaning: "Earning resumes with the credit line."
    grain: "One row per resumption."
    fields: {status: "Becomes active."}
    triggers: []
  - type: rebate_end
    target: rebate_plans
    mutation: {transition: {from: active, to: ended}}
    meaning: "The fleet's administrator ends the rebate agreement."
    grain: "One row per ending."
    fields:
      ended_on: "Effective end date: the last day of the month of the instruction."
      end_reason: "Always customer_instruction."
    triggers: []
  - type: rebate_end_suspended
    target: rebate_plans
    mutation: {transition: {from: suspended, to: ended}}
    meaning: "The plan ends because the credit line closed."
    grain: "One row per ending."
    fields:
      ended_on: "Closure date of the credit line."
      end_reason: "Always credit_line_closed."
    triggers: []
  - type: rebate_schedule_change
    target: rebate_plans
    mutation: update
    meaning: "The plan moves to another schedule at the annual review or on an upgrade request."
    grain: "One row per schedule change."
    fields:
      variant_name: "New schedule."
      prior_variant_name: "Schedule held before."
      schedule_effective_on: "First day of the month the new schedule takes effect."
    triggers: []
  - type: rebate_payout_change
    target: rebate_plans
    mutation: update
    meaning: "The fleet chooses statement credit or ACH payout."
    grain: "One row per change."
    fields: {payout_method: "statement_credit or ach."}
    triggers: []
  - type: rebate_accrual
    target: rebate_entries
    meaning: "The rebate earned for one calendar month."
    grain: "One row per plan per calendar month the plan was active or suspended on any day."
    distinguish_by: [period_start]
    fields:
      rebate_entry_id: "Reference of the accrual."
      rebate_plan_id: "The plan."
      entry_date: "Posting date (accrual_posting_day of the following month)."
      period_start: "First day of the month."
      period_end: "Last day of the month."
      qualifying_gallons: "Qualifying gallons of the month across all programs."
      diesel_gallons: "Qualifying diesel gallons within them."
      rate_cpg: "Ladder rate applied (whole-volume rate, or the blended rate of a marginal ladder rounded to rate_precision); 0.000 when the month is below the minimum."
      amount: "Rebate earned, after the cap; 0.00 when below the minimum or suspended."
    account: rebate_accrued
    direction: in
    triggers: []
  - type: rebate_adjustment
    target: rebate_entries
    meaning: "An upward correction to an earlier month's accrual found too low."
    grain: "One row per corrected accrual."
    distinguish_by: [original_entry_id]
    fields:
      rebate_entry_id: "Reference of the adjustment."
      original_entry_id: "The accrual corrected."
      entry_date: "Correction date."
      amount: "Amount added (positive)."
    account: rebate_accrued
    direction: in
    triggers: []
  - type: rebate_reversal
    target: rebate_entries
    meaning: "A downward correction to an earlier month's accrual found too high."
    grain: "One row per corrected accrual."
    distinguish_by: [original_entry_id]
    fields:
      rebate_entry_id: "Reference of the reversal."
      original_entry_id: "The accrual corrected."
      entry_date: "Correction date."
      amount: "Amount taken back (positive)."
    account: rebate_accrued
    direction: out
    triggers: []
  - type: rebate_forfeit
    target: rebate_entries
    meaning: "Accrued rebate is forfeited."
    grain: "One row per forfeited accrual or forfeited balance."
    distinguish_by: [entry_date, forfeit_reason]
    fields:
      rebate_entry_id: "Reference of the forfeiture."
      original_entry_id: "The accrual forfeited (late_payment); empty for a balance forfeiture."
      entry_date: "Forfeiture date."
      amount: "Amount forfeited (positive)."
      forfeit_reason: "late_payment, carry_forward_expired or plan_ended."
    account: rebate_accrued
    direction: out
    triggers: []
  - type: rebate_credit
    target: rebate_entries
    meaning: "Settled rebate is credited on a credit line statement."
    grain: "One row per settlement period credited."
    distinguish_by: [period_start]
    fields:
      rebate_entry_id: "Reference of the credit."
      entry_date: "Statement date of the statement credited."
      period_start: "First day of the settlement period."
      period_end: "Last day of the settlement period."
      statement_id: "Statement the credit is applied to."
      amount: "Amount credited (positive)."
    account: rebate_accrued
    direction: out
    triggers: []
  - type: rebate_ach_payout
    target: rebate_entries
    meaning: "Settled rebate is paid by ACH to the fleet's bank."
    grain: "One row per settlement period paid."
    distinguish_by: [period_start]
    fields:
      rebate_entry_id: "Reference of the payout."
      entry_date: "Payout date."
      period_start: "First day of the settlement period."
      period_end: "Last day of the settlement period."
      amount: "Amount paid (positive)."
    account: rebate_accrued
    direction: out
    triggers: []

measures:
  - id: rebate_msr_qualifying_gallons
    window: "One calendar month by purchase post_date, across every program the customer holds."
    measure: "Sum of gallons of program_fuel_purchase rows whose product_code is in eligible_products and which no exclusion of rebate_evt_qualifying removes, less the gallons of program_txn_reversal rows and of dispute credits on full-purchase cases posted in the month against such purchases."
  - id: rebate_msr_review_avg_gallons
    window: "The retier_lookback_months (or upgrade_request_lookback_months) full calendar months before the review month."
    measure: "rebate_msr_qualifying_gallons summed over those months divided by the number of months counted (suspended months left out where suspended_months_count_toward_review is false)."
  - id: rebate_msr_late_statements_in_month
    window: "One calendar month."
    measure: "Count of credit_statements whose due_date plus the credit line's late_fee_grace_days falls in the month and whose past-due amount through that day was above 0.00."
  - id: rebate_msr_periods_carried
    window: "Consecutive settlement periods ending with the current one."
    measure: "Number of settlement periods in a row at whose end accrued_balance was above 0.00 and below min_credit_usd."

policies:
  - id: rebate_agg_multi_holding
    subject: [rebate_enroll]
    rule: "A customer holds at most one rebate plan in status pending, active or suspended; the one plan earns on the gallons of every program the customer holds. A second enrollment while one is held is not opened."
    eligibility: []
    params: {max_per_customer: 1}
  - id: rebate_agg_account_basis
    subject: [rebate_accrual, rebate_enroll, rebate_schedule_change]
    rule: "Volume rebates are figured once per customer per calendar month on qualifying gallons billed across all of the customer's programs combined (all_programs_combined), never per program and never twice on the same gallon. No stacking: a gallon that received a partner-site discount at posting earns that discount and no volume rebate (exclude_partner_discounted, partner_gallons_rebate_note); no other discount, credit or tier benefit of any program changes the rebate rate or the qualifying gallons except as this charter states. A federal excise tax credit on a purchase does not change its gallons or its rebate (government_fleets_eligible). This basis binds every program, card and dispute rule that touches gallons."
    eligibility: []
    params: {all_programs_combined: =all_programs_combined, exclude_partner_discounted: =exclude_partner_discounted, partner_gallons_rebate_note: =partner_gallons_rebate_note, government_fleets_eligible: =government_fleets_eligible}
  - id: rebate_evt_qualifying
    subject: [rebate_accrual]
    rule: "Qualifying gallons for a month (rebate_msr_qualifying_gallons) are the gallons of fuel purchases posted in the month whose product_code is in eligible_products, leaving out gallons that received a partner-site discount, gallons at out_of_network sites where exclude_out_of_network is true, gallons at Canadian sites where exclude_canadian is true, gallons delivered by mobile fueling where mobile_fueling_qualifies is false, and dyed diesel and DEF (dyed_diesel_qualifies, def_qualifies). Gallons taken back by a merchant credit, or by a dispute credit on a case that credits the whole purchase, are removed in the month the credit posts where credited_purchases_excluded is true. diesel_gallons is the qualifying gallons whose product_code is diesel."
    eligibility: []
    params: {eligible_products: =eligible_products, exclude_out_of_network: =exclude_out_of_network, exclude_canadian: =exclude_canadian, mobile_fueling_qualifies: =mobile_fueling_qualifies, dyed_diesel_qualifies: =dyed_diesel_qualifies, def_qualifies: =def_qualifies, credited_purchases_excluded: =credited_purchases_excluded, period_definition: =period_definition}
    measures: [rebate_msr_qualifying_gallons]
  - id: rebate_evt_accrual
    subject: [rebate_accrual]
    rule: "On accrual_posting_day of the following month one accrual is posted for each month in which the plan was active or suspended on any day, at the schedule in effect on the month's last day. A month whose qualifying gallons are below min_qualifying_gallons_per_month, or whose last day found the plan suspended where suspended_line_forfeits is true, records rate_cpg 0.000 and amount 0.00. Otherwise, under whole_volume every qualifying gallon earns the cpg of the cpg_ladder band containing the month's qualifying gallons (both ends inclusive; a null to_gallons has no upper bound); under marginal the gallons inside each band earn that band's cpg. Each qualifying diesel gallon earns diesel_bonus_cpg on top. The amount is the base rebate plus the diesel bonus, rounded half up to the cent, and then limited to rebate_cap_per_month_usd (the cap applies to the total where cap_applies_before_bonus is false)."
    eligibility: []
    params:
      per_tier:
        Meridian Rebate Schedule A: {cpg_ladder: =cpg_ladder, ladder_method: =ladder_method, diesel_bonus_cpg: =diesel_bonus_cpg, min_qualifying_gallons_per_month: =min_qualifying_gallons_per_month, rebate_cap_per_month_usd: =rebate_cap_per_month_usd}
        Meridian Rebate Schedule B: {cpg_ladder: =cpg_ladder, ladder_method: =ladder_method, diesel_bonus_cpg: =diesel_bonus_cpg, min_qualifying_gallons_per_month: =min_qualifying_gallons_per_month, rebate_cap_per_month_usd: =rebate_cap_per_month_usd}
        Meridian Rebate Schedule C: {cpg_ladder: =cpg_ladder, ladder_method: =ladder_method, diesel_bonus_cpg: =diesel_bonus_cpg, min_qualifying_gallons_per_month: =min_qualifying_gallons_per_month, rebate_cap_per_month_usd: =rebate_cap_per_month_usd}
        Meridian Rebate Schedule D: {cpg_ladder: =cpg_ladder, ladder_method: =ladder_method, diesel_bonus_cpg: =diesel_bonus_cpg, min_qualifying_gallons_per_month: =min_qualifying_gallons_per_month, rebate_cap_per_month_usd: =rebate_cap_per_month_usd}
        Meridian Rebate Schedule E: {cpg_ladder: =cpg_ladder, ladder_method: =ladder_method, diesel_bonus_cpg: =diesel_bonus_cpg, min_qualifying_gallons_per_month: =min_qualifying_gallons_per_month, rebate_cap_per_month_usd: =rebate_cap_per_month_usd}
        Meridian Rebate Schedule F: {cpg_ladder: =cpg_ladder, ladder_method: =ladder_method, diesel_bonus_cpg: =diesel_bonus_cpg, min_qualifying_gallons_per_month: =min_qualifying_gallons_per_month, rebate_cap_per_month_usd: =rebate_cap_per_month_usd}
    formula:
      amount: "min(round(qualifying_gallons * rate_cpg + diesel_gallons * diesel_bonus_cpg, 2), rebate_cap_per_month_usd)"
    measures: [rebate_msr_qualifying_gallons]
  - id: rebate_evt_forfeit
    subject: [rebate_forfeit]
    rule: "A month's accrual is reduced by late_payment_forfeit_pct percent of its amount, rounded half up to the cent, when rebate_msr_late_statements_in_month for that month is 1 or more (on_time_definition); the forfeiture posts on the accrual's own entry_date and names it. A month with no late statement forfeits nothing. A settled balance carried forward for more than carry_forward_max_periods periods is forfeited (carry_forward_expired). On the end of the plan, the unpaid accrued balance is forfeited where closure_forfeits_accrued is true, or where the end falls inside plan_term_months and early_exit_forfeits_accrued is true (plan_ended); otherwise it is settled in the next settlement."
    eligibility: []
    params: {late_payment_forfeit_pct: =late_payment_forfeit_pct, carry_forward_max_periods: =carry_forward_max_periods, closure_forfeits_accrued: =closure_forfeits_accrued, early_exit_forfeits_accrued: =early_exit_forfeits_accrued, plan_term_months: =plan_term_months, on_time_definition: =on_time_definition, forfeiture_notice: =forfeiture_notice, reinstatement_after_forfeit: =reinstatement_after_forfeit}
    measures: [rebate_msr_late_statements_in_month, rebate_msr_periods_carried]
  - id: rebate_evt_settlement
    subject: [rebate_credit, rebate_ach_payout, rebate_payout_change]
    rule: "Rebate settles per settlement_frequency period (a calendar month, or a calendar quarter). The settled amount for a period is the unsettled rebate_accrued movements (accruals, forfeitures, adjustments and reversals) for months ending on or before the period's last day. It is credited on the first credit line statement dated on or after the day credit_lag_days calendar days after the period ends, with statement_id naming that statement and entry_date its statement date. Where ach_payout_available is true and payout_method is ach, a settled amount at or above ach_payout_min_usd is paid by ACH within ach_payout_days business days of that day instead. A settled amount below min_credit_usd is not credited and carries forward to the next period. rebate_statement_detail sets what the statement shows; amounts round half up to the cent (rebate_rounding) and rates carry rate_precision decimals."
    eligibility: []
    params: {settlement_frequency: =settlement_frequency, credit_lag_days: =credit_lag_days, min_credit_usd: =min_credit_usd, ach_payout_available: =ach_payout_available, ach_payout_min_usd: =ach_payout_min_usd, ach_payout_days: =ach_payout_days, rebate_statement_detail: =rebate_statement_detail, rebate_rounding: =rebate_rounding, rate_precision: =rate_precision, accrual_posting_day: =accrual_posting_day}
  - id: rebate_evt_correction
    subject: [rebate_adjustment, rebate_reversal]
    rule: "An accrual found wrong under this charter within adjustment_window_months months after its period is corrected by the difference: an upward correction (rebate_adjustment) or a downward one (rebate_reversal), naming the accrual. An accrual is corrected once for each error found; a correct accrual is never adjusted as a courtesy."
    eligibility: []
    params: {adjustment_window_months: =adjustment_window_months}
  - id: rebate_enrollment
    subject: [rebate_enroll, rebate_activate, rebate_decline]
    rule: "A rebate enrollment is taken only while the customer's credit line is in status active. The schedule is the highest one whose entry_min_avg_monthly_gallons the fleet's average billed fuel gallons over the last three full calendar months (or its projected monthly gallons when it has less history) reach. The plan activates on the first day of the next month; an enrollment that fails the gallons test is declined. enrollment_fee_usd is charged on enrollment."
    eligibility:
      - id: credit_line_active_for_rebate
        applies_to: [rebate_enroll]
        kind: state
        condition: "A rebate enrollment is taken only while the customer's credit line is in status active."
        evidence_fields: [credit_lines.status, credit_lines.credit_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[credit_lines.credit_line_id]]
          action_bindings: {credit_lines.credit_line_id: credit_line_id}
        state_contract:
          field: credit_lines.status
          allowed: [active]
    params: {entry_min_avg_monthly_gallons: =entry_min_avg_monthly_gallons, enrollment_fee_usd: =enrollment_fee_usd}
  - id: rebate_schedule_review
    subject: [rebate_schedule_change]
    rule: "Each year in annual_retier_month the plan is reviewed on rebate_msr_review_avg_gallons over retier_lookback_months: it moves up to the highest schedule whose entry_min_avg_monthly_gallons the average reaches, and moves down one schedule when the average is more than downgrade_tolerance_pct percent below its current schedule's entry gallons. Where upgrade_review_on_request is true the fleet may ask for an upgrade between reviews, tested on upgrade_request_lookback_months. A change takes effect on schedule_effective_on, the first day of the next month (schedule_change_effective), and prior_variant_name keeps the schedule held before for months already earned."
    eligibility: []
    params: {annual_retier_month: =annual_retier_month, retier_lookback_months: =retier_lookback_months, downgrade_tolerance_pct: =downgrade_tolerance_pct, upgrade_review_on_request: =upgrade_review_on_request, upgrade_request_lookback_months: =upgrade_request_lookback_months, schedule_change_effective: =schedule_change_effective, suspended_months_count_toward_review: =suspended_months_count_toward_review, minimum_test_basis: =minimum_test_basis, cap_applies_before_bonus: =cap_applies_before_bonus}
    measures: [rebate_msr_review_avg_gallons]
  - id: rebate_lifecycle
    subject: [rebate_suspend, rebate_resume, rebate_end, rebate_end_suspended]
    rule: "The plan is suspended on the day the customer's credit line is suspended and resumes on the day it is reinstated; it ends when the credit line closes. The fleet's authorized administrator may end the agreement, effective the last day of the month of the instruction, and only the administrator may do so because it gives up the fleet's own accrued entitlement."
    eligibility: []
