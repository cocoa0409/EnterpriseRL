# Volume Rebate charter — Meridian Fleet Payments. A fleet enrolled on a rebate schedule earns a
# cents-per-gallon rebate on the qualifying fuel gallons billed across ALL of its card programs each
# calendar month, subject to payment-performance conditions, minimums, caps and exclusions, and has
# it credited on a later credit line statement (or paid by ACH where the schedule allows). The
# account-wide rebate basis and the no-stacking rule stated here bind every program the fleet holds.
category: rebate
display_name: Volume Rebate Program

binding:
  holding_table: rebate_plans
  event_tables: [rebate_entries]
  status_field: status
  variant_field: variant_name
  quantity_fields: {accrued_balance: rebate_accrued}

lifecycle:
  states: [pending, active, suspended, ended]
  transitions:
    - {from: pending, to: active, by: system, means: "The enrollment takes effect on the first day of the calendar month after it is accepted."}
    - {from: pending, to: ended, by: system, means: "The enrollment is not accepted because the fleet does not meet the schedule's entry gallons or its credit line is not active."}
    - {from: active, to: suspended, by: system, means: "Rebate earning is suspended while the fleet's credit line is suspended."}
    - {from: suspended, to: active, by: system, means: "Earning resumes when the credit line is reinstated."}
    - {from: active, to: ended, by: user, means: "The fleet's authorized administrator ends the rebate agreement."}
    - {from: suspended, to: ended, by: system, means: "The plan ends because the credit line closed."}

accounts:
  - key: rebate_accrued
    unit: USD
    meaning: "Rebate earned and not yet paid: monthly accruals and upward adjustments book in; statement credits, ACH payouts, forfeitures and accrual reversals book out. accrued_balance on the plan is its running sum."

parameter_schema:
  entry_min_avg_monthly_gallons: Average billed fuel gallons per month over the look-back needed to enroll on or move to the schedule (integer gallons).
  cpg_ladder: 'Rebate rate by the month''s qualifying gallons: list of {from_gallons, to_gallons (null = no upper bound), cpg in USD per gallon}.'
  ladder_method: 'How the ladder applies (enum whole_volume: every qualifying gallon at the rate of the band the month''s total falls in | marginal: each band''s gallons at that band''s rate).'
  diesel_bonus_cpg: Additional rebate per qualifying diesel gallon (USD per gallon).
  min_qualifying_gallons_per_month: Qualifying gallons in a month below which the month earns no rebate (integer gallons).
  rebate_cap_per_month_usd: Most rebate one month can earn (USD).
  settlement_frequency: 'How often accrued rebate is settled (enum monthly | quarterly: calendar quarters).'
  min_credit_usd: Accrued balance below which nothing is settled and the balance carries forward (USD).
  carry_forward_max_periods: Settlement periods a balance below min_credit_usd may carry forward before it is forfeited (integer).
  credit_lag_days: Calendar days after a settlement period ends before its rebate can be credited; it is credited on the first statement dated on or after that day (integer days).
  late_payment_forfeit_pct: Percent of a month's accrual forfeited when a statement due in that month was not paid on time (percent).
  exclude_out_of_network: Whether gallons bought at out_of_network sites are excluded from qualifying gallons (boolean).
  exclude_partner_discounted: Whether gallons that received a partner-site discount are excluded from qualifying gallons (boolean; the no-stacking rule).
  exclude_canadian: Whether gallons bought at Canadian sites are excluded (boolean).
  eligible_products: Fuel products whose gallons can qualify (list of product codes).
  dyed_diesel_qualifies: Whether dyed diesel gallons qualify (boolean).
  def_qualifies: Whether DEF gallons qualify (boolean).
  credited_purchases_excluded: Whether gallons a merchant credit or a dispute credit takes back are removed from qualifying gallons in the month the credit posts (boolean).
  suspended_line_forfeits: Whether a month in which the credit line was suspended on its last day earns nothing (boolean).
  closure_forfeits_accrued: Whether an unpaid accrued balance is forfeited when the plan ends (boolean).
  annual_retier_month: Calendar month in which the schedule is reviewed each year (integer 1-12).
  retier_lookback_months: Full calendar months averaged at the annual review (integer months).
  downgrade_tolerance_pct: Percent below entry_min_avg_monthly_gallons the review average may fall before the plan moves down a schedule (percent).
  plan_term_months: Term of the rebate agreement from activation, renewing automatically (integer months).
  early_exit_forfeits_accrued: Whether ending the agreement inside its term forfeits the unpaid accrued balance (boolean).
  enrollment_fee_usd: Fee to enroll (USD).
  ach_payout_available: Whether settlement may be paid by ACH to the fleet's bank instead of a statement credit (boolean).
  ach_payout_min_usd: Settled amount at or above which an ACH payout is made where chosen; smaller settlements are credited on the statement (USD; 0.00 = no ACH).
  period_definition: Earning period (enum calendar_month, by purchase post_date).
  accrual_posting_day: Day of the following month on which a month's accrual is posted (integer day of month).
  on_time_definition: 'What paid on time means for forfeiture (enum statement_paid_by_due_plus_grace: the credit line''s past-due amount for the statement, counted through due date plus grace days, is 0.00).'
  rate_precision: Decimals of the cpg rate (integer).
  rebate_rounding: Rounding of a rebate amount (enum half_up_cent).
  all_programs_combined: Whether gallons on all of the customer's programs are combined (boolean).
  government_fleets_eligible: Whether federal excise tax exempt fleets may enroll (boolean; rebate is figured on gallons, not on the tax).
  schedule_change_effective: When a schedule change takes effect (enum first_day_of_next_month).
  upgrade_review_on_request: Whether the fleet may ask for an upgrade review between annual reviews (boolean).
  upgrade_request_lookback_months: Full calendar months averaged for an upgrade request (integer months).
  rebate_statement_detail: Whether the statement shows qualifying gallons and rate (boolean).
  forfeiture_notice: Whether the fleet is told in writing of a forfeiture (boolean).
  mobile_fueling_qualifies: Whether gallons delivered by a mobile fueling vendor (site_service mobile_fueling) qualify (boolean).
  cap_applies_before_bonus: Whether the monthly cap applies to the base rebate before the diesel bonus is added (boolean; false = cap applies to the total).
  minimum_test_basis: Gallons tested against min_qualifying_gallons_per_month (enum qualifying_gallons).
  reinstatement_after_forfeit: When earning resumes after a forfeited month (enum next_month).
  suspended_months_count_toward_review: Whether months the plan was suspended count in the review average (boolean).
  partner_gallons_rebate_note: 'How partner-discounted gallons are treated (enum discount_only: they earn the partner discount and no rebate).'
  ach_payout_days: Business days after the settlement date within which an ACH payout is sent (integer).
  adjustment_window_months: Months after a period during which an accrual found wrong is corrected (integer months).

