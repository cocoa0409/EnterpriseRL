name: global_container_shipping_line
company: Aurelia Hanse Line

background: |
  Aurelia Hanse Line (AHL) is a Hamburg-headquartered ocean container carrier founded in 1968, operating 214 owned and chartered vessels with a combined capacity of about 2.1 million TEU on 64 liner services that call 312 ports in 118 countries.
  Its customer service desk works in the measured, documentation-minded tone of a liner operator, serving shippers, consignees and freight forwarders who call about cargo already in the line's system.
  Cargo owners and forwarders with steady volume hold Service Contracts per trade lane for a fixed term, tiered as AHL Starter Service Contract, AHL Standard Service Contract, AHL Regional Account Contract, AHL Key Account Contract, AHL Global Account Contract and AHL Strategic Partner Contract; each contract keeps a running account of the volume credited from departed bookings, of assessed shortfalls and of accrued volume rebates.
  Every shipment starts as a container booking under one of six booking products, AHL Spot Saver, AHL Spot Flex, AHL Contract Booking, AHL Contract Priority, AHL Guaranteed Loading and AHL Premium Express, and each booking carries its own charge account from request through departure.
  Each booking is documented by one transport document, issued as an AHL Sea Waybill, AHL Electronic Bill of Lading, AHL Straight Bill of Lading, AHL Negotiable Bill of Lading, AHL Combined Transport Bill of Lading or AHL Switch Bill of Lading, whose record tracks the originals still in circulation and the documentation fees due.
  Every container on a booking runs an import or export free-time clock under one of six demurrage and detention products, AHL Tariff Free Time, AHL Free Time Extension 3, AHL Free Time Extension 7, AHL Combined Free Time 14, AHL Combined Free Time 21 and AHL Contract Free Time 30, and the record accumulates invoices, payments, waivers and dispute credits.
  Perishable cargo moves under a per-container reefer service, AHL Reefer Standard, AHL Reefer Monitored, AHL Reefer Cold Treatment, AHL Reefer Controlled Atmosphere, AHL Reefer Pharma GDP or AHL Reefer Superfreezer, whose account collects inspection, plug-in and special-service charges and logs every temperature excursion.
  Hazardous cargo needs a dangerous-goods acceptance per UN entry per booking, granted in the categories AHL DG Limited Quantity, AHL DG Class 9 Standard, AHL DG Flammables and Corrosives, AHL DG Toxics and Oxidizers, AHL DG Compressed Gases and AHL DG Special Approval, each with its own surcharge and fee account.
  Every shipment also carries a cargo liability cover, either the statutory AHL Standard Carrier Liability or AHL Declared Value Liability, or one of the purchasable CargoCare products AHL CargoCare Essential, AHL CargoCare Plus, AHL CargoCare Premium and AHL CargoCare Total, against which premiums are booked and cargo claims are lodged and settled.
  Callers are logistics managers at retailers, manufacturers, agricultural exporters and chemical producers, and operations staff at freight forwarders and licensed NVOCCs who book on behalf of many cargo owners.
  A typical mid-sized customer holds one or two lane contracts, a few dozen live bookings with their transport documents, several import containers inside or beyond free time, and perhaps a reefer or hazardous shipment on the water.
  Their history usually includes vessel rolls, cancelled or amended bookings, corrected bills of lading, telex releases, demurrage and detention invoices they have paid or questioned, and the occasional damaged or short-landed container.
  The line's records are the single account of these contracts, shipments, documents and charges, and every call is resolved against them.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: booking_changes_desk
    claim:
      categories: [booking]
      event_types: [booking_confirmed, booking_declined, booking_cancelled, booking_cancellation_fee_charged, booking_amended, booking_amendment_recorded, booking_amendment_fee_charged, booking_roll_recorded, booking_vessel_changed, booking_roll_compensation_credited, booking_documents_received, booking_late_document_fee_charged, booking_equipment_released, booking_charge_waived, booking_payment_received]
    summary: >
      Shippers, consignees and forwarders call about container bookings they already hold under one of the six booking products, spot or
      contract-rated, at every stage from an unanswered request through confirmation, empty release and gate-in, and they want to cancel,
      amend quantities, equipment or destination, move to another sailing, understand a roll, get late documents accepted, pay, or have a fee
      taken back. The setting varies along the tier ladder, the booking's status and cut-offs, whether a service contract, a dangerous-goods
      acceptance or a reefer service stands behind the booking, the customer's credit standing, and the history of rolls, amendments, late
      submissions, no-shows and earlier goodwill across the whole portfolio. The governing rules are eligibility gates on status, cut-off
      lead times and prerequisite records (booking_request_eligibility, booking_amendment, booking_equipment_and_milestones), per-tier fee
      ladders, free allowances, caps and compensation (booking_cancellation, booking_amendment, booking_rollover, booking_late_documentation),
      portfolio measures over trailing windows (booking_agg_no_show_record, booking_goodwill_waiver), and one-fee-per-object and
      once-per-reference rules (booking_no_show, booking_payment), with every figure held by those rule ids. Cancellations, amendments, rolls,
      releases, charges, credits, waivers and payments are service actions the agent performs on a verified account after deciding them from
      the records, and the customer only supplies instructions, remittance references and the exact new particulars. Requests the rules do
      not decide, such as allocating one remittance across several bookings, reducing a fee above the desk's waiver authority, or disputing
      freight rates themselves, cannot be resolved at the desk and go to a human representative.
  - name: documentation_release_desk
    claim:
      categories: [bol]
      event_types: [bol_draft_created, bol_draft_reopened, bol_issued, bol_issuance_fee_charged, bol_originals_issued, bol_particulars_corrected, bol_correction_fee_charged, bol_set_replaced, bol_originals_surrender_completed, bol_originals_surrendered, bol_originals_voided, bol_release_fee_charged, bol_cargo_released, bol_delivery_release_recorded, bol_reissue_fee_charged, bol_switch_fee_charged, bol_voided, bol_fee_waived, bol_payment_received]
    summary: >
      Documentation parties and consignees call about transport documents across the six document types, from drafts awaiting approval to
      issued sets whose originals are in circulation, surrendered at origin, lost, or needed at destination, asking for corrections, telex
      releases, releases without originals, replacement sets, switch bills, fee relief and cargo release. The situation turns on the document
      type and its status, whether the vessel has sailed, how many originals are still outstanding and in which set, whether prepaid or
      collect freight on the booking is settled, whether the caller is the documentation party or the printed consignee, whether a service
      contract exempts a fee, and how many corrections, consignee changes, switches and goodwill waivers have already been used. The rules are
      gates on status, originals, freight settlement and party identity (bol_issuance, bol_telex_release, bol_cargo_release), time windows
      counted from departure, discharge or a loss report (bol_correction, bol_cargo_release, bol_lost_original_reissue), per-type field lists,
      counts, fees and bank-guarantee percentages (bol_correction, bol_lost_original_reissue, bol_switch_bill), and one-document-per-booking
      and once-per-request rules (bol_agg_one_document_per_booking, bol_fee_waiver), with every figure held by those rule ids. The agent
      registers requests and issues, corrects, releases, voids, charges and waives on the records, while approving a draft, surrendering
      originals and signing a letter of indemnity or bank guarantee belong to the customer and are handed over as the customer's own actions.
      Situations outside the rules, such as changing the shipper without a switch, releasing cargo to a party that neither holds an original
      nor matches the printed consignee, or deciding a dispute over who owns the cargo, have no desk resolution and go to a human
      representative.
  - name: dnd_billing_desk
    claim:
      categories: [dnd]
      event_types: [dnd_free_time_extended, dnd_extension_fee_charged, dnd_invoice_issued, dnd_demurrage_invoiced, dnd_detention_invoiced, dnd_settled, dnd_dispute_credited, dnd_charge_waived, dnd_payment_received]
    summary: >
      Importers, exporters and their forwarders call about demurrage and detention on individual containers, some still inside free time and
      wanting more of it, some with clocks stopped and awaiting a final invoice, and many holding invoices they want explained, disputed,
      reduced or paid. The setting varies with the free-time product on the record and whether it runs separate or merged clocks, the
      direction of the leg, the equipment's rate class, whether the booking carries dangerous goods or sits under a qualifying service
      contract, the recorded movement dates, the invoice date relative to the day charges stopped, and the customer's overdue balance and
      goodwill history across all its containers. The rules are the clock and slab arithmetic of dnd_clock_rules and dnd_invoicing, the
      deadlines and minimums of dnd_invoicing, the purchase conditions and price differences of dnd_free_time_upgrade under
      dnd_agg_overdue_portfolio_block, the dispute windows and decidable grounds of dnd_invoice_dispute, and the percentage, cap, quota and
      window of dnd_goodwill_waiver, with every figure held by those rule ids. The agent issues invoices, sells upgrades, decides disputes on
      the grounds the records can prove, books credits, waivers and payments and settles records, while lodging a dispute is the billed
      party's own act handed over to the customer. Disputes that turn on operational facts the desk cannot see, such as a claimed carrier
      delay, a terminal closure or contested movement dates, and requests for waivers reserved to the operations department, cannot be decided
      at the desk and go to a human representative.
  - name: dangerous_goods_desk
    claim:
      categories: [dg]
      event_types: [dg_application_submitted, dg_review_started, dg_approved, dg_rejected, dg_late_declaration_fee_charged, dg_surcharge_charged, dg_declaration_amended, dg_amendment_fee_charged, dg_re_review_opened, dg_withdrawn, dg_withdrawal_fee_charged, dg_charge_waived, dg_payment_received]
    summary: >
      Chemical producers, battery and aerosol shippers and their forwarders call to get hazardous cargo accepted on a booking, to amend a
      declaration, to understand why an application stalls or was refused, to withdraw goods, or to question the fees and surcharges booked on
      an acceptance. The setting varies with the IMDG class and packing group declared and the acceptance category they fall into, the
      booking's equipment, lane, port of discharge, sailing and cut-offs, whether the booking is contract-rated, how long the customer has
      been on file, what other acceptances already sit on the booking and the sailing, whether the declaration is signed and on time, and the
      customer's misdeclaration and goodwill history. The rules are admission gates by class, equipment, lane, port, tenure and history
      (dg_application_eligibility), per-booking and per-sailing aggregation with mutual exclusion of the strictest categories
      (dg_agg_booking_mix, dg_agg_sailing_capacity), signature and cut-off gates with late fees (dg_declaration_and_review, dg_amendment), the
      additive surcharge uplifts, discount and validity of dg_surcharges, and the fee, penalty and waiver rules of dg_withdrawal,
      dg_misdeclaration and dg_goodwill_waiver, with every figure held by those rule ids. The agent registers applications, reviews,
      approves, rejects, reopens and charges on the records, while signing a declaration or its amendment and withdrawing an application are
      the shipper's own acts handed over to the customer. Goods in no acceptance category, appeals against a misdeclaration finding and
      requests to waive penalties or surcharges fall outside the desk's rules and go to a human representative.
  - name: cargo_claims_desk
    claim:
      categories: [claims]
      event_types: [claims_cover_quoted, claims_cover_bound, claims_premium_charged, claims_premium_paid, claims_cover_cancelled, claims_premium_refunded, claims_claim_lodged, claims_claim_withdrawn, claims_settlement_approved, claims_claim_rejected, claims_claim_closed, claims_settlement_paid]
    summary: >
      Cargo owners, forwarders and consignees call to put cargo protection on a shipment, to cancel it, to report damaged, wet, warm, short or
      late cargo, and to learn what a claim will pay and when. The setting varies with the liability regime or CargoCare product on the
      shipment, the cargo category and insured value, whether and when the cargo was delivered, whether the loss was apparent at delivery,
      the claimant's standing as cover holder or printed consignee, the reefer service and logged excursions behind a temperature claim, the
      carrier rolls behind a delay claim, any misdeclaration on the goods, the premium still unpaid and the settlements already made in the
      year. The rules are binding and cancellation gates (claims_cover_eligibility, claims_cover_cancellation), the premium build-up of
      claims_premium, notice windows, time bars, claimant entitlement and caps (claims_notice_and_time_bar), covered perils and exclusions
      (claims_coverage_and_exclusions), and the limitation, declared value, uplift, deductible, cap, aggregate and authority arithmetic of
      claims_settlement_calculation and claims_agg_annual_aggregate, with every figure held by those rule ids. The agent quotes, binds,
      cancels, charges and refunds covers and approves, rejects, closes and pays claims on the records, while lodging or withdrawing a claim is
      the claimant's own act handed over to the customer. Settlements above the desk's authority, disputes over the survey finding, recovery
      against third parties and general average matters are not decided at the desk and go to a human representative.
