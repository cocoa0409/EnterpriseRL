category: bol
display_name: Bills of Lading and Transport Documents

# Functional closure (real capabilities of a liner documentation desk, each carried below):
#   draft from shipping instructions, approval or deemed approval, pre-issuance rounds (bol_draft_created, bol_draft_approved, bol_draft_reopened; bol_draft_and_approval)
#   choice of document type and its admission (bol_draft_created; bol_document_type_eligibility, bol_agg_one_document_per_booking)
#   issuance, shipped-on-board basis, prepaid freight hold, originals issued (bol_issued, bol_issuance_fee_charged, bol_originals_issued; bol_issuance)
#   corrections before and after issuance / departure, consignee changes, originals return (bol_particulars_corrected, bol_correction_fee_charged; bol_correction)
#   telex release against surrender of the full set at origin (bol_originals_surrender_completed, bol_originals_surrendered, bol_release_fee_charged; bol_telex_release)
#   destination release against original, waybill identification, eBL surrender or letter of indemnity (bol_cargo_released, bol_delivery_release_recorded; bol_cargo_release)
#   lost original reissue with bank guarantee (bol_set_replaced, bol_originals_voided, bol_reissue_fee_charged; bol_lost_original_reissue)
#   switch bill issuance (bol_voided, bol_switch_fee_charged; bol_switch_bill)
#   voiding on booking cancellation, accomplishment (bol_voided, bol_accomplished; bol_voiding_and_accomplishment)
#   payments and goodwill waivers (bol_payment_received, bol_fee_waived; bol_payment, bol_fee_waiver)

binding:
  holding_table: bills_of_lading
  event_tables: [bol_ledger]
  intake_tables: [bol_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {charges_due_usd: documentation_charges, originals_outstanding: originals_outstanding}

lifecycle:
  states: [draft, approved, issued, surrendered, released, accomplished, voided]
  transitions:
    - {from: draft, to: approved, by: user, means: The shipper approves the draft document as the text to be issued.}
    - {from: draft, to: approved, by: system, means: The draft is deemed approved when the shipper has not answered within the tier's deemed approval hours.}
    - {from: approved, to: draft, by: agent, means: An approved draft is reopened to apply a pre-issuance correction.}
    - {from: draft, to: voided, by: agent, means: The draft is voided because the booking was cancelled or the shipping instructions were withdrawn.}
    - {from: approved, to: voided, by: agent, means: The approved draft is voided because the booking was cancelled.}
    - {from: approved, to: issued, by: agent, means: The document is issued and any originals are released to the shipper or onto the eBL platform.}
    - {from: issued, to: surrendered, by: user, means: The shipper surrenders the full set of originals at the origin office.}
    - {from: issued, to: released, by: agent, means: Cargo is released at destination against an original, waybill identification, eBL surrender or a letter of indemnity.}
    - {from: surrendered, to: released, by: agent, means: Cargo is released at destination on the telex release.}
    - {from: surrendered, to: voided, by: agent, means: The surrendered first document is voided because a switch bill replaces it.}
    - {from: released, to: accomplished, by: system, means: The cargo is delivered and the document is accomplished.}

accounts:
  - key: documentation_charges
    unit: USD
    meaning: Documentation fees owed on one transport document — issuance, correction, release, switch and reissue fees in, payments and waivers out.
  - key: originals_outstanding
    unit: original documents
    meaning: Original documents of title issued and still in circulation — originals issued in, originals surrendered to the line or declared void out.

parameter_schema:
  originals_issued_count: Originals issued per set; 0 for a waybill, 1 for the single electronic record of an eBL (integer originals).
  negotiable: Whether the document is a negotiable document of title transferable by endorsement (boolean).
  to_order_consignee_allowed: Whether the consignee may be printed TO ORDER or TO ORDER OF a bank (boolean).
  eligible_customer_roles: Customer roles that may hold the document type (list of customers.customer_role values).
  ebl_platform_enrollment_required: Whether the documentation party must be enrolled on the eBL platform (boolean).
  inland_place_of_receipt_allowed: Whether the document may name an inland place of receipt and place of delivery different from the ports (boolean).
  freight_collect_allowed: Whether the document may be issued for a booking with collect freight (boolean).
  issuance_fee_usd: Fee per set issued (USD per set).
  draft_issue_hours_after_si: Service standard for sending the draft after shipping instructions are received (integer hours).
  deemed_approval_hours: Hours after the draft is sent after which an unanswered draft is deemed approved (integer hours).
  pre_issuance_draft_rounds_limit: Maximum pre-issuance corrections (draft reopenings) per document (integer rounds).
  received_for_shipment_allowed: Whether the document may be issued once the cargo is gated in, before loading (boolean).
  issuance_hours_after_departure_max: Service standard by which a shipped-on-board document is issued after departure (integer hours).
  prepaid_freight_settled_before_issuance: Whether prepaid freight must be settled on the booking before issuance (boolean).
  credit_customer_issuance_without_payment: Whether a credit_approved customer is exempt from the prepaid settlement requirement (boolean).
  free_corrections_after_issuance: Corrections after issuance without a correction fee (integer).
  correction_fee_after_issuance_usd: Fee per correction after issuance and before departure (USD per correction).
  correction_fee_after_departure_usd: Fee per correction after the vessel departed, covering the manifest amendment (USD per correction).
  consignee_change_fee_usd: Fee per change of the named consignee after issuance, in place of the correction fee (USD per change).
  max_corrections_after_issuance: Maximum corrections after issuance per document (integer).
  correction_window_days_after_departure: Latest a correction may be requested, in calendar days after departure (integer days).
  originals_return_required_for_correction: Whether all outstanding originals must be returned before an issued document is corrected (boolean).
  originals_return_deadline_days: Calendar days from a correction request within which required originals must be returned, else the request lapses (integer days).
  correctable_fields_after_issuance: Particulars that may be corrected after issuance and before departure (list of bol_service_requests.corrected_field values).
  correctable_fields_after_departure: Particulars that may be corrected after departure (list of bol_service_requests.corrected_field values).
  max_consignee_changes_after_issuance: Maximum changes of the named consignee after issuance (integer).
  weight_correction_tolerance_pct: Largest change of gross weight accepted after departure, as percent of the printed weight (integer percent).
  standard_release_method: Normal basis of cargo release at destination (bol_ledger.release_method value).
  originals_required_for_destination_release: Originals that must be surrendered at destination for a normal release (integer originals).
  endorsement_required_for_release: Whether the surrendered original or eBL must carry an unbroken endorsement chain to the releasing party (boolean).
  telex_release_available: Whether release on surrender of the full set at origin is offered (boolean).
  telex_release_fee_usd: Fee per telex release (USD per release).
  telex_fee_waiver_min_contract_rank: Lowest service contract tier rank whose holder is not charged the telex release fee; 0 means no waiver (integer rank).
  loi_release_available: Whether cargo may be released without originals against a letter of indemnity (boolean).
  loi_signatory: Who must sign the letter of indemnity — not_applicable, consignee, or consignee_and_bank (enum string).
  loi_bank_guarantee_pct_of_cargo_value: Bank guarantee backing the letter of indemnity, as percent of declared_cargo_value_usd; 0 when no bank guarantee is required (integer percent).
  loi_release_fee_usd: Fee per release against a letter of indemnity (USD per release).
  loi_release_earliest_days_after_discharge: Earliest a release against a letter of indemnity may be granted, in calendar days after discharge (integer days).
  lost_original_reissue_available: Whether a replacement set may be issued for lost originals (boolean).
  reissue_waiting_days_after_loss_report: Calendar days after the loss report before a replacement set may be issued (integer days).
  reissue_bank_guarantee_pct_of_cargo_value: Bank guarantee required for a replacement set, as percent of declared_cargo_value_usd (integer percent).
  reissue_fee_usd: Fee per replacement set (USD per set).
  switch_bill_available: Whether a switch bill may be issued in exchange for this document (boolean).
  max_switches_per_shipment: Maximum switch bills issued for one booking (integer).
  switch_bill_fee_usd: Fee per switch bill, charged on the document exchanged (USD per switch).
  goodwill_waiver_authority_usd: Largest single fee row the desk may waive as goodwill (USD per fee row).
  goodwill_waivers_per_365d: Goodwill documentation waivers per customer per trailing 365 days (integer).
  waiver_request_window_days: Calendar days after a fee was booked within which a goodwill waiver may be requested (integer days).

