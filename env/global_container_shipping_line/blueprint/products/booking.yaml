events:
  # ---- holding (bookings) ----
  - type: booking_requested
    target: bookings
    mutation: create
    meaning: A customer places a booking request for containers on a named sailing.
    grain: One row per booking request.
    fields: {booking_id: new booking reference, customer_id: requesting customer, variant_name: booking product requested, booking_number: booking number (equals booking_id when created at the desk), contract_id: service contract referenced or empty for spot, trade_lane: lane of the port pair, pol_code: port of loading, pod_code: port of discharge, vessel_voyage: requested sailing, equipment_type: equipment requested, container_count: containers requested, cargo_type: cargo handling category, freight_terms: prepaid or collect, channel: channel the request arrived through, requested_date: request date, etd_date: scheduled departure of the requested sailing, cargo_cutoff: cargo cut-off of the requested sailing, si_cutoff: SI cut-off, vgm_cutoff: VGM cut-off}
    triggers: []
  - type: booking_confirmed
    target: bookings
    mutation: {transition: {from: requested, to: confirmed}}
    meaning: Space is confirmed on the requested sailing.
    grain: One row per booking confirmation.
    fields: {status: becomes confirmed, confirmed_date: confirmation date, container_count: containers confirmed, equipment_type: equipment confirmed, vessel_voyage: confirmed sailing}
    triggers:
      - event: booking:booking_freight_charged
        map: {booking_id: booking_id, customer_id: customer_id, charge_code: ocean_freight, container_count: container_count, equipment_type: equipment_type, vessel_voyage: vessel_voyage}
  - type: booking_declined
    target: bookings
    mutation: {transition: {from: requested, to: cancelled}}
    meaning: A booking request is declined or withdrawn before confirmation.
    grain: One row per declined request.
    fields: {status: becomes cancelled, cancelled_date: decline date}
    triggers: []
  - type: booking_cancelled
    target: bookings
    mutation: {transition: [{from: confirmed, to: cancelled}, {from: equipment_released, to: cancelled}, {from: gated_in, to: cancelled}]}
    meaning: A confirmed booking is cancelled on the customer's instruction.
    grain: One row per booking cancellation.
    fields: {status: becomes cancelled, cancelled_date: cancellation date, booking_id: booking cancelled}
    triggers:
      - event: bol:bol_voided
        map: {booking_id: booking_id}
  - type: booking_marked_no_show
    target: bookings
    mutation: {transition: [{from: confirmed, to: cancelled}, {from: equipment_released, to: cancelled}]}
    meaning: The allocated vessel departed while nothing had been gated in, and the system closes the booking as a no-show.
    grain: One row per no-show closure.
    fields: {status: becomes cancelled, cancelled_date: departure date of the missed sailing, container_count: containers booked, equipment_type: equipment booked, vessel_voyage: sailing missed}
    triggers:
      - event: booking:booking_no_show_fee_charged
        map: {booking_id: booking_id, customer_id: customer_id, charge_code: no_show_fee, container_count: container_count, equipment_type: equipment_type, vessel_voyage: vessel_voyage}
  - type: booking_equipment_released
    target: bookings
    mutation: {transition: {from: confirmed, to: equipment_released}}
    meaning: The empty release order is issued and the haulier may pick up empties.
    grain: One row per booking release.
    fields: {status: becomes equipment_released, booking_id: booking released, customer_id: booking party, equipment_type: equipment released}
    triggers:
      - event: dnd:dnd_free_time_opened
        map: {booking_id: booking_id, customer_id: customer_id, equipment_type: equipment_type, direction: export}
  - type: booking_gated_in
    target: bookings
    mutation: {transition: {from: equipment_released, to: gated_in}}
    meaning: Laden containers are received at the load terminal.
    grain: One row per booking gate-in.
    fields: {status: becomes gated_in}
    triggers: []
  - type: booking_loaded
    target: bookings
    mutation: {transition: {from: gated_in, to: loaded}}
    meaning: The containers are loaded on the allocated vessel.
    grain: One row per booking loading.
    fields: {status: becomes loaded}
    triggers: []
  - type: booking_departed
    target: bookings
    mutation: {transition: {from: loaded, to: departed}}
    meaning: The carrying vessel departs the port of loading.
    grain: One row per booking departure.
    fields: {status: becomes departed, departed_date: actual departure date, booking_id: booking departed, customer_id: booking party, contract_id: service contract the booking is rated under or empty}
    triggers:
      - event: contract:contract_volume_lifted
        when: {contract_id: {not: ""}}
        map: {booking_id: booking_id, contract_id: contract_id, customer_id: customer_id}
  - type: booking_closed
    target: bookings
    mutation: {transition: {from: departed, to: closed}}
    meaning: The containers are discharged and the booking file is closed.
    grain: One row per booking closure.
    fields: {status: becomes closed}
    triggers: []
  - type: booking_amended
    target: bookings
    mutation: update
    meaning: The equipment type, container quantity, port of discharge or cargo category of a live booking is changed.
    grain: One row per accepted amendment.
    fields: {equipment_type: new equipment type, container_count: new container count, pod_code: new port of discharge, cargo_type: new cargo category}
    triggers:
      - event: booking:booking_amendment_recorded
        map: {booking_id: booking_id, customer_id: customer_id, equipment_type: equipment_type, container_count: container_count}
  - type: booking_vessel_changed
    target: bookings
    mutation: update
    meaning: The booking is moved to another sailing and its schedule fields follow.
    grain: One row per sailing change.
    fields: {booking_id: booking moved, vessel_voyage: new sailing, etd_date: new departure date, cargo_cutoff: new cargo cut-off, si_cutoff: new SI cut-off, vgm_cutoff: new VGM cut-off}
    triggers: []
  - type: booking_documents_received
    target: bookings
    mutation: update
    meaning: Shipping instructions or the verified gross mass are received for the booking.
    grain: One row per document receipt.
    fields: {si_submitted_at: moment SI received, vgm_submitted_at: moment VGM received}
    triggers: []
  # ---- ledger (booking_charges) ----
  - type: booking_freight_charged
    target: booking_charges
    meaning: Freight, a surcharge, the loading guarantee premium or the manual booking fee is charged to the booking.
    grain: One row per charge code per charging date per container quantity and equipment.
    distinguish_by: [charge_code, event_date, container_count, equipment_type]
    fields: {booking_id: booking charged, customer_id: booking party, event_date: charge date, charge_code: which freight component, amount_usd: amount charged, container_count: containers charged, equipment_type: equipment charged, vessel_voyage: sailing}
    account: booking_charges_balance
    direction: in
    triggers: []
  - type: booking_cancellation_fee_charged
    target: booking_charges
    meaning: The cancellation fee for a cancelled booking is charged.
    grain: One row per cancelled booking.
    distinguish_by: [event_date]
    fields: {booking_id: booking cancelled, customer_id: booking party, event_date: cancellation date, charge_code: cancellation_fee, amount_usd: fee after cap, container_count: containers cancelled, equipment_type: equipment cancelled}
    account: booking_charges_balance
    direction: in
    triggers: []
  - type: booking_no_show_fee_charged
    target: booking_charges
    meaning: The no-show fee for a sailing missed with nothing gated in is charged.
    grain: One row per missed sailing per booking.
    distinguish_by: [vessel_voyage]
    fields: {booking_id: booking, customer_id: booking party, event_date: departure date of the missed sailing, charge_code: no_show_fee, amount_usd: fee, container_count: containers booked, equipment_type: equipment booked, vessel_voyage: sailing missed}
    account: booking_charges_balance
    direction: in
    triggers: []
  - type: booking_late_document_fee_charged
    target: booking_charges
    meaning: A late shipping instruction or late verified gross mass is recorded, with the fee due (0.00 when inside the free allowance).
    grain: One row per late document type per sailing per booking.
    distinguish_by: [charge_code, vessel_voyage]
    fields: {booking_id: booking, customer_id: booking party, event_date: receipt date of the late document, charge_code: late_si_fee or late_vgm_fee, amount_usd: fee or 0.00, container_count: containers the fee is computed on, vessel_voyage: sailing the document was late for}
    account: booking_charges_balance
    direction: in
    triggers: []
  - type: booking_amendment_recorded
    target: booking_charges
    meaning: An accepted amendment is logged against the booking, charged or not.
    grain: One row per accepted amendment.
    distinguish_by: [amendment_type, event_date, equipment_type, container_count]
    fields: {booking_id: booking, customer_id: booking party, event_date: amendment date, charge_code: amendment_log, amount_usd: 0.00, amendment_type: kind of amendment, equipment_type: equipment after amendment, container_count: containers after amendment}
    triggers: []
  - type: booking_amendment_fee_charged
    target: booking_charges
    meaning: A chargeable amendment, change of destination or customer-caused roll is charged.
    grain: One row per chargeable amendment or customer roll.
    distinguish_by: [charge_code, amendment_type, event_date, vessel_voyage]
    fields: {booking_id: booking, customer_id: booking party, event_date: amendment or roll date, charge_code: one of amendment_fee / pod_change_fee / customer_roll_fee, amount_usd: fee, amendment_type: kind of amendment, container_count: containers the fee is computed on, vessel_voyage: sailing at the time of the change}
    account: booking_charges_balance
    direction: in
    triggers: []
  - type: booking_roll_recorded
    target: booking_charges
    meaning: The booking is rolled off a sailing, by the carrier or because of the customer.
    grain: One row per sailing the booking is rolled off.
    distinguish_by: [vessel_voyage]
    fields: {booking_id: booking, customer_id: booking party, event_date: roll date, charge_code: roll_notice, amount_usd: 0.00, vessel_voyage: sailing rolled off, roll_initiator: carrier or customer, container_count: containers rolled}
    triggers:
      - event: booking:booking_vessel_changed
        map: {booking_id: booking_id}
  - type: booking_roll_compensation_credited
    target: booking_charges
    meaning: Roll compensation is credited for a carrier roll of a guaranteed or priority booking.
    grain: One row per compensated carrier roll.
    distinguish_by: [reference_event_id]
    fields: {booking_id: booking, customer_id: booking party, event_date: credit date, charge_code: roll_compensation, amount_usd: credit amount, container_count: containers rolled, reference_event_id: the carrier roll row compensated}
    account: booking_charges_balance
    direction: out
    triggers: []
  - type: booking_payment_received
    target: booking_charges
    meaning: A remittance is applied to the booking's charges.
    grain: One row per remittance per booking.
    distinguish_by: [payment_reference]
    fields: {booking_id: booking paid, customer_id: paying party, event_date: value date, charge_code: payment, amount_usd: amount remitted, payment_reference: remittance reference quoted by the customer}
    account: booking_charges_balance
    direction: out
    triggers: []
  - type: booking_charge_waived
    target: booking_charges
    meaning: A fee row is waived as goodwill, or a loading guarantee premium is refunded on an early cancellation.
    grain: One row per fee row waived or premium refunded.
    distinguish_by: [reference_event_id]
    fields: {booking_id: booking, customer_id: booking party, event_date: waiver date, charge_code: waiver or premium_refund, amount_usd: full amount of the referenced row, reference_event_id: the fee or premium row concerned}
    account: booking_charges_balance
    direction: out
    triggers: []

measures:
  - id: booking_msr_no_show_count_90d
    window: Trailing 90 calendar days ending on the current request date, inclusive, across all bookings of the customer.
    measure: Count of booking_no_show_fee_charged rows for the customer_id with event_date inside the window, whether or not later waived.
  - id: booking_msr_late_doc_fees_365d
    window: Trailing 365 calendar days ending the day before the current late document, across all bookings of the customer.
    measure: Count of booking_late_document_fee_charged rows for the customer_id with event_date inside the window, including rows recorded at 0.00.
  - id: booking_msr_amendments
    window: Life of the booking up to, but excluding, the amendment being handled.
    measure: Count of booking_amendment_recorded rows on the booking_id.
  - id: booking_msr_carrier_rolls
    window: Life of the booking, including the roll being handled.
    measure: Count of booking_roll_recorded rows on the booking_id with roll_initiator carrier.
  - id: booking_msr_customer_rolls
    window: Life of the booking, including the roll being handled.
    measure: Count of booking_roll_recorded rows on the booking_id with roll_initiator customer.
  - id: booking_msr_roll_compensation_total
    window: Life of the booking, before the credit being handled.
    measure: Sum of amount_usd of booking_roll_compensation_credited rows on the booking_id.
  - id: booking_msr_goodwill_waivers_365d
    window: Trailing 365 calendar days ending on the waiver date, inclusive, across all bookings of the customer.
    measure: Count of booking_charge_waived rows for the customer_id with charge_code waiver and event_date inside the window (premium refunds excluded).

policies:
  - id: booking_agg_multi_holding
    subject: [booking_requested]
    rule: >-
      A customer may hold any number of bookings at the same time; there is no cap on concurrent bookings per customer, and every
      booking is a separate holding with its own charge account and its own lifecycle. The container ceiling applies to each booking
      on its own and is set by booking_request_eligibility; splitting one shipment into several bookings is allowed and each booking is
      charged, amended, rolled and cancelled independently.
    eligibility: []
    params: {max_per_customer: null}

  - id: booking_agg_no_show_record
    subject: [booking_requested]
    rule: >-
      No-show behaviour is aggregated across the customer's whole booking portfolio. booking_msr_no_show_count_90d counts the no-show
      fees booked on all of the customer's bookings in the trailing 90 calendar days, including fees later waived as goodwill, because
      the behaviour occurred. A new booking request for a tier may be accepted only when the customer's no-show count over the trailing
      90 days is below that tier's no_show_count_threshold_90d. When the count has reached the threshold of the requested tier, the
      request is declined for that tier and nothing is charged; the customer may still request any tier whose threshold the count has
      not reached, subject to booking_request_eligibility. Cancellations, declined requests and carrier rolls never count as no-shows.
    eligibility:
      - id: no_show_count_below_threshold
        applies_to: [booking_requested]
        kind: authorization
        condition: A new booking request for a tier may be accepted only when the customer's no-show count over the trailing 90 days is below that tier's no_show_count_threshold_90d.
        evidence_fields: [booking_charges.customer_id, booking_charges.event_type, booking_charges.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.customer_id]
          action_bindings: {booking_charges.customer_id: customer_id}
    params:
      per_tier:
        AHL Spot Saver: {no_show_count_threshold_90d: "=no_show_count_threshold_90d"}
        AHL Spot Flex: {no_show_count_threshold_90d: "=no_show_count_threshold_90d"}
        AHL Contract Booking: {no_show_count_threshold_90d: "=no_show_count_threshold_90d"}
        AHL Contract Priority: {no_show_count_threshold_90d: "=no_show_count_threshold_90d"}
        AHL Guaranteed Loading: {no_show_count_threshold_90d: "=no_show_count_threshold_90d"}
        AHL Premium Express: {no_show_count_threshold_90d: "=no_show_count_threshold_90d"}
    formula:
      request_blocked: booking_msr_no_show_count_90d >= no_show_count_threshold_90d
    measures: [booking_msr_no_show_count_90d]

  - id: booking_request_eligibility
    subject: [booking_requested]
    rule: >-
      A booking request is admitted to a tier only when the request itself fits the tier: the channel is one of the tier's
      allowed_channels, the cargo_type is one of its allowed_cargo_types, the container_count does not exceed max_containers_per_booking,
      the requested etd_date lies no more than booking_window_days_before_etd calendar days after the request date, and the request is
      received at least min_hours_before_cargo_cutoff_to_book hours before the cargo cut-off of the requested sailing. The customer's
      credit_status must not be credit_hold. Spot and contract rating are mutually exclusive on one booking: a tier whose
      contract_reference_allowed is false (AHL Spot Saver, AHL Spot Flex) must carry an empty contract_id, a tier whose contract_required is
      true (AHL Contract Booking, AHL Contract Priority) must reference a service contract, and AHL Guaranteed Loading and AHL Premium
      Express may be booked either way. When a contract is referenced, the referenced service contract must be in status active. The
      referenced service contract must be held by the requesting customer and cover the same trade lane as the booking. The referenced
      service contract's tier rank must be at least the booking tier's min_contract_tier_rank, so AHL Contract Priority is open only to
      holders of an AHL Key Account Contract or higher. The scheduled departure must fall on or before the expiry date of the referenced
      service contract. A request failing any condition is declined through booking_confirmation without charge; the desk may offer another
      tier whose conditions the request meets, but never places it in a different tier without the customer's instruction.
    eligibility:
      - id: credit_not_on_hold
        applies_to: [booking_requested]
        kind: state
        condition: The customer's credit_status must not be credit_hold.
        evidence_fields: [customers.credit_status, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings: {customers.customer_id: customer_id}
        state_contract:
          field: customers.credit_status
          allowed: [cash_in_advance, credit_approved]
      - id: contract_active
        applies_to: [booking_requested]
        kind: state
        condition: When a contract is referenced, the referenced service contract must be in status active.
        evidence_fields: [service_contracts.status, service_contracts.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
        state_contract:
          field: service_contracts.status
          allowed: [active]
      - id: contract_owned_same_lane
        applies_to: [booking_requested]
        kind: authorization
        condition: The referenced service contract must be held by the requesting customer and cover the same trade lane as the booking.
        evidence_fields: [service_contracts.contract_id, service_contracts.customer_id, service_contracts.trade_lane]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
      - id: contract_tier_rank
        applies_to: [booking_requested]
        kind: authorization
        condition: The referenced service contract's tier rank must be at least the booking tier's min_contract_tier_rank, so AHL Contract Priority is open only to holders of an AHL Key Account Contract or higher.
        evidence_fields: [service_contracts.contract_id, service_contracts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
      - id: departure_within_contract_term
        applies_to: [booking_requested]
        kind: authorization
        condition: The scheduled departure must fall on or before the expiry date of the referenced service contract.
        evidence_fields: [service_contracts.contract_id, service_contracts.expiry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
    params:
      per_tier:
        AHL Spot Saver: {max_containers_per_booking: "=max_containers_per_booking", booking_window_days_before_etd: "=booking_window_days_before_etd", min_hours_before_cargo_cutoff_to_book: "=min_hours_before_cargo_cutoff_to_book", contract_required: "=contract_required", contract_reference_allowed: "=contract_reference_allowed", min_contract_tier_rank: "=min_contract_tier_rank"}
        AHL Spot Flex: {max_containers_per_booking: "=max_containers_per_booking", booking_window_days_before_etd: "=booking_window_days_before_etd", min_hours_before_cargo_cutoff_to_book: "=min_hours_before_cargo_cutoff_to_book", contract_required: "=contract_required", contract_reference_allowed: "=contract_reference_allowed", min_contract_tier_rank: "=min_contract_tier_rank"}
        AHL Contract Booking: {max_containers_per_booking: "=max_containers_per_booking", booking_window_days_before_etd: "=booking_window_days_before_etd", min_hours_before_cargo_cutoff_to_book: "=min_hours_before_cargo_cutoff_to_book", contract_required: "=contract_required", contract_reference_allowed: "=contract_reference_allowed", min_contract_tier_rank: "=min_contract_tier_rank"}
        AHL Contract Priority: {max_containers_per_booking: "=max_containers_per_booking", booking_window_days_before_etd: "=booking_window_days_before_etd", min_hours_before_cargo_cutoff_to_book: "=min_hours_before_cargo_cutoff_to_book", contract_required: "=contract_required", contract_reference_allowed: "=contract_reference_allowed", min_contract_tier_rank: "=min_contract_tier_rank"}
        AHL Guaranteed Loading: {max_containers_per_booking: "=max_containers_per_booking", booking_window_days_before_etd: "=booking_window_days_before_etd", min_hours_before_cargo_cutoff_to_book: "=min_hours_before_cargo_cutoff_to_book", contract_required: "=contract_required", contract_reference_allowed: "=contract_reference_allowed", min_contract_tier_rank: "=min_contract_tier_rank"}
        AHL Premium Express: {max_containers_per_booking: "=max_containers_per_booking", booking_window_days_before_etd: "=booking_window_days_before_etd", min_hours_before_cargo_cutoff_to_book: "=min_hours_before_cargo_cutoff_to_book", contract_required: "=contract_required", contract_reference_allowed: "=contract_reference_allowed", min_contract_tier_rank: "=min_contract_tier_rank"}

  - id: booking_confirmation
    subject: [booking_confirmed, booking_declined]
    rule: >-
      Every admitted booking request is answered by confirmation or decline within the tier's confirmation_sla_hours of receipt. A request
      that passes booking_request_eligibility and booking_agg_no_show_record is confirmed on the requested sailing when space and equipment
      are available; for tiers with space_guaranteed true the request is confirmed on the requested sailing whenever it passes those two
      policies, and for other tiers a request for a fully allocated sailing is declined rather than confirmed on another sailing, because
      the choice of sailing is the customer's. Confirmation fixes the vessel_voyage, etd_date and the three cut-offs on the booking and
      starts freight charging under booking_freight_charging. A request that fails eligibility, or that the customer withdraws before
      confirmation, is declined with cancelled_date set to the decline date; a declined request carries no charge of any kind, and the
      cancellation and no-show fees never apply to it.
    eligibility: []
    params:
      per_tier:
        AHL Spot Saver: {confirmation_sla_hours: "=confirmation_sla_hours", space_guaranteed: "=space_guaranteed"}
        AHL Spot Flex: {confirmation_sla_hours: "=confirmation_sla_hours", space_guaranteed: "=space_guaranteed"}
        AHL Contract Booking: {confirmation_sla_hours: "=confirmation_sla_hours", space_guaranteed: "=space_guaranteed"}
        AHL Contract Priority: {confirmation_sla_hours: "=confirmation_sla_hours", space_guaranteed: "=space_guaranteed"}
        AHL Guaranteed Loading: {confirmation_sla_hours: "=confirmation_sla_hours", space_guaranteed: "=space_guaranteed"}
        AHL Premium Express: {confirmation_sla_hours: "=confirmation_sla_hours", space_guaranteed: "=space_guaranteed"}

  - id: booking_freight_charging
    subject: [booking_freight_charged]
    rule: >-
      Freight is charged when the booking is confirmed and again for any containers added by amendment, one row per charge code. Ocean
      freight and terminal handling are billed at the rate of the accepted spot quote or of the referenced contract's filed rate sheet; a
      quote or filed rate is bookable only within quote_validity_days calendar days of its issue, after which a new quote is needed. When
      baf_basis is contract_baf_schedule a separate bunker_adjustment_factor row is charged from the contract schedule; when it is
      included_in_quote no separate BAF row exists and none may be added. The peak season surcharge is charged as pss_per_container_usd
      times the containers charged when that parameter is above 0.00, and the equipment imbalance surcharge as
      equipment_imbalance_surcharge_per_container_usd times the containers charged when above 0.00; a tier whose value is 0.00 is exempt and
      no row is written. The loading guarantee premium is charged as guarantee_premium_per_container_usd times the containers charged when
      above 0.00. The manual booking fee of manual_booking_fee_usd is charged once per booking, only when the booking's channel is
      customer_service_desk and the fee is above 0.00. Freight may be charged only while the booking is confirmed, equipment_released or
      gated_in. Freight, surcharges, the premium and the manual fee are never waived as goodwill (booking_goodwill_waiver).
    eligibility:
      - id: freight_on_live_booking
        applies_to: [booking_freight_charged]
        kind: state
        condition: Freight may be charged only while the booking is confirmed, equipment_released or gated_in.
        evidence_fields: [bookings.status, bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        state_contract:
          field: bookings.status
          allowed: [confirmed, equipment_released, gated_in]
    params:
      per_tier:
        AHL Spot Saver: {pss_per_container_usd: "=pss_per_container_usd", equipment_imbalance_surcharge_per_container_usd: "=equipment_imbalance_surcharge_per_container_usd", guarantee_premium_per_container_usd: "=guarantee_premium_per_container_usd", manual_booking_fee_usd: "=manual_booking_fee_usd", baf_basis: "=baf_basis", quote_validity_days: "=quote_validity_days"}
        AHL Spot Flex: {pss_per_container_usd: "=pss_per_container_usd", equipment_imbalance_surcharge_per_container_usd: "=equipment_imbalance_surcharge_per_container_usd", guarantee_premium_per_container_usd: "=guarantee_premium_per_container_usd", manual_booking_fee_usd: "=manual_booking_fee_usd", baf_basis: "=baf_basis", quote_validity_days: "=quote_validity_days"}
        AHL Contract Booking: {pss_per_container_usd: "=pss_per_container_usd", equipment_imbalance_surcharge_per_container_usd: "=equipment_imbalance_surcharge_per_container_usd", guarantee_premium_per_container_usd: "=guarantee_premium_per_container_usd", manual_booking_fee_usd: "=manual_booking_fee_usd", baf_basis: "=baf_basis", quote_validity_days: "=quote_validity_days"}
        AHL Contract Priority: {pss_per_container_usd: "=pss_per_container_usd", equipment_imbalance_surcharge_per_container_usd: "=equipment_imbalance_surcharge_per_container_usd", guarantee_premium_per_container_usd: "=guarantee_premium_per_container_usd", manual_booking_fee_usd: "=manual_booking_fee_usd", baf_basis: "=baf_basis", quote_validity_days: "=quote_validity_days"}
        AHL Guaranteed Loading: {pss_per_container_usd: "=pss_per_container_usd", equipment_imbalance_surcharge_per_container_usd: "=equipment_imbalance_surcharge_per_container_usd", guarantee_premium_per_container_usd: "=guarantee_premium_per_container_usd", manual_booking_fee_usd: "=manual_booking_fee_usd", baf_basis: "=baf_basis", quote_validity_days: "=quote_validity_days"}
        AHL Premium Express: {pss_per_container_usd: "=pss_per_container_usd", equipment_imbalance_surcharge_per_container_usd: "=equipment_imbalance_surcharge_per_container_usd", guarantee_premium_per_container_usd: "=guarantee_premium_per_container_usd", manual_booking_fee_usd: "=manual_booking_fee_usd", baf_basis: "=baf_basis", quote_validity_days: "=quote_validity_days"}
    formula:
      pss_amount: pss_per_container_usd * container_count
      imbalance_amount: equipment_imbalance_surcharge_per_container_usd * container_count
      guarantee_amount: guarantee_premium_per_container_usd * container_count
      manual_fee_amount: manual_booking_fee_usd if channel == "customer_service_desk" else 0

  - id: booking_cancellation
    subject: [booking_cancelled, booking_cancellation_fee_charged, booking_charge_waived]
    rule: >-
      A booking that is confirmed, equipment_released or gated_in is cancelled on the verified customer's instruction; a booking still in
      requested is withdrawn through booking_confirmation instead and is never charged a cancellation fee. The cancellation fee is charged
      per container on the booking's container_count at the band given by the whole calendar days from the cancellation date to the
      etd_date: 14 or more days takes cancel_fee_14_plus_days_usd, 7 to 13 days takes cancel_fee_7_to_13_days_usd, 3 to 6 days takes
      cancel_fee_3_to_6_days_usd and 0 to 2 days takes cancel_fee_0_to_2_days_usd. Days before ETD are the calendar-date difference etd_date
      minus the cancellation date, ignoring the time of day; a cancellation after the etd_date has passed takes the 0 to 2 day band. The
      total fee on one booking never exceeds cancellation_fee_cap_per_booking_usd, and when the computed fee is 0.00 no fee row is written.
      No cancellation fee is charged when booking_msr_carrier_rolls on the booking has reached the tier's carrier_rolls_for_free_cancellation,
      or when line_rejection_free_cancellation is true and the line has rejected the dangerous-goods acceptance for this booking
      (dg_acceptances.status rejected); these exemptions do not stack into a credit, they only suppress the fee. A cancellation fee may be
      booked only on a booking whose status is cancelled. A booking carries at most one cancellation fee. When a booking that paid a loading
      guarantee premium is cancelled at least guarantee_premium_refund_min_days_before_etd calendar days before the etd_date, the premium
      row is refunded in full through a booking_charge_waived row with charge_code premium_refund referencing that premium row; cancelled
      later, the premium is kept. Premium refunds are not goodwill and never count toward booking_msr_goodwill_waivers_365d. The
      cancellation voids the booking's draft transport document, and the export free-time record of the booking is cancelled only when
      no empty container has been picked up under it (dnd charter).
    eligibility:
      - id: fee_on_cancelled_booking
        applies_to: [booking_cancellation_fee_charged]
        kind: state
        condition: A cancellation fee may be booked only on a booking whose status is cancelled.
        evidence_fields: [bookings.status, bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        state_contract:
          field: bookings.status
          allowed: [cancelled]
      - id: one_cancellation_fee
        applies_to: [booking_cancellation_fee_charged]
        kind: dedup
        condition: A booking carries at most one cancellation fee.
        evidence_fields: [booking_charges.booking_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.booking_id]
          action_bindings: {booking_charges.booking_id: booking_id}
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {booking_id: booking_id}
          duplicate_filters: {event_type: [booking_cancellation_fee_charged]}
          distinct_fields: []
    params:
      per_tier:
        AHL Spot Saver: {cancel_fee_14_plus_days_usd: "=cancel_fee_14_plus_days_usd", cancel_fee_7_to_13_days_usd: "=cancel_fee_7_to_13_days_usd", cancel_fee_3_to_6_days_usd: "=cancel_fee_3_to_6_days_usd", cancel_fee_0_to_2_days_usd: "=cancel_fee_0_to_2_days_usd", cancellation_fee_cap_per_booking_usd: "=cancellation_fee_cap_per_booking_usd", carrier_rolls_for_free_cancellation: "=carrier_rolls_for_free_cancellation", line_rejection_free_cancellation: "=line_rejection_free_cancellation", guarantee_premium_refund_min_days_before_etd: "=guarantee_premium_refund_min_days_before_etd"}
        AHL Spot Flex: {cancel_fee_14_plus_days_usd: "=cancel_fee_14_plus_days_usd", cancel_fee_7_to_13_days_usd: "=cancel_fee_7_to_13_days_usd", cancel_fee_3_to_6_days_usd: "=cancel_fee_3_to_6_days_usd", cancel_fee_0_to_2_days_usd: "=cancel_fee_0_to_2_days_usd", cancellation_fee_cap_per_booking_usd: "=cancellation_fee_cap_per_booking_usd", carrier_rolls_for_free_cancellation: "=carrier_rolls_for_free_cancellation", line_rejection_free_cancellation: "=line_rejection_free_cancellation", guarantee_premium_refund_min_days_before_etd: "=guarantee_premium_refund_min_days_before_etd"}
        AHL Contract Booking: {cancel_fee_14_plus_days_usd: "=cancel_fee_14_plus_days_usd", cancel_fee_7_to_13_days_usd: "=cancel_fee_7_to_13_days_usd", cancel_fee_3_to_6_days_usd: "=cancel_fee_3_to_6_days_usd", cancel_fee_0_to_2_days_usd: "=cancel_fee_0_to_2_days_usd", cancellation_fee_cap_per_booking_usd: "=cancellation_fee_cap_per_booking_usd", carrier_rolls_for_free_cancellation: "=carrier_rolls_for_free_cancellation", line_rejection_free_cancellation: "=line_rejection_free_cancellation", guarantee_premium_refund_min_days_before_etd: "=guarantee_premium_refund_min_days_before_etd"}
        AHL Contract Priority: {cancel_fee_14_plus_days_usd: "=cancel_fee_14_plus_days_usd", cancel_fee_7_to_13_days_usd: "=cancel_fee_7_to_13_days_usd", cancel_fee_3_to_6_days_usd: "=cancel_fee_3_to_6_days_usd", cancel_fee_0_to_2_days_usd: "=cancel_fee_0_to_2_days_usd", cancellation_fee_cap_per_booking_usd: "=cancellation_fee_cap_per_booking_usd", carrier_rolls_for_free_cancellation: "=carrier_rolls_for_free_cancellation", line_rejection_free_cancellation: "=line_rejection_free_cancellation", guarantee_premium_refund_min_days_before_etd: "=guarantee_premium_refund_min_days_before_etd"}
        AHL Guaranteed Loading: {cancel_fee_14_plus_days_usd: "=cancel_fee_14_plus_days_usd", cancel_fee_7_to_13_days_usd: "=cancel_fee_7_to_13_days_usd", cancel_fee_3_to_6_days_usd: "=cancel_fee_3_to_6_days_usd", cancel_fee_0_to_2_days_usd: "=cancel_fee_0_to_2_days_usd", cancellation_fee_cap_per_booking_usd: "=cancellation_fee_cap_per_booking_usd", carrier_rolls_for_free_cancellation: "=carrier_rolls_for_free_cancellation", line_rejection_free_cancellation: "=line_rejection_free_cancellation", guarantee_premium_refund_min_days_before_etd: "=guarantee_premium_refund_min_days_before_etd"}
        AHL Premium Express: {cancel_fee_14_plus_days_usd: "=cancel_fee_14_plus_days_usd", cancel_fee_7_to_13_days_usd: "=cancel_fee_7_to_13_days_usd", cancel_fee_3_to_6_days_usd: "=cancel_fee_3_to_6_days_usd", cancel_fee_0_to_2_days_usd: "=cancel_fee_0_to_2_days_usd", cancellation_fee_cap_per_booking_usd: "=cancellation_fee_cap_per_booking_usd", carrier_rolls_for_free_cancellation: "=carrier_rolls_for_free_cancellation", line_rejection_free_cancellation: "=line_rejection_free_cancellation", guarantee_premium_refund_min_days_before_etd: "=guarantee_premium_refund_min_days_before_etd"}
    formula:
      when_not: booking_msr_carrier_rolls >= carrier_rolls_for_free_cancellation
      days_before_etd: max(0, etd_date - event_date)
      fee_per_container: cancel_fee_14_plus_days_usd if days_before_etd >= 14 else (cancel_fee_7_to_13_days_usd if days_before_etd >= 7 else (cancel_fee_3_to_6_days_usd if days_before_etd >= 3 else cancel_fee_0_to_2_days_usd))
      amount_usd: min(fee_per_container * container_count, cancellation_fee_cap_per_booking_usd)
    measures: [booking_msr_carrier_rolls, booking_msr_goodwill_waivers_365d]

  - id: booking_no_show
    subject: [booking_marked_no_show, booking_no_show_fee_charged]
    rule: >-
      When the allocated sailing departs while a booking is still confirmed or equipment_released, meaning no laden container was gated in
      before the cargo cut-off, the system closes the booking as a no-show and moves it to cancelled with cancelled_date set to the departure
      date. A no-show fee of no_show_fee_per_container_usd per booked container is then charged, carrying the sailing that was missed. The
      no-show is judged against the sailing on the booking at departure time: a booking rolled off a sailing before it departed did not miss
      it. A booking the customer cancelled before departure is never a no-show; it bears the cancellation fee instead. A no-show fee may be
      booked only on a booking whose status is cancelled. A booking carries at most one no-show fee and never both a no-show fee and a
      cancellation fee. No-show fees count toward booking_agg_no_show_record, and they may be waived only as goodwill under
      booking_goodwill_waiver.
    eligibility:
      - id: no_show_on_cancelled_booking
        applies_to: [booking_no_show_fee_charged]
        kind: state
        condition: A no-show fee may be booked only on a booking whose status is cancelled.
        evidence_fields: [bookings.status, bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        state_contract:
          field: bookings.status
          allowed: [cancelled]
      - id: one_terminal_fee
        applies_to: [booking_no_show_fee_charged]
        kind: dedup
        condition: A booking carries at most one no-show fee and never both a no-show fee and a cancellation fee.
        evidence_fields: [booking_charges.booking_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.booking_id]
          action_bindings: {booking_charges.booking_id: booking_id}
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {booking_id: booking_id}
          duplicate_filters: {event_type: [booking_no_show_fee_charged, booking_cancellation_fee_charged]}
          distinct_fields: []
    params:
      per_tier:
        AHL Spot Saver: {no_show_fee_per_container_usd: "=no_show_fee_per_container_usd"}
        AHL Spot Flex: {no_show_fee_per_container_usd: "=no_show_fee_per_container_usd"}
        AHL Contract Booking: {no_show_fee_per_container_usd: "=no_show_fee_per_container_usd"}
        AHL Contract Priority: {no_show_fee_per_container_usd: "=no_show_fee_per_container_usd"}
        AHL Guaranteed Loading: {no_show_fee_per_container_usd: "=no_show_fee_per_container_usd"}
        AHL Premium Express: {no_show_fee_per_container_usd: "=no_show_fee_per_container_usd"}
    formula:
      amount_usd: no_show_fee_per_container_usd * container_count

  - id: booking_late_documentation
    subject: [booking_documents_received, booking_late_document_fee_charged]
    rule: >-
      Shipping instructions and the SOLAS verified gross mass must reach the line by the SI cut-off and the VGM cut-off of the allocated
      sailing. Shipping instructions are accepted for the allocated vessel only when they are received no later than the SI cut-off plus the
      tier's si_grace_hours. The grace deadline is the SI cut-off time plus the tier's grace hours, counted as full 60-minute hours in
      port-of-loading local time, and receipt exactly at the deadline is still inside it. Shipping instructions received after the SI cut-off
      but inside grace book one late_si_fee row of late_si_fee_usd per booking; received after grace they are not accepted for that sailing
      and the booking is rolled to the next sailing as a customer roll under booking_rollover, with no late fee for the missed sailing. A
      verified gross mass received after the VGM cut-off but no later than the VGM cut-off plus vgm_grace_hours books one late_vgm_fee row of
      late_vgm_fee_per_container_usd times the booking's container_count; no container is loaded without a verified gross mass, so a VGM
      later than grace also leads to a customer roll. Every late submission is recorded as a row; the row is recorded at 0.00 while
      booking_msr_late_doc_fees_365d for the customer is below late_doc_fee_free_occurrences_365d, and at the full fee otherwise. A late
      documentation fee may be booked only while the booking is confirmed, equipment_released or gated_in. Documents received on time book
      nothing.
    eligibility:
      - id: si_inside_grace
        applies_to: [booking_late_document_fee_charged]
        kind: time
        condition: Shipping instructions are accepted for the allocated vessel only when they are received no later than the SI cut-off plus the tier's si_grace_hours.
        evidence_fields: [bookings.si_cutoff, bookings.si_submitted_at, bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the SI cut-off
          anchor_source: bookings.si_cutoff
          relation: not_after
          duration_source: variants.si_grace_hours
          unit: elapsed_hours
          counting_rule: The grace deadline is the SI cut-off time plus the tier's grace hours, counted as full 60-minute hours in port-of-loading local time, and receipt exactly at the deadline is still inside it.
          boundary: inclusive
      - id: late_fee_on_live_booking
        applies_to: [booking_late_document_fee_charged]
        kind: state
        condition: A late documentation fee may be booked only while the booking is confirmed, equipment_released or gated_in.
        evidence_fields: [bookings.status, bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        state_contract:
          field: bookings.status
          allowed: [confirmed, equipment_released, gated_in]
    params:
      per_tier:
        AHL Spot Saver: {late_si_fee_usd: "=late_si_fee_usd", si_grace_hours: "=si_grace_hours", late_vgm_fee_per_container_usd: "=late_vgm_fee_per_container_usd", vgm_grace_hours: "=vgm_grace_hours", late_doc_fee_free_occurrences_365d: "=late_doc_fee_free_occurrences_365d"}
        AHL Spot Flex: {late_si_fee_usd: "=late_si_fee_usd", si_grace_hours: "=si_grace_hours", late_vgm_fee_per_container_usd: "=late_vgm_fee_per_container_usd", vgm_grace_hours: "=vgm_grace_hours", late_doc_fee_free_occurrences_365d: "=late_doc_fee_free_occurrences_365d"}
        AHL Contract Booking: {late_si_fee_usd: "=late_si_fee_usd", si_grace_hours: "=si_grace_hours", late_vgm_fee_per_container_usd: "=late_vgm_fee_per_container_usd", vgm_grace_hours: "=vgm_grace_hours", late_doc_fee_free_occurrences_365d: "=late_doc_fee_free_occurrences_365d"}
        AHL Contract Priority: {late_si_fee_usd: "=late_si_fee_usd", si_grace_hours: "=si_grace_hours", late_vgm_fee_per_container_usd: "=late_vgm_fee_per_container_usd", vgm_grace_hours: "=vgm_grace_hours", late_doc_fee_free_occurrences_365d: "=late_doc_fee_free_occurrences_365d"}
        AHL Guaranteed Loading: {late_si_fee_usd: "=late_si_fee_usd", si_grace_hours: "=si_grace_hours", late_vgm_fee_per_container_usd: "=late_vgm_fee_per_container_usd", vgm_grace_hours: "=vgm_grace_hours", late_doc_fee_free_occurrences_365d: "=late_doc_fee_free_occurrences_365d"}
        AHL Premium Express: {late_si_fee_usd: "=late_si_fee_usd", si_grace_hours: "=si_grace_hours", late_vgm_fee_per_container_usd: "=late_vgm_fee_per_container_usd", vgm_grace_hours: "=vgm_grace_hours", late_doc_fee_free_occurrences_365d: "=late_doc_fee_free_occurrences_365d"}
    formula:
      late_si_amount: 0 if booking_msr_late_doc_fees_365d < late_doc_fee_free_occurrences_365d else late_si_fee_usd
      late_vgm_amount: 0 if booking_msr_late_doc_fees_365d < late_doc_fee_free_occurrences_365d else late_vgm_fee_per_container_usd * container_count
    measures: [booking_msr_late_doc_fees_365d]

  - id: booking_amendment
    subject: [booking_amended, booking_amendment_recorded, booking_amendment_fee_charged]
    rule: >-
      A live booking's equipment type, container quantity, port of discharge or cargo category may be amended on the verified customer's
      instruction. Amendments are accepted only on bookings whose status is confirmed or equipment_released. An amendment is accepted only
      when it is received no later than the tier's amendment_lead_hours_before_cargo_cutoff before the cargo cut-off of the allocated
      vessel. The amendment deadline is the cargo cut-off time minus the tier's lead hours, counted as full 60-minute hours in
      port-of-loading local time, and an amendment received exactly at the deadline is accepted. Every accepted amendment is logged as one
      booking_amendment_recorded row, and booking_msr_amendments counts the amendments logged on the booking before the one being handled.
      A change of port of discharge is allowed only when the tier's pod_change_allowed is true; it is charged pod_change_fee_per_container_usd
      times the booking's container_count whatever the free allowance, and it still counts toward the allowance. Any other amendment is free
      while booking_msr_amendments is below free_amendments_per_booking and is charged amendment_fee_usd once otherwise. A container quantity
      may be raised by at most quantity_increase_limit_pct percent of the confirmed container_count, rounded down to whole containers and
      subject to space; the added containers are charged freight under booking_freight_charging. Reducing the quantity is an amendment, not a
      cancellation, and bears no cancellation fee. A change of cargo category must keep the cargo_type inside the tier's allowed_cargo_types.
      A change of sailing requested by the customer is a customer roll under booking_rollover, not an amendment.
    eligibility:
      - id: amend_live_booking
        applies_to: [booking_amended, booking_amendment_recorded, booking_amendment_fee_charged]
        kind: state
        condition: Amendments are accepted only on bookings whose status is confirmed or equipment_released.
        evidence_fields: [bookings.status, bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        state_contract:
          field: bookings.status
          allowed: [confirmed, equipment_released]
      - id: amend_before_lead_time
        applies_to: [booking_amended, booking_amendment_recorded, booking_amendment_fee_charged]
        kind: time
        condition: An amendment is accepted only when it is received no later than the tier's amendment_lead_hours_before_cargo_cutoff before the cargo cut-off of the allocated vessel.
        evidence_fields: [bookings.cargo_cutoff, bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the cargo cut-off of the allocated vessel
          anchor_source: bookings.cargo_cutoff
          relation: not_after
          duration_source: variants.amendment_lead_hours_before_cargo_cutoff
          unit: elapsed_hours
          counting_rule: The amendment deadline is the cargo cut-off time minus the tier's lead hours, counted as full 60-minute hours in port-of-loading local time, and an amendment received exactly at the deadline is accepted.
          boundary: inclusive
    params:
      per_tier:
        AHL Spot Saver: {free_amendments_per_booking: "=free_amendments_per_booking", amendment_fee_usd: "=amendment_fee_usd", amendment_lead_hours_before_cargo_cutoff: "=amendment_lead_hours_before_cargo_cutoff", pod_change_allowed: "=pod_change_allowed", pod_change_fee_per_container_usd: "=pod_change_fee_per_container_usd", quantity_increase_limit_pct: "=quantity_increase_limit_pct"}
        AHL Spot Flex: {free_amendments_per_booking: "=free_amendments_per_booking", amendment_fee_usd: "=amendment_fee_usd", amendment_lead_hours_before_cargo_cutoff: "=amendment_lead_hours_before_cargo_cutoff", pod_change_allowed: "=pod_change_allowed", pod_change_fee_per_container_usd: "=pod_change_fee_per_container_usd", quantity_increase_limit_pct: "=quantity_increase_limit_pct"}
        AHL Contract Booking: {free_amendments_per_booking: "=free_amendments_per_booking", amendment_fee_usd: "=amendment_fee_usd", amendment_lead_hours_before_cargo_cutoff: "=amendment_lead_hours_before_cargo_cutoff", pod_change_allowed: "=pod_change_allowed", pod_change_fee_per_container_usd: "=pod_change_fee_per_container_usd", quantity_increase_limit_pct: "=quantity_increase_limit_pct"}
        AHL Contract Priority: {free_amendments_per_booking: "=free_amendments_per_booking", amendment_fee_usd: "=amendment_fee_usd", amendment_lead_hours_before_cargo_cutoff: "=amendment_lead_hours_before_cargo_cutoff", pod_change_allowed: "=pod_change_allowed", pod_change_fee_per_container_usd: "=pod_change_fee_per_container_usd", quantity_increase_limit_pct: "=quantity_increase_limit_pct"}
        AHL Guaranteed Loading: {free_amendments_per_booking: "=free_amendments_per_booking", amendment_fee_usd: "=amendment_fee_usd", amendment_lead_hours_before_cargo_cutoff: "=amendment_lead_hours_before_cargo_cutoff", pod_change_allowed: "=pod_change_allowed", pod_change_fee_per_container_usd: "=pod_change_fee_per_container_usd", quantity_increase_limit_pct: "=quantity_increase_limit_pct"}
        AHL Premium Express: {free_amendments_per_booking: "=free_amendments_per_booking", amendment_fee_usd: "=amendment_fee_usd", amendment_lead_hours_before_cargo_cutoff: "=amendment_lead_hours_before_cargo_cutoff", pod_change_allowed: "=pod_change_allowed", pod_change_fee_per_container_usd: "=pod_change_fee_per_container_usd", quantity_increase_limit_pct: "=quantity_increase_limit_pct"}
    formula:
      amendment_amount: pod_change_fee_per_container_usd * container_count if amendment_type == "pod_change" else (0 if booking_msr_amendments < free_amendments_per_booking else amendment_fee_usd)
    measures: [booking_msr_amendments]

  - id: booking_rollover
    subject: [booking_roll_recorded, booking_vessel_changed, booking_roll_compensation_credited, booking_amendment_fee_charged]
    rule: >-
      A roll moves a booking off its allocated sailing to a later sailing of the same service. A carrier roll follows overbooking, a blank
      sailing or a port omission; when a sailing is overbooked the line rolls bookings in descending order of loading_priority_rank, and a
      booking whose tier has space_guaranteed true is rolled only for a blank sailing or a port omission, never for overbooking. A customer
      roll follows the customer's request for another sailing or documents received after grace under booking_late_documentation. Every roll
      is logged as one booking_roll_recorded row carrying the sailing rolled off and its roll_initiator, and the booking's vessel_voyage,
      etd_date and three cut-offs are replaced by those of the new sailing. Compensation is credited only for a roll whose recorded
      roll_initiator is carrier. For such a roll, the booking is credited roll_compensation_per_container_usd times its container_count when
      booking_msr_carrier_rolls, counted including the roll being compensated, does not exceed max_compensated_carrier_rolls, and the credit
      is reduced so that booking_msr_roll_compensation_total plus the credit never exceeds roll_compensation_cap_per_booking_usd; a tier whose
      compensation is 0.00 receives no credit and no row is written. Each carrier roll is compensated at most once. A customer roll is
      accepted only while the booking's customer rolls recorded so far are fewer than the tier's max_customer_rolls_per_booking. Beyond that
      the customer must cancel under booking_cancellation and book again. A customer roll is free while booking_msr_customer_rolls, counted
      including the roll being handled, does not exceed free_customer_rolls_per_booking, and is otherwise charged
      customer_roll_fee_per_container_usd times the container_count as a booking_amendment_fee_charged row with charge_code customer_roll_fee
      and amendment_type customer_requested_vessel_change. Carrier rolls never bear a fee and count toward carrier_rolls_for_free_cancellation.
    eligibility:
      - id: compensate_carrier_roll_only
        applies_to: [booking_roll_compensation_credited]
        kind: authorization
        condition: Compensation is credited only for a roll whose recorded roll_initiator is carrier.
        evidence_fields: [booking_charges.booking_event_id, booking_charges.roll_initiator]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.booking_event_id]
          action_bindings: {booking_charges.booking_event_id: reference_event_id}
      - id: one_compensation_per_roll
        applies_to: [booking_roll_compensation_credited]
        kind: dedup
        condition: Each carrier roll is compensated at most once.
        evidence_fields: [booking_charges.reference_event_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.reference_event_id]
          action_bindings: {booking_charges.reference_event_id: reference_event_id}
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {reference_event_id: reference_event_id}
          duplicate_filters: {event_type: [booking_roll_compensation_credited]}
          distinct_fields: []
      - id: customer_roll_cap
        applies_to: [booking_roll_recorded, booking_amendment_fee_charged]
        kind: authorization
        condition: A customer roll is accepted only while the booking's customer rolls recorded so far are fewer than the tier's max_customer_rolls_per_booking.
        evidence_fields: [booking_charges.booking_id, booking_charges.roll_initiator, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.booking_id]
          action_bindings: {booking_charges.booking_id: booking_id}
    params:
      per_tier:
        AHL Spot Saver: {roll_compensation_per_container_usd: "=roll_compensation_per_container_usd", roll_compensation_cap_per_booking_usd: "=roll_compensation_cap_per_booking_usd", max_compensated_carrier_rolls: "=max_compensated_carrier_rolls", customer_roll_fee_per_container_usd: "=customer_roll_fee_per_container_usd", free_customer_rolls_per_booking: "=free_customer_rolls_per_booking", max_customer_rolls_per_booking: "=max_customer_rolls_per_booking", loading_priority_rank: "=loading_priority_rank"}
        AHL Spot Flex: {roll_compensation_per_container_usd: "=roll_compensation_per_container_usd", roll_compensation_cap_per_booking_usd: "=roll_compensation_cap_per_booking_usd", max_compensated_carrier_rolls: "=max_compensated_carrier_rolls", customer_roll_fee_per_container_usd: "=customer_roll_fee_per_container_usd", free_customer_rolls_per_booking: "=free_customer_rolls_per_booking", max_customer_rolls_per_booking: "=max_customer_rolls_per_booking", loading_priority_rank: "=loading_priority_rank"}
        AHL Contract Booking: {roll_compensation_per_container_usd: "=roll_compensation_per_container_usd", roll_compensation_cap_per_booking_usd: "=roll_compensation_cap_per_booking_usd", max_compensated_carrier_rolls: "=max_compensated_carrier_rolls", customer_roll_fee_per_container_usd: "=customer_roll_fee_per_container_usd", free_customer_rolls_per_booking: "=free_customer_rolls_per_booking", max_customer_rolls_per_booking: "=max_customer_rolls_per_booking", loading_priority_rank: "=loading_priority_rank"}
        AHL Contract Priority: {roll_compensation_per_container_usd: "=roll_compensation_per_container_usd", roll_compensation_cap_per_booking_usd: "=roll_compensation_cap_per_booking_usd", max_compensated_carrier_rolls: "=max_compensated_carrier_rolls", customer_roll_fee_per_container_usd: "=customer_roll_fee_per_container_usd", free_customer_rolls_per_booking: "=free_customer_rolls_per_booking", max_customer_rolls_per_booking: "=max_customer_rolls_per_booking", loading_priority_rank: "=loading_priority_rank"}
        AHL Guaranteed Loading: {roll_compensation_per_container_usd: "=roll_compensation_per_container_usd", roll_compensation_cap_per_booking_usd: "=roll_compensation_cap_per_booking_usd", max_compensated_carrier_rolls: "=max_compensated_carrier_rolls", customer_roll_fee_per_container_usd: "=customer_roll_fee_per_container_usd", free_customer_rolls_per_booking: "=free_customer_rolls_per_booking", max_customer_rolls_per_booking: "=max_customer_rolls_per_booking", loading_priority_rank: "=loading_priority_rank"}
        AHL Premium Express: {roll_compensation_per_container_usd: "=roll_compensation_per_container_usd", roll_compensation_cap_per_booking_usd: "=roll_compensation_cap_per_booking_usd", max_compensated_carrier_rolls: "=max_compensated_carrier_rolls", customer_roll_fee_per_container_usd: "=customer_roll_fee_per_container_usd", free_customer_rolls_per_booking: "=free_customer_rolls_per_booking", max_customer_rolls_per_booking: "=max_customer_rolls_per_booking", loading_priority_rank: "=loading_priority_rank"}
    formula:
      compensation_amount: 0 if booking_msr_carrier_rolls > max_compensated_carrier_rolls else max(0, min(roll_compensation_per_container_usd * container_count, roll_compensation_cap_per_booking_usd - booking_msr_roll_compensation_total))
      customer_roll_amount: 0 if booking_msr_customer_rolls <= free_customer_rolls_per_booking else customer_roll_fee_per_container_usd * container_count
    measures: [booking_msr_carrier_rolls, booking_msr_customer_rolls, booking_msr_roll_compensation_total]

  - id: booking_equipment_and_milestones
    subject: [booking_equipment_released, booking_gated_in, booking_loaded, booking_departed, booking_closed]
    rule: >-
      Empty equipment is released against a confirmed booking on the customer's request. Empty equipment is released no earlier than the
      tier's empty_release_days_before_etd calendar days before the scheduled departure date. The earliest release date is the etd_date minus
      the tier's release days in whole calendar days, and release on that date itself is allowed. For a cash_in_advance customer on a tier
      whose prepayment_required_before_equipment_release is true, the booking's charges_due_usd must be 0.00 before release; credit_approved
      customers are never held for prepayment. A booking with cargo_type dangerous_goods may be released only when its dangerous-goods
      acceptance is approved. A booking with cargo_type reefer may be released only when its reefer service has passed pre-trip inspection.
      When the booked 40DV is short at the depot and the tier's equipment_substitution_free is true, a 40HC is released at no extra charge;
      otherwise the customer waits for the booked type or amends it under booking_amendment, and tiers with equipment_guaranteed true are
      never left waiting. Release opens the export free-time record of the booking under the dnd charter. Gate-in, loading, departure and
      closure are recorded by the terminal and vessel systems and are never set by the desk. A container is loaded only when the verified
      gross mass has been received. Departure of a booking rated under a service contract credits the contract's lifted volume under the
      contract charter.
    eligibility:
      - id: release_window
        applies_to: [booking_equipment_released]
        kind: time
        condition: Empty equipment is released no earlier than the tier's empty_release_days_before_etd calendar days before the scheduled departure date.
        evidence_fields: [bookings.etd_date, bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the scheduled departure date
          anchor_source: bookings.etd_date
          relation: not_before
          duration_source: variants.empty_release_days_before_etd
          unit: calendar_days
          counting_rule: The earliest release date is the etd_date minus the tier's release days in whole calendar days, and release on that date itself is allowed.
          boundary: inclusive
      - id: prepaid_before_release
        applies_to: [booking_equipment_released]
        kind: authorization
        condition: For a cash_in_advance customer on a tier whose prepayment_required_before_equipment_release is true, the booking's charges_due_usd must be 0.00 before release; credit_approved customers are never held for prepayment.
        evidence_fields: [customers.credit_status, bookings.charges_due_usd, bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
      - id: dg_approved_before_release
        applies_to: [booking_equipment_released]
        kind: state
        condition: A booking with cargo_type dangerous_goods may be released only when its dangerous-goods acceptance is approved.
        evidence_fields: [dg_acceptances.status, dg_acceptances.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_acceptances.booking_id]
          action_bindings: {dg_acceptances.booking_id: booking_id}
        state_contract:
          field: dg_acceptances.status
          allowed: [approved]
      - id: reefer_pti_before_release
        applies_to: [booking_equipment_released]
        kind: state
        condition: A booking with cargo_type reefer may be released only when its reefer service has passed pre-trip inspection.
        evidence_fields: [reefer_services.status, reefer_services.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_services.booking_id]
          action_bindings: {reefer_services.booking_id: booking_id}
        state_contract:
          field: reefer_services.status
          allowed: [pti_passed]
      - id: vgm_before_loading
        applies_to: [booking_loaded]
        kind: authorization
        condition: A container is loaded only when the verified gross mass has been received.
        evidence_fields: [bookings.vgm_submitted_at, bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
    params:
      per_tier:
        AHL Spot Saver: {empty_release_days_before_etd: "=empty_release_days_before_etd", equipment_substitution_free: "=equipment_substitution_free", equipment_guaranteed: "=equipment_guaranteed", prepayment_required_before_equipment_release: "=prepayment_required_before_equipment_release"}
        AHL Spot Flex: {empty_release_days_before_etd: "=empty_release_days_before_etd", equipment_substitution_free: "=equipment_substitution_free", equipment_guaranteed: "=equipment_guaranteed", prepayment_required_before_equipment_release: "=prepayment_required_before_equipment_release"}
        AHL Contract Booking: {empty_release_days_before_etd: "=empty_release_days_before_etd", equipment_substitution_free: "=equipment_substitution_free", equipment_guaranteed: "=equipment_guaranteed", prepayment_required_before_equipment_release: "=prepayment_required_before_equipment_release"}
        AHL Contract Priority: {empty_release_days_before_etd: "=empty_release_days_before_etd", equipment_substitution_free: "=equipment_substitution_free", equipment_guaranteed: "=equipment_guaranteed", prepayment_required_before_equipment_release: "=prepayment_required_before_equipment_release"}
        AHL Guaranteed Loading: {empty_release_days_before_etd: "=empty_release_days_before_etd", equipment_substitution_free: "=equipment_substitution_free", equipment_guaranteed: "=equipment_guaranteed", prepayment_required_before_equipment_release: "=prepayment_required_before_equipment_release"}
        AHL Premium Express: {empty_release_days_before_etd: "=empty_release_days_before_etd", equipment_substitution_free: "=equipment_substitution_free", equipment_guaranteed: "=equipment_guaranteed", prepayment_required_before_equipment_release: "=prepayment_required_before_equipment_release"}

  - id: booking_goodwill_waiver
    subject: [booking_charge_waived]
    rule: >-
      The desk may waive a single fee row as goodwill at the verified customer's request. Only rows with charge_code cancellation_fee,
      no_show_fee, late_si_fee, late_vgm_fee, amendment_fee, pod_change_fee or customer_roll_fee may be waived; ocean freight, BAF, terminal
      handling, the peak season and imbalance surcharges, the loading guarantee premium and the manual booking fee are never waived as
      goodwill. A waiver cancels the whole referenced fee row, never part of it, and is written with charge_code waiver and the row's full
      amount_usd. The fee row's amount_usd must not exceed the tier's goodwill_waiver_authority_usd. The customer's goodwill waivers in the
      trailing 365 days must be fewer than the tier's goodwill_waivers_per_365d. The quota is counted by booking_msr_goodwill_waivers_365d
      across all of the customer's bookings and is compared with the parameter of the tier of the booking that carries the fee. The waiver
      must be requested no later than the tier's waiver_request_window_days calendar days after the fee being waived was booked. The window
      ends on the fee's event_date plus the tier's window days counted on calendar dates without regard to time of day, and a request on the
      last day is inside it. Each fee row is waived at most once. A fee that fails any of these conditions stays payable, and the desk has no
      authority to reduce it.
    eligibility:
      - id: within_authority
        applies_to: [booking_charge_waived]
        kind: authorization
        condition: The fee row's amount_usd must not exceed the tier's goodwill_waiver_authority_usd.
        evidence_fields: [booking_charges.booking_event_id, booking_charges.amount_usd, booking_charges.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.booking_event_id]
          action_bindings: {booking_charges.booking_event_id: reference_event_id}
      - id: within_quota
        applies_to: [booking_charge_waived]
        kind: authorization
        condition: The customer's goodwill waivers in the trailing 365 days must be fewer than the tier's goodwill_waivers_per_365d.
        evidence_fields: [booking_charges.customer_id, booking_charges.event_type, booking_charges.charge_code, booking_charges.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.customer_id]
          action_bindings: {booking_charges.customer_id: customer_id}
      - id: within_request_window
        applies_to: [booking_charge_waived]
        kind: time
        condition: The waiver must be requested no later than the tier's waiver_request_window_days calendar days after the fee being waived was booked.
        evidence_fields: [booking_charges.booking_event_id, booking_charges.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.booking_event_id]
          action_bindings: {booking_charges.booking_event_id: reference_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the fee being waived was booked
          anchor_source: booking_charges.event_date
          relation: not_after
          duration_source: variants.waiver_request_window_days
          unit: calendar_days
          counting_rule: The window ends on the fee's event_date plus the tier's window days counted on calendar dates without regard to time of day, and a request on the last day is inside it.
          boundary: inclusive
      - id: waive_once
        applies_to: [booking_charge_waived]
        kind: dedup
        condition: Each fee row is waived at most once.
        evidence_fields: [booking_charges.reference_event_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.reference_event_id]
          action_bindings: {booking_charges.reference_event_id: reference_event_id}
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {reference_event_id: reference_event_id}
          duplicate_filters: {event_type: [booking_charge_waived]}
          distinct_fields: []
    params:
      per_tier:
        AHL Spot Saver: {goodwill_waiver_authority_usd: "=goodwill_waiver_authority_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
        AHL Spot Flex: {goodwill_waiver_authority_usd: "=goodwill_waiver_authority_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
        AHL Contract Booking: {goodwill_waiver_authority_usd: "=goodwill_waiver_authority_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
        AHL Contract Priority: {goodwill_waiver_authority_usd: "=goodwill_waiver_authority_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
        AHL Guaranteed Loading: {goodwill_waiver_authority_usd: "=goodwill_waiver_authority_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
        AHL Premium Express: {goodwill_waiver_authority_usd: "=goodwill_waiver_authority_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
    formula:
      when_not: amount_usd > goodwill_waiver_authority_usd or booking_msr_goodwill_waivers_365d >= goodwill_waivers_per_365d
    measures: [booking_msr_goodwill_waivers_365d]

  - id: booking_payment
    subject: [booking_payment_received]
    rule: >-
      A remittance is applied to one booking, written with the remittance reference exactly as quoted by the customer and the amount
      actually remitted. A payment may not exceed the booking's charges_due_usd at the time it is applied; any excess is returned by the
      finance department and is not booked on the booking. A remittance reference is recorded only once per booking. Prepaid freight is paid
      by the shipper against the booking before the transport document is released under the bol charter; collect freight is paid by the
      consignee at destination and is applied to the same booking. Payments are never allocated across several bookings by the desk; a
      single remittance covering several bookings is split by the finance department and is outside the desk's handling.
    eligibility:
      - id: reference_once
        applies_to: [booking_payment_received]
        kind: dedup
        condition: A remittance reference is recorded only once per booking.
        evidence_fields: [booking_charges.booking_id, booking_charges.payment_reference, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.booking_id, booking_charges.payment_reference]
          action_bindings: {booking_charges.booking_id: booking_id, booking_charges.payment_reference: payment_reference}
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {booking_id: booking_id, payment_reference: payment_reference}
          duplicate_filters: {event_type: [booking_payment_received]}
          distinct_fields: []
    formula:
      applied_amount: min(amount_usd, booking_charges_balance)
