category: booking
display_name: Container Bookings

# Functional closure (real capabilities of a liner booking desk, each carried below):
#   request and admission (booking_requested; booking_request_eligibility, booking_agg_no_show_record)
#   confirmation or decline (booking_confirmed / booking_declined; booking_confirmation)
#   freight and surcharge billing (booking_freight_charged; booking_freight_charging)
#   cancellation and its fee ladder, premium refund (booking_cancelled, booking_cancellation_fee_charged; booking_cancellation)
#   no-show at vessel departure (booking_marked_no_show, booking_no_show_fee_charged; booking_no_show)
#   shipping-instruction and VGM cut-offs (booking_documents_received, booking_late_document_fee_charged; booking_late_documentation)
#   amendments and change of destination (booking_amended, booking_amendment_recorded, booking_amendment_fee_charged; booking_amendment)
#   carrier and customer rolls, roll compensation (booking_roll_recorded, booking_vessel_changed, booking_roll_compensation_credited; booking_rollover)
#   equipment release, gate-in, loading, departure, closure (milestone transitions; booking_equipment_and_milestones)
#   payments and goodwill waivers (booking_payment_received, booking_charge_waived; booking_payment, booking_goodwill_waiver)
#   not applicable: interest on late payment (handled by credit control outside the booking account).

binding:
  holding_table: bookings
  event_tables: [booking_charges]
  status_field: status
  variant_field: variant_name
  quantity_fields: {charges_due_usd: booking_charges_balance}

lifecycle:
  states: [requested, confirmed, equipment_released, gated_in, loaded, departed, cancelled, closed]
  transitions:
    - {from: requested, to: confirmed, by: agent, means: Space and equipment are confirmed on the requested vessel and the confirmation is issued.}
    - {from: requested, to: cancelled, by: agent, means: The request is declined for lack of space or eligibility, or withdrawn by the customer before confirmation.}
    - {from: confirmed, to: equipment_released, by: agent, means: The empty container release order is issued to the customer's haulier.}
    - {from: confirmed, to: cancelled, by: agent, means: The confirmed booking is cancelled on the customer's instruction.}
    - {from: equipment_released, to: cancelled, by: agent, means: The booking is cancelled on the customer's instruction after empties were released.}
    - {from: gated_in, to: cancelled, by: agent, means: Laden containers are withdrawn from the terminal before loading on the customer's instruction.}
    - {from: confirmed, to: cancelled, by: system, means: The allocated vessel departed with no container gated in and the booking is closed as a no-show.}
    - {from: equipment_released, to: cancelled, by: system, means: The allocated vessel departed with no laden container gated in and the booking is closed as a no-show.}
    - {from: equipment_released, to: gated_in, by: system, means: The laden containers are received at the load terminal.}
    - {from: gated_in, to: loaded, by: system, means: The containers are loaded on board the allocated vessel.}
    - {from: loaded, to: departed, by: system, means: The carrying vessel departs the port of loading.}
    - {from: departed, to: closed, by: system, means: The containers are discharged and the booking file is closed.}

accounts:
  - key: booking_charges_balance
    unit: USD
    meaning: Charges owed by the booking party on one booking — freight, surcharges and fees booked in, payments, waivers, premium refunds and roll compensation booked out.

parameter_schema:
  confirmation_sla_hours: Maximum hours from receipt of a booking request to confirmation or decline (integer hours).
  max_containers_per_booking: Maximum number of containers one booking may carry (integer containers).
  booking_window_days_before_etd: Furthest a requested departure may lie after the request date (integer calendar days).
  min_hours_before_cargo_cutoff_to_book: Minimum lead time between the request and the cargo cut-off of the requested vessel (integer hours).
  loading_priority_rank: Order in which bookings are protected when a sailing is overbooked; 1 is protected first (integer rank).
  space_guaranteed: Whether confirmed space is guaranteed against overbooking rolls (boolean).
  equipment_guaranteed: Whether the booked equipment type is guaranteed at the release depot (boolean).
  contract_required: Whether the tier may only be booked under a service contract (boolean).
  contract_reference_allowed: Whether a booking of the tier may reference a service contract at all (boolean).
  min_contract_tier_rank: Lowest service contract tier rank (contract charter variants rank) that may carry the tier; 0 when no contract is needed (integer rank).
  allowed_cargo_types: Cargo handling categories the tier accepts (list of bookings.cargo_type values).
  allowed_channels: Channels through which the tier may be booked (list of bookings.channel values).
  manual_booking_fee_usd: Fee per booking placed through the customer service desk (USD per booking).
  guarantee_premium_per_container_usd: Loading guarantee premium charged at confirmation (USD per container).
  guarantee_premium_refund_min_days_before_etd: Minimum calendar days before ETD at which a cancelled booking still gets its loading guarantee premium refunded (integer days).
  cancel_fee_14_plus_days_usd: Cancellation fee when cancelled 14 or more calendar days before ETD (USD per container).
  cancel_fee_7_to_13_days_usd: Cancellation fee when cancelled 7 to 13 calendar days before ETD (USD per container).
  cancel_fee_3_to_6_days_usd: Cancellation fee when cancelled 3 to 6 calendar days before ETD (USD per container).
  cancel_fee_0_to_2_days_usd: Cancellation fee when cancelled 0 to 2 calendar days before ETD (USD per container).
  cancellation_fee_cap_per_booking_usd: Maximum total cancellation fee on one booking (USD per booking).
  carrier_rolls_for_free_cancellation: Number of carrier rolls on a booking from which the customer may cancel without a cancellation fee (integer rolls).
  line_rejection_free_cancellation: Whether cancellation is free when the line rejected the booking's dangerous-goods acceptance (boolean).
  no_show_fee_per_container_usd: No-show fee when the vessel departs with nothing gated in (USD per container).
  no_show_count_threshold_90d: Number of no-show fees across the customer's bookings in the trailing 90 days at which new requests for the tier are declined (integer).
  late_si_fee_usd: Fee for shipping instructions received after the SI cut-off but within grace (USD per booking).
  si_grace_hours: Hours after the SI cut-off within which late shipping instructions are still accepted for the allocated vessel (integer hours).
  late_vgm_fee_per_container_usd: Fee for a verified gross mass received after the VGM cut-off but within grace (USD per container).
  vgm_grace_hours: Hours after the VGM cut-off within which a late VGM is still accepted for the allocated vessel (integer hours).
  late_doc_fee_free_occurrences_365d: Late documentation submissions per customer per trailing 365 days recorded at 0.00 before fees apply (integer).
  free_amendments_per_booking: Amendments per booking accepted without an amendment fee (integer).
  amendment_fee_usd: Fee per amendment beyond the free allowance (USD per amendment).
  amendment_lead_hours_before_cargo_cutoff: Latest an amendment may be received, in hours before the cargo cut-off (integer hours).
  pod_change_allowed: Whether a change of port of discharge may be requested after confirmation (boolean).
  pod_change_fee_per_container_usd: Change-of-destination fee (USD per container).
  quantity_increase_limit_pct: Maximum increase of container_count by amendment, as percent of the confirmed count, rounded down to whole containers (integer percent).
  roll_compensation_per_container_usd: Credit for each compensated carrier roll (USD per container).
  roll_compensation_cap_per_booking_usd: Maximum total roll compensation on one booking (USD per booking).
  max_compensated_carrier_rolls: Number of carrier rolls on one booking that earn compensation (integer rolls).
  customer_roll_fee_per_container_usd: Fee for a customer-caused roll beyond the free allowance (USD per container).
  free_customer_rolls_per_booking: Customer-caused rolls per booking without fee (integer rolls).
  max_customer_rolls_per_booking: Maximum customer-caused rolls on one booking before it must be cancelled and rebooked (integer rolls).
  pss_per_container_usd: Peak season surcharge charged at confirmation; 0.00 means the tier is exempt (USD per container).
  equipment_imbalance_surcharge_per_container_usd: Equipment imbalance surcharge charged at confirmation; 0.00 means exempt (USD per container).
  baf_basis: How bunker cost is billed — included_in_quote (no separate BAF row) or contract_baf_schedule (a separate bunker_adjustment_factor row from the contract schedule) (enum string).
  quote_validity_days: Calendar days a quoted or contract-filed booking rate remains bookable after it was issued (integer days).
  empty_release_days_before_etd: Earliest release of empty equipment, in calendar days before ETD (integer days).
  equipment_substitution_free: Whether the line may substitute a 40HC for a booked 40DV at no charge when 40DV is short (boolean).
  prepayment_required_before_equipment_release: Whether a cash_in_advance customer must have zero charges due before empties are released (boolean).
  goodwill_waiver_authority_usd: Largest single fee row the desk may waive as goodwill (USD per fee row).
  goodwill_waivers_per_365d: Goodwill waivers per customer in the trailing 365 days (integer).
  waiver_request_window_days: Calendar days after a fee was booked within which a goodwill waiver may be requested (integer days).

