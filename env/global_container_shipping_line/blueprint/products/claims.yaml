category: claims
display_name: Cargo Liability, CargoCare and Cargo Claims

# Functional closure (real capabilities of a cargo claims and cargo protection desk, each carried below):
#   quoting and binding a cover per shipment, premium and its prepayment (claims_cover_quoted, claims_cover_bound, claims_premium_charged, claims_premium_paid; claims_cover_eligibility, claims_premium, claims_agg_multi_holding)
#   cancellation before departure and premium refund, lapse of unbound quotes (claims_cover_cancelled, claims_cover_lapsed, claims_premium_refunded; claims_cover_cancellation)
#   delivery and expiry of the claim window (claims_cargo_delivered, claims_cover_expired; claims_cover_expiry_and_delivery)
#   notice of loss, claimant entitlement, time bar, withdrawal, documents deadline (claims_claim_lodged, claims_claim_withdrawn, claims_claim_rejected; claims_notice_and_time_bar)
#   perils covered, temperature and delay rules, misdeclared cargo (claims_settlement_approved, claims_claim_rejected; claims_coverage_and_exclusions)
#   settlement amount by liability regime, deductibles, caps, annual aggregate, desk authority (claims_settlement_approved; claims_settlement_calculation, claims_agg_annual_aggregate)
#   settlement payment and closure (claims_settlement_paid, claims_claim_closed; claims_settlement_payment)
#   not applicable: recovery actions against third parties and general average adjustment, which the claims department and average adjusters run outside the desk.

binding:
  holding_table: cargo_covers
  event_tables: [claims_ledger]
  intake_tables: [cargo_claims]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_due_usd: premium, settlement_payable_usd: claim_settlement}

lifecycle:
  states: [quoted, active, claim_open, claim_closed, expired, cancelled]
  transitions:
    - {from: quoted, to: active, by: agent, means: A CargoCare or declared value cover is bound at the customer's instruction.}
    - {from: quoted, to: active, by: system, means: AHL Standard Carrier Liability attaches automatically when the cargo is received.}
    - {from: quoted, to: cancelled, by: agent, means: An unbound quote lapses or is declined.}
    - {from: active, to: cancelled, by: agent, means: A bound cover is cancelled before the vessel departs.}
    - {from: active, to: claim_open, by: user, means: The claimant lodges written notice of loss.}
    - {from: claim_closed, to: claim_open, by: user, means: The claimant lodges notice of a further loss on the same shipment.}
    - {from: claim_open, to: active, by: user, means: The claimant withdraws its claim.}
    - {from: claim_open, to: claim_closed, by: agent, means: The claim is decided, by settlement or rejection.}
    - {from: active, to: expired, by: system, means: The claim period after delivery ends with no open claim.}
    - {from: claim_closed, to: expired, by: system, means: The claim period after delivery ends after a decided claim.}

accounts:
  - key: premium
    unit: USD
    meaning: Premium or ad valorem charge owed on one cover — charged in, paid or refunded out.
  - key: claim_settlement
    unit: USD
    meaning: Approved claim settlement not yet paid to the claimant — approved in, paid out.

parameter_schema:
  liability_basis: How the line's liability is measured — hague_visby_limitation, declared_value or cargocare_cover (enum string).
  sdr_per_package_limit: Hague-Visby limit per package or unit enumerated on the transport document; used only under hague_visby_limitation (SDR per package).
  sdr_per_kg_limit: Hague-Visby limit per kilogram of gross weight of the goods lost or damaged; used only under hague_visby_limitation (SDR per kg).
  sdr_to_usd_rate: Conversion rate of the line's claims tariff from SDR to USD (USD per SDR, 4 decimal places).
  premium_rate_pct_of_insured_value: Premium or ad valorem charge as percent of the insured value (percent, 2 decimal places).
  minimum_premium_per_container_usd: Minimum premium per container covered (USD per container).
  minimum_premium_per_cover_usd: Minimum premium per cover (USD per cover).
  cover_cap_per_container_usd: Maximum settlement per container under a CargoCare product (USD per container).
  max_cover_value_usd: Maximum insured value of one cover (USD per cover).
  min_insured_value_usd: Minimum insured value for the product to be bound (USD per cover).
  deductible_per_claim_usd: General deductible per claim (USD per claim).
  wet_damage_deductible_usd: Deductible for wet damage claims (USD per claim).
  temperature_damage_deductible_usd: Deductible for temperature damage claims (USD per claim).
  valuation_uplift_pct: Uplift of the proven loss for valuation, as on CIF plus 10 percent (integer percent).
  covered_damage_types: Kinds of loss the product pays (list of cargo_claims.damage_type values).
  temperature_damage_min_reefer_rank: Lowest reefer service tier rank (reefer charter) under which temperature damage is covered (integer rank).
  temperature_claim_requires_logged_excursion: Whether a temperature claim needs a logged temperature excursion on the reefer service (boolean).
  excursion_min_minutes_for_claim: Minimum continuous excursion logged for a temperature claim when a logged excursion is required (integer minutes).
  delay_loss_min_carrier_rolls: Carrier rolls of the booking needed before delay loss is paid; 0 when delay loss is not covered (integer).
  delay_loss_cap_pct_of_insured_value: Maximum delay loss as percent of the insured value per container (integer percent).
  max_delay_loss_per_container_usd: Maximum delay loss per container (USD per container).
  notice_days_delay_loss: Calendar days after delivery within which notice of delay loss must reach the line (integer days).
  notice_days_non_apparent_damage: Calendar days after delivery within which notice of loss not apparent at delivery must reach the line (integer days).
  apparent_damage_notice_days: Calendar days after delivery within which notice of loss apparent at delivery must reach the line; 0 means it must be noted on the delivery receipt (integer days).
  claim_time_bar_months: Calendar months after delivery after which no claim is admissible (integer months).
  documents_due_days_after_notice: Calendar days after the notice by which the claim documents must be complete (integer days).
  survey_required_above_usd: Claimed amount above which a survey report is a required document (USD per claim).
  survey_required_damage_types: Kinds of loss for which a survey report is always required (list of damage_type values).
  claim_decision_days_after_documents: Service standard for deciding a claim once documents are complete (integer days).
  settlement_payment_days: Calendar days after approval within which an approved settlement is paid (integer days).
  desk_settlement_authority_usd: Largest settlement the desk may approve (USD per claim).
  minimum_claim_amount_usd: Smallest claimed amount the product pays (USD per claim).
  max_claims_per_cover: Maximum claims lodged on one cover, withdrawn claims excluded (integer).
  claimants_allowed: Who may lodge a claim — cover_holder and/or named_consignee (list).
  annual_aggregate_limit_usd: Maximum approved settlements per cover holder across its covers of the product in the trailing 365 days; 0 means no aggregate (USD).
  eligible_cargo_types: Cargo categories the product may cover (list of cargo_covers.cargo_type values).
  bind_deadline_days_before_etd: Latest binding, in calendar days before the scheduled departure (integer days).
  partial_shipment_cover_allowed: Whether a cover may cover fewer containers than the booking carries (boolean).
  forwarder_bind_on_behalf_allowed: Whether a freight forwarder or NVOCC may hold the product for its cargo owner (boolean).
  premium_discount_min_contract_rank: Lowest service contract tier rank whose holder gets the premium discount; 0 means no discount (integer rank).
  contract_premium_discount_pct: Premium discount for qualifying contract holders (integer percent).
  dg_cargo_premium_uplift_pct: Premium uplift for dangerous_goods cargo (integer percent).
  reefer_cargo_premium_uplift_pct: Premium uplift for reefer cargo (integer percent).
  oog_premium_uplift_pct: Premium uplift for out_of_gauge cargo (integer percent).
  premium_prepayment_required: Whether a cash_in_advance cover holder must pay the premium before the cover is bound (boolean).
  premium_due_days: Calendar days after binding within which the premium is payable when prepayment does not apply (integer days).
  premium_paid_before_settlement: Whether an approved settlement is withheld while premium on the cover is unpaid (boolean).
  premium_refund_pct_before_departure: Share of the premium refunded when the cover is cancelled before departure (integer percent).

