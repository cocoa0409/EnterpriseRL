events:
  # ---- holding (service_contracts) ----
  - type: contract_offer_issued
    target: service_contracts
    mutation: create
    meaning: A service contract offer is issued to the customer for one trade lane.
    grain: One row per contract.
    fields: {contract_id: new contract reference, customer_id: customer offered, variant_name: tier offered, trade_lane: lane, mqc_feu: commitment, rate_basis: fixed or index-linked, offer_issued_date: offer date, effective_date: first day of rates, expiry_date: last day of term}
    triggers: []
  - type: contract_countersigned
    target: service_contracts
    mutation: {transition: {from: pending_signature, to: active}}
    meaning: The customer countersigns and the contract takes effect from its effective date.
    grain: One row per countersignature.
    fields: {status: becomes active, signed_date: countersignature date}
    triggers: []
  - type: contract_offer_lapsed
    target: service_contracts
    mutation: {transition: {from: pending_signature, to: terminated}}
    meaning: The offer lapses unsigned.
    grain: One row per lapsed offer.
    fields: {status: becomes terminated, terminated_date: lapse date}
    triggers: []
  - type: contract_suspended
    target: service_contracts
    mutation: {transition: {from: active, to: suspended}}
    meaning: The contract is suspended and accepts no new contract bookings.
    grain: One row per suspension.
    fields: {status: becomes suspended}
    triggers: []
  - type: contract_reinstated
    target: service_contracts
    mutation: {transition: {from: suspended, to: active}}
    meaning: The suspended contract is reinstated.
    grain: One row per reinstatement.
    fields: {status: becomes active}
    triggers: []
  - type: contract_expired
    target: service_contracts
    mutation: {transition: {from: active, to: expired}}
    meaning: The contract term ends.
    grain: One row per expiry.
    fields: {status: becomes expired}
    triggers: []
  - type: contract_terminated_early
    target: service_contracts
    mutation: {transition: {from: active, to: terminated}}
    meaning: The customer ends the contract early by signed notice.
    grain: One row per early termination.
    fields: {status: becomes terminated, terminated_date: termination date}
    triggers: []
  - type: contract_terminated_for_default
    target: service_contracts
    mutation: {transition: {from: suspended, to: terminated}}
    meaning: The line terminates a contract that stayed suspended too long.
    grain: One row per termination for default.
    fields: {status: becomes terminated, terminated_date: termination date}
    triggers: []
  - type: contract_term_extended
    target: service_contracts
    mutation: update
    meaning: The contract term is extended by a signed amendment.
    grain: One row per extension.
    fields: {contract_id: contract extended, expiry_date: new expiry date}
    triggers:
      - event: contract:contract_amendment_filed
        map: {contract_id: contract_id, customer_id: customer_id, amendment_type: term_extension}
  - type: contract_mqc_amended
    target: service_contracts
    mutation: update
    meaning: The minimum quantity commitment is changed by a signed amendment.
    grain: One row per commitment change.
    fields: {contract_id: contract amended, mqc_feu: new commitment}
    triggers:
      - event: contract:contract_amendment_filed
        map: {contract_id: contract_id, customer_id: customer_id, amendment_type: mqc_change}
  # ---- ledger (contract_ledger) ----
  - type: contract_volume_lifted
    target: contract_ledger
    meaning: The volume of a departed contract booking is credited against the commitment.
    grain: One row per booking credited.
    distinguish_by: [booking_id]
    fields: {contract_id: contract credited, customer_id: contract holder, booking_id: booking departed, event_date: departure date, feu_quantity: FEU credited, amount_usd: 0.00}
    account: lifted_volume
    direction: in
    triggers: []
  - type: contract_lifting_reversed
    target: contract_ledger
    meaning: A credited booking is re-rated off the contract and its credit reversed.
    grain: One row per booking reversed.
    distinguish_by: [booking_id]
    fields: {contract_id: contract, customer_id: contract holder, booking_id: booking re-rated, event_date: reversal date, feu_quantity: FEU reversed, reference_event_id: lifting row reversed, amount_usd: 0.00}
    account: lifted_volume
    direction: out
    triggers: []
  - type: contract_shortfall_assessed
    target: contract_ledger
    meaning: Dead freight is assessed for volume short of the commitment for a period.
    grain: One row per assessment period per contract.
    distinguish_by: [assessment_period]
    fields: {contract_id: contract, customer_id: contract holder, event_date: assessment date, assessment_period: quarter or term assessed, feu_quantity: FEU of shortfall charged, amount_usd: dead freight}
    account: shortfall_liability
    direction: in
    triggers: []
  - type: contract_shortfall_paid
    target: contract_ledger
    meaning: A remittance is applied to an assessed shortfall.
    grain: One row per remittance per contract.
    distinguish_by: [payment_reference]
    fields: {contract_id: contract, customer_id: paying holder, event_date: value date, amount_usd: amount remitted, payment_reference: remittance reference quoted by the customer, reference_event_id: assessment paid}
    account: shortfall_liability
    direction: out
    triggers: []
  - type: contract_shortfall_waived
    target: contract_ledger
    meaning: Trade management waives all or part of an assessment for blank sailings or force majeure.
    grain: One row per assessment per waiver reason.
    distinguish_by: [reference_event_id, waiver_reason]
    fields: {contract_id: contract, customer_id: contract holder, event_date: waiver date, amount_usd: amount waived, reference_event_id: assessment waived, waiver_reason: controlled reason}
    account: shortfall_liability
    direction: out
    triggers: []
  - type: contract_rebate_accrued
    target: contract_ledger
    meaning: Volume rebate earned above the threshold is accrued for a period.
    grain: One row per accrual period per contract.
    distinguish_by: [assessment_period]
    fields: {contract_id: contract, customer_id: contract holder, event_date: accrual date, assessment_period: quarter or term, feu_quantity: FEU above threshold, amount_usd: rebate accrued}
    account: volume_rebate
    direction: in
    triggers: []
  - type: contract_rebate_settled
    target: contract_ledger
    meaning: Accrued rebate is settled by credit note or payment.
    grain: One row per accrual settled.
    distinguish_by: [reference_event_id]
    fields: {contract_id: contract, customer_id: contract holder, event_date: settlement date, amount_usd: amount settled, reference_event_id: accrual settled}
    account: volume_rebate
    direction: out
    triggers: []
  - type: contract_amendment_filed
    target: contract_ledger
    meaning: A signed amendment is filed with the regulator and takes effect.
    grain: One row per amendment.
    distinguish_by: [amendment_number]
    fields: {contract_id: contract, customer_id: contract holder, event_date: filing date, amendment_number: sequential number, amendment_type: kind of amendment, amount_usd: 0.00}
    triggers: []
  - type: contract_index_adjusted
    target: contract_ledger
    meaning: The base rate of an index-linked contract is adjusted for a quarter.
    grain: One row per quarter per contract.
    distinguish_by: [assessment_period]
    fields: {contract_id: contract, customer_id: contract holder, event_date: adjustment date, assessment_period: quarter adjusted, amount_usd: signed change per FEU}
    triggers: []

measures:
  - id: contract_msr_lifted_in_period
    window: The assessment period, a contract quarter or the whole term, by the departure dates of the credited bookings.
    measure: Sum of feu_quantity of contract_volume_lifted rows minus the feu_quantity of contract_lifting_reversed rows on the contract_id whose booking departed inside the period.
  - id: contract_msr_amendments_in_term
    window: Life of the contract.
    measure: Count of contract_amendment_filed rows on the contract_id, split by amendment_type when a policy limits one type.
  - id: contract_msr_live_lanes
    window: Current state on the handling date.
    measure: Count of distinct trade_lane values among the customer's contracts in status pending_signature, active or suspended, the contract being handled included.
  - id: contract_msr_portfolio_mqc
    window: Current state on the handling date.
    measure: Sum of mqc_feu over the customer's contracts in status pending_signature, active or suspended, the contract being handled included.
  - id: contract_msr_interim_shortfall
    window: The contract term, before the term-end assessment.
    measure: Sum of feu_quantity of quarterly contract_shortfall_assessed rows on the contract_id.

policies:
  - id: contract_agg_multi_holding
    subject: [contract_offer_issued]
    rule: >-
      A customer may hold several service contracts, one per trade lane; there is no cap on the number of lanes. How contracts combine across
      lanes is governed by contract_agg_lane_and_portfolio.
    eligibility: []
    params: {max_per_customer: null}

  - id: contract_agg_lane_and_portfolio
    subject: [contract_offer_issued]
    rule: >-
      Contracts are aggregated across the customer's portfolio. A customer holds at most one live contract per trade lane, live meaning
      pending_signature, active or suspended; the only overlap allowed is a renewal offer issued under contract_offer_eligibility while the
      current contract on the lane is active, whose effective date must follow the current expiry date. The AHL Global Account Contract and
      AHL Strategic Partner Contract tiers are granted only to a customer whose live contracts, this one included, cover at least
      min_lanes_for_tier distinct lanes, counted by contract_msr_live_lanes, and whose total commitment, contract_msr_portfolio_mqc, reaches
      portfolio_mqc_min_feu. A customer whose portfolio falls short is offered the highest tier its single-lane commitment qualifies for.
    eligibility:
      - id: one_live_per_lane
        applies_to: [contract_offer_issued]
        kind: dedup
        condition: A customer holds at most one live contract per trade lane, live meaning pending_signature, active or suspended; the only overlap allowed is a renewal offer issued under contract_offer_eligibility while the current contract on the lane is active, whose effective date must follow the current expiry date.
        evidence_fields: [service_contracts.customer_id, service_contracts.trade_lane, service_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.customer_id, service_contracts.trade_lane]
          action_bindings: {service_contracts.customer_id: customer_id, service_contracts.trade_lane: trade_lane}
        dedup_contract:
          table: service_contracts
          mode: separate_record
          object_bindings: {customer_id: customer_id, trade_lane: trade_lane}
          duplicate_filters: {status: [pending_signature, active, suspended]}
          distinct_fields: [effective_date]
    params:
      per_tier:
        AHL Starter Service Contract: {min_lanes_for_tier: "=min_lanes_for_tier", portfolio_mqc_min_feu: "=portfolio_mqc_min_feu"}
        AHL Standard Service Contract: {min_lanes_for_tier: "=min_lanes_for_tier", portfolio_mqc_min_feu: "=portfolio_mqc_min_feu"}
        AHL Regional Account Contract: {min_lanes_for_tier: "=min_lanes_for_tier", portfolio_mqc_min_feu: "=portfolio_mqc_min_feu"}
        AHL Key Account Contract: {min_lanes_for_tier: "=min_lanes_for_tier", portfolio_mqc_min_feu: "=portfolio_mqc_min_feu"}
        AHL Global Account Contract: {min_lanes_for_tier: "=min_lanes_for_tier", portfolio_mqc_min_feu: "=portfolio_mqc_min_feu"}
        AHL Strategic Partner Contract: {min_lanes_for_tier: "=min_lanes_for_tier", portfolio_mqc_min_feu: "=portfolio_mqc_min_feu"}
    measures: [contract_msr_live_lanes, contract_msr_portfolio_mqc]

  - id: contract_offer_eligibility
    subject: [contract_offer_issued]
    rule: >-
      An offer is written in the tier whose band contains the commitment: mqc_feu must lie between min_mqc_feu and max_mqc_feu inclusive. The
      term from effective_date to expiry_date must last at least min_term_months and at most max_term_months, the effective date may lie no
      more than effective_date_max_days_after_offer after the offer date, the rate_basis must be one of rate_basis_allowed and the trade_lane
      one of allowed_trade_lanes. The customer's customer_role must be one of the tier's customer_roles_allowed. When the tier's
      credit_approval_required is true, the customer's credit_status must be credit_approved. A renewal offer on a lane with an active
      contract may be issued only from renewal_notice_days before the current expiry date, and renews at the same or a higher tier only when
      the current contract lifted at least renewal_performance_min_pct percent of its commitment by the offer date; otherwise the renewal is
      offered one tier lower, or at the lowest tier whose band holds the new commitment.
    eligibility:
      - id: role_allowed
        applies_to: [contract_offer_issued]
        kind: authorization
        condition: The customer's customer_role must be one of the tier's customer_roles_allowed.
        evidence_fields: [customers.customer_id, customers.customer_role]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings: {customers.customer_id: customer_id}
      - id: credit_approved
        applies_to: [contract_offer_issued]
        kind: authorization
        condition: When the tier's credit_approval_required is true, the customer's credit_status must be credit_approved.
        evidence_fields: [customers.customer_id, customers.credit_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings: {customers.customer_id: customer_id}
    params:
      per_tier:
        AHL Starter Service Contract: {min_mqc_feu: "=min_mqc_feu", max_mqc_feu: "=max_mqc_feu", min_term_months: "=min_term_months", max_term_months: "=max_term_months", renewal_notice_days: "=renewal_notice_days", renewal_performance_min_pct: "=renewal_performance_min_pct"}
        AHL Standard Service Contract: {min_mqc_feu: "=min_mqc_feu", max_mqc_feu: "=max_mqc_feu", min_term_months: "=min_term_months", max_term_months: "=max_term_months", renewal_notice_days: "=renewal_notice_days", renewal_performance_min_pct: "=renewal_performance_min_pct"}
        AHL Regional Account Contract: {min_mqc_feu: "=min_mqc_feu", max_mqc_feu: "=max_mqc_feu", min_term_months: "=min_term_months", max_term_months: "=max_term_months", renewal_notice_days: "=renewal_notice_days", renewal_performance_min_pct: "=renewal_performance_min_pct"}
        AHL Key Account Contract: {min_mqc_feu: "=min_mqc_feu", max_mqc_feu: "=max_mqc_feu", min_term_months: "=min_term_months", max_term_months: "=max_term_months", renewal_notice_days: "=renewal_notice_days", renewal_performance_min_pct: "=renewal_performance_min_pct"}
        AHL Global Account Contract: {min_mqc_feu: "=min_mqc_feu", max_mqc_feu: "=max_mqc_feu", min_term_months: "=min_term_months", max_term_months: "=max_term_months", renewal_notice_days: "=renewal_notice_days", renewal_performance_min_pct: "=renewal_performance_min_pct"}
        AHL Strategic Partner Contract: {min_mqc_feu: "=min_mqc_feu", max_mqc_feu: "=max_mqc_feu", min_term_months: "=min_term_months", max_term_months: "=max_term_months", renewal_notice_days: "=renewal_notice_days", renewal_performance_min_pct: "=renewal_performance_min_pct"}

  - id: contract_countersignature
    subject: [contract_countersigned, contract_offer_lapsed]
    rule: >-
      Only the customer can countersign its contract. The offer must be countersigned no later than the tier's countersign_window_days
      calendar days after the offer was issued. The window ends on the offer_issued_date plus the tier's window days counted on calendar dates,
      and a countersignature on that last day is in time. An offer not countersigned in time lapses and is terminated by the system, and a new
      offer must be issued. Rates apply to cargo received from the effective_date, never to cargo received before it, whatever the signing
      date.
    eligibility:
      - id: countersign_in_window
        applies_to: [contract_countersigned]
        kind: time
        condition: The offer must be countersigned no later than the tier's countersign_window_days calendar days after the offer was issued.
        evidence_fields: [service_contracts.contract_id, service_contracts.offer_issued_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the offer was issued
          anchor_source: service_contracts.offer_issued_date
          relation: not_after
          duration_source: variants.countersign_window_days
          unit: calendar_days
          counting_rule: The window ends on the offer_issued_date plus the tier's window days counted on calendar dates, and a countersignature on that last day is in time.
          boundary: inclusive

  - id: contract_volume_crediting
    subject: [contract_volume_lifted, contract_lifting_reversed]
    rule: >-
      Each contract-rated booking is credited once, when its vessel departs, with the booking's container_count times the FEU factor of its
      equipment_type in feu_factor_map, multiplied by reefer_lift_weight for 20RF and 40RH equipment, rounded to one decimal. A booking is
      credited only when it departed between the contract's effective_date and expiry_date inclusive. Volume may be credited only while the
      contract is active or suspended. Each booking is credited at most once. A booking re-rated off the contract, because it was found to
      belong to another lane or to an unnamed shipper, has its credit reversed in full, referencing the lifting row. A credit may be reversed
      only no later than the tier's rerating_window_days_after_departure calendar days after the booking departed. The window ends on the
      booking's departed_date plus the tier's window days counted on calendar dates, and a reversal on that day is in time. After the window,
      the credit stands.
    eligibility:
      - id: credit_live_contract
        applies_to: [contract_volume_lifted]
        kind: state
        condition: Volume may be credited only while the contract is active or suspended.
        evidence_fields: [service_contracts.contract_id, service_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
        state_contract:
          field: service_contracts.status
          allowed: [active, suspended]
      - id: credit_once
        applies_to: [contract_volume_lifted]
        kind: dedup
        condition: Each booking is credited at most once.
        evidence_fields: [contract_ledger.booking_id, contract_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [contract_ledger.booking_id]
          action_bindings: {contract_ledger.booking_id: booking_id}
        dedup_contract:
          table: contract_ledger
          mode: separate_record
          object_bindings: {booking_id: booking_id}
          duplicate_filters: {event_type: [contract_volume_lifted]}
          distinct_fields: []
      - id: rerating_window
        applies_to: [contract_lifting_reversed]
        kind: time
        condition: A credit may be reversed only no later than the tier's rerating_window_days_after_departure calendar days after the booking departed.
        evidence_fields: [bookings.booking_id, bookings.departed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the booking departed
          anchor_source: bookings.departed_date
          relation: not_after
          duration_source: variants.rerating_window_days_after_departure
          unit: calendar_days
          counting_rule: The window ends on the booking's departed_date plus the tier's window days counted on calendar dates, and a reversal on that day is in time.
          boundary: inclusive
    params:
      per_tier:
        AHL Starter Service Contract: {feu_factor_map: "=feu_factor_map", reefer_lift_weight: "=reefer_lift_weight", rerating_window_days_after_departure: "=rerating_window_days_after_departure"}
        AHL Standard Service Contract: {feu_factor_map: "=feu_factor_map", reefer_lift_weight: "=reefer_lift_weight", rerating_window_days_after_departure: "=rerating_window_days_after_departure"}
        AHL Regional Account Contract: {feu_factor_map: "=feu_factor_map", reefer_lift_weight: "=reefer_lift_weight", rerating_window_days_after_departure: "=rerating_window_days_after_departure"}
        AHL Key Account Contract: {feu_factor_map: "=feu_factor_map", reefer_lift_weight: "=reefer_lift_weight", rerating_window_days_after_departure: "=rerating_window_days_after_departure"}
        AHL Global Account Contract: {feu_factor_map: "=feu_factor_map", reefer_lift_weight: "=reefer_lift_weight", rerating_window_days_after_departure: "=rerating_window_days_after_departure"}
        AHL Strategic Partner Contract: {feu_factor_map: "=feu_factor_map", reefer_lift_weight: "=reefer_lift_weight", rerating_window_days_after_departure: "=rerating_window_days_after_departure"}

  - id: contract_shortfall
    subject: [contract_shortfall_assessed, contract_shortfall_paid, contract_shortfall_waived]
    rule: >-
      Under shortfall_assessment_basis term_end the whole term is assessed once, after expiry or termination: the commitment assessed is the
      mqc_feu, and the shortfall is the commitment minus contract_msr_lifted_in_period for the term. Under quarterly_prorated each contract
      quarter is assessed against a quarter of the mqc_feu, with the excess lifting of the previous quarter carried forward up to
      quarterly_carryover_pct percent of the quarterly commitment, and a term-end true-up assesses the term shortfall minus the FEU already
      assessed in quarters, contract_msr_interim_shortfall, never below zero. A shortfall inside shortfall_tolerance_pct percent of the
      commitment assessed is not charged at all; beyond it, the whole shortfall is charged at dead_freight_per_feu_usd per FEU. An assessment
      below shortfall_min_invoice_usd is not booked. The shortfall is payable within shortfall_payment_days of the assessment date. A payment
      is written with the remittance reference exactly as quoted and may not exceed shortfall_balance_usd. Waivers for blank sailings or port
      closures by force majeure are decided by trade management on its own sailing records and are never granted by the desk on the customer's
      word. A shortfall may be assessed only on a contract that is active, suspended, expired or terminated. Each period is assessed at most
      once.
    eligibility:
      - id: assess_signed_contract
        applies_to: [contract_shortfall_assessed]
        kind: state
        condition: A shortfall may be assessed only on a contract that is active, suspended, expired or terminated.
        evidence_fields: [service_contracts.contract_id, service_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
        state_contract:
          field: service_contracts.status
          allowed: [active, suspended, expired, terminated]
      - id: period_once
        applies_to: [contract_shortfall_assessed]
        kind: dedup
        condition: Each period is assessed at most once.
        evidence_fields: [contract_ledger.contract_id, contract_ledger.assessment_period, contract_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [contract_ledger.contract_id, contract_ledger.assessment_period]
          action_bindings: {contract_ledger.contract_id: contract_id, contract_ledger.assessment_period: assessment_period}
        dedup_contract:
          table: contract_ledger
          mode: separate_record
          object_bindings: {contract_id: contract_id, assessment_period: assessment_period}
          duplicate_filters: {event_type: [contract_shortfall_assessed]}
          distinct_fields: []
    params:
      per_tier:
        AHL Starter Service Contract: {shortfall_tolerance_pct: "=shortfall_tolerance_pct", dead_freight_per_feu_usd: "=dead_freight_per_feu_usd", quarterly_carryover_pct: "=quarterly_carryover_pct", shortfall_min_invoice_usd: "=shortfall_min_invoice_usd", shortfall_payment_days: "=shortfall_payment_days"}
        AHL Standard Service Contract: {shortfall_tolerance_pct: "=shortfall_tolerance_pct", dead_freight_per_feu_usd: "=dead_freight_per_feu_usd", quarterly_carryover_pct: "=quarterly_carryover_pct", shortfall_min_invoice_usd: "=shortfall_min_invoice_usd", shortfall_payment_days: "=shortfall_payment_days"}
        AHL Regional Account Contract: {shortfall_tolerance_pct: "=shortfall_tolerance_pct", dead_freight_per_feu_usd: "=dead_freight_per_feu_usd", quarterly_carryover_pct: "=quarterly_carryover_pct", shortfall_min_invoice_usd: "=shortfall_min_invoice_usd", shortfall_payment_days: "=shortfall_payment_days"}
        AHL Key Account Contract: {shortfall_tolerance_pct: "=shortfall_tolerance_pct", dead_freight_per_feu_usd: "=dead_freight_per_feu_usd", quarterly_carryover_pct: "=quarterly_carryover_pct", shortfall_min_invoice_usd: "=shortfall_min_invoice_usd", shortfall_payment_days: "=shortfall_payment_days"}
        AHL Global Account Contract: {shortfall_tolerance_pct: "=shortfall_tolerance_pct", dead_freight_per_feu_usd: "=dead_freight_per_feu_usd", quarterly_carryover_pct: "=quarterly_carryover_pct", shortfall_min_invoice_usd: "=shortfall_min_invoice_usd", shortfall_payment_days: "=shortfall_payment_days"}
        AHL Strategic Partner Contract: {shortfall_tolerance_pct: "=shortfall_tolerance_pct", dead_freight_per_feu_usd: "=dead_freight_per_feu_usd", quarterly_carryover_pct: "=quarterly_carryover_pct", shortfall_min_invoice_usd: "=shortfall_min_invoice_usd", shortfall_payment_days: "=shortfall_payment_days"}
    formula:
      term_shortfall_feu: max(0, mqc_feu - contract_msr_lifted_in_period)
      charged_feu: 0 if term_shortfall_feu <= mqc_feu * shortfall_tolerance_pct / 100 else term_shortfall_feu
      amount_usd: charged_feu * dead_freight_per_feu_usd
    measures: [contract_msr_lifted_in_period, contract_msr_interim_shortfall]

  - id: contract_volume_rebate
    subject: [contract_rebate_accrued, contract_rebate_settled]
    rule: >-
      A tier whose rebate_threshold_pct_of_mqc is above 0 earns a volume rebate. At each rebate_accrual_frequency date the FEU lifted in the
      period above rebate_threshold_pct_of_mqc percent of the commitment for that period earn rebate_per_feu_usd each, and the accruals of a
      term never exceed rebate_cap_usd in total. Rebate is not accrued for a period while any shortfall assessment on the contract remains
      unpaid, and a contract terminated for default forfeits its unsettled rebate. Accrued rebate is settled by the tier's
      rebate_settlement_method once the unsettled accruals reach rebate_min_payout_usd, each settlement referencing the accrual it settles.
      Rebate may be accrued only on a contract that is active or expired. Each period accrues at most once.
    eligibility:
      - id: accrue_on_performing_contract
        applies_to: [contract_rebate_accrued]
        kind: state
        condition: Rebate may be accrued only on a contract that is active or expired.
        evidence_fields: [service_contracts.contract_id, service_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
        state_contract:
          field: service_contracts.status
          allowed: [active, expired]
      - id: accrue_once
        applies_to: [contract_rebate_accrued]
        kind: dedup
        condition: Each period accrues at most once.
        evidence_fields: [contract_ledger.contract_id, contract_ledger.assessment_period, contract_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [contract_ledger.contract_id, contract_ledger.assessment_period]
          action_bindings: {contract_ledger.contract_id: contract_id, contract_ledger.assessment_period: assessment_period}
        dedup_contract:
          table: contract_ledger
          mode: separate_record
          object_bindings: {contract_id: contract_id, assessment_period: assessment_period}
          duplicate_filters: {event_type: [contract_rebate_accrued]}
          distinct_fields: []
    params:
      per_tier:
        AHL Starter Service Contract: {rebate_threshold_pct_of_mqc: "=rebate_threshold_pct_of_mqc", rebate_per_feu_usd: "=rebate_per_feu_usd", rebate_cap_usd: "=rebate_cap_usd", rebate_min_payout_usd: "=rebate_min_payout_usd", rebate_settlement_method: "=rebate_settlement_method", rebate_accrual_frequency: "=rebate_accrual_frequency"}
        AHL Standard Service Contract: {rebate_threshold_pct_of_mqc: "=rebate_threshold_pct_of_mqc", rebate_per_feu_usd: "=rebate_per_feu_usd", rebate_cap_usd: "=rebate_cap_usd", rebate_min_payout_usd: "=rebate_min_payout_usd", rebate_settlement_method: "=rebate_settlement_method", rebate_accrual_frequency: "=rebate_accrual_frequency"}
        AHL Regional Account Contract: {rebate_threshold_pct_of_mqc: "=rebate_threshold_pct_of_mqc", rebate_per_feu_usd: "=rebate_per_feu_usd", rebate_cap_usd: "=rebate_cap_usd", rebate_min_payout_usd: "=rebate_min_payout_usd", rebate_settlement_method: "=rebate_settlement_method", rebate_accrual_frequency: "=rebate_accrual_frequency"}
        AHL Key Account Contract: {rebate_threshold_pct_of_mqc: "=rebate_threshold_pct_of_mqc", rebate_per_feu_usd: "=rebate_per_feu_usd", rebate_cap_usd: "=rebate_cap_usd", rebate_min_payout_usd: "=rebate_min_payout_usd", rebate_settlement_method: "=rebate_settlement_method", rebate_accrual_frequency: "=rebate_accrual_frequency"}
        AHL Global Account Contract: {rebate_threshold_pct_of_mqc: "=rebate_threshold_pct_of_mqc", rebate_per_feu_usd: "=rebate_per_feu_usd", rebate_cap_usd: "=rebate_cap_usd", rebate_min_payout_usd: "=rebate_min_payout_usd", rebate_settlement_method: "=rebate_settlement_method", rebate_accrual_frequency: "=rebate_accrual_frequency"}
        AHL Strategic Partner Contract: {rebate_threshold_pct_of_mqc: "=rebate_threshold_pct_of_mqc", rebate_per_feu_usd: "=rebate_per_feu_usd", rebate_cap_usd: "=rebate_cap_usd", rebate_min_payout_usd: "=rebate_min_payout_usd", rebate_settlement_method: "=rebate_settlement_method", rebate_accrual_frequency: "=rebate_accrual_frequency"}
    measures: [contract_msr_lifted_in_period]

  - id: contract_index_adjustment
    subject: [contract_index_adjusted]
    rule: >-
      An index_linked contract's base rate is re-indexed at the start of each contract quarter against the line's published freight index for
      the lane. When the index moved by no more than index_band_pct percent over the previous quarter, no adjustment is made and no row is
      written. Beyond the band, the base rate changes by index_pass_through_pct percent of the whole index movement applied to the base rate,
      capped at index_adjustment_cap_per_feu_usd per FEU up or down, and the signed change per FEU is recorded for the quarter. Fixed_rate
      contracts are never re-indexed. An adjustment may be booked only on a contract that is active or suspended.
    eligibility:
      - id: adjust_live_contract
        applies_to: [contract_index_adjusted]
        kind: state
        condition: An adjustment may be booked only on a contract that is active or suspended.
        evidence_fields: [service_contracts.contract_id, service_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
        state_contract:
          field: service_contracts.status
          allowed: [active, suspended]

  - id: contract_amendments
    subject: [contract_term_extended, contract_mqc_amended, contract_amendment_filed]
    rule: >-
      Amendments are requested by the contract holder, take effect only once the customer has signed them, and are filed the same day, never
      with a retroactive effective date. A contract takes at most max_amendments_per_term filed amendments, counted by
      contract_msr_amendments_in_term. A term extension may be requested only from the tier's term_extension_window_days_before_expiry calendar
      days before the contract expires. The window opens on the expiry_date minus the tier's window days counted on calendar dates, and a
      request on the opening day is inside it. An extension moves the expiry_date by at most term_extension_max_days, and a contract takes at
      most max_term_extensions extensions. A commitment change must be filed at least mqc_amendment_min_days_before_expiry before expiry; an
      increase may add at most mqc_increase_max_pct percent of the current mqc_feu, and a reduction is possible only when mqc_decrease_allowed
      is true and by at most mqc_decrease_max_pct percent. A commitment that leaves the tier's band keeps the tier for the rest of the term and
      is rebanded only at renewal. Named accounts may be added up to named_accounts_max in total, and rate revisions are possible only when
      rate_revision_allowed_mid_term is true, at most max_rate_revisions_per_term times. Amendments may be filed only on an active contract.
    eligibility:
      - id: extension_window
        applies_to: [contract_term_extended]
        kind: time
        condition: A term extension may be requested only from the tier's term_extension_window_days_before_expiry calendar days before the contract expires.
        evidence_fields: [service_contracts.contract_id, service_contracts.expiry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract expires
          anchor_source: service_contracts.expiry_date
          relation: not_before
          duration_source: variants.term_extension_window_days_before_expiry
          unit: calendar_days
          counting_rule: The window opens on the expiry_date minus the tier's window days counted on calendar dates, and a request on the opening day is inside it.
          boundary: inclusive
      - id: amendment_cap
        applies_to: [contract_amendment_filed]
        kind: authorization
        condition: A contract takes at most max_amendments_per_term filed amendments, counted by contract_msr_amendments_in_term.
        evidence_fields: [contract_ledger.contract_id, contract_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [contract_ledger.contract_id]
          action_bindings: {contract_ledger.contract_id: contract_id}
      - id: amend_active
        applies_to: [contract_amendment_filed]
        kind: state
        condition: Amendments may be filed only on an active contract.
        evidence_fields: [service_contracts.contract_id, service_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
        state_contract:
          field: service_contracts.status
          allowed: [active]
    params:
      per_tier:
        AHL Starter Service Contract: {term_extension_max_days: "=term_extension_max_days", max_term_extensions: "=max_term_extensions", mqc_increase_max_pct: "=mqc_increase_max_pct", mqc_decrease_max_pct: "=mqc_decrease_max_pct", max_amendments_per_term: "=max_amendments_per_term", named_accounts_max: "=named_accounts_max", max_rate_revisions_per_term: "=max_rate_revisions_per_term"}
        AHL Standard Service Contract: {term_extension_max_days: "=term_extension_max_days", max_term_extensions: "=max_term_extensions", mqc_increase_max_pct: "=mqc_increase_max_pct", mqc_decrease_max_pct: "=mqc_decrease_max_pct", max_amendments_per_term: "=max_amendments_per_term", named_accounts_max: "=named_accounts_max", max_rate_revisions_per_term: "=max_rate_revisions_per_term"}
        AHL Regional Account Contract: {term_extension_max_days: "=term_extension_max_days", max_term_extensions: "=max_term_extensions", mqc_increase_max_pct: "=mqc_increase_max_pct", mqc_decrease_max_pct: "=mqc_decrease_max_pct", max_amendments_per_term: "=max_amendments_per_term", named_accounts_max: "=named_accounts_max", max_rate_revisions_per_term: "=max_rate_revisions_per_term"}
        AHL Key Account Contract: {term_extension_max_days: "=term_extension_max_days", max_term_extensions: "=max_term_extensions", mqc_increase_max_pct: "=mqc_increase_max_pct", mqc_decrease_max_pct: "=mqc_decrease_max_pct", max_amendments_per_term: "=max_amendments_per_term", named_accounts_max: "=named_accounts_max", max_rate_revisions_per_term: "=max_rate_revisions_per_term"}
        AHL Global Account Contract: {term_extension_max_days: "=term_extension_max_days", max_term_extensions: "=max_term_extensions", mqc_increase_max_pct: "=mqc_increase_max_pct", mqc_decrease_max_pct: "=mqc_decrease_max_pct", max_amendments_per_term: "=max_amendments_per_term", named_accounts_max: "=named_accounts_max", max_rate_revisions_per_term: "=max_rate_revisions_per_term"}
        AHL Strategic Partner Contract: {term_extension_max_days: "=term_extension_max_days", max_term_extensions: "=max_term_extensions", mqc_increase_max_pct: "=mqc_increase_max_pct", mqc_decrease_max_pct: "=mqc_decrease_max_pct", max_amendments_per_term: "=max_amendments_per_term", named_accounts_max: "=named_accounts_max", max_rate_revisions_per_term: "=max_rate_revisions_per_term"}
    measures: [contract_msr_amendments_in_term]

  - id: contract_default_and_expiry
    subject: [contract_suspended, contract_reinstated, contract_terminated_for_default, contract_expired]
    rule: >-
      A contract is suspended when a shortfall assessment is still unpaid suspension_after_overdue_days calendar days after its payment due
      date, or when the customer's credit_status becomes credit_hold. A suspended contract accepts no new contract bookings, while bookings
      already confirmed sail and are credited. It is reinstated once every overdue shortfall is paid and the credit hold, if any, is lifted.
      A contract is suspended for an overdue shortfall only when an assessment on it remains unpaid after its due date plus the tier's
      suspension_after_overdue_days. A contract that stays suspended for termination_after_suspension_days calendar days may be terminated by
      the line for default, and every outstanding shortfall stays payable. A contract that reaches its expiry_date expires, and the term-end
      shortfall and rebate are then settled under contract_shortfall and contract_volume_rebate.
    eligibility:
      - id: overdue_shortfall
        applies_to: [contract_suspended]
        kind: authorization
        condition: A contract is suspended for an overdue shortfall only when an assessment on it remains unpaid after its due date plus the tier's suspension_after_overdue_days.
        evidence_fields: [contract_ledger.contract_id, contract_ledger.event_type, contract_ledger.event_date, service_contracts.shortfall_balance_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [contract_ledger.contract_id]
          action_bindings: {contract_ledger.contract_id: contract_id}
    params:
      per_tier:
        AHL Starter Service Contract: {suspension_after_overdue_days: "=suspension_after_overdue_days", termination_after_suspension_days: "=termination_after_suspension_days"}
        AHL Standard Service Contract: {suspension_after_overdue_days: "=suspension_after_overdue_days", termination_after_suspension_days: "=termination_after_suspension_days"}
        AHL Regional Account Contract: {suspension_after_overdue_days: "=suspension_after_overdue_days", termination_after_suspension_days: "=termination_after_suspension_days"}
        AHL Key Account Contract: {suspension_after_overdue_days: "=suspension_after_overdue_days", termination_after_suspension_days: "=termination_after_suspension_days"}
        AHL Global Account Contract: {suspension_after_overdue_days: "=suspension_after_overdue_days", termination_after_suspension_days: "=termination_after_suspension_days"}
        AHL Strategic Partner Contract: {suspension_after_overdue_days: "=suspension_after_overdue_days", termination_after_suspension_days: "=termination_after_suspension_days"}

  - id: contract_early_termination
    subject: [contract_terminated_early]
    rule: >-
      Only the customer can terminate its contract early, by signed notice. Early termination is possible only once the tier's
      early_termination_min_months_elapsed calendar months of the term have run from the effective date. The earliest date falls on the same
      day of the month that many months after the effective_date, or on the last day of that month when it has no such day. The termination
      takes effect early_termination_notice_days after the notice, and the term is then assessed for shortfall on the
      early_termination_shortfall_basis: against the full mqc_feu under full_term, or against the mqc_feu prorated by the calendar days run
      over the calendar days of the whole term under prorated_to_termination. Unsettled rebate is settled at termination.
    eligibility:
      - id: minimum_run
        applies_to: [contract_terminated_early]
        kind: time
        condition: Early termination is possible only once the tier's early_termination_min_months_elapsed calendar months of the term have run from the effective date.
        evidence_fields: [service_contracts.contract_id, service_contracts.effective_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the effective date
          anchor_source: service_contracts.effective_date
          relation: not_before
          duration_source: variants.early_termination_min_months_elapsed
          unit: calendar_months
          counting_rule: The earliest date falls on the same day of the month that many months after the effective_date, or on the last day of that month when it has no such day.
          boundary: inclusive
    params:
      per_tier:
        AHL Starter Service Contract: {early_termination_notice_days: "=early_termination_notice_days", early_termination_shortfall_basis: "=early_termination_shortfall_basis"}
        AHL Standard Service Contract: {early_termination_notice_days: "=early_termination_notice_days", early_termination_shortfall_basis: "=early_termination_shortfall_basis"}
        AHL Regional Account Contract: {early_termination_notice_days: "=early_termination_notice_days", early_termination_shortfall_basis: "=early_termination_shortfall_basis"}
        AHL Key Account Contract: {early_termination_notice_days: "=early_termination_notice_days", early_termination_shortfall_basis: "=early_termination_shortfall_basis"}
        AHL Global Account Contract: {early_termination_notice_days: "=early_termination_notice_days", early_termination_shortfall_basis: "=early_termination_shortfall_basis"}
        AHL Strategic Partner Contract: {early_termination_notice_days: "=early_termination_notice_days", early_termination_shortfall_basis: "=early_termination_shortfall_basis"}
