category: contract
display_name: Service Contracts

# Functional closure (real capabilities of a service contract and key account desk, each carried below):
#   offer and admission per lane, tier bands, portfolio conditions, renewals (contract_offer_issued; contract_offer_eligibility, contract_agg_lane_and_portfolio, contract_agg_multi_holding)
#   countersignature or lapse of the offer (contract_countersigned, contract_offer_lapsed; contract_countersignature)
#   volume credited from departed bookings and its reversal on re-rating (contract_volume_lifted, contract_lifting_reversed; contract_volume_crediting)
#   minimum quantity commitment shortfall: assessment, payment, waiver (contract_shortfall_assessed, contract_shortfall_paid, contract_shortfall_waived; contract_shortfall)
#   volume rebates (contract_rebate_accrued, contract_rebate_settled; contract_volume_rebate)
#   quarterly re-indexing of index-linked rates (contract_index_adjusted; contract_index_adjustment)
#   amendments: term extension, commitment changes, named accounts, rate revisions (contract_term_extended, contract_mqc_amended, contract_amendment_filed; contract_amendments)
#   suspension, reinstatement, termination for default, expiry (contract_suspended, contract_reinstated, contract_terminated_for_default, contract_expired; contract_default_and_expiry)
#   early termination by the customer (contract_terminated_early; contract_early_termination)

binding:
  holding_table: service_contracts
  event_tables: [contract_ledger]
  intake_tables: [contract_amendment_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {lifted_feu: lifted_volume, shortfall_balance_usd: shortfall_liability, rebate_balance_usd: volume_rebate}

lifecycle:
  states: [pending_signature, active, suspended, expired, terminated]
  transitions:
    - {from: pending_signature, to: active, by: user, means: The customer countersigns the contract offer.}
    - {from: pending_signature, to: terminated, by: system, means: The offer lapses unsigned at the end of the countersignature window.}
    - {from: active, to: suspended, by: agent, means: The contract is suspended for an overdue shortfall or a credit hold.}
    - {from: suspended, to: active, by: agent, means: The contract is reinstated once the cause of suspension is cleared.}
    - {from: active, to: expired, by: system, means: The contract term ends.}
    - {from: active, to: terminated, by: user, means: The customer terminates early by signed notice.}
    - {from: suspended, to: terminated, by: agent, means: The line terminates the contract after a prolonged suspension.}

accounts:
  - key: lifted_volume
    unit: FEU
    meaning: Volume credited against the minimum quantity commitment — liftings in, reversals out.
  - key: shortfall_liability
    unit: USD
    meaning: Dead freight owed for volume short of the commitment — assessments in, payments and waivers out.
  - key: volume_rebate
    unit: USD
    meaning: Volume rebate earned above the commitment and not yet settled — accruals in, settlements out.

parameter_schema:
  min_mqc_feu: Lowest minimum quantity commitment of the tier (integer FEU per term).
  max_mqc_feu: Highest minimum quantity commitment of the tier (integer FEU per term).
  min_term_months: Shortest contract term (integer calendar months).
  max_term_months: Longest contract term (integer calendar months).
  countersign_window_days: Calendar days after the offer within which the customer must countersign (integer days).
  effective_date_max_days_after_offer: Latest effective date, in calendar days after the offer (integer days).
  rate_basis_allowed: Rate bases the tier may be written on (list of fixed_rate, index_linked).
  index_band_pct: Movement of the published freight index, in percent, inside which no quarterly adjustment is made (integer percent).
  index_pass_through_pct: Share of the index movement passed through to the contract rate (integer percent).
  index_adjustment_cap_per_feu_usd: Largest quarterly adjustment of the base rate, up or down (USD per FEU).
  allowed_trade_lanes: Trade lanes on which the tier may be written (list of trade_lane values).
  customer_roles_allowed: Customer roles that may hold the tier (list of customers.customer_role values).
  credit_approval_required: Whether the customer must be credit_approved to hold the tier (boolean).
  min_lanes_for_tier: Distinct trade lanes on which the customer must hold live contracts, this one included (integer lanes).
  portfolio_mqc_min_feu: Total commitment across the customer's live contracts, this one included, required for the tier (integer FEU).
  renewal_notice_days: Calendar days before expiry from which a renewal offer on the same lane may be issued (integer days).
  renewal_performance_min_pct: Volume lifted, as percent of the commitment, needed to renew at the same or a higher tier (integer percent).
  feu_factor_map: FEU credited per container by equipment type (mapping of equipment_type to decimal FEU).
  reefer_lift_weight: Multiplier on the FEU credited for reefer equipment (decimal).
  rerating_window_days_after_departure: Calendar days after departure within which a booking may be re-rated off the contract, reversing its credit (integer days).
  shortfall_assessment_basis: When the shortfall is assessed — term_end, or quarterly_prorated with a term-end true-up (enum string).
  shortfall_tolerance_pct: Shortfall inside which nothing is charged, as percent of the commitment assessed (integer percent).
  dead_freight_per_feu_usd: Dead freight per FEU of shortfall beyond tolerance (USD per FEU).
  quarterly_carryover_pct: Excess lifting of a quarter carried into the next quarter's assessment, as percent of the quarterly commitment (integer percent).
  shortfall_min_invoice_usd: Shortfall amount below which no assessment is booked (USD per assessment).
  shortfall_payment_days: Calendar days after the assessment within which the shortfall is payable (integer days).
  suspension_after_overdue_days: Calendar days after the payment due date after which an unpaid shortfall suspends the contract (integer days).
  termination_after_suspension_days: Calendar days of continuous suspension after which the line may terminate the contract (integer days).
  rebate_accrual_frequency: When the volume rebate is accrued — term_end or quarterly (enum string).
  rebate_threshold_pct_of_mqc: Lifting, as percent of the commitment assessed, above which the rebate is earned; 0 when the tier earns none (integer percent).
  rebate_per_feu_usd: Rebate per FEU lifted above the threshold (USD per FEU).
  rebate_cap_usd: Largest rebate accrued per term (USD per term).
  rebate_min_payout_usd: Accrued rebate below which settlement is deferred to the next settlement date (USD).
  rebate_settlement_method: How rebates are settled — credit_note or cash (enum string).
  term_extension_max_days: Longest single term extension (integer calendar days).
  term_extension_window_days_before_expiry: Calendar days before expiry from which an extension may be requested (integer days).
  max_term_extensions: Term extensions per contract (integer).
  mqc_increase_max_pct: Largest increase of the commitment by amendment, as percent of the current commitment (integer percent).
  mqc_decrease_allowed: Whether the commitment may be reduced by amendment (boolean).
  mqc_decrease_max_pct: Largest reduction of the commitment by amendment, as percent of the current commitment (integer percent).
  mqc_amendment_min_days_before_expiry: Latest a commitment change may be filed, in calendar days before expiry (integer days).
  max_amendments_per_term: Filed amendments per contract term (integer).
  rate_revision_allowed_mid_term: Whether the base rates may be revised by amendment during the term (boolean).
  max_rate_revisions_per_term: Rate revisions per term (integer).
  named_accounts_max: Affiliated companies that may be named to book under the contract (integer).
  early_termination_notice_days: Notice the customer must give for early termination (integer calendar days).
  early_termination_min_months_elapsed: Calendar months of the term that must have run before early termination (integer months).
  early_termination_shortfall_basis: Commitment against which shortfall is assessed on early termination — full_term or prorated_to_termination (enum string).

