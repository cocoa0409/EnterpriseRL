events:
  # ---- holding (reefer_services) ----
  - type: reefer_service_requested
    target: reefer_services
    mutation: create
    meaning: A reefer service is ordered for one container of a reefer booking.
    grain: One row per container per booking.
    fields: {reefer_id: new service reference, customer_id: ordering party, variant_name: tier, booking_id: booking, container_number: reefer container, commodity: commodity, setpoint_celsius: carrying temperature, ventilation_cbm_h: ventilation, humidity_pct: humidity set point, atmosphere_o2_pct: oxygen set point, atmosphere_co2_pct: carbon dioxide set point, requested_date: order date}
    triggers: []
  - type: reefer_pti_completed
    target: reefer_services
    mutation: {transition: {from: requested, to: pti_passed}}
    meaning: The reefer passes its pre-trip inspection.
    grain: One row per service inspected.
    fields: {status: becomes pti_passed}
    triggers:
      - event: reefer:reefer_pti_charged
        map: {reefer_id: reefer_id, customer_id: customer_id, charge_code: pti_fee}
  - type: reefer_plugged_in
    target: reefer_services
    mutation: {transition: {from: pti_passed, to: plugged_in}}
    meaning: The laden reefer is plugged in at the load terminal.
    grain: One row per plug-in.
    fields: {status: becomes plugged_in, plugged_in_date: plug-in date}
    triggers: []
  - type: reefer_departed
    target: reefer_services
    mutation: {transition: {from: plugged_in, to: in_transit}}
    meaning: The reefer is loaded and the vessel departs.
    grain: One row per departure.
    fields: {status: becomes in_transit, variant_name: tier carried}
    triggers:
      - event: reefer:reefer_special_service_charged
        when: {variant_name: AHL Reefer Cold Treatment}
        map: {reefer_id: reefer_id, customer_id: customer_id, charge_code: cold_treatment_fee}
      - event: reefer:reefer_special_service_charged
        when: {variant_name: AHL Reefer Controlled Atmosphere}
        map: {reefer_id: reefer_id, customer_id: customer_id, charge_code: controlled_atmosphere_surcharge}
      - event: reefer:reefer_special_service_charged
        when: {variant_name: AHL Reefer Pharma GDP}
        map: {reefer_id: reefer_id, customer_id: customer_id, charge_code: gdp_handling_fee}
      - event: reefer:reefer_special_service_charged
        when: {variant_name: AHL Reefer Superfreezer}
        map: {reefer_id: reefer_id, customer_id: customer_id, charge_code: superfreezer_surcharge}
  - type: reefer_delivered
    target: reefer_services
    mutation: {transition: {from: in_transit, to: delivered}}
    meaning: The laden reefer leaves the discharge terminal.
    grain: One row per delivery.
    fields: {status: becomes delivered, delivered_date: delivery date, variant_name: tier carried}
    triggers:
      - event: reefer:reefer_special_service_charged
        when: {variant_name: {not: AHL Reefer Standard}}
        map: {reefer_id: reefer_id, customer_id: customer_id, charge_code: remote_monitoring_fee}
  - type: reefer_closed
    target: reefer_services
    mutation: {transition: {from: delivered, to: closed}}
    meaning: The reefer service file is closed.
    grain: One row per closure.
    fields: {status: becomes closed}
    triggers: []
  - type: reefer_service_cancelled
    target: reefer_services
    mutation: {transition: [{from: requested, to: cancelled}, {from: pti_passed, to: cancelled}]}
    meaning: The reefer service is cancelled before plug-in.
    grain: One row per cancellation.
    fields: {status: becomes cancelled}
    triggers: []
  - type: reefer_settings_changed
    target: reefer_services
    mutation: update
    meaning: The shipper's written instruction changes the carrying settings.
    grain: One row per change instruction applied.
    fields: {setpoint_celsius: new set point, ventilation_cbm_h: new ventilation, humidity_pct: new humidity set point, atmosphere_o2_pct: new oxygen set point, atmosphere_co2_pct: new carbon dioxide set point}
    triggers: []
  # ---- ledger (reefer_ledger) ----
  - type: reefer_pti_charged
    target: reefer_ledger
    meaning: A pre-trip inspection, first or repeat, is charged.
    grain: One row per inspection.
    distinguish_by: [event_date]
    fields: {reefer_id: service, customer_id: ordering party, event_date: inspection date, charge_code: pti_fee, amount_usd: fee, location_code: depot port}
    account: reefer_charges
    direction: in
    triggers: []
  - type: reefer_plug_in_charged
    target: reefer_ledger
    meaning: Plug-in days beyond free days at a terminal are charged.
    grain: One row per terminal stay.
    distinguish_by: [location_code, event_date]
    fields: {reefer_id: service, customer_id: ordering party, event_date: last plug-in day, charge_code: plug_in_monitoring, amount_usd: fee, plug_days: days charged, location_code: terminal port}
    account: reefer_charges
    direction: in
    triggers: []
  - type: reefer_special_service_charged
    target: reefer_ledger
    meaning: A special service, remote monitoring, a late request or a cancellation after inspection is charged.
    grain: One row per charge code per service.
    distinguish_by: [charge_code]
    fields: {reefer_id: service, customer_id: ordering party, event_date: charge date, charge_code: the service or fee charged, amount_usd: fee}
    account: reefer_charges
    direction: in
    triggers: []
  - type: reefer_setpoint_change_charged
    target: reefer_ledger
    meaning: A setting change is recorded with its fee, 0.00 when inside the free allowance.
    grain: One row per change day; several instructions on one day are one change.
    distinguish_by: [event_date]
    fields: {reefer_id: service, customer_id: ordering party, event_date: change date, charge_code: setpoint_change_fee, amount_usd: fee or 0.00}
    account: reefer_charges
    direction: in
    triggers: []
  - type: reefer_excursion_recorded
    target: reefer_ledger
    meaning: A temperature excursion logged by the unit is recorded.
    grain: One row per excursion.
    distinguish_by: [event_date, location_code, excursion_minutes]
    fields: {reefer_id: service, customer_id: ordering party, event_date: excursion start date, charge_code: excursion_log, amount_usd: 0.00, location_code: port or last port of the vessel, excursion_minutes: continuous minutes outside tolerance, recorded_temp_celsius: peak deviation temperature}
    triggers: []
  - type: reefer_excursion_credited
    target: reefer_ledger
    meaning: An excursion credit is granted against the service charges.
    grain: One row per excursion credited.
    distinguish_by: [reference_event_id]
    fields: {reefer_id: service, customer_id: ordering party, event_date: credit date, charge_code: excursion_credit, amount_usd: credit, reference_event_id: excursion row credited}
    account: reefer_charges
    direction: out
    triggers: []
  - type: reefer_payment_received
    target: reefer_ledger
    meaning: A remittance is applied to the service charges.
    grain: One row per remittance per service.
    distinguish_by: [payment_reference]
    fields: {reefer_id: service, customer_id: paying party, event_date: value date, charge_code: payment, amount_usd: amount remitted, payment_reference: remittance reference quoted by the customer}
    account: reefer_charges
    direction: out
    triggers: []
  - type: reefer_charge_waived
    target: reefer_ledger
    meaning: A fee row is waived as goodwill.
    grain: One row per fee row waived.
    distinguish_by: [reference_event_id]
    fields: {reefer_id: service, customer_id: ordering party, event_date: waiver date, charge_code: waiver, amount_usd: full amount of the referenced row, reference_event_id: fee row waived}
    account: reefer_charges
    direction: out
    triggers: []

measures:
  - id: reefer_msr_setting_changes
    window: Life of the service, before the change being handled.
    measure: Count of reefer_setpoint_change_charged rows on the reefer_id, including rows recorded at 0.00.
  - id: reefer_msr_excursion_credits
    window: Life of the service.
    measure: Count of reefer_excursion_credited rows on the reefer_id.
  - id: reefer_msr_credit_basis
    window: Life of the service up to the credit date.
    measure: Sum of amount_usd of reefer_ledger rows on the reefer_id whose charge_code is in the tier's excursion_credit_basis_codes.
  - id: reefer_msr_goodwill_waivers_365d
    window: Trailing 365 calendar days ending on the waiver date, inclusive, across all services of the customer.
    measure: Count of reefer_charge_waived rows for the customer_id with event_date inside the window.

policies:
  - id: reefer_agg_multi_holding
    subject: [reefer_service_requested]
    rule: >-
      A customer may hold any number of reefer services. Each reefer container of a booking has at most one live service, live meaning any
      status other than cancelled.
    eligibility:
      - id: one_service_per_container
        applies_to: [reefer_service_requested]
        kind: dedup
        condition: Each reefer container of a booking has at most one live service, live meaning any status other than cancelled.
        evidence_fields: [reefer_services.booking_id, reefer_services.container_number, reefer_services.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_services.booking_id, reefer_services.container_number]
          action_bindings: {reefer_services.booking_id: booking_id, reefer_services.container_number: container_number}
        dedup_contract:
          table: reefer_services
          mode: separate_record
          object_bindings: {booking_id: booking_id, container_number: container_number}
          duplicate_filters: {status: [requested, pti_passed, plugged_in, in_transit, delivered, closed]}
          distinct_fields: []
    params: {max_per_customer: null}

  - id: reefer_agg_booking_uniformity
    subject: [reefer_service_requested, reefer_settings_changed]
    rule: >-
      The reefer services of one booking are held together. Every live service on a booking must carry the same tier, commodity and set
      point, because one booking moves one commodity under one set of carrying instructions. A new service or a setting change that would
      break this uniformity is refused; the customer changes all services of the booking together, each change recorded on each service.
    eligibility:
      - id: uniform_booking
        applies_to: [reefer_service_requested, reefer_settings_changed]
        kind: authorization
        condition: Every live service on a booking must carry the same tier, commodity and set point, because one booking moves one commodity under one set of carrying instructions.
        evidence_fields: [reefer_services.booking_id, reefer_services.variant_name, reefer_services.commodity, reefer_services.setpoint_celsius]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_services.booking_id]
          action_bindings: {reefer_services.booking_id: booking_id}

  - id: reefer_service_eligibility
    subject: [reefer_service_requested, reefer_special_service_charged]
    rule: >-
      A reefer service is ordered only for a booking whose cargo_type is reefer and whose status is requested or confirmed. The booking's
      equipment_type must be in the tier's allowed_equipment_types and its trade_lane in allowed_trade_lanes, and the commodity must be one of
      eligible_commodities unless that list is all. The set point must lie between setpoint_min_celsius and setpoint_max_celsius inclusive;
      ventilation above 0 is accepted only when ventilation_allowed is true and up to ventilation_max_cbm_h; a humidity set point above 0 only
      when humidity_control_available is true and between humidity_setpoint_min_pct and humidity_setpoint_max_pct; oxygen between ca_o2_min_pct
      and ca_o2_max_pct and carbon dioxide up to ca_co2_max_pct. A request received later than the tier's request_lead_days_before_etd calendar
      days before the scheduled departure date is accepted only when late_request_accepted is true, and then with the late request fee. The
      request is on time when its date is no later than the booking's etd_date minus the tier's lead days counted on calendar dates. A late
      request on a tier that accepts one is charged late_request_fee_usd once.
    eligibility:
      - id: reefer_booking
        applies_to: [reefer_service_requested]
        kind: state
        condition: A reefer service is ordered only for a booking whose cargo_type is reefer and whose status is requested or confirmed.
        evidence_fields: [bookings.booking_id, bookings.status, bookings.cargo_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        state_contract:
          field: bookings.status
          allowed: [requested, confirmed]
      - id: request_lead_time
        applies_to: [reefer_service_requested]
        kind: time
        condition: A request received later than the tier's request_lead_days_before_etd calendar days before the scheduled departure date is accepted only when late_request_accepted is true, and then with the late request fee.
        evidence_fields: [bookings.booking_id, bookings.etd_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the scheduled departure date
          anchor_source: bookings.etd_date
          relation: not_after
          duration_source: variants.request_lead_days_before_etd
          unit: calendar_days
          counting_rule: The request is on time when its date is no later than the booking's etd_date minus the tier's lead days counted on calendar dates.
          boundary: inclusive
    params:
      per_tier:
        AHL Reefer Standard: {setpoint_min_celsius: "=setpoint_min_celsius", setpoint_max_celsius: "=setpoint_max_celsius", request_lead_days_before_etd: "=request_lead_days_before_etd", late_request_accepted: "=late_request_accepted", late_request_fee_usd: "=late_request_fee_usd"}
        AHL Reefer Monitored: {setpoint_min_celsius: "=setpoint_min_celsius", setpoint_max_celsius: "=setpoint_max_celsius", request_lead_days_before_etd: "=request_lead_days_before_etd", late_request_accepted: "=late_request_accepted", late_request_fee_usd: "=late_request_fee_usd"}
        AHL Reefer Cold Treatment: {setpoint_min_celsius: "=setpoint_min_celsius", setpoint_max_celsius: "=setpoint_max_celsius", request_lead_days_before_etd: "=request_lead_days_before_etd", late_request_accepted: "=late_request_accepted", late_request_fee_usd: "=late_request_fee_usd"}
        AHL Reefer Controlled Atmosphere: {setpoint_min_celsius: "=setpoint_min_celsius", setpoint_max_celsius: "=setpoint_max_celsius", request_lead_days_before_etd: "=request_lead_days_before_etd", late_request_accepted: "=late_request_accepted", late_request_fee_usd: "=late_request_fee_usd"}
        AHL Reefer Pharma GDP: {setpoint_min_celsius: "=setpoint_min_celsius", setpoint_max_celsius: "=setpoint_max_celsius", request_lead_days_before_etd: "=request_lead_days_before_etd", late_request_accepted: "=late_request_accepted", late_request_fee_usd: "=late_request_fee_usd"}
        AHL Reefer Superfreezer: {setpoint_min_celsius: "=setpoint_min_celsius", setpoint_max_celsius: "=setpoint_max_celsius", request_lead_days_before_etd: "=request_lead_days_before_etd", late_request_accepted: "=late_request_accepted", late_request_fee_usd: "=late_request_fee_usd"}

  - id: reefer_pti
    subject: [reefer_pti_completed, reefer_pti_charged, reefer_plugged_in]
    rule: >-
      Every reefer is inspected before use and each inspection is charged: the first at pti_fee_usd and any repeat at re_pti_fee_usd. An
      inspection is valid for plug-in only until the tier's pti_validity_days calendar days after the inspection was charged. The validity
      ends on the event_date of the latest inspection row plus the tier's validity days counted on calendar dates, and plug-in on that day is
      covered. A reefer not plugged in by then is inspected again before plug-in, at the repeat fee. An inspection may be charged only while
      the service is pti_passed.
    eligibility:
      - id: pti_still_valid
        applies_to: [reefer_plugged_in]
        kind: time
        condition: An inspection is valid for plug-in only until the tier's pti_validity_days calendar days after the inspection was charged.
        evidence_fields: [reefer_ledger.reefer_id, reefer_ledger.event_date, reefer_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_ledger.reefer_id]
          action_bindings: {reefer_ledger.reefer_id: reefer_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the inspection was charged
          anchor_source: reefer_ledger.event_date
          relation: not_after
          duration_source: variants.pti_validity_days
          unit: calendar_days
          counting_rule: The validity ends on the event_date of the latest inspection row plus the tier's validity days counted on calendar dates, and plug-in on that day is covered.
          boundary: inclusive
      - id: pti_on_inspected
        applies_to: [reefer_pti_charged]
        kind: state
        condition: An inspection may be charged only while the service is pti_passed.
        evidence_fields: [reefer_services.reefer_id, reefer_services.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_services.reefer_id]
          action_bindings: {reefer_services.reefer_id: reefer_id}
        state_contract:
          field: reefer_services.status
          allowed: [pti_passed]
    params:
      per_tier:
        AHL Reefer Standard: {pti_fee_usd: "=pti_fee_usd", re_pti_fee_usd: "=re_pti_fee_usd", pti_validity_days: "=pti_validity_days"}
        AHL Reefer Monitored: {pti_fee_usd: "=pti_fee_usd", re_pti_fee_usd: "=re_pti_fee_usd", pti_validity_days: "=pti_validity_days"}
        AHL Reefer Cold Treatment: {pti_fee_usd: "=pti_fee_usd", re_pti_fee_usd: "=re_pti_fee_usd", pti_validity_days: "=pti_validity_days"}
        AHL Reefer Controlled Atmosphere: {pti_fee_usd: "=pti_fee_usd", re_pti_fee_usd: "=re_pti_fee_usd", pti_validity_days: "=pti_validity_days"}
        AHL Reefer Pharma GDP: {pti_fee_usd: "=pti_fee_usd", re_pti_fee_usd: "=re_pti_fee_usd", pti_validity_days: "=pti_validity_days"}
        AHL Reefer Superfreezer: {pti_fee_usd: "=pti_fee_usd", re_pti_fee_usd: "=re_pti_fee_usd", pti_validity_days: "=pti_validity_days"}

  - id: reefer_plug_in_charges
    subject: [reefer_plug_in_charged, reefer_departed, reefer_delivered]
    rule: >-
      Terminal plug-in is charged per started calendar day the laden reefer is plugged in, at the load terminal from plugged_in_date to the
      departure date and at the discharge terminal from discharge to delivered_date, both days counted. The first plug_in_free_days_at_load and
      plug_in_free_days_at_discharge days are free; the remaining days are charged at plug_in_fee_per_day_load_usd and
      plug_in_fee_per_day_discharge_usd, one row per terminal stay. When the customer holds an active service contract whose tier rank is at
      least contract_plug_discount_min_rank and that rank is not 0, plug-in fees are reduced by contract_plug_discount_pct percent, rounded to
      the cent. Plug-in may be charged only once the reefer has departed or been delivered. Transshipment plug-in is included in the service.
    eligibility:
      - id: plug_after_stay
        applies_to: [reefer_plug_in_charged]
        kind: state
        condition: Plug-in may be charged only once the reefer has departed or been delivered.
        evidence_fields: [reefer_services.reefer_id, reefer_services.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_services.reefer_id]
          action_bindings: {reefer_services.reefer_id: reefer_id}
        state_contract:
          field: reefer_services.status
          allowed: [in_transit, delivered]
    params:
      per_tier:
        AHL Reefer Standard: {plug_in_fee_per_day_load_usd: "=plug_in_fee_per_day_load_usd", plug_in_fee_per_day_discharge_usd: "=plug_in_fee_per_day_discharge_usd", plug_in_free_days_at_load: "=plug_in_free_days_at_load", plug_in_free_days_at_discharge: "=plug_in_free_days_at_discharge", contract_plug_discount_pct: "=contract_plug_discount_pct"}
        AHL Reefer Monitored: {plug_in_fee_per_day_load_usd: "=plug_in_fee_per_day_load_usd", plug_in_fee_per_day_discharge_usd: "=plug_in_fee_per_day_discharge_usd", plug_in_free_days_at_load: "=plug_in_free_days_at_load", plug_in_free_days_at_discharge: "=plug_in_free_days_at_discharge", contract_plug_discount_pct: "=contract_plug_discount_pct"}
        AHL Reefer Cold Treatment: {plug_in_fee_per_day_load_usd: "=plug_in_fee_per_day_load_usd", plug_in_fee_per_day_discharge_usd: "=plug_in_fee_per_day_discharge_usd", plug_in_free_days_at_load: "=plug_in_free_days_at_load", plug_in_free_days_at_discharge: "=plug_in_free_days_at_discharge", contract_plug_discount_pct: "=contract_plug_discount_pct"}
        AHL Reefer Controlled Atmosphere: {plug_in_fee_per_day_load_usd: "=plug_in_fee_per_day_load_usd", plug_in_fee_per_day_discharge_usd: "=plug_in_fee_per_day_discharge_usd", plug_in_free_days_at_load: "=plug_in_free_days_at_load", plug_in_free_days_at_discharge: "=plug_in_free_days_at_discharge", contract_plug_discount_pct: "=contract_plug_discount_pct"}
        AHL Reefer Pharma GDP: {plug_in_fee_per_day_load_usd: "=plug_in_fee_per_day_load_usd", plug_in_fee_per_day_discharge_usd: "=plug_in_fee_per_day_discharge_usd", plug_in_free_days_at_load: "=plug_in_free_days_at_load", plug_in_free_days_at_discharge: "=plug_in_free_days_at_discharge", contract_plug_discount_pct: "=contract_plug_discount_pct"}
        AHL Reefer Superfreezer: {plug_in_fee_per_day_load_usd: "=plug_in_fee_per_day_load_usd", plug_in_fee_per_day_discharge_usd: "=plug_in_fee_per_day_discharge_usd", plug_in_free_days_at_load: "=plug_in_free_days_at_load", plug_in_free_days_at_discharge: "=plug_in_free_days_at_discharge", contract_plug_discount_pct: "=contract_plug_discount_pct"}
    formula:
      load_amount: max(0, plug_days - plug_in_free_days_at_load) * plug_in_fee_per_day_load_usd

  - id: reefer_special_services
    subject: [reefer_special_service_charged]
    rule: >-
      The tier's special service, cold treatment, controlled atmosphere, GDP handling or superfreezing, is charged once at departure as
      special_service_fee_usd under special_service_charge_code; tiers whose code is none have no special service. Remote monitoring is charged
      once at delivery as remote_monitoring_fee_per_day_usd times the calendar days from departure to delivery on tiers with
      remote_monitoring_included true. The late request fee and the cancellation fee are charged under reefer_service_eligibility and
      reefer_cancellation. Special service rows may be booked only while the service is requested, in_transit, delivered or cancelled. Each
      charge code is booked once per service.
    eligibility:
      - id: special_service_states
        applies_to: [reefer_special_service_charged]
        kind: state
        condition: Special service rows may be booked only while the service is requested, in_transit, delivered or cancelled.
        evidence_fields: [reefer_services.reefer_id, reefer_services.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_services.reefer_id]
          action_bindings: {reefer_services.reefer_id: reefer_id}
        state_contract:
          field: reefer_services.status
          allowed: [requested, in_transit, delivered, cancelled]
      - id: code_once
        applies_to: [reefer_special_service_charged]
        kind: dedup
        condition: Each charge code is booked once per service.
        evidence_fields: [reefer_ledger.reefer_id, reefer_ledger.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_ledger.reefer_id, reefer_ledger.charge_code]
          action_bindings: {reefer_ledger.reefer_id: reefer_id, reefer_ledger.charge_code: charge_code}
        dedup_contract:
          table: reefer_ledger
          mode: separate_record
          object_bindings: {reefer_id: reefer_id, charge_code: charge_code}
          duplicate_filters: {event_type: [reefer_special_service_charged]}
          distinct_fields: []
    params:
      per_tier:
        AHL Reefer Standard: {special_service_fee_usd: "=special_service_fee_usd", special_service_charge_code: "=special_service_charge_code", remote_monitoring_fee_per_day_usd: "=remote_monitoring_fee_per_day_usd", remote_monitoring_included: "=remote_monitoring_included"}
        AHL Reefer Monitored: {special_service_fee_usd: "=special_service_fee_usd", special_service_charge_code: "=special_service_charge_code", remote_monitoring_fee_per_day_usd: "=remote_monitoring_fee_per_day_usd", remote_monitoring_included: "=remote_monitoring_included"}
        AHL Reefer Cold Treatment: {special_service_fee_usd: "=special_service_fee_usd", special_service_charge_code: "=special_service_charge_code", remote_monitoring_fee_per_day_usd: "=remote_monitoring_fee_per_day_usd", remote_monitoring_included: "=remote_monitoring_included"}
        AHL Reefer Controlled Atmosphere: {special_service_fee_usd: "=special_service_fee_usd", special_service_charge_code: "=special_service_charge_code", remote_monitoring_fee_per_day_usd: "=remote_monitoring_fee_per_day_usd", remote_monitoring_included: "=remote_monitoring_included"}
        AHL Reefer Pharma GDP: {special_service_fee_usd: "=special_service_fee_usd", special_service_charge_code: "=special_service_charge_code", remote_monitoring_fee_per_day_usd: "=remote_monitoring_fee_per_day_usd", remote_monitoring_included: "=remote_monitoring_included"}
        AHL Reefer Superfreezer: {special_service_fee_usd: "=special_service_fee_usd", special_service_charge_code: "=special_service_charge_code", remote_monitoring_fee_per_day_usd: "=remote_monitoring_fee_per_day_usd", remote_monitoring_included: "=remote_monitoring_included"}

  - id: reefer_settings_change
    subject: [reefer_settings_changed, reefer_setpoint_change_charged]
    rule: >-
      Carrying settings change only on the shipper's written instruction and must stay inside the tier's ranges under
      reefer_service_eligibility. A service takes at most max_setpoint_changes changes, counted by reefer_msr_setting_changes. A change before
      departure is accepted only when it is received no later than the tier's setpoint_change_cutoff_hours_before_etd before the scheduled
      departure date. The cutoff is midnight at the start of the etd_date in port-of-loading local time minus the tier's cutoff hours,
      counted as full 60-minute hours, and a change received exactly at the cutoff is accepted. After departure a change is possible only
      remotely and only when in_transit_setpoint_change_allowed is true, at in_transit_setpoint_change_fee_usd each. Every accepted change is
      recorded as one row per change day; before departure it is 0.00 while reefer_msr_setting_changes is below free_setpoint_changes and
      setpoint_change_fee_usd otherwise.
    eligibility:
      - id: change_cutoff
        applies_to: [reefer_settings_changed, reefer_setpoint_change_charged]
        kind: time
        condition: A change before departure is accepted only when it is received no later than the tier's setpoint_change_cutoff_hours_before_etd before the scheduled departure date.
        evidence_fields: [bookings.booking_id, bookings.etd_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the scheduled departure date
          anchor_source: bookings.etd_date
          relation: not_after
          duration_source: variants.setpoint_change_cutoff_hours_before_etd
          unit: elapsed_hours
          counting_rule: The cutoff is midnight at the start of the etd_date in port-of-loading local time minus the tier's cutoff hours, counted as full 60-minute hours, and a change received exactly at the cutoff is accepted.
          boundary: inclusive
      - id: change_cap
        applies_to: [reefer_settings_changed, reefer_setpoint_change_charged]
        kind: authorization
        condition: A service takes at most max_setpoint_changes changes, counted by reefer_msr_setting_changes.
        evidence_fields: [reefer_ledger.reefer_id, reefer_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_ledger.reefer_id]
          action_bindings: {reefer_ledger.reefer_id: reefer_id}
    params:
      per_tier:
        AHL Reefer Standard: {free_setpoint_changes: "=free_setpoint_changes", max_setpoint_changes: "=max_setpoint_changes", setpoint_change_fee_usd: "=setpoint_change_fee_usd", in_transit_setpoint_change_fee_usd: "=in_transit_setpoint_change_fee_usd"}
        AHL Reefer Monitored: {free_setpoint_changes: "=free_setpoint_changes", max_setpoint_changes: "=max_setpoint_changes", setpoint_change_fee_usd: "=setpoint_change_fee_usd", in_transit_setpoint_change_fee_usd: "=in_transit_setpoint_change_fee_usd"}
        AHL Reefer Cold Treatment: {free_setpoint_changes: "=free_setpoint_changes", max_setpoint_changes: "=max_setpoint_changes", setpoint_change_fee_usd: "=setpoint_change_fee_usd", in_transit_setpoint_change_fee_usd: "=in_transit_setpoint_change_fee_usd"}
        AHL Reefer Controlled Atmosphere: {free_setpoint_changes: "=free_setpoint_changes", max_setpoint_changes: "=max_setpoint_changes", setpoint_change_fee_usd: "=setpoint_change_fee_usd", in_transit_setpoint_change_fee_usd: "=in_transit_setpoint_change_fee_usd"}
        AHL Reefer Pharma GDP: {free_setpoint_changes: "=free_setpoint_changes", max_setpoint_changes: "=max_setpoint_changes", setpoint_change_fee_usd: "=setpoint_change_fee_usd", in_transit_setpoint_change_fee_usd: "=in_transit_setpoint_change_fee_usd"}
        AHL Reefer Superfreezer: {free_setpoint_changes: "=free_setpoint_changes", max_setpoint_changes: "=max_setpoint_changes", setpoint_change_fee_usd: "=setpoint_change_fee_usd", in_transit_setpoint_change_fee_usd: "=in_transit_setpoint_change_fee_usd"}
    formula:
      change_amount: 0 if reefer_msr_setting_changes < free_setpoint_changes else setpoint_change_fee_usd
    measures: [reefer_msr_setting_changes]

  - id: reefer_excursions
    subject: [reefer_excursion_recorded, reefer_excursion_credited]
    rule: >-
      An excursion is a period in which return-air temperature stays outside the set point plus or minus temperature_tolerance_celsius,
      measured in whole excursion_log_interval_minutes; the unit's recorder logs it and the line records it as a row, whatever its cause. A
      service earns an excursion credit when an excursion lasted at least excursion_credit_threshold_minutes, the tier's threshold being above
      0, and was not caused by the shipper's own instruction, a set point outside the commodity's needs or cargo loaded above the set point.
      The credit is excursion_credit_pct_of_service_charges percent of reefer_msr_credit_basis, capped at excursion_credit_cap_usd and rounded
      to the cent, referencing the excursion row. An excursion credit must be requested no later than the tier's excursion_report_window_days
      calendar days after the reefer was delivered. The window ends on the delivered_date plus the tier's window days counted on calendar dates,
      and a request on the last day is in time. A service takes at most max_excursion_credits_per_service credits, counted by
      reefer_msr_excursion_credits. A credit may be booked only on a delivered or closed service. An excursion credit is a service credit
      only; loss of cargo value is a cargo claim under the claims charter.
    eligibility:
      - id: credit_window
        applies_to: [reefer_excursion_credited]
        kind: time
        condition: An excursion credit must be requested no later than the tier's excursion_report_window_days calendar days after the reefer was delivered.
        evidence_fields: [reefer_services.reefer_id, reefer_services.delivered_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_services.reefer_id]
          action_bindings: {reefer_services.reefer_id: reefer_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the reefer was delivered
          anchor_source: reefer_services.delivered_date
          relation: not_after
          duration_source: variants.excursion_report_window_days
          unit: calendar_days
          counting_rule: The window ends on the delivered_date plus the tier's window days counted on calendar dates, and a request on the last day is in time.
          boundary: inclusive
      - id: credit_cap
        applies_to: [reefer_excursion_credited]
        kind: authorization
        condition: A service takes at most max_excursion_credits_per_service credits, counted by reefer_msr_excursion_credits.
        evidence_fields: [reefer_ledger.reefer_id, reefer_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_ledger.reefer_id]
          action_bindings: {reefer_ledger.reefer_id: reefer_id}
      - id: credit_after_delivery
        applies_to: [reefer_excursion_credited]
        kind: state
        condition: A credit may be booked only on a delivered or closed service.
        evidence_fields: [reefer_services.reefer_id, reefer_services.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_services.reefer_id]
          action_bindings: {reefer_services.reefer_id: reefer_id}
        state_contract:
          field: reefer_services.status
          allowed: [delivered, closed]
    params:
      per_tier:
        AHL Reefer Standard: {temperature_tolerance_celsius: "=temperature_tolerance_celsius", excursion_credit_threshold_minutes: "=excursion_credit_threshold_minutes", excursion_credit_pct_of_service_charges: "=excursion_credit_pct_of_service_charges", excursion_credit_cap_usd: "=excursion_credit_cap_usd", max_excursion_credits_per_service: "=max_excursion_credits_per_service"}
        AHL Reefer Monitored: {temperature_tolerance_celsius: "=temperature_tolerance_celsius", excursion_credit_threshold_minutes: "=excursion_credit_threshold_minutes", excursion_credit_pct_of_service_charges: "=excursion_credit_pct_of_service_charges", excursion_credit_cap_usd: "=excursion_credit_cap_usd", max_excursion_credits_per_service: "=max_excursion_credits_per_service"}
        AHL Reefer Cold Treatment: {temperature_tolerance_celsius: "=temperature_tolerance_celsius", excursion_credit_threshold_minutes: "=excursion_credit_threshold_minutes", excursion_credit_pct_of_service_charges: "=excursion_credit_pct_of_service_charges", excursion_credit_cap_usd: "=excursion_credit_cap_usd", max_excursion_credits_per_service: "=max_excursion_credits_per_service"}
        AHL Reefer Controlled Atmosphere: {temperature_tolerance_celsius: "=temperature_tolerance_celsius", excursion_credit_threshold_minutes: "=excursion_credit_threshold_minutes", excursion_credit_pct_of_service_charges: "=excursion_credit_pct_of_service_charges", excursion_credit_cap_usd: "=excursion_credit_cap_usd", max_excursion_credits_per_service: "=max_excursion_credits_per_service"}
        AHL Reefer Pharma GDP: {temperature_tolerance_celsius: "=temperature_tolerance_celsius", excursion_credit_threshold_minutes: "=excursion_credit_threshold_minutes", excursion_credit_pct_of_service_charges: "=excursion_credit_pct_of_service_charges", excursion_credit_cap_usd: "=excursion_credit_cap_usd", max_excursion_credits_per_service: "=max_excursion_credits_per_service"}
        AHL Reefer Superfreezer: {temperature_tolerance_celsius: "=temperature_tolerance_celsius", excursion_credit_threshold_minutes: "=excursion_credit_threshold_minutes", excursion_credit_pct_of_service_charges: "=excursion_credit_pct_of_service_charges", excursion_credit_cap_usd: "=excursion_credit_cap_usd", max_excursion_credits_per_service: "=max_excursion_credits_per_service"}
    formula:
      credit_amount: min(excursion_credit_cap_usd, round(reefer_msr_credit_basis * excursion_credit_pct_of_service_charges / 100, 2))
    measures: [reefer_msr_credit_basis, reefer_msr_excursion_credits]

  - id: reefer_cancellation
    subject: [reefer_service_cancelled]
    rule: >-
      A reefer service is cancelled on the customer's instruction or with its booking, only before plug-in. Cancelled before inspection it
      costs nothing; cancelled after inspection, the inspection fee stays charged and cancellation_fee_after_pti_usd is added once under
      charge_code cancellation_fee when above 0.00. A plugged-in reefer cannot be cancelled; the booking must be cancelled under the booking
      charter and the laden container withdrawn from the terminal.
    eligibility: []

  - id: reefer_closure
    subject: [reefer_closed]
    rule: >-
      A delivered service is closed by the system; payments, goodwill waivers of fees already booked and excursion credits inside the report
      window may still be recorded against it.
    eligibility: []

  - id: reefer_goodwill_waiver
    subject: [reefer_charge_waived]
    rule: >-
      The desk may waive one fee row as goodwill at the customer's request. Only setpoint_change_fee, late_request_fee, cancellation_fee and
      plug_in_monitoring rows may be waived; inspection fees, special services and remote monitoring are never waived. A waiver cancels the
      whole referenced row. The fee row's amount_usd must not exceed the tier's goodwill_waiver_authority_usd. The customer's reefer goodwill
      waivers in the trailing 365 days must be fewer than the tier's goodwill_waivers_per_365d. The waiver must be requested no later than the
      tier's waiver_request_window_days calendar days after the fee being waived was booked. The window ends on the fee's event_date plus the
      tier's window days counted on calendar dates, and a request on the last day is inside it. Each fee row is waived at most once.
    eligibility:
      - id: within_authority
        applies_to: [reefer_charge_waived]
        kind: authorization
        condition: The fee row's amount_usd must not exceed the tier's goodwill_waiver_authority_usd.
        evidence_fields: [reefer_ledger.reefer_event_id, reefer_ledger.amount_usd, reefer_ledger.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_ledger.reefer_event_id]
          action_bindings: {reefer_ledger.reefer_event_id: reference_event_id}
      - id: within_quota
        applies_to: [reefer_charge_waived]
        kind: authorization
        condition: The customer's reefer goodwill waivers in the trailing 365 days must be fewer than the tier's goodwill_waivers_per_365d.
        evidence_fields: [reefer_ledger.customer_id, reefer_ledger.event_type, reefer_ledger.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_ledger.customer_id]
          action_bindings: {reefer_ledger.customer_id: customer_id}
      - id: within_window
        applies_to: [reefer_charge_waived]
        kind: time
        condition: The waiver must be requested no later than the tier's waiver_request_window_days calendar days after the fee being waived was booked.
        evidence_fields: [reefer_ledger.reefer_event_id, reefer_ledger.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_ledger.reefer_event_id]
          action_bindings: {reefer_ledger.reefer_event_id: reference_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the fee being waived was booked
          anchor_source: reefer_ledger.event_date
          relation: not_after
          duration_source: variants.waiver_request_window_days
          unit: calendar_days
          counting_rule: The window ends on the fee's event_date plus the tier's window days counted on calendar dates, and a request on the last day is inside it.
          boundary: inclusive
      - id: waive_once
        applies_to: [reefer_charge_waived]
        kind: dedup
        condition: Each fee row is waived at most once.
        evidence_fields: [reefer_ledger.reference_event_id, reefer_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_ledger.reference_event_id]
          action_bindings: {reefer_ledger.reference_event_id: reference_event_id}
        dedup_contract:
          table: reefer_ledger
          mode: separate_record
          object_bindings: {reference_event_id: reference_event_id}
          duplicate_filters: {event_type: [reefer_charge_waived]}
          distinct_fields: []
    measures: [reefer_msr_goodwill_waivers_365d]
    formula:
      when_not: amount_usd > goodwill_waiver_authority_usd or reefer_msr_goodwill_waivers_365d >= goodwill_waivers_per_365d

  - id: reefer_payment
    subject: [reefer_payment_received]
    rule: >-
      A remittance is applied to one service, written with the remittance reference exactly as quoted and the amount remitted; it may not
      exceed the service's charges_due_usd, and any excess is returned by finance and not booked. A remittance reference is recorded only once
      per service.
    eligibility:
      - id: reference_once
        applies_to: [reefer_payment_received]
        kind: dedup
        condition: A remittance reference is recorded only once per service.
        evidence_fields: [reefer_ledger.reefer_id, reefer_ledger.payment_reference, reefer_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_ledger.reefer_id, reefer_ledger.payment_reference]
          action_bindings: {reefer_ledger.reefer_id: reefer_id, reefer_ledger.payment_reference: payment_reference}
        dedup_contract:
          table: reefer_ledger
          mode: separate_record
          object_bindings: {reefer_id: reefer_id, payment_reference: payment_reference}
          duplicate_filters: {event_type: [reefer_payment_received]}
          distinct_fields: []
    formula:
      applied_amount: min(amount_usd, reefer_charges)
