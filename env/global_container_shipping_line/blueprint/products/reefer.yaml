category: reefer
display_name: Reefer Cargo Services

# Functional closure (real capabilities of a reefer service desk, each carried below):
#   ordering a reefer service per container and its admission (reefer_service_requested; reefer_service_eligibility, reefer_agg_booking_uniformity, reefer_agg_multi_holding)
#   pre-trip inspection, its validity and re-inspection (reefer_pti_completed, reefer_pti_charged, reefer_plugged_in; reefer_pti)
#   terminal plug-in days at load and discharge (reefer_plug_in_charged, reefer_departed, reefer_delivered; reefer_plug_in_charges)
#   special services, remote monitoring, late request and cancellation fees (reefer_special_service_charged; reefer_special_services)
#   set-point, ventilation, humidity and atmosphere changes (reefer_settings_changed, reefer_setpoint_change_charged; reefer_settings_change)
#   temperature excursions and excursion credits (reefer_excursion_recorded, reefer_excursion_credited; reefer_excursions)
#   cancellation (reefer_service_cancelled; reefer_cancellation), closure (reefer_closed; reefer_closure)
#   payments and goodwill waivers (reefer_payment_received, reefer_charge_waived; reefer_payment, reefer_goodwill_waiver)
#   not applicable: cargo loss from temperature damage, which is a cargo claim under the claims charter.

binding:
  holding_table: reefer_services
  event_tables: [reefer_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {charges_due_usd: reefer_charges}

lifecycle:
  states: [requested, pti_passed, plugged_in, in_transit, delivered, closed, cancelled]
  transitions:
    - {from: requested, to: pti_passed, by: system, means: The allocated reefer passes its pre-trip inspection at the depot.}
    - {from: requested, to: cancelled, by: agent, means: The service is cancelled before inspection.}
    - {from: pti_passed, to: cancelled, by: agent, means: The service is cancelled after inspection and before plug-in.}
    - {from: pti_passed, to: plugged_in, by: system, means: The laden reefer is plugged in at the load terminal.}
    - {from: plugged_in, to: in_transit, by: system, means: The reefer is loaded and the vessel departs.}
    - {from: in_transit, to: delivered, by: system, means: The laden reefer leaves the discharge terminal.}
    - {from: delivered, to: closed, by: system, means: The reefer service file is closed.}

accounts:
  - key: reefer_charges
    unit: USD
    meaning: Reefer charges owed on one container service — inspection, plug-in, special service, monitoring, change, late request and cancellation fees in, payments, waivers and excursion credits out.

parameter_schema:
  setpoint_min_celsius: Lowest carrying temperature the service accepts (degrees Celsius, 1 decimal).
  setpoint_max_celsius: Highest carrying temperature the service accepts (degrees Celsius, 1 decimal).
  temperature_tolerance_celsius: Band around the set point outside which return-air temperature counts as an excursion (degrees Celsius, 1 decimal).
  excursion_log_interval_minutes: Logging interval of the unit's temperature recorder; excursion minutes are counted in whole intervals (integer minutes).
  excursion_credit_threshold_minutes: Continuous excursion minutes from which the service earns an excursion credit; 0 when the service earns none (integer minutes).
  excursion_credit_pct_of_service_charges: Credit as percent of the credit-basis charges of the service (integer percent).
  excursion_credit_cap_usd: Largest excursion credit per service (USD).
  excursion_credit_basis_codes: Charge codes whose amounts form the basis of an excursion credit (list of reefer_ledger.charge_code values).
  excursion_report_window_days: Calendar days after delivery within which an excursion credit may be requested (integer days).
  max_excursion_credits_per_service: Excursion credits per service (integer).
  remote_monitoring_included: Whether the unit is remotely monitored by the line (boolean).
  monitoring_alert_response_hours: Service standard for acting on a remote alarm; 0 when not monitored (integer hours).
  remote_monitoring_fee_per_day_usd: Remote monitoring fee per calendar day at sea (USD per day).
  pti_fee_usd: Pre-trip inspection fee (USD per inspection).
  pti_validity_days: Calendar days after an inspection during which the reefer may be plugged in without a new inspection (integer days).
  re_pti_fee_usd: Fee for a repeat inspection after validity lapsed (USD per inspection).
  plug_in_fee_per_day_load_usd: Plug-in and monitoring fee per day at the load terminal (USD per day).
  plug_in_fee_per_day_discharge_usd: Plug-in and monitoring fee per day at the discharge terminal (USD per day).
  plug_in_free_days_at_load: Plug-in days free of charge at the load terminal (integer days).
  plug_in_free_days_at_discharge: Plug-in days free of charge at the discharge terminal (integer days).
  special_service_fee_usd: Fee for the tier's special service, charged at departure (USD per service).
  special_service_charge_code: Charge code of the tier's special service, or none (enum string).
  free_setpoint_changes: Setting changes per service without fee (integer).
  max_setpoint_changes: Setting changes accepted per service (integer).
  setpoint_change_fee_usd: Fee per setting change before departure beyond the free allowance (USD per change).
  in_transit_setpoint_change_allowed: Whether settings may be changed remotely after departure (boolean).
  in_transit_setpoint_change_fee_usd: Fee per remote setting change after departure (USD per change).
  setpoint_change_cutoff_hours_before_etd: Latest a setting change is accepted before departure, in hours before ETD (integer hours).
  ventilation_allowed: Whether fresh-air ventilation may be set (boolean).
  ventilation_max_cbm_h: Highest ventilation setting (integer cubic metres per hour).
  humidity_control_available: Whether dehumidification may be set (boolean).
  humidity_setpoint_min_pct: Lowest humidity set point when available (integer percent).
  humidity_setpoint_max_pct: Highest humidity set point when available (integer percent).
  ca_o2_min_pct: Lowest oxygen set point (decimal percent).
  ca_o2_max_pct: Highest oxygen set point (decimal percent).
  ca_co2_max_pct: Highest carbon dioxide set point (decimal percent).
  allowed_equipment_types: Reefer equipment types the tier uses (list of equipment_type values).
  allowed_trade_lanes: Trade lanes on which the tier is offered (list of trade_lane values).
  eligible_commodities: Commodities the tier carries; all means any temperature-controlled cargo (list of strings).
  request_lead_days_before_etd: Latest on-time request, in calendar days before ETD (integer days).
  late_request_accepted: Whether a request inside the lead time is accepted with a fee (boolean).
  late_request_fee_usd: Fee for a late request (USD per service).
  cancellation_fee_after_pti_usd: Fee for cancelling after inspection, in addition to the inspection fee (USD per service).
  contract_plug_discount_min_rank: Lowest service contract tier rank whose holder gets the plug-in discount; 0 means no discount (integer rank).
  contract_plug_discount_pct: Discount on plug-in fees for qualifying contract holders (integer percent).
  goodwill_waiver_authority_usd: Largest single fee row the desk may waive as goodwill (USD per fee row).
  goodwill_waivers_per_365d: Goodwill reefer waivers per customer per trailing 365 days (integer).
  waiver_request_window_days: Calendar days after a fee was booked within which a goodwill waiver may be requested (integer days).

