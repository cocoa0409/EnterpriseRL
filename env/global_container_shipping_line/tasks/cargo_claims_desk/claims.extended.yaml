events:
  # ---- holding (cargo_covers) ----
  - type: claims_cover_quoted
    target: cargo_covers
    mutation: create
    meaning: A cover is quoted for one shipment, or statutory liability is recorded for it.
    grain: One row per booking covered.
    fields: {cover_id: new cover reference, customer_id: cover holder, variant_name: product, bl_id: transport document, booking_id: booking, cargo_type: cargo category, insured_value_usd: insured value, package_count: packages covered, gross_weight_kg: weight covered, container_count: containers covered}
    triggers: []
  - type: claims_cover_bound
    target: cargo_covers
    mutation: {transition: {from: quoted, to: active}}
    meaning: The cover is bound and attaches to the shipment.
    grain: One row per binding.
    fields: {status: becomes active, bound_date: binding date, variant_name: product bound}
    triggers:
      - event: claims:claims_premium_charged
        when: {variant_name: {not: AHL Standard Carrier Liability}}
        map: {cover_id: cover_id, customer_id: customer_id}
  - type: claims_cover_lapsed
    target: cargo_covers
    mutation: {transition: {from: quoted, to: cancelled}}
    meaning: An unbound quote lapses or is declined.
    grain: One row per lapsed quote.
    fields: {status: becomes cancelled}
    triggers: []
  - type: claims_cover_cancelled
    target: cargo_covers
    mutation: {transition: {from: active, to: cancelled}}
    meaning: A bound cover is cancelled before the vessel departs.
    grain: One row per cancelled cover.
    fields: {status: becomes cancelled}
    triggers: []
  - type: claims_claim_lodged
    target: cargo_covers
    mutation: {transition: [{from: active, to: claim_open}, {from: claim_closed, to: claim_open}]}
    meaning: Written notice of loss is lodged against the cover.
    grain: One row per claim lodged.
    fields: {status: becomes claim_open}
    triggers: []
  - type: claims_claim_withdrawn
    target: cargo_covers
    mutation: {transition: {from: claim_open, to: active}}
    meaning: The claimant withdraws its open claim.
    grain: One row per withdrawal.
    fields: {status: becomes active}
    triggers: []
  - type: claims_claim_closed
    target: cargo_covers
    mutation: {transition: {from: claim_open, to: claim_closed}}
    meaning: The open claim is decided.
    grain: One row per decided claim.
    fields: {status: becomes claim_closed}
    triggers: []
  - type: claims_cover_expired
    target: cargo_covers
    mutation: {transition: [{from: active, to: expired}, {from: claim_closed, to: expired}]}
    meaning: The claim period of the cover ends.
    grain: One row per expired cover.
    fields: {status: becomes expired}
    triggers: []
  - type: claims_cargo_delivered
    target: cargo_covers
    mutation: update
    meaning: Delivery of the covered cargo at the place of delivery is recorded.
    grain: One row per delivery.
    fields: {booking_id: booking delivered, delivery_date: delivery date}
    triggers: []
  # ---- ledger (claims_ledger) ----
  - type: claims_premium_charged
    target: claims_ledger
    meaning: The premium or ad valorem charge of a bound cover is charged.
    grain: One row per binding.
    distinguish_by: [event_date]
    fields: {cover_id: cover, customer_id: cover holder, event_date: binding date, amount_usd: premium, liability_basis: not_applicable}
    account: premium
    direction: in
    triggers: []
  - type: claims_premium_paid
    target: claims_ledger
    meaning: A premium remittance is applied to the cover.
    grain: One row per remittance per cover.
    distinguish_by: [payment_reference]
    fields: {cover_id: cover, customer_id: paying cover holder, event_date: value date, amount_usd: amount remitted, payment_reference: remittance reference quoted by the customer}
    account: premium
    direction: out
    triggers: []
  - type: claims_premium_refunded
    target: claims_ledger
    meaning: Premium is refunded on a cover cancelled before departure.
    grain: One row per premium row refunded.
    distinguish_by: [reference_event_id]
    fields: {cover_id: cover, customer_id: cover holder, event_date: refund date, amount_usd: amount refunded, reference_event_id: premium row refunded}
    account: premium
    direction: out
    triggers: []
  - type: claims_settlement_approved
    target: claims_ledger
    meaning: A claim is approved for settlement at the amount the policy yields.
    grain: One row per claim approved.
    distinguish_by: [claim_id]
    fields: {cover_id: cover, customer_id: claimant, event_date: approval date, amount_usd: settlement approved, claim_id: claim approved, liability_basis: cap or basis that determined the amount}
    account: claim_settlement
    direction: in
    triggers: []
  - type: claims_settlement_paid
    target: claims_ledger
    meaning: An approved settlement is paid to the claimant.
    grain: One row per settlement paid.
    distinguish_by: [claim_id]
    fields: {cover_id: cover, customer_id: claimant, event_date: payment date, amount_usd: amount paid, claim_id: claim paid, reference_event_id: approval row paid}
    account: claim_settlement
    direction: out
    triggers: []
  - type: claims_claim_rejected
    target: claims_ledger
    meaning: A claim is rejected with a controlled reason.
    grain: One row per claim rejected.
    distinguish_by: [claim_id]
    fields: {cover_id: cover, customer_id: claimant, event_date: rejection date, amount_usd: 0.00, claim_id: claim rejected, rejection_reason: controlled reason}
    triggers: []

measures:
  - id: claims_msr_settled_365d
    window: Trailing 365 calendar days ending on the approval date, inclusive, across every cover of the same product held by the cover holder.
    measure: Sum of amount_usd of claims_settlement_approved rows on covers whose customer_id is the cover holder and whose variant_name is the product of the cover concerned.
  - id: claims_msr_claims_on_cover
    window: Life of the cover, excluding the claim being handled.
    measure: Count of cargo_claims rows on the cover_id whose outcome is not withdrawn.
  - id: claims_msr_carrier_rolls
    window: Life of the covered booking.
    measure: Count of booking_roll_recorded rows on the cover's booking_id with roll_initiator carrier.
  - id: claims_msr_longest_excursion
    window: Life of the reefer service of the claimed container.
    measure: Largest excursion_minutes among reefer_excursion_recorded rows on the reefer service whose container_number is the claim's container_number.

policies:
  - id: claims_agg_multi_holding
    subject: [claims_cover_quoted]
    rule: >-
      A customer may hold any number of covers, one for each shipment. Each booking has at most one cover in force, where in force means
      quoted, active, claim_open or claim_closed; a new cover for a booking is quoted only when the earlier one was cancelled or has expired.
      Moving a shipment from statutory liability to a CargoCare product therefore means cancelling the quoted statutory record before the
      new quote is made, which is possible only while the statutory record is still quoted.
    eligibility:
      - id: one_cover_per_booking
        applies_to: [claims_cover_quoted]
        kind: dedup
        condition: Each booking has at most one cover in force, where in force means quoted, active, claim_open or claim_closed; a new cover for a booking is quoted only when the earlier one was cancelled or has expired.
        evidence_fields: [cargo_covers.booking_id, cargo_covers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_covers.booking_id]
          action_bindings: {cargo_covers.booking_id: booking_id}
        dedup_contract:
          table: cargo_covers
          mode: separate_record
          object_bindings: {booking_id: booking_id}
          duplicate_filters: {status: [quoted, active, claim_open, claim_closed]}
          distinct_fields: []
    params: {max_per_customer: null}

  - id: claims_agg_annual_aggregate
    subject: [claims_settlement_approved]
    rule: >-
      CargoCare products carry an annual aggregate per cover holder. For a product whose annual_aggregate_limit_usd is above 0.00, the
      settlements approved on all the cover holder's covers of that product in the trailing 365 days, claims_msr_settled_365d, plus the
      settlement being approved may not exceed the product's annual_aggregate_limit_usd. When the computed settlement would exceed it, the
      settlement is reduced to the remaining aggregate and recorded with liability_basis aggregate_limit; when nothing remains, the claim is
      approved at 0.00 with liability_basis aggregate_limit rather than rejected, because the loss is covered but the aggregate is spent.
      Settlements under AHL Standard Carrier Liability and AHL Declared Value Liability have no aggregate.
    eligibility: []
    params:
      per_tier:
        AHL Standard Carrier Liability: {annual_aggregate_limit_usd: "=annual_aggregate_limit_usd"}
        AHL Declared Value Liability: {annual_aggregate_limit_usd: "=annual_aggregate_limit_usd"}
        AHL CargoCare Essential: {annual_aggregate_limit_usd: "=annual_aggregate_limit_usd"}
        AHL CargoCare Plus: {annual_aggregate_limit_usd: "=annual_aggregate_limit_usd"}
        AHL CargoCare Premium: {annual_aggregate_limit_usd: "=annual_aggregate_limit_usd"}
        AHL CargoCare Total: {annual_aggregate_limit_usd: "=annual_aggregate_limit_usd"}
    formula:
      remaining_aggregate: max(0, annual_aggregate_limit_usd - claims_msr_settled_365d)
    measures: [claims_msr_settled_365d]

  - id: claims_cover_eligibility
    subject: [claims_cover_quoted, claims_cover_bound]
    rule: >-
      Every shipment carries AHL Standard Carrier Liability, which the system records and attaches when the cargo is received, with the
      invoice value on file as insured_value_usd and no premium. A cargo owner may instead take AHL Declared Value Liability, by declaring the
      value on the transport document, or one of the CargoCare products. The cover's cargo_type must be one of the product's
      eligible_cargo_types; the insured value must be at least min_insured_value_usd and at most max_cover_value_usd; the container_count
      must equal the booking's container_count unless partial_shipment_cover_allowed is true, in which case it may be lower. A freight
      forwarder or NVOCC may hold the product only when forwarder_bind_on_behalf_allowed is true. A cover is bound only for a shipment whose
      transport document has been drafted. A cover must be bound no later than the tier's bind_deadline_days_before_etd calendar days before
      the scheduled departure date. The binding deadline is the booking's etd_date minus the tier's deadline days counted on calendar dates,
      and binding on the deadline date itself is allowed. When the cover holder's credit_status is cash_in_advance and the product's
      premium_prepayment_required is true, the premium must be received before binding. A cover holder on credit_hold cannot bind a
      CargoCare product.
    eligibility:
      - id: bind_before_departure
        applies_to: [claims_cover_bound]
        kind: time
        condition: A cover must be bound no later than the tier's bind_deadline_days_before_etd calendar days before the scheduled departure date.
        evidence_fields: [bookings.booking_id, bookings.etd_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the scheduled departure date
          anchor_source: bookings.etd_date
          relation: not_after
          duration_source: variants.bind_deadline_days_before_etd
          unit: calendar_days
          counting_rule: The binding deadline is the booking's etd_date minus the tier's deadline days counted on calendar dates, and binding on the deadline date itself is allowed.
          boundary: inclusive
      - id: document_drafted
        applies_to: [claims_cover_quoted]
        kind: authorization
        condition: A cover is bound only for a shipment whose transport document has been drafted.
        evidence_fields: [bills_of_lading.bl_id, bills_of_lading.booking_id, bills_of_lading.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bills_of_lading.bl_id]
          action_bindings: {bills_of_lading.bl_id: bl_id}
      - id: forwarder_allowed
        applies_to: [claims_cover_quoted]
        kind: authorization
        condition: A freight forwarder or NVOCC may hold the product only when forwarder_bind_on_behalf_allowed is true.
        evidence_fields: [customers.customer_id, customers.customer_role]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings: {customers.customer_id: customer_id}
      - id: prepaid_premium
        applies_to: [claims_cover_bound]
        kind: authorization
        condition: When the cover holder's credit_status is cash_in_advance and the product's premium_prepayment_required is true, the premium must be received before binding.
        evidence_fields: [customers.customer_id, customers.credit_status, claims_ledger.cover_id, claims_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims_ledger.cover_id]
          action_bindings: {claims_ledger.cover_id: cover_id}
      - id: no_credit_hold
        applies_to: [claims_cover_bound]
        kind: state
        condition: A cover holder on credit_hold cannot bind a CargoCare product.
        evidence_fields: [customers.customer_id, customers.credit_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings: {customers.customer_id: customer_id}
        state_contract:
          field: customers.credit_status
          allowed: [cash_in_advance, credit_approved]
    params:
      per_tier:
        AHL Standard Carrier Liability: {eligible_cargo_types: "=eligible_cargo_types", min_insured_value_usd: "=min_insured_value_usd", max_cover_value_usd: "=max_cover_value_usd", partial_shipment_cover_allowed: "=partial_shipment_cover_allowed", forwarder_bind_on_behalf_allowed: "=forwarder_bind_on_behalf_allowed", premium_prepayment_required: "=premium_prepayment_required"}
        AHL Declared Value Liability: {eligible_cargo_types: "=eligible_cargo_types", min_insured_value_usd: "=min_insured_value_usd", max_cover_value_usd: "=max_cover_value_usd", partial_shipment_cover_allowed: "=partial_shipment_cover_allowed", forwarder_bind_on_behalf_allowed: "=forwarder_bind_on_behalf_allowed", premium_prepayment_required: "=premium_prepayment_required"}
        AHL CargoCare Essential: {eligible_cargo_types: "=eligible_cargo_types", min_insured_value_usd: "=min_insured_value_usd", max_cover_value_usd: "=max_cover_value_usd", partial_shipment_cover_allowed: "=partial_shipment_cover_allowed", forwarder_bind_on_behalf_allowed: "=forwarder_bind_on_behalf_allowed", premium_prepayment_required: "=premium_prepayment_required"}
        AHL CargoCare Plus: {eligible_cargo_types: "=eligible_cargo_types", min_insured_value_usd: "=min_insured_value_usd", max_cover_value_usd: "=max_cover_value_usd", partial_shipment_cover_allowed: "=partial_shipment_cover_allowed", forwarder_bind_on_behalf_allowed: "=forwarder_bind_on_behalf_allowed", premium_prepayment_required: "=premium_prepayment_required"}
        AHL CargoCare Premium: {eligible_cargo_types: "=eligible_cargo_types", min_insured_value_usd: "=min_insured_value_usd", max_cover_value_usd: "=max_cover_value_usd", partial_shipment_cover_allowed: "=partial_shipment_cover_allowed", forwarder_bind_on_behalf_allowed: "=forwarder_bind_on_behalf_allowed", premium_prepayment_required: "=premium_prepayment_required"}
        AHL CargoCare Total: {eligible_cargo_types: "=eligible_cargo_types", min_insured_value_usd: "=min_insured_value_usd", max_cover_value_usd: "=max_cover_value_usd", partial_shipment_cover_allowed: "=partial_shipment_cover_allowed", forwarder_bind_on_behalf_allowed: "=forwarder_bind_on_behalf_allowed", premium_prepayment_required: "=premium_prepayment_required"}

  - id: claims_premium
    subject: [claims_premium_charged, claims_premium_paid]
    rule: >-
      The premium of a bound cover is charged once at binding. It is the insured_value_usd times premium_rate_pct_of_insured_value percent,
      increased by the uplift for the cover's cargo_type (dg_cargo_premium_uplift_pct for dangerous_goods, reefer_cargo_premium_uplift_pct for
      reefer, oog_premium_uplift_pct for out_of_gauge, none for general), then reduced by contract_premium_discount_pct when the cover holder
      holds an active service contract whose tier rank is at least premium_discount_min_contract_rank and that rank is not 0. The result is
      raised to the higher of minimum_premium_per_container_usd times container_count and minimum_premium_per_cover_usd, and rounded to the
      cent. AHL Standard Carrier Liability carries no premium. A premium may be booked only on a cover whose status is active. A cover is
      charged premium once. When prepayment does not apply, the premium is payable within premium_due_days of binding. A premium remittance is
      written with the reference exactly as quoted, may not exceed premium_due_usd, and a reference is recorded once per cover.
    eligibility:
      - id: premium_on_active
        applies_to: [claims_premium_charged]
        kind: state
        condition: A premium may be booked only on a cover whose status is active.
        evidence_fields: [cargo_covers.cover_id, cargo_covers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_covers.cover_id]
          action_bindings: {cargo_covers.cover_id: cover_id}
        state_contract:
          field: cargo_covers.status
          allowed: [active]
      - id: premium_once
        applies_to: [claims_premium_charged]
        kind: dedup
        condition: A cover is charged premium once.
        evidence_fields: [claims_ledger.cover_id, claims_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims_ledger.cover_id]
          action_bindings: {claims_ledger.cover_id: cover_id}
        dedup_contract:
          table: claims_ledger
          mode: separate_record
          object_bindings: {cover_id: cover_id}
          duplicate_filters: {event_type: [claims_premium_charged]}
          distinct_fields: []
      - id: remittance_once
        applies_to: [claims_premium_paid]
        kind: dedup
        condition: A premium remittance is written with the reference exactly as quoted, may not exceed premium_due_usd, and a reference is recorded once per cover.
        evidence_fields: [claims_ledger.cover_id, claims_ledger.payment_reference, claims_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims_ledger.cover_id, claims_ledger.payment_reference]
          action_bindings: {claims_ledger.cover_id: cover_id, claims_ledger.payment_reference: payment_reference}
        dedup_contract:
          table: claims_ledger
          mode: separate_record
          object_bindings: {cover_id: cover_id, payment_reference: payment_reference}
          duplicate_filters: {event_type: [claims_premium_paid]}
          distinct_fields: []
    params:
      per_tier:
        AHL Standard Carrier Liability: {premium_rate_pct_of_insured_value: "=premium_rate_pct_of_insured_value", minimum_premium_per_container_usd: "=minimum_premium_per_container_usd", minimum_premium_per_cover_usd: "=minimum_premium_per_cover_usd", contract_premium_discount_pct: "=contract_premium_discount_pct", premium_due_days: "=premium_due_days"}
        AHL Declared Value Liability: {premium_rate_pct_of_insured_value: "=premium_rate_pct_of_insured_value", minimum_premium_per_container_usd: "=minimum_premium_per_container_usd", minimum_premium_per_cover_usd: "=minimum_premium_per_cover_usd", contract_premium_discount_pct: "=contract_premium_discount_pct", premium_due_days: "=premium_due_days"}
        AHL CargoCare Essential: {premium_rate_pct_of_insured_value: "=premium_rate_pct_of_insured_value", minimum_premium_per_container_usd: "=minimum_premium_per_container_usd", minimum_premium_per_cover_usd: "=minimum_premium_per_cover_usd", contract_premium_discount_pct: "=contract_premium_discount_pct", premium_due_days: "=premium_due_days"}
        AHL CargoCare Plus: {premium_rate_pct_of_insured_value: "=premium_rate_pct_of_insured_value", minimum_premium_per_container_usd: "=minimum_premium_per_container_usd", minimum_premium_per_cover_usd: "=minimum_premium_per_cover_usd", contract_premium_discount_pct: "=contract_premium_discount_pct", premium_due_days: "=premium_due_days"}
        AHL CargoCare Premium: {premium_rate_pct_of_insured_value: "=premium_rate_pct_of_insured_value", minimum_premium_per_container_usd: "=minimum_premium_per_container_usd", minimum_premium_per_cover_usd: "=minimum_premium_per_cover_usd", contract_premium_discount_pct: "=contract_premium_discount_pct", premium_due_days: "=premium_due_days"}
        AHL CargoCare Total: {premium_rate_pct_of_insured_value: "=premium_rate_pct_of_insured_value", minimum_premium_per_container_usd: "=minimum_premium_per_container_usd", minimum_premium_per_cover_usd: "=minimum_premium_per_cover_usd", contract_premium_discount_pct: "=contract_premium_discount_pct", premium_due_days: "=premium_due_days"}
    formula:
      cargo_uplift_pct: dg_cargo_premium_uplift_pct if cargo_type == "dangerous_goods" else (reefer_cargo_premium_uplift_pct if cargo_type == "reefer" else (oog_premium_uplift_pct if cargo_type == "out_of_gauge" else 0))
      gross_premium: insured_value_usd * premium_rate_pct_of_insured_value / 100 * (1 + cargo_uplift_pct / 100)
      minimum_premium: max(minimum_premium_per_container_usd * container_count, minimum_premium_per_cover_usd)

  - id: claims_cover_cancellation
    subject: [claims_cover_cancelled, claims_cover_lapsed, claims_premium_refunded]
    rule: >-
      A quote that is not bound by the binding deadline, or that the customer declines, lapses without charge. A bound cover may be cancelled
      on the cover holder's instruction only while the booking has not departed; after departure the risk has attached and the cover cannot be
      cancelled. On cancellation, premium_refund_pct_before_departure percent of the premium charged is refunded, rounded to the cent,
      referencing the premium row; the refund applies to premium already paid and to premium still due alike, because it reduces the premium
      owed. AHL Standard Carrier Liability is never cancelled, because it is the statutory regime. A premium refund may be booked only on a
      cover whose status is cancelled. A premium row is refunded at most once.
    eligibility:
      - id: booking_not_departed
        applies_to: [claims_cover_cancelled]
        kind: state
        condition: A bound cover may be cancelled on the cover holder's instruction only while the booking has not departed; after departure the risk has attached and the cover cannot be cancelled.
        evidence_fields: [bookings.booking_id, bookings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        state_contract:
          field: bookings.status
          allowed: [requested, confirmed, equipment_released, gated_in, loaded, cancelled]
      - id: refund_on_cancelled
        applies_to: [claims_premium_refunded]
        kind: state
        condition: A premium refund may be booked only on a cover whose status is cancelled.
        evidence_fields: [cargo_covers.cover_id, cargo_covers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_covers.cover_id]
          action_bindings: {cargo_covers.cover_id: cover_id}
        state_contract:
          field: cargo_covers.status
          allowed: [cancelled]
      - id: refund_once
        applies_to: [claims_premium_refunded]
        kind: dedup
        condition: A premium row is refunded at most once.
        evidence_fields: [claims_ledger.reference_event_id, claims_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims_ledger.reference_event_id]
          action_bindings: {claims_ledger.reference_event_id: reference_event_id}
        dedup_contract:
          table: claims_ledger
          mode: separate_record
          object_bindings: {reference_event_id: reference_event_id}
          duplicate_filters: {event_type: [claims_premium_refunded]}
          distinct_fields: []
    formula:
      refund_amount: round(amount_usd * premium_refund_pct_before_departure / 100, 2)

  - id: claims_notice_and_time_bar
    subject: [claims_claim_lodged, claims_claim_withdrawn, claims_claim_rejected]
    rule: >-
      A claim is lodged by the claimant, which only the claimant can do, by written notice naming the container and the loss. The claimant
      must be one the product's claimants_allowed admits, being the cover holder, or the consignee named on the transport document when
      named_consignee is listed, a consignee being recognised only when its registered company_name matches the printed consignee_name
      exactly. A cover takes at most max_claims_per_cover claims, counted by claims_msr_claims_on_cover, and only one claim is open at a time.
      Written notice of loss not apparent at delivery must reach the line no later than the tier's notice_days_non_apparent_damage calendar
      days after the cargo was delivered. The notice window ends on the cover's delivery_date plus the tier's notice days counted on calendar
      dates, and a notice whose notice_date is that last day is in time. Loss apparent at delivery must be noted on the delivery receipt when
      apparent_damage_notice_days is 0, and otherwise notified within that many calendar days of delivery; notice of delay loss must reach the
      line within notice_days_delay_loss calendar days of delivery. No claim is admissible after the tier's claim_time_bar_months calendar
      months after the cargo was delivered. The time bar falls on the same calendar day of the month that many months after the
      delivery_date, or on the last day of that month when it has no such day, and a notice dated on that day is in time. A claim below
      minimum_claim_amount_usd is rejected with reason below_minimum_claim. A claim may be rejected for missing documents only after the
      tier's documents_due_days_after_notice calendar days have passed since the notice of loss reached the line. The documents deadline is the notice_date plus the tier's
      documents days counted on calendar dates, and a rejection for missing documents is possible only from the following day. The documents are complete
      when the claims department records them so, a survey report being required when the claimed amount is above survey_required_above_usd
      or the loss is of a type in survey_required_damage_types. Notices out of time are rejected with notice_out_of_time or
      claim_time_barred. The claimant may withdraw an open claim, which returns the cover to active and does not count toward the cap. A
      rejection may be booked only while the claim's cover is claim_open. A claim is decided once.
    eligibility:
      - id: notice_window
        applies_to: [claims_claim_rejected]
        kind: time
        condition: Written notice of loss not apparent at delivery must reach the line no later than the tier's notice_days_non_apparent_damage calendar days after the cargo was delivered.
        evidence_fields: [cargo_covers.cover_id, cargo_covers.delivery_date, cargo_claims.notice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_covers.cover_id]
          action_bindings: {cargo_covers.cover_id: cover_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the cargo was delivered
          anchor_source: cargo_covers.delivery_date
          relation: not_after
          duration_source: variants.notice_days_non_apparent_damage
          unit: calendar_days
          counting_rule: The notice window ends on the cover's delivery_date plus the tier's notice days counted on calendar dates, and a notice whose notice_date is that last day is in time.
          boundary: inclusive
      - id: time_bar
        applies_to: [claims_claim_rejected]
        kind: time
        condition: No claim is admissible after the tier's claim_time_bar_months calendar months after the cargo was delivered.
        evidence_fields: [cargo_covers.cover_id, cargo_covers.delivery_date, cargo_claims.notice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_covers.cover_id]
          action_bindings: {cargo_covers.cover_id: cover_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the cargo was delivered
          anchor_source: cargo_covers.delivery_date
          relation: not_after
          duration_source: variants.claim_time_bar_months
          unit: calendar_months
          counting_rule: The time bar falls on the same calendar day of the month that many months after the delivery_date, or on the last day of that month when it has no such day, and a notice dated on that day is in time.
          boundary: inclusive
      - id: documents_deadline
        applies_to: [claims_claim_rejected]
        kind: time
        condition: A claim may be rejected for missing documents only after the tier's documents_due_days_after_notice calendar days have passed since the notice of loss reached the line.
        evidence_fields: [cargo_claims.claim_id, cargo_claims.notice_date, cargo_claims.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_claims.claim_id]
          action_bindings: {cargo_claims.claim_id: claim_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the notice of loss reached the line
          anchor_source: cargo_claims.notice_date
          relation: not_before
          duration_source: variants.documents_due_days_after_notice
          unit: calendar_days
          counting_rule: The documents deadline is the notice_date plus the tier's documents days counted on calendar dates, and a rejection for missing documents is possible only from the following day.
          boundary: exclusive
      - id: claimant_entitled
        applies_to: [claims_claim_lodged]
        kind: authorization
        condition: The claimant must be one the product's claimants_allowed admits, being the cover holder, or the consignee named on the transport document when named_consignee is listed, a consignee being recognised only when its registered company_name matches the printed consignee_name exactly.
        evidence_fields: [cargo_covers.cover_id, cargo_covers.customer_id, bills_of_lading.consignee_name, customers.company_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_covers.cover_id]
          action_bindings: {cargo_covers.cover_id: cover_id}
      - id: claim_cap
        applies_to: [claims_claim_lodged]
        kind: authorization
        condition: A cover takes at most max_claims_per_cover claims, counted by claims_msr_claims_on_cover, and only one claim is open at a time.
        evidence_fields: [cargo_claims.cover_id, cargo_claims.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_claims.cover_id]
          action_bindings: {cargo_claims.cover_id: cover_id}
      - id: reject_open_claim
        applies_to: [claims_claim_rejected]
        kind: state
        condition: A rejection may be booked only while the claim's cover is claim_open.
        evidence_fields: [cargo_covers.cover_id, cargo_covers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_covers.cover_id]
          action_bindings: {cargo_covers.cover_id: cover_id}
        state_contract:
          field: cargo_covers.status
          allowed: [claim_open]
      - id: decided_once
        applies_to: [claims_claim_rejected]
        kind: dedup
        condition: A claim is decided once.
        evidence_fields: [claims_ledger.claim_id, claims_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims_ledger.claim_id]
          action_bindings: {claims_ledger.claim_id: claim_id}
        dedup_contract:
          table: claims_ledger
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {event_type: [claims_claim_rejected, claims_settlement_approved]}
          distinct_fields: []
    params:
      per_tier:
        AHL Standard Carrier Liability: {notice_days_non_apparent_damage: "=notice_days_non_apparent_damage", apparent_damage_notice_days: "=apparent_damage_notice_days", claim_time_bar_months: "=claim_time_bar_months", documents_due_days_after_notice: "=documents_due_days_after_notice", minimum_claim_amount_usd: "=minimum_claim_amount_usd", max_claims_per_cover: "=max_claims_per_cover"}
        AHL Declared Value Liability: {notice_days_non_apparent_damage: "=notice_days_non_apparent_damage", apparent_damage_notice_days: "=apparent_damage_notice_days", claim_time_bar_months: "=claim_time_bar_months", documents_due_days_after_notice: "=documents_due_days_after_notice", minimum_claim_amount_usd: "=minimum_claim_amount_usd", max_claims_per_cover: "=max_claims_per_cover"}
        AHL CargoCare Essential: {notice_days_non_apparent_damage: "=notice_days_non_apparent_damage", apparent_damage_notice_days: "=apparent_damage_notice_days", claim_time_bar_months: "=claim_time_bar_months", documents_due_days_after_notice: "=documents_due_days_after_notice", minimum_claim_amount_usd: "=minimum_claim_amount_usd", max_claims_per_cover: "=max_claims_per_cover"}
        AHL CargoCare Plus: {notice_days_non_apparent_damage: "=notice_days_non_apparent_damage", apparent_damage_notice_days: "=apparent_damage_notice_days", claim_time_bar_months: "=claim_time_bar_months", documents_due_days_after_notice: "=documents_due_days_after_notice", minimum_claim_amount_usd: "=minimum_claim_amount_usd", max_claims_per_cover: "=max_claims_per_cover"}
        AHL CargoCare Premium: {notice_days_non_apparent_damage: "=notice_days_non_apparent_damage", apparent_damage_notice_days: "=apparent_damage_notice_days", claim_time_bar_months: "=claim_time_bar_months", documents_due_days_after_notice: "=documents_due_days_after_notice", minimum_claim_amount_usd: "=minimum_claim_amount_usd", max_claims_per_cover: "=max_claims_per_cover"}
        AHL CargoCare Total: {notice_days_non_apparent_damage: "=notice_days_non_apparent_damage", apparent_damage_notice_days: "=apparent_damage_notice_days", claim_time_bar_months: "=claim_time_bar_months", documents_due_days_after_notice: "=documents_due_days_after_notice", minimum_claim_amount_usd: "=minimum_claim_amount_usd", max_claims_per_cover: "=max_claims_per_cover"}
    measures: [claims_msr_claims_on_cover]

  - id: claims_coverage_and_exclusions
    subject: [claims_settlement_approved, claims_claim_rejected]
    rule: >-
      A claim is paid only for a kind of loss in the product's covered_damage_types; any other kind is rejected with not_covered_by_tier.
      Temperature damage is covered only for a container whose reefer service tier rank, in the reefer charter, is at least
      temperature_damage_min_reefer_rank. When temperature_claim_requires_logged_excursion is true, the reefer service must also log an
      excursion of at least excursion_min_minutes_for_claim continuous minutes on that container, measured by claims_msr_longest_excursion;
      without one the claim is rejected with no_logged_excursion. Delay loss, covered only by AHL CargoCare Total, is paid only when the
      booking was rolled by the carrier at least delay_loss_min_carrier_rolls times, counted by claims_msr_carrier_rolls. A claim on goods
      whose dangerous-goods acceptance carries a misdeclaration penalty is rejected with misdeclared_cargo under every product, because the
      goods were not those accepted. Loss caused by the claimant's own insufficient packing or by inherent vice is an excluded peril under
      every product; its finding rests on the survey report recorded by the claims department, never on the claimant's statement alone.
      Settlement may be approved only while the claim's cover is claim_open and the claim's documents are complete. Each claim is decided
      once.
    eligibility:
      - id: open_and_documented
        applies_to: [claims_settlement_approved]
        kind: state
        condition: Settlement may be approved only while the claim's cover is claim_open and the claim's documents are complete.
        evidence_fields: [cargo_covers.cover_id, cargo_covers.status, cargo_claims.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_covers.cover_id]
          action_bindings: {cargo_covers.cover_id: cover_id}
        state_contract:
          field: cargo_covers.status
          allowed: [claim_open]
      - id: approved_once
        applies_to: [claims_settlement_approved]
        kind: dedup
        condition: Each claim is decided once.
        evidence_fields: [claims_ledger.claim_id, claims_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims_ledger.claim_id]
          action_bindings: {claims_ledger.claim_id: claim_id}
        dedup_contract:
          table: claims_ledger
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {event_type: [claims_settlement_approved, claims_claim_rejected]}
          distinct_fields: []
      - id: reefer_rank_for_temperature
        applies_to: [claims_settlement_approved]
        kind: authorization
        condition: Temperature damage is covered only for a container whose reefer service tier rank, in the reefer charter, is at least temperature_damage_min_reefer_rank.
        evidence_fields: [reefer_services.booking_id, reefer_services.container_number, reefer_services.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reefer_services.booking_id, reefer_services.container_number]
          action_bindings: {reefer_services.booking_id: booking_id, reefer_services.container_number: container_number}
    params:
      per_tier:
        AHL Standard Carrier Liability: {covered_damage_types: "=covered_damage_types", temperature_damage_min_reefer_rank: "=temperature_damage_min_reefer_rank", temperature_claim_requires_logged_excursion: "=temperature_claim_requires_logged_excursion", excursion_min_minutes_for_claim: "=excursion_min_minutes_for_claim", delay_loss_min_carrier_rolls: "=delay_loss_min_carrier_rolls"}
        AHL Declared Value Liability: {covered_damage_types: "=covered_damage_types", temperature_damage_min_reefer_rank: "=temperature_damage_min_reefer_rank", temperature_claim_requires_logged_excursion: "=temperature_claim_requires_logged_excursion", excursion_min_minutes_for_claim: "=excursion_min_minutes_for_claim", delay_loss_min_carrier_rolls: "=delay_loss_min_carrier_rolls"}
        AHL CargoCare Essential: {covered_damage_types: "=covered_damage_types", temperature_damage_min_reefer_rank: "=temperature_damage_min_reefer_rank", temperature_claim_requires_logged_excursion: "=temperature_claim_requires_logged_excursion", excursion_min_minutes_for_claim: "=excursion_min_minutes_for_claim", delay_loss_min_carrier_rolls: "=delay_loss_min_carrier_rolls"}
        AHL CargoCare Plus: {covered_damage_types: "=covered_damage_types", temperature_damage_min_reefer_rank: "=temperature_damage_min_reefer_rank", temperature_claim_requires_logged_excursion: "=temperature_claim_requires_logged_excursion", excursion_min_minutes_for_claim: "=excursion_min_minutes_for_claim", delay_loss_min_carrier_rolls: "=delay_loss_min_carrier_rolls"}
        AHL CargoCare Premium: {covered_damage_types: "=covered_damage_types", temperature_damage_min_reefer_rank: "=temperature_damage_min_reefer_rank", temperature_claim_requires_logged_excursion: "=temperature_claim_requires_logged_excursion", excursion_min_minutes_for_claim: "=excursion_min_minutes_for_claim", delay_loss_min_carrier_rolls: "=delay_loss_min_carrier_rolls"}
        AHL CargoCare Total: {covered_damage_types: "=covered_damage_types", temperature_damage_min_reefer_rank: "=temperature_damage_min_reefer_rank", temperature_claim_requires_logged_excursion: "=temperature_claim_requires_logged_excursion", excursion_min_minutes_for_claim: "=excursion_min_minutes_for_claim", delay_loss_min_carrier_rolls: "=delay_loss_min_carrier_rolls"}
    measures: [claims_msr_longest_excursion, claims_msr_carrier_rolls]

  - id: claims_settlement_calculation
    subject: [claims_settlement_approved]
    rule: >-
      The settlement of an admissible claim follows the product's liability_basis. Under hague_visby_limitation the line pays the proven loss,
      the claimed_amount_usd once documents are complete, but no more than the higher of sdr_per_package_limit times the affected packages
      and sdr_per_kg_limit times the affected gross weight in kilograms, converted at sdr_to_usd_rate and rounded to the cent, and the row
      records package_limitation or weight_limitation for whichever limit was higher when it bound, or proven_loss when the loss was below
      both. Under declared_value the line pays the proven loss up to the insured_value_usd pro rata to the affected packages over the
      package_count covered, recording declared_value when that cap binds and proven_loss otherwise. Under cargocare_cover the loss basis is
      the proven loss increased by valuation_uplift_pct percent; one deductible is taken off, the higher of deductible_per_claim_usd and the
      deductible for the kind of loss (wet_damage_deductible_usd for wet damage, temperature_damage_deductible_usd for temperature damage),
      never both; the result is capped at cover_cap_per_container_usd for the one container claimed and recording cover_limit when that cap
      binds. Delay loss is paid at the proven loss but no more than delay_loss_cap_pct_of_insured_value percent of the insured value per
      container and no more than max_delay_loss_per_container_usd, recording delay_cap when a cap binds. The annual aggregate then applies
      under claims_agg_annual_aggregate. A settlement is never negative. The desk may approve a settlement only up to the product's
      desk_settlement_authority_usd; a larger settlement is decided by the claims department. When premium_paid_before_settlement is true
      and premium_due_usd on the cover is above 0.00, the settlement is approved but not paid until the premium is paid.
    eligibility:
      - id: within_desk_authority
        applies_to: [claims_settlement_approved]
        kind: authorization
        condition: The desk may approve a settlement only up to the product's desk_settlement_authority_usd; a larger settlement is decided by the claims department.
        evidence_fields: [cargo_claims.claim_id, cargo_claims.claimed_amount_usd, cargo_covers.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_claims.claim_id]
          action_bindings: {cargo_claims.claim_id: claim_id}
    params:
      per_tier:
        AHL Standard Carrier Liability: {liability_basis: "=liability_basis", cover_cap_per_container_usd: "=cover_cap_per_container_usd", deductible_per_claim_usd: "=deductible_per_claim_usd", wet_damage_deductible_usd: "=wet_damage_deductible_usd", temperature_damage_deductible_usd: "=temperature_damage_deductible_usd", valuation_uplift_pct: "=valuation_uplift_pct", desk_settlement_authority_usd: "=desk_settlement_authority_usd"}
        AHL Declared Value Liability: {liability_basis: "=liability_basis", cover_cap_per_container_usd: "=cover_cap_per_container_usd", deductible_per_claim_usd: "=deductible_per_claim_usd", wet_damage_deductible_usd: "=wet_damage_deductible_usd", temperature_damage_deductible_usd: "=temperature_damage_deductible_usd", valuation_uplift_pct: "=valuation_uplift_pct", desk_settlement_authority_usd: "=desk_settlement_authority_usd"}
        AHL CargoCare Essential: {liability_basis: "=liability_basis", cover_cap_per_container_usd: "=cover_cap_per_container_usd", deductible_per_claim_usd: "=deductible_per_claim_usd", wet_damage_deductible_usd: "=wet_damage_deductible_usd", temperature_damage_deductible_usd: "=temperature_damage_deductible_usd", valuation_uplift_pct: "=valuation_uplift_pct", desk_settlement_authority_usd: "=desk_settlement_authority_usd"}
        AHL CargoCare Plus: {liability_basis: "=liability_basis", cover_cap_per_container_usd: "=cover_cap_per_container_usd", deductible_per_claim_usd: "=deductible_per_claim_usd", wet_damage_deductible_usd: "=wet_damage_deductible_usd", temperature_damage_deductible_usd: "=temperature_damage_deductible_usd", valuation_uplift_pct: "=valuation_uplift_pct", desk_settlement_authority_usd: "=desk_settlement_authority_usd"}
        AHL CargoCare Premium: {liability_basis: "=liability_basis", cover_cap_per_container_usd: "=cover_cap_per_container_usd", deductible_per_claim_usd: "=deductible_per_claim_usd", wet_damage_deductible_usd: "=wet_damage_deductible_usd", temperature_damage_deductible_usd: "=temperature_damage_deductible_usd", valuation_uplift_pct: "=valuation_uplift_pct", desk_settlement_authority_usd: "=desk_settlement_authority_usd"}
        AHL CargoCare Total: {liability_basis: "=liability_basis", cover_cap_per_container_usd: "=cover_cap_per_container_usd", deductible_per_claim_usd: "=deductible_per_claim_usd", wet_damage_deductible_usd: "=wet_damage_deductible_usd", temperature_damage_deductible_usd: "=temperature_damage_deductible_usd", valuation_uplift_pct: "=valuation_uplift_pct", desk_settlement_authority_usd: "=desk_settlement_authority_usd"}
    formula:
      hague_visby_limit_usd: round(max(sdr_per_package_limit * package_count, sdr_per_kg_limit * gross_weight_kg) * sdr_to_usd_rate, 2)
      cargocare_loss_basis: amount_usd * (1 + valuation_uplift_pct / 100)
      cargocare_settlement: max(0, min(cover_cap_per_container_usd, cargocare_loss_basis - max(deductible_per_claim_usd, wet_damage_deductible_usd, temperature_damage_deductible_usd)))
      delay_settlement: min(amount_usd, insured_value_usd * delay_loss_cap_pct_of_insured_value / 100, max_delay_loss_per_container_usd)

  - id: claims_settlement_payment
    subject: [claims_settlement_paid, claims_claim_closed]
    rule: >-
      A decided claim closes the open claim on the cover, whether it was settled or rejected. An approved settlement is paid to the claimant
      in full, for the amount approved, within settlement_payment_days calendar days of approval, referencing the approval row; it is never
      paid in instalments by the desk. When premium_paid_before_settlement is true the settlement is paid only once premium_due_usd on the
      cover is 0.00. A settlement may be paid only on a cover whose status is claim_open or claim_closed. Each approved claim is paid once. A
      settlement approved at 0.00 is closed without a payment row.
    eligibility:
      - id: premium_clear
        applies_to: [claims_settlement_paid]
        kind: authorization
        condition: When premium_paid_before_settlement is true the settlement is paid only once premium_due_usd on the cover is 0.00.
        evidence_fields: [cargo_covers.cover_id, cargo_covers.premium_due_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_covers.cover_id]
          action_bindings: {cargo_covers.cover_id: cover_id}
      - id: pay_decided_claim
        applies_to: [claims_settlement_paid]
        kind: state
        condition: A settlement may be paid only on a cover whose status is claim_open or claim_closed.
        evidence_fields: [cargo_covers.cover_id, cargo_covers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cargo_covers.cover_id]
          action_bindings: {cargo_covers.cover_id: cover_id}
        state_contract:
          field: cargo_covers.status
          allowed: [claim_open, claim_closed]
      - id: paid_once
        applies_to: [claims_settlement_paid]
        kind: dedup
        condition: Each approved claim is paid once.
        evidence_fields: [claims_ledger.claim_id, claims_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [claims_ledger.claim_id]
          action_bindings: {claims_ledger.claim_id: claim_id}
        dedup_contract:
          table: claims_ledger
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {event_type: [claims_settlement_paid]}
          distinct_fields: []
    params:
      per_tier:
        AHL Standard Carrier Liability: {settlement_payment_days: "=settlement_payment_days", premium_paid_before_settlement: "=premium_paid_before_settlement", claim_decision_days_after_documents: "=claim_decision_days_after_documents"}
        AHL Declared Value Liability: {settlement_payment_days: "=settlement_payment_days", premium_paid_before_settlement: "=premium_paid_before_settlement", claim_decision_days_after_documents: "=claim_decision_days_after_documents"}
        AHL CargoCare Essential: {settlement_payment_days: "=settlement_payment_days", premium_paid_before_settlement: "=premium_paid_before_settlement", claim_decision_days_after_documents: "=claim_decision_days_after_documents"}
        AHL CargoCare Plus: {settlement_payment_days: "=settlement_payment_days", premium_paid_before_settlement: "=premium_paid_before_settlement", claim_decision_days_after_documents: "=claim_decision_days_after_documents"}
        AHL CargoCare Premium: {settlement_payment_days: "=settlement_payment_days", premium_paid_before_settlement: "=premium_paid_before_settlement", claim_decision_days_after_documents: "=claim_decision_days_after_documents"}
        AHL CargoCare Total: {settlement_payment_days: "=settlement_payment_days", premium_paid_before_settlement: "=premium_paid_before_settlement", claim_decision_days_after_documents: "=claim_decision_days_after_documents"}

  - id: claims_cover_expiry_and_delivery
    subject: [claims_cover_expired, claims_cargo_delivered]
    rule: >-
      Delivery of the covered cargo, recorded when the transport document is released and the cargo leaves the terminal, sets the cover's
      delivery_date, from which every notice window and the time bar are counted. The system expires a cover with no open claim once the
      product's claim_time_bar_months have run from the delivery_date, and an expired cover takes no further claim. A cover with an open
      claim does not expire until the claim is decided. Claims are decided within claim_decision_days_after_documents of the documents being
      complete, as a service standard.
    eligibility: []

extended_policies:
  - id: claims_ext_settlement_invoice_share
    base_policy_refs: [claims_agg_annual_aggregate, claims_coverage_and_exclusions, claims_settlement_calculation]
    overwrite:
      - base_policy: claims_settlement_calculation
        superseded_clause: >-
          Under hague_visby_limitation the line pays the proven loss, the claimed_amount_usd once documents are complete
        replaced_by: >-
          The proven loss is the claimed_amount_usd, but never more than the commercial invoice value of the affected packages
      - base_policy: claims_agg_annual_aggregate
        superseded_clause: >-
          For a product whose annual_aggregate_limit_usd is above 0.00, the settlements approved on all the cover holder's covers of
          that product in the trailing 365 days, claims_msr_settled_365d, plus the settlement being approved may not exceed the
          product's annual_aggregate_limit_usd.
        replaced_by: >-
          For a product whose annual_aggregate_limit_usd is above 0.00, the settlement is then reduced to the aggregate still
          available on the cover, which is annual_aggregate_limit_usd less the amounts of the settlement approvals already booked on
          the same cover whose approval date lies fewer than 12 whole calendar months before the approval date; a product whose
          annual_aggregate_limit_usd is 0.00 is not reduced.
      - base_policy: claims_agg_annual_aggregate
        superseded_clause: >-
          CargoCare products carry an annual aggregate per cover holder.
        replaced_by: >-
          The annual aggregate is kept per cover, not per cover holder, and settlements approved on the holder's other covers of the
          product do not reduce it.
    trigger: state_due
    subject: [claims_settlement_approved]
    computes: amount_usd
    target_tool: approve_claim_settlement_060ed8c3
    rule: >-
      This policy fixes the amount written when a claim is approved for settlement, for every kind of loss except delay loss, which
      keeps the delay-loss caps of claims_settlement_calculation. The claim approved is the cover's claim file in the
      documents_complete state, of which a cover carries at most one; its claimed_amount_usd, affected_package_count and
      affected_weight_kg are taken from that file, and
      because only one claim is open on a cover at a time it is also the most recent notice on the cover, whose damage_type is the
      kind of loss. The proven loss is the claimed_amount_usd, but never more than the commercial invoice value of the affected
      packages, which is the declared_cargo_value_usd printed on the transport document of the cover's booking recorded for the cover
      holder, divided by that document's package_count and multiplied by the affected_package_count, rounded to the cent; when no
      such transport document with a declared cargo value is recorded for the cover holder, the proven loss is the claimed_amount_usd. Under hague_visby_limitation the settlement is the
      proven loss, but no more than the Hague-Visby limit, which is the higher of sdr_per_package_limit times the affected packages
      and sdr_per_kg_limit times the affected weight in kilograms, that higher figure converted at sdr_to_usd_rate and rounded to
      the cent. Under declared_value the settlement is the proven loss, but no more than the declared value share, which is the
      cover's insured_value_usd times the affected packages divided by the cover's package_count, rounded to the cent. Under
      cargocare_cover the proven loss is first increased by valuation_uplift_pct percent, giving the loss basis; one deductible is
      then taken off that loss basis, the higher of deductible_per_claim_usd and the deductible for the kind of loss
      (wet_damage_deductible_usd for wet damage, temperature_damage_deductible_usd for temperature damage, none for any other
      kind), never both; the remainder, never below 0.00, is then capped at cover_cap_per_container_usd. For a product whose
      annual_aggregate_limit_usd is above 0.00, the settlement is then reduced to the aggregate still available on the cover, which
      is annual_aggregate_limit_usd less the amounts of the settlement approvals already booked on the same cover whose approval
      date lies fewer than 12 whole calendar months before the approval date; a product whose annual_aggregate_limit_usd is 0.00 is
      not reduced. The annual aggregate is kept per cover, not per cover holder, and settlements approved on the holder's other covers
      of the product do not reduce it. The final amount is rounded to the cent; apart from the invoice value of the affected packages, the Hague-Visby
      limit and the declared value share, no intermediate figure is rounded. The approval records package_limitation or
      weight_limitation when the Hague-Visby limit bound, naming whichever of its two limits was the higher, declared_value when
      the declared value share bound, cover_limit when the per-container cap bound, aggregate_limit when the aggregate reduced the
      amount, and proven_loss otherwise, including when the invoice value of the affected packages limited the proven loss.
    prerequisite: []
    cross_category:
      - category: bol
        as: branch
        reads: [declared_cargo_value_usd, package_count]
        note: The declared cargo value and package count on the booking's transport document give the invoice value of the affected packages, which caps the proven loss.
    compute:
      - basis: "P('liability_basis')"
      - claimed: "SUM('cargo_claims', 'claimed_amount_usd', outcome='documents_complete')"
      - affected_packages: "SUM('cargo_claims', 'affected_package_count', outcome='documents_complete')"
      - affected_weight: "SUM('cargo_claims', 'affected_weight_kg', outcome='documents_complete')"
      - loss_kind: "LATEST('cargo_claims', 'damage_type', date_field='notice_date')"
      - doc_value: "CFIELD('bol', 'declared_cargo_value_usd', booking_id=F('booking_id'))"
      - doc_packages: "CFIELD('bol', 'package_count', booking_id=F('booking_id'))"
      - invoice_share: "RND(doc_value * affected_packages / doc_packages, 2) if (doc_value and doc_packages) else claimed"
      - proven: "MN(claimed, invoice_share)"
      - hv_limit: "RND(MX(P('sdr_per_package_limit') * affected_packages, P('sdr_per_kg_limit') * affected_weight) * P('sdr_to_usd_rate'), 2)"
      - dv_share: "RND(F('insured_value_usd') * affected_packages / F('package_count'), 2)"
      - loss_basis: "proven * (1 + P('valuation_uplift_pct') / 100)"
      - kind_deductible: "P('wet_damage_deductible_usd') if loss_kind == 'wet_damage' else (P('temperature_damage_deductible_usd') if loss_kind == 'temperature_damage' else 0)"
      - deductible: "MX(P('deductible_per_claim_usd'), kind_deductible)"
      - cargocare_amount: "MN(P('cover_cap_per_container_usd'), MX(0, loss_basis - deductible))"
      - pre_aggregate: "MN(proven, hv_limit) if basis == 'hague_visby_limitation' else (MN(proven, dv_share) if basis == 'declared_value' else cargocare_amount)"
      - approved_12m: "SUM('claims_ledger', 'amount_usd', within_months=12, event_type='claims_settlement_approved')"
      - aggregate_left: "MX(0, P('annual_aggregate_limit_usd') - approved_12m)"
      - result: "RND(MN(pre_aggregate, aggregate_left) if P('annual_aggregate_limit_usd') > 0 else pre_aggregate, 2)"
    compute_basis:
      basis: "This policy fixes the amount written when a claim is approved for settlement, for every kind of loss except delay loss, which keeps the delay-loss caps of claims_settlement_calculation."
      claimed: "The claim approved is the cover's claim file in the documents_complete state, of which a cover carries at most one; its claimed_amount_usd, affected_package_count and affected_weight_kg are taken from that file"
      affected_packages: "its claimed_amount_usd, affected_package_count and affected_weight_kg are taken from that file"
      affected_weight: "affected_weight_kg are taken from that file"
      loss_kind: "because only one claim is open on a cover at a time it is also the most recent notice on the cover, whose damage_type is the kind of loss."
      doc_value: "which is the declared_cargo_value_usd printed on the transport document of the cover's booking recorded for the cover holder, divided by that document's package_count"
      doc_packages: "divided by that document's package_count"
      invoice_share: "divided by that document's package_count and multiplied by the affected_package_count, rounded to the cent; when no such transport document with a declared cargo value is recorded for the cover holder, the proven loss is the claimed_amount_usd."
      proven: "The proven loss is the claimed_amount_usd, but never more than the commercial invoice value of the affected packages"
      hv_limit: "which is the higher of sdr_per_package_limit times the affected packages and sdr_per_kg_limit times the affected weight in kilograms, that higher figure converted at sdr_to_usd_rate and rounded to the cent."
      dv_share: "which is the cover's insured_value_usd times the affected packages divided by the cover's package_count, rounded to the cent."
      loss_basis: "Under cargocare_cover the proven loss is first increased by valuation_uplift_pct percent, giving the loss basis"
      kind_deductible: "the deductible for the kind of loss (wet_damage_deductible_usd for wet damage, temperature_damage_deductible_usd for temperature damage, none for any other kind), never both"
      deductible: "one deductible is then taken off that loss basis, the higher of deductible_per_claim_usd and the deductible for the kind of loss"
      cargocare_amount: "the remainder, never below 0.00, is then capped at cover_cap_per_container_usd."
      pre_aggregate: "Under hague_visby_limitation the settlement is the proven loss, but no more than the Hague-Visby limit, ... Under declared_value the settlement is the proven loss, but no more than the declared value share"
      approved_12m: "the amounts of the settlement approvals already booked on the same cover whose approval date lies fewer than 12 whole calendar months before the approval date"
      aggregate_left: "the settlement is then reduced to the aggregate still available on the cover, which is annual_aggregate_limit_usd less the amounts of the settlement approvals already booked on the same cover ... The annual aggregate is kept per cover, not per cover holder, and settlements approved on the holder's other covers of the product do not reduce it."
      result: "a product whose annual_aggregate_limit_usd is 0.00 is not reduced. ... The final amount is rounded to the cent; apart from the invoice value of the affected packages, the Hague-Visby limit and the declared value share, no intermediate figure is rounded."
    inputs:
      history:
        - {table: cargo_claims, aggregate: sum, field: claimed_amount_usd, filters: {outcome: documents_complete}}
        - {table: cargo_claims, aggregate: sum, field: affected_package_count, filters: {outcome: documents_complete}}
        - {table: cargo_claims, aggregate: sum, field: affected_weight_kg, filters: {outcome: documents_complete}}
        - {table: cargo_claims, aggregate: latest, field: damage_type, filters: {}}
        - {table: claims_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: claims_settlement_approved}}
      cross_category: [bol]

  - id: claims_ext_notice_container_value
    base_policy_refs: [claims_notice_and_time_bar]
    overwrite: []
    trigger: on_request
    subject: [claims_claim_lodged]
    computes: claimed_amount_usd
    target_tool: lodge_cargo_claim_268664bf
    rule: >-
      A notice of loss is lodged by the claimant in person. Each notice names one container and one loss; a loss found in another
      container of the same shipment is never added to a claim file already on the cover and needs a notice of its own. The desk
      registers a notice whenever the lodging conditions of claims_notice_and_time_bar are met, that is when the claimant is one the
      product's claimants_allowed admits, the cover has taken fewer than max_claims_per_cover claims counted by
      claims_msr_claims_on_cover, and no claim is open on the cover; it does not decline such a notice because the notice will be
      rejected as soon as it is registered, and a notice that fails one of those lodging conditions is not registered at all. A
      further notice can be lodged on a cover only when no claim is open on it: a claim still open on the cover whose documents are
      complete is decided by the desk before the further notice is lodged, while a claim still awaiting its documents keeps the
      cover closed to further notices until it is decided or withdrawn. The amount entered on a notice is the commercial invoice
      value of the goods in one container of the shipment, which is the declared_cargo_value_usd printed on the transport document of
      the cover's booking recorded for the cover holder, divided by the container_count of that booking recorded for the cover
      holder, rounded to the cent; when either of those records is missing or carries no value, it is the cover's insured_value_usd
      divided by the cover's container_count, rounded to the cent. When the product's cover_cap_per_container_usd is above 0.00 and
      that container value exceeds it, the notice carries cover_cap_per_container_usd instead. The notice amount is the value at risk
      in the container named; it is not the proven loss, which is fixed only when the claim is settled, and the claimant's own
      quantification of the loss follows with the claim documents. The container number, the kind of loss, whether the loss was
      apparent at delivery and the packages and weight affected are entered exactly as the claimant states them.
    prerequisite:
      - problem: claims_ext_settlement_invoice_share
        kind: state_gate
        gate: claims_notice_and_time_bar.claim_cap
        condition: >-
          No claim is open on the cover when the further notice is lodged, the claim that was open with its documents complete having
          been decided.
        policy_source: >-
          A further notice can be lodged on a cover only when no claim is open on it: a claim still open on the cover whose documents
          are complete is decided by the desk before the further notice is lodged
        resolved_by: approve_claim_settlement_060ed8c3
        effect: >-
          Once the open documented claim is approved for settlement its file leaves the open state, so after the decided claim is
          closed the cover takes the further notice without breaching the one-open-claim limit of claims_notice_and_time_bar.claim_cap.
    cross_category:
      - category: bol
        as: branch
        reads: [declared_cargo_value_usd]
        note: The declared cargo value on the booking's transport document is the invoice value spread over the containers.
      - category: booking
        as: branch
        reads: [container_count]
        note: The booking's container count divides the declared cargo value into the value of one container.
    compute:
      - doc_value: "CFIELD('bol', 'declared_cargo_value_usd', booking_id=F('booking_id'))"
      - booking_containers: "CFIELD('booking', 'container_count', booking_id=F('booking_id'))"
      - container_value: "RND(doc_value / booking_containers, 2) if (doc_value and booking_containers) else RND(F('insured_value_usd') / F('container_count'), 2)"
      - container_cap: "P('cover_cap_per_container_usd')"
      - capped_value: "container_cap if (container_cap > 0 and container_value > container_cap) else container_value"
      - result: "RND(capped_value, 2)"
    compute_basis:
      doc_value: "which is the declared_cargo_value_usd printed on the transport document of the cover's booking recorded for the cover holder"
      booking_containers: "divided by the container_count of that booking recorded for the cover holder, rounded to the cent"
      container_value: "The amount entered on a notice is the commercial invoice value of the goods in one container of the shipment ... when either of those records is missing or carries no value, it is the cover's insured_value_usd divided by the cover's container_count, rounded to the cent."
      container_cap: "When the product's cover_cap_per_container_usd is above 0.00 and that container value exceeds it"
      capped_value: "When the product's cover_cap_per_container_usd is above 0.00 and that container value exceeds it, the notice carries cover_cap_per_container_usd instead."
      result: "rounded to the cent"
    inputs:
      history: []
      cross_category: [bol, booking]

  - id: claims_ext_lodging_rejection_grounds
    base_policy_refs: [claims_coverage_and_exclusions, claims_notice_and_time_bar]
    overwrite: []
    trigger: state_due
    subject: [claims_claim_rejected]
    computes: rejection_reason
    target_tool: reject_cargo_claim_5f9631bd
    rule: >-
      This policy decides whether a registered notice is rejected at once, and with which controlled reason, on the grounds that
      turn only on the cover, the notice itself and the reefer service of the container named. A notice can be decided here only
      once it has been registered on the cover. The notice decided is the cover's claim file in the notice_registered state, which
      is also the most recent notice on the cover; its claimed_amount_usd is the amount on that file, and its container_number,
      damage_type, damage_apparent_at_delivery and notice_date are those of the most recent notice. The grounds are examined in the
      order below, the first ground that applies is the reason recorded, and a notice meeting none of them is not rejected under
      this policy. First, a claimed_amount_usd below minimum_claim_amount_usd gives below_minimum_claim. Second, a damage_type that
      is not among the product's covered_damage_types, or temperature damage on a container whose reefer service tier rank in the
      reefer charter is below temperature_damage_min_reefer_rank, gives not_covered_by_tier; the reefer service is the one recorded for
      the cover holder on the cover's booking for the container named, and a container with no reefer service counts as tier rank 0. Third, a notice dated
      after the time bar gives claim_time_barred; the time bar falls on the same calendar day of the month claim_time_bar_months
      calendar months after the cover's delivery_date, or on the last day of that month when it has no such day, and a notice dated
      on that day is in time. Fourth, a notice dated later than the last day of its notice window gives notice_out_of_time; the
      window is notice_days_delay_loss calendar days for delay loss, apparent_damage_notice_days calendar days for any other loss
      apparent at delivery when that number is above 0, and notice_days_non_apparent_damage calendar days for loss not apparent at
      delivery, its last day being the cover's delivery_date plus those days counted on calendar dates, and a notice dated on that
      last day is in time. Loss other than delay loss that was apparent at delivery, under a product whose
      apparent_damage_notice_days is 0, has no dated window: its requirement is the notation on the delivery receipt, which a notice
      recorded as apparent at delivery carries, so such a notice is never rejected with notice_out_of_time. A notice
      that meets one of these grounds is rejected as soon as it is registered, because no claim document can remove the ground, and
      these grounds are examined before any rejection for no logged excursion, misdeclared cargo, an excluded peril or missing
      documents.
    prerequisite:
      - problem: claims_ext_notice_container_value
        kind: value_input
        gate: notice_amount
        condition: >-
          The notice being decided is registered on the cover, carrying its amount, container, kind of loss, apparent-at-delivery
          flag and notice date.
        policy_source: >-
          A notice can be decided here only once it has been registered on the cover.
        resolved_by: lodge_cargo_claim_268664bf
        effect: >-
          Registering the notice creates the notice_registered file whose claimed_amount_usd becomes notice_amount and whose notice
          date, kind of loss and container become the most recent notice read by every other binding; without it notice_amount is
          0.00 and the decision falls on a different file.
    cross_category:
      - category: reefer
        as: branch
        reads: [variant_name]
        note: The tier of the reefer service on the claimed container gives the reefer rank that decides whether temperature damage is covered.
    compute:
      - notice_amount: "SUM('cargo_claims', 'claimed_amount_usd', outcome='notice_registered')"
      - loss_kind: "LATEST('cargo_claims', 'damage_type', date_field='notice_date')"
      - apparent: "LATEST('cargo_claims', 'damage_apparent_at_delivery', date_field='notice_date')"
      - notice_on: "LATEST('cargo_claims', 'notice_date', date_field='notice_date')"
      - container: "LATEST('cargo_claims', 'container_number', date_field='notice_date')"
      - reefer_tier: "CFIELD('reefer', 'variant_name', booking_id=F('booking_id'), container_number=container)"
      - reefer_rank: "6 if reefer_tier == 'AHL Reefer Superfreezer' else (5 if reefer_tier == 'AHL Reefer Pharma GDP' else (4 if reefer_tier == 'AHL Reefer Controlled Atmosphere' else (3 if reefer_tier == 'AHL Reefer Cold Treatment' else (2 if reefer_tier == 'AHL Reefer Monitored' else (1 if reefer_tier == 'AHL Reefer Standard' else 0)))))"
      - kind_covered: "loss_kind in P('covered_damage_types')"
      - tier_covers: "kind_covered and (reefer_rank >= P('temperature_damage_min_reefer_rank') if loss_kind == 'temperature_damage' else True)"
      - bar_months: "MONTHS(F('delivery_date'), notice_on)"
      - within_bar: "bar_months < P('claim_time_bar_months') or (bar_months == P('claim_time_bar_months') and MONTHS(notice_on, F('delivery_date')) == -P('claim_time_bar_months'))"
      - window_days: "P('notice_days_delay_loss') if loss_kind == 'delay_loss' else (P('apparent_damage_notice_days') if apparent else P('notice_days_non_apparent_damage'))"
      - within_window: "True if (apparent and loss_kind != 'delay_loss' and P('apparent_damage_notice_days') == 0) else DAYS(F('delivery_date'), notice_on) <= window_days"
      - result: "'below_minimum_claim' if notice_amount < P('minimum_claim_amount_usd') else ('not_covered_by_tier' if not tier_covers else ('claim_time_barred' if not within_bar else ('notice_out_of_time' if not within_window else 'not_applicable')))"
    compute_basis:
      notice_amount: "The notice decided is the cover's claim file in the notice_registered state, which is also the most recent notice on the cover; its claimed_amount_usd is the amount on that file"
      loss_kind: "its container_number, damage_type, damage_apparent_at_delivery and notice_date are those of the most recent notice."
      apparent: "its container_number, damage_type, damage_apparent_at_delivery and notice_date are those of the most recent notice."
      notice_on: "its container_number, damage_type, damage_apparent_at_delivery and notice_date are those of the most recent notice."
      container: "its container_number, damage_type, damage_apparent_at_delivery and notice_date are those of the most recent notice."
      reefer_tier: "the reefer service is the one recorded for the cover holder on the cover's booking for the container named"
      reefer_rank: "temperature damage on a container whose reefer service tier rank in the reefer charter is below temperature_damage_min_reefer_rank, gives not_covered_by_tier; ... and a container with no reefer service counts as tier rank 0."
      kind_covered: "a damage_type that is not among the product's covered_damage_types"
      tier_covers: "Second, a damage_type that is not among the product's covered_damage_types, or temperature damage on a container whose reefer service tier rank in the reefer charter is below temperature_damage_min_reefer_rank, gives not_covered_by_tier"
      bar_months: "the time bar falls on the same calendar day of the month claim_time_bar_months calendar months after the cover's delivery_date"
      within_bar: "the time bar falls on the same calendar day of the month claim_time_bar_months calendar months after the cover's delivery_date, or on the last day of that month when it has no such day, and a notice dated on that day is in time."
      window_days: "the window is notice_days_delay_loss calendar days for delay loss, apparent_damage_notice_days calendar days for any other loss apparent at delivery when that number is above 0, and notice_days_non_apparent_damage calendar days for loss not apparent at delivery"
      within_window: "its last day being the cover's delivery_date plus those days counted on calendar dates, and a notice dated on that last day is in time. Loss other than delay loss that was apparent at delivery, under a product whose apparent_damage_notice_days is 0, has no dated window: its requirement is the notation on the delivery receipt, which a notice recorded as apparent at delivery carries, so such a notice is never rejected with notice_out_of_time."
      result: "The grounds are examined in the order below, the first ground that applies is the reason recorded, and a notice meeting none of them is not rejected under this policy. First, a claimed_amount_usd below minimum_claim_amount_usd gives below_minimum_claim."
    inputs:
      history:
        - {table: cargo_claims, aggregate: sum, field: claimed_amount_usd, filters: {outcome: notice_registered}}
        - {table: cargo_claims, aggregate: latest, field: notice_date, filters: {}}
      cross_category: [reefer]

  - id: claims_ext_bind_invoice_value
    base_policy_refs: [claims_cover_eligibility]
    overwrite: []
    trigger: on_request
    subject: [claims_cover_bound]
    computes: insured_value_usd
    target_tool: bind_cargo_cover_f980fecc
    rule: >-
      When a quoted CargoCare or declared value cover is bound at the cover holder's instruction, the insured value it is bound for
      is the commercial invoice value of the goods the cover takes, and the value carried on the quote is a preliminary estimate that
      binding replaces. That invoice value is the declared_cargo_value_usd printed on the transport document of the cover's booking
      recorded for the cover holder, multiplied by the containers the cover takes (the cover's container_count) and divided by the
      container_count of that booking recorded for the cover holder, the result rounded to the cent. When either of those records is
      missing or carries no value, the insured value on the quote is kept. The value so fixed must lie within the product's
      min_insured_value_usd and max_cover_value_usd, as claims_cover_eligibility requires: a cover whose value so fixed is below the
      minimum or above the maximum is not bound at all, and no other value is substituted for it. This policy governs the binding
      of a cover whose premium is settled after binding; a cover whose holder's credit_status is cash_in_advance under a product whose
      premium_prepayment_required is true, whose premium claims_cover_eligibility requires to be received before binding, is outside
      this policy and outside the premium charge and premium settlement policies that follow binding. Within that scope every other
      binding gate of claims_cover_eligibility still applies, including the binding deadline counted back from the booking's etd_date
      and the bar on binding a CargoCare product for a holder on credit_hold.
    prerequisite: []
    cross_category:
      - category: bol
        as: branch
        reads: [declared_cargo_value_usd]
        note: The declared cargo value on the booking's transport document is the invoice value that the insured value is bound on.
      - category: booking
        as: branch
        reads: [container_count]
        note: The booking's container count is the divisor that spreads the declared value over the containers the cover takes.
    compute:
      - doc_value: "CFIELD('bol', 'declared_cargo_value_usd', booking_id=F('booking_id'))"
      - booking_containers: "CFIELD('booking', 'container_count', booking_id=F('booking_id'))"
      - covered_containers: "F('container_count')"
      - invoice_value: "RND(doc_value * covered_containers / booking_containers, 2) if (doc_value and booking_containers) else F('insured_value_usd')"
      - result: "RND(invoice_value, 2)"
    compute_basis:
      doc_value: "That invoice value is the declared_cargo_value_usd printed on the transport document of the cover's booking recorded for the cover holder"
      booking_containers: "divided by the container_count of that booking recorded for the cover holder, the result rounded to the cent."
      covered_containers: "multiplied by the containers the cover takes (the cover's container_count)"
      invoice_value: "That invoice value is the declared_cargo_value_usd printed on the transport document of the cover's booking recorded for the cover holder, multiplied by the containers the cover takes (the cover's container_count) and divided by the container_count of that booking recorded for the cover holder, the result rounded to the cent. When either of those records is missing or carries no value, the insured value on the quote is kept."
      result: "the result rounded to the cent. ... a cover whose value so fixed is below the minimum or above the maximum is not bound at all, and no other value is substituted for it."
    inputs:
      history: []
      cross_category: [bol, booking]

  - id: claims_ext_premium_contract_rank
    base_policy_refs: [claims_premium]
    overwrite: []
    trigger: state_due
    subject: [claims_premium_charged]
    computes: amount_usd
    target_tool: charge_cover_premium_8ce00127
    rule: >-
      The premium charged on a bound cover is built up on the insured_value_usd the cover was bound for. First the insured value is
      multiplied by premium_rate_pct_of_insured_value percent, giving the base premium. Then the base premium is increased by the
      uplift percent for the cover's cargo_type (dg_cargo_premium_uplift_pct for dangerous_goods, reefer_cargo_premium_uplift_pct for
      reefer, oog_premium_uplift_pct for out_of_gauge, none for general), giving the gross premium. Then the gross premium is reduced
      by contract_premium_discount_pct percent when the cover holder holds an active service contract whose tier rank in the contract
      charter (Starter 1, Standard 2, Regional Account 3, Key Account 4, Global Account 5, Strategic Partner 6) is at least
      premium_discount_min_contract_rank and premium_discount_min_contract_rank is not 0; the contract read is the holder's contract in
      the active status on any trade lane, and a holder with no active contract gets no discount. The uplift and the discount act one
      after the other, each on the result of the step before, never combined into one rate. The result is raised to the higher of
      minimum_premium_per_container_usd times the cover's container_count and minimum_premium_per_cover_usd, and only this final
      figure is rounded to the cent. The premium is worked out on the insured value fixed when the cover is bound, so a quoted cover is
      bound before its premium is charged, and a bound cover whose premium has not been charged owes that charge. This policy governs
      the premium of a cover whose premium is settled after binding; a premium that claims_cover_eligibility requires to be received
      before binding, because the holder's credit_status is cash_in_advance and the product's premium_prepayment_required is true, is
      outside this policy.
    prerequisite:
      - problem: claims_ext_bind_invoice_value
        kind: value_input
        gate: insured
        condition: >-
          The cover is active and its insured value has been fixed at binding under the insured-value rule for binding before the
          premium is built up.
        policy_source: >-
          The premium is worked out on the insured value fixed when the cover is bound, so a quoted cover is bound before its premium
          is charged
        resolved_by: bind_cargo_cover_f980fecc
        effect: >-
          Binding turns the cover active (claims_premium.premium_on_active) and replaces the quoted estimate with the bound insured
          value, which becomes the binding insured and every later factor of the premium.
    cross_category:
      - category: contract
        as: branch
        reads: [variant_name, status]
        note: The tier of the holder's active service contract gives the rank that decides whether the contract premium discount applies.
    compute:
      - insured: "F('insured_value_usd')"
      - cargo: "F('cargo_type')"
      - uplift_pct: "P('dg_cargo_premium_uplift_pct') if cargo == 'dangerous_goods' else (P('reefer_cargo_premium_uplift_pct') if cargo == 'reefer' else (P('oog_premium_uplift_pct') if cargo == 'out_of_gauge' else 0))"
      - contract_tier: "CFIELD('contract', 'variant_name', status='active')"
      - contract_rank: "6 if contract_tier == 'AHL Strategic Partner Contract' else (5 if contract_tier == 'AHL Global Account Contract' else (4 if contract_tier == 'AHL Key Account Contract' else (3 if contract_tier == 'AHL Regional Account Contract' else (2 if contract_tier == 'AHL Standard Service Contract' else (1 if contract_tier == 'AHL Starter Service Contract' else 0)))))"
      - discount_pct: "P('contract_premium_discount_pct') if (P('premium_discount_min_contract_rank') > 0 and contract_rank >= P('premium_discount_min_contract_rank')) else 0"
      - base_premium: "insured * P('premium_rate_pct_of_insured_value') / 100"
      - gross_premium: "base_premium * (1 + uplift_pct / 100)"
      - net_premium: "gross_premium * (1 - discount_pct / 100)"
      - minimum_premium: "MX(P('minimum_premium_per_container_usd') * F('container_count'), P('minimum_premium_per_cover_usd'))"
      - result: "RND(MX(net_premium, minimum_premium), 2)"
    compute_basis:
      insured: "The premium charged on a bound cover is built up on the insured_value_usd the cover was bound for."
      cargo: "the uplift percent for the cover's cargo_type"
      uplift_pct: "the uplift percent for the cover's cargo_type (dg_cargo_premium_uplift_pct for dangerous_goods, reefer_cargo_premium_uplift_pct for reefer, oog_premium_uplift_pct for out_of_gauge, none for general)"
      contract_tier: "the contract read is the holder's contract in the active status on any trade lane, and a holder with no active contract gets no discount."
      contract_rank: "tier rank in the contract charter (Starter 1, Standard 2, Regional Account 3, Key Account 4, Global Account 5, Strategic Partner 6)"
      discount_pct: "Then the gross premium is reduced by contract_premium_discount_pct percent when the cover holder holds an active service contract whose tier rank in the contract charter (Starter 1, Standard 2, Regional Account 3, Key Account 4, Global Account 5, Strategic Partner 6) is at least premium_discount_min_contract_rank and premium_discount_min_contract_rank is not 0"
      base_premium: "First the insured value is multiplied by premium_rate_pct_of_insured_value percent, giving the base premium."
      gross_premium: "Then the base premium is increased by the uplift percent for the cover's cargo_type"
      net_premium: "The uplift and the discount act one after the other, each on the result of the step before, never combined into one rate."
      minimum_premium: "The result is raised to the higher of minimum_premium_per_container_usd times the cover's container_count and minimum_premium_per_cover_usd"
      result: "and only this final figure is rounded to the cent."
    inputs:
      history: []
      cross_category: [contract]

  - id: claims_ext_premium_balance_remittance
    base_policy_refs: [claims_premium]
    overwrite: []
    trigger: on_request
    subject: [claims_premium_paid]
    computes: amount_usd
    target_tool: pay_cover_premium_9f1f968f
    rule: >-
      When a cover holder settles the premium of a bound cover in full in person, the amount paid is the premium balance owed on the
      cover. This policy governs every premium settled after binding; a premium that claims_cover_eligibility requires to be received before binding, because the holder's credit_status is
      cash_in_advance and the product's premium_prepayment_required is true, is outside this policy. On the cover's bound_date the
      premium owed is the premium the cover's product yields on the insured value the cover was bound for, built up exactly as the
      premium charge is built up (the base premium at premium_rate_pct_of_insured_value percent, then the cargo_type uplift on that
      result, then the contract_premium_discount_pct discount on that result for a holder whose active service contract has a tier
      rank of at least premium_discount_min_contract_rank, then raised to the higher of minimum_premium_per_container_usd times the
      container_count and minimum_premium_per_cover_usd, and rounded to the cent), because the premium charge booked that day
      applies the same build-up to the same records; on any later date the premium owed is the sum of the premium charges booked on
      the cover. A cover that has never been bound, and so carries no bound_date, owes no premium under this policy, and its premium
      owed is 0.00. The balance is the premium owed less the amounts of every premium remittance already applied to the cover and of
      every premium refund already booked on it, the difference rounded to the cent and never below 0.00. A remittance is taken only
      against premium already charged to the cover, so a bound cover whose premium has not yet been charged has it charged before the
      holder pays. The balance is worked out on a bound cover, so, outside the prepaid case, a quoted cover is bound before its
      premium is settled. The payment reference is written exactly as the cover holder quotes it, and a reference is recorded once
      per cover.
    prerequisite:
      - problem: claims_ext_premium_contract_rank
        kind: state_gate
        gate: claims_premium.remittance_once
        condition: >-
          Premium has been charged to the cover, so the unpaid premium on the cover carries the amount the holder's payment settles.
        policy_source: >-
          A remittance is taken only against premium already charged to the cover, so a bound cover whose premium has not yet been
          charged has it charged before the holder pays.
        resolved_by: charge_cover_premium_8ce00127
        effect: >-
          The premium charge raises cargo_covers.premium_due_usd from 0.00 to the premium, so the payment of the balance stays within
          premium_due_usd as claims_premium.remittance_once requires and brings it back to 0.00 instead of leaving a credit.
      - problem: claims_ext_bind_invoice_value
        kind: value_input
        gate: premium_owed
        condition: >-
          The quoted cover has been bound, so it carries a binding date and the insured value fixed at binding.
        policy_source: >-
          The balance is worked out on a bound cover, so, outside the prepaid case, a quoted cover is bound before its premium is
          settled.
        resolved_by: bind_cargo_cover_f980fecc
        effect: >-
          Binding sets the cover active with bound_date and the insured value fixed at binding, so premium_owed moves from 0.00 (a cover
          never bound owes no premium) to the premium the product yields on the bound insured value.
    cross_category:
      - category: contract
        as: branch
        reads: [variant_name, status]
        note: The tier of the holder's active service contract decides whether the premium owed on the binding date carries the contract discount.
    compute:
      - bound_insured: "F('insured_value_usd')"
      - cargo: "F('cargo_type')"
      - uplift_pct: "P('dg_cargo_premium_uplift_pct') if cargo == 'dangerous_goods' else (P('reefer_cargo_premium_uplift_pct') if cargo == 'reefer' else (P('oog_premium_uplift_pct') if cargo == 'out_of_gauge' else 0))"
      - contract_tier: "CFIELD('contract', 'variant_name', status='active')"
      - contract_rank: "6 if contract_tier == 'AHL Strategic Partner Contract' else (5 if contract_tier == 'AHL Global Account Contract' else (4 if contract_tier == 'AHL Key Account Contract' else (3 if contract_tier == 'AHL Regional Account Contract' else (2 if contract_tier == 'AHL Standard Service Contract' else (1 if contract_tier == 'AHL Starter Service Contract' else 0)))))"
      - discount_pct: "P('contract_premium_discount_pct') if (P('premium_discount_min_contract_rank') > 0 and contract_rank >= P('premium_discount_min_contract_rank')) else 0"
      - product_premium: "RND(MX(bound_insured * P('premium_rate_pct_of_insured_value') / 100 * (1 + uplift_pct / 100) * (1 - discount_pct / 100), MX(P('minimum_premium_per_container_usd') * F('container_count'), P('minimum_premium_per_cover_usd'))), 2)"
      - on_bound_date: "F('bound_date') == NOW"
      - premium_owed: "0 if not F('bound_date') else (product_premium if on_bound_date else SUM('claims_ledger', 'amount_usd', event_type='claims_premium_charged'))"
      - remitted: "SUM('claims_ledger', 'amount_usd', event_type='claims_premium_paid')"
      - refunded: "SUM('claims_ledger', 'amount_usd', event_type='claims_premium_refunded')"
      - result: "RND(MX(0, premium_owed - remitted - refunded), 2)"
    compute_basis:
      bound_insured: "the premium the cover's product yields on the insured value the cover was bound for"
      cargo: "then the cargo_type uplift on that result"
      uplift_pct: "then the cargo_type uplift on that result"
      contract_tier: "for a holder whose active service contract has a tier rank of at least premium_discount_min_contract_rank"
      contract_rank: "for a holder whose active service contract has a tier rank of at least premium_discount_min_contract_rank"
      discount_pct: "then the contract_premium_discount_pct discount on that result for a holder whose active service contract has a tier rank of at least premium_discount_min_contract_rank"
      product_premium: "built up exactly as the premium charge is built up (the base premium at premium_rate_pct_of_insured_value percent, then the cargo_type uplift on that result, then the contract_premium_discount_pct discount on that result for a holder whose active service contract has a tier rank of at least premium_discount_min_contract_rank, then raised to the higher of minimum_premium_per_container_usd times the container_count and minimum_premium_per_cover_usd, and rounded to the cent)"
      on_bound_date: "On the cover's bound_date the premium owed is the premium the cover's product yields"
      premium_owed: "because the premium charge booked that day applies the same build-up to the same records; on any later date the premium owed is the sum of the premium charges booked on the cover. A cover that has never been bound, and so carries no bound_date, owes no premium under this policy, and its premium owed is 0.00."
      remitted: "less the amounts of every premium remittance already applied to the cover"
      refunded: "and of every premium refund already booked on it"
      result: "The balance is the premium owed less the amounts of every premium remittance already applied to the cover and of every premium refund already booked on it, the difference rounded to the cent and never below 0.00."
    inputs:
      history:
        - {table: claims_ledger, aggregate: sum, field: amount_usd, filters: {event_type: claims_premium_paid}}
        - {table: claims_ledger, aggregate: sum, field: amount_usd, filters: {event_type: claims_premium_refunded}}
        - {table: claims_ledger, aggregate: sum, field: amount_usd, filters: {event_type: claims_premium_charged}}
      cross_category: [contract]

workflows:
  - id: claims_wf_further_notice_on_open_cover
    scenario: >-
      A claimant reports a further loss, found in another container of a delivered shipment, whose cargo cover still carries an
      earlier claim that is open with its documents complete; the further loss needs a notice of its own, and that notice fails one
      of the grounds that can be decided as soon as a notice is registered. The procedure applies to any cargo cover in that state. When it is done, the earlier claim is approved at its
      settlement amount with the cover's approved-but-unpaid settlement balance raised by that amount, the further notice is on file
      at the value the notice policy fixes and is rejected with its controlled reason, and the cover is in the closed-claim state with
      no claim open. A further notice that fails no such ground is not handled by this procedure and stays open awaiting its documents.
    steps:
      - {tool: approve_claim_settlement_060ed8c3, owner: agent, writes: claims_ledger, subject: claims_settlement_approved, base_policy_refs: [claims_agg_annual_aggregate, claims_coverage_and_exclusions, claims_settlement_calculation], role: decide the open documented claim by settlement, computed_by: [claims_ext_settlement_invoice_share]}
      - {tool: close_cargo_claim_a3572c28, owner: agent, writes: cargo_covers, subject: claims_claim_closed, base_policy_refs: [claims_settlement_payment], role: close the decided earlier claim, computed_by: []}
      - {tool: lodge_cargo_claim_268664bf, owner: user, writes: cargo_covers, subject: claims_claim_lodged, base_policy_refs: [claims_notice_and_time_bar], role: claimant registers the further notice in person, computed_by: [claims_ext_notice_container_value]}
      - {tool: reject_cargo_claim_5f9631bd, owner: agent, writes: claims_ledger, subject: claims_claim_rejected, base_policy_refs: [claims_coverage_and_exclusions, claims_notice_and_time_bar], role: reject the further notice on its first applicable ground, computed_by: [claims_ext_lodging_rejection_grounds]}
      - {tool: close_cargo_claim_a3572c28, owner: agent, writes: cargo_covers, subject: claims_claim_closed, base_policy_refs: [claims_settlement_payment], role: close the rejected further notice, computed_by: []}
    dataflow:
      - from_step: 0
        to_step: 1
        kind: object_binding
        source_table: claims_ledger
        source_field: cover_id
        consumer_bindings:
          - {action_arg: cover_id, role: direct}
      - from_step: 2
        to_step: 3
        kind: object_binding
        source_table: cargo_covers
        source_field: cover_id
        consumer_bindings:
          - {action_arg: cover_id, role: authorization, policy_id: claims_notice_and_time_bar, eligibility_id: reject_open_claim, gate_field: cargo_covers.cover_id}
      - from_step: 2
        to_step: 3
        kind: state_effect
        source_table: cargo_covers
        source_field: status
        consumer_bindings: []
        establishes_gates:
          - {policy_id: claims_notice_and_time_bar, eligibility_id: reject_open_claim, evidence_field: cargo_covers.status}
      - from_step: 3
        to_step: 4
        kind: object_binding
        source_table: claims_ledger
        source_field: cover_id
        consumer_bindings:
          - {action_arg: cover_id, role: direct}
    order_rationale: >-
      The settlement approval comes before the first closure because claims_settlement_payment closes only a decided claim, and the
      approval entry is the decision; closing first would leave an undecided claim closed, and the approval requires the cover to
      be claim_open under claims_coverage_and_exclusions.open_and_documented, which a closure would already have removed. The first
      closure comes before the claimant's notice because claims_notice_and_time_bar allows only one claim open at a time and the
      lodging transition runs from claim_closed to claim_open; lodging first would put a second claim on a cover whose claim is
      still open. The claimant's notice comes before the rejection because a rejection is booked only while the claim's cover is
      claim_open under claims_notice_and_time_bar.reject_open_claim, and the notice is the claim file the rejection decides;
      rejecting first would decide nothing. The rejection comes before the second closure because a closure follows the decision of
      the open claim; closing before the rejection would leave the registered notice undecided on a closed cover. Every step is a
      synchronous action on the line's own records at the same moment: no survey, document, payment or passage of time is awaited
      between them.
    prerequisite: []
