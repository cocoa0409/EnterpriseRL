events:
  # ---- holding (dg_acceptances) ----
  - type: dg_application_submitted
    target: dg_acceptances
    mutation: create
    meaning: The shipper applies for acceptance of one UN entry on a booking.
    grain: One row per UN entry per booking application.
    fields: {dg_id: new acceptance reference, customer_id: applicant, variant_name: acceptance category, booking_id: booking, un_number: UN number, proper_shipping_name: proper shipping name, imdg_class: class, packing_group: packing group, marine_pollutant: marine pollutant marking, container_count: containers, gross_weight_kg: gross weight, trade_lane: lane of the booking, submitted_date: submission date}
    triggers: []
  - type: dg_review_started
    target: dg_acceptances
    mutation: {transition: {from: submitted, to: under_review}}
    meaning: The signed declaration is received and review begins.
    grain: One row per review start.
    fields: {status: becomes under_review}
    triggers: []
  - type: dg_approved
    target: dg_acceptances
    mutation: {transition: {from: under_review, to: approved}}
    meaning: The line accepts the goods.
    grain: One row per approval.
    fields: {status: becomes approved, approved_date: approval date}
    triggers:
      - event: dg:dg_surcharge_charged
        map: {dg_id: dg_id, customer_id: customer_id, charge_code: dg_admin_fee}
  - type: dg_rejected
    target: dg_acceptances
    mutation: {transition: {from: under_review, to: rejected}}
    meaning: The line refuses the goods.
    grain: One row per rejection.
    fields: {status: becomes rejected, rejected_date: rejection date}
    triggers: []
  - type: dg_re_review_opened
    target: dg_acceptances
    mutation: {transition: {from: approved, to: under_review}}
    meaning: An approval is reopened after an amended declaration or a change of sailing.
    grain: One row per reopening.
    fields: {status: becomes under_review}
    triggers: []
  - type: dg_withdrawn
    target: dg_acceptances
    mutation: {transition: [{from: submitted, to: withdrawn}, {from: under_review, to: withdrawn}, {from: approved, to: withdrawn}]}
    meaning: The shipper withdraws its application or its approved goods.
    grain: One row per withdrawal.
    fields: {status: becomes withdrawn}
    triggers: []
  - type: dg_loaded
    target: dg_acceptances
    mutation: {transition: {from: approved, to: loaded}}
    meaning: The goods are loaded on board.
    grain: One row per loading.
    fields: {status: becomes loaded, marine_pollutant: marine pollutant marking, container_count: containers loaded}
    triggers:
      - event: dg:dg_surcharge_charged
        map: {dg_id: dg_id, customer_id: customer_id, charge_code: dg_surcharge, container_count: container_count}
      - event: dg:dg_surcharge_charged
        when: {marine_pollutant: true}
        map: {dg_id: dg_id, customer_id: customer_id, charge_code: marine_pollutant_surcharge, container_count: container_count}
  - type: dg_discharged
    target: dg_acceptances
    mutation: {transition: {from: loaded, to: discharged}}
    meaning: The goods are discharged.
    grain: One row per discharge.
    fields: {status: becomes discharged}
    triggers: []
  - type: dg_closed
    target: dg_acceptances
    mutation: {transition: {from: discharged, to: closed}}
    meaning: The acceptance file is closed.
    grain: One row per closure.
    fields: {status: becomes closed}
    triggers: []
  - type: dg_declaration_amended
    target: dg_acceptances
    mutation: update
    meaning: A signed amended declaration changes the declared particulars.
    grain: One row per signed amendment.
    fields: {un_number: amended UN number, proper_shipping_name: amended name, packing_group: amended packing group, marine_pollutant: amended marking, container_count: amended containers, gross_weight_kg: amended weight}
    triggers: []
  # ---- ledger (dg_ledger) ----
  - type: dg_surcharge_charged
    target: dg_ledger
    meaning: The admin fee at approval or a surcharge at loading is charged.
    grain: One row per charge code per charging date per acceptance.
    distinguish_by: [charge_code, event_date]
    fields: {dg_id: acceptance, customer_id: applicant, event_date: charge date, charge_code: one of dg_admin_fee / dg_surcharge / marine_pollutant_surcharge, amount_usd: amount, container_count: containers charged}
    account: dg_charges
    direction: in
    triggers: []
  - type: dg_late_declaration_fee_charged
    target: dg_ledger
    meaning: A declaration signed after the lead time and accepted is charged the late fee.
    grain: One row per late declaration submission.
    distinguish_by: [submission_id]
    fields: {dg_id: acceptance, customer_id: applicant, event_date: charge date, charge_code: late_declaration_fee, amount_usd: fee, submission_id: late submission}
    account: dg_charges
    direction: in
    triggers: []
  - type: dg_amendment_fee_charged
    target: dg_ledger
    meaning: A chargeable amendment or a re-review after a change of sailing is charged.
    grain: One row per chargeable amendment or re-review.
    distinguish_by: [charge_code, submission_id, event_date]
    fields: {dg_id: acceptance, customer_id: applicant, event_date: charge date, charge_code: amendment_fee or re_review_fee, amount_usd: fee, submission_id: amendment submission or empty for a re-review}
    account: dg_charges
    direction: in
    triggers: []
  - type: dg_withdrawal_fee_charged
    target: dg_ledger
    meaning: Approved goods withdrawn before loading are charged the withdrawal fee.
    grain: One row per withdrawn approved acceptance.
    distinguish_by: [event_date]
    fields: {dg_id: acceptance, customer_id: applicant, event_date: withdrawal date, charge_code: withdrawal_fee, amount_usd: fee}
    account: dg_charges
    direction: in
    triggers: []
  - type: dg_misdeclaration_penalty_charged
    target: dg_ledger
    meaning: A misdeclaration penalty or the inspection cost recovery is charged after goods are found to differ from the declaration.
    grain: One row per charge code per acceptance.
    distinguish_by: [charge_code]
    fields: {dg_id: acceptance, customer_id: applicant, event_date: charge date, charge_code: misdeclaration_penalty or inspection_cost_recovery, amount_usd: amount, container_count: containers affected}
    account: dg_charges
    direction: in
    triggers: []
  - type: dg_payment_received
    target: dg_ledger
    meaning: A remittance is applied to the acceptance's charges.
    grain: One row per remittance per acceptance.
    distinguish_by: [payment_reference]
    fields: {dg_id: acceptance, customer_id: paying party, event_date: value date, charge_code: payment, amount_usd: amount remitted, payment_reference: remittance reference quoted by the customer}
    account: dg_charges
    direction: out
    triggers: []
  - type: dg_charge_waived
    target: dg_ledger
    meaning: A fee row is waived as goodwill.
    grain: One row per fee row waived.
    distinguish_by: [reference_event_id]
    fields: {dg_id: acceptance, customer_id: applicant, event_date: waiver date, charge_code: waiver, amount_usd: full amount of the referenced row, reference_event_id: fee row waived}
    account: dg_charges
    direction: out
    triggers: []

measures:
  - id: dg_msr_sailing_containers
    window: Current state on the handling date, across the customer's acceptances on bookings allocated to the same vessel_voyage as the booking concerned.
    measure: Sum of container_count of the customer's acceptances of the same category in status submitted, under_review or approved on that sailing, excluding the acceptance being handled.
  - id: dg_msr_live_on_booking
    window: Current state on the handling date, on the booking concerned.
    measure: Count of acceptances on the booking_id in status submitted, under_review, approved or loaded, excluding the acceptance being handled.
  - id: dg_msr_signed_amendments
    window: Life of the acceptance, before the amendment being handled.
    measure: Count of dg_declaration_submissions rows on the dg_id with submission_type amendment and outcome signed.
  - id: dg_msr_recent_misdeclarations
    window: Trailing calendar days ending on the handling date, of the length misdeclaration_block_days of the category applied for.
    measure: Count of dg_misdeclaration_penalty_charged rows with charge_code misdeclaration_penalty for the customer_id with event_date inside the window.
  - id: dg_msr_goodwill_waivers_365d
    window: Trailing 365 calendar days ending on the waiver date, inclusive, across all acceptances of the customer.
    measure: Count of dg_charge_waived rows for the customer_id with event_date inside the window.

policies:
  - id: dg_agg_multi_holding
    subject: [dg_application_submitted]
    rule: >-
      A customer may hold any number of dangerous-goods acceptances; there is no cap per customer. Each acceptance covers one UN entry on
      one booking, and how acceptances combine on one booking and on one sailing is governed by dg_agg_booking_mix and
      dg_agg_sailing_capacity.
    eligibility: []
    params: {max_per_customer: null}

  - id: dg_agg_sailing_capacity
    subject: [dg_application_submitted, dg_declaration_amended]
    rule: >-
      Every sailing carries a limited dangerous-goods allotment per shipper, so acceptances are aggregated per customer per sailing. The
      containers of a new application or an amendment, added to dg_msr_sailing_containers, must not exceed the category's
      max_containers_per_sailing_per_customer. An application or amendment that would exceed the allotment is refused for that sailing; the
      shipper may apply on another booking whose sailing has room. Rejected and withdrawn acceptances never count.
    eligibility:
      - id: sailing_allotment
        applies_to: [dg_application_submitted, dg_declaration_amended]
        kind: authorization
        condition: The containers of a new application or an amendment, added to dg_msr_sailing_containers, must not exceed the category's max_containers_per_sailing_per_customer.
        evidence_fields: [dg_acceptances.customer_id, dg_acceptances.booking_id, dg_acceptances.status, dg_acceptances.container_count, bookings.vessel_voyage]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_acceptances.customer_id, bookings.vessel_voyage]
          action_bindings: {dg_acceptances.customer_id: customer_id, bookings.vessel_voyage: vessel_voyage}
    params:
      per_tier:
        AHL DG Limited Quantity: {max_containers_per_sailing_per_customer: "=max_containers_per_sailing_per_customer"}
        AHL DG Class 9 Standard: {max_containers_per_sailing_per_customer: "=max_containers_per_sailing_per_customer"}
        AHL DG Flammables and Corrosives: {max_containers_per_sailing_per_customer: "=max_containers_per_sailing_per_customer"}
        AHL DG Toxics and Oxidizers: {max_containers_per_sailing_per_customer: "=max_containers_per_sailing_per_customer"}
        AHL DG Compressed Gases: {max_containers_per_sailing_per_customer: "=max_containers_per_sailing_per_customer"}
        AHL DG Special Approval: {max_containers_per_sailing_per_customer: "=max_containers_per_sailing_per_customer"}
    formula:
      allotment_exceeded: dg_msr_sailing_containers + container_count > max_containers_per_sailing_per_customer
    measures: [dg_msr_sailing_containers]

  - id: dg_agg_booking_mix
    subject: [dg_application_submitted]
    rule: >-
      Acceptances on one booking are combined by the strictest category among them. A new application is accepted only when the live
      acceptances already on the booking, counted by dg_msr_live_on_booking, are fewer than the lowest max_dg_acceptances_per_booking among
      the new category and the categories already live on the booking. Categories whose mixed_class_booking_allowed is false exclude one
      another and every other category: a booking that carries a live acceptance of AHL DG Toxics and Oxidizers, AHL DG Compressed Gases or
      AHL DG Special Approval may carry no second acceptance, and such an acceptance may not join a booking that already carries one. The
      customer who needs to ship both must use separate bookings.
    eligibility:
      - id: booking_mix_limit
        applies_to: [dg_application_submitted]
        kind: authorization
        condition: A new application is accepted only when the live acceptances already on the booking, counted by dg_msr_live_on_booking, are fewer than the lowest max_dg_acceptances_per_booking among the new category and the categories already live on the booking.
        evidence_fields: [dg_acceptances.booking_id, dg_acceptances.status, dg_acceptances.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_acceptances.booking_id]
          action_bindings: {dg_acceptances.booking_id: booking_id}
    measures: [dg_msr_live_on_booking]

  - id: dg_application_eligibility
    subject: [dg_application_submitted]
    rule: >-
      An application is admitted to the category that matches the declared goods. The booking carrying the goods must be a live booking
      whose cargo_type is dangerous_goods. The declared imdg_class must be one of the category's eligible_imdg_classes and the packing_group
      one of its eligible_packing_groups; goods that fit a category only as limited quantities belong to AHL DG Limited Quantity, and goods in
      a class outside every list are not carried. The booking's equipment_type must be in allowed_equipment_types, its trade_lane in
      allowed_trade_lanes and its pod_code outside prohibited_pod_codes. The container_count may not exceed max_containers_per_acceptance,
      and the gross weight may not exceed max_gross_weight_kg_per_acceptance nor, divided evenly over the containers,
      max_gross_weight_kg_per_container. When contract_booking_required is true the booking must be rated under a service contract. The
      applicant's profile must be at least the category's min_customer_tenure_days old on the application date. The applicant must have no
      misdeclaration penalty inside the category's misdeclaration_block_days before the application, as counted by
      dg_msr_recent_misdeclarations. A new application for a booking whose previous application was rejected is accepted only from the
      category's resubmission_wait_days_after_rejection calendar days after the previous application was rejected. The earliest date is the
      previous application's rejected_date plus the category's waiting days counted on calendar dates, and an application on that date is
      accepted. The application is registered as submitted with an initial declaration awaiting the shipper's signature.
    eligibility:
      - id: booking_is_dg_and_live
        applies_to: [dg_application_submitted]
        kind: state
        condition: The booking carrying the goods must be a live booking whose cargo_type is dangerous_goods.
        evidence_fields: [bookings.booking_id, bookings.status, bookings.cargo_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        state_contract:
          field: bookings.status
          allowed: [requested, confirmed, equipment_released]
      - id: tenure
        applies_to: [dg_application_submitted]
        kind: authorization
        condition: The applicant's profile must be at least the category's min_customer_tenure_days old on the application date.
        evidence_fields: [customers.customer_id, customers.profile_opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings: {customers.customer_id: customer_id}
      - id: no_recent_misdeclaration
        applies_to: [dg_application_submitted]
        kind: authorization
        condition: The applicant must have no misdeclaration penalty inside the category's misdeclaration_block_days before the application, as counted by dg_msr_recent_misdeclarations.
        evidence_fields: [dg_ledger.customer_id, dg_ledger.event_type, dg_ledger.charge_code, dg_ledger.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_ledger.customer_id]
          action_bindings: {dg_ledger.customer_id: customer_id}
      - id: resubmission_wait
        applies_to: [dg_application_submitted]
        kind: time
        condition: A new application for a booking whose previous application was rejected is accepted only from the category's resubmission_wait_days_after_rejection calendar days after the previous application was rejected.
        evidence_fields: [dg_acceptances.booking_id, dg_acceptances.rejected_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_acceptances.booking_id]
          action_bindings: {dg_acceptances.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the previous application was rejected
          anchor_source: dg_acceptances.rejected_date
          relation: not_before
          duration_source: variants.resubmission_wait_days_after_rejection
          unit: calendar_days
          counting_rule: The earliest date is the previous application's rejected_date plus the category's waiting days counted on calendar dates, and an application on that date is accepted.
          boundary: inclusive
    params:
      per_tier:
        AHL DG Limited Quantity: {eligible_imdg_classes: "=eligible_imdg_classes", eligible_packing_groups: "=eligible_packing_groups", max_containers_per_acceptance: "=max_containers_per_acceptance", min_customer_tenure_days: "=min_customer_tenure_days", misdeclaration_block_days: "=misdeclaration_block_days"}
        AHL DG Class 9 Standard: {eligible_imdg_classes: "=eligible_imdg_classes", eligible_packing_groups: "=eligible_packing_groups", max_containers_per_acceptance: "=max_containers_per_acceptance", min_customer_tenure_days: "=min_customer_tenure_days", misdeclaration_block_days: "=misdeclaration_block_days"}
        AHL DG Flammables and Corrosives: {eligible_imdg_classes: "=eligible_imdg_classes", eligible_packing_groups: "=eligible_packing_groups", max_containers_per_acceptance: "=max_containers_per_acceptance", min_customer_tenure_days: "=min_customer_tenure_days", misdeclaration_block_days: "=misdeclaration_block_days"}
        AHL DG Toxics and Oxidizers: {eligible_imdg_classes: "=eligible_imdg_classes", eligible_packing_groups: "=eligible_packing_groups", max_containers_per_acceptance: "=max_containers_per_acceptance", min_customer_tenure_days: "=min_customer_tenure_days", misdeclaration_block_days: "=misdeclaration_block_days"}
        AHL DG Compressed Gases: {eligible_imdg_classes: "=eligible_imdg_classes", eligible_packing_groups: "=eligible_packing_groups", max_containers_per_acceptance: "=max_containers_per_acceptance", min_customer_tenure_days: "=min_customer_tenure_days", misdeclaration_block_days: "=misdeclaration_block_days"}
        AHL DG Special Approval: {eligible_imdg_classes: "=eligible_imdg_classes", eligible_packing_groups: "=eligible_packing_groups", max_containers_per_acceptance: "=max_containers_per_acceptance", min_customer_tenure_days: "=min_customer_tenure_days", misdeclaration_block_days: "=misdeclaration_block_days"}
    measures: [dg_msr_recent_misdeclarations]

  - id: dg_declaration_and_review
    subject: [dg_review_started, dg_approved, dg_rejected, dg_late_declaration_fee_charged]
    rule: >-
      Review starts only once the shipper has signed the declaration, which only the shipper can do; an unsigned or returned declaration
      never starts review. A declaration is on time when it is signed no later than declaration_lead_days_before_etd calendar days before the
      booking's etd_date. A late declaration is accepted only when it is signed no later than the tier's
      late_acceptance_cutoff_hours_before_cargo_cutoff before the cargo cut-off of the booking's sailing. The acceptance deadline is the cargo
      cut-off time minus the tier's cutoff hours, counted as full 60-minute hours in port-of-loading local time, and a declaration signed
      exactly at the deadline is accepted. A late but accepted declaration is charged late_declaration_fee_usd once, referencing the late
      submission; a declaration later than that deadline is not accepted for the sailing, the application stays submitted, and the shipper
      may withdraw it or move the booking under the booking charter. The line decides within review_sla_hours. It approves when the signed
      declaration fits the category under dg_application_eligibility and the booking mix and sailing allotment still hold, and it rejects
      otherwise; the shipper is told the reason and nothing is charged for a rejection. Approval sets approved_date and charges
      dg_admin_fee_usd. A late declaration fee may be booked only while the acceptance is submitted or under_review. A late submission is
      charged at most once.
    eligibility:
      - id: late_acceptance_deadline
        applies_to: [dg_review_started, dg_late_declaration_fee_charged]
        kind: time
        condition: A late declaration is accepted only when it is signed no later than the tier's late_acceptance_cutoff_hours_before_cargo_cutoff before the cargo cut-off of the booking's sailing.
        evidence_fields: [bookings.booking_id, bookings.cargo_cutoff]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the cargo cut-off of the booking's sailing
          anchor_source: bookings.cargo_cutoff
          relation: not_after
          duration_source: variants.late_acceptance_cutoff_hours_before_cargo_cutoff
          unit: elapsed_hours
          counting_rule: The acceptance deadline is the cargo cut-off time minus the tier's cutoff hours, counted as full 60-minute hours in port-of-loading local time, and a declaration signed exactly at the deadline is accepted.
          boundary: inclusive
      - id: signed_declaration
        applies_to: [dg_review_started]
        kind: authorization
        condition: Review starts only once the shipper has signed the declaration, which only the shipper can do; an unsigned or returned declaration never starts review.
        evidence_fields: [dg_declaration_submissions.dg_id, dg_declaration_submissions.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_declaration_submissions.dg_id]
          action_bindings: {dg_declaration_submissions.dg_id: dg_id}
      - id: late_fee_before_decision
        applies_to: [dg_late_declaration_fee_charged]
        kind: state
        condition: A late declaration fee may be booked only while the acceptance is submitted or under_review.
        evidence_fields: [dg_acceptances.dg_id, dg_acceptances.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_acceptances.dg_id]
          action_bindings: {dg_acceptances.dg_id: dg_id}
        state_contract:
          field: dg_acceptances.status
          allowed: [submitted, under_review]
      - id: late_fee_once
        applies_to: [dg_late_declaration_fee_charged]
        kind: dedup
        condition: A late submission is charged at most once.
        evidence_fields: [dg_ledger.submission_id, dg_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_ledger.submission_id]
          action_bindings: {dg_ledger.submission_id: submission_id}
        dedup_contract:
          table: dg_ledger
          mode: separate_record
          object_bindings: {submission_id: submission_id}
          duplicate_filters: {event_type: [dg_late_declaration_fee_charged]}
          distinct_fields: []
    params:
      per_tier:
        AHL DG Limited Quantity: {declaration_lead_days_before_etd: "=declaration_lead_days_before_etd", late_declaration_fee_usd: "=late_declaration_fee_usd", review_sla_hours: "=review_sla_hours", dg_admin_fee_usd: "=dg_admin_fee_usd"}
        AHL DG Class 9 Standard: {declaration_lead_days_before_etd: "=declaration_lead_days_before_etd", late_declaration_fee_usd: "=late_declaration_fee_usd", review_sla_hours: "=review_sla_hours", dg_admin_fee_usd: "=dg_admin_fee_usd"}
        AHL DG Flammables and Corrosives: {declaration_lead_days_before_etd: "=declaration_lead_days_before_etd", late_declaration_fee_usd: "=late_declaration_fee_usd", review_sla_hours: "=review_sla_hours", dg_admin_fee_usd: "=dg_admin_fee_usd"}
        AHL DG Toxics and Oxidizers: {declaration_lead_days_before_etd: "=declaration_lead_days_before_etd", late_declaration_fee_usd: "=late_declaration_fee_usd", review_sla_hours: "=review_sla_hours", dg_admin_fee_usd: "=dg_admin_fee_usd"}
        AHL DG Compressed Gases: {declaration_lead_days_before_etd: "=declaration_lead_days_before_etd", late_declaration_fee_usd: "=late_declaration_fee_usd", review_sla_hours: "=review_sla_hours", dg_admin_fee_usd: "=dg_admin_fee_usd"}
        AHL DG Special Approval: {declaration_lead_days_before_etd: "=declaration_lead_days_before_etd", late_declaration_fee_usd: "=late_declaration_fee_usd", review_sla_hours: "=review_sla_hours", dg_admin_fee_usd: "=dg_admin_fee_usd"}

  - id: dg_surcharges
    subject: [dg_surcharge_charged, dg_loaded]
    rule: >-
      The admin fee is charged at each approval and the surcharges at loading, when the goods are actually carried. An approval is valid for
      loading only until the tier's approval_valid_days calendar days after the acceptance was approved. The validity ends on the
      approved_date plus the tier's validity days counted on calendar dates, and loading on that last day is covered. Goods not loaded by then
      return to review under dg_amendment. At loading, one dg_surcharge row is written per acceptance. The base surcharge per container is
      surcharge_20ft_usd for 20-foot equipment and surcharge_40ft_usd for 40- and 45-foot equipment; it is increased by the sum of three
      uplifts, added together and never compounded: the uplift of the declared class in class_surcharge_uplift_pct_map, pg_i_surcharge_uplift_pct
      when the packing group is I, and the uplift of the booking's trade lane in lane_surcharge_uplift_pct_map. When the customer holds an
      active service contract whose tier rank is at least contract_discount_min_rank and that rank is not 0, the uplifted surcharge is then
      reduced by contract_surcharge_discount_pct percent. The amount is the per-container result times container_count, rounded to the cent;
      it is 0.00 when the acceptance's gross weight is below surcharge_free_below_gross_kg. When the goods are marked marine pollutant a
      second row of marine_pollutant_surcharge_per_container_usd times container_count is written. Surcharges may be booked only on an
      acceptance that is approved or loaded. Each charge code is booked once per charging date.
    eligibility:
      - id: approval_still_valid
        applies_to: [dg_loaded]
        kind: time
        condition: An approval is valid for loading only until the tier's approval_valid_days calendar days after the acceptance was approved.
        evidence_fields: [dg_acceptances.dg_id, dg_acceptances.approved_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_acceptances.dg_id]
          action_bindings: {dg_acceptances.dg_id: dg_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the acceptance was approved
          anchor_source: dg_acceptances.approved_date
          relation: not_after
          duration_source: variants.approval_valid_days
          unit: calendar_days
          counting_rule: The validity ends on the approved_date plus the tier's validity days counted on calendar dates, and loading on that last day is covered.
          boundary: inclusive
      - id: surcharge_on_approved_or_loaded
        applies_to: [dg_surcharge_charged]
        kind: state
        condition: Surcharges may be booked only on an acceptance that is approved or loaded.
        evidence_fields: [dg_acceptances.dg_id, dg_acceptances.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_acceptances.dg_id]
          action_bindings: {dg_acceptances.dg_id: dg_id}
        state_contract:
          field: dg_acceptances.status
          allowed: [approved, loaded]
      - id: code_once_per_date
        applies_to: [dg_surcharge_charged]
        kind: dedup
        condition: Each charge code is booked once per charging date.
        evidence_fields: [dg_ledger.dg_id, dg_ledger.charge_code, dg_ledger.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_ledger.dg_id, dg_ledger.charge_code]
          action_bindings: {dg_ledger.dg_id: dg_id, dg_ledger.charge_code: charge_code}
        dedup_contract:
          table: dg_ledger
          mode: separate_record
          object_bindings: {dg_id: dg_id, charge_code: charge_code}
          duplicate_filters: {event_type: [dg_surcharge_charged]}
          distinct_fields: [event_date]
    params:
      per_tier:
        AHL DG Limited Quantity: {surcharge_20ft_usd: "=surcharge_20ft_usd", surcharge_40ft_usd: "=surcharge_40ft_usd", pg_i_surcharge_uplift_pct: "=pg_i_surcharge_uplift_pct", contract_discount_min_rank: "=contract_discount_min_rank", contract_surcharge_discount_pct: "=contract_surcharge_discount_pct", marine_pollutant_surcharge_per_container_usd: "=marine_pollutant_surcharge_per_container_usd", surcharge_free_below_gross_kg: "=surcharge_free_below_gross_kg"}
        AHL DG Class 9 Standard: {surcharge_20ft_usd: "=surcharge_20ft_usd", surcharge_40ft_usd: "=surcharge_40ft_usd", pg_i_surcharge_uplift_pct: "=pg_i_surcharge_uplift_pct", contract_discount_min_rank: "=contract_discount_min_rank", contract_surcharge_discount_pct: "=contract_surcharge_discount_pct", marine_pollutant_surcharge_per_container_usd: "=marine_pollutant_surcharge_per_container_usd", surcharge_free_below_gross_kg: "=surcharge_free_below_gross_kg"}
        AHL DG Flammables and Corrosives: {surcharge_20ft_usd: "=surcharge_20ft_usd", surcharge_40ft_usd: "=surcharge_40ft_usd", pg_i_surcharge_uplift_pct: "=pg_i_surcharge_uplift_pct", contract_discount_min_rank: "=contract_discount_min_rank", contract_surcharge_discount_pct: "=contract_surcharge_discount_pct", marine_pollutant_surcharge_per_container_usd: "=marine_pollutant_surcharge_per_container_usd", surcharge_free_below_gross_kg: "=surcharge_free_below_gross_kg"}
        AHL DG Toxics and Oxidizers: {surcharge_20ft_usd: "=surcharge_20ft_usd", surcharge_40ft_usd: "=surcharge_40ft_usd", pg_i_surcharge_uplift_pct: "=pg_i_surcharge_uplift_pct", contract_discount_min_rank: "=contract_discount_min_rank", contract_surcharge_discount_pct: "=contract_surcharge_discount_pct", marine_pollutant_surcharge_per_container_usd: "=marine_pollutant_surcharge_per_container_usd", surcharge_free_below_gross_kg: "=surcharge_free_below_gross_kg"}
        AHL DG Compressed Gases: {surcharge_20ft_usd: "=surcharge_20ft_usd", surcharge_40ft_usd: "=surcharge_40ft_usd", pg_i_surcharge_uplift_pct: "=pg_i_surcharge_uplift_pct", contract_discount_min_rank: "=contract_discount_min_rank", contract_surcharge_discount_pct: "=contract_surcharge_discount_pct", marine_pollutant_surcharge_per_container_usd: "=marine_pollutant_surcharge_per_container_usd", surcharge_free_below_gross_kg: "=surcharge_free_below_gross_kg"}
        AHL DG Special Approval: {surcharge_20ft_usd: "=surcharge_20ft_usd", surcharge_40ft_usd: "=surcharge_40ft_usd", pg_i_surcharge_uplift_pct: "=pg_i_surcharge_uplift_pct", contract_discount_min_rank: "=contract_discount_min_rank", contract_surcharge_discount_pct: "=contract_surcharge_discount_pct", marine_pollutant_surcharge_per_container_usd: "=marine_pollutant_surcharge_per_container_usd", surcharge_free_below_gross_kg: "=surcharge_free_below_gross_kg"}
    formula:
      pg_uplift_pct: pg_i_surcharge_uplift_pct if packing_group == "I" else 0
      marine_pollutant_amount: marine_pollutant_surcharge_per_container_usd * container_count if marine_pollutant == true else 0
      base_exempt: gross_weight_kg < surcharge_free_below_gross_kg

  - id: dg_amendment
    subject: [dg_declaration_amended, dg_amendment_fee_charged, dg_re_review_opened]
    rule: >-
      A declaration is amended only by a new declaration the shipper signs, which only the shipper can do. An amendment may change only the
      particulars listed in the category's amendable_attributes; a change of IMDG class, or of any particular outside that list, needs the
      application to be withdrawn and a new one submitted. After approval an amendment is possible only when amendment_after_approval_allowed
      is true, and it returns the acceptance to review. An amendment is accepted only when it is signed no later than the tier's
      late_amendment_cutoff_hours_before_cargo_cutoff before the cargo cut-off of the booking's sailing. The amendment deadline is the cargo
      cut-off time minus the tier's cutoff hours, counted as full 60-minute hours in port-of-loading local time, and an amendment signed
      exactly at the deadline is accepted. An acceptance takes at most max_amendments_per_acceptance signed amendments, counted by
      dg_msr_signed_amendments. The declared gross weight may change by no more than max_gross_weight_change_pct percent of the weight before
      the amendment, and the container count may rise only when container_count_increase_allowed is true, always within
      dg_agg_sailing_capacity. An amendment is free while dg_msr_signed_amendments is below free_amendments_per_acceptance and otherwise
      costs amendment_fee_usd, referencing the amendment submission. When the booking moves to another sailing and the category's
      re_review_on_vessel_change is true, an approved acceptance returns to review and is charged re_review_fee_usd once for that change of
      sailing, with no submission reference. Amendment and re-review fees may be booked only while the acceptance is submitted, under_review
      or approved.
    eligibility:
      - id: amendment_deadline
        applies_to: [dg_declaration_amended, dg_amendment_fee_charged]
        kind: time
        condition: An amendment is accepted only when it is signed no later than the tier's late_amendment_cutoff_hours_before_cargo_cutoff before the cargo cut-off of the booking's sailing.
        evidence_fields: [bookings.booking_id, bookings.cargo_cutoff]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bookings.booking_id]
          action_bindings: {bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the cargo cut-off of the booking's sailing
          anchor_source: bookings.cargo_cutoff
          relation: not_after
          duration_source: variants.late_amendment_cutoff_hours_before_cargo_cutoff
          unit: elapsed_hours
          counting_rule: The amendment deadline is the cargo cut-off time minus the tier's cutoff hours, counted as full 60-minute hours in port-of-loading local time, and an amendment signed exactly at the deadline is accepted.
          boundary: inclusive
      - id: amendment_count
        applies_to: [dg_declaration_amended, dg_amendment_fee_charged]
        kind: authorization
        condition: An acceptance takes at most max_amendments_per_acceptance signed amendments, counted by dg_msr_signed_amendments.
        evidence_fields: [dg_declaration_submissions.dg_id, dg_declaration_submissions.submission_type, dg_declaration_submissions.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_declaration_submissions.dg_id]
          action_bindings: {dg_declaration_submissions.dg_id: dg_id}
      - id: fee_while_open
        applies_to: [dg_amendment_fee_charged]
        kind: state
        condition: Amendment and re-review fees may be booked only while the acceptance is submitted, under_review or approved.
        evidence_fields: [dg_acceptances.dg_id, dg_acceptances.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_acceptances.dg_id]
          action_bindings: {dg_acceptances.dg_id: dg_id}
        state_contract:
          field: dg_acceptances.status
          allowed: [submitted, under_review, approved]
    params:
      per_tier:
        AHL DG Limited Quantity: {amendable_attributes: "=amendable_attributes", free_amendments_per_acceptance: "=free_amendments_per_acceptance", amendment_fee_usd: "=amendment_fee_usd", max_amendments_per_acceptance: "=max_amendments_per_acceptance", re_review_on_vessel_change: "=re_review_on_vessel_change", re_review_fee_usd: "=re_review_fee_usd"}
        AHL DG Class 9 Standard: {amendable_attributes: "=amendable_attributes", free_amendments_per_acceptance: "=free_amendments_per_acceptance", amendment_fee_usd: "=amendment_fee_usd", max_amendments_per_acceptance: "=max_amendments_per_acceptance", re_review_on_vessel_change: "=re_review_on_vessel_change", re_review_fee_usd: "=re_review_fee_usd"}
        AHL DG Flammables and Corrosives: {amendable_attributes: "=amendable_attributes", free_amendments_per_acceptance: "=free_amendments_per_acceptance", amendment_fee_usd: "=amendment_fee_usd", max_amendments_per_acceptance: "=max_amendments_per_acceptance", re_review_on_vessel_change: "=re_review_on_vessel_change", re_review_fee_usd: "=re_review_fee_usd"}
        AHL DG Toxics and Oxidizers: {amendable_attributes: "=amendable_attributes", free_amendments_per_acceptance: "=free_amendments_per_acceptance", amendment_fee_usd: "=amendment_fee_usd", max_amendments_per_acceptance: "=max_amendments_per_acceptance", re_review_on_vessel_change: "=re_review_on_vessel_change", re_review_fee_usd: "=re_review_fee_usd"}
        AHL DG Compressed Gases: {amendable_attributes: "=amendable_attributes", free_amendments_per_acceptance: "=free_amendments_per_acceptance", amendment_fee_usd: "=amendment_fee_usd", max_amendments_per_acceptance: "=max_amendments_per_acceptance", re_review_on_vessel_change: "=re_review_on_vessel_change", re_review_fee_usd: "=re_review_fee_usd"}
        AHL DG Special Approval: {amendable_attributes: "=amendable_attributes", free_amendments_per_acceptance: "=free_amendments_per_acceptance", amendment_fee_usd: "=amendment_fee_usd", max_amendments_per_acceptance: "=max_amendments_per_acceptance", re_review_on_vessel_change: "=re_review_on_vessel_change", re_review_fee_usd: "=re_review_fee_usd"}
    formula:
      amendment_amount: 0 if dg_msr_signed_amendments < free_amendments_per_acceptance else amendment_fee_usd
    measures: [dg_msr_signed_amendments]

  - id: dg_withdrawal
    subject: [dg_withdrawn, dg_withdrawal_fee_charged]
    rule: >-
      Only the shipper can withdraw its application or its approved goods, before loading. A withdrawal before approval is free. When approved
      goods are withdrawn, withdrawal_fee_after_approval_usd is charged once; the admin fee already charged at approval stays payable and no
      surcharge is charged because nothing was loaded. A withdrawal fee may be booked only on an acceptance whose status is withdrawn. An
      acceptance carries at most one withdrawal fee. Loaded goods cannot be withdrawn.
    eligibility:
      - id: fee_on_withdrawn
        applies_to: [dg_withdrawal_fee_charged]
        kind: state
        condition: A withdrawal fee may be booked only on an acceptance whose status is withdrawn.
        evidence_fields: [dg_acceptances.dg_id, dg_acceptances.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_acceptances.dg_id]
          action_bindings: {dg_acceptances.dg_id: dg_id}
        state_contract:
          field: dg_acceptances.status
          allowed: [withdrawn]
      - id: one_withdrawal_fee
        applies_to: [dg_withdrawal_fee_charged]
        kind: dedup
        condition: An acceptance carries at most one withdrawal fee.
        evidence_fields: [dg_ledger.dg_id, dg_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_ledger.dg_id]
          action_bindings: {dg_ledger.dg_id: dg_id}
        dedup_contract:
          table: dg_ledger
          mode: separate_record
          object_bindings: {dg_id: dg_id}
          duplicate_filters: {event_type: [dg_withdrawal_fee_charged]}
          distinct_fields: []

  - id: dg_misdeclaration
    subject: [dg_misdeclaration_penalty_charged]
    rule: >-
      When the line's inspection finds that the goods in a container differ from the signed declaration in UN number, class or packing group,
      the shipper is charged misdeclaration_penalty_per_container_usd for each affected container, capped at
      misdeclaration_penalty_cap_per_acceptance_usd, plus inspection_cost_recovery_usd once. The finding is a system record of the inspection
      department; a customer's statement that the declaration was correct never removes it. A misdeclaration penalty may be booked only on an
      acceptance that is approved, loaded, discharged or closed. Each charge code is charged at most once per acceptance. Misdeclaration
      penalties and inspection costs are never waived by the desk, and an appeal against the finding is decided by the dangerous-goods
      department, not the desk. A penalty blocks the customer's new applications under dg_application_eligibility.
    eligibility:
      - id: penalty_on_accepted_goods
        applies_to: [dg_misdeclaration_penalty_charged]
        kind: state
        condition: A misdeclaration penalty may be booked only on an acceptance that is approved, loaded, discharged or closed.
        evidence_fields: [dg_acceptances.dg_id, dg_acceptances.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_acceptances.dg_id]
          action_bindings: {dg_acceptances.dg_id: dg_id}
        state_contract:
          field: dg_acceptances.status
          allowed: [approved, loaded, discharged, closed]
      - id: penalty_once
        applies_to: [dg_misdeclaration_penalty_charged]
        kind: dedup
        condition: Each charge code is charged at most once per acceptance.
        evidence_fields: [dg_ledger.dg_id, dg_ledger.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_ledger.dg_id, dg_ledger.charge_code]
          action_bindings: {dg_ledger.dg_id: dg_id, dg_ledger.charge_code: charge_code}
        dedup_contract:
          table: dg_ledger
          mode: separate_record
          object_bindings: {dg_id: dg_id, charge_code: charge_code}
          duplicate_filters: {event_type: [dg_misdeclaration_penalty_charged]}
          distinct_fields: []
    formula:
      penalty_amount: min(misdeclaration_penalty_per_container_usd * container_count, misdeclaration_penalty_cap_per_acceptance_usd)
      inspection_amount: inspection_cost_recovery_usd

  - id: dg_voyage_milestones
    subject: [dg_discharged, dg_closed]
    rule: >-
      Discharge and closure are recorded by the vessel and terminal systems and never by the desk. Once goods are discharged no amendment,
      withdrawal or re-review is possible, and only payments, goodwill waivers of fees already booked and misdeclaration findings may still
      be recorded against the acceptance.
    eligibility: []

  - id: dg_goodwill_waiver
    subject: [dg_charge_waived]
    rule: >-
      The desk may waive one fee row as goodwill at the applicant's request. Only late_declaration_fee, amendment_fee, re_review_fee and
      withdrawal_fee rows may be waived; the admin fee, the surcharges, misdeclaration penalties and inspection cost recovery are never waived.
      A waiver cancels the whole referenced row. The fee row's amount_usd must not exceed the category's goodwill_waiver_authority_usd. The
      customer's dangerous-goods goodwill waivers in the trailing 365 days must be fewer than the category's goodwill_waivers_per_365d. The
      waiver must be requested no later than the category's waiver_request_window_days calendar days after the fee being waived was booked.
      The window ends on the fee's event_date plus the category's window days counted on calendar dates, and a request on the last day is
      inside it. Each fee row is waived at most once.
    eligibility:
      - id: within_authority
        applies_to: [dg_charge_waived]
        kind: authorization
        condition: The fee row's amount_usd must not exceed the category's goodwill_waiver_authority_usd.
        evidence_fields: [dg_ledger.dg_event_id, dg_ledger.amount_usd, dg_ledger.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_ledger.dg_event_id]
          action_bindings: {dg_ledger.dg_event_id: reference_event_id}
      - id: within_quota
        applies_to: [dg_charge_waived]
        kind: authorization
        condition: The customer's dangerous-goods goodwill waivers in the trailing 365 days must be fewer than the category's goodwill_waivers_per_365d.
        evidence_fields: [dg_ledger.customer_id, dg_ledger.event_type, dg_ledger.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_ledger.customer_id]
          action_bindings: {dg_ledger.customer_id: customer_id}
      - id: within_window
        applies_to: [dg_charge_waived]
        kind: time
        condition: The waiver must be requested no later than the category's waiver_request_window_days calendar days after the fee being waived was booked.
        evidence_fields: [dg_ledger.dg_event_id, dg_ledger.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_ledger.dg_event_id]
          action_bindings: {dg_ledger.dg_event_id: reference_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the fee being waived was booked
          anchor_source: dg_ledger.event_date
          relation: not_after
          duration_source: variants.waiver_request_window_days
          unit: calendar_days
          counting_rule: The window ends on the fee's event_date plus the category's window days counted on calendar dates, and a request on the last day is inside it.
          boundary: inclusive
      - id: waive_once
        applies_to: [dg_charge_waived]
        kind: dedup
        condition: Each fee row is waived at most once.
        evidence_fields: [dg_ledger.reference_event_id, dg_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_ledger.reference_event_id]
          action_bindings: {dg_ledger.reference_event_id: reference_event_id}
        dedup_contract:
          table: dg_ledger
          mode: separate_record
          object_bindings: {reference_event_id: reference_event_id}
          duplicate_filters: {event_type: [dg_charge_waived]}
          distinct_fields: []
    measures: [dg_msr_goodwill_waivers_365d]
    formula:
      when_not: amount_usd > goodwill_waiver_authority_usd or dg_msr_goodwill_waivers_365d >= goodwill_waivers_per_365d

  - id: dg_payment
    subject: [dg_payment_received]
    rule: >-
      A remittance is applied to one acceptance, written with the remittance reference exactly as quoted and the amount remitted; it may not
      exceed the acceptance's charges_due_usd, and any excess is returned by finance and not booked. A remittance reference is recorded only
      once per acceptance.
    eligibility:
      - id: reference_once
        applies_to: [dg_payment_received]
        kind: dedup
        condition: A remittance reference is recorded only once per acceptance.
        evidence_fields: [dg_ledger.dg_id, dg_ledger.payment_reference, dg_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dg_ledger.dg_id, dg_ledger.payment_reference]
          action_bindings: {dg_ledger.dg_id: dg_id, dg_ledger.payment_reference: payment_reference}
        dedup_contract:
          table: dg_ledger
          mode: separate_record
          object_bindings: {dg_id: dg_id, payment_reference: payment_reference}
          duplicate_filters: {event_type: [dg_payment_received]}
          distinct_fields: []
    formula:
      applied_amount: min(amount_usd, dg_charges)

# ============================================================================
# extended_policies (dangerous_goods_desk)
# ============================================================================
extended_policies:
  - id: dg_ext_amendment_fee
    base_policy_refs: [dg_amendment]
    overwrite:
      - base_policy: dg_amendment
        superseded_clause: >-
          Amendment and re-review fees may be booked only while the acceptance is submitted, under_review or approved.
        replaced_by: >-
          An amendment fee is booked only while the acceptance is submitted, under_review or approved and only for goods whose booking has not yet been loaded, which the booking record shows by its status being requested, confirmed, equipment_released or gated_in; goods on a booking whose status shows it loaded, departed, closed or cancelled carry no amendment fee. A re-review fee, which this policy does not set, remains bookable only while the acceptance is submitted, under_review or approved.
    trigger: state_due
    subject: [dg_amendment_fee_charged]
    computes: amount_usd
    target_tool: book_dg_amendment_fee_40feddd0
    rule: >-
      The amendment fee is settled once for each chargeable signed amendment declaration, on the acceptance that declaration
      amends: a chargeable amendment is booked as one amendment_fee row that references that amendment submission, and an
      amendment that is free books no row at all. The signed amendments counted for the fee are the acceptance's declaration
      submissions whose submission_type is amendment and whose outcome is signed; declarations awaiting the shipper's signature,
      returned for correction or withdrawn are never counted. Signed amendments are taken in the order in which they were signed:
      the first free_amendments_per_acceptance of them are free and every later one is chargeable, so the number of chargeable
      amendments is the number of signed amendments less the category's free_amendments_per_acceptance, never fewer than none.
      Each chargeable amendment is settled by one amendment_fee row: while the acceptance's account holds fewer amendment_fee rows
      than it has chargeable amendments, one further row is owed at the category's amendment_fee_usd in full, never pro rata, and
      it references the most recently signed amendment that no amendment_fee row references yet, so that a backlog of unsettled
      amendments is settled one row per amendment; when every chargeable amendment already has its row, nothing further is owed
      and the fee is 0.00. An amendment fee is booked only while the acceptance is submitted, under_review or approved and only for
      goods whose booking has not yet been loaded, which the booking record shows by its status being requested, confirmed,
      equipment_released or gated_in; goods on a booking whose status shows it loaded, departed, closed or cancelled carry no
      amendment fee. A re-review fee, which this policy does not set, remains bookable only while the acceptance is submitted,
      under_review or approved. The fee is a whole tariff amount stated to two decimal places and is not rounded further. The
      amendment's own conditions of dg_amendment — the amendment deadline before the cargo cut-off, the maximum number of signed
      amendments, the permitted weight change and container increase and the sailing allotment — continue to govern both the
      signed amendment and its fee as inherited eligibility; this policy adds no condition to them and sets only the amount.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [status]
        note: The status of the booking carrying the goods decides whether the goods are still ahead of loading, and so whether an amendment fee can arise at all.
    inputs:
      history:
        - {table: dg_declaration_submissions, aggregate: count, field: submission_id, filters: {submission_type: amendment, outcome: signed}}
        - {table: dg_ledger, aggregate: count, field: dg_event_id, filters: {event_type: dg_amendment_fee_charged, charge_code: amendment_fee}}
      cross_category: [booking]
    compute:
      - signed_amendments_now: "COUNT('dg_declaration_submissions', submission_type='amendment', outcome='signed')"
      - free_allowance: "P('free_amendments_per_acceptance')"
      - chargeable_amendments: "MX(signed_amendments_now - free_allowance, 0)"
      - amendment_fees_booked: "COUNT('dg_ledger', event_type='dg_amendment_fee_charged', charge_code='amendment_fee')"
      - unsettled_amendment: "chargeable_amendments > amendment_fees_booked"
      - fee_rate: "P('amendment_fee_usd')"
      - tariff_fee: "0 if not unsettled_amendment else fee_rate"
      - acceptance_open: "F('status') == 'submitted' or F('status') == 'under_review' or F('status') == 'approved'"
      - booking_state: "CFIELD('booking', 'status', booking_id=F('booking_id'))"
      - ahead_of_loading: "booking_state == 'requested' or booking_state == 'confirmed' or booking_state == 'equipment_released' or booking_state == 'gated_in'"
      - result: "RND(tariff_fee if acceptance_open and ahead_of_loading else 0, 2)"
    compute_basis:
      signed_amendments_now: "The signed amendments counted for the fee are the acceptance's declaration submissions whose submission_type is amendment and whose outcome is signed; declarations awaiting the shipper's signature, returned for correction or withdrawn are never counted."
      free_allowance: "the first free_amendments_per_acceptance of them are free and every later one is chargeable"
      chargeable_amendments: "so the number of chargeable amendments is the number of signed amendments less the category's free_amendments_per_acceptance, never fewer than none."
      amendment_fees_booked: "Each chargeable amendment is settled by one amendment_fee row"
      unsettled_amendment: "while the acceptance's account holds fewer amendment_fee rows than it has chargeable amendments, one further row is owed"
      fee_rate: "at the category's amendment_fee_usd in full, never pro rata"
      tariff_fee: "when every chargeable amendment already has its row, nothing further is owed and the fee is 0.00."
      acceptance_open: "An amendment fee is booked only while the acceptance is submitted, under_review or approved"
      booking_state: "only for goods whose booking has not yet been loaded, which the booking record shows by its status being requested, confirmed, equipment_released or gated_in"
      ahead_of_loading: "goods on a booking whose status shows it loaded, departed, closed or cancelled carry no amendment fee."
      result: "The fee is a whole tariff amount stated to two decimal places and is not rounded further."

  - id: dg_ext_late_declaration_fee
    base_policy_refs: [dg_declaration_and_review]
    overwrite:
      - base_policy: dg_declaration_and_review
        superseded_clause: >-
          A late but accepted declaration is charged late_declaration_fee_usd once, referencing the late submission;
        replaced_by: >-
          A late declaration is charged once it has been accepted for the sailing, which the acceptance's record shows by its review having started
    trigger: state_due
    subject: [dg_late_declaration_fee_charged]
    computes: amount_usd
    target_tool: book_dg_late_declaration_fee_00f931c0
    rule: >-
      A late declaration fee is settled once on an acceptance whose initial declaration was signed late and accepted, as one
      late_declaration_fee row referencing that signed declaration. The declaration judged is the acceptance's declaration
      submission whose submission_type is initial and whose outcome is signed — the latest such submission when more than one
      exists; an initial declaration awaiting signature, returned for correction or withdrawn is never judged, and an acceptance
      without a signed initial declaration owes no late fee. Amendment declarations are held to the amendment deadline of
      dg_amendment instead and never carry a late declaration fee. The date on which the shipper signed the judged declaration is
      the date its signed submission was registered, the created_at of that submission, which is the only date the declaration
      file records for a signature. Its lead time is the number of calendar days from the date on which the shipper signed it to
      the etd_date of the booking carrying the goods; the declaration is on time when that lead time is at least the category's declaration_lead_days_before_etd and late
      when it is fewer, and an acceptance whose booking shows no scheduled departure owes no late fee. A late declaration is charged
      once it has been accepted for the sailing, which the acceptance's record shows by its review having started: the fee is
      booked while the acceptance is under_review, because a declaration signed after the late-acceptance deadline is not accepted
      and leaves the acceptance submitted, and a late declaration fee may be booked only while the acceptance is submitted or
      under_review, so a decided acceptance can no longer be charged. The fee is the category's late_declaration_fee_usd in full, and
      a late submission is charged at most once: when a late_declaration_fee row already references the judged declaration,
      nothing further is charged. The fee is a whole tariff amount stated to two decimal places and is not rounded further.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [etd_date]
        note: The scheduled departure of the booking carrying the goods is the date the declaration's lead time is measured to, and so decides whether a late fee is owed.
    inputs:
      history:
        - {table: dg_declaration_submissions, aggregate: latest, field: created_at, filters: {submission_type: initial, outcome: signed}}
        - {table: dg_declaration_submissions, aggregate: count, field: submission_id, filters: {submission_type: initial, outcome: signed}}
        - {table: dg_declaration_submissions, aggregate: latest, field: submission_id, filters: {submission_type: initial, outcome: signed}}
        - {table: dg_ledger, aggregate: count, field: dg_event_id, filters: {event_type: dg_late_declaration_fee_charged, submission_id: judged declaration}}
      cross_category: [booking]
    compute:
      - signed_initial_declarations: "COUNT('dg_declaration_submissions', submission_type='initial', outcome='signed')"
      - signed_on: "LATEST('dg_declaration_submissions', 'created_at', date_field='created_at', submission_type='initial', outcome='signed') or ''"
      - current_departure: "CFIELD('booking', 'etd_date', booking_id=F('booking_id'))"
      - required_lead_days: "P('declaration_lead_days_before_etd')"
      - lead_days: "DAYS(signed_on, current_departure) if signed_on and current_departure else required_lead_days"
      - declaration_late: "signed_initial_declarations > 0 and lead_days < required_lead_days"
      - accepted_in_review: "F('status') == 'under_review'"
      - judged_declaration: "LATEST('dg_declaration_submissions', 'submission_id', date_field='created_at', submission_type='initial', outcome='signed') or ''"
      - already_charged: "COUNT('dg_ledger', event_type='dg_late_declaration_fee_charged', submission_id=judged_declaration) > 0"
      - fee_rate: "P('late_declaration_fee_usd')"
      - result: "RND(0 if already_charged else (fee_rate if declaration_late and accepted_in_review else 0), 2)"
    compute_basis:
      signed_initial_declarations: "an acceptance without a signed initial declaration owes no late fee."
      signed_on: "The date on which the shipper signed the judged declaration is the date its signed submission was registered, the created_at of that submission, which is the only date the declaration file records for a signature."
      current_departure: "Its lead time is the number of calendar days from the date on which the shipper signed it to the etd_date of the booking carrying the goods"
      required_lead_days: "the declaration is on time when that lead time is at least the category's declaration_lead_days_before_etd and late when it is fewer"
      lead_days: "and an acceptance whose booking shows no scheduled departure owes no late fee."
      declaration_late: "the declaration is on time when that lead time is at least the category's declaration_lead_days_before_etd and late when it is fewer"
      accepted_in_review: "the fee is booked while the acceptance is under_review, because a declaration signed after the late-acceptance deadline is not accepted and leaves the acceptance submitted"
      judged_declaration: "The declaration judged is the acceptance's declaration submission whose submission_type is initial and whose outcome is signed — the latest such submission when more than one exists"
      already_charged: "a late submission is charged at most once: when a late_declaration_fee row already references the judged declaration, nothing further is charged."
      fee_rate: "The fee is the category's late_declaration_fee_usd in full"
      result: "The fee is a whole tariff amount stated to two decimal places and is not rounded further."

  - id: dg_ext_review_decision
    base_policy_refs: [dg_declaration_and_review, dg_application_eligibility, dg_agg_booking_mix, dg_agg_sailing_capacity, dg_amendment]
    overwrite:
      - base_policy: dg_declaration_and_review
        superseded_clause: >-
          It approves when the signed declaration fits the category under dg_application_eligibility and the booking mix and sailing allotment still hold, and it rejects otherwise
        replaced_by: >-
          A review that can be decided is decided as approved when the goods fit the category and as rejected otherwise.
    trigger: state_due
    subject: [dg_approved, dg_rejected]
    computes: decision
    target_tool: record_dg_review_decision_9aa03de9
    rule: >-
      The decision on an acceptance under review is recorded as approved or rejected, and a review is decided only when three
      things are true. First, the shipper's initial declaration is on file as signed, which the declaration file shows by a
      submission whose submission_type is initial and whose outcome is signed. Second, every amendment fee owed on the acceptance's
      signed amendments is booked before its review is decided: the chargeable amendments are the signed amendments on the
      acceptance beyond the category's free_amendments_per_acceptance, never fewer than none, and the amendment_fee rows on the
      acceptance's account must be at least as many. Third, a late declaration fee owed on the acceptance's signed initial declaration is booked before its review is decided,
      because such a fee can be booked only while the acceptance is still undecided: the fee is owed when the signed initial
      declaration's lead time — the calendar days from its signing date (the created_at of the signed submission) to the etd_date of the booking carrying the goods — is
      fewer than the category's declaration_lead_days_before_etd, and it is settled once a late_declaration_fee row referencing
      that signed initial declaration is on the acceptance's account; a declaration with a sufficient lead time, or an acceptance whose booking shows no scheduled departure,
      owes no such fee. While any of the three is missing the review stays under_review and no decision is recorded. A review
      that can be decided is decided as approved when the goods fit the category and as rejected otherwise. The goods fit the
      category only when all of the following hold on the acceptance as it stands at the decision: its imdg_class is one of the
      category's eligible_imdg_classes and its packing_group one of its eligible_packing_groups; its trade_lane is one of the
      category's allowed_trade_lanes; the booking carrying the goods has an equipment_type in the category's allowed_equipment_types
      and a pod_code outside its prohibited_pod_codes; that booking is recorded with cargo_type dangerous_goods and is live, meaning
      its status is requested, confirmed or equipment_released; the container_count does not exceed max_containers_per_acceptance;
      and the declared gross weight does not exceed max_gross_weight_kg_per_acceptance and, divided evenly over the containers, does
      not exceed max_gross_weight_kg_per_container. These are the only tests of the decision. The booking mix and the sailing
      allotment are admission conditions, counted under dg_agg_booking_mix and dg_agg_sailing_capacity when an application or an
      amendment is admitted, and the decision does not count them again; likewise the applicant conditions of
      dg_application_eligibility — contract rating, customer tenure, the misdeclaration block, the resubmission wait and the
      limited-quantity routing — are tested when the application is admitted and not again at the decision.
    prerequisite:
      - problem: dg_ext_amendment_fee
        kind: value_input
        gate: amendment_fees_settled
        condition: >-
          Every amendment fee owed on the acceptance's signed amendments is booked before its review is decided.
        policy_source: >-
          every amendment fee owed on the acceptance's signed amendments is booked before its review is decided
        resolved_by: book_dg_amendment_fee_40feddd0
        effect: >-
          Booking the owed amendment fee raises the count of amendment_fee rows to the number of chargeable amendments, so
          amendment_fees_settled turns true and the decision moves from under_review to approved or rejected.
      - problem: dg_ext_late_declaration_fee
        kind: value_input
        gate: late_fee_settled
        condition: >-
          A late declaration fee owed on the acceptance's signed initial declaration is on its account before its review is decided.
        policy_source: >-
          a late declaration fee owed on the acceptance's signed initial declaration is booked before its review is decided
        resolved_by: book_dg_late_declaration_fee_00f931c0
        effect: >-
          Booking the owed late declaration fee puts a late_declaration_fee row on the account, so late_fee_settled turns true and
          the decision moves from under_review to approved or rejected.
    cross_category:
      - category: booking
        as: branch
        reads: [equipment_type, pod_code, cargo_type, status, etd_date]
        note: The booking's equipment, port of discharge, cargo type and status decide whether the goods still fit, and its scheduled departure decides whether a late declaration fee must be on the account first.
    inputs:
      history:
        - {table: dg_declaration_submissions, aggregate: count, field: submission_id, filters: {submission_type: initial, outcome: signed}}
        - {table: dg_declaration_submissions, aggregate: count, field: submission_id, filters: {submission_type: amendment, outcome: signed}}
        - {table: dg_ledger, aggregate: count, field: dg_event_id, filters: {event_type: dg_amendment_fee_charged, charge_code: amendment_fee}}
        - {table: dg_declaration_submissions, aggregate: latest, field: created_at, filters: {submission_type: initial, outcome: signed}}
        - {table: dg_ledger, aggregate: count, field: dg_event_id, filters: {event_type: dg_late_declaration_fee_charged}}
      cross_category: [booking]
    compute:
      - signed_declaration_on_file: "COUNT('dg_declaration_submissions', submission_type='initial', outcome='signed') > 0"
      - chargeable_amendments: "MX(COUNT('dg_declaration_submissions', submission_type='amendment', outcome='signed') - P('free_amendments_per_acceptance'), 0)"
      - amendment_fees_booked: "COUNT('dg_ledger', event_type='dg_amendment_fee_charged', charge_code='amendment_fee')"
      - amendment_fees_settled: "amendment_fees_booked >= chargeable_amendments"
      - initial_signed_on: "LATEST('dg_declaration_submissions', 'created_at', date_field='created_at', submission_type='initial', outcome='signed') or ''"
      - current_departure: "CFIELD('booking', 'etd_date', booking_id=F('booking_id'))"
      - lead_days: "DAYS(initial_signed_on, current_departure) if initial_signed_on and current_departure else P('declaration_lead_days_before_etd')"
      - late_fee_owed: "lead_days < P('declaration_lead_days_before_etd')"
      - late_fee_settled: "not late_fee_owed or COUNT('dg_ledger', event_type='dg_late_declaration_fee_charged', submission_id=(LATEST('dg_declaration_submissions', 'submission_id', date_field='created_at', submission_type='initial', outcome='signed') or '')) > 0"
      - class_fits: "F('imdg_class') in P('eligible_imdg_classes') and F('packing_group') in P('eligible_packing_groups')"
      - lane_fits: "F('trade_lane') in P('allowed_trade_lanes')"
      - equipment_fits: "CFIELD('booking', 'equipment_type', booking_id=F('booking_id')) in P('allowed_equipment_types')"
      - port_fits: "CFIELD('booking', 'pod_code', booking_id=F('booking_id')) not in P('prohibited_pod_codes')"
      - booking_live_dg: "CFIELD('booking', 'cargo_type', booking_id=F('booking_id')) == 'dangerous_goods' and (CFIELD('booking', 'status', booking_id=F('booking_id')) == 'requested' or CFIELD('booking', 'status', booking_id=F('booking_id')) == 'confirmed' or CFIELD('booking', 'status', booking_id=F('booking_id')) == 'equipment_released')"
      - quantity_fits: "F('container_count') <= P('max_containers_per_acceptance') and F('gross_weight_kg') <= P('max_gross_weight_kg_per_acceptance') and F('gross_weight_kg') / F('container_count') <= P('max_gross_weight_kg_per_container')"
      - goods_fit: "class_fits and lane_fits and equipment_fits and port_fits and booking_live_dg and quantity_fits"
      - result: "'under_review' if not (signed_declaration_on_file and amendment_fees_settled and late_fee_settled) else ('approved' if goods_fit else 'rejected')"
    compute_basis:
      signed_declaration_on_file: "First, the shipper's initial declaration is on file as signed, which the declaration file shows by a submission whose submission_type is initial and whose outcome is signed."
      chargeable_amendments: "the chargeable amendments are the signed amendments on the acceptance beyond the category's free_amendments_per_acceptance, never fewer than none"
      amendment_fees_booked: "and the amendment_fee rows on the acceptance's account must be at least as many."
      amendment_fees_settled: "every amendment fee owed on the acceptance's signed amendments is booked before its review is decided"
      initial_signed_on: "the calendar days from its signing date (the created_at of the signed submission) to the etd_date of the booking carrying the goods"
      current_departure: "the calendar days from its signing date (the created_at of the signed submission) to the etd_date of the booking carrying the goods"
      lead_days: "a declaration with a sufficient lead time, or an acceptance whose booking shows no scheduled departure, owes no such fee."
      late_fee_owed: "is fewer than the category's declaration_lead_days_before_etd"
      late_fee_settled: "it is settled once a late_declaration_fee row referencing that signed initial declaration is on the acceptance's account"
      class_fits: "its imdg_class is one of the category's eligible_imdg_classes and its packing_group one of its eligible_packing_groups"
      lane_fits: "its trade_lane is one of the category's allowed_trade_lanes"
      equipment_fits: "the booking carrying the goods has an equipment_type in the category's allowed_equipment_types"
      port_fits: "and a pod_code outside its prohibited_pod_codes"
      booking_live_dg: "that booking is recorded with cargo_type dangerous_goods and is live, meaning its status is requested, confirmed or equipment_released"
      quantity_fits: "the container_count does not exceed max_containers_per_acceptance; and the declared gross weight does not exceed max_gross_weight_kg_per_acceptance and, divided evenly over the containers, does not exceed max_gross_weight_kg_per_container."
      goods_fit: "The goods fit the category only when all of the following hold on the acceptance as it stands at the decision"
      result: "While any of the three is missing the review stays under_review and no decision is recorded. A review that can be decided is decided as approved when the goods fit the category and as rejected otherwise."

  - id: dg_ext_approval_admin_fee
    base_policy_refs: [dg_declaration_and_review, dg_surcharges]
    overwrite: []
    trigger: state_due
    subject: [dg_approved]
    computes: admin_fee_usd
    target_tool: record_dg_review_decision_9aa03de9
    rule: >-
      This policy sets the administration fee of an approval; it governs no other decision. Every approval of an acceptance under
      review books its administration fee in the same act, as one dg_admin_fee row dated on the approval date, and the fee booked
      with an approval is the category's dg_admin_fee_usd in full. It is booked only for goods on a booking recorded with cargo_type
      dangerous_goods whose status is requested, confirmed or equipment_released, the only bookings on which an approval can be
      granted; for goods on any other booking the fee is 0.00. One approval date carries at most one administration fee, as each
      charge code is booked once per charging date: when a dg_admin_fee row is already dated on the handling date the fee is 0.00,
      and an approval recorded with a fee of 0.00 writes no administration-fee row. An administration fee charged at an earlier
      approval stays on the account and does not reduce the fee of a later approval. The fee is a whole tariff amount stated to two
      decimal places and is not rounded further.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [cargo_type, status]
        note: The booking's cargo type and status decide whether an approval with its administration fee can be granted on it.
    inputs:
      history:
        - {table: dg_ledger, aggregate: count, field: dg_event_id, filters: {event_type: dg_surcharge_charged, charge_code: dg_admin_fee}}
      cross_category: [booking]
    compute:
      - fee_rate: "P('dg_admin_fee_usd')"
      - in_review: "F('status') == 'under_review'"
      - booking_is_dg: "CFIELD('booking', 'cargo_type', booking_id=F('booking_id')) == 'dangerous_goods'"
      - booking_live: "(CFIELD('booking', 'status', booking_id=F('booking_id')) == 'requested' or CFIELD('booking', 'status', booking_id=F('booking_id')) == 'confirmed' or CFIELD('booking', 'status', booking_id=F('booking_id')) == 'equipment_released')"
      - fees_dated_today: "COUNT('dg_ledger', event_type='dg_surcharge_charged', charge_code='dg_admin_fee', event_date=NOW)"
      - already_charged_today: "fees_dated_today > 0"
      - result: "RND(0 if already_charged_today else (fee_rate if in_review and booking_is_dg and booking_live else 0), 2)"
    compute_basis:
      fee_rate: "the fee booked with an approval is the category's dg_admin_fee_usd in full."
      in_review: "Every approval of an acceptance under review books its administration fee in the same act"
      booking_is_dg: "It is booked only for goods on a booking recorded with cargo_type dangerous_goods"
      booking_live: "whose status is requested, confirmed or equipment_released, the only bookings on which an approval can be granted; for goods on any other booking the fee is 0.00."
      fees_dated_today: "when a dg_admin_fee row is already dated on the handling date the fee is 0.00"
      already_charged_today: "One approval date carries at most one administration fee, as each charge code is booked once per charging date"
      result: "The fee is a whole tariff amount stated to two decimal places and is not rounded further."

  - id: dg_ext_loading_surcharge
    base_policy_refs: [dg_surcharges]
    overwrite: []
    trigger: state_due
    subject: [dg_surcharge_charged]
    computes: amount_usd
    target_tool: book_dg_loading_surcharge_44d311b2
    rule: >-
      When the goods of an acceptance are loaded, one dg_surcharge row is written on the acceptance. It is owed only while the
      acceptance is approved or loaded and only once the booking carrying the goods is recorded as loaded, departed or closed; for
      goods whose booking shows any other status nothing is written yet, and when a dg_surcharge row already exists on the
      acceptance no second one is written. The base surcharge per container is the category's surcharge_20ft_usd when the
      booking's equipment_type is a 20-foot type (20DV, 20RF, 20OT, 20FR or 20TK) and its surcharge_40ft_usd for every 40- or
      45-foot type. Three uplift percentages are added together into one total uplift, never compounded: the uplift of the declared
      class, which is 10 for class 4.1, 15 for class 8, 30 for division 5.2, 20 for division 6.1 and division 2.1, 60 for division
      2.3, 25 for divisions 4.2 and 4.3, 80 for class 7 and 0 for every other class, and 0 for every class under AHL DG Limited
      Quantity; the category's pg_i_surcharge_uplift_pct when the packing group is I and 0 otherwise; and the uplift of the
      acceptance's trade lane, which is 20 for transpacific_eastbound and asia_us_east_coast, 15 for transatlantic_westbound, 10 for
      asia_middle_east_india and europe_south_america_east_coast and 0 for every other lane. The base surcharge per container is
      first raised once by that total uplift, giving the uplifted surcharge per container. The customer's contract tier rank is
      read from the tier of the service contract the customer holds in status active — 1 for AHL Starter Service Contract, 2 for
      AHL Standard Service Contract, 3 for AHL Regional Account Contract, 4 for AHL Key Account Contract, 5 for AHL Global Account
      Contract and 6 for AHL Strategic Partner Contract — and is 0 when the customer holds no active service contract; expired,
      suspended, terminated and unsigned contracts never count. When the category's contract_discount_min_rank is not 0 and the
      customer's rank is at least that minimum, the uplifted surcharge per container is then reduced by the category's
      contract_surcharge_discount_pct percent, acting on the uplifted figure and not on the base surcharge; otherwise it is not
      reduced. The amount is the resulting per-container figure times the acceptance's container_count, rounded half up to the cent
      only on that final product, with no rounding of any intermediate figure. The product is carried exactly in cents and a half
      cent is rounded up to the next whole cent: the per-container figures are kept in hundredths and ten-thousandths of a dollar
      so that no intermediate figure is rounded. The amount is 0.00 when the acceptance's
      gross_weight_kg is below the category's surcharge_free_below_gross_kg.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [equipment_type, status]
        note: The booking's equipment decides between the 20-foot and the 40/45-foot base surcharge, and its status shows whether the goods have been loaded.
      - category: contract
        as: branch
        reads: [variant_name, status]
        note: The tier of the customer's active service contract gives the rank that decides whether the contract discount reduces the uplifted surcharge.
    inputs:
      history:
        - {table: dg_ledger, aggregate: count, field: dg_event_id, filters: {event_type: dg_surcharge_charged, charge_code: dg_surcharge}}
      cross_category: [booking, contract]
    compute:
      - equipment: "CFIELD('booking', 'equipment_type', booking_id=F('booking_id'))"
      - base_per_container: "P('surcharge_20ft_usd') if equipment == '20DV' or equipment == '20RF' or equipment == '20OT' or equipment == '20FR' or equipment == '20TK' else P('surcharge_40ft_usd')"
      - class_uplift_pct: "0 if F('variant_name') == 'AHL DG Limited Quantity' else (10 if F('imdg_class') == '4.1' else (15 if F('imdg_class') == '8' else (30 if F('imdg_class') == '5.2' else (20 if F('imdg_class') == '6.1' or F('imdg_class') == '2.1' else (60 if F('imdg_class') == '2.3' else (25 if F('imdg_class') == '4.2' or F('imdg_class') == '4.3' else (80 if F('imdg_class') == '7' else 0)))))))"
      - pg_uplift_pct: "P('pg_i_surcharge_uplift_pct') if F('packing_group') == 'I' else 0"
      - lane_uplift_pct: "20 if F('trade_lane') == 'transpacific_eastbound' or F('trade_lane') == 'asia_us_east_coast' else (15 if F('trade_lane') == 'transatlantic_westbound' else (10 if F('trade_lane') == 'asia_middle_east_india' or F('trade_lane') == 'europe_south_america_east_coast' else 0))"
      - uplifted_per_container_x100: "base_per_container * (100 + class_uplift_pct + pg_uplift_pct + lane_uplift_pct)"
      - contract_tier: "CFIELD('contract', 'variant_name', status='active')"
      - contract_rank: "6 if contract_tier == 'AHL Strategic Partner Contract' else (5 if contract_tier == 'AHL Global Account Contract' else (4 if contract_tier == 'AHL Key Account Contract' else (3 if contract_tier == 'AHL Regional Account Contract' else (2 if contract_tier == 'AHL Standard Service Contract' else (1 if contract_tier == 'AHL Starter Service Contract' else 0)))))"
      - discount_pct: "P('contract_surcharge_discount_pct') if P('contract_discount_min_rank') != 0 and contract_rank >= P('contract_discount_min_rank') else 0"
      - per_container_x10000: "uplifted_per_container_x100 * (100 - discount_pct)"
      - weight_exempt: "F('gross_weight_kg') < P('surcharge_free_below_gross_kg')"
      - goods_loaded: "(F('status') == 'approved' or F('status') == 'loaded') and (CFIELD('booking', 'status', booking_id=F('booking_id')) == 'loaded' or CFIELD('booking', 'status', booking_id=F('booking_id')) == 'departed' or CFIELD('booking', 'status', booking_id=F('booking_id')) == 'closed')"
      - surcharge_rows_booked: "COUNT('dg_ledger', event_type='dg_surcharge_charged', charge_code='dg_surcharge')"
      - amount_in_cents: "per_container_x10000 * F('container_count') / 100"
      - result: "0 if weight_exempt or surcharge_rows_booked > 0 or not goods_loaded else int(amount_in_cents + 0.5) / 100"
    compute_basis:
      equipment: "The base surcharge per container is the category's surcharge_20ft_usd when the booking's equipment_type is a 20-foot type (20DV, 20RF, 20OT, 20FR or 20TK) and its surcharge_40ft_usd for every 40- or 45-foot type."
      base_per_container: "The base surcharge per container is the category's surcharge_20ft_usd when the booking's equipment_type is a 20-foot type (20DV, 20RF, 20OT, 20FR or 20TK) and its surcharge_40ft_usd for every 40- or 45-foot type."
      class_uplift_pct: "the uplift of the declared class, which is 10 for class 4.1, 15 for class 8, 30 for division 5.2, 20 for division 6.1 and division 2.1, 60 for division 2.3, 25 for divisions 4.2 and 4.3, 80 for class 7 and 0 for every other class, and 0 for every class under AHL DG Limited Quantity"
      pg_uplift_pct: "the category's pg_i_surcharge_uplift_pct when the packing group is I and 0 otherwise"
      lane_uplift_pct: "the uplift of the acceptance's trade lane, which is 20 for transpacific_eastbound and asia_us_east_coast, 15 for transatlantic_westbound, 10 for asia_middle_east_india and europe_south_america_east_coast and 0 for every other lane."
      uplifted_per_container_x100: "The base surcharge per container is first raised once by that total uplift, giving the uplifted surcharge per container."
      contract_tier: "The customer's contract tier rank is read from the tier of the service contract the customer holds in status active"
      contract_rank: "1 for AHL Starter Service Contract, 2 for AHL Standard Service Contract, 3 for AHL Regional Account Contract, 4 for AHL Key Account Contract, 5 for AHL Global Account Contract and 6 for AHL Strategic Partner Contract — and is 0 when the customer holds no active service contract; expired, suspended, terminated and unsigned contracts never count."
      discount_pct: "When the category's contract_discount_min_rank is not 0 and the customer's rank is at least that minimum, the uplifted surcharge per container is then reduced by the category's contract_surcharge_discount_pct percent, acting on the uplifted figure and not on the base surcharge; otherwise it is not reduced."
      per_container_x10000: "the uplifted surcharge per container is then reduced by the category's contract_surcharge_discount_pct percent, acting on the uplifted figure and not on the base surcharge; otherwise it is not reduced."
      weight_exempt: "The amount is 0.00 when the acceptance's gross_weight_kg is below the category's surcharge_free_below_gross_kg."
      goods_loaded: "It is owed only while the acceptance is approved or loaded and only once the booking carrying the goods is recorded as loaded, departed or closed; for goods whose booking shows any other status nothing is written yet"
      surcharge_rows_booked: "when a dg_surcharge row already exists on the acceptance no second one is written."
      amount_in_cents: "The amount is the resulting per-container figure times the acceptance's container_count, rounded half up to the cent only on that final product, with no rounding of any intermediate figure."
      result: "The product is carried exactly in cents and a half cent is rounded up to the next whole cent."

  - id: dg_ext_marine_pollutant_surcharge
    base_policy_refs: [dg_surcharges]
    overwrite: []
    trigger: state_due
    subject: [dg_surcharge_charged]
    computes: amount_usd
    target_tool: book_dg_marine_pollutant_surcharge_a7ecff71
    rule: >-
      When goods whose acceptance is marked marine_pollutant true are loaded, a marine_pollutant_surcharge row is written in addition
      to the dg_surcharge row, and it is computed separately from it: the category's marine_pollutant_surcharge_per_container_usd
      times the acceptance's container_count, with no class, packing group or lane uplift, no contract discount and no weight
      exemption applied to it, and stated to two decimal places. It is owed only while the acceptance is approved or loaded and
      only once the booking carrying the goods is recorded as loaded, departed or closed; goods not marked marine pollutant, goods
      whose booking shows any other status, and an acceptance that already carries a marine_pollutant_surcharge row owe no further
      marine pollutant surcharge.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [status]
        note: The booking's status shows whether the marine-pollutant goods have been loaded, which is when the charge falls due.
    inputs:
      history:
        - {table: dg_ledger, aggregate: count, field: dg_event_id, filters: {event_type: dg_surcharge_charged, charge_code: marine_pollutant_surcharge}}
      cross_category: [booking]
    compute:
      - marked_marine_pollutant: "F('marine_pollutant') == True"
      - rate_per_container: "P('marine_pollutant_surcharge_per_container_usd')"
      - goods_loaded: "(F('status') == 'approved' or F('status') == 'loaded') and (CFIELD('booking', 'status', booking_id=F('booking_id')) == 'loaded' or CFIELD('booking', 'status', booking_id=F('booking_id')) == 'departed' or CFIELD('booking', 'status', booking_id=F('booking_id')) == 'closed')"
      - rows_already_booked: "COUNT('dg_ledger', event_type='dg_surcharge_charged', charge_code='marine_pollutant_surcharge')"
      - result: "RND(rate_per_container * F('container_count') if marked_marine_pollutant and goods_loaded and rows_already_booked == 0 else 0, 2)"
    compute_basis:
      marked_marine_pollutant: "When goods whose acceptance is marked marine_pollutant true are loaded, a marine_pollutant_surcharge row is written in addition to the dg_surcharge row"
      rate_per_container: "the category's marine_pollutant_surcharge_per_container_usd times the acceptance's container_count, with no class, packing group or lane uplift, no contract discount and no weight exemption applied to it, and stated to two decimal places."
      goods_loaded: "It is owed only while the acceptance is approved or loaded and only once the booking carrying the goods is recorded as loaded, departed or closed"
      rows_already_booked: "an acceptance that already carries a marine_pollutant_surcharge row owe no further marine pollutant surcharge."
      result: "goods not marked marine pollutant, goods whose booking shows any other status, and an acceptance that already carries a marine_pollutant_surcharge row owe no further marine pollutant surcharge."

  - id: dg_ext_remittance_application
    base_policy_refs: [dg_payment, dg_surcharges, dg_goodwill_waiver]
    overwrite:
      - base_policy: dg_payment
        superseded_clause: >-
          A remittance is applied to one acceptance,
        replaced_by: >-
          A remittance is applied to an acceptance only when the acceptance's holder is also the booking party of the booking the goods travel under; for an acceptance held by a party other than that booking party the desk books no remittance and the amount applied is 0.00.
    trigger: on_request
    subject: [dg_payment_received]
    computes: amount_usd
    target_tool: record_dg_payment_ee299820
    rule: >-
      This policy sets the amount applied from a remittance that covers the acceptance's charges due in full; a remittance smaller
      than the charges due is not governed here and is booked under dg_payment, which writes it with the amount remitted. A remittance the customer
      quotes is applied to one acceptance and written as one payment row with the remittance reference exactly as quoted. The
      charges due on the acceptance are recomputed from its account rather than read from the balance shown on the acceptance: they
      are the sum of every dg_surcharge_charged, dg_late_declaration_fee_charged, dg_amendment_fee_charged, dg_withdrawal_fee_charged
      and dg_misdeclaration_penalty_charged row, less the sum of every dg_payment_received and dg_charge_waived row, all taken over
      the acceptance's whole life; the difference, a whole number of cents, is stated to two decimal places. Every dangerous-goods
      surcharge that fell due when the goods were loaded is booked before a remittance is applied. The marine pollutant surcharge of
      goods loaded as marine pollutant is likewise on the account before any remittance is applied to them. A remittance that
      covers the charges due is applied at exactly the charges due, and finance returns the excess, which is never booked. When the
      charges due are 0.00 or less nothing is applied. A remittance is applied to an acceptance only when the acceptance's holder is
      also the booking party of the booking the goods travel under; for an acceptance held by a party other than that booking party
      the desk books no remittance and the amount applied is 0.00.
    prerequisite:
      - problem: dg_ext_loading_surcharge
        kind: value_input
        gate: surcharges_booked
        condition: >-
          Every dangerous-goods surcharge that fell due when the goods were loaded is booked before a remittance is applied.
        policy_source: >-
          Every dangerous-goods surcharge that fell due when the goods were loaded is booked before a remittance is applied.
        resolved_by: book_dg_loading_surcharge_44d311b2
        effect: >-
          Booking the loading surcharge adds its amount to surcharges_booked, raising the charges due and so the amount applied from
          the remittance.
      - problem: dg_ext_marine_pollutant_surcharge
        kind: value_input
        gate: surcharges_booked
        condition: >-
          The marine pollutant surcharge of goods loaded as marine pollutant is on the account before any remittance is applied to them.
        policy_source: >-
          The marine pollutant surcharge of goods loaded as marine pollutant is likewise on the account before any remittance is applied to them.
        resolved_by: book_dg_marine_pollutant_surcharge_a7ecff71
        effect: >-
          Booking the marine pollutant surcharge adds its amount to surcharges_booked, raising the charges due and so the amount
          applied from the remittance.
    cross_category:
      - category: booking
        as: branch
        reads: [customer_id]
        note: The booking party of the booking the goods travel under must be the acceptance's holder before a remittance is applied.
    inputs:
      history:
        - {table: dg_ledger, aggregate: sum, field: amount_usd, filters: {event_type: dg_surcharge_charged}}
        - {table: dg_ledger, aggregate: sum, field: amount_usd, filters: {event_type: dg_late_declaration_fee_charged}}
        - {table: dg_ledger, aggregate: sum, field: amount_usd, filters: {event_type: dg_amendment_fee_charged}}
        - {table: dg_ledger, aggregate: sum, field: amount_usd, filters: {event_type: dg_withdrawal_fee_charged}}
        - {table: dg_ledger, aggregate: sum, field: amount_usd, filters: {event_type: dg_misdeclaration_penalty_charged}}
        - {table: dg_ledger, aggregate: sum, field: amount_usd, filters: {event_type: dg_payment_received}}
        - {table: dg_ledger, aggregate: sum, field: amount_usd, filters: {event_type: dg_charge_waived}}
      cross_category: [booking]
    compute:
      - surcharges_booked: "SUM('dg_ledger', 'amount_usd', event_type='dg_surcharge_charged')"
      - fees_booked: "SUM('dg_ledger', 'amount_usd', event_type='dg_late_declaration_fee_charged') + SUM('dg_ledger', 'amount_usd', event_type='dg_amendment_fee_charged') + SUM('dg_ledger', 'amount_usd', event_type='dg_withdrawal_fee_charged')"
      - penalties_booked: "SUM('dg_ledger', 'amount_usd', event_type='dg_misdeclaration_penalty_charged')"
      - payments_applied: "SUM('dg_ledger', 'amount_usd', event_type='dg_payment_received')"
      - waivers_granted: "SUM('dg_ledger', 'amount_usd', event_type='dg_charge_waived')"
      - charges_due: "RND(surcharges_booked + fees_booked + penalties_booked - payments_applied - waivers_granted, 2)"
      - holder_is_booking_party: "CFIELD('booking', 'customer_id', booking_id=F('booking_id')) == CUST"
      - result: "RND(0 if charges_due <= 0 else (charges_due if holder_is_booking_party else 0), 2)"
    compute_basis:
      surcharges_booked: "they are the sum of every dg_surcharge_charged, dg_late_declaration_fee_charged, dg_amendment_fee_charged, dg_withdrawal_fee_charged and dg_misdeclaration_penalty_charged row"
      fees_booked: "they are the sum of every dg_surcharge_charged, dg_late_declaration_fee_charged, dg_amendment_fee_charged, dg_withdrawal_fee_charged and dg_misdeclaration_penalty_charged row"
      penalties_booked: "they are the sum of every dg_surcharge_charged, dg_late_declaration_fee_charged, dg_amendment_fee_charged, dg_withdrawal_fee_charged and dg_misdeclaration_penalty_charged row"
      payments_applied: "less the sum of every dg_payment_received and dg_charge_waived row, all taken over the acceptance's whole life"
      waivers_granted: "less the sum of every dg_payment_received and dg_charge_waived row, all taken over the acceptance's whole life"
      charges_due: "the difference, a whole number of cents, is stated to two decimal places."
      holder_is_booking_party: "A remittance is applied to an acceptance only when the acceptance's holder is also the booking party of the booking the goods travel under; for an acceptance held by a party other than that booking party the desk books no remittance and the amount applied is 0.00."
      result: "A remittance that covers the charges due is applied at exactly the charges due, and finance returns the excess, which is never booked. When the charges due are 0.00 or less nothing is applied."

# ============================================================================
# workflows (exactly one)
# ============================================================================
workflows:
  - id: dg_wf_amended_declaration_redecision
    scenario: >-
      Applies to a dangerous-goods acceptance under review, not yet decided and still ahead of its cargo cut-off, when the shipper
      needs to change the declared gross weight by a signed amendment before the line decides. Once the procedure is complete every
      fee the file owes before a decision is on the account, the amended weight is on the acceptance, and the line's decision with
      the administration fee of an approval is recorded for the booking's sailing.
    steps:
      - {tool: book_dg_late_declaration_fee_00f931c0, owner: agent, writes: dg_ledger, subject: dg_late_declaration_fee_charged, base_policy_refs: [dg_declaration_and_review], role: the late fee of the accepted late initial declaration, computed_by: [dg_ext_late_declaration_fee]}
      - {tool: sign_amended_dg_declaration_eb5287cf, owner: user, writes: dg_acceptances, subject: dg_declaration_amended, base_policy_refs: [dg_agg_sailing_capacity, dg_amendment], role: the shipper signs the amended declaration in person, computed_by: []}
      - {tool: book_dg_amendment_fee_40feddd0, owner: agent, writes: dg_ledger, subject: dg_amendment_fee_charged, base_policy_refs: [dg_amendment], role: the amendment fee of the signed amendment, computed_by: [dg_ext_amendment_fee]}
      - {tool: record_dg_review_decision_9aa03de9, owner: agent, writes: dg_acceptances, subject: dg_approved, base_policy_refs: [dg_declaration_and_review], role: the decision with the administration fee of an approval, computed_by: [dg_ext_review_decision, dg_ext_approval_admin_fee]}
    dataflow: []
    requires_external_wait: false
    zero_wait_proof: >-
      Every step consumes only facts already on the records when the consultation opens (the acceptance under review, its signed
      initial declaration, its booking and sailing, its account), the shipper's own figure given in the call, or the synchronous
      effect of an earlier step of the same consultation. The real hand-offs are three: the late-fee row of the first step and the
      amendment-fee row of the third step are read by the decision's own policy through the account, and the amendment signed in
      the second step is found and attached by the amendment-fee action of the third step, which ties its charge to the
      acceptance's most recently signed amendment declaration that no amendment-fee charge references yet. The dataflow list
      offers two kinds of link and neither fits them. An object_binding link passes a field that the producing step changes in the
      table its event targets into an argument of the later step, but the fee rows are read by the decision's policy rather than
      passed as an argument, and the signed amendment is written by the signing step outside the table its event targets and is
      attached by the fee action without being passed as an argument. A
      state_effect link passes no argument but must name the base eligibility gates of the consuming step that the changed field
      establishes, and the decision's event dg_approved carries no base eligibility gate, while the signing step changes only the
      declared gross weight, which no base gate of the amendment fee reads. The list is therefore empty. No step waits for an
      inspection, a delivery, a payment clearing, an external approval, a batch run or the passage of time.
    order_rationale: >-
      The late declaration fee comes first because it is a debt of the file as it stands when the consultation opens: the signed
      initial declaration was accepted late and the fee can be booked only while the acceptance is undecided, so booking it before
      the shipper changes the declaration settles what the existing file owes; booking it after the amendment would give the same
      row, so this position is a convention of the procedure rather than a condition that fails if swapped with the signing.
      Signing the amendment comes before the amendment fee because the fee is booked on the signed amendment declaration and
      references it; without the signature there is no amendment to charge. The amendment fee comes before the decision, and so does
      the late declaration fee, because dg_ext_review_decision decides a review only after every amendment fee owed on the signed
      amendments and the late declaration fee owed on the initial declaration are on the account, and a late declaration fee can
      no longer be booked once the acceptance is decided. The decision comes last because it closes the review. Every step is a
      synchronous desk or shipper action on the records in one consultation, and no step waits for an event outside the records or
      for time to pass.
    prerequisite: []
