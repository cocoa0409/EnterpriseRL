category: dg
display_name: Dangerous Goods Acceptance

# Functional closure (real capabilities of a dangerous-goods acceptance desk, each carried below):
#   application and admission by class, packing group, equipment, lane, port and shipper history (dg_application_submitted; dg_application_eligibility, dg_agg_sailing_capacity, dg_agg_booking_mix)
#   signed declaration, lead time, late acceptance, review, approval or rejection (dg_review_started, dg_approved, dg_rejected, dg_late_declaration_fee_charged; dg_declaration_and_review)
#   surcharges and admin fee at approval and loading, approval validity (dg_surcharge_charged, dg_loaded; dg_surcharges)
#   amendments of the declaration and re-review after a vessel change (dg_declaration_amended, dg_amendment_fee_charged, dg_re_review_opened; dg_amendment)
#   withdrawal by the shipper (dg_withdrawn, dg_withdrawal_fee_charged; dg_withdrawal)
#   misdeclaration penalties and inspection cost recovery (dg_misdeclaration_penalty_charged; dg_misdeclaration)
#   voyage milestones (dg_discharged, dg_closed; dg_voyage_milestones)
#   payments and goodwill waivers (dg_payment_received, dg_charge_waived; dg_payment, dg_goodwill_waiver)

binding:
  holding_table: dg_acceptances
  event_tables: [dg_ledger]
  intake_tables: [dg_declaration_submissions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {charges_due_usd: dg_charges}

lifecycle:
  states: [submitted, under_review, approved, loaded, discharged, closed, rejected, withdrawn]
  transitions:
    - {from: submitted, to: under_review, by: agent, means: The shipper's signed declaration is received and the application goes to review.}
    - {from: under_review, to: approved, by: agent, means: The line accepts the goods for the booking's sailing.}
    - {from: under_review, to: rejected, by: agent, means: The line refuses the goods.}
    - {from: approved, to: under_review, by: agent, means: An approved acceptance is reopened after an amended declaration or a change of sailing.}
    - {from: submitted, to: withdrawn, by: user, means: The shipper withdraws its application before review.}
    - {from: under_review, to: withdrawn, by: user, means: The shipper withdraws its application during review.}
    - {from: approved, to: withdrawn, by: user, means: The shipper withdraws approved goods before loading.}
    - {from: approved, to: loaded, by: system, means: The dangerous goods are loaded on board.}
    - {from: loaded, to: discharged, by: system, means: The dangerous goods are discharged at the port of discharge.}
    - {from: discharged, to: closed, by: system, means: The acceptance file is closed.}

accounts:
  - key: dg_charges
    unit: USD
    meaning: Dangerous-goods charges owed on one acceptance — admin fee, surcharges, late, amendment, re-review and withdrawal fees and penalties in, payments and waivers out.

parameter_schema:
  eligible_imdg_classes: IMDG classes or divisions the category accepts (list of dg_acceptances.imdg_class values).
  eligible_packing_groups: Packing groups the category accepts (list of dg_acceptances.packing_group values).
  limited_quantity_required: Whether the goods must be packed as IMDG limited quantities (boolean).
  surcharge_20ft_usd: Base dangerous-goods surcharge for a 20-foot container (USD per container).
  surcharge_40ft_usd: Base dangerous-goods surcharge for a 40- or 45-foot container (USD per container).
  class_surcharge_uplift_pct_map: Surcharge uplift by declared class (mapping of imdg_class to integer percent).
  pg_i_surcharge_uplift_pct: Surcharge uplift for packing group I (integer percent).
  lane_surcharge_uplift_pct_map: Surcharge uplift by trade lane (mapping of trade_lane to integer percent).
  marine_pollutant_surcharge_per_container_usd: Flat surcharge for goods marked marine pollutant (USD per container).
  surcharge_free_below_gross_kg: Gross weight of the acceptance below which the base surcharge is 0.00; 0 means never free (kilograms).
  contract_discount_min_rank: Lowest service contract tier rank whose holder gets the contract surcharge discount; 0 means no discount (integer rank).
  contract_surcharge_discount_pct: Discount on the base surcharge for qualifying contract holders (integer percent).
  dg_admin_fee_usd: Administration fee charged at each approval (USD per approval).
  allowed_equipment_types: Equipment types the goods may be packed in (list of bookings.equipment_type values).
  mixed_class_booking_allowed: Whether the booking may carry another dangerous-goods acceptance of a different category (boolean).
  contract_booking_required: Whether the booking must be rated under a service contract (boolean).
  allowed_trade_lanes: Trade lanes on which the category is carried (list of trade_lane values).
  prohibited_pod_codes: Ports of discharge where the category is not accepted (list of UN/LOCODE).
  max_containers_per_acceptance: Maximum containers under one acceptance (integer containers).
  max_gross_weight_kg_per_container: Maximum dangerous-goods gross weight per container (kilograms).
  max_gross_weight_kg_per_acceptance: Maximum dangerous-goods gross weight under one acceptance (kilograms).
  max_containers_per_sailing_per_customer: Maximum containers of the category one customer may have accepted or pending on one sailing (integer containers).
  max_dg_acceptances_per_booking: Maximum live acceptances on one booking while one of this category is among them (integer).
  declaration_lead_days_before_etd: Latest a signed declaration is on time, in calendar days before ETD (integer days).
  late_declaration_fee_usd: Fee for a declaration signed after the lead time but accepted (USD per acceptance).
  late_acceptance_cutoff_hours_before_cargo_cutoff: Latest a late declaration is still accepted, in hours before the cargo cut-off (integer hours).
  review_sla_hours: Service standard for deciding a review (integer hours).
  approval_valid_days: Calendar days after approval during which the approval covers loading (integer days).
  re_review_on_vessel_change: Whether an approval returns to review when the booking moves to another sailing (boolean).
  re_review_fee_usd: Fee for a re-review caused by a change of sailing (USD per re-review).
  amendment_after_approval_allowed: Whether the declaration may be amended after approval (boolean).
  amendable_attributes: Declaration particulars an amendment may change (list of dg_acceptances field names).
  free_amendments_per_acceptance: Amendments per acceptance without an amendment fee (integer).
  amendment_fee_usd: Fee per amendment beyond the free allowance (USD per amendment).
  max_amendments_per_acceptance: Maximum signed amendments per acceptance (integer).
  max_gross_weight_change_pct: Largest change of declared gross weight by amendment, as percent of the weight before the amendment (integer percent).
  container_count_increase_allowed: Whether an amendment may raise the container count (boolean).
  late_amendment_cutoff_hours_before_cargo_cutoff: Latest an amendment is accepted, in hours before the cargo cut-off (integer hours).
  withdrawal_fee_after_approval_usd: Fee when approved goods are withdrawn before loading (USD per acceptance).
  misdeclaration_penalty_per_container_usd: Penalty per container found carrying goods other than declared (USD per container).
  misdeclaration_penalty_cap_per_acceptance_usd: Maximum misdeclaration penalty per acceptance (USD per acceptance).
  inspection_cost_recovery_usd: Inspection and handling cost recovered when a misdeclaration is found (USD per acceptance).
  misdeclaration_block_days: Calendar days after a misdeclaration penalty during which the customer's new applications for the category are refused (integer days).
  resubmission_wait_days_after_rejection: Calendar days after a rejection before a new application for the same booking is accepted (integer days).
  min_customer_tenure_days: Minimum age of the customer profile for the category (integer calendar days).
  goodwill_waiver_authority_usd: Largest single fee row the desk may waive as goodwill (USD per fee row).
  goodwill_waivers_per_365d: Goodwill dangerous-goods waivers per customer per trailing 365 days (integer).
  waiver_request_window_days: Calendar days after a fee was booked within which a goodwill waiver may be requested (integer days).

