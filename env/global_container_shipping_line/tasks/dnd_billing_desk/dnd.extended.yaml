events:
  # ---- holding (dnd_free_time) ----
  - type: dnd_free_time_opened
    target: dnd_free_time
    mutation: create
    meaning: A free-time record is opened for one container on one leg of a booking.
    grain: One row per container per booking per direction.
    fields: {dnd_id: new record reference, customer_id: billed party, variant_name: product applied at opening, booking_id: booking, container_number: container, direction: import or export, equipment_type: equipment type, port_code: port where the clock runs, discharge_date: import discharge date, empty_pickup_date: export empty pickup date, opened_date: opening date}
    triggers: []
  - type: dnd_free_time_expired
    target: dnd_free_time
    mutation: {transition: {from: free_time_running, to: charges_accruing}}
    meaning: Free time ran out on a clock that is still running.
    grain: One row per record whose free time ran out.
    fields: {status: becomes charges_accruing}
    triggers: []
  - type: dnd_clock_stopped
    target: dnd_free_time
    mutation: {transition: [{from: free_time_running, to: clock_stopped}, {from: charges_accruing, to: clock_stopped}]}
    meaning: The last clock of the record stopped, by empty return on import or by loading on export.
    grain: One row per record.
    fields: {status: becomes clock_stopped, empty_return_date: import empty return date, loaded_date: export loading date, clock_stopped_date: date charges stopped accruing}
    triggers: []
  - type: dnd_movement_recorded
    target: dnd_free_time
    mutation: update
    meaning: A container movement date that starts or stops a clock is recorded by the terminal or depot.
    grain: One row per movement recorded.
    fields: {discharge_date: discharge date, full_gate_out_date: full gate-out date, empty_pickup_date: empty pickup date, full_gate_in_date: full gate-in date}
    triggers: []
  - type: dnd_invoice_issued
    target: dnd_free_time
    mutation: {transition: {from: clock_stopped, to: invoiced}}
    meaning: The final demurrage and detention invoice of the record is issued.
    grain: One row per record invoiced.
    fields: {status: becomes invoiced}
    triggers: []
  - type: dnd_settled
    target: dnd_free_time
    mutation: {transition: [{from: clock_stopped, to: settled}, {from: invoiced, to: settled}]}
    meaning: The record is closed with nothing owed.
    grain: One row per record settled.
    fields: {status: becomes settled, settled_date: settlement date}
    triggers: []
  - type: dnd_cancelled
    target: dnd_free_time
    mutation: {transition: {from: free_time_running, to: cancelled}}
    meaning: The record is cancelled because its booking was cancelled before the container moved.
    grain: One row per record cancelled.
    fields: {status: becomes cancelled, settled_date: cancellation date, booking_id: booking cancelled}
    triggers: []
  - type: dnd_free_time_extended
    target: dnd_free_time
    mutation: update
    meaning: The customer buys a higher free-time product for a running record.
    grain: One row per upgrade.
    fields: {variant_name: product bought}
    triggers:
      - event: dnd:dnd_extension_fee_charged
        map: {dnd_id: dnd_id, customer_id: customer_id, charge_type: free_time_extension, target_variant: variant_name}
  # ---- ledger (dnd_ledger) ----
  - type: dnd_demurrage_invoiced
    target: dnd_ledger
    meaning: Demurrage days beyond free time are invoiced.
    grain: One row per demurrage charge type per invoiced period per record.
    distinguish_by: [charge_type, period_end_date]
    fields: {dnd_id: record, customer_id: billed party, event_date: invoice date, charge_type: import_demurrage or export_demurrage, amount_usd: invoice amount, chargeable_days: demurrage days billed, period_start_date: first demurrage day billed, period_end_date: last demurrage day billed}
    account: dnd_charges
    direction: in
    triggers: []
  - type: dnd_detention_invoiced
    target: dnd_ledger
    meaning: Detention days beyond free time are invoiced.
    grain: One row per detention charge type per invoiced period per record.
    distinguish_by: [charge_type, period_end_date]
    fields: {dnd_id: record, customer_id: billed party, event_date: invoice date, charge_type: import_detention or export_detention, amount_usd: invoice amount, chargeable_days: detention days billed, period_start_date: first detention day billed, period_end_date: last detention day billed}
    account: dnd_charges
    direction: in
    triggers: []
  - type: dnd_extension_fee_charged
    target: dnd_ledger
    meaning: The price of a free-time upgrade is charged.
    grain: One row per product bought on the record.
    distinguish_by: [target_variant]
    fields: {dnd_id: record, customer_id: billed party, event_date: purchase date, charge_type: free_time_extension, amount_usd: price difference paid, target_variant: product bought}
    account: dnd_charges
    direction: in
    triggers: []
  - type: dnd_payment_received
    target: dnd_ledger
    meaning: A remittance is applied to the record's balance.
    grain: One row per remittance per record.
    distinguish_by: [payment_reference]
    fields: {dnd_id: record, customer_id: paying party, event_date: value date, charge_type: payment, amount_usd: amount remitted, payment_reference: remittance reference quoted by the customer}
    account: dnd_charges
    direction: out
    triggers: []
  - type: dnd_charge_waived
    target: dnd_ledger
    meaning: All or part of an invoice is waived, for a late invoice, as goodwill, or on an operations decision.
    grain: One row per invoice per waiver reason.
    distinguish_by: [reference_event_id, waiver_reason]
    fields: {dnd_id: record, customer_id: billed party, event_date: waiver date, charge_type: waiver, amount_usd: amount waived, waiver_reason: controlled reason, reference_event_id: invoice row waived}
    account: dnd_charges
    direction: out
    triggers: []
  - type: dnd_dispute_credited
    target: dnd_ledger
    meaning: A dispute found in the customer's favour is credited against the disputed invoice.
    grain: One row per dispute resolved with a credit.
    distinguish_by: [dispute_id]
    fields: {dnd_id: record, customer_id: billed party, event_date: decision date, charge_type: dispute_credit, amount_usd: amount credited, reference_event_id: invoice row disputed, dispute_id: dispute resolved}
    account: dnd_charges
    direction: out
    triggers: []

measures:
  - id: dnd_msr_overdue_balance
    window: Current state of every record of the customer on the handling date.
    measure: Sum of balance_due_usd over the customer's records in status invoiced whose invoice is past due, an invoice being past due when the handling date is later than its event_date plus its payment term and no submitted dispute stands against it.
  - id: dnd_msr_upgrades_on_record
    window: Life of the record.
    measure: Count of dnd_extension_fee_charged rows on the dnd_id.
  - id: dnd_msr_invoice_credits
    window: Life of the invoice row, before the row being handled.
    measure: Sum of amount_usd of dnd_charge_waived and dnd_dispute_credited rows whose reference_event_id is the invoice row.
  - id: dnd_msr_goodwill_waivers_365d
    window: Trailing 365 calendar days ending on the waiver date, inclusive, across all records of the customer.
    measure: Count of dnd_charge_waived rows for the customer_id with waiver_reason commercial_goodwill and event_date inside the window.

policies:
  - id: dnd_agg_multi_holding
    subject: [dnd_free_time_opened]
    rule: >-
      A customer holds one free-time record for every container on every leg it is billed for, with no cap on the number of records. Each
      container of a booking has at most one record per direction. A second record for the same container, booking and direction is never
      opened; a container that moves again under another booking gets a record under that booking.
    eligibility:
      - id: one_record_per_container_leg
        applies_to: [dnd_free_time_opened]
        kind: dedup
        condition: Each container of a booking has at most one record per direction.
        evidence_fields: [dnd_free_time.booking_id, dnd_free_time.container_number, dnd_free_time.direction]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_free_time.booking_id, dnd_free_time.container_number, dnd_free_time.direction]
          action_bindings: {dnd_free_time.booking_id: booking_id, dnd_free_time.container_number: container_number, dnd_free_time.direction: direction}
        dedup_contract:
          table: dnd_free_time
          mode: separate_record
          object_bindings: {booking_id: booking_id, container_number: container_number, direction: direction}
          duplicate_filters: {status: [free_time_running, charges_accruing, clock_stopped, invoiced, settled]}
          distinct_fields: []
    params: {max_per_customer: null}

  - id: dnd_agg_overdue_portfolio_block
    subject: [dnd_free_time_extended, dnd_extension_fee_charged]
    rule: >-
      Free-time purchases are judged against the customer's whole demurrage and detention portfolio. dnd_msr_overdue_balance adds up the
      balance of every record of the customer whose invoice is past its payment term, where the term is invoice_payment_terms_days of that
      record's product counted from the invoice date, or the customer's credit_days when the customer is credit_approved and credit_days is
      longer; an invoice under a submitted dispute is not past due. An upgrade may be bought only when the customer's overdue demurrage and
      detention balance does not exceed the overdue_balance_block_usd of the product being bought. Balances of other product categories,
      such as booking or documentation charges, never count toward this measure.
    eligibility:
      - id: overdue_below_block
        applies_to: [dnd_free_time_extended, dnd_extension_fee_charged]
        kind: authorization
        condition: An upgrade may be bought only when the customer's overdue demurrage and detention balance does not exceed the overdue_balance_block_usd of the product being bought.
        evidence_fields: [dnd_free_time.customer_id, dnd_free_time.status, dnd_free_time.balance_due_usd, dnd_ledger.event_date, customers.credit_days]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_free_time.customer_id]
          action_bindings: {dnd_free_time.customer_id: customer_id}
    params:
      per_tier:
        AHL Tariff Free Time: {overdue_balance_block_usd: "=overdue_balance_block_usd"}
        AHL Free Time Extension 3: {overdue_balance_block_usd: "=overdue_balance_block_usd"}
        AHL Free Time Extension 7: {overdue_balance_block_usd: "=overdue_balance_block_usd"}
        AHL Combined Free Time 14: {overdue_balance_block_usd: "=overdue_balance_block_usd"}
        AHL Combined Free Time 21: {overdue_balance_block_usd: "=overdue_balance_block_usd"}
        AHL Contract Free Time 30: {overdue_balance_block_usd: "=overdue_balance_block_usd"}
    formula:
      purchase_blocked: dnd_msr_overdue_balance > overdue_balance_block_usd
    measures: [dnd_msr_overdue_balance]

  - id: dnd_record_opening
    subject: [dnd_free_time_opened]
    rule: >-
      A record opens on the product that applies to the container at that moment. It is opened on AHL Contract Free Time 30 when the booking
      is rated under a service contract of the same customer whose tier rank is at least that product's min_contract_tier_rank and which is
      active, and otherwise on AHL Tariff Free Time. The service contract referenced by the booking must be active for a record to open on
      AHL Contract Free Time 30. The equipment's rate class, taken from equipment_class_map, must be one of the product's
      allowed_equipment_classes; a contract booking whose equipment class is outside that list opens on AHL Tariff Free Time instead. The
      export record opens when empties are released for the booking and the import record opens when the container is discharged. The other
      products are never applied at opening; they are bought later under dnd_free_time_upgrade.
    eligibility:
      - id: contract_active_for_contract_free_time
        applies_to: [dnd_free_time_opened]
        kind: state
        condition: The service contract referenced by the booking must be active for a record to open on AHL Contract Free Time 30.
        evidence_fields: [service_contracts.contract_id, service_contracts.status, bookings.contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.contract_id]
          action_bindings: {service_contracts.contract_id: contract_id}
        state_contract:
          field: service_contracts.status
          allowed: [active]

  - id: dnd_clock_rules
    subject: [dnd_free_time_expired, dnd_clock_stopped, dnd_movement_recorded]
    rule: >-
      Each clock starts clock_start_offset_days after the calendar day of its start event and runs to the calendar day of its stop event,
      both counted, so with an offset of 1 the days used by a clock are the stop date minus the start date in calendar days; any part of a
      day counts as a whole day, and weekends and public holidays are counted. Under clock_model separate, an import record runs a demurrage
      clock from discharge_date to full_gate_out_date against import_demurrage_free_days and a detention clock from full_gate_out_date to
      empty_return_date against import_detention_free_days; an export record runs a detention clock from empty_pickup_date to
      full_gate_in_date against export_detention_free_days and a demurrage clock from full_gate_in_date to loaded_date against
      export_demurrage_free_days. Under clock_model combined, an import record runs one clock from discharge_date to empty_return_date against
      combined_import_free_days and an export record one clock from empty_pickup_date to loaded_date against combined_export_free_days. The
      product in force on the record when the last clock stops governs every clock of the record, including days used before an upgrade.
      Free time is judged on the dates the terminal and depot systems record; the customer's own account of a movement date never replaces
      a recorded date. The record moves to charges_accruing when any clock passes its free days while running, and to clock_stopped on the
      empty return of an import record or the loading of an export record, with clock_stopped_date set to that date.
    eligibility: []
    formula:
      import_demurrage_used: full_gate_out_date - discharge_date - clock_start_offset_days + 1
      import_detention_used: empty_return_date - full_gate_out_date - clock_start_offset_days + 1
      export_detention_used: full_gate_in_date - empty_pickup_date - clock_start_offset_days + 1
      export_demurrage_used: loaded_date - full_gate_in_date - clock_start_offset_days + 1
      combined_import_used: empty_return_date - discharge_date - clock_start_offset_days + 1
      combined_export_used: loaded_date - empty_pickup_date - clock_start_offset_days + 1

  - id: dnd_invoicing
    subject: [dnd_invoice_issued, dnd_demurrage_invoiced, dnd_detention_invoiced, dnd_settled]
    rule: >-
      The final invoice of a record is computed once its last clock has stopped. Chargeable days of a clock are its days used beyond its free
      days. Under clock_model separate the demurrage clock's chargeable days are billed at demurrage rates and the detention clock's at
      detention rates, the slabs restarting on each clock. Under clock_model combined the chargeable days follow the end of the merged free
      time, and each chargeable day is billed at demurrage rates while the container is inside the terminal and at detention rates while it
      is outside: on import, days up to and including full_gate_out_date are demurrage days and later days are detention days; on export,
      days up to and including full_gate_in_date are detention days and later days are demurrage days; the slab position of a day is counted
      across the whole sequence of chargeable days. The n-th chargeable day falls in slab 1 while n is at most slab1_length_days, in slab 2
      while n is at most slab1_length_days plus slab2_length_days, in slab 3 while n is at most the sum of the three slab lengths, and in
      slab 4 afterwards. Each day is billed at the rate of its clock type, slab and the rate class of the container given by
      equipment_class_map; when the booking's cargo_type is dangerous_goods, demurrage days only are increased by dg_container_uplift_pct
      percent. One demurrage row and one detention row are written, each with its chargeable days, the first and last billed day and the sum
      of its day rates rounded to the cent, and a row with no chargeable day is not written. When the two rows together are below
      minimum_invoice_usd, nothing is invoiced and the record is settled. The invoice must be issued no later than the product's
      invoice_issue_deadline_days calendar days after the charges stopped accruing. The deadline is the clock_stopped_date plus the product's
      deadline days counted on calendar dates, and an invoice dated on the deadline itself is in time. A record whose deadline has passed
      without an invoice is settled without one, because the charges are no longer collectible. Invoice rows may be booked only on a record
      whose status is clock_stopped or invoiced. The invoice is due invoice_payment_terms_days calendar days after its date, or after the
      customer's credit_days when the customer is credit_approved and credit_days is longer. A record whose invoice has been fully paid,
      waived or credited is settled.
    eligibility:
      - id: invoice_deadline
        applies_to: [dnd_invoice_issued, dnd_demurrage_invoiced, dnd_detention_invoiced]
        kind: time
        condition: The invoice must be issued no later than the product's invoice_issue_deadline_days calendar days after the charges stopped accruing.
        evidence_fields: [dnd_free_time.dnd_id, dnd_free_time.clock_stopped_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_free_time.dnd_id]
          action_bindings: {dnd_free_time.dnd_id: dnd_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the charges stopped accruing
          anchor_source: dnd_free_time.clock_stopped_date
          relation: not_after
          duration_source: variants.invoice_issue_deadline_days
          unit: calendar_days
          counting_rule: The deadline is the clock_stopped_date plus the product's deadline days counted on calendar dates, and an invoice dated on the deadline itself is in time.
          boundary: inclusive
      - id: invoice_on_stopped_record
        applies_to: [dnd_demurrage_invoiced, dnd_detention_invoiced]
        kind: state
        condition: Invoice rows may be booked only on a record whose status is clock_stopped or invoiced.
        evidence_fields: [dnd_free_time.dnd_id, dnd_free_time.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_free_time.dnd_id]
          action_bindings: {dnd_free_time.dnd_id: dnd_id}
        state_contract:
          field: dnd_free_time.status
          allowed: [clock_stopped, invoiced]
    params:
      per_tier:
        AHL Tariff Free Time: {clock_model: "=clock_model", import_demurrage_free_days: "=import_demurrage_free_days", import_detention_free_days: "=import_detention_free_days", export_detention_free_days: "=export_detention_free_days", export_demurrage_free_days: "=export_demurrage_free_days", combined_import_free_days: "=combined_import_free_days", combined_export_free_days: "=combined_export_free_days", minimum_invoice_usd: "=minimum_invoice_usd", invoice_payment_terms_days: "=invoice_payment_terms_days", dg_container_uplift_pct: "=dg_container_uplift_pct"}
        AHL Free Time Extension 3: {clock_model: "=clock_model", import_demurrage_free_days: "=import_demurrage_free_days", import_detention_free_days: "=import_detention_free_days", export_detention_free_days: "=export_detention_free_days", export_demurrage_free_days: "=export_demurrage_free_days", combined_import_free_days: "=combined_import_free_days", combined_export_free_days: "=combined_export_free_days", minimum_invoice_usd: "=minimum_invoice_usd", invoice_payment_terms_days: "=invoice_payment_terms_days", dg_container_uplift_pct: "=dg_container_uplift_pct"}
        AHL Free Time Extension 7: {clock_model: "=clock_model", import_demurrage_free_days: "=import_demurrage_free_days", import_detention_free_days: "=import_detention_free_days", export_detention_free_days: "=export_detention_free_days", export_demurrage_free_days: "=export_demurrage_free_days", combined_import_free_days: "=combined_import_free_days", combined_export_free_days: "=combined_export_free_days", minimum_invoice_usd: "=minimum_invoice_usd", invoice_payment_terms_days: "=invoice_payment_terms_days", dg_container_uplift_pct: "=dg_container_uplift_pct"}
        AHL Combined Free Time 14: {clock_model: "=clock_model", import_demurrage_free_days: "=import_demurrage_free_days", import_detention_free_days: "=import_detention_free_days", export_detention_free_days: "=export_detention_free_days", export_demurrage_free_days: "=export_demurrage_free_days", combined_import_free_days: "=combined_import_free_days", combined_export_free_days: "=combined_export_free_days", minimum_invoice_usd: "=minimum_invoice_usd", invoice_payment_terms_days: "=invoice_payment_terms_days", dg_container_uplift_pct: "=dg_container_uplift_pct"}
        AHL Combined Free Time 21: {clock_model: "=clock_model", import_demurrage_free_days: "=import_demurrage_free_days", import_detention_free_days: "=import_detention_free_days", export_detention_free_days: "=export_detention_free_days", export_demurrage_free_days: "=export_demurrage_free_days", combined_import_free_days: "=combined_import_free_days", combined_export_free_days: "=combined_export_free_days", minimum_invoice_usd: "=minimum_invoice_usd", invoice_payment_terms_days: "=invoice_payment_terms_days", dg_container_uplift_pct: "=dg_container_uplift_pct"}
        AHL Contract Free Time 30: {clock_model: "=clock_model", import_demurrage_free_days: "=import_demurrage_free_days", import_detention_free_days: "=import_detention_free_days", export_detention_free_days: "=export_detention_free_days", export_demurrage_free_days: "=export_demurrage_free_days", combined_import_free_days: "=combined_import_free_days", combined_export_free_days: "=combined_export_free_days", minimum_invoice_usd: "=minimum_invoice_usd", invoice_payment_terms_days: "=invoice_payment_terms_days", dg_container_uplift_pct: "=dg_container_uplift_pct"}
    formula:
      separate_import_demurrage_chargeable: max(0, full_gate_out_date - discharge_date - clock_start_offset_days + 1 - import_demurrage_free_days)
      separate_import_detention_chargeable: max(0, empty_return_date - full_gate_out_date - clock_start_offset_days + 1 - import_detention_free_days)
      combined_import_chargeable: max(0, empty_return_date - discharge_date - clock_start_offset_days + 1 - combined_import_free_days)
      combined_export_chargeable: max(0, loaded_date - empty_pickup_date - clock_start_offset_days + 1 - combined_export_free_days)
      slab1_days_of_n: min(chargeable_days, slab1_length_days)
      slab2_days_of_n: min(max(0, chargeable_days - slab1_length_days), slab2_length_days)
      slab3_days_of_n: min(max(0, chargeable_days - slab1_length_days - slab2_length_days), slab3_length_days)
      slab4_days_of_n: max(0, chargeable_days - slab1_length_days - slab2_length_days - slab3_length_days)

  - id: dnd_free_time_upgrade
    subject: [dnd_free_time_extended, dnd_extension_fee_charged]
    rule: >-
      While a record's free time is still running, the billed party may buy a higher product for it. A product can be bought only while the
      record's status is free_time_running; once charges accrue it is too late, and the purchase is never backdated. The product bought must
      have purchasable_as_upgrade true and a higher rank than the product on the record, and the container's rate class must be one of its
      allowed_equipment_classes; AHL Contract Free Time 30 is never sold. A record may take an upgrade only while dnd_msr_upgrades_on_record
      is below the max_upgrades_per_record of the product currently on it. The price charged is the product_price_per_container_usd of the
      product bought minus that of the product already on the record, so the customer never pays twice for the same days. The upgrade
      replaces the product on the record and, under dnd_clock_rules, governs every clock of the record. Purchases are also subject to
      dnd_agg_overdue_portfolio_block. A bought product is not refundable when the container is returned early.
    eligibility:
      - id: running_record_only
        applies_to: [dnd_free_time_extended, dnd_extension_fee_charged]
        kind: state
        condition: A product can be bought only while the record's status is free_time_running; once charges accrue it is too late, and the purchase is never backdated.
        evidence_fields: [dnd_free_time.dnd_id, dnd_free_time.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_free_time.dnd_id]
          action_bindings: {dnd_free_time.dnd_id: dnd_id}
        state_contract:
          field: dnd_free_time.status
          allowed: [free_time_running]
      - id: upgrades_remaining
        applies_to: [dnd_free_time_extended, dnd_extension_fee_charged]
        kind: authorization
        condition: A record may take an upgrade only while dnd_msr_upgrades_on_record is below the max_upgrades_per_record of the product currently on it.
        evidence_fields: [dnd_ledger.dnd_id, dnd_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_ledger.dnd_id]
          action_bindings: {dnd_ledger.dnd_id: dnd_id}
    params:
      per_tier:
        AHL Tariff Free Time: {purchasable_as_upgrade: "=purchasable_as_upgrade", product_price_per_container_usd: "=product_price_per_container_usd", max_upgrades_per_record: "=max_upgrades_per_record", allowed_equipment_classes: "=allowed_equipment_classes"}
        AHL Free Time Extension 3: {purchasable_as_upgrade: "=purchasable_as_upgrade", product_price_per_container_usd: "=product_price_per_container_usd", max_upgrades_per_record: "=max_upgrades_per_record", allowed_equipment_classes: "=allowed_equipment_classes"}
        AHL Free Time Extension 7: {purchasable_as_upgrade: "=purchasable_as_upgrade", product_price_per_container_usd: "=product_price_per_container_usd", max_upgrades_per_record: "=max_upgrades_per_record", allowed_equipment_classes: "=allowed_equipment_classes"}
        AHL Combined Free Time 14: {purchasable_as_upgrade: "=purchasable_as_upgrade", product_price_per_container_usd: "=product_price_per_container_usd", max_upgrades_per_record: "=max_upgrades_per_record", allowed_equipment_classes: "=allowed_equipment_classes"}
        AHL Combined Free Time 21: {purchasable_as_upgrade: "=purchasable_as_upgrade", product_price_per_container_usd: "=product_price_per_container_usd", max_upgrades_per_record: "=max_upgrades_per_record", allowed_equipment_classes: "=allowed_equipment_classes"}
        AHL Contract Free Time 30: {purchasable_as_upgrade: "=purchasable_as_upgrade", product_price_per_container_usd: "=product_price_per_container_usd", max_upgrades_per_record: "=max_upgrades_per_record", allowed_equipment_classes: "=allowed_equipment_classes"}
    measures: [dnd_msr_upgrades_on_record]

  - id: dnd_invoice_dispute
    subject: [dnd_dispute_credited, dnd_charge_waived]
    rule: >-
      The billed party may dispute one invoice row, which only the billed party can do; the dispute is lodged by the customer and decided by
      the desk within dispute_response_days. The dispute must be lodged no later than the product's dispute_window_days calendar days after
      the disputed invoice was issued. The window ends on the invoice's event_date plus the product's window days counted on calendar dates,
      and a dispute lodged on the last day is in time. An invoice row carries at most one dispute. The desk decides three grounds from the
      records. On invoice_issued_late, the invoice is upheld as not collectible when its event_date is later than the record's
      clock_stopped_date plus invoice_issue_deadline_days, and the whole amount still open on the invoice is cleared by a dnd_charge_waived row
      with waiver_reason late_invoice; no dispute credit is written for this ground, and the same waiver clears a late invoice raised by the
      customer without a formal dispute. On rate_misapplied or free_time_misapplied, the desk recomputes the invoice row under dnd_invoicing
      with the product and recorded dates of the record; when the invoiced amount exceeds the recomputed amount, the dispute is upheld or
      partially upheld and credited by a dnd_dispute_credited row of the difference, but never more than the disputed_amount_usd, and when
      it does not, the dispute is denied with no row. Disputes on incorrect_event_dates, carrier_caused_delay or terminal_closure turn on
      operational facts the desk's records do not hold; the desk registers them and cannot decide them. A credit may be booked only on a
      record whose status is invoiced. A disputed invoice is not due while its dispute is submitted.
    eligibility:
      - id: dispute_window
        applies_to: [dnd_dispute_credited]
        kind: time
        condition: The dispute must be lodged no later than the product's dispute_window_days calendar days after the disputed invoice was issued.
        evidence_fields: [dnd_ledger.dnd_event_id, dnd_ledger.event_date, dnd_disputes.created_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_ledger.dnd_event_id]
          action_bindings: {dnd_ledger.dnd_event_id: invoice_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the disputed invoice was issued
          anchor_source: dnd_ledger.event_date
          relation: not_after
          duration_source: variants.dispute_window_days
          unit: calendar_days
          counting_rule: The window ends on the invoice's event_date plus the product's window days counted on calendar dates, and a dispute lodged on the last day is in time.
          boundary: inclusive
      - id: one_dispute_per_invoice
        applies_to: [dnd_dispute_credited]
        kind: dedup
        condition: An invoice row carries at most one dispute.
        evidence_fields: [dnd_disputes.invoice_event_id, dnd_disputes.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_disputes.invoice_event_id]
          action_bindings: {dnd_disputes.invoice_event_id: invoice_event_id}
        dedup_contract:
          table: dnd_disputes
          mode: separate_record
          object_bindings: {invoice_event_id: invoice_event_id}
          duplicate_filters: {outcome: [submitted, upheld, partially_upheld, denied]}
          distinct_fields: []
      - id: credit_on_invoiced_record
        applies_to: [dnd_dispute_credited, dnd_charge_waived]
        kind: state
        condition: A credit may be booked only on a record whose status is invoiced.
        evidence_fields: [dnd_free_time.dnd_id, dnd_free_time.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_free_time.dnd_id]
          action_bindings: {dnd_free_time.dnd_id: dnd_id}
        state_contract:
          field: dnd_free_time.status
          allowed: [invoiced]
    params:
      per_tier:
        AHL Tariff Free Time: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days", invoice_issue_deadline_days: "=invoice_issue_deadline_days"}
        AHL Free Time Extension 3: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days", invoice_issue_deadline_days: "=invoice_issue_deadline_days"}
        AHL Free Time Extension 7: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days", invoice_issue_deadline_days: "=invoice_issue_deadline_days"}
        AHL Combined Free Time 14: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days", invoice_issue_deadline_days: "=invoice_issue_deadline_days"}
        AHL Combined Free Time 21: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days", invoice_issue_deadline_days: "=invoice_issue_deadline_days"}
        AHL Contract Free Time 30: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days", invoice_issue_deadline_days: "=invoice_issue_deadline_days"}
    formula:
      late_invoice_waiver_amount: amount_usd - dnd_msr_invoice_credits
    measures: [dnd_msr_invoice_credits]

  - id: dnd_goodwill_waiver
    subject: [dnd_charge_waived]
    rule: >-
      The desk may grant one commercial goodwill waiver on an invoice row at the billed party's request, recorded with waiver_reason
      commercial_goodwill. The waiver is at most goodwill_waiver_pct_max percent of the amount still open on the invoice row after earlier
      credits and waivers, dnd_msr_invoice_credits, and never more than goodwill_waiver_cap_usd, rounded down to the cent; the desk grants the
      full amount so computed, never a smaller figure of its own choosing. The customer's goodwill waivers in the trailing 365 days must be
      fewer than the product's goodwill_waivers_per_365d. The waiver must be requested no later than the product's waiver_request_window_days
      calendar days after the invoice being waived was issued. The window ends on the invoice's event_date plus the product's window days
      counted on calendar dates, and a request on the last day is inside it. Each invoice row takes at most one goodwill waiver. When a
      dispute on the invoice is still submitted, the dispute is decided first and goodwill is computed on what remains. Products whose
      goodwill_waiver_pct_max is 0 give no goodwill. Waivers for carrier_caused_delay or terminal_closure are granted only by the operations
      department and never by the desk.
    eligibility:
      - id: goodwill_quota
        applies_to: [dnd_charge_waived]
        kind: authorization
        condition: The customer's goodwill waivers in the trailing 365 days must be fewer than the product's goodwill_waivers_per_365d.
        evidence_fields: [dnd_ledger.customer_id, dnd_ledger.event_type, dnd_ledger.waiver_reason, dnd_ledger.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_ledger.customer_id]
          action_bindings: {dnd_ledger.customer_id: customer_id}
      - id: goodwill_window
        applies_to: [dnd_charge_waived]
        kind: time
        condition: The waiver must be requested no later than the product's waiver_request_window_days calendar days after the invoice being waived was issued.
        evidence_fields: [dnd_ledger.dnd_event_id, dnd_ledger.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_ledger.dnd_event_id]
          action_bindings: {dnd_ledger.dnd_event_id: reference_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice being waived was issued
          anchor_source: dnd_ledger.event_date
          relation: not_after
          duration_source: variants.waiver_request_window_days
          unit: calendar_days
          counting_rule: The window ends on the invoice's event_date plus the product's window days counted on calendar dates, and a request on the last day is inside it.
          boundary: inclusive
      - id: one_goodwill_per_invoice
        applies_to: [dnd_charge_waived]
        kind: dedup
        condition: Each invoice row takes at most one goodwill waiver.
        evidence_fields: [dnd_ledger.reference_event_id, dnd_ledger.waiver_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_ledger.reference_event_id]
          action_bindings: {dnd_ledger.reference_event_id: reference_event_id}
        dedup_contract:
          table: dnd_ledger
          mode: separate_record
          object_bindings: {reference_event_id: reference_event_id}
          duplicate_filters: {waiver_reason: [commercial_goodwill]}
          distinct_fields: []
    params:
      per_tier:
        AHL Tariff Free Time: {goodwill_waiver_pct_max: "=goodwill_waiver_pct_max", goodwill_waiver_cap_usd: "=goodwill_waiver_cap_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
        AHL Free Time Extension 3: {goodwill_waiver_pct_max: "=goodwill_waiver_pct_max", goodwill_waiver_cap_usd: "=goodwill_waiver_cap_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
        AHL Free Time Extension 7: {goodwill_waiver_pct_max: "=goodwill_waiver_pct_max", goodwill_waiver_cap_usd: "=goodwill_waiver_cap_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
        AHL Combined Free Time 14: {goodwill_waiver_pct_max: "=goodwill_waiver_pct_max", goodwill_waiver_cap_usd: "=goodwill_waiver_cap_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
        AHL Combined Free Time 21: {goodwill_waiver_pct_max: "=goodwill_waiver_pct_max", goodwill_waiver_cap_usd: "=goodwill_waiver_cap_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
        AHL Contract Free Time 30: {goodwill_waiver_pct_max: "=goodwill_waiver_pct_max", goodwill_waiver_cap_usd: "=goodwill_waiver_cap_usd", goodwill_waivers_per_365d: "=goodwill_waivers_per_365d", waiver_request_window_days: "=waiver_request_window_days"}
    formula:
      goodwill_amount: min(goodwill_waiver_cap_usd, (amount_usd - dnd_msr_invoice_credits) * goodwill_waiver_pct_max / 100)
    measures: [dnd_msr_invoice_credits, dnd_msr_goodwill_waivers_365d]

  - id: dnd_payment
    subject: [dnd_payment_received, dnd_settled]
    rule: >-
      A remittance is applied to one record, written with the remittance reference exactly as quoted and the amount remitted. A payment may be
      booked only on a record whose status is invoiced. A payment may not exceed the record's balance_due_usd; any excess is returned by
      finance and not booked. A remittance reference is recorded only once per record. When the balance reaches 0.00 through payments,
      waivers and credits, the record is settled with settled_date set to that day; a record with a submitted dispute is settled only after
      the dispute is decided.
    eligibility:
      - id: pay_invoiced_record
        applies_to: [dnd_payment_received]
        kind: state
        condition: A payment may be booked only on a record whose status is invoiced.
        evidence_fields: [dnd_free_time.dnd_id, dnd_free_time.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_free_time.dnd_id]
          action_bindings: {dnd_free_time.dnd_id: dnd_id}
        state_contract:
          field: dnd_free_time.status
          allowed: [invoiced]
      - id: reference_once
        applies_to: [dnd_payment_received]
        kind: dedup
        condition: A remittance reference is recorded only once per record.
        evidence_fields: [dnd_ledger.dnd_id, dnd_ledger.payment_reference, dnd_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dnd_ledger.dnd_id, dnd_ledger.payment_reference]
          action_bindings: {dnd_ledger.dnd_id: dnd_id, dnd_ledger.payment_reference: payment_reference}
        dedup_contract:
          table: dnd_ledger
          mode: separate_record
          object_bindings: {dnd_id: dnd_id, payment_reference: payment_reference}
          duplicate_filters: {event_type: [dnd_payment_received]}
          distinct_fields: []
    formula:
      applied_amount: min(amount_usd, dnd_charges)

  - id: dnd_cancellation
    subject: [dnd_cancelled]
    rule: >-
      A record is cancelled when its booking is cancelled while the record's free time is still running and no clock-stopping movement has
      been recorded; the cancellation carries no charge, and any product bought for it stays charged because bought products are not
      refundable. A record whose container has already been picked up empty or discharged is never cancelled; its clocks run to their stop
      events and are invoiced under dnd_invoicing.
    eligibility: []

# ============================================================================
# extended_policies (dnd_billing_desk)
# ============================================================================
extended_policies:
  - id: dnd_ext_final_detention_charge
    base_policy_refs: [dnd_invoicing, dnd_clock_rules]
    overwrite:
      - base_policy: dnd_invoicing
        superseded_clause: >-
          Each day is billed at the rate of its clock type, slab and the rate class of the container given by equipment_class_map
        replaced_by: >-
          The rate class of the container is taken from equipment_class_map, except that a container whose mapped class is reefer is
          billed at reefer-class rates only when the booking it moves under has cargo_type reefer; a reefer unit moving under a booking of
          any other cargo_type is a non-operating reefer and every one of its days is billed at dry-class rates.
    trigger: state_due
    subject: [dnd_detention_invoiced]
    computes: amount_usd
    target_tool: book_detention_invoice_dba94f21
    rule: >-
      Once the last clock of a record has stopped, its final detention row is booked with the detention days used beyond free time, the
      first and last detention day billed and the amount. Under clock_model separate the detention clock of an import record runs from
      full_gate_out_date to empty_return_date against import_detention_free_days, and that of an export record from empty_pickup_date to
      full_gate_in_date against export_detention_free_days; the days used are the stop date minus the start date in calendar days, the
      detention days are the days used beyond the free days, and their slab count starts at the first detention day. Under clock_model
      combined the merged clock of an import record runs from discharge_date to empty_return_date and that of an export record from
      empty_pickup_date to loaded_date, against the combined free days of the direction; the n-th day of the merged clock falls on the
      start date plus n calendar days, and on import the days after full_gate_out_date are detention days while on export the days up to
      and including full_gate_in_date are detention days. The detention days billed under clock_model combined are the chargeable days of
      the merged clock that are detention days; on import their slab count continues after the chargeable demurrage days that precede them
      in the merged clock, and on export it starts at the first chargeable day. A day's slab is 1 while its position in the slab count is at
      most slab1_length_days, 2 while it is at most slab1_length_days plus slab2_length_days, 3 while it is at most the sum of the three slab
      lengths, and 4 afterwards. The rate class of the container is taken from equipment_class_map, except that a container whose mapped
      class is reefer is billed at reefer-class rates only when the booking it moves under has cargo_type reefer; a reefer unit moving under
      a booking of any other cargo_type is a non-operating reefer and every one of its days is billed at dry-class rates. Each detention day
      is billed at the detention rate of its slab and of that rate class for the product on the record, detention days carry no
      dangerous-goods uplift, the day rates are added up, and only the sum is rounded to the cent. A record with no detention day beyond
      free time gets no detention row. The first and last detention day billed are the first and last chargeable detention days
      themselves, so a detention row that ends at a terminal movement, such as the full_gate_in_date of an export record, ends on that
      movement's date and not on the clock_stopped_date.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [cargo_type]
        note: The cargo_type of the booking the container moves under decides whether a reefer-class container is billed at reefer or at dry detention rates.
    compute:
      - model_separate: "P('clock_model') == 'separate'"
      - is_import: "F('direction') == 'import'"
      - clock_start: "(F('full_gate_out_date') if is_import else F('empty_pickup_date')) if model_separate else (F('discharge_date') if is_import else F('empty_pickup_date'))"
      - clock_stop: "(F('empty_return_date') if is_import else F('full_gate_in_date')) if model_separate else (F('empty_return_date') if is_import else F('loaded_date'))"
      - days_used: "DAYS(clock_start, clock_stop) - P('clock_start_offset_days') + 1"
      - free_days: "(P('import_detention_free_days') if is_import else P('export_detention_free_days')) if model_separate else (P('combined_import_free_days') if is_import else P('combined_export_free_days'))"
      - terminal_boundary_day: "0 if model_separate else DAYS(clock_start, F('full_gate_out_date') if is_import else F('full_gate_in_date')) - P('clock_start_offset_days') + 1"
      - detention_days: "MX(0, days_used - free_days) if model_separate else (MX(0, days_used - MX(free_days, terminal_boundary_day)) if is_import else MX(0, MN(days_used, terminal_boundary_day) - free_days))"
      - slab_offset: "MX(0, MN(days_used, terminal_boundary_day) - free_days) if (is_import and not model_separate) else 0"
      - bound1: "P('slab1_length_days')"
      - bound2: "bound1 + P('slab2_length_days')"
      - bound3: "bound2 + P('slab3_length_days')"
      - days_slab1: "MX(0, MN(slab_offset + detention_days, bound1) - slab_offset)"
      - days_slab2: "MX(0, MN(slab_offset + detention_days, bound2) - MX(slab_offset, bound1))"
      - days_slab3: "MX(0, MN(slab_offset + detention_days, bound3) - MX(slab_offset, bound2))"
      - days_slab4: "MX(0, slab_offset + detention_days - MX(slab_offset, bound3))"
      - booking_cargo_type: "CFIELD('booking', 'cargo_type', booking_id=F('booking_id'))"
      - container_class: "('reefer' if booking_cargo_type == 'reefer' else 'dry') if (F('equipment_type') == '20RF' or F('equipment_type') == '40RH') else ('special' if (F('equipment_type') == '20OT' or F('equipment_type') == '40OT' or F('equipment_type') == '20FR' or F('equipment_type') == '40FR' or F('equipment_type') == '20TK') else 'dry')"
      - rate_slab1: "P('det_reefer_slab1_usd') if container_class == 'reefer' else (P('det_special_slab1_usd') if container_class == 'special' else P('det_dry_slab1_usd'))"
      - rate_slab2: "P('det_reefer_slab2_usd') if container_class == 'reefer' else (P('det_special_slab2_usd') if container_class == 'special' else P('det_dry_slab2_usd'))"
      - rate_slab3: "P('det_reefer_slab3_usd') if container_class == 'reefer' else (P('det_special_slab3_usd') if container_class == 'special' else P('det_dry_slab3_usd'))"
      - rate_slab4: "P('det_reefer_slab4_usd') if container_class == 'reefer' else (P('det_special_slab4_usd') if container_class == 'special' else P('det_dry_slab4_usd'))"
      - result: "RND(days_slab1 * rate_slab1 + days_slab2 * rate_slab2 + days_slab3 * rate_slab3 + days_slab4 * rate_slab4, 2)"
    compute_basis:
      model_separate: "Under clock_model separate the detention clock of an import record runs from full_gate_out_date to empty_return_date against import_detention_free_days"
      clock_start: "Under clock_model combined the merged clock of an import record runs from discharge_date to empty_return_date and that of an export record from empty_pickup_date to loaded_date, against the combined free days of the direction"
      clock_stop: "and that of an export record from empty_pickup_date to full_gate_in_date against export_detention_free_days"
      days_used: "the days used are the stop date minus the start date in calendar days"
      free_days: "against the combined free days of the direction"
      terminal_boundary_day: "the n-th day of the merged clock falls on the start date plus n calendar days, and on import the days after full_gate_out_date are detention days while on export the days up to and including full_gate_in_date are detention days"
      detention_days: "The detention days billed under clock_model combined are the chargeable days of the merged clock that are detention days"
      slab_offset: "on import their slab count continues after the chargeable demurrage days that precede them in the merged clock, and on export it starts at the first chargeable day"
      days_slab1: "A day's slab is 1 while its position in the slab count is at most slab1_length_days"
      days_slab4: "3 while it is at most the sum of the three slab lengths, and 4 afterwards"
      booking_cargo_type: "a container whose mapped class is reefer is billed at reefer-class rates only when the booking it moves under has cargo_type reefer"
      container_class: "a reefer unit moving under a booking of any other cargo_type is a non-operating reefer and every one of its days is billed at dry-class rates"
      rate_slab1: "Each detention day is billed at the detention rate of its slab and of that rate class for the product on the record"
      result: "detention days carry no dangerous-goods uplift, the day rates are added up, and only the sum is rounded to the cent"
    inputs:
      history: []
      cross_category: [booking]

  - id: dnd_ext_final_demurrage_charge
    base_policy_refs: [dnd_invoicing, dnd_clock_rules]
    overwrite:
      - base_policy: dnd_invoicing
        superseded_clause: >-
          Each day is billed at the rate of its clock type, slab and the rate class of the container given by equipment_class_map
        replaced_by: >-
          The rate class is taken from equipment_class_map, except that a reefer-class container is billed at reefer-class rates only when
          its booking has cargo_type reefer, and a reefer unit moving under a booking of any other cargo_type is billed at dry-class rates.
      - base_policy: dnd_invoicing
        superseded_clause: >-
          the slab position of a day is counted across the whole sequence of chargeable days
        replaced_by: >-
          on an export record the slab count of the demurrage days continues after the chargeable_days of the detention row already booked on the record, counting none when the record carries no detention row
    trigger: state_due
    subject: [dnd_demurrage_invoiced]
    computes: amount_usd
    target_tool: book_demurrage_invoice_a2ad21e7
    rule: >-
      Once the last clock of a record has stopped, its final demurrage row is booked with the demurrage days used beyond free time, the
      first and last demurrage day billed and the amount. Under clock_model separate the demurrage clock of an import record runs from
      discharge_date to full_gate_out_date against import_demurrage_free_days, and that of an export record from full_gate_in_date to
      loaded_date against export_demurrage_free_days; the days used are the stop date minus the start date in calendar days, the demurrage
      days are the days used beyond the free days, and their slab count starts at the first demurrage day. Under clock_model combined the
      merged clock of an import record runs from discharge_date to empty_return_date and that of an export record from empty_pickup_date to
      loaded_date, against the combined free days of the direction; the n-th day of the merged clock falls on the start date plus n calendar
      days, and on import the days up to and including full_gate_out_date are demurrage days while on export the days after
      full_gate_in_date are demurrage days. The demurrage days billed under clock_model combined are the chargeable days of the merged clock
      that are demurrage days. Under clock_model combined the record's detention row is booked before its demurrage row, and on an export
      record the slab count of the demurrage days continues after the chargeable_days of the detention row already booked on the record,
      counting none when the record carries no detention row; on import the slab count starts at the first chargeable day. A day's slab is
      1 while its position in the slab count is at most slab1_length_days, 2 while it is at most slab1_length_days plus slab2_length_days, 3
      while it is at most the sum of the three slab lengths, and 4 afterwards. The rate class is taken from equipment_class_map, except that
      a reefer-class container is billed at reefer-class rates only when its booking has cargo_type reefer, and a reefer unit moving under a
      booking of any other cargo_type is billed at dry-class rates. Each demurrage day is billed at the demurrage rate of its slab and of
      that rate class for the product on the record; when the booking's cargo_type is dangerous_goods, every demurrage day rate is increased
      by dg_container_uplift_pct percent of itself, and otherwise no uplift applies. The day rates so obtained are added up and only the sum
      is rounded to the cent. A record with no demurrage day beyond free time gets no demurrage row. The first and last demurrage day
      billed are the first and last chargeable demurrage days themselves, so a demurrage row that ends at a terminal movement, such as the
      full_gate_out_date of an import record, ends on that movement's date and not on the clock_stopped_date.
    prerequisite:
      - problem: dnd_ext_final_detention_charge
        kind: value_input
        gate: slab_offset
        condition: >-
          When demurrage and detention run on one merged clock, the record's detention row is booked before its demurrage row.
        policy_source: >-
          Under clock_model combined the record's detention row is booked before its demurrage row, and on an export record the slab count
          of the demurrage days continues after the chargeable_days of the detention row already booked on the record, counting none when
          the record carries no detention row
        resolved_by: book_detention_invoice_dba94f21
        effect: >-
          Once the detention row is booked, on an export record whose demurrage and detention run on one merged clock the slab count of
          the demurrage days starts after that row's chargeable days, which moves every demurrage day to a later slab and changes the
          demurrage amount; on any other record the booked detention row leaves the demurrage amount unchanged.
    cross_category:
      - category: booking
        as: branch
        reads: [cargo_type]
        note: The booking's cargo_type switches the dangerous-goods uplift on demurrage day rates and decides whether a reefer-class container is billed at reefer or dry rates.
    compute:
      - model_separate: "P('clock_model') == 'separate'"
      - is_import: "F('direction') == 'import'"
      - clock_start: "(F('discharge_date') if is_import else F('full_gate_in_date')) if model_separate else (F('discharge_date') if is_import else F('empty_pickup_date'))"
      - clock_stop: "(F('full_gate_out_date') if is_import else F('loaded_date')) if model_separate else (F('empty_return_date') if is_import else F('loaded_date'))"
      - days_used: "DAYS(clock_start, clock_stop) - P('clock_start_offset_days') + 1"
      - free_days: "(P('import_demurrage_free_days') if is_import else P('export_demurrage_free_days')) if model_separate else (P('combined_import_free_days') if is_import else P('combined_export_free_days'))"
      - terminal_boundary_day: "0 if model_separate else DAYS(clock_start, F('full_gate_out_date') if is_import else F('full_gate_in_date')) - P('clock_start_offset_days') + 1"
      - demurrage_days: "MX(0, days_used - free_days) if model_separate else (MX(0, MN(days_used, terminal_boundary_day) - free_days) if is_import else MX(0, days_used - MX(free_days, terminal_boundary_day)))"
      - slab_offset: "SUM('dnd_ledger', 'chargeable_days', event_type='dnd_detention_invoiced') if (not model_separate and not is_import) else 0"
      - bound1: "P('slab1_length_days')"
      - bound2: "bound1 + P('slab2_length_days')"
      - bound3: "bound2 + P('slab3_length_days')"
      - days_slab1: "MX(0, MN(slab_offset + demurrage_days, bound1) - slab_offset)"
      - days_slab2: "MX(0, MN(slab_offset + demurrage_days, bound2) - MX(slab_offset, bound1))"
      - days_slab3: "MX(0, MN(slab_offset + demurrage_days, bound3) - MX(slab_offset, bound2))"
      - days_slab4: "MX(0, slab_offset + demurrage_days - MX(slab_offset, bound3))"
      - booking_cargo_type: "CFIELD('booking', 'cargo_type', booking_id=F('booking_id'))"
      - container_class: "('reefer' if booking_cargo_type == 'reefer' else 'dry') if (F('equipment_type') == '20RF' or F('equipment_type') == '40RH') else ('special' if (F('equipment_type') == '20OT' or F('equipment_type') == '40OT' or F('equipment_type') == '20FR' or F('equipment_type') == '40FR' or F('equipment_type') == '20TK') else 'dry')"
      - rate_slab1: "P('dem_reefer_slab1_usd') if container_class == 'reefer' else (P('dem_special_slab1_usd') if container_class == 'special' else P('dem_dry_slab1_usd'))"
      - rate_slab2: "P('dem_reefer_slab2_usd') if container_class == 'reefer' else (P('dem_special_slab2_usd') if container_class == 'special' else P('dem_dry_slab2_usd'))"
      - rate_slab3: "P('dem_reefer_slab3_usd') if container_class == 'reefer' else (P('dem_special_slab3_usd') if container_class == 'special' else P('dem_dry_slab3_usd'))"
      - rate_slab4: "P('dem_reefer_slab4_usd') if container_class == 'reefer' else (P('dem_special_slab4_usd') if container_class == 'special' else P('dem_dry_slab4_usd'))"
      - dg_uplift_pct: "P('dg_container_uplift_pct') if booking_cargo_type == 'dangerous_goods' else 0"
      - unrounded_amount: "(days_slab1 * rate_slab1 + days_slab2 * rate_slab2 + days_slab3 * rate_slab3 + days_slab4 * rate_slab4) * (100 + dg_uplift_pct) / 100"
      - result: "RND(unrounded_amount, 2)"
    compute_basis:
      model_separate: "Under clock_model separate the demurrage clock of an import record runs from discharge_date to full_gate_out_date against import_demurrage_free_days"
      clock_start: "Under clock_model combined the merged clock of an import record runs from discharge_date to empty_return_date and that of an export record from empty_pickup_date to loaded_date, against the combined free days of the direction"
      clock_stop: "and that of an export record from full_gate_in_date to loaded_date against export_demurrage_free_days"
      days_used: "the days used are the stop date minus the start date in calendar days"
      free_days: "against the combined free days of the direction"
      terminal_boundary_day: "the n-th day of the merged clock falls on the start date plus n calendar days, and on import the days up to and including full_gate_out_date are demurrage days while on export the days after full_gate_in_date are demurrage days"
      demurrage_days: "The demurrage days billed under clock_model combined are the chargeable days of the merged clock that are demurrage days"
      slab_offset: "on an export record the slab count of the demurrage days continues after the chargeable_days of the detention row already booked on the record, counting none when the record carries no detention row; on import the slab count starts at the first chargeable day"
      days_slab1: "A day's slab is 1 while its position in the slab count is at most slab1_length_days"
      days_slab4: "3 while it is at most the sum of the three slab lengths, and 4 afterwards"
      booking_cargo_type: "a reefer-class container is billed at reefer-class rates only when its booking has cargo_type reefer"
      container_class: "a reefer unit moving under a booking of any other cargo_type is billed at dry-class rates"
      rate_slab1: "Each demurrage day is billed at the demurrage rate of its slab and of that rate class for the product on the record"
      dg_uplift_pct: "when the booking's cargo_type is dangerous_goods, every demurrage day rate is increased by dg_container_uplift_pct percent of itself, and otherwise no uplift applies"
      result: "The day rates so obtained are added up and only the sum is rounded to the cent."
    inputs:
      history:
        - {table: dnd_ledger, aggregate: sum, field: chargeable_days, filters: {event_type: dnd_detention_invoiced}}
      cross_category: [booking]

  - id: dnd_ext_goodwill_waiver_amount
    base_policy_refs: [dnd_goodwill_waiver, dnd_invoice_dispute, dnd_invoicing, dnd_clock_rules]
    overwrite:
      - base_policy: dnd_goodwill_waiver
        superseded_clause: >-
          The waiver is at most goodwill_waiver_pct_max percent of the amount still open on the invoice row after earlier credits and
          waivers, dnd_msr_invoice_credits, and never more than goodwill_waiver_cap_usd, rounded down to the cent
        replaced_by: >-
          The goodwill granted on a demurrage row is goodwill_waiver_pct_max percent of the goodwill base, never more than
          goodwill_waiver_cap_usd, and the figure is rounded down to the cent only at the end.
      - base_policy: dnd_invoicing
        superseded_clause: >-
          Each day is billed at the rate of its clock type, slab and the rate class of the container given by equipment_class_map
        replaced_by: >-
          In that recomputation the rate class comes from equipment_class_map, except that a reefer-class container counts as reefer class
          only when its booking has cargo_type reefer and otherwise counts as dry class
      - base_policy: dnd_invoicing
        superseded_clause: >-
          the slab position of a day is counted across the whole sequence of chargeable days
        replaced_by: >-
          with the slab count of an export record under clock_model combined continuing after the chargeable_days of the detention row booked on the record
    trigger: on_request
    subject: [dnd_charge_waived]
    computes: amount_usd
    target_tool: grant_goodwill_waiver_e03c98b1
    rule: >-
      A commercial goodwill waiver on the demurrage row of a record is granted at the billed party's request and is computed only on a
      demurrage invoice row already booked on the record. The amount still open on the demurrage row is its amount_usd less every waiver
      and dispute credit already booked with that row as reference_event_id. Goodwill is never granted on an overcharge: the demurrage row
      is recomputed from the record's recorded dates, the product on the record and the booking, exactly as its final demurrage row is
      computed, with the slab count of an export record under clock_model combined continuing after the chargeable_days of the detention row
      booked on the record. In that recomputation the rate class comes from equipment_class_map, except that a reefer-class container counts
      as reefer class only when its booking has cargo_type reefer and otherwise counts as dry class, and when the booking's cargo_type is
      dangerous_goods every demurrage day rate is raised by dg_container_uplift_pct percent of itself. The gross goodwill base is the smaller
      of the amount still open and the recomputed amount. The dangerous-goods uplift carried by the goodwill base is passed through to the terminal and is never
      reduced by goodwill: when the booking's cargo_type is dangerous_goods, the uplift share of the gross goodwill base, which is that base times
      dg_container_uplift_pct divided by the sum of 100 and dg_container_uplift_pct, is taken out of it, and otherwise nothing is taken out;
      what is left is the goodwill base. The goodwill granted on a demurrage row is goodwill_waiver_pct_max percent of the goodwill base,
      never more than goodwill_waiver_cap_usd, and the figure is rounded down to the cent only at the end. Products whose
      goodwill_waiver_pct_max is 0 give no goodwill. Goodwill on a detention row remains governed by dnd_goodwill_waiver alone.
    prerequisite:
      - problem: dnd_ext_final_demurrage_charge
        kind: value_input
        gate: invoiced_amount
        condition: >-
          Goodwill on a record's demurrage charges is computed only on a demurrage invoice row already booked on that record.
        policy_source: >-
          A commercial goodwill waiver on the demurrage row of a record is granted at the billed party's request and is computed only on a
          demurrage invoice row already booked on the record.
        resolved_by: book_demurrage_invoice_a2ad21e7
        effect: >-
          Once the demurrage row is booked, the goodwill has a row to be computed on: its invoiced amount and the amount still open on it
          take the row's real figures instead of nothing, and the goodwill follows from them.
    cross_category:
      - category: booking
        as: branch
        reads: [cargo_type]
        note: The booking's cargo_type drives the recomputation that caps the goodwill base (reefer or dry class, dangerous-goods uplift) and decides whether an uplift share is taken out of it.
    compute:
      - invoiced_amount: "SUM('dnd_ledger', 'amount_usd', event_type='dnd_demurrage_invoiced')"
      - demurrage_row_id: "LATEST('dnd_ledger', 'dnd_event_id', event_type='dnd_demurrage_invoiced')"
      - earlier_credits: "SUM('dnd_ledger', 'amount_usd', reference_event_id=demurrage_row_id) if demurrage_row_id else 0"
      - open_amount: "MX(0, invoiced_amount - earlier_credits)"
      - model_separate: "P('clock_model') == 'separate'"
      - is_import: "F('direction') == 'import'"
      - clock_start: "(F('discharge_date') if is_import else F('full_gate_in_date')) if model_separate else (F('discharge_date') if is_import else F('empty_pickup_date'))"
      - clock_stop: "(F('full_gate_out_date') if is_import else F('loaded_date')) if model_separate else (F('empty_return_date') if is_import else F('loaded_date'))"
      - days_used: "DAYS(clock_start, clock_stop) - P('clock_start_offset_days') + 1"
      - free_days: "(P('import_demurrage_free_days') if is_import else P('export_demurrage_free_days')) if model_separate else (P('combined_import_free_days') if is_import else P('combined_export_free_days'))"
      - terminal_boundary_day: "0 if model_separate else DAYS(clock_start, F('full_gate_out_date') if is_import else F('full_gate_in_date')) - P('clock_start_offset_days') + 1"
      - demurrage_days: "MX(0, days_used - free_days) if model_separate else (MX(0, MN(days_used, terminal_boundary_day) - free_days) if is_import else MX(0, days_used - MX(free_days, terminal_boundary_day)))"
      - slab_offset: "SUM('dnd_ledger', 'chargeable_days', event_type='dnd_detention_invoiced') if (not model_separate and not is_import) else 0"
      - bound1: "P('slab1_length_days')"
      - bound2: "bound1 + P('slab2_length_days')"
      - bound3: "bound2 + P('slab3_length_days')"
      - days_slab1: "MX(0, MN(slab_offset + demurrage_days, bound1) - slab_offset)"
      - days_slab2: "MX(0, MN(slab_offset + demurrage_days, bound2) - MX(slab_offset, bound1))"
      - days_slab3: "MX(0, MN(slab_offset + demurrage_days, bound3) - MX(slab_offset, bound2))"
      - days_slab4: "MX(0, slab_offset + demurrage_days - MX(slab_offset, bound3))"
      - booking_cargo_type: "CFIELD('booking', 'cargo_type', booking_id=F('booking_id'))"
      - container_class: "('reefer' if booking_cargo_type == 'reefer' else 'dry') if (F('equipment_type') == '20RF' or F('equipment_type') == '40RH') else ('special' if (F('equipment_type') == '20OT' or F('equipment_type') == '40OT' or F('equipment_type') == '20FR' or F('equipment_type') == '40FR' or F('equipment_type') == '20TK') else 'dry')"
      - rate_slab1: "P('dem_reefer_slab1_usd') if container_class == 'reefer' else (P('dem_special_slab1_usd') if container_class == 'special' else P('dem_dry_slab1_usd'))"
      - rate_slab2: "P('dem_reefer_slab2_usd') if container_class == 'reefer' else (P('dem_special_slab2_usd') if container_class == 'special' else P('dem_dry_slab2_usd'))"
      - rate_slab3: "P('dem_reefer_slab3_usd') if container_class == 'reefer' else (P('dem_special_slab3_usd') if container_class == 'special' else P('dem_dry_slab3_usd'))"
      - rate_slab4: "P('dem_reefer_slab4_usd') if container_class == 'reefer' else (P('dem_special_slab4_usd') if container_class == 'special' else P('dem_dry_slab4_usd'))"
      - dg_uplift_pct: "P('dg_container_uplift_pct') if booking_cargo_type == 'dangerous_goods' else 0"
      - recomputed_amount: "RND((days_slab1 * rate_slab1 + days_slab2 * rate_slab2 + days_slab3 * rate_slab3 + days_slab4 * rate_slab4) * (100 + dg_uplift_pct) / 100, 2)"
      - gross_goodwill_base: "MN(open_amount, recomputed_amount)"
      - uplift_share: "gross_goodwill_base * dg_uplift_pct / (100 + dg_uplift_pct)"
      - goodwill_base: "gross_goodwill_base - uplift_share"
      - capped_goodwill: "MN(goodwill_base * P('goodwill_waiver_pct_max') / 100, P('goodwill_waiver_cap_usd'))"
      - result: "int(round(capped_goodwill * 100, 6)) / 100"
    compute_basis:
      invoiced_amount: "computed only on a demurrage invoice row already booked on the record"
      demurrage_row_id: "A commercial goodwill waiver on the demurrage row of a record is granted at the billed party's request"
      earlier_credits: "The amount still open on the demurrage row is its amount_usd less every waiver and dispute credit already booked with that row as reference_event_id."
      clock_start: "the demurrage row is recomputed from the record's recorded dates, the product on the record and the booking, exactly as its final demurrage row is computed"
      slab_offset: "with the slab count of an export record under clock_model combined continuing after the chargeable_days of the detention row booked on the record"
      booking_cargo_type: "a reefer-class container counts as reefer class only when its booking has cargo_type reefer and otherwise counts as dry class"
      container_class: "In that recomputation the rate class comes from equipment_class_map"
      dg_uplift_pct: "when the booking's cargo_type is dangerous_goods every demurrage day rate is raised by dg_container_uplift_pct percent of itself"
      gross_goodwill_base: "The gross goodwill base is the smaller of the amount still open and the recomputed amount."
      uplift_share: "when the booking's cargo_type is dangerous_goods, the uplift share of the gross goodwill base, which is that base times dg_container_uplift_pct divided by the sum of 100 and dg_container_uplift_pct, is taken out of it, and otherwise nothing is taken out"
      capped_goodwill: "The goodwill granted on a demurrage row is goodwill_waiver_pct_max percent of the goodwill base, never more than goodwill_waiver_cap_usd"
      result: "the figure is rounded down to the cent only at the end"
    inputs:
      history:
        - {table: dnd_ledger, aggregate: sum, field: amount_usd, filters: {event_type: dnd_demurrage_invoiced}}
        - {table: dnd_ledger, aggregate: latest, field: dnd_event_id, filters: {event_type: dnd_demurrage_invoiced}}
        - {table: dnd_ledger, aggregate: sum, field: amount_usd, filters: {reference_event_id: demurrage_row_id}}
        - {table: dnd_ledger, aggregate: sum, field: chargeable_days, filters: {event_type: dnd_detention_invoiced}}
      cross_category: [booking]

  - id: dnd_ext_dispute_lodged_amount
    base_policy_refs: [dnd_invoice_dispute, dnd_invoicing]
    overwrite: []
    trigger: on_request
    subject: [dnd_dispute_credited]
    computes: disputed_amount_usd
    target_tool: lodge_dnd_dispute_1c3d36b3
    rule: >-
      A billed party disputing a demurrage invoice row on the ground rate_misapplied or free_time_misapplied lodges the dispute itself and
      disputes the amount still open on that row, which is the row's amount_usd less every waiver and dispute credit already booked with
      the row as reference_event_id, including waivers granted by the operations department. The dangerous-goods uplift carried by the
      amount still open is passed through to the terminal and is left out of what the billed party disputes: when the booking's cargo_type is dangerous_goods, the uplift share of the amount
      still open, which is that amount times dg_container_uplift_pct divided by the sum of 100 and dg_container_uplift_pct, is left out of
      the dispute, and otherwise nothing is left out. The disputed amount is rounded to the nearest cent only at the end. A dispute on any
      other ground, or on a detention row, is lodged for the amount the billed party states. A withdrawn dispute does not count toward
      the one dispute an invoice row may carry, so a row whose only earlier dispute was withdrawn may be disputed again within the
      dispute window.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [cargo_type]
        note: The booking's cargo_type decides whether the dangerous-goods uplift share of the open amount is left out of the disputed amount.
    compute:
      - demurrage_row_id: "LATEST('dnd_ledger', 'dnd_event_id', event_type='dnd_demurrage_invoiced')"
      - earlier_credits: "SUM('dnd_ledger', 'amount_usd', reference_event_id=demurrage_row_id) if demurrage_row_id else 0"
      - open_amount: "MX(0, SUM('dnd_ledger', 'amount_usd', event_type='dnd_demurrage_invoiced') - earlier_credits)"
      - dg_uplift_pct: "P('dg_container_uplift_pct') if CFIELD('booking', 'cargo_type', booking_id=F('booking_id')) == 'dangerous_goods' else 0"
      - result: "RND(open_amount - open_amount * dg_uplift_pct / (100 + dg_uplift_pct), 2)"
    compute_basis:
      open_amount: "disputes the amount still open on that row"
      demurrage_row_id: "A billed party disputing a demurrage invoice row on the ground rate_misapplied or free_time_misapplied lodges the dispute itself"
      earlier_credits: "which is the row's amount_usd less every waiver and dispute credit already booked with the row as reference_event_id, including waivers granted by the operations department"
      dg_uplift_pct: "when the booking's cargo_type is dangerous_goods, the uplift share of the amount still open, which is that amount times dg_container_uplift_pct divided by the sum of 100 and dg_container_uplift_pct, is left out of the dispute, and otherwise nothing is left out"
      result: "The disputed amount is rounded to the nearest cent only at the end."
    inputs:
      history:
        - {table: dnd_ledger, aggregate: sum, field: amount_usd, filters: {event_type: dnd_demurrage_invoiced}}
        - {table: dnd_ledger, aggregate: sum, field: amount_usd, filters: {reference_event_id: demurrage_row_id}}
      cross_category: [booking]

  - id: dnd_ext_dispute_credit_amount
    base_policy_refs: [dnd_invoice_dispute, dnd_invoicing, dnd_clock_rules]
    overwrite:
      - base_policy: dnd_invoicing
        superseded_clause: >-
          Each day is billed at the rate of its clock type, slab and the rate class of the container given by equipment_class_map
        replaced_by: >-
          the rate class is taken from equipment_class_map, save that a reefer-class container keeps reefer-class rates only under a booking
          whose cargo_type is reefer and is recomputed at dry-class rates under a booking of any other cargo_type
      - base_policy: dnd_invoicing
        superseded_clause: >-
          the slab position of a day is counted across the whole sequence of chargeable days
        replaced_by: >-
          on export the slab count continues after the chargeable_days of the detention row booked on the record
    trigger: state_due
    subject: [dnd_dispute_credited]
    computes: amount_usd
    target_tool: book_dispute_credit_515e844f
    rule: >-
      A dispute credit is booked only against a dispute the billed party has lodged on the invoice row and that is still submitted, and
      the credit references both that dispute and the disputed row. On a demurrage row disputed on rate_misapplied or free_time_misapplied
      the desk recomputes the row from the record's recorded dates and the product on the record: under clock_model separate the demurrage
      clock of an import record runs from discharge_date to full_gate_out_date against import_demurrage_free_days and that of an export
      record from full_gate_in_date to loaded_date against export_demurrage_free_days, the days used being the stop date minus the start
      date in calendar days and the chargeable days those beyond the free days, with the slab count starting at the first chargeable day;
      under clock_model combined the merged clock runs from discharge_date to empty_return_date on import and from empty_pickup_date to
      loaded_date on export against the combined free days, on import the days up to and including full_gate_out_date and on export the
      days after full_gate_in_date are demurrage days, and on export the slab count continues after the chargeable_days of the detention
      row booked on the record. A day's slab is 1 while its position in the slab count is at most slab1_length_days, 2 while it is at most
      slab1_length_days plus slab2_length_days, 3 while it is at most the sum of the three slab lengths, and 4 afterwards; the rate class is
      taken from equipment_class_map, save that a reefer-class container keeps reefer-class rates only under a booking whose cargo_type is
      reefer and is recomputed at dry-class rates under a booking of any other cargo_type; each day takes the demurrage rate of its slab and
      class, raised by dg_container_uplift_pct percent of itself when the booking's cargo_type is dangerous_goods; the day rates are added
      and the sum rounded to the cent. The overcharge is the row's amount_usd less the recomputed amount, and none when the recomputed
      amount is not lower. The credit is the smaller of the overcharge and the disputed_amount_usd of the dispute; the dispute is recorded
      upheld when the credit equals the disputed amount, partially_upheld when the credit is positive but smaller, and denied with no
      credit row when there is no overcharge. The credit may include the dangerous-goods uplift that the row billed on days or rates the
      recomputation removes, while the uplift carried by the recomputed amount is never credited.
    prerequisite:
      - problem: dnd_ext_dispute_lodged_amount
        kind: value_input
        gate: disputed_amount
        condition: >-
          A dispute credit requires a dispute the billed party has lodged on the invoice row and that is still submitted.
        policy_source: >-
          A dispute credit is booked only against a dispute the billed party has lodged on the invoice row and that is still submitted, and
          the credit references both that dispute and the disputed row.
        resolved_by: lodge_dnd_dispute_1c3d36b3
        effect: >-
          Once the billed party has lodged the dispute, the amount it disputes exists and bounds the credit, which becomes the smaller of
          that amount and the overcharge instead of nothing.
    cross_category:
      - category: booking
        as: branch
        reads: [cargo_type]
        note: The booking's cargo_type sets the rate class and the dangerous-goods uplift of the recomputation, and so the overcharge that bounds the credit.
    compute:
      - demurrage_row_id: "LATEST('dnd_ledger', 'dnd_event_id', event_type='dnd_demurrage_invoiced')"
      - disputed_amount: "LATEST('dnd_disputes', 'disputed_amount_usd', date_field='created_at', outcome='submitted', invoice_event_id=demurrage_row_id) or 0"
      - invoiced_amount: "SUM('dnd_ledger', 'amount_usd', event_type='dnd_demurrage_invoiced')"
      - model_separate: "P('clock_model') == 'separate'"
      - is_import: "F('direction') == 'import'"
      - clock_start: "(F('discharge_date') if is_import else F('full_gate_in_date')) if model_separate else (F('discharge_date') if is_import else F('empty_pickup_date'))"
      - clock_stop: "(F('full_gate_out_date') if is_import else F('loaded_date')) if model_separate else (F('empty_return_date') if is_import else F('loaded_date'))"
      - days_used: "DAYS(clock_start, clock_stop) - P('clock_start_offset_days') + 1"
      - free_days: "(P('import_demurrage_free_days') if is_import else P('export_demurrage_free_days')) if model_separate else (P('combined_import_free_days') if is_import else P('combined_export_free_days'))"
      - terminal_boundary_day: "0 if model_separate else DAYS(clock_start, F('full_gate_out_date') if is_import else F('full_gate_in_date')) - P('clock_start_offset_days') + 1"
      - demurrage_days: "MX(0, days_used - free_days) if model_separate else (MX(0, MN(days_used, terminal_boundary_day) - free_days) if is_import else MX(0, days_used - MX(free_days, terminal_boundary_day)))"
      - slab_offset: "SUM('dnd_ledger', 'chargeable_days', event_type='dnd_detention_invoiced') if (not model_separate and not is_import) else 0"
      - bound1: "P('slab1_length_days')"
      - bound2: "bound1 + P('slab2_length_days')"
      - bound3: "bound2 + P('slab3_length_days')"
      - days_slab1: "MX(0, MN(slab_offset + demurrage_days, bound1) - slab_offset)"
      - days_slab2: "MX(0, MN(slab_offset + demurrage_days, bound2) - MX(slab_offset, bound1))"
      - days_slab3: "MX(0, MN(slab_offset + demurrage_days, bound3) - MX(slab_offset, bound2))"
      - days_slab4: "MX(0, slab_offset + demurrage_days - MX(slab_offset, bound3))"
      - booking_cargo_type: "CFIELD('booking', 'cargo_type', booking_id=F('booking_id'))"
      - container_class: "('reefer' if booking_cargo_type == 'reefer' else 'dry') if (F('equipment_type') == '20RF' or F('equipment_type') == '40RH') else ('special' if (F('equipment_type') == '20OT' or F('equipment_type') == '40OT' or F('equipment_type') == '20FR' or F('equipment_type') == '40FR' or F('equipment_type') == '20TK') else 'dry')"
      - rate_slab1: "P('dem_reefer_slab1_usd') if container_class == 'reefer' else (P('dem_special_slab1_usd') if container_class == 'special' else P('dem_dry_slab1_usd'))"
      - rate_slab2: "P('dem_reefer_slab2_usd') if container_class == 'reefer' else (P('dem_special_slab2_usd') if container_class == 'special' else P('dem_dry_slab2_usd'))"
      - rate_slab3: "P('dem_reefer_slab3_usd') if container_class == 'reefer' else (P('dem_special_slab3_usd') if container_class == 'special' else P('dem_dry_slab3_usd'))"
      - rate_slab4: "P('dem_reefer_slab4_usd') if container_class == 'reefer' else (P('dem_special_slab4_usd') if container_class == 'special' else P('dem_dry_slab4_usd'))"
      - dg_uplift_pct: "P('dg_container_uplift_pct') if booking_cargo_type == 'dangerous_goods' else 0"
      - recomputed_amount: "RND((days_slab1 * rate_slab1 + days_slab2 * rate_slab2 + days_slab3 * rate_slab3 + days_slab4 * rate_slab4) * (100 + dg_uplift_pct) / 100, 2)"
      - overcharge: "MX(0, invoiced_amount - recomputed_amount)"
      - result: "RND(MN(overcharge, disputed_amount), 2)"
    compute_basis:
      demurrage_row_id: "On a demurrage row disputed on rate_misapplied or free_time_misapplied the desk recomputes the row"
      disputed_amount: "A dispute credit is booked only against a dispute the billed party has lodged on the invoice row and that is still submitted"
      invoiced_amount: "The overcharge is the row's amount_usd less the recomputed amount"
      model_separate: "under clock_model separate the demurrage clock of an import record runs from discharge_date to full_gate_out_date against import_demurrage_free_days"
      clock_start: "under clock_model combined the merged clock runs from discharge_date to empty_return_date on import and from empty_pickup_date to loaded_date on export against the combined free days"
      days_used: "the days used being the stop date minus the start date in calendar days and the chargeable days those beyond the free days"
      terminal_boundary_day: "on import the days up to and including full_gate_out_date and on export the days after full_gate_in_date are demurrage days"
      slab_offset: "on export the slab count continues after the chargeable_days of the detention row booked on the record"
      days_slab1: "A day's slab is 1 while its position in the slab count is at most slab1_length_days"
      days_slab4: "3 while it is at most the sum of the three slab lengths, and 4 afterwards"
      booking_cargo_type: "a reefer-class container keeps reefer-class rates only under a booking whose cargo_type is reefer"
      container_class: "is recomputed at dry-class rates under a booking of any other cargo_type"
      dg_uplift_pct: "raised by dg_container_uplift_pct percent of itself when the booking's cargo_type is dangerous_goods"
      recomputed_amount: "the day rates are added and the sum rounded to the cent"
      overcharge: "and none when the recomputed amount is not lower"
      result: "The credit is the smaller of the overcharge and the disputed_amount_usd of the dispute"
    inputs:
      history:
        - {table: dnd_ledger, aggregate: latest, field: dnd_event_id, filters: {event_type: dnd_demurrage_invoiced}}
        - {table: dnd_disputes, aggregate: latest, field: disputed_amount_usd, filters: {outcome: submitted, invoice_event_id: demurrage_row_id}}
        - {table: dnd_ledger, aggregate: sum, field: amount_usd, filters: {event_type: dnd_demurrage_invoiced}}
        - {table: dnd_ledger, aggregate: sum, field: chargeable_days, filters: {event_type: dnd_detention_invoiced}}
      cross_category: [booking]

  - id: dnd_ext_late_invoice_waiver
    base_policy_refs: [dnd_invoice_dispute, dnd_goodwill_waiver, dnd_invoicing]
    overwrite:
      - base_policy: dnd_invoice_dispute
        superseded_clause: >-
          the whole amount still open on the invoice is cleared by a dnd_charge_waived row with waiver_reason late_invoice
        replaced_by: >-
          the amount still open on the row is cleared by a dnd_charge_waived row with waiver_reason late_invoice except its dangerous-goods
          uplift share, which the line passes through to the terminal and which stays collectible
    trigger: state_due
    subject: [dnd_charge_waived]
    computes: amount_usd
    target_tool: clear_late_invoice_2264ae48
    rule: >-
      A demurrage invoice row whose event_date is later than the record's clock_stopped_date plus the product's
      invoice_issue_deadline_days is not collectible, and the amount still open on the row is cleared by a dnd_charge_waived row with
      waiver_reason late_invoice except its dangerous-goods uplift share, which the line passes through to the terminal and which stays
      collectible. Before a late demurrage row is cleared, any overcharge it carries against its recomputation is taken off through a
      decided dispute credit, so that the late-invoice waiver acts on what remains. The amount still open is the row's amount_usd less
      every waiver and dispute credit already booked with the row as reference_event_id, including waivers of the operations department.
      When the booking's cargo_type is dangerous_goods the uplift share is the amount still open times dg_container_uplift_pct divided by
      the sum of 100 and dg_container_uplift_pct, and otherwise the uplift share is nothing; the waiver is the amount still open less the
      uplift share, rounded to the nearest cent only at the end. A late detention row is cleared under dnd_invoice_dispute alone. Being a
      dnd_charge_waived row, a late-invoice waiver is also subject to the eligibility of dnd_goodwill_waiver that applies to every waiver
      row: the customer's commercial goodwill waivers in the trailing 365 days must be fewer than the product's
      goodwill_waivers_per_365d, the waiver must fall within the product's waiver_request_window_days of the invoice date, and the row
      must carry no earlier commercial goodwill waiver.
    prerequisite:
      - problem: dnd_ext_dispute_credit_amount
        kind: value_input
        gate: earlier_credits
        condition: >-
          Any overcharge a late demurrage row carries against its recomputation is credited through a decided dispute before the row is cleared.
        policy_source: >-
          Before a late demurrage row is cleared, any overcharge it carries against its recomputation is taken off through a decided dispute
          credit, so that the late-invoice waiver acts on what remains.
        resolved_by: book_dispute_credit_515e844f
        effect: >-
          Once the dispute credit is booked against the row, the credits already booked on it grow by the credit, the amount still open
          falls by the same figure, and both the retained uplift share and the late-invoice waiver are computed on that smaller remainder.
    cross_category:
      - category: booking
        as: branch
        reads: [cargo_type]
        note: The booking's cargo_type decides whether a dangerous-goods uplift share of the open amount stays collectible when a late row is cleared.
    compute:
      - demurrage_row_id: "LATEST('dnd_ledger', 'dnd_event_id', event_type='dnd_demurrage_invoiced')"
      - earlier_credits: "SUM('dnd_ledger', 'amount_usd', reference_event_id=demurrage_row_id) if demurrage_row_id else 0"
      - open_amount: "MX(0, SUM('dnd_ledger', 'amount_usd', event_type='dnd_demurrage_invoiced') - earlier_credits)"
      - dg_uplift_pct: "P('dg_container_uplift_pct') if CFIELD('booking', 'cargo_type', booking_id=F('booking_id')) == 'dangerous_goods' else 0"
      - result: "RND(open_amount - open_amount * dg_uplift_pct / (100 + dg_uplift_pct), 2)"
    compute_basis:
      open_amount: "The amount still open is the row's amount_usd less every waiver and dispute credit already booked with the row as reference_event_id, including waivers of the operations department."
      demurrage_row_id: "A demurrage invoice row whose event_date is later than the record's clock_stopped_date plus the product's invoice_issue_deadline_days is not collectible"
      earlier_credits: "any overcharge it carries against its recomputation is taken off through a decided dispute credit, so that the late-invoice waiver acts on what remains"
      dg_uplift_pct: "When the booking's cargo_type is dangerous_goods the uplift share is the amount still open times dg_container_uplift_pct divided by the sum of 100 and dg_container_uplift_pct, and otherwise the uplift share is nothing"
      result: "the waiver is the amount still open less the uplift share, rounded to the nearest cent only at the end"
    inputs:
      history:
        - {table: dnd_ledger, aggregate: sum, field: amount_usd, filters: {event_type: dnd_demurrage_invoiced}}
        - {table: dnd_ledger, aggregate: sum, field: amount_usd, filters: {reference_event_id: demurrage_row_id}}
      cross_category: [booking]

# ============================================================================
# workflows (exactly one per difficulty)
# ============================================================================
workflows:
  - id: dnd_wf_combined_record_closeout
    scenario: >-
      A free-time record running a combined clock whose last clock has stopped, that has not yet been invoiced and whose merged clock
      carries chargeable days both inside and outside the terminal, when the billed party asks in the same call for a goodwill reduction on
      the demurrage and wants to pay the record off at once by card. Once the procedure is complete the record carries its final detention
      and demurrage rows, one commercial goodwill waiver on the demurrage row, one card payment equal to the balance then due, and it is
      settled with nothing owed.
    steps:
      - {tool: book_detention_invoice_dba94f21, owner: agent, writes: dnd_ledger, subject: dnd_detention_invoiced, base_policy_refs: [dnd_invoicing], role: final detention row of the combined clock, computed_by: [dnd_ext_final_detention_charge]}
      - {tool: book_demurrage_invoice_a2ad21e7, owner: agent, writes: dnd_ledger, subject: dnd_demurrage_invoiced, base_policy_refs: [dnd_invoicing], role: final demurrage row continuing the slab count, computed_by: [dnd_ext_final_demurrage_charge]}
      - {tool: grant_goodwill_waiver_e03c98b1, owner: agent, writes: dnd_ledger, subject: dnd_charge_waived, base_policy_refs: [dnd_invoice_dispute, dnd_goodwill_waiver], role: goodwill on the demurrage row, computed_by: [dnd_ext_goodwill_waiver_amount]}
      - {tool: pay_dnd_balance_a831ef2f, owner: user, writes: dnd_ledger, subject: dnd_payment_received, base_policy_refs: [dnd_payment], role: the billed party pays the balance by card, computed_by: []}
      - {tool: settle_dnd_record_d9ada3ba, owner: agent, writes: dnd_free_time, subject: dnd_settled, base_policy_refs: [dnd_invoicing, dnd_payment], role: settlement at zero balance, computed_by: []}
    dataflow:
      - from_step: 1
        to_step: 2
        kind: object_binding
        source_table: dnd_ledger
        source_field: dnd_event_id
        consumer_bindings:
          - action_arg: reference_event_id
            role: authorization
            policy_id: dnd_goodwill_waiver
            eligibility_id: goodwill_window
            gate_field: dnd_ledger.dnd_event_id
          - action_arg: reference_event_id
            role: authorization
            policy_id: dnd_goodwill_waiver
            eligibility_id: one_goodwill_per_invoice
            gate_field: dnd_ledger.reference_event_id
    order_rationale: >-
      The detention row comes before the demurrage row because dnd_ext_final_demurrage_charge books the detention row of a combined record
      first and continues the demurrage slab count after the chargeable_days of that booked detention row; booked the other way round, the
      demurrage days would restart at slab 1 and carry the wrong rates. The demurrage row comes before the goodwill because
      dnd_ext_goodwill_waiver_amount computes goodwill only on a demurrage invoice row already booked on the record and references that row;
      before it exists there is no row to waive and no open amount, and the goodwill window of dnd_goodwill_waiver runs from that row's
      date. The goodwill comes before the card payment because dnd_payment forbids a payment above the record's balance_due_usd, and the
      balance the billed party can pay in full is only known once the goodwill is off; paid first, the later goodwill would leave the record
      in credit. The card payment comes before settlement because under dnd_payment a record is settled only when its balance reaches 0.00
      through payments, waivers and credits; settled earlier, a record would close with money still owed. Every step is a synchronous
      booking at the desk or the billed party's own card payment made in the call, and none of them waits for an outside event or for
      time to pass.
    prerequisite: []
