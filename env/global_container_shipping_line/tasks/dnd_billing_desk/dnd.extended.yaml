category: dnd
display_name: Demurrage and Detention Free Time

# Functional closure (real capabilities of a demurrage and detention billing desk, each carried below):
#   opening a per-container free-time record and assigning the product (dnd_free_time_opened; dnd_record_opening, dnd_agg_multi_holding)
#   clock start, expiry of free time, clock stop (dnd_free_time_expired, dnd_clock_stopped, dnd_movement_recorded; dnd_clock_rules)
#   invoicing by slab, class, dangerous-goods uplift, invoice deadline, minimum invoice (dnd_invoice_issued, dnd_demurrage_invoiced, dnd_detention_invoiced, dnd_settled; dnd_invoicing)
#   buying more free time before it runs out (dnd_free_time_extended, dnd_extension_fee_charged; dnd_free_time_upgrade, dnd_agg_overdue_portfolio_block)
#   invoice disputes and late-invoice forfeiture (dnd_dispute_credited, dnd_charge_waived; dnd_invoice_dispute)
#   goodwill waivers (dnd_charge_waived; dnd_goodwill_waiver)
#   payment and settlement (dnd_payment_received, dnd_settled; dnd_payment)
#   cancellation with the booking (dnd_cancelled; dnd_cancellation)
#   not applicable: interest on overdue invoices and container-loss claims, which credit control and equipment control handle outside this desk.

binding:
  holding_table: dnd_free_time
  event_tables: [dnd_ledger]
  intake_tables: [dnd_disputes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due_usd: dnd_charges}

lifecycle:
  states: [free_time_running, charges_accruing, clock_stopped, invoiced, settled, cancelled]
  transitions:
    - {from: free_time_running, to: charges_accruing, by: system, means: A clock passed the end of its free time while still running.}
    - {from: free_time_running, to: clock_stopped, by: system, means: The last clock stopped inside free time.}
    - {from: charges_accruing, to: clock_stopped, by: system, means: The last clock stopped after free time had run out.}
    - {from: clock_stopped, to: invoiced, by: agent, means: The final demurrage and detention invoice is issued.}
    - {from: clock_stopped, to: settled, by: agent, means: Nothing is invoiced because no day was chargeable, the total is below the minimum invoice, or the invoice deadline passed.}
    - {from: invoiced, to: settled, by: agent, means: The balance due reached 0.00 through payments, waivers and dispute credits.}
    - {from: free_time_running, to: cancelled, by: agent, means: The record is cancelled because its booking was cancelled before any clock ran.}

accounts:
  - key: dnd_charges
    unit: USD
    meaning: Demurrage, detention and free-time purchases owed on one container record — invoices and extension fees in, payments, waivers and dispute credits out.

parameter_schema:
  clock_model: Whether demurrage and detention run on separate clocks with their own free days (separate) or on one merged clock (combined) (enum string).
  import_demurrage_free_days: Free days on the import demurrage clock, discharge to full gate-out; used only when clock_model is separate (integer calendar days).
  import_detention_free_days: Free days on the import detention clock, full gate-out to empty return; used only when clock_model is separate (integer calendar days).
  export_detention_free_days: Free days on the export detention clock, empty pickup to full gate-in; used only when clock_model is separate (integer calendar days).
  export_demurrage_free_days: Free days on the export demurrage clock, full gate-in to loading; used only when clock_model is separate (integer calendar days).
  combined_import_free_days: Free days on the merged import clock, discharge to empty return; used only when clock_model is combined (integer calendar days).
  combined_export_free_days: Free days on the merged export clock, empty pickup to loading; used only when clock_model is combined (integer calendar days).
  clock_start_offset_days: Days after the start event on which a clock's first counted day falls (integer days).
  slab1_length_days: Chargeable days billed at slab 1 rates (integer days).
  slab2_length_days: Chargeable days after slab 1 billed at slab 2 rates (integer days).
  slab3_length_days: Chargeable days after slab 2 billed at slab 3 rates; every later day is slab 4 (integer days).
  dem_dry_slab1_usd: Demurrage day rate, dry class, slab 1 (USD per container per day).
  dem_dry_slab2_usd: Demurrage day rate, dry class, slab 2 (USD per container per day).
  dem_dry_slab3_usd: Demurrage day rate, dry class, slab 3 (USD per container per day).
  dem_dry_slab4_usd: Demurrage day rate, dry class, slab 4 (USD per container per day).
  dem_reefer_slab1_usd: Demurrage day rate, reefer class, slab 1 (USD per container per day).
  dem_reefer_slab2_usd: Demurrage day rate, reefer class, slab 2 (USD per container per day).
  dem_reefer_slab3_usd: Demurrage day rate, reefer class, slab 3 (USD per container per day).
  dem_reefer_slab4_usd: Demurrage day rate, reefer class, slab 4 (USD per container per day).
  dem_special_slab1_usd: Demurrage day rate, special class, slab 1 (USD per container per day).
  dem_special_slab2_usd: Demurrage day rate, special class, slab 2 (USD per container per day).
  dem_special_slab3_usd: Demurrage day rate, special class, slab 3 (USD per container per day).
  dem_special_slab4_usd: Demurrage day rate, special class, slab 4 (USD per container per day).
  det_dry_slab1_usd: Detention day rate, dry class, slab 1 (USD per container per day).
  det_dry_slab2_usd: Detention day rate, dry class, slab 2 (USD per container per day).
  det_dry_slab3_usd: Detention day rate, dry class, slab 3 (USD per container per day).
  det_dry_slab4_usd: Detention day rate, dry class, slab 4 (USD per container per day).
  det_reefer_slab1_usd: Detention day rate, reefer class, slab 1 (USD per container per day).
  det_reefer_slab2_usd: Detention day rate, reefer class, slab 2 (USD per container per day).
  det_reefer_slab3_usd: Detention day rate, reefer class, slab 3 (USD per container per day).
  det_reefer_slab4_usd: Detention day rate, reefer class, slab 4 (USD per container per day).
  det_special_slab1_usd: Detention day rate, special class, slab 1 (USD per container per day).
  det_special_slab2_usd: Detention day rate, special class, slab 2 (USD per container per day).
  det_special_slab3_usd: Detention day rate, special class, slab 3 (USD per container per day).
  det_special_slab4_usd: Detention day rate, special class, slab 4 (USD per container per day).
  equipment_class_map: Rate class of each equipment type (mapping of dnd_free_time.equipment_type value to dry, reefer or special).
  allowed_equipment_classes: Rate classes the product may be applied to (list of dry, reefer, special).
  dg_container_uplift_pct: Increase of demurrage day rates for a container on a dangerous_goods booking (integer percent).
  purchasable_as_upgrade: Whether the product may be bought on a running record in place of a lower product (boolean).
  product_price_per_container_usd: List price of the product per container record (USD per container).
  max_upgrades_per_record: Upgrades a record may still take while it carries this product (integer).
  min_contract_tier_rank: Lowest service contract tier rank whose bookings are opened on this product; 0 when no contract is needed (integer rank).
  overdue_balance_block_usd: Customer's overdue demurrage and detention balance above which this product cannot be bought as an upgrade (USD).
  invoice_issue_deadline_days: Latest the final invoice may be issued, in calendar days after charges stopped accruing (integer days).
  minimum_invoice_usd: Total below which no invoice is issued (USD per record).
  invoice_payment_terms_days: Payment term of a demurrage and detention invoice counted from its date (integer calendar days).
  dispute_window_days: Calendar days from the invoice date within which the billed party may dispute it (integer days).
  dispute_response_days: Calendar days from a dispute within which the line decides it (integer days).
  goodwill_waiver_pct_max: Largest goodwill waiver as percent of the invoice amount still open after credits (integer percent).
  goodwill_waiver_cap_usd: Largest goodwill waiver per invoice in money (USD per invoice).
  goodwill_waivers_per_365d: Goodwill waivers per customer in the trailing 365 days (integer).
  waiver_request_window_days: Calendar days from the invoice date within which a goodwill waiver may be requested (integer days).

