name: metro_gym_chain
company: Vantage Metro Fitness Clubs

background: |
  Vantage Metro Fitness Clubs is a multi-location fitness club chain serving a large metropolitan
  area, with clubs spread across downtown, midtown, uptown, waterfront and suburban zones. The
  chain positions itself as a full-service athletic and wellness brand for busy urban
  professionals, students, families and casual visitors alike. Its contact center handles the
  everyday account and billing questions that a multi-location gym chain generates, in a
  courteous, service-forward tone. Membership is the chain's core product: a member holds one of
  seven club membership tiers, from Base Club Access up through Premier All-Access, Black Card
  All-Access and the legacy Founding Legacy Access, plus Student Metro Access and Off-Peak Metro
  Access for members with narrower access needs. Each membership tier grants a different breadth
  of club access, guest privileges and amenities, and runs as a monthly-dues contract from signup
  through any freezes or past-due periods to eventual cancellation. Members build out their
  routine with personal-training packages, ranging from a Single Session Pack up to Unlimited
  Monthly Coaching and Elite Specialty Coaching. Members also purchase group-fitness class-credit
  packs, ranging from a 5-Class Pack up to Unlimited Monthly Classes and a Specialty Studio Pack
  for members seeking specialty instruction. A member's household can be extended through add-on
  memberships covering spouses, domestic partners, dependent children, young adults and senior
  parents. Members also rent lockers across the club network and hold a pro-shop store-credit
  account for gear and apparel purchases. Visitors who are not yet members can purchase short
  single-day passes or multi-day trial passes while they decide whether to join. Employers
  partner with the chain through a tiered corporate wellness program, spanning a Startup Partner
  tier for small offices up through an Enterprise Partner tier for large employers, alongside
  dedicated Municipal Partner and Nonprofit Partner tiers. A corporate wellness partnership
  sponsors a discounted membership and complimentary guest passes for each enrolled employee.
  Every one of these categories is its own running contract, so a member's full relationship with
  the chain is a portfolio of holdings layered on top of one another, each producing its own
  stream of billing and usage events over time. Callers to the contact center are typically
  checking on or adjusting one specific piece of that portfolio, such as a dues charge, a freeze,
  a package running low on sessions, or an employer-sponsored discount. Some callers are
  prospective members on a trial or day pass weighing whether to convert, while others are
  long-tenured members with years of check-ins, tier changes and freezes behind them. Some
  callers are the primary member on a household account calling about a dependent's add-on
  membership, or an employee calling about their employer-sponsored enrollment. Whoever is
  calling, the representative works from the caller's identity, the portfolio of holdings on
  file, and the recorded history of events on each holding to resolve what the caller has called
  about.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: membership_lifecycle
    claim:
      categories: [membership]
      event_types: [membership_signup, membership_activated, membership_application_withdrawn,
        membership_frozen, membership_resumed, membership_marked_past_due, membership_reactivated,
        membership_cancellation_requested, membership_cancellation_withdrawn, membership_closed,
        membership_dues_charge, membership_payment_received, membership_dues_waived,
        membership_guest_pass_granted, membership_guest_visit_used, membership_freeze_logged,
        membership_checkin]
    summary: >
      A member calling about their club membership may be on any of the seven tiers and in any
      lifecycle state -- active, frozen, past_due or cancel_pending -- and may be combining that
      membership with other holdings such as a corporate wellness enrollment, a household add-on,
      or a personal-training package that itself depends on the membership being active, so the
      same request can resolve differently depending on which tier and status the caller
      currently holds and what else is layered onto their account. The governing rules turn on
      eligibility gates such as membership_tier_dues_billing's requirement that a charge only
      lands while the contract is open, membership_cancellation_notice's notice-period boundary
      anchored on when the member gave notice, membership_early_termination_fee's minimum-term
      boundary anchored on when the membership was opened, and per-tier quantitative rules such as
      membership_freeze_policy's cap on freezes per rolling year and
      membership_guest_pass_policy's monthly guest-visit allowance and overage fee -- all of which
      must be read against the member's specific tier and their event history rather than assumed.
      Ordinary account service -- billing lookups, freezes, reactivations, guest-visit logging,
      check-ins, and applying waivers -- is performed directly by the representative once the
      caller's identity is confirmed, while actually giving notice of cancellation or withdrawing
      that notice is the member's own decision and is carried out through the member's own
      confirmation rather than unilaterally on the representative's initiative. Requests that fall
      outside any of these defined mechanisms -- for instance a member asking for a bespoke
      discount, fee category, or contractual term that no tier or policy in the charter provides
      for -- have no rule to resolve them and are the genuinely uncovered ground where the only
      correct route is a POLICY_NOT_COVERED hand-off rather than an improvised accommodation.

  - name: personal_training_packages
    claim:
      categories: [pt]
      event_types: [pt_package_purchased, pt_package_activated, pt_package_paused,
        pt_package_resumed, pt_package_exhausted, pt_package_lapsed, pt_package_archived,
        pt_package_cancelled, pt_session_redeemed, pt_session_cancelled_late, pt_package_refunded,
        pt_package_expired, pt_trainer_reassigned, pt_bonus_session_granted]
    summary: >
      A member calling about a personal-training package may hold up to two concurrent packages
      of different tiers, each with its own sessions remaining, expiration date and lifecycle
      status, and the package in question may be paused, exhausted, expired or freshly purchased,
      with the correct handling of a session redemption, a late cancellation, or a refund request
      turning entirely on which package and status the caller means, especially when the member
      holds more than one open package at once. The rules that decide these cases are tier-specific
      and time-anchored: pt_session_redemption_eligibility and pt_package_refund_policy gate their
      events on the package's current status, pt_package_refund_policy and
      pt_package_expiration_policy anchor their day-counts on when the package was purchased,
      pt_habitual_late_cancellation escalates the cancellation fee once a member crosses
      habitual_late_cancel_threshold late cancellations in the measured window, and
      pt_specialty_membership_gating ties purchase of Elite Specialty Coaching to the member's
      separately-held club membership being active at a qualifying tier. Ordinary package service
      -- checking a balance, redeeming or logging a session, reassigning a trainer, or crediting a
      bonus session -- is carried out directly by the representative, while confirming a package
      cancellation for refund is the member's own decision and is only ever carried out through
      the member's own confirmation. A request to redeem sessions for a type of coaching, a
      combination of packages, or a refund basis this charter does not define is outside any
      policy's reach, and the only correct response to it is a POLICY_NOT_COVERED hand-off.

  - name: group_fitness_classes
    claim:
      categories: [class]
      event_types: [class_pack_purchased, class_pack_activated, class_pack_exhausted,
        class_pack_lapsed, class_pack_archived, class_pack_cancelled, class_booked,
        class_booking_cancelled_in_window, class_no_show, class_pack_expired, class_pack_refunded,
        class_waitlist_promoted]
    summary: >
      A member calling about a class-credit pack may hold more than one pack at once -- for
      instance a general pack alongside a Specialty Studio Pack -- each with its own credit
      balance and expiration date, and the correct handling of a booking, a cancellation, or a
      no-show depends on which pack the credits are drawn from and how close to the class's
      scheduled start the member is acting, with habitual no-shows carrying their own escalating
      consequence. class_booking_eligibility gates a booking on the pack being active,
      class_agg_credit_pool sets which of several open packs a booking or an expiration draws from
      first, class_cancellation_window_policy and class_habitual_no_show_suspension turn on the
      member's cancellation and no-show history within the measured window, and
      class_membership_bundling_requirement ties purchase of any class pack to the member's
      separately-held club membership being active at a qualifying tier. Ordinary class-pack
      service -- booking or cancelling a class, logging a no-show, promoting a waitlisted member,
      or processing an expiration -- is carried out directly by the representative, while
      confirming a pack cancellation for a refund is the member's own decision, carried out only
      through the member's own confirmation. A request that depends on a class type, booking
      channel, or refund basis this charter never defines has no policy to resolve it, and the
      only correct response is a POLICY_NOT_COVERED hand-off.

  - name: corporate_wellness_partnerships
    claim:
      categories: [corp]
      event_types: [corp_enrollment_created, corp_enrollment_activated, corp_enrollment_suspended,
        corp_enrollment_reinstated, corp_tier_changed, corp_enrollment_closed, corp_dues_billed,
        corp_dues_payment_received, corp_dues_waived]
    summary: >
      An employee calling about their corporate wellness enrollment may belong to an employer on
      any of the six partnership tiers, from a small Startup Partner up through an Enterprise
      Partner, or one of the dedicated Municipal Partner and Nonprofit Partner tiers, and the
      enrollment itself may be active, suspended for the employer's nonpayment, or freshly created
      and still pending verification, with the correct handling of a billing question or a tier
      change depending on both the employer's tier and the enrollment's current status.
      corp_enrollment_verification requires proof of employment before an enrollment activates,
      corp_billing_and_suspension ties suspension to the employer's master account missing
      consecutive payments, corp_re_enrollment_cooldown anchors a cooldown period on when a prior
      enrollment for that employee closed, and corp_membership_bundling_requirement requires the
      employee to already hold an active club membership before a corporate wellness enrollment
      can even be created. Ordinary enrollment service -- activating an enrollment, billing or
      crediting the employer's master account, or moving an employee between partnership tiers --
      is carried out directly by the representative once the employee's identity and employer are
      confirmed. A dispute over the employer's own contract terms, or a request resting on an
      employment or headcount fact this charter has no mechanism to verify, is outside any
      policy's reach, and the only correct response is a POLICY_NOT_COVERED hand-off.

  - name: retail_store_credit
    claim:
      categories: [retail]
      event_types: [retail_account_opened, retail_account_activated, retail_account_suspended,
        retail_account_reinstated, retail_account_cancelled, retail_account_closed_administratively,
        retail_credit_topup, retail_credit_redeemed, retail_credit_refund, retail_credit_expired,
        retail_auto_reload_triggered]
    summary: >
      A member calling about their pro-shop store-credit account may hold any of six tiers, from a
      modest Starter Credit tier up through a VIP Credit tier and the two Auto-Reload tiers, with
      the account itself active, suspended on a fraud hold, or freshly opened, and the correct
      handling of a top-up, a redemption, or a refund request depends on the tier's own balance
      cap and discount rate as well as the account's current status. retail_redemption_eligibility
      gates a redemption on the account being active and within its daily redemption limit,
      retail_expiration_and_dormancy_policy anchors balance forfeiture on the account's history of
      inactivity, retail_refund_policy ties a top-up refund to a window measured from that top-up
      and to the account's status at the moment of the refund, and retail_vip_membership_gating
      requires the member's separately-held club membership to be active at a qualifying tier
      before the higher account tiers may even be opened. Ordinary account service -- topping up,
      redeeming credit for a purchase, applying an automatic reload, or reinstating a suspended
      account -- is carried out directly by the representative once the member's identity is
      confirmed, while closing the account and taking a final refund or forfeiture of the
      remaining balance is the member's own decision, carried out only through the member's own
      confirmation. A request to redeem credit toward an item category, or a top-up amount, this
      charter has no mechanism for is outside any policy's reach, and the only correct response is
      a POLICY_NOT_COVERED hand-off.
