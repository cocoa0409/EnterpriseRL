category: addon
display_name: Household Add-On Membership

binding:
  holding_table: household_addon_holdings
  event_tables: [household_addon_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {addon_dues_balance: addon_dues_account}

lifecycle:
  states: [applied, active, suspended, closed]
  transitions:
    - {from: applied, to: active, by: agent, means: the initial dues charge is captured and the add-on activates}
    - {from: active, to: suspended, by: system, means: a scheduled dues charge fails to collect}
    - {from: suspended, to: active, by: agent, means: the outstanding balance is paid and the add-on is brought current}
    - {from: active, to: closed, by: user, means: the primary member confirms removal of the dependent}
    - {from: suspended, to: closed, by: agent, means: a suspended add-on is administratively removed after nonpayment}
    - {from: active, to: closed, by: system, means: the dependent ages out of eligibility for this add-on tier}

accounts:
  - key: addon_dues_account
    unit: USD
    meaning: net amount currently owed on the add-on (positive = owed); charges increase it, payments and waivers decrease it

parameter_schema:
  monthly_dues_usd: recurring monthly add-on dues, USD
  enrollment_fee_usd: one-time fee charged at activation, USD
  minimum_term_months: minimum commitment length before removal is fee-free, months
  early_termination_fee_usd: flat fee charged when removal is requested before minimum_term_months elapses, USD
  cancellation_notice_days: notice required before a voluntary removal takes effect, calendar days
  late_fee_usd: flat fee charged when a scheduled dues charge fails to collect, USD
  past_due_grace_period_days: days an add-on may remain suspended for nonpayment before administrative removal, calendar days
  reactivation_fee_usd: fee charged to reinstate a suspended add-on, USD
  max_dependent_age_years: maximum age the dependent may be and still qualify for this tier, years (0 = no age limit)
  age_out_notice_days: notice given to the primary member before an automatic age-out removal, calendar days
  age_out_target_addon: enum(young_adult|none) — what this tier's dependent may convert to at age-out
  requires_proof_of_relationship: boolean — whether documented proof of the relationship is required
  proof_of_relationship_types: list of accepted proof types, e.g. [marriage_certificate, birth_certificate, domestic_partnership_affidavit]
  max_addons_per_primary: maximum add-ons a primary member may hold open at once, count (0 = unlimited)
  sibling_discount_pct: discount applied to each additional dependent add-on beyond the first, percent
  guest_pass_sharing_allowed: boolean — whether the add-on shares the primary member's guest-pass allowance
  class_booking_included: boolean — whether standard group classes are included for the dependent
  personal_training_discount_pct: discount on personal-training packages for the dependent, percent
  locker_rental_discount_pct: discount on locker rental fees for the dependent, percent
  retail_credit_discount_pct: discount on pro-shop store-credit top-ups for the dependent, percent
  minimum_signup_age_years: minimum age the dependent must be to be added without guardian consent, years
  guardian_consent_required_under_age: boolean — whether guardian consent is required for a dependent under minimum_signup_age_years
  billing_cycle_alignment: enum(same_as_primary|independent) — whether the add-on bills on the primary membership's cycle
  suspension_after_missed_payments: consecutive missed charges that trigger suspension, count
  auto_suspend_on_primary_suspension: boolean — whether this add-on suspends automatically when the primary membership is frozen
  auto_close_on_primary_closure: boolean — whether this add-on closes automatically when the primary membership closes
  dependent_photo_id_required: boolean — whether the dependent's own photo id must be on file
  dependent_medical_form_required: boolean — whether a dependent medical clearance form is required
  transfer_to_new_primary_allowed: boolean — whether the add-on may be transferred to a different primary member
  transfer_fee_usd: fee charged to transfer the add-on to a new primary member, USD
  multi_month_prepay_discount_pct: discount for prepaying dues in a lump sum, percent
  multi_month_prepay_options_months: list of allowed prepay lengths, months
  price_lock_months: months this tier's dues rate is locked against increases, months
  dues_price_increase_notice_days: notice required before a dues increase takes effect, calendar days
  domestic_partner_cohabitation_proof_required: boolean — whether proof of cohabitation is required for a domestic partner add-on
  domestic_partner_cohabitation_min_months: months of documented cohabitation required, months
  senior_parent_min_age_years: minimum age required to qualify as a senior parent dependent, years
  senior_parent_discount_pct: additional discount for the senior parent add-on tier, percent
  reactivation_window_days: days after suspension before the add-on is permanently removed rather than reinstated, calendar days
  removal_notice_days: notice given before a voluntary removal takes effect (may equal cancellation_notice_days), calendar days
  dependent_name_change_allowed: boolean — whether the dependent's name on file may be changed
  dependent_name_change_fee_usd: fee to change the dependent's name on file, USD
  household_multi_addon_min_count: minimum concurrent add-ons required to qualify for the household multi-add-on bundle rate, count
  household_multi_addon_bundle_discount_pct: discount applied once household_multi_addon_min_count is reached, percent
  waiver_medical_hold_allowed: boolean — whether dues may be waived during a documented medical hold
  relocation_termination_fee_waived: boolean — whether early_termination_fee_usd is waived for a documented relocation
  relocation_radius_miles: radius beyond which a relocation qualifies for the termination-fee waiver, miles
  seasonal_promo_discount_pct: discount applied during promotional periods, percent
  corporate_wellness_addon_discount_pct: discount available when the primary member holds an active corporate wellness enrollment, percent

