events:
  - type: addon_created
    target: household_addon_holdings
    mutation: create
    meaning: the primary member adds a household dependent
    grain: one row per add-on
    fields: {addon_id: primary reference of the add-on, customer_id: the primary member, variant_name: the relationship tier, status: lifecycle state, dependent_name: the dependent's name, dependent_date_of_birth: the dependent's date of birth, opened_date: date added}
    triggers:
      - event: addon:addon_activated
        map: {addon_id: addon_id, customer_id: customer_id}
  - type: addon_activated
    target: household_addon_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: the initial dues charge is captured and the add-on becomes active
    grain: one row per activation
    fields: {addon_id: the add-on activated, customer_id: the primary member, status: lifecycle state}
    triggers:
      - event: addon:addon_dues_charge
        map: {addon_id: addon_id, customer_id: customer_id, charge_type: recurring_dues}
  - type: addon_suspended
    target: household_addon_holdings
    mutation: {transition: {from: active, to: suspended}}
    meaning: a scheduled dues charge fails to collect and the add-on is suspended
    grain: one row per suspension
    fields: {addon_id: the add-on suspended, customer_id: the primary member, status: lifecycle state}
    triggers:
      - event: addon:addon_dues_charge
        map: {addon_id: addon_id, customer_id: customer_id, charge_type: late_fee}
  - type: addon_reinstated
    target: household_addon_holdings
    mutation: {transition: {from: suspended, to: active}}
    meaning: the outstanding balance is paid and the add-on is brought current
    grain: one row per reinstatement
    fields: {addon_id: the add-on reinstated, customer_id: the primary member, status: lifecycle state}
    triggers: []
  - type: addon_removed
    target: household_addon_holdings
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: the primary member removes the dependent, voluntarily or administratively after nonpayment
    grain: one row per removal
    fields: {addon_id: the add-on removed, customer_id: the primary member, status: lifecycle state, closed_date: the date removed}
    triggers: []
  - type: addon_age_out_converted
    target: household_addon_holdings
    mutation: {transition: {from: active, to: closed}}
    meaning: the dependent ages out of eligibility for this add-on tier
    grain: one row per age-out conversion
    fields: {addon_id: the add-on closed, customer_id: the primary member, status: lifecycle state, closed_date: the date closed}
    triggers: []
  - type: addon_dues_charge
    target: household_addon_events
    meaning: a recurring dues charge or a one-time late fee is billed on the add-on
    grain: one row per billing-cycle charge or one-time fee charge
    distinguish_by: [charge_type, billing_cycle_month, event_timestamp]
    account: addon_dues_account
    direction: in
    fields: {event_id: primary reference of the row, addon_id: the add-on billed, customer_id: the primary member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount charged, billing_cycle_month: the cycle covered by a recurring charge, charge_type: the billing subtype}
    triggers: []
  - type: addon_payment_received
    target: household_addon_events
    meaning: the primary member's payment is applied against the add-on's outstanding balance
    grain: one row per payment transaction
    distinguish_by: [event_timestamp]
    account: addon_dues_account
    direction: out
    fields: {event_id: primary reference of the row, addon_id: the add-on paid, customer_id: the primary member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount paid, billing_cycle_month: the cycle paid, charge_type: blank}
    triggers: []
  - type: addon_dues_waived
    target: household_addon_events
    meaning: staff waive some or all of the add-on's outstanding balance
    grain: one row per waiver
    distinguish_by: [event_timestamp]
    account: addon_dues_account
    direction: out
    fields: {event_id: primary reference of the row, addon_id: the add-on waived, customer_id: the primary member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount waived, billing_cycle_month: blank, charge_type: blank}
    triggers: []

measures: []

policies:
  - id: addon_agg_multi_holding
    subject: [addon_created]
    rule: A primary member may hold any number of household add-ons open at once, up to max_addons_per_primary when that cap is set above zero; a value of zero means the primary member's number of open add-ons is unlimited.
    eligibility: []
    params:
      max_per_customer: null

  - id: addon_agg_household_discount
    subject: [addon_dues_charge]
    rule: >
      Each additional dependent add-on beyond the primary member's first receives sibling_discount_pct off monthly_dues_usd; once the primary member's open add-ons reach household_multi_addon_min_count, every open add-on instead receives household_multi_addon_bundle_discount_pct, taking whichever single discount is higher rather than stacking them.
    eligibility: []
    params:
      per_tier:
        Spouse Add-On: {sibling_discount_pct: "=sibling_discount_pct", household_multi_addon_min_count: "=household_multi_addon_min_count", household_multi_addon_bundle_discount_pct: "=household_multi_addon_bundle_discount_pct"}
        Domestic Partner Add-On: {sibling_discount_pct: "=sibling_discount_pct", household_multi_addon_min_count: "=household_multi_addon_min_count", household_multi_addon_bundle_discount_pct: "=household_multi_addon_bundle_discount_pct"}
        Dependent Child Add-On: {sibling_discount_pct: "=sibling_discount_pct", household_multi_addon_min_count: "=household_multi_addon_min_count", household_multi_addon_bundle_discount_pct: "=household_multi_addon_bundle_discount_pct"}
        Young Adult Add-On: {sibling_discount_pct: "=sibling_discount_pct", household_multi_addon_min_count: "=household_multi_addon_min_count", household_multi_addon_bundle_discount_pct: "=household_multi_addon_bundle_discount_pct"}
        Senior Parent Add-On: {sibling_discount_pct: "=sibling_discount_pct", household_multi_addon_min_count: "=household_multi_addon_min_count", household_multi_addon_bundle_discount_pct: "=household_multi_addon_bundle_discount_pct"}
        Household Multi-Add-On: {sibling_discount_pct: "=sibling_discount_pct", household_multi_addon_min_count: "=household_multi_addon_min_count", household_multi_addon_bundle_discount_pct: "=household_multi_addon_bundle_discount_pct"}

  - id: addon_tier_pricing
    subject: [addon_dues_charge, addon_activated, addon_dues_waived, addon_payment_received]
    rule: Each billing cycle the add-on is charged the tier's monthly_dues_usd as a recurring_dues charge, billed on billing_cycle_alignment. A recurring or late-fee charge may be written only while the add-on is active or suspended
    eligibility:
      - id: dues_charge_requires_open_addon
        applies_to: [addon_dues_charge]
        kind: state
        condition: A recurring or late-fee charge may be written only while the add-on is active or suspended
        evidence_fields: [household_addon_holdings.addon_id, household_addon_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[household_addon_holdings.addon_id]]
          action_bindings: {household_addon_holdings.addon_id: addon_id}
        state_contract:
          field: household_addon_holdings.status
          allowed: [active, suspended]
    params:
      per_tier:
        Spouse Add-On: {monthly_dues_usd: "=monthly_dues_usd"}
        Domestic Partner Add-On: {monthly_dues_usd: "=monthly_dues_usd"}
        Dependent Child Add-On: {monthly_dues_usd: "=monthly_dues_usd"}
        Young Adult Add-On: {monthly_dues_usd: "=monthly_dues_usd"}
        Senior Parent Add-On: {monthly_dues_usd: "=monthly_dues_usd"}
        Household Multi-Add-On: {monthly_dues_usd: "=monthly_dues_usd"}

  - id: addon_past_due_suspension_policy
    subject: [addon_suspended, addon_removed, addon_reinstated]
    rule: >
      An add-on suspended for nonpayment may be administratively removed only once past_due_grace_period_days have elapsed since the add-on was suspended, counted as full calendar days with no partial-day rounding.
    eligibility: []
    params:
      per_tier:
        Spouse Add-On: {past_due_grace_period_days: "=past_due_grace_period_days"}
        Domestic Partner Add-On: {past_due_grace_period_days: "=past_due_grace_period_days"}
        Dependent Child Add-On: {past_due_grace_period_days: "=past_due_grace_period_days"}
        Young Adult Add-On: {past_due_grace_period_days: "=past_due_grace_period_days"}
        Senior Parent Add-On: {past_due_grace_period_days: "=past_due_grace_period_days"}
        Household Multi-Add-On: {past_due_grace_period_days: "=past_due_grace_period_days"}

  - id: addon_age_out_policy
    subject: [addon_age_out_converted]
    rule: >
      A Dependent Child Add-On or Young Adult Add-On converts to closed once the dependent's age, computed from dependent_date_of_birth (the date the dependent was born), reaches max_dependent_age_years, with age_out_notice_days notice given to the primary member beforehand; the dependent's age is computed in full calendar years from dependent_date_of_birth, completing on the same day-of-month in the anniversary month, or the last day of that month if dependent_date_of_birth's day does not exist in it. A Dependent Child Add-On whose age_out_target_addon is young_adult is expected to be re-added as a Young Adult Add-On rather than simply dropped.
    eligibility:
      - id: age_out_threshold_reached
        applies_to: [addon_age_out_converted]
        kind: time
        condition: A Dependent Child Add-On or Young Adult Add-On converts to closed once the dependent's age, computed from dependent_date_of_birth (the date the dependent was born), reaches max_dependent_age_years, with age_out_notice_days notice given to the primary member beforehand
        evidence_fields: [household_addon_holdings.addon_id, household_addon_holdings.dependent_date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[household_addon_holdings.addon_id]]
          action_bindings: {household_addon_holdings.addon_id: addon_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the dependent was born
          anchor_source: household_addon_holdings.dependent_date_of_birth
          relation: not_before
          duration_source: variants.max_dependent_age_years
          unit: calendar_months
          counting_rule: the dependent's age is computed in full calendar years from dependent_date_of_birth, completing on the same day-of-month in the anniversary month, or the last day of that month if dependent_date_of_birth's day does not exist in it
          boundary: inclusive
    params:
      per_tier:
        Spouse Add-On: {max_dependent_age_years: "=max_dependent_age_years"}
        Domestic Partner Add-On: {max_dependent_age_years: "=max_dependent_age_years"}
        Dependent Child Add-On: {max_dependent_age_years: "=max_dependent_age_years"}
        Young Adult Add-On: {max_dependent_age_years: "=max_dependent_age_years"}
        Senior Parent Add-On: {max_dependent_age_years: "=max_dependent_age_years"}
        Household Multi-Add-On: {max_dependent_age_years: "=max_dependent_age_years"}

  - id: addon_primary_membership_dependency
    subject: [addon_created]
    rule: >
      A household add-on may be created only for a primary member who already holds an active club membership; the add-on's discounts (guest-pass sharing, class booking, personal-training and locker-rental discounts) are bundled onto that membership and the add-on cannot exist without it.
    eligibility:
      - id: addon_requires_active_primary_membership
        applies_to: [addon_created]
        kind: state
        condition: A household add-on may be created only for a primary member who already holds an active club membership
        evidence_fields: [membership_holdings.status, membership_holdings.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_holdings.customer_id]]
          action_bindings: {membership_holdings.customer_id: customer_id}
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    params: {}

  - id: addon_early_termination_fee
    subject: [addon_dues_charge]
    rule: >
      An add-on removed before minimum_term_months have elapsed since it was activated is charged early_termination_fee_usd, waived entirely when relocation_termination_fee_waived applies to a documented relocation beyond relocation_radius_miles.
    eligibility: []
    params:
      per_tier:
        Spouse Add-On: {early_termination_fee_usd: "=early_termination_fee_usd", minimum_term_months: "=minimum_term_months"}
        Domestic Partner Add-On: {early_termination_fee_usd: "=early_termination_fee_usd", minimum_term_months: "=minimum_term_months"}
        Dependent Child Add-On: {early_termination_fee_usd: "=early_termination_fee_usd", minimum_term_months: "=minimum_term_months"}
        Young Adult Add-On: {early_termination_fee_usd: "=early_termination_fee_usd", minimum_term_months: "=minimum_term_months"}
        Senior Parent Add-On: {early_termination_fee_usd: "=early_termination_fee_usd", minimum_term_months: "=minimum_term_months"}
        Household Multi-Add-On: {early_termination_fee_usd: "=early_termination_fee_usd", minimum_term_months: "=minimum_term_months"}

  - id: addon_removal_policy
    subject: [addon_removed]
    rule: A removal may be recorded only while the add-on is active or suspended.
    eligibility:
      - id: removal_requires_open_addon
        applies_to: [addon_removed]
        kind: authorization
        condition: A removal may be recorded only while the add-on is active or suspended.
        evidence_fields: [household_addon_holdings.addon_id, household_addon_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[household_addon_holdings.addon_id]]
          action_bindings: {household_addon_holdings.addon_id: addon_id}
