events:
  - type: class_pack_purchased
    target: class_pass_holdings
    mutation: create
    meaning: a member purchases a class-credit pack
    grain: one row per pack
    fields: {class_pass_id: primary reference of the pack, customer_id: the purchasing member, variant_name: the tier chosen, status: lifecycle state, opened_date: date purchased, expiration_date: the date unused credits will expire, credits_remaining: credits granted at purchase}
    account: class_credit_account
    direction: in
    triggers:
      - event: class:class_pack_activated
        map: {class_pass_id: class_pass_id, customer_id: customer_id}
  - type: class_pack_activated
    target: class_pass_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: the purchase payment is captured and the pack becomes usable
    grain: one row per activation
    fields: {class_pass_id: the pack activated, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: class_pack_exhausted
    target: class_pass_holdings
    mutation: {transition: {from: active, to: exhausted}}
    meaning: the last credit in the pack is spent
    grain: one row per pack that runs out
    fields: {class_pass_id: the pack exhausted, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: class_pack_lapsed
    target: class_pass_holdings
    mutation: {transition: {from: active, to: expired}}
    meaning: the expiration date passes while credits remain unused
    grain: one row per pack that lapses
    fields: {class_pass_id: the pack that lapsed, customer_id: the member, status: lifecycle state}
    triggers:
      - event: class:class_pack_expired
        map: {class_pass_id: class_pass_id, customer_id: customer_id}
  - type: class_pack_archived
    target: class_pass_holdings
    mutation: {transition: [{from: exhausted, to: closed}, {from: expired, to: closed}]}
    meaning: an exhausted or expired pack is administratively archived
    grain: one row per archival
    fields: {class_pass_id: the pack archived, customer_id: the member, status: lifecycle state, closed_date: the date archived}
    triggers: []
  - type: class_pack_cancelled
    target: class_pass_holdings
    mutation: {transition: {from: active, to: closed}}
    meaning: the member confirms cancellation and takes a refund of unused credits
    grain: one row per cancellation
    fields: {class_pass_id: the pack cancelled, customer_id: the member, status: lifecycle state, closed_date: the date cancelled}
    triggers:
      - event: class:class_pack_refunded
        map: {class_pass_id: class_pass_id, customer_id: customer_id}
  - type: class_booked
    target: class_fitness_events
    meaning: the member books a class, spending a credit from the pack
    grain: one row per class booking
    distinguish_by: [class_session_id, event_timestamp]
    account: class_credit_account
    direction: out
    fields: {event_id: primary reference of the row, class_pass_id: the pack booked against, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, credits_delta: credits spent, amount_usd: any surcharge charged, class_type: the class booked, club_id: the club the class is held at, class_session_id: the scheduled class session}
    triggers: []
  - type: class_booking_cancelled_in_window
    target: class_fitness_events
    meaning: the member cancels a booking with enough notice and the credit is refunded to the pack
    grain: one row per in-window cancellation
    distinguish_by: [class_session_id, event_timestamp]
    account: class_credit_account
    direction: in
    fields: {event_id: primary reference of the row, class_pass_id: the pack refunded to, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, credits_delta: credits refunded, amount_usd: always 0.00, class_type: the class cancelled, club_id: the club the class is held at, class_session_id: the scheduled class session}
    triggers: []
  - type: class_no_show
    target: class_fitness_events
    meaning: the member fails to attend a booked class
    grain: one row per no-show
    distinguish_by: [class_session_id, event_timestamp]
    fields: {event_id: primary reference of the row, class_pass_id: the pack the booking was against, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, credits_delta: always 0 (the credit was already spent at booking), amount_usd: the no-show fee charged, class_type: the class missed, club_id: the club the class is held at, class_session_id: the scheduled class session}
    triggers: []
  - type: class_pack_expired
    target: class_fitness_events
    meaning: unused credits in a lapsed pack are forfeited at expiration
    grain: one row per expiration forfeiture
    distinguish_by: [event_timestamp]
    account: class_credit_account
    direction: out
    fields: {event_id: primary reference of the row, class_pass_id: the pack that expired, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, credits_delta: credits forfeited, amount_usd: always 0.00, class_type: blank, club_id: blank, class_session_id: blank}
    triggers: []
  - type: class_pack_refunded
    target: class_fitness_events
    meaning: unused credits in a cancelled pack are refunded and removed from the balance
    grain: one row per refund
    distinguish_by: [event_timestamp]
    account: class_credit_account
    direction: out
    fields: {event_id: primary reference of the row, class_pass_id: the pack refunded, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, credits_delta: credits removed from the balance, amount_usd: dollar amount refunded, class_type: blank, club_id: blank, class_session_id: blank}
    triggers: []
  - type: class_waitlist_promoted
    target: class_fitness_events
    meaning: a waitlisted member is promoted into an open spot in a class
    grain: one row per promotion
    distinguish_by: [class_session_id, event_timestamp]
    fields: {event_id: primary reference of the row, class_pass_id: the pack the promotion books against, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, credits_delta: always 0 (the booking itself spends the credit), amount_usd: always 0.00, class_type: the class promoted into, club_id: the club the class is held at, class_session_id: the scheduled class session}
    triggers:
      - event: class:class_booked
        map: {class_pass_id: class_pass_id, customer_id: customer_id, class_type: class_type, club_id: club_id, class_session_id: class_session_id}

measures:
  - id: class_msr_no_shows_last_60d
    window: rolling habitual_no_show_window_days ending at frozen_time (60 days for most tiers)
    measure: count of class_no_show events for the customer_id

policies:
  - id: class_agg_multi_holding
    subject: [class_pack_purchased]
    rule: A member may hold up to 2 class-credit packs open at the same time (any status other than closed), for example a general pack alongside one Specialty Studio Pack; a third concurrent open pack is not permitted. A member may not hold two Unlimited Monthly Classes packs open at the same time.
    eligibility: []
    params:
      max_per_customer: 2

  - id: class_agg_credit_pool
    subject: [class_booked, class_pack_expired, class_pack_exhausted]
    rule: >
      When a member holds more than one open class-credit pack, a booking or an expiration forfeiture draws from the pack with the soonest expiration_date among the member's open packs; where two open packs share the same expiration_date, the pack opened earlier (the lower opened_date) is drawn from first.
    eligibility: []

  - id: class_tier_pricing
    subject: [class_pack_purchased, class_pack_activated]
    rule: >
      At purchase, the pack is priced at the tier's price_usd (less multi_pack_discount_pct if the member already holds another open pack, and less corporate_wellness_discount_pct if the member holds an active corporate wellness enrollment, taking whichever single discount is higher rather than stacking them), grants credits_included credits (or unlimited use when credits_included is -1), and sets expiration_date to opened_date plus expiration_window_days calendar days.
    eligibility: []
    params:
      per_tier:
        5-Class Pack: {price_usd: "=price_usd", credits_included: "=credits_included", expiration_window_days: "=expiration_window_days"}
        10-Class Pack: {price_usd: "=price_usd", credits_included: "=credits_included", expiration_window_days: "=expiration_window_days"}
        20-Class Pack: {price_usd: "=price_usd", credits_included: "=credits_included", expiration_window_days: "=expiration_window_days"}
        Unlimited Monthly Classes: {price_usd: "=price_usd", credits_included: "=credits_included", expiration_window_days: "=expiration_window_days"}
        Specialty Studio Pack: {price_usd: "=price_usd", credits_included: "=credits_included", expiration_window_days: "=expiration_window_days"}
        Founding Class Pass: {price_usd: "=price_usd", credits_included: "=credits_included", expiration_window_days: "=expiration_window_days"}

  - id: class_booking_eligibility
    subject: [class_booked, class_waitlist_promoted]
    rule: A class may be booked only while the pack is active.
    eligibility:
      - id: booking_requires_active_pack
        applies_to: [class_booked]
        kind: state
        condition: A class may be booked only while the pack is active.
        evidence_fields: [class_pass_holdings.class_pass_id, class_pass_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[class_pass_holdings.class_pass_id]]
          action_bindings: {class_pass_holdings.class_pass_id: class_pass_id}
        state_contract:
          field: class_pass_holdings.status
          allowed: [active]

  - id: class_cancellation_window_policy
    subject: [class_booking_cancelled_in_window, class_no_show]
    rule: >
      Cancelling a booked class within cancellation_window_hours of its scheduled start forfeits the credit and charges late_cancel_fee_usd; cancelling with more notice than that refunds the credit to the pack at no charge. Failing to attend without cancelling is a no-show and charges no_show_fee_usd on top of the credit already spent. The member's stated notice, matched against the class time on file with the front desk, is the basis for whether a cancellation falls inside the window.
    eligibility: []
    params:
      per_tier:
        5-Class Pack: {cancellation_window_hours: "=cancellation_window_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}
        10-Class Pack: {cancellation_window_hours: "=cancellation_window_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}
        20-Class Pack: {cancellation_window_hours: "=cancellation_window_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}
        Unlimited Monthly Classes: {cancellation_window_hours: "=cancellation_window_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}
        Specialty Studio Pack: {cancellation_window_hours: "=cancellation_window_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}
        Founding Class Pass: {cancellation_window_hours: "=cancellation_window_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd"}

  - id: class_habitual_no_show_suspension
    subject: [class_no_show]
    rule: >
      Once a member accumulates habitual_no_show_threshold or more no-shows in the trailing habitual_no_show_window_days ending at frozen_time, counting every class_no_show event for that customer_id in the window, booking privileges are suspended for habitual_no_show_suspension_days from that no-show.
    eligibility: []
    measures: [class_msr_no_shows_last_60d]
    params:
      per_tier:
        5-Class Pack: {habitual_no_show_threshold: "=habitual_no_show_threshold", habitual_no_show_window_days: "=habitual_no_show_window_days", habitual_no_show_suspension_days: "=habitual_no_show_suspension_days"}
        10-Class Pack: {habitual_no_show_threshold: "=habitual_no_show_threshold", habitual_no_show_window_days: "=habitual_no_show_window_days", habitual_no_show_suspension_days: "=habitual_no_show_suspension_days"}
        20-Class Pack: {habitual_no_show_threshold: "=habitual_no_show_threshold", habitual_no_show_window_days: "=habitual_no_show_window_days", habitual_no_show_suspension_days: "=habitual_no_show_suspension_days"}
        Unlimited Monthly Classes: {habitual_no_show_threshold: "=habitual_no_show_threshold", habitual_no_show_window_days: "=habitual_no_show_window_days", habitual_no_show_suspension_days: "=habitual_no_show_suspension_days"}
        Specialty Studio Pack: {habitual_no_show_threshold: "=habitual_no_show_threshold", habitual_no_show_window_days: "=habitual_no_show_window_days", habitual_no_show_suspension_days: "=habitual_no_show_suspension_days"}
        Founding Class Pass: {habitual_no_show_threshold: "=habitual_no_show_threshold", habitual_no_show_window_days: "=habitual_no_show_window_days", habitual_no_show_suspension_days: "=habitual_no_show_suspension_days"}

  - id: class_pack_expiration_policy
    subject: [class_pack_lapsed, class_pack_expired, class_pack_archived]
    rule: >
      A pack lapses and its remaining credits are forfeited once frozen_time is not before opened_date (the date the pack was purchased) plus expiration_window_days calendar days, counted as full calendar days from opened_date with no partial-day rounding.
    eligibility:
      - id: expiration_window_elapsed
        applies_to: [class_pack_lapsed]
        kind: time
        condition: A pack lapses and its remaining credits are forfeited once frozen_time is not before opened_date (the date the pack was purchased) plus expiration_window_days calendar days, counted as full calendar days from opened_date with no partial-day rounding.
        evidence_fields: [class_pass_holdings.class_pass_id, class_pass_holdings.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[class_pass_holdings.class_pass_id]]
          action_bindings: {class_pass_holdings.class_pass_id: class_pass_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the pack was purchased
          anchor_source: class_pass_holdings.opened_date
          relation: not_before
          duration_source: variants.expiration_window_days
          unit: calendar_days
          counting_rule: counted as full calendar days from opened_date with no partial-day rounding
          boundary: inclusive
    params:
      per_tier:
        5-Class Pack: {expiration_window_days: "=expiration_window_days"}
        10-Class Pack: {expiration_window_days: "=expiration_window_days"}
        20-Class Pack: {expiration_window_days: "=expiration_window_days"}
        Unlimited Monthly Classes: {expiration_window_days: "=expiration_window_days"}
        Specialty Studio Pack: {expiration_window_days: "=expiration_window_days"}
        Founding Class Pass: {expiration_window_days: "=expiration_window_days"}

  - id: class_pack_refund_policy
    subject: [class_pack_refunded, class_pack_cancelled]
    rule: >
      A refund of unused credits may be recorded only while the pack is active, or in the same moment as its confirmed cancellation to closed, and only when the customer requests the refund before refund_window_days have elapsed since the pack was purchased, counted as full calendar days from opened_date with no partial-day rounding; frozen_time must not be later than opened_date plus refund_window_days for the refund to be recorded. The refund amount is refund_pct of the unused-credit value, prorated on cancellation_refund_basis.
    eligibility:
      - id: refund_requires_active_pack
        applies_to: [class_pack_refunded]
        kind: state
        condition: A refund of unused credits may be recorded only while the pack is active, or in the same moment as its confirmed cancellation to closed
        evidence_fields: [class_pass_holdings.class_pass_id, class_pass_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[class_pass_holdings.class_pass_id]]
          action_bindings: {class_pass_holdings.class_pass_id: class_pass_id}
        state_contract:
          field: class_pass_holdings.status
          allowed: [active, closed]
      - id: refund_within_window
        applies_to: [class_pack_refunded]
        kind: time
        condition: only when the customer requests the refund before refund_window_days have elapsed since the pack was purchased, counted as full calendar days from opened_date with no partial-day rounding
        evidence_fields: [class_pass_holdings.class_pass_id, class_pass_holdings.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[class_pass_holdings.class_pass_id]]
          action_bindings: {class_pass_holdings.class_pass_id: class_pass_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the pack was purchased
          anchor_source: class_pass_holdings.opened_date
          relation: not_after
          duration_source: variants.refund_window_days
          unit: calendar_days
          counting_rule: counted as full calendar days from opened_date with no partial-day rounding
          boundary: inclusive
    params:
      per_tier:
        5-Class Pack: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct"}
        10-Class Pack: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct"}
        20-Class Pack: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct"}
        Unlimited Monthly Classes: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct"}
        Specialty Studio Pack: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct"}
        Founding Class Pass: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct"}

  - id: class_membership_bundling_requirement
    subject: [class_pack_purchased]
    rule: >
      A class-credit pack may be purchased only by a member whose club membership is active and whose membership tier ladder rank is at least minimum_membership_tier_rank; a lower or inactive membership must upgrade first.
    eligibility:
      - id: purchase_requires_qualifying_membership
        applies_to: [class_pack_purchased]
        kind: state
        condition: A class-credit pack may be purchased only by a member whose club membership is active and whose membership tier ladder rank is at least minimum_membership_tier_rank
        evidence_fields: [membership_holdings.status, membership_holdings.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_holdings.customer_id]]
          action_bindings: {membership_holdings.customer_id: customer_id}
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    params:
      per_tier:
        5-Class Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        10-Class Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        20-Class Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        Unlimited Monthly Classes: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        Specialty Studio Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        Founding Class Pass: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
