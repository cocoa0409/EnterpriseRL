category: class
display_name: Group Fitness Class Passes

binding:
  holding_table: class_pass_holdings
  event_tables: [class_fitness_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {credits_remaining: class_credit_account}

lifecycle:
  states: [applied, active, exhausted, expired, closed]
  transitions:
    - {from: applied, to: active, by: agent, means: the purchase payment is captured and the pack activates}
    - {from: active, to: exhausted, by: system, means: the last credit in the pack is spent}
    - {from: active, to: expired, by: system, means: the expiration date passes while credits remain}
    - {from: exhausted, to: closed, by: agent, means: an exhausted pack is administratively archived}
    - {from: expired, to: closed, by: agent, means: an expired pack is administratively archived}
    - {from: active, to: closed, by: user, means: the member confirms cancellation and takes a refund of unused credits}

accounts:
  - key: class_credit_account
    unit: credits
    meaning: class-booking credits currently available in the member's pack(s); purchases and in-window cancellation refunds increase it, bookings, expirations and pack refunds decrease it

parameter_schema:
  price_usd: purchase price of the pack, USD
  credits_included: class credits granted by the pack, count (-1 denotes unlimited for the Unlimited Monthly Classes tier)
  expiration_window_days: days from purchase until unused credits expire
  cancellation_window_hours: hours before a class's start within which cancelling forfeits the credit
  no_show_fee_usd: flat fee charged for failing to attend a booked class, USD
  no_show_forfeits_credit: boolean — whether a no-show forfeits the credit in addition to the fee (the credit is already spent at booking, so this governs whether it is ever restored)
  waitlist_enabled: boolean — whether a full class may be joined via waitlist
  waitlist_max_position: maximum waitlist position offered before the waitlist closes, count
  booking_advance_window_hours: how far ahead a class may be booked, hours
  max_bookings_per_day: maximum classes that may be booked for a single calendar day, count
  class_types_allowed: enum(basic|all|specialty_only) — which class_type values this pack's credits may book
  specialty_surcharge_usd: extra credit-equivalent surcharge for a specialty class booking, USD (0 if included)
  refund_window_days: days after purchase within which a refund of unused credits may be requested
  refund_pct: percentage of the unused-credit value refunded on an eligible cancellation, percent
  membership_required: boolean — whether an active club membership is required to purchase this pack
  minimum_membership_tier_rank: minimum club membership tier ladder rank required to purchase, count (0 = any active membership suffices)
  multi_pack_discount_pct: discount applied to a second concurrent pack, percent
  auto_renew_available: boolean — whether the pack may auto-renew on exhaustion
  auto_renew_discount_pct: discount applied to an auto-renewed pack, percent
  credit_rollover_allowed: boolean — whether unused credits may roll into a renewed pack
  credit_rollover_max: maximum credits that may roll over, count
  guest_booking_allowed: boolean — whether a guest may be booked into a class using the member's credit
  guest_booking_fee_usd: extra fee for a guest booking, USD
  peak_class_surcharge_usd: extra fee for booking a class in peak demand hours, USD (0 if none)
  off_peak_class_discount_pct: discount for booking a class in off-peak hours, percent
  holiday_blackout_dates_apply: boolean — whether booking is restricted on published holiday blackout dates
  waitlist_promotion_notice_hours: hours of notice given when promoted from the waitlist, hours
  late_cancel_fee_usd: flat fee charged in addition to credit forfeiture for a late cancellation, USD
  habitual_no_show_threshold: count of no-shows in the measure window that triggers a booking suspension
  habitual_no_show_window_days: rolling window used to count no-shows, days
  habitual_no_show_suspension_days: days booking privileges are suspended once the habitual threshold is crossed, days
  family_sharing_allowed: boolean — whether credits may be redeemed by a household add-on dependent
  transfer_fee_usd: fee charged to transfer credits to another member, USD
  gift_transferable: boolean — whether unused credits may be transferred to another member
  corporate_wellness_discount_pct: discount available when bundled with an active corporate wellness enrollment, percent
  seasonal_promo_discount_pct: discount applied during promotional periods, percent
  class_duration_minutes: typical length of a booked class, minutes
  instructor_tier: enum(standard|master) — the qualification level of instructors this pack's classes are led by
  private_group_booking_allowed: boolean — whether a private group class may be booked with this pack
  private_group_max_participants: maximum participants in a private group booking, count
  private_group_surcharge_usd: surcharge for a private group booking, USD
  deposit_required_usd: upfront deposit required at purchase, USD (0 for lower tiers)
  cancellation_refund_basis: enum(credits_used|percentage_elapsed) — basis for prorating a pack refund
  minimum_notice_for_specialty_hours: extra advance-booking notice required for a specialty class, hours
  studio_capacity_priority: enum(standard|priority) — whether this pack's holder gets priority booking ahead of the general waitlist
  app_booking_required: boolean — whether bookings for this pack must be made through the mobile app
  walkin_standby_allowed: boolean — whether a walk-in standby spot may be taken without a prior booking
  walkin_standby_fee_usd: fee for a walk-in standby spot, USD
  class_credit_expiry_extension_fee_usd: fee to extend expiring credits, USD
  class_credit_expiry_extension_days: days an extension adds to expiration_window_days, days

