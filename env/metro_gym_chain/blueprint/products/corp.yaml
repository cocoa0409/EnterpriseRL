events:
  - type: corp_enrollment_created
    target: corporate_wellness_enrollments
    mutation: create
    meaning: an employee applies for a corporate wellness enrollment sponsored by their employer
    grain: one row per enrollment
    fields: {enrollment_id: primary reference of the enrollment, customer_id: the enrolling employee, variant_name: the employer's partnership tier, status: lifecycle state, employer_name: the sponsoring employer, employer_account_id: the employer's corporate account reference, opened_date: date applied}
    triggers:
      - event: corp:corp_enrollment_activated
        map: {enrollment_id: enrollment_id, customer_id: customer_id}
  - type: corp_enrollment_activated
    target: corporate_wellness_enrollments
    mutation: {transition: {from: applied, to: active}}
    meaning: employment/eligibility is verified and the first bill is run
    grain: one row per activation
    fields: {enrollment_id: the enrollment activated, customer_id: the employee, status: lifecycle state}
    triggers:
      - event: corp:corp_dues_billed
        map: {enrollment_id: enrollment_id, customer_id: customer_id, employer_account_id: employer_account_id}
  - type: corp_enrollment_suspended
    target: corporate_wellness_enrollments
    mutation: {transition: {from: active, to: suspended}}
    meaning: the employer's master account misses enough payments and the enrollment is suspended
    grain: one row per suspension
    fields: {enrollment_id: the enrollment suspended, customer_id: the employee, status: lifecycle state}
    triggers: []
  - type: corp_enrollment_reinstated
    target: corporate_wellness_enrollments
    mutation: {transition: {from: suspended, to: active}}
    meaning: the employer's master account is brought current and the enrollment resumes
    grain: one row per reinstatement
    fields: {enrollment_id: the enrollment reinstated, customer_id: the employee, status: lifecycle state}
    triggers: []
  - type: corp_tier_changed
    target: corporate_wellness_enrollments
    mutation: update
    meaning: the employer's partnership tier changes (e.g. headcount growth moves them to a higher tier)
    grain: one row per tier change
    fields: {enrollment_id: the enrollment changed, customer_id: the employee, variant_name: the new partnership tier}
    triggers: []
  - type: corp_enrollment_closed
    target: corporate_wellness_enrollments
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: the employee is removed from the corporate roster or the employer partnership ends
    grain: one row per closure
    fields: {enrollment_id: the enrollment closed, customer_id: the employee, status: lifecycle state, closed_date: the date closed}
    triggers: []
  - type: corp_dues_billed
    target: corporate_wellness_events
    meaning: the employer's master account is billed for this employee's monthly corporate wellness dues
    grain: one row per billing-cycle charge
    distinguish_by: [billing_cycle_month, event_timestamp]
    account: corporate_dues_account
    direction: in
    fields: {event_id: primary reference of the row, enrollment_id: the enrollment billed, customer_id: the employee, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount billed, billing_cycle_month: the cycle covered, employer_account_id: the employer account billed}
    triggers: []
  - type: corp_dues_payment_received
    target: corporate_wellness_events
    meaning: the employer's master account payment is applied against this employee's billed balance
    grain: one row per payment transaction
    distinguish_by: [event_timestamp]
    account: corporate_dues_account
    direction: out
    fields: {event_id: primary reference of the row, enrollment_id: the enrollment paid, customer_id: the employee, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount paid, billing_cycle_month: the cycle paid, employer_account_id: the employer account paying}
    triggers: []
  - type: corp_dues_waived
    target: corporate_wellness_events
    meaning: staff waive some or all of this employee's outstanding corporate-billed balance
    grain: one row per waiver
    distinguish_by: [event_timestamp]
    account: corporate_dues_account
    direction: out
    fields: {event_id: primary reference of the row, enrollment_id: the enrollment waived, customer_id: the employee, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount waived, billing_cycle_month: blank, employer_account_id: the employer account waived}
    triggers: []

measures: []

policies:
  - id: corp_agg_multi_holding
    subject: [corp_enrollment_created, corp_enrollment_closed]
    rule: An employee may hold only a single corporate wellness enrollment that is not closed at any time; a new enrollment is not permitted while an existing one for that employee remains in any status other than closed.
    eligibility: []
    params:
      max_per_customer: 1

  - id: corp_tier_pricing
    subject: [corp_dues_billed, corp_tier_changed]
    rule: >
      Each billing cycle the employer's master account is billed monthly_dues_per_employee_usd for the enrolled employee, and the employee's bundled club membership dues receive employer_discount_pct off, capped at corporate_wellness_discount_max_stack_pct when discount_stacking_allowed lets it combine with another membership promotion.
    eligibility: []
    params:
      per_tier:
        Startup Partner: {monthly_dues_per_employee_usd: "=monthly_dues_per_employee_usd", employer_discount_pct: "=employer_discount_pct"}
        Small Business Partner: {monthly_dues_per_employee_usd: "=monthly_dues_per_employee_usd", employer_discount_pct: "=employer_discount_pct"}
        Mid-Market Partner: {monthly_dues_per_employee_usd: "=monthly_dues_per_employee_usd", employer_discount_pct: "=employer_discount_pct"}
        Enterprise Partner: {monthly_dues_per_employee_usd: "=monthly_dues_per_employee_usd", employer_discount_pct: "=employer_discount_pct"}
        Municipal Partner: {monthly_dues_per_employee_usd: "=monthly_dues_per_employee_usd", employer_discount_pct: "=employer_discount_pct"}
        Nonprofit Partner: {monthly_dues_per_employee_usd: "=monthly_dues_per_employee_usd", employer_discount_pct: "=employer_discount_pct"}

  - id: corp_enrollment_verification
    subject: [corp_enrollment_activated]
    rule: >
      An enrollment may be activated only after proof of employment matching one of proof_of_employment_types is provided within enrollment_grace_period_days of the application; the enrollment record itself, once its status shows active, is the system evidence that this verification was completed.
    eligibility:
      - id: activation_requires_created_enrollment
        applies_to: [corp_enrollment_activated]
        kind: authorization
        condition: An enrollment may be activated only after proof of employment matching one of proof_of_employment_types is provided within enrollment_grace_period_days of the application
        evidence_fields: [corporate_wellness_enrollments.enrollment_id, corporate_wellness_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[corporate_wellness_enrollments.enrollment_id]]
          action_bindings: {corporate_wellness_enrollments.enrollment_id: enrollment_id}
    params:
      per_tier:
        Startup Partner: {enrollment_grace_period_days: "=enrollment_grace_period_days"}
        Small Business Partner: {enrollment_grace_period_days: "=enrollment_grace_period_days"}
        Mid-Market Partner: {enrollment_grace_period_days: "=enrollment_grace_period_days"}
        Enterprise Partner: {enrollment_grace_period_days: "=enrollment_grace_period_days"}
        Municipal Partner: {enrollment_grace_period_days: "=enrollment_grace_period_days"}
        Nonprofit Partner: {enrollment_grace_period_days: "=enrollment_grace_period_days"}

  - id: corp_billing_and_suspension
    subject: [corp_enrollment_suspended, corp_dues_billed, corp_enrollment_reinstated]
    rule: >
      An enrollment is suspended once the employer's master account has missed suspension_after_missed_payments consecutive billing cycles, when auto_suspend_on_employer_nonpayment applies; a late_payment_fee_usd is added to the employer's master account after late_payment_grace_days of a missed payment. Dues continue to be billed while an enrollment is suspended so the employer's master account reflects the true amount owed.
    eligibility: []
    params:
      per_tier:
        Startup Partner: {suspension_after_missed_payments: "=suspension_after_missed_payments", late_payment_grace_days: "=late_payment_grace_days", late_payment_fee_usd: "=late_payment_fee_usd"}
        Small Business Partner: {suspension_after_missed_payments: "=suspension_after_missed_payments", late_payment_grace_days: "=late_payment_grace_days", late_payment_fee_usd: "=late_payment_fee_usd"}
        Mid-Market Partner: {suspension_after_missed_payments: "=suspension_after_missed_payments", late_payment_grace_days: "=late_payment_grace_days", late_payment_fee_usd: "=late_payment_fee_usd"}
        Enterprise Partner: {suspension_after_missed_payments: "=suspension_after_missed_payments", late_payment_grace_days: "=late_payment_grace_days", late_payment_fee_usd: "=late_payment_fee_usd"}
        Municipal Partner: {suspension_after_missed_payments: "=suspension_after_missed_payments", late_payment_grace_days: "=late_payment_grace_days", late_payment_fee_usd: "=late_payment_fee_usd"}
        Nonprofit Partner: {suspension_after_missed_payments: "=suspension_after_missed_payments", late_payment_grace_days: "=late_payment_grace_days", late_payment_fee_usd: "=late_payment_fee_usd"}

  - id: corp_dues_waiver_policy
    subject: [corp_dues_waived, corp_dues_payment_received]
    rule: Staff may waive a billed amount only while the enrollment is active or suspended.
    eligibility:
      - id: waiver_requires_open_enrollment
        applies_to: [corp_dues_waived]
        kind: state
        condition: Staff may waive a billed amount only while the enrollment is active or suspended.
        evidence_fields: [corporate_wellness_enrollments.enrollment_id, corporate_wellness_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[corporate_wellness_enrollments.enrollment_id]]
          action_bindings: {corporate_wellness_enrollments.enrollment_id: enrollment_id}
        state_contract:
          field: corporate_wellness_enrollments.status
          allowed: [active, suspended]
    params: {}

  - id: corp_membership_bundling_requirement
    subject: [corp_enrollment_created]
    rule: >
      A corporate wellness enrollment may be created only for an employee who already holds a club membership at or above minimum_membership_tier_required; the enrollment's discount is bundled onto that existing membership and cannot be created for someone with no membership on file.
    eligibility:
      - id: enrollment_requires_existing_membership
        applies_to: [corp_enrollment_created]
        kind: state
        condition: A corporate wellness enrollment may be created only for an employee who already holds a club membership at or above minimum_membership_tier_required
        evidence_fields: [membership_holdings.status, membership_holdings.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_holdings.customer_id]]
          action_bindings: {membership_holdings.customer_id: customer_id}
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    params:
      per_tier:
        Startup Partner: {minimum_membership_tier_required: "=minimum_membership_tier_required"}
        Small Business Partner: {minimum_membership_tier_required: "=minimum_membership_tier_required"}
        Mid-Market Partner: {minimum_membership_tier_required: "=minimum_membership_tier_required"}
        Enterprise Partner: {minimum_membership_tier_required: "=minimum_membership_tier_required"}
        Municipal Partner: {minimum_membership_tier_required: "=minimum_membership_tier_required"}
        Nonprofit Partner: {minimum_membership_tier_required: "=minimum_membership_tier_required"}

  - id: corp_re_enrollment_cooldown
    subject: [corp_enrollment_created]
    rule: >
      An employee whose prior corporate wellness enrollment was closed may re-enroll only when re_enrollment_allowed_after_removal is true for the new tier, and only once re_enrollment_cooldown_days have elapsed since the customer gives notice of this re-enrollment, counted as full calendar days from the prior enrollment's closed_date with no partial-day rounding; frozen_time must not be earlier than that anchor plus re_enrollment_cooldown_days.
    eligibility:
      - id: cooldown_elapsed
        applies_to: [corp_enrollment_created]
        kind: time
        condition: only once re_enrollment_cooldown_days have elapsed since the customer gives notice of this re-enrollment, counted as full calendar days from the prior enrollment's closed_date with no partial-day rounding
        evidence_fields: [corporate_wellness_enrollments.closed_date, corporate_wellness_enrollments.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[corporate_wellness_enrollments.customer_id]]
          action_bindings: {corporate_wellness_enrollments.customer_id: customer_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the customer gives notice of this re-enrollment
          anchor_source: corporate_wellness_enrollments.closed_date
          relation: not_before
          duration_source: variants.re_enrollment_cooldown_days
          unit: calendar_days
          counting_rule: counted as full calendar days from the prior enrollment's closed_date with no partial-day rounding
          boundary: inclusive
    params:
      per_tier:
        Startup Partner: {re_enrollment_cooldown_days: "=re_enrollment_cooldown_days"}
        Small Business Partner: {re_enrollment_cooldown_days: "=re_enrollment_cooldown_days"}
        Mid-Market Partner: {re_enrollment_cooldown_days: "=re_enrollment_cooldown_days"}
        Enterprise Partner: {re_enrollment_cooldown_days: "=re_enrollment_cooldown_days"}
        Municipal Partner: {re_enrollment_cooldown_days: "=re_enrollment_cooldown_days"}
        Nonprofit Partner: {re_enrollment_cooldown_days: "=re_enrollment_cooldown_days"}

  - id: corp_employer_size_tier_gate
    subject: [corp_enrollment_created]
    rule: >
      Enrollment into the Nonprofit Partner tier requires documented 501(c) nonprofit status when nonprofit_documentation_required applies, and enrollment into the Municipal Partner tier requires a government contract reference number when municipal_contract_reference_required applies; both are verified against employer_size_verification_basis of documented rather than self-reported.
    eligibility: []
    params:
      per_tier:
        Startup Partner: {employer_size_verification_basis: "=employer_size_verification_basis"}
        Small Business Partner: {employer_size_verification_basis: "=employer_size_verification_basis"}
        Mid-Market Partner: {employer_size_verification_basis: "=employer_size_verification_basis"}
        Enterprise Partner: {employer_size_verification_basis: "=employer_size_verification_basis"}
        Municipal Partner: {employer_size_verification_basis: "=employer_size_verification_basis"}
        Nonprofit Partner: {employer_size_verification_basis: "=employer_size_verification_basis"}

  - id: corp_guest_pass_allotment
    subject: [corp_enrollment_created]
    rule: >
      An active enrollment's employer may sponsor up to corporate_guest_pass_allotment_per_month Corporate Guest Pass day passes per month at no charge to the employee; a sponsored pass beyond that allotment in the same month is charged corporate_guest_pass_fee_usd.
    eligibility: []
    params:
      per_tier:
        Startup Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}
        Small Business Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}
        Mid-Market Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}
        Enterprise Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}
        Municipal Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}
        Nonprofit Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}
