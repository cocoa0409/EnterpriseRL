category: corp
display_name: Corporate Wellness Partnership

binding:
  holding_table: corporate_wellness_enrollments
  event_tables: [corporate_wellness_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {corporate_dues_balance: corporate_dues_account}

lifecycle:
  states: [applied, active, suspended, closed]
  transitions:
    - {from: applied, to: active, by: agent, means: employment/eligibility is verified and the first bill is run}
    - {from: active, to: suspended, by: system, means: the employer's master account misses enough payments}
    - {from: suspended, to: active, by: agent, means: the employer's master account is brought current}
    - {from: active, to: closed, by: agent, means: the employee is removed from the corporate roster or the employer partnership ends}
    - {from: suspended, to: closed, by: agent, means: a suspended enrollment is closed rather than reinstated}

accounts:
  - key: corporate_dues_account
    unit: USD
    meaning: net amount currently billed to the employer's master account for this employee's enrollment (positive = owed); billing increases it, payments and waivers decrease it

parameter_schema:
  monthly_dues_per_employee_usd: recurring monthly amount billed to the employer per enrolled employee, USD
  employer_discount_pct: discount off the employee's bundled club membership dues, percent
  minimum_enrolled_employees: minimum employees the employer must enroll to hold this partnership tier, count
  maximum_enrolled_employees: maximum employees the employer may enroll under this tier, count (0 = unlimited)
  enrollment_verification_required: boolean — whether proof of employment must be verified before activation
  enrollment_grace_period_days: days allowed to submit proof of employment before activation lapses, days
  annual_contract_review_required: boolean — whether the employer partnership is reviewed annually
  contract_term_months: length of the employer partnership contract term, months
  early_termination_notice_days: notice the employer must give to end the partnership early, calendar days
  employee_removal_notice_days: notice given to an employee before their enrollment is removed, calendar days
  dues_billing_cycle_day: day of the month the employer's master account is billed, day-of-month
  late_payment_grace_days: days the employer's master account may remain unpaid before suspension, calendar days
  late_payment_fee_usd: flat fee charged to the employer's master account for a late payment, USD
  suspension_after_missed_payments: consecutive missed billing cycles that trigger suspension, count
  reinstatement_fee_usd: fee charged to reinstate a suspended enrollment, USD
  dependent_addon_eligible: boolean — whether this enrollment's employee may also hold household add-ons at the bundled discount
  wellness_reimbursement_annual_cap_usd: annual cap on employer wellness-reimbursement toward dues, USD
  wellness_reimbursement_pct: percentage of dues reimbursed by the employer up to the annual cap, percent
  onboarding_fee_waived: boolean — whether the club's standard membership enrollment fee is waived for this tier
  minimum_membership_tier_required: minimum club membership tier ladder rank the employee must hold to bundle this enrollment, count
  hr_portal_access_included: boolean — whether the employer gets HR portal access for roster management
  usage_reporting_provided: boolean — whether aggregate usage reports are provided to the employer
  usage_reporting_frequency_days: how often usage reports are generated, days
  multi_location_discount_pct: extra discount for an employer with multiple business locations enrolling above the threshold, percent
  multi_location_employee_threshold: enrolled-employee count above which the multi-location discount applies, count
  seasonal_promo_discount_pct: discount applied during promotional periods, percent
  dues_price_lock_months: months the per-employee rate is locked against increases, months
  dues_price_increase_notice_days: notice required before a per-employee rate increase takes effect, calendar days
  proof_of_employment_required: boolean — whether documented proof of employment is required at enrollment
  proof_of_employment_types: list of accepted proof types, e.g. [paystub, employee_id_card, hr_letter]
  re_enrollment_allowed_after_removal: boolean — whether a removed employee may re-enroll later
  re_enrollment_cooldown_days: days a removed employee must wait before re-enrolling, calendar days
  corporate_guest_pass_allotment_per_month: complimentary day passes the employer may sponsor per month, count
  corporate_guest_pass_fee_usd: fee per sponsored guest pass beyond the monthly allotment, USD
  employer_invoice_delivery_method: enum(email|mail|portal) — how the employer's master invoice is delivered
  employer_invoice_net_days: payment terms on the employer's master invoice, days
  auto_suspend_on_employer_nonpayment: boolean — whether enrollments auto-suspend when the employer's master account defaults
  employee_notice_before_suspension_days: notice given to the employee before their enrollment is suspended for employer nonpayment, calendar days
  discount_stacking_allowed: boolean — whether this tier's employer_discount_pct may stack with other membership promotions
  corporate_wellness_discount_max_stack_pct: cap on the combined discount percentage when stacking is allowed, percent
  minimum_contract_value_usd: minimum total monthly contract value required for this tier, USD
  dedicated_account_manager_included: boolean — whether a dedicated account manager is assigned to the employer
  wellness_challenge_participation_included: boolean — whether enrolled employees are entered into chain-wide wellness challenges
  biometric_screening_included: boolean — whether a complimentary biometric screening is included
  biometric_screening_annual_frequency: complimentary screenings included per year, count
  employer_size_verification_basis: enum(self_attested|documented) — how the employer's headcount for this tier is verified
  nonprofit_documentation_required: boolean — whether 501(c) documentation is required for this tier
  municipal_contract_reference_required: boolean — whether a government contract reference number is required for this tier
  tier_upgrade_effective_timing: enum(immediate|next_cycle) — when moving to a higher partnership tier takes effect
  tier_downgrade_effective_timing: enum(immediate|next_cycle) — when moving to a lower partnership tier takes effect

