events:
  - type: day_pass_purchased
    target: day_pass_holdings
    mutation: create
    meaning: a visitor purchases a day or trial pass
    grain: one row per pass
    fields: {day_pass_id: primary reference of the pass, customer_id: the purchasing visitor, variant_name: the tier chosen, status: lifecycle state, club_id: the club purchased at, valid_from_date: first usable date, valid_until_date: last usable date, opened_date: date purchased, visits_remaining: visits granted at purchase}
    account: day_pass_visit_account
    direction: in
    triggers:
      - event: day:day_pass_activated
        map: {day_pass_id: day_pass_id, customer_id: customer_id}
  - type: day_pass_activated
    target: day_pass_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: the purchase payment is captured and the pass becomes usable
    grain: one row per activation
    fields: {day_pass_id: the pass activated, customer_id: the visitor, status: lifecycle state}
    triggers: []
  - type: day_pass_lapsed
    target: day_pass_holdings
    mutation: {transition: {from: active, to: expired}}
    meaning: the validity window elapses
    grain: one row per pass that lapses
    fields: {day_pass_id: the pass that lapsed, customer_id: the visitor, status: lifecycle state}
    triggers:
      - event: day:day_expired_forfeit
        map: {day_pass_id: day_pass_id, customer_id: customer_id}
  - type: day_pass_cancelled
    target: day_pass_holdings
    mutation: {transition: {from: active, to: closed}}
    meaning: the visitor confirms cancellation and takes a refund before the pass is used
    grain: one row per cancellation
    fields: {day_pass_id: the pass cancelled, customer_id: the visitor, status: lifecycle state, closed_date: the date cancelled}
    triggers:
      - event: day:day_refunded
        map: {day_pass_id: day_pass_id, customer_id: customer_id}
  - type: day_pass_converted
    target: day_pass_holdings
    mutation: {transition: {from: active, to: closed}}
    meaning: the visitor signs up for a club membership and the pass converts into that membership
    grain: one row per conversion
    fields: {day_pass_id: the pass converted, customer_id: the visitor, status: lifecycle state, closed_date: the date converted}
    triggers:
      - event: membership:membership_signup
        map: {customer_id: customer_id}
  - type: day_pass_archived
    target: day_pass_holdings
    mutation: {transition: {from: expired, to: closed}}
    meaning: an expired pass is administratively archived
    grain: one row per archival
    fields: {day_pass_id: the pass archived, customer_id: the visitor, status: lifecycle state, closed_date: the date archived}
    triggers: []
  - type: day_visit_used
    target: day_pass_events
    meaning: the visitor checks in and uses a visit on the pass
    grain: one row per visit
    distinguish_by: [club_id, event_timestamp]
    account: day_pass_visit_account
    direction: out
    fields: {event_id: primary reference of the row, day_pass_id: the pass used, customer_id: the visitor, event_type: the ledger event, event_timestamp: moment recorded, visits_delta: visits consumed, amount_usd: always 0.00, club_id: the club visited}
    triggers: []
  - type: day_expired_forfeit
    target: day_pass_events
    meaning: unused visits on a lapsed pass are forfeited at expiration
    grain: one row per expiration forfeiture
    distinguish_by: [event_timestamp]
    account: day_pass_visit_account
    direction: out
    fields: {event_id: primary reference of the row, day_pass_id: the pass that expired, customer_id: the visitor, event_type: the ledger event, event_timestamp: moment recorded, visits_delta: visits forfeited, amount_usd: always 0.00, club_id: blank}
    triggers: []
  - type: day_refunded
    target: day_pass_events
    meaning: the purchase price of a cancelled pass is refunded
    grain: one row per refund
    distinguish_by: [event_timestamp]
    account: day_pass_visit_account
    direction: out
    fields: {event_id: primary reference of the row, day_pass_id: the pass refunded, customer_id: the visitor, event_type: the ledger event, event_timestamp: moment recorded, visits_delta: visits removed from the balance, amount_usd: the dollar amount refunded, club_id: blank}
    triggers: []
  - type: day_extended
    target: day_pass_events
    meaning: staff extend the pass's validity window and grant any additional visits that come with the extension
    grain: one row per extension
    distinguish_by: [event_timestamp]
    account: day_pass_visit_account
    direction: in
    fields: {event_id: primary reference of the row, day_pass_id: the pass extended, customer_id: the visitor, event_type: the ledger event, event_timestamp: moment recorded, visits_delta: visits added, amount_usd: the extension fee charged, club_id: blank}
    triggers: []

measures:
  - id: day_msr_trial_passes_last_12mo
    window: rolling max_passes_rolling_year_window_days ending at frozen_time (365 days for most tiers)
    measure: count of day_pass_holdings rows opened for the customer_id within the window

policies:
  - id: day_agg_multi_holding
    subject: [day_pass_purchased]
    rule: A visitor may hold any number of day/trial passes open over time, up to max_passes_per_rolling_year of a given tier in the rolling window when that cap is set above zero; a value of zero means no per-tier cap applies to that tier.
    eligibility: []
    params:
      max_per_customer: null

  - id: day_agg_trial_abuse_prevention
    subject: [day_pass_purchased]
    rule: >
      A tier with max_passes_per_rolling_year set above zero may not be purchased again by the same visitor once they already hold max_passes_per_rolling_year or more day_pass_holdings rows of that tier opened in the trailing max_passes_rolling_year_window_days ending at frozen_time.
    eligibility: []
    measures: [day_msr_trial_passes_last_12mo]
    params:
      per_tier:
        Single Day Pass: {max_passes_per_rolling_year: "=max_passes_per_rolling_year", max_passes_rolling_year_window_days: "=max_passes_rolling_year_window_days"}
        Three-Day Trial Pass: {max_passes_per_rolling_year: "=max_passes_per_rolling_year", max_passes_rolling_year_window_days: "=max_passes_rolling_year_window_days"}
        Seven-Day Trial Pass: {max_passes_per_rolling_year: "=max_passes_per_rolling_year", max_passes_rolling_year_window_days: "=max_passes_rolling_year_window_days"}
        Weekly Visitor Pass: {max_passes_per_rolling_year: "=max_passes_per_rolling_year", max_passes_rolling_year_window_days: "=max_passes_rolling_year_window_days"}
        Monthly Trial Pass: {max_passes_per_rolling_year: "=max_passes_per_rolling_year", max_passes_rolling_year_window_days: "=max_passes_rolling_year_window_days"}
        Corporate Guest Pass: {max_passes_per_rolling_year: "=max_passes_per_rolling_year", max_passes_rolling_year_window_days: "=max_passes_rolling_year_window_days"}

  - id: day_tier_pricing
    subject: [day_pass_purchased, day_pass_activated]
    rule: >
      At purchase, the pass is priced at the tier's price_usd (less guest_of_member_discount_pct when a current member sponsors and, if guest_of_member_requires_member_present applies, checks in at the same visit; or less group_purchase_discount_pct when group_purchase_min_quantity or more passes of the same tier are purchased in the same transaction, taking whichever single discount is higher rather than stacking them), grants visits_included visits (or unlimited use within validity_days when visits_included is -1), and sets valid_until_date to valid_from_date plus validity_days calendar days.
    eligibility: []
    params:
      per_tier:
        Single Day Pass: {price_usd: "=price_usd", visits_included: "=visits_included", validity_days: "=validity_days"}
        Three-Day Trial Pass: {price_usd: "=price_usd", visits_included: "=visits_included", validity_days: "=validity_days"}
        Seven-Day Trial Pass: {price_usd: "=price_usd", visits_included: "=visits_included", validity_days: "=validity_days"}
        Weekly Visitor Pass: {price_usd: "=price_usd", visits_included: "=visits_included", validity_days: "=validity_days"}
        Monthly Trial Pass: {price_usd: "=price_usd", visits_included: "=visits_included", validity_days: "=validity_days"}
        Corporate Guest Pass: {price_usd: "=price_usd", visits_included: "=visits_included", validity_days: "=validity_days"}

  - id: day_visit_usage_eligibility
    subject: [day_visit_used]
    rule: A visit may be recorded only while the pass is active, and no more than daily_visit_limit visits count toward usage in a single calendar day.
    eligibility:
      - id: visit_requires_active_pass
        applies_to: [day_visit_used]
        kind: state
        condition: A visit may be recorded only while the pass is active
        evidence_fields: [day_pass_holdings.day_pass_id, day_pass_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[day_pass_holdings.day_pass_id]]
          action_bindings: {day_pass_holdings.day_pass_id: day_pass_id}
        state_contract:
          field: day_pass_holdings.status
          allowed: [active]
    params:
      per_tier:
        Single Day Pass: {daily_visit_limit: "=daily_visit_limit"}
        Three-Day Trial Pass: {daily_visit_limit: "=daily_visit_limit"}
        Seven-Day Trial Pass: {daily_visit_limit: "=daily_visit_limit"}
        Weekly Visitor Pass: {daily_visit_limit: "=daily_visit_limit"}
        Monthly Trial Pass: {daily_visit_limit: "=daily_visit_limit"}
        Corporate Guest Pass: {daily_visit_limit: "=daily_visit_limit"}

  - id: day_refund_policy
    subject: [day_refunded, day_pass_cancelled]
    rule: >
      A refund may be recorded only while the pass is active, or in the same moment as its confirmed cancellation to closed, and only when refund_allowed_if_used applies or no visit has yet been used, and only when requested before refund_window_hours have elapsed since the pass was purchased, counted as elapsed hours from opened_date with no rounding down; frozen_time must not be later than opened_date plus refund_window_hours for the refund to be recorded.
    eligibility:
      - id: refund_requires_open_or_just_closed_pass
        applies_to: [day_refunded]
        kind: state
        condition: A refund may be recorded only while the pass is active, or in the same moment as its confirmed cancellation to closed
        evidence_fields: [day_pass_holdings.day_pass_id, day_pass_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[day_pass_holdings.day_pass_id]]
          action_bindings: {day_pass_holdings.day_pass_id: day_pass_id}
        state_contract:
          field: day_pass_holdings.status
          allowed: [active, closed]
      - id: refund_within_window
        applies_to: [day_refunded]
        kind: time
        condition: only when requested before refund_window_hours have elapsed since the pass was purchased, counted as elapsed hours from opened_date with no rounding down
        evidence_fields: [day_pass_holdings.day_pass_id, day_pass_holdings.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[day_pass_holdings.day_pass_id]]
          action_bindings: {day_pass_holdings.day_pass_id: day_pass_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the pass was purchased
          anchor_source: day_pass_holdings.opened_date
          relation: not_after
          duration_source: variants.refund_window_hours
          unit: elapsed_hours
          counting_rule: counted as elapsed hours from opened_date with no rounding down
          boundary: inclusive
    params:
      per_tier:
        Single Day Pass: {refund_window_hours: "=refund_window_hours", refund_pct: "=refund_pct"}
        Three-Day Trial Pass: {refund_window_hours: "=refund_window_hours", refund_pct: "=refund_pct"}
        Seven-Day Trial Pass: {refund_window_hours: "=refund_window_hours", refund_pct: "=refund_pct"}
        Weekly Visitor Pass: {refund_window_hours: "=refund_window_hours", refund_pct: "=refund_pct"}
        Monthly Trial Pass: {refund_window_hours: "=refund_window_hours", refund_pct: "=refund_pct"}
        Corporate Guest Pass: {refund_window_hours: "=refund_window_hours", refund_pct: "=refund_pct"}

  - id: day_conversion_to_membership_policy
    subject: [day_pass_converted]
    rule: >
      Converting to a club membership within conversion_window_days of when the pass was purchased earns conversion_to_membership_discount_usd credited toward the new membership's enrollment_fee_usd, counted as full calendar days from opened_date with no partial-day rounding; frozen_time must not be later than opened_date plus conversion_window_days for the credit to apply.
    eligibility:
      - id: conversion_within_window
        applies_to: [day_pass_converted]
        kind: time
        condition: Converting to a club membership within conversion_window_days of when the pass was purchased earns conversion_to_membership_discount_usd credited toward the new membership's enrollment_fee_usd, counted as full calendar days from opened_date with no partial-day rounding
        evidence_fields: [day_pass_holdings.day_pass_id, day_pass_holdings.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[day_pass_holdings.day_pass_id]]
          action_bindings: {day_pass_holdings.day_pass_id: day_pass_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the pass was purchased
          anchor_source: day_pass_holdings.opened_date
          relation: not_after
          duration_source: variants.conversion_window_days
          unit: calendar_days
          counting_rule: counted as full calendar days from opened_date with no partial-day rounding
          boundary: inclusive
    params:
      per_tier:
        Single Day Pass: {conversion_window_days: "=conversion_window_days", conversion_to_membership_discount_usd: "=conversion_to_membership_discount_usd"}
        Three-Day Trial Pass: {conversion_window_days: "=conversion_window_days", conversion_to_membership_discount_usd: "=conversion_to_membership_discount_usd"}
        Seven-Day Trial Pass: {conversion_window_days: "=conversion_window_days", conversion_to_membership_discount_usd: "=conversion_to_membership_discount_usd"}
        Weekly Visitor Pass: {conversion_window_days: "=conversion_window_days", conversion_to_membership_discount_usd: "=conversion_to_membership_discount_usd"}
        Monthly Trial Pass: {conversion_window_days: "=conversion_window_days", conversion_to_membership_discount_usd: "=conversion_to_membership_discount_usd"}
        Corporate Guest Pass: {conversion_window_days: "=conversion_window_days", conversion_to_membership_discount_usd: "=conversion_to_membership_discount_usd"}

  - id: day_corporate_sponsorship_requirement
    subject: [day_pass_purchased]
    rule: >
      A Corporate Guest Pass may be purchased only under an employer's corporate wellness enrollment that is active, identified by the same employer_account_id recorded on sponsor_employer_account_id; a pass purchased beyond corporate_sponsor_allotment_per_month for that employer in the same month is charged corporate_guest_fee_if_over_allotment_usd.
    eligibility:
      - id: corporate_pass_requires_active_sponsor
        applies_to: [day_pass_purchased]
        kind: state
        condition: A Corporate Guest Pass may be purchased only under an employer's corporate wellness enrollment that is active, identified by the same employer_account_id recorded on sponsor_employer_account_id
        evidence_fields: [corporate_wellness_enrollments.status, corporate_wellness_enrollments.employer_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[corporate_wellness_enrollments.employer_account_id]]
          action_bindings: {corporate_wellness_enrollments.employer_account_id: sponsor_employer_account_id}
        state_contract:
          field: corporate_wellness_enrollments.status
          allowed: [active]
    params:
      per_tier:
        Single Day Pass: {corporate_sponsor_required: "=corporate_sponsor_required"}
        Three-Day Trial Pass: {corporate_sponsor_required: "=corporate_sponsor_required"}
        Seven-Day Trial Pass: {corporate_sponsor_required: "=corporate_sponsor_required"}
        Weekly Visitor Pass: {corporate_sponsor_required: "=corporate_sponsor_required"}
        Monthly Trial Pass: {corporate_sponsor_required: "=corporate_sponsor_required"}
        Corporate Guest Pass: {corporate_sponsor_required: "=corporate_sponsor_required"}

  - id: day_expiration_policy
    subject: [day_pass_lapsed, day_expired_forfeit, day_pass_archived]
    rule: >
      A pass lapses and any unused visits are forfeited once frozen_time is not before valid_from_date (the date the pass's validity window began) plus validity_days calendar days, counted as full calendar days with no partial-day rounding; a lapsed pass is administratively archived afterward.
    eligibility:
      - id: validity_window_elapsed
        applies_to: [day_pass_lapsed]
        kind: time
        condition: A pass lapses and any unused visits are forfeited once frozen_time is not before valid_from_date (the date the pass's validity window began) plus validity_days calendar days, counted as full calendar days with no partial-day rounding
        evidence_fields: [day_pass_holdings.day_pass_id, day_pass_holdings.valid_from_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[day_pass_holdings.day_pass_id]]
          action_bindings: {day_pass_holdings.day_pass_id: day_pass_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the pass's validity window began
          anchor_source: day_pass_holdings.valid_from_date
          relation: not_before
          duration_source: variants.validity_days
          unit: calendar_days
          counting_rule: counted as full calendar days with no partial-day rounding
          boundary: inclusive
    params:
      per_tier:
        Single Day Pass: {validity_days: "=validity_days"}
        Three-Day Trial Pass: {validity_days: "=validity_days"}
        Seven-Day Trial Pass: {validity_days: "=validity_days"}
        Weekly Visitor Pass: {validity_days: "=validity_days"}
        Monthly Trial Pass: {validity_days: "=validity_days"}
        Corporate Guest Pass: {validity_days: "=validity_days"}

  - id: day_extension_policy
    subject: [day_extended]
    rule: >
      Staff may extend a pass's validity by up to extension_max_days for extension_fee_usd, or at no charge under weather_policy_extension_allowed for up to weather_policy_extension_days when the club was closed for weather or an emergency during the pass's original validity window.
    eligibility: []
    params:
      per_tier:
        Single Day Pass: {extension_max_days: "=extension_max_days", extension_fee_usd: "=extension_fee_usd"}
        Three-Day Trial Pass: {extension_max_days: "=extension_max_days", extension_fee_usd: "=extension_fee_usd"}
        Seven-Day Trial Pass: {extension_max_days: "=extension_max_days", extension_fee_usd: "=extension_fee_usd"}
