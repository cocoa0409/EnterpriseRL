        Monthly Trial Pass: {extension_max_days: "=extension_max_days", extension_fee_usd: "=extension_fee_usd"}
        Corporate Guest Pass: {extension_max_days: "=extension_max_days", extension_fee_usd: "=extension_fee_usd"}
