category: day
display_name: Day and Trial Passes

binding:
  holding_table: day_pass_holdings
  event_tables: [day_pass_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {visits_remaining: day_pass_visit_account}

lifecycle:
  states: [applied, active, expired, closed]
  transitions:
    - {from: applied, to: active, by: agent, means: the purchase payment is captured and the pass activates}
    - {from: active, to: expired, by: system, means: the validity window elapses}
    - {from: active, to: closed, by: user, means: the visitor confirms cancellation and takes a refund before the pass is used}
    - {from: active, to: closed, by: system, means: the visitor signs up for a club membership and the pass converts into that membership}
    - {from: expired, to: closed, by: agent, means: an expired pass is administratively archived}

accounts:
  - key: day_pass_visit_account
    unit: visits
    meaning: visits currently available on the pass; the initial grant and any extension increase it, visits used, expiration forfeitures and refunds decrease it

parameter_schema:
  price_usd: purchase price of the pass, USD
  visits_included: visits granted by the pass, count (-1 denotes unlimited visits within validity_days)
  validity_days: days from purchase during which the pass may be used
  membership_required: boolean — whether an active club membership is required to purchase this tier (false for ordinary walk-in passes)
  minimum_signup_age_years: minimum age to purchase without guardian consent, years
  guardian_consent_required_under_age: boolean — whether guardian consent is required under minimum_signup_age_years
  refund_window_hours: hours after purchase within which an unused pass may be refunded
  refund_pct: percentage of the purchase price refunded on an eligible cancellation, percent
  refund_allowed_if_used: boolean — whether a refund may still be requested after the first visit is used
  conversion_to_membership_discount_usd: bill credit applied toward a new membership's enrollment_fee_usd when converting within conversion_window_days, USD
  conversion_window_days: days after purchase within which converting to a membership earns the conversion discount
  max_passes_per_rolling_year: maximum passes of this tier a visitor may purchase in the rolling window, count (0 = unlimited)
  max_passes_rolling_year_window_days: length of the rolling window used to count prior passes, days
  id_required_at_checkin: boolean — whether photo id must be shown at check-in
  guest_of_member_discount_pct: discount off price_usd when sponsored by a current member who is present, percent
  guest_of_member_requires_member_present: boolean — whether the sponsoring member must check in at the same visit
  corporate_sponsor_required: boolean — whether an active corporate wellness enrollment must sponsor this tier
  corporate_sponsor_allotment_per_month: complimentary passes of this tier the sponsor's employer may cover per month, count
  extension_fee_usd: fee to extend the pass's validity, USD
  extension_max_days: maximum days an extension may add, days
  blackout_dates_apply: boolean — whether the pass is unusable on published holiday blackout dates
  class_access_included: boolean — whether standard group fitness classes are included
  locker_included: boolean — whether a day-use locker is included at no extra charge
  locker_deposit_usd: refundable deposit for the included locker, USD
  towel_rental_fee_usd: fee to rent a towel for the visit, USD
  amenity_access_pool: boolean — whether pool access is included where the club has one
  amenity_access_sauna: boolean — whether sauna access is included
  peak_hours_restricted: boolean — whether use is restricted outside peak hours
  peak_hours_window: structured {start, end} describing the peak-hours access window
  walk_in_allowed: boolean — whether the pass may be purchased and used the same day without advance booking
  advance_purchase_required: boolean — whether the pass must be purchased in advance of the visit
  advance_purchase_window_hours: minimum hours of advance purchase required, hours (0 if walk_in_allowed)
  price_increase_notice_days: notice required before a price increase takes effect, calendar days
  seasonal_promo_discount_pct: discount applied during promotional periods, percent
  multi_visit_punch_card: boolean — whether the pass tracks a fixed number of visits rather than unlimited use
  daily_visit_limit: maximum visits counted toward usage per calendar day, count
  transferable_to_other_person: boolean — whether the pass may be used by someone other than the purchaser
  transfer_fee_usd: fee to transfer the pass to another person, USD
  cancellation_allowed_before_valid_from: boolean — whether the pass may be cancelled before its validity window begins
  cancellation_fee_usd: flat fee retained on an eligible cancellation, USD
  proof_of_identity_required: boolean — whether a government photo id is required to purchase
  minimum_notice_for_corporate_sponsorship_hours: hours of advance notice the sponsoring employer must give for this tier, hours
  corporate_guest_fee_if_over_allotment_usd: fee charged when a corporate-sponsored pass exceeds the sponsor's monthly allotment, USD
  loyalty_stamp_eligible: boolean — whether this tier's visits count toward the chain's loyalty program
  loyalty_stamps_per_visit: loyalty stamps earned per visit, count
  weather_policy_extension_allowed: boolean — whether validity is extended when the club is closed for weather/emergency
  weather_policy_extension_days: days added under the weather policy extension, days
  group_purchase_discount_pct: discount for purchasing several passes at once, percent
  group_purchase_min_quantity: minimum passes purchased at once to qualify for the group discount, count
  price_lock_months: months this tier's price is locked against increases, months

