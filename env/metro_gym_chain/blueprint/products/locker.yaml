  - id: locker_past_due_closure
    subject: [locker_rental_closed_administratively, locker_marked_past_due, locker_reinstated]
    rule: >
      A past_due rental may be administratively closed only once past_due_grace_period_days have elapsed since the rental was marked past due, counted as full calendar days with no partial-day rounding; frozen_time must not be earlier than that anchor plus past_due_grace_period_days.
    eligibility:
      - id: grace_period_elapsed
        applies_to: [locker_rental_closed_administratively]
        kind: authorization
        condition: A past_due rental may be administratively closed only once past_due_grace_period_days have elapsed since the rental was marked past due, counted as full calendar days with no partial-day rounding
        evidence_fields: [locker_rental_holdings.locker_rental_id, locker_rental_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[locker_rental_holdings.locker_rental_id]]
          action_bindings: {locker_rental_holdings.locker_rental_id: locker_rental_id}
    params:
