events:
  - type: locker_rental_created
    target: locker_rental_holdings
    mutation: create
    meaning: a member rents a locker
    grain: one row per rental
    fields: {locker_rental_id: primary reference of the rental, customer_id: the renting member, variant_name: the tier chosen, status: lifecycle state, club_id: the club the locker is at, locker_number: the physical locker assigned, opened_date: date rented}
    triggers:
      - event: locker:locker_rental_activated
        map: {locker_rental_id: locker_rental_id, customer_id: customer_id}
  - type: locker_rental_activated
    target: locker_rental_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: the initial fee is captured and the locker is assigned
    grain: one row per activation
    fields: {locker_rental_id: the rental activated, customer_id: the member, status: lifecycle state}
    triggers:
      - event: locker:locker_fee_charged
        map: {locker_rental_id: locker_rental_id, customer_id: customer_id, charge_type: monthly_fee}
  - type: locker_marked_past_due
    target: locker_rental_holdings
    mutation: {transition: {from: active, to: past_due}}
    meaning: a scheduled monthly fee fails to collect
    grain: one row per past-due marking
    fields: {locker_rental_id: the rental marked, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: locker_reinstated
    target: locker_rental_holdings
    mutation: {transition: {from: past_due, to: active}}
    meaning: the outstanding balance is paid and the rental is brought current
    grain: one row per reinstatement
    fields: {locker_rental_id: the rental reinstated, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: locker_rental_cancelled
    target: locker_rental_holdings
    mutation: {transition: {from: active, to: closed}}
    meaning: the member confirms closure and vacates the locker
    grain: one row per voluntary closure
    fields: {locker_rental_id: the rental closed, customer_id: the member, status: lifecycle state, closed_date: the date closed}
    triggers: []
  - type: locker_rental_closed_administratively
    target: locker_rental_holdings
    mutation: {transition: {from: past_due, to: closed}}
    meaning: the balance remains unpaid past the grace period and the rental is administratively closed
    grain: one row per administrative closure
    fields: {locker_rental_id: the rental closed, customer_id: the member, status: lifecycle state, closed_date: the date closed}
    triggers: []
  - type: locker_fee_charged
    target: locker_rental_events
    meaning: a recurring monthly fee or a one-time fee (damage, lost key) is billed on the rental
    grain: one row per billing-cycle charge or one-time fee charge
    distinguish_by: [charge_type, billing_cycle_month, event_timestamp]
    account: locker_dues_account
    direction: in
    fields: {event_id: primary reference of the row, locker_rental_id: the rental billed, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount charged, charge_type: the billing subtype, billing_cycle_month: the cycle covered by a recurring charge}
    triggers: []
  - type: locker_payment_received
    target: locker_rental_events
    meaning: the member's payment is applied against the rental's outstanding balance
    grain: one row per payment transaction
    distinguish_by: [event_timestamp]
    account: locker_dues_account
    direction: out
    fields: {event_id: primary reference of the row, locker_rental_id: the rental paid, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount paid, charge_type: blank, billing_cycle_month: the cycle paid}
    triggers: []
  - type: locker_fee_waived
    target: locker_rental_events
    meaning: staff waive some or all of the rental's outstanding balance
    grain: one row per waiver
    distinguish_by: [event_timestamp]
    account: locker_dues_account
    direction: out
    fields: {event_id: primary reference of the row, locker_rental_id: the rental waived, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount waived, charge_type: blank, billing_cycle_month: blank}
    triggers: []

measures: []

policies:
  - id: locker_agg_multi_holding
    subject: [locker_rental_created]
    rule: A member may hold up to 2 locker rentals open at the same time (any status other than closed), reflecting that a member may rent at more than one club; a third concurrent open rental is not permitted.
    eligibility: []
    params:
      max_per_customer: 2

  - id: locker_agg_one_per_club
    subject: [locker_rental_created]
    rule: >
      A member may not hold more than max_lockers_per_club open rentals of any tier at the same club at the same time; renting a second locker at a club where the member already holds an open rental is not permitted regardless of tier.
    eligibility: []
    params:
      per_tier:
        Small Locker: {max_lockers_per_club: "=max_lockers_per_club"}
        Medium Locker: {max_lockers_per_club: "=max_lockers_per_club"}
        Large Locker: {max_lockers_per_club: "=max_lockers_per_club"}
        Premium Climate-Controlled Locker: {max_lockers_per_club: "=max_lockers_per_club"}
        Day-Use Locker: {max_lockers_per_club: "=max_lockers_per_club"}
        VIP Locker Suite: {max_lockers_per_club: "=max_lockers_per_club"}

  - id: locker_tier_pricing
    subject: [locker_fee_charged, locker_rental_activated, locker_fee_waived, locker_payment_received]
    rule: >
      At activation and each billing cycle thereafter, the rental is charged the tier's monthly_fee_usd as a monthly_fee charge, less member_discount_pct where the member's club membership tier qualifies; a Day-Use Locker is instead charged daily_use_fee_usd per day used, up to daily_use_max_consecutive_days before a monthly rental is required. A charge may be written only while the rental is active or past_due
    eligibility:
      - id: charge_requires_open_rental
        applies_to: [locker_fee_charged]
        kind: state
        condition: A charge may be written only while the rental is active or past_due
        evidence_fields: [locker_rental_holdings.locker_rental_id, locker_rental_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[locker_rental_holdings.locker_rental_id]]
          action_bindings: {locker_rental_holdings.locker_rental_id: locker_rental_id}
        state_contract:
          field: locker_rental_holdings.status
          allowed: [active, past_due]
    params:
      per_tier:
        Small Locker: {monthly_fee_usd: "=monthly_fee_usd", member_discount_pct: "=member_discount_pct"}
        Medium Locker: {monthly_fee_usd: "=monthly_fee_usd", member_discount_pct: "=member_discount_pct"}
        Large Locker: {monthly_fee_usd: "=monthly_fee_usd", member_discount_pct: "=member_discount_pct"}
        Premium Climate-Controlled Locker: {monthly_fee_usd: "=monthly_fee_usd", member_discount_pct: "=member_discount_pct"}
        Day-Use Locker: {monthly_fee_usd: "=monthly_fee_usd", member_discount_pct: "=member_discount_pct"}
        VIP Locker Suite: {monthly_fee_usd: "=monthly_fee_usd", member_discount_pct: "=member_discount_pct"}

  - id: locker_damage_and_lost_key_fees
    subject: [locker_fee_charged]
    rule: Damage to the locker is charged damage_fee_usd and a lost key or fob is charged lost_key_fee_usd, each billed as its own one-time charge distinct from the recurring monthly fee.
    eligibility: []
    params:
      per_tier:
        Small Locker: {damage_fee_usd: "=damage_fee_usd", lost_key_fee_usd: "=lost_key_fee_usd"}
        Medium Locker: {damage_fee_usd: "=damage_fee_usd", lost_key_fee_usd: "=lost_key_fee_usd"}
