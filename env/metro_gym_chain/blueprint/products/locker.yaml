  - id: locker_cancellation_policy
    subject: [locker_rental_cancelled]
    rule: >
      A voluntary closure requires cancellation_notice_days notice, and closure before minimum_term_months have elapsed since the rental was activated is charged early_termination_fee_usd, waived entirely when relocation_termination_fee_waived applies to a documented relocation beyond relocation_radius_miles.
