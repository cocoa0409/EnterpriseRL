category: locker
display_name: Locker Rental

binding:
  holding_table: locker_rental_holdings
  event_tables: [locker_rental_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {rental_balance: locker_dues_account}

lifecycle:
  states: [applied, active, past_due, closed]
  transitions:
    - {from: applied, to: active, by: agent, means: the initial fee is captured and a locker is assigned}
    - {from: active, to: past_due, by: system, means: a scheduled monthly fee fails to collect}
    - {from: past_due, to: active, by: agent, means: the outstanding balance is paid and the rental is brought current}
    - {from: active, to: closed, by: user, means: the member confirms closure and vacates the locker}
    - {from: past_due, to: closed, by: system, means: the balance remains unpaid past the grace period and the rental is administratively closed}

accounts:
  - key: locker_dues_account
    unit: USD
    meaning: net amount currently owed on the locker rental (positive = owed); charges increase it, payments and waivers decrease it

parameter_schema:
  monthly_fee_usd: recurring monthly rental fee, USD
  deposit_usd: refundable deposit collected at rental start, USD
  minimum_term_months: minimum commitment length before closure is fee-free, months
  early_termination_fee_usd: flat fee charged when closure is requested before minimum_term_months elapses, USD
  cancellation_notice_days: notice required before a voluntary closure takes effect, calendar days
  late_fee_usd: flat fee charged when a scheduled monthly fee fails to collect, USD
  past_due_grace_period_days: days a rental may remain past_due before administrative closure, calendar days
  reactivation_fee_usd: fee charged to reinstate a past_due rental, USD
  damage_fee_usd: fee charged for damage to the locker, USD
  lost_key_fee_usd: fee charged for a lost key or fob, USD
  lock_type: enum(combination|key|electronic_keypad) — the locking mechanism this tier uses
  locker_size_cubic_feet: interior storage volume, cubic feet
  climate_controlled: boolean — whether the locker is climate-controlled
  membership_required: boolean — whether an active club membership is required to rent this tier
  minimum_membership_tier_rank: minimum club membership tier ladder rank required to rent this tier, count (0 = any active membership suffices)
  max_lockers_per_club: maximum lockers a member may rent at a single club, count
  multi_club_rental_allowed: boolean — whether a member may rent lockers at more than one club at the same time
  transfer_between_clubs_allowed: boolean — whether a rental may be transferred to a locker at a different club
  transfer_fee_usd: fee charged to transfer a rental to a different club, USD
  daily_use_allowed: boolean — whether this tier may be rented by the day rather than monthly
  daily_use_fee_usd: fee for a single day's use, USD
  daily_use_max_consecutive_days: maximum consecutive days a daily-use rental may run before requiring a monthly rental instead, days
  member_discount_pct: discount off monthly_fee_usd for members holding a qualifying club membership tier, percent
  overnight_storage_allowed: boolean — whether belongings may remain in the locker overnight
  overnight_storage_fee_usd: extra fee for overnight storage where it is not included, USD
  inspection_frequency_days: how often staff inspect lockers presumed unclaimed, days
  abandoned_property_hold_days: days abandoned property is held after a rental closes before disposal, calendar days
  abandoned_property_disposal_after_days: days after closure at which unclaimed property may be disposed of, calendar days
  waitlist_enabled: boolean — whether a waitlist is offered when this tier is fully booked at a club
  waitlist_max_position: maximum waitlist position offered before the waitlist closes, count
  price_lock_months: months this tier's fee is locked against increases, months
  price_increase_notice_days: notice required before a fee increase takes effect, calendar days
  multi_month_prepay_discount_pct: discount for prepaying the rental in a lump sum, percent
  multi_month_prepay_options_months: list of allowed prepay lengths, months
  towel_hook_included: boolean — whether a towel hook is included in the locker
  valuables_liability_cap_usd: the club's liability cap for valuables stored in this tier, USD
  insurance_addon_available: boolean — whether supplemental contents insurance may be added
  insurance_addon_fee_usd: fee for the supplemental contents insurance add-on, USD
  auto_renew_available: boolean — whether the rental may auto-renew at term end
  auto_renew_discount_pct: discount applied to an auto-renewed rental, percent
  suspension_after_missed_payments: consecutive missed charges after which the rental is marked past_due, count
  suspension_notice_days: notice given before a rental is marked past_due, calendar days
  vip_priority_assignment: boolean — whether the member may choose a preferred locker location
  vip_locker_bank: enum(standard|premium_row) — which bank of lockers this tier is assigned from
  seasonal_promo_discount_pct: discount applied during promotional periods, percent
  corporate_wellness_discount_pct: discount available when bundled with an active corporate wellness enrollment, percent
  relocation_termination_fee_waived: boolean — whether early_termination_fee_usd is waived for a documented relocation
  relocation_radius_miles: radius beyond which a relocation qualifies for the termination-fee waiver, miles
  key_replacement_processing_days: days to process a replacement key or fob, days

