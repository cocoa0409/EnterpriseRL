  - id: locker_membership_bundling_requirement
    subject: [locker_rental_created]
    rule: >
      A locker may be rented only by a member whose club membership is active and whose membership tier ladder rank is at least minimum_membership_tier_rank, except the Day-Use Locker tier which membership_required marks as open to non-members.
    eligibility:
      - id: rental_requires_qualifying_membership
        applies_to: [locker_rental_created]
        kind: state
        condition: A locker may be rented only by a member whose club membership is active and whose membership tier ladder rank is at least minimum_membership_tier_rank, except the Day-Use Locker tier which membership_required marks as open to non-members.
