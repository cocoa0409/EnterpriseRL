category: membership
display_name: Club Membership

binding:
  holding_table: membership_holdings
  event_tables: [membership_events]
  intake_tables: [membership_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {dues_balance: dues_balance_account, guest_passes_remaining: guest_pass_account}

lifecycle:
  states: [applied, active, frozen, past_due, cancel_pending, closed]
  transitions:
    - {from: applied, to: active, by: agent, means: the initial dues and enrollment charges are captured and the membership activates}
    - {from: applied, to: closed, by: agent, means: the application is withdrawn or rejected before activation}
    - {from: active, to: frozen, by: agent, means: the member's billing freeze/hold request is approved}
    - {from: frozen, to: active, by: agent, means: the freeze period ends or the member resumes early}
    - {from: active, to: past_due, by: system, means: a scheduled dues charge fails to collect}
    - {from: past_due, to: active, by: agent, means: the outstanding balance is paid and the membership is brought current}
    - {from: active, to: cancel_pending, by: user, means: the member gives notice of cancellation, opening the notice period}
    - {from: frozen, to: cancel_pending, by: user, means: the member gives notice of cancellation while frozen}
    - {from: cancel_pending, to: active, by: agent, means: the member withdraws the cancellation request before it takes effect}
    - {from: past_due, to: closed, by: system, means: the balance remains unpaid past the grace period and the membership is administratively closed}
    - {from: cancel_pending, to: closed, by: system, means: the notice period elapses and the cancellation becomes effective}

accounts:
  - key: dues_balance_account
    unit: USD
    meaning: net amount currently owed by the member for membership dues and fees (positive = owed); charges increase it, payments and waivers decrease it
  - key: guest_pass_account
    unit: visits
    meaning: complimentary guest visits currently available to the member in the running billing cycle; grants increase it, guest check-ins decrease it

parameter_schema:
  monthly_dues_usd: recurring monthly membership dues, USD
  enrollment_fee_usd: one-time signup fee charged at activation, USD
  annual_facility_fee_usd: annual facility maintenance fee charged once per contract year, USD
  minimum_term_months: minimum commitment length before cancellation is fee-free, months
  early_termination_fee_usd: flat fee charged when cancellation notice is given before minimum_term_months elapses, USD
  cancellation_notice_days: notice period required before a cancellation takes effect, calendar days
  freeze_max_duration_days: maximum length of a single billing freeze, calendar days
  freeze_max_per_rolling_year: maximum number of freezes allowed in a rolling 12-month window, count
  freeze_fee_usd: one-time fee charged when a freeze is initiated, USD (0 where waived)
  past_due_grace_period_days: days a membership may remain past_due before administrative closure, calendar days
  late_fee_usd: flat fee charged when a scheduled dues charge fails to collect, USD
  reactivation_fee_usd: fee charged to reactivate a past_due membership, USD
  missed_payment_retry_days: days after a failed charge before the system retries collection, calendar days
  missed_payment_max_retries: maximum retry attempts before the membership is marked past_due, count
  home_club_access_scope: enum(single_club|all_club) — the breadth of club access this tier grants
  off_peak_hours_only: boolean — whether access is restricted to the off_peak_window
  off_peak_window: structured {weekday_start, weekday_end, weekend} describing the off-peak access window (weekend "all_day" or "none")
  guest_passes_per_month: complimentary guest visits granted each billing cycle, count
  guest_pass_overage_fee_usd: fee per guest visit beyond the monthly allowance, USD
  max_guests_per_visit: maximum number of guests that may accompany the member on a single visit, count
  class_booking_included: boolean — whether standard group fitness classes are included at no extra charge
  class_booking_advance_window_hours: how many hours ahead of a class the member may book, hours
  personal_training_discount_pct: member discount off personal-training package prices, percent
  retail_credit_discount_pct: member discount on pro-shop store-credit top-ups, percent
  locker_rental_discount_pct: member discount on locker rental fees, percent
  household_addon_discount_pct: member discount on household add-on dues, percent
  sauna_access_included: boolean — whether sauna access is included
  pool_access_included: boolean — whether pool access is included where the club has one
  towel_service_included: boolean — whether complimentary towel service is included
  childcare_included: boolean — whether complimentary childcare is included
  childcare_hours_per_week: hours of complimentary childcare per week, hours (0 if not included)
  upgrade_effective_timing: enum(immediate|next_cycle) — when a tier upgrade takes effect
  downgrade_effective_timing: enum(immediate|next_cycle) — when a tier downgrade takes effect
  multi_club_visit_fee_usd: fee charged per visit to a non-home club for single-club-scope tiers, USD (0 for all_club tiers)
  student_status_required: boolean — whether this tier requires active student status at signup
  student_discount_pct: discount versus the base tier's monthly_dues_usd, percent
  senior_discount_pct: additional discount applied for members at or above the senior discount campaign's age threshold, percent
  corporate_partner_discount_pct: discount available when bundled with an active corporate wellness enrollment, percent
  referral_credit_usd: one-time bill credit for referring a new member, USD
  referral_max_per_rolling_year: cap on referral credits per rolling 12-month window, count
  dues_price_increase_notice_days: notice required before an annual dues increase takes effect, calendar days
  price_lock_months: months this tier's price is locked against increases from signup, months (0 = not locked)
  checkin_daily_limit: maximum check-ins counted toward usage per calendar day, count
  mobile_app_access_included: boolean — whether mobile app booking/check-in is included
  multi_month_prepay_discount_pct: discount for prepaying dues in a lump sum, percent
  multi_month_prepay_options_months: list of allowed prepay lengths, months, e.g. [3, 6, 12]
  signup_promo_credit_usd: promotional one-time bill credit for signing up online, USD
  guardian_consent_required_under_age: boolean — whether a guardian's consent is required for signup under minimum_signup_age_years
  minimum_signup_age_years: minimum age to sign up without guardian consent, years
  dues_waiver_medical_hold_allowed: boolean — whether dues may be waived while frozen for a documented medical hold
  relocation_termination_fee_waived: boolean — whether early_termination_fee_usd is waived for a documented relocation beyond relocation_radius_miles
  relocation_radius_miles: radius beyond which a relocation qualifies for the termination-fee waiver, miles

