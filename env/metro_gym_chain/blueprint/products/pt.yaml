events:
  - type: pt_package_purchased
    target: pt_holdings
    mutation: create
    meaning: a member purchases a personal-training package
    grain: one row per package
    fields: {pt_holding_id: primary reference of the package, customer_id: the purchasing member, variant_name: the tier chosen, status: lifecycle state, opened_date: date purchased, expiration_date: the date unused sessions will expire, sessions_remaining: sessions granted at purchase, assigned_trainer_name: the trainer assigned}
    account: pt_session_account
    direction: in
    triggers:
      - event: pt:pt_package_activated
        map: {pt_holding_id: pt_holding_id, customer_id: customer_id}
  - type: pt_package_activated
    target: pt_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: the purchase payment is captured and the package becomes usable
    grain: one row per activation
    fields: {pt_holding_id: the package activated, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: pt_package_paused
    target: pt_holdings
    mutation: {transition: {from: active, to: paused}}
    meaning: the member's request to pause the package is approved
    grain: one row per pause initiated
    fields: {pt_holding_id: the package paused, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: pt_package_resumed
    target: pt_holdings
    mutation: {transition: {from: paused, to: active}}
    meaning: a pause ends and the package resumes
    grain: one row per resume
    fields: {pt_holding_id: the package resumed, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: pt_package_exhausted
    target: pt_holdings
    mutation: {transition: {from: active, to: exhausted}}
    meaning: the last session in the package is redeemed and no sessions remain
    grain: one row per package that runs out
    fields: {pt_holding_id: the package exhausted, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: pt_package_lapsed
    target: pt_holdings
    mutation: {transition: [{from: active, to: expired}, {from: paused, to: expired}]}
    meaning: the expiration date passes while sessions remain unused
    grain: one row per package that lapses
    fields: {pt_holding_id: the package that lapsed, customer_id: the member, status: lifecycle state, closed_date: left empty; the package remains expired rather than closed}
    triggers:
      - event: pt:pt_package_expired
        map: {pt_holding_id: pt_holding_id, customer_id: customer_id}
  - type: pt_package_archived
    target: pt_holdings
    mutation: {transition: [{from: exhausted, to: closed}, {from: expired, to: closed}]}
    meaning: an exhausted or expired package is administratively archived
    grain: one row per archival
    fields: {pt_holding_id: the package archived, customer_id: the member, status: lifecycle state, closed_date: the date archived}
    triggers: []
  - type: pt_package_cancelled
    target: pt_holdings
    mutation: {transition: [{from: active, to: closed}, {from: paused, to: closed}]}
    meaning: the member confirms cancellation and takes a refund of unused sessions
    grain: one row per cancellation
    fields: {pt_holding_id: the package cancelled, customer_id: the member, status: lifecycle state, closed_date: the date cancelled}
    triggers:
      - event: pt:pt_package_refunded
        map: {pt_holding_id: pt_holding_id, customer_id: customer_id}
  - type: pt_session_redeemed
    target: pt_events
    meaning: the member attends a booked session and it is redeemed against the package
    grain: one row per session attended
    distinguish_by: [event_timestamp, trainer_name]
    account: pt_session_account
    direction: out
    fields: {event_id: primary reference of the row, pt_holding_id: the package redeemed against, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: sessions consumed, amount_usd: dollar amount (always 0.00), session_type: the kind of session, trainer_name: the trainer who led the session}
    triggers: []
  - type: pt_session_cancelled_late
    target: pt_events
    meaning: the member cancels a scheduled session within the late-cancellation window, forfeiting the session and incurring the cancellation fee
    grain: one row per late cancellation
    distinguish_by: [event_timestamp]
    account: pt_session_account
    direction: out
    fields: {event_id: primary reference of the row, pt_holding_id: the package the session was forfeited from, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: sessions forfeited, amount_usd: the cancellation fee charged, session_type: the kind of session, trainer_name: the trainer originally assigned}
    triggers: []
  - type: pt_package_refunded
    target: pt_events
    meaning: unused sessions in a cancelled package are refunded and removed from the balance
    grain: one row per refund
    distinguish_by: [event_timestamp]
    account: pt_session_account
    direction: out
    fields: {event_id: primary reference of the row, pt_holding_id: the package refunded, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: sessions removed from the balance, amount_usd: dollar amount refunded, session_type: blank, trainer_name: blank}
    triggers: []
  - type: pt_package_expired
    target: pt_events
    meaning: unused sessions in a lapsed package are forfeited at expiration
    grain: one row per expiration forfeiture
    distinguish_by: [event_timestamp]
    account: pt_session_account
    direction: out
    fields: {event_id: primary reference of the row, pt_holding_id: the package that expired, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: sessions forfeited, amount_usd: dollar amount (always 0.00), session_type: blank, trainer_name: blank}
    triggers: []
  - type: pt_trainer_reassigned
    target: pt_events
    meaning: the trainer assigned to the package is changed
    grain: one row per reassignment
    distinguish_by: [event_timestamp, trainer_name]
    fields: {event_id: primary reference of the row, pt_holding_id: the package reassigned, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: always 0, amount_usd: any reassignment fee charged, session_type: blank, trainer_name: the newly assigned trainer}
    triggers: []
  - type: pt_bonus_session_granted
    target: pt_events
    meaning: staff grant a goodwill bonus session to the package
    grain: one row per bonus grant
    distinguish_by: [event_timestamp]
    account: pt_session_account
    direction: in
    fields: {event_id: primary reference of the row, pt_holding_id: the package credited, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: sessions granted, amount_usd: always 0.00, session_type: blank, trainer_name: blank}
    triggers: []

measures:
  - id: pt_msr_late_cancels_last_90d
    window: rolling habitual_late_cancel_window_days ending at frozen_time (90 days for most tiers)
    measure: count of pt_session_cancelled_late events for the customer_id

policies:
  - id: pt_agg_multi_holding
    subject: [pt_package_purchased]
    rule: A member may hold up to 2 personal-training packages open at the same time (any status other than closed), for example a standard package alongside one specialty add-on; a third concurrent open package is not permitted. A member may not hold two Unlimited Monthly Coaching packages open at the same time.
    eligibility: []
    params:
      max_per_customer: 2

  - id: pt_agg_session_pool
    subject: [pt_session_redeemed, pt_package_expired, pt_package_exhausted, pt_bonus_session_granted]
    rule: >
      When a member holds more than one open personal-training package, a session redemption or an expiration forfeiture is drawn from the package with the soonest expiration_date among the member's open packages; where two open packages share the same expiration_date, the package opened earlier (the lower opened_date) is drawn from first.
    eligibility: []

  - id: pt_tier_pricing
    subject: [pt_package_purchased, pt_package_activated]
    rule: >
      At purchase, the package is priced at the tier's price_usd (less multi_package_discount_pct if the member already holds another open package, and less corporate_wellness_discount_pct if the member holds an active corporate wellness enrollment, taking whichever single discount is higher rather than stacking them), grants sessions_included sessions (or unlimited use, subject to unlimited_monthly_cap_sessions_per_week, when sessions_included is -1), and sets expiration_date to opened_date plus expiration_window_days calendar days.
    eligibility: []
    params:
      per_tier:
        Single Session Pack: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}
        5-Session Starter Pack: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}
        10-Session Value Pack: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}
        20-Session Performance Pack: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}
        Unlimited Monthly Coaching: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}
        Elite Specialty Coaching: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}

  - id: pt_session_redemption_eligibility
    subject: [pt_session_redeemed]
    rule: A session may be redeemed only while the package is active.
    eligibility:
      - id: redemption_requires_active_package
        applies_to: [pt_session_redeemed]
        kind: state
        condition: A session may be redeemed only while the package is active.
        evidence_fields: [pt_holdings.pt_holding_id, pt_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pt_holdings.pt_holding_id]]
          action_bindings: {pt_holdings.pt_holding_id: pt_holding_id}
        state_contract:
          field: pt_holdings.status
          allowed: [active]

  - id: pt_late_cancellation_policy
    subject: [pt_session_cancelled_late]
    rule: >
      Cancelling a scheduled session within late_cancel_window_hours of its scheduled start forfeits the session from the package balance and charges cancellation_fee_usd; cancelling with more notice than that returns no charge and does not touch the balance. The member's stated notice, matched against the session time on file with the front desk, is the basis for whether a cancellation falls inside the window.
    eligibility: []
    params:
      per_tier:
        Single Session Pack: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}
        5-Session Starter Pack: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}
        10-Session Value Pack: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}
        20-Session Performance Pack: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}
        Unlimited Monthly Coaching: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}
        Elite Specialty Coaching: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}

  - id: pt_habitual_late_cancellation
    subject: [pt_session_cancelled_late]
    rule: >
      Once a member accumulates habitual_late_cancel_threshold or more late cancellations in the trailing habitual_late_cancel_window_days ending at frozen_time, counting every pt_session_cancelled_late event for that customer_id in the window, each further late cancellation in that window additionally incurs habitual_late_cancel_penalty_fee_usd on top of cancellation_fee_usd.
    eligibility: []
    measures: [pt_msr_late_cancels_last_90d]
    params:
      per_tier:
        Single Session Pack: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}
        5-Session Starter Pack: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}
        10-Session Value Pack: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}
        20-Session Performance Pack: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}
        Unlimited Monthly Coaching: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}
        Elite Specialty Coaching: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}

  - id: pt_package_refund_policy
    subject: [pt_package_refunded, pt_package_cancelled]
    rule: >
      A refund of unused sessions may be recorded only while the package is active, paused, or in the same moment as its confirmed cancellation to closed, and only when the customer requests the refund before refund_window_days have elapsed since the package was purchased, counted as full calendar days from opened_date with no partial-day rounding; frozen_time must not be later than opened_date plus refund_window_days for the refund to be recorded. The refund amount is cancellation_refund_pct of the unused-session value, prorated on refund_proration_basis.
    eligibility:
      - id: refund_requires_open_package
        applies_to: [pt_package_refunded]
        kind: state
        condition: A refund of unused sessions may be recorded only while the package is active, paused, or in the same moment as its confirmed cancellation to closed
        evidence_fields: [pt_holdings.pt_holding_id, pt_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pt_holdings.pt_holding_id]]
          action_bindings: {pt_holdings.pt_holding_id: pt_holding_id}
        state_contract:
          field: pt_holdings.status
          allowed: [active, paused, closed]
      - id: refund_within_window
        applies_to: [pt_package_refunded]
        kind: time
        condition: only when the customer requests the refund before refund_window_days have elapsed since the package was purchased, counted as full calendar days from opened_date with no partial-day rounding
        evidence_fields: [pt_holdings.pt_holding_id, pt_holdings.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pt_holdings.pt_holding_id]]
          action_bindings: {pt_holdings.pt_holding_id: pt_holding_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the package was purchased
          anchor_source: pt_holdings.opened_date
          relation: not_after
          duration_source: variants.refund_window_days
          unit: calendar_days
          counting_rule: counted as full calendar days from opened_date with no partial-day rounding
          boundary: inclusive
    params:
      per_tier:
        Single Session Pack: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}
        5-Session Starter Pack: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}
        10-Session Value Pack: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}
        20-Session Performance Pack: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}
        Unlimited Monthly Coaching: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}
        Elite Specialty Coaching: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}

  - id: pt_package_expiration_policy
    subject: [pt_package_lapsed, pt_package_expired, pt_package_archived]
    rule: >
      A package lapses and its remaining sessions are forfeited once frozen_time is not before opened_date (the date the package was purchased) plus expiration_window_days calendar days, counted as full calendar days from opened_date with no partial-day rounding.
    eligibility:
      - id: expiration_window_elapsed
        applies_to: [pt_package_lapsed]
        kind: time
        condition: A package lapses and its remaining sessions are forfeited once frozen_time is not before opened_date (the date the package was purchased) plus expiration_window_days calendar days, counted as full calendar days from opened_date with no partial-day rounding.
        evidence_fields: [pt_holdings.pt_holding_id, pt_holdings.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pt_holdings.pt_holding_id]]
          action_bindings: {pt_holdings.pt_holding_id: pt_holding_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the package was purchased
          anchor_source: pt_holdings.opened_date
          relation: not_before
          duration_source: variants.expiration_window_days
          unit: calendar_days
          counting_rule: counted as full calendar days from opened_date with no partial-day rounding
          boundary: inclusive
    params:
      per_tier:
        Single Session Pack: {expiration_window_days: "=expiration_window_days"}
        5-Session Starter Pack: {expiration_window_days: "=expiration_window_days"}
        10-Session Value Pack: {expiration_window_days: "=expiration_window_days"}
        20-Session Performance Pack: {expiration_window_days: "=expiration_window_days"}
        Unlimited Monthly Coaching: {expiration_window_days: "=expiration_window_days"}
        Elite Specialty Coaching: {expiration_window_days: "=expiration_window_days"}

  - id: pt_trainer_reassignment_policy
    subject: [pt_trainer_reassigned]
    rule: >
      A member may request a trainer reassignment; the first trainer_reassignment_free_uses reassignments on a package are free, and each further reassignment is charged trainer_reassignment_fee_usd.
    eligibility: []
    params:
      per_tier:
        Single Session Pack: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}
        5-Session Starter Pack: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}
        10-Session Value Pack: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}
        20-Session Performance Pack: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}
        Unlimited Monthly Coaching: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}
        Elite Specialty Coaching: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}

  - id: pt_package_pause_policy
    subject: [pt_package_paused, pt_package_resumed]
    rule: >
      When package_pause_allowed applies, a package may be paused for up to package_pause_max_days, charged package_pause_fee_usd; the expiration_date is pushed back by the number of days actually paused once the package resumes.
    eligibility: []
    params:
      per_tier:
        Single Session Pack: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}
        5-Session Starter Pack: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}
        10-Session Value Pack: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}
        20-Session Performance Pack: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}
        Unlimited Monthly Coaching: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}
        Elite Specialty Coaching: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}

  - id: pt_specialty_membership_gating
    subject: [pt_package_purchased]
    rule: >
      Elite Specialty Coaching may be purchased only by a member whose club membership is active and whose membership tier ladder rank is at least minimum_membership_tier_rank; a lower or inactive membership must upgrade first.
    eligibility:
      - id: purchase_requires_qualifying_membership
        applies_to: [pt_package_purchased]
        kind: state
        condition: Elite Specialty Coaching may be purchased only by a member whose club membership is active and whose membership tier ladder rank is at least minimum_membership_tier_rank
        evidence_fields: [membership_holdings.status, membership_holdings.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_holdings.customer_id]]
          action_bindings: {membership_holdings.customer_id: customer_id}
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    params:
      per_tier:
        Single Session Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        5-Session Starter Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        10-Session Value Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        20-Session Performance Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        Unlimited Monthly Coaching: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        Elite Specialty Coaching: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
