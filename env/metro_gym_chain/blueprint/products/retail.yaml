  - id: retail_expiration_and_dormancy_policy
    subject: [retail_credit_expired]
    rule: >
      A balance is forfeited once frozen_time is not before the account's opened_date (the date the account was opened, or its most recent top-up or redemption, whichever is later) plus inactivity_period_before_expiration_days calendar days, counted as full calendar days with no partial-day rounding.
    eligibility:
      - id: inactivity_window_elapsed
        applies_to: [retail_credit_expired]
        kind: time
        condition: A balance is forfeited once frozen_time is not before the account's opened_date (the date the account was opened, or its most recent top-up or redemption, whichever is later) plus inactivity_period_before_expiration_days calendar days, counted as full calendar days with no partial-day rounding.
        evidence_fields: [retail_credit_accounts.credit_account_id, retail_credit_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[retail_credit_accounts.credit_account_id]]
          action_bindings: {retail_credit_accounts.credit_account_id: credit_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the account was opened
          anchor_source: retail_credit_accounts.opened_date
          relation: not_before
          duration_source: variants.inactivity_period_before_expiration_days
          unit: calendar_days
          counting_rule: counted as full calendar days with no partial-day rounding
          boundary: inclusive
    params:
      per_tier:
        Starter Credit $50 Tier: {inactivity_period_before_expiration_days: "=inactivity_period_before_expiration_days"}
        Standard Credit $100 Tier: {inactivity_period_before_expiration_days: "=inactivity_period_before_expiration_days"}
        Value Credit $250 Tier: {inactivity_period_before_expiration_days: "=inactivity_period_before_expiration_days"}
        VIP Credit $500 Tier: {inactivity_period_before_expiration_days: "=inactivity_period_before_expiration_days"}
        Auto-Reload Standard: {inactivity_period_before_expiration_days: "=inactivity_period_before_expiration_days"}
        Auto-Reload Premium: {inactivity_period_before_expiration_days: "=inactivity_period_before_expiration_days"}

  - id: retail_refund_policy
    subject: [retail_credit_refund, retail_account_cancelled]
    rule: >
      A refund of a top-up may be recorded only while the account is active or in the same moment as its confirmed cancellation to closed, and only when requested before refund_window_days have elapsed since that top-up, counted as full calendar days with no partial-day rounding; at closure, an unused balance at or above minimum_closure_refund_usd is refunded at refund_pct, and a balance below minimum_closure_refund_usd is forfeited under unused_balance_forfeiture_on_closure_pct.
    eligibility:
      - id: refund_requires_open_or_just_closed_account
        applies_to: [retail_credit_refund]
        kind: state
        condition: A refund of a top-up may be recorded only while the account is active or in the same moment as its confirmed cancellation to closed
        evidence_fields: [retail_credit_accounts.credit_account_id, retail_credit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[retail_credit_accounts.credit_account_id]]
          action_bindings: {retail_credit_accounts.credit_account_id: credit_account_id}
        state_contract:
          field: retail_credit_accounts.status
          allowed: [active, closed]
    params:
      per_tier:
        Starter Credit $50 Tier: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct", minimum_closure_refund_usd: "=minimum_closure_refund_usd"}
        Standard Credit $100 Tier: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct", minimum_closure_refund_usd: "=minimum_closure_refund_usd"}
        Value Credit $250 Tier: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct", minimum_closure_refund_usd: "=minimum_closure_refund_usd"}
        VIP Credit $500 Tier: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct", minimum_closure_refund_usd: "=minimum_closure_refund_usd"}
        Auto-Reload Standard: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct", minimum_closure_refund_usd: "=minimum_closure_refund_usd"}
        Auto-Reload Premium: {refund_window_days: "=refund_window_days", refund_pct: "=refund_pct", minimum_closure_refund_usd: "=minimum_closure_refund_usd"}

