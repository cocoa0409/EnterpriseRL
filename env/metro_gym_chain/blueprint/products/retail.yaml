category: retail
display_name: Pro Shop Store Credit

binding:
  holding_table: retail_credit_accounts
  event_tables: [retail_credit_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {credit_balance: store_credit_account}

lifecycle:
  states: [applied, active, suspended, closed]
  transitions:
    - {from: applied, to: active, by: agent, means: the initial top-up payment is captured and the account activates}
    - {from: active, to: suspended, by: system, means: the account is placed on a fraud review hold}
    - {from: suspended, to: active, by: agent, means: the fraud review clears and the hold is lifted}
    - {from: active, to: closed, by: user, means: the member confirms closure and takes a refund or forfeiture of the remaining balance}
    - {from: suspended, to: closed, by: agent, means: a confirmed-fraudulent account is administratively closed}

accounts:
  - key: store_credit_account
    unit: USD
    meaning: spendable store credit currently available on the account; top-ups, auto-reloads and refunds increase it, redemptions, refunds-out and expirations decrease it

parameter_schema:
  topup_amount_usd: the standard top-up amount for this tier, USD
  minimum_topup_usd: smallest top-up amount accepted, USD
  maximum_balance_usd: cap on the stored balance the account may hold, USD
  bonus_credit_pct: bonus credit added on top of a standard top-up, percent
  expiration_window_days: days of account inactivity after which the balance begins to expire
  inactivity_period_before_expiration_days: days with no redemption or top-up activity before the account is considered dormant
  dormancy_fee_usd: monthly fee charged against a dormant balance, USD
  dormancy_fee_grace_days: days of dormancy before the dormancy fee begins, days
  refund_window_days: days after a top-up within which that top-up may be refunded
  refund_pct: percentage of an eligible top-up refunded, percent
  auto_reload_enabled: boolean — whether the account automatically reloads when the balance drops low
  auto_reload_threshold_usd: balance level that triggers an automatic reload, USD
  auto_reload_amount_usd: amount added on an automatic reload, USD
  auto_reload_payment_method_required: boolean — whether a payment method on file is required for auto-reload
  member_discount_pct: discount off pro-shop purchases paid with this credit, percent
  membership_required: boolean — whether an active club membership is required to open this tier
  minimum_membership_tier_rank: minimum club membership tier ladder rank required to open this tier, count (0 = any active membership suffices)
  gift_card_purchasable: boolean — whether this tier may be purchased as a gift for another member
  gift_transfer_fee_usd: fee charged to transfer balance to another member, USD
  loss_theft_replacement_fee_usd: fee to replace a lost or stolen account credential, USD
  loss_theft_replacement_requires_id: boolean — whether photo id is required to replace a lost or stolen credential
  redemption_channels_allowed: list of channels this tier's credit may be redeemed through, e.g. [app, front_desk, phone, web]
  redemption_daily_limit_usd: maximum amount redeemable in a single calendar day, USD
  price_match_guarantee: boolean — whether pro-shop purchases carry a price-match guarantee
  seasonal_promo_bonus_pct: bonus credit added during promotional periods, percent
  referral_bonus_usd: one-time bonus credit for referring a new member, USD
  referral_max_per_rolling_year: cap on referral bonuses per rolling 12-month window, count
  corporate_wellness_discount_pct: discount available when bundled with an active corporate wellness enrollment, percent
  birthday_bonus_credit_usd: bonus credit granted around the member's birthday, USD
  birthday_bonus_max_per_year: maximum birthday bonuses granted per year, count
  low_balance_alert_threshold_usd: balance level below which a low-balance alert is sent, USD
  account_closure_notice_days: notice required before a closure request takes effect, calendar days
  unused_balance_forfeiture_on_closure_pct: percentage of the unused balance forfeited on closure rather than refunded, percent
  minimum_closure_refund_usd: minimum unused balance eligible for a cash refund at closure; below this the balance is forfeited, USD
  price_lock_months: months the bonus_credit_pct rate is locked against change, months
  tier_upgrade_credit_bonus_usd: bonus credit granted when upgrading to this tier, USD
  tier_downgrade_allowed: boolean — whether the account may downgrade to a lower tier
  suspension_fraud_hold_days: maximum days an account may remain suspended under fraud review, days
  suspension_review_required: boolean — whether a documented review is required before reinstatement
  reinstatement_fee_usd: fee charged to reinstate a suspended account, USD
  purchase_item_category_restrictions: list of pro-shop item categories this credit may not be redeemed against, e.g. [gift_cards, services]
  combo_redemption_with_discount_allowed: boolean — whether this credit may be combined with a pro-shop sale discount on the same purchase
  auto_reload_max_attempts_per_month: maximum automatic reload attempts per calendar month, count
  auto_reload_fee_usd: fee charged per automatic reload transaction, USD
  deposit_hold_days: days a top-up is held before becoming spendable, days
  large_topup_review_threshold_usd: top-up amount above which a fraud review hold applies, USD
  large_topup_review_hold_days: days a large top-up is held for review, days
  price_increase_notice_days: notice required before a fee or rate increase takes effect, calendar days
  account_transferable_on_death_or_closure: boolean — whether an unused balance may be transferred to another member's account rather than forfeited

