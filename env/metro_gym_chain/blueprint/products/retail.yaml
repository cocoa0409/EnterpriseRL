  - id: retail_auto_reload_policy
    subject: [retail_auto_reload_triggered]
    rule: >
      For a tier with auto_reload_enabled, once the balance drops below auto_reload_threshold_usd, auto_reload_amount_usd is automatically added, provided a payment method is on file when auto_reload_payment_method_required applies, up to auto_reload_max_attempts_per_month attempts in a calendar month.
    eligibility: []
    params:
      per_tier:
        Starter Credit $50 Tier: {auto_reload_enabled: "=auto_reload_enabled", auto_reload_threshold_usd: "=auto_reload_threshold_usd", auto_reload_amount_usd: "=auto_reload_amount_usd"}
        Standard Credit $100 Tier: {auto_reload_enabled: "=auto_reload_enabled", auto_reload_threshold_usd: "=auto_reload_threshold_usd", auto_reload_amount_usd: "=auto_reload_amount_usd"}
        Value Credit $250 Tier: {auto_reload_enabled: "=auto_reload_enabled", auto_reload_threshold_usd: "=auto_reload_threshold_usd", auto_reload_amount_usd: "=auto_reload_amount_usd"}
