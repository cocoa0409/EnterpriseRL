  - id: retail_redemption_eligibility
    subject: [retail_credit_redeemed]
    rule: Store credit may be redeemed only while the account is active, and a single day's redemptions may not exceed redemption_daily_limit_usd.
    eligibility:
      - id: redemption_requires_active_account
        applies_to: [retail_credit_redeemed]
        kind: state
        condition: Store credit may be redeemed only while the account is active
        evidence_fields: [retail_credit_accounts.credit_account_id, retail_credit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
