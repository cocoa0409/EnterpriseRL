events:
  - type: retail_account_opened
    target: retail_credit_accounts
    mutation: create
    meaning: a member opens a store-credit account with an initial top-up
    grain: one row per account
    fields: {credit_account_id: primary reference of the account, customer_id: the opening member, variant_name: the tier chosen, status: lifecycle state, opened_date: date opened, credit_balance: balance granted at opening}
    account: store_credit_account
    direction: in
    triggers:
      - event: retail:retail_account_activated
        map: {credit_account_id: credit_account_id, customer_id: customer_id}
  - type: retail_account_activated
    target: retail_credit_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: the initial top-up payment is captured and the account becomes usable
    grain: one row per activation
    fields: {credit_account_id: the account activated, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: retail_account_suspended
    target: retail_credit_accounts
    mutation: {transition: {from: active, to: suspended}}
    meaning: the account is placed on a fraud review hold
    grain: one row per suspension
    fields: {credit_account_id: the account suspended, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: retail_account_reinstated
    target: retail_credit_accounts
    mutation: {transition: {from: suspended, to: active}}
    meaning: the fraud review clears and the hold is lifted
    grain: one row per reinstatement
    fields: {credit_account_id: the account reinstated, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: retail_account_cancelled
    target: retail_credit_accounts
    mutation: {transition: {from: active, to: closed}}
    meaning: the member confirms closure and takes a refund (or forfeiture) of the remaining balance
    grain: one row per cancellation
    fields: {credit_account_id: the account cancelled, customer_id: the member, status: lifecycle state, closed_date: the date closed}
    triggers:
      - event: retail:retail_credit_refund
        map: {credit_account_id: credit_account_id, customer_id: customer_id}
  - type: retail_account_closed_administratively
    target: retail_credit_accounts
    mutation: {transition: {from: suspended, to: closed}}
    meaning: a confirmed-fraudulent account is administratively closed
    grain: one row per administrative closure
    fields: {credit_account_id: the account closed, customer_id: the member, status: lifecycle state, closed_date: the date closed}
    triggers: []
  - type: retail_credit_topup
    target: retail_credit_events
    meaning: the member adds funds to their store-credit balance
    grain: one row per top-up transaction
    distinguish_by: [event_timestamp, channel]
    account: store_credit_account
    direction: in
    fields: {event_id: primary reference of the row, credit_account_id: the account topped up, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount added, purchase_item: blank, channel: how the top-up was made}
    triggers: []
  - type: retail_credit_redeemed
    target: retail_credit_events
    meaning: the member spends store credit on a pro-shop purchase
    grain: one row per redemption transaction
    distinguish_by: [event_timestamp, purchase_item]
    account: store_credit_account
    direction: out
    fields: {event_id: primary reference of the row, credit_account_id: the account redeemed from, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount spent, purchase_item: the item(s) purchased, channel: how the purchase was made}
    triggers: []
  - type: retail_credit_refund
    target: retail_credit_events
    meaning: a top-up or the remaining balance at closure is refunded off the account
    grain: one row per refund
    distinguish_by: [event_timestamp]
    account: store_credit_account
    direction: out
    fields: {event_id: primary reference of the row, credit_account_id: the account refunded, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount refunded, purchase_item: blank, channel: how the refund was issued}
    triggers: []
  - type: retail_credit_expired
    target: retail_credit_events
    meaning: a dormant balance is forfeited after the inactivity window
    grain: one row per expiration forfeiture
    distinguish_by: [event_timestamp]
    account: store_credit_account
    direction: out
    fields: {event_id: primary reference of the row, credit_account_id: the account forfeited, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount forfeited, purchase_item: blank, channel: blank}
    triggers: []
  - type: retail_auto_reload_triggered
    target: retail_credit_events
    meaning: an automatic reload adds funds once the balance drops below the tier's threshold
    grain: one row per automatic reload
    distinguish_by: [event_timestamp]
    account: store_credit_account
    direction: in
    fields: {event_id: primary reference of the row, credit_account_id: the account reloaded, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount added, purchase_item: blank, channel: auto}
    triggers: []

measures: []

policies:
  - id: retail_agg_multi_holding
    subject: [retail_account_opened]
    rule: A member may hold only a single store-credit account that is not closed at any time; a new account is not permitted while an existing one for that member remains in any status other than closed.
    eligibility: []
    params:
      max_per_customer: 1

  - id: retail_tier_topup_pricing
    subject: [retail_credit_topup, retail_account_activated]
    rule: >
      A top-up is credited at face value plus bonus_credit_pct bonus credit (or seasonal_promo_bonus_pct if that promotional rate is higher, never both at once), subject to minimum_topup_usd as the smallest accepted amount and maximum_balance_usd as the cap the resulting balance may not exceed.
    eligibility: []
    params:
      per_tier:
        Starter Credit $50 Tier: {bonus_credit_pct: "=bonus_credit_pct", minimum_topup_usd: "=minimum_topup_usd", maximum_balance_usd: "=maximum_balance_usd"}
        Standard Credit $100 Tier: {bonus_credit_pct: "=bonus_credit_pct", minimum_topup_usd: "=minimum_topup_usd", maximum_balance_usd: "=maximum_balance_usd"}
        Value Credit $250 Tier: {bonus_credit_pct: "=bonus_credit_pct", minimum_topup_usd: "=minimum_topup_usd", maximum_balance_usd: "=maximum_balance_usd"}
        VIP Credit $500 Tier: {bonus_credit_pct: "=bonus_credit_pct", minimum_topup_usd: "=minimum_topup_usd", maximum_balance_usd: "=maximum_balance_usd"}
