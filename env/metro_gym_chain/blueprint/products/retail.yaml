        Standard Credit $100 Tier: {redemption_daily_limit_usd: "=redemption_daily_limit_usd"}
        Value Credit $250 Tier: {redemption_daily_limit_usd: "=redemption_daily_limit_usd"}
        VIP Credit $500 Tier: {redemption_daily_limit_usd: "=redemption_daily_limit_usd"}
