      per_tier:
        Startup Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}
        Small Business Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}
        Mid-Market Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}
        Enterprise Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}
        Municipal Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}
        Nonprofit Partner: {corporate_guest_pass_allotment_per_month: "=corporate_guest_pass_allotment_per_month", corporate_guest_pass_fee_usd: "=corporate_guest_pass_fee_usd"}

extended_policies:
  - id: corp_ext_dues_billing
    base_policy_refs: [corp_tier_pricing, corp_billing_and_suspension]
    overwrite:
      - base_policy: corp_tier_pricing
        superseded_clause: >-
          Each billing cycle the employer's master account is billed monthly_dues_per_employee_usd for the enrolled employee
        replaced_by: >-
          where none exist yet, this is the first cycle and a one-time wellness-program setup fee is added on top of the monthly rate
    trigger: state_due
    subject: [corp_dues_billed]
    computes: amount_usd
    target_tool: bill_corp_enrollment_dues_4e718c02
    rule: >
      Each billing cycle the employer's master account is billed the enrollment's tier
      monthly_dues_per_employee_usd for the enrolled employee. Whether this is the enrollment's
      first billing-cycle charge is determined by counting how many corp_dues_billed entries
      already exist in this enrollment's billing history; where none exist yet, this is the first
      cycle and a one-time wellness-program setup fee is added on top of the monthly rate, equal to
      5% of the employee's own club membership tier's monthly_dues_usd, capped at a maximum of
      $5.00, and rounded to 2 decimal places before being added; on every later cycle no setup fee
      is added. The employee's own club membership monthly_dues_usd rate is the amount of that
      membership's own most recent recurring-dues charge on file, which reflects its tier's current
      rate. The monthly rate and, where it applies, the rounded and capped setup fee are summed
      once, and that sum is itself rounded to 2 decimal places for the final amount billed.
    prerequisite: []
    cross_category:
      - category: membership
        as: branch
        reads: [monthly_dues_usd]
        note: >-
          The employee's own club membership monthly dues rate sizes the one-time wellness-program
          setup fee added to the enrollment's first billing-cycle charge.
    compute:
      - monthly_rate: "P('monthly_dues_per_employee_usd')"
      - membership_dues: "CPARAM('membership','monthly_dues_usd')"
      - prior_bills_count: "COUNT('corporate_wellness_events', event_type='corp_dues_billed')"
      - is_first_bill: "prior_bills_count == 0"
      - setup_fee_raw: "RND(0.05 * (membership_dues or 0), 2)"
      - setup_fee: "5.00 if setup_fee_raw > 5.00 else setup_fee_raw"
      - result: "RND(monthly_rate + (setup_fee if is_first_bill else 0), 2)"
    compute_basis:
      prior_bills_count: >-
        Whether this is the enrollment's first billing-cycle charge is determined by counting how
        many corp_dues_billed entries already exist in this enrollment's billing history
      is_first_bill: >-
        where none exist yet, this is the first cycle and a one-time wellness-program setup fee is
        added on top of the monthly rate
      membership_dues: >-
        The employee's own club membership monthly_dues_usd rate is the amount of that
        membership's own most recent recurring-dues charge on file, which reflects its tier's
        current rate.
      setup_fee_raw: >-
        equal to 5% of the employee's own club membership tier's monthly_dues_usd
      setup_fee: >-
        capped at a maximum of $5.00, and rounded to 2 decimal places before being added
      result: >-
        The monthly rate and, where it applies, the rounded and capped setup fee are summed once,
        and that sum is itself rounded to 2 decimal places for the final amount billed.
    inputs:
      history:
        - {table: corporate_wellness_events, aggregate: count, field: event_id, filters: {event_type: corp_dues_billed}}
      cross_category: [membership]

  - id: corp_ext_payment_allocation
    base_policy_refs: [corp_dues_waiver_policy]
    overwrite: []
    trigger: on_request
    subject: [corp_dues_payment_received]
    computes: amount_usd
    target_tool: record_corp_dues_payment_5148c010
    rule: >
      A payment may only be applied once at least one billing-cycle charge has been recorded
      against the enrollment, since there is nothing yet owed to apply it against. Once that holds,
      a payment received from the employer's master account is applied in full against whatever the
      enrollment currently shows owed on corporate_dues_balance, floored at zero so a credit
      balance is never further reduced by a payment, except that a single payment transaction's
      applied amount may never exceed 50 times the employee's own club membership tier's
      monthly_dues_usd, guarding against a single remittance overpaying relative to the household's
      overall billing scale. The employee's own club membership monthly_dues_usd rate is the amount
      of that membership's own most recent recurring-dues charge on file, which reflects its tier's
      current rate. The applied amount is the lesser of the floored balance and that ceiling,
      rounded to 2 decimal places.
    prerequisite:
      - problem: corp_ext_dues_billing
        kind: value_input
        gate: current_balance
        condition: >-
          A payment may only be applied once at least one billing-cycle charge has been recorded
          against the enrollment, since there is nothing yet owed to apply it against.
        policy_source: >-
          A payment may only be applied once at least one billing-cycle charge has been recorded
          against the enrollment, since there is nothing yet owed to apply it against.
        resolved_by: bill_corp_enrollment_dues_4e718c02
        effect: >-
          current_balance moves from 0.00 (nothing billed) to the amount corp_ext_dues_billing
          billed, once that billing-cycle charge lands.
    cross_category:
      - category: membership
        as: branch
        reads: [monthly_dues_usd]
        note: >-
          The employee's own club membership monthly dues rate sizes the fraud-prevention ceiling
          on how much a single payment transaction may apply.
    compute:
      - current_balance: "F('corporate_dues_balance')"
      - membership_dues: "CPARAM('membership','monthly_dues_usd')"
      - ceiling: "50 * (membership_dues or 0)"
      - floored_balance: "MX(current_balance, 0)"
      - amount_applied: "ceiling if floored_balance > ceiling else floored_balance"
      - result: "RND(amount_applied, 2)"
    compute_basis:
      floored_balance: >-
        applied in full against whatever the enrollment currently shows owed on
        corporate_dues_balance, floored at zero so a credit balance is never further reduced by a
        payment
      membership_dues: >-
        The employee's own club membership monthly_dues_usd rate is the amount of that
        membership's own most recent recurring-dues charge on file, which reflects its tier's
        current rate.
      ceiling: >-
        a single payment transaction's applied amount may never exceed 50 times the employee's own
        club membership tier's monthly_dues_usd
      amount_applied: >-
        The applied amount is the lesser of the floored balance and that ceiling, rounded to 2
        decimal places.
    inputs:
      history: []
      cross_category: [membership]

  - id: corp_ext_wellness_reimbursement_waiver
    base_policy_refs: [corp_dues_waiver_policy]
    overwrite: []
    trigger: on_request
    subject: [corp_dues_waived]
    computes: amount_usd
    target_tool: waive_corp_wellness_reimbursement_b40ef430
    rule: >
      Staff may apply a wellness-reimbursement waiver against the enrollment's billed balance while
      the enrollment is active or suspended, equal to wellness_reimbursement_pct of the employee's
      own club membership tier's monthly_dues_usd, rounded to 2 decimal places, as the candidate
      amount; that rate is the amount of the employee's own club membership's most recent
      recurring-dues charge on file, which reflects its tier's current rate. That candidate amount
      is then capped so that the enrollment's cumulative
      wellness-reimbursement waivers in the trailing 12 months ending at the time of the waiver,
      including this one, do not exceed wellness_reimbursement_annual_cap_usd, computing the
      remaining annual-cap headroom as the annual cap minus the sum of wellness-reimbursement
      waivers already granted on this enrollment in the trailing 12 months, floored at zero. The
      amount waived may also never exceed 3 times the total payments the employer's master account
      has made toward this enrollment in the trailing 12 months ending at the time of the waiver,
      guarding against reimbursing more than a reasonable multiple of what has actually been
      remitted. A waiver granted before any payment has been posted has no payment history to size
      it against and computes to zero under this ceiling. The amount waived is the smallest of the
      candidate amount, the remaining annual-cap headroom, and that payment-based ceiling, rounded
      to 2 decimal places.
    prerequisite:
      - problem: corp_ext_payment_allocation
        kind: value_input
        gate: payment_ceiling
        condition: >-
          The amount waived may also never exceed 3 times the total payments the employer's master
          account has made toward this enrollment in the trailing 12 months ending at the time of
          the waiver.
        policy_source: >-
          The amount waived may also never exceed 3 times the total payments the employer's master
          account has made toward this enrollment in the trailing 12 months ending at the time of
          the waiver, guarding against reimbursing more than a reasonable multiple of what has
          actually been remitted.
        resolved_by: record_corp_dues_payment_5148c010
        effect: >-
          payment_ceiling moves from 0.00 (no payments in the trailing 12 months) to 3 times the
          amount corp_ext_payment_allocation posted, once that payment lands.
    cross_category:
      - category: membership
        as: branch
        reads: [monthly_dues_usd]
        note: >-
          The employee's own club membership monthly dues rate sizes the wellness-reimbursement
          candidate amount.
    compute:
      - pct: "P('wellness_reimbursement_pct')"
      - annual_cap: "P('wellness_reimbursement_annual_cap_usd')"
      - membership_dues: "CPARAM('membership','monthly_dues_usd')"
      - candidate: "RND(pct / 100 * (membership_dues or 0), 2)"
      - ytd_waived: "SUM('corporate_wellness_events','amount_usd', within_months=12, date_field='event_timestamp', event_type='corp_dues_waived')"
      - cap_headroom: "MX(annual_cap - ytd_waived, 0)"
      - ytd_paid: "SUM('corporate_wellness_events','amount_usd', within_months=12, date_field='event_timestamp', event_type='corp_dues_payment_received')"
      - payment_ceiling: "RND(3 * ytd_paid, 2)"
      - capped_by_annual: "cap_headroom if candidate > cap_headroom else candidate"
      - capped_by_payments: "payment_ceiling if capped_by_annual > payment_ceiling else capped_by_annual"
      - result: "RND(capped_by_payments, 2)"
    compute_basis:
      membership_dues: >-
        that rate is the amount of the employee's own club membership's most recent
        recurring-dues charge on file, which reflects its tier's current rate
      candidate: >-
        staff may apply a wellness-reimbursement waiver against the enrollment's billed balance
        equal to wellness_reimbursement_pct of the employee's own club membership tier's
        monthly_dues_usd, rounded to 2 decimal places, as the candidate amount
      ytd_waived: >-
        the enrollment's cumulative wellness-reimbursement waivers in the trailing 12 months ending
        at the time of the waiver, including this one, do not exceed
        wellness_reimbursement_annual_cap_usd
      cap_headroom: >-
        computing the remaining annual-cap headroom as the annual cap minus the sum of
        wellness-reimbursement waivers already granted on this enrollment in the trailing 12
        months, floored at zero
      ytd_paid: >-
        3 times the total payments the employer's master account has made toward this enrollment
        in the trailing 12 months ending at the time of the waiver
      payment_ceiling: >-
        The amount waived may also never exceed 3 times the total payments the employer's master
        account has made toward this enrollment in the trailing 12 months ending at the time of the
        waiver
      result: >-
        The amount waived is the smallest of the candidate amount, the remaining annual-cap
        headroom, and that payment-based ceiling, rounded to 2 decimal places.
    inputs:
      history:
        - {table: corporate_wellness_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: corp_dues_waived}}
        - {table: corporate_wellness_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: corp_dues_payment_received}}
      cross_category: [membership]

  - id: corp_ext_late_fee_assessment
    base_policy_refs: [corp_billing_and_suspension, corp_tier_pricing]
    overwrite:
      - base_policy: corp_billing_and_suspension
        superseded_clause: >-
          a late_payment_fee_usd is added to the employer's master account after
          late_payment_grace_days of a missed payment
        replaced_by: >-
          A late-payment fee is added to the employer's master account once a scheduled
          billing-cycle charge has remained unpaid for more than late_payment_grace_days after it
          was billed
    trigger: state_due
    subject: [corp_dues_billed]
    computes: amount_usd
    target_tool: bill_corp_late_fee_4428c2eb
    rule: >
      A late-payment fee is added to the employer's master account once a scheduled billing-cycle
      charge has remained unpaid for more than late_payment_grace_days after it was billed. The
      number of currently unpaid billing cycles is the count of corp_dues_billed entries in the
      enrollment's history minus the count of corp_dues_payment_received entries in the same
      history, floored at zero. The fee per currently unpaid billing cycle equals
      late_payment_fee_usd plus a 10% pass-through surcharge of the employee's own club
      membership tier's late_fee_usd, rounded to 2 decimal places, reflecting shared collections
      overhead across the household's accounts. The employee's own club membership late_fee_usd
      rate is the amount of that membership's own most recent late-payment fee charge on file,
      which reflects its tier's current rate. The total late fee billed is that per-cycle fee
      multiplied by the number of currently unpaid billing cycles, rounded to 2 decimal places.
      Whether one or several billing cycles are currently unpaid, this combined total is always
      recorded as a single late-fee entry filed under the enrollment's most recently billed cycle
      (the billing_cycle_month of the corp_dues_billed entry with the latest event_timestamp in the
      enrollment's history); earlier unpaid cycles remain individually represented only by their
      own original corp_dues_billed rows, not by a separate late-fee entry of their own.
    prerequisite: []
    cross_category:
      - category: membership
        as: branch
        reads: [late_fee_usd]
        note: >-
          The employee's own club membership late-fee rate sizes a 10% pass-through surcharge
          added to the per-cycle corporate late fee.
    compute:
      - corp_late_fee: "P('late_payment_fee_usd')"
      - membership_late_fee: "CPARAM('membership','late_fee_usd')"
      - surcharge: "RND(0.10 * (membership_late_fee or 0), 2)"
      - per_cycle_fee: "RND(corp_late_fee + surcharge, 2)"
      - billed_count: "COUNT('corporate_wellness_events', event_type='corp_dues_billed')"
      - paid_count: "COUNT('corporate_wellness_events', event_type='corp_dues_payment_received')"
      - missed_cycles: "0 if (billed_count - paid_count) < 0 else (billed_count - paid_count)"
      - billing_cycle_month_value: "LATEST('corporate_wellness_events','billing_cycle_month', date_field='event_timestamp', event_type='corp_dues_billed')"
      - result: "RND(per_cycle_fee * missed_cycles, 2)"
    compute_basis:
      billed_count: >-
        The number of currently unpaid billing cycles is the count of corp_dues_billed entries in
        the enrollment's history minus the count of corp_dues_payment_received entries in the same
        history, floored at zero.
      paid_count: >-
        minus the count of corp_dues_payment_received entries in the same history
      missed_cycles: >-
        floored at zero
      billing_cycle_month_value: >-
        this combined total is always recorded as a single late-fee entry filed under the
        enrollment's most recently billed cycle (the billing_cycle_month of the corp_dues_billed
        entry with the latest event_timestamp in the enrollment's history)
      membership_late_fee: >-
        The employee's own club membership late_fee_usd rate is the amount of that membership's
        own most recent late-payment fee charge on file, which reflects its tier's current rate.
      surcharge: >-
        plus a 10% pass-through surcharge of the employee's own club membership tier's
        late_fee_usd, rounded to 2 decimal places
      per_cycle_fee: >-
        The fee per currently unpaid billing cycle equals late_payment_fee_usd plus a 10%
        pass-through surcharge of the employee's own club membership tier's late_fee_usd, rounded
        to 2 decimal places
      result: >-
        The total late fee billed is that per-cycle fee multiplied by the number of currently
        unpaid billing cycles, rounded to 2 decimal places.
    inputs:
      history:
        - {table: corporate_wellness_events, aggregate: count, field: event_id, filters: {event_type: corp_dues_billed}}
        - {table: corporate_wellness_events, aggregate: count, field: event_id, filters: {event_type: corp_dues_payment_received}}
        - {table: corporate_wellness_events, aggregate: latest, field: billing_cycle_month, filters: {event_type: corp_dues_billed}}
      cross_category: [membership]

  - id: corp_ext_missed_payment_recovery
    base_policy_refs: [corp_dues_waiver_policy]
    overwrite: []
    trigger: on_request
    subject: [corp_dues_payment_received]
    computes: amount_usd
    target_tool: post_corp_dues_payment_af691ae5
    rule: >
      A payment intended to bring the employer's master account current must be posted only once
      every currently due charge, including any outstanding late-payment fee, has been billed
      against the enrollment. Once that holds, the payment posted is applied in full against
      whatever the enrollment currently shows owed on corporate_dues_balance, floored at zero so a
      credit balance is never further reduced by a payment, except that a single payment
      transaction's applied amount may never exceed 50 times the employee's own club membership
      tier's monthly_dues_usd. The employee's own club membership monthly_dues_usd rate is the
      amount of that membership's own most recent recurring-dues charge on file, which reflects
      its tier's current rate. The applied amount is the lesser of the floored balance and that
      ceiling, rounded to 2 decimal places.
    prerequisite:
      - problem: corp_ext_late_fee_assessment
        kind: value_input
        gate: current_balance
        condition: >-
          A payment intended to bring the employer's master account current must be posted only
          once every currently due charge, including any outstanding late-payment fee, has been
          billed against the enrollment.
        policy_source: >-
          A payment intended to bring the employer's master account current must be posted only
          once every currently due charge, including any outstanding late-payment fee, has been
          billed against the enrollment.
        resolved_by: bill_corp_late_fee_4428c2eb
        effect: >-
          current_balance increases by the late-fee amount before the payment is posted, so the
          full arrears including the late fee get cleared in one payment rather than leaving the
          late fee outstanding.
    cross_category:
      - category: membership
        as: branch
        reads: [monthly_dues_usd]
        note: >-
          The employee's own club membership monthly dues rate sizes the fraud-prevention ceiling
          on how much a single payment transaction may apply.
    compute:
      - current_balance: "F('corporate_dues_balance')"
      - membership_dues: "CPARAM('membership','monthly_dues_usd')"
      - ceiling: "50 * (membership_dues or 0)"
      - floored_balance: "MX(current_balance, 0)"
      - amount_applied: "ceiling if floored_balance > ceiling else floored_balance"
      - result: "RND(amount_applied, 2)"
    compute_basis:
      floored_balance: >-
        applied in full against whatever the enrollment currently shows owed on
        corporate_dues_balance, floored at zero so a credit balance is never further reduced by a
        payment
      membership_dues: >-
        The employee's own club membership monthly_dues_usd rate is the amount of that
        membership's own most recent recurring-dues charge on file, which reflects its tier's
        current rate.
      ceiling: >-
        a single payment transaction's applied amount may never exceed 50 times the employee's own
        club membership tier's monthly_dues_usd
      amount_applied: >-
        The applied amount is the lesser of the floored balance and that ceiling, rounded to 2
        decimal places.
    inputs:
      history: []
      cross_category: [membership]

  - id: corp_ext_reinstatement_billing
    base_policy_refs: [corp_billing_and_suspension, corp_tier_pricing]
    overwrite: []
    trigger: on_request
    subject: [corp_dues_billed]
    computes: amount_usd
    target_tool: bill_corp_reinstatement_fee_377eb087
    rule: >
      A reinstatement fee may only be billed once the employer's master account no longer shows any
      outstanding missed-payment balance for this enrollment. Once that holds, the fee billed to
      the employer's master account equals reinstatement_fee_usd for the tier, except that the fee
      is waived entirely (billed as 0.00) when the employee's own club membership account is not
      itself carrying a positive dues_balance, as a goodwill gesture for members who are otherwise
      current on their personal membership. Where the employee also holds an active household
      add-on membership, the fee (after that membership check) is further reduced by half,
      reflecting the household's broader relationship with the club. The fee amount is rounded to 2
      decimal places.
    prerequisite:
      - problem: corp_ext_missed_payment_recovery
        kind: state_gate
        gate: corporate_wellness_enrollments.corporate_dues_balance
        condition: >-
          A reinstatement fee may only be billed once the employer's master account no longer shows
          any outstanding missed-payment balance for this enrollment.
        policy_source: >-
          A reinstatement fee may only be billed once the employer's master account no longer shows
          any outstanding missed-payment balance for this enrollment.
        resolved_by: post_corp_dues_payment_af691ae5
        effect: >-
          corporate_dues_balance moves from a positive outstanding amount to 0.00 once
          corp_ext_missed_payment_recovery's payment lands, satisfying the gate.
    cross_category:
      - category: membership
        as: branch
        reads: [dues_balance]
        note: >-
          The employee's own club membership dues balance decides whether the reinstatement fee is
          waived as a goodwill gesture.
      - category: addon
        as: existence
        reads: [status]
        note: >-
          Whether the employee also holds an active household add-on membership decides whether
          the (non-waived) reinstatement fee is further halved.
    compute:
      - membership_balance: "CFIELD('membership','dues_balance')"
      - base_fee: "P('reinstatement_fee_usd')"
      - has_addon: "EXISTS('addon', status='active')"
      - fee_after_membership_check: "0 if (membership_balance or 0) <= 0 else base_fee"
      - fee_component: "fee_after_membership_check * (0.5 if has_addon else 1)"
      - result: "RND(fee_component, 2)"
    compute_basis:
      fee_after_membership_check: >-
        the fee is waived entirely (billed as 0.00) when the employee's own club membership account
        is not itself carrying a positive dues_balance, as a goodwill gesture for members who are
        otherwise current on their personal membership
      fee_component: >-
        Where the employee also holds an active household add-on membership, the fee (after that
        membership check) is further reduced by half, reflecting the household's broader
        relationship with the club.
      result: >-
        The fee amount is rounded to 2 decimal places.
    inputs:
      history: []
      cross_category: [membership, addon]

workflows:
  - id: corp_wf_new_enrollment_onboarding
    scenario: >
      Applies to an employee whose corporate wellness enrollment already exists in the pending
      applied state (submitted through some other channel before this call) sponsored by their
      employer, while the employee already holds an active club membership at or above the tier's
      minimum_membership_tier_required. It carries the enrollment from employment verification and
      activation, through its first billing-cycle charge to the employer's master account, through
      the employer's first payment against that charge, and finally through any
      wellness-reimbursement waiver the employee's employer sponsors against the employee's own
      club membership dues. Once complete, the enrollment is active, its first cycle has been
      billed and paid, and any wellness-reimbursement waiver the employee qualifies for this cycle
      has been applied.
    steps:
      - {tool: activate_corp_enrollment_8f54bf3c, owner: agent, writes: corporate_wellness_enrollments, subject: corp_enrollment_activated, base_policy_refs: [corp_enrollment_verification], role: verify_and_activate, computed_by: []}
      - {tool: bill_corp_enrollment_dues_4e718c02, owner: agent, writes: corporate_wellness_events, subject: corp_dues_billed, base_policy_refs: [corp_tier_pricing, corp_billing_and_suspension], role: first_bill, computed_by: [corp_ext_dues_billing]}
      - {tool: record_corp_dues_payment_5148c010, owner: user, writes: corporate_wellness_events, subject: corp_dues_payment_received, base_policy_refs: [corp_dues_waiver_policy], role: settle_first_bill, computed_by: [corp_ext_payment_allocation]}
      - {tool: waive_corp_wellness_reimbursement_b40ef430, owner: agent, writes: corporate_wellness_events, subject: corp_dues_waived, base_policy_refs: [corp_dues_waiver_policy], role: apply_wellness_reimbursement, computed_by: [corp_ext_wellness_reimbursement_waiver]}
    dataflow: []
    order_rationale: >
      Step 0 must precede step 1 on policy grounds rather than a produced object:
      corp_enrollment_verification's rule ties activation to proof of employment being reviewed,
      and corp_billing_and_suspension's rule speaks of dues continuing to be billed against an
      enrollment once it is open, never of billing an enrollment that has not yet been verified at
      all; billing before activation would charge the employer's master account for an enrollment
      whose employment verification step never ran. Step 1 must precede step 2 because
      corp_ext_payment_allocation's own rule states that a payment may only be applied once at
      least one billing-cycle charge has been recorded against the enrollment, and its compute
      reads corporate_dues_balance, which stands at 0.00 until step 1's charge lands -- swapping
      the order would apply a payment of 0.00 against nothing owed. Step 2 must precede step 3
      because corp_ext_wellness_reimbursement_waiver's own rule caps the waiver at 3 times the
      total payments posted in the trailing 12 months, and its payment-based ceiling sums
      corp_dues_payment_received entries in the trailing 12 months, which totals 0.00 until step
      2's payment lands -- swapping the order would cap the waiver at 3 times zero, i.e. at 0.00,
      rather than at its real ceiling.
    prerequisite: []

