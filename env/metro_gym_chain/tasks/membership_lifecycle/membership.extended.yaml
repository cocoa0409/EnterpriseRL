events:
  - type: membership_signup
    target: membership_holdings
    mutation: create
    meaning: a prospective member signs up and an application record for a membership contract is opened
    grain: one row per membership contract
    fields: {membership_id: primary reference of the contract, customer_id: the signing member, variant_name: the tier chosen, status: lifecycle state, home_club_id: the club designated as home club, opened_date: the date of signup}
    triggers:
      - event: membership:membership_activated
        map: {membership_id: membership_id, customer_id: customer_id}
      - event: membership:membership_dues_charge
        map: {membership_id: membership_id, customer_id: customer_id, charge_type: enrollment_fee}
  - type: membership_activated
    target: membership_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: the initial charge is captured and the membership becomes active
    grain: one row per activation
    fields: {membership_id: the contract activated, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: membership_application_withdrawn
    target: membership_holdings
    mutation: {transition: {from: applied, to: closed}}
    meaning: the application is withdrawn or rejected before activation
    grain: one row per withdrawn application
    fields: {membership_id: the contract withdrawn, customer_id: the member, status: lifecycle state, closed_date: the date withdrawn}
    triggers: []
  - type: membership_frozen
    target: membership_holdings
    mutation: {transition: {from: active, to: frozen}}
    meaning: an active membership is placed on a billing freeze/hold
    grain: one row per freeze initiated
    fields: {membership_id: the contract frozen, customer_id: the member, status: lifecycle state, freeze_start_date: the date the freeze begins, freeze_end_date: the scheduled resume date}
    triggers:
      - event: membership:membership_freeze_logged
        map: {membership_id: membership_id, customer_id: customer_id}
  - type: membership_resumed
    target: membership_holdings
    mutation: {transition: {from: frozen, to: active}}
    meaning: a freeze ends and normal billing resumes
    grain: one row per resume
    fields: {membership_id: the contract resumed, customer_id: the member, status: lifecycle state, freeze_start_date: cleared on resume, freeze_end_date: cleared on resume}
    triggers: []
  - type: membership_marked_past_due
    target: membership_holdings
    mutation: {transition: {from: active, to: past_due}}
    meaning: a scheduled dues charge fails to collect and the membership is marked past_due
    grain: one row per past-due marking
    fields: {membership_id: the contract marked, customer_id: the member, status: lifecycle state, past_due_since_date: the date marked past_due}
    triggers:
      - event: membership:membership_dues_charge
        map: {membership_id: membership_id, customer_id: customer_id, charge_type: late_fee}
  - type: membership_reactivated
    target: membership_holdings
    mutation: {transition: {from: past_due, to: active}}
    meaning: the outstanding balance is paid and the membership is brought current
    grain: one row per reactivation
    fields: {membership_id: the contract reactivated, customer_id: the member, status: lifecycle state, past_due_since_date: cleared on reactivation}
    triggers: []
  - type: membership_cancellation_requested
    target: membership_holdings
    mutation: {transition: [{from: active, to: cancel_pending}, {from: frozen, to: cancel_pending}]}
    meaning: the member gives notice of cancellation, opening the notice period
    grain: one row per cancellation notice given
    fields: {membership_id: the contract, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: membership_cancellation_withdrawn
    target: membership_holdings
    mutation: {transition: {from: cancel_pending, to: active}}
    meaning: the member withdraws the cancellation request before it takes effect
    grain: one row per withdrawal
    fields: {membership_id: the contract, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: membership_closed
    target: membership_holdings
    mutation: {transition: [{from: past_due, to: closed}, {from: cancel_pending, to: closed}]}
    meaning: the membership contract ends, either administratively for non-payment or because a cancellation took effect
    grain: one row per closure
    fields: {membership_id: the contract closed, customer_id: the member, status: lifecycle state, closed_date: the date closed}
    triggers:
      - event: addon:addon_removed
        map: {customer_id: customer_id}
  - type: membership_dues_charge
    target: membership_events
    meaning: a recurring dues charge or a one-time fee (enrollment, late, early termination) is billed to the member
    grain: one row per billing-cycle dues charge or per one-time fee charge
    distinguish_by: [charge_type, billing_cycle_month, event_timestamp]
    account: dues_balance_account
    direction: in
    fields: {event_id: primary reference of the row, membership_id: the contract billed, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount charged, charge_type: the billing subtype, billing_cycle_month: the cycle covered by a recurring charge, channel: how the charge was captured}
    triggers: []
  - type: membership_payment_received
    target: membership_events
    meaning: the member's payment is applied against the outstanding dues balance
    grain: one row per payment transaction
    distinguish_by: [event_timestamp, channel]
    account: dues_balance_account
    direction: out
    fields: {event_id: primary reference of the row, membership_id: the contract paid, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount paid, channel: how the payment was made}
    triggers: []
  - type: membership_dues_waived
    target: membership_events
    meaning: staff waive some or all of the member's outstanding balance
    grain: one row per waiver granted
    distinguish_by: [event_timestamp]
    account: dues_balance_account
    direction: out
    fields: {event_id: primary reference of the row, membership_id: the contract waived, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, amount_usd: the dollar amount waived}
    triggers: []
  - type: membership_guest_pass_granted
    target: membership_events
    meaning: the member's monthly complimentary guest-visit allowance is granted for the new billing cycle
    grain: one row per monthly allowance grant
    distinguish_by: [billing_cycle_month, event_timestamp]
    account: guest_pass_account
    direction: in
    fields: {event_id: primary reference of the row, membership_id: the contract, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, billing_cycle_month: the cycle the allowance covers}
    triggers: []
  - type: membership_guest_visit_used
    target: membership_events
    meaning: a guest is checked in against the member's complimentary guest-visit allowance
    grain: one row per guest checked in
    distinguish_by: [club_id, guest_name, event_timestamp]
    account: guest_pass_account
    direction: out
    fields: {event_id: primary reference of the row, membership_id: the contract, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, club_id: the club the guest visited, guest_name: the guest's name as stated at the front desk}
    triggers: []
  - type: membership_freeze_logged
    target: membership_events
    meaning: a history row recording that a freeze was initiated, kept for rolling freeze-count purposes
    grain: one row per freeze initiated
    distinguish_by: [event_timestamp]
    fields: {event_id: primary reference of the row, membership_id: the contract frozen, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded}
    triggers: []
  - type: membership_checkin
    target: membership_events
    meaning: the member checks in for a visit at a club
    grain: one row per visit/check-in
    distinguish_by: [club_id, event_timestamp]
    fields: {event_id: primary reference of the row, membership_id: the contract, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, club_id: the club visited}
    triggers: []

measures:
  - id: membership_msr_freezes_last_12mo
    window: rolling 365 days ending at frozen_time
    measure: count of membership_freeze_logged events for the membership_id

policies:
  - id: membership_agg_multi_holding
    subject: [membership_signup, membership_application_withdrawn]
    rule: A member may hold only a single club membership contract that is not closed at any time; a new signup is not permitted while an existing membership contract for that member remains in any status other than closed.
    eligibility: []
    params:
      max_per_customer: 1

  - id: membership_tier_dues_billing
    subject: [membership_dues_charge, membership_activated, membership_marked_past_due, membership_reactivated, membership_dues_waived]
    rule: >
      Each billing cycle the member is charged their tier's monthly_dues_usd as a recurring_dues charge; at activation the member is additionally charged the tier's enrollment_fee_usd as an enrollment_fee charge and, once per contract year on the anniversary of opened_date, the tier's annual_facility_fee_usd. A membership_dues_charge may be written only while the membership contract exists and has not yet closed, covering the applied state at signup through active, frozen, past_due and cancel_pending, since a final prorated charge may still be billed while a cancellation notice is pending.
    eligibility:
      - id: dues_charge_requires_open_contract
        applies_to: [membership_dues_charge]
        kind: state
        condition: A membership_dues_charge may be written only while the membership contract exists and has not yet closed, covering the applied state at signup through active, frozen, past_due and cancel_pending, since a final prorated charge may still be billed while a cancellation notice is pending.
        evidence_fields: [membership_holdings.membership_id, membership_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_holdings.membership_id]]
          action_bindings: {membership_holdings.membership_id: membership_id}
        state_contract:
          field: membership_holdings.status
          allowed: [applied, active, frozen, past_due, cancel_pending]
    params:
      per_tier:
        Base Club Access: {monthly_dues_usd: "=monthly_dues_usd", enrollment_fee_usd: "=enrollment_fee_usd", annual_facility_fee_usd: "=annual_facility_fee_usd"}
        Student Metro Access: {monthly_dues_usd: "=monthly_dues_usd", enrollment_fee_usd: "=enrollment_fee_usd", annual_facility_fee_usd: "=annual_facility_fee_usd"}
        Off-Peak Metro Access: {monthly_dues_usd: "=monthly_dues_usd", enrollment_fee_usd: "=enrollment_fee_usd", annual_facility_fee_usd: "=annual_facility_fee_usd"}
        Metro Multi-Club Access: {monthly_dues_usd: "=monthly_dues_usd", enrollment_fee_usd: "=enrollment_fee_usd", annual_facility_fee_usd: "=annual_facility_fee_usd"}
        Premier All-Access: {monthly_dues_usd: "=monthly_dues_usd", enrollment_fee_usd: "=enrollment_fee_usd", annual_facility_fee_usd: "=annual_facility_fee_usd"}
        Black Card All-Access: {monthly_dues_usd: "=monthly_dues_usd", enrollment_fee_usd: "=enrollment_fee_usd", annual_facility_fee_usd: "=annual_facility_fee_usd"}
        Founding Legacy Access: {monthly_dues_usd: "=monthly_dues_usd", enrollment_fee_usd: "=enrollment_fee_usd", annual_facility_fee_usd: "=annual_facility_fee_usd"}
    formula:
      when: charge_type == "recurring_dues"
      amount_usd: monthly_dues_usd

  - id: membership_payment_application
    subject: [membership_payment_received]
    rule: A payment is applied against the member's dues_balance on the date it is received; the same payment must not be posted twice for the same membership at the same recorded moment.
    eligibility:
      - id: no_duplicate_payment_posting
        applies_to: [membership_payment_received]
        kind: dedup
        condition: the same payment must not be posted twice for the same membership at the same recorded moment
        evidence_fields: [membership_events.membership_id, membership_events.event_type, membership_events.event_timestamp]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_events.membership_id]]
          action_bindings: {membership_events.membership_id: membership_id}
        dedup_contract:
          table: membership_events
          mode: separate_record
          object_bindings: {membership_id: membership_id}
          duplicate_filters: {event_type: [membership_payment_received]}
          distinct_fields: [event_timestamp, amount_usd]
    params: {}

  - id: membership_freeze_policy
    subject: [membership_frozen, membership_resumed, membership_freeze_logged]
    rule: >
      A freeze may last up to freeze_max_duration_days and is charged freeze_fee_usd unless dues_waiver_medical_hold_allowed applies to a documented medical hold, in which case the fee is waived; a member may not initiate more freezes in a rolling 12-month window than freeze_max_per_rolling_year, counting every membership_freeze_logged event for that membership_id in the trailing 365 days ending at frozen_time. Dues continue to accrue during a freeze unless the medical-hold waiver applies.
    eligibility: []
    measures: [membership_msr_freezes_last_12mo]
    params:
      per_tier:
        Base Club Access: {freeze_max_duration_days: "=freeze_max_duration_days", freeze_max_per_rolling_year: "=freeze_max_per_rolling_year", freeze_fee_usd: "=freeze_fee_usd"}
        Student Metro Access: {freeze_max_duration_days: "=freeze_max_duration_days", freeze_max_per_rolling_year: "=freeze_max_per_rolling_year", freeze_fee_usd: "=freeze_fee_usd"}
        Off-Peak Metro Access: {freeze_max_duration_days: "=freeze_max_duration_days", freeze_max_per_rolling_year: "=freeze_max_per_rolling_year", freeze_fee_usd: "=freeze_fee_usd"}
        Metro Multi-Club Access: {freeze_max_duration_days: "=freeze_max_duration_days", freeze_max_per_rolling_year: "=freeze_max_per_rolling_year", freeze_fee_usd: "=freeze_fee_usd"}
        Premier All-Access: {freeze_max_duration_days: "=freeze_max_duration_days", freeze_max_per_rolling_year: "=freeze_max_per_rolling_year", freeze_fee_usd: "=freeze_fee_usd"}
        Black Card All-Access: {freeze_max_duration_days: "=freeze_max_duration_days", freeze_max_per_rolling_year: "=freeze_max_per_rolling_year", freeze_fee_usd: "=freeze_fee_usd"}
        Founding Legacy Access: {freeze_max_duration_days: "=freeze_max_duration_days", freeze_max_per_rolling_year: "=freeze_max_per_rolling_year", freeze_fee_usd: "=freeze_fee_usd"}

  - id: membership_past_due_closure
    subject: [membership_closed]
    rule: >
      A past_due membership may be administratively closed only once past_due_grace_period_days have elapsed since the membership was marked past due, counted as full calendar days from past_due_since_date with no partial-day rounding; frozen_time must not be earlier than past_due_since_date plus past_due_grace_period_days for the closure to be recorded.
    eligibility:
      - id: grace_period_elapsed
        applies_to: [membership_closed]
        kind: time
        condition: A past_due membership may be administratively closed only once past_due_grace_period_days have elapsed since the membership was marked past due, counted as full calendar days from past_due_since_date with no partial-day rounding
        evidence_fields: [membership_holdings.membership_id, membership_holdings.status, membership_holdings.past_due_since_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_holdings.membership_id]]
          action_bindings: {membership_holdings.membership_id: membership_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the membership was marked past due
          anchor_source: membership_holdings.past_due_since_date
          relation: not_before
          duration_source: params.past_due_grace_period_days
          unit: calendar_days
          counting_rule: counted as full calendar days from past_due_since_date with no partial-day rounding
          boundary: inclusive
    params:
      per_tier:
        Base Club Access: {past_due_grace_period_days: "=past_due_grace_period_days"}
        Student Metro Access: {past_due_grace_period_days: "=past_due_grace_period_days"}
        Off-Peak Metro Access: {past_due_grace_period_days: "=past_due_grace_period_days"}
        Metro Multi-Club Access: {past_due_grace_period_days: "=past_due_grace_period_days"}
        Premier All-Access: {past_due_grace_period_days: "=past_due_grace_period_days"}
        Black Card All-Access: {past_due_grace_period_days: "=past_due_grace_period_days"}
        Founding Legacy Access: {past_due_grace_period_days: "=past_due_grace_period_days"}
    # NOTE: past_due_grace_period_days is not in this policy's own params/per_tier keys registry unless
    # referenced here; declared above so duration_source resolves against a policy param.

  - id: membership_cancellation_notice
    subject: [membership_cancellation_requested, membership_closed, membership_cancellation_withdrawn]
    rule: >
      A cancellation becomes effective only once cancellation_notice_days have elapsed since the customer gives notice of this cancellation, counted as full calendar days from the moment logged in membership_cancellation_requests.created_at, with the boundary day itself counting as satisfied; frozen_time must not be earlier than that anchor plus cancellation_notice_days for the closure to be recorded. The member may withdraw the request at any point before that boundary is reached.
    eligibility:
      - id: notice_period_satisfied
        applies_to: [membership_closed]
        kind: time
        condition: A cancellation becomes effective only once cancellation_notice_days have elapsed since the customer gives notice of this cancellation, counted as full calendar days from the moment logged in membership_cancellation_requests.created_at, with the boundary day itself counting as satisfied
        evidence_fields: [membership_cancellation_requests.membership_id, membership_cancellation_requests.created_at, membership_cancellation_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_cancellation_requests.membership_id]]
          action_bindings: {membership_cancellation_requests.membership_id: membership_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the customer gives notice of this cancellation
          anchor_source: membership_cancellation_requests.created_at
          relation: not_before
          duration_source: variants.cancellation_notice_days
          unit: calendar_days
          counting_rule: counted as full calendar days from the moment logged in membership_cancellation_requests.created_at, with the boundary day itself counting as satisfied
          boundary: inclusive
    params: {}

  - id: membership_early_termination_fee
    subject: [membership_dues_charge]
    rule: >
      An early_termination_fee charge is billed only when the customer gives notice of this cancellation before minimum_term_months have elapsed since the membership was opened, minimum_term_months counted as full calendar months from opened_date completing on the same day-of-month (or the last day of that month if opened_date's day does not exist in it); frozen_time must not be later than opened_date plus minimum_term_months for the fee to apply, and the fee is waived entirely when relocation_termination_fee_waived applies to a documented relocation beyond relocation_radius_miles.
    eligibility:
      - id: within_minimum_term
        applies_to: [membership_dues_charge]
        kind: time
        condition: An early_termination_fee charge is billed only when the customer gives notice of this cancellation before minimum_term_months have elapsed since the membership was opened, minimum_term_months counted as full calendar months from opened_date completing on the same day-of-month (or the last day of that month if opened_date's day does not exist in it)
        evidence_fields: [membership_holdings.membership_id, membership_holdings.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_holdings.membership_id]]
          action_bindings: {membership_holdings.membership_id: membership_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the membership was opened
          anchor_source: membership_holdings.opened_date
          relation: not_after
          duration_source: variants.minimum_term_months
          unit: calendar_months
          counting_rule: minimum_term_months counted as full calendar months from opened_date completing on the same day-of-month (or the last day of that month if opened_date's day does not exist in it)
          boundary: exclusive
    params:
      per_tier:
        Base Club Access: {early_termination_fee_usd: "=early_termination_fee_usd"}
        Student Metro Access: {early_termination_fee_usd: "=early_termination_fee_usd"}
        Off-Peak Metro Access: {early_termination_fee_usd: "=early_termination_fee_usd"}
        Metro Multi-Club Access: {early_termination_fee_usd: "=early_termination_fee_usd"}
        Premier All-Access: {early_termination_fee_usd: "=early_termination_fee_usd"}
        Black Card All-Access: {early_termination_fee_usd: "=early_termination_fee_usd"}
        Founding Legacy Access: {early_termination_fee_usd: "=early_termination_fee_usd"}

  - id: membership_guest_pass_policy
    subject: [membership_guest_pass_granted, membership_guest_visit_used]
    rule: >
      Each billing cycle the member's guest_pass_account is granted guest_passes_per_month visits; a guest visit beyond the remaining allowance is charged guest_pass_overage_fee_usd instead of being refused, and no single visit may bring more guests than max_guests_per_visit. A guest visit may be recorded only while the membership is active.
    eligibility:
      - id: guest_visit_requires_active_membership
        applies_to: [membership_guest_visit_used]
        kind: state
        condition: A guest visit may be recorded only while the membership is active.
        evidence_fields: [membership_holdings.membership_id, membership_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_holdings.membership_id]]
          action_bindings: {membership_holdings.membership_id: membership_id}
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    params:
      per_tier:
        Base Club Access: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_overage_fee_usd: "=guest_pass_overage_fee_usd", max_guests_per_visit: "=max_guests_per_visit"}
        Student Metro Access: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_overage_fee_usd: "=guest_pass_overage_fee_usd", max_guests_per_visit: "=max_guests_per_visit"}
        Off-Peak Metro Access: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_overage_fee_usd: "=guest_pass_overage_fee_usd", max_guests_per_visit: "=max_guests_per_visit"}
        Metro Multi-Club Access: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_overage_fee_usd: "=guest_pass_overage_fee_usd", max_guests_per_visit: "=max_guests_per_visit"}
        Premier All-Access: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_overage_fee_usd: "=guest_pass_overage_fee_usd", max_guests_per_visit: "=max_guests_per_visit"}
        Black Card All-Access: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_overage_fee_usd: "=guest_pass_overage_fee_usd", max_guests_per_visit: "=max_guests_per_visit"}
        Founding Legacy Access: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_overage_fee_usd: "=guest_pass_overage_fee_usd", max_guests_per_visit: "=max_guests_per_visit"}

  - id: membership_access_scope_policy
    subject: [membership_checkin]
    rule: >
      A single_club home_club_access_scope member checking in at a club other than their home_club_id is charged multi_club_visit_fee_usd for that visit; an all_club member may check in at any club at no extra charge. An off_peak_hours_only member checking in outside the off_peak_window is not refused entry but the visit is not covered by the membership and must be handled as a walk-in charged at multi_club_visit_fee_usd. Only checkin_daily_limit check-ins per calendar day count toward usage statistics; additional same-day check-ins are still logged but not double-counted.
    eligibility: []
    params:
      per_tier:
        Base Club Access: {home_club_access_scope: "=home_club_access_scope", off_peak_hours_only: "=off_peak_hours_only", multi_club_visit_fee_usd: "=multi_club_visit_fee_usd", checkin_daily_limit: "=checkin_daily_limit"}
        Student Metro Access: {home_club_access_scope: "=home_club_access_scope", off_peak_hours_only: "=off_peak_hours_only", multi_club_visit_fee_usd: "=multi_club_visit_fee_usd", checkin_daily_limit: "=checkin_daily_limit"}
        Off-Peak Metro Access: {home_club_access_scope: "=home_club_access_scope", off_peak_hours_only: "=off_peak_hours_only", multi_club_visit_fee_usd: "=multi_club_visit_fee_usd", checkin_daily_limit: "=checkin_daily_limit"}
        Metro Multi-Club Access: {home_club_access_scope: "=home_club_access_scope", off_peak_hours_only: "=off_peak_hours_only", multi_club_visit_fee_usd: "=multi_club_visit_fee_usd", checkin_daily_limit: "=checkin_daily_limit"}
        Premier All-Access: {home_club_access_scope: "=home_club_access_scope", off_peak_hours_only: "=off_peak_hours_only", multi_club_visit_fee_usd: "=multi_club_visit_fee_usd", checkin_daily_limit: "=checkin_daily_limit"}
        Black Card All-Access: {home_club_access_scope: "=home_club_access_scope", off_peak_hours_only: "=off_peak_hours_only", multi_club_visit_fee_usd: "=multi_club_visit_fee_usd", checkin_daily_limit: "=checkin_daily_limit"}
        Founding Legacy Access: {home_club_access_scope: "=home_club_access_scope", off_peak_hours_only: "=off_peak_hours_only", multi_club_visit_fee_usd: "=multi_club_visit_fee_usd", checkin_daily_limit: "=checkin_daily_limit"}

  - id: membership_corporate_bundling
    subject: [membership_dues_charge]
    rule: >
      A member who is the customer of an active corporate wellness enrollment receives that enrollment's tier corporate_partner_discount_pct off monthly_dues_usd on each recurring_dues charge; this discount does not stack with multi_month_prepay_discount_pct on the same charge — only the higher of the two percentages applies. The discount applies only while the linked corporate wellness enrollment is active.
    eligibility:
      - id: corporate_discount_requires_active_enrollment
        applies_to: [membership_dues_charge]
        kind: state
        condition: The discount applies only while the linked corporate wellness enrollment is active.
        evidence_fields: [corporate_wellness_enrollments.status, corporate_wellness_enrollments.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[corporate_wellness_enrollments.customer_id]]
          action_bindings: {corporate_wellness_enrollments.customer_id: customer_id}
        state_contract:
          field: corporate_wellness_enrollments.status
          allowed: [active]
    params:
      per_tier:
        Base Club Access: {corporate_partner_discount_pct: "=corporate_partner_discount_pct", multi_month_prepay_discount_pct: "=multi_month_prepay_discount_pct"}
        Student Metro Access: {corporate_partner_discount_pct: "=corporate_partner_discount_pct", multi_month_prepay_discount_pct: "=multi_month_prepay_discount_pct"}
        Off-Peak Metro Access: {corporate_partner_discount_pct: "=corporate_partner_discount_pct", multi_month_prepay_discount_pct: "=multi_month_prepay_discount_pct"}
        Metro Multi-Club Access: {corporate_partner_discount_pct: "=corporate_partner_discount_pct", multi_month_prepay_discount_pct: "=multi_month_prepay_discount_pct"}
        Premier All-Access: {corporate_partner_discount_pct: "=corporate_partner_discount_pct", multi_month_prepay_discount_pct: "=multi_month_prepay_discount_pct"}
        Black Card All-Access: {corporate_partner_discount_pct: "=corporate_partner_discount_pct", multi_month_prepay_discount_pct: "=multi_month_prepay_discount_pct"}
        Founding Legacy Access: {corporate_partner_discount_pct: "=corporate_partner_discount_pct", multi_month_prepay_discount_pct: "=multi_month_prepay_discount_pct"}

# ============================================================================
# extended_policies (erl-task-instantiate: env/metro_gym_chain/tasks/membership_lifecycle)
# ============================================================================
extended_policies:
  - id: membership_ext_enrollment_fee
    base_policy_refs: [membership_tier_dues_billing, membership_corporate_bundling, membership_early_termination_fee]
    overwrite: []
    trigger: state_due
    subject: [membership_dues_charge]
    computes: amount_usd
    target_tool: charge_enrollment_fee_91320c6d
    rule: >
      At activation, or at any later point at which it is discovered that a membership's one-time
      enrollment_fee_usd charge for its own contract was never posted to the ledger, the enrollment_fee
      charge is billed in the tier's listed enrollment_fee_usd amount, reduced according to the member's
      linked corporate wellness enrollment, where one exists and is active. Where the member is the
      customer of an active corporate wellness enrollment, the enrollment_fee charge is reduced by the
      linked employer partnership tier's own employer_discount_pct, combined additively with that same
      employer partnership tier's own multi_location_discount_pct, and the combined percentage is applied
      once to the tier's original enrollment_fee_usd base, never applied in successive steps; where no
      active corporate wellness enrollment exists, no reduction applies and the full enrollment_fee_usd
      amount is billed. The resulting amount is rounded to 2 decimal places only at the end of the
      calculation, with no intermediate rounding, and is never billed as a negative amount.
    prerequisite: []
    cross_category:
      - category: corp
        as: branch
        reads: [status, employer_discount_pct, multi_location_discount_pct]
        note: An active corporate wellness enrollment's own employer_discount_pct, combined with its own multi_location_discount_pct, reduces the enrollment fee amount billed.
    compute:
      - base_fee: "P('enrollment_fee_usd')"
      - corp_active: "EXISTS('corp', status='active')"
      - employer_pct: "CPARAM('corp','employer_discount_pct') if corp_active else 0"
      - multi_loc_pct: "CPARAM('corp','multi_location_discount_pct') if corp_active else 0"
      - result: "RND(MX(base_fee*(1-(employer_pct+multi_loc_pct)/100),0),2)"
    compute_basis:
      employer_pct: "the enrollment_fee charge is reduced by the linked employer partnership tier's own employer_discount_pct, combined additively with that same employer partnership tier's own multi_location_discount_pct"
      multi_loc_pct: "combined additively with that same employer partnership tier's own multi_location_discount_pct"
      result: "The resulting amount is rounded to 2 decimal places only at the end of the calculation, with no intermediate rounding, and is never billed as a negative amount"
    inputs:
      history: []
      cross_category: [corp]

  - id: membership_ext_recurring_dues
    base_policy_refs: [membership_tier_dues_billing, membership_corporate_bundling, membership_early_termination_fee]
    overwrite:
      - base_policy: membership_corporate_bundling
        superseded_clause: "receives that enrollment's tier corporate_partner_discount_pct off monthly_dues_usd on each recurring_dues charge"
        replaced_by: "The discount percentage applied is the higher of two candidates, evaluated independently and then combined by taking the maximum, never applied successively: (a) the linked employer partnership enrollment's own employer_discount_pct, read from the corporate wellness charter for the enrollment's own partnership tier"
      - base_policy: membership_corporate_bundling
        superseded_clause: "this discount does not stack with multi_month_prepay_discount_pct on the same charge"
        replaced_by: "Since a recurring_dues charge bills one monthly cycle at a time rather than a lump-sum prepayment, multi_month_prepay_discount_pct never enters this comparison for a recurring_dues charge"
    trigger: state_due
    subject: [membership_dues_charge]
    computes: amount_usd
    target_tool: charge_recurring_dues_93751e4d
    rule: >
      Each recurring_dues charge is billed in the amount of the member's tier monthly_dues_usd, reduced
      once by a single discount percentage applied directly to that original monthly_dues_usd base, never
      to any previously discounted amount, since a recurring_dues charge is a standalone monthly billing
      event with no discount already layered onto it within the same charge. The discount percentage
      applied is the higher of two candidates, evaluated independently and then combined by taking the
      maximum, never applied successively: (a) the linked employer partnership enrollment's own
      employer_discount_pct, read from the corporate wellness charter for the enrollment's own partnership
      tier, which applies only while that corporate wellness enrollment's status is active and the member
      is its customer, and which is 0 where no such active enrollment exists; and (b) the member's own
      membership tier's student_discount_pct, which is 0 for every tier other than Student Metro Access.
      Since a recurring_dues charge bills one monthly cycle at a time rather than a lump-sum prepayment,
      multi_month_prepay_discount_pct never enters this comparison for a recurring_dues charge. The
      resulting charge amount is the original monthly_dues_usd multiplied by one minus the chosen discount
      percentage divided by 100, rounded to 2 decimal places only at the end of the calculation, with no
      intermediate rounding.
    prerequisite: []
    cross_category:
      - category: corp
        as: branch
        reads: [status, employer_discount_pct]
        note: An active corporate wellness enrollment's own tier discount is compared against the member's own tier student discount, and the higher of the two applies.
    compute:
      - base_amt: "P('monthly_dues_usd')"
      - corp_active: "EXISTS('corp', status='active')"
      - employer_pct: "CPARAM('corp','employer_discount_pct') if corp_active else 0"
      - student_pct: "P('student_discount_pct')"
      - result: "RND(base_amt*(1-MX(employer_pct,student_pct)/100),2)"
    compute_basis:
      employer_pct: "the linked employer partnership enrollment's own employer_discount_pct, read from the corporate wellness charter for the enrollment's own partnership tier, which applies only while that corporate wellness enrollment's status is active and the member is its customer, and which is 0 where no such active enrollment exists"
      student_pct: "the member's own membership tier's student_discount_pct, which is 0 for every tier other than Student Metro Access"
      result: "The discount percentage applied is the higher of two candidates, evaluated independently and then combined by taking the maximum, never applied successively"
    inputs:
      history: []
      cross_category: [corp]

  - id: membership_ext_dues_waiver_medical_hold
    base_policy_refs: [membership_tier_dues_billing]
    overwrite: []
    trigger: on_request
    subject: [membership_dues_waived]
    computes: amount_usd
    target_tool: waive_dues_medical_hold_6b86f7b6
    rule: >
      While a membership contract is frozen for a documented medical hold that the representative has
      confirmed with the member, dues_waiver_medical_hold_allowed permits the club to waive the member's
      full outstanding dues_balance rather than only the portion the member has already paid down. The
      outstanding balance to be waived is computed as the sum of every dues charge amount ever billed to the
      contract as an enrollment fee or recurring dues charge (the two catch-up
      charge types this policy's own prerequisites resolve; a late_fee or early_termination_fee charge on
      this same contract, being itself the scored amount of a different problem, is never folded into this
      sum), minus the sum of every membership_payment_received amount ever applied
      to the contract, minus the sum of every membership_dues_waived amount already granted to the
      contract, evaluated at the moment the waiver is processed so that any catch-up charge posted earlier
      in the same consultation is included. Where the member is also the customer of an active corporate
      wellness enrollment, that employer partnership's own employer_discount_pct, combined additively with
      that same partnership tier's own multi_location_discount_pct, is treated as the employer-funded share
      of the outstanding balance and is applied once, as a single combined percentage, to the outstanding
      balance computed above; the club's own waiver posted to membership_dues_waived is the outstanding
      balance minus that employer-funded share, rounded to 2 decimal places only at the end of the
      calculation, with no intermediate rounding, and is never billed as a negative amount.
    prerequisite:
      - problem: membership_ext_enrollment_fee
        kind: value_input
        gate: enrollment_posted
        condition: the one-time enrollment fee charge for this contract must already be posted to the ledger before the outstanding balance available to waive is computed
        policy_source: "The outstanding balance to be waived is computed as the sum of every dues charge amount ever billed to the contract as an enrollment fee or recurring dues charge"
        resolved_by: charge_enrollment_fee_91320c6d
        effect: the enrollment_posted factor of this policy's compute changes from 0 to the newly posted enrollment_fee amount
      - problem: membership_ext_recurring_dues
        kind: value_input
        gate: recurring_posted
        condition: this billing cycle's recurring dues charge for this contract must already be posted to the ledger before the outstanding balance available to waive is computed
        policy_source: "evaluated at the moment the waiver is processed so that any catch-up charge posted earlier in the same consultation is included"
        resolved_by: charge_recurring_dues_93751e4d
        effect: the recurring_posted factor of this policy's compute changes from 0 to the newly posted recurring_dues amount
    cross_category:
      - category: corp
        as: branch
        reads: [status, employer_discount_pct, multi_location_discount_pct]
        note: An active corporate wellness enrollment funds part of the outstanding balance via its employer_discount_pct and multi_location_discount_pct, reducing the club's own waiver amount.
    compute:
      - enrollment_posted: "SUM('membership_events','amount_usd', event_type='membership_dues_charge', charge_type='enrollment_fee')"
      - recurring_posted: "SUM('membership_events','amount_usd', event_type='membership_dues_charge', charge_type='recurring_dues')"
      - total_charges: "enrollment_posted + recurring_posted"
      - payments_received: "SUM('membership_events','amount_usd', event_type='membership_payment_received')"
      - prior_waivers: "SUM('membership_events','amount_usd', event_type='membership_dues_waived')"
      - outstanding_balance: "total_charges - payments_received - prior_waivers"
      - corp_active: "EXISTS('corp', status='active')"
      - employer_pct: "CPARAM('corp','employer_discount_pct') if corp_active else 0"
      - multi_loc_pct: "CPARAM('corp','multi_location_discount_pct') if corp_active else 0"
      - employer_funded: "RND(outstanding_balance*(employer_pct+multi_loc_pct)/100,2)"
      - result: "RND(MX(outstanding_balance - employer_funded,0),2)"
    compute_basis:
      enrollment_posted: "the sum of every dues charge amount ever billed to the contract as an enrollment fee or recurring dues charge"
      recurring_posted: "the sum of every dues charge amount ever billed to the contract as an enrollment fee or recurring dues charge"
      payments_received: "minus the sum of every membership_payment_received amount ever applied to the contract"
      prior_waivers: "minus the sum of every membership_dues_waived amount already granted to the contract"
      outstanding_balance: "evaluated at the moment the waiver is processed so that any catch-up charge posted earlier in the same consultation is included"
      employer_pct: "that employer partnership's own employer_discount_pct, combined additively with that same partnership tier's own multi_location_discount_pct, is treated as the employer-funded share of the outstanding balance and is applied once, as a single combined percentage"
      multi_loc_pct: "combined additively with that same partnership tier's own multi_location_discount_pct"
      employer_funded: "is treated as the employer-funded share of the outstanding balance and is applied once, as a single combined percentage, to the outstanding balance computed above"
      result: "the club's own waiver posted to membership_dues_waived is the outstanding balance minus that employer-funded share, rounded to 2 decimal places only at the end of the calculation, with no intermediate rounding, and is never billed as a negative amount"
    inputs:
      history:
        - {table: membership_events, aggregate: sum, field: amount_usd, filters: {event_type: membership_dues_charge, charge_type: enrollment_fee}}
        - {table: membership_events, aggregate: sum, field: amount_usd, filters: {event_type: membership_dues_charge, charge_type: recurring_dues}}
        - {table: membership_events, aggregate: sum, field: amount_usd, filters: {event_type: membership_payment_received}}
        - {table: membership_events, aggregate: sum, field: amount_usd, filters: {event_type: membership_dues_waived}}
      cross_category: [corp]

  - id: membership_ext_late_fee
    base_policy_refs: [membership_tier_dues_billing, membership_corporate_bundling, membership_early_termination_fee]
    overwrite:
      - base_policy: membership_corporate_bundling
        superseded_clause: "on each recurring_dues charge"
        replaced_by: "this policy extends that same class of employer benefit, through a different corp parameter, to a late_fee charge, which corporate_bundling's own rule never reaches"
    trigger: state_due
    subject: [membership_dues_charge]
    computes: amount_usd
    target_tool: charge_late_fee_8963437d
    rule: >
      No base policy's rule states any formula for a late_fee charge's amount at all; unlike
      monthly_dues_usd, enrollment_fee_usd and annual_facility_fee_usd, each of which
      membership_tier_dues_billing's own rule ties explicitly to the tier's flat parameter by name,
      late_fee_usd is left to this policy alone to govern, and this policy's result -- never the bare tier
      parameter read on its own -- is the exclusive final billed amount. When a scheduled recurring_dues
      charge fails to collect and the membership is marked past_due, a late_fee charge is billed in the
      tier's late_fee_usd base amount. Where the member has already incurred one or more prior late_fee
      charges within the trailing 12 months ending at frozen_time, counting every membership_dues_charge
      event of billing subtype late_fee for this membership_id in that window, the base late_fee_usd amount
      is increased by 50 percent (multiplied by 1.5) as a repeat-delinquency escalation, applied to the
      tier's original late_fee_usd base before any employer reduction; where there is no such prior
      late_fee charge in that window, no escalation applies and the base late_fee_usd amount stands -- the
      only case in which this policy's result numerically coincides with the tier's bare parameter, since
      no escalation or corporate reimbursement factor is then active. corporate_bundling's own base rule
      grants its comparable employer-funded reduction only "on each recurring_dues charge"; this policy
      extends that same class of employer benefit, through a different corp parameter, to a late_fee
      charge, which corporate_bundling's own rule never reaches. Where the member is also the customer of
      an active corporate wellness enrollment, that employer partnership's own wellness_reimbursement_pct,
      combined additively with that same partnership tier's own multi_location_discount_pct, reduces the
      escalated late fee amount by that combined percentage, capped so the dollar reduction never exceeds
      the employer tier's own wellness_reimbursement_annual_cap_usd for this single charge; the final late
      fee amount is the escalated base amount minus that capped reduction, rounded to 2 decimal places only
      at the end of the calculation, with no intermediate rounding, and is never billed as a negative
      amount.
    prerequisite: []
    cross_category:
      - category: corp
        as: branch
        reads: [status, wellness_reimbursement_pct, wellness_reimbursement_annual_cap_usd, multi_location_discount_pct]
        note: An active corporate wellness enrollment partially reimburses the late fee via its wellness_reimbursement_pct, up to its own wellness_reimbursement_annual_cap_usd for this charge.
    compute:
      - base_late: "P('late_fee_usd')"
      - prior_late_count: "COUNT('membership_events', within_months=12, date_field='event_timestamp', event_type='membership_dues_charge', charge_type='late_fee')"
      - escalated: "base_late*1.5 if prior_late_count>=1 else base_late"
      - corp_active: "EXISTS('corp', status='active')"
      - reimb_pct: "CPARAM('corp','wellness_reimbursement_pct') if corp_active else 0"
      - multi_loc_pct: "CPARAM('corp','multi_location_discount_pct') if corp_active else 0"
      - reimb_cap: "CPARAM('corp','wellness_reimbursement_annual_cap_usd') if corp_active else 0"
      - reduction: "MN(RND(escalated*(reimb_pct+multi_loc_pct)/100,2), reimb_cap)"
      - result: "RND(MX(escalated-reduction,0),2)"
    compute_basis:
      prior_late_count: "counting every membership_dues_charge event of billing subtype late_fee for this membership_id in that window"
      escalated: "the base late_fee_usd amount is increased by 50 percent (multiplied by 1.5) as a repeat-delinquency escalation, applied to the tier's original late_fee_usd base before any employer reduction"
      reimb_pct: "that employer partnership's own wellness_reimbursement_pct, combined additively with that same partnership tier's own multi_location_discount_pct, reduces the escalated late fee amount by that combined percentage"
      multi_loc_pct: "combined additively with that same partnership tier's own multi_location_discount_pct"
      reimb_cap: "capped so the dollar reduction never exceeds the employer tier's own wellness_reimbursement_annual_cap_usd for this single charge"
      result: "the final late fee amount is the escalated base amount minus that capped reduction, rounded to 2 decimal places only at the end of the calculation, with no intermediate rounding, and is never billed as a negative amount"
    inputs:
      history:
        - {table: membership_events, aggregate: count, field: event_id, within_months: 12, date_field: event_timestamp, filters: {event_type: membership_dues_charge, charge_type: late_fee}}
      cross_category: [corp]

  - id: membership_ext_reactivation_settlement
    base_policy_refs: [membership_payment_application]
    overwrite: []
    trigger: on_request
    subject: [membership_payment_received]
    computes: amount_usd
    target_tool: pay_reactivation_balance_4f725d24
    rule: >
      To reactivate a past_due membership contract, the member must pay the contract's full current
      dues_balance, evaluated at the moment the reactivation payment is processed so that any late fee
      charge posted earlier in the same consultation is included, plus the tier's reactivation_fee_usd.
      Where the member is also the customer of an active corporate wellness enrollment, that employer
      partnership's own employer_discount_pct, combined additively with that same partnership tier's own
      multi_location_discount_pct, reduces the reactivation_fee_usd portion only, never the underlying
      dues_balance, by that combined percentage; the total amount collected is the current dues_balance plus
      the reactivation_fee_usd reduced by that combined percentage, rounded to 2 decimal places only at the
      end of the calculation, with no intermediate rounding, and is never less than the current dues_balance
      alone.
    prerequisite:
      - problem: membership_ext_late_fee
        kind: value_input
        gate: current_balance
        condition: the current dues balance must reflect any late fee charge already posted for the missed payment before the reactivation payment amount is computed
        policy_source: "evaluated at the moment the reactivation payment is processed so that any late fee charge posted earlier in the same consultation is included"
        resolved_by: charge_late_fee_8963437d
        effect: the current_balance factor of this policy's compute increases by the amount of the late_fee charge once it is posted
    cross_category:
      - category: corp
        as: branch
        reads: [status, employer_discount_pct, multi_location_discount_pct]
        note: An active corporate wellness enrollment's own employer_discount_pct, combined with its own multi_location_discount_pct, reduces the reactivation_fee_usd portion of the amount collected.
    compute:
      - current_balance: "F('dues_balance')"
      - reactivation_fee: "P('reactivation_fee_usd')"
      - corp_active: "EXISTS('corp', status='active')"
      - employer_pct: "CPARAM('corp','employer_discount_pct') if corp_active else 0"
      - multi_loc_pct: "CPARAM('corp','multi_location_discount_pct') if corp_active else 0"
      - fee_reduction: "RND(reactivation_fee*(employer_pct+multi_loc_pct)/100,2)"
      - result: "RND(MX(current_balance + reactivation_fee - fee_reduction, current_balance),2)"
    compute_basis:
      current_balance: "the member must pay the contract's full current dues_balance, evaluated at the moment the reactivation payment is processed so that any late fee charge posted earlier in the same consultation is included"
      employer_pct: "that employer partnership's own employer_discount_pct, combined additively with that same partnership tier's own multi_location_discount_pct, reduces the reactivation_fee_usd portion only, never the underlying dues_balance, by that combined percentage"
      multi_loc_pct: "combined additively with that same partnership tier's own multi_location_discount_pct"
      fee_reduction: "the total amount collected is the current dues_balance plus the reactivation_fee_usd reduced by that combined percentage"
      result: "rounded to 2 decimal places only at the end of the calculation, with no intermediate rounding, and is never less than the current dues_balance alone"
    inputs:
      history: []
      cross_category: [corp]

  - id: membership_ext_early_termination_fee
    base_policy_refs: [membership_tier_dues_billing, membership_corporate_bundling, membership_early_termination_fee]
    overwrite:
      - base_policy: membership_early_termination_fee
        superseded_clause: "the fee is waived entirely when relocation_termination_fee_waived applies to a documented relocation beyond relocation_radius_miles"
        replaced_by: "A documented relocation beyond relocation_radius_miles, since it rests on facts no stored field records, is applied as a separate full waiver of the resulting charge, posted as its own membership_dues_waived entry, rather than as a branch inside this formula, and this policy's own compute never itself reduces the result on that basis"
    trigger: on_request
    subject: [membership_dues_charge]
    computes: amount_usd
    target_tool: charge_early_termination_fee_74e8dbe7
    rule: >
      No base policy's rule states any formula for an early_termination_fee charge's amount either;
      membership_early_termination_fee's own rule governs only eligibility timing and one all-or-nothing
      waiver exception, so this policy is the sole and first rule to determine how much is actually billed
      once eligible, and its result -- never the bare tier parameter read on its own -- is the exclusive
      final amount. An early_termination_fee charge, before it is billed, must have the member currently in
      active or frozen standing rather than past-due standing, since a cancellation request may only be filed from
      active or frozen status; where the membership is past_due, it must first be reactivated before notice
      of cancellation can be given and this charge assessed. Once that notice has been given and the
      membership is not past_due, the charge amount is the tier's early_termination_fee_usd reduced pro
      rata by the fraction of the minimum_term_months that remains unelapsed at frozen_time, counted as
      whole months from opened_date, and is billed only while some whole month remains (a membership at or
      past its minimum term owes no early_termination_fee at all); this policy therefore replaces base's own
      binary, all-or-nothing treatment of the amount -- the fee is waived entirely when
      relocation_termination_fee_waived applies to a documented relocation beyond relocation_radius_miles,
      and otherwise implicitly the full flat tier amount -- with a continuous amount prorated between zero
      and the full fee. A documented relocation beyond relocation_radius_miles, since it rests on facts no
      stored field records, is applied as a separate full waiver of the resulting charge, posted as its own
      membership_dues_waived entry, rather than as a branch inside this formula, and this policy's own
      compute never itself reduces the result on that basis. Where the member is also the customer of an
      active corporate wellness enrollment, that employer partnership's own wellness_reimbursement_pct,
      combined additively with that same partnership tier's own multi_location_discount_pct, reduces the
      prorated amount by that combined percentage, capped so the dollar reduction never exceeds the
      employer tier's own wellness_reimbursement_annual_cap_usd for this single charge; the resulting
      amount is never allowed to exceed the tier's original early_termination_fee_usd, is rounded to 2
      decimal places only at the end of the calculation with no intermediate rounding, and is never billed
      as a negative amount.
    prerequisite:
      - problem: membership_ext_reactivation_settlement
        kind: state_gate
        gate: membership_holdings.status
        condition: the member must currently be in active or frozen standing rather than past-due standing, since a cancellation request may only be filed from active or frozen status
        policy_source: "before it is billed, must have the member currently in active or frozen standing rather than past-due standing, since a cancellation request may only be filed from active or frozen status"
        resolved_by: pay_reactivation_balance_4f725d24
        effect: resolving membership_ext_reactivation_settlement through its own target_tool, pay_reactivation_balance_4f725d24, pays the contract's outstanding balance to zero; membership_holdings.status itself is then flipped from past_due to active by reactivate_membership_73e153df, the workflow's own very next step (governed by this workflow's order_rationale, not by any extended policy's own compute), after which this gate holds
    cross_category:
      - category: corp
        as: branch
        reads: [status, wellness_reimbursement_pct, wellness_reimbursement_annual_cap_usd, multi_location_discount_pct]
        note: An active corporate wellness enrollment partially reimburses the prorated early-termination fee via its wellness_reimbursement_pct, up to its own wellness_reimbursement_annual_cap_usd for this charge.
    compute:
      - full_fee: "P('early_termination_fee_usd')"
      - term_months: "P('minimum_term_months')"
      - months_elapsed: "MONTHS(F('opened_date'), NOW)"
      - months_remaining: "MX(term_months - months_elapsed, 0)"
      - prorated: "RND(full_fee*months_remaining/term_months,2)"
      - corp_active: "EXISTS('corp', status='active')"
      - reimb_pct: "CPARAM('corp','wellness_reimbursement_pct') if corp_active else 0"
      - multi_loc_pct: "CPARAM('corp','multi_location_discount_pct') if corp_active else 0"
      - reimb_cap: "CPARAM('corp','wellness_reimbursement_annual_cap_usd') if corp_active else 0"
      - reduction: "MN(RND(prorated*(reimb_pct+multi_loc_pct)/100,2), reimb_cap)"
      - result: "RND(MX(MN(prorated-reduction, full_fee),0),2)"
    compute_basis:
      months_elapsed: "counted as whole months from opened_date"
      months_remaining: "the charge amount is the tier's early_termination_fee_usd reduced pro rata by the fraction of the minimum_term_months that remains unelapsed at frozen_time"
      prorated: "the charge amount is the tier's early_termination_fee_usd reduced pro rata by the fraction of the minimum_term_months that remains unelapsed at frozen_time"
      reimb_pct: "that employer partnership's own wellness_reimbursement_pct, combined additively with that same partnership tier's own multi_location_discount_pct, reduces the prorated amount by that combined percentage"
      multi_loc_pct: "combined additively with that same partnership tier's own multi_location_discount_pct"
      reimb_cap: "capped so the dollar reduction never exceeds the employer tier's own wellness_reimbursement_annual_cap_usd for this single charge"
      result: "the resulting amount is never allowed to exceed the tier's original early_termination_fee_usd, is rounded to 2 decimal places only at the end of the calculation with no intermediate rounding, and is never billed as a negative amount"
    inputs:
      history: []
      cross_category: [corp]

# ============================================================================
# workflows: exactly one for this difficulty
# ============================================================================
workflows:
  - id: membership_wf_past_due_cancellation_settlement
    scenario: >
      This SOP applies to a club membership contract that is currently past_due and whose member has
      decided, on settling up, to cancel rather than continue; it reconciles the missed payment that caused
      the past_due status, brings the contract back to active standing, records the member's own notice of
      cancellation, and, since the member remains within their tier's minimum committed term, assesses the
      corresponding early-termination fee. Once complete, the contract is current on its billing history,
      back in active status, carries a pending cancellation request awaiting its notice period, and has
      been billed the early-termination fee due at the moment notice was given.
    steps:
      - {tool: charge_late_fee_8963437d, owner: agent, writes: membership_events, subject: membership_dues_charge, base_policy_refs: [membership_tier_dues_billing, membership_corporate_bundling, membership_early_termination_fee], role: settle_missed_payment, computed_by: [membership_ext_late_fee]}
      - {tool: pay_reactivation_balance_4f725d24, owner: agent, writes: membership_events, subject: membership_payment_received, base_policy_refs: [membership_payment_application], role: reactivation_payment, computed_by: [membership_ext_reactivation_settlement]}
      - {tool: reactivate_membership_73e153df, owner: agent, writes: membership_holdings, subject: membership_reactivated, base_policy_refs: [membership_tier_dues_billing], role: reinstate_active_status, computed_by: []}
      - {tool: file_cancellation_notice_df814962, owner: user, writes: membership_holdings, subject: membership_cancellation_requested, base_policy_refs: [membership_cancellation_notice], role: customer_confirmation, computed_by: []}
      - {tool: charge_early_termination_fee_74e8dbe7, owner: agent, writes: membership_events, subject: membership_dues_charge, base_policy_refs: [membership_tier_dues_billing, membership_corporate_bundling, membership_early_termination_fee], role: assess_termination_fee, computed_by: [membership_ext_early_termination_fee]}
    dataflow: []
    order_rationale: >
      Step 0 must precede step 1 because membership_ext_reactivation_settlement's own compute reads the
      contract's current dues_balance, which membership_ext_late_fee's charge changes; posting the late fee
      after the reactivation payment would collect an amount that omits the very fee the member owes,
      permanently understating what was collected. Step 1 must precede step 2 because reactivating the
      contract (moving it from past_due back to active) is only warranted once the outstanding balance
      driving the past_due status has actually been paid down; reactivating first would return the contract
      to active standing while still owing the settlement amount, contradicting the base transition's own
      description of reactivation as occurring once the outstanding balance is paid and the membership is
      brought current. Step 2 must precede step 3 because a cancellation notice may only be filed from
      active or frozen status, never from past_due, per the membership_cancellation_requested event's own
      transition set; filing notice before reactivation would attempt an undefined transition directly from
      past_due to cancel_pending. Step 3 must precede step 4 because membership_ext_early_termination_fee's
      own rule anchors the charge on the moment notice of cancellation is given and requires the member to
      no longer be past_due; assessing the fee before notice exists would bill a charge for an event that
      has not yet occurred.
    prerequisite: []
