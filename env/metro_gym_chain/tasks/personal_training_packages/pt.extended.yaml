events:
  - type: pt_package_purchased
    target: pt_holdings
    mutation: create
    meaning: a member purchases a personal-training package
    grain: one row per package
    fields: {pt_holding_id: primary reference of the package, customer_id: the purchasing member, variant_name: the tier chosen, status: lifecycle state, opened_date: date purchased, expiration_date: the date unused sessions will expire, sessions_remaining: sessions granted at purchase, assigned_trainer_name: the trainer assigned}
    account: pt_session_account
    direction: in
    triggers:
      - event: pt:pt_package_activated
        map: {pt_holding_id: pt_holding_id, customer_id: customer_id}
  - type: pt_package_activated
    target: pt_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: the purchase payment is captured and the package becomes usable
    grain: one row per activation
    fields: {pt_holding_id: the package activated, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: pt_package_paused
    target: pt_holdings
    mutation: {transition: {from: active, to: paused}}
    meaning: the member's request to pause the package is approved
    grain: one row per pause initiated
    fields: {pt_holding_id: the package paused, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: pt_package_resumed
    target: pt_holdings
    mutation: {transition: {from: paused, to: active}}
    meaning: a pause ends and the package resumes
    grain: one row per resume
    fields: {pt_holding_id: the package resumed, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: pt_package_exhausted
    target: pt_holdings
    mutation: {transition: {from: active, to: exhausted}}
    meaning: the last session in the package is redeemed and no sessions remain
    grain: one row per package that runs out
    fields: {pt_holding_id: the package exhausted, customer_id: the member, status: lifecycle state}
    triggers: []
  - type: pt_package_lapsed
    target: pt_holdings
    mutation: {transition: [{from: active, to: expired}, {from: paused, to: expired}]}
    meaning: the expiration date passes while sessions remain unused
    grain: one row per package that lapses
    fields: {pt_holding_id: the package that lapsed, customer_id: the member, status: lifecycle state, closed_date: left empty; the package remains expired rather than closed}
    triggers:
      - event: pt:pt_package_expired
        map: {pt_holding_id: pt_holding_id, customer_id: customer_id}
  - type: pt_package_archived
    target: pt_holdings
    mutation: {transition: [{from: exhausted, to: closed}, {from: expired, to: closed}]}
    meaning: an exhausted or expired package is administratively archived
    grain: one row per archival
    fields: {pt_holding_id: the package archived, customer_id: the member, status: lifecycle state, closed_date: the date archived}
    triggers: []
  - type: pt_package_cancelled
    target: pt_holdings
    mutation: {transition: [{from: active, to: closed}, {from: paused, to: closed}]}
    meaning: the member confirms cancellation and takes a refund of unused sessions
    grain: one row per cancellation
    fields: {pt_holding_id: the package cancelled, customer_id: the member, status: lifecycle state, closed_date: the date cancelled}
    triggers:
      - event: pt:pt_package_refunded
        map: {pt_holding_id: pt_holding_id, customer_id: customer_id}
  - type: pt_session_redeemed
    target: pt_events
    meaning: the member attends a booked session and it is redeemed against the package
    grain: one row per session attended
    distinguish_by: [event_timestamp, trainer_name]
    account: pt_session_account
    direction: out
    fields: {event_id: primary reference of the row, pt_holding_id: the package redeemed against, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: sessions consumed, amount_usd: dollar amount (always 0.00), session_type: the kind of session, trainer_name: the trainer who led the session}
    triggers: []
  - type: pt_session_cancelled_late
    target: pt_events
    meaning: the member cancels a scheduled session within the late-cancellation window, forfeiting the session and incurring the cancellation fee
    grain: one row per late cancellation
    distinguish_by: [event_timestamp]
    account: pt_session_account
    direction: out
    fields: {event_id: primary reference of the row, pt_holding_id: the package the session was forfeited from, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: sessions forfeited, amount_usd: the cancellation fee charged, session_type: the kind of session, trainer_name: the trainer originally assigned}
    triggers: []
  - type: pt_package_refunded
    target: pt_events
    meaning: unused sessions in a cancelled package are refunded and removed from the balance
    grain: one row per refund
    distinguish_by: [event_timestamp]
    account: pt_session_account
    direction: out
    fields: {event_id: primary reference of the row, pt_holding_id: the package refunded, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: sessions removed from the balance, amount_usd: dollar amount refunded, session_type: blank, trainer_name: blank}
    triggers: []
  - type: pt_package_expired
    target: pt_events
    meaning: unused sessions in a lapsed package are forfeited at expiration
    grain: one row per expiration forfeiture
    distinguish_by: [event_timestamp]
    account: pt_session_account
    direction: out
    fields: {event_id: primary reference of the row, pt_holding_id: the package that expired, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: sessions forfeited, amount_usd: dollar amount (always 0.00), session_type: blank, trainer_name: blank}
    triggers: []
  - type: pt_trainer_reassigned
    target: pt_events
    meaning: the trainer assigned to the package is changed
    grain: one row per reassignment
    distinguish_by: [event_timestamp, trainer_name]
    fields: {event_id: primary reference of the row, pt_holding_id: the package reassigned, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: always 0, amount_usd: any reassignment fee charged, session_type: blank, trainer_name: the newly assigned trainer}
    triggers: []
  - type: pt_bonus_session_granted
    target: pt_events
    meaning: staff grant a goodwill bonus session to the package
    grain: one row per bonus grant
    distinguish_by: [event_timestamp]
    account: pt_session_account
    direction: in
    fields: {event_id: primary reference of the row, pt_holding_id: the package credited, customer_id: the member, event_type: the ledger event, event_timestamp: moment recorded, sessions_delta: sessions granted, amount_usd: always 0.00, session_type: blank, trainer_name: blank}
    triggers: []

measures:
  - id: pt_msr_late_cancels_last_90d
    window: rolling habitual_late_cancel_window_days ending at frozen_time (90 days for most tiers)
    measure: count of pt_session_cancelled_late events for the customer_id

policies:
  - id: pt_agg_multi_holding
    subject: [pt_package_purchased]
    rule: A member may hold up to 2 personal-training packages open at the same time (any status other than closed), for example a standard package alongside one specialty add-on; a third concurrent open package is not permitted. A member may not hold two Unlimited Monthly Coaching packages open at the same time.
    eligibility: []
    params:
      max_per_customer: 2

  - id: pt_agg_session_pool
    subject: [pt_session_redeemed, pt_package_expired, pt_package_exhausted, pt_bonus_session_granted]
    rule: >
      When a member holds more than one open personal-training package, a session redemption or an expiration forfeiture is drawn from the package with the soonest expiration_date among the member's open packages; where two open packages share the same expiration_date, the package opened earlier (the lower opened_date) is drawn from first.
    eligibility: []

  - id: pt_tier_pricing
    subject: [pt_package_purchased, pt_package_activated]
    rule: >
      At purchase, the package is priced at the tier's price_usd (less multi_package_discount_pct if the member already holds another open package, and less corporate_wellness_discount_pct if the member holds an active corporate wellness enrollment, taking whichever single discount is higher rather than stacking them), grants sessions_included sessions (or unlimited use, subject to unlimited_monthly_cap_sessions_per_week, when sessions_included is -1), and sets expiration_date to opened_date plus expiration_window_days calendar days.
    eligibility: []
    params:
      per_tier:
        Single Session Pack: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}
        5-Session Starter Pack: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}
        10-Session Value Pack: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}
        20-Session Performance Pack: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}
        Unlimited Monthly Coaching: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}
        Elite Specialty Coaching: {price_usd: "=price_usd", sessions_included: "=sessions_included", expiration_window_days: "=expiration_window_days"}

  - id: pt_session_redemption_eligibility
    subject: [pt_session_redeemed]
    rule: A session may be redeemed only while the package is active.
    eligibility:
      - id: redemption_requires_active_package
        applies_to: [pt_session_redeemed]
        kind: state
        condition: A session may be redeemed only while the package is active.
        evidence_fields: [pt_holdings.pt_holding_id, pt_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pt_holdings.pt_holding_id]]
          action_bindings: {pt_holdings.pt_holding_id: pt_holding_id}
        state_contract:
          field: pt_holdings.status
          allowed: [active]

  - id: pt_late_cancellation_policy
    subject: [pt_session_cancelled_late]
    rule: >
      Cancelling a scheduled session within late_cancel_window_hours of its scheduled start forfeits the session from the package balance and charges cancellation_fee_usd; cancelling with more notice than that returns no charge and does not touch the balance. The member's stated notice, matched against the session time on file with the front desk, is the basis for whether a cancellation falls inside the window.
    eligibility: []
    params:
      per_tier:
        Single Session Pack: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}
        5-Session Starter Pack: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}
        10-Session Value Pack: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}
        20-Session Performance Pack: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}
        Unlimited Monthly Coaching: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}
        Elite Specialty Coaching: {late_cancel_window_hours: "=late_cancel_window_hours", cancellation_fee_usd: "=cancellation_fee_usd"}

  - id: pt_habitual_late_cancellation
    subject: [pt_session_cancelled_late]
    rule: >
      Once a member accumulates habitual_late_cancel_threshold or more late cancellations in the trailing habitual_late_cancel_window_days ending at frozen_time, counting every pt_session_cancelled_late event for that customer_id in the window, each further late cancellation in that window additionally incurs habitual_late_cancel_penalty_fee_usd on top of cancellation_fee_usd.
    eligibility: []
    measures: [pt_msr_late_cancels_last_90d]
    params:
      per_tier:
        Single Session Pack: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}
        5-Session Starter Pack: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}
        10-Session Value Pack: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}
        20-Session Performance Pack: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}
        Unlimited Monthly Coaching: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}
        Elite Specialty Coaching: {habitual_late_cancel_threshold: "=habitual_late_cancel_threshold", habitual_late_cancel_window_days: "=habitual_late_cancel_window_days", habitual_late_cancel_penalty_fee_usd: "=habitual_late_cancel_penalty_fee_usd"}

  - id: pt_package_refund_policy
    subject: [pt_package_refunded, pt_package_cancelled]
    rule: >
      A refund of unused sessions may be recorded only while the package is active, paused, or in the same moment as its confirmed cancellation to closed, and only when the customer requests the refund before refund_window_days have elapsed since the package was purchased, counted as full calendar days from opened_date with no partial-day rounding; frozen_time must not be later than opened_date plus refund_window_days for the refund to be recorded. The refund amount is cancellation_refund_pct of the unused-session value, prorated on refund_proration_basis.
    eligibility:
      - id: refund_requires_open_package
        applies_to: [pt_package_refunded]
        kind: state
        condition: A refund of unused sessions may be recorded only while the package is active, paused, or in the same moment as its confirmed cancellation to closed
        evidence_fields: [pt_holdings.pt_holding_id, pt_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pt_holdings.pt_holding_id]]
          action_bindings: {pt_holdings.pt_holding_id: pt_holding_id}
        state_contract:
          field: pt_holdings.status
          allowed: [active, paused, closed]
      - id: refund_within_window
        applies_to: [pt_package_refunded]
        kind: time
        condition: only when the customer requests the refund before refund_window_days have elapsed since the package was purchased, counted as full calendar days from opened_date with no partial-day rounding
        evidence_fields: [pt_holdings.pt_holding_id, pt_holdings.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pt_holdings.pt_holding_id]]
          action_bindings: {pt_holdings.pt_holding_id: pt_holding_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the package was purchased
          anchor_source: pt_holdings.opened_date
          relation: not_after
          duration_source: variants.refund_window_days
          unit: calendar_days
          counting_rule: counted as full calendar days from opened_date with no partial-day rounding
          boundary: inclusive
    params:
      per_tier:
        Single Session Pack: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}
        5-Session Starter Pack: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}
        10-Session Value Pack: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}
        20-Session Performance Pack: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}
        Unlimited Monthly Coaching: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}
        Elite Specialty Coaching: {refund_window_days: "=refund_window_days", cancellation_refund_pct: "=cancellation_refund_pct"}

  - id: pt_package_expiration_policy
    subject: [pt_package_lapsed, pt_package_expired, pt_package_archived]
    rule: >
      A package lapses and its remaining sessions are forfeited once frozen_time is not before opened_date (the date the package was purchased) plus expiration_window_days calendar days, counted as full calendar days from opened_date with no partial-day rounding.
    eligibility:
      - id: expiration_window_elapsed
        applies_to: [pt_package_lapsed]
        kind: time
        condition: A package lapses and its remaining sessions are forfeited once frozen_time is not before opened_date (the date the package was purchased) plus expiration_window_days calendar days, counted as full calendar days from opened_date with no partial-day rounding.
        evidence_fields: [pt_holdings.pt_holding_id, pt_holdings.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pt_holdings.pt_holding_id]]
          action_bindings: {pt_holdings.pt_holding_id: pt_holding_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the package was purchased
          anchor_source: pt_holdings.opened_date
          relation: not_before
          duration_source: variants.expiration_window_days
          unit: calendar_days
          counting_rule: counted as full calendar days from opened_date with no partial-day rounding
          boundary: inclusive
    params:
      per_tier:
        Single Session Pack: {expiration_window_days: "=expiration_window_days"}
        5-Session Starter Pack: {expiration_window_days: "=expiration_window_days"}
        10-Session Value Pack: {expiration_window_days: "=expiration_window_days"}
        20-Session Performance Pack: {expiration_window_days: "=expiration_window_days"}
        Unlimited Monthly Coaching: {expiration_window_days: "=expiration_window_days"}
        Elite Specialty Coaching: {expiration_window_days: "=expiration_window_days"}

  - id: pt_trainer_reassignment_policy
    subject: [pt_trainer_reassigned]
    rule: >
      A member may request a trainer reassignment; the first trainer_reassignment_free_uses reassignments on a package are free, and each further reassignment is charged trainer_reassignment_fee_usd.
    eligibility: []
    params:
      per_tier:
        Single Session Pack: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}
        5-Session Starter Pack: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}
        10-Session Value Pack: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}
        20-Session Performance Pack: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}
        Unlimited Monthly Coaching: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}
        Elite Specialty Coaching: {trainer_reassignment_free_uses: "=trainer_reassignment_free_uses", trainer_reassignment_fee_usd: "=trainer_reassignment_fee_usd"}

  - id: pt_package_pause_policy
    subject: [pt_package_paused, pt_package_resumed]
    rule: >
      When package_pause_allowed applies, a package may be paused for up to package_pause_max_days, charged package_pause_fee_usd; the expiration_date is pushed back by the number of days actually paused once the package resumes.
    eligibility: []
    params:
      per_tier:
        Single Session Pack: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}
        5-Session Starter Pack: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}
        10-Session Value Pack: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}
        20-Session Performance Pack: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}
        Unlimited Monthly Coaching: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}
        Elite Specialty Coaching: {package_pause_max_days: "=package_pause_max_days", package_pause_fee_usd: "=package_pause_fee_usd"}

  - id: pt_specialty_membership_gating
    subject: [pt_package_purchased]
    rule: >
      Elite Specialty Coaching may be purchased only by a member whose club membership is active and whose membership tier ladder rank is at least minimum_membership_tier_rank; a lower or inactive membership must upgrade first.
    eligibility:
      - id: purchase_requires_qualifying_membership
        applies_to: [pt_package_purchased]
        kind: state
        condition: Elite Specialty Coaching may be purchased only by a member whose club membership is active and whose membership tier ladder rank is at least minimum_membership_tier_rank
        evidence_fields: [membership_holdings.status, membership_holdings.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_holdings.customer_id]]
          action_bindings: {membership_holdings.customer_id: customer_id}
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    params:
      per_tier:
        Single Session Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        5-Session Starter Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        10-Session Value Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        20-Session Performance Pack: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        Unlimited Monthly Coaching: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}
        Elite Specialty Coaching: {minimum_membership_tier_rank: "=minimum_membership_tier_rank"}

extended_policies:
  - id: pt_ext_late_cancel_fee
    base_policy_refs: [pt_late_cancellation_policy, pt_habitual_late_cancellation, pt_session_redemption_eligibility]
    overwrite:
      - base_policy: pt_late_cancellation_policy
        superseded_clause: >-
          forfeits the session from the package balance and charges cancellation_fee_usd
        replaced_by: >-
          The charge for a late cancellation is cancellation_fee_usd for that tier, reduced by half of the linked
          active corporate wellness enrollment's own employer_discount_pct when one is held, with no reduction
          where no active corporate wellness enrollment is held
      - base_policy: pt_habitual_late_cancellation
        superseded_clause: >-
          counting every pt_session_cancelled_late event for that customer_id in the window
        replaced_by: >-
          here the habitual count is administered per package rather than pooled across every package the member
          holds, so that each package's own forfeiture history alone decides whether that package's habitual
          surcharge has begun
    trigger: on_request
    subject: [pt_session_cancelled_late]
    computes: cancellation_amount_usd
    target_tool: log_late_cancellation_b8e4e034
    rule: >
      A late cancellation may be logged against a package only while that package's status is active, on the same
      footing as a session redemption; a package that is paused, exhausted, expired or closed may not have a further
      late cancellation logged against it. The charge for a late cancellation is cancellation_fee_usd for that tier,
      reduced by half of the linked active corporate wellness enrollment's own employer_discount_pct when one is
      held, with no reduction where no active corporate wellness enrollment is held. In addition, once the package
      has already accumulated habitual_late_cancel_threshold or more prior pt_session_cancelled_late events recorded
      against this same package, this and every further late cancellation on this package additionally incurs
      habitual_late_cancel_penalty_fee_usd on top of cancellation_fee_usd; here the habitual count is administered
      per package rather than pooled across every package the member holds, so that each package's own forfeiture
      history alone decides whether that package's habitual surcharge has begun. Where the running per-package count
      of prior late cancellations is still below habitual_late_cancel_threshold, no penalty is added and only
      cancellation_fee_usd (net of the corporate reduction above) is charged.
    prerequisite: []
    cross_category:
      - category: corp
        as: branch
        reads: [status, employer_discount_pct]
        note: >-
          an active corporate wellness enrollment's own employer_discount_pct halves its weight to reduce the
          chargeable cancellation_fee_usd; no active enrollment leaves the fee at its full tier rate
    compute:
      - is_active: "F('status') == 'active'"
      - base_fee: "P('cancellation_fee_usd')"
      - corp_active: "EXISTS('corp', status='active')"
      - corp_disc_pct: "CPARAM('corp', 'employer_discount_pct', status='active') if corp_active else 0"
      - fee_after_corp: "base_fee * (1 - (corp_disc_pct / 2) / 100) if corp_active else base_fee"
      - prior_late_count: "COUNT('pt_events', event_type='pt_session_cancelled_late')"
      - threshold: "P('habitual_late_cancel_threshold')"
      - over_threshold: "(prior_late_count + 1) >= threshold"
      - penalty: "P('habitual_late_cancel_penalty_fee_usd') if over_threshold else 0.0"
      - result: "RND(fee_after_corp + penalty, 2)"
    compute_basis:
      is_active: "A late cancellation may be logged against a package only while that package's status is active, on the same footing as a session redemption"
      corp_disc_pct: "reduced by half of the linked active corporate wellness enrollment's own employer_discount_pct when one is held"
      fee_after_corp: "with no reduction where no active corporate wellness enrollment is held"
      prior_late_count: "here the habitual count is administered per package rather than pooled across every package the member holds, so that each package's own forfeiture history alone decides whether that package's habitual surcharge has begun"
      over_threshold: "once the package has already accumulated habitual_late_cancel_threshold or more prior pt_session_cancelled_late events recorded against this same package, this and every further late cancellation on this package additionally incurs habitual_late_cancel_penalty_fee_usd on top of cancellation_fee_usd"
      penalty: "Where the running per-package count of prior late cancellations is still below habitual_late_cancel_threshold, no penalty is added and only cancellation_fee_usd (net of the corporate reduction above) is charged."
    inputs:
      history:
        - {table: pt_events, aggregate: count, field: event_id, filters: {event_type: pt_session_cancelled_late}}
      cross_category: [corp]

  - id: pt_ext_refund
    base_policy_refs: [pt_package_refund_policy, pt_tier_pricing]
    overwrite:
      - base_policy: pt_package_refund_policy
        superseded_clause: >-
          The refund amount is cancellation_refund_pct of the unused-session value, prorated on refund_proration_basis.
        replaced_by: >-
          The effective refund percentage applied to that unused-session value is cancellation_refund_pct uplifted
          by half of the linked active corporate wellness enrollment's own employer_discount_pct as a loyalty
          concession when one is held, capped so the effective percentage never exceeds 100, and this effective
          percentage (not the plain cancellation_refund_pct) is what is prorated onto the unused-session value on
          refund_proration_basis
    trigger: on_request
    subject: [pt_package_refunded, pt_package_cancelled]
    computes: refund_amount_usd
    target_tool: record_package_refund_4aaf76ef
    rule: >
      A refund of unused sessions may be recorded only while the package's status is active, paused, or in the same
      moment as its confirmed cancellation to closed, and only within refund_window_days of the package's opened_date
      as base already requires, and additionally only once the package's trainer-of-record is reconciled: the name on
      pt_holdings.assigned_trainer_name must match the trainer named on the most recent pt_trainer_reassigned ledger
      entry for that package, wherever at least one such entry exists; where the two disagree, a fresh reassignment
      to the currently correct trainer must be logged first so the records reconcile before the refund is recorded.
      The unused-session count is the tier's sessions_included plus every pt_bonus_session_granted session credited
      to the package, less every session already consumed by a pt_session_redeemed or a pt_session_cancelled_late
      event on the package, floored at zero. On refund_proration_basis of sessions_used, the unused-session value is
      that unused count multiplied by the package's own per-session value, taken as price_usd divided by
      sessions_included; on a basis of percentage_elapsed the unused-session value is instead price_usd multiplied by
      the fraction of expiration_window_days not yet elapsed since opened_date. The effective refund percentage
      applied to that unused-session value is cancellation_refund_pct uplifted by half of the linked active corporate
      wellness enrollment's own employer_discount_pct as a loyalty concession when one is held, capped so the
      effective percentage never exceeds 100, and this effective percentage (not the plain cancellation_refund_pct)
      is what is prorated onto the unused-session value on refund_proration_basis; the result is rounded to 2 decimal
      places only at the final step.
    prerequisite:
      - problem: pt_ext_bonus_loyalty
        kind: value_input
        gate: total_granted
        condition: >-
          a bonus session owed under the package's loyalty entitlement, wherever one is owed and not yet credited,
          must be credited before a refund is recorded on the package
        policy_source: >-
          The unused-session count is the tier's sessions_included plus every pt_bonus_session_granted session
          credited to the package, less every session already consumed by a pt_session_redeemed or a
          pt_session_cancelled_late event on the package, floored at zero.
        resolved_by: grant_bonus_session_f02d8384
        effect: >-
          once credited, the pt_bonus_session_granted count read by this policy's total_granted binding increases
          by the granted amount, raising the unused-session count and therefore the refund amount
      - problem: pt_ext_trainer_reassignment
        kind: state_gate
        gate: pt_holdings.assigned_trainer_name
        condition: >-
          the package's trainer-of-record must match the trainer named on the most recent trainer-reassignment
          record for the package, wherever at least one such record exists, before this refund may be recorded
        policy_source: >-
          where the two disagree, a fresh reassignment to the currently correct trainer must be logged first so
          the records reconcile before the refund is recorded
        resolved_by: reassign_trainer_0e491cd1
        effect: >-
          the reassignment tool sets assigned_trainer_name to the same trainer name it logs on the new
          pt_trainer_reassigned entry, so the two records agree and this refund may then be recorded
    cross_category:
      - category: corp
        as: branch
        reads: [status, employer_discount_pct]
        note: >-
          an active corporate wellness enrollment's own employer_discount_pct uplifts the effective refund
          percentage by half its value, on top of the tier's own cancellation_refund_pct
    compute:
      - sessions_included: "P('sessions_included')"
      - price: "P('price_usd')"
      - redeemed_count: "COUNT('pt_events', event_type='pt_session_redeemed')"
      - late_count: "COUNT('pt_events', event_type='pt_session_cancelled_late')"
      - bonus_count: "COUNT('pt_events', event_type='pt_bonus_session_granted')"
      - total_granted: "sessions_included + bonus_count"
      - sessions_used: "redeemed_count + late_count"
      - unused: "MX(0, total_granted - sessions_used)"
      - proration_basis: "P('refund_proration_basis')"
      - per_session_value: "price / sessions_included"
      - days_elapsed: "DAYS(F('opened_date'), NOW)"
      - window_days: "P('expiration_window_days')"
      - remaining_fraction: "MX(0.0, (window_days - days_elapsed) / window_days)"
      - unused_value: "(price * remaining_fraction) if proration_basis == 'percentage_elapsed' else (unused * per_session_value)"
      - base_pct: "P('cancellation_refund_pct')"
      - corp_active: "EXISTS('corp', status='active')"
      - corp_disc_pct: "CPARAM('corp', 'employer_discount_pct', status='active') if corp_active else 0"
      - uplift_pct: "corp_disc_pct / 2 if corp_active else 0"
      - effective_pct: "MN(100, base_pct + uplift_pct)"
      - result: "RND(unused_value * effective_pct / 100, 2)"
    compute_basis:
      redeemed_count: "less every session already consumed by a pt_session_redeemed or a pt_session_cancelled_late event on the package"
      late_count: "less every session already consumed by a pt_session_redeemed or a pt_session_cancelled_late event on the package"
      bonus_count: "The unused-session count is the tier's sessions_included plus every pt_bonus_session_granted session credited to the package"
      unused: "floored at zero"
      per_session_value: "that unused count multiplied by the package's own per-session value, taken as price_usd divided by sessions_included"
      remaining_fraction: "price_usd multiplied by the fraction of expiration_window_days not yet elapsed since opened_date"
      unused_value: "On refund_proration_basis of sessions_used, the unused-session value is that unused count multiplied by the package's own per-session value ... on a basis of percentage_elapsed the unused-session value is instead price_usd multiplied by the fraction of expiration_window_days not yet elapsed since opened_date"
      corp_disc_pct: "uplifted by half of the linked active corporate wellness enrollment's own employer_discount_pct as a loyalty concession when one is held"
      effective_pct: "capped so the effective percentage never exceeds 100"
      result: "the result is rounded to 2 decimal places only at the final step"
    inputs:
      history:
        - {table: pt_events, aggregate: count, field: event_id, filters: {event_type: pt_session_redeemed}}
        - {table: pt_events, aggregate: count, field: event_id, filters: {event_type: pt_session_cancelled_late}}
        - {table: pt_events, aggregate: count, field: event_id, filters: {event_type: pt_bonus_session_granted}}
      cross_category: [corp]

  - id: pt_ext_bonus_loyalty
    base_policy_refs: [pt_tier_pricing, pt_agg_session_pool]
    overwrite: []
    trigger: state_due
    subject: [pt_bonus_session_granted]
    computes: sessions_delta
    target_tool: grant_bonus_session_f02d8384
    rule: >
      A member holding a package on a tier for which bonus_session_eligible is true, and whose package was opened at
      least loyalty_bonus_minimum_tenure_days calendar days before frozen_time counting full calendar days from
      opened_date with no partial-day rounding, is owed exactly one complimentary loyalty bonus session on that
      package once no pt_bonus_session_granted event has yet been credited to it. Where the member's own club
      membership is active, loyalty_bonus_minimum_tenure_days is reduced by that membership's own
      personal_training_discount_pct percentage as a loyalty acceleration, rounded down to the nearest whole day;
      where no active club membership is held, the full loyalty_bonus_minimum_tenure_days applies with no reduction.
      Where a tier's bonus_session_eligible is false, or the package has not yet reached the (possibly reduced)
      tenure requirement, or a bonus session has already been credited to the package, no further bonus session is
      owed on that package.
    prerequisite: []
    cross_category:
      - category: membership
        as: branch
        reads: [status, personal_training_discount_pct]
        note: >-
          an active club membership's own personal_training_discount_pct shortens the tenure requirement for the
          loyalty bonus session as an acceleration; no active membership leaves the requirement at its full length
    compute:
      - eligible_tier: "P('bonus_session_eligible')"
      - days_open: "DAYS(F('opened_date'), NOW)"
      - base_tenure: "K('loyalty_bonus_minimum_tenure_days')"
      - membership_active: "EXISTS('membership', status='active')"
      - membership_pt_disc: "CPARAM('membership', 'personal_training_discount_pct', status='active') if membership_active else 0"
      - no_membership: "not membership_active"
      - min_tenure: "base_tenure if no_membership else int(base_tenure * (1 - membership_pt_disc / 100))"
      - tenure_met: "days_open >= min_tenure"
      - already_granted: "COUNT('pt_events', event_type='pt_bonus_session_granted')"
      - owed: "1 if (eligible_tier and tenure_met and already_granted == 0) else 0"
      - result: "owed"
    compute_basis:
      membership_pt_disc: "loyalty_bonus_minimum_tenure_days is reduced by that membership's own personal_training_discount_pct percentage as a loyalty acceleration, rounded down to the nearest whole day"
      min_tenure: "where no active club membership is held, the full loyalty_bonus_minimum_tenure_days applies with no reduction"
      tenure_met: "whose package was opened at least loyalty_bonus_minimum_tenure_days calendar days before frozen_time counting full calendar days from opened_date with no partial-day rounding"
      already_granted: "once no pt_bonus_session_granted event has yet been credited to it"
      owed: "is owed exactly one complimentary loyalty bonus session on that package once no pt_bonus_session_granted event has yet been credited to it"
    inputs:
      history:
        - {table: pt_events, aggregate: count, field: event_id, filters: {event_type: pt_bonus_session_granted}}
      cross_category: [membership]
    params:
      loyalty_bonus_minimum_tenure_days: 7

  - id: pt_ext_trainer_reassignment
    base_policy_refs: [pt_trainer_reassignment_policy]
    overwrite:
      - base_policy: pt_trainer_reassignment_policy
        superseded_clause: >-
          each further reassignment is charged trainer_reassignment_fee_usd
        replaced_by: >-
          Where the member holds an active corporate wellness enrollment, that enrollment's own employer_discount_pct
          reduces a chargeable reassignment fee by that percentage; where no active corporate wellness enrollment is
          held, the full trainer_reassignment_fee_usd applies with no reduction
    trigger: state_due
    subject: [pt_trainer_reassigned]
    computes: reassignment_fee_usd
    target_tool: reassign_trainer_0e491cd1
    rule: >
      A member may request a trainer reassignment, or staff may perform one to reconcile the package's
      trainer-of-record with the trainer actually named on the most recent pt_trainer_reassigned entry for that
      package; the first trainer_reassignment_free_uses reassignments logged against a given package are free, and
      each further reassignment on that same package is charged trainer_reassignment_fee_usd. Where the member holds
      an active corporate wellness enrollment, that enrollment's own employer_discount_pct reduces a chargeable
      reassignment fee by that percentage; where no active corporate wellness enrollment is held, the full
      trainer_reassignment_fee_usd applies with no reduction.
    prerequisite: []
    cross_category:
      - category: corp
        as: branch
        reads: [status, employer_discount_pct]
        note: >-
          an active corporate wellness enrollment's own employer_discount_pct reduces a chargeable reassignment fee
          proportionally; no active enrollment leaves the fee at its full tier rate
    compute:
      - free_uses: "P('trainer_reassignment_free_uses')"
      - flat_fee: "P('trainer_reassignment_fee_usd')"
      - prior_count: "COUNT('pt_events', event_type='pt_trainer_reassigned')"
      - under_free: "prior_count < free_uses"
      - corp_active: "EXISTS('corp', status='active')"
      - corp_disc_pct: "CPARAM('corp', 'employer_discount_pct', status='active') if corp_active else 0"
      - fee_after_corp: "flat_fee * (1 - corp_disc_pct / 100) if corp_active else flat_fee"
      - result: "0.00 if under_free else RND(fee_after_corp, 2)"
    compute_basis:
      under_free: "the first trainer_reassignment_free_uses reassignments logged against a given package are free, and each further reassignment on that same package is charged trainer_reassignment_fee_usd"
      corp_disc_pct: "Where the member holds an active corporate wellness enrollment, that enrollment's own employer_discount_pct reduces a chargeable reassignment fee by that percentage"
      fee_after_corp: "where no active corporate wellness enrollment is held, the full trainer_reassignment_fee_usd applies with no reduction"
    inputs:
      history:
        - {table: pt_events, aggregate: count, field: event_id, filters: {event_type: pt_trainer_reassigned}}
      cross_category: [corp]

  - id: pt_ext_lapse_forfeit
    base_policy_refs: [pt_package_expiration_policy, pt_agg_session_pool]
    overwrite:
      - base_policy: pt_package_expiration_policy
        superseded_clause: >-
          its remaining sessions are forfeited
        replaced_by: >-
          The number of sessions forfeited at lapse equals the package's sessions_remaining at the moment of
          lapsing, exactly as recorded on the package, less a grace credit; where the member's own club membership
          is active, that membership's own personal_training_discount_pct percentage of the sessions otherwise due
          to be forfeited is preserved instead as a loyalty courtesy, rounded down to the nearest whole session, and
          only the remainder is forfeited; where no active club membership is held, the full amount is forfeited
          with no grace credit
    trigger: state_due
    subject: [pt_package_lapsed, pt_package_expired]
    computes: forfeited_sessions
    target_tool: lapse_expire_package_bc252d9e
    rule: >
      A package lapses and its remaining sessions are forfeited once frozen_time is not before opened_date plus
      expiration_window_days calendar days, counted as full calendar days from opened_date with no partial-day
      rounding, as base already requires; a package may be lapsed only while its status is active or paused. The
      number of sessions forfeited at lapse equals the package's sessions_remaining at the moment of lapsing,
      exactly as recorded on the package, less a grace credit; where the member's own club membership is active,
      that membership's own personal_training_discount_pct percentage of the sessions otherwise due to be forfeited
      is preserved instead as a loyalty courtesy, rounded down to the nearest whole session, and only the remainder
      is forfeited; where no active club membership is held, the full amount is forfeited with no grace credit. A
      package with zero sessions_remaining at that moment forfeits zero sessions but still transitions to expired.
    prerequisite: []
    cross_category:
      - category: membership
        as: branch
        reads: [status, personal_training_discount_pct]
        note: >-
          an active club membership's own personal_training_discount_pct sets the fraction of otherwise-forfeited
          sessions preserved as a grace credit at lapse; no active membership leaves the full amount forfeited
    compute:
      - status_active: "F('status') == 'active'"
      - status_paused: "F('status') == 'paused'"
      - status_ok: "status_active or status_paused"
      - days_open: "DAYS(F('opened_date'), NOW)"
      - window_days: "P('expiration_window_days')"
      - window_elapsed: "days_open >= window_days"
      - current_remaining: "F('sessions_remaining')"
      - membership_active: "EXISTS('membership', status='active')"
      - no_membership: "not membership_active"
      - membership_pt_disc: "CPARAM('membership', 'personal_training_discount_pct', status='active') if membership_active else 0"
      - grace_credit: "0 if no_membership else int(current_remaining * membership_pt_disc / 100)"
      - forfeited: "MX(0, current_remaining - grace_credit)"
      - ineligible: "not (status_ok and window_elapsed)"
      - result: "0 if ineligible else forfeited"
    compute_basis:
      window_elapsed: "A package lapses and its remaining sessions are forfeited once frozen_time is not before opened_date plus expiration_window_days calendar days, counted as full calendar days from opened_date with no partial-day rounding"
      current_remaining: "The number of sessions forfeited at lapse equals the package's sessions_remaining at the moment of lapsing, exactly as recorded on the package, less a grace credit"
      grace_credit: "where the member's own club membership is active, that membership's own personal_training_discount_pct percentage of the sessions otherwise due to be forfeited is preserved instead as a loyalty courtesy, rounded down to the nearest whole session"
      forfeited: "where no active club membership is held, the full amount is forfeited with no grace credit"
      result: "A package with zero sessions_remaining at that moment forfeits zero sessions but still transitions to expired."
    inputs:
      history: []
      cross_category: [membership]

  - id: pt_ext_archive_closed
    base_policy_refs: [pt_package_expiration_policy]
    overwrite: []
    trigger: state_due
    subject: [pt_package_archived]
    computes: closed_date
    target_tool: archive_pt_package_1350ea96
    rule: >
      An exhausted or expired package is administratively archived to closed only once its status is already
      exhausted or expired; a package that is still active or paused may not be archived. The package is archived
      with closed_date backdated to its own expiration_date, rather than the day archiving staff happen to act,
      only where both of two conditions hold together: the package has already transitioned to expired, meaning its
      expiration forfeiture was already recorded, and the member's own club membership is active and has been
      continuously open for at least min_membership_age_for_backdate_days calendar days by frozen_time, since the
      backdating courtesy is extended only to an established membership. Where either condition fails to hold, the
      package is archived with closed_date set to the day archiving staff act, which is frozen_time's own date.
    prerequisite:
      - problem: pt_ext_lapse_forfeit
        kind: value_input
        gate: result
        condition: >-
          the package's expiration forfeiture (its transition to expired) must already be on record before the
          package can be archived
        policy_source: >-
          An exhausted or expired package is administratively archived to closed only once its status is already
          exhausted or expired; a package that is still active or paused may not be archived.
        resolved_by: lapse_expire_package_bc252d9e
        effect: >-
          once the lapse tool runs, pt_holdings.status becomes expired, which flips this policy's forfeiture_recorded
          binding to true and switches the result binding from frozen_time's date to the package's own
          expiration_date
    cross_category:
      - category: membership
        as: branch
        reads: [status, opened_date]
        note: >-
          the member's own club membership must be active and established (open at least
          min_membership_age_for_backdate_days days) for the closed_date backdating courtesy to apply at all
    compute:
      - current_status: "F('status')"
      - forfeiture_recorded: "current_status == 'expired'"
      - membership_active: "EXISTS('membership', status='active')"
      - membership_opened: "CFIELD('membership', 'opened_date', status='active') if membership_active else NOW"
      - membership_tenure_days: "DAYS(membership_opened, NOW) if membership_active else 0"
      - min_tenure_for_backdate: "K('min_membership_age_for_backdate_days')"
      - established_membership: "membership_active and membership_tenure_days >= min_tenure_for_backdate"
      - backdate_ok: "forfeiture_recorded and established_membership"
      - not_backdatable: "not backdate_ok"
      - expiration_date: "F('expiration_date')"
      - result: "NOW if not_backdatable else expiration_date"
    compute_basis:
      forfeiture_recorded: "the package has already transitioned to expired, meaning its expiration forfeiture was already recorded"
      established_membership: "the member's own club membership is active and has been continuously open for at least min_membership_age_for_backdate_days calendar days by frozen_time, since the backdating courtesy is extended only to an established membership"
      backdate_ok: "The package is archived with closed_date backdated to its own expiration_date, rather than the day archiving staff happen to act, only where both of two conditions hold together"
      result: "Where either condition fails to hold, the package is archived with closed_date set to the day archiving staff act, which is frozen_time's own date."
    inputs:
      history: []
      cross_category: [membership]
    params:
      min_membership_age_for_backdate_days: 30

  - id: pt_ext_purchase_pricing
    base_policy_refs: [pt_tier_pricing, pt_agg_multi_holding, pt_specialty_membership_gating]
    overwrite:
      - base_policy: pt_tier_pricing
        superseded_clause: >-
          grants sessions_included sessions (or unlimited use, subject to unlimited_monthly_cap_sessions_per_week,
          when sessions_included is -1)
        replaced_by: >-
          the package is credited sessions_included sessions (or unlimited use, subject to
          unlimited_monthly_cap_sessions_per_week, when sessions_included is -1), plus a signing bonus of
          purchase_signing_bonus_sessions additional sessions where the member's own club membership is active and
          that membership's own personal_training_discount_pct is at least
          purchase_signing_bonus_discount_threshold_pct
    trigger: on_request
    subject: [pt_package_activated]
    computes: sessions_granted
    target_tool: activate_pt_package_46fb321d
    rule: >
      A previously applied package may be activated only once doing so would not leave the member holding more
      than max_per_customer packages open (any status other than closed) on this category, counting the package
      being activated itself; where an already-open package on this category is stale and has been administratively
      archived first, it no longer counts toward that total, exactly on the same footing pt_agg_multi_holding already
      gives a fresh purchase. At activation the package is credited sessions_included sessions (or unlimited use,
      subject to unlimited_monthly_cap_sessions_per_week, when sessions_included is -1), plus a signing bonus of
      purchase_signing_bonus_sessions additional sessions where the member's own club membership is active and that
      membership's own personal_training_discount_pct is at least purchase_signing_bonus_discount_threshold_pct;
      where no active club membership is held, or its discount falls below that threshold, no signing bonus is
      credited.
    prerequisite:
      - problem: pt_ext_archive_closed
        kind: state_gate
        gate: pt_agg_multi_holding.max_per_customer
        condition: >-
          activating the package must not leave the member holding more than the per-member limit on concurrently
          open packages (any status other than closed) on this category, counting the package being activated
          itself
        policy_source: >-
          A member may hold up to 2 personal-training packages open at the same time (any status other than
          closed), for example a standard package alongside one specialty add-on; a third concurrent open package
          is not permitted.
        resolved_by: archive_pt_package_1350ea96
        effect: >-
          archiving the stale package transitions its status to closed, which removes it from the count of packages
          open on this category and satisfies the max_per_customer gate for this activation
    cross_category:
      - category: membership
        as: branch
        reads: [status, personal_training_discount_pct]
        note: >-
          an active club membership's own personal_training_discount_pct decides whether the signing-bonus
          sessions are credited at activation
    compute:
      - sessions_included: "P('sessions_included')"
      - is_unlimited: "sessions_included == -1"
      - membership_active: "EXISTS('membership', status='active')"
      - membership_pt_disc: "CPARAM('membership', 'personal_training_discount_pct', status='active') if membership_active else 0"
      - threshold: "K('purchase_signing_bonus_discount_threshold_pct')"
      - qualifies_bonus: "membership_active and membership_pt_disc >= threshold"
      - does_not_qualify: "not qualifies_bonus"
      - bonus_sessions: "0 if does_not_qualify else K('purchase_signing_bonus_sessions')"
      - result: "sessions_included if is_unlimited else sessions_included + bonus_sessions"
    compute_basis:
      is_unlimited: "or unlimited use, subject to unlimited_monthly_cap_sessions_per_week, when sessions_included is -1"
      membership_pt_disc: "where the member's own club membership is active and that membership's own personal_training_discount_pct is at least purchase_signing_bonus_discount_threshold_pct"
      qualifies_bonus: "plus a signing bonus of purchase_signing_bonus_sessions additional sessions where the member's own club membership is active and that membership's own personal_training_discount_pct is at least purchase_signing_bonus_discount_threshold_pct"
      bonus_sessions: "where no active club membership is held, or its discount falls below that threshold, no signing bonus is credited"
      result: "the package is credited sessions_included sessions ... plus a signing bonus of purchase_signing_bonus_sessions additional sessions"
    inputs:
      history: []
      cross_category: [membership]
    params:
      purchase_signing_bonus_discount_threshold_pct: 10
      purchase_signing_bonus_sessions: 2


workflows:
  - id: pt_wf_cancel_refund
    scenario: >
      A member holding an active personal-training package decides to cancel it and take a refund of its unused
      sessions. Before the refund itself is computed, any bonus session the package's loyalty entitlement already
      owes it must be credited, and any mismatch between the package's own trainer-of-record and the trainer named
      on its most recent reassignment ledger entry must be reconciled; then every session the member has already
      consumed or forfeited during this same visit -- a session actually attended, and a separate session being
      late-cancelled right now -- must be on the ledger, and the member's own confirmation to cancel must already be
      on record. The package ends in closed status with the refund of its remaining unused-session value recorded
      against it.
    steps:
      - {tool: grant_bonus_session_f02d8384, owner: agent, writes: pt_events, subject: pt_bonus_session_granted, base_policy_refs: [pt_agg_session_pool], role: true up any owed loyalty bonus session before the refund is computed, computed_by: [pt_ext_bonus_loyalty]}
      - {tool: reassign_trainer_0e491cd1, owner: agent, writes: pt_events, subject: pt_trainer_reassigned, base_policy_refs: [pt_trainer_reassignment_policy], role: reconcile the trainer-of-record before the refund is computed, computed_by: [pt_ext_trainer_reassignment]}
      - {tool: redeem_pt_session_d7771acf, owner: agent, writes: pt_events, subject: pt_session_redeemed, base_policy_refs: [pt_session_redemption_eligibility, pt_agg_session_pool], role: log a session the member already attended this visit, computed_by: []}
      - {tool: log_late_cancellation_b8e4e034, owner: agent, writes: pt_events, subject: pt_session_cancelled_late, base_policy_refs: [pt_late_cancellation_policy, pt_habitual_late_cancellation], role: forfeit and charge a separate session the member is cancelling within the late window, computed_by: [pt_ext_late_cancel_fee]}
      - {tool: confirm_package_cancellation_cc17b6f3, owner: user, writes: pt_holdings, subject: pt_package_cancelled, base_policy_refs: [pt_package_refund_policy], role: the member's own confirmation to cancel and take a refund, computed_by: []}
      - {tool: record_package_refund_4aaf76ef, owner: agent, writes: pt_events, subject: pt_package_refunded, base_policy_refs: [pt_package_refund_policy], role: compute and record the refund of the package's unused-session value, computed_by: [pt_ext_refund]}
    dataflow:
      - from_step: 4
        to_step: 5
        kind: state_effect
        source_table: pt_holdings
        source_field: status
        consumer_bindings: []
        establishes_gates:
          - policy_id: pt_package_refund_policy
            eligibility_id: refund_requires_open_package
            evidence_field: pt_holdings.status
    order_rationale: >
      Steps 0 and 1 before step 5: pt_ext_refund's rule requires both the loyalty-bonus true-up and the
      trainer-of-record reconciliation to have already happened before the refund is computed, since the first
      changes total_granted and the second changes whether the trainer_reconciled gate holds; neither depends on
      the other (one touches sessions/ledger fields, the other touches the trainer field), so steps 0 and 1 may run
      in either relative order with an identical terminal state, but both must land before step 5. Steps 2 and 3
      before step 5: step 5's refund compute sums every pt_session_redeemed and pt_session_cancelled_late row
      already on the package to determine sessions_used, so both of those rows must already exist before the
      refund is computed, or the refund would be based on a larger unused-session count than is actually true.
      Step 2 before step 3: step 2's redemption reflects a session the member already attended earlier in this same
      visit, while step 3's late cancellation is being logged for a separate, currently-scheduled session the
      member is cancelling right now; the two rows are recorded in the order the two underlying events actually
      occurred, and since each simply decrements the same pool independently, swapping them leaves the terminal
      sessions_used and refund amount identical -- what does not leave the terminal state unchanged is running
      either of them after step 4. Step 3 before step 4: pt_session_redemption_eligibility's active-only gate, which
      pt_ext_late_cancel_fee's own rule extends to a late cancellation on the same footing, requires the package to
      still be in active status when step 3 runs; step 4 immediately transitions the package to closed, so if step
      4 ran first the package would no longer be active and step 3 could no longer be logged under that policy's
      own eligibility. Step 4 before step 5: pt_package_refund_policy's own eligibility allows a refund to be
      recorded only while the package is active, paused, or in the same moment as its confirmed cancellation to
      closed; step 5 records the refund against the closed status step 4 establishes, so step 4 must precede step 5.
    prerequisite: []
