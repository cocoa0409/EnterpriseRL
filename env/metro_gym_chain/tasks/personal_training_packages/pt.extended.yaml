category: pt
display_name: Personal Training Packages

binding:
  holding_table: pt_holdings
  event_tables: [pt_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {sessions_remaining: pt_session_account}

lifecycle:
  states: [applied, active, paused, exhausted, expired, closed]
  transitions:
    - {from: applied, to: active, by: agent, means: the purchase payment is captured and the package activates}
    - {from: active, to: paused, by: agent, means: the member's pause request is approved}
    - {from: paused, to: active, by: agent, means: the pause ends and the package resumes}
    - {from: active, to: exhausted, by: system, means: the last session in the package is redeemed}
    - {from: active, to: expired, by: system, means: the expiration date passes while sessions remain}
    - {from: paused, to: expired, by: system, means: the expiration date passes while the package is paused}
    - {from: exhausted, to: closed, by: agent, means: an exhausted package is administratively archived}
    - {from: expired, to: closed, by: agent, means: an expired package is administratively archived}
    - {from: active, to: closed, by: user, means: the member confirms cancellation and takes a refund of unused sessions}
    - {from: paused, to: closed, by: user, means: the member confirms cancellation while paused and takes a refund of unused sessions}

accounts:
  - key: pt_session_account
    unit: sessions
    meaning: coaching sessions currently available in the member's package(s); purchases and bonus grants increase it, redemptions, late-cancellation forfeitures, refunds and expirations decrease it

parameter_schema:
  price_usd: purchase price of the package, USD
  sessions_included: sessions granted by the package, count (-1 denotes unlimited for the Unlimited Monthly Coaching tier)
  session_duration_minutes: length of each coaching session, minutes
  expiration_window_days: days from purchase until unused sessions expire
  late_cancel_window_hours: hours before a scheduled session within which cancelling forfeits the session
  no_show_forfeits_session: boolean — whether failing to show up forfeits the session
  reschedule_allowed: boolean — whether a booked session may be rescheduled
  reschedule_max_per_session: times a single booked session may be rescheduled, count
  refund_window_days: days after purchase within which a refund of unused sessions may be requested
  refund_proration_basis: enum(sessions_used|percentage_elapsed) — basis for prorating a refund
  cancellation_refund_pct: percentage of the unused-session value refunded on an eligible cancellation, percent
  trainer_tier: enum(certified|senior|specialty) — the qualification level of trainers assigned to this package
  specialty_session_surcharge_usd: extra fee per specialty session beyond the base package price, USD
  session_type_allowed: enum(standard|specialty_nutrition|specialty_rehab|any) — which session types this package's sessions may be booked as
  unlimited_monthly_cap_sessions_per_week: for the unlimited tier, a per-week cap on sessions counted toward fair use, count (0 for non-unlimited tiers)
  booking_advance_window_hours: how far ahead a session may be booked, hours
  cancellation_fee_usd: flat fee charged in addition to session forfeiture for a late cancellation, USD
  trainer_reassignment_free_uses: free trainer reassignments allowed per package, count
  trainer_reassignment_fee_usd: fee for a reassignment beyond the free uses, USD
  trainer_tier_upgrade_fee_usd: fee to upgrade the assigned trainer's tier mid-package, USD
  bonus_session_eligible: boolean — whether goodwill bonus sessions may be granted on this tier
  membership_required: boolean — whether an active club membership is required to purchase this package
  minimum_membership_tier_rank: minimum club membership tier ladder rank required to purchase, count (0 = any active membership suffices)
  multi_package_discount_pct: discount applied to a second concurrent package, percent
  auto_renew_available: boolean — whether the package may auto-renew on exhaustion
  auto_renew_discount_pct: discount applied to an auto-renewed package, percent
  gift_transferable: boolean — whether unused sessions may be transferred to another member
  transfer_fee_usd: fee charged to transfer sessions to another member, USD
  family_sharing_allowed: boolean — whether sessions may be redeemed by a household add-on dependent
  holiday_blackout_dates_apply: boolean — whether booking is restricted on published holiday blackout dates
  weekend_surcharge_usd: extra fee for a weekend session booking, USD (0 if none)
  peak_hours_surcharge_usd: extra fee for a peak-hour session booking, USD (0 if none)
  package_pause_allowed: boolean — whether the package may be paused
  package_pause_max_days: maximum days a package may remain paused, days
  package_pause_fee_usd: fee to pause a package, USD
  habitual_late_cancel_threshold: count of late cancellations in the measure window that triggers the habitual-cancellation penalty
  habitual_late_cancel_window_days: rolling window used to count late cancellations, days
  habitual_late_cancel_penalty_fee_usd: additional fee charged once the habitual threshold is crossed, USD
  group_session_allowed: boolean — whether two members may share a single booked session
  group_session_max_participants: maximum participants in a shared session, count
  group_session_surcharge_usd: surcharge per additional participant in a shared session, USD
  nutrition_consult_included_sessions: nutrition consult sessions bundled free with the package, count (0 if none)
  rehab_clearance_required: boolean — whether a documented medical clearance is required before specialty_rehab sessions may be booked
  session_credit_rollover_allowed: boolean — whether unused sessions may roll into a renewed package
  session_credit_rollover_max: maximum sessions that may roll over, count
  deposit_required_usd: upfront deposit required at purchase, USD (0 for lower tiers)
  trainer_no_show_credit_sessions: sessions credited back if the assigned trainer fails to show, count
  gift_certificate_purchasable: boolean — whether this tier may be purchased as a gift certificate
  corporate_wellness_discount_pct: discount available when bundled with an active corporate wellness enrollment, percent
  seasonal_promo_discount_pct: discount applied during promotional periods, percent

