extended_policies:
  - id: retail_ext_topup_credit
    base_policy_refs: [retail_tier_topup_pricing]
    overwrite:
      - base_policy: retail_tier_topup_pricing
        superseded_clause: >-
          A top-up is credited at face value plus bonus_credit_pct bonus credit (or
          seasonal_promo_bonus_pct if that promotional rate is higher, never both at once)
        replaced_by: >-
          The bonus is granted only while the member's separately-held club membership account
          currently carries no outstanding dues balance; where that membership account's
          dues_balance is greater than zero, no bonus is credited on this top-up and only the
          tier's own face value is added.
    trigger: on_request
    subject: [retail_credit_topup]
    computes: credited_amount
    target_tool: apply_credit_topup_b1893e39
    rule: >
      A top-up is credited at the tier's own topup_amount_usd face value, plus a bonus equal to
      the greater of bonus_credit_pct and seasonal_promo_bonus_pct applied once to that face
      value, rounded to two decimal places -- the two bonus rates are never both applied, only
      the higher of the two. The bonus is granted only while the member's separately-held club
      membership account currently carries no outstanding dues balance; where that membership
      account's dues_balance is greater than zero, no bonus is credited on this top-up and only
      the tier's own face value is added. The face value plus any bonus is then added to the
      account's current balance, and the resulting total is capped at the tier's maximum balance
      cap: if face value plus bonus would carry the balance above that cap, only the amount
      that fits under the cap is credited and the remainder is not accepted onto the account.
      Rounding to two decimal places is applied once, at the point the final credited amount is
      computed, not separately at each intermediate step.
    prerequisite:
      - problem: retail_ext_topup_refund
        kind: value_input
        gate: room
        condition: >-
          the resulting total is capped at the tier's maximum balance cap
        policy_source: >-
          the resulting total is capped at the tier's maximum balance cap
        resolved_by: refund_topup_amount_847aef7e
        effect: >-
          refund_topup_amount_847aef7e's write lowers the account's current balance, which
          increases the room binding (maximum_balance_usd minus the current balance) that this
          policy's cap reads.
    cross_category:
      - category: membership
        as: branch
        reads: [dues_balance]
        note: >-
          A nonzero dues_balance on the member's separately-held club membership account blocks
          the top-up bonus for this transaction; the tier's face value is still credited.
    compute:
      - face: "P('topup_amount_usd')"
      - bonus_pct: "MX(P('bonus_credit_pct'), P('seasonal_promo_bonus_pct'))"
      - membership_balance: "CFIELD('membership','dues_balance', status='active')"
      - good_standing: "membership_balance == 0"
      - bonus_amount: "RND(face*bonus_pct/100, 2) if good_standing else 0"
      - subtotal: "face + bonus_amount"
      - current_balance: "F('credit_balance')"
      - cap: "P('maximum_balance_usd')"
      - room: "MX(cap - current_balance, 0)"
      - result: "RND(MN(subtotal, room), 2)"
    compute_basis:
      face: "A top-up is credited at the tier's own topup_amount_usd face value"
      bonus_pct: "plus a bonus equal to the greater of bonus_credit_pct and seasonal_promo_bonus_pct applied once to that face value"
      membership_balance: "The bonus is granted only while the member's separately-held club membership account currently carries no outstanding dues balance"
      good_standing: "The bonus is granted only while the member's separately-held club membership account currently carries no outstanding dues balance"
      bonus_amount: "where that membership account's dues_balance is greater than zero, no bonus is credited on this top-up and only the tier's own face value is added"
      room: "the resulting total is capped at the tier's maximum balance cap"
      result: "Rounding to two decimal places is applied once, at the point the final credited amount is computed, not separately at each intermediate step."
    inputs:
      history: []
      cross_category: [membership]

  - id: retail_ext_topup_refund
    base_policy_refs: [retail_refund_policy]
    overwrite:
      - base_policy: retail_refund_policy
        superseded_clause: >-
          only when requested before refund_window_days have elapsed since that top-up, counted
          as full calendar days with no partial-day rounding
        replaced_by: >-
          any top-up recorded within the calendar month preceding that reinstatement is
          automatically reversed in full, at refund_pct of the total dollar amount those top-ups
          credited, rounded to two decimal places, regardless of whether the member requests it
      - base_policy: retail_refund_policy
        superseded_clause: >-
          A refund of a top-up may be recorded only while the account is active or in the same
          moment as its confirmed cancellation to closed, and only when requested before
          refund_window_days have elapsed since that top-up, counted as full calendar days with
          no partial-day rounding
        replaced_by: >-
          The refund is issued only while the member's separately-held club membership account
          currently carries no outstanding dues balance; where that membership account's
          dues_balance is greater than zero, no refund is issued.
    trigger: state_due
    subject: [retail_credit_refund]
    computes: refund_amount
    target_tool: refund_topup_amount_847aef7e
    rule: >
      As a fraud-prevention safeguard, once a suspended account is reinstated, any top-up
      recorded within the calendar month preceding that reinstatement is automatically reversed
      in full, at refund_pct of the total dollar amount those top-ups credited, rounded to two
      decimal places, regardless of whether the member requests it -- so the member's account
      resumes from a clean, reverified balance. A refund of a top-up may be recorded only while
      the account is active or in the same moment as its confirmed cancellation to closed. The
      refund is issued only while the member's separately-held club membership account currently
      carries no outstanding dues balance; where that membership account's dues_balance is
      greater than zero, no refund is issued.
    prerequisite:
      - problem: retail_ext_reinstatement
        kind: state_gate
        gate: retail_credit_accounts.status
        condition: >-
          A refund of a top-up may be recorded only while the account is active or in the same
          moment as its confirmed cancellation to closed.
        policy_source: >-
          A refund of a top-up may be recorded only while the account is active or in the same
          moment as its confirmed cancellation to closed.
        resolved_by: reinstate_suspended_credit_account_88623c40
        effect: >-
          reinstate_suspended_credit_account_88623c40's write flips retail_credit_accounts.status
          from suspended to active, satisfying the account-status gate this refund reads.
    cross_category:
      - category: membership
        as: branch
        reads: [dues_balance]
        note: >-
          A nonzero dues_balance on the member's separately-held club membership account blocks
          this refund entirely; a zero balance allows the full refund_pct amount to be issued.
    compute:
      - topup_amt: "SUM('retail_credit_events','amount_usd', within_months=1, date_field='event_timestamp', event_type='retail_credit_topup')"
      - membership_balance: "CFIELD('membership','dues_balance', status='active')"
      - good_standing: "membership_balance == 0"
      - pct: "P('refund_pct')"
      - raw: "topup_amt*pct/100"
      - result: "RND(raw, 2) if good_standing else 0"
    compute_basis:
      topup_amt: "any top-up recorded within the calendar month preceding that reinstatement is automatically reversed in full, at refund_pct of the total dollar amount those top-ups credited"
      membership_balance: "The refund is issued only while the member's separately-held club membership account currently carries no outstanding dues balance"
      good_standing: "The refund is issued only while the member's separately-held club membership account currently carries no outstanding dues balance"
      result: "where that membership account's dues_balance is greater than zero, no refund is issued"
    inputs:
      history:
        - {table: retail_credit_events, aggregate: sum, field: amount_usd, within_months: 1, filters: {event_type: retail_credit_topup}}
      cross_category: [membership]

  - id: retail_ext_reinstatement
    base_policy_refs: [retail_fraud_suspension_policy]
    overwrite: []
    trigger: state_due
    subject: [retail_account_reinstated]
    computes: reinstatement_fee_amount
    target_tool: reinstate_suspended_credit_account_88623c40
    rule: >
      Reinstatement charges reinstatement_fee_usd for the account's tier, if any. Where the
      member also holds a corporate wellness enrollment that is itself currently suspended for
      the employer's nonpayment, that corporate program's own late_payment_fee_usd is added to
      the retail reinstatement fee as a shared account-standing risk surcharge, reflecting that a
      concurrently troubled linked enrollment is itself a fraud-risk signal; where the member
      holds no such enrollment, or it is not suspended, no surcharge applies and only the tier's
      own reinstatement_fee_usd, if any, is charged.
    prerequisite: []
    cross_category:
      - category: corp
        as: branch
        reads: [status, late_payment_fee_usd]
        note: >-
          Where the member's own corporate wellness enrollment is itself suspended for the
          employer's nonpayment, that program's late_payment_fee_usd is added onto the retail
          reinstatement fee as a shared risk surcharge.
    compute:
      - base_fee: "P('reinstatement_fee_usd')"
      - corp_suspended: "EXISTS('corp', status='suspended')"
      - corp_late_fee: "CPARAM('corp','late_payment_fee_usd', status='suspended') if corp_suspended else 0"
      - result: "RND(base_fee + corp_late_fee, 2)"
    compute_basis:
      base_fee: "Reinstatement charges reinstatement_fee_usd for the account's tier, if any."
      corp_suspended: "Where the member also holds a corporate wellness enrollment that is itself currently suspended for the employer's nonpayment"
      corp_late_fee: "that corporate program's own late_payment_fee_usd is added to the retail reinstatement fee as a shared account-standing risk surcharge"
    inputs:
      history: []
      cross_category: [corp]

  - id: retail_ext_auto_reload
    base_policy_refs: [retail_auto_reload_policy]
    overwrite:
      - base_policy: retail_auto_reload_policy
        superseded_clause: >-
          auto_reload_amount_usd is automatically added, provided a payment method is on file
          when auto_reload_payment_method_required applies, up to auto_reload_max_attempts_per_month
          attempts in a calendar month
        replaced_by: >-
          The reload is credited in full only while the member's separately-held club membership
          account currently carries no outstanding dues balance; where that membership account's
          dues_balance is greater than zero, the automatic reload is withheld and no amount is
          added until that balance clears
    trigger: state_due
    subject: [retail_auto_reload_triggered]
    computes: reload_amount
    target_tool: process_pending_auto_reload_c7cf4c5c
    rule: >
      For a tier with auto_reload_enabled, once the balance drops below the tier's auto-reload
      trigger level, auto_reload_amount_usd is automatically added. The reload is credited in full only while the
      member's separately-held club membership account currently carries no outstanding dues
      balance; where that membership account's dues_balance is greater than zero, the automatic
      reload is withheld and no amount is added until that balance clears, since an automatic
      credit extension draws on the same account-standing signal the chain uses elsewhere to gate
      store-credit benefits.
    prerequisite:
      - problem: retail_ext_redemption_settlement
        kind: value_input
        gate: current_balance
        condition: >-
          once the balance drops below the tier's auto-reload trigger level
        policy_source: >-
          once the balance drops below the tier's auto-reload trigger level
        resolved_by: redeem_credit_for_purchase_aff0cdd0
        effect: >-
          redeem_credit_for_purchase_aff0cdd0's write lowers retail_credit_accounts.credit_balance
          by the redeemed amount, changing the current_balance binding this policy's threshold
          check reads.
    cross_category:
      - category: membership
        as: branch
        reads: [dues_balance]
        note: >-
          A nonzero dues_balance on the member's separately-held club membership account withholds
          the automatic reload; a zero balance lets the full auto_reload_amount_usd post.
    compute:
      - threshold: "P('auto_reload_threshold_usd')"
      - current_balance: "F('credit_balance')"
      - below_threshold: "current_balance < threshold"
      - amount: "P('auto_reload_amount_usd')"
      - membership_balance: "CFIELD('membership','dues_balance', status='active')"
      - good_standing: "membership_balance == 0"
      - result: "RND(amount, 2) if (below_threshold and good_standing) else 0"
    compute_basis:
      threshold: "once the balance drops below the tier's auto-reload trigger level"
      current_balance: "once the balance drops below the tier's auto-reload trigger level"
      below_threshold: "once the balance drops below the tier's auto-reload trigger level"
      amount: "auto_reload_amount_usd is automatically added"
      membership_balance: "The reload is credited in full only while the member's separately-held club membership account currently carries no outstanding dues balance"
      good_standing: "The reload is credited in full only while the member's separately-held club membership account currently carries no outstanding dues balance"
      result: "where that membership account's dues_balance is greater than zero, the automatic reload is withheld and no amount is added until that balance clears"
    inputs:
      history: []
      cross_category: [membership]

  - id: retail_ext_redemption_settlement
    base_policy_refs: [retail_redemption_eligibility]
    overwrite:
      - base_policy: retail_redemption_eligibility
        superseded_clause: >-
          a single day's redemptions may not exceed redemption_daily_limit_usd
        replaced_by: >-
          once redemptions already recorded in the calendar month preceding this request are
          subtracted from that limit
      - base_policy: retail_redemption_eligibility
        superseded_clause: >-
          Store credit may be redeemed only while the account is active, and a single day's
          redemptions may not exceed redemption_daily_limit_usd
        replaced_by: >-
          Redemption is permitted at all only while the member's separately-held club membership
          account currently carries no outstanding dues balance; where that membership account's
          dues_balance is greater than zero, no amount is redeemed for this request.
    trigger: on_request
    subject: [retail_credit_redeemed]
    computes: redemption_amount
    target_tool: redeem_credit_for_purchase_aff0cdd0
    rule: >
      A redemption may be recorded only while the account is active. The amount redeemed toward
      a purchase equals the lesser of the account's current balance and the room remaining under
      redemption_daily_limit_usd for the tier, once redemptions already recorded in the calendar
      month preceding this request are subtracted from that limit -- this policy evaluates the
      limit over the calendar month preceding the request rather than a single calendar day,
      superseding the base day-window for this write. The result is rounded to two decimal
      places. Redemption is permitted at all only while the member's separately-held club
      membership account currently carries no outstanding dues balance; where that membership
      account's dues_balance is greater than zero, no amount is redeemed for this request.
    prerequisite: []
    cross_category:
      - category: membership
        as: branch
        reads: [dues_balance]
        note: >-
          A nonzero dues_balance on the member's separately-held club membership account blocks
          this redemption entirely; a zero balance allows the full computed amount to be redeemed.
    compute:
      - current_balance: "F('credit_balance')"
      - daily_limit: "P('redemption_daily_limit_usd')"
      - month_redeemed: "ABS(SUM('retail_credit_events','amount_usd', within_months=1, date_field='event_timestamp', event_type='retail_credit_redeemed'))"
      - room_under_limit: "MX(daily_limit - month_redeemed, 0)"
      - room: "MN(current_balance, room_under_limit)"
      - membership_balance: "CFIELD('membership','dues_balance', status='active')"
      - good_standing: "membership_balance == 0"
      - result: "RND(room, 2) if good_standing else 0"
    compute_basis:
      current_balance: "The amount redeemed toward a purchase equals the lesser of the account's current balance and the room remaining under redemption_daily_limit_usd for the tier"
      daily_limit: "The amount redeemed toward a purchase equals the lesser of the account's current balance and the room remaining under redemption_daily_limit_usd for the tier"
      month_redeemed: "once redemptions already recorded in the calendar month preceding this request are subtracted from that limit"
      room_under_limit: "once redemptions already recorded in the calendar month preceding this request are subtracted from that limit"
      room: "The amount redeemed toward a purchase equals the lesser of the account's current balance and the room remaining under redemption_daily_limit_usd for the tier"
      membership_balance: "Redemption is permitted at all only while the member's separately-held club membership account currently carries no outstanding dues balance"
      good_standing: "Redemption is permitted at all only while the member's separately-held club membership account currently carries no outstanding dues balance"
      result: "where that membership account's dues_balance is greater than zero, no amount is redeemed for this request"
    inputs:
      history:
        - {table: retail_credit_events, aggregate: sum, field: amount_usd, within_months: 1, filters: {event_type: retail_credit_redeemed}}
      cross_category: [membership]

  - id: retail_ext_closure_settlement
    base_policy_refs: [retail_refund_policy]
    overwrite:
      - base_policy: retail_refund_policy
        superseded_clause: >-
          at closure, an unused balance at or above minimum_closure_refund_usd is refunded at
          refund_pct, and a balance below minimum_closure_refund_usd is forfeited under
          unused_balance_forfeiture_on_closure_pct
        replaced_by: >-
          The refunded portion is issued only while the member's separately-held club membership
          account currently carries no outstanding dues balance; where that membership account's
          dues_balance is greater than zero, the full remaining balance is instead forfeited and
          none of it is refunded
    trigger: on_request
    subject: [retail_credit_refund, retail_account_cancelled]
    computes: settlement_amount
    target_tool: issue_closure_refund_05905e3c
    rule: >
      At closure, the account's remaining balance is refunded at the tier's refund percentage
      when that balance is at or above the tier's minimum balance for a closure refund; a balance
      below minimum_closure_refund_usd is
      instead forfeited at unused_balance_forfeiture_on_closure_pct, with the remainder still
      refunded at refund_pct -- the applicable percentage (refund_pct, or 100 minus
      unused_balance_forfeiture_on_closure_pct, whichever branch applies) is applied once to the
      account's current balance and the result is rounded to two decimal places. The refunded
      portion is issued only while the member's separately-held club membership account
      currently carries no outstanding dues balance; where that membership account's dues_balance
      is greater than zero, the full remaining balance is instead forfeited and none of it is
      refunded, since the chain nets an open store-credit balance against outstanding household
      arrears elsewhere in the member's portfolio before returning any cash.
    prerequisite:
      - problem: retail_ext_auto_reload
        kind: value_input
        gate: balance
        condition: >-
          the account's remaining balance is refunded at the tier's refund percentage when that
          balance is at or above the tier's minimum balance for a closure refund
        policy_source: >-
          the account's remaining balance is refunded at the tier's refund percentage when that
          balance is at or above the tier's minimum balance for a closure refund
        resolved_by: process_pending_auto_reload_c7cf4c5c
        effect: >-
          process_pending_auto_reload_c7cf4c5c's write raises retail_credit_accounts.credit_balance
          by the reload amount, changing the balance binding this policy's settlement reads.
    cross_category:
      - category: membership
        as: branch
        reads: [dues_balance]
        note: >-
          A nonzero dues_balance on the member's separately-held club membership account forfeits
          the entire remaining balance at closure instead of refunding it.
    compute:
      - balance: "F('credit_balance')"
      - min_refund: "P('minimum_closure_refund_usd')"
      - eligible: "balance >= min_refund"
      - forfeiture_pct: "P('unused_balance_forfeiture_on_closure_pct')"
      - refund_pct: "P('refund_pct')"
      - effective_pct: "refund_pct if eligible else (100 - forfeiture_pct)"
      - membership_balance: "CFIELD('membership','dues_balance', status='active')"
      - good_standing: "membership_balance == 0"
      - result: "RND(balance*effective_pct/100, 2) if good_standing else 0"
    compute_basis:
      balance: "the account's remaining balance is refunded at the tier's refund percentage when that balance is at or above the tier's minimum balance for a closure refund"
      min_refund: "the account's remaining balance is refunded at the tier's refund percentage when that balance is at or above the tier's minimum balance for a closure refund"
      eligible: "a balance below minimum_closure_refund_usd is instead forfeited at unused_balance_forfeiture_on_closure_pct"
      forfeiture_pct: "a balance below minimum_closure_refund_usd is instead forfeited at unused_balance_forfeiture_on_closure_pct, with the remainder still refunded at refund_pct"
      effective_pct: "the applicable percentage (refund_pct, or 100 minus unused_balance_forfeiture_on_closure_pct, whichever branch applies) is applied once to the account's current balance"
      membership_balance: "The refunded portion is issued only while the member's separately-held club membership account currently carries no outstanding dues balance"
      good_standing: "The refunded portion is issued only while the member's separately-held club membership account currently carries no outstanding dues balance"
      result: "the full remaining balance is instead forfeited and none of it is refunded"
    inputs:
      history: []
      cross_category: [membership]

workflows:
  - id: retail_wf_credit_account_closure
    scenario: >
      Applies when a member with an active pro-shop store-credit account wants to redeem
      whatever usable balance it currently holds toward a purchase and then close the account
      outright, taking whatever final settlement closure policy allows on what is left. If
      spending that balance down leaves the account below the tier's own auto-reload threshold,
      the tier's own automatic-reload rule posts a pending reload before the account is closed, so
      the closure settlement reflects the account's true, reloaded standing rather than the
      near-empty balance the redemption alone would have left behind. Once complete, the account
      is closed, its transaction history carries the redemption, the reload (if any) and the
      closure settlement, and its spendable balance is reduced accordingly.
    steps:
      - {tool: redeem_credit_for_purchase_aff0cdd0, owner: agent, writes: retail_credit_events, subject: retail_credit_redeemed, base_policy_refs: [retail_redemption_eligibility], role: spend_down_balance, computed_by: [retail_ext_redemption_settlement]}
      - {tool: process_pending_auto_reload_c7cf4c5c, owner: agent, writes: retail_credit_events, subject: retail_auto_reload_triggered, base_policy_refs: [retail_auto_reload_policy], role: pending_reload_true_up, computed_by: [retail_ext_auto_reload]}
      - {tool: confirm_account_closure_988c79ea, owner: user, writes: retail_credit_accounts, subject: retail_account_cancelled, base_policy_refs: [retail_refund_policy], role: customer_confirms_closure, computed_by: []}
      - {tool: issue_closure_refund_05905e3c, owner: agent, writes: retail_credit_events, subject: retail_credit_refund, base_policy_refs: [retail_refund_policy], role: final_settlement, computed_by: [retail_ext_closure_settlement]}
    dataflow:
      - from_step: 2
        to_step: 3
        kind: state_effect
        source_table: retail_credit_accounts
        source_field: status
        consumer_bindings: []
        establishes_gates:
          - policy_id: retail_refund_policy
            eligibility_id: refund_requires_open_or_just_closed_account
            evidence_field: retail_credit_accounts.status
    order_rationale: >
      Step 0 must run before step 1 because retail_ext_auto_reload's own rule fires only once the
      balance drops below auto_reload_threshold_usd, and that check must read the account's
      CURRENT balance; where a redemption large enough to cross that threshold is being recorded
      in the same visit, the reload determination is meaningless if made on the pre-redemption
      balance -- redeeming first makes the balance the reload check reads accurate.
      Step 1 must run before step 2 because retail_ext_closure_settlement's own rule refunds the
      account's remaining balance, and that balance must reflect the reload (if any) before the
      settlement is computed, or the member would be shortchanged whatever the reload just added.
      Step 2 must run before step 3 because retail_redemption_eligibility requires the account to
      be active for a redemption to be recorded and retail_refund_policy ties the closure
      settlement to the account's status being active or, in the same moment, its confirmed
      cancellation to closed -- the settlement is the closing entry for an account that has just
      been confirmed closed, and issuing it before the member's own confirmation would settle an
      account that was never actually closed by its owner.
    prerequisite: []
