- id: biz_seat_management
  subject:
  - biz_seat_grant
  - biz_seat_assign
  rule: The contracted seats are placed on the programme for each contract period, and a seat is consumed the moment it is assigned to a named traveller. A seat is assigned only while the programme record
    stands at active. Seats are changed only when the corporate desk has already recorded an approved seat request against this programme. A seat may be moved from one traveller to another only after it
    has been held for the tier's cool-off days, and the move carries the tier's reassignment charge. Seats added mid-term are charged at the tier's seat licence rate pro rata for the remainder of the period,
    and seats removed mid-term are not credited until the next period begins. A traveller without an assigned seat may not book through the programme at all, and a booking attempted for them is refused
    rather than charged at the public price. Seats never move between programmes, not even between entities of the same group.
  eligibility:
  - id: programme_active_for_seats
    applies_to:
    - biz_seat_assign
    kind: state
    condition: A seat is assigned only while the programme record stands at active.
    evidence_fields:
    - biz_programs.status
    - biz_programs.biz_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - biz_programs.biz_program_id
      action_bindings:
        biz_programs.biz_program_id: biz_program_id
    state_contract:
      field: biz_programs.status
      allowed:
      - active
  - id: seat_request_approved
    applies_to:
    - biz_seat_assign
    kind: authorization
    condition: Seats are changed only when the corporate desk has already recorded an approved seat request against this programme.
    evidence_fields:
    - biz_seat_requests.request_status
    - biz_seat_requests.biz_request_id
    - biz_seat_requests.biz_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - biz_seat_requests.biz_request_id
      action_bindings:
        biz_seat_requests.biz_request_id: biz_request_id
