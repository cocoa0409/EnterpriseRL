events:
- type: biz_enrol
  target: biz_programs
  mutation: create
  meaning: A company applies for a corporate travel programme and an account is opened.
  grain: One row per corporate programme opened for one contracting company.
  fields:
    biz_program_id: reference of the new programme
    customer_id: contracting customer administering it
    variant_name: programme tier applied for
    status: the programme opens as an application
    account_number: corporate account number issued
    company_name: registered name of the contracting company
    company_country: country the contracting entity is registered in
    applied_date: date the application was received
    seats_contracted: traveller seats applied for
    billing_frequency: how often the subscription will be invoiced
    payment_terms_days: payment terms agreed
    administrator_email: contact address of the administrator
    administrator_phone: contact number of the administrator
  triggers: []
- type: biz_activate
  target: biz_programs
  mutation:
    transition:
      from: applied
      to: active
  meaning: The programme is implemented and the company may begin booking through it.
  grain: One row per programme, at the moment it is activated.
  fields:
    biz_program_id: programme being activated
    status: the programme becomes active
    activated_at: moment of activation
    contract_start_date: first date of the contract term
    contract_end_date: last date of the contract term
    renewal_notice_date: last date for notice not to renew
  triggers:
  - event: biz:biz_subscription_charge
    map:
      biz_program_id: biz_program_id
      charge_category: subscription
      reason_code: routine_billing
  - event: biz:biz_seat_grant
    map:
      biz_program_id: biz_program_id
      charge_category: seat_grant
      reason_code: seat_change
- type: biz_suspend
  target: biz_programs
  mutation:
    transition:
      from: active
      to: suspended
  meaning: Booking through the programme is stopped while an overdue balance or a contractual question is settled.
  grain: One row per programme, at the moment it is suspended.
  fields:
    biz_program_id: programme being suspended
    status: the programme becomes suspended
    suspended_at: moment of suspension
  triggers: []
- type: biz_resume
  target: biz_programs
  mutation:
    transition:
      from: suspended
      to: active
  meaning: The question is settled and booking through the programme runs again.
  grain: One row per programme, at the moment the suspension is lifted.
  fields:
    biz_program_id: programme being resumed
    status: the programme becomes active again
  triggers: []
- type: biz_expire
  target: biz_programs
  mutation:
    transition:
      from: active
      to: expired
  meaning: The contract term ends and the programme is not renewed.
  grain: One row per programme, at the moment its term expires.
  fields:
    biz_program_id: programme expiring
    status: the programme expires
    contract_end_date: last date of the term that has ended
  triggers: []
- type: biz_close
  target: biz_programs
  mutation:
    transition:
      from: active
      to: closed
  meaning: The company closes its own programme and the agreement is ended.
  grain: One row per programme, at the moment the company closes it.
  fields:
    biz_program_id: programme being closed
    status: the programme becomes closed
    closed_date: date the company closed it
  triggers:
  - event: biz:biz_transaction_fee
    map:
      biz_program_id: biz_program_id
      charge_category: early_exit_fee
      reason_code: contract_termination
- type: biz_program_amend
  target: biz_programs
  mutation: update
  meaning: The contracted seats, the billing arrangement or the administrator's details are changed.
  grain: One row per programme, each time its contracted particulars are changed.
  fields:
    biz_program_id: programme being changed
    seats_contracted: changed number of contracted seats
    billing_frequency: changed invoicing frequency
    payment_terms_days: changed payment terms
    administrator_email: changed administrator address
    administrator_phone: changed administrator number
  triggers: []
- type: biz_subscription_charge
  target: biz_billing_entries
  meaning: The platform subscription and the seat licences for a billing period are charged to the company.
  grain: One row per billing period charged on one programme, for the subscription or for one seat licence.
  distinguish_by:
  - charge_category
  - billing_period_start
  - seat_sequence
  - posted_at
