- id: biz_overage
  subject:
  - biz_overage_charge
  rule: Booking transactions are counted for each billing period against the tier's included allowance, and every transaction beyond it is charged at the tier's overage rate. The count is taken on transactions
    actually completed in the period, so a booking made in one period and cancelled in the next still counts in the period it was made. An unused allowance is never carried into the next period and is never
    credited back. Where a company exceeds its allowance in three consecutive periods it is offered the tier above, and the overage continues to be charged until the move takes effect. Overage is charged
    once for the whole period rather than transaction by transaction, and is stated on the invoice with the count it was measured over. Transactions on a suspended programme are not counted, because no
    booking may be made while it is suspended.
  eligibility: []
  params:
    consecutive_period_review: 3
    per_tier:
      Business Starter Programme:
        included_transactions_per_month: =included_transactions_per_month
        overage_fee_per_transaction_usd: =overage_fee_per_transaction_usd
      Business Team Programme:
        included_transactions_per_month: =included_transactions_per_month
        overage_fee_per_transaction_usd: =overage_fee_per_transaction_usd
      Business Pro Programme:
        included_transactions_per_month: =included_transactions_per_month
        overage_fee_per_transaction_usd: =overage_fee_per_transaction_usd
      Business Enterprise Programme:
        included_transactions_per_month: =included_transactions_per_month
        overage_fee_per_transaction_usd: =overage_fee_per_transaction_usd
      Business Enterprise Plus Programme:
        included_transactions_per_month: =included_transactions_per_month
        overage_fee_per_transaction_usd: =overage_fee_per_transaction_usd
      Business Global Programme:
        included_transactions_per_month: =included_transactions_per_month
        overage_fee_per_transaction_usd: =overage_fee_per_transaction_usd
  formula:
    overage_charge_usd: max(transaction_count - included_transactions_per_month, 0) * overage_fee_per_transaction_usd
  measures:
  - biz_msr_transactions_billing_period
- id: biz_credit_notes
  subject:
  - biz_credit_note
  rule: 'A credit note is raised against the invoice line it corrects and never as a free-standing amount, so every credit points back to what it reverses. A credit note is raised only while the programme
    record stands at active, suspended or expired. A billing line is corrected on dispute only when frozen time is not after the moment the invoice carrying the disputed line was issued to the company plus
    the dispute window of the programme tier held. The dispute window is counted in whole calendar days from the day after the invoice date, weekends and public holidays included, and a dispute raised exactly
    on the closing day is still in time. Where the service desk misses the tier''s response target, the tier''s service credit is applied to the following period''s subscription, and a tier with no service
    credit gives none. The volume rebate accrues on booking value above the tier''s threshold in the contract year, at the tier''s rebate percentage, and is credited once after the contract year closes
    rather than month by month. A credit note never becomes a payment: it is applied against what the company owes, and a balance in the company''s favour at closure is settled only after every open invoice
    has been cleared.'
  eligibility:
  - id: programme_billable
    applies_to:
    - biz_credit_note
    kind: state
    condition: A credit note is raised only while the programme record stands at active, suspended or expired.
    evidence_fields:
    - biz_programs.status
    - biz_programs.biz_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - biz_programs.biz_program_id
      action_bindings:
        biz_programs.biz_program_id: biz_program_id
    state_contract:
      field: biz_programs.status
      allowed:
      - active
      - suspended
      - expired
  - id: inside_dispute_window
    applies_to:
    - biz_credit_note
    kind: time
    condition: A billing line is corrected on dispute only when frozen time is not after the moment the invoice carrying the disputed line was issued to the company plus the dispute window of the programme
      tier held.
    evidence_fields:
    - biz_billing_entries.posted_at
    - biz_billing_entries.invoice_reference
    - biz_billing_entries.biz_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - biz_billing_entries.invoice_reference
      action_bindings:
        biz_billing_entries.invoice_reference: invoice_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the invoice carrying the disputed line was issued to the company
      anchor_source: biz_billing_entries.posted_at
      relation: not_after
      duration_source: variants.invoice_dispute_window_days
      unit: calendar_days
      counting_rule: The dispute window is counted in whole calendar days from the day after the invoice date, weekends and public holidays included, and a dispute raised exactly on the closing day is still
        in time.
      boundary: inclusive
  params:
    per_tier:
      Business Starter Programme:
        invoice_dispute_window_days: =invoice_dispute_window_days
        sla_credit_pct: =sla_credit_pct
        support_response_target_minutes: =support_response_target_minutes
        volume_rebate_threshold_usd: =volume_rebate_threshold_usd
