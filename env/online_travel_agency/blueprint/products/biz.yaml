    access — are included or absent exactly as the tier prescribes, and an absent module is never enabled as a goodwill gesture. The service desk is staffed for the tier's hours and targets the tier's first-response
    time; a miss is settled by the tier's service credit and by nothing else. A named account manager and a formal quarterly review belong to the tiers that carry them, and a tier without them reaches the
    general corporate desk. The agency advises the company in writing before it changes any contractual term, and the change takes effect no earlier than the date stated in the notice. Where the company
    does not accept a contractual change it may end the agreement at the date the change takes effect without the early exit charge. Negotiated supplier discounts belong to the programme and are applied
