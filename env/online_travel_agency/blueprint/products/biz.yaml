- id: biz_negotiated_rates
  subject:
  - biz_transaction_fee
  - biz_subscription_charge
  rule: The negotiated air, hotel and car discounts of the tier are applied to the published price of a booking made under the programme, and they replace every consumer concession rather than adding to
    them. A traveller booking under the programme earns no personal club points and takes no personal club fee waiver on that booking, whatever tier they hold; a tier that permits pooling lets the company
    collect those points into a company pool instead. Preferred supplier rates are reached only by the tiers that carry preferred access, and a tier without it books at published rates less its negotiated
    discount. A negotiated discount is applied before taxes and third-party fees and never after. Where a supplier's own promotional price is lower than the negotiated price, the lower of the two is taken
    and the negotiated discount is not applied on top. A booking made outside the programme by a traveller who holds a seat is a private booking, priced on consumer terms, and is never billed to the company.
  eligibility: []
  params:
    discount_basis: published price before taxes and third-party fees
    price_selection: take_the_lower
    per_tier:
