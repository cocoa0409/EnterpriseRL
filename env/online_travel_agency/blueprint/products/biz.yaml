  rule: The contracted seat count may be changed within the tier's seat range, and a change outside that range is a tier change rather than an amendment. The invoicing frequency may be changed only at a
    period boundary, and a change from annual to monthly does not entitle the company to a refund of the annual subscription already charged. Payment terms are contractual and are changed only with the
    corporate desk's agreement; the administrator may not change them at the service desk. Changing the administrator's address or telephone number is free and takes effect immediately. An amendment never
    alters the contract term, the negotiated rates or the early exit charge, all of which follow the agreement rather than the account record. Where an amendment changes what is billed, the change takes
    effect from the start of the next billing period and never retrospectively.
