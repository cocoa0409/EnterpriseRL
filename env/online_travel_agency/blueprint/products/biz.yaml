  rule: A programme tier may only be sold where the company contracts for at least the tier's minimum seats and at most its ceiling, and a company outside that range is quoted the tier that fits it instead.
    The onboarding charge falls due when the programme is activated and is never charged again on renewal. The contract term begins on the activation date and runs for the tier's term in calendar months;
    implementation runs alongside the term and does not postpone it. A programme renews automatically for a further term unless notice is given by the tier's notice date, and the renewal is priced at the
    tier's published rates as they then stand. A company that outgrows its tier's seat ceiling is moved to the tier above at the next renewal, and the move is never made mid-term without a fresh agreement.
