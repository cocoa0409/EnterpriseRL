category: biz
display_name: Corporate Travel Programmes
binding:
  holding_table: biz_programs
  event_tables:
  - biz_billing_entries
  intake_tables:
  - biz_seat_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    billing_balance_usd: programme_billing
    seat_allowance_remaining: seat_allowance
lifecycle:
  states:
  - applied
  - active
  - suspended
  - expired
  - closed
  transitions:
  - from: applied
    to: active
    by: system
    means: The programme is implemented and the company may begin booking through it.
  - from: active
    to: suspended
    by: agent
    means: Booking is stopped while an overdue balance or a contractual question is settled.
  - from: suspended
    to: active
    by: agent
    means: The balance is cleared or the question settled and booking runs again.
  - from: active
    to: expired
    by: system
    means: The contract term ends without renewal.
  - from: active
    to: closed
    by: user
    means: The company closes its own programme and the agreement is ended.
  - from: suspended
    to: closed
    by: agent
    means: The contractual question is decided against the company and the agreement is withdrawn.
  - from: expired
    to: closed
    by: system
    means: An expired programme is archived once every open invoice has settled.
accounts:
- key: programme_billing
  unit: USD
  meaning: 'Net amount billed to the company on this programme: subscriptions, seat licences, transaction fees, overage and interest credit the account, and credit notes and rebates debit it.'
- key: seat_allowance
  unit: traveller seats
  meaning: 'Contracted traveller seats still unassigned on this programme: a grant for the contract period credits the account and each assignment to a named traveller debits it.'
parameter_schema:
  monthly_subscription_usd: Monthly platform subscription for the programme, in USD.
  annual_subscription_usd: Annual platform subscription where the company pays yearly, in USD.
  contract_term_months: Length of one contract term in calendar months.
  auto_renew: Whether the contract renews automatically at the end of its term.
  renewal_notice_days: Calendar days before the term ends by which notice not to renew must be given.
  contract_early_exit_fee_usd: Charge for ending the contract before the term expires, in USD.
  onboarding_fee_usd: One-off implementation charge when the programme is activated, in USD.
  implementation_days: Working days the implementation takes from activation.
  min_seats: Smallest number of traveller seats the programme may be contracted for.
  seats_included: Traveller seats carried by the subscription before seat licences are charged.
  max_seats: Largest number of traveller seats the programme tier accepts.
  seat_price_per_month_usd: Monthly licence charge for each seat beyond those included, in USD.
  seat_reassignment_fee_usd: Charge to move a seat from one named traveller to another, in USD.
  seat_reassignment_cooloff_days: Calendar days a seat must be held by a traveller before it may be reassigned.
  online_booking_fee_usd: Transaction fee for a booking made in the online tool, in USD.
  offline_booking_fee_usd: Transaction fee for a booking made through the service desk, in USD.
  after_hours_booking_fee_usd: Transaction fee for a booking made outside business hours, in USD.
  ticket_change_fee_usd: Programme fee for reworking an issued ticket, in USD.
  refund_processing_fee_usd: Programme fee for processing a refund, in USD.
  hotel_booking_fee_usd: Transaction fee for a hotel booking, in USD.
  car_booking_fee_usd: Transaction fee for a car rental booking, in USD.
  rail_booking_fee_usd: Transaction fee for a rail booking, in USD.
  group_booking_fee_usd: Transaction fee for a group booking handled by the group desk, in USD.
  visa_service_fee_usd: Charge for the programme's visa and documentation service per traveller, in USD.
  custom_report_fee_usd: Charge for a report built outside the standard suite, in USD.
  included_transactions_per_month: Booking transactions included in the subscription each month.
  overage_fee_per_transaction_usd: Charge for each booking transaction beyond the included allowance, in USD.
  payment_terms_days: Days from the invoice date by which the company must pay.
  late_payment_interest_pct: Monthly interest charged on an overdue balance, as a percentage.
  credit_limit_usd: Largest unpaid balance the programme may carry before new bookings are held, in USD.
  consolidated_invoicing: Whether every booking is billed on one consolidated invoice rather than card by card.
  invoice_dispute_window_days: Calendar days after the invoice date within which a line may be disputed.
  negotiated_air_discount_pct: Negotiated discount on published air fares, as a percentage.
  negotiated_hotel_discount_pct: Negotiated discount on published hotel rates, as a percentage.
  negotiated_car_discount_pct: Negotiated discount on published car rental rates, as a percentage.
  preferred_rate_access: Whether the programme reaches the agency's preferred supplier rates.
  policy_engine_included: Whether the travel policy engine enforces the company's rules at the point of booking.
  approval_workflow_levels: Levels of approval the workflow supports before a booking is released.
  duty_of_care_included: Whether the duty of care module is included in the subscription.
  traveller_tracking_included: Whether live traveller tracking is included in the subscription.
  risk_alerts_included: Whether destination risk alerts are included in the subscription.
  reporting_suite: 'Depth of the reporting suite included: basic, standard, advanced or enterprise.'
  savings_report_included: Whether a monthly savings report against published fares is included.
  unused_ticket_management_included: Whether the programme tracks and reuses unused air tickets on the company's behalf.
  api_access_included: Whether programmatic access to the booking platform is included.
  sso_included: Whether single sign-on against the company's own directory is included.
  expense_integration_included: Whether booking data is delivered into the company's expense system automatically.
  dedicated_account_manager: Whether a named account manager is assigned to the programme.
  support_hours: Hours a day the programme's service desk is staffed.
  support_response_target_minutes: Minutes within which the service desk targets a first response.
  sla_credit_pct: Percentage of the monthly subscription credited when the response target is missed, as a percentage.
  quarterly_business_review: Whether a formal quarterly business review is held with the company.
  training_sessions_included: Training sessions for the company's travellers included each contract year.
  volume_rebate_threshold_usd: Annual booking value at which a rebate begins to accrue, in USD.
  volume_rebate_pct: Rebate on annual booking value above the threshold, as a percentage.
  club_points_pooling_allowed: Whether travellers on the programme may pool their personal club points into a company pool.
  currency_conversion_markup_pct: Percentage added when the company elects to be invoiced in a currency other than the contract currency.
