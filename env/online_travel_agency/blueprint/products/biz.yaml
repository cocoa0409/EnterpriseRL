    less than the same booking made through the service desk. A transaction fee is raised only while the programme record stands at active. A booking made outside the service desk's staffed hours carries
    the tier's after-hours fee instead of the offline fee, and the two are never both charged. Reworking an issued ticket carries the tier's change fee and processing a refund carries its refund fee, each
