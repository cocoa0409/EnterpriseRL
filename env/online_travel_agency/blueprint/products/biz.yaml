policies:
- id: biz_agg_multi_holding
  subject:
  - biz_enrol
  rule: 'One contracting company holds exactly one corporate travel programme, and a second programme is never opened for the same legal entity. A group of companies with separate legal entities holds one
    programme per entity, and the entities are billed separately even where one address administers them all. Where a company has somehow acquired two programmes, the older is kept, the seats and the balance
    of the younger are merged into it, and the younger is closed. A traveller is not a programme: travellers occupy seats on a programme and hold their own personal club membership entirely separately.'
  eligibility: []
  params:
    max_per_customer: 1
    merge_keeps: oldest_programme
- id: biz_enrolment_terms
