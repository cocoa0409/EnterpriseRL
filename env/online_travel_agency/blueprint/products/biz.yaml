    those included in the tier are charged at the tier's seat licence rate for each seat for each month of the period, counted on the seats contracted rather than the seats actually assigned. A period that
    begins or ends part way through a month is charged pro rata by whole days out of the days in that month. Invoices fall due within the tier's payment terms counted from the invoice date, and an overdue
    balance carries the tier's monthly interest from the day after it falls due. A programme whose unpaid balance passes the tier's credit limit is suspended rather than allowed to book further. Where the
    company elects to be invoiced in a currency other than the contract currency, the tier's conversion markup is added to each invoice.
