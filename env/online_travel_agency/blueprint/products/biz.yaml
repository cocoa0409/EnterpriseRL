- id: biz_lifecycle
  subject:
  - biz_suspend
  - biz_resume
  - biz_expire
  - biz_close
  rule: 'A programme is suspended where the unpaid balance passes the tier''s credit limit or where a contractual question is open, and while it is suspended no booking may be made and no transaction fee
    arises. A suspended programme is resumed once the balance is cleared or the question settled, with its seats, its term and its negotiated rates exactly as they stood. A programme whose term ends without
    renewal expires, and the company keeps access to its own reporting for the reporting retention the tier provides but may book no further. The contract is ended early only when the corporate desk has
    already recorded an approved termination against this programme. Only the company may close its own programme, and where it closes before the term expires the tier''s early exit charge falls due in
    addition to everything already billed. A closed programme is never reopened: a company that returns is enrolled afresh at the tier that fits it, with no seats, no rates and no balance carried over.'
  eligibility:
  - id: termination_approved
    applies_to:
    - biz_close
    kind: authorization
    condition: The contract is ended early only when the corporate desk has already recorded an approved termination against this programme.
    evidence_fields:
    - biz_seat_requests.request_status
    - biz_seat_requests.biz_request_id
    - biz_seat_requests.biz_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - biz_seat_requests.biz_request_id
      action_bindings:
        biz_seat_requests.biz_request_id: biz_request_id
  params:
    reporting_retention_days: 180
