- id: bundle_club_and_corporate_interaction
  subject:
  - bundle_final_payment_charge
  rule: 'Holding an active traveller club membership changes what this package is charged: the club tier held on the deposit date decides the package discount applied to the price, and the product''s own
    terms decide everything else. A club discount and a corporate programme rate are mutually exclusive: a package booked under a corporate programme takes the programme''s negotiated price and no club
    discount on top, and only a product that permits corporate booking may be booked that way at all. Travel protection bought together with the package takes the product''s bundled discount, and that discount
    and the club insurance discount are never both applied; the larger of the two is taken. Club points accrue on the package price actually paid, at the earn rate of the product booked, and never on the
    agency service fee, port charges, gratuities or visa assistance. Where the member''s tier changes between deposit and departure, the discount applied at deposit stands and is neither topped up nor clawed
    back. A package paid for entirely with a future travel credit earns no points at all.'
  eligibility: []
  params:
    discount_basis: club tier held on the deposit date
