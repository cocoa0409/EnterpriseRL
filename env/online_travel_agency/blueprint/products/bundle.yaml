- id: bundle_booking_terms
  subject:
  - bundle_quote
  - bundle_deposit
  rule: 'A product may only be sold where departure is at least its advance-purchase distance away, where departure falls inside its booking window, and where the party size falls between its minimum and
    its ceiling. A party at or above the product''s group threshold is not sold under this charter and is passed to the group desk. The deposit is the product''s flat amount per traveller, or its share
    of the package price where the product takes a share; the two are never both taken. A reduced promotional deposit may be taken only on a product that allows it, and the difference to the standard deposit
    falls due with the balance rather than being written off. A quotation holds no allocation: the itinerary is held only once the deposit has been taken, and a quotation may be re-priced at any time before
    that. The agency service fee is charged per traveller when the deposit is taken and is never returned.'
  eligibility: []
  params:
    per_tier:
      Value Bundle Package:
        advance_purchase_days: =advance_purchase_days
        booking_window_days: =booking_window_days
        deposit_per_person_usd: =deposit_per_person_usd
        deposit_pct: =deposit_pct
