category: bundle
display_name: Vacation Package Products
binding:
  holding_table: bundle_packages
  event_tables:
  - bundle_ledger_entries
  intake_tables:
  - bundle_change_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    amount_paid_usd: package_paid
    credit_balance_usd: package_credit
lifecycle:
  states:
  - quoted
  - deposit_held
  - confirmed
  - travelling
  - completed
  - cancelled
  - closed
  transitions:
  - from: quoted
    to: deposit_held
    by: system
    means: The deposit is taken and the operator holds the itinerary.
  - from: quoted
    to: cancelled
    by: agent
    means: A quotation the party does not take up is withdrawn.
  - from: deposit_held
    to: confirmed
    by: system
    means: The balance is received and every supplier is confirmed.
  - from: deposit_held
    to: cancelled
    by: user
    means: The party gives up the package before the balance falls due.
  - from: confirmed
    to: travelling
    by: system
    means: The party departs and the packaged journey begins.
  - from: confirmed
    to: cancelled
    by: user
    means: The party cancels a fully paid package before departure.
  - from: travelling
    to: completed
    by: system
    means: The party returns and the package is fulfilled.
  - from: completed
    to: closed
    by: system
    means: The fulfilled package is archived once every component has settled.
  - from: cancelled
    to: closed
    by: system
    means: The cancelled package is archived once the penalty and any refund have settled.
accounts:
- key: package_paid
  unit: USD
  meaning: 'Net money the party has put into this package: the deposit, instalments, components, supplements and penalties credit the account, and payouts to the original form of payment debit it.'
- key: package_credit
  unit: USD
  meaning: 'Value held on future travel credit vouchers produced by this package: an issued voucher credits the account and a redemption debits it.'
parameter_schema:
  agency_service_fee_per_person_usd: Agency booking service fee charged per traveller, in USD.
  deposit_per_person_usd: Deposit taken per traveller when the package is booked, in USD.
  deposit_pct: Deposit expressed as a percentage of the package price where the product takes a share rather than a flat amount.
  low_deposit_promo_allowed: Whether a reduced promotional deposit may be taken instead of the standard one.
  low_deposit_amount_usd: Reduced promotional deposit per traveller, in USD.
  final_payment_days_before_departure: Calendar days before departure by which the balance must be paid in full.
  payment_plan_available: Whether the balance may be paid in scheduled instalments.
  payment_plan_instalments: Number of scheduled instalments the balance may be split into.
  advance_purchase_days: Minimum calendar days between booking and departure for the product to be sold.
  booking_window_days: Furthest ahead of departure, in calendar days, that the product may be booked.
  min_party_size: Smallest party the product may be sold to.
  max_party_size: Largest party one package may carry before group terms apply.
  group_booking_min_pax: Number of travellers from which the group desk takes the booking instead.
  group_free_place_ratio: Number of paying travellers that earns one free place on a group booking; 0 where no free place is given.
  single_supplement_pct: Supplement charged to a traveller occupying a room or cabin alone, as a percentage of the per-person price.
  third_adult_discount_pct: Discount for a third adult sharing a room or cabin, as a percentage of the per-person price.
  child_age_limit: Age up to and including which a traveller is charged as a child.
  child_discount_pct: Discount for a child sharing with two adults, as a percentage of the per-person price.
  infant_age_limit: Age under which an infant travels at the infant price.
  infant_price_usd: Flat price for an infant on the lap, in USD.
  meals_included: Whether main meals are included in the package price.
  drinks_included: Whether standard drinks are included in the package price.
  tips_included: Whether resort or ship gratuities are included in the package price.
  gratuities_per_person_per_day_usd: Gratuities charged per traveller per day where they are not included, in USD.
  transfers_included: Whether airport or port transfers are included in the package price.
  transfer_fee_per_person_usd: Charge per traveller for a return transfer where it is not included, in USD.
  guide_included: Whether a tour manager or guide accompanies the party throughout.
  excursion_credit_usd: Excursion or resort credit granted per traveller at the start of the journey, in USD.
  excursion_credit_validity_days: Calendar days from departure within which the excursion credit must be spent.
  shore_excursion_discount_pct: Discount on excursions booked in advance, as a percentage.
  port_charges_per_person_usd: Port charges and government taxes charged per traveller on a sailing, in USD.
  visa_assistance_fee_usd: Charge for the operator's visa assistance service per traveller, in USD.
  room_upgrade_per_night_usd: Charge per night for a room upgrade within the package, in USD.
  cabin_grade_upgrade_usd: Charge for a cabin grade upgrade for the whole sailing, in USD.
  flight_upgrade_usd: Charge per traveller for a cabin upgrade on the package flight, in USD.
  upgrade_allowed: Whether components of the package may be upgraded after booking.
  component_change_fee_usd: Charge to substitute one component of the package for another, in USD.
  date_change_allowed: Whether the departure date may be moved after booking.
  date_change_fee_per_person_usd: Charge per traveller to move the departure date, in USD.
  max_date_changes: Maximum number of date changes permitted on one package.
  name_change_fee_per_person_usd: Charge per traveller to replace one member of the party, in USD.
  name_change_deadline_days: Calendar days before departure by which a name change must be made.
  amendment_admin_fee_per_person_usd: Administration charge per traveller applied to any other amendment, in USD.
  cancellation_ladder_pct: Cancellation penalty as a share of the package price by how far ahead of departure the cancellation lands; a ladder keyed by days before departure.
  cancellation_admin_fee_per_person_usd: Non-refundable administration charge per traveller on any cancellation, in USD.
  deposit_refundable: Whether the deposit itself is returned when the package is cancelled before the balance is due.
  refund_form: 'Form value is returned in on cancellation: none, future_travel_credit or original_payment.'
  refund_processing_days: Business days the settlement of an approved refund takes.
  credit_validity_months: Calendar months a future travel credit stays redeemable from its issue date.
  credit_transferable: Whether a future travel credit may be redeemed by another traveller.
  price_guarantee_days: Calendar days after booking within which the quoted price is guaranteed against increase.
  fuel_surcharge_allowed: Whether a fuel or currency surcharge may be added after booking.
  surcharge_threshold_pct: Percentage of the package price a surcharge must exceed before the party may cancel without penalty.
  min_days_notice_for_surcharge: Calendar days before departure by which a surcharge must be notified.
  supplier_failure_protection: Whether the package carries financial protection against supplier failure.
  insurance_required: Whether travel protection must be held for the package to be confirmed.
  insurance_bundled_discount_pct: Discount on a travel protection premium bought with the package, as a percentage.
  club_points_earn_rate_pct: Percentage of the package price that accrues as traveller club points.
  corporate_eligible: Whether the product may be booked under a corporate travel programme.
  currency_conversion_markup_pct: Percentage added when the party elects to be charged in a currency other than the operator's own.
