- id: bundle_components
  subject:
  - bundle_component_charge
  rule: 'The package price covers exactly what the product includes: meals, drinks, gratuities, transfers and a tour manager are included or charged separately entirely according to the product booked.
    A component is priced onto the ledger only while the package record stands at deposit held, confirmed or travelling. Gratuities are charged per traveller per day on a product that does not include them,
    and port charges are charged per traveller once for a sailing. An excursion or resort credit is granted per traveller at departure, must be spent within the product''s validity days counted from departure,
    and is forfeited unspent. Excursions booked in advance carry the product''s advance discount, and the same excursion bought on site does not. Upgrades are sold only on a product that allows them, at
    the product''s own amounts, and never convert the package to the upgraded product''s terms. Visa assistance is charged per traveller at the product''s amount and is never refunded once the application
    has been lodged.'
  eligibility:
  - id: package_live
    applies_to:
    - bundle_component_charge
    kind: state
    condition: A component is priced onto the ledger only while the package record stands at deposit held, confirmed or travelling.
    evidence_fields:
    - bundle_packages.status
    - bundle_packages.bundle_package_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - bundle_packages.bundle_package_id
      action_bindings:
        bundle_packages.bundle_package_id: bundle_package_id
    state_contract:
      field: bundle_packages.status
      allowed:
      - deposit_held
      - confirmed
      - travelling
  params:
    per_tier:
      Value Bundle Package:
