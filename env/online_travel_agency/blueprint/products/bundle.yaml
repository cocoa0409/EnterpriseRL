- id: bundle_payment_schedule
  subject:
  - bundle_deposit_charge
  - bundle_final_payment_charge
  - bundle_confirm
  rule: The balance falls due the product's final-payment distance before departure, and a package whose balance is unpaid on that date is cancelled on the product's own ladder rather than held. The balance
    is taken only when frozen time is not before the moment the operator took the party's deposit for this package plus the price-guarantee term of the product booked. The price-guarantee term is counted
    in whole calendar days from the day after the deposit was taken, weekends and public holidays included, and a balance taken exactly on the closing day is still inside the term. A product that allows
    instalments splits the balance into its own number of equal instalments falling due at equal intervals between the deposit and the final-payment date, and the last instalment is adjusted for rounding.
    A package booked closer to departure than the final-payment distance is paid in full at booking, and no deposit is taken separately. Where the party elects to be charged in a currency other than the
    operator's own, the product's conversion markup is added to each payment as it is taken. A missed instalment is pursued once before the package is cancelled, and a package cancelled for non-payment
    carries the same penalty as a cancellation by the party.
  eligibility:
  - id: price_guarantee_elapsed
    applies_to:
    - bundle_final_payment_charge
    kind: time
    condition: The balance is taken only when frozen time is not before the moment the operator took the party's deposit for this package plus the price-guarantee term of the product booked.
    evidence_fields:
    - bundle_packages.deposit_taken_at
    - bundle_packages.bundle_package_id
    - bundle_packages.final_payment_due_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - bundle_packages.bundle_package_id
      action_bindings:
        bundle_packages.bundle_package_id: bundle_package_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the operator took the party's deposit for this package
      anchor_source: bundle_packages.deposit_taken_at
      relation: not_before
      duration_source: variants.price_guarantee_days
      unit: calendar_days
      counting_rule: The price-guarantee term is counted in whole calendar days from the day after the deposit was taken, weekends and public holidays included, and a balance taken exactly on the closing
        day is still inside the term.
      boundary: inclusive
  params:
    per_tier:
      Value Bundle Package:
        final_payment_days_before_departure: =final_payment_days_before_departure
        payment_plan_available: =payment_plan_available
        payment_plan_instalments: =payment_plan_instalments
        price_guarantee_days: =price_guarantee_days
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Flex Bundle Package:
        final_payment_days_before_departure: =final_payment_days_before_departure
        payment_plan_available: =payment_plan_available
        payment_plan_instalments: =payment_plan_instalments
        price_guarantee_days: =price_guarantee_days
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      All-Inclusive Resort Package:
        final_payment_days_before_departure: =final_payment_days_before_departure
        payment_plan_available: =payment_plan_available
        payment_plan_instalments: =payment_plan_instalments
        price_guarantee_days: =price_guarantee_days
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Escorted Tour Package:
