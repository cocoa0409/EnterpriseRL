    party or the departure date is made only when the operations desk has already recorded an approved change request against this package. The departure date may be moved only on a product that allows
    it, within its ceiling on the number of moves, against its date-change charge per traveller, and the package is re-priced at the product's price for the new dates. Any other amendment carries the product's
    administration charge per traveller, and correcting the contact address or contact number is free and carries none. A product that allows no date change refuses the move outright rather than charging
    for it, and the party's only alternative is cancellation on the product's own ladder. An amendment requested after the balance has fallen due is priced as a cancellation and a rebooking, because the
    suppliers have already been paid. Substituting one component of the itinerary for another carries the product's component change charge and is available only where the supplier can make the substitution.
