- id: club_points_transfer
  subject:
  - club_points_redeem
  - club_points_bonus
  rule: 'Points leave one card and arrive on another only where the tier held permits transfers, in whole thousands, at or above the tier''s minimum and within the tier''s annual ceiling. A transfer out
    is recorded only when no transfer carrying the same partner reference has already been recorded on this membership. The transfer fee is charged per thousand points to the member sending them, and is
    never taken out of the points themselves. Transferred points arrive spendable, carry the receiving member''s expiry term counted from the day they arrive, and never count toward the receiving member''s
    qualification. A transfer is final: points that have arrived are not sent back, and a disputed transfer is settled by the programme office rather than reversed at the desk. A household pool is not a
    transfer: contributions to a pool stay in the contributing member''s name for qualification and are spendable by the pool''s nominated booker.'
  eligibility:
  - id: one_transfer_per_reference
    applies_to:
    - club_points_redeem
    kind: dedup
    condition: A transfer out is recorded only when no transfer carrying the same partner reference has already been recorded on this membership.
    evidence_fields:
    - club_points_entries.club_membership_id
    - club_points_entries.reason_code
    - club_points_entries.partner_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
