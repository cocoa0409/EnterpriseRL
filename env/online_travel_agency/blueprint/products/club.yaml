- id: club_portfolio_discounts
  subject:
  - club_points_accrual
  rule: 'Holding a club tier changes what the member pays elsewhere in the portfolio: the tier''s hotel, car rental, package and insurance discounts apply to the rates of those products, and the product''s
    own rules decide everything else. A club discount and a corporate programme rate are mutually exclusive: where a booking carries a corporate programme reference the corporate rate stands alone and the
    club discount is not applied on top. A club discount is applied to the room, vehicle, package or premium price before taxes and third-party fees, never after. Points accrue on the discounted price actually
    paid and not on the price before the discount. Where the member''s tier changes between booking and travel, the discount that was applied at booking stands and is neither topped up nor clawed back.
    No club discount is applied to a booking paid for entirely with points, because the price paid in money is nothing.'
  eligibility: []
  params:
    discount_basis: price before taxes and third-party fees
    per_tier:
      Wanderlane Blue:
        hotel_rate_discount_pct: =hotel_rate_discount_pct
