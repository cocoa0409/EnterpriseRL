- id: club_qualifying_clear_down
  subject:
  - club_qualifying_reset
  rule: At the close of a qualifying period the whole qualifying count is cleared down to nothing in one movement, and the next period begins on the day the reviewed tier takes effect. The clear-down never
    touches the spendable balance, and a member who has just been promoted starts the new period at zero rather than carrying a surplus forward. Where a review is still undecided when the period closes,
    the count is held rather than cleared, and the clear-down follows the decision. A membership in grace after a failed review keeps accruing into the new period, and the accruals stand whether or not
    the tier eventually drops. A correction to an earlier qualifying accrual is posted against the period it belonged to, not the period it is discovered in. A clear-down is never reversed; a count restored
    after an appeal is restored by a fresh qualifying accrual carrying the appeal's reference.
  eligibility: []
  params:
    per_tier:
      Wanderlane Blue:
        qualifying_period_months: =qualifying_period_months
        retention_grace_months: =retention_grace_months
      Wanderlane Silver:
        qualifying_period_months: =qualifying_period_months
        retention_grace_months: =retention_grace_months
      Wanderlane Gold:
        qualifying_period_months: =qualifying_period_months
        retention_grace_months: =retention_grace_months
      Wanderlane Platinum:
        qualifying_period_months: =qualifying_period_months
        retention_grace_months: =retention_grace_months
      Wanderlane Titanium:
        qualifying_period_months: =qualifying_period_months
        retention_grace_months: =retention_grace_months
