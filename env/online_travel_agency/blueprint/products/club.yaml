- id: club_redemption
  subject:
  - club_points_redeem
  rule: Points are redeemed against a travel booking at the redemption value of the tier held, and a redemption below the tier's minimum is refused rather than rounded up. Points are spent only while the
    membership record stands at active. A redemption is settled in points only; the balance of the price is collected in money and a booking is never held part-paid. An award booking may be changed against
    the tier's award change fee and cancelled against its award cancel fee, and on cancellation the points return to the card carrying their original expiry. Points on a suspended card may not be spent,
    and points on a closed card are forfeited without payment of any kind. A member who has made more than the annual ceiling of redemptions is referred to the programme office before any further redemption,
    because the pattern requires review.
