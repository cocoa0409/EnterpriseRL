- id: club_msr_qualifying_points_period
  window: the current qualifying period, running from the tier effective date for the tier's qualifying period length
  measure: sum of points_delta over club_qualifying_accrual and club_qualifying_reset rows on the same membership
- id: club_msr_redemptions_12m
  window: rolling 12 months ending on the handling date, counted back day by day from the frozen handling date
  measure: count of club_points_redeem rows on the same membership
- id: club_msr_benefit_uses_membership_year
  window: the membership year running from the tier effective date
  measure: count of club_benefit_use rows on the same membership, grouped by benefit_code
policies:
- id: club_agg_multi_holding
  subject:
  - club_enrol
  rule: 'One traveller holds exactly one club membership, and a second card is never opened in the same name. Where a traveller has somehow acquired two cards, the older card is kept, the balances of the
    younger card are merged into it, and the younger card is closed. A household points pool is not a second membership: it is a link between memberships, and each member keeps their own card, their own
    tier and their own qualifying count. A membership belongs to a person and never to a company; a company''s travel programme is a different product entirely.'
  eligibility: []
  params:
    max_per_customer: 1
    merge_keeps: oldest_membership
- id: club_tier_qualification
  subject:
  - club_qualifying_accrual
  - club_tier_change
  rule: 'A tier is earned by reaching its entry threshold of qualifying points inside one qualifying period, or by completing the tier''s alternative number of booked journeys in the same period, whichever
    comes first. A tier already held is kept for another period by reaching the lower retention threshold rather than the entry threshold. The qualifying period runs for the tier''s period length from the
    date the tier took effect, and the annual review falls in the programme''s review month. A tier is moved only when the programme office has already recorded an approved review against this membership.
    Where the review is failed, the tier drops at the end of the grace months of the tier held, and a tier with soft landing drops only one step however far short the member fell. A tier matched from another
    programme is held provisionally: the member must earn the challenge points inside the challenge days or the matched tier drops to the tier actually earned, and a tier that does not permit matching is
    never granted this way. Qualifying points are never bought, never transferred and never pooled; only the member''s own paid activity counts toward them.'
