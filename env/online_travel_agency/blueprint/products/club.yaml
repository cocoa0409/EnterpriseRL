  rule: 'Spendable points accrue at the earn rate of the tier held on the day the activity is booked, measured against the money actually paid for it, with taxes, third-party fees and agency service fees
    excluded from the measure. Points accrue only while the membership record stands at applied, active or suspended. The tier bonus is applied on top of the base accrual as a percentage of it, and is the
    only multiplier applied; two promotions never multiply one another, the larger of the two is taken. Activity with an earning partner accrues at the partner rate of the tier held, applied as a percentage
    of the platform rate, and a tier that does not permit partner earning accrues nothing from it. The milestone bonus is paid once in a qualifying period, at the moment the milestone threshold is passed,
    and is not paid again if the count later falls back. The birthday bonus is paid once a membership year and the referral bonus is paid on each enrolled referral up to the tier''s annual cap; a referral
    that never activates is not paid. Purchased points accrue nothing further: they arrive spendable, they do not earn the tier bonus, and they never count toward qualification.'
