        qualifying_period_months: =qualifying_period_months
        retention_grace_months: =retention_grace_months
- id: club_membership_lifecycle
  subject:
  - club_activate
  - club_suspend
  - club_reinstate
  - club_lapse
  - club_close
  rule: 'An enrolment becomes usable once the application is confirmed, and a card that is never confirmed carries no benefit and earns nothing. A card is suspended where the programme office is examining
    an abuse or fraud question, and while it is suspended the member may earn but may not spend. A suspended card is reinstated once the question is settled, with the tier and both balances exactly as they
    stood at suspension. A membership with no activity at all for the inactivity term of the tier held falls dormant, and falling dormant sweeps the spendable balance. Only the member may close their own
    card, and closure forfeits every point on it with no payment of any kind; the agency records the request and the member confirms it. A closed card is never reopened: a traveller who wishes to rejoin
    is enrolled afresh at the entry tier with nothing carried over.'
