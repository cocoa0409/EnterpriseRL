category: club
display_name: Wanderlane Traveller Club
binding:
  holding_table: club_memberships
  event_tables:
  - club_points_entries
  intake_tables:
  - club_tier_reviews
  status_field: status
  variant_field: variant_name
  quantity_fields:
    points_balance_pts: points
    qualifying_points_pts: qualifying_points
lifecycle:
  states:
  - applied
  - active
  - suspended
  - lapsed
  - closed
  transitions:
  - from: applied
    to: active
    by: system
    means: The enrolment is confirmed and the card becomes usable.
  - from: active
    to: suspended
    by: agent
    means: The card is put on hold while an abuse or fraud question is examined.
  - from: suspended
    to: active
    by: agent
    means: The question is settled and the hold on the card is lifted.
  - from: active
    to: lapsed
    by: system
    means: No activity at all was recorded for the inactivity term and the card falls dormant.
  - from: lapsed
    to: active
    by: agent
    means: A dormant card is brought back to life at the member's request.
  - from: active
    to: closed
    by: user
    means: The member closes their own card and gives up its balance.
  - from: lapsed
    to: closed
    by: system
    means: A dormant card is retired for good.
  - from: suspended
    to: closed
    by: agent
    means: The abuse question is decided against the member and the card is withdrawn.
accounts:
- key: points
  unit: club points
  meaning: 'Spendable club points on the member''s card: accruals, bonuses and arriving transfers credit the account, and redemptions, transfers out and expiry sweeps debit it.'
- key: qualifying_points
  unit: club points
  meaning: 'Tier-qualifying points counted in the current qualifying period: qualifying accruals credit the account and the end-of-period clear-down debits it.'
parameter_schema:
  enrolment_fee_usd: One-off fee to join at this tier directly rather than earn into it, in USD.
  annual_fee_usd: Annual fee charged to hold the tier, in USD.
  entry_qualifying_points: Tier-qualifying points needed in one qualifying period to enter the tier.
  retention_qualifying_points: Tier-qualifying points needed in one qualifying period to hold the tier again.
  qualifying_period_months: Length of the qualifying period in calendar months.
  qualifying_segment_alternative: Number of booked journeys that qualifies for the tier instead of the points route.
  points_earn_rate_per_usd: Spendable points earned per US dollar of qualifying spend.
  tier_bonus_pct: Percentage bonus added to base accruals for holding this tier.
  points_expiry_months: Calendar months after which unused spendable points lapse.
  points_expiry_extension_on_activity: Whether any qualifying activity resets the expiry clock on the whole balance.
  minimum_activity_months: Calendar months of complete inactivity after which the membership itself lapses.
  points_transfer_allowed: Whether points may be transferred to another member.
  points_transfer_min: Smallest transfer permitted, in points.
  points_transfer_max_per_year: Largest total that may be transferred out in one calendar year, in points.
  points_transfer_fee_per_1000_usd: Fee per one thousand points transferred, in USD.
  points_pooling_allowed: Whether the member may contribute to a household points pool.
  family_pool_max_members: Largest number of memberships one household pool may hold.
  redemption_min_points: Smallest redemption permitted, in points.
  redemption_value_cents_per_point: Value one point redeems at against a travel booking, in US cents.
  award_change_fee_usd: Fee to change an award booking already made with points, in USD.
  award_cancel_fee_usd: Fee to cancel an award booking and return the points, in USD.
  points_reinstatement_fee_usd: Fee to reinstate points that have already lapsed, in USD.
  points_reinstatement_window_days: Calendar days after lapse within which points may still be reinstated.
  points_purchase_allowed: Whether the member may buy points outright.
  points_purchase_price_per_1000_usd: Price of one thousand purchased points, in USD.
  points_purchase_cap_per_year: Largest number of points that may be bought in one calendar year.
  partner_earn_allowed: Whether activity with earning partners outside the platform accrues points.
  partner_earn_rate_pct: Percentage of the platform earn rate applied to partner activity.
  milestone_threshold_points: Qualifying points at which a milestone bonus is paid within a period.
  milestone_bonus_points: Spendable points paid when the milestone is reached.
  birthday_bonus_points: Spendable points paid once a year on the member's birthday.
  referral_bonus_points: Spendable points paid for each new member referred and enrolled.
  referral_cap_per_year: Largest number of referrals that may be paid in one calendar year.
  agency_service_fee_waiver: Whether the agency service fee is waived on bookings made while holding this tier.
  free_checked_bag_count: Checked bags carried free on air bookings made while holding this tier.
  priority_boarding_included: Whether priority boarding is granted by the tier.
  priority_checkin_included: Whether priority check-in is granted by the tier.
  lounge_pass_count_per_year: Single-visit lounge passes granted each membership year.
  lounge_guest_count: Guests admitted with the member on one lounge visit.
  companion_voucher_count_per_year: Companion vouchers granted each membership year.
  late_checkout_included: Whether guaranteed late checkout is granted on hotel stays.
  room_upgrade_priority_rank: Position in the room-upgrade queue, where 1 is served first and 0 means not queued.
  waived_change_fees_per_year: Number of change fees waived each membership year across the portfolio.
  hotel_rate_discount_pct: Percentage discount on qualifying hotel rate plans.
  car_rental_discount_pct: Percentage discount on qualifying car rental rate classes.
  package_discount_pct: Percentage discount on qualifying vacation packages.
  insurance_discount_pct: Percentage discount on travel protection premiums.
  dedicated_line_access: Whether the tier reaches a dedicated service line rather than the general queue.
  service_response_target_hours: Hours within which a written service request is answered.
  retention_grace_months: Calendar months of grace after a failed review before the tier actually drops.
  soft_landing_enabled: Whether a failed review drops the member only one tier rather than to the level actually earned.
  status_match_allowed: Whether a status held with another programme may be matched into this tier.
  status_challenge_days: Calendar days a matched member has to earn the tier outright.
  status_challenge_points: Qualifying points that must be earned inside the challenge to keep the matched tier.
  tier_review_month: Month of the year in which the annual tier review falls, as a number from 1 to 12.
