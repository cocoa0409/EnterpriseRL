- id: club_benefit_entitlements
  subject:
  - club_benefit_use
  rule: The named benefits a tier grants are counted per membership year running from the tier effective date, and an allowance not used inside that year does not carry into the next. A benefit is granted
    only while the membership record stands at active. Lounge passes admit the member plus the tier's guest allowance on one visit, and a visit beyond the allowance is bought at the lounge's own counter
    price rather than granted here. Free checked bags, priority boarding and priority check-in are granted by the tier at the moment of travel and are never converted into points or money when they go unused.
    A waived change fee is applied against the fee that would otherwise be charged, up to the tier's annual count, and the waiver is spent on the fee actually raised and not on the largest fee available.
    Guaranteed late checkout and the room-upgrade queue position apply only where the property participates, and a property that does not participate gives rise to no compensation. A companion voucher is
    issued in the member's own name and may not be sold, transferred or exchanged for value.
  eligibility:
  - id: membership_active_for_benefit
    applies_to:
    - club_benefit_use
    kind: state
    condition: A benefit is granted only while the membership record stands at active.
    evidence_fields:
    - club_memberships.status
    - club_memberships.club_membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - club_memberships.club_membership_id
      action_bindings:
        club_memberships.club_membership_id: club_membership_id
    state_contract:
      field: club_memberships.status
      allowed:
      - active
  params:
    per_tier:
      Wanderlane Blue:
        lounge_pass_count_per_year: =lounge_pass_count_per_year
        lounge_guest_count: =lounge_guest_count
        companion_voucher_count_per_year: =companion_voucher_count_per_year
