events:
- type: club_enrol
  target: club_memberships
  mutation: create
  meaning: A traveller joins the club and a membership card is opened in their name.
  grain: One row per membership opened for one traveller.
  fields:
    club_membership_id: reference of the new membership
    customer_id: traveller joining
    variant_name: tier the membership opens at
    status: the membership opens as an application
    membership_number: card number issued
    enrolled_date: date of enrolment
    home_market: market whose benefit schedule applies
    enrolment_channel: channel the member joined through
    household_pool_id: household pool the member joins, empty when none
  triggers: []
- type: club_activate
  target: club_memberships
  mutation:
    transition:
      from: applied
      to: active
  meaning: The enrolment is confirmed and the card becomes usable.
  grain: One row per membership, at the moment it is activated.
  fields:
    club_membership_id: membership being activated
    status: the membership becomes active
    tier_effective_date: date the opening tier took effect
    tier_review_date: date of the first annual review
    status_expiry_date: date the opening tier lapses without qualification
  triggers:
  - event: club:club_points_bonus
    map:
      club_membership_id: club_membership_id
      reason_code: promotion
      accrual_source: promotion
- type: club_tier_change
  target: club_memberships
  mutation: update
  meaning: The member's tier is moved up or down following a review of the qualifying record.
  grain: One row per membership, each time its tier is re-set.
  fields:
    club_membership_id: membership being re-tiered
    variant_name: tier now held
    tier_effective_date: date the new tier takes effect
    tier_review_date: date of the next review
    status_expiry_date: date the new tier lapses without qualification
  triggers:
  - event: club:club_qualifying_reset
    map:
      club_membership_id: club_membership_id
      reason_code: annual_reset
      points_kind: qualifying
- type: club_suspend
  target: club_memberships
  mutation:
    transition:
      from: active
      to: suspended
  meaning: The card is put on hold while an abuse or fraud question is settled.
  grain: One row per membership, at the moment it is suspended.
  fields:
    club_membership_id: membership being suspended
    status: the membership becomes suspended
  triggers: []
- type: club_reinstate
  target: club_memberships
  mutation:
    transition:
      from: suspended
      to: active
  meaning: The hold on the card is lifted and the membership runs again.
  grain: One row per membership, at the moment the hold is lifted.
  fields:
    club_membership_id: membership being reinstated
    status: the membership becomes active again
  triggers: []
- type: club_lapse
  target: club_memberships
  mutation:
    transition:
      from: active
      to: lapsed
  meaning: The membership falls dormant because no qualifying activity was recorded in time.
  grain: One row per membership, at the moment it lapses.
  fields:
    club_membership_id: membership lapsing
    status: the membership becomes lapsed
  triggers:
  - event: club:club_points_expiry
    map:
      club_membership_id: club_membership_id
      reason_code: expiry_sweep
      points_kind: spendable
- type: club_close
  target: club_memberships
  mutation:
    transition:
      from: active
      to: closed
  meaning: The member closes their own card and gives up whatever it still carries.
  grain: One row per membership, at the moment the member closes it.
  fields:
    club_membership_id: membership being closed
    status: the membership becomes closed
    closed_date: date the member closed it
  triggers: []
- type: club_points_accrual
  target: club_points_entries
  meaning: Spendable points accrue from a piece of the traveller's booked activity.
  grain: One row per earning activity on one membership, for one source document.
  distinguish_by:
  - accrual_source
  - partner_reference
  - posted_at
  fields:
    club_points_entry_id: reference of the ledger row
    club_membership_id: membership credited
    customer_id: member credited
    event_type: family of the row
    accrual_source: part of the traveller's activity that produced the points
    points_delta: positive points credited
    points_kind: the row moves the spendable balance
    amount_basis_usd: money the accrual was measured against
    posted_date: date the row posted
    posted_at: moment the row posted
    expires_on: date the credited points lapse
    partner_reference: reference the earning activity was reported under
    reason_code: business reason the row was raised
  account: points
  direction: in
  triggers:
  - event: club:club_qualifying_accrual
    map:
      club_membership_id: club_membership_id
      accrual_source: accrual_source
      points_kind: qualifying
      reason_code: routine_accrual
- type: club_points_bonus
  target: club_points_entries
  meaning: A bonus of spendable points is paid outside the ordinary earn rate.
  grain: One row per bonus paid on one membership for one named promotion or milestone.
  distinguish_by:
  - reason_code
  - partner_reference
  - posted_at
  fields:
    club_points_entry_id: reference of the ledger row
    club_membership_id: membership credited
    customer_id: member credited
    event_type: family of the row
    accrual_source: why the bonus arose
    points_delta: positive points credited
    points_kind: the row moves the spendable balance
    posted_date: date the row posted
    posted_at: moment the row posted
    expires_on: date the credited points lapse
    partner_reference: reference of the promotion the bonus was paid under
    reason_code: which bonus this is
  account: points
  direction: in
  triggers: []
- type: club_points_redeem
  target: club_points_entries
  meaning: Spendable points are taken off the card to pay for an award or a booking.
  grain: One row per redemption against one award or booking reference.
  distinguish_by:
  - redemption_reference
  - benefit_code
  - posted_at
  fields:
    club_points_entry_id: reference of the ledger row
    club_membership_id: membership debited
    customer_id: member debited
    event_type: family of the row
    points_delta: negative points taken off
    points_kind: the row moves the spendable balance
    amount_basis_usd: value the points were redeemed at
    posted_date: date the row posted
    posted_at: moment the row posted
    benefit_code: named award the points were spent on
    redemption_reference: booking or award reference the points were spent against
    reason_code: business reason for the redemption
  account: points
  direction: out
  triggers: []
- type: club_points_expiry
  target: club_points_entries
  meaning: Points that were never spent lapse and leave the card.
  grain: One row per sweep of one earlier accrual row on one membership.
  distinguish_by:
  - source_entry_id
  - posted_at
  fields:
    club_points_entry_id: reference of the ledger row
    club_membership_id: membership debited
    customer_id: member debited
    event_type: family of the row
    points_delta: negative points swept away
    points_kind: the row moves the spendable balance
    posted_date: date the sweep posted
    posted_at: moment the sweep posted
    source_entry_id: the accrual row whose points lapsed
    reason_code: business reason for the sweep
  account: points
  direction: out
  triggers: []
- type: club_qualifying_accrual
  target: club_points_entries
  meaning: Tier-qualifying points are counted from a piece of the traveller's booked activity.
  grain: One row per earning activity counted toward the current qualifying period.
  distinguish_by:
  - accrual_source
  - partner_reference
  - posted_at
  fields:
    club_points_entry_id: reference of the ledger row
    club_membership_id: membership credited
    customer_id: member credited
    event_type: family of the row
    accrual_source: part of the traveller's activity that produced the qualifying points
    points_delta: positive qualifying points counted
    points_kind: the row moves the qualifying balance
    amount_basis_usd: money the qualifying accrual was measured against
    posted_date: date the row posted
    posted_at: moment the row posted
    partner_reference: reference the qualifying activity was reported under
    reason_code: business reason the row was raised
  account: qualifying_points
  direction: in
  triggers: []
- type: club_qualifying_reset
  target: club_points_entries
  meaning: The qualifying count is cleared down when a qualifying period ends.
  grain: One row per membership per qualifying period that closes.
  distinguish_by:
  - reason_code
