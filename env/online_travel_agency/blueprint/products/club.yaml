- id: club_points_expiry_rule
  subject:
  - club_points_expiry
  rule: 'Spendable points lapse at the end of the expiry term of the tier held when they were earned, counted from the date they posted, and lapse row by row so that the oldest points always leave first.
    On a tier whose expiry extends with activity, any qualifying activity resets the clock on the whole balance rather than on the individual accrual. Lapsed points are reinstated only when frozen time
    is not after the moment the expiry sweep removed the points from the member''s card plus the reinstatement window of the tier held. The reinstatement window is counted in whole calendar days from the
    day of the sweep, weekends and public holidays included, and a request made exactly on the closing day is still in time. Reinstatement carries the reinstatement fee of the tier held at the time of the
    request, and a tier whose fee is zero reinstates free of charge. A membership that lapses for inactivity sweeps its whole spendable balance in one movement, and those points are reinstated only if the
    membership itself is reinstated first. Qualifying points never lapse: they are cleared down when the period ends and are never swept for age.'
  eligibility:
  - id: inside_reinstatement_window
    applies_to:
    - club_points_expiry
    kind: time
    condition: Lapsed points are reinstated only when frozen time is not after the moment the expiry sweep removed the points from the member's card plus the reinstatement window of the tier held.
    evidence_fields:
    - club_points_entries.posted_at
    - club_points_entries.club_points_entry_id
    - club_points_entries.source_entry_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - club_points_entries.club_points_entry_id
      action_bindings:
        club_points_entries.club_points_entry_id: club_points_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the expiry sweep removed the points from the member's card
      anchor_source: club_points_entries.posted_at
      relation: not_after
      duration_source: variants.points_reinstatement_window_days
      unit: calendar_days
      counting_rule: The reinstatement window is counted in whole calendar days from the day of the sweep, weekends and public holidays included, and a request made exactly on the closing day is still in
        time.
      boundary: inclusive
  params:
    sweep_order: oldest_accrual_first
    per_tier:
      Wanderlane Blue:
        points_expiry_months: =points_expiry_months
        points_expiry_extension_on_activity: =points_expiry_extension_on_activity
        points_reinstatement_fee_usd: =points_reinstatement_fee_usd
        points_reinstatement_window_days: =points_reinstatement_window_days
        minimum_activity_months: =minimum_activity_months
      Wanderlane Silver:
        points_expiry_months: =points_expiry_months
        points_expiry_extension_on_activity: =points_expiry_extension_on_activity
        points_reinstatement_fee_usd: =points_reinstatement_fee_usd
        points_reinstatement_window_days: =points_reinstatement_window_days
        minimum_activity_months: =minimum_activity_months
      Wanderlane Gold:
        points_expiry_months: =points_expiry_months
        points_expiry_extension_on_activity: =points_expiry_extension_on_activity
        points_reinstatement_fee_usd: =points_reinstatement_fee_usd
        points_reinstatement_window_days: =points_reinstatement_window_days
        minimum_activity_months: =minimum_activity_months
      Wanderlane Platinum:
