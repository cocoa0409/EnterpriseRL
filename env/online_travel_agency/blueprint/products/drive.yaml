- id: drive_msr_damage_claims_24m
  window: rolling 24 months ending on the handling date, counted back day by day from the frozen handling date
  measure: count of drive_damage_charge rows whose charge_category is damage_charge across the renter's rentals
policies:
- id: drive_agg_multi_holding
  subject:
  - drive_book
  rule: 'A renter may hold any number of car rentals at the same time, including overlapping rentals in different cities, and each rental carries its own rate class and its own ledger. Two rentals with
    the same supplier, the same collection branch and overlapping times are referred for duplicate review before collection, because a supplier holds one vehicle against one driver. Nothing is aggregated
    between rentals: included mileage, protection products and free additional drivers belong to the rental that carries them and are never moved. A driver named on two rentals at once is still one driver,
    and the young or senior driver fee is charged on each rental separately.'
  eligibility: []
  params:
    max_per_customer: null
    duplicate_review_supplier_match: true
- id: drive_agg_rental_history
  subject:
  - drive_rate_charge
  rule: 'The renter''s own history across rentals decides two things and nothing else: whether a discretionary waiver is within the desk''s authority, and whether the supplier network requires a manual
    review before the vehicle is released. A renter with more damage recharges in the last twenty-four months than the review threshold is referred to the rental desk before any discretionary concession
    is given. Rental days across rentals are counted only to establish a frequent renter''s standing; they never change the rate class terms of any single rental. Where two rentals overlap, each is priced,
    taxed and settled entirely on its own rate class, and a protection product bought on one never extends to the other. Club discounts and corporate rates are likewise applied rental by rental.'
  eligibility: []
  params:
    damage_review_threshold_24m: 2
  measures:
  - drive_msr_rental_days_12m
  - drive_msr_damage_claims_24m
- id: drive_booking_terms
  subject:
  - drive_book
  - drive_confirm
  rule: A rate class may only be sold where the rental length falls between its minimum and maximum days and where the main driver's age falls within its accepted range. A driver below the rate class's
    young driver age is accepted only against the class's young driver fee for every rental day, and a driver aged seventy or over against its senior driver fee; a driver outside the accepted age range
    is refused outright. A rental returned to a branch other than the collection branch carries the class's one-way fee, and a vehicle taken across an international border is permitted only on a class that
    allows it and against that class's cross-border fee. Collection at an airport branch adds the class's airport surcharge to the rental total, and the vehicle licensing recovery fee is charged for every
    rental day whatever the branch. The agency service fee is charged once per rental when the supplier confirms, and is never charged twice because the booking was modified. A rental booked but never confirmed
    by the supplier binds nobody and is released without charge.
