- id: drive_evt_supplier_notice
  subject:
  - drive_supplier_notice
  rule: Where the supplier advises that the booked vehicle class is not available, the renter is given the nearest available class at no additional charge, and a class above the one booked never carries
    an upcharge. Where no vehicle at all is available the rental is cancelled free of charge on every rate class and any prepayment is returned in full. A renter who declines a substitute vehicle is treated
    as cancelling free of charge and not as a no-show. The included mileage, the protection products and the fuel arrangement follow the rate class booked and not the substitute vehicle actually provided.
    Several notices about the same rental are not added together; the last notice standing before collection decides what is owed. A notice withdrawn by the supplier before collection gives rise to no concession
    at all.
  eligibility: []
  params:
    substitution_basis: nearest available class at or above the class booked
- id: drive_club_and_corporate_interaction
  subject:
  - drive_rate_charge
  - drive_extras_charge
  rule: 'Holding an active traveller club membership changes what this rental is charged: the club tier held on the collection date decides the discount applied to the rental rate and whether a vehicle
    class upgrade is offered, and the rate class''s own terms decide everything else. A club discount and a corporate programme rate are mutually exclusive on one rental: where the rental carries a corporate
    programme reference the negotiated rate stands alone and no club discount is applied on top of it. A rate class that is not eligible for a corporate rate may still be booked under a programme, but at
    its public price. A club upgrade is offered only on a rate class that permits it and only where the supplier has the higher class available; it is never converted into money or into a discount. Club
    points accrue on the rental total actually paid, at the earn rate of the rate class booked, and never on taxes, statutory fees, the deposit hold or the agency service fee. A corporate negotiated rate
    class earns no club points at all, whatever the renter''s personal tier.'
  eligibility: []
  params:
    discount_basis: club tier held on the collection date
    per_tier:
      Pay Now Saver Rate:
        club_points_earn_rate_pct: =club_points_earn_rate_pct
        loyalty_upgrade_eligible: =loyalty_upgrade_eligible
        corporate_rate_eligible: =corporate_rate_eligible
