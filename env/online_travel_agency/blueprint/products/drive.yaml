- id: drive_refund_settlement
  subject:
  - drive_refund_payout
  rule: An approved refund settles to the original form of payment and in no other form, because a car rental carries no credit of its own. A payout line is raised only while the rental record stands at
    cancelled, no show or returned. The settlement takes the rate class's processing time, counted in business days from the day the refund was approved, excluding weekends and public holidays in the renter's
    country of residence. Each payout is raised against the original ledger line it reverses, so a rental with several lines settles as several payouts and never as one lump sum. A payout may never exceed
    the amount that original line actually collected, and the sum of a rental's payouts may never exceed its ledger total. Where the supplier declines the refund the rental is closed with no payout and
    the renter is told which supplier reference declined it.
  eligibility:
  - id: rental_settled
    applies_to:
    - drive_refund_payout
    kind: state
    condition: A payout line is raised only while the rental record stands at cancelled, no show or returned.
    evidence_fields:
    - drive_rentals.status
    - drive_rentals.drive_rental_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - drive_rentals.drive_rental_id
      action_bindings:
        drive_rentals.drive_rental_id: drive_rental_id
    state_contract:
      field: drive_rentals.status
      allowed:
      - cancelled
      - no_show
      - returned
  params:
    per_tier:
      Pay Now Saver Rate:
        refund_processing_days: =refund_processing_days
      Pay Now Standard Rate:
        refund_processing_days: =refund_processing_days
      Pay At Counter Flex Rate:
        refund_processing_days: =refund_processing_days
      Inclusive Flex Rate:
        refund_processing_days: =refund_processing_days
      Premium Inclusive Rate:
        refund_processing_days: =refund_processing_days
      Corporate Negotiated Drive Rate:
        refund_processing_days: =refund_processing_days
- id: drive_modification
  subject:
  - drive_driver_amend
  rule: 'Collection and return times and branches may be changed within the rate class''s ceiling on modifications, and the rental is re-priced at the class''s rate for the new period. A change carries
    the class''s modification fee, and the difference in rate is collected or returned in addition to it. The main driver may be replaced without charge on every class, provided the replacement meets the
    class''s age range; a replacement outside the range is refused. Adding or removing an additional driver is not a modification and carries only the per-day driver fee for the days the driver is named.
    Correcting the contact address or contact number is free on every class and never counts toward the modification ceiling. A change requested after the scheduled collection time has passed is not a modification:
    the renter collects as booked or is recorded as a no-show.'
  eligibility: []
  params:
    per_tier:
      Pay Now Saver Rate:
        modification_fee_usd: =modification_fee_usd
        max_modifications: =max_modifications
        min_driver_age: =min_driver_age
        max_driver_age: =max_driver_age
      Pay Now Standard Rate:
        modification_fee_usd: =modification_fee_usd
        max_modifications: =max_modifications
        min_driver_age: =min_driver_age
        max_driver_age: =max_driver_age
