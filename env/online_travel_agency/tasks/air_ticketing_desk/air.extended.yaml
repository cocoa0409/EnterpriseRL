category: air
display_name: Air Ticket Fare Brands
binding:
  holding_table: air_bookings
  event_tables:
  - air_booking_events
  intake_tables:
  - air_service_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    amount_paid_usd: fare_paid
    credit_balance_usd: travel_credit
lifecycle:
  states:
  - held
  - ticketed
  - travelled
  - cancelled
  - refund_pending
  - refunded
  - closed
  transitions:
  - from: held
    to: ticketed
    by: system
    means: Payment for the held itinerary is captured and the airline issues the ticket.
  - from: held
    to: cancelled
    by: agent
    means: An unticketed hold is released before any money changes hands.
  - from: ticketed
    to: travelled
    by: system
    means: The last booked segment is recorded as flown.
  - from: ticketed
    to: cancelled
    by: user
    means: The traveller confirms cancellation of their own ticketed itinerary.
  - from: cancelled
    to: refund_pending
    by: agent
    means: The refund or credit claim for the cancelled booking is lodged with the airline.
  - from: refund_pending
    to: refunded
    by: system
    means: The airline settles the claim and the money or the voucher reaches the traveller.
  - from: travelled
    to: closed
    by: system
    means: The journey is complete and the booking is archived.
  - from: refunded
    to: closed
    by: system
    means: The settled claim is archived and the booking is closed.
  - from: cancelled
    to: closed
    by: system
    means: A cancelled booking whose fare brand returns nothing is closed with no money moved.
accounts:
- key: fare_paid
  unit: USD
  meaning: 'Net money the traveller has put into this booking: fares, taxes, carrier fees, agency service
    fees, optional extras, change fees and penalties credit the account, and payouts to the original form
    of payment debit it.'
- key: travel_credit
  unit: USD
  meaning: 'Value held on travel credit vouchers produced by this booking: an issued voucher credits the
    account and a redemption debits it.'
parameter_schema:
  agency_service_fee_usd: Agency booking service fee charged per traveller when the ticket is issued,
    in USD.
  hold_window_hours: Hours an unticketed hold may stand before it is released, in whole hours.
  void_window_hours: Hours after ticket issue in which the ticket may be voided at no cost, in whole hours.
  free_change_window_hours: Hours after ticket issue in which an itinerary change carries no change fee,
    in whole hours.
  advance_purchase_days: Minimum calendar days between booking and departure for this fare brand to be
    sold.
  min_stay_nights: Minimum number of nights that must fall between outbound and return.
  max_stay_days: Maximum calendar days the return may fall after the outbound departure.
  ticket_validity_months: Calendar months a ticket stays valid for travel from the date of issue.
  refundable: Whether an unflown ticket can be refunded at all (true) or only forfeited (false).
  refund_form: 'Form value is returned in on cancellation: none, travel_credit or original_payment.'
  refund_processing_days: Business days the settlement of an approved refund takes.
  cancel_penalty_usd: Flat cancellation penalty withheld from the value returned, in USD.
  cancel_penalty_ladder_usd: Cancellation penalty by how far ahead of departure the cancellation is confirmed;
    a ladder keyed by days before departure, in USD.
  no_show_penalty_usd: Penalty charged when the traveller neither flies nor cancels before departure,
    in USD.
  change_fee_usd: Change fee charged per traveller for a voluntary itinerary change, in USD.
  same_day_change_fee_usd: Change fee for a same-day move between flights on the booked routing, in USD.
  max_changes_per_ticket: Maximum number of voluntary changes permitted on one ticket.
  routing_change_allowed: Whether the origin or destination may be changed after ticketing.
  date_change_allowed: Whether travel dates may be changed after ticketing.
  fare_difference_collected: Whether the difference to the new fare is collected on a change.
  residual_value_handling: 'What happens to the unused fare value when the new fare is cheaper: forfeited,
    travel_credit or refund.'
  credit_validity_months: Calendar months a travel credit stays redeemable from its issue date.
  credit_reissue_fee_usd: Fee to reissue a lapsed travel credit onto a new voucher, in USD.
  credit_transferable: Whether a travel credit may be redeemed by someone other than the named traveller.
  name_correction_fee_usd: Fee to correct a misspelled traveller name on an issued ticket, in USD.
  name_correction_char_limit: Maximum number of characters that may be corrected in a name before a new
    ticket is required.
  standby_fee_usd: Fee to be listed for standby on an earlier flight, in USD.
  upgrade_eligible: Whether the fare brand may be upgraded into a higher cabin after ticketing.
  upgrade_copay_usd: Co-payment collected per traveller per segment on an accepted upgrade, in USD.
  checked_bag_allowance_count: Number of checked bags included in the fare per traveller.
  first_bag_fee_usd: Fee for the first checked bag when it is not included, in USD.
  second_bag_fee_usd: Fee for the second checked bag when it is not included, in USD.
  overweight_bag_fee_usd: Fee per checked bag above the weight allowance, in USD.
  oversize_bag_fee_usd: Fee per checked bag above the size allowance, in USD.
  carry_on_included: Whether a full-size cabin bag is included in the fare.
  seat_selection_included: Whether a standard seat may be chosen at no charge before check-in.
  standard_seat_fee_usd: Fee per traveller per segment for a standard advance seat, in USD.
  extra_legroom_seat_fee_usd: Fee per traveller per segment for an extra-legroom seat, in USD.
  priority_boarding_included: Whether priority boarding is included in the fare.
  priority_boarding_fee_usd: Fee per traveller per segment for priority boarding when it is not included,
    in USD.
  lounge_access_included: Whether departure lounge access is included in the fare.
  meal_included: Whether a hot meal service is included on qualifying segments.
  wifi_voucher_included: Whether an onboard wifi voucher is included per segment.
  pet_in_cabin_fee_usd: Fee per pet carried in the cabin, in USD.
  infant_fee_pct_of_fare: Percentage of the adult base fare charged for an infant travelling on the lap.
  child_discount_pct: Percentage discount off the adult base fare for a child aged 2 to 11.
  unaccompanied_minor_fee_usd: Fee per unaccompanied minor per direction, in USD.
  special_assistance_lead_time_hours: Hours before departure by which special assistance must be registered.
  club_points_earn_rate_pct: Percentage of the base fare that accrues as traveller club points.
  tier_qualifying_points_multiplier: Multiplier applied to base-fare spend when counting tier-qualifying
    points.
  schedule_change_threshold_minutes: Size of an airline schedule move, in minutes, from which the traveller
    acquires a free change or refund right.
  disruption_rebook_fee_usd: Fee to rebook after an airline disruption when the move is below the threshold,
    in USD.
  disruption_hotel_allowance_usd: Overnight hotel allowance reimbursed per traveller per night after a
    qualifying disruption, in USD.
  price_match_window_hours: Hours after ticket issue within which a lower public price may be claimed,
    in whole hours.
  price_drop_refund_allowed: Whether a price-drop claim is settled in cash rather than refused.
  price_drop_refund_cap_usd: Ceiling on a single price-drop settlement per booking, in USD.
  payment_plan_available: Whether the fare may be paid in instalments rather than in full at ticketing.
  payment_plan_min_amount_usd: Minimum booking value that qualifies for an instalment plan, in USD.
  currency_conversion_markup_pct: Percentage added when the traveller elects to be charged in a currency
    other than the ticketing currency.
  group_booking_min_pax: Number of travellers on one booking from which group terms replace these terms.
  corporate_discount_eligible: Whether a corporate travel programme discount may be applied to this fare
    brand.
  seat_map_release_hours_before_departure: Hours before departure at which the remaining seat map is released
    for free selection.
  cancellation_deadline_hours_before_departure: Hours before departure by which a cancellation must be
    confirmed for the fare's refund terms to apply.
