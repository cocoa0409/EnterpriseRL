- id: air_cancel_refund
  subject:
  - air_cancel_confirm
  - air_refund_open
  rule: 'Only the traveller may cancel their own ticket, and the cancellation is confirmed by the traveller
    rather than performed on their behalf. The traveller states in this conversation that they are cancelling
    the whole itinerary and not a single traveller on it. A cancellation is handled under the risk-free
    void terms only when frozen time is not after the moment the traveller''s ticket was issued for this
    booking plus the void window of the fare brand held. The void window is counted in whole elapsed hours
    from the ticket issue moment, never mixing elapsed hours with calendar days, and a cancellation confirmed
    exactly at the boundary is still inside the window. Inside the void window every cancellation returns
    the whole amount paid to the original form of payment, whatever the fare brand held and whatever the
    brand''s refund form, and no penalty is withheld. Outside the void window the fare brand decides everything:
    a brand that is not refundable returns nothing, a brand whose refund form is a travel credit returns
    the value on a voucher, and a brand whose refund form is the original form of payment returns money
    to the card. The penalty withheld is read off the brand''s cancellation ladder by how many whole days
    lie between the cancellation and the outbound departure, and the ladder''s flat penalty applies only
    where the ladder is silent. A cancellation confirmed later than the brand''s cancellation deadline
    before departure is treated as a no-show, and the no-show penalty replaces the cancellation penalty.
    A refund claim is lodged only when the back office has already recorded an approved refund review
    against this booking. Taxes and carrier fees that the airline itself refunds are returned even on
    a non-refundable brand, and the agency service fee is not.'
  eligibility:
  - id: whole_itinerary_cancelled
    applies_to:
    - air_cancel_confirm
    kind: caller_fact
    condition: The traveller states in this conversation that they are cancelling the whole itinerary
      and not a single traveller on it.
    evidence_fields:
    - air_bookings.passenger_count
    - air_bookings.air_booking_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - air_bookings.air_booking_id
      action_bindings:
        air_bookings.air_booking_id: air_booking_id
  - id: inside_void_window
    applies_to:
    - air_cancel_confirm
    kind: time
    condition: A cancellation is handled under the risk-free void terms only when frozen time is not after
      the moment the traveller's ticket was issued for this booking plus the void window of the fare brand
      held.
    evidence_fields:
    - air_bookings.ticketed_at
    - air_bookings.air_booking_id
    - air_bookings.departure_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - air_bookings.air_booking_id
      action_bindings:
        air_bookings.air_booking_id: air_booking_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the traveller's ticket was issued for this booking
      anchor_source: air_bookings.ticketed_at
      relation: not_after
      duration_source: variants.void_window_hours
      unit: elapsed_hours
      counting_rule: The void window is counted in whole elapsed hours from the ticket issue moment, never
        mixing elapsed hours with calendar days, and a cancellation confirmed exactly at the boundary
        is still inside the window.
      boundary: inclusive
  - id: refund_review_approved
    applies_to:
    - air_refund_open
    kind: authorization
    condition: A refund claim is lodged only when the back office has already recorded an approved refund
      review against this booking.
    evidence_fields:
    - air_service_requests.request_status
    - air_service_requests.air_request_id
    - air_service_requests.air_booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - air_service_requests.air_request_id
      action_bindings:
        air_service_requests.air_request_id: air_request_id
  params:
    per_tier:
      Basic Economy Lite:
        refundable: =refundable
