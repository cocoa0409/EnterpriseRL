  rule: A travel credit is issued for the value the cancelled ticket still carried after any penalty has
    been withheld, and carries an expiry set by the credit validity term of the fare brand that produced
    it. A voucher is issued only while the booking record stands at cancelled, refund pending or refunded.
    The voucher is issued in the name of the traveller the ticket was issued to, and is transferable only
    where the producing brand makes credits transferable. A voucher that has lapsed may be reissued once
    onto a fresh voucher against the brand's reissue fee, and the fresh voucher carries the same validity
    term counted from the day of reissue. A brand whose credit validity term is zero issues no voucher
    at all, and its cancelled value is forfeited. The value on a voucher is never paid out in money, not
    even where the traveller no longer intends to travel.
