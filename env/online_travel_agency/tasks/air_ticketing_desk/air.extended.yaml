    - change_line_count
    - tax_basis
    ladder:
    - when: the booking carries more tax lines than travellers ticketed and at least one voluntary change
        line was posted to it in the last twelve months
      method: the taxes are taken from the largest single tax line standing on the booking, multiplied
        by the travellers ticketed
    - when: the booking carries as many tax lines as travellers ticketed and at least one voluntary change
        line was posted to it in the last twelve months
      method: the taxes are taken as the sum of every tax line standing on the booking
    - when: otherwise
      method: the taxes are taken from the most recent tax line standing on the booking, multiplied by
        the travellers ticketed
    baseline:
      tax_basis: (tax_latest * travellers_ticketed)
    evidence:
    - history
    cross_difficulty: null
  - id: open_claim_share
    effect: parameter
    decides: open_share
    bindings:
    - cancel_days
    - open_share
    ladder:
    - when: the booking stands cancelled and its cancellation was confirmed within the last ninety days
      value: K('full_share')
    - when: the booking stands cancelled and its cancellation was confirmed more than ninety days ago
      value: K('aged_share')
    - when: otherwise
      value: K('open_share')
    baseline:
      open_share: K('open_share')
    evidence:
    - date
    cross_difficulty: null
  - id: unflown_direction_scope
    effect: parameter
    decides: direction_share
    bindings:
    - days_since_departure
    - direction_share
    ladder:
    - when: a return date stands on the booking and the outbound departure date has already passed
      value: K('unflown_direction_share')
    - when: a return date stands on the booking and the outbound departure date has not yet passed
      value: K('whole_trip_share')
    - when: otherwise
      value: K('whole_trip_share')
    baseline:
      direction_share: K('whole_trip_share')
    evidence:
    - date
    cross_difficulty: null
  - id: protection_recovery_share
    effect: parameter
    decides: cover_share
    bindings:
    - cover_benefit_used
    - cover_claims_paid
    - cover_share
    ladder:
    - when: protection cover bought against this booking is on file and it has settled the heavy-recovery
        threshold or more in claims over the last twelve months
      value: K('heavily_insured_share')
    - when: protection cover bought against this booking is on file and it has settled less than that
        threshold in claims over that period
      value: K('insured_share')
    - when: otherwise
      value: K('uninsured_share')
    baseline:
      cover_share: K('uninsured_share')
    evidence:
    - cross_category
    - history
    cross_difficulty: care
  - id: member_handling_charge
    effect: parameter
    decides: handling_charge
    bindings:
    - member_fee_waiver
    - member_accruals
    - handling_charge
    ladder:
    - when: the traveller's club tier waives the agency service fee and the membership has posted three
        or more qualifying accruals over the last twelve months
      value: K('handling_waived')
    - when: the traveller's club tier does not waive the agency service fee and the membership has posted
        three or more qualifying accruals over the last twelve months
      value: K('handling_member')
    - when: otherwise
      value: K('handling_standard')
    baseline:
      handling_charge: K('handling_standard')
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  baseline:
    rule: Where a ticket has fallen away unflown, the carrier-imposed taxes and fees the airline itself
      returns are paid back to the form of payment the traveller used, while the agency service fee is
      never paid back under this rule because the service it paid for has already been performed. A return
      of the carrier-imposed taxes on an unflown ticket is raised as a single line covering the whole
      booking, so that one movement settles every tax line the booking carries. That return of taxes to
      the form of payment used stands alongside whatever the fare brand returns on its own terms, whether
      money or value on a voucher, because the taxes are the airline's to give back and the brand's terms
      reach only the fare. The taxes in question are taken from the most recent tax line standing on the
      booking, multiplied by the travellers ticketed. The open share of that figure is returned. The whole
      of the trip's taxes are in scope. Nothing is set against what a traveller's own protection cover
      has already met. The taxes in question, the share returned, the share in scope and the insured share
      are multiplied together in that order, and the handling charge is taken off the product of those
      four and never off any earlier step. The standard handling charge is kept from the sum returned.
      The sum returned never falls below zero, and the result is rounded to the nearest cent.
    params:
    - open_share
    - whole_trip_share
    - uninsured_share
    - handling_standard
  inputs:
    history:
    - table: air_booking_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: air_fare_charge
        charge_category: taxes_and_carrier_fees
    - table: air_booking_events
      aggregate: count
      field: air_event_id
      within_months: 12
      filters:
        event_type: air_change_fee_charge
        reason_code: voluntary_change
    - category: care
      table: care_claims
      aggregate: sum
      field: paid_amount_usd
      within_months: 12
      filters:
        claim_status: paid
    - category: club
      table: club_points_entries
      aggregate: count
      field: club_points_entry_id
      within_months: 12
      filters:
        points_kind: qualifying
    cross_category:
    - care
    - club
- id: air_ext_cancelled_ticket_credit
  base_policy_refs:
  - air_credit_validity
  - air_club_benefit_interaction
  overwrite:
  - base_policy: air_credit_validity
    superseded_clause: A travel credit is issued for the value the cancelled ticket still carried after
      any penalty has been withheld, and carries an expiry set by the credit validity term of the fare
      brand that produced it.
    replaced_by: The residual value, less what is taken off for the service lines and plus what is carried
      for the optional extras, makes the subtotal; the promptness share acts on that subtotal, the brand's
      credit share acts on the result of that step, and the membership uplift acts on the result of that
      second step, so that the three never act together on the residual value.
  - base_policy: air_club_benefit_interaction
    superseded_clause: 'A club benefit and a fare-brand inclusion never stack into a payment to the traveller:
      a bag already included in the brand is simply free, and the club benefit is not converted into value.'
    replaced_by: Where the traveller's club tier earns five points or more per dollar and the membership
      has counted sixty thousand qualifying points or more over the last twelve months, the high membership
      uplift is added instead
  trigger: state_due
  subject:
  - air_credit_issue
  computes: voucher_value_usd
  target_tool: issue_travel_credit_599fe29f
  params:
    service_carry_none: 0.0
    service_carry_half: 0.5
    service_carry_full: 1.0
    long_credit_months: 18
    extras_carry_none: 0.0
    extras_lead_days: 7
    lead_whole_share: 1.0
    lead_late_share: 0.97
    lead_unnotified_share: 0.94
    mid_brand_months: 12
    long_brand_months: 24
    share_long_credit: 1.0
    share_mid_credit: 0.95
    share_short_credit: 0.9
    uplift_high_pct: 5.0
    uplift_standard_pct: 3.0
    uplift_none_pct: 0.0
    high_earn_rate: 5
    mid_earn_rate: 4
    high_points: 60000
    mid_points: 30000
  rule: A travel credit voucher is raised for the value a cancelled ticket still carries, in the name
    of the traveller the ticket was issued to, and it carries an expiry set by the credit validity term
    of the fare brand that produced it. The value placed on a travel credit voucher is settled only after
    the booking's ledger carries the penalty entry owed for every traveller recorded as not having flown,
    and that entry is taken off the fare, tax and service lines standing on the booking. Before that value
    is worked out the booking's ledger must already carry the payout entry owed for the carrier-imposed
    taxes on an unflown ticket, and whatever that entry has returned to the form of payment used is taken
    off as well. What is left after those two movements is the residual value of the ticket. The agency
    service lines standing on the booking are then taken off the residual value in full. Where the booking's
    service lines stand for as many travellers as are ticketed and the brand's credit runs eighteen months
    or more, none of the service lines is taken off instead, and where the booking's service lines stand
    for as many travellers as are ticketed and the brand's credit runs fewer than eighteen months, half
    of them is taken off instead. No optional extra already bought is carried onto the voucher. Where
    the latest optional-extra line was posted more than seven days ahead of the outbound departure and
    the fare brand includes at least one checked bag, the optional extras are carried instead as the sum
    of every optional-extra line standing on the booking, and where the latest optional-extra line was
    posted more than seven days ahead of the outbound departure and the fare brand includes no checked
    bag, they are carried instead as the largest single optional-extra line, multiplied by the travellers
    ticketed. The residual value, less what is taken off for the service lines and plus what is carried
    for the optional extras, makes the subtotal; the promptness share acts on that subtotal, the brand's
    credit share acts on the result of that step, and the membership uplift acts on the result of that
    second step, so that the three never act together on the residual value. The unnotified promptness
    share of the subtotal is carried forward. Where the cancellation was confirmed on or before the outbound
    departure date and the brand's credit runs twelve months or more, the whole of the subtotal is carried
    forward instead, and where the cancellation was confirmed after the outbound departure date and the
    brand's credit runs twelve months or more, the late promptness share of it is carried forward instead.
    The short-credit share of that figure is placed on the voucher. Where the brand's credit runs twenty-four
    months or more and no voucher already stands on the booking, the whole of it is placed on the voucher
    instead, and where the brand's credit runs twelve months or more but fewer than twenty-four and no
    voucher already stands on the booking, the mid-credit share of it is placed on the voucher instead.
    No membership uplift is added. Where the traveller's club tier earns five points or more per dollar
    and the membership has counted sixty thousand qualifying points or more over the last twelve months,
    the high membership uplift is added instead, and where the tier earns four points or more per dollar
    and the membership has counted thirty thousand qualifying points or more over the last twelve months,
    while either that tier earns fewer than five points per dollar or those points are fewer than sixty
    thousand, the standard membership uplift is added instead. Qualifying points are counted from the
    entries the membership's ledger carries inside that period alone, and the total shown on the membership
    record is not that count. The value placed on the voucher is rounded to the nearest cent.
  prerequisite:
  - problem: air_ext_no_show_penalty
    kind: value_input
    gate: penalty_lines
    form: state
    policy_source: The value placed on a travel credit voucher is settled only after the booking's ledger
      carries the penalty entry owed for every traveller recorded as not having flown, and that entry
      is taken off the fare, tax and service lines standing on the booking.
    condition: a penalty line for the travellers who did not fly stands on the booking's ledger at the
      moment the voucher value is worked out
    resolved_by: withhold_no_show_penalty_8882d2a1
    effect: the penalty entries standing on the booking become non-zero, so the residual value the voucher
      is raised for falls by the sum withheld
  - problem: air_ext_unflown_tax_return
    kind: value_input
    gate: payout_lines
    form: state
    policy_source: Before that value is worked out the booking's ledger must already carry the payout
      entry owed for the carrier-imposed taxes on an unflown ticket, and whatever that entry has returned
      to the form of payment used is taken off as well.
    condition: a payout line returning the carrier-imposed taxes stands on the booking's ledger at the
      moment the voucher value is worked out
    resolved_by: return_unflown_taxes_e343d675
    effect: the payout entries standing on the booking become non-zero, so the residual value the voucher
      is raised for falls by whatever has gone back to the form of payment used
  cross_category:
  - category: club
    as: branch
    reads:
    - variant_name
    - club_points_entries.points_delta
    note: decides the tier of the membership uplift factor, from the tier's points earn rate and the qualifying
      points ledger
  compute:
  - fare_lines: SUM('air_booking_events','amount_usd', event_type='air_fare_charge')
  - extra_lines: SUM('air_booking_events','amount_usd', event_type='air_ancillary_charge')
  - extra_largest: MAX('air_booking_events','amount_usd', event_type='air_ancillary_charge')
  - service_lines: SUM('air_booking_events','amount_usd', event_type='air_fare_charge', charge_category='agency_service_fee')
  - service_line_count: COUNT('air_booking_events', event_type='air_fare_charge', charge_category='agency_service_fee')
  - travellers_ticketed: F('passenger_count')
  - penalty_lines: SUM('air_booking_events','amount_usd', event_type='air_penalty_charge')
  - payout_lines: SUM('air_booking_events','amount_usd', event_type='air_refund_payout')
  - residual_value: fare_lines - penalty_lines + payout_lines
  - service_deduction: (service_lines * K('service_carry_none')) if (service_line_count >= travellers_ticketed
      and P('credit_validity_months') >= K('long_credit_months')) else ((service_lines * K('service_carry_half'))
      if (service_line_count >= travellers_ticketed and P('credit_validity_months') < K('long_credit_months'))
      else (service_lines * K('service_carry_full')))
  - extras_latest_date: LATEST('air_booking_events','posted_date', date_field='posted_date', event_type='air_ancillary_charge')
  - extras_lead: DAYS(extras_latest_date, F('departure_date'))
  - extras_carried: extra_lines if (extras_lead > K('extras_lead_days') and P('checked_bag_allowance_count')
      >= 1) else ((extra_largest * travellers_ticketed) if (extras_lead > K('extras_lead_days') and P('checked_bag_allowance_count')
      < 1) else (extra_lines * K('extras_carry_none')))
  - subtotal: residual_value - service_deduction + extras_carried
  - cancel_lead_days: DAYS(F('cancelled_at'), F('departure_date'))
  - lead_share: K('lead_whole_share') if (cancel_lead_days >= 0 and P('credit_validity_months') >= K('mid_brand_months'))
      else (K('lead_late_share') if (cancel_lead_days < 0 and P('credit_validity_months') >= K('mid_brand_months'))
      else K('lead_unnotified_share'))
  - voucher_lines: COUNT('air_booking_events', event_type='air_credit_issue')
  - brand_share: K('share_long_credit') if (P('credit_validity_months') >= K('long_brand_months') and
      voucher_lines < 1) else (K('share_mid_credit') if (P('credit_validity_months') >= K('mid_brand_months')
      and voucher_lines < 1) else K('share_short_credit'))
  - member_earn_rate: CPARAM('club','points_earn_rate_per_usd')
  - member_qualifying_points: XSUM('club','club_points_entries','points_delta', within_months=12, date_field='posted_date',
      points_kind='qualifying')
  - uplift_pct: K('uplift_high_pct') if (member_earn_rate >= K('high_earn_rate') and member_qualifying_points
      >= K('high_points')) else (K('uplift_standard_pct') if (member_earn_rate >= K('mid_earn_rate') and
      member_qualifying_points >= K('mid_points')) else K('uplift_none_pct'))
  - result: RND(subtotal * lead_share * brand_share * (1 + uplift_pct / 100), 2)
  compute_basis:
    travellers_ticketed: The agency service lines standing on the booking are then taken off the residual
      value in full.
    fare_lines: The value placed on a travel credit voucher is settled only after the booking's ledger
      carries the penalty entry owed for every traveller recorded as not having flown, and that entry
      is taken off the fare, tax and service lines standing on the booking.
    penalty_lines: The value placed on a travel credit voucher is settled only after the booking's ledger
      carries the penalty entry owed for every traveller recorded as not having flown, and that entry
      is taken off the fare, tax and service lines standing on the booking.
    payout_lines: Before that value is worked out the booking's ledger must already carry the payout entry
      owed for the carrier-imposed taxes on an unflown ticket, and whatever that entry has returned to
      the form of payment used is taken off as well.
    residual_value: What is left after those two movements is the residual value of the ticket.
    service_lines: The agency service lines standing on the booking are then taken off the residual value
      in full.
    service_line_count: Where the booking's service lines stand for as many travellers as are ticketed
      and the brand's credit runs eighteen months or more, none of the service lines is taken off instead,
      and where the booking's service lines stand for as many travellers as are ticketed and the brand's
      credit runs fewer than eighteen months, half of them is taken off instead.
    service_deduction: Where the booking's service lines stand for as many travellers as are ticketed
      and the brand's credit runs eighteen months or more, none of the service lines is taken off instead,
      and where the booking's service lines stand for as many travellers as are ticketed and the brand's
      credit runs fewer than eighteen months, half of them is taken off instead.
    extra_lines: No optional extra already bought is carried onto the voucher.
    extra_largest: Where the latest optional-extra line was posted more than seven days ahead of the outbound
      departure and the fare brand includes at least one checked bag, the optional extras are carried
      instead as the sum of every optional-extra line standing on the booking, and where the latest optional-extra
      line was posted more than seven days ahead of the outbound departure and the fare brand includes
      no checked bag, they are carried instead as the largest single optional-extra line, multiplied by
      the travellers ticketed.
    extras_latest_date: Where the latest optional-extra line was posted more than seven days ahead of
      the outbound departure and the fare brand includes at least one checked bag, the optional extras
      are carried instead as the sum of every optional-extra line standing on the booking, and where the
      latest optional-extra line was posted more than seven days ahead of the outbound departure and the
      fare brand includes no checked bag, they are carried instead as the largest single optional-extra
      line, multiplied by the travellers ticketed.
    extras_lead: Where the latest optional-extra line was posted more than seven days ahead of the outbound
      departure and the fare brand includes at least one checked bag, the optional extras are carried
      instead as the sum of every optional-extra line standing on the booking, and where the latest optional-extra
      line was posted more than seven days ahead of the outbound departure and the fare brand includes
      no checked bag, they are carried instead as the largest single optional-extra line, multiplied by
      the travellers ticketed.
    extras_carried: Where the latest optional-extra line was posted more than seven days ahead of the
      outbound departure and the fare brand includes at least one checked bag, the optional extras are
      carried instead as the sum of every optional-extra line standing on the booking, and where the latest
      optional-extra line was posted more than seven days ahead of the outbound departure and the fare
      brand includes no checked bag, they are carried instead as the largest single optional-extra line,
      multiplied by the travellers ticketed.
    subtotal: The residual value, less what is taken off for the service lines and plus what is carried
      for the optional extras, makes the subtotal; the promptness share acts on that subtotal, the brand's
      credit share acts on the result of that step, and the membership uplift acts on the result of that
      second step, so that the three never act together on the residual value.
    cancel_lead_days: Where the cancellation was confirmed on or before the outbound departure date and
      the brand's credit runs twelve months or more, the whole of the subtotal is carried forward instead,
      and where the cancellation was confirmed after the outbound departure date and the brand's credit
      runs twelve months or more, the late promptness share of it is carried forward instead.
    lead_share: Where the cancellation was confirmed on or before the outbound departure date and the
      brand's credit runs twelve months or more, the whole of the subtotal is carried forward instead,
      and where the cancellation was confirmed after the outbound departure date and the brand's credit
      runs twelve months or more, the late promptness share of it is carried forward instead.
    voucher_lines: Where the brand's credit runs twenty-four months or more and no voucher already stands
      on the booking, the whole of it is placed on the voucher instead, and where the brand's credit runs
      twelve months or more but fewer than twenty-four and no voucher already stands on the booking, the
      mid-credit share of it is placed on the voucher instead.
    brand_share: Where the brand's credit runs twenty-four months or more and no voucher already stands
      on the booking, the whole of it is placed on the voucher instead, and where the brand's credit runs
      twelve months or more but fewer than twenty-four and no voucher already stands on the booking, the
      mid-credit share of it is placed on the voucher instead.
    member_earn_rate: Where the traveller's club tier earns five points or more per dollar and the membership
      has counted sixty thousand qualifying points or more over the last twelve months, the high membership
      uplift is added instead, and where the tier earns four points or more per dollar and the membership
      has counted thirty thousand qualifying points or more over the last twelve months, while either
      that tier earns fewer than five points per dollar or those points are fewer than sixty thousand,
      the standard membership uplift is added instead.
    member_qualifying_points: Qualifying points are counted from the entries the membership's ledger carries
      inside that period alone, and the total shown on the membership record is not that count.
    uplift_pct: Where the traveller's club tier earns five points or more per dollar and the membership
      has counted sixty thousand qualifying points or more over the last twelve months, the high membership
      uplift is added instead, and where the tier earns four points or more per dollar and the membership
      has counted thirty thousand qualifying points or more over the last twelve months, while either
      that tier earns fewer than five points per dollar or those points are fewer than sixty thousand,
      the standard membership uplift is added instead.
    result: The value placed on the voucher is rounded to the nearest cent.
  factors:
  - id: service_line_carry
    effect: parameter
    decides: service_deduction
    bindings:
    - service_lines
    - service_line_count
    - service_deduction
    ladder:
    - when: the booking's service lines stand for as many travellers as are ticketed and the brand's credit
        runs eighteen months or more
      value: K('service_carry_none')
    - when: the booking's service lines stand for as many travellers as are ticketed and the brand's credit
        runs fewer than eighteen months
      value: K('service_carry_half')
    - when: otherwise
      value: K('service_carry_full')
    baseline:
      service_deduction: (service_lines * K('service_carry_full'))
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: optional_extra_measure
    effect: method
    decides: extras_carried
    bindings:
    - extra_largest
    - extras_latest_date
    - extras_lead
    - extras_carried
    ladder:
    - when: the latest optional-extra line was posted more than seven days ahead of the outbound departure
        and the fare brand includes at least one checked bag
      method: the optional extras are carried as the sum of every optional-extra line standing on the
        booking
    - when: the latest optional-extra line was posted more than seven days ahead of the outbound departure
        and the fare brand includes no checked bag
      method: the optional extras are carried as the largest single optional-extra line, multiplied by
        the travellers ticketed
    - when: otherwise
      method: no optional extra already bought is carried onto the voucher
    baseline:
      extras_carried: (extra_lines * K('extras_carry_none'))
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: cancellation_promptness_share
    effect: parameter
    decides: lead_share
    bindings:
    - cancel_lead_days
    - lead_share
    ladder:
    - when: the cancellation was confirmed on or before the outbound departure date and the brand's credit
        runs twelve months or more
      value: K('lead_whole_share')
    - when: the cancellation was confirmed after the outbound departure date and the brand's credit runs
        twelve months or more
      value: K('lead_late_share')
    - when: otherwise
      value: K('lead_unnotified_share')
    baseline:
      lead_share: K('lead_unnotified_share')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: brand_credit_share
    effect: parameter
    decides: brand_share
    bindings:
    - voucher_lines
    - brand_share
    ladder:
    - when: the brand's credit runs twenty-four months or more and no voucher already stands on the booking
      value: K('share_long_credit')
    - when: the brand's credit runs twelve months or more but fewer than twenty-four and no voucher already
        stands on the booking
      value: K('share_mid_credit')
    - when: otherwise
      value: K('share_short_credit')
    baseline:
      brand_share: K('share_short_credit')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: membership_credit_uplift
    effect: parameter
    decides: uplift_pct
    bindings:
    - member_earn_rate
    - member_qualifying_points
    - uplift_pct
    ladder:
    - when: the traveller's club tier earns five points or more per dollar and the membership has counted
        sixty thousand qualifying points or more over the last twelve months
      value: K('uplift_high_pct')
    - when: the traveller's club tier earns four points or more per dollar and the membership has counted
        thirty thousand qualifying points or more over the last twelve months, while either that tier
        earns fewer than five points per dollar or those points are fewer than sixty thousand
      value: K('uplift_standard_pct')
    - when: otherwise
      value: K('uplift_none_pct')
    baseline:
      uplift_pct: K('uplift_none_pct')
    evidence:
    - cross_category
    - history
    cross_difficulty: club
