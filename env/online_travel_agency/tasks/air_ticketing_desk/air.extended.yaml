extended_policies:
- id: air_ext_no_show_penalty
  base_policy_refs:
  - air_penalty
  - air_club_benefit_interaction
  overwrite:
  - base_policy: air_penalty
    superseded_clause: the no-show penalty of the fare brand held is withheld from whatever value the
      ticket still carries
    replaced_by: The brand's penalty, the travellers counted and the share withheld are multiplied together
      into the gross penalty, and what the traveller has already paid in reworking the ticket is then
      taken off that gross figure, never off the brand's penalty before it is multiplied out.
  - base_policy: air_penalty
    superseded_clause: Where the value still on the ticket is smaller than the penalty, the penalty is
      limited to that value and no balance is pursued.
    replaced_by: The sum withheld is limited to the value the ticket still carries, read as the fare,
      tax, service and optional-extra lines standing on the booking, and the result is rounded to the
      nearest cent.
  - base_policy: air_club_benefit_interaction
    superseded_clause: the fare brand's own rates apply to everything the club does not cover
    replaced_by: Where the traveller's club tier carries a tier bonus of seventy-five percent or more
      and the membership has counted sixty thousand qualifying points or more over the last twelve months,
      the figure is halved and cut down to the whole dollar instead
  trigger: state_due
  subject:
  - air_penalty_charge
  computes: penalty_amount_usd
  target_tool: withhold_no_show_penalty_8882d2a1
  params:
    relief_waived_share: 0.0
    relief_reduced_share: 0.5
    relief_standard_share: 1.0
    half_threshold_multiple: 2
    recent_notice_months: 3
    partial_rework_share: 0.5
    rework_window_months: 12
    member_high_factor: 0.5
    member_mid_factor: 0.75
    member_high_bonus_pct: 75
    member_mid_bonus_pct: 25
    member_high_points: 60000
    member_mid_points: 30000
  rule: A booking whose travellers neither flew nor gave up their seats before the outbound departure
    is recorded as a no-show, and a penalty is withheld from the value the ticket still carries. The no-show
    penalty withheld from a booking is the fare brand's own no-show penalty, taken once for every traveller
    ticketed on the booking. The travellers counted are the travellers ticketed on the booking. Where
    the fare brand carries a child discount and the booking's base-fare lines stand for as many travellers
    as are ticketed, the travellers counted are instead the booking's base-fare total divided by its largest
    single base-fare line, so that a lap infant or a discounted child counts only for the share of the
    adult fare actually paid, and where the fare brand carries a child discount and the booking carries
    fewer base-fare lines than travellers ticketed, the travellers counted are instead the base-fare lines
    standing on the booking. The whole of the brand's penalty is withheld. Where the largest single schedule
    move the airline has advised on the booking reaches the brand's schedule-change threshold and at least
    one such notice was received in the last three months, no part of it is withheld instead, and where
    twice that largest move reaches the brand's threshold while the move itself does not and at least
    one such notice was received in the last three months, half of it is withheld instead. The brand's
    penalty, the travellers counted and the share withheld are multiplied together into the gross penalty,
    and what the traveller has already paid in reworking the ticket is then taken off that gross figure,
    never off the brand's penalty before it is multiplied out. Nothing is taken off that gross figure
    for earlier reworking of the ticket. Where the booking carries voluntary change lines posted in the
    last twelve months numbering at least the brand's ceiling on voluntary changes, the change fees posted
    in that period are taken off in full instead, and where the booking carries at least one such line
    but fewer than that ceiling, half of those change fees are taken off instead. The figure never falls
    below zero. The sum withheld is then carried to the cent. Where the traveller's club tier carries
    a tier bonus of seventy-five percent or more and the membership has counted sixty thousand qualifying
    points or more over the last twelve months, the figure is halved and cut down to the whole dollar
    instead, and where the tier bonus is twenty-five percent or more and the membership has counted thirty
    thousand qualifying points or more over the last twelve months, while either that bonus is below seventy-five
    percent or those points are fewer than sixty thousand, the figure is taken at three quarters and cut
    down to the whole dollar instead. The qualifying points counted are the qualifying entries the membership's
    own ledger carries over that period, never the running total displayed on the membership record. The
    sum withheld is limited to the value the ticket still carries, read as the fare, tax, service and
    optional-extra lines standing on the booking, and the result is rounded to the nearest cent.
  prerequisite: []
  cross_category:
  - category: club
    as: branch
    reads:
    - variant_name
    - club_points_entries.points_delta
    note: decides the tier of the club softening factor, from the membership's tier bonus and its qualifying
      points ledger
  compute:
  - brand_penalty: P('no_show_penalty_usd')
  - travellers_ticketed: F('passenger_count')
  - base_fare_lines: COUNT('air_booking_events', event_type='air_fare_charge', charge_category='base_fare')
  - base_fare_total: SUM('air_booking_events','amount_usd', event_type='air_fare_charge', charge_category='base_fare')
  - adult_fare: MAX('air_booking_events','amount_usd', event_type='air_fare_charge', charge_category='base_fare')
  - travellers_counted: (base_fare_total / adult_fare) if (P('child_discount_pct') > 0 and base_fare_lines
      >= travellers_ticketed) else (base_fare_lines if (P('child_discount_pct') > 0 and base_fare_lines
      < travellers_ticketed) else travellers_ticketed)
  - largest_move: MAX('air_booking_events','schedule_change_minutes', event_type='air_schedule_change_notice')
  - notices_recent: COUNT('air_booking_events', within_months=K('recent_notice_months'), date_field='posted_date',
      event_type='air_schedule_change_notice')
  - relief_share: K('relief_waived_share') if (largest_move >= P('schedule_change_threshold_minutes')
      and notices_recent >= 1) else (K('relief_reduced_share') if (largest_move * K('half_threshold_multiple')
      >= P('schedule_change_threshold_minutes') and notices_recent >= 1) else K('relief_standard_share'))
  - gross_penalty: brand_penalty * travellers_counted * relief_share
  - rework_lines: COUNT('air_booking_events', within_months=K('rework_window_months'), date_field='posted_date',
      event_type='air_change_fee_charge', reason_code='voluntary_change')
  - rework_fees: SUM('air_booking_events','amount_usd', within_months=K('rework_window_months'), date_field='posted_date',
      event_type='air_change_fee_charge', reason_code='voluntary_change')
  - rework_offset: rework_fees if (rework_lines >= P('max_changes_per_ticket') and rework_lines >= 1)
      else ((rework_fees * K('partial_rework_share')) if (rework_lines >= 1 and rework_lines < P('max_changes_per_ticket'))
      else 0.0)
  - net_penalty: MX(0.0, gross_penalty - rework_offset)
  - member_bonus_pct: CPARAM('club','tier_bonus_pct')
  - member_qualifying_points: XSUM('club','club_points_entries','points_delta', within_months=12, date_field='posted_date',
      points_kind='qualifying')
  - softened_penalty: int(net_penalty * K('member_high_factor')) if (member_bonus_pct >= K('member_high_bonus_pct')
      and member_qualifying_points >= K('member_high_points')) else (int(net_penalty * K('member_mid_factor'))
      if (member_bonus_pct >= K('member_mid_bonus_pct') and member_qualifying_points >= K('member_mid_points'))
      else RND(net_penalty, 2))
  - value_ceiling: SUM('air_booking_events','amount_usd', event_type='air_fare_charge') + SUM('air_booking_events','amount_usd',
      event_type='air_ancillary_charge')
  - result: RND(MN(softened_penalty, value_ceiling), 2)
  compute_basis:
    brand_penalty: The no-show penalty withheld from a booking is the fare brand's own no-show penalty,
      taken once for every traveller ticketed on the booking.
    travellers_ticketed: The travellers counted are the travellers ticketed on the booking.
    base_fare_lines: Where the fare brand carries a child discount and the booking's base-fare lines stand
      for as many travellers as are ticketed, the travellers counted are instead the booking's base-fare
      total divided by its largest single base-fare line, so that a lap infant or a discounted child counts
      only for the share of the adult fare actually paid, and where the fare brand carries a child discount
      and the booking carries fewer base-fare lines than travellers ticketed, the travellers counted are
      instead the base-fare lines standing on the booking.
    base_fare_total: Where the fare brand carries a child discount and the booking's base-fare lines stand
      for as many travellers as are ticketed, the travellers counted are instead the booking's base-fare
      total divided by its largest single base-fare line, so that a lap infant or a discounted child counts
      only for the share of the adult fare actually paid, and where the fare brand carries a child discount
      and the booking carries fewer base-fare lines than travellers ticketed, the travellers counted are
      instead the base-fare lines standing on the booking.
    adult_fare: Where the fare brand carries a child discount and the booking's base-fare lines stand
      for as many travellers as are ticketed, the travellers counted are instead the booking's base-fare
      total divided by its largest single base-fare line, so that a lap infant or a discounted child counts
      only for the share of the adult fare actually paid, and where the fare brand carries a child discount
      and the booking carries fewer base-fare lines than travellers ticketed, the travellers counted are
      instead the base-fare lines standing on the booking.
    travellers_counted: Where the fare brand carries a child discount and the booking's base-fare lines
      stand for as many travellers as are ticketed, the travellers counted are instead the booking's base-fare
      total divided by its largest single base-fare line, so that a lap infant or a discounted child counts
      only for the share of the adult fare actually paid, and where the fare brand carries a child discount
      and the booking carries fewer base-fare lines than travellers ticketed, the travellers counted are
      instead the base-fare lines standing on the booking.
    largest_move: Where the largest single schedule move the airline has advised on the booking reaches
      the brand's schedule-change threshold and at least one such notice was received in the last three
      months, no part of it is withheld instead, and where twice that largest move reaches the brand's
      threshold while the move itself does not and at least one such notice was received in the last three
      months, half of it is withheld instead.
    notices_recent: Where the largest single schedule move the airline has advised on the booking reaches
      the brand's schedule-change threshold and at least one such notice was received in the last three
      months, no part of it is withheld instead, and where twice that largest move reaches the brand's
      threshold while the move itself does not and at least one such notice was received in the last three
      months, half of it is withheld instead.
    relief_share: Where the largest single schedule move the airline has advised on the booking reaches
      the brand's schedule-change threshold and at least one such notice was received in the last three
      months, no part of it is withheld instead, and where twice that largest move reaches the brand's
      threshold while the move itself does not and at least one such notice was received in the last three
      months, half of it is withheld instead.
    gross_penalty: The brand's penalty, the travellers counted and the share withheld are multiplied together
      into the gross penalty, and what the traveller has already paid in reworking the ticket is then
      taken off that gross figure, never off the brand's penalty before it is multiplied out.
    rework_lines: Where the booking carries voluntary change lines posted in the last twelve months numbering
      at least the brand's ceiling on voluntary changes, the change fees posted in that period are taken
      off in full instead, and where the booking carries at least one such line but fewer than that ceiling,
      half of those change fees are taken off instead.
    rework_fees: Where the booking carries voluntary change lines posted in the last twelve months numbering
      at least the brand's ceiling on voluntary changes, the change fees posted in that period are taken
      off in full instead, and where the booking carries at least one such line but fewer than that ceiling,
      half of those change fees are taken off instead.
    rework_offset: Where the booking carries voluntary change lines posted in the last twelve months numbering
      at least the brand's ceiling on voluntary changes, the change fees posted in that period are taken
      off in full instead, and where the booking carries at least one such line but fewer than that ceiling,
      half of those change fees are taken off instead.
    net_penalty: The figure never falls below zero.
    member_bonus_pct: Where the traveller's club tier carries a tier bonus of seventy-five percent or
      more and the membership has counted sixty thousand qualifying points or more over the last twelve
      months, the figure is halved and cut down to the whole dollar instead, and where the tier bonus
      is twenty-five percent or more and the membership has counted thirty thousand qualifying points
      or more over the last twelve months, while either that bonus is below seventy-five percent or those
      points are fewer than sixty thousand, the figure is taken at three quarters and cut down to the
      whole dollar instead.
    member_qualifying_points: The qualifying points counted are the qualifying entries the membership's
      own ledger carries over that period, never the running total displayed on the membership record.
    softened_penalty: Where the traveller's club tier carries a tier bonus of seventy-five percent or
      more and the membership has counted sixty thousand qualifying points or more over the last twelve
      months, the figure is halved and cut down to the whole dollar instead, and where the tier bonus
      is twenty-five percent or more and the membership has counted thirty thousand qualifying points
      or more over the last twelve months, while either that bonus is below seventy-five percent or those
      points are fewer than sixty thousand, the figure is taken at three quarters and cut down to the
      whole dollar instead.
    value_ceiling: The sum withheld is limited to the value the ticket still carries, read as the fare,
      tax, service and optional-extra lines standing on the booking, and the result is rounded to the
      nearest cent.
    result: The sum withheld is limited to the value the ticket still carries, read as the fare, tax,
      service and optional-extra lines standing on the booking, and the result is rounded to the nearest
      cent.
  factors:
  - id: fare_weighted_travellers
    effect: parameter
    decides: travellers_counted
    bindings:
    - base_fare_lines
    - base_fare_total
    - adult_fare
    - travellers_counted
    ladder:
    - when: the fare brand carries a child discount and the booking's base-fare lines stand for as many
        travellers as are ticketed
      value: the base-fare total divided by the largest single base-fare line
    - when: the fare brand carries a child discount and the booking carries fewer base-fare lines than
        travellers ticketed
      value: the base-fare lines standing on the booking
    - when: otherwise
      value: the travellers ticketed on the booking
    baseline:
      travellers_counted: travellers_ticketed
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: airline_disruption_relief
    effect: parameter
    decides: relief_share
    bindings:
    - largest_move
    - notices_recent
    - relief_share
    ladder:
    - when: the largest single schedule move advised on the booking reaches the brand's schedule-change
        threshold and at least one such notice was received in the last three months
      value: K('relief_waived_share')
    - when: twice the largest single schedule move advised on the booking reaches the brand's threshold
        while the move itself does not, and at least one such notice was received in the last three months
      value: K('relief_reduced_share')
    - when: otherwise
      value: K('relief_standard_share')
    baseline:
      relief_share: K('relief_standard_share')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: rework_offset_allowance
    effect: parameter
    decides: rework_offset
    bindings:
    - rework_lines
    - rework_fees
    - rework_offset
    ladder:
    - when: the booking carries voluntary change lines posted in the last twelve months numbering at least
        the brand's ceiling on voluntary changes
      value: the change fees posted in that period
    - when: the booking carries at least one voluntary change line posted in the last twelve months and
        fewer than the brand's ceiling on voluntary changes
      value: K('partial_rework_share') of the change fees posted in that period
    - when: otherwise
      value: nothing
    baseline:
      rework_offset: '0.0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: member_penalty_softening
    effect: method
    decides: softened_penalty
    bindings:
    - member_bonus_pct
    - member_qualifying_points
    - softened_penalty
    ladder:
    - when: the traveller's club tier carries a tier bonus of seventy-five percent or more and the membership
        has counted sixty thousand qualifying points or more over the last twelve months
      method: the figure is halved and cut down to the whole dollar
    - when: the traveller's club tier carries a tier bonus of twenty-five percent or more and the membership
        has counted thirty thousand qualifying points or more over the last twelve months, while either
        that bonus is below seventy-five percent or those points are fewer than sixty thousand
      method: the figure is taken at three quarters and cut down to the whole dollar
    - when: otherwise
      method: the sum withheld is carried to the cent
    baseline:
      softened_penalty: RND(net_penalty, 2)
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  baseline:
    rule: The no-show penalty withheld from a booking is the fare brand's own no-show penalty, taken once
      for every traveller ticketed on the booking. The travellers counted are the travellers ticketed
      on the booking. The whole of the brand's penalty is withheld. The brand's penalty, the travellers
      counted and the share withheld are multiplied together into the gross penalty, and what the traveller
      has already paid in reworking the ticket is then taken off that gross figure, never off the brand's
      penalty before it is multiplied out. Nothing is taken off that gross figure for earlier reworking
      of the ticket. The figure never falls below zero. The sum withheld is then carried to the cent.
      The sum withheld is limited to the value the ticket still carries, read as the fare, tax, service
      and optional-extra lines standing on the booking, and the result is rounded to the nearest cent.
    params:
    - no_show_penalty_usd
