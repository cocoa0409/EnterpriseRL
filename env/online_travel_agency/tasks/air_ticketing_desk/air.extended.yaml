- id: air_ext_credit_release
  base_policy_refs:
  - air_agg_credit_pooling
  - air_credit_validity
  - air_club_benefit_interaction
  overwrite:
  - base_policy: air_credit_validity
    superseded_clause: A voucher that has lapsed may be reissued once onto a fresh voucher against the
      brand's reissue fee, and the fresh voucher carries the same validity term counted from the day of
      reissue.
    replaced_by: The reissue fee of the fare brand that produced the credit is taken off the gross release
      in full.
  - base_policy: air_agg_credit_pooling
    superseded_clause: Travel credits issued from a traveller's cancelled bookings form one pool in that
      traveller's name, and a new itinerary may be paid for out of several vouchers at once.
    replaced_by: The standing value is read as every voucher raised against that booking, less whatever
      has already been taken off those vouchers.
  - base_policy: air_agg_credit_pooling
    superseded_clause: Where the pooled value exceeds the price of the new itinerary the remainder stays
      on the last voucher touched and keeps that voucher's original expiry; the expiry is never extended
      by redemption.
    replaced_by: The value released is measured on the vouchers standing against the producing booking
      alone, and never against the price of the itinerary it is put towards.
  - base_policy: air_agg_credit_pooling
    superseded_clause: Where the pooled value falls short the difference is collected in the original
      form of payment, and a partly paid itinerary is never ticketed.
    replaced_by: The value released is measured on the vouchers standing against the producing booking
      alone, and never against the price of the itinerary it is put towards.
  - base_policy: air_club_benefit_interaction
    superseded_clause: 'A club benefit and a fare-brand inclusion never stack into a payment to the traveller:
      a bag already included in the brand is simply free, and the club benefit is not converted into value.'
    replaced_by: Where the traveller's club tier redeems points at one and three tenths of a cent or more
      and the membership has counted sixty thousand qualifying points or more over the last twelve months,
      no reissue fee is taken off instead
  trigger: on_request
  subject:
  - air_credit_redeem
  computes: credit_applied_usd
  target_tool: apply_travel_credit_e74c9b2a
  params:
    release_whole_share: 1.0
    release_high_share: 0.98
    release_low_share: 0.9
    lapse_horizon_months: 6
    age_whole_share: 1.0
    age_aged_share: 0.97
    age_stale_share: 0.93
    fresh_voucher_months: 1
    recent_cancel_days: 90
    first_release_share: 1.0
    cautious_release_share: 0.96
    repeat_release_share: 0.9
    partial_share: 0.5
    no_deduction: 0.0
    high_redemption_value: 1.3
    mid_redemption_value: 1.0
    high_points: 60000
    mid_points: 30000
  rule: A traveller may put the credit standing in their own name towards an itinerary they are holding,
    and the movement is made by the traveller rather than on their behalf, because the credit is their
    property. Value is taken off a traveller's credit only once a voucher carrying that value stands on
    the booking whose cancellation produced it. The standing value is read as every voucher raised against
    that booking, less whatever has already been taken off those vouchers. The value released is measured
    on the vouchers standing against the producing booking alone, and never against the price of the itinerary
    it is put towards. The low release share of the standing value is released at one movement. Where
    the voucher standing on the booking lapses more than six months from today and the fare brand makes
    its credits transferable, the whole of the standing value is released instead, and where the voucher
    lapses more than six months from today and the brand does not make its credits transferable, the high
    release share of it is released instead. The days the credit has stood unused are counted from the
    day the booking's ticket was issued to today. Where the fare brand makes its credits transferable
    and the booking carries a return date, those days are counted instead from the day the outbound was
    due to depart, and where the fare brand does not make its credits transferable and the booking carries
    a return date, they are counted instead from the day the cancellation was confirmed. Where the most
    recent voucher on the booking was raised within the last month and the days the credit has stood unused
    are ninety or fewer, the whole of that figure is carried forward; where the most recent voucher was
    raised within the last month and those days exceed ninety, the aged age share of it is carried forward;
    and in every other case the stale age share of it is carried forward. The repeat release share of
    that figure is then carried forward. Where the traveller's membership shows at least one points redemption
    over the last twelve months and no redemption line yet stands on the booking, the whole of the figure
    is carried forward instead, and where the membership shows no points redemption over the last twelve
    months and no redemption line yet stands on the booking, the cautious release share of it is carried
    forward instead. The release share, the age share and the release-record share are multiplied against
    the standing value in that order, giving the gross release, and the reissue fee of the fare brand
    that produced the credit and the cover deduction are then taken off that gross release rather than
    off any share before it. The reissue fee of the fare brand that produced the credit is taken off the
    gross release in full. Where the traveller's club tier redeems points at one and three tenths of a
    cent or more and the membership has counted sixty thousand qualifying points or more over the last
    twelve months, no reissue fee is taken off instead, and where the tier redeems points at one cent
    or more and the membership has counted thirty thousand qualifying points or more over the last twelve
    months, while either that tier redeems points at less than one and three tenths of a cent or those
    points are fewer than sixty thousand, the partial share of that reissue fee is taken off instead.
    The qualifying points behind that reading are the ones the membership's ledger records inside the
    period, not the standing total the membership record displays. Nothing is taken off for protection
    cover. Where protection cover bought against this booking is on file, has settled a claim in the last
    twelve months and carries a per-claim deductible above zero, that deductible is taken off instead,
    and where such cover is on file, has settled no claim in that period and carries a per-claim deductible
    above zero, the partial share of that deductible is taken off instead. The value released never falls
    below zero, and the result is rounded to the nearest cent.
  prerequisite:
  - problem: air_ext_cancelled_ticket_credit
    kind: value_input
    gate: standing_credit
    form: state
    policy_source: Value is taken off a traveller's credit only once a voucher carrying that value stands
      on the booking whose cancellation produced it.
    condition: a travel credit voucher raised against the cancelled booking stands on its ledger at the
      moment the release is worked out
    resolved_by: issue_travel_credit_599fe29f
    effect: the standing value read from the booking's vouchers rises from nothing to the value the voucher
      carries, which is the figure every release share acts on
  cross_category:
  - category: club
    as: branch
    reads:
    - variant_name
    - club_points_entries.points_delta
    note: decides the tier of the reissue-fee method factor and of the release-record factor, from the
      tier's redemption value and the membership's points ledger
  - category: care
    as: branch
    reads:
    - variant_name
    - care_claims.paid_amount_usd
    note: decides the tier of the cover deduction factor, from the plan bought against this booking and
      what it has settled
  compute:
  - credit_issued: SUM('air_booking_events','amount_usd', event_type='air_credit_issue')
  - credit_taken: SUM('air_booking_events','amount_usd', event_type='air_credit_redeem')
  - standing_credit: credit_issued + credit_taken
  - voucher_expiry: LATEST('air_booking_events','credit_expires_on', date_field='posted_date', event_type='air_credit_issue')
  - months_to_lapse: MONTHS(NOW, voucher_expiry)
  - release_share: K('release_whole_share') if (months_to_lapse > K('lapse_horizon_months') and P('credit_transferable')
      == True) else (K('release_high_share') if (months_to_lapse > K('lapse_horizon_months') and P('credit_transferable')
      == False) else K('release_low_share'))
  - voucher_issued_date: LATEST('air_booking_events','posted_date', date_field='posted_date', event_type='air_credit_issue')
  - voucher_age_months: MONTHS(voucher_issued_date, NOW)
  - cancel_days: DAYS(F('departure_date'), NOW) if (P('credit_transferable') == True and F('return_date')
      != '') else (DAYS(F('cancelled_at'), NOW) if (P('credit_transferable') == False and F('return_date')
      != '') else DAYS(F('ticketed_at'), NOW))
  - age_share: K('age_whole_share') if (voucher_age_months < K('fresh_voucher_months') and cancel_days
      <= K('recent_cancel_days')) else (K('age_aged_share') if (voucher_age_months < K('fresh_voucher_months')
      and cancel_days > K('recent_cancel_days')) else K('age_stale_share'))
  - member_redemptions: XCOUNT('club','club_points_entries', within_months=12, date_field='posted_date',
      event_type='club_points_redeem')
  - redemption_lines: COUNT('air_booking_events', event_type='air_credit_redeem')
  - record_share: K('first_release_share') if (member_redemptions >= 1 and redemption_lines < 1) else
      (K('cautious_release_share') if (member_redemptions < 1 and redemption_lines < 1) else K('repeat_release_share'))
  - gross_release: standing_credit * release_share * age_share * record_share
  - member_redemption_value: CPARAM('club','redemption_value_cents_per_point')
  - member_qualifying_points: XSUM('club','club_points_entries','points_delta', within_months=12, date_field='posted_date',
      points_kind='qualifying')
  - reissue_deduction: K('no_deduction') if (member_redemption_value >= K('high_redemption_value') and
      member_qualifying_points >= K('high_points')) else ((P('credit_reissue_fee_usd') * K('partial_share'))
      if (member_redemption_value >= K('mid_redemption_value') and member_qualifying_points >= K('mid_points'))
      else P('credit_reissue_fee_usd'))
  - cover_deductible: CPARAM('care','deductible_per_claim_usd', linked_air_booking_id=HID)
  - cover_claims_paid: XSUM('care','care_claims','paid_amount_usd', within_months=12, date_field='filed_date',
      claim_status='paid')
  - cover_deduction: cover_deductible if (cover_claims_paid > 0 and cover_deductible > 0) else ((cover_deductible
      * K('partial_share')) if (cover_claims_paid <= 0 and cover_deductible > 0) else K('no_deduction'))
  - result: RND(MX(0.0, gross_release - reissue_deduction - cover_deduction), 2)
  compute_basis:
    credit_issued: The standing value is read as every voucher raised against that booking, less whatever
      has already been taken off those vouchers.
    credit_taken: The standing value is read as every voucher raised against that booking, less whatever
      has already been taken off those vouchers.
    standing_credit: The value released is measured on the vouchers standing against the producing booking
      alone, and never against the price of the itinerary it is put towards.
    voucher_expiry: Where the voucher standing on the booking lapses more than six months from today and
      the fare brand makes its credits transferable, the whole of the standing value is released instead,
      and where the voucher lapses more than six months from today and the brand does not make its credits
