  rule: 'A standard advance seat is free on a fare brand that includes seat selection and is otherwise
    charged per traveller per segment at the brand''s standard seat rate. An extra-legroom seat is charged
    per traveller per segment at the brand''s extra-legroom rate even where standard seats are free, because
    the two are different products. Priority boarding is free on a brand that includes it and is otherwise
    charged per traveller per segment; lounge access, a hot meal and an onboard wifi voucher are included
    or not included by brand and are never sold separately here. At the brand''s seat-map release point
    before departure the remaining seats are opened for free selection, and a seat taken after that point
    carries no charge on any brand. A pet in the cabin, an unaccompanied minor and registered special
    assistance each follow their own line: the first two at the brand''s rate, and special assistance
    free of charge but only where it is registered at least the brand''s lead time before departure. An
