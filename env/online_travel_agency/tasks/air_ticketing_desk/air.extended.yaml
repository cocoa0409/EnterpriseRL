        void_window_hours: =void_window_hours
        cancellation_deadline_hours_before_departure: =cancellation_deadline_hours_before_departure
      Economy Saver:
        refundable: =refundable
        refund_form: =refund_form
        cancel_penalty_usd: =cancel_penalty_usd
        cancel_penalty_ladder_usd: =cancel_penalty_ladder_usd
        void_window_hours: =void_window_hours
        cancellation_deadline_hours_before_departure: =cancellation_deadline_hours_before_departure
      Economy Classic:
