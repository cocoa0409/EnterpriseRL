  factors:
  - id: lapse_horizon_release
    effect: parameter
    decides: release_share
    bindings:
    - voucher_expiry
    - months_to_lapse
    - release_share
    ladder:
    - when: the voucher standing on the booking lapses more than six months from today and the fare brand
        makes its credits transferable
      value: K('release_whole_share')
    - when: the voucher standing on the booking lapses more than six months from today and the fare brand
        does not make its credits transferable
      value: K('release_high_share')
    - when: otherwise
      value: K('release_low_share')
    baseline:
      release_share: K('release_low_share')
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: credit_idle_clock_anchor
    effect: method
    decides: cancel_days
    bindings:
    - cancel_days
    ladder:
    - when: the fare brand makes its credits transferable and the booking carries a return date
      method: the days the credit has stood unused are counted from the day the outbound was due to depart
    - when: the fare brand does not make its credits transferable and the booking carries a return date
      method: the days the credit has stood unused are counted from the day the cancellation was confirmed
    - when: otherwise
      method: the days the credit has stood unused are counted from the day the booking's ticket was issued
    baseline:
      cancel_days: DAYS(F('ticketed_at'), NOW)
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: release_record_share
    effect: parameter
    decides: record_share
    bindings:
    - member_redemptions
    - redemption_lines
    - record_share
    ladder:
    - when: the traveller's membership shows at least one points redemption over the last twelve months
        and no redemption line yet stands on the booking
      value: K('first_release_share')
    - when: the traveller's membership shows no points redemption over the last twelve months and no redemption
        line yet stands on the booking
      value: K('cautious_release_share')
    - when: otherwise
      value: K('repeat_release_share')
    baseline:
      record_share: K('repeat_release_share')
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  - id: member_reissue_treatment
    effect: parameter
    decides: reissue_deduction
    bindings:
    - member_redemption_value
    - member_qualifying_points
    - reissue_deduction
    ladder:
    - when: the traveller's club tier redeems points at one and three tenths of a cent or more and the
        membership has counted sixty thousand qualifying points or more over the last twelve months
      value: K('no_deduction')
    - when: the traveller's club tier redeems points at one cent or more and the membership has counted
        thirty thousand qualifying points or more over the last twelve months, while either that tier
        redeems points at less than one and three tenths of a cent or those points are fewer than sixty
        thousand
      value: K('partial_share') of the reissue fee of the fare brand that produced the credit
    - when: otherwise
      value: the reissue fee of the fare brand that produced the credit, in full
    baseline:
      reissue_deduction: P('credit_reissue_fee_usd')
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  - id: protection_deductible_offset
    effect: parameter
    decides: cover_deduction
    bindings:
    - cover_deductible
    - cover_claims_paid
    - cover_deduction
    ladder:
    - when: protection cover bought against this booking is on file, has settled a claim in the last twelve
        months and carries a per-claim deductible above zero
      value: the plan's per-claim deductible
    - when: protection cover bought against this booking is on file, has settled no claim in that period
        and carries a per-claim deductible above zero
      value: K('partial_share') of the plan's per-claim deductible
    - when: otherwise
      value: K('no_deduction')
    baseline:
      cover_deduction: K('no_deduction')
    evidence:
    - cross_category
    - history
    cross_difficulty: care
