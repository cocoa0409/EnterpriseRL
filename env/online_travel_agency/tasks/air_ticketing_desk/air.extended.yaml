    tax_line_count: Where the booking carries as many tax lines as travellers ticketed and at least one
      voluntary change line was posted to it in the last twelve months, the taxes are taken instead as
      the sum of every tax line standing on the booking, and where the booking carries more tax lines
      than travellers ticketed and at least one voluntary change line was posted to it in that period,
