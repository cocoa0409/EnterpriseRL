    days_since_departure: Where a return date stands on the booking and the outbound departure date has
      already passed, only the unflown-direction share of them is in scope instead, and where a return
      date stands on the booking and the outbound departure date has not yet passed, the whole of them
      stays in scope.
    direction_share: Where a return date stands on the booking and the outbound departure date has already
