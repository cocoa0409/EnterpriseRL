      Business Flex:
        advance_purchase_days: =advance_purchase_days
        min_stay_nights: =min_stay_nights
        max_stay_days: =max_stay_days
        hold_window_hours: =hold_window_hours
        group_booking_min_pax: =group_booking_min_pax
        payment_plan_available: =payment_plan_available
        payment_plan_min_amount_usd: =payment_plan_min_amount_usd
- id: air_change_fee
  subject:
  - air_change_fee_charge
  rule: A voluntary change is priced as the change fee of the fare brand held plus, where the new itinerary
    costs more, the difference to the new fare. A voluntary change is handled with no change fee only
    when frozen time is not after the moment the traveller's ticket was issued for this booking plus the
    free-change window of the fare brand held. The free-change window is counted in whole elapsed hours
    from the ticket issue moment, never mixing elapsed hours with calendar days, and a change made exactly
    at the boundary is still inside the window. A change fee line is raised only while the booking record
    stands at ticketed. A move between flights on the already-booked routing departing on the same calendar
    day is priced at the brand's same-day fee instead of the full change fee. A change that alters the
    origin or the destination is refused outright on a brand that does not allow routing changes, and
    a change of travel dates is refused outright on a brand that does not allow date changes; a refusal
    raises no fee line at all. The brand's ceiling on voluntary changes counts the traveller's voluntary
    changes on this ticket over the last twelve months; once the ceiling is reached a further change is
    refused and the traveller is offered cancellation on the brand's own terms instead. Where the new
    fare is cheaper than the fare already paid, the unused value is handled as the brand prescribes —
    forfeited, placed on a travel credit or returned to the original form of payment — and is never handled
    two ways at once. A change made necessary by an airline schedule move large enough to give the traveller
    a change right is not a voluntary change and carries no fee under this rule.
