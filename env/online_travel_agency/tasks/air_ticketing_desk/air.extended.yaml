- id: air_ext_outstanding_service_charge
  base_policy_refs:
  - air_service_fee
  - air_club_benefit_interaction
  - air_biz_exclusion
  - air_ticketing
  overwrite:
  - base_policy: air_service_fee
    superseded_clause: The agency service fee is charged once per traveller on the booking at the moment
      the ticket is issued, and is stated separately from the airline fare and from taxes and carrier
      fees.
    replaced_by: The agency service charge is owed once for every traveller the booking carries, and where
      the booking's lines cover fewer travellers than it carries the charge is owed for the travellers
      the lines do not yet cover.
  - base_policy: air_service_fee
    superseded_clause: The fee follows the fare brand held, not the cabin flown, so a business cabin sold
      under a saver brand carries the saver brand's fee.
    replaced_by: Where a corporate programme reference stands on the booking and its fare lines were taken
      through the corporate portal, the unit is instead the programme's own online booking fee, and where
      a corporate programme reference stands on the booking and its fare lines were taken through any
      other channel, the unit is instead the programme's own offline booking fee.
  - base_policy: air_service_fee
    superseded_clause: Where the traveller elects to be charged in a currency other than the ticketing
      currency, the conversion markup of the fare brand held is added to the converted total, and the
      markup is disclosed before the card is taken.
    replaced_by: Where the booking's fare lines were presented in a currency other than US dollars and
      the contracting company is registered outside the United States, the fare brand's own conversion
      markup is applied instead, and where the booking's fare lines were presented in a currency other
      than US dollars and the contracting company is registered in the United States, the domestic conversion
      markup is applied instead.
  - base_policy: air_biz_exclusion
    superseded_clause: a booking that carries a corporate programme reference is priced entirely on the
      programme's negotiated terms
    replaced_by: Where the booking's fare lines were presented in a currency other than US dollars and
      the contracting company is registered outside the United States, the fare brand's own conversion
      markup is applied instead, and where the booking's fare lines were presented in a currency other
      than US dollars and the contracting company is registered in the United States, the domestic conversion
      markup is applied instead.
  trigger: state_due
  subject:
  - air_fare_charge
  computes: service_charge_usd
  target_tool: settle_agency_service_charge_b626effa
  params:
    no_rebate_pct: 0.0
    partial_share: 0.5
    no_addition: 0.0
    short_notice_loading: 25.0
    near_term_loading: 10.0
    short_notice_days: 7
    near_term_days: 30
    no_markup_pct: 0.0
    domestic_markup_pct: 1.0
    settled_term_months: 6
    rolling_window_months: 12
    current_period_months: 1
  rule: The agency service charge is owed once for every traveller the booking carries, and where the
    booking's lines cover fewer travellers than it carries the charge is owed for the travellers the lines
    do not yet cover. A booking that stands as an uncollected hold carries that charge for as long as
    the hold stands, and it is not ticketed while any part of the collection is still outstanding. The
    unit the charge is taken at is the fare brand's own agency service fee. Where a corporate programme
    reference stands on the booking and its fare lines were taken through the corporate portal, the unit
    is instead the programme's own online booking fee, and where a corporate programme reference stands
    on the booking and its fare lines were taken through any other channel, the unit is instead the programme's
    own offline booking fee. The unit and the travellers not yet covered are multiplied together into
    the gross charge; the volume rebate acts on that gross charge alone, the overage and lead-time additions
    are then added to the rebated figure, and the conversion markup acts last, on the sum of the rebated
    figure and those two additions. The programme's billing is read over the current billing period alone.
    Where the programme is invoiced annually and its current contract term has run six months or more,
    that billing is read instead over the whole of the current contract term, and where the programme
    is invoiced monthly or quarterly and its current contract term has run six months or more, it is read
    instead over the last twelve months. No volume rebate is taken off the gross charge. Where the programme's
    billing so read reaches its volume rebate threshold and its rebate percentage is above zero, the whole
    rebate percentage is taken off instead, and where that billing reaches half of the threshold but not
    the whole of it and the rebate percentage is above zero, half of the rebate percentage is taken off
    instead. No transaction overage is added. Where the programme's booking transactions counted over
    the last month reach its included monthly allowance and its overage fee is above zero, the programme's
    overage fee per transaction is added instead, and where those transactions reach half of that allowance
    but not the whole of it and its overage fee is above zero, half of that overage fee is added instead.
    No lead-time loading is added. Where the booking was opened within seven days of the outbound departure
    and the fare brand carries an instalment plan, the short-notice loading is added instead, and where
    the booking was opened within thirty days of the outbound departure but not within seven and the fare
    brand carries an instalment plan, the near-term loading is added instead. No conversion markup is
    applied. Where the booking's fare lines were presented in a currency other than US dollars and the
    contracting company is registered outside the United States, the fare brand's own conversion markup
    is applied instead, and where the booking's fare lines were presented in a currency other than US
    dollars and the contracting company is registered in the United States, the domestic conversion markup
    is applied instead. The sum settled never falls below zero, and the result is rounded to the nearest
    cent.
  prerequisite: []
  cross_category:
  - category: biz
    as: branch
    reads:
    - variant_name
    - company_country
    - billing_frequency
    - contract_start_date
    - biz_billing_entries.amount_usd
    note: decides the tiers of the unit, billing-window, rebate, overage and markup factors, from the
      programme held and its billing ledger
  compute:
  - travellers_carried: F('passenger_count')
  - service_line_count: COUNT('air_booking_events', event_type='air_fare_charge', charge_category='agency_service_fee')
  - travellers_uncovered: MX(0, travellers_carried - service_line_count)
  - fare_channel: LATEST('air_booking_events','payment_channel', date_field='posted_date', event_type='air_fare_charge',
      charge_category='base_fare')
  - programme_online_fee: CPARAM('biz','online_booking_fee_usd')
  - programme_offline_fee: CPARAM('biz','offline_booking_fee_usd')
  - unit_fee: programme_online_fee if (F('corporate_program_id') != '' and fare_channel == 'corporate_portal')
      else (programme_offline_fee if (F('corporate_program_id') != '' and fare_channel != 'corporate_portal')
      else P('agency_service_fee_usd'))
  - gross_charge: unit_fee * travellers_uncovered
  - billing_frequency: CFIELD('biz','billing_frequency')
  - contract_months: MONTHS(CFIELD('biz','contract_start_date'), NOW)
  - programme_billing: XSUM('biz','biz_billing_entries','amount_usd', within_months=contract_months +
      1, date_field='posted_date') if (billing_frequency == 'annual' and contract_months >= K('settled_term_months'))
      else (XSUM('biz','biz_billing_entries','amount_usd', within_months=K('rolling_window_months'), date_field='posted_date')
      if (billing_frequency != 'annual' and contract_months >= K('settled_term_months')) else XSUM('biz','biz_billing_entries','amount_usd',
      within_months=K('current_period_months'), date_field='posted_date'))
  - rebate_threshold: CPARAM('biz','volume_rebate_threshold_usd')
  - rebate_rate: CPARAM('biz','volume_rebate_pct')
  - rebate_pct: rebate_rate if (programme_billing >= rebate_threshold and rebate_rate > 0) else ((rebate_rate
      * K('partial_share')) if (programme_billing >= rebate_threshold * K('partial_share') and rebate_rate
      > 0) else K('no_rebate_pct'))
  - rebated_charge: gross_charge * (1 - rebate_pct / 100)
  - programme_transactions: XSUM('biz','biz_billing_entries','transaction_count', within_months=K('current_period_months'),
      date_field='posted_date')
  - included_transactions: CPARAM('biz','included_transactions_per_month')
  - overage_fee: CPARAM('biz','overage_fee_per_transaction_usd')
  - overage_add: overage_fee if (programme_transactions >= included_transactions and overage_fee > 0)
      else ((overage_fee * K('partial_share')) if (programme_transactions >= included_transactions * K('partial_share')
      and overage_fee > 0) else K('no_addition'))
  - booking_lead_days: DAYS(F('booked_date'), F('departure_date'))
  - lead_loading: K('short_notice_loading') if (booking_lead_days <= K('short_notice_days') and P('payment_plan_available')
      == True) else (K('near_term_loading') if (booking_lead_days <= K('near_term_days') and P('payment_plan_available')
      == True) else K('no_addition'))
  - fare_currency: LATEST('air_booking_events','currency_charged', date_field='posted_date', event_type='air_fare_charge',
      charge_category='base_fare')
  - company_country: CFIELD('biz','company_country')
  - markup_pct: P('currency_conversion_markup_pct') if (fare_currency != 'USD' and company_country !=
      'US') else (K('domestic_markup_pct') if (fare_currency != 'USD' and company_country == 'US') else
      K('no_markup_pct'))
  - result: RND(MX(0.0, (rebated_charge + overage_add + lead_loading) * (1 + markup_pct / 100)), 2)
  compute_basis:
    travellers_carried: The agency service charge is owed once for every traveller the booking carries,
      and where the booking's lines cover fewer travellers than it carries the charge is owed for the
      travellers the lines do not yet cover.
    service_line_count: The agency service charge is owed once for every traveller the booking carries,
      and where the booking's lines cover fewer travellers than it carries the charge is owed for the
      travellers the lines do not yet cover.
    travellers_uncovered: The agency service charge is owed once for every traveller the booking carries,
      and where the booking's lines cover fewer travellers than it carries the charge is owed for the
      travellers the lines do not yet cover.
    fare_channel: Where a corporate programme reference stands on the booking and its fare lines were
      taken through the corporate portal, the unit is instead the programme's own online booking fee,
      and where a corporate programme reference stands on the booking and its fare lines were taken through
      any other channel, the unit is instead the programme's own offline booking fee.
    programme_online_fee: Where a corporate programme reference stands on the booking and its fare lines
      were taken through the corporate portal, the unit is instead the programme's own online booking
      fee, and where a corporate programme reference stands on the booking and its fare lines were taken
      through any other channel, the unit is instead the programme's own offline booking fee.
    programme_offline_fee: Where a corporate programme reference stands on the booking and its fare lines
      were taken through the corporate portal, the unit is instead the programme's own online booking
      fee, and where a corporate programme reference stands on the booking and its fare lines were taken
      through any other channel, the unit is instead the programme's own offline booking fee.
    unit_fee: Where a corporate programme reference stands on the booking and its fare lines were taken
      through the corporate portal, the unit is instead the programme's own online booking fee, and where
      a corporate programme reference stands on the booking and its fare lines were taken through any
      other channel, the unit is instead the programme's own offline booking fee.
    gross_charge: The unit and the travellers not yet covered are multiplied together into the gross charge;
      the volume rebate acts on that gross charge alone, the overage and lead-time additions are then
      added to the rebated figure, and the conversion markup acts last, on the sum of the rebated figure
      and those two additions.
    rebated_charge: The unit and the travellers not yet covered are multiplied together into the gross
      charge; the volume rebate acts on that gross charge alone, the overage and lead-time additions are
      then added to the rebated figure, and the conversion markup acts last, on the sum of the rebated
      figure and those two additions.
    billing_frequency: Where the programme is invoiced annually and its current contract term has run
      six months or more, that billing is read instead over the whole of the current contract term, and
      where the programme is invoiced monthly or quarterly and its current contract term has run six months
      or more, it is read instead over the last twelve months.
    contract_months: Where the programme is invoiced annually and its current contract term has run six
      months or more, that billing is read instead over the whole of the current contract term, and where
      the programme is invoiced monthly or quarterly and its current contract term has run six months
      or more, it is read instead over the last twelve months.
    programme_billing: Where the programme is invoiced annually and its current contract term has run
      six months or more, that billing is read instead over the whole of the current contract term, and
      where the programme is invoiced monthly or quarterly and its current contract term has run six months
      or more, it is read instead over the last twelve months.
    rebate_threshold: Where the programme's billing so read reaches its volume rebate threshold and its
      rebate percentage is above zero, the whole rebate percentage is taken off instead, and where that
      billing reaches half of the threshold but not the whole of it and the rebate percentage is above
      zero, half of the rebate percentage is taken off instead.
    rebate_rate: Where the programme's billing so read reaches its volume rebate threshold and its rebate
      percentage is above zero, the whole rebate percentage is taken off instead, and where that billing
      reaches half of the threshold but not the whole of it and the rebate percentage is above zero, half
      of the rebate percentage is taken off instead.
    rebate_pct: Where the programme's billing so read reaches its volume rebate threshold and its rebate
      percentage is above zero, the whole rebate percentage is taken off instead, and where that billing
      reaches half of the threshold but not the whole of it and the rebate percentage is above zero, half
      of the rebate percentage is taken off instead.
    programme_transactions: Where the programme's booking transactions counted over the last month reach
      its included monthly allowance and its overage fee is above zero, the programme's overage fee per
      transaction is added instead, and where those transactions reach half of that allowance but not
      the whole of it and its overage fee is above zero, half of that overage fee is added instead.
    included_transactions: Where the programme's booking transactions counted over the last month reach
      its included monthly allowance and its overage fee is above zero, the programme's overage fee per
      transaction is added instead, and where those transactions reach half of that allowance but not
      the whole of it and its overage fee is above zero, half of that overage fee is added instead.
    overage_fee: Where the programme's booking transactions counted over the last month reach its included
      monthly allowance and its overage fee is above zero, the programme's overage fee per transaction
      is added instead, and where those transactions reach half of that allowance but not the whole of
      it and its overage fee is above zero, half of that overage fee is added instead.
    overage_add: Where the programme's booking transactions counted over the last month reach its included
      monthly allowance and its overage fee is above zero, the programme's overage fee per transaction
      is added instead, and where those transactions reach half of that allowance but not the whole of
      it and its overage fee is above zero, half of that overage fee is added instead.
    booking_lead_days: Where the booking was opened within seven days of the outbound departure and the
      fare brand carries an instalment plan, the short-notice loading is added instead, and where the
      booking was opened within thirty days of the outbound departure but not within seven and the fare
      brand carries an instalment plan, the near-term loading is added instead.
    lead_loading: Where the booking was opened within seven days of the outbound departure and the fare
      brand carries an instalment plan, the short-notice loading is added instead, and where the booking
      was opened within thirty days of the outbound departure but not within seven and the fare brand
      carries an instalment plan, the near-term loading is added instead.
    fare_currency: Where the booking's fare lines were presented in a currency other than US dollars and
      the contracting company is registered outside the United States, the fare brand's own conversion
      markup is applied instead, and where the booking's fare lines were presented in a currency other
      than US dollars and the contracting company is registered in the United States, the domestic conversion
      markup is applied instead.
    company_country: Where the booking's fare lines were presented in a currency other than US dollars
      and the contracting company is registered outside the United States, the fare brand's own conversion
      markup is applied instead, and where the booking's fare lines were presented in a currency other
      than US dollars and the contracting company is registered in the United States, the domestic conversion
      markup is applied instead.
    markup_pct: Where the booking's fare lines were presented in a currency other than US dollars and
      the contracting company is registered outside the United States, the fare brand's own conversion
      markup is applied instead, and where the booking's fare lines were presented in a currency other
      than US dollars and the contracting company is registered in the United States, the domestic conversion
      markup is applied instead.
    result: The sum settled never falls below zero, and the result is rounded to the nearest cent.
  factors:
  - id: programme_fee_schedule
    effect: parameter
    decides: unit_fee
    bindings:
    - fare_channel
    - programme_online_fee
    - programme_offline_fee
    - unit_fee
    ladder:
    - when: a corporate programme reference stands on the booking and its fare lines were taken through
        the corporate portal
      value: the programme's own online booking fee
    - when: a corporate programme reference stands on the booking and its fare lines were taken through
        any other channel
      value: the programme's own offline booking fee
    - when: otherwise
      value: the fare brand's own agency service fee
    baseline:
      unit_fee: P('agency_service_fee_usd')
    evidence:
    - cross_category
    - history
    cross_difficulty: biz
  - id: programme_billing_window
    effect: method
    decides: programme_billing
    bindings:
    - billing_frequency
    - contract_months
    - programme_billing
    ladder:
    - when: the programme is invoiced annually and its current contract term has run six months or more
      method: the programme's billing is read over the whole of the current contract term
    - when: the programme is invoiced monthly or quarterly and its current contract term has run six months
        or more
      method: the programme's billing is read over the last twelve months
    - when: otherwise
      method: the programme's billing is read over the current billing period alone
    baseline:
      programme_billing: XSUM('biz','biz_billing_entries','amount_usd', within_months=K('current_period_months'),
        date_field='posted_date')
    evidence:
    - cross_category
    - date
    - history
    cross_difficulty: biz
  - id: programme_volume_rebate
    effect: parameter
    decides: rebate_pct
    bindings:
    - rebate_threshold
    - rebate_rate
    - rebate_pct
    ladder:
    - when: the programme's billing so read reaches its volume rebate threshold and its rebate percentage
        is above zero
      value: the programme's whole rebate percentage
    - when: the programme's billing so read reaches half of that threshold but not the whole of it and
        its rebate percentage is above zero
      value: K('partial_share') of the programme's rebate percentage
    - when: otherwise
      value: K('no_rebate_pct')
    baseline:
      rebate_pct: K('no_rebate_pct')
    evidence:
    - cross_category
    - history
    cross_difficulty: biz
  - id: programme_transaction_overage
    effect: parameter
    decides: overage_add
    bindings:
    - programme_transactions
    - included_transactions
    - overage_fee
    - overage_add
    ladder:
    - when: the programme's booking transactions counted over the last month reach its included monthly
        allowance and its overage fee is above zero
      value: the programme's overage fee per transaction
    - when: the programme's booking transactions counted over the last month reach half of that allowance
        but not the whole of it and its overage fee is above zero
      value: K('partial_share') of the programme's overage fee per transaction
    - when: otherwise
      value: K('no_addition')
    baseline:
      overage_add: K('no_addition')
    evidence:
    - cross_category
    - history
    cross_difficulty: biz
  - id: short_notice_loading
    effect: parameter
    decides: lead_loading
    bindings:
    - booking_lead_days
    - lead_loading
    ladder:
    - when: the booking was opened within seven days of the outbound departure and the fare brand carries
        an instalment plan
      value: K('short_notice_loading')
    - when: the booking was opened within thirty days of the outbound departure but not within seven and
        the fare brand carries an instalment plan
      value: K('near_term_loading')
    - when: otherwise
      value: K('no_addition')
    baseline:
      lead_loading: K('no_addition')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: settlement_currency_markup
    effect: parameter
    decides: markup_pct
    bindings:
    - fare_currency
    - company_country
    - markup_pct
    ladder:
    - when: the booking's fare lines were presented in a currency other than US dollars and the contracting
        company is registered outside the United States
      value: the fare brand's own conversion markup
    - when: the booking's fare lines were presented in a currency other than US dollars and the contracting
        company is registered in the United States
      value: K('domestic_markup_pct')
    - when: otherwise
      value: K('no_markup_pct')
    baseline:
      markup_pct: K('no_markup_pct')
    evidence:
    - history
    - cross_category
    cross_difficulty: biz
  baseline:
    rule: The agency service charge is owed once for every traveller the booking carries, and where the
      booking's lines cover fewer travellers than it carries the charge is owed for the travellers the
      lines do not yet cover. A booking that stands as an uncollected hold carries that charge for as
      long as the hold stands, and it is not ticketed while any part of the collection is still outstanding.
      The unit the charge is taken at is the fare brand's own agency service fee. The unit and the travellers
      not yet covered are multiplied together into the gross charge; the volume rebate acts on that gross
      charge alone, the overage and lead-time additions are then added to the rebated figure, and the
      conversion markup acts last, on the sum of the rebated figure and those two additions. The programme's
      billing is read over the current billing period alone. No volume rebate is taken off the gross charge.
      No transaction overage is added. No lead-time loading is added. No conversion markup is applied.
      The sum settled never falls below zero, and the result is rounded to the nearest cent.
    params:
    - agency_service_fee_usd
    - current_period_months
    - no_rebate_pct
    - no_addition
    - no_markup_pct
  inputs:
    history:
    - table: air_booking_events
      aggregate: count
      field: air_event_id
      filters:
        event_type: air_fare_charge
        charge_category: agency_service_fee
    - table: air_booking_events
      aggregate: latest
      field: payment_channel
      filters:
        event_type: air_fare_charge
        charge_category: base_fare
    - category: biz
      table: biz_billing_entries
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters: {}
    - category: biz
      table: biz_billing_entries
      aggregate: sum
      field: transaction_count
      within_months: 1
      filters: {}
    cross_category:
    - biz
- id: air_ext_cabin_upgrade_copay
  base_policy_refs:
  - air_baggage_fee
  - air_seat_and_cabin_extras
  - air_club_benefit_interaction
  - air_biz_exclusion
  overwrite:
  - base_policy: air_seat_and_cabin_extras
    superseded_clause: An upgrade into a higher cabin is sold only on a brand that allows it, at the brand's
      co-payment per traveller per segment, and never converts the booking to the higher cabin's brand
      terms.
    replaced_by: The brand's co-payment, the travellers counted and the segments the move is taken over
      are multiplied together into the gross co-payment; the programme discount acts on that gross figure,
      the lead-time share acts on the result of that step, the credit for extras already bought is taken
      off the result of that second step, the approval share acts on what is left, and the traveller's
      own share acts last.
  - base_policy: air_baggage_fee
    superseded_clause: A bag line already charged is refunded in full when the traveller cancels the whole
      itinerary inside the void window, and is otherwise refunded only where the flight itself did not
      operate.
    replaced_by: Where checked-bag lines stand on the booking and the fare brand includes two checked
      bags or more, the whole of those lines is credited instead, and where checked-bag lines stand on
      the booking and the fare brand includes fewer than two checked bags, half of them is credited instead.
  - base_policy: air_biz_exclusion
    superseded_clause: none of the consumer concessions in this charter apply to it
    replaced_by: Where the outbound departs more than thirty days from today and the fare brand releases
      its seat map before departure, the early share is carried forward instead, and where the outbound
      departs more than seven days from today but not more than thirty and the fare brand releases its
      seat map before departure, the standard share is carried forward instead.
  trigger: on_request
  subject:
  - air_ancillary_charge
  computes: upgrade_copay_usd
  target_tool: charge_cabin_upgrade_d9ccb8ec
  params:
    one_segment: 1
    both_directions: 2
    no_discount_pct: 0.0
    early_share: 0.9
    standard_share: 1.0
    late_share: 1.15
    early_days: 30
    standard_days: 7
    credit_none: 0.0
    credit_half: 0.5
    credit_full: 1.0
    approved_share: 1.0
    single_approval_share: 0.95
    unapproved_share: 0.85
    traveller_share_long: 0.75
    traveller_share_short: 0.9
    traveller_share_whole: 1.0
    long_terms_days: 30
  rule: A move into a higher cabin is sold only on a fare brand that allows it, at that brand's co-payment
    for each traveller counted into the move and for each segment the move is taken over, and the booking
    is never converted to the higher cabin's own brand terms. The co-payment for moving into a higher
    cabin is worked out only after the booking's lines carry the agency service charge owed for every
    traveller the booking carries, and until that charge is complete only the travellers whose places
    the standing lines already cover are counted into the move. Those lines carry that charge for every
    traveller the booking carries only where they come to at least the fare brand's own agency service
    fee taken once for each of them; short of that they carry it for as many travellers as there are such
    lines. The move is taken over one segment. Where a return date stands on the booking and its fare
    lines run to more than one segment, the move is taken over instead as every segment the fare lines
    run to, and where a return date stands on the booking and its fare lines run to a single segment,
    the move is taken over instead as the two directions of the journey. The brand's co-payment, the travellers
    counted and the segments the move is taken over are multiplied together into the gross co-payment;
    the programme discount acts on that gross figure, the lead-time share acts on the result of that step,
    the credit for extras already bought is taken off the result of that second step, the approval share
    acts on what is left, and the traveller's own share acts last. No programme discount is taken off
    the gross co-payment. Where a corporate programme reference stands on the booking and the fare brand
    is eligible for a corporate discount, the programme's negotiated air discount is taken off instead,
    and where a corporate programme reference stands on the booking and the fare brand is not eligible
    for a corporate discount, nothing is taken off because the programme's negotiated terms do not reach
    that brand. The late share of that figure is carried forward. Where the outbound departs more than
    thirty days from today and the fare brand releases its seat map before departure, the early share
    is carried forward instead, and where the outbound departs more than seven days from today but not
    more than thirty and the fare brand releases its seat map before departure, the standard share is
    carried forward instead. No credit is given for optional extras already bought. Where checked-bag
    lines stand on the booking and the fare brand includes two checked bags or more, the whole of those
    lines is credited instead, and where checked-bag lines stand on the booking and the fare brand includes
    fewer than two checked bags, half of them is credited instead. The unapproved share of what is left
    is carried forward. Where the programme carries two or more approval levels and its billing balance
    stands below its credit limit, the whole of it is carried forward instead, and where the programme
    carries one approval level and no more, and its billing balance stands below its credit limit, the
    single-approval share of it is carried forward instead. The whole of the figure is collected from
    the traveller. Where a corporate programme reference stands on the booking and the programme's payment
    terms run thirty days or more, only the long-terms traveller share is collected from the traveller
    instead, and where a corporate programme reference stands on the booking and the programme's payment
    terms run fewer than thirty days, only the short-terms traveller share is collected from the traveller
    instead. The co-payment collected never falls below zero, and the result is rounded to the nearest
    cent.
  prerequisite:
  - problem: air_ext_outstanding_service_charge
    kind: value_input
    gate: covered_travellers
    form: state
    policy_source: The co-payment for moving into a higher cabin is worked out only after the booking's
      lines carry the agency service charge owed for every traveller the booking carries, and until that
      charge is complete only the travellers whose places the standing lines already cover are counted
      into the move.
    condition: the agency service lines standing on the booking come to at least the fare brand's own
      agency service fee taken once for every traveller the booking carries, at the moment the co-payment
      is worked out
    resolved_by: settle_agency_service_charge_b626effa
    effect: the travellers counted into the move rise from the travellers the standing service lines already
      cover to every traveller the booking carries, which is the figure the brand's co-payment is multiplied
      by
  cross_category:
  - category: biz
    as: branch
    reads:
    - variant_name
    - billing_balance_usd
    note: decides the tiers of the programme discount, approval and settlement factors, from the programme
      held and its billing balance
  compute:
  - travellers_carried: F('passenger_count')
  - service_lines: SUM('air_booking_events','amount_usd', event_type='air_fare_charge', charge_category='agency_service_fee')
  - service_line_count: COUNT('air_booking_events', event_type='air_fare_charge', charge_category='agency_service_fee')
  - covered_travellers: travellers_carried if (service_lines >= P('agency_service_fee_usd') * travellers_carried)
      else service_line_count
  - brand_copay: P('upgrade_copay_usd')
  - fare_segments: MAX('air_booking_events','segment_sequence', event_type='air_fare_charge')
  - segments_moved: fare_segments if (F('return_date') != '' and fare_segments > 1) else (K('both_directions')
      if (F('return_date') != '' and fare_segments <= 1) else K('one_segment'))
  - gross_copay: brand_copay * covered_travellers * segments_moved
  - programme_air_discount: CPARAM('biz','negotiated_air_discount_pct')
  - discount_pct: programme_air_discount if (F('corporate_program_id') != '' and P('corporate_discount_eligible')
      == True) else (K('no_discount_pct') if (F('corporate_program_id') != '' and P('corporate_discount_eligible')
      == False) else K('no_discount_pct'))
  - discounted_copay: gross_copay * (1 - discount_pct / 100)
  - days_to_departure: DAYS(NOW, F('departure_date'))
  - lead_share: K('early_share') if (days_to_departure > K('early_days') and P('seat_map_release_hours_before_departure')
      > 0) else (K('standard_share') if (days_to_departure > K('standard_days') and P('seat_map_release_hours_before_departure')
      > 0) else K('late_share'))
  - bag_lines: SUM('air_booking_events','amount_usd', event_type='air_ancillary_charge', charge_category='checked_bag')
  - bag_line_count: COUNT('air_booking_events', event_type='air_ancillary_charge', charge_category='checked_bag')
  - extras_credit: (bag_lines * K('credit_full')) if (bag_line_count >= 1 and P('checked_bag_allowance_count')
      >= 2) else ((bag_lines * K('credit_half')) if (bag_line_count >= 1 and P('checked_bag_allowance_count')
      < 2) else (bag_lines * K('credit_none')))
  - after_extras: discounted_copay * lead_share - extras_credit
  - approval_levels: CPARAM('biz','approval_workflow_levels')
  - credit_limit: CPARAM('biz','credit_limit_usd')
  - billing_balance: CFIELD('biz','billing_balance_usd')
  - approval_share: K('approved_share') if (approval_levels >= 2 and billing_balance < credit_limit) else
      (K('single_approval_share') if (approval_levels >= 1 and billing_balance < credit_limit) else K('unapproved_share'))
  - payment_terms: CPARAM('biz','payment_terms_days')
  - traveller_share: K('traveller_share_long') if (F('corporate_program_id') != '' and payment_terms >=
      K('long_terms_days')) else (K('traveller_share_short') if (F('corporate_program_id') != '' and payment_terms
      < K('long_terms_days')) else K('traveller_share_whole'))
  - result: RND(MX(0.0, after_extras * approval_share * traveller_share), 2)
  compute_basis:
    travellers_carried: Those lines carry that charge for every traveller the booking carries only where
      they come to at least the fare brand's own agency service fee taken once for each of them; short
      of that they carry it for as many travellers as there are such lines.
    brand_copay: A move into a higher cabin is sold only on a fare brand that allows it, at that brand's
      co-payment for each traveller counted into the move and for each segment the move is taken over,
      and the booking is never converted to the higher cabin's own brand terms.
    service_lines: Those lines carry that charge for every traveller the booking carries only where they
      come to at least the fare brand's own agency service fee taken once for each of them; short of that
      they carry it for as many travellers as there are such lines.
    service_line_count: Those lines carry that charge for every traveller the booking carries only where
      they come to at least the fare brand's own agency service fee taken once for each of them; short
      of that they carry it for as many travellers as there are such lines.
    covered_travellers: Those lines carry that charge for every traveller the booking carries only where
      they come to at least the fare brand's own agency service fee taken once for each of them; short
      of that they carry it for as many travellers as there are such lines.
    fare_segments: Where a return date stands on the booking and its fare lines run to more than one segment,
      the move is taken over instead as every segment the fare lines run to, and where a return date stands
      on the booking and its fare lines run to a single segment, the move is taken over instead as the
      two directions of the journey.
    segments_moved: Where a return date stands on the booking and its fare lines run to more than one
      segment, the move is taken over instead as every segment the fare lines run to, and where a return
      date stands on the booking and its fare lines run to a single segment, the move is taken over instead
      as the two directions of the journey.
    gross_copay: The brand's co-payment, the travellers counted and the segments the move is taken over
      are multiplied together into the gross co-payment; the programme discount acts on that gross figure,
      the lead-time share acts on the result of that step, the credit for extras already bought is taken
      off the result of that second step, the approval share acts on what is left, and the traveller's
      own share acts last.
    discounted_copay: The brand's co-payment, the travellers counted and the segments the move is taken
      over are multiplied together into the gross co-payment; the programme discount acts on that gross
      figure, the lead-time share acts on the result of that step, the credit for extras already bought
      is taken off the result of that second step, the approval share acts on what is left, and the traveller's
      own share acts last.
    after_extras: The brand's co-payment, the travellers counted and the segments the move is taken over
      are multiplied together into the gross co-payment; the programme discount acts on that gross figure,
      the lead-time share acts on the result of that step, the credit for extras already bought is taken
      off the result of that second step, the approval share acts on what is left, and the traveller's
      own share acts last.
    programme_air_discount: Where a corporate programme reference stands on the booking and the fare brand
      is eligible for a corporate discount, the programme's negotiated air discount is taken off instead,
      and where a corporate programme reference stands on the booking and the fare brand is not eligible
      for a corporate discount, nothing is taken off because the programme's negotiated terms do not reach
      that brand.
    discount_pct: Where a corporate programme reference stands on the booking and the fare brand is eligible
      for a corporate discount, the programme's negotiated air discount is taken off instead, and where
      a corporate programme reference stands on the booking and the fare brand is not eligible for a corporate
      discount, nothing is taken off because the programme's negotiated terms do not reach that brand.
    days_to_departure: Where the outbound departs more than thirty days from today and the fare brand
      releases its seat map before departure, the early share is carried forward instead, and where the
      outbound departs more than seven days from today but not more than thirty and the fare brand releases
      its seat map before departure, the standard share is carried forward instead.
    lead_share: Where the outbound departs more than thirty days from today and the fare brand releases
      its seat map before departure, the early share is carried forward instead, and where the outbound
      departs more than seven days from today but not more than thirty and the fare brand releases its
      seat map before departure, the standard share is carried forward instead.
    bag_lines: Where checked-bag lines stand on the booking and the fare brand includes two checked bags
      or more, the whole of those lines is credited instead, and where checked-bag lines stand on the
      booking and the fare brand includes fewer than two checked bags, half of them is credited instead.
    bag_line_count: Where checked-bag lines stand on the booking and the fare brand includes two checked
      bags or more, the whole of those lines is credited instead, and where checked-bag lines stand on
      the booking and the fare brand includes fewer than two checked bags, half of them is credited instead.
    extras_credit: Where checked-bag lines stand on the booking and the fare brand includes two checked
      bags or more, the whole of those lines is credited instead, and where checked-bag lines stand on
      the booking and the fare brand includes fewer than two checked bags, half of them is credited instead.
    approval_levels: Where the programme carries two or more approval levels and its billing balance stands
      below its credit limit, the whole of it is carried forward instead, and where the programme carries
      one approval level and no more, and its billing balance stands below its credit limit, the single-approval
      share of it is carried forward instead.
    credit_limit: Where the programme carries two or more approval levels and its billing balance stands
      below its credit limit, the whole of it is carried forward instead, and where the programme carries
      one approval level and no more, and its billing balance stands below its credit limit, the single-approval
      share of it is carried forward instead.
    billing_balance: Where the programme carries two or more approval levels and its billing balance stands
      below its credit limit, the whole of it is carried forward instead, and where the programme carries
      one approval level and no more, and its billing balance stands below its credit limit, the single-approval
      share of it is carried forward instead.
    approval_share: Where the programme carries two or more approval levels and its billing balance stands
      below its credit limit, the whole of it is carried forward instead, and where the programme carries
      one approval level and no more, and its billing balance stands below its credit limit, the single-approval
      share of it is carried forward instead.
    payment_terms: Where a corporate programme reference stands on the booking and the programme's payment
      terms run thirty days or more, only the long-terms traveller share is collected from the traveller
      instead, and where a corporate programme reference stands on the booking and the programme's payment
      terms run fewer than thirty days, only the short-terms traveller share is collected from the traveller
      instead.
    traveller_share: Where a corporate programme reference stands on the booking and the programme's payment
      terms run thirty days or more, only the long-terms traveller share is collected from the traveller
      instead, and where a corporate programme reference stands on the booking and the programme's payment
      terms run fewer than thirty days, only the short-terms traveller share is collected from the traveller
      instead.
    result: The co-payment collected never falls below zero, and the result is rounded to the nearest
      cent.
  factors:
  - id: segments_moved_measure
    effect: method
    decides: segments_moved
    bindings:
    - fare_segments
    - segments_moved
    ladder:
    - when: a return date stands on the booking and its fare lines run to more than one segment
      method: the move is taken over every segment the fare lines run to
    - when: a return date stands on the booking and its fare lines run to a single segment
      method: the move is taken over the two directions of the journey
    - when: otherwise
      method: the move is taken over one segment
    baseline:
      segments_moved: K('one_segment')
    evidence:
    - history
    cross_difficulty: null
  - id: programme_air_discount_rate
    effect: parameter
    decides: discount_pct
    bindings:
    - programme_air_discount
    - discount_pct
    ladder:
    - when: a corporate programme reference stands on the booking and the fare brand is eligible for a
        corporate discount
      value: the programme's negotiated air discount
    - when: a corporate programme reference stands on the booking and the fare brand is not eligible for
        a corporate discount
      value: K('no_discount_pct')
    - when: otherwise
      value: K('no_discount_pct')
    baseline:
      discount_pct: K('no_discount_pct')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: biz
  - id: upgrade_lead_time_share
    effect: parameter
    decides: lead_share
    bindings:
    - days_to_departure
    - lead_share
    ladder:
    - when: the outbound departs more than thirty days from today and the fare brand releases its seat
        map before departure
      value: K('early_share')
    - when: the outbound departs more than seven days from today but not more than thirty and the fare
        brand releases its seat map before departure
      value: K('standard_share')
    - when: otherwise
      value: K('late_share')
    baseline:
      lead_share: K('late_share')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: bought_extras_credit
    effect: parameter
    decides: extras_credit
    bindings:
    - bag_lines
    - bag_line_count
    - extras_credit
    ladder:
    - when: checked-bag lines stand on the booking and the fare brand includes two checked bags or more
      value: K('credit_full') of those lines
    - when: checked-bag lines stand on the booking and the fare brand includes fewer than two checked
        bags
      value: K('credit_half') of those lines
    - when: otherwise
      value: K('credit_none')
    baseline:
      extras_credit: (bag_lines * K('credit_none'))
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: programme_approval_share
    effect: parameter
    decides: approval_share
    bindings:
    - approval_levels
    - credit_limit
    - billing_balance
    - approval_share
    ladder:
    - when: the programme carries two or more approval levels and its billing balance stands below its
        credit limit
      value: K('approved_share')
    - when: the programme carries one approval level and no more, and its billing balance stands below
        its credit limit
      value: K('single_approval_share')
    - when: otherwise
      value: K('unapproved_share')
    baseline:
      approval_share: K('unapproved_share')
    evidence:
    - cross_category
    cross_difficulty: biz
  - id: programme_settlement_share
    effect: parameter
    decides: traveller_share
    bindings:
    - payment_terms
    - traveller_share
    ladder:
    - when: a corporate programme reference stands on the booking and the programme's payment terms run
        thirty days or more
      value: K('traveller_share_long')
    - when: a corporate programme reference stands on the booking and the programme's payment terms run
        fewer than thirty days
      value: K('traveller_share_short')
    - when: otherwise
      value: K('traveller_share_whole')
    baseline:
      traveller_share: K('traveller_share_whole')
    evidence:
    - cross_category
    cross_difficulty: biz
  baseline:
    rule: A move into a higher cabin is sold only on a fare brand that allows it, at that brand's co-payment
      for each traveller counted into the move and for each segment the move is taken over, and the booking
      is never converted to the higher cabin's own brand terms. The move is taken over one segment. The
      brand's co-payment, the travellers counted and the segments the move is taken over are multiplied
      together into the gross co-payment; the programme discount acts on that gross figure, the lead-time
      share acts on the result of that step, the credit for extras already bought is taken off the result
      of that second step, the approval share acts on what is left, and the traveller's own share acts
      last. No programme discount is taken off the gross co-payment. The late share of that figure is
      carried forward. No credit is given for optional extras already bought. The unapproved share of
      what is left is carried forward. The whole of the figure is collected from the traveller. The co-payment
      collected never falls below zero, and the result is rounded to the nearest cent.
    params:
    - upgrade_copay_usd
    - one_segment
    - no_discount_pct
    - late_share
    - credit_none
    - unapproved_share
    - traveller_share_whole
  inputs:
    history:
    - table: air_booking_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: air_fare_charge
        charge_category: agency_service_fee
    - table: air_booking_events
      aggregate: max
      field: segment_sequence
      filters:
        event_type: air_fare_charge
    - table: air_booking_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: air_ancillary_charge
        charge_category: checked_bag
    cross_category:
    - biz
