- id: air_baggage_fee
  subject:
  - air_ancillary_charge
  rule: 'Checked baggage is charged bag by bag and traveller by traveller: the bags included in the fare
    brand are free, and each bag beyond the allowance is charged at the brand''s first-bag or second-bag
    rate by its position in that traveller''s own sequence. An optional extra is sold only while the booking
    record stands at held or ticketed. A bag over the weight allowance carries the brand''s overweight
    charge and a bag over the size allowance carries its oversize charge; where a single bag is both,
    the two are added rather than the larger taken. Bags bought before the day of departure are charged
    at the rates in this charter; bags presented at the airport are the airline''s own affair and are
    never charged here. A bag line already charged is refunded in full when the traveller cancels the
    whole itinerary inside the void window, and is otherwise refunded only where the flight itself did
    not operate.'
