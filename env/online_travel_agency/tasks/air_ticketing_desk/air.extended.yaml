- id: air_ext_unflown_tax_return
  base_policy_refs:
  - air_refund_settlement
  - air_price_drop_guarantee
  - air_club_benefit_interaction
  overwrite:
  - base_policy: air_refund_settlement
    superseded_clause: Each payout line is raised against the original fare line it reverses, so a booking
      with several fare lines settles as several payout lines and never as one lump sum.
    replaced_by: A return of the carrier-imposed taxes on an unflown ticket is raised as a single line
      covering the whole booking, so that one movement settles every tax line the booking carries.
  - base_policy: air_refund_settlement
    superseded_clause: 'A lodged claim settles in the form the fare brand prescribes and in no other form:
      money to the card, or value on a voucher, never both and never a mixture.'
    replaced_by: That return of taxes to the form of payment used stands alongside whatever the fare brand
      returns on its own terms, whether money or value on a voucher, because the taxes are the airline's
      to give back and the brand's terms reach only the fare.
  - base_policy: air_club_benefit_interaction
    superseded_clause: the fare brand's own rates apply to everything the club does not cover
    replaced_by: Where the traveller's club tier waives the agency service fee and the membership has
      posted three or more qualifying accruals over the last twelve months, no handling charge is kept
      instead
  - base_policy: air_club_benefit_interaction
    superseded_clause: 'A club benefit and a fare-brand inclusion never stack into a payment to the traveller:
      a bag already included in the brand is simply free, and the club benefit is not converted into value.'
    replaced_by: and where the traveller's club tier does not waive the agency service fee and the membership
      has posted three or more qualifying accruals over the last twelve months, the member handling charge
      is kept instead
  trigger: state_due
  subject:
  - air_refund_payout
  computes: payout_amount_usd
  target_tool: return_unflown_taxes_e343d675
  params:
    full_share: 1.0
    aged_share: 0.85
    open_share: 0.5
    recent_cancel_days: 90
    unflown_direction_share: 0.5
    whole_trip_share: 1.0
    heavy_recovery_threshold_usd: 400.0
    heavily_insured_share: 0.7
    insured_share: 0.8
    uninsured_share: 1.0
    handling_waived: 0.0
    handling_member: 12.0
    handling_standard: 25.0
    member_accrual_count: 3
    change_window_months: 12
  rule: Where a ticket has fallen away unflown, the carrier-imposed taxes and fees the airline itself
    returns are paid back to the form of payment the traveller used, while the agency service fee is never
    paid back under this rule because the service it paid for has already been performed. A return of
    the carrier-imposed taxes on an unflown ticket is raised as a single line covering the whole booking,
    so that one movement settles every tax line the booking carries. That return of taxes to the form
    of payment used stands alongside whatever the fare brand returns on its own terms, whether money or
    value on a voucher, because the taxes are the airline's to give back and the brand's terms reach only
    the fare. The taxes in question are taken from the most recent tax line standing on the booking, multiplied
    by the travellers ticketed. Where the booking carries as many tax lines as travellers ticketed and
    at least one voluntary change line was posted to it in the last twelve months, the taxes are taken
    instead as the sum of every tax line standing on the booking, and where the booking carries more tax
    lines than travellers ticketed and at least one voluntary change line was posted to it in that period,
    the taxes are taken instead from the largest single tax line standing on it, multiplied by the travellers
    ticketed. The open share of that figure is returned. Where the booking stands cancelled and its cancellation
    was confirmed within the last ninety days, the full share is returned instead, and where the booking
    stands cancelled and its cancellation was confirmed more than ninety days ago, the aged share is returned
    instead. The whole of the trip's taxes are in scope. Where a return date stands on the booking and
    the outbound departure date has already passed, only the unflown-direction share of them is in scope
    instead, and where a return date stands on the booking and the outbound departure date has not yet
    passed, the whole of them stays in scope. Nothing is set against what a traveller's own protection
    cover has already met. Where protection cover bought against this booking is on file and it has settled
    the heavy-recovery threshold or more in claims over the last twelve months, the heavily insured share
    of the figure is returned instead, and where such cover is on file and it has settled less than that
    threshold in claims over that period, the insured share of the figure is returned instead. What the
    cover has settled is read as the sums actually paid out on claims, never as the sums claimed and never
    as the claims the insurer declined. The taxes in question, the share returned, the share in scope
    and the insured share are multiplied together in that order, and the handling charge is taken off
    the product of those four and never off any earlier step. The standard handling charge is kept from
    the sum returned. Where the traveller's club tier waives the agency service fee and the membership
    has posted three or more qualifying accruals over the last twelve months, no handling charge is kept
    instead, and where the traveller's club tier does not waive the agency service fee and the membership
    has posted three or more qualifying accruals over the last twelve months, the member handling charge
    is kept instead. The sum returned never falls below zero, and the result is rounded to the nearest
    cent.
  prerequisite: []
  cross_category:
  - category: club
    as: history
    reads:
    - variant_name
    - club_points_entries.points_delta
    note: decides the tier of the handling-charge factor, from the membership's fee-waiver entitlement
      and its qualifying accrual ledger
  - category: care
    as: history
    reads:
    - benefit_used_usd
    - care_claims.paid_amount_usd
    note: decides the tier of the insured-share factor, from the cover bought against this booking and
      what it has actually settled
  compute:
  - travellers_ticketed: F('passenger_count')
  - tax_line_count: COUNT('air_booking_events', event_type='air_fare_charge', charge_category='taxes_and_carrier_fees')
  - change_line_count: COUNT('air_booking_events', within_months=K('change_window_months'), date_field='posted_date',
      event_type='air_change_fee_charge', reason_code='voluntary_change')
  - tax_sum: SUM('air_booking_events','amount_usd', event_type='air_fare_charge', charge_category='taxes_and_carrier_fees')
  - tax_largest: MAX('air_booking_events','amount_usd', event_type='air_fare_charge', charge_category='taxes_and_carrier_fees')
  - tax_latest: LATEST('air_booking_events','amount_usd', date_field='posted_date', event_type='air_fare_charge',
      charge_category='taxes_and_carrier_fees')
  - tax_basis: (tax_largest * travellers_ticketed) if (tax_line_count > travellers_ticketed and change_line_count
      >= 1) else (tax_sum if (tax_line_count == travellers_ticketed and change_line_count >= 1) else (tax_latest
      * travellers_ticketed))
  - cancel_days: DAYS(F('cancelled_at'), NOW)
  - open_share: K('full_share') if (F('status') == 'cancelled' and cancel_days <= K('recent_cancel_days'))
      else (K('aged_share') if (F('status') == 'cancelled' and cancel_days > K('recent_cancel_days'))
      else K('open_share'))
  - days_since_departure: DAYS(F('departure_date'), NOW)
  - direction_share: K('unflown_direction_share') if (F('return_date') != '' and days_since_departure
      > 0) else (K('whole_trip_share') if (F('return_date') != '' and days_since_departure <= 0) else
      K('whole_trip_share'))
  - cover_benefit_used: CFIELD('care','benefit_used_usd', linked_air_booking_id=HID)
  - cover_claims_paid: XSUM('care','care_claims','paid_amount_usd', within_months=12, date_field='filed_date',
      claim_status='paid')
  - cover_share: K('heavily_insured_share') if (cover_benefit_used != None and cover_claims_paid >= K('heavy_recovery_threshold_usd'))
      else (K('insured_share') if (cover_benefit_used != None and cover_claims_paid < K('heavy_recovery_threshold_usd'))
      else K('uninsured_share'))
  - member_fee_waiver: CPARAM('club','agency_service_fee_waiver')
  - member_accruals: XCOUNT('club','club_points_entries', within_months=12, date_field='posted_date',
      points_kind='qualifying')
  - handling_charge: K('handling_waived') if (member_fee_waiver == True and member_accruals >= K('member_accrual_count'))
      else (K('handling_member') if (member_fee_waiver == False and member_accruals >= K('member_accrual_count'))
      else K('handling_standard'))
  - result: RND(MX(0.0, tax_basis * open_share * direction_share * cover_share - handling_charge), 2)
  compute_basis:
    travellers_ticketed: The taxes in question are taken from the most recent tax line standing on the
