category: drive
display_name: Car Rental Rate Classes
binding:
  holding_table: drive_rentals
  event_tables:
  - drive_rental_entries
  intake_tables:
  - drive_damage_reviews
  status_field: status
  variant_field: variant_name
  quantity_fields:
    charges_total_usd: rental_charges
    mileage_allowance_remaining: mileage_allowance
lifecycle:
  states:
  - booked
  - confirmed
  - picked_up
  - returned
  - cancelled
  - no_show
  - closed
  transitions:
  - from: booked
    to: confirmed
    by: system
    means: The supplier accepts the booking and holds a vehicle for collection.
  - from: booked
    to: cancelled
    by: agent
    means: An unconfirmed booking is released before any money changes hands.
  - from: confirmed
    to: picked_up
    by: system
    means: The renter collects the vehicle and the agreement begins.
  - from: confirmed
    to: cancelled
    by: user
    means: The renter confirms cancellation of their own rental.
  - from: confirmed
    to: no_show
    by: system
    means: The renter never collects and the supplier releases the vehicle.
  - from: picked_up
    to: returned
    by: system
    means: The renter returns the vehicle and the agreement is closed off.
  - from: returned
    to: closed
    by: system
    means: The settled rental is archived once the damage reporting window has run out.
  - from: cancelled
    to: closed
    by: system
    means: The cancelled rental is archived once any charge and refund have settled.
  - from: no_show
    to: closed
    by: system
    means: The no-show is archived once the charge has settled.
accounts:
- key: rental_charges
  unit: USD
  meaning: 'Net money charged to the renter for this rental: rental days, prepayments, optional items, statutory charges, fuel, recharges and penalties credit the account, and payouts to the original form
    of payment debit it.'
- key: mileage_allowance
  unit: miles
  meaning: 'Included mileage still unused on this rental: the grant at collection credits the account and the miles actually driven debit it; a negative balance is the excess mileage charged for.'
parameter_schema:
  agency_service_fee_usd: Agency booking service fee charged once per rental, in USD.
  prepayment_required: Whether the whole rental is taken at booking rather than at the counter.
  prepayment_pct: Percentage of the rental total taken at booking.
  base_day_rate_usd: Published daily rate for an intermediate vehicle on this rate class, in USD.
  weekly_rate_usd: Published weekly rate for an intermediate vehicle on this rate class, in USD.
  weekend_rate_usd: Published daily rate on Saturday and Sunday for an intermediate vehicle, in USD.
  extra_day_rate_usd: Rate charged for a day kept beyond the booked return, in USD.
  extra_hour_fee_usd: Charge per hour kept beyond the grace period, in USD.
  grace_period_minutes: Minutes past the booked return time before a late charge begins.
  min_rental_days: Minimum number of days the rate class may be booked for.
  max_rental_days: Maximum number of days the rate class may be booked for.
  min_driver_age: Youngest main driver the rate class accepts, in whole years.
  max_driver_age: Oldest main driver the rate class accepts, in whole years.
  young_driver_age_limit: Age below which the young driver fee applies, in whole years.
  young_driver_fee_per_day_usd: Charge per rental day for a main driver below the young driver age, in USD.
  senior_driver_fee_per_day_usd: Charge per rental day for a main driver aged seventy or over, in USD.
  additional_driver_included_count: Additional drivers carried free of charge on the agreement.
  additional_driver_fee_per_day_usd: Charge per rental day for each additional driver beyond the free count, in USD.
  included_mileage_per_day: Miles included in the rate for each rental day; 0 where mileage is unlimited.
  unlimited_mileage: Whether the rate class carries unlimited mileage.
  excess_mileage_fee_per_mile_usd: Charge for each mile driven beyond the included allowance, in USD.
  one_way_fee_usd: Charge for returning the vehicle to a branch other than the collection branch, in USD.
  cross_border_allowed: Whether the vehicle may be taken across an international border.
  cross_border_fee_usd: Charge for taking the vehicle across an international border, in USD.
  airport_surcharge_pct: Surcharge applied to the rental total when collection is at an airport branch, as a percentage.
  vehicle_licence_fee_per_day_usd: Vehicle licensing recovery fee charged per rental day, in USD.
  sales_tax_pct: Sales tax applied to the rental total, as a percentage.
  collision_damage_waiver_included: Whether the collision damage waiver is included in the rate.
  cdw_fee_per_day_usd: Charge per rental day for the collision damage waiver when it is not included, in USD.
  cdw_excess_usd: Amount the renter still bears on a damage claim after the waiver, in USD.
  theft_protection_included: Whether theft protection is included in the rate.
  theft_protection_fee_per_day_usd: Charge per rental day for theft protection when it is not included, in USD.
  third_party_liability_limit_usd: Third party liability cover carried by the rate class, in USD.
  personal_accident_fee_per_day_usd: Charge per rental day for personal accident cover, in USD.
  roadside_assistance_included: Whether roadside assistance is included in the rate.
  roadside_assistance_fee_per_day_usd: Charge per rental day for roadside assistance when it is not included, in USD.
  gps_fee_per_day_usd: Charge per rental day for a satellite navigation unit, in USD.
  child_seat_fee_per_day_usd: Charge per rental day for each child seat, in USD.
  snow_chains_fee_per_rental_usd: Charge for snow chains for the whole rental, in USD.
  ski_rack_fee_per_rental_usd: Charge for a ski rack for the whole rental, in USD.
  fuel_policy: 'Fuel arrangement the rate class applies: full_to_full, prepaid or same_to_same.'
  prepaid_fuel_price_per_gallon_usd: Price per gallon where fuel is bought in advance from the supplier, in USD.
  refuelling_service_fee_usd: Service charge added when the supplier has to refuel the vehicle, in USD.
  free_cancellation_hours_before_pickup: Hours before collection by which a cancellation carries no charge.
  cancellation_fee_usd: Flat charge for a cancellation outside the free window, in USD.
  cancellation_ladder_pct: Cancellation charge as a share of the rental total by how far ahead of collection the cancellation lands; a ladder keyed by days before collection.
  no_show_fee_usd: Charge when the renter never collects the vehicle, in USD.
  modification_fee_usd: Charge to move the collection or return time or branch, in USD.
  max_modifications: Maximum number of modifications permitted on one rental.
  deposit_hold_usd: Amount held on the renter's card at collection and released at return, in USD.
  damage_report_window_days: Calendar days after return within which the supplier may report new damage.
  damage_admin_fee_usd: Administration charge added to a damage settlement, in USD.
  toll_admin_fee_per_toll_usd: Administration charge added to each toll recharged to the renter, in USD.
  traffic_fine_admin_fee_usd: Administration charge added to each traffic fine recharged to the renter, in USD.
  cleaning_fee_usd: Charge where the vehicle is returned needing more than ordinary cleaning, in USD.
  smoking_penalty_usd: Charge where the vehicle is returned smelling of smoke, in USD.
  refund_processing_days: Business days the settlement of an approved refund takes.
  club_points_earn_rate_pct: Percentage of the rental total that accrues as traveller club points.
  loyalty_upgrade_eligible: Whether a club tier may obtain a vehicle class upgrade on this rate class.
  corporate_rate_eligible: Whether a corporate travel programme rate may be applied to this rate class.
  currency_conversion_markup_pct: Percentage added when the renter elects to be charged in a currency other than the supplier's own.
