- id: drive_no_show_terms
  subject:
  - drive_no_show
  - drive_no_show_charge
  rule: 'A renter who does not collect the vehicle within the supplier''s holding time after the scheduled collection is recorded as a no-show and the rate class''s no-show charge is withheld. A no-show
    releases the whole rental, and the remaining days are cancelled with no further charge. A no-show charge and a cancellation charge are never both withheld on the same rental: whichever applies replaces
    the other. No charge is withheld where the renter could not collect because the supplier had no vehicle, and the supplier notice terms apply instead. Where the prepayment already held is smaller than
    the charge, the balance is taken from the card on file, and where it is larger the difference is returned. A renter who arrives after the holding time has passed is treated as a fresh walk-up at the
    counter and not as the holder of this rental.'
