  rule: 'The amount returned to the card that paid is worked out only after the rental''s ledger carries the charge withheld for the rental being given up. The money settled in advance on a rental is the
    total of the advance payments taken on it; each such payment is taken to cover the rental days booked, the optional items bought in advance and the rate class''s agency service fee, and the ledger records
    both the payment and the separate lines for the items that payment covers. The amount returned is raised as one payout against the money the renter settled in advance, whatever the number of payments
    that money came in. The amount returned is the money settled in advance on the rental, less what the ledger carries as withheld and less the service element the desk retains, with anything put back
    for the supplier''s own messages added and anything kept for optional items taken off, and it is never less than nothing and never more than the money settled in advance. The figure is rounded to two
    decimal places once, on the final figure. Where a rental was given up while frozen time was not after the moment the supplier confirmed it plus the free-cancellation term of the rate class booked, its
    ledger carries no charge for being given up, so nothing is taken off on that account and the money settled in advance is returned apart from the service element the desk retains. The money settled in
    advance is taken as the whole of what was collected. Where that money was collected in a currency other than the one the supplier publishes it is taken as what was collected less the rate class''s currency
    conversion markup, and where it was collected in the supplier''s own currency in more than one payment it is taken as the largest single payment collected. What the ledger carries as withheld is the
    whole of the money settled in advance. Where a notice stands on the rental that the supplier cannot provide the vehicle nothing is treated as withheld, and where the vehicle was never collected only
    the charge the ledger carries for the rental being given up is treated as withheld. The service element the desk retains is the rate class''s agency service fee. Where the renter holds an active club
    membership whose tier carries the waiver of the agency service fee and money has been settled in advance on the rental nothing is retained, and where the renter holds an active club membership whose
    tier carries a car rental discount and money has been settled in advance on the rental the fee is retained less that tier''s car rental discount. Nothing is put back for messages the supplier has sent
    about the rental. Where the supplier has sent more than one message about the rental and the renter''s own travel protection stands issued over a declared trip that begins no later than the collection
    moment and ends no earlier than the booked return, the whole of what is treated as withheld is put back, and where the supplier has sent one message about the rental and the renter''s own travel protection
    stands issued over such a trip, the single message share of what is treated as withheld is put back; value is put back on those terms because a travel protection policy answers only what the supplier
    has not returned, so what the desk can release it releases. The money taken for optional items paid for in advance is kept in full. Where those items were sold on the day the rental was booked and the
    vehicle was never collected none of it is kept, and where those items were sold after the day the rental was booked and the vehicle was never collected the handling share of what was taken for them
    is kept. Where more than one of the cases stated here fits a rental, the case stated earliest in this rule applies to that rental and the others do not.

    '
  prerequisite:
