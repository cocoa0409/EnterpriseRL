- id: drive_ext_damage_recharge
  base_policy_refs:
  - drive_damage_and_recharges
  - drive_agg_rental_history
  overwrite:
  - base_policy: drive_damage_and_recharges
    superseded_clause: The class's damage administration charge is added once per incident and never once per damaged part.
    replaced_by: The rate class's damage administration charge is then added once. Where more than one damage assessment stands approved against the rental the administration charge is added once for each
      approved assessment, and where the damage was decided within the prompt report days and a review already stands declined against the rental the administration charge is added at the reopened administration
      multiple.
  - base_policy: drive_damage_and_recharges
    superseded_clause: Damage discovered at return or afterwards is recharged to the renter up to the rate class's waiver excess where the waiver was carried, and in full where it was not.
    replaced_by: The excess the renter bears is the rate class's waiver excess.
  trigger: state_due
  subject:
  - drive_damage_charge
  computes: damage_recharge_usd
  target_tool: post_damage_recharge_2d59c35f
  params:
    floor_relief_pct: 2
    prompt_report_days: 8
    prompt_share_pct: 90
    late_share_pct: 75
    claim_review_threshold: 2
    repeat_loading_pct: 25
    single_claim_loading_pct: 10
    high_day_rate_usd: 75
    high_uplift_pct: 10
    mid_day_rate_usd: 45
    mid_uplift_pct: 5
    reopened_admin_multiple: 1.5
  rule: 'The amount recharged to a renter for damage the rental desk has approved against the rental is built from the excess the renter bears under the rate class booked, what the protection sold on the
    rental takes off it, how promptly the damage was decided, the renter''s own record of rental damage claims filed on their travel protection policies and the value of the vehicle hired, with the rate
    class''s damage administration charge added at the end. The excess the renter bears is the rate class''s waiver excess. Where the ledger carries a collision damage waiver sold on the rental and the
    renter holds an active club membership whose tier carries a car rental discount, the excess borne is the rate class''s waiver excess reduced by that tier''s car rental discount; where the ledger carries
    a collision damage waiver sold on the rental and the renter holds no active club membership carrying a car rental discount, the excess borne is the rate class''s waiver excess reduced by the floor relief.
    Nothing is taken off the excess borne for protection sold on the rental. Where the ledger carries both a collision damage waiver and theft protection sold on the rental, what was paid for both products
    is taken off the excess borne; where the ledger carries a collision damage waiver sold on the rental and no theft protection, what was paid for the waiver alone is taken off. The excess borne after
    that deduction is never less than nothing. The days to decision are the calendar days from the date the renter returned the vehicle to the date the rental desk decided the last damage assessment it
    approved on the rental. The share of that amount the renter is recharged is the late report share. Where the damage was decided on the day the vehicle came back the whole of it is recharged, and where
    it was decided within the prompt report days of the vehicle coming back the prompt report share is recharged. No loading is carried for the renter''s own record. Where the renter has filed more rental
    damage claims on their travel protection policies in the last twenty-four months than the claim review threshold and holds a travel protection policy in force, the repeat loading is carried; where the
    renter has filed at least one rental damage claim on their travel protection policies in the last twenty-four months, the single claim loading is carried. The loading is applied to the shared amount.
    No uplift is carried for the value of the vehicle hired. Where the rental rate charged on the rental works out at more than the high day rate for each charged rental day the high uplift is carried,
    and where it works out at more than the mid day rate for each charged rental day the mid uplift is carried; the uplift is applied after the loading. The rate class''s damage administration charge is
    then added once. Where more than one damage assessment stands approved against the rental the administration charge is added once for each approved assessment, and where the damage was decided within
    the prompt report days and a review already stands declined against the rental the administration charge is added at the reopened administration multiple. The figure is rounded to two decimal places
    once, on the final figure, after the administration charge has been added. Where more than one of the cases stated here fits a rental, the case stated earliest in this rule applies to that rental and
    the others do not.

    '
  prerequisite: []
  cross_category:
  - category: club
    as: branch
    reads:
    - variant_name
    - status
    note: the excess the renter bears is decided from the tier the renter's club membership stands at and the car rental discount that tier carries.
  - category: care
    as: history
    reads:
    - status
    - care_claims.claim_type
    - care_claims.filed_date
    note: the loading carried for the renter's own record is decided from the rental damage claims filed on their travel protection policies in the last twenty-four months.
  compute:
  - club_rental_discount_pct: (CPARAM('club','car_rental_discount_pct', status='active') or 0)
  - waiver_sold_total: SUM('drive_rental_entries','amount_usd', charge_category='collision_damage_waiver')
  - excess_borne: P('cdw_excess_usd') * (1 - club_rental_discount_pct / 100.0) if (waiver_sold_total > 0 and club_rental_discount_pct > 0) else (P('cdw_excess_usd') * (1 - K('floor_relief_pct') / 100.0)
      if (waiver_sold_total > 0 and club_rental_discount_pct <= 0) else P('cdw_excess_usd'))
  - theft_sold_total: SUM('drive_rental_entries','amount_usd', charge_category='theft_protection')
  - protection_offset: waiver_sold_total + theft_sold_total if (waiver_sold_total > 0 and theft_sold_total > 0) else (waiver_sold_total if (waiver_sold_total > 0 and theft_sold_total <= 0) else 0.0)
  - assessment_decided_on: LATEST('drive_damage_reviews','decided_at', date_field='submitted_at', review_status='approved')
  - days_to_decision: DAYS(F('returned_at'), assessment_decided_on)
  - report_share_pct: 100.0 if days_to_decision <= 0 else (K('prompt_share_pct') if days_to_decision <= K('prompt_report_days') else K('late_share_pct'))
  - damage_claims_24m: XCOUNT('care','care_claims', within_months=24, date_field='filed_date', claim_type='rental_damage')
  - protection_in_force: EXISTS('care', status='in_force')
  - history_loading_pct: K('repeat_loading_pct') if (damage_claims_24m > K('claim_review_threshold') and protection_in_force) else (K('single_claim_loading_pct') if damage_claims_24m >= 1 else 0.0)
  - rate_lines_total: SUM('drive_rental_entries','amount_usd', charge_category='rental_rate')
  - day_rate_charged: rate_lines_total / MX(F('rental_days'), 1)
  - vehicle_uplift_pct: K('high_uplift_pct') if day_rate_charged > K('high_day_rate_usd') else (K('mid_uplift_pct') if day_rate_charged > K('mid_day_rate_usd') else 0.0)
  - approved_assessments: COUNT('drive_damage_reviews', review_status='approved')
  - declined_reviews: COUNT('drive_damage_reviews', review_status='declined')
  - admin_element: P('damage_admin_fee_usd') * approved_assessments if approved_assessments > 1 else (P('damage_admin_fee_usd') * K('reopened_admin_multiple') if (days_to_decision <= K('prompt_report_days')
      and declined_reviews >= 1) else P('damage_admin_fee_usd'))
  - borne_after_protection: MX(excess_borne - protection_offset, 0.0)
  - after_report_share: borne_after_protection * report_share_pct / 100.0
  - after_loading: after_report_share * (1 + history_loading_pct / 100.0)
  - after_value: after_loading * (1 + vehicle_uplift_pct / 100.0)
  - result: RND(after_value + admin_element, 2)
  compute_basis:
    club_rental_discount_pct: Where the ledger carries a collision damage waiver sold on the rental and the renter holds an active club membership whose tier carries a car rental discount, the excess borne
      is the rate class's waiver excess reduced by that tier's car rental discount
    waiver_sold_total: Where the ledger carries a collision damage waiver sold on the rental and the renter holds an active club membership whose tier carries a car rental discount, the excess borne is
      the rate class's waiver excess reduced by that tier's car rental discount
    excess_borne: The excess the renter bears is the rate class's waiver excess. Where the ledger carries a collision damage waiver sold on the rental and the renter holds an active club membership whose
      tier carries a car rental discount, the excess borne is the rate class's waiver excess reduced by that tier's car rental discount; where the ledger carries a collision damage waiver sold on the rental
      and the renter holds no active club membership carrying a car rental discount, the excess borne is the rate class's waiver excess reduced by the floor relief.
    theft_sold_total: Where the ledger carries both a collision damage waiver and theft protection sold on the rental, what was paid for both products is taken off the excess borne
    protection_offset: Nothing is taken off the excess borne for protection sold on the rental. Where the ledger carries both a collision damage waiver and theft protection sold on the rental, what was
      paid for both products is taken off the excess borne; where the ledger carries a collision damage waiver sold on the rental and no theft protection, what was paid for the waiver alone is taken off.
    assessment_decided_on: The days to decision are the calendar days from the date the renter returned the vehicle to the date the rental desk decided the last damage assessment it approved on the rental.
    days_to_decision: The days to decision are the calendar days from the date the renter returned the vehicle to the date the rental desk decided the last damage assessment it approved on the rental.
    report_share_pct: The share of that amount the renter is recharged is the late report share. Where the damage was decided on the day the vehicle came back the whole of it is recharged, and where it
      was decided within the prompt report days of the vehicle coming back the prompt report share is recharged.
    damage_claims_24m: Where the renter has filed more rental damage claims on their travel protection policies in the last twenty-four months than the claim review threshold and holds a travel protection
      policy in force, the repeat loading is carried
    protection_in_force: Where the renter has filed more rental damage claims on their travel protection policies in the last twenty-four months than the claim review threshold and holds a travel protection
      policy in force, the repeat loading is carried
    history_loading_pct: No loading is carried for the renter's own record. Where the renter has filed more rental damage claims on their travel protection policies in the last twenty-four months than the
      claim review threshold and holds a travel protection policy in force, the repeat loading is carried; where the renter has filed at least one rental damage claim on their travel protection policies
      in the last twenty-four months, the single claim loading is carried.
    rate_lines_total: Where the rental rate charged on the rental works out at more than the high day rate for each charged rental day the high uplift is carried
    day_rate_charged: Where the rental rate charged on the rental works out at more than the high day rate for each charged rental day the high uplift is carried, and where it works out at more than the
      mid day rate for each charged rental day the mid uplift is carried
    vehicle_uplift_pct: No uplift is carried for the value of the vehicle hired. Where the rental rate charged on the rental works out at more than the high day rate for each charged rental day the high
      uplift is carried, and where it works out at more than the mid day rate for each charged rental day the mid uplift is carried; the uplift is applied after the loading.
    declined_reviews: where the damage was decided within the prompt report days and a review already stands declined against the rental the administration charge is added at the reopened administration
      multiple
    approved_assessments: Where more than one damage assessment stands approved against the rental the administration charge is added once for each approved assessment
    admin_element: The rate class's damage administration charge is then added once. Where more than one damage assessment stands approved against the rental the administration charge is added once for
      each approved assessment, and where the damage was decided within the prompt report days and a review already stands declined against the rental the administration charge is added at the reopened
      administration multiple.
    borne_after_protection: The excess borne after that deduction is never less than nothing.
    after_report_share: The share of that amount the renter is recharged is the late report share.
    after_loading: The loading is applied to the shared amount.
    after_value: the uplift is applied after the loading
    result: The figure is rounded to two decimal places once, on the final figure, after the administration charge has been added.
  factors:
  - id: excess_borne_relief
    effect: parameter
    decides: excess_borne
    bindings:
    - club_rental_discount_pct
    - waiver_sold_total
    - excess_borne
    ladder:
    - when: the ledger carries a collision damage waiver sold on the rental and the renter holds an active club membership whose tier carries a car rental discount
      value: the rate class's waiver excess reduced by that tier's car rental discount
    - when: the ledger carries a collision damage waiver sold on the rental and the renter holds no active club membership carrying a car rental discount
      value: the rate class's waiver excess reduced by K('floor_relief_pct')
    - when: otherwise
      value: P('cdw_excess_usd')
    baseline:
      excess_borne: P('cdw_excess_usd')
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  - id: protection_deduction
    effect: method
    decides: protection_offset
    bindings:
    - theft_sold_total
    - protection_offset
    ladder:
    - when: the ledger carries both a collision damage waiver and theft protection sold on the rental
      method: what was paid for both products is taken off the excess borne
    - when: the ledger carries a collision damage waiver sold on the rental and no theft protection
      method: what was paid for the waiver alone is taken off the excess borne
    - when: otherwise
      method: nothing is taken off the excess borne
    baseline:
      protection_offset: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: report_promptness
    effect: parameter
    decides: report_share_pct
    bindings:
    - assessment_decided_on
    - days_to_decision
    - report_share_pct
    ladder:
    - when: the damage was decided on the day the vehicle came back
      value: the whole of the amount
    - when: the damage was decided within the prompt report days of the vehicle coming back
      value: K('prompt_share_pct')
    - when: otherwise
      value: K('late_share_pct')
    baseline:
      report_share_pct: K('late_share_pct')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: claim_record_loading
    effect: parameter
    decides: history_loading_pct
    bindings:
    - damage_claims_24m
    - protection_in_force
    - history_loading_pct
    ladder:
    - when: the renter has filed more rental damage claims on their travel protection policies in the last twenty-four months than the claim review threshold and holds a travel protection policy in force
      value: K('repeat_loading_pct')
    - when: the renter has filed at least one rental damage claim on their travel protection policies in the last twenty-four months
      value: K('single_claim_loading_pct')
    - when: otherwise
      value: no loading
    baseline:
      history_loading_pct: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: care
  - id: vehicle_value_uplift
    effect: parameter
    decides: vehicle_uplift_pct
    bindings:
    - rate_lines_total
    - day_rate_charged
    - vehicle_uplift_pct
    ladder:
    - when: the rental rate charged works out at more than the high day rate for each charged rental day
      value: K('high_uplift_pct')
    - when: the rental rate charged works out at more than the mid day rate for each charged rental day
      value: K('mid_uplift_pct')
    - when: otherwise
      value: no uplift
    baseline:
      vehicle_uplift_pct: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: administration_element
    effect: parameter
    decides: admin_element
    bindings:
    - approved_assessments
    - declined_reviews
    - admin_element
    ladder:
    - when: more than one damage assessment stands approved against the rental
      value: the rate class's damage administration charge once for each approved assessment
    - when: the damage was decided within the prompt report days and a review already stands declined against the rental
      value: the rate class's damage administration charge at K('reopened_admin_multiple')
    - when: otherwise
      value: the rate class's damage administration charge once
    baseline:
      admin_element: P('damage_admin_fee_usd')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The amount recharged to a renter for damage the rental desk has approved against the rental is built from the excess the renter bears under the rate class booked, what the protection sold on the
      rental takes off it, how promptly the damage was decided, the renter's own record of rental damage claims filed on their travel protection policies and the value of the vehicle hired, with the rate
      class's damage administration charge added at the end. The excess the renter bears is the rate class's waiver excess. Nothing is taken off the excess borne for protection sold on the rental. The excess
      borne after that deduction is never less than nothing. The days to decision are the calendar days from the date the renter returned the vehicle to the date the rental desk decided the last damage
      assessment it approved on the rental. The share of that amount the renter is recharged is the late report share. No loading is carried for the renter's own record. The loading is applied to the shared
      amount. No uplift is carried for the value of the vehicle hired. The rate class's damage administration charge is then added once. The figure is rounded to two decimal places once, on the final figure,
      after the administration charge has been added.
    params:
    - late_share_pct
  inputs:
    history:
    - table: drive_rental_entries
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        charge_category: collision_damage_waiver
    - table: drive_rental_entries
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        charge_category: theft_protection
    - table: drive_damage_reviews
      aggregate: latest
      field: decided_at
      within_months: null
      filters:
        review_status: approved
    - category: care
      table: care_claims
      aggregate: count
      field: care_claim_id
      within_months: 24
      filters:
        claim_type: rental_damage
    cross_category:
    - club
    - care
- id: drive_ext_recharge_dispute
  base_policy_refs:
  - drive_damage_and_recharges
  - drive_agg_rental_history
  overwrite: []
  trigger: on_request
  subject:
  - drive_damage_charge
  computes: disputed_amount_usd
  target_tool: raise_recharge_dispute_65c619e1
  params:
    insured_share_pct: 60
    window_late_share_pct: 100
    window_mid_share_pct: 80
    window_early_share_pct: 60
    part_cleaning_share_pct: 50
    reopened_fuel_share_pct: 25
  rule: 'The amount a renter may put in dispute is fixed only once the ledger carries the entry for the damage the rental desk has approved against the rental. The amount put in dispute is the amount open
    to challenge on the damage recharged, less the part the renter''s own travel protection answers, taken at the share the timing of the assessment leaves open, with the cleaning and fuel the renter also
    challenges added; it is never less than nothing and is rounded to two decimal places once, on the final figure. The amount open to challenge is the whole of what the ledger carries as recharged damage
    on the rental. Where the ledger carries more than one damage recharge on the rental, the amount open to challenge is the largest single damage recharge the ledger carries; where a review already stands
    declined against the rental, the amount open to challenge is the whole of what the ledger carries as recharged damage less the rate class''s damage administration charge, and never less than nothing.
    No part of the amount open to challenge is answered by travel protection. Where the renter holds a travel protection policy in force whose rental damage benefit carries a limit at or above the amount
    open to challenge and carries a deductible, the insured share of the amount open to challenge is answered by that policy; where the renter holds a travel protection policy in force whose rental damage
    benefit carries a limit below the amount open to challenge, the insured share of that limit is answered by it. What the policy answers is taken off the amount open to challenge, and the remainder is
    never less than nothing. The days of the window used are the calendar days from the date the renter returned the vehicle to the date the rental desk decided the last damage assessment it approved on
    the rental. The share the timing leaves open is the early window share. Where three times the days of the window used is more than twice the rate class''s damage reporting window the late window share
    is left open, and where three times the days of the window used is more than the rate class''s damage reporting window the mid window share is left open. Nothing is added for cleaning. Where the ledger
    carries a cleaning charge on the rental and the included mileage still unused on the rental is nothing or more, the whole of that cleaning charge is added; where the ledger carries a cleaning charge
    on the rental, the part cleaning share of it is added. Nothing is added for fuel. Where the ledger carries a refuelling service charge on the rental and no fuel dispute stands declined against the rental,
    the whole of that charge is added; where the ledger carries a refuelling service charge on the rental and a fuel dispute stands declined against it, the reopened fuel share of that charge is added.
    Where more than one of the cases stated here fits a rental, the case stated earliest in this rule applies to that rental and the others do not.

    '
  prerequisite:
  - problem: drive_ext_damage_recharge
    kind: value_input
    gate: recharge_on_ledger
    form: state
    policy_source: The amount a renter may put in dispute is fixed only once the ledger carries the entry for the damage the rental desk has approved against the rental.
    condition: the rental's ledger carries a damage recharge line standing against the rental under dispute
    resolved_by: post_damage_recharge_2d59c35f
    effect: once that line stands on the ledger, the recharged damage read off the ledger stops being nothing and becomes the amount the line carries, which is what the amount open to challenge is measured
      from
  cross_category:
  - category: care
    as: branch
    reads:
    - status
    - variant_name
    note: the part of the amount open to challenge that travel protection answers is decided from the rental damage benefit carried by the renter's policy in force.
  compute:
  - recharge_on_ledger: SUM('drive_rental_entries','amount_usd', charge_category='damage_charge')
  - declined_reviews: COUNT('drive_damage_reviews', review_status='declined')
  - damage_lines_count: COUNT('drive_rental_entries', charge_category='damage_charge')
  - disputable_base: MAX('drive_rental_entries','amount_usd', charge_category='damage_charge') if damage_lines_count > 1 else (MX(recharge_on_ledger - P('damage_admin_fee_usd'), 0.0) if declined_reviews
      >= 1 else recharge_on_ledger)
  - protection_limit: (CPARAM('care','rental_damage_limit_usd', status='in_force') or 0)
  - protection_deductible: (CPARAM('care','rental_damage_deductible_usd', status='in_force') or 0)
  - insured_part: disputable_base * K('insured_share_pct') / 100.0 if (protection_limit >= disputable_base and protection_deductible > 0) else (MN(disputable_base, protection_limit) * K('insured_share_pct')
      / 100.0 if (protection_limit > 0 and protection_limit < disputable_base) else 0.0)
  - after_insurance: MX(disputable_base - insured_part, 0.0)
  - window_days_used: DAYS(F('returned_at'), LATEST('drive_damage_reviews','decided_at', date_field='submitted_at', review_status='approved'))
  - window_share_pct: K('window_late_share_pct') if window_days_used * 3 > P('damage_report_window_days') * 2 else (K('window_mid_share_pct') if window_days_used * 3 > P('damage_report_window_days') else
      K('window_early_share_pct'))
  - after_share: after_insurance * window_share_pct / 100.0
  - cleaning_on_ledger: SUM('drive_rental_entries','amount_usd', charge_category='cleaning_fee')
  - miles_remaining: F('mileage_allowance_remaining')
  - cleaning_element: cleaning_on_ledger if (cleaning_on_ledger > 0 and miles_remaining >= 0) else (cleaning_on_ledger * K('part_cleaning_share_pct') / 100.0 if cleaning_on_ledger > 0 else 0.0)
  - fuel_on_ledger: SUM('drive_rental_entries','amount_usd', charge_category='fuel_refuelling_service')
  - fuel_disputes_declined: COUNT('drive_damage_reviews', review_type='fuel_dispute', review_status='declined')
  - fuel_element: fuel_on_ledger if (fuel_on_ledger > 0 and fuel_disputes_declined <= 0) else (fuel_on_ledger * K('reopened_fuel_share_pct') / 100.0 if (fuel_on_ledger > 0 and fuel_disputes_declined >=
      1) else 0.0)
  - result: RND(MX(after_share + cleaning_element + fuel_element, 0.0), 2)
  compute_basis:
    recharge_on_ledger: The amount a renter may put in dispute is fixed only once the ledger carries the entry for the damage the rental desk has approved against the rental.
    declined_reviews: where a review already stands declined against the rental, the amount open to challenge is the whole of what the ledger carries as recharged damage less the rate class's damage administration
      charge, and never less than nothing
    damage_lines_count: Where the ledger carries more than one damage recharge on the rental, the amount open to challenge is the largest single damage recharge the ledger carries
    disputable_base: The amount open to challenge is the whole of what the ledger carries as recharged damage on the rental. Where the ledger carries more than one damage recharge on the rental, the amount
      open to challenge is the largest single damage recharge the ledger carries; where a review already stands declined against the rental, the amount open to challenge is the whole of what the ledger
      carries as recharged damage less the rate class's damage administration charge, and never less than nothing.
    protection_limit: Where the renter holds a travel protection policy in force whose rental damage benefit carries a limit at or above the amount open to challenge and carries a deductible, the insured
      share of the amount open to challenge is answered by that policy
    protection_deductible: Where the renter holds a travel protection policy in force whose rental damage benefit carries a limit at or above the amount open to challenge and carries a deductible, the insured
      share of the amount open to challenge is answered by that policy
    insured_part: No part of the amount open to challenge is answered by travel protection. Where the renter holds a travel protection policy in force whose rental damage benefit carries a limit at or above
      the amount open to challenge and carries a deductible, the insured share of the amount open to challenge is answered by that policy; where the renter holds a travel protection policy in force whose
      rental damage benefit carries a limit below the amount open to challenge, the insured share of that limit is answered by it.
    after_insurance: What the policy answers is taken off the amount open to challenge, and the remainder is never less than nothing.
    window_days_used: The days of the window used are the calendar days from the date the renter returned the vehicle to the date the rental desk decided the last damage assessment it approved on the rental.
    window_share_pct: The share the timing leaves open is the early window share. Where three times the days of the window used is more than twice the rate class's damage reporting window the late window
      share is left open, and where three times the days of the window used is more than the rate class's damage reporting window the mid window share is left open.
    after_share: taken at the share the timing of the assessment leaves open
    cleaning_on_ledger: Where the ledger carries a cleaning charge on the rental and the included mileage still unused on the rental is nothing or more, the whole of that cleaning charge is added
    miles_remaining: Where the ledger carries a cleaning charge on the rental and the included mileage still unused on the rental is nothing or more, the whole of that cleaning charge is added
    cleaning_element: Nothing is added for cleaning. Where the ledger carries a cleaning charge on the rental and the included mileage still unused on the rental is nothing or more, the whole of that cleaning
      charge is added; where the ledger carries a cleaning charge on the rental, the part cleaning share of it is added.
    fuel_on_ledger: Where the ledger carries a refuelling service charge on the rental and no fuel dispute stands declined against the rental, the whole of that charge is added
    fuel_disputes_declined: where the ledger carries a refuelling service charge on the rental and a fuel dispute stands declined against it, the reopened fuel share of that charge is added
    fuel_element: Nothing is added for fuel. Where the ledger carries a refuelling service charge on the rental and no fuel dispute stands declined against the rental, the whole of that charge is added;
      where the ledger carries a refuelling service charge on the rental and a fuel dispute stands declined against it, the reopened fuel share of that charge is added.
    result: it is never less than nothing and is rounded to two decimal places once, on the final figure
  factors:
  - id: challenge_scope
    effect: method
    decides: disputable_base
    bindings:
    - declined_reviews
    - damage_lines_count
    - disputable_base
    ladder:
    - when: the ledger carries more than one damage recharge on the rental
      method: the amount open to challenge is the largest single damage recharge the ledger carries
    - when: a review already stands declined against the rental
      method: the amount open to challenge is the whole of what the ledger carries as recharged damage less the rate class's damage administration charge, and never less than nothing
    - when: otherwise
      method: the amount open to challenge is the whole of what the ledger carries as recharged damage on the rental
    baseline:
      disputable_base: recharge_on_ledger
    evidence:
    - history
    cross_difficulty: null
  - id: protection_answered
    effect: parameter
    decides: insured_part
    bindings:
    - protection_limit
    - protection_deductible
    - insured_part
    ladder:
    - when: the renter holds a travel protection policy in force whose rental damage benefit carries a limit at or above the amount open to challenge and carries a deductible
      value: K('insured_share_pct') of the amount open to challenge
    - when: the renter holds a travel protection policy in force whose rental damage benefit carries a limit below the amount open to challenge
      value: K('insured_share_pct') of that limit
    - when: otherwise
      value: nothing
    baseline:
      insured_part: '0.0'
    evidence:
    - cross_category
    cross_difficulty: care
  - id: assessment_timing_share
    effect: parameter
    decides: window_share_pct
    bindings:
    - window_days_used
    - window_share_pct
    ladder:
    - when: three times the days of the window used is more than twice the rate class's damage reporting window
      value: K('window_late_share_pct')
    - when: three times the days of the window used is more than the rate class's damage reporting window
      value: K('window_mid_share_pct')
    - when: otherwise
      value: K('window_early_share_pct')
    baseline:
      window_share_pct: K('window_early_share_pct')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: cleaning_challenged
    effect: parameter
    decides: cleaning_element
    bindings:
    - cleaning_on_ledger
    - miles_remaining
    - cleaning_element
    ladder:
    - when: the ledger carries a cleaning charge on the rental and the included mileage still unused on the rental is nothing or more
      value: the whole of that cleaning charge
    - when: the ledger carries a cleaning charge on the rental
      value: K('part_cleaning_share_pct') of that cleaning charge
    - when: otherwise
      value: nothing
    baseline:
      cleaning_element: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: fuel_challenged
    effect: parameter
    decides: fuel_element
    bindings:
    - fuel_on_ledger
    - fuel_disputes_declined
    - fuel_element
    ladder:
    - when: the ledger carries a refuelling service charge on the rental and no fuel dispute stands declined against the rental
      value: the whole of that charge
    - when: the ledger carries a refuelling service charge on the rental and a fuel dispute stands declined against it
      value: K('reopened_fuel_share_pct') of that charge
    - when: otherwise
      value: nothing
    baseline:
      fuel_element: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The amount put in dispute is the amount open to challenge on the damage recharged, less the part the renter's own travel protection answers, taken at the share the timing of the assessment leaves
      open, with the cleaning and fuel the renter also challenges added; it is never less than nothing and is rounded to two decimal places once, on the final figure. The amount open to challenge is the
      whole of what the ledger carries as recharged damage on the rental. No part of the amount open to challenge is answered by travel protection. What the policy answers is taken off the amount open to
      challenge, and the remainder is never less than nothing. The days of the window used are the calendar days from the date the renter returned the vehicle to the date the rental desk decided the last
      damage assessment it approved on the rental. The share the timing leaves open is the early window share. Nothing is added for cleaning. Nothing is added for fuel.
    params:
    - window_early_share_pct
  inputs:
    history:
    - table: drive_rental_entries
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        charge_category: damage_charge
    - table: drive_rental_entries
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        charge_category: cleaning_fee
    - table: drive_damage_reviews
      aggregate: count
      field: drive_review_id
      within_months: null
      filters:
        review_status: declined
    cross_category:
    - care
