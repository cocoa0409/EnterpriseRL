  - withheld_on_ledger: SUM('drive_rental_entries','amount_usd', charge_category='cancellation_fee')
  - unavailability_notices: COUNT('drive_rental_entries', event_type='drive_supplier_notice', reason_code='supplier_unavailable')
  - vehicle_collected_at: F('picked_up_at')
  - withheld_applied: 0.0 if unavailability_notices >= 1 else (withheld_on_ledger if vehicle_collected_at == '' else settled_in_advance_total)
  - club_rental_discount_pct: (CPARAM('club','car_rental_discount_pct', status='active') or 0)
  - fee_waiver_carried: CPARAM('club','agency_service_fee_waiver', status='active')
  - retained_service_element: 0.0 if (fee_waiver_carried == True and settled_in_advance_total > 0) else (P('agency_service_fee_usd') * (1 - club_rental_discount_pct / 100.0) if (club_rental_discount_pct
      > 0 and settled_in_advance_total > 0) else P('agency_service_fee_usd'))
