- id: drive_damage_and_recharges
  subject:
  - drive_damage_charge
  rule: Damage discovered at return or afterwards is recharged to the renter up to the rate class's waiver excess where the waiver was carried, and in full where it was not. A recharge is raised only while
    the rental record stands at picked up or returned. Damage is recharged only when the rental desk has already recorded an approved damage assessment against this rental. Damage found after the vehicle
    was handed back is recharged only when frozen time is not after the moment the renter returned the vehicle to the supplier plus the damage reporting window of the rate class booked. The damage reporting
    window is counted in whole calendar days from the day after the return date, weekends and public holidays included, and a report made exactly on the closing day is still in time. The class's damage
    administration charge is added once per incident and never once per damaged part. Tolls and traffic fines incurred during the rental are recharged at the amount the authority charged plus the class's
    own administration charge for each toll or each fine. Excessive soiling and smoking in the vehicle carry the class's own charges and are settled as recharges rather than as damage. A renter who disputes
    a recharge is referred to a review, and the disputed amount stays on the ledger until the review decides it.
  eligibility:
  - id: vehicle_out_or_returned
    applies_to:
    - drive_damage_charge
    kind: state
    condition: A recharge is raised only while the rental record stands at picked up or returned.
    evidence_fields:
    - drive_rentals.status
    - drive_rentals.drive_rental_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - drive_rentals.drive_rental_id
      action_bindings:
        drive_rentals.drive_rental_id: drive_rental_id
    state_contract:
      field: drive_rentals.status
      allowed:
      - picked_up
      - returned
  - id: damage_assessment_approved
    applies_to:
    - drive_damage_charge
    kind: authorization
    condition: Damage is recharged only when the rental desk has already recorded an approved damage assessment against this rental.
    evidence_fields:
    - drive_damage_reviews.review_status
    - drive_damage_reviews.drive_review_id
    - drive_damage_reviews.drive_rental_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - drive_damage_reviews.drive_review_id
      action_bindings:
        drive_damage_reviews.drive_review_id: drive_review_id
  - id: inside_damage_window
    applies_to:
    - drive_damage_charge
    kind: time
    condition: Damage found after the vehicle was handed back is recharged only when frozen time is not after the moment the renter returned the vehicle to the supplier plus the damage reporting window
      of the rate class booked.
    evidence_fields:
    - drive_rentals.returned_at
    - drive_rentals.drive_rental_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - drive_rentals.drive_rental_id
      action_bindings:
        drive_rentals.drive_rental_id: drive_rental_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the renter returned the vehicle to the supplier
      anchor_source: drive_rentals.returned_at
      relation: not_after
      duration_source: variants.damage_report_window_days
      unit: calendar_days
      counting_rule: The damage reporting window is counted in whole calendar days from the day after the return date, weekends and public holidays included, and a report made exactly on the closing day
        is still in time.
      boundary: inclusive
  params:
    per_tier:
      Pay Now Saver Rate:
