extended_policies:
- id: drive_ext_cancellation_charge
  base_policy_refs:
  - drive_cancellation
  - drive_prepayment
  overwrite:
  - base_policy: drive_cancellation
    superseded_clause: Outside it the charge is read off the rate class's cancellation ladder by how many whole days lie between the cancellation and the scheduled collection; where the ladder yields nothing
      the class's flat cancellation charge applies instead, and the two are never added.
    replaced_by: The share of the basis that the notice band sets is eighty per cent.
  trigger: state_due
  subject:
  - drive_cancellation_charge
  computes: cancellation_charge_usd
  target_tool: confirm_cancellation_charge_358c6472
  params:
    notice_far_days: 14
    notice_far_pct: 20
    notice_mid_days: 3
    notice_mid_pct: 45
    notice_near_pct: 80
    relief_tier_min_pct: 5
    relief_min_settled_usd: 300
    relief_floor_pct: 2
    high_value_day_rate_usd: 90
    high_value_multiple: 1.1
    mid_value_day_rate_usd: 60
    mid_value_multiple: 1.05
    long_hold_days: 30
    long_hold_multiple: 2
    mid_hold_days: 7
  rule: 'When a renter gives up a rental, the charge withheld is worked out on the money already settled in advance on that rental and on the notice the supplier was given, and is withheld from that money
    rather than billed separately. The money settled in advance on a rental is the total of the advance payments taken on it; each such payment is taken to cover the rental days booked, the optional items
    bought in advance and the rate class''s agency service fee, and the ledger records both the payment and the separate lines for the items that payment covers. The free-cancellation term of the rate class
    booked runs in whole elapsed hours from the moment the supplier confirmed the renter''s booking, and not backwards from the scheduled collection moment; where frozen time is not after that confirmation
    moment plus the term nothing is withheld, and the charge worked out here is the one that arises where frozen time is past it. The whole days of notice are the calendar days from the date the renter
    gave the rental up to the date of the scheduled collection. The share of the basis that the notice band sets is eighty per cent. Where fourteen or more whole days of notice were given the share is twenty
    per cent, and where three to thirteen whole days of notice were given the share is forty-five per cent. The basis the share acts on is the whole of the money settled in advance on the rental. Where
    money has been settled in advance and optional items have also been paid for in advance, the basis is the money settled in advance less what was paid for those items and less the rate class''s agency
    service fee, so that the share acts on the rate alone; where money has been settled in advance and no optional item was paid for in advance, the basis is the whole of the money settled in advance; and
    where nothing has been settled in advance, the basis is the rate class''s published daily rate for each charged rental day of the booking. No relief is given against the share. Where the renter holds
    an active club membership whose tier carries a car rental discount of at least the relief threshold and the money settled in advance on the rental reaches the relief settlement figure, the share is
    reduced by that tier''s car rental discount; where the renter holds an active club membership whose tier carries any car rental discount and money has been settled in advance on the rental, the share
    is reduced by the floor relief. The reduced share is then taken at the rental''s own value multiple, which is one. Where the money settled in advance works out at more than the high value figure for
    each charged rental day the multiple is the high value multiple, and where it works out at more than the mid value figure for each charged rental day the multiple is the mid value multiple. Nothing
    is added for the time the supplier held the vehicle. Where the renter held the booking for thirty days or more before giving it up the rate class''s flat cancellation charge is added twice over, and
    where the renter held it for seven days or more the rate class''s flat cancellation charge is added once. The days the booking was held are the calendar days from the date it was booked to the date
    the renter gave it up. The figure is rounded to two decimal places once, on the final figure, and the share taken at the value multiple and the amount added for the time the vehicle was held are added
    together before that rounding. Where more than one of the cases stated here fits a rental, the case stated earliest in this rule applies to that rental and the others do not.

    '
  prerequisite: []
  cross_category:
  - category: club
    as: branch
    reads:
    - variant_name
    - status
    note: the relief against the share is decided from the tier the renter's club membership stands at and the car rental discount that tier carries.
  compute:
  - settled_in_advance_total: SUM('drive_rental_entries','amount_usd', event_type='drive_prepay_charge')
  - items_settled_total: SUM('drive_rental_entries','amount_usd', event_type='drive_extras_charge')
  - notice_days: DAYS(F('cancelled_at'), F('pickup_at'))
  - notice_band_pct: K('notice_far_pct') if notice_days >= K('notice_far_days') else (K('notice_mid_pct') if notice_days >= K('notice_mid_days') else K('notice_near_pct'))
  - charge_basis: settled_in_advance_total - items_settled_total - P('agency_service_fee_usd') if (settled_in_advance_total > 0 and items_settled_total > 0) else (settled_in_advance_total if settled_in_advance_total
      > 0 else P('base_day_rate_usd') * F('rental_days'))
  - club_rental_discount_pct: (CPARAM('club','car_rental_discount_pct', status='active') or 0)
  - member_relief_pct: club_rental_discount_pct if (club_rental_discount_pct >= K('relief_tier_min_pct') and settled_in_advance_total >= K('relief_min_settled_usd')) else (K('relief_floor_pct') if (club_rental_discount_pct
      > 0 and settled_in_advance_total > 0) else 0.0)
  - day_rate_settled: SUM('drive_rental_entries','amount_usd', event_type='drive_prepay_charge') / MX(F('rental_days'), 1)
  - value_multiple: K('high_value_multiple') if day_rate_settled > K('high_value_day_rate_usd') else (K('mid_value_multiple') if day_rate_settled > K('mid_value_day_rate_usd') else 1.0)
  - days_held: DAYS(F('booked_date'), F('cancelled_at'))
  - holding_element: P('cancellation_fee_usd') * K('long_hold_multiple') if days_held >= K('long_hold_days') else (P('cancellation_fee_usd') if days_held >= K('mid_hold_days') else 0.0)
  - share_amount: charge_basis * notice_band_pct / 100.0
  - after_relief: share_amount * (1 - member_relief_pct / 100.0)
  - after_value: after_relief * value_multiple
  - result: RND(after_value + holding_element, 2)
  compute_basis:
    settled_in_advance_total: The money settled in advance on a rental is the total of the advance payments taken on it; each such payment is taken to cover the rental days booked, the optional items bought
      in advance and the rate class's agency service fee, and the ledger records both the payment and the separate lines for the items that payment covers.
    items_settled_total: the basis is the money settled in advance less what was paid for those items and less the rate class's agency service fee
    notice_days: The whole days of notice are the calendar days from the date the renter gave the rental up to the date of the scheduled collection.
    notice_band_pct: The share of the basis that the notice band sets is eighty per cent. Where fourteen or more whole days of notice were given the share is twenty per cent, and where three to thirteen
      whole days of notice were given the share is forty-five per cent.
    charge_basis: The basis the share acts on is the whole of the money settled in advance on the rental. Where money has been settled in advance and optional items have also been paid for in advance, the
      basis is the money settled in advance less what was paid for those items and less the rate class's agency service fee, so that the share acts on the rate alone; where money has been settled in advance
      and no optional item was paid for in advance, the basis is the whole of the money settled in advance; and where nothing has been settled in advance, the basis is the rate class's published daily rate
      for each charged rental day of the booking.
    club_rental_discount_pct: Where the renter holds an active club membership whose tier carries a car rental discount of at least the relief threshold and the money settled in advance on the rental reaches
      the relief settlement figure, the share is reduced by that tier's car rental discount
    member_relief_pct: No relief is given against the share. Where the renter holds an active club membership whose tier carries a car rental discount of at least the relief threshold and the money settled
      in advance on the rental reaches the relief settlement figure, the share is reduced by that tier's car rental discount; where the renter holds an active club membership whose tier carries any car
      rental discount and money has been settled in advance on the rental, the share is reduced by the floor relief.
    day_rate_settled: Where the money settled in advance works out at more than the high value figure for each charged rental day the multiple is the high value multiple
    value_multiple: The reduced share is then taken at the rental's own value multiple, which is one. Where the money settled in advance works out at more than the high value figure for each charged rental
      day the multiple is the high value multiple, and where it works out at more than the mid value figure for each charged rental day the multiple is the mid value multiple.
    days_held: The days the booking was held are the calendar days from the date it was booked to the date the renter gave it up.
    share_amount: The share of the basis that the notice band sets is eighty per cent.
    after_relief: the share is reduced by that tier's car rental discount
    after_value: The reduced share is then taken at the rental's own value multiple, which is one.
    holding_element: Nothing is added for the time the supplier held the vehicle. Where the renter held the booking for thirty days or more before giving it up the rate class's flat cancellation charge
      is added twice over, and where the renter held it for seven days or more the rate class's flat cancellation charge is added once.
    result: The figure is rounded to two decimal places once, on the final figure, and the share taken at the value multiple and the amount added for the time the vehicle was held are added together before
      that rounding.
  factors:
  - id: notice_band
    effect: parameter
    decides: notice_band_pct
    bindings:
    - notice_days
    - notice_band_pct
    ladder:
    - when: fourteen or more whole days of notice were given between the rental being given up and the scheduled collection
      value: K('notice_far_pct')
    - when: three to thirteen whole days of notice were given between the rental being given up and the scheduled collection
      value: K('notice_mid_pct')
    - when: otherwise
      value: K('notice_near_pct')
    baseline:
      notice_band_pct: K('notice_near_pct')
    evidence:
    - date
    cross_difficulty: null
  - id: charge_basis_measure
    effect: method
    decides: charge_basis
    bindings:
    - items_settled_total
    - charge_basis
    ladder:
    - when: money has been settled in advance on the rental and optional items have also been paid for in advance
      method: the basis is the money settled in advance less what was paid for those items and less the rate class's agency service fee, so that the share acts on the rate alone
    - when: money has been settled in advance on the rental and no optional item was paid for in advance
      method: the basis is the whole of the money settled in advance
    - when: otherwise
      method: the basis is the rate class's published daily rate for each charged rental day of the booking
    baseline:
      charge_basis: settled_in_advance_total
    evidence:
    - history
    cross_difficulty: null
  - id: member_relief
    effect: parameter
    decides: member_relief_pct
    bindings:
    - club_rental_discount_pct
    - member_relief_pct
    ladder:
    - when: the renter holds an active club membership whose tier carries a car rental discount of at least the relief threshold and the money settled in advance on the rental reaches the relief settlement
        figure
      value: that tier's car rental discount
    - when: the renter holds an active club membership whose tier carries any car rental discount and money has been settled in advance on the rental
      value: K('relief_floor_pct')
    - when: otherwise
      value: no relief
    baseline:
      member_relief_pct: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  - id: value_band
    effect: parameter
    decides: value_multiple
    bindings:
    - day_rate_settled
    - value_multiple
    ladder:
    - when: the money settled in advance works out at more than the high value figure for each charged rental day
      value: K('high_value_multiple')
    - when: the money settled in advance works out at more than the mid value figure for each charged rental day
      value: K('mid_value_multiple')
    - when: otherwise
      value: one
    baseline:
      value_multiple: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: holding_period_element
    effect: parameter
    decides: holding_element
    bindings:
    - days_held
    - holding_element
    ladder:
    - when: the renter held the booking for thirty days or more before giving it up
      value: the rate class's flat cancellation charge twice over
    - when: the renter held the booking for seven days or more before giving it up
      value: the rate class's flat cancellation charge once
    - when: otherwise
      value: nothing
    baseline:
      holding_element: '0.0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: When a renter gives up a rental, the charge withheld is worked out on the money already settled in advance on that rental and on the notice the supplier was given, and is withheld from that money
      rather than billed separately. The whole days of notice are the calendar days from the date the renter gave the rental up to the date of the scheduled collection. The share of the basis that the notice
      band sets is eighty per cent. The basis the share acts on is the whole of the money settled in advance on the rental. No relief is given against the share. The reduced share is then taken at the rental's
      own value multiple, which is one. Nothing is added for the time the supplier held the vehicle. The figure is rounded to two decimal places once, on the final figure, and the share taken at the value
      multiple and the amount added for the time the vehicle was held are added together before that rounding.
    params:
