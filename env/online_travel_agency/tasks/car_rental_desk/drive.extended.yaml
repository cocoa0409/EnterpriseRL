- id: drive_ext_cancellation_refund
  base_policy_refs:
  - drive_refund_settlement
  - drive_cancellation
  - drive_prepayment
  overwrite:
  - base_policy: drive_cancellation
    superseded_clause: the agency service fee is not returned on any class
    replaced_by: Where the renter holds an active club membership whose tier carries the waiver of the agency service fee and money has been settled in advance on the rental nothing is retained, and where
      the renter holds an active club membership whose tier carries a car rental discount and money has been settled in advance on the rental the fee is retained less that tier's car rental discount.
  - base_policy: drive_refund_settlement
    superseded_clause: Each payout is raised against the original ledger line it reverses, so a rental with several lines settles as several payouts and never as one lump sum.
    replaced_by: The amount returned is raised as one payout against the money the renter settled in advance, whatever the number of payments that money came in.
  - base_policy: drive_cancellation
    superseded_clause: the prepayment is returned in full
    replaced_by: Where a rental was given up while frozen time was not after the moment the supplier confirmed it plus the free-cancellation term of the rate class booked, its ledger carries no charge for
      being given up, so nothing is taken off on that account and the money settled in advance is returned apart from the service element the desk retains.
  - base_policy: drive_refund_settlement
    superseded_clause: A payout may never exceed the amount that original line actually collected
    replaced_by: it is never less than nothing and never more than the money settled in advance
  trigger: on_request
  subject:
  - drive_refund_payout
  computes: refund_amount_usd
  target_tool: post_cancellation_refund_344e0f66
  params:
