- id: drive_cancellation
  subject:
  - drive_cancel
  - drive_cancellation_charge
  rule: Only the renter may cancel their own confirmed rental, and the cancellation is confirmed by the renter rather than performed on their behalf. A cancellation is handled free of charge only when frozen
    time is not after the moment the supplier confirmed the renter's booking plus the free-cancellation term of the rate class booked. The free-cancellation term is counted in whole elapsed hours from the
    confirmation moment, never mixing elapsed hours with calendar days, and a cancellation confirmed exactly at the boundary is still free. Inside the free-cancellation term nothing is withheld on any rate
    class and the prepayment is returned in full. Outside it the charge is read off the rate class's cancellation ladder by how many whole days lie between the cancellation and the scheduled collection;
    where the ladder yields nothing the class's flat cancellation charge applies instead, and the two are never added. A class that returns nothing withholds the whole prepayment, and the agency service
    fee is not returned on any class. A cancellation made because the supplier itself cannot provide the vehicle is free on every class, whatever the ladder says. A cancellation after the scheduled collection
    time has passed is not a cancellation but a no-show, and the no-show terms apply instead.
