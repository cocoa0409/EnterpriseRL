    included_miles_total: included_mileage_per_day * rental_days
- id: drive_fuel
  subject:
  - drive_fuel_charge
  rule: 'The fuel arrangement is the rate class''s own: a full-to-full class expects the vehicle back with a full tank, a same-to-same class expects it back at the level it left with, and a prepaid class
    sells the tank in advance at the class''s own price per gallon. A fuel settlement is raised only while the rental record stands at picked up or returned. Where a full-to-full or same-to-same vehicle
    comes back short, the missing fuel is charged at the class''s price per gallon and the class''s refuelling service charge is added once. Where a prepaid class vehicle comes back with fuel still in it,
    nothing is returned, because the tank was sold and not lent. A renter who refuels at a filling station and keeps the receipt is charged nothing at all, whatever the class, provided the tank meets the
    class''s expectation. The refuelling service charge is never charged twice on one rental, and never where the shortfall is less than a quarter of a gallon.'
