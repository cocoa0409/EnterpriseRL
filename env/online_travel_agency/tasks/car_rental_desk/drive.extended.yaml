- id: drive_mileage
  subject:
  - drive_mileage_grant
  - drive_mileage_use
  - drive_return
  rule: A rate class with unlimited mileage grants no allowance and charges for no mile however far the vehicle is driven. Every other class grants its included miles for each booked rental day at collection,
    in one grant covering the whole rental rather than day by day. The renter states in this conversation the odometer reading shown when they handed the vehicle back. At return the miles actually driven
    are taken off the allowance in one movement, measured by the difference between the odometer readings recorded at collection and at return. Miles driven beyond the allowance are charged at the class's
    excess rate per mile, rounded to the whole mile, and a rental that returns under its allowance is refunded nothing for the miles unused. Where the rental is extended, the allowance grows by the class's
    included miles for each additional day, granted at the moment the extension is agreed. A vehicle returned without an odometer reading is charged excess mileage on the supplier's own measurement, and
    the renter may dispute it through a review rather than at the counter.
  eligibility:
  - id: odometer_reading_stated
    applies_to:
    - drive_mileage_use
    kind: caller_fact
    condition: The renter states in this conversation the odometer reading shown when they handed the vehicle back.
    evidence_fields:
    - drive_rental_entries.miles_delta
    - drive_rental_entries.drive_rental_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - drive_rental_entries.drive_rental_id
      action_bindings:
        drive_rental_entries.drive_rental_id: drive_rental_id
  params:
    rounding: whole miles
    per_tier:
      Pay Now Saver Rate:
        included_mileage_per_day: =included_mileage_per_day
        unlimited_mileage: =unlimited_mileage
        excess_mileage_fee_per_mile_usd: =excess_mileage_fee_per_mile_usd
      Pay Now Standard Rate:
        included_mileage_per_day: =included_mileage_per_day
        unlimited_mileage: =unlimited_mileage
        excess_mileage_fee_per_mile_usd: =excess_mileage_fee_per_mile_usd
      Pay At Counter Flex Rate:
        included_mileage_per_day: =included_mileage_per_day
        unlimited_mileage: =unlimited_mileage
        excess_mileage_fee_per_mile_usd: =excess_mileage_fee_per_mile_usd
      Inclusive Flex Rate:
        included_mileage_per_day: =included_mileage_per_day
        unlimited_mileage: =unlimited_mileage
        excess_mileage_fee_per_mile_usd: =excess_mileage_fee_per_mile_usd
      Premium Inclusive Rate:
        included_mileage_per_day: =included_mileage_per_day
        unlimited_mileage: =unlimited_mileage
        excess_mileage_fee_per_mile_usd: =excess_mileage_fee_per_mile_usd
