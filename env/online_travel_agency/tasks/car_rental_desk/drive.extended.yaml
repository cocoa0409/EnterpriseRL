  - drive_rate_charge
  - drive_extras_charge
  rule: The rental rate is charged day by day at the rate class's own daily rate, with the weekly rate substituted whenever seven or more consecutive days are booked and the weekend rate applied to Saturdays
    and Sundays within a rental of fewer than seven days. An optional item is sold only while the rental record stands at confirmed or picked up. A vehicle kept beyond the booked return is charged the class's
    extra-hour fee for each hour past its grace period, and once the hours charged reach the class's extra-day rate the extra day is charged instead of further hours. Additional drivers beyond the class's
    free count are charged per driver per rental day, and a driver never named on the agreement is not insured at all. The collision damage waiver, theft protection, personal accident cover and roadside
    assistance are included or charged per rental day exactly as the class prescribes, and a product included in the class is never also charged. Satellite navigation, child seats, snow chains and ski racks
