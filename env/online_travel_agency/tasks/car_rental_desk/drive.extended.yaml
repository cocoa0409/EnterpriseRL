  inputs:
    history:
    - table: drive_rental_entries
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        event_type: drive_prepay_charge
    - table: drive_rental_entries
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        event_type: drive_extras_charge
    cross_category:
