events:
- type: stay_reserve
  target: stay_reservations
  mutation: create
  meaning: A guest reserves rooms at a property on a chosen rate plan.
  grain: One row per hotel reservation opened, whatever the number of rooms on it.
  fields:
    stay_reservation_id: reference of the new reservation
    customer_id: guest who owns it
    variant_name: rate plan sold
    status: the reservation opens as merely reserved
    confirmation_number: property confirmation number returned
    property_code: property the rooms are held at
    property_city: city the property stands in
    check_in_date: arrival date
    check_out_date: departure date
    nights_count: nights covered
    rooms_count: rooms held
    adults_count: adults declared
    children_count: children declared
    booked_date: date the reservation was made
    guest_name: lead guest named on the reservation
    contact_email: contact address for arrival instructions
    contact_phone: contact number for the property
    corporate_program_id: corporate programme the reservation is made under, empty on a leisure booking
  triggers: []
- type: stay_confirm
  target: stay_reservations
  mutation:
    transition:
      from: reserved
      to: confirmed
  meaning: The property accepts the reservation and it becomes binding on both sides.
  grain: One row per reservation, at the moment the property confirms it.
  fields:
    stay_reservation_id: reservation being confirmed
    status: the reservation becomes confirmed
    confirmed_at: moment of confirmation
    refund_form: form in which value will be returned if the guest cancels
  triggers:
  - event: stay:stay_deposit_charge
    map:
      stay_reservation_id: stay_reservation_id
      charge_category: deposit
      reason_code: routine_stay
  - event: club:club_points_accrual
    map:
      customer_id: customer_id
      accrual_source: stay_night
- type: stay_cancel
  target: stay_reservations
  mutation:
    transition:
      from: confirmed
      to: cancelled
  meaning: The guest cancels their own confirmed reservation.
  grain: One row per reservation, at the moment the guest confirms the cancellation.
  fields:
    stay_reservation_id: reservation being cancelled
    status: the reservation becomes cancelled
    cancelled_at: moment the guest confirmed
    refund_form: form in which value will be returned under the rate plan booked
  triggers:
  - event: stay:stay_cancellation_charge
    map:
      stay_reservation_id: stay_reservation_id
      charge_category: cancellation_penalty
      reason_code: guest_cancellation
- type: stay_no_show
  target: stay_reservations
  mutation:
    transition:
      from: confirmed
      to: no_show
  meaning: The guest never arrives and the property releases the room.
  grain: One row per reservation, at the moment the property records the no-show.
  fields:
    stay_reservation_id: reservation recorded as a no-show
    status: the reservation becomes a no-show
  triggers:
  - event: stay:stay_no_show_charge
    map:
      stay_reservation_id: stay_reservation_id
      charge_category: no_show_penalty
      reason_code: guest_no_show
- type: stay_check_in
  target: stay_reservations
  mutation:
    transition:
      from: confirmed
      to: checked_in
  meaning: The guest arrives and the stay begins.
  grain: One row per reservation, at the moment the guest checks in.
  fields:
    stay_reservation_id: reservation being checked in
    status: the reservation becomes checked in
  triggers:
  - event: stay:stay_room_charge
    map:
      stay_reservation_id: stay_reservation_id
      charge_category: room_night
      reason_code: routine_stay
  - event: stay:stay_resort_credit_grant
    map:
      stay_reservation_id: stay_reservation_id
      charge_category: resort_credit_grant
      reason_code: routine_stay
- type: stay_check_out
  target: stay_reservations
  mutation:
    transition:
      from: checked_in
      to: checked_out
  meaning: The guest departs and the folio is closed off.
  grain: One row per reservation, at the moment the guest checks out.
  fields:
    stay_reservation_id: reservation being checked out
    status: the reservation becomes checked out
    checked_out_date: date the guest departed
    folio_balance_usd: folio total settled at departure
  triggers: []
- type: stay_guest_amend
  target: stay_reservations
  mutation: update
  meaning: The lead guest name or the contact details on a reservation are corrected.
  grain: One row per reservation, each time its guest or contact details are corrected.
  fields:
    stay_reservation_id: reservation being corrected
    guest_name: corrected lead guest name
    contact_email: corrected contact address
    contact_phone: corrected contact number
  triggers: []
- type: stay_room_charge
  target: stay_folio_entries
  meaning: A night of the room rate is posted to the guest's folio.
  grain: One row per room per night charged on the reservation.
  distinguish_by:
  - charge_category
  - room_sequence
  - night_sequence
