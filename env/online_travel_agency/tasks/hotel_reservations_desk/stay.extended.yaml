measures:
- id: stay_msr_cancellations_12m
  window: rolling 12 months ending on the handling date, counted back day by day from the frozen handling date
  measure: count of stay_cancellation_charge rows across the guest's reservations
- id: stay_msr_room_nights_12m
  window: rolling 12 months ending on the handling date, counted back day by day from the frozen handling date
  measure: count of stay_room_charge rows across the guest's reservations
policies:
- id: stay_agg_multi_holding
  subject:
  - stay_reserve
  rule: 'A guest may hold any number of hotel reservations at the same time, including several at the same property on overlapping dates, and each reservation carries its own rate plan and its own folio. Where two reservations at the same property overlap in dates and name the same lead guest, the later reservation is opened and then referred for duplicate review, because properties treat duplicate rooms as a single guarantee. Rooms are never moved between reservations: a guest who wants fewer rooms cancels the rooms on the reservation they stand on, and each room follows that reservation''s own rate plan. Rate plans are never mixed on one reservation; a guest who wants different terms for different rooms holds two reservations.'
  eligibility: []
  params:
    max_per_customer: null
    duplicate_review_property_match: true
- id: stay_agg_portfolio_occupancy
  subject:
  - stay_room_charge
  rule: 'Where a guest holds several reservations that overlap in dates, the rate plans are not combined: each reservation is priced, taxed and penalised entirely on its own terms. The only figure aggregated across reservations is the guest''s own room-night history, which decides whether the repeat-cancellation review is triggered and whether a goodwill gesture is within the desk''s authority. A guest whose cancellations in the last twelve months exceed the review threshold is referred to the property desk before any further discretionary concession is given. Occupancy limits, extra-occupant charges and cot or rollaway charges are counted per room and never across the portfolio. Club discounts and corporate rates are likewise applied reservation by reservation, and a discount earned on one reservation is never spread across another.'
  eligibility: []
  params:
    repeat_cancellation_review_threshold_12m: 4
  measures:
  - stay_msr_cancellations_12m
  - stay_msr_room_nights_12m
- id: stay_booking_terms
  subject:
  - stay_reserve
  - stay_confirm
  rule: A rate plan may only be sold when the arrival date is at least its advance-purchase distance away, when the stay length falls between its minimum and maximum nights, when the arrival falls inside its booking window, and when the number of rooms is at or below its ceiling. A request at or above the rate plan's group threshold is not taken under this charter and is passed to the group desk. The reservation is merely held until the property confirms it; an unconfirmed reservation binds nobody and is released without charge. The occupancy declared at booking is the occupancy the room is priced for, and children at or below the rate plan's free age limit are not counted as extra occupants. The agency service fee is charged once per reservation at the moment the property confirms, and is not multiplied by the number of rooms. Where the guest elects to be charged in a currency other than the property's own, the rate plan's conversion markup is added and disclosed before the card is taken.
  eligibility: []
  params:
    per_tier:
      Non-Refundable Saver Rate:
        advance_purchase_days: =advance_purchase_days
        min_nights: =min_nights
        max_nights: =max_nights
        booking_window_days: =booking_window_days
        max_rooms_per_reservation: =max_rooms_per_reservation
        group_min_rooms: =group_min_rooms
        child_age_free_limit: =child_age_free_limit
        agency_service_fee_usd: =agency_service_fee_usd
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Advance Purchase 21 Rate:
        advance_purchase_days: =advance_purchase_days
        min_nights: =min_nights
        max_nights: =max_nights
        booking_window_days: =booking_window_days
        max_rooms_per_reservation: =max_rooms_per_reservation
        group_min_rooms: =group_min_rooms
        child_age_free_limit: =child_age_free_limit
        agency_service_fee_usd: =agency_service_fee_usd
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Semi-Flexible Rate:
        advance_purchase_days: =advance_purchase_days
        min_nights: =min_nights
        max_nights: =max_nights
        booking_window_days: =booking_window_days
        max_rooms_per_reservation: =max_rooms_per_reservation
        group_min_rooms: =group_min_rooms
        child_age_free_limit: =child_age_free_limit
        agency_service_fee_usd: =agency_service_fee_usd
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Standard Flexible Rate:
        advance_purchase_days: =advance_purchase_days
        min_nights: =min_nights
        max_nights: =max_nights
        booking_window_days: =booking_window_days
        max_rooms_per_reservation: =max_rooms_per_reservation
