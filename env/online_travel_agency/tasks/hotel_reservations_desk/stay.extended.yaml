    folio_balance: Where more than one prepayment line stands on the reservation and the folio balance is smaller than the prepayment still held, the settlement is capped at the folio balance; where more than one prepayment line stands on the reservation and the folio balance is at least the prepayment still held, the settlement is capped at the prepayment still held; and in every other case the settlement is capped at what the single prepayment line standing on the reservation actually collected.
    payout_ceiling: Where more than one prepayment line stands on the reservation and the folio balance is smaller than the prepayment still held, the settlement is capped at the folio balance; where more than one prepayment line stands on the reservation and the folio balance is at least the prepayment still held, the settlement is capped at the prepayment still held; and in every other case the settlement is capped at what the single prepayment line standing on the reservation actually collected.
    result: The settlement is finally capped at what the single prepayment line standing on the reservation actually collected, and never falls below nothing.
