- id: stay_ext_resort_credit_application
  base_policy_refs:
  - stay_resort_credit
  - stay_incidentals
  overwrite:
  - base_policy: stay_resort_credit
    superseded_clause: Property credit included in the rate plan is placed on the reservation at check-in, for the plan's amount per stay and not per night.
    replaced_by: Where the folio carries a property credit grant for every room held and the rate plan booked lets a companion sharing the room spend the credit, the credit standing is the grants posted taken together with whatever has already been drawn against them, the plan's amount answering for each room the party occupies
  trigger: state_due
  subject:
  - stay_resort_credit_use
  computes: credit_applied_usd
  target_tool: spend_resort_credit_ff384f87
  params:
    minibar_counted_pct: 100
    minibar_ignored_pct: 0
    credit_available_full_pct: 100
    credit_available_none_pct: 0
  rule: 'This rule settles how much property credit a guest draws down against what they have taken at the property. The credit standing is the largest single grant posted on the reservation together with whatever has already been drawn against it, which is carried as a negative figure. 0 percent of the credit standing is available. 0 percent of the minibar charges posted is counted as a charge the credit may be spent against. The eligible spend is nothing. The credit drawn down is the smaller of the credit available and the eligible spend, and is never less than nothing. Every figure is rounded to two decimal places as it is worked out, and the credit drawn down is rounded the same way. Where the folio carries a property credit grant for every room held and the rate plan booked lets a companion sharing the room spend the credit, the credit standing is the grants posted taken together with whatever has already been drawn against them, the plan''s amount answering for each room the party
    occupies; where the folio carries a property credit grant for every room held and the rate plan booked does not let a companion spend the credit, the credit standing is the largest single grant posted together with whatever has already been drawn against it, which is the grant answering for the lead guest''s own room; and in every other case the credit standing is the largest single grant posted together with whatever has already been drawn against it. Where the handling date is no later than the arrival date plus the credit validity term the rate plan booked carries and the reservation stands at checked in, 100 percent of the credit standing is available; where the handling date is later than the arrival date plus that validity term and the reservation stands at checked in, 0 percent of the credit standing is available; and in every other case 0 percent of the credit standing is available. Where the folio carries minibar charges and the rate plan booked includes all meals, 0 percent
    of the minibar charges posted is counted as a charge the credit may be spent against; where the folio carries minibar charges and the rate plan booked does not include all meals, 100 percent of them is counted; and where the folio carries no minibar charge, 0 percent is counted. Where counted charges taken at the property stand against more than one occupant of the room and the reservation declares more adults than the rooms held, the eligible spend is every counted charge taken at the property, whoever took it; where counted charges taken at the property stand against more than one occupant of the room and the reservation declares no more adults than the rooms held, the eligible spend is only the counted charges standing against the lead guest''s own occupant sequence; and in every other case the eligible spend is nothing.

    '
  prerequisite: []
  cross_category: []
  compute:
  - rooms_held: F('rooms_count')
  - adults_declared: F('adults_count')
  - grant_posted: SUM('stay_folio_entries','amount_usd', charge_category='resort_credit_grant')
  - grant_rooms: MAX('stay_folio_entries','room_sequence', charge_category='resort_credit_grant')
  - lead_grant: MAX('stay_folio_entries','amount_usd', charge_category='resort_credit_grant')
  - credit_drawn_already: SUM('stay_folio_entries','amount_usd', charge_category='resort_credit_use')
  - credit_standing: (RND(grant_posted + credit_drawn_already, 2) if (grant_rooms >= rooms_held and P('resort_credit_transferable')) else (RND(lead_grant + credit_drawn_already, 2) if (grant_rooms >= rooms_held and not P('resort_credit_transferable')) else RND(lead_grant + credit_drawn_already, 2)))
  - credit_valid_days: DAYS(F('check_in_date'), NOW)
  - availability_pct: (K('credit_available_full_pct') if (credit_valid_days <= P('resort_credit_validity_days') and F('status') == 'checked_in') else (K('credit_available_none_pct') if (credit_valid_days > P('resort_credit_validity_days') and F('status') == 'checked_in') else K('credit_available_none_pct')))
  - credit_available: RND(credit_standing * availability_pct / 100.0, 2)
  - minibar_posted: SUM('stay_folio_entries','amount_usd', charge_category='incidental_minibar')
  - minibar_counted_pct: (K('minibar_ignored_pct') if (minibar_posted > 0 and P('all_inclusive')) else (K('minibar_counted_pct') if (minibar_posted > 0 and not P('all_inclusive')) else K('minibar_ignored_pct')))
  - minibar_occupants: MAX('stay_folio_entries','guest_sequence', charge_category='incidental_minibar')
  - lead_guest_minibar: SUM('stay_folio_entries','amount_usd', charge_category='incidental_minibar', guest_sequence=1)
  - eligible_spend: (RND(minibar_posted * minibar_counted_pct / 100.0, 2) if (minibar_occupants > 1 and adults_declared > rooms_held) else (RND(lead_guest_minibar * minibar_counted_pct / 100.0, 2) if (minibar_occupants > 1 and adults_declared <= rooms_held) else 0.0))
  - result: RND(MX(0.0, MN(credit_available, eligible_spend)), 2)
  compute_basis:
    grant_posted: The credit standing is the largest single grant posted on the reservation together with whatever has already been drawn against it, which is carried as a negative figure.
    credit_drawn_already: The credit standing is the largest single grant posted on the reservation together with whatever has already been drawn against it, which is carried as a negative figure.
    credit_standing: Where the folio carries a property credit grant for every room held and the rate plan booked lets a companion sharing the room spend the credit, the credit standing is the grants posted taken together with whatever has already been drawn against them, the plan's amount answering for each room the party occupies; where the folio carries a property credit grant for every room held and the rate plan booked does not let a companion spend the credit, the credit standing is the largest single grant posted together with whatever has already been drawn against it, which is the grant answering for the lead guest's own room; and in every other case the credit standing is the largest single grant posted together with whatever has already been drawn against it.
    credit_valid_days: Where the handling date is no later than the arrival date plus the credit validity term the rate plan booked carries and the reservation stands at checked in, 100 percent of the credit standing is available; where the handling date is later than the arrival date plus that validity term and the reservation stands at checked in, 0 percent of the credit standing is available; and in every other case 0 percent of the credit standing is available.
    availability_pct: Where the handling date is no later than the arrival date plus the credit validity term the rate plan booked carries and the reservation stands at checked in, 100 percent of the credit standing is available; where the handling date is later than the arrival date plus that validity term and the reservation stands at checked in, 0 percent of the credit standing is available; and in every other case 0 percent of the credit standing is available.
    credit_available: 0 percent of the credit standing is available.
    minibar_posted: Where the folio carries minibar charges and the rate plan booked includes all meals, 0 percent of the minibar charges posted is counted as a charge the credit may be spent against; where the folio carries minibar charges and the rate plan booked does not include all meals, 100 percent of them is counted; and where the folio carries no minibar charge, 0 percent is counted.
    minibar_counted_pct: Where the folio carries minibar charges and the rate plan booked includes all meals, 0 percent of the minibar charges posted is counted as a charge the credit may be spent against; where the folio carries minibar charges and the rate plan booked does not include all meals, 100 percent of them is counted; and where the folio carries no minibar charge, 0 percent is counted.
    lead_guest_minibar: Where counted charges taken at the property stand against more than one occupant of the room and the reservation declares more adults than the rooms held, the eligible spend is every counted charge taken at the property, whoever took it; where counted charges taken at the property stand against more than one occupant of the room and the reservation declares no more adults than the rooms held, the eligible spend is only the counted charges standing against the lead guest's own occupant sequence; and in every other case the eligible spend is nothing.
    eligible_spend: Where counted charges taken at the property stand against more than one occupant of the room and the reservation declares more adults than the rooms held, the eligible spend is every counted charge taken at the property, whoever took it; where counted charges taken at the property stand against more than one occupant of the room and the reservation declares no more adults than the rooms held, the eligible spend is only the counted charges standing against the lead guest's own occupant sequence; and in every other case the eligible spend is nothing.
    result: The credit drawn down is the smaller of the credit available and the eligible spend, and is never less than nothing.
