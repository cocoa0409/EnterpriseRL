- id: stay_deposit_and_prepayment
  subject:
  - stay_deposit_charge
  rule: A rate plan that requires prepayment takes its prepayment share of the room total at the moment the property confirms, and a plan that does not takes its deposit expressed in room nights instead. A deposit is measured on the room rate alone, before taxes and before any mandatory facility fee; those are settled at the property unless the plan is prepaid in full. A prepaid reservation is charged in the currency the property publishes, and a conversion the guest elects carries the plan's markup. Where the property declines the card, the reservation stays merely reserved and is released when the hold lapses; a reservation is never confirmed against an unpaid deposit. A deposit already taken is applied against the first night's room charge at check-in and is never treated as a separate payment to be refunded afterwards. Where the guest later cancels, the deposit is the first money the cancellation penalty is withheld from.
  eligibility: []
  params:
    deposit_basis: room rate before taxes and mandatory fees
    per_tier:
      Non-Refundable Saver Rate:
        prepayment_required: =prepayment_required
        prepayment_pct: =prepayment_pct
        deposit_nights: =deposit_nights
      Advance Purchase 21 Rate:
        prepayment_required: =prepayment_required
        prepayment_pct: =prepayment_pct
        deposit_nights: =deposit_nights
      Semi-Flexible Rate:
        prepayment_required: =prepayment_required
        prepayment_pct: =prepayment_pct
        deposit_nights: =deposit_nights
      Standard Flexible Rate:
        prepayment_required: =prepayment_required
        prepayment_pct: =prepayment_pct
        deposit_nights: =deposit_nights
      Member Flex Rate:
        prepayment_required: =prepayment_required
        prepayment_pct: =prepayment_pct
        deposit_nights: =deposit_nights
      Suite Flexible Rate:
        prepayment_required: =prepayment_required
        prepayment_pct: =prepayment_pct
        deposit_nights: =deposit_nights
      All-Inclusive Flex Rate:
        prepayment_required: =prepayment_required
        prepayment_pct: =prepayment_pct
        deposit_nights: =deposit_nights
- id: stay_cancellation
  subject:
  - stay_cancel
  - stay_cancellation_charge
  rule: Only the guest may cancel their own confirmed reservation, and the cancellation is confirmed by the guest rather than performed on their behalf. The guest states in this conversation which of the rooms on the reservation they are giving up. A cancellation is handled free of penalty only when frozen time is not after the moment the guest's reservation was confirmed by the property plus the free-cancellation term of the rate plan booked. The free-cancellation term is counted in whole elapsed hours from the confirmation moment, never mixing elapsed hours with calendar days, and a cancellation confirmed exactly at the boundary is still free. Inside the free-cancellation term nothing is withheld on any rate plan, and the deposit or prepayment is returned in full. Outside it the penalty is read off the rate plan's cancellation ladder by how many whole days lie between the cancellation and the arrival date; where the ladder is silent the plan's flat share of the room total applies, and
    where the plan expresses its penalty in room nights those nights are taken at the booked rate. A plan that returns nothing withholds the whole room total and returns only the taxes the property itself does not keep. A cancellation of some but not all rooms is penalised room by room on the rooms given up, and the remaining rooms keep their original terms. The agency service fee is not returned on cancellation, because the booking service it pays for has already been performed.
  eligibility:
  - id: rooms_given_up_stated
    applies_to:
    - stay_cancel
    kind: caller_fact
    condition: The guest states in this conversation which of the rooms on the reservation they are giving up.
    evidence_fields:
    - stay_reservations.rooms_count
    - stay_reservations.stay_reservation_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - stay_reservations.stay_reservation_id
      action_bindings:
        stay_reservations.stay_reservation_id: stay_reservation_id
  - id: inside_free_cancellation
    applies_to:
    - stay_cancel
    kind: time
    condition: A cancellation is handled free of penalty only when frozen time is not after the moment the guest's reservation was confirmed by the property plus the free-cancellation term of the rate plan booked.
    evidence_fields:
    - stay_reservations.confirmed_at
    - stay_reservations.stay_reservation_id
    - stay_reservations.check_in_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - stay_reservations.stay_reservation_id
      action_bindings:
        stay_reservations.stay_reservation_id: stay_reservation_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the guest's reservation was confirmed by the property
      anchor_source: stay_reservations.confirmed_at
      relation: not_after
      duration_source: variants.free_cancellation_hours_before_checkin
      unit: elapsed_hours
      counting_rule: The free-cancellation term is counted in whole elapsed hours from the confirmation moment, never mixing elapsed hours with calendar days, and a cancellation confirmed exactly at the boundary is still free.
      boundary: inclusive
  params:
    per_tier:
      Non-Refundable Saver Rate:
        free_cancellation_hours_before_checkin: =free_cancellation_hours_before_checkin
        cancellation_penalty_nights: =cancellation_penalty_nights
        cancellation_penalty_pct: =cancellation_penalty_pct
        cancellation_ladder_pct: =cancellation_ladder_pct
        refund_form: =refund_form
      Advance Purchase 21 Rate:
        free_cancellation_hours_before_checkin: =free_cancellation_hours_before_checkin
        cancellation_penalty_nights: =cancellation_penalty_nights
        cancellation_penalty_pct: =cancellation_penalty_pct
        cancellation_ladder_pct: =cancellation_ladder_pct
