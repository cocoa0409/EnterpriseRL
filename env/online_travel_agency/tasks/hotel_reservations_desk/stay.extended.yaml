- id: stay_club_and_corporate_interaction
  subject:
  - stay_room_charge
  - stay_incidental_charge
  rule: 'Holding an active traveller club membership changes what this reservation is charged: the club tier held on the arrival date decides the hotel discount applied to the room rate and whether late departure is guaranteed, and the rate plan''s own terms decide everything else. A club discount and a corporate programme rate are mutually exclusive on one reservation: where the reservation carries a corporate programme reference the negotiated rate stands alone and no club discount is applied on top of it. A rate plan that is not eligible for a corporate rate may still be booked under a programme, but at its public price. Club points accrue on the room total actually paid, at the earn rate of the rate plan booked, and never on taxes, the facility fee, optional extras or the agency service fee. Where the member''s tier changes between booking and arrival, the discount applied at booking stands and is neither topped up nor clawed back. A membership that is suspended or lapsed on the arrival
    date carries no discount and no guaranteed late departure, whatever tier it shows.'
