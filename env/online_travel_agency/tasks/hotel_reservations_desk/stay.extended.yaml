    ladder:
    - when: an active traveller club membership carrying a hotel rate discount stands in the guest's name and the reservation carries no corporate programme reference
      value: CPARAM('club','hotel_rate_discount_pct')
    - when: an active traveller club membership stands in the guest's name and the reservation carries a corporate programme reference
      value: K('no_discount_pct')
    - when: otherwise
      value: K('no_discount_pct')
