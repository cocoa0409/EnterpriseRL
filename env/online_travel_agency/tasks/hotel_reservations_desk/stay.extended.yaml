- id: stay_ext_occupancy_supplement
  base_policy_refs:
  - stay_agg_portfolio_occupancy
  - stay_room_and_occupancy
  - stay_club_and_corporate_interaction
  - stay_booking_terms
  overwrite:
  - base_policy: stay_room_and_occupancy
    superseded_clause: An occupant beyond the rate plan's standard occupancy is charged the plan's extra-adult or extra-child amount for every night they stay, counted per room.
    replaced_by: The supplement is the per-night supplement rate multiplied by the occupants beyond standard occupancy and by the nights charged.
  trigger: state_due
  subject:
  - stay_room_charge
  computes: extra_occupant_charge_usd
  target_tool: post_occupancy_supplement_f6d09258
  params:
    breakfast_plan_standard_adults: 2
    default_standard_adults: 3
  rule: 'This rule settles the supplement charged for occupants beyond the standard occupancy of the rooms a guest holds. The standard occupancy is 3 adults a room. The occupants the supplement is counted for are the occupants the folio''s charges stand against, taken as the highest occupant sequence the folio shows. The occupants beyond standard occupancy are the occupants the supplement is counted for less the standard occupancy multiplied by the rooms held on the reservation, and never fewer than none. The nights of the stay already covered on the folio are taken as the highest night sequence the folio''s room lines carry. The nights charged are the nights the reservation covers. The per-night supplement rate is the extra-adult amount the rate plan booked carries. The supplement is the per-night supplement rate multiplied by the occupants beyond standard occupancy and by the nights charged. The supplement is never less than nothing, and the figure is rounded to two decimal places as it
    is worked out and again at the end. Where the rate plan booked includes breakfast and the prepayment lines posted on the reservation cover more than one room the standard occupancy is 2 adults a room; where the rate plan booked includes breakfast and the prepayment lines posted cover one room the standard occupancy is 3 adults a room; and where the rate plan booked does not include breakfast the standard occupancy is 3 adults a room. Where the folio carries charges standing against more than one occupant of a room and the adults declared on the reservation exceed the standard occupancy of the rooms held, the occupants the supplement is counted for are every adult declared on the reservation; where the folio carries charges standing against one occupant at most and the adults declared exceed the standard occupancy of the rooms held, they are the occupants the folio''s charges stand against; and in every other case they are the occupants the folio''s charges stand against. Where the nights
    of the stay already covered on the folio are fewer than the nights the reservation covers and the reservation stands at checked in, the supplement is charged for the nights already covered; where the nights already covered are fewer than the nights the reservation covers and the reservation stands at checked out, the supplement is charged for every night the reservation covers; and in every other case the supplement is charged for every night the reservation covers. Where an occupant stands beyond the standard occupancy, the folio carries no rollaway charge already posted and the rate plan booked charges for a rollaway bed, the per-night supplement rate is the plan''s extra-adult amount together with its rollaway amount per night; where an occupant stands beyond the standard occupancy and the folio already carries a rollaway charge, the per-night supplement rate is the plan''s extra-adult amount alone; and in every other case the per-night supplement rate is the plan''s extra-adult amount
    alone.

    '
  prerequisite: []
  cross_category: []
  compute:
  - rooms_held: F('rooms_count')
  - adults_declared: F('adults_count')
  - nights_count: F('nights_count')
  - deposit_rooms: MAX('stay_folio_entries','room_sequence', charge_category='deposit')
  - standard_adults_per_room: (K('breakfast_plan_standard_adults') if (P('breakfast_included') and deposit_rooms > 1) else (K('default_standard_adults') if (P('breakfast_included') and deposit_rooms <= 1) else K('default_standard_adults')))
  - folio_occupants: MAX('stay_folio_entries','guest_sequence', charge_category='incidental_minibar')
  - counted_adults: (adults_declared if (folio_occupants > 1 and adults_declared > standard_adults_per_room * rooms_held) else (folio_occupants if (folio_occupants <= 1 and adults_declared > standard_adults_per_room * rooms_held) else folio_occupants))
  - extra_adults: MX(0.0, counted_adults - standard_adults_per_room * rooms_held)
  - folio_nights: MAX('stay_folio_entries','night_sequence', charge_category='room_night')
  - nights_charged: (folio_nights if (folio_nights < nights_count and F('status') == 'checked_in') else (nights_count if (folio_nights < nights_count and F('status') == 'checked_out') else nights_count))
  - rollaway_posted: COUNT('stay_folio_entries', charge_category='rollaway')
  - rollaway_rate: P('rollaway_fee_per_night_usd')
  - per_night_rate: (RND(P('extra_adult_fee_per_night_usd') + rollaway_rate, 2) if (extra_adults > 0 and rollaway_posted <= 0 and P('rollaway_fee_per_night_usd') > 0) else (P('extra_adult_fee_per_night_usd') if (extra_adults > 0 and rollaway_posted > 0) else P('extra_adult_fee_per_night_usd')))
  - result: RND(MX(0.0, per_night_rate * extra_adults * nights_charged), 2)
  compute_basis:
    deposit_rooms: Where the rate plan booked includes breakfast and the prepayment lines posted on the reservation cover more than one room the standard occupancy is 2 adults a room; where the rate plan booked includes breakfast and the prepayment lines posted cover one room the standard occupancy is 3 adults a room; and where the rate plan booked does not include breakfast the standard occupancy is 3 adults a room.
    standard_adults_per_room: Where the rate plan booked includes breakfast and the prepayment lines posted on the reservation cover more than one room the standard occupancy is 2 adults a room; where the rate plan booked includes breakfast and the prepayment lines posted cover one room the standard occupancy is 3 adults a room; and where the rate plan booked does not include breakfast the standard occupancy is 3 adults a room.
    folio_occupants: Where the folio carries charges standing against more than one occupant of a room and the adults declared on the reservation exceed the standard occupancy of the rooms held, the occupants the supplement is counted for are every adult declared on the reservation; where the folio carries charges standing against one occupant at most and the adults declared exceed the standard occupancy of the rooms held, they are the occupants the folio's charges stand against; and in every other case they are the occupants the folio's charges stand against.
    counted_adults: Where the folio carries charges standing against more than one occupant of a room and the adults declared on the reservation exceed the standard occupancy of the rooms held, the occupants the supplement is counted for are every adult declared on the reservation; where the folio carries charges standing against one occupant at most and the adults declared exceed the standard occupancy of the rooms held, they are the occupants the folio's charges stand against; and in every other case they are the occupants the folio's charges stand against.
    extra_adults: The occupants beyond standard occupancy are the occupants the supplement is counted for less the standard occupancy multiplied by the rooms held on the reservation, and never fewer than none.
    folio_nights: The nights of the stay already covered on the folio are taken as the highest night sequence the folio's room lines carry.
    nights_charged: Where the nights of the stay already covered on the folio are fewer than the nights the reservation covers and the reservation stands at checked in, the supplement is charged for the nights already covered; where the nights already covered are fewer than the nights the reservation covers and the reservation stands at checked out, the supplement is charged for every night the reservation covers; and in every other case the supplement is charged for every night the reservation covers.
    rollaway_posted: Where an occupant stands beyond the standard occupancy, the folio carries no rollaway charge already posted and the rate plan booked charges for a rollaway bed, the per-night supplement rate is the plan's extra-adult amount together with its rollaway amount per night; where an occupant stands beyond the standard occupancy and the folio already carries a rollaway charge, the per-night supplement rate is the plan's extra-adult amount alone; and in every other case the per-night supplement rate is the plan's extra-adult amount alone.
    rollaway_rate: Where an occupant stands beyond the standard occupancy, the folio carries no rollaway charge already posted and the rate plan booked charges for a rollaway bed, the per-night supplement rate is the plan's extra-adult amount together with its rollaway amount per night; where an occupant stands beyond the standard occupancy and the folio already carries a rollaway charge, the per-night supplement rate is the plan's extra-adult amount alone; and in every other case the per-night supplement rate is the plan's extra-adult amount alone.
    per_night_rate: Where an occupant stands beyond the standard occupancy, the folio carries no rollaway charge already posted and the rate plan booked charges for a rollaway bed, the per-night supplement rate is the plan's extra-adult amount together with its rollaway amount per night; where an occupant stands beyond the standard occupancy and the folio already carries a rollaway charge, the per-night supplement rate is the plan's extra-adult amount alone; and in every other case the per-night supplement rate is the plan's extra-adult amount alone.
    result: The supplement is never less than nothing, and the figure is rounded to two decimal places as it is worked out and again at the end.
  factors:
  - id: standard_occupancy
    effect: parameter
    decides: standard_adults_per_room
    bindings:
    - deposit_rooms
    - standard_adults_per_room
    ladder:
    - when: the rate plan booked includes breakfast and the prepayment lines posted on the reservation cover more than one room
      value: K('breakfast_plan_standard_adults')
    - when: the rate plan booked includes breakfast and the prepayment lines posted cover one room
      value: K('default_standard_adults')
    - when: otherwise
