    prepayment_held: Where the prepayment lines posted on the reservation outnumber the rooms standing on it and the rate plan booked takes the whole stay at booking, the prepayment still held is the booked nightly rate multiplied by the nights the reservation covers and by the rooms standing on it; where the prepayment lines posted outnumber the rooms standing and the rate plan booked takes a deposit expressed in room nights, the prepayment still held is the booked nightly rate multiplied by the deposit nights the rate plan carries and by the rooms standing on the reservation; and in every other case the prepayment still held is every prepayment line posted on the reservation.
    penalty_withheld: The amount returned to the card is settled only after the folio carries the cancellation penalty withheld on every room given up.
    withheld_applied: Where the rate plan booked returns value to the original form of payment and a cancellation penalty already stands on the folio, the whole amount withheld is deducted from the settlement; where the rate plan booked returns value as credit at the property and a cancellation penalty already stands on the folio, the deduction is the whole prepayment still held; and where no cancellation penalty stands on the folio nothing is deducted.
    tax_prepaid: The tax element is the occupancy tax and the city tax posted on the reservation taken together, and none of it is returned.
