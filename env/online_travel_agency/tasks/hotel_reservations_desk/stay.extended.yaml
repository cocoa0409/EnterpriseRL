- id: stay_ext_statutory_tax_charge
  base_policy_refs:
  - stay_taxes_and_fees
  - stay_club_and_corporate_interaction
  - stay_room_and_occupancy
  overwrite:
  - base_policy: stay_taxes_and_fees
    superseded_clause: Occupancy tax and city tax are applied to the room total alone, night by night, and never to optional extras or to the agency service fee.
    replaced_by: The statutory rate is the occupancy tax rate the rate plan booked carries, and the statutory tax due is the taxable room money at that rate, levied once on the whole taxable room money rather than night by night.
  trigger: state_due
  subject:
  - stay_tax_and_fee_charge
  computes: statutory_tax_amount_usd
  target_tool: post_statutory_tax_charge_0b7e8f18
  params:
    supplement_taxable_full_pct: 100
    supplement_taxable_none_pct: 0
    no_discount_pct: 0
  rule: 'This rule settles the statutory tax due on a stay. The room money posted is the prepayment lines and the room lines standing on the reservation taken together. The statutory tax due is settled only once the folio''s room lines carry every occupant beyond the rate plan''s standard occupancy for the nights of the stay already posted. 0 percent of the occupant supplement posted is counted as room money. The nights of the stay already covered on the folio are taken as the highest night sequence the folio''s room lines carry. The room money the tax acts on is the room money posted grossed up in the proportion the nights the reservation covers bear to the nights already covered on the folio. The taxable room money is the room money the tax acts on reduced by a discount of 0 percent. The statutory rate is the occupancy tax rate the rate plan booked carries, and the statutory tax due is the taxable room money at that rate, levied once on the whole taxable room money rather than night by
    night. Every figure is rounded to two decimal places as it is worked out, and the statutory tax due is rounded the same way. Where the folio carries occupant supplement lines and the rate plan booked includes breakfast, 100 percent of the occupant supplement posted is counted as room money; where the folio carries occupant supplement lines and the rate plan booked does not include breakfast, 0 percent of it is counted as room money; and where the folio carries no occupant supplement line, 0 percent of it is counted as room money. Where an active traveller club membership carrying a hotel rate discount stands in the guest''s name and the reservation carries no corporate programme reference, the discount applied to the room money is the hotel rate discount of the tier the membership stands at; where an active traveller club membership stands in the guest''s name and the reservation carries a corporate programme reference, the discount applied is 0 percent because the negotiated rate stands
    alone; and where no active traveller club membership stands in the guest''s name, the discount applied is 0 percent. Where the nights of the stay already covered on the folio are fewer than the nights the reservation covers and the reservation stands at checked in, the room money the tax acts on is the room money posted as it stands, the tax following the nights already covered; where the nights already covered are fewer than the nights the reservation covers and the reservation stands at checked out, the room money the tax acts on is the room money posted grossed up in the proportion the nights the reservation covers bear to the nights already covered on the folio; and in every other case the room money the tax acts on is the room money posted grossed up in that same proportion. Where the reservation records the city the property stands in and the arrival date has already been reached on the handling date, the statutory rate is the occupancy tax rate together with the city tax rate
    the plan carries, the two statutory rates being levied together on the same taxable room money; where the reservation records no city the property stands in and the arrival date has already been reached on the handling date, the statutory rate is the occupancy tax rate alone; and in every other case the statutory rate is the occupancy tax rate alone.

    '
  prerequisite:
  - problem: stay_ext_occupancy_supplement
    kind: value_input
    gate: supplement_total
    form: state
    policy_source: The statutory tax due is settled only once the folio's room lines carry every occupant beyond the rate plan's standard occupancy for the nights of the stay already posted.
    condition: The reservation's folio carries occupant supplement lines covering every occupant beyond the rate plan's standard occupancy for the nights already posted.
    resolved_by: post_occupancy_supplement_f6d09258
    effect: Once those supplement lines stand on the folio, the supplement total stops being nothing, the share of it counted as room money moves off its fall-through and the taxable room money rises by that share.
  cross_category:
  - category: club
    as: branch
    reads:
    - status
    - variant_name
    note: The room-money discount factor reads the membership standing in the guest's name and the hotel rate discount of the tier it stands at to decide which tier of that ladder applies.
  compute:
  - rooms_held: F('rooms_count')
  - nights_count: F('nights_count')
  - room_night_total: SUM('stay_folio_entries','amount_usd', charge_category='room_night')
  - deposit_total: SUM('stay_folio_entries','amount_usd', charge_category='deposit')
  - room_lines_total: RND(room_night_total + deposit_total, 2)
  - folio_nights: MAX('stay_folio_entries','night_sequence', charge_category='room_night')
  - supplement_total: SUM('stay_folio_entries','amount_usd', charge_category='extra_occupant')
  - supplement_taxable_pct: (K('supplement_taxable_full_pct') if (supplement_total > 0 and P('breakfast_included')) else (K('supplement_taxable_none_pct') if (supplement_total > 0 and not P('breakfast_included')) else K('supplement_taxable_none_pct')))
  - room_money_posted: RND(room_lines_total + supplement_total * supplement_taxable_pct / 100.0, 2)
  - room_money: (room_money_posted if (folio_nights < nights_count and F('status') == 'checked_in') else (RND(room_money_posted * nights_count / MX(1.0, folio_nights), 2) if (folio_nights < nights_count and F('status') == 'checked_out') else RND(room_money_posted * nights_count / MX(1.0, folio_nights), 2)))
  - club_status: CFIELD('club','status')
  - room_discount_pct: (CPARAM('club','hotel_rate_discount_pct') if (club_status == 'active' and F('corporate_program_id') == '') else (K('no_discount_pct') if (club_status == 'active' and F('corporate_program_id') != '') else K('no_discount_pct')))
  - taxable_room_money: RND(room_money * (100.0 - room_discount_pct) / 100.0, 2)
  - stay_elapsed_days: DAYS(F('check_in_date'), NOW)
  - statutory_rate_pct: (RND(P('occupancy_tax_pct') + P('city_tax_pct'), 2) if (F('property_city') != '' and stay_elapsed_days >= 0) else (P('occupancy_tax_pct') if (F('property_city') == '' and stay_elapsed_days >= 0) else P('occupancy_tax_pct')))
  - result: RND(taxable_room_money * statutory_rate_pct / 100.0, 2)
  compute_basis:
    room_night_total: The room money posted is the prepayment lines and the room lines standing on the reservation taken together.
    deposit_total: The room money posted is the prepayment lines and the room lines standing on the reservation taken together.
    room_lines_total: The room money posted is the prepayment lines and the room lines standing on the reservation taken together.
    folio_nights: Where the nights of the stay already covered on the folio are fewer than the nights the reservation covers and the reservation stands at checked in, the room money the tax acts on is the room money posted as it stands, the tax following the nights already covered; where the nights already covered are fewer than the nights the reservation covers and the reservation stands at checked out, the room money the tax acts on is the room money posted grossed up in the proportion the nights the reservation covers bear to the nights already covered on the folio; and in every other case the room money the tax acts on is the room money posted grossed up in that same proportion.
    supplement_total: The statutory tax due is settled only once the folio's room lines carry every occupant beyond the rate plan's standard occupancy for the nights of the stay already posted.
    supplement_taxable_pct: Where the folio carries occupant supplement lines and the rate plan booked includes breakfast, 100 percent of the occupant supplement posted is counted as room money; where the folio carries occupant supplement lines and the rate plan booked does not include breakfast, 0 percent of it is counted as room money; and where the folio carries no occupant supplement line, 0 percent of it is counted as room money.
    room_money_posted: 0 percent of the occupant supplement posted is counted as room money.
    room_money: Where the nights of the stay already covered on the folio are fewer than the nights the reservation covers and the reservation stands at checked in, the room money the tax acts on is the room money posted as it stands, the tax following the nights already covered; where the nights already covered are fewer than the nights the reservation covers and the reservation stands at checked out, the room money the tax acts on is the room money posted grossed up in the proportion the nights the reservation covers bear to the nights already covered on the folio; and in every other case the room money the tax acts on is the room money posted grossed up in that same proportion.
    club_status: Where an active traveller club membership carrying a hotel rate discount stands in the guest's name and the reservation carries no corporate programme reference, the discount applied to the room money is the hotel rate discount of the tier the membership stands at; where an active traveller club membership stands in the guest's name and the reservation carries a corporate programme reference, the discount applied is 0 percent because the negotiated rate stands alone; and where no active traveller club membership stands in the guest's name, the discount applied is 0 percent.
    room_discount_pct: Where an active traveller club membership carrying a hotel rate discount stands in the guest's name and the reservation carries no corporate programme reference, the discount applied to the room money is the hotel rate discount of the tier the membership stands at; where an active traveller club membership stands in the guest's name and the reservation carries a corporate programme reference, the discount applied is 0 percent because the negotiated rate stands alone; and where no active traveller club membership stands in the guest's name, the discount applied is 0 percent.
    taxable_room_money: The taxable room money is the room money the tax acts on reduced by a discount of 0 percent.
    stay_elapsed_days: Where the reservation records the city the property stands in and the arrival date has already been reached on the handling date, the statutory rate is the occupancy tax rate together with the city tax rate the plan carries, the two statutory rates being levied together on the same taxable room money; where the reservation records no city the property stands in and the arrival date has already been reached on the handling date, the statutory rate is the occupancy tax rate alone; and in every other case the statutory rate is the occupancy tax rate alone.
    statutory_rate_pct: Where the reservation records the city the property stands in and the arrival date has already been reached on the handling date, the statutory rate is the occupancy tax rate together with the city tax rate the plan carries, the two statutory rates being levied together on the same taxable room money; where the reservation records no city the property stands in and the arrival date has already been reached on the handling date, the statutory rate is the occupancy tax rate alone; and in every other case the statutory rate is the occupancy tax rate alone.
    result: The statutory rate is the occupancy tax rate the rate plan booked carries, and the statutory tax due is the taxable room money at that rate, levied once on the whole taxable room money rather than night by night.
  factors:
  - id: supplement_taxability
    effect: parameter
    decides: supplement_taxable_pct
    bindings:
    - supplement_total
    - supplement_taxable_pct
    ladder:
    - when: the folio carries occupant supplement lines and the rate plan booked includes breakfast
      value: K('supplement_taxable_full_pct')
    - when: the folio carries occupant supplement lines and the rate plan booked does not include breakfast
      value: K('supplement_taxable_none_pct')
    - when: otherwise
      value: K('supplement_taxable_none_pct')
    baseline:
      supplement_taxable_pct: K('supplement_taxable_none_pct')
    evidence:
    - history
