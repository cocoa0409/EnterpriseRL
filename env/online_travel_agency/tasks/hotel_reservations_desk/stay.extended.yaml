- id: stay_ext_cancellation_refund_payout
  base_policy_refs:
  - stay_refund_settlement
  - stay_best_rate_guarantee
  - stay_cancellation
  - stay_deposit_and_prepayment
  - stay_taxes_and_fees
  - stay_booking_terms
  overwrite:
  - base_policy: stay_refund_settlement
    superseded_clause: Each payout is raised against the original folio line it reverses, so a folio with several lines settles as several payouts and never as one lump sum.
    replaced_by: A cancellation settlement is raised as one payout against the earliest prepayment line still standing on the reservation, meaning the prepayment line carrying the lowest room sequence that no payout already stands against, and it covers every element set out below together.
  - base_policy: stay_refund_settlement
    superseded_clause: A payout may never exceed the amount that original line actually collected, and the sum of a reservation's payouts may never exceed its folio balance
    replaced_by: Because the settlement is raised as one payout covering every element together, the ceiling on it is the ceiling set out below rather than what the prepayment line it is raised against collected on its own, and the reservation's payouts may together reach that ceiling.
  - base_policy: stay_cancellation
    superseded_clause: The agency service fee is not returned on cancellation, because the booking service it pays for has already been performed.
    replaced_by: The agency service fee posted on the reservation is returned only where the rate plan booked charges no such fee, the desk keeping a fee the plan levies and returning one the plan does not.
  trigger: on_request
  subject:
  - stay_refund_payout
  computes: refund_amount_usd
  target_tool: raise_cancellation_refund_payout_a740a404
  params:
    tax_full_return_pct: 100
    tax_no_return_pct: 0
    facility_full_return_pct: 100
    facility_no_return_pct: 0
    service_full_return_pct: 100
    service_no_return_pct: 0
  rule: 'This rule settles the money returned to a guest''s card on a cancellation settlement. The amount returned to the card is settled only after the folio carries the cancellation penalty withheld on every room given up. A cancellation settlement is raised as one payout against the earliest prepayment line still standing on the reservation, meaning the prepayment line carrying the lowest room sequence that no payout already stands against, and it covers every element set out below together. Because the settlement is raised as one payout covering every element together, the ceiling on it is the ceiling set out below rather than what the prepayment line it is raised against collected on its own, and the reservation''s payouts may together reach that ceiling. The agency service fee posted on the reservation is returned only where the rate plan booked charges no such fee, the desk keeping a fee the plan levies and returning one the plan does not. The booked nightly rate is the prepayment
    posted on the reservation divided by the nights the reservation covers multiplied by the highest room sequence the prepayment lines were posted for. The prepayment still held is every prepayment line posted on the reservation. The tax element is the occupancy tax and the city tax posted on the reservation taken together, and none of it is returned. The facility element is the property facility fee posted on the reservation, and all of it is returned. The service element is the agency service fee posted on the reservation, and all of it is returned. Nothing is deducted for the amount withheld. The settlement is the prepayment still held plus the tax element returned plus the facility element returned plus the service element returned less the deduction for the amount withheld. The settlement is finally capped at what the single prepayment line standing on the reservation actually collected, and never falls below nothing. Every figure is rounded to two decimal places as it is worked out,
    and the settlement is rounded the same way. Where the prepayment lines posted on the reservation outnumber the rooms standing on it and the rate plan booked takes the whole stay at booking, the prepayment still held is the booked nightly rate multiplied by the nights the reservation covers and by the rooms standing on it; where the prepayment lines posted outnumber the rooms standing and the rate plan booked takes a deposit expressed in room nights, the prepayment still held is the booked nightly rate multiplied by the deposit nights the rate plan carries and by the rooms standing on the reservation; and in every other case the prepayment still held is every prepayment line posted on the reservation. Where the rate plan booked returns value to the original form of payment and a cancellation penalty already stands on the folio, the whole amount withheld is deducted from the settlement; where the rate plan booked returns value as credit at the property and a cancellation penalty already
    stands on the folio, the deduction is the whole prepayment still held; and where no cancellation penalty stands on the folio nothing is deducted. Where the arrival date has not passed and the rate plan booked returns value to the original form of payment, 100 percent of the tax element is returned; where the arrival date has passed and the rate plan booked returns value to the original form of payment, 0 percent of the tax element is returned; and in every other case 0 percent of the tax element is returned. Where the rate plan booked does not waive the property facility fee and a property facility fee has been posted on the reservation, 0 percent of the facility element is returned; where the rate plan booked waives the property facility fee and a property facility fee has nonetheless been posted on the reservation, 100 percent of the facility element is returned; and in every other case 100 percent of the facility element is returned. Where an agency service fee has been posted on
    the reservation and the rate plan booked charges an agency service fee, 0 percent of the service element is returned; where an agency service fee has been posted on the reservation and the rate plan booked charges no agency service fee, 100 percent of the service element is returned; and in every other case 100 percent of the service element is returned. Where more than one prepayment line stands on the reservation and the folio balance is smaller than the prepayment still held, the settlement is capped at the folio balance; where more than one prepayment line stands on the reservation and the folio balance is at least the prepayment still held, the settlement is capped at the prepayment still held; and in every other case the settlement is capped at what the single prepayment line standing on the reservation actually collected.

    '
  prerequisite:
  - problem: stay_ext_late_cancellation_penalty
    kind: value_input
    gate: penalty_withheld
    form: state
    policy_source: The amount returned to the card is settled only after the folio carries the cancellation penalty withheld on every room given up.
    condition: The reservation's folio carries a cancellation penalty line covering the rooms given up, so that the penalty already withheld can be read off the folio.
    resolved_by: confirm_reservation_cancellation_70c0f3f0
    effect: Once that penalty line stands on the folio, the deduction for the amount withheld stops being nothing and becomes the penalty the folio now carries, and the settlement falls by that amount.
  cross_category: []
  compute:
  - nights_count: F('nights_count')
  - rooms_standing: F('rooms_count')
  - deposits_taken: SUM('stay_folio_entries','amount_usd', charge_category='deposit')
  - deposit_line_count: COUNT('stay_folio_entries', charge_category='deposit')
  - deposit_line_max: MAX('stay_folio_entries','amount_usd', charge_category='deposit')
  - deposit_rooms: MAX('stay_folio_entries','room_sequence', charge_category='deposit')
  - booked_nightly_rate: RND(deposits_taken / MX(1.0, nights_count * deposit_rooms), 2)
  - prepayment_held: (RND(booked_nightly_rate * nights_count * rooms_standing, 2) if (deposit_line_count > rooms_standing and P('prepayment_required')) else (RND(booked_nightly_rate * P('deposit_nights') * rooms_standing, 2) if (deposit_line_count > rooms_standing and not P('prepayment_required')) else deposits_taken))
  - penalty_withheld: SUM('stay_folio_entries','amount_usd', charge_category='cancellation_penalty')
  - withheld_applied: (penalty_withheld if (P('refund_form') == 'original_payment' and penalty_withheld > 0) else (prepayment_held if (P('refund_form') == 'property_credit' and penalty_withheld > 0) else 0.0))
  - tax_prepaid: RND(SUM('stay_folio_entries','amount_usd', charge_category='occupancy_tax') + SUM('stay_folio_entries','amount_usd', charge_category='city_tax'), 2)
  - tax_return_pct: (K('tax_full_return_pct') if (DAYS(NOW, F('check_in_date')) >= 0 and P('refund_form') == 'original_payment') else (K('tax_no_return_pct') if (DAYS(NOW, F('check_in_date')) < 0 and P('refund_form') == 'original_payment') else K('tax_no_return_pct')))
  - tax_returned: RND(tax_prepaid * tax_return_pct / 100.0, 2)
  - facility_prepaid: SUM('stay_folio_entries','amount_usd', charge_category='resort_fee')
  - facility_return_pct: (K('facility_no_return_pct') if ((not P('resort_fee_waived')) and facility_prepaid > 0) else (K('facility_full_return_pct') if (P('resort_fee_waived') and facility_prepaid > 0) else K('facility_full_return_pct')))
  - facility_returned: RND(facility_prepaid * facility_return_pct / 100.0, 2)
  - service_fee_paid: SUM('stay_folio_entries','amount_usd', charge_category='agency_service_fee')
  - service_return_pct: (K('service_no_return_pct') if (service_fee_paid > 0 and P('agency_service_fee_usd') > 0) else (K('service_full_return_pct') if (service_fee_paid > 0 and P('agency_service_fee_usd') <= 0) else K('service_full_return_pct')))
  - service_returned: RND(service_fee_paid * service_return_pct / 100.0, 2)
  - gross_refund: RND(prepayment_held + tax_returned + facility_returned + service_returned - withheld_applied, 2)
  - folio_balance: SUM('stay_folio_entries','amount_usd')
  - payout_ceiling: (folio_balance if (deposit_line_count > 1 and folio_balance < prepayment_held) else (prepayment_held if (deposit_line_count > 1 and folio_balance >= prepayment_held) else deposit_line_max))
  - result: RND(MX(0.0, MN(gross_refund, payout_ceiling)), 2)
  compute_basis:
    deposits_taken: The prepayment still held is every prepayment line posted on the reservation.
    deposit_line_count: Where the prepayment lines posted on the reservation outnumber the rooms standing on it and the rate plan booked takes the whole stay at booking, the prepayment still held is the booked nightly rate multiplied by the nights the reservation covers and by the rooms standing on it; where the prepayment lines posted outnumber the rooms standing and the rate plan booked takes a deposit expressed in room nights, the prepayment still held is the booked nightly rate multiplied by the deposit nights the rate plan carries and by the rooms standing on the reservation; and in every other case the prepayment still held is every prepayment line posted on the reservation.
    deposit_line_max: The settlement is finally capped at what the single prepayment line standing on the reservation actually collected, and never falls below nothing.
