extended_policies:
- id: stay_ext_late_cancellation_penalty
  base_policy_refs:
  - stay_cancellation
  - stay_deposit_and_prepayment
  - stay_booking_terms
  - stay_agg_portfolio_occupancy
  - stay_club_and_corporate_interaction
  overwrite:
  - base_policy: stay_cancellation
    superseded_clause: Outside it the penalty is read off the rate plan's cancellation ladder by how many whole days lie between the cancellation and the arrival date
    replaced_by: Where 30 or more whole days lie between the handling date and the arrival date the withheld share is 0 percent; where 29 to 8 whole days lie between them the withheld share is 25 percent; where 7 to 2 whole days lie between them the withheld share is 50 percent; and where fewer than 2 whole days lie between them the withheld share is the flat cancellation share the rate plan booked carries.
  - base_policy: stay_cancellation
    superseded_clause: Inside the free-cancellation term nothing is withheld on any rate plan, and the deposit or prepayment is returned in full
    replaced_by: The withheld share is settled from the whole days between the handling date and the arrival date in every case, whatever term ran from the moment the property confirmed the reservation, and no term measured from that moment sets the amount withheld to nothing.
  trigger: on_request
  subject:
  - stay_cancellation_charge
  computes: penalty_amount_usd
  target_tool: confirm_reservation_cancellation_70c0f3f0
  params:
    band_far_days: 30
    band_far_pct: 0
    band_mid_days: 8
    band_mid_pct: 25
    band_near_days: 2
    band_near_pct: 50
    partial_prepayment_markup_factor: 0.5
    loyalty_points_threshold: 15000
    reduced_release_factor: 0.5
  rule: 'This rule settles the amount withheld from a guest who gives up the rooms standing on a confirmed reservation. The prepayment still held on the reservation is the prepayment lines posted against it added to the money already returned against those lines, which is carried as a negative figure. The booked nightly rate is the prepayment posted divided by the nights the reservation covers multiplied by the highest room sequence the prepayment lines were posted for. The withheld share is the flat cancellation share the rate plan booked carries, and the amount measured by share is that withheld share of the prepayment still held, taken once on the whole prepayment still held and never room by room. The amount measured by nights is the booked nightly rate multiplied by the cancellation penalty nights the rate plan booked carries and by the rooms standing on the reservation. The amount withheld is the amount measured by share. No markup is added to it and no goodwill release is taken off
    it. The amount withheld is then compared with the prepayment still held and never exceeds it, and it is never less than nothing; that comparison is made on the final figure alone and after every step below. Every figure is rounded to two decimal places as it is worked out, and the final amount withheld is rounded the same way. The withheld share is settled from the whole days between the handling date and the arrival date in every case, whatever term ran from the moment the property confirmed the reservation, and no term measured from that moment sets the amount withheld to nothing. Where 30 or more whole days lie between the handling date and the arrival date the withheld share is 0 percent; where 29 to 8 whole days lie between them the withheld share is 25 percent; where 7 to 2 whole days lie between them the withheld share is 50 percent; and where fewer than 2 whole days lie between them the withheld share is the flat cancellation share the rate plan booked carries. Where money has
    already been returned against a prepayment line posted on the reservation and the rate plan booked sets a cancellation penalty in room nights, the amount measured by share and the amount measured by nights are both worked out and the larger of the two is the amount withheld; where no money has been returned against a prepayment line posted on the reservation and the rate plan booked sets a cancellation penalty in room nights, both are worked out and the smaller of the two is the amount withheld; and in every other case the amount withheld is the amount measured by share. Where the prepayment on the reservation was presented to the guest in a currency other than the US dollar and the rate plan booked takes the whole stay at booking, the rate plan''s currency conversion markup is added to the amount withheld; where the prepayment was presented in a currency other than the US dollar and the rate plan booked does not take the whole stay at booking, half that markup is added; and where the
    prepayment was presented in US dollars no markup is added. Where an active traveller club membership stands in the guest''s name and at least 15000 club points have accrued from hotel nights in the twelve months ending on the handling date, the goodwill release taken off the amount withheld is the hotel rate discount carried by the tier that membership stands at; where an active traveller club membership stands in the guest''s name and fewer than 15000 club points have accrued from hotel nights in those twelve months, the goodwill release is half that hotel rate discount; and where no active traveller club membership stands in the guest''s name no goodwill release is taken off.

    '
  prerequisite: []
  cross_category:
  - category: club
    as: branch
    reads:
    - status
    - variant_name
    - club_points_entries.points_delta
    note: The goodwill-release factor reads the membership standing in the guest's name and the hotel nights accrued to it to decide which tier of that ladder applies.
  compute:
  - nights_count: F('nights_count')
  - rooms_given_up: F('rooms_count')
  - deposits_taken: SUM('stay_folio_entries','amount_usd', charge_category='deposit')
  - deposit_rooms: MAX('stay_folio_entries','room_sequence', charge_category='deposit')
  - refunds_paid: SUM('stay_folio_entries','amount_usd', charge_category='refund_payout')
  - prepayment_held: RND(deposits_taken + refunds_paid, 2)
  - booked_nightly_rate: RND(deposits_taken / MX(1.0, nights_count * deposit_rooms), 2)
  - lead_days: DAYS(NOW, F('check_in_date'))
  - share_pct: (K('band_far_pct') if lead_days >= K('band_far_days') else (K('band_mid_pct') if lead_days >= K('band_mid_days') else (K('band_near_pct') if lead_days >= K('band_near_days') else P('cancellation_penalty_pct'))))
  - share_measure: RND(prepayment_held * share_pct / 100.0, 2)
  - prior_release_count: COUNT('stay_folio_entries', charge_category='refund_payout')
  - nights_measure: RND(booked_nightly_rate * P('cancellation_penalty_nights') * rooms_given_up, 2)
  - gross_penalty: (MX(share_measure, nights_measure) if (prior_release_count > 0 and P('cancellation_penalty_nights') > 0) else (MN(share_measure, nights_measure) if (prior_release_count <= 0 and P('cancellation_penalty_nights') > 0) else share_measure))
  - presented_currency: LATEST('stay_folio_entries','currency_charged', date_field='posted_date', charge_category='deposit')
  - markup_pct: (P('currency_conversion_markup_pct') if (presented_currency != 'USD' and P('prepayment_required')) else (RND(P('currency_conversion_markup_pct') * K('partial_prepayment_markup_factor'), 2) if (presented_currency != 'USD' and not P('prepayment_required')) else 0.0))
  - after_markup: RND(gross_penalty * (100.0 + markup_pct) / 100.0, 2)
  - club_status: CFIELD('club','status')
  - club_stay_points: XSUM('club','club_points_entries','points_delta', within_months=12, date_field='posted_date', accrual_source='stay_night')
  - write_off_pct: (CPARAM('club','hotel_rate_discount_pct') if (club_status == 'active' and club_stay_points >= K('loyalty_points_threshold')) else (RND(CPARAM('club','hotel_rate_discount_pct') * K('reduced_release_factor'), 2) if (club_status == 'active' and club_stay_points < K('loyalty_points_threshold')) else 0.0))
  - after_write_off: RND(after_markup * (100.0 - write_off_pct) / 100.0, 2)
  - result: RND(MX(0.0, MN(after_write_off, prepayment_held)), 2)
  compute_basis:
    deposits_taken: The prepayment still held on the reservation is the prepayment lines posted against it added to the money already returned against those lines, which is carried as a negative figure.
    deposit_rooms: The booked nightly rate is the prepayment posted divided by the nights the reservation covers multiplied by the highest room sequence the prepayment lines were posted for.
    refunds_paid: The prepayment still held on the reservation is the prepayment lines posted against it added to the money already returned against those lines, which is carried as a negative figure.
    prepayment_held: The prepayment still held on the reservation is the prepayment lines posted against it added to the money already returned against those lines, which is carried as a negative figure.
    booked_nightly_rate: The booked nightly rate is the prepayment posted divided by the nights the reservation covers multiplied by the highest room sequence the prepayment lines were posted for.
    lead_days: Where 30 or more whole days lie between the handling date and the arrival date the withheld share is 0 percent; where 29 to 8 whole days lie between them the withheld share is 25 percent; where 7 to 2 whole days lie between them the withheld share is 50 percent; and where fewer than 2 whole days lie between them the withheld share is the flat cancellation share the rate plan booked carries.
    share_pct: Where 30 or more whole days lie between the handling date and the arrival date the withheld share is 0 percent; where 29 to 8 whole days lie between them the withheld share is 25 percent; where 7 to 2 whole days lie between them the withheld share is 50 percent; and where fewer than 2 whole days lie between them the withheld share is the flat cancellation share the rate plan booked carries.
    share_measure: The withheld share is the flat cancellation share the rate plan booked carries, and the amount measured by share is that withheld share of the prepayment still held, taken once on the whole prepayment still held and never room by room.
    prior_release_count: Where money has already been returned against a prepayment line posted on the reservation and the rate plan booked sets a cancellation penalty in room nights, the amount measured by share and the amount measured by nights are both worked out and the larger of the two is the amount withheld; where no money has been returned against a prepayment line posted on the reservation and the rate plan booked sets a cancellation penalty in room nights, both are worked out and the smaller of the two is the amount withheld; and in every other case the amount withheld is the amount measured by share.
    nights_measure: The amount measured by nights is the booked nightly rate multiplied by the cancellation penalty nights the rate plan booked carries and by the rooms standing on the reservation.
    gross_penalty: Where money has already been returned against a prepayment line posted on the reservation and the rate plan booked sets a cancellation penalty in room nights, the amount measured by share and the amount measured by nights are both worked out and the larger of the two is the amount withheld; where no money has been returned against a prepayment line posted on the reservation and the rate plan booked sets a cancellation penalty in room nights, both are worked out and the smaller of the two is the amount withheld; and in every other case the amount withheld is the amount measured by share.
    presented_currency: Where the prepayment on the reservation was presented to the guest in a currency other than the US dollar and the rate plan booked takes the whole stay at booking, the rate plan's currency conversion markup is added to the amount withheld; where the prepayment was presented in a currency other than the US dollar and the rate plan booked does not take the whole stay at booking, half that markup is added; and where the prepayment was presented in US dollars no markup is added.
    markup_pct: Where the prepayment on the reservation was presented to the guest in a currency other than the US dollar and the rate plan booked takes the whole stay at booking, the rate plan's currency conversion markup is added to the amount withheld; where the prepayment was presented in a currency other than the US dollar and the rate plan booked does not take the whole stay at booking, half that markup is added; and where the prepayment was presented in US dollars no markup is added.
    after_markup: Every figure is rounded to two decimal places as it is worked out, and the final amount withheld is rounded the same way.
    club_status: Where an active traveller club membership stands in the guest's name and at least 15000 club points have accrued from hotel nights in the twelve months ending on the handling date, the goodwill release taken off the amount withheld is the hotel rate discount carried by the tier that membership stands at; where an active traveller club membership stands in the guest's name and fewer than 15000 club points have accrued from hotel nights in those twelve months, the goodwill release is half that hotel rate discount; and where no active traveller club membership stands in the guest's name no goodwill release is taken off.
    club_stay_points: Where an active traveller club membership stands in the guest's name and at least 15000 club points have accrued from hotel nights in the twelve months ending on the handling date, the goodwill release taken off the amount withheld is the hotel rate discount carried by the tier that membership stands at; where an active traveller club membership stands in the guest's name and fewer than 15000 club points have accrued from hotel nights in those twelve months, the goodwill release is half that hotel rate discount; and where no active traveller club membership stands in the guest's name no goodwill release is taken off.
    write_off_pct: Where an active traveller club membership stands in the guest's name and at least 15000 club points have accrued from hotel nights in the twelve months ending on the handling date, the goodwill release taken off the amount withheld is the hotel rate discount carried by the tier that membership stands at; where an active traveller club membership stands in the guest's name and fewer than 15000 club points have accrued from hotel nights in those twelve months, the goodwill release is half that hotel rate discount; and where no active traveller club membership stands in the guest's name no goodwill release is taken off.
    after_write_off: Every figure is rounded to two decimal places as it is worked out, and the final amount withheld is rounded the same way.
    result: The amount withheld is then compared with the prepayment still held and never exceeds it, and it is never less than nothing; that comparison is made on the final figure alone and after every step below.
  factors:
  - id: lead_time_share
    effect: parameter
    decides: share_pct
    bindings:
    - lead_days
    - share_pct
    ladder:
    - when: 30 or more whole days lie between the handling date and the arrival date
      value: K('band_far_pct')
    - when: 29 to 8 whole days lie between the handling date and the arrival date
      value: K('band_mid_pct')
    - when: 7 to 2 whole days lie between the handling date and the arrival date
      value: K('band_near_pct')
    - when: otherwise
      value: P('cancellation_penalty_pct')
    baseline:
      share_pct: P('cancellation_penalty_pct')
    evidence:
    - date
    cross_difficulty: null
  - id: measure_selection
    effect: method
    decides: gross_penalty
    bindings:
    - prior_release_count
    - nights_measure
    - gross_penalty
    ladder:
    - when: money has already been returned against a prepayment line posted on the reservation and the rate plan booked sets a cancellation penalty in room nights
      method: the amount measured by share and the amount measured by nights are both worked out and the larger of the two is the amount withheld
    - when: no money has been returned against a prepayment line posted on the reservation and the rate plan booked sets a cancellation penalty in room nights
      method: the amount measured by share and the amount measured by nights are both worked out and the smaller of the two is the amount withheld
    - when: otherwise
      method: the amount withheld is the amount measured by share
    baseline:
      gross_penalty: share_measure
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: conversion_markup
    effect: parameter
    decides: markup_pct
    bindings:
    - presented_currency
    - markup_pct
    ladder:
    - when: the prepayment on the reservation was presented to the guest in a currency other than the US dollar and the rate plan booked takes the whole stay at booking
      value: P('currency_conversion_markup_pct')
    - when: the prepayment was presented in a currency other than the US dollar and the rate plan booked does not take the whole stay at booking
      value: half of P('currency_conversion_markup_pct')
    - when: otherwise
      value: no markup
    baseline:
      markup_pct: '0.0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: loyalty_goodwill_release
    effect: parameter
    decides: write_off_pct
    bindings:
    - club_status
    - club_stay_points
    - write_off_pct
    ladder:
    - when: an active traveller club membership stands in the guest's name and at least 15000 club points have accrued from hotel nights in the twelve months ending on the handling date
      value: CPARAM('club','hotel_rate_discount_pct')
    - when: an active traveller club membership stands in the guest's name and fewer than 15000 club points have accrued from hotel nights in those twelve months
      value: half of CPARAM('club','hotel_rate_discount_pct')
    - when: otherwise
      value: no goodwill release
    baseline:
      write_off_pct: '0.0'
    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: club
  baseline:
