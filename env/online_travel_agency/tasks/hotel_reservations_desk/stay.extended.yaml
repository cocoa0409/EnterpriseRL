- id: stay_ext_departure_balance_settlement
  base_policy_refs:
  - stay_incidentals
  - stay_deposit_and_prepayment
  - stay_taxes_and_fees
  - stay_resort_credit
  - stay_room_and_occupancy
  overwrite:
  - base_policy: stay_incidentals
    superseded_clause: 'At departure the folio is closed off: every posted line is settled against the deposit already held and the balance is taken from or returned to the card on file.'
    replaced_by: The balance settled at departure is the room money charged plus the statutory tax charged plus the property facility fee posted on the reservation plus the charges taken at the property charged, less the credit offset and less the deposit offset, and the conversion markup is then added to that figure.
  trigger: state_due
  subject:
  - stay_check_out
  computes: closing_balance_usd
  target_tool: settle_departure_balance_f8243430
  params:
    deposit_offset_full_pct: 100
    deposit_offset_none_pct: 0
    tax_included_full_pct: 100
    tax_included_none_pct: 0
    onproperty_charged_full_pct: 100
    onproperty_charged_none_pct: 0
    credit_offset_full_pct: 100
    credit_offset_none_pct: 0
    no_markup_pct: 0
  rule: 'This rule settles the balance taken from a departing guest''s card. The balance settled at departure is struck only once the folio carries the statutory tax due on the room money for the stay. The balance settled at departure is struck only once the folio carries the property credit drawn down against the charges it may be spent against. The nights of the stay already covered on the folio are taken as the highest night sequence the folio''s room lines carry. The booked nightly rate is the room lines and the prepayment lines posted on the reservation taken together and divided by the nights of the stay already covered on the folio multiplied by the rooms held. The room money charged is the room lines and the prepayment lines posted together with the occupant supplement posted. 0 percent of the statutory tax posted is charged. The property facility fee posted on the reservation is charged in full, being owed per room per night on every plan that does not waive it. 0 percent of the
    charges taken at the property is charged. 0 percent of the credit drawn down is set against the balance. 0 percent of the deposit taken is set against the balance. No conversion markup is added. The balance settled at departure is the room money charged plus the statutory tax charged plus the property facility fee posted on the reservation plus the charges taken at the property charged, less the credit offset and less the deposit offset, and the conversion markup is then added to that figure. The balance is never less than nothing. Every figure is rounded to two decimal places as it is worked out, and the balance is rounded the same way. Where the nights of the stay already covered on the folio are fewer than the nights the reservation covers and the reservation stands at checked in, the room money charged is the room lines and the prepayment lines posted together with the occupant supplement posted, and each night of the stay not yet covered is added at the booked nightly rate for every
    room held; where the nights already covered are every night the reservation covers and the reservation stands at checked in, the room money charged is the room lines and the prepayment lines posted together with the occupant supplement posted; and in every other case the room money charged is the room lines and the prepayment lines posted together with the occupant supplement posted. Where the folio carries statutory tax lines and the reservation stands at checked in or checked out, 100 percent of the statutory tax posted is charged; where the folio carries statutory tax lines and the reservation stands at cancelled or recorded as a no show, 0 percent of it is charged; and where the folio carries no statutory tax line, 0 percent of it is charged. Where charges taken at the property stand on the folio and the rate plan booked includes all meals, 0 percent of the charges taken at the property is charged, the plan already covering them; where charges taken at the property stand on the folio
    and the rate plan booked does not include all meals, 100 percent of them is charged; and where no charge taken at the property stands on the folio, 0 percent is charged. Where property credit has been drawn down on the reservation and the rate plan booked carries a property credit amount, 100 percent of the credit drawn down is set against the balance; where property credit has been drawn down on the reservation and the rate plan booked carries no property credit amount, 0 percent of it is set against the balance; and where no property credit has been drawn down, 0 percent is set against the balance. Where a deposit stands on the folio and the reservation stands at checked in, 100 percent of the deposit taken is set against the balance; where a deposit stands on the folio and the reservation stands at cancelled or recorded as a no show, 0 percent of it is set against the balance; and in every other case 0 percent of it is set against the balance. Where the room money on this reservation
    was presented to the guest in a currency other than the US dollar and the rate plan booked carries a currency conversion markup, that markup is added to the balance; where the room money was presented in a currency other than the US dollar and the rate plan booked carries no currency conversion markup, no conversion markup is added; and where the room money was presented in US dollars, no conversion markup is added.

    '
  prerequisite:
  - problem: stay_ext_statutory_tax_charge
    kind: value_input
    gate: tax_posted
    form: state
    policy_source: The balance settled at departure is struck only once the folio carries the statutory tax due on the room money for the stay.
    condition: The reservation's folio carries a statutory tax line covering the room money for the stay, so that the tax charged can be read off the folio.
    resolved_by: post_statutory_tax_charge_0b7e8f18
    effect: Once that tax line stands on the folio, the statutory tax posted stops being nothing, the share of it charged moves off its fall-through and the balance rises by that tax.
  - problem: stay_ext_resort_credit_application
    kind: value_input
    gate: credit_drawn
    form: state
    policy_source: The balance settled at departure is struck only once the folio carries the property credit drawn down against the charges it may be spent against.
    condition: The reservation's folio carries a property credit drawdown line against the charges taken at the property, so that the credit drawn down can be read off the folio.
    resolved_by: spend_resort_credit_ff384f87
    effect: Once that drawdown line stands on the folio, the credit drawn down stops being nothing, the share of it set against the balance moves off its fall-through and the balance falls by that amount.
  cross_category: []
  compute:
  - rooms_held: F('rooms_count')
  - nights_count: F('nights_count')
  - room_night_total: SUM('stay_folio_entries','amount_usd', charge_category='room_night')
  - deposit_taken: SUM('stay_folio_entries','amount_usd', charge_category='deposit')
  - supplement_total: SUM('stay_folio_entries','amount_usd', charge_category='extra_occupant')
  - room_lines_total: RND(room_night_total + deposit_taken, 2)
  - folio_nights: MAX('stay_folio_entries','night_sequence', charge_category='room_night')
  - booked_nightly_rate: RND(room_lines_total / MX(1.0, folio_nights * rooms_held), 2)
  - room_money_charged: (RND(room_lines_total + supplement_total + booked_nightly_rate * rooms_held * (nights_count - folio_nights), 2) if (folio_nights < nights_count and F('status') == 'checked_in') else (RND(room_lines_total + supplement_total, 2) if (folio_nights >= nights_count and F('status') == 'checked_in') else RND(room_lines_total + supplement_total, 2)))
  - tax_posted: SUM('stay_folio_entries','amount_usd', charge_category='occupancy_tax')
  - tax_included_pct: (K('tax_included_full_pct') if (tax_posted > 0 and (F('status') == 'checked_in' or F('status') == 'checked_out')) else (K('tax_included_none_pct') if (tax_posted > 0 and (F('status') == 'cancelled' or F('status') == 'no_show')) else K('tax_included_none_pct')))
  - tax_charged: RND(tax_posted * tax_included_pct / 100.0, 2)
  - facility_posted: SUM('stay_folio_entries','amount_usd', charge_category='resort_fee')
  - onproperty_posted: SUM('stay_folio_entries','amount_usd', charge_category='incidental_minibar')
  - onproperty_pct: (K('onproperty_charged_none_pct') if (onproperty_posted > 0 and P('all_inclusive')) else (K('onproperty_charged_full_pct') if (onproperty_posted > 0 and not P('all_inclusive')) else K('onproperty_charged_none_pct')))
  - onproperty_charged: RND(onproperty_posted * onproperty_pct / 100.0, 2)
  - credit_drawn: ABS(SUM('stay_folio_entries','amount_usd', charge_category='resort_credit_use'))
  - credit_offset_pct: (K('credit_offset_full_pct') if (credit_drawn > 0 and P('resort_credit_per_stay_usd') > 0) else (K('credit_offset_none_pct') if (credit_drawn > 0 and P('resort_credit_per_stay_usd') <= 0) else K('credit_offset_none_pct')))
  - credit_offset: RND(credit_drawn * credit_offset_pct / 100.0, 2)
  - deposit_offset_pct: (K('deposit_offset_full_pct') if (deposit_taken > 0 and F('status') == 'checked_in') else (K('deposit_offset_none_pct') if (deposit_taken > 0 and (F('status') == 'cancelled' or F('status') == 'no_show')) else K('deposit_offset_none_pct')))
  - deposit_offset: RND(deposit_taken * deposit_offset_pct / 100.0, 2)
  - presented_currency: LATEST('stay_folio_entries','currency_charged', date_field='posted_date', charge_category='room_night')
  - markup_pct: (P('currency_conversion_markup_pct') if (presented_currency != 'USD' and P('currency_conversion_markup_pct') > 0) else (K('no_markup_pct') if (presented_currency != 'USD' and P('currency_conversion_markup_pct') <= 0) else K('no_markup_pct')))
  - gross_balance: RND(room_money_charged + tax_charged + facility_posted + onproperty_charged - credit_offset - deposit_offset, 2)
  - result: RND(MX(0.0, gross_balance * (100.0 + markup_pct) / 100.0), 2)
