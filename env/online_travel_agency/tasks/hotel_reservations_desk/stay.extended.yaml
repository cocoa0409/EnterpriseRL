      method: the occupants the supplement is counted for are every adult declared on the reservation
    - when: the folio carries charges standing against one occupant at most and the adults declared exceed the standard occupancy of the rooms held
      method: the occupants the supplement is counted for are the occupants the folio's charges stand against
    - when: otherwise
      method: the occupants the supplement is counted for are the occupants the folio's charges stand against
    baseline:
      counted_adults: folio_occupants
    evidence:
    - history
    cross_difficulty: null
  - id: nights_convention
