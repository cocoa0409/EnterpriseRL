  fields:
    stay_folio_entry_id: reference of the folio line
    stay_reservation_id: reservation charged
    customer_id: guest charged
    event_type: family of the line
    charge_category: the line is a room night
    amount_usd: positive amount charged for the night
    currency_charged: currency presented to the guest
    stay_date: the night charged
    posted_date: date the line posted
    posted_at: moment the line posted
    night_sequence: which night of the stay this is
    room_sequence: which room on the reservation this is
    payment_channel: channel the line was taken through
    reason_code: business reason the line was raised
