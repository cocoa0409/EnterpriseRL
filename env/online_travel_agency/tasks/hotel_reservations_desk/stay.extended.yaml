  baseline:
    rule: This rule settles the supplement charged for occupants beyond the standard occupancy of the rooms a guest holds. The standard occupancy is 3 adults a room. The occupants the supplement is counted for are the occupants the folio's charges stand against, taken as the highest occupant sequence the folio shows. The occupants beyond standard occupancy are the occupants the supplement is counted for less the standard occupancy multiplied by the rooms held on the reservation, and never fewer than none. The nights of the stay already covered on the folio are taken as the highest night sequence the folio's room lines carry. The nights charged are the nights the reservation covers. The per-night supplement rate is the extra-adult amount the rate plan booked carries. The supplement is the per-night supplement rate multiplied by the occupants beyond standard occupancy and by the nights charged. The supplement is never less than nothing, and the figure is rounded to two decimal places as it
