    facility_returned: Every figure is rounded to two decimal places as it is worked out, and the settlement is rounded the same way.
    service_fee_paid: The service element is the agency service fee posted on the reservation, and all of it is returned.
    service_return_pct: Where an agency service fee has been posted on the reservation and the rate plan booked charges an agency service fee, 0 percent of the service element is returned; where an agency service fee has been posted on the reservation and the rate plan booked charges no agency service fee, 100 percent of the service element is returned; and in every other case 100 percent of the service element is returned.
