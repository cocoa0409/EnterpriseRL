  - id: care_ext_cover_release_return
    base_policy_refs: [care_free_look, care_midterm_cancellation]
    overwrite:
      - base_policy: care_free_look
        superseded_clause: >-
          A free-look cancellation is handled at the full refund only when frozen time is not after the moment the
          certificate of insurance was issued to the policyholder plus the free-look period of the plan held.
        replaced_by: >-
          Where cover is given up more than the plan's free-look period after the day the certificate was issued
          and no claim stands filed on the policy, the share returned is the plan's mid-term share; where a claim
          stands filed on the policy, nothing is returned; and in every other case the share returned is the
          plan's free-look share.
      - base_policy: care_free_look
        superseded_clause: >-
          A returned premium is raised against the premium lines that collected it, so a policy with several
          premium lines returns as several refund lines.
        replaced_by: >-
          The premium returned is raised as one line against the line that carries the base premium of the
          certificate, because that is the line the whole premium was rated from, and where the premium record
          carries no such line it is raised against the earliest line charged on the policy; a loading line, the
          line charged for the issue fee and a line raised to correct another line are never the line a return is
          raised against.
    trigger: on_request
    subject: [care_cancel, care_premium_refund]
    computes: returned_premium_usd
    target_tool: release_cover_and_return_premium_07b45938
    params: {}
    rule: >
      When a policyholder gives up their own cover, the premium returned is the premium the record shows
      collected, taken in the proportion of the cover still to run and at the share the terms of the plan allow.
      The premium the record shows collected is the whole of the lines charged and the re-ratings raised on the
      policy together with the lines already returned on it. The proportion of the cover still to run is the days
      of cover remaining over the days of cover bought. The days of cover remaining are counted as the whole of
      the days of cover bought. The days of cover bought are the days of the journey, its first and last both
      counted. The share returned is the plan's free-look share. The premium returned is never less than nothing
      and is rounded to two decimal places once, at the end, with no intermediate figure rounded.
      The premium returned is fixed only after the policy's premium record carries the re-rating owed on every
      correction of the certificate's declared particulars.
      The premium returned is raised as one line against the line that carries the base premium of the
      certificate, because that is the line the whole premium was rated from, and where the premium record
      carries no such line it is raised against the earliest line charged on the policy; a loading line, the line
      charged for the issue fee and a line raised to correct another line are never the line a return is raised
      against.
      Where the premium record carries a line already returned on the policy and a line charged for the issue fee,
      the premium the record shows collected is the lines charged and the re-ratings raised, less the lines
      already returned and less the issue fee; where the premium record carries a line charged for the issue fee
      and no line already returned, it is the lines charged and the re-ratings raised less the issue fee; and in
      every other case the premium the record shows collected is the whole of the lines charged and the
      re-ratings raised on the policy together with the lines already returned on it.
      Where cover is given up more than the plan's free-look period after the day the certificate was issued and
      no claim stands filed on the policy, the share returned is the plan's mid-term share; where a claim stands
      filed on the policy, nothing is returned; and in every other case the share returned is the plan's
      free-look share.
      Where the journey has not begun on the day cover is given up and the journey has not ended, the days of
      cover remaining are counted from the day after cover is given up to the last date of the journey, both
      counted; where the journey has begun and has not ended, they are counted from the day after cover is given
      up to the last date of the journey, that last date not counted; and in every other case the days of cover
      remaining are counted as the whole of the days of cover bought.
      Where the certificate was issued before the first date of the journey, the days of cover bought are counted
      from the day the certificate was issued to the last date of the journey, both counted, because cover
      against cancellation runs from the moment the certificate is issued; where the certificate was issued on or
      after the first date of the journey and the journey has not ended, they are counted from the day the
      certificate was issued to the last date of the journey, that last date counted; and in every other case the
      days of cover bought are the days of the journey, its first and last both counted.
    prerequisite:
      - problem: care_ext_premium_rerating
        kind: value_input
        gate: premium_ledger
        form: state
        policy_source: >-
          The premium returned is fixed only after the policy's premium record carries the re-rating owed on every
          correction of the certificate's declared particulars.
        condition: >-
          The policy's premium record carries a re-rating line for every correction of the declared particulars
          standing on the certificate, so that the lines charged and the re-ratings raised are the whole of what
          was collected for the cover.
        resolved_by: raise_premium_rerating_6e8395e4
        effect: >-
          Once the re-rating stands on the premium record, the premium the record shows collected rises by the
          amount charged and the premium returned rises in the same proportion of the cover still to run.
    cross_category: []
    compute:
      - premium_charged: "SUM('care_premium_entries','amount_usd', event_type='care_premium_charge')"
      - premium_readjusted: "SUM('care_premium_entries','amount_usd', event_type='care_premium_adjustment')"
      - premium_returned_lines: "SUM('care_premium_entries','amount_usd', event_type='care_premium_refund')"
      - policy_fee_collected: "SUM('care_premium_entries','amount_usd', charge_category='policy_fee')"
      - returned_line_count: "COUNT('care_premium_entries', event_type='care_premium_refund')"
      - fee_line_count: "COUNT('care_premium_entries', charge_category='policy_fee')"
      - premium_ledger: "(premium_charged + premium_readjusted + premium_returned_lines - policy_fee_collected if (returned_line_count > 0 and fee_line_count > 0) else (premium_charged + premium_readjusted - policy_fee_collected if (fee_line_count > 0 and returned_line_count == 0) else premium_charged + premium_readjusted + premium_returned_lines))"
      - claims_filed: "COUNT('care_claims', event_type='care_claim_file')"
      - days_since_issue: "DAYS(F('issued_date'), NOW)"
      - share_returned: "(P('mid_term_cancel_refund_pct') / 100 if (days_since_issue > P('free_look_days') and claims_filed == 0) else (0.0 if claims_filed > 0 else P('free_look_refund_pct') / 100))"
      - issued_before_journey: "DAYS(F('issued_date'), F('trip_start_date'))"
      - days_to_journey_end: "DAYS(NOW, F('trip_end_date'))"
      - days_of_cover_bought: "(DAYS(F('issued_date'), F('trip_end_date')) + 1 if issued_before_journey > 0 else (DAYS(F('issued_date'), F('trip_end_date')) if (issued_before_journey <= 0 and days_to_journey_end >= 0) else DAYS(F('trip_start_date'), F('trip_end_date')) + 1))"
      - days_since_departure: "DAYS(F('trip_start_date'), NOW)"
      - days_of_cover_remaining: "(days_to_journey_end if (days_since_departure < 0 and days_to_journey_end > 0) else (days_to_journey_end - 1 if (days_since_departure >= 0 and days_to_journey_end > 0) else days_of_cover_bought))"
      - result: "RND(MX(premium_ledger * days_of_cover_remaining / days_of_cover_bought * share_returned, 0), 2)"
