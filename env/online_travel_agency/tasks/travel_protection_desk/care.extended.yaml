  formula:
    base_premium_usd: round(trip_cost_usd * premium_base_rate_pct / 100, 2)
    destination_loading_usd: round(trip_cost_usd * premium_base_rate_pct / 100 * destination_loading_pct / 100, 2)
- id: care_free_look
  subject:
  - care_cancel
  - care_premium_refund
  rule: Only the policyholder may give up their own cover, and the cancellation is confirmed by the policyholder rather than performed on their behalf. A free-look cancellation is handled at the full refund
    only when frozen time is not after the moment the certificate of insurance was issued to the policyholder plus the free-look period of the plan held. The free-look period is counted in whole calendar
    days from the day after the issue date, weekends and public holidays included, and a cancellation confirmed exactly on the closing day is still inside the period. Inside the free-look period the whole
    premium is returned to the original form of payment, the policy fee excepted, and the agency's commission is recovered in full. The free-look right is lost as soon as the journey has begun or a claim
    has been filed, whichever comes first, however many days of the period remain. Outside the free-look period the mid-term terms apply instead, and the two are never combined. A returned premium is raised
    against the premium lines that collected it, so a policy with several premium lines returns as several refund lines.
  eligibility:
  - id: inside_free_look
    applies_to:
    - care_cancel
    kind: time
    condition: A free-look cancellation is handled at the full refund only when frozen time is not after the moment the certificate of insurance was issued to the policyholder plus the free-look period
      of the plan held.
    evidence_fields:
    - care_policies.issued_at
    - care_policies.care_policy_id
    - care_policies.trip_start_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - care_policies.care_policy_id
      action_bindings:
        care_policies.care_policy_id: care_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the certificate of insurance was issued to the policyholder
      anchor_source: care_policies.issued_at
      relation: not_after
      duration_source: variants.free_look_days
      unit: calendar_days
      counting_rule: The free-look period is counted in whole calendar days from the day after the issue date, weekends and public holidays included, and a cancellation confirmed exactly on the closing
        day is still inside the period.
      boundary: inclusive
  params:
    per_tier:
      Trip Basics Essential:
        free_look_days: =free_look_days
        free_look_refund_pct: =free_look_refund_pct
        policy_fee_usd: =policy_fee_usd
        commission_clawback_pct: =commission_clawback_pct
      Trip Basics Standard:
        free_look_days: =free_look_days
        free_look_refund_pct: =free_look_refund_pct
        policy_fee_usd: =policy_fee_usd
        commission_clawback_pct: =commission_clawback_pct
      TripGuard Plus:
        free_look_days: =free_look_days
        free_look_refund_pct: =free_look_refund_pct
        policy_fee_usd: =policy_fee_usd
