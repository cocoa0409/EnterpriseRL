  rule: After the free-look period the policyholder may still give up cover, and the plan's mid-term share of the unearned premium is returned. Unearned premium is measured by the whole days of cover remaining
    out of the whole days of cover bought, counted from the day after the cancellation takes effect. Nothing is returned on a plan whose mid-term share is zero, and nothing is returned once any claim has
    been filed under the policy, whatever the plan. The policy fee and any cancel-for-any-reason upgrade premium are never part of the unearned premium. Cover ends at the moment the cancellation is confirmed,
    and an incident occurring afterwards is not covered even where the journey continues. A cancelled policy is never reinstated; a traveller who changes their mind buys fresh cover, subject to the underwriting
