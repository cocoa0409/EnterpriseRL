    baseline:
      rule: >-
        Where a declared particular of the risk has changed after issue, the premium is re-rated and the
        difference between the premium the certificate now rates to and the premium the record shows collected is
        charged over the days of cover still to run. The premium the certificate now rates to is the declared trip
        cost standing on it at the rate applied, rounded to two decimal places at that step. The rate applied is
        the plan's base rate together with the plan's destination loading percentage. The premium the record shows
        collected is the figure the policy record shows paid. The difference is never less than nothing. The
        difference is then taken in the proportion the days of cover still to run bear to the days of cover
        bought, and never charged in full where cover has already begun to run. The days of cover still to run are
        counted from the day the change takes effect to the last date of the journey, both counted. The day the
        change takes effect is the day the certificate was issued. The days of cover bought are the days of the
        journey, its first and last both counted. The charge is rounded to two decimal places once, at the end,
        and no intermediate figure is rounded.
      params: [premium_base_rate_pct, destination_loading_pct]
