extended_policies:
  - id: care_ext_third_party_recovery
    base_policy_refs: [care_subrogation]
    overwrite: []
    trigger: state_due
    subject: [care_claim_recovery]
    computes: recovered_amount_usd
    target_tool: book_benefit_recovery_c1be7196
    params:
      compensation_window_months: 12
    rule: >
      Where a liable third party has paid the traveller for a loss this policy has already settled, the
      insurer recovers what it paid, and the recovery restores the benefit that settlement consumed.
      What is recovered is the lower of the settlement the compensation answers and the compensation
      available to the insurer, and never less than nothing. The settlement the compensation answers is
      the payment standing last on the policy's claim record. The compensation available to the insurer
      is the compensation counted less what is set aside for the traveller. The compensation counted is
      the money the carrier has paid out on the traveller's bookings in the twelve months before the day
      the recovery is booked, together with the travel credit counted. The travel credit counted is
      nothing. Nothing is set aside for the traveller. The recovery is rounded to two decimal places
      once, at the end, and no intermediate figure is rounded.
      Where the carrier's ledger carries a payout raised on an involuntary schedule change and the claim
      record carries a payment made on a missed connection, the settlement the compensation answers is
      the payment made on the missed connection head; where the carrier's ledger carries no payout raised
      on an involuntary schedule change and the claim record carries a payment made on a travel delay,
      the settlement the compensation answers is the payment made on the travel delay head; and in every
      other case the settlement the compensation answers is the payment standing last on the policy's
      claim record.
      Where the settlement the compensation answers was made on a missed connection and the carrier's
      ledger carries payouts raised on an involuntary schedule change, the money counted is what the
      carrier has paid on that ground in those twelve months; where the settlement was made on a baggage
      head and the carrier's ledger carries payouts raised on an airline cancellation, the money counted
      is what the carrier has paid on that ground in those twelve months; and in every other case the
      money counted is the whole of what the carrier has paid out on the traveller's bookings in those
      twelve months.
      Where the carrier settled part of that compensation as travel credit and the credit stands redeemed
      in full, the travel credit counted is the sum the credit was issued for; where such a credit stands
      redeemed in part, the travel credit counted is the part redeemed; and in every other case the
      travel credit counted is nothing, the traveller having received no money for it.
      Where a deductible was withheld from the settlement the compensation answers and the compensation
      counted is more than that deductible, what is set aside for the traveller is the deductible
      withheld from that settlement; where a deductible was withheld from that settlement and the
      compensation counted is no more than that deductible, what is set aside for the traveller is the
      whole of the compensation counted; and in every other case nothing is set aside for the traveller.
    prerequisite: []
    cross_category:
      - category: air
        as: history
        reads: [status, air_booking_events.amount_usd, air_booking_events.event_type, air_booking_events.reason_code, air_booking_events.posted_date]
        note: the carrier's own ledger decides how much compensation is counted and how a settlement made in travel credit is valued
    compute:
      - missed_connection_payments: "SUM('care_claims','paid_amount_usd', event_type='care_claim_payout', claim_type='missed_connection')"
      - travel_delay_payments: "SUM('care_claims','paid_amount_usd', event_type='care_claim_payout', claim_type='travel_delay')"
      - last_payment_made: "LATEST('care_claims','paid_amount_usd', date_field='decided_date', event_type='care_claim_payout')"
      - baggage_payments: "SUM('care_claims','paid_amount_usd', event_type='care_claim_payout', claim_type='baggage_delay')"
      - carrier_schedule_change_payouts: "ABS(XSUM('air','air_booking_events','amount_usd', within_months=K('compensation_window_months'), date_field='posted_date', event_type='air_refund_payout', reason_code='involuntary_schedule_change'))"
      - settlement_answered: "(missed_connection_payments if (carrier_schedule_change_payouts > 0 and missed_connection_payments > 0) else (travel_delay_payments if (carrier_schedule_change_payouts == 0 and travel_delay_payments > 0) else last_payment_made))"
      - carrier_cancellation_payouts: "ABS(XSUM('air','air_booking_events','amount_usd', within_months=K('compensation_window_months'), date_field='posted_date', event_type='air_refund_payout', reason_code='airline_cancellation'))"
      - carrier_all_payouts: "ABS(XSUM('air','air_booking_events','amount_usd', within_months=K('compensation_window_months'), date_field='posted_date', event_type='air_refund_payout'))"
      - money_counted: "(carrier_schedule_change_payouts if (missed_connection_payments > 0 and carrier_schedule_change_payouts > 0) else (carrier_cancellation_payouts if (baggage_payments > 0 and carrier_cancellation_payouts > 0) else carrier_all_payouts))"
      - credit_issued: "ABS(XSUM('air','air_booking_events','amount_usd', within_months=K('compensation_window_months'), date_field='posted_date', event_type='air_credit_issue'))"
      - credit_redeemed: "ABS(XSUM('air','air_booking_events','amount_usd', within_months=K('compensation_window_months'), date_field='posted_date', event_type='air_credit_redeem'))"
      - credit_counted: "(credit_issued if (credit_issued > 0 and credit_redeemed >= credit_issued) else (credit_redeemed if (credit_issued > 0 and credit_redeemed > 0) else 0.0))"
      - compensation_counted: "money_counted + credit_counted"
      - deductible_on_settlement: "SUM('care_claims','deductible_applied_usd', event_type='care_claim_payout', claim_type='missed_connection')"
      - traveller_share: "(deductible_on_settlement if (deductible_on_settlement > 0 and compensation_counted > deductible_on_settlement) else (compensation_counted if (deductible_on_settlement > 0 and compensation_counted <= deductible_on_settlement) else 0.0))"
      - compensation_available: "MX(compensation_counted - traveller_share, 0)"
      - result: "RND(MX(MN(settlement_answered, compensation_available), 0), 2)"
    compute_basis:
      missed_connection_payments: "Where the carrier's ledger carries a payout raised on an involuntary schedule change and the claim record carries a payment made on a missed connection, the settlement the compensation answers is the payment made on the missed connection head"
      travel_delay_payments: "where the carrier's ledger carries no payout raised on an involuntary schedule change and the claim record carries a payment made on a travel delay, the settlement the compensation answers is the payment made on the travel delay head"
      last_payment_made: "The settlement the compensation answers is the payment standing last on the policy's claim record."
      baggage_payments: "where the settlement was made on a baggage head and the carrier's ledger carries payouts raised on an airline cancellation, the money counted is what the carrier has paid on that ground in those twelve months"
      carrier_schedule_change_payouts: "the money counted is what the carrier has paid on that ground in those twelve months"
      settlement_answered: "Where the carrier's ledger carries a payout raised on an involuntary schedule change and the claim record carries a payment made on a missed connection, the settlement the compensation answers is the payment made on the missed connection head; where the carrier's ledger carries no payout raised on an involuntary schedule change and the claim record carries a payment made on a travel delay, the settlement the compensation answers is the payment made on the travel delay head; and in every other case the settlement the compensation answers is the payment standing last on the policy's claim record."
      carrier_cancellation_payouts: "where the settlement was made on a baggage head and the carrier's ledger carries payouts raised on an airline cancellation, the money counted is what the carrier has paid on that ground in those twelve months"
      carrier_all_payouts: "the money counted is the whole of what the carrier has paid out on the traveller's bookings in those twelve months"
      money_counted: "Where the settlement the compensation answers was made on a missed connection and the carrier's ledger carries payouts raised on an involuntary schedule change, the money counted is what the carrier has paid on that ground in those twelve months; where the settlement was made on a baggage head and the carrier's ledger carries payouts raised on an airline cancellation, the money counted is what the carrier has paid on that ground in those twelve months; and in every other case the money counted is the whole of what the carrier has paid out on the traveller's bookings in those twelve months."
      credit_issued: "Where the carrier settled part of that compensation as travel credit and the credit stands redeemed in full, the travel credit counted is the sum the credit was issued for"
      credit_redeemed: "where such a credit stands redeemed in part, the travel credit counted is the part redeemed"
      credit_counted: "Where the carrier settled part of that compensation as travel credit and the credit stands redeemed in full, the travel credit counted is the sum the credit was issued for; where such a credit stands redeemed in part, the travel credit counted is the part redeemed; and in every other case the travel credit counted is nothing, the traveller having received no money for it."
      compensation_counted: "The compensation counted is the money the carrier has paid out on the traveller's bookings in the twelve months before the day the recovery is booked, together with the travel credit counted."
      deductible_on_settlement: "Where a deductible was withheld from the settlement the compensation answers and the compensation counted is more than that deductible, what is set aside for the traveller is the deductible withheld from that settlement"
      traveller_share: "Where a deductible was withheld from the settlement the compensation answers and the compensation counted is more than that deductible, what is set aside for the traveller is the deductible withheld from that settlement; where a deductible was withheld from that settlement and the compensation counted is no more than that deductible, what is set aside for the traveller is the whole of the compensation counted; and in every other case nothing is set aside for the traveller."
      compensation_available: "The compensation available to the insurer is the compensation counted less what is set aside for the traveller."
      result: "What is recovered is the lower of the settlement the compensation answers and the compensation available to the insurer, and never less than nothing."
    factors:
      - id: settlement_answered_rule
        effect: method
        decides: settlement_answered
        bindings: [missed_connection_payments, travel_delay_payments, last_payment_made, carrier_schedule_change_payouts, settlement_answered]
        ladder:
          - when: "the carrier's ledger carries a payout raised on an involuntary schedule change and the claim record carries a payment made on a missed connection"
            method: "the settlement the compensation answers is the payment made on the missed connection head"
          - when: "the carrier's ledger carries no payout raised on an involuntary schedule change and the claim record carries a payment made on a travel delay"
            method: "the settlement the compensation answers is the payment made on the travel delay head"
          - when: "otherwise"
            method: "the settlement the compensation answers is the payment standing last on the policy's claim record"
        baseline:
          settlement_answered: "last_payment_made"
        evidence: [history, cross_category]
        cross_difficulty: air
      - id: money_counted_ground
        effect: parameter
        decides: money_counted
        bindings: [baggage_payments, carrier_cancellation_payouts, carrier_all_payouts, money_counted]
        ladder:
          - when: "the settlement the compensation answers was made on a missed connection and the carrier's ledger carries payouts raised on an involuntary schedule change"
            value: "what the carrier has paid on that ground in those twelve months"
          - when: "the settlement was made on a baggage head and the carrier's ledger carries payouts raised on an airline cancellation"
            value: "what the carrier has paid on that ground in those twelve months"
          - when: "otherwise"
            value: "the whole of what the carrier has paid out on the traveller's bookings in those twelve months"
        baseline:
          money_counted: "carrier_all_payouts"
        evidence: [cross_category, history]
        cross_difficulty: air
      - id: credit_valuation
        effect: method
        decides: credit_counted
        bindings: [credit_issued, credit_redeemed, credit_counted]
        ladder:
          - when: "the carrier settled part of that compensation as travel credit and the credit stands redeemed in full"
            method: "the travel credit counted is the sum the credit was issued for"
          - when: "such a credit stands redeemed in part"
            method: "the travel credit counted is the part redeemed"
          - when: "otherwise"
            method: "the travel credit counted is nothing"
        baseline:
          credit_counted: "0.0"
        evidence: [cross_category]
        cross_difficulty: air
      - id: traveller_share_rule
        effect: parameter
        decides: traveller_share
        bindings: [deductible_on_settlement, traveller_share]
        ladder:
          - when: "a deductible was withheld from the settlement the compensation answers and the compensation counted is more than that deductible"
            value: "the deductible withheld from that settlement"
          - when: "a deductible was withheld from that settlement and the compensation counted is no more than that deductible"
            value: "the whole of the compensation counted"
          - when: "otherwise"
            value: "nothing"
        baseline:
          traveller_share: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        What is recovered is the lower of the settlement the compensation answers and the compensation
        available to the insurer, and never less than nothing. The settlement the compensation answers is
        the payment standing last on the policy's claim record. The compensation available to the insurer
        is the compensation counted less what is set aside for the traveller. The compensation counted is
        the money the carrier has paid out on the traveller's bookings in the twelve months before the day
        the recovery is booked, together with the travel credit counted. The travel credit counted is
        nothing. Nothing is set aside for the traveller. The recovery is rounded to two decimal places
        once, at the end, and no intermediate figure is rounded.
      params: [compensation_window_months]
    inputs:
      history:
        - {table: care_claims, aggregate: sum, field: paid_amount_usd, within_months: null, filters: {event_type: care_claim_payout}}
        - {table: care_claims, aggregate: latest, field: paid_amount_usd, within_months: null, filters: {event_type: care_claim_payout}}
        - {category: air, table: air_booking_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: air_refund_payout}}
      cross_category: [air]

  - id: care_ext_claim_head_filing
    base_policy_refs: [care_claim_filing]
    overwrite:
      - base_policy: care_claim_filing
        superseded_clause: >-
          A claim is filed only when no claim carrying the same claim reference has already been filed on this policy.
        replaced_by: >-
          A claim is filed against one benefit under the reference the insurer quoted for the incident, and no more
          than one claim is filed against the same benefit under that reference on the policy, because one incident is
          settled as one case with a head for each benefit it touches.
    trigger: state_due
    subject: [care_claim_file]
    computes: claimed_amount_usd
    target_tool: file_benefit_claim_dde0dff5
    params: {}
    rule: >
      A claim is filed against one benefit under the reference the insurer quoted for the incident, and no more
      than one claim is filed against the same benefit under that reference on the policy, because one incident is
      settled as one case with a head for each benefit it touches.
      A claim for a journey broken into is filed for the value of the days not taken, together with what the
      traveller paid to come home, less what the suppliers have already returned. The value of the days not taken is
      the journey's value spread evenly over the days of the journey and multiplied by the days not taken, rounded to
      two decimal places at that step. The journey's value is the trip cost declared on the certificate. The days of
      the journey are counted from its first date to its last, both counted. The days not taken are counted from the
      day the journey was broken into to its last date, both counted. What the traveller paid to come home is
      nothing. What the suppliers have already returned is nothing. The amount filed is never less than nothing and
      is rounded to two decimal places once at the end, no intermediate figure being rounded except the value of the
      days not taken.
      Where the air booking that departs on the first date of the journey carries more money paid on it
      than the trip cost declared on the certificate and that booking stands travelled, the journey's value is the
      money paid on that booking; where that booking stands refunded and the
      money paid on it is no more than the trip cost declared, the journey's value is the trip cost declared less
      what the carrier has refunded; and in every other case the journey's value is the trip cost declared on the
      certificate.
      Where a delay head stands decided on the claim record and the carrier's ledger carries a fare charged for an earlier return home raised on an airline cancellation, the days not taken are counted from the day that earlier return was bought to the last date of the journey, both counted; where a delay head stands decided on the claim record and the carrier's ledger carries no such fare, the days not taken are counted from the day after the journey was broken into to its last date, the last date counted; and in every other case the days not taken are counted from the
      day the journey was broken into to its last date, both counted.
      Where the carrier's ledger carries both a fare charged and a change fee raised on an airline cancellation, what
      the traveller paid to come home is the fare and the change fee together; where it carries such a fare but no
      such change fee, what the traveller paid to come home is that fare alone; and in every other case what the
      traveller paid to come home is nothing.
      Where a travel credit stands redeemed on the traveller's bookings and something was charged for the return
      home, what the traveller paid to come home is reduced by the credit redeemed, because a credit the carrier
      granted is not money out of the traveller's own pocket; where no travel credit stands redeemed and the carrier
      has refunded part of the fare on an airline cancellation, what the traveller paid to come home is reduced by
      that refund; and in every other case what the traveller paid to come home stands at what the carrier charged
      for it.
      Where the property's folio carries a refund paid on the reservation and the reservation stands checked out,
      what the suppliers have already returned is the refund the property has paid; where the property's folio
      carries property credit spent on the reservation and the reservation stands cancelled, what the suppliers have
      already returned is the property credit spent; and in every other case what the suppliers have already returned
      is nothing.
    prerequisite: []
    cross_category:
      - category: air
        as: history
        reads: [status, amount_paid_usd, air_booking_events.amount_usd, air_booking_events.event_type, air_booking_events.reason_code, air_booking_events.posted_date]
        note: the carrier's own record decides the journey's value, the day the days not taken run from, what was charged for the return home and the credit set against it
      - category: stay
        as: history
        reads: [status, stay_folio_entries.amount_usd, stay_folio_entries.event_type]
        note: the property's folio decides what the suppliers have already returned against the days not taken
    compute:
      - booking_paid: "CFIELD('air','amount_paid_usd', departure_date=F('trip_start_date'))"
      - booking_status: "CFIELD('air','status', departure_date=F('trip_start_date'))"
      - carrier_refunded_total: "ABS(XSUM('air','air_booking_events','amount_usd', event_type='air_refund_payout'))"
      - journey_value: "(booking_paid if (booking_paid > F('trip_cost_usd') and booking_status == 'travelled') else (MX(F('trip_cost_usd') - carrier_refunded_total, 0) if (booking_status == 'refunded' and booking_paid <= F('trip_cost_usd')) else F('trip_cost_usd')))"
      - interruption_date: "LATEST('care_claims','incident_date', date_field='decided_date', event_type='care_claim_decision', claim_status='approved')"
      - early_return_fare_date: "XLATEST('air','air_booking_events','posted_date', date_field='posted_date', event_type='air_fare_charge', reason_code='airline_cancellation')"
      - delay_heads_decided: "COUNT('care_claims', event_type='care_claim_decision', claim_type='travel_delay')"
      - unused_days: "(DAYS(early_return_fare_date, F('trip_end_date')) + 1 if (delay_heads_decided > 0 and early_return_fare_date != None) else (DAYS(interruption_date, F('trip_end_date')) if (delay_heads_decided > 0 and early_return_fare_date == None) else DAYS(interruption_date, F('trip_end_date')) + 1))"
      - journey_days: "DAYS(F('trip_start_date'), F('trip_end_date')) + 1"
      - unused_value: "RND(journey_value * unused_days / journey_days, 2)"
      - return_fare_charged: "ABS(XSUM('air','air_booking_events','amount_usd', event_type='air_fare_charge', reason_code='airline_cancellation'))"
      - return_change_fee: "ABS(XSUM('air','air_booking_events','amount_usd', event_type='air_change_fee_charge', reason_code='airline_cancellation'))"
      - return_home_charges: "(return_fare_charged + return_change_fee if (return_fare_charged > 0 and return_change_fee > 0) else (return_fare_charged if (return_fare_charged > 0 and return_change_fee == 0) else 0.0))"
      - carrier_credit_redeemed: "ABS(XSUM('air','air_booking_events','amount_usd', event_type='air_credit_redeem'))"
      - carrier_cancellation_refunds: "ABS(XSUM('air','air_booking_events','amount_usd', event_type='air_refund_payout', reason_code='airline_cancellation'))"
      - return_home_cost: "(MX(return_home_charges - carrier_credit_redeemed, 0) if (carrier_credit_redeemed > 0 and return_home_charges > 0) else (MX(return_home_charges - carrier_cancellation_refunds, 0) if (carrier_credit_redeemed == 0 and carrier_cancellation_refunds > 0) else return_home_charges))"
      - property_refund_paid: "ABS(XSUM('stay','stay_folio_entries','amount_usd', event_type='stay_refund_payout'))"
      - property_status: "CFIELD('stay','status')"
      - property_credit_spent: "ABS(XSUM('stay','stay_folio_entries','amount_usd', event_type='stay_resort_credit_use'))"
      - supplier_returned: "(property_refund_paid if (property_refund_paid > 0 and property_status == 'checked_out') else (property_credit_spent if (property_credit_spent > 0 and property_status == 'cancelled') else 0.0))"
      - result: "RND(MX(unused_value + return_home_cost - supplier_returned, 0), 2)"
    compute_basis:
      booking_paid: "Where the air booking that departs on the first date of the journey carries more money paid on it than the trip cost declared on the certificate and that booking stands travelled, the journey's value is the money paid on that booking"
      booking_status: "where that booking stands refunded and the money paid on it is no more than the trip cost declared, the journey's value is the trip cost declared less what the carrier has refunded"
      carrier_refunded_total: "the journey's value is the trip cost declared less what the carrier has refunded"
      journey_value: "Where the air booking that departs on the first date of the journey carries more money paid on it than the trip cost declared on the certificate and that booking stands travelled, the journey's value is the money paid on that booking; where that booking stands refunded and the money paid on it is no more than the trip cost declared, the journey's value is the trip cost declared less what the carrier has refunded; and in every other case the journey's value is the trip cost declared on the certificate."
      interruption_date: "The days not taken are counted from the day the journey was broken into to its last date, both counted."
      early_return_fare_date: "Where a delay head stands decided on the claim record and the carrier's ledger carries a fare charged for an earlier return home raised on an airline cancellation, the days not taken are counted from the day that earlier return was bought to the last date of the journey, both counted"
      delay_heads_decided: "where a delay head stands decided on the claim record and the carrier's ledger carries no such fare, the days not taken are counted from the day after the journey was broken into to its last date, the last date counted"
      unused_days: "Where a delay head stands decided on the claim record and the carrier's ledger carries a fare charged for an earlier return home raised on an airline cancellation, the days not taken are counted from the day that earlier return was bought to the last date of the journey, both counted; where a delay head stands decided on the claim record and the carrier's ledger carries no such fare, the days not taken are counted from the day after the journey was broken into to its last date, the last date counted; and in every other case the days not taken are counted from the day the journey was broken into to its last date, both counted."
      journey_days: "The days of the journey are counted from its first date to its last, both counted."
      unused_value: "The value of the days not taken is the journey's value spread evenly over the days of the journey and multiplied by the days not taken, rounded to two decimal places at that step."
      return_fare_charged: "Where the carrier's ledger carries both a fare charged and a change fee raised on an airline cancellation, what the traveller paid to come home is the fare and the change fee together"
      return_change_fee: "where it carries such a fare but no such change fee, what the traveller paid to come home is that fare alone"
      return_home_charges: "Where the carrier's ledger carries both a fare charged and a change fee raised on an airline cancellation, what the traveller paid to come home is the fare and the change fee together; where it carries such a fare but no such change fee, what the traveller paid to come home is that fare alone; and in every other case what the traveller paid to come home is nothing."
      carrier_credit_redeemed: "Where a travel credit stands redeemed on the traveller's bookings and something was charged for the return home, what the traveller paid to come home is reduced by the credit redeemed, because a credit the carrier granted is not money out of the traveller's own pocket"
      carrier_cancellation_refunds: "where no travel credit stands redeemed and the carrier has refunded part of the fare on an airline cancellation, what the traveller paid to come home is reduced by that refund"
      return_home_cost: "Where a travel credit stands redeemed on the traveller's bookings and something was charged for the return home, what the traveller paid to come home is reduced by the credit redeemed, because a credit the carrier granted is not money out of the traveller's own pocket; where no travel credit stands redeemed and the carrier has refunded part of the fare on an airline cancellation, what the traveller paid to come home is reduced by that refund; and in every other case what the traveller paid to come home stands at what the carrier charged for it."
      property_refund_paid: "Where the property's folio carries a refund paid on the reservation and the reservation stands checked out, what the suppliers have already returned is the refund the property has paid"
      property_status: "where the property's folio carries property credit spent on the reservation and the reservation stands cancelled, what the suppliers have already returned is the property credit spent"
      property_credit_spent: "where the property's folio carries property credit spent on the reservation and the reservation stands cancelled, what the suppliers have already returned is the property credit spent"
      supplier_returned: "Where the property's folio carries a refund paid on the reservation and the reservation stands checked out, what the suppliers have already returned is the refund the property has paid; where the property's folio carries property credit spent on the reservation and the reservation stands cancelled, what the suppliers have already returned is the property credit spent; and in every other case what the suppliers have already returned is nothing."
      result: "A claim for a journey broken into is filed for the value of the days not taken, together with what the traveller paid to come home, less what the suppliers have already returned."
    factors:
      - id: journey_value_basis
        effect: parameter
        decides: journey_value
        bindings: [booking_paid, booking_status, carrier_refunded_total, journey_value]
        ladder:
          - when: "the air booking that departs on the first date of the journey carries more money paid on it than the trip cost declared on the certificate and that booking stands travelled"
            value: "the money paid on that booking"
          - when: "that booking stands refunded and the money paid on it is no more than the trip cost declared"
            value: "the trip cost declared less what the carrier has refunded"
          - when: "otherwise"
            value: "the trip cost declared on the certificate"
        baseline:
          journey_value: "F('trip_cost_usd')"
        evidence: [cross_category]
        cross_difficulty: air
      - id: unused_days_anchor
        effect: method
        decides: unused_days
        bindings: [interruption_date, early_return_fare_date, delay_heads_decided, unused_days]
        ladder:
          - when: "a delay head stands decided on the claim record and the carrier's ledger carries a fare charged for an earlier return home raised on an airline cancellation"
            method: "the days not taken are counted from the day that earlier return was bought to the last date of the journey, both counted"
          - when: "a delay head stands decided on the claim record and the carrier's ledger carries no such fare"
            method: "the days not taken are counted from the day after the journey was broken into to its last date, the last date counted"
          - when: "otherwise"
            method: "the days not taken are counted from the day the journey was broken into to its last date, both counted"
        baseline:
          unused_days: "DAYS(interruption_date, F('trip_end_date')) + 1"
        evidence: [history, date, cross_category]
        cross_difficulty: air
      - id: return_home_charges_counted
        effect: parameter
        decides: return_home_charges
        bindings: [return_fare_charged, return_change_fee, return_home_charges]
        ladder:
          - when: "the carrier's ledger carries both a fare charged and a change fee raised on an airline cancellation"
            value: "the fare and the change fee together"
          - when: "the carrier's ledger carries such a fare but no such change fee"
            value: "that fare alone"
          - when: "otherwise"
            value: "nothing"
        baseline:
          return_home_charges: "0.0"
        evidence: [cross_category]
        cross_difficulty: air
      - id: return_home_credit_offset
        effect: method
        decides: return_home_cost
        bindings: [carrier_credit_redeemed, carrier_cancellation_refunds, return_home_cost]
        ladder:
          - when: "a travel credit stands redeemed on the traveller's bookings and something was charged for the return home"
            method: "what the traveller paid to come home is reduced by the credit redeemed"
          - when: "no travel credit stands redeemed and the carrier has refunded part of the fare on an airline cancellation"
            method: "what the traveller paid to come home is reduced by that refund"
          - when: "otherwise"
            method: "what the traveller paid to come home stands at what the carrier charged for it"
        baseline:
          return_home_cost: "return_home_charges"
        evidence: [cross_category]
        cross_difficulty: air
      - id: supplier_returned_rule
        effect: parameter
        decides: supplier_returned
        bindings: [property_refund_paid, property_status, property_credit_spent, supplier_returned]
        ladder:
          - when: "the property's folio carries a refund paid on the reservation and the reservation stands checked out"
            value: "the refund the property has paid"
          - when: "the property's folio carries property credit spent on the reservation and the reservation stands cancelled"
            value: "the property credit spent"
          - when: "otherwise"
            value: "nothing"
        baseline:
          supplier_returned: "0.0"
        evidence: [cross_category]
        cross_difficulty: stay
    baseline:
      rule: >-
        A claim for a journey broken into is filed for the value of the days not taken, together with what the
        traveller paid to come home, less what the suppliers have already returned. The value of the days not taken is
        the journey's value spread evenly over the days of the journey and multiplied by the days not taken, rounded to
        two decimal places at that step. The journey's value is the trip cost declared on the certificate. The days of
        the journey are counted from its first date to its last, both counted. The days not taken are counted from the
        day the journey was broken into to its last date, both counted. What the traveller paid to come home is
        nothing. What the suppliers have already returned is nothing. The amount filed is never less than nothing and
        is rounded to two decimal places once at the end, no intermediate figure being rounded except the value of the
        days not taken.
      params: []
    inputs:
      history:
        - {table: care_claims, aggregate: latest, field: incident_date, within_months: null, filters: {event_type: care_claim_decision}}
        - {category: air, table: air_booking_events, aggregate: sum, field: amount_usd, within_months: null, filters: {reason_code: airline_cancellation}}
        - {category: stay, table: stay_folio_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: stay_refund_payout}}
      cross_category: [air, stay]

  - id: care_ext_claim_payment_release
    base_policy_refs: [care_claim_settlement, care_agg_benefit_coordination, care_subrogation]
    overwrite: []
    trigger: state_due
    subject: [care_claim_payout]
    computes: paid_amount_usd
    target_tool: release_claim_payment_9edda418
    params: {}
    rule: >
      A payment on a decided claim is the money the insurer has allowed on it, held to the benefit still available
      under the policy, less the deductible withheld. The money the insurer has allowed is the figure standing on the
      decision the insurer has allowed and that awaits payment. The benefit still available is the benefit limit that
      applies to the head decided, less the benefit the policy has consumed in its term, and never less than nothing.
      The benefit limit that applies is the declared trip cost standing on the certificate, and the benefit the policy
      has consumed is the figure the policy record shows consumed. The deductible withheld is the plan's general
      deductible for each claim. The deductible is withheld from the settlement after the benefit limit has been
      applied and not before, and where what is withheld and what is set against the settlement together come to more
      than it, the payment is nothing rather than a debt. The payment is rounded to two decimal places once, at the
      end, and no intermediate figure is rounded.
      Where the head decided is a travel delay, the benefit limit that applies is the plan's travel delay benefit
      limit; where the head decided is a baggage delay, it is the plan's baggage delay benefit limit; where the head
      decided is an emergency medical treatment, it is the plan's emergency medical benefit limit for each insured
      traveller; and in every other case the benefit limit that applies is the declared trip cost standing on the
      certificate.
      Where the policy's claim record carries a recovery received from a liable third party, the benefit the policy
      has consumed is worked out from that record as the payments made under the policy less the recoveries received
      against them; where the claim record carries no such recovery and more than one payment stands on it, the
      benefit the policy has consumed is the sum of the payments standing on that record; and in every other case the
      benefit the policy has consumed is the figure the policy record shows consumed.
      Where the head decided is an emergency medical or dental treatment and what remains of the plan's ceiling on
      the deductible withheld across one policy is more than the plan's general deductible for each claim, the
      deductible withheld is the plan's medical deductible; where the head decided is damage to a hired vehicle and
      what remains of that ceiling is more than the plan's general deductible for each claim, the deductible withheld
      is the plan's rental vehicle damage deductible; where what remains of that ceiling is less than the plan's
      general deductible for each claim, the deductible withheld is only what remains of that ceiling; and in every
      other case the deductible withheld is the plan's general deductible for each claim.
      What a third party has already paid the traveller for the same loss is set against the settlement after the
      benefit limit has been applied and after the deductible has been withheld. Where the carrier's ledger for the
      traveller's bookings carries a payout raised on an airline cancellation and that payout
      posted on or after the day the head decided arose, what is set against the settlement is the total of the
      carrier's payouts raised on an airline cancellation; where the carrier's ledger carries no payout raised on an
      airline cancellation and that booking stands refunded, what is set against the settlement is the whole of what
      the carrier has paid out on it; and in every other case nothing is set against the settlement.
      The money paid on a decided claim is worked out only after the policy's claim record carries the recovery owed
      for every compensation a liable third party has paid the traveller on a settlement already made under this
      policy.
      A payment is released on a decided claim only once every benefit the same incident has touched stands filed on
      the policy, because one incident is settled as one case.
    prerequisite:
      - problem: care_ext_third_party_recovery
        kind: value_input
        gate: benefit_consumed
        form: state
        policy_source: >-
          The money paid on a decided claim is worked out only after the policy's claim record carries the recovery owed
          for every compensation a liable third party has paid the traveller on a settlement already made under this
          policy.
        condition: >-
          The policy's claim record carries a recovery row against every settlement for which a liable third party has
          paid the traveller compensation, so that the payments made less the recoveries received give the benefit the
          policy has truly consumed.
        resolved_by: book_benefit_recovery_c1be7196
        effect: >-
          Once the recovery stands on the claim record, the benefit consumed falls by the recovered amount, the benefit
          still available under the plan's limit rises by the same amount, and the payment released rises with it.
      - problem: care_ext_claim_head_filing
        kind: state_gate
        form: state
        gate: care_claims.claim_status
        policy_source: >-
          A payment is released on a decided claim only once every benefit the same incident has touched stands filed on
          the policy, because one incident is settled as one case.
        condition: >-
          Every benefit the incident behind the decided claim has touched stands on the policy's claim record as a claim
          filed under the reference the insurer quoted for that incident.
        resolved_by: file_benefit_claim_dde0dff5
        effect: >-
          Once the remaining head of that incident stands filed on the claim record, the case is complete and the
          payment on the decided head may be released.
    cross_category:
      - category: air
        as: history
        reads: [status, air_booking_events.amount_usd, air_booking_events.event_type, air_booking_events.reason_code, air_booking_events.posted_date]
        note: the carrier's own ledger decides what a third party has already paid the traveller for the same loss and is set against the settlement
    compute:
      - head_settled: "LATEST('care_claims','claim_type', date_field='decided_date', event_type='care_claim_decision', claim_status='approved')"
      - benefit_limit: "(P('travel_delay_limit_usd') if head_settled == 'travel_delay' else (P('baggage_delay_limit_usd') if head_settled == 'baggage_delay' else (P('medical_emergency_limit_usd') if head_settled == 'medical_emergency' else F('trip_cost_usd'))))"
      - payments_made: "SUM('care_claims','paid_amount_usd', event_type='care_claim_payout')"
      - recoveries_received: "SUM('care_claims','paid_amount_usd', event_type='care_claim_recovery')"
      - recovery_count: "COUNT('care_claims', event_type='care_claim_recovery')"
      - payment_count: "COUNT('care_claims', event_type='care_claim_payout')"
      - benefit_consumed: "(payments_made + recoveries_received if recovery_count > 0 else (payments_made if payment_count > 1 else F('benefit_used_usd')))"
      - benefit_available: "MX(benefit_limit - benefit_consumed, 0)"
      - allowed_amount: "LATEST('care_claims','paid_amount_usd', date_field='decided_date', event_type='care_claim_decision', claim_status='approved')"
      - deductibles_withheld: "SUM('care_claims','deductible_applied_usd', event_type='care_claim_payout')"
      - deductible_ceiling_left: "MX(P('deductible_per_policy_usd') - deductibles_withheld, 0)"
      - deductible_withheld: "(P('medical_deductible_usd') if ((head_settled == 'medical_emergency' or head_settled == 'dental_emergency') and deductible_ceiling_left > P('deductible_per_claim_usd')) else (P('rental_damage_deductible_usd') if (head_settled == 'rental_damage' and deductible_ceiling_left > P('deductible_per_claim_usd')) else (deductible_ceiling_left if deductible_ceiling_left < P('deductible_per_claim_usd') else P('deductible_per_claim_usd'))))"
      - head_incident_date: "LATEST('care_claims','incident_date', date_field='decided_date', event_type='care_claim_decision', claim_status='approved')"
      - carrier_cancellation_payouts: "ABS(XSUM('air','air_booking_events','amount_usd', event_type='air_refund_payout', reason_code='airline_cancellation'))"
      - carrier_cancellation_last_date: "XLATEST('air','air_booking_events','posted_date', date_field='posted_date', event_type='air_refund_payout', reason_code='airline_cancellation')"
      - carrier_booking_status: "CFIELD('air','status', departure_date=F('trip_start_date'))"
      - carrier_payouts_total: "ABS(XSUM('air','air_booking_events','amount_usd', event_type='air_refund_payout'))"
      - settlement_offset: "(carrier_cancellation_payouts if (carrier_cancellation_payouts > 0 and DAYS(head_incident_date, carrier_cancellation_last_date) >= 0) else (carrier_payouts_total if (carrier_cancellation_payouts == 0 and carrier_booking_status == 'refunded') else 0.0))"
      - result: "RND(MX(MN(allowed_amount, benefit_available) - deductible_withheld - settlement_offset, 0), 2)"
    compute_basis:
      head_settled: "Where the head decided is a travel delay, the benefit limit that applies is the plan's travel delay benefit limit"
      benefit_limit: "Where the head decided is a travel delay, the benefit limit that applies is the plan's travel delay benefit limit; where the head decided is a baggage delay, it is the plan's baggage delay benefit limit; where the head decided is an emergency medical treatment, it is the plan's emergency medical benefit limit for each insured traveller; and in every other case the benefit limit that applies is the declared trip cost standing on the certificate."
      payments_made: "the benefit the policy has consumed is worked out from that record as the payments made under the policy less the recoveries received against them"
      recoveries_received: "the benefit the policy has consumed is worked out from that record as the payments made under the policy less the recoveries received against them"
      recovery_count: "Where the policy's claim record carries a recovery received from a liable third party, the benefit the policy has consumed is worked out from that record as the payments made under the policy less the recoveries received against them"
      payment_count: "where the claim record carries no such recovery and more than one payment stands on it, the benefit the policy has consumed is the sum of the payments standing on that record"
      benefit_consumed: "Where the policy's claim record carries a recovery received from a liable third party, the benefit the policy has consumed is worked out from that record as the payments made under the policy less the recoveries received against them; where the claim record carries no such recovery and more than one payment stands on it, the benefit the policy has consumed is the sum of the payments standing on that record; and in every other case the benefit the policy has consumed is the figure the policy record shows consumed."
      benefit_available: "The benefit still available is the benefit limit that applies to the head decided, less the benefit the policy has consumed in its term, and never less than nothing."
      allowed_amount: "The money the insurer has allowed is the figure standing on the decision the insurer has allowed and that awaits payment."
      deductibles_withheld: "where what remains of that ceiling is less than the plan's general deductible for each claim, the deductible withheld is only what remains of that ceiling"
      deductible_ceiling_left: "where what remains of that ceiling is less than the plan's general deductible for each claim, the deductible withheld is only what remains of that ceiling"
      deductible_withheld: "Where the head decided is an emergency medical or dental treatment and what remains of the plan's ceiling on the deductible withheld across one policy is more than the plan's general deductible for each claim, the deductible withheld is the plan's medical deductible; where the head decided is damage to a hired vehicle and what remains of that ceiling is more than the plan's general deductible for each claim, the deductible withheld is the plan's rental vehicle damage deductible; where what remains of that ceiling is less than the plan's general deductible for each claim, the deductible withheld is only what remains of that ceiling; and in every other case the deductible withheld is the plan's general deductible for each claim."
      head_incident_date: "Where the carrier's ledger for the traveller's bookings carries a payout raised on an airline cancellation and that payout posted on or after the day the head decided arose, what is set against the settlement is the total of the carrier's payouts raised on an airline cancellation"
      carrier_cancellation_payouts: "what is set against the settlement is the total of the carrier's payouts raised on an airline cancellation"
      carrier_cancellation_last_date: "that payout posted on or after the day the head decided arose"
      carrier_booking_status: "where the carrier's ledger carries no payout raised on an airline cancellation and that booking stands refunded, what is set against the settlement is the whole of what the carrier has paid out on it"
      carrier_payouts_total: "what is set against the settlement is the whole of what the carrier has paid out on it"
      settlement_offset: "Where the carrier's ledger for the traveller's bookings carries a payout raised on an airline cancellation and that payout posted on or after the day the head decided arose, what is set against the settlement is the total of the carrier's payouts raised on an airline cancellation; where the carrier's ledger carries no payout raised on an airline cancellation and that booking stands refunded, what is set against the settlement is the whole of what the carrier has paid out on it; and in every other case nothing is set against the settlement."
      result: "A payment on a decided claim is the money the insurer has allowed on it, held to the benefit still available under the policy, less the deductible withheld."
    factors:
      - id: benefit_limit_by_head
        effect: parameter
        decides: benefit_limit
        bindings: [head_settled, benefit_limit]
        ladder:
          - when: "the head decided is a travel delay"
            value: "the plan's travel delay benefit limit"
          - when: "the head decided is a baggage delay"
            value: "the plan's baggage delay benefit limit"
          - when: "the head decided is an emergency medical treatment"
            value: "the plan's emergency medical benefit limit for each insured traveller"
          - when: "otherwise"
            value: "the declared trip cost standing on the certificate"
        baseline:
          benefit_limit: "F('trip_cost_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: benefit_consumed_basis
        effect: method
        decides: benefit_consumed
        bindings: [payments_made, recoveries_received, recovery_count, payment_count, benefit_consumed]
        ladder:
          - when: "the policy's claim record carries a recovery received from a liable third party"
            method: "the benefit consumed is worked out from the claim record as the payments made less the recoveries received against them"
          - when: "the claim record carries no such recovery and more than one payment stands on it"
            method: "the benefit consumed is the sum of the payments standing on the claim record"
          - when: "otherwise"
            method: "the benefit consumed is the figure the policy record shows consumed"
        baseline:
          benefit_consumed: "F('benefit_used_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: deductible_withheld_rule
        effect: parameter
        decides: deductible_withheld
        bindings: [deductibles_withheld, deductible_ceiling_left, deductible_withheld]
        ladder:
          - when: "the head decided is an emergency medical or dental treatment and what remains of the plan's ceiling on the deductible withheld across one policy is more than the plan's general deductible for each claim"
            value: "the plan's medical deductible"
          - when: "the head decided is damage to a hired vehicle and what remains of that ceiling is more than the plan's general deductible for each claim"
            value: "the plan's rental vehicle damage deductible"
          - when: "what remains of that ceiling is less than the plan's general deductible for each claim"
            value: "only what remains of that ceiling"
          - when: "otherwise"
            value: "the plan's general deductible for each claim"
        baseline:
          deductible_withheld: "P('deductible_per_claim_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: third_party_offset
        effect: parameter
        decides: settlement_offset
        bindings: [head_incident_date, carrier_cancellation_payouts, carrier_cancellation_last_date, carrier_booking_status, carrier_payouts_total, settlement_offset]
        ladder:
          - when: "the carrier's ledger for the traveller's bookings carries a payout raised on an airline cancellation and that payout posted on or after the day the head decided arose"
            value: "the total of the carrier's payouts raised on an airline cancellation"
          - when: "the carrier's ledger carries no payout raised on an airline cancellation and that booking stands refunded"
            value: "the whole of what the carrier has paid out on it"
          - when: "otherwise"
            value: "nothing"
        baseline:
          settlement_offset: "0.0"
        evidence: [cross_category, date, history]
        cross_difficulty: air
    baseline:
      rule: >-
        A payment on a decided claim is the money the insurer has allowed on it, held to the benefit still available
        under the policy, less the deductible withheld. The money the insurer has allowed is the figure standing on the
        decision the insurer has allowed and that awaits payment. The benefit still available is the benefit limit that
        applies to the head decided, less the benefit the policy has consumed in its term, and never less than nothing.
        The benefit limit that applies is the declared trip cost standing on the certificate, and the benefit the policy
        has consumed is the figure the policy record shows consumed. The deductible withheld is the plan's general
        deductible for each claim. The payment is rounded to two decimal places once, at the
        end, and no intermediate figure is rounded.
      params: [deductible_per_claim_usd]
    inputs:
      history:
        - {table: care_claims, aggregate: sum, field: paid_amount_usd, within_months: null, filters: {event_type: care_claim_payout}}
        - {table: care_claims, aggregate: sum, field: deductible_applied_usd, within_months: null, filters: {event_type: care_claim_payout}}
        - {table: care_claims, aggregate: latest, field: paid_amount_usd, within_months: null, filters: {event_type: care_claim_decision}}
        - {category: air, table: air_booking_events, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: air_refund_payout, reason_code: airline_cancellation}}
      cross_category: [air]

  - id: care_ext_declared_cost_correction
    base_policy_refs: [care_policy_amendment, care_club_and_bundle_interaction]
    overwrite:
      - base_policy: care_club_and_bundle_interaction
        superseded_clause: >-
          Cover bought alongside an air booking or a vacation package is rated on the same declared trip cost as
          that booking, and the two are corrected together where the booking's price changes.
        replaced_by: >-
          Where the underwriting desk has approved a correction of the trip cost declared on a certificate, the
          declared trip cost is corrected to the prepaid cost of the journey the records show, and never above the
          plan's ceiling on the declared trip cost.
    trigger: state_due
    subject: [care_insured_amend]
    computes: corrected_trip_cost_usd
    target_tool: correct_declared_trip_cost_b35383d2
    params: {}
    rule: >
      Where the underwriting desk has approved a correction of the trip cost declared on a certificate, the
      declared trip cost is corrected to the prepaid cost of the journey the records show, and never above the
      plan's ceiling on the declared trip cost. The prepaid cost of the journey is what the traveller has laid
      out on the holiday the cover was bought alongside, less what has been returned to them and less anything
      settled other than in money, taken in the share of the party the certificate covers, together with what
      has been prepaid for flights bought apart from it. The cost of the holiday is the price the package was
      quoted at. The whole of that cost counts as prepaid except the charges raised for optional components.
      Nothing is taken out for what has been returned. Nothing is taken out for a credit settled against the
      holiday. The whole of that cost is counted for the certificate. Nothing is added for flights bought apart
      from the holiday. The corrected figure is rounded to two decimal places once, at the end, and no
      intermediate figure is rounded.
      Where the holiday's record stands confirmed and its ledger carries a final payment, the cost of the
      holiday is the charges standing on that ledger; where the holiday's record stands confirmed and its
      ledger carries no final payment, the cost of the holiday is the money that record shows paid; and in
      every other case the cost of the holiday is the price the package was quoted at.
      Where the holiday's final payment has been taken and its ledger carries no penalty raised for a
      cancellation, the whole of that cost counts as prepaid; where the holiday's final payment has not been
      taken, only the deposit counts as prepaid; and in every other case the whole of that cost counts as
      prepaid except the charges raised for optional components.
      Where the holiday's ledger carries money paid back to the traveller and its record stands confirmed,
      what has been returned is that money; where its ledger carries a future travel credit issued in place of
      money and no money paid back, what has been returned is the credit issued; and in every other case
      nothing is taken out for what has been returned.
      Where the holiday's ledger carries a future travel credit settled against it and its record shows no
      credit still standing open, what is taken out as settled other than in money is the credit settled;
      where such a credit was settled and credit still stands open on that record, what is taken out is the
      credit settled less the credit still open; and in every other case nothing is taken out for a credit
      settled against the holiday.
      Where the party on the holiday is larger than the travellers named on the certificate and the party is
      made up of adults only, the share of the party the certificate covers is the travellers named over the
      adults in the party; where the party is larger than the travellers named and children travel in it, the
      share is the travellers named over everyone in the party, children counted; and in every other case the
      whole of that cost is counted for the certificate.
      Where an air booking departing on the first date of the journey stands ticketed and the holiday's ledger
      carries no flight component, what has been prepaid for flights bought apart from the holiday is the money
      paid on that booking; where such a booking stands held rather than ticketed and the holiday's ledger
      carries no flight component, it is the fares charged on that booking; and in every other case nothing is
      added for flights bought apart from the holiday.
    prerequisite: []
    cross_category:
      - category: bundle
        as: history
        reads: [status, amount_paid_usd, package_price_usd, credit_balance_usd, party_adults, party_children, bundle_ledger_entries.amount_usd, bundle_ledger_entries.event_type, bundle_ledger_entries.charge_category]
        note: the operator's own record and ledger decide the cost of the holiday, what counts as prepaid, what has been returned, what was settled in credit and the share of the party the certificate covers
      - category: air
        as: history
        reads: [status, amount_paid_usd, air_booking_events.amount_usd, air_booking_events.event_type]
        note: the carrier's record decides what has been prepaid for flights bought apart from the holiday
    compute:
      - pkg_status: "CFIELD('bundle','status')"
      - pkg_paid: "CFIELD('bundle','amount_paid_usd')"
      - pkg_price: "CFIELD('bundle','package_price_usd')"
      - pkg_deposits: "ABS(XSUM('bundle','bundle_ledger_entries','amount_usd', event_type='bundle_deposit_charge'))"
      - pkg_final_payments: "ABS(XSUM('bundle','bundle_ledger_entries','amount_usd', event_type='bundle_final_payment_charge'))"
      - pkg_components: "ABS(XSUM('bundle','bundle_ledger_entries','amount_usd', event_type='bundle_component_charge'))"
      - holiday_cost: "(pkg_deposits + pkg_final_payments + pkg_components if (pkg_status == 'confirmed' and pkg_final_payments > 0) else (pkg_paid if (pkg_status == 'confirmed' and pkg_final_payments == 0) else pkg_price))"
      - pkg_penalties: "ABS(XSUM('bundle','bundle_ledger_entries','amount_usd', event_type='bundle_penalty_charge'))"
      - holiday_prepaid: "(holiday_cost if (pkg_final_payments > 0 and pkg_penalties == 0) else (pkg_deposits if (pkg_final_payments == 0 and pkg_deposits > 0) else MX(holiday_cost - pkg_components, 0)))"
      - pkg_refunds: "ABS(XSUM('bundle','bundle_ledger_entries','amount_usd', event_type='bundle_refund_payout'))"
      - pkg_credit_issued: "ABS(XSUM('bundle','bundle_ledger_entries','amount_usd', event_type='bundle_credit_issue'))"
      - holiday_returned: "(pkg_refunds if (pkg_refunds > 0 and pkg_status == 'confirmed') else (pkg_credit_issued if (pkg_credit_issued > 0 and pkg_refunds == 0) else 0.0))"
      - pkg_credit_redeemed: "ABS(XSUM('bundle','bundle_ledger_entries','amount_usd', event_type='bundle_credit_redeem'))"
      - pkg_credit_open: "CFIELD('bundle','credit_balance_usd')"
      - holiday_settled_in_credit: "(pkg_credit_redeemed if (pkg_credit_redeemed > 0 and pkg_credit_open == 0) else (MX(pkg_credit_redeemed - pkg_credit_open, 0) if (pkg_credit_redeemed > 0 and pkg_credit_open > 0) else 0.0))"
      - party_adults: "CFIELD('bundle','party_adults')"
      - party_children: "CFIELD('bundle','party_children')"
      - insured_share: "(F('insured_count') / party_adults if (party_adults > F('insured_count') and party_children == 0) else (F('insured_count') / (party_adults + party_children) if (party_adults > F('insured_count') and party_children > 0) else 1.0))"
      - air_status: "CFIELD('air','status', departure_date=F('trip_start_date'))"
      - air_paid: "CFIELD('air','amount_paid_usd', departure_date=F('trip_start_date'))"
      - air_fares: "ABS(XSUM('air','air_booking_events','amount_usd', event_type='air_fare_charge'))"
      - pkg_flight_components: "ABS(XSUM('bundle','bundle_ledger_entries','amount_usd', event_type='bundle_component_charge', charge_category='flight_component'))"
      - flights_apart: "(air_paid if (air_status == 'ticketed' and pkg_flight_components == 0) else (air_fares if (air_status == 'held' and pkg_flight_components == 0) else 0.0))"
      - journey_prepaid: "MX(holiday_prepaid - holiday_returned - holiday_settled_in_credit, 0) * insured_share + flights_apart"
      - result: "RND(MN(journey_prepaid, P('max_trip_cost_usd')), 2)"
    compute_basis:
      pkg_status: "Where the holiday's record stands confirmed and its ledger carries a final payment, the cost of the holiday is the charges standing on that ledger"
      pkg_paid: "where the holiday's record stands confirmed and its ledger carries no final payment, the cost of the holiday is the money that record shows paid"
      pkg_price: "The cost of the holiday is the price the package was quoted at."
      pkg_deposits: "where the holiday's final payment has not been taken, only the deposit counts as prepaid"
      pkg_final_payments: "Where the holiday's record stands confirmed and its ledger carries a final payment, the cost of the holiday is the charges standing on that ledger"
      pkg_components: "The whole of that cost counts as prepaid except the charges raised for optional components."
      holiday_cost: "Where the holiday's record stands confirmed and its ledger carries a final payment, the cost of the holiday is the charges standing on that ledger; where the holiday's record stands confirmed and its ledger carries no final payment, the cost of the holiday is the money that record shows paid; and in every other case the cost of the holiday is the price the package was quoted at."
      pkg_penalties: "Where the holiday's final payment has been taken and its ledger carries no penalty raised for a cancellation, the whole of that cost counts as prepaid"
      holiday_prepaid: "Where the holiday's final payment has been taken and its ledger carries no penalty raised for a cancellation, the whole of that cost counts as prepaid; where the holiday's final payment has not been taken, only the deposit counts as prepaid; and in every other case the whole of that cost counts as prepaid except the charges raised for optional components."
      pkg_refunds: "Where the holiday's ledger carries money paid back to the traveller and its record stands confirmed, what has been returned is that money"
      pkg_credit_issued: "where its ledger carries a future travel credit issued in place of money and no money paid back, what has been returned is the credit issued"
      holiday_returned: "Where the holiday's ledger carries money paid back to the traveller and its record stands confirmed, what has been returned is that money; where its ledger carries a future travel credit issued in place of money and no money paid back, what has been returned is the credit issued; and in every other case nothing is taken out for what has been returned."
      pkg_credit_redeemed: "Where the holiday's ledger carries a future travel credit settled against it and its record shows no credit still standing open, what is taken out as settled other than in money is the credit settled"
      pkg_credit_open: "where such a credit was settled and credit still stands open on that record, what is taken out is the credit settled less the credit still open"
      holiday_settled_in_credit: "Where the holiday's ledger carries a future travel credit settled against it and its record shows no credit still standing open, what is taken out as settled other than in money is the credit settled; where such a credit was settled and credit still stands open on that record, what is taken out is the credit settled less the credit still open; and in every other case nothing is taken out for a credit settled against the holiday."
      party_adults: "Where the party on the holiday is larger than the travellers named on the certificate and the party is made up of adults only, the share of the party the certificate covers is the travellers named over the adults in the party"
      party_children: "where the party is larger than the travellers named and children travel in it, the share is the travellers named over everyone in the party, children counted"
      insured_share: "Where the party on the holiday is larger than the travellers named on the certificate and the party is made up of adults only, the share of the party the certificate covers is the travellers named over the adults in the party; where the party is larger than the travellers named and children travel in it, the share is the travellers named over everyone in the party, children counted; and in every other case the whole of that cost is counted for the certificate."
      air_status: "Where an air booking departing on the first date of the journey stands ticketed and the holiday's ledger carries no flight component, what has been prepaid for flights bought apart from the holiday is the money paid on that booking"
      air_paid: "what has been prepaid for flights bought apart from the holiday is the money paid on that booking"
      air_fares: "where such a booking stands held rather than ticketed and the holiday's ledger carries no flight component, it is the fares charged on that booking"
      pkg_flight_components: "Where an air booking departing on the first date of the journey stands ticketed and the holiday's ledger carries no flight component, what has been prepaid for flights bought apart from the holiday is the money paid on that booking"
      flights_apart: "Where an air booking departing on the first date of the journey stands ticketed and the holiday's ledger carries no flight component, what has been prepaid for flights bought apart from the holiday is the money paid on that booking; where such a booking stands held rather than ticketed and the holiday's ledger carries no flight component, it is the fares charged on that booking; and in every other case nothing is added for flights bought apart from the holiday."
      journey_prepaid: "The prepaid cost of the journey is what the traveller has laid out on the holiday the cover was bought alongside, less what has been returned to them and less anything settled other than in money, taken in the share of the party the certificate covers, together with what has been prepaid for flights bought apart from it."
      result: "the declared trip cost is corrected to the prepaid cost of the journey the records show, and never above the plan's ceiling on the declared trip cost"
    factors:
      - id: holiday_cost_basis
        effect: method
        decides: holiday_cost
        bindings: [pkg_status, pkg_paid, pkg_price, pkg_deposits, pkg_final_payments, pkg_components, holiday_cost]
        ladder:
          - when: "the holiday's record stands confirmed and its ledger carries a final payment"
            method: "the cost of the holiday is the charges standing on that ledger"
          - when: "the holiday's record stands confirmed and its ledger carries no final payment"
