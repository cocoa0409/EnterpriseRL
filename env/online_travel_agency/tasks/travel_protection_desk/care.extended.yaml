events:
- type: care_quote
  target: care_policies
  mutation: create
  meaning: A traveller asks for cover and a rated quotation is produced against a declared trip.
  grain: One row per protection policy quoted, whatever the number of insured travellers on it.
  fields:
    care_policy_id: reference of the new policy
    customer_id: policyholder
    variant_name: plan quoted
    status: the policy opens as a quotation
    certificate_number: certificate number reserved for the quotation
    insured_count: travellers to be named
    lead_insured_age: age of the oldest insured traveller
    trip_cost_usd: prepaid non-refundable trip cost declared
    destination_region: region declared for the trip
    trip_start_date: first date of the journey
    trip_end_date: last date of the journey
    quoted_date: date of the quotation
    linked_air_booking_id: air booking the cover was quoted alongside, empty when quoted on its own
    linked_bundle_package_id: vacation package the cover was quoted alongside, empty when quoted on its own
  triggers: []
- type: care_issue
  target: care_policies
  mutation:
    transition:
      from: quoted
      to: issued
  meaning: The premium is paid and the certificate of insurance is issued.
  grain: One row per policy, at the moment its certificate is issued.
  fields:
    care_policy_id: policy being issued
    status: the policy becomes issued
    issued_date: date of issue
    issued_at: moment of issue
    pre_existing_waiver_granted: whether the pre-existing condition waiver was granted at issue
  triggers:
  - event: care:care_premium_charge
    map:
      care_policy_id: care_policy_id
      charge_category: base_premium
      reason_code: routine_issue
  - event: club:club_points_accrual
    map:
      customer_id: customer_id
      accrual_source: care_policy
- type: care_incept
  target: care_policies
  mutation:
    transition:
      from: issued
      to: in_force
  meaning: Cover begins because the insured journey has started.
  grain: One row per policy, at the moment cover incepts.
  fields:
    care_policy_id: policy incepting
    status: the policy comes into force
  triggers: []
- type: care_expire
  target: care_policies
  mutation:
    transition:
      from: in_force
      to: expired
  meaning: Cover ends because the insured journey has finished.
  grain: One row per policy, at the moment cover expires.
  fields:
    care_policy_id: policy expiring
    status: the policy expires
  triggers: []
- type: care_cancel
  target: care_policies
  mutation:
    transition:
      from: issued
      to: cancelled
  meaning: The policyholder cancels their own policy inside the free-look period.
  grain: One row per policy, at the moment the policyholder confirms the free-look cancellation.
  fields:
    care_policy_id: policy being cancelled
    status: the policy becomes cancelled
    cancelled_at: moment the policyholder confirmed
  triggers:
  - event: care:care_premium_refund
    map:
      care_policy_id: care_policy_id
      charge_category: premium_refund
      reason_code: free_look_cancellation
- type: care_midterm_cancel
  target: care_policies
  mutation:
    transition:
      from: in_force
      to: cancelled
  meaning: The policyholder cancels their own policy after cover has begun.
  grain: One row per policy, at the moment the policyholder confirms the mid-term cancellation.
  fields:
    care_policy_id: policy being cancelled
    status: the policy becomes cancelled
    cancelled_at: moment the policyholder confirmed
  triggers:
  - event: care:care_premium_refund
    map:
      care_policy_id: care_policy_id
      charge_category: premium_refund
      reason_code: mid_term_cancellation
- type: care_insured_amend
  target: care_policies
  mutation: update
  meaning: The declared trip cost, the destination or the travelling party on a certificate is corrected.
  grain: One row per policy, each time its declared particulars are corrected.
  fields:
    care_policy_id: policy being corrected
    trip_cost_usd: corrected declared trip cost
    destination_region: corrected destination region
    insured_count: corrected number of insured travellers
    trip_start_date: corrected first date of the journey
    trip_end_date: corrected last date of the journey
  triggers:
  - event: care:care_premium_adjustment
    map:
      care_policy_id: care_policy_id
      charge_category: premium_adjustment
      reason_code: rating_correction
- type: care_premium_charge
  target: care_premium_entries
  meaning: A premium component is charged to the policyholder.
  grain: One row per rating component charged, for one insured traveller or for the policy as a whole.
  distinguish_by:
  - charge_category
  - insured_sequence
  - posted_at
  fields:
    care_premium_entry_id: reference of the premium line
    care_policy_id: policy charged
    customer_id: policyholder charged
    event_type: family of the line
    charge_category: which rating component the line is
    amount_usd: positive amount charged
    currency_charged: currency presented to the policyholder
    posted_date: date the line posted
    posted_at: moment the line posted
    insured_sequence: insured traveller the line belongs to
    payment_channel: channel the premium was taken through
    reason_code: business reason the line was raised
  account: premium_paid
  direction: in
  triggers: []
- type: care_premium_adjustment
  target: care_premium_entries
  meaning: The premium is re-rated because a declared particular of the risk has changed.
  grain: One row per re-rating raised against one earlier premium line.
  distinguish_by:
  - charge_category
  - source_entry_id
  - posted_at
  fields:
    care_premium_entry_id: reference of the adjustment line
    care_policy_id: policy re-rated
    customer_id: policyholder charged
    event_type: family of the line
    charge_category: the line adjusts an earlier premium
    amount_usd: positive amount charged by the adjustment
    posted_date: date the adjustment posted
    posted_at: moment the adjustment posted
    insured_sequence: insured traveller the adjustment belongs to
    source_entry_id: the premium line being adjusted
    reason_code: business reason for the adjustment
  account: premium_paid
  direction: in
  triggers: []
- type: care_premium_refund
  target: care_premium_entries
  meaning: Premium is returned to the policyholder because cover has been given up.
  grain: One row per return raised against one earlier premium line.
  distinguish_by:
  - charge_category
  - source_entry_id
  - posted_at
  fields:
    care_premium_entry_id: reference of the refund line
    care_policy_id: policy refunded
    customer_id: policyholder refunded
    event_type: family of the line
    charge_category: the line returns premium
    amount_usd: negative amount returned
    currency_charged: currency the premium was returned in
    posted_date: date the refund posted
    posted_at: moment the refund posted
    insured_sequence: insured traveller the refund belongs to
    source_entry_id: the premium line being returned
    reason_code: business reason for the return
  account: premium_paid
  direction: out
  triggers: []
- type: care_claim_file
  target: care_claims
  meaning: The traveller files a claim against one benefit of the policy.
  grain: One row per claim filed by one insured traveller against one benefit for one incident.
  distinguish_by:
  - claim_reference
  - claim_type
  - insured_sequence
  - incident_date
  fields:
    care_claim_id: reference of the claim record
    care_policy_id: policy the claim is made under
    customer_id: policyholder claiming
    event_type: family of the row
    claim_reference: reference the insurer quoted for the claim
    claim_type: benefit claimed against
    claimed_amount_usd: amount claimed before limits and deductibles
    incident_date: date of the incident
    filed_date: date the claim was filed
    posted_at: moment the claim was filed
    claim_status: the claim opens as filed
    insured_sequence: insured traveller claiming
    loss_location_country: country the incident occurred in
    supporting_document_reference: reference of the evidence supplied
    reason_code: business reason the claim was raised
  triggers: []
- type: care_claim_decision
  target: care_claims
  meaning: The insurer decides a filed claim.
  grain: One row per decision on one filed claim.
  distinguish_by:
  - source_claim_id
  - claim_status
  - posted_at
  fields:
    care_claim_id: reference of the decision record
    care_policy_id: policy the claim is made under
    customer_id: policyholder claiming
    event_type: family of the row
    claim_reference: reference the insurer quoted for the claim
    claim_type: benefit claimed against
    claimed_amount_usd: amount claimed before limits and deductibles
    paid_amount_usd: amount the insurer has allowed
    deductible_applied_usd: deductible withheld from the allowance
    decided_date: date of the decision
    posted_at: moment of the decision
    claim_status: the decision reached
    insured_sequence: insured traveller claiming
    source_claim_id: the filed claim being decided
    reason_code: business reason for the decision
  triggers:
  - event: care:care_claim_payout
    when:
      claim_status:
      - approved
      - partly_approved
    map:
      care_policy_id: care_policy_id
      claim_type: claim_type
      reason_code: insurer_decision
- type: care_claim_payout
  target: care_claims
  meaning: The allowed amount of a decided claim is paid to the traveller.
  grain: One row per payment made against one decided claim.
  distinguish_by:
  - source_claim_id
  - insured_sequence
  - posted_at
  fields:
    care_claim_id: reference of the payment record
    care_policy_id: policy the payment is made under
    customer_id: policyholder paid
    event_type: family of the row
    claim_reference: reference the insurer quoted for the claim
    claim_type: benefit paid against
    paid_amount_usd: amount actually paid
    deductible_applied_usd: deductible withheld from the payment
    decided_date: date the payment was authorised
    posted_at: moment the payment posted
    claim_status: the claim becomes paid
    insured_sequence: insured traveller paid
    source_claim_id: the decision the payment settles
    reason_code: business reason for the payment
  account: benefit_used
  direction: in
  triggers: []
- type: care_claim_recovery
  target: care_claims
  meaning: Part of a settled claim is recovered from a liable third party and the benefit is restored.
  grain: One row per recovery received against one settled claim.
  distinguish_by:
  - source_claim_id
  - claim_reference
  - posted_at
  fields:
    care_claim_id: reference of the recovery record
    care_policy_id: policy the recovery belongs to
    customer_id: policyholder the recovery belongs to
    event_type: family of the row
    claim_reference: reference the insurer quoted for the claim
    claim_type: benefit the recovery restores
    paid_amount_usd: negative amount restored to the benefit
    decided_date: date the recovery was received
    posted_at: moment the recovery posted
    claim_status: the claim becomes recovered
    insured_sequence: insured traveller the recovery belongs to
    source_claim_id: the payment the recovery reverses in part
    reason_code: business reason for the recovery
  account: benefit_used
  direction: out
  triggers: []
measures:
- id: care_msr_paid_benefit_policy_term
  window: the whole policy term, from the issue date to the expiry or cancellation date
  measure: sum of paid_amount_usd over care_claim_payout and care_claim_recovery rows on the same policy, grouped by claim_type
- id: care_msr_claims_filed_policy_term
  window: the whole policy term, from the issue date to the expiry or cancellation date
  measure: count of care_claim_file rows on the same policy
policies:
- id: care_agg_multi_holding
  subject:
  - care_quote
  rule: 'A traveller may hold more than one protection policy at a time, most often an annual multi-trip plan alongside a single-trip plan bought for an expensive journey. Two policies never pay the same
    loss twice: where both cover one incident the policy with the earlier issue date pays first and the later policy pays only the balance the first did not reach. Two single-trip policies covering the
    same journey are never both issued; the second is declined at quotation and the traveller is offered an upgrade of the first instead. A policy covers the travellers named on its certificate and nobody
    else, and a traveller named on two certificates is still one insured person for the purpose of any per-traveller limit.'
  eligibility: []
  params:
    max_per_customer: null
    same_journey_duplicate: decline_second
- id: care_agg_benefit_coordination
  subject:
  - care_claim_payout
  rule: 'Where a traveller holds more than one policy that answers the same incident, the benefit is coordinated rather than duplicated: the primary policy pays to its own limit and the secondary policy
    pays only what remains unpaid, up to its own limit. The primary policy is the one issued first; where both were issued on the same day the one with the larger declared trip cost is primary. Benefit
    already consumed on a policy in this term is counted against that policy''s limit whatever the claim type, and each claim type is additionally held to its own limit. A deductible is withheld once per
    claim under the primary policy and is not withheld again under the secondary. Where the total paid across both policies would exceed the traveller''s actual loss, the payment is reduced so that it does
    not, because protection indemnifies a loss and does not profit from it. A recovery from a liable third party is applied first to the policy that paid last, restoring its benefit before the primary''s.'
  eligibility: []
  params:
    primary_rule: earliest_issue_date
    tie_break: largest_declared_trip_cost
  measures:
  - care_msr_paid_benefit_policy_term
- id: care_underwriting
  subject:
  - care_quote
  - care_issue
  rule: A plan may only be quoted where the declared trip cost is at or below the plan's ceiling, where the oldest insured traveller falls within the plan's age range, and where the journey is no longer
    than the plan's maximum length. A multi-trip plan is quoted on its flat annual premium rather than on the trip cost, and covers its stated number of journeys in the policy year, each no longer than
    the plan's maximum length. A quotation stands for the working day it was produced and is re-rated afterwards, because the rating depends on the distance to departure. The pre-existing medical condition
    waiver is granted only on a plan that offers it and only where the policy is bought within the plan's waiver window counted from the first payment toward the trip; a waiver claimed outside that window
    is refused at issue rather than argued at claim. Children under the plan's free age travelling with an insured adult are covered at no additional premium and are still counted as insured travellers
    for every per-traveller limit. A traveller already on a journey may not buy cover for it; cover is never issued with retrospective effect.
