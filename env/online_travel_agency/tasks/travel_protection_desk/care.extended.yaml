        min_premium_usd: =min_premium_usd
        policy_fee_usd: =policy_fee_usd
        age_loading_ladder_pct: =age_loading_ladder_pct
        destination_loading_pct: =destination_loading_pct
        cfar_included: =cfar_included
      Cancel For Any Reason Elite:
        premium_base_rate_pct: =premium_base_rate_pct
        annual_premium_usd: =annual_premium_usd
        min_premium_usd: =min_premium_usd
        policy_fee_usd: =policy_fee_usd
        age_loading_ladder_pct: =age_loading_ladder_pct
