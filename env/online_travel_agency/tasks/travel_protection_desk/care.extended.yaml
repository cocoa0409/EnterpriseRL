- id: care_subrogation
  subject:
  - care_claim_recovery
  rule: 'Where a third party was liable for the loss the insurer may recover what it paid, and the amount recovered restores the benefit it was taken from. A recovery is applied against the payment it reverses
    and never against a different claim or a different policy. The traveller keeps whatever the recovery exceeds, because the insurer recovers only what it actually paid. A traveller who has been compensated
    for the same loss by the airline, the property or another supplier must say so, and the settlement is reduced by what they received rather than recovered afterwards. A plan on which subrogation does
    not apply makes no recovery at all and the settlement stands as paid. A recovery never reopens a decided claim: the decision stands and only the benefit consumed is restored.'
  eligibility: []
  params:
    per_tier:
      Trip Basics Essential:
        subrogation_applies: =subrogation_applies
