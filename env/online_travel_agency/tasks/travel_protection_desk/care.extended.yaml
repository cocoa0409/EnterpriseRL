  - id: care_ext_premium_rerating
    base_policy_refs: [care_premium_rating]
    overwrite: []
    trigger: state_due
    subject: [care_premium_adjustment]
    computes: rerating_amount_usd
    target_tool: raise_premium_rerating_6e8395e4
    params: {}
    rule: >
      Where a declared particular of the risk has changed after issue, the premium is re-rated and the
      difference between the premium the certificate now rates to and the premium the record shows collected is
      charged over the days of cover still to run. The premium the certificate now rates to is the declared trip
      cost standing on it at the rate applied, rounded to two decimal places at that step. The rate applied is
      the plan's base rate together with the plan's destination loading percentage. The premium the record shows
      collected is the figure the policy record shows paid. The difference is never less than nothing. The
      difference is then taken in the proportion the days of cover still to run bear to the days of cover
      bought, and never charged in full where cover has already begun to run. The days of cover still to run are
      counted from the day the change takes effect to the last date of the journey, both counted. The day the
      change takes effect is the day the certificate was issued. The days of cover bought are the days of the
      journey, its first and last both counted. The charge is rounded to two decimal places once, at the end,
      and no intermediate figure is rounded.
      The re-rating owed on a correction is worked out only after the certificate carries the declared
      particulars the underwriting desk has approved for it.
      A re-rating is raised against the line that carries the base premium of the certificate, because that is
      the line the whole premium was rated from, and where the premium record carries no such line it is raised
      against the earliest line charged on the policy; a loading line, the line charged for the issue fee and a
      line raised to correct another line are never the line a re-rating is raised against.
      Where the premium record carries an age loading line and a destination loading line, the rate applied is
      the one the premium collected bears to the trip cost the base premium line was rated on; where the premium
      record carries a base premium line and no age loading line, the rate applied is the plan's base rate
      alone; and in every other case the rate applied is the plan's base rate together with the plan's
      destination loading percentage.
      Where the premium record carries a line returned on the policy and a base premium line, the premium the
      record shows collected is the lines charged and the re-ratings raised less the lines returned, the policy
      fee excepted; where the premium record carries a base premium line and no line returned, it is the lines
      charged and the re-ratings raised, the policy fee excepted; and in every other case the premium the record
      shows collected is the figure the policy record shows paid.
      Where the underwriting desk has recorded an approved request against the policy and the journey has not
      begun, the day the change takes effect is the day the desk approved it; where such a request stands and
      the journey has begun, it is the day the request was submitted; and in every other case the day the change
      takes effect is the day the certificate was issued.
      Where the certificate was issued before the first date of the journey, the days of cover bought are
      counted from the day the certificate was issued to the last date of the journey, both counted; where the
      certificate was issued on or after the first date of the journey and the journey has not ended, they are
      counted from the day the certificate was issued to the last date of the journey, the last date counted;
      and in every other case the days of cover bought are the days of the journey, its first and last both
      counted.
    prerequisite:
      - problem: care_ext_declared_cost_correction
        kind: value_input
        gate: rated_premium
        form: state
        policy_source: >-
          The re-rating owed on a correction is worked out only after the certificate carries the declared
          particulars the underwriting desk has approved for it.
        condition: >-
          The declared trip cost standing on the certificate is the figure the underwriting desk approved for
          it, so that the premium the certificate now rates to is worked out on the corrected declared trip cost.
        resolved_by: correct_declared_trip_cost_b35383d2
        effect: >-
          Once the certificate carries the corrected declared trip cost, the premium the certificate now rates to
          is worked out on that figure instead of the one declared at quotation, and the difference charged rises
          with it.
    cross_category: []
    compute:
      - base_premium_collected: "SUM('care_premium_entries','amount_usd', charge_category='base_premium')"
      - base_premium_lines: "COUNT('care_premium_entries', charge_category='base_premium')"
      - age_loading_lines: "COUNT('care_premium_entries', charge_category='age_loading')"
      - destination_loading_lines: "COUNT('care_premium_entries', charge_category='destination_loading')"
      - premium_charged: "SUM('care_premium_entries','amount_usd', event_type='care_premium_charge')"
      - premium_readjusted: "SUM('care_premium_entries','amount_usd', event_type='care_premium_adjustment')"
      - premium_returned: "SUM('care_premium_entries','amount_usd', event_type='care_premium_refund')"
      - policy_fee_collected: "SUM('care_premium_entries','amount_usd', charge_category='policy_fee')"
      - returned_lines: "COUNT('care_premium_entries', event_type='care_premium_refund')"
      - collected_premium: "(premium_charged + premium_readjusted + premium_returned - policy_fee_collected if (returned_lines > 0 and base_premium_lines > 0) else (premium_charged + premium_readjusted - policy_fee_collected if (base_premium_lines > 0 and returned_lines == 0) else F('premium_paid_usd')))"
      - original_trip_cost: "base_premium_collected / (P('premium_base_rate_pct') / 100)"
      - rate_applied: "(collected_premium / original_trip_cost if (age_loading_lines > 0 and destination_loading_lines > 0) else (P('premium_base_rate_pct') / 100 if (base_premium_lines > 0 and age_loading_lines == 0) else P('premium_base_rate_pct') / 100 * (1 + P('destination_loading_pct') / 100)))"
      - rated_premium: "RND(F('trip_cost_usd') * rate_applied, 2)"
      - premium_difference: "MX(rated_premium - collected_premium, 0)"
      - approval_decided_on: "LATEST('care_policy_requests','decided_at', date_field='submitted_at', request_status='approved')"
      - approval_submitted_on: "LATEST('care_policy_requests','submitted_at', date_field='submitted_at', request_status='approved')"
      - days_since_departure: "DAYS(F('trip_start_date'), NOW)"
