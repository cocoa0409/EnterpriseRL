  subject:
  - bundle_party_amend
  computes: revised_package_price_usd
  target_tool: confirm_places_given_up_9aa48f75
  params:
    part_paid_share_pct: 50
    review_pending_share_pct: 50
    repricing_allowance_pct: 2
  rule: 'The price a package carries is re-worked when places on it are given up. The price the package carries for the party
    actually travelling is fixed only after the ledger carries an amendment charge posted since the operations desk approved
    the change to the travelling party. The per-place price is the quoted package price divided by the adults and the children
    shown on the package record, counted together. Where the ledger carries component lines against the package and the package
    record shows children travelling, the per-place price is instead the quoted package price together with the signed total
    of those component lines, divided by the adults and the children counted together; where the ledger carries component
    lines against the package and the package record shows no children travelling, the per-place price is the quoted package
    price together with the signed total of those component lines, divided by the adults shown on the record. The places given
    up are taken as one, and the places retained are the adults and the children shown on the package record, counted together,
    less the places given up. The places price is the per-place price multiplied by the places retained. The occupancy adjustment
    carried into the revised price is nil. Where the rooms or cabins shown on the package record, each counted as holding
    two travellers, leave a traveller occupying one alone once the places given up are taken away and the departure date has
    not yet passed, the occupancy adjustment is the per-place price taken at the product''s single supplement share; where
    the rooms or cabins shown on the package record, each counted as holding two travellers, leave no traveller occupying
    one alone once the places given up are taken away and the departure date has not yet passed, the occupancy adjustment
    is nil. The occupancy adjustment is charged on the room or cabin left under-occupied, whatever discounts the travellers
    remaining in it carry. The charges already withheld against the package are not carried into the revised price. Where
    the package ledger carries an amendment or penalty charge and the package record stands at confirmed, the charges already
    withheld are carried into the revised price in full; where the package ledger carries an amendment or penalty charge and
    the package record stands at deposit held, the charges already withheld are carried into the revised price at the part-paid
    share published for this calculation. The club rate applied to the priced places is the whole of them and nothing more.
    Where the traveller holds a club membership standing active whose tier carries a package discount and whose next tier
    review falls after the departure date, the club rate is the whole of them less the package discount percentage that tier
    carries; where the traveller holds a club membership standing active whose tier carries a package discount and whose next
    tier review falls on or before the departure date, the club rate is the whole of them less that percentage taken at the
    review-pending share published for this calculation. The re-pricing rate applied to the priced places is the whole of
    them and nothing more. Where the product''s price-guarantee term has run out counted in whole calendar days from the day
    after the deposit was taken and an operator notice stands against the package, the re-pricing rate is the whole of them
    increased by the re-pricing allowance published for this calculation; where the product''s price-guarantee term has not
    yet run out counted the same way and an operator notice stands against the package, the re-pricing rate is the whole of
    them and nothing more. The revised price is worked out in one order: the places price and the occupancy adjustment are
    first added together, that sum is then reduced by the club rate, the result of that step is then taken at the re-pricing
    rate, and the charges carried in are added last; the figure is rounded to two decimal places only at the end and is never
    less than nil.'
  prerequisite:
  - problem: bundle_ext_party_amendment_charge
    kind: value_input
    gate: withheld_charges
    form: state
    policy_source: The price the package carries for the party actually travelling is fixed only after the ledger carries
      an amendment charge posted since the operations desk approved the change to the travelling party.
    condition: The package ledger carries an amendment charge posted since the operations desk approved the change to the
      travelling party.
    resolved_by: withhold_amendment_charge_5474525c
    effect: The signed total of the amendment and penalty lines standing on the package ledger rises by the amendment charge,
      so the charges carried into the revised price change.
  cross_category:
  - category: club
    as: branch
    reads:
    - status
    - variant_name
    - tier_review_date
    note: The club tier held and the date its next review falls decide the club rate applied to the priced places.
  compute:
  - heads_before: F('party_adults') + F('party_children')
  - component_total: SUM('bundle_ledger_entries','amount_usd', date_field='posted_date', event_type='bundle_component_charge')
  - component_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_component_charge')
  - per_place_price: ((F('package_price_usd') + component_total) / heads_before if component_lines > 0 and F('party_children')
      > 0 else ((F('package_price_usd') + component_total) / F('party_adults') if component_lines > 0 and F('party_children')
      == 0 else F('package_price_usd') / heads_before))
  - places_retained: heads_before - 1
  - places_price: per_place_price * places_retained
  - days_to_departure: DAYS(NOW, F('departure_date'))
  - occupancy_adjustment: (per_place_price * P('single_supplement_pct') / 100 if 2 * F('rooms_or_cabins') - (heads_before
      - 1) > 0 and days_to_departure > 0 else (0.0 if 2 * F('rooms_or_cabins') - (heads_before - 1) <= 0 and days_to_departure
      > 0 else 0.0))
  - withheld_charges: SUM('bundle_ledger_entries','amount_usd', date_field='posted_date', event_type='bundle_penalty_charge')
  - carried_charges: (withheld_charges if withheld_charges > 0 and F('status') == 'confirmed' else (withheld_charges * K('part_paid_share_pct')
      / 100 if withheld_charges > 0 and F('status') == 'deposit_held' else 0.0))
  - club_package_pct: CPARAM('club','package_discount_pct', status='active')
  - review_lead_days: DAYS(F('departure_date'), CFIELD('club','tier_review_date', status='active') or F('departure_date'))
  - club_rate: ((100 - club_package_pct) / 100 if club_package_pct != None and club_package_pct > 0 and review_lead_days >
      0 else ((100 - club_package_pct * K('review_pending_share_pct') / 100) / 100 if club_package_pct != None and club_package_pct
      > 0 and review_lead_days <= 0 else 1.0))
  - days_since_deposit: DAYS(F('deposit_taken_at'), NOW)
  - notice_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_supplier_notice')
  - repricing_rate: ((100 + K('repricing_allowance_pct')) / 100 if days_since_deposit > P('price_guarantee_days') and notice_lines
      > 0 else (1.0 if days_since_deposit <= P('price_guarantee_days') and notice_lines > 0 else 1.0))
  - result: RND(MX(((places_price + occupancy_adjustment) * club_rate) * repricing_rate + carried_charges, 0.0), 2)
  compute_basis:
    component_total: Where the ledger carries component lines against the package and the package record shows children travelling,
      the per-place price is instead the quoted package price together with the signed total of those component lines, divided
      by the adults and the children counted together
    component_lines: where the ledger carries component lines against the package and the package record shows no children
      travelling, the per-place price is the quoted package price together with the signed total of those component lines,
      divided by the adults shown on the record.
    per_place_price: The per-place price is the quoted package price divided by the adults and the children shown on the package
      record, counted together. Where the ledger carries component lines against the package and the package record shows
      children travelling, the per-place price is instead the quoted package price together with the signed total of those
      component lines, divided by the adults and the children counted together; where the ledger carries component lines against
      the package and the package record shows no children travelling, the per-place price is the quoted package price together
      with the signed total of those component lines, divided by the adults shown on the record.
    places_retained: The places given up are taken as one, and the places retained are the adults and the children shown on
      the package record, counted together, less the places given up.
    days_to_departure: Where the rooms or cabins shown on the package record, each counted as holding two travellers, leave
      a traveller occupying one alone once the places given up are taken away and the departure date has not yet passed, the
      occupancy adjustment is the per-place price taken at the product's single supplement share
    occupancy_adjustment: The occupancy adjustment carried into the revised price is nil. Where the rooms or cabins shown
      on the package record, each counted as holding two travellers, leave a traveller occupying one alone once the places
      given up are taken away and the departure date has not yet passed, the occupancy adjustment is the per-place price taken
      at the product's single supplement share; where the rooms or cabins shown on the package record, each counted as holding
      two travellers, leave no traveller occupying one alone once the places given up are taken away and the departure date
      has not yet passed, the occupancy adjustment is nil.
    withheld_charges: Where the package ledger carries an amendment or penalty charge and the package record stands at confirmed,
      the charges already withheld are carried into the revised price in full
    carried_charges: The charges already withheld against the package are not carried into the revised price. Where the package
      ledger carries an amendment or penalty charge and the package record stands at confirmed, the charges already withheld
      are carried into the revised price in full; where the package ledger carries an amendment or penalty charge and the
      package record stands at deposit held, the charges already withheld are carried into the revised price at the part-paid
      share published for this calculation.
    club_package_pct: Where the traveller holds a club membership standing active whose tier carries a package discount and
      whose next tier review falls after the departure date, the club rate is the whole of them less the package discount
      percentage that tier carries
    review_lead_days: where the traveller holds a club membership standing active whose tier carries a package discount and
      whose next tier review falls on or before the departure date, the club rate is the whole of them less that percentage
      taken at the review-pending share published for this calculation.
    club_rate: The club rate applied to the priced places is the whole of them and nothing more. Where the traveller holds
      a club membership standing active whose tier carries a package discount and whose next tier review falls after the departure
      date, the club rate is the whole of them less the package discount percentage that tier carries; where the traveller
      holds a club membership standing active whose tier carries a package discount and whose next tier review falls on or
      before the departure date, the club rate is the whole of them less that percentage taken at the review-pending share
      published for this calculation.
    days_since_deposit: Where the product's price-guarantee term has run out counted in whole calendar days from the day after
      the deposit was taken and an operator notice stands against the package, the re-pricing rate is the whole of them increased
      by the re-pricing allowance published for this calculation
    notice_lines: where the product's price-guarantee term has not yet run out counted the same way and an operator notice
      stands against the package, the re-pricing rate is the whole of them and nothing more.
    repricing_rate: The re-pricing rate applied to the priced places is the whole of them and nothing more. Where the product's
      price-guarantee term has run out counted in whole calendar days from the day after the deposit was taken and an operator
      notice stands against the package, the re-pricing rate is the whole of them increased by the re-pricing allowance published
      for this calculation; where the product's price-guarantee term has not yet run out counted the same way and an operator
      notice stands against the package, the re-pricing rate is the whole of them and nothing more.
    result: 'The revised price is worked out in one order: the places price and the occupancy adjustment are first added together,
      that sum is then reduced by the club rate, the result of that step is then taken at the re-pricing rate, and the charges
      carried in are added last; the figure is rounded to two decimal places only at the end and is never less than nil.'
  factors:
  - id: per_place_price_basis
    effect: method
    decides: per_place_price
    bindings:
    - component_total
    - component_lines
    - per_place_price
    ladder:
    - when: the ledger carries component lines against the package and the package record shows children travelling
      method: the quoted package price is taken together with the signed total of those component lines and divided by the
        adults and the children counted together
    - when: the ledger carries component lines against the package and the package record shows no children travelling
      method: the quoted package price is taken together with the signed total of those component lines and divided by the
        adults shown on the record
    - when: otherwise
      method: the quoted package price is divided by the adults and the children shown on the package record, counted together
    baseline:
      per_place_price: F('package_price_usd') / heads_before
    evidence:
    - history
    cross_difficulty: null
  - id: single_occupancy_adjustment
    effect: parameter
    decides: occupancy_adjustment
    bindings:
    - days_to_departure
    - occupancy_adjustment
    ladder:
    - when: the rooms or cabins shown on the package record, each counted as holding two travellers, leave a traveller occupying
        one alone once the places given up are taken away and the departure date has not yet passed
      value: the per-place price taken at the product's single supplement share
    - when: the rooms or cabins shown on the package record, each counted as holding two travellers, leave no traveller occupying
        one alone once the places given up are taken away and the departure date has not yet passed
      value: nil
    - when: otherwise
      value: nil
    baseline:
      occupancy_adjustment: '0.0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: withheld_charge_carry
    effect: parameter
    decides: carried_charges
    bindings:
    - withheld_charges
    - carried_charges
    ladder:
    - when: the package ledger carries an amendment or penalty charge and the package record stands at confirmed
      value: the charges already withheld are carried into the revised price in full
    - when: the package ledger carries an amendment or penalty charge and the package record stands at deposit held
      value: the charges already withheld are carried into the revised price at the part-paid share published for this calculation
    - when: otherwise
      value: nothing already withheld is carried into the revised price
    baseline:
      carried_charges: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: club_repricing_rate
    effect: parameter
    decides: club_rate
    bindings:
    - club_package_pct
    - review_lead_days
    - club_rate
    ladder:
    - when: the traveller holds a club membership standing active whose tier carries a package discount and whose next tier
        review falls after the departure date
      value: the whole of them less the package discount percentage that tier carries
    - when: the traveller holds a club membership standing active whose tier carries a package discount and whose next tier
        review falls on or before the departure date
      value: the whole of them less that percentage taken at the review-pending share published for this calculation
    - when: otherwise
      value: the whole of them and nothing more
    baseline:
