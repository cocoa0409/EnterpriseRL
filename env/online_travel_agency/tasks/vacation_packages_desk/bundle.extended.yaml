- type: bundle_deposit_charge
  target: bundle_ledger_entries
  meaning: The deposit for the package is charged to the party.
  grain: One row per deposit charged, for one traveller on one package.
  distinguish_by:
  - charge_category
  - traveller_sequence
  - posted_at
  fields:
    bundle_entry_id: reference of the ledger line
    bundle_package_id: package charged
    customer_id: lead traveller charged
    event_type: family of the line
    charge_category: the line is a deposit
    amount_usd: positive amount taken
    currency_charged: currency presented to the party
