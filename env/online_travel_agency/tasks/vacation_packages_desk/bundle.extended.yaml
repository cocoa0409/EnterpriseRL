- id: bundle_refund_settlement
  subject:
  - bundle_refund_payout
  rule: 'An approved refund settles in the form the product prescribes: money to the card, or a future travel credit voucher, never both and never a mixture. A payout line is raised only while the package
    record stands at cancelled or completed. The settlement takes the product''s processing time, counted in business days from the day the refund was approved, excluding weekends and public holidays in
    the lead traveller''s country of residence. Each payout is raised against the original ledger line it reverses, so a package with a deposit and several instalments settles as several payouts. A payout
    may never exceed the amount that original line actually collected, and the sum of a package''s payouts may never exceed the amount paid on it. Where a supplier within the package fails financially,
    the protected amount is settled under the product''s financial protection whatever its ordinary refund form.'
  eligibility:
  - id: package_settled
    applies_to:
    - bundle_refund_payout
    kind: state
    condition: A payout line is raised only while the package record stands at cancelled or completed.
    evidence_fields:
    - bundle_packages.status
    - bundle_packages.bundle_package_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - bundle_packages.bundle_package_id
      action_bindings:
        bundle_packages.bundle_package_id: bundle_package_id
    state_contract:
      field: bundle_packages.status
      allowed:
      - cancelled
      - completed
  params:
    per_tier:
      Value Bundle Package:
        refund_form: =refund_form
        refund_processing_days: =refund_processing_days
        supplier_failure_protection: =supplier_failure_protection
