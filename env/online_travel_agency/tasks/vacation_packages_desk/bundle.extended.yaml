- id: bundle_ext_party_amendment_charge
  base_policy_refs:
  - bundle_cancellation
  - bundle_amendment
  - bundle_agg_party_pricing
  - bundle_club_and_corporate_interaction
  overwrite:
  - base_policy: bundle_amendment
    superseded_clause: A member of the party may be replaced only up to the product's name-change deadline before departure,
      against the product's name-change charge per traveller replaced.
    replaced_by: A change to the travelling party that the operations desk has approved is charged as an amendment under this
      rule whether a member is replaced or a place is simply given up, and the administration charge per traveller is the
      one this rule fixes and no other.
  - base_policy: bundle_agg_party_pricing
    superseded_clause: the re-pricing is charged as an amendment rather than absorbed
    replaced_by: A change to the travelling party that the operations desk has approved is charged as an amendment under this
      rule whether a member is replaced or a place is simply given up, and the administration charge per traveller is the
      one this rule fixes and no other.
  - base_policy: bundle_cancellation
    superseded_clause: the ladder is applied to those places alone
    replaced_by: Where places are given up under a change to the travelling party that the operations desk has approved, no
      cancellation ladder is read and no cancellation penalty or cancellation administration charge is withheld.
  - base_policy: bundle_cancellation
    superseded_clause: The product's administration charge is withheld per traveller on every cancellation whatever the ladder
      says
    replaced_by: Where places are given up under a change to the travelling party that the operations desk has approved, no
      cancellation ladder is read and no cancellation penalty or cancellation administration charge is withheld.
  trigger: state_due
  subject:
  - bundle_penalty_charge
  computes: amendment_charge_usd
  target_tool: withhold_amendment_charge_5474525c
  params:
    early_change_share_pct: 80
    repeat_amendment_loading_pct: 8
    first_amendment_loading_pct: 4
  rule: The amendment charge withheld for a change to the travelling party is built from the product's administration charge
    and the travellers it is charged for. The administration charge per traveller is the product's amendment administration
    charge. Where an approved name-change request stands against the package and the change falls at or inside the product's
    name-change deadline before departure, the administration charge per traveller is instead the product's name-change charge
    per traveller; where an approved name-change request stands against the package and the change falls more than the product's
    name-change deadline before departure, the administration charge per traveller is the product's name-change charge per
    traveller taken at the early-change share published for this calculation. The travellers charged are the adults and the
    children shown on the package record, counted together. Where the ledger carries a child discount line against the package
    and the package record shows children travelling, the travellers charged are counted as the adults shown on the record
    alone, the children being re-priced without a separate administration charge; where the ledger carries a third-adult discount
    line against the package and the package record shows no children travelling, the travellers charged are counted as the
    adults shown on the record less the third adult sharing. The repeat-amendment loading applied to the charge is the whole
    of it and nothing more. Where the package ledger already carries more than one amendment or name-change charge and the
    package record stands at confirmed, the loading is the whole of it increased by the repeat-amendment allowance published
    for this calculation; where the package ledger already carries exactly one amendment or name-change charge and the package
    record stands at confirmed, the loading is the whole of it increased by the first-amendment allowance published for this
    calculation. The waiver credited back against the charge is nil. Where the traveller holds a club membership standing
    active whose tier waives change fees and that membership's ledger shows fewer such waivers used in the last twelve months
    than the tier grants, the waiver credited back is the administration charge for one traveller; where the traveller holds
    a club membership standing active whose tier waives change fees and that membership's ledger shows as many such waivers
    used in the last twelve months as the tier grants or more, nothing is credited back. The amendment charge withheld is
    the administration charge per traveller multiplied by the travellers charged and by the repeat-amendment loading, less
    the waiver credited back, rounded to two decimal places and never less than nil. The charge is withheld against the payment
    line that settled the balance of the package, and against no other. A change to the travelling party that the operations
    desk has approved is charged as an amendment under this rule whether a member is replaced or a place is simply given up,
    and the administration charge per traveller is the one this rule fixes and no other. Where places are given up under a
    change to the travelling party that the operations desk has approved, no cancellation ladder is read and no cancellation
    penalty or cancellation administration charge is withheld.
  prerequisite: []
  cross_category:
  - category: club
    as: history
    reads:
    - status
    - variant_name
    - club_points_entries.benefit_code
    note: The change-fee waivers the club tier grants and the waivers already used on the member's ledger decide the waiver
      credited back against the charge.
  compute:
  - approved_name_change_requests: COUNT('bundle_change_requests', date_field='submitted_at', request_type='name_change',
      request_status='approved')
  - days_to_departure: DAYS(NOW, F('departure_date'))
  - admin_rate: (P('name_change_fee_per_person_usd') if approved_name_change_requests > 0 and days_to_departure <= P('name_change_deadline_days')
      else (P('name_change_fee_per_person_usd') * K('early_change_share_pct') / 100 if approved_name_change_requests > 0 and
      days_to_departure > P('name_change_deadline_days') else P('amendment_admin_fee_per_person_usd')))
  - child_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_component_charge', charge_category='child_discount')
  - third_adult_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_component_charge', charge_category='third_adult_discount')
  - travellers_charged: (F('party_adults') if child_lines > 0 and F('party_children') > 0 else (F('party_adults') - 1 if third_adult_lines
      > 0 and F('party_children') == 0 else F('party_adults') + F('party_children')))
  - prior_amendment_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_penalty_charge', charge_category='amendment_fee')
  - prior_name_change_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_penalty_charge',
      charge_category='name_change_fee')
  - history_rate: ((100 + K('repeat_amendment_loading_pct')) / 100 if prior_amendment_lines + prior_name_change_lines > 1
      and F('status') == 'confirmed' else ((100 + K('first_amendment_loading_pct')) / 100 if prior_amendment_lines + prior_name_change_lines
      == 1 and F('status') == 'confirmed' else 1.0))
  - club_waivers_granted: CPARAM('club','waived_change_fees_per_year', status='active')
  - club_waivers_used_12m: XCOUNT('club','club_points_entries', within_months=12, date_field='posted_date', benefit_code='waived_change_fee')
  - waiver_credit: (admin_rate if club_waivers_granted != None and club_waivers_granted > 0 and club_waivers_used_12m < club_waivers_granted
      else (0.0 if club_waivers_granted != None and club_waivers_granted > 0 and club_waivers_used_12m >= club_waivers_granted
      else 0.0))
  - result: RND(MX(admin_rate * travellers_charged * history_rate - waiver_credit, 0.0), 2)
  compute_basis:
    approved_name_change_requests: Where an approved name-change request stands against the package and the change falls at
      or inside the product's name-change deadline before departure, the administration charge per traveller is instead the
      product's name-change charge per traveller
    days_to_departure: where an approved name-change request stands against the package and the change falls more than the
      product's name-change deadline before departure, the administration charge per traveller is the product's name-change
      charge per traveller taken at the early-change share published for this calculation.
    admin_rate: The administration charge per traveller is the product's amendment administration charge. Where an approved
      name-change request stands against the package and the change falls at or inside the product's name-change deadline
      before departure, the administration charge per traveller is instead the product's name-change charge per traveller;
      where an approved name-change request stands against the package and the change falls more than the product's name-change
      deadline before departure, the administration charge per traveller is the product's name-change charge per traveller
      taken at the early-change share published for this calculation.
    child_lines: Where the ledger carries a child discount line against the package and the package record shows children
      travelling, the travellers charged are counted as the adults shown on the record alone, the children being re-priced
      without a separate administration charge
    third_adult_lines: where the ledger carries a third-adult discount line against the package and the package record shows
      no children travelling, the travellers charged are counted as the adults shown on the record less the third adult sharing.
    travellers_charged: The travellers charged are the adults and the children shown on the package record, counted together.
      Where the ledger carries a child discount line against the package and the package record shows children travelling,
      the travellers charged are counted as the adults shown on the record alone, the children being re-priced without a separate
      administration charge; where the ledger carries a third-adult discount line against the package and the package record
      shows no children travelling, the travellers charged are counted as the adults shown on the record less the third adult
      sharing.
    prior_amendment_lines: Where the package ledger already carries more than one amendment or name-change charge and the
      package record stands at confirmed, the loading is the whole of it increased by the repeat-amendment allowance published
      for this calculation
    prior_name_change_lines: where the package ledger already carries exactly one amendment or name-change charge and the
      package record stands at confirmed, the loading is the whole of it increased by the first-amendment allowance published
      for this calculation.
    history_rate: The repeat-amendment loading applied to the charge is the whole of it and nothing more. Where the package
      ledger already carries more than one amendment or name-change charge and the package record stands at confirmed, the
      loading is the whole of it increased by the repeat-amendment allowance published for this calculation; where the package
      ledger already carries exactly one amendment or name-change charge and the package record stands at confirmed, the loading
      is the whole of it increased by the first-amendment allowance published for this calculation.
    club_waivers_granted: Where the traveller holds a club membership standing active whose tier waives change fees and that
      membership's ledger shows fewer such waivers used in the last twelve months than the tier grants, the waiver credited
      back is the administration charge for one traveller
    club_waivers_used_12m: where the traveller holds a club membership standing active whose tier waives change fees and that
      membership's ledger shows as many such waivers used in the last twelve months as the tier grants or more, nothing is
      credited back.
    waiver_credit: The waiver credited back against the charge is nil. Where the traveller holds a club membership standing
      active whose tier waives change fees and that membership's ledger shows fewer such waivers used in the last twelve months
      than the tier grants, the waiver credited back is the administration charge for one traveller; where the traveller holds
      a club membership standing active whose tier waives change fees and that membership's ledger shows as many such waivers
      used in the last twelve months as the tier grants or more, nothing is credited back.
    result: The amendment charge withheld is the administration charge per traveller multiplied by the travellers charged
      and by the repeat-amendment loading, less the waiver credited back, rounded to two decimal places and never less than
      nil.
  factors:
  - id: change_request_admin_rate
    effect: parameter
    decides: admin_rate
