      method: the travellers charged are counted as the adults shown on the record alone, the children being re-priced without
        a separate administration charge
    - when: the ledger carries a third-adult discount line against the package and the package record shows no children travelling
      method: the travellers charged are counted as the adults shown on the record less the third adult sharing
    - when: otherwise
