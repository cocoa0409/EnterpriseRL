events:
- type: bundle_quote
  target: bundle_packages
  mutation: create
  meaning: A party asks for a packaged holiday and a priced itinerary is held for them.
  grain: One row per vacation package quoted for one travelling party.
  fields:
    bundle_package_id: reference of the new package
    customer_id: lead traveller
    variant_name: package product quoted
    status: the package opens as a quotation
    package_reference: package reference returned
    destination_resort_code: resort, ship or tour quoted
    departure_date: date of departure
    return_date: date of return
    duration_nights: nights covered
    party_adults: adults travelling
    party_children: children travelling
    rooms_or_cabins: rooms or cabins held
    quoted_date: date of the quotation
    package_price_usd: price quoted for the whole party
    final_payment_due_date: date the balance falls due
    lead_traveller_name: lead traveller named
    contact_email: contact address for documents
    contact_phone: contact number for the operator
    linked_care_policy_id: protection policy bought with the package, empty when none
  triggers: []
- type: bundle_deposit
  target: bundle_packages
  mutation:
    transition:
      from: quoted
      to: deposit_held
  meaning: The deposit is taken and the operator holds the itinerary for the party.
  grain: One row per package, at the moment its deposit is taken.
  fields:
    bundle_package_id: package being held
    status: the package moves to deposit held
    deposit_taken_at: moment the deposit was taken
    final_payment_due_date: date the balance falls due
  triggers:
  - event: bundle:bundle_deposit_charge
    map:
      bundle_package_id: bundle_package_id
      charge_category: deposit
      reason_code: routine_package
- type: bundle_confirm
  target: bundle_packages
  mutation:
    transition:
      from: deposit_held
      to: confirmed
  meaning: The balance is received and the package is confirmed with every supplier.
  grain: One row per package, at the moment its balance is settled.
  fields:
    bundle_package_id: package being confirmed
    status: the package becomes confirmed
    confirmed_at: moment of confirmation
    refund_form: form in which value will be returned if the party cancels
  triggers:
  - event: bundle:bundle_final_payment_charge
    map:
      bundle_package_id: bundle_package_id
      charge_category: final_payment
      reason_code: final_payment_due
  - event: club:club_points_accrual
    map:
      customer_id: customer_id
      accrual_source: bundle_booking
- type: bundle_depart
  target: bundle_packages
  mutation:
    transition:
      from: confirmed
      to: travelling
  meaning: The party departs and the packaged journey begins.
  grain: One row per package, at the moment the party departs.
  fields:
    bundle_package_id: package departing
    status: the package becomes travelling
  triggers: []
- type: bundle_complete
  target: bundle_packages
  mutation:
    transition:
      from: travelling
      to: completed
  meaning: The party returns and the package is fulfilled.
  grain: One row per package, at the moment the party returns.
  fields:
    bundle_package_id: package completing
    status: the package becomes completed
    completed_date: date the party returned
  triggers: []
- type: bundle_cancel
  target: bundle_packages
  mutation:
    transition:
      from: confirmed
      to: cancelled
  meaning: The party cancels their own confirmed package.
  grain: One row per package, at the moment the party confirms the cancellation.
  fields:
    bundle_package_id: package being cancelled
    status: the package becomes cancelled
    cancelled_at: moment the party confirmed
    refund_form: form in which value will be returned under the product booked
  triggers:
  - event: bundle:bundle_penalty_charge
    map:
      bundle_package_id: bundle_package_id
      charge_category: cancellation_penalty
      reason_code: traveller_cancellation
- type: bundle_predeposit_cancel
  target: bundle_packages
  mutation:
    transition:
      from: deposit_held
      to: cancelled
  meaning: The party gives up a package on which only the deposit has been paid.
  grain: One row per package, at the moment the party gives it up before the balance falls due.
  fields:
    bundle_package_id: package being given up
    status: the package becomes cancelled
    cancelled_at: moment the party confirmed
    refund_form: form in which value will be returned under the product booked
  triggers:
  - event: bundle:bundle_penalty_charge
    map:
      bundle_package_id: bundle_package_id
      charge_category: cancellation_penalty
      reason_code: traveller_cancellation
- type: bundle_party_amend
  target: bundle_packages
  mutation: update
  meaning: The travelling party, the dates or the contact details on a package are changed.
  grain: One row per package, each time its particulars are changed.
  fields:
    bundle_package_id: package being changed
    lead_traveller_name: changed lead traveller name
    party_adults: changed number of adults
    party_children: changed number of children
    rooms_or_cabins: changed number of rooms or cabins
    departure_date: changed departure date
    return_date: changed return date
    contact_email: changed contact address
    contact_phone: changed contact number
