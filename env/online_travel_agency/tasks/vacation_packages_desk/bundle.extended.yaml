extended_policies:
- id: bundle_ext_operator_surcharge_pricing
  base_policy_refs:
  - bundle_agg_party_pricing
  - bundle_components
  - bundle_evt_supplier_notice
  - bundle_club_and_corporate_interaction
  overwrite:
  - base_policy: bundle_evt_supplier_notice
    superseded_clause: Several notices about the same package are not added together; the last notice standing before departure
      decides what is owed and what may be refused.
    replaced_by: Where the notice posted latest against the package advises no surcharge and an earlier notice standing against
      the package advises a surcharge above nil, the amount advised by the latest notice that did advise a surcharge is taken
      as the notified rate instead
  - base_policy: bundle_evt_supplier_notice
    superseded_clause: A surcharge at or below the product's threshold share of the package price must be paid, and a surcharge
      above it entitles the party to cancel with nothing withheld or to accept a comparable alternative.
    replaced_by: held at no more than the product's threshold share of the package price
  trigger: state_due
  subject:
  - bundle_component_charge
  computes: surcharge_amount_usd
  target_tool: price_package_surcharge_8a2d0e07
  params:
    dormant_member_share_pct: 50
    loyalty_concession_pct: 6
    near_threshold_concession_pct: 3
    frequent_traveller_threshold_36m: 3
  rule: 'A surcharge notified by the operator is priced onto the package ledger as one line for the whole party. The notified
    rate is the amount advised for one traveller by the operator notice posted latest against the package. Where the notice
    posted latest against the package advises no surcharge and an earlier notice standing against the package advises a surcharge
    above nil, the amount advised by the latest notice that did advise a surcharge is taken as the notified rate instead;
    where the notice posted latest against the package advises no surcharge and no earlier notice standing against the package
    advises a surcharge above nil, the notified rate is nil. The rate the party bears is the notified rate itself. Where the
    traveller holds a club membership standing active whose tier carries a package discount and that membership''s points
    ledger carries at least one package accrual in the last twelve months, the rate borne is the notified rate reduced by
    the package discount percentage that tier carries; where the traveller holds a club membership standing active whose tier
    carries a package discount and that membership''s points ledger carries no package accrual in the last twelve months,
    the rate borne is the notified rate reduced by that same percentage taken at the dormant-member share published for this
    calculation. The head basis the rate is spread across is the adults and the children shown on the package record, counted
    together. Where the ledger carries a third-adult discount line against the package and the package record shows children
    travelling, the head basis is instead the adults shown on the record less the third adult sharing, that third adult counted
    at the product''s third-adult share of a full place, and the children counted at the product''s child share of a full
    place; where the ledger carries a third-adult discount line against the package and the package record shows no children
    travelling, the head basis is the adults shown on the record less the third adult sharing, that third adult counted at
    the product''s third-adult share of a full place. The surcharge worked out for the party is the rate borne multiplied
    by the head basis. The loyalty rate applied to that figure is the whole of it. Where the traveller''s club points ledger
    carries more than the frequent-traveller threshold of package accruals in the last thirty-six months and the club membership
    stands active, the loyalty rate is the whole of it less the loyalty concession published for this calculation; where the
    traveller''s club points ledger carries exactly the frequent-traveller threshold of package accruals in the last thirty-six
    months and the club membership stands active, the loyalty rate is the whole of it less the near-threshold concession published
    for this calculation. The surcharge priced onto the ledger is the surcharge worked out for the party multiplied by the
    loyalty rate, held at no more than the product''s threshold share of the package price, rounded to two decimal places
    and never less than nil.

    '
  prerequisite: []
  cross_category:
  - category: club
    as: history
    reads:
    - status
    - variant_name
    - club_points_entries.accrual_source
    note: The club tier held and the package accruals on the member's points ledger decide the concession tiers of the rate
      borne and of the loyalty rate.
  compute:
  - latest_notice_amount: LATEST('bundle_ledger_entries','amount_usd', date_field='posted_date', event_type='bundle_supplier_notice')
  - surcharge_notice_amount: LATEST('bundle_ledger_entries','amount_usd', date_field='posted_date', event_type='bundle_supplier_notice',
      reason_code='surcharge_notice')
  - notified_rate: (surcharge_notice_amount if latest_notice_amount <= 0 and surcharge_notice_amount > 0 else (0.0 if latest_notice_amount
      <= 0 and surcharge_notice_amount <= 0 else latest_notice_amount))
  - club_tier_package_pct: CPARAM('club','package_discount_pct', status='active')
  - club_package_accruals_12m: XCOUNT('club','club_points_entries', within_months=12, date_field='posted_date', accrual_source='bundle_booking')
  - borne_rate: (notified_rate * (100 - club_tier_package_pct) / 100 if club_tier_package_pct != None and club_tier_package_pct
      > 0 and club_package_accruals_12m > 0 else (notified_rate * (100 - club_tier_package_pct * K('dormant_member_share_pct')
      / 100) / 100 if club_tier_package_pct != None and club_tier_package_pct > 0 and club_package_accruals_12m == 0 else
      notified_rate))
  - third_adult_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_component_charge', charge_category='third_adult_discount')
  - head_basis: (F('party_adults') - 1 + (100 - P('third_adult_discount_pct')) / 100 + F('party_children') * (100 - P('child_discount_pct'))
      / 100 if third_adult_lines > 0 and F('party_children') > 0 else (F('party_adults') - 1 + (100 - P('third_adult_discount_pct'))
      / 100 if third_adult_lines > 0 and F('party_children') == 0 else F('party_adults') + F('party_children')))
  - party_surcharge: borne_rate * head_basis
  - club_package_accruals_36m: XCOUNT('club','club_points_entries', within_months=36, date_field='posted_date', accrual_source='bundle_booking')
  - club_active: EXISTS('club', status='active')
  - loyalty_rate: ((100 - K('loyalty_concession_pct')) / 100 if club_package_accruals_36m > K('frequent_traveller_threshold_36m')
      and club_active else ((100 - K('near_threshold_concession_pct')) / 100 if club_package_accruals_36m == K('frequent_traveller_threshold_36m')
      and club_active else 1.0))
  - threshold_cap: F('package_price_usd') * P('surcharge_threshold_pct') / 100
  - result: RND(MX(MN(party_surcharge * loyalty_rate, threshold_cap), 0.0), 2)
  compute_basis:
    latest_notice_amount: The notified rate is the amount advised for one traveller by the operator notice posted latest against
      the package.
    surcharge_notice_amount: Where the notice posted latest against the package advises no surcharge and an earlier notice
      standing against the package advises a surcharge above nil, the amount advised by the latest notice that did advise
      a surcharge is taken as the notified rate instead; where the notice posted latest against the package advises no surcharge
      and no earlier notice standing against the package advises a surcharge above nil, the notified rate is nil.
    notified_rate: Where the notice posted latest against the package advises no surcharge and an earlier notice standing
      against the package advises a surcharge above nil, the amount advised by the latest notice that did advise a surcharge
      is taken as the notified rate instead; where the notice posted latest against the package advises no surcharge and no
      earlier notice standing against the package advises a surcharge above nil, the notified rate is nil.
    club_tier_package_pct: Where the traveller holds a club membership standing active whose tier carries a package discount
      and that membership's points ledger carries at least one package accrual in the last twelve months, the rate borne is
      the notified rate reduced by the package discount percentage that tier carries
    club_package_accruals_12m: Where the traveller holds a club membership standing active whose tier carries a package discount
      and that membership's points ledger carries no package accrual in the last twelve months, the rate borne is the notified
      rate reduced by that same percentage taken at the dormant-member share published for this calculation.
    borne_rate: The rate the party bears is the notified rate itself. Where the traveller holds a club membership standing
      active whose tier carries a package discount and that membership's points ledger carries at least one package accrual
      in the last twelve months, the rate borne is the notified rate reduced by the package discount percentage that tier
      carries; where the traveller holds a club membership standing active whose tier carries a package discount and that
      membership's points ledger carries no package accrual in the last twelve months, the rate borne is the notified rate
      reduced by that same percentage taken at the dormant-member share published for this calculation.
    third_adult_lines: Where the ledger carries a third-adult discount line against the package and the package record shows
      children travelling, the head basis is instead the adults shown on the record less the third adult sharing, that third
      adult counted at the product's third-adult share of a full place, and the children counted at the product's child share
      of a full place
    head_basis: The head basis the rate is spread across is the adults and the children shown on the package record, counted
      together. Where the ledger carries a third-adult discount line against the package and the package record shows children
      travelling, the head basis is instead the adults shown on the record less the third adult sharing, that third adult
      counted at the product's third-adult share of a full place, and the children counted at the product's child share of
      a full place; where the ledger carries a third-adult discount line against the package and the package record shows
      no children travelling, the head basis is the adults shown on the record less the third adult sharing, that third adult
      counted at the product's third-adult share of a full place.
    club_package_accruals_36m: Where the traveller's club points ledger carries more than the frequent-traveller threshold
      of package accruals in the last thirty-six months and the club membership stands active, the loyalty rate is the whole
      of it less the loyalty concession published for this calculation
    club_active: where the traveller's club points ledger carries exactly the frequent-traveller threshold of package accruals
      in the last thirty-six months and the club membership stands active, the loyalty rate is the whole of it less the near-threshold
      concession published for this calculation
    loyalty_rate: The loyalty rate applied to that figure is the whole of it. Where the traveller's club points ledger carries
      more than the frequent-traveller threshold of package accruals in the last thirty-six months and the club membership
      stands active, the loyalty rate is the whole of it less the loyalty concession published for this calculation; where
      the traveller's club points ledger carries exactly the frequent-traveller threshold of package accruals in the last
      thirty-six months and the club membership stands active, the loyalty rate is the whole of it less the near-threshold
      concession published for this calculation.
    threshold_cap: held at no more than the product's threshold share of the package price
    result: The surcharge priced onto the ledger is the surcharge worked out for the party multiplied by the loyalty rate,
      held at no more than the product's threshold share of the package price, rounded to two decimal places and never less
      than nil.
  factors:
  - id: notice_selection_rule
    effect: method
    decides: notified_rate
    bindings:
    - latest_notice_amount
    - surcharge_notice_amount
    - notified_rate
    ladder:
    - when: the operator notice posted latest against the package advises no surcharge and an earlier notice standing against
        the package advises a surcharge above nil
      method: the amount advised by the latest notice that did advise a surcharge is taken as the notified rate
    - when: the operator notice posted latest against the package advises no surcharge and no earlier notice standing against
        the package advises a surcharge above nil
      method: the notified rate is nil
    - when: otherwise
      method: the amount advised for one traveller by the operator notice posted latest against the package is taken as the
        notified rate
    baseline:
      notified_rate: latest_notice_amount
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: club_tier_rate_concession
    effect: parameter
    decides: borne_rate
    bindings:
    - club_tier_package_pct
    - club_package_accruals_12m
    - borne_rate
    ladder:
    - when: the traveller holds a club membership standing active whose tier carries a package discount and that membership's
        points ledger carries at least one package accrual in the last twelve months
      value: the notified rate reduced by the package discount percentage that tier carries
    - when: the traveller holds a club membership standing active whose tier carries a package discount and that membership's
        points ledger carries no package accrual in the last twelve months
      value: the notified rate reduced by that same percentage taken at the dormant-member share published for this calculation
    - when: otherwise
      value: the notified rate itself
    baseline:
      borne_rate: notified_rate
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  - id: party_head_basis
    effect: parameter
    decides: head_basis
    bindings:
    - third_adult_lines
    - head_basis
    ladder:
    - when: the ledger carries a third-adult discount line against the package and the package record shows children travelling
      value: the adults shown on the record less the third adult sharing, that third adult counted at the product's third-adult
        share of a full place, and the children counted at the product's child share of a full place
    - when: the ledger carries a third-adult discount line against the package and the package record shows no children travelling
      value: the adults shown on the record less the third adult sharing, that third adult counted at the product's third-adult
        share of a full place
    - when: otherwise
      value: the adults and the children shown on the package record, counted together
    baseline:
      head_basis: F('party_adults') + F('party_children')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: frequent_traveller_loyalty_rate
    effect: parameter
    decides: loyalty_rate
    bindings:
    - club_package_accruals_36m
    - club_active
    - loyalty_rate
    ladder:
    - when: the traveller's club points ledger carries more than the frequent-traveller threshold of package accruals in the
        last thirty-six months and the club membership stands active
      value: the whole of it less the loyalty concession published for this calculation
    - when: the traveller's club points ledger carries exactly the frequent-traveller threshold of package accruals in the
        last thirty-six months and the club membership stands active
      value: the whole of it less the near-threshold concession published for this calculation
    - when: otherwise
      value: the whole of it
    baseline:
      loyalty_rate: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  baseline:
    rule: A surcharge notified by the operator is priced onto the package ledger as one line for the whole party. The notified
      rate is the amount advised for one traveller by the operator notice posted latest against the package. The rate the
      party bears is the notified rate itself. The head basis the rate is spread across is the adults and the children shown
      on the package record, counted together. The surcharge worked out for the party is the rate borne multiplied by the
      head basis. The loyalty rate applied to that figure is the whole of it. The surcharge priced onto the ledger is the
      surcharge worked out for the party multiplied by the loyalty rate, held at no more than the product's threshold share
      of the package price, rounded to two decimal places and never less than nil.
    params:
    - surcharge_threshold_pct
  inputs:
    history:
    - table: bundle_ledger_entries
      aggregate: latest
      field: amount_usd
      within_months: null
      filters:
        event_type: bundle_supplier_notice
    - table: bundle_ledger_entries
      aggregate: count
      field: bundle_entry_id
      within_months: null
      filters:
        charge_category: third_adult_discount
    - category: club
      table: club_points_entries
      aggregate: count
      field: club_points_entry_id
      within_months: 36
      filters:
        accrual_source: bundle_booking
    cross_category:
    - club
- id: bundle_ext_balance_settlement
  base_policy_refs:
  - bundle_payment_schedule
  - bundle_club_and_corporate_interaction
  - bundle_booking_terms
  overwrite:
  - base_policy: bundle_payment_schedule
    superseded_clause: A product that allows instalments splits the balance into its own number of equal instalments falling
      due at equal intervals between the deposit and the final-payment date, and the last instalment is adjusted for rounding.
    replaced_by: Where the product booked allows the balance to be paid in instalments and at least one instalment has already
      been taken, the figure taken now is instead the outstanding amount divided by the product's number of instalments less
      those already taken, rounded to two decimal places at that step
  - base_policy: bundle_booking_terms
    superseded_clause: The agency service fee is charged per traveller when the deposit is taken and is never returned.
    replaced_by: where the ledger carries no agency service fee line against the package and the tier held does not waive
      the agency service fee, the agency service fee carried into the balance is the product's agency service fee for each
      adult and each child shown on the package record
  - base_policy: bundle_club_and_corporate_interaction
    superseded_clause: Where the member's tier changes between deposit and departure, the discount applied at deposit stands
      and is neither topped up nor clawed back.
    replaced_by: where the traveller holds a club membership standing active whose tier carries a package discount, whose
      tier took effect on or before the day the deposit was taken and whose status expiry date falls on or before the departure
      date, the package discount applied is that same percentage taken at the expiring-tier share published for this calculation
  - base_policy: bundle_booking_terms
    superseded_clause: The deposit is the product's flat amount per traveller, or its share of the package price where the
      product takes a share; the two are never both taken.
    replaced_by: The product's standard deposit for a deposit line is the product's flat deposit amount for one traveller,
      and a product that publishes both a flat amount per traveller and a share of the package price takes the flat amount.
  trigger: on_request
  subject:
  - bundle_final_payment_charge
  computes: balance_due_usd
  target_tool: settle_package_balance_32304520
  params:
    expiring_tier_share_pct: 50
    part_currency_share_pct: 50
  rule: 'The balance due on a package is worked out from the package record and the lines standing on its ledger. The balance
    is worked out only after the package ledger carries a surcharge line answering every surcharge the operator has notified
    against the package. The package discount applied to the quoted price is nil. Where the traveller holds a club membership
    standing active whose tier carries a package discount, whose tier took effect on or before the day the deposit was taken
    and whose status expiry date falls after the departure date, the package discount applied is the package discount percentage
    that tier carries; where the traveller holds a club membership standing active whose tier carries a package discount,
    whose tier took effect on or before the day the deposit was taken and whose status expiry date falls on or before the
    departure date, the package discount applied is that same percentage taken at the expiring-tier share published for this
    calculation. The discounted price is the quoted package price reduced once by the package discount applied; the discount
    acts on the quoted price alone and never on the ledger lines. The promotional deposit shortfall carried into the balance
    is nil. The product''s standard deposit for a deposit line is the product''s flat deposit amount for one traveller, and
    a product that publishes both a flat amount per traveller and a share of the package price takes the flat amount. Where
    the product booked allows a reduced promotional deposit and the deposit already taken falls short of the product''s standard
    deposit for the deposit lines it was taken in, the shortfall carried into the balance is that standard deposit for those
    lines less the deposit already taken; where the product booked allows a reduced promotional deposit and the deposit already
    taken meets or exceeds the product''s standard deposit for those lines, the shortfall carried into the balance is nil.
    The agency service fee carried into the balance is nil. Where the ledger carries no agency service fee line against the
    package and the tier held waives the agency service fee on bookings made while it is held, the agency service fee carried
    into the balance is nil; where the ledger carries no agency service fee line against the package and the tier held does
    not waive the agency service fee, the agency service fee carried into the balance is the product''s agency service fee
    for each adult and each child shown on the package record. The outstanding amount is the discounted price, plus the signed
    total of the component lines standing on the ledger, plus the promotional deposit shortfall, plus the agency service fee
    carried into the balance, less the deposit already taken and less the instalments already taken. The figure taken now
    is the whole outstanding amount. Where the product booked allows the balance to be paid in instalments and at least one
    instalment has already been taken, the figure taken now is instead the outstanding amount divided by the product''s number
    of instalments less those already taken, rounded to two decimal places at that step; where the product booked allows the
    balance to be paid in instalments and no instalment has yet been taken, the figure taken now is the outstanding amount
    divided by the product''s number of instalments, rounded to two decimal places at that step. The currency presentation
    loading applied to the figure taken now is the whole of it and nothing more. Where every payment already taken on the
    package was presented in a currency other than the operator''s own and at least one payment has been taken, the loading
    is the whole of it increased by the product''s conversion markup; where some but not all of the payments already taken
    were presented in a currency other than the operator''s own, the loading is the whole of it increased by that markup taken
    at the part-presentation share published for this calculation. The balance due is the figure taken now multiplied by the
    currency presentation loading, rounded to two decimal places and never less than nil.

    '
  prerequisite:
  - problem: bundle_ext_operator_surcharge_pricing
    kind: value_input
    gate: charges_on_ledger
    form: state
    policy_source: The balance is worked out only after the package ledger carries a surcharge line answering every surcharge
      the operator has notified against the package.
    condition: The package ledger carries a surcharge line answering every surcharge notice standing against the package.
    resolved_by: price_package_surcharge_8a2d0e07
    effect: The signed total of the component lines standing on the ledger rises by the surcharge line, so the outstanding
      amount and the figure taken now both change.
  cross_category:
  - category: club
    as: branch
    reads:
    - status
    - variant_name
    - tier_effective_date
    - status_expiry_date
    note: The club tier held, the date it took effect and the date it expires decide the package discount tier and the agency
      service fee tier.
  compute:
  - club_tier_package_pct: CPARAM('club','package_discount_pct', status='active')
  - tier_effect_lead_days: DAYS(CFIELD('club','tier_effective_date', status='active') or F('quoted_date'), F('deposit_taken_at'))
  - status_expiry_lead_days: DAYS(F('departure_date'), CFIELD('club','status_expiry_date', status='active') or F('departure_date'))
  - club_discount_pct: (club_tier_package_pct if club_tier_package_pct != None and club_tier_package_pct > 0 and tier_effect_lead_days
      >= 0 and status_expiry_lead_days > 0 else (club_tier_package_pct * K('expiring_tier_share_pct') / 100 if club_tier_package_pct
      != None and club_tier_package_pct > 0 and tier_effect_lead_days >= 0 and status_expiry_lead_days <= 0 else 0))
  - discounted_price: F('package_price_usd') * (100 - club_discount_pct) / 100
  - charges_on_ledger: SUM('bundle_ledger_entries','amount_usd', date_field='posted_date', event_type='bundle_component_charge')
  - deposit_paid: SUM('bundle_ledger_entries','amount_usd', date_field='posted_date', event_type='bundle_deposit_charge')
  - deposit_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_deposit_charge')
  - deposit_shortfall_due: (P('deposit_per_person_usd') * deposit_lines - deposit_paid if P('low_deposit_promo_allowed') and
      deposit_paid < P('deposit_per_person_usd') * deposit_lines else (0.0 if P('low_deposit_promo_allowed') and deposit_paid
      >= P('deposit_per_person_usd') * deposit_lines else 0.0))
  - service_fee_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_component_charge', charge_category='agency_service_fee')
  - club_fee_waiver: CPARAM('club','agency_service_fee_waiver', status='active')
  - service_fee_due: (0.0 if service_fee_lines == 0 and club_fee_waiver == True else (P('agency_service_fee_per_person_usd')
      * (F('party_adults') + F('party_children')) if service_fee_lines == 0 and club_fee_waiver != True else 0.0))
  - instalments_paid_amount: SUM('bundle_ledger_entries','amount_usd', date_field='posted_date', event_type='bundle_final_payment_charge')
  - gross_outstanding: discounted_price + charges_on_ledger + deposit_shortfall_due + service_fee_due - deposit_paid - instalments_paid_amount
  - instalments_paid_count: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_final_payment_charge')
  - instalment_due: (RND(gross_outstanding / (P('payment_plan_instalments') - instalments_paid_count), 2) if P('payment_plan_available')
      and instalments_paid_count > 0 else (RND(gross_outstanding / P('payment_plan_instalments'), 2) if P('payment_plan_available')
      and instalments_paid_count == 0 else gross_outstanding))
  - usd_payment_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_deposit_charge', currency_charged='USD')
      + COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_final_payment_charge', currency_charged='USD')
  - payment_lines: deposit_lines + instalments_paid_count
  - loading_rate: ((100 + P('currency_conversion_markup_pct')) / 100 if usd_payment_lines == 0 and payment_lines > 0 else
      ((100 + P('currency_conversion_markup_pct') * K('part_currency_share_pct') / 100) / 100 if usd_payment_lines > 0 and
      usd_payment_lines < payment_lines else 1.0))
  - result: RND(MX(instalment_due * loading_rate, 0.0), 2)
  compute_basis:
    club_tier_package_pct: Where the traveller holds a club membership standing active whose tier carries a package discount,
      whose tier took effect on or before the day the deposit was taken and whose status expiry date falls after the departure
      date, the package discount applied is the package discount percentage that tier carries
    tier_effect_lead_days: Where the traveller holds a club membership standing active whose tier carries a package discount,
      whose tier took effect on or before the day the deposit was taken and whose status expiry date falls after the departure
      date, the package discount applied is the package discount percentage that tier carries
    status_expiry_lead_days: where the traveller holds a club membership standing active whose tier carries a package discount,
      whose tier took effect on or before the day the deposit was taken and whose status expiry date falls on or before the
      departure date, the package discount applied is that same percentage taken at the expiring-tier share published for
      this calculation.
    club_discount_pct: The package discount applied to the quoted price is nil. Where the traveller holds a club membership
      standing active whose tier carries a package discount, whose tier took effect on or before the day the deposit was taken
      and whose status expiry date falls after the departure date, the package discount applied is the package discount percentage
      that tier carries; where the traveller holds a club membership standing active whose tier carries a package discount,
      whose tier took effect on or before the day the deposit was taken and whose status expiry date falls on or before the
      departure date, the package discount applied is that same percentage taken at the expiring-tier share published for
      this calculation.
    discounted_price: The discounted price is the quoted package price reduced once by the package discount applied; the discount
      acts on the quoted price alone and never on the ledger lines.
    charges_on_ledger: The outstanding amount is the discounted price, plus the signed total of the component lines standing
      on the ledger, plus the promotional deposit shortfall, plus the agency service fee carried into the balance, less the
      deposit already taken and less the instalments already taken.
    deposit_paid: less the deposit already taken and less the instalments already taken
    deposit_lines: Where the product booked allows a reduced promotional deposit and the deposit already taken falls short
      of the product's standard deposit for the deposit lines it was taken in, the shortfall carried into the balance is that
      standard deposit for those lines less the deposit already taken
    deposit_shortfall_due: The promotional deposit shortfall carried into the balance is nil. Where the product booked allows
      a reduced promotional deposit and the deposit already taken falls short of the product's standard deposit for the deposit
      lines it was taken in, the shortfall carried into the balance is that standard deposit for those lines less the deposit
      already taken; where the product booked allows a reduced promotional deposit and the deposit already taken meets or
      exceeds the product's standard deposit for those lines, the shortfall carried into the balance is nil.
    service_fee_lines: Where the ledger carries no agency service fee line against the package and the tier held waives the
      agency service fee on bookings made while it is held, the agency service fee carried into the balance is nil
    club_fee_waiver: where the ledger carries no agency service fee line against the package and the tier held does not waive
      the agency service fee, the agency service fee carried into the balance is the product's agency service fee for each
      adult and each child shown on the package record.
    service_fee_due: The agency service fee carried into the balance is nil. Where the ledger carries no agency service fee
      line against the package and the tier held waives the agency service fee on bookings made while it is held, the agency
      service fee carried into the balance is nil; where the ledger carries no agency service fee line against the package
      and the tier held does not waive the agency service fee, the agency service fee carried into the balance is the product's
      agency service fee for each adult and each child shown on the package record.
    instalments_paid_amount: less the deposit already taken and less the instalments already taken
    instalments_paid_count: Where the product booked allows the balance to be paid in instalments and at least one instalment
      has already been taken, the figure taken now is instead the outstanding amount divided by the product's number of instalments
      less those already taken, rounded to two decimal places at that step
    instalment_due: The figure taken now is the whole outstanding amount. Where the product booked allows the balance to be
      paid in instalments and at least one instalment has already been taken, the figure taken now is instead the outstanding
      amount divided by the product's number of instalments less those already taken, rounded to two decimal places at that
      step; where the product booked allows the balance to be paid in instalments and no instalment has yet been taken, the
      figure taken now is the outstanding amount divided by the product's number of instalments, rounded to two decimal places
      at that step.
    usd_payment_lines: Where every payment already taken on the package was presented in a currency other than the operator's
      own and at least one payment has been taken, the loading is the whole of it increased by the product's conversion markup
    payment_lines: where some but not all of the payments already taken were presented in a currency other than the operator's
      own, the loading is the whole of it increased by that markup taken at the part-presentation share published for this
      calculation.
    loading_rate: The currency presentation loading applied to the figure taken now is the whole of it and nothing more. Where
      every payment already taken on the package was presented in a currency other than the operator's own and at least one
      payment has been taken, the loading is the whole of it increased by the product's conversion markup; where some but
      not all of the payments already taken were presented in a currency other than the operator's own, the loading is the
      whole of it increased by that markup taken at the part-presentation share published for this calculation.
    result: The balance due is the figure taken now multiplied by the currency presentation loading, rounded to two decimal
      places and never less than nil.
  factors:
  - id: club_package_discount
    effect: parameter
    decides: club_discount_pct
    bindings:
    - club_tier_package_pct
    - tier_effect_lead_days
    - status_expiry_lead_days
    - club_discount_pct
    ladder:
    - when: the traveller holds a club membership standing active whose tier carries a package discount, whose tier took effect
        on or before the day the deposit was taken and whose status expiry date falls after the departure date
      value: the package discount percentage that tier carries
    - when: the traveller holds a club membership standing active whose tier carries a package discount, whose tier took effect
        on or before the day the deposit was taken and whose status expiry date falls on or before the departure date
      value: that same percentage taken at the expiring-tier share published for this calculation
    - when: otherwise
      value: nil
    baseline:
      club_discount_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: club
  - id: promotional_deposit_shortfall
    effect: parameter
    decides: deposit_shortfall_due
    bindings:
    - deposit_paid
    - deposit_lines
    - deposit_shortfall_due
    ladder:
    - when: the product booked allows a reduced promotional deposit and the deposit already taken falls short of the product's
        standard deposit for the deposit lines it was taken in
      value: that standard deposit for those lines less the deposit already taken
    - when: the product booked allows a reduced promotional deposit and the deposit already taken meets or exceeds the product's
        standard deposit for those lines
      value: nil
    - when: otherwise
      value: nil
    baseline:
      deposit_shortfall_due: '0.0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: agency_service_fee_recovery
    effect: parameter
    decides: service_fee_due
    bindings:
    - service_fee_lines
    - club_fee_waiver
    - service_fee_due
    ladder:
    - when: the ledger carries no agency service fee line against the package and the tier held waives the agency service
        fee on bookings made while it is held
      value: nil
    - when: the ledger carries no agency service fee line against the package and the tier held does not waive the agency
        service fee
      value: the product's agency service fee for each adult and each child shown on the package record
    - when: otherwise
      value: nil
    baseline:
      service_fee_due: '0.0'
    evidence:
    - history
    - cross_category
    cross_difficulty: club
  - id: instalment_split_method
    effect: method
    decides: instalment_due
    bindings:
    - instalments_paid_count
    - instalment_due
    ladder:
    - when: the product booked allows the balance to be paid in instalments and at least one instalment has already been taken
      method: the outstanding amount is divided by the product's number of instalments less those already taken, and the quotient
        is rounded to two decimal places at that step
    - when: the product booked allows the balance to be paid in instalments and no instalment has yet been taken
      method: the outstanding amount is divided by the product's number of instalments, and the quotient is rounded to two
        decimal places at that step
    - when: otherwise
      method: the whole outstanding amount is taken
    baseline:
      instalment_due: gross_outstanding
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: currency_presentation_loading
    effect: parameter
    decides: loading_rate
    bindings:
    - usd_payment_lines
    - payment_lines
    - loading_rate
    ladder:
    - when: every payment already taken on the package was presented in a currency other than the operator's own and at least
        one payment has been taken
      value: the whole of it increased by the product's conversion markup
    - when: some but not all of the payments already taken were presented in a currency other than the operator's own
      value: the whole of it increased by that markup taken at the part-presentation share published for this calculation
    - when: otherwise
      value: the whole of it and nothing more
    baseline:
      loading_rate: '1.0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: The balance due on a package is worked out from the package record and the lines standing on its ledger. The package
      discount applied to the quoted price is nil. The discounted price is the quoted package price reduced once by the package
      discount applied; the discount acts on the quoted price alone and never on the ledger lines. The promotional deposit
      shortfall carried into the balance is nil. The agency service fee carried into the balance is nil. The outstanding amount
      is the discounted price, plus the signed total of the component lines standing on the ledger, plus the promotional deposit
      shortfall, plus the agency service fee carried into the balance, less the deposit already taken and less the instalments
      already taken. The figure taken now is the whole outstanding amount. The currency presentation loading applied to the
      figure taken now is the whole of it and nothing more. The balance due is the figure taken now multiplied by the currency
      presentation loading, rounded to two decimal places and never less than nil.
    params: []
