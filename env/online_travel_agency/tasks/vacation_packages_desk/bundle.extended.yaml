- id: bundle_credit
  subject:
  - bundle_credit_issue
  - bundle_credit_redeem
  rule: A future travel credit is issued for the value the cancelled package still carried after the penalty and the administration charge have been withheld, and carries an expiry set by the credit validity
    term of the product that produced it. A future travel credit voucher is issued only when no voucher has already been issued against the same package. A voucher is applied only while the package record
    stands at quoted or deposit held. The voucher is issued in the name of the lead traveller and is transferable only where the producing product makes credits transferable. A voucher is applied to the
    price of a new package before any discount and never to the deposit alone, and the balance is collected in the ordinary way. A product whose credit validity term is zero issues no voucher at all, and
    the cancelled value is forfeited. The value on a voucher is never paid out in money, and an unused voucher is never extended beyond its expiry.
  eligibility:
  - id: one_voucher_per_package
    applies_to:
    - bundle_credit_issue
    kind: dedup
    condition: A future travel credit voucher is issued only when no voucher has already been issued against the same package.
    evidence_fields:
    - bundle_ledger_entries.bundle_package_id
    - bundle_ledger_entries.charge_category
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - bundle_ledger_entries.bundle_package_id
      action_bindings:
        bundle_ledger_entries.bundle_package_id: bundle_package_id
    dedup_contract:
      table: bundle_ledger_entries
      mode: separate_record
      object_bindings:
        bundle_package_id: bundle_package_id
      duplicate_filters:
        charge_category:
        - credit_issue
      distinct_fields:
