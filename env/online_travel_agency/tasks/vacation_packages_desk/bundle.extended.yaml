measures:
- id: bundle_msr_packages_completed_36m
  window: rolling 36 months ending on the handling date, counted back day by day from the frozen handling date
  measure: count of bundle_final_payment_charge rows across the traveller's completed packages
- id: bundle_msr_amendments_per_package
  window: the life of the package, from the quotation date to the departure date
  measure: count of bundle_penalty_charge rows on the same package whose charge_category is amendment_fee, name_change_fee or date_change_fee
policies:
- id: bundle_agg_multi_holding
  subject:
  - bundle_quote
  rule: 'A traveller may hold more than one packaged holiday at a time, and each package carries its own product, its own payment schedule and its own cancellation ladder. Two packages departing on the
    same date for the same party are referred for duplicate review before the deposit is taken, because suppliers hold one allocation against one party. Nothing is aggregated between packages: a deposit
    paid on one is never moved to another, and a free group place earned on one never reduces the price of another. A traveller named on two packages is still one traveller, and each package charges its
    own per-traveller amounts in full.'
  eligibility: []
  params:
    max_per_customer: null
    duplicate_review_departure_match: true
- id: bundle_agg_party_pricing
  subject:
  - bundle_component_charge
  rule: A package is priced for the party as a whole and then apportioned traveller by traveller, so every per-person amount is read against the party actually travelling and never against the party first
    quoted. A traveller occupying a room or cabin alone carries the product's single supplement, a third adult sharing takes its third-adult discount, and a child within the product's child age takes its
    child discount; the supplement and the discounts never apply to the same traveller at once. An infant under the product's infant age travels at the flat infant price and is not counted for occupancy,
    for discounts or for group ratios. A group at or above the product's free-place ratio earns one free place for every full ratio of paying travellers, and the free place is always the lowest priced place
    in the party. Where the party shrinks after booking the remaining travellers are re-priced at the occupancy they are left with, and the re-pricing is charged as an amendment rather than absorbed. A
    traveller who has booked more than the frequent-traveller threshold of packages in the last thirty-six months is offered the loyalty concession within the desk's authority and no other.
  eligibility: []
  params:
    frequent_traveller_threshold_36m: 3
    per_tier:
      Value Bundle Package:
        single_supplement_pct: =single_supplement_pct
        third_adult_discount_pct: =third_adult_discount_pct
        child_age_limit: =child_age_limit
        child_discount_pct: =child_discount_pct
        infant_age_limit: =infant_age_limit
        infant_price_usd: =infant_price_usd
        group_free_place_ratio: =group_free_place_ratio
        min_party_size: =min_party_size
        max_party_size: =max_party_size
        group_booking_min_pax: =group_booking_min_pax
