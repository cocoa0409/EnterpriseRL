name: regional_retail_bank
company: Piedmont Crescent Bank, N.A.

background: |
  Piedmont Crescent Bank, N.A. is a regional retail bank headquartered in Greensboro, North Carolina, with about 140 branches across North Carolina, South Carolina and southwestern Virginia and roughly $18.6 billion in assets.
  It serves some 410,000 consumer households and speaks to them in a plainspoken, neighborly voice, supported by a Customer Care Center that answers calls, chats and secure messages seven days a week.
  Personal Checking comes in six tiers: Access Checking, Student Checking, Everyday Checking, Interest Checking, Premier Checking and Private Client Checking.
  Savings & Money Market Accounts comprise Starter Savings, Statement Savings, Goal Builder Savings, Money Market Account, Premier Money Market and Private Client Money Market.
  Certificates of Deposit are sold as the 6-Month Certificate, 11-Month No-Penalty Certificate, 12-Month Certificate, 18-Month Bump-Up Certificate, 36-Month Certificate and 60-Month Certificate.
  Personal Credit Cards range from the Secured Visa and College Rewards Visa through the Platinum Low Rate Visa and Cash Rewards Visa to the Travel Rewards Visa Signature and the Visa Infinite Private Client.
  Auto Loans are offered as the Used Vehicle Loan, Certified Pre-Owned Vehicle Loan, Auto Refinance Loan, Lease Buyout Loan, New Vehicle Loan and Green Vehicle Loan.
  Home Mortgage Loans cover the FHA 30-Year Fixed Mortgage, VA 30-Year Fixed Mortgage, Conventional 30-Year Fixed Mortgage, Conventional 15-Year Fixed Mortgage, 7/6 SOFR Adjustable-Rate Mortgage and Jumbo 30-Year Fixed Mortgage, all serviced in-house.
  Safe Deposit Boxes are leased by size, from the 3x5 Safe Deposit Box through the 3x10, 5x10, 10x10 and 10x15 to the 10x20 Safe Deposit Box, in the vaults of six branches from Greensboro Main Office to Roanoke Market Square.
  Every product is a contract the customer holds: deposit accounts and certificates keep a running ledger of deposits, withdrawals, interest, fees and refunds; cards and loans book purchases, disbursements, payments, interest and fees against a balance owed; and box leases book annual rent, payments and service charges.
  Money moves between a customer's own holdings constantly, as automatic savings transfers, overdraft protection transfers, card and loan autopay debits, certificate interest payouts and rewards deposits all post to linked checking and savings accounts.
  Most callers are working adults and retirees in the Piedmont and Upstate who keep a checking account with a savings account, often a certificate or two, and increasingly a credit card, a car loan or a mortgage with the bank.
  They bring months or years of history with them: statement cycles full of card purchases and direct deposits, past fees and refunds, disputes they once filed, certificates that have renewed several times, and loans with a record of on-time, late or extended payments.
  A smaller share are students and young adults opening their first accounts, active-duty service members from the region's military installations, bank employees and retirees, and high-balance Private Client households with relationships across nearly every product line.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: checking_fees_overdraft_and_disputes
    claim:
      categories: [checking]
      event_types: [checking_fee, checking_fee_refund, checking_overdraft_transfer, checking_set_overdraft_election, checking_set_overdraft_link, checking_provisional_credit, checking_provisional_reversal, checking_stop_payment, checking_stop_renewal, checking_change_product, checking_close]
    summary: >
      Personal Checking customers call about money that left their accounts: overdraft and returned-item fees, monthly
      maintenance and paper statement fees, ATM and foreign transaction charges, wire and stop payment fees, and debit card,
      ATM, ACH or Zelle debits they say they did not authorize or that were wrong. Their situations vary with the tier they
      hold on the day in question (from Access Checking, which never pays into overdraft, to Private Client Checking), with
      the account's status (active, dormant, restricted or recently opened), with what else they hold at the bank (a linked
      savings account for overdraft protection, certificates and mortgage balances that count toward a relationship balance),
      with profile facts such as age, military and employee status, and with a history of earlier fees, courtesy refunds and
      disputes spread across several accounts. The records involved are the checking account, its ledger entries and their
      source-item links, stop payment and card orders, and electronic-transaction disputes, and the governing rules are
      shaped by tier-specific fee and waiver tables and daily limits (checking_evt_maintenance_and_statement_fees,
      checking_evt_overdraft_and_returned_item_fees, checking_evt_extended_overdraft_fee, checking_evt_atm_and_foreign_fees,
      checking_evt_service_fees), by courtesy refund gates on fee code, posting age, a rolling customer-wide count and account
      status alongside unlimited bank-error refunds (checking_evt_fee_refund), by ownership and status requirements for
      overdraft protection links (checking_evt_overdraft_protection_transfer), by the relationship balance basis
      (checking_agg_relationship_balance), by the paid-check and expiry rules for stop payments
      (checking_evt_stop_payment_orders), and by notice windows, business-day deadlines, dispute status and one-credit
      limits for provisional credits (checking_evt_electronic_dispute). Refunds, provisional credits and their reversals,
      fee corrections, stop payment orders and renewals, tier conversions and overdraft links are service actions the agent
      performs after verifying identity, while the debit overdraft opt-in, filing a dispute claim and confirming an account
      closure are the owner's own consent or claim and must be handed to the customer to complete. Requests that no
      checking rule decides, such as refunding another bank's ATM surcharge beyond the rebate program, temporarily raising a
      daily limit, stopping an ACH debit or an official check, or settling a charged-off deficit, can only be handed to a
      human representative as POLICY_NOT_COVERED.

  - name: savings_withdrawals_interest_and_transfers
    claim:
      categories: [savings]
      event_types: [savings_fee, savings_fee_refund, savings_withdrawal, savings_interest_credit, savings_set_automatic_transfer, savings_change_product, savings_reactivate, savings_close]
    summary: >
      Savings and money market customers call because a fee appeared after they moved money out, because the interest
      credited was lower than they expected, because an automatic transfer did or did not run, or because they want to move
      to a different savings tier, wake a dormant account or close one. Their settings differ by tier, from Starter Savings to
      Private Client Money Market, by how many accounts they hold and in what order of balance, by whether they hold a
      qualifying checking tier that earns a relationship bonus or waives the maintenance fee, by the channel of each
      withdrawal in the cycle (branch and ATM versus online, telephone, ACH, money market check, wire or an overdraft
      protection transfer from checking), and by promotional periods, goal conditions and dormancy dates recorded on the
      account. The records involved are the savings account and its ledger entries by statement cycle and interest
      component, the linked checking accounts, and savings requests, and the rules take the shape of a per-cycle counted
      withdrawal allowance with a capped excess fee (savings_evt_withdrawal_allowance), maintenance and paper statement fee
      waivers (savings_evt_maintenance_and_statement_fees), tiered versus blended interest with a fixed stacking of base,
      relationship, goal and promotional components (savings_evt_interest, savings_evt_bonus_interest,
      savings_agg_relationship_bonus_allocation), courtesy and bank-error refund gates (savings_evt_fee_refund), ownership and
      minimum-amount rules for automatic transfers (savings_evt_automatic_transfer), dormancy and verified reactivation
      (savings_evt_dormancy), and early closure and conversion rules (savings_evt_closure, savings_product_change). Refunds,
      interest corrections, tier conversions and reactivations are agent service actions once identity is verified, whereas
      setting up or changing an automatic transfer and confirming a closure are the owner's own instructions about their funds
      and are completed by the customer. Situations outside every savings rule, such as asking the bank to match a
      competitor's rate, to extend a promotional period or to treat a branch transfer differently from how its channel is
      recorded, can only be handed to a human representative as POLICY_NOT_COVERED.

  - name: cd_maturity_withdrawals_and_renewals
    claim:
      categories: [cd]
      event_types: [cd_withdrawal, cd_penalty, cd_penalty_reversal, cd_renew, cd_close, cd_update_instructions, cd_bump_rate, cd_deposit]
    summary: >
      Certificate holders call as maturity approaches or has just passed, when they need money from a certificate before
      maturity, when a penalty was taken that they did not expect, or when they want to change what happens at renewal, add
      funds or raise the rate on a bump-up certificate. The setting turns on the certificate's tier and term, from the
      6-Month Certificate through the 11-Month No-Penalty Certificate and 18-Month Bump-Up Certificate to the 60-Month
      Certificate, on its status (active, in its grace period, or closed), on the dates that anchor it (funding, term start,
      maturity and the end of grace), on how interest has been credited or paid out, on how many partial withdrawals or
      add-ons have already been made this term, and on whether the customer holds a qualifying checking tier or a jumbo
      balance that shaped the rate. The records involved are the certificate, its ledger of deposits, interest, withdrawals,
      penalties and reversals, the payout accounts in checking and savings, and certificate requests, and the rules are an
      ordered classification of withdrawal kinds with tier-specific penalty days, a minimum penalty in the days after funding
      and partial-withdrawal limits (cd_evt_early_withdrawal), a grace window for penalty-free actions and automatic renewal
      into a target tier (cd_evt_maturity_and_grace), rate composition with stacked bonuses re-evaluated at renewal
      (cd_rate_and_bonuses), one bump-up per term within a window (cd_bump_up), in-term add-on limits (cd_evt_term_add_on),
      payout-account requirements (cd_instructions) and full reversal of penalties assessed in error (cd_evt_penalty_reversal).
      The agent records instruction changes, bump-ups, renewals and penalty reversals, while any withdrawal of principal before
      or at maturity is the owner's own disposal of their funds, registered as a request that the owner must confirm.
      Requests no certificate rule decides, such as waiving a correctly assessed penalty as a courtesy, applying a rate that
      was never published for the term, or releasing funds on a claimed death that estate services have not confirmed, can
      only be handed to a human representative as POLICY_NOT_COVERED.

  - name: card_billing_payments_and_disputes
    claim:
      categories: [card]
      event_types: [card_fee, card_fee_reversal, card_interest_reversal, card_dispute_credit, card_dispute_rebill, card_rewards_redeem, card_change_limit, card_set_autopay, card_reprice, card_close]
    summary: >
      Credit cardholders call about their statements: a late fee after a payment they believe was on time, interest billed
      after they paid in full, a returned payment, a charge they want to dispute, rewards they want to redeem, a higher or
      lower credit limit, autopay, a penalty APR or the military rate cap, or closing the card. The setting varies with the
      card held, from the Secured Visa to the Visa Infinite Private Client, with the account's status and days past due, with
      statement dates, due dates and the timing of each payment against the cutoff, with a customer's other PCB cards and
      Private Client Checking relationship that bear on combined credit lines and eligibility, with profile facts such as
      military status, and with a history of prior late fees, courtesy reversals, on-time payments and disputes. The records
      involved are the card account with its statement snapshot, its ledger of charges, fees, interest, payments, credits and
      points, billing disputes and card requests, and the rules comprise a first-versus-repeat late fee capped at the missed
      minimum and exclusive of a returned payment fee (card_evt_late_and_returned_payment_fees), courtesy and bank-error fee
      reversal gates (card_evt_fee_reversal), grace-period and residual interest rules (card_evt_interest), payment crediting
      and CARD Act allocation (card_evt_payments), penalty APR and military rate cap repricing
      (card_evt_penalty_and_military_rates), statement-dated dispute windows with one temporary credit and status-gated rebills
      (card_evt_billing_disputes), rewards earning, redemption and forfeiture (card_evt_rewards), and credit limit changes
      bounded by account age, spacing and a combined cap (card_evt_credit_limit_changes, card_agg_combined_credit_lines). The
      agent posts reversals, temporary credits, rebills, repricing and permitted limit changes, while raising a billing
      dispute, consenting to a credit inquiry, setting autopay and confirming a closure are the cardholder's own claims and
      instructions that the cardholder must complete. Hardship payment plans, settlement of a charged-off balance, goodwill
      reversal of interest beyond the residual-interest courtesy, or disputes about another issuer's card fall outside every
      card rule and can only be handed to a human representative as POLICY_NOT_COVERED.

  - name: auto_loan_payment_servicing
    claim:
      categories: [auto]
      event_types: [auto_payment, auto_fee, auto_fee_waiver, auto_extend, auto_change_due_date, auto_set_autopay, auto_cancel_gap, auto_gap_refund, auto_release_lien]
    summary: >
      Auto loan borrowers call about paying their loan: how a payment was split between fees, interest and principal, a late
      charge they think is wrong, a payment they cannot make this month, moving their due date, enrolling in or cancelling
      autopay, paying the loan off, cancelling GAP coverage, or when their title will be released. The setting depends on the
      loan product, from the Used Vehicle Loan to the Green Vehicle Loan, on the loan's status and days past due, on its age
      and the installments already satisfied, on the borrower's state of residence, which sets the grace days, percentage and
      cap of the late charge, on the extensions and due date changes already used, on the discounts built into the APR by
      autopay and a qualifying checking relationship, and on GAP coverage and the funding date that anchors its refund. The
      records involved are the loan with its schedule and quantities, its ledger of disbursement, payments with their
      portions, fees, fee settlements, waivers, reversals and GAP refunds, the paying checking account, and loan requests,
      and the rules are daily simple interest with a fixed allocation order and no early satisfaction of later installments
      (auto_evt_payment_allocation), state-specific late charges with one per installment (auto_evt_late_charge), courtesy and
      bank-error waivers (auto_evt_fee_waiver), extension gates on loan age, payments made, delinquency and rolling and
      lifetime counts (auto_evt_payment_extension), a once-per-window due date change within a maximum shift
      (auto_due_date_change), autopay discount changes bounded by a cap and floor (auto_evt_autopay,
      auto_agg_relationship_discount), payoff amounts and lien release deadlines (auto_evt_payoff_and_lien) and full or
      prorated GAP refunds (auto_evt_gap_refund). Waivers, due date changes, payoff posting and lien releases are agent
      service actions, while a payment extension is the borrower's signed modification of terms and autopay enrollment and
      GAP cancellation are the borrower's own instructions, all completed by the borrower. Requests no auto loan rule decides,
      such as lowering the rate on an existing loan, deferring more installments than an extension allows, stopping a
      repossession or settling a charged-off balance, can only be handed to a human representative as POLICY_NOT_COVERED.
