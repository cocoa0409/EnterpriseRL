events:
  # ---------------- holding writes (auto_loans) ----------------
  - type: auto_apply
    target: auto_loans
    mutation: create
    meaning: "An auto loan application is recorded for one loan product and vehicle."
    grain: "One row per application."
    fields:
      customer_id: "The applicant and borrower."
      variant_name: "Official loan product applied for."
      status: "Always applied at creation."
      opened_date: "Application date."
      vehicle_vin: "17-character vehicle identification number as stated on the purchase or lease documents."
      vehicle_year: "Model year of the vehicle."
      vehicle_make_model: "Make and model as stated on the title or buyer's order."
      term_months: "Term chosen from the product's term options."
      original_principal: "Amount requested to be financed, including any GAP charge."
      gap_coverage: "Whether GAP waiver coverage is included."
      gap_premium: "GAP charge financed, 0.00 when not included."
      principal_balance: "Always 0.00 at creation."
      fees_due: "Always 0.00 at creation."
    triggers: []
  - type: auto_fund
    target: auto_loans
    mutation: {transition: {from: applied, to: active}}
    meaning: "The approved loan is funded and the repayment schedule fixed."
    grain: "One row per loan funded."
    fields:
      status: "Set to active."
      funded_date: "Date the loan funded; interest accrues from this date."
      loan_number_last4: "Last four digits of the loan number."
      credit_grade: "Credit grade assigned by underwriting."
      interest_rate: "APR after grade adder and discounts, not below the floor."
      rate_discounts: "Discounts included in the APR."
      monthly_payment: "Fixed installment amount."
      payment_due_day: "Day of month installments are due."
      next_payment_due_date: "First installment due date."
      maturity_date: "Due date of the final scheduled installment."
      last_payment_date: "Set to the funding date."
      lien_status: "Set to perfected."
    triggers:
      - event: "auto:auto_disbursement"
        map: {posted_date: funded_date}
  - type: auto_withdraw
    target: auto_loans
    mutation: {transition: {from: applied, to: withdrawn}}
    meaning: "The application is declined, withdrawn or lapses unfunded."
    grain: "One row per application ended without funding."
    fields:
      status: "Set to withdrawn."
      closed_date: "Date the application ended."
    triggers: []
  - type: auto_become_delinquent
    target: auto_loans
    mutation: {transition: {from: active, to: delinquent}}
    meaning: "The loan becomes delinquent."
    grain: "One row per delinquency episode."
    fields:
      status: "Set to delinquent."
    triggers: []
  - type: auto_cure
    target: auto_loans
    mutation: {transition: {from: delinquent, to: active}}
    meaning: "A delinquent loan is brought current."
    grain: "One row per cure."
    fields:
      status: "Set to active."
      days_past_due: "Reset to 0."
    triggers: []
  - type: auto_charge_off
    target: auto_loans
    mutation: {transition: {from: delinquent, to: charged_off}}
    meaning: "The remaining principal of a seriously delinquent loan is charged off."
    grain: "One row per charge-off."
    fields:
      status: "Set to charged_off."
      closed_date: "Charge-off date."
    triggers:
      - event: "auto:auto_chargeoff_writeoff"
        map: {posted_date: closed_date}
  - type: auto_pay_off
    target: auto_loans
    mutation: {transition: [{from: active, to: paid_off}, {from: delinquent, to: paid_off}]}
    meaning: "The loan is paid in full and closed; the lien release is started."
    grain: "One row per payoff."
    fields:
      status: "Set to paid_off."
      closed_date: "Date the payoff posted."
      lien_status: "Set to release_pending."
    triggers: []
  - type: auto_release_lien
    target: auto_loans
    mutation: update
    meaning: "The lien on a paid-off vehicle is released to the borrower or the state motor vehicle agency."
    grain: "One row per lien release."
    fields:
      lien_status: "Set to released."
      lien_release_date: "Date the release was sent."
    triggers: []
  - type: auto_change_due_date
    target: auto_loans
    mutation: update
    meaning: "The borrower's monthly due day is moved."
    grain: "One row per due date change."
    fields:
      payment_due_day: "New due day."
      next_payment_due_date: "Next installment due date on the new day."
      last_due_date_change_date: "Date of this change."
    triggers: []
  - type: auto_extend
    target: auto_loans
    mutation: update
    meaning: "One or more installments are deferred to the end of the loan."
    grain: "One row per extension granted."
    fields:
      next_payment_due_date: "Next due date moved forward by the number of deferred installments."
      maturity_date: "Maturity moved out by the same number of months."
      extensions_used_lifetime: "Previous value plus one."
      last_extension_date: "Date the extension was granted."
    triggers:
      - event: "auto:auto_fee"
        map: {fee_code: extension}
  - type: auto_set_autopay
    target: auto_loans
    mutation: update
    meaning: "Automatic payment from a PCB checking account is enrolled or cancelled, with the matching APR change."
    grain: "One row per autopay change."
    fields:
      autopay_enrolled: "Whether autopay is now enrolled."
      autopay_source_account_id: "The PCB checking account debited, or empty."
      interest_rate: "APR after the autopay discount is added or removed."
      rate_discounts: "Discounts now included in the APR."
    triggers: []
  - type: auto_cancel_gap
    target: auto_loans
    mutation: update
    meaning: "The borrower cancels GAP waiver coverage."
    grain: "One row per GAP cancellation."
    fields:
      gap_coverage: "Set to false."
      gap_cancellation_date: "Date of the cancellation."
    triggers: []
  # ---------------- ledger writes (auto_transactions) ----------------
  - type: auto_disbursement
    target: auto_transactions
    meaning: "The loan proceeds are paid to the dealer, lessor or prior lender, creating the principal balance."
    grain: "One row per loan funding."
    distinguish_by: [posted_date]
    fields:
      amount: "Amount financed, positive."
      posted_date: "Funding date."
      reference_number: "Funding reference number."
    account: auto_principal
    direction: in
    triggers: []
  - type: auto_payment
    target: auto_transactions
    meaning: "A borrower payment posts and is allocated to fees, interest and principal."
    grain: "One row per payment, identified by its payment reference number."
    distinguish_by: [reference_number]
    fields:
      amount: "Total payment, positive; equals fees_portion plus interest_portion plus principal_portion."
      posted_date: "Business day the payment was credited."
      payment_channel: "How the payment was made."
      payment_type: "scheduled, principal_only or payoff."
      fees_portion: "Part applied to fees due."
      interest_portion: "Part applied to accrued interest."
      principal_portion: "Part applied to principal; this is the amount booked to the principal account."
      installment_due_date: "The installment due date this payment is credited toward; empty for principal-only payments."
      reference_number: "Payment reference number."
      counterparty_account_id: "The PCB account paying, otherwise empty."
    account: auto_principal
    direction: out
    triggers:
      - event: "auto:auto_fee_settlement"
        when: {fees_portion: {not: 0.00}}
        map: {amount: fees_portion, source_item_id: auto_txn_id, posted_date: posted_date}
      - event: "auto:auto_pay_off"
        when: {payment_type: payoff}
        map: {closed_date: posted_date}
      - event: "checking:checking_debit"
        when: {payment_channel: [autopay_pcb, pcb_transfer]}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: auto_loan_id}
  - type: auto_fee
    target: auto_transactions
    meaning: "A late charge, extension fee or returned payment fee is assessed, or fees paid by a returned payment become due again."
    grain: "One row per fee: per late installment, per extension, per returned payment."
    distinguish_by: [fee_code, installment_due_date, source_item_id, posted_date]
    fields:
      amount: "Fee amount, positive."
      posted_date: "Date assessed."
      fee_code: "late_charge, extension, returned_payment, or settlement_reversal for fees that become due again when the payment that paid them is returned."
      installment_due_date: "For a late charge, the installment that was late; otherwise empty."
      source_item_id: "For a returned payment fee or settlement reversal, the returned payment; otherwise empty."
    account: auto_fees_due
    direction: in
    triggers: []
  - type: auto_fee_settlement
    target: auto_transactions
    meaning: "The fee portion of a payment reduces fees due."
    grain: "One row per payment that paid fees."
    distinguish_by: [source_item_id]
    fields:
      amount: "Fees paid, positive."
      posted_date: "Payment date."
      source_item_id: "The payment."
    account: auto_fees_due
    direction: out
    triggers: []
  - type: auto_fee_waiver
    target: auto_transactions
    meaning: "An unpaid or paid fee is waived in full."
    grain: "One row per fee waived."
    distinguish_by: [source_item_id]
    fields:
      amount: "Amount waived, equal to the fee."
      posted_date: "Date waived."
      fee_code: "Fee code of the waived fee."
      source_item_id: "The fee waived."
      adjustment_reason: "courtesy_waiver or bank_error."
    account: auto_fees_due
    direction: out
    triggers: []
  - type: auto_payment_reversal
    target: auto_transactions
    meaning: "A payment is returned unpaid and its principal credit is reversed."
    grain: "One row per returned payment."
    distinguish_by: [source_item_id]
    fields:
      amount: "The returned payment's principal_portion, restored to principal."
      posted_date: "Date the return posted."
      source_item_id: "The returned payment."
    account: auto_principal
    direction: in
    triggers:
      - event: "auto:auto_fee"
        map: {fee_code: returned_payment, source_item_id: auto_txn_id, posted_date: posted_date}
  - type: auto_chargeoff_writeoff
    target: auto_transactions
    meaning: "The remaining principal of a charged-off loan is written off."
    grain: "One row per charge-off."
    distinguish_by: [posted_date]
    fields:
      amount: "Principal written off, positive."
      posted_date: "Charge-off date."
    account: auto_principal
    direction: out
    triggers: []
  - type: auto_gap_refund
    target: auto_transactions
    meaning: "Part or all of the GAP charge is refunded after cancellation or early payoff."
    grain: "One row per GAP refund."
    distinguish_by: [posted_date]
    fields:
      amount: "Refund amount, positive."
      posted_date: "Date of the refund."
      refund_destination: "checking or official_check."
      counterparty_account_id: "The PCB checking account credited, otherwise empty."
    triggers:
      - event: "checking:checking_deposit"
        when: {refund_destination: checking}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: auto_loan_id}

measures:
  - id: auto_msr_accrued_interest
    window: "From last_payment_date (exclusive) through the measurement date (inclusive), in calendar days."
    measure: "principal_balance times interest_rate divided by 100, divided by interest_day_count_basis, times the number of days, unrounded until use and then rounded half-up to the cent."
  - id: auto_msr_on_time_streak
    window: "Installments counted backward from the most recent due date before the measurement date."
    measure: "Number of consecutive installments, most recent first, for which scheduled payments credited toward that installment_due_date totalled at least monthly_payment within the state grace days; stops at the first installment that fails."
  - id: auto_msr_extensions_365d
    window: "Rolling 365 calendar days ending on the frozen date, inclusive."
    measure: "Count of auto_fee rows with fee_code extension on the loan."
  - id: auto_msr_late_charge_courtesy_365d
    window: "Rolling 365 calendar days ending on the frozen date, inclusive."
    measure: "Count of auto_fee_waiver rows with fee_code late_charge and adjustment_reason courtesy_waiver on all of the customer's auto loans."
  - id: auto_msr_installments_paid
    window: "From funded_date through the frozen date."
    measure: "Count of distinct installment_due_date values fully satisfied by scheduled payments."
  - id: auto_msr_customer_exposure
    window: "The frozen date."
    measure: "Sum of principal_balance over the customer's auto loans in active or delinquent status plus original_principal of loans in applied status."

policies:
  - id: auto_agg_multi_holding
    subject: [auto_apply]
    rule: >-
      A customer may carry several auto loans. The count of the customer's auto loans in applied, active or delinquent
      status must be below max_per_customer before a new application is recorded. The count of the customer's loans of
      the requested product in applied, active or delinquent status must be below max_loans_this_tier. A customer with
      any auto loan in charged_off status cannot apply. Paid-off and withdrawn loans do not count.
    eligibility:
      - id: portfolio_cap
        applies_to: [auto_apply]
        kind: authorization
        condition: "The count of the customer's auto loans in applied, active or delinquent status must be below max_per_customer before a new application is recorded."
        evidence_fields: [auto_loans.customer_id, auto_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.customer_id]]
          action_bindings: {auto_loans.customer_id: customer_id}
      - id: no_charge_off
        applies_to: [auto_apply]
        kind: authorization
        condition: "A customer with any auto loan in charged_off status cannot apply."
        evidence_fields: [auto_loans.customer_id, auto_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.customer_id]]
          action_bindings: {auto_loans.customer_id: customer_id}
    params:
      max_per_customer: 3
      per_tier:
        Used Vehicle Loan: {tier_cap: "=max_loans_this_tier"}
        Certified Pre-Owned Vehicle Loan: {tier_cap: "=max_loans_this_tier"}
        Auto Refinance Loan: {tier_cap: "=max_loans_this_tier"}
        Lease Buyout Loan: {tier_cap: "=max_loans_this_tier"}
        New Vehicle Loan: {tier_cap: "=max_loans_this_tier"}
        Green Vehicle Loan: {tier_cap: "=max_loans_this_tier"}

  - id: auto_agg_customer_exposure
    subject: [auto_apply, auto_fund]
    rule: >-
      Auto lending is aggregated per borrower. The customer's auto exposure, measured by auto_msr_customer_exposure plus the
      amount requested, must not exceed combined_auto_exposure_cap. Exposure counts principal on active and delinquent
      loans and the requested amount on pending applications; paid-off loans never count. Discounts, rates and fees are
      always judged per loan and never on combined balances.
    eligibility:
      - id: exposure_cap
        applies_to: [auto_apply, auto_fund]
        kind: authorization
        condition: "The customer's auto exposure, measured by auto_msr_customer_exposure plus the amount requested, must not exceed combined_auto_exposure_cap."
        evidence_fields: [auto_loans.customer_id, auto_loans.principal_balance, auto_loans.original_principal, auto_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.customer_id]]
          action_bindings: {auto_loans.customer_id: customer_id}
    params:
      combined_auto_exposure_cap: 175000.00
    measures: [auto_msr_customer_exposure]

  - id: auto_application_and_funding
    subject: [auto_apply, auto_fund, auto_withdraw, auto_disbursement]
    rule: >-
      The applicant's age in whole years on the application date, from the date of birth on the customer profile, must be
      at least age_min_to_apply. The vehicle and amount must fit the product: the amount financed between min_loan_amount
      and max_loan_amount and no more than max_ltv_pct percent of the vehicle value, the vehicle no older than
      max_vehicle_age_years and no more than max_vehicle_mileage miles, its powertrain in eligible_powertrains, and the
      term one of term_options_months. Approval, the credit grade and funding are underwriting decisions made by the credit
      system; the grade must be one of eligible_credit_grades. The APR is fixed at funding: base_apr_by_term for the chosen
      term plus credit_grade_apr_adders for the grade, minus autopay_discount_pct when autopay from a PCB checking account
      is enrolled at funding and minus relationship_discount_pct when auto_agg_relationship_discount grants it, the
      discounts together never exceeding max_total_discount_pct and never taking the APR below apr_floor. The monthly
      payment is the level installment that repays the amount financed over the term at the APR. The first due date is no
      more than first_payment_max_days calendar days after funding. An approved loan not funded is withdrawn once
      funding_window_days calendar days have passed after the application was recorded. Count calendar days with the day
      after opened_date as day 1; the application lapses when the frozen date is on or after opened_date plus
      funding_window_days. Funding posts one auto_disbursement of the amount financed, including any GAP charge.
    eligibility:
      - id: age_gate
        applies_to: [auto_apply]
        kind: authorization
        condition: "The applicant's age in whole years on the application date, from the date of birth on the customer profile, must be at least age_min_to_apply."
        evidence_fields: [customers.customer_id, customers.date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
      - id: funding_lapse
        applies_to: [auto_withdraw]
        kind: time
        condition: "An approved loan not funded is withdrawn once funding_window_days calendar days have passed after the application was recorded."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the application was recorded"
          anchor_source: auto_loans.opened_date
          relation: not_before
          duration_source: variants.funding_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after opened_date as day 1; the application lapses when the frozen date is on or after opened_date plus funding_window_days."
          boundary: inclusive
    formula:
      funded_apr: "max(apr_floor, base_apr_by_term + credit_grade_apr_adders - min(max_total_discount_pct, autopay_discount_pct + relationship_discount_pct))"
    params:
      per_tier:
        Used Vehicle Loan: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", vehicle_age: "=max_vehicle_age_years", mileage: "=max_vehicle_mileage", terms: "=term_options_months", base: "=base_apr_by_term", adders: "=credit_grade_apr_adders", floor: "=apr_floor", grades: "=eligible_credit_grades"}
        Certified Pre-Owned Vehicle Loan: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", vehicle_age: "=max_vehicle_age_years", mileage: "=max_vehicle_mileage", terms: "=term_options_months", base: "=base_apr_by_term", adders: "=credit_grade_apr_adders", floor: "=apr_floor", grades: "=eligible_credit_grades"}
        Auto Refinance Loan: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", vehicle_age: "=max_vehicle_age_years", mileage: "=max_vehicle_mileage", terms: "=term_options_months", base: "=base_apr_by_term", adders: "=credit_grade_apr_adders", floor: "=apr_floor", grades: "=eligible_credit_grades"}
        Lease Buyout Loan: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", vehicle_age: "=max_vehicle_age_years", mileage: "=max_vehicle_mileage", terms: "=term_options_months", base: "=base_apr_by_term", adders: "=credit_grade_apr_adders", floor: "=apr_floor", grades: "=eligible_credit_grades"}
        New Vehicle Loan: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", vehicle_age: "=max_vehicle_age_years", mileage: "=max_vehicle_mileage", terms: "=term_options_months", base: "=base_apr_by_term", adders: "=credit_grade_apr_adders", floor: "=apr_floor", grades: "=eligible_credit_grades"}
        Green Vehicle Loan: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", vehicle_age: "=max_vehicle_age_years", mileage: "=max_vehicle_mileage", terms: "=term_options_months", base: "=base_apr_by_term", adders: "=credit_grade_apr_adders", floor: "=apr_floor", grades: "=eligible_credit_grades"}

  - id: auto_agg_relationship_discount
    subject: [auto_fund, auto_set_autopay]
    rule: >-
      The relationship discount of relationship_discount_pct is granted at funding when the borrower holds, on the funding
      date, an active checking account of a tier in relationship_qualifying_checking_tiers. It is fixed for the life of the
      loan once granted and is not added later if the qualifying account is opened after funding, nor removed if it later
      closes. The autopay discount and the relationship discount stack by simple addition up to max_total_discount_pct and
      never below apr_floor; any part of a discount cut off by the cap or floor is lost, not carried over. When autopay is
      cancelled and autopay_discount_removed_on_cancel is true, the APR rises by the autopay discount actually applied, and
      re-enrolling later restores it; the relationship discount is unaffected by autopay changes.
    eligibility:
      - id: qualifying_checking_at_funding
        applies_to: [auto_fund]
        kind: authorization
        condition: "The relationship discount of relationship_discount_pct is granted at funding when the borrower holds, on the funding date, an active checking account of a tier in relationship_qualifying_checking_tiers."
        evidence_fields: [checking_accounts.customer_id, checking_accounts.variant_name, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.customer_id]]
          action_bindings: {checking_accounts.customer_id: customer_id}
    params:
      per_tier:
        Used Vehicle Loan: {autopay: "=autopay_discount_pct", relationship: "=relationship_discount_pct", cap: "=max_total_discount_pct", floor: "=apr_floor", qualifying: "=relationship_qualifying_checking_tiers"}
        Certified Pre-Owned Vehicle Loan: {autopay: "=autopay_discount_pct", relationship: "=relationship_discount_pct", cap: "=max_total_discount_pct", floor: "=apr_floor", qualifying: "=relationship_qualifying_checking_tiers"}
        Auto Refinance Loan: {autopay: "=autopay_discount_pct", relationship: "=relationship_discount_pct", cap: "=max_total_discount_pct", floor: "=apr_floor", qualifying: "=relationship_qualifying_checking_tiers"}
        Lease Buyout Loan: {autopay: "=autopay_discount_pct", relationship: "=relationship_discount_pct", cap: "=max_total_discount_pct", floor: "=apr_floor", qualifying: "=relationship_qualifying_checking_tiers"}
        New Vehicle Loan: {autopay: "=autopay_discount_pct", relationship: "=relationship_discount_pct", cap: "=max_total_discount_pct", floor: "=apr_floor", qualifying: "=relationship_qualifying_checking_tiers"}
        Green Vehicle Loan: {autopay: "=autopay_discount_pct", relationship: "=relationship_discount_pct", cap: "=max_total_discount_pct", floor: "=apr_floor", qualifying: "=relationship_qualifying_checking_tiers"}

  - id: auto_evt_payment_allocation
    subject: [auto_payment, auto_fee_settlement]
    rule: >-
      Auto loans accrue daily simple interest: interest owed at any moment is auto_msr_accrued_interest, computed on the
      principal balance from last_payment_date. A payment received by payment_cutoff_time Eastern Time on a business day is
      credited that day, otherwise on the next business day. Payments post only to a loan whose status is active or
      delinquent. Each payment is applied in payment_allocation_order: first to fees_due, then to interest accrued through
      the credit date, then to principal; the fees part also writes an auto_fee_settlement row through its trigger, and
      last_payment_date becomes the credit date. A scheduled installment is satisfied when scheduled payments credited
      toward its installment_due_date total at least monthly_payment; next_payment_due_date then advances one month to the
      payment_due_day, and because overpayment_advances_due_date is false a payment larger than one installment reduces
      principal but never satisfies a later installment early. A principal-only payment, allowed where
      principal_only_payment_allowed is true and at least principal_only_min_amount, skips fees and interest and applies
      wholly to principal, but only when no installment is past due; otherwise it is applied as a scheduled payment. No
      prepayment penalty applies, since prepayment_penalty_pct is 0.00. Payments from a PCB checking account debit that
      account through the payment's trigger.
    eligibility:
      - id: loan_open
        applies_to: [auto_payment]
        kind: state
        condition: "Payments post only to a loan whose status is active or delinquent."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
        state_contract:
          field: auto_loans.status
          allowed: [active, delinquent]
    formula:
      interest_due: "auto_msr_accrued_interest"
      principal_applied: "max(0, amount - fees_due - auto_msr_accrued_interest)"
    params:
      payment_cutoff_time: "17:00"
      per_tier:
        Used Vehicle Loan: {order: "=payment_allocation_order", advances: "=overpayment_advances_due_date", principal_only: "=principal_only_payment_allowed", principal_only_min: "=principal_only_min_amount", basis: "=interest_day_count_basis", prepay_pct: "=prepayment_penalty_pct"}
        Certified Pre-Owned Vehicle Loan: {order: "=payment_allocation_order", advances: "=overpayment_advances_due_date", principal_only: "=principal_only_payment_allowed", principal_only_min: "=principal_only_min_amount", basis: "=interest_day_count_basis", prepay_pct: "=prepayment_penalty_pct"}
        Auto Refinance Loan: {order: "=payment_allocation_order", advances: "=overpayment_advances_due_date", principal_only: "=principal_only_payment_allowed", principal_only_min: "=principal_only_min_amount", basis: "=interest_day_count_basis", prepay_pct: "=prepayment_penalty_pct"}
        Lease Buyout Loan: {order: "=payment_allocation_order", advances: "=overpayment_advances_due_date", principal_only: "=principal_only_payment_allowed", principal_only_min: "=principal_only_min_amount", basis: "=interest_day_count_basis", prepay_pct: "=prepayment_penalty_pct"}
        New Vehicle Loan: {order: "=payment_allocation_order", advances: "=overpayment_advances_due_date", principal_only: "=principal_only_payment_allowed", principal_only_min: "=principal_only_min_amount", basis: "=interest_day_count_basis", prepay_pct: "=prepayment_penalty_pct"}
        Green Vehicle Loan: {order: "=payment_allocation_order", advances: "=overpayment_advances_due_date", principal_only: "=principal_only_payment_allowed", principal_only_min: "=principal_only_min_amount", basis: "=interest_day_count_basis", prepay_pct: "=prepayment_penalty_pct"}
    measures: [auto_msr_accrued_interest]

  - id: auto_evt_late_charge
    subject: [auto_fee]
    rule: >-
      The late charge follows the borrower's state_of_residence on the customer profile on the installment's due date. A
      late charge applies to an installment not satisfied within late_charge_grace_days_by_state calendar days after its
      due date. Count calendar days with the day after installment_due_date as day 1; the charge applies when the frozen
      date is after installment_due_date plus the state's grace days and the installment is still unsatisfied at the end of
      that last grace day. The charge equals late_charge_pct_by_state percent of monthly_payment, rounded half-up to the
      cent, capped at late_charge_cap_by_state, and is written as fee_code late_charge with that installment_due_date and
      posted_date the first day after grace. Each installment carries at most one late charge. No late charge applies to an
      installment deferred by an extension, to the fee portion of a payment, or to a loan that is charged off or paid off.
      Late charges are recorded in fees_due and paid first from later payments.
    eligibility:
      - id: grace_elapsed
        applies_to: [auto_fee]
        kind: time
        condition: "A late charge applies to an installment not satisfied within late_charge_grace_days_by_state calendar days after its due date."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.next_payment_due_date, customers.state_of_residence]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "its due date"
          anchor_source: auto_loans.next_payment_due_date
          relation: not_before
          duration_source: variants.late_charge_grace_days_by_state
          unit: calendar_days
          counting_rule: "Count calendar days with the day after installment_due_date as day 1; the charge applies when the frozen date is after installment_due_date plus the state's grace days and the installment is still unsatisfied at the end of that last grace day."
          boundary: exclusive
      - id: one_per_installment
        applies_to: [auto_fee]
        kind: dedup
        condition: "Each installment carries at most one late charge."
        evidence_fields: [auto_transactions.auto_loan_id, auto_transactions.installment_due_date, auto_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_transactions.auto_loan_id, auto_transactions.installment_due_date]]
          action_bindings: {auto_transactions.auto_loan_id: auto_loan_id, auto_transactions.installment_due_date: installment_due_date}
        dedup_contract:
          table: auto_transactions
          mode: separate_record
          object_bindings: {auto_loan_id: auto_loan_id, installment_due_date: installment_due_date}
          duplicate_filters: {event_type: [auto_fee], fee_code: [late_charge]}
          distinct_fields: []
    formula:
      late_charge: "min(late_charge_cap_by_state, round(monthly_payment * late_charge_pct_by_state / 100, 2))"
    params:
      per_tier:
        Used Vehicle Loan: {grace: "=late_charge_grace_days_by_state", pct: "=late_charge_pct_by_state", cap: "=late_charge_cap_by_state"}
        Certified Pre-Owned Vehicle Loan: {grace: "=late_charge_grace_days_by_state", pct: "=late_charge_pct_by_state", cap: "=late_charge_cap_by_state"}
        Auto Refinance Loan: {grace: "=late_charge_grace_days_by_state", pct: "=late_charge_pct_by_state", cap: "=late_charge_cap_by_state"}
        Lease Buyout Loan: {grace: "=late_charge_grace_days_by_state", pct: "=late_charge_pct_by_state", cap: "=late_charge_cap_by_state"}
        New Vehicle Loan: {grace: "=late_charge_grace_days_by_state", pct: "=late_charge_pct_by_state", cap: "=late_charge_cap_by_state"}
        Green Vehicle Loan: {grace: "=late_charge_grace_days_by_state", pct: "=late_charge_pct_by_state", cap: "=late_charge_cap_by_state"}

  - id: auto_evt_fee_waiver
    subject: [auto_fee_waiver]
    rule: >-
      A fee is waived in full, never in part, as one auto_fee_waiver row whose source_item_id is the fee. A bank_error
      waiver applies to any fee assessed contrary to this charter, such as a late charge on an installment satisfied within
      the state grace days, above the state cap or percentage, on a deferred installment, or twice for one installment; it
      has no limit. A courtesy_waiver applies only to a late_charge. The customer's courtesy late charge waivers in the
      rolling 365 days, counted by auto_msr_late_charge_courtesy_365d across all of the customer's auto loans, must be below
      late_charge_courtesy_waivers_365d. The installments immediately before the late one must show at least
      late_charge_courtesy_min_on_time consecutive on-time installments by auto_msr_on_time_streak. The loan must be active
      or delinquent when a courtesy waiver is granted. A fee can be waived at most once. A waived fee that was already paid
      from a payment is returned by applying the waived amount to principal on the waiver date, recorded by the same waiver
      row; extension and returned payment fees are never waived as a courtesy.
    eligibility:
      - id: courtesy_count
        applies_to: [auto_fee_waiver]
        kind: authorization
        condition: "The customer's courtesy late charge waivers in the rolling 365 days, counted by auto_msr_late_charge_courtesy_365d across all of the customer's auto loans, must be below late_charge_courtesy_waivers_365d."
        evidence_fields: [auto_transactions.customer_id, auto_transactions.adjustment_reason, auto_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_transactions.customer_id]]
          action_bindings: {auto_transactions.customer_id: customer_id}
      - id: on_time_before
        applies_to: [auto_fee_waiver]
        kind: authorization
        condition: "The installments immediately before the late one must show at least late_charge_courtesy_min_on_time consecutive on-time installments by auto_msr_on_time_streak."
        evidence_fields: [auto_transactions.auto_loan_id, auto_transactions.installment_due_date, auto_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_transactions.auto_loan_id]]
          action_bindings: {auto_transactions.auto_loan_id: auto_loan_id}
      - id: loan_open_for_courtesy
        applies_to: [auto_fee_waiver]
        kind: state
        condition: "The loan must be active or delinquent when a courtesy waiver is granted."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
        state_contract:
          field: auto_loans.status
          allowed: [active, delinquent]
      - id: waive_once
        applies_to: [auto_fee_waiver]
        kind: dedup
        condition: "A fee can be waived at most once."
        evidence_fields: [auto_transactions.source_item_id, auto_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_transactions.source_item_id]]
          action_bindings: {auto_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: auto_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [auto_fee_waiver]}
          distinct_fields: []
    params:
      per_tier:
        Used Vehicle Loan: {courtesy: "=late_charge_courtesy_waivers_365d", on_time: "=late_charge_courtesy_min_on_time"}
        Certified Pre-Owned Vehicle Loan: {courtesy: "=late_charge_courtesy_waivers_365d", on_time: "=late_charge_courtesy_min_on_time"}
        Auto Refinance Loan: {courtesy: "=late_charge_courtesy_waivers_365d", on_time: "=late_charge_courtesy_min_on_time"}
        Lease Buyout Loan: {courtesy: "=late_charge_courtesy_waivers_365d", on_time: "=late_charge_courtesy_min_on_time"}
        New Vehicle Loan: {courtesy: "=late_charge_courtesy_waivers_365d", on_time: "=late_charge_courtesy_min_on_time"}
        Green Vehicle Loan: {courtesy: "=late_charge_courtesy_waivers_365d", on_time: "=late_charge_courtesy_min_on_time"}
    measures: [auto_msr_late_charge_courtesy_365d, auto_msr_on_time_streak]

  - id: auto_evt_payment_extension
    subject: [auto_extend, auto_fee]
    rule: >-
      A payment extension defers one or up to max_months_per_extension installments to the end of the loan and is the
      borrower's own agreement to modified terms: the agent registers an auto_requests row of request_type
      payment_extension in pending_customer_confirmation status, and the extension is granted only after the borrower
      signs. The loan must be active or delinquent by no more than extension_max_days_past_due days on the day it is
      granted. The loan must have been funded at least extension_min_loan_age_months whole months before the extension is
      granted. Count calendar months from funded_date; the extension is allowed when the frozen date is on or after
      funded_date plus extension_min_loan_age_months calendar months. At least extension_min_payments_made installments
      must have been satisfied by auto_msr_installments_paid. Extensions granted in the rolling 365 days, counted by
      auto_msr_extensions_365d, must be below extensions_max_per_12_months, and extensions_used_lifetime must be below
      extensions_max_lifetime. When granted, next_payment_due_date and maturity_date each move forward by the number of
      deferred installments, interest keeps accruing daily on principal throughout, any unpaid late charges stay due, and
      the extension_fee is assessed as fee_code extension through the extension's trigger. An extension cannot turn a
      delinquent loan current by itself unless the deferred installments are exactly the past-due ones. Requests for
      longer deferrals, rate reductions or principal forgiveness are outside this policy.
    eligibility:
      - id: loan_age
        applies_to: [auto_extend]
        kind: time
        condition: "The loan must have been funded at least extension_min_loan_age_months whole months before the extension is granted."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.funded_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "The loan must have been funded"
          anchor_source: auto_loans.funded_date
          relation: not_before
          duration_source: variants.extension_min_loan_age_months
          unit: calendar_months
          counting_rule: "Count calendar months from funded_date; the extension is allowed when the frozen date is on or after funded_date plus extension_min_loan_age_months calendar months."
          boundary: inclusive
      - id: delinquency_limit
        applies_to: [auto_extend]
        kind: authorization
        condition: "The loan must be active or delinquent by no more than extension_max_days_past_due days on the day it is granted."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.status, auto_loans.days_past_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
      - id: frequency_limits
        applies_to: [auto_extend]
        kind: authorization
        condition: "Extensions granted in the rolling 365 days, counted by auto_msr_extensions_365d, must be below extensions_max_per_12_months, and extensions_used_lifetime must be below extensions_max_lifetime."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.extensions_used_lifetime, auto_transactions.auto_loan_id, auto_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
      - id: borrower_signs
        applies_to: [auto_extend]
        kind: caller_fact
        condition: "A payment extension defers one or up to max_months_per_extension installments to the end of the loan and is the borrower's own agreement to modified terms: the agent registers an auto_requests row of request_type payment_extension in pending_customer_confirmation status, and the extension is granted only after the borrower signs."
        evidence_fields: [auto_requests.auto_request_id, auto_requests.auto_loan_id, auto_requests.request_status]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[auto_requests.auto_request_id]]
          action_bindings: {auto_requests.auto_request_id: auto_request_id}
    params:
      per_tier:
        Used Vehicle Loan: {fee: "=extension_fee", months: "=max_months_per_extension", per_year: "=extensions_max_per_12_months", lifetime: "=extensions_max_lifetime", min_age: "=extension_min_loan_age_months", min_paid: "=extension_min_payments_made", max_dpd: "=extension_max_days_past_due"}
        Certified Pre-Owned Vehicle Loan: {fee: "=extension_fee", months: "=max_months_per_extension", per_year: "=extensions_max_per_12_months", lifetime: "=extensions_max_lifetime", min_age: "=extension_min_loan_age_months", min_paid: "=extension_min_payments_made", max_dpd: "=extension_max_days_past_due"}
        Auto Refinance Loan: {fee: "=extension_fee", months: "=max_months_per_extension", per_year: "=extensions_max_per_12_months", lifetime: "=extensions_max_lifetime", min_age: "=extension_min_loan_age_months", min_paid: "=extension_min_payments_made", max_dpd: "=extension_max_days_past_due"}
        Lease Buyout Loan: {fee: "=extension_fee", months: "=max_months_per_extension", per_year: "=extensions_max_per_12_months", lifetime: "=extensions_max_lifetime", min_age: "=extension_min_loan_age_months", min_paid: "=extension_min_payments_made", max_dpd: "=extension_max_days_past_due"}
        New Vehicle Loan: {fee: "=extension_fee", months: "=max_months_per_extension", per_year: "=extensions_max_per_12_months", lifetime: "=extensions_max_lifetime", min_age: "=extension_min_loan_age_months", min_paid: "=extension_min_payments_made", max_dpd: "=extension_max_days_past_due"}
        Green Vehicle Loan: {fee: "=extension_fee", months: "=max_months_per_extension", per_year: "=extensions_max_per_12_months", lifetime: "=extensions_max_lifetime", min_age: "=extension_min_loan_age_months", min_paid: "=extension_min_payments_made", max_dpd: "=extension_max_days_past_due"}
    measures: [auto_msr_extensions_365d, auto_msr_installments_paid]

  - id: auto_due_date_change
    subject: [auto_change_due_date]
    rule: >-
      A borrower may move the monthly due day to another day from 1 to 28. The new due day may differ from the current one
      by at most due_date_change_max_shift_days calendar days in either direction, counted within the month. The loan must
      be active with no installment past due. Every product allows due_date_change_max_per_12_months change per rolling
      window of due_date_change_window_days calendar days. A due date change is allowed only when due_date_change_window_days calendar days have passed since the last change. Count
      calendar days with the day after last_due_date_change_date as day 1; a new change is allowed when the frozen date is
      on or after last_due_date_change_date plus due_date_change_window_days, or when there has been no earlier change. The
      next due date moves to the new day in the month of the current next_payment_due_date; interest keeps accruing daily,
      so a later due day means more interest in that installment. The maturity date is not changed, and no fee is charged.
    eligibility:
      - id: once_a_year
        applies_to: [auto_change_due_date]
        kind: time
        condition: "A due date change is allowed only when due_date_change_window_days calendar days have passed since the last change."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.last_due_date_change_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "since the last change"
          anchor_source: auto_loans.last_due_date_change_date
          relation: not_before
          duration_source: params.due_date_change_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after last_due_date_change_date as day 1; a new change is allowed when the frozen date is on or after last_due_date_change_date plus due_date_change_window_days, or when there has been no earlier change."
          boundary: inclusive
      - id: current_and_active
        applies_to: [auto_change_due_date]
        kind: state
        condition: "The loan must be active with no installment past due."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.status, auto_loans.days_past_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
        state_contract:
          field: auto_loans.status
          allowed: [active]
    params:
      due_date_change_window_days: 365
      per_tier:
        Used Vehicle Loan: {per_year: "=due_date_change_max_per_12_months", shift: "=due_date_change_max_shift_days"}
        Certified Pre-Owned Vehicle Loan: {per_year: "=due_date_change_max_per_12_months", shift: "=due_date_change_max_shift_days"}
        Auto Refinance Loan: {per_year: "=due_date_change_max_per_12_months", shift: "=due_date_change_max_shift_days"}
        Lease Buyout Loan: {per_year: "=due_date_change_max_per_12_months", shift: "=due_date_change_max_shift_days"}
        New Vehicle Loan: {per_year: "=due_date_change_max_per_12_months", shift: "=due_date_change_max_shift_days"}
        Green Vehicle Loan: {per_year: "=due_date_change_max_per_12_months", shift: "=due_date_change_max_shift_days"}

  - id: auto_evt_autopay
    subject: [auto_set_autopay]
    rule: >-
      Autopay debits a PCB checking account for monthly_payment on each due date. The autopay source must be a checking
      account of the same customer in active status when autopay is enrolled. Enrolling or cancelling is the borrower's own
      instruction to move their funds, and the loan must be active or delinquent. Enrolling adds the autopay discount to
      the APR, within the cap and floor of auto_agg_relationship_discount, from the next installment due at least
      autopay_lead_days calendar days after enrollment; cancelling removes it on the same schedule when
      autopay_discount_removed_on_cancel is true. A change of APR does not change monthly_payment; it changes the split
      between interest and principal and therefore the final installment. An autopay debit returned unpaid is handled as a
      returned payment, and autopay stays enrolled.
    eligibility:
      - id: source_account
        applies_to: [auto_set_autopay]
        kind: authorization
        condition: "The autopay source must be a checking account of the same customer in active status when autopay is enrolled."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.customer_id, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: autopay_source_account_id}
    params:
      autopay_lead_days: 5
      per_tier:
        Used Vehicle Loan: {discount: "=autopay_discount_pct", removed_on_cancel: "=autopay_discount_removed_on_cancel"}
        Certified Pre-Owned Vehicle Loan: {discount: "=autopay_discount_pct", removed_on_cancel: "=autopay_discount_removed_on_cancel"}
        Auto Refinance Loan: {discount: "=autopay_discount_pct", removed_on_cancel: "=autopay_discount_removed_on_cancel"}
        Lease Buyout Loan: {discount: "=autopay_discount_pct", removed_on_cancel: "=autopay_discount_removed_on_cancel"}
        New Vehicle Loan: {discount: "=autopay_discount_pct", removed_on_cancel: "=autopay_discount_removed_on_cancel"}
        Green Vehicle Loan: {discount: "=autopay_discount_pct", removed_on_cancel: "=autopay_discount_removed_on_cancel"}

  - id: auto_evt_payoff_and_lien
    subject: [auto_payment, auto_pay_off, auto_release_lien]
    rule: >-
      The payoff amount on a date is principal_balance plus auto_msr_accrued_interest through that date plus fees_due. A
      payoff quote states the amount for a date up to payoff_quote_valid_days calendar days ahead together with the per-diem
      interest, principal_balance times interest_rate divided by 100 and by interest_day_count_basis, rounded half-up to the
      cent. A payment of at least the payoff amount on its credit date posts as payment_type payoff, pays fees, interest and
      principal to zero, and moves the loan to paid_off through its trigger; any excess is refunded to the payer within
      overpayment_refund_business_days business days by the same method it came from, and a shortfall leaves the loan open with the payment applied
      normally. The lien release must be sent within lien_release_business_days business days after the loan was paid off.
      Business days are Monday through Friday excluding Federal Reserve holidays; count business days with the first
      business day after closed_date as day 1; the release is due by the business day that ends the count. The release is
      sent electronically to the state motor vehicle agency where the title is electronic, and otherwise the signed title is
      mailed to the address on file. A loan that is paid off with GAP coverage in force earns a GAP refund under
      auto_evt_gap_refund.
    eligibility:
      - id: release_deadline
        applies_to: [auto_release_lien]
        kind: time
        condition: "The lien release must be sent within lien_release_business_days business days after the loan was paid off."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.closed_date, auto_loans.lien_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the loan was paid off"
          anchor_source: auto_loans.closed_date
          relation: not_after
          duration_source: variants.lien_release_business_days
          unit: business_days
          counting_rule: "Business days are Monday through Friday excluding Federal Reserve holidays; count business days with the first business day after closed_date as day 1; the release is due by the business day that ends the count."
          boundary: inclusive
    formula:
      payoff_amount: "principal_balance + auto_msr_accrued_interest + fees_due"
      per_diem: "round(principal_balance * interest_rate / 100 / interest_day_count_basis, 2)"
    params:
      overpayment_refund_business_days: 5
      per_tier:
        Used Vehicle Loan: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_business_days"}
        Certified Pre-Owned Vehicle Loan: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_business_days"}
        Auto Refinance Loan: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_business_days"}
        Lease Buyout Loan: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_business_days"}
        New Vehicle Loan: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_business_days"}
        Green Vehicle Loan: {quote_days: "=payoff_quote_valid_days", release_days: "=lien_release_business_days"}
    measures: [auto_msr_accrued_interest]

  - id: auto_evt_gap_refund
    subject: [auto_cancel_gap, auto_gap_refund]
    rule: >-
      GAP waiver coverage is optional and may be cancelled by the borrower at any time while the loan is open; cancelling
      is the borrower's own decision recorded through an auto_requests row of request_type gap_cancellation that the
      borrower confirms. A GAP cancellation within gap_cancellation_full_refund_days calendar days after the loan funded
      refunds the whole gap_premium. Count calendar days with the day after funded_date as day 1; the full refund applies
      when the cancellation date is on or before funded_date plus gap_cancellation_full_refund_days. After that window the
      refund is gap_premium times the number of whole months remaining to the scheduled maturity_date divided by
      term_months, rounded half-up to the cent, minus gap_cancellation_fee, and no refund is made when that is zero or
      less. Paying the loan off early with GAP in force is treated as a cancellation on the payoff date. Each loan receives
      at most one GAP refund. The refund is paid to a PCB checking account of the borrower or by official check; it is never
      applied to the loan balance.
    eligibility:
      - id: full_refund_window
        applies_to: [auto_gap_refund]
        kind: time
        condition: "A GAP cancellation within gap_cancellation_full_refund_days calendar days after the loan funded refunds the whole gap_premium."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.funded_date, auto_loans.gap_cancellation_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the loan funded"
          anchor_source: auto_loans.funded_date
          relation: not_after
          duration_source: variants.gap_cancellation_full_refund_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after funded_date as day 1; the full refund applies when the cancellation date is on or before funded_date plus gap_cancellation_full_refund_days."
          boundary: inclusive
      - id: one_refund
        applies_to: [auto_gap_refund]
        kind: dedup
        condition: "Each loan receives at most one GAP refund."
        evidence_fields: [auto_transactions.auto_loan_id, auto_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_transactions.auto_loan_id]]
          action_bindings: {auto_transactions.auto_loan_id: auto_loan_id}
        dedup_contract:
          table: auto_transactions
          mode: separate_record
          object_bindings: {auto_loan_id: auto_loan_id}
          duplicate_filters: {event_type: [auto_gap_refund]}
          distinct_fields: []
    params:
      per_tier:
        Used Vehicle Loan: {available: "=gap_available", premium: "=gap_premium", full_days: "=gap_cancellation_full_refund_days", fee: "=gap_cancellation_fee", method: "=gap_refund_method"}
        Certified Pre-Owned Vehicle Loan: {available: "=gap_available", premium: "=gap_premium", full_days: "=gap_cancellation_full_refund_days", fee: "=gap_cancellation_fee", method: "=gap_refund_method"}
        Auto Refinance Loan: {available: "=gap_available", premium: "=gap_premium", full_days: "=gap_cancellation_full_refund_days", fee: "=gap_cancellation_fee", method: "=gap_refund_method"}
        Lease Buyout Loan: {available: "=gap_available", premium: "=gap_premium", full_days: "=gap_cancellation_full_refund_days", fee: "=gap_cancellation_fee", method: "=gap_refund_method"}
        New Vehicle Loan: {available: "=gap_available", premium: "=gap_premium", full_days: "=gap_cancellation_full_refund_days", fee: "=gap_cancellation_fee", method: "=gap_refund_method"}
        Green Vehicle Loan: {available: "=gap_available", premium: "=gap_premium", full_days: "=gap_cancellation_full_refund_days", fee: "=gap_cancellation_fee", method: "=gap_refund_method"}

  - id: auto_evt_returned_payment
    subject: [auto_payment_reversal, auto_fee]
    rule: >-
      A payment returned unpaid by the paying bank is reversed in full. An auto_payment_reversal restores its
      principal_portion to principal; its interest_portion becomes accrued interest again because last_payment_date returns
      to the date it held before the payment; and when the returned payment had a fees_portion, that amount becomes due
      again as one auto_fee row with fee_code settlement_reversal and the returned payment as source_item_id. The
      installment the payment satisfied becomes unsatisfied again, so a late charge may follow once the grace days have
      passed. The return also incurs returned_payment_fee as fee_code returned_payment through the reversal's trigger. Each
      returned payment carries at most one returned payment fee, of returned_payment_fee. Blocking a payment source after
      repeated returns is a fraud-operations decision outside this policy.
    eligibility:
      - id: one_fee_per_return
        applies_to: [auto_fee]
        kind: dedup
        condition: "Each returned payment carries at most one returned payment fee, of returned_payment_fee."
        evidence_fields: [auto_transactions.source_item_id, auto_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_transactions.source_item_id]]
          action_bindings: {auto_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: auto_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [auto_fee], fee_code: [returned_payment]}
          distinct_fields: []
    params:
      per_tier:
        Used Vehicle Loan: {fee: "=returned_payment_fee"}
        Certified Pre-Owned Vehicle Loan: {fee: "=returned_payment_fee"}
        Auto Refinance Loan: {fee: "=returned_payment_fee"}
        Lease Buyout Loan: {fee: "=returned_payment_fee"}
        New Vehicle Loan: {fee: "=returned_payment_fee"}
        Green Vehicle Loan: {fee: "=returned_payment_fee"}

  - id: auto_evt_delinquency
    subject: [auto_become_delinquent, auto_cure, auto_charge_off, auto_chargeoff_writeoff]
    rule: >-
      days_past_due counts calendar days since the earliest unsatisfied installment_due_date and returns to zero when every
      past-due installment is satisfied. The loan becomes delinquent when days_past_due reaches delinquency_status_days. A
      delinquent loan returns to active when days_past_due returns to zero. The remaining principal is charged off when
      days_past_due reaches chargeoff_days_past_due; the charge-off writes an auto_chargeoff_writeoff for the whole
      principal_balance and the debt passes to recovery. Repossession, settlements, hardship modifications and payment
      plans for delinquent loans are outside this policy.
    eligibility:
      - id: delinquency_threshold
        applies_to: [auto_become_delinquent]
        kind: authorization
        condition: "The loan becomes delinquent when days_past_due reaches delinquency_status_days."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.days_past_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
      - id: chargeoff_threshold
        applies_to: [auto_charge_off]
        kind: authorization
        condition: "The remaining principal is charged off when days_past_due reaches chargeoff_days_past_due; the charge-off writes an auto_chargeoff_writeoff for the whole principal_balance and the debt passes to recovery."
        evidence_fields: [auto_loans.auto_loan_id, auto_loans.days_past_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[auto_loans.auto_loan_id]]
          action_bindings: {auto_loans.auto_loan_id: auto_loan_id}
    params:
      per_tier:
        Used Vehicle Loan: {delinquent_dpd: "=delinquency_status_days", chargeoff_dpd: "=chargeoff_days_past_due"}
        Certified Pre-Owned Vehicle Loan: {delinquent_dpd: "=delinquency_status_days", chargeoff_dpd: "=chargeoff_days_past_due"}
        Auto Refinance Loan: {delinquent_dpd: "=delinquency_status_days", chargeoff_dpd: "=chargeoff_days_past_due"}
        Lease Buyout Loan: {delinquent_dpd: "=delinquency_status_days", chargeoff_dpd: "=chargeoff_days_past_due"}
        New Vehicle Loan: {delinquent_dpd: "=delinquency_status_days", chargeoff_dpd: "=chargeoff_days_past_due"}
        Green Vehicle Loan: {delinquent_dpd: "=delinquency_status_days", chargeoff_dpd: "=chargeoff_days_past_due"}
