# Policy charter: Home Mortgage Loans. Piedmont Crescent Bank, N.A.
# Single registry of every mortgage number; the runtime never reads this file.

category: mortgage
display_name: Home Mortgage Loans

binding:
  holding_table: mortgage_loans
  event_tables: [mortgage_transactions]
  intake_tables: [mortgage_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_balance: mortgage_principal, escrow_balance: mortgage_escrow, fees_due: mortgage_fees_due}

lifecycle:
  states: [applied, active, delinquent, forbearance, paid_off, withdrawn]
  transitions:
    - {from: applied, to: active, by: system, means: "The loan closed and funded and PCB began servicing it."}
    - {from: applied, to: withdrawn, by: system, means: "The application was denied, withdrawn or not closed within the funding window."}
    - {from: active, to: delinquent, by: system, means: "An installment remained unpaid for the delinquency threshold."}
    - {from: delinquent, to: active, by: system, means: "All past-due installments and escrow were paid."}
    - {from: active, to: forbearance, by: user, means: "The borrower signed a forbearance agreement suspending or reducing payments."}
    - {from: delinquent, to: forbearance, by: user, means: "A delinquent borrower signed a forbearance agreement."}
    - {from: forbearance, to: active, by: system, means: "The forbearance period ended and the deferred amounts were resolved."}
    - {from: forbearance, to: delinquent, by: system, means: "The forbearance period ended with deferred amounts unresolved."}
    - {from: active, to: paid_off, by: system, means: "A payoff covering principal, interest, fees and any escrow advance posted."}
    - {from: delinquent, to: paid_off, by: system, means: "A delinquent loan was paid off in full."}

accounts:
  - key: mortgage_principal
    unit: USD
    meaning: "Unpaid principal of one mortgage loan."
  - key: mortgage_escrow
    unit: USD
    meaning: "Escrow funds held for property taxes and insurance on one mortgage loan; negative when PCB has advanced funds."
  - key: mortgage_fees_due
    unit: USD
    meaning: "Unpaid late charges and servicing fees on one mortgage loan."

parameter_schema:
  term_months: "Scheduled term; integer months."
  rate_type: "'fixed' or 'adjustable'."
  occupancy_types: "Occupancy types eligible; list of primary_residence, second_home, investment."
  max_loans_this_tier: "Most loans of this program a customer may have in applied, active, delinquent or forbearance status; integer count."
  min_loan_amount: "Smallest loan amount; USD."
  max_loan_amount: "Largest loan amount; USD."
  max_ltv_pct: "Largest loan amount as a percent of the lower of appraised value and price; percent."
  min_credit_score: "Lowest representative credit score underwriting accepts; integer score."
  max_dti_pct: "Highest debt-to-income ratio underwriting accepts; percent."
  par_rate: "Currently published note rate at zero points for a 45-day lock; percent."
  rate_lock_days: "Calendar days a locked rate is honored before closing; integer days."
  funding_window_days: "Calendar days after application within which the loan must close; integer days."
  first_payment_months_after_funding: "Calendar months after the funding month in which the first installment falls due, on the first day of the month; integer months."
  payment_due_day: "Day of month installments are due; integer day."
  upfront_insurance_pct: "Upfront mortgage insurance premium or VA funding fee financed, as a percent of the base loan amount; percent."
  annual_insurance_pct: "Annual mortgage insurance premium, billed monthly, as a percent of the principal balance; percent."
  pmi_required_above_ltv_pct: "Private mortgage insurance applies when the original loan-to-value exceeds this percent; percent, or 'not_applicable'."
  pmi_cancel_request_ltv_pct: "Loan-to-value, on original value, at which the borrower may request PMI cancellation; percent, or 'not_applicable'."
  pmi_auto_termination_ltv_pct: "Scheduled loan-to-value, on original value, at which PMI terminates automatically; percent, or 'not_applicable'."
  pmi_cancel_no_30day_late_months: "Months before the request with no payment 30 or more days late that PMI cancellation requires; integer months, or 'not_applicable'."
  pmi_cancel_no_60day_late_months: "Months before the request with no payment 60 or more days late that PMI cancellation requires; integer months, or 'not_applicable'."
  fha_mip_years_if_ltv_at_most_90: "Years annual MIP is paid when the original LTV was 90 percent or less, otherwise for the life of the loan; integer years, or 'not_applicable'."
  escrow_required_above_ltv_pct: "Escrow is mandatory when the original LTV exceeds this percent; percent, or 'always'."
  escrow_waiver_fee_pct: "One-time fee, as a percent of the loan amount, to waive escrow where allowed; percent, or 'not_applicable'."
  escrow_cushion_months: "Months of escrow disbursements kept as a cushion; integer months."
  escrow_surplus_refund_threshold: "Escrow surplus at or above which the surplus is refunded after analysis; USD."
  escrow_shortage_spread_months: "Months over which an escrow shortage is collected; integer months."
  escrow_analysis_frequency_months: "Months between escrow analyses; integer months."
  escrow_refund_on_payoff_days: "Calendar days after payoff within which the remaining escrow is refunded; integer days."
  late_charge_grace_days: "Calendar days after the due date before a late charge applies; integer days."
  late_charge_pct_by_state: "Late charge as a percent of the principal and interest part of the installment, by state of residence; mapping of state to percent."
  late_charge_courtesy_waivers_365d: "Courtesy late charge waivers per customer in a rolling 365 days; integer count."
  partial_payment_handling: "What happens to a payment smaller than one full installment: 'returned'."
  prepayment_penalty_pct: "Penalty on principal prepaid; percent."
  principal_curtailment_min: "Smallest extra principal payment accepted; USD."
  recast_allowed: "Whether the payment may be re-amortized after a large curtailment; boolean."
  recast_min_curtailment: "Curtailment total since the last recast needed for a recast; USD, or 'not_applicable'."
  recast_fee: "Fee for a recast; USD, or 'not_applicable'."
  arm_initial_fixed_months: "Months the initial rate is fixed; integer months, or 'not_applicable'."
  arm_adjustment_frequency_months: "Months between rate adjustments after the fixed period; integer months, or 'not_applicable'."
  arm_index: "Rate index; text, or 'not_applicable'."
  arm_margin_pct: "Margin added to the index; percent, or 'not_applicable'."
  arm_initial_cap_pct: "Largest change at the first adjustment; percent, or 'not_applicable'."
  arm_periodic_cap_pct: "Largest change at each later adjustment; percent, or 'not_applicable'."
  arm_lifetime_cap_pct: "Largest total increase over the start rate; percent, or 'not_applicable'."
  arm_rate_change_notice_days: "Calendar days before the first payment at a new rate that the change notice is sent; integer days, or 'not_applicable'."
  forbearance_max_initial_months: "Longest first forbearance plan; integer months."
  forbearance_max_total_months: "Longest total forbearance over the life of the loan; integer months."
  forbearance_eligible_hardships: "Hardship types eligible for forbearance; list."
  payoff_statement_business_days: "Business days after a request within which a payoff statement is sent; integer business days."
  payoff_statement_fee: "Fee for a payoff statement; USD."
  lien_satisfaction_days: "Calendar days after payoff within which the deed of trust satisfaction is recorded; integer days."
  autopay_available: "Whether automatic payment from a PCB account is offered; boolean."

