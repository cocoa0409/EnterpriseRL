events:
  - type: mortgage_apply
    target: mortgage_loans
    mutation: create
    meaning: "A mortgage application is recorded for one program and property."
    grain: "One row per application."
    fields:
      customer_id: "The borrower."
      variant_name: "Official mortgage program."
      status: "Always applied at creation."
      opened_date: "Application date."
      property_address: "Address of the property securing the loan, as on the purchase contract or deed."
      occupancy_type: "How the borrower will occupy the property."
      original_principal: "Loan amount applied for."
      principal_balance: "Always 0.00 at creation."
      escrow_balance: "Always 0.00 at creation."
      fees_due: "Always 0.00 at creation."
    triggers: []
  - type: mortgage_fund
    target: mortgage_loans
    mutation: {transition: {from: applied, to: active}}
    meaning: "The loan closes and funds and servicing begins."
    grain: "One row per loan funded."
    fields:
      status: "Set to active."
      funded_date: "Closing and funding date."
      loan_number_last4: "Last four digits of the loan number."
      original_property_value: "Lower of appraised value and purchase price at origination."
      interest_rate: "Note rate at closing."
      principal_interest_payment: "Monthly principal and interest."
      escrow_payment: "Monthly escrow deposit; 0.00 when escrow is waived."
      escrow_waived: "Whether escrow was waived."
      mortgage_insurance_monthly: "Monthly mortgage insurance premium included in escrow."
      pmi_status: "Mortgage insurance status at closing."
      next_payment_due_date: "First installment due date."
      maturity_date: "Final installment due date."
      arm_next_adjustment_date: "First rate change date for an adjustable loan, otherwise empty."
    triggers:
      - event: "mortgage:mortgage_disbursement"
        map: {posted_date: funded_date}
  - type: mortgage_withdraw
    target: mortgage_loans
    mutation: {transition: {from: applied, to: withdrawn}}
    meaning: "The application ends without closing."
    grain: "One row per application withdrawn."
    fields:
      status: "Set to withdrawn."
      closed_date: "Date it ended."
    triggers: []
  - type: mortgage_become_delinquent
    target: mortgage_loans
    mutation: {transition: {from: active, to: delinquent}}
    meaning: "The loan becomes delinquent."
    grain: "One row per delinquency episode."
    fields:
      status: "Set to delinquent."
    triggers: []
  - type: mortgage_cure
    target: mortgage_loans
    mutation: {transition: {from: delinquent, to: active}}
    meaning: "A delinquent loan is brought current."
    grain: "One row per cure."
    fields:
      status: "Set to active."
      days_past_due: "Reset to 0."
    triggers: []
  - type: mortgage_start_forbearance
    target: mortgage_loans
    mutation: {transition: [{from: active, to: forbearance}, {from: delinquent, to: forbearance}]}
    meaning: "A signed forbearance plan suspends payments."
    grain: "One row per forbearance plan started."
    fields:
      status: "Set to forbearance."
      forbearance_end_date: "Last day of the plan."
      forbearance_months_used: "Previous value plus the months of this plan."
    triggers: []
  - type: mortgage_end_forbearance
    target: mortgage_loans
    mutation: {transition: [{from: forbearance, to: active}, {from: forbearance, to: delinquent}]}
    meaning: "A forbearance plan ends."
    grain: "One row per plan ended."
    fields:
      status: "active when deferred amounts were resolved, otherwise delinquent."
      forbearance_end_date: "Unchanged, the plan's last day."
    triggers: []
  - type: mortgage_pay_off
    target: mortgage_loans
    mutation: {transition: [{from: active, to: paid_off}, {from: delinquent, to: paid_off}]}
    meaning: "The loan is paid in full."
    grain: "One row per payoff."
    fields:
      status: "Set to paid_off."
      closed_date: "Payoff date."
    triggers: []
  - type: mortgage_cancel_mortgage_insurance
    target: mortgage_loans
    mutation: update
    meaning: "Private mortgage insurance is cancelled at the borrower's request or terminates automatically, or FHA MIP ends."
    grain: "One row per insurance cancellation."
    fields:
      pmi_status: "cancelled or terminated."
      mortgage_insurance_monthly: "Set to 0.00."
      escrow_payment: "Reduced by the removed premium."
    triggers: []
  - type: mortgage_escrow_analysis
    target: mortgage_loans
    mutation: update
    meaning: "An escrow analysis resets the monthly escrow payment."
    grain: "One row per analysis."
    fields:
      escrow_payment: "New monthly escrow deposit including any shortage installment."
      last_escrow_analysis_date: "Date of the analysis."
    triggers: []
  - type: mortgage_rate_adjust
    target: mortgage_loans
    mutation: update
    meaning: "An adjustable rate changes on its change date."
    grain: "One row per rate adjustment."
    fields:
      interest_rate: "New note rate."
      principal_interest_payment: "Re-amortized monthly principal and interest."
      arm_next_adjustment_date: "Next change date."
    triggers: []
  - type: mortgage_recast
    target: mortgage_loans
    mutation: update
    meaning: "The payment is re-amortized over the remaining term after a large principal curtailment."
    grain: "One row per recast."
    fields:
      principal_interest_payment: "Re-amortized monthly principal and interest."
      last_recast_date: "Date of the recast."
    triggers:
      - event: "mortgage:mortgage_fee"
        map: {fee_code: recast}
  - type: mortgage_disbursement
    target: mortgage_transactions
    meaning: "Loan proceeds are disbursed at closing."
    grain: "One row per loan funding."
    distinguish_by: [posted_date]
    fields:
      amount: "Loan amount including any financed upfront insurance."
      posted_date: "Funding date."
    account: mortgage_principal
    direction: in
    triggers: []
  - type: mortgage_payment
    target: mortgage_transactions
    meaning: "A borrower payment posts and is split among interest, principal, escrow and fees."
    grain: "One row per payment, identified by its reference number."
    distinguish_by: [reference_number]
    fields:
      amount: "Total payment."
      posted_date: "Date credited."
      payment_type: "installment, curtailment or payoff."
      interest_portion: "Part applied to interest."
      principal_portion: "Part applied to principal; the amount booked to principal."
      escrow_portion: "Part deposited to escrow."
      fees_portion: "Part applied to fees due."
      installment_due_date: "Installment satisfied, empty for a curtailment."
      reference_number: "Payment reference number."
      payment_channel: "How it was paid."
      counterparty_account_id: "Paying PCB account, otherwise empty."
    account: mortgage_principal
    direction: out
    triggers:
      - event: "mortgage:mortgage_escrow_deposit"
        when: {escrow_portion: {not: 0.00}}
        map: {amount: escrow_portion, source_item_id: mortgage_txn_id, posted_date: posted_date}
      - event: "mortgage:mortgage_fee_settlement"
        when: {fees_portion: {not: 0.00}}
        map: {amount: fees_portion, source_item_id: mortgage_txn_id, posted_date: posted_date}
      - event: "mortgage:mortgage_pay_off"
        when: {payment_type: payoff}
        map: {closed_date: posted_date}
      - event: "checking:checking_debit"
        when: {payment_channel: [autopay_pcb, pcb_transfer]}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: mortgage_loan_id}
  - type: mortgage_escrow_deposit
    target: mortgage_transactions
    meaning: "The escrow part of a payment is deposited to escrow."
    grain: "One row per payment carrying escrow."
    distinguish_by: [source_item_id]
    fields:
      amount: "Escrow deposited."
      posted_date: "Payment date."
      source_item_id: "The payment."
    account: mortgage_escrow
    direction: in
    triggers: []
  - type: mortgage_escrow_disbursement
    target: mortgage_transactions
    meaning: "Escrow pays a property tax bill, insurance premium or mortgage insurance premium."
    grain: "One row per bill paid."
    distinguish_by: [payee_type, posted_date]
    fields:
      amount: "Amount paid."
      posted_date: "Date paid."
      payee_type: "Which bill was paid."
      payee_name: "Taxing authority or insurer name as billed."
    account: mortgage_escrow
    direction: out
    triggers: []
  - type: mortgage_escrow_refund
    target: mortgage_transactions
    meaning: "An escrow surplus after analysis, or the remaining escrow after payoff, is refunded to the borrower."
    grain: "One row per refund."
    distinguish_by: [refund_reason, posted_date]
    fields:
      amount: "Amount refunded."
      posted_date: "Date refunded."
      refund_reason: "analysis_surplus or payoff_balance."
      refund_destination: "checking or official_check."
      counterparty_account_id: "PCB checking account credited, otherwise empty."
    account: mortgage_escrow
    direction: out
    triggers:
      - event: "checking:checking_deposit"
        when: {refund_destination: checking}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: mortgage_loan_id}
  - type: mortgage_fee
    target: mortgage_transactions
    meaning: "A late charge or recast fee is assessed."
    grain: "One row per fee: per late installment or per recast."
    distinguish_by: [fee_code, installment_due_date, posted_date]
    fields:
      amount: "Fee amount."
      posted_date: "Date assessed."
      fee_code: "late_charge or recast."
      installment_due_date: "For a late charge, the late installment; otherwise empty."
    account: mortgage_fees_due
    direction: in
    triggers: []
  - type: mortgage_fee_settlement
    target: mortgage_transactions
    meaning: "The fee part of a payment reduces fees due."
    grain: "One row per payment paying fees."
    distinguish_by: [source_item_id]
    fields:
      amount: "Fees paid."
      posted_date: "Payment date."
      source_item_id: "The payment."
    account: mortgage_fees_due
    direction: out
    triggers: []
  - type: mortgage_fee_waiver
    target: mortgage_transactions
    meaning: "A fee is waived in full."
    grain: "One row per fee waived."
    distinguish_by: [source_item_id]
    fields:
      amount: "Amount waived."
      posted_date: "Date waived."
      source_item_id: "The fee."
      adjustment_reason: "courtesy_waiver or bank_error."
    account: mortgage_fees_due
    direction: out
    triggers: []

measures:
  - id: mortgage_msr_current_ltv_original_value
    window: "The measurement date."
    measure: "principal_balance divided by original_property_value, as a percent to two decimals."
  - id: mortgage_msr_late_history
    window: "The pmi_cancel_no_60day_late_months months before the measurement date."
    measure: "The greatest days_past_due reached in each month of the window, from late charge and payment history."
  - id: mortgage_msr_curtailments_since_recast
    window: "From last_recast_date, or funded_date when there has been no recast, through the measurement date."
    measure: "Sum of principal_portion over mortgage_payment rows with payment_type curtailment."
  - id: mortgage_msr_late_charge_courtesy_365d
    window: "Rolling 365 calendar days ending on the frozen date."
    measure: "Count of mortgage_fee_waiver rows with adjustment_reason courtesy_waiver on the customer's mortgage loans."
  - id: mortgage_msr_escrow_projection
    window: "The escrow_projection_months months after the analysis date."
    measure: "Projected escrow disbursements by payee_type from the latest tax and insurance bills, and the lowest projected escrow balance over the window."

policies:
  - id: mortgage_agg_multi_holding
    subject: [mortgage_apply]
    rule: >-
      A customer may have several mortgage loans. The count of the customer's mortgage loans in applied, active, delinquent
      or forbearance status must be below max_per_customer before a new application is recorded. The count for the requested
      program must also be below max_loans_this_tier, and only one FHA or VA loan may be outstanding at a time for a primary
      residence. Paid-off and withdrawn loans do not count.
    eligibility:
      - id: portfolio_cap
        applies_to: [mortgage_apply]
        kind: authorization
        condition: "The count of the customer's mortgage loans in applied, active, delinquent or forbearance status must be below max_per_customer before a new application is recorded."
        evidence_fields: [mortgage_loans.customer_id, mortgage_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[mortgage_loans.customer_id]]
          action_bindings: {mortgage_loans.customer_id: customer_id}
    params:
      max_per_customer: 4
      per_tier:
        FHA 30-Year Fixed Mortgage: {tier_cap: "=max_loans_this_tier"}
        VA 30-Year Fixed Mortgage: {tier_cap: "=max_loans_this_tier"}
        Conventional 30-Year Fixed Mortgage: {tier_cap: "=max_loans_this_tier"}
        Conventional 15-Year Fixed Mortgage: {tier_cap: "=max_loans_this_tier"}
        7/6 SOFR Adjustable-Rate Mortgage: {tier_cap: "=max_loans_this_tier"}
        Jumbo 30-Year Fixed Mortgage: {tier_cap: "=max_loans_this_tier"}

  - id: mortgage_agg_relationship_exposure
    subject: [mortgage_apply, mortgage_fund]
    rule: >-
      Mortgage exposure is aggregated per borrower. The sum of principal_balance on the customer's active, delinquent and
      forbearance loans plus the amount applied for must not exceed combined_mortgage_exposure_cap. Mortgage principal is
      also the one lending balance that counts toward the checking relationship balance of tiers whose
      relationship_balance_includes_mortgage is true, as the checking charter defines; no mortgage pricing depends on other
      holdings.
    eligibility:
      - id: exposure_cap
        applies_to: [mortgage_apply, mortgage_fund]
        kind: authorization
        condition: "The sum of principal_balance on the customer's active, delinquent and forbearance loans plus the amount applied for must not exceed combined_mortgage_exposure_cap."
        evidence_fields: [mortgage_loans.customer_id, mortgage_loans.principal_balance, mortgage_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[mortgage_loans.customer_id]]
          action_bindings: {mortgage_loans.customer_id: customer_id}
    params:
      combined_mortgage_exposure_cap: 5000000.00

  - id: mortgage_origination
    subject: [mortgage_apply, mortgage_fund, mortgage_withdraw, mortgage_disbursement]
    rule: >-
      Underwriting approves a loan only within the program's min_loan_amount and max_loan_amount, max_ltv_pct, min_credit_score,
      max_dti_pct and occupancy_types; these are credit decisions made by the underwriting system, never by the agent. The
      note rate is the par_rate locked for rate_lock_days. The loan funds at closing with one mortgage_disbursement including
      any financed upfront_insurance_pct premium. The first installment is due on payment_due_day of the month
      first_payment_months_after_funding months after the funding month. Escrow is required when the original LTV exceeds
      escrow_required_above_ltv_pct, or always where that is set; otherwise the borrower may waive escrow by paying
      escrow_waiver_fee_pct percent of the loan at closing. An application not closed is withdrawn once funding_window_days
      calendar days have passed after the application was recorded. Count calendar days with the day after opened_date as day
      1; the application lapses when the frozen date is on or after opened_date plus funding_window_days.
    eligibility:
      - id: funding_lapse
        applies_to: [mortgage_withdraw]
        kind: time
        condition: "An application not closed is withdrawn once funding_window_days calendar days have passed after the application was recorded."
        evidence_fields: [mortgage_loans.mortgage_loan_id, mortgage_loans.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[mortgage_loans.mortgage_loan_id]]
          action_bindings: {mortgage_loans.mortgage_loan_id: mortgage_loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the application was recorded"
          anchor_source: mortgage_loans.opened_date
          relation: not_before
          duration_source: variants.funding_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after opened_date as day 1; the application lapses when the frozen date is on or after opened_date plus funding_window_days."
          boundary: inclusive
    params:
      per_tier:
        FHA 30-Year Fixed Mortgage: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", score: "=min_credit_score", dti: "=max_dti_pct", rate: "=par_rate", upfront: "=upfront_insurance_pct", escrow_ltv: "=escrow_required_above_ltv_pct"}
        VA 30-Year Fixed Mortgage: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", score: "=min_credit_score", dti: "=max_dti_pct", rate: "=par_rate", upfront: "=upfront_insurance_pct", escrow_ltv: "=escrow_required_above_ltv_pct"}
        Conventional 30-Year Fixed Mortgage: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", score: "=min_credit_score", dti: "=max_dti_pct", rate: "=par_rate", upfront: "=upfront_insurance_pct", escrow_ltv: "=escrow_required_above_ltv_pct"}
        Conventional 15-Year Fixed Mortgage: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", score: "=min_credit_score", dti: "=max_dti_pct", rate: "=par_rate", upfront: "=upfront_insurance_pct", escrow_ltv: "=escrow_required_above_ltv_pct"}
        7/6 SOFR Adjustable-Rate Mortgage: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", score: "=min_credit_score", dti: "=max_dti_pct", rate: "=par_rate", upfront: "=upfront_insurance_pct", escrow_ltv: "=escrow_required_above_ltv_pct"}
        Jumbo 30-Year Fixed Mortgage: {min_amount: "=min_loan_amount", max_amount: "=max_loan_amount", ltv: "=max_ltv_pct", score: "=min_credit_score", dti: "=max_dti_pct", rate: "=par_rate", upfront: "=upfront_insurance_pct", escrow_ltv: "=escrow_required_above_ltv_pct"}

  - id: mortgage_evt_payments
    subject: [mortgage_payment, mortgage_escrow_deposit, mortgage_fee_settlement]
    rule: >-
      Mortgage interest is paid in arrears monthly: each installment's interest is the principal balance after the prior
      installment times interest_rate divided by 100 and by interest_periods_per_year, rounded half-up to the cent. A full installment is
      principal_interest_payment plus escrow_payment. Payments post only to a loan whose status is active, delinquent or
      forbearance. A payment smaller than one full installment is handled per partial_payment_handling and returned to the
      borrower without being applied. Each full installment is applied to interest, then principal, then escrow, and any
      amount beyond whole installments is applied to fees due and then, when at least principal_curtailment_min, to principal
      as a curtailment; late charges are never deducted from an installment, so a timely full installment is never made late
      by an unpaid late charge. Payoff interest is computed daily from the last installment's due date at interest_rate
      divided by 100 and by payoff_day_count_basis. No prepayment penalty applies. Payments from a PCB checking account debit it through the
      payment's trigger.
    eligibility:
      - id: loan_serviced
        applies_to: [mortgage_payment]
        kind: state
        condition: "Payments post only to a loan whose status is active, delinquent or forbearance."
        evidence_fields: [mortgage_loans.mortgage_loan_id, mortgage_loans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[mortgage_loans.mortgage_loan_id]]
          action_bindings: {mortgage_loans.mortgage_loan_id: mortgage_loan_id}
        state_contract:
          field: mortgage_loans.status
          allowed: [active, delinquent, forbearance]
    params:
      interest_periods_per_year: 12
      payoff_day_count_basis: 365
      per_tier:
        FHA 30-Year Fixed Mortgage: {partial: "=partial_payment_handling", curtail_min: "=principal_curtailment_min", prepay: "=prepayment_penalty_pct", due_day: "=payment_due_day", autopay: "=autopay_available"}
        VA 30-Year Fixed Mortgage: {partial: "=partial_payment_handling", curtail_min: "=principal_curtailment_min", prepay: "=prepayment_penalty_pct", due_day: "=payment_due_day", autopay: "=autopay_available"}
        Conventional 30-Year Fixed Mortgage: {partial: "=partial_payment_handling", curtail_min: "=principal_curtailment_min", prepay: "=prepayment_penalty_pct", due_day: "=payment_due_day", autopay: "=autopay_available"}
        Conventional 15-Year Fixed Mortgage: {partial: "=partial_payment_handling", curtail_min: "=principal_curtailment_min", prepay: "=prepayment_penalty_pct", due_day: "=payment_due_day", autopay: "=autopay_available"}
        7/6 SOFR Adjustable-Rate Mortgage: {partial: "=partial_payment_handling", curtail_min: "=principal_curtailment_min", prepay: "=prepayment_penalty_pct", due_day: "=payment_due_day", autopay: "=autopay_available"}
        Jumbo 30-Year Fixed Mortgage: {partial: "=partial_payment_handling", curtail_min: "=principal_curtailment_min", prepay: "=prepayment_penalty_pct", due_day: "=payment_due_day", autopay: "=autopay_available"}

  - id: mortgage_evt_late_charges
    subject: [mortgage_fee, mortgage_fee_waiver]
    rule: >-
      A late charge applies to an installment not received in full within late_charge_grace_days calendar days after its due
      date. Count calendar days with the day after installment_due_date as day 1; the charge applies when the installment is
      still unpaid after the end of the last grace day. The charge equals late_charge_pct_by_state percent of
      principal_interest_payment for the borrower's state_of_residence, rounded half-up to the cent; escrow is never part of
      the basis. Each installment carries at most one late charge, and no late charge applies during forbearance. A late
      charge assessed contrary to this policy is waived with adjustment_reason bank_error. A courtesy waiver of a late charge
      is allowed while mortgage_msr_late_charge_courtesy_365d is below late_charge_courtesy_waivers_365d and the loan is not
      in forbearance. A fee can be waived at most once.
    eligibility:
      - id: grace_elapsed
        applies_to: [mortgage_fee]
        kind: time
        condition: "A late charge applies to an installment not received in full within late_charge_grace_days calendar days after its due date."
        evidence_fields: [mortgage_loans.mortgage_loan_id, mortgage_loans.next_payment_due_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[mortgage_loans.mortgage_loan_id]]
          action_bindings: {mortgage_loans.mortgage_loan_id: mortgage_loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "its due date"
          anchor_source: mortgage_loans.next_payment_due_date
          relation: not_before
          duration_source: variants.late_charge_grace_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after installment_due_date as day 1; the charge applies when the installment is still unpaid after the end of the last grace day."
          boundary: exclusive
      - id: waive_once
        applies_to: [mortgage_fee_waiver]
        kind: dedup
        condition: "A fee can be waived at most once."
        evidence_fields: [mortgage_transactions.source_item_id, mortgage_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[mortgage_transactions.source_item_id]]
          action_bindings: {mortgage_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: mortgage_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [mortgage_fee_waiver]}
          distinct_fields: []
    params:
      per_tier:
        FHA 30-Year Fixed Mortgage: {grace: "=late_charge_grace_days", pct: "=late_charge_pct_by_state", courtesy: "=late_charge_courtesy_waivers_365d"}
        VA 30-Year Fixed Mortgage: {grace: "=late_charge_grace_days", pct: "=late_charge_pct_by_state", courtesy: "=late_charge_courtesy_waivers_365d"}
        Conventional 30-Year Fixed Mortgage: {grace: "=late_charge_grace_days", pct: "=late_charge_pct_by_state", courtesy: "=late_charge_courtesy_waivers_365d"}
        Conventional 15-Year Fixed Mortgage: {grace: "=late_charge_grace_days", pct: "=late_charge_pct_by_state", courtesy: "=late_charge_courtesy_waivers_365d"}
        7/6 SOFR Adjustable-Rate Mortgage: {grace: "=late_charge_grace_days", pct: "=late_charge_pct_by_state", courtesy: "=late_charge_courtesy_waivers_365d"}
        Jumbo 30-Year Fixed Mortgage: {grace: "=late_charge_grace_days", pct: "=late_charge_pct_by_state", courtesy: "=late_charge_courtesy_waivers_365d"}
    measures: [mortgage_msr_late_charge_courtesy_365d]

  - id: mortgage_evt_escrow
    subject: [mortgage_escrow_disbursement, mortgage_escrow_refund, mortgage_escrow_analysis]
    rule: >-
      Escrow pays property taxes, homeowners and flood insurance, and mortgage insurance on or before each bill's due date,
      even when the escrow balance is insufficient, in which case PCB advances the difference and the balance goes negative.
      Every escrow_analysis_frequency_months months PCB projects the next escrow_projection_months months with mortgage_msr_escrow_projection
      and sets escrow_payment to projected disbursements divided by escrow_projection_months plus the amount needed to keep the lowest projected
      balance at escrow_cushion_months of disbursements. A projected shortage is collected over escrow_shortage_spread_months
      added installments. A projected surplus at or above escrow_surplus_refund_threshold is refunded to the borrower after
      the analysis, and a smaller surplus is credited to the next year's payments; a surplus is refunded only when the loan is
      current. After payoff the remaining escrow balance is refunded within escrow_refund_on_payoff_days calendar days after
      the payoff. Count calendar days with the day after closed_date as day 1; the refund is due by closed_date plus
      escrow_refund_on_payoff_days. Escrow-waived loans have no escrow activity.
    eligibility:
      - id: payoff_refund_deadline
        applies_to: [mortgage_escrow_refund]
        kind: time
        condition: "After payoff the remaining escrow balance is refunded within escrow_refund_on_payoff_days calendar days after the payoff."
        evidence_fields: [mortgage_loans.mortgage_loan_id, mortgage_loans.closed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[mortgage_loans.mortgage_loan_id]]
          action_bindings: {mortgage_loans.mortgage_loan_id: mortgage_loan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the payoff"
          anchor_source: mortgage_loans.closed_date
          relation: not_after
          duration_source: variants.escrow_refund_on_payoff_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after closed_date as day 1; the refund is due by closed_date plus escrow_refund_on_payoff_days."
          boundary: inclusive
    params:
      escrow_projection_months: 12
      per_tier:
        FHA 30-Year Fixed Mortgage: {cushion: "=escrow_cushion_months", surplus: "=escrow_surplus_refund_threshold", spread: "=escrow_shortage_spread_months", frequency: "=escrow_analysis_frequency_months", payoff_days: "=escrow_refund_on_payoff_days"}
        VA 30-Year Fixed Mortgage: {cushion: "=escrow_cushion_months", surplus: "=escrow_surplus_refund_threshold", spread: "=escrow_shortage_spread_months", frequency: "=escrow_analysis_frequency_months", payoff_days: "=escrow_refund_on_payoff_days"}
        Conventional 30-Year Fixed Mortgage: {cushion: "=escrow_cushion_months", surplus: "=escrow_surplus_refund_threshold", spread: "=escrow_shortage_spread_months", frequency: "=escrow_analysis_frequency_months", payoff_days: "=escrow_refund_on_payoff_days"}
        Conventional 15-Year Fixed Mortgage: {cushion: "=escrow_cushion_months", surplus: "=escrow_surplus_refund_threshold", spread: "=escrow_shortage_spread_months", frequency: "=escrow_analysis_frequency_months", payoff_days: "=escrow_refund_on_payoff_days"}
        7/6 SOFR Adjustable-Rate Mortgage: {cushion: "=escrow_cushion_months", surplus: "=escrow_surplus_refund_threshold", spread: "=escrow_shortage_spread_months", frequency: "=escrow_analysis_frequency_months", payoff_days: "=escrow_refund_on_payoff_days"}
        Jumbo 30-Year Fixed Mortgage: {cushion: "=escrow_cushion_months", surplus: "=escrow_surplus_refund_threshold", spread: "=escrow_shortage_spread_months", frequency: "=escrow_analysis_frequency_months", payoff_days: "=escrow_refund_on_payoff_days"}
    measures: [mortgage_msr_escrow_projection]

  - id: mortgage_evt_mortgage_insurance
    subject: [mortgage_cancel_mortgage_insurance]
    rule: >-
      Private mortgage insurance applies to programs with pmi_required_above_ltv_pct when the original LTV exceeded it. The
      borrower may request cancellation in writing once mortgage_msr_current_ltv_original_value is at or below
      pmi_cancel_request_ltv_pct, measured on original_property_value and never on a new appraisal. A borrower-requested PMI
      cancellation requires the loan to be current and mortgage_msr_late_history to show no payment 30 or more days late in the
      last pmi_cancel_no_30day_late_months months and none 60 or more days late in the last pmi_cancel_no_60day_late_months
      months. PMI terminates automatically, without a request, on the date the scheduled balance reaches
      pmi_auto_termination_ltv_pct of original value if the loan is current then, or on the first day of the month after it
      becomes current. FHA MIP ends after fha_mip_years_if_ltv_at_most_90 years only when the original LTV was 90 percent or
      less and otherwise lasts for the life of the loan; VA loans carry no monthly insurance. Removing insurance lowers
      escrow_payment by the premium from the next installment.
    eligibility:
      - id: good_history
        applies_to: [mortgage_cancel_mortgage_insurance]
        kind: authorization
        condition: "A borrower-requested PMI cancellation requires the loan to be current and mortgage_msr_late_history to show no payment 30 or more days late in the last pmi_cancel_no_30day_late_months months and none 60 or more days late in the last pmi_cancel_no_60day_late_months months."
        evidence_fields: [mortgage_loans.mortgage_loan_id, mortgage_loans.days_past_due, mortgage_loans.principal_balance, mortgage_loans.original_property_value]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[mortgage_loans.mortgage_loan_id]]
          action_bindings: {mortgage_loans.mortgage_loan_id: mortgage_loan_id}
    params:
      per_tier:
        FHA 30-Year Fixed Mortgage: {required_above: "=pmi_required_above_ltv_pct", request_at: "=pmi_cancel_request_ltv_pct", auto_at: "=pmi_auto_termination_ltv_pct", no_30: "=pmi_cancel_no_30day_late_months", no_60: "=pmi_cancel_no_60day_late_months", mip_years: "=fha_mip_years_if_ltv_at_most_90", annual_pct: "=annual_insurance_pct"}
        VA 30-Year Fixed Mortgage: {required_above: "=pmi_required_above_ltv_pct", request_at: "=pmi_cancel_request_ltv_pct", auto_at: "=pmi_auto_termination_ltv_pct", no_30: "=pmi_cancel_no_30day_late_months", no_60: "=pmi_cancel_no_60day_late_months", mip_years: "=fha_mip_years_if_ltv_at_most_90", annual_pct: "=annual_insurance_pct"}
        Conventional 30-Year Fixed Mortgage: {required_above: "=pmi_required_above_ltv_pct", request_at: "=pmi_cancel_request_ltv_pct", auto_at: "=pmi_auto_termination_ltv_pct", no_30: "=pmi_cancel_no_30day_late_months", no_60: "=pmi_cancel_no_60day_late_months", mip_years: "=fha_mip_years_if_ltv_at_most_90", annual_pct: "=annual_insurance_pct"}
        Conventional 15-Year Fixed Mortgage: {required_above: "=pmi_required_above_ltv_pct", request_at: "=pmi_cancel_request_ltv_pct", auto_at: "=pmi_auto_termination_ltv_pct", no_30: "=pmi_cancel_no_30day_late_months", no_60: "=pmi_cancel_no_60day_late_months", mip_years: "=fha_mip_years_if_ltv_at_most_90", annual_pct: "=annual_insurance_pct"}
        7/6 SOFR Adjustable-Rate Mortgage: {required_above: "=pmi_required_above_ltv_pct", request_at: "=pmi_cancel_request_ltv_pct", auto_at: "=pmi_auto_termination_ltv_pct", no_30: "=pmi_cancel_no_30day_late_months", no_60: "=pmi_cancel_no_60day_late_months", mip_years: "=fha_mip_years_if_ltv_at_most_90", annual_pct: "=annual_insurance_pct"}
        Jumbo 30-Year Fixed Mortgage: {required_above: "=pmi_required_above_ltv_pct", request_at: "=pmi_cancel_request_ltv_pct", auto_at: "=pmi_auto_termination_ltv_pct", no_30: "=pmi_cancel_no_30day_late_months", no_60: "=pmi_cancel_no_60day_late_months", mip_years: "=fha_mip_years_if_ltv_at_most_90", annual_pct: "=annual_insurance_pct"}
    measures: [mortgage_msr_current_ltv_original_value, mortgage_msr_late_history]

  - id: mortgage_evt_rate_adjustment
    subject: [mortgage_rate_adjust]
    rule: >-
      Only programs whose rate_type is adjustable change rate. The rate is fixed for arm_initial_fixed_months months from the
      first installment and then changes every arm_adjustment_frequency_months months on arm_next_adjustment_date to the
      arm_index value published arm_index_lookback_days days before the change date plus arm_margin_pct, rounded to the
      nearest arm_rounding_increment_pct percentage point. The change at the first adjustment is limited to arm_initial_cap_pct, each later change to
      arm_periodic_cap_pct, and the rate never exceeds the start rate plus arm_lifetime_cap_pct nor falls below arm_margin_pct.
      The principal and interest payment is re-amortized over the remaining term at the new rate, and the borrower is notified
      at least arm_rate_change_notice_days days before the first payment at the new rate.
    eligibility: []
    params:
      arm_index_lookback_days: 45
      arm_rounding_increment_pct: 0.125
      per_tier:
        FHA 30-Year Fixed Mortgage: {fixed_months: "=arm_initial_fixed_months", frequency: "=arm_adjustment_frequency_months", margin: "=arm_margin_pct", first_cap: "=arm_initial_cap_pct", periodic_cap: "=arm_periodic_cap_pct", lifetime_cap: "=arm_lifetime_cap_pct", notice: "=arm_rate_change_notice_days"}
        VA 30-Year Fixed Mortgage: {fixed_months: "=arm_initial_fixed_months", frequency: "=arm_adjustment_frequency_months", margin: "=arm_margin_pct", first_cap: "=arm_initial_cap_pct", periodic_cap: "=arm_periodic_cap_pct", lifetime_cap: "=arm_lifetime_cap_pct", notice: "=arm_rate_change_notice_days"}
        Conventional 30-Year Fixed Mortgage: {fixed_months: "=arm_initial_fixed_months", frequency: "=arm_adjustment_frequency_months", margin: "=arm_margin_pct", first_cap: "=arm_initial_cap_pct", periodic_cap: "=arm_periodic_cap_pct", lifetime_cap: "=arm_lifetime_cap_pct", notice: "=arm_rate_change_notice_days"}
        Conventional 15-Year Fixed Mortgage: {fixed_months: "=arm_initial_fixed_months", frequency: "=arm_adjustment_frequency_months", margin: "=arm_margin_pct", first_cap: "=arm_initial_cap_pct", periodic_cap: "=arm_periodic_cap_pct", lifetime_cap: "=arm_lifetime_cap_pct", notice: "=arm_rate_change_notice_days"}
        7/6 SOFR Adjustable-Rate Mortgage: {fixed_months: "=arm_initial_fixed_months", frequency: "=arm_adjustment_frequency_months", margin: "=arm_margin_pct", first_cap: "=arm_initial_cap_pct", periodic_cap: "=arm_periodic_cap_pct", lifetime_cap: "=arm_lifetime_cap_pct", notice: "=arm_rate_change_notice_days"}
        Jumbo 30-Year Fixed Mortgage: {fixed_months: "=arm_initial_fixed_months", frequency: "=arm_adjustment_frequency_months", margin: "=arm_margin_pct", first_cap: "=arm_initial_cap_pct", periodic_cap: "=arm_periodic_cap_pct", lifetime_cap: "=arm_lifetime_cap_pct", notice: "=arm_rate_change_notice_days"}

  - id: mortgage_evt_forbearance
    subject: [mortgage_start_forbearance, mortgage_end_forbearance]
    rule: >-
      Forbearance is the borrower's own signed agreement: the agent registers a mortgage_requests row of request_type
      forbearance naming the hardship type, and the plan starts only after the borrower signs. The hardship must be one of the
      program's forbearance_eligible_hardships. A first plan lasts no more than forbearance_max_initial_months months, and the
      months of all plans on the loan, including this one, may not exceed forbearance_max_total_months. Interest continues to
      accrue, escrow bills continue to be paid, and no late charges are assessed while in forbearance. When the plan ends the
      loan returns to active if the deferred amounts were repaid or moved into a repayment plan, deferral or modification by
      the loss mitigation team, and otherwise to delinquent. Choosing among repayment plan, deferral and modification is a loss
      mitigation decision outside this policy.
    eligibility:
      - id: months_available
        applies_to: [mortgage_start_forbearance]
        kind: authorization
        condition: "A first plan lasts no more than forbearance_max_initial_months months, and the months of all plans on the loan, including this one, may not exceed forbearance_max_total_months."
        evidence_fields: [mortgage_loans.mortgage_loan_id, mortgage_loans.forbearance_months_used]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[mortgage_loans.mortgage_loan_id]]
          action_bindings: {mortgage_loans.mortgage_loan_id: mortgage_loan_id}
      - id: eligible_hardship
        applies_to: [mortgage_start_forbearance]
        kind: caller_fact
        condition: "The hardship must be one of the program's forbearance_eligible_hardships."
        evidence_fields: [mortgage_requests.mortgage_request_id, mortgage_requests.hardship_type, mortgage_requests.request_status]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[mortgage_requests.mortgage_request_id]]
          action_bindings: {mortgage_requests.mortgage_request_id: mortgage_request_id}
    params:
      per_tier:
        FHA 30-Year Fixed Mortgage: {initial: "=forbearance_max_initial_months", total: "=forbearance_max_total_months", hardships: "=forbearance_eligible_hardships"}
        VA 30-Year Fixed Mortgage: {initial: "=forbearance_max_initial_months", total: "=forbearance_max_total_months", hardships: "=forbearance_eligible_hardships"}
        Conventional 30-Year Fixed Mortgage: {initial: "=forbearance_max_initial_months", total: "=forbearance_max_total_months", hardships: "=forbearance_eligible_hardships"}
        Conventional 15-Year Fixed Mortgage: {initial: "=forbearance_max_initial_months", total: "=forbearance_max_total_months", hardships: "=forbearance_eligible_hardships"}
        7/6 SOFR Adjustable-Rate Mortgage: {initial: "=forbearance_max_initial_months", total: "=forbearance_max_total_months", hardships: "=forbearance_eligible_hardships"}
        Jumbo 30-Year Fixed Mortgage: {initial: "=forbearance_max_initial_months", total: "=forbearance_max_total_months", hardships: "=forbearance_eligible_hardships"}

  - id: mortgage_evt_recast
    subject: [mortgage_recast, mortgage_fee]
    rule: >-
      A recast re-amortizes the remaining principal over the remaining term at the note rate, lowering principal_interest_payment
      without changing the rate or maturity. It is available only where recast_allowed is true. Curtailments since the last
      recast, measured by mortgage_msr_curtailments_since_recast, must total at least recast_min_curtailment. The loan must be
      active and current. The recast_fee is assessed as fee_code recast through the recast's trigger. FHA, VA and adjustable
      loans cannot be recast; their borrowers may still make curtailments, which shorten the loan instead.
    eligibility:
      - id: enough_curtailment
        applies_to: [mortgage_recast]
        kind: authorization
        condition: "Curtailments since the last recast, measured by mortgage_msr_curtailments_since_recast, must total at least recast_min_curtailment."
        evidence_fields: [mortgage_transactions.mortgage_loan_id, mortgage_transactions.payment_type, mortgage_transactions.principal_portion]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[mortgage_transactions.mortgage_loan_id]]
          action_bindings: {mortgage_transactions.mortgage_loan_id: mortgage_loan_id}
    params:
      per_tier:
        FHA 30-Year Fixed Mortgage: {allowed: "=recast_allowed", min_curtail: "=recast_min_curtailment", fee: "=recast_fee"}
        VA 30-Year Fixed Mortgage: {allowed: "=recast_allowed", min_curtail: "=recast_min_curtailment", fee: "=recast_fee"}
        Conventional 30-Year Fixed Mortgage: {allowed: "=recast_allowed", min_curtail: "=recast_min_curtailment", fee: "=recast_fee"}
        Conventional 15-Year Fixed Mortgage: {allowed: "=recast_allowed", min_curtail: "=recast_min_curtailment", fee: "=recast_fee"}
        7/6 SOFR Adjustable-Rate Mortgage: {allowed: "=recast_allowed", min_curtail: "=recast_min_curtailment", fee: "=recast_fee"}
        Jumbo 30-Year Fixed Mortgage: {allowed: "=recast_allowed", min_curtail: "=recast_min_curtailment", fee: "=recast_fee"}
    measures: [mortgage_msr_curtailments_since_recast]

  - id: mortgage_evt_payoff_and_delinquency
    subject: [mortgage_pay_off, mortgage_become_delinquent, mortgage_cure]
    rule: >-
      A payoff statement is sent within payoff_statement_business_days business days of the request, free of charge as
      payoff_statement_fee is 0.00, showing principal, interest through the payoff date, fees due and any escrow advance. A
      payment of at least that amount posts as payment_type payoff and moves the loan to paid_off; the deed of trust
      satisfaction is recorded within lien_satisfaction_days calendar days and the escrow balance is refunded under
      mortgage_evt_escrow. The loan becomes delinquent when an installment is unpaid delinquency_days_threshold days after its
      due date. A delinquent loan returns to active once every past-due installment is paid. Foreclosure, short sale and
      deed-in-lieu decisions are outside this policy.
    eligibility:
      - id: delinquency_threshold
        applies_to: [mortgage_become_delinquent]
        kind: authorization
        condition: "The loan becomes delinquent when an installment is unpaid delinquency_days_threshold days after its due date."
        evidence_fields: [mortgage_loans.mortgage_loan_id, mortgage_loans.days_past_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[mortgage_loans.mortgage_loan_id]]
          action_bindings: {mortgage_loans.mortgage_loan_id: mortgage_loan_id}
    params:
      delinquency_days_threshold: 30
      per_tier:
        FHA 30-Year Fixed Mortgage: {statement_days: "=payoff_statement_business_days", statement_fee: "=payoff_statement_fee", satisfaction_days: "=lien_satisfaction_days"}
        VA 30-Year Fixed Mortgage: {statement_days: "=payoff_statement_business_days", statement_fee: "=payoff_statement_fee", satisfaction_days: "=lien_satisfaction_days"}
        Conventional 30-Year Fixed Mortgage: {statement_days: "=payoff_statement_business_days", statement_fee: "=payoff_statement_fee", satisfaction_days: "=lien_satisfaction_days"}
        Conventional 15-Year Fixed Mortgage: {statement_days: "=payoff_statement_business_days", statement_fee: "=payoff_statement_fee", satisfaction_days: "=lien_satisfaction_days"}
        7/6 SOFR Adjustable-Rate Mortgage: {statement_days: "=payoff_statement_business_days", statement_fee: "=payoff_statement_fee", satisfaction_days: "=lien_satisfaction_days"}
        Jumbo 30-Year Fixed Mortgage: {statement_days: "=payoff_statement_business_days", statement_fee: "=payoff_statement_fee", satisfaction_days: "=lien_satisfaction_days"}
