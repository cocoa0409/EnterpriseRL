events:
  - type: safebox_reserve
    target: safebox_rentals
    mutation: create
    meaning: "A customer reserves a box size at a branch and joins that branch's waitlist."
    grain: "One row per reservation."
    fields:
      customer_id: "The prospective lessee."
      variant_name: "Official box size reserved."
      status: "Always waitlisted at creation."
      branch: "Branch whose vault holds the box."
      opened_date: "Reservation date, the waitlist priority date."
      amount_due: "Always 0.00 at creation."
    triggers: []
  - type: safebox_assign
    target: safebox_rentals
    mutation: {transition: {from: waitlisted, to: active}}
    meaning: "An offered box is accepted, the lease signed and the keys issued."
    grain: "One row per lease start."
    fields:
      status: "Set to active."
      box_number: "Box number as engraved on the box door."
      lease_start_date: "Date the lease began."
      rent_due_date: "Date the next year's rent is due; the lease start date for the first year."
      keys_issued: "Keys issued."
    triggers:
      - event: "safebox:safebox_service_fee"
        map: {service_code: key_deposit, posted_date: lease_start_date}
  - type: safebox_offer
    target: safebox_rentals
    mutation: update
    meaning: "A box of the reserved size becomes free at the branch and is offered to the waitlisted customer next in priority."
    grain: "One row per offer made."
    fields:
      offer_date: "Date the offer was made; the hold period counts from it."
      box_number: "Number of the box offered."
    triggers: []
  - type: safebox_withdraw_reservation
    target: safebox_rentals
    mutation: {transition: {from: waitlisted, to: closed}}
    meaning: "A reservation ends without a lease, cancelled by the customer or lapsed after an unaccepted offer."
    grain: "One row per reservation ended."
    fields:
      status: "Set to closed."
      closed_date: "Date the reservation ended."
    triggers: []
  - type: safebox_become_past_due
    target: safebox_rentals
    mutation: {transition: {from: active, to: past_due}}
    meaning: "Rent is unpaid after the grace period."
    grain: "One row per past-due episode."
    fields:
      status: "Set to past_due."
    triggers: []
  - type: safebox_cure
    target: safebox_rentals
    mutation: {transition: [{from: past_due, to: active}, {from: drill_pending, to: active}]}
    meaning: "Everything due is paid and access is restored."
    grain: "One row per cure."
    fields:
      status: "Set to active."
      drill_notice_date: "Cleared to empty."
    triggers: []
  - type: safebox_schedule_drilling
    target: safebox_rentals
    mutation: {transition: {from: past_due, to: drill_pending}}
    meaning: "The drilling notice is mailed to a long-unpaid rental."
    grain: "One row per drilling notice."
    fields:
      status: "Set to drill_pending."
      drill_notice_date: "Date the certified notice was mailed."
    triggers: []
  - type: safebox_surrender
    target: safebox_rentals
    mutation: {transition: {from: active, to: closed}}
    meaning: "The lessee empties and surrenders the box and returns the keys."
    grain: "One row per surrender."
    fields:
      status: "Set to closed."
      closed_date: "Surrender date."
      keys_returned: "Keys returned at surrender."
    triggers: []
  - type: safebox_drill_close
    target: safebox_rentals
    mutation: {transition: {from: drill_pending, to: closed}}
    meaning: "The box is drilled, its contents inventoried and stored, and the lease ends."
    grain: "One row per forced opening."
    fields:
      status: "Set to closed."
      closed_date: "Drilling date."
    triggers:
      - event: "safebox:safebox_service_fee"
        map: {service_code: drilling, posted_date: closed_date}
  - type: safebox_update_access_list
    target: safebox_rentals
    mutation: update
    meaning: "The lessee adds or removes a co-lessee or deputies."
    grain: "One row per access list change."
    fields:
      co_lessee_name: "Full name of the co-lessee, or empty."
      deputy_names: "Full names of deputies, separated by semicolons, or empty."
    triggers: []
  - type: safebox_set_autopay
    target: safebox_rentals
    mutation: update
    meaning: "Automatic annual rent payment from a PCB checking account is set or removed."
    grain: "One row per autopay change."
    fields:
      autopay_checking_account_id: "Paying checking account, or empty."
    triggers: []
  - type: safebox_change_size
    target: safebox_rentals
    mutation: update
    meaning: "The lessee moves to a box of another size at the same branch under the same rental."
    grain: "One row per size change."
    fields:
      variant_name: "New box size."
      box_number: "New box number."
      rent_due_date: "Unchanged anniversary; the new size's rent applies from the move date."
    triggers: []
  - type: safebox_rent_charge
    target: safebox_transactions
    meaning: "A year's rent is charged on the rent due date, net of the applicable discount."
    grain: "One row per rental year charged."
    distinguish_by: [rent_period_start]
    fields:
      amount: "Net rent charged."
      posted_date: "Rent due date."
      rent_period_start: "First day of the rental year charged."
      rent_period_end: "Last day of the rental year charged."
      discount_type: "Discount applied."
      discount_pct: "Discount percent applied."
    account: safebox_amount_due
    direction: in
    triggers: []
  - type: safebox_rent_payment
    target: safebox_transactions
    meaning: "The lessee pays rent or fees."
    grain: "One row per payment, identified by its reference number."
    distinguish_by: [reference_number]
    fields:
      amount: "Amount paid."
      posted_date: "Date paid."
      payment_method: "How it was paid."
      reference_number: "Payment reference number."
      counterparty_account_id: "Paying PCB checking account, otherwise empty."
    account: safebox_amount_due
    direction: out
    triggers:
      - event: "checking:checking_debit"
        when: {payment_method: [pcb_checking_autopay, pcb_checking_transfer]}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: safebox_rental_id}
  - type: safebox_late_fee
    target: safebox_transactions
    meaning: "A late fee is charged for a year's rent unpaid after the grace period."
    grain: "One row per rental year paid late."
    distinguish_by: [rent_period_start]
    fields:
      amount: "Late fee."
      posted_date: "First day after the grace period."
      rent_period_start: "Rental year whose rent was late."
    account: safebox_amount_due
    direction: in
    triggers: []
  - type: safebox_service_fee
    target: safebox_transactions
    meaning: "A service charge is made: key deposit, lock change, drilling, drilled contents retrieval or after-hours access."
    grain: "One row per service performed."
    distinguish_by: [service_code, posted_date]
    fields:
      amount: "Charge amount."
      posted_date: "Date of the service."
      service_code: "Which service."
    account: safebox_amount_due
    direction: in
    triggers: []
  - type: safebox_rent_credit
    target: safebox_transactions
    meaning: "A credit reduces what is owed: prorated rent refund, key deposit refund, size change credit, or a fee waived."
    grain: "One row per credit, tied to the charge it offsets."
    distinguish_by: [credit_reason, source_item_id]
    fields:
      amount: "Credit amount."
      posted_date: "Date credited."
      credit_reason: "Why the credit was given."
      source_item_id: "The rent charge, fee or deposit being credited."
      refund_destination: "Where a resulting credit balance was paid out."
      counterparty_account_id: "PCB checking account credited, otherwise empty."
    account: safebox_amount_due
    direction: out
    triggers:
      - event: "checking:checking_deposit"
        when: {refund_destination: checking}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: safebox_rental_id}
  - type: safebox_access
    target: safebox_access_log
    meaning: "A person enters the vault and opens the box."
    grain: "One row per vault entry."
    distinguish_by: [access_date, access_time]
    fields:
      access_date: "Date of the entry."
      access_time: "Time the entry was signed in."
      accessor_role: "lessee, co_lessee or deputy."
      accessor_name: "Name of the person as on the photo identification presented."
    triggers: []

measures:
  - id: safebox_msr_open_rentals
    window: "The frozen date."
    measure: "Count of the customer's rentals in waitlisted, active, past_due or drill_pending status, overall and by variant_name."
  - id: safebox_msr_open_reservations
    window: "The frozen date."
    measure: "Count of the customer's rentals in waitlisted status."
  - id: safebox_msr_unused_whole_months
    window: "From the surrender or move date to the end of the paid rental period."
    measure: "Whole calendar months remaining after the month containing the surrender or move date up to the end of the latest rental year charged and paid."
  - id: safebox_msr_late_fee_courtesy_365d
    window: "Rolling 365 calendar days ending on the frozen date."
    measure: "Count of safebox_rent_credit rows with credit_reason courtesy_waiver on the customer's rentals."
  - id: safebox_msr_discount_candidates
    window: "The rent due date."
    measure: "The discounts the lessee qualifies for on that date: the relationship discount for each active checking tier held, the senior discount, and the employee discount, with their percents."

policies:
  - id: safebox_agg_multi_holding
    subject: [safebox_reserve]
    rule: >-
      A customer may rent more than one box. The count of the customer's rentals in waitlisted, active, past_due or
      drill_pending status must be below max_per_customer before a new reservation is recorded. The count for the requested
      size must be below max_rentals_this_tier, and open reservations measured by safebox_msr_open_reservations must be below
      waitlist_max_per_customer. A customer with a rental in drill_pending status cannot reserve another box.
    eligibility:
      - id: portfolio_cap
        applies_to: [safebox_reserve]
        kind: authorization
        condition: "The count of the customer's rentals in waitlisted, active, past_due or drill_pending status must be below max_per_customer before a new reservation is recorded."
        evidence_fields: [safebox_rentals.customer_id, safebox_rentals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safebox_rentals.customer_id]]
          action_bindings: {safebox_rentals.customer_id: customer_id}
    params:
      max_per_customer: 3
      per_tier:
        3x5 Safe Deposit Box: {tier_cap: "=max_rentals_this_tier", reservations: "=waitlist_max_per_customer"}
        3x10 Safe Deposit Box: {tier_cap: "=max_rentals_this_tier", reservations: "=waitlist_max_per_customer"}
        5x10 Safe Deposit Box: {tier_cap: "=max_rentals_this_tier", reservations: "=waitlist_max_per_customer"}
        10x10 Safe Deposit Box: {tier_cap: "=max_rentals_this_tier", reservations: "=waitlist_max_per_customer"}
        10x15 Safe Deposit Box: {tier_cap: "=max_rentals_this_tier", reservations: "=waitlist_max_per_customer"}
        10x20 Safe Deposit Box: {tier_cap: "=max_rentals_this_tier", reservations: "=waitlist_max_per_customer"}
    measures: [safebox_msr_open_rentals, safebox_msr_open_reservations]

  - id: safebox_agg_discount_allocation
    subject: [safebox_rent_charge]
    rule: >-
      Discounts are allocated across the customer's rentals, not per box. Holding an active Premier Checking or Private Client
      Checking account earns relationship_discount_pct_by_checking_tier on one rental only: the customer's active or past_due
      rental with the highest annual rent before discount, ties to the earliest lease_start_date. The senior discount applies
      when the lessee is at least senior_discount_age on the rent due date and the employee discount applies to active PCB
      employees; each may apply to every rental. Under discount_stacking_rule best_single only the largest discount available
      to a given rental, from safebox_msr_discount_candidates, is applied; discounts never add together. The discount is fixed
      when the year's rent is charged and not changed by holdings opened or closed later in that rental year.
    eligibility: []
    params:
      per_tier:
        3x5 Safe Deposit Box: {relationship: "=relationship_discount_pct_by_checking_tier", senior: "=senior_discount_pct", senior_age: "=senior_discount_age", employee: "=employee_discount_pct", stacking: "=discount_stacking_rule"}
        3x10 Safe Deposit Box: {relationship: "=relationship_discount_pct_by_checking_tier", senior: "=senior_discount_pct", senior_age: "=senior_discount_age", employee: "=employee_discount_pct", stacking: "=discount_stacking_rule"}
        5x10 Safe Deposit Box: {relationship: "=relationship_discount_pct_by_checking_tier", senior: "=senior_discount_pct", senior_age: "=senior_discount_age", employee: "=employee_discount_pct", stacking: "=discount_stacking_rule"}
        10x10 Safe Deposit Box: {relationship: "=relationship_discount_pct_by_checking_tier", senior: "=senior_discount_pct", senior_age: "=senior_discount_age", employee: "=employee_discount_pct", stacking: "=discount_stacking_rule"}
        10x15 Safe Deposit Box: {relationship: "=relationship_discount_pct_by_checking_tier", senior: "=senior_discount_pct", senior_age: "=senior_discount_age", employee: "=employee_discount_pct", stacking: "=discount_stacking_rule"}
        10x20 Safe Deposit Box: {relationship: "=relationship_discount_pct_by_checking_tier", senior: "=senior_discount_pct", senior_age: "=senior_discount_age", employee: "=employee_discount_pct", stacking: "=discount_stacking_rule"}
    measures: [safebox_msr_discount_candidates]

  - id: safebox_reservation_and_lease
    subject: [safebox_reserve, safebox_offer, safebox_assign, safebox_withdraw_reservation, safebox_service_fee]
    rule: >-
      The customer must be at least min_age_to_rent years old on the reservation date. A size can be reserved only at a branch
      where branch_availability is true for that size. Waitlisted customers are offered boxes in the order of
      waitlist_priority_basis, earliest reservation first, and never ahead of an earlier reservation for the same size and
      branch. An offered box is held for the customer only within waitlist_offer_hold_days calendar days after the offer.
      Count calendar days with the day after offer_date as day 1; the customer may accept while the frozen date is on or before
      offer_date plus waitlist_offer_hold_days, after which the reservation lapses. On acceptance the lease is signed by the
      lessee, keys_issued_count keys are issued, the key_deposit is charged as a service fee with service_code key_deposit,
      and the first year's rent is charged on the lease start date. The bank does not insure contents since
      contents_insured_by_bank is false, and questions about insuring contents are referred to the customer's own insurer.
    eligibility:
      - id: age_gate
        applies_to: [safebox_reserve]
        kind: authorization
        condition: "The customer must be at least min_age_to_rent years old on the reservation date."
        evidence_fields: [customers.customer_id, customers.date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
      - id: offer_hold
        applies_to: [safebox_assign]
        kind: time
        condition: "An offered box is held for the customer only within waitlist_offer_hold_days calendar days after the offer."
        evidence_fields: [safebox_rentals.safebox_rental_id, safebox_rentals.offer_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safebox_rentals.safebox_rental_id]]
          action_bindings: {safebox_rentals.safebox_rental_id: safebox_rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the offer"
          anchor_source: safebox_rentals.offer_date
          relation: not_after
          duration_source: variants.waitlist_offer_hold_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after offer_date as day 1; the customer may accept while the frozen date is on or before offer_date plus waitlist_offer_hold_days, after which the reservation lapses."
          boundary: inclusive
    params:
      per_tier:
        3x5 Safe Deposit Box: {min_age: "=min_age_to_rent", availability: "=branch_availability", hold_days: "=waitlist_offer_hold_days", keys: "=keys_issued_count", deposit: "=key_deposit"}
        3x10 Safe Deposit Box: {min_age: "=min_age_to_rent", availability: "=branch_availability", hold_days: "=waitlist_offer_hold_days", keys: "=keys_issued_count", deposit: "=key_deposit"}
        5x10 Safe Deposit Box: {min_age: "=min_age_to_rent", availability: "=branch_availability", hold_days: "=waitlist_offer_hold_days", keys: "=keys_issued_count", deposit: "=key_deposit"}
        10x10 Safe Deposit Box: {min_age: "=min_age_to_rent", availability: "=branch_availability", hold_days: "=waitlist_offer_hold_days", keys: "=keys_issued_count", deposit: "=key_deposit"}
        10x15 Safe Deposit Box: {min_age: "=min_age_to_rent", availability: "=branch_availability", hold_days: "=waitlist_offer_hold_days", keys: "=keys_issued_count", deposit: "=key_deposit"}
        10x20 Safe Deposit Box: {min_age: "=min_age_to_rent", availability: "=branch_availability", hold_days: "=waitlist_offer_hold_days", keys: "=keys_issued_count", deposit: "=key_deposit"}

  - id: safebox_evt_rent
    subject: [safebox_rent_charge, safebox_rent_payment, safebox_set_autopay]
    rule: >-
      Rent is charged once per rental year of rent_term_months months, in advance, on rent_due_date, and the lease renews
      automatically while lease_auto_renewal is true. The gross rent is annual_rent_base increased or reduced by
      branch_rent_adjustment_pct for the rental's branch, rounded half-up to the cent; the net rent charged is the gross rent
      less the single discount chosen under safebox_agg_discount_allocation, rounded half-up to the cent. A rent notice is sent
      annual_rent_due_notice_days days before each due date, and a rent change takes effect only at a renewal at least
      rent_change_notice_days days after notice. Up to max_prepaid_years years may be paid in advance, and years after the
      current one receive multi_year_prepay_discount_pct off their net rent. Rent may be paid by any of rent_payment_methods;
      autopay debits the named checking account on the due date. The autopay account must be a checking account of the same
      customer in active status.
    eligibility:
      - id: autopay_account
        applies_to: [safebox_set_autopay]
        kind: authorization
        condition: "The autopay account must be a checking account of the same customer in active status."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.customer_id, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: autopay_checking_account_id}
    formula:
      gross_rent: "round(annual_rent_base * (1 + branch_rent_adjustment_pct / 100), 2)"
      net_rent: "round(gross_rent * (1 - discount_pct / 100), 2)"
    params:
      per_tier:
        3x5 Safe Deposit Box: {base: "=annual_rent_base", branch_adj: "=branch_rent_adjustment_pct", term: "=rent_term_months", prepay_years: "=max_prepaid_years", prepay_pct: "=multi_year_prepay_discount_pct", methods: "=rent_payment_methods"}
        3x10 Safe Deposit Box: {base: "=annual_rent_base", branch_adj: "=branch_rent_adjustment_pct", term: "=rent_term_months", prepay_years: "=max_prepaid_years", prepay_pct: "=multi_year_prepay_discount_pct", methods: "=rent_payment_methods"}
        5x10 Safe Deposit Box: {base: "=annual_rent_base", branch_adj: "=branch_rent_adjustment_pct", term: "=rent_term_months", prepay_years: "=max_prepaid_years", prepay_pct: "=multi_year_prepay_discount_pct", methods: "=rent_payment_methods"}
        10x10 Safe Deposit Box: {base: "=annual_rent_base", branch_adj: "=branch_rent_adjustment_pct", term: "=rent_term_months", prepay_years: "=max_prepaid_years", prepay_pct: "=multi_year_prepay_discount_pct", methods: "=rent_payment_methods"}
        10x15 Safe Deposit Box: {base: "=annual_rent_base", branch_adj: "=branch_rent_adjustment_pct", term: "=rent_term_months", prepay_years: "=max_prepaid_years", prepay_pct: "=multi_year_prepay_discount_pct", methods: "=rent_payment_methods"}
        10x20 Safe Deposit Box: {base: "=annual_rent_base", branch_adj: "=branch_rent_adjustment_pct", term: "=rent_term_months", prepay_years: "=max_prepaid_years", prepay_pct: "=multi_year_prepay_discount_pct", methods: "=rent_payment_methods"}

  - id: safebox_evt_late_rent
    subject: [safebox_late_fee, safebox_become_past_due, safebox_cure]
    rule: >-
      A year's rent unpaid within late_fee_grace_days calendar days after the rent due date incurs the late fee and makes the
      rental past_due. Count calendar days with the day after rent_due_date as day 1; the late fee and past_due status apply
      when the rent is still unpaid after the end of the last grace day. One late fee is charged per rental year, however long
      the rent stays unpaid. While past_due or drill_pending, vault access is refused when access_blocked_when_past_due is
      true. Paying everything due returns the rental to active. A late fee charged contrary to this policy, or granted as a
      courtesy while safebox_msr_late_fee_courtesy_365d is below courtesy_late_fee_waivers_365d, is credited under
      safebox_evt_credits.
    eligibility:
      - id: grace_elapsed
        applies_to: [safebox_late_fee, safebox_become_past_due]
        kind: time
        condition: "A year's rent unpaid within late_fee_grace_days calendar days after the rent due date incurs the late fee and makes the rental past_due."
        evidence_fields: [safebox_rentals.safebox_rental_id, safebox_rentals.rent_due_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safebox_rentals.safebox_rental_id]]
          action_bindings: {safebox_rentals.safebox_rental_id: safebox_rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the rent due date"
          anchor_source: safebox_rentals.rent_due_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after rent_due_date as day 1; the late fee and past_due status apply when the rent is still unpaid after the end of the last grace day."
          boundary: exclusive
    params:
      per_tier:
        3x5 Safe Deposit Box: {fee: "=late_fee", grace: "=late_fee_grace_days", blocked: "=access_blocked_when_past_due"}
        3x10 Safe Deposit Box: {fee: "=late_fee", grace: "=late_fee_grace_days", blocked: "=access_blocked_when_past_due"}
        5x10 Safe Deposit Box: {fee: "=late_fee", grace: "=late_fee_grace_days", blocked: "=access_blocked_when_past_due"}
        10x10 Safe Deposit Box: {fee: "=late_fee", grace: "=late_fee_grace_days", blocked: "=access_blocked_when_past_due"}
        10x15 Safe Deposit Box: {fee: "=late_fee", grace: "=late_fee_grace_days", blocked: "=access_blocked_when_past_due"}
        10x20 Safe Deposit Box: {fee: "=late_fee", grace: "=late_fee_grace_days", blocked: "=access_blocked_when_past_due"}
    measures: [safebox_msr_late_fee_courtesy_365d]

  - id: safebox_evt_drilling
    subject: [safebox_schedule_drilling, safebox_drill_close, safebox_service_fee]
    rule: >-
      When rent remains unpaid drill_eligible_days_past_due days after the rent due date, the drilling notice is sent by
      drilling_notice_method to the address on file and the rental becomes drill_pending. The box may be drilled only after
      drill_notice_days_before calendar days have passed since the drilling notice was mailed. Count calendar days with the
      day after drill_notice_date as day 1; drilling is allowed when the frozen date is on or after drill_notice_date plus
      drill_notice_days_before. Drilling is done under dual control with a witness, the contents are inventoried and sealed,
      drilling_fee is charged with service_code drilling, and the lease ends. Contents are held drilled_contents_hold_months
      months and may be retrieved by the former lessee on paying everything due plus drilled_contents_storage_fee; after that
      they are reported to the state unclaimed property program, which is outside this policy. Paying everything due before
      the drilling date returns the rental to active.
    eligibility:
      - id: notice_period
        applies_to: [safebox_drill_close]
        kind: time
        condition: "The box may be drilled only after drill_notice_days_before calendar days have passed since the drilling notice was mailed."
        evidence_fields: [safebox_rentals.safebox_rental_id, safebox_rentals.drill_notice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safebox_rentals.safebox_rental_id]]
          action_bindings: {safebox_rentals.safebox_rental_id: safebox_rental_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the drilling notice was mailed"
          anchor_source: safebox_rentals.drill_notice_date
          relation: not_before
          duration_source: variants.drill_notice_days_before
          unit: calendar_days
          counting_rule: "Count calendar days with the day after drill_notice_date as day 1; drilling is allowed when the frozen date is on or after drill_notice_date plus drill_notice_days_before."
          boundary: inclusive
    params:
      per_tier:
        3x5 Safe Deposit Box: {eligible_dpd: "=drill_eligible_days_past_due", notice_days: "=drill_notice_days_before", fee: "=drilling_fee", hold_months: "=drilled_contents_hold_months", storage_fee: "=drilled_contents_storage_fee", method: "=drilling_notice_method"}
        3x10 Safe Deposit Box: {eligible_dpd: "=drill_eligible_days_past_due", notice_days: "=drill_notice_days_before", fee: "=drilling_fee", hold_months: "=drilled_contents_hold_months", storage_fee: "=drilled_contents_storage_fee", method: "=drilling_notice_method"}
        5x10 Safe Deposit Box: {eligible_dpd: "=drill_eligible_days_past_due", notice_days: "=drill_notice_days_before", fee: "=drilling_fee", hold_months: "=drilled_contents_hold_months", storage_fee: "=drilled_contents_storage_fee", method: "=drilling_notice_method"}
        10x10 Safe Deposit Box: {eligible_dpd: "=drill_eligible_days_past_due", notice_days: "=drill_notice_days_before", fee: "=drilling_fee", hold_months: "=drilled_contents_hold_months", storage_fee: "=drilled_contents_storage_fee", method: "=drilling_notice_method"}
        10x15 Safe Deposit Box: {eligible_dpd: "=drill_eligible_days_past_due", notice_days: "=drill_notice_days_before", fee: "=drilling_fee", hold_months: "=drilled_contents_hold_months", storage_fee: "=drilled_contents_storage_fee", method: "=drilling_notice_method"}
        10x20 Safe Deposit Box: {eligible_dpd: "=drill_eligible_days_past_due", notice_days: "=drill_notice_days_before", fee: "=drilling_fee", hold_months: "=drilled_contents_hold_months", storage_fee: "=drilled_contents_storage_fee", method: "=drilling_notice_method"}

  - id: safebox_evt_access_and_keys
    subject: [safebox_access, safebox_service_fee, safebox_update_access_list]
    rule: >-
      Only the lessee, a co-lessee and named deputies may enter the vault, each presenting government photo identification when
      access_requires_government_id is true; the entry is logged with the name exactly as on that identification. Vault access
      is allowed only while the rental is active. Opening needs both the bank's guard key and the lessee's key under
      dual_control_required. Access is during branch lobby hours; after-hours access by appointment exists only where
      after_hours_access_available is true and incurs after_hours_access_fee with service_code after_hours_access. A rental has
      at most max_co_lessees co-lessee and max_deputies deputies, changed only on the lessee's own signed instruction and at
      co_lessee_add_fee. A lost key requires a lock change at lock_change_fee with service_code lock_change; when every key is
      lost the box is drilled at drilling_fee and the lock changed at lock_change_fee. Keys are never duplicated.
    eligibility:
      - id: active_for_access
        applies_to: [safebox_access]
        kind: state
        condition: "Vault access is allowed only while the rental is active."
        evidence_fields: [safebox_rentals.safebox_rental_id, safebox_rentals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safebox_rentals.safebox_rental_id]]
          action_bindings: {safebox_rentals.safebox_rental_id: safebox_rental_id}
        state_contract:
          field: safebox_rentals.status
          allowed: [active]
    params:
      per_tier:
        3x5 Safe Deposit Box: {co_lessees: "=max_co_lessees", deputies: "=max_deputies", lock_fee: "=lock_change_fee", drill_fee: "=drilling_fee", after_hours: "=after_hours_access_available", after_hours_fee: "=after_hours_access_fee", id_required: "=access_requires_government_id", dual_control: "=dual_control_required", co_fee: "=co_lessee_add_fee", hours: "=access_hours_basis"}
