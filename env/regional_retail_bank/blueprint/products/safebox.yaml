# Policy charter: Safe Deposit Boxes. Piedmont Crescent Bank, N.A.
# Single registry of every safe deposit box number; the runtime never reads this file.

category: safebox
display_name: Safe Deposit Boxes

binding:
  holding_table: safebox_rentals
  event_tables: [safebox_transactions, safebox_access_log]
  intake_tables: [safebox_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {amount_due: safebox_amount_due}

lifecycle:
  states: [waitlisted, active, past_due, drill_pending, closed]
  transitions:
    - {from: waitlisted, to: active, by: agent, means: "A box of the reserved size became available at the branch, the customer accepted it and signed the lease, and keys were issued."}
    - {from: waitlisted, to: closed, by: user, means: "The customer cancelled the reservation."}
    - {from: waitlisted, to: closed, by: system, means: "The customer did not accept an offered box within the offer hold period."}
    - {from: active, to: past_due, by: system, means: "Annual rent remained unpaid past the grace period."}
    - {from: past_due, to: active, by: system, means: "All rent and fees due were paid."}
    - {from: past_due, to: drill_pending, by: system, means: "Rent stayed unpaid long enough that the drilling notice was mailed."}
    - {from: drill_pending, to: active, by: system, means: "Everything due was paid before the drilling date."}
    - {from: active, to: closed, by: user, means: "The lessee surrendered the box and returned the keys."}
    - {from: drill_pending, to: closed, by: system, means: "The box was drilled under dual control, its contents inventoried and moved to storage, and the lease ended."}

accounts:
  - key: safebox_amount_due
    unit: USD
    meaning: "What the lessee owes on one box rental: rent, late fees and service fees charged, less payments and credits; negative is a credit owed to the lessee."

parameter_schema:
  box_height_in: "Interior height of the box; inches."
  box_width_in: "Interior width of the box; inches."
  box_depth_in: "Interior depth of the box; inches."
  annual_rent_base: "Annual rent before branch adjustment and discounts; USD."
  branch_rent_adjustment_pct: "Percent added to or taken from the base rent by branch; mapping of branch name to percent."
  branch_availability: "Whether this box size is installed at each branch; mapping of branch name to boolean."
  relationship_discount_pct_by_checking_tier: "Rent discount for holding an active checking account of a listed tier; mapping of official checking tier name to percent."
  senior_discount_pct: "Rent discount for lessees at least senior_discount_age on the rent due date; percent."
  senior_discount_age: "Age in whole years for the senior discount; integer years."
  employee_discount_pct: "Rent discount for active PCB employees; percent."
  discount_stacking_rule: "How discounts combine; 'best_single' means only the largest applicable discount is applied."
  rent_term_months: "Length of one rental term; integer months."
  lease_auto_renewal: "Whether the lease renews automatically at the end of each term; boolean."
  annual_rent_due_notice_days: "Calendar days before the rent due date that the rent notice is sent; integer days."
  rent_change_notice_days: "Calendar days of notice before a rent change takes effect at renewal; integer days."
  max_prepaid_years: "Most rental years that may be paid in advance; integer years."
  multi_year_prepay_discount_pct: "Discount on rent for years prepaid beyond the current one; percent."
  rent_payment_methods: "Ways rent may be paid; list."
  late_fee: "Fee when a year's rent is unpaid after the grace period; USD."
  late_fee_grace_days: "Calendar days after the rent due date before the late fee applies and the rental becomes past due; integer days."
  access_blocked_when_past_due: "Whether vault access is refused while the rental is past_due or drill_pending; boolean."
  drill_eligible_days_past_due: "Days after the rent due date at which the drilling notice is mailed; integer days."
  drill_notice_days_before: "Calendar days between the drilling notice and the earliest drilling date; integer days."
  drilling_notice_method: "How the drilling notice is sent; 'certified_mail'."
  drilling_fee: "Fee for forced opening of the box; USD."
  lock_change_fee: "Fee for changing the lock after a key is lost or not returned; USD."
  keys_issued_count: "Keys issued at lease start; integer count."
  key_deposit: "Refundable deposit charged when keys are issued; USD."
  max_co_lessees: "Most co-lessees on one rental; integer count."
  max_deputies: "Most deputies authorized to access the box; integer count."
  co_lessee_add_fee: "Fee to add a co-lessee; USD."
  access_requires_government_id: "Whether every vault entry requires government photo identification; boolean."
  dual_control_required: "Whether the bank's guard key and the lessee's key are both needed to open the box; boolean."
  proration_refund_on_surrender: "Whether unused whole months of paid rent are refunded on surrender; boolean."
  first_year_rent_refundable: "Whether rent for the first rental year is refundable on surrender; boolean."
  waitlist_offer_hold_days: "Calendar days an offered box is held for a waitlisted customer; integer days."
  waitlist_priority_basis: "Order in which waitlisted customers are offered boxes; 'reservation_date'."
  waitlist_max_per_customer: "Most open reservations one customer may hold; integer count."
  max_rentals_this_tier: "Most rentals of this size one customer may hold, reservations included; integer count."
  contents_insured_by_bank: "Whether the bank insures box contents; boolean."
  drilled_contents_hold_months: "Months drilled contents are held before being reported to the state unclaimed property program; integer months."
  drilled_contents_storage_fee: "Fee to retrieve contents held after drilling; USD."
  size_change_credit_unused_rent: "Whether unused whole months of rent are credited when moving to another size; boolean."
  size_change_fee: "Fee to move to another box size; USD."
  min_age_to_rent: "Youngest age in whole years at which a customer may lease a box; integer years."
  courtesy_late_fee_waivers_365d: "Courtesy late fee waivers per customer in a rolling 365 days; integer count."
  access_hours_basis: "When the vault may be entered: 'branch_lobby_hours'."
  after_hours_access_available: "Whether access by appointment outside lobby hours is offered; boolean."
  after_hours_access_fee: "Fee per after-hours access appointment; USD, or 'not_applicable'."

