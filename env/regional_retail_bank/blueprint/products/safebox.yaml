  - id: safebox_evt_surrender_and_size_change
    subject: [safebox_surrender, safebox_change_size, safebox_rent_credit]
    rule: >-
      Surrendering a box is the lessee's own decision, made in person with the box emptied and the keys returned. Everything due
      must be paid before a box is surrendered or moved. On surrender, when proration_refund_on_surrender is true, rent for
      the whole unused months measured by safebox_msr_unused_whole_months is credited at the year's net rent divided by
      rent_term_months per month, rounded half-up to the cent, except that rent for the first rental year is never refunded because
      first_year_rent_refundable is false. The key deposit is credited back only when all keys_issued keys are returned;
      otherwise lock_change_fee is charged instead. A resulting credit balance is paid to a PCB checking account of the lessee or
      by official check. Moving to another size at the same branch keeps the anniversary: when size_change_credit_unused_rent
      is true the unused whole months of the old box's rent are credited, the new box's net rent is charged for the same
      months, and size_change_fee applies.
    eligibility:
      - id: nothing_due
        applies_to: [safebox_surrender, safebox_change_size]
        kind: authorization
        condition: "Everything due must be paid before a box is surrendered or moved."
        evidence_fields: [safebox_rentals.safebox_rental_id, safebox_rentals.amount_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safebox_rentals.safebox_rental_id]]
          action_bindings: {safebox_rentals.safebox_rental_id: safebox_rental_id}
    params:
      per_tier:
        3x5 Safe Deposit Box: {prorate: "=proration_refund_on_surrender", first_year: "=first_year_rent_refundable", deposit: "=key_deposit", lock_fee: "=lock_change_fee", size_credit: "=size_change_credit_unused_rent", size_fee: "=size_change_fee"}
        3x10 Safe Deposit Box: {prorate: "=proration_refund_on_surrender", first_year: "=first_year_rent_refundable", deposit: "=key_deposit", lock_fee: "=lock_change_fee", size_credit: "=size_change_credit_unused_rent", size_fee: "=size_change_fee"}
        5x10 Safe Deposit Box: {prorate: "=proration_refund_on_surrender", first_year: "=first_year_rent_refundable", deposit: "=key_deposit", lock_fee: "=lock_change_fee", size_credit: "=size_change_credit_unused_rent", size_fee: "=size_change_fee"}
        10x10 Safe Deposit Box: {prorate: "=proration_refund_on_surrender", first_year: "=first_year_rent_refundable", deposit: "=key_deposit", lock_fee: "=lock_change_fee", size_credit: "=size_change_credit_unused_rent", size_fee: "=size_change_fee"}
        10x15 Safe Deposit Box: {prorate: "=proration_refund_on_surrender", first_year: "=first_year_rent_refundable", deposit: "=key_deposit", lock_fee: "=lock_change_fee", size_credit: "=size_change_credit_unused_rent", size_fee: "=size_change_fee"}
        10x20 Safe Deposit Box: {prorate: "=proration_refund_on_surrender", first_year: "=first_year_rent_refundable", deposit: "=key_deposit", lock_fee: "=lock_change_fee", size_credit: "=size_change_credit_unused_rent", size_fee: "=size_change_fee"}
    measures: [safebox_msr_unused_whole_months]

  - id: safebox_evt_credits
    subject: [safebox_rent_credit]
    rule: >-
      Every credit is tied by source_item_id to the one charge it offsets and never exceeds it. A bank_error credit reverses a
      charge made contrary to this charter, such as rent at the wrong branch adjustment or without the discount the lessee
      qualified for, or a late fee on rent paid within the grace days; it has no limit. A courtesy_waiver credit applies only to
      a late fee and only while safebox_msr_late_fee_courtesy_365d is below courtesy_late_fee_waivers_365d. A charge can be
      credited at most once for the same reason. Proration, key deposit and size change credits follow
      safebox_evt_surrender_and_size_change.
    eligibility:
      - id: credit_once
        applies_to: [safebox_rent_credit]
        kind: dedup
        condition: "A charge can be credited at most once for the same reason."
        evidence_fields: [safebox_transactions.source_item_id, safebox_transactions.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[safebox_transactions.source_item_id]]
          action_bindings: {safebox_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: safebox_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [safebox_rent_credit]}
          distinct_fields: [credit_reason]
    params:
      per_tier:
        3x5 Safe Deposit Box: {courtesy: "=courtesy_late_fee_waivers_365d"}
        3x10 Safe Deposit Box: {courtesy: "=courtesy_late_fee_waivers_365d"}
        5x10 Safe Deposit Box: {courtesy: "=courtesy_late_fee_waivers_365d"}
        10x10 Safe Deposit Box: {courtesy: "=courtesy_late_fee_waivers_365d"}
        10x15 Safe Deposit Box: {courtesy: "=courtesy_late_fee_waivers_365d"}
        10x20 Safe Deposit Box: {courtesy: "=courtesy_late_fee_waivers_365d"}
    measures: [safebox_msr_late_fee_courtesy_365d]
