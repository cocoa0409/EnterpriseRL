events:
  # ---------------- holding writes (savings_accounts) ----------------
  - type: savings_open
    target: savings_accounts
    mutation: create
    meaning: "A new savings or money market account is opened in one tier and awaits its opening deposit."
    grain: "One row per account opened."
    fields:
      customer_id: "The owner."
      variant_name: "Official tier name chosen at opening."
      status: "Always applied at creation."
      account_number_last4: "Last four digits of the account number assigned at opening."
      opened_date: "Date the account was opened."
      current_balance: "Always 0.00 at creation."
      statement_cycle_day: "Day of month on which the statement cycle closes."
      statement_delivery: "Statement delivery method chosen at opening."
      promo_end_date: "For a tier that offers a promotional APY, opened_date plus promo_duration_months calendar months; empty otherwise."
    triggers: []
  - type: savings_activate
    target: savings_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: "The opening deposit posted and the account became active."
    grain: "One row per activation."
    fields:
      status: "Set to active."
      last_customer_activity_date: "Set to the posted date of the opening deposit."
    triggers: []
  - type: savings_lapse_unfunded
    target: savings_accounts
    mutation: {transition: {from: applied, to: closed}}
    meaning: "An account never funded within the funding window is closed."
    grain: "One row per unfunded account closed."
    fields:
      status: "Set to closed."
      closed_date: "Date the unfunded account was closed."
    triggers: []
  - type: savings_go_dormant
    target: savings_accounts
    mutation: {transition: {from: active, to: dormant}}
    meaning: "The account is classified dormant after the inactivity period."
    grain: "One row per dormancy classification."
    fields:
      status: "Set to dormant."
    triggers: []
  - type: savings_reactivate
    target: savings_accounts
    mutation: {transition: {from: dormant, to: active}}
    meaning: "A dormant account returns to active after verified owner contact and a customer-initiated transaction."
    grain: "One row per reactivation."
    fields:
      status: "Set to active."
      last_customer_activity_date: "Set to the date of the reactivating transaction."
    triggers: []
  - type: savings_close
    target: savings_accounts
    mutation: {transition: [{from: active, to: closed}, {from: dormant, to: closed}]}
    meaning: "The account is closed at the owner's confirmed request after its balance was paid out."
    grain: "One row per closure."
    fields:
      status: "Set to closed."
      closed_date: "Date the account closed."
      automatic_transfer_amount: "Set to 0.00; a closed account keeps no automatic transfer."
      funding_checking_account_id: "Cleared to empty."
    triggers: []
  - type: savings_change_product
    target: savings_accounts
    mutation: update
    meaning: "The account is converted to another savings tier, keeping its number and history."
    grain: "One row per conversion."
    fields:
      variant_name: "Official name of the new tier."
    triggers: []
  - type: savings_set_automatic_transfer
    target: savings_accounts
    mutation: update
    meaning: "A recurring automatic transfer from a PCB checking account into this account is set up, changed or stopped."
    grain: "One row per automatic transfer change."
    fields:
      automatic_transfer_amount: "Recurring monthly transfer amount; 0.00 when stopped."
      automatic_transfer_day: "Day of month the transfer runs; empty when stopped."
      funding_checking_account_id: "The PCB checking account funding the transfer; empty when stopped."
    triggers: []
  - type: savings_set_statement_delivery
    target: savings_accounts
    mutation: update
    meaning: "The statement delivery method is changed."
    grain: "One row per delivery change."
    fields:
      statement_delivery: "The new delivery method."
    triggers: []
  # ---------------- ledger writes (savings_transactions) ----------------
  - type: savings_deposit
    target: savings_transactions
    meaning: "A credit posts to the account: cash, check, mobile deposit, ACH credit, incoming wire, automatic transfer or internal transfer in."
    grain: "One row per credit item posted, identified by its trace number."
    distinguish_by: [trace_number]
    fields:
      amount: "Amount credited, positive."
      posted_date: "Business day the credit posted and became available."
      channel: "How the credit arrived."
      description: "Payer or deposit description as printed on the statement."
      trace_number: "Unique posting trace number of the item."
      check_number: "Serial number of a deposited check, otherwise empty."
      statement_cycle: "Statement cycle in which the credit posted."
      counterparty_account_id: "The PCB account the funds came from for an internal or automatic transfer, otherwise empty."
    account: savings_balance
    direction: in
    triggers:
      - event: "checking:checking_debit"
        when: {channel: automatic_transfer}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: savings_account_id}
  - type: savings_withdrawal
    target: savings_transactions
    meaning: "Funds leave the account: branch or ATM cash, online or telephone transfer, ACH debit, money market check, outgoing wire, or an overdraft protection transfer to checking."
    grain: "One row per withdrawal item, identified by its trace number or, for an overdraft protection transfer, by the checking transfer it funds."
    distinguish_by: [trace_number, source_item_id]
    fields:
      amount: "Amount withdrawn, positive."
      posted_date: "Business day the withdrawal posted."
      channel: "How the withdrawal was made."
      description: "Payee or destination description as printed on the statement."
      trace_number: "Unique posting trace number, empty for an overdraft protection transfer."
      check_number: "Serial number of a money market check, otherwise empty."
      source_item_id: "For an overdraft protection transfer, the checking transfer row it funds; otherwise empty."
      statement_cycle: "Statement cycle in which the withdrawal posted."
      counterparty_account_id: "The PCB account receiving the funds for an internal or overdraft transfer, otherwise empty."
    account: savings_balance
    direction: out
    triggers: []
  - type: savings_interest_credit
    target: savings_transactions
    meaning: "Interest is credited at statement cycle close, one row per interest component, or as a correction of a cycle's interest."
    grain: "One row per account, statement cycle, interest component and adjustment ground."
    distinguish_by: [statement_cycle, interest_component, adjustment_reason]
    fields:
      amount: "Interest credited, positive."
      posted_date: "Cycle closing date, or the correction date for a correction."
      statement_cycle: "Statement cycle the interest was earned in."
      interest_component: "base, relationship_bonus, goal_bonus or promotional."
      adjustment_reason: "none for the regular credit; bank_error for a correction of interest under-credited in that cycle."
    account: savings_balance
    direction: in
    triggers: []
  - type: savings_fee
    target: savings_transactions
    meaning: "A fee is assessed to the account."
    grain: "One row per fee: per counted withdrawal for excess withdrawal fees, per service for service fees, per cycle for periodic fees."
    distinguish_by: [fee_code, source_item_id, statement_cycle, posted_date]
    fields:
      amount: "Fee amount, positive."
      posted_date: "Business day the fee posted."
      fee_code: "Which fee this is."
      source_item_id: "The withdrawal or wire that caused the fee; empty for periodic fees."
      statement_cycle: "Statement cycle the fee belongs to."
    account: savings_balance
    direction: out
    triggers: []
  - type: savings_fee_refund
    target: savings_transactions
    meaning: "A fee is refunded in full."
    grain: "One row per fee refunded; a fee can be refunded at most once."
    distinguish_by: [source_item_id]
    fields:
      amount: "Refunded amount, equal to the fee's amount."
      posted_date: "Business day the refund posted."
      fee_code: "Fee code of the refunded fee."
      source_item_id: "The fee row being refunded."
      adjustment_reason: "courtesy_waiver or bank_error."
      statement_cycle: "Statement cycle in which the refund posted."
    account: savings_balance
    direction: in
    triggers: []

measures:
  - id: savings_msr_cycle_counted_withdrawals
    window: "The statement cycle: from the day after the previous cycle closing date through the cycle closing date, by posted_date."
    measure: "Count, in posting order, of savings_withdrawal rows whose channel is in the tier's excess_withdrawal_counted_channels, plus rows with channel overdraft_transfer when overdraft_transfer_counts_toward_limit is true."
  - id: savings_msr_cycle_excess_fees
    window: "The statement cycle, by posted_date."
    measure: "Count of savings_fee rows with fee_code excess_withdrawal posted in the cycle."
  - id: savings_msr_cycle_min_daily_balance
    window: "The statement cycle, each calendar day."
    measure: "Lowest end-of-day current balance on any day of the cycle, from the running sum of savings_transactions rows booked to savings_balance."
  - id: savings_msr_cycle_end_of_day_balances
    window: "The statement cycle, each calendar day."
    measure: "End-of-day balance for each calendar day of the cycle, from the running sum of savings_transactions rows booked to savings_balance posted on or before that day."
  - id: savings_msr_cycle_net_deposits
    window: "The statement cycle, by posted_date."
    measure: "Sum of amount over savings_deposit rows minus sum of amount over savings_withdrawal rows posted in the cycle; interest credits, fees and refunds are excluded."
  - id: savings_msr_cycle_withdrawal_count
    window: "The statement cycle, by posted_date."
    measure: "Count of savings_withdrawal rows of any channel posted in the cycle."
  - id: savings_msr_cycle_automatic_transfer_total
    window: "The statement cycle, by posted_date."
    measure: "Sum of amount over savings_deposit rows with channel automatic_transfer posted in the cycle."
  - id: savings_msr_courtesy_refunds_365d
    window: "Rolling 365 calendar days ending on the frozen date, inclusive."
    measure: "Count of savings_fee_refund rows with adjustment_reason courtesy_waiver on all savings accounts of the customer."
  - id: savings_msr_promo_new_money
    window: "From opened_date through opened_date plus promo_funding_window_days calendar days, inclusive."
    measure: "Sum of amount over savings_deposit rows with channel branch, check_deposit, mobile_deposit, ach_credit or wire_domestic posted in the window; internal and automatic transfers from PCB accounts are never new money."
  - id: savings_msr_combined_bonus_base
    window: "Each calendar day."
    measure: "End-of-day balances of all of the customer's savings accounts in active or dormant status, ordered from highest to lowest balance, with ties broken by earlier opened_date."
  - id: savings_msr_mobile_deposits_30d
    window: "Rolling 30 calendar days ending on the deposit date, inclusive."
    measure: "Sum of amount over savings_deposit rows with channel mobile_deposit."

policies:
  - id: savings_agg_multi_holding
    subject: [savings_open]
    rule: >-
      A customer may hold several savings and money market accounts. The count of the customer's savings
      accounts whose status is not closed must be below max_per_customer before a new account is opened. The
      count of the customer's savings accounts of the requested tier whose status is not closed must be below
      that tier's max_accounts_per_customer_this_tier. Applied, active and dormant accounts count toward both
      caps; closed accounts never count. Reaching either cap declines the opening with no row written.
    eligibility:
      - id: portfolio_cap
        applies_to: [savings_open]
        kind: authorization
        condition: "The count of the customer's savings accounts whose status is not closed must be below max_per_customer before a new account is opened."
        evidence_fields: [savings_accounts.customer_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.customer_id]]
          action_bindings: {savings_accounts.customer_id: customer_id}
      - id: tier_cap
        applies_to: [savings_open]
        kind: authorization
        condition: "The count of the customer's savings accounts of the requested tier whose status is not closed must be below that tier's max_accounts_per_customer_this_tier."
        evidence_fields: [savings_accounts.customer_id, savings_accounts.variant_name, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.customer_id, savings_accounts.variant_name]]
          action_bindings: {savings_accounts.customer_id: customer_id, savings_accounts.variant_name: variant_name}
    params:
      max_per_customer: 6
      per_tier:
        Starter Savings: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Statement Savings: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Goal Builder Savings: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Money Market Account: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Premier Money Market: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Private Client Money Market: {tier_cap: "=max_accounts_per_customer_this_tier"}

  - id: savings_agg_relationship_bonus_allocation
    subject: [savings_interest_credit]
    rule: >-
      The relationship bonus is a portfolio benefit. It is paid only while the customer holds, at the start of
      the day, an active checking account whose tier is listed in the savings account's
      relationship_bonus_checking_tiers. Each day, the customer's savings balances eligible for the bonus are
      taken in the order given by savings_msr_combined_bonus_base, highest balance first and ties to the earlier
      opened_date, and the bonus is paid on each account's balance only until the running combined total reaches
      that account's relationship_bonus_balance_cap; balance above the running cap earns no bonus. An account
      whose tier lists no qualifying checking tier, or whose relationship_bonus_apy is 0.00, takes no part in the
      allocation and does not consume the cap. The bonus is credited as its own savings_interest_credit row with
      interest_component relationship_bonus at cycle close.
    eligibility:
      - id: qualifying_checking
        applies_to: [savings_interest_credit]
        kind: authorization
        condition: "It is paid only while the customer holds, at the start of the day, an active checking account whose tier is listed in the savings account's relationship_bonus_checking_tiers."
        evidence_fields: [checking_accounts.customer_id, checking_accounts.variant_name, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.customer_id]]
          action_bindings: {checking_accounts.customer_id: customer_id}
    params:
      per_tier:
        Starter Savings: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
        Statement Savings: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
        Goal Builder Savings: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
        Money Market Account: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
        Premier Money Market: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
        Private Client Money Market: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
    measures: [savings_msr_combined_bonus_base]

  - id: savings_open_and_funding
    subject: [savings_open, savings_activate, savings_lapse_unfunded]
    rule: >-
      A savings account opens in applied status with a zero balance and no automatic transfer. The customer's
      age in whole years on the opening date, from the date of birth on the customer profile, must be at least
      the tier's age_min_to_open. For a tier whose entry_required_checking_tiers is not none, the customer must
      already hold an active checking account of one of the listed tiers on the opening date. The account becomes
      active on the business day its first deposit posts, provided that deposit is at least the tier's
      minimum_opening_deposit; a smaller first deposit is returned and does not activate the account. An account
      still in applied status is closed as unfunded once funding_window_days calendar days have passed after the
      account was opened. Count calendar days with the day after opened_date as day 1; the lapse is due when the
      frozen date is on or after opened_date plus funding_window_days. For tiers that offer a promotional APY,
      promo_end_date is recorded at opening as opened_date plus promo_duration_months calendar months, falling
      back to the last day of the month when that day does not exist.
    eligibility:
      - id: age_gate
        applies_to: [savings_open]
        kind: authorization
        condition: "The customer's age in whole years on the opening date, from the date of birth on the customer profile, must be at least the tier's age_min_to_open."
        evidence_fields: [customers.customer_id, customers.date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
      - id: required_checking
        applies_to: [savings_open]
        kind: authorization
        condition: "For a tier whose entry_required_checking_tiers is not none, the customer must already hold an active checking account of one of the listed tiers on the opening date."
        evidence_fields: [checking_accounts.customer_id, checking_accounts.variant_name, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.customer_id]]
          action_bindings: {checking_accounts.customer_id: customer_id}
      - id: funding_lapse
        applies_to: [savings_lapse_unfunded]
        kind: time
        condition: "An account still in applied status is closed as unfunded once funding_window_days calendar days have passed after the account was opened."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account was opened"
          anchor_source: savings_accounts.opened_date
          relation: not_before
          duration_source: params.funding_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after opened_date as day 1; the lapse is due when the frozen date is on or after opened_date plus funding_window_days."
          boundary: inclusive
    params:
      funding_window_days: 30
      per_tier:
        Starter Savings: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}
        Statement Savings: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}
        Goal Builder Savings: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}
        Money Market Account: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}
        Premier Money Market: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}
        Private Client Money Market: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}

  - id: savings_evt_maintenance_and_statement_fees
    subject: [savings_fee, savings_set_statement_delivery]
    rule: >-
      At each statement cycle close the tier's monthly_maintenance_fee is assessed as one savings_fee row with
      fee_code monthly_maintenance for that cycle, unless at least one waiver offered by the tier is met for the
      cycle. The tier used is the variant_name at cycle close. Waivers are alternatives, any single one suffices,
      and the fee is never prorated or partially waived; a waiver whose parameter is not_offered cannot be used.
      The waivers are: savings_msr_cycle_min_daily_balance at or above waiver_min_daily_balance;
      savings_msr_cycle_automatic_transfer_total at or above waiver_automatic_transfer_min; the owner's age at
      cycle close below waiver_age_under; an active checking account of a tier listed in
      waiver_linked_checking_tiers held by the same customer at cycle close; the relationship balance at cycle
      close, on the basis of checking_agg_relationship_balance with mortgage principal excluded, at or above
      waiver_relationship_balance. The fee is not assessed for the cycle in which the account was opened. The
      maintenance fee is assessed only on an account whose status at cycle close is active. At most one
      maintenance fee is assessed per account per statement cycle. When statement_delivery is paper at cycle
      close the tier's paper_statement_fee is assessed as fee_code paper_statement for that cycle, except for
      owners at least paper_statement_fee_exempt_age at cycle close. A tier fee of 0.00 writes no row.
    eligibility:
      - id: active_at_close
        applies_to: [savings_fee]
        kind: state
        condition: "The maintenance fee is assessed only on an account whose status at cycle close is active."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        state_contract:
          field: savings_accounts.status
          allowed: [active]
      - id: one_per_cycle
        applies_to: [savings_fee]
        kind: dedup
        condition: "At most one maintenance fee is assessed per account per statement cycle."
        evidence_fields: [savings_transactions.savings_account_id, savings_transactions.statement_cycle, savings_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.savings_account_id, savings_transactions.statement_cycle]]
          action_bindings: {savings_transactions.savings_account_id: savings_account_id, savings_transactions.statement_cycle: statement_cycle}
        dedup_contract:
          table: savings_transactions
          mode: separate_record
          object_bindings: {savings_account_id: savings_account_id, statement_cycle: statement_cycle}
          duplicate_filters: {event_type: [savings_fee], fee_code: [monthly_maintenance]}
          distinct_fields: []
    params:
      per_tier:
        Starter Savings: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
        Statement Savings: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
        Goal Builder Savings: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
        Money Market Account: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
        Premier Money Market: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
        Private Client Money Market: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
    measures: [savings_msr_cycle_min_daily_balance, savings_msr_cycle_automatic_transfer_total]

  - id: savings_evt_withdrawal_allowance
    subject: [savings_withdrawal, savings_fee]
    rule: >-
      Savings accounts carry a per-cycle allowance of counted withdrawals. Withdrawals are paid only from an
      account whose status is active or dormant. A withdrawal is paid only when its amount does not exceed the
      current balance; a withdrawal that would take the balance below zero is declined and never posts, except an
      overdraft protection transfer, which the checking charter makes only when the savings balance covers it in
      full. Withdrawals made in person at a branch or at an ATM never count toward the allowance. Every other
      withdrawal counts when its channel is in the tier's excess_withdrawal_counted_channels, and an overdraft
      protection transfer counts when the tier's overdraft_transfer_counts_toward_limit is true; the count is
      savings_msr_cycle_counted_withdrawals in posting order. Each counted withdrawal beyond
      free_withdrawals_per_cycle incurs excess_withdrawal_fee as a savings_fee row with fee_code excess_withdrawal
      whose source_item_id is that withdrawal, until savings_msr_cycle_excess_fees reaches
      excess_withdrawal_fee_max_per_cycle, after which further counted withdrawals in the cycle are paid without
      a fee. A tier whose free_withdrawals_per_cycle is unlimited never charges the fee. Each withdrawal carries
      at most one excess withdrawal fee. The tier used is the variant_name on the withdrawal's posted_date. An
      outgoing wire also incurs domestic_wire_out_fee with fee_code wire_out, and an incoming wire credit incurs
      incoming_wire_fee with fee_code wire_incoming; a fee of 0.00 writes no row. Daily limits apply per calendar
      day in Eastern Time: ATM cash within atm_daily_withdrawal_limit only on tiers with atm_card_access true, and
      online or mobile transfers out within online_transfer_daily_limit; money market checks are paid only on
      tiers with check_writing_available true. Over-limit requests are declined and never post.
    eligibility:
      - id: status_allows_withdrawal
        applies_to: [savings_withdrawal]
        kind: state
        condition: "Withdrawals are paid only from an account whose status is active or dormant."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        state_contract:
          field: savings_accounts.status
          allowed: [active, dormant]
      - id: covered_by_balance
        applies_to: [savings_withdrawal]
        kind: authorization
        condition: "A withdrawal is paid only when its amount does not exceed the current balance; a withdrawal that would take the balance below zero is declined and never posts, except an overdraft protection transfer, which the checking charter makes only when the savings balance covers it in full."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.current_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
      - id: one_fee_per_withdrawal
        applies_to: [savings_fee]
        kind: dedup
        condition: "Each withdrawal carries at most one excess withdrawal fee."
        evidence_fields: [savings_transactions.source_item_id, savings_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.source_item_id]]
          action_bindings: {savings_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: savings_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [savings_fee], fee_code: [excess_withdrawal]}
          distinct_fields: []
    params:
      per_tier:
        Starter Savings: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
        Statement Savings: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
        Goal Builder Savings: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
        Money Market Account: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
        Premier Money Market: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
        Private Client Money Market: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
    measures: [savings_msr_cycle_counted_withdrawals, savings_msr_cycle_excess_fees]

  - id: savings_evt_interest
    subject: [savings_interest_credit]
    rule: >-
      Interest accrues daily on each calendar day's end-of-day balance from savings_msr_cycle_end_of_day_balances
      and is credited on the cycle closing date as separate savings_interest_credit rows, one per component that
      is above 0.00 after rounding. A day whose end-of-day balance is below minimum_balance_to_earn_interest earns
      no interest of any component. Base interest uses base_apy_ladder: under the tiered method the whole balance
      earns the APY of the highest band floor it reaches; under the blended method each slice of balance between
      consecutive floors earns that band's APY. Each day's interest is balance times APY divided by 100 and by
      interest_day_count_basis; daily amounts are summed unrounded per component and each component total is
      rounded half-up to the cent. The stacking of components is fixed: on the promotional portion of a day's
      balance the promotional APY replaces the base APY and no relationship or goal bonus is added; on the
      remaining balance the base APY applies and the relationship bonus and goal bonus each add their own
      percentage points. A component that does not apply is not applicable rather than zero-rated, and writes no
      row. The tier and ladder used for each day are those in force on that day. Interest accrued since the last
      cycle close is paid at closure only when accrued_interest_paid_on_closure is true; otherwise it is forfeited.
      A correction for interest under-credited in a past cycle is written as a separate row with adjustment_reason
      bank_error for the same statement_cycle and component, for the difference only.
    eligibility: []
    params:
      interest_day_count_basis: 365
      per_tier:
        Starter Savings: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
        Statement Savings: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
        Goal Builder Savings: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
        Money Market Account: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
        Premier Money Market: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
        Private Client Money Market: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
    measures: [savings_msr_cycle_end_of_day_balances]

  - id: savings_evt_bonus_interest
    subject: [savings_interest_credit]
    rule: >-
      Two tier-specific bonuses supplement base interest. The goal bonus is earned for a cycle on a tier whose
      goal_bonus_apy is above 0.00 when savings_msr_cycle_net_deposits is at least goal_bonus_min_net_deposit and
      savings_msr_cycle_withdrawal_count is zero; when earned it applies to every day of that cycle on balance up
      to goal_bonus_balance_cap and is credited with interest_component goal_bonus. A cycle with any withdrawal of
      any channel, including an overdraft protection transfer, earns no goal bonus. The promotional APY applies
      only on a tier whose promo_new_money_apy is not not_offered, only while the day is on or before
      promo_end_date, and only when savings_msr_promo_new_money reached promo_min_new_money; the promotional
      portion of each day's balance is the balance up to promo_balance_cap, credited with interest_component
      promotional. The promotional APY applies only on days no later than promo_duration_months calendar months after the account was opened. Count calendar months from
      opened_date; a day is within the promotional period when it is on or before opened_date plus
      promo_duration_months calendar months, which is the recorded promo_end_date. After promo_end_date the
      whole balance earns base interest and any relationship bonus. A tier conversion ends the promotional period
      on the conversion date. New money deposited after promo_funding_window_days does not count toward the
      threshold but does earn the promotional APY within the cap.
    eligibility:
      - id: promo_period
        applies_to: [savings_interest_credit]
        kind: time
        condition: "The promotional APY applies only on days no later than promo_duration_months calendar months after the account was opened."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.opened_date, savings_accounts.promo_end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account was opened"
          anchor_source: savings_accounts.opened_date
          relation: not_after
          duration_source: variants.promo_duration_months
          unit: calendar_months
          counting_rule: "Count calendar months from opened_date; a day is within the promotional period when it is on or before opened_date plus promo_duration_months calendar months, which is the recorded promo_end_date."
          boundary: inclusive
    params:
      per_tier:
        Starter Savings: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
        Statement Savings: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
        Goal Builder Savings: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
        Money Market Account: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
        Premier Money Market: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
        Private Client Money Market: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
    measures: [savings_msr_cycle_net_deposits, savings_msr_cycle_withdrawal_count, savings_msr_promo_new_money]

  - id: savings_evt_fee_refund
    subject: [savings_fee_refund]
    rule: >-
      A fee is refunded in full, never in part, as one savings_fee_refund row whose source_item_id is the fee row.
      A bank_error refund applies when the fee was assessed contrary to the savings charter, such as an excess
      withdrawal fee on a branch or ATM withdrawal, on a withdrawal within the free allowance, beyond
      excess_withdrawal_fee_max_per_cycle, or a maintenance fee in a cycle where a waiver was met; it has no time
      limit and does not count toward the courtesy limit. A courtesy_waiver refund of a correctly assessed fee is
      allowed only when every courtesy gate holds. The fee's fee_code must be one of courtesy_eligible_fee_codes.
      The fee must have posted no more than courtesy_refund_window_days calendar days before the courtesy refund is
      granted. Count calendar days with the day after the fee's posted_date as day 1; the refund is allowed while
      the frozen date is on or before the fee's posted_date plus courtesy_refund_window_days. The customer's count
      of savings courtesy refunds in the rolling 365 days must be below the tier's courtesy_refund_limit_365d,
      counted by savings_msr_courtesy_refunds_365d, where each refunded fee counts as one. The account's status
      must be active or dormant when a courtesy refund is granted. When the limit allows fewer refunds than
      requested, the most recently posted fees are refunded first, and among fees posted the same day the larger
      fee first. A fee can be refunded at most once. Checking courtesy refunds and savings courtesy refunds are
      counted separately.
    eligibility:
      - id: eligible_fee_code
        applies_to: [savings_fee_refund]
        kind: authorization
        condition: "The fee's fee_code must be one of courtesy_eligible_fee_codes."
        evidence_fields: [savings_transactions.savings_txn_id, savings_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.savings_txn_id]]
          action_bindings: {savings_transactions.savings_txn_id: source_item_id}
      - id: courtesy_window
        applies_to: [savings_fee_refund]
        kind: time
        condition: "The fee must have posted no more than courtesy_refund_window_days calendar days before the courtesy refund is granted."
        evidence_fields: [savings_transactions.savings_txn_id, savings_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.savings_txn_id]]
          action_bindings: {savings_transactions.savings_txn_id: source_item_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "The fee must have posted"
          anchor_source: savings_transactions.posted_date
          relation: not_after
          duration_source: variants.courtesy_refund_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after the fee's posted_date as day 1; the refund is allowed while the frozen date is on or before the fee's posted_date plus courtesy_refund_window_days."
          boundary: inclusive
      - id: courtesy_limit
        applies_to: [savings_fee_refund]
        kind: authorization
        condition: "The customer's count of savings courtesy refunds in the rolling 365 days must be below the tier's courtesy_refund_limit_365d, counted by savings_msr_courtesy_refunds_365d, where each refunded fee counts as one."
        evidence_fields: [savings_transactions.customer_id, savings_transactions.adjustment_reason, savings_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.customer_id]]
          action_bindings: {savings_transactions.customer_id: customer_id}
      - id: account_open
        applies_to: [savings_fee_refund]
        kind: state
        condition: "The account's status must be active or dormant when a courtesy refund is granted."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        state_contract:
          field: savings_accounts.status
          allowed: [active, dormant]
      - id: refund_once
        applies_to: [savings_fee_refund]
        kind: dedup
        condition: "A fee can be refunded at most once."
        evidence_fields: [savings_transactions.source_item_id, savings_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.source_item_id]]
          action_bindings: {savings_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: savings_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [savings_fee_refund]}
          distinct_fields: []
    params:
      courtesy_eligible_fee_codes: [monthly_maintenance, paper_statement, excess_withdrawal, dormant_account]
      per_tier:
        Starter Savings: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Statement Savings: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Goal Builder Savings: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Money Market Account: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Premier Money Market: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Private Client Money Market: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
    measures: [savings_msr_courtesy_refunds_365d]

  - id: savings_evt_automatic_transfer
    subject: [savings_set_automatic_transfer, savings_deposit]
    rule: >-
      An automatic transfer moves a fixed amount each month from a PCB checking account into the savings account.
      Setting up or changing it is the owner's own instruction to move their funds. The funding checking account
      must belong to the same customer_id as the savings account and be in active status when the instruction is
      recorded. The amount must be at least the tier's automatic_transfer_min_amount. The transfer day is a day of
      month from 1 to 28; when that day is not a business day the transfer runs on the next business day. On the
      transfer day the transfer posts as a savings_deposit with channel automatic_transfer, which through its
      trigger debits the funding checking account; if the checking ledger balance would go below zero the transfer
      is skipped for that month with no row and no fee, and it never creates an overdraft. Stopping the transfer
      sets the amount to 0.00 and clears the day and funding account, effective for the next scheduled run.
    eligibility:
      - id: funding_account_owned_active
        applies_to: [savings_set_automatic_transfer]
        kind: authorization
        condition: "The funding checking account must belong to the same customer_id as the savings account and be in active status when the instruction is recorded."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.customer_id, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: funding_checking_account_id}
      - id: minimum_amount
        applies_to: [savings_set_automatic_transfer]
        kind: authorization
        condition: "The amount must be at least the tier's automatic_transfer_min_amount."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
    params:
      per_tier:
        Starter Savings: {min_amount: "=automatic_transfer_min_amount"}
        Statement Savings: {min_amount: "=automatic_transfer_min_amount"}
        Goal Builder Savings: {min_amount: "=automatic_transfer_min_amount"}
        Money Market Account: {min_amount: "=automatic_transfer_min_amount"}
        Premier Money Market: {min_amount: "=automatic_transfer_min_amount"}
        Private Client Money Market: {min_amount: "=automatic_transfer_min_amount"}

  - id: savings_evt_deposits
    subject: [savings_deposit]
    rule: >-
      A deposit posts on the business day its funds become available, so the current balance is also the
      available balance. Cash, ACH credits, incoming wires and internal or automatic transfers post on the business
      day received. A deposited check posts on the next business day, except that while the account has been open
      fewer than new_account_period_days calendar days a deposited check posts on the
      new_account_check_hold_business_days business day after deposit. A mobile deposit is accepted only when it
      keeps the day's mobile deposits within mobile_deposit_daily_limit and savings_msr_mobile_deposits_30d within
      mobile_deposit_30day_limit; an over-limit mobile deposit is rejected and never posts. Deposits are accepted
      on active and dormant accounts and on an applied account as its opening deposit, never on a closed account.
      A deposit is never customer-initiated activity for dormancy when it is an ACH credit, incoming wire or
      automatic transfer.
    eligibility: []
    params:
      per_tier:
        Starter Savings: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
        Statement Savings: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
        Goal Builder Savings: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
        Money Market Account: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
        Premier Money Market: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
        Private Client Money Market: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
    measures: [savings_msr_mobile_deposits_30d]

  - id: savings_evt_dormancy
    subject: [savings_go_dormant, savings_reactivate, savings_fee]
    rule: >-
      Customer-initiated activity means a deposit or withdrawal the owner makes at a branch, ATM, by mobile
      deposit, online, mobile or telephone transfer, money market check or wire; interest credits, fees, refunds,
      ACH credits, automatic transfers and overdraft protection transfers are not customer-initiated.
      last_customer_activity_date records the latest such activity. An active account becomes dormant once
      dormancy_inactivity_months calendar months have passed after the last customer-initiated activity. Count
      calendar months from last_customer_activity_date; the account is due for dormancy when the frozen date is on
      or after last_customer_activity_date plus dormancy_inactivity_months calendar months, falling back to the last
      day of the month when that day does not exist. While dormant, dormant_account_fee is assessed at each cycle
      close as fee_code dormant_account, reduced so it never takes the balance below zero and not written on a
      zero balance; no maintenance fee is assessed in a dormant cycle. The identity of the owner must be verified
      before a dormant account is reactivated. Reactivation needs a customer-initiated transaction in the same
      contact, and its date becomes the new last_customer_activity_date. Interest continues to accrue while dormant.
    eligibility:
      - id: inactivity_elapsed
        applies_to: [savings_go_dormant]
        kind: time
        condition: "An active account becomes dormant once dormancy_inactivity_months calendar months have passed after the last customer-initiated activity."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.last_customer_activity_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the last customer-initiated activity"
          anchor_source: savings_accounts.last_customer_activity_date
          relation: not_before
          duration_source: variants.dormancy_inactivity_months
          unit: calendar_months
          counting_rule: "Count calendar months from last_customer_activity_date; the account is due for dormancy when the frozen date is on or after last_customer_activity_date plus dormancy_inactivity_months calendar months, falling back to the last day of the month when that day does not exist."
          boundary: inclusive
      - id: verified_owner
        applies_to: [savings_reactivate]
        kind: authorization
        condition: "The identity of the owner must be verified before a dormant account is reactivated."
        evidence_fields: [verification_log.customer_id, verification_log.verified]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[verification_log.customer_id]]
          action_bindings: {verification_log.customer_id: customer_id}
    params:
      per_tier:
        Starter Savings: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Statement Savings: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Goal Builder Savings: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Money Market Account: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Premier Money Market: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Private Client Money Market: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}

  - id: savings_evt_closure
    subject: [savings_close, savings_fee, savings_withdrawal]
    rule: >-
      Closing a savings account is the owner's own decision: the agent registers a savings_requests row of
      request_type account_closure in pending_customer_confirmation status naming the disbursement method, and the
      account closes only after the owner confirms. An account that is the overdraft protection source of a
      checking account is unlinked on that checking account before it closes. The early closure fee applies when
      the account is closed within early_closure_window_days calendar days after the account was opened. Count
      calendar days with the day after opened_date as day 1; the fee applies when the closure date is on or before
      opened_date plus early_closure_window_days. The fee is written as fee_code early_closure before payout and
      reduced so it never takes the balance below zero. Accrued interest since the last cycle close is credited
      first only when accrued_interest_paid_on_closure is true. The remaining balance is paid out in full as one
      savings_withdrawal, by internal transfer to a PCB account of the same customer or by official check mailed
      to the address on file, and the account closes at zero with its automatic transfer stopped. A payout never
      counts toward the withdrawal allowance and never incurs an excess withdrawal fee.
    eligibility:
      - id: early_window
        applies_to: [savings_fee]
        kind: time
        condition: "The early closure fee applies when the account is closed within early_closure_window_days calendar days after the account was opened."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account was opened"
          anchor_source: savings_accounts.opened_date
          relation: not_after
          duration_source: variants.early_closure_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after opened_date as day 1; the fee applies when the closure date is on or before opened_date plus early_closure_window_days."
          boundary: inclusive
    params:
      per_tier:
        Starter Savings: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Statement Savings: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Goal Builder Savings: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Money Market Account: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Premier Money Market: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Private Client Money Market: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}

  - id: savings_product_change
    subject: [savings_change_product]
    rule: >-
      A tier conversion keeps the account number, balance and history and changes only variant_name. The account
      must be active when the conversion is recorded. The customer must meet the target tier's entry gate on the
      conversion date, including entry_required_checking_tiers and savings_agg_multi_holding, except the opening
      deposit; the current balance must be at least the target tier's minimum_opening_deposit instead. No fee is
      charged. A conversion ends any promotional period on the conversion date and does not restart the early
      closure window. At most one conversion is recorded per account per statement cycle.
    eligibility:
      - id: must_be_active
        applies_to: [savings_change_product]
        kind: state
        condition: "The account must be active when the conversion is recorded."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        state_contract:
          field: savings_accounts.status
          allowed: [active]
