events:
- type: auto_apply
  target: auto_loans
  mutation: create
  meaning: An auto loan application is recorded for one loan product and vehicle.
  grain: One row per application.
  fields:
    customer_id: The applicant and borrower.
    variant_name: Official loan product applied for.
    status: Always applied at creation.
    opened_date: Application date.
    vehicle_vin: 17-character vehicle identification number as stated on the purchase or lease documents.
    vehicle_year: Model year of the vehicle.
    vehicle_make_model: Make and model as stated on the title or buyer's order.
    term_months: Term chosen from the product's term options.
    original_principal: Amount requested to be financed, including any GAP charge.
    gap_coverage: Whether GAP waiver coverage is included.
    gap_premium: GAP charge financed, 0.00 when not included.
    principal_balance: Always 0.00 at creation.
    fees_due: Always 0.00 at creation.
  triggers: []
- type: auto_fund
  target: auto_loans
  mutation:
    transition:
      from: applied
      to: active
  meaning: The approved loan is funded and the repayment schedule fixed.
  grain: One row per loan funded.
  fields:
    status: Set to active.
    funded_date: Date the loan funded; interest accrues from this date.
    loan_number_last4: Last four digits of the loan number.
    credit_grade: Credit grade assigned by underwriting.
    interest_rate: APR after grade adder and discounts, not below the floor.
    rate_discounts: Discounts included in the APR.
    monthly_payment: Fixed installment amount.
    payment_due_day: Day of month installments are due.
    next_payment_due_date: First installment due date.
    maturity_date: Due date of the final scheduled installment.
    last_payment_date: Set to the funding date.
    lien_status: Set to perfected.
  triggers:
  - event: auto:auto_disbursement
    map:
      posted_date: funded_date
- type: auto_withdraw
  target: auto_loans
  mutation:
    transition:
      from: applied
      to: withdrawn
  meaning: The application is declined, withdrawn or lapses unfunded.
  grain: One row per application ended without funding.
  fields:
    status: Set to withdrawn.
    closed_date: Date the application ended.
  triggers: []
- type: auto_become_delinquent
  target: auto_loans
  mutation:
    transition:
      from: active
      to: delinquent
  meaning: The loan becomes delinquent.
  grain: One row per delinquency episode.
  fields:
    status: Set to delinquent.
  triggers: []
- type: auto_cure
  target: auto_loans
  mutation:
    transition:
      from: delinquent
      to: active
  meaning: A delinquent loan is brought current.
  grain: One row per cure.
  fields:
    status: Set to active.
    days_past_due: Reset to 0.
  triggers: []
- type: auto_charge_off
  target: auto_loans
  mutation:
    transition:
      from: delinquent
      to: charged_off
  meaning: The remaining principal of a seriously delinquent loan is charged off.
  grain: One row per charge-off.
  fields:
    status: Set to charged_off.
    closed_date: Charge-off date.
  triggers:
  - event: auto:auto_chargeoff_writeoff
    map:
      posted_date: closed_date
- type: auto_pay_off
  target: auto_loans
  mutation:
    transition:
    - from: active
      to: paid_off
    - from: delinquent
      to: paid_off
  meaning: The loan is paid in full and closed; the lien release is started.
  grain: One row per payoff.
  fields:
    status: Set to paid_off.
    closed_date: Date the payoff posted.
    lien_status: Set to release_pending.
  triggers: []
- type: auto_release_lien
  target: auto_loans
  mutation: update
  meaning: The lien on a paid-off vehicle is released to the borrower or the state motor vehicle agency.
  grain: One row per lien release.
  fields:
    lien_status: Set to released.
    lien_release_date: Date the release was sent.
  triggers: []
- type: auto_change_due_date
  target: auto_loans
  mutation: update
  meaning: The borrower's monthly due day is moved.
  grain: One row per due date change.
  fields:
    payment_due_day: New due day.
    next_payment_due_date: Next installment due date on the new day.
    last_due_date_change_date: Date of this change.
  triggers: []
- type: auto_extend
  target: auto_loans
  mutation: update
  meaning: One or more installments are deferred to the end of the loan.
  grain: One row per extension granted.
  fields:
    next_payment_due_date: Next due date moved forward by the number of deferred installments.
    maturity_date: Maturity moved out by the same number of months.
    extensions_used_lifetime: Previous value plus one.
    last_extension_date: Date the extension was granted.
  triggers:
  - event: auto:auto_fee
    map:
      fee_code: extension
- type: auto_set_autopay
  target: auto_loans
  mutation: update
  meaning: Automatic payment from a PCB checking account is enrolled or cancelled, with the matching APR change.
  grain: One row per autopay change.
  fields:
    autopay_enrolled: Whether autopay is now enrolled.
    autopay_source_account_id: The PCB checking account debited, or empty.
    interest_rate: APR after the autopay discount is added or removed.
    rate_discounts: Discounts now included in the APR.
  triggers: []
- type: auto_cancel_gap
  target: auto_loans
  mutation: update
  meaning: The borrower cancels GAP waiver coverage.
  grain: One row per GAP cancellation.
  fields:
    gap_coverage: Set to false.
    gap_cancellation_date: Date of the cancellation.
  triggers: []
- type: auto_disbursement
  target: auto_transactions
  meaning: The loan proceeds are paid to the dealer, lessor or prior lender, creating the principal balance.
  grain: One row per loan funding.
  distinguish_by:
  - posted_date
  fields:
    amount: Amount financed, positive.
    posted_date: Funding date.
    reference_number: Funding reference number.
  account: auto_principal
  direction: in
  triggers: []
- type: auto_payment
  target: auto_transactions
  meaning: A borrower payment posts and is allocated to fees, interest and principal.
  grain: One row per payment, identified by its payment reference number.
  distinguish_by:
  - reference_number
  fields:
    amount: Total payment, positive; equals fees_portion plus interest_portion plus principal_portion.
    posted_date: Business day the payment was credited.
    payment_channel: How the payment was made.
    payment_type: scheduled, principal_only or payoff.
    fees_portion: Part applied to fees due.
    interest_portion: Part applied to accrued interest.
    principal_portion: Part applied to principal; this is the amount booked to the principal account.
    installment_due_date: The installment due date this payment is credited toward; empty for principal-only payments.
    reference_number: Payment reference number.
    counterparty_account_id: The PCB account paying, otherwise empty.
  account: auto_principal
  direction: out
  triggers:
  - event: auto:auto_fee_settlement
    when:
      fees_portion:
        not: 0.0
    map:
      amount: fees_portion
      source_item_id: auto_txn_id
      posted_date: posted_date
  - event: auto:auto_pay_off
    when:
      payment_type: payoff
    map:
      closed_date: posted_date
  - event: checking:checking_debit
    when:
      payment_channel:
      - autopay_pcb
      - pcb_transfer
    map:
      amount: amount
      posted_date: posted_date
      channel: internal_transfer
      counterparty_account_id: auto_loan_id
- type: auto_fee
  target: auto_transactions
  meaning: A late charge, extension fee or returned payment fee is assessed, or fees paid by a returned payment
    become due again.
  grain: 'One row per fee: per late installment, per extension, per returned payment.'
  distinguish_by:
  - fee_code
  - installment_due_date
  - source_item_id
  - posted_date
  fields:
    amount: Fee amount, positive.
    posted_date: Date assessed.
    fee_code: late_charge, extension, returned_payment, or settlement_reversal for fees that become due again
      when the payment that paid them is returned.
    installment_due_date: For a late charge, the installment that was late; otherwise empty.
    source_item_id: For a returned payment fee or settlement reversal, the returned payment; otherwise empty.
  account: auto_fees_due
  direction: in
  triggers: []
- type: auto_fee_settlement
  target: auto_transactions
  meaning: The fee portion of a payment reduces fees due.
  grain: One row per payment that paid fees.
  distinguish_by:
  - source_item_id
  fields:
    amount: Fees paid, positive.
    posted_date: Payment date.
    source_item_id: The payment.
  account: auto_fees_due
  direction: out
  triggers: []
- type: auto_fee_waiver
  target: auto_transactions
  meaning: An unpaid or paid fee is waived in full.
  grain: One row per fee waived.
  distinguish_by:
  - source_item_id
  fields:
    amount: Amount waived, equal to the fee.
    posted_date: Date waived.
    fee_code: Fee code of the waived fee.
    source_item_id: The fee waived.
    adjustment_reason: courtesy_waiver or bank_error.
  account: auto_fees_due
  direction: out
  triggers: []
- type: auto_payment_reversal
  target: auto_transactions
  meaning: A payment is returned unpaid and its principal credit is reversed.
  grain: One row per returned payment.
  distinguish_by:
  - source_item_id
  fields:
    amount: The returned payment's principal_portion, restored to principal.
    posted_date: Date the return posted.
    source_item_id: The returned payment.
  account: auto_principal
  direction: in
  triggers:
  - event: auto:auto_fee
    map:
      fee_code: returned_payment
      source_item_id: auto_txn_id
      posted_date: posted_date
- type: auto_chargeoff_writeoff
  target: auto_transactions
  meaning: The remaining principal of a charged-off loan is written off.
  grain: One row per charge-off.
  distinguish_by:
  - posted_date
  fields:
    amount: Principal written off, positive.
    posted_date: Charge-off date.
  account: auto_principal
  direction: out
  triggers: []
- type: auto_gap_refund
  target: auto_transactions
  meaning: Part or all of the GAP charge is refunded after cancellation or early payoff.
  grain: One row per GAP refund.
  distinguish_by:
  - posted_date
  fields:
    amount: Refund amount, positive.
    posted_date: Date of the refund.
    refund_destination: checking or official_check.
    counterparty_account_id: The PCB checking account credited, otherwise empty.
  triggers:
  - event: checking:checking_deposit
    when:
      refund_destination: checking
    map:
      amount: amount
      posted_date: posted_date
      channel: internal_transfer
      counterparty_account_id: auto_loan_id
measures:
- id: auto_msr_accrued_interest
  window: From last_payment_date (exclusive) through the measurement date (inclusive), in calendar days.
  measure: principal_balance times interest_rate divided by 100, divided by interest_day_count_basis, times the
    number of days, unrounded until use and then rounded half-up to the cent.
- id: auto_msr_on_time_streak
  window: Installments counted backward from the most recent due date before the measurement date.
  measure: Number of consecutive installments, most recent first, for which scheduled payments credited toward
    that installment_due_date totalled at least monthly_payment within the state grace days; stops at the first
    installment that fails.
- id: auto_msr_extensions_365d
  window: Rolling 365 calendar days ending on the frozen date, inclusive.
  measure: Count of auto_fee rows with fee_code extension on the loan.
- id: auto_msr_late_charge_courtesy_365d
  window: Rolling 365 calendar days ending on the frozen date, inclusive.
  measure: Count of auto_fee_waiver rows with fee_code late_charge and adjustment_reason courtesy_waiver on all
    of the customer's auto loans.
- id: auto_msr_installments_paid
  window: From funded_date through the frozen date.
  measure: Count of distinct installment_due_date values fully satisfied by scheduled payments.
- id: auto_msr_customer_exposure
  window: The frozen date.
  measure: Sum of principal_balance over the customer's auto loans in active or delinquent status plus original_principal
    of loans in applied status.
policies:
- id: auto_agg_multi_holding
  subject:
  - auto_apply
  rule: A customer may carry several auto loans. The count of the customer's auto loans in applied, active or
    delinquent status must be below max_per_customer before a new application is recorded. The count of the customer's
    loans of the requested product in applied, active or delinquent status must be below max_loans_this_tier.
    A customer with any auto loan in charged_off status cannot apply. Paid-off and withdrawn loans do not count.
  eligibility:
  - id: portfolio_cap
    applies_to:
    - auto_apply
    kind: authorization
    condition: The count of the customer's auto loans in applied, active or delinquent status must be below max_per_customer
      before a new application is recorded.
    evidence_fields:
    - auto_loans.customer_id
    - auto_loans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.customer_id
      action_bindings:
        auto_loans.customer_id: customer_id
  - id: no_charge_off
    applies_to:
    - auto_apply
    kind: authorization
    condition: A customer with any auto loan in charged_off status cannot apply.
    evidence_fields:
    - auto_loans.customer_id
    - auto_loans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.customer_id
      action_bindings:
        auto_loans.customer_id: customer_id
  params:
    max_per_customer: 3
    per_tier:
      Used Vehicle Loan:
        tier_cap: =max_loans_this_tier
      Certified Pre-Owned Vehicle Loan:
        tier_cap: =max_loans_this_tier
      Auto Refinance Loan:
        tier_cap: =max_loans_this_tier
      Lease Buyout Loan:
        tier_cap: =max_loans_this_tier
      New Vehicle Loan:
        tier_cap: =max_loans_this_tier
      Green Vehicle Loan:
        tier_cap: =max_loans_this_tier
- id: auto_agg_customer_exposure
  subject:
  - auto_apply
  - auto_fund
  rule: Auto lending is aggregated per borrower. The customer's auto exposure, measured by auto_msr_customer_exposure
    plus the amount requested, must not exceed combined_auto_exposure_cap. Exposure counts principal on active
    and delinquent loans and the requested amount on pending applications; paid-off loans never count. Discounts,
    rates and fees are always judged per loan and never on combined balances.
  eligibility:
  - id: exposure_cap
    applies_to:
    - auto_apply
    - auto_fund
    kind: authorization
    condition: The customer's auto exposure, measured by auto_msr_customer_exposure plus the amount requested,
      must not exceed combined_auto_exposure_cap.
    evidence_fields:
    - auto_loans.customer_id
    - auto_loans.principal_balance
    - auto_loans.original_principal
    - auto_loans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.customer_id
      action_bindings:
        auto_loans.customer_id: customer_id
  params:
    combined_auto_exposure_cap: 175000.0
  measures:
  - auto_msr_customer_exposure
- id: auto_application_and_funding
  subject:
  - auto_apply
  - auto_fund
  - auto_withdraw
  - auto_disbursement
  rule: 'The applicant''s age in whole years on the application date, from the date of birth on the customer profile,
    must be at least age_min_to_apply. The vehicle and amount must fit the product: the amount financed between
    min_loan_amount and max_loan_amount and no more than max_ltv_pct percent of the vehicle value, the vehicle
    no older than max_vehicle_age_years and no more than max_vehicle_mileage miles, its powertrain in eligible_powertrains,
    and the term one of term_options_months. Approval, the credit grade and funding are underwriting decisions
    made by the credit system; the grade must be one of eligible_credit_grades. The APR is fixed at funding: base_apr_by_term
    for the chosen term plus credit_grade_apr_adders for the grade, minus autopay_discount_pct when autopay from
    a PCB checking account is enrolled at funding and minus relationship_discount_pct when auto_agg_relationship_discount
    grants it, the discounts together never exceeding max_total_discount_pct and never taking the APR below apr_floor.
    The monthly payment is the level installment that repays the amount financed over the term at the APR. The
    first due date is no more than first_payment_max_days calendar days after funding. An approved loan not funded
    is withdrawn once funding_window_days calendar days have passed after the application was recorded. Count
    calendar days with the day after opened_date as day 1; the application lapses when the frozen date is on or
    after opened_date plus funding_window_days. Funding posts one auto_disbursement of the amount financed, including
    any GAP charge.'
  eligibility:
  - id: age_gate
    applies_to:
    - auto_apply
    kind: authorization
    condition: The applicant's age in whole years on the application date, from the date of birth on the customer
      profile, must be at least age_min_to_apply.
    evidence_fields:
    - customers.customer_id
    - customers.date_of_birth
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  - id: funding_lapse
    applies_to:
    - auto_withdraw
    kind: time
    condition: An approved loan not funded is withdrawn once funding_window_days calendar days have passed after
      the application was recorded.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.opened_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the application was recorded
      anchor_source: auto_loans.opened_date
      relation: not_before
      duration_source: variants.funding_window_days
      unit: calendar_days
      counting_rule: Count calendar days with the day after opened_date as day 1; the application lapses when
        the frozen date is on or after opened_date plus funding_window_days.
      boundary: inclusive
  formula:
    funded_apr: max(apr_floor, base_apr_by_term + credit_grade_apr_adders - min(max_total_discount_pct, autopay_discount_pct
      + relationship_discount_pct))
  params:
    per_tier:
      Used Vehicle Loan:
        min_amount: =min_loan_amount
        max_amount: =max_loan_amount
        ltv: =max_ltv_pct
        vehicle_age: =max_vehicle_age_years
        mileage: =max_vehicle_mileage
        terms: =term_options_months
        base: =base_apr_by_term
        adders: =credit_grade_apr_adders
        floor: =apr_floor
        grades: =eligible_credit_grades
      Certified Pre-Owned Vehicle Loan:
        min_amount: =min_loan_amount
        max_amount: =max_loan_amount
        ltv: =max_ltv_pct
        vehicle_age: =max_vehicle_age_years
        mileage: =max_vehicle_mileage
        terms: =term_options_months
        base: =base_apr_by_term
        adders: =credit_grade_apr_adders
        floor: =apr_floor
        grades: =eligible_credit_grades
      Auto Refinance Loan:
        min_amount: =min_loan_amount
        max_amount: =max_loan_amount
        ltv: =max_ltv_pct
        vehicle_age: =max_vehicle_age_years
        mileage: =max_vehicle_mileage
        terms: =term_options_months
        base: =base_apr_by_term
        adders: =credit_grade_apr_adders
        floor: =apr_floor
        grades: =eligible_credit_grades
      Lease Buyout Loan:
        min_amount: =min_loan_amount
        max_amount: =max_loan_amount
        ltv: =max_ltv_pct
        vehicle_age: =max_vehicle_age_years
        mileage: =max_vehicle_mileage
        terms: =term_options_months
        base: =base_apr_by_term
        adders: =credit_grade_apr_adders
        floor: =apr_floor
        grades: =eligible_credit_grades
      New Vehicle Loan:
        min_amount: =min_loan_amount
        max_amount: =max_loan_amount
        ltv: =max_ltv_pct
        vehicle_age: =max_vehicle_age_years
        mileage: =max_vehicle_mileage
        terms: =term_options_months
        base: =base_apr_by_term
        adders: =credit_grade_apr_adders
        floor: =apr_floor
        grades: =eligible_credit_grades
      Green Vehicle Loan:
        min_amount: =min_loan_amount
        max_amount: =max_loan_amount
        ltv: =max_ltv_pct
        vehicle_age: =max_vehicle_age_years
        mileage: =max_vehicle_mileage
        terms: =term_options_months
        base: =base_apr_by_term
        adders: =credit_grade_apr_adders
        floor: =apr_floor
        grades: =eligible_credit_grades
- id: auto_agg_relationship_discount
  subject:
  - auto_fund
  - auto_set_autopay
  rule: The relationship discount of relationship_discount_pct is granted at funding when the borrower holds,
    on the funding date, an active checking account of a tier in relationship_qualifying_checking_tiers. It is
    fixed for the life of the loan once granted and is not added later if the qualifying account is opened after
    funding, nor removed if it later closes. The autopay discount and the relationship discount stack by simple
    addition up to max_total_discount_pct and never below apr_floor; any part of a discount cut off by the cap
    or floor is lost, not carried over. When autopay is cancelled and autopay_discount_removed_on_cancel is true,
    the APR rises by the autopay discount actually applied, and re-enrolling later restores it; the relationship
    discount is unaffected by autopay changes.
  eligibility:
  - id: qualifying_checking_at_funding
    applies_to:
    - auto_fund
    kind: authorization
    condition: The relationship discount of relationship_discount_pct is granted at funding when the borrower
      holds, on the funding date, an active checking account of a tier in relationship_qualifying_checking_tiers.
    evidence_fields:
    - checking_accounts.customer_id
    - checking_accounts.variant_name
    - checking_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - checking_accounts.customer_id
      action_bindings:
        checking_accounts.customer_id: customer_id
  params:
    per_tier:
      Used Vehicle Loan:
        autopay: =autopay_discount_pct
        relationship: =relationship_discount_pct
        cap: =max_total_discount_pct
        floor: =apr_floor
        qualifying: =relationship_qualifying_checking_tiers
      Certified Pre-Owned Vehicle Loan:
        autopay: =autopay_discount_pct
        relationship: =relationship_discount_pct
        cap: =max_total_discount_pct
        floor: =apr_floor
        qualifying: =relationship_qualifying_checking_tiers
      Auto Refinance Loan:
        autopay: =autopay_discount_pct
        relationship: =relationship_discount_pct
        cap: =max_total_discount_pct
        floor: =apr_floor
        qualifying: =relationship_qualifying_checking_tiers
      Lease Buyout Loan:
        autopay: =autopay_discount_pct
        relationship: =relationship_discount_pct
        cap: =max_total_discount_pct
        floor: =apr_floor
        qualifying: =relationship_qualifying_checking_tiers
      New Vehicle Loan:
        autopay: =autopay_discount_pct
        relationship: =relationship_discount_pct
        cap: =max_total_discount_pct
        floor: =apr_floor
        qualifying: =relationship_qualifying_checking_tiers
      Green Vehicle Loan:
        autopay: =autopay_discount_pct
        relationship: =relationship_discount_pct
        cap: =max_total_discount_pct
        floor: =apr_floor
        qualifying: =relationship_qualifying_checking_tiers
- id: auto_evt_payment_allocation
  subject:
  - auto_payment
  - auto_fee_settlement
  rule: 'Auto loans accrue daily simple interest: interest owed at any moment is auto_msr_accrued_interest, computed
    on the principal balance from last_payment_date. A payment received by payment_cutoff_time Eastern Time on
    a business day is credited that day, otherwise on the next business day. Payments post only to a loan whose
    status is active or delinquent. Each payment is applied in payment_allocation_order: first to fees_due, then
    to interest accrued through the credit date, then to principal; the fees part also writes an auto_fee_settlement
    row through its trigger, and last_payment_date becomes the credit date. A scheduled installment is satisfied
    when scheduled payments credited toward its installment_due_date total at least monthly_payment; next_payment_due_date
    then advances one month to the payment_due_day, and because overpayment_advances_due_date is false a payment
    larger than one installment reduces principal but never satisfies a later installment early. A principal-only
    payment, allowed where principal_only_payment_allowed is true and at least principal_only_min_amount, skips
    fees and interest and applies wholly to principal, but only when no installment is past due; otherwise it
    is applied as a scheduled payment. No prepayment penalty applies, since prepayment_penalty_pct is 0.00. Payments
    from a PCB checking account debit that account through the payment''s trigger.'
  eligibility:
  - id: loan_open
    applies_to:
    - auto_payment
    kind: state
    condition: Payments post only to a loan whose status is active or delinquent.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
    state_contract:
      field: auto_loans.status
      allowed:
      - active
      - delinquent
  formula:
    interest_due: auto_msr_accrued_interest
    principal_applied: max(0, amount - fees_due - auto_msr_accrued_interest)
  params:
    payment_cutoff_time: '17:00'
    per_tier:
      Used Vehicle Loan:
        order: =payment_allocation_order
        advances: =overpayment_advances_due_date
