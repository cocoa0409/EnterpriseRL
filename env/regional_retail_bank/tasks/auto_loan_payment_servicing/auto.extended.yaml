- id: auto_ext_payoff_settlement
  base_policy_refs:
  - auto_evt_payment_allocation
  - auto_evt_payoff_and_lien
  - auto_evt_gap_refund
  overwrite:
  - base_policy: auto_evt_payoff_and_lien
    superseded_clause: The payoff amount on a date is principal_balance plus auto_msr_accrued_interest through
      that date plus fees_due.
    replaced_by: The amount required to settle an auto loan in full is the unpaid principal the loan's records
      then show, together with the interest owed for the days the settlement clock runs and the charges standing
      unpaid on the loan, added and rounded half-up to the cent.
  - base_policy: auto_evt_payoff_and_lien
    superseded_clause: A loan that is paid off with GAP coverage in force earns a GAP refund under auto_evt_gap_refund.
    replaced_by: The amount required to settle the loan in full is fixed only after the refund owed on the waiver
      coverage financed with the loan stands entered on its records.
  - base_policy: auto_evt_gap_refund
    superseded_clause: Paying the loan off early with GAP in force is treated as a cancellation on the payoff
      date.
    replaced_by: The amount required to settle the loan in full is fixed only after the refund owed on the waiver
      coverage financed with the loan stands entered on its records.
  trigger: on_request
  subject:
  - auto_payment
  computes: settlement_amount
  target_tool: post_loan_payoff_a84c6454
  params:
    deposits_mid: 2
    card_spend_deep: 12000.0
    card_spend_mid: 3000.0
    installments_deep: 12
    installments_mid: 8
    reward_points_deep: 25000
    reward_points_mid: 5000
    card_purchases_deep: 12
    card_purchases_mid: 3
    transit_days_none: 0
    transit_days_short: 1
    transit_days_standard: 3
    seasoning_long: 36
    seasoning_mid: 24
  rule: The amount required to settle an auto loan in full is the unpaid principal the loan's records then show,
    together with the interest owed for the days the settlement clock runs and the charges standing unpaid on
    the loan, added and rounded half-up to the cent. The settlement clock runs for the days the anchor gives together
    with the transit allowance, and the interest is worked out on that unpaid principal at the settlement rate
    divided by the product's day count basis and multiplied by those days. Under the standard method the clock
    runs from the date of the last payment credited to the loan, the transit allowance is transit_days_standard
    days, the settlement rate is the rate recorded on the loan, and the interest is rounded half-up to the cent.
    The amount required to settle the loan in full is fixed only after the refund owed on the waiver coverage
    financed with the loan stands entered on its records. The clock runs from the date the most recent entry posted
    to the loan where both of these hold, that the borrower holds an active checking account whose posted balance
    is at least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring deposits
    have posted to that account in the last three months; it runs from the date the installment then due falls
    on where exactly one of those two holds; and it runs from the date of the last payment credited to the loan
    where neither of them holds. The settlement rate is the floor rate the product publishes where the borrower's
    card purchases over the last twelve months total at least card_spend_deep and at least installments_deep scheduled
    installments have been credited to the loan in the last twelve months; it is the rate recorded on the loan
    less the automatic-payment reduction the product publishes where those purchases total at least card_spend_mid
    and at least installments_mid scheduled installments have been credited in that window while either those
    purchases fall short of card_spend_deep or those installments fall short of installments_deep; and it is the
    rate recorded on the loan for every other borrower. The transit allowance is transit_days_none days where
    the borrower's card carries at least reward_points_deep unredeemed reward points and at least card_purchases_deep
    card purchases have posted in the last three months; it is transit_days_short days where that card carries
    at least reward_points_mid unredeemed reward points and at least card_purchases_mid card purchases have posted
    in the last three months while either those points fall short of reward_points_deep or those purchases fall
    short of card_purchases_deep; and it is transit_days_standard days for every other borrower. The interest
    is rounded down to the whole dollar where the loan was funded at least seasoning_long whole months before
    the settlement; it is rounded half-up to the whole dollar where the loan was funded at least seasoning_mid
    but less than seasoning_long whole months before the settlement; and it is rounded half-up to the cent where
    the loan was funded less than seasoning_mid whole months before the settlement.
  prerequisite:
  - problem: auto_ext_gap_cancellation_refund
    kind: value_input
    gate: principal_outstanding
    form: state
    policy_source: The amount required to settle the loan in full is fixed only after the refund owed on the waiver
      coverage financed with the loan stands entered on its records.
    condition: The loan's records carry a refund entry for the waiver coverage financed with it, and that coverage
      is no longer shown as in force.
    resolved_by: post_gap_refund_16f4decd
    effect: The unpaid principal the settlement is worked out on falls by the refund entered against the loan,
      so principal_outstanding takes the reduced figure.
  cross_category:
  - category: checking
    as: branch
    reads:
    - ledger_balance
    - variant_name
    - checking_transactions.amount
    note: The settlement clock anchor tier rests on the borrower's checking balance against its tier's waiver
      balance and on the recurring deposits posted to it.
  - category: card
    as: history
    reads:
    - card_transactions.amount
    - rewards_balance
    note: The settlement rate tier rests on the borrower's card purchase total over twelve months and the transit
      allowance tier on the card's reward points and recent purchases.
  compute:
  - principal_outstanding: F('principal_balance')
  - charges_standing: F('fees_due')
  - recorded_rate: F('interest_rate')
  - checking_balance: CFIELD('checking','ledger_balance', status='active')
  - checking_waiver_balance: CPARAM('checking','waiver_min_daily_balance', status='active')
  - recurring_deposits_3m: XCOUNT('checking','checking_transactions', within_months=3, date_field='posted_date',
      event_type='checking_deposit', channel='ach_direct_deposit')
  - settlement_span: DAYS(LATEST('auto_transactions','posted_date', date_field='posted_date'), NOW) if ((checking_balance
      or 0) >= (checking_waiver_balance or 0) and recurring_deposits_3m >= K('deposits_mid')) else (DAYS(F('next_payment_due_date'),
      NOW) if ((checking_balance or 0) >= (checking_waiver_balance or 0) or recurring_deposits_3m >= K('deposits_mid'))
      else DAYS(F('last_payment_date'), NOW))
  - card_year_spend: XSUM('card','card_transactions','amount', within_months=12, date_field='posted_date', event_type='card_purchase')
  - scheduled_paid_12m: COUNT('auto_transactions', within_months=12, date_field='posted_date', event_type='auto_payment',
      payment_type='scheduled')
  - settlement_rate: P('apr_floor') if (card_year_spend >= K('card_spend_deep') and scheduled_paid_12m >= K('installments_deep'))
      else (recorded_rate - P('autopay_discount_pct') if (card_year_spend >= K('card_spend_mid') and scheduled_paid_12m
      >= K('installments_mid') and (card_year_spend < K('card_spend_deep') or scheduled_paid_12m < K('installments_deep')))
      else recorded_rate)
  - card_reward_points: CFIELD('card','rewards_balance', status='active')
  - card_purchases_3m: XCOUNT('card','card_transactions', within_months=3, date_field='posted_date', event_type='card_purchase')
  - transit_allowance: K('transit_days_none') if ((card_reward_points or 0) >= K('reward_points_deep') and card_purchases_3m
      >= K('card_purchases_deep')) else (K('transit_days_short') if ((card_reward_points or 0) >= K('reward_points_mid')
      and card_purchases_3m >= K('card_purchases_mid') and ((card_reward_points or 0) < K('reward_points_deep')
      or card_purchases_3m < K('card_purchases_deep'))) else K('transit_days_standard'))
  - settlement_days: settlement_span + transit_allowance
  - interest_before_rounding: principal_outstanding * settlement_rate / 100 / P('interest_day_count_basis') *
      settlement_days
  - months_on_book: MONTHS(F('funded_date'), NOW)
  - interest_owed: float(int(interest_before_rounding)) if months_on_book >= K('seasoning_long') else (float(int(interest_before_rounding
      + 0.5)) if months_on_book >= K('seasoning_mid') else RND(interest_before_rounding, 2))
  - result: RND(principal_outstanding + interest_owed + charges_standing, 2)
  compute_basis:
    checking_balance: the borrower holds an active checking account whose posted balance is at least the fee-waiver
      daily balance its tier publishes
    checking_waiver_balance: at least the fee-waiver daily balance its tier publishes
    recurring_deposits_3m: at least deposits_mid recurring deposits have posted to that account in the last three
      months
    settlement_span: The clock runs from the date the most recent entry posted to the loan where both of these
      hold, that the borrower holds an active checking account whose posted balance is at least the fee-waiver
      daily balance its tier publishes and that at least deposits_mid recurring deposits have posted to that account
      in the last three months; it runs from the date the installment then due falls on where exactly one of those
      two holds; and it runs from the date of the last payment credited to the loan where neither of them holds.
    card_year_spend: where the borrower's card purchases over the last twelve months total at least card_spend_deep
    scheduled_paid_12m: at least installments_deep scheduled installments have been credited to the loan in the
      last twelve months
    settlement_rate: The settlement rate is the floor rate the product publishes where the borrower's card purchases
      over the last twelve months total at least card_spend_deep and at least installments_deep scheduled installments
      have been credited to the loan in the last twelve months; it is the rate recorded on the loan less the automatic-payment
      reduction the product publishes where those purchases total at least card_spend_mid and at least installments_mid
      scheduled installments have been credited in that window while either those purchases fall short of card_spend_deep
      or those installments fall short of installments_deep; and it is the rate recorded on the loan for every
      other borrower.
    card_reward_points: where the borrower's card carries at least reward_points_deep unredeemed reward points
    card_purchases_3m: at least card_purchases_deep card purchases have posted in the last three months
    transit_allowance: The transit allowance is transit_days_none days where the borrower's card carries at least
      reward_points_deep unredeemed reward points and at least card_purchases_deep card purchases have posted
      in the last three months; it is transit_days_short days where that card carries at least reward_points_mid
      unredeemed reward points and at least card_purchases_mid card purchases have posted in the last three months
      while either those points fall short of reward_points_deep or those purchases fall short of card_purchases_deep;
      and it is transit_days_standard days for every other borrower.
    settlement_days: The settlement clock runs for the days the anchor gives together with the transit allowance
    interest_before_rounding: the interest is worked out on that unpaid principal at the settlement rate divided
      by the product's day count basis and multiplied by those days
    months_on_book: where the loan was funded at least seasoning_long whole months before the settlement
    interest_owed: The interest is rounded down to the whole dollar where the loan was funded at least seasoning_long
      whole months before the settlement; it is rounded half-up to the whole dollar where the loan was funded
      at least seasoning_mid but less than seasoning_long whole months before the settlement; and it is rounded
      half-up to the cent where the loan was funded less than seasoning_mid whole months before the settlement.
    result: The amount required to settle an auto loan in full is the unpaid principal the loan's records then
      show, together with the interest owed for the days the settlement clock runs and the charges standing unpaid
      on the loan, added and rounded half-up to the cent.
  factors:
  - id: settlement_clock_anchor
    effect: method
    decides: settlement_span
    bindings:
    - checking_balance
    - checking_waiver_balance
    - recurring_deposits_3m
    - settlement_span
    ladder:
    - when: both of these hold, that the borrower holds an active checking account whose posted balance is at
        least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring deposits
        have posted to that account in the last three months
      method: the clock runs from the date the most recent entry posted to the loan
    - when: exactly one of those two holds
      method: the clock runs from the date the installment then due falls on
    - when: neither of them holds
      method: the clock runs from the date of the last payment credited to the loan
    baseline:
      settlement_span: DAYS(F('last_payment_date'), NOW)
    evidence:
    - cross_category
    - date
    cross_difficulty: checking
  - id: settlement_rate_step
    effect: parameter
    decides: settlement_rate
    bindings:
    - card_year_spend
    - scheduled_paid_12m
    - settlement_rate
    ladder:
    - when: the borrower's card purchases over the last twelve months total at least card_spend_deep and at least
        installments_deep scheduled installments have been credited to the loan in the last twelve months
      value: P('apr_floor')
    - when: those purchases total at least card_spend_mid and at least installments_mid scheduled installments
        have been credited in that window while either those purchases fall short of card_spend_deep or those
        installments fall short of installments_deep
      value: recorded_rate - P('autopay_discount_pct')
    - when: otherwise
      value: recorded_rate
    baseline:
      settlement_rate: recorded_rate
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: settlement_transit_allowance
    effect: parameter
    decides: transit_allowance
    bindings:
    - card_reward_points
    - card_purchases_3m
    - transit_allowance
    ladder:
    - when: the borrower's card carries at least reward_points_deep unredeemed reward points and at least card_purchases_deep
        card purchases have posted in the last three months
      value: K('transit_days_none')
    - when: that card carries at least reward_points_mid unredeemed reward points and at least card_purchases_mid
        card purchases have posted in the last three months while either those points fall short of reward_points_deep
        or those purchases fall short of card_purchases_deep
      value: K('transit_days_short')
    - when: otherwise
      value: K('transit_days_standard')
    baseline:
      transit_allowance: K('transit_days_standard')
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: settlement_interest_rounding
    effect: method
    decides: interest_owed
    bindings:
    - months_on_book
    - interest_owed
    ladder:
    - when: the loan was funded at least seasoning_long whole months before the settlement
      method: the interest is rounded down to the whole dollar
    - when: the loan was funded at least seasoning_mid but less than seasoning_long whole months before the settlement
      method: the interest is rounded half-up to the whole dollar
    - when: the loan was funded less than seasoning_mid whole months before the settlement
      method: the interest is rounded half-up to the cent
    baseline:
      interest_owed: RND(interest_before_rounding, 2)
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The amount required to settle an auto loan in full is the unpaid principal the loan's records then show,
      together with the interest owed for the days the settlement clock runs and the charges standing unpaid on
      the loan, added and rounded half-up to the cent. The settlement clock runs for the days the anchor gives
      together with the transit allowance, and the interest is worked out on that unpaid principal at the settlement
      rate divided by the product's day count basis and multiplied by those days. Under the standard method the
      clock runs from the date of the last payment credited to the loan, the transit allowance is transit_days_standard
      days, the settlement rate is the rate recorded on the loan, and the interest is rounded half-up to the cent.
    params:
    - transit_days_standard
  inputs:
    history:
    - table: auto_transactions
      aggregate: count
      field: auto_txn_id
      within_months: 12
      filters:
        event_type: auto_payment
        payment_type: scheduled
    - table: auto_transactions
      aggregate: latest
      field: posted_date
      within_months: 12
      filters: {}
    - category: card
      table: card_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: card_purchase
    - category: checking
      table: checking_transactions
      aggregate: count
      field: amount
      within_months: 3
      filters:
        event_type: checking_deposit
        channel: ach_direct_deposit
    cross_category:
    - checking
    - card
