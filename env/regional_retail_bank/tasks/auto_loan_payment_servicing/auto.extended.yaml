- id: auto_evt_late_charge
  subject:
  - auto_fee
  rule: The late charge follows the borrower's state_of_residence on the customer profile on the installment's
    due date. A late charge applies to an installment not satisfied within late_charge_grace_days_by_state calendar
    days after its due date. Count calendar days with the day after installment_due_date as day 1; the charge
    applies when the frozen date is after installment_due_date plus the state's grace days and the installment
    is still unsatisfied at the end of that last grace day. The charge equals late_charge_pct_by_state percent
    of monthly_payment, rounded half-up to the cent, capped at late_charge_cap_by_state, and is written as fee_code
    late_charge with that installment_due_date and posted_date the first day after grace. Each installment carries
    at most one late charge. No late charge applies to an installment deferred by an extension, to the fee portion
    of a payment, or to a loan that is charged off or paid off. Late charges are recorded in fees_due and paid
    first from later payments.
  eligibility:
  - id: grace_elapsed
    applies_to:
    - auto_fee
    kind: time
    condition: A late charge applies to an installment not satisfied within late_charge_grace_days_by_state calendar
      days after its due date.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.next_payment_due_date
    - customers.state_of_residence
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: its due date
      anchor_source: auto_loans.next_payment_due_date
      relation: not_before
      duration_source: variants.late_charge_grace_days_by_state
      unit: calendar_days
      counting_rule: Count calendar days with the day after installment_due_date as day 1; the charge applies
        when the frozen date is after installment_due_date plus the state's grace days and the installment is
        still unsatisfied at the end of that last grace day.
      boundary: exclusive
  - id: one_per_installment
    applies_to:
    - auto_fee
    kind: dedup
    condition: Each installment carries at most one late charge.
    evidence_fields:
    - auto_transactions.auto_loan_id
    - auto_transactions.installment_due_date
    - auto_transactions.fee_code
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_transactions.auto_loan_id
        - auto_transactions.installment_due_date
      action_bindings:
        auto_transactions.auto_loan_id: auto_loan_id
        auto_transactions.installment_due_date: installment_due_date
    dedup_contract:
      table: auto_transactions
      mode: separate_record
      object_bindings:
        auto_loan_id: auto_loan_id
        installment_due_date: installment_due_date
      duplicate_filters:
        event_type:
        - auto_fee
        fee_code:
        - late_charge
      distinct_fields: []
  formula:
    late_charge: min(late_charge_cap_by_state, round(monthly_payment * late_charge_pct_by_state / 100, 2))
  params:
    per_tier:
      Used Vehicle Loan:
        grace: =late_charge_grace_days_by_state
        pct: =late_charge_pct_by_state
        cap: =late_charge_cap_by_state
      Certified Pre-Owned Vehicle Loan:
        grace: =late_charge_grace_days_by_state
        pct: =late_charge_pct_by_state
        cap: =late_charge_cap_by_state
      Auto Refinance Loan:
        grace: =late_charge_grace_days_by_state
        pct: =late_charge_pct_by_state
        cap: =late_charge_cap_by_state
      Lease Buyout Loan:
        grace: =late_charge_grace_days_by_state
        pct: =late_charge_pct_by_state
        cap: =late_charge_cap_by_state
      New Vehicle Loan:
        grace: =late_charge_grace_days_by_state
        pct: =late_charge_pct_by_state
        cap: =late_charge_cap_by_state
      Green Vehicle Loan:
        grace: =late_charge_grace_days_by_state
        pct: =late_charge_pct_by_state
        cap: =late_charge_cap_by_state
- id: auto_evt_fee_waiver
  subject:
  - auto_fee_waiver
  rule: A fee is waived in full, never in part, as one auto_fee_waiver row whose source_item_id is the fee. A
    bank_error waiver applies to any fee assessed contrary to this charter, such as a late charge on an installment
    satisfied within the state grace days, above the state cap or percentage, on a deferred installment, or twice
    for one installment; it has no limit. A courtesy_waiver applies only to a late_charge. The customer's courtesy
    late charge waivers in the rolling 365 days, counted by auto_msr_late_charge_courtesy_365d across all of the
    customer's auto loans, must be below late_charge_courtesy_waivers_365d. The installments immediately before
    the late one must show at least late_charge_courtesy_min_on_time consecutive on-time installments by auto_msr_on_time_streak.
    The loan must be active or delinquent when a courtesy waiver is granted. A fee can be waived at most once.
    A waived fee that was already paid from a payment is returned by applying the waived amount to principal on
    the waiver date, recorded by the same waiver row; extension and returned payment fees are never waived as
    a courtesy.
  eligibility:
  - id: courtesy_count
    applies_to:
    - auto_fee_waiver
    kind: authorization
    condition: The customer's courtesy late charge waivers in the rolling 365 days, counted by auto_msr_late_charge_courtesy_365d
      across all of the customer's auto loans, must be below late_charge_courtesy_waivers_365d.
    evidence_fields:
    - auto_transactions.customer_id
    - auto_transactions.adjustment_reason
    - auto_transactions.posted_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_transactions.customer_id
      action_bindings:
        auto_transactions.customer_id: customer_id
  - id: on_time_before
    applies_to:
    - auto_fee_waiver
    kind: authorization
    condition: The installments immediately before the late one must show at least late_charge_courtesy_min_on_time
      consecutive on-time installments by auto_msr_on_time_streak.
    evidence_fields:
    - auto_transactions.auto_loan_id
    - auto_transactions.installment_due_date
    - auto_transactions.posted_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_transactions.auto_loan_id
      action_bindings:
        auto_transactions.auto_loan_id: auto_loan_id
  - id: loan_open_for_courtesy
    applies_to:
    - auto_fee_waiver
    kind: state
    condition: The loan must be active or delinquent when a courtesy waiver is granted.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
    state_contract:
      field: auto_loans.status
      allowed:
      - active
      - delinquent
  - id: waive_once
    applies_to:
    - auto_fee_waiver
    kind: dedup
    condition: A fee can be waived at most once.
    evidence_fields:
    - auto_transactions.source_item_id
    - auto_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_transactions.source_item_id
      action_bindings:
        auto_transactions.source_item_id: source_item_id
    dedup_contract:
      table: auto_transactions
      mode: separate_record
      object_bindings:
        source_item_id: source_item_id
      duplicate_filters:
        event_type:
        - auto_fee_waiver
      distinct_fields: []
  params:
    per_tier:
      Used Vehicle Loan:
        courtesy: =late_charge_courtesy_waivers_365d
        on_time: =late_charge_courtesy_min_on_time
      Certified Pre-Owned Vehicle Loan:
        courtesy: =late_charge_courtesy_waivers_365d
        on_time: =late_charge_courtesy_min_on_time
      Auto Refinance Loan:
        courtesy: =late_charge_courtesy_waivers_365d
        on_time: =late_charge_courtesy_min_on_time
      Lease Buyout Loan:
        courtesy: =late_charge_courtesy_waivers_365d
        on_time: =late_charge_courtesy_min_on_time
      New Vehicle Loan:
        courtesy: =late_charge_courtesy_waivers_365d
        on_time: =late_charge_courtesy_min_on_time
      Green Vehicle Loan:
        courtesy: =late_charge_courtesy_waivers_365d
        on_time: =late_charge_courtesy_min_on_time
  measures:
  - auto_msr_late_charge_courtesy_365d
  - auto_msr_on_time_streak
- id: auto_evt_payment_extension
  subject:
  - auto_extend
  - auto_fee
  rule: 'A payment extension defers one or up to max_months_per_extension installments to the end of the loan
    and is the borrower''s own agreement to modified terms: the agent registers an auto_requests row of request_type
    payment_extension in pending_customer_confirmation status, and the extension is granted only after the borrower
    signs. The loan must be active or delinquent by no more than extension_max_days_past_due days on the day it
    is granted. The loan must have been funded at least extension_min_loan_age_months whole months before the
    extension is granted. Count calendar months from funded_date; the extension is allowed when the frozen date
    is on or after funded_date plus extension_min_loan_age_months calendar months. At least extension_min_payments_made
    installments must have been satisfied by auto_msr_installments_paid. Extensions granted in the rolling 365
    days, counted by auto_msr_extensions_365d, must be below extensions_max_per_12_months, and extensions_used_lifetime
    must be below extensions_max_lifetime. When granted, next_payment_due_date and maturity_date each move forward
    by the number of deferred installments, interest keeps accruing daily on principal throughout, any unpaid
    late charges stay due, and the extension_fee is assessed as fee_code extension through the extension''s trigger.
    An extension cannot turn a delinquent loan current by itself unless the deferred installments are exactly
    the past-due ones. Requests for longer deferrals, rate reductions or principal forgiveness are outside this
    policy.'
  eligibility:
  - id: loan_age
    applies_to:
    - auto_extend
    kind: time
    condition: The loan must have been funded at least extension_min_loan_age_months whole months before the extension
      is granted.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.funded_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: The loan must have been funded
      anchor_source: auto_loans.funded_date
      relation: not_before
      duration_source: variants.extension_min_loan_age_months
      unit: calendar_months
      counting_rule: Count calendar months from funded_date; the extension is allowed when the frozen date is
        on or after funded_date plus extension_min_loan_age_months calendar months.
      boundary: inclusive
  - id: delinquency_limit
    applies_to:
    - auto_extend
    kind: authorization
    condition: The loan must be active or delinquent by no more than extension_max_days_past_due days on the day
      it is granted.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.status
    - auto_loans.days_past_due
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
  - id: frequency_limits
    applies_to:
    - auto_extend
    kind: authorization
    condition: Extensions granted in the rolling 365 days, counted by auto_msr_extensions_365d, must be below
      extensions_max_per_12_months, and extensions_used_lifetime must be below extensions_max_lifetime.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.extensions_used_lifetime
    - auto_transactions.auto_loan_id
    - auto_transactions.fee_code
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
  - id: borrower_signs
    applies_to:
    - auto_extend
    kind: caller_fact
    condition: 'A payment extension defers one or up to max_months_per_extension installments to the end of the
      loan and is the borrower''s own agreement to modified terms: the agent registers an auto_requests row of
      request_type payment_extension in pending_customer_confirmation status, and the extension is granted only
      after the borrower signs.'
    evidence_fields:
    - auto_requests.auto_request_id
    - auto_requests.auto_loan_id
    - auto_requests.request_status
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - auto_requests.auto_request_id
      action_bindings:
        auto_requests.auto_request_id: auto_request_id
  params:
