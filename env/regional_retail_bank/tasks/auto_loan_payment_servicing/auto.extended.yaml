category: auto
display_name: Auto Loans
binding:
  holding_table: auto_loans
  event_tables:
  - auto_transactions
  intake_tables:
  - auto_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    principal_balance: auto_principal
    fees_due: auto_fees_due
lifecycle:
  states:
  - applied
  - active
  - delinquent
  - charged_off
  - paid_off
  - withdrawn
  transitions:
  - from: applied
    to: active
    by: system
    means: The approved loan was funded to the dealer or prior lender and repayment began.
  - from: applied
    to: withdrawn
    by: system
    means: The application was declined, withdrawn by the applicant, or not funded within the funding window.
  - from: active
    to: delinquent
    by: system
    means: An installment remained unpaid for the delinquency threshold.
  - from: delinquent
    to: active
    by: system
    means: All past-due installments were paid and the loan is current again.
  - from: delinquent
    to: charged_off
    by: system
    means: The loan reached the charge-off threshold and the remaining principal was written off to recovery.
  - from: active
    to: paid_off
    by: system
    means: A payoff payment covering principal, accrued interest and fees posted.
  - from: delinquent
    to: paid_off
    by: system
    means: A delinquent loan was paid off in full.
accounts:
- key: auto_principal
  unit: USD
  meaning: Unpaid principal of one auto loan; the disbursement raises it and the principal portion of each payment
    lowers it.
- key: auto_fees_due
  unit: USD
  meaning: Unpaid late charges, extension fees and returned payment fees on one auto loan.
parameter_schema:
  age_min_to_apply: Youngest age in whole years at application; integer years.
  max_loans_this_tier: Most loans of this tier in applied, active or delinquent status one customer may hold;
    integer count.
  min_loan_amount: Smallest amount financed; USD.
  max_loan_amount: Largest amount financed; USD.
  max_ltv_pct: Largest amount financed as a percent of the vehicle's value (the lower of purchase price and book
    value); percent.
  max_vehicle_age_years: Oldest vehicle eligible, as current calendar year minus model year; integer years.
  max_vehicle_mileage: Highest odometer reading eligible at application; integer miles.
  eligible_powertrains: Powertrain types eligible for this tier; list, or 'any'.
  eligible_credit_grades: Credit grades underwriting may approve on this tier; list of grades A to D.
  term_options_months: Loan terms offered; list of integer months.
  base_apr_by_term: Base APR before credit-grade adders and discounts, by term; mapping of term months to APR
    percent.
  credit_grade_apr_adders: Percentage points added to the base APR by credit grade; mapping of grade to percent.
  autopay_discount_pct: Percentage points off the APR while autopay from a PCB checking account is enrolled; percent.
  relationship_discount_pct: Percentage points off the APR when the borrower held a qualifying checking tier at
    funding; percent.
  relationship_qualifying_checking_tiers: Checking tiers earning the relationship discount; list of official checking
    tier names.
  max_total_discount_pct: Most percentage points all discounts together can take off the APR; percent.
  apr_floor: APR below which discounts never take the rate; percent.
  funding_window_days: Calendar days after application within which an approved loan must fund; integer days.
  first_payment_max_days: Latest first due date, in calendar days after funding; integer days.
  interest_day_count_basis: Days in the year for daily simple interest; integer days.
  payment_allocation_order: Order in which each payment is applied; ordered list of fees, interest, principal.
  overpayment_advances_due_date: Whether paying more than one installment moves the next due date forward; boolean.
  principal_only_payment_allowed: Whether a payment may be designated to principal only; boolean.
  principal_only_min_amount: Smallest principal-only payment; USD.
  prepayment_penalty_pct: Penalty on paying the loan off early, as a percent of principal prepaid; percent.
  late_charge_grace_days_by_state: Calendar days after the due date before a late charge applies, by borrower's
    state of residence; mapping of state to integer days.
  late_charge_pct_by_state: Late charge as a percent of the installment, by borrower's state; mapping of state
    to percent.
  late_charge_cap_by_state: Largest late charge per installment, by borrower's state; mapping of state to USD.
  late_charge_courtesy_waivers_365d: Courtesy late charge waivers per customer in a rolling 365 days; integer
    count.
  late_charge_courtesy_min_on_time: Consecutive on-time installments before the late one that a courtesy waiver
    requires; integer count.
  returned_payment_fee: Fee when a payment is returned unpaid; USD.
  extension_fee: Fee for each payment extension granted; USD.
  max_months_per_extension: Most installments one extension may defer; integer count.
  extensions_max_per_12_months: Most extensions granted in any rolling 365 days; integer count.
  extensions_max_lifetime: Most extensions granted over the life of the loan; integer count.
  extension_min_loan_age_months: Whole months since funding before an extension may be granted; integer months.
  extension_min_payments_made: Scheduled installments that must have been paid before an extension may be granted;
    integer count.
  extension_max_days_past_due: Most days past due a loan may be when an extension is granted; integer days.
  due_date_change_max_per_12_months: Due date changes allowed in any rolling 365 days; integer count.
  due_date_change_max_shift_days: Largest move of the due day, in calendar days; integer days.
  payoff_quote_valid_days: Calendar days a payoff quote remains good, with per-diem interest added through the
    payoff date; integer days.
  gap_available: Whether GAP waiver coverage may be purchased with this loan; boolean.
  gap_premium: One-time GAP waiver charge financed at funding; USD.
  gap_cancellation_full_refund_days: Calendar days after funding within which a GAP cancellation refunds the full
    charge; integer days.
  gap_cancellation_fee: Fee deducted from a pro-rata GAP refund after the full-refund window; USD.
  gap_refund_method: How a GAP refund is prorated after the full-refund window; 'pro_rata_by_remaining_term'.
  lien_release_business_days: Business days after payoff by which the lien release is sent; integer business days.
  delinquency_status_days: Days past due at which the loan becomes delinquent; integer days.
  chargeoff_days_past_due: Days past due at which the remaining principal is charged off; integer days.
  autopay_discount_removed_on_cancel: Whether cancelling autopay removes the autopay discount; boolean.
