        min_paid: =extension_min_payments_made
        max_dpd: =extension_max_days_past_due
      Certified Pre-Owned Vehicle Loan:
        fee: =extension_fee
        months: =max_months_per_extension
        per_year: =extensions_max_per_12_months
        lifetime: =extensions_max_lifetime
        min_age: =extension_min_loan_age_months
        min_paid: =extension_min_payments_made
        max_dpd: =extension_max_days_past_due
      Auto Refinance Loan:
        fee: =extension_fee
        months: =max_months_per_extension
        per_year: =extensions_max_per_12_months
        lifetime: =extensions_max_lifetime
        min_age: =extension_min_loan_age_months
        min_paid: =extension_min_payments_made
        max_dpd: =extension_max_days_past_due
      Lease Buyout Loan:
        fee: =extension_fee
        months: =max_months_per_extension
        per_year: =extensions_max_per_12_months
