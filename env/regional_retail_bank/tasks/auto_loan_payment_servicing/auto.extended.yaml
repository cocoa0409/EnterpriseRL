- id: auto_due_date_change
  subject:
  - auto_change_due_date
  rule: A borrower may move the monthly due day to another day from 1 to 28. The new due day may differ from the
    current one by at most due_date_change_max_shift_days calendar days in either direction, counted within the
    month. The loan must be active with no installment past due. Every product allows due_date_change_max_per_12_months
    change per rolling window of due_date_change_window_days calendar days. A due date change is allowed only
    when due_date_change_window_days calendar days have passed since the last change. Count calendar days with
    the day after last_due_date_change_date as day 1; a new change is allowed when the frozen date is on or after
    last_due_date_change_date plus due_date_change_window_days, or when there has been no earlier change. The
    next due date moves to the new day in the month of the current next_payment_due_date; interest keeps accruing
    daily, so a later due day means more interest in that installment. The maturity date is not changed, and no
    fee is charged.
  eligibility:
  - id: once_a_year
    applies_to:
    - auto_change_due_date
    kind: time
    condition: A due date change is allowed only when due_date_change_window_days calendar days have passed since
      the last change.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.last_due_date_change_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: since the last change
      anchor_source: auto_loans.last_due_date_change_date
      relation: not_before
      duration_source: params.due_date_change_window_days
      unit: calendar_days
      counting_rule: Count calendar days with the day after last_due_date_change_date as day 1; a new change is
        allowed when the frozen date is on or after last_due_date_change_date plus due_date_change_window_days,
        or when there has been no earlier change.
      boundary: inclusive
  - id: current_and_active
    applies_to:
    - auto_change_due_date
    kind: state
    condition: The loan must be active with no installment past due.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.status
    - auto_loans.days_past_due
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
    state_contract:
      field: auto_loans.status
      allowed:
      - active
  params:
    due_date_change_window_days: 365
    per_tier:
      Used Vehicle Loan:
        per_year: =due_date_change_max_per_12_months
        shift: =due_date_change_max_shift_days
      Certified Pre-Owned Vehicle Loan:
        per_year: =due_date_change_max_per_12_months
        shift: =due_date_change_max_shift_days
      Auto Refinance Loan:
        per_year: =due_date_change_max_per_12_months
        shift: =due_date_change_max_shift_days
      Lease Buyout Loan:
        per_year: =due_date_change_max_per_12_months
        shift: =due_date_change_max_shift_days
      New Vehicle Loan:
        per_year: =due_date_change_max_per_12_months
        shift: =due_date_change_max_shift_days
      Green Vehicle Loan:
        per_year: =due_date_change_max_per_12_months
        shift: =due_date_change_max_shift_days
- id: auto_evt_autopay
  subject:
  - auto_set_autopay
  rule: Autopay debits a PCB checking account for monthly_payment on each due date. The autopay source must be
    a checking account of the same customer in active status when autopay is enrolled. Enrolling or cancelling
    is the borrower's own instruction to move their funds, and the loan must be active or delinquent. Enrolling
    adds the autopay discount to the APR, within the cap and floor of auto_agg_relationship_discount, from the
    next installment due at least autopay_lead_days calendar days after enrollment; cancelling removes it on the
    same schedule when autopay_discount_removed_on_cancel is true. A change of APR does not change monthly_payment;
    it changes the split between interest and principal and therefore the final installment. An autopay debit
    returned unpaid is handled as a returned payment, and autopay stays enrolled.
  eligibility:
  - id: source_account
    applies_to:
    - auto_set_autopay
    kind: authorization
    condition: The autopay source must be a checking account of the same customer in active status when autopay
      is enrolled.
    evidence_fields:
    - checking_accounts.checking_account_id
    - checking_accounts.customer_id
    - checking_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - checking_accounts.checking_account_id
      action_bindings:
        checking_accounts.checking_account_id: autopay_source_account_id
  params:
    autopay_lead_days: 5
    per_tier:
      Used Vehicle Loan:
        discount: =autopay_discount_pct
        removed_on_cancel: =autopay_discount_removed_on_cancel
      Certified Pre-Owned Vehicle Loan:
        discount: =autopay_discount_pct
        removed_on_cancel: =autopay_discount_removed_on_cancel
      Auto Refinance Loan:
        discount: =autopay_discount_pct
        removed_on_cancel: =autopay_discount_removed_on_cancel
      Lease Buyout Loan:
        discount: =autopay_discount_pct
        removed_on_cancel: =autopay_discount_removed_on_cancel
      New Vehicle Loan:
        discount: =autopay_discount_pct
        removed_on_cancel: =autopay_discount_removed_on_cancel
      Green Vehicle Loan:
        discount: =autopay_discount_pct
        removed_on_cancel: =autopay_discount_removed_on_cancel
- id: auto_evt_payoff_and_lien
  subject:
  - auto_payment
  - auto_pay_off
  - auto_release_lien
  rule: The payoff amount on a date is principal_balance plus auto_msr_accrued_interest through that date plus
    fees_due. A payoff quote states the amount for a date up to payoff_quote_valid_days calendar days ahead together
    with the per-diem interest, principal_balance times interest_rate divided by 100 and by interest_day_count_basis,
    rounded half-up to the cent. A payment of at least the payoff amount on its credit date posts as payment_type
    payoff, pays fees, interest and principal to zero, and moves the loan to paid_off through its trigger; any
    excess is refunded to the payer within overpayment_refund_business_days business days by the same method it
    came from, and a shortfall leaves the loan open with the payment applied normally. The lien release must be
    sent within lien_release_business_days business days after the loan was paid off. Business days are Monday
    through Friday excluding Federal Reserve holidays; count business days with the first business day after closed_date
    as day 1; the release is due by the business day that ends the count. The release is sent electronically to
    the state motor vehicle agency where the title is electronic, and otherwise the signed title is mailed to
    the address on file. A loan that is paid off with GAP coverage in force earns a GAP refund under auto_evt_gap_refund.
  eligibility:
  - id: release_deadline
    applies_to:
    - auto_release_lien
    kind: time
    condition: The lien release must be sent within lien_release_business_days business days after the loan was
      paid off.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.closed_date
    - auto_loans.lien_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the loan was paid off
      anchor_source: auto_loans.closed_date
      relation: not_after
      duration_source: variants.lien_release_business_days
      unit: business_days
      counting_rule: Business days are Monday through Friday excluding Federal Reserve holidays; count business
        days with the first business day after closed_date as day 1; the release is due by the business day that
        ends the count.
      boundary: inclusive
  formula:
    payoff_amount: principal_balance + auto_msr_accrued_interest + fees_due
    per_diem: round(principal_balance * interest_rate / 100 / interest_day_count_basis, 2)
  params:
    overpayment_refund_business_days: 5
    per_tier:
      Used Vehicle Loan:
        quote_days: =payoff_quote_valid_days
        release_days: =lien_release_business_days
      Certified Pre-Owned Vehicle Loan:
        quote_days: =payoff_quote_valid_days
        release_days: =lien_release_business_days
      Auto Refinance Loan:
        quote_days: =payoff_quote_valid_days
        release_days: =lien_release_business_days
      Lease Buyout Loan:
        quote_days: =payoff_quote_valid_days
        release_days: =lien_release_business_days
      New Vehicle Loan:
        quote_days: =payoff_quote_valid_days
        release_days: =lien_release_business_days
      Green Vehicle Loan:
        quote_days: =payoff_quote_valid_days
        release_days: =lien_release_business_days
  measures:
  - auto_msr_accrued_interest
- id: auto_evt_gap_refund
  subject:
  - auto_cancel_gap
  - auto_gap_refund
  rule: GAP waiver coverage is optional and may be cancelled by the borrower at any time while the loan is open;
    cancelling is the borrower's own decision recorded through an auto_requests row of request_type gap_cancellation
    that the borrower confirms. A GAP cancellation within gap_cancellation_full_refund_days calendar days after
    the loan funded refunds the whole gap_premium. Count calendar days with the day after funded_date as day 1;
    the full refund applies when the cancellation date is on or before funded_date plus gap_cancellation_full_refund_days.
    After that window the refund is gap_premium times the number of whole months remaining to the scheduled maturity_date
    divided by term_months, rounded half-up to the cent, minus gap_cancellation_fee, and no refund is made when
    that is zero or less. Paying the loan off early with GAP in force is treated as a cancellation on the payoff
    date. Each loan receives at most one GAP refund. The refund is paid to a PCB checking account of the borrower
    or by official check; it is never applied to the loan balance.
  eligibility:
  - id: full_refund_window
    applies_to:
    - auto_gap_refund
    kind: time
    condition: A GAP cancellation within gap_cancellation_full_refund_days calendar days after the loan funded
      refunds the whole gap_premium.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.funded_date
    - auto_loans.gap_cancellation_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the loan funded
      anchor_source: auto_loans.funded_date
      relation: not_after
      duration_source: variants.gap_cancellation_full_refund_days
      unit: calendar_days
      counting_rule: Count calendar days with the day after funded_date as day 1; the full refund applies when
        the cancellation date is on or before funded_date plus gap_cancellation_full_refund_days.
      boundary: inclusive
  - id: one_refund
    applies_to:
    - auto_gap_refund
    kind: dedup
    condition: Each loan receives at most one GAP refund.
    evidence_fields:
    - auto_transactions.auto_loan_id
    - auto_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_transactions.auto_loan_id
      action_bindings:
        auto_transactions.auto_loan_id: auto_loan_id
    dedup_contract:
      table: auto_transactions
      mode: separate_record
      object_bindings:
        auto_loan_id: auto_loan_id
      duplicate_filters:
        event_type:
        - auto_gap_refund
      distinct_fields: []
  params:
    per_tier:
      Used Vehicle Loan:
        available: =gap_available
        premium: =gap_premium
        full_days: =gap_cancellation_full_refund_days
        fee: =gap_cancellation_fee
        method: =gap_refund_method
      Certified Pre-Owned Vehicle Loan:
        available: =gap_available
        premium: =gap_premium
        full_days: =gap_cancellation_full_refund_days
        fee: =gap_cancellation_fee
        method: =gap_refund_method
      Auto Refinance Loan:
        available: =gap_available
        premium: =gap_premium
        full_days: =gap_cancellation_full_refund_days
        fee: =gap_cancellation_fee
        method: =gap_refund_method
      Lease Buyout Loan:
        available: =gap_available
        premium: =gap_premium
        full_days: =gap_cancellation_full_refund_days
        fee: =gap_cancellation_fee
        method: =gap_refund_method
      New Vehicle Loan:
        available: =gap_available
        premium: =gap_premium
        full_days: =gap_cancellation_full_refund_days
        fee: =gap_cancellation_fee
        method: =gap_refund_method
      Green Vehicle Loan:
        available: =gap_available
        premium: =gap_premium
        full_days: =gap_cancellation_full_refund_days
        fee: =gap_cancellation_fee
        method: =gap_refund_method
- id: auto_evt_returned_payment
  subject:
  - auto_payment_reversal
  - auto_fee
  rule: A payment returned unpaid by the paying bank is reversed in full. An auto_payment_reversal restores its
    principal_portion to principal; its interest_portion becomes accrued interest again because last_payment_date
    returns to the date it held before the payment; and when the returned payment had a fees_portion, that amount
    becomes due again as one auto_fee row with fee_code settlement_reversal and the returned payment as source_item_id.
    The installment the payment satisfied becomes unsatisfied again, so a late charge may follow once the grace
    days have passed. The return also incurs returned_payment_fee as fee_code returned_payment through the reversal's
    trigger. Each returned payment carries at most one returned payment fee, of returned_payment_fee. Blocking
    a payment source after repeated returns is a fraud-operations decision outside this policy.
  eligibility:
  - id: one_fee_per_return
    applies_to:
    - auto_fee
    kind: dedup
    condition: Each returned payment carries at most one returned payment fee, of returned_payment_fee.
    evidence_fields:
    - auto_transactions.source_item_id
    - auto_transactions.fee_code
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_transactions.source_item_id
      action_bindings:
        auto_transactions.source_item_id: source_item_id
    dedup_contract:
      table: auto_transactions
      mode: separate_record
      object_bindings:
        source_item_id: source_item_id
      duplicate_filters:
        event_type:
        - auto_fee
        fee_code:
        - returned_payment
      distinct_fields: []
  params:
    per_tier:
      Used Vehicle Loan:
        fee: =returned_payment_fee
      Certified Pre-Owned Vehicle Loan:
        fee: =returned_payment_fee
      Auto Refinance Loan:
        fee: =returned_payment_fee
      Lease Buyout Loan:
        fee: =returned_payment_fee
      New Vehicle Loan:
        fee: =returned_payment_fee
      Green Vehicle Loan:
        fee: =returned_payment_fee
- id: auto_evt_delinquency
  subject:
  - auto_become_delinquent
  - auto_cure
  - auto_charge_off
  - auto_chargeoff_writeoff
  rule: days_past_due counts calendar days since the earliest unsatisfied installment_due_date and returns to
    zero when every past-due installment is satisfied. The loan becomes delinquent when days_past_due reaches
    delinquency_status_days. A delinquent loan returns to active when days_past_due returns to zero. The remaining
    principal is charged off when days_past_due reaches chargeoff_days_past_due; the charge-off writes an auto_chargeoff_writeoff
    for the whole principal_balance and the debt passes to recovery. Repossession, settlements, hardship modifications
    and payment plans for delinquent loans are outside this policy.
  eligibility:
  - id: delinquency_threshold
    applies_to:
    - auto_become_delinquent
    kind: authorization
    condition: The loan becomes delinquent when days_past_due reaches delinquency_status_days.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.days_past_due
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
  - id: chargeoff_threshold
    applies_to:
    - auto_charge_off
    kind: authorization
    condition: The remaining principal is charged off when days_past_due reaches chargeoff_days_past_due; the
      charge-off writes an auto_chargeoff_writeoff for the whole principal_balance and the debt passes to recovery.
    evidence_fields:
    - auto_loans.auto_loan_id
    - auto_loans.days_past_due
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auto_loans.auto_loan_id
      action_bindings:
        auto_loans.auto_loan_id: auto_loan_id
  params:
    per_tier:
      Used Vehicle Loan:
        delinquent_dpd: =delinquency_status_days
        chargeoff_dpd: =chargeoff_days_past_due
      Certified Pre-Owned Vehicle Loan:
        delinquent_dpd: =delinquency_status_days
        chargeoff_dpd: =chargeoff_days_past_due
      Auto Refinance Loan:
        delinquent_dpd: =delinquency_status_days
        chargeoff_dpd: =chargeoff_days_past_due
      Lease Buyout Loan:
        delinquent_dpd: =delinquency_status_days
        chargeoff_dpd: =chargeoff_days_past_due
      New Vehicle Loan:
        delinquent_dpd: =delinquency_status_days
        chargeoff_dpd: =chargeoff_days_past_due
      Green Vehicle Loan:
        delinquent_dpd: =delinquency_status_days
        chargeoff_dpd: =chargeoff_days_past_due
extended_policies:
- id: auto_ext_fee_overcharge_correction
  base_policy_refs:
  - auto_evt_fee_waiver
  - auto_evt_late_charge
  overwrite:
  - base_policy: auto_evt_late_charge
    superseded_clause: The charge equals late_charge_pct_by_state percent of monthly_payment, rounded half-up
      to the cent, capped at late_charge_cap_by_state
    replaced_by: 'The amount this charter fixes for a late charge is worked out from the scheduled installment
      in four steps, in this order: the acting base is settled first, the correction percentage is then applied
      to that base to give the charge before any ceiling, the ceiling is then applied to that figure, and the
      figure that survives the ceiling is rounded last.'
  - base_policy: auto_evt_fee_waiver
    superseded_clause: A fee is waived in full, never in part, as one auto_fee_waiver row whose source_item_id
      is the fee.
    replaced_by: A late charge standing on an auto loan above the amount this charter fixes for it is put right
      by one correction entry booked against that charge for the difference between the amount standing for it
      and the amount this charter fixes, and the remainder of the charge stands.
  trigger: state_due
  subject:
  - auto_fee_waiver
  computes: correction_amount
  target_tool: correct_loan_fee_ab5fa380
  params:
    correction_pct_deep: 3.0
    correction_pct_mid: 4.0
    correction_pct_standard: 5.0
    card_spend_deep: 6000.0
    card_spend_mid: 2500.0
    installments_deep: 10
    installments_mid: 6
    deposits_mid: 2
    correction_ceiling_high: 25.0
    correction_ceiling_mid: 22.0
    correction_ceiling_standard: 15.4
    prior_charges_many: 3
    prior_charges_some: 2
    seasoning_long: 36
    seasoning_mid: 24
  rule: 'A late charge standing on an auto loan above the amount this charter fixes for it is put right by one
    correction entry booked against that charge for the difference between the amount standing for it and the
    amount this charter fixes, and the remainder of the charge stands. The amount standing for the charge is the
    amount of the late charge most recently assessed on the loan. The amount this charter fixes for a late charge
    is worked out from the scheduled installment in four steps, in this order: the acting base is settled first,
    the correction percentage is then applied to that base to give the charge before any ceiling, the ceiling
    is then applied to that figure, and the figure that survives the ceiling is rounded last. Under the standard
    method the acting base is the scheduled installment together with the charges standing unpaid on the loan,
    the correction percentage is correction_pct_standard percent, the ceiling is correction_ceiling_standard,
    and the figure that survives the ceiling is rounded half-up to the cent. The correction entry is never more
    than the amount standing, and where the amount standing is no more than the amount this charter fixes no correction
    entry is booked at all. The correction percentage is correction_pct_deep percent where the borrower''s card
    purchases over the last twelve months total at least card_spend_deep and at least installments_deep scheduled
    installments have been credited to the loan in the last twelve months; it is correction_pct_mid percent where
    those purchases total at least card_spend_mid and at least installments_mid scheduled installments have been
    credited to the loan in the last twelve months while either those purchases fall short of card_spend_deep
    or those installments fall short of installments_deep; and it is correction_pct_standard percent for every
    other borrower. The acting base is the scheduled installment less the payments credited to the loan in the
    current calendar month where both of these hold, that the borrower holds an active checking account whose
    posted balance is at least the fee-waiver daily balance its tier publishes and that at least deposits_mid
    recurring deposits have posted to that account in the last three months; it is the scheduled installment alone
    where exactly one of those two holds; and it is the scheduled installment together with the charges standing
    unpaid on the loan where neither of them holds. The ceiling is correction_ceiling_high where prior_charges_many
    or more late charges have been assessed on the loan in the last twenty-four months; it is correction_ceiling_mid
    where at least prior_charges_some but fewer than prior_charges_many late charges have been assessed in that
    window; and it is correction_ceiling_standard where fewer than prior_charges_some late charges have been assessed
    in that window. The figure that survives the ceiling is rounded down to the whole dollar where the loan was
    funded at least seasoning_long whole months before the correction; it is rounded half-up to the whole dollar
    where the loan was funded at least seasoning_mid but less than seasoning_long whole months before the correction;
    and it is rounded half-up to the cent where the loan was funded less than seasoning_mid whole months before
    the correction.'
  prerequisite: []
  cross_category:
  - category: card
    as: history
    reads:
    - card_transactions.amount
    note: The correction percentage tier rests on the borrower's card purchase total over the last twelve months.
  - category: checking
    as: branch
    reads:
    - ledger_balance
    - variant_name
    - checking_transactions.amount
    note: The acting base tier rests on the borrower's checking balance against its tier's waiver balance and
      on the recurring deposits posted to it.
  compute:
  - installment_amount: F('monthly_payment')
  - charges_standing: F('fees_due')
  - card_year_spend: XSUM('card','card_transactions','amount', within_months=12, date_field='posted_date', event_type='card_purchase')
  - scheduled_paid_12m: COUNT('auto_transactions', within_months=12, date_field='posted_date', event_type='auto_payment',
      payment_type='scheduled')
  - correction_rate: K('correction_pct_deep') if (card_year_spend >= K('card_spend_deep') and scheduled_paid_12m
      >= K('installments_deep')) else (K('correction_pct_mid') if (card_year_spend >= K('card_spend_mid') and
      scheduled_paid_12m >= K('installments_mid') and (card_year_spend < K('card_spend_deep') or scheduled_paid_12m
      < K('installments_deep'))) else K('correction_pct_standard'))
  - checking_balance: CFIELD('checking','ledger_balance', status='active')
  - checking_waiver_balance: CPARAM('checking','waiver_min_daily_balance', status='active')
  - recurring_deposits_3m: XCOUNT('checking','checking_transactions', within_months=3, date_field='posted_date',
      event_type='checking_deposit', channel='ach_direct_deposit')
  - acting_base: installment_amount - SUM('auto_transactions','amount', within_months=1, date_field='posted_date',
      event_type='auto_payment') if ((checking_balance or 0) >= (checking_waiver_balance or 0) and recurring_deposits_3m
      >= K('deposits_mid')) else (installment_amount if ((checking_balance or 0) >= (checking_waiver_balance or
      0) or recurring_deposits_3m >= K('deposits_mid')) else installment_amount + charges_standing)
  - charge_before_ceiling: acting_base * correction_rate / 100
  - prior_late_charges_24m: COUNT('auto_transactions', within_months=24, date_field='posted_date', event_type='auto_fee',
      fee_code='late_charge')
  - charge_ceiling: K('correction_ceiling_high') if prior_late_charges_24m >= K('prior_charges_many') else (K('correction_ceiling_mid')
      if prior_late_charges_24m >= K('prior_charges_some') else K('correction_ceiling_standard'))
  - charge_after_ceiling: MN(charge_before_ceiling, charge_ceiling)
  - months_on_book: MONTHS(F('funded_date'), NOW)
  - charter_charge: float(int(charge_after_ceiling)) if months_on_book >= K('seasoning_long') else (float(int(charge_after_ceiling
      + 0.5)) if months_on_book >= K('seasoning_mid') else RND(charge_after_ceiling, 2))
  - amount_standing: LATEST('auto_transactions','amount', date_field='posted_date', event_type='auto_fee', fee_code='late_charge')
  - result: MX(0.0, RND(amount_standing - charter_charge, 2))
  compute_basis:
    card_year_spend: The correction percentage is correction_pct_deep percent where the borrower's card purchases
      over the last twelve months total at least card_spend_deep and at least installments_deep scheduled installments
      have been credited to the loan in the last twelve months
    scheduled_paid_12m: at least installments_deep scheduled installments have been credited to the loan in the
      last twelve months
    correction_rate: The correction percentage is correction_pct_deep percent where the borrower's card purchases
      over the last twelve months total at least card_spend_deep and at least installments_deep scheduled installments
      have been credited to the loan in the last twelve months; it is correction_pct_mid percent where those purchases
      total at least card_spend_mid and at least installments_mid scheduled installments have been credited to
      the loan in the last twelve months while either those purchases fall short of card_spend_deep or those installments
      fall short of installments_deep; and it is correction_pct_standard percent for every other borrower.
    checking_balance: where the borrower holds an active checking account whose posted balance is at least the
      fee-waiver daily balance its tier publishes
    checking_waiver_balance: at least the fee-waiver daily balance its tier publishes
    recurring_deposits_3m: at least deposits_mid recurring deposits have posted to that account in the last three
      months
    acting_base: The acting base is the scheduled installment less the payments credited to the loan in the current
      calendar month where both of these hold, that the borrower holds an active checking account whose posted
      balance is at least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring
      deposits have posted to that account in the last three months; it is the scheduled installment alone where
      exactly one of those two holds; and it is the scheduled installment together with the charges standing unpaid
      on the loan where neither of them holds.
    charge_before_ceiling: the correction percentage is then applied to that base to give the charge before any
      ceiling
    prior_late_charges_24m: where prior_charges_many or more late charges have been assessed on the loan in the
      last twenty-four months
    charge_ceiling: The ceiling is correction_ceiling_high where prior_charges_many or more late charges have
      been assessed on the loan in the last twenty-four months; it is correction_ceiling_mid where at least prior_charges_some
      but fewer than prior_charges_many late charges have been assessed in that window; and it is correction_ceiling_standard
      where fewer than prior_charges_some late charges have been assessed in that window.
    charge_after_ceiling: the ceiling is then applied to that figure
    months_on_book: where the loan was funded at least seasoning_long whole months before the correction
    charter_charge: The figure that survives the ceiling is rounded down to the whole dollar where the loan was
      funded at least seasoning_long whole months before the correction; it is rounded half-up to the whole dollar
      where the loan was funded at least seasoning_mid but less than seasoning_long whole months before the correction;
      and it is rounded half-up to the cent where the loan was funded less than seasoning_mid whole months before
      the correction.
    amount_standing: The amount standing for the charge is the amount of the late charge most recently assessed
      on the loan.
    result: one correction entry booked against that charge for the difference between the amount standing for
      it and the amount this charter fixes
  factors:
  - id: correction_percentage
    effect: parameter
    decides: correction_rate
    bindings:
    - card_year_spend
    - scheduled_paid_12m
    - correction_rate
    ladder:
    - when: the borrower's card purchases over the last twelve months total at least card_spend_deep and at least
        installments_deep scheduled installments have been credited to the loan in the last twelve months
      value: K('correction_pct_deep')
    - when: the borrower's card purchases over the last twelve months total at least card_spend_mid and at least
        installments_mid scheduled installments have been credited to the loan in the last twelve months while
        either those purchases fall short of card_spend_deep or those installments fall short of installments_deep
      value: K('correction_pct_mid')
    - when: otherwise
      value: K('correction_pct_standard')
    baseline:
      correction_rate: K('correction_pct_standard')
    evidence:
    - history
    - cross_category
    cross_difficulty: card
  - id: acting_base_rule
    effect: method
    decides: acting_base
    bindings:
    - checking_balance
    - checking_waiver_balance
    - recurring_deposits_3m
    - acting_base
    ladder:
    - when: both of these hold, that the borrower holds an active checking account whose posted balance is at
        least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring deposits
        have posted to that account in the last three months
      method: the percentage acts on the scheduled installment less the payments credited to the loan in the current
        calendar month
    - when: exactly one of those two holds
      method: the percentage acts on the scheduled installment alone
    - when: otherwise
      method: the percentage acts on the scheduled installment together with the charges standing unpaid on the
        loan
    baseline:
      acting_base: installment_amount + charges_standing
    evidence:
    - cross_category
    - history
    cross_difficulty: checking
  - id: charge_ceiling_step
    effect: parameter
    decides: charge_ceiling
    bindings:
    - prior_late_charges_24m
    - charge_ceiling
    ladder:
    - when: prior_charges_many or more late charges have been assessed on the loan in the last twenty-four months
      value: K('correction_ceiling_high')
    - when: at least prior_charges_some but fewer than prior_charges_many late charges have been assessed on the
        loan in the last twenty-four months
      value: K('correction_ceiling_mid')
    - when: otherwise
      value: K('correction_ceiling_standard')
    baseline:
      charge_ceiling: K('correction_ceiling_standard')
    evidence:
    - history
    cross_difficulty: null
  - id: charter_charge_rounding
    effect: method
    decides: charter_charge
    bindings:
    - months_on_book
    - charter_charge
    ladder:
    - when: the loan was funded at least seasoning_long whole months before the correction
      method: the figure that survives the ceiling is rounded down to the whole dollar
    - when: the loan was funded at least seasoning_mid but less than seasoning_long whole months before the correction
      method: the figure that survives the ceiling is rounded half-up to the whole dollar
    - when: otherwise
      method: the figure that survives the ceiling is rounded half-up to the cent
    baseline:
      charter_charge: RND(charge_after_ceiling, 2)
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: 'A late charge standing on an auto loan above the amount this charter fixes for it is put right by one
      correction entry booked against that charge for the difference between the amount standing for it and the
      amount this charter fixes, and the remainder of the charge stands. The amount standing for the charge is
      the amount of the late charge most recently assessed on the loan. The amount this charter fixes for a late
      charge is worked out from the scheduled installment in four steps, in this order: the acting base is settled
      first, the correction percentage is then applied to that base to give the charge before any ceiling, the
      ceiling is then applied to that figure, and the figure that survives the ceiling is rounded last. Under
      the standard method the acting base is the scheduled installment together with the charges standing unpaid
      on the loan, the correction percentage is correction_pct_standard percent, the ceiling is correction_ceiling_standard,
      and the figure that survives the ceiling is rounded half-up to the cent. The correction entry is never more
      than the amount standing, and where the amount standing is no more than the amount this charter fixes no
      correction entry is booked at all.'
    params:
    - correction_pct_standard
    - correction_ceiling_standard
  inputs:
    history:
    - table: auto_transactions
      aggregate: count
      field: auto_txn_id
      within_months: 12
      filters:
        event_type: auto_payment
        payment_type: scheduled
    - table: auto_transactions
      aggregate: count
      field: auto_txn_id
      within_months: 24
      filters:
        event_type: auto_fee
        fee_code: late_charge
    - table: auto_transactions
      aggregate: latest
      field: amount
      within_months: 24
      filters:
        event_type: auto_fee
        fee_code: late_charge
    - category: card
      table: card_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: card_purchase
    - category: checking
      table: checking_transactions
      aggregate: count
      field: amount
      within_months: 3
      filters:
        event_type: checking_deposit
        channel: ach_direct_deposit
    cross_category:
    - card
    - checking
- id: auto_ext_call_payment_amount
  base_policy_refs:
  - auto_evt_payment_allocation
  - auto_evt_payoff_and_lien
  overwrite:
  - base_policy: auto_evt_payment_allocation
    superseded_clause: interest owed at any moment is auto_msr_accrued_interest, computed on the principal balance
      from last_payment_date
    replaced_by: the interest is worked out on the unpaid principal at the rate recorded on the loan divided by
      the product's day count basis and multiplied by the days the clock runs, and the interest is rounded half-up
      to the cent
  trigger: state_due
  subject:
  - auto_payment
  computes: payment_amount
  target_tool: post_installment_payment_1d25a699
  params:
    card_spend_deep: 9000.0
    card_spend_mid: 3000.0
    installments_deep: 12
    installments_mid: 6
    card_utilisation_deep: 0.25
    card_utilisation_mid: 0.5
    deposits_mid: 2
    seasoning_long: 36
    seasoning_mid: 24
    charge_entries_few: 3
    charge_entries_some: 5
    reward_points_deep: 25000
    reward_points_mid: 5000
    card_purchases_deep: 6
    card_purchases_mid: 3
    charge_allowance_deep: 20.0
    charge_allowance_mid: 10.0
    charge_allowance_none: 0.0
  rule: A payment taken from the borrower during a call must cover the charges this charter asks that payment
    to clear, the interest owed on the loan for the days the clock runs, and the scheduled installment, added
    together and rounded half-up to the cent. Under the standard method the charges the payment must clear are
    all the charges standing unpaid on the loan, no charge allowance is set against them, the clock runs from
    the date of the last payment credited to the loan and a further day is added to that span, the interest is
    worked out on the unpaid principal at the rate recorded on the loan divided by the product's day count basis
    and multiplied by the days the clock runs, and the interest is rounded half-up to the cent. The charge allowance
    is taken off the charges the payment must clear before they are added to the interest and the installment,
    and the charges after the allowance are never less than nothing. The payment is then applied in the order
    this charter fixes, so the charges standing on the loan are cleared from it first, the interest accrued through
    the credit date next, and whatever remains goes to principal. The amount a payment taken during a call must
    cover is fixed only after every late charge standing on the loan carries the amount this charter fixes for
    it. The interest is worked out at the product's floor rate where the borrower's card purchases over the last
    twelve months total at least card_spend_deep and at least installments_deep scheduled installments have been
    credited to the loan in the last twelve months; at the rate recorded on the loan less the automatic-payment
    reduction the product publishes where those purchases total at least card_spend_mid and at least installments_mid
    scheduled installments have been credited in the last twelve months while either those purchases fall short
    of card_spend_deep or those installments fall short of installments_deep; and at the rate recorded on the
    loan for every other borrower. The clock runs from the date the installment then due falls on where the balance
    owed on the borrower's card is no more than card_utilisation_deep of its credit limit; it runs from the date
    the most recent charge was assessed on the loan where that balance is more than card_utilisation_deep but
    no more than card_utilisation_mid of its credit limit; and it runs from the date of the last payment credited
    to the loan where that balance is more than card_utilisation_mid of its credit limit. The last day of that
    span is dropped where both of these hold, that the borrower holds an active checking account whose posted
    balance is at least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring
    deposits have posted to that account in the last three months; the span is counted as it stands where exactly
    one of those two holds; and a further day is added to the span where neither of them holds. The interest is
    rounded down to the whole dollar where the loan was funded at least seasoning_long whole months before the
    payment; it is rounded half-up to the whole dollar where the loan was funded at least seasoning_mid but less
    than seasoning_long whole months before the payment; and it is rounded half-up to the cent where the loan
    was funded less than seasoning_mid whole months before the payment. The charges the payment must clear are
    the charges assessed on the loan in the current calendar month net of the corrections booked against them
    in that month where no more than charge_entries_few charges have been assessed on the loan in the last twelve
    months; they are the charges assessed in the last three calendar months net of the corrections booked against
    them in those months where more than charge_entries_few but no more than charge_entries_some charges have
    been assessed on the loan in the last twelve months; and they are all the charges standing unpaid on the loan
    where more than charge_entries_some charges have been assessed in that window. The charge allowance is charge_allowance_deep
    where the borrower's card carries at least reward_points_deep unredeemed reward points and at least card_purchases_deep
    card purchases have posted in the last three months; it is charge_allowance_mid where that card carries at
    least reward_points_mid unredeemed reward points and at least card_purchases_mid card purchases have posted
    in the last three months while either those points fall short of reward_points_deep or those purchases fall
    short of card_purchases_deep; and it is charge_allowance_none for every other borrower.
  prerequisite:
  - problem: auto_ext_fee_overcharge_correction
    kind: value_input
    gate: charges_to_clear
    form: state
    policy_source: The amount a payment taken during a call must cover is fixed only after every late charge standing
      on the loan carries the amount this charter fixes for it.
    condition: No late charge standing unpaid on the loan shows an amount greater than the amount this charter
      fixes for that charge.
    resolved_by: correct_loan_fee_ab5fa380
    effect: The charges the payment must clear fall by the amount of the correction entry booked against the overstated
      late charge, so charges_to_clear takes the corrected figure.
  cross_category:
  - category: card
    as: history
    reads:
    - card_transactions.amount
    - current_balance
    - credit_limit
    - rewards_balance
    note: The interest rate tier rests on the borrower's card purchase total, the clock tier on the card balance
      against its limit, and the allowance tier on the card's reward points and recent purchases.
  - category: checking
    as: branch
    reads:
    - ledger_balance
    - variant_name
    - checking_transactions.amount
    note: The endpoint convention tier rests on the borrower's checking balance against its tier's waiver balance
      and on the recurring deposits posted to it.
  compute:
  - charges_standing: F('fees_due')
  - installment_amount: F('monthly_payment')
  - principal_outstanding: F('principal_balance')
  - recorded_rate: F('interest_rate')
  - card_year_spend: XSUM('card','card_transactions','amount', within_months=12, date_field='posted_date', event_type='card_purchase')
  - scheduled_paid_12m: COUNT('auto_transactions', within_months=12, date_field='posted_date', event_type='auto_payment',
      payment_type='scheduled')
  - payment_rate: P('apr_floor') if (card_year_spend >= K('card_spend_deep') and scheduled_paid_12m >= K('installments_deep'))
      else (recorded_rate - P('autopay_discount_pct') if (card_year_spend >= K('card_spend_mid') and scheduled_paid_12m
      >= K('installments_mid') and (card_year_spend < K('card_spend_deep') or scheduled_paid_12m < K('installments_deep')))
      else recorded_rate)
  - card_balance_owed: CFIELD('card','current_balance', status='active')
  - card_credit_limit: CFIELD('card','credit_limit', status='active')
  - accrual_span: DAYS(F('next_payment_due_date'), NOW) if ((card_balance_owed or 0) <= (card_credit_limit or
      0) * K('card_utilisation_deep')) else (DAYS(LATEST('auto_transactions','posted_date', date_field='posted_date',
      event_type='auto_fee'), NOW) if ((card_balance_owed or 0) <= (card_credit_limit or 0) * K('card_utilisation_mid'))
      else DAYS(F('last_payment_date'), NOW))
  - checking_balance: CFIELD('checking','ledger_balance', status='active')
  - checking_waiver_balance: CPARAM('checking','waiver_min_daily_balance', status='active')
  - recurring_deposits_3m: XCOUNT('checking','checking_transactions', within_months=3, date_field='posted_date',
      event_type='checking_deposit', channel='ach_direct_deposit')
  - accrual_days: accrual_span - 1 if ((checking_balance or 0) >= (checking_waiver_balance or 0) and recurring_deposits_3m
      >= K('deposits_mid')) else (accrual_span if ((checking_balance or 0) >= (checking_waiver_balance or 0) or
      recurring_deposits_3m >= K('deposits_mid')) else accrual_span + 1)
  - interest_before_rounding: principal_outstanding * payment_rate / 100 / P('interest_day_count_basis') * accrual_days
  - months_on_book: MONTHS(F('funded_date'), NOW)
  - interest_owed: float(int(interest_before_rounding)) if months_on_book >= K('seasoning_long') else (float(int(interest_before_rounding
      + 0.5)) if months_on_book >= K('seasoning_mid') else RND(interest_before_rounding, 2))
  - charge_entries_12m: COUNT('auto_transactions', within_months=12, date_field='posted_date', event_type='auto_fee')
  - charges_to_clear: RND(SUM('auto_transactions','amount', within_months=1, date_field='posted_date', event_type='auto_fee')
      - SUM('auto_transactions','amount', within_months=1, date_field='posted_date', event_type='auto_fee_waiver'),
      2) if charge_entries_12m <= K('charge_entries_few') else (RND(SUM('auto_transactions','amount', within_months=3,
      date_field='posted_date', event_type='auto_fee') - SUM('auto_transactions','amount', within_months=3, date_field='posted_date',
      event_type='auto_fee_waiver'), 2) if charge_entries_12m <= K('charge_entries_some') else charges_standing)
  - card_reward_points: CFIELD('card','rewards_balance', status='active')
  - card_purchases_3m: XCOUNT('card','card_transactions', within_months=3, date_field='posted_date', event_type='card_purchase')
  - charge_allowance: K('charge_allowance_deep') if ((card_reward_points or 0) >= K('reward_points_deep') and
      card_purchases_3m >= K('card_purchases_deep')) else (K('charge_allowance_mid') if ((card_reward_points or
      0) >= K('reward_points_mid') and card_purchases_3m >= K('card_purchases_mid') and ((card_reward_points or
      0) < K('reward_points_deep') or card_purchases_3m < K('card_purchases_deep'))) else K('charge_allowance_none'))
  - charges_component: MX(0.0, RND(charges_to_clear - charge_allowance, 2))
  - result: RND(charges_component + interest_owed + installment_amount, 2)
  compute_basis:
    card_year_spend: where the borrower's card purchases over the last twelve months total at least card_spend_deep
    scheduled_paid_12m: at least installments_deep scheduled installments have been credited to the loan in the
      last twelve months
    payment_rate: The interest is worked out at the product's floor rate where the borrower's card purchases over
      the last twelve months total at least card_spend_deep and at least installments_deep scheduled installments
      have been credited to the loan in the last twelve months; at the rate recorded on the loan less the automatic-payment
      reduction the product publishes where those purchases total at least card_spend_mid and at least installments_mid
      scheduled installments have been credited in the last twelve months while either those purchases fall short
      of card_spend_deep or those installments fall short of installments_deep; and at the rate recorded on the
      loan for every other borrower.
    card_balance_owed: where the balance owed on the borrower's card is no more than card_utilisation_deep of
      its credit limit
    card_credit_limit: no more than card_utilisation_deep of its credit limit
    accrual_span: The clock runs from the date the installment then due falls on where the balance owed on the
      borrower's card is no more than card_utilisation_deep of its credit limit; it runs from the date the most
      recent charge was assessed on the loan where that balance is more than card_utilisation_deep but no more
      than card_utilisation_mid of its credit limit; and it runs from the date of the last payment credited to
      the loan where that balance is more than card_utilisation_mid of its credit limit.
    checking_balance: where the borrower holds an active checking account whose posted balance is at least the
      fee-waiver daily balance its tier publishes
    checking_waiver_balance: at least the fee-waiver daily balance its tier publishes
    recurring_deposits_3m: at least deposits_mid recurring deposits have posted to that account in the last three
      months
    accrual_days: The last day of that span is dropped where both of these hold, that the borrower holds an active
      checking account whose posted balance is at least the fee-waiver daily balance its tier publishes and that
      at least deposits_mid recurring deposits have posted to that account in the last three months; the span
      is counted as it stands where exactly one of those two holds; and a further day is added to the span where
      neither of them holds.
    interest_before_rounding: the interest is worked out on the unpaid principal at the rate recorded on the loan
      divided by the product's day count basis and multiplied by the days the clock runs
    months_on_book: where the loan was funded at least seasoning_long whole months before the payment
    interest_owed: The interest is rounded down to the whole dollar where the loan was funded at least seasoning_long
      whole months before the payment; it is rounded half-up to the whole dollar where the loan was funded at
      least seasoning_mid but less than seasoning_long whole months before the payment; and it is rounded half-up
      to the cent where the loan was funded less than seasoning_mid whole months before the payment.
    charge_entries_12m: where no more than charge_entries_few charges have been assessed on the loan in the last
      twelve months
    charges_to_clear: The charges the payment must clear are the charges assessed on the loan in the current calendar
      month net of the corrections booked against them in that month where no more than charge_entries_few charges
      have been assessed on the loan in the last twelve months; they are the charges assessed in the last three
      calendar months net of the corrections booked against them in those months where more than charge_entries_few
      but more than charge_entries_few but no more than charge_entries_some charges have been assessed on the
      loan in the last twelve months; and they are all the charges standing unpaid on the loan where more than
      charge_entries_some charges have been assessed in that window.
    card_reward_points: where the borrower's card carries at least reward_points_deep unredeemed reward points
    card_purchases_3m: at least card_purchases_deep card purchases have posted in the last three months
    charge_allowance: The charge allowance is charge_allowance_deep where the borrower's card carries at least
      reward_points_deep unredeemed reward points and at least card_purchases_deep card purchases have posted
      in the last three months; it is charge_allowance_mid where that card carries at least reward_points_mid
      unredeemed reward points and at least card_purchases_mid card purchases have posted in the last three months
      while either those points fall short of reward_points_deep or those purchases fall short of card_purchases_deep;
      and it is charge_allowance_none for every other borrower.
    charges_component: The charge allowance is taken off the charges the payment must clear before they are added
      to the interest and the installment, and the charges after the allowance are never less than nothing.
    result: A payment taken from the borrower during a call must cover the charges this charter asks that payment
      to clear, the interest owed on the loan for the days the clock runs, and the scheduled installment, added
      together and rounded half-up to the cent.
  factors:
  - id: payment_interest_rate
    effect: parameter
    decides: payment_rate
    bindings:
    - card_year_spend
    - scheduled_paid_12m
    - payment_rate
    ladder:
    - when: the borrower's card purchases over the last twelve months total at least card_spend_deep and at least
        installments_deep scheduled installments have been credited to the loan in the last twelve months
      value: P('apr_floor')
    - when: the borrower's card purchases over the last twelve months total at least card_spend_mid and at least
        installments_mid scheduled installments have been credited in the last twelve months while either those
        purchases fall short of card_spend_deep or those installments fall short of installments_deep
      value: recorded_rate - P('autopay_discount_pct')
    - when: otherwise
      value: recorded_rate
    baseline:
      payment_rate: recorded_rate
    evidence:
    - history
    - cross_category
    cross_difficulty: card
  - id: accrual_clock_anchor
    effect: method
    decides: accrual_span
    bindings:
    - card_balance_owed
    - card_credit_limit
    - accrual_span
    ladder:
    - when: the balance owed on the borrower's card is no more than card_utilisation_deep of its credit limit
      method: the clock runs from the date the installment then due falls on
    - when: the balance owed on the borrower's card is more than card_utilisation_deep but no more than card_utilisation_mid
        of its credit limit
      method: the clock runs from the date the most recent charge was assessed on the loan
    - when: otherwise
      method: the clock runs from the date of the last payment credited to the loan
    baseline:
      accrual_span: DAYS(F('last_payment_date'), NOW)
    evidence:
    - cross_category
    - date
    cross_difficulty: card
  - id: accrual_endpoint_convention
    effect: method
    decides: accrual_days
    bindings:
    - checking_balance
    - checking_waiver_balance
    - recurring_deposits_3m
    - accrual_days
    ladder:
    - when: both of these hold, that the borrower holds an active checking account whose posted balance is at
        least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring deposits
        have posted to that account in the last three months
      method: the last day of the span is dropped
    - when: exactly one of those two holds
      method: the span is counted as it stands
    - when: otherwise
      method: a further day is added to the span
    baseline:
      accrual_days: accrual_span + 1
    evidence:
    - cross_category
    - history
    cross_difficulty: checking
  - id: payment_interest_rounding
    effect: method
    decides: interest_owed
    bindings:
    - months_on_book
    - interest_owed
    ladder:
    - when: the loan was funded at least seasoning_long whole months before the payment
      method: the interest is rounded down to the whole dollar
    - when: the loan was funded at least seasoning_mid but less than seasoning_long whole months before the payment
      method: the interest is rounded half-up to the whole dollar
    - when: otherwise
      method: the interest is rounded half-up to the cent
    baseline:
      interest_owed: RND(interest_before_rounding, 2)
    evidence:
    - date
    cross_difficulty: null
  - id: charges_cleared_window
    effect: method
    decides: charges_to_clear
    bindings:
    - charge_entries_12m
    - charges_to_clear
    ladder:
    - when: no more than charge_entries_few charges have been assessed on the loan in the last twelve months
      method: the charges the payment must clear are the charges assessed in the current calendar month net of
        the corrections booked against them in that month
    - when: more than charge_entries_few but no more than charge_entries_some charges have been assessed on the
        loan in the last twelve months
      method: the charges the payment must clear are the charges assessed in the last three calendar months net
        of the corrections booked against them in those months
    - when: otherwise
      method: the charges the payment must clear are all the charges standing unpaid on the loan
    baseline:
      charges_to_clear: charges_standing
    evidence:
    - history
    cross_difficulty: null
  - id: payment_charge_allowance
    effect: parameter
    decides: charge_allowance
    bindings:
    - card_reward_points
    - card_purchases_3m
    - charge_allowance
    ladder:
    - when: the borrower's card carries at least reward_points_deep unredeemed reward points and at least card_purchases_deep
        card purchases have posted in the last three months
      value: K('charge_allowance_deep')
    - when: the borrower's card carries at least reward_points_mid unredeemed reward points and at least card_purchases_mid
        card purchases have posted in the last three months while either those points fall short of reward_points_deep
        or those purchases fall short of card_purchases_deep
      value: K('charge_allowance_mid')
    - when: otherwise
      value: K('charge_allowance_none')
    baseline:
      charge_allowance: K('charge_allowance_none')
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  baseline:
    rule: A payment taken from the borrower during a call must cover the charges this charter asks that payment
      to clear, the interest owed on the loan for the days the clock runs, and the scheduled installment, added
      together and rounded half-up to the cent. Under the standard method the charges the payment must clear are
      all the charges standing unpaid on the loan, no charge allowance is set against them, the clock runs from
      the date of the last payment credited to the loan and a further day is added to that span, the interest
      is worked out on the unpaid principal at the rate recorded on the loan divided by the product's day count
      basis and multiplied by the days the clock runs, and the interest is rounded half-up to the cent. The charge
      allowance is taken off the charges the payment must clear before they are added to the interest and the
      installment, and the charges after the allowance are never less than nothing. The payment is then applied
      in the order this charter fixes, so the charges standing on the loan are cleared from it first, the interest
      accrued through the credit date next, and whatever remains goes to principal.
    params:
    - charge_allowance_none
  inputs:
    history:
    - table: auto_transactions
      aggregate: count
      field: auto_txn_id
      within_months: 12
      filters:
        event_type: auto_payment
        payment_type: scheduled
    - table: auto_transactions
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: auto_fee
    - table: auto_transactions
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: auto_fee_waiver
    - table: auto_transactions
      aggregate: latest
      field: posted_date
      within_months: 12
      filters:
        event_type: auto_fee
    - category: card
      table: card_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: card_purchase
    - category: card
      table: card_transactions
      aggregate: count
      field: amount
      within_months: 3
      filters:
        event_type: card_purchase
    - category: checking
      table: checking_transactions
      aggregate: count
      field: amount
      within_months: 3
      filters:
        event_type: checking_deposit
        channel: ach_direct_deposit
    cross_category:
    - card
    - checking
- id: auto_ext_autopay_rate_restatement
  base_policy_refs:
  - auto_evt_autopay
  - auto_agg_relationship_discount
  overwrite:
  - base_policy: auto_evt_autopay
    superseded_clause: Enrolling adds the autopay discount to the APR, within the cap and floor of auto_agg_relationship_discount,
      from the next installment due at least autopay_lead_days calendar days after enrollment; cancelling removes
      it on the same schedule when autopay_discount_removed_on_cancel is true.
    replaced_by: The rate restated on an auto loan when the standing draft instruction changes is written to the
      loan on the day the instruction changes and interest accrues at it from that day.
  - base_policy: auto_agg_relationship_discount
    superseded_clause: When autopay is cancelled and autopay_discount_removed_on_cancel is true, the APR rises
      by the autopay discount actually applied, and re-enrolling later restores it
    replaced_by: The rate restated on an auto loan when the standing draft instruction changes is the rate recorded
      on the loan raised by the reduction restored, raised again by the arrears adjustment and by the manual-payment
      step, then reduced by the standing deposit allowance, and rounded last; the restated rate never falls below
      the floor rate the product publishes.
  trigger: on_request
  subject:
  - auto_set_autopay
  computes: restated_apr
  target_tool: set_loan_autopay_8313b066
  params:
    card_spend_deep: 9000.0
    card_spend_mid: 3000.0
    installments_deep: 24
    installments_mid: 15
    relief_deep: 0.1
    relief_mid: 0.15
    reward_points_deep: 25000
    reward_points_mid: 5000
    card_purchases_deep: 6
    card_purchases_mid: 3
    manual_step_low: 0.0
    manual_step_mid: 0.05
    manual_step_standard: 0.1
    arrears_step: 0.05
    arrears_days_step: 7
    arrears_days_mid: 30
    arrears_full: 0.5
    deposit_allowance_pct_deep: 1.2
    deposit_allowance_pct_mid: 0.6
    deposit_allowance_none: 0.0
    deposits_mid: 2
    seasoning_long: 36
    seasoning_mid: 24
  rule: The rate restated on an auto loan when the standing draft instruction changes is the rate recorded on
    the loan raised by the reduction restored, raised again by the arrears adjustment and by the manual-payment
    step, then reduced by the standing deposit allowance, and rounded last; the restated rate never falls below
    the floor rate the product publishes. The rate restated on an auto loan when the standing draft instruction
    changes is written to the loan on the day the instruction changes and interest accrues at it from that day.
    Under the standard method the reduction restored is the automatic-payment reduction the product publishes,
    the arrears adjustment is the full arrears_full points, the manual-payment step is manual_step_standard points,
    no standing deposit allowance is set against the raised rate, and the restated rate is rounded half-up to
    the cent. The rate restated on the loan is fixed only after every installment already due stands satisfied
    on the loan's records. The reduction restored is relief_deep points where the borrower's card purchases over
    the last twelve months total at least card_spend_deep and at least installments_deep scheduled installments
    have been credited to the loan in the last twenty-four months; it is relief_mid points where those purchases
    total at least card_spend_mid and at least installments_mid scheduled installments have been credited to the
    loan in the last twenty-four months while either those purchases fall short of card_spend_deep or those installments
    fall short of installments_deep; and it is the automatic-payment reduction the product publishes for every
    other borrower. The manual-payment step is manual_step_low points where the borrower's card carries at least
    reward_points_deep unredeemed reward points and at least card_purchases_deep card purchases have posted in
    the last three months; it is manual_step_mid points where that card carries at least reward_points_mid unredeemed
    reward points and at least card_purchases_mid card purchases have posted in the last three months while either
    those points fall short of reward_points_deep or those purchases fall short of card_purchases_deep; and it
    is manual_step_standard points for every other borrower. No arrears adjustment is made where the installment
    then due has not yet passed its date; the adjustment is arrears_step points for each whole arrears_days_step
    days that have passed since that date, any part step being dropped, where that date has passed and no more
    than arrears_days_mid days have passed since it; and it is the full arrears_full points where more than arrears_days_mid
    days have passed since that date. The standing deposit allowance is deposit_allowance_pct_deep percent of
    the raised rate where both of these hold, that the borrower holds an active checking account whose posted
    balance is at least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring
    deposits have posted to that account in the last three months; it is deposit_allowance_pct_mid percent of
    the raised rate where exactly one of those two holds; and it is deposit_allowance_none where neither of them
    holds. The restated rate is rounded down to the cent where the loan was funded at least seasoning_long whole
    months before the restatement; it is rounded up to the cent where the loan was funded at least seasoning_mid
    but less than seasoning_long whole months before the restatement; and it is rounded half-up to the cent where
    the loan was funded less than seasoning_mid whole months before the restatement.
  prerequisite:
  - problem: auto_ext_call_payment_amount
    kind: value_input
    gate: arrears_adjustment
    form: state
    policy_source: The rate restated on the loan is fixed only after every installment already due stands satisfied
      on the loan's records.
    condition: The loan's records show no installment whose due date has passed still unsatisfied.
    resolved_by: post_installment_payment_1d25a699
    effect: The arrears adjustment falls to no adjustment at all once the installment then due is satisfied and
      the loan's next installment date moves ahead of the day of the restatement.
  cross_category:
  - category: card
    as: history
    reads:
    - card_transactions.amount
    - rewards_balance
    note: The reduction-restored tier rests on the borrower's card purchase total and the manual-payment step
      tier on the card's reward points and recent purchases.
  - category: checking
    as: branch
    reads:
    - ledger_balance
    - variant_name
    - checking_transactions.amount
    note: The standing deposit allowance tier rests on the borrower's checking balance against its tier's waiver
      balance and on the recurring deposits posted to it.
  compute:
  - recorded_rate: F('interest_rate')
  - card_year_spend: XSUM('card','card_transactions','amount', within_months=12, date_field='posted_date', event_type='card_purchase')
  - scheduled_paid_24m: COUNT('auto_transactions', within_months=24, date_field='posted_date', event_type='auto_payment',
      payment_type='scheduled')
  - restored_reduction: K('relief_deep') if (card_year_spend >= K('card_spend_deep') and scheduled_paid_24m >=
      K('installments_deep')) else (K('relief_mid') if (card_year_spend >= K('card_spend_mid') and scheduled_paid_24m
      >= K('installments_mid') and (card_year_spend < K('card_spend_deep') or scheduled_paid_24m < K('installments_deep')))
      else P('autopay_discount_pct'))
  - card_reward_points: CFIELD('card','rewards_balance', status='active')
  - card_purchases_3m: XCOUNT('card','card_transactions', within_months=3, date_field='posted_date', event_type='card_purchase')
  - manual_payment_step: K('manual_step_low') if ((card_reward_points or 0) >= K('reward_points_deep') and card_purchases_3m
      >= K('card_purchases_deep')) else (K('manual_step_mid') if ((card_reward_points or 0) >= K('reward_points_mid')
      and card_purchases_3m >= K('card_purchases_mid') and ((card_reward_points or 0) < K('reward_points_deep')
      or card_purchases_3m < K('card_purchases_deep'))) else K('manual_step_standard'))
  - arrears_span: DAYS(F('next_payment_due_date'), NOW)
  - arrears_adjustment: 0.0 if arrears_span <= 0 else (float(int(arrears_span / K('arrears_days_step'))) * K('arrears_step')
      if arrears_span <= K('arrears_days_mid') else K('arrears_full'))
  - raised_rate: recorded_rate + restored_reduction + arrears_adjustment + manual_payment_step
  - checking_balance: CFIELD('checking','ledger_balance', status='active')
  - checking_waiver_balance: CPARAM('checking','waiver_min_daily_balance', status='active')
  - recurring_deposits_3m: XCOUNT('checking','checking_transactions', within_months=3, date_field='posted_date',
      event_type='checking_deposit', channel='ach_direct_deposit')
  - deposit_allowance: raised_rate * K('deposit_allowance_pct_deep') / 100 if ((checking_balance or 0) >= (checking_waiver_balance
      or 0) and recurring_deposits_3m >= K('deposits_mid')) else (raised_rate * K('deposit_allowance_pct_mid')
      / 100 if ((checking_balance or 0) >= (checking_waiver_balance or 0) or recurring_deposits_3m >= K('deposits_mid'))
      else K('deposit_allowance_none'))
  - rate_after_allowance: MX(P('apr_floor'), raised_rate - deposit_allowance)
  - months_on_book: MONTHS(F('funded_date'), NOW)
  - rounded_rate: float(int(rate_after_allowance * 100)) / 100 if months_on_book >= K('seasoning_long') else (float(int(rate_after_allowance
      * 100 + 0.999999)) / 100 if months_on_book >= K('seasoning_mid') else RND(rate_after_allowance, 2))
  - result: rounded_rate
  compute_basis:
    card_year_spend: where the borrower's card purchases over the last twelve months total at least card_spend_deep
    scheduled_paid_24m: at least installments_deep scheduled installments have been credited to the loan in the
      last twenty-four months
    restored_reduction: The reduction restored is relief_deep points where the borrower's card purchases over
      the last twelve months total at least card_spend_deep and at least installments_deep scheduled installments
      have been credited to the loan in the last twenty-four months; it is relief_mid points where those purchases
      total at least card_spend_mid and at least installments_mid scheduled installments have been credited to
      the loan in the last twenty-four months while either those purchases fall short of card_spend_deep or those
      installments fall short of installments_deep; and it is the automatic-payment reduction the product publishes
      for every other borrower.
    card_reward_points: where the borrower's card carries at least reward_points_deep unredeemed reward points
    card_purchases_3m: at least card_purchases_deep card purchases have posted in the last three months
    manual_payment_step: The manual-payment step is manual_step_low points where the borrower's card carries at
      least reward_points_deep unredeemed reward points and at least card_purchases_deep card purchases have posted
      in the last three months; it is manual_step_mid points where that card carries at least reward_points_mid
      unredeemed reward points and at least card_purchases_mid card purchases have posted in the last three months
      while either those points fall short of reward_points_deep or those purchases fall short of card_purchases_deep;
      and it is manual_step_standard points for every other borrower.
    arrears_span: for each whole arrears_days_step days that have passed since that date
    arrears_adjustment: No arrears adjustment is made where the installment then due has not yet passed its date;
      the adjustment is arrears_step points for each whole arrears_days_step days that have passed since that
      date, any part step being dropped, where that date has passed and no more than arrears_days_mid days have
      passed since it; and it is the full arrears_full points where more than arrears_days_mid days have passed
      since that date.
    checking_balance: where the borrower holds an active checking account whose posted balance is at least the
      fee-waiver daily balance its tier publishes
    checking_waiver_balance: at least the fee-waiver daily balance its tier publishes
    recurring_deposits_3m: at least deposits_mid recurring deposits have posted to that account in the last three
      months
    deposit_allowance: The standing deposit allowance is deposit_allowance_pct_deep percent of the raised rate
      where both of these hold, that the borrower holds an active checking account whose posted balance is at
      least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring deposits
      have posted to that account in the last three months; it is deposit_allowance_pct_mid percent of the raised
      rate where exactly one of those two holds; and it is deposit_allowance_none where neither of them holds.
    rate_after_allowance: the restated rate never falls below the floor rate the product publishes
    months_on_book: where the loan was funded at least seasoning_long whole months before the restatement
    rounded_rate: The restated rate is rounded down to the cent where the loan was funded at least seasoning_long
      whole months before the restatement; it is rounded up to the cent where the loan was funded at least seasoning_mid
      but less than seasoning_long whole months before the restatement; and it is rounded half-up to the cent
      where the loan was funded less than seasoning_mid whole months before the restatement.
  factors:
  - id: restored_draft_reduction
    effect: parameter
    decides: restored_reduction
    bindings:
    - card_year_spend
    - scheduled_paid_24m
    - restored_reduction
    ladder:
    - when: the borrower's card purchases over the last twelve months total at least card_spend_deep and at least
        installments_deep scheduled installments have been credited to the loan in the last twenty-four months
      value: K('relief_deep')
    - when: the borrower's card purchases over the last twelve months total at least card_spend_mid and at least
        installments_mid scheduled installments have been credited to the loan in the last twenty-four months
        while either those purchases fall short of card_spend_deep or those installments fall short of installments_deep
      value: K('relief_mid')
    - when: otherwise
      value: P('autopay_discount_pct')
    baseline:
      restored_reduction: P('autopay_discount_pct')
    evidence:
    - history
    - cross_category
    cross_difficulty: card
  - id: manual_payment_step_value
    effect: parameter
    decides: manual_payment_step
    bindings:
    - card_reward_points
    - card_purchases_3m
    - manual_payment_step
    ladder:
    - when: the borrower's card carries at least reward_points_deep unredeemed reward points and at least card_purchases_deep
        card purchases have posted in the last three months
      value: K('manual_step_low')
    - when: the borrower's card carries at least reward_points_mid unredeemed reward points and at least card_purchases_mid
        card purchases have posted in the last three months while either those points fall short of reward_points_deep
        or those purchases fall short of card_purchases_deep
      value: K('manual_step_mid')
    - when: otherwise
      value: K('manual_step_standard')
    baseline:
      manual_payment_step: K('manual_step_standard')
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: arrears_adjustment_method
    effect: method
    decides: arrears_adjustment
    bindings:
    - arrears_span
    - arrears_adjustment
    ladder:
    - when: the installment then due has not yet passed its date
      method: no arrears adjustment is made
    - when: the date the installment then due falls on has passed and no more than arrears_days_mid days have
        passed since it
      method: the adjustment is arrears_step points for each whole arrears_days_step days that have passed since
        that date, any part step being dropped
    - when: otherwise
      method: the adjustment is the full arrears_full points
    baseline:
      arrears_adjustment: K('arrears_full')
    evidence:
    - date
    cross_difficulty: null
  - id: standing_deposit_allowance
    effect: parameter
    decides: deposit_allowance
    bindings:
    - checking_balance
    - checking_waiver_balance
    - recurring_deposits_3m
    - deposit_allowance
    ladder:
    - when: both of these hold, that the borrower holds an active checking account whose posted balance is at
        least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring deposits
        have posted to that account in the last three months
      value: deposit_allowance_pct_deep percent of the raised rate
    - when: exactly one of those two holds
      value: deposit_allowance_pct_mid percent of the raised rate
    - when: otherwise
      value: K('deposit_allowance_none')
    baseline:
      deposit_allowance: K('deposit_allowance_none')
    evidence:
    - cross_category
    - history
    cross_difficulty: checking
  - id: restated_rate_rounding
    effect: method
    decides: rounded_rate
    bindings:
    - months_on_book
    - rounded_rate
    ladder:
    - when: the loan was funded at least seasoning_long whole months before the restatement
      method: the restated rate is rounded down to the cent
    - when: the loan was funded at least seasoning_mid but less than seasoning_long whole months before the restatement
      method: the restated rate is rounded up to the cent
    - when: otherwise
      method: the restated rate is rounded half-up to the cent
    baseline:
      rounded_rate: RND(rate_after_allowance, 2)
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The rate restated on an auto loan when the standing draft instruction changes is the rate recorded on
      the loan raised by the reduction restored, raised again by the arrears adjustment and by the manual-payment
      step, then reduced by the standing deposit allowance, and rounded last; the restated rate never falls below
      the floor rate the product publishes. The rate restated on an auto loan when the standing draft instruction
      changes is written to the loan on the day the instruction changes and interest accrues at it from that day.
      Under the standard method the reduction restored is the automatic-payment reduction the product publishes,
      the arrears adjustment is the full arrears_full points, the manual-payment step is manual_step_standard
      points, no standing deposit allowance is set against the raised rate, and the restated rate is rounded half-up
      to the cent.
    params:
    - arrears_full
    - manual_step_standard
    - deposit_allowance_none
  inputs:
    history:
    - table: auto_transactions
      aggregate: count
      field: auto_txn_id
      within_months: 24
      filters:
        event_type: auto_payment
        payment_type: scheduled
    - category: card
      table: card_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: card_purchase
    - category: card
      table: card_transactions
      aggregate: count
      field: amount
      within_months: 3
      filters:
        event_type: card_purchase
    - category: checking
      table: checking_transactions
      aggregate: count
      field: amount
      within_months: 3
      filters:
        event_type: checking_deposit
        channel: ach_direct_deposit
    cross_category:
    - card
    - checking
- id: auto_ext_due_day_realignment
  base_policy_refs:
  - auto_due_date_change
  overwrite: []
  trigger: on_request
  subject:
  - auto_change_due_date
  computes: realigned_due_day
  target_tool: change_payment_due_day_9dcc583e
  params:
    card_spend_deep: 9000.0
    card_spend_mid: 3000.0
    card_purchases_deep: 12
    card_purchases_mid: 4
    shift_deep: 8
    shift_mid: 5
    shift_standard: 3
    seasoning_long: 36
    seasoning_mid: 24
    per_n_installments: 6
    deposits_mid: 2
    deposit_step_deep: 2.0
    deposit_step_mid: 1.5
    deposit_step_standard: 1.0
    checking_seasoning_long: 120
    checking_seasoning_mid: 48
    per_deposit_amount: 2000.0
  rule: The realigned day an auto loan installment falls due on is the day the loan's current due day reaches
    once the realignment shift is added to it, any part day being dropped. The realignment shift is the base shift,
    the record credit and the deposit credit added together, and it is never more than the number of days the
    product publishes as its largest move of the due day. Under the standard method the base shift is shift_standard
    days, the scheduled installments counted for the record credit are all those credited over the life of the
    loan, the record credit is one day for each whole per_n_installments of them with any part day dropped, the
    deposit measure is the most recent recurring deposit posted to the borrower's checking account, and the deposit
    credit is one day for each whole per_deposit_amount of that measure, any part day being dropped, multiplied
    by a deposit step of deposit_step_standard. A due day is moved only once no standing instruction to draft
    the installment from a deposit account remains on the loan. The realigned day is settled only after the loan
    stands current with no installment past due on its records. The base shift is shift_deep days where the borrower's
    card purchases over the last twelve months total at least card_spend_deep and at least card_purchases_deep
    card purchases have posted in the last three months; it is shift_mid days where those purchases total at least
    card_spend_mid and at least card_purchases_mid card purchases have posted in the last three months while either
    those purchases fall short of card_spend_deep or that count falls short of card_purchases_deep; and it is
    shift_standard days for every other borrower. The scheduled installments counted for the record credit are
    those credited in the last twelve months where the loan was funded less than seasoning_mid whole months before
    the realignment; they are those credited in the last twenty-four months where the loan was funded at least
    seasoning_mid but less than seasoning_long whole months before the realignment; and they are all those credited
    over the life of the loan where the loan was funded at least seasoning_long whole months before the realignment.
    The deposit step is deposit_step_deep where both of these hold, that the borrower holds an active checking
    account whose posted balance is at least the fee-waiver daily balance its tier publishes and that at least
    deposits_mid recurring deposits have posted to that account in the last three months; it is deposit_step_mid
    where exactly one of those two holds; and it is deposit_step_standard where neither of them holds. The deposit
    measure is the largest recurring deposit ever posted to that checking account where the account was opened
    at least checking_seasoning_long whole months before the realignment; it is the total of the recurring deposits
    posted to it in the last three months where the account was opened at least checking_seasoning_mid but less
    than checking_seasoning_long whole months before the realignment; and it is the most recent recurring deposit
    posted to it where the account was opened less than checking_seasoning_mid whole months before the realignment.
  prerequisite:
  - problem: auto_ext_autopay_rate_restatement
    kind: state_gate
    gate: auto_loans.autopay_enrolled
    form: state
    policy_source: A due day is moved only once no standing instruction to draft the installment from a deposit
      account remains on the loan.
    condition: The loan record shows no standing instruction to draft the installment from a deposit account and
      no account recorded as the one it is drafted from.
    resolved_by: set_loan_autopay_8313b066
    effect: The loan record stops carrying a standing drafting instruction, so the gate on moving the due day
      is satisfied.
  - problem: auto_ext_call_payment_amount
    kind: value_input
    gate: record_span
    form: state
    policy_source: The realigned day is settled only after the loan stands current with no installment past due
      on its records.
    condition: The loan's records show every installment whose due date has passed satisfied and the past-due
      day count at zero.
    resolved_by: post_installment_payment_1d25a699
    effect: The scheduled installments counted for the record credit rise by the installment the payment satisfies,
      so record_span takes the higher count.
  cross_category:
  - category: card
    as: history
    reads:
    - card_transactions.amount
    note: The base shift tier rests on the borrower's card purchase total over the last twelve months and the
      count of card purchases in the last three.
  - category: checking
    as: branch
    reads:
    - ledger_balance
    - variant_name
    - opened_date
    - checking_transactions.amount
    note: The deposit step tier rests on the borrower's checking balance against its tier's waiver balance, and
      the deposit measure tier on how long that account has been open.
  compute:
  - current_due_day: F('payment_due_day')
  - card_year_spend: XSUM('card','card_transactions','amount', within_months=12, date_field='posted_date', event_type='card_purchase')
  - card_purchases_3m: XCOUNT('card','card_transactions', within_months=3, date_field='posted_date', event_type='card_purchase')
  - base_shift: K('shift_deep') if (card_year_spend >= K('card_spend_deep') and card_purchases_3m >= K('card_purchases_deep'))
      else (K('shift_mid') if (card_year_spend >= K('card_spend_mid') and card_purchases_3m >= K('card_purchases_mid')
      and (card_year_spend < K('card_spend_deep') or card_purchases_3m < K('card_purchases_deep'))) else K('shift_standard'))
  - months_on_book: MONTHS(F('funded_date'), NOW)
  - record_span: COUNT('auto_transactions', within_months=12, date_field='posted_date', event_type='auto_payment',
      payment_type='scheduled') if months_on_book < K('seasoning_mid') else (COUNT('auto_transactions', within_months=24,
      date_field='posted_date', event_type='auto_payment', payment_type='scheduled') if months_on_book < K('seasoning_long')
      else COUNT('auto_transactions', date_field='posted_date', event_type='auto_payment', payment_type='scheduled'))
  - record_credit: float(int(record_span / K('per_n_installments')))
  - checking_balance: CFIELD('checking','ledger_balance', status='active')
  - checking_waiver_balance: CPARAM('checking','waiver_min_daily_balance', status='active')
  - recurring_deposits_3m: XCOUNT('checking','checking_transactions', within_months=3, date_field='posted_date',
      event_type='checking_deposit', channel='ach_direct_deposit')
  - deposit_step: K('deposit_step_deep') if ((checking_balance or 0) >= (checking_waiver_balance or 0) and recurring_deposits_3m
      >= K('deposits_mid')) else (K('deposit_step_mid') if ((checking_balance or 0) >= (checking_waiver_balance
      or 0) or recurring_deposits_3m >= K('deposits_mid')) else K('deposit_step_standard'))
  - checking_months: MONTHS(CFIELD('checking','opened_date', status='active'), NOW)
  - deposit_measure: XMAX('checking','checking_transactions','amount', event_type='checking_deposit', channel='ach_direct_deposit')
      if checking_months >= K('checking_seasoning_long') else (XSUM('checking','checking_transactions','amount',
      within_months=3, date_field='posted_date', event_type='checking_deposit', channel='ach_direct_deposit')
      if checking_months >= K('checking_seasoning_mid') else XLATEST('checking','checking_transactions','amount',
      date_field='posted_date', event_type='checking_deposit', channel='ach_direct_deposit'))
  - deposit_credit: float(int(deposit_measure / K('per_deposit_amount'))) * deposit_step
  - realignment_shift: MN(base_shift + record_credit + deposit_credit, P('due_date_change_max_shift_days'))
  - result: float(int(current_due_day + realignment_shift))
  compute_basis:
    card_year_spend: where the borrower's card purchases over the last twelve months total at least card_spend_deep
    card_purchases_3m: at least card_purchases_deep card purchases have posted in the last three months
    base_shift: The base shift is shift_deep days where the borrower's card purchases over the last twelve months
      total at least card_spend_deep and at least card_purchases_deep card purchases have posted in the last three
      months; it is shift_mid days where those purchases total at least card_spend_mid and at least card_purchases_mid
      card purchases have posted in the last three months while either those purchases fall short of card_spend_deep
      or that count falls short of card_purchases_deep; and it is shift_standard days for every other borrower.
    months_on_book: where the loan was funded less than seasoning_mid whole months before the realignment
    record_span: The scheduled installments counted for the record credit are those credited in the last twelve
      months where the loan was funded less than seasoning_mid whole months before the realignment; they are those
      credited in the last twenty-four months where the loan was funded at least seasoning_mid but less than seasoning_long
      whole months before the realignment; and they are all those credited over the life of the loan where the
      loan was funded at least seasoning_long whole months before the realignment.
    record_credit: the record credit is one day for each whole per_n_installments of them with any part day dropped
    checking_balance: where the borrower holds an active checking account whose posted balance is at least the
      fee-waiver daily balance its tier publishes
    checking_waiver_balance: at least the fee-waiver daily balance its tier publishes
    recurring_deposits_3m: at least deposits_mid recurring deposits have posted to that account in the last three
      months
    deposit_step: The deposit step is deposit_step_deep where both of these hold, that the borrower holds an active
      checking account whose posted balance is at least the fee-waiver daily balance its tier publishes and that
      at least deposits_mid recurring deposits have posted to that account in the last three months; it is deposit_step_mid
      where exactly one of those two holds; and it is deposit_step_standard where neither of them holds.
    checking_months: where the account was opened at least checking_seasoning_long whole months before the realignment
    deposit_measure: The deposit measure is the largest recurring deposit ever posted to that checking account
      where the account was opened at least checking_seasoning_long whole months before the realignment; it is
      the total of the recurring deposits posted to it in the last three months where the account was opened at
      least checking_seasoning_mid but less than checking_seasoning_long whole months before the realignment;
      and it is the most recent recurring deposit posted to it where the account was opened less than checking_seasoning_mid
      whole months before the realignment.
    deposit_credit: the deposit credit is one day for each whole per_deposit_amount of that measure, any part
      day being dropped, multiplied by a deposit step
    realignment_shift: The realignment shift is the base shift, the record credit and the deposit credit added
      together, and it is never more than the number of days the product publishes as its largest move of the
      due day.
    result: The realigned day an auto loan installment falls due on is the day the loan's current due day reaches
      once the realignment shift is added to it, any part day being dropped.
  factors:
  - id: realignment_base_shift
    effect: parameter
    decides: base_shift
    bindings:
    - card_year_spend
    - card_purchases_3m
    - base_shift
    ladder:
    - when: the borrower's card purchases over the last twelve months total at least card_spend_deep and at least
        card_purchases_deep card purchases have posted in the last three months
      value: K('shift_deep')
    - when: the borrower's card purchases over the last twelve months total at least card_spend_mid and at least
        card_purchases_mid card purchases have posted in the last three months while either those purchases fall
        short of card_spend_deep or that count falls short of card_purchases_deep
      value: K('shift_mid')
    - when: otherwise
      value: K('shift_standard')
    baseline:
      base_shift: K('shift_standard')
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: record_credit_window
    effect: method
    decides: record_span
    bindings:
    - months_on_book
    - record_span
    ladder:
    - when: the loan was funded less than seasoning_mid whole months before the realignment
      method: the scheduled installments counted are those credited in the last twelve months
    - when: the loan was funded at least seasoning_mid but less than seasoning_long whole months before the realignment
      method: the scheduled installments counted are those credited in the last twenty-four months
    - when: otherwise
      method: the scheduled installments counted are all those credited over the life of the loan, which is how
        a loan funded at least seasoning_long whole months before the realignment is counted
    baseline:
      record_span: COUNT('auto_transactions', date_field='posted_date', event_type='auto_payment', payment_type='scheduled')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: deposit_credit_step
    effect: parameter
    decides: deposit_step
    bindings:
    - checking_balance
    - checking_waiver_balance
    - recurring_deposits_3m
    - deposit_step
    ladder:
    - when: both of these hold, that the borrower holds an active checking account whose posted balance is at
        least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring deposits
        have posted to that account in the last three months
      value: K('deposit_step_deep')
    - when: exactly one of those two holds
      value: K('deposit_step_mid')
    - when: otherwise
      value: K('deposit_step_standard')
    baseline:
      deposit_step: K('deposit_step_standard')
    evidence:
    - cross_category
    - history
    cross_difficulty: checking
  - id: deposit_measure_aggregation
    effect: method
    decides: deposit_measure
    bindings:
    - checking_months
    - deposit_measure
    ladder:
    - when: the checking account was opened at least checking_seasoning_long whole months before the realignment
      method: the deposit measure is the largest recurring deposit ever posted to that account
    - when: the checking account was opened at least checking_seasoning_mid but less than checking_seasoning_long
        whole months before the realignment
      method: the deposit measure is the total of the recurring deposits posted to it in the last three months
    - when: otherwise
      method: the deposit measure is the most recent recurring deposit posted to it
    baseline:
      deposit_measure: XLATEST('checking','checking_transactions','amount', date_field='posted_date', event_type='checking_deposit',
        channel='ach_direct_deposit')
    evidence:
    - cross_category
    - date
    cross_difficulty: checking
  baseline:
    rule: The realigned day an auto loan installment falls due on is the day the loan's current due day reaches
      once the realignment shift is added to it, any part day being dropped. The realignment shift is the base
      shift, the record credit and the deposit credit added together, and it is never more than the number of
      days the product publishes as its largest move of the due day. Under the standard method the base shift
      is shift_standard days, the scheduled installments counted for the record credit are all those credited
      over the life of the loan, the record credit is one day for each whole per_n_installments of them with any
      part day dropped, the deposit measure is the most recent recurring deposit posted to the borrower's checking
      account, and the deposit credit is one day for each whole per_deposit_amount of that measure, any part day
      being dropped, multiplied by a deposit step of deposit_step_standard.
    params:
    - shift_standard
    - per_n_installments
    - per_deposit_amount
    - deposit_step_standard
  inputs:
    history:
    - table: auto_transactions
      aggregate: count
      field: auto_txn_id
      within_months: 24
      filters:
        event_type: auto_payment
        payment_type: scheduled
    - category: card
      table: card_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: card_purchase
    - category: checking
      table: checking_transactions
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: checking_deposit
        channel: ach_direct_deposit
    cross_category:
    - card
    - checking
- id: auto_ext_gap_cancellation_refund
  base_policy_refs:
  - auto_evt_gap_refund
  overwrite:
  - base_policy: auto_evt_gap_refund
    superseded_clause: A GAP cancellation within gap_cancellation_full_refund_days calendar days after the loan
      funded refunds the whole gap_premium.
    replaced_by: The refund owed on the waiver coverage financed with an auto loan when that coverage is closed
      out is the unearned part of the charge financed at funding, less the cancellation fee, and it is entered
      against the loan rather than paid out to the borrower, so the loan's unpaid principal falls by it.
  - base_policy: auto_evt_gap_refund
    superseded_clause: The refund is paid to a PCB checking account of the borrower or by official check; it is
      never applied to the loan balance.
    replaced_by: The unearned part is the refundable share of the charge financed at funding, multiplied by the
      months remaining and divided by the term the loan was written for, and the cancellation fee is deducted
      from it once it is settled.
  - base_policy: auto_evt_gap_refund
    superseded_clause: After that window the refund is gap_premium times the number of whole months remaining
      to the scheduled maturity_date divided by term_months, rounded half-up to the cent, minus gap_cancellation_fee,
      and no refund is made when that is zero or less.
    replaced_by: The unearned part is the refundable share of the charge financed at funding, multiplied by the
      months remaining and divided by the term the loan was written for, and the cancellation fee is deducted
      from it once it is settled.
  trigger: state_due
  subject:
  - auto_cancel_gap
  - auto_gap_refund
  computes: refund_amount
  target_tool: post_gap_refund_16f4decd
  params:
    refundable_pct_high: 100
    refundable_pct_mid: 95
    refundable_pct_standard: 90
    installments_deep: 12
    installments_mid: 8
    deposits_mid: 2
    checking_seasoning_long: 120
    checking_seasoning_mid: 48
    reward_points_deep: 25000
    reward_points_mid: 5000
    card_purchases_deep: 12
    card_purchases_mid: 3
    cancel_fee_low: 0.0
    cancel_fee_mid: 25.0
    seasoning_long: 36
    seasoning_mid: 24
  rule: The refund owed on the waiver coverage financed with an auto loan when that coverage is closed out is
    the unearned part of the charge financed at funding, less the cancellation fee, and it is entered against
    the loan rather than paid out to the borrower, so the loan's unpaid principal falls by it. The unearned part
    is the refundable share of the charge financed at funding, multiplied by the months remaining and divided
    by the term the loan was written for, and the cancellation fee is deducted from it once it is settled. No
    refund is entered where that figure comes to nothing or less. Under the standard method the refundable share
    is refundable_pct_standard percent of the charge financed at funding, the months remaining are the term less
    the whole months since funding, the unearned part is measured on the whole months remaining over the term,
    the cancellation fee is the one the product publishes, and the refund is rounded half-up to the cent. The
    months remaining are counted from the day of the cancellation to the scheduled maturity where both of these
    hold, that the borrower holds an active checking account whose posted balance is at least the fee-waiver daily
    balance its tier publishes and that at least deposits_mid recurring deposits have posted to that account in
    the last three months; they are counted from the installment then due to the scheduled maturity where exactly
    one of those two holds; and they are the term less the whole months since funding where neither of them holds.
    The refundable share is refundable_pct_high percent where at least installments_deep scheduled installments
    have been credited to the loan in the last twelve months; it is refundable_pct_mid percent where at least
    installments_mid but fewer than installments_deep scheduled installments have been credited in that window;
    and it is refundable_pct_standard percent where fewer than installments_mid have been credited in that window.
    The unearned part is measured on the days remaining to the scheduled maturity over the days of the whole term
    where the borrower's checking account was opened at least checking_seasoning_long whole months before the
    cancellation; the months remaining are taken up to the whole quarter above before the share is worked out
    where that account was opened at least checking_seasoning_mid but less than checking_seasoning_long whole
    months before the cancellation; and the unearned part is measured on the whole months remaining over the term
    where that account was opened less than checking_seasoning_mid whole months before the cancellation. The cancellation
    fee is cancel_fee_low where the borrower's card carries at least reward_points_deep unredeemed reward points
    and at least card_purchases_deep card purchases have posted in the last three months; it is cancel_fee_mid
    where that card carries at least reward_points_mid unredeemed reward points and at least card_purchases_mid
    card purchases have posted in the last three months while either those points fall short of reward_points_deep
    or those purchases fall short of card_purchases_deep; and it is the cancellation fee the product publishes
    for every other borrower. The refund is rounded down to the whole dollar where the loan was funded at least
    seasoning_long whole months before the cancellation; it is rounded half-up to the whole dollar where the loan
    was funded at least seasoning_mid but less than seasoning_long whole months before the cancellation; and it
    is rounded half-up to the cent where the loan was funded less than seasoning_mid whole months before the cancellation.
  prerequisite: []
  cross_category:
  - category: checking
    as: branch
    reads:
    - ledger_balance
    - variant_name
    - opened_date
    - checking_transactions.amount
    note: The months-remaining tier rests on the borrower's checking balance against its tier's waiver balance
      and on the recurring deposits posted to it, and the unearned-part rounding tier on how long that account
      has been open.
  - category: card
    as: history
    reads:
    - rewards_balance
    - card_transactions.amount
    note: The cancellation fee tier rests on the card's unredeemed reward points and on the count of card purchases
      in the last three months.
  compute:
  - premium_financed: F('gap_premium')
  - loan_term: F('term_months')
  - checking_balance: CFIELD('checking','ledger_balance', status='active')
  - checking_waiver_balance: CPARAM('checking','waiver_min_daily_balance', status='active')
  - recurring_deposits_3m: XCOUNT('checking','checking_transactions', within_months=3, date_field='posted_date',
      event_type='checking_deposit', channel='ach_direct_deposit')
  - months_remaining: MONTHS(NOW, F('maturity_date')) if ((checking_balance or 0) >= (checking_waiver_balance
      or 0) and recurring_deposits_3m >= K('deposits_mid')) else (MONTHS(F('next_payment_due_date'), F('maturity_date'))
      if ((checking_balance or 0) >= (checking_waiver_balance or 0) or recurring_deposits_3m >= K('deposits_mid'))
      else loan_term - MONTHS(F('funded_date'), NOW))
  - scheduled_paid_12m: COUNT('auto_transactions', within_months=12, date_field='posted_date', event_type='auto_payment',
      payment_type='scheduled')
  - refundable_share: K('refundable_pct_high') if scheduled_paid_12m >= K('installments_deep') else (K('refundable_pct_mid')
      if scheduled_paid_12m >= K('installments_mid') else K('refundable_pct_standard'))
  - refundable_premium: premium_financed * refundable_share / 100
  - checking_months: MONTHS(CFIELD('checking','opened_date', status='active'), NOW)
  - unearned_share: refundable_premium * DAYS(NOW, F('maturity_date')) / DAYS(F('funded_date'), F('maturity_date'))
      if checking_months >= K('checking_seasoning_long') else (refundable_premium * (float(int((months_remaining
      + 2) / 3)) * 3) / loan_term if checking_months >= K('checking_seasoning_mid') else refundable_premium *
      months_remaining / loan_term)
  - card_reward_points: CFIELD('card','rewards_balance', status='active')
  - card_purchases_3m: XCOUNT('card','card_transactions', within_months=3, date_field='posted_date', event_type='card_purchase')
  - cancellation_fee: K('cancel_fee_low') if ((card_reward_points or 0) >= K('reward_points_deep') and card_purchases_3m
      >= K('card_purchases_deep')) else (K('cancel_fee_mid') if ((card_reward_points or 0) >= K('reward_points_mid')
      and card_purchases_3m >= K('card_purchases_mid') and ((card_reward_points or 0) < K('reward_points_deep')
      or card_purchases_3m < K('card_purchases_deep'))) else P('gap_cancellation_fee'))
  - refund_before_rounding: unearned_share - cancellation_fee
  - months_on_book: MONTHS(F('funded_date'), NOW)
  - rounded_refund: float(int(refund_before_rounding)) if months_on_book >= K('seasoning_long') else (float(int(refund_before_rounding
      + 0.5)) if months_on_book >= K('seasoning_mid') else RND(refund_before_rounding, 2))
  - result: MX(0.0, rounded_refund)
  compute_basis:
    checking_balance: the borrower holds an active checking account whose posted balance is at least the fee-waiver
      daily balance its tier publishes
    checking_waiver_balance: at least the fee-waiver daily balance its tier publishes
    recurring_deposits_3m: at least deposits_mid recurring deposits have posted to that account in the last three
      months
    months_remaining: The months remaining are counted from the day of the cancellation to the scheduled maturity
      where both of these hold, that the borrower holds an active checking account whose posted balance is at
      least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring deposits
      have posted to that account in the last three months; they are counted from the installment then due to
      the scheduled maturity where exactly one of those two holds; and they are the term less the whole months
      since funding where neither of them holds.
    scheduled_paid_12m: at least installments_deep scheduled installments have been credited to the loan in the
      last twelve months
    refundable_share: The refundable share is refundable_pct_high percent where at least installments_deep scheduled
      installments have been credited to the loan in the last twelve months; it is refundable_pct_mid percent
      where at least installments_mid but fewer than installments_deep scheduled installments have been credited
      in that window; and it is refundable_pct_standard percent where fewer than installments_mid have been credited
      in that window.
    checking_months: where the borrower's checking account was opened at least checking_seasoning_long whole months
      before the cancellation
    card_reward_points: where the borrower's card carries at least reward_points_deep unredeemed reward points
    card_purchases_3m: at least card_purchases_deep card purchases have posted in the last three months
    cancellation_fee: The cancellation fee is cancel_fee_low where the borrower's card carries at least reward_points_deep
      unredeemed reward points and at least card_purchases_deep card purchases have posted in the last three months;
      it is cancel_fee_mid where that card carries at least reward_points_mid unredeemed reward points and at
      least card_purchases_mid card purchases have posted in the last three months while either those points fall
      short of reward_points_deep or those purchases fall short of card_purchases_deep; and it is the cancellation
      fee the product publishes for every other borrower.
    refund_before_rounding: the cancellation fee is deducted from it once it is settled
    months_on_book: where the loan was funded at least seasoning_long whole months before the cancellation
    rounded_refund: The refund is rounded down to the whole dollar where the loan was funded at least seasoning_long
      whole months before the cancellation; it is rounded half-up to the whole dollar where the loan was funded
      at least seasoning_mid but less than seasoning_long whole months before the cancellation; and it is rounded
      half-up to the cent where the loan was funded less than seasoning_mid whole months before the cancellation.
    result: No refund is entered where that figure comes to nothing or less.
    unearned_share: The unearned part is measured on the days remaining to the scheduled maturity over the days
      of the whole term where the borrower's checking account was opened at least checking_seasoning_long whole
      months before the cancellation; the months remaining are taken up to the whole quarter above before the
      share is worked out where that account was opened at least checking_seasoning_mid but less than checking_seasoning_long
      whole months before the cancellation; and the unearned part is measured on the whole months remaining over
      the term where that account was opened less than checking_seasoning_mid whole months before the cancellation.
  factors:
  - id: remaining_months_measure
    effect: method
    decides: months_remaining
    bindings:
    - checking_balance
    - checking_waiver_balance
    - recurring_deposits_3m
    - months_remaining
    ladder:
    - when: both of these hold, that the borrower holds an active checking account whose posted balance is at
        least the fee-waiver daily balance its tier publishes and that at least deposits_mid recurring deposits
        have posted to that account in the last three months
      method: the months remaining are counted from the day of the cancellation to the scheduled maturity
    - when: exactly one of those two holds
      method: the months remaining are counted from the installment then due to the scheduled maturity
    - when: neither of them holds
      method: the months remaining are the term less the whole months since funding
    baseline:
      months_remaining: loan_term - MONTHS(F('funded_date'), NOW)
    evidence:
    - cross_category
    - date
    cross_difficulty: checking
  - id: refundable_share_step
    effect: parameter
    decides: refundable_share
    bindings:
    - scheduled_paid_12m
    - refundable_share
    ladder:
    - when: at least installments_deep scheduled installments have been credited to the loan in the last twelve
        months
      value: K('refundable_pct_high')
    - when: at least installments_mid but fewer than installments_deep scheduled installments have been credited
        in that window
      value: K('refundable_pct_mid')
    - when: fewer than installments_mid have been credited in that window
      value: K('refundable_pct_standard')
    baseline:
      refundable_share: K('refundable_pct_standard')
    evidence:
    - history
    cross_difficulty: null
  - id: unearned_share_convention
    effect: method
    decides: unearned_share
    bindings:
    - checking_months
    - unearned_share
    ladder:
    - when: the borrower's checking account was opened at least checking_seasoning_long whole months before the
        cancellation
      method: the unearned part is measured on the days remaining to the scheduled maturity over the days of the
        whole term
    - when: that account was opened at least checking_seasoning_mid but less than checking_seasoning_long whole
        months before the cancellation
      method: the months remaining are taken up to the whole quarter above before the share is worked out
    - when: that account was opened less than checking_seasoning_mid whole months before the cancellation
      method: the unearned part is measured on the whole months remaining over the term
    baseline:
      unearned_share: refundable_premium * months_remaining / loan_term
    evidence:
    - cross_category
    - date
    cross_difficulty: checking
  - id: cancellation_fee_step
    effect: parameter
    decides: cancellation_fee
    bindings:
    - card_reward_points
    - card_purchases_3m
    - cancellation_fee
    ladder:
    - when: the borrower's card carries at least reward_points_deep unredeemed reward points and at least card_purchases_deep
        card purchases have posted in the last three months
      value: K('cancel_fee_low')
    - when: the borrower's card carries at least reward_points_mid unredeemed reward points and at least card_purchases_mid
        card purchases have posted in the last three months while either those points fall short of reward_points_deep
        or those purchases fall short of card_purchases_deep
      value: K('cancel_fee_mid')
    - when: otherwise
      value: P('gap_cancellation_fee')
    baseline:
      cancellation_fee: P('gap_cancellation_fee')
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: refund_rounding
    effect: method
    decides: rounded_refund
    bindings:
    - months_on_book
    - rounded_refund
    ladder:
    - when: the loan was funded at least seasoning_long whole months before the cancellation
      method: the refund is rounded down to the whole dollar
    - when: the loan was funded at least seasoning_mid but less than seasoning_long whole months before the cancellation
      method: the refund is rounded half-up to the whole dollar
    - when: the loan was funded less than seasoning_mid whole months before the cancellation
      method: the refund is rounded half-up to the cent
    baseline:
      rounded_refund: RND(refund_before_rounding, 2)
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The refund owed on the waiver coverage financed with an auto loan when that coverage is closed out is
