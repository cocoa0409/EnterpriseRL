# Policy charter: Personal Credit Cards. Piedmont Crescent Bank, N.A.
# Single registry of every credit card number; the runtime never reads this file.

category: card
display_name: Personal Credit Cards

binding:
  holding_table: card_accounts
  event_tables: [card_transactions]
  intake_tables: [card_disputes, card_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {current_balance: card_balance_owed, rewards_balance: card_rewards}

lifecycle:
  states: [applied, active, suspended, charged_off, closed]
  transitions:
    - {from: applied, to: active, by: system, means: "Credit underwriting approved the application and set the credit limit and APRs."}
    - {from: applied, to: closed, by: system, means: "Credit underwriting declined the application, or the applicant withdrew it."}
    - {from: active, to: suspended, by: system, means: "The account reached the suspension delinquency threshold and charging privileges were suspended."}
    - {from: suspended, to: active, by: system, means: "The past-due amount was paid, bringing the account current, and charging privileges were restored."}
    - {from: suspended, to: charged_off, by: system, means: "The account reached the charge-off delinquency threshold and the balance was charged off to recovery."}
    - {from: active, to: closed, by: user, means: "The cardholder confirmed a closure request; any balance remains payable."}
    - {from: suspended, to: closed, by: user, means: "The cardholder of a suspended account confirmed a closure request; the balance remains payable."}
    - {from: charged_off, to: closed, by: system, means: "The charged-off account was administratively closed."}

accounts:
  - key: card_balance_owed
    unit: USD
    meaning: "What the cardholder owes on one card account; purchases, cash advances, balance transfers, fees and interest raise it, and payments and credits lower it; a negative value is a credit balance."
  - key: card_rewards
    unit: points
    meaning: "Unredeemed rewards points on one card account, each worth a tier-defined cash or travel value when redeemed."

parameter_schema:
  age_min_to_open: "Youngest age in whole years at application on which this card may be opened; integer years."
  age_max_to_open: "Oldest age in whole years at application for this card; integer years, or 'no_maximum'."
  annual_fee: "Fee charged once a year on the statement that closes in the account's anniversary month; USD."
  annual_fee_waived_first_year: "Whether the annual fee is not charged in the first account year; boolean."
  credit_limit_min: "Smallest credit limit assigned on this card; USD."
  credit_limit_max: "Largest credit limit this card can carry; USD."
  secured_deposit_required: "Whether a cash security deposit equal to the credit limit must be held; boolean."
  secured_deposit_min: "Smallest security deposit accepted; USD, or 'not_applicable'."
  purchase_apr_min: "Lowest purchase APR assigned at approval; percent."
  purchase_apr_max: "Highest purchase APR assigned at approval; percent."
  cash_advance_apr: "APR on cash advances; percent."
  penalty_apr: "APR applied once the penalty APR is triggered; percent, or 'not_applicable'."
  penalty_apr_trigger_days_late: "Days a minimum payment must be past due before the penalty APR applies; integer days."
  penalty_apr_cure_on_time_payments: "Consecutive on-time minimum payments after which the penalty APR is removed; integer count."
  balance_transfer_allowed: "Whether balance transfers may be made to this card; boolean."
  balance_transfer_intro_apr: "Introductory APR on balance transfers posted within the intro window; percent, or 'not_offered'."
  balance_transfer_intro_months: "Statement cycles after opening during which the introductory balance transfer APR applies; integer months, or 'not_offered'."
  balance_transfer_intro_window_days: "Calendar days after opening within which a balance transfer must post to receive the introductory APR; integer days, or 'not_offered'."
  balance_transfer_fee_pct: "Balance transfer fee as a percent of each transfer; percent, or 'not_applicable'."
  balance_transfer_fee_min: "Minimum balance transfer fee per transfer; USD, or 'not_applicable'."
  cash_advance_fee_pct: "Cash advance fee as a percent of each advance; percent."
  cash_advance_fee_min: "Minimum cash advance fee per advance; USD."
  cash_advance_limit_pct: "Cash advances posted in one statement cycle may not exceed this percent of the credit limit; percent."
  foreign_transaction_fee_pct: "Fee on each purchase made outside the United States or in a foreign currency; percent."
  over_limit_tolerance_pct: "Purchases are authorized up to this percent above the credit limit, with no over-limit fee ever charged; percent."
  late_fee_first: "Late fee when no late fee was charged in the lookback cycles; USD."
  late_fee_repeat: "Late fee when a late fee was charged in any of the lookback cycles; USD."
  late_fee_repeat_lookback_cycles: "Number of preceding statement cycles searched for an earlier late fee; integer cycles."
  returned_payment_fee: "Fee when a payment is returned unpaid; USD."
  minimum_payment_pct: "Percent of the new statement balance included in the minimum payment, in addition to interest and fees billed; percent."
  minimum_payment_floor: "Minimum payment is never below this amount, unless the statement balance is smaller; USD."
  payment_due_days_after_close: "Calendar days from the statement closing date to the payment due date; integer days."
  minimum_interest_charge: "Smallest interest charge billed in a cycle in which any interest is due; USD."
  trailing_interest_courtesy_per_365d: "Courtesy reversals of residual (trailing) interest allowed per customer in a rolling 365 days; integer count."
  late_fee_courtesy_waivers_365d: "Courtesy late fee reversals allowed per customer in a rolling 365 days; integer count."
  late_fee_courtesy_min_prior_on_time: "Consecutive on-time payments immediately before the late one that a courtesy late fee reversal requires; integer count."
  rewards_program: "Rewards currency: 'none', 'cash_back' or 'points'."
  rewards_base_rate: "Points earned per whole dollar of net purchases outside bonus categories; number."
  rewards_bonus_categories: "Merchant categories earning the bonus rate; list of merchant_category values."
  rewards_bonus_rate: "Points earned per whole dollar of net purchases in bonus categories, up to the quarterly cap; number."
  rewards_bonus_quarterly_spend_cap: "Bonus-category purchases per calendar quarter that earn the bonus rate; USD, 'no_cap', or 'not_applicable'."
  rewards_redemption_minimum_points: "Smallest redemption; integer points, or 'not_applicable'."
  rewards_point_value_cash: "USD value of one point redeemed as statement credit or deposit; USD, or 'not_applicable'."
  rewards_point_value_travel: "USD value of one point redeemed for travel booked through the rewards center; USD, or 'not_applicable'."
  rewards_redemption_types: "Ways points may be redeemed on this card; list of redemption_type values."
  rewards_forfeit_days_past_due: "Days past due at which all unredeemed points are forfeited; integer days, or 'not_applicable'."
  cli_min_months_since_open: "Whole months the account must have been open before a credit limit increase may be requested; integer months, or 'not_offered'."
  cli_min_months_between: "Whole months that must pass after the last credit limit increase before another; integer months."
  cli_max_increase_pct: "Largest single credit limit increase as a percent of the current limit; percent, or 'not_offered'."
  secured_graduation_review_months: "Months after opening at which a secured card is reviewed for graduation; integer months, or 'not_applicable'."
  secured_graduation_target_tier: "Card tier a secured card graduates into; tier name, or 'not_applicable'."
  scra_apr_cap: "APR cap on every balance while the customer's military status is active duty; percent."
  dispute_notice_window_days: "Calendar days after the closing date of the statement on which a charge first appeared within which a billing dispute may be raised; integer days."
  suspension_days_past_due: "Days past due at which charging privileges are suspended; integer days."
  chargeoff_days_past_due: "Days past due at which the balance is charged off; integer days."

