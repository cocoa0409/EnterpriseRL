        - {table: card_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: card_interest_charge}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: card_fee_reversal}}
        - {table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_payment}}
        - {table: card_transactions, aggregate: count, field: card_txn_id, within_months: null, filters: {event_type: card_rewards_redeem}}
        - {category: checking, table: checking_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: checking_deposit}}
        - {category: savings, table: savings_transactions, aggregate: count, field: amount, within_months: 3, filters: {event_type: savings_interest_credit}}
      cross_category: [checking, savings]

  - id: card_ext_dispute_provisional_credit
    base_policy_refs: [card_evt_billing_disputes]
    overwrite:
      - base_policy: card_evt_billing_disputes
        superseded_clause: >-
          A temporary credit of the claimed amount, never more than the charge, is posted as a card_dispute_credit with
          adjustment_reason dispute_provisional on the day a qualifying dispute is registered.
        replaced_by: >-
          The temporary credit posted on a qualifying dispute is a computed figure rather than the claimed amount
          itself, and it is never more than the amount the dispute records as claimed.
    trigger: state_due
    subject: [card_dispute_credit]
    computes: provisional_credit_amount
    target_tool: post_card_dispute_credit_83d80881
    params:
      proportion_full: 0.95
      proportion_mid: 0.85
      proportion_standard: 0.70
      payments_deep_count: 6
      checking_deposit_volume_high: 12000.00
      savings_relationship_balance: 25000.00
      savings_withdrawal_count_low: 1
      uplift_high: 40.00
      uplift_mid: 15.00
      uplift_none: 0.00
      dispute_count_low: 2
      seasoned_account_months: 48
      certificate_balance_high: 10000.00
      certificate_payout_count_low: 1
    rule: >
      A billing dispute that has been registered on a personal credit card account and still stands in submitted status
      owes the cardholder a temporary credit, and this rule fixes the size of it. The temporary credit posted on a
      qualifying dispute is a computed figure rather than the claimed amount itself, and it is never more than the
      amount the dispute records as claimed. The credit is owed as soon as the dispute stands in submitted status and is
      posted at the next reconciliation of the account, whether or not the cardholder raises it again. The amount
      claimed is the figure recorded on the most recent dispute standing in submitted status on the card account,
      selected by notice date. Under the standard method the credited proportion is proportion_standard, the credited
      proportion acts on the amount claimed alone, no merchant credit is set off, no uplift is added, the figure is
      rounded half-up to the cent, and the temporary credit is the lesser of that rounded figure and the amount claimed.
      The credited proportion is not proportion_standard for every cardholder. Where the cardholder holds an active
      Premier Checking or Private Client Checking account and at least payments_deep_count card payments posted to this
      card account in the last twelve months, the credited proportion is proportion_full. Where the cardholder holds an
      active checking account whose tier is neither Premier Checking nor Private Client Checking and at least
      payments_deep_count card payments posted to this card account in the last twelve months, the credited proportion
      is proportion_mid. Where neither of those holds, the credited proportion is proportion_standard.
      What the credited proportion acts on turns on the money the cardholder moves through PCB checking. Where PCB
      checking deposits posted to the cardholder's checking accounts in the last six months total at least
      checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the
      credited proportion acts on the amount claimed together with the card fees posted to the card account in the last
      two months. Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was
      posted to those accounts in the last six months, the credited proportion acts on the amount claimed together with
      the most recent card fee posted to the card account. Where those deposits total less than
      checking_deposit_volume_high, the credited proportion acts on the amount claimed alone.
      Merchant credits the cardholder has already received are set off against the temporary credit, and which of them
      count turns on the savings relationship. Where the cardholder holds an active savings account whose balance is at
      least savings_relationship_balance and at least savings_withdrawal_count_low savings withdrawal posted to the
      cardholder's savings accounts in the last three months, every merchant credit posted to the card account in the
      last six months is set off. Where the cardholder holds an active savings account whose balance is below
      savings_relationship_balance and at least savings_withdrawal_count_low savings withdrawal posted to the
      cardholder's savings accounts in the last three months, only the most recent merchant credit posted to the card
      account is set off. Where neither of those holds, no merchant credit is set off.
      An uplift is added for cardholders whose card has been open a long time and who rarely dispute. Where the card
      account has been open at least seasoned_account_months whole months and at most dispute_count_low billing disputes
      have been recorded on it in the last twenty-four months, the uplift is uplift_high. Where the card account has
      been open at least seasoned_account_months whole months and more than dispute_count_low billing disputes have been
      recorded on it in the last twenty-four months, the uplift is uplift_mid. Where the card account has been open less
      than seasoned_account_months whole months, the uplift is uplift_none.
      The rounding of the resulting figure turns on the certificate relationship. Where the cardholder holds an active
      certificate whose principal balance is at least certificate_balance_high and at least
      certificate_payout_count_low certificate interest payout posted to the cardholder's certificates in the last six
      months, the figure is rounded half-up to the nearest whole dollar. Where the cardholder holds an active
      certificate whose principal balance is below certificate_balance_high and at least certificate_payout_count_low
      certificate interest payout posted to the cardholder's certificates in the last six months, the figure is reduced
      to the whole dollar below it. Where neither of those holds, the figure is rounded half-up to the cent.
      A card account carrying no dispute in submitted status is out of scope of this rule and nothing is credited.
    prerequisite: []
    cross_category:
      - category: checking
        as: branch
        reads: [variant_name, status, checking_transactions.amount]
        note: "The checking tier decides the credited-proportion tier; the six-month deposit total and fee count decide what that proportion acts on."
      - category: savings
        as: history
        reads: [status, current_balance, savings_transactions.amount]
        note: "The savings balance and the count of savings withdrawals in the last three months decide which merchant credits are set off."
      - category: cd
        as: history
        reads: [status, principal_balance, cd_transactions.amount]
        note: "The certificate principal and the count of certificate interest payouts in the last six months decide the rounding tier."
    compute:
      - claimed_amount: "float(LATEST('card_disputes','claimed_amount', date_field='notice_date', dispute_status='submitted') or 0)"
      - payments_12m: "COUNT('card_transactions', within_months=12, date_field='posted_date', event_type='card_payment')"
      - checking_tier: "CFIELD('checking','variant_name', status='active')"
      - credited_proportion: "(K('proportion_full') if ((checking_tier == 'Premier Checking' or checking_tier == 'Private Client Checking') and payments_12m >= K('payments_deep_count')) else (K('proportion_mid') if (checking_tier != None and checking_tier != 'Premier Checking' and checking_tier != 'Private Client Checking' and payments_12m >= K('payments_deep_count')) else K('proportion_standard')))"
      - cycle_fees: "SUM('card_transactions','amount', within_months=2, date_field='posted_date', event_type='card_fee')"
      - fee_latest: "float(LATEST('card_transactions','amount', date_field='posted_date', event_type='card_fee') or 0)"
      - checking_deposits_6m: "XSUM('checking','checking_transactions','amount', within_months=6, date_field='posted_date', event_type='checking_deposit')"
      - checking_fees_6m: "XCOUNT('checking','checking_transactions', within_months=6, date_field='posted_date', event_type='checking_fee')"
      - proportion_base: "(claimed_amount + cycle_fees if (checking_deposits_6m >= K('checking_deposit_volume_high') and checking_fees_6m == 0) else (claimed_amount + fee_latest if (checking_deposits_6m >= K('checking_deposit_volume_high') and checking_fees_6m > 0) else claimed_amount))"
      - merchant_credits_6m: "SUM('card_transactions','amount', within_months=6, date_field='posted_date', event_type='card_merchant_credit')"
      - merchant_credit_latest: "float(LATEST('card_transactions','amount', date_field='posted_date', event_type='card_merchant_credit') or 0)"
      - savings_balance: "float(CFIELD('savings','current_balance', status='active') or 0)"
      - savings_withdrawals_3m: "XCOUNT('savings','savings_transactions', within_months=3, date_field='posted_date', event_type='savings_withdrawal')"
      - has_savings: "EXISTS('savings', status='active')"
      - offset_amount: "(merchant_credits_6m if (savings_balance >= K('savings_relationship_balance') and savings_withdrawals_3m >= K('savings_withdrawal_count_low')) else (merchant_credit_latest if (has_savings and savings_balance < K('savings_relationship_balance') and savings_withdrawals_3m >= K('savings_withdrawal_count_low')) else 0.0))"
      - months_open: "MONTHS(F('opened_date'), NOW)"
      - prior_disputes_24m: "COUNT('card_disputes', within_months=24, date_field='notice_date')"
      - uplift: "(K('uplift_high') if (months_open >= K('seasoned_account_months') and prior_disputes_24m <= K('dispute_count_low')) else (K('uplift_mid') if (months_open >= K('seasoned_account_months') and prior_disputes_24m > K('dispute_count_low')) else K('uplift_none')))"
      - raw_credit: "proportion_base * credited_proportion - offset_amount + uplift"
      - cd_principal: "float(CFIELD('cd','principal_balance', status='active') or 0)"
      - cd_payouts_6m: "XCOUNT('cd','cd_transactions', within_months=6, date_field='posted_date', event_type='cd_interest_payout')"
      - has_cd: "EXISTS('cd', status='active')"
      - rounded_credit: "(RND(raw_credit, 0) if (cd_principal >= K('certificate_balance_high') and cd_payouts_6m >= K('certificate_payout_count_low')) else (float(int(raw_credit)) if (has_cd and cd_principal < K('certificate_balance_high') and cd_payouts_6m >= K('certificate_payout_count_low')) else RND(raw_credit, 2)))"
      - result: "MN(rounded_credit, claimed_amount)"
    compute_basis:
      claimed_amount: "The amount claimed is the figure recorded on the most recent dispute standing in submitted status on the card account, selected by notice date."
      payments_12m: "Where the cardholder holds an active Premier Checking or Private Client Checking account and at least payments_deep_count card payments posted to this card account in the last twelve months, the credited proportion is proportion_full."
      checking_tier: "Where the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least payments_deep_count card payments posted to this card account in the last twelve months, the credited proportion is proportion_mid."
      credited_proportion: "Where the cardholder holds an active Premier Checking or Private Client Checking account and at least payments_deep_count card payments posted to this card account in the last twelve months, the credited proportion is proportion_full. Where the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least payments_deep_count card payments posted to this card account in the last twelve months, the credited proportion is proportion_mid. Where neither of those holds, the credited proportion is proportion_standard."
      cycle_fees: "Where PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the credited proportion acts on the amount claimed together with the card fees posted to the card account in the last two months."
      fee_latest: "Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the credited proportion acts on the amount claimed together with the most recent card fee posted to the card account."
      checking_deposits_6m: "Where those deposits total less than checking_deposit_volume_high, the credited proportion acts on the amount claimed alone."
      checking_fees_6m: "Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the credited proportion acts on the amount claimed together with the most recent card fee posted to the card account."
      proportion_base: "Where PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the credited proportion acts on the amount claimed together with the card fees posted to the card account in the last two months. Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the credited proportion acts on the amount claimed together with the most recent card fee posted to the card account. Where those deposits total less than checking_deposit_volume_high, the credited proportion acts on the amount claimed alone."
      merchant_credits_6m: "Where the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_withdrawal_count_low savings withdrawal posted to the cardholder's savings accounts in the last three months, every merchant credit posted to the card account in the last six months is set off."
      merchant_credit_latest: "Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_withdrawal_count_low savings withdrawal posted to the cardholder's savings accounts in the last three months, only the most recent merchant credit posted to the card account is set off."
      savings_balance: "Where the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_withdrawal_count_low savings withdrawal posted to the cardholder's savings accounts in the last three months, every merchant credit posted to the card account in the last six months is set off."
      savings_withdrawals_3m: "Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_withdrawal_count_low savings withdrawal posted to the cardholder's savings accounts in the last three months, only the most recent merchant credit posted to the card account is set off."
      has_savings: "Where neither of those holds, no merchant credit is set off."
      offset_amount: "Where the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_withdrawal_count_low savings withdrawal posted to the cardholder's savings accounts in the last three months, every merchant credit posted to the card account in the last six months is set off. Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_withdrawal_count_low savings withdrawal posted to the cardholder's savings accounts in the last three months, only the most recent merchant credit posted to the card account is set off. Where neither of those holds, no merchant credit is set off."
      months_open: "Where the card account has been open less than seasoned_account_months whole months, the uplift is uplift_none."
      prior_disputes_24m: "Where the card account has been open at least seasoned_account_months whole months and at most dispute_count_low billing disputes have been recorded on it in the last twenty-four months, the uplift is uplift_high."
      uplift: "Where the card account has been open at least seasoned_account_months whole months and at most dispute_count_low billing disputes have been recorded on it in the last twenty-four months, the uplift is uplift_high. Where the card account has been open at least seasoned_account_months whole months and more than dispute_count_low billing disputes have been recorded on it in the last twenty-four months, the uplift is uplift_mid. Where the card account has been open less than seasoned_account_months whole months, the uplift is uplift_none."
      cd_principal: "Where the cardholder holds an active certificate whose principal balance is at least certificate_balance_high and at least certificate_payout_count_low certificate interest payout posted to the cardholder's certificates in the last six months, the figure is rounded half-up to the nearest whole dollar."
      cd_payouts_6m: "Where the cardholder holds an active certificate whose principal balance is below certificate_balance_high and at least certificate_payout_count_low certificate interest payout posted to the cardholder's certificates in the last six months, the figure is reduced to the whole dollar below it."
      has_cd: "Where neither of those holds, the figure is rounded half-up to the cent."
      rounded_credit: "Where the cardholder holds an active certificate whose principal balance is at least certificate_balance_high and at least certificate_payout_count_low certificate interest payout posted to the cardholder's certificates in the last six months, the figure is rounded half-up to the nearest whole dollar. Where the cardholder holds an active certificate whose principal balance is below certificate_balance_high and at least certificate_payout_count_low certificate interest payout posted to the cardholder's certificates in the last six months, the figure is reduced to the whole dollar below it. Where neither of those holds, the figure is rounded half-up to the cent."
      result: "The temporary credit posted on a qualifying dispute is a computed figure rather than the claimed amount itself, and it is never more than the amount the dispute records as claimed."
    factors:
      - id: credited_proportion_ladder
        effect: parameter
        decides: credited_proportion
        bindings: [payments_12m, checking_tier, credited_proportion]
        ladder:
          - when: "the cardholder holds an active Premier Checking or Private Client Checking account and at least payments_deep_count card payments posted to this card account in the last twelve months"
            value: "K('proportion_full')"
          - when: "the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least payments_deep_count card payments posted to this card account in the last twelve months"
            value: "K('proportion_mid')"
          - when: "otherwise"
            value: "K('proportion_standard')"
        baseline:
          credited_proportion: "K('proportion_standard')"
        evidence: [history, cross_category]
        cross_difficulty: checking
      - id: proportion_base_convention
        effect: method
        decides: proportion_base
        bindings: [cycle_fees, fee_latest, checking_deposits_6m, checking_fees_6m, proportion_base]
        ladder:
          - when: "PCB checking deposits in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months"
            method: "the credited proportion acts on the amount claimed together with the card fees posted to the card account in the last two months"
          - when: "those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months"
            method: "the credited proportion acts on the amount claimed together with the most recent card fee posted to the card account"
          - when: "otherwise"
            method: "the credited proportion acts on the amount claimed alone"
        baseline:
          proportion_base: "claimed_amount"
