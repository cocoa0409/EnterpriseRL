            method: "every merchant credit posted to the card account in the last six months is set off"
          - when: "the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_withdrawal_count_low savings withdrawal posted in the last three months"
            method: "only the most recent merchant credit posted to the card account is set off"
