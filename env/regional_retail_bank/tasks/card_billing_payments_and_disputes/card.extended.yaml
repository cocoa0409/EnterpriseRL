      point_value: "Where the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_interest_count_low savings interest credit posted to the cardholder's savings accounts in the last three months, the redemption value is point_value_enhanced. Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_interest_count_low savings interest credit posted to the cardholder's savings accounts in the last three months, the redemption value is point_value_mid. Where neither of those holds, the redemption value is the tier's own cash value per point."
