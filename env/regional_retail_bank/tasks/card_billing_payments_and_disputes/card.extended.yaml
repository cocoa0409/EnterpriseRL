events:
  # ---------------- holding writes (card_accounts) ----------------
  - type: card_open
    target: card_accounts
    mutation: create
    meaning: "A credit card application is recorded for one card tier and awaits underwriting."
    grain: "One row per application."
    fields:
      customer_id: "The applicant."
      variant_name: "Official card tier applied for."
      status: "Always applied at creation."
      opened_date: "Date the application was recorded; it becomes the account opening date on approval."
      current_balance: "Always 0.00 at creation."
      rewards_balance: "Always 0 at creation."
      secured_deposit_amount: "Security deposit pledged for a secured card, otherwise 0.00."
      statement_closing_day: "Day of month the statement closes."
    triggers: []
  - type: card_approve
    target: card_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: "Underwriting approves the application and sets the credit limit and APRs."
    grain: "One row per approval."
    fields:
      status: "Set to active."
      card_last4: "Last four digits of the issued card."
      credit_limit: "Credit limit assigned."
      purchase_apr: "Purchase APR assigned within the tier range."
      cash_advance_apr: "Cash advance APR from the tier."
      bt_intro_end_date: "Last day of the introductory balance transfer APR, or empty."
    triggers: []
  - type: card_decline
    target: card_accounts
    mutation: {transition: {from: applied, to: closed}}
    meaning: "Underwriting declines the application or the applicant withdraws it."
    grain: "One row per declined or withdrawn application."
    fields:
      status: "Set to closed."
      closed_date: "Date of the decision."
    triggers: []
  - type: card_suspend
    target: card_accounts
    mutation: {transition: {from: active, to: suspended}}
    meaning: "Charging privileges are suspended for delinquency."
    grain: "One row per suspension."
    fields:
      status: "Set to suspended."
    triggers: []
  - type: card_restore
    target: card_accounts
    mutation: {transition: {from: suspended, to: active}}
    meaning: "A suspended account brought current regains charging privileges."
    grain: "One row per restoration."
    fields:
      status: "Set to active."
      days_past_due: "Reset to 0."
    triggers: []
  - type: card_charge_off
    target: card_accounts
    mutation: {transition: {from: suspended, to: charged_off}}
    meaning: "The balance of a seriously delinquent account is charged off."
    grain: "One row per charge-off."
    fields:
      status: "Set to charged_off."
    triggers:
      - event: "card:card_rewards_forfeit"
        map: {adjustment_reason: none}
  - type: card_close
    target: card_accounts
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}, {from: charged_off, to: closed}]}
    meaning: "The account is closed at the cardholder's confirmed request, or administratively after charge-off; any balance stays payable."
    grain: "One row per closure."
    fields:
      status: "Set to closed."
      closed_date: "Date the account closed."
      autopay_option: "Unchanged while a balance remains; set to none once the balance is zero."
    triggers: []
  - type: card_change_limit
    target: card_accounts
    mutation: update
    meaning: "The credit limit is increased or decreased."
    grain: "One row per limit change."
    fields:
      credit_limit: "The new credit limit."
      last_limit_increase_date: "Date of this change when it is an increase; unchanged for a decrease."
    triggers: []
  - type: card_reprice
    target: card_accounts
    mutation: update
    meaning: "The account's APRs change because the penalty APR is applied or removed or the military rate cap starts or ends."
    grain: "One row per repricing."
    fields:
      purchase_apr: "New purchase APR."
      cash_advance_apr: "New cash advance APR."
      penalty_apr_active: "Whether the penalty APR now applies."
      scra_rate_cap_active: "Whether the military rate cap now applies."
    triggers: []
  - type: card_set_autopay
    target: card_accounts
    mutation: update
    meaning: "The cardholder's automatic payment instruction is set, changed or cancelled."
    grain: "One row per autopay change."
    fields:
      autopay_option: "none, minimum_due, statement_balance or fixed_amount."
      autopay_amount: "Fixed monthly amount for fixed_amount, otherwise 0.00."
      autopay_source_account_id: "PCB checking account paying the card, or empty."
    triggers: []
  - type: card_product_change
    target: card_accounts
    mutation: update
    meaning: "The account moves to another card tier, including graduation of a secured card, keeping its history and balance."
    grain: "One row per tier change."
    fields:
      variant_name: "Official name of the new tier."
      secured_deposit_amount: "Set to 0.00 when a secured card graduates; unchanged otherwise."
    triggers: []
  # ---------------- ledger writes (card_transactions) ----------------
  - type: card_purchase
    target: card_transactions
    meaning: "A purchase posts to the card."
    grain: "One row per purchase, identified by its network reference number."
    distinguish_by: [reference_number]
    fields:
      amount: "Purchase amount in USD, positive."
      posted_date: "Date the purchase posted."
      transaction_date: "Date the purchase was made."
      merchant: "Merchant name as printed on the statement."
      merchant_category: "Merchant category used for rewards."
      foreign_transaction: "Whether made outside the United States or in a foreign currency."
      reference_number: "Network reference number of the purchase."
      statement_cycle: "Statement cycle the purchase posted in."
      statement_date: "Closing date of the statement on which the purchase first appears."
    account: card_balance_owed
    direction: in
    triggers: []
  - type: card_cash_advance
    target: card_transactions
    meaning: "A cash advance posts: ATM cash, a bank-counter advance or a cash-equivalent transaction."
    grain: "One row per cash advance, identified by its reference number."
    distinguish_by: [reference_number]
    fields:
      amount: "Advance amount, positive."
      posted_date: "Date posted."
      transaction_date: "Date made."
      merchant: "ATM or merchant description."
      reference_number: "Network reference number."
      statement_cycle: "Statement cycle posted in."
      statement_date: "Closing date of the statement on which it first appears."
    account: card_balance_owed
    direction: in
    triggers:
      - event: "card:card_fee"
        map: {fee_code: cash_advance, source_item_id: card_txn_id, posted_date: posted_date, statement_cycle: statement_cycle}
  - type: card_balance_transfer
    target: card_transactions
    meaning: "A balance from another lender is paid off and moved onto the card."
    grain: "One row per balance transfer, identified by its reference number."
    distinguish_by: [reference_number]
    fields:
      amount: "Amount transferred, positive."
      posted_date: "Date posted."
      merchant: "Name of the creditor paid off."
      reference_number: "Transfer reference number."
      statement_cycle: "Statement cycle posted in."
      statement_date: "Closing date of the statement on which it first appears."
    account: card_balance_owed
    direction: in
    triggers:
      - event: "card:card_fee"
        map: {fee_code: balance_transfer, source_item_id: card_txn_id, posted_date: posted_date, statement_cycle: statement_cycle}
  - type: card_fee
    target: card_transactions
    meaning: "A fee is billed to the card."
    grain: "One row per fee: per transaction for transaction fees, per statement for late and annual fees, per returned payment."
    distinguish_by: [fee_code, source_item_id, statement_cycle]
    fields:
      amount: "Fee amount, positive."
      posted_date: "Date posted."
      fee_code: "Which fee this is."
      source_item_id: "The transaction or returned payment that caused it; empty for late and annual fees."
      statement_cycle: "Statement cycle the fee belongs to."
    account: card_balance_owed
    direction: in
    triggers: []
  - type: card_interest_charge
    target: card_transactions
    meaning: "Interest is billed at statement close, one row per balance type."
    grain: "One row per account per statement cycle per balance type."
    distinguish_by: [statement_cycle, interest_type]
    fields:
      amount: "Interest billed, positive."
      posted_date: "Statement closing date."
      interest_type: "purchase, cash_advance, balance_transfer or penalty."
      statement_cycle: "Statement cycle billed."
    account: card_balance_owed
    direction: in
    triggers: []
  - type: card_payment
    target: card_transactions
    meaning: "A payment posts to the card."
    grain: "One row per payment, identified by its payment reference number."
    distinguish_by: [reference_number]
    fields:
      amount: "Payment amount, positive."
      posted_date: "Business day the payment was credited."
      payment_source: "Where the payment came from."
      reference_number: "Payment reference number."
      counterparty_account_id: "The PCB account paying, otherwise empty."
      statement_cycle: "Statement cycle the payment posted in."
    account: card_balance_owed
    direction: out
    triggers:
      - event: "checking:checking_debit"
        when: {payment_source: pcb_checking}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: card_account_id}
      - event: "savings:savings_withdrawal"
        when: {payment_source: pcb_savings}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: card_account_id}
  - type: card_payment_return
    target: card_transactions
    meaning: "A payment is returned unpaid by the paying bank and its credit is reversed."
    grain: "One row per returned payment."
    distinguish_by: [source_item_id]
    fields:
      amount: "Amount of the returned payment, positive."
      posted_date: "Date the return posted."
      source_item_id: "The payment returned."
      statement_cycle: "Statement cycle of the return."
    account: card_balance_owed
    direction: in
    triggers: []
  - type: card_merchant_credit
    target: card_transactions
    meaning: "A merchant refund posts to the card."
    grain: "One row per merchant credit, identified by its reference number."
    distinguish_by: [reference_number]
    fields:
      amount: "Credit amount, positive."
      posted_date: "Date posted."
      merchant: "Merchant issuing the credit."
      merchant_category: "Merchant category."
      reference_number: "Network reference number."
      source_item_id: "The original purchase when the network links it, otherwise empty."
      statement_cycle: "Statement cycle posted in."
    account: card_balance_owed
    direction: out
    triggers: []
  - type: card_fee_reversal
    target: card_transactions
    meaning: "A billed fee is reversed in full."
    grain: "One row per fee reversed; a fee is reversed at most once."
    distinguish_by: [source_item_id]
    fields:
      amount: "Amount reversed, equal to the fee."
      posted_date: "Date posted."
      fee_code: "Fee code of the reversed fee."
      source_item_id: "The fee reversed."
      adjustment_reason: "courtesy_waiver, bank_error or dispute_final."
      statement_cycle: "Statement cycle the reversal posted in."
    account: card_balance_owed
    direction: out
    triggers: []
  - type: card_interest_reversal
    target: card_transactions
    meaning: "Billed interest is reversed, in full or for the excess over the military rate cap."
    grain: "One row per interest charge reversed."
    distinguish_by: [source_item_id]
    fields:
      amount: "Amount reversed, positive."
      posted_date: "Date posted."
      source_item_id: "The interest charge reversed."
      adjustment_reason: "courtesy_waiver, bank_error or scra_benefit."
      statement_cycle: "Statement cycle the reversal posted in."
    account: card_balance_owed
    direction: out
    triggers: []
  - type: card_dispute_credit
    target: card_transactions
    meaning: "A temporary credit for a disputed charge, or the final credit when a dispute is resolved for the cardholder without an earlier temporary credit."
    grain: "One row per dispute per credit kind."
    distinguish_by: [card_dispute_id, adjustment_reason]
    fields:
      amount: "Credit amount, positive."
      posted_date: "Date posted."
      source_item_id: "The disputed charge."
      card_dispute_id: "The dispute."
      adjustment_reason: "dispute_provisional or dispute_final."
      statement_cycle: "Statement cycle the credit posted in."
    account: card_balance_owed
    direction: out
    triggers: []
  - type: card_dispute_rebill
    target: card_transactions
    meaning: "A temporary dispute credit is rebilled after the dispute was resolved against the cardholder."
    grain: "One row per dispute rebilled."
    distinguish_by: [card_dispute_id]
    fields:
      amount: "Amount rebilled, positive."
      posted_date: "Date posted."
      source_item_id: "The temporary credit rebilled."
      card_dispute_id: "The dispute."
      statement_cycle: "Statement cycle the rebill posted in."
    account: card_balance_owed
    direction: in
    triggers: []
  - type: card_rewards_earn
    target: card_transactions
    meaning: "Rewards points are earned on a purchase."
    grain: "One row per purchase earning points."
    distinguish_by: [source_item_id]
    fields:
      reward_points: "Points earned."
      posted_date: "Date the points posted, the purchase's posted date."
      source_item_id: "The purchase that earned them."
      statement_cycle: "Statement cycle posted in."
    account: card_rewards
    direction: in
    triggers: []
  - type: card_rewards_redeem
    target: card_transactions
    meaning: "The cardholder redeems points."
    grain: "One row per redemption."
    distinguish_by: [posted_date, redemption_type, reward_points]
    fields:
      reward_points: "Points redeemed."
      amount: "USD value delivered by the redemption."
      posted_date: "Date of the redemption."
      redemption_type: "How the points were used."
      counterparty_account_id: "The PCB account receiving a deposit redemption, otherwise empty."
      statement_cycle: "Statement cycle of the redemption."
    account: card_rewards
    direction: out
    triggers:
      - event: "card:card_rewards_credit"
        when: {redemption_type: statement_credit}
        map: {amount: amount, posted_date: posted_date, source_item_id: card_txn_id, statement_cycle: statement_cycle}
      - event: "checking:checking_deposit"
        when: {redemption_type: deposit_to_checking}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: card_account_id}
      - event: "savings:savings_deposit"
        when: {redemption_type: deposit_to_savings}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: card_account_id}
  - type: card_rewards_credit
    target: card_transactions
    meaning: "A statement-credit redemption lowers the card balance."
    grain: "One row per statement-credit redemption."
    distinguish_by: [source_item_id]
    fields:
      amount: "Credit amount, positive."
      posted_date: "Date posted."
      source_item_id: "The redemption that funded it."
      statement_cycle: "Statement cycle posted in."
    account: card_balance_owed
    direction: out
    triggers: []
  - type: card_rewards_forfeit
    target: card_transactions
    meaning: "Points are removed: all points on closure, charge-off or serious delinquency, or the points earned on a purchase later refunded."
    grain: "One row per forfeiture occasion or per refunded purchase clawed back."
    distinguish_by: [source_item_id, posted_date]
    fields:
      reward_points: "Points removed."
      posted_date: "Date removed."
      source_item_id: "For a clawback, the merchant credit that caused it; empty for a full forfeiture."
      adjustment_reason: "none."
      statement_cycle: "Statement cycle of the removal."
    account: card_rewards
    direction: out
    triggers: []

measures:
  - id: card_msr_prior_late_fees
    window: "The late_fee_repeat_lookback_cycles statement cycles immediately preceding the cycle being billed."
    measure: "Count of card_fee rows with fee_code late_payment and no card_fee_reversal row referencing them, in those cycles."
  - id: card_msr_consecutive_on_time
    window: "Statements counted backward from the most recent due date before the frozen date."
    measure: "Number of consecutive statements, most recent first, for which payments and credits posted from the statement closing date through its due date totalled at least that statement's minimum_payment_due; the count stops at the first statement that fails."
  - id: card_msr_late_fee_courtesy_365d
    window: "Rolling 365 calendar days ending on the frozen date, inclusive."
    measure: "Count of card_fee_reversal rows with fee_code late_payment and adjustment_reason courtesy_waiver on all of the customer's card accounts."
  - id: card_msr_trailing_interest_courtesy_365d
    window: "Rolling 365 calendar days ending on the frozen date, inclusive."
    measure: "Count of card_interest_reversal rows with adjustment_reason courtesy_waiver on all of the customer's card accounts."
  - id: card_msr_paid_in_full_by_due
    window: "From the prior statement's closing date through that statement's payment due date."
    measure: "Whether card_payment, card_merchant_credit and card_dispute_credit rows posted in the window total at least that prior statement's last_statement_balance."
  - id: card_msr_quarter_bonus_spend
    window: "The calendar quarter containing the purchase's posted_date."
    measure: "Sum of amount over card_purchase rows in the tier's bonus categories posted in the quarter before this purchase, net of merchant credits on those purchases."
  - id: card_msr_cycle_cash_advances
    window: "The current statement cycle, by posted_date."
    measure: "Sum of amount over card_cash_advance rows."
  - id: card_msr_combined_credit_lines
    window: "The frozen date."
    measure: "Sum of credit_limit over all of the customer's card accounts whose status is applied, active or suspended."

policies:
  - id: card_agg_multi_holding
    subject: [card_open]
    rule: >-
      A customer may hold more than one PCB credit card, but never two of the same tier. The count of the
      customer's card accounts in applied, active or suspended status must be below max_per_customer before a new
      application is recorded. The customer may not hold another card of the requested tier in applied, active or
      suspended status. A customer with any card account in charged_off status cannot open a new card. Closed
      accounts do not count.
    eligibility:
      - id: portfolio_cap
        applies_to: [card_open]
        kind: authorization
        condition: "The count of the customer's card accounts in applied, active or suspended status must be below max_per_customer before a new application is recorded."
        evidence_fields: [card_accounts.customer_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.customer_id]]
          action_bindings: {card_accounts.customer_id: customer_id}
      - id: one_per_tier
        applies_to: [card_open]
        kind: dedup
        condition: "The customer may not hold another card of the requested tier in applied, active or suspended status."
        evidence_fields: [card_accounts.customer_id, card_accounts.variant_name, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.customer_id, card_accounts.variant_name]]
          action_bindings: {card_accounts.customer_id: customer_id, card_accounts.variant_name: variant_name}
        dedup_contract:
          table: card_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [applied, active, suspended]}
          distinct_fields: []
      - id: no_charge_off
        applies_to: [card_open]
        kind: authorization
        condition: "A customer with any card account in charged_off status cannot open a new card."
        evidence_fields: [card_accounts.customer_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.customer_id]]
          action_bindings: {card_accounts.customer_id: customer_id}
    params:
      max_per_customer: 3

  - id: card_agg_combined_credit_lines
    subject: [card_open, card_approve, card_change_limit]
    rule: >-
      Credit lines are aggregated across all of a customer's PCB cards. The customer's combined credit lines, measured
      by card_msr_combined_credit_lines including the requested or new limit, must not exceed combined_credit_line_cap,
      or private_client_combined_credit_line_cap when the customer holds an active Private Client Checking account. An
      approval or increase that would breach the cap is limited to the remaining headroom, and is declined when that
      headroom is below the tier's credit_limit_min for an approval or zero for an increase. Decreases are never
      limited by the cap. Secured card limits count toward the cap like any other line.
    eligibility:
      - id: combined_cap
        applies_to: [card_approve, card_change_limit]
        kind: authorization
        condition: "The customer's combined credit lines, measured by card_msr_combined_credit_lines including the requested or new limit, must not exceed combined_credit_line_cap, or private_client_combined_credit_line_cap when the customer holds an active Private Client Checking account."
        evidence_fields: [card_accounts.customer_id, card_accounts.credit_limit, card_accounts.status, checking_accounts.customer_id, checking_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.customer_id]]
          action_bindings: {card_accounts.customer_id: customer_id}
    params:
      combined_credit_line_cap: 75000.00
      private_client_combined_credit_line_cap: 150000.00
    measures: [card_msr_combined_credit_lines]

  - id: card_application_and_underwriting
    subject: [card_open, card_approve, card_decline, card_product_change]
    rule: >-
      An application records the requested tier; the applicant's age in whole years on the application date, from the
      date of birth on the customer profile, must be at least age_min_to_open and, where set, no more than
      age_max_to_open. The applicant's age must meet the tier's age limits on the application date. Visa Infinite
      Private Client requires an active Private Client Checking account held by the applicant. Secured Visa requires a
      security deposit of at least secured_deposit_min, and its credit limit always equals the deposit held. Approval
      and decline are underwriting decisions made by the credit system; the agent never decides them. An approved
      limit lies between credit_limit_min and credit_limit_max and the purchase APR between purchase_apr_min and
      purchase_apr_max; cash_advance_apr is the tier's. On tiers offering an introductory balance transfer APR,
      bt_intro_end_date is the statement closing date in the balance_transfer_intro_months-th cycle after opening. A
      secured card is reviewed at secured_graduation_review_months after opening and graduates into
      secured_graduation_target_tier when the last six statements were all paid on time by card_msr_consecutive_on_time;
      on graduation the security deposit is returned to a PCB account of the customer or by official check and the
      credit limit is kept. Other tier changes at the cardholder's request are allowed between tiers of the same
      rewards_program only, never into or out of Secured Visa, and keep the limit, APR and balance.
    eligibility:
      - id: age_limits
        applies_to: [card_open]
        kind: authorization
        condition: "The applicant's age must meet the tier's age limits on the application date."
        evidence_fields: [customers.customer_id, customers.date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
      - id: infinite_needs_private_client
        applies_to: [card_open]
        kind: authorization
        condition: "Visa Infinite Private Client requires an active Private Client Checking account held by the applicant."
        evidence_fields: [checking_accounts.customer_id, checking_accounts.variant_name, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.customer_id]]
          action_bindings: {checking_accounts.customer_id: customer_id}
    params:
      per_tier:
        Secured Visa: {min_age: "=age_min_to_open", max_age: "=age_max_to_open", limit_min: "=credit_limit_min", limit_max: "=credit_limit_max", apr_min: "=purchase_apr_min", apr_max: "=purchase_apr_max", deposit_min: "=secured_deposit_min", graduation_months: "=secured_graduation_review_months", graduation_tier: "=secured_graduation_target_tier"}
        College Rewards Visa: {min_age: "=age_min_to_open", max_age: "=age_max_to_open", limit_min: "=credit_limit_min", limit_max: "=credit_limit_max", apr_min: "=purchase_apr_min", apr_max: "=purchase_apr_max", deposit_min: "=secured_deposit_min", graduation_months: "=secured_graduation_review_months", graduation_tier: "=secured_graduation_target_tier"}
        Platinum Low Rate Visa: {min_age: "=age_min_to_open", max_age: "=age_max_to_open", limit_min: "=credit_limit_min", limit_max: "=credit_limit_max", apr_min: "=purchase_apr_min", apr_max: "=purchase_apr_max", deposit_min: "=secured_deposit_min", graduation_months: "=secured_graduation_review_months", graduation_tier: "=secured_graduation_target_tier"}
        Cash Rewards Visa: {min_age: "=age_min_to_open", max_age: "=age_max_to_open", limit_min: "=credit_limit_min", limit_max: "=credit_limit_max", apr_min: "=purchase_apr_min", apr_max: "=purchase_apr_max", deposit_min: "=secured_deposit_min", graduation_months: "=secured_graduation_review_months", graduation_tier: "=secured_graduation_target_tier"}
        Travel Rewards Visa Signature: {min_age: "=age_min_to_open", max_age: "=age_max_to_open", limit_min: "=credit_limit_min", limit_max: "=credit_limit_max", apr_min: "=purchase_apr_min", apr_max: "=purchase_apr_max", deposit_min: "=secured_deposit_min", graduation_months: "=secured_graduation_review_months", graduation_tier: "=secured_graduation_target_tier"}
        Visa Infinite Private Client: {min_age: "=age_min_to_open", max_age: "=age_max_to_open", limit_min: "=credit_limit_min", limit_max: "=credit_limit_max", apr_min: "=purchase_apr_min", apr_max: "=purchase_apr_max", deposit_min: "=secured_deposit_min", graduation_months: "=secured_graduation_review_months", graduation_tier: "=secured_graduation_target_tier"}
    measures: [card_msr_consecutive_on_time]

  - id: card_evt_purchases_and_cash
    subject: [card_purchase, card_cash_advance, card_balance_transfer, card_fee]
    rule: >-
      Purchases are authorized only on an active account and only while the balance after the purchase stays within
      the credit limit increased by over_limit_tolerance_pct percent; no over-limit fee is ever charged. Charges post
      only to an account whose status is active. Cash advances posted in a statement cycle, measured by
      card_msr_cycle_cash_advances, may not exceed cash_advance_limit_pct percent of the credit limit. Each cash advance
      incurs a cash advance fee equal to the greater of cash_advance_fee_pct percent of the advance, rounded half-up to
      the cent, and cash_advance_fee_min. Balance transfers are accepted only where balance_transfer_allowed is true and
      each incurs a fee equal to the greater of balance_transfer_fee_pct percent of the transfer, rounded half-up to the
      cent, and balance_transfer_fee_min. A purchase with foreign_transaction true incurs foreign_transaction_fee_pct
      percent of its amount, rounded half-up to the cent, as fee_code foreign_transaction; a tier percentage of 0.00
      writes no row. Transaction fees carry the transaction as source_item_id and the same statement_cycle. A balance
      transfer posted within balance_transfer_intro_window_days calendar days after opening carries the introductory
      APR until bt_intro_end_date; one posted later carries the purchase APR. Cash advances and balance transfers never
      earn rewards.
    eligibility:
      - id: active_to_charge
        applies_to: [card_purchase, card_cash_advance, card_balance_transfer]
        kind: state
        condition: "Charges post only to an account whose status is active."
        evidence_fields: [card_accounts.card_account_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.card_account_id]]
          action_bindings: {card_accounts.card_account_id: card_account_id}
        state_contract:
          field: card_accounts.status
          allowed: [active]
    formula:
      cash_advance_fee: "max(round(amount * cash_advance_fee_pct / 100, 2), cash_advance_fee_min)"
      foreign_fee: "round(amount * foreign_transaction_fee_pct / 100, 2)"
    params:
      per_tier:
        Secured Visa: {ca_pct: "=cash_advance_fee_pct", ca_min: "=cash_advance_fee_min", ca_limit: "=cash_advance_limit_pct", bt_ok: "=balance_transfer_allowed", bt_pct: "=balance_transfer_fee_pct", bt_min: "=balance_transfer_fee_min", bt_window: "=balance_transfer_intro_window_days", ftf: "=foreign_transaction_fee_pct", tolerance: "=over_limit_tolerance_pct"}
        College Rewards Visa: {ca_pct: "=cash_advance_fee_pct", ca_min: "=cash_advance_fee_min", ca_limit: "=cash_advance_limit_pct", bt_ok: "=balance_transfer_allowed", bt_pct: "=balance_transfer_fee_pct", bt_min: "=balance_transfer_fee_min", bt_window: "=balance_transfer_intro_window_days", ftf: "=foreign_transaction_fee_pct", tolerance: "=over_limit_tolerance_pct"}
        Platinum Low Rate Visa: {ca_pct: "=cash_advance_fee_pct", ca_min: "=cash_advance_fee_min", ca_limit: "=cash_advance_limit_pct", bt_ok: "=balance_transfer_allowed", bt_pct: "=balance_transfer_fee_pct", bt_min: "=balance_transfer_fee_min", bt_window: "=balance_transfer_intro_window_days", ftf: "=foreign_transaction_fee_pct", tolerance: "=over_limit_tolerance_pct"}
        Cash Rewards Visa: {ca_pct: "=cash_advance_fee_pct", ca_min: "=cash_advance_fee_min", ca_limit: "=cash_advance_limit_pct", bt_ok: "=balance_transfer_allowed", bt_pct: "=balance_transfer_fee_pct", bt_min: "=balance_transfer_fee_min", bt_window: "=balance_transfer_intro_window_days", ftf: "=foreign_transaction_fee_pct", tolerance: "=over_limit_tolerance_pct"}
        Travel Rewards Visa Signature: {ca_pct: "=cash_advance_fee_pct", ca_min: "=cash_advance_fee_min", ca_limit: "=cash_advance_limit_pct", bt_ok: "=balance_transfer_allowed", bt_pct: "=balance_transfer_fee_pct", bt_min: "=balance_transfer_fee_min", bt_window: "=balance_transfer_intro_window_days", ftf: "=foreign_transaction_fee_pct", tolerance: "=over_limit_tolerance_pct"}
        Visa Infinite Private Client: {ca_pct: "=cash_advance_fee_pct", ca_min: "=cash_advance_fee_min", ca_limit: "=cash_advance_limit_pct", bt_ok: "=balance_transfer_allowed", bt_pct: "=balance_transfer_fee_pct", bt_min: "=balance_transfer_fee_min", bt_window: "=balance_transfer_intro_window_days", ftf: "=foreign_transaction_fee_pct", tolerance: "=over_limit_tolerance_pct"}
    measures: [card_msr_cycle_cash_advances]

  - id: card_evt_interest
    subject: [card_interest_charge, card_interest_reversal]
    rule: >-
      Interest is computed by the average daily balance method, including new transactions, separately for purchase,
      cash advance, balance transfer and penalty balances, at each balance's APR divided by interest_day_count_basis,
      and billed at statement close as one card_interest_charge row per balance type that is above 0.00. Purchases
      carry a grace period: no purchase interest is billed for a cycle when card_msr_paid_in_full_by_due shows the prior
      statement balance was paid in full by its due date; otherwise purchase interest accrues from each purchase's
      posted date. Cash advances accrue from their posted date with no grace period. Balance transfers accrue at the
      introductory APR through bt_intro_end_date and at the purchase APR afterwards. When any interest is due for a
      cycle but the total is below minimum_interest_charge, the minimum_interest_charge is billed instead, allocated to
      the purchase balance type. Residual interest billed on the statement after the cardholder paid a statement
      balance in full, for the days between that statement's closing date and the payment date, may be reversed in
      full once per trailing_interest_courtesy_per_365d, counted by card_msr_trailing_interest_courtesy_365d across the
      customer's cards, as a card_interest_reversal with adjustment_reason courtesy_waiver. A courtesy reversal of
      residual interest requires that the statement balance it follows was paid in full. Interest billed at a rate or
      on a balance contrary to this charter is reversed with adjustment_reason bank_error without limit. An interest
      charge can be reversed at most once.
    eligibility:
      - id: trailing_limit
        applies_to: [card_interest_reversal]
        kind: authorization
        condition: "A courtesy reversal of residual interest requires that the statement balance it follows was paid in full."
        evidence_fields: [card_transactions.card_account_id, card_transactions.event_type, card_transactions.amount, card_accounts.last_statement_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_transactions.card_account_id]]
          action_bindings: {card_transactions.card_account_id: card_account_id}
      - id: reverse_once
        applies_to: [card_interest_reversal]
        kind: dedup
        condition: "An interest charge can be reversed at most once."
        evidence_fields: [card_transactions.source_item_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_transactions.source_item_id]]
          action_bindings: {card_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [card_interest_reversal]}
          distinct_fields: []
    params:
      interest_day_count_basis: 365
      per_tier:
        Secured Visa: {min_charge: "=minimum_interest_charge", courtesy: "=trailing_interest_courtesy_per_365d", cash_apr: "=cash_advance_apr"}
        College Rewards Visa: {min_charge: "=minimum_interest_charge", courtesy: "=trailing_interest_courtesy_per_365d", cash_apr: "=cash_advance_apr"}
        Platinum Low Rate Visa: {min_charge: "=minimum_interest_charge", courtesy: "=trailing_interest_courtesy_per_365d", cash_apr: "=cash_advance_apr"}
        Cash Rewards Visa: {min_charge: "=minimum_interest_charge", courtesy: "=trailing_interest_courtesy_per_365d", cash_apr: "=cash_advance_apr"}
        Travel Rewards Visa Signature: {min_charge: "=minimum_interest_charge", courtesy: "=trailing_interest_courtesy_per_365d", cash_apr: "=cash_advance_apr"}
        Visa Infinite Private Client: {min_charge: "=minimum_interest_charge", courtesy: "=trailing_interest_courtesy_per_365d", cash_apr: "=cash_advance_apr"}
    measures: [card_msr_paid_in_full_by_due, card_msr_trailing_interest_courtesy_365d]

  - id: card_evt_payments
    subject: [card_payment, card_set_autopay]
    rule: >-
      A payment received by payment_cutoff_time Eastern Time on a business day is credited that day; one received later,
      or on a weekend or Federal Reserve holiday, is credited the next business day. When a payment due date falls on a
      day the bank does not accept mail or process payments, a payment credited on the next business day is on time.
      The minimum payment due on a statement is the greater of minimum_payment_floor and minimum_payment_pct percent of
      the new statement balance plus the interest and fees billed on that statement, rounded half-up to the cent, but
      never more than the statement balance; a statement balance of 0.00 or below has no minimum. Payments are allocated
      in a fixed order: the part up to the minimum payment goes to the balance type with the lowest APR first, and any
      amount above the minimum goes to the balance type with the highest APR first, then the next highest, as the CARD
      Act requires. A payment larger than the balance creates a credit balance that is refunded on request. Automatic
      payment debits the named PCB checking account on the due date for the minimum due, the statement balance, or a
      fixed amount but never more than the statement balance. The autopay source account must be a checking account of
      the same customer in active status. Setting up or changing autopay is the cardholder's own instruction; cancelling
      takes effect for due dates at least autopay_change_lead_days calendar days after the change is recorded.
    eligibility:
      - id: autopay_source
        applies_to: [card_set_autopay]
        kind: authorization
        condition: "The autopay source account must be a checking account of the same customer in active status."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.customer_id, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: autopay_source_account_id}
    formula:
      minimum_due: "min(max(minimum_payment_floor, round(last_statement_balance * minimum_payment_pct / 100, 2)), last_statement_balance)"
    params:
      payment_cutoff_time: "17:00"
      autopay_change_lead_days: 3
      per_tier:
        Secured Visa: {min_pct: "=minimum_payment_pct", min_floor: "=minimum_payment_floor", due_days: "=payment_due_days_after_close"}
        College Rewards Visa: {min_pct: "=minimum_payment_pct", min_floor: "=minimum_payment_floor", due_days: "=payment_due_days_after_close"}
        Platinum Low Rate Visa: {min_pct: "=minimum_payment_pct", min_floor: "=minimum_payment_floor", due_days: "=payment_due_days_after_close"}
        Cash Rewards Visa: {min_pct: "=minimum_payment_pct", min_floor: "=minimum_payment_floor", due_days: "=payment_due_days_after_close"}
        Travel Rewards Visa Signature: {min_pct: "=minimum_payment_pct", min_floor: "=minimum_payment_floor", due_days: "=payment_due_days_after_close"}
        Visa Infinite Private Client: {min_pct: "=minimum_payment_pct", min_floor: "=minimum_payment_floor", due_days: "=payment_due_days_after_close"}

  - id: card_evt_late_and_returned_payment_fees
    subject: [card_fee, card_payment_return]
    rule: >-
      A late fee is billed when payments and credits posted from the statement closing date through the payment due date
      total less than that statement's minimum_payment_due. The amount is late_fee_repeat when
      card_msr_prior_late_fees finds an unreversed late fee in the preceding late_fee_repeat_lookback_cycles cycles, and
      late_fee_first otherwise, but never more than the minimum_payment_due that was missed. It is written as fee_code
      late_payment for the statement_cycle whose due date was missed. A statement with no minimum payment due never
      incurs a late fee. At most one late fee is billed per statement. A payment returned unpaid reverses its credit
      through a card_payment_return row and incurs returned_payment_fee as fee_code returned_payment with the returned
      payment as source_item_id, never more than the minimum payment due on the statement it was meant to pay. Only one
      of the late fee and the returned payment fee may be billed for the same missed minimum payment: when the return
      makes the payment late, only the late fee is billed.
    eligibility:
      - id: one_late_fee_per_statement
        applies_to: [card_fee]
        kind: dedup
        condition: "At most one late fee is billed per statement."
        evidence_fields: [card_transactions.card_account_id, card_transactions.statement_cycle, card_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_transactions.card_account_id, card_transactions.statement_cycle]]
          action_bindings: {card_transactions.card_account_id: card_account_id, card_transactions.statement_cycle: statement_cycle}
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {card_account_id: card_account_id, statement_cycle: statement_cycle}
          duplicate_filters: {event_type: [card_fee], fee_code: [late_payment]}
          distinct_fields: []
    params:
      per_tier:
        Secured Visa: {first: "=late_fee_first", repeat: "=late_fee_repeat", lookback: "=late_fee_repeat_lookback_cycles", returned: "=returned_payment_fee"}
        College Rewards Visa: {first: "=late_fee_first", repeat: "=late_fee_repeat", lookback: "=late_fee_repeat_lookback_cycles", returned: "=returned_payment_fee"}
        Platinum Low Rate Visa: {first: "=late_fee_first", repeat: "=late_fee_repeat", lookback: "=late_fee_repeat_lookback_cycles", returned: "=returned_payment_fee"}
        Cash Rewards Visa: {first: "=late_fee_first", repeat: "=late_fee_repeat", lookback: "=late_fee_repeat_lookback_cycles", returned: "=returned_payment_fee"}
        Travel Rewards Visa Signature: {first: "=late_fee_first", repeat: "=late_fee_repeat", lookback: "=late_fee_repeat_lookback_cycles", returned: "=returned_payment_fee"}
        Visa Infinite Private Client: {first: "=late_fee_first", repeat: "=late_fee_repeat", lookback: "=late_fee_repeat_lookback_cycles", returned: "=returned_payment_fee"}
    measures: [card_msr_prior_late_fees]

  - id: card_evt_fee_reversal
    subject: [card_fee_reversal]
    rule: >-
      A fee is reversed in full, never in part, as one card_fee_reversal row whose source_item_id is the fee. A bank_error
      reversal applies to any fee billed contrary to this charter, such as a late fee when the minimum was paid on time
      under the payment crediting rules, a late fee above the missed minimum, both a late and a returned payment fee for
      one missed payment, or an annual fee that the first-year waiver or the military benefit excluded; it has no limit.
      A courtesy_waiver reversal applies only to a late_payment fee. The customer's courtesy late fee reversals in the
      rolling 365 days, counted by card_msr_late_fee_courtesy_365d across all of the customer's cards, must be below the
      tier's late_fee_courtesy_waivers_365d. The payment history immediately before the late statement must show at least
      late_fee_courtesy_min_prior_on_time consecutive on-time payments, counted by card_msr_consecutive_on_time. The
      account must be active or suspended when a courtesy reversal is granted. A fee can be reversed at most once. When a
      dispute is resolved for the cardholder, fees billed on the disputed charge are reversed with adjustment_reason
      dispute_final.
    eligibility:
      - id: courtesy_count
        applies_to: [card_fee_reversal]
        kind: authorization
        condition: "The customer's courtesy late fee reversals in the rolling 365 days, counted by card_msr_late_fee_courtesy_365d across all of the customer's cards, must be below the tier's late_fee_courtesy_waivers_365d."
        evidence_fields: [card_transactions.customer_id, card_transactions.adjustment_reason, card_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_transactions.customer_id]]
          action_bindings: {card_transactions.customer_id: customer_id}
      - id: prior_on_time
        applies_to: [card_fee_reversal]
        kind: authorization
        condition: "The payment history immediately before the late statement must show at least late_fee_courtesy_min_prior_on_time consecutive on-time payments, counted by card_msr_consecutive_on_time."
        evidence_fields: [card_transactions.card_account_id, card_transactions.event_type, card_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_transactions.card_account_id]]
          action_bindings: {card_transactions.card_account_id: card_account_id}
      - id: account_open_for_courtesy
        applies_to: [card_fee_reversal]
        kind: state
        condition: "The account must be active or suspended when a courtesy reversal is granted."
        evidence_fields: [card_accounts.card_account_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.card_account_id]]
          action_bindings: {card_accounts.card_account_id: card_account_id}
        state_contract:
          field: card_accounts.status
          allowed: [active, suspended]
      - id: reverse_once
        applies_to: [card_fee_reversal]
        kind: dedup
        condition: "A fee can be reversed at most once."
        evidence_fields: [card_transactions.source_item_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_transactions.source_item_id]]
          action_bindings: {card_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [card_fee_reversal]}
          distinct_fields: []
    params:
      per_tier:
        Secured Visa: {courtesy: "=late_fee_courtesy_waivers_365d", prior_on_time: "=late_fee_courtesy_min_prior_on_time"}
        College Rewards Visa: {courtesy: "=late_fee_courtesy_waivers_365d", prior_on_time: "=late_fee_courtesy_min_prior_on_time"}
        Platinum Low Rate Visa: {courtesy: "=late_fee_courtesy_waivers_365d", prior_on_time: "=late_fee_courtesy_min_prior_on_time"}
        Cash Rewards Visa: {courtesy: "=late_fee_courtesy_waivers_365d", prior_on_time: "=late_fee_courtesy_min_prior_on_time"}
        Travel Rewards Visa Signature: {courtesy: "=late_fee_courtesy_waivers_365d", prior_on_time: "=late_fee_courtesy_min_prior_on_time"}
        Visa Infinite Private Client: {courtesy: "=late_fee_courtesy_waivers_365d", prior_on_time: "=late_fee_courtesy_min_prior_on_time"}
    measures: [card_msr_late_fee_courtesy_365d, card_msr_consecutive_on_time]

  - id: card_evt_annual_fee
    subject: [card_fee]
    rule: >-
      The tier's annual_fee is billed as fee_code annual on the statement that closes in the account's anniversary
      month each year, the anniversary month being the month of opened_date. When annual_fee_waived_first_year is true
      no annual fee is billed on the first anniversary-month statement after opening that falls within twelve months of
      opened_date. No annual fee is billed while scra_rate_cap_active is true. A tier whose annual_fee is 0.00 writes no
      row. At most one annual fee is billed per account year. When the cardholder closes the account within
      annual_fee_refund_window_days calendar days after the annual fee posted, the fee is reversed in full with
      adjustment_reason bank_error; after that window it is never refunded or prorated.
    eligibility:
      - id: once_per_year
        applies_to: [card_fee]
        kind: dedup
        condition: "At most one annual fee is billed per account year."
        evidence_fields: [card_transactions.card_account_id, card_transactions.fee_code, card_transactions.statement_cycle]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_transactions.card_account_id, card_transactions.statement_cycle]]
          action_bindings: {card_transactions.card_account_id: card_account_id, card_transactions.statement_cycle: statement_cycle}
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {card_account_id: card_account_id, statement_cycle: statement_cycle}
          duplicate_filters: {event_type: [card_fee], fee_code: [annual]}
          distinct_fields: []
    params:
      annual_fee_refund_window_days: 30
      per_tier:
        Secured Visa: {fee: "=annual_fee", first_year_waived: "=annual_fee_waived_first_year"}
        College Rewards Visa: {fee: "=annual_fee", first_year_waived: "=annual_fee_waived_first_year"}
        Platinum Low Rate Visa: {fee: "=annual_fee", first_year_waived: "=annual_fee_waived_first_year"}
        Cash Rewards Visa: {fee: "=annual_fee", first_year_waived: "=annual_fee_waived_first_year"}
        Travel Rewards Visa Signature: {fee: "=annual_fee", first_year_waived: "=annual_fee_waived_first_year"}
        Visa Infinite Private Client: {fee: "=annual_fee", first_year_waived: "=annual_fee_waived_first_year"}

  - id: card_evt_penalty_and_military_rates
    subject: [card_reprice, card_interest_reversal]
    rule: >-
      The penalty APR replaces the purchase and cash advance APRs when a minimum payment remains unpaid
      penalty_apr_trigger_days_late days after its due date, measured by days_past_due; the account is repriced with
      penalty_apr_active true after the written notice period of penalty_notice_days calendar days. A tier whose
      penalty_apr is not_applicable never applies a penalty APR. The penalty APR is removed, restoring the APRs held
      before it, once card_msr_consecutive_on_time reaches penalty_apr_cure_on_time_payments after the penalty began.
      While the customer's military_status on the profile is active_duty, every APR on the account is capped at
      scra_apr_cap, the account is repriced with scra_rate_cap_active true, the penalty APR is suspended and no annual fee
      is billed; interest billed above the cap for any cycle after military_status became active_duty is reversed for
      the excess with adjustment_reason scra_benefit. The military rate cap applies only while the customer's
      military_status on the profile is active_duty. When active duty ends, the cap is removed and the pre-cap APRs
      return on the first statement after the change. The cap never raises an APR that is already below it.
    eligibility:
      - id: active_duty_on_file
        applies_to: [card_reprice, card_interest_reversal]
        kind: authorization
        condition: "The military rate cap applies only while the customer's military_status on the profile is active_duty."
        evidence_fields: [customers.customer_id, customers.military_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
    params:
      penalty_notice_days: 45
      per_tier:
        Secured Visa: {penalty_apr: "=penalty_apr", trigger_days: "=penalty_apr_trigger_days_late", cure: "=penalty_apr_cure_on_time_payments", scra_cap: "=scra_apr_cap"}
        College Rewards Visa: {penalty_apr: "=penalty_apr", trigger_days: "=penalty_apr_trigger_days_late", cure: "=penalty_apr_cure_on_time_payments", scra_cap: "=scra_apr_cap"}
        Platinum Low Rate Visa: {penalty_apr: "=penalty_apr", trigger_days: "=penalty_apr_trigger_days_late", cure: "=penalty_apr_cure_on_time_payments", scra_cap: "=scra_apr_cap"}
        Cash Rewards Visa: {penalty_apr: "=penalty_apr", trigger_days: "=penalty_apr_trigger_days_late", cure: "=penalty_apr_cure_on_time_payments", scra_cap: "=scra_apr_cap"}
        Travel Rewards Visa Signature: {penalty_apr: "=penalty_apr", trigger_days: "=penalty_apr_trigger_days_late", cure: "=penalty_apr_cure_on_time_payments", scra_cap: "=scra_apr_cap"}
        Visa Infinite Private Client: {penalty_apr: "=penalty_apr", trigger_days: "=penalty_apr_trigger_days_late", cure: "=penalty_apr_cure_on_time_payments", scra_cap: "=scra_apr_cap"}
    measures: [card_msr_consecutive_on_time]

  - id: card_evt_billing_disputes
    subject: [card_dispute_credit, card_dispute_rebill, card_merchant_credit]
    rule: >-
      A billing dispute is the cardholder's own claim about one posted purchase, cash advance or balance transfer; the
      agent registers it in card_disputes with dispute_status submitted and notice_date equal to the day the cardholder
      gave notice. The notice must be given within dispute_notice_window_days calendar days after the statement on which
      the charge first appeared. Count calendar days with the day after the charge's statement_date as day 1; the notice
      qualifies when notice_date is on or before statement_date plus dispute_notice_window_days. A temporary credit of the
      claimed amount, never more than the charge, is posted as a card_dispute_credit with adjustment_reason
      dispute_provisional on the day a qualifying dispute is registered. Only a dispute whose dispute_status is
      submitted can receive a temporary credit. Each dispute receives at most one temporary credit. While a dispute is
      open, the disputed amount is not counted toward the minimum payment and no late fee or interest accrues on it.
      When the dispute is resolved for the cardholder the temporary credit becomes final with no new row, or, if no
      temporary credit was posted, a final credit is posted with adjustment_reason dispute_final; fees and interest billed
      on the disputed charge are reversed. A temporary credit may be rebilled only when the dispute's dispute_status is
      resolved_cardholder_liable or withdrawn, for the full temporary credit, with the temporary credit as
      source_item_id. A merchant credit for the same purchase that posts while the dispute is open resolves it for the
      cardholder up to the credit amount; the temporary credit is then rebilled for the part the merchant credit
      covered. Disputes on fees, interest or payments are handled as fee or interest reversals, not here.
    eligibility:
      - id: notice_window
        applies_to: [card_dispute_credit]
        kind: time
        condition: "The notice must be given within dispute_notice_window_days calendar days after the statement on which the charge first appeared."
        evidence_fields: [card_transactions.card_txn_id, card_transactions.statement_date, card_disputes.disputed_txn_id, card_disputes.notice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_disputes.disputed_txn_id, card_transactions.card_txn_id]]
          action_bindings: {card_disputes.disputed_txn_id: source_item_id, card_transactions.card_txn_id: source_item_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the statement on which the charge first appeared"
          anchor_source: card_transactions.statement_date
          relation: not_after
          duration_source: variants.dispute_notice_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after the charge's statement_date as day 1; the notice qualifies when notice_date is on or before statement_date plus dispute_notice_window_days."
          boundary: inclusive
      - id: submitted_only
        applies_to: [card_dispute_credit]
        kind: state
        condition: "Only a dispute whose dispute_status is submitted can receive a temporary credit."
        evidence_fields: [card_disputes.card_dispute_id, card_disputes.dispute_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_disputes.card_dispute_id]]
          action_bindings: {card_disputes.card_dispute_id: card_dispute_id}
        state_contract:
          field: card_disputes.dispute_status
          allowed: [submitted]
      - id: one_temporary_credit
        applies_to: [card_dispute_credit]
        kind: dedup
        condition: "Each dispute receives at most one temporary credit."
        evidence_fields: [card_transactions.card_dispute_id, card_transactions.event_type, card_transactions.adjustment_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_transactions.card_dispute_id]]
          action_bindings: {card_transactions.card_dispute_id: card_dispute_id}
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {card_dispute_id: card_dispute_id}
          duplicate_filters: {event_type: [card_dispute_credit], adjustment_reason: [dispute_provisional]}
          distinct_fields: []
      - id: rebill_needs_liability
        applies_to: [card_dispute_rebill]
        kind: state
        condition: "A temporary credit may be rebilled only when the dispute's dispute_status is resolved_cardholder_liable or withdrawn, for the full temporary credit, with the temporary credit as source_item_id."
        evidence_fields: [card_disputes.card_dispute_id, card_disputes.dispute_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_disputes.card_dispute_id]]
          action_bindings: {card_disputes.card_dispute_id: card_dispute_id}
        state_contract:
          field: card_disputes.dispute_status
          allowed: [resolved_cardholder_liable, withdrawn]
    params:
      per_tier:
        Secured Visa: {notice_days: "=dispute_notice_window_days"}
        College Rewards Visa: {notice_days: "=dispute_notice_window_days"}
        Platinum Low Rate Visa: {notice_days: "=dispute_notice_window_days"}
        Cash Rewards Visa: {notice_days: "=dispute_notice_window_days"}
        Travel Rewards Visa Signature: {notice_days: "=dispute_notice_window_days"}
        Visa Infinite Private Client: {notice_days: "=dispute_notice_window_days"}

  - id: card_evt_rewards
    subject: [card_rewards_earn, card_rewards_redeem, card_rewards_credit, card_rewards_forfeit]
    rule: >-
      Only tiers whose rewards_program is not none earn points. Each posted purchase earns points on its whole-dollar
      amount, fractions of a dollar dropped: rewards_bonus_rate per dollar when its merchant_category is in
      rewards_bonus_categories and card_msr_quarter_bonus_spend is still below rewards_bonus_quarterly_spend_cap, the
      part above the cap earning rewards_base_rate, and rewards_base_rate per dollar otherwise; points are rounded down to
      whole points. Cash advances, balance transfers, fees and interest never earn. A merchant credit claws back the
      points its purchase earned, in proportion to the credit, as a card_rewards_forfeit row with the merchant credit as
      source_item_id. Points are redeemed only in whole points, at least rewards_redemption_minimum_points per
      redemption, by one of rewards_redemption_types: a statement credit, a deposit to a PCB checking or savings account
      of the same customer, or a gift card, each at rewards_point_value_cash per point, or travel booked through the
      rewards center at rewards_point_value_travel per point; the USD value is points times value, rounded half-up to the
      cent. Redemption is allowed only while the account is active. All unredeemed points are forfeited when the account
      reaches rewards_forfeit_days_past_due days past due, when it is charged off, and when it closes, so a cardholder
      closing the card must redeem before the closure is confirmed. Points never expire otherwise.
    eligibility:
      - id: redeem_while_active
        applies_to: [card_rewards_redeem]
        kind: state
        condition: "Redemption is allowed only while the account is active."
        evidence_fields: [card_accounts.card_account_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.card_account_id]]
          action_bindings: {card_accounts.card_account_id: card_account_id}
        state_contract:
          field: card_accounts.status
          allowed: [active]
    formula:
      redemption_value: "round(reward_points * rewards_point_value_cash, 2)"
    params:
      per_tier:
        Secured Visa: {program: "=rewards_program", base: "=rewards_base_rate", categories: "=rewards_bonus_categories", bonus: "=rewards_bonus_rate", cap: "=rewards_bonus_quarterly_spend_cap", min_points: "=rewards_redemption_minimum_points", cash_value: "=rewards_point_value_cash", travel_value: "=rewards_point_value_travel", types: "=rewards_redemption_types", forfeit_dpd: "=rewards_forfeit_days_past_due"}
        College Rewards Visa: {program: "=rewards_program", base: "=rewards_base_rate", categories: "=rewards_bonus_categories", bonus: "=rewards_bonus_rate", cap: "=rewards_bonus_quarterly_spend_cap", min_points: "=rewards_redemption_minimum_points", cash_value: "=rewards_point_value_cash", travel_value: "=rewards_point_value_travel", types: "=rewards_redemption_types", forfeit_dpd: "=rewards_forfeit_days_past_due"}
        Platinum Low Rate Visa: {program: "=rewards_program", base: "=rewards_base_rate", categories: "=rewards_bonus_categories", bonus: "=rewards_bonus_rate", cap: "=rewards_bonus_quarterly_spend_cap", min_points: "=rewards_redemption_minimum_points", cash_value: "=rewards_point_value_cash", travel_value: "=rewards_point_value_travel", types: "=rewards_redemption_types", forfeit_dpd: "=rewards_forfeit_days_past_due"}
        Cash Rewards Visa: {program: "=rewards_program", base: "=rewards_base_rate", categories: "=rewards_bonus_categories", bonus: "=rewards_bonus_rate", cap: "=rewards_bonus_quarterly_spend_cap", min_points: "=rewards_redemption_minimum_points", cash_value: "=rewards_point_value_cash", travel_value: "=rewards_point_value_travel", types: "=rewards_redemption_types", forfeit_dpd: "=rewards_forfeit_days_past_due"}
        Travel Rewards Visa Signature: {program: "=rewards_program", base: "=rewards_base_rate", categories: "=rewards_bonus_categories", bonus: "=rewards_bonus_rate", cap: "=rewards_bonus_quarterly_spend_cap", min_points: "=rewards_redemption_minimum_points", cash_value: "=rewards_point_value_cash", travel_value: "=rewards_point_value_travel", types: "=rewards_redemption_types", forfeit_dpd: "=rewards_forfeit_days_past_due"}
        Visa Infinite Private Client: {program: "=rewards_program", base: "=rewards_base_rate", categories: "=rewards_bonus_categories", bonus: "=rewards_bonus_rate", cap: "=rewards_bonus_quarterly_spend_cap", min_points: "=rewards_redemption_minimum_points", cash_value: "=rewards_point_value_cash", travel_value: "=rewards_point_value_travel", types: "=rewards_redemption_types", forfeit_dpd: "=rewards_forfeit_days_past_due"}
    measures: [card_msr_quarter_bonus_spend]

  - id: card_evt_credit_limit_changes
    subject: [card_change_limit]
    rule: >-
      A credit limit increase is requested by the cardholder, who must consent to a credit inquiry, and is available only
      where cli_min_months_since_open is not not_offered. The account must be active and not past due. At least
      cli_min_months_since_open whole months must have passed since the account was opened. Count calendar months from opened_date; the request
      is eligible when the frozen date is on or after opened_date plus cli_min_months_since_open calendar months. At least
      cli_min_months_between whole months must have passed since last_limit_increase_date when there is one. The new
      limit may exceed the current limit by at most cli_max_increase_pct percent, may not exceed credit_limit_max, and is
      subject to card_agg_combined_credit_lines. A decrease requested by the cardholder is allowed at any time on an
      active or suspended account down to the greater of credit_limit_min and the current balance rounded up to the next
      whole hundred dollars. Secured Visa limits change only by changing the security deposit, which is outside this
      policy.
    eligibility:
      - id: open_long_enough
        applies_to: [card_change_limit]
        kind: time
        condition: "At least cli_min_months_since_open whole months must have passed since the account was opened."
        evidence_fields: [card_accounts.card_account_id, card_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.card_account_id]]
          action_bindings: {card_accounts.card_account_id: card_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account was opened"
          anchor_source: card_accounts.opened_date
          relation: not_before
          duration_source: variants.cli_min_months_since_open
          unit: calendar_months
          counting_rule: "Count calendar months from opened_date; the request is eligible when the frozen date is on or after opened_date plus cli_min_months_since_open calendar months."
          boundary: inclusive
      - id: current_and_active
        applies_to: [card_change_limit]
        kind: authorization
        condition: "The account must be active and not past due."
        evidence_fields: [card_accounts.card_account_id, card_accounts.status, card_accounts.days_past_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.card_account_id]]
          action_bindings: {card_accounts.card_account_id: card_account_id}
    params:
      per_tier:
        Secured Visa: {min_months: "=cli_min_months_since_open", between: "=cli_min_months_between", max_pct: "=cli_max_increase_pct", ceiling: "=credit_limit_max", floor: "=credit_limit_min"}
        College Rewards Visa: {min_months: "=cli_min_months_since_open", between: "=cli_min_months_between", max_pct: "=cli_max_increase_pct", ceiling: "=credit_limit_max", floor: "=credit_limit_min"}
        Platinum Low Rate Visa: {min_months: "=cli_min_months_since_open", between: "=cli_min_months_between", max_pct: "=cli_max_increase_pct", ceiling: "=credit_limit_max", floor: "=credit_limit_min"}
        Cash Rewards Visa: {min_months: "=cli_min_months_since_open", between: "=cli_min_months_between", max_pct: "=cli_max_increase_pct", ceiling: "=credit_limit_max", floor: "=credit_limit_min"}
        Travel Rewards Visa Signature: {min_months: "=cli_min_months_since_open", between: "=cli_min_months_between", max_pct: "=cli_max_increase_pct", ceiling: "=credit_limit_max", floor: "=credit_limit_min"}
        Visa Infinite Private Client: {min_months: "=cli_min_months_since_open", between: "=cli_min_months_between", max_pct: "=cli_max_increase_pct", ceiling: "=credit_limit_max", floor: "=credit_limit_min"}

  - id: card_evt_delinquency
    subject: [card_suspend, card_restore, card_charge_off]
    rule: >-
      days_past_due counts calendar days since the earliest due date whose minimum payment remains unpaid, and resets to
      zero when all past-due minimums are paid. Charging privileges are suspended when days_past_due reaches
      suspension_days_past_due. A suspended account is restored to active when days_past_due returns to zero. The balance
      is charged off when days_past_due reaches chargeoff_days_past_due, which forfeits all rewards points; the balance
      remains owed and passes to recovery outside this charter. Payment arrangements, settlements and hardship programs
      for delinquent balances are outside this policy.
    eligibility:
      - id: suspension_threshold
        applies_to: [card_suspend]
        kind: authorization
        condition: "Charging privileges are suspended when days_past_due reaches suspension_days_past_due."
        evidence_fields: [card_accounts.card_account_id, card_accounts.days_past_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.card_account_id]]
          action_bindings: {card_accounts.card_account_id: card_account_id}
      - id: chargeoff_threshold
        applies_to: [card_charge_off]
        kind: authorization
        condition: "The balance is charged off when days_past_due reaches chargeoff_days_past_due, which forfeits all rewards points; the balance remains owed and passes to recovery outside this charter."
        evidence_fields: [card_accounts.card_account_id, card_accounts.days_past_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.card_account_id]]
          action_bindings: {card_accounts.card_account_id: card_account_id}
    params:
      per_tier:
        Secured Visa: {suspend_dpd: "=suspension_days_past_due", chargeoff_dpd: "=chargeoff_days_past_due"}
        College Rewards Visa: {suspend_dpd: "=suspension_days_past_due", chargeoff_dpd: "=chargeoff_days_past_due"}
        Platinum Low Rate Visa: {suspend_dpd: "=suspension_days_past_due", chargeoff_dpd: "=chargeoff_days_past_due"}
        Cash Rewards Visa: {suspend_dpd: "=suspension_days_past_due", chargeoff_dpd: "=chargeoff_days_past_due"}
        Travel Rewards Visa Signature: {suspend_dpd: "=suspension_days_past_due", chargeoff_dpd: "=chargeoff_days_past_due"}
        Visa Infinite Private Client: {suspend_dpd: "=suspension_days_past_due", chargeoff_dpd: "=chargeoff_days_past_due"}

  - id: card_closure
    subject: [card_close]
    rule: >-
      Closing a card is the cardholder's own decision: the agent registers a card_requests row of request_type
      account_closure in pending_customer_confirmation status, and the account closes only after the cardholder confirms.
      A balance does not prevent closure; it remains payable under the existing terms and minimum payments, and autopay
      continues until the balance reaches zero. Unredeemed points are forfeited at closure. An annual fee billed within
      the refund window is reversed under card_evt_annual_fee. A secured card's deposit is returned once the balance is
      paid in full. A credit balance on a closed account is refunded by official check or to a PCB account of the
      customer. A closed account cannot be reopened; the customer applies again instead.
    eligibility: []

extended_policies:
  - id: card_ext_late_fee_correction
    base_policy_refs: [card_evt_fee_reversal]
    overwrite:
      - base_policy: card_evt_fee_reversal
        superseded_clause: >-
          A fee is reversed in full, never in part, as one card_fee_reversal row whose source_item_id is the fee.
        replaced_by: >-
          The part of a billed late payment fee that the charter does not allow the bank to keep is credited back as
          one reversal entry carrying that late payment fee as its source item, and that entry is never larger than
          the fee as billed.
    trigger: state_due
    subject: [card_fee_reversal]
    computes: correction_amount
    target_tool: reverse_card_late_fee_4ff0f41c
    params:
      credited_share_standard: 0.35
      credited_share_mid: 0.45
      credited_share_enhanced: 0.65
      payments_lookback_low: 2
      payments_lookback_high: 5
      relationship_addition_high: 4.00
      relationship_addition_mid: 2.00
      relationship_addition_none: 0.00
      purchase_volume_high: 9000.00
      purchase_volume_mid: 4000.00
      checking_balance_high: 5000.00
      checking_balance_mid: 1000.00
      seasoned_account_months: 60
      checking_deposit_volume_high: 12000.00
      savings_relationship_balance: 25000.00
      savings_deposit_count_low: 1
    rule: >
      A late payment fee is billed to a personal credit card account at the tier's own rate, but the charter does not
      allow the bank to keep all of it. The part of a billed late payment fee that the charter does not allow the bank
      to keep is credited back as one reversal entry carrying that late payment fee as its source item, and that entry
      is never larger than the fee as billed. The credit is owed as soon as the fee stands on the account and is posted
      at the next reconciliation of that account, whether or not the cardholder asks for it. The fee as billed is the
      amount of the most recent late payment fee entry posted to the card account, selected by posted date. Under the
      standard method the credited share is credited_share_standard, the credited share acts on the fee as billed alone,
      no relationship addition is made, the product of the fee as billed and the credited share is rounded half-up to
      the cent, and the correction credited is the lesser of that rounded figure and the fee as billed.
      The credited share is not credited_share_standard for every cardholder. Where the cardholder holds an active
      Premier Checking or Private Client Checking account and at least payments_lookback_high card payments posted to
      this card account in the last six months, the credited share is credited_share_enhanced. Where the cardholder
      holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least
      payments_lookback_low card payments posted to this card account in the last six months, the credited share is
      credited_share_mid. Where neither of those holds, the credited share is credited_share_standard.
      A relationship addition of relationship_addition_high is set where card purchases posted to this card account in
      the last twelve months total at least purchase_volume_high and the cardholder's active PCB checking account
      carries a ledger balance of at least checking_balance_high. A relationship addition of relationship_addition_mid
      is set where those purchases total at least purchase_volume_mid but less than purchase_volume_high and that ledger
      balance is at least checking_balance_mid. In every other case the relationship addition is
      relationship_addition_none.
      Whether the relationship addition enters the calculation, and at which point, turns on how long the card account
      has been open and on the money the cardholder moves through PCB checking. Where the card account has been open at
      least seasoned_account_months whole months and PCB checking deposits posted to the cardholder's checking accounts
      in the last six months total at least checking_deposit_volume_high, the relationship addition is added to the fee
      as billed first and the credited share acts on that total. Where the card account has been open at least
      seasoned_account_months whole months and those deposits total less than checking_deposit_volume_high, the credited
      share acts on the fee as billed alone and the relationship addition is added to the product afterwards. Where the
      card account has been open less than seasoned_account_months whole months, the credited share acts on the fee as
      billed alone and no relationship addition is made.
      The rounding of the resulting figure varies as well. Where the cardholder holds an active savings account whose
      balance is at least savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to
      the cardholder's savings accounts in the last three months, the figure is rounded half-up to the nearest whole
      dollar. Where the cardholder holds an active savings account whose balance is below savings_relationship_balance
      and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last
      three months, the figure is reduced to the whole dollar below it. Where neither of those holds, the figure is
      rounded half-up to the cent.
      A card account carrying no late payment fee entry at all is out of scope of this rule and nothing is credited.
    prerequisite: []
    cross_category:
      - category: checking
        as: branch
        reads: [variant_name, ledger_balance, status, checking_transactions.amount]
        note: "The checking tier and ledger balance decide the credited-share tier and the relationship-addition tier; the six-month deposit total decides the tier that fixes where the relationship addition enters."
      - category: savings
        as: history
        reads: [status, current_balance, savings_transactions.amount]
        note: "The savings balance and the count of savings deposits in the last three months decide the rounding tier."
    compute:
      - fee_billed: "float(LATEST('card_transactions','amount', date_field='posted_date', event_type='card_fee', fee_code='late_payment') or 0)"
      - payments_6m: "COUNT('card_transactions', within_months=6, date_field='posted_date', event_type='card_payment')"
      - checking_tier: "CFIELD('checking','variant_name', status='active')"
      - credited_share: "(K('credited_share_enhanced') if ((checking_tier == 'Premier Checking' or checking_tier == 'Private Client Checking') and payments_6m >= K('payments_lookback_high')) else (K('credited_share_mid') if (checking_tier != None and checking_tier != 'Premier Checking' and checking_tier != 'Private Client Checking' and payments_6m >= K('payments_lookback_low')) else K('credited_share_standard')))"
      - purchases_12m: "SUM('card_transactions','amount', within_months=12, date_field='posted_date', event_type='card_purchase')"
      - checking_balance: "float(CFIELD('checking','ledger_balance', status='active') or 0)"
      - relationship_addition: "(K('relationship_addition_high') if (purchases_12m >= K('purchase_volume_high') and checking_balance >= K('checking_balance_high')) else (K('relationship_addition_mid') if (purchases_12m >= K('purchase_volume_mid') and purchases_12m < K('purchase_volume_high') and checking_balance >= K('checking_balance_mid')) else K('relationship_addition_none')))"
      - months_open: "MONTHS(F('opened_date'), NOW)"
      - checking_deposits_6m: "XSUM('checking','checking_transactions','amount', within_months=6, date_field='posted_date', event_type='checking_deposit')"
      - raw_correction: "((fee_billed + relationship_addition) * credited_share if (months_open >= K('seasoned_account_months') and checking_deposits_6m >= K('checking_deposit_volume_high')) else (fee_billed * credited_share + relationship_addition if (months_open >= K('seasoned_account_months') and checking_deposits_6m < K('checking_deposit_volume_high')) else fee_billed * credited_share))"
      - savings_balance: "float(CFIELD('savings','current_balance', status='active') or 0)"
      - savings_deposits_3m: "XCOUNT('savings','savings_transactions', within_months=3, date_field='posted_date', event_type='savings_deposit')"
      - has_savings: "EXISTS('savings', status='active')"
      - rounded_correction: "(RND(raw_correction, 0) if (savings_balance >= K('savings_relationship_balance') and savings_deposits_3m >= K('savings_deposit_count_low')) else (float(int(raw_correction)) if (has_savings and savings_balance < K('savings_relationship_balance') and savings_deposits_3m >= K('savings_deposit_count_low')) else RND(raw_correction, 2)))"
      - result: "MN(rounded_correction, fee_billed)"
    compute_basis:
      fee_billed: "The fee as billed is the amount of the most recent late payment fee entry posted to the card account, selected by posted date."
      payments_6m: "Where the cardholder holds an active Premier Checking or Private Client Checking account and at least payments_lookback_high card payments posted to this card account in the last six months, the credited share is credited_share_enhanced."
      checking_tier: "Where the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least payments_lookback_low card payments posted to this card account in the last six months, the credited share is credited_share_mid."
      credited_share: "Where the cardholder holds an active Premier Checking or Private Client Checking account and at least payments_lookback_high card payments posted to this card account in the last six months, the credited share is credited_share_enhanced. Where the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least payments_lookback_low card payments posted to this card account in the last six months, the credited share is credited_share_mid. Where neither of those holds, the credited share is credited_share_standard."
      purchases_12m: "A relationship addition of relationship_addition_high is set where card purchases posted to this card account in the last twelve months total at least purchase_volume_high and the cardholder's active PCB checking account carries a ledger balance of at least checking_balance_high."
      checking_balance: "A relationship addition of relationship_addition_mid is set where those purchases total at least purchase_volume_mid but less than purchase_volume_high and that ledger balance is at least checking_balance_mid."
      relationship_addition: "A relationship addition of relationship_addition_high is set where card purchases posted to this card account in the last twelve months total at least purchase_volume_high and the cardholder's active PCB checking account carries a ledger balance of at least checking_balance_high. A relationship addition of relationship_addition_mid is set where those purchases total at least purchase_volume_mid but less than purchase_volume_high and that ledger balance is at least checking_balance_mid. In every other case the relationship addition is relationship_addition_none."
      months_open: "Where the card account has been open less than seasoned_account_months whole months, the credited share acts on the fee as billed alone and no relationship addition is made."
      checking_deposits_6m: "Where the card account has been open at least seasoned_account_months whole months and PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high, the relationship addition is added to the fee as billed first and the credited share acts on that total."
      raw_correction: "Where the card account has been open at least seasoned_account_months whole months and PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high, the relationship addition is added to the fee as billed first and the credited share acts on that total. Where the card account has been open at least seasoned_account_months whole months and those deposits total less than checking_deposit_volume_high, the credited share acts on the fee as billed alone and the relationship addition is added to the product afterwards. Where the card account has been open less than seasoned_account_months whole months, the credited share acts on the fee as billed alone and no relationship addition is made."
      savings_balance: "Where the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the figure is rounded half-up to the nearest whole dollar."
      savings_deposits_3m: "Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the figure is reduced to the whole dollar below it."
      has_savings: "Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the figure is reduced to the whole dollar below it."
      rounded_correction: "Where the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the figure is rounded half-up to the nearest whole dollar. Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the figure is reduced to the whole dollar below it. Where neither of those holds, the figure is rounded half-up to the cent."
      result: "The part of a billed late payment fee that the charter does not allow the bank to keep is credited back as one reversal entry carrying that late payment fee as its source item, and that entry is never larger than the fee as billed."
    factors:
      - id: credited_share_ladder
        effect: parameter
        decides: credited_share
        bindings: [payments_6m, checking_tier, credited_share]
        ladder:
          - when: "the cardholder holds an active Premier Checking or Private Client Checking account and at least payments_lookback_high card payments posted to this card account in the last six months"
            value: "K('credited_share_enhanced')"
          - when: "the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least payments_lookback_low card payments posted to this card account in the last six months"
            value: "K('credited_share_mid')"
          - when: "otherwise"
            value: "K('credited_share_standard')"
        baseline:
          credited_share: "K('credited_share_standard')"
        evidence: [history, cross_category]
        cross_difficulty: checking
      - id: relationship_addition_ladder
        effect: parameter
        decides: relationship_addition
        bindings: [purchases_12m, checking_balance, relationship_addition]
        ladder:
          - when: "card purchases posted to this card account in the last twelve months total at least purchase_volume_high and the active PCB checking account carries a ledger balance of at least checking_balance_high"
            value: "K('relationship_addition_high')"
          - when: "those purchases total at least purchase_volume_mid but less than purchase_volume_high and that ledger balance is at least checking_balance_mid"
            value: "K('relationship_addition_mid')"
          - when: "otherwise"
            value: "K('relationship_addition_none')"
        baseline:
          relationship_addition: "K('relationship_addition_none')"
        evidence: [history, cross_category]
        cross_difficulty: checking
      - id: addition_entry_point
        effect: method
        decides: raw_correction
        bindings: [months_open, checking_deposits_6m, raw_correction]
        ladder:
          - when: "the card account has been open at least seasoned_account_months whole months and PCB checking deposits in the last six months total at least checking_deposit_volume_high"
            method: "the relationship addition is added to the fee as billed first and the credited share acts on that total"
          - when: "the card account has been open at least seasoned_account_months whole months and those deposits total less than checking_deposit_volume_high"
            method: "the credited share acts on the fee as billed alone and the relationship addition is added to the product afterwards"
          - when: "otherwise"
            method: "the credited share acts on the fee as billed alone and no relationship addition is made"
        baseline:
          raw_correction: "fee_billed * credited_share"
        evidence: [date, cross_category]
        cross_difficulty: checking
      - id: correction_rounding_convention
        effect: method
        decides: rounded_correction
        bindings: [savings_balance, savings_deposits_3m, has_savings, rounded_correction]
        ladder:
          - when: "the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_deposit_count_low savings deposit posted in the last three months"
            method: "the figure is rounded half-up to the nearest whole dollar"
          - when: "the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit posted in the last three months"
            method: "the figure is reduced to the whole dollar below it"
          - when: "otherwise"
            method: "the figure is rounded half-up to the cent"
        baseline:
          rounded_correction: "RND(raw_correction, 2)"
        evidence: [history, cross_category]
        cross_difficulty: savings
    baseline:
      rule: >-
        The fee as billed is the amount of the most recent late payment fee entry posted to the card account, selected
        by posted date. Under the standard method the credited share is credited_share_standard, the credited share acts
        on the fee as billed alone, no relationship addition is made, the product of the fee as billed and the credited
        share is rounded half-up to the cent, and the correction credited is the lesser of that rounded figure and the
        fee as billed.
      params: [credited_share_standard, relationship_addition_none]
    inputs:
      history:
        - {table: card_transactions, aggregate: latest, field: amount, within_months: null, filters: {event_type: card_fee, fee_code: late_payment}}
        - {table: card_transactions, aggregate: count, field: card_txn_id, within_months: 6, filters: {event_type: card_payment}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: card_purchase}}
        - {category: checking, table: checking_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: checking_deposit}}
        - {category: savings, table: savings_transactions, aggregate: count, field: amount, within_months: 3, filters: {event_type: savings_deposit}}
      cross_category: [checking, savings]

  - id: card_ext_rewards_statement_credit
    base_policy_refs: [card_evt_rewards]
    overwrite:
      - base_policy: card_evt_rewards
        superseded_clause: >-
          Points are redeemed only in whole points, at least rewards_redemption_minimum_points per redemption, by one of
          rewards_redemption_types: a statement credit, a deposit to a PCB checking or savings account of the same
          customer, or a gift card, each at rewards_point_value_cash per point, or travel booked through the rewards
          center at rewards_point_value_travel per point; the USD value is points times value, rounded half-up to the
          cent.
        replaced_by: >-
          A statement-credit redemption made to settle outstanding card fees and interest is redeemed in whole points at
          a redemption value that is point_value_enhanced, point_value_mid or the tier's own cash value per point
          according to the cardholder's savings relationship, and the number of points it uses is worked out from the
          settlement target below rather than from a value the cardholder names.
    trigger: on_request
    subject: [card_rewards_redeem]
    computes: points_redeemed
    target_tool: redeem_card_points_9bfb7edb
    params:
      covered_share_standard: 0.55
      covered_share_mid: 0.80
      covered_share_full: 1.00
      payments_deep_count: 6
      point_value_enhanced: 0.0125
      point_value_mid: 0.011
      savings_relationship_balance: 25000.00
      savings_interest_count_low: 1
      seasoned_account_months: 60
      prior_redemption_count: 3
      checking_deposit_volume_high: 12000.00
    rule: >
      A cardholder whose rewards programme is not none may ask the Customer Care Center to put their unredeemed points
      towards the fees and interest that have been billed to the card, and this rule fixes how many points such a
      statement-credit redemption uses. A statement-credit redemption made to settle outstanding card fees and interest
      is redeemed in whole points at a redemption value that is point_value_enhanced, point_value_mid or the tier's own
      cash value per point according to the cardholder's savings relationship, and the number of points it uses is
      worked out from the settlement target below rather than from a value the cardholder names. The number of points a
      statement-credit redemption uses is fixed only after every late payment fee entry standing on the card account
      carries a matching reversal entry in the ledger. Under the standard method the settlement target is the fees and
      the interest posted to the card account in the last month, less the fee reversals credited to it in the last
      month, and never less than zero; the covered share is covered_share_standard; the redemption value is the tier's
      own cash value per point; the settlement target multiplied by the covered share is divided by the redemption value
      and the quotient is rounded half-up to a whole point; and the redemption uses the lesser of that point count and
      the unredeemed points standing on the card account.
      The window the settlement target is drawn from is not the last month for every cardholder. Where PCB checking
      deposits posted to the cardholder's checking accounts in the last six months total at least
      checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the
      settlement target is the fees and the interest posted to the card account in the last six months, less the fee
      reversals credited to it in the last six months, and never less than zero. Where those deposits total at least
      checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six
      months, the settlement target is the fees and the interest posted to the card account in the last three months,
      less the fee reversals credited to it in the last three months, and never less than zero. Where those deposits
      total less than checking_deposit_volume_high, the settlement target is the fees and the interest posted to the
      card account in the last month, less the fee reversals credited to it in the last month, and never less than zero.
      The covered share varies with the cardholder's checking relationship and with how steadily the card has been paid.
      Where the cardholder holds an active Premier Checking or Private Client Checking account and at least
      payments_deep_count card payments posted to this card account in the last twelve months, the covered share is
      covered_share_full. Where the cardholder holds an active checking account whose tier is neither Premier Checking
      nor Private Client Checking and at least payments_deep_count card payments posted to this card account in the last
      twelve months, the covered share is covered_share_mid. Where neither of those holds, the covered share is
      covered_share_standard.
      The redemption value per point varies with the savings relationship. Where the cardholder holds an active savings
      account whose balance is at least savings_relationship_balance and at least savings_interest_count_low savings
      interest credit posted to the cardholder's savings accounts in the last three months, the redemption value is
      point_value_enhanced. Where the cardholder holds an active savings account whose balance is below
      savings_relationship_balance and at least savings_interest_count_low savings interest credit posted to the
      cardholder's savings accounts in the last three months, the redemption value is point_value_mid. Where neither of
      those holds, the redemption value is the tier's own cash value per point.
      How the quotient is turned into a whole point count varies as well. Where the card account has been open at least
      seasoned_account_months whole months and at least prior_redemption_count rewards redemptions have already been
      posted to it, the quotient is raised to the next whole multiple of five hundred points. Where the card account has
      been open at least seasoned_account_months whole months and fewer than prior_redemption_count rewards redemptions
      have been posted to it, the quotient is raised to the next whole multiple of one hundred points. Where the card
      account has been open less than seasoned_account_months whole months, the quotient is rounded half-up to a whole
      point.
      Where the point count so obtained is below the tier's own redemption minimum, no statement-credit redemption is
      made and nothing is posted.
    prerequisite:
      - problem: card_ext_late_fee_correction
        kind: value_input
        gate: settlement_target
        form: state
        policy_source: >-
          The number of points a statement-credit redemption uses is fixed only after every late payment fee entry
          standing on the card account carries a matching reversal entry in the ledger.
        condition: >-
          Every card ledger entry on the target card account that is a fee entry with the late payment fee code is named
          as the source item of a fee reversal entry on the same card account.
        resolved_by: reverse_card_late_fee_4ff0f41c
        effect: >-
          Once that reversal entry is posted, the fee reversals credited to the card account inside the settlement
          window rise by the correction amount, so the settlement target binding falls by that amount and fewer points are
          used.
    cross_category:
      - category: checking
        as: branch
        reads: [variant_name, status, checking_transactions.amount]
        note: "The checking tier decides the covered-share tier; the six-month deposit total and the six-month fee count decide the window the settlement target is drawn from."
      - category: savings
        as: history
        reads: [status, current_balance, savings_transactions.amount]
        note: "The savings balance and the count of savings interest credits in the last three months decide the redemption value per point."
    compute:
      - fees_6m: "SUM('card_transactions','amount', within_months=6, date_field='posted_date', event_type='card_fee')"
      - interest_6m: "SUM('card_transactions','amount', within_months=6, date_field='posted_date', event_type='card_interest_charge')"
      - reversals_6m: "SUM('card_transactions','amount', within_months=6, date_field='posted_date', event_type='card_fee_reversal')"
      - fees_3m: "SUM('card_transactions','amount', within_months=3, date_field='posted_date', event_type='card_fee')"
      - interest_3m: "SUM('card_transactions','amount', within_months=3, date_field='posted_date', event_type='card_interest_charge')"
      - reversals_3m: "SUM('card_transactions','amount', within_months=3, date_field='posted_date', event_type='card_fee_reversal')"
      - fees_1m: "SUM('card_transactions','amount', within_months=1, date_field='posted_date', event_type='card_fee')"
      - interest_1m: "SUM('card_transactions','amount', within_months=1, date_field='posted_date', event_type='card_interest_charge')"
      - reversals_1m: "SUM('card_transactions','amount', within_months=1, date_field='posted_date', event_type='card_fee_reversal')"
      - checking_deposits_6m: "XSUM('checking','checking_transactions','amount', within_months=6, date_field='posted_date', event_type='checking_deposit')"
      - checking_fees_6m: "XCOUNT('checking','checking_transactions', within_months=6, date_field='posted_date', event_type='checking_fee')"
      - settlement_target: "(MX(fees_6m + interest_6m - reversals_6m, 0) if (checking_deposits_6m >= K('checking_deposit_volume_high') and checking_fees_6m == 0) else (MX(fees_3m + interest_3m - reversals_3m, 0) if (checking_deposits_6m >= K('checking_deposit_volume_high') and checking_fees_6m > 0) else MX(fees_1m + interest_1m - reversals_1m, 0)))"
      - payments_12m: "COUNT('card_transactions', within_months=12, date_field='posted_date', event_type='card_payment')"
      - checking_tier: "CFIELD('checking','variant_name', status='active')"
      - covered_share: "(K('covered_share_full') if ((checking_tier == 'Premier Checking' or checking_tier == 'Private Client Checking') and payments_12m >= K('payments_deep_count')) else (K('covered_share_mid') if (checking_tier != None and checking_tier != 'Premier Checking' and checking_tier != 'Private Client Checking' and payments_12m >= K('payments_deep_count')) else K('covered_share_standard')))"
      - savings_balance: "float(CFIELD('savings','current_balance', status='active') or 0)"
      - savings_interest_3m: "XCOUNT('savings','savings_transactions', within_months=3, date_field='posted_date', event_type='savings_interest_credit')"
      - has_savings: "EXISTS('savings', status='active')"
      - point_value: "(K('point_value_enhanced') if (savings_balance >= K('savings_relationship_balance') and savings_interest_3m >= K('savings_interest_count_low')) else (K('point_value_mid') if (has_savings and savings_balance < K('savings_relationship_balance') and savings_interest_3m >= K('savings_interest_count_low')) else P('rewards_point_value_cash')))"
      - covered_amount: "settlement_target * covered_share"
      - raw_points: "covered_amount / point_value"
      - months_open: "MONTHS(F('opened_date'), NOW)"
      - prior_redemptions: "COUNT('card_transactions', event_type='card_rewards_redeem')"
      - rounded_points: "(float(-(-raw_points // 500) * 500) if (months_open >= K('seasoned_account_months') and prior_redemptions >= K('prior_redemption_count')) else (float(-(-raw_points // 100) * 100) if (months_open >= K('seasoned_account_months') and prior_redemptions < K('prior_redemption_count')) else RND(raw_points, 0)))"
      - result: "MN(rounded_points, float(F('rewards_balance') or 0))"
    compute_basis:
      fees_6m: "Where PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the settlement target is the fees and the interest posted to the card account in the last six months, less the fee reversals credited to it in the last six months, and never less than zero."
      interest_6m: "Where PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the settlement target is the fees and the interest posted to the card account in the last six months, less the fee reversals credited to it in the last six months, and never less than zero."
      reversals_6m: "Where PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the settlement target is the fees and the interest posted to the card account in the last six months, less the fee reversals credited to it in the last six months, and never less than zero."
      fees_3m: "Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the settlement target is the fees and the interest posted to the card account in the last three months, less the fee reversals credited to it in the last three months, and never less than zero."
      interest_3m: "Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the settlement target is the fees and the interest posted to the card account in the last three months, less the fee reversals credited to it in the last three months, and never less than zero."
      reversals_3m: "Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the settlement target is the fees and the interest posted to the card account in the last three months, less the fee reversals credited to it in the last three months, and never less than zero."
      fees_1m: "Under the standard method the settlement target is the fees and the interest posted to the card account in the last month, less the fee reversals credited to it in the last month, and never less than zero"
      interest_1m: "Under the standard method the settlement target is the fees and the interest posted to the card account in the last month, less the fee reversals credited to it in the last month, and never less than zero"
      reversals_1m: "The number of points a statement-credit redemption uses is fixed only after every late payment fee entry standing on the card account carries a matching reversal entry in the ledger."
      checking_deposits_6m: "Where those deposits total less than checking_deposit_volume_high, the settlement target is the fees and the interest posted to the card account in the last month, less the fee reversals credited to it in the last month, and never less than zero."
      checking_fees_6m: "Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the settlement target is the fees and the interest posted to the card account in the last three months, less the fee reversals credited to it in the last three months, and never less than zero."
      settlement_target: "Where PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the settlement target is the fees and the interest posted to the card account in the last six months, less the fee reversals credited to it in the last six months, and never less than zero. Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the settlement target is the fees and the interest posted to the card account in the last three months, less the fee reversals credited to it in the last three months, and never less than zero. Where those deposits total less than checking_deposit_volume_high, the settlement target is the fees and the interest posted to the card account in the last month, less the fee reversals credited to it in the last month, and never less than zero."
      payments_12m: "Where the cardholder holds an active Premier Checking or Private Client Checking account and at least payments_deep_count card payments posted to this card account in the last twelve months, the covered share is covered_share_full."
      checking_tier: "Where the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least payments_deep_count card payments posted to this card account in the last twelve months, the covered share is covered_share_mid."
      covered_share: "Where the cardholder holds an active Premier Checking or Private Client Checking account and at least payments_deep_count card payments posted to this card account in the last twelve months, the covered share is covered_share_full. Where the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least payments_deep_count card payments posted to this card account in the last twelve months, the covered share is covered_share_mid. Where neither of those holds, the covered share is covered_share_standard."
