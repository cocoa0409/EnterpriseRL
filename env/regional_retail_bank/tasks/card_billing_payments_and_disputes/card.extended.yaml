  - id: card_ext_dispute_rebill_recovery
    base_policy_refs: [card_evt_billing_disputes]
    overwrite:
      - base_policy: card_evt_billing_disputes
        superseded_clause: >-
          A temporary credit may be rebilled only when the dispute's dispute_status is resolved_cardholder_liable or
          withdrawn, for the full temporary credit, with the temporary credit as source_item_id.
        replaced_by: >-
          The amount rebilled on a dispute the card records as resolved against the cardholder is a computed figure
          rather than the whole of the temporary credit, and it never exceeds the amount at risk.
    trigger: state_due
    subject: [card_dispute_rebill]
    computes: rebill_amount
    target_tool: rebill_card_dispute_credit_f8e84f35
    params:
      rebilled_share_full: 1.00
      rebilled_share_mid: 0.90
      rebilled_share_standard: 0.75
      certificate_balance_high: 10000.00
      relief_share_full: 1.00
      relief_share_mid: 0.50
      relief_share_none: 0.00
      seasoned_account_months: 48
      checking_deposit_volume_high: 12000.00
      savings_relationship_balance: 25000.00
      savings_deposit_count_low: 1
      payments_deep_count: 6
      purchase_recent_high: 4000.00
    rule: >
      A temporary credit that still stands on a billing dispute the card records as resolved against the cardholder is
      owed back to the bank, and this rule fixes how much is rebilled. The amount rebilled on a dispute the card records
      as resolved against the cardholder is a computed figure rather than the whole of the temporary credit, and it
      never exceeds the amount at risk. The rebill is owed as soon as the dispute stands in that status and is posted at
      the next reconciliation of the account, whether or not the cardholder is in touch. The amount at risk is the
      figure recorded as claimed on the most recent dispute standing in resolved against the cardholder status on the
      card account, selected by notice date. Under the standard method the rebilled share is rebilled_share_standard,
      the relief share on interest is relief_share_none, the interest the relief acts on is the interest billed to the
      card account in the last two months added together, the rebilled share acts on the amount at risk with no
      interest relief deducted, the ceiling of the amount at risk is compared with the product, the figure is rounded
      half-up to the cent, and the amount rebilled is never less than zero.
      The rebilled share turns on the certificate relationship and on whether payments have been returned. Where the
      cardholder holds an active certificate whose principal balance is at least certificate_balance_high and no card
      payment has been returned on this card account in the last twelve months, the rebilled share is
      rebilled_share_full. Where the cardholder holds an active certificate whose principal balance is below
      certificate_balance_high and no card payment has been returned on this card account in the last twelve months, the
      rebilled share is rebilled_share_mid. Where neither of those holds, the rebilled share is
      rebilled_share_standard.
      Interest the cardholder should not bear while a dispute was open is relieved from the rebill. Where the card
      account has been open at least seasoned_account_months whole months and no earlier dispute rebill has been posted
      to it, the relief share on interest is relief_share_full. Where the card account has been open at least
      seasoned_account_months whole months and at least one earlier dispute rebill has been posted to it, the relief
      share on interest is relief_share_mid. Where the card account has been open less than seasoned_account_months
      whole months, the relief share on interest is relief_share_none.
      Which interest the relief share acts on turns on the savings relationship. Where the cardholder holds an active
      savings account whose balance is at least savings_relationship_balance and at least savings_deposit_count_low
      savings deposit posted to the cardholder's savings accounts in the last three months, the interest the relief acts
      on is the interest billed to the card account in the last six months added together. Where the cardholder holds an
      active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low
      savings deposit posted to the cardholder's savings accounts in the last three months, the interest the relief acts
      on is the largest single interest charge ever billed to the card account. Where neither of those
      holds, the interest the relief acts on is the interest billed to the card account in the last two months added
      together.
      Where the ceiling of the amount at risk bites, and whether the interest relief is deducted before or after it,
      turns on the money the cardholder moves through PCB checking. Where PCB checking deposits posted to the
      cardholder's checking accounts in the last six months total at least checking_deposit_volume_high and no PCB
      checking fee was posted to those accounts in the last six months, the interest relief is deducted from the product
      of the rebilled share first and the ceiling of the amount at risk is compared with the figure that results. Where
      those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those
      accounts in the last six months, the ceiling of the amount at risk is compared with the product of the rebilled
      share before any relief is deducted, and the interest relief is then deducted from the capped figure. Where those
      deposits total less than checking_deposit_volume_high, the rebilled share acts on the amount at risk with no
      interest relief deducted and the ceiling of the amount at risk is compared with the product.
      The rounding of the resulting figure turns on how the card has been used. Where at least payments_deep_count card
      payments have posted to this card account in the last twelve months and card purchases posted to it in the last
      six months total at least purchase_recent_high, the figure is rounded half-up to the nearest whole dollar. Where
      at least payments_deep_count card payments have posted to this card account in the last twelve months and those
      purchases total less than purchase_recent_high, the figure is reduced to the whole dollar below it. Where fewer
      than payments_deep_count card payments have posted in the last twelve months, the figure is rounded half-up to the
      cent.
      A card account carrying no dispute recorded as resolved against the cardholder is out of scope of this rule and
      nothing is rebilled.
    prerequisite: []
    cross_category:
      - category: cd
        as: branch
        reads: [status, principal_balance]
        note: "The certificate principal decides the rebilled-share tier."
      - category: checking
        as: history
        reads: [status, checking_transactions.amount]
        note: "The six-month deposit total and fee count decide where the ceiling bites and whether the interest relief is deducted before or after it."
      - category: savings
        as: history
        reads: [status, current_balance, savings_transactions.amount]
        note: "The savings balance and the count of savings deposits in the last three months decide which interest the relief share acts on."
    compute:
      - at_risk: "float(LATEST('card_disputes','claimed_amount', date_field='notice_date', dispute_status='resolved_cardholder_liable') or 0)"
      - returned_payments_12m: "COUNT('card_transactions', within_months=12, date_field='posted_date', event_type='card_payment_return')"
      - cd_principal: "float(CFIELD('cd','principal_balance', status='active') or 0)"
      - has_cd: "EXISTS('cd', status='active')"
      - rebilled_share: "(K('rebilled_share_full') if (cd_principal >= K('certificate_balance_high') and returned_payments_12m == 0) else (K('rebilled_share_mid') if (has_cd and cd_principal < K('certificate_balance_high') and returned_payments_12m == 0) else K('rebilled_share_standard')))"
      - months_open: "MONTHS(F('opened_date'), NOW)"
      - prior_rebills: "COUNT('card_transactions', event_type='card_dispute_rebill')"
      - relief_share: "(K('relief_share_full') if (months_open >= K('seasoned_account_months') and prior_rebills == 0) else (K('relief_share_mid') if (months_open >= K('seasoned_account_months') and prior_rebills > 0) else K('relief_share_none')))"
      - interest_6m: "SUM('card_transactions','amount', within_months=6, date_field='posted_date', event_type='card_interest_charge')"
      - interest_max_6m: "MAX('card_transactions','amount', event_type='card_interest_charge')"
      - interest_2m: "SUM('card_transactions','amount', within_months=2, date_field='posted_date', event_type='card_interest_charge')"
      - savings_balance: "float(CFIELD('savings','current_balance', status='active') or 0)"
      - savings_deposits_3m: "XCOUNT('savings','savings_transactions', within_months=3, date_field='posted_date', event_type='savings_deposit')"
      - has_savings: "EXISTS('savings', status='active')"
      - open_interest: "(interest_6m if (savings_balance >= K('savings_relationship_balance') and savings_deposits_3m >= K('savings_deposit_count_low')) else (interest_max_6m if (has_savings and savings_balance < K('savings_relationship_balance') and savings_deposits_3m >= K('savings_deposit_count_low')) else interest_2m))"
      - interest_relief: "open_interest * relief_share"
      - checking_deposits_6m: "XSUM('checking','checking_transactions','amount', within_months=6, date_field='posted_date', event_type='checking_deposit')"
      - checking_fees_6m: "XCOUNT('checking','checking_transactions', within_months=6, date_field='posted_date', event_type='checking_fee')"
      - raw_rebill: "(MN(at_risk * rebilled_share - interest_relief, at_risk) if (checking_deposits_6m >= K('checking_deposit_volume_high') and checking_fees_6m == 0) else (MN(at_risk * rebilled_share, at_risk) - interest_relief if (checking_deposits_6m >= K('checking_deposit_volume_high') and checking_fees_6m > 0) else MN(at_risk * rebilled_share, at_risk)))"
      - payments_12m: "COUNT('card_transactions', within_months=12, date_field='posted_date', event_type='card_payment')"
      - purchases_6m: "SUM('card_transactions','amount', within_months=6, date_field='posted_date', event_type='card_purchase')"
      - rounded_rebill: "(RND(raw_rebill, 0) if (payments_12m >= K('payments_deep_count') and purchases_6m >= K('purchase_recent_high')) else (float(int(raw_rebill)) if (payments_12m >= K('payments_deep_count') and purchases_6m < K('purchase_recent_high')) else RND(raw_rebill, 2)))"
      - result: "MX(rounded_rebill, 0)"
    compute_basis:
      at_risk: "The amount at risk is the figure recorded as claimed on the most recent dispute standing in resolved against the cardholder status on the card account, selected by notice date."
      returned_payments_12m: "Where the cardholder holds an active certificate whose principal balance is at least certificate_balance_high and no card payment has been returned on this card account in the last twelve months, the rebilled share is rebilled_share_full."
      cd_principal: "Where the cardholder holds an active certificate whose principal balance is below certificate_balance_high and no card payment has been returned on this card account in the last twelve months, the rebilled share is rebilled_share_mid."
      has_cd: "Where neither of those holds, the rebilled share is rebilled_share_standard."
      rebilled_share: "Where the cardholder holds an active certificate whose principal balance is at least certificate_balance_high and no card payment has been returned on this card account in the last twelve months, the rebilled share is rebilled_share_full. Where the cardholder holds an active certificate whose principal balance is below certificate_balance_high and no card payment has been returned on this card account in the last twelve months, the rebilled share is rebilled_share_mid. Where neither of those holds, the rebilled share is rebilled_share_standard."
      months_open: "Where the card account has been open less than seasoned_account_months whole months, the relief share on interest is relief_share_none."
      prior_rebills: "Where the card account has been open at least seasoned_account_months whole months and no earlier dispute rebill has been posted to it, the relief share on interest is relief_share_full."
      relief_share: "Where the card account has been open at least seasoned_account_months whole months and no earlier dispute rebill has been posted to it, the relief share on interest is relief_share_full. Where the card account has been open at least seasoned_account_months whole months and at least one earlier dispute rebill has been posted to it, the relief share on interest is relief_share_mid. Where the card account has been open less than seasoned_account_months whole months, the relief share on interest is relief_share_none."
      interest_6m: "Where the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the interest the relief acts on is the interest billed to the card account in the last six months added together."
      interest_max_6m: "Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the interest the relief acts on is the largest single interest charge ever billed to the card account."
      interest_2m: "Where neither of those holds, the interest the relief acts on is the interest billed to the card account in the last two months added together."
      savings_balance: "Where the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the interest the relief acts on is the interest billed to the card account in the last six months added together."
      savings_deposits_3m: "Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the interest the relief acts on is the largest single interest charge ever billed to the card account."
      has_savings: "Where neither of those holds, the interest the relief acts on is the interest billed to the card account in the last two months added together."
      open_interest: "Where the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the interest the relief acts on is the interest billed to the card account in the last six months added together. Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the interest the relief acts on is the largest single interest charge ever billed to the card account. Where neither of those holds, the interest the relief acts on is the interest billed to the card account in the last two months added together."
      checking_deposits_6m: "Where PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the interest relief is deducted from the product of the rebilled share first and the ceiling of the amount at risk is compared with the figure that results."
      checking_fees_6m: "Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the ceiling of the amount at risk is compared with the product of the rebilled share before any relief is deducted, and the interest relief is then deducted from the capped figure."
      raw_rebill: "Where PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the interest relief is deducted from the product of the rebilled share first and the ceiling of the amount at risk is compared with the figure that results. Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the ceiling of the amount at risk is compared with the product of the rebilled share before any relief is deducted, and the interest relief is then deducted from the capped figure. Where those deposits total less than checking_deposit_volume_high, the rebilled share acts on the amount at risk with no interest relief deducted and the ceiling of the amount at risk is compared with the product."
      payments_12m: "Where at least payments_deep_count card payments have posted to this card account in the last twelve months and card purchases posted to it in the last six months total at least purchase_recent_high, the figure is rounded half-up to the nearest whole dollar."
      purchases_6m: "Where at least payments_deep_count card payments have posted to this card account in the last twelve months and those purchases total less than purchase_recent_high, the figure is reduced to the whole dollar below it."
      rounded_rebill: "Where at least payments_deep_count card payments have posted to this card account in the last twelve months and card purchases posted to it in the last six months total at least purchase_recent_high, the figure is rounded half-up to the nearest whole dollar. Where at least payments_deep_count card payments have posted to this card account in the last twelve months and those purchases total less than purchase_recent_high, the figure is reduced to the whole dollar below it. Where fewer than payments_deep_count card payments have posted in the last twelve months, the figure is rounded half-up to the cent."
      result: "the figure is rounded half-up to the cent, and the amount rebilled is never less than zero"
    factors:
      - id: rebilled_share_ladder
        effect: parameter
        decides: rebilled_share
        bindings: [returned_payments_12m, cd_principal, has_cd, rebilled_share]
        ladder:
          - when: "the cardholder holds an active certificate whose principal balance is at least certificate_balance_high and no card payment has been returned on this card account in the last twelve months"
            value: "K('rebilled_share_full')"
          - when: "the cardholder holds an active certificate whose principal balance is below certificate_balance_high and no card payment has been returned on this card account in the last twelve months"
            value: "K('rebilled_share_mid')"
          - when: "otherwise"
            value: "K('rebilled_share_standard')"
        baseline:
          rebilled_share: "K('rebilled_share_standard')"
        evidence: [history, cross_category]
        cross_difficulty: cd
      - id: interest_relief_ladder
        effect: parameter
        decides: relief_share
        bindings: [months_open, prior_rebills, relief_share]
        ladder:
          - when: "the card account has been open at least seasoned_account_months whole months and no earlier dispute rebill has been posted to it"
            value: "K('relief_share_full')"
          - when: "the card account has been open at least seasoned_account_months whole months and at least one earlier dispute rebill has been posted to it"
            value: "K('relief_share_mid')"
          - when: "otherwise"
            value: "K('relief_share_none')"
        baseline:
          relief_share: "K('relief_share_none')"
        evidence: [history, date]
        cross_difficulty: null
      - id: open_interest_aggregation
        effect: method
        decides: open_interest
        bindings: [interest_6m, interest_max_6m, interest_2m, savings_balance, savings_deposits_3m, has_savings, open_interest]
        ladder:
          - when: "the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_deposit_count_low savings deposit posted in the last three months"
            method: "the interest the relief acts on is the interest billed to the card account in the last six months added together"
          - when: "the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit posted in the last three months"
            method: "the interest the relief acts on is the largest single interest charge ever billed to the card account"
          - when: "otherwise"
            method: "the interest the relief acts on is the interest billed to the card account in the last two months added together"
        baseline:
          open_interest: "interest_2m"
        evidence: [history, cross_category]
        cross_difficulty: savings
      - id: ceiling_moment
        effect: method
        decides: raw_rebill
        bindings: [checking_deposits_6m, checking_fees_6m, raw_rebill]
        ladder:
          - when: "PCB checking deposits in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months"
            method: "the interest relief is deducted from the product of the rebilled share first and the ceiling of the amount at risk is compared with the figure that results"
          - when: "those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months"
            method: "the ceiling of the amount at risk is compared with the product of the rebilled share before any relief is deducted, and the interest relief is then deducted from the capped figure"
          - when: "otherwise"
            method: "the rebilled share acts on the amount at risk with no interest relief deducted and the ceiling of the amount at risk is compared with the product"
        baseline:
          raw_rebill: "MN(at_risk * rebilled_share, at_risk)"
        evidence: [history, cross_category]
        cross_difficulty: checking
      - id: rebill_rounding_convention
        effect: method
        decides: rounded_rebill
        bindings: [payments_12m, purchases_6m, rounded_rebill]
        ladder:
          - when: "at least payments_deep_count card payments have posted to this card account in the last twelve months and card purchases posted to it in the last six months total at least purchase_recent_high"
            method: "the figure is rounded half-up to the nearest whole dollar"
          - when: "at least payments_deep_count card payments have posted to this card account in the last twelve months and those purchases total less than purchase_recent_high"
            method: "the figure is reduced to the whole dollar below it"
          - when: "otherwise"
            method: "the figure is rounded half-up to the cent"
        baseline:
          rounded_rebill: "RND(raw_rebill, 2)"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The amount at risk is the figure recorded as claimed on the most recent dispute standing in resolved against the
        cardholder status on the card account, selected by notice date. Under the standard method the rebilled share is
        rebilled_share_standard, the relief share on interest is relief_share_none, the interest the relief acts on is
        the interest billed to the card account in the last two months added together, the rebilled share acts on the
        amount at risk with no interest relief deducted, the ceiling of the amount at risk is compared with the product,
        the figure is rounded half-up to the cent, and the amount rebilled is never less than zero.
      params: [rebilled_share_standard, relief_share_none]
    inputs:
      history:
        - {table: card_disputes, aggregate: latest, field: claimed_amount, within_months: null, filters: {dispute_status: resolved_cardholder_liable}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: card_interest_charge}}
        - {table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_payment}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: card_purchase}}
        - {category: checking, table: checking_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: checking_deposit}}
        - {category: savings, table: savings_transactions, aggregate: count, field: amount, within_months: 3, filters: {event_type: savings_deposit}}
      cross_category: [cd, checking, savings]

  - id: card_ext_autopay_fixed_amount
    base_policy_refs: [card_evt_payments]
    overwrite:
      - base_policy: card_evt_payments
        superseded_clause: >-
          for the minimum due, the statement balance, or a fixed amount but never more than the statement balance
        replaced_by: >-
          the fixed monthly amount of a standing automatic payment instruction is worked out by the desk from the
          payable balance and never exceeds it
    trigger: on_request
    subject: [card_set_autopay]
    computes: autopay_amount
    target_tool: set_card_autopay_amount_b2f02f74
    params:
      coverage_share_full: 0.90
      coverage_share_mid: 0.75
      coverage_share_standard: 0.50
      payments_deep_count: 6
      checking_deposit_volume_high: 12000.00
      savings_relationship_balance: 25000.00
      savings_deposit_count_low: 1
      spread_cycles_long: 6
      spread_cycles_mid: 3
      spread_cycles_standard: 1
      carryover_addition_high: 45.00
      carryover_addition_mid: 20.00
      carryover_addition_none: 0.00
      late_fee_count_low: 1
      interest_burden_high: 300.00
      seasoned_account_months: 48
      purchase_recent_high: 4000.00
      certificate_balance_high: 10000.00
      certificate_payout_count_low: 1
    rule: >
      A cardholder may ask the Customer Care Center to put a standing automatic payment instruction on a personal credit
      card account for a fixed monthly amount, and this rule fixes what that amount is: the fixed monthly amount of a
      standing automatic payment instruction is worked out by the desk from the payable balance and never exceeds it.
      The payable balance is the charges standing on the card ledger, being its purchases, cash advances, cash advance
      and other fees, billed interest, returned payments and dispute rebills, less the credits standing on it, being its
      payments, merchant credits, fee reversals, interest reversals, dispute credits and rewards statement credits, and
      never less than zero. The fixed monthly amount of a standing automatic payment instruction is settled only after
      every billing dispute standing in submitted status on the card account carries its temporary credit entry in the
      ledger. That amount is settled only once no temporary credit remains outstanding on a billing dispute the card
      account records as resolved against the cardholder. Under the standard method the coverage share is
      coverage_share_standard, the coverage share acts on the payable balance alone, the amount is spread over
      spread_cycles_standard statement cycles, no carryover addition is made, the figure is rounded half-up to the cent,
      and the fixed monthly amount is the lesser of that figure and the payable balance.
      The coverage share turns on the checking relationship and on how steadily the card has been paid. Where the
      cardholder holds an active Premier Checking or Private Client Checking account and at least payments_deep_count
      card payments posted to this card account in the last twelve months, the coverage share is coverage_share_full.
      Where the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client
      Checking and at least payments_deep_count card payments posted to this card account in the last twelve months, the
      coverage share is coverage_share_mid. Where neither of those holds, the coverage share is coverage_share_standard.
      What the coverage share acts on turns on the money the cardholder moves through PCB checking. Where PCB checking
      deposits posted to the cardholder's checking accounts in the last six months total at least
      checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the
      coverage share acts on the payable balance together with the interest billed to the card account in the last
      month. Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was
      posted to those accounts in the last six months, the coverage share acts on the payable balance less the merchant
      credits posted to the card account in the last six months. Where those deposits total less than
      checking_deposit_volume_high, the coverage share acts on the payable balance alone.
      How many statement cycles the amount is spread over turns on the savings relationship. Where the cardholder holds
      an active savings account whose balance is at least savings_relationship_balance and at least
      savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months,
      the amount is spread over spread_cycles_long statement cycles. Where the cardholder holds an active savings
      account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit
      posted to the cardholder's savings accounts in the last three months, the amount is spread over spread_cycles_mid
      statement cycles. Where neither of those holds, the amount is spread over spread_cycles_standard statement cycles.
      A carryover addition covers the recurring cost of an account that has been running late. Where at least
      late_fee_count_low late payment fee has been billed to the card account in the last six months and the interest
      billed to it in the last six months totals at least interest_burden_high, the carryover addition is
      carryover_addition_high. Where at least late_fee_count_low late payment fee has been billed to the card account in
      the last six months and that interest totals less than interest_burden_high, the carryover addition is
      carryover_addition_mid. Where no late payment fee has been billed to the card account in the last six months, the
      carryover addition is carryover_addition_none.
      Where the carryover addition enters the calculation turns on the age of the account and on recent card use. Where
      the card account has been open at least seasoned_account_months whole months and card purchases posted to it in
      the last six months total at least purchase_recent_high, the carryover addition is added to the product of the
      coverage share before the amount is spread over the statement cycles. Where the card account has been open at
      least seasoned_account_months whole months and those purchases total less than purchase_recent_high, the product
      of the coverage share is spread over the statement cycles first and the carryover addition is added to the spread
      figure afterwards. Where the card account has been open less than seasoned_account_months whole months, no
      carryover addition is made.
      The rounding of the resulting figure turns on the certificate relationship. Where the cardholder holds an active
      certificate whose principal balance is at least certificate_balance_high and at least
      certificate_payout_count_low certificate interest payout posted to the cardholder's certificates in the last six
      months, the figure is rounded half-up to the nearest whole dollar. Where the cardholder holds an active
      certificate whose principal balance is below certificate_balance_high and at least certificate_payout_count_low
      certificate interest payout posted to the cardholder's certificates in the last six months, the figure is reduced
      to the whole dollar below it. Where neither of those holds, the figure is rounded half-up to the cent.
      A cardholder who asks for a standing instruction on an account whose payable balance is zero is out of scope of
      this rule and no fixed monthly amount is set.
    prerequisite:
      - problem: card_ext_dispute_provisional_credit
        kind: value_input
        gate: payable_balance
        form: state
        policy_source: >-
          The fixed monthly amount of a standing automatic payment instruction is settled only after every billing
          dispute standing in submitted status on the card account carries its temporary credit entry in the ledger.
        condition: >-
          Every billing dispute row on the target card account whose dispute status is submitted is named by a card
          ledger entry that is a dispute credit carrying the provisional dispute adjustment reason.
        resolved_by: post_card_dispute_credit_83d80881
        effect: >-
          Once that temporary credit entry is posted, the dispute credits standing on the card ledger rise by the
          credited amount, so the payable_balance binding falls by that amount and the fixed monthly amount falls with
          it.
      - problem: card_ext_dispute_rebill_recovery
        kind: value_input
        gate: payable_balance
        form: state
        policy_source: >-
          That amount is settled only once no temporary credit remains outstanding on a billing dispute the card account
          records as resolved against the cardholder.
        condition: >-
          Every billing dispute row on the target card account whose dispute status is resolved against the cardholder
          has its temporary credit entry named as the source item of a dispute rebill entry on the same card account.
        resolved_by: rebill_card_dispute_credit_f8e84f35
        effect: >-
          Once that rebill entry is posted, the charges standing on the card ledger rise by the rebilled amount, so the
          payable_balance binding rises by that amount and the fixed monthly amount rises with it.
    cross_category:
      - category: checking
        as: branch
        reads: [variant_name, status, checking_transactions.amount]
        note: "The checking tier decides the coverage-share tier; the six-month deposit total and fee count decide what the coverage share acts on."
      - category: savings
        as: history
        reads: [status, current_balance, savings_transactions.amount]
        note: "The savings balance and the count of savings deposits in the last three months decide how many statement cycles the amount is spread over."
      - category: cd
        as: history
        reads: [status, principal_balance, cd_transactions.amount]
        note: "The certificate principal and the count of certificate interest payouts in the last six months decide the rounding tier."
    compute:
      - charges_total: "SUM('card_transactions','amount', date_field='posted_date', event_type='card_purchase') + SUM('card_transactions','amount', date_field='posted_date', event_type='card_cash_advance') + SUM('card_transactions','amount', date_field='posted_date', event_type='card_fee') + SUM('card_transactions','amount', date_field='posted_date', event_type='card_interest_charge') + SUM('card_transactions','amount', date_field='posted_date', event_type='card_payment_return') + SUM('card_transactions','amount', date_field='posted_date', event_type='card_dispute_rebill')"
      - credits_total: "SUM('card_transactions','amount', date_field='posted_date', event_type='card_payment') + SUM('card_transactions','amount', date_field='posted_date', event_type='card_merchant_credit') + SUM('card_transactions','amount', date_field='posted_date', event_type='card_fee_reversal') + SUM('card_transactions','amount', date_field='posted_date', event_type='card_interest_reversal') + SUM('card_transactions','amount', date_field='posted_date', event_type='card_dispute_credit') + SUM('card_transactions','amount', date_field='posted_date', event_type='card_rewards_credit')"
      - payable_balance: "MX(charges_total - credits_total, 0)"
      - payments_12m: "COUNT('card_transactions', within_months=12, date_field='posted_date', event_type='card_payment')"
      - checking_tier: "CFIELD('checking','variant_name', status='active')"
      - coverage_share: "(K('coverage_share_full') if ((checking_tier == 'Premier Checking' or checking_tier == 'Private Client Checking') and payments_12m >= K('payments_deep_count')) else (K('coverage_share_mid') if (checking_tier != None and checking_tier != 'Premier Checking' and checking_tier != 'Private Client Checking' and payments_12m >= K('payments_deep_count')) else K('coverage_share_standard')))"
      - interest_1m: "SUM('card_transactions','amount', within_months=1, date_field='posted_date', event_type='card_interest_charge')"
      - merchant_credits_6m: "SUM('card_transactions','amount', within_months=6, date_field='posted_date', event_type='card_merchant_credit')"
      - checking_deposits_6m: "XSUM('checking','checking_transactions','amount', within_months=6, date_field='posted_date', event_type='checking_deposit')"
      - checking_fees_6m: "XCOUNT('checking','checking_transactions', within_months=6, date_field='posted_date', event_type='checking_fee')"
      - coverage_base: "(payable_balance + interest_1m if (checking_deposits_6m >= K('checking_deposit_volume_high') and checking_fees_6m == 0) else (payable_balance - merchant_credits_6m if (checking_deposits_6m >= K('checking_deposit_volume_high') and checking_fees_6m > 0) else payable_balance))"
      - savings_balance: "float(CFIELD('savings','current_balance', status='active') or 0)"
      - savings_deposits_3m: "XCOUNT('savings','savings_transactions', within_months=3, date_field='posted_date', event_type='savings_deposit')"
      - has_savings: "EXISTS('savings', status='active')"
      - spread_cycles: "(K('spread_cycles_long') if (savings_balance >= K('savings_relationship_balance') and savings_deposits_3m >= K('savings_deposit_count_low')) else (K('spread_cycles_mid') if (has_savings and savings_balance < K('savings_relationship_balance') and savings_deposits_3m >= K('savings_deposit_count_low')) else K('spread_cycles_standard')))"
      - late_fees_6m: "COUNT('card_transactions', within_months=6, date_field='posted_date', event_type='card_fee', fee_code='late_payment')"
      - interest_6m: "SUM('card_transactions','amount', within_months=6, date_field='posted_date', event_type='card_interest_charge')"
      - carryover_addition: "(K('carryover_addition_high') if (late_fees_6m >= K('late_fee_count_low') and interest_6m >= K('interest_burden_high')) else (K('carryover_addition_mid') if (late_fees_6m >= K('late_fee_count_low') and interest_6m < K('interest_burden_high')) else K('carryover_addition_none')))"
      - months_open: "MONTHS(F('opened_date'), NOW)"
      - purchases_6m: "SUM('card_transactions','amount', within_months=6, date_field='posted_date', event_type='card_purchase')"
      - spread_amount: "((coverage_base * coverage_share + carryover_addition) / spread_cycles if (months_open >= K('seasoned_account_months') and purchases_6m >= K('purchase_recent_high')) else (coverage_base * coverage_share / spread_cycles + carryover_addition if (months_open >= K('seasoned_account_months') and purchases_6m < K('purchase_recent_high')) else coverage_base * coverage_share / spread_cycles))"
      - cd_principal: "float(CFIELD('cd','principal_balance', status='active') or 0)"
      - cd_payouts_6m: "XCOUNT('cd','cd_transactions', within_months=6, date_field='posted_date', event_type='cd_interest_payout')"
      - has_cd: "EXISTS('cd', status='active')"
      - rounded_amount: "(RND(spread_amount, 0) if (cd_principal >= K('certificate_balance_high') and cd_payouts_6m >= K('certificate_payout_count_low')) else (float(int(spread_amount)) if (has_cd and cd_principal < K('certificate_balance_high') and cd_payouts_6m >= K('certificate_payout_count_low')) else RND(spread_amount, 2)))"
      - result: "MN(rounded_amount, payable_balance)"
    compute_basis:
      charges_total: "The payable balance is the charges standing on the card ledger, being its purchases, cash advances, cash advance and other fees, billed interest, returned payments and dispute rebills, less the credits standing on it, being its payments, merchant credits, fee reversals, interest reversals, dispute credits and rewards statement credits, and never less than zero."
      credits_total: "The payable balance is the charges standing on the card ledger, being its purchases, cash advances, cash advance and other fees, billed interest, returned payments and dispute rebills, less the credits standing on it, being its payments, merchant credits, fee reversals, interest reversals, dispute credits and rewards statement credits, and never less than zero."
      payable_balance: "The payable balance is the charges standing on the card ledger, being its purchases, cash advances, cash advance and other fees, billed interest, returned payments and dispute rebills, less the credits standing on it, being its payments, merchant credits, fee reversals, interest reversals, dispute credits and rewards statement credits, and never less than zero."
      payments_12m: "Where the cardholder holds an active Premier Checking or Private Client Checking account and at least payments_deep_count card payments posted to this card account in the last twelve months, the coverage share is coverage_share_full."
      checking_tier: "Where the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least payments_deep_count card payments posted to this card account in the last twelve months, the coverage share is coverage_share_mid."
      coverage_share: "Where the cardholder holds an active Premier Checking or Private Client Checking account and at least payments_deep_count card payments posted to this card account in the last twelve months, the coverage share is coverage_share_full. Where the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least payments_deep_count card payments posted to this card account in the last twelve months, the coverage share is coverage_share_mid. Where neither of those holds, the coverage share is coverage_share_standard."
      interest_1m: "Where PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the coverage share acts on the payable balance together with the interest billed to the card account in the last month."
      merchant_credits_6m: "Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the coverage share acts on the payable balance less the merchant credits posted to the card account in the last six months."
      checking_deposits_6m: "Where those deposits total less than checking_deposit_volume_high, the coverage share acts on the payable balance alone."
      checking_fees_6m: "Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the coverage share acts on the payable balance less the merchant credits posted to the card account in the last six months."
      coverage_base: "Where PCB checking deposits posted to the cardholder's checking accounts in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months, the coverage share acts on the payable balance together with the interest billed to the card account in the last month. Where those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months, the coverage share acts on the payable balance less the merchant credits posted to the card account in the last six months. Where those deposits total less than checking_deposit_volume_high, the coverage share acts on the payable balance alone."
      savings_balance: "Where the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the amount is spread over spread_cycles_long statement cycles."
      savings_deposits_3m: "Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the amount is spread over spread_cycles_mid statement cycles."
      has_savings: "Where neither of those holds, the amount is spread over spread_cycles_standard statement cycles."
      spread_cycles: "Where the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the amount is spread over spread_cycles_long statement cycles. Where the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit posted to the cardholder's savings accounts in the last three months, the amount is spread over spread_cycles_mid statement cycles. Where neither of those holds, the amount is spread over spread_cycles_standard statement cycles."
      late_fees_6m: "Where at least late_fee_count_low late payment fee has been billed to the card account in the last six months and the interest billed to it in the last six months totals at least interest_burden_high, the carryover addition is carryover_addition_high."
      interest_6m: "Where at least late_fee_count_low late payment fee has been billed to the card account in the last six months and that interest totals less than interest_burden_high, the carryover addition is carryover_addition_mid."
      carryover_addition: "Where at least late_fee_count_low late payment fee has been billed to the card account in the last six months and the interest billed to it in the last six months totals at least interest_burden_high, the carryover addition is carryover_addition_high. Where at least late_fee_count_low late payment fee has been billed to the card account in the last six months and that interest totals less than interest_burden_high, the carryover addition is carryover_addition_mid. Where no late payment fee has been billed to the card account in the last six months, the carryover addition is carryover_addition_none."
      months_open: "Where the card account has been open less than seasoned_account_months whole months, no carryover addition is made."
      purchases_6m: "Where the card account has been open at least seasoned_account_months whole months and card purchases posted to it in the last six months total at least purchase_recent_high, the carryover addition is added to the product of the coverage share before the amount is spread over the statement cycles."
      spread_amount: "Where the card account has been open at least seasoned_account_months whole months and card purchases posted to it in the last six months total at least purchase_recent_high, the carryover addition is added to the product of the coverage share before the amount is spread over the statement cycles. Where the card account has been open at least seasoned_account_months whole months and those purchases total less than purchase_recent_high, the product of the coverage share is spread over the statement cycles first and the carryover addition is added to the spread figure afterwards. Where the card account has been open less than seasoned_account_months whole months, no carryover addition is made."
      cd_principal: "Where the cardholder holds an active certificate whose principal balance is at least certificate_balance_high and at least certificate_payout_count_low certificate interest payout posted to the cardholder's certificates in the last six months, the figure is rounded half-up to the nearest whole dollar."
      cd_payouts_6m: "Where the cardholder holds an active certificate whose principal balance is below certificate_balance_high and at least certificate_payout_count_low certificate interest payout posted to the cardholder's certificates in the last six months, the figure is reduced to the whole dollar below it."
      has_cd: "Where neither of those holds, the figure is rounded half-up to the cent."
      rounded_amount: "Where the cardholder holds an active certificate whose principal balance is at least certificate_balance_high and at least certificate_payout_count_low certificate interest payout posted to the cardholder's certificates in the last six months, the figure is rounded half-up to the nearest whole dollar. Where the cardholder holds an active certificate whose principal balance is below certificate_balance_high and at least certificate_payout_count_low certificate interest payout posted to the cardholder's certificates in the last six months, the figure is reduced to the whole dollar below it. Where neither of those holds, the figure is rounded half-up to the cent."
      result: "the fixed monthly amount is the lesser of that figure and the payable balance"
    factors:
      - id: coverage_share_ladder
        effect: parameter
        decides: coverage_share
        bindings: [payments_12m, checking_tier, coverage_share]
        ladder:
          - when: "the cardholder holds an active Premier Checking or Private Client Checking account and at least payments_deep_count card payments posted to this card account in the last twelve months"
            value: "K('coverage_share_full')"
          - when: "the cardholder holds an active checking account whose tier is neither Premier Checking nor Private Client Checking and at least payments_deep_count card payments posted to this card account in the last twelve months"
            value: "K('coverage_share_mid')"
          - when: "otherwise"
            value: "K('coverage_share_standard')"
        baseline:
          coverage_share: "K('coverage_share_standard')"
        evidence: [history, cross_category]
        cross_difficulty: checking
      - id: coverage_base_convention
        effect: method
        decides: coverage_base
        bindings: [interest_1m, merchant_credits_6m, checking_deposits_6m, checking_fees_6m, coverage_base]
        ladder:
          - when: "PCB checking deposits in the last six months total at least checking_deposit_volume_high and no PCB checking fee was posted to those accounts in the last six months"
            method: "the coverage share acts on the payable balance together with the interest billed to the card account in the last month"
          - when: "those deposits total at least checking_deposit_volume_high and at least one PCB checking fee was posted to those accounts in the last six months"
            method: "the coverage share acts on the payable balance less the merchant credits posted to the card account in the last six months"
          - when: "otherwise"
            method: "the coverage share acts on the payable balance alone"
        baseline:
          coverage_base: "payable_balance"
        evidence: [history, cross_category]
        cross_difficulty: checking
      - id: spread_cycles_ladder
        effect: parameter
        decides: spread_cycles
        bindings: [savings_balance, savings_deposits_3m, has_savings, spread_cycles]
        ladder:
          - when: "the cardholder holds an active savings account whose balance is at least savings_relationship_balance and at least savings_deposit_count_low savings deposit posted in the last three months"
            value: "K('spread_cycles_long')"
          - when: "the cardholder holds an active savings account whose balance is below savings_relationship_balance and at least savings_deposit_count_low savings deposit posted in the last three months"
            value: "K('spread_cycles_mid')"
          - when: "otherwise"
            value: "K('spread_cycles_standard')"
        baseline:
          spread_cycles: "K('spread_cycles_standard')"
        evidence: [history, cross_category]
        cross_difficulty: savings
      - id: carryover_addition_ladder
        effect: parameter
        decides: carryover_addition
        bindings: [late_fees_6m, interest_6m, carryover_addition]
        ladder:
          - when: "at least late_fee_count_low late payment fee has been billed to the card account in the last six months and the interest billed to it in the last six months totals at least interest_burden_high"
            value: "K('carryover_addition_high')"
          - when: "at least late_fee_count_low late payment fee has been billed to the card account in the last six months and that interest totals less than interest_burden_high"
            value: "K('carryover_addition_mid')"
          - when: "otherwise"
            value: "K('carryover_addition_none')"
        baseline:
          carryover_addition: "K('carryover_addition_none')"
        evidence: [history]
        cross_difficulty: null
      - id: addition_entry_order
        effect: method
        decides: spread_amount
        bindings: [months_open, purchases_6m, spread_amount]
        ladder:
          - when: "the card account has been open at least seasoned_account_months whole months and card purchases posted to it in the last six months total at least purchase_recent_high"
            method: "the carryover addition is added to the product of the coverage share before the amount is spread over the statement cycles"
          - when: "the card account has been open at least seasoned_account_months whole months and those purchases total less than purchase_recent_high"
            method: "the product of the coverage share is spread over the statement cycles first and the carryover addition is added to the spread figure afterwards"
          - when: "otherwise"
            method: "no carryover addition is made"
        baseline:
          spread_amount: "coverage_base * coverage_share / spread_cycles"
        evidence: [history, date]
        cross_difficulty: null
      - id: instalment_rounding_convention
        effect: method
        decides: rounded_amount
        bindings: [cd_principal, cd_payouts_6m, has_cd, rounded_amount]
        ladder:
          - when: "the cardholder holds an active certificate whose principal balance is at least certificate_balance_high and at least certificate_payout_count_low certificate interest payout posted in the last six months"
            method: "the figure is rounded half-up to the nearest whole dollar"
          - when: "the cardholder holds an active certificate whose principal balance is below certificate_balance_high and at least certificate_payout_count_low certificate interest payout posted in the last six months"
            method: "the figure is reduced to the whole dollar below it"
          - when: "otherwise"
            method: "the figure is rounded half-up to the cent"
        baseline:
          rounded_amount: "RND(spread_amount, 2)"
        evidence: [history, cross_category]
        cross_difficulty: cd
    baseline:
      rule: >-
        The payable balance is the charges standing on the card ledger, being its purchases, cash advances, cash advance
        and other fees, billed interest, returned payments and dispute rebills, less the credits standing on it, being
        its payments, merchant credits, fee reversals, interest reversals, dispute credits and rewards statement
        credits, and never less than zero. Under the standard method the coverage share is coverage_share_standard, the
        coverage share acts on the payable balance alone, the amount is spread over spread_cycles_standard statement
        cycles, no carryover addition is made, the figure is rounded half-up to the cent, and the fixed monthly amount
        is the lesser of that figure and the payable balance.
      params: [coverage_share_standard, spread_cycles_standard, carryover_addition_none]
    inputs:
      history:
        - {table: card_transactions, aggregate: sum, field: amount, within_months: null, filters: {event_type: card_purchase}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: null, filters: {event_type: card_dispute_credit}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: null, filters: {event_type: card_dispute_rebill}}
        - {table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_payment}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: card_interest_charge}}
        - {category: checking, table: checking_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: checking_deposit}}
        - {category: savings, table: savings_transactions, aggregate: count, field: amount, within_months: 3, filters: {event_type: savings_deposit}}
        - {category: cd, table: cd_transactions, aggregate: count, field: amount, within_months: 6, filters: {event_type: cd_interest_payout}}
      cross_category: [checking, savings, cd]
