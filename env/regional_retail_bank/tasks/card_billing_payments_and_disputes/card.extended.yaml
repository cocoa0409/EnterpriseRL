      rounded_points: "Where the card account has been open at least seasoned_account_months whole months and at least prior_redemption_count rewards redemptions have already been posted to it, the quotient is raised to the next whole multiple of five hundred points. Where the card account has been open at least seasoned_account_months whole months and fewer than prior_redemption_count rewards redemptions have been posted to it, the quotient is raised to the next whole multiple of one hundred points. Where the card account has been open less than seasoned_account_months whole months, the quotient is rounded half-up to a whole point."
