  overwrite:
  - base_policy: cd_evt_early_withdrawal
    superseded_clause: 'The penalty basis is the principal the request removes: the requested amount for a partial, and the whole principal_balance after crediting accrued interest for a full withdrawal.'
    replaced_by: 'The principal the entry is worked out on is measured as follows: where the owner holds an active Piedmont Crescent card opened before the term began and interest was credited to the certificate in each of the three months before the entry is booked, it is the principal taken out by early partial withdrawals in those three months together with the interest credited in them; where the owner holds an active Piedmont Crescent card and either that card was opened after the term began or interest was credited in fewer than each of those three months, it is the principal taken out by early partial withdrawals in those three months less the interest credited in them; where the owner holds no active card, it is the principal taken out by early partial withdrawals in those three months.'
  - base_policy: cd_evt_early_withdrawal
    superseded_clause: penalty_days is early_withdrawal_penalty_days, except that on principal withdrawn within six calendar days after funding it is the greater of early_withdrawal_penalty_days and first_six_days_minimum_penalty_days on every tier.
    replaced_by: 'The days the entry runs over are measured as follows: where the owner''s active savings or money market balance is at least the tier''s smallest opening deposit and interest was credited to the certificate in each of the three months before the entry is booked, the days that passed between the day the principal left and the day the entry is booked are added to the days the tier publishes, and the total is held to no more than the days the tier publishes increased by half; where that balance is at least the tier''s smallest opening deposit but interest was credited in fewer than each of those months, the days are half the days the tier publishes, rounded down to a whole day; in every other case, whatever savings or money market account the owner holds and whatever it holds in it, the days are the days the tier publishes.'
  - base_policy: cd_evt_early_withdrawal
    superseded_clause: The penalty equals the penalty basis times interest_rate divided by 100 times penalty_days divided by day_count_basis, rounded half-up to the cent.
    replaced_by: 'The rate the entry runs at is graded: an owner with an auto loan at the bank that is not past due and at least twelve payments posted to it is charged at the tier''s published standard interest rate; an owner with an auto loan at the bank that is not past due and fewer than twelve payments posted to it is charged at the rate the certificate carries less the tier''s jumbo bonus points; every other owner is charged at the rate the certificate carries.'
