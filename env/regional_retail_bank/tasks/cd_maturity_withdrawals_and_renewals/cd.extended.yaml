# Policy charter: Certificates of Deposit. Piedmont Crescent Bank, N.A.
# Single registry of every certificate number; the runtime never reads this file.

category: cd
display_name: Certificates of Deposit

binding:
  holding_table: cd_certificates
  event_tables: [cd_transactions]
  intake_tables: [cd_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_balance: cd_principal}

lifecycle:
  states: [applied, active, grace_period, closed]
  transitions:
    - {from: applied, to: active, by: system, means: "The opening deposit posted, fixing the term start date and maturity date."}
    - {from: applied, to: closed, by: system, means: "The certificate was not funded within the funding window and was closed as unfunded."}
    - {from: active, to: grace_period, by: system, means: "The certificate reached its maturity date and entered the grace period."}
    - {from: grace_period, to: active, by: system, means: "The grace period ended with a renewal instruction in force, or the owner renewed during grace, starting a new term."}
    - {from: active, to: closed, by: user, means: "The owner confirmed a full early withdrawal and the certificate closed before maturity."}
    - {from: grace_period, to: closed, by: user, means: "The owner withdrew the full balance during grace, or the grace period ended with a payout instruction, and the certificate closed."}

accounts:
  - key: cd_principal
    unit: USD
    meaning: "The principal balance of one certificate, including interest compounded into it and net of penalties and withdrawals."

parameter_schema:
  term_months: "Length of one term of this certificate; integer calendar months."
  rate_type: "Rate structure: 'fixed', 'fixed_no_penalty' or 'bump_up'."
  minimum_opening_deposit: "Smallest opening deposit; USD."
  maximum_opening_deposit: "Largest principal a single certificate of this tier may hold, including add-ons; USD."
  new_money_required: "Whether the opening deposit must come from outside PCB (not an internal transfer from a PCB account); boolean."
  funding_sources_allowed: "Ways the opening deposit may arrive; list of funding_source values."
  funding_window_days: "Calendar days after opening within which the opening deposit must post; integer calendar days."
  standard_apy: "Currently published annual percentage yield for a new term of this tier, before bonuses; percent."
  standard_interest_rate: "Currently published interest rate for a new term of this tier, before bonuses, compounded daily to produce standard_apy; percent."
  jumbo_eligible: "Whether the jumbo bonus is offered on this tier; boolean."
  jumbo_threshold: "Principal at term start at or above which the jumbo bonus applies; USD."
  jumbo_apy_bonus: "Percentage points added to both the rate and the APY when the jumbo bonus applies; percent."
  relationship_apy_bonus: "Percentage points added to both the rate and the APY when the relationship bonus applies; percent."
  relationship_qualifying_checking_tiers: "Checking tiers whose active holding at term start earns the relationship bonus; list of official checking tier names."
  compounding_frequency: "How often accrued interest is added to the interest base; 'daily'."
  day_count_basis: "Days in the year used to compute daily interest; integer days."
  interest_crediting_frequency: "When accrued interest is credited: 'monthly' on the last calendar day of each month, or 'at_maturity'."
  interest_payout_options: "Interest dispositions the owner may choose; list of values from compound, pay_to_checking, pay_to_savings."
  early_withdrawal_penalty_days: "Days of simple interest charged as the penalty on principal withdrawn before maturity; integer days."
  first_six_days_minimum_penalty_days: "Minimum penalty, in days of simple interest, on principal withdrawn within six calendar days after funding, whatever the tier; integer days."
  penalty_free_withdrawal_after_days: "Calendar days after funding after which a full withdrawal carries no penalty; integer days, or 'not_offered'."
  penalty_rate_basis: "Rate used in the penalty calculation; 'certificate_interest_rate' means the interest_rate on the certificate."
  penalty_may_reduce_principal: "Whether a penalty larger than interest earned is taken from principal; boolean."
  partial_early_withdrawal_allowed: "Whether part of the principal may be withdrawn before maturity; boolean."
  partial_withdrawal_min_amount: "Smallest early partial withdrawal; USD, or 'not_applicable'."
  minimum_balance_after_partial: "Principal that must remain after an early partial withdrawal; USD, or 'not_applicable'."
  max_partial_withdrawals_per_term: "Most early partial withdrawals in one term; integer count."
  interest_withdrawal_penalty_free: "Whether interest already credited during the current term may be withdrawn without penalty; boolean."
  grace_period_days: "Calendar days after the maturity date during which the owner may add, withdraw or change term without penalty; integer calendar days."
  grace_add_on_allowed: "Whether deposits may be added during the grace period; boolean."
  grace_add_on_min_amount: "Smallest single deposit accepted during the grace period; USD."
  grace_add_on_max_amount: "Most that may be added in total during one grace period; USD."
  grace_partial_withdrawal_allowed: "Whether part of the balance may be withdrawn penalty-free during the grace period; boolean."
  grace_term_change_allowed: "Whether the owner may renew into a different certificate tier during the grace period; boolean."
  grace_days_earn_interest_if_withdrawn: "Whether principal withdrawn during the grace period earns interest for the grace days before withdrawal; boolean."
  term_add_on_max_count: "Most deposits that may be added during a term, outside grace; integer count."
  term_add_on_min_amount: "Smallest single in-term add-on deposit; USD, or 'not_applicable'."
  term_add_on_max_amount: "Most that may be added in total during one term, outside grace; USD, or 'not_applicable'."
  bump_up_allowed_count: "Rate increases the owner may request per term; integer count."
  bump_up_window_months: "Calendar months after the term start date within which a bump-up request is accepted; integer months, or 'not_applicable'."
  auto_renew_available: "Whether the certificate may renew automatically at maturity; boolean."
  renewal_target_tier: "Official tier name the certificate renews into when the owner makes no term change; tier name."
  renewal_rate_basis: "Rate applied on renewal; 'published_on_maturity_date' means the target tier's standard_apy and standard_interest_rate on the maturity date plus any bonuses then earned."
  maturity_notice_days_before: "Calendar days before the maturity date on which the maturity notice is mailed; integer days."
  max_certificates_this_tier: "Most open certificates of this tier one customer may hold; integer count."
  age_min_to_open: "Youngest age in whole years on the opening date at which a customer may open this tier; integer years."
  death_or_incompetence_waiver: "Whether the early withdrawal penalty is waived after the owner's death or court-adjudicated incompetence; boolean."
  payout_methods: "Ways maturity or withdrawal proceeds may be paid; list of destination values."
  relationship_bonus_on_renewal: "Whether the relationship bonus is re-evaluated and may be earned at each renewal; boolean."

