events:
  # ---------------- holding writes (cd_certificates) ----------------
  - type: cd_open
    target: cd_certificates
    mutation: create
    meaning: "A certificate is opened in one tier at the rate and APY fixed on the opening date and awaits funding."
    grain: "One row per certificate opened."
    fields:
      customer_id: "The owner."
      variant_name: "Official tier name."
      status: "Always applied at creation."
      certificate_number_last4: "Last four digits of the certificate number."
      opened_date: "Date the certificate was opened."
      principal_balance: "Always 0.00 at creation."
      interest_rate: "Rate fixed at opening: standard_interest_rate plus any bonus points earned."
      apy: "APY fixed at opening: standard_apy plus the same bonus points."
      jumbo_bonus_applied: "Whether the jumbo bonus is included in the rate."
      relationship_bonus_applied: "Whether the relationship bonus is included in the rate."
      renewal_instruction: "What happens at maturity."
      interest_disposition: "Where monthly interest goes."
      payout_account_id: "PCB account receiving paid-out interest or proceeds, empty when none."
      bump_up_used: "Always false at creation."
      renewal_count: "Always 0 at creation."
    triggers: []
  - type: cd_fund
    target: cd_certificates
    mutation: {transition: {from: applied, to: active}}
    meaning: "The opening deposit posted; the term starts and the maturity date is fixed."
    grain: "One row per certificate funded."
    fields:
      status: "Set to active."
      term_start_date: "Posted date of the opening deposit."
      maturity_date: "term_start_date plus term_months calendar months."
    triggers: []
  - type: cd_lapse_unfunded
    target: cd_certificates
    mutation: {transition: {from: applied, to: closed}}
    meaning: "A certificate never funded within the funding window is closed."
    grain: "One row per unfunded certificate closed."
    fields:
      status: "Set to closed."
      closed_date: "Date the certificate was closed."
    triggers: []
  - type: cd_mature
    target: cd_certificates
    mutation: {transition: {from: active, to: grace_period}}
    meaning: "The certificate reaches its maturity date and its grace period begins."
    grain: "One row per maturity."
    fields:
      status: "Set to grace_period."
    triggers: []
  - type: cd_renew
    target: cd_certificates
    mutation: {transition: {from: grace_period, to: active}}
    meaning: "A new term starts, either automatically at the end of grace or at the owner's renewal during grace, possibly in a different tier."
    grain: "One row per renewal."
    fields:
      status: "Set to active."
      variant_name: "Tier of the new term."
      term_start_date: "First day of the new term."
      maturity_date: "New term_start_date plus the new tier's term_months calendar months."
      interest_rate: "Rate of the new term."
      apy: "APY of the new term."
      jumbo_bonus_applied: "Whether the jumbo bonus applies to the new term."
      relationship_bonus_applied: "Whether the relationship bonus applies to the new term."
      bump_up_used: "Reset to false for the new term."
      renewal_count: "Previous value plus one."
    triggers: []
  - type: cd_close
    target: cd_certificates
    mutation: {transition: [{from: active, to: closed}, {from: grace_period, to: closed}]}
    meaning: "The certificate closes after its full balance was paid out, early or at maturity."
    grain: "One row per closure."
    fields:
      status: "Set to closed."
      closed_date: "Date the certificate closed."
    triggers: []
  - type: cd_update_instructions
    target: cd_certificates
    mutation: update
    meaning: "The owner changes the renewal instruction, the interest disposition or the payout account."
    grain: "One row per instruction change."
    fields:
      renewal_instruction: "New maturity instruction."
      interest_disposition: "New interest disposition."
      payout_account_id: "New payout account, or empty."
    triggers: []
  - type: cd_bump_rate
    target: cd_certificates
    mutation: update
    meaning: "The rate of a bump-up certificate is raised to the currently published rate for the rest of the term."
    grain: "One row per bump-up."
    fields:
      interest_rate: "New rate: current standard_interest_rate plus the bonus points already applied this term."
      apy: "New APY: current standard_apy plus the same bonus points."
      bump_up_used: "Set to true."
    triggers: []
  # ---------------- ledger writes (cd_transactions) ----------------
  - type: cd_deposit
    target: cd_transactions
    meaning: "Principal is deposited: the opening deposit, a grace-period add-on or an in-term add-on."
    grain: "One row per deposit item, identified by its trace number."
    distinguish_by: [trace_number]
    fields:
      amount: "Amount deposited, positive."
      posted_date: "Business day the deposit posted."
      deposit_kind: "opening, grace_add_on or term_add_on."
      funding_source: "Where the money came from."
      trace_number: "Unique posting trace number."
      counterparty_account_id: "The PCB account the funds came from for an internal transfer, otherwise empty."
    account: cd_principal
    direction: in
    triggers:
      - event: "checking:checking_debit"
        when: {funding_source: pcb_checking}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: certificate_id}
      - event: "savings:savings_withdrawal"
        when: {funding_source: pcb_savings}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: certificate_id}
  - type: cd_interest_compound
    target: cd_transactions
    meaning: "Accrued interest is credited into the certificate's principal."
    grain: "One row per certificate per interest period."
    distinguish_by: [interest_period]
    fields:
      amount: "Interest credited, positive."
      posted_date: "Crediting date: the last calendar day of the month, the maturity date, or the closure date."
      interest_period: "Month for which the interest is credited."
      rate_applied: "Interest rate used for the period."
    account: cd_principal
    direction: in
    triggers: []
  - type: cd_interest_payout
    target: cd_transactions
    meaning: "Accrued interest is paid out to another PCB account instead of compounding; the certificate principal is unchanged."
    grain: "One row per certificate per interest period."
    distinguish_by: [interest_period]
    fields:
      amount: "Interest paid out, positive."
      posted_date: "Crediting date."
      interest_period: "Month for which the interest is paid."
      rate_applied: "Interest rate used for the period."
      destination: "checking or savings."
      counterparty_account_id: "The receiving PCB account."
    triggers:
      - event: "checking:checking_deposit"
        when: {destination: checking}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: certificate_id}
      - event: "savings:savings_deposit"
        when: {destination: savings}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: certificate_id}
  - type: cd_withdrawal
    target: cd_transactions
    meaning: "Principal leaves the certificate: an early partial or full withdrawal, a penalty-free withdrawal, a grace-period or maturity payout, or a withdrawal of credited interest."
    grain: "One row per withdrawal request carried out."
    distinguish_by: [withdrawal_kind, posted_date]
    fields:
      amount: "Amount paid out to the owner, positive."
      posted_date: "Business day of the withdrawal."
      withdrawal_kind: "Which kind of withdrawal this is."
      destination: "Where the proceeds went."
      counterparty_account_id: "Receiving PCB account, empty for an official check."
    account: cd_principal
    direction: out
    triggers:
      - event: "cd:cd_penalty"
        when: {withdrawal_kind: [early_partial, early_full]}
        map: {source_item_id: cd_txn_id, posted_date: posted_date}
      - event: "checking:checking_deposit"
        when: {destination: checking}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: certificate_id}
      - event: "savings:savings_deposit"
        when: {destination: savings}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: certificate_id}
  - type: cd_penalty
    target: cd_transactions
    meaning: "An early withdrawal penalty is deducted from the certificate."
    grain: "One row per penalized withdrawal."
    distinguish_by: [source_item_id]
    fields:
      amount: "Penalty amount, positive."
      posted_date: "Business day of the withdrawal it belongs to."
      source_item_id: "The early withdrawal that incurred it."
      penalty_days: "Days of interest charged."
      rate_applied: "Interest rate used in the calculation."
    account: cd_principal
    direction: out
    triggers: []
  - type: cd_penalty_reversal
    target: cd_transactions
    meaning: "A penalty assessed in error, or waived under the death or incompetence waiver, is credited back."
    grain: "One row per penalty reversed."
    distinguish_by: [source_item_id]
    fields:
      amount: "Amount credited back, equal to the penalty."
      posted_date: "Business day of the reversal."
      source_item_id: "The penalty being reversed."
      adjustment_reason: "bank_error or death_waiver."
    account: cd_principal
    direction: in
    triggers: []

measures:
  - id: cd_msr_term_partial_withdrawals
    window: "The current term: from term_start_date through the frozen date."
    measure: "Count of cd_withdrawal rows with withdrawal_kind early_partial posted in the window."
  - id: cd_msr_term_add_ons
    window: "The current term, excluding the grace period that precedes it."
    measure: "Count and USD sum of cd_deposit rows with deposit_kind term_add_on posted since term_start_date."
  - id: cd_msr_grace_add_ons
    window: "The current grace period: from the day after maturity_date through the frozen date."
    measure: "USD sum of cd_deposit rows with deposit_kind grace_add_on posted in the window."
  - id: cd_msr_term_credited_interest
    window: "The current term: from term_start_date through the frozen date."
    measure: "Sum of amount over cd_interest_compound rows posted in the window, minus the sum over cd_withdrawal rows with withdrawal_kind interest_withdrawal in the window."
  - id: cd_msr_customer_certificate_total
    window: "Close of business on the frozen date."
    measure: "Sum of principal_balance over all of the customer's certificates whose status is not closed."

policies:
  - id: cd_agg_multi_holding
    subject: [cd_open]
    rule: >-
      Customers commonly ladder several certificates. The count of the customer's certificates whose status is not
      closed must be below max_per_customer before a new certificate is opened. The count of the customer's
      certificates of the requested tier whose status is not closed must be below that tier's
      max_certificates_this_tier. Applied, active and grace_period certificates count; closed ones do not. Reaching
      either cap declines the opening with no row written.
    eligibility:
      - id: portfolio_cap
        applies_to: [cd_open]
        kind: authorization
        condition: "The count of the customer's certificates whose status is not closed must be below max_per_customer before a new certificate is opened."
        evidence_fields: [cd_certificates.customer_id, cd_certificates.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cd_certificates.customer_id]]
          action_bindings: {cd_certificates.customer_id: customer_id}
      - id: tier_cap
        applies_to: [cd_open]
        kind: authorization
        condition: "The count of the customer's certificates of the requested tier whose status is not closed must be below that tier's max_certificates_this_tier."
        evidence_fields: [cd_certificates.customer_id, cd_certificates.variant_name, cd_certificates.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cd_certificates.customer_id, cd_certificates.variant_name]]
          action_bindings: {cd_certificates.customer_id: customer_id, cd_certificates.variant_name: variant_name}
    params:
      max_per_customer: 20
      per_tier:
        6-Month Certificate: {tier_cap: "=max_certificates_this_tier"}
        11-Month No-Penalty Certificate: {tier_cap: "=max_certificates_this_tier"}
        12-Month Certificate: {tier_cap: "=max_certificates_this_tier"}
        18-Month Bump-Up Certificate: {tier_cap: "=max_certificates_this_tier"}
        36-Month Certificate: {tier_cap: "=max_certificates_this_tier"}
        60-Month Certificate: {tier_cap: "=max_certificates_this_tier"}

  - id: cd_agg_combined_principal
    subject: [cd_open, cd_deposit]
    rule: >-
      Certificates are combined for one purpose only, a customer-level concentration cap. The customer's total
      certificate principal, measured by cd_msr_customer_certificate_total plus the deposit being made, must not
      exceed combined_principal_cap. An opening or add-on that would breach the cap is declined, never reduced.
      Balances are never combined for pricing: the jumbo bonus is judged on each certificate's own principal at
      its term start, and two certificates can never be added together to reach jumbo_threshold. Interest
      compounded into a certificate may take the total above the cap without any consequence.
    eligibility:
      - id: concentration_cap
        applies_to: [cd_open, cd_deposit]
        kind: authorization
        condition: "The customer's total certificate principal, measured by cd_msr_customer_certificate_total plus the deposit being made, must not exceed combined_principal_cap."
        evidence_fields: [cd_certificates.customer_id, cd_certificates.principal_balance, cd_certificates.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cd_certificates.customer_id]]
          action_bindings: {cd_certificates.customer_id: customer_id}
    params:
      combined_principal_cap: 2500000.00
    measures: [cd_msr_customer_certificate_total]

  - id: cd_open_and_funding
    subject: [cd_open, cd_fund, cd_lapse_unfunded, cd_deposit]
    rule: >-
      A certificate opens in applied status at the rate and APY fixed on the opening date. The customer's age in
      whole years on the opening date, from the date of birth on the customer profile, must be at least
      age_min_to_open. The opening deposit must be a single deposit of at least minimum_opening_deposit and at
      most maximum_opening_deposit, arriving by one of funding_sources_allowed; on a tier whose
      new_money_required is true an internal transfer from any PCB account is not accepted. The certificate is
      funded, and becomes active, on the business day the opening deposit posts: term_start_date is that date and
      maturity_date is term_start_date plus term_months calendar months, falling back to the last day of the month
      when that day does not exist. A certificate still in applied status is closed as unfunded once
      funding_window_days calendar days have passed after the certificate was opened. Count calendar days with the
      day after opened_date as day 1; the lapse is due when the frozen date is on or after opened_date plus
      funding_window_days. A deposit from a PCB checking or savings account debits that account through the
      deposit's trigger, and that account must belong to the same customer.
    eligibility:
      - id: age_gate
        applies_to: [cd_open]
        kind: authorization
        condition: "The customer's age in whole years on the opening date, from the date of birth on the customer profile, must be at least age_min_to_open."
        evidence_fields: [customers.customer_id, customers.date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
      - id: funding_lapse
        applies_to: [cd_lapse_unfunded]
        kind: time
        condition: "A certificate still in applied status is closed as unfunded once funding_window_days calendar days have passed after the certificate was opened."
        evidence_fields: [cd_certificates.certificate_id, cd_certificates.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cd_certificates.certificate_id]]
          action_bindings: {cd_certificates.certificate_id: certificate_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the certificate was opened"
          anchor_source: cd_certificates.opened_date
          relation: not_before
          duration_source: variants.funding_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after opened_date as day 1; the lapse is due when the frozen date is on or after opened_date plus funding_window_days."
          boundary: inclusive
    params:
      per_tier:
        6-Month Certificate: {min_deposit: "=minimum_opening_deposit", max_deposit: "=maximum_opening_deposit", new_money: "=new_money_required", sources: "=funding_sources_allowed", term: "=term_months"}
        11-Month No-Penalty Certificate: {min_deposit: "=minimum_opening_deposit", max_deposit: "=maximum_opening_deposit", new_money: "=new_money_required", sources: "=funding_sources_allowed", term: "=term_months"}
        12-Month Certificate: {min_deposit: "=minimum_opening_deposit", max_deposit: "=maximum_opening_deposit", new_money: "=new_money_required", sources: "=funding_sources_allowed", term: "=term_months"}
        18-Month Bump-Up Certificate: {min_deposit: "=minimum_opening_deposit", max_deposit: "=maximum_opening_deposit", new_money: "=new_money_required", sources: "=funding_sources_allowed", term: "=term_months"}
        36-Month Certificate: {min_deposit: "=minimum_opening_deposit", max_deposit: "=maximum_opening_deposit", new_money: "=new_money_required", sources: "=funding_sources_allowed", term: "=term_months"}
        60-Month Certificate: {min_deposit: "=minimum_opening_deposit", max_deposit: "=maximum_opening_deposit", new_money: "=new_money_required", sources: "=funding_sources_allowed", term: "=term_months"}

  - id: cd_rate_and_bonuses
    subject: [cd_open, cd_renew]
    rule: >-
      The rate of a term is fixed at its start. It is the tier's standard_interest_rate plus bonus points, and the
      APY is the tier's standard_apy plus the same bonus points. The jumbo bonus of jumbo_apy_bonus points applies
      when the tier's jumbo_eligible is true and the certificate's principal at term start is at least
      jumbo_threshold; for a new certificate that principal is the opening deposit, and for a renewal it is the
      principal_balance on the renewal date after any grace-period add-ons and withdrawals. The relationship bonus
      of relationship_apy_bonus points applies when the customer holds an active checking account of a tier listed
      in relationship_qualifying_checking_tiers on the opening date or renewal date. The two bonuses stack by simple
      addition; no other bonus exists. On renewal the rate follows renewal_rate_basis: the target tier's published
      standard rates on the maturity date, with both bonuses re-evaluated on the renewal date when
      relationship_bonus_on_renewal is true. A bonus that is later lost, for example by closing the qualifying
      checking account, stays in the rate until the term ends; a bonus that becomes available mid-term is not added
      until the next term.
    eligibility: []
    formula:
      term_interest_rate: "standard_interest_rate + (jumbo_apy_bonus if jumbo_bonus_applied else 0) + (relationship_apy_bonus if relationship_bonus_applied else 0)"
      term_apy: "standard_apy + (jumbo_apy_bonus if jumbo_bonus_applied else 0) + (relationship_apy_bonus if relationship_bonus_applied else 0)"
    params:
      per_tier:
        6-Month Certificate: {apy: "=standard_apy", rate: "=standard_interest_rate", jumbo_ok: "=jumbo_eligible", jumbo_min: "=jumbo_threshold", jumbo_bonus: "=jumbo_apy_bonus", relationship_bonus: "=relationship_apy_bonus", qualifying: "=relationship_qualifying_checking_tiers"}
        11-Month No-Penalty Certificate: {apy: "=standard_apy", rate: "=standard_interest_rate", jumbo_ok: "=jumbo_eligible", jumbo_min: "=jumbo_threshold", jumbo_bonus: "=jumbo_apy_bonus", relationship_bonus: "=relationship_apy_bonus", qualifying: "=relationship_qualifying_checking_tiers"}
        12-Month Certificate: {apy: "=standard_apy", rate: "=standard_interest_rate", jumbo_ok: "=jumbo_eligible", jumbo_min: "=jumbo_threshold", jumbo_bonus: "=jumbo_apy_bonus", relationship_bonus: "=relationship_apy_bonus", qualifying: "=relationship_qualifying_checking_tiers"}
        18-Month Bump-Up Certificate: {apy: "=standard_apy", rate: "=standard_interest_rate", jumbo_ok: "=jumbo_eligible", jumbo_min: "=jumbo_threshold", jumbo_bonus: "=jumbo_apy_bonus", relationship_bonus: "=relationship_apy_bonus", qualifying: "=relationship_qualifying_checking_tiers"}
        36-Month Certificate: {apy: "=standard_apy", rate: "=standard_interest_rate", jumbo_ok: "=jumbo_eligible", jumbo_min: "=jumbo_threshold", jumbo_bonus: "=jumbo_apy_bonus", relationship_bonus: "=relationship_apy_bonus", qualifying: "=relationship_qualifying_checking_tiers"}
        60-Month Certificate: {apy: "=standard_apy", rate: "=standard_interest_rate", jumbo_ok: "=jumbo_eligible", jumbo_min: "=jumbo_threshold", jumbo_bonus: "=jumbo_apy_bonus", relationship_bonus: "=relationship_apy_bonus", qualifying: "=relationship_qualifying_checking_tiers"}

  - id: cd_evt_interest
    subject: [cd_interest_compound, cd_interest_payout]
    rule: >-
      Interest accrues every calendar day from term_start_date through the day before maturity_date on the
      end-of-day principal_balance at the certificate's interest_rate divided by 100 and by day_count_basis, and
      because compounding_frequency is daily each day's accrual joins the base for the next day. Accrued interest
      is credited according to interest_crediting_frequency: under monthly, on the last calendar day of each month
      and on the maturity date for the final partial month; under at_maturity, once on the maturity date. The
      credited amount for a period is the unrounded accrual rounded half-up to the cent. Under interest_disposition
      compound the credit is a cd_interest_compound row that raises principal. Under pay_to_checking or
      pay_to_savings it is a cd_interest_payout row to the payout_account_id, which leaves principal unchanged
      and credits that account through its trigger; the payout account must belong to the same customer and be
      active, otherwise the interest compounds for that period. Only dispositions listed in
      interest_payout_options may be chosen. Interest accrued but not yet credited is credited on the day of a
      full early withdrawal before the penalty is computed. No interest accrues during the grace period on a
      balance that is withdrawn during grace when grace_days_earn_interest_if_withdrawn is false; balance that
      renews earns the new term's rate from the maturity date.
    eligibility: []
    formula:
      daily_accrual: "principal_balance * interest_rate / 100 / day_count_basis"
    params:
      per_tier:
        6-Month Certificate: {crediting: "=interest_crediting_frequency", options: "=interest_payout_options", basis: "=day_count_basis", grace_interest: "=grace_days_earn_interest_if_withdrawn"}
        11-Month No-Penalty Certificate: {crediting: "=interest_crediting_frequency", options: "=interest_payout_options", basis: "=day_count_basis", grace_interest: "=grace_days_earn_interest_if_withdrawn"}
        12-Month Certificate: {crediting: "=interest_crediting_frequency", options: "=interest_payout_options", basis: "=day_count_basis", grace_interest: "=grace_days_earn_interest_if_withdrawn"}
        18-Month Bump-Up Certificate: {crediting: "=interest_crediting_frequency", options: "=interest_payout_options", basis: "=day_count_basis", grace_interest: "=grace_days_earn_interest_if_withdrawn"}
        36-Month Certificate: {crediting: "=interest_crediting_frequency", options: "=interest_payout_options", basis: "=day_count_basis", grace_interest: "=grace_days_earn_interest_if_withdrawn"}
        60-Month Certificate: {crediting: "=interest_crediting_frequency", options: "=interest_payout_options", basis: "=day_count_basis", grace_interest: "=grace_days_earn_interest_if_withdrawn"}

  - id: cd_evt_early_withdrawal
    subject: [cd_withdrawal, cd_penalty, cd_close]
    rule: >-
      Taking money out of a certificate before maturity is the owner's own decision: the agent registers a
      cd_requests row of request_type early_withdrawal in pending_customer_confirmation status, and nothing is
      withdrawn until the owner confirms. Principal can be withdrawn before maturity only from a certificate whose
      status is active. The withdrawal kind is decided in this order. A withdrawal of interest already credited in
      the current term, up to cd_msr_term_credited_interest, is kind interest_withdrawal and carries no penalty when
      interest_withdrawal_penalty_free is true. After the owner's death or court-adjudicated incompetence, confirmed
      by the bank's estate services, a withdrawal is kind death_waiver with no penalty when
      death_or_incompetence_waiver is true. On a tier offering penalty_free_withdrawal_after_days, a full withdrawal
      made after that many days is kind penalty_free. A penalty-free withdrawal is allowed only after
      penalty_free_withdrawal_after_days calendar days have passed after the certificate was funded. Count calendar
      days with the day after term_start_date as day 1; the withdrawal is penalty-free when the frozen date is on or
      after term_start_date plus penalty_free_withdrawal_after_days plus one day. Every other withdrawal before
      maturity is early_full or early_partial and carries a penalty through its trigger. Partial withdrawals are
      allowed only where partial_early_withdrawal_allowed is true, for at least partial_withdrawal_min_amount,
      leaving at least minimum_balance_after_partial, and no more than max_partial_withdrawals_per_term per term
      counted by cd_msr_term_partial_withdrawals; a request breaking any of these is declined, never converted. The
      penalty equals the penalty basis times interest_rate divided by 100 times penalty_days divided by
      day_count_basis, rounded half-up to the cent. The penalty basis is the principal the request removes: the
      requested amount for a partial, and the whole principal_balance after crediting accrued interest for a full
      withdrawal. penalty_days is early_withdrawal_penalty_days, except that on principal withdrawn within six
      calendar days after funding it is the greater of early_withdrawal_penalty_days and
      first_six_days_minimum_penalty_days on every tier. The penalty is taken from principal even when it exceeds
      interest earned, since penalty_may_reduce_principal is true. For a full withdrawal the amount paid out is the
      principal balance minus the penalty and the certificate then closes; for a partial the amount paid out is the
      requested amount and the penalty is deducted from the remaining principal. Proceeds go by one of
      payout_methods to an account of the same customer or by official check.
    eligibility:
      - id: active_only
        applies_to: [cd_withdrawal]
        kind: state
        condition: "Principal can be withdrawn before maturity only from a certificate whose status is active."
        evidence_fields: [cd_certificates.certificate_id, cd_certificates.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cd_certificates.certificate_id]]
          action_bindings: {cd_certificates.certificate_id: certificate_id}
        state_contract:
          field: cd_certificates.status
          allowed: [active]
      - id: no_penalty_window
        applies_to: [cd_withdrawal]
        kind: time
        condition: "A penalty-free withdrawal is allowed only after penalty_free_withdrawal_after_days calendar days have passed after the certificate was funded."
        evidence_fields: [cd_certificates.certificate_id, cd_certificates.term_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cd_certificates.certificate_id]]
          action_bindings: {cd_certificates.certificate_id: certificate_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the certificate was funded"
          anchor_source: cd_certificates.term_start_date
          relation: not_before
          duration_source: variants.penalty_free_withdrawal_after_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after term_start_date as day 1; the withdrawal is penalty-free when the frozen date is on or after term_start_date plus penalty_free_withdrawal_after_days plus one day."
          boundary: exclusive
      - id: owner_confirms
        applies_to: [cd_withdrawal]
        kind: caller_fact
        condition: "Taking money out of a certificate before maturity is the owner's own decision: the agent registers a cd_requests row of request_type early_withdrawal in pending_customer_confirmation status, and nothing is withdrawn until the owner confirms."
        evidence_fields: [cd_requests.cd_request_id, cd_requests.certificate_id, cd_requests.request_status]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[cd_requests.cd_request_id]]
          action_bindings: {cd_requests.cd_request_id: cd_request_id}
    formula:
      penalty_amount: "round(principal_balance * interest_rate / 100 * early_withdrawal_penalty_days / day_count_basis, 2)"
    params:
      per_tier:
        6-Month Certificate: {penalty_days: "=early_withdrawal_penalty_days", min_days: "=first_six_days_minimum_penalty_days", free_after: "=penalty_free_withdrawal_after_days", partial_ok: "=partial_early_withdrawal_allowed", partial_min: "=partial_withdrawal_min_amount", remain_min: "=minimum_balance_after_partial", partial_max: "=max_partial_withdrawals_per_term", interest_free: "=interest_withdrawal_penalty_free", death_waiver: "=death_or_incompetence_waiver"}
        11-Month No-Penalty Certificate: {penalty_days: "=early_withdrawal_penalty_days", min_days: "=first_six_days_minimum_penalty_days", free_after: "=penalty_free_withdrawal_after_days", partial_ok: "=partial_early_withdrawal_allowed", partial_min: "=partial_withdrawal_min_amount", remain_min: "=minimum_balance_after_partial", partial_max: "=max_partial_withdrawals_per_term", interest_free: "=interest_withdrawal_penalty_free", death_waiver: "=death_or_incompetence_waiver"}
        12-Month Certificate: {penalty_days: "=early_withdrawal_penalty_days", min_days: "=first_six_days_minimum_penalty_days", free_after: "=penalty_free_withdrawal_after_days", partial_ok: "=partial_early_withdrawal_allowed", partial_min: "=partial_withdrawal_min_amount", remain_min: "=minimum_balance_after_partial", partial_max: "=max_partial_withdrawals_per_term", interest_free: "=interest_withdrawal_penalty_free", death_waiver: "=death_or_incompetence_waiver"}
        18-Month Bump-Up Certificate: {penalty_days: "=early_withdrawal_penalty_days", min_days: "=first_six_days_minimum_penalty_days", free_after: "=penalty_free_withdrawal_after_days", partial_ok: "=partial_early_withdrawal_allowed", partial_min: "=partial_withdrawal_min_amount", remain_min: "=minimum_balance_after_partial", partial_max: "=max_partial_withdrawals_per_term", interest_free: "=interest_withdrawal_penalty_free", death_waiver: "=death_or_incompetence_waiver"}
        36-Month Certificate: {penalty_days: "=early_withdrawal_penalty_days", min_days: "=first_six_days_minimum_penalty_days", free_after: "=penalty_free_withdrawal_after_days", partial_ok: "=partial_early_withdrawal_allowed", partial_min: "=partial_withdrawal_min_amount", remain_min: "=minimum_balance_after_partial", partial_max: "=max_partial_withdrawals_per_term", interest_free: "=interest_withdrawal_penalty_free", death_waiver: "=death_or_incompetence_waiver"}
        60-Month Certificate: {penalty_days: "=early_withdrawal_penalty_days", min_days: "=first_six_days_minimum_penalty_days", free_after: "=penalty_free_withdrawal_after_days", partial_ok: "=partial_early_withdrawal_allowed", partial_min: "=partial_withdrawal_min_amount", remain_min: "=minimum_balance_after_partial", partial_max: "=max_partial_withdrawals_per_term", interest_free: "=interest_withdrawal_penalty_free", death_waiver: "=death_or_incompetence_waiver"}
    measures: [cd_msr_term_partial_withdrawals, cd_msr_term_credited_interest]

  - id: cd_evt_maturity_and_grace
    subject: [cd_mature, cd_renew, cd_close, cd_deposit, cd_withdrawal]
    rule: >-
      A maturity notice is mailed maturity_notice_days_before calendar days before the maturity date. On the
      maturity date interest is credited and the certificate enters grace_period. During grace the owner may, with
      no penalty, add funds where grace_add_on_allowed is true in single deposits of at least
      grace_add_on_min_amount and in total, by cd_msr_grace_add_ons, no more than grace_add_on_max_amount; withdraw
      part of the balance where grace_partial_withdrawal_allowed is true; withdraw everything and close; or renew
      into a different tier where grace_term_change_allowed is true. Grace actions are allowed only while no more
      than grace_period_days calendar days have passed after the maturity date. Count calendar days with the day
      after maturity_date as day 1; grace actions are allowed while the frozen date is on or before maturity_date
      plus grace_period_days. A grace withdrawal is kind grace_period and carries no penalty. On the day after the
      grace period ends, if no grace action closed it, the certificate follows its renewal_instruction: under
      auto_renew it renews into renewal_target_tier, or into the tier the owner chose during grace, with a new term
      starting on the maturity date; under a payout instruction the whole balance is paid as kind maturity_payout to
      the payout account or by official check and the certificate closes. An auto_renew instruction is honored
      only where auto_renew_available is true. After the grace period ends, any withdrawal is again an early
      withdrawal of the new term.
    eligibility:
      - id: grace_window
        applies_to: [cd_deposit, cd_withdrawal]
        kind: time
        condition: "Grace actions are allowed only while no more than grace_period_days calendar days have passed after the maturity date."
        evidence_fields: [cd_certificates.certificate_id, cd_certificates.maturity_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cd_certificates.certificate_id]]
          action_bindings: {cd_certificates.certificate_id: certificate_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the maturity date"
          anchor_source: cd_certificates.maturity_date
          relation: not_after
          duration_source: variants.grace_period_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after maturity_date as day 1; grace actions are allowed while the frozen date is on or before maturity_date plus grace_period_days."
          boundary: inclusive
    params:
      per_tier:
        6-Month Certificate: {grace_days: "=grace_period_days", add_ok: "=grace_add_on_allowed", add_min: "=grace_add_on_min_amount", add_max: "=grace_add_on_max_amount", partial_ok: "=grace_partial_withdrawal_allowed", term_change: "=grace_term_change_allowed", renew_into: "=renewal_target_tier", notice_days: "=maturity_notice_days_before", auto_renew: "=auto_renew_available"}
        11-Month No-Penalty Certificate: {grace_days: "=grace_period_days", add_ok: "=grace_add_on_allowed", add_min: "=grace_add_on_min_amount", add_max: "=grace_add_on_max_amount", partial_ok: "=grace_partial_withdrawal_allowed", term_change: "=grace_term_change_allowed", renew_into: "=renewal_target_tier", notice_days: "=maturity_notice_days_before", auto_renew: "=auto_renew_available"}
        12-Month Certificate: {grace_days: "=grace_period_days", add_ok: "=grace_add_on_allowed", add_min: "=grace_add_on_min_amount", add_max: "=grace_add_on_max_amount", partial_ok: "=grace_partial_withdrawal_allowed", term_change: "=grace_term_change_allowed", renew_into: "=renewal_target_tier", notice_days: "=maturity_notice_days_before", auto_renew: "=auto_renew_available"}
        18-Month Bump-Up Certificate: {grace_days: "=grace_period_days", add_ok: "=grace_add_on_allowed", add_min: "=grace_add_on_min_amount", add_max: "=grace_add_on_max_amount", partial_ok: "=grace_partial_withdrawal_allowed", term_change: "=grace_term_change_allowed", renew_into: "=renewal_target_tier", notice_days: "=maturity_notice_days_before", auto_renew: "=auto_renew_available"}
        36-Month Certificate: {grace_days: "=grace_period_days", add_ok: "=grace_add_on_allowed", add_min: "=grace_add_on_min_amount", add_max: "=grace_add_on_max_amount", partial_ok: "=grace_partial_withdrawal_allowed", term_change: "=grace_term_change_allowed", renew_into: "=renewal_target_tier", notice_days: "=maturity_notice_days_before", auto_renew: "=auto_renew_available"}
        60-Month Certificate: {grace_days: "=grace_period_days", add_ok: "=grace_add_on_allowed", add_min: "=grace_add_on_min_amount", add_max: "=grace_add_on_max_amount", partial_ok: "=grace_partial_withdrawal_allowed", term_change: "=grace_term_change_allowed", renew_into: "=renewal_target_tier", notice_days: "=maturity_notice_days_before", auto_renew: "=auto_renew_available"}
    measures: [cd_msr_grace_add_ons]

  - id: cd_evt_term_add_on
    subject: [cd_deposit]
    rule: >-
      Outside the grace period a certificate accepts new principal only on a tier whose term_add_on_max_count is
      above zero. A term add-on is allowed only while the certificate's status is active. Each add-on must be at
      least term_add_on_min_amount, the number of add-ons in the term counted by cd_msr_term_add_ons must stay
      within term_add_on_max_count, and their total must stay within term_add_on_max_amount; the principal after
      the add-on must not exceed maximum_opening_deposit. An add-on earns the certificate's existing rate from its
      posted date and does not change the maturity date or re-evaluate the jumbo bonus.
    eligibility:
      - id: active_for_add_on
        applies_to: [cd_deposit]
        kind: state
        condition: "A term add-on is allowed only while the certificate's status is active."
        evidence_fields: [cd_certificates.certificate_id, cd_certificates.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cd_certificates.certificate_id]]
          action_bindings: {cd_certificates.certificate_id: certificate_id}
        state_contract:
          field: cd_certificates.status
          allowed: [active]
    params:
      per_tier:
        6-Month Certificate: {count: "=term_add_on_max_count", min: "=term_add_on_min_amount", max: "=term_add_on_max_amount", ceiling: "=maximum_opening_deposit"}
        11-Month No-Penalty Certificate: {count: "=term_add_on_max_count", min: "=term_add_on_min_amount", max: "=term_add_on_max_amount", ceiling: "=maximum_opening_deposit"}
        12-Month Certificate: {count: "=term_add_on_max_count", min: "=term_add_on_min_amount", max: "=term_add_on_max_amount", ceiling: "=maximum_opening_deposit"}
        18-Month Bump-Up Certificate: {count: "=term_add_on_max_count", min: "=term_add_on_min_amount", max: "=term_add_on_max_amount", ceiling: "=maximum_opening_deposit"}
        36-Month Certificate: {count: "=term_add_on_max_count", min: "=term_add_on_min_amount", max: "=term_add_on_max_amount", ceiling: "=maximum_opening_deposit"}
        60-Month Certificate: {count: "=term_add_on_max_count", min: "=term_add_on_min_amount", max: "=term_add_on_max_amount", ceiling: "=maximum_opening_deposit"}
    measures: [cd_msr_term_add_ons]

  - id: cd_bump_up
    subject: [cd_bump_rate]
    rule: >-
      On a tier whose bump_up_allowed_count is above zero the owner may ask once per term to raise the rate. The
      certificate must be active, bump_up_used must be false, and the tier's currently published standard_apy must
      be higher than the certificate's apy minus the bonus points already applied this term; otherwise the request
      is declined with no change. A bump-up request is accepted only within bump_up_window_months calendar months
      after the current term started. Count calendar months from term_start_date; the request is accepted while
      the frozen date is on or before term_start_date plus bump_up_window_months calendar months, falling back to
      the last day of the month when that day does not exist. The new rate and APY are the published standard rate
      and APY plus the same bonus points already in the rate, effective from the request date; interest before that
      date is unchanged.
    eligibility:
      - id: bump_window
        applies_to: [cd_bump_rate]
        kind: time
        condition: "A bump-up request is accepted only within bump_up_window_months calendar months after the current term started."
        evidence_fields: [cd_certificates.certificate_id, cd_certificates.term_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cd_certificates.certificate_id]]
          action_bindings: {cd_certificates.certificate_id: certificate_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the current term started"
          anchor_source: cd_certificates.term_start_date
          relation: not_after
          duration_source: variants.bump_up_window_months
          unit: calendar_months
          counting_rule: "Count calendar months from term_start_date; the request is accepted while the frozen date is on or before term_start_date plus bump_up_window_months calendar months, falling back to the last day of the month when that day does not exist."
          boundary: inclusive
      - id: not_yet_bumped
        applies_to: [cd_bump_rate]
        kind: dedup
        condition: "The certificate must be active, bump_up_used must be false, and the tier's currently published standard_apy must be higher than the certificate's apy minus the bonus points already applied this term; otherwise the request is declined with no change."
        evidence_fields: [cd_certificates.certificate_id, cd_certificates.bump_up_used, cd_certificates.status, cd_certificates.apy]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cd_certificates.certificate_id]]
          action_bindings: {cd_certificates.certificate_id: certificate_id}
        dedup_contract:
          table: cd_certificates
          mode: same_record
          object_bindings: {certificate_id: certificate_id}
          duplicate_filters: {bump_up_used: [true]}
          distinct_fields: [term_start_date]
    params:
      per_tier:
        6-Month Certificate: {bumps: "=bump_up_allowed_count", window: "=bump_up_window_months"}
        11-Month No-Penalty Certificate: {bumps: "=bump_up_allowed_count", window: "=bump_up_window_months"}
        12-Month Certificate: {bumps: "=bump_up_allowed_count", window: "=bump_up_window_months"}
        18-Month Bump-Up Certificate: {bumps: "=bump_up_allowed_count", window: "=bump_up_window_months"}
        36-Month Certificate: {bumps: "=bump_up_allowed_count", window: "=bump_up_window_months"}
        60-Month Certificate: {bumps: "=bump_up_allowed_count", window: "=bump_up_window_months"}

  - id: cd_instructions
    subject: [cd_update_instructions]
    rule: >-
      The owner may change the renewal instruction, the interest disposition or the payout account at any time
      while the certificate is active or in grace. A change to the renewal instruction must be recorded before the
      grace period ends to govern this maturity; a change recorded after that governs the next maturity. A
      disposition must be one of the tier's interest_payout_options and takes effect from the next crediting date.
      The payout account must be a checking or savings account of the same customer in active status when the
      instruction is recorded; a payout instruction without such an account is not accepted.
    eligibility:
      - id: payout_account_owned
        applies_to: [cd_update_instructions]
        kind: authorization
        condition: "The payout account must be a checking or savings account of the same customer in active status when the instruction is recorded; a payout instruction without such an account is not accepted."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.customer_id, checking_accounts.status, savings_accounts.savings_account_id, savings_accounts.customer_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id], [savings_accounts.savings_account_id]]
          action_bindings: {checking_accounts.checking_account_id: payout_account_id, savings_accounts.savings_account_id: payout_account_id}
    params:
      per_tier:
        6-Month Certificate: {options: "=interest_payout_options", methods: "=payout_methods"}
        11-Month No-Penalty Certificate: {options: "=interest_payout_options", methods: "=payout_methods"}
        12-Month Certificate: {options: "=interest_payout_options", methods: "=payout_methods"}
        18-Month Bump-Up Certificate: {options: "=interest_payout_options", methods: "=payout_methods"}
        36-Month Certificate: {options: "=interest_payout_options", methods: "=payout_methods"}
        60-Month Certificate: {options: "=interest_payout_options", methods: "=payout_methods"}

  - id: cd_evt_penalty_reversal
    subject: [cd_penalty_reversal]
    rule: >-
      A penalty is reversed in full, never in part, as one cd_penalty_reversal row whose source_item_id is the
      penalty row. A penalty is reversed with adjustment_reason bank_error when it was assessed contrary to this
      charter: on a grace-period withdrawal, on a penalty-free withdrawal of a no-penalty certificate after its
      waiting days, on a withdrawal of credited interest, at a penalty_days or rate other than the charter's, or
      on a basis larger than the principal removed. A penalty is reversed with adjustment_reason death_waiver when
      estate services confirm the withdrawal followed the owner's death or adjudicated incompetence. A penalty can
      be reversed at most once. A goodwill reversal of a correctly assessed penalty is outside this policy.
    eligibility:
      - id: reverse_once
        applies_to: [cd_penalty_reversal]
        kind: dedup
        condition: "A penalty can be reversed at most once."
        evidence_fields: [cd_transactions.source_item_id, cd_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[cd_transactions.source_item_id]]
          action_bindings: {cd_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: cd_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [cd_penalty_reversal]}
          distinct_fields: []

extended_policies:
  - id: cd_ext_penalty_rate_reversal
    base_policy_refs: [cd_evt_penalty_reversal, cd_evt_early_withdrawal, cd_rate_and_bonuses, cd_evt_maturity_and_grace]
    overwrite:
      - base_policy: cd_evt_early_withdrawal
        superseded_clause: >-
          times interest_rate divided by 100
        replaced_by: >-
          The rate the charter fixes for the term is the tier's standard rate at term start plus the bonus points
          earned at the term's start, and it is this rate, not a rate recorded on the certificate that disagrees with
          it, that a penalty is checked against; the tier's penalty_rate_basis of certificate_interest_rate is read as this rate. In the penalty formula this rate takes the place of interest_rate, so a penalty equals the penalty basis times this rate divided by 100 times penalty_days divided by day_count_basis, rounded half-up to the cent.
    trigger: state_due
    subject: [cd_penalty_reversal]
    computes: amount
    target_tool: reverse_penalty_error_2ccc5de3
    rule: >-
      An early withdrawal penalty is checked against the rate and the penalty days that the charter fixes for the
      term in which the withdrawal was taken, and a penalty booked at any other rate or any other number of
      penalty days was assessed contrary to the charter and is reversed with adjustment_reason bank_error. The
      penalty checked is the certificate's most recent cd_penalty entry: its amount, rate_applied, penalty_days
      and posted_date are all read from that one entry. An earlier penalty is checked under this policy only
      while it is the certificate's most recent penalty; otherwise it is left to cd_evt_penalty_reversal. This policy checks a penalty taken in the certificate's current term, one whose posted_date is on or after the term_start_date, because the rate it rebuilds is the rate of the current term; a penalty taken in an earlier term is left to cd_evt_penalty_reversal. A penalty whose posted_date falls on day 1 through day
      grace_period_days counted from the day after the certificate's maturity_date sits on a grace-period
      withdrawal and is outside this policy; it is reversed under cd_ext_grace_withdrawal_penalty_reversal. The
      rate the charter fixes for the term is the tier's standard rate at term start plus the bonus points earned
      at the term's start, and it is this rate, not a rate recorded on the certificate that disagrees with it,
      that a penalty is checked against; the tier's penalty_rate_basis of certificate_interest_rate is read as this rate. In the penalty formula this rate takes the place of interest_rate, so a penalty equals the penalty basis times this rate divided by 100 times penalty_days divided by day_count_basis, rounded half-up to the cent. First the tier's standard rate at term start is taken as the
      certificate's interest_rate less jumbo_apy_bonus points when jumbo_bonus_applied is true and less
      relationship_apy_bonus points when relationship_bonus_applied is true. Then jumbo_apy_bonus points are
      added back when jumbo_bonus_applied is true, and relationship_apy_bonus points are added when the owner held
      on the term_start_date a checking account of a tier listed in relationship_qualifying_checking_tiers, that
      is one opened on or before the term_start_date and not closed on or before it, judged from that checking
      account's tier, opened_date and closed_date and checked over the owner's active checking account and the
      owner's closed checking account, one qualifying account being enough; a relationship bonus earned at the term's start stays in the
      rate for the whole term even when that checking account is closed later. Both bonuses are added by simple
      addition to the same standard rate. The charter penalty days are the tier's early_withdrawal_penalty_days,
      except that when the penalty posted no more than six calendar days after the term_start_date they are the
      greater of early_withdrawal_penalty_days and first_six_days_minimum_penalty_days. A penalty whose
      rate_applied differs from the charter rate by more than 0.001 percentage point, or whose penalty_days differ
      from the charter penalty days, is reversed for its whole booked amount, never in part, and the reversal
      amount is that booked amount to the cent with no further rounding. A penalty that matches both the charter
      rate and the charter penalty days is not reversed and nothing is written. A penalty that already has a
      cd_penalty_reversal entry whose source_item_id is that penalty is not reversed again.
    prerequisite: []
    cross_category:
      - category: checking
        as: branch
        reads: [variant_name, status, opened_date, closed_date]
        note: The owner's checking tier and its opened and closed dates decide whether the relationship bonus belongs in the rate the charter fixed at the term's start.
    compute:
      - pen_id: "LATEST('cd_transactions', 'cd_txn_id', date_field='posted_date', event_type='cd_penalty') or ''"
      - pen_amount: "MAX('cd_transactions', 'amount', event_type='cd_penalty', cd_txn_id=pen_id)"
      - pen_rate: "float(LATEST('cd_transactions', 'rate_applied', date_field='posted_date', event_type='cd_penalty', cd_txn_id=pen_id) or 0)"
      - pen_days: "int(LATEST('cd_transactions', 'penalty_days', date_field='posted_date', event_type='cd_penalty', cd_txn_id=pen_id) or 0)"
      - pen_date: "LATEST('cd_transactions', 'posted_date', date_field='posted_date', event_type='cd_penalty', cd_txn_id=pen_id) or ''"
      - grace_penalty: "pen_date != '' and 1 <= DAYS(F('maturity_date'), pen_date) <= P('grace_period_days')"
      - in_current_term: "pen_date != '' and pen_date >= F('term_start_date')"
      - prior_reversals: "COUNT('cd_transactions', event_type='cd_penalty_reversal', source_item_id=pen_id)"
      - standard_at_start: "F('interest_rate') - (P('jumbo_apy_bonus') if F('jumbo_bonus_applied') else 0) - (P('relationship_apy_bonus') if F('relationship_bonus_applied') else 0)"
      - checking_tier: "CFIELD('checking', 'variant_name', status='active')"
      - checking_opened: "CFIELD('checking', 'opened_date', status='active') or '9999-12-31'"
      - closed_tier: "CFIELD('checking', 'variant_name', status='closed')"
      - closed_opened: "CFIELD('checking', 'opened_date', status='closed') or '9999-12-31'"
      - checking_closed: "CFIELD('checking', 'closed_date', status='closed') or ''"
      - relationship_earned: "(checking_tier in P('relationship_qualifying_checking_tiers') and checking_opened <= F('term_start_date')) or (closed_tier in P('relationship_qualifying_checking_tiers') and closed_opened <= F('term_start_date') and checking_closed > F('term_start_date'))"
      - charter_rate: "standard_at_start + (P('jumbo_apy_bonus') if F('jumbo_bonus_applied') else 0) + (P('relationship_apy_bonus') if relationship_earned else 0)"
      - charter_days: "MX(P('early_withdrawal_penalty_days'), P('first_six_days_minimum_penalty_days')) if (pen_date != '' and DAYS(F('term_start_date'), pen_date) <= 6) else P('early_withdrawal_penalty_days')"
      - misassessed: "ABS(pen_rate - charter_rate) > 0.001 or pen_days != charter_days"
      - result: "RND(pen_amount, 2) if (misassessed and in_current_term and not grace_penalty and prior_reversals == 0 and pen_amount > 0) else 0"
    compute_basis:
      pen_id: "The penalty checked is the certificate's most recent cd_penalty entry"
      pen_amount: "its amount, rate_applied, penalty_days and posted_date are all read from that one entry"
      pen_rate: "its amount, rate_applied, penalty_days and posted_date are all read from that one entry"
      pen_days: "its amount, rate_applied, penalty_days and posted_date are all read from that one entry"
      pen_date: "its amount, rate_applied, penalty_days and posted_date are all read from that one entry"
      grace_penalty: "A penalty whose posted_date falls on day 1 through day grace_period_days counted from the day after the certificate's maturity_date sits on a grace-period withdrawal and is outside this policy"
      in_current_term: "This policy checks a penalty taken in the certificate's current term, one whose posted_date is on or after the term_start_date"
      prior_reversals: "A penalty that already has a cd_penalty_reversal entry whose source_item_id is that penalty is not reversed again."
      standard_at_start: "First the tier's standard rate at term start is taken as the certificate's interest_rate less jumbo_apy_bonus points when jumbo_bonus_applied is true and less relationship_apy_bonus points when relationship_bonus_applied is true."
      checking_tier: "checked over the owner's active checking account and the owner's closed checking account, one qualifying account being enough"
      checking_opened: "that is one opened on or before the term_start_date and not closed on or before it"
      closed_tier: "checked over the owner's active checking account and the owner's closed checking account, one qualifying account being enough"
      closed_opened: "that is one opened on or before the term_start_date and not closed on or before it"
      checking_closed: "a relationship bonus earned at the term's start stays in the rate for the whole term even when that checking account is closed later"
      relationship_earned: "relationship_apy_bonus points are added when the owner held on the term_start_date a checking account of a tier listed in relationship_qualifying_checking_tiers, that is one opened on or before the term_start_date and not closed on or before it"
      charter_rate: "Then jumbo_apy_bonus points are added back when jumbo_bonus_applied is true, and relationship_apy_bonus points are added when the owner held on the term_start_date a checking account of a tier listed in relationship_qualifying_checking_tiers | Both bonuses are added by simple addition to the same standard rate."
      charter_days: "The charter penalty days are the tier's early_withdrawal_penalty_days, except that when the penalty posted no more than six calendar days after the term_start_date they are the greater of early_withdrawal_penalty_days and first_six_days_minimum_penalty_days."
      misassessed: "A penalty whose rate_applied differs from the charter rate by more than 0.001 percentage point, or whose penalty_days differ from the charter penalty days, is reversed for its whole booked amount, never in part"
      result: "the reversal amount is that booked amount to the cent with no further rounding. A penalty that matches both the charter rate and the charter penalty days is not reversed and nothing is written."
    inputs:
      history:
        - {table: cd_transactions, aggregate: latest, field: cd_txn_id, filters: {event_type: cd_penalty}}
        - {table: cd_transactions, aggregate: max, field: amount, filters: {event_type: cd_penalty}}
        - {table: cd_transactions, aggregate: count, field: cd_txn_id, filters: {event_type: cd_penalty_reversal}}
      cross_category: [checking]
  - id: cd_ext_closed_payout_instruction
    base_policy_refs: [cd_instructions, cd_evt_maturity_and_grace]
    overwrite:
      - base_policy: cd_evt_maturity_and_grace
        superseded_clause: >-
          under a payout instruction the whole balance is paid as kind maturity_payout to the payout account or by
          official check and the certificate closes
        replaced_by: >-
          When a certificate's renewal_instruction is pay_out_to_checking or pay_out_to_savings and the payout
          account it names has been closed, the instruction cannot be carried out when the grace period ends and is replaced by auto_renew where the tier's auto_renew_available is true, and by mail_check, under which the whole balance is paid by official check, where it is not.
      - base_policy: cd_instructions
        superseded_clause: >-
          A change to the renewal instruction must be recorded before the grace period ends to govern this maturity;
          a change recorded after that governs the next maturity.
        replaced_by: >-
          A change the owner makes to the renewal instruction must be recorded before the grace period ends to govern
          this maturity, and a change the owner records after that governs the next maturity; the one exception is
          this bank-owed replacement, which, recorded before the outcome of the grace period is booked, governs the maturity that has just passed, because that outcome has not yet been booked.
    trigger: state_due
    subject: [cd_update_instructions]
    computes: renewal_instruction
    target_tool: update_maturity_instruction_96ab509d
    rule: >-
      A payout instruction is carried out only into an account that is still open. A payout instruction whose
      payout account is open is carried out as written: when the grace period ends the whole balance is paid as
      kind maturity_payout to that account and the certificate closes, and a mail_check instruction pays the
      whole balance by official check. When a certificate's renewal_instruction is pay_out_to_checking or
      pay_out_to_savings and the payout account it names has been closed, the instruction cannot be carried out when the grace period ends and is replaced by auto_renew where the tier's auto_renew_available is true, and by mail_check, under which the whole balance is paid by official check, where it is not. Whether the payout account has been closed is read from the status of the account named by
      payout_account_id: the savings account for pay_out_to_savings and the checking account for
      pay_out_to_checking; a status of closed means it has been closed. The replacement is owed by the bank whether or not the owner calls, while the certificate is active or in its grace period, and it is recorded before the outcome of the grace period is booked, however many days have passed since the grace period ended; a certificate whose grace outcome has been booked is no longer in its grace period and is not concerned. A change the owner makes to the renewal instruction must be recorded before the grace period
      ends to govern this maturity, and a change the owner records after that governs the next maturity; the one
      exception is this bank-owed replacement, which, recorded before the outcome of the grace period is booked, governs the maturity that has just passed, because that outcome has not yet been booked. When the
      certificate's interest_disposition also pays out to that same closed account, the
      active payout account recorded by this replacement receives that interest too, and
      cd_ext_interest_payout_repoint does not apply to the certificate. When the replacement is recorded, the closed payout
      account is replaced on the record by an active checking or savings account of the owner that the owner
      names; when the certificate's interest_disposition pays out, the account named must be of the kind that
      disposition pays to, a checking account for pay_to_checking and a savings account for pay_to_savings,
      because the payout account must be an active account of the owner when an instruction is
      recorded. An auto_renew instruction, a mail_check instruction and a payout instruction whose payout
      account is not closed are left as they are, and nothing is written.
    prerequisite: []
    cross_category:
      - category: savings
        as: branch
        reads: [status]
        note: The status of the savings account named as payout account decides whether a pay_out_to_savings instruction can still be carried out.
      - category: checking
        as: branch
        reads: [status]
        note: The status of the checking account named as payout account decides whether a pay_out_to_checking instruction can still be carried out.
    compute:
      - instr: "F('renewal_instruction')"
      - pays_out: "instr == 'pay_out_to_checking' or instr == 'pay_out_to_savings'"
      - payout_status: "CFIELD('savings', 'status', savings_account_id=F('payout_account_id')) if instr == 'pay_out_to_savings' else CFIELD('checking', 'status', checking_account_id=F('payout_account_id'))"
      - payout_closed: "pays_out and payout_status == 'closed'"
      - renew_offered: "P('auto_renew_available') == True"
      - outcome_open: "F('status') == 'active' or F('status') == 'grace_period'"
      - result: "instr if not (payout_closed and outcome_open) else ('auto_renew' if renew_offered else 'mail_check')"
    compute_basis:
      instr: "When a certificate's renewal_instruction is pay_out_to_checking or pay_out_to_savings and the payout account it names has been closed"
      pays_out: "When a certificate's renewal_instruction is pay_out_to_checking or pay_out_to_savings and the payout account it names has been closed"
      payout_status: "Whether the payout account has been closed is read from the status of the account named by payout_account_id: the savings account for pay_out_to_savings and the checking account for pay_out_to_checking; a status of closed means it has been closed."
      payout_closed: "a status of closed means it has been closed"
      renew_offered: "replaced by auto_renew where the tier's auto_renew_available is true, and by mail_check, under which the whole balance is paid by official check, where it is not"
      outcome_open: "while the certificate is active or in its grace period, and it is recorded before the outcome of the grace period is booked, however many days have passed since the grace period ended"
      result: "the instruction cannot be carried out when the grace period ends and is replaced by auto_renew where the tier's auto_renew_available is true, and by mail_check, under which the whole balance is paid by official check, where it is not. | An auto_renew instruction, a mail_check instruction and a payout instruction whose payout account is not closed are left as they are, and nothing is written."
    inputs:
      history: []
      cross_category: [savings, checking]
  - id: cd_ext_post_grace_renewal_rate
    base_policy_refs: [cd_rate_and_bonuses, cd_evt_maturity_and_grace]
    overwrite:
      - base_policy: cd_rate_and_bonuses
        superseded_clause: >-
          for a renewal it is the principal_balance on the renewal date after any grace-period add-ons and
          withdrawals
        replaced_by: >-
          The renewal principal is reconciled from the certificate's own ledger as it stands when the renewal is
          booked, as the sum of all cd_deposit amounts, plus all cd_interest_compound amounts, plus all
          cd_penalty_reversal amounts, minus all cd_withdrawal amounts, minus all cd_penalty amounts; a
          cd_interest_payout entry is left out because interest paid out never joined principal. It therefore takes
          in every grace-period add-on and withdrawal and every penalty reversal posted before the renewal is booked,
          although the new term is dated from the old maturity_date. Where the recorded principal_balance differs
          from this reconciled figure, the reconciled figure governs the jumbo test. This reconciled principal is the
          renewal principal for the jumbo test of every renewal, including a renewal into a different tier chosen
          during grace and a renewal the owner books during grace.
    trigger: state_due
    subject: [cd_renew]
    computes: interest_rate
    target_tool: renew_certificate_term_21cb639a
    rule: >-
      On the day after the grace period ends, a certificate that no grace action closed and whose
      renewal_instruction is auto_renew renews into its renewal_target_tier with a new term starting on the
      maturity date; this policy prices such a renewal when the renewal_target_tier is the tier the certificate
      already holds, and a renewal into a different tier is outside it. The renewal is due when the certificate's
      status is still grace_period and more than grace_period_days calendar days have passed after the
      maturity_date, counting the day after the maturity_date as day 1. A certificate renews only under an instruction to renew automatically, so a payout instruction that must be
      replaced is replaced before the renewal is booked. The new term's interest_rate is the tier's published standard_interest_rate plus jumbo_apy_bonus
      points when the jumbo bonus is earned and plus relationship_apy_bonus points when the relationship bonus
      is earned; the two bonuses are added by simple addition to the same standard rate, and the sum is rounded
      half-up to 2 decimal places once, at the end. The new term's apy is the tier's published standard_apy plus
      the same bonus points. The jumbo bonus is earned when the tier's jumbo_eligible is true and the renewal
      principal is at least jumbo_threshold. The renewal principal is reconciled from the certificate's own ledger
      as it stands when the renewal is booked, as the sum of all cd_deposit amounts, plus all cd_interest_compound
      amounts, plus all cd_penalty_reversal amounts, minus all cd_withdrawal amounts, minus all cd_penalty
      amounts; a cd_interest_payout entry is left out because interest paid out never joined principal. It
      therefore takes in every grace-period add-on and withdrawal and every penalty reversal posted before the
      renewal is booked, although the new term is dated from the old maturity_date. Where the recorded
      principal_balance differs from this reconciled figure, the reconciled figure governs the jumbo test. This
      reconciled principal is the renewal principal for the jumbo test of every renewal, including a renewal into
      a different tier chosen during grace and a renewal the owner books during grace. The target
      tier whose published standard rates a renewal follows is the tier the certificate renews into: its
      renewal_target_tier when the owner made no term change during grace, otherwise the tier the owner chose
      during grace. Every penalty
      reversal owed on the certificate is posted before the renewal is booked, because the jumbo bonus is judged
      on the reconciled principal as it stands when the renewal is booked. The renewal date of every renewal is
      the first day of its new term, which is the old maturity_date, whether the renewal is booked by the owner
      during grace, on the day after the grace period ends or on any later day; it is never the day on which the
      renewal is booked. The relationship bonus of a renewed term is earned when the owner held, on the renewal
      date, a checking account of a tier listed in relationship_qualifying_checking_tiers, that is one opened on
      or before the renewal date and not closed on or before it, judged from that checking account's tier,
      opened_date and closed_date and checked over the owner's active checking account and the owner's closed
      checking account, one qualifying account being enough. A qualifying checking account opened after the
      renewal date does not earn the relationship bonus for the new term, and one closed after the renewal date
      still earns it, even when it was closed before the renewal is booked. The new term
      starts on the old maturity_date and matures term_months calendar months later, falling back to the last
      day of the month when that day does not exist. When the renewal is not yet due, the instruction is not
      auto_renew, or the renewal target is a different tier, no renewal is written.
    prerequisite:
      - problem: cd_ext_penalty_rate_reversal
        kind: value_input
        gate: reversals
        condition: >-
          Every penalty reversal owed on the certificate has been posted to its ledger before the renewal rate is
          judged.
        policy_source: >-
          Every penalty reversal owed on the certificate is posted before the renewal is booked, because the jumbo
          bonus is judged on the reconciled principal as it stands when the renewal is booked.
        resolved_by: reverse_penalty_error_2ccc5de3
        effect: >-
          The reversal credit joins the reconciled renewal principal, which can lift it to the jumbo threshold and
          add the jumbo bonus points to the new term's interest rate.
      - problem: cd_ext_closed_payout_instruction
        kind: state_gate
        gate: cd_certificates.renewal_instruction
        condition: >-
          The certificate carries an instruction to renew automatically at the moment its renewal is booked.
        policy_source: >-
          A certificate renews only under an instruction to renew automatically, so a payout instruction that must be
          replaced is replaced before the renewal is booked.
        resolved_by: update_maturity_instruction_96ab509d
        effect: >-
          Once the closed-account payout instruction is replaced by the instruction to renew automatically, the
          renewal is due and is priced; without it no renewal is written.
    cross_category:
      - category: checking
        as: branch
        reads: [variant_name, status, opened_date, closed_date]
        note: A checking account of a qualifying tier that the owner held on the renewal date, the first day of the new term, adds relationship_apy_bonus points to the new term's rate.
    compute:
      - in_grace: "F('status') == 'grace_period'"
      - days_after: "DAYS(F('maturity_date'), NOW)"
      - due: "in_grace and days_after > P('grace_period_days')"
      - auto: "F('renewal_instruction') == 'auto_renew' and P('auto_renew_available') == True"
      - same_tier: "P('renewal_target_tier') == F('variant_name')"
      - deposits: "SUM('cd_transactions', 'amount', event_type='cd_deposit')"
      - compounded: "SUM('cd_transactions', 'amount', event_type='cd_interest_compound')"
      - reversals: "SUM('cd_transactions', 'amount', event_type='cd_penalty_reversal')"
      - withdrawals: "SUM('cd_transactions', 'amount', event_type='cd_withdrawal')"
      - penalties: "SUM('cd_transactions', 'amount', event_type='cd_penalty')"
      - principal: "deposits + compounded + reversals - withdrawals - penalties"
      - jumbo: "P('jumbo_eligible') == True and principal >= P('jumbo_threshold')"
      - renewal_date: "F('maturity_date')"
      - checking_tier: "CFIELD('checking', 'variant_name', status='active')"
      - checking_opened: "CFIELD('checking', 'opened_date', status='active') or '9999-12-31'"
      - closed_tier: "CFIELD('checking', 'variant_name', status='closed')"
      - closed_opened: "CFIELD('checking', 'opened_date', status='closed') or '9999-12-31'"
      - checking_closed: "CFIELD('checking', 'closed_date', status='closed') or ''"
      - relationship: "(checking_tier in P('relationship_qualifying_checking_tiers') and checking_opened <= renewal_date) or (closed_tier in P('relationship_qualifying_checking_tiers') and closed_opened <= renewal_date and checking_closed > renewal_date)"
      - new_rate: "P('standard_interest_rate') + (P('jumbo_apy_bonus') if jumbo else 0) + (P('relationship_apy_bonus') if relationship else 0)"
      - result: "0 if not (due and auto and same_tier) else RND(new_rate, 2)"
    compute_basis:
      in_grace: "The renewal is due when the certificate's status is still grace_period and more than grace_period_days calendar days have passed after the maturity_date, counting the day after the maturity_date as day 1."
      days_after: "counting the day after the maturity_date as day 1"
      due: "The renewal is due when the certificate's status is still grace_period and more than grace_period_days calendar days have passed after the maturity_date"
      auto: "A certificate renews only under an instruction to renew automatically"
      same_tier: "this policy prices such a renewal when the renewal_target_tier is the tier the certificate already holds, and a renewal into a different tier is outside it | The target tier whose published standard rates a renewal follows is the tier the certificate renews into"
      deposits: "The renewal principal is reconciled from the certificate's own ledger as it stands when the renewal is booked, as the sum of all cd_deposit amounts"
      compounded: "plus all cd_interest_compound amounts"
      reversals: "plus all cd_penalty_reversal amounts | It therefore takes in every grace-period add-on and withdrawal and every penalty reversal posted before the renewal is booked, although the new term is dated from the old maturity_date."
      withdrawals: "minus all cd_withdrawal amounts"
      penalties: "minus all cd_penalty amounts; a cd_interest_payout entry is left out because interest paid out never joined principal"
      principal: "The renewal principal is reconciled from the certificate's own ledger as it stands when the renewal is booked, as the sum of all cd_deposit amounts, plus all cd_interest_compound amounts, plus all cd_penalty_reversal amounts, minus all cd_withdrawal amounts, minus all cd_penalty amounts | This reconciled principal is the renewal principal for the jumbo test of every renewal"
      jumbo: "The jumbo bonus is earned when the tier's jumbo_eligible is true and the renewal principal is at least jumbo_threshold. | Where the recorded principal_balance differs from this reconciled figure, the reconciled figure governs the jumbo test."
      renewal_date: "The renewal date of every renewal is the first day of its new term, which is the old maturity_date, whether the renewal is booked by the owner during grace, on the day after the grace period ends or on any later day; it is never the day on which the renewal is booked."
      checking_tier: "judged from that checking account's tier, opened_date and closed_date and checked over the owner's active checking account and the owner's closed checking account, one qualifying account being enough"
      checking_opened: "that is one opened on or before the renewal date and not closed on or before it"
      closed_tier: "judged from that checking account's tier, opened_date and closed_date and checked over the owner's active checking account and the owner's closed checking account, one qualifying account being enough"
      closed_opened: "that is one opened on or before the renewal date and not closed on or before it"
      checking_closed: "A qualifying checking account opened after the renewal date does not earn the relationship bonus for the new term, and one closed after the renewal date still earns it, even when it was closed before the renewal is booked."
      relationship: "The relationship bonus of a renewed term is earned when the owner held, on the renewal date, a checking account of a tier listed in relationship_qualifying_checking_tiers, that is one opened on or before the renewal date and not closed on or before it"
      new_rate: "The new term's interest_rate is the tier's published standard_interest_rate plus jumbo_apy_bonus points when the jumbo bonus is earned and plus relationship_apy_bonus points when the relationship bonus is earned; the two bonuses are added by simple addition to the same standard rate"
      result: "the sum is rounded half-up to 2 decimal places once, at the end. | When the renewal is not yet due, the instruction is not auto_renew, or the renewal target is a different tier, no renewal is written."
    inputs:
      history:
        - {table: cd_transactions, aggregate: sum, field: amount, filters: {event_type: cd_deposit}}
        - {table: cd_transactions, aggregate: sum, field: amount, filters: {event_type: cd_interest_compound}}
        - {table: cd_transactions, aggregate: sum, field: amount, filters: {event_type: cd_penalty_reversal}}
        - {table: cd_transactions, aggregate: sum, field: amount, filters: {event_type: cd_withdrawal}}
        - {table: cd_transactions, aggregate: sum, field: amount, filters: {event_type: cd_penalty}}
      cross_category: [checking]
  - id: cd_ext_term_add_on_amount
    base_policy_refs: [cd_evt_term_add_on, cd_agg_combined_principal, cd_open_and_funding, cd_evt_maturity_and_grace]
    overwrite: []
    trigger: on_request
    subject: [cd_deposit]
    computes: amount
    target_tool: add_term_deposit_5f936ecf
    rule: >-
      When the owner asks to move as much as a certificate will take from the owner's active PCB savings or money
      market account into the certificate as an in-term add-on, the amount accepted is the largest amount that
      every limit allows, and the owner makes the transfer. A term add-on is allowed only while the
      certificate's status is active, only on a certificate already funded by its opening deposit, and only on a
      tier whose term_add_on_max_count is above zero. A term add-on is made on an active certificate, so a certificate still in grace period status whose renewal is due has that renewal booked first; the renewal
      starts a new term, and an add-on of the previous term no longer counts. Because no tier allows more than
      one add-on per term, the add-on already made in the current term, if any, is the most recent cd_deposit
      entry with deposit_kind term_add_on whose posted_date is on or after the term_start_date; when such an
      add-on exists, the term's count is used up only once term_add_on_max_count add-ons exist, and its amount is
      taken out of the term cap. Three rooms are measured on the certificate as it stands when the add-on is
      made: the room under the term cap is term_add_on_max_amount minus the amount of the add-on already made in
      the current term; the room under the tier ceiling is maximum_opening_deposit minus the certificate's
      principal_balance; the room in the funding account is that savings or money market account's
      current_balance, because a savings balance can never go below zero. The amount accepted is the smallest of
      the three rooms, rounded half-up to 2 decimal places. When that amount is below term_add_on_min_amount, or
      the count of add-ons in the term is used up, no add-on is accepted and nothing is written. The add-on must
      also keep the customer's total certificate principal within the concentration cap of
      cd_agg_combined_principal, which declines an add-on that would breach it rather than reducing it.
    prerequisite:
      - problem: cd_ext_post_grace_renewal_rate
        kind: value_input
        gate: active
        condition: >-
          The certificate whose grace period has ended stands in an active new term when the add-on is measured.
        policy_source: >-
          A term add-on is made on an active certificate, so a certificate still in grace period status whose renewal is due has that renewal booked first; the renewal starts a new term, and an add-on of the
          previous term no longer counts.
        resolved_by: renew_certificate_term_21cb639a
        effect: >-
          The renewal makes the certificate active and moves the term start date to the old maturity date, so the
          add-on of the previous term leaves the term count and the term cap and the accepted amount becomes the
          smallest room instead of nothing.
    cross_category:
      - category: savings
        as: branch
        reads: [current_balance, status]
        note: The current_balance of the owner's active savings or money market account caps the add-on it funds.
    compute:
      - active: "F('status') == 'active'"
      - offered: "P('term_add_on_max_count') > 0"
      - funded: "COUNT('cd_transactions', event_type='cd_deposit', deposit_kind='opening') >= 1"
      - last_addon_date: "LATEST('cd_transactions', 'posted_date', date_field='posted_date', event_type='cd_deposit', deposit_kind='term_add_on')"
      - in_term: "(last_addon_date or '') >= F('term_start_date')"
      - prior_total: "float(LATEST('cd_transactions', 'amount', date_field='posted_date', event_type='cd_deposit', deposit_kind='term_add_on') or 0) if in_term else 0"
      - count_left: "P('term_add_on_max_count') - (1 if in_term else 0)"
      - term_room: "(P('term_add_on_max_amount') - prior_total) if offered else 0"
      - ceiling_room: "P('maximum_opening_deposit') - F('principal_balance')"
      - funding_room: "float(CFIELD('savings', 'current_balance', status='active') or 0)"
      - amount: "RND(MN(term_room, ceiling_room, funding_room), 2)"
      - result: "amount if (active and offered and funded and count_left > 0 and amount >= P('term_add_on_min_amount')) else 0"
    compute_basis:
      active: "A term add-on is allowed only while the certificate's status is active"
      offered: "only on a tier whose term_add_on_max_count is above zero"
      funded: "only on a certificate already funded by its opening deposit"
      last_addon_date: "the add-on already made in the current term, if any, is the most recent cd_deposit entry with deposit_kind term_add_on whose posted_date is on or after the term_start_date"
      in_term: "whose posted_date is on or after the term_start_date"
      prior_total: "its amount is taken out of the term cap"
      count_left: "the term's count is used up only once term_add_on_max_count add-ons exist"
      term_room: "the room under the term cap is term_add_on_max_amount minus the amount of the add-on already made in the current term"
      ceiling_room: "the room under the tier ceiling is maximum_opening_deposit minus the certificate's principal_balance"
      funding_room: "the room in the funding account is that savings or money market account's current_balance, because a savings balance can never go below zero"
      amount: "The amount accepted is the smallest of the three rooms, rounded half-up to 2 decimal places."
      result: "When that amount is below term_add_on_min_amount, or the count of add-ons in the term is used up, no add-on is accepted and nothing is written."
    inputs:
      history:
        - {table: cd_transactions, aggregate: count, field: cd_txn_id, filters: {event_type: cd_deposit, deposit_kind: opening}}
        - {table: cd_transactions, aggregate: latest, field: posted_date, filters: {event_type: cd_deposit, deposit_kind: term_add_on}}
      cross_category: [savings]
  - id: cd_ext_grace_withdrawal_penalty_reversal
    base_policy_refs: [cd_evt_penalty_reversal, cd_evt_maturity_and_grace, cd_evt_early_withdrawal]
    overwrite:
      - base_policy: cd_evt_penalty_reversal
        superseded_clause: >-
          on a grace-period withdrawal
        replaced_by: >-
          A grace withdrawal is the owner's own withdrawal when its proceeds were paid by official check or to a
          checking or savings account that belongs to the certificate's owner, read from that withdrawal's
          destination and counterparty account; a penalty on a withdrawal whose proceeds went to an account that does
          not belong to the owner is handled as a disputed transaction and is not reversed under this policy
    trigger: state_due
    subject: [cd_penalty_reversal]
    computes: amount
    target_tool: reverse_grace_penalty_e6d62385
    rule: >-
      Money taken out of a certificate during its grace period carries no penalty, whatever withdrawal kind the
      entry was recorded under, so a penalty charged on such a withdrawal was assessed contrary to the charter and
      is reversed with adjustment_reason bank_error, in full and never in part. The penalty checked is the
      certificate's most recent cd_penalty entry: its amount and posted_date are read from that entry, and the
      withdrawal it belongs to is the cd_withdrawal entry named by its source_item_id. An earlier penalty is
      checked under this policy only while it is the certificate's most recent penalty; otherwise it is left to
      cd_evt_penalty_reversal. The withdrawal was taken
      during the grace period when the penalty's posted_date, which is the business day of that withdrawal, falls
      on day 1 through day grace_period_days counted from the day after the certificate's maturity_date. A grace
      withdrawal is the owner's own withdrawal when its proceeds were paid by official check or to a checking or
      savings account that belongs to the certificate's owner, read from that withdrawal's destination and
      counterparty account; a penalty on a withdrawal whose proceeds went to an account that does not belong to
      the owner is handled as a disputed transaction and is not reversed under this policy. A penalty that
      already has a cd_penalty_reversal entry whose source_item_id is that penalty is not reversed again. The
      reversal amount is the booked penalty amount to the cent with no further rounding; when the withdrawal was
      not taken during the grace period, nothing is written under this policy.
    prerequisite: []
    cross_category:
      - category: checking
        as: branch
        reads: [checking_account_id, customer_id]
        note: Whether the grace withdrawal's proceeds went to a checking account of the owner decides whether it is the owner's own withdrawal.
      - category: savings
        as: branch
        reads: [savings_account_id, customer_id]
        note: Whether the grace withdrawal's proceeds went to a savings account of the owner decides whether it is the owner's own withdrawal.
    compute:
      - pen_id: "LATEST('cd_transactions', 'cd_txn_id', date_field='posted_date', event_type='cd_penalty') or ''"
      - pen_amount: "MAX('cd_transactions', 'amount', event_type='cd_penalty', cd_txn_id=pen_id)"
      - pen_date: "LATEST('cd_transactions', 'posted_date', date_field='posted_date', event_type='cd_penalty', cd_txn_id=pen_id) or ''"
      - source_withdrawal: "LATEST('cd_transactions', 'source_item_id', date_field='posted_date', event_type='cd_penalty', cd_txn_id=pen_id) or ''"
      - wd_destination: "LATEST('cd_transactions', 'destination', date_field='posted_date', event_type='cd_withdrawal', cd_txn_id=source_withdrawal) or 'none'"
      - wd_account: "LATEST('cd_transactions', 'counterparty_account_id', date_field='posted_date', event_type='cd_withdrawal', cd_txn_id=source_withdrawal) or ''"
      - taken_in_grace: "pen_date != '' and 1 <= DAYS(F('maturity_date'), pen_date) <= P('grace_period_days')"
      - owners_account: "(CFIELD('checking', 'checking_account_id', checking_account_id=wd_account) or CFIELD('savings', 'savings_account_id', savings_account_id=wd_account) or '') != ''"
      - owners_withdrawal: "wd_destination == 'official_check' or owners_account"
      - prior_reversals: "COUNT('cd_transactions', event_type='cd_penalty_reversal', source_item_id=pen_id)"
      - result: "RND(pen_amount, 2) if (taken_in_grace and owners_withdrawal and prior_reversals == 0 and pen_amount > 0) else 0"
    compute_basis:
      pen_id: "The penalty checked is the certificate's most recent cd_penalty entry"
      pen_amount: "its amount and posted_date are read from that entry"
      pen_date: "its amount and posted_date are read from that entry"
      source_withdrawal: "the withdrawal it belongs to is the cd_withdrawal entry named by its source_item_id"
      wd_destination: "read from that withdrawal's destination and counterparty account"
      wd_account: "read from that withdrawal's destination and counterparty account"
      taken_in_grace: "The withdrawal was taken during the grace period when the penalty's posted_date, which is the business day of that withdrawal, falls on day 1 through day grace_period_days counted from the day after the certificate's maturity_date."
      owners_account: "to a checking or savings account that belongs to the certificate's owner"
      owners_withdrawal: "A grace withdrawal is the owner's own withdrawal when its proceeds were paid by official check or to a checking or savings account that belongs to the certificate's owner"
      prior_reversals: "A penalty that already has a cd_penalty_reversal entry whose source_item_id is that penalty is not reversed again."
      result: "The reversal amount is the booked penalty amount to the cent with no further rounding; when the withdrawal was not taken during the grace period, nothing is written under this policy."
    inputs:
      history:
        - {table: cd_transactions, aggregate: latest, field: cd_txn_id, filters: {event_type: cd_penalty}}
        - {table: cd_transactions, aggregate: max, field: amount, filters: {event_type: cd_penalty}}
        - {table: cd_transactions, aggregate: latest, field: counterparty_account_id, filters: {event_type: cd_withdrawal}}
        - {table: cd_transactions, aggregate: count, field: cd_txn_id, filters: {event_type: cd_penalty_reversal}}
      cross_category: [checking, savings]
  - id: cd_ext_interest_payout_repoint
    base_policy_refs: [cd_instructions, cd_evt_interest]
    overwrite: []
    trigger: state_due
    subject: [cd_update_instructions]
    computes: payout_account_id
    target_tool: update_interest_disposition_67b383bc
    rule: >-
      Interest paid out must reach an account of the owner that is still open. When a certificate's
      interest_disposition is pay_to_checking or pay_to_savings and the payout account it names has been closed,
      the disposition is repointed: it keeps paying out, and the payout account on record becomes the owner's
      active account of the same kind, that is an active checking account for pay_to_checking and an active
      savings account for pay_to_savings. Whether the payout account has been closed is read from the status of
      the account named by payout_account_id, of the kind the disposition pays to; a status of closed means it
      has been closed. The replacement account is the owner's active account of that kind as it stands in the
      bank's records when the change is recorded. When the owner holds no active account of that kind, the
      disposition becomes compound and the payout account is the owner's active account of the other kind. A
      disposition of compound, or one whose payout account is not closed, is left as it is and nothing is
      written. A certificate whose renewal_instruction is itself pay_out_to_checking or pay_out_to_savings on that
      same closed payout account is outside this policy: its payout account is replaced together with the
      maturity instruction under cd_ext_closed_payout_instruction, and nothing is written here. The repointed disposition takes effect from the next crediting date, as every disposition does,
      and a payout disposition may be recorded only where the tier's interest_payout_options list it.
    prerequisite: []
    cross_category:
      - category: checking
        as: branch
        reads: [status, checking_account_id]
        note: The closed status of the payout checking account and the owner's active checking account decide the repointed payout account.
      - category: savings
        as: branch
        reads: [status, savings_account_id]
        note: The closed status of the payout savings account and the owner's active savings account decide the repointed payout account.
    compute:
      - disp: "F('interest_disposition')"
      - to_checking: "disp == 'pay_to_checking'"
      - payout_status: "CFIELD('checking', 'status', checking_account_id=F('payout_account_id')) if to_checking else CFIELD('savings', 'status', savings_account_id=F('payout_account_id'))"
      - payout_closed: "disp != 'compound' and payout_status == 'closed'"
      - same_kind_active: "(CFIELD('checking', 'checking_account_id', status='active') if to_checking else CFIELD('savings', 'savings_account_id', status='active')) or ''"
      - other_kind_active: "(CFIELD('savings', 'savings_account_id', status='active') if to_checking else CFIELD('checking', 'checking_account_id', status='active')) or ''"
      - maturity_payout_on_record: "F('renewal_instruction') == 'pay_out_to_checking' or F('renewal_instruction') == 'pay_out_to_savings'"
      - result: "(same_kind_active if same_kind_active != '' else other_kind_active) if (payout_closed and not maturity_payout_on_record) else F('payout_account_id')"
    compute_basis:
      disp: "When a certificate's interest_disposition is pay_to_checking or pay_to_savings and the payout account it names has been closed"
      to_checking: "an active checking account for pay_to_checking and an active savings account for pay_to_savings"
      payout_status: "Whether the payout account has been closed is read from the status of the account named by payout_account_id, of the kind the disposition pays to; a status of closed means it has been closed."
      payout_closed: "A disposition of compound, or one whose payout account is not closed, is left as it is and nothing is written."
      same_kind_active: "the payout account on record becomes the owner's active account of the same kind, that is an active checking account for pay_to_checking and an active savings account for pay_to_savings"
      other_kind_active: "When the owner holds no active account of that kind, the disposition becomes compound and the payout account is the owner's active account of the other kind."
      maturity_payout_on_record: "A certificate whose renewal_instruction is itself pay_out_to_checking or pay_out_to_savings on that same closed payout account is outside this policy"
      result: "the disposition is repointed: it keeps paying out, and the payout account on record becomes the owner's active account of the same kind"
    inputs:
      history: []
      cross_category: [checking, savings]

  - id: cd_ext_grace_jumbo_top_up
    base_policy_refs: [cd_evt_maturity_and_grace, cd_agg_combined_principal, cd_open_and_funding, cd_evt_term_add_on, cd_rate_and_bonuses]
    overwrite:
      - base_policy: cd_evt_maturity_and_grace
        superseded_clause: >-
          add funds where grace_add_on_allowed is true in single deposits of at least grace_add_on_min_amount and in
          total, by cd_msr_grace_add_ons, no more than grace_add_on_max_amount
        replaced_by: >-
          A grace add-on, in single deposits of at least grace_add_on_min_amount and in total within
          grace_add_on_max_amount for the grace period, is accepted on a tier whose grace_add_on_allowed is true only
          while the certificate's interest_disposition names no closed payout account.
      - base_policy: cd_rate_and_bonuses
        superseded_clause: >-
          for a renewal it is the principal_balance on the renewal date after any grace-period add-ons and
          withdrawals
        replaced_by: >-
          The principal is reconciled from the certificate's own ledger as the sum of all cd_deposit amounts, plus
          all cd_interest_compound amounts, plus all cd_penalty_reversal amounts, minus all cd_withdrawal amounts,
          minus all cd_penalty amounts; cd_interest_payout entries are left out because interest paid out never
          joined principal. Where the recorded principal_balance differs from this reconciled figure, the reconciled
          figure governs the shortfall. This is the same reconciled principal on which the jumbo test of every
          renewal is judged.
    trigger: on_request
    subject: [cd_deposit]
    computes: amount
    target_tool: add_grace_deposit_522b16cc
    rule: >-
      When the owner of a certificate in its grace period asks to add just enough new money for the certificate
      to earn the jumbo bonus when it renews, the amount is the shortfall of the principal below jumbo_threshold,
      and the owner makes the transfer from the owner's active PCB savings or money market account as a grace
      add-on. The top-up applies only while grace actions are allowed, that is while the certificate's status is
      grace_period and no more than grace_period_days calendar days have passed after the maturity_date, counting
      the day after the maturity_date as day 1; only when the certificate will renew into its own tier when grace
      ends, that is its renewal_instruction is auto_renew and its renewal_target_tier is the tier it holds; and
      only on a tier whose jumbo_eligible is true and whose grace_add_on_allowed is true. The principal is
      reconciled from the certificate's own ledger as the sum of all cd_deposit amounts, plus all
      cd_interest_compound amounts, plus all cd_penalty_reversal amounts, minus all cd_withdrawal amounts, minus
      all cd_penalty amounts; cd_interest_payout entries are left out because interest paid out never joined
      principal. Where the recorded principal_balance differs from this reconciled figure, the reconciled figure
      governs the shortfall. This is the same reconciled principal on which the jumbo test of every renewal is
      judged. Every penalty reversal owed on the certificate is posted before the shortfall is measured,
      because a reversal credit is principal and the jumbo bonus is judged on principal. New money added during grace becomes principal on which the renewed term's interest is
      credited and paid out, so before it is added, a payout disposition that names a
      closed payout account is repointed to an open account of the owner. A grace add-on, in single deposits of at
      least grace_add_on_min_amount and in total within grace_add_on_max_amount for the grace period, is accepted
      on a tier whose grace_add_on_allowed is true only while the certificate's interest_disposition names no
      closed payout account. Whether it does is read from the status of the account named by payout_account_id,
      the checking account for pay_to_checking and the savings account for pay_to_savings; a disposition of
      compound names no payout account. While the disposition pays to a closed payout account, no top-up is
      written. The shortfall is jumbo_threshold minus
      that principal, rounded half-up to 2 decimal places; when the shortfall is below grace_add_on_min_amount
      the top-up is raised to grace_add_on_min_amount, otherwise the top-up equals the shortfall. A top-up is
      written only when the principal is below jumbo_threshold and the top-up fits both the room left under
      grace_add_on_max_amount, which is grace_add_on_max_amount minus the grace add-ons already made in the
      current grace period, and the current_balance of the funding account; otherwise nothing is written, and a
      top-up is never cut down to fit. The grace add-ons already made in the current grace period are the
      grace_add_on deposits posted within the one month before the frozen date, which covers the whole current
      grace period and no earlier one because grace periods are at least six months apart.
    prerequisite:
      - problem: cd_ext_grace_withdrawal_penalty_reversal
        kind: value_input
        gate: reversals
        condition: >-
          Any penalty reversal owed on the certificate is already in its ledger when the jumbo shortfall is measured.
        policy_source: >-
          Every penalty reversal owed on the certificate is posted before the shortfall is measured, because a
          reversal credit is principal and the jumbo bonus is judged on principal.
        resolved_by: reverse_grace_penalty_e6d62385
        effect: >-
          The reversal credit raises the reconciled principal, so the shortfall below the jumbo threshold, and with it the top-up amount, falls by the reversed amount.
      - problem: cd_ext_interest_payout_repoint
        kind: value_input
        gate: instructions_open
        condition: >-
          The certificate's payout disposition names an open account of the owner before new grace money is added.
        policy_source: >-
          New money added during grace becomes principal on which the renewed term's interest is
          credited and paid out, so before it is added, a payout
          disposition that names a closed payout account is repointed to an open account of the owner.
        resolved_by: update_interest_disposition_67b383bc
        effect: >-
          Once the disposition is repointed to the owner's open account, the open-account condition holds and the
          top-up is written at the shortfall; while the closed account stays on record the top-up is nothing.
    cross_category:
      - category: savings
        as: branch
        reads: [current_balance, status]
        note: The current_balance of the owner's active savings or money market account decides whether the top-up fits the funding account; a savings payout account's status decides whether the disposition names a closed account.
      - category: checking
        as: branch
        reads: [status]
        note: The status of a checking payout account decides whether the interest disposition names a closed account.
    compute:
      - in_grace: "F('status') == 'grace_period' and DAYS(F('maturity_date'), NOW) <= P('grace_period_days')"
      - renews_same: "F('renewal_instruction') == 'auto_renew' and P('renewal_target_tier') == F('variant_name')"
      - tier_ok: "P('jumbo_eligible') == True and P('grace_add_on_allowed') == True"
      - deposits: "SUM('cd_transactions', 'amount', event_type='cd_deposit')"
      - compounded: "SUM('cd_transactions', 'amount', event_type='cd_interest_compound')"
      - reversals: "SUM('cd_transactions', 'amount', event_type='cd_penalty_reversal')"
      - withdrawals: "SUM('cd_transactions', 'amount', event_type='cd_withdrawal')"
      - penalties: "SUM('cd_transactions', 'amount', event_type='cd_penalty')"
      - principal: "deposits + compounded + reversals - withdrawals - penalties"
      - prior_grace: "SUM('cd_transactions', 'amount', within_months=1, date_field='posted_date', event_type='cd_deposit', deposit_kind='grace_add_on')"
      - shortfall: "RND(P('jumbo_threshold') - principal, 2)"
      - top_up: "P('grace_add_on_min_amount') if shortfall < P('grace_add_on_min_amount') else shortfall"
      - funding: "float(CFIELD('savings', 'current_balance', status='active') or 0)"
      - payout_status: "CFIELD('checking', 'status', checking_account_id=F('payout_account_id')) if F('interest_disposition') == 'pay_to_checking' else CFIELD('savings', 'status', savings_account_id=F('payout_account_id'))"
      - instructions_open: "F('interest_disposition') == 'compound' or payout_status != 'closed'"
      - fits: "top_up <= P('grace_add_on_max_amount') - prior_grace and top_up <= funding"
      - result: "top_up if (in_grace and renews_same and tier_ok and instructions_open and principal < P('jumbo_threshold') and fits) else 0"
    compute_basis:
      in_grace: "while the certificate's status is grace_period and no more than grace_period_days calendar days have passed after the maturity_date, counting the day after the maturity_date as day 1"
      renews_same: "its renewal_instruction is auto_renew and its renewal_target_tier is the tier it holds"
      tier_ok: "only on a tier whose jumbo_eligible is true and whose grace_add_on_allowed is true"
      deposits: "The principal is reconciled from the certificate's own ledger as the sum of all cd_deposit amounts"
      compounded: "plus all cd_interest_compound amounts"
      reversals: "plus all cd_penalty_reversal amounts"
      withdrawals: "minus all cd_withdrawal amounts"
      penalties: "minus all cd_penalty amounts; cd_interest_payout entries are left out because interest paid out never joined principal"
      principal: "The principal is reconciled from the certificate's own ledger as the sum of all cd_deposit amounts, plus all cd_interest_compound amounts, plus all cd_penalty_reversal amounts, minus all cd_withdrawal amounts, minus all cd_penalty amounts"
      prior_grace: "The grace add-ons already made in the current grace period are the grace_add_on deposits posted within the one month before the frozen date"
      shortfall: "The shortfall is jumbo_threshold minus that principal, rounded half-up to 2 decimal places | Where the recorded principal_balance differs from this reconciled figure, the reconciled figure governs the shortfall."
      top_up: "when the shortfall is below grace_add_on_min_amount the top-up is raised to grace_add_on_min_amount, otherwise the top-up equals the shortfall"
      funding: "the current_balance of the funding account"
      payout_status: "Whether it does is read from the status of the account named by payout_account_id, the checking account for pay_to_checking and the savings account for pay_to_savings"
      instructions_open: "a disposition of compound names no payout account. While the disposition pays to a closed payout account, no top-up is written."
      fits: "the top-up fits both the room left under grace_add_on_max_amount, which is grace_add_on_max_amount minus the grace add-ons already made in the current grace period, and the current_balance of the funding account"
      result: "A top-up is written only when the principal is below jumbo_threshold and the top-up fits both the room left under grace_add_on_max_amount"
    inputs:
      history:
        - {table: cd_transactions, aggregate: sum, field: amount, filters: {event_type: cd_deposit}}
        - {table: cd_transactions, aggregate: sum, field: amount, filters: {event_type: cd_interest_compound}}
        - {table: cd_transactions, aggregate: sum, field: amount, filters: {event_type: cd_penalty_reversal}}
        - {table: cd_transactions, aggregate: sum, field: amount, filters: {event_type: cd_withdrawal}}
        - {table: cd_transactions, aggregate: sum, field: amount, filters: {event_type: cd_penalty}}
        - {table: cd_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: cd_deposit, deposit_kind: grace_add_on}}
      cross_category: [savings, checking]

workflows:
  - id: cd_wf_post_grace_renewal_and_add_on
    scenario: >-
      Applies when the owner of a bump-up certificate whose grace period ended the day before, and whose renewal
      has not yet been booked, asks to add new money to it from a PCB savings or money market account while the
      certificate still carries a penalty booked contrary to the charter and a payout instruction naming a closed
      payout account. Once done, the penalty has been credited back, the certificate carries an instruction the
      bank can carry out, it stands renewed in an active new term at the rate the charter fixes, and the owner's
      add-on is posted to that new term.
    steps:
      - {tool: reverse_penalty_error_2ccc5de3, owner: agent, writes: cd_transactions, subject: cd_penalty_reversal, base_policy_refs: [cd_evt_penalty_reversal], role: credit back the penalty booked contrary to the charter, computed_by: [cd_ext_penalty_rate_reversal]}
      - {tool: update_maturity_instruction_96ab509d, owner: agent, writes: cd_certificates, subject: cd_update_instructions, base_policy_refs: [cd_instructions], role: replace the payout instruction that names a closed account, computed_by: [cd_ext_closed_payout_instruction]}
      - {tool: renew_certificate_term_21cb639a, owner: agent, writes: cd_certificates, subject: cd_renew, base_policy_refs: [cd_rate_and_bonuses, cd_evt_maturity_and_grace], role: book the renewal that fell due when grace ended, computed_by: [cd_ext_post_grace_renewal_rate]}
      - {tool: add_term_deposit_5f936ecf, owner: user, writes: cd_transactions, subject: cd_deposit, base_policy_refs: [cd_agg_combined_principal, cd_open_and_funding, cd_evt_maturity_and_grace, cd_evt_term_add_on], role: owner moves the new money into the new term, computed_by: [cd_ext_term_add_on_amount]}
    dataflow:
      - from_step: 2
        to_step: 3
        kind: state_effect
        source_table: cd_certificates
        source_field: status
        consumer_bindings: []
        establishes_gates:
          - {policy_id: cd_agg_combined_principal, eligibility_id: concentration_cap, evidence_field: cd_certificates.status}
          - {policy_id: cd_evt_term_add_on, eligibility_id: active_for_add_on, evidence_field: cd_certificates.status}
    order_rationale: >-
      The penalty reversal comes before the renewal because cd_ext_post_grace_renewal_rate judges the jumbo bonus
      on the principal reconciled from the ledger as it stands when the renewal is booked and requires every owed penalty reversal to
      be posted before the renewal is booked; booked the other way round, the new term's rate would be fixed on a
      principal that is short by the penalty and could miss jumbo_threshold. The instruction replacement also
      comes before the renewal because a certificate renews only under an instruction to renew automatically, and
      cd_instructions requires the payout account on record to be an active account of the owner when an
      instruction is recorded; swapped, the renewal would be booked on a certificate whose instruction still
      pays out to a closed account and the grace outcome would have no lawful basis. The reversal and the
      instruction change touch different fields (the ledger and principal versus the instruction and payout
      account), so the order between those two does not change any value, and the SOP records the reversal
      first. The renewal comes before the add-on because cd_evt_term_add_on allows a term add-on only while the
      certificate is active and cd_ext_term_add_on_amount measures the term cap from the current term_start_date;
      swapped, the add-on would be made on a certificate still in grace_period status with the previous term's
      add-on still counted, so no add-on could be accepted. Every step is a synchronous booking in the bank's own
      records at the same moment; none waits for a delivery, a clearing or the passage of time.
    prerequisite: []
