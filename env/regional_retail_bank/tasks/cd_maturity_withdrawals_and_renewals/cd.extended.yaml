  baseline:
    rule: The largest sum a single partial withdrawal may remove is the principal standing on the certificate less the balance the tier requires to remain after a partial withdrawal. The basis is the sum the withdrawal removes. The penalty charged on that sum is the basis multiplied by the rate the term carries, divided by one hundred, multiplied by the days the tier publishes as its early withdrawal penalty days and divided by the tier's day count basis. The whole figure so obtained is charged, and it is rounded to the nearest cent with a half rounded up, once, at the end, after the basis, the rate and the days have been brought together in that order. The proceeds leave the certificate on the day the owner gives the instruction, the penalty is deducted from the principal that remains, and a withdrawal paid by official check names no receiving account.
