  baseline:
    rule: An early partial withdrawal owes the certificate an entry for the principal it removed, and where the ledger carries no such entry against it the entry is still owed and is booked when it is found. The entry owed is worked out on the principal taken out of the certificate by early partial withdrawals in the three months before the day the entry is booked. That principal is multiplied by the rate the certificate carries, divided by one hundred, multiplied by the days the entry runs over and divided by the tier's day count basis. The days the entry runs over are the days the tier publishes as its early withdrawal penalty days. Nothing is added to those days. The figure is rounded to the nearest cent with a half rounded up, once, at the end, after the principal, the rate and the days have been brought together in that order. The entry is booked against the withdrawal it belongs to and the principal standing on the certificate falls by it.
    params:
    - early_withdrawal_penalty_days
    - day_count_basis
  inputs:
    history:
    - table: cd_transactions
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: cd_withdrawal
        withdrawal_kind: early_partial
    - table: cd_transactions
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: cd_interest_compound
    - table: cd_transactions
      aggregate: latest
      field: posted_date
      within_months: 0
      filters:
        event_type: cd_withdrawal
        withdrawal_kind: early_partial
    - category: auto
      table: auto_transactions
      aggregate: count
      field: amount
      within_months: 0
      filters:
        event_type: auto_payment
    cross_category:
    - card
    - auto
    - savings
- id: cd_ext_term_restoring_add_on
  base_policy_refs:
  - cd_evt_term_add_on
  - cd_evt_maturity_and_grace
  - cd_agg_combined_principal
  - cd_open_and_funding
  - cd_evt_early_withdrawal
  overwrite:
  - base_policy: cd_evt_term_add_on
    superseded_clause: Each add-on must be at least term_add_on_min_amount, the number of add-ons in the term counted by cd_msr_term_add_ons must stay within term_add_on_max_count, and their total must stay within term_add_on_max_amount; the principal after the add-on must not exceed maximum_opening_deposit.
    replaced_by: The deposit is then held to no more than the total the tier accepts in add-ons during a term less what has already been added in this term, and to no more than the room left under the largest principal a certificate of the tier may hold, and it must be at least the smallest single add-on the tier accepts.
  trigger: on_request
  subject:
  - cd_deposit
  computes: deposit_amount
  target_tool: confirm_term_add_on_1e70ab4d
  params:
    quarter_card_spending_figure: 800.0
  rule: 'The deposit is the owner''s own money and is made by the owner, it counts against the number of add-ons the tier allows in a term, and it earns the certificate''s existing rate from the day it posts without moving the maturity date. The deposit that restores a certificate to the principal its term began with is fixed only after every early partial withdrawal standing on its ledger carries the entry owed for the principal it removed. A certificate whose tier accepts deposits during a term may be restored in one deposit to the principal the term began with, and the deposit that does it is the principal the term has lost. The principal the term has lost is the principal taken out of the certificate by early partial withdrawals in the twelve months before the deposit, less any credit back posted to the certificate in those months. Interest on the loss is worked out at the tier''s published standard interest rate, and the days over which it runs are none, so nothing is added for the interest that principal would have earned. No allowance is added to the loss. The deposit is then held to no more than the total the tier accepts in add-ons during a term less what has already been added in this term, and to no more than the room left under the largest principal a certificate of the tier may hold, and it must be at least the smallest single add-on the tier accepts. The figure is rounded to the nearest cent with a half rounded up, once, at the end. The principal the term has lost is measured as follows: where the owner has an auto loan at the bank that is not past due and principal was taken out of the certificate more than once in the twelve months before the deposit, it is the principal those withdrawals removed together with every entry booked for them in those months, less any credit back posted in them; where the owner has an auto loan at the bank that is not past due and principal was taken out only once in those months, it is the principal that withdrawal removed together with every entry booked for it in those months; in every other case, whatever loans the owner has and however often principal was taken out, it is the principal taken out by early partial withdrawals in those months, less any credit back posted in them. Whether the deposit carries the interest the lost principal would have earned is graded: where the owner holds an active checking account of a tier the certificate''s own tier lists as qualifying and principal was taken out of the certificate more than once in the twelve months before, the deposit carries simple interest on the loss over the calendar days from the day the last sum left to the day of the deposit; where the owner holds an active checking account of such a tier and principal was taken out only once, the deposit carries simple interest on the loss over the calendar days from the day the term began to the day of the deposit; in every other case, whatever checking account the owner holds and however often principal was taken out, no interest is added. The rate that interest is worked out at is graded: an owner holding an active Cash Rewards Visa or Travel Rewards Visa Signature card with at least eight hundred dollars of card purchases posted in the three months before the deposit earns it at the rate the certificate carries; an owner holding an active card of any tier with less than eight hundred dollars of card purchases posted in those three months earns it at the tier''s published standard interest rate; every other owner, whatever card they hold and whatever they have charged to it, earns it at the tier''s published standard interest rate less the tier''s relationship bonus points. An allowance is added to the loss and is graded: where the owner''s active savings or money market balance is at least the tier''s largest total add-on for a term and the certificate has run through no earlier term, the smallest partial withdrawal the tier accepts is added; where that balance is at least the tier''s smallest opening deposit but below the tier''s largest total add-on for a term, the smallest single add-on the tier accepts is added; in every other case, whatever savings or money market account the owner holds and however many terms the certificate has run through, nothing is added. The rounding of the deposit is graded: where the certificate has taken no add-on since the term began and the owner has held their checking account with the bank for more than ten years, the deposit is rounded up to the next whole dollar; where the certificate has taken no add-on since the term began and the owner has held their checking account with the bank for ten years or less, the deposit is rounded down to the whole dollar; otherwise the deposit is rounded to the nearest cent with a half rounded up.'
  prerequisite:
  - problem: cd_ext_omitted_withdrawal_entry
    kind: value_input
    gate: entries_booked_year
    form: state
    policy_source: The deposit that restores a certificate to the principal its term began with is fixed only after every early partial withdrawal standing on its ledger carries the entry owed for the principal it removed.
    condition: Every early partial withdrawal posted to the certificate's ledger has an entry standing against it for the principal it removed, so the ledger shows no withdrawal without one.
    resolved_by: credit_mischarged_penalty_7001af6d
    effect: The binding that totals the entries booked for the term's withdrawals rises by the entry owed on the withdrawal that lacked one, so the principal the term has lost, and with it the restoring deposit, rises by the same figure.
  cross_category:
  - category: auto
    as: branch
    reads:
    - status
    note: The standing of the owner's auto loan decides the tier of how the principal the term has lost is measured.
  - category: checking
    as: branch
    reads:
    - status
    - variant_name
    - opened_date
    note: The tier of the owner's active checking account decides whether the deposit carries interest on the loss and over what span, and its opening date decides the tier of the rounding.
  - category: card
    as: history
    reads:
    - status
    - variant_name
    - card_transactions.amount
    note: The tier of the owner's active card and the purchases posted to it in the last three months decide the rate the restored interest is worked out at.
  - category: savings
    as: branch
    reads:
    - status
    - current_balance
    note: The balance of the owner's active savings or money market account decides the allowance added to the loss.
  compute:
  - withdrawn_principal_year: SUM('cd_transactions','amount', within_months=12, date_field='posted_date', event_type='cd_withdrawal', withdrawal_kind='early_partial')
  - withdrawals_in_year: COUNT('cd_transactions', within_months=12, date_field='posted_date', event_type='cd_withdrawal', withdrawal_kind='early_partial')
  - entries_booked_year: SUM('cd_transactions','amount', within_months=12, date_field='posted_date', event_type='cd_penalty')
  - credits_back_year: SUM('cd_transactions','amount', within_months=12, date_field='posted_date', event_type='cd_penalty_reversal')
  - auto_loan_standing: CFIELD('auto','status')
  - lost_principal: (withdrawn_principal_year + entries_booked_year - credits_back_year) if (auto_loan_standing == 'active' and withdrawals_in_year > 1) else ((withdrawn_principal_year + entries_booked_year) if (auto_loan_standing == 'active' and withdrawals_in_year == 1) else (withdrawn_principal_year - credits_back_year))
  - checking_tier_held: CFIELD('checking','variant_name', status='active')
  - last_withdrawal_date: LATEST('cd_transactions','posted_date', date_field='posted_date', event_type='cd_withdrawal', withdrawal_kind='early_partial')
  - qualifying_checking: 1 if (checking_tier_held in P('relationship_qualifying_checking_tiers')) else 0
  - interest_days: DAYS(last_withdrawal_date, NOW) if (qualifying_checking == 1 and withdrawals_in_year > 1) else (DAYS(F('term_start_date'), NOW) if (qualifying_checking == 1 and withdrawals_in_year == 1) else 0)
  - card_tier_held: CFIELD('card','variant_name', status='active')
  - card_purchases_quarter: XSUM('card','card_transactions','amount', within_months=3, date_field='posted_date', event_type='card_purchase')
  - restoration_rate: F('interest_rate') if ((card_tier_held == 'Cash Rewards Visa' or card_tier_held == 'Travel Rewards Visa Signature') and card_purchases_quarter >= K('quarter_card_spending_figure')) else (P('standard_interest_rate') if ((card_tier_held or '') != '' and card_purchases_quarter < K('quarter_card_spending_figure')) else P('standard_interest_rate') - P('relationship_apy_bonus'))
  - restored_interest: lost_principal * restoration_rate / 100 * interest_days / P('day_count_basis')
  - deposit_savings_balance: float(CFIELD('savings','current_balance', status='active') or 0)
  - restoration_allowance: P('partial_withdrawal_min_amount') if (deposit_savings_balance >= P('term_add_on_max_amount') and F('renewal_count') == 0) else (P('term_add_on_min_amount') if (deposit_savings_balance >= P('minimum_opening_deposit') and deposit_savings_balance < P('term_add_on_max_amount')) else 0)
  - restoring_deposit: lost_principal + restored_interest + restoration_allowance
  - add_ons_this_term: SUM('cd_transactions','amount', within_months=12, date_field='posted_date', event_type='cd_deposit', deposit_kind='term_add_on')
  - capped_deposit: MX(MN(MN(restoring_deposit, P('term_add_on_max_amount') - add_ons_this_term), P('maximum_opening_deposit') - F('principal_balance')), P('term_add_on_min_amount'))
  - profile_years: MONTHS(CFIELD('checking','opened_date', status='active') or NOW, NOW) / 12
  - rounded_deposit: ((int(capped_deposit) + (1 if capped_deposit > int(capped_deposit) else 0)) * 1.0) if (add_ons_this_term == 0 and profile_years > 10) else (float(int(capped_deposit)) if (add_ons_this_term == 0 and profile_years <= 10) else int(capped_deposit * 100 + 0.5) / 100)
  - result: rounded_deposit
