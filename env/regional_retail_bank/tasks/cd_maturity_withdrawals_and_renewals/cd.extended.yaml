    raw_penalty: The penalty charged on that sum is the basis multiplied by the rate the term carries, divided by one hundred, multiplied by the days the tier publishes as its early withdrawal penalty days and divided by the tier's day count basis.
    charged_penalty: 'The share of the figure actually charged is graded: an owner whose active savings or money market balance is at least the tier''s jumbo threshold and whose certificate has run through at least one earlier term is charged nine tenths of the figure; an owner whose active savings or money market balance is at least half the tier''s jumbo threshold but below that threshold and whose certificate has run through at least one earlier term is charged nineteen twentieths of the figure; every other owner is charged the whole figure.'
    checking_balance: 'The rounding of the figure charged is graded: where the owner''s active checking balance is at least the smallest partial withdrawal the tier accepts and the certificate has run through at least one earlier term, the figure is rounded up to the whole cent; where the owner holds an active checking account whose balance is below the smallest partial withdrawal the tier accepts, the figure is rounded down to the whole cent; otherwise the figure is rounded to the nearest cent with a half rounded up.'
    rounded_penalty: 'The rounding of the figure charged is graded: where the owner''s active checking balance is at least the smallest partial withdrawal the tier accepts and the certificate has run through at least one earlier term, the figure is rounded up to the whole cent; where the owner holds an active checking account whose balance is below the smallest partial withdrawal the tier accepts, the figure is rounded down to the whole cent; otherwise the figure is rounded to the nearest cent with a half rounded up.'
    result: The whole figure so obtained is charged, and it is rounded to the nearest cent with a half rounded up, once, at the end, after the basis, the rate and the days have been brought together in that order.
  factors:
  - id: penalty_basis_measure
    effect: method
    decides: charged_basis
    bindings:
    - interest_credited_one_month
    - earlier_partial_principal
    - partials_taken_recently
    - bonus_points_carried
    - charged_basis
    ladder:
    - when: interest has been credited to the certificate in the one month counted back from the day the principal leaves and the rate of the term now running stands above the tier's published standard interest rate
      method: the basis is the sum the withdrawal removes less the interest credited in that one month
    - when: principal was already taken out by an earlier partial withdrawal in the twelve months before this one and no interest has been credited in that one month
      method: the basis is the sum the withdrawal removes together with that earlier principal
    - when: otherwise
      method: the basis is the sum the withdrawal removes
