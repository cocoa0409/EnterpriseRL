  rule: 'An early partial withdrawal owes the certificate an entry for the principal it removed, and where the ledger carries no such entry against it the entry is still owed and is booked when it is found. The entry owed is worked out on the principal taken out of the certificate by early partial withdrawals in the three months before the day the entry is booked. That principal is multiplied by the rate the certificate carries, divided by one hundred, multiplied by the days the entry runs over and divided by the tier''s day count basis. The days the entry runs over are the days the tier publishes as its early withdrawal penalty days. Nothing is added to those days. The figure is rounded to the nearest cent with a half rounded up, once, at the end, after the principal, the rate and the days have been brought together in that order. The entry is booked against the withdrawal it belongs to and the principal standing on the certificate falls by it. The principal the entry is worked out on is measured as follows: where the owner holds an active Piedmont Crescent card opened before the term began and interest was credited to the certificate in each of the three months before the entry is booked, it is the principal taken out by early partial withdrawals in those three months together with the interest credited in them; where the owner holds an active Piedmont Crescent card and either that card was opened after the term began or interest was credited in fewer than each of those three months, it is the principal taken out by early partial withdrawals in those three months less the interest credited in them; where the owner holds no active card, it is the principal taken out by early partial withdrawals in those three months. The rate the entry runs at is graded: an owner with an auto loan at the bank that is not past due and at least twelve payments posted to it is charged at the tier''s published standard interest rate; an owner with an auto loan at the bank that is not past due and fewer than twelve payments posted to it is charged at the rate the certificate carries less the tier''s jumbo bonus points; every other owner is charged at the rate the certificate carries. The days the entry runs over are measured as follows: where the owner''s active savings or money market balance is at least the tier''s smallest opening deposit and interest was credited to the certificate in each of the three months before the entry is booked, the days that passed between the day the principal left and the day the entry is booked are added to the days the tier publishes, and the total is held to no more than the days the tier publishes increased by half; where that balance is at least the tier''s smallest opening deposit but interest was credited in fewer than each of those months, the days are half the days the tier publishes, rounded down to a whole day; in every other case, whatever savings or money market account the owner holds and whatever it holds in it, the days are the days the tier publishes. A further allowance is added to those days: where the entry is booked more than thirty days after the principal left and the owner holds an active savings or money market account, the days the tier publishes as its minimum after funding are added; where the entry is booked more than thirty days after the principal left and the owner holds no such account, half of those minimum days, rounded down to a whole day, are added; where the entry is booked within thirty days of the day the principal left, nothing is added.'
