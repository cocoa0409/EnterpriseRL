  - days_since_principal_left: DAYS(principal_left_date, NOW)
  - entry_days: MN(P('early_withdrawal_penalty_days') + days_since_principal_left, P('early_withdrawal_penalty_days') * 3 / 2) if (deposit_balance_for_days >= P('minimum_opening_deposit') and interest_months_recent >= 3) else (int(P('early_withdrawal_penalty_days') / 2) if (deposit_balance_for_days >= P('minimum_opening_deposit') and interest_months_recent < 3) else P('early_withdrawal_penalty_days'))
  - deposit_balance_for_allowance: float(CFIELD('savings','current_balance', status='active') or 0)
  - added_days: P('first_six_days_minimum_penalty_days') if (days_since_principal_left > K('late_booking_days') and deposit_balance_for_allowance > 0) else (int(P('first_six_days_minimum_penalty_days') / 2) if (days_since_principal_left > K('late_booking_days') and deposit_balance_for_allowance == 0) else 0)
  - raw_entry: entry_principal * entry_rate / 100 * (entry_days + added_days) / P('day_count_basis')
  - result: int(raw_entry * 100 + 0.5) / 100
