  - entry_principal: (withdrawn_principal_recent + interest_credited_recent) if (card_before_term == 1 and interest_months_recent >= 3) else ((withdrawn_principal_recent - interest_credited_recent) if (card_held == 1 and (card_before_term == 0 or interest_months_recent < 3)) else withdrawn_principal_recent)
  - auto_loan_status: CFIELD('auto','status')
  - auto_payment_count: XCOUNT('auto','auto_transactions', date_field='posted_date', event_type='auto_payment')
  - entry_rate: P('standard_interest_rate') if (auto_loan_status == 'active' and auto_payment_count >= 12) else ((F('interest_rate') - P('jumbo_apy_bonus')) if (auto_loan_status == 'active' and auto_payment_count < 12) else F('interest_rate'))
