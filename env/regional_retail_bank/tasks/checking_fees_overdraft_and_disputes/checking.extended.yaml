    overwrite:
      - base_policy: checking_agg_relationship_balance
        superseded_clause: "Every checking rule that speaks of a relationship balance uses one basis, the measure checking_msr_relationship_balance: the customer's deposit balances at PCB summed across checking, savings and certificate holdings in the customer's own name, taken at close of business on the measurement date."
        replaced_by: "Outside the determinations of checking_ext_cycle_close_relationship_refund and checking_ext_private_client_entry_conversion, every checking rule that speaks of a relationship balance keeps the one basis, the measure checking_msr_relationship_balance: the customer's deposit balances at PCB summed across checking, savings and certificate holdings in the customer's own name, taken at close of business on the measurement date. For this test the relationship balance is the sum of this checking account's ledger balance, counted as zero when negative, the current_balance of the owner's savings account in each of the statuses applied, active and dormant, the principal_balance of the owner's certificate in each of the statuses applied, active and grace_period, and, because the target tier counts mortgage principal, the principal_balance of the owner's mortgage loan in each of the statuses active, delinquent and forbearance; the owner's other checking accounts are not counted, and where the owner holds more than one holding of one category in the same status only the first on the customer's record is counted."
    trigger: on_request
    subject: [checking_change_product]
    computes: variant_name
    target_tool: convert_checking_tier_696add48
    params:
      target_tier: Private Client Checking
      target_entry_min: 250000.00
      target_includes_mortgage: true
    rule: >-
      When the owner of an active checking account asks to convert it to Private Client Checking, the relationship
      part of the Private Client entry gate is tested on the relationship balance on the frozen date on which the
      request is handled; the target tier's entry_relationship_balance_min and relationship_balance_includes_mortgage,
      carried here as target_entry_min and target_includes_mortgage, are the figures used. The other conditions of
      checking_product_change are inherited unchanged and must also hold: the account is active, the owner's age is
      at least the target tier's age_min_to_open, the owner holds fewer Private Client Checking accounts than its
      max_accounts_per_customer_this_tier and stays within checking_agg_multi_holding, and no other
      customer-requested conversion has been recorded on the account in the current statement cycle; where any of them fails, no conversion is written whatever the relationship balance. The checking records keep no dated history of conversions apart from the account's current tier, so the once-per-cycle limit is judged on the conversions recorded during the current contact together with any the owner reports having made earlier in the cycle; when neither shows one, the limit holds. Before the Private Client entry test is
      applied, the refund of every overdraft item fee and every extended overdraft fee charged in error on the account, the most recent of each as checking_ext_uncovered_item_fee_refund and checking_ext_uncovered_episode_extended_fee_refund find them and any earlier one under checking_evt_fee_refund, is posted first, because pending credits that have not posted do not count. Outside the determinations of checking_ext_cycle_close_relationship_refund and checking_ext_private_client_entry_conversion, every checking rule that speaks of a relationship balance keeps the one basis, the measure checking_msr_relationship_balance: the customer's deposit balances at PCB summed across checking, savings and certificate holdings in the customer's own name, taken at close of business on the measurement date. For this test the relationship balance is the sum of this checking
      account's ledger balance, counted as zero when negative, the current_balance of the owner's savings account in
      each of the statuses applied, active and dormant, the principal_balance of the owner's certificate in each of
      the statuses applied, active and grace_period, and, because the target tier counts mortgage principal, the
      principal_balance of the owner's mortgage loan in each of the statuses active, delinquent and forbearance; the
      owner's other checking accounts are not counted, and where the owner holds more than one holding of one
      category in the same status only the first on the customer's record is counted. When the inherited conditions
      hold and the relationship balance is at or above target_entry_min, the tier recorded is Private Client
      Checking; when the relationship balance is below it, the conversion is not made and the account keeps its
      current tier, so nothing is written. No rounding applies because the result is a tier name.
    prerequisite:
      - problem: checking_ext_uncovered_item_fee_refund
        kind: value_input
        gate: own_part
        condition: "Every overdraft item fee charged in error on the account has been refunded before the Private Client entry test is applied."
        policy_source: "the refund of every overdraft item fee and every extended overdraft fee charged in error on the account, the most recent of each as checking_ext_uncovered_item_fee_refund and checking_ext_uncovered_episode_extended_fee_refund find them and any earlier one under checking_evt_fee_refund, is posted first, because pending credits that have not posted do not count."
        resolved_by: refund_uncovered_overdraft_fee_6b0f4e50
        effect: "The refunded overdraft item fee raises the ledger balance, so own_part and the relationship balance rise by the refunded amount before the entry comparison."
      - problem: checking_ext_uncovered_episode_extended_fee_refund
        kind: value_input
        gate: own_part
        condition: "Every extended overdraft fee charged in error on the account has been refunded before the Private Client entry test is applied."
        policy_source: "the refund of every overdraft item fee and every extended overdraft fee charged in error on the account, the most recent of each as checking_ext_uncovered_item_fee_refund and checking_ext_uncovered_episode_extended_fee_refund find them and any earlier one under checking_evt_fee_refund, is posted first, because pending credits that have not posted do not count."
        resolved_by: refund_extended_overdraft_fee_22b46ecc
        effect: "The refunded extended overdraft fee raises the ledger balance, so own_part and the relationship balance rise by the refunded amount before the entry comparison."
    cross_category:
      - category: savings
        as: branch
        reads: [current_balance, status]
        note: The owner's savings balances in the counted statuses are a part of the relationship balance compared with the entry minimum.
      - category: cd
        as: branch
        reads: [principal_balance, status]
        note: The owner's certificate principal in the counted statuses is a part of the relationship balance.
      - category: mortgage
        as: branch
        reads: [principal_balance, status]
        note: Mortgage principal in the counted statuses counts because the target tier includes mortgage principal.
    compute:
      - own_part: "0 if F('ledger_balance') < 0 else F('ledger_balance')"
      - savings_part: "(CFIELD('savings', 'current_balance', status='applied') or 0) + (CFIELD('savings', 'current_balance', status='active') or 0) + (CFIELD('savings', 'current_balance', status='dormant') or 0)"
      - cd_part: "(CFIELD('cd', 'principal_balance', status='applied') or 0) + (CFIELD('cd', 'principal_balance', status='active') or 0) + (CFIELD('cd', 'principal_balance', status='grace_period') or 0)"
      - mortgage_part: "((CFIELD('mortgage', 'principal_balance', status='active') or 0) + (CFIELD('mortgage', 'principal_balance', status='delinquent') or 0) + (CFIELD('mortgage', 'principal_balance', status='forbearance') or 0)) if K('target_includes_mortgage') else 0"
      - relationship: "own_part + savings_part + cd_part + mortgage_part"
      - result: "K('target_tier') if relationship >= K('target_entry_min') else F('variant_name')"
    compute_basis:
      own_part: "this checking account's ledger balance, counted as zero when negative"
      savings_part: "the current_balance of the owner's savings account in each of the statuses applied, active and dormant"
      cd_part: "the principal_balance of the owner's certificate in each of the statuses applied, active and grace_period"
      mortgage_part: "because the target tier counts mortgage principal, the principal_balance of the owner's mortgage loan in each of the statuses active, delinquent and forbearance"
      relationship: "the relationship part of the Private Client entry gate is tested on the relationship balance on the frozen date on which the request is handled"
      result: "When the inherited conditions hold and the relationship balance is at or above target_entry_min, the tier recorded is Private Client Checking; when the relationship balance is below it, the conversion is not made and the account keeps its current tier, so nothing is written."
    inputs:
      history: []
      cross_category: [savings, cd, mortgage]

workflows:
  - id: checking_wf_owed_credits_before_waiver_review
    scenario: >-
      Applies when the owner of an active Personal Checking account questions a monthly maintenance fee dated the
      current business day, the account's cycle closing date, while the account carries overdraft transfer fees
      charged contrary to the charter and a single submitted electronic-transaction dispute whose provisional credit
      has fallen due. Once the procedure is complete the owed refunds and the owed provisional credit are on the
      ledger, the relationship waiver for the questioned fee has been judged on the resulting close-of-business
      relationship balance, and the fee has been refunded as a bank error when that waiver is met.
    steps:
      - {tool: refund_transfer_fee_error_033d9cbf, owner: agent, writes: checking_transactions, subject: checking_fee_refund, base_policy_refs: [checking_evt_fee_refund, checking_evt_electronic_dispute], role: refund an earlier overdraft transfer fee charged in error under the base bank-error ground, computed_by: []}
      - {tool: refund_transfer_fee_error_033d9cbf, owner: agent, writes: checking_transactions, subject: checking_fee_refund, base_policy_refs: [checking_evt_fee_refund, checking_evt_electronic_dispute], role: refund the most recent overdraft transfer fee charged in error, computed_by: [checking_ext_transfer_fee_source_error_refund]}
      - {tool: post_dispute_provisional_credit_5453b90d, owner: agent, writes: checking_transactions, subject: checking_provisional_credit, base_policy_refs: [checking_evt_electronic_dispute], role: post the provisional credit that has fallen due, computed_by: [checking_ext_autopay_dispute_provisional_credit]}
      - {tool: refund_same_day_maintenance_fee_e9518b99, owner: agent, writes: checking_transactions, subject: checking_fee_refund, base_policy_refs: [checking_evt_fee_refund, checking_evt_electronic_dispute], role: judge the relationship waiver and refund the questioned fee, computed_by: [checking_ext_cycle_close_relationship_refund]}
    dataflow: []
    order_rationale: >-
      Step 0 before step 1 and step 1 before step 2: checking_ext_cycle_close_relationship_refund posts the fee
      refunds in the order the fees posted and all of them before the dispute credit, so the earlier transfer fee is
      refunded first, the most recent one next, and the provisional credit after both. Step 2 before step 3: the same
      rule posts every owed credit before the relationship waiver is judged, because pending credits that have not
      posted do not count; judging the waiver first would measure a relationship balance without the owed credits.
      What step 3 consumes from steps 0 to 2 is the account's ledger balance, which each posting raises as a side
      effect on the account record rather than as a field of the ledger entry it writes, so no dataflow link can
      name it and none is declared. No step depends on a real-world event or the passage of time: each is a posting
      the agent completes synchronously in the same contact. The procedure has no customer-owned step because none
      of its postings is an owner's consent or claim under the checking charter.
    prerequisite: []
