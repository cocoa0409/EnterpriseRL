- id: checking_ext_dispute_provisional_credit
  base_policy_refs:
  - checking_evt_electronic_dispute
  overwrite:
  - base_policy: checking_evt_electronic_dispute
    superseded_clause: The provisional credit amount is the dispute's claimed_amount, but never more than the disputed item's
      amount.
    replaced_by: The temporary credit is the claimed total taken at the credited share and rounded half-up to the cent,
      with the charge offset added to it.
  trigger: state_due
  subject:
  - checking_provisional_credit
  computes: credit_amount
  target_tool: post_dispute_provisional_credit_b16208c2
  params:
    claim_window_months: 2
    protection_source_minimum: 5000
    certificate_relationship_minimum: 25000
    whole_credited_share: 1.0
    most_credited_share: 0.75
    half_credited_share: 0.5
    half_share: 0.5
    whole_dollar_step: 5
  rule: 'Where a claim on card, cash machine, direct debit or person-to-person items is still being looked into once the
    credit has fallen due, the bank puts a temporary credit onto the account so that the owner is not left out of pocket
    while the work goes on. The temporary credit is the claimed total taken at the credited share and rounded half-up to
    the cent, with the charge offset added to it. The claimed total is every foreign card item posted to the account, whenever
    it posted. Where the owner has made at least six card payments in the last twelve months and a foreign card item stands
    on the account, only the foreign card items posted inside the claim window make up the claimed total; where the case
    above does not apply and the owner has made at least three card payments in the last twelve months or a foreign card
    item stands inside the claim window, only the largest single foreign card item makes up the claimed total. The credited
    share is half of the claimed total. Where the owner''s premier money market balance reaches the protection source minimum
    and the owner has made at least six card payments in the last twelve months, the whole of the claimed total is credited
    instead; where the case above does not apply and the owner holds any premier money market balance or has made at least
    three card payments in the last twelve months, three quarters of it is credited. No charge offset is added. Where the
    owner''s certificate principal is above zero and the owner has made at least six card payments in the last twelve months,
    the tier''s overdraft fee for each item is added as the charge offset instead; where the case above does not apply and
    the certificate principal reaches the certificate relationship minimum or the premier money market balance reaches the
    protection source minimum, half of that fee is added as the charge offset. The temporary credit is taken in whole five-dollar
    steps, rounded half-up. Where at least two foreign card items stand on the account and the owner has made at least six
    card payments in the last twelve months, the temporary credit is taken to the cent instead; where the case above does
    not apply and at least four such items stand or the owner has made at least fifteen card payments in the last twelve
    months, it is taken in whole dollars, rounded half-up. A claim that has already been decided is outside this rule and
    receives no temporary credit.

    '
  prerequisite: []
  cross_category:
  - category: card
    as: history
    reads:
    - card_transactions.event_type
    note: The count of card payments in the last twelve months decides which tier of the claimed total applies.
  - category: savings
    as: branch
    reads:
    - current_balance
    note: The premier money market balance decides which tier of the credited share applies.
  - category: cd
    as: branch
    reads:
    - principal_balance
    note: The certificate principal decides which tier of the charge offset applies.
  compute:
  - card_payment_count_12m: XCOUNT('card','card_transactions', within_months=12, date_field='posted_date', event_type='card_payment')
  - foreign_windowed: SUM('checking_transactions','amount', within_months=K('claim_window_months'), date_field='posted_date',
      event_type='checking_debit', channel='debit_card_international')
  - foreign_all: SUM('checking_transactions','amount', event_type='checking_debit', channel='debit_card_international')
  - foreign_largest: MAX('checking_transactions','amount', event_type='checking_debit', channel='debit_card_international')
  - claimed_total: foreign_windowed if (card_payment_count_12m >= 6 and foreign_all > 0) else (foreign_largest if (card_payment_count_12m
      >= 3 or foreign_windowed > 0) else foreign_all)
  - mm_balance: CFIELD('savings','current_balance', variant_name='Premier Money Market', status='active')
  - credited_share: K('whole_credited_share') if (mm_balance >= K('protection_source_minimum') and card_payment_count_12m
      >= 6) else (K('most_credited_share') if (mm_balance > 0 or card_payment_count_12m >= 3) else K('half_credited_share'))
  - cd_principal: CFIELD('cd','principal_balance', status='active')
  - charge_offset: P('overdraft_fee_per_item') if (cd_principal > 0 and card_payment_count_12m >= 6) else (RND(P('overdraft_fee_per_item')
      * K('half_share'), 2) if (cd_principal >= K('certificate_relationship_minimum') or mm_balance >= K('protection_source_minimum'))
      else 0.0)
  - gross_credit: RND(claimed_total * credited_share, 2) + charge_offset
  - foreign_item_count: COUNT('checking_transactions', event_type='checking_debit', channel='debit_card_international')
  - temporary_credit: RND(gross_credit, 2) if (foreign_item_count >= 2 and card_payment_count_12m >= 6) else (RND(gross_credit,
      0) if (foreign_item_count >= 4 or card_payment_count_12m >= 15) else RND(gross_credit / K('whole_dollar_step'), 0)
      * K('whole_dollar_step'))
  - result: temporary_credit
  compute_basis:
    card_payment_count_12m: Where the owner has made at least six card payments in the last twelve months and a foreign
      card item stands on the account, only the foreign card items posted inside the claim window make up the claimed total
    foreign_windowed: Where the owner has made at least six card payments in the last twelve months and a foreign card item
      stands on the account, only the foreign card items posted inside the claim window make up the claimed total
    foreign_all: The claimed total is every foreign card item posted to the account, whenever it posted.
    foreign_largest: where the case above does not apply and the owner has made at least three card payments in the last
      twelve months or a foreign card item stands inside the claim window, only the largest single foreign card item makes
      up the claimed total
    claimed_total: The claimed total is every foreign card item posted to the account, whenever it posted. Where the owner
      has made at least six card payments in the last twelve months and a foreign card item stands on the account, only
      the foreign card items posted inside the claim window make up the claimed total; where the case above does not apply
      and the owner has made at least three card payments in the last twelve months or a foreign card item stands inside
      the claim window, only the largest single foreign card item makes up the claimed total.
    mm_balance: Where the owner's premier money market balance reaches the protection source minimum and the owner has made
      at least six card payments in the last twelve months, the whole of the claimed total is credited instead; where the
      case above does not apply and the owner holds any premier money market balance or has made at least three card payments
      in the last twelve months, three quarters of it is credited.
    credited_share: The credited share is half of the claimed total. Where the owner's premier money market balance reaches
      the protection source minimum and the owner has made at least six card payments in the last twelve months, the whole
      of the claimed total is credited instead; where the case above does not apply and the owner holds any premier money
      market balance or has made at least three card payments in the last twelve months, three quarters of it is credited.
    cd_principal: Where the owner's certificate principal is above zero and the owner has made at least six card payments
      in the last twelve months, the tier's overdraft fee for each item is added as the charge offset instead; where the
      case above does not apply and the certificate principal reaches the certificate relationship minimum or the premier
      money market balance reaches the protection source minimum, half of that fee is added as the charge offset.
    charge_offset: No charge offset is added. Where the owner's certificate principal is above zero and the owner has made
      at least six card payments in the last twelve months, the tier's overdraft fee for each item is added as the charge
      offset instead; where the case above does not apply and the certificate principal reaches the certificate relationship
      minimum or the premier money market balance reaches the protection source minimum, half of that fee is added as the
      charge offset.
    gross_credit: The temporary credit is the claimed total taken at the credited share and rounded half-up to the cent,
      with the charge offset added to it.
    foreign_item_count: Where at least two foreign card items stand on the account and the owner has made at least six card
      payments in the last twelve months, the temporary credit is taken to the cent instead
    temporary_credit: The temporary credit is taken in whole five-dollar steps, rounded half-up. Where at least two foreign
      card items stand on the account and the owner has made at least six card payments in the last twelve months, the temporary
      credit is taken to the cent instead; where the case above does not apply and at least four such items stand or the
      owner has made at least fifteen card payments in the last twelve months, it is taken in whole dollars, rounded half-up.
  factors:
  - id: claimed_total_basis
    effect: method
    decides: claimed_total
    bindings:
    - card_payment_count_12m
    - foreign_windowed
    - foreign_all
    - foreign_largest
    - claimed_total
    ladder:
    - when: the owner has made at least six card payments in the last twelve months and a foreign card item stands on the
        account
      method: only the foreign card items posted inside the claim window are summed
    - when: the case above does not apply and the owner has made at least three card payments in the last twelve months
        or a foreign card item stands inside the claim window
      method: only the largest single foreign card item is taken
    - when: otherwise
      method: every foreign card item posted to the account is summed, whenever it posted
    baseline:
      claimed_total: foreign_all
    evidence:
    - history
    - cross_category
    cross_difficulty: card
  - id: credited_share_level
    effect: parameter
    decides: credited_share
    bindings:
    - mm_balance
    - credited_share
    ladder:
    - when: the owner's premier money market balance reaches the protection source minimum and the owner has made at least
        six card payments in the last twelve months
      value: K('whole_credited_share')
    - when: the case above does not apply and the owner holds any premier money market balance or has made at least three
        card payments in the last twelve months
      value: K('most_credited_share')
    - when: otherwise
      value: K('half_credited_share')
    baseline:
      credited_share: K('half_credited_share')
    evidence:
    - cross_category
    - history
    cross_difficulty: savings
  - id: charge_offset_level
    effect: parameter
    decides: charge_offset
    bindings:
    - cd_principal
    - charge_offset
    ladder:
    - when: the owner's certificate principal is above zero and the owner has made at least six card payments in the last
        twelve months
      value: P('overdraft_fee_per_item')
    - when: the case above does not apply and the certificate principal reaches the certificate relationship minimum or
        the premier money market balance reaches the protection source minimum
      value: RND(P('overdraft_fee_per_item') * K('half_share'), 2)
    - when: otherwise
      value: '0.0'
    baseline:
      charge_offset: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: cd
  - id: temporary_credit_rounding
    effect: method
    decides: temporary_credit
    bindings:
    - foreign_item_count
    - temporary_credit
    ladder:
    - when: at least two foreign card items stand on the account and the owner has made at least six card payments in the
        last twelve months
      method: the temporary credit is taken to the cent
    - when: the case above does not apply and at least four such items stand or the owner has made at least fifteen card
        payments in the last twelve months
      method: the temporary credit is taken in whole dollars, rounded half-up
    - when: otherwise
      method: the temporary credit is taken in whole five-dollar steps, rounded half-up
    baseline:
      temporary_credit: RND(gross_credit / K('whole_dollar_step'), 0) * K('whole_dollar_step')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The temporary credit is the claimed total taken at the credited share and rounded half-up to the cent, with the
      charge offset added to it. The claimed total is every foreign card item posted to the account, whenever it posted.
      The credited share is half of the claimed total. No charge offset is added. The temporary credit is taken in whole
      five-dollar steps, rounded half-up.
    params:
    - half_credited_share
    - whole_dollar_step
  inputs:
    history:
    - table: checking_transactions
      aggregate: sum
      field: amount
      within_months: 2
      filters:
        event_type: checking_debit
        channel: debit_card_international
    - table: checking_transactions
      aggregate: count
      field: amount
      filters:
        event_type: checking_debit
        channel: debit_card_international
    - category: card
      table: card_transactions
      aggregate: count
      field: amount
      within_months: 12
      filters:
        event_type: card_payment
    cross_category:
    - card
    - savings
    - cd
- id: checking_ext_overdraft_protection_source
  base_policy_refs:
  - checking_evt_overdraft_protection_transfer
  overwrite: []
  trigger: state_due
  subject:
  - checking_set_overdraft_link
  computes: overdraft_link_savings_account_id
  target_tool: authorize_overdraft_protection_source_1d4e232c
  params:
    light_cover_requirement: 250
    standard_cover_requirement: 1500
    full_cover_requirement: 25000
    no_cover_reserve: 0
    modest_cover_reserve: 2500
    full_cover_reserve: 13000
    protection_source_minimum: 5000
    certificate_relationship_minimum: 25000
    minimum_cover_share: 0.02
    half_share: 0.5
  rule: 'Where a personal checking account has been paid into overdraft and its record names no protection source, the record
    owes one. A personal checking account may name one of the owner''s own savings accounts as the protection source the
    bank draws on to cover an item that would otherwise overdraw it, and because it is the owner''s own savings that would
    be drawn on, the owner names it in person. The protection source is the first of the owner''s own savings accounts,
    tried in the order set below, whose usable cover reaches the cover a source must provide; where no savings account reaches
    it, no protection source is named. The cover a source must provide is the full cover requirement. Where the owner has
    made at least six card payments in the last twelve months and the owner''s premier money market balance reaches the
    protection source minimum, the cover a source must provide is the light cover requirement instead; where the case above
    does not apply and the owner has made at least three card payments in the last twelve months or the owner holds any
    statement savings balance, it is the standard cover requirement. The cover reserve is the full cover reserve. Where
    the owner''s premier money market balance reaches the protection source minimum and the owner has made at least six
    card payments in the last twelve months, the cover reserve is nothing at all instead; where the case above does not
    apply and the owner''s statement savings balance reaches the protection source minimum or the owner''s certificate principal
    is above zero, it is the modest cover reserve. The usable cover of a savings account is the minimum cover share of its
    balance, less the cover reserve, and never below zero. Where the owner''s certificate principal is above zero and the
    owner has made at least six card payments in the last twelve months, the usable cover is the whole of that balance less
    the cover reserve instead; where the case above does not apply and the certificate principal reaches the certificate
    relationship minimum or the premier money market balance reaches the protection source minimum, it is half of that balance
    less the cover reserve. The order candidates are tried in is the statement savings account first and the premier money
    market account second. Where the owner has made at least six card payments in the last twelve months and the owner''s
    premier money market balance reaches the protection source minimum, the premier money market account is tried first
    and the statement savings account second; where the case above does not apply and the owner holds any statement savings
    balance or the owner''s certificate principal is above zero, whichever of the two carries the greater usable cover is
    tried first. A savings account that is not the owner''s own or is not in active status is never named, whatever cover
    it carries.

    '
  prerequisite: []
  cross_category:
  - category: savings
    as: branch
    reads:
    - savings_account_id
    - current_balance
    - variant_name
    - status
    note: The savings holdings supply the candidates themselves and the balance the cover reserve tier is decided from.
  - category: card
    as: history
    reads:
    - card_transactions.event_type
    note: The count of card payments in the last twelve months decides which tier of the cover a source must provide applies.
  - category: cd
    as: branch
    reads:
    - principal_balance
    note: The certificate principal decides which tier of the usable cover measure applies.
  compute:
  - mm_id: CFIELD('savings','savings_account_id', variant_name='Premier Money Market', status='active')
  - stmt_id: CFIELD('savings','savings_account_id', variant_name='Statement Savings', status='active')
  - mm_balance: CFIELD('savings','current_balance', variant_name='Premier Money Market', status='active')
  - stmt_balance: CFIELD('savings','current_balance', variant_name='Statement Savings', status='active')
  - card_payment_count_12m: XCOUNT('card','card_transactions', within_months=12, date_field='posted_date', event_type='card_payment')
  - cd_principal: CFIELD('cd','principal_balance', status='active')
  - required_cover: K('light_cover_requirement') if (card_payment_count_12m >= 6 and mm_balance >= K('protection_source_minimum'))
      else (K('standard_cover_requirement') if (card_payment_count_12m >= 3 or stmt_balance > 0) else K('full_cover_requirement'))
  - cover_reserve: K('no_cover_reserve') if (mm_balance >= K('protection_source_minimum') and card_payment_count_12m >=
      6) else (K('modest_cover_reserve') if (stmt_balance >= K('protection_source_minimum') or cd_principal > 0) else K('full_cover_reserve'))
  - mm_cover: MX(0.0, mm_balance - cover_reserve) if (cd_principal > 0 and card_payment_count_12m >= 6) else (MX(0.0, RND(mm_balance
      * K('half_share'), 2) - cover_reserve) if (cd_principal >= K('certificate_relationship_minimum') or mm_balance >=
      K('protection_source_minimum')) else MX(0.0, RND(mm_balance * K('minimum_cover_share'), 2) - cover_reserve))
  - stmt_cover: MX(0.0, stmt_balance - cover_reserve) if (cd_principal > 0 and card_payment_count_12m >= 6) else (MX(0.0,
      RND(stmt_balance * K('half_share'), 2) - cover_reserve) if (cd_principal >= K('certificate_relationship_minimum')
      or mm_balance >= K('protection_source_minimum')) else MX(0.0, RND(stmt_balance * K('minimum_cover_share'), 2) - cover_reserve))
  - source_choice: (mm_id if mm_cover >= required_cover else (stmt_id if stmt_cover >= required_cover else '')) if (card_payment_count_12m
      >= 6 and mm_balance >= K('protection_source_minimum')) else ((mm_id if (mm_cover >= stmt_cover and mm_cover >= required_cover)
      else (stmt_id if stmt_cover >= required_cover else '')) if (stmt_balance > 0 or cd_principal > 0) else (stmt_id if
      stmt_cover >= required_cover else (mm_id if mm_cover >= required_cover else '')))
  - result: source_choice
  compute_basis:
    mm_id: The protection source is the first of the owner's own savings accounts, tried in the order set below, whose usable
      cover reaches the cover a source must provide; where no savings account reaches it, no protection source is named.
    stmt_id: The protection source is the first of the owner's own savings accounts, tried in the order set below, whose
      usable cover reaches the cover a source must provide; where no savings account reaches it, no protection source is
      named.
    mm_balance: The usable cover of a savings account is the minimum cover share of its balance, less the cover reserve,
      and never below zero.
    stmt_balance: The usable cover of a savings account is the minimum cover share of its balance, less the cover reserve,
      and never below zero.
    card_payment_count_12m: Where the owner has made at least six card payments in the last twelve months and the owner's
      premier money market balance reaches the protection source minimum, the cover a source must provide is the light cover
      requirement instead; where the case above does not apply and the owner has made at least three card payments in the
      last twelve months or the owner holds any statement savings balance, it is the standard cover requirement.
    cd_principal: Where the owner's certificate principal is above zero and the owner has made at least six card payments
      in the last twelve months, the usable cover is the whole of that balance less the cover reserve instead; where the
      case above does not apply and the certificate principal reaches the certificate relationship minimum or the premier
      money market balance reaches the protection source minimum, it is half of that balance less the cover reserve.
    required_cover: The cover a source must provide is the full cover requirement. Where the owner has made at least six
      card payments in the last twelve months and the owner's premier money market balance reaches the protection source
      minimum, the cover a source must provide is the light cover requirement instead; where the case above does not apply
      and the owner has made at least three card payments in the last twelve months or the owner holds any statement savings
      balance, it is the standard cover requirement.
    cover_reserve: The cover reserve is the full cover reserve. Where the owner's premier money market balance reaches the
      protection source minimum and the owner has made at least six card payments in the last twelve months, the cover reserve
      is nothing at all instead; where the case above does not apply and the owner's statement savings balance reaches the
      protection source minimum or the owner's certificate principal is above zero, it is the modest cover reserve.
    mm_cover: The usable cover of a savings account is the minimum cover share of its balance, less the cover reserve, and
      never below zero. Where the owner's certificate principal is above zero and the owner has made at least six card payments
      in the last twelve months, the usable cover is the whole of that balance less the cover reserve instead; where the
      case above does not apply and the certificate principal reaches the certificate relationship minimum or the premier
      money market balance reaches the protection source minimum, it is half of that balance less the cover reserve.
    stmt_cover: The usable cover of a savings account is the minimum cover share of its balance, less the cover reserve,
      and never below zero. Where the owner's certificate principal is above zero and the owner has made at least six card
      payments in the last twelve months, the usable cover is the whole of that balance less the cover reserve instead;
      where the case above does not apply and the certificate principal reaches the certificate relationship minimum or
      the premier money market balance reaches the protection source minimum, it is half of that balance less the cover
      reserve.
    source_choice: The order candidates are tried in is the statement savings account first and the premier money market
      account second. Where the owner has made at least six card payments in the last twelve months and the owner's premier
      money market balance reaches the protection source minimum, the premier money market account is tried first and the
      statement savings account second; where the case above does not apply and the owner holds any statement savings balance
      or the owner's certificate principal is above zero, whichever of the two carries the greater usable cover is tried
      first.
  factors:
  - id: required_cover_level
    effect: parameter
    decides: required_cover
    bindings:
    - card_payment_count_12m
    - required_cover
    ladder:
    - when: the owner has made at least six card payments in the last twelve months and the owner's premier money market
        balance reaches the protection source minimum
      value: K('light_cover_requirement')
    - when: the case above does not apply and the owner has made at least three card payments in the last twelve months
        or the owner holds any statement savings balance
      value: K('standard_cover_requirement')
    - when: otherwise
      value: K('full_cover_requirement')
    baseline:
      required_cover: K('full_cover_requirement')
    evidence:
    - cross_category
    cross_difficulty: card
  - id: cover_reserve_level
    effect: parameter
    decides: cover_reserve
    bindings:
    - mm_balance
    - cover_reserve
    ladder:
    - when: the owner's premier money market balance reaches the protection source minimum and the owner has made at least
        six card payments in the last twelve months
      value: K('no_cover_reserve')
    - when: the case above does not apply and the owner's statement savings balance reaches the protection source minimum
        or the owner's certificate principal is above zero
      value: K('modest_cover_reserve')
    - when: otherwise
      value: K('full_cover_reserve')
    baseline:
      cover_reserve: K('full_cover_reserve')
    evidence:
    - cross_category
    cross_difficulty: savings
  - id: usable_cover_measure
    effect: method
    decides: mm_cover
    bindings:
    - cd_principal
    - mm_cover
    - stmt_cover
    ladder:
    - when: the owner's certificate principal is above zero and the owner has made at least six card payments in the last
        twelve months
      method: the whole of the account's balance less the cover reserve is taken
    - when: the case above does not apply and the certificate principal reaches the certificate relationship minimum or
        the premier money market balance reaches the protection source minimum
      method: half of the account's balance less the cover reserve is taken
    - when: otherwise
      method: the minimum cover share of the account's balance less the cover reserve is taken
    baseline:
      mm_cover: MX(0.0, RND(mm_balance * K('minimum_cover_share'), 2) - cover_reserve)
      stmt_cover: MX(0.0, RND(stmt_balance * K('minimum_cover_share'), 2) - cover_reserve)
    evidence:
    - cross_category
    cross_difficulty: cd
  - id: candidate_order
    effect: method
    decides: source_choice
    bindings:
    - stmt_balance
    - source_choice
    ladder:
    - when: the owner has made at least six card payments in the last twelve months and the owner's premier money market
        balance reaches the protection source minimum
      method: the premier money market account is tried first and the statement savings account second
    - when: the case above does not apply and the owner holds any statement savings balance or the owner's certificate principal
        is above zero
      method: whichever of the two carries the greater usable cover is tried first
    - when: otherwise
      method: the statement savings account is tried first and the premier money market account second
    baseline:
      source_choice: (stmt_id if stmt_cover >= required_cover else (mm_id if mm_cover >= required_cover else ''))
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: The protection source is the first of the owner's own savings accounts, tried in the order set below, whose usable
      cover reaches the cover a source must provide; where no savings account reaches it, no protection source is named.
      The cover a source must provide is the full cover requirement. The cover reserve is the full cover reserve. The usable
      cover of a savings account is the minimum cover share of its balance, less the cover reserve, and never below zero.
      The order candidates are tried in is the statement savings account first and the premier money market account second.
    params:
    - full_cover_requirement
    - full_cover_reserve
    - minimum_cover_share
  inputs:
    history:
    - category: card
      table: card_transactions
      aggregate: count
      field: amount
      within_months: 12
      filters:
        event_type: card_payment
    cross_category:
    - savings
    - card
    - cd
- id: checking_ext_overdraft_courtesy_relief
  base_policy_refs:
  - checking_evt_fee_refund
  - checking_evt_electronic_dispute
  overwrite:
  - base_policy: checking_evt_fee_refund
    superseded_clause: A fee is refunded in full, never in part
    replaced_by: The goodwill relief is the charges in the relief pool taken at the goodwill share and rounded half-up to
      the cent, held down to the shortfall standing on the account and to the episode ceiling, whichever of the three is
      smallest.
  trigger: on_request
  subject:
  - checking_fee_refund
  computes: relief_amount
  target_tool: post_overdraft_courtesy_relief_64b96dbf
  params:
    relief_window_long: 6
    relief_window_mid: 3
    relief_window_standard: 1
    deep_relief_share: 0.6
    standard_relief_share: 0.4
    modest_relief_share: 0.3
    wide_episode_ceiling: 400
    standard_episode_ceiling: 250
    tight_episode_ceiling: 80
    protection_source_minimum: 5000
    certificate_relationship_minimum: 25000
    half_share: 0.5
    whole_dollar_step: 5
  rule: 'Where a personal checking account has been correctly charged for items paid into overdraft, the bank may give part
    of that money back as a goodwill gesture, recorded against the most recently posted of the charges it covers. Goodwill
    relief on overdraft charges is granted only once the account''s record names an active savings account of the owner
    as the source the bank may draw on to cover items. The goodwill relief is worked out only after every temporary credit
    owed on a claim still being looked into stands posted to the account. The goodwill relief is settled only once the account
    stands on the tier its relationship balance supports. The goodwill relief is the charges in the relief pool taken at
    the goodwill share and rounded half-up to the cent, held down to the shortfall standing on the account and to the episode
    ceiling, whichever of the three is smallest. The relief window is the standard relief window. Where at least three overdraft
    charges stand on the account and the owner''s premier money market balance reaches the protection source minimum, the
    relief window is the long relief window instead; where the case above does not apply and at least two overdraft charges
    stand or the owner has made at least six card payments in the last twelve months, it is the middle relief window. The
    relief pool is the largest single overdraft charge standing on the account. Where the owner has made at least six card
    payments in the last twelve months and at least three overdraft charges stand, the relief pool is the overdraft charges,
    the returned-item charges and the long-overdraft charges posted inside the relief window added together instead; where
    the case above does not apply and the owner has made at least three card payments in the last twelve months or the owner''s
    premier money market balance reaches the protection source minimum, it is the overdraft charges posted inside the relief
    window alone. The goodwill share is the modest relief share. Where the tier allows at least three goodwill refunds in
    a rolling year and the owner''s premier money market balance reaches the protection source minimum, the goodwill share
    is the deep relief share instead; where the case above does not apply and at least three overdraft charges stand on
    the account or the owner has made at least six card payments in the last twelve months, it is the standard relief share.
    The money by which the account''s own entries leave it below zero is every debit posted to the account — paid items,
    charges and take-back entries — less every credit posted to it — deposits, refunds and goodwill entries, temporary credits,
    surcharge rebates and interest credits — rounded half-up to the cent and never taken below zero. The shortfall standing
    on the account is half of the money by which the account''s own entries leave it below zero. Where at least three overdraft
    charges stand on the account and the owner has made at least six card payments in the last twelve months, the shortfall
    standing is the whole of that money instead; where the case above does not apply and at least two overdraft charges
    stand or the owner''s premier money market balance reaches the protection source minimum, it is that money together
    with the charges in the relief pool. The episode ceiling is the tight episode ceiling. Where the owner''s certificate
    principal is above zero and the owner has made at least six card payments in the last twelve months, the episode ceiling
    is the wide episode ceiling instead; where the case above does not apply and the certificate principal reaches the certificate
    relationship minimum or the premier money market balance reaches the protection source minimum, it is the standard episode
    ceiling. The goodwill relief is taken in whole five-dollar steps, rounded half-up. Where a goodwill or corrective entry
    has been granted to the account in the last twelve months and at least three overdraft charges stand, the goodwill relief
    is taken to the cent instead; where the case above does not apply and at least three such entries have been granted
    in the last twelve months or the owner has made at least fifteen card payments in the last twelve months, it is taken
    in whole dollars, rounded half-up. An account whose entries leave it at or above zero is outside this rule and no goodwill
    relief is granted.

    '
  prerequisite:
  - problem: checking_ext_overdraft_protection_source
    kind: state_gate
    gate: checking_accounts.overdraft_link_savings_account_id
    form: state
    policy_source: Goodwill relief on overdraft charges is granted only once the account's record names an active savings
      account of the owner as the source the bank may draw on to cover items.
    condition: The checking account record carries an active savings account of the same owner in its overdraft protection
      source field.
    resolved_by: authorize_overdraft_protection_source_1d4e232c
    effect: The overdraft protection source field of the checking account stops being empty and carries an active savings
      account of the owner, so the eligibility this policy places on its own result holds.
  - problem: checking_ext_dispute_provisional_credit
    kind: value_input
    gate: claim_credits_posted
    form: state
    policy_source: The goodwill relief is worked out only after every temporary credit owed on a claim still being looked
      into stands posted to the account.
    condition: The account's posted activity carries a temporary credit entry for every claim that is still being looked
      into and whose credit has fallen due.
    resolved_by: post_dispute_provisional_credit_b16208c2
    effect: The claim credits posted binding rises from zero to the credited amount, so the shortfall standing on the account
      falls by that amount and the relief is held down to the smaller figure.
  - problem: checking_ext_relationship_tier_conversion
    kind: value_input
    gate: relief_share
    form: state
    policy_source: The goodwill relief is settled only once the account stands on the tier its relationship balance supports.
    condition: The tier written on the checking account is the one the owner's relationship balance reaches, rather than
      a lower one.
    resolved_by: convert_account_tier_569988a7
    effect: The goodwill share binding moves to the deep relief share once the tier in force allows at least three goodwill
      refunds in a rolling year, where a lower tier would leave it at the standard relief share.
  cross_category:
  - category: savings
    as: branch
    reads:
    - current_balance
    note: The premier money market balance decides which tier of the goodwill share applies.
  - category: card
    as: history
    reads:
    - card_transactions.event_type
    note: The count of card payments in the last twelve months decides which tier of the relief pool applies.
  - category: cd
    as: branch
    reads:
    - principal_balance
    note: The certificate principal decides which tier of the episode ceiling applies.
  compute:
  - mm_balance: CFIELD('savings','current_balance', variant_name='Premier Money Market', status='active')
  - card_payments_12m: XCOUNT('card','card_transactions', within_months=12, date_field='posted_date', event_type='card_payment')
  - od_count: COUNT('checking_transactions', event_type='checking_fee', fee_code='overdraft_item')
  - relief_window: K('relief_window_long') if (od_count >= 3 and mm_balance >= K('protection_source_minimum')) else (K('relief_window_mid')
      if (od_count >= 2 or card_payments_12m >= 6) else K('relief_window_standard'))
  - od_windowed: SUM('checking_transactions','amount', within_months=relief_window, date_field='posted_date', event_type='checking_fee',
      fee_code='overdraft_item')
  - ri_windowed: SUM('checking_transactions','amount', within_months=relief_window, date_field='posted_date', event_type='checking_fee',
      fee_code='returned_item')
  - ext_windowed: SUM('checking_transactions','amount', within_months=relief_window, date_field='posted_date', event_type='checking_fee',
      fee_code='extended_overdraft')
  - od_largest: MAX('checking_transactions','amount', event_type='checking_fee', fee_code='overdraft_item')
  - relief_pool: (od_windowed + ri_windowed + ext_windowed) if (card_payments_12m >= 6 and od_count >= 3) else (od_windowed
      if (card_payments_12m >= 3 or mm_balance >= K('protection_source_minimum')) else od_largest)
  - relief_share: K('deep_relief_share') if (P('courtesy_refund_limit_365d') >= 3 and mm_balance >= K('protection_source_minimum'))
      else (K('standard_relief_share') if (od_count >= 3 or card_payments_12m >= 6) else K('modest_relief_share'))
  - gross_relief: RND(relief_pool * relief_share, 2)
  - claim_credits_posted: SUM('checking_transactions','amount', event_type='checking_provisional_credit')
  - deposits_in: SUM('checking_transactions','amount', event_type='checking_deposit')
  - refunds_in: SUM('checking_transactions','amount', event_type='checking_fee_refund')
  - interest_in: SUM('checking_transactions','amount', event_type='checking_interest_credit')
  - rebates_in: SUM('checking_transactions','amount', event_type='checking_atm_rebate')
  - debits_out: SUM('checking_transactions','amount', event_type='checking_debit')
  - fees_out: SUM('checking_transactions','amount', event_type='checking_fee')
  - takebacks_out: SUM('checking_transactions','amount', event_type='checking_provisional_reversal')
  - posted_shortfall: MX(0.0, RND(debits_out + fees_out + takebacks_out - deposits_in - refunds_in - interest_in - rebates_in
      - claim_credits_posted, 2))
  - shortfall_standing: posted_shortfall if (od_count >= 3 and card_payments_12m >= 6) else ((posted_shortfall + relief_pool)
      if (od_count >= 2 or mm_balance >= K('protection_source_minimum')) else RND(posted_shortfall * K('half_share'), 2))
  - cd_principal: CFIELD('cd','principal_balance', status='active')
  - episode_ceiling: K('wide_episode_ceiling') if (cd_principal > 0 and card_payments_12m >= 6) else (K('standard_episode_ceiling')
      if (cd_principal >= K('certificate_relationship_minimum') or mm_balance >= K('protection_source_minimum')) else K('tight_episode_ceiling'))
  - capped_relief: MN(gross_relief, shortfall_standing, episode_ceiling)
  - courtesy_prior_12m: COUNT('checking_transactions', within_months=12, date_field='posted_date', event_type='checking_fee_refund')
  - relief_entry: RND(capped_relief, 2) if (courtesy_prior_12m >= 1 and od_count >= 3) else (RND(capped_relief, 0) if (courtesy_prior_12m
      >= 3 or card_payments_12m >= 15) else RND(capped_relief / K('whole_dollar_step'), 0) * K('whole_dollar_step'))
  - result: relief_entry
  compute_basis:
    mm_balance: Where the tier allows at least three goodwill refunds in a rolling year and the owner's premier money market
      balance reaches the protection source minimum, the goodwill share is the deep relief share instead; where the case
      above does not apply and at least three overdraft charges stand on the account or the owner has made at least six
      card payments in the last twelve months, it is the standard relief share.
    card_payments_12m: Where the owner has made at least six card payments in the last twelve months and at least three
      overdraft charges stand, the relief pool is the overdraft charges, the returned-item charges and the long-overdraft
      charges posted inside the relief window added together instead
    od_count: Where at least three overdraft charges stand on the account and the owner's premier money market balance reaches
      the protection source minimum, the relief window is the long relief window instead; where the case above does not
      apply and at least two overdraft charges stand or the owner has made at least six card payments in the last twelve
      months, it is the middle relief window.
    relief_window: The relief window is the standard relief window. Where at least three overdraft charges stand on the
      account and the owner's premier money market balance reaches the protection source minimum, the relief window is the
      long relief window instead; where the case above does not apply and at least two overdraft charges stand or the owner
      has made at least six card payments in the last twelve months, it is the middle relief window.
    od_windowed: where the case above does not apply and the owner has made at least three card payments in the last twelve
      months or the owner's premier money market balance reaches the protection source minimum, it is the overdraft charges
      posted inside the relief window alone
    ri_windowed: Where the owner has made at least six card payments in the last twelve months and at least three overdraft
      charges stand, the relief pool is the overdraft charges, the returned-item charges and the long-overdraft charges
      posted inside the relief window added together instead
    ext_windowed: Where the owner has made at least six card payments in the last twelve months and at least three overdraft
      charges stand, the relief pool is the overdraft charges, the returned-item charges and the long-overdraft charges
      posted inside the relief window added together instead
    od_largest: The relief pool is the largest single overdraft charge standing on the account.
    relief_pool: The relief pool is the largest single overdraft charge standing on the account. Where the owner has made
      at least six card payments in the last twelve months and at least three overdraft charges stand, the relief pool is
      the overdraft charges, the returned-item charges and the long-overdraft charges posted inside the relief window added
      together instead; where the case above does not apply and the owner has made at least three card payments in the last
      twelve months or the owner's premier money market balance reaches the protection source minimum, it is the overdraft
      charges posted inside the relief window alone.
    relief_share: The goodwill share is the modest relief share. Where the tier allows at least three goodwill refunds in
      a rolling year and the owner's premier money market balance reaches the protection source minimum, the goodwill share
      is the deep relief share instead; where the case above does not apply and at least three overdraft charges stand on
      the account or the owner has made at least six card payments in the last twelve months, it is the standard relief
      share.
    gross_relief: The goodwill relief is the charges in the relief pool taken at the goodwill share and rounded half-up
      to the cent, held down to the shortfall standing on the account and to the episode ceiling, whichever of the three
      is smallest.
    claim_credits_posted: The goodwill relief is worked out only after every temporary credit owed on a claim still being
      looked into stands posted to the account.
    deposits_in: The money by which the account's own entries leave it below zero is every debit posted to the account —
      paid items, charges and take-back entries — less every credit posted to it — deposits, refunds and goodwill entries,
      temporary credits, surcharge rebates and interest credits — rounded half-up to the cent and never taken below zero.
    refunds_in: The money by which the account's own entries leave it below zero is every debit posted to the account —
      paid items, charges and take-back entries — less every credit posted to it — deposits, refunds and goodwill entries,
      temporary credits, surcharge rebates and interest credits — rounded half-up to the cent and never taken below zero.
    interest_in: The money by which the account's own entries leave it below zero is every debit posted to the account —
      paid items, charges and take-back entries — less every credit posted to it — deposits, refunds and goodwill entries,
      temporary credits, surcharge rebates and interest credits — rounded half-up to the cent and never taken below zero.
    rebates_in: The money by which the account's own entries leave it below zero is every debit posted to the account —
      paid items, charges and take-back entries — less every credit posted to it — deposits, refunds and goodwill entries,
      temporary credits, surcharge rebates and interest credits — rounded half-up to the cent and never taken below zero.
    debits_out: The money by which the account's own entries leave it below zero is every debit posted to the account —
      paid items, charges and take-back entries — less every credit posted to it — deposits, refunds and goodwill entries,
      temporary credits, surcharge rebates and interest credits — rounded half-up to the cent and never taken below zero.
    fees_out: The money by which the account's own entries leave it below zero is every debit posted to the account — paid
      items, charges and take-back entries — less every credit posted to it — deposits, refunds and goodwill entries, temporary
      credits, surcharge rebates and interest credits — rounded half-up to the cent and never taken below zero.
    takebacks_out: The money by which the account's own entries leave it below zero is every debit posted to the account
      — paid items, charges and take-back entries — less every credit posted to it — deposits, refunds and goodwill entries,
      temporary credits, surcharge rebates and interest credits — rounded half-up to the cent and never taken below zero.
    posted_shortfall: The money by which the account's own entries leave it below zero is every debit posted to the account
      — paid items, charges and take-back entries — less every credit posted to it — deposits, refunds and goodwill entries,
      temporary credits, surcharge rebates and interest credits — rounded half-up to the cent and never taken below zero.
    shortfall_standing: The shortfall standing on the account is half of the money by which the account's own entries leave
      it below zero. Where at least three overdraft charges stand on the account and the owner has made at least six card
      payments in the last twelve months, the shortfall standing is the whole of that money instead; where the case above
      does not apply and at least two overdraft charges stand or the owner's premier money market balance reaches the protection
      source minimum, it is that money together with the charges in the relief pool.
    cd_principal: Where the owner's certificate principal is above zero and the owner has made at least six card payments
      in the last twelve months, the episode ceiling is the wide episode ceiling instead; where the case above does not
      apply and the certificate principal reaches the certificate relationship minimum or the premier money market balance
      reaches the protection source minimum, it is the standard episode ceiling.
    episode_ceiling: The episode ceiling is the tight episode ceiling. Where the owner's certificate principal is above
      zero and the owner has made at least six card payments in the last twelve months, the episode ceiling is the wide
      episode ceiling instead; where the case above does not apply and the certificate principal reaches the certificate
      relationship minimum or the premier money market balance reaches the protection source minimum, it is the standard
      episode ceiling.
    capped_relief: The goodwill relief is the charges in the relief pool taken at the goodwill share and rounded half-up
      to the cent, held down to the shortfall standing on the account and to the episode ceiling, whichever of the three
      is smallest.
    courtesy_prior_12m: Where a goodwill or corrective entry has been granted to the account in the last twelve months and
      at least three overdraft charges stand, the goodwill relief is taken to the cent instead
    relief_entry: The goodwill relief is taken in whole five-dollar steps, rounded half-up. Where a goodwill or corrective
      entry has been granted to the account in the last twelve months and at least three overdraft charges stand, the goodwill
      relief is taken to the cent instead; where the case above does not apply and at least three such entries have been
      granted in the last twelve months or the owner has made at least fifteen card payments in the last twelve months,
      it is taken in whole dollars, rounded half-up.
  factors:
  - id: goodwill_share_level
    effect: parameter
    decides: relief_share
    bindings:
    - mm_balance
    - relief_share
    ladder:
    - when: the tier allows at least three goodwill refunds in a rolling year and the owner's premier money market balance
        reaches the protection source minimum
      value: K('deep_relief_share')
    - when: the case above does not apply and at least three overdraft charges stand on the account or the owner has made
        at least six card payments in the last twelve months
      value: K('standard_relief_share')
    - when: otherwise
      value: K('modest_relief_share')
    baseline:
      relief_share: K('modest_relief_share')
    evidence:
    - cross_category
    - history
    cross_difficulty: savings
  - id: relief_pool_basis
    effect: method
    decides: relief_pool
    bindings:
    - card_payments_12m
    - ri_windowed
    - ext_windowed
    - od_largest
    - relief_pool
    ladder:
    - when: the owner has made at least six card payments in the last twelve months and at least three overdraft charges
        stand
      method: the overdraft charges, the returned-item charges and the long-overdraft charges posted inside the relief window
        are added together
    - when: the case above does not apply and the owner has made at least three card payments in the last twelve months
        or the owner's premier money market balance reaches the protection source minimum
      method: the overdraft charges posted inside the relief window alone are added together
    - when: otherwise
      method: the largest single overdraft charge standing on the account is taken
    baseline:
      relief_pool: od_largest
    evidence:
    - history
    - cross_category
    cross_difficulty: card
  - id: shortfall_measure
    effect: method
    decides: shortfall_standing
    bindings:
    - takebacks_out
    - posted_shortfall
    - shortfall_standing
    ladder:
    - when: at least three overdraft charges stand on the account and the owner has made at least six card payments in the
        last twelve months
      method: the whole of the money by which the account's entries leave it below zero is taken
    - when: the case above does not apply and at least two overdraft charges stand or the owner's premier money market balance
        reaches the protection source minimum
      method: that money together with the charges in the relief pool is taken
    - when: otherwise
      method: half of that money is taken
    baseline:
      shortfall_standing: RND(posted_shortfall * K('half_share'), 2)
    evidence:
    - history
    cross_difficulty: null
  - id: episode_ceiling_level
    effect: parameter
    decides: episode_ceiling
    bindings:
    - cd_principal
    - episode_ceiling
    ladder:
    - when: the owner's certificate principal is above zero and the owner has made at least six card payments in the last
        twelve months
      value: K('wide_episode_ceiling')
    - when: the case above does not apply and the certificate principal reaches the certificate relationship minimum or
        the premier money market balance reaches the protection source minimum
      value: K('standard_episode_ceiling')
    - when: otherwise
      value: K('tight_episode_ceiling')
    baseline:
      episode_ceiling: K('tight_episode_ceiling')
    evidence:
    - cross_category
    cross_difficulty: cd
  - id: relief_entry_rounding
    effect: method
    decides: relief_entry
    bindings:
    - courtesy_prior_12m
    - relief_entry
    ladder:
    - when: a goodwill or corrective entry has been granted to the account in the last twelve months and at least three
        overdraft charges stand
      method: the goodwill relief is taken to the cent
    - when: the case above does not apply and at least three such entries have been granted in the last twelve months or
        the owner has made at least fifteen card payments in the last twelve months
      method: the goodwill relief is taken in whole dollars, rounded half-up
    - when: otherwise
      method: the goodwill relief is taken in whole five-dollar steps, rounded half-up
    baseline:
      relief_entry: RND(capped_relief / K('whole_dollar_step'), 0) * K('whole_dollar_step')
    evidence:
    - history
    cross_difficulty: null
  - id: relief_window_length
    effect: parameter
    decides: relief_window
    bindings:
    - od_count
    - relief_window
    - od_windowed
    ladder:
    - when: at least three overdraft charges stand on the account and the owner's premier money market balance reaches the
        protection source minimum
      value: K('relief_window_long')
    - when: the case above does not apply and at least two overdraft charges stand or the owner has made at least six card
        payments in the last twelve months
      value: K('relief_window_mid')
    - when: otherwise
      value: K('relief_window_standard')
    baseline:
      relief_window: K('relief_window_standard')
    evidence:
    - history
    - cross_category
    cross_difficulty: null
  baseline:
    rule: The goodwill relief is the charges in the relief pool taken at the goodwill share and rounded half-up to the cent,
      held down to the shortfall standing on the account and to the episode ceiling, whichever of the three is smallest.
      The relief window is the standard relief window. The relief pool is the largest single overdraft charge standing on
      the account. The goodwill share is the modest relief share. The money by which the account's own entries leave it
      below zero is every debit posted to the account — paid items, charges and take-back entries — less every credit posted
      to it — deposits, refunds and goodwill entries, temporary credits, surcharge rebates and interest credits — rounded
      half-up to the cent and never taken below zero. The shortfall standing on the account is half of the money by which
      the account's own entries leave it below zero. The episode ceiling is the tight episode ceiling. The goodwill relief
      is taken in whole five-dollar steps, rounded half-up.
    params:
    - relief_window_standard
    - modest_relief_share
    - tight_episode_ceiling
    - half_share
    - whole_dollar_step
  inputs:
    history:
    - table: checking_transactions
      aggregate: sum
      field: amount
      within_months: 6
      filters:
        event_type: checking_fee
        fee_code: overdraft_item
    - table: checking_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: checking_provisional_credit
    - category: card
      table: card_transactions
      aggregate: count
      field: amount
      within_months: 12
      filters:
        event_type: card_payment
    cross_category:
    - savings
    - card
    - cd
