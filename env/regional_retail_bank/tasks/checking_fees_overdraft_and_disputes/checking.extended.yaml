    - when: the case above does not apply and the owner has made at least four card payments in the last twelve months or
        the owner's premier money market balance reaches the protection source minimum
      value: P('overdraft_fee_per_item') - K('relationship_reduction')
    - when: otherwise
      value: P('overdraft_fee_per_item')
    baseline:
      per_item_charge: P('overdraft_fee_per_item')
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: charges_under_review_basis
    effect: method
    decides: charges_under_review
    bindings:
    - assessed_all
    - assessed_largest
    - charges_under_review
    ladder:
    - when: the owner's premier money market balance reaches the tier's relationship maintenance threshold and at least
        four overdraft charges stand on the account
      method: only the overdraft charges posted inside the review window are summed
    - when: the case above does not apply and at least two overdraft charges stand on the account or the owner has made
        at least twenty card payments in the last twelve months
      method: only the largest single overdraft charge is taken
    - when: otherwise
