- id: checking_ext_closure_payout
  base_policy_refs:
  - checking_evt_closure
  - checking_evt_interest
  overwrite:
  - base_policy: checking_evt_closure
    superseded_clause: The agent registers a checking_closure_requests row in pending_customer_confirmation status naming
      the disbursement method, and the account closes only after the owner confirms it.
    replaced_by: The owner's own confirmation records the closing instruction and closes the account in one step.
  - base_policy: checking_evt_closure
    superseded_clause: When the closure date falls within the early closure window, the tier's early_closure_fee is assessed
      as a checking_fee row with fee_code early_closure before the balance is disbursed.
    replaced_by: The closing charge owed for an account closed inside its opening window is taken out of the money paid
      out rather than booked as a separate entry on the account.
  - base_policy: checking_evt_closure
    superseded_clause: For an interest-bearing tier, interest earned through the day before closure is credited before disbursement.
    replaced_by: The closing interest is added to the money paid out rather than credited as a separate entry.
  - base_policy: checking_evt_closure
    superseded_clause: The remaining ledger balance is then disbursed in full by internal transfer to the destination PCB
      account or by official check mailed to the address on file, without a cashier's check fee, and the account closes
      with a zero balance and no overdraft link.
    replaced_by: The closing payout is the money reconciled from the account's own entries, less the closing charge and
      together with the closing interest.
  - base_policy: checking_evt_interest
    superseded_clause: Interest accrues daily on each calendar day's end-of-day ledger balance when that balance is above
      zero, taken from the daily series checking_msr_cycle_end_of_day_balances; a day with a zero or negative balance earns
      nothing.
    replaced_by: It is the money reconciled from the account's own entries multiplied by the closing rate as an annual percentage,
      multiplied by the closing days and divided by three hundred and sixty-five, rounded half-up to the cent; the closing
      days are the days the account has been open, capped at one full statement cycle.
  - base_policy: checking_evt_interest
    superseded_clause: Each day's balance earns the APY of the highest band floor in the tier's interest_apy_ladder that
      the balance reaches, applied to the whole balance, divided by interest_day_count_basis.
    replaced_by: Where the owner has made at least ten card payments in the last twelve months and the owner's premier money
      market balance reaches the tier's relationship maintenance threshold, the closing rate is the premier relationship
      rate; where the case above does not apply and the owner has made at least four card payments in the last twelve months
      or the owner holds any certificate principal, the closing rate is the standard relationship rate.
  - base_policy: checking_evt_interest
    superseded_clause: Daily amounts are summed unrounded over the statement cycle and the total is rounded half-up to the
      cent and credited on the cycle closing date as one checking_interest_credit row.
    replaced_by: The closing interest is added to the money paid out rather than credited as a separate entry.
  trigger: on_request
  subject:
  - checking_close
  computes: payout_amount
  target_tool: confirm_closure_payout_0546356c
  params:
    settled_account_days: 60
    cycle_days: 30
    protection_source_minimum: 5000
    certificate_relationship_minimum: 25000
    relationship_charge_relief: 6.5
    modest_charge_relief: 3.0
    premier_relationship_rate: 0.15
    standard_relationship_rate: 0.05
    base_account_rate: 0.02
    whole_dollar_step: 5
  rule: 'When the owner of a personal checking account confirms that it is to be closed, the money left in it is paid out
    in one movement and the account closes with nothing in it. The owner''s own confirmation records the closing instruction
    and closes the account in one step. The closing payout is the money reconciled from the account''s own entries, less
    the closing charge and together with the closing interest. The money reconciled from the account''s own entries is every
    credit posted to it — deposits, refunds and goodwill entries, temporary credits, surcharge rebates and interest credits
    — less every debit posted to it, that is paid items, charges and take-back entries. The closing payout is worked out
    only once every temporary credit standing on the account for a claim decided in the bank''s own favour has been taken
    back on the ledger. The closing charge owed for an account closed inside its opening window is taken out of the money
    paid out rather than booked as a separate entry on the account. An account closed later than its opening window owes
    no closing charge at all, and the closing payout is then the money reconciled from the account''s own entries together
    with the closing interest alone; the opening window runs for the tier''s early closure window in calendar days counted
    with the day after the account was opened as day one, and an account closed on the last of those days is still inside
    it. The closing charge is set at the tier''s early closure charge. Where the owner''s premier money market balance reaches
    the tier''s relationship maintenance threshold and the account has been open at least as long as the settled account
    period, the closing charge is set at the tier''s early closure charge less the relationship charge relief; where the
    case above does not apply and the owner''s premier money market balance reaches the protection source minimum or the
    owner has made at least eight card payments in the last twelve months, the closing charge is set at the tier''s early
    closure charge less the modest charge relief. The closing charge is then taken at the level it was set, in full. Where
    the owner''s certificate principal reaches the certificate relationship minimum and the account has been open at least
    as long as the settled account period, the closing charge is instead spread evenly over the whole months the account
    has been open, a month counting only once the day of the month the account was opened has come round again and the count
    never falling below one, and the result rounded half-up to the cent; where the case above does not apply and the owner
    holds any certificate principal or the owner has made at least fifteen card payments in the last twelve months, the
    closing charge is taken at half the level it was set, rounded half-up to the cent. The closing interest is added to
    the money paid out rather than credited as a separate entry. It is the money reconciled from the account''s own entries
    multiplied by the closing rate as an annual percentage, multiplied by the closing days and divided by three hundred
    and sixty-five, rounded half-up to the cent; the closing days are the days the account has been open, capped at one
    full statement cycle. The closing rate is the base account rate. Where the owner has made at least ten card payments
    in the last twelve months and the owner''s premier money market balance reaches the tier''s relationship maintenance
    threshold, the closing rate is the premier relationship rate; where the case above does not apply and the owner has
    made at least four card payments in the last twelve months or the owner holds any certificate principal, the closing
    rate is the standard relationship rate. The closing payout is taken in whole five-dollar steps, rounded half-up. Where
    a goodwill or corrective entry has been granted to the account in the last twelve months and the account has been open
    at least as long as the settled account period, the closing payout is taken to the cent instead; where the case above
    does not apply and at least three such entries have been granted in the last twelve months or the owner has made at
    least fifteen card payments in the last twelve months, the closing payout is taken in whole dollars, rounded half-up.
    An account whose reconciled money is below zero is outside this rule and is not closed until the shortfall is repaid.

