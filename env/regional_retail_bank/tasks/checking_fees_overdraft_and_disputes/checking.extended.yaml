# Policy charter: Personal Checking. Piedmont Crescent Bank, N.A.
# Single registry of every checking number; the runtime never reads this file.

category: checking
display_name: Personal Checking

binding:
  holding_table: checking_accounts
  event_tables: [checking_transactions, checking_service_orders]
  intake_tables: [checking_disputes, checking_closure_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {ledger_balance: checking_balance}

lifecycle:
  states: [applied, active, dormant, restricted, charged_off, closed]
  transitions:
    - {from: applied, to: active, by: system, means: "The opening deposit posted and the account became usable for transactions."}
    - {from: applied, to: closed, by: system, means: "The account was never funded within the funding window and was closed as unfunded."}
    - {from: active, to: dormant, by: system, means: "No customer-initiated activity occurred for the dormancy period, so the account was classified dormant."}
    - {from: dormant, to: active, by: agent, means: "An identity-verified owner made contact and a customer-initiated transaction reactivated the account."}
    - {from: active, to: restricted, by: system, means: "The ledger balance stayed negative for the restriction period, so new debits are no longer paid."}
    - {from: restricted, to: active, by: system, means: "Deposits brought the ledger balance back to zero or above, lifting the restriction."}
    - {from: restricted, to: charged_off, by: system, means: "The ledger balance stayed negative for the charge-off period and the deficit was written off to recovery."}
    - {from: active, to: closed, by: user, means: "The owner confirmed a closure request and the account was closed."}
    - {from: dormant, to: closed, by: user, means: "The owner of a dormant account confirmed a closure request and the account was closed."}
    - {from: charged_off, to: closed, by: system, means: "The charged-off account was administratively closed after the write-off posted."}

accounts:
  - key: checking_balance
    unit: USD
    meaning: "The posted ledger balance of one checking account; credits raise it and debits lower it, and it may be negative while overdrawn."

parameter_schema:
  minimum_opening_deposit: "Smallest first deposit that funds and activates a new account of this tier; USD."
  entry_relationship_balance_min: "Relationship balance the customer must already hold on the opening date to open this tier; USD (0.00 means no relationship requirement)."
  age_min_to_open: "Youngest age, in whole years on the opening date, at which the customer may open this tier as sole owner; integer years."
  age_max_to_open: "Oldest age, in whole years on the opening date, at which the customer may open this tier; integer years, or 'no_maximum'."
  max_accounts_per_customer_this_tier: "Most open accounts of this particular tier one customer may hold as primary owner; integer count."
  automatic_conversion_age: "Age in whole years at which an account of this tier is converted automatically at the next statement cycle close; integer years, or 'not_applicable'."
  automatic_conversion_target: "Official tier name the account converts into at automatic_conversion_age; tier name, or 'not_applicable'."
  monthly_maintenance_fee: "Fee assessed once per statement cycle at cycle close unless a waiver is met; USD."
  waiver_min_daily_balance: "Lowest end-of-day ledger balance during the cycle at or above which the maintenance fee is waived; USD, or 'not_offered'."
  waiver_direct_deposit_total: "Total of ACH direct deposits posted in the cycle at or above which the maintenance fee is waived; USD, or 'not_offered'."
  waiver_relationship_balance: "Relationship balance at cycle close at or above which the maintenance fee is waived; USD, or 'not_offered'."
  waiver_debit_purchase_count: "Number of posted debit card purchases in the cycle at or above which the maintenance fee is waived; integer, or 'not_offered'."
  waiver_age_under: "The maintenance fee is waived while the primary owner is younger than this age at cycle close; integer years, or 'not_offered'."
  waiver_age_at_least: "The maintenance fee is waived when the primary owner is at least this age at cycle close; integer years, or 'not_offered'."
  waiver_military_active_duty: "Whether an active-duty military status on the customer profile waives the maintenance fee; boolean."
  waiver_employee: "Whether an active PCB employee status on the customer profile waives the maintenance fee; boolean."
  relationship_balance_includes_mortgage: "Whether outstanding PCB mortgage principal counts toward this tier's relationship balance; boolean."
  paper_statement_fee: "Fee per statement cycle when statement delivery is paper at cycle close; USD."
  paper_statement_fee_exempt_age: "Primary owners at least this age at cycle close are exempt from the paper statement fee; integer years."
  overdraft_coverage_available: "Whether the tier offers discretionary overdraft coverage at all (false means items that would overdraw are declined or returned); boolean."
  overdraft_coverage_limit: "Largest negative ledger balance the bank will create by paying items under discretionary coverage; USD."
  overdraft_fee_per_item: "Fee for each item the bank pays into overdraft; USD."
  overdraft_item_de_minimis: "Items of this amount or less never incur an overdraft fee; USD."
  overdraft_end_of_day_de_minimis: "No overdraft or returned-item fee is charged for a business day on which the end-of-day ledger balance is negative by this amount or less; USD."
  overdraft_daily_item_limit: "Most overdraft-item plus returned-item fees combined that one account can incur on one business day; integer count."
  returned_item_fee: "Fee for each check or ACH debit returned unpaid for insufficient funds; USD."
  extended_overdraft_fee: "One-time fee per negative episode once the balance has stayed negative for the trigger period; USD."
  extended_overdraft_trigger_days: "Consecutive calendar days of negative ledger balance after which the extended overdraft fee applies; integer calendar days."
  overdraft_transfer_fee: "Fee per overdraft protection transfer from a linked savings account; USD."
  overdraft_transfer_fee_daily_max: "Most overdraft protection transfer fees charged to one account on one business day; integer count."
  courtesy_refund_limit_365d: "Most courtesy fee refunds one customer may receive across all of their checking accounts in any rolling 365-day window; integer count of refunded fees."
  courtesy_refund_window_days: "A fee is eligible for a courtesy refund only while no more than this many calendar days have passed since it posted; integer calendar days."
  negative_balance_restrict_days: "Consecutive calendar days of negative ledger balance after which the account is restricted; integer calendar days."
  negative_balance_chargeoff_days: "Consecutive calendar days of negative ledger balance after which the deficit is charged off; integer calendar days."
  interest_bearing: "Whether the tier pays interest; boolean."
  interest_apy_ladder: "Tiered annual percentage yield by end-of-day balance band; mapping of band floor in USD to APY percent, where the whole day's balance earns the rate of the highest floor it reaches."
  out_of_network_atm_fee: "PCB fee per withdrawal or balance inquiry at a non-PCB ATM inside the United States; USD."
  atm_surcharge_rebates_per_cycle: "Number of non-PCB ATM operator surcharges rebated per statement cycle; integer, or 'unlimited'."
  atm_surcharge_rebate_cap_per_cycle: "Total USD of operator surcharges rebated per statement cycle; USD, or 'no_cap'."
  international_atm_fee: "PCB fee per withdrawal at an ATM outside the United States, charged instead of the domestic out-of-network fee; USD."
  foreign_transaction_fee_pct: "Percent of the U.S. dollar amount charged on each debit card purchase or ATM withdrawal made outside the United States or in a foreign currency; percent."
  domestic_wire_out_fee: "Fee per outgoing domestic wire transfer; USD."
  international_wire_out_fee: "Fee per outgoing international wire transfer; USD."
  incoming_wire_fee: "Fee per incoming wire transfer credited to the account; USD."
  stop_payment_fee: "Fee per stop payment order or stop payment renewal beyond the free allowance; USD."
  free_stop_orders_per_cycle: "Stop payment orders and renewals placed free of charge per statement cycle; integer count."
  cashiers_check_fee: "Fee per official (cashier's) check purchased from the account; USD."
  card_replacement_standard_fee: "Fee for a standard-delivery replacement debit card when the reason is lost or damaged; USD."
  card_replacement_rush_fee: "Additional fee for rush (two-business-day) delivery of a replacement debit card; USD."
  account_research_fee_per_hour: "Fee per hour, one-hour minimum, for account research or reconciliation requested by the customer; USD."
  early_closure_fee: "Fee when the owner closes the account within the early closure window after opening; USD."
  early_closure_window_days: "Calendar days after the opening date during which a customer closure incurs the early closure fee; integer calendar days."
  dormancy_inactivity_months: "Calendar months without customer-initiated activity after which the account becomes dormant; integer months."
  dormant_account_fee: "Fee per statement cycle while the account is dormant, never taking the balance below zero; USD."
  mobile_deposit_daily_limit: "Most check value that can be deposited through mobile deposit per calendar day; USD."
  mobile_deposit_30day_limit: "Most check value that can be deposited through mobile deposit in any rolling 30 calendar days; USD."
  new_account_check_hold_business_days: "For accounts open fewer than new_account_period_days, the business day after deposit on which a deposited check posts and becomes available; integer business days."
  new_account_period_days: "Calendar days after the opening date during which new-account treatment applies to holds and disputes; integer calendar days."
  atm_daily_withdrawal_limit: "Most cash that can be withdrawn at ATMs per calendar day; USD."
  debit_card_daily_purchase_limit: "Most debit card purchase value authorized per calendar day; USD."
  zelle_daily_send_limit: "Most Zelle payments that can be sent per calendar day; USD."
  zelle_30day_send_limit: "Most Zelle payments that can be sent in any rolling 30 calendar days; USD."
  check_writing_available: "Whether paper checks can be written on the account (false means a checkless account); boolean."
  provisional_credit_business_days: "Business days after the notice date by which a provisional credit is owed on an open electronic-transaction dispute; integer business days."
  new_account_provisional_credit_business_days: "Provisional credit deadline used instead when the account was opened fewer than new_account_period_days before the notice date; integer business days."
  dispute_notice_window_days: "Calendar days after the disputed item's posted date within which a notice qualifies for the electronic dispute process; integer calendar days."

