events:
  # ---------------- holding writes (checking_accounts) ----------------
  - type: checking_open
    target: checking_accounts
    mutation: create
    meaning: "A new personal checking account is opened for a customer in one tier and awaits its opening deposit."
    grain: "One row per checking account opened."
    fields:
      customer_id: "The primary owner."
      variant_name: "The official tier name chosen at opening."
      status: "Always applied at creation."
      account_number_last4: "Last four digits of the account number assigned at opening."
      opened_date: "Date the account was opened."
      debit_overdraft_election: "Always opted_out at creation; an opt-in requires a separate customer election."
      statement_cycle_day: "Day of month on which the statement cycle closes."
      statement_delivery: "Statement delivery method chosen at opening."
      ledger_balance: "Always 0.00 at creation."
    triggers: []
  - type: checking_activate
    target: checking_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: "The opening deposit posted and the account became active."
    grain: "One row per account activation."
    fields:
      status: "Set to active."
      last_customer_activity_date: "Set to the posted date of the opening deposit."
    triggers: []
  - type: checking_lapse_unfunded
    target: checking_accounts
    mutation: {transition: {from: applied, to: closed}}
    meaning: "An account that never received its opening deposit within the funding window is closed."
    grain: "One row per unfunded account closed."
    fields:
      status: "Set to closed."
      closed_date: "Date the unfunded account was closed."
    triggers: []
  - type: checking_go_dormant
    target: checking_accounts
    mutation: {transition: {from: active, to: dormant}}
    meaning: "The account is classified dormant after the inactivity period."
    grain: "One row per dormancy classification."
    fields:
      status: "Set to dormant."
    triggers: []
  - type: checking_reactivate
    target: checking_accounts
    mutation: {transition: {from: dormant, to: active}}
    meaning: "A dormant account is returned to active status after verified owner contact and a customer-initiated transaction."
    grain: "One row per reactivation."
    fields:
      status: "Set to active."
      last_customer_activity_date: "Set to the date of the reactivating customer-initiated transaction."
    triggers: []
  - type: checking_restrict
    target: checking_accounts
    mutation: {transition: {from: active, to: restricted}}
    meaning: "A persistently overdrawn account is restricted so that no further debits are paid."
    grain: "One row per restriction."
    fields:
      status: "Set to restricted."
    triggers: []
  - type: checking_restore
    target: checking_accounts
    mutation: {transition: {from: restricted, to: active}}
    meaning: "A restricted account whose ledger balance is back at zero or above returns to active."
    grain: "One row per restoration."
    fields:
      status: "Set to active."
      negative_since_date: "Cleared to empty because the balance is no longer negative."
    triggers: []
  - type: checking_charge_off
    target: checking_accounts
    mutation: {transition: {from: restricted, to: charged_off}}
    meaning: "The unpaid negative balance of a restricted account is charged off."
    grain: "One row per charge-off."
    fields:
      status: "Set to charged_off."
    triggers:
      - event: "checking:checking_chargeoff_writeoff"
        map: {channel: bank_adjustment, adjustment_reason: none, fee_code: none}
  - type: checking_close
    target: checking_accounts
    mutation: {transition: [{from: active, to: closed}, {from: dormant, to: closed}, {from: charged_off, to: closed}]}
    meaning: "The account is closed at the owner's confirmed request, or administratively after a charge-off."
    grain: "One row per closure."
    fields:
      status: "Set to closed."
      closed_date: "Date the account closed."
      overdraft_link_savings_account_id: "Cleared to empty; a closed account keeps no overdraft protection link."
    triggers: []
  - type: checking_change_product
    target: checking_accounts
    mutation: update
    meaning: "The account is converted to a different checking tier while keeping its account number and history."
    grain: "One row per tier conversion."
    fields:
      variant_name: "The official name of the new tier."
    triggers: []
  - type: checking_set_overdraft_election
    target: checking_accounts
    mutation: update
    meaning: "The owner's election on whether ATM and one-time debit card transactions may be paid into overdraft is recorded."
    grain: "One row per election change."
    fields:
      debit_overdraft_election: "The new election, opted_in or opted_out."
    triggers: []
  - type: checking_set_overdraft_link
    target: checking_accounts
    mutation: update
    meaning: "A savings account is linked to, or unlinked from, the checking account as its overdraft protection source."
    grain: "One row per link change."
    fields:
      overdraft_link_savings_account_id: "The linked savings account, or empty when the link is removed."
    triggers: []
  - type: checking_set_statement_delivery
    target: checking_accounts
    mutation: update
    meaning: "The statement delivery method is changed between electronic and paper."
    grain: "One row per delivery change."
    fields:
      statement_delivery: "The new delivery method."
    triggers: []
  # ---------------- ledger writes (checking_transactions) ----------------
  - type: checking_deposit
    target: checking_transactions
    meaning: "A credit item posts to the account: cash, a check, mobile deposit, ACH credit or direct deposit, an incoming wire, a Zelle receipt or an internal transfer in."
    grain: "One row per credit item posted, identified by its posting trace number."
    distinguish_by: [trace_number]
    fields:
      amount: "Amount credited, positive."
      posted_date: "Business day the credit posted and became available."
      channel: "How the credit arrived."
      description: "Payer or deposit description as printed on the statement."
      trace_number: "Unique posting trace number of the item."
      check_number: "Serial number of a deposited check where one applies, otherwise empty."
      statement_cycle: "Statement cycle in which the item posted."
      counterparty_account_id: "The PCB account on the other side of an internal transfer, otherwise empty."
    account: checking_balance
    direction: in
    triggers: []
  - type: checking_debit
    target: checking_transactions
    meaning: "A debit item is paid from the account: a debit card purchase, ATM withdrawal, paid check, ACH debit, Zelle payment, outgoing wire, official check purchase or internal transfer out."
    grain: "One row per debit item paid, identified by its posting trace number."
    distinguish_by: [trace_number]
    fields:
      amount: "Amount debited, positive; for a non-PCB ATM withdrawal it includes the operator surcharge."
      posted_date: "Business day the item was paid."
      channel: "How the debit was made."
      description: "Merchant, payee or ATM description as printed on the statement."
      trace_number: "Unique posting trace number of the item."
      check_number: "Serial number of a paid check, otherwise empty."
      atm_operator_surcharge: "Surcharge the non-PCB ATM operator added, 0.00 when none."
      statement_cycle: "Statement cycle in which the item posted."
      counterparty_account_id: "The PCB account on the other side of an internal transfer, otherwise empty."
    account: checking_balance
    direction: out
    triggers:
      - event: "checking:checking_fee"
        when: {channel: wire_domestic}
        map: {fee_code: wire_domestic_out, source_item_id: checking_txn_id, posted_date: posted_date, statement_cycle: statement_cycle}
      - event: "checking:checking_fee"
        when: {channel: wire_international}
        map: {fee_code: wire_international_out, source_item_id: checking_txn_id, posted_date: posted_date, statement_cycle: statement_cycle}
  - type: checking_returned_item
    target: checking_transactions
    meaning: "A presented check or ACH debit is returned unpaid because the account could not cover it; nothing is debited for the item itself."
    grain: "One row per item returned unpaid, identified by its presentment trace number."
    distinguish_by: [trace_number]
    fields:
      amount: "Face amount of the returned item, recorded but not booked."
      posted_date: "Business day the item was returned."
      channel: "check_paid for a check or ach_debit for an ACH debit."
      description: "Payee description of the returned item."
      trace_number: "Presentment trace number of the item."
      check_number: "Serial number of a returned check, otherwise empty."
      statement_cycle: "Statement cycle in which the return occurred."
    triggers: []
  - type: checking_fee
    target: checking_transactions
    meaning: "A fee is assessed to the account."
    grain: "One row per fee assessed: per item for item-based fees, per order for service fees, per statement cycle for periodic fees."
    distinguish_by: [fee_code, source_item_id, statement_cycle, posted_date]
    fields:
      amount: "Fee amount, positive."
      posted_date: "Business day the fee posted."
      fee_code: "Which fee this is."
      source_item_id: "The debit, returned item, service order or overdraft transfer that caused the fee; empty for periodic fees."
      statement_cycle: "Statement cycle to which the fee belongs."
    account: checking_balance
    direction: out
    triggers: []
  - type: checking_fee_refund
    target: checking_transactions
    meaning: "A previously assessed fee is refunded in full."
    grain: "One row per fee refunded; a fee can be refunded at most once."
    distinguish_by: [source_item_id]
    fields:
      amount: "Refunded amount, equal to the refunded fee's amount, positive."
      posted_date: "Business day the refund posted."
      fee_code: "Fee code of the fee being refunded."
      source_item_id: "The fee row being refunded."
      adjustment_reason: "courtesy_waiver, bank_error or dispute_final."
      statement_cycle: "Statement cycle in which the refund posted."
    account: checking_balance
    direction: in
    triggers: []
  - type: checking_interest_credit
    target: checking_transactions
    meaning: "Interest earned during a statement cycle is credited at cycle close."
    grain: "One row per account per statement cycle."
    distinguish_by: [statement_cycle]
    fields:
      amount: "Interest credited, positive."
      posted_date: "Cycle closing date."
      statement_cycle: "Statement cycle the interest was earned in."
    account: checking_balance
    direction: in
    triggers: []
  - type: checking_atm_rebate
    target: checking_transactions
    meaning: "A non-PCB ATM operator surcharge is rebated to the account."
    grain: "One row per rebated ATM withdrawal."
    distinguish_by: [source_item_id]
    fields:
      amount: "Rebated amount, positive."
      posted_date: "Business day the rebate posted."
      source_item_id: "The ATM withdrawal whose surcharge is rebated."
      adjustment_reason: "Always atm_surcharge_rebate."
      statement_cycle: "Statement cycle in which the rebated withdrawal posted."
    account: checking_balance
    direction: in
    triggers: []
  - type: checking_overdraft_transfer
    target: checking_transactions
    meaning: "Funds move from the linked savings account to cover an item that would otherwise overdraw the checking account."
    grain: "One row per item covered by a transfer."
    distinguish_by: [source_item_id]
    fields:
      amount: "Amount transferred in, positive."
      posted_date: "Business day of the transfer."
      channel: "Always overdraft_transfer."
      source_item_id: "The debit item the transfer covered."
      counterparty_account_id: "The linked savings account the funds came from."
      statement_cycle: "Statement cycle of the transfer."
    account: checking_balance
    direction: in
    triggers:
      - event: "savings:savings_withdrawal"
        map: {amount: amount, posted_date: posted_date, channel: overdraft_transfer, counterparty_account_id: checking_account_id}
  - type: checking_provisional_credit
    target: checking_transactions
    meaning: "A provisional credit is posted while an electronic-transaction dispute is under investigation."
    grain: "One row per dispute provisionally credited."
    distinguish_by: [checking_dispute_id]
    fields:
      amount: "Provisional credit amount, positive."
      posted_date: "Business day the credit posted."
      source_item_id: "The disputed debit."
      checking_dispute_id: "The dispute this credit belongs to."
      adjustment_reason: "Always dispute_provisional."
      statement_cycle: "Statement cycle of the credit."
    account: checking_balance
    direction: in
    triggers: []
  - type: checking_provisional_reversal
    target: checking_transactions
    meaning: "A provisional credit is reversed after the dispute was resolved in the bank's favor."
    grain: "One row per dispute whose provisional credit is reversed."
    distinguish_by: [checking_dispute_id]
    fields:
      amount: "Amount reversed, positive."
      posted_date: "Business day the reversal posted."
      source_item_id: "The provisional credit row being reversed."
      checking_dispute_id: "The dispute this reversal belongs to."
      adjustment_reason: "Always dispute_reversal."
      statement_cycle: "Statement cycle of the reversal."
    account: checking_balance
    direction: out
    triggers: []
  - type: checking_chargeoff_writeoff
    target: checking_transactions
    meaning: "The negative ledger balance of a charged-off account is written off, bringing the ledger balance to zero."
    grain: "One row per charge-off."
    distinguish_by: [posted_date]
    fields:
      amount: "Magnitude of the negative balance written off, positive."
      posted_date: "Business day of the charge-off."
      channel: "Always bank_adjustment."
      adjustment_reason: "Always none."
      fee_code: "Always none."
    account: checking_balance
    direction: in
    triggers: []
  # ---------------- documentary writes (checking_service_orders) ----------------
  - type: checking_stop_payment
    target: checking_service_orders
    meaning: "A stop payment order is placed on a specific paper check."
    grain: "One row per stop payment order."
    distinguish_by: [check_number, order_date]
    fields:
      order_date: "Date the order was placed."
      check_number: "Serial number of the check to stop, exactly as the customer states it."
      stop_amount: "Exact amount of the check, exactly as the customer states it."
      payee: "Payee name as the customer states it."
      stop_expiry_date: "Date the order lapses."
    triggers: []
  - type: checking_stop_renewal
    target: checking_service_orders
    meaning: "An unexpired stop payment order is renewed for a further period."
    grain: "One row per renewal of an order."
    distinguish_by: [related_order_id, order_date]
    fields:
      order_date: "Date the renewal was placed."
      check_number: "Serial number carried from the original order."
      stop_amount: "Amount carried from the original order."
      related_order_id: "The stop payment order (or previous renewal) being renewed."
      stop_expiry_date: "New lapse date of the renewed order."
    triggers: []
  - type: checking_card_replacement
    target: checking_service_orders
    meaning: "A replacement debit card is ordered for the account."
    grain: "One row per replacement card ordered."
    distinguish_by: [order_date, card_reason]
    fields:
      order_date: "Date the replacement was ordered."
      card_reason: "Why the card is being replaced."
      delivery_speed: "standard or rush delivery."
    triggers: []

measures:
  - id: checking_msr_overdraft_fees_day
    window: "One business day, identified by posted_date, for one account."
    measure: "Count of checking_fee rows with fee_code overdraft_item or returned_item posted on that business day for the account."
  - id: checking_msr_courtesy_refunds_365d
    window: "Rolling 365 calendar days ending on the frozen date, inclusive of both ends."
    measure: "Count of checking_fee_refund rows with adjustment_reason courtesy_waiver on all checking accounts whose customer_id is the customer's."
  - id: checking_msr_cycle_min_daily_balance
    window: "The statement cycle: from the day after the previous cycle closing date through the cycle closing date."
    measure: "Lowest end-of-day ledger balance of the account on any calendar day of the cycle, computed from all posted checking_transactions rows booked to checking_balance."
  - id: checking_msr_cycle_end_of_day_balances
    window: "The statement cycle: each calendar day from the day after the previous cycle closing date through the cycle closing date."
    measure: "For each calendar day of the cycle, the end-of-day ledger balance of the account, computed as the running sum of all checking_transactions rows booked to checking_balance posted on or before that day."
  - id: checking_msr_cycle_direct_deposit_total
    window: "The statement cycle, by posted_date."
    measure: "Sum of amount over checking_deposit rows with channel ach_direct_deposit posted in the cycle."
  - id: checking_msr_cycle_debit_purchase_count
    window: "The statement cycle, by posted_date."
    measure: "Count of checking_debit rows with channel debit_card_pos or debit_card_international posted in the cycle."
  - id: checking_msr_relationship_balance
    window: "Close of business on the measurement date (the cycle closing date for a waiver; the frozen date for an entry test or conversion)."
    measure: "Sum over the customer's holdings of: ledger_balance of each checking account not closed or charged_off (negative balances counted as zero), current_balance of each savings account not closed, principal_balance of each certificate not closed, and, only when the tier's relationship_balance_includes_mortgage is true, principal_balance of each mortgage loan in active, delinquent or forbearance status."
  - id: checking_msr_cycle_atm_rebates
    window: "The statement cycle, by posted_date of the rebated withdrawal."
    measure: "Count and USD sum of checking_atm_rebate rows whose source withdrawal posted in the cycle."
  - id: checking_msr_cycle_stop_orders
    window: "The statement cycle, by order_date."
    measure: "Count of checking_stop_payment and checking_stop_renewal rows placed in the cycle, in order_date order."
  - id: checking_msr_mobile_deposits_30d
    window: "Rolling 30 calendar days ending on the deposit date, inclusive."
    measure: "Sum of amount over checking_deposit rows with channel mobile_deposit."
  - id: checking_msr_zelle_sent_30d
    window: "Rolling 30 calendar days ending on the payment date, inclusive."
    measure: "Sum of amount over checking_debit rows with channel zelle."
  - id: checking_msr_overdraft_transfer_fees_day
    window: "One business day, identified by posted_date, for one account."
    measure: "Count of checking_fee rows with fee_code overdraft_transfer posted on that business day."

policies:
  - id: checking_agg_multi_holding
    subject: [checking_open]
    rule: >-
      A customer may hold several personal checking accounts as primary owner, subject to two caps that
      apply together. The count of the customer's checking accounts whose status is not closed must be
      below max_per_customer before a new account is opened. The count of the customer's checking accounts
      of the requested tier whose status is not closed must be below that tier's
      max_accounts_per_customer_this_tier before a new account of that tier is opened. Accounts in applied,
      active, dormant, restricted and charged_off status all count toward both caps; closed accounts never
      count. Joint ownership is not modelled: an account counts only for the customer_id recorded on it.
      When either cap is already reached the opening is declined and no row is written.
    eligibility:
      - id: portfolio_cap
        applies_to: [checking_open]
        kind: authorization
        condition: "The count of the customer's checking accounts whose status is not closed must be below max_per_customer before a new account is opened."
        evidence_fields: [checking_accounts.customer_id, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.customer_id]]
          action_bindings: {checking_accounts.customer_id: customer_id}
      - id: tier_cap
        applies_to: [checking_open]
        kind: authorization
        condition: "The count of the customer's checking accounts of the requested tier whose status is not closed must be below that tier's max_accounts_per_customer_this_tier before a new account of that tier is opened."
        evidence_fields: [checking_accounts.customer_id, checking_accounts.variant_name, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.customer_id, checking_accounts.variant_name]]
          action_bindings: {checking_accounts.customer_id: customer_id, checking_accounts.variant_name: variant_name}
    params:
      max_per_customer: 4
      per_tier:
        Access Checking: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Student Checking: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Everyday Checking: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Interest Checking: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Premier Checking: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Private Client Checking: {tier_cap: "=max_accounts_per_customer_this_tier"}

  - id: checking_agg_relationship_balance
    subject: [checking_fee, checking_change_product, checking_open]
    rule: >-
      Every checking rule that speaks of a relationship balance uses one basis, the measure
      checking_msr_relationship_balance: the customer's deposit balances at PCB summed across checking,
      savings and certificate holdings in the customer's own name, taken at close of business on the
      measurement date. A checking account with a negative ledger balance contributes zero rather than
      reducing the sum. Mortgage principal is added only for tiers whose relationship_balance_includes_mortgage
      is true, and only for loans in active, delinquent or forbearance status. Credit card balances, auto loan
      balances and safe deposit box rentals never count. For the maintenance fee waiver the measurement date
      is the statement cycle closing date; for the Private Client Checking entry test and for a tier
      conversion it is the frozen date on which the request is handled. Pending deposits that have not posted
      do not count.
    eligibility: []
    measures: [checking_msr_relationship_balance]

  - id: checking_open_and_funding
    subject: [checking_open, checking_activate, checking_lapse_unfunded]
    rule: >-
      A checking account is opened in applied status with a zero ledger balance, opted_out debit overdraft
      election and no overdraft link. The customer must satisfy the tier's entry gate on the opening date.
      The customer's age in whole years on the opening date, computed from the date of birth on the customer
      profile, must be at least the tier's age_min_to_open and, where the tier sets one, no more than
      age_max_to_open. For Private Client Checking the relationship balance on the opening date must be at
      least entry_relationship_balance_min. The account becomes active on the business day its first
      deposit posts, provided that deposit is at least the tier's minimum_opening_deposit; a smaller first
      deposit is returned to its source and does not activate the account. An account still in applied
      status is closed as unfunded once funding_window_days calendar days have passed after the account
      was opened. Count calendar days with the day after opened_date as day 1; the lapse is due when the
      frozen date is on or after opened_date plus funding_window_days. No fee is charged on an unfunded
      closure.
    eligibility:
      - id: age_gate
        applies_to: [checking_open]
        kind: authorization
        condition: "The customer's age in whole years on the opening date, computed from the date of birth on the customer profile, must be at least the tier's age_min_to_open and, where the tier sets one, no more than age_max_to_open."
        evidence_fields: [customers.customer_id, customers.date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
      - id: private_client_relationship
        applies_to: [checking_open]
        kind: authorization
        condition: "For Private Client Checking the relationship balance on the opening date must be at least entry_relationship_balance_min."
        evidence_fields: [customers.customer_id, savings_accounts.current_balance, cd_certificates.principal_balance, checking_accounts.ledger_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
      - id: funding_lapse
        applies_to: [checking_lapse_unfunded]
        kind: time
        condition: "An account still in applied status is closed as unfunded once funding_window_days calendar days have passed after the account was opened."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account was opened"
          anchor_source: checking_accounts.opened_date
          relation: not_before
          duration_source: params.funding_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after opened_date as day 1; the lapse is due when the frozen date is on or after opened_date plus funding_window_days."
          boundary: inclusive
    params:
      funding_window_days: 30
      per_tier:
        Access Checking: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", max_age: "=age_max_to_open", relationship_min: "=entry_relationship_balance_min"}
        Student Checking: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", max_age: "=age_max_to_open", relationship_min: "=entry_relationship_balance_min"}
        Everyday Checking: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", max_age: "=age_max_to_open", relationship_min: "=entry_relationship_balance_min"}
        Interest Checking: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", max_age: "=age_max_to_open", relationship_min: "=entry_relationship_balance_min"}
        Premier Checking: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", max_age: "=age_max_to_open", relationship_min: "=entry_relationship_balance_min"}
        Private Client Checking: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", max_age: "=age_max_to_open", relationship_min: "=entry_relationship_balance_min"}

  - id: checking_evt_maintenance_and_statement_fees
    subject: [checking_fee, checking_set_statement_delivery]
    rule: >-
      At each statement cycle close the tier's monthly_maintenance_fee is assessed as one checking_fee row
      with fee_code monthly_maintenance, statement_cycle set to the closing cycle and posted_date set to the
      cycle closing date, unless at least one waiver offered by the tier is met for that cycle. The tier used
      is the variant_name on the account at cycle close. The waivers are alternatives and any single one
      suffices; they never combine to reduce the fee partially and the fee is never prorated. A waiver whose
      parameter is not_offered cannot be used. The waivers are: checking_msr_cycle_min_daily_balance at or
      above waiver_min_daily_balance; checking_msr_cycle_direct_deposit_total at or above
      waiver_direct_deposit_total; the relationship balance at cycle close at or above
      waiver_relationship_balance; checking_msr_cycle_debit_purchase_count at or above
      waiver_debit_purchase_count; the primary owner's age at cycle close below waiver_age_under; the primary
      owner's age at cycle close at or above waiver_age_at_least; military_status active_duty on the customer
      profile at cycle close when waiver_military_active_duty is true; employee_status active_employee on the
      customer profile at cycle close when waiver_employee is true. The fee is not assessed for the statement
      cycle in which the account was opened. The fee is assessed only on an account whose status at cycle
      close is active or restricted. A dormant account pays the dormant account fee instead, never both. At
      most one monthly maintenance fee is assessed per account per statement cycle. Separately, when
      statement_delivery is paper at cycle close the tier's paper_statement_fee is assessed as a checking_fee
      row with fee_code paper_statement for that cycle, except that owners whose age at cycle close is at least
      paper_statement_fee_exempt_age pay no paper statement fee; switching delivery takes effect for the cycle
      in which the switch is recorded, judged at that cycle's close. A fee assessed although a waiver was met
      is a bank error and is refunded under checking_evt_fee_refund.
    eligibility:
      - id: status_at_cycle_close
        applies_to: [checking_fee]
        kind: state
        condition: "The fee is assessed only on an account whose status at cycle close is active or restricted."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
        state_contract:
          field: checking_accounts.status
          allowed: [active, restricted]
      - id: one_per_cycle
        applies_to: [checking_fee]
        kind: dedup
        condition: "At most one monthly maintenance fee is assessed per account per statement cycle."
        evidence_fields: [checking_transactions.checking_account_id, checking_transactions.statement_cycle, checking_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_transactions.checking_account_id, checking_transactions.statement_cycle]]
          action_bindings: {checking_transactions.checking_account_id: checking_account_id, checking_transactions.statement_cycle: statement_cycle}
        dedup_contract:
          table: checking_transactions
          mode: separate_record
          object_bindings: {checking_account_id: checking_account_id, statement_cycle: statement_cycle}
          duplicate_filters: {event_type: [checking_fee], fee_code: [monthly_maintenance]}
          distinct_fields: []
    params:
      per_tier:
        Access Checking: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", direct_deposit: "=waiver_direct_deposit_total", relationship: "=waiver_relationship_balance", purchases: "=waiver_debit_purchase_count", age_under: "=waiver_age_under", age_at_least: "=waiver_age_at_least", military: "=waiver_military_active_duty", employee: "=waiver_employee", paper_fee: "=paper_statement_fee"}
        Student Checking: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", direct_deposit: "=waiver_direct_deposit_total", relationship: "=waiver_relationship_balance", purchases: "=waiver_debit_purchase_count", age_under: "=waiver_age_under", age_at_least: "=waiver_age_at_least", military: "=waiver_military_active_duty", employee: "=waiver_employee", paper_fee: "=paper_statement_fee"}
        Everyday Checking: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", direct_deposit: "=waiver_direct_deposit_total", relationship: "=waiver_relationship_balance", purchases: "=waiver_debit_purchase_count", age_under: "=waiver_age_under", age_at_least: "=waiver_age_at_least", military: "=waiver_military_active_duty", employee: "=waiver_employee", paper_fee: "=paper_statement_fee"}
        Interest Checking: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", direct_deposit: "=waiver_direct_deposit_total", relationship: "=waiver_relationship_balance", purchases: "=waiver_debit_purchase_count", age_under: "=waiver_age_under", age_at_least: "=waiver_age_at_least", military: "=waiver_military_active_duty", employee: "=waiver_employee", paper_fee: "=paper_statement_fee"}
        Premier Checking: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", direct_deposit: "=waiver_direct_deposit_total", relationship: "=waiver_relationship_balance", purchases: "=waiver_debit_purchase_count", age_under: "=waiver_age_under", age_at_least: "=waiver_age_at_least", military: "=waiver_military_active_duty", employee: "=waiver_employee", paper_fee: "=paper_statement_fee"}
        Private Client Checking: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", direct_deposit: "=waiver_direct_deposit_total", relationship: "=waiver_relationship_balance", purchases: "=waiver_debit_purchase_count", age_under: "=waiver_age_under", age_at_least: "=waiver_age_at_least", military: "=waiver_military_active_duty", employee: "=waiver_employee", paper_fee: "=paper_statement_fee"}
    measures: [checking_msr_cycle_min_daily_balance, checking_msr_cycle_direct_deposit_total, checking_msr_cycle_debit_purchase_count, checking_msr_relationship_balance]

  - id: checking_evt_overdraft_and_returned_item_fees
    subject: [checking_fee, checking_debit, checking_returned_item]
    rule: >-
      Posting order within a business day is fixed: all credits post first, then debit items in ascending
      order of amount, with checks of equal amount in ascending check_number order. When a debit item would
      take the ledger balance below zero, an overdraft protection transfer under
      checking_evt_overdraft_protection_transfer is attempted first. If no transfer covers the item, the
      tier decides. When overdraft_coverage_available is false, ATM and debit card items are declined (no
      row) and checks and ACH debits are returned unpaid as checking_returned_item rows. When coverage is
      available, an ATM withdrawal or one-time debit card purchase is paid into overdraft only if the
      account's debit_overdraft_election is opted_in; otherwise it is declined with no row and no fee.
      Checks, ACH debits and recurring debit card payments are paid into overdraft when the resulting negative
      ledger balance is no deeper than overdraft_coverage_limit, and otherwise returned unpaid. Each item paid
      into overdraft incurs overdraft_fee_per_item as a checking_fee row with fee_code overdraft_item whose
      source_item_id is that debit; each returned item incurs returned_item_fee with fee_code returned_item
      whose source_item_id is the returned item. No overdraft fee is charged on an item whose amount is
      overdraft_item_de_minimis or less. No overdraft or returned-item fee is charged for a business day
      whose end-of-day ledger balance is negative by overdraft_end_of_day_de_minimis or less. Overdraft-item
      and returned-item fees together are limited to overdraft_daily_item_limit per account per business day,
      counted by checking_msr_overdraft_fees_day in posting order; items beyond the limit carry no fee. A
      tier fee of 0.00 means no fee row is written. The fee is assessed only on an account whose status is
      active. Each item can carry at most one overdraft-item or returned-item fee. Fees never apply to
      credits, to the bank's own fee postings, or to items on a restricted account, where every debit that
      would overdraw is returned without a fee.
    eligibility:
      - id: active_only
        applies_to: [checking_fee]
        kind: state
        condition: "The fee is assessed only on an account whose status is active."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
        state_contract:
          field: checking_accounts.status
          allowed: [active]
      - id: debit_opt_in
        applies_to: [checking_debit]
        kind: authorization
        condition: "When coverage is available, an ATM withdrawal or one-time debit card purchase is paid into overdraft only if the account's debit_overdraft_election is opted_in; otherwise it is declined with no row and no fee."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.debit_overdraft_election]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
      - id: one_fee_per_item
        applies_to: [checking_fee]
        kind: dedup
        condition: "Each item can carry at most one overdraft-item or returned-item fee."
        evidence_fields: [checking_transactions.source_item_id, checking_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_transactions.source_item_id]]
          action_bindings: {checking_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: checking_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [checking_fee], fee_code: [overdraft_item, returned_item]}
          distinct_fields: []
    params:
      per_tier:
        Access Checking: {coverage: "=overdraft_coverage_available", limit: "=overdraft_coverage_limit", item_fee: "=overdraft_fee_per_item", returned_fee: "=returned_item_fee", item_de_minimis: "=overdraft_item_de_minimis", day_de_minimis: "=overdraft_end_of_day_de_minimis", daily_limit: "=overdraft_daily_item_limit"}
        Student Checking: {coverage: "=overdraft_coverage_available", limit: "=overdraft_coverage_limit", item_fee: "=overdraft_fee_per_item", returned_fee: "=returned_item_fee", item_de_minimis: "=overdraft_item_de_minimis", day_de_minimis: "=overdraft_end_of_day_de_minimis", daily_limit: "=overdraft_daily_item_limit"}
        Everyday Checking: {coverage: "=overdraft_coverage_available", limit: "=overdraft_coverage_limit", item_fee: "=overdraft_fee_per_item", returned_fee: "=returned_item_fee", item_de_minimis: "=overdraft_item_de_minimis", day_de_minimis: "=overdraft_end_of_day_de_minimis", daily_limit: "=overdraft_daily_item_limit"}
        Interest Checking: {coverage: "=overdraft_coverage_available", limit: "=overdraft_coverage_limit", item_fee: "=overdraft_fee_per_item", returned_fee: "=returned_item_fee", item_de_minimis: "=overdraft_item_de_minimis", day_de_minimis: "=overdraft_end_of_day_de_minimis", daily_limit: "=overdraft_daily_item_limit"}
        Premier Checking: {coverage: "=overdraft_coverage_available", limit: "=overdraft_coverage_limit", item_fee: "=overdraft_fee_per_item", returned_fee: "=returned_item_fee", item_de_minimis: "=overdraft_item_de_minimis", day_de_minimis: "=overdraft_end_of_day_de_minimis", daily_limit: "=overdraft_daily_item_limit"}
        Private Client Checking: {coverage: "=overdraft_coverage_available", limit: "=overdraft_coverage_limit", item_fee: "=overdraft_fee_per_item", returned_fee: "=returned_item_fee", item_de_minimis: "=overdraft_item_de_minimis", day_de_minimis: "=overdraft_end_of_day_de_minimis", daily_limit: "=overdraft_daily_item_limit"}
    measures: [checking_msr_overdraft_fees_day]

  - id: checking_evt_extended_overdraft_fee
    subject: [checking_fee]
    rule: >-
      When the ledger balance stays negative long enough, a single extended overdraft fee is assessed for
      that negative episode. A negative episode begins on the date the ledger balance first went negative,
      recorded as negative_since_date on the account, and ends when the end-of-day ledger balance returns to
      zero or above, which clears negative_since_date. The fee applies once extended_overdraft_trigger_days
      calendar days have passed after the ledger balance first went negative. Count calendar days with the
      day after negative_since_date as day 1; the fee is due when the frozen date is on or after
      negative_since_date plus extended_overdraft_trigger_days. The fee is written as a checking_fee row with
      fee_code extended_overdraft and posted_date equal to negative_since_date plus
      extended_overdraft_trigger_days. Only one extended overdraft fee is assessed per negative episode. A
      tier whose extended_overdraft_fee is 0.00 writes no row. The fee is not subject to the daily
      overdraft-item limit and is not assessed if the balance was brought back to zero or above before the
      due date.
    eligibility:
      - id: episode_age
        applies_to: [checking_fee]
        kind: time
        condition: "The fee applies once extended_overdraft_trigger_days calendar days have passed after the ledger balance first went negative."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.negative_since_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the ledger balance first went negative"
          anchor_source: checking_accounts.negative_since_date
          relation: not_before
          duration_source: variants.extended_overdraft_trigger_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after negative_since_date as day 1; the fee is due when the frozen date is on or after negative_since_date plus extended_overdraft_trigger_days."
          boundary: inclusive
      - id: once_per_episode
        applies_to: [checking_fee]
        kind: dedup
        condition: "Only one extended overdraft fee is assessed per negative episode."
        evidence_fields: [checking_transactions.checking_account_id, checking_transactions.fee_code, checking_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_transactions.checking_account_id]]
          action_bindings: {checking_transactions.checking_account_id: checking_account_id}
        dedup_contract:
          table: checking_transactions
          mode: separate_record
          object_bindings: {checking_account_id: checking_account_id}
          duplicate_filters: {event_type: [checking_fee], fee_code: [extended_overdraft]}
          distinct_fields: [posted_date]
    params:
      per_tier:
        Access Checking: {fee: "=extended_overdraft_fee", trigger_days: "=extended_overdraft_trigger_days"}
        Student Checking: {fee: "=extended_overdraft_fee", trigger_days: "=extended_overdraft_trigger_days"}
        Everyday Checking: {fee: "=extended_overdraft_fee", trigger_days: "=extended_overdraft_trigger_days"}
        Interest Checking: {fee: "=extended_overdraft_fee", trigger_days: "=extended_overdraft_trigger_days"}
        Premier Checking: {fee: "=extended_overdraft_fee", trigger_days: "=extended_overdraft_trigger_days"}
        Private Client Checking: {fee: "=extended_overdraft_fee", trigger_days: "=extended_overdraft_trigger_days"}

  - id: checking_evt_fee_refund
    subject: [checking_fee_refund]
    rule: >-
      A fee is refunded in full, never in part, as one checking_fee_refund row whose source_item_id is the
      fee row and whose amount equals that fee's amount. There are two refund grounds, checked in this order.
      A bank_error refund applies when the fee was assessed contrary to the checking charter, for example a
      maintenance fee in a cycle where a waiver was met, an overdraft fee beyond overdraft_daily_item_limit,
      on an item at or below overdraft_item_de_minimis, or on a day within overdraft_end_of_day_de_minimis,
      or a fee at an amount other than the tier's parameter; a bank_error refund has no time limit and does
      not count toward any courtesy limit. A courtesy_waiver refund is a goodwill refund of a correctly
      assessed fee and is allowed only when every courtesy gate holds. The fee's fee_code must be one of
      courtesy_eligible_fee_codes. The fee must have posted no more than courtesy_refund_window_days calendar
      days before the courtesy refund is granted. Count calendar days with the day after the fee's posted_date
      as day 1; the refund is allowed while the frozen date is on or before the fee's posted_date plus
      courtesy_refund_window_days. The customer's count of courtesy refunds in the rolling 365 days must be
      below the tier's courtesy_refund_limit_365d, counted by checking_msr_courtesy_refunds_365d across all of
      the customer's checking accounts, where each refunded fee counts as one. The account's status must be
      active when a courtesy refund is granted. When several fees are eligible and the limit allows fewer than
      requested, the most recently posted fees are refunded first, and among fees posted the same day the
      larger fee first. A fee can be refunded at most once. The tier used for the courtesy limit and window is
      the account's variant_name on the frozen date. A dispute_final refund is written under
      checking_evt_electronic_dispute and is not a courtesy refund. Requests to refund interest, charged-off
      balances or another bank's fees are outside this policy.
    eligibility:
      - id: eligible_fee_code
        applies_to: [checking_fee_refund]
        kind: authorization
        condition: "The fee's fee_code must be one of courtesy_eligible_fee_codes."
        evidence_fields: [checking_transactions.checking_txn_id, checking_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_transactions.checking_txn_id]]
          action_bindings: {checking_transactions.checking_txn_id: source_item_id}
      - id: courtesy_window
        applies_to: [checking_fee_refund]
        kind: time
        condition: "The fee must have posted no more than courtesy_refund_window_days calendar days before the courtesy refund is granted."
        evidence_fields: [checking_transactions.checking_txn_id, checking_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_transactions.checking_txn_id]]
          action_bindings: {checking_transactions.checking_txn_id: source_item_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "The fee must have posted"
          anchor_source: checking_transactions.posted_date
          relation: not_after
          duration_source: variants.courtesy_refund_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after the fee's posted_date as day 1; the refund is allowed while the frozen date is on or before the fee's posted_date plus courtesy_refund_window_days."
          boundary: inclusive
      - id: courtesy_limit
        applies_to: [checking_fee_refund]
        kind: authorization
        condition: "The customer's count of courtesy refunds in the rolling 365 days must be below the tier's courtesy_refund_limit_365d, counted by checking_msr_courtesy_refunds_365d across all of the customer's checking accounts, where each refunded fee counts as one."
        evidence_fields: [checking_transactions.customer_id, checking_transactions.adjustment_reason, checking_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_transactions.customer_id]]
          action_bindings: {checking_transactions.customer_id: customer_id}
      - id: account_active
        applies_to: [checking_fee_refund]
        kind: state
        condition: "The account's status must be active when a courtesy refund is granted."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
        state_contract:
          field: checking_accounts.status
          allowed: [active]
      - id: refund_once
        applies_to: [checking_fee_refund]
        kind: dedup
        condition: "A fee can be refunded at most once."
        evidence_fields: [checking_transactions.source_item_id, checking_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_transactions.source_item_id]]
          action_bindings: {checking_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: checking_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [checking_fee_refund]}
          distinct_fields: []
    params:
      courtesy_eligible_fee_codes: [monthly_maintenance, paper_statement, overdraft_item, returned_item, extended_overdraft, overdraft_transfer, out_of_network_atm]
      per_tier:
        Access Checking: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Student Checking: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Everyday Checking: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Interest Checking: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Premier Checking: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Private Client Checking: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
    measures: [checking_msr_courtesy_refunds_365d]

  - id: checking_evt_overdraft_protection_transfer
    subject: [checking_overdraft_transfer, checking_set_overdraft_link, checking_fee]
    rule: >-
      A checking account may name one savings account as its overdraft protection source. The linked savings
      account must belong to the same customer_id as the checking account. The linked savings account must be
      in active status when the link is recorded. The savings tier must have overdraft_protection_source_eligible
      true in the savings charter. Removing the link is always allowed. When a debit item would take the
      checking ledger balance below zero and a link exists, one transfer is made for that item in the exact
      amount of the shortfall, meaning the amount needed to bring the ledger balance to exactly zero after
      the item; the transfer is made only if the savings current_balance at that moment covers the whole
      shortfall, and a partial transfer is never made. The transfer writes a checking_overdraft_transfer row
      whose source_item_id is the covered item and a matching savings withdrawal through its trigger; the
      savings charter decides whether that withdrawal counts toward the savings withdrawal allowance. Each
      transfer incurs the checking tier's overdraft_transfer_fee as a checking_fee row with fee_code
      overdraft_transfer whose source_item_id is the transfer row, limited to overdraft_transfer_fee_daily_max
      fees per account per business day counted by checking_msr_overdraft_transfer_fees_day; a tier fee of
      0.00 writes no row. A covered item is not an overdraft and carries no overdraft-item fee.
    eligibility:
      - id: same_owner
        applies_to: [checking_set_overdraft_link]
        kind: authorization
        condition: "The linked savings account must belong to the same customer_id as the checking account."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.customer_id, checking_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: overdraft_link_savings_account_id}
      - id: savings_active
        applies_to: [checking_set_overdraft_link]
        kind: state
        condition: "The linked savings account must be in active status when the link is recorded."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: overdraft_link_savings_account_id}
        state_contract:
          field: savings_accounts.status
          allowed: [active]
    params:
      per_tier:
        Access Checking: {transfer_fee: "=overdraft_transfer_fee", daily_max: "=overdraft_transfer_fee_daily_max"}
        Student Checking: {transfer_fee: "=overdraft_transfer_fee", daily_max: "=overdraft_transfer_fee_daily_max"}
        Everyday Checking: {transfer_fee: "=overdraft_transfer_fee", daily_max: "=overdraft_transfer_fee_daily_max"}
        Interest Checking: {transfer_fee: "=overdraft_transfer_fee", daily_max: "=overdraft_transfer_fee_daily_max"}
        Premier Checking: {transfer_fee: "=overdraft_transfer_fee", daily_max: "=overdraft_transfer_fee_daily_max"}
        Private Client Checking: {transfer_fee: "=overdraft_transfer_fee", daily_max: "=overdraft_transfer_fee_daily_max"}
    measures: [checking_msr_overdraft_transfer_fees_day]

  - id: checking_evt_overdraft_election
    subject: [checking_set_overdraft_election]
    rule: >-
      The debit overdraft election governs only ATM withdrawals and one-time debit card purchases; checks,
      ACH debits and recurring debit card payments are unaffected by it. Opting in requires the owner's own
      affirmative consent, given by the owner rather than recorded on the owner's behalf. Opting in is
      available only on a tier whose overdraft_coverage_available is true. Opting out can be requested at any
      time on any tier and takes effect when recorded. A new election applies to transactions authorized after
      it is recorded and never re-prices items already paid or declined; an opt-out does not refund fees
      already assessed. Recording the election already in force changes nothing and writes no row.
    eligibility:
      - id: tier_offers_coverage
        applies_to: [checking_set_overdraft_election]
        kind: authorization
        condition: "Opting in is available only on a tier whose overdraft_coverage_available is true."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
      - id: owner_consent
        applies_to: [checking_set_overdraft_election]
        kind: caller_fact
        condition: "Opting in requires the owner's own affirmative consent, given by the owner rather than recorded on the owner's behalf."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.debit_overdraft_election]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}

  - id: checking_evt_atm_and_foreign_fees
    subject: [checking_fee, checking_atm_rebate]
    rule: >-
      Each withdrawal or balance inquiry at a non-PCB ATM inside the United States incurs the tier's
      out_of_network_atm_fee as a checking_fee row with fee_code out_of_network_atm whose source_item_id is the
      ATM debit. Each withdrawal at an ATM outside the United States incurs international_atm_fee with fee_code
      international_atm instead of, not in addition to, the domestic out-of-network fee. Each debit card
      purchase with channel debit_card_international and each withdrawal with channel atm_international also
      incurs a foreign transaction fee equal to foreign_transaction_fee_pct percent of the item amount, rounded
      half-up to the cent, with fee_code foreign_transaction. PCB ATMs never carry a PCB fee. A tier fee or
      percentage of 0.00 writes no row. Operator surcharges on non-PCB domestic and international ATM
      withdrawals are rebated in posting order within the statement cycle: each rebate equals the
      withdrawal's atm_operator_surcharge, up to atm_surcharge_rebates_per_cycle rebates and a cumulative
      atm_surcharge_rebate_cap_per_cycle per cycle, counted by checking_msr_cycle_atm_rebates; the rebate that
      would cross the cap is reduced to the remaining cap, and later withdrawals in the cycle get none. PCB's
      own ATM fees and foreign transaction fees are never rebated as surcharges. A withdrawal with no operator
      surcharge gets no rebate row. The tier applied is the variant_name on the withdrawal's posted_date.
    eligibility: []
    formula:
      foreign_fee: "round(amount * foreign_transaction_fee_pct / 100, 2)"
    params:
      per_tier:
        Access Checking: {domestic: "=out_of_network_atm_fee", international: "=international_atm_fee", foreign_pct: "=foreign_transaction_fee_pct", rebates: "=atm_surcharge_rebates_per_cycle", rebate_cap: "=atm_surcharge_rebate_cap_per_cycle"}
        Student Checking: {domestic: "=out_of_network_atm_fee", international: "=international_atm_fee", foreign_pct: "=foreign_transaction_fee_pct", rebates: "=atm_surcharge_rebates_per_cycle", rebate_cap: "=atm_surcharge_rebate_cap_per_cycle"}
        Everyday Checking: {domestic: "=out_of_network_atm_fee", international: "=international_atm_fee", foreign_pct: "=foreign_transaction_fee_pct", rebates: "=atm_surcharge_rebates_per_cycle", rebate_cap: "=atm_surcharge_rebate_cap_per_cycle"}
        Interest Checking: {domestic: "=out_of_network_atm_fee", international: "=international_atm_fee", foreign_pct: "=foreign_transaction_fee_pct", rebates: "=atm_surcharge_rebates_per_cycle", rebate_cap: "=atm_surcharge_rebate_cap_per_cycle"}
        Premier Checking: {domestic: "=out_of_network_atm_fee", international: "=international_atm_fee", foreign_pct: "=foreign_transaction_fee_pct", rebates: "=atm_surcharge_rebates_per_cycle", rebate_cap: "=atm_surcharge_rebate_cap_per_cycle"}
        Private Client Checking: {domestic: "=out_of_network_atm_fee", international: "=international_atm_fee", foreign_pct: "=foreign_transaction_fee_pct", rebates: "=atm_surcharge_rebates_per_cycle", rebate_cap: "=atm_surcharge_rebate_cap_per_cycle"}
    measures: [checking_msr_cycle_atm_rebates]

  - id: checking_evt_service_fees
    subject: [checking_fee, checking_stop_payment, checking_stop_renewal, checking_card_replacement]
    rule: >-
      Service fees are assessed as checking_fee rows at the tier in force on the day of the service. An
      outgoing domestic wire incurs domestic_wire_out_fee with fee_code wire_domestic_out and an outgoing
      international wire incurs international_wire_out_fee with fee_code wire_international_out, each with the
      wire debit as source_item_id. An incoming wire credit incurs incoming_wire_fee with fee_code
      wire_incoming. An official check purchase incurs cashiers_check_fee with fee_code cashiers_check. A stop
      payment order or renewal incurs stop_payment_fee with fee_code stop_payment and the order as
      source_item_id, except that the first free_stop_orders_per_cycle orders and renewals placed in a
      statement cycle, counted in order_date order by checking_msr_cycle_stop_orders, are free. A replacement
      debit card incurs card_replacement_standard_fee with fee_code card_replacement_standard when the reason
      is lost or damaged, and no standard fee when the reason is stolen, compromised or expired; rush delivery
      additionally incurs card_replacement_rush_fee with fee_code card_replacement_rush whatever the reason.
      Account research requested by the customer incurs account_research_fee_per_hour per started hour with a
      one-hour minimum, with fee_code account_research; research needed to investigate a bank error or a
      dispute is never charged. A tier fee of 0.00 writes no row. Service fees are not subject to the daily
      overdraft-item limit.
    eligibility: []
    params:
      per_tier:
        Access Checking: {wire_domestic: "=domestic_wire_out_fee", wire_international: "=international_wire_out_fee", wire_in: "=incoming_wire_fee", stop_fee: "=stop_payment_fee", free_stops: "=free_stop_orders_per_cycle", cashiers: "=cashiers_check_fee", card_standard: "=card_replacement_standard_fee", card_rush: "=card_replacement_rush_fee", research: "=account_research_fee_per_hour"}
        Student Checking: {wire_domestic: "=domestic_wire_out_fee", wire_international: "=international_wire_out_fee", wire_in: "=incoming_wire_fee", stop_fee: "=stop_payment_fee", free_stops: "=free_stop_orders_per_cycle", cashiers: "=cashiers_check_fee", card_standard: "=card_replacement_standard_fee", card_rush: "=card_replacement_rush_fee", research: "=account_research_fee_per_hour"}
        Everyday Checking: {wire_domestic: "=domestic_wire_out_fee", wire_international: "=international_wire_out_fee", wire_in: "=incoming_wire_fee", stop_fee: "=stop_payment_fee", free_stops: "=free_stop_orders_per_cycle", cashiers: "=cashiers_check_fee", card_standard: "=card_replacement_standard_fee", card_rush: "=card_replacement_rush_fee", research: "=account_research_fee_per_hour"}
        Interest Checking: {wire_domestic: "=domestic_wire_out_fee", wire_international: "=international_wire_out_fee", wire_in: "=incoming_wire_fee", stop_fee: "=stop_payment_fee", free_stops: "=free_stop_orders_per_cycle", cashiers: "=cashiers_check_fee", card_standard: "=card_replacement_standard_fee", card_rush: "=card_replacement_rush_fee", research: "=account_research_fee_per_hour"}
        Premier Checking: {wire_domestic: "=domestic_wire_out_fee", wire_international: "=international_wire_out_fee", wire_in: "=incoming_wire_fee", stop_fee: "=stop_payment_fee", free_stops: "=free_stop_orders_per_cycle", cashiers: "=cashiers_check_fee", card_standard: "=card_replacement_standard_fee", card_rush: "=card_replacement_rush_fee", research: "=account_research_fee_per_hour"}
        Private Client Checking: {wire_domestic: "=domestic_wire_out_fee", wire_international: "=international_wire_out_fee", wire_in: "=incoming_wire_fee", stop_fee: "=stop_payment_fee", free_stops: "=free_stop_orders_per_cycle", cashiers: "=cashiers_check_fee", card_standard: "=card_replacement_standard_fee", card_rush: "=card_replacement_rush_fee", research: "=account_research_fee_per_hour"}
    measures: [checking_msr_cycle_stop_orders]

  - id: checking_evt_stop_payment_orders
    subject: [checking_stop_payment, checking_stop_renewal]
    rule: >-
      A stop payment order covers one paper check, identified by the check number and the exact amount the
      customer states; the payee is recorded as stated. Stop payment orders are available only on a tier
      whose check_writing_available is true. A stop payment can be placed only on a check that has not already
      been paid. A check counts as paid when a checking_debit row with channel check_paid and the same
      check_number exists on the account. A second order on a check that already has an unexpired order is not
      placed; the existing order is renewed instead. An order lapses at the end of stop_payment_duration_months
      calendar months after its order_date: stop_expiry_date is order_date plus stop_payment_duration_months
      calendar months, falling back to the last day of the month when that day does not exist. An unexpired
      order may be renewed on or before its stop_expiry_date. Count calendar months from the order_date of the
      order being renewed; renewal is allowed while the frozen date is on or before that order's
      stop_expiry_date. A renewal is a new row whose related_order_id is the order being renewed and whose
      stop_expiry_date is the renewal's order_date plus stop_payment_duration_months calendar months. A lapsed
      order cannot be renewed; a new order is placed instead if the check is still unpaid. Stops on ACH debits
      and on official checks are outside this policy.
    eligibility:
      - id: checks_offered
        applies_to: [checking_stop_payment, checking_stop_renewal]
        kind: authorization
        condition: "Stop payment orders are available only on a tier whose check_writing_available is true."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
      - id: not_yet_paid
        applies_to: [checking_stop_payment]
        kind: dedup
        condition: "A stop payment can be placed only on a check that has not already been paid."
        evidence_fields: [checking_transactions.checking_account_id, checking_transactions.check_number, checking_transactions.channel]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_transactions.checking_account_id, checking_transactions.check_number]]
          action_bindings: {checking_transactions.checking_account_id: checking_account_id, checking_transactions.check_number: check_number}
        dedup_contract:
          table: checking_transactions
          mode: separate_record
          object_bindings: {checking_account_id: checking_account_id, check_number: check_number}
          duplicate_filters: {event_type: [checking_debit], channel: [check_paid]}
          distinct_fields: []
      - id: renew_before_lapse
        applies_to: [checking_stop_renewal]
        kind: time
        condition: "An unexpired order may be renewed on or before its stop_expiry_date."
        evidence_fields: [checking_service_orders.service_order_id, checking_service_orders.order_date, checking_service_orders.stop_expiry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_service_orders.service_order_id]]
          action_bindings: {checking_service_orders.service_order_id: related_order_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "An unexpired order"
          anchor_source: checking_service_orders.order_date
          relation: not_after
          duration_source: params.stop_payment_duration_months
          unit: calendar_months
          counting_rule: "Count calendar months from the order_date of the order being renewed; renewal is allowed while the frozen date is on or before that order's stop_expiry_date."
          boundary: inclusive
    params:
      stop_payment_duration_months: 6

  - id: checking_evt_electronic_dispute
    subject: [checking_provisional_credit, checking_provisional_reversal, checking_fee_refund]
    rule: >-
      An electronic-transaction dispute is a claim the owner files about a debit with channel debit_card_pos,
      debit_card_international, atm_pcb, atm_other_domestic, atm_international, ach_debit or zelle; paid
      checks, wires and official checks are outside this process. The claim is registered in
      checking_disputes with dispute_status submitted and a notice_date equal to the day the owner gave
      notice. The notice must reach PCB within dispute_notice_window_days calendar days after the disputed item
      posted. Count calendar days with the day after the disputed item's posted_date as day 1; the notice
      qualifies when notice_date is on or before that posted_date plus dispute_notice_window_days. A
      provisional credit is owed when the dispute is still submitted once provisional_credit_business_days
      business days have passed after the owner gave notice. Business days are Monday through Friday excluding
      Federal Reserve holidays; count business days with the first business day after notice_date as day 1;
      the credit is due when the frozen date is on or after the business day that ends the count. When the
      account was opened fewer than new_account_period_days calendar days before notice_date,
      new_account_provisional_credit_business_days replaces provisional_credit_business_days. The provisional
      credit amount is the dispute's claimed_amount, but never more than the disputed item's amount. Only a
      dispute whose dispute_status is submitted can receive a provisional credit. Each dispute receives at
      most one provisional credit. A provisional credit may be reversed only when the dispute's dispute_status
      is resolved_bank_favor or withdrawn, for the full provisional credit amount, with the provisional credit
      row as source_item_id. When the dispute is resolved_customer_favor the provisional credit becomes final
      with no new row, and every overdraft-item fee whose source_item_id is the disputed item is refunded with
      adjustment_reason dispute_final.
    eligibility:
      - id: notice_window
        applies_to: [checking_provisional_credit]
        kind: time
        condition: "The notice must reach PCB within dispute_notice_window_days calendar days after the disputed item posted."
        evidence_fields: [checking_transactions.checking_txn_id, checking_transactions.posted_date, checking_disputes.disputed_txn_id, checking_disputes.notice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_disputes.disputed_txn_id, checking_transactions.checking_txn_id]]
          action_bindings: {checking_disputes.disputed_txn_id: source_item_id, checking_transactions.checking_txn_id: source_item_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the disputed item posted"
          anchor_source: checking_transactions.posted_date
          relation: not_after
          duration_source: variants.dispute_notice_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after the disputed item's posted_date as day 1; the notice qualifies when notice_date is on or before that posted_date plus dispute_notice_window_days."
          boundary: inclusive
      - id: credit_due
        applies_to: [checking_provisional_credit]
        kind: time
        condition: "A provisional credit is owed when the dispute is still submitted once provisional_credit_business_days business days have passed after the owner gave notice."
        evidence_fields: [checking_disputes.checking_dispute_id, checking_disputes.notice_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_disputes.checking_dispute_id]]
          action_bindings: {checking_disputes.checking_dispute_id: checking_dispute_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the owner gave notice"
          anchor_source: checking_disputes.notice_date
          relation: not_before
          duration_source: variants.provisional_credit_business_days
          unit: business_days
          counting_rule: "Business days are Monday through Friday excluding Federal Reserve holidays; count business days with the first business day after notice_date as day 1; the credit is due when the frozen date is on or after the business day that ends the count."
          boundary: inclusive
      - id: submitted_only
        applies_to: [checking_provisional_credit]
        kind: state
        condition: "Only a dispute whose dispute_status is submitted can receive a provisional credit."
        evidence_fields: [checking_disputes.checking_dispute_id, checking_disputes.dispute_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_disputes.checking_dispute_id]]
          action_bindings: {checking_disputes.checking_dispute_id: checking_dispute_id}
        state_contract:
          field: checking_disputes.dispute_status
          allowed: [submitted]
      - id: one_credit
        applies_to: [checking_provisional_credit]
        kind: dedup
        condition: "Each dispute receives at most one provisional credit."
        evidence_fields: [checking_transactions.checking_dispute_id, checking_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_transactions.checking_dispute_id]]
          action_bindings: {checking_transactions.checking_dispute_id: checking_dispute_id}
        dedup_contract:
          table: checking_transactions
          mode: separate_record
          object_bindings: {checking_dispute_id: checking_dispute_id}
          duplicate_filters: {event_type: [checking_provisional_credit]}
          distinct_fields: []
      - id: reversal_needs_bank_favor
        applies_to: [checking_provisional_reversal]
        kind: state
        condition: "A provisional credit may be reversed only when the dispute's dispute_status is resolved_bank_favor or withdrawn, for the full provisional credit amount, with the provisional credit row as source_item_id."
        evidence_fields: [checking_disputes.checking_dispute_id, checking_disputes.dispute_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_disputes.checking_dispute_id]]
          action_bindings: {checking_disputes.checking_dispute_id: checking_dispute_id}
        state_contract:
          field: checking_disputes.dispute_status
          allowed: [resolved_bank_favor, withdrawn]
    params:
      per_tier:
        Access Checking: {credit_days: "=provisional_credit_business_days", new_account_credit_days: "=new_account_provisional_credit_business_days", notice_window: "=dispute_notice_window_days", new_account_period: "=new_account_period_days"}
        Student Checking: {credit_days: "=provisional_credit_business_days", new_account_credit_days: "=new_account_provisional_credit_business_days", notice_window: "=dispute_notice_window_days", new_account_period: "=new_account_period_days"}
        Everyday Checking: {credit_days: "=provisional_credit_business_days", new_account_credit_days: "=new_account_provisional_credit_business_days", notice_window: "=dispute_notice_window_days", new_account_period: "=new_account_period_days"}
        Interest Checking: {credit_days: "=provisional_credit_business_days", new_account_credit_days: "=new_account_provisional_credit_business_days", notice_window: "=dispute_notice_window_days", new_account_period: "=new_account_period_days"}
        Premier Checking: {credit_days: "=provisional_credit_business_days", new_account_credit_days: "=new_account_provisional_credit_business_days", notice_window: "=dispute_notice_window_days", new_account_period: "=new_account_period_days"}
        Private Client Checking: {credit_days: "=provisional_credit_business_days", new_account_credit_days: "=new_account_provisional_credit_business_days", notice_window: "=dispute_notice_window_days", new_account_period: "=new_account_period_days"}

  - id: checking_evt_dormancy
    subject: [checking_go_dormant, checking_reactivate, checking_fee]
    rule: >-
      Customer-initiated activity means a deposit or debit the owner initiates through branch, ATM, debit card,
      paid check, mobile deposit, online transfer, Zelle, wire or an owner-authorized ACH debit; interest
      credits, fees, fee refunds, direct deposits and other ACH credits are not customer-initiated.
      last_customer_activity_date records the posted date of the latest customer-initiated activity. An active
      account becomes dormant once dormancy_inactivity_months calendar months have passed after the last
      customer-initiated activity. Count calendar months from last_customer_activity_date; the account is due
      for dormancy when the frozen date is on or after last_customer_activity_date plus
      dormancy_inactivity_months calendar months, falling back to the last day of the month when that day does
      not exist. While dormant, the tier's dormant_account_fee is assessed at each statement cycle close as a
      checking_fee row with fee_code dormant_account, reduced so that it never takes the ledger balance below
      zero and not written when the balance is already zero or below. A dormant account is reactivated only
      when the owner's identity has been verified in the current contact and the owner initiates a
      transaction; the reactivation date becomes the new last_customer_activity_date. The identity of the owner
      must be verified before a dormant account is reactivated. Dormancy never stops interest crediting or the
      posting of incoming credits.
    eligibility:
      - id: inactivity_elapsed
        applies_to: [checking_go_dormant]
        kind: time
        condition: "An active account becomes dormant once dormancy_inactivity_months calendar months have passed after the last customer-initiated activity."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.last_customer_activity_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the last customer-initiated activity"
          anchor_source: checking_accounts.last_customer_activity_date
          relation: not_before
          duration_source: variants.dormancy_inactivity_months
          unit: calendar_months
          counting_rule: "Count calendar months from last_customer_activity_date; the account is due for dormancy when the frozen date is on or after last_customer_activity_date plus dormancy_inactivity_months calendar months, falling back to the last day of the month when that day does not exist."
          boundary: inclusive
      - id: verified_owner
        applies_to: [checking_reactivate]
        kind: authorization
        condition: "The identity of the owner must be verified before a dormant account is reactivated."
        evidence_fields: [verification_log.customer_id, verification_log.verified]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[verification_log.customer_id]]
          action_bindings: {verification_log.customer_id: customer_id}
    params:
      per_tier:
        Access Checking: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Student Checking: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Everyday Checking: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Interest Checking: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Premier Checking: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Private Client Checking: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}

  - id: checking_evt_negative_balance
    subject: [checking_restrict, checking_restore, checking_charge_off, checking_chargeoff_writeoff]
    rule: >-
      A negative episode is measured from negative_since_date, the date the ledger balance first went
      negative. An active account is restricted once negative_balance_restrict_days calendar days have passed
      after the ledger balance first went negative. Count calendar days with the day after
      negative_since_date as day 1; restriction is due when the frozen date is on or after negative_since_date
      plus negative_balance_restrict_days. While restricted, every debit that would keep or take the balance
      below zero is returned or declined, and no overdraft fees accrue. A restricted account returns to active
      as soon as its end-of-day ledger balance is zero or above. A restricted account is charged off once
      negative_balance_chargeoff_days calendar days have passed after the ledger balance first went negative.
      Count calendar days with the day after negative_since_date as day 1; charge-off is due when the frozen
      date is on or after negative_since_date plus negative_balance_chargeoff_days. The charge-off writes one checking_chargeoff_writeoff row equal to the magnitude of the negative ledger
      balance, leaving the ledger balance at zero; the deficit passes to recovery outside this charter.
      Payments a customer offers on a charged-off deficit are outside this policy.
    eligibility:
      - id: restrict_due
        applies_to: [checking_restrict]
        kind: time
        condition: "An active account is restricted once negative_balance_restrict_days calendar days have passed after the ledger balance first went negative."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.negative_since_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the ledger balance first went negative"
          anchor_source: checking_accounts.negative_since_date
          relation: not_before
          duration_source: variants.negative_balance_restrict_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after negative_since_date as day 1; restriction is due when the frozen date is on or after negative_since_date plus negative_balance_restrict_days."
          boundary: inclusive
      - id: chargeoff_due
        applies_to: [checking_charge_off]
        kind: time
        condition: "A restricted account is charged off once negative_balance_chargeoff_days calendar days have passed after the ledger balance first went negative."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.negative_since_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the ledger balance first went negative"
          anchor_source: checking_accounts.negative_since_date
          relation: not_before
          duration_source: variants.negative_balance_chargeoff_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after negative_since_date as day 1; charge-off is due when the frozen date is on or after negative_since_date plus negative_balance_chargeoff_days."
          boundary: inclusive
    params:
      per_tier:
        Access Checking: {restrict_days: "=negative_balance_restrict_days", chargeoff_days: "=negative_balance_chargeoff_days"}
        Student Checking: {restrict_days: "=negative_balance_restrict_days", chargeoff_days: "=negative_balance_chargeoff_days"}
        Everyday Checking: {restrict_days: "=negative_balance_restrict_days", chargeoff_days: "=negative_balance_chargeoff_days"}
        Interest Checking: {restrict_days: "=negative_balance_restrict_days", chargeoff_days: "=negative_balance_chargeoff_days"}
        Premier Checking: {restrict_days: "=negative_balance_restrict_days", chargeoff_days: "=negative_balance_chargeoff_days"}
        Private Client Checking: {restrict_days: "=negative_balance_restrict_days", chargeoff_days: "=negative_balance_chargeoff_days"}

  - id: checking_evt_closure
    subject: [checking_close, checking_fee]
    rule: >-
      Closing an account is the owner's own decision. The agent registers a checking_closure_requests row in
      pending_customer_confirmation status naming the disbursement method, and the account closes only after
      the owner confirms it. The ledger balance must be zero or above before an account can be closed; a
      negative balance must first be repaid. An account with a dispute in submitted or provisional_credited
      status cannot be closed until the dispute is resolved. When the closure date falls within the early
      closure window, the tier's early_closure_fee is assessed as a checking_fee row with fee_code early_closure
      before the balance is disbursed. The early closure fee applies when the account is closed within
      early_closure_window_days calendar days after the account was opened. Count calendar days with the day
      after opened_date as day 1; the fee applies when the closure date is on or before opened_date plus
      early_closure_window_days. The fee is reduced so it never takes the ledger balance below zero. For an
      interest-bearing tier, interest earned through the day before closure is credited before disbursement.
      The remaining ledger balance is then disbursed in full by internal transfer to the destination PCB
      account or by official check mailed to the address on file, without a cashier's check fee, and the
      account closes with a zero balance and no overdraft link. A tier fee of 0.00 writes no row.
    eligibility:
      - id: balance_not_negative
        applies_to: [checking_close]
        kind: authorization
        condition: "The ledger balance must be zero or above before an account can be closed; a negative balance must first be repaid."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.ledger_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
      - id: no_open_dispute
        applies_to: [checking_close]
        kind: authorization
        condition: "An account with a dispute in submitted or provisional_credited status cannot be closed until the dispute is resolved."
        evidence_fields: [checking_disputes.checking_account_id, checking_disputes.dispute_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_disputes.checking_account_id]]
          action_bindings: {checking_disputes.checking_account_id: checking_account_id}
      - id: early_window
        applies_to: [checking_fee]
        kind: time
        condition: "The early closure fee applies when the account is closed within early_closure_window_days calendar days after the account was opened."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account was opened"
          anchor_source: checking_accounts.opened_date
          relation: not_after
          duration_source: variants.early_closure_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after opened_date as day 1; the fee applies when the closure date is on or before opened_date plus early_closure_window_days."
          boundary: inclusive
    params:
      per_tier:
        Access Checking: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Student Checking: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Everyday Checking: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Interest Checking: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Premier Checking: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Private Client Checking: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}

  - id: checking_product_change
    subject: [checking_change_product]
    rule: >-
      A tier conversion keeps the account number, balance and history and changes only variant_name. The
      account must be active when the conversion is recorded. The customer must meet the target tier's entry
      gate on the conversion date, except the opening deposit, and the conversion must not breach
      checking_agg_multi_holding for the target tier. No fee is charged for a conversion, and it does not
      restart the early closure window. At most one customer-requested conversion is recorded per account per
      statement cycle. Automatic conversions are made by the bank at the first statement cycle close on or
      after the owner reaches the tier's automatic_conversion_age, into automatic_conversion_target. A Private
      Client Checking account whose relationship balance at cycle close has been below
      entry_relationship_balance_min for downgrade_consecutive_cycles consecutive cycles is converted by the
      bank to Premier Checking at the next cycle close. Fees for a cycle are judged at the tier in force at that
      cycle's close.
    eligibility:
      - id: must_be_active
        applies_to: [checking_change_product]
        kind: state
        condition: "The account must be active when the conversion is recorded."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: checking_account_id}
        state_contract:
          field: checking_accounts.status
          allowed: [active]
      - id: target_entry_gate
        applies_to: [checking_change_product]
        kind: authorization
        condition: "The customer must meet the target tier's entry gate on the conversion date, except the opening deposit, and the conversion must not breach checking_agg_multi_holding for the target tier."
        evidence_fields: [customers.customer_id, customers.date_of_birth, checking_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
    params:
      downgrade_consecutive_cycles: 3
      per_tier:
        Access Checking: {conversion_age: "=automatic_conversion_age", conversion_target: "=automatic_conversion_target"}
        Student Checking: {conversion_age: "=automatic_conversion_age", conversion_target: "=automatic_conversion_target"}
        Everyday Checking: {conversion_age: "=automatic_conversion_age", conversion_target: "=automatic_conversion_target"}
        Interest Checking: {conversion_age: "=automatic_conversion_age", conversion_target: "=automatic_conversion_target"}
        Premier Checking: {conversion_age: "=automatic_conversion_age", conversion_target: "=automatic_conversion_target"}
        Private Client Checking: {conversion_age: "=automatic_conversion_age", conversion_target: "=automatic_conversion_target"}

  - id: checking_evt_interest
    subject: [checking_interest_credit]
    rule: >-
      Only tiers with interest_bearing true earn interest. Interest accrues daily on each calendar day's
      end-of-day ledger balance when that balance is above zero, taken from the daily series
      checking_msr_cycle_end_of_day_balances; a day with a zero or negative balance earns nothing. Each day's balance earns the APY of the highest band floor in the tier's
      interest_apy_ladder that the balance reaches, applied to the whole balance, divided by
      interest_day_count_basis. Daily amounts are summed unrounded over the statement cycle and the total is
      rounded half-up to the cent and credited on the cycle closing date as one checking_interest_credit row.
      A total that rounds to 0.00 writes no row. The tier and ladder used for each day are those in force on
      that day. Dormant and restricted accounts still earn interest; charged-off and closed accounts do not.
    eligibility: []
    params:
      interest_day_count_basis: 365
      per_tier:
        Access Checking: {bearing: "=interest_bearing", ladder: "=interest_apy_ladder"}
        Student Checking: {bearing: "=interest_bearing", ladder: "=interest_apy_ladder"}
        Everyday Checking: {bearing: "=interest_bearing", ladder: "=interest_apy_ladder"}
        Interest Checking: {bearing: "=interest_bearing", ladder: "=interest_apy_ladder"}
        Premier Checking: {bearing: "=interest_bearing", ladder: "=interest_apy_ladder"}
        Private Client Checking: {bearing: "=interest_bearing", ladder: "=interest_apy_ladder"}
    measures: [checking_msr_cycle_end_of_day_balances]

  - id: checking_evt_deposit_and_debit_limits
    subject: [checking_deposit, checking_debit]
    rule: >-
      A deposit posts to the ledger on the business day its funds become available, so the ledger balance is
      also the available balance. Cash, direct deposits, ACH credits, incoming wires, Zelle receipts and
      internal transfers post on the business day received. A deposited check posts on the next business day,
      except that while the account has been open fewer than new_account_period_days calendar days a
      deposited check posts on the new_account_check_hold_business_days business day after deposit. A mobile
      deposit is accepted only when it keeps the day's mobile deposits within mobile_deposit_daily_limit and
      checking_msr_mobile_deposits_30d within mobile_deposit_30day_limit; an over-limit mobile deposit is
      rejected and never posts. Debits are authorized only within the tier's daily limits, counted per calendar
      day in Eastern Time: ATM cash within atm_daily_withdrawal_limit, debit card purchases within
      debit_card_daily_purchase_limit, and Zelle payments within zelle_daily_send_limit and, measured by
      checking_msr_zelle_sent_30d, within zelle_30day_send_limit. An authorization beyond a limit is declined
      and never posts. Paper checks can be paid only on a tier whose check_writing_available is true. Requests
      to raise a limit temporarily are outside this policy. Deposits are accepted on restricted and dormant
      accounts but not on closed or charged-off accounts.
    eligibility: []
    params:
      per_tier:
        Access Checking: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", atm_day: "=atm_daily_withdrawal_limit", pos_day: "=debit_card_daily_purchase_limit", zelle_day: "=zelle_daily_send_limit", zelle_30d: "=zelle_30day_send_limit", hold_days: "=new_account_check_hold_business_days"}
        Student Checking: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", atm_day: "=atm_daily_withdrawal_limit", pos_day: "=debit_card_daily_purchase_limit", zelle_day: "=zelle_daily_send_limit", zelle_30d: "=zelle_30day_send_limit", hold_days: "=new_account_check_hold_business_days"}
        Everyday Checking: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", atm_day: "=atm_daily_withdrawal_limit", pos_day: "=debit_card_daily_purchase_limit", zelle_day: "=zelle_daily_send_limit", zelle_30d: "=zelle_30day_send_limit", hold_days: "=new_account_check_hold_business_days"}
        Interest Checking: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", atm_day: "=atm_daily_withdrawal_limit", pos_day: "=debit_card_daily_purchase_limit", zelle_day: "=zelle_daily_send_limit", zelle_30d: "=zelle_30day_send_limit", hold_days: "=new_account_check_hold_business_days"}
        Premier Checking: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", atm_day: "=atm_daily_withdrawal_limit", pos_day: "=debit_card_daily_purchase_limit", zelle_day: "=zelle_daily_send_limit", zelle_30d: "=zelle_30day_send_limit", hold_days: "=new_account_check_hold_business_days"}
        Private Client Checking: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", atm_day: "=atm_daily_withdrawal_limit", pos_day: "=debit_card_daily_purchase_limit", zelle_day: "=zelle_daily_send_limit", zelle_30d: "=zelle_30day_send_limit", hold_days: "=new_account_check_hold_business_days"}
    measures: [checking_msr_mobile_deposits_30d, checking_msr_zelle_sent_30d]

extended_policies:
  - id: checking_ext_transfer_fee_source_error_refund
    base_policy_refs: [checking_evt_fee_refund, checking_evt_electronic_dispute, checking_evt_overdraft_protection_transfer]
    overwrite: []
    trigger: state_due
    subject: [checking_fee_refund]
    computes: amount
    target_tool: refund_transfer_fee_error_033d9cbf
    rule: >-
      This policy reviews the account's most recently posted overdraft transfer fee; any earlier overdraft transfer
      fee is reviewed under checking_evt_fee_refund. An overdraft protection transfer may be drawn only from a
      savings account whose savings tier has overdraft_protection_source_eligible true in the savings charter. The
      transfer that caused the fee is the entry named as the fee's source item, and the source savings account of
      that transfer is the account named as that transfer's counterparty; its eligibility is read from that savings
      account's tier in the savings charter. The fee is a bank error when either of two conditions holds: that
      source savings tier has overdraft_protection_source_eligible false, or the fee was charged at an amount other
      than the checking tier's overdraft_transfer_fee. When the source savings account is not on the customer's
      record, the eligibility condition cannot be established and only the amount condition is judged. A fee that
      already has a refund entry is never refunded again. When the fee is a bank error and has no refund yet, it is
      refunded in full, never in part, at that fee's own amount, with adjustment_reason bank_error; otherwise this
      policy refunds nothing, and any goodwill request is decided under the courtesy gates of
      checking_evt_fee_refund. Fee amounts carry 2 decimal places, so the refund needs no rounding.
    prerequisite: []
    cross_category:
      - category: savings
        as: branch
        reads: [overdraft_protection_source_eligible]
        note: The eligibility parameter of the savings tier that funded the fee's own transfer decides whether the fee is a bank error and so whether it is refunded in full or not at all.
    compute:
      - fee_id: "LATEST('checking_transactions', 'checking_txn_id', date_field='posted_date', event_type='checking_fee', fee_code='overdraft_transfer')"
      - fee_amount: "SUM('checking_transactions', 'amount', checking_txn_id=fee_id)"
      - transfer_id: "LATEST('checking_transactions', 'source_item_id', date_field='posted_date', checking_txn_id=fee_id)"
      - source_id: "LATEST('checking_transactions', 'counterparty_account_id', date_field='posted_date', checking_txn_id=transfer_id)"
      - source_eligible: "CPARAM('savings', 'overdraft_protection_source_eligible', savings_account_id=source_id)"
      - wrong_amount: "1 if (fee_amount > 0 and fee_amount != P('overdraft_transfer_fee')) else 0"
      - already_refunded: "COUNT('checking_transactions', event_type='checking_fee_refund', source_item_id=fee_id)"
      - result: "RND(fee_amount if (already_refunded == 0 and (source_eligible == False or wrong_amount == 1)) else 0, 2)"
    compute_basis:
      fee_id: "This policy reviews the account's most recently posted overdraft transfer fee; any earlier overdraft transfer fee is reviewed under checking_evt_fee_refund."
      fee_amount: "it is refunded in full, never in part, at that fee's own amount, with adjustment_reason bank_error"
      transfer_id: "The transfer that caused the fee is the entry named as the fee's source item"
      source_id: "the source savings account of that transfer is the account named as that transfer's counterparty"
      source_eligible: "The fee is a bank error when either of two conditions holds: that source savings tier has overdraft_protection_source_eligible false, or the fee was charged at an amount other than the checking tier's overdraft_transfer_fee."
      wrong_amount: "The fee is a bank error when either of two conditions holds: that source savings tier has overdraft_protection_source_eligible false, or the fee was charged at an amount other than the checking tier's overdraft_transfer_fee."
      already_refunded: "A fee that already has a refund entry is never refunded again."
      result: "When the fee is a bank error and has no refund yet, it is refunded in full, never in part, at that fee's own amount, with adjustment_reason bank_error; otherwise this policy refunds nothing, and any goodwill request is decided under the courtesy gates of checking_evt_fee_refund."
    inputs:
      history:
        - {table: checking_transactions, aggregate: latest, field: checking_txn_id, filters: {event_type: checking_fee, fee_code: overdraft_transfer}}
        - {table: checking_transactions, aggregate: sum, field: amount, filters: {checking_txn_id: fee_id}}
        - {table: checking_transactions, aggregate: count, field: checking_txn_id, filters: {event_type: checking_fee_refund, source_item_id: fee_id}}
      cross_category: [savings]
  - id: checking_ext_autopay_dispute_provisional_credit
    base_policy_refs: [checking_evt_electronic_dispute]
    overwrite:
      - base_policy: checking_evt_electronic_dispute
        superseded_clause: "The provisional credit amount is the dispute's claimed_amount, but never more than the disputed item's amount."
        replaced_by: "On an account with two or more disputes in submitted status, the provisional credit amount of each dispute stays the dispute's claimed_amount, but never more than the disputed item's amount. On an account with exactly one submitted dispute, the provisional credit amount is the smallest of the figures that apply: the dispute's claimed_amount, the disputed item's amount, and, only when the disputed item is a debit whose counterparty is the owner's PCB auto loan with autopay enrolled from this checking account, the part of that debit above the loan's scheduled monthly_payment."
    trigger: state_due
    subject: [checking_provisional_credit]
    computes: amount
    target_tool: post_dispute_provisional_credit_5453b90d
    rule: >-
      This policy decides the provisional credit on an account that has exactly one electronic-transaction dispute in
      submitted status; when two or more disputes on the account are submitted at once, the provisional credit on
      each of them is decided under checking_evt_electronic_dispute alone, and this policy posts nothing. The dispute
      under review is that single submitted dispute, and its disputed item is the ledger entry that dispute names as
      its disputed transaction. Whether and when the credit is owed is inherited unchanged from
      checking_evt_electronic_dispute: it is posted as one credit entry once the dispute is still submitted after its
      provisional credit deadline, and never before. A payment PCB collects from this checking account for the
      owner's own PCB auto loan under an enrolled autopay instruction is a transfer between the owner's PCB accounts,
      so the debit names that loan as its counterparty. On an account with two or more disputes in submitted status, the provisional credit amount of each dispute stays the dispute's claimed_amount, but never more than the disputed item's amount. On an account with exactly one submitted dispute, the provisional credit amount is the smallest of the figures that apply: the dispute's claimed_amount, the disputed item's amount, and, only when the disputed item is a
      debit whose counterparty is the owner's PCB auto loan with autopay enrolled from this checking account, the part
      of that debit above the loan's scheduled monthly_payment. That part is the disputed item's amount minus the
      loan's monthly_payment, never less than zero. When the disputed item is any other debit, the third figure does
      not apply. Amounts carry 2 decimal places, so the minimum needs no rounding.
    prerequisite: []
    cross_category:
      - category: auto
        as: branch
        reads: [monthly_payment, autopay_enrolled, autopay_source_account_id]
        note: When the disputed item's counterparty is the owner's auto loan paid by autopay from this checking account, that loan's scheduled monthly_payment caps the provisional credit at the part of the debit above it.
    compute:
      - submitted_count: "COUNT('checking_disputes', dispute_status='submitted')"
      - dispute_id: "LATEST('checking_disputes', 'checking_dispute_id', date_field='notice_date', dispute_status='submitted')"
      - claimed: "SUM('checking_disputes', 'claimed_amount', checking_dispute_id=dispute_id)"
      - item_id: "LATEST('checking_disputes', 'disputed_txn_id', date_field='notice_date', checking_dispute_id=dispute_id)"
      - item: "SUM('checking_transactions', 'amount', checking_txn_id=item_id)"
      - item_counterparty: "LATEST('checking_transactions', 'counterparty_account_id', date_field='posted_date', checking_txn_id=item_id)"
      - scheduled: "CFIELD('auto', 'monthly_payment', auto_loan_id=item_counterparty, autopay_enrolled=True, autopay_source_account_id=HID) or 0"
      - cap: "MX(0, item - scheduled) if scheduled > 0 else item"
      - claim_part: "item if claimed > item else claimed"
      - result: "RND(MN(claim_part, cap) if submitted_count == 1 else 0, 2)"
    compute_basis:
      submitted_count: "This policy decides the provisional credit on an account that has exactly one electronic-transaction dispute in submitted status; when two or more disputes on the account are submitted at once, the provisional credit on each of them is decided under checking_evt_electronic_dispute alone, and this policy posts nothing."
      dispute_id: "The dispute under review is that single submitted dispute"
      claimed: "the dispute's claimed_amount"
      item_id: "its disputed item is the ledger entry that dispute names as its disputed transaction."
      item: "the disputed item's amount"
      item_counterparty: "only when the disputed item is a debit whose counterparty is the owner's PCB auto loan with autopay enrolled from this checking account"
      scheduled: "only when the disputed item is a debit whose counterparty is the owner's PCB auto loan with autopay enrolled from this checking account, the part of that debit above the loan's scheduled monthly_payment."
      cap: "That part is the disputed item's amount minus the loan's monthly_payment, never less than zero. When the disputed item is any other debit, the third figure does not apply."
      claim_part: "On an account with exactly one submitted dispute, the provisional credit amount is the smallest of the figures that apply: the dispute's claimed_amount, the disputed item's amount"
      result: "On an account with exactly one submitted dispute, the provisional credit amount is the smallest of the figures that apply: the dispute's claimed_amount, the disputed item's amount, and, only when the disputed item is a debit whose counterparty is the owner's PCB auto loan with autopay enrolled from this checking account, the part of that debit above the loan's scheduled monthly_payment."
    inputs:
      history:
        - {table: checking_disputes, aggregate: count, field: checking_dispute_id, filters: {dispute_status: submitted}}
        - {table: checking_disputes, aggregate: latest, field: checking_dispute_id, filters: {dispute_status: submitted}}
        - {table: checking_disputes, aggregate: sum, field: claimed_amount, filters: {checking_dispute_id: dispute_id}}
        - {table: checking_transactions, aggregate: sum, field: amount, filters: {checking_txn_id: item_id}}
      cross_category: [auto]
  - id: checking_ext_cycle_close_relationship_refund
    base_policy_refs: [checking_evt_fee_refund, checking_evt_electronic_dispute, checking_evt_maintenance_and_statement_fees, checking_agg_relationship_balance]
    overwrite:
      - base_policy: checking_agg_relationship_balance
        superseded_clause: "Every checking rule that speaks of a relationship balance uses one basis, the measure checking_msr_relationship_balance: the customer's deposit balances at PCB summed across checking, savings and certificate holdings in the customer's own name, taken at close of business on the measurement date."
        replaced_by: "Outside the determinations of checking_ext_cycle_close_relationship_refund and checking_ext_private_client_entry_conversion, every checking rule that speaks of a relationship balance keeps the one basis, the measure checking_msr_relationship_balance: the customer's deposit balances at PCB summed across checking, savings and certificate holdings in the customer's own name, taken at close of business on the measurement date. For this determination the relationship balance is the sum of this checking account's ledger balance, counted as zero when negative, the current_balance of the owner's savings account in each of the statuses applied, active and dormant, the principal_balance of the owner's certificate in each of the statuses applied, active and grace_period, and, only when the account's tier has relationship_balance_includes_mortgage true, the principal_balance of the owner's mortgage loan in each of the statuses active, delinquent and forbearance, otherwise nothing for the mortgage; the owner's other checking accounts are not counted, and where the owner holds more than one holding of one category in the same status only the first on the customer's record is counted."
    trigger: on_request
    subject: [checking_fee_refund]
    computes: amount
    target_tool: refund_same_day_maintenance_fee_e9518b99
    rule: >-
      When an owner questions a monthly maintenance fee dated the current business day, the cycle closing date, the
      relationship waiver of the tier is judged on the relationship balance at close of business on that date. The
      relationship balance for this determination is taken at close of business on the cycle closing date, after
      every posting made to the account during that business day, and before the refund of the maintenance fee
      itself posts. Before the relationship waiver is judged for a maintenance fee dated the current business day,
      two kinds of credit the bank already owes on the account are posted first, because pending credits that have
      not posted do not count: the refund of every overdraft transfer fee charged in error, the most recent one as
      checking_ext_transfer_fee_source_error_refund finds it and any earlier one under checking_evt_fee_refund, and
      the provisional credit that checking_ext_autopay_dispute_provisional_credit finds owed; the fee refunds are
      posted in the order the fees posted, and all of them before the dispute credit. Outside the determinations of checking_ext_cycle_close_relationship_refund and checking_ext_private_client_entry_conversion, every checking rule that speaks of a relationship balance keeps the one basis, the measure checking_msr_relationship_balance: the customer's deposit balances at PCB summed across checking, savings and certificate holdings in the customer's own name, taken at close of business on the measurement date. For this determination the relationship
      balance is the sum of this checking account's ledger balance, counted as zero when negative, the
      current_balance of the owner's savings account in each of the statuses applied, active and dormant, the
      principal_balance of the owner's certificate in each of the statuses applied, active and grace_period, and,
      only when the account's tier has relationship_balance_includes_mortgage true, the principal_balance of the
      owner's mortgage loan in each of the statuses active, delinquent and forbearance, otherwise nothing for the
      mortgage; the owner's other checking accounts are not counted, and where the owner holds more than one holding
      of one category in the same status only the first on the customer's record is counted. The fee in question is
      the monthly maintenance fee posted on the account on the current business day. A fee that already has a refund
      entry is never refunded again. Two further waivers that the ledger alone decides are judged in the same way
      when the tier offers them: the total of ACH direct deposits posted in the cycle at or above
      waiver_direct_deposit_total, and the number of debit card purchases, channels debit_card_pos and
      debit_card_international, posted in the cycle at or above waiver_debit_purchase_count; the cycle runs from the
      day after the previous cycle closing date through the current business day, and a waiver whose parameter is
      not_offered is not used. When the relationship balance is at or above the tier's waiver_relationship_balance,
      or either ledger waiver is met, and the fee has no refund yet, the fee was assessed although a waiver was met
      and is refunded in full, never in part, at its own amount, with adjustment_reason bank_error; otherwise this
      policy refunds nothing, and the remaining waivers of the tier and any courtesy request are decided under
      checking_evt_maintenance_and_statement_fees and checking_evt_fee_refund. Fee amounts carry 2 decimal places, so
      the refund needs no rounding.
    prerequisite:
      - problem: checking_ext_transfer_fee_source_error_refund
        kind: value_input
        gate: own_part
        condition: "Every overdraft transfer fee charged in error on the account has been refunded before the relationship waiver on the same-day maintenance fee is judged."
        policy_source: "the refund of every overdraft transfer fee charged in error, the most recent one as checking_ext_transfer_fee_source_error_refund finds it and any earlier one under checking_evt_fee_refund"
        resolved_by: refund_transfer_fee_error_033d9cbf
        effect: "Each refunded transfer fee raises the account's ledger balance, so own_part and the relationship balance rise by the refunded amount before the waiver comparison."
      - problem: checking_ext_autopay_dispute_provisional_credit
        kind: value_input
        gate: own_part
        condition: "The provisional credit that has fallen due on the account's submitted dispute has been posted before the relationship waiver on the same-day maintenance fee is judged."
        policy_source: "the provisional credit that checking_ext_autopay_dispute_provisional_credit finds owed"
        resolved_by: post_dispute_provisional_credit_5453b90d
        effect: "The posted provisional credit raises the account's ledger balance, so own_part and the relationship balance rise by the credited amount before the waiver comparison."
    cross_category:
      - category: savings
        as: branch
        reads: [current_balance, status]
        note: The owner's savings balances in the counted statuses are a part of the relationship balance compared with the waiver threshold.
      - category: cd
        as: branch
        reads: [principal_balance, status]
        note: The owner's certificate principal in the counted statuses is a part of the relationship balance compared with the waiver threshold.
      - category: mortgage
        as: branch
        reads: [principal_balance, status]
        note: Mortgage principal in the counted statuses enters the relationship balance only for tiers whose relationship_balance_includes_mortgage is true.
    compute:
      - fee_id: "LATEST('checking_transactions', 'checking_txn_id', date_field='posted_date', event_type='checking_fee', fee_code='monthly_maintenance', posted_date=NOW)"
      - fee: "SUM('checking_transactions', 'amount', checking_txn_id=fee_id)"
      - already_refunded: "COUNT('checking_transactions', event_type='checking_fee_refund', source_item_id=fee_id)"
      - own_part: "MX(0, F('ledger_balance'))"
      - savings_part: "(CFIELD('savings', 'current_balance', status='applied') or 0) + (CFIELD('savings', 'current_balance', status='active') or 0) + (CFIELD('savings', 'current_balance', status='dormant') or 0)"
      - cd_part: "(CFIELD('cd', 'principal_balance', status='applied') or 0) + (CFIELD('cd', 'principal_balance', status='active') or 0) + (CFIELD('cd', 'principal_balance', status='grace_period') or 0)"
      - mortgage_counts: "P('relationship_balance_includes_mortgage')"
      - mortgage_part: "((CFIELD('mortgage', 'principal_balance', status='active') or 0) + (CFIELD('mortgage', 'principal_balance', status='delinquent') or 0) + (CFIELD('mortgage', 'principal_balance', status='forbearance') or 0)) if mortgage_counts else 0"
      - relationship: "own_part + savings_part + cd_part + mortgage_part"
      - threshold: "P('waiver_relationship_balance')"
      - deposit_min: "P('waiver_direct_deposit_total')"
      - deposit_total: "SUM('checking_transactions', 'amount', within_months=1, date_field='posted_date', event_type='checking_deposit', channel='ach_direct_deposit')"
      - deposit_met: "1 if (deposit_min != 'not_offered' and deposit_total >= deposit_min) else 0"
      - purchase_min: "P('waiver_debit_purchase_count')"
      - purchase_count: "COUNT('checking_transactions', within_months=1, date_field='posted_date', event_type='checking_debit', channel='debit_card_pos') + COUNT('checking_transactions', within_months=1, date_field='posted_date', event_type='checking_debit', channel='debit_card_international')"
      - purchase_met: "1 if (purchase_min != 'not_offered' and purchase_count >= purchase_min) else 0"
      - result: "RND(fee if ((relationship >= threshold or deposit_met == 1 or purchase_met == 1) and already_refunded == 0) else 0, 2)"
    compute_basis:
      fee_id: "The fee in question is the monthly maintenance fee posted on the account on the current business day."
      fee: "is refunded in full, never in part, at its own amount, with adjustment_reason bank_error"
      already_refunded: "A fee that already has a refund entry is never refunded again."
      own_part: "this checking account's ledger balance, counted as zero when negative"
      savings_part: "the current_balance of the owner's savings account in each of the statuses applied, active and dormant"
      cd_part: "the principal_balance of the owner's certificate in each of the statuses applied, active and grace_period"
      mortgage_counts: "only when the account's tier has relationship_balance_includes_mortgage true"
      mortgage_part: "the principal_balance of the owner's mortgage loan in each of the statuses active, delinquent and forbearance, otherwise nothing for the mortgage"
      relationship: "The relationship balance for this determination is taken at close of business on the cycle closing date, after every posting made to the account during that business day, and before the refund of the maintenance fee itself posts."
      threshold: "When the relationship balance is at or above the tier's waiver_relationship_balance"
      deposit_min: "a waiver whose parameter is not_offered is not used."
      deposit_total: "the total of ACH direct deposits posted in the cycle at or above waiver_direct_deposit_total"
      deposit_met: "the total of ACH direct deposits posted in the cycle at or above waiver_direct_deposit_total"
      purchase_min: "a waiver whose parameter is not_offered is not used."
      purchase_count: "the number of debit card purchases, channels debit_card_pos and debit_card_international, posted in the cycle at or above waiver_debit_purchase_count; the cycle runs from the day after the previous cycle closing date through the current business day"
      purchase_met: "the number of debit card purchases, channels debit_card_pos and debit_card_international, posted in the cycle at or above waiver_debit_purchase_count; the cycle runs from the day after the previous cycle closing date through the current business day"
      result: "or either ledger waiver is met, and the fee has no refund yet, the fee was assessed although a waiver was met and is refunded in full, never in part, at its own amount, with adjustment_reason bank_error; otherwise this policy refunds nothing"
    inputs:
      history:
        - {table: checking_transactions, aggregate: latest, field: checking_txn_id, filters: {event_type: checking_fee, fee_code: monthly_maintenance, posted_date: NOW}}
        - {table: checking_transactions, aggregate: count, field: checking_txn_id, filters: {event_type: checking_fee_refund, source_item_id: fee_id}}
        - {table: checking_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: checking_deposit, channel: ach_direct_deposit}}
        - {table: checking_transactions, aggregate: count, field: checking_txn_id, within_months: 1, filters: {event_type: checking_debit, channel: debit_card_pos}}
      cross_category: [savings, cd, mortgage]
  - id: checking_ext_uncovered_item_fee_refund
    base_policy_refs: [checking_evt_fee_refund, checking_evt_electronic_dispute, checking_evt_overdraft_protection_transfer, checking_evt_overdraft_and_returned_item_fees]
    overwrite:
      - base_policy: checking_evt_overdraft_protection_transfer
        superseded_clause: "the transfer is made only if the savings current_balance at that moment covers the whole shortfall, and a partial transfer is never made."
        replaced_by: "Outside the refund decisions of checking_ext_uncovered_item_fee_refund and checking_ext_uncovered_episode_extended_fee_refund, an overdraft protection transfer is made only if the savings current_balance at that moment covers the whole shortfall, and a partial transfer is never made. For a refund decision under this policy, coverage is judged on the savings account the checking account names as its overdraft link when the decision is made, by comparing that savings account's current_balance at the time of the decision with the whole amount of the item, because the savings balance at the moment the item posted and the shortfall it left are not carried on the checking record."
    trigger: state_due
    subject: [checking_fee_refund]
    computes: amount
    target_tool: refund_uncovered_overdraft_fee_6b0f4e50
    rule: >-
      Under checking_evt_overdraft_and_returned_item_fees an overdraft protection transfer is attempted before any
      item is paid into overdraft, and a covered item is not an overdraft and carries no overdraft-item fee. This
      policy reviews the account's most recently posted overdraft item fee; any earlier overdraft item fee is
      reviewed under checking_evt_fee_refund. The item that carried the fee is the entry named as the fee's source
      item. Outside the refund decisions of checking_ext_uncovered_item_fee_refund and checking_ext_uncovered_episode_extended_fee_refund, an overdraft protection transfer is made only if the savings current_balance at that moment covers the whole shortfall, and a partial transfer is never made. For a refund decision under this policy, coverage is judged on the savings account the checking account
      names as its overdraft link when the decision is made, by comparing that savings account's current_balance at
      the time of the decision with the whole amount of the item, because the savings balance at the moment the item
      posted and the shortfall it left are not carried on the checking record. The fee is a bank error when that
      linked savings tier has overdraft_protection_source_eligible true and its current_balance is at least the
      item's amount, since a transfer would have covered the item; it is also a bank error when the item's amount is
      overdraft_item_de_minimis or less. A fee that already has a refund entry is never refunded again. When the fee
      is a bank error and has no refund yet, it is refunded in full, never in part, at that fee's own amount, with
      adjustment_reason bank_error; otherwise this policy refunds nothing, and a goodwill request is decided under
      the courtesy gates of checking_evt_fee_refund. Fee amounts carry 2 decimal places, so the refund needs no
      rounding.
    prerequisite: []
    cross_category:
      - category: savings
        as: branch
        reads: [overdraft_protection_source_eligible, current_balance]
        note: The linked savings tier's eligibility and current_balance decide whether the fee's own item would have been covered, and so whether the fee is refunded in full or not at all.
    compute:
      - fee_id: "LATEST('checking_transactions', 'checking_txn_id', date_field='posted_date', event_type='checking_fee', fee_code='overdraft_item')"
      - fee_amount: "SUM('checking_transactions', 'amount', checking_txn_id=fee_id)"
      - item_id: "LATEST('checking_transactions', 'source_item_id', date_field='posted_date', checking_txn_id=fee_id)"
      - item: "SUM('checking_transactions', 'amount', checking_txn_id=item_id)"
      - link_id: "F('overdraft_link_savings_account_id')"
      - link_eligible: "CPARAM('savings', 'overdraft_protection_source_eligible', savings_account_id=link_id)"
      - link_balance: "CFIELD('savings', 'current_balance', savings_account_id=link_id) or 0"
      - covered: "1 if (link_eligible == True and link_balance >= item) else 0"
      - de_minimis: "1 if (item > 0 and item <= P('overdraft_item_de_minimis')) else 0"
      - already_refunded: "COUNT('checking_transactions', event_type='checking_fee_refund', source_item_id=fee_id)"
      - result: "RND(fee_amount if (already_refunded == 0 and (covered == 1 or de_minimis == 1)) else 0, 2)"
    compute_basis:
      fee_id: "This policy reviews the account's most recently posted overdraft item fee; any earlier overdraft item fee is reviewed under checking_evt_fee_refund."
      fee_amount: "it is refunded in full, never in part, at that fee's own amount, with adjustment_reason bank_error"
      item_id: "The item that carried the fee is the entry named as the fee's source item."
      item: "by comparing that savings account's current_balance at the time of the decision with the whole amount of the item"
      link_id: "coverage is judged on the savings account the checking account names as its overdraft link when the decision is made"
      link_eligible: "The fee is a bank error when that linked savings tier has overdraft_protection_source_eligible true and its current_balance is at least the item's amount, since a transfer would have covered the item"
      link_balance: "The fee is a bank error when that linked savings tier has overdraft_protection_source_eligible true and its current_balance is at least the item's amount, since a transfer would have covered the item"
      covered: "The fee is a bank error when that linked savings tier has overdraft_protection_source_eligible true and its current_balance is at least the item's amount, since a transfer would have covered the item"
      de_minimis: "it is also a bank error when the item's amount is overdraft_item_de_minimis or less."
      already_refunded: "A fee that already has a refund entry is never refunded again."
      result: "When the fee is a bank error and has no refund yet, it is refunded in full, never in part, at that fee's own amount, with adjustment_reason bank_error; otherwise this policy refunds nothing"
    inputs:
      history:
        - {table: checking_transactions, aggregate: latest, field: checking_txn_id, filters: {event_type: checking_fee, fee_code: overdraft_item}}
        - {table: checking_transactions, aggregate: sum, field: amount, filters: {checking_txn_id: item_id}}
        - {table: checking_transactions, aggregate: count, field: checking_txn_id, filters: {event_type: checking_fee_refund, source_item_id: fee_id}}
      cross_category: [savings]
  - id: checking_ext_uncovered_episode_extended_fee_refund
    base_policy_refs: [checking_evt_fee_refund, checking_evt_electronic_dispute, checking_evt_overdraft_protection_transfer, checking_evt_extended_overdraft_fee]
    overwrite:
      - base_policy: checking_evt_overdraft_protection_transfer
        superseded_clause: "the transfer is made only if the savings current_balance at that moment covers the whole shortfall, and a partial transfer is never made."
        replaced_by: "Outside the refund decisions of checking_ext_uncovered_item_fee_refund and checking_ext_uncovered_episode_extended_fee_refund, an overdraft protection transfer is made only if the savings current_balance at that moment covers the whole shortfall, and a partial transfer is never made. For a refund decision under this policy, coverage of the item that opened the episode is judged on the savings account the checking account names as its overdraft link when the decision is made, by comparing that savings account's current_balance at the time of the decision with the whole amount of that item."
    trigger: state_due
    subject: [checking_fee_refund]
    computes: amount
    target_tool: refund_extended_overdraft_fee_22b46ecc
    rule: >-
      An extended overdraft fee under checking_evt_extended_overdraft_fee presupposes a negative episode, and it posts
      extended_overdraft_trigger_days calendar days after negative_since_date, the day the episode began. When the
      item that opened the episode would have been covered by an overdraft protection transfer, the episode would
      never have begun, so the extended overdraft fee charged on it is a bank error. This policy reviews the account's
      most recently posted extended overdraft fee; any earlier one is reviewed under checking_evt_fee_refund. The
      item that opened the episode is identified through the account's most recently posted overdraft item fee: when
      that fee posted exactly extended_overdraft_trigger_days calendar days before the extended overdraft fee, it
      posted on the day the episode began and the item named as its source item opened the episode; otherwise the
      opening item is not identified and only the amount ground below is judged. Outside the refund decisions of checking_ext_uncovered_item_fee_refund and checking_ext_uncovered_episode_extended_fee_refund, an overdraft protection transfer is made only if the savings current_balance at that moment covers the whole shortfall, and a partial transfer is never made. For a refund decision under this
      policy, coverage of the item that opened the episode is judged on the savings account the checking account
      names as its overdraft link when the decision is made, by comparing that savings account's current_balance at
      the time of the decision with the whole amount of that item. The item would have been covered when that linked
      savings tier has overdraft_protection_source_eligible true and its current_balance is at least the item's
      amount. An extended overdraft fee charged at an amount other than the tier's extended_overdraft_fee is also a
      bank error. A fee that already has a refund entry is never refunded again. When the fee is a bank error and
      has no refund yet, it is refunded in full, never in part, at that fee's own amount, with adjustment_reason
      bank_error; otherwise this policy refunds nothing, and a goodwill request is decided under the courtesy gates of
      checking_evt_fee_refund. Fee amounts carry 2 decimal places, so the refund needs no rounding.
    prerequisite: []
    cross_category:
      - category: savings
        as: branch
        reads: [overdraft_protection_source_eligible, current_balance]
        note: The linked savings tier's eligibility and current_balance decide whether the episode's opening item would have been covered, and so whether the extended fee is refunded.
    compute:
      - ext_id: "LATEST('checking_transactions', 'checking_txn_id', date_field='posted_date', event_type='checking_fee', fee_code='extended_overdraft')"
      - ext_amount: "SUM('checking_transactions', 'amount', checking_txn_id=ext_id)"
      - ext_date: "LATEST('checking_transactions', 'posted_date', date_field='posted_date', checking_txn_id=ext_id)"
      - od_id: "LATEST('checking_transactions', 'checking_txn_id', date_field='posted_date', event_type='checking_fee', fee_code='overdraft_item')"
      - od_date: "LATEST('checking_transactions', 'posted_date', date_field='posted_date', checking_txn_id=od_id)"
      - opens_episode: "1 if (od_date and ext_date and DAYS(od_date, ext_date) == P('extended_overdraft_trigger_days')) else 0"
      - item: "SUM('checking_transactions', 'amount', checking_txn_id=LATEST('checking_transactions', 'source_item_id', date_field='posted_date', checking_txn_id=od_id))"
      - link_eligible: "CPARAM('savings', 'overdraft_protection_source_eligible', savings_account_id=F('overdraft_link_savings_account_id'))"
      - link_balance: "CFIELD('savings', 'current_balance', savings_account_id=F('overdraft_link_savings_account_id')) or 0"
      - covered: "1 if (opens_episode == 1 and link_eligible == True and link_balance >= item) else 0"
      - wrong_amount: "1 if (ext_amount > 0 and ext_amount != P('extended_overdraft_fee')) else 0"
      - already_refunded: "COUNT('checking_transactions', event_type='checking_fee_refund', source_item_id=ext_id)"
      - result: "RND(ext_amount if (already_refunded == 0 and (covered == 1 or wrong_amount == 1)) else 0, 2)"
    compute_basis:
      ext_id: "This policy reviews the account's most recently posted extended overdraft fee; any earlier one is reviewed under checking_evt_fee_refund."
      ext_amount: "it is refunded in full, never in part, at that fee's own amount, with adjustment_reason bank_error"
      ext_date: "it posts extended_overdraft_trigger_days calendar days after negative_since_date, the day the episode began."
      od_id: "The item that opened the episode is identified through the account's most recently posted overdraft item fee"
      od_date: "when that fee posted exactly extended_overdraft_trigger_days calendar days before the extended overdraft fee"
      opens_episode: "when that fee posted exactly extended_overdraft_trigger_days calendar days before the extended overdraft fee, it posted on the day the episode began and the item named as its source item opened the episode; otherwise the opening item is not identified and only the amount ground below is judged."
      item: "the item named as its source item opened the episode"
      link_eligible: "The item would have been covered when that linked savings tier has overdraft_protection_source_eligible true and its current_balance is at least the item's amount."
      link_balance: "The item would have been covered when that linked savings tier has overdraft_protection_source_eligible true and its current_balance is at least the item's amount."
      covered: "When the item that opened the episode would have been covered by an overdraft protection transfer, the episode would never have begun, so the extended overdraft fee charged on it is a bank error."
      wrong_amount: "An extended overdraft fee charged at an amount other than the tier's extended_overdraft_fee is also a bank error."
      already_refunded: "A fee that already has a refund entry is never refunded again."
      result: "When the fee is a bank error and has no refund yet, it is refunded in full, never in part, at that fee's own amount, with adjustment_reason bank_error; otherwise this policy refunds nothing"
    inputs:
      history:
        - {table: checking_transactions, aggregate: latest, field: checking_txn_id, filters: {event_type: checking_fee, fee_code: extended_overdraft}}
        - {table: checking_transactions, aggregate: latest, field: checking_txn_id, filters: {event_type: checking_fee, fee_code: overdraft_item}}
        - {table: checking_transactions, aggregate: count, field: checking_txn_id, filters: {event_type: checking_fee_refund, source_item_id: ext_id}}
      cross_category: [savings]
  - id: checking_ext_private_client_entry_conversion
