    all_debits: The account's own deposits less its paid items is the total of every deposit posted to the account less
      the total of every paid item posted to it, rounded half-up to the cent.
    reconciled_money: The account's own deposits less its paid items is the total of every deposit posted to the account
      less the total of every paid item posted to it, rounded half-up to the cent.
    checking_component: The checking component is the account's own deposits less its paid items where that stands above
