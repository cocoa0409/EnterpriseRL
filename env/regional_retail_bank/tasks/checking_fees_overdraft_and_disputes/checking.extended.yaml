    condition: The account's posted activity carries a take-back entry against every temporary credit that stands on it
      for a claim whose decision went the bank's way.
    resolved_by: post_dispute_credit_reversal_956f6db8
    effect: The take-backs out binding rises from zero to the amount taken back, so the money reconciled from the account's
      own entries, and with it the closing payout, falls by that amount.
  cross_category:
  - category: savings
    as: branch
