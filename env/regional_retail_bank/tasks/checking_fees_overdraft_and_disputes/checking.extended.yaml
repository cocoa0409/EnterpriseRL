    closing_charge_level: The closing charge is set at the tier's early closure charge. Where the owner's premier money
      market balance reaches the tier's relationship maintenance threshold and the account has been open at least as long
      as the settled account period, the closing charge is set at the tier's early closure charge less the relationship
      charge relief; where the case above does not apply and the owner's premier money market balance reaches the protection
      source minimum or the owner has made at least eight card payments in the last twelve months, the closing charge is
      set at the tier's early closure charge less the modest charge relief.
    closing_charge: The closing charge is then taken at the level it was set, in full. Where the owner's certificate principal
      reaches the certificate relationship minimum and the account has been open at least as long as the settled account
      period, the closing charge is instead spread evenly over the whole months the account has been open, a month counting
      only once the day of the month the account was opened has come round again and the count never falling below one,
      and the result rounded half-up to the cent; where the case above does not apply and the owner holds any certificate
      principal or the owner has made at least fifteen card payments in the last twelve months, the closing charge is taken
