    card_paid_12m: The card component is the total of the card payments the owner has made in the last twelve months, taken
      at the card relationship share and rounded half-up to the cent.
    card_component: The card component is the total of the card payments the owner has made in the last twelve months, taken
      at the card relationship share and rounded half-up to the cent.
    relationship_balance: The four components are put together by taking the largest single component of the deposit, certificate
      and checking components alone. Where the owner has made at least six card payments in the last twelve months and the
      owner's premier money market balance reaches the protection source minimum, the deposit, certificate, checking and
      card components are added together instead; where the case above does not apply and the owner has made at least three
      card payments in the last twelve months or the owner's certificate principal is above zero, the deposit, certificate
      and checking components are added together and the card component is left out.
    target_tier: 'The tier the relationship supports is the highest whose relationship maintenance threshold the relationship
      balance reaches: at or above the private client threshold the account belongs on Private Client Checking, at or above
      the premier threshold on Premier Checking, at or above the interest threshold on Interest Checking, and below that
      on Everyday Checking.'
  factors:
  - id: deposit_component_share
    effect: parameter
    decides: deposit_share
    bindings:
    - mm_balance
    - deposit_share
    ladder:
    - when: the owner has made at least six card payments in the last twelve months and the premier money market balance
        reaches the protection source minimum
      value: K('whole_deposit_share')
    - when: the case above does not apply and the owner's certificate principal is above zero or the owner has made at least
        three card payments in the last twelve months
      value: K('most_deposit_share')
    - when: otherwise
      value: K('half_deposit_share')
    baseline:
      deposit_share: K('half_deposit_share')
    evidence:
    - cross_category
    - history
    cross_difficulty: savings
  - id: certificate_component_share
    effect: parameter
    decides: certificate_share
    bindings:
    - cd_principal
    - certificate_share
    ladder:
    - when: the owner's premier money market balance reaches the protection source minimum and the owner's certificate principal
        is above zero
      value: K('whole_certificate_share')
    - when: the case above does not apply and the certificate principal reaches the certificate relationship minimum or
        the owner has made at least twelve card payments in the last twelve months
      value: K('half_certificate_share')
    - when: otherwise
      value: K('no_certificate_share')
    baseline:
      certificate_share: K('no_certificate_share')
    evidence:
    - cross_category
    - history
    cross_difficulty: cd
  - id: component_assembly_basis
    effect: method
    decides: relationship_balance
    bindings:
    - card_paid_12m
    - card_component
    - relationship_balance
    ladder:
    - when: the owner has made at least six card payments in the last twelve months and the owner's premier money market
        balance reaches the protection source minimum
      method: the deposit, certificate, checking and card components are added together
    - when: the case above does not apply and the owner has made at least three card payments in the last twelve months
        or the owner's certificate principal is above zero
      method: the deposit, certificate and checking components are added together and the card component is left out
    - when: otherwise
      method: the largest single component of the deposit, certificate and checking components is taken alone
    baseline:
      relationship_balance: MX(deposit_component, certificate_component, checking_component)
    evidence:
    - cross_category
    cross_difficulty: card
  - id: checking_component_basis
    effect: method
    decides: checking_component
    bindings:
    - window_credits
    - all_credits
    - all_debits
    - reconciled_money
    - checking_component
    ladder:
    - when: the owner's premier money market balance reaches the protection source minimum and the owner has made at least
        six card payments in the last twelve months
      method: the total of the credits the account has taken in over the deposit window is taken
    - when: the case above does not apply and the owner's certificate principal is above zero or the owner has made at least
        three card payments in the last twelve months
      method: half of the credits the account has taken in over the deposit window is taken
    - when: otherwise
      method: the account's own deposits less its paid items is taken where it stands above zero, and nothing where it does
        not
    baseline:
      checking_component: MX(0.0, reconciled_money)
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'The tier the relationship supports is the highest whose relationship maintenance threshold the relationship balance
      reaches: at or above the private client threshold the account belongs on Private Client Checking, at or above the
      premier threshold on Premier Checking, at or above the interest threshold on Interest Checking, and below that on
      Everyday Checking. The relationship balance is put together from four components. The deposit component is half of
      the owner''s premier money market balance. The certificate component is nothing at all. The account''s own deposits
      less its paid items is the total of every deposit posted to the account less the total of every paid item posted to
      it, rounded half-up to the cent. The checking component is the account''s own deposits less its paid items where that
      stands above zero and nothing where it does not. The card component is the total of the card payments the owner has
      made in the last twelve months, taken at the card relationship share and rounded half-up to the cent. The four components
      are put together by taking the largest single component of the deposit, certificate and checking components alone.'
    params:
    - private_client_threshold
    - premier_threshold
    - interest_threshold
    - half_deposit_share
    - no_certificate_share
    - card_relationship_share
  inputs:
