    closing_rate: The closing rate is the base account rate. Where the owner has made at least ten card payments in the
      last twelve months and the owner's premier money market balance reaches the tier's relationship maintenance threshold,
      the closing rate is the premier relationship rate; where the case above does not apply and the owner has made at least
      four card payments in the last twelve months or the owner holds any certificate principal, the closing rate is the
      standard relationship rate.
    closing_days: the closing days are the days the account has been open, capped at one full statement cycle
    closing_interest: It is the money reconciled from the account's own entries multiplied by the closing rate as an annual
      percentage, multiplied by the closing days and divided by three hundred and sixty-five, rounded half-up to the cent;
      the closing days are the days the account has been open, capped at one full statement cycle.
    refunds_granted_12m: Where a goodwill or corrective entry has been granted to the account in the last twelve months
