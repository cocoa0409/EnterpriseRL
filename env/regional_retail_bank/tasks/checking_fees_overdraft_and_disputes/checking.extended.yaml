  - credits_in: SUM('checking_transactions','amount', event_type='checking_provisional_credit')
  - rebates_in: SUM('checking_transactions','amount', event_type='checking_atm_rebate')
  - interest_in: SUM('checking_transactions','amount', event_type='checking_interest_credit')
  - debits_out: SUM('checking_transactions','amount', event_type='checking_debit')
  - fees_out: SUM('checking_transactions','amount', event_type='checking_fee')
  - takebacks_out: SUM('checking_transactions','amount', event_type='checking_provisional_reversal')
  - reconciled_money: RND(deposits_in + refunds_in + credits_in + rebates_in + interest_in - debits_out - fees_out - takebacks_out,
      2)
  - account_age_days: DAYS(F('opened_date'), NOW)
  - months_open: MONTHS(F('opened_date'), NOW)
  - mm_balance: CFIELD('savings','current_balance', variant_name='Premier Money Market', status='active')
  - cd_principal: CFIELD('cd','principal_balance', status='active')
  - card_payments_12m: XCOUNT('card','card_transactions', within_months=12, date_field='posted_date', event_type='card_payment')
  - closing_charge_level: (P('early_closure_fee') - K('relationship_charge_relief')) if (mm_balance >= P('waiver_relationship_balance')
