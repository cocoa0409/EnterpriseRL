  computes: target_variant_name
  target_tool: convert_account_tier_569988a7
  params:
    private_client_threshold: 250000
    premier_threshold: 25000
    interest_threshold: 15000
    deposit_window_months: 3
    protection_source_minimum: 5000
    certificate_relationship_minimum: 25000
    whole_deposit_share: 1.0
    most_deposit_share: 0.75
    half_deposit_share: 0.5
    whole_certificate_share: 1.0
    half_certificate_share: 0.5
    no_certificate_share: 0.0
    card_relationship_share: 0.1
  rule: 'A personal checking account is carried on the tier its relationship balance supports, and where the record shows
    it on a lower tier the bank converts it, keeping the account number, the balance and the history. The tier the relationship
    supports is the highest whose relationship maintenance threshold the relationship balance reaches: at or above the private
    client threshold the account belongs on Private Client Checking, at or above the premier threshold on Premier Checking,
    at or above the interest threshold on Interest Checking, and below that on Everyday Checking. The relationship balance
    is put together from four components. The deposit component is half of the owner''s premier money market balance. Where
    the owner has made at least six card payments in the last twelve months and the premier money market balance reaches
    the protection source minimum, the whole of the premier money market balance is the deposit component instead; where
    the case above does not apply and the owner''s certificate principal is above zero or the owner has made at least three
    card payments in the last twelve months, three quarters of it is the deposit component. The certificate component is
    nothing at all. Where the owner''s premier money market balance reaches the protection source minimum and the owner''s
    certificate principal is above zero, the whole of the certificate principal is the certificate component instead; where
    the case above does not apply and the certificate principal reaches the certificate relationship minimum or the owner
    has made at least twelve card payments in the last twelve months, half of it is the certificate component. The account''s
    own deposits less its paid items is the total of every deposit posted to the account less the total of every paid item
    posted to it, rounded half-up to the cent. The checking component is the account''s own deposits less its paid items
    where that stands above zero and nothing where it does not. Where the owner''s premier money market balance reaches
    the protection source minimum and the owner has made at least six card payments in the last twelve months, the checking
    component is the total of the credits the account itself has taken in over the deposit window instead; where the case
    above does not apply and the owner''s certificate principal is above zero or the owner has made at least three card
    payments in the last twelve months, the checking component is half of those credits. The card component is the total
    of the card payments the owner has made in the last twelve months, taken at the card relationship share and rounded
    half-up to the cent. The four components are put together by taking the largest single component of the deposit, certificate
    and checking components alone. Where the owner has made at least six card payments in the last twelve months and the
    owner''s premier money market balance reaches the protection source minimum, the deposit, certificate, checking and
    card components are added together instead; where the case above does not apply and the owner has made at least three
    card payments in the last twelve months or the owner''s certificate principal is above zero, the deposit, certificate
    and checking components are added together and the card component is left out. An account already standing on the tier
    its relationship balance supports is outside this rule and no conversion is recorded.

    '
  prerequisite: []
  cross_category:
  - category: savings
    as: branch
    reads:
    - current_balance
    note: The premier money market balance decides which tier of the deposit component applies.
  - category: cd
    as: branch
    reads:
    - principal_balance
    note: The certificate principal decides which tier of the certificate component applies.
  - category: card
    as: history
    reads:
    - card_transactions.amount
    note: The card payments of the last twelve months decide how the components are put together and supply the card component
      itself.
  compute:
  - mm_balance: CFIELD('savings','current_balance', variant_name='Premier Money Market', status='active')
  - cd_principal: CFIELD('cd','principal_balance', status='active')
  - card_payment_count_12m: XCOUNT('card','card_transactions', within_months=12, date_field='posted_date', event_type='card_payment')
  - deposit_share: K('whole_deposit_share') if (card_payment_count_12m >= 6 and mm_balance >= K('protection_source_minimum'))
      else (K('most_deposit_share') if (cd_principal > 0 or card_payment_count_12m >= 3) else K('half_deposit_share'))
  - deposit_component: RND(mm_balance * deposit_share, 2)
  - certificate_share: K('whole_certificate_share') if (mm_balance >= K('protection_source_minimum') and cd_principal >
      0) else (K('half_certificate_share') if (cd_principal >= K('certificate_relationship_minimum') or card_payment_count_12m
      >= 12) else K('no_certificate_share'))
  - certificate_component: RND(cd_principal * certificate_share, 2)
  - window_credits: SUM('checking_transactions','amount', within_months=K('deposit_window_months'), date_field='posted_date',
      event_type='checking_deposit')
  - all_credits: SUM('checking_transactions','amount', event_type='checking_deposit')
  - all_debits: SUM('checking_transactions','amount', event_type='checking_debit')
  - reconciled_money: RND(all_credits - all_debits, 2)
  - checking_component: window_credits if (mm_balance >= K('protection_source_minimum') and card_payment_count_12m >= 6)
      else (RND(window_credits * K('half_certificate_share'), 2) if (cd_principal > 0 or card_payment_count_12m >= 3) else
      MX(0.0, reconciled_money))
  - card_paid_12m: XSUM('card','card_transactions','amount', within_months=12, date_field='posted_date', event_type='card_payment')
  - card_component: RND(card_paid_12m * K('card_relationship_share'), 2)
  - relationship_balance: (deposit_component + certificate_component + checking_component + card_component) if (card_payment_count_12m
      >= 6 and mm_balance >= K('protection_source_minimum')) else ((deposit_component + certificate_component + checking_component)
      if (card_payment_count_12m >= 3 or cd_principal > 0) else MX(deposit_component, certificate_component, checking_component))
  - target_tier: '''Private Client Checking'' if relationship_balance >= K(''private_client_threshold'') else (''Premier
      Checking'' if relationship_balance >= K(''premier_threshold'') else (''Interest Checking'' if relationship_balance
      >= K(''interest_threshold'') else ''Everyday Checking''))'
