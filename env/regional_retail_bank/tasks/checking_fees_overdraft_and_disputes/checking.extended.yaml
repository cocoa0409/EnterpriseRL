    reconciled_money: The money reconciled from the account's own entries is every credit posted to it — deposits, refunds
      and goodwill entries, temporary credits, surcharge rebates and interest credits — less every debit posted to it, that
      is paid items, charges and take-back entries.
    account_age_days: Where the owner's premier money market balance reaches the tier's relationship maintenance threshold
      and the account has been open at least as long as the settled account period, the closing charge is set at the tier's
      early closure charge less the relationship charge relief
    months_open: Where the owner's certificate principal reaches the certificate relationship minimum and the account has
      been open at least as long as the settled account period, the closing charge is instead spread evenly over the whole
      months the account has been open, a month counting only once the day of the month the account was opened has come
      round again and the count never falling below one, and the result rounded half-up to the cent
    mm_balance: Where the owner's premier money market balance reaches the tier's relationship maintenance threshold and
      the account has been open at least as long as the settled account period, the closing charge is set at the tier's
