    corrections_standing: The amount taken back is settled only after the ledger carries a corrective entry against every
      overdraft charge standing above the published fee schedule.
    netting_share: None of the corrective entries standing on the account is netted off the take-back. Where the owner's
      premier money market balance reaches the tier's relationship maintenance threshold and a corrective entry stands on
      the account, the whole of the corrective entries standing is netted off; where the case above does not apply and the
      owner's premier money market balance reaches the protection source minimum or the owner has made at least eight card
      payments in the last twelve months, half of the corrective entries standing is netted off.
    netted_credit: The netting is worked out on the corrective entries standing and rounded half-up to the cent before it
      is taken off.
    allowance_share: No part of the temporary credit is left with the owner. Where the owner's certificate principal reaches
      the certificate relationship minimum and the owner has made at least six card payments in the last twelve months,
      the deep relationship share of the temporary credit standing is left with the owner; where the case above does not
      apply and the owner holds any certificate principal or the owner's premier money market balance reaches the protection
      source minimum, the modest share of the temporary credit standing is left with the owner.
    owner_allowance: The part left with the owner is worked out on the temporary credit standing and rounded half-up to
      the cent, and it is taken off after the netting.
    gross_takeback: The amount taken back is the temporary credit standing on the account, netted against the corrective
      entries the bank has already made, less the part left with the owner, and never below zero.
    refunds_granted_12m: Where a goodwill or corrective entry has been granted to the account in the last twelve months
      and the owner holds any certificate principal, the take-back is taken to the cent instead; where the case above does
      not apply and at least three such entries have been granted in the last twelve months or the owner has made at least
      fifteen card payments in the last twelve months, the take-back is taken in whole dollars, rounded half-up.
    take_back: The take-back is taken in whole five-dollar steps, rounded half-up. Where a goodwill or corrective entry
      has been granted to the account in the last twelve months and the owner holds any certificate principal, the take-back
      is taken to the cent instead; where the case above does not apply and at least three such entries have been granted
      in the last twelve months or the owner has made at least fifteen card payments in the last twelve months, the take-back
      is taken in whole dollars, rounded half-up.
  factors:
  - id: temporary_credit_measure
    effect: method
    decides: standing_credit
    bindings:
    - card_payments_12m
    - credits_recent
    - credits_largest
    - standing_credit
    ladder:
    - when: the owner has made at least ten card payments in the last twelve months and a temporary credit entry stands
        on the account
      method: only the temporary credit entries posted inside the claim window are summed, less every take-back entry already
        booked
    - when: the case above does not apply and the owner has made at least four card payments in the last twelve months or
        the owner's premier money market balance reaches the protection source minimum
      method: only the largest single temporary credit entry is taken
    - when: otherwise
      method: every temporary credit entry posted to the account is summed, less every take-back entry already booked
