- id: checking_ext_dispute_credit_reversal
  base_policy_refs:
  - checking_evt_electronic_dispute
  overwrite:
  - base_policy: checking_evt_electronic_dispute
    superseded_clause: for the full provisional credit amount
    replaced_by: The amount taken back is the temporary credit standing on the account, netted against the corrective entries
      the bank has already made, less the part left with the owner, and never below zero.
  trigger: state_due
  subject:
  - checking_provisional_reversal
  computes: reversal_amount
  target_tool: post_dispute_credit_reversal_956f6db8
  params:
    claim_window_months: 2
    protection_source_minimum: 5000
    certificate_relationship_minimum: 25000
    full_netting_share: 1.0
    half_netting_share: 0.5
    no_netting_share: 0.0
    deep_allowance_share: 0.05
    modest_allowance_share: 0.02
    no_allowance_share: 0.0
    whole_dollar_step: 5
  rule: 'A temporary credit posted to a personal checking account while an electronic-transaction claim was being looked
    into is taken back once that claim stands decided in the bank''s own favour or has been withdrawn by the owner, as one
    take-back entry recorded against the temporary credit entry it reverses. The amount taken back is settled only after
    the ledger carries a corrective entry against every overdraft charge standing above the published fee schedule. The
    amount taken back is the temporary credit standing on the account, netted against the corrective entries the bank has
    already made, less the part left with the owner, and never below zero. The temporary credit standing on the account
    is every temporary credit entry posted to the account less every take-back entry already booked. Where the owner has
    made at least ten card payments in the last twelve months and a temporary credit entry stands on the account, only the
    temporary credit entries posted inside the claim window count, still less every take-back entry already booked; where
    the case above does not apply and the owner has made at least four card payments in the last twelve months or the owner''s
    premier money market balance reaches the protection source minimum, only the largest single temporary credit entry counts.
    None of the corrective entries standing on the account is netted off the take-back. Where the owner''s premier money
    market balance reaches the tier''s relationship maintenance threshold and a corrective entry stands on the account,
    the whole of the corrective entries standing is netted off; where the case above does not apply and the owner''s premier
    money market balance reaches the protection source minimum or the owner has made at least eight card payments in the
    last twelve months, half of the corrective entries standing is netted off. The netting is worked out on the corrective
    entries standing and rounded half-up to the cent before it is taken off. No part of the temporary credit is left with
    the owner. Where the owner''s certificate principal reaches the certificate relationship minimum and the owner has made
    at least six card payments in the last twelve months, the deep relationship share of the temporary credit standing is
    left with the owner; where the case above does not apply and the owner holds any certificate principal or the owner''s
    premier money market balance reaches the protection source minimum, the modest share of the temporary credit standing
    is left with the owner. The part left with the owner is worked out on the temporary credit standing and rounded half-up
    to the cent, and it is taken off after the netting. The take-back is taken in whole five-dollar steps, rounded half-up.
    Where a goodwill or corrective entry has been granted to the account in the last twelve months and the owner holds any
    certificate principal, the take-back is taken to the cent instead; where the case above does not apply and at least
    three such entries have been granted in the last twelve months or the owner has made at least fifteen card payments
    in the last twelve months, the take-back is taken in whole dollars, rounded half-up. A claim that stands decided in
    the owner''s favour is outside this rule and its temporary credit becomes final where it stands.

    '
  prerequisite:
  - problem: checking_ext_fee_schedule_correction
    kind: value_input
    gate: corrections_standing
    form: state
    policy_source: The amount taken back is settled only after the ledger carries a corrective entry against every overdraft
      charge standing above the published fee schedule.
    condition: The account's posted activity carries a bank-error correction entry against each overdraft charge whose amount
      exceeds what the published fee schedule produces for that run of items.
    resolved_by: post_fee_schedule_correction_961f83a2
    effect: The corrections standing binding rises from zero to the total of the corrective entries on the account, so the
      netting takes that total off the temporary credit standing.
  cross_category:
  - category: savings
    as: branch
    reads:
    - current_balance
    note: The premier money market balance decides which tier of the netting share applies.
  - category: card
    as: history
    reads:
    - card_transactions.event_type
    note: The count of card payments in the last twelve months decides which tier of the temporary credit measure applies.
  - category: cd
    as: branch
    reads:
    - principal_balance
    note: The certificate principal decides which tier of the part left with the owner applies.
  compute:
  - credits_all: SUM('checking_transactions','amount', event_type='checking_provisional_credit')
  - credits_recent: SUM('checking_transactions','amount', within_months=K('claim_window_months'), date_field='posted_date',
      event_type='checking_provisional_credit')
  - credits_largest: MAX('checking_transactions','amount', event_type='checking_provisional_credit')
  - takebacks: SUM('checking_transactions','amount', event_type='checking_provisional_reversal')
  - mm_balance: CFIELD('savings','current_balance', variant_name='Premier Money Market', status='active')
  - cd_principal: CFIELD('cd','principal_balance', status='active')
  - card_payments_12m: XCOUNT('card','card_transactions', within_months=12, date_field='posted_date', event_type='card_payment')
  - standing_credit: (credits_recent - takebacks) if (card_payments_12m >= 10 and credits_all > 0) else (credits_largest
      if (card_payments_12m >= 4 or mm_balance >= K('protection_source_minimum')) else (credits_all - takebacks))
  - corrections_standing: SUM('checking_transactions','amount', event_type='checking_fee_refund', adjustment_reason='bank_error')
  - netting_share: K('full_netting_share') if (mm_balance >= P('waiver_relationship_balance') and corrections_standing >
      0) else (K('half_netting_share') if (mm_balance >= K('protection_source_minimum') or card_payments_12m >= 8) else
      K('no_netting_share'))
  - netted_credit: standing_credit - RND(corrections_standing * netting_share, 2)
  - allowance_share: K('deep_allowance_share') if (cd_principal >= K('certificate_relationship_minimum') and card_payments_12m
      >= 6) else (K('modest_allowance_share') if (cd_principal > 0 or mm_balance >= K('protection_source_minimum')) else
      K('no_allowance_share'))
  - owner_allowance: RND(standing_credit * allowance_share, 2)
  - gross_takeback: MX(0.0, netted_credit - owner_allowance)
  - refunds_granted_12m: COUNT('checking_transactions', within_months=12, date_field='posted_date', event_type='checking_fee_refund')
  - take_back: RND(gross_takeback, 2) if (refunds_granted_12m >= 1 and cd_principal > 0) else (RND(gross_takeback, 0) if
      (refunds_granted_12m >= 3 or card_payments_12m >= 15) else RND(gross_takeback / K('whole_dollar_step'), 0) * K('whole_dollar_step'))
  - result: take_back
  compute_basis:
    credits_all: The temporary credit standing on the account is every temporary credit entry posted to the account less
      every take-back entry already booked.
    credits_recent: Where the owner has made at least ten card payments in the last twelve months and a temporary credit
      entry stands on the account, only the temporary credit entries posted inside the claim window count, still less every
