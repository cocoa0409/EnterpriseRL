- id: checking_ext_relationship_tier_conversion
  base_policy_refs:
  - checking_agg_relationship_balance
  - checking_product_change
  overwrite:
  - base_policy: checking_agg_relationship_balance
    superseded_clause: the customer's deposit balances at PCB summed across checking, savings and certificate holdings in
      the customer's own name
    replaced_by: The relationship balance is put together from four components.
  - base_policy: checking_agg_relationship_balance
    superseded_clause: Credit card balances, auto loan balances and safe deposit box rentals never count.
    replaced_by: The card component is the total of the card payments the owner has made in the last twelve months, taken
      at the card relationship share and rounded half-up to the cent.
  trigger: state_due
  subject:
