events:
  # ---------------- holding writes (savings_accounts) ----------------
  - type: savings_open
    target: savings_accounts
    mutation: create
    meaning: "A new savings or money market account is opened in one tier and awaits its opening deposit."
    grain: "One row per account opened."
    fields:
      customer_id: "The owner."
      variant_name: "Official tier name chosen at opening."
      status: "Always applied at creation."
      account_number_last4: "Last four digits of the account number assigned at opening."
      opened_date: "Date the account was opened."
      current_balance: "Always 0.00 at creation."
      statement_cycle_day: "Day of month on which the statement cycle closes."
      statement_delivery: "Statement delivery method chosen at opening."
      promo_end_date: "For a tier that offers a promotional APY, opened_date plus promo_duration_months calendar months; empty otherwise."
    triggers: []
  - type: savings_activate
    target: savings_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: "The opening deposit posted and the account became active."
    grain: "One row per activation."
    fields:
      status: "Set to active."
      last_customer_activity_date: "Set to the posted date of the opening deposit."
    triggers: []
  - type: savings_lapse_unfunded
    target: savings_accounts
    mutation: {transition: {from: applied, to: closed}}
    meaning: "An account never funded within the funding window is closed."
    grain: "One row per unfunded account closed."
    fields:
      status: "Set to closed."
      closed_date: "Date the unfunded account was closed."
    triggers: []
  - type: savings_go_dormant
    target: savings_accounts
    mutation: {transition: {from: active, to: dormant}}
    meaning: "The account is classified dormant after the inactivity period."
    grain: "One row per dormancy classification."
    fields:
      status: "Set to dormant."
    triggers: []
  - type: savings_reactivate
    target: savings_accounts
    mutation: {transition: {from: dormant, to: active}}
    meaning: "A dormant account returns to active after verified owner contact and a customer-initiated transaction."
    grain: "One row per reactivation."
    fields:
      status: "Set to active."
      last_customer_activity_date: "Set to the date of the reactivating transaction."
    triggers: []
  - type: savings_close
    target: savings_accounts
    mutation: {transition: [{from: active, to: closed}, {from: dormant, to: closed}]}
    meaning: "The account is closed at the owner's confirmed request after its balance was paid out."
    grain: "One row per closure."
    fields:
      status: "Set to closed."
      closed_date: "Date the account closed."
      automatic_transfer_amount: "Set to 0.00; a closed account keeps no automatic transfer."
      funding_checking_account_id: "Cleared to empty."
    triggers: []
  - type: savings_change_product
    target: savings_accounts
    mutation: update
    meaning: "The account is converted to another savings tier, keeping its number and history."
    grain: "One row per conversion."
    fields:
      variant_name: "Official name of the new tier."
    triggers: []
  - type: savings_set_automatic_transfer
    target: savings_accounts
    mutation: update
    meaning: "A recurring automatic transfer from a PCB checking account into this account is set up, changed or stopped."
    grain: "One row per automatic transfer change."
    fields:
      automatic_transfer_amount: "Recurring monthly transfer amount; 0.00 when stopped."
      automatic_transfer_day: "Day of month the transfer runs; empty when stopped."
      funding_checking_account_id: "The PCB checking account funding the transfer; empty when stopped."
    triggers: []
  - type: savings_set_statement_delivery
    target: savings_accounts
    mutation: update
    meaning: "The statement delivery method is changed."
    grain: "One row per delivery change."
    fields:
      statement_delivery: "The new delivery method."
    triggers: []
  # ---------------- ledger writes (savings_transactions) ----------------
  - type: savings_deposit
    target: savings_transactions
    meaning: "A credit posts to the account: cash, check, mobile deposit, ACH credit, incoming wire, automatic transfer or internal transfer in."
    grain: "One row per credit item posted, identified by its trace number."
    distinguish_by: [trace_number]
    fields:
      amount: "Amount credited, positive."
      posted_date: "Business day the credit posted and became available."
      channel: "How the credit arrived."
      description: "Payer or deposit description as printed on the statement."
      trace_number: "Unique posting trace number of the item."
      check_number: "Serial number of a deposited check, otherwise empty."
      statement_cycle: "Statement cycle in which the credit posted."
      counterparty_account_id: "The PCB account the funds came from for an internal or automatic transfer, otherwise empty."
    account: savings_balance
    direction: in
    triggers:
      - event: "checking:checking_debit"
        when: {channel: automatic_transfer}
        map: {amount: amount, posted_date: posted_date, channel: internal_transfer, counterparty_account_id: savings_account_id}
  - type: savings_withdrawal
    target: savings_transactions
    meaning: "Funds leave the account: branch or ATM cash, online or telephone transfer, ACH debit, money market check, outgoing wire, or an overdraft protection transfer to checking."
    grain: "One row per withdrawal item, identified by its trace number or, for an overdraft protection transfer, by the checking transfer it funds."
    distinguish_by: [trace_number, source_item_id]
    fields:
      amount: "Amount withdrawn, positive."
      posted_date: "Business day the withdrawal posted."
      channel: "How the withdrawal was made."
      description: "Payee or destination description as printed on the statement."
      trace_number: "Unique posting trace number, empty for an overdraft protection transfer."
      check_number: "Serial number of a money market check, otherwise empty."
      source_item_id: "For an overdraft protection transfer, the checking transfer row it funds; otherwise empty."
      statement_cycle: "Statement cycle in which the withdrawal posted."
      counterparty_account_id: "The PCB account receiving the funds for an internal or overdraft transfer, otherwise empty."
    account: savings_balance
    direction: out
    triggers: []
  - type: savings_interest_credit
    target: savings_transactions
    meaning: "Interest is credited at statement cycle close, one row per interest component, or as a correction of a cycle's interest."
    grain: "One row per account, statement cycle, interest component and adjustment ground."
    distinguish_by: [statement_cycle, interest_component, adjustment_reason]
    fields:
      amount: "Interest credited, positive."
      posted_date: "Cycle closing date, or the correction date for a correction."
      statement_cycle: "Statement cycle the interest was earned in."
      interest_component: "base, relationship_bonus, goal_bonus or promotional."
      adjustment_reason: "none for the regular credit; bank_error for a correction of interest under-credited in that cycle."
    account: savings_balance
    direction: in
    triggers: []
  - type: savings_fee
    target: savings_transactions
    meaning: "A fee is assessed to the account."
    grain: "One row per fee: per counted withdrawal for excess withdrawal fees, per service for service fees, per cycle for periodic fees."
    distinguish_by: [fee_code, source_item_id, statement_cycle, posted_date]
    fields:
      amount: "Fee amount, positive."
      posted_date: "Business day the fee posted."
      fee_code: "Which fee this is."
      source_item_id: "The withdrawal or wire that caused the fee; empty for periodic fees."
      statement_cycle: "Statement cycle the fee belongs to."
    account: savings_balance
    direction: out
    triggers: []
  - type: savings_fee_refund
    target: savings_transactions
    meaning: "A fee is refunded in full."
    grain: "One row per fee refunded; a fee can be refunded at most once."
    distinguish_by: [source_item_id]
    fields:
      amount: "Refunded amount, equal to the fee's amount."
      posted_date: "Business day the refund posted."
      fee_code: "Fee code of the refunded fee."
      source_item_id: "The fee row being refunded."
      adjustment_reason: "courtesy_waiver or bank_error."
      statement_cycle: "Statement cycle in which the refund posted."
    account: savings_balance
    direction: in
    triggers: []

measures:
  - id: savings_msr_cycle_counted_withdrawals
    window: "The statement cycle: from the day after the previous cycle closing date through the cycle closing date, by posted_date."
    measure: "Count, in posting order, of savings_withdrawal rows whose channel is in the tier's excess_withdrawal_counted_channels, plus rows with channel overdraft_transfer when overdraft_transfer_counts_toward_limit is true."
  - id: savings_msr_cycle_excess_fees
    window: "The statement cycle, by posted_date."
    measure: "Count of savings_fee rows with fee_code excess_withdrawal posted in the cycle."
  - id: savings_msr_cycle_min_daily_balance
    window: "The statement cycle, each calendar day."
    measure: "Lowest end-of-day current balance on any day of the cycle, from the running sum of savings_transactions rows booked to savings_balance."
  - id: savings_msr_cycle_end_of_day_balances
    window: "The statement cycle, each calendar day."
    measure: "End-of-day balance for each calendar day of the cycle, from the running sum of savings_transactions rows booked to savings_balance posted on or before that day."
  - id: savings_msr_cycle_net_deposits
    window: "The statement cycle, by posted_date."
    measure: "Sum of amount over savings_deposit rows minus sum of amount over savings_withdrawal rows posted in the cycle; interest credits, fees and refunds are excluded."
  - id: savings_msr_cycle_withdrawal_count
    window: "The statement cycle, by posted_date."
    measure: "Count of savings_withdrawal rows of any channel posted in the cycle."
  - id: savings_msr_cycle_automatic_transfer_total
    window: "The statement cycle, by posted_date."
    measure: "Sum of amount over savings_deposit rows with channel automatic_transfer posted in the cycle."
  - id: savings_msr_courtesy_refunds_365d
    window: "Rolling 365 calendar days ending on the frozen date, inclusive."
    measure: "Count of savings_fee_refund rows with adjustment_reason courtesy_waiver on all savings accounts of the customer."
  - id: savings_msr_promo_new_money
    window: "From opened_date through opened_date plus promo_funding_window_days calendar days, inclusive."
    measure: "Sum of amount over savings_deposit rows with channel branch, check_deposit, mobile_deposit, ach_credit or wire_domestic posted in the window; internal and automatic transfers from PCB accounts are never new money."
  - id: savings_msr_combined_bonus_base
    window: "Each calendar day."
    measure: "End-of-day balances of all of the customer's savings accounts in active or dormant status, ordered from highest to lowest balance, with ties broken by earlier opened_date."
  - id: savings_msr_mobile_deposits_30d
    window: "Rolling 30 calendar days ending on the deposit date, inclusive."
    measure: "Sum of amount over savings_deposit rows with channel mobile_deposit."

policies:
  - id: savings_agg_multi_holding
    subject: [savings_open]
    rule: >-
      A customer may hold several savings and money market accounts. The count of the customer's savings
      accounts whose status is not closed must be below max_per_customer before a new account is opened. The
      count of the customer's savings accounts of the requested tier whose status is not closed must be below
      that tier's max_accounts_per_customer_this_tier. Applied, active and dormant accounts count toward both
      caps; closed accounts never count. Reaching either cap declines the opening with no row written.
    eligibility:
      - id: portfolio_cap
        applies_to: [savings_open]
        kind: authorization
        condition: "The count of the customer's savings accounts whose status is not closed must be below max_per_customer before a new account is opened."
        evidence_fields: [savings_accounts.customer_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.customer_id]]
          action_bindings: {savings_accounts.customer_id: customer_id}
      - id: tier_cap
        applies_to: [savings_open]
        kind: authorization
        condition: "The count of the customer's savings accounts of the requested tier whose status is not closed must be below that tier's max_accounts_per_customer_this_tier."
        evidence_fields: [savings_accounts.customer_id, savings_accounts.variant_name, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.customer_id, savings_accounts.variant_name]]
          action_bindings: {savings_accounts.customer_id: customer_id, savings_accounts.variant_name: variant_name}
    params:
      max_per_customer: 6
      per_tier:
        Starter Savings: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Statement Savings: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Goal Builder Savings: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Money Market Account: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Premier Money Market: {tier_cap: "=max_accounts_per_customer_this_tier"}
        Private Client Money Market: {tier_cap: "=max_accounts_per_customer_this_tier"}

  - id: savings_agg_relationship_bonus_allocation
    subject: [savings_interest_credit]
    rule: >-
      The relationship bonus is a portfolio benefit. It is paid only while the customer holds, at the start of
      the day, an active checking account whose tier is listed in the savings account's
      relationship_bonus_checking_tiers. Each day, the customer's savings balances eligible for the bonus are
      taken in the order given by savings_msr_combined_bonus_base, highest balance first and ties to the earlier
      opened_date, and the bonus is paid on each account's balance only until the running combined total reaches
      that account's relationship_bonus_balance_cap; balance above the running cap earns no bonus. An account
      whose tier lists no qualifying checking tier, or whose relationship_bonus_apy is 0.00, takes no part in the
      allocation and does not consume the cap. The bonus is credited as its own savings_interest_credit row with
      interest_component relationship_bonus at cycle close.
    eligibility:
      - id: qualifying_checking
        applies_to: [savings_interest_credit]
        kind: authorization
        condition: "It is paid only while the customer holds, at the start of the day, an active checking account whose tier is listed in the savings account's relationship_bonus_checking_tiers."
        evidence_fields: [checking_accounts.customer_id, checking_accounts.variant_name, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.customer_id]]
          action_bindings: {checking_accounts.customer_id: customer_id}
    params:
      per_tier:
        Starter Savings: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
        Statement Savings: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
        Goal Builder Savings: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
        Money Market Account: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
        Premier Money Market: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
        Private Client Money Market: {bonus_apy: "=relationship_bonus_apy", qualifying_tiers: "=relationship_bonus_checking_tiers", cap: "=relationship_bonus_balance_cap"}
    measures: [savings_msr_combined_bonus_base]

  - id: savings_open_and_funding
    subject: [savings_open, savings_activate, savings_lapse_unfunded]
    rule: >-
      A savings account opens in applied status with a zero balance and no automatic transfer. The customer's
      age in whole years on the opening date, from the date of birth on the customer profile, must be at least
      the tier's age_min_to_open. For a tier whose entry_required_checking_tiers is not none, the customer must
      already hold an active checking account of one of the listed tiers on the opening date. The account becomes
      active on the business day its first deposit posts, provided that deposit is at least the tier's
      minimum_opening_deposit; a smaller first deposit is returned and does not activate the account. An account
      still in applied status is closed as unfunded once funding_window_days calendar days have passed after the
      account was opened. Count calendar days with the day after opened_date as day 1; the lapse is due when the
      frozen date is on or after opened_date plus funding_window_days. For tiers that offer a promotional APY,
      promo_end_date is recorded at opening as opened_date plus promo_duration_months calendar months, falling
      back to the last day of the month when that day does not exist.
    eligibility:
      - id: age_gate
        applies_to: [savings_open]
        kind: authorization
        condition: "The customer's age in whole years on the opening date, from the date of birth on the customer profile, must be at least the tier's age_min_to_open."
        evidence_fields: [customers.customer_id, customers.date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
      - id: required_checking
        applies_to: [savings_open]
        kind: authorization
        condition: "For a tier whose entry_required_checking_tiers is not none, the customer must already hold an active checking account of one of the listed tiers on the opening date."
        evidence_fields: [checking_accounts.customer_id, checking_accounts.variant_name, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.customer_id]]
          action_bindings: {checking_accounts.customer_id: customer_id}
      - id: funding_lapse
        applies_to: [savings_lapse_unfunded]
        kind: time
        condition: "An account still in applied status is closed as unfunded once funding_window_days calendar days have passed after the account was opened."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account was opened"
          anchor_source: savings_accounts.opened_date
          relation: not_before
          duration_source: params.funding_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after opened_date as day 1; the lapse is due when the frozen date is on or after opened_date plus funding_window_days."
          boundary: inclusive
    params:
      funding_window_days: 30
      per_tier:
        Starter Savings: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}
        Statement Savings: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}
        Goal Builder Savings: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}
        Money Market Account: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}
        Premier Money Market: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}
        Private Client Money Market: {opening_deposit: "=minimum_opening_deposit", min_age: "=age_min_to_open", required_checking: "=entry_required_checking_tiers", promo_months: "=promo_duration_months"}

  - id: savings_evt_maintenance_and_statement_fees
    subject: [savings_fee, savings_set_statement_delivery]
    rule: >-
      At each statement cycle close the tier's monthly_maintenance_fee is assessed as one savings_fee row with
      fee_code monthly_maintenance for that cycle, unless at least one waiver offered by the tier is met for the
      cycle. The tier used is the variant_name at cycle close. Waivers are alternatives, any single one suffices,
      and the fee is never prorated or partially waived; a waiver whose parameter is not_offered cannot be used.
      The waivers are: savings_msr_cycle_min_daily_balance at or above waiver_min_daily_balance;
      savings_msr_cycle_automatic_transfer_total at or above waiver_automatic_transfer_min; the owner's age at
      cycle close below waiver_age_under; an active checking account of a tier listed in
      waiver_linked_checking_tiers held by the same customer at cycle close; the relationship balance at cycle
      close, on the basis of checking_agg_relationship_balance with mortgage principal excluded, at or above
      waiver_relationship_balance. The fee is not assessed for the cycle in which the account was opened. The
      maintenance fee is assessed only on an account whose status at cycle close is active. At most one
      maintenance fee is assessed per account per statement cycle. When statement_delivery is paper at cycle
      close the tier's paper_statement_fee is assessed as fee_code paper_statement for that cycle, except for
      owners at least paper_statement_fee_exempt_age at cycle close. A tier fee of 0.00 writes no row.
    eligibility:
      - id: active_at_close
        applies_to: [savings_fee]
        kind: state
        condition: "The maintenance fee is assessed only on an account whose status at cycle close is active."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        state_contract:
          field: savings_accounts.status
          allowed: [active]
      - id: one_per_cycle
        applies_to: [savings_fee]
        kind: dedup
        condition: "At most one maintenance fee is assessed per account per statement cycle."
        evidence_fields: [savings_transactions.savings_account_id, savings_transactions.statement_cycle, savings_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.savings_account_id, savings_transactions.statement_cycle]]
          action_bindings: {savings_transactions.savings_account_id: savings_account_id, savings_transactions.statement_cycle: statement_cycle}
        dedup_contract:
          table: savings_transactions
          mode: separate_record
          object_bindings: {savings_account_id: savings_account_id, statement_cycle: statement_cycle}
          duplicate_filters: {event_type: [savings_fee], fee_code: [monthly_maintenance]}
          distinct_fields: []
    params:
      per_tier:
        Starter Savings: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
        Statement Savings: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
        Goal Builder Savings: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
        Money Market Account: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
        Premier Money Market: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
        Private Client Money Market: {fee: "=monthly_maintenance_fee", min_balance: "=waiver_min_daily_balance", auto_transfer: "=waiver_automatic_transfer_min", age_under: "=waiver_age_under", linked_checking: "=waiver_linked_checking_tiers", relationship: "=waiver_relationship_balance", paper_fee: "=paper_statement_fee"}
    measures: [savings_msr_cycle_min_daily_balance, savings_msr_cycle_automatic_transfer_total]

  - id: savings_evt_withdrawal_allowance
    subject: [savings_withdrawal, savings_fee]
    rule: >-
      Savings accounts carry a per-cycle allowance of counted withdrawals. Withdrawals are paid only from an
      account whose status is active or dormant. A withdrawal is paid only when its amount does not exceed the
      current balance; a withdrawal that would take the balance below zero is declined and never posts, except an
      overdraft protection transfer, which the checking charter makes only when the savings balance covers it in
      full. Withdrawals made in person at a branch or at an ATM never count toward the allowance. Every other
      withdrawal counts when its channel is in the tier's excess_withdrawal_counted_channels, and an overdraft
      protection transfer counts when the tier's overdraft_transfer_counts_toward_limit is true; the count is
      savings_msr_cycle_counted_withdrawals in posting order. Each counted withdrawal beyond
      free_withdrawals_per_cycle incurs excess_withdrawal_fee as a savings_fee row with fee_code excess_withdrawal
      whose source_item_id is that withdrawal, until savings_msr_cycle_excess_fees reaches
      excess_withdrawal_fee_max_per_cycle, after which further counted withdrawals in the cycle are paid without
      a fee. A tier whose free_withdrawals_per_cycle is unlimited never charges the fee. Each withdrawal carries
      at most one excess withdrawal fee. The tier used is the variant_name on the withdrawal's posted_date. An
      outgoing wire also incurs domestic_wire_out_fee with fee_code wire_out, and an incoming wire credit incurs
      incoming_wire_fee with fee_code wire_incoming; a fee of 0.00 writes no row. Daily limits apply per calendar
      day in Eastern Time: ATM cash within atm_daily_withdrawal_limit only on tiers with atm_card_access true, and
      online or mobile transfers out within online_transfer_daily_limit; money market checks are paid only on
      tiers with check_writing_available true. Over-limit requests are declined and never post.
    eligibility:
      - id: status_allows_withdrawal
        applies_to: [savings_withdrawal]
        kind: state
        condition: "Withdrawals are paid only from an account whose status is active or dormant."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        state_contract:
          field: savings_accounts.status
          allowed: [active, dormant]
      - id: covered_by_balance
        applies_to: [savings_withdrawal]
        kind: authorization
        condition: "A withdrawal is paid only when its amount does not exceed the current balance; a withdrawal that would take the balance below zero is declined and never posts, except an overdraft protection transfer, which the checking charter makes only when the savings balance covers it in full."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.current_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
      - id: one_fee_per_withdrawal
        applies_to: [savings_fee]
        kind: dedup
        condition: "Each withdrawal carries at most one excess withdrawal fee."
        evidence_fields: [savings_transactions.source_item_id, savings_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.source_item_id]]
          action_bindings: {savings_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: savings_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [savings_fee], fee_code: [excess_withdrawal]}
          distinct_fields: []
    params:
      per_tier:
        Starter Savings: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
        Statement Savings: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
        Goal Builder Savings: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
        Money Market Account: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
        Premier Money Market: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
        Private Client Money Market: {free: "=free_withdrawals_per_cycle", fee: "=excess_withdrawal_fee", fee_cap: "=excess_withdrawal_fee_max_per_cycle", channels: "=excess_withdrawal_counted_channels", od_counts: "=overdraft_transfer_counts_toward_limit", wire_fee: "=domestic_wire_out_fee", wire_in_fee: "=incoming_wire_fee", atm: "=atm_card_access", atm_limit: "=atm_daily_withdrawal_limit", online_limit: "=online_transfer_daily_limit", checks: "=check_writing_available"}
    measures: [savings_msr_cycle_counted_withdrawals, savings_msr_cycle_excess_fees]

  - id: savings_evt_interest
    subject: [savings_interest_credit]
    rule: >-
      Interest accrues daily on each calendar day's end-of-day balance from savings_msr_cycle_end_of_day_balances
      and is credited on the cycle closing date as separate savings_interest_credit rows, one per component that
      is above 0.00 after rounding. A day whose end-of-day balance is below minimum_balance_to_earn_interest earns
      no interest of any component. Base interest uses base_apy_ladder: under the tiered method the whole balance
      earns the APY of the highest band floor it reaches; under the blended method each slice of balance between
      consecutive floors earns that band's APY. Each day's interest is balance times APY divided by 100 and by
      interest_day_count_basis; daily amounts are summed unrounded per component and each component total is
      rounded half-up to the cent. The stacking of components is fixed: on the promotional portion of a day's
      balance the promotional APY replaces the base APY and no relationship or goal bonus is added; on the
      remaining balance the base APY applies and the relationship bonus and goal bonus each add their own
      percentage points. A component that does not apply is not applicable rather than zero-rated, and writes no
      row. The tier and ladder used for each day are those in force on that day. Interest accrued since the last
      cycle close is paid at closure only when accrued_interest_paid_on_closure is true; otherwise it is forfeited.
      A correction for interest under-credited in a past cycle is written as a separate row with adjustment_reason
      bank_error for the same statement_cycle and component, for the difference only.
    eligibility: []
    params:
      interest_day_count_basis: 365
      per_tier:
        Starter Savings: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
        Statement Savings: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
        Goal Builder Savings: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
        Money Market Account: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
        Premier Money Market: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
        Private Client Money Market: {ladder: "=base_apy_ladder", method: "=interest_band_method", min_to_earn: "=minimum_balance_to_earn_interest", paid_on_close: "=accrued_interest_paid_on_closure"}
    measures: [savings_msr_cycle_end_of_day_balances]

  - id: savings_evt_bonus_interest
    subject: [savings_interest_credit]
    rule: >-
      Two tier-specific bonuses supplement base interest. The goal bonus is earned for a cycle on a tier whose
      goal_bonus_apy is above 0.00 when savings_msr_cycle_net_deposits is at least goal_bonus_min_net_deposit and
      savings_msr_cycle_withdrawal_count is zero; when earned it applies to every day of that cycle on balance up
      to goal_bonus_balance_cap and is credited with interest_component goal_bonus. A cycle with any withdrawal of
      any channel, including an overdraft protection transfer, earns no goal bonus. The promotional APY applies
      only on a tier whose promo_new_money_apy is not not_offered, only while the day is on or before
      promo_end_date, and only when savings_msr_promo_new_money reached promo_min_new_money; the promotional
      portion of each day's balance is the balance up to promo_balance_cap, credited with interest_component
      promotional. The promotional APY applies only on days no later than promo_duration_months calendar months after the account was opened. Count calendar months from
      opened_date; a day is within the promotional period when it is on or before opened_date plus
      promo_duration_months calendar months, which is the recorded promo_end_date. After promo_end_date the
      whole balance earns base interest and any relationship bonus. A tier conversion ends the promotional period
      on the conversion date. New money deposited after promo_funding_window_days does not count toward the
      threshold but does earn the promotional APY within the cap.
    eligibility:
      - id: promo_period
        applies_to: [savings_interest_credit]
        kind: time
        condition: "The promotional APY applies only on days no later than promo_duration_months calendar months after the account was opened."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.opened_date, savings_accounts.promo_end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account was opened"
          anchor_source: savings_accounts.opened_date
          relation: not_after
          duration_source: variants.promo_duration_months
          unit: calendar_months
          counting_rule: "Count calendar months from opened_date; a day is within the promotional period when it is on or before opened_date plus promo_duration_months calendar months, which is the recorded promo_end_date."
          boundary: inclusive
    params:
      per_tier:
        Starter Savings: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
        Statement Savings: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
        Goal Builder Savings: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
        Money Market Account: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
        Premier Money Market: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
        Private Client Money Market: {goal_apy: "=goal_bonus_apy", goal_min: "=goal_bonus_min_net_deposit", goal_cap: "=goal_bonus_balance_cap", promo_apy: "=promo_new_money_apy", promo_min: "=promo_min_new_money", promo_cap: "=promo_balance_cap", promo_window: "=promo_funding_window_days"}
    measures: [savings_msr_cycle_net_deposits, savings_msr_cycle_withdrawal_count, savings_msr_promo_new_money]

  - id: savings_evt_fee_refund
    subject: [savings_fee_refund]
    rule: >-
      A fee is refunded in full, never in part, as one savings_fee_refund row whose source_item_id is the fee row.
      A bank_error refund applies when the fee was assessed contrary to the savings charter, such as an excess
      withdrawal fee on a branch or ATM withdrawal, on a withdrawal within the free allowance, beyond
      excess_withdrawal_fee_max_per_cycle, or a maintenance fee in a cycle where a waiver was met; it has no time
      limit and does not count toward the courtesy limit. A courtesy_waiver refund of a correctly assessed fee is
      allowed only when every courtesy gate holds. The fee's fee_code must be one of courtesy_eligible_fee_codes.
      The fee must have posted no more than courtesy_refund_window_days calendar days before the courtesy refund is
      granted. Count calendar days with the day after the fee's posted_date as day 1; the refund is allowed while
      the frozen date is on or before the fee's posted_date plus courtesy_refund_window_days. The customer's count
      of savings courtesy refunds in the rolling 365 days must be below the tier's courtesy_refund_limit_365d,
      counted by savings_msr_courtesy_refunds_365d, where each refunded fee counts as one. The account's status
      must be active or dormant when a courtesy refund is granted. When the limit allows fewer refunds than
      requested, the most recently posted fees are refunded first, and among fees posted the same day the larger
      fee first. A fee can be refunded at most once. Checking courtesy refunds and savings courtesy refunds are
      counted separately.
    eligibility:
      - id: eligible_fee_code
        applies_to: [savings_fee_refund]
        kind: authorization
        condition: "The fee's fee_code must be one of courtesy_eligible_fee_codes."
        evidence_fields: [savings_transactions.savings_txn_id, savings_transactions.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.savings_txn_id]]
          action_bindings: {savings_transactions.savings_txn_id: source_item_id}
      - id: courtesy_window
        applies_to: [savings_fee_refund]
        kind: time
        condition: "The fee must have posted no more than courtesy_refund_window_days calendar days before the courtesy refund is granted."
        evidence_fields: [savings_transactions.savings_txn_id, savings_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.savings_txn_id]]
          action_bindings: {savings_transactions.savings_txn_id: source_item_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "The fee must have posted"
          anchor_source: savings_transactions.posted_date
          relation: not_after
          duration_source: variants.courtesy_refund_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after the fee's posted_date as day 1; the refund is allowed while the frozen date is on or before the fee's posted_date plus courtesy_refund_window_days."
          boundary: inclusive
      - id: courtesy_limit
        applies_to: [savings_fee_refund]
        kind: authorization
        condition: "The customer's count of savings courtesy refunds in the rolling 365 days must be below the tier's courtesy_refund_limit_365d, counted by savings_msr_courtesy_refunds_365d, where each refunded fee counts as one."
        evidence_fields: [savings_transactions.customer_id, savings_transactions.adjustment_reason, savings_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.customer_id]]
          action_bindings: {savings_transactions.customer_id: customer_id}
      - id: account_open
        applies_to: [savings_fee_refund]
        kind: state
        condition: "The account's status must be active or dormant when a courtesy refund is granted."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        state_contract:
          field: savings_accounts.status
          allowed: [active, dormant]
      - id: refund_once
        applies_to: [savings_fee_refund]
        kind: dedup
        condition: "A fee can be refunded at most once."
        evidence_fields: [savings_transactions.source_item_id, savings_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_transactions.source_item_id]]
          action_bindings: {savings_transactions.source_item_id: source_item_id}
        dedup_contract:
          table: savings_transactions
          mode: separate_record
          object_bindings: {source_item_id: source_item_id}
          duplicate_filters: {event_type: [savings_fee_refund]}
          distinct_fields: []
    params:
      courtesy_eligible_fee_codes: [monthly_maintenance, paper_statement, excess_withdrawal, dormant_account]
      per_tier:
        Starter Savings: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Statement Savings: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Goal Builder Savings: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Money Market Account: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Premier Money Market: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
        Private Client Money Market: {limit_365d: "=courtesy_refund_limit_365d", window_days: "=courtesy_refund_window_days"}
    measures: [savings_msr_courtesy_refunds_365d]

  - id: savings_evt_automatic_transfer
    subject: [savings_set_automatic_transfer, savings_deposit]
    rule: >-
      An automatic transfer moves a fixed amount each month from a PCB checking account into the savings account.
      Setting up or changing it is the owner's own instruction to move their funds. The funding checking account
      must belong to the same customer_id as the savings account and be in active status when the instruction is
      recorded. The amount must be at least the tier's automatic_transfer_min_amount. The transfer day is a day of
      month from 1 to 28; when that day is not a business day the transfer runs on the next business day. On the
      transfer day the transfer posts as a savings_deposit with channel automatic_transfer, which through its
      trigger debits the funding checking account; if the checking ledger balance would go below zero the transfer
      is skipped for that month with no row and no fee, and it never creates an overdraft. Stopping the transfer
      sets the amount to 0.00 and clears the day and funding account, effective for the next scheduled run.
    eligibility:
      - id: funding_account_owned_active
        applies_to: [savings_set_automatic_transfer]
        kind: authorization
        condition: "The funding checking account must belong to the same customer_id as the savings account and be in active status when the instruction is recorded."
        evidence_fields: [checking_accounts.checking_account_id, checking_accounts.customer_id, checking_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[checking_accounts.checking_account_id]]
          action_bindings: {checking_accounts.checking_account_id: funding_checking_account_id}
      - id: minimum_amount
        applies_to: [savings_set_automatic_transfer]
        kind: authorization
        condition: "The amount must be at least the tier's automatic_transfer_min_amount."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
    params:
      per_tier:
        Starter Savings: {min_amount: "=automatic_transfer_min_amount"}
        Statement Savings: {min_amount: "=automatic_transfer_min_amount"}
        Goal Builder Savings: {min_amount: "=automatic_transfer_min_amount"}
        Money Market Account: {min_amount: "=automatic_transfer_min_amount"}
        Premier Money Market: {min_amount: "=automatic_transfer_min_amount"}
        Private Client Money Market: {min_amount: "=automatic_transfer_min_amount"}

  - id: savings_evt_deposits
    subject: [savings_deposit]
    rule: >-
      A deposit posts on the business day its funds become available, so the current balance is also the
      available balance. Cash, ACH credits, incoming wires and internal or automatic transfers post on the business
      day received. A deposited check posts on the next business day, except that while the account has been open
      fewer than new_account_period_days calendar days a deposited check posts on the
      new_account_check_hold_business_days business day after deposit. A mobile deposit is accepted only when it
      keeps the day's mobile deposits within mobile_deposit_daily_limit and savings_msr_mobile_deposits_30d within
      mobile_deposit_30day_limit; an over-limit mobile deposit is rejected and never posts. Deposits are accepted
      on active and dormant accounts and on an applied account as its opening deposit, never on a closed account.
      A deposit is never customer-initiated activity for dormancy when it is an ACH credit, incoming wire or
      automatic transfer.
    eligibility: []
    params:
      per_tier:
        Starter Savings: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
        Statement Savings: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
        Goal Builder Savings: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
        Money Market Account: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
        Premier Money Market: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
        Private Client Money Market: {mobile_day: "=mobile_deposit_daily_limit", mobile_30d: "=mobile_deposit_30day_limit", hold_days: "=new_account_check_hold_business_days", new_period: "=new_account_period_days"}
    measures: [savings_msr_mobile_deposits_30d]

  - id: savings_evt_dormancy
    subject: [savings_go_dormant, savings_reactivate, savings_fee]
    rule: >-
      Customer-initiated activity means a deposit or withdrawal the owner makes at a branch, ATM, by mobile
      deposit, online, mobile or telephone transfer, money market check or wire; interest credits, fees, refunds,
      ACH credits, automatic transfers and overdraft protection transfers are not customer-initiated.
      last_customer_activity_date records the latest such activity. An active account becomes dormant once
      dormancy_inactivity_months calendar months have passed after the last customer-initiated activity. Count
      calendar months from last_customer_activity_date; the account is due for dormancy when the frozen date is on
      or after last_customer_activity_date plus dormancy_inactivity_months calendar months, falling back to the last
      day of the month when that day does not exist. While dormant, dormant_account_fee is assessed at each cycle
      close as fee_code dormant_account, reduced so it never takes the balance below zero and not written on a
      zero balance; no maintenance fee is assessed in a dormant cycle. The identity of the owner must be verified
      before a dormant account is reactivated. Reactivation needs a customer-initiated transaction in the same
      contact, and its date becomes the new last_customer_activity_date. Interest continues to accrue while dormant.
    eligibility:
      - id: inactivity_elapsed
        applies_to: [savings_go_dormant]
        kind: time
        condition: "An active account becomes dormant once dormancy_inactivity_months calendar months have passed after the last customer-initiated activity."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.last_customer_activity_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the last customer-initiated activity"
          anchor_source: savings_accounts.last_customer_activity_date
          relation: not_before
          duration_source: variants.dormancy_inactivity_months
          unit: calendar_months
          counting_rule: "Count calendar months from last_customer_activity_date; the account is due for dormancy when the frozen date is on or after last_customer_activity_date plus dormancy_inactivity_months calendar months, falling back to the last day of the month when that day does not exist."
          boundary: inclusive
      - id: verified_owner
        applies_to: [savings_reactivate]
        kind: authorization
        condition: "The identity of the owner must be verified before a dormant account is reactivated."
        evidence_fields: [verification_log.customer_id, verification_log.verified]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[verification_log.customer_id]]
          action_bindings: {verification_log.customer_id: customer_id}
    params:
      per_tier:
        Starter Savings: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Statement Savings: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Goal Builder Savings: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Money Market Account: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Premier Money Market: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}
        Private Client Money Market: {months: "=dormancy_inactivity_months", fee: "=dormant_account_fee"}

  - id: savings_evt_closure
    subject: [savings_close, savings_fee, savings_withdrawal]
    rule: >-
      Closing a savings account is the owner's own decision: the agent registers a savings_requests row of
      request_type account_closure in pending_customer_confirmation status naming the disbursement method, and the
      account closes only after the owner confirms. An account that is the overdraft protection source of a
      checking account is unlinked on that checking account before it closes. The early closure fee applies when
      the account is closed within early_closure_window_days calendar days after the account was opened. Count
      calendar days with the day after opened_date as day 1; the fee applies when the closure date is on or before
      opened_date plus early_closure_window_days. The fee is written as fee_code early_closure before payout and
      reduced so it never takes the balance below zero. Accrued interest since the last cycle close is credited
      first only when accrued_interest_paid_on_closure is true. The remaining balance is paid out in full as one
      savings_withdrawal, by internal transfer to a PCB account of the same customer or by official check mailed
      to the address on file, and the account closes at zero with its automatic transfer stopped. A payout never
      counts toward the withdrawal allowance and never incurs an excess withdrawal fee.
    eligibility:
      - id: early_window
        applies_to: [savings_fee]
        kind: time
        condition: "The early closure fee applies when the account is closed within early_closure_window_days calendar days after the account was opened."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account was opened"
          anchor_source: savings_accounts.opened_date
          relation: not_after
          duration_source: variants.early_closure_window_days
          unit: calendar_days
          counting_rule: "Count calendar days with the day after opened_date as day 1; the fee applies when the closure date is on or before opened_date plus early_closure_window_days."
          boundary: inclusive
    params:
      per_tier:
        Starter Savings: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Statement Savings: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Goal Builder Savings: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Money Market Account: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Premier Money Market: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}
        Private Client Money Market: {fee: "=early_closure_fee", window_days: "=early_closure_window_days"}

  - id: savings_product_change
    subject: [savings_change_product]
    rule: >-
      A tier conversion keeps the account number, balance and history and changes only variant_name. The account
      must be active when the conversion is recorded. The customer must meet the target tier's entry gate on the
      conversion date, including entry_required_checking_tiers and savings_agg_multi_holding, except the opening
      deposit; the current balance must be at least the target tier's minimum_opening_deposit instead. No fee is
      charged. A conversion ends any promotional period on the conversion date and does not restart the early
      closure window. At most one conversion is recorded per account per statement cycle.
    eligibility:
      - id: must_be_active
        applies_to: [savings_change_product]
        kind: state
        condition: "The account must be active when the conversion is recorded."
        evidence_fields: [savings_accounts.savings_account_id, savings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[savings_accounts.savings_account_id]]
          action_bindings: {savings_accounts.savings_account_id: savings_account_id}
        state_contract:
          field: savings_accounts.status
          allowed: [active]

# ============================================================================
# extended_policies (difficulty savings_withdrawals_interest_and_transfers)
# ============================================================================
extended_policies:
  - id: savings_ext_certificate_proceeds_transfer
    base_policy_refs: [savings_evt_withdrawal_allowance, savings_evt_closure]
    overwrite: []
    trigger: on_request
    subject: [savings_withdrawal]
    computes: amount
    target_tool: transfer_savings_to_checking_5f60835b
    rule: >-
      When the owner asks to move out of a savings or money market account the money that the certificate
      of deposit which most recently paid into it put there, the transfer is a telephone withdrawal to the
      owner's own checking account whose amount is the certificate money still held in the account. That
      certificate is the counterparty of the most recent deposit on this account posted as an internal
      transfer, taken only when that counterparty is a certificate of deposit of the same customer whose
      payout account on the certificate record is this savings account; when the most recent
      internal-transfer deposit came from any other account, no certificate money is identified and nothing
      is moved under this policy, and a request about the money of any other certificate is outside this
      policy. When internal-transfer deposits from different accounts posted on that most recent date, the
      records do not show which of them is the most recent, and nothing is moved under this policy. First add up every
      deposit on this account whose counterparty is that certificate, which covers its interest payouts and
      its maturity or grace payout, all posted as internal transfers from the certificate. Then subtract
      every withdrawal already sent from this account to that same certificate; a difference below zero is
      taken as zero. The amount moved is that net certificate money, capped at the account's current
      balance at the moment of the transfer, rounded half-up to the cent. Deposits from any other source,
      and interest the savings account itself earned, are not certificate money and are not moved. The
      withdrawal is subject to every rule of savings_evt_withdrawal_allowance on the day it posts, and it is
      a customer-initiated activity for dormancy purposes because the owner instructs it by telephone.
    prerequisite: []
    cross_category:
      - category: cd
        as: branch
        reads: [certificate_id, payout_account_id]
        note: Whether the counterparty of the most recent internal-transfer deposit is the customer's certificate paying into this account decides which deposits and withdrawals are certificate money, and so sets the transfer amount.
    compute:
      - d_in: "LATEST('savings_transactions','posted_date', date_field='posted_date', event_type='savings_deposit', channel='internal_transfer')"
      - cd_cp: "LATEST('savings_transactions','counterparty_account_id', date_field='posted_date', event_type='savings_deposit', channel='internal_transfer', posted_date=d_in)"
      - same_cp: "COUNT('savings_transactions', event_type='savings_deposit', channel='internal_transfer', posted_date=d_in) == COUNT('savings_transactions', event_type='savings_deposit', channel='internal_transfer', posted_date=d_in, counterparty_account_id=cd_cp)"
      - cd_id: "CFIELD('cd','certificate_id', certificate_id=cd_cp, payout_account_id=HID) if same_cp else None"
      - cd_in: "SUM('savings_transactions','amount', event_type='savings_deposit', channel='internal_transfer', counterparty_account_id=cd_id)"
      - cd_back: "SUM('savings_transactions','amount', event_type='savings_withdrawal', counterparty_account_id=cd_id)"
      - net_cd: "MX(cd_in - cd_back, 0)"
      - bal: "F('current_balance')"
      - result: "RND(bal) if net_cd > bal else RND(net_cd)"
    compute_basis:
      d_in: "That certificate is the counterparty of the most recent deposit on this account posted as an internal transfer"
      cd_cp: "That certificate is the counterparty of the most recent deposit on this account posted as an internal transfer"
      same_cp: "When internal-transfer deposits from different accounts posted on that most recent date, the records do not show which of them is the most recent, and nothing is moved under this policy."
      cd_id: "taken only when that counterparty is a certificate of deposit of the same customer whose payout account on the certificate record is this savings account; when the most recent internal-transfer deposit came from any other account, no certificate money is identified and nothing is moved under this policy"
      cd_in: "First add up every deposit on this account whose counterparty is that certificate, which covers its interest payouts and its maturity or grace payout, all posted as internal transfers from the certificate."
      cd_back: "Then subtract every withdrawal already sent from this account to that same certificate; a difference below zero is taken as zero."
      net_cd: "Then subtract every withdrawal already sent from this account to that same certificate; a difference below zero is taken as zero."
      bal: "The amount moved is that net certificate money, capped at the account's current balance at the moment of the transfer, rounded half-up to the cent."
      result: "The amount moved is that net certificate money, capped at the account's current balance at the moment of the transfer, rounded half-up to the cent."
    inputs:
      history:
        - {table: savings_transactions, aggregate: sum, field: amount, filters: {event_type: savings_deposit, channel: internal_transfer}}
        - {table: savings_transactions, aggregate: sum, field: amount, filters: {event_type: savings_withdrawal}}
      cross_category: [cd]

  - id: savings_ext_same_contact_reactivation
    base_policy_refs: [savings_evt_dormancy]
    overwrite: []
    trigger: state_due
    subject: [savings_reactivate]
    computes: reactivation_date
    target_tool: reactivate_savings_account_bfe70db1
    rule: >-
      A dormant savings or money market account is reactivated when its identity-verified owner makes a
      customer-initiated transaction in the same contact, and that transaction's posted date becomes the new
      last_customer_activity_date. This policy covers reactivation through a transfer out that the owner
      makes in the contact by telephone, online or mobile banking to one of their own checking accounts;
      reactivation through any other customer-initiated transaction is outside this policy. That the
      transfer was made in this contact is established from the contact itself, where the owner makes it, not
      from the ledger; it is a condition for reactivation under this policy, and the computed reactivation
      date does not test it. The transfer made in the contact is the latest withdrawal on the account with
      channel telephone_banking, online_transfer or mobile_app_transfer, so the reactivation date is the
      latest posted_date among the account's withdrawals with those three channels, which is that transfer's
      posted date, a business day as the withdrawal's posted_date always is. A transfer made on a Saturday,
      Sunday or Federal Reserve holiday posts on the next business day, after the contact, so it has not
      posted within the contact: the date is established under this policy only when that posted date is
      not after the frozen date, the day of the contact, and otherwise no reactivation date is established
      under this policy. The date is established under this policy only when exactly one withdrawal with those three channels posted on that date and its
      counterparty is a checking account of the same customer; when two or more posted on that date, the
      records do not show which one the contact made, and when its counterparty is any other account, no
      reactivation date is established under this policy. An account that is not dormant is not reactivated.
    prerequisite:
      - problem: savings_ext_certificate_proceeds_transfer
        kind: value_input
        gate: d
        condition: >-
          The transfer the owner makes in the contact has posted before the reactivation date is recorded.
        policy_source: >-
          The transfer made in the contact is the latest withdrawal on the account with channel
          telephone_banking, online_transfer or mobile_app_transfer, so the reactivation date is the latest
          posted_date among the account's withdrawals with those three channels
        resolved_by: transfer_savings_to_checking_5f60835b
        effect: >-
          The owner's telephone transfer posts a withdrawal whose posted_date is later than any earlier
          telephone, online or mobile withdrawal, so d becomes that date, which on a business-day contact is
          the frozen date, n_on_d counts exactly that one withdrawal and own becomes true, and the
          reactivation date is established as that posted date.
    cross_category:
      - category: checking
        as: branch
        reads: [checking_account_id]
        note: Whether the counterparty of the transfer that sets the reactivation date is one of the customer's own checking accounts decides whether a reactivation date is established.
    compute:
      - is_dormant: "F('status') == 'dormant'"
      - d_tel: "LATEST('savings_transactions','posted_date', date_field='posted_date', event_type='savings_withdrawal', channel='telephone_banking') if COUNT('savings_transactions', event_type='savings_withdrawal', channel='telephone_banking') >= 1 else ''"
      - d_onl: "LATEST('savings_transactions','posted_date', date_field='posted_date', event_type='savings_withdrawal', channel='online_transfer') if COUNT('savings_transactions', event_type='savings_withdrawal', channel='online_transfer') >= 1 else ''"
      - d_mob: "LATEST('savings_transactions','posted_date', date_field='posted_date', event_type='savings_withdrawal', channel='mobile_app_transfer') if COUNT('savings_transactions', event_type='savings_withdrawal', channel='mobile_app_transfer') >= 1 else ''"
      - d: "MX(d_tel, d_onl, d_mob)"
      - not_after_contact: "d <= NOW"
      - n_on_d: "COUNT('savings_transactions', event_type='savings_withdrawal', channel='telephone_banking', posted_date=d) + COUNT('savings_transactions', event_type='savings_withdrawal', channel='online_transfer', posted_date=d) + COUNT('savings_transactions', event_type='savings_withdrawal', channel='mobile_app_transfer', posted_date=d)"
      - cp: "LATEST('savings_transactions','counterparty_account_id', date_field='posted_date', event_type='savings_withdrawal', channel='telephone_banking', posted_date=d) or LATEST('savings_transactions','counterparty_account_id', date_field='posted_date', event_type='savings_withdrawal', channel='online_transfer', posted_date=d) or LATEST('savings_transactions','counterparty_account_id', date_field='posted_date', event_type='savings_withdrawal', channel='mobile_app_transfer', posted_date=d)"
      - own: "CFIELD('checking','checking_account_id', checking_account_id=cp) != None"
      - result: "d if (is_dormant and not_after_contact and n_on_d == 1 and own) else ''"
    compute_basis:
      is_dormant: "An account that is not dormant is not reactivated."
      d_tel: "so the reactivation date is the latest posted_date among the account's withdrawals with those three channels, which is that transfer's posted date"
      d_onl: "so the reactivation date is the latest posted_date among the account's withdrawals with those three channels, which is that transfer's posted date"
      d_mob: "so the reactivation date is the latest posted_date among the account's withdrawals with those three channels, which is that transfer's posted date"
      d: "so the reactivation date is the latest posted_date among the account's withdrawals with those three channels, which is that transfer's posted date"
      not_after_contact: "the date is established under this policy only when that posted date is not after the frozen date, the day of the contact, and otherwise no reactivation date is established under this policy."
      n_on_d: "The date is established under this policy only when exactly one withdrawal with those three channels posted on that date"
      cp: "and its counterparty is a checking account of the same customer"
      own: "and its counterparty is a checking account of the same customer; when two or more posted on that date, the records do not show which one the contact made, and when its counterparty is any other account, no reactivation date is established under this policy."
      result: "The date is established under this policy only when exactly one withdrawal with those three channels posted on that date and its counterparty is a checking account of the same customer"
    inputs:
      history:
        - {table: savings_transactions, aggregate: latest, field: posted_date, filters: {event_type: savings_withdrawal}}
        - {table: savings_transactions, aggregate: count, filters: {event_type: savings_withdrawal}}
      cross_category: [checking]

  - id: savings_ext_best_money_market_conversion
    base_policy_refs: [savings_product_change]
    overwrite: []
    trigger: on_request
    subject: [savings_change_product]
    computes: variant_name
    target_tool: convert_savings_tier_d500151b
    params:
      pcmm_required_checking: Private Client Checking
      pcmm_min_deposit: 25000.00
      premier_min_deposit: 10000.00
      mma_min_deposit: 2500.00
    rule: >-
      When the owner asks to move a savings or money market account up to the highest-ranked money market
      tier they qualify for, the target tier is chosen from the top of the money market ranks downward and
      the first tier the account qualifies for is the target. Private Client Money Market qualifies only
      when the customer holds at least one active checking account of its entry_required_checking_tiers,
      Private Client Checking, and the balance is at least that tier's minimum_opening_deposit. Otherwise Premier
      Money Market qualifies when the balance is at least its minimum_opening_deposit, and otherwise Money
      Market Account qualifies when the balance is at least its minimum_opening_deposit. The search stops at
      the account's current tier: an account whose current tier is reached before any higher tier qualifies
      stays in its current tier and no conversion is recorded, and an account already in Private Client
      Money Market stays where it is. The balance compared with each tier's minimum is the current balance
      after every refund owed on the account has posted. When the owner moves money out of the account in
      the same contact, the balance compared is the balance after that transfer has posted. This policy is
      applied only when no transaction on the account has a posted_date later than the frozen date, as the
      ledger shows, so that every transfer and refund the balance must reflect has posted: a transfer or
      refund made on a Saturday, Sunday or Federal Reserve holiday posts on the next business day, and until
      it has posted no target is chosen under this policy; this is a condition for applying the policy,
      read from the records, that the computed target does not test. The account must be active when the
      conversion is recorded, so a dormant account is converted only after the owner has made a customer-initiated
      transaction in the same contact and the account has been reactivated. An account that is not active when
      the target is chosen stays in its current tier and no conversion is recorded. The conversion changes only
      variant_name, charges no fee, ends any promotional period on the conversion date and does not restart
      the early closure window. The per-tier account cap of savings_agg_multi_holding and every other
      entry-gate item of savings_product_change are not part of the ranking: they are checked as
      eligibility of the conversion once the target is chosen, and when the customer does not meet one of
      them for the target tier, for example because they already hold the maximum number of accounts of
      that tier, no conversion is recorded and no lower tier is substituted.
    prerequisite:
      - problem: savings_ext_same_contact_reactivation
        kind: value_input
        gate: active
        condition: >-
          A dormant account has been reactivated through a customer-initiated transaction in the same
          contact before any conversion is recorded.
        policy_source: >-
          The account must be active when the conversion is recorded, so a dormant account is converted
          only after the owner has made a customer-initiated transaction in the same contact and the account
          has been reactivated.
        resolved_by: reactivate_savings_account_bfe70db1
        effect: >-
          active becomes true once the reactivation sets savings_accounts.status to active, so the target is
          chosen from the money market ranking instead of the account staying in its current tier.
    cross_category:
      - category: checking
        as: branch
        reads: [checking_account_id, variant_name, status]
        note: Holding at least one active Private Client Checking account is the entry condition that opens Private Client Money Market as a target.
    compute:
      - bal: "F('current_balance')"
      - cur: "F('variant_name')"
      - pc_chk: "CFIELD('checking','checking_account_id', variant_name=K('pcmm_required_checking'), status='active')"
      - pc_ok: "pc_chk != None"
      - pcmm_ok: "pc_ok and bal >= K('pcmm_min_deposit')"
      - premier_ok: "bal >= K('premier_min_deposit')"
      - mma_ok: "bal >= K('mma_min_deposit')"
      - already_top: "cur == 'Private Client Money Market'"
      - active: "F('status') == 'active'"
      - result: "cur if (already_top or not active) else ('Private Client Money Market' if pcmm_ok else (cur if cur == 'Premier Money Market' else ('Premier Money Market' if premier_ok else (cur if cur == 'Money Market Account' else ('Money Market Account' if mma_ok else cur)))))"
    compute_basis:
      bal: "The balance compared with each tier's minimum is the current balance after every refund owed on the account has posted. When the owner moves money out of the account in the same contact, the balance compared is the balance after that transfer has posted."
      pc_chk: "Private Client Money Market qualifies only when the customer holds at least one active checking account of its entry_required_checking_tiers, Private Client Checking, and the balance is at least that tier's minimum_opening_deposit."
      pc_ok: "Private Client Money Market qualifies only when the customer holds at least one active checking account of its entry_required_checking_tiers, Private Client Checking, and the balance is at least that tier's minimum_opening_deposit."
      pcmm_ok: "Private Client Money Market qualifies only when the customer holds at least one active checking account of its entry_required_checking_tiers, Private Client Checking, and the balance is at least that tier's minimum_opening_deposit."
      premier_ok: "Otherwise Premier Money Market qualifies when the balance is at least its minimum_opening_deposit, and otherwise Money Market Account qualifies when the balance is at least its minimum_opening_deposit."
      mma_ok: "Otherwise Premier Money Market qualifies when the balance is at least its minimum_opening_deposit, and otherwise Money Market Account qualifies when the balance is at least its minimum_opening_deposit."
      already_top: "an account already in Private Client Money Market stays where it is."
      active: "An account that is not active when the target is chosen stays in its current tier and no conversion is recorded."
      result: "The search stops at the account's current tier: an account whose current tier is reached before any higher tier qualifies stays in its current tier and no conversion is recorded, and an account already in Private Client Money Market stays where it is."
      cur: "The per-tier account cap of savings_agg_multi_holding and every other entry-gate item of savings_product_change are not part of the ranking: they are checked as eligibility of the conversion once the target is chosen"
    inputs:
      history: []
      cross_category: [checking]

  - id: savings_ext_certificate_funding_fee_refund
    base_policy_refs: [savings_evt_fee_refund, savings_evt_withdrawal_allowance]
    overwrite: []
    trigger: state_due
    subject: [savings_fee_refund]
    computes: amount
    target_tool: refund_savings_withdrawal_fee_774e6cc0
    rule: >-
      An internal transfer from a savings account that opens a certificate of deposit of the same owner is
      posted with channel internal_transfer, which is never one of the tier's
      excess_withdrawal_counted_channels, so an excess withdrawal fee charged on that transfer was assessed
      contrary to the charter and is refunded in full as a bank_error refund. The funding transfer is the
      most recent withdrawal on this account posted with channel internal_transfer, taken only when its
      counterparty is a certificate of deposit held by the same customer, and that certificate is the one it
      funded; when the most recent internal transfer went to any other account, nothing is refunded under
      this policy. It is taken only when exactly one internal-transfer withdrawal posted on that most recent
      date; when two or more did, the records do not show which one is the most recent, and nothing is
      refunded under this policy. The fee refunded is the
      excess_withdrawal fee whose source_item_id is that funding transfer, and the refund amount is that
      fee's full posted amount, rounded half-up to the cent. When the tier's
      excess_withdrawal_counted_channels lists internal_transfer, or no excess withdrawal fee points at the
      funding transfer, nothing is refunded under this policy. The refund is one savings_fee_refund row whose
      source_item_id is the fee, with fee_code excess_withdrawal and adjustment_reason bank_error; it posts
      on the business day it is made, which is the day of the contact when that is a business day and
      otherwise the next business day, and its statement_cycle is the statement cycle that contains that
      posted date. It has no time limit and does not count toward the courtesy limit.
    prerequisite: []
    cross_category:
      - category: cd
        as: branch
        reads: [certificate_id]
        note: Whether the counterparty of the latest internal transfer is one of the customer's certificates identifies the internal transfer that funded it, and so which excess withdrawal fee is refunded.
    compute:
      - d_out: "LATEST('savings_transactions','posted_date', date_field='posted_date', event_type='savings_withdrawal', channel='internal_transfer')"
      - n_out: "COUNT('savings_transactions', event_type='savings_withdrawal', channel='internal_transfer', posted_date=d_out)"
      - fund_cp: "LATEST('savings_transactions','counterparty_account_id', date_field='posted_date', event_type='savings_withdrawal', channel='internal_transfer', posted_date=d_out) if n_out == 1 else None"
      - cd_id: "CFIELD('cd','certificate_id', certificate_id=fund_cp)"
      - fund_wd: "LATEST('savings_transactions','savings_txn_id', date_field='posted_date', event_type='savings_withdrawal', channel='internal_transfer', posted_date=d_out, counterparty_account_id=cd_id)"
      - counted_flag: "'internal_transfer' in P('excess_withdrawal_counted_channels')"
      - fee_amt: "SUM('savings_transactions','amount', event_type='savings_fee', fee_code='excess_withdrawal', source_item_id=fund_wd)"
      - result: "0 if counted_flag else RND(fee_amt)"
    compute_basis:
      d_out: "The funding transfer is the most recent withdrawal on this account posted with channel internal_transfer"
      n_out: "It is taken only when exactly one internal-transfer withdrawal posted on that most recent date; when two or more did, the records do not show which one is the most recent, and nothing is refunded under this policy."
      fund_cp: "The funding transfer is the most recent withdrawal on this account posted with channel internal_transfer, taken only when its counterparty is a certificate of deposit held by the same customer, and that certificate is the one it funded"
      cd_id: "The funding transfer is the most recent withdrawal on this account posted with channel internal_transfer, taken only when its counterparty is a certificate of deposit held by the same customer, and that certificate is the one it funded"
      fund_wd: "when the most recent internal transfer went to any other account, nothing is refunded under this policy."
      counted_flag: "When the tier's excess_withdrawal_counted_channels lists internal_transfer, or no excess withdrawal fee points at the funding transfer, nothing is refunded under this policy."
      fee_amt: "The fee refunded is the excess_withdrawal fee whose source_item_id is that funding transfer, and the refund amount is that fee's full posted amount, rounded half-up to the cent."
      result: "The fee refunded is the excess_withdrawal fee whose source_item_id is that funding transfer, and the refund amount is that fee's full posted amount, rounded half-up to the cent."
    inputs:
      history:
        - {table: savings_transactions, aggregate: latest, field: savings_txn_id, filters: {event_type: savings_withdrawal, channel: internal_transfer}}
        - {table: savings_transactions, aggregate: sum, field: amount, filters: {event_type: savings_fee, fee_code: excess_withdrawal}}
      cross_category: [cd]

  - id: savings_ext_counted_withdrawal_fee_assessment
    base_policy_refs: [savings_evt_withdrawal_allowance, savings_evt_maintenance_and_statement_fees, savings_evt_dormancy, savings_evt_closure]
    overwrite: []
    trigger: state_due
    subject: [savings_fee]
    computes: amount
    target_tool: assess_savings_withdrawal_fee_aafc1fb2
    rule: >-
      Excess withdrawal fees of the current statement cycle are reconciled against the cycle's counted
      withdrawals. The cycle reconciled is the statement_cycle of the most recent overdraft protection
      transfer, that is the most recent withdrawal on this account with channel overdraft_transfer, taken
      only when its counterparty is a checking account of the same customer, the account the transfer
      covered; when that counterparty is not one of the customer's checking accounts, nothing is reconciled
      under this policy. When overdraft protection transfers to different accounts posted on that most
      recent date, the records do not show which of them is the most recent, and nothing is reconciled under
      this policy. The counted withdrawals of that cycle are its withdrawals whose channel is one of the
      tier's excess_withdrawal_counted_channels, counted channel by channel (online_transfer,
      mobile_app_transfer, telephone_banking, ach_debit, money_market_check and wire_domestic, each only when
      the tier lists it), plus its overdraft protection transfers, whichever checking account they covered,
      when the tier's overdraft_transfer_counts_toward_limit is true; branch, ATM and internal transfers never
      count. The counted withdrawals beyond free_withdrawals_per_cycle each need an excess withdrawal fee of
      their own, taken as none when there are none; a tier whose free_withdrawals_per_cycle is unlimited has
      none. An excess withdrawal fee row of the cycle covers a counted withdrawal beyond the allowance unless
      it has been refunded as bank_error, because a fee assessed contrary to the charter covers no
      withdrawal; a fee refunded as a courtesy was correctly assessed and still covers its withdrawal. Every
      excess withdrawal fee row posted in the cycle, refunded or not, counts toward
      excess_withdrawal_fee_max_per_cycle, as savings_msr_cycle_excess_fees counts them, so the fees that may
      still be charged in the cycle are that maximum less every such row, and never fewer than none. The fees
      owed are the counted withdrawals beyond the allowance that no fee covers, but no more than the fees
      that may still be charged. When at least one fee is owed, an excess withdrawal fee is charged at the
      tier's excess_withdrawal_fee on the earliest counted withdrawal beyond the allowance, in posting order,
      that carries no fee, and written as one savings_fee row with fee_code excess_withdrawal for that cycle
      whose source_item_id is that withdrawal; each further owed fee is a separate row of the same amount on
      the next such withdrawal. When no fee is owed, nothing is charged under this policy. Before the fees
      owed are counted, every excess withdrawal fee of the cycle that was assessed contrary to the charter
      must already have been refunded. This policy is applied only when all of the following hold, each read
      from the records and each a condition for applying the policy that the computed fee does not test: the
      cycle reconciled is the current statement cycle, the cycle that closes on the next statement cycle
      closing date, as the frozen date and the account's statement_cycle_day show; the frozen date, the day
      of the contact, is a business day (Monday through Friday, other than a Federal Reserve holiday), so
      that a refund made in the contact and the fee this policy writes post on the frozen date, within that
      cycle; every excess withdrawal fee row posted within the cycle, from the day after the previous
      statement cycle closing date through the cycle closing date, belongs to the cycle, and every one that
      belongs to the cycle posted within it, as the fees' posted_date and statement_cycle show, so that the
      fee rows of the cycle are the rows savings_msr_cycle_excess_fees counts; no two counted
      withdrawals of the cycle posted on the same day, as their posted_date shows, so that the posting order
      of the counted withdrawals, which the records do not hold within a day, follows from their posted
      dates alone; every excess withdrawal fee of the cycle that has not been refunded as bank_error sits
      on a counted withdrawal beyond the allowance in that posting order, and every one that has been
      refunded as bank_error sits on a withdrawal that is not a counted withdrawal beyond the allowance, as
      the fees' source_item_id shows; and every bank_error refund of an excess withdrawal fee posted in the
      cycle refunds a fee of that same cycle, and every bank_error refund of an excess withdrawal fee of the
      cycle posted in the cycle, as the refunds' source_item_id and statement_cycle show. When any of them
      fails, nothing is reconciled under this policy.
    prerequisite:
      - problem: savings_ext_certificate_funding_fee_refund
        kind: value_input
        gate: voided
        condition: >-
          Every excess withdrawal fee of the cycle assessed contrary to the charter has been refunded before
          the fees owed are counted.
        policy_source: >-
          Before the fees owed are counted, every excess withdrawal fee of the cycle that was assessed
          contrary to the charter must already have been refunded.
        resolved_by: refund_savings_withdrawal_fee_774e6cc0
        effect: >-
          voided counts each bank_error refund posted in the cycle, each of which refunds a fee of that cycle,
          so every refunded erroneous fee stops covering a withdrawal and the fees owed rise by one for it
          within the room left under the per-cycle maximum.
    cross_category:
      - category: checking
        as: branch
        reads: [checking_account_id]
        note: Whether the counterparty of the most recent overdraft protection transfer is one of the customer's checking accounts decides whether a cycle is reconciled and which cycle it is.
    compute:
      - od_d: "LATEST('savings_transactions','posted_date', date_field='posted_date', event_type='savings_withdrawal', channel='overdraft_transfer')"
      - od_cp: "LATEST('savings_transactions','counterparty_account_id', date_field='posted_date', event_type='savings_withdrawal', channel='overdraft_transfer', posted_date=od_d)"
      - od_same: "COUNT('savings_transactions', event_type='savings_withdrawal', channel='overdraft_transfer', posted_date=od_d) == COUNT('savings_transactions', event_type='savings_withdrawal', channel='overdraft_transfer', posted_date=od_d, counterparty_account_id=od_cp)"
      - od_chk: "CFIELD('checking','checking_account_id', checking_account_id=od_cp) if od_same else None"
      - cyc: "LATEST('savings_transactions','statement_cycle', date_field='posted_date', event_type='savings_withdrawal', channel='overdraft_transfer') if od_chk != None else None"
      - chans: "P('excess_withdrawal_counted_channels')"
      - n_online: "COUNT('savings_transactions', event_type='savings_withdrawal', channel='online_transfer', statement_cycle=cyc) if 'online_transfer' in chans else 0"
      - n_mobile: "COUNT('savings_transactions', event_type='savings_withdrawal', channel='mobile_app_transfer', statement_cycle=cyc) if 'mobile_app_transfer' in chans else 0"
      - n_phone: "COUNT('savings_transactions', event_type='savings_withdrawal', channel='telephone_banking', statement_cycle=cyc) if 'telephone_banking' in chans else 0"
      - n_ach: "COUNT('savings_transactions', event_type='savings_withdrawal', channel='ach_debit', statement_cycle=cyc) if 'ach_debit' in chans else 0"
      - n_check: "COUNT('savings_transactions', event_type='savings_withdrawal', channel='money_market_check', statement_cycle=cyc) if 'money_market_check' in chans else 0"
      - n_wire: "COUNT('savings_transactions', event_type='savings_withdrawal', channel='wire_domestic', statement_cycle=cyc) if 'wire_domestic' in chans else 0"
      - n_od: "COUNT('savings_transactions', event_type='savings_withdrawal', channel='overdraft_transfer', statement_cycle=cyc) if P('overdraft_transfer_counts_toward_limit') == True else 0"
      - counted: "n_online + n_mobile + n_phone + n_ach + n_check + n_wire + n_od"
      - free: "P('free_withdrawals_per_cycle')"
      - beyond: "0 if free == 'unlimited' else MX(counted - free, 0)"
      - fee_rows: "COUNT('savings_transactions', event_type='savings_fee', fee_code='excess_withdrawal', statement_cycle=cyc)"
      - voided: "COUNT('savings_transactions', event_type='savings_fee_refund', fee_code='excess_withdrawal', adjustment_reason='bank_error', statement_cycle=cyc)"
      - covered: "fee_rows - voided"
      - room: "MX(P('excess_withdrawal_fee_max_per_cycle') - fee_rows, 0)"
      - owed: "MX(MN(beyond - covered, room), 0)"
      - result: "RND(P('excess_withdrawal_fee')) if owed >= 1 else 0"
    compute_basis:
      od_d: "The cycle reconciled is the statement_cycle of the most recent overdraft protection transfer, that is the most recent withdrawal on this account with channel overdraft_transfer"
      od_same: "When overdraft protection transfers to different accounts posted on that most recent date, the records do not show which of them is the most recent, and nothing is reconciled under this policy."
      od_cp: "The cycle reconciled is the statement_cycle of the most recent overdraft protection transfer, that is the most recent withdrawal on this account with channel overdraft_transfer"
      od_chk: "taken only when its counterparty is a checking account of the same customer, the account the transfer covered; when that counterparty is not one of the customer's checking accounts, nothing is reconciled under this policy."
      cyc: "The cycle reconciled is the statement_cycle of the most recent overdraft protection transfer, that is the most recent withdrawal on this account with channel overdraft_transfer"
      n_online: "counted channel by channel (online_transfer, mobile_app_transfer, telephone_banking, ach_debit, money_market_check and wire_domestic, each only when the tier lists it)"
      n_mobile: "counted channel by channel (online_transfer, mobile_app_transfer, telephone_banking, ach_debit, money_market_check and wire_domestic, each only when the tier lists it)"
      n_phone: "counted channel by channel (online_transfer, mobile_app_transfer, telephone_banking, ach_debit, money_market_check and wire_domestic, each only when the tier lists it)"
      n_ach: "counted channel by channel (online_transfer, mobile_app_transfer, telephone_banking, ach_debit, money_market_check and wire_domestic, each only when the tier lists it)"
      n_check: "counted channel by channel (online_transfer, mobile_app_transfer, telephone_banking, ach_debit, money_market_check and wire_domestic, each only when the tier lists it)"
      n_wire: "counted channel by channel (online_transfer, mobile_app_transfer, telephone_banking, ach_debit, money_market_check and wire_domestic, each only when the tier lists it)"
      n_od: "plus its overdraft protection transfers, whichever checking account they covered, when the tier's overdraft_transfer_counts_toward_limit is true; branch, ATM and internal transfers never count."
      free: "The counted withdrawals beyond free_withdrawals_per_cycle each need an excess withdrawal fee of their own, taken as none when there are none; a tier whose free_withdrawals_per_cycle is unlimited has none."
      beyond: "The counted withdrawals beyond free_withdrawals_per_cycle each need an excess withdrawal fee of their own, taken as none when there are none; a tier whose free_withdrawals_per_cycle is unlimited has none."
      fee_rows: "Every excess withdrawal fee row posted in the cycle, refunded or not, counts toward excess_withdrawal_fee_max_per_cycle, as savings_msr_cycle_excess_fees counts them"
      voided: "An excess withdrawal fee row of the cycle covers a counted withdrawal beyond the allowance unless it has been refunded as bank_error, because a fee assessed contrary to the charter covers no withdrawal; a fee refunded as a courtesy was correctly assessed and still covers its withdrawal."
      covered: "An excess withdrawal fee row of the cycle covers a counted withdrawal beyond the allowance unless it has been refunded as bank_error, because a fee assessed contrary to the charter covers no withdrawal"
      room: "so the fees that may still be charged in the cycle are that maximum less every such row, and never fewer than none."
      owed: "The fees owed are the counted withdrawals beyond the allowance that no fee covers, but no more than the fees that may still be charged."
      result: "When no fee is owed, nothing is charged under this policy."
    inputs:
      history:
        - {table: savings_transactions, aggregate: count, filters: {event_type: savings_withdrawal}}
        - {table: savings_transactions, aggregate: count, filters: {event_type: savings_fee, fee_code: excess_withdrawal}}
        - {table: savings_transactions, aggregate: count, filters: {event_type: savings_fee_refund, fee_code: excess_withdrawal, adjustment_reason: bank_error}}
      cross_category: [checking]

  - id: savings_ext_overdraft_replenishment_transfer
    base_policy_refs: [savings_evt_automatic_transfer]
    overwrite: []
    trigger: on_request
    subject: [savings_set_automatic_transfer]
    computes: automatic_transfer_amount
    target_tool: set_savings_automatic_transfer_e1e909eb
    rule: >-
      When the owner asks for a monthly automatic transfer that puts back what overdraft protection took
      from the savings account in a statement cycle together with the withdrawal fees the account bears for
      that cycle, the cycle is the statement cycle of the most recent overdraft protection transfer, that is
      the most recent withdrawal on this account with channel overdraft_transfer, taken only when its
      counterparty is a checking account of the same customer; when that counterparty is not one of the
      customer's checking accounts, no amount is computed under this policy. When overdraft protection
      transfers to different accounts posted on that most recent date, the records do not show which of them
      is the most recent, and no amount is computed under this policy. First add up every overdraft
      protection transfer of that cycle, whichever of the customer's checking accounts it covered. Then add
      the withdrawal fees the account bears for the cycle, which are the amounts of the excess_withdrawal fee
      rows of the cycle less the amounts of every excess_withdrawal fee refund posted in the cycle, whatever
      its ground, taken as zero if negative; unlike the fee coverage used when excess fees are reconciled, a
      courtesy refund also reduces what the account bears. The monthly amount is that sum rounded half-up to
      the cent, raised to the tier's automatic_transfer_min_amount when the sum is below it. The funding
      checking account, the transfer day from 1 to 28 and the rest of the owner's instruction follow
      savings_evt_automatic_transfer unchanged. The fees the account bears are counted only after every
      excess withdrawal fee refund and every excess withdrawal fee owed for the cycle has been posted. This
      policy is applied only when all of the following hold, each read from the records and each a
      condition for applying the policy that the computed amount does not test: the cycle so found is the
      current statement cycle, the cycle that closes on the next statement cycle closing date, as the frozen
      date and the account's statement_cycle_day show; no transaction on the account has a posted_date later
      than the frozen date, as the ledger shows, so that every refund and fee the amount must reflect has
      posted, since a refund or fee made on a Saturday, Sunday or Federal Reserve holiday posts on the next
      business day; and every excess withdrawal fee refund posted in the cycle refunds a fee of that same
      cycle, as its source_item_id shows. When any of them fails, no amount is computed under this policy.
    prerequisite:
      - problem: savings_ext_counted_withdrawal_fee_assessment
        kind: value_input
        gate: fees_net
        condition: >-
          Every excess withdrawal fee owed for the cycle has been charged before the monthly replenishment
          amount is computed.
        policy_source: >-
          The fees the account bears are counted only after every excess withdrawal fee refund and every
          excess withdrawal fee owed for the cycle has been posted.
        resolved_by: assess_savings_withdrawal_fee_aafc1fb2
        effect: >-
          fees_net rises by the owed excess withdrawal fee, so the monthly amount rises by the same amount.
      - problem: savings_ext_certificate_funding_fee_refund
        kind: value_input
        gate: fees_net
        condition: >-
          Every excess withdrawal fee refund owed for the cycle has been posted before the monthly
          replenishment amount is computed.
        policy_source: >-
          The fees the account bears are counted only after every excess withdrawal fee refund and every
          excess withdrawal fee owed for the cycle has been posted.
        resolved_by: refund_savings_withdrawal_fee_774e6cc0
        effect: >-
          fees_net falls by the refunded fee, so the monthly amount falls by the same amount.
    cross_category:
      - category: checking
        as: branch
        reads: [checking_account_id]
        note: Whether the counterparty of the most recent overdraft protection transfer is one of the customer's checking accounts decides whether an amount is computed and from which cycle.
    compute:
      - od_d: "LATEST('savings_transactions','posted_date', date_field='posted_date', event_type='savings_withdrawal', channel='overdraft_transfer')"
      - od_cp: "LATEST('savings_transactions','counterparty_account_id', date_field='posted_date', event_type='savings_withdrawal', channel='overdraft_transfer', posted_date=od_d)"
      - od_same: "COUNT('savings_transactions', event_type='savings_withdrawal', channel='overdraft_transfer', posted_date=od_d) == COUNT('savings_transactions', event_type='savings_withdrawal', channel='overdraft_transfer', posted_date=od_d, counterparty_account_id=od_cp)"
      - od_chk: "CFIELD('checking','checking_account_id', checking_account_id=od_cp) if od_same else None"
      - cyc: "LATEST('savings_transactions','statement_cycle', date_field='posted_date', event_type='savings_withdrawal', channel='overdraft_transfer') if od_chk != None else None"
      - od_total: "SUM('savings_transactions','amount', event_type='savings_withdrawal', channel='overdraft_transfer', statement_cycle=cyc)"
      - fees: "SUM('savings_transactions','amount', event_type='savings_fee', fee_code='excess_withdrawal', statement_cycle=cyc)"
      - refunds: "SUM('savings_transactions','amount', event_type='savings_fee_refund', fee_code='excess_withdrawal', statement_cycle=cyc)"
      - fees_net: "MX(fees - refunds, 0)"
      - need: "od_total + fees_net"
      - floor: "P('automatic_transfer_min_amount')"
      - result: "0 if od_chk == None else (RND(floor) if need < floor else RND(need))"
    compute_basis:
      od_d: "the cycle is the statement cycle of the most recent overdraft protection transfer, that is the most recent withdrawal on this account with channel overdraft_transfer"
      od_same: "When overdraft protection transfers to different accounts posted on that most recent date, the records do not show which of them is the most recent, and no amount is computed under this policy."
      od_cp: "the cycle is the statement cycle of the most recent overdraft protection transfer, that is the most recent withdrawal on this account with channel overdraft_transfer"
      od_chk: "taken only when its counterparty is a checking account of the same customer; when that counterparty is not one of the customer's checking accounts, no amount is computed under this policy."
      cyc: "the cycle is the statement cycle of the most recent overdraft protection transfer, that is the most recent withdrawal on this account with channel overdraft_transfer"
      od_total: "First add up every overdraft protection transfer of that cycle, whichever of the customer's checking accounts it covered."
      fees: "Then add the withdrawal fees the account bears for the cycle, which are the amounts of the excess_withdrawal fee rows of the cycle less the amounts of every excess_withdrawal fee refund posted in the cycle, whatever its ground, taken as zero if negative"
      refunds: "less the amounts of every excess_withdrawal fee refund posted in the cycle, whatever its ground, taken as zero if negative"
      fees_net: "Then add the withdrawal fees the account bears for the cycle, which are the amounts of the excess_withdrawal fee rows of the cycle less the amounts of every excess_withdrawal fee refund posted in the cycle, whatever its ground, taken as zero if negative"
      floor: "The monthly amount is that sum rounded half-up to the cent, raised to the tier's automatic_transfer_min_amount when the sum is below it."
      result: "The monthly amount is that sum rounded half-up to the cent, raised to the tier's automatic_transfer_min_amount when the sum is below it."
    inputs:
      history:
        - {table: savings_transactions, aggregate: sum, field: amount, filters: {event_type: savings_withdrawal, channel: overdraft_transfer}}
        - {table: savings_transactions, aggregate: sum, field: amount, filters: {event_type: savings_fee, fee_code: excess_withdrawal}}
        - {table: savings_transactions, aggregate: sum, field: amount, filters: {event_type: savings_fee_refund, fee_code: excess_withdrawal}}
      cross_category: [checking]

# ============================================================================
# workflows (exactly one)
# ============================================================================
workflows:
  - id: savings_wf_dormant_account_wakeup_and_upgrade
    scenario: >-
      Applies to a dormant savings or money market account whose identity-verified owner, in one contact on
      a business day (Monday through Friday, other than a Federal Reserve holiday), moves certificate money out of it by telephone transfer to their own checking account and asks to move
      the account up to the highest-ranked money market tier they qualify for. The owner's transfer is the
      customer-initiated transaction that reactivates the account, any maintenance fee owed back on the
      account is refunded, and the conversion is decided on the corrected balance. When it is done the
      account is active with the posted date of the owner's transfer, which is the day of the contact, as
      its latest customer-initiated activity, carries the refund credit and the transfer, and holds the target tier, or keeps its tier when no higher tier qualifies.
    steps:
      - {tool: transfer_savings_to_checking_5f60835b, owner: user, writes: savings_transactions, subject: savings_withdrawal, base_policy_refs: [savings_evt_withdrawal_allowance, savings_evt_closure], role: owner-instructed reactivating transfer of certificate money, computed_by: [savings_ext_certificate_proceeds_transfer]}
      - {tool: reactivate_savings_account_bfe70db1, owner: agent, writes: savings_accounts, subject: savings_reactivate, base_policy_refs: [savings_evt_dormancy], role: reactivation dated by the owner's transfer, computed_by: [savings_ext_same_contact_reactivation]}
      - {tool: refund_savings_maintenance_fee_bf99bb2f, owner: agent, writes: savings_transactions, subject: savings_fee_refund, base_policy_refs: [savings_evt_fee_refund], role: bank-error refund of the maintenance fee under the base waivers, computed_by: []}
      - {tool: convert_savings_tier_d500151b, owner: agent, writes: savings_accounts, subject: savings_change_product, base_policy_refs: [savings_product_change], role: conversion to the highest qualifying money market tier, computed_by: [savings_ext_best_money_market_conversion]}
    dataflow:
      - from_step: 0
        to_step: 1
        kind: object_binding
        source_table: savings_transactions
        source_field: posted_date
        consumer_bindings:
          - action_arg: reactivation_date
            role: direct
      - from_step: 1
        to_step: 3
        kind: state_effect
        source_table: savings_accounts
        source_field: status
        consumer_bindings: []
        establishes_gates:
          - policy_id: savings_product_change
            eligibility_id: must_be_active
            evidence_field: savings_accounts.status
    order_rationale: >-
      The owner's transfer comes before the reactivation because savings_evt_dormancy requires a
      customer-initiated transaction in the same contact to reactivate a dormant account and makes that
      transaction's date the new last_customer_activity_date; reactivating first would have no transaction
      and no date to record. The reactivation comes directly after the transaction that
      justifies it, because savings_evt_dormancy ties it to that transaction in the same contact; the fee
      refund and the reactivation change different records and commute, so no policy outcome depends on
      their relative order, and the procedure places the refund third only so that it has one fixed
      sequence. The fee
      refund comes before the conversion because savings_ext_best_money_market_conversion compares the
      balance after every refund owed on the account has posted with each tier's minimum_opening_deposit;
      converting first would test the uncorrected balance. The reactivation also precedes the conversion
      because savings_product_change requires the account to be active when the conversion is recorded.
      Every step is a synchronous posting or status change completed at the same moment of the contact,
      and none waits for an outside event or for time to pass: on a business day the owner's transfer and
      the refund post on the day of the contact, while on a Saturday, Sunday or Federal Reserve holiday
      the transfer would post only on the next business day, so savings_ext_same_contact_reactivation
      establishes no reactivation date and the procedure does not apply.
    prerequisite: []
