      rounded_courtesy_credit: "Where two or three deposits posted in that window, it is truncated to the dime. Where fewer than two deposits posted in that window, it is rounded half up to the cent."
      withdrawal_count_year: "Where five or more withdrawals posted to the account in the twelve calendar months ending on the review date, only the allowance amount binds the rounded courtesy credit."
      capped_courtesy_credit: "Where three or four withdrawals posted in that window, only the courtesy ceiling of 24.00 USD binds it. Where fewer than three withdrawals posted in that window, the credit booked is the lesser of the rounded courtesy credit, the allowance amount and the courtesy ceiling."
