      transfer_ceiling: "Where one deposit posted in that window, the transfer ceiling is 20,000.00 USD. Where no deposit posted in that window, the transfer ceiling is 5,000.00 USD."
      result: "The amount moved is rounded half up to the cent, never less than 100.00 USD, and never more than the transfer ceiling of 5,000.00 USD."
    factors:
