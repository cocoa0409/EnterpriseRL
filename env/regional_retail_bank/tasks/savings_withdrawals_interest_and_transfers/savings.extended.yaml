  - id: savings_ext_periodic_fee_courtesy_credit
    base_policy_refs: [savings_evt_fee_refund]
    overwrite:
      - base_policy: savings_evt_fee_refund
        superseded_clause: >-
          A fee is refunded in full, never in part, as one savings_fee_refund row whose source_item_id is the fee row.
        replaced_by: >-
          A courtesy credit for the periodic fees standing on a savings or money market account is booked as one entry carrying the courtesy credit for the whole review, and that entry is booked against the most recently posted monthly maintenance fee on the account.
      - base_policy: savings_evt_fee_refund
        superseded_clause: >-
          The fee must have posted no more than courtesy_refund_window_days calendar days before the courtesy refund is granted.
        replaced_by: >-
          Because the courtesy credit is booked as one entry for the whole review rather than one entry for each fee, the courtesy window is tested once, against the fee entry the credit is booked against, and not against each fee in the refundable fee pool.
    trigger: state_due
    subject: [savings_fee_refund]
    computes: refund_amount
    target_tool: credit_savings_courtesy_refund_0ed102a0
    params:
      tier_limit_high: 2
      tier_limit_mid: 1
      checking_used_ceiling: 0
      extra_high: 2
      extra_mid: 1
      card_year_high: 5
      card_year_mid: 3
      rewards_floor: 10000
      fee_count_high: 5
      fee_count_mid: 3
      young_account_months: 12
      goodwill_high: 0.90
      goodwill_mid: 0.75
      goodwill_standard: 0.50
      deposit_year_high: 4
      deposit_year_mid: 2
      withdrawal_year_high: 5
      withdrawal_year_mid: 3
      courtesy_ceiling: 24.00
    rule: >
      A courtesy credit for the periodic fees standing on a savings or money market account is booked as one entry
      carrying the courtesy credit for the whole review, and that entry is booked against the most recently posted
      monthly maintenance fee on the account. Because the courtesy credit is booked as one entry for the whole
      review rather than one entry for each fee, the courtesy window is tested once, against the fee entry the
      credit is booked against, and not against each fee in the refundable fee pool. The refundable fee pool is the
      monthly maintenance fee posted to the account in the one calendar month ending on the review date. The courtesy allowance count is the tier's
      courtesy refund limit for a rolling 365 days, and the allowance amount is that count, less the savings
      courtesy credits already granted in the twelve calendar months ending on the review date and taken as no less
      than zero, multiplied by the tier's monthly maintenance fee. The goodwill share of the refundable fee pool is
      one half. The courtesy credit before any ceiling is the refundable fee pool multiplied by the goodwill share,
      rounded half up to the cent. The courtesy ceiling is 24.00 USD, and the credit booked is the lesser of the
      rounded courtesy credit, the allowance amount and the courtesy ceiling, taken as no less than zero.

      The refundable fee pool widens with the owner's card relationship. Where at least five card purchases posted
      on the owner's Piedmont Crescent Bank credit card in the twelve calendar months ending on the review date and
      the card carries at least 10,000 unredeemed rewards points, the refundable fee pool is every monthly
      maintenance fee and every paper statement fee posted to the account in those twelve calendar months. Where
      three or four card purchases posted in that window and the card carries at least 10,000 unredeemed rewards
      points, the refundable fee pool is the monthly maintenance fees posted in the three calendar months ending on
      the review date. Where fewer than three card purchases posted in that window, or the card carries fewer than
      10,000 unredeemed rewards points, the pool stays as the monthly maintenance fee posted in the one calendar
      month ending on the review date.

      The courtesy allowance count is widened by the owner's checking relationship. Where the owner's checking tier
      allows at least two courtesy fee refunds in a rolling 365 days and no checking courtesy refund posted in the
      twelve calendar months ending on the review date, the courtesy allowance count is the savings tier's courtesy
      refund limit plus two. Where that checking tier allows exactly one courtesy fee refund in a rolling 365 days
      and no checking courtesy refund posted in that window, it is the savings tier's courtesy refund limit plus
      one. Where the checking tier allows no courtesy fee refund, or any checking courtesy refund posted in that
      window, the courtesy allowance count is the savings tier's courtesy refund limit alone.

      The goodwill share rises with the fee burden the account has carried. Where five or more fee entries posted to
      the account in the twelve calendar months ending on the review date and the account has been open no more than
      twelve whole months, the goodwill share is nine tenths. Where three or four fee entries posted in that window
      and the account has been open no more than twelve whole months, it is three quarters. Where fewer than three
      fee entries posted in that window, or the account has been open more than twelve whole months, the goodwill
      share stays at one half.

      How the courtesy credit is rounded follows the deposit history of the account. Where four or more deposits
      posted to the account in the twelve calendar months ending on the review date, the courtesy credit is rounded
      half up to the whole dollar. Where two or three deposits posted in that window, it is truncated to the dime.
      Where fewer than two deposits posted in that window, it is rounded half up to the cent.

      Which ceiling binds the credit follows the withdrawal history of the account. Where five or more withdrawals
      posted to the account in the twelve calendar months ending on the review date, only the allowance amount binds
      the rounded courtesy credit. Where three or four withdrawals posted in that window, only the courtesy ceiling
      of 24.00 USD binds it. Where fewer than three withdrawals posted in that window, the credit booked is the
      lesser of the rounded courtesy credit, the allowance amount and the courtesy ceiling.
