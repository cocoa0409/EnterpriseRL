      allowance_amount: "The courtesy allowance count is the tier's courtesy refund limit for a rolling 365 days, and the allowance amount is that count, less the savings courtesy credits already granted in the twelve calendar months ending on the review date and taken as no less than zero, multiplied by the tier's monthly maintenance fee."
      fee_count_twelve_month: "Where five or more fee entries posted to the account in the twelve calendar months ending on the review date and the account has been open no more than twelve whole months, the goodwill share is nine tenths."
