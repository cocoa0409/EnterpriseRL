        evidence: [cross_category, history]
        cross_difficulty: card
      - id: courtesy_allowance_width
        effect: parameter
        decides: allowed_refund_count
        bindings: [checking_tier_limit, checking_courtesy_count, allowed_refund_count]
        ladder:
          - when: "the owner's checking tier allows at least two courtesy fee refunds in a rolling 365 days and no checking courtesy refund posted in the twelve calendar months ending on the review date"
