      interest_row_count_year: "Where three or more interest entries posted to the account in the twelve calendar months ending on the instruction date, the amount moved is rounded half up to the whole dollar."
      rounded_amount: "Where one or two interest entries posted in that window, it is truncated to the whole hundred dollars. Where no interest entry posted in that window, it is rounded half up to the cent."
