      - goodwill_share: "K('goodwill_high') if (fee_count_twelve_month >= K('fee_count_high') and months_since_opening <= K('young_account_months')) else (K('goodwill_mid') if (fee_count_twelve_month >= K('fee_count_mid') and months_since_opening <= K('young_account_months')) else K('goodwill_standard'))"
      - raw_courtesy_credit: "refundable_fee_pool * goodwill_share"
      - deposit_count_year: "COUNT('savings_transactions', within_months=12, date_field='posted_date', event_type='savings_deposit')"
      - rounded_courtesy_credit: "float(int(raw_courtesy_credit + 0.5)) if (deposit_count_year >= K('deposit_year_high')) else (float(int(raw_courtesy_credit * 10.0)) / 10.0 if (deposit_count_year >= K('deposit_year_mid')) else RND(raw_courtesy_credit, 2))"
      - withdrawal_count_year: "COUNT('savings_transactions', within_months=12, date_field='posted_date', event_type='savings_withdrawal')"
      - capped_courtesy_credit: "MN(rounded_courtesy_credit, allowance_amount) if (withdrawal_count_year >= K('withdrawal_year_high')) else (MN(rounded_courtesy_credit, K('courtesy_ceiling')) if (withdrawal_count_year >= K('withdrawal_year_mid')) else MN(rounded_courtesy_credit, MN(allowance_amount, K('courtesy_ceiling'))))"
      - result: "MX(0.0, capped_courtesy_credit)"
