  - id: savings_ext_relationship_bonus_correction
    base_policy_refs: [savings_agg_relationship_bonus_allocation, savings_evt_interest, savings_evt_bonus_interest]
    overwrite:
      - base_policy: savings_agg_relationship_bonus_allocation
        superseded_clause: >-
          Each day, the customer's savings balances eligible for the bonus are taken in the order given by savings_msr_combined_bonus_base, highest balance first and ties to the earlier opened_date, and the bonus is paid on each account's balance only until the running combined total reaches that account's relationship_bonus_balance_cap; balance above the running cap earns no bonus.
        replaced_by: >-
          The relationship bonus owed on a savings or money market account for a closed statement cycle is settled on the bonus balance basis, which starts from the bonus ledger basis, being the account's posted total of deposits and interest credited less the withdrawals posted to it, taken as no less than zero.
      - base_policy: savings_evt_interest
        superseded_clause: >-
          Each day's interest is balance times APY divided by 100 and by interest_day_count_basis; daily amounts are summed unrounded per component and each component total is rounded half-up to the cent.
        replaced_by: >-
          The relationship bonus owed is the bonus balance basis multiplied by the bonus rate that applies, divided by 100, multiplied by the bonus review span in days and divided by the day count basis of 365, and that figure is rounded half up to the cent.
    trigger: state_due
    subject: [savings_interest_credit]
    computes: bonus_amount
    target_tool: post_relationship_bonus_correction_5bb15040
    params:
      checking_balance_high: 6000.00
      checking_balance_mid: 2500.00
      direct_deposit_floor: 3000.00
      uplift_high: 0.85
      uplift_mid: 0.35
      card_balance_low: 1500.00
      card_balance_mid: 4000.00
      card_payment_floor: 1000.00
      deposit_count_high: 3
      deposit_count_mid: 2
      young_account_months: 12
      span_long: 90
      span_mid: 60
      span_standard: 31
      fee_count_high: 5
      fee_count_mid: 3
      thirty_day_factor: 0.9863
      withdrawal_year_high: 5
      withdrawal_year_mid: 3
      day_count_commercial: 360
      day_count_basis: 365
    rule: >
      The relationship bonus owed on a savings or money market account for a closed statement cycle is settled on
      the bonus balance basis, which starts from the bonus ledger basis, being the account's posted total of
      deposits and interest credited less the withdrawals posted to it, taken as no less than zero. The bonus
      ledger basis is then further reduced by the withdrawals posted in the three calendar months ending on the
      review date, and the reduced figure, taken as no less than zero and capped at the tier's relationship bonus
      balance cap, is the bonus balance basis. The bonus review span is the thirty-one days of the closed statement month. The bonus rate
      that applies is the tier's relationship bonus annual percentage yield. The relationship bonus owed is the
      bonus balance basis multiplied by the bonus rate that applies, divided by 100, multiplied by the bonus review
      span in days and divided by the day count basis of 365, and that figure is rounded half up to the cent. The
      relationship bonus already credited on the account in the one calendar month ending on the review date is
      then deducted, and the bonus correction booked is the remainder, taken as no less than zero.

      The relationship bonus owed for a closed statement cycle is settled only after the promotional interest due
      on that cycle's new money stands credited on the account.

      The bonus rate is lifted for owners whose checking relationship is substantial. Where the owner's Piedmont
      Crescent Bank checking account carries a ledger balance of at least 6,000.00 USD and received at least
      3,000.00 USD of direct deposits in the three calendar months ending on the review date, the tier's
      relationship bonus annual percentage yield is lifted by 0.85 percentage points. Where that ledger balance is
      at least 2,500.00 USD but below 6,000.00 USD and those direct deposits are at least 3,000.00 USD, it is
      lifted by 0.35 percentage points. Where that ledger balance is below 2,500.00 USD, or those direct deposits
      are below 3,000.00 USD, the tier's relationship bonus annual percentage yield applies unchanged.

      How far the bonus ledger basis is further reduced turns on the owner's credit card standing. Where the card
      balance owed is no more than 1,500.00 USD and card payments of at least 1,000.00 USD posted in the three
      calendar months ending on the review date, no further reduction is made and the bonus ledger basis itself
      stands as the figure to be capped. Where the card balance owed is more than 1,500.00 USD but no more than
      4,000.00 USD and those card payments are at least 1,000.00 USD, the further reduction is only the
      withdrawals posted in the one calendar month ending on the review date. Where the card balance owed is more
      than 4,000.00 USD, or those card payments are below 1,000.00 USD, the further reduction is the withdrawals
      posted in the three calendar months ending on the review date. The cap is applied after that further
      reduction, never before it.

      The bonus review span is lengthened for accounts still building their balance. Where at least three deposits
      posted to the account in the three calendar months ending on the review date and the account has been open no
      more than twelve whole months, the bonus review span is 90 days. Where two deposits posted in that window and
      the account has been open no more than twelve whole months, the bonus review span is 60 days. Where fewer
      than two deposits posted in that window, or the account has been open more than twelve whole months, the
      bonus review span is the thirty-one days of the closed statement month.

      The day count convention follows the fee history of the account. Where five or more fee entries posted to the
      account in the three calendar months ending on the review date, the bonus review span in days is divided by a
      commercial year of 360 days. Where three or four fee entries posted in that window, the bonus review span is
      first restated as whole thirty-day months by multiplying it by 0.9863 and rounding to a whole day, and that
      restated span is divided by the commercial year of 360 days. Where fewer than three fee entries posted in
      that window, the bonus review span in days is divided by the day count basis of 365.

      What is deducted as already credited follows the withdrawal history of the account. Where five or more
      withdrawals posted to the account in the twelve calendar months ending on the review date, every relationship
      bonus amount credited in the three calendar months ending on the review date is deducted. Where three or four
      withdrawals posted in that twelve-month window, only the most recently credited relationship bonus amount is
      deducted. Where fewer than three withdrawals posted in that twelve-month window, the relationship bonus
      already credited on the account in the one calendar month ending on the review date is deducted.
    prerequisite:
      - problem: savings_ext_promotional_interest_correction
        kind: value_input
        gate: bonus_ledger_basis
        form: state
        policy_source: >-
          The relationship bonus owed for a closed statement cycle is settled only after the promotional interest due on that cycle's new money stands credited on the account.
        condition: >-
          The account's ledger carries promotional interest credits for the closed statement cycle that together cover the promotional interest due on that cycle's new money, so that the posted total of deposits and interest credited already includes it.
        resolved_by: post_promotional_interest_correction_acb0ec5b
        effect: >-
          The bonus ledger basis rises by the promotional interest credited for the closed cycle, so the bonus balance basis, the relationship bonus owed and the correction booked all rise with it.
    cross_category:
      - category: checking
        as: branch
        reads: [ledger_balance, checking_transactions.amount, checking_transactions.channel]
        note: "The owner's checking ledger balance and the direct deposits credited to it in the three calendar months ending on the review date decide which bonus rate step applies."
      - category: card
        as: branch
        reads: [current_balance, card_transactions.amount, card_transactions.event_type]
        note: "The card balance owed and the card payments posted in the three calendar months ending on the review date decide which withdrawals are netted out of the bonus balance basis."
    compute:
      - deposits_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_deposit')"
      - interest_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_interest_credit')"
      - withdrawals_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_withdrawal')"
      - bonus_ledger_basis: "MX(0.0, deposits_all + interest_all - withdrawals_all)"
      - checking_balance: "CFIELD('checking','ledger_balance')"
      - checking_direct_deposits: "XSUM('checking','checking_transactions','amount', within_months=3, date_field='posted_date', channel='ach_direct_deposit')"
      - applied_bonus_rate: "(P('relationship_bonus_apy') + K('uplift_high')) if (checking_balance >= K('checking_balance_high') and checking_direct_deposits >= K('direct_deposit_floor')) else ((P('relationship_bonus_apy') + K('uplift_mid')) if (checking_balance >= K('checking_balance_mid') and checking_direct_deposits >= K('direct_deposit_floor')) else P('relationship_bonus_apy'))"
      - withdrawals_one_month: "SUM('savings_transactions','amount', within_months=1, date_field='posted_date', event_type='savings_withdrawal')"
      - withdrawals_three_month: "SUM('savings_transactions','amount', within_months=3, date_field='posted_date', event_type='savings_withdrawal')"
      - card_balance: "CFIELD('card','current_balance')"
      - card_payments_three_month: "XSUM('card','card_transactions','amount', within_months=3, date_field='posted_date', event_type='card_payment')"
      - bonus_basis: "MN(P('relationship_bonus_balance_cap'), MX(0.0, bonus_ledger_basis)) if (card_balance <= K('card_balance_low') and card_payments_three_month >= K('card_payment_floor')) else (MN(P('relationship_bonus_balance_cap'), MX(0.0, bonus_ledger_basis - withdrawals_one_month)) if (card_balance <= K('card_balance_mid') and card_payments_three_month >= K('card_payment_floor')) else MN(P('relationship_bonus_balance_cap'), MX(0.0, bonus_ledger_basis - withdrawals_three_month)))"
      - deposit_count_three_month: "COUNT('savings_transactions', within_months=3, date_field='posted_date', event_type='savings_deposit')"
      - months_since_opening: "MONTHS(F('opened_date'), NOW)"
      - bonus_span_days: "K('span_long') if (deposit_count_three_month >= K('deposit_count_high') and months_since_opening <= K('young_account_months')) else (K('span_mid') if (deposit_count_three_month >= K('deposit_count_mid') and months_since_opening <= K('young_account_months')) else K('span_standard'))"
      - fee_count_three_month: "COUNT('savings_transactions', within_months=3, date_field='posted_date', event_type='savings_fee')"
      - raw_bonus: "RND(bonus_basis * applied_bonus_rate / 100.0 * bonus_span_days / K('day_count_commercial'), 2) if (fee_count_three_month >= K('fee_count_high')) else (RND(bonus_basis * applied_bonus_rate / 100.0 * RND(bonus_span_days * K('thirty_day_factor'), 0) / K('day_count_commercial'), 2) if (fee_count_three_month >= K('fee_count_mid')) else RND(bonus_basis * applied_bonus_rate / 100.0 * bonus_span_days / K('day_count_basis'), 2))"
      - credited_bonus_one_month: "SUM('savings_transactions','amount', within_months=1, date_field='posted_date', event_type='savings_interest_credit', interest_component='relationship_bonus')"
      - credited_bonus_three_month: "SUM('savings_transactions','amount', within_months=3, date_field='posted_date', event_type='savings_interest_credit', interest_component='relationship_bonus')"
      - latest_bonus_amount: "LATEST('savings_transactions','amount', date_field='posted_date', event_type='savings_interest_credit', interest_component='relationship_bonus')"
      - withdrawal_count_year: "COUNT('savings_transactions', within_months=12, date_field='posted_date', event_type='savings_withdrawal')"
      - bonus_already_paid: "credited_bonus_three_month if (withdrawal_count_year >= K('withdrawal_year_high')) else (latest_bonus_amount if (withdrawal_count_year >= K('withdrawal_year_mid')) else credited_bonus_one_month)"
      - result: "MX(0.0, RND(raw_bonus - bonus_already_paid, 2))"
    compute_basis:
