        - {category: checking, table: checking_transactions, aggregate: count, field: checking_txn_id, within_months: 12, filters: {event_type: checking_fee_refund, adjustment_reason: courtesy_waiver}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_purchase}}
      cross_category: [checking, card]

  - id: savings_ext_standing_transfer_amount
    base_policy_refs: [savings_evt_automatic_transfer]
    overwrite: []
    trigger: on_request
    subject: [savings_set_automatic_transfer]
    computes: transfer_amount
    target_tool: set_savings_standing_transfer_55216172
    params:
      checking_balance_high: 6000.00
      checking_balance_mid: 2500.00
      direct_deposit_floor: 3000.00
      cushion_high: 250.00
      cushion_mid: 100.00
      recent_deposit_high: 2000.00
      recent_deposit_mid: 750.00
      offset_cap_high: 400.00
      offset_cap_mid: 200.00
      card_purchase_high: 4
      card_purchase_mid: 2
      rewards_floor: 10000
      spread_short: 2
      spread_mid: 3
      spread_standard: 4
      withdrawal_count_high: 3
      withdrawal_count_mid: 2
      pace_high: 1.25
      pace_mid: 1.10
      young_account_months: 12
      mid_account_months: 36
      recent_out_high: 2000.00
      recent_out_mid: 800.00
      ceiling_high: 900.00
      ceiling_mid: 500.00
      ceiling_standard: 250.00
    rule: >
      The qualifying recurring amount for a standing monthly transfer into a savings or money market account closes
      the qualifying shortfall between the account's posted balance and its balance target. The posted balance is
      the total of the deposits, interest credits and fee refunds posted to the account less the withdrawals and
      fees posted to it, taken as no less than zero. The balance target is the tier's minimum daily balance waiver
      threshold. The qualifying shortfall is the balance target less the posted balance, taken as no less than
      zero, and no deposit already posted is set against it. The spread period is four months, and the paced
      instalment is the qualifying shortfall divided by the spread period with no pacing adjustment. The paced
      instalment is rounded half up to the cent, then raised to the tier's minimum automatic transfer amount where
      it falls below it, and the qualifying recurring amount is the lesser of that figure and the standing transfer
      ceiling of 250.00 USD.

      The qualifying recurring amount is worked out only after the account's posted balance carries the
      relationship bonus owed for every closed statement cycle.

      Before the qualifying recurring amount is fixed, the courtesy credit owed against the periodic fees standing
      on the account must already appear in its posted balance.

      The balance target is raised above the waiver threshold for owners with a strong checking relationship. Where
      the owner's Piedmont Crescent Bank checking account carries a ledger balance of at least 6,000.00 USD and
      received at least 3,000.00 USD of direct deposits in the three calendar months ending on the instruction
      date, the balance target is the tier's minimum daily balance waiver threshold plus 250.00 USD. Where that
      ledger balance is at least 2,500.00 USD but below 6,000.00 USD and those direct deposits are at least
      3,000.00 USD, it is that threshold plus 100.00 USD. Where that ledger balance is below 2,500.00 USD, or those
      direct deposits are below 3,000.00 USD, the balance target is the tier's minimum daily balance waiver
      threshold.

      Money that has recently reached the account is set against the shortfall within a ceiling. Where at least
      2,000.00 USD of deposits posted to the account in the one calendar month ending on the instruction date, the
      shortfall is reduced by those deposits up to a ceiling of 400.00 USD, and never below zero. Where at least
      750.00 USD but less than 2,000.00 USD of deposits posted in that window, the shortfall is reduced by those
      deposits up to a ceiling of 200.00 USD, and never below zero. Where less than 750.00 USD of deposits posted
      in that window, no deposit already posted is set against it.

      The spread period shortens for owners who use their Piedmont Crescent Bank credit card. Where at least four
      card purchases posted in the three calendar months ending on the instruction date and the card carries at
      least 10,000 unredeemed rewards points, the spread period is two months. Where two or three card purchases
      posted in that window and the card carries at least 10,000 unredeemed rewards points, the spread period is
      three months. Where fewer than two card purchases posted in that window, or the card carries fewer than
      10,000 unredeemed rewards points, the spread period is four months.

      The paced instalment carries a pacing adjustment for accounts that money leaves often. Where three or more
      withdrawals posted to the account in the three calendar months ending on the instruction date, the instalment
      is the shortfall divided by the spread period and then multiplied by 1.25, kept to four decimal places. Where
      two withdrawals posted in that window, it is that quotient multiplied by 1.10, kept to four decimal places.
      Where fewer than two withdrawals posted in that window, the instalment is the quotient with no pacing
      adjustment.

      How the instalment is rounded follows the age of the account. Where the account has been open no more than
      twelve whole months, the instalment is rounded half up to the whole dollar. Where the account has been open
      more than twelve whole months but no more than thirty-six whole months, it is truncated to the whole dollar.
      Where the account has been open more than thirty-six whole months, it is rounded half up to the cent.

      The standing transfer ceiling follows how much money has recently left the account. Where at least 2,000.00
      USD of withdrawals posted in the one calendar month ending on the instruction date, the standing transfer
      ceiling is 900.00 USD. Where at least 800.00 USD but less than 2,000.00 USD of withdrawals posted in that
      window, it is 500.00 USD. Where less than 800.00 USD of withdrawals posted in that window, the standing
      transfer ceiling is 250.00 USD.
    prerequisite:
      - problem: savings_ext_relationship_bonus_correction
        kind: value_input
        gate: posted_balance
        form: state
        policy_source: >-
          The qualifying recurring amount is worked out only after the account's posted balance carries the relationship bonus owed for every closed statement cycle.
        condition: >-
          The account's ledger carries a relationship bonus interest credit for every closed statement cycle whose bonus is still owed, so the posted balance already includes it.
        resolved_by: post_relationship_bonus_correction_5bb15040
        effect: >-
          The posted balance rises by the relationship bonus credited for the closed cycle, so the qualifying shortfall falls and the qualifying recurring amount falls with it.
      - problem: savings_ext_periodic_fee_courtesy_credit
        kind: value_input
        gate: posted_balance
        form: state
        policy_source: >-
          Before the qualifying recurring amount is fixed, the courtesy credit owed against the periodic fees standing on the account must already appear in its posted balance.
        condition: >-
          The account's ledger carries a courtesy credit entry booked against the periodic fees standing on it, so the posted balance already includes that credit.
        resolved_by: credit_savings_courtesy_refund_0ed102a0
        effect: >-
          The posted balance rises by the courtesy credit booked against the periodic fees, so the qualifying shortfall falls and the qualifying recurring amount falls with it.
    cross_category:
      - category: checking
        as: branch
        reads: [ledger_balance, checking_transactions.amount, checking_transactions.channel]
        note: "The owner's checking ledger balance and the direct deposits credited to it in the three calendar months ending on the instruction date decide how far above the waiver threshold the balance target sits."
      - category: card
        as: branch
        reads: [rewards_balance, card_transactions.event_type]
        note: "The card purchases posted in the three calendar months ending on the instruction date and the card's unredeemed rewards points decide the spread period."
    compute:
      - deposits_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_deposit')"
      - interest_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_interest_credit')"
      - refunds_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_fee_refund')"
      - withdrawals_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_withdrawal')"
      - fees_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_fee')"
      - posted_balance: "MX(0.0, deposits_all + interest_all + refunds_all - withdrawals_all - fees_all)"
      - checking_balance: "CFIELD('checking','ledger_balance')"
      - checking_direct_deposits: "XSUM('checking','checking_transactions','amount', within_months=3, date_field='posted_date', channel='ach_direct_deposit')"
      - balance_target: "(P('waiver_min_daily_balance') + K('cushion_high')) if (checking_balance >= K('checking_balance_high') and checking_direct_deposits >= K('direct_deposit_floor')) else ((P('waiver_min_daily_balance') + K('cushion_mid')) if (checking_balance >= K('checking_balance_mid') and checking_direct_deposits >= K('direct_deposit_floor')) else P('waiver_min_daily_balance'))"
      - qualifying_shortfall: "MX(0.0, balance_target - posted_balance)"
      - deposits_one_month: "SUM('savings_transactions','amount', within_months=1, date_field='posted_date', event_type='savings_deposit')"
      - net_shortfall: "MX(0.0, qualifying_shortfall - MN(deposits_one_month, K('offset_cap_high'))) if (deposits_one_month >= K('recent_deposit_high')) else (MX(0.0, qualifying_shortfall - MN(deposits_one_month, K('offset_cap_mid'))) if (deposits_one_month >= K('recent_deposit_mid')) else qualifying_shortfall)"
      - card_purchase_count: "XCOUNT('card','card_transactions', within_months=3, date_field='posted_date', event_type='card_purchase')"
      - card_rewards_points: "CFIELD('card','rewards_balance')"
      - spread_months: "K('spread_short') if (card_purchase_count >= K('card_purchase_high') and card_rewards_points >= K('rewards_floor')) else (K('spread_mid') if (card_purchase_count >= K('card_purchase_mid') and card_rewards_points >= K('rewards_floor')) else K('spread_standard'))"
      - monthly_raw: "net_shortfall / spread_months"
      - withdrawal_count_three_month: "COUNT('savings_transactions', within_months=3, date_field='posted_date', event_type='savings_withdrawal')"
      - paced_instalment: "RND(monthly_raw * K('pace_high'), 4) if (withdrawal_count_three_month >= K('withdrawal_count_high')) else (RND(monthly_raw * K('pace_mid'), 4) if (withdrawal_count_three_month >= K('withdrawal_count_mid')) else monthly_raw)"
      - months_since_opening: "MONTHS(F('opened_date'), NOW)"
      - rounded_instalment: "float(int(paced_instalment + 0.5)) if (months_since_opening <= K('young_account_months')) else (float(int(paced_instalment)) if (months_since_opening <= K('mid_account_months')) else RND(paced_instalment, 2))"
      - floored_instalment: "MX(P('automatic_transfer_min_amount'), rounded_instalment)"
      - withdrawals_one_month: "SUM('savings_transactions','amount', within_months=1, date_field='posted_date', event_type='savings_withdrawal')"
      - standing_transfer_ceiling: "K('ceiling_high') if (withdrawals_one_month >= K('recent_out_high')) else (K('ceiling_mid') if (withdrawals_one_month >= K('recent_out_mid')) else K('ceiling_standard'))"
      - result: "MN(standing_transfer_ceiling, floored_instalment)"
    compute_basis:
      deposits_all: "The posted balance is the total of the deposits, interest credits and fee refunds posted to the account less the withdrawals and fees posted to it, taken as no less than zero."
      interest_all: "The qualifying recurring amount is worked out only after the account's posted balance carries the relationship bonus owed for every closed statement cycle."
      refunds_all: "Before the qualifying recurring amount is fixed, the courtesy credit owed against the periodic fees standing on the account must already appear in its posted balance."
      withdrawals_all: "The posted balance is the total of the deposits, interest credits and fee refunds posted to the account less the withdrawals and fees posted to it, taken as no less than zero."
      fees_all: "The posted balance is the total of the deposits, interest credits and fee refunds posted to the account less the withdrawals and fees posted to it, taken as no less than zero."
      posted_balance: "The posted balance is the total of the deposits, interest credits and fee refunds posted to the account less the withdrawals and fees posted to it, taken as no less than zero."
      checking_balance: "Where the owner's Piedmont Crescent Bank checking account carries a ledger balance of at least 6,000.00 USD and received at least 3,000.00 USD of direct deposits in the three calendar months ending on the instruction date, the balance target is the tier's minimum daily balance waiver threshold plus 250.00 USD."
      checking_direct_deposits: "Where the owner's Piedmont Crescent Bank checking account carries a ledger balance of at least 6,000.00 USD and received at least 3,000.00 USD of direct deposits in the three calendar months ending on the instruction date, the balance target is the tier's minimum daily balance waiver threshold plus 250.00 USD."
      balance_target: "Where that ledger balance is at least 2,500.00 USD but below 6,000.00 USD and those direct deposits are at least 3,000.00 USD, it is that threshold plus 100.00 USD. Where that ledger balance is below 2,500.00 USD, or those direct deposits are below 3,000.00 USD, the balance target is the tier's minimum daily balance waiver threshold."
      qualifying_shortfall: "The qualifying shortfall is the balance target less the posted balance, taken as no less than zero, and no deposit already posted is set against it."
      deposits_one_month: "Where at least 2,000.00 USD of deposits posted to the account in the one calendar month ending on the instruction date, the shortfall is reduced by those deposits up to a ceiling of 400.00 USD, and never below zero."
      net_shortfall: "Where at least 750.00 USD but less than 2,000.00 USD of deposits posted in that window, the shortfall is reduced by those deposits up to a ceiling of 200.00 USD, and never below zero. Where less than 750.00 USD of deposits posted in that window, no deposit already posted is set against it."
      card_purchase_count: "Where at least four card purchases posted in the three calendar months ending on the instruction date and the card carries at least 10,000 unredeemed rewards points, the spread period is two months."
      card_rewards_points: "Where two or three card purchases posted in that window and the card carries at least 10,000 unredeemed rewards points, the spread period is three months."
      spread_months: "Where fewer than two card purchases posted in that window, or the card carries fewer than 10,000 unredeemed rewards points, the spread period is four months."
      monthly_raw: "The spread period is four months, and the paced instalment is the qualifying shortfall divided by the spread period with no pacing adjustment."
      withdrawal_count_three_month: "Where three or more withdrawals posted to the account in the three calendar months ending on the instruction date, the instalment is the shortfall divided by the spread period and then multiplied by 1.25, kept to four decimal places."
      paced_instalment: "Where two withdrawals posted in that window, it is that quotient multiplied by 1.10, kept to four decimal places. Where fewer than two withdrawals posted in that window, the instalment is the quotient with no pacing adjustment."
      months_since_opening: "Where the account has been open no more than twelve whole months, the instalment is rounded half up to the whole dollar."
      rounded_instalment: "Where the account has been open more than twelve whole months but no more than thirty-six whole months, it is truncated to the whole dollar. Where the account has been open more than thirty-six whole months, it is rounded half up to the cent."
      floored_instalment: "The paced instalment is rounded half up to the cent, then raised to the tier's minimum automatic transfer amount where it falls below it, and the qualifying recurring amount is the lesser of that figure and the standing transfer ceiling of 250.00 USD."
      withdrawals_one_month: "Where at least 2,000.00 USD of withdrawals posted in the one calendar month ending on the instruction date, the standing transfer ceiling is 900.00 USD."
      standing_transfer_ceiling: "Where at least 800.00 USD but less than 2,000.00 USD of withdrawals posted in that window, it is 500.00 USD. Where less than 800.00 USD of withdrawals posted in that window, the standing transfer ceiling is 250.00 USD."
      result: "The paced instalment is rounded half up to the cent, then raised to the tier's minimum automatic transfer amount where it falls below it, and the qualifying recurring amount is the lesser of that figure and the standing transfer ceiling of 250.00 USD."
    factors:
      - id: balance_target_cushion
        effect: parameter
        decides: balance_target
        bindings: [checking_balance, checking_direct_deposits, balance_target]
        ladder:
          - when: "the owner's checking account carries a ledger balance of at least 6,000.00 USD and received at least 3,000.00 USD of direct deposits in the three calendar months ending on the instruction date"
            value: "the tier's minimum daily balance waiver threshold plus 250.00 USD"
          - when: "that ledger balance is at least 2,500.00 USD but below 6,000.00 USD and those direct deposits are at least 3,000.00 USD"
            value: "the tier's minimum daily balance waiver threshold plus 100.00 USD"
          - when: "otherwise — that ledger balance is below 2,500.00 USD, or those direct deposits are below 3,000.00 USD"
            value: "the tier's minimum daily balance waiver threshold"
        baseline:
          balance_target: "P('waiver_min_daily_balance')"
        evidence: [cross_category, history]
        cross_difficulty: checking
      - id: recent_deposit_offset
        effect: method
        decides: net_shortfall
        bindings: [deposits_one_month, net_shortfall]
        ladder:
          - when: "at least 2,000.00 USD of deposits posted in the one calendar month ending on the instruction date"
            method: "the shortfall is reduced by those deposits up to a ceiling of 400.00 USD, never below zero"
          - when: "at least 750.00 USD but less than 2,000.00 USD of deposits posted in that window"
            method: "the shortfall is reduced by those deposits up to a ceiling of 200.00 USD, never below zero"
          - when: "otherwise — less than 750.00 USD of deposits posted in that window"
            method: "no deposit already posted is set against the shortfall"
        baseline:
          net_shortfall: "qualifying_shortfall"
        evidence: [history]
        cross_difficulty: null
      - id: spread_period_length
        effect: parameter
        decides: spread_months
        bindings: [card_purchase_count, card_rewards_points, spread_months]
        ladder:
          - when: "at least four card purchases posted in the three calendar months ending on the instruction date and the card carries at least 10,000 unredeemed rewards points"
            value: "two months"
          - when: "two or three card purchases posted in that window and the card carries at least 10,000 unredeemed rewards points"
            value: "three months"
          - when: "otherwise — fewer than two card purchases posted in that window, or fewer than 10,000 unredeemed rewards points"
            value: "four months"
        baseline:
          spread_months: "K('spread_standard')"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: instalment_pacing
        effect: method
        decides: paced_instalment
        bindings: [withdrawal_count_three_month, paced_instalment]
        ladder:
          - when: "three or more withdrawals posted in the three calendar months ending on the instruction date"
            method: "the quotient is multiplied by 1.25 and kept to four decimal places"
          - when: "two withdrawals posted in that window"
            method: "the quotient is multiplied by 1.10 and kept to four decimal places"
          - when: "otherwise — fewer than two withdrawals posted in that window"
            method: "the quotient stands with no pacing adjustment"
        baseline:
          paced_instalment: "monthly_raw"
        evidence: [history]
        cross_difficulty: null
      - id: instalment_rounding
        effect: method
        decides: rounded_instalment
        bindings: [months_since_opening, rounded_instalment]
        ladder:
          - when: "the account has been open no more than twelve whole months"
            method: "the instalment is rounded half up to the whole dollar"
          - when: "the account has been open more than twelve whole months but no more than thirty-six whole months"
            method: "the instalment is truncated to the whole dollar"
          - when: "otherwise — the account has been open more than thirty-six whole months"
            method: "the instalment is rounded half up to the cent"
        baseline:
          rounded_instalment: "RND(paced_instalment, 2)"
        evidence: [date]
        cross_difficulty: null
      - id: standing_ceiling_step
        effect: parameter
        decides: standing_transfer_ceiling
        bindings: [withdrawals_one_month, standing_transfer_ceiling]
        ladder:
          - when: "at least 2,000.00 USD of withdrawals posted in the one calendar month ending on the instruction date"
            value: "900.00 USD"
          - when: "at least 800.00 USD but less than 2,000.00 USD of withdrawals posted in that window"
            value: "500.00 USD"
          - when: "otherwise — less than 800.00 USD of withdrawals posted in that window"
            value: "250.00 USD"
        baseline:
          standing_transfer_ceiling: "K('ceiling_standard')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The qualifying recurring amount for a standing monthly transfer into a savings or money market account closes
        the qualifying shortfall between the account's posted balance and its balance target. The posted balance is
        the total of the deposits, interest credits and fee refunds posted to the account less the withdrawals and
        fees posted to it, taken as no less than zero. The balance target is the tier's minimum daily balance waiver
        threshold. The qualifying shortfall is the balance target less the posted balance, taken as no less than
        zero, and no deposit already posted is set against it. The spread period is four months, and the paced
        instalment is the qualifying shortfall divided by the spread period with no pacing adjustment. The paced
        instalment is rounded half up to the cent, then raised to the tier's minimum automatic transfer amount where
        it falls below it, and the qualifying recurring amount is the lesser of that figure and the standing transfer
        ceiling of 250.00 USD.
      params: [waiver_min_daily_balance, automatic_transfer_min_amount, spread_standard, ceiling_standard]
    inputs:
      history:
        - {table: savings_transactions, aggregate: sum, field: amount, within_months: 0, filters: {event_type: savings_deposit}}
        - {table: savings_transactions, aggregate: sum, field: amount, within_months: 0, filters: {event_type: savings_fee_refund}}
        - {table: savings_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: savings_deposit}}
        - {table: savings_transactions, aggregate: count, field: savings_txn_id, within_months: 3, filters: {event_type: savings_withdrawal}}
        - {category: checking, table: checking_transactions, aggregate: sum, field: amount, within_months: 3, filters: {channel: ach_direct_deposit}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 3, filters: {event_type: card_purchase}}
      cross_category: [checking, card]

  - id: savings_ext_excess_fee_review_credit
    base_policy_refs: [savings_evt_fee_refund]
    overwrite:
      - base_policy: savings_evt_fee_refund
        superseded_clause: >-
          A fee is refunded in full, never in part, as one savings_fee_refund row whose source_item_id is the fee row.
        replaced_by: >-
          A review credit for the excess withdrawal fees charged against withdrawals that never counted toward the allowance is booked as one entry for the whole review, and that entry is booked against the most recently posted excess withdrawal fee on the account.
    trigger: state_due
    subject: [savings_fee_refund]
    computes: review_credit_amount
    target_tool: credit_savings_fee_review_ce0a6323
    params:
      card_year_high: 6
      card_year_mid: 3
      rewards_floor: 3000
      checking_balance_ceiling: 5000.00
      direct_deposit_floor: 1000.00
      review_ceiling_low: 24.00
      review_ceiling_mid: 18.00
      review_ceiling_standard: 60.00
      fee_units_high: 3
      fee_units_mid: 2
      fee_units_standard: 1
      fee_count_high: 5
      fee_count_mid: 3
      established_account_months: 36
      withdrawal_count_high: 4
      withdrawal_count_mid: 2
    rule: >
      A review credit for the excess withdrawal fees charged against withdrawals that never counted
      toward the allowance is booked as one entry for the whole review, and that entry is booked against
      the most recently posted excess withdrawal fee on the account. The reviewable fee pool is the
      excess withdrawal fees posted to the account in the one calendar month ending on the review date.
      The review covers one fee unit, and the unit entitlement is the number of fee units covered
      multiplied by the tier's excess withdrawal fee. The credit before any ceiling is the lesser of the
      reviewable fee pool and the unit entitlement. The review ceiling is 60.00 USD, and the fee units
      alone govern the credit booked, which is never less than zero.

      The reviewable fee pool widens with the owner's card relationship. Where at least six card
      purchases posted on the owner's Piedmont Crescent Bank credit card in the twelve calendar months
      ending on the review date and the card carries at least 3,000 unredeemed rewards points, the
      reviewable fee pool is the excess withdrawal fees posted in those twelve calendar months. Where
      three, four or five card purchases posted in that window and the card carries at least 3,000
      unredeemed rewards points, the reviewable fee pool is the excess withdrawal fees posted in the
      three calendar months ending on the review date. Where fewer than three card purchases posted in
      that window, or the card carries fewer than 3,000 unredeemed rewards points, the pool stays as the
      excess withdrawal fees posted in the one calendar month ending on the review date.

      How many fee units the review covers follows the fee burden the account has carried. Where five or
      more fee entries posted to the account in the twelve calendar months ending on the review date and
      the account has been open no more than thirty-six whole months, the review covers three fee units.
      Where three or four fee entries posted in that window and the account has been open no more than
      thirty-six whole months, it covers two fee units. Where fewer than three fee entries posted in that
      window, or the account has been open more than thirty-six whole months, the review covers one fee
      unit.

      The review ceiling follows the owner's checking relationship. Where the owner's Piedmont Crescent
      Bank checking account carries a ledger balance below 5,000.00 USD and received less than 1,000.00
      USD of direct deposits in the three calendar months ending on the review date, the review ceiling
      is 24.00 USD. Where that ledger balance is below 5,000.00 USD and those direct deposits are at
      least 1,000.00 USD, the review ceiling is 18.00 USD. Where that ledger balance is 5,000.00 USD or
      more, the review ceiling is 60.00 USD.

      Where the ceiling bites follows the withdrawal history of the account. Where four or more
      withdrawals posted to the account in the three calendar months ending on the review date, the
      review ceiling binds the reviewable fee pool before the fee units are applied. Where two or three
      withdrawals posted in that window, the review ceiling binds the credit after the fee units have
      been applied. Where fewer than two withdrawals posted in that window, the fee units alone govern
      the credit booked.
    prerequisite: []
    cross_category:
      - category: card
        as: branch
        reads: [rewards_balance, card_transactions.event_type]
        note: "The card purchases posted in the twelve calendar months ending on the review date and the card's unredeemed rewards points decide how wide the reviewable fee pool is."
      - category: checking
        as: branch
        reads: [ledger_balance, checking_transactions.amount, checking_transactions.channel]
        note: "The owner's checking ledger balance and the direct deposits credited to it in the three calendar months ending on the review date decide the review ceiling."
    compute:
      - excess_fees_twelve_month: "SUM('savings_transactions','amount', within_months=12, date_field='posted_date', event_type='savings_fee', fee_code='excess_withdrawal')"
      - excess_fees_three_month: "SUM('savings_transactions','amount', within_months=3, date_field='posted_date', event_type='savings_fee', fee_code='excess_withdrawal')"
      - excess_fees_one_month: "SUM('savings_transactions','amount', within_months=1, date_field='posted_date', event_type='savings_fee', fee_code='excess_withdrawal')"
      - card_rewards_points: "CFIELD('card','rewards_balance')"
      - card_purchase_count_year: "XCOUNT('card','card_transactions', within_months=12, date_field='posted_date', event_type='card_purchase')"
      - reviewable_fee_pool: "excess_fees_twelve_month if (card_purchase_count_year >= K('card_year_high') and card_rewards_points >= K('rewards_floor')) else (excess_fees_three_month if (card_purchase_count_year >= K('card_year_mid') and card_rewards_points >= K('rewards_floor')) else excess_fees_one_month)"
      - fee_count_twelve_month: "COUNT('savings_transactions', within_months=12, date_field='posted_date', event_type='savings_fee')"
      - months_since_opening: "MONTHS(F('opened_date'), NOW)"
      - covered_fee_units: "K('fee_units_high') if (fee_count_twelve_month >= K('fee_count_high') and months_since_opening <= K('established_account_months')) else (K('fee_units_mid') if (fee_count_twelve_month >= K('fee_count_mid') and months_since_opening <= K('established_account_months')) else K('fee_units_standard'))"
      - unit_entitlement: "covered_fee_units * P('excess_withdrawal_fee')"
      - raw_review_credit: "MN(reviewable_fee_pool, unit_entitlement)"
      - checking_balance: "CFIELD('checking','ledger_balance')"
      - checking_direct_deposits: "XSUM('checking','checking_transactions','amount', within_months=3, date_field='posted_date', channel='ach_direct_deposit')"
      - review_ceiling: "K('review_ceiling_low') if (checking_balance < K('checking_balance_ceiling') and checking_direct_deposits < K('direct_deposit_floor')) else (K('review_ceiling_mid') if (checking_balance < K('checking_balance_ceiling') and checking_direct_deposits >= K('direct_deposit_floor')) else K('review_ceiling_standard'))"
      - withdrawal_count_three_month: "COUNT('savings_transactions', within_months=3, date_field='posted_date', event_type='savings_withdrawal')"
      - capped_review_credit: "MN(review_ceiling, reviewable_fee_pool) if (withdrawal_count_three_month >= K('withdrawal_count_high')) else (MN(review_ceiling, raw_review_credit) if (withdrawal_count_three_month >= K('withdrawal_count_mid')) else raw_review_credit)"
      - result: "MX(0.0, capped_review_credit)"
    compute_basis:
      excess_fees_twelve_month: "Where at least six card purchases posted on the owner's Piedmont Crescent Bank credit card in the twelve calendar months ending on the review date and the card carries at least 3,000 unredeemed rewards points, the reviewable fee pool is the excess withdrawal fees posted in those twelve calendar months."
      excess_fees_three_month: "Where three, four or five card purchases posted in that window and the card carries at least 3,000 unredeemed rewards points, the reviewable fee pool is the excess withdrawal fees posted in the three calendar months ending on the review date."
      excess_fees_one_month: "The reviewable fee pool is the excess withdrawal fees posted to the account in the one calendar month ending on the review date."
      card_rewards_points: "Where fewer than three card purchases posted in that window, or the card carries fewer than 3,000 unredeemed rewards points, the pool stays as the excess withdrawal fees posted in the one calendar month ending on the review date."
      card_purchase_count_year: "Where at least six card purchases posted on the owner's Piedmont Crescent Bank credit card in the twelve calendar months ending on the review date and the card carries at least 3,000 unredeemed rewards points, the reviewable fee pool is the excess withdrawal fees posted in those twelve calendar months."
      reviewable_fee_pool: "Where fewer than three card purchases posted in that window, or the card carries fewer than 3,000 unredeemed rewards points, the pool stays as the excess withdrawal fees posted in the one calendar month ending on the review date."
      fee_count_twelve_month: "Where five or more fee entries posted to the account in the twelve calendar months ending on the review date and the account has been open no more than thirty-six whole months, the review covers three fee units."
      months_since_opening: "Where three or four fee entries posted in that window and the account has been open no more than thirty-six whole months, it covers two fee units."
      covered_fee_units: "Where fewer than three fee entries posted in that window, or the account has been open more than thirty-six whole months, the review covers one fee unit."
      unit_entitlement: "The review covers one fee unit, and the unit entitlement is the number of fee units covered multiplied by the tier's excess withdrawal fee."
      raw_review_credit: "The credit before any ceiling is the lesser of the reviewable fee pool and the unit entitlement."
      checking_balance: "Where the owner's Piedmont Crescent Bank checking account carries a ledger balance below 5,000.00 USD and received less than 1,000.00 USD of direct deposits in the three calendar months ending on the review date, the review ceiling is 24.00 USD."
      checking_direct_deposits: "Where the owner's Piedmont Crescent Bank checking account carries a ledger balance below 5,000.00 USD and received less than 1,000.00 USD of direct deposits in the three calendar months ending on the review date, the review ceiling is 24.00 USD."
      review_ceiling: "Where that ledger balance is below 5,000.00 USD and those direct deposits are at least 1,000.00 USD, the review ceiling is 18.00 USD. Where that ledger balance is 5,000.00 USD or more, the review ceiling is 60.00 USD."
      withdrawal_count_three_month: "Where four or more withdrawals posted to the account in the three calendar months ending on the review date, the review ceiling binds the reviewable fee pool before the fee units are applied."
      capped_review_credit: "Where two or three withdrawals posted in that window, the review ceiling binds the credit after the fee units have been applied. Where fewer than two withdrawals posted in that window, the fee units alone govern the credit booked."
      result: "The review ceiling is 60.00 USD, and the fee units alone govern the credit booked, which is never less than zero."
    factors:
      - id: reviewable_pool_width
        effect: method
        decides: reviewable_fee_pool
        bindings: [excess_fees_twelve_month, excess_fees_three_month, excess_fees_one_month, card_rewards_points, card_purchase_count_year, reviewable_fee_pool]
        ladder:
          - when: "at least six card purchases posted on the owner's credit card in the twelve calendar months ending on the review date and the card carries at least 3,000 unredeemed rewards points"
            method: "the pool is the excess withdrawal fees posted in those twelve calendar months"
          - when: "three, four or five card purchases posted in that window and the card carries at least 3,000 unredeemed rewards points"
            method: "the pool is the excess withdrawal fees posted in the three calendar months ending on the review date"
          - when: "otherwise — fewer than three card purchases posted in that window, or fewer than 3,000 unredeemed rewards points"
            method: "the pool is the excess withdrawal fees posted in the one calendar month ending on the review date"
        baseline:
          reviewable_fee_pool: "excess_fees_one_month"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: covered_unit_count
        effect: parameter
        decides: covered_fee_units
        bindings: [fee_count_twelve_month, months_since_opening, covered_fee_units]
        ladder:
          - when: "five or more fee entries posted in the twelve calendar months ending on the review date and the account has been open no more than thirty-six whole months"
            value: "three fee units"
          - when: "three or four fee entries posted in that window and the account has been open no more than thirty-six whole months"
            value: "two fee units"
          - when: "otherwise — fewer than three fee entries posted in that window, or the account has been open more than thirty-six whole months"
            value: "one fee unit"
        baseline:
          covered_fee_units: "K('fee_units_standard')"
        evidence: [history, date]
        cross_difficulty: null
      - id: review_ceiling_step
        effect: parameter
        decides: review_ceiling
        bindings: [checking_balance, checking_direct_deposits, review_ceiling]
        ladder:
          - when: "the owner's checking account carries a ledger balance below 5,000.00 USD and received less than 1,000.00 USD of direct deposits in the three calendar months ending on the review date"
            value: "24.00 USD"
          - when: "that ledger balance is below 5,000.00 USD and those direct deposits are at least 1,000.00 USD"
            value: "18.00 USD"
          - when: "otherwise — that ledger balance is 5,000.00 USD or more"
            value: "60.00 USD"
        baseline:
          review_ceiling: "K('review_ceiling_standard')"
        evidence: [cross_category, history]
        cross_difficulty: checking
      - id: ceiling_bite_moment
        effect: method
        decides: capped_review_credit
        bindings: [withdrawal_count_three_month, capped_review_credit]
        ladder:
          - when: "four or more withdrawals posted in the three calendar months ending on the review date"
            method: "the ceiling binds the reviewable fee pool before the fee units are applied"
          - when: "two or three withdrawals posted in that window"
            method: "the ceiling binds the credit after the fee units have been applied"
          - when: "otherwise — fewer than two withdrawals posted in that window"
            method: "the fee units alone govern the credit booked"
        baseline:
          capped_review_credit: "raw_review_credit"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A review credit for the excess withdrawal fees charged against withdrawals that never counted
        toward the allowance is booked as one entry for the whole review, and that entry is booked against
        the most recently posted excess withdrawal fee on the account. The reviewable fee pool is the
        excess withdrawal fees posted to the account in the one calendar month ending on the review date.
        The review covers one fee unit, and the unit entitlement is the number of fee units covered
        multiplied by the tier's excess withdrawal fee. The credit before any ceiling is the lesser of the
        reviewable fee pool and the unit entitlement. The review ceiling is 60.00 USD, and the fee units
        alone govern the credit booked, which is never less than zero.
      params: [excess_withdrawal_fee, fee_units_standard, review_ceiling_standard]
    inputs:
      history:
        - {table: savings_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: savings_fee, fee_code: excess_withdrawal}}
        - {table: savings_transactions, aggregate: count, field: savings_txn_id, within_months: 12, filters: {event_type: savings_fee}}
        - {table: savings_transactions, aggregate: count, field: savings_txn_id, within_months: 3, filters: {event_type: savings_withdrawal}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_purchase}}
        - {category: checking, table: checking_transactions, aggregate: sum, field: amount, within_months: 3, filters: {channel: ach_direct_deposit}}
      cross_category: [card, checking]

  - id: savings_ext_surplus_transfer_amount
    base_policy_refs: [savings_evt_withdrawal_allowance, savings_evt_closure, savings_evt_deposits]
    overwrite:
      - base_policy: savings_evt_deposits
        superseded_clause: >-
          A deposit posts on the business day its funds become available, so the current balance is also the available balance.
        replaced_by: >-
          The available balance is the settled balance.
    trigger: on_request
    subject: [savings_withdrawal]
    computes: transfer_amount
    target_tool: transfer_savings_surplus_c4c79a83
    params:
      checking_balance_ceiling: 2500.00
      direct_deposit_floor: 1000.00
      cushion_high: 5000.00
      cushion_mid: 2000.00
      card_balance_floor: 2000.00
      rewards_floor: 10000
      deposit_hold_share: 0.50
      withdrawal_count_high: 3
      withdrawal_count_mid: 2
      established_account_months: 36
      share_high: 0.75
      share_mid: 0.90
      share_standard: 1.00
      recent_out_high: 2000.00
      recent_out_mid: 500.00
      offset_cap_high: 1000.00
      offset_cap_mid: 400.00
      interest_row_high: 3
      interest_row_mid: 1
      deposit_count_high: 2
      deposit_count_mid: 1
      ceiling_mid: 20000.00
      ceiling_standard: 5000.00
      minimum_transfer: 100.00
    rule: >
      The surplus a savings or money market account may move out on the owner's instruction is what the
      available balance carries above the balance the account must retain. The settled balance is the
      total of the deposits, interest credits and fee refunds posted to the account less the withdrawals
      and fees posted to it, taken as no less than zero. The available balance is the settled balance.
      The balance the account must retain is the tier's minimum daily balance waiver threshold. The
      surplus is the available balance less the balance the account must retain, taken as no less than
      zero, and the whole surplus is moved. No withdrawal already posted is set against it. The amount
      moved is rounded half up to the cent, never less than 100.00 USD, and never more than the transfer
      ceiling of 5,000.00 USD.

      The surplus available to move out is fixed only after the credit owed for the excess withdrawal
      fees charged on branch and ATM withdrawals stands on the account.

      Money that has only just reached the account is held back for owners carrying card debt. Where the
      owner's Piedmont Crescent Bank credit card owes at least 2,000.00 USD and the card carries fewer
      than 10,000 unredeemed rewards points, the deposits posted in the one calendar month ending on the
      instruction date are held back from the available balance. Where the card owes at least 2,000.00
      USD and carries at least 10,000 unredeemed rewards points, half of those deposits is held back,
      rounded to the cent. Where the card owes less than 2,000.00 USD, the available balance is the
      settled balance.

      The balance the account must retain is raised for owners whose checking relationship is thin. Where
      the owner's Piedmont Crescent Bank checking account carries a ledger balance below 2,500.00 USD and
      received less than 1,000.00 USD of direct deposits in the three calendar months ending on the
      instruction date, the balance the account must retain is the tier's minimum daily balance waiver
      threshold plus 5,000.00 USD. Where that ledger balance is below 2,500.00 USD and those direct
      deposits are at least 1,000.00 USD, it is that threshold plus 2,000.00 USD. Where that ledger
      balance is 2,500.00 USD or more, the balance the account must retain is the tier's minimum daily
      balance waiver threshold.

      Only part of the surplus moves for accounts that money leaves often. Where three or more
      withdrawals posted to the account in the three calendar months ending on the instruction date and
      the account has been open no more than thirty-six whole months, three quarters of the surplus is
      moved. Where two withdrawals posted in that window and the account has been open no more than
      thirty-six whole months, nine tenths of the surplus is moved. Where fewer than two withdrawals
      posted in that window, or the account has been open more than thirty-six whole months, the whole
      surplus is moved.

      Money that has recently left the account is set against the surplus within a ceiling. Where at
      least 2,000.00 USD of withdrawals posted in the one calendar month ending on the instruction date,
      the surplus is reduced by those withdrawals up to a ceiling of 1,000.00 USD, and never below zero.
      Where at least 500.00 USD but less than 2,000.00 USD of withdrawals posted in that window, the
      surplus is reduced by those withdrawals up to a ceiling of 400.00 USD, and never below zero. Where
      less than 500.00 USD of withdrawals posted in that window, no withdrawal already posted is set
      against it.

      How the amount moved is rounded follows the interest history of the account. Where three or more
      interest entries posted to the account in the twelve calendar months ending on the instruction
      date, the amount moved is rounded half up to the whole dollar. Where one or two interest entries
      posted in that window, it is truncated to the whole hundred dollars. Where no interest entry posted
      in that window, it is rounded half up to the cent.

      The transfer ceiling follows how much money has been paid into the account. Where two or more
      deposits posted to the account in the twelve calendar months ending on the instruction date, the
      transfer ceiling is the tier's online transfer daily limit. Where one deposit posted in that
      window, the transfer ceiling is 20,000.00 USD. Where no deposit posted in that window, the
      transfer ceiling is 5,000.00 USD.
    prerequisite:
      - problem: savings_ext_excess_fee_review_credit
        kind: value_input
        gate: settled_balance
        form: state
        policy_source: >-
          The surplus available to move out is fixed only after the credit owed for the excess withdrawal fees charged on branch and ATM withdrawals stands on the account.
        condition: >-
          The account's ledger carries a credit entry answering the excess withdrawal fees charged against withdrawals made in person at a branch or at an ATM, so the settled balance already includes it.
        resolved_by: credit_savings_fee_review_ce0a6323
        effect: >-
          The settled balance rises by the credit answering those excess withdrawal fees, so the available balance, the surplus and the amount moved all rise with it.
    cross_category:
      - category: card
        as: branch
        reads: [current_balance, rewards_balance]
        note: "The card balance owed and the card's unredeemed rewards points decide how much of the freshly deposited money is held back from the available balance."
      - category: checking
        as: branch
        reads: [ledger_balance, checking_transactions.amount, checking_transactions.channel]
        note: "The owner's checking ledger balance and the direct deposits credited to it in the three calendar months ending on the instruction date decide how far above the waiver threshold the retained balance sits."
    compute:
      - deposits_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_deposit')"
      - interest_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_interest_credit')"
      - refunds_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_fee_refund')"
      - withdrawals_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_withdrawal')"
      - fees_all: "SUM('savings_transactions','amount', date_field='posted_date', event_type='savings_fee')"
      - settled_balance: "MX(0.0, deposits_all + interest_all + refunds_all - withdrawals_all - fees_all)"
      - deposits_one_month: "SUM('savings_transactions','amount', within_months=1, date_field='posted_date', event_type='savings_deposit')"
      - card_balance: "CFIELD('card','current_balance')"
      - card_rewards_points: "CFIELD('card','rewards_balance')"
      - available_basis: "MX(0.0, settled_balance - deposits_one_month) if (card_balance >= K('card_balance_floor') and card_rewards_points < K('rewards_floor')) else (MX(0.0, settled_balance - RND(deposits_one_month * K('deposit_hold_share'), 2)) if (card_balance >= K('card_balance_floor') and card_rewards_points >= K('rewards_floor')) else settled_balance)"
      - checking_balance: "CFIELD('checking','ledger_balance')"
      - checking_direct_deposits: "XSUM('checking','checking_transactions','amount', within_months=3, date_field='posted_date', channel='ach_direct_deposit')"
      - retained_target: "(P('waiver_min_daily_balance') + K('cushion_high')) if (checking_balance < K('checking_balance_ceiling') and checking_direct_deposits < K('direct_deposit_floor')) else ((P('waiver_min_daily_balance') + K('cushion_mid')) if (checking_balance < K('checking_balance_ceiling') and checking_direct_deposits >= K('direct_deposit_floor')) else P('waiver_min_daily_balance'))"
      - surplus: "MX(0.0, available_basis - retained_target)"
      - withdrawal_count_three_month: "COUNT('savings_transactions', within_months=3, date_field='posted_date', event_type='savings_withdrawal')"
      - months_since_opening: "MONTHS(F('opened_date'), NOW)"
      - surplus_share: "K('share_high') if (withdrawal_count_three_month >= K('withdrawal_count_high') and months_since_opening <= K('established_account_months')) else (K('share_mid') if (withdrawal_count_three_month >= K('withdrawal_count_mid') and months_since_opening <= K('established_account_months')) else K('share_standard'))"
      - paced_surplus: "surplus * surplus_share"
      - withdrawals_one_month: "SUM('savings_transactions','amount', within_months=1, date_field='posted_date', event_type='savings_withdrawal')"
      - offset_surplus: "MX(0.0, paced_surplus - MN(withdrawals_one_month, K('offset_cap_high'))) if (withdrawals_one_month >= K('recent_out_high')) else (MX(0.0, paced_surplus - MN(withdrawals_one_month, K('offset_cap_mid'))) if (withdrawals_one_month >= K('recent_out_mid')) else paced_surplus)"
      - interest_row_count_year: "COUNT('savings_transactions', within_months=12, date_field='posted_date', event_type='savings_interest_credit')"
      - rounded_amount: "float(int(offset_surplus + 0.5)) if (interest_row_count_year >= K('interest_row_high')) else (float(int(offset_surplus / 100.0)) * 100.0 if (interest_row_count_year >= K('interest_row_mid')) else RND(offset_surplus, 2))"
      - deposit_count_year: "COUNT('savings_transactions', within_months=12, date_field='posted_date', event_type='savings_deposit')"
      - transfer_ceiling: "P('online_transfer_daily_limit') if (deposit_count_year >= K('deposit_count_high')) else (K('ceiling_mid') if (deposit_count_year >= K('deposit_count_mid')) else K('ceiling_standard'))"
      - result: "MN(transfer_ceiling, MX(K('minimum_transfer'), rounded_amount))"
    compute_basis:
      deposits_all: "The settled balance is the total of the deposits, interest credits and fee refunds posted to the account less the withdrawals and fees posted to it, taken as no less than zero."
      interest_all: "The settled balance is the total of the deposits, interest credits and fee refunds posted to the account less the withdrawals and fees posted to it, taken as no less than zero."
      refunds_all: "The surplus available to move out is fixed only after the credit owed for the excess withdrawal fees charged on branch and ATM withdrawals stands on the account."
      withdrawals_all: "The settled balance is the total of the deposits, interest credits and fee refunds posted to the account less the withdrawals and fees posted to it, taken as no less than zero."
      fees_all: "The settled balance is the total of the deposits, interest credits and fee refunds posted to the account less the withdrawals and fees posted to it, taken as no less than zero."
      settled_balance: "The settled balance is the total of the deposits, interest credits and fee refunds posted to the account less the withdrawals and fees posted to it, taken as no less than zero."
      deposits_one_month: "Where the owner's Piedmont Crescent Bank credit card owes at least 2,000.00 USD and the card carries fewer than 10,000 unredeemed rewards points, the deposits posted in the one calendar month ending on the instruction date are held back from the available balance."
      card_balance: "Where the card owes at least 2,000.00 USD and carries at least 10,000 unredeemed rewards points, half of those deposits is held back, rounded to the cent."
      card_rewards_points: "Where the card owes at least 2,000.00 USD and carries at least 10,000 unredeemed rewards points, half of those deposits is held back, rounded to the cent."
      available_basis: "Where the card owes less than 2,000.00 USD, the available balance is the settled balance."
      checking_balance: "Where the owner's Piedmont Crescent Bank checking account carries a ledger balance below 2,500.00 USD and received less than 1,000.00 USD of direct deposits in the three calendar months ending on the instruction date, the balance the account must retain is the tier's minimum daily balance waiver threshold plus 5,000.00 USD."
      checking_direct_deposits: "Where the owner's Piedmont Crescent Bank checking account carries a ledger balance below 2,500.00 USD and received less than 1,000.00 USD of direct deposits in the three calendar months ending on the instruction date, the balance the account must retain is the tier's minimum daily balance waiver threshold plus 5,000.00 USD."
      retained_target: "Where that ledger balance is below 2,500.00 USD and those direct deposits are at least 1,000.00 USD, it is that threshold plus 2,000.00 USD. Where that ledger balance is 2,500.00 USD or more, the balance the account must retain is the tier's minimum daily balance waiver threshold."
      surplus: "The surplus is the available balance less the balance the account must retain, taken as no less than zero, and the whole surplus is moved."
      withdrawal_count_three_month: "Where three or more withdrawals posted to the account in the three calendar months ending on the instruction date and the account has been open no more than thirty-six whole months, three quarters of the surplus is moved."
      months_since_opening: "Where two withdrawals posted in that window and the account has been open no more than thirty-six whole months, nine tenths of the surplus is moved."
      surplus_share: "Where fewer than two withdrawals posted in that window, or the account has been open more than thirty-six whole months, the whole surplus is moved."
