# Policy charter: Savings & Money Market. Piedmont Crescent Bank, N.A.
# Single registry of every savings number; the runtime never reads this file.

category: savings
display_name: Savings & Money Market Accounts

binding:
  holding_table: savings_accounts
  event_tables: [savings_transactions]
  intake_tables: [savings_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {current_balance: savings_balance}

lifecycle:
  states: [applied, active, dormant, closed]
  transitions:
    - {from: applied, to: active, by: system, means: "The opening deposit posted and the account became usable."}
    - {from: applied, to: closed, by: system, means: "The account was not funded within the funding window and was closed as unfunded."}
    - {from: active, to: dormant, by: system, means: "No customer-initiated activity occurred for the dormancy period."}
    - {from: dormant, to: active, by: agent, means: "An identity-verified owner made contact and a customer-initiated transaction reactivated the account."}
    - {from: active, to: closed, by: user, means: "The owner confirmed a closure request and the balance was paid out."}
    - {from: dormant, to: closed, by: user, means: "The owner of a dormant account confirmed a closure request and the balance was paid out."}

accounts:
  - key: savings_balance
    unit: USD
    meaning: "The posted balance of one savings or money market account; it never goes below zero because withdrawals beyond it are declined."

parameter_schema:
  minimum_opening_deposit: "Smallest first deposit that funds and activates a new account of this tier; USD."
  entry_required_checking_tiers: "Checking tiers of which the customer must already hold an active account to open this tier; list of official checking tier names, or 'none'."
  age_min_to_open: "Youngest age in whole years on the opening date at which the customer may open this tier as sole owner; integer years."
  age_max_to_open: "Oldest age in whole years on the opening date at which the customer may open this tier; integer years, or 'no_maximum'."
  max_accounts_per_customer_this_tier: "Most open accounts of this tier one customer may hold; integer count."
  monthly_maintenance_fee: "Fee assessed at statement cycle close unless a waiver is met; USD."
  waiver_min_daily_balance: "Lowest end-of-day balance during the cycle at or above which the maintenance fee is waived; USD, or 'not_offered'."
  waiver_automatic_transfer_min: "An automatic transfer from checking of at least this amount posted in the cycle waives the maintenance fee; USD, or 'not_offered'."
  waiver_age_under: "The maintenance fee is waived while the owner is younger than this age at cycle close; integer years, or 'not_offered'."
  waiver_linked_checking_tiers: "Holding an active checking account of one of these tiers at cycle close waives the maintenance fee; list of official checking tier names, or 'not_offered'."
  waiver_relationship_balance: "Relationship balance at cycle close at or above which the maintenance fee is waived; USD, or 'not_offered'."
  paper_statement_fee: "Fee per statement cycle when statement delivery is paper at cycle close; USD."
  paper_statement_fee_exempt_age: "Owners at least this age at cycle close pay no paper statement fee; integer years."
  base_apy_ladder: "Base annual percentage yield by end-of-day balance band; mapping of band floor in USD to APY percent."
  interest_band_method: "How the ladder applies: 'tiered' means the whole balance earns the rate of the highest floor reached; 'blended' means each slice of balance between floors earns its own band rate."
  minimum_balance_to_earn_interest: "A day whose end-of-day balance is below this amount earns no interest; USD."
  relationship_bonus_apy: "Percentage points added to the base APY when the customer holds a qualifying checking tier; percent."
  relationship_bonus_checking_tiers: "Checking tiers that qualify the account for the relationship bonus; list of official checking tier names, or 'none'."
  relationship_bonus_balance_cap: "Largest combined savings balance, across all of the customer's savings accounts, on which the relationship bonus is paid; USD."
  goal_bonus_apy: "Percentage points added for a cycle in which the goal conditions are met; percent (0.00 means not offered)."
  goal_bonus_min_net_deposit: "Net deposits in the cycle at or above which the goal bonus is earned; USD, or 'not_offered'."
  goal_bonus_balance_cap: "Largest daily balance on which the goal bonus is paid; USD, or 'not_offered'."
  promo_new_money_apy: "Promotional APY paid on qualifying new money during the promotional period, replacing the base APY on the promotional portion; percent, or 'not_offered'."
  promo_duration_months: "Calendar months from the opening date during which the promotional APY applies; integer months, or 'not_offered'."
  promo_min_new_money: "New money that must be deposited within the promo funding window for the promotional APY to apply; USD, or 'not_offered'."
  promo_balance_cap: "Largest daily balance on which the promotional APY is paid; USD, or 'not_offered'."
  promo_funding_window_days: "Calendar days after the opening date within which new money counts toward promo_min_new_money; integer calendar days."
  free_withdrawals_per_cycle: "Counted withdrawals allowed per statement cycle without an excess withdrawal fee; integer count, or 'unlimited'."
  excess_withdrawal_fee: "Fee for each counted withdrawal beyond the free allowance in a cycle; USD."
  excess_withdrawal_fee_max_per_cycle: "Most excess withdrawal fees charged in one statement cycle; integer count."
  excess_withdrawal_counted_channels: "Withdrawal channels that count toward the free allowance; list of channel values (branch and ATM withdrawals never count)."
  overdraft_transfer_counts_toward_limit: "Whether overdraft protection transfers to checking count toward the free allowance; boolean."
  overdraft_protection_source_eligible: "Whether this tier may be linked as the overdraft protection source of a checking account; boolean."
  check_writing_available: "Whether money market checks can be written on the account; boolean."
  atm_card_access: "Whether an ATM card can withdraw from the account; boolean."
  atm_daily_withdrawal_limit: "Most cash that can be withdrawn at ATMs per calendar day; USD (0.00 when there is no ATM access)."
  online_transfer_daily_limit: "Most value that can be transferred out through online or mobile banking per calendar day; USD."
  mobile_deposit_daily_limit: "Most check value deposited through mobile deposit per calendar day; USD."
  mobile_deposit_30day_limit: "Most check value deposited through mobile deposit in any rolling 30 calendar days; USD."
  domestic_wire_out_fee: "Fee per outgoing domestic wire from the account; USD."
  incoming_wire_fee: "Fee per incoming wire credited to the account; USD."
  early_closure_fee: "Fee when the owner closes the account within the early closure window; USD."
  early_closure_window_days: "Calendar days after the opening date during which a customer closure incurs the early closure fee; integer calendar days."
  dormancy_inactivity_months: "Calendar months without customer-initiated activity after which the account becomes dormant; integer months."
  dormant_account_fee: "Fee per statement cycle while dormant, never taking the balance below zero; USD."
  courtesy_refund_limit_365d: "Most courtesy fee refunds one customer may receive across all of their savings accounts in any rolling 365 days; integer count of refunded fees."
  courtesy_refund_window_days: "A fee is eligible for a courtesy refund only while no more than this many calendar days have passed since it posted; integer calendar days."
  automatic_transfer_min_amount: "Smallest recurring automatic transfer amount that can be set up; USD."
  accrued_interest_paid_on_closure: "Whether interest accrued since the last cycle close is paid when the account closes mid-cycle (false means it is forfeited); boolean."
  new_account_check_hold_business_days: "For accounts open fewer than new_account_period_days, the business day after deposit on which a deposited check posts; integer business days."
  new_account_period_days: "Calendar days after the opening date during which new-account holds apply; integer calendar days."

