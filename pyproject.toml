[project]
name = "enterprise-rl"
version = "0.1.0"
description = "Dependency-light scaffold for synthesizing customer-service agent tasks with a shared DB, a searchable knowledge base, and discoverable tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.92.0",
    "fastapi>=0.110",
    "orjson>=3.9",
    "tenacity>=8.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package name (enterprise-rl) differs from the import package (erlbench),
# so point the wheel build at it explicitly.
[tool.hatch.build.targets.wheel]
packages = ["erlbench"]

[tool.uv]
# Cache and project tree live on different filesystems here; copy instead of
# hardlinking to avoid the fallback warning.
link-mode = "copy"
