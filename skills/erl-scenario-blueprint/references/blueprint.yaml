# The blueprint of one scenario. One of the artifacts of the erl-scenario-blueprint skill.
# Path: env/<scenario_name>/blueprint/blueprint.yaml
#
# Realism comes first; never design for effect. The scenario must read like a company that could
# genuinely exist tomorrow: the brand is named the way that industry names brands, the products are
# tiered the way that industry really tiers them, the policies are ones a real company would
# actually enforce, the numbers sit in the real ranges of a real company (exact figures, not toy
# round numbers), and the customer calls are the ones a real support desk handles every day.
# Nothing that smells of a placeholder may survive into the artifact. Invented, but real.
#
# Narrative text (background, summary) is written in English; identifiers — name, category keys,
# event types, table names and ids — stay English snake_case (a hard constraint of the runtime
# interface).

name: <scenario_name>                       # must equal the directory name env/<scenario_name>/
company: <company name>                     # display name of the company, styled like a real brand in that industry

# World background. 10-20 sentences in English. This is the single shared narrative that every
# later generation step reads, and it describes only the world. Cover all three elements:
#   - Organisation: industry, what it sells or serves, scale, tone of voice.
#   - Product landscape: the official names of every category and its tiers — later KB documents
#     and tools reuse these names verbatim. A product is a contract the customer holds that keeps
#     producing business events, so state here how each category is held and how it is booked.
#   - Customer base: who calls, what combination they typically hold, and what event history they
#     bring with them.
# Business rules — thresholds, fees, procedures — do not belong in the background: they live in the
# products/ charters and in the later KB documents, and the agent must retrieve them rather than
# assume them. Service boundaries (human handoff, identity verification and its threshold) and the
# controlled vocabulary likewise stay out of the background: they are design inputs, and they land
# in the shared tools' implementation and docstrings, and in the naming of the schema and charters.
background: |
  <10-20 sentences in English covering the three elements above.>

# Registration of the two scenario-level log tables (both must appear in db_schema.json, and both
# are written by the shared tools).
logs:
  verification_log_table: <table>           # identity-verification log table
  handoff_log_table: <table>                # human-handoff log table

# The difficulty directories: N refined situations in which the agent handles support business
# (N is an input to this skill). Each must be a problem that industry's support desk really handles
# every day, requiring the agent to gather enough information first and then act over several
# turns. The difficulty comes from real policy complexity, never from a manufactured puzzle.
#
# Each difficulty claims one exclusive cell of the product x event space (the claim block). Every
# axis of distinction is declared once, in products/; a claim only references, never declares.
# categories references category keys (the write territory: that category's holding table, event
# tables and intake tables); event_types references event families already declared by the primary
# category (the subset it governs, possibly empty). Pairwise disjointness holds on the primary
# category axis alone: no two difficulties share a primary category, and because event families are
# namespaced by category, they are automatically mutually exclusive once the categories are.
# Reads are not fenced — the shared retrieval layer reaches the whole corpus, and out-of-territory
# information exists only as distraction; only writes are fenced. Merging every difficulty's KB and
# tools into one corpus and one registry must not change the correctness of any of them: tables and
# seed rows must not collide, tool names must not clash, KB documents must not contradict.
difficulties:
  - name: <difficulty_dir_name>             # becomes env/<scenario>/<name>/
    claim:
      categories: [<category_key>]          # primary category set = write territory; globally exclusive against every other difficulty
      event_types: [<category>_<event_key>] # event families governed here; must belong to the primary category's declared event types; may be empty []
    # The summary is at least 4 sentences of English. It paints the whole problem domain, not one
    # particular scenario or task — reason openly from the claimed categories and event_types:
    # under the real combinations of those categories and event families, which complex customer
    # settings might the agent face when handling this business (the combinations in the tier x
    # status x holding x history cross-product that genuinely exist and make the judgement hard),
    # and which requests or handling paths are not covered by any defined rule. State, and stop at:
    #   (1) The customer's situation: who calls, with what problem or request, and how the setting
    #       varies across tier, status, holding combination and event history.
    #   (2) The records and entities involved, and the shape of the governing rules: eligibility
    #       gates (which fields or statuses must hold), quantitative rules (fees, limits,
    #       thresholds — per tier wherever the rule is per tier), ordering constraints (X must
    #       precede Y). Reference numbers by the rule id in products/ (of the form
    #       <category>_<rule_key>); never restate them as a second copy of the number.
    #   (3) The correct service path and who performs each step: which are agent service actions,
    #       and which can only be done by the customer themselves (consent, the customer's own
    #       assets, signing, a claim only they can make -> a user tool, handed over by the agent).
    #   (4) The uncovered ground: which genuinely possible requests or situations no policy can
    #       decide, where the agent's only correct route is a POLICY_NOT_COVERED handoff.
    # What is enumerated are the dimensions of the setting and the boundaries of the policy, not
    # tasks: do not enumerate task variants, do not choreograph the agent's response script (comply
    # / partly comply / refuse the non-compliant part / hand off), do not name which facts the
    # persona conceals, and do not design any trap. How the rules get exercised in a concrete task
    # is entirely the business of the instantiate skill.
    summary: >
      <at least 4 sentences in English covering (1)-(3), framing only the problem domain.>
  # ... N entries in total ...
