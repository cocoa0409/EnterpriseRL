# The policy charter of one product category. One of the artifacts of the erl-scenario-blueprint skill.
# Path: env/<scenario>/blueprint/products/<category_key>.yaml   (one file per category)
#
# The charter has four layers, and they never encroach on one another:
#   World structure (binding / lifecycle / accounts / events) — the facts the DB records: table
#     bindings, the state machine, accounts (quantities as first-class entities), and data flow.
#     Events are every write in the world: a ledger target writes an event table, a holding target
#     (target = holding_table) performs CRUD on the holding table — create, state transition,
#     field update.
#   Product catalogue (parameter_schema / variants) — static attributes: the parameter dictionary
#     and the tier ladder.
#   Derived measures (measures) — the raw material of judgements: named window statistics over
#     event history and portfolio state.
#   Policies (policies) — the single form every piece of decision logic takes: one policy = id +
#     binding list (subject) + decision statement (rule) + pre-action eligibility gates
#     (eligibility) + numeric registry (params) + optional derived-measure references. Every policy
#     binds one or more declared events of this category and takes effect only on the writes it
#     constrains; cross-category causation travels through event triggers, and combination-layer
#     policies (interaction and mutual exclusion) are written right here in this category's
#     policies, stating as a rule that "holding X changes the eligibility or parameters of Y".
#
# This is the single registry of every quantified policy in this category: each number appears
# exactly once in the whole scenario, and only here. Everything downstream — difficulty refinement,
# KB documents, tools, tasks — references it by id and reuses it verbatim, never restating a second
# copy of the number. The runtime never reads this file: its content reaches the agent only after
# the rendering step (erl-kb-doc-render) renders it into KB documents. The DB stores only world state (who, what
# they hold, what has happened); policy lives only here — catalogue, parameters, rules and event
# entitlements never enter the DB and are never hard-coded into tools.
#
# The structure IS the template: the keys and nesting of every block below are fixed, and the
# placeholder content is replaced with what is true of that industry. The expressive range must be
# enough to cover every real product and event policy of the category — every number is an exact
# figure inside that industry's real range, and a mechanism the industry does not have must never be
# invented to fill a slot (a block with no real counterpart is better left explicitly empty with a
# one-line note than fabricated). This file must be a complete product charter that could be
# operated on its own, not scaffolding for instantiate to patch: close every real capability
# item by item — who triggers it, in which states it applies, eligibility and refusal, parameterised
# calculation, the event or transition that carries it, the successful knock-on effects, and
# failure, repetition, over-limit, cancellation and reversal. The base policies must be able to
# decide the positive case, the negative case, the exceptions and the conflict priorities across
# their real domain. Complexity comes from real mechanism coupling, never from fields no one
# consumes; hitting the counts while any high-frequency capability is merely named without an
# executable closure is still a fail.
# Narrative text (rules, meanings, notes) is written in English; keys, category keys, ids, event
# types and status enums stay English snake_case; official product names follow that industry's
# real naming conventions.

category: <category_key>                    # category key: English snake_case, unique across the scenario; the namespace for event types and policy ids
display_name: <official category name>      # the official name of the category (the term the industry uses)

# ---- binding to db_schema.json (field names match verbatim) --------------------
binding:
  holding_table: <table>                    # this category's holding table
  event_tables: [<table>]                   # this category's event tables (at least one)
  intake_tables: [<table>]                  # this category's business intake tables — process-driven business
                                            # (accepted first, effective after the customer confirms or after
                                            # back-office handling) lands an intake row rather than an immediate
                                            # transition; omit this key if there is none
  status_field: status                      # the lifecycle status field on the holding table
  variant_field: variant_name               # the tier field on the holding table (stores the verbatim official name from variants[].name)
  quantity_fields: {<field>: <account_key>}  # current-quantity fields on the holding table -> account; the value is
                                            # identically the sum of that account's deltas (an integral view, not an
                                            # independent fact); omit this key if there is none

# ---- lifecycle state machine (applied -> ... -> closed) ------------------------
# states is a controlled enum (seed rows and tools downstream reuse it verbatim, English
# snake_case); transitions exhaustively lists every legal transition and who performs it — it is
# consumed at the instantiation stage (KB documents, task tool CRUD, the agent/user split), and the
# blueprint stage only validates that it is structurally well-formed. states without transitions is
# half a state machine, and leaving the legal transitions for each downstream step to invent
# guarantees they will contradict one another. `by` records who performs the transition in the
# system: transitions that only the customer can confirm (closing, returning, unbundling, disposing
# of their own assets) are marked by: user — the agent-side business does not drive them directly
# but lands on an intake table instead (accepted first, effective after the customer confirms),
# which is exactly why binding.intake_tables exists.
lifecycle:
  states: [<applied>, <active>, ..., <closed>]
  transitions:
    - {from: <state>, to: <state>, by: <agent|user|system>, means: <one sentence in English>}
    # ... every legal transition, exhaustively ...

# ---- accounts (quantities as first-class entities) -----------------------------
# Every quantity a policy talks about — arrears, remaining balance, allowance, valid amount — is
# opened as an account here: name, unit, meaning. Quantitative event families record its signed
# delta, and every account has at least one family booking each direction; the current-quantity
# field on the holding table is its integral view. A category with no account-style quantity writes
# an explicit empty list [].
accounts:
  - key: <credit>                           # account key: English snake_case, unique within this category
    unit: <USD>                             # unit of measure
    meaning: <one sentence in English — what quantity this is>
  # ... every quantity this category's policies talk about, exhaustively ...

# ---- category-level parameter dictionary ---------------------------------------
# Declare the complete parameter set of this category's tiers here first: one line per parameter,
# stating meaning, type and unit. Every number, rate, term, window, threshold, cap, precision,
# frequency, channel, entity mapping, coverage priority and switch that can change a business
# outcome must be parameterised, and must never hide as a magic number or a vague adverb inside a
# rule, a tool or a later task. Every tier below must assign a value to this whole dictionary — zero
# nulls, zero defaults — because "which tier takes which value on which parameter" IS the product
# strategy. The parameter set should cover the fields that industry's real product page would print:
# entry thresholds, fees, interest or rates, limits, deadlines, frequency quotas, entitlement
# switches and magnitudes. Prefer completeness over brevity — a mature product's parameter
# dictionary runs to dozens of entries (>=48 per category); a thin parameter set is not simplicity,
# it turns a mature product into a toy. Parameter values are not restricted to scalars: threshold
# ladders, per-entity mappings and other structured forms are registered as that industry's real
# mechanism works (state the form in the parameter's description) and are never flattened to suit
# the template. Parameters are defaults, not final values — where an override mechanism exists (a
# parameter changes once some condition holds), the override is registered as a policy, and the
# number is not restated in two places.
# No dangling parameters (think the whole chain through): behind every parameter is a family of
# policies, and a policy governs a family of events; the parameter itself never enters the DB
# (policy constants live only in the charter), but the events it drives must be recordable
# distinguishably. Follow "parameter -> policy family -> event family -> distinguishable record" all
# the way down: an event family's grain and distinguish_by must be fine enough to tell apart two
# real occurrences that differ only along the dimension this parameter introduces (billing subtype /
# cycle / channel / per-tier or per-entity variation), and the event table in db_schema.json must
# carry those distinguishing fields. A parameter whose two occurrences can only collapse into the
# same row (row ids are content hashes) is a dangling parameter and is forbidden — go back and add
# distinguish_by to the event family and the field to the schema, so parameter, policy, event and
# schema stay consistent along the chain.
parameter_schema:
  <param_key>: <one line in English — meaning, type, unit>
  # ... every parameter of this category, exhaustively ...

# ---- tier ladder (low to high; the industry's real tiering, >=6 tiers) ---------
variants:
  - name: <official full tier name>         # official full name, unique across the scenario; KB, tools and seed rows reuse it verbatim
    rank: 1                                 # ladder position (1 is lowest)
    entry_gate:                             # entry threshold: the conditions an application for this tier must meet (structured)
      <gate_key>: <value>
    parameters:                             # assign the whole parameter_schema (zero nulls, zero defaults);
      <param_key>: <value>                  # a tier's entitlements ARE its parameter values (switches and magnitudes) — no separate free-text field
  # ... one entry per tier, covering the industry's real tiering ...

# ---- data flow (every write is an event) ---------------------------------------
# Events are every write in the world, with two kinds of target:
#   target = an event table  = writing a ledger row (a new row: charges, usage, vouchers) — many
#     similar rows, so grain/distinguish_by keep them from colliding;
#   target = holding_table   = writing the holding table (CRUD on the contract) — the row IS the
#     contract, so mutation declares the form of the change: create adds a row (status pinned to the
#     lifecycle entry state), {transition: {from, to}} is a state transition (which must match a
#     lifecycle.transitions entry), update is an ordinary field update and must never write status —
#     the only write channel for status is transition.
events:
  - type: <category>_<event_key>            # event type: prefixed with the category as namespace, globally unique;
                                            # written verbatim into the event table's event_type field (holding targets do not write it)
    target: <table>                         # target (required): which table is written — this category's binding.holding_table
                                            # (writing the holding table) or one of binding.event_tables (writing an event table)
    mutation: <create | {transition: {from: <state>, to: <state>}} | update>
                                            # required only for holding targets (target = holding_table); a closed set of three values
    meaning: <one sentence in English — what real-world occurrence this event records>
    grain: <one sentence on grain — one row corresponds to one what in the real world>   # a holding target may say "one row per transaction"
    distinguish_by: [<event_field>]         # the distinguishing field set (required only for event-table targets): any two real
                                            # occurrences of the same event family on the same holding must differ on at least one
                                            # of these fields — two rows identical on every field are the same row under the id
                                            # content hash; the fields must already be declared in this family's fields, and the
                                            # set is the smallest one consistent with the declared grain
    fields: {<event_field>: <one sentence in English>}   # the meaning of each business field (field names match the target table's
                                            # columns verbatim: event-table targets against event-table columns, holding targets
                                            # against holding-table columns).
                                            # Derived events such as reversals, compensation, review, adjustment and settlement must
                                            # include here the business key that uniquely points back to the original order / charge /
                                            # application / voucher; customer_id, holding_id, or a case reference spanning several
                                            # line items cannot stand in for the narrowest source-object key.
    account: <account_key>                  # quantitative events: the account booked (must be declared in the accounts block);
                                            # documentary events omit both account and direction
    direction: <in|out>                     # quantitative events: the direction of the delta — in credits, out debits
    triggers:                             # consequence registry: the other events that, by the rules of the world, necessarily
                                        # follow one real occurrence of this event; may be several, may cross categories;
                                        # write [] explicitly when there are none
      - event: <category>:<event_type>    # the knock-on event, in category:event_type notation (crossing categories is legal)
        when: {<field>: <value>}          # trigger condition: fires only when a field of this event takes some value (or one of a
                                        # list of values, or {"not": <value or list>} to exclude); omit this key when it always
                                        # fires; the field must belong to this family's fields or the event table's columns, and
                                        # enum values must be within the schema's value set
        map: {<target_field>: <source>}   # how the knock-on row is written: target field <- the same-named field of this event
                                        # (verbatim field name) or a fixed value (number/boolean/enum literal); when only some
                                        # fields can be determined, write those, and leave the rest to the policy prose and the
                                        # record made at handling time
  # Exhaustiveness discipline: for each event, ask "once this happens, what else in the world
  # necessarily changes" — register each one if so, and write [] explicitly if not. An event
  # declaration that records the occurrence but not its consequences is half-finished. Where
  # different values of the same family lead to different knock-on effects, register them as
  # separate entries keyed by when, never lumped together.
  # ... every write of this category, exhaustively: ledger events + holding create/transition/update ...

# ---- derived measures ----------------------------------------------------------
# The raw material of judgements: named window statistics over event history (or portfolio state).
# Wherever a judgement depends on history or on the portfolio, the statistical basis is named once
# here and referenced by id from policies — one basis per statistic across the whole scenario. A
# category with no such judgement writes an explicit empty list [].
measures: []
  # - id: <category>_msr_<key>              # derived-measure id (unique across the scenario)
  #   window: <the length and rolling basis of the window>
  #   measure: <what is counted: a count or sum over which event_type / status / field>

# ---- policies (the single registry of all decision logic) ----------------------
# Every policy binds to one or more declared events of this category (subject is a list of event
# types) — a policy takes effect only on the writes it constrains; a policy that binds to no write
# decides nothing and must not exist. The multi-holding charter (whether several may be held, and
# the cap) binds the holding create event; portfolio aggregation binds the writes it reads or
# affects; cross-category causation travels through triggers and never oversteps via subject.
# Decision completeness means the conditions are complete across the real domain — applicable versus
# not, ordinary versus exceptional, refusal versus waiver, and, when several policies match at once,
# the override/stacking/priority and the successful terminal state can all be decided. Numbers live
# only in params; the prose does not restate them.
# Every pre-action prerequisite must also be registered item by item in eligibility, with its
# condition appearing verbatim in the rule; when there is no prerequisite, write eligibility: []
# explicitly. Structured gates exist only to pin down evidentiary authority, object correlation and
# time anchors; they can never add a rule the prose does not state.
# The variety of mechanisms matters more than the quantity of numbers: time windows, frequency
# quotas, threshold dependencies, combination dependencies, behaviour activation, channel variation,
# coverage validity, stacking bases, over-limit handling, waivers and negative space — cover as much
# of the mechanism catalogue as that industry really has (never invent a mechanism with no real
# counterpart). Every natural-language term in every policy must have a basis — how the period is
# counted, whether the current or cumulative value is taken, what counts toward the basis — written
# in the prose or in the derived measure it references. At least one policy must genuinely vary by
# tier (a per_tier table covering every tier with different values — the table stands on its own and
# leaves no gap for the reader to infer).
policies:
  - id: <category>_<rule_key>               # policy id (unique across the scenario, prefixed with the category;
                                            # the multi-holding charter is fixed at <category>_agg_multi_holding)
    subject: [<event_type>, <...>]          # the list of event types bound (>=1, all declared by this category)
    rule: <a paragraph of English rule prose, complete as a decision; every eligibility.condition below must appear verbatim as a whole sentence>
    eligibility:                            # required list; write [] when there is no pre-action prerequisite, never omit it
      - id: <gate_key>                      # unique within this policy, English snake_case
        applies_to: [<event_type>]          # the non-empty subset of subject this gate actually constrains
        kind: <state|time|authorization|dedup|caller_fact>
        condition: <the eligibility sentence exactly as it appears in the rule; it must be decidable true/false, never merely "handle as prescribed">
        evidence_fields: [<table>.<field>]  # the authoritative DB fields the decision needs; for a caller fact, also record the field used to correlate it
        evidence_contract:
          authority: <system_record|caller_statement|mixed>
                                            # approval, review, completion, liability, system status and deduplication may only be
                                            # system_record; caller_statement is only for facts that only the customer can state and
                                            # that policy permits them to self-report
          timing: pre_action                # fixed: the evidence must hold before this business write
          correlation_keys:                # at least one set of business-object keys that fully correlates the evidence with this write
            - [<table>.<business_object_id>]
          action_bindings:                  # each field in correlation_keys -> the canonical parameter name of the future task tool;
            <table>.<business_object_id>: <business_object_id>
                                            # the parameter name continues the business key from the event fields/schema, and
                                            # instantiate may not rename it or change its meaning
        temporal_basis:                     # required when kind=time; omitted for other kinds
          clock: frozen_time                # the single handling clock, supplied at runtime by ctx.now()
          anchor_event: <the precise business event the clock starts from, e.g. "the customer gives notice of this cancellation">
                                            # this phrase must appear verbatim in condition; it is not enough to set up a separate
                                            # start point in the structured field alone
          anchor_source: <table>.<field>    # must be one of evidence_fields; never substitute an earlier or more convenient date
          relation: <not_before|not_after>  # the direction of frozen_time relative to "anchor + duration":
                                            # not_before means it may not be earlier, not_after means it may not be later
          duration_source: <params.<key>|variants.<param_key>>
          unit: <calendar_days|elapsed_hours|business_days|calendar_months>
          counting_rule: <the counting sentence exactly as it appears in the rule; state how days/months accumulate, which business
            calendar business_days uses, how calendar_months falls back at month end, and that calendar_days and full 24-hour periods
            are never mixed>
          boundary: <inclusive|exclusive>   # whether equality with anchor+duration satisfies the gate; together with relation this
                                            # composes exactly one comparison
        state_contract:                     # required when kind=state; omitted for other kinds
          field: <table>.<field>            # the status field constrained; must be one of evidence_fields, and must be an enum in
                                            # db_schema — a state gate only ever ranges over a closed set
          allowed: [<enum value>, <...>]    # the full set of statuses in which handling is allowed: non-empty, and a proper subset of
                                            # that field's enum domain (covering the whole domain is the same as having no gate).
                                            # It means the same as the rule prose: list exactly the statuses the prose says can be
                                            # handled, and never leave them only in the prose. Check as you write: every write this
                                            # category declares that can occur in some state — a create landing in the lifecycle entry
                                            # state, a transition landing in its `to` state, and the writes that triggers derive
                                            # immediately afterwards — must fall inside this set, or the gate can never be passed on
                                            # that path.
        dedup_contract:                     # required when kind=dedup; omitted for other kinds
          table: <the official business table checked>
          mode: <separate_record|same_record>
          object_bindings: {<row_object_field>: <task_tool_action_arg>}
          duplicate_filters: {<status_or_type_field>: [<already-completed value>]}
          distinct_fields: [<fields that separate transaction batches without changing the identity of the business object>]
    params:                                 # optional; the registry of numbers: scalars written directly; anything that varies by
      per_tier:                             # tier written as a per_tier table; a value equal to some catalogue parameter is written
        <official full tier name>: {<param>: <value>}   # as a "=<param_key>" reference (the single registry of the number remains
        # ... covering every tier ...       # variants[].parameters) and never restated; further table forms (threshold ladders,
                                            # per-entity mappings) extend as that industry really needs
    formula:                                # optional; the calculation core — pins the computable logic of the prose into a
      when_not: <exclusion expression>      #   restricted expression: when it holds, this policy does not apply (when may state the
      <output>: <expression>                #   applicable condition instead). One quantity per line; expressions may use only the
                                            #   fields of the bound events, params/catalogue parameter keys, derived-measure ids,
                                            #   account keys, numbers, booleans, quoted string literals (for enum comparison),
                                            #   comparisons and arithmetic, in/not in, and min/max/round/abs; every identifier is
                                            #   machine-resolvable (a wrong name is a FAIL).
                                            # Calculation policies must pin one, boolean gates may, and process/mapping/boundary
                                            # policies do not; the formula is the calculation core, not a second copy of the prose —
                                            # conditional branches and exceptions stay in the rule
    measures: [<category>_msr_<key>]        # optional; the derived measures the decision depends on, referenced by id; the
                                            # consequence of crossing a threshold is written in the rule prose, and the threshold
                                            # number lives in params
  # ... every real policy of this category, exhaustively; >=8 per category, and every declared event
  #   governed by at least one policy. The multi-holding charter (whether several may be held, and the
  #   cap) is a policy too: exactly one <category>_agg_multi_holding per category (subject bound to the
  #   holding create event, params carrying max_per_customer, where 1 means multiple holdings are not
  #   allowed); a category whose cap is != 1 also has >=1 aggregation policy (the basis on which
  #   holdings are combined) ...
