# The extended product-charter skeleton for one difficulty. The core artifact of erl-task-instantiate.
# Path: env/<scenario>/tasks/<difficulty>/<category>.extended.yaml
#
# This file = a COMPATIBLE SUPERSET of the blueprint's products/<category>.yaml: the base section is
# preserved verbatim, plus one extra top-level key, extended_policies. There is no workflows key:
# every problem a task resolves is one extended_policy, resolved by one call of its target_tool, and
# the order in which a task's problems are resolved is entailed by the prerequisite edges between
# those policies alone (a directed acyclic graph, the execution graph of the difficulty).
# extended_policies layer more complex calculation logic on top of the base policies, and stand to
# base as a version update: where they conflict, extended wins — but every single conflict must be
# declared, sentence by sentence, in that policy's overwrite. The base section itself is never
# touched: an override holds because it is declared on the extended side, not because someone edited
# the copy of base.
# The structure IS the template: keys and nesting are fixed, placeholder content is replaced with
# what is true of the scenario; no domain examples are given.

# ============================================================================
# base section: copy every key of env/<scenario>/blueprint/products/<category>.yaml verbatim,
# changing nothing (category / display_name / binding / lifecycle / accounts /
# parameter_schema / variants / measures / events / policies). Elided here; the real file must
# contain all of it.
# ============================================================================
category: <category_key>          # identical to base
# ... every remaining base key copied verbatim ...

# ============================================================================
# extended_policies: the complex multi-factor calculation policies this difficulty adds
# (layered on top of the base policies)
# ============================================================================
extended_policies:
  - id: <category>_ext_<key>              # unique across the scenario, prefixed with this category
    base_policy_refs: [<category>_<base_rule_key>, ...]
                                          # required and non-empty: list every base policy whose subject intersects
                                          # this policy's subject, not merely the ones the formula reads directly;
                                          # other base bases the compute genuinely reads may also be referenced.
                                          # For those that intersect this subject, all of their eligibility is
                                          # inherited into task.solvability_contract; a time gate may not change anchor.
                                          # If no source can be found, or a base prerequisite hides in vague prose, go
                                          # back and fix the blueprint — legislating locally is forbidden.
    overwrite:                            # required; declares what this policy overrides relative to base, [] when nothing
                                          # Semantics: extended is a version update of base, and extended wins where they
                                          #   conflict; but the override must be explicit, sentence by sentence and
                                          #   traceable — an undeclared deviation is a red light, not implicit permission.
                                          # The granularity is the CLAUSE, not the whole policy: only the named sentence
                                          #   is retired, and unlisted clauses of the same base policy stay in force and
                                          #   continue to be inherited.
                                          # What is overridden is the HANDLING BASIS, not the PARAMETER VALUE: base's
                                          #   params values remain valid and remain carried by base; this field declares
                                          #   only which handling sentence is superseded.
                                          # How to decide: evaluate the quantity this policy computes and base's rule for
                                          #   the same quantity, each once, in the same world. Different -> it must be
                                          #   declared here; identical -> write [].
                                          #   Calling base's output a "wrong value" anywhere in your own notes while not
                                          #   declaring it here IS an undeclared override.
      - base_policy: <category>_<base_rule_key>
                                          # a base policy already declared by this category, which must also appear in base_policy_refs
        superseded_clause: >-
          <the sentence quoted verbatim from that base policy's rule; after whitespace normalisation it must be a substring of it>
        replaced_by: >-
          <the sentence quoted verbatim from this policy's own rule; after whitespace normalisation it must be a substring of it>
    trigger: state_due | on_request       # the trigger type from Principle F / Step 1 (the premise of the closure test); one of two:
                                          #   state_due = debt-like. It is owed as soon as the state of the world satisfies it,
                                          #     whatever the customer called about (late fees / overdue interest / a charge that
                                          #     should be collected / clearing up an entitlement that should have been granted).
                                          #     If some task's seed lights it, this policy must be carried by that task's GT write
                                          #     step and actually recomputed by that step's computation (Principles E/F and Steps 1/3).
                                          #   on_request = quote-like. It happens only when the customer asks, and the formula is
                                          #     merely a quoting device for "if we do it, how much" (withdrawal / closure
                                          #     settlement / refund / offset / change difference). Since this difficulty declares
                                          #     the policy, at least one task must genuinely ask for it and use it at the
                                          #     corresponding GT call; an idle quoting device is forbidden.
                                          # Ask yourself: "with no customer calling at all, should this money already be on the
                                          # books at month-end reconciliation?" Should = state_due, should not = on_request. No
                                          # answer = who triggers this business is vague in the prose; think it through first.
    subject: [<category>_<event_key>]      # an event already declared by this category — which write this calculation constrains
    computes: <arg_name>                   # the name of the write parameter this policy computes (= one argument of target_tool)
    target_tool: <task_tool_name>          # the task tool that receives that parameter (defined in task_tools.py).
                                          # Closure iron rule (Principle F): one (target_tool, computes) pair is claimed by at most
                                          # one policy — where several charges genuinely must go through the same write action,
                                          # merge them into one policy with an enum branch (the branch goes into compute, subject
                                          # to domain parity), or split them into different tools by billing subtype.
    params:                                # this policy's own constants: each number appears once here and compute references it through K('<key>')
      <key>: <number>
    rule: >
      <a paragraph in English: a refinement written for all customers, consistent with base_policy_refs and detailed enough to
       execute on its own — state per factor where its value comes from (which stretch of ledger aggregated on what basis, which
       tier parameter, which cross-category condition reading which field of which table), the criterion for each condition,
       whether a rate acts once on the combined amount or item by item, the base each quantity acts on, the order and grouping of
       operations, whether the cap/floor applies before or after the deduction, and the rounding mode / precision / point.
       These relationships must be written out exclusively in plain prose, never left for the reader to guess behind summary words
       like "then", "next" or "combined".
       Negative space is written as a conditional clause ("those meeting X are granted/charged Y; those not meeting it are out of scope").
       The paragraph contains the baseline's sentences (the standard method and default values, quoted below under `baseline`)
       and, for every factor, every tier of its ladder — the condition and the value or method — so that compute_basis can quote each.
       Someone reading only this paragraph should be able to recompute the same number without seeing compute. It must never carry
       the shadow of any specific task (authoring-viewpoint meta notes such as "may be zero in practice / not triggered in this
       task" are a red light). A new factor must come from a base charter asset or from world state; never invent a rate,
       threshold, exception or business effect out of nothing. A number appears once, in params/compute, and the prose does not
       restate it.
       For every other problem this policy depends on, the rule carries exactly one PREREQUISITE SENTENCE (defined under
       prerequisite below) and nothing else about that dependency: one sentence saying outright, with an ordering
       connective, what this policy's result waits on — a record-visible state (preferred) or, as a declared fallback,
       the depended-on action in business words — and never a tool name, a policy id or any code name.>

    # Problem dependency (required on every extended_policy; write [] when there is none): declares WHICH OTHER PROBLEMS MUST BE
    # RESOLVED BEFORE THIS ONE CAN BE HANDLED. Every problem is one extended_policy, resolved by one call of its target_tool; the
    # prerequisite edges of a difficulty together form the execution graph of its tasks (a directed acyclic graph), and a task's
    # gold write sequence is a topological order of the tree rooted at its root problem.
    # Only GENERAL text goes here, never the shadow of a specific task: "in this task it is not settled at the opening" is a
    #   task-level fact and belongs in task.json's prerequisite_closure.
    # The tool layer NEVER validates a prerequisite: while it is unresolved, this problem's target_tool remains callable and still
    #   writes faithfully. Every prerequisite judgement is made by the solving agent, from the policy and the world.
    #
    # HOW A PREREQUISITE IS WRITTEN INTO THE RULE: the PREREQUISITE SENTENCE.
    #   The rule of this policy states each edge outright, in exactly one sentence, with an explicit ordering connective:
    #   "YY only after XX", "before YY, XX must hold". YY is always the result this policy produces (the figure it computes,
    #   the entry it books, the state it sets). XX takes one of two forms, declared in `form`:
    #     state  (PREFERRED) — XX is a STATE the records make visible: a kind of entry standing on an account, a status, a
    #            field, a balance, a date, named in the words the tables and finders use. The sentence names no action, no
    #            performer and no tool. The reader learns what must be true, sees in the records that it is not, and must
    #            then work out from the other policies which problem's write brings that state about — the state is the
    #            consequence of an action, and finding the action is the layer of reasoning this form buys. A state-form
    #            sentence is legal only where exactly one policy's write in this difficulty brings that state about.
    #     action (FALLBACK) — XX is the depended-on action itself, named in plain business language ("... is assessed",
    #            "the standing instruction is cancelled"). Used only where no record-visible state can carry the
    #            dependency — the depended-on write leaves no state the blocked policy's records show, or the state it
    #            leaves does not single out that write — and `fallback_reason` says why. Even here the sentence names the
    #            action, never its tool, never a policy id, never any code name.
    #   Four points define the sentence in either form:
    #     1. it joins this policy's own result and the thing it waits on with an explicit ordering or timing connective
    #        (before, after, only after, only once, until, not until, first, prior to); the gate requires one;
    #     2. its XX side is a record-visible state (state form) or a plainly named business action (action form), never a
    #        mixture of the two;
    #     3. it names no tool, no policy id, no snake_case token, no row id — nothing the runtime schema or this yaml uses
    #        as a name;
    #     4. it is written at exactly the strength and scope this policy intends: a hard requirement reads "only after /
    #        not before / must"; a closed set of item kinds is named by those kinds; an open set is stated as open — no
    #        wider and no narrower than `condition`.
    #   Prerequisite sentence + the current records + the depended-on policy's own rule (what its write books, and that it
    #   is the one write that does) must lead a reader to exactly one resolving action. The rule carries nothing else about
    #   that dependency: no second wording, no tool name, no "call X". A cross-problem ordering sentence in a rule that
    #   grounds no declared edge is an undeclared dependency. Where the dependency rests on convention alone — an order with
    #   no state and no action behind it — there is no edge and no order. A base rule that states a cross-problem order may
    #   not be cited as the ground of an edge; the prerequisite sentence lives in this policy's own rule.
    prerequisite:
      - problem: <category>_ext_<other_key>
                                          # the id of the depended-on problem: another extended_policies[].id in this file.
                                          #   It may not point at a base policy (base is a source of eligibility, not a problem
                                          #   that can be "resolved"), and may not be self-referential; all prerequisite edges
                                          #   together must form a directed acyclic graph.
        kind: state_gate | value_input     # how this edge bears weight:
                                          #   state_gate = the depended-on problem's write flips one of this problem's
                                          #     eligibility gates from false to true;
                                          #   value_input = the depended-on problem's write changes the value of one of
                                          #     this problem's compute bindings.
                                          # Every task's problem tree (1 to 3 prerequisite problems, the count drawn per
                                          #   task by scripts/draw_counts.py) needs at least max(n-1, 1) value_input edges for n prerequisite
                                          #   problems — one for a tree of one or two, two for a tree of three — or the
                                          #   calculation test rests on nothing at all or on status flips alone.
        gate: <policy_id>.<eligibility_id> | <table>.<field> | <compute_binding_name>
                                          # where the gate sits: state_gate gives an eligibility id or a field path;
                                          #   value_input gives the affected binding name in this policy's compute.
                                          # This is the state the prerequisite sentence waits on, in business words.
        form: state | action               # the form of the prerequisite sentence: state unless no record-visible state
                                          #   can carry this dependency (then action, with fallback_reason below)
        policy_source: >-
          <the PREREQUISITE SENTENCE, quoted verbatim from THIS policy's own rule; after whitespace normalisation it must be
           a substring of that rule (never of a base rule). It passes the four-point test above, carries an ordering
           connective, waits on the state named in gate (state form) or on the depended-on action in business words
           (action form), and names no tool, no policy id and no code token. It is the only normative text of this edge:
           no other field of the edge is ever published anywhere.>
        fallback_reason: >-
          <ONLY when form is action, and absent otherwise: why no record-visible state can carry this dependency — which
           state the depended-on write leaves, and why that state does not single out that write, or why there is none the
           blocked policy's records show. The audit checks that a state form was not available.>
        condition: >-
          <the state of the records that must hold at this problem's handling time, in record terms. An authoring and
           verification field: in the state form it names the same state the sentence waits on; in the action form it names
           the state the named action leaves behind. It is what a task's unresolved_at_frozen_time shows false at the opening
           and flips_to_true_by shows restored by the resolving write.>
        resolved_by: <task_tool_name>
                                          # the action that resolves it: the depended-on problem's target_tool. It must be an
                                          # action completable synchronously within the same frozen_time; a prerequisite that
                                          # can only be resolved by waiting for a real-world event is never legal. This name
                                          # never appears in any rule.
        effect: >-
          <which gate of this problem becomes satisfied once it is resolved, or which compute binding changes to what value;
           it restates, from this policy's side, the effect the depended-on policy's own rule already states in its own terms>

    # Cross-category conditions (required on every extended_policy; write [] where compute reads no other category): another
    # category may serve only as an EXISTENCE, a BRANCH or a HISTORY condition, read-only, and is never written by this policy.
    # Every category declared here must be genuinely referenced by an EXISTS/CPARAM/CFIELD/XSUM/XCOUNT/XMAX/XLATEST in compute
    # and registered item by item in inputs.cross_category, and every category compute reads must be declared here; a
    # decorative dependency that is registered but never enters the formula is rejected by the gate. A policy reads another
    # category only where the quantity it settles genuinely turns on it. The cross_difficulty factors of this policy read
    # their tier from one of these categories.
    cross_category:
      - category: <other_category>         # another category declared in the blueprint (another DIFFICULTY's product)
        as: existence | branch | history   # existence = whether it is held; branch = its tier/status decides which way this
                                          #   calculation goes; history = that category's EVENT LEDGER for this customer is
                                          #   aggregated (XSUM/XCOUNT/XMAX/XLATEST) to decide a factor's tier
        reads: [status | variant_name | <field> | <event_table>.<field>]   # this policy reads only these; it writes none
        note: <one sentence — which factor's tier this cross-difficulty read decides, and from which records>

    # The calculation core: ordered intermediate bindings, whose last item, result, is the scored parameter value. Each binding is
    # one {name: restricted expression}.
    # Allowed primitives (implemented exactly by check_compute.py; a wrong name is a red light):
    #   NOW                     the date part of this task's frozen_time, 'YYYY-MM-DD'
    #   HID                     the primary id of the holding in this category the calculation acts on
    #   CUST                    that holding's customer_id
    #   F('<field>')            a field value of this holding
    #   P('<param>')            the value of that parameter for this holding's tier (variant_name) in base variants
    #   SUM('<evt_table>','<field>', within_months=N, date_field='<d>', <eq_filters>)  sum over this holding's event history
    #   COUNT('<evt_table>', within_months=N, date_field='<d>', <eq_filters>)          count
    #   MAX('<evt_table>','<field>', <eq_filters>) / LATEST('<evt_table>','<field>', date_field='<d>', <eq_filters>)
    #     -- the history primitives above are AUTOMATICALLY SCOPED TO THIS HOLDING (a <holding_pk>=HID filter is added) and then
    #        narrowed further by eq_filters such as event_type
    #   EXISTS('<other_cat>', <eq_filters>)                whether the customer holds a matching contract in another category (customer_id=CUST is added automatically)
    #   CPARAM('<other_cat>','<param>', <eq_filters>)      the tier parameter of the matching holding in another category (for branch conditions)
    #   CFIELD('<other_cat>','<field>', <eq_filters>)      a field of the matching holding in another category
    #   XSUM('<other_cat>','<evt_table>','<field>', within_months=N, date_field='<d>', <eq_filters>)
    #                           sum over ANOTHER category's event history for this customer (rows carrying customer_id=CUST,
    #                           or pointing at one of the customer's holdings of that category); the table must be an event
    #                           table of that category. XCOUNT / XMAX / XLATEST mirror COUNT / MAX / LATEST the same way.
    #                           These are how a factor's tier is decided from another DIFFICULTY's ledger ("3 or more card
    #                           purchases in the last 3 months", "an auto installment returned in the current cycle").
    #   K('<key>')              a constant registered in this policy's params section (a number appears once, in params, and compute references it through K)
    #   MONTHS(d1,d2) / DAYS(d1,d2)   whole months / days between two 'YYYY-MM-DD' dates
    #   MX/MN/RND/ABS plus arithmetic, comparison, and/or/not, the ternary (A if C else B), and min/max/round/abs/float/int
    #
    # A binding is NOT a factor. A factor (declared under `factors` below) is a TRIGGER CONDITION plus an EFFECT — a rule
    # with a ladder that decides one of the K inputs of the result, by a value or by a method; its machine face is one or more
    # of these bindings. Plain reads (F/P/K), arithmetic plumbing, aggregates with no rule attached, guards such as MX(0, x),
    # and the yes/no gate of a prerequisite problem are bindings but never factors. Write compute so that each factor's
    # ladder is one readable binding — a ternary chain whose tests are the tier conditions, every one of them `A and B` or `A or B` where the factor is multi-source —
    # fed by the evidence bindings that establish its tier; the fall-through of the chain is the baseline.
    compute:
      - <evidence_a>: "<COUNT/SUM/LATEST/XCOUNT/... — the record-derived quantity a factor's tier rests on>"
      - <tier_a>: "<a ladder over <evidence_a> and tier/policy parameters: value_1 if ... else (value_2 if ... else value_0)>"
      - <evidence_b>: "<CFIELD/CPARAM/XSUM ... — a cross-difficulty quantity>"
      - <tier_b>: "<its ladder>"
      - <intermediate>: "<expr over several tier bindings>"   # iteration: an intermediate feeds the next layer
      - result: "<expr>"                   # last item: the scored parameter value (gold's argument must equal it exactly)

    # compute_basis: a reference table parallel to compute (the two-way equivalence discipline of Principle D / Step 1).
    # For every binding that READS THE WORLD or MAKES A CHOICE (the aggregation primitives SUM/COUNT/MAX/LATEST, the cross-
    # category reads EXISTS/CPARAM/CFIELD/XSUM/XCOUNT/XMAX/XLATEST, conditional branches, caps/rounding), give: binding name ->
    # the VERBATIM QUOTATION of the rule sentence it implements; a factor's ladder binding quotes the sentences stating its tiers.
    # Wherever the calculation actually involves a rate acting on a combined versus an itemised amount, the base it acts on, the
    # order or grouping of operations, the point at which a cap/floor applies, or the rounding mode/precision/point, the rule
    # sentence pinning that relationship must likewise be quoted verbatim; pure algebraic plumbing (a+b) is exempt, but that
    # exemption may never be used to skip a semantic that changes the result.
    # No quotable sentence = the rule is missing that link: add it to the rule first, then write the formula; a formula may never
    # invent a basis the rule does not state.
    # When attaching a quotation, cross-check the sensitive words: a quotation containing "current period / this period / calendar
    # month / the last N months" -> the expression must have within_months= or a billing-period filter; containing "unsettled /
    # already invoiced / waived does not count" -> it must have the matching status filter; containing "whichever of ... applies /
    # depending on ..." -> it must have a ternary branch; containing "no more than / capped at" -> it must have MN; containing
    # "rounded / to two decimal places" -> it must have RND/int. The reverse is equally guilty: a filter present in the expression
    # but absent from the quotation means either adding it to the rule or deleting the filter. Once compute is written, sweep back:
    # every load-bearing sentence of the rule carrying a quantity/window/branch/cap semantic must be claimed by some basis, and an
    # unclaimed sentence is an empty promise — add the binding or delete the sentence.
    compute_basis:
      <evidence_a>: "<the rule sentence pinning this aggregation basis, verbatim>"
      <tier_a>: "<the rule sentence stating this factor's ladder — every tier's condition and value — verbatim>"

    # factors: the FACTORS of this computation. A factor is a rule that changes the number, defined by a TRIGGER
    # CONDITION and an EFFECT. This is the unit the difficulty is counted in, audited in, and rendered in (one KB fragment
    # per factor). A line of compute is never a factor; a factor is usually several bindings (its evidence + its ladder).
    #
    # TRIGGER CONDITION = a ladder: the customers are partitioned into >= 3 tiers by conditions over the records —
    #   pairwise disjoint as stated, so a customer sits on exactly one tier by the conditions' words and never by
    #   the order the tiers are listed in; a factor is MULTI-SOURCE when every tier other than the fall-through
    #   combines >= 2 conditions over distinct evidence by AND or by OR. Every tier's condition rests on records — a
    #   history aggregate, a date span, another category's holding or ledger — never on a field that names the outcome
    #   (a "discount applies" stamp; where one exists it is stale, absent or contradicted). The partition is one the
    #   business would draw for the quantity the factor decides: the evidence the ladder reads bears on that quantity in
    #   a way that line of business recognises, and the tiers run in the direction that relation gives; a condition with
    #   no business bearing on what it decides, a condition repeated from another factor because the customer already
    #   satisfies it, or a tier added only to reach the tier count is not a factor.
    # EFFECT = what the selected tier does, labelled by `effect`:
    #   parameter  the tier selects a VALUE that enters an otherwise fixed formula: a rate, a fee, a threshold, an
    #              allowance, bonus points ("gold with 3 purchases in 3 months: 96 percent of the standard rate; silver
    #              with 5: 98 percent; otherwise the standard rate").
    #   method     the tier selects HOW a quantity is computed — the algorithm changes, not just a number in it.
    #              The families below are a reference, not a closed list: a method factor is chosen from the
    #              scenario, may fall outside them, and must be a way the calculation genuinely varies in that
    #              line of business, never a variation invented for difficulty's sake. Reference families:
    #                - a transform or multiplier on an intermediate or on the result ("3,000 of card purchases in the
    #                  last year: twice the refund"; "gold: overdue days halved; silver: times 0.75; else as booked");
    #                - the day-count or window convention (actual/365 vs 30/360; calendar vs business days; inclusive
    #                  vs exclusive endpoints; the last 3 statements vs the last 90 days vs since the last reset);
    #                - the anchor the clock starts from (posting date / due date / the next business day);
    #                - the order candidates are tried in or the selection rule among them (the money market before
    #                  the statement savings / the latest entry / the largest / the first in the cycle).
    #              These are the families a real business varies customer by customer. The rounding mode, the base a
    #              rate acts on, the order of two operations, the moment of a cap, the aggregation, the accrual method
    #              and the grain are fixed by the product and never selected by a tier; where the calculation leaves
    #              no ambiguity about them they need not appear in the rule, where it does the rule states them.
    #              Every option a method tier selects must be a rule the charter states (base rule, tier parameter);
    #              a method is never invented for difficulty's sake.
    # LOAD-BEARING on every task world it is evaluated in: an agent who never finds this factor's document computes the
    #   input as the BASELINE states it (the default value, or the standard method — the factor's fall-through tier) and
    #   arrives at a DIFFERENT result. check_compute substitutes the factor's `baseline` and requires `result` to change; a
    #   factor whose baseline gives the same number is decoration and fails. Substituting every factor's baseline at once
    #   is the fall-back of an agent who read only the computation document: it must be a definite number, differing from
    #   gold. There is no requirement that any branch stay untriggered.
    # CROSS-DIFFICULTY: the tier is decided from the customer's holdings or ledger in ANOTHER difficulty's product
    #   (CFIELD/CPARAM/EXISTS on that category, or XSUM/XCOUNT/XMAX/XLATEST over its event tables), and initial_state
    #   seeds that evidence for this customer.
    # Per computation: 4 to 6 factors (exactly the count scripts/draw_counts.py draws for the problem), >= 2 effect=parameter,
    # >= 1 effect=method. Per task, over all of its computations: >= 1 multi-source and >= 1 cross_difficulty — neither is
    # asked of every computation (the sets may overlap). A factor's `baseline`, `evidence` and `cross_difficulty` are authoring/gate fields and are
    # never published; the ladder itself IS policy and is rendered in full (every tier, its condition and its value or
    # method) in that factor's own document, which never mentions the computation document or any other factor.
    #
    # THE BASELINE (declared once per policy, below the factors): the standard method and the default values of this
    # computation. It is the root: every factor's fall-through tier IS the baseline, and a factor only replaces a value or
    # a method of it for customers in a given situation. It is rendered as ONE document — the computation document — that
    # is complete and coherent on its own and silent about the existence of any factor, so that an agent who finds it and
    # nothing else computes a definite, wrong number without any signal (a discrete topology: the computation document
    # and the N factor documents never reference one another).
    factors:
      - id: <factor_key>                   # unique within this policy; the KB fragment carrying this factor sets meta.factor to it
        effect: parameter | method         # the kind of effect the selected tier has (see above)
        decides: <tier_a>                  # the compute binding that carries this factor's effect (never `result`)
        bindings: [<evidence_a>, <tier_a>] # every compute binding that belongs to this factor (its evidence + its ladder);
                                          #   a binding belongs to at most one factor; `decides` is one of them; the
                                          #   ladder is written as a ternary chain whose tests are the tier conditions, so
                                          #   the bindings fork at least (tiers - 1) times, every test `A and B` / `A or B` where multi-source
        ladder:                            # >= 3 tiers, pairwise disjoint as stated, listed from the most specific to the fall-through, in business words
          - when: "<a condition in the words the records use; for a multi-source factor an `A and B` or `A or B` over distinct evidence, e.g. the account's tier AND a count over a window>"
            value: "<parameter factor: the value or parameter this tier selects, e.g. P('<param>') or K('<key>')>"
          - when: "<the next tier>"
            value: "<...>"
          - when: "otherwise"
            value: "<the fall-through value>"
      - id: <method_factor_key>
        effect: method
        decides: <adjusted_quantity>
        bindings: [<evidence_b>, <adjusted_quantity>]
        ladder:
          - when: "<e.g. a gold-tier card holder AND no returned payment in the current cycle>"
            method: "<the computation rule this tier applies, e.g. the overdue days are halved and rounded down to a whole day>"
          - when: "<e.g. a silver-tier card holder AND no returned payment in the current cycle>"
            method: "<e.g. the overdue days are multiplied by 0.75 and rounded up to a whole day>"
          - when: "otherwise"
            method: "<the standard method, e.g. the overdue days are counted as booked>"
        baseline:                          # what this factor's decides binding is under the baseline (its fall-through tier):
          <adjusted_quantity>: "<restricted expression: the standard method / the default value, exactly as `baseline.rule` states it>"
        evidence: [history | cross_category | date | tier_param]   # what the tier is established from (>= 1 record-derived kind)
        cross_difficulty: <other_category> | null   # set when the tier is decided from another difficulty's records; that
                                          #   category must be declared in cross_category and read by this factor's bindings
      # ... 4 to 6 factors: >= 2 parameter, >= 1 method; over the task's computations >= 1 multi-source and >= 1 with cross_difficulty set ...

    # baseline: the standard method and default values (the computation document). Two faces, kept in step with `compute`:
    baseline:
      rule: >-
        <a self-sufficient paragraph — every sentence of it verbatim in this policy's `rule` — stating the standard method
         and the default values from which a reader computes the result with no factor applied: which quantities enter,
         from which records, the default rate / fee / allowance, the standard rounding, window, base and order. It names
         no situation in which anything differs, no adjustment, no exception, no other rule: the KB renders it as the
         computation document, and the factors' documents are found only from the customer's records.>
      params: [<key>, ...]                # the quantitative keys (this policy's params and the tier parameters) that are the
                                          #   DEFAULTS — their single documentary home is the computation document; a factor's
                                          #   tier-specific keys are homed in that factor's document instead

    # inputs: declares the history span and cross-category dependencies this calculation genuinely reconciles, so the gate can
    # check that history reconciliation / cross-category reading actually happens
    inputs:
      history:
        - {table: <evt_table>, aggregate: sum|count|max|latest, field: <f>, within_months: N, filters: {<eq>}}
        - {category: <other_category>, table: <other_evt_table>, aggregate: sum|count|max|latest, field: <f>, within_months: N, filters: {<eq>}}
                                          # a cross-difficulty history read carries the other category explicitly
      cross_category: [<other_category>, ...]

  # Every extended_policy's cross_category lists exactly the other categories its compute reads ([] where it reads none), each
  # of them genuinely entering the formula, and its result drives a write in this category only.
  # ... add as many more as needed to cover the calculation parameters of all M tasks ...
  # Closure iron rule (Principle F): every policy declared here is claimed by exactly one task's charter_scope (the M tasks'
  # scopes are pairwise disjoint and jointly cover every policy), and that task's computations actually recompute it at the
  # GT call of its target_tool; reserving idle policies for future tasks is forbidden.
