# The extended product-charter skeleton for one difficulty. The core artifact of erl-task-instantiate.
# Path: env/<scenario>/tasks/<difficulty>/<category>.extended.yaml
#
# This file = a COMPATIBLE SUPERSET of the blueprint's products/<category>.yaml: the base section is
# preserved verbatim, plus two extra top-level keys, workflows and extended_policies.
# extended_policies layer more complex calculation logic on top of the base policies, and stand to
# base as a version update: where they conflict, extended wins — but every single conflict must be
# declared, sentence by sentence, in that policy's overwrite. The base section itself is never
# touched: an override holds because it is declared on the extended side, not because someone edited
# the copy of base.
# The structure IS the template: keys and nesting are fixed, placeholder content is replaced with
# what is true of the scenario; no domain examples are given.

# ============================================================================
# base section: copy every key of env/<scenario>/blueprint/products/<category>.yaml verbatim,
# changing nothing (category / display_name / binding / lifecycle / accounts /
# parameter_schema / variants / measures / events / policies). Elided here; the real file must
# contain all of it.
# ============================================================================
category: <category_key>          # identical to base
# ... every remaining base key copied verbatim ...

# ============================================================================
# extended_policies: the complex multi-factor calculation policies this difficulty adds
# (layered on top of the base policies)
# ============================================================================
extended_policies:
  - id: <category>_ext_<key>              # unique across the scenario, prefixed with this category
    base_policy_refs: [<category>_<base_rule_key>, ...]
                                          # required and non-empty: list every base policy whose subject intersects
                                          # this policy's subject, not merely the ones the formula reads directly;
                                          # other base bases the compute genuinely reads may also be referenced.
                                          # For those that intersect this subject, all of their eligibility is
                                          # inherited into task.solvability_contract; a time gate may not change anchor.
                                          # If no source can be found, or a base prerequisite hides in vague prose, go
                                          # back and fix the blueprint — legislating locally is forbidden.
    overwrite:                            # required; declares what this policy overrides relative to base, [] when nothing
                                          # Semantics: extended is a version update of base, and extended wins where they
                                          #   conflict; but the override must be explicit, sentence by sentence and
                                          #   traceable — an undeclared deviation is a red light, not implicit permission.
                                          # The granularity is the CLAUSE, not the whole policy: only the named sentence
                                          #   is retired, and unlisted clauses of the same base policy stay in force and
                                          #   continue to be inherited.
                                          # What is overridden is the HANDLING BASIS, not the PARAMETER VALUE: base's
                                          #   params values remain valid and remain carried by base; this field declares
                                          #   only which handling sentence is superseded.
                                          # How to decide: evaluate the quantity this policy computes and base's rule for
                                          #   the same quantity, each once, in the same world. Different -> it must be
                                          #   declared here; identical -> write [].
                                          #   Calling base's output a "wrong value" anywhere in your own notes while not
                                          #   declaring it here IS an undeclared override.
      - base_policy: <category>_<base_rule_key>
                                          # a base policy already declared by this category, which must also appear in base_policy_refs
        superseded_clause: >-
          <the sentence quoted verbatim from that base policy's rule; after whitespace normalisation it must be a substring of it>
        replaced_by: >-
          <the sentence quoted verbatim from this policy's own rule; after whitespace normalisation it must be a substring of it>
    trigger: state_due | on_request       # the trigger type from section F / Step 1 (the premise of the closure test); one of two:
                                          #   state_due = debt-like. It is owed as soon as the state of the world satisfies it,
                                          #     whatever the customer called about (late fees / overdue interest / a charge that
                                          #     should be collected / clearing up an entitlement that should have been granted).
                                          #     If some task's seed lights it, this policy must be carried by that task's GT write
                                          #     step and actually recomputed by that step's computation; a workflow task must
                                          #     additionally embed it in the corresponding workflow step (sections E/F and Steps 1/3).
                                          #   on_request = quote-like. It happens only when the customer asks, and the formula is
                                          #     merely a quoting device for "if we do it, how much" (withdrawal / closure
                                          #     settlement / refund / offset / change difference). Since this difficulty declares
                                          #     the policy, at least one task must genuinely ask for it and use it at the
                                          #     corresponding GT call; an idle quoting device is forbidden. If a workflow task
                                          #     uses it, it must also be embedded in the corresponding workflow step.
                                          # Ask yourself: "with no customer calling at all, should this money already be on the
                                          # books at month-end reconciliation?" Should = state_due, should not = on_request. No
                                          # answer = who triggers this business is vague in the prose; think it through first.
    subject: [<category>_<event_key>]      # an event already declared by this category — which write this calculation constrains
    computes: <arg_name>                   # the name of the write parameter this policy computes (= one argument of target_tool)
    target_tool: <task_tool_name>          # the task tool that receives that parameter (defined in task_tools.py).
                                          # Closure iron rule (section F): one (target_tool, computes) pair is claimed by at most
                                          # one policy — where several charges genuinely must go through the same write action,
                                          # merge them into one policy with an enum branch (the branch goes into compute, subject
                                          # to domain parity), or split them into different tools by billing subtype.
    rule: >
      <a paragraph in English: a refinement written for all customers, consistent with base_policy_refs and detailed enough to
       execute on its own — state per factor where its value comes from (which stretch of ledger aggregated on what basis, which
       tier parameter, which cross-category condition reading which field of which table), the criterion for each condition,
       whether a rate acts once on the combined amount or item by item, the base each quantity acts on, the order and grouping of
       operations, whether the cap/floor applies before or after the deduction, and the rounding mode / precision / point.
       These relationships must be written out exclusively in plain prose, never left for the reader to guess behind summary words
       like "then", "next" or "combined".
       Negative space is written as a conditional clause ("those meeting X are granted/charged Y; those not meeting it are out of scope").
       Someone reading only this paragraph should be able to recompute the same number without seeing compute. It must never carry
       the shadow of any specific task (authoring-viewpoint meta notes such as "may be zero in practice / not triggered in this
       task" are a red light). A new factor must come from a base charter asset or from world state; never invent a rate,
       threshold, exception or business effect out of nothing. A number appears once, in params/compute, and the prose does not
       restate it.>

    # Problem dependency (required on every extended_policy; write [] when there is none): declares WHICH OTHER PROBLEMS MUST BE
    # RESOLVED BEFORE THIS ONE CAN BE HANDLED.
    # Semantic boundary: a prerequisite is a PROBLEM-to-PROBLEM dependency, not the step order inside one problem (that lives in
    #   workflow.steps and order_rationale). An extended_policy and a workflow are both "the solution to one problem", a workflow
    #   being an ordered composition of several extended_policies; either can be the problem of a prerequisite, and either can have
    #   prerequisites of its own.
    # Only GENERAL text goes here, never the shadow of a specific task: say "that must be settled before this can be handled",
    #   never "in this task it is not settled at the opening" — the latter is a task-level fact and belongs in task.json's
    #   prerequisite_closure.
    # The tool layer NEVER validates a prerequisite: while it is unresolved, this problem's target_tool remains callable and still
    #   writes faithfully. Every prerequisite judgement is made by the solving agent, from the documents and the world.
    prerequisite:
      - problem: <category>_ext_<other_key> | <workflow_key>
                                          # the id of the depended-on problem: another extended_policies[].id or
                                          #   workflows[].id in this file. It may not point at a base policy (base is a
                                          #   source of eligibility, not a problem that can be "resolved"), and may not be
                                          #   self-referential; all prerequisite edges together must form a directed
                                          #   acyclic graph.
        kind: state_gate | value_input     # how this edge bears weight:
                                          #   state_gate = the depended-on problem's write flips one of this problem's
                                          #     eligibility gates from false to true;
                                          #   value_input = the depended-on problem's write changes the value of one of
                                          #     this problem's compute bindings.
                                          # Every task's problem tree needs at least one value_input edge, or the whole
                                          #   tree tests only ordering and never calculation.
        gate: <policy_id>.<eligibility_id> | <table>.<field> | <compute_binding_name>
                                          # where the gate sits: state_gate gives an eligibility id or a field path;
                                          #   value_input gives the affected binding name in this policy's compute.
        condition: >-
          <the sentence that must hold before this problem can be handled, verbatim>
        policy_source: >-
          <the sentence quoted verbatim from this policy's own rule, or from the rule of one of its base_policy_refs;
           after whitespace normalisation it must be a substring of it. It proves the prerequisite IS WRITTEN INTO GENERAL
           TEXT and will therefore reach the only policy surface the agent can see once the KB is rendered. No quotable
           sentence = the prerequisite exists only in the author's head -> add it to the rule or delete the edge.>
        resolved_by: <task_tool_name> | <workflow_key>
                                          # the action that resolves it: the depended-on problem's target_tool (a policy) or
                                          # a workflow id. It must be an action completable synchronously within the same
                                          # frozen_time; a prerequisite that can only be resolved by waiting for a real-world
                                          # event is never legal.
        effect: >-
          <which gate of this problem becomes satisfied once it is resolved, or which compute binding changes to what value>

    # Cross-category conditions (required and non-empty on every extended_policy): another category may serve only as an
    # EXISTENCE or a BRANCH condition, read-only, and is never written by this policy. Every category declared here must be
    # genuinely referenced by an EXISTS/CPARAM/CFIELD in compute and registered item by item in inputs.cross_category; a
    # decorative dependency that is registered but never enters the formula is rejected by the gate.
    cross_category:
      - category: <other_category>         # another category declared in the blueprint
        as: existence | branch             # existence = whether it is held; branch = its tier/status decides which way this calculation goes
        reads: [status | variant_name | <field>]   # this policy reads only these; it writes none
        note: <one sentence — how this cross-category condition affects one factor of this category's calculation>

    # The calculation core: ordered intermediate bindings, whose last item, result, is the scored parameter value. Each binding is
    # one {name: restricted expression}.
    # Allowed primitives (implemented exactly by check_compute.py; a wrong name is a red light):
    #   NOW                     the date part of this task's frozen_time, 'YYYY-MM-DD'
    #   HID                     the primary id of the holding in this category the calculation acts on
    #   CUST                    that holding's customer_id
    #   F('<field>')            a field value of this holding
    #   P('<param>')            the value of that parameter for this holding's tier (variant_name) in base variants
    #   SUM('<evt_table>','<field>', within_months=N, date_field='<d>', <eq_filters>)  sum over this holding's event history
    #   COUNT('<evt_table>', within_months=N, date_field='<d>', <eq_filters>)          count
    #   MAX('<evt_table>','<field>', <eq_filters>) / LATEST('<evt_table>','<field>', date_field='<d>', <eq_filters>)
    #     -- the history primitives above are AUTOMATICALLY SCOPED TO THIS HOLDING (a <holding_pk>=HID filter is added) and then
    #        narrowed further by eq_filters such as event_type
    #   EXISTS('<other_cat>', <eq_filters>)                whether the customer holds a matching contract in another category (customer_id=CUST is added automatically)
    #   CPARAM('<other_cat>','<param>', <eq_filters>)      the tier parameter of the matching holding in another category (for branch conditions)
    #   CFIELD('<other_cat>','<field>', <eq_filters>)      a field of the matching holding in another category
    #   K('<key>')              a constant registered in this policy's params section (a number appears once, in params, and compute references it through K)
    #   MONTHS(d1,d2) / DAYS(d1,d2)   whole months / days between two 'YYYY-MM-DD' dates
    #   MX/MN/RND/ABS plus arithmetic, comparison, and/or/not, the ternary (A if C else B), and min/max/round/abs/float/int
    compute:
      - <factor_1>: "<expr>"               # e.g. look a parameter up from the tier / read a current value from a record
      - <factor_2>: "<expr>"               # e.g. sum or back out a stretch of history (history reconciliation)
      - <factor_3>: "<expr>"               # e.g. a threshold-ladder ternary (an if-else value)
      - <factor_4>: "<expr>"               # e.g. an uplift decided by cross-category existence/branch
      - <intermediate>: "<expr over several earlier factors>"   # iteration: an intermediate feeds the next layer
      - result: "<expr>"                   # last item: the scored parameter value (gold's argument must equal it exactly)

    # compute_basis: a reference table parallel to compute (the two-way equivalence discipline of section D / Step 1).
    # For every binding that READS THE WORLD or MAKES A CHOICE (the aggregation primitives SUM/COUNT/MAX/LATEST/EXISTS/CPARAM,
    # conditional branches, caps/rounding), give: binding name -> the VERBATIM QUOTATION of the rule sentence it implements.
    # Wherever the calculation actually involves a rate acting on a combined versus an itemised amount, the base it acts on, the
    # order or grouping of operations, the point at which a cap/floor applies, or the rounding mode/precision/point, the rule
    # sentence pinning that relationship must likewise be quoted verbatim; pure algebraic plumbing (a+b) is exempt, but that
    # exemption may never be used to skip a semantic that changes the result.
    # No quotable sentence = the rule is missing that link: add it to the rule first, then write the formula; a formula may never
    # invent a basis the rule does not state.
    # When attaching a quotation, cross-check the sensitive words: a quotation containing "current period / this period / calendar
    # month / the last N months" -> the expression must have within_months= or a billing-period filter; containing "unsettled /
    # already invoiced / waived does not count" -> it must have the matching status filter; containing "whichever of ... applies /
    # depending on ..." -> it must have a ternary branch; containing "no more than / capped at" -> it must have MN; containing
    # "rounded / to two decimal places" -> it must have RND/int. The reverse is equally guilty: a filter present in the expression
    # but absent from the quotation means either adding it to the rule or deleting the filter. Once compute is written, sweep back:
    # every load-bearing sentence of the rule carrying a quantity/window/branch/cap semantic must be claimed by some basis, and an
    # unclaimed sentence is an empty promise — add the binding or delete the sentence.
    compute_basis:
      <factor_2>: "<the rule sentence pinning this aggregation basis, verbatim>"
      <factor_3>: "<the rule sentence pinning this branch decision, verbatim>"

    # inputs: declares the history span and cross-category dependencies this calculation genuinely reconciles, so the gate can
    # check that history reconciliation / cross-category reading actually happens
    inputs:
      history:
        - {table: <evt_table>, aggregate: sum|count|max|latest, field: <f>, within_months: N, filters: {<eq>}}
      cross_category: [<other_category>, ...]

  # Every extended_policy's cross_category must be non-empty, genuinely enter compute, and its result must drive a write in this
  # category only.
  # ... add as many more as needed to cover the calculation parameters of all M tasks ...
  # Closure iron rule (section F): every policy declared here and used by the workflow task must appear in some step.computed_by
  # list below, policy.target_tool must equal that step.tool, and computations must actually recompute it at that task's
  # corresponding GT call action. A policy not used by the workflow must be genuinely covered by another task's disjoint
  # charter_scope and computations; reserving idle policies for future tasks is forbidden.

# ============================================================================
# workflows: exactly one per difficulty, carrying the complete non-trivial SOP of exactly one of its tasks.
# steps contains only the WRITE steps of task_tools (never share/read tools), and at least one step must be `owner: user` because
# the semantics genuinely require the customer in person; lookups never enter a workflow. Exactly one task must claim this
# workflow in charter_scope.workflows, and its GT task-tool write sequence must equal steps step by step in tool, owner and order.
# Each step's subject declares precisely the one base event that atomic tool realises at that step, and base_policy_refs must list
# every base policy whose subject is that event; computed_by is always a list. That way, even a customer-confirmation or intake
# step that computes no extended parameter still contributes its base eligibility to the task's pre-write evidence ledger, instead
# of vanishing because computed_by=[].
# The union of the policy ids in computed_by must equal exactly the policy set of the workflow task; it need not cover all of this
# difficulty's extended policies, and the remaining tasks together cover the rest.
# Every reference must land, through one computations record in the workflow task, on the GT call action corresponding to that step.
# Zero-wait iron rule: from step 0 to the terminal state, everything must be completable synchronously within one consultation, at
# one frozen_time. Every prerequisite of a later step may come only from an authoritative fact already established in initial_state
# before the consultation, the real business effect of a preceding synchronous tool, or input the customer can supply immediately
# in this turn. A diagnosis / visit / delivery / call-out / payment clearing / manual review / external approval / back-office batch
# / future date / passage of time that can only occur after the opening may never become a prerequisite of a later step. Creating a
# completed row, changing a status, renaming a tool or having the persona claim completion cannot launder a real-world event into a
# synchronous fact; an unavoidable waiting point must be the end of the workflow, and the actions after the wait become the task of
# a later consultation. If the immediate portion has fewer than 4 non-trivial write steps, change the workflow scope instead.
# ============================================================================
workflows:
  - id: <workflow_key>
    scenario: <general English text — the business situation this SOP applies to; which kind of holding, in what state/conditions,
      is handled by this procedure, and what terminal state the world is in once it is done. It is a description of scope written
      for all customers; it never restates the steps sequence (order lives in steps), and never carries the shadow of a specific task.>
    steps:                                 # >=4 task_tool write steps, in non-trivial SOP order
      - {tool: <task_tool_A>, owner: agent, writes: <table>, subject: <base_event_type_A>, base_policy_refs: [<all_base_policies_governing_A>], role: <intake/settle/...>, computed_by: [<category>_ext_<key_A>]}
      - {tool: <task_tool_B>, owner: agent, writes: <table>, subject: <base_event_type_B>, base_policy_refs: [<all_base_policies_governing_B>], role: <the computed key parameter>, computed_by: [<category>_ext_<key_B>, <category>_ext_<key_C>]}
      - {tool: <task_tool_C>, owner: user,  writes: <table>, subject: <base_event_type_C>, base_policy_refs: [<all_base_policies_governing_C>], role: <customer-in-person confirmation>, computed_by: []}
      - {tool: <task_tool_D>, owner: user,  writes: <table>, subject: <base_event_type_D>, base_policy_refs: [<all_base_policies_governing_D>], role: <transition/closure>, computed_by: [<category>_ext_<key_D>]}
    dataflow:                              # required list; register every real cross-step dependency, [] when there is none
      - from_step: 0                       # the 0-based producing step in workflow.steps
        to_step: 1                         # must be strictly later than from_step
        kind: object_binding               # object_binding = the later step consumes a concrete object/value the earlier step produced;
                                            # state_effect = the earlier step's status change is itself a base eligibility
                                            # prerequisite of the later step
        source_table: <table_written_by_from_step>
        source_field: <field_created_or_changed_by_from_step>
        consumer_bindings:                 # non-empty when kind=object_binding; [] for state_effect
          - action_arg: <to_step_task_tool_arg>
            role: direct                   # direct = an ordinary object hand-off
          - action_arg: <to_step_task_tool_arg>
            role: authorization            # authorization = it also carries the object correlation of a base eligibility
            policy_id: <base_policy_id>
            eligibility_id: <gate_id>
            gate_field: <table>.<field>
      # For kind=state_effect, write a link of the same shape with consumer_bindings: [], and additionally required:
      #   establishes_gates:
      #     - policy_id: <consumer_base_policy_id>
      #       eligibility_id: <consumer_gate_id>
      #       evidence_field: <source_table>.<source_field>
      # Where one status change satisfies several consumer gates, list them all.
      # State plainly that the status field the earlier step changed IS the later step's eligibility evidence; it is not enough to
      # say "already approved / already completed" in order_rationale.
      # If order_rationale claims "the object the earlier step produced/approved/completed is used by the later step", there must be
      # a matching dataflow; it is not enough to assert in prose that order matters. Every consumer action_arg must equal the value
      # of a real preceding DB delta.
      # That DB delta must also be the real business effect a preceding tool executed synchronously; merely registering some
      # external event as completed is not a source.
    order_rationale: <English, argued pair by pair — for each adjacent pair "step k before step k+1", give the policy grounds that
      make it so (which basis of which base/extended policy, or which permission/intake doctrine) and the consequence of swapping
      them (how the premise of the earlier step disappears). "Wrong if reordered" is a conclusion, not an argument — every pair
      needs its grounds; confirm at the same time that no edge depends on the passage of real time or on an event outside the
      environment; and carry no shadow of any specific task.>
    prerequisite:                          # required; write [] when there is none. The semantics are exactly as on the
                                           #   extended_policy side: declare WHICH OTHER PROBLEMS MUST BE RESOLVED BEFORE THIS SOP
                                           #   CAN BE RUN, not the step order inside the SOP (that lives in steps and
                                           #   order_rationale).
                                           # The field shape matches extended_policy.prerequisite:
                                           #   problem / kind / gate / condition / policy_source / resolved_by / effect.
      - problem: <category>_ext_<other_key> | <other_workflow_key>
        kind: state_gate | value_input
        gate: <policy_id>.<eligibility_id> | <table>.<field> | <compute_binding_name>
        condition: >-
          <the sentence that must hold before this SOP can be run, verbatim>
        policy_source: >-
          <quoted verbatim from the rule of a policy referenced by one of this workflow's steps, or from the rule of one of its base_policy_refs>
        resolved_by: <task_tool_name> | <workflow_key>
        effect: >-
          <which entry gate of this SOP becomes satisfied once it is resolved, or which compute binding of which step changes to what value>
    # Never write computed_by at the top level of a workflow: a policy must be nested at its exact step, so that the handling time
    # and the GT action are determined.
